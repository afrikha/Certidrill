id: dvac03-1b-ai-code-security-checks
objective: "1.1.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Developers at a company use the Kiro agent to generate Python code for AWS Lambda functions stored in GitHub repositories. The security team requires automatic vulnerability checks at two points: locally, each time the agent writes a Python file, by running the open source scanner that the team already uses; and centrally, on each pull request to the default branch, with an AWS managed scan of the code, the dependencies and the infrastructure as code.

    Which two actions will meet these requirements? (Choose two.)
  fr: |
    Les développeurs d'une entreprise utilisent l'agent Kiro pour générer du code Python pour des fonctions AWS Lambda stockées dans des dépôts GitHub. L'équipe de sécurité exige des contrôles automatiques de vulnérabilités à deux moments : localement, chaque fois que l'agent écrit un fichier Python, en exécutant l'analyseur open source que l'équipe utilise déjà ; et de façon centralisée, à chaque demande d'extraction (pull request) vers la branche par défaut, avec une analyse gérée par AWS du code, des dépendances et de l'infrastructure en tant que code.

    Quelles sont les deux actions qui répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a Kiro hook with a File Save trigger for Python files and a command action that runs the scanner.", fr: "Créer un hook Kiro avec un déclencheur File Save pour les fichiers Python et une action de commande qui exécute l'analyseur." } }
    - { id: b, text: { en: "Add a Kiro steering file that asks the agent to write secure code that follows the OWASP guidelines.", fr: "Ajouter un fichier steering Kiro qui demande à l'agent d'écrire du code sécurisé conforme aux recommandations OWASP." } }
    - { id: c, text: { en: "Activate Amazon Inspector Code Security with a change-based scan configuration on the repositories.", fr: "Activer Amazon Inspector Code Security avec une configuration d'analyse déclenchée par les modifications sur les dépôts." } }
    - { id: d, text: { en: "Turn on code reference tracking in the Kiro settings of each developer.", fr: "Activer le suivi des références de code dans les paramètres Kiro de chaque développeur." } }
    - { id: e, text: { en: "Add the Lambda source folders to a .kiroignore file so that the agent cannot read vulnerable code.", fr: "Ajouter les dossiers source Lambda dans un fichier .kiroignore afin que l'agent ne puisse pas lire de code vulnérable." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A Kiro hook with a File Save trigger runs a shell command automatically each time the agent saves or modifies a matching file, so the existing scanner checks every generated Python file. Amazon Inspector Code Security scans source code, dependencies and infrastructure as code, and a change-based scan configuration runs when a pull request is opened against the default branch.
    fr: |
      Un hook Kiro avec un déclencheur File Save exécute automatiquement une commande shell chaque fois que l'agent enregistre ou modifie un fichier correspondant : l'analyseur existant vérifie chaque fichier Python généré. Amazon Inspector Code Security analyse le code source, les dépendances et l'infrastructure en tant que code, et une configuration d'analyse déclenchée par les modifications s'exécute quand une demande d'extraction est ouverte sur la branche par défaut.
  options:
    b:
      en: "Steering guides what the agent writes but performs no automatic check, so vulnerabilities can still go unnoticed."
      fr: "Le steering oriente ce que l'agent écrit mais n'effectue aucun contrôle automatique : des vulnérabilités peuvent passer inaperçues."
    d:
      en: "Code reference tracking logs suggestions that resemble public code and their source; it does not detect vulnerabilities."
      fr: "Le suivi des références de code journalise les suggestions qui ressemblent à du code public et leur source ; il ne détecte pas de vulnérabilités."
    e:
      en: "Ignoring the source folders stops the agent from working on the functions and does not scan anything."
      fr: "Ignorer les dossiers source empêche l'agent de travailler sur les fonctions et n'analyse rien."
references:
  - title: Hooks
    url: https://kiro.dev/docs/hooks/
  - title: Creating a scan configuration
    url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments-create-configuration.html
