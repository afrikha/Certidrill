id: dvac03-1b-inspector-code-security
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores the source code of its serverless applications in GitHub repositories. In 2026, the company wants to start using an AWS managed service that automatically scans the first-party code, the open source dependencies and the infrastructure as code templates for vulnerabilities whenever a pull request is opened against the default branch. The company has never used AWS code review or code scanning services before.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke le code source de ses applications sans serveur dans des dépôts GitHub. En 2026, l'entreprise veut commencer à utiliser un service géré AWS qui analyse automatiquement le code propriétaire, les dépendances open source et les modèles d'infrastructure en tant que code à la recherche de vulnérabilités chaque fois qu'une demande d'extraction (pull request) est ouverte sur la branche par défaut. L'entreprise n'a encore jamais utilisé de service AWS de revue ou d'analyse de code.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Associate the repositories with Amazon CodeGuru Reviewer and turn on pull request reviews.", fr: "Associer les dépôts à Amazon CodeGuru Reviewer et activer les revues des demandes d'extraction." }
    - id: b
      text: { en: "Create an AWS CodeBuild project that runs the unit tests of each repository when a pull request is opened.", fr: "Créer un projet AWS CodeBuild qui exécute les tests unitaires de chaque dépôt à l'ouverture d'une demande d'extraction." }
    - id: c
      text: { en: "Sign up for Amazon Q Developer and enable its code reviews on the GitHub repositories.", fr: "S'abonner à Amazon Q Developer et activer ses revues de code sur les dépôts GitHub." }
    - id: d
      text: { en: "Activate Amazon Inspector Code Security and apply a scan configuration with change-based scanning to the repositories.", fr: "Activer Amazon Inspector Code Security et appliquer aux dépôts une configuration d'analyse avec analyse déclenchée par les modifications." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Amazon Inspector Code Security scans first-party source code (SAST), third-party dependencies and infrastructure as code. A scan configuration applied to the repositories can trigger scans when a pull request is opened against the default branch and when commits are pushed or merged to it, and Inspector can open pull requests to fix SAST findings.
    fr: |
      Amazon Inspector Code Security analyse le code source propriétaire (SAST), les dépendances tierces et l'infrastructure en tant que code. Une configuration d'analyse appliquée aux dépôts peut déclencher des analyses quand une demande d'extraction est ouverte sur la branche par défaut et quand des commits y sont poussés ou fusionnés, et Inspector peut ouvrir des demandes d'extraction pour corriger les résultats SAST.
  options:
    a:
      en: "Since November 7, 2025, CodeGuru Reviewer does not allow new repository associations; it works only with existing ones."
      fr: "Depuis le 7 novembre 2025, CodeGuru Reviewer n'autorise plus de nouvelles associations de dépôts ; il ne fonctionne qu'avec les associations existantes."
    c:
      en: "Amazon Q Developer closed to new sign-ups on May 15, 2026, so a company that starts in 2026 cannot adopt it."
      fr: "Amazon Q Developer n'accepte plus de nouvelles inscriptions depuis le 15 mai 2026 : une entreprise qui démarre en 2026 ne peut pas l'adopter."
    b:
      en: "Unit tests check behavior; they do not scan code, dependencies and templates for vulnerabilities."
      fr: "Les tests unitaires vérifient le comportement ; ils n'analysent pas le code, les dépendances et les modèles à la recherche de vulnérabilités."
references:
  - title: Amazon Inspector Code Security
    url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments.html
  - title: Creating a scan configuration
    url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments-create-configuration.html
