id: dvac03-1a-sqs-redrive-poison
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Consumers of an Amazon SQS standard queue fail to process some malformed messages. These messages return to the queue after each visibility timeout and are received again and again, which wastes consumer capacity. The company wants to set these messages aside after 5 failed receives so that developers can analyze them later.

    Which solution will meet these requirements?
  fr: |
    Les consommateurs d'une file d'attente Amazon SQS standard n'arrivent pas à traiter certains messages mal formés. Ces messages reviennent dans la file après chaque délai de visibilité et sont reçus encore et encore, ce qui gaspille la capacité des consommateurs. L'entreprise veut mettre ces messages de côté après 5 réceptions en échec pour que les développeurs les analysent plus tard.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the message retention period of the queue to 14 days for analysis.", fr: "Porter la période de conservation des messages de la file à 14 jours pour l'analyse." }
    - id: b
      text: { en: "Increase the visibility timeout of the queue to 12 hours to slow the retries.", fr: "Porter le délai de visibilité de la file à 12 heures pour espacer les nouvelles tentatives." }
    - id: c
      text: { en: "Configure a redrive policy to a dead-letter queue with maxReceiveCount set to 5.", fr: "Configurer une politique de redirection vers une file d'attente de lettres mortes avec maxReceiveCount défini à 5." }
    - id: d
      text: { en: "Enable long polling by setting ReceiveMessageWaitTimeSeconds to 20 seconds.", fr: "Activer l'attente active de longue durée en définissant ReceiveMessageWaitTimeSeconds à 20 secondes." }
answer: { optionId: c }
explanation:
  correct:
    en: "A redrive policy on the source queue names a dead-letter queue and a maxReceiveCount. When a message has been received that many times without being deleted, SQS moves it to the dead-letter queue, where it can be analyzed and later redriven to the source queue."
    fr: "Une politique de redirection sur la file source désigne une file d'attente de lettres mortes et un maxReceiveCount. Quand un message a été reçu ce nombre de fois sans être supprimé, SQS le déplace vers la file de lettres mortes, où il peut être analysé puis redirigé plus tard vers la file source."
  options:
    a:
      en: "A longer retention period keeps the malformed messages cycling through the queue for longer."
      fr: "Une période de conservation plus longue fait tourner les messages mal formés dans la file plus longtemps."
    b:
      en: "A longer visibility timeout only delays each new attempt; the messages still come back and are never set aside."
      fr: "Un délai de visibilité plus long ne fait que retarder chaque nouvelle tentative ; les messages reviennent toujours et ne sont jamais mis de côté."
    d:
      en: "Long polling reduces empty responses; it doesn't change how failed messages are handled."
      fr: "L'attente active de longue durée réduit les réponses vides ; elle ne change pas le traitement des messages en échec."
references:
  - title: Using dead-letter queues in Amazon SQS
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html
