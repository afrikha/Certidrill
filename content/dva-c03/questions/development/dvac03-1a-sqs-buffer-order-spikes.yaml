id: dvac03-1a-sqs-buffer-order-spikes
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs an order website on Amazon EC2 instances. The web tier calls the order-processing service synchronously over HTTP. During sales events, the order-processing service becomes overloaded, the calls time out, and orders are lost. The company wants the web tier to keep accepting orders even when the order-processing service is slow or unavailable.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exécute un site de commande sur des instances Amazon EC2. Le niveau web appelle le service de traitement des commandes de manière synchrone en HTTP. Pendant les soldes, le service de traitement des commandes est surchargé, les appels expirent et des commandes sont perdues. L'entreprise veut que le niveau web continue d'accepter les commandes même lorsque le service de traitement est lent ou indisponible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Place the order-processing instances behind an Application Load Balancer and keep the synchronous HTTP calls.", fr: "Placer les instances de traitement des commandes derrière un Application Load Balancer et conserver les appels HTTP synchrones." }
    - id: b
      text: { en: "Send each order to an Amazon SQS queue that the order-processing service polls, deleting each message after processing.", fr: "Envoyer chaque commande dans une file d'attente Amazon SQS que le service de traitement interroge, en supprimant chaque message après traitement." }
    - id: c
      text: { en: "Increase the HTTP client timeout and the number of retries in the web tier so that each call waits longer.", fr: "Augmenter le délai d'expiration du client HTTP et le nombre de nouvelles tentatives dans le niveau web pour que chaque appel attende plus longtemps." }
    - id: d
      text: { en: "Write each order to an Amazon ElastiCache (Redis OSS) cluster that the order-processing service reads every minute.", fr: "Écrire chaque commande dans un cluster Amazon ElastiCache (Redis OSS) que le service de traitement lit toutes les minutes." }
answer: { optionId: b }
explanation:
  correct:
    en: "An SQS queue decouples the two tiers: the web tier only needs the queue to be available, and messages are stored until the order-processing service can handle them. A message that is not deleted becomes visible again after the visibility timeout, so an order is retried instead of lost if a consumer fails."
    fr: "Une file d'attente SQS découple les deux niveaux : le niveau web a seulement besoin que la file soit disponible, et les messages sont conservés jusqu'à ce que le service de traitement puisse les traiter. Un message qui n'est pas supprimé redevient visible après le délai de visibilité : la commande est retraitée au lieu d'être perdue si un consommateur échoue."
  options:
    a:
      en: "A load balancer spreads the calls but the web tier still waits for the service; when every instance is overloaded, the calls still fail and the orders are lost."
      fr: "Un équilibreur de charge répartit les appels, mais le niveau web attend toujours le service : quand toutes les instances sont surchargées, les appels échouent toujours et les commandes sont perdues."
    c:
      en: "Longer timeouts and more retries keep the tiers tightly coupled and add load on a service that is already overloaded; orders are still lost when the service is down."
      fr: "Des délais plus longs et davantage de nouvelles tentatives laissent les niveaux fortement couplés et ajoutent de la charge à un service déjà surchargé ; les commandes sont toujours perdues quand le service est arrêté."
    d:
      en: "A cache is not a message queue: it has no per-message visibility timeout or redelivery, so the polling, locking and retry logic would have to be written by hand."
      fr: "Un cache n'est pas une file d'attente de messages : il n'a ni délai de visibilité par message ni nouvelle remise, et la logique d'interrogation, de verrouillage et de nouvelle tentative serait à écrire à la main."
references:
  - title: Amazon SQS visibility timeout
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html
