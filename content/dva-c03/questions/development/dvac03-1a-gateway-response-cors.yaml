id: dvac03-1a-gateway-response-cors
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A single-page application on https://app.example.com calls a REST API in Amazon API Gateway on another domain. The Lambda proxy function adds the Access-Control-Allow-Origin header to its responses, and successful calls work. When API Gateway itself rejects a request, for example with a 403 or a 429 error, the browser reports a CORS error and the application can't read the status code. The company wants the application to read these error responses.

    Which solution will meet these requirements?
  fr: |
    Une application monopage sur https://app.example.com appelle une API REST Amazon API Gateway située sur un autre domaine. La fonction de proxy Lambda ajoute l'en-tête Access-Control-Allow-Origin à ses réponses, et les appels réussis fonctionnent. Quand API Gateway lui-même rejette une requête, par exemple avec une erreur 403 ou 429, le navigateur signale une erreur CORS et l'application ne peut pas lire le code d'état. L'entreprise veut que l'application puisse lire ces réponses d'erreur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add the Access-Control-Allow-Origin header to the DEFAULT_4XX gateway response.", fr: "Ajouter l'en-tête Access-Control-Allow-Origin à la réponse de passerelle DEFAULT_4XX." }
    - id: b
      text: { en: "Add the Access-Control-Allow-Origin header to the error responses of the Lambda function.", fr: "Ajouter l'en-tête Access-Control-Allow-Origin aux réponses d'erreur de la fonction Lambda." }
    - id: c
      text: { en: "Add an OPTIONS method with a mock integration that returns the CORS headers.", fr: "Ajouter une méthode OPTIONS avec une intégration fictive (mock) qui renvoie les en-têtes CORS." }
    - id: d
      text: { en: "Enable caching on the stage so that error responses include the cached headers.", fr: "Activer la mise en cache sur l'étape pour que les réponses d'erreur incluent les en-têtes en cache." }
answer: { optionId: a }
explanation:
  correct:
    en: "Errors such as 403 or 429 that API Gateway generates without calling the integration are gateway responses. Adding gatewayresponse.header.Access-Control-Allow-Origin to DEFAULT_4XX adds the CORS header to every 4XX gateway response, so the browser exposes these errors to the application."
    fr: "Les erreurs comme 403 ou 429 générées par API Gateway sans appeler l'intégration sont des réponses de passerelle. Ajouter gatewayresponse.header.Access-Control-Allow-Origin à DEFAULT_4XX ajoute l'en-tête CORS à chaque réponse de passerelle 4XX : le navigateur expose ces erreurs à l'application."
  options:
    b:
      en: "The function isn't invoked when API Gateway rejects the request, so its headers never reach the browser."
      fr: "La fonction n'est pas invoquée quand API Gateway rejette la requête : ses en-têtes n'atteignent jamais le navigateur."
    c:
      en: "An OPTIONS method answers the preflight request; it doesn't add the header to the error responses of the actual request."
      fr: "Une méthode OPTIONS répond à la requête de contrôle préalable ; elle n'ajoute pas l'en-tête aux réponses d'erreur de la requête réelle."
    d:
      en: "Caching stores integration responses for GET methods; it doesn't change the headers of gateway error responses."
      fr: "La mise en cache stocke les réponses d'intégration des méthodes GET ; elle ne modifie pas les en-têtes des réponses d'erreur de la passerelle."
references:
  - title: Gateway responses for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-gatewayResponse-definition.html
  - title: Gateway response types for API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
