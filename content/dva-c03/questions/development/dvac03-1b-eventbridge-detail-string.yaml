id: dvac03-1b-eventbridge-detail-string
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer publishes custom events to an Amazon EventBridge event bus from Python. The call fails with a `ParamValidationError` before any request is sent.

    ```python
    import boto3

    events = boto3.client("events")
    order = {"orderId": "o-42", "status": "PAID", "total": 80}

    events.put_events(Entries=[{
        "EventBusName": "orders-bus",
        "Source": "com.anycompany.orders",
        "DetailType": "OrderPaid",
        "Detail": order,
    }])
    ```

    Which change will fix the code so that rules can match on `detail.status`?
  fr: |
    Un développeur publie des événements personnalisés sur un bus d'événements Amazon EventBridge depuis Python. L'appel échoue avec une `ParamValidationError` avant l'envoi de toute requête.

    ```python
    import boto3

    events = boto3.client("events")
    order = {"orderId": "o-42", "status": "PAID", "total": 80}

    events.put_events(Entries=[{
        "EventBusName": "orders-bus",
        "Source": "com.anycompany.orders",
        "DetailType": "OrderPaid",
        "Detail": order,
    }])
    ```

    Quelle modification corrige le code afin que les règles puissent faire correspondre `detail.status` ?
body:
  options:
    - { id: a, text: "`\"Detail\": json.dumps(order),`" }
    - { id: b, text: "`\"Detail\": str(order),`" }
    - { id: c, text: "`\"Detail\": [order],`" }
    - { id: d, text: "`\"Detail\": base64.b64encode(json.dumps(order).encode()),`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In a PutEvents entry, Detail is a string that must contain a valid JSON object, which can include nested objects. json.dumps (after `import json`) serializes the dictionary to that JSON string, and EventBridge then exposes its fields under detail so that event patterns can match detail.status.
    fr: |
      Dans une entrée PutEvents, Detail est une chaîne qui doit contenir un objet JSON valide, qui peut inclure des objets imbriqués. json.dumps (après `import json`) sérialise le dictionnaire en cette chaîne JSON, et EventBridge expose ensuite ses champs sous detail : les modèles d'événement peuvent faire correspondre detail.status.
  options:
    b:
      en: "str() produces the Python representation with single quotes, which is not valid JSON, so the entry is rejected."
      fr: "str() produit la représentation Python avec des apostrophes simples, qui n'est pas du JSON valide : l'entrée est rejetée."
    c:
      en: "Detail must be a string; a list fails the same parameter validation."
      fr: "Detail doit être une chaîne ; une liste échoue à la même validation de paramètres."
    d:
      en: "Base64 bytes are neither a string parameter nor a JSON object, so rules could not read detail.status."
      fr: "Des octets base64 ne sont ni un paramètre de type chaîne ni un objet JSON : les règles ne pourraient pas lire detail.status."
references:
  - title: PutEventsRequestEntry
    url: https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_PutEventsRequestEntry.html
