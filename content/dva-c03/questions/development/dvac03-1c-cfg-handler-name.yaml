id: dvac03-1c-cfg-handler-name
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer deploys a Python AWS Lambda function as a .zip file archive. The code is in a file named orders.py at the root of the archive and starts with the following definition.

    ```python
    def process(event, context):
        ...
    ```

    The function keeps the console default handler, lambda_function.lambda_handler, and every invocation fails because Lambda cannot import the module.

    Which handler value must the developer configure?
  fr: |
    Un développeur déploie une fonction AWS Lambda en Python sous forme d'archive .zip. Le code se trouve dans un fichier nommé orders.py à la racine de l'archive et commence par la définition suivante.

    ```python
    def process(event, context):
        ...
    ```

    La fonction conserve le gestionnaire par défaut de la console, lambda_function.lambda_handler, et chaque appel échoue, car Lambda ne peut pas importer le module.

    Quelle valeur de gestionnaire le développeur doit-il configurer ?
body:
  options:
    - { id: a, text: "process.orders" }
    - { id: b, text: "orders.process" }
    - { id: c, text: "orders.py.process" }
    - { id: d, text: "lambda_function.process" }
answer: { optionId: b }
explanation:
  correct:
    en: "A Python handler is written as file_name.function_name, without the .py extension. The code is in orders.py and the function is process, so the handler is orders.process."
    fr: "Un gestionnaire Python s'écrit nom_du_fichier.nom_de_la_fonction, sans l'extension .py. Le code se trouve dans orders.py et la fonction s'appelle process : le gestionnaire est orders.process."
  options:
    a:
      en: "The file name comes first and the function name second; this value inverts them."
      fr: "Le nom du fichier vient en premier et le nom de la fonction en second ; cette valeur les inverse."
    c:
      en: "The handler uses the module name without the .py extension."
      fr: "Le gestionnaire utilise le nom du module sans l'extension .py."
    d:
      en: "There is no lambda_function.py file in the archive, so Lambda still cannot import the module."
      fr: "L'archive ne contient aucun fichier lambda_function.py : Lambda ne peut toujours pas importer le module."
references:
  - title: Define Lambda Event Function handler in Python
    url: https://docs.aws.amazon.com/lambda/latest/dg/python-handler.html
