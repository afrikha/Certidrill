id: dvac03-1c-cfg-layer-shared-deps
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 12 Python AWS Lambda functions that are deployed as .zip file archives. Each archive includes the same 30 MB set of data validation libraries, so every library update requires the team to rebuild and redeploy all 12 packages. The team wants to manage the libraries separately from the function code.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany dispose de 12 fonctions AWS Lambda en Python déployées sous forme d'archives .zip. Chaque archive inclut le même ensemble de bibliothèques de validation de données de 30 Mo : chaque mise à jour des bibliothèques oblige l'équipe à reconstruire et à redéployer les 12 packages. L'équipe souhaite gérer les bibliothèques séparément du code des fonctions.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Package the libraries as a Lambda extension in the extensions folder, and add the extension to each function.", fr: "Empaqueter les bibliothèques sous forme d'extension Lambda dans le dossier des extensions, et ajouter l'extension à chaque fonction." } }
    - { id: b, text: { en: "Publish the libraries as a Lambda layer, and add the layer version to each function.", fr: "Publier les bibliothèques sous forme de couche (layer) Lambda, et ajouter la version de la couche à chaque fonction." } }
    - { id: c, text: { en: "Store the libraries in an Amazon S3 bucket, and download them to /tmp in the initialization code of each function.", fr: "Stocker les bibliothèques dans un compartiment Amazon S3, et les télécharger dans /tmp dans le code d'initialisation de chaque fonction." } }
    - { id: d, text: { en: "Convert each function to a container image that includes the libraries, and push the images to Amazon ECR.", fr: "Convertir chaque fonction en image de conteneur qui inclut les bibliothèques, et envoyer les images dans Amazon ECR." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A layer is a .zip archive of dependencies that Lambda extracts into /opt, and it can be shared by several functions in the account. The libraries are then versioned separately from the function code, and each function references a specific layer version."
    fr: "Une couche est une archive .zip de dépendances que Lambda extrait dans /opt, et elle peut être partagée par plusieurs fonctions du compte. Les bibliothèques sont alors versionnées séparément du code des fonctions, et chaque fonction référence une version précise de la couche."
  options:
    a:
      en: "Extensions are companion processes that Lambda starts from /opt/extensions; they are not the mechanism for sharing code libraries."
      fr: "Les extensions sont des processus compagnons que Lambda démarre depuis /opt/extensions ; elles ne servent pas à partager des bibliothèques de code."
    c:
      en: "Downloading the libraries at startup requires custom code in every function and adds latency to each cold start."
      fr: "Télécharger les bibliothèques au démarrage exige du code personnalisé dans chaque fonction et ajoute de la latence à chaque démarrage à froid."
    d:
      en: "Container images cannot use layers, so every library update still means rebuilding and redeploying 12 images."
      fr: "Les images de conteneur ne peuvent pas utiliser de couches : chaque mise à jour des bibliothèques implique toujours de reconstruire et de redéployer 12 images."
references:
  - title: Managing Lambda Event Function dependencies with layers
    url: https://docs.aws.amazon.com/lambda/latest/dg/chapter-layers.html
