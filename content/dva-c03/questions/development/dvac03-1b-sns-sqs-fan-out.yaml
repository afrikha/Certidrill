id: dvac03-1b-sns-sqs-fan-out
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    When a customer places an order, an order service must notify three other services: billing, shipping and analytics. Each service must receive every order, process it at its own pace and keep the orders that arrive while it is temporarily unavailable. The order service must publish each order only once.

    Which solution will meet these requirements?
  fr: |
    Quand un client passe une commande, un service de commandes doit notifier trois autres services : facturation, expédition et analytique. Chaque service doit recevoir chaque commande, la traiter à son propre rythme et conserver les commandes qui arrivent pendant qu'il est temporairement indisponible. Le service de commandes ne doit publier chaque commande qu'une seule fois.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Send each order to one Amazon SQS queue that the three services poll.", fr: "Envoyer chaque commande dans une file d'attente Amazon SQS que les trois services interrogent." }
    - id: b
      text: { en: "Publish each order to an Amazon SNS topic that has an HTTPS subscription for each service.", fr: "Publier chaque commande dans une rubrique Amazon SNS qui a un abonnement HTTPS pour chaque service." }
    - id: c
      text: { en: "Publish each order to an Amazon SNS topic and subscribe one Amazon SQS queue for each service.", fr: "Publier chaque commande dans une rubrique Amazon SNS et abonner une file d'attente Amazon SQS pour chaque service." }
    - id: d
      text: { en: "Invoke the three services synchronously from the order service through Amazon API Gateway.", fr: "Invoquer les trois services de façon synchrone depuis le service de commandes au moyen d'Amazon API Gateway." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In the fan-out pattern, the publisher sends each message once to an SNS topic, and SNS delivers a copy to every subscribed SQS queue. Each queue buffers the orders for its service, which consumes them at its own pace and finds the orders that arrived while it was unavailable.
    fr: |
      Dans le modèle de diffusion (fan-out), l'éditeur envoie chaque message une seule fois à une rubrique SNS, et SNS remet une copie à chaque file d'attente SQS abonnée. Chaque file d'attente met en mémoire tampon les commandes de son service, qui les consomme à son rythme et retrouve les commandes arrivées pendant son indisponibilité.
  options:
    a:
      en: "Consumers of one queue compete for its messages: each order is processed by only one of the three services."
      fr: "Les consommateurs d'une même file d'attente se disputent ses messages : chaque commande n'est traitée que par l'un des trois services."
    b:
      en: "HTTPS subscriptions push messages to the services and do not buffer them, so a service that is down for a long time can miss orders."
      fr: "Les abonnements HTTPS poussent les messages vers les services sans les mettre en mémoire tampon : un service indisponible longtemps peut manquer des commandes."
    d:
      en: "Synchronous calls couple the order service to each consumer, and orders fail when a service is unavailable."
      fr: "Les appels synchrones couplent le service de commandes à chaque consommateur, et les commandes échouent quand un service est indisponible."
references:
  - title: Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
