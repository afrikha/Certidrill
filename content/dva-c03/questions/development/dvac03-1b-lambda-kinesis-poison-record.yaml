id: dvac03-1b-lambda-kinesis-poison-record
objective: "1.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A logistics company uses an AWS Lambda function with an event source mapping to process an Amazon Kinesis data stream that has a 24-hour retention period. The mapping uses default error handling. One malformed record makes the function fail, and the shard stops progressing until the record expires. The company wants the other records of a failing batch to be processed, a failing record to be skipped after a few attempts, and the full content of each skipped record to be kept for analysis after the stream retention period ends.

    Which combination of event source mapping settings will meet these requirements? (Choose three.)
  fr: |
    Une entreprise de logistique utilise une fonction AWS Lambda avec un mappage de source d'événements pour traiter un flux de données Amazon Kinesis dont la période de conservation est de 24 heures. Le mappage utilise la gestion des erreurs par défaut. Un enregistrement mal formé fait échouer la fonction, et la partition (shard) cesse de progresser jusqu'à l'expiration de l'enregistrement. L'entreprise veut que les autres enregistrements d'un lot en échec soient traités, qu'un enregistrement en échec soit ignoré après quelques tentatives, et que le contenu complet de chaque enregistrement ignoré soit conservé pour analyse après la fin de la période de conservation du flux.

    Quelle combinaison de paramètres du mappage de source d'événements répond à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Set BisectBatchOnFunctionError to true.", fr: "Définir BisectBatchOnFunctionError sur true." } }
    - { id: b, text: { en: "Set MaximumRetryAttempts to 2.", fr: "Définir MaximumRetryAttempts sur 2." } }
    - { id: c, text: { en: "Configure an Amazon S3 bucket as the on-failure destination.", fr: "Configurer un compartiment Amazon S3 comme destination en cas d'échec." } }
    - { id: d, text: { en: "Configure an Amazon SQS queue as the on-failure destination.", fr: "Configurer une file d'attente Amazon SQS comme destination en cas d'échec." } }
    - { id: e, text: { en: "Set ParallelizationFactor to 10.", fr: "Définir ParallelizationFactor sur 10." } }
    - { id: f, text: { en: "Set MaximumRecordAgeInSeconds to -1.", fr: "Définir MaximumRecordAgeInSeconds sur -1." } }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |
      BisectBatchOnFunctionError splits a failed batch in half and retries each half, which isolates the malformed record so that the other records are processed. MaximumRetryAttempts limits the retries (the default -1 retries until the record expires). For an S3 on-failure destination, Lambda sends the entire invocation record with the metadata, so the skipped data survives the stream retention period.
    fr: |
      BisectBatchOnFunctionError divise un lot en échec en deux et retente chaque moitié, ce qui isole l'enregistrement mal formé afin que les autres enregistrements soient traités. MaximumRetryAttempts limite les nouvelles tentatives (la valeur par défaut -1 retente jusqu'à l'expiration de l'enregistrement). Pour une destination en cas d'échec S3, Lambda envoie l'enregistrement d'invocation complet avec les métadonnées : les données ignorées survivent à la période de conservation du flux.
  options:
    d:
      en: "For SQS and SNS destinations, Lambda sends only metadata (stream ARN, shard ID, sequence numbers); the records themselves are lost when the stream retention ends."
      fr: "Pour les destinations SQS et SNS, Lambda n'envoie que des métadonnées (ARN du flux, ID de partition, numéros de séquence) ; les enregistrements eux-mêmes sont perdus à la fin de la conservation du flux."
    e:
      en: "More concurrent batches per shard do not stop a failing batch from being retried, so the bad record still blocks its batch."
      fr: "Davantage de lots simultanés par partition n'empêchent pas un lot en échec d'être retenté : l'enregistrement défectueux bloque toujours son lot."
    f:
      en: "-1 is the default value and means that Lambda never discards records based on age, which does not skip the failing record."
      fr: "-1 est la valeur par défaut et signifie que Lambda n'écarte jamais d'enregistrements en fonction de leur âge, ce qui n'ignore pas l'enregistrement en échec."
references:
  - title: Retain discarded batch records for a Kinesis Data Streams event source in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/kinesis-on-failure-destination.html
  - title: Lambda parameters for Amazon Kinesis Data Streams event source mappings
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-parameters.html
