id: dvac03-1a-retry-practices
objective: "1.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A developer writes a client that signs and sends requests to an AWS service API directly over HTTPS, without an AWS SDK. The client must handle transient failures and throttling without overloading the service.

    Which three practices should the developer apply? (Choose three.)

    Each correct answer presents part of the solution.
  fr: |
    Un développeur écrit un client qui signe et envoie des requêtes à l'API d'un service AWS directement en HTTPS, sans kit SDK AWS. Le client doit gérer les échecs transitoires et la limitation sans surcharger le service.

    Quelles sont les trois pratiques que le développeur doit appliquer ? (Choisissez-en trois.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Retry throttling errors and HTTP 5xx errors with exponential backoff.", fr: "Relancer les erreurs de limitation et les erreurs HTTP 5xx avec un backoff exponentiel." } }
    - { id: b, text: { en: "Retry ValidationException and AccessDeniedException errors the same way as throttling errors.", fr: "Relancer les erreurs ValidationException et AccessDeniedException de la même façon que les erreurs de limitation." } }
    - { id: c, text: { en: "Add random jitter to each retry delay.", fr: "Ajouter une gigue (jitter) aléatoire à chaque délai de nouvelle tentative." } }
    - { id: d, text: { en: "Retry immediately after each failure to minimize latency.", fr: "Réessayer immédiatement après chaque échec pour réduire la latence." } }
    - { id: e, text: { en: "Retry each request until it succeeds, with no maximum number of attempts.", fr: "Réessayer chaque requête jusqu'à ce qu'elle réussisse, sans nombre maximal de tentatives." } }
    - { id: f, text: { en: "Make the retried operations idempotent so that a repeated request has no extra effect.", fr: "Rendre les opérations relancées idempotentes pour qu'une requête répétée n'ait pas d'effet supplémentaire." } }
answer: { optionIds: [ a, c, f ] }
explanation:
  correct:
    en: "AWS SDKs retry transient and throttling errors with exponential backoff and full jitter, which a custom client should reproduce. Retries are safe only for idempotent operations, because a request that timed out may already have been applied."
    fr: "Les kits SDK AWS relancent les erreurs transitoires et de limitation avec un backoff exponentiel et une gigue complète, ce qu'un client spécifique doit reproduire. Les nouvelles tentatives ne sont sûres que pour des opérations idempotentes, car une requête expirée a peut-être déjà été appliquée."
  options:
    b:
      en: "Validation and access errors are not retryable: the same request fails again until the request or the permissions change."
      fr: "Les erreurs de validation et d'accès ne doivent pas être relancées : la même requête échoue de nouveau tant que la requête ou les autorisations ne changent pas."
    d:
      en: "Immediate retries add load at the moment the service is failing or throttling, which makes recovery slower."
      fr: "Des nouvelles tentatives immédiates ajoutent de la charge au moment où le service échoue ou applique une limitation, ce qui ralentit son rétablissement."
    e:
      en: "Unlimited retries can overload the service and hold the caller forever; retries need a maximum number of attempts."
      fr: "Des nouvelles tentatives illimitées peuvent surcharger le service et bloquer l'appelant indéfiniment ; il faut un nombre maximal de tentatives."
references:
  - title: Retry behavior
    url: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html
  - title: Retry with backoff pattern
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html
