id: dvac03-1a-validation-error-detail
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A REST API in Amazon API Gateway validates request bodies with a model and a request validator. Invalid requests receive a 400 response whose body is `{"message": "Invalid request body"}`. Client developers want the response to explain which part of the body failed validation. The company doesn't want the backend to be invoked for invalid requests.

    Which solution will meet these requirements?
  fr: |
    Une API REST d'Amazon API Gateway valide les corps de requête avec un modèle et un validateur de requête. Les requêtes non valides reçoivent une réponse 400 dont le corps est `{"message": "Invalid request body"}`. Les développeurs clients veulent que la réponse indique quelle partie du corps a échoué à la validation. L'entreprise ne veut pas que le backend soit invoqué pour les requêtes non valides.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an integration response mapping template that includes `$input.body` in the 400 response.", fr: "Ajouter un modèle de mappage de réponse d'intégration qui inclut `$input.body` dans la réponse 400." }
    - id: b
      text: { en: "Enable CloudWatch execution logging on the stage and send the log entries to the client developers.", fr: "Activer la journalisation d'exécution CloudWatch sur l'étape et transmettre les entrées de journal aux développeurs clients." }
    - id: c
      text: { en: "Customize the DEFAULT_5XX gateway response template to include `$context.error.message`.", fr: "Personnaliser le modèle de la réponse de passerelle DEFAULT_5XX pour inclure `$context.error.message`." }
    - id: d
      text: { en: "Customize the BAD_REQUEST_BODY gateway response template to include `$context.error.validationErrorString`.", fr: "Personnaliser le modèle de la réponse de passerelle BAD_REQUEST_BODY pour inclure `$context.error.validationErrorString`." }
answer: { optionId: d }
explanation:
  correct:
    en: "When an enabled request validator rejects the body, API Gateway returns the BAD_REQUEST_BODY gateway response (400) without calling the integration. Its template can use $context.error.validationErrorString, which contains the detailed validation error message."
    fr: "Quand un validateur de requête activé rejette le corps, API Gateway renvoie la réponse de passerelle BAD_REQUEST_BODY (400) sans appeler l'intégration. Son modèle peut utiliser $context.error.validationErrorString, qui contient le message d'erreur de validation détaillé."
  options:
    a:
      en: "Validation fails before the integration request, so no integration response or its template is used."
      fr: "La validation échoue avant la demande d'intégration : aucune réponse d'intégration ni son modèle ne sont utilisés."
    b:
      en: "Execution logs record the validation results for the API owner; they don't change the response that clients receive."
      fr: "Les journaux d'exécution enregistrent les résultats de validation pour le propriétaire de l'API ; ils ne modifient pas la réponse que reçoivent les clients."
    c:
      en: "A failed body validation returns a 4XX gateway response, so changing DEFAULT_5XX has no effect on it."
      fr: "Un échec de validation du corps renvoie une réponse de passerelle 4XX : modifier DEFAULT_5XX n'a aucun effet."
references:
  - title: Gateway response types for API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
  - title: Variables for data transformations for API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-mapping-template-reference.html
