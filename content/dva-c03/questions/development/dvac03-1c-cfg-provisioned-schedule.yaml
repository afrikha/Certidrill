id: dvac03-1c-cfg-provisioned-schedule
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's customer portal calls an AWS Lambda function through an alias named live. The function's initialization code loads large reference files, and users complain about slow responses when the offices open. Traffic is predictable: steady from 08:00 to 18:00 on weekdays and close to zero at night and on weekends. The company wants to remove initialization latency during business hours.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Le portail client d'une entreprise appelle une fonction AWS Lambda par un alias nommé live. Le code d'initialisation de la fonction charge de gros fichiers de référence, et les utilisateurs se plaignent de réponses lentes à l'ouverture des bureaux. Le trafic est prévisible : stable de 08 h 00 à 18 h 00 en semaine et proche de zéro la nuit et le week-end. L'entreprise souhaite supprimer la latence d'initialisation pendant les heures ouvrées.

    Quelle solution répond à ces exigences de la manière la PLUS économique ?
body:
  options:
    - { id: a, text: { en: "Configure provisioned concurrency at the peak level on the $LATEST version of the function, 24 hours a day.", fr: "Configurer la simultanéité provisionnée au niveau de pointe sur la version $LATEST de la fonction, 24 heures sur 24." } }
    - { id: b, text: { en: "Configure provisioned concurrency on the live alias, and add Application Auto Scaling scheduled actions for business hours.", fr: "Configurer la simultanéité provisionnée sur l'alias live, et ajouter des actions planifiées Application Auto Scaling pour les heures ouvrées." } }
    - { id: c, text: { en: "Configure reserved concurrency equal to the peak concurrency of the function, and keep it 24 hours a day.", fr: "Configurer une simultanéité réservée égale à la simultanéité de pointe de la fonction, et la conserver 24 heures sur 24." } }
    - { id: d, text: { en: "Configure provisioned concurrency at the peak level on the live alias, and keep it 24 hours a day.", fr: "Configurer la simultanéité provisionnée au niveau de pointe sur l'alias live, et la conserver 24 heures sur 24." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Provisioned concurrency keeps initialized environments ready, so requests do not wait for the initialization code. It must target a version or an alias and is billed while it is allocated, so scheduled scaling with Application Auto Scaling pays for it only during business hours."
    fr: "La simultanéité provisionnée garde des environnements initialisés prêts : les requêtes n'attendent pas le code d'initialisation. Elle doit cibler une version ou un alias et elle est facturée tant qu'elle est allouée : la mise à l'échelle planifiée avec Application Auto Scaling ne la fait payer que pendant les heures ouvrées."
  options:
    a:
      en: "Provisioned concurrency cannot be configured on $LATEST, and keeping the peak level all night and on weekends wastes money."
      fr: "La simultanéité provisionnée ne peut pas être configurée sur $LATEST, et garder le niveau de pointe la nuit et le week-end gaspille de l'argent."
    c:
      en: "Reserved concurrency guarantees and caps concurrency but does not pre-initialize environments, so the initialization latency remains."
      fr: "La simultanéité réservée garantit et plafonne la simultanéité, mais ne pré-initialise pas d'environnements : la latence d'initialisation demeure."
    d:
      en: "This removes the latency but pays for the peak level around the clock, which is not the most cost-effective option."
      fr: "Cette solution supprime la latence, mais paie le niveau de pointe en permanence, ce qui n'est pas l'option la plus économique."
references:
  - title: Configuring provisioned concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
