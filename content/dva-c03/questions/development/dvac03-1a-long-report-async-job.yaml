id: dvac03-1a-long-report-async-job
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company exposes an Amazon API Gateway REST API with a Lambda proxy integration. A new endpoint generates a PDF report that takes 3–8 minutes. Clients receive 504 errors, although the Lambda function finishes successfully. Clients don't need the report in the same response and can check back later.

    Which solution will meet these requirements?
  fr: |
    Une entreprise expose une API REST Amazon API Gateway avec une intégration de proxy Lambda. Un nouveau point de terminaison génère un rapport PDF en 3 à 8 minutes. Les clients reçoivent des erreurs 504, alors que la fonction Lambda se termine avec succès. Les clients n'ont pas besoin du rapport dans la même réponse et peuvent revenir le chercher plus tard.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Raise the Lambda function timeout to 15 minutes and its memory to the maximum value.", fr: "Porter le délai d'expiration de la fonction Lambda à 15 minutes et sa mémoire à la valeur maximale." }
    - id: b
      text: { en: "Enable API caching on the stage so that repeated requests return the cached report.", fr: "Activer la mise en cache d'API sur l'étape (stage) pour que les requêtes répétées renvoient le rapport en cache." }
    - id: c
      text: { en: "Queue each request in Amazon SQS, return a job ID at once, and add a status endpoint.", fr: "Placer chaque requête dans Amazon SQS, renvoyer immédiatement un ID de tâche et ajouter un point de terminaison d'état." }
    - id: d
      text: { en: "Configure provisioned concurrency on the Lambda function to remove cold-start delays.", fr: "Configurer la simultanéité provisionnée sur la fonction Lambda pour supprimer les délais de démarrage à froid." }
answer: { optionId: c }
explanation:
  correct:
    en: "The function works, but the synchronous request is held longer than the API Gateway integration timeout. Because clients can check back later, an asynchronous pattern fits: the API accepts the request and returns a job ID, a worker processes the queued request, and clients read the status and the report location from a status endpoint."
    fr: "La fonction fonctionne, mais la requête synchrone est maintenue plus longtemps que le délai d'expiration de l'intégration API Gateway. Comme les clients peuvent revenir plus tard, un modèle asynchrone convient : l'API accepte la requête et renvoie un ID de tâche, un processus de traitement traite la requête mise en file, et les clients lisent l'état et l'emplacement du rapport via un point de terminaison d'état."
  options:
    a:
      en: "The function already finishes; the 504 comes from API Gateway, whose integration timeout is still shorter than a run of several minutes."
      fr: "La fonction se termine déjà ; l'erreur 504 vient d'API Gateway, dont le délai d'expiration d'intégration reste plus court qu'une exécution de plusieurs minutes."
    b:
      en: "Caching only helps for repeated identical requests; the first request for each report still times out."
      fr: "La mise en cache n'aide que pour des requêtes identiques répétées ; la première requête de chaque rapport expire toujours."
    d:
      en: "Provisioned concurrency removes initialization time, not the minutes of report generation."
      fr: "La simultanéité provisionnée supprime le temps d'initialisation, pas les minutes de génération du rapport."
references:
  - title: Quotas for configuring and running a REST API in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-execution-service-limits-table.html
  - title: Integrate Amazon API Gateway with Amazon SQS to handle asynchronous REST APIs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/integrate-amazon-api-gateway-with-amazon-sqs-to-handle-asynchronous-rest-apis.html
