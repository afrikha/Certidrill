id: dvac03-1c-life-object-lock-compliance
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A trading application stores trade confirmations as objects in a new Amazon S3 bucket. Each confirmation must be immutable for 7 years: no user, including the AWS account root user, can overwrite or delete it during that period. After 7 years, the company must be able to delete it.

    Which solution will meet these requirements?
  fr: |
    Une application de négoce stocke des confirmations de transactions sous forme d'objets dans un nouveau compartiment Amazon S3. Chaque confirmation doit être immuable pendant 7 ans : aucun utilisateur, y compris l'utilisateur root du compte AWS, ne peut la remplacer ni la supprimer pendant cette période. Après 7 ans, l'entreprise doit pouvoir la supprimer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable S3 Object Lock on the bucket with a default retention period of 7 years in compliance mode.", fr: "Activer S3 Object Lock sur le compartiment avec une période de conservation par défaut de 7 ans en mode conformité (compliance)." } }
    - { id: b, text: { en: "Enable S3 Object Lock on the bucket with a default retention period of 7 years in governance mode.", fr: "Activer S3 Object Lock sur le compartiment avec une période de conservation par défaut de 7 ans en mode gouvernance (governance)." } }
    - { id: c, text: { en: "Enable S3 Object Lock on the bucket, and place a legal hold on each object when it is written.", fr: "Activer S3 Object Lock sur le compartiment, et placer une conservation légale (legal hold) sur chaque objet lors de son écriture." } }
    - { id: d, text: { en: "Add a bucket policy that denies s3:DeleteObject, and add an S3 Lifecycle rule that expires objects after 7 years.", fr: "Ajouter une politique de compartiment qui refuse s3:DeleteObject, et ajouter une règle S3 Lifecycle qui fait expirer les objets après 7 ans." } }
answer: { optionId: a }
explanation:
  correct:
    en: "In compliance mode, a protected object version cannot be overwritten or deleted by any user, including the root user, and its retention period cannot be shortened. After the retain-until date, the version can be deleted. Object Lock requires S3 Versioning, which is enabled on the bucket together with Object Lock."
    fr: "En mode conformité, une version d'objet protégée ne peut être remplacée ni supprimée par aucun utilisateur, y compris l'utilisateur root, et sa période de conservation ne peut pas être raccourcie. Après la date de fin de conservation, la version peut être supprimée. Object Lock exige la gestion des versions S3, activée sur le compartiment avec Object Lock."
  options:
    b:
      en: "In governance mode, users with s3:BypassGovernanceRetention can delete protected versions by sending the bypass header."
      fr: "En mode gouvernance, les utilisateurs disposant de s3:BypassGovernanceRetention peuvent supprimer les versions protégées en envoyant l'en-tête de contournement."
    c:
      en: "A legal hold has no expiration date and can be removed by any user with s3:PutObjectLegalHold, so it does not enforce a 7-year period."
      fr: "Une conservation légale n'a pas de date d'expiration et peut être retirée par tout utilisateur disposant de s3:PutObjectLegalHold : elle n'impose pas une période de 7 ans."
    d:
      en: "A bucket policy can be changed or removed by an administrator or the root user, so the objects are not immutable."
      fr: "Une politique de compartiment peut être modifiée ou supprimée par un administrateur ou par l'utilisateur root : les objets ne sont pas immuables."
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
