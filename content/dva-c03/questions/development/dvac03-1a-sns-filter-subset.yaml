id: dvac03-1a-sns-filter-subset
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company publishes order events to an Amazon SNS topic. Each event has a message attribute named region. An Amazon SQS queue for the European fulfillment service is subscribed to the topic and must receive only the events whose region is EU. The company doesn't want to change the publisher or add filtering code to the consumer.

    Which solution will meet these requirements?
  fr: |
    Une entreprise publie des événements de commande dans une rubrique Amazon SNS. Chaque événement possède un attribut de message nommé region. Une file d'attente Amazon SQS du service de traitement européen est abonnée à la rubrique et ne doit recevoir que les événements dont region vaut EU. L'entreprise ne veut ni modifier l'éditeur ni ajouter de code de filtrage dans le consommateur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a filter policy to the queue's subscription that matches the value EU in the region attribute.", fr: "Ajouter à l'abonnement de la file une politique de filtre qui correspond à la valeur EU de l'attribut region." }
    - id: b
      text: { en: "Create one SNS topic per region and have the publisher send each event to the matching topic.", fr: "Créer une rubrique SNS par région et faire envoyer chaque événement à la rubrique correspondante par l'éditeur." }
    - id: c
      text: { en: "Add a condition on the region attribute to the access policy of the queue.", fr: "Ajouter une condition sur l'attribut region à la politique d'accès de la file." }
    - id: d
      text: { en: "Configure the consumer to delete the messages whose region attribute is not EU.", fr: "Configurer le consommateur pour qu'il supprime les messages dont l'attribut region n'est pas EU." }
answer: { optionId: a }
explanation:
  correct:
    en: "A filter policy is set on a topic subscription. SNS delivers a message to that subscriber only if the message matches the policy, so the queue receives only the EU events while the publisher and the other subscribers stay unchanged."
    fr: "Une politique de filtre se définit sur un abonnement à une rubrique. SNS ne remet un message à cet abonné que s'il correspond à la politique : la file ne reçoit que les événements EU, et l'éditeur comme les autres abonnés restent inchangés."
  options:
    b:
      en: "One topic per region requires changing the publisher, which the company wants to avoid."
      fr: "Une rubrique par région impose de modifier l'éditeur, ce que l'entreprise veut éviter."
    c:
      en: "A queue access policy controls who can send to the queue; it doesn't filter messages on their attributes."
      fr: "Une politique d'accès de file contrôle qui peut envoyer dans la file ; elle ne filtre pas les messages selon leurs attributs."
    d:
      en: "Discarding messages in the consumer is filtering code, which the company doesn't want to add."
      fr: "Écarter les messages dans le consommateur revient à écrire du code de filtrage, ce que l'entreprise ne veut pas ajouter."
references:
  - title: Amazon SNS message filtering
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-message-filtering.html
