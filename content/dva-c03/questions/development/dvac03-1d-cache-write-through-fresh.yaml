id: dvac03-1d-cache-write-through-fresh
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's account service stores user settings in an Amazon Aurora MySQL database and caches them in Amazon ElastiCache (Valkey) by using lazy loading with a 1-hour TTL. Users complain that after they save new settings, the settings page still shows the old values. Every read must continue to be served from the cache with low latency.

    The next read after an update must return the new settings.

    Which solution will meet these requirements?
  fr: |
    Le service de comptes d'AnyCompany stocke les paramètres des utilisateurs dans une base Amazon Aurora MySQL et les met en cache dans Amazon ElastiCache (Valkey) par chargement différé (lazy loading) avec un TTL d'une heure. Des utilisateurs se plaignent qu'après avoir enregistré de nouveaux paramètres, la page des paramètres affiche toujours les anciennes valeurs. Chaque lecture doit continuer à être servie par le cache avec une faible latence.

    La lecture qui suit une mise à jour doit renvoyer les nouveaux paramètres.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "After each successful database update, write the updated settings to the cache in the same code path, and keep a TTL on the key.", fr: "Après chaque mise à jour réussie de la base, écrire les paramètres modifiés dans le cache dans le même chemin de code, en gardant un TTL sur la clé." } }
    - { id: b, text: { en: "Reduce the TTL of the cached settings from 1 hour to 5 seconds.", fr: "Réduire le TTL des paramètres en cache d'une heure à 5 secondes." } }
    - { id: c, text: { en: "Read the settings from an Aurora Replica through the reader endpoint for one minute after each update.", fr: "Lire les paramètres sur un réplica Aurora via le point de terminaison lecteur pendant une minute après chaque mise à jour." } }
    - { id: d, text: { en: "Replace the Valkey cluster with an Amazon ElastiCache (Memcached) cluster that uses the same lazy-loading logic.", fr: "Remplacer le cluster Valkey par un cluster Amazon ElastiCache (Memcached) qui utilise la même logique de chargement différé." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With write-through, the application updates the cache every time it writes the data to the database, so the cached settings are never stale after an update and reads keep hitting the cache. Keeping a TTL limits cache churn for settings that are written but rarely read, and lazy loading still fills entries that expire.
    fr: |
      Avec l'écriture simultanée (write-through), l'application met à jour le cache chaque fois qu'elle écrit les données dans la base : les paramètres en cache ne sont jamais obsolètes après une mise à jour, et les lectures continuent d'atteindre le cache. Garder un TTL limite le renouvellement inutile du cache (cache churn) pour des paramètres écrits mais rarement lus, et le chargement différé remplit toujours les entrées expirées.
  options:
    b: { en: "A 5-second TTL still returns stale values for up to 5 seconds after an update and sends far more reads to the database.", fr: "Un TTL de 5 secondes renvoie encore des valeurs obsolètes jusqu'à 5 secondes après une mise à jour et envoie beaucoup plus de lectures à la base." }
    c: { en: "Reads from a replica bypass the cache, and replica lag can still return the old values.", fr: "Les lectures sur un réplica contournent le cache, et le retard du réplica peut encore renvoyer les anciennes valeurs." }
    d: { en: "The engine does not cause the stale reads; lazy loading never updates the cache on writes, whatever the engine.", fr: "Le moteur n'est pas la cause des lectures obsolètes ; le chargement différé ne met jamais le cache à jour lors des écritures, quel que soit le moteur." }
references:
  - title: Caching strategies for Memcached
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
