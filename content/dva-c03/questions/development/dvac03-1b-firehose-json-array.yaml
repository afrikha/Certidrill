id: dvac03-1b-firehose-json-array
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an Amazon Data Firehose stream with record format conversion to write Apache Parquet files to Amazon S3. The stream uses the OpenX JSON SerDe and an AWS Glue Data Catalog table that matches the event fields. A partner application sends each record as a JSON array of events, such as `[{"id": 1, "type": "view"}, {"id": 2, "type": "click"}]`, and all these records fail conversion. The partner cannot change its application.

    Which solution will make the partner records convert successfully?
  fr: |
    Une entreprise utilise un flux Amazon Data Firehose avec conversion du format des enregistrements pour écrire des fichiers Apache Parquet dans Amazon S3. Le flux utilise l'OpenX JSON SerDe et une table du catalogue de données AWS Glue qui correspond aux champs des événements. Une application partenaire envoie chaque enregistrement sous forme de tableau JSON d'événements, comme `[{"id": 1, "type": "view"}, {"id": 2, "type": "click"}]`, et tous ces enregistrements échouent à la conversion. Le partenaire ne peut pas modifier son application.

    Quelle solution permet de convertir correctement les enregistrements du partenaire ?
body:
  options:
    - id: a
      text: { en: "Replace the OpenX JSON SerDe with the Apache Hive JSON SerDe as the deserializer of the stream.", fr: "Remplacer l'OpenX JSON SerDe par l'Apache Hive JSON SerDe comme désérialiseur du flux." }
    - id: b
      text: { en: "Change the Glue table so that the root column is an ARRAY of STRUCT values that match the event fields.", fr: "Modifier la table Glue afin que la colonne racine soit un ARRAY de valeurs STRUCT qui correspondent aux champs des événements." }
    - id: c
      text: { en: "Add a Lambda transformation that rewrites each array as JSON objects concatenated one after the other.", fr: "Ajouter une transformation Lambda qui réécrit chaque tableau sous forme d'objets JSON concaténés les uns après les autres." }
    - id: d
      text: { en: "Replace the Parquet SerDe with the ORC SerDe as the serializer of the stream.", fr: "Remplacer le SerDe Parquet par le SerDe ORC comme sérialiseur du flux." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For record format conversion, a Firehose record can contain several JSON objects concatenated one after another, but the input must not be a JSON array. A Lambda transformation runs before the conversion, so it can turn each array into concatenated objects that the deserializer and the existing schema accept, without any change on the partner side.
    fr: |
      Pour la conversion du format des enregistrements, un enregistrement Firehose peut contenir plusieurs objets JSON concaténés les uns après les autres, mais l'entrée ne doit pas être un tableau JSON. Une transformation Lambda s'exécute avant la conversion : elle peut transformer chaque tableau en objets concaténés que le désérialiseur et le schéma existant acceptent, sans aucun changement côté partenaire.
  options:
    a:
      en: "The rule against JSON arrays applies to the input of the conversion whatever the deserializer; the Hive SerDe mainly changes how timestamps are parsed."
      fr: "La règle contre les tableaux JSON s'applique à l'entrée de la conversion quel que soit le désérialiseur ; le SerDe Hive change surtout l'analyse des horodatages."
    b:
      en: "The schema describes the fields of a JSON object; changing it does not make a top-level array a valid input for the conversion."
      fr: "Le schéma décrit les champs d'un objet JSON ; le modifier ne fait pas d'un tableau de premier niveau une entrée valide pour la conversion."
    d:
      en: "The serializer chooses the output format; the failure happens when the JSON input is read, so ORC fails the same way."
      fr: "Le sérialiseur choisit le format de sortie ; l'échec se produit à la lecture de l'entrée JSON : ORC échoue de la même façon."
references:
  - title: Convert input data format in Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/record-format-conversion.html
  - title: Transform source data in Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/data-transformation.html
