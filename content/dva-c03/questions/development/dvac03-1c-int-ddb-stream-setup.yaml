id: dvac03-1c-int-ddb-stream-setup
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function must run every time an item in an Amazon DynamoDB table named Customers changes. For each change, the function compares the previous value and the new value of the email attribute. The table does not have a stream yet.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une fonction AWS Lambda doit s'exécuter chaque fois qu'un élément d'une table Amazon DynamoDB nommée Customers change. Pour chaque modification, la fonction compare l'ancienne et la nouvelle valeur de l'attribut email. La table n'a pas encore de flux.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a statement to the function's resource-based policy that allows dynamodb.amazonaws.com to invoke the function on each change.", fr: "Ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise dynamodb.amazonaws.com à appeler la fonction à chaque modification." } }
    - { id: b, text: { en: "Turn on DynamoDB Streams for the table with the NEW_AND_OLD_IMAGES view type.", fr: "Activer DynamoDB Streams pour la table avec le type de vue NEW_AND_OLD_IMAGES." } }
    - { id: c, text: { en: "Turn on time to live (TTL) for the table on the email attribute so that changes are sent to the function.", fr: "Activer la durée de vie (TTL) de la table sur l'attribut email afin que les modifications soient envoyées à la fonction." } }
    - { id: d, text: { en: "Turn on DynamoDB Streams for the table with the KEYS_ONLY view type to reduce the size of each record.", fr: "Activer DynamoDB Streams pour la table avec le type de vue KEYS_ONLY afin de réduire la taille de chaque enregistrement." } }
    - { id: e, text: { en: "Create an event source mapping for the stream, and attach AWSLambdaDynamoDBExecutionRole to the execution role.", fr: "Créer un mappage de source d'événements pour le flux, et attacher AWSLambdaDynamoDBExecutionRole au rôle d'exécution." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "The NEW_AND_OLD_IMAGES view type puts both the old and the new item images in each stream record, which the comparison needs. Lambda polls the stream through an event source mapping by using the execution role, which needs dynamodb:DescribeStream, GetRecords, GetShardIterator and ListStreams, as granted by AWSLambdaDynamoDBExecutionRole."
    fr: "Le type de vue NEW_AND_OLD_IMAGES place l'ancienne et la nouvelle image de l'élément dans chaque enregistrement du flux, ce dont la comparaison a besoin. Lambda interroge le flux par un mappage de source d'événements à l'aide du rôle d'exécution, qui a besoin de dynamodb:DescribeStream, GetRecords, GetShardIterator et ListStreams, accordées par AWSLambdaDynamoDBExecutionRole."
  options:
    a:
      en: "DynamoDB does not push to the function; Lambda reads the stream with the execution role, so a resource-based policy is not used."
      fr: "DynamoDB n'envoie rien à la fonction ; Lambda lit le flux avec le rôle d'exécution : une politique basée sur les ressources n'est pas utilisée."
    c:
      en: "TTL deletes expired items; it does not deliver item changes to the function."
      fr: "La TTL supprime les éléments expirés ; elle ne transmet pas les modifications d'éléments à la fonction."
    d:
      en: "KEYS_ONLY records contain only the key attributes, so the old and new email values are missing."
      fr: "Les enregistrements KEYS_ONLY ne contiennent que les attributs de clé : l'ancienne et la nouvelle valeur d'email manquent."
references:
  - title: AWSLambdaDynamoDBExecutionRole
    url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaDynamoDBExecutionRole.html
  - title: "Tutorial: Using AWS Lambda with Amazon DynamoDB streams"
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-ddb-example.html
