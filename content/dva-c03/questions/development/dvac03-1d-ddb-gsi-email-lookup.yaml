id: dvac03-1d-ddb-gsi-email-lookup
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's Users table in Amazon DynamoDB has the partition key UserId and is in production. A new sign-in feature must find a user by the Email attribute, which is not part of the primary key. Eventually consistent results are acceptable. The table must remain available while the change is made, and each lookup must not read the whole table.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    La table Users d'AnyCompany dans Amazon DynamoDB a la clé de partition UserId et est en production. Une nouvelle fonction de connexion doit trouver un utilisateur par l'attribut Email, qui ne fait pas partie de la clé primaire. Des résultats à cohérence éventuelle sont acceptables. La table doit rester disponible pendant la modification, et chaque recherche ne doit pas lire toute la table.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Call UpdateTable to add a global secondary index with Email as its partition key.", fr: "Appeler UpdateTable pour ajouter un index secondaire global dont la clé de partition est Email." } }
    - { id: b, text: { en: "Call UpdateTable to add a local secondary index with Email as its sort key.", fr: "Appeler UpdateTable pour ajouter un index secondaire local dont la clé de tri est Email." } }
    - { id: c, text: { en: "Call GetItem with the IndexName parameter set to the new index and the email address as the key.", fr: "Appeler GetItem avec le paramètre IndexName défini sur le nouvel index et l'adresse e-mail comme clé." } }
    - { id: d, text: { en: "Call Query with IndexName set to the new index and the key condition Email = :email.", fr: "Appeler Query avec IndexName défini sur le nouvel index et la condition de clé Email = :email." } }
    - { id: e, text: { en: "Call Scan on the table with the filter expression Email = :email and stop at the first match.", fr: "Appeler Scan sur la table avec l'expression de filtre Email = :email et s'arrêter à la première correspondance." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A global secondary index can use any top-level attribute as its partition key and can be added to an existing table with UpdateTable; the table stays available while the index is backfilled. GSIs are read with Query or Scan, so a Query on the index with an equality condition on Email reads only the matching entries, with eventually consistent results.
    fr: |
      Un index secondaire global peut utiliser n'importe quel attribut de premier niveau comme clé de partition et peut être ajouté à une table existante avec UpdateTable ; la table reste disponible pendant le remplissage de l'index. Les GSI se lisent avec Query ou Scan : une Query sur l'index avec une condition d'égalité sur Email ne lit que les entrées correspondantes, avec des résultats à cohérence éventuelle.
  options:
    b: { en: "Local secondary indexes are created only with the table, and an LSI keeps the table's partition key, so it could not look up a user by email alone.", fr: "Les index secondaires locaux ne sont créés qu'avec la table, et un LSI garde la clé de partition de la table : il ne permettrait pas de chercher un utilisateur par sa seule adresse e-mail." }
    c: { en: "GetItem and BatchGetItem are not supported on secondary indexes; an index is read with Query or Scan.", fr: "GetItem et BatchGetItem ne sont pas pris en charge sur les index secondaires ; un index se lit avec Query ou Scan." }
    e: { en: "A Scan reads the table page by page until it finds a match, which can read most of the table for each sign-in.", fr: "Un Scan lit la table page par page jusqu'à trouver une correspondance, ce qui peut lire la plus grande partie de la table à chaque connexion." }
references:
  - title: Managing Global Secondary Indexes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.OnlineOps.html
  - title: Using Global Secondary Indexes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html
