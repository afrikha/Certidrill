id: dvac03-1a-async-queue-statements
objective: "1.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A developer replaces the synchronous HTTP calls from an order service to a fulfillment service with an Amazon SQS standard queue. The order service sends a message for each order, and the fulfillment service polls the queue.

    Which two statements about the new asynchronous design are true? (Choose two.)
  fr: |
    Un développeur remplace les appels HTTP synchrones d'un service de commande vers un service de traitement des commandes par une file d'attente Amazon SQS standard. Le service de commande envoie un message pour chaque commande, et le service de traitement interroge la file.

    Quelles sont les deux affirmations vraies sur la nouvelle conception asynchrone ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The order service receives the fulfillment result in the response to SendMessage.", fr: "Le service de commande reçoit le résultat du traitement dans la réponse à SendMessage." } }
    - { id: b, text: { en: "Each message is delivered exactly once and in the order it was sent.", fr: "Chaque message est remis exactement une fois et dans l'ordre d'envoi." } }
    - { id: c, text: { en: "The order service can keep sending orders while the fulfillment service is offline.", fr: "Le service de commande peut continuer à envoyer des commandes pendant que le service de traitement est hors ligne." } }
    - { id: d, text: { en: "The fulfillment service no longer needs to handle duplicate messages.", fr: "Le service de traitement n'a plus besoin de gérer les messages en double." } }
    - { id: e, text: { en: "The order service no longer waits for the fulfillment service to finish its work.", fr: "Le service de commande n'attend plus que le service de traitement termine son travail." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "With a queue, the producer only waits for SQS to store the message, not for the consumer to process it. Messages stay in the queue for the retention period (4 days by default, up to 14 days), so the producer keeps working while the consumer is offline."
    fr: "Avec une file d'attente, le producteur attend seulement que SQS stocke le message, pas que le consommateur le traite. Les messages restent dans la file pendant la période de conservation (4 jours par défaut, jusqu'à 14 jours) : le producteur continue de travailler pendant que le consommateur est hors ligne."
  options:
    a:
      en: "SendMessage returns a message ID once the message is stored; the result of the processing isn't returned to the producer."
      fr: "SendMessage renvoie un ID de message une fois le message stocké ; le résultat du traitement n'est pas renvoyé au producteur."
    b:
      en: "A standard queue provides at-least-once delivery and best-effort ordering; only FIFO queues keep order and deduplicate."
      fr: "Une file standard offre une remise au moins une fois et un ordre au mieux ; seules les files FIFO conservent l'ordre et dédupliquent."
    d:
      en: "Because a standard queue can deliver a message more than once, the consumer must be idempotent."
      fr: "Comme une file standard peut remettre un message plusieurs fois, le consommateur doit être idempotent."
references:
  - title: Amazon SQS message quotas
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
  - title: Amazon SQS visibility timeout
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html
