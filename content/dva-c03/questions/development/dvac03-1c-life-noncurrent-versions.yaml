id: dvac03-1c-life-noncurrent-versions
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application stores configuration files in an Amazon S3 bucket with versioning enabled, and the files are overwritten many times each day. Developers must be able to roll back to any of the 5 most recent previous versions of a file. Older previous versions must be deleted once they have been noncurrent for 30 days.

    Which S3 Lifecycle action will meet these requirements?
  fr: |
    Une application stocke des fichiers de configuration dans un compartiment Amazon S3 dont la gestion des versions est activée, et les fichiers sont remplacés de nombreuses fois par jour. Les développeurs doivent pouvoir revenir à n'importe laquelle des 5 versions précédentes les plus récentes d'un fichier. Les versions précédentes plus anciennes doivent être supprimées dès qu'elles sont non actuelles depuis 30 jours.

    Quelle action S3 Lifecycle répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "An Expiration action with Days set to 30 for the current versions of the objects", fr: "Une action Expiration avec Days défini à 30 pour les versions actuelles des objets" } }
    - { id: b, text: { en: "A NoncurrentVersionExpiration action with NoncurrentDays set to 30 and NewerNoncurrentVersions set to 5", fr: "Une action NoncurrentVersionExpiration avec NoncurrentDays défini à 30 et NewerNoncurrentVersions défini à 5" } }
    - { id: c, text: { en: "A NoncurrentVersionTransition action to S3 Glacier Flexible Retrieval with NoncurrentDays set to 30", fr: "Une action NoncurrentVersionTransition vers S3 Glacier Flexible Retrieval avec NoncurrentDays défini à 30" } }
    - { id: d, text: { en: "An Expiration action with ExpiredObjectDeleteMarker set to true for the objects of the bucket", fr: "Une action Expiration avec ExpiredObjectDeleteMarker défini à true pour les objets du compartiment" } }
answer: { optionId: b }
explanation:
  correct:
    en: "NoncurrentVersionExpiration permanently deletes noncurrent versions. With NewerNoncurrentVersions set to 5, S3 keeps the 5 newest noncurrent versions of each object, and it deletes an older noncurrent version only when both thresholds are exceeded, here after 30 days as noncurrent."
    fr: "NoncurrentVersionExpiration supprime définitivement les versions non actuelles. Avec NewerNoncurrentVersions défini à 5, S3 conserve les 5 versions non actuelles les plus récentes de chaque objet, et ne supprime une version non actuelle plus ancienne que lorsque les deux seuils sont dépassés, ici après 30 jours en tant que version non actuelle."
  options:
    a:
      en: "In a versioned bucket, Expiration adds a delete marker to current versions 30 days after creation; it does not delete previous versions."
      fr: "Dans un compartiment versionné, Expiration ajoute un marqueur de suppression aux versions actuelles 30 jours après leur création ; elle ne supprime pas les versions précédentes."
    c:
      en: "A transition keeps every previous version in another storage class instead of deleting the older ones."
      fr: "Une transition conserve chaque version précédente dans une autre classe de stockage au lieu de supprimer les plus anciennes."
    d:
      en: "ExpiredObjectDeleteMarker removes delete markers that have no noncurrent versions; it does not delete versions."
      fr: "ExpiredObjectDeleteMarker supprime les marqueurs de suppression qui n'ont plus de versions non actuelles ; il ne supprime pas de versions."
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
  - title: Examples of S3 Lifecycle configurations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-configuration-examples.html
