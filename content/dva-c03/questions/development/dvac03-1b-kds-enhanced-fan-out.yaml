id: dvac03-1b-kds-enhanced-fan-out
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company has an Amazon Kinesis data stream that receives viewing events. Five consumer applications read the stream with `GetRecords` through the shared-throughput model. The consumers report increasing latency and the `ReadProvisionedThroughputExceeded` metric is high, although the producers write well below the write quota of each shard. Each consumer must receive the full data of every shard with low latency, and the producers and the number of shards must stay unchanged.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias dispose d'un flux de données Amazon Kinesis qui reçoit des événements de visionnage. Cinq applications consommatrices lisent le flux avec `GetRecords` selon le modèle à débit partagé. Les consommateurs signalent une latence croissante et la métrique `ReadProvisionedThroughputExceeded` est élevée, alors que les producteurs écrivent bien en dessous du quota d'écriture de chaque partition (shard). Chaque consommateur doit recevoir toutes les données de chaque partition avec une faible latence, et les producteurs ainsi que le nombre de partitions ne doivent pas changer.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure each consumer to call GetRecords more often and to request a larger number of records per call.", fr: "Configurer chaque consommateur pour appeler GetRecords plus souvent et demander un plus grand nombre d'enregistrements par appel." }
    - id: b
      text: { en: "Increase the retention period of the stream so that slow consumers can catch up later.", fr: "Augmenter la période de conservation du flux afin que les consommateurs lents puissent rattraper leur retard plus tard." }
    - id: c
      text: { en: "Register each consumer with RegisterStreamConsumer and read the shards through SubscribeToShard.", fr: "Enregistrer chaque consommateur avec RegisterStreamConsumer et lire les partitions au moyen de SubscribeToShard." }
    - id: d
      text: { en: "Create an Amazon Data Firehose stream that reads the data stream and delivers the records to each consumer.", fr: "Créer un flux Amazon Data Firehose qui lit le flux de données et livre les enregistrements à chaque consommateur." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With shared throughput, all consumers of a shard share 2 MB per second and 5 GetRecords calls per second, so five consumers throttle each other. Enhanced fan-out consumers registered with RegisterStreamConsumer each get a dedicated pipe of up to 2 MB per second per shard, pushed over HTTP/2 through SubscribeToShard, with a typical propagation delay of about 70 ms. No change to the producers or shard count is needed.
    fr: |
      Avec le débit partagé, tous les consommateurs d'une partition se partagent 2 Mo par seconde et 5 appels GetRecords par seconde : cinq consommateurs se limitent mutuellement. Les consommateurs à diffusion améliorée (enhanced fan-out) enregistrés avec RegisterStreamConsumer reçoivent chacun un canal dédié jusqu'à 2 Mo par seconde par partition, poussé en HTTP/2 au moyen de SubscribeToShard, avec un délai de propagation typique d'environ 70 ms. Aucun changement des producteurs ni du nombre de partitions n'est nécessaire.
  options:
    a:
      en: "The shard read quota of 5 GetRecords calls and 2 MB per second is shared by all consumers, so calling more often causes more throttling."
      fr: "Le quota de lecture d'une partition, 5 appels GetRecords et 2 Mo par seconde, est partagé par tous les consommateurs : appeler plus souvent provoque davantage de limitations."
    b:
      en: "A longer retention keeps records available longer but does not add read throughput, so latency keeps growing."
      fr: "Une conservation plus longue garde les enregistrements disponibles plus longtemps mais n'ajoute aucun débit de lecture : la latence continue d'augmenter."
    d:
      en: "Firehose delivers records to storage and analytics destinations; it is not a fan-out mechanism to custom consumer applications and it adds buffering latency."
      fr: "Firehose livre les enregistrements à des destinations de stockage et d'analytique ; ce n'est pas un mécanisme de diffusion vers des applications consommatrices personnalisées, et il ajoute la latence de mise en mémoire tampon."
references:
  - title: Develop enhanced fan-out consumers with dedicated throughput
    url: https://docs.aws.amazon.com/streams/latest/dev/enhanced-consumers.html
