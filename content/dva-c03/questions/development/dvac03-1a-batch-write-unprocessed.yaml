id: dvac03-1a-batch-write-unprocessed
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python data loader writes items to an Amazon DynamoDB table with batch_write_item calls of 25 items each. The calls don't raise exceptions, but after a large load some items are missing from the table.

    Which change will make sure that every item is written?
  fr: |
    Un chargeur de données Python écrit des éléments dans une table Amazon DynamoDB avec des appels batch_write_item de 25 éléments chacun. Les appels ne lèvent pas d'exception, mais après un chargement volumineux certains éléments manquent dans la table.

    Quelle modification garantira l'écriture de chaque élément ?
body:
  options:
    - id: a
      text: { en: "Resend the items in `UnprocessedItems` of each response with exponential backoff until none remain.", fr: "Renvoyer les éléments de `UnprocessedItems` de chaque réponse avec un backoff exponentiel jusqu'à ce qu'il n'en reste aucun." }
    - id: b
      text: { en: "Send 100 items in each `batch_write_item` call to reduce the number of requests.", fr: "Envoyer 100 éléments dans chaque appel `batch_write_item` pour réduire le nombre de requêtes." }
    - id: c
      text: { en: "Add a `ConditionExpression` to each put request in the batch so that a failed write raises an error.", fr: "Ajouter une `ConditionExpression` à chaque requête put du lot pour qu'une écriture en échec lève une erreur." }
    - id: d
      text: { en: "Set `ReturnConsumedCapacity` to `TOTAL` in each `batch_write_item` call to track the writes.", fr: "Définir `ReturnConsumedCapacity` sur `TOTAL` dans chaque appel `batch_write_item` pour suivre les écritures." }
answer: { optionId: a }
explanation:
  correct:
    en: "BatchWriteItem can succeed partially: requests that weren't processed, usually because of throttling, are returned in UnprocessedItems, in the same format as RequestItems. The code must resubmit them, with exponential backoff because immediate retries can be throttled again, until the map is empty."
    fr: "BatchWriteItem peut réussir partiellement : les requêtes non traitées, généralement à cause d'une limitation, sont renvoyées dans UnprocessedItems, au même format que RequestItems. Le code doit les renvoyer, avec un backoff exponentiel car des nouvelles tentatives immédiates peuvent de nouveau être limitées, jusqu'à ce que la table de correspondance soit vide."
  options:
    b:
      en: "A BatchWriteItem call accepts at most 25 put or delete requests, so a batch of 100 items is rejected."
      fr: "Un appel BatchWriteItem accepte au plus 25 requêtes put ou delete : un lot de 100 éléments est rejeté."
    c:
      en: "BatchWriteItem doesn't support conditions on individual put or delete requests."
      fr: "BatchWriteItem ne prend pas en charge de condition sur les requêtes put ou delete individuelles."
    d:
      en: "ReturnConsumedCapacity reports the capacity used; it doesn't write the unprocessed items."
      fr: "ReturnConsumedCapacity indique la capacité consommée ; il n'écrit pas les éléments non traités."
references:
  - title: BatchWriteItem
    url: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_BatchWriteItem.html
