id: dvac03-1b-kds-hot-partition-key
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company streams order events to an Amazon Kinesis data stream in provisioned mode with 8 shards. The producer application calls `PutRecords` and sets the partition key of every record to the constant value `orders`. During sales peaks, the producer receives `ProvisionedThroughputExceededException` errors, but CloudWatch metrics show that only one shard receives data. The company wants to use the capacity of all the shards that it already pays for.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de vente au détail diffuse des événements de commande vers un flux de données Amazon Kinesis en mode provisionné comportant 8 partitions (shards). L'application productrice appelle `PutRecords` et définit la clé de partition de chaque enregistrement sur la valeur constante `orders`. Pendant les pics de ventes, le producteur reçoit des erreurs `ProvisionedThroughputExceededException`, mais les métriques CloudWatch montrent qu'une seule partition reçoit des données. L'entreprise veut utiliser la capacité de toutes les partitions qu'elle paie déjà.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Double the number of shards in the stream by calling UpdateShardCount before each sales peak.", fr: "Doubler le nombre de partitions du flux en appelant UpdateShardCount avant chaque pic de ventes." }
    - id: b
      text: { en: "Use a high-cardinality value, such as the order ID, as the partition key of each record.", fr: "Utiliser une valeur à cardinalité élevée, comme l'ID de commande, comme clé de partition de chaque enregistrement." }
    - id: c
      text: { en: "Register the consumer applications as enhanced fan-out consumers of the stream.", fr: "Enregistrer les applications consommatrices comme consommateurs à diffusion améliorée (enhanced fan-out) du flux." }
    - id: d
      text: { en: "Replace PutRecords calls with PutRecord calls that send one record at a time.", fr: "Remplacer les appels PutRecords par des appels PutRecord qui envoient un enregistrement à la fois." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kinesis Data Streams hashes the partition key with MD5 to choose the shard, so records with the same key always go to the same shard. A constant key sends all traffic to one shard, which exceeds its write quota while the other shards stay idle. A high-cardinality key such as the order ID spreads the records across all 8 shards.
    fr: |
      Kinesis Data Streams applique un hachage MD5 à la clé de partition pour choisir la partition : les enregistrements qui ont la même clé vont toujours dans la même partition. Une clé constante envoie tout le trafic vers une seule partition, qui dépasse son quota d'écriture pendant que les autres restent inactives. Une clé à cardinalité élevée comme l'ID de commande répartit les enregistrements sur les 8 partitions.
  options:
    a:
      en: "With a constant partition key, all records still map to a single shard, so added shards stay idle and the company pays for more unused capacity."
      fr: "Avec une clé de partition constante, tous les enregistrements sont toujours associés à une seule partition : les partitions ajoutées restent inactives et l'entreprise paie davantage de capacité inutilisée."
    c:
      en: "Enhanced fan-out gives each consumer dedicated read throughput; it does not change how producers write to shards."
      fr: "La diffusion améliorée donne à chaque consommateur un débit de lecture dédié ; elle ne change pas la façon dont les producteurs écrivent dans les partitions."
    d:
      en: "PutRecord uses the same partition key mapping, so all records still go to one shard, and one call per record adds overhead."
      fr: "PutRecord utilise la même association par clé de partition : tous les enregistrements vont toujours dans une seule partition, et un appel par enregistrement ajoute de la surcharge."
references:
  - title: Amazon Kinesis Data Streams terminology and concepts
    url: https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html
  - title: Troubleshoot Amazon Kinesis Data Streams producers
    url: https://docs.aws.amazon.com/streams/latest/dev/troubleshooting-producers.html
