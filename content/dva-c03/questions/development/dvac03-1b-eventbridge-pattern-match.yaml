id: dvac03-1b-eventbridge-pattern-match
objective: "1.1.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A developer creates an Amazon EventBridge rule with the following event pattern on a custom event bus:

    ```json
    {
      "source": ["com.anycompany.orders"],
      "detail": {
        "amount": [{ "numeric": [">", 1000] }],
        "channel": [{ "anything-but": ["test"] }],
        "country": [{ "prefix": "eu-" }]
      }
    }
    ```

    All the events below have the source `com.anycompany.orders`. Which two events match the rule? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur crée une règle Amazon EventBridge avec le modèle d'événement suivant sur un bus d'événements personnalisé :

    ```json
    {
      "source": ["com.anycompany.orders"],
      "detail": {
        "amount": [{ "numeric": [">", 1000] }],
        "channel": [{ "anything-but": ["test"] }],
        "country": [{ "prefix": "eu-" }]
      }
    }
    ```

    Tous les événements ci-dessous ont la source `com.anycompany.orders`. Quels sont les deux événements qui correspondent à la règle ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`\"detail\": {\"amount\": 1500, \"channel\": \"web\", \"country\": \"eu-fr\"}`" }
    - { id: b, text: "`\"detail\": {\"amount\": \"2000\", \"channel\": \"mobile\", \"country\": \"eu-de\"}`" }
    - { id: c, text: "`\"detail\": {\"amount\": 1200.5, \"channel\": \"store\", \"country\": \"eu-es\", \"coupon\": \"X1\"}`" }
    - { id: d, text: "`\"detail\": {\"amount\": 1000, \"channel\": \"web\", \"country\": \"eu-it\"}`" }
    - { id: e, text: "`\"detail\": {\"amount\": 3000, \"channel\": \"test\", \"country\": \"eu-fr\"}`" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Fields in a pattern are combined with AND, so a match needs an amount number greater than 1000, a channel other than test, and a country that starts with eu-. Fields of the event that the pattern does not mention, such as coupon, are ignored, so 1500 and 1200.5 with web and store in eu- countries match.
    fr: |
      Les champs d'un modèle sont combinés par ET : une correspondance exige un amount numérique supérieur à 1000, un channel différent de test et un country qui commence par eu-. Les champs de l'événement que le modèle ne mentionne pas, comme coupon, sont ignorés : 1500 et 1200.5 avec web et store dans des pays eu- correspondent.
  options:
    b:
      en: "The amount is the string \"2000\", and a value that is not a number does not match a numeric comparison."
      fr: "Le amount est la chaîne \"2000\", et une valeur qui n'est pas un nombre ne correspond pas à une comparaison numérique."
    d:
      en: "1000 is not greater than 1000, so the numeric condition fails."
      fr: "1000 n'est pas strictement supérieur à 1000 : la condition numérique échoue."
    e:
      en: "anything-but excludes the value test, so this event fails the channel condition."
      fr: "anything-but exclut la valeur test : cet événement échoue à la condition sur channel."
references:
  - title: Comparison operators for use in event patterns in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-create-pattern-operators.html
