id: dvac03-1a-pipes-sqs-to-sfn
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's order messages arrive in an Amazon SQS queue as JSON documents. A Lambda function reads the queue through an event source mapping, discards the messages whose orderType field is not "wholesale", and starts an AWS Step Functions state machine execution for each remaining message. The company wants to remove this integration code and keep the same filtering, with the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Les messages de commande d'une entreprise arrivent dans une file d'attente Amazon SQS sous forme de documents JSON. Une fonction Lambda lit la file au moyen d'un mappage de source d'événements, ignore les messages dont le champ orderType n'est pas "wholesale" et démarre une exécution d'une machine d'état AWS Step Functions pour chaque message restant. L'entreprise veut supprimer ce code d'intégration et conserver le même filtrage, avec l'effort de développement le MOINS important.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an EventBridge rule on the default event bus with an event pattern on orderType and the queue as its event source.", fr: "Créer une règle EventBridge sur le bus d'événements par défaut avec un modèle d'événement sur orderType et la file comme source d'événements." }
    - id: b
      text: { en: "Configure the queue as an event source mapping of the state machine with filter criteria on orderType.", fr: "Configurer la file comme mappage de source d'événements de la machine d'état avec des critères de filtre sur orderType." }
    - id: c
      text: { en: "Create an EventBridge pipe with the queue as its source, a filter on orderType, and the state machine as its target.", fr: "Créer un pipe EventBridge avec la file comme source, un filtre sur orderType et la machine d'état comme cible." }
    - id: d
      text: { en: "Add filter criteria on orderType to the Lambda event source mapping and keep the code that starts executions.", fr: "Ajouter des critères de filtre sur orderType au mappage de source d'événements Lambda et conserver le code qui démarre les exécutions." }
answer: { optionId: c }
explanation:
  correct:
    en: "EventBridge Pipes connects a source such as an SQS queue to a target such as a Step Functions state machine for point-to-point integrations. The pipe reads the queue, keeps only the events that match its filter, and starts the executions, so no integration code is left to maintain."
    fr: "EventBridge Pipes relie une source comme une file SQS à une cible comme une machine d'état Step Functions pour des intégrations point à point. Le pipe lit la file, ne garde que les événements qui correspondent à son filtre et démarre les exécutions : il ne reste aucun code d'intégration à maintenir."
  options:
    a:
      en: "Event bus rules match events that are sent to the bus; a rule can't read messages from an SQS queue."
      fr: "Les règles d'un bus d'événements comparent les événements envoyés au bus ; une règle ne peut pas lire les messages d'une file SQS."
    b:
      en: "Event source mappings are a Lambda feature; Step Functions has no event source mapping that polls a queue."
      fr: "Les mappages de source d'événements sont une fonctionnalité Lambda ; Step Functions n'a pas de mappage de source d'événements qui interroge une file."
    d:
      en: "Filter criteria reduce the invocations, but the Lambda code that starts the executions remains, which the company wants to remove."
      fr: "Les critères de filtre réduisent les invocations, mais le code Lambda qui démarre les exécutions reste, alors que l'entreprise veut le supprimer."
references:
  - title: Amazon EventBridge Pipes
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes.html
