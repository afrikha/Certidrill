id: dvac03-1a-fifo-group-per-account
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank sends account transactions to a queue so that a processing service can handle them asynchronously. Transactions for the same account must be processed in the order they were sent, and a send that the producer retries must not create a duplicate. Transactions for different accounts must be processed in parallel by several consumers.

    Which solution will meet these requirements?
  fr: |
    Une banque envoie les transactions des comptes dans une file d'attente afin qu'un service de traitement les traite de manière asynchrone. Les transactions d'un même compte doivent être traitées dans l'ordre d'envoi, et un envoi que le producteur relance ne doit pas créer de doublon. Les transactions de comptes différents doivent être traitées en parallèle par plusieurs consommateurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use an Amazon SQS standard queue with a single consumer that processes one message at a time.", fr: "Utiliser une file d'attente Amazon SQS standard avec un seul consommateur qui traite un message à la fois." }
    - id: b
      text: { en: "Use an Amazon SQS FIFO queue with the account ID as message group ID and a deduplication ID per transaction.", fr: "Utiliser une file d'attente Amazon SQS FIFO avec l'ID du compte comme ID de groupe de messages et un ID de déduplication par transaction." }
    - id: c
      text: { en: "Use an Amazon SQS FIFO queue and set the same message group ID and a deduplication ID on every message.", fr: "Utiliser une file d'attente Amazon SQS FIFO et définir le même ID de groupe de messages et un ID de déduplication sur chaque message." }
    - id: d
      text: { en: "Use an Amazon SQS standard queue and set a delivery delay of 15 minutes on every message.", fr: "Utiliser une file d'attente Amazon SQS standard et définir un délai de remise de 15 minutes sur chaque message." }
answer: { optionId: b }
explanation:
  correct:
    en: "A FIFO queue keeps the order of messages within a message group, and different groups can be consumed in parallel, so the account ID as group ID gives per-account order with parallel processing across accounts. A retried send with the same deduplication ID within the 5-minute deduplication interval doesn't add a duplicate."
    fr: "Une file FIFO conserve l'ordre des messages au sein d'un groupe de messages, et des groupes différents peuvent être consommés en parallèle : l'ID du compte comme ID de groupe donne l'ordre par compte avec un traitement parallèle entre comptes. Un envoi relancé avec le même ID de déduplication dans l'intervalle de déduplication de 5 minutes n'ajoute pas de doublon."
  options:
    a:
      en: "A standard queue delivers at least once and doesn't guarantee order, even with one consumer, and a single consumer removes the required parallelism."
      fr: "Une file standard remet au moins une fois et ne garantit pas l'ordre, même avec un seul consommateur, et un consommateur unique supprime le parallélisme exigé."
    c:
      en: "One message group for all messages serializes every transaction, so transactions of different accounts can't be processed in parallel."
      fr: "Un seul groupe de messages pour tous les messages sérialise toutes les transactions : celles de comptes différents ne peuvent pas être traitées en parallèle."
    d:
      en: "A delivery delay only postpones messages; it provides neither ordering nor deduplication."
      fr: "Un délai de remise ne fait que retarder les messages ; il n'apporte ni ordre ni déduplication."
references:
  - title: Exactly-once processing in Amazon SQS
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-exactly-once-processing.html
