id: dvac03-1d-cache-lambda-dax-access
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function at AnyCompany reads items from an Amazon DynamoDB table by using the AWS SDK DynamoDB client. The function is not connected to a VPC. The team created a DynamoDB Accelerator (DAX) cluster for the table in private subnets of a VPC, to serve the function's eventually consistent reads from the cache. The execution role of the function already has the required DAX and VPC permissions.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une fonction AWS Lambda d'AnyCompany lit des éléments d'une table Amazon DynamoDB à l'aide du client DynamoDB du kit SDK AWS. La fonction n'est connectée à aucun VPC. L'équipe a créé pour la table un cluster DynamoDB Accelerator (DAX) dans des sous-réseaux privés d'un VPC, afin de servir depuis le cache les lectures à cohérence éventuelle de la fonction. Le rôle d'exécution de la fonction dispose déjà des autorisations DAX et VPC requises.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Connect the function to private subnets of the DAX cluster's VPC with a security group that the cluster's security group allows.", fr: "Connecter la fonction à des sous-réseaux privés du VPC du cluster DAX avec un groupe de sécurité autorisé par le groupe de sécurité du cluster." } }
    - { id: b, text: { en: "Set ConsistentRead to true on the reads so that DAX serves them from the item cache.", fr: "Définir ConsistentRead sur true dans les lectures pour que DAX les serve depuis le cache d'éléments." } }
    - { id: c, text: { en: "Replace the DynamoDB client in the function code with the DAX client, configured with the cluster endpoint.", fr: "Remplacer le client DynamoDB dans le code de la fonction par le client DAX, configuré avec le point de terminaison du cluster." } }
    - { id: d, text: { en: "Keep the DynamoDB client in the function code and set its endpoint URL to the DAX cluster endpoint.", fr: "Garder le client DynamoDB dans le code de la fonction et définir son URL de point de terminaison sur celui du cluster DAX." } }
    - { id: e, text: { en: "Enable caching on an Amazon API Gateway stage in front of the function.", fr: "Activer la mise en cache sur une étape Amazon API Gateway devant la fonction." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A DAX cluster runs inside a VPC, so the function must be attached to subnets of that VPC with a security group that the cluster accepts; Lambda then creates the network interfaces it needs. The application sends its requests to the cluster through the DAX client, which is API-compatible with DynamoDB, so the code changes only where the client is created.
    fr: |
      Un cluster DAX s'exécute dans un VPC : la fonction doit donc être attachée à des sous-réseaux de ce VPC avec un groupe de sécurité que le cluster accepte ; Lambda crée alors les interfaces réseau nécessaires. L'application envoie ses requêtes au cluster via le client DAX, compatible avec l'API de DynamoDB : le code ne change qu'à l'endroit où le client est créé.
  options:
    b: { en: "DAX passes strongly consistent reads through to DynamoDB without caching them, which removes the benefit of the cache.", fr: "DAX transmet les lectures fortement cohérentes à DynamoDB sans les mettre en cache, ce qui supprime l'intérêt du cache." }
    d: { en: "A DAX cluster is called through the DAX client for the language; the standard DynamoDB client does not work with a DAX cluster endpoint.", fr: "Un cluster DAX s'appelle via le client DAX du langage ; le client DynamoDB standard ne fonctionne pas avec le point de terminaison d'un cluster DAX." }
    e: { en: "API Gateway caching stores whole API responses at the stage; the function's DynamoDB reads would still not use DAX.", fr: "La mise en cache d'API Gateway stocke des réponses d'API entières au niveau de l'étape ; les lectures DynamoDB de la fonction n'utiliseraient toujours pas DAX." }
references:
  - title: In-memory acceleration with DynamoDB Accelerator (DAX)
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html
  - title: Giving Lambda Event Functions access to resources in an Amazon VPC
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
