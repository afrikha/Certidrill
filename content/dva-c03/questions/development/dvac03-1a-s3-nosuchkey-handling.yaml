id: dvac03-1a-s3-nosuchkey-handling
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python function reads optional configuration objects from an Amazon S3 bucket with get_object. Its execution role has s3:GetObject and s3:ListBucket permissions on the bucket. When an object doesn't exist, the function must use default values. Any other error must still make the function fail.

    Which code change will meet these requirements?
  fr: |
    Une fonction Python lit des objets de configuration facultatifs dans un compartiment Amazon S3 avec get_object. Son rôle d'exécution dispose des autorisations s3:GetObject et s3:ListBucket sur le compartiment. Quand un objet n'existe pas, la fonction doit utiliser des valeurs par défaut. Toute autre erreur doit toujours faire échouer la fonction.

    Quelle modification du code répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Check whether `response[\"ResponseMetadata\"][\"HTTPStatusCode\"]` is 404 after each `get_object` call.", fr: "Vérifier si `response[\"ResponseMetadata\"][\"HTTPStatusCode\"]` vaut 404 après chaque appel `get_object`." }
    - id: b
      text: { en: "Catch `ClientError`, use the defaults when `error.response[\"Error\"][\"Code\"]` is `NoSuchKey`, else re-raise.", fr: "Intercepter `ClientError`, utiliser les valeurs par défaut quand `error.response[\"Error\"][\"Code\"]` vaut `NoSuchKey`, sinon relancer." }
    - id: c
      text: { en: "Catch `KeyError` around the `get_object` call and use the defaults in the handler.", fr: "Intercepter `KeyError` autour de l'appel `get_object` et utiliser les valeurs par défaut dans le gestionnaire." }
    - id: d
      text: { en: "Catch `ClientError` around the `get_object` call and use the defaults for every error code.", fr: "Intercepter `ClientError` autour de l'appel `get_object` et utiliser les valeurs par défaut pour tout code d'erreur." }
answer: { optionId: b }
explanation:
  correct:
    en: "boto3 raises service errors as ClientError, whose response contains Error.Code. Because the role has s3:ListBucket, S3 answers a missing key with 404 and the NoSuchKey code, so the code can handle that case and re-raise all other errors."
    fr: "boto3 lève les erreurs de service sous forme de ClientError, dont la réponse contient Error.Code. Comme le rôle dispose de s3:ListBucket, S3 répond à une clé absente par 404 et le code NoSuchKey : le code peut traiter ce cas et relancer toutes les autres erreurs."
  options:
    a:
      en: "A 404 from get_object raises a ClientError; the call doesn't return a response whose status code can be checked."
      fr: "Un 404 de get_object lève une ClientError ; l'appel ne renvoie pas de réponse dont on pourrait vérifier le code d'état."
    c:
      en: "The SDK doesn't raise KeyError for a missing object, so the exception isn't caught."
      fr: "Le SDK ne lève pas KeyError pour un objet absent : l'exception n'est pas interceptée."
    d:
      en: "Handling every error code also hides access denials and throttling, which must still make the function fail."
      fr: "Traiter tous les codes d'erreur masque aussi les refus d'accès et les limitations, qui doivent toujours faire échouer la fonction."
references:
  - title: Error handling
    url: https://docs.aws.amazon.com/boto3/latest/guide/error-handling.html
  - title: GetObject
    url: https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html
