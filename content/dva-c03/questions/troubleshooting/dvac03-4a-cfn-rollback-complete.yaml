id: dvac03-4a-cfn-rollback-complete
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The first creation of an AWS CloudFormation stack failed because of a typo in a parameter value, and the stack is now in the ROLLBACK_COMPLETE status. The developer fixes the value and runs `aws cloudformation update-stack` on the same stack, but the command fails.

    What should the developer do to deploy the corrected template?
  fr: |
    La première création d'une pile AWS CloudFormation a échoué à cause d'une faute de frappe dans une valeur de paramètre, et la pile a maintenant le statut ROLLBACK_COMPLETE. Le développeur corrige la valeur et exécute `aws cloudformation update-stack` sur la même pile, mais la commande échoue.

    Que doit faire le développeur pour déployer le modèle corrigé ?
body:
  options:
    - { id: a, text: { en: "Run `aws cloudformation continue-update-rollback` and then update the stack.", fr: "Exécuter `aws cloudformation continue-update-rollback`, puis mettre à jour la pile." } }
    - { id: b, text: { en: "Create a change set on the stack and execute it.", fr: "Créer un jeu de modifications sur la pile et l'exécuter." } }
    - { id: c, text: { en: "Delete the stack and create it again with the corrected value.", fr: "Supprimer la pile et la créer de nouveau avec la valeur corrigée." } }
    - { id: d, text: { en: "Run `aws cloudformation cancel-update-stack` and then update the stack.", fr: "Exécuter `aws cloudformation cancel-update-stack`, puis mettre à jour la pile." } }
answer: { optionId: c }
explanation:
  correct:
    en: "ROLLBACK_COMPLETE exists only after a failed stack creation: the resources created during the attempt were deleted, and the only operation allowed on the stack is a delete. The developer must delete the stack and create it again."
    fr: "Le statut ROLLBACK_COMPLETE n'existe qu'après l'échec de la création d'une pile : les ressources créées pendant la tentative ont été supprimées, et la seule opération autorisée sur la pile est la suppression. Le développeur doit supprimer la pile et la recréer."
  options:
    a:
      en: "continue-update-rollback applies to a stack in UPDATE_ROLLBACK_FAILED after a failed update, not to a failed creation."
      fr: "continue-update-rollback s'applique à une pile en UPDATE_ROLLBACK_FAILED après l'échec d'une mise à jour, pas à un échec de création."
    b:
      en: "A change set is an update, and a stack in ROLLBACK_COMPLETE accepts only a delete operation."
      fr: "Un jeu de modifications est une mise à jour, et une pile en ROLLBACK_COMPLETE n'accepte que la suppression."
    d:
      en: "cancel-update-stack cancels an update that is in progress; no update is running here."
      fr: "cancel-update-stack annule une mise à jour en cours ; aucune mise à jour n'est en cours ici."
references:
  - title: View CloudFormation stack events
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/view-stack-events.html
