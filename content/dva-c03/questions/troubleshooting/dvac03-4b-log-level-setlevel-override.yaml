id: dvac03-4b-log-level-setlevel-override
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer at AnyCompany configured a Python AWS Lambda function with the JSON log format and an application log level of WARN. The function is invoked without a qualifier. DEBUG entries from the function still appear in Amazon CloudWatch Logs. The function code starts as follows:

    ```python
    import logging

    logger = logging.getLogger()
    logger.setLevel(logging.DEBUG)

    def handler(event, context):
        logger.debug("payload: %s", event)
        ...
    ```

    Which change will stop the DEBUG entries from being sent?
  fr: |
    Un développeur d'AnyCompany a configuré une fonction AWS Lambda Python avec le format de journal JSON et un niveau de journal d'application WARN. La fonction est appelée sans qualificateur. Les entrées DEBUG de la fonction apparaissent toujours dans Amazon CloudWatch Logs. Le code de la fonction commence ainsi :

    ```python
    import logging

    logger = logging.getLogger()
    logger.setLevel(logging.DEBUG)

    def handler(event, context):
        logger.debug("payload: %s", event)
        ...
    ```

    Quelle modification empêche l'envoi des entrées DEBUG ?
body:
  options:
    - { id: a, text: { en: "Set the system log level of the function to WARN as well.", fr: "Définir également le niveau de journal système de la fonction sur WARN." } }
    - { id: b, text: { en: "Switch the log format back to plain text and keep the WARN application log level.", fr: "Revenir au format de journal texte brut et conserver le niveau de journal d'application WARN." } }
    - { id: c, text: { en: "Add a subscription filter on the log group that excludes events whose level is DEBUG.", fr: "Ajouter un filtre d'abonnement sur le groupe de journaux qui exclut les événements de niveau DEBUG." } }
    - { id: d, text: { en: "Remove the `logger.setLevel(logging.DEBUG)` call from the function code.", fr: "Supprimer l'appel `logger.setLevel(logging.DEBUG)` du code de la fonction." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A log level set in code, such as Python's `setLevel()`, takes precedence over the log level configured on the function. Removing the call lets the WARN application log level apply, so Lambda stops sending DEBUG and INFO entries."
    fr: "Un niveau de journal défini dans le code, comme `setLevel()` en Python, est prioritaire sur le niveau de journal configuré sur la fonction. La suppression de l'appel permet au niveau de journal d'application WARN de s'appliquer : Lambda cesse d'envoyer les entrées DEBUG et INFO."
  options:
    a:
      en: "The system log level filters Lambda's own platform logs; it does not affect the entries written by the application's logger."
      fr: "Le niveau de journal système filtre les journaux de plateforme de Lambda ; il n'a pas d'effet sur les entrées écrites par le logger de l'application."
    b:
      en: "Log-level filtering requires the JSON format; with plain text, the configured level does not filter the application logs at all."
      fr: "Le filtrage par niveau de journal exige le format JSON ; en texte brut, le niveau configuré ne filtre pas du tout les journaux d'application."
    c:
      en: "A subscription filter selects which events are streamed to a destination; the DEBUG entries are still ingested and stored in the log group."
      fr: "Un filtre d'abonnement choisit les événements diffusés vers une destination ; les entrées DEBUG sont toujours ingérées et stockées dans le groupe de journaux."
references:
  - title: Log-level filtering
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-log-level.html
