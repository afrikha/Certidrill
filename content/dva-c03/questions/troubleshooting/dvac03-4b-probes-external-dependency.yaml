id: dvac03-4b-probes-external-dependency
objective: "4.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AnyCompany service on Amazon EKS has 12 replicas. Both the liveness probe and the readiness probe call `/health`, which runs a query on the shared Amazon RDS database. During a short database slowdown, every replica failed its probes at the same time. All the containers were restarted and the service stopped receiving traffic, which turned a slowdown into a full outage.

    Which combination of changes follows Amazon EKS best practices to prevent this outage? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un service d'AnyCompany sur Amazon EKS compte 12 réplicas. La sonde de vivacité et la sonde de disponibilité appellent toutes deux `/health`, qui exécute une requête sur la base de données Amazon RDS partagée. Lors d'un bref ralentissement de la base de données, tous les réplicas ont échoué à leurs sondes en même temps. Tous les conteneurs ont été redémarrés et le service a cessé de recevoir du trafic, ce qui a transformé un ralentissement en panne complète.

    Quelle combinaison de modifications suit les bonnes pratiques Amazon EKS pour éviter cette panne ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Make the liveness probe check only the container's own process, without calling the database.", fr: "Faire vérifier par la sonde de vivacité uniquement le processus du conteneur, sans appeler la base de données." } }
    - { id: b, text: { en: "Increase the number of replicas to 24.", fr: "Augmenter le nombre de réplicas à 24." } }
    - { id: c, text: { en: "Make the readiness probe check that the pod itself can serve requests, without calling the database.", fr: "Faire vérifier par la sonde de disponibilité que le pod lui-même peut traiter des requêtes, sans appeler la base de données." } }
    - { id: d, text: { en: "Add a startup probe that runs the same database query.", fr: "Ajouter une sonde de démarrage qui exécute la même requête de base de données." } }
    - { id: e, text: { en: "Change the liveness probe to an `exec` probe that runs the database query from a script.", fr: "Remplacer la sonde de vivacité par une sonde `exec` qui exécute la requête de base de données depuis un script." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Amazon EKS guidance says not to make liveness probes depend on external resources such as a database, because a dependency problem then restarts every pod at once. Readiness probes should not depend on them either, because all replicas would fail together and Kubernetes would stop sending traffic to every pod."
    fr: "Les recommandations Amazon EKS indiquent de ne pas faire dépendre les sondes de vivacité de ressources externes comme une base de données, car un problème de dépendance redémarre alors tous les pods en même temps. Les sondes de disponibilité ne doivent pas en dépendre non plus, car tous les réplicas échoueraient ensemble et Kubernetes cesserait d'envoyer du trafic à tous les pods."
  options:
    b:
      en: "Every replica runs the same probes against the same database, so 24 replicas would fail together exactly like 12."
      fr: "Chaque réplica exécute les mêmes sondes sur la même base de données : 24 réplicas échoueraient ensemble exactement comme 12."
    d:
      en: "A startup probe only matters while the containers start; adding the database dependency to it keeps the same weakness at startup."
      fr: "Une sonde de démarrage ne compte que pendant le démarrage des conteneurs ; y ajouter la dépendance à la base de données conserve la même faiblesse au démarrage."
    e:
      en: "Changing the probe mechanism keeps the database dependency, and long `exec` commands can exceed the probe timeout."
      fr: "Changer le mécanisme de sonde conserve la dépendance à la base de données, et de longues commandes `exec` peuvent dépasser le délai d'expiration de la sonde."
references:
  - title: Running highly-available applications
    url: https://docs.aws.amazon.com/eks/latest/best-practices/application.html
