id: dvac03-4c-otel-dependency-latency
objective: "4.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Python AWS Lambda function calls Amazon DynamoDB, Amazon S3, and a partner HTTP API in each invocation. Its p99 duration has doubled since the last release. A developer needs to see the latency of each downstream call in traces and in the trace map of Amazon CloudWatch. The team's standards require new instrumentation to use the approach that AWS recommends and must not rely on components that are in maintenance mode.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda en Python appelle Amazon DynamoDB, Amazon S3 et une API HTTP d'un partenaire à chaque invocation. Son p99 de durée a doublé depuis la dernière version. Un développeur doit voir la latence de chaque appel en aval dans les traces et dans la carte des traces d'Amazon CloudWatch. Les normes de l'équipe exigent que toute nouvelle instrumentation suive l'approche recommandée par AWS et ne repose sur aucun composant en mode maintenance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Instrument the function with the AWS X-Ray SDK for Python, and turn on active tracing.", fr: "Instrumenter la fonction avec le kit SDK AWS X-Ray pour Python et activer le suivi actif." }
    - id: b
      text: { en: "Run a CloudWatch Logs Insights query on the REPORT lines, grouped by 1-minute intervals.", fr: "Exécuter une requête CloudWatch Logs Insights sur les lignes REPORT, regroupée par intervalles de 1 minute." }
    - id: c
      text: { en: "Turn on CloudWatch Lambda Insights, and review the function's performance dashboard.", fr: "Activer CloudWatch Lambda Insights et examiner le tableau de bord de performances de la fonction." }
    - id: d
      text: { en: "Instrument the function with AWS Distro for OpenTelemetry, and export the traces to AWS X-Ray.", fr: "Instrumenter la fonction avec AWS Distro for OpenTelemetry et exporter les traces vers AWS X-Ray." }
answer: { optionId: d }
explanation:
  correct:
    en: "The X-Ray SDKs and daemon entered maintenance mode on February 25, 2026, and AWS recommends OpenTelemetry, for example AWS Distro for OpenTelemetry (ADOT), for instrumentation. ADOT exports the traces to X-Ray, where client spans for the DynamoDB, S3 and HTTP calls become subsegments with their own latency in the traces and trace map."
    fr: "Les kits SDK et le démon X-Ray sont passés en mode maintenance le 25 février 2026, et AWS recommande OpenTelemetry, par exemple AWS Distro for OpenTelemetry (ADOT), pour l'instrumentation. ADOT exporte les traces vers X-Ray, où les spans client des appels DynamoDB, S3 et HTTP deviennent des sous-segments avec leur propre latence dans les traces et la carte des traces."
  options:
    a:
      en: "The X-Ray SDK would show the downstream calls, but it is in maintenance mode, which the team's standards do not allow for new instrumentation."
      fr: "Le kit SDK X-Ray montrerait les appels en aval, mais il est en mode maintenance, ce que les normes de l'équipe interdisent pour une nouvelle instrumentation."
    b:
      en: "REPORT lines contain the total duration of each invocation; they do not break the duration down by downstream call."
      fr: "Les lignes REPORT contiennent la durée totale de chaque invocation ; elles ne détaillent pas la durée par appel en aval."
    c:
      en: "Lambda Insights reports system-level metrics such as CPU and memory; it does not show the latency of each downstream call in traces."
      fr: "Lambda Insights rapporte des métriques système comme le processeur et la mémoire ; il ne montre pas la latence de chaque appel en aval dans des traces."
references:
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
