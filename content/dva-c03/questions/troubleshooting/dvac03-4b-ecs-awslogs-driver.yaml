id: dvac03-4b-ecs-awslogs-driver
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a containerized payment API as an Amazon ECS service on AWS Fargate. The API writes one JSON object per line to standard output. The team needs these entries in an Amazon CloudWatch Logs log group named `/ecs/payments`, without changing the application code and with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une API de paiement conteneurisée en tant que service Amazon ECS sur AWS Fargate. L'API écrit un objet JSON par ligne sur la sortie standard. L'équipe a besoin de ces entrées dans un groupe de journaux Amazon CloudWatch Logs nommé `/ecs/payments`, sans modifier le code de l'application et avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on Container Insights for the cluster so that the container output of the tasks is collected in CloudWatch Logs.", fr: "Activer Container Insights pour le cluster afin que la sortie des conteneurs des tâches soit collectée dans CloudWatch Logs." } }
    - { id: b, text: { en: "Install the CloudWatch agent in the application image, and configure it to send the process output to `/ecs/payments`.", fr: "Installer l'agent CloudWatch dans l'image de l'application, et le configurer pour envoyer la sortie du processus vers `/ecs/payments`." } }
    - { id: c, text: { en: "Grant CloudWatch Logs permissions to the task role, and call `PutLogEvents` on `/ecs/payments` from the application.", fr: "Accorder des autorisations CloudWatch Logs au rôle de tâche, et appeler `PutLogEvents` sur `/ecs/payments` depuis l'application." } }
    - { id: d, text: { en: "Set the `awslogs` log driver in the container definition, and give the task execution role permission to write the logs.", fr: "Définir le pilote de journal `awslogs` dans la définition de conteneur, et donner au rôle d'exécution de tâche l'autorisation d'écrire les journaux." } }
answer: { optionId: d }
explanation:
  correct:
    en: "On Fargate, the `logConfiguration` of the container definition with `logDriver` set to `awslogs` and the `awslogs-group`, `awslogs-region` and `awslogs-stream-prefix` options sends the container's standard output to CloudWatch Logs. The task execution role provides the `logs:CreateLogStream` and `logs:PutLogEvents` permissions."
    fr: "Sur Fargate, le paramètre `logConfiguration` de la définition de conteneur, avec `logDriver` défini sur `awslogs` et les options `awslogs-group`, `awslogs-region` et `awslogs-stream-prefix`, envoie la sortie standard du conteneur vers CloudWatch Logs. Le rôle d'exécution de tâche fournit les autorisations `logs:CreateLogStream` et `logs:PutLogEvents`."
  options:
    a:
      en: "Container Insights collects performance metrics and telemetry of the cluster; it does not route the application's standard output to a log group of your choice."
      fr: "Container Insights collecte des métriques de performances et la télémétrie du cluster ; il n'achemine pas la sortie standard de l'application vers un groupe de journaux de votre choix."
    b:
      en: "Adding and running an agent inside the application image changes the image and adds a process to maintain, which the built-in log driver avoids."
      fr: "Ajouter et exécuter un agent dans l'image de l'application modifie l'image et ajoute un processus à maintenir, ce que le pilote de journal intégré évite."
    c:
      en: "Calling the CloudWatch Logs API from the application is a code change."
      fr: "Appeler l'API CloudWatch Logs depuis l'application est une modification du code."
references:
  - title: Send Amazon ECS logs to CloudWatch
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/using_awslogs.html
  - title: "Example Amazon ECS task definition: Route logs to CloudWatch"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/specify-log-config.html
