id: dvac03-4b-reserved-concurrency-downstream
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AnyCompany AWS Lambda function is invoked asynchronously by Amazon S3 event notifications and writes each object's data to an on-premises database. The database accepts at most 40 concurrent connections, and each invocation opens one connection. During upload spikes, the database rejects connections. The function must never run more than 40 invocations at the same time, at no additional cost.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda d'AnyCompany est appelée de façon asynchrone par des notifications d'événements Amazon S3 et écrit les données de chaque objet dans une base de données sur site. La base accepte au maximum 40 connexions simultanées, et chaque appel ouvre une connexion. Lors des pics de chargement, la base refuse des connexions. La fonction ne doit jamais exécuter plus de 40 appels en même temps, sans coût supplémentaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure provisioned concurrency of 40 on an alias of the function.", fr: "Configurer une simultanéité provisionnée de 40 sur un alias de la fonction." } }
    - { id: b, text: { en: "Set the reserved concurrency of the function to 40.", fr: "Définir la simultanéité réservée de la fonction sur 40." } }
    - { id: c, text: { en: "Set the maximum retry attempts for asynchronous invocation to 0.", fr: "Définir le nombre maximal de nouvelles tentatives pour l'appel asynchrone sur 0." } }
    - { id: d, text: { en: "Reduce the timeout of the function to 10 seconds.", fr: "Réduire le délai d'expiration de la fonction à 10 secondes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Reserved concurrency sets the maximum number of concurrent instances of a function and has no additional charge. With 40, Lambda throttles extra invocations; for asynchronous events, Lambda keeps the throttled events in its queue and retries them later, so the database never gets more than 40 connections."
    fr: "La simultanéité réservée fixe le nombre maximal d'instances simultanées d'une fonction, sans frais supplémentaires. Avec 40, Lambda limite les appels en excès ; pour les événements asynchrones, Lambda conserve les événements limités dans sa file d'attente et les réessaie plus tard : la base ne reçoit jamais plus de 40 connexions."
  options:
    a:
      en: "Provisioned concurrency pre-initializes environments and costs extra, but it does not cap the function: extra requests spill over to on-demand concurrency."
      fr: "La simultanéité provisionnée initialise des environnements à l'avance et coûte plus cher, mais ne plafonne pas la fonction : les requêtes en excès débordent sur la simultanéité à la demande."
    c:
      en: "Retry settings control what happens after a failure; they do not limit how many invocations run at once."
      fr: "Les paramètres de nouvelle tentative contrôlent ce qui se passe après un échec ; ils ne limitent pas le nombre d'appels simultanés."
    d:
      en: "A shorter timeout ends long invocations sooner but does not stop Lambda from scaling beyond 40 concurrent invocations."
      fr: "Un délai d'expiration plus court termine plus tôt les appels longs, mais n'empêche pas Lambda de dépasser 40 appels simultanés."
references:
  - title: Understanding Lambda Event Function scaling
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html
  - title: Configuring provisioned concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
