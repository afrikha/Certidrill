id: dvac03-4c-logs-query-generator
objective: "4.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer is not familiar with the CloudWatch Logs Insights query language. The developer wants to find the 20 slowest requests in the log group of an API and display their request IDs by describing the result in plain English.

    Which solution will meet these requirements?
  fr: |
    Un développeur ne connaît pas le langage de requête de CloudWatch Logs Insights. Il veut trouver les 20 requêtes les plus lentes dans le groupe de journaux d'une API et afficher leurs ID de requête en décrivant le résultat en langage courant.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a log anomaly detector for the log group of the API.", fr: "Créer un détecteur d'anomalies de journaux pour le groupe de journaux de l'API." }
    - id: b
      text: { en: "Use the query generator of CloudWatch Logs Insights with a natural language prompt.", fr: "Utiliser le générateur de requêtes de CloudWatch Logs Insights avec une invite en langage naturel." }
    - id: c
      text: { en: "Create a metric filter on the log group, and graph the metric in CloudWatch.", fr: "Créer un filtre de métriques sur le groupe de journaux et représenter la métrique dans CloudWatch." }
    - id: d
      text: { en: "Create a CloudWatch Contributor Insights rule for the log group of the API.", fr: "Créer une règle CloudWatch Contributor Insights pour le groupe de journaux de l'API." }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudWatch Logs can generate and update Logs Insights queries from plain-English prompts. In the query editor, the developer chooses Generate query, enters a prompt such as finding the 20 slowest requests with their request IDs, and receives a query with a line-by-line explanation that can be refined with follow-up prompts."
    fr: "CloudWatch Logs peut générer et mettre à jour des requêtes Logs Insights à partir d'invites en langage courant. Dans l'éditeur de requêtes, le développeur choisit Generate query, saisit une invite qui demande par exemple les 20 requêtes les plus lentes avec leurs ID, et obtient une requête expliquée ligne par ligne qu'il peut affiner par d'autres invites."
  options:
    a:
      en: "A log anomaly detector flags unusual log patterns over time; it does not answer an ad hoc question about the slowest requests."
      fr: "Un détecteur d'anomalies de journaux signale des modèles de journaux inhabituels au fil du temps ; il ne répond pas à une question ponctuelle sur les requêtes les plus lentes."
    c:
      en: "A metric filter turns matching log events into a metric; it does not list individual requests with their IDs, and it requires knowing the filter syntax."
      fr: "Un filtre de métriques transforme les événements de journaux correspondants en métrique ; il ne liste pas les requêtes individuelles avec leurs ID et exige de connaître la syntaxe des filtres."
    d:
      en: "Contributor Insights rules report top contributors to a metric over time and require a rule definition; they do not generate a query from a description."
      fr: "Les règles Contributor Insights indiquent les principaux contributeurs à une métrique au fil du temps et exigent une définition de règle ; elles ne génèrent pas de requête à partir d'une description."
references:
  - title: Use natural language to generate and update CloudWatch Logs Insights queries
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs-Insights-Query-Assist.html
