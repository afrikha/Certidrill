id: dvac03-4b-claimed-account-concurrency
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs about 60 AWS Lambda functions in one Region with the default account concurrency quota. Several functions have reserved concurrency, and some have provisioned concurrency. Last week, on-demand invocations were throttled even though a CloudWatch dashboard showed low `ConcurrentExecutions` values for every function. The team must be alerted when the account approaches the point where on-demand invocations are throttled.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute environ 60 fonctions AWS Lambda dans une Région avec le quota de simultanéité de compte par défaut. Plusieurs fonctions ont une simultanéité réservée, et certaines une simultanéité provisionnée. La semaine dernière, des appels à la demande ont été limités alors qu'un tableau de bord CloudWatch affichait des valeurs `ConcurrentExecutions` faibles pour chaque fonction. L'équipe doit être alertée quand le compte approche du point où les appels à la demande sont limités.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Alarm on the Maximum of the Region-level `ClaimedAccountConcurrency` metric at 70 percent of the account concurrency quota.", fr: "Créer une alarme sur le maximum de la métrique `ClaimedAccountConcurrency` au niveau de la Région, à 70 % du quota de simultanéité du compte." } }
    - { id: b, text: { en: "Alarm on the Maximum of the Region-level `ConcurrentExecutions` metric at 70 percent of the account concurrency quota.", fr: "Créer une alarme sur le maximum de la métrique `ConcurrentExecutions` au niveau de la Région, à 70 % du quota de simultanéité du compte." } }
    - { id: c, text: { en: "Alarm on the Sum of `ProvisionedConcurrencySpilloverInvocations` for each function that has provisioned concurrency.", fr: "Créer une alarme sur la somme de `ProvisionedConcurrencySpilloverInvocations` pour chaque fonction qui a une simultanéité provisionnée." } }
    - { id: d, text: { en: "Alarm on the Maximum of `ProvisionedConcurrencyUtilization` for each function that has provisioned concurrency.", fr: "Créer une alarme sur le maximum de `ProvisionedConcurrencyUtilization` pour chaque fonction qui a une simultanéité provisionnée." } }
answer: { optionId: a }
explanation:
  correct:
    en: "`ClaimedAccountConcurrency` is the concurrency that is not available for on-demand invocations: unreserved concurrency in use plus the allocated reserved and provisioned concurrency. Lambda uses it to decide what remains for on-demand invocations, so an alarm on its Maximum at 70 percent of the quota warns before throttling."
    fr: "`ClaimedAccountConcurrency` représente la simultanéité qui n'est pas disponible pour les appels à la demande : la simultanéité non réservée utilisée plus la simultanéité réservée et provisionnée allouée. Lambda s'en sert pour déterminer ce qui reste aux appels à la demande : une alarme sur son maximum à 70 % du quota avertit avant la limitation."
  options:
    b:
      en: "`ConcurrentExecutions` counts only active invocations and ignores unused reserved and provisioned concurrency, which is why the dashboard looked low before the throttling."
      fr: "`ConcurrentExecutions` ne compte que les appels actifs et ignore la simultanéité réservée et provisionnée inutilisée, d'où les faibles valeurs du tableau de bord avant la limitation."
    c:
      en: "Spillover invocations show that a function's provisioned concurrency is full, not that the account is near its quota."
      fr: "Les appels de débordement montrent que la simultanéité provisionnée d'une fonction est saturée, pas que le compte approche de son quota."
    d:
      en: "Provisioned concurrency utilization measures how much of one function's provisioned environments are busy; it says nothing about the account-level limit."
      fr: "L'utilisation de la simultanéité provisionnée mesure l'occupation des environnements provisionnés d'une fonction ; elle n'indique rien sur la limite au niveau du compte."
references:
  - title: Monitoring concurrency
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-concurrency.html
