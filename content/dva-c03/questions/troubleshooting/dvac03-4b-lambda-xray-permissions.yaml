id: dvac03-4b-lambda-xray-permissions
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer turns on active tracing for an AWS Lambda function with the `aws lambda update-function-configuration --tracing-config Mode=Active` command. The function runs successfully, but no traces for it appear in AWS X-Ray. The execution role allows only CloudWatch Logs and Amazon DynamoDB actions.

    Which solution will make the traces appear?
  fr: |
    Un développeur active le traçage actif d'une fonction AWS Lambda avec la commande `aws lambda update-function-configuration --tracing-config Mode=Active`. La fonction s'exécute correctement, mais aucune trace n'apparaît pour elle dans AWS X-Ray. Le rôle d'exécution n'autorise que des actions CloudWatch Logs et Amazon DynamoDB.

    Quelle solution fait apparaître les traces ?
body:
  options:
    - { id: a, text: { en: "Attach the `AWSXRayDaemonWriteAccess` managed policy to the execution role.", fr: "Attacher la politique gérée `AWSXRayDaemonWriteAccess` au rôle d'exécution." } }
    - { id: b, text: { en: "Attach the `AWSXrayReadOnlyAccess` managed policy to the execution role.", fr: "Attacher la politique gérée `AWSXrayReadOnlyAccess` au rôle d'exécution." } }
    - { id: c, text: { en: "Add a statement to the function's resource-based policy that allows `xray.amazonaws.com` to invoke it.", fr: "Ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise `xray.amazonaws.com` à l'appeler." } }
    - { id: d, text: { en: "Publish a new version of the function, because tracing applies only to published versions.", fr: "Publier une nouvelle version de la fonction, car le traçage ne s'applique qu'aux versions publiées." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The execution role needs `xray:PutTraceSegments` and `xray:PutTelemetryRecords` to upload trace data. The console adds them when it turns on tracing, but the CLI does not; the `AWSXRayDaemonWriteAccess` managed policy grants both."
    fr: "Le rôle d'exécution a besoin de `xray:PutTraceSegments` et `xray:PutTelemetryRecords` pour charger les données de trace. La console les ajoute quand elle active le traçage, mais pas la CLI ; la politique gérée `AWSXRayDaemonWriteAccess` accorde les deux."
  options:
    b:
      en: "Read-only access lets a principal view traces, not upload them."
      fr: "Un accès en lecture seule permet de consulter les traces, pas de les charger."
    c:
      en: "X-Ray never invokes the function; the function's role must be allowed to send trace data."
      fr: "X-Ray n'appelle jamais la fonction ; c'est le rôle de la fonction qui doit être autorisé à envoyer les données de trace."
    d:
      en: "Tracing also applies to the unpublished `$LATEST` version; the missing permissions are the problem."
      fr: "Le traçage s'applique aussi à la version non publiée `$LATEST` ; ce sont les autorisations manquantes qui posent problème."
references:
  - title: Visualize Lambda Event Function invocations using AWS X-Ray
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-xray.html
