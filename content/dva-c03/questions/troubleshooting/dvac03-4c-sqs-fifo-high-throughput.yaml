id: dvac03-4c-sqs-fifo-high-throughput
objective: "4.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany processes account transactions through an Amazon SQS FIFO queue. Transactions must be processed in order for each account, but there is no ordering requirement between different accounts. The producer sets the MessageGroupId of every message to the constant value `transactions`. The queue now needs to support more than the default FIFO throughput quota, and consumers must be able to process several accounts in parallel.

    Which two actions should a developer take? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    AnyCompany traite les transactions de comptes via une file d'attente FIFO Amazon SQS. Les transactions doivent être traitées dans l'ordre pour chaque compte, mais aucun ordre n'est exigé entre comptes différents. L'éditeur définit le MessageGroupId de chaque message à la valeur constante `transactions`. La file d'attente doit désormais dépasser le quota de débit FIFO par défaut, et les consommateurs doivent pouvoir traiter plusieurs comptes en parallèle.

    Quelles sont les deux actions qu'un développeur doit effectuer ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the MessageGroupId of each message to the account ID of the transaction.", fr: "Définir le MessageGroupId de chaque message sur l'ID du compte de la transaction." } }
    - { id: b, text: { en: "Remove the MessageGroupId from the messages and turn on content-based deduplication.", fr: "Supprimer le MessageGroupId des messages et activer la déduplication basée sur le contenu." } }
    - { id: c, text: { en: "Replace the FIFO queue with a standard queue and keep the same consumers.", fr: "Remplacer la file d'attente FIFO par une file d'attente standard et conserver les mêmes consommateurs." } }
    - { id: d, text: { en: "Set DeduplicationScope to messageGroup and FifoThroughputLimit to perMessageGroupId on the queue.", fr: "Définir DeduplicationScope sur messageGroup et FifoThroughputLimit sur perMessageGroupId pour la file d'attente." } }
    - { id: e, text: { en: "Increase the visibility timeout of the queue to give consumers more time.", fr: "Augmenter le délai de visibilité de la file d'attente pour donner plus de temps aux consommateurs." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "SQS keeps order within a message group and hashes the MessageGroupId to choose a partition, so a single constant group ID serializes all messages. Using the account ID keeps per-account order while letting consumers process different groups in parallel. Setting DeduplicationScope to messageGroup and FifoThroughputLimit to perMessageGroupId turns on high throughput mode, which raises the quota beyond the default FIFO limit."
    fr: "SQS préserve l'ordre au sein d'un groupe de messages et hache le MessageGroupId pour choisir une partition : un seul ID de groupe constant sérialise donc tous les messages. Utiliser l'ID de compte conserve l'ordre par compte tout en permettant aux consommateurs de traiter différents groupes en parallèle. Définir DeduplicationScope sur messageGroup et FifoThroughputLimit sur perMessageGroupId active le mode de débit élevé, qui relève le quota au-delà de la limite FIFO par défaut."
  options:
    b:
      en: "MessageGroupId is required for every message sent to a FIFO queue; content-based deduplication only removes duplicates and does not increase throughput."
      fr: "Le MessageGroupId est obligatoire pour chaque message envoyé à une file d'attente FIFO ; la déduplication basée sur le contenu supprime seulement les doublons et n'augmente pas le débit."
    c:
      en: "A standard queue does not guarantee order, so the per-account ordering requirement would no longer be met."
      fr: "Une file d'attente standard ne garantit pas l'ordre : l'exigence d'ordre par compte ne serait donc plus respectée."
    e:
      en: "A longer visibility timeout only changes how long received messages stay hidden; it does not add parallelism or throughput."
      fr: "Un délai de visibilité plus long change seulement la durée pendant laquelle les messages reçus restent masqués ; il n'ajoute ni parallélisme ni débit."
references:
  - title: High throughput for FIFO queues in Amazon SQS
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/high-throughput-fifo.html
