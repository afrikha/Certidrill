id: dvac03-4b-putmetricdata-dimension
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python application on Amazon EC2 processes orders for AnyCompany. The developers must publish a custom Amazon CloudWatch metric named `OrdersProcessed` each time an order is processed, so that they can graph the count separately for each payment method.

    Which boto3 call will meet these requirements?
  fr: |
    Une application Python sur Amazon EC2 traite les commandes d'AnyCompany. Les développeurs doivent publier une métrique personnalisée Amazon CloudWatch nommée `OrdersProcessed` à chaque commande traitée, afin de représenter le nombre de commandes séparément pour chaque moyen de paiement.

    Quel appel boto3 répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "`cloudwatch.put_metric_data(Namespace=\"AnyCompany/Orders\", MetricData=[{\"MetricName\": \"OrdersProcessed\", \"Dimensions\": [{\"Name\": \"PaymentMethod\", \"Value\": method}], \"Value\": 1, \"Unit\": \"Count\"}])`", fr: "`cloudwatch.put_metric_data(Namespace=\"AnyCompany/Orders\", MetricData=[{\"MetricName\": \"OrdersProcessed\", \"Dimensions\": [{\"Name\": \"PaymentMethod\", \"Value\": method}], \"Value\": 1, \"Unit\": \"Count\"}])`" } }
    - { id: b, text: { en: "`cloudwatch.put_metric_alarm(AlarmName=\"OrdersProcessed\", Namespace=\"AnyCompany/Orders\", MetricName=\"OrdersProcessed\", Dimensions=[{\"Name\": \"PaymentMethod\", \"Value\": method}], ...)`", fr: "`cloudwatch.put_metric_alarm(AlarmName=\"OrdersProcessed\", Namespace=\"AnyCompany/Orders\", MetricName=\"OrdersProcessed\", Dimensions=[{\"Name\": \"PaymentMethod\", \"Value\": method}], ...)`" } }
    - { id: c, text: { en: "`cloudwatch.put_metric_data(Namespace=\"AnyCompany/Orders\", MetricData=[{\"MetricName\": \"OrdersProcessed-\" + method, \"Value\": method, \"Unit\": \"Count\"}])`", fr: "`cloudwatch.put_metric_data(Namespace=\"AnyCompany/Orders\", MetricData=[{\"MetricName\": \"OrdersProcessed-\" + method, \"Value\": method, \"Unit\": \"Count\"}])`" } }
    - { id: d, text: { en: "`cloudwatch.get_metric_data(MetricDataQueries=[{\"Id\": \"orders\", \"MetricStat\": {\"Metric\": {\"Namespace\": \"AnyCompany/Orders\", \"MetricName\": \"OrdersProcessed\"}, \"Period\": 60, \"Stat\": \"Sum\"}}], ...)`", fr: "`cloudwatch.get_metric_data(MetricDataQueries=[{\"Id\": \"orders\", \"MetricStat\": {\"Metric\": {\"Namespace\": \"AnyCompany/Orders\", \"MetricName\": \"OrdersProcessed\"}, \"Period\": 60, \"Stat\": \"Sum\"}}], ...)`" } }
answer: { optionId: a }
explanation:
  correct:
    en: "`PutMetricData` publishes custom metric data points in a namespace of your choice. A `PaymentMethod` dimension makes CloudWatch store a separate metric for each payment method value, and a value of 1 with the `Count` unit can be summed per period."
    fr: "`PutMetricData` publie des points de données de métrique personnalisée dans l'espace de noms de votre choix. Une dimension `PaymentMethod` fait stocker par CloudWatch une métrique distincte pour chaque moyen de paiement, et une valeur de 1 avec l'unité `Count` peut être additionnée par période."
  options:
    b:
      en: "`PutMetricAlarm` creates or updates an alarm that watches a metric; it publishes no data points."
      fr: "`PutMetricAlarm` crée ou met à jour une alarme qui surveille une métrique ; il ne publie aucun point de données."
    c:
      en: "A metric value must be a number, not the payment method string, and putting the method in the metric name creates unrelated metrics instead of using a dimension."
      fr: "Une valeur de métrique doit être un nombre, pas la chaîne du moyen de paiement, et placer le moyen dans le nom de la métrique crée des métriques sans lien au lieu d'utiliser une dimension."
    d:
      en: "`GetMetricData` reads metric data; it does not publish anything."
      fr: "`GetMetricData` lit des données de métrique ; il ne publie rien."
references:
  - title: Publish custom metrics (PutMetricData / EMF)
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/publishingMetrics.html
  - title: PutMetricData
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutMetricData.html
