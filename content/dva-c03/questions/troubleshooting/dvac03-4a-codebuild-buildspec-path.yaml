id: dvac03-4a-codebuild-buildspec-path
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team moves its build file from the root of its repository to ci/buildspec.yml. The AWS CodeBuild project that builds the repository uses the default buildspec settings. After the change, every build fails, and the build log reports a YAML_FILE_ERROR stating that no buildspec file was found. The team wants to keep the file in the ci folder.

    Which solution will fix the builds?
  fr: |
    Une équipe déplace son fichier de génération de la racine de son référentiel vers ci/buildspec.yml. Le projet AWS CodeBuild qui génère le référentiel utilise les paramètres buildspec par défaut. Depuis ce changement, chaque génération échoue, et le journal de génération signale une erreur YAML_FILE_ERROR indiquant qu'aucun fichier buildspec n'a été trouvé. L'équipe veut conserver le fichier dans le dossier ci.

    Quelle solution corrige les générations ?
body:
  options:
    - { id: a, text: { en: "Rename the file to ci/buildspec.yaml so that CodeBuild detects it.", fr: "Renommer le fichier en ci/buildspec.yaml pour que CodeBuild le détecte." } }
    - { id: b, text: { en: "Add an env section that sets CODEBUILD_SRC_DIR to the ci folder.", fr: "Ajouter une section env qui définit CODEBUILD_SRC_DIR sur le dossier ci." } }
    - { id: c, text: { en: "Set the buildspec name of the project to ci/buildspec.yml.", fr: "Définir le nom du buildspec du projet sur ci/buildspec.yml." } }
    - { id: d, text: { en: "Add a finally block to the install phase that copies the file to the root.", fr: "Ajouter un bloc finally à la phase install qui copie le fichier à la racine." } }
answer: { optionId: c }
explanation:
  correct:
    en: "By default, a buildspec included with the source must be named buildspec.yml and placed at the root of the source directory. To use another name or location, the project buildspec setting, or buildspecOverride for a single build, must give the path relative to CODEBUILD_SRC_DIR."
    fr: "Par défaut, un buildspec fourni avec le code source doit s'appeler buildspec.yml et se trouver à la racine du répertoire source. Pour utiliser un autre nom ou un autre emplacement, le paramètre buildspec du projet, ou buildspecOverride pour une seule génération, doit indiquer le chemin relatif à CODEBUILD_SRC_DIR."
  options:
    a:
      en: "Changing the extension does not move the file to the root, and the default name is buildspec.yml."
      fr: "Changer l'extension ne déplace pas le fichier à la racine, et le nom par défaut est buildspec.yml."
    b:
      en: "The env section is inside the buildspec itself, which CodeBuild cannot find; it cannot tell CodeBuild where the file is."
      fr: "La section env se trouve dans le buildspec lui-même, que CodeBuild ne trouve pas ; elle ne peut pas indiquer à CodeBuild où se trouve le fichier."
    d:
      en: "Phases are defined in the buildspec, so no command runs before the file is found."
      fr: "Les phases sont définies dans le buildspec : aucune commande ne s'exécute avant que le fichier soit trouvé."
references:
  - title: Build specification reference for CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
