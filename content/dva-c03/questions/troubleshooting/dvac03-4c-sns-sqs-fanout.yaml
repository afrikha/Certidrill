id: dvac03-4c-sns-sqs-fanout
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    When an order is placed, AnyCompany's order service calls the billing, shipping, and analytics services one after another. Slow or unavailable services delay the order confirmation. The company wants to decouple the services. Each service must receive every order event, process the events at its own pace, and keep the events while the service is offline for maintenance for up to one day.

    Which solution will meet these requirements?
  fr: |
    Lorsqu'une commande est passée, le service de commandes d'AnyCompany appelle successivement les services de facturation, d'expédition et d'analyse. Les services lents ou indisponibles retardent la confirmation de commande. L'entreprise veut découpler les services. Chaque service doit recevoir chaque événement de commande, traiter les événements à son propre rythme et conserver les événements pendant que le service est hors ligne pour maintenance, jusqu'à une journée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Send each order event to one Amazon SQS standard queue that the three services poll.", fr: "Envoyer chaque événement de commande vers une seule file d'attente standard Amazon SQS interrogée par les trois services." }
    - id: b
      text: { en: "Publish each order event to an Amazon SNS topic, and subscribe one Amazon SQS queue for each service.", fr: "Publier chaque événement de commande dans une rubrique Amazon SNS et y abonner une file d'attente Amazon SQS par service." }
    - id: c
      text: { en: "Publish each order event to an Amazon SNS topic, and subscribe the HTTPS endpoint of each service.", fr: "Publier chaque événement de commande dans une rubrique Amazon SNS et y abonner le point de terminaison HTTPS de chaque service." }
    - id: d
      text: { en: "Send each order event to an Amazon SQS FIFO queue, with one message group ID for each service.", fr: "Envoyer chaque événement de commande vers une file d'attente FIFO Amazon SQS, avec un ID de groupe de messages par service." }
answer: { optionId: b }
explanation:
  correct:
    en: "In the SNS-to-SQS fan-out pattern, SNS delivers a copy of each published message to every subscribed queue. Each service reads its own queue at its own pace, and the queue stores the messages while the service is offline, because SQS retains messages for 4 days by default."
    fr: "Dans le modèle de diffusion (fan-out) SNS vers SQS, SNS livre une copie de chaque message publié à chaque file d'attente abonnée. Chaque service lit sa propre file d'attente à son rythme, et la file d'attente stocke les messages pendant que le service est hors ligne, car SQS conserve les messages 4 jours par défaut."
  options:
    a:
      en: "With one shared queue, each message is processed by only one consumer, so the three services would not each receive every event."
      fr: "Avec une seule file d'attente partagée, chaque message n'est traité que par un consommateur : les trois services ne recevraient donc pas chacun tous les événements."
    c:
      en: "SNS pushes messages to HTTPS endpoints and does not store them for the subscriber; a service offline for a day would miss events once delivery retries end."
      fr: "SNS pousse les messages vers les points de terminaison HTTPS et ne les stocke pas pour l'abonné ; un service hors ligne pendant une journée manquerait des événements une fois les nouvelles tentatives de livraison terminées."
    d:
      en: "A FIFO queue still delivers each message to only one consumer; message group IDs order messages, they do not copy them to several services."
      fr: "Une file d'attente FIFO livre toujours chaque message à un seul consommateur ; les ID de groupe de messages ordonnent les messages, ils ne les copient pas vers plusieurs services."
references:
  - title: Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
  - title: Amazon SQS message quotas
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
