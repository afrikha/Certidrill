id: dvac03-4b-rds-proxy-connection-pooling
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's AWS Lambda functions connect to an Amazon RDS for MySQL DB instance. During traffic spikes, hundreds of concurrent invocations each open a connection, and the database returns "Too many connections" errors. The functions must keep their concurrency, the DB instance class must not change, and the code changes must be minimal.

    Which solution will meet these requirements?
  fr: |
    Les fonctions AWS Lambda d'AnyCompany se connectent à une instance de base de données Amazon RDS for MySQL. Lors des pics de trafic, des centaines d'appels simultanés ouvrent chacun une connexion, et la base renvoie des erreurs « Too many connections ». Les fonctions doivent conserver leur simultanéité, la classe d'instance de base de données ne doit pas changer, et les modifications de code doivent être minimales.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon RDS Proxy for the DB instance and change the functions to connect to the proxy endpoint.", fr: "Créer un Amazon RDS Proxy pour l'instance de base de données et modifier les fonctions pour qu'elles se connectent au point de terminaison du proxy." } }
    - { id: b, text: { en: "Set the reserved concurrency of each function so that the total stays below the database's connection limit.", fr: "Définir la simultanéité réservée de chaque fonction pour que le total reste sous la limite de connexions de la base." } }
    - { id: c, text: { en: "Open the connection inside the handler and close it at the end of every invocation.", fr: "Ouvrir la connexion dans le gestionnaire et la fermer à la fin de chaque appel." } }
    - { id: d, text: { en: "Create a read replica and send all the queries of half of the functions to it.", fr: "Créer un réplica en lecture et y envoyer toutes les requêtes de la moitié des fonctions." } }
answer: { optionId: a }
explanation:
  correct:
    en: "RDS Proxy keeps a pool of database connections and lets many client connections share them, so connection surges do not exhaust the database; when needed it queues or throttles requests instead. The functions only change the endpoint that they connect to."
    fr: "RDS Proxy conserve un groupe de connexions à la base de données et permet à de nombreuses connexions clientes de les partager : les pics de connexions n'épuisent pas la base ; si nécessaire, il met les requêtes en file d'attente ou les limite. Les fonctions changent seulement le point de terminaison auquel elles se connectent."
  options:
    b:
      en: "Capping concurrency reduces throughput, which breaks the requirement to keep the functions' concurrency."
      fr: "Plafonner la simultanéité réduit le débit, ce qui enfreint l'exigence de conserver la simultanéité des fonctions."
    c:
      en: "Every concurrent invocation still holds one connection, and opening a new connection each time adds overhead to the database."
      fr: "Chaque appel simultané détient toujours une connexion, et en ouvrir une nouvelle à chaque fois ajoute une charge à la base."
    d:
      en: "Read replicas serve only reads, so write queries would fail, and the code would need routing changes."
      fr: "Les réplicas en lecture ne servent que les lectures : les requêtes d'écriture échoueraient, et le code exigerait des modifications de routage."
references:
  - title: Amazon RDS Proxy
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html
