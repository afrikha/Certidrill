id: dvac03-4b-cfn-stack-status-event
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany updates a production AWS CloudFormation stack several times each week. The developers want one email when a stack update finishes, either successfully or with a rollback. They do not want messages for the individual resources of the stack. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany met à jour une pile AWS CloudFormation de production plusieurs fois par semaine. Les développeurs veulent un e-mail quand une mise à jour de la pile se termine, avec succès ou par une restauration. Ils ne veulent pas de messages pour les ressources individuelles de la pile. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the notification options of the stack to an Amazon SNS topic that has email subscriptions for the developers.", fr: "Définir les options de notification de la pile sur une rubrique Amazon SNS qui a des abonnements e-mail pour les développeurs." } }
    - { id: b, text: { en: "Schedule an AWS Lambda function every minute that calls `DescribeStacks` and publishes to Amazon SNS when the status changes.", fr: "Planifier chaque minute une fonction AWS Lambda qui appelle `DescribeStacks` et publie dans Amazon SNS quand le statut change." } }
    - { id: c, text: { en: "Create an Amazon EventBridge rule for the stack's status change events with the final update statuses, targeting Amazon SNS.", fr: "Créer une règle Amazon EventBridge pour les événements de changement de statut de la pile avec les statuts finaux de mise à jour, avec Amazon SNS pour cible." } }
    - { id: d, text: { en: "Create a CloudWatch Logs metric filter on CloudTrail logs for `UpdateStack` calls with an alarm that notifies Amazon SNS.", fr: "Créer un filtre de métrique CloudWatch Logs sur les journaux CloudTrail pour les appels `UpdateStack`, avec une alarme qui notifie Amazon SNS." } }
answer: { optionId: c }
explanation:
  correct:
    en: "CloudFormation sends stack and resource status change events to the EventBridge default event bus without extra permissions. A rule that matches only the stack status change events with the final update statuses sends one message per update to the SNS topic."
    fr: "CloudFormation envoie les événements de changement de statut de pile et de ressource au bus d'événements par défaut d'EventBridge sans autorisation supplémentaire. Une règle qui ne correspond qu'aux événements de changement de statut de la pile avec les statuts finaux de mise à jour envoie un message par mise à jour à la rubrique SNS."
  options:
    a:
      en: "Stack notifications publish every stack event, including each resource's status changes, which the developers do not want."
      fr: "Les notifications de pile publient chaque événement de la pile, y compris les changements de statut de chaque ressource, ce que les développeurs ne veulent pas."
    b:
      en: "Polling works but adds a function, a schedule and state tracking to maintain."
      fr: "L'interrogation périodique fonctionne, mais ajoute une fonction, une planification et un suivi d'état à maintenir."
    d:
      en: "`UpdateStack` is recorded when the update starts, not when it finishes or rolls back."
      fr: "`UpdateStack` est enregistré au démarrage de la mise à jour, pas quand elle se termine ou est restaurée."
references:
  - title: Monitoring CloudFormation and Git sync events with EventBridge
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/eventbridge-integration.html
