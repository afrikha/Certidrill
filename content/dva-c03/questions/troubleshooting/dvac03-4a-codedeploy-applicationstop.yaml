id: dvac03-4a-codedeploy-applicationstop
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application is deployed to Amazon EC2 instances with AWS CodeDeploy. Revision 7 shipped a stop_server.sh script for the ApplicationStop lifecycle event that always exits with an error, but the deployment of revision 7 succeeded. The developer fixes the script in revision 8. The deployment of revision 8 fails on every instance at the ApplicationStop event, and the deployment logs show the error from the old version of stop_server.sh.

    Which solution will allow revision 8 to be deployed?
  fr: |
    Une application est déployée sur des instances Amazon EC2 avec AWS CodeDeploy. La révision 7 a livré, pour l'événement de cycle de vie ApplicationStop, un script stop_server.sh qui se termine toujours par une erreur, mais le déploiement de la révision 7 a réussi. Le développeur corrige le script dans la révision 8. Le déploiement de la révision 8 échoue sur chaque instance à l'événement ApplicationStop, et les journaux de déploiement montrent l'erreur de l'ancienne version de stop_server.sh.

    Quelle solution permet de déployer la révision 8 ?
body:
  options:
    - { id: a, text: { en: "Increase the timeout of the ApplicationStop hook in the AppSpec file of revision 8.", fr: "Augmenter le délai d'expiration du hook ApplicationStop dans le fichier AppSpec de la révision 8." } }
    - { id: b, text: { en: "Redeploy revision 8 with the option to not fail the deployment when the ApplicationStop event fails on an instance.", fr: "Redéployer la révision 8 avec l'option qui ne fait pas échouer le déploiement lorsque l'événement ApplicationStop échoue sur une instance." } }
    - { id: c, text: { en: "Choose the overwrite option for existing content in the deployment of revision 8.", fr: "Choisir l'option de remplacement du contenu existant dans le déploiement de la révision 8." } }
    - { id: d, text: { en: "Move the stop logic of revision 8 from ApplicationStop to the BeforeBlockTraffic event.", fr: "Déplacer la logique d'arrêt de la révision 8 de ApplicationStop vers l'événement BeforeBlockTraffic." } }
answer: { optionId: b }
explanation:
  correct:
    en: "ApplicationStop, BeforeBlockTraffic and AfterBlockTraffic run the scripts of the AppSpec file from the last successful deployment, so the broken script of revision 7 still runs. Deploying once with the ignore option, or --ignore-application-stop-failures in the CLI, lets revision 8 install; later deployments then run the fixed script."
    fr: "ApplicationStop, BeforeBlockTraffic et AfterBlockTraffic exécutent les scripts du fichier AppSpec du dernier déploiement réussi : le script défectueux de la révision 7 s'exécute donc toujours. Déployer une fois avec l'option d'ignorance de l'échec, ou --ignore-application-stop-failures dans la CLI, permet d'installer la révision 8 ; les déploiements suivants exécutent ensuite le script corrigé."
  options:
    a:
      en: "The AppSpec file of revision 8 is not used for ApplicationStop, and the old script fails rather than timing out."
      fr: "Le fichier AppSpec de la révision 8 n'est pas utilisé pour ApplicationStop, et l'ancien script échoue au lieu d'expirer."
    c:
      en: "The overwrite option resolves the error for files that already exist at the destination, not a failing lifecycle script."
      fr: "L'option de remplacement résout l'erreur liée aux fichiers déjà présents à la destination, pas l'échec d'un script de cycle de vie."
    d:
      en: "BeforeBlockTraffic also runs scripts from the last successful deployment, and the old ApplicationStop script still runs."
      fr: "BeforeBlockTraffic exécute lui aussi les scripts du dernier déploiement réussi, et l'ancien script ApplicationStop s'exécute toujours."
references:
  - title: Troubleshoot EC2/On-Premises deployment issues
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-deployments.html
