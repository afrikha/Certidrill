id: dvac03-4b-log-retention-policy
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany stores application logs in an Amazon CloudWatch Logs log group that was created with the default settings. The storage cost grows every month. A compliance rule states that application log events must be kept for 30 days and then deleted automatically. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke des journaux d'application dans un groupe de journaux Amazon CloudWatch Logs créé avec les paramètres par défaut. Le coût de stockage augmente chaque mois. Une règle de conformité impose de conserver les événements de journal de l'application pendant 30 jours, puis de les supprimer automatiquement. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Schedule an AWS Lambda function that deletes log streams older than 30 days every night.", fr: "Planifier une fonction AWS Lambda qui supprime chaque nuit les flux de journaux de plus de 30 jours." } }
    - { id: b, text: { en: "Add a subscription filter that delivers the events to Amazon S3 through Amazon Data Firehose, with a 30-day S3 Lifecycle expiration.", fr: "Ajouter un filtre d'abonnement qui livre les événements à Amazon S3 au moyen d'Amazon Data Firehose, avec une expiration S3 Lifecycle à 30 jours." } }
    - { id: c, text: { en: "Export the log group to Amazon S3 every day and add an S3 Lifecycle rule that expires objects after 30 days.", fr: "Exporter chaque jour le groupe de journaux vers Amazon S3 et ajouter une règle S3 Lifecycle qui fait expirer les objets après 30 jours." } }
    - { id: d, text: { en: "Set the retention of the log group to 30 days with the `aws logs put-retention-policy` command.", fr: "Définir la conservation du groupe de journaux sur 30 jours avec la commande `aws logs put-retention-policy`." } }
answer: { optionId: d }
explanation:
  correct:
    en: "By default, CloudWatch Logs keeps log data indefinitely (Never Expire). A retention setting of 30 days on the log group makes CloudWatch Logs delete older events automatically, with no code or schedule to maintain."
    fr: "Par défaut, CloudWatch Logs conserve les données de journal indéfiniment (Never Expire). Une conservation de 30 jours sur le groupe de journaux fait supprimer automatiquement les événements plus anciens par CloudWatch Logs, sans code ni planification à maintenir."
  options:
    a:
      en: "A custom cleanup function works only at the stream level, must be written and run, and adds overhead that the built-in retention setting avoids."
      fr: "Une fonction de nettoyage personnalisée ne travaille qu'au niveau des flux, doit être écrite et exploitée, et ajoute une charge que le paramètre de conservation intégré évite."
    b:
      en: "The events are copied to S3, but the originals stay in the log group forever, so the CloudWatch Logs storage keeps growing."
      fr: "Les événements sont copiés dans S3, mais les originaux restent indéfiniment dans le groupe de journaux : le stockage CloudWatch Logs continue d'augmenter."
    c:
      en: "Exporting copies the data and leaves the events in the log group, so nothing is deleted from CloudWatch Logs."
      fr: "L'exportation copie les données et laisse les événements dans le groupe de journaux : rien n'est supprimé de CloudWatch Logs."
references:
  - title: Working with log groups and log streams
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Working-with-log-groups-and-streams.html
