id: dvac03-4b-alarm-lambda-errors-email
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's on-call developers must receive an email when an AWS Lambda function named `invoice-builder` returns more than 5 errors within 5 minutes. The function is invoked synchronously by an Amazon API Gateway API.

    Which solution will meet these requirements?
  fr: |
    Les développeurs d'astreinte d'AnyCompany doivent recevoir un e-mail quand une fonction AWS Lambda nommée `invoice-builder` renvoie plus de 5 erreurs en 5 minutes. La fonction est appelée de façon synchrone par une API Amazon API Gateway.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure an on-failure destination on the function that sends a record of each failed invocation to an Amazon SNS topic with email subscriptions.", fr: "Configurer sur la fonction une destination en cas d'échec qui envoie un enregistrement de chaque appel échoué vers une rubrique Amazon SNS avec des abonnements e-mail." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the function's `Errors` metric (Sum over 300 seconds, threshold 5) whose action is an Amazon SNS topic with email subscriptions.", fr: "Créer une alarme CloudWatch sur la métrique `Errors` de la fonction (Sum sur 300 secondes, seuil de 5) dont l'action est une rubrique Amazon SNS avec des abonnements e-mail." } }
    - { id: c, text: { en: "Create a metric filter that counts `ERROR` lines in the function's log group, and subscribe the on-call email addresses to the metric filter.", fr: "Créer un filtre de métrique qui compte les lignes `ERROR` dans le groupe de journaux de la fonction, et abonner les adresses e-mail d'astreinte au filtre de métrique." } }
    - { id: d, text: { en: "Create an Amazon EventBridge rule that matches failed invocation events of the function and targets an Amazon SNS topic with email subscriptions.", fr: "Créer une règle Amazon EventBridge qui correspond aux événements d'appel échoué de la fonction et cible une rubrique Amazon SNS avec des abonnements e-mail." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Lambda publishes the `Errors` metric in the `AWS/Lambda` namespace. A CloudWatch alarm with the Sum statistic over a 300-second period and a threshold of 5 enters the ALARM state when the condition is met and sends a notification to the SNS topic, which emails its confirmed subscribers."
    fr: "Lambda publie la métrique `Errors` dans l'espace de noms `AWS/Lambda`. Une alarme CloudWatch avec la statistique Sum sur une période de 300 secondes et un seuil de 5 passe à l'état ALARM quand la condition est remplie et envoie une notification à la rubrique SNS, qui transmet un e-mail à ses abonnés confirmés."
  options:
    a:
      en: "Destinations apply to asynchronous invocations, not to synchronous calls from API Gateway, and they would send one message per failure instead of a threshold alert."
      fr: "Les destinations s'appliquent aux appels asynchrones, pas aux appels synchrones depuis API Gateway, et elles enverraient un message par échec au lieu d'une alerte sur seuil."
    c:
      en: "A metric filter creates a metric but sends no notification; people cannot subscribe to a filter, and an alarm would still be needed."
      fr: "Un filtre de métrique crée une métrique mais n'envoie aucune notification ; on ne peut pas s'abonner à un filtre, et une alarme resterait nécessaire."
    d:
      en: "Lambda does not send an event to EventBridge for each failed synchronous invocation, and a rule cannot count errors over 5 minutes."
      fr: "Lambda n'envoie pas d'événement à EventBridge pour chaque appel synchrone échoué, et une règle ne peut pas compter les erreurs sur 5 minutes."
references:
  - title: Using Amazon CloudWatch alarms
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html
