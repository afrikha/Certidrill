id: dvac03-4b-otel-attribute-annotation
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany instruments a Java service with the AWS Distro for OpenTelemetry (ADOT) and sends the traces to AWS X-Ray. The developers add a span attribute named `customer_tier` to each request span. In the X-Ray console, the value appears in the span details, but a filter expression on `annotation.customer_tier = "gold"` returns no traces.

    Which solution will let the developers filter traces by `customer_tier`?
  fr: |
    AnyCompany instrumente un service Java avec AWS Distro for OpenTelemetry (ADOT) et envoie les traces vers AWS X-Ray. Les développeurs ajoutent un attribut de span nommé `customer_tier` à chaque span de requête. Dans la console X-Ray, la valeur apparaît dans le détail du span, mais une expression de filtre sur `annotation.customer_tier = "gold"` ne renvoie aucune trace.

    Quelle solution permet aux développeurs de filtrer les traces par `customer_tier` ?
body:
  options:
    - { id: a, text: { en: "Increase the fixed rate of the sampling rule to 100 percent so that every request with the attribute is recorded.", fr: "Augmenter le taux fixe de la règle d'échantillonnage à 100 % pour que chaque requête portant l'attribut soit enregistrée." } }
    - { id: b, text: { en: "Put the tier value in the name of each request span so that it can be searched.", fr: "Placer la valeur du niveau dans le nom de chaque span de requête pour pouvoir la rechercher." } }
    - { id: c, text: { en: "Record the value with the X-Ray SDK `putMetadata` method instead of a span attribute.", fr: "Enregistrer la valeur avec la méthode `putMetadata` du SDK X-Ray au lieu d'un attribut de span." } }
    - { id: d, text: { en: "Add `customer_tier` to the `aws.xray.annotations` attribute list of the span.", fr: "Ajouter `customer_tier` à la liste d'attributs `aws.xray.annotations` du span." } }
answer: { optionId: d }
explanation:
  correct:
    en: "X-Ray indexes annotations for filter expressions but does not index metadata. By default, OpenTelemetry span attributes are converted to X-Ray metadata; listing the key in the `aws.xray.annotations` attribute makes it an annotation that filter expressions can use."
    fr: "X-Ray indexe les annotations pour les expressions de filtre, mais pas les métadonnées. Par défaut, les attributs de span OpenTelemetry sont convertis en métadonnées X-Ray ; inscrire la clé dans l'attribut `aws.xray.annotations` en fait une annotation utilisable dans les expressions de filtre."
  options:
    a:
      en: "Sampling decides which requests are traced; the value would still be stored as unindexed metadata."
      fr: "L'échantillonnage décide quelles requêtes sont tracées ; la valeur serait toujours stockée comme métadonnée non indexée."
    b:
      en: "Span names identify operations; putting a data value in them breaks grouping and still does not create an annotation."
      fr: "Les noms de span identifient des opérations ; y placer une valeur de données casse le regroupement et ne crée toujours pas d'annotation."
    c:
      en: "Metadata is not indexed in either case, and the X-Ray SDKs are in maintenance mode, so moving back to them goes against AWS guidance."
      fr: "Les métadonnées ne sont indexées dans aucun cas, et les SDK X-Ray sont en mode maintenance : y revenir va à l'encontre des recommandations d'AWS."
references:
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
