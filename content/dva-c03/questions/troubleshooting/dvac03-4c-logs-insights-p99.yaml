id: dvac03-4c-logs-insights-p99
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer wants to find when an AWS Lambda function becomes slow. The developer needs a CloudWatch Logs Insights query on the function's log group that returns the 99th percentile of the invocation duration for each 5-minute interval.

    Which query will meet these requirements?
  fr: |
    Un développeur veut savoir à quels moments une fonction AWS Lambda devient lente. Il a besoin d'une requête CloudWatch Logs Insights sur le groupe de journaux de la fonction qui renvoie le 99e centile de la durée d'invocation pour chaque intervalle de 5 minutes.

    Quelle requête répond à ces exigences ?
body:
  options:
    - id: a
      text: "`filter @type = \"REPORT\" | stats max(@duration) by bin(5m)`"
    - id: b
      text: "`filter @type = \"REPORT\" | sort @duration desc | limit 99`"
    - id: c
      text: "`filter @type = \"REPORT\" | stats pct(@duration, 99) by bin(5m)`"
    - id: d
      text: "`filter @type = \"START\" | stats pct(@duration, 99) by bin(5m)`"
answer: { optionId: c }
explanation:
  correct:
    en: "Lambda writes a REPORT line with the @duration field at the end of each invocation. The stats command with pct(@duration, 99) returns the value below which 99 percent of the durations fall, and grouping by bin(5m) produces one value for each 5-minute interval."
    fr: "Lambda écrit une ligne REPORT avec le champ @duration à la fin de chaque invocation. La commande stats avec pct(@duration, 99) renvoie la valeur en dessous de laquelle se trouvent 99 % des durées, et le regroupement par bin(5m) produit une valeur par intervalle de 5 minutes."
  options:
    a:
      en: "max(@duration) returns the slowest invocation of each interval, not the 99th percentile."
      fr: "max(@duration) renvoie l'invocation la plus lente de chaque intervalle, pas le 99e centile."
    b:
      en: "This query lists the 99 slowest invocations overall; it computes no percentile and no 5-minute intervals."
      fr: "Cette requête liste les 99 invocations les plus lentes sur toute la période ; elle ne calcule ni centile ni intervalles de 5 minutes."
    d:
      en: "START lines mark the beginning of an invocation and do not contain the duration, which is reported in the REPORT line."
      fr: "Les lignes START marquent le début d'une invocation et ne contiennent pas la durée, qui figure dans la ligne REPORT."
references:
  - title: stats
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-Stats.html
  - title: Sample queries
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-examples.html
