id: dvac03-4a-ecs-pull-endpoints
objective: "4.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company deploys an Amazon ECS service on AWS Fargate, platform version 1.4.0, in private subnets that have no NAT gateway and no internet gateway route. The container image is stored in a private Amazon ECR repository in the same Region, and the task definition has no log configuration. Every task stops before starting, and the stopped reason starts with CannotPullContainerError and mentions that the request was canceled while waiting for connection. The tasks must not get internet access.

    Which combination of VPC endpoints will allow the tasks to start? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise déploie un service Amazon ECS sur AWS Fargate, version de plateforme 1.4.0, dans des sous-réseaux privés sans passerelle NAT ni route vers une passerelle Internet. L'image de conteneur est stockée dans un référentiel Amazon ECR privé de la même Région, et la définition de tâche n'a aucune configuration de journalisation. Chaque tâche s'arrête avant de démarrer, et la raison de l'arrêt commence par CannotPullContainerError et indique que la requête a été annulée pendant l'attente de connexion. Les tâches ne doivent pas obtenir d'accès Internet.

    Quelle combinaison de points de terminaison de VPC permet aux tâches de démarrer ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "An interface endpoint for com.amazonaws.<region>.ecr.api", fr: "Un point de terminaison d'interface pour com.amazonaws.<region>.ecr.api" } }
    - { id: b, text: { en: "An interface endpoint for com.amazonaws.<region>.ecs-agent", fr: "Un point de terminaison d'interface pour com.amazonaws.<region>.ecs-agent" } }
    - { id: c, text: { en: "An interface endpoint for com.amazonaws.<region>.ecr.dkr", fr: "Un point de terminaison d'interface pour com.amazonaws.<region>.ecr.dkr" } }
    - { id: d, text: { en: "An interface endpoint for com.amazonaws.<region>.sts", fr: "Un point de terminaison d'interface pour com.amazonaws.<region>.sts" } }
    - { id: e, text: { en: "A gateway endpoint for Amazon S3 associated with the route tables of the private subnets", fr: "Un point de terminaison de passerelle pour Amazon S3 associé aux tables de routage des sous-réseaux privés" } }
    - { id: f, text: { en: "An interface endpoint for com.amazonaws.<region>.logs", fr: "Un point de terminaison d'interface pour com.amazonaws.<region>.logs" } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "The error means that the tasks have no route to Amazon ECR. Fargate tasks on platform version 1.4.0 or later need both Amazon ECR interface endpoints, ecr.api and ecr.dkr, plus the Amazon S3 gateway endpoint, because the image layers are stored in Amazon S3."
    fr: "L'erreur signifie que les tâches n'ont aucune route vers Amazon ECR. Les tâches Fargate en version de plateforme 1.4.0 ou ultérieure ont besoin des deux points de terminaison d'interface Amazon ECR, ecr.api et ecr.dkr, ainsi que du point de terminaison de passerelle Amazon S3, car les couches d'image sont stockées dans Amazon S3."
  options:
    b:
      en: "The ecs-agent endpoint is used by the ECS container agent on EC2 container instances; Fargate does not need it to pull images."
      fr: "Le point de terminaison ecs-agent est utilisé par l'agent de conteneur ECS sur les instances de conteneur EC2 ; Fargate n'en a pas besoin pour extraire les images."
    d:
      en: "Pulling from a private ECR repository in the same account does not require an STS endpoint."
      fr: "L'extraction depuis un référentiel ECR privé du même compte ne nécessite pas de point de terminaison STS."
    f:
      en: "The logs endpoint is needed only when tasks use the awslogs log driver, and this task definition has no log configuration."
      fr: "Le point de terminaison logs n'est nécessaire que si les tâches utilisent le pilote de journalisation awslogs, et cette définition de tâche n'a aucune configuration de journalisation."
references:
  - title: Amazon ECR interface VPC endpoints (AWS PrivateLink)
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/vpc-endpoints.html
  - title: CannotPullContainer task errors in Amazon ECS
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_cannot_pull_image.html
