id: dvac03-4c-kinesis-parallelization
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function processes an Amazon Kinesis data stream that has four shards. During daily peaks, the IteratorAge metric of the function rises to several minutes, while the function's Duration stays stable and there are no errors. Records that share a partition key (a device ID) must be processed in order. The company does not want to add shards to the stream.

    Which solution will reduce the IteratorAge during peaks?
  fr: |
    Une fonction AWS Lambda traite un flux de données Amazon Kinesis de quatre partitions (shards). Pendant les pics quotidiens, la métrique IteratorAge de la fonction monte à plusieurs minutes, alors que la métrique Duration de la fonction reste stable et qu'il n'y a pas d'erreurs. Les enregistrements qui partagent une clé de partition (un ID d'appareil) doivent être traités dans l'ordre. L'entreprise ne veut pas ajouter de partitions au flux.

    Quelle solution réduit IteratorAge pendant les pics ?
body:
  options:
    - id: a
      text: { en: "Set the batch size of the event source mapping to 1.", fr: "Définir la taille de lot du mappage de source d'événement à 1." }
    - id: b
      text: { en: "Increase the reserved concurrency of the function.", fr: "Augmenter la simultanéité réservée de la fonction." }
    - id: c
      text: { en: "Send the records to an Amazon SQS standard queue and process the queue instead.", fr: "Envoyer les enregistrements vers une file d'attente standard Amazon SQS et traiter cette file à la place." }
    - id: d
      text: { en: "Increase the ParallelizationFactor of the event source mapping.", fr: "Augmenter le ParallelizationFactor du mappage de source d'événement." }
answer: { optionId: d }
explanation:
  correct:
    en: "IteratorAge measures the time between when the stream receives a record and when the event source mapping sends it to the function, so a rising value means the consumer is falling behind. ParallelizationFactor (1 to 10) lets Lambda process several batches from each shard at the same time, which raises throughput when IteratorAge is high, and Lambda still keeps in-order processing for each partition key."
    fr: "IteratorAge mesure le temps entre la réception d'un enregistrement par le flux et son envoi à la fonction par le mappage de source d'événement : une valeur croissante signifie que le consommateur prend du retard. ParallelizationFactor (1 à 10) permet à Lambda de traiter plusieurs lots de chaque partition en même temps, ce qui augmente le débit quand IteratorAge est élevé, tout en conservant l'ordre de traitement pour chaque clé de partition."
  options:
    a:
      en: "A batch size of 1 multiplies the number of invocations for the same records, which lowers throughput and increases the lag."
      fr: "Une taille de lot de 1 multiplie le nombre d'invocations pour les mêmes enregistrements, ce qui réduit le débit et augmente le retard."
    b:
      en: "With a parallelization factor of 1, the number of concurrent invocations is limited by the number of shards, so more reserved concurrency would not be used."
      fr: "Avec un facteur de parallélisation de 1, le nombre d'invocations simultanées est limité par le nombre de partitions : davantage de simultanéité réservée ne serait pas utilisée."
    c:
      en: "A standard queue does not preserve the order of records, which breaks the per-device ordering requirement."
      fr: "Une file d'attente standard ne préserve pas l'ordre des enregistrements, ce qui ne respecte plus l'exigence d'ordre par appareil."
references:
  - title: Using Lambda to process records from Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
  - title: Types of metrics for Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-types.html
