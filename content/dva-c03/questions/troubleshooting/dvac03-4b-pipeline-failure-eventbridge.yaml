id: dvac03-4b-pipeline-failure-eventbridge
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer uses the AWS CLI to set up a notification for an AWS CodePipeline pipeline named `release`. The developer has already created an Amazon SNS topic with the default topic policy and confirmed the email subscriptions. The team must receive an email each time an execution of the whole pipeline fails.

    Which combination of steps will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Un développeur utilise l'AWS CLI pour configurer une notification pour un pipeline AWS CodePipeline nommé `release`. Le développeur a déjà créé une rubrique Amazon SNS avec la politique de rubrique par défaut et confirmé les abonnements e-mail. L'équipe doit recevoir un e-mail chaque fois qu'une exécution de l'ensemble du pipeline échoue.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an Amazon EventBridge rule for `CodePipeline Pipeline Execution State Change` events of `release` with the `FAILED` state, and add the topic as a target.", fr: "Créer une règle Amazon EventBridge pour les événements `CodePipeline Pipeline Execution State Change` de `release` avec l'état `FAILED`, et ajouter la rubrique comme cible." } }
    - { id: b, text: { en: "Create an Amazon EventBridge rule for `CodePipeline Action Execution State Change` events with the `SUCCEEDED` state, and add the topic as a target.", fr: "Créer une règle Amazon EventBridge pour les événements `CodePipeline Action Execution State Change` avec l'état `SUCCEEDED`, et ajouter la rubrique comme cible." } }
    - { id: c, text: { en: "Add `sns:Publish` on the topic to the pipeline's service role.", fr: "Ajouter `sns:Publish` sur la rubrique au rôle de service du pipeline." } }
    - { id: d, text: { en: "Add a statement to the topic policy that allows `events.amazonaws.com` to call `sns:Publish` on the topic.", fr: "Ajouter à la politique de rubrique une instruction qui autorise `events.amazonaws.com` à appeler `sns:Publish` sur la rubrique." } }
    - { id: e, text: { en: "Create an AWS CloudTrail trail so that pipeline state changes are delivered to Amazon EventBridge.", fr: "Créer un journal de suivi AWS CloudTrail pour que les changements d'état du pipeline soient livrés à Amazon EventBridge." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "CodePipeline sends pipeline, stage and action execution state changes to EventBridge, and a rule on the pipeline-level detail type with the `FAILED` state matches each failed execution. When the rule and target are created with the CLI, EventBridge also needs `sns:Publish` on the topic, granted through a topic policy statement for `events.amazonaws.com`."
    fr: "CodePipeline envoie à EventBridge les changements d'état d'exécution de pipeline, d'étape et d'action, et une règle sur le type de détail de niveau pipeline avec l'état `FAILED` correspond à chaque exécution échouée. Quand la règle et la cible sont créées avec la CLI, EventBridge a aussi besoin de `sns:Publish` sur la rubrique, accordé par une instruction de politique de rubrique pour `events.amazonaws.com`."
  options:
    b:
      en: "Action events with the `SUCCEEDED` state report successful actions, not failed pipeline executions."
      fr: "Les événements d'action avec l'état `SUCCEEDED` signalent des actions réussies, pas des exécutions de pipeline échouées."
    c:
      en: "The pipeline does not publish the message; EventBridge delivers it to the target, so the pipeline's service role is not involved."
      fr: "Le pipeline ne publie pas le message ; c'est EventBridge qui le livre à la cible : le rôle de service du pipeline n'intervient pas."
    e:
      en: "CodePipeline sends its execution state change events to EventBridge directly; no trail is needed."
      fr: "CodePipeline envoie directement ses événements de changement d'état d'exécution à EventBridge ; aucun journal de suivi n'est nécessaire."
references:
  - title: Monitoring CodePipeline events
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/detect-state-changes-cloudwatch-events.html
  - title: Using resource-based policies for Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-use-resource-based.html
