id: dvac03-4c-apigw-latency-overhead
objective: "4.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany exposes an Amazon API Gateway REST API that uses a Lambda authorizer of the REQUEST type and a Lambda proxy integration. Clients report slow responses. For the last hour, the p99 of the Latency metric is 1,800 ms, the p99 of the IntegrationLatency metric is 120 ms, and the p99 Duration of the backend Lambda function is 100 ms.

    Which component should the developer investigate first?
  fr: |
    AnyCompany expose une API REST Amazon API Gateway qui utilise un mécanisme d'autorisation Lambda de type REQUEST et une intégration de proxy Lambda. Des clients signalent des réponses lentes. Sur la dernière heure, le p99 de la métrique Latency est de 1 800 ms, le p99 de la métrique IntegrationLatency est de 120 ms, et le p99 de Duration de la fonction Lambda du backend est de 100 ms.

    Quel composant le développeur doit-il examiner en premier ?
body:
  options:
    - id: a
      text: { en: "The processing that API Gateway performs outside the integration call, such as the Lambda authorizer", fr: "Le traitement effectué par API Gateway en dehors de l'appel d'intégration, tel que le mécanisme d'autorisation Lambda" } 
    - id: b
      text: { en: "The code of the backend Lambda function that the proxy integration invokes", fr: "Le code de la fonction Lambda du backend invoquée par l'intégration de proxy" }
    - id: c
      text: { en: "The timeout setting of the integration request of the method", fr: "Le paramètre de délai d'expiration de la requête d'intégration de la méthode" }
    - id: d
      text: { en: "The network path between API Gateway and the backend Lambda function", fr: "Le chemin réseau entre API Gateway et la fonction Lambda du backend" }
answer: { optionId: a }
explanation:
  correct:
    en: "Latency measures the time from when API Gateway receives a request until it returns the response, and it includes the integration latency and other API Gateway overhead. IntegrationLatency covers only the time between relaying the request to the backend and receiving its response. Here about 1,680 ms is spent outside the integration, so work done before or after it, such as the Lambda authorizer, is the likely bottleneck."
    fr: "Latency mesure le temps écoulé entre la réception d'une requête par API Gateway et le renvoi de la réponse, et inclut la latence d'intégration ainsi que les autres traitements d'API Gateway. IntegrationLatency ne couvre que le temps entre la transmission de la requête au backend et la réception de sa réponse. Ici, environ 1 680 ms sont passées en dehors de l'intégration : le travail effectué avant ou après celle-ci, comme le mécanisme d'autorisation Lambda, est le goulet d'étranglement probable."
  options:
    b:
      en: "The backend function's duration is 100 ms and the whole integration takes 120 ms, so the backend accounts for only a small part of the latency."
      fr: "La durée de la fonction du backend est de 100 ms et toute l'intégration prend 120 ms : le backend ne représente donc qu'une faible part de la latence."
    c:
      en: "The integration completes in 120 ms, far below any timeout, so the timeout setting is not causing the delay."
      fr: "L'intégration se termine en 120 ms, bien en dessous de tout délai d'expiration : ce paramètre ne provoque donc pas le retard."
    d:
      en: "The network time between API Gateway and the backend is part of IntegrationLatency, which is only 120 ms."
      fr: "Le temps réseau entre API Gateway et le backend fait partie d'IntegrationLatency, qui n'est que de 120 ms."
references:
  - title: Amazon API Gateway dimensions and metrics
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-metrics-and-dimensions.html
