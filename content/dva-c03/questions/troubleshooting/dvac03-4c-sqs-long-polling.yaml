id: dvac03-4c-sqs-long-polling
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's worker application on Amazon EC2 calls ReceiveMessage in a loop to read an Amazon SQS standard queue. The queue is often empty for several minutes, and the NumberOfEmptyReceives metric is very high. The company wants to reduce the cost of the SQS requests without delaying the processing of new messages.

    Which solution will meet these requirements?
  fr: |
    L'application de traitement d'AnyCompany sur Amazon EC2 appelle ReceiveMessage en boucle pour lire une file d'attente standard Amazon SQS. La file d'attente est souvent vide pendant plusieurs minutes, et la métrique NumberOfEmptyReceives est très élevée. L'entreprise veut réduire le coût des requêtes SQS sans retarder le traitement des nouveaux messages.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Decrease the visibility timeout of the queue.", fr: "Réduire le délai de visibilité de la file d'attente." }
    - id: b
      text: { en: "Configure the queue as a delay queue with a 15-minute delay.", fr: "Configurer la file d'attente comme file d'attente à retard avec un délai de 15 minutes." }
    - id: c
      text: { en: "Set the ReceiveMessageWaitTimeSeconds attribute of the queue to 20.", fr: "Définir l'attribut ReceiveMessageWaitTimeSeconds de la file d'attente à 20." }
    - id: d
      text: { en: "Increase the message retention period of the queue.", fr: "Augmenter la période de conservation des messages de la file d'attente." }
answer: { optionId: c }
explanation:
  correct:
    en: "A ReceiveMessageWaitTimeSeconds value greater than 0 turns on long polling for requests that do not set WaitTimeSeconds. With long polling, SQS queries all servers and returns as soon as a message is available, or after the wait time (up to 20 seconds) when the queue is empty. This reduces empty and false empty responses, and therefore cost, without delaying new messages."
    fr: "Une valeur de ReceiveMessageWaitTimeSeconds supérieure à 0 active l'interrogation longue (long polling) pour les requêtes qui ne définissent pas WaitTimeSeconds. Avec l'interrogation longue, SQS interroge tous les serveurs et répond dès qu'un message est disponible, ou après le temps d'attente (20 secondes au maximum) quand la file d'attente est vide. Cela réduit les réponses vides et faussement vides, donc le coût, sans retarder les nouveaux messages."
  options:
    a:
      en: "The visibility timeout controls how long a received message stays hidden; it does not change how often empty receives occur."
      fr: "Le délai de visibilité contrôle combien de temps un message reçu reste masqué ; il ne change pas la fréquence des réceptions vides."
    b:
      en: "A delay queue postpones the delivery of every new message by up to 15 minutes, which delays processing."
      fr: "Une file d'attente à retard reporte la livraison de chaque nouveau message de 15 minutes au maximum, ce qui retarde le traitement."
    d:
      en: "The retention period only defines how long unprocessed messages are kept; empty receives are unaffected."
      fr: "La période de conservation définit seulement combien de temps les messages non traités sont conservés ; les réceptions vides ne sont pas affectées."
references:
  - title: Amazon SQS short and long polling
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-short-and-long-polling.html
