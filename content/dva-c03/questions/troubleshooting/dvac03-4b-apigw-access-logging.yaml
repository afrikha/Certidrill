id: dvac03-4b-apigw-access-logging
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an Amazon API Gateway REST API. No CloudWatch logging has ever been configured for API Gateway in the account. The team needs one JSON record per request in an Amazon CloudWatch Logs log group, with the caller IP address, the HTTP status and the request ID. Request and response bodies must not be logged.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany dispose d'une API REST Amazon API Gateway. Aucune journalisation CloudWatch n'a jamais été configurée pour API Gateway dans le compte. L'équipe a besoin d'un enregistrement JSON par requête dans un groupe de journaux Amazon CloudWatch Logs, avec l'adresse IP de l'appelant, le statut HTTP et l'ID de requête. Les corps des requêtes et des réponses ne doivent pas être journalisés.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on execution logging with full request and response data logging on the stage.", fr: "Activer sur l'étape la journalisation de l'exécution avec la journalisation complète des données de requête et de réponse." } }
    - { id: b, text: { en: "Set the account's CloudWatch log role ARN to a role that trusts API Gateway and has `AmazonAPIGatewayPushToCloudWatchLogs`.", fr: "Définir l'ARN du rôle de journal CloudWatch du compte sur un rôle qui approuve API Gateway et possède `AmazonAPIGatewayPushToCloudWatchLogs`." } }
    - { id: c, text: { en: "Turn on detailed CloudWatch metrics on the stage.", fr: "Activer les métriques CloudWatch détaillées sur l'étape." } }
    - { id: d, text: { en: "Turn on access logging on the stage with the log group ARN and a JSON format built from `$context` variables.", fr: "Activer la journalisation des accès sur l'étape avec l'ARN du groupe de journaux et un format JSON construit à partir de variables `$context`." } }
    - { id: e, text: { en: "Turn on AWS X-Ray tracing on the stage.", fr: "Activer le traçage AWS X-Ray sur l'étape." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Access logging records who called the API and how, in a format you define with `$context` variables such as `$context.requestId`, `$context.identity.sourceIp` and `$context.status`. To write to CloudWatch Logs, API Gateway assumes the role set in the account's `cloudWatchRoleArn` setting, which must be configured in each Region."
    fr: "La journalisation des accès enregistre qui a appelé l'API et comment, dans un format que vous définissez avec des variables `$context` comme `$context.requestId`, `$context.identity.sourceIp` et `$context.status`. Pour écrire dans CloudWatch Logs, API Gateway assume le rôle défini dans le paramètre `cloudWatchRoleArn` du compte, à configurer dans chaque Région."
  options:
    a:
      en: "Execution logs describe how API Gateway processed each request, and full data logging writes the request and response bodies, which is forbidden here."
      fr: "Les journaux d'exécution décrivent le traitement de chaque requête par API Gateway, et la journalisation complète des données écrit les corps des requêtes et des réponses, ce qui est interdit ici."
    c:
      en: "Detailed metrics give per-method metric data, not one log record per request."
      fr: "Les métriques détaillées fournissent des données de métrique par méthode, pas un enregistrement de journal par requête."
    e:
      en: "X-Ray tracing produces sampled traces, not a log record for every request."
      fr: "Le traçage X-Ray produit des traces échantillonnées, pas un enregistrement de journal pour chaque requête."
references:
  - title: Set up CloudWatch logging for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-logging.html
