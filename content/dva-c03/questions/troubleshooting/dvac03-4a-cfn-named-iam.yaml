id: dvac03-4a-cfn-named-iam
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A deployment script runs `aws cloudformation deploy --template-file app.yaml --stack-name orders-app`. The template contains an AWS::IAM::Role resource with a RoleName property. The deployment fails, and the output reports an InsufficientCapabilities error.

    Which change to the command will allow the deployment?
  fr: |
    Un script de déploiement exécute `aws cloudformation deploy --template-file app.yaml --stack-name orders-app`. Le modèle contient une ressource AWS::IAM::Role avec une propriété RoleName. Le déploiement échoue, et la sortie signale une erreur InsufficientCapabilities.

    Quelle modification de la commande permet le déploiement ?
body:
  options:
    - { id: a, text: { en: "Add `--capabilities CAPABILITY_IAM`.", fr: "Ajouter `--capabilities CAPABILITY_IAM`." } }
    - { id: b, text: { en: "Add `--capabilities CAPABILITY_AUTO_EXPAND`.", fr: "Ajouter `--capabilities CAPABILITY_AUTO_EXPAND`." } }
    - { id: c, text: { en: "Add `--no-execute-changeset`.", fr: "Ajouter `--no-execute-changeset`." } }
    - { id: d, text: { en: "Add `--capabilities CAPABILITY_NAMED_IAM`.", fr: "Ajouter `--capabilities CAPABILITY_NAMED_IAM`." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Templates that create IAM resources require an explicit acknowledgment, otherwise CloudFormation returns InsufficientCapabilities. When the IAM resources have custom names, such as a role with RoleName, CAPABILITY_NAMED_IAM is mandatory."
    fr: "Les modèles qui créent des ressources IAM exigent une reconnaissance explicite, sans quoi CloudFormation renvoie InsufficientCapabilities. Lorsque les ressources IAM ont des noms personnalisés, comme un rôle avec RoleName, CAPABILITY_NAMED_IAM est obligatoire."
  options:
    a:
      en: "CAPABILITY_IAM is enough for IAM resources without custom names, but not for a role that sets RoleName."
      fr: "CAPABILITY_IAM suffit pour des ressources IAM sans nom personnalisé, mais pas pour un rôle qui définit RoleName."
    b:
      en: "CAPABILITY_AUTO_EXPAND acknowledges macros and transforms; the template uses neither."
      fr: "CAPABILITY_AUTO_EXPAND reconnaît les macros et les transformations ; le modèle n'en utilise pas."
    c:
      en: "This option only creates the change set without running it; the acknowledgment is still missing."
      fr: "Cette option crée seulement le jeu de modifications sans l'exécuter ; la reconnaissance manque toujours."
references:
  - title: CreateStack
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_CreateStack.html
