id: dvac03-4a-sqs-timeout-raised
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function processes messages from an Amazon SQS standard queue through an event source mapping. The queue has a visibility timeout of 60 seconds. To handle larger orders, a developer changes the function timeout from 30 seconds to 120 seconds, and the update succeeds without any error. Since then, some orders are processed twice, although the function logs show no errors and no throttling.

    Which solution will stop the duplicate processing?
  fr: |
    Une fonction AWS Lambda traite les messages d'une file d'attente Amazon SQS standard via un mappage de source d'événement. La file d'attente a un délai de visibilité de 60 secondes. Pour traiter des commandes plus volumineuses, un développeur fait passer le délai d'expiration de la fonction de 30 à 120 secondes, et la mise à jour réussit sans erreur. Depuis, certaines commandes sont traitées deux fois, alors que les journaux de la fonction ne montrent ni erreur ni limitation.

    Quelle solution met fin au double traitement ?
body:
  options:
    - { id: a, text: { en: "Enable ReportBatchItemFailures on the event source mapping.", fr: "Activer ReportBatchItemFailures sur le mappage de source d'événement." } }
    - { id: b, text: { en: "Reduce the batch size of the event source mapping to 1 message.", fr: "Réduire la taille de lot du mappage de source d'événement à 1 message." } }
    - { id: c, text: { en: "Replace the queue with a FIFO queue that uses content-based deduplication.", fr: "Remplacer la file d'attente par une file FIFO qui utilise la déduplication basée sur le contenu." } }
    - { id: d, text: { en: "Increase the queue visibility timeout to at least six times the new function timeout.", fr: "Augmenter le délai de visibilité de la file d'attente à au moins six fois le nouveau délai d'expiration de la fonction." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Lambda checks that the function timeout does not exceed the queue visibility timeout only when the event source mapping is created or updated, not when the function timeout changes. With a 120-second timeout and a 60-second visibility timeout, messages become visible again while the function is still processing them. AWS recommends a visibility timeout of at least six times the function timeout."
    fr: "Lambda vérifie que le délai d'expiration de la fonction ne dépasse pas le délai de visibilité de la file d'attente uniquement à la création ou à la mise à jour du mappage de source d'événement, pas lors de la modification du délai de la fonction. Avec 120 secondes de délai d'expiration et 60 secondes de délai de visibilité, les messages redeviennent visibles alors que la fonction les traite encore. AWS recommande un délai de visibilité d'au moins six fois le délai d'expiration de la fonction."
  options:
    a:
      en: "Partial batch responses only control which messages return to the queue after a failure; the duplicates here occur without any failure."
      fr: "Les réponses de lot partielles ne contrôlent que les messages renvoyés dans la file après un échec ; ici, les doublons surviennent sans aucun échec."
    b:
      en: "A single long-running message still becomes visible again after 60 seconds and is delivered a second time."
      fr: "Un message unique dont le traitement est long redevient quand même visible après 60 secondes et est livré une seconde fois."
    c:
      en: "Content-based deduplication removes duplicate sends within the deduplication interval; it does not stop redelivery of a message whose visibility timeout expired."
      fr: "La déduplication basée sur le contenu supprime les envois en double pendant l'intervalle de déduplication ; elle n'empêche pas la nouvelle livraison d'un message dont le délai de visibilité a expiré."
references:
  - title: Creating and configuring an Amazon SQS event source mapping
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
