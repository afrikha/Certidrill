id: dvac03-4a-codedeploy-script-logs
objective: "4.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS CodeDeploy deployment to Amazon Linux EC2 instances fails at the AfterInstall lifecycle event because the configure.sh script returns a nonzero exit code. The developer needs to read the output that the script wrote during the failed deployment. The CloudWatch agent is not installed on the instances.

    Which two locations contain this output? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un déploiement AWS CodeDeploy vers des instances EC2 Amazon Linux échoue à l'événement de cycle de vie AfterInstall, car le script configure.sh renvoie un code de sortie non nul. Le développeur doit lire la sortie écrite par le script pendant le déploiement en échec. L'agent CloudWatch n'est pas installé sur les instances.

    Quels sont les deux emplacements qui contiennent cette sortie ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The scripts.log file under /opt/codedeploy-agent/deployment-root/<deployment-group-ID>/<deployment-ID>/logs/ on the instance", fr: "Le fichier scripts.log sous /opt/codedeploy-agent/deployment-root/<deployment-group-ID>/<deployment-ID>/logs/ sur l'instance" } }
    - { id: b, text: { en: "The CloudWatch Logs log group named /aws/codedeploy/<application-name>", fr: "Le groupe de journaux CloudWatch Logs nommé /aws/codedeploy/<application-name>" } }
    - { id: c, text: { en: "The codedeploy-agent-deployments.log file under /opt/codedeploy-agent/deployment-root/deployment-logs/ on the instance", fr: "Le fichier codedeploy-agent-deployments.log sous /opt/codedeploy-agent/deployment-root/deployment-logs/ sur l'instance" } }
    - { id: d, text: { en: "The AWS CloudTrail event of the CreateDeployment API call", fr: "L'événement AWS CloudTrail de l'appel d'API CreateDeployment" } }
    - { id: e, text: { en: "The /var/log/cloud-init-output.log file on the instance", fr: "Le fichier /var/log/cloud-init-output.log sur l'instance" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "On Amazon Linux, the CodeDeploy agent writes the output of the lifecycle scripts of each deployment to a scripts.log file under the folder of the deployment group and deployment, and it also records the deployment logs in codedeploy-agent-deployments.log under deployment-root/deployment-logs."
    fr: "Sur Amazon Linux, l'agent CodeDeploy écrit la sortie des scripts de cycle de vie de chaque déploiement dans un fichier scripts.log sous le dossier du groupe de déploiement et du déploiement, et il enregistre aussi les journaux de déploiement dans codedeploy-agent-deployments.log sous deployment-root/deployment-logs."
  options:
    b:
      en: "CodeDeploy does not create such a log group; agent logs reach CloudWatch Logs only after the CloudWatch agent is installed and configured."
      fr: "CodeDeploy ne crée pas un tel groupe de journaux ; les journaux de l'agent n'arrivent dans CloudWatch Logs qu'après l'installation et la configuration de l'agent CloudWatch."
    d:
      en: "CloudTrail records the API call that started the deployment, not the output of scripts that run on the instances."
      fr: "CloudTrail enregistre l'appel d'API qui a lancé le déploiement, pas la sortie des scripts exécutés sur les instances."
    e:
      en: "This file contains the output of user data and cloud-init at instance launch, not the lifecycle scripts run by the CodeDeploy agent."
      fr: "Ce fichier contient la sortie des données utilisateur et de cloud-init au lancement de l'instance, pas celle des scripts de cycle de vie exécutés par l'agent CodeDeploy."
references:
  - title: View log data for CodeDeploy EC2/On-Premises deployments
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployments-view-logs.html
