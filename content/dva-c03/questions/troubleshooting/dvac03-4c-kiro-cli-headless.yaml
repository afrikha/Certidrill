id: dvac03-4c-kiro-cli-headless
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at AnyCompany works on a remote Linux build server through SSH, with a terminal only. The developer wants an agentic AI assistant in the terminal that can read profiling output files of an application and suggest code optimizations. The same assistant must also run prompts non-interactively in a nightly pipeline job. The company has no existing subscriptions to AWS developer tools.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany travaille sur un serveur de build Linux distant via SSH, uniquement en terminal. Il veut un assistant d'IA agentique dans le terminal, capable de lire les fichiers de sortie de profilage d'une application et de suggérer des optimisations du code. Le même assistant doit aussi exécuter des invites de manière non interactive dans une tâche de pipeline nocturne. L'entreprise ne dispose d'aucun abonnement existant à des outils de développement AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Sign up for Amazon Q Developer and install its command line tool on the build server.", fr: "S'inscrire à Amazon Q Developer et installer son outil en ligne de commande sur le serveur de build." }
    - id: b
      text: { en: "Open AWS CloudShell from the AWS Management Console and analyze the files there.", fr: "Ouvrir AWS CloudShell depuis la AWS Management Console et y analyser les fichiers." }
    - id: c
      text: { en: "Create an AWS Cloud9 environment that connects to the build server over SSH.", fr: "Créer un environnement AWS Cloud9 qui se connecte au serveur de build via SSH." }
    - id: d
      text: { en: "Install Kiro CLI on the build server, and use its headless mode in the nightly job.", fr: "Installer Kiro CLI sur le serveur de build et utiliser son mode sans interface (headless) dans la tâche nocturne." }
answer: { optionId: d }
explanation:
  correct:
    en: "Kiro CLI runs the Kiro agent in a terminal, where the developer can chat about the project and reference files such as profiling output. Its headless mode runs prompts non-interactively in scripts and CI/CD pipelines, which covers the nightly job."
    fr: "Kiro CLI exécute l'agent Kiro dans un terminal, où le développeur peut converser à propos du projet et faire référence à des fichiers comme la sortie de profilage. Son mode sans interface (headless) exécute des invites de manière non interactive dans des scripts et des pipelines CI/CD, ce qui couvre la tâche nocturne."
  options:
    a:
      en: "Amazon Q Developer stopped accepting new sign-ups on May 15, 2026, so a company without a subscription cannot start using it."
      fr: "Amazon Q Developer n'accepte plus de nouvelles inscriptions depuis le 15 mai 2026 : une entreprise sans abonnement ne peut pas commencer à l'utiliser."
    b:
      en: "CloudShell is a browser-based shell in the console, not a terminal on the build server, and it is not an agentic AI assistant."
      fr: "CloudShell est un shell basé sur le navigateur dans la console, pas un terminal sur le serveur de build, et ce n'est pas un assistant d'IA agentique."
    c:
      en: "AWS Cloud9 has been closed to new customers since July 25, 2024."
      fr: "AWS Cloud9 est fermé aux nouveaux clients depuis le 25 juillet 2024."
references:
  - title: CLI
    url: https://kiro.dev/docs/cli/
  - title: Kiro Documentation
    url: https://aws.amazon.com/documentation-overview/kiro/
