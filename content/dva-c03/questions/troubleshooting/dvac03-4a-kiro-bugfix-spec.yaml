id: dvac03-4a-kiro-bugfix-spec
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment service has an intermittent rounding defect in a critical code path. Previous quick fixes introduced regressions. The team wants to use Kiro to find the root cause, record the current, expected and unchanged behavior, and get tests that prove the bug is fixed without breaking other behavior.

    Which Kiro feature should the team use?
  fr: |
    Un service de paiement présente un défaut d'arrondi intermittent dans un chemin de code critique. Des corrections rapides précédentes ont introduit des régressions. L'équipe veut utiliser Kiro pour trouver la cause racine, consigner le comportement actuel, attendu et inchangé, et obtenir des tests qui prouvent que le bogue est corrigé sans casser d'autre comportement.

    Quelle fonctionnalité de Kiro l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A Bugfix Spec, started by choosing the Bug Fix workflow", fr: "Une Bugfix Spec, démarrée en choisissant le flux de travail Bug Fix" } }
    - { id: b, text: { en: "A chat session without a spec, asking the agent to patch the function", fr: "Une session de chat sans spec, en demandant à l'agent de corriger la fonction" } }
    - { id: c, text: { en: "An agent hook that runs the unit tests each time a file is saved", fr: "Un hook d'agent qui exécute les tests unitaires à chaque enregistrement de fichier" } }
    - { id: d, text: { en: "A steering file that lists the coding standards of the payment team", fr: "Un fichier de pilotage (steering) qui liste les normes de codage de l'équipe de paiement" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A Bugfix Spec records the current, expected and unchanged behavior in bugfix.md, then has the agent explore the codebase to identify the root cause and propose a fix in design.md. Its tasks include property-based tests that check the bug is reproduced, the fix works and the unchanged behavior still holds."
    fr: "Une Bugfix Spec consigne le comportement actuel, attendu et inchangé dans bugfix.md, puis fait explorer le code par l'agent pour identifier la cause racine et proposer une correction dans design.md. Ses tâches comprennent des tests basés sur les propriétés qui vérifient que le bogue est reproduit, que la correction fonctionne et que le comportement inchangé est préservé."
  options:
    b:
      en: "An unstructured chat can patch the code but does not record the expected and unchanged behavior or generate regression tests, which is how earlier fixes went wrong."
      fr: "Un chat non structuré peut corriger le code, mais ne consigne pas le comportement attendu et inchangé et ne génère pas de tests de régression, ce qui a fait échouer les corrections précédentes."
    c:
      en: "A hook can run existing tests automatically but does not analyze the root cause or write the missing regression tests."
      fr: "Un hook peut exécuter automatiquement les tests existants, mais n'analyse pas la cause racine et n'écrit pas les tests de régression manquants."
    d:
      en: "Steering files enforce standards across sessions; they do not investigate a defect."
      fr: "Les fichiers de pilotage imposent des normes d'une session à l'autre ; ils n'analysent pas un défaut."
references:
  - title: Bugfix Specs
    url: https://kiro.dev/docs/specs/bugfix-specs/
