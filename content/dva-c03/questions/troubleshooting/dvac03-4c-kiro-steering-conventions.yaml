id: dvac03-4c-kiro-steering-conventions
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's developers use Kiro in a shared repository. Kiro often generates code that ignores the team's performance conventions: reuse AWS SDK clients across invocations, read several Amazon DynamoDB items with BatchGetItem, and use Query instead of Scan. Developers currently repeat these conventions in every prompt. The team wants Kiro to apply them in every interaction in this workspace automatically.

    Which solution will meet these requirements?
  fr: |
    Les développeurs d'AnyCompany utilisent Kiro dans un référentiel partagé. Kiro génère souvent du code qui ignore les conventions de performances de l'équipe : réutiliser les clients du kit SDK AWS d'une invocation à l'autre, lire plusieurs éléments Amazon DynamoDB avec BatchGetItem et utiliser Query plutôt que Scan. Les développeurs répètent actuellement ces conventions dans chaque invite. L'équipe veut que Kiro les applique automatiquement à chaque interaction dans cet espace de travail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Write the conventions in a steering file in .kiro/steering/ with the always inclusion mode.", fr: "Écrire les conventions dans un fichier d'orientation (steering) de .kiro/steering/ avec le mode d'inclusion always." }
    - id: b
      text: { en: "Write the conventions in a steering file in .kiro/steering/ with the manual inclusion mode.", fr: "Écrire les conventions dans un fichier d'orientation (steering) de .kiro/steering/ avec le mode d'inclusion manual." }
    - id: c
      text: { en: "Add the AWS Documentation MCP server so that Kiro can look up the AWS best practices.", fr: "Ajouter le serveur MCP AWS Documentation afin que Kiro puisse consulter les bonnes pratiques AWS." }
    - id: d
      text: { en: "Write the conventions in the requirements.md file of a new spec for the next feature.", fr: "Écrire les conventions dans le fichier requirements.md d'une nouvelle spécification (spec) pour la prochaine fonctionnalité." }
answer: { optionId: a }
explanation:
  correct:
    en: "Steering files are Markdown files that give Kiro persistent knowledge of the project so that it follows the team's conventions without being reminded. A workspace steering file in .kiro/steering/ with the always inclusion mode, which is the default, is loaded in every interaction."
    fr: "Les fichiers d'orientation (steering) sont des fichiers Markdown qui donnent à Kiro une connaissance persistante du projet afin qu'il respecte les conventions de l'équipe sans rappel. Un fichier d'orientation d'espace de travail dans .kiro/steering/ avec le mode d'inclusion always, qui est le mode par défaut, est chargé à chaque interaction."
  options:
    b:
      en: "A steering file in manual mode is loaded only when a developer references it in the chat, so developers would still have to ask for it."
      fr: "Un fichier d'orientation en mode manual n'est chargé que lorsqu'un développeur y fait référence dans la conversation : les développeurs devraient donc toujours le demander."
    c:
      en: "The documentation server gives Kiro access to AWS documentation, but it does not make Kiro apply the team's own conventions in every interaction."
      fr: "Le serveur de documentation donne à Kiro accès à la documentation AWS, mais il ne lui fait pas appliquer les conventions propres à l'équipe à chaque interaction."
    d:
      en: "The requirements of a spec apply to that feature only, not to every interaction in the workspace."
      fr: "Les exigences d'une spécification ne s'appliquent qu'à cette fonctionnalité, pas à chaque interaction dans l'espace de travail."
references:
  - title: Steering
    url: https://kiro.dev/docs/steering/
  - title: Kiro Documentation
    url: https://aws.amazon.com/documentation-overview/kiro/
