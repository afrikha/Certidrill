id: dvac03-4c-sqs-backlog-metrics
objective: "4.3.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's order processing workers run on Amazon ECS and consume an Amazon SQS standard queue. Customers report that orders are sometimes confirmed late. A developer wants Amazon CloudWatch alarms that show when the workers fall behind: one alarm when the number of messages waiting to be processed grows, and one alarm when messages wait too long before being processed.

    Which two metrics should the developer use? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Les processus de traitement des commandes d'AnyCompany s'exécutent sur Amazon ECS et consomment une file d'attente standard Amazon SQS. Des clients signalent que les commandes sont parfois confirmées en retard. Un développeur veut des alarmes Amazon CloudWatch qui indiquent quand les processus prennent du retard : une alarme quand le nombre de messages en attente de traitement augmente, et une alarme quand les messages attendent trop longtemps avant d'être traités.

    Quelles sont les deux métriques que le développeur doit utiliser ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: "ApproximateNumberOfMessagesVisible" }
    - { id: b, text: "NumberOfEmptyReceives" }
    - { id: c, text: "ApproximateAgeOfOldestMessage" }
    - { id: d, text: "NumberOfMessagesSent" }
    - { id: e, text: "ApproximateNumberOfMessagesDelayed" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "ApproximateNumberOfMessagesVisible is the number of messages available for retrieval, which is the processing backlog; a consistently high value can indicate under-provisioned consumers. ApproximateAgeOfOldestMessage is the age of the oldest unprocessed message, so it shows how long messages wait before being processed."
    fr: "ApproximateNumberOfMessagesVisible est le nombre de messages disponibles pour la récupération, c'est-à-dire l'arriéré de traitement ; une valeur durablement élevée peut indiquer des consommateurs sous-dimensionnés. ApproximateAgeOfOldestMessage est l'âge du plus ancien message non traité : elle montre donc combien de temps les messages attendent avant d'être traités."
  options:
    b:
      en: "NumberOfEmptyReceives counts ReceiveMessage calls that return no messages; it helps tune polling, not detect a growing backlog."
      fr: "NumberOfEmptyReceives compte les appels ReceiveMessage qui ne renvoient aucun message ; elle aide à régler l'interrogation, pas à détecter un arriéré croissant."
    d:
      en: "NumberOfMessagesSent measures incoming traffic; it does not show whether the workers keep up with it."
      fr: "NumberOfMessagesSent mesure le trafic entrant ; elle ne montre pas si les processus suivent le rythme."
    e:
      en: "ApproximateNumberOfMessagesDelayed counts messages that are not yet available because of a delay; it does not measure the backlog waiting for the workers."
      fr: "ApproximateNumberOfMessagesDelayed compte les messages pas encore disponibles à cause d'un délai ; elle ne mesure pas l'arriéré en attente des processus."
references:
  - title: Available CloudWatch metrics for Amazon SQS
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-available-cloudwatch-metrics.html
