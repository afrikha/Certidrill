id: dvac03-4a-kiro-terminal-context
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer uses the Kiro IDE. A local `sam build` command fails in the integrated terminal with a long dependency error. The developer wants the Kiro agent to analyze that terminal output and suggest a fix, without copying and pasting the error.

    What should the developer do?
  fr: |
    Un développeur utilise l'IDE Kiro. Une commande `sam build` locale échoue dans le terminal intégré avec une longue erreur de dépendance. Le développeur veut que l'agent Kiro analyse cette sortie de terminal et propose une correction, sans copier-coller l'erreur.

    Que doit faire le développeur ?
body:
  options:
    - { id: a, text: { en: "Create a steering file that describes the build process of the project.", fr: "Créer un fichier de pilotage (steering) qui décrit le processus de génération du projet." } }
    - { id: b, text: { en: "Create an agent hook that runs when a file is saved.", fr: "Créer un hook d'agent qui s'exécute lorsqu'un fichier est enregistré." } }
    - { id: c, text: { en: "Ask in chat and add the #codebase context provider to the prompt.", fr: "Poser la question dans le chat en ajoutant le fournisseur de contexte #codebase à l'invite." } }
    - { id: d, text: { en: "Ask in chat and add the #terminal context provider to the prompt.", fr: "Poser la question dans le chat en ajoutant le fournisseur de contexte #terminal à l'invite." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Kiro chat context providers attach specific information to a prompt. The #terminal provider gives the agent the terminal output, which is the documented way to ask about failing builds, failing tests and dependency errors."
    fr: "Les fournisseurs de contexte du chat Kiro joignent des informations précises à une invite. Le fournisseur #terminal transmet à l'agent la sortie du terminal : c'est la méthode documentée pour poser des questions sur des générations en échec, des tests en échec et des erreurs de dépendance."
  options:
    a:
      en: "Steering files give the agent lasting project standards and context; they do not contain the output of the failed command."
      fr: "Les fichiers de pilotage donnent à l'agent des normes et un contexte de projet durables ; ils ne contiennent pas la sortie de la commande en échec."
    b:
      en: "Hooks automate agent actions on events such as file changes; they do not send the existing terminal error to the chat."
      fr: "Les hooks automatisent des actions de l'agent sur des événements comme des modifications de fichiers ; ils n'envoient pas l'erreur de terminal existante au chat."
    c:
      en: "#codebase adds the project code, not the output of the failed build in the terminal."
      fr: "#codebase ajoute le code du projet, pas la sortie de la génération en échec dans le terminal."
references:
  - title: Chat
    url: https://kiro.dev/docs/ide/chat/
