id: dvac03-4b-powertools-correlation-id
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany exposes Python AWS Lambda functions through an Amazon API Gateway REST API. To follow a customer request across services, each log entry of the functions must be structured JSON that contains the API Gateway request ID as a correlation ID, and also whether the invocation was a cold start. The team wants the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose des fonctions AWS Lambda Python au moyen d'une API REST Amazon API Gateway. Pour suivre une requête client à travers les services, chaque entrée de journal des fonctions doit être du JSON structuré contenant l'ID de requête API Gateway comme ID de corrélation, ainsi que l'indication d'un démarrage à froid. L'équipe veut le MOINS d'effort de développement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the log format of the functions to JSON so that Lambda adds the request ID to each entry.", fr: "Définir le format de journal des fonctions sur JSON pour que Lambda ajoute l'ID de requête à chaque entrée." } }
    - { id: b, text: { en: "Turn on execution logging at the INFO level on the API stage and keep the function logs unchanged.", fr: "Activer la journalisation de l'exécution au niveau INFO sur l'étape de l'API et laisser les journaux des fonctions inchangés." } }
    - { id: c, text: { en: "Use the Powertools for AWS Lambda Logger with `inject_lambda_context` and the API Gateway REST correlation ID path.", fr: "Utiliser le Logger de Powertools for AWS Lambda avec `inject_lambda_context` et le chemin d'ID de corrélation API Gateway REST." } }
    - { id: d, text: { en: "Write a custom JSON formatter that reads the request ID from the event and computes a cold start flag.", fr: "Écrire un formateur JSON personnalisé qui lit l'ID de requête dans l'événement et calcule un indicateur de démarrage à froid." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Powertools Logger writes structured JSON. The `inject_lambda_context` decorator adds Lambda context keys such as `cold_start` and `function_name`, and its `correlation_id_path` set to `correlation_paths.API_GATEWAY_REST` copies the API Gateway request ID into each entry as `correlation_id`."
    fr: "Le Logger de Powertools écrit du JSON structuré. Le décorateur `inject_lambda_context` ajoute des clés du contexte Lambda comme `cold_start` et `function_name`, et son paramètre `correlation_id_path` défini sur `correlation_paths.API_GATEWAY_REST` copie l'ID de requête API Gateway dans chaque entrée sous la clé `correlation_id`."
  options:
    a:
      en: "The JSON log format adds the Lambda request ID, not the API Gateway request ID, and it does not add a cold start field."
      fr: "Le format de journal JSON ajoute l'ID de requête Lambda, pas l'ID de requête API Gateway, et il n'ajoute pas de champ de démarrage à froid."
    b:
      en: "Execution logs are written to the API Gateway log group, not into the function log entries, and they do not record cold starts."
      fr: "Les journaux d'exécution sont écrits dans le groupe de journaux d'API Gateway, pas dans les entrées de journal des fonctions, et ils n'enregistrent pas les démarrages à froid."
    d:
      en: "A custom formatter works but needs far more code and maintenance than the existing Powertools utility."
      fr: "Un formateur personnalisé fonctionne, mais demande beaucoup plus de code et de maintenance que l'utilitaire Powertools existant."
references:
  - title: Log and monitor Python Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/python-logging.html
