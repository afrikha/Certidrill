id: dvac03-4c-dynamodb-hot-key
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon DynamoDB table in provisioned capacity mode reports read throttling events during peaks, although the table's consumed read capacity stays well below the provisioned read capacity. A developer suspects that a few partition key values receive most of the reads. The developer needs to identify the most accessed and most throttled keys with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une table Amazon DynamoDB en mode de capacité provisionnée signale des événements de limitation en lecture pendant les pics, alors que la capacité de lecture consommée par la table reste bien inférieure à la capacité de lecture provisionnée. Un développeur soupçonne que quelques valeurs de clé de partition reçoivent la plupart des lectures. Il doit identifier les clés les plus consultées et les plus limitées avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on CloudWatch Contributor Insights for DynamoDB for the table.", fr: "Activer CloudWatch Contributor Insights for DynamoDB pour la table." }
    - id: b
      text: { en: "Turn on DynamoDB Streams and count the keys in an AWS Lambda function.", fr: "Activer DynamoDB Streams et compter les clés dans une fonction AWS Lambda." }
    - id: c
      text: { en: "Create a CloudWatch alarm on the ReadThrottleEvents metric of the table.", fr: "Créer une alarme CloudWatch sur la métrique ReadThrottleEvents de la table." }
    - id: d
      text: { en: "Turn on X-Ray active tracing for the functions that read the table.", fr: "Activer le suivi actif X-Ray pour les fonctions qui lisent la table." }
answer: { optionId: a }
explanation:
  correct:
    en: "CloudWatch Contributor Insights for DynamoDB shows the most accessed and most throttled items of a table or global secondary index, which identifies hot keys and hot partitions. DynamoDB creates and manages the underlying rules, so the developer only has to turn the feature on."
    fr: "CloudWatch Contributor Insights for DynamoDB affiche les éléments les plus consultés et les plus limités d'une table ou d'un index secondaire global, ce qui identifie les clés et les partitions sollicitées à l'excès. DynamoDB crée et gère les règles sous-jacentes : le développeur n'a qu'à activer la fonctionnalité."
  options:
    b:
      en: "DynamoDB Streams captures item modifications only, so it cannot show which keys are read, and a custom function adds operational overhead."
      fr: "DynamoDB Streams capture uniquement les modifications d'éléments : il ne peut pas montrer quelles clés sont lues, et une fonction personnalisée ajoute de la charge opérationnelle."
    c:
      en: "An alarm on the throttling metric shows that throttling happens, but not which keys cause it."
      fr: "Une alarme sur la métrique de limitation montre que des limitations se produisent, mais pas quelles clés les provoquent."
    d:
      en: "Traces show the latency of individual DynamoDB calls; they do not aggregate access and throttling counts by key."
      fr: "Les traces montrent la latence des appels DynamoDB individuels ; elles n'agrègent pas le nombre d'accès et de limitations par clé."
references:
  - title: "CloudWatch contributor insights for DynamoDB: How it works"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/contributorinsights_HowItWorks.html
