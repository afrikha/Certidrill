id: dvac03-4a-apigw-integration-latency
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Clients of an Amazon API Gateway REST API complain about slow responses. For the last hour, the p99 statistic of the Latency metric of the API is 3,100 ms and the p99 statistic of the IntegrationLatency metric is 3,050 ms. The API has no cache and uses an AWS Lambda backend.

    Which conclusion is supported by these metrics?
  fr: |
    Les clients d'une API REST Amazon API Gateway se plaignent de réponses lentes. Sur la dernière heure, la statistique p99 de la métrique Latency de l'API est de 3 100 ms et la statistique p99 de la métrique IntegrationLatency est de 3 050 ms. L'API n'a pas de cache et utilise un backend AWS Lambda.

    Quelle conclusion ces métriques permettent-elles de tirer ?
body:
  options:
    - { id: a, text: { en: "Almost all the time is spent waiting for the backend, so the investigation should focus on the Lambda function.", fr: "Presque tout le temps est passé à attendre le backend : l'analyse doit se concentrer sur la fonction Lambda." } }
    - { id: b, text: { en: "Almost all the time is spent in API Gateway processing outside the integration, so the investigation should focus on the API configuration.", fr: "Presque tout le temps est passé dans le traitement d'API Gateway hors intégration : l'analyse doit se concentrer sur la configuration de l'API." } }
    - { id: c, text: { en: "The responses are slow because most requests miss the API cache.", fr: "Les réponses sont lentes parce que la plupart des requêtes manquent le cache de l'API." } }
    - { id: d, text: { en: "The time is lost on the network between the clients and API Gateway.", fr: "Le temps est perdu sur le réseau entre les clients et API Gateway." } }
answer: { optionId: a }
explanation:
  correct:
    en: "IntegrationLatency is the time between when API Gateway relays a request to the backend and when it receives the response. Latency covers the full time in API Gateway, including the integration latency and other overhead. With 3,050 ms of 3,100 ms in the integration, the backend accounts for almost all the delay."
    fr: "IntegrationLatency est le temps entre le relais de la requête vers le backend par API Gateway et la réception de la réponse. Latency couvre tout le temps passé dans API Gateway, latence d'intégration et autres traitements compris. Avec 3 050 ms sur 3 100 ms dans l'intégration, le backend explique presque tout le délai."
  options:
    b:
      en: "The gap between Latency and IntegrationLatency, about 50 ms, is the only time spent in API Gateway outside the integration."
      fr: "L'écart entre Latency et IntegrationLatency, environ 50 ms, est le seul temps passé dans API Gateway hors intégration."
    c:
      en: "The API has no cache, so cache misses cannot explain the latency."
      fr: "L'API n'a pas de cache : des absences dans le cache ne peuvent pas expliquer la latence."
    d:
      en: "Latency starts when API Gateway receives the request, so client network time is not part of these metrics."
      fr: "Latency commence à la réception de la requête par API Gateway : le temps réseau côté client ne fait pas partie de ces métriques."
references:
  - title: Amazon API Gateway dimensions and metrics
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-metrics-and-dimensions.html
