id: dvac03-4c-lambda-multiprocess-vcpu
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data team at AnyCompany has a Python AWS Lambda function that splits a large CSV file into four chunks and processes the chunks in parallel with the multiprocessing module, by using four worker processes. The function is configured with 1,769 MB of memory and uses about 700 MB. After the change to parallel processing, the total duration did not decrease compared with sequential processing. The processing is CPU-bound. The team needs to reduce the duration of each invocation.

    Which solution will meet these requirements?
  fr: |
    Une équipe de données d'AnyCompany dispose d'une fonction AWS Lambda en Python qui découpe un gros fichier CSV en quatre blocs et traite ces blocs en parallèle avec le module multiprocessing, à l'aide de quatre processus de travail. La fonction est configurée avec 1 769 Mo de mémoire et en utilise environ 700 Mo. Après le passage au traitement parallèle, la durée totale n'a pas diminué par rapport au traitement séquentiel. Le traitement est limité par le processeur. L'équipe doit réduire la durée de chaque invocation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the function architecture to arm64 so that each worker process runs on its own core.", fr: "Passer l'architecture de la fonction à arm64 afin que chaque processus de travail s'exécute sur son propre cœur." }
    - id: b
      text: { en: "Set the reserved concurrency of the function to 4 so that the four chunks run at the same time.", fr: "Définir la simultanéité réservée de la fonction à 4 afin que les quatre blocs s'exécutent en même temps." }
    - id: c
      text: { en: "Configure provisioned concurrency of 4 on an alias so that four environments are ready.", fr: "Configurer une simultanéité provisionnée de 4 sur un alias afin que quatre environnements soient prêts." }
    - id: d
      text: { en: "Increase the memory setting to about 7,076 MB so that the function gets about four vCPUs.", fr: "Augmenter le paramètre de mémoire à environ 7 076 Mo afin que la fonction dispose d'environ quatre vCPU." }
answer: { optionId: d }
explanation:
  correct:
    en: "Lambda allocates CPU power in proportion to memory: at 1,769 MB a function has the equivalent of one vCPU, so four CPU-bound worker processes share a single vCPU and gain nothing. Raising memory to about four times that value gives the function about four vCPUs, so the four processes can run in parallel."
    fr: "Lambda alloue la puissance de processeur proportionnellement à la mémoire : à 1 769 Mo, une fonction dispose de l'équivalent d'un vCPU, donc quatre processus de travail limités par le processeur se partagent un seul vCPU et ne gagnent rien. Porter la mémoire à environ quatre fois cette valeur donne à la fonction environ quatre vCPU, et les quatre processus peuvent alors s'exécuter en parallèle."
  options:
    a:
      en: "The architecture changes the processor type, not the amount of CPU power allocated to the function, which still depends on the memory setting."
      fr: "L'architecture change le type de processeur, pas la quantité de puissance de processeur allouée à la fonction, qui dépend toujours du paramètre de mémoire."
    b:
      en: "Reserved concurrency limits and guarantees the number of concurrent invocations; the four chunks are processed inside one invocation, which still has one vCPU."
      fr: "La simultanéité réservée limite et garantit le nombre d'invocations simultanées ; les quatre blocs sont traités dans une seule invocation, qui ne dispose toujours que d'un vCPU."
    c:
      en: "Provisioned concurrency pre-initializes execution environments for separate invocations; it does not add CPU power to the invocation that runs the four processes."
      fr: "La simultanéité provisionnée pré-initialise des environnements d'exécution pour des invocations distinctes ; elle n'ajoute pas de puissance de processeur à l'invocation qui exécute les quatre processus."
references:
  - title: Configure Lambda Event Function memory
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html
