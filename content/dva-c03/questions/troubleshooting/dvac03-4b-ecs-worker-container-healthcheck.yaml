id: dvac03-4b-ecs-worker-container-healthcheck
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a background worker as an Amazon ECS service on AWS Fargate, with no load balancer. The worker process sometimes deadlocks while its container keeps running. The worker exposes `http://localhost:8080/healthz`, which fails when the process is deadlocked, and the image includes `curl`. Deadlocked tasks must be replaced automatically.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un processus d'arrière-plan en tant que service Amazon ECS sur AWS Fargate, sans équilibreur de charge. Le processus se bloque parfois (interblocage) alors que son conteneur continue de s'exécuter. Le processus expose `http://localhost:8080/healthz`, qui échoue en cas d'interblocage, et l'image contient `curl`. Les tâches bloquées doivent être remplacées automatiquement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on the deployment circuit breaker with rollback so that the service replaces tasks that stop working.", fr: "Activer le disjoncteur de déploiement avec restauration pour que le service remplace les tâches qui cessent de fonctionner." } }
    - { id: b, text: { en: "Set a health check grace period of 300 seconds on the service so that it restarts tasks that do not respond.", fr: "Définir une période de grâce de vérification de l'état de 300 secondes sur le service pour qu'il redémarre les tâches qui ne répondent pas." } }
    - { id: c, text: { en: "Add a container health check that runs `curl -f http://localhost:8080/healthz || exit 1` to the essential container.", fr: "Ajouter au conteneur essentiel une vérification de l'état qui exécute `curl -f http://localhost:8080/healthz || exit 1`." } }
    - { id: d, text: { en: "Create a CloudWatch alarm on the service's `CPUUtilization` that stops the tasks when CPU drops.", fr: "Créer une alarme CloudWatch sur `CPUUtilization` du service qui arrête les tâches quand le processeur baisse." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A container health check runs its command inside the container; a non-zero exit code counts as a failure, and after the configured retries the container becomes UNHEALTHY. An UNHEALTHY essential container makes the task UNHEALTHY, and the service scheduler stops it and launches a replacement."
    fr: "Une vérification de l'état de conteneur exécute sa commande dans le conteneur ; un code de sortie non nul compte comme un échec et, après le nombre de tentatives configuré, le conteneur devient UNHEALTHY. Un conteneur essentiel UNHEALTHY rend la tâche UNHEALTHY, et le planificateur du service l'arrête et lance une tâche de remplacement."
  options:
    a:
      en: "The circuit breaker watches deployments that fail to reach a steady state; it does not detect a deadlock in a running task."
      fr: "Le disjoncteur surveille les déploiements qui n'atteignent pas un état stable ; il ne détecte pas l'interblocage d'une tâche en cours d'exécution."
    b:
      en: "A grace period only tells the scheduler to ignore failing health checks after start; with no health check defined, it does nothing."
      fr: "Une période de grâce indique seulement au planificateur d'ignorer les échecs de vérification après le démarrage ; sans vérification définie, elle n'a aucun effet."
    d:
      en: "CloudWatch alarm actions cannot stop ECS tasks, and low CPU does not reliably indicate a deadlock."
      fr: "Les actions d'alarme CloudWatch ne peuvent pas arrêter des tâches ECS, et une faible utilisation du processeur n'indique pas de façon fiable un interblocage."
references:
  - title: Determine Amazon ECS task health using container health checks
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/healthcheck.html
  - title: HealthCheck
    url: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_HealthCheck.html
