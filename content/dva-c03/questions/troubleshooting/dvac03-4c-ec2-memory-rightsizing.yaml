id: dvac03-4c-ec2-memory-rightsizing
objective: "4.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a memory-intensive Java application on Amazon EC2 instances that run Linux. The company has opted in to AWS Compute Optimizer, but the instance recommendations do not take memory use into account. The application also has a processing peak at the end of each month, every 30 days. A developer needs rightsizing recommendations that consider both the memory use of the instances and the monthly peak.

    Which two actions should the developer take? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany exécute une application Java gourmande en mémoire sur des instances Amazon EC2 sous Linux. L'entreprise a activé AWS Compute Optimizer, mais les recommandations d'instances ne tiennent pas compte de l'utilisation de la mémoire. L'application connaît aussi un pic de traitement à la fin de chaque mois, tous les 30 jours. Un développeur a besoin de recommandations de dimensionnement qui tiennent compte à la fois de l'utilisation de la mémoire des instances et du pic mensuel.

    Quelles sont les deux actions que le développeur doit effectuer ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on detailed monitoring for the instances to publish metrics every minute.", fr: "Activer la surveillance détaillée des instances pour publier les métriques toutes les minutes." } }
    - { id: b, text: { en: "Publish the JVM heap usage as a custom metric in a namespace named AnyCompany/App.", fr: "Publier l'utilisation du tas de la JVM comme métrique personnalisée dans un espace de noms nommé AnyCompany/App." } }
    - { id: c, text: { en: "Install the CloudWatch agent and publish mem_used_percent in the CWAgent namespace with the InstanceId dimension.", fr: "Installer l'agent CloudWatch et publier mem_used_percent dans l'espace de noms CWAgent avec la dimension InstanceId." } }
    - { id: d, text: { en: "Create a CloudWatch alarm on the CPUUtilization metric of each instance.", fr: "Créer une alarme CloudWatch sur la métrique CPUUtilization de chaque instance." } }
    - { id: e, text: { en: "Activate the enhanced infrastructure metrics recommendation preference in Compute Optimizer.", fr: "Activer la préférence de recommandation enhanced infrastructure metrics dans Compute Optimizer." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Memory metrics are not collected from EC2 instances by default: Compute Optimizer analyzes memory when the CloudWatch agent publishes mem_used_percent in the CWAgent namespace with the InstanceId dimension. By default, Compute Optimizer analyzes the last 14 days of metrics, which can miss a peak that occurs every 30 days; the enhanced infrastructure metrics preference extends the analysis to up to 93 days."
    fr: "Les métriques de mémoire ne sont pas collectées par défaut sur les instances EC2 : Compute Optimizer analyse la mémoire quand l'agent CloudWatch publie mem_used_percent dans l'espace de noms CWAgent avec la dimension InstanceId. Par défaut, Compute Optimizer analyse les 14 derniers jours de métriques, ce qui peut manquer un pic qui survient tous les 30 jours ; la préférence enhanced infrastructure metrics étend l'analyse jusqu'à 93 jours."
  options:
    a:
      en: "Detailed monitoring increases the frequency of the default EC2 metrics; it does not add memory metrics or lengthen the analysis period."
      fr: "La surveillance détaillée augmente la fréquence des métriques EC2 par défaut ; elle n'ajoute pas de métriques de mémoire et n'allonge pas la période d'analyse."
    b:
      en: "Compute Optimizer reads memory only from specific metric names, such as mem_used_percent in the CWAgent namespace; a custom heap metric in another namespace is ignored."
      fr: "Compute Optimizer ne lit la mémoire qu'à partir de noms de métriques précis, comme mem_used_percent dans l'espace de noms CWAgent ; une métrique personnalisée de tas dans un autre espace de noms est ignorée."
    d:
      en: "An alarm notifies when CPU crosses a threshold; it does not provide memory data or change how Compute Optimizer builds recommendations."
      fr: "Une alarme avertit quand le processeur franchit un seuil ; elle ne fournit pas de données de mémoire et ne change pas la manière dont Compute Optimizer établit ses recommandations."
references:
  - title: EC2 instance metrics
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/ec2-metrics-analyzed.html
  - title: Metrics analyzed by AWS Compute Optimizer
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/metrics.html
