id: dvac03-4a-vpc-endpoints-timeout
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an AWS Lambda function that was recently attached to private subnets of a VPC so that it can reach an Amazon RDS database. The subnets have no route to an internet gateway or a NAT gateway. Since the change, every call that the function makes to Amazon DynamoDB and to AWS Secrets Manager hangs until the invocation fails with "Task timed out after 3.01 seconds". Traffic to these services must not use an internet path.

    Which combination of actions will resolve the issue? (Choose two.)
  fr: |
    Une entreprise exécute une fonction AWS Lambda récemment attachée à des sous-réseaux privés d'un VPC pour accéder à une base de données Amazon RDS. Les sous-réseaux n'ont aucune route vers une passerelle Internet ni vers une passerelle NAT. Depuis ce changement, chaque appel de la fonction vers Amazon DynamoDB et vers AWS Secrets Manager reste bloqué jusqu'à l'échec de l'appel avec « Task timed out after 3.01 seconds ». Le trafic vers ces services ne doit emprunter aucun chemin Internet.

    Quelle combinaison d'actions résout le problème ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase the function timeout to 60 seconds so that the SDK calls have time to complete.", fr: "Augmenter le délai d'expiration de la fonction à 60 secondes pour laisser aux appels SDK le temps d'aboutir." } }
    - { id: b, text: { en: "Create a gateway VPC endpoint for DynamoDB and associate it with the route tables of the private subnets.", fr: "Créer un point de terminaison de VPC de type passerelle pour DynamoDB et l'associer aux tables de routage des sous-réseaux privés." } }
    - { id: c, text: { en: "Move the function to public subnets that have a route to an internet gateway.", fr: "Déplacer la fonction dans des sous-réseaux publics qui ont une route vers une passerelle Internet." } }
    - { id: d, text: { en: "Create an interface VPC endpoint for Secrets Manager in the private subnets with private DNS enabled.", fr: "Créer un point de terminaison de VPC d'interface pour Secrets Manager dans les sous-réseaux privés, avec le DNS privé activé." } }
    - { id: e, text: { en: "Add an inbound rule for port 443 to the security group of the function.", fr: "Ajouter une règle entrante pour le port 443 au groupe de sécurité de la fonction." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A VPC-connected function can reach only what the VPC can reach, so calls to public service endpoints hang until the function times out. A gateway endpoint adds a route to DynamoDB in the associated route tables at no additional charge, and an interface endpoint with private DNS resolves the Secrets Manager endpoint name to private IP addresses in the subnets. Neither endpoint uses an internet path."
    fr: "Une fonction connectée à un VPC n'atteint que ce que le VPC peut atteindre : les appels aux points de terminaison publics des services restent bloqués jusqu'à l'expiration de la fonction. Un point de terminaison de passerelle ajoute une route vers DynamoDB dans les tables de routage associées sans frais supplémentaires, et un point de terminaison d'interface avec DNS privé résout le nom du point de terminaison de Secrets Manager en adresses IP privées des sous-réseaux. Aucun des deux n'emprunte de chemin Internet."
  options:
    a:
      en: "There is no route to the services, so a longer timeout only makes each failing invocation last longer."
      fr: "Il n'existe aucune route vers les services : un délai plus long ne fait qu'allonger chaque appel en échec."
    c:
      en: "Connecting a function to a public subnet does not give it internet access, and the requirement forbids an internet path anyway."
      fr: "Connecter une fonction à un sous-réseau public ne lui donne pas d'accès Internet, et l'exigence interdit de toute façon un chemin Internet."
    e:
      en: "Security groups are stateful and the calls are outbound; an inbound rule does not create a route to the services."
      fr: "Les groupes de sécurité sont avec état et les appels sont sortants ; une règle entrante ne crée aucune route vers les services."
references:
  - title: Gateway endpoints for Amazon DynamoDB
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-ddb.html
  - title: Enable internet access for VPC-connected Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc-internet.html
