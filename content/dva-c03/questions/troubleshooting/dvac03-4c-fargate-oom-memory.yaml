id: dvac03-4c-fargate-oom-memory
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a reporting application as Amazon ECS tasks on AWS Fargate. The task definition sets a task size of 0.5 vCPU and 1 GB of memory, and the single container has a memory hard limit of 1,024 MiB. Each month-end report is generated by one task. During month-end processing, tasks stop with the reason `OutOfMemoryError: Container killed due to memory usage`. Container Insights shows that memory use peaks at about 1.6 GB, while CPU utilization stays below 40 %. The company needs to fix the issue at the LOWEST cost.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application de reporting sous forme de tâches Amazon ECS sur AWS Fargate. La définition de tâche fixe une taille de tâche de 0,5 vCPU et 1 Go de mémoire, et l'unique conteneur a une limite stricte de mémoire de 1 024 Mio. Chaque rapport de fin de mois est généré par une seule tâche. Pendant le traitement de fin de mois, des tâches s'arrêtent avec le motif `OutOfMemoryError: Container killed due to memory usage`. Container Insights montre que l'utilisation de la mémoire culmine à environ 1,6 Go, tandis que l'utilisation du processeur reste inférieure à 40 %. L'entreprise doit corriger le problème au coût le plus BAS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the task memory to 2 GB with 0.5 vCPU, and raise the container memory hard limit to fit the new task size.", fr: "Porter la mémoire de la tâche à 2 Go avec 0,5 vCPU et relever la limite stricte de mémoire du conteneur selon la nouvelle taille de tâche." }
    - id: b
      text: { en: "Set the container memoryReservation to 2,048 MiB, and keep the task size and the hard limit unchanged.", fr: "Définir le paramètre memoryReservation du conteneur à 2 048 Mio et conserver la taille de tâche et la limite stricte." }
    - id: c
      text: { en: "Increase the task CPU to 2 vCPU, and keep the task memory and the container memory unchanged.", fr: "Porter le processeur de la tâche à 2 vCPU et conserver la mémoire de la tâche et celle du conteneur." }
    - id: d
      text: { en: "Increase the desired count of the service so that more tasks share the month-end load.", fr: "Augmenter le nombre souhaité de tâches du service afin que davantage de tâches se partagent la charge de fin de mois." }
answer: { optionId: a }
explanation:
  correct:
    en: "The container is killed because it tries to use more memory than its hard limit. On Fargate, 0.5 vCPU supports 1, 2, 3 or 4 GB of memory, so 2 GB is the smallest valid task size that holds the 1.6 GB peak without paying for CPU the task does not use. The container hard limit must also be raised, because the container is killed as soon as it exceeds that value."
    fr: "Le conteneur est arrêté parce qu'il tente d'utiliser plus de mémoire que sa limite stricte. Sur Fargate, 0,5 vCPU accepte 1, 2, 3 ou 4 Go de mémoire : 2 Go est donc la plus petite taille de tâche valide qui absorbe le pic de 1,6 Go sans payer de processeur inutilisé. La limite stricte du conteneur doit aussi être relevée, car le conteneur est arrêté dès qu'il dépasse cette valeur."
  options:
    b:
      en: "memoryReservation is a soft limit that must be lower than the hard limit and fit in the task memory; it cannot give the container more than 1 GB here."
      fr: "memoryReservation est une limite souple qui doit être inférieure à la limite stricte et tenir dans la mémoire de la tâche ; elle ne peut pas donner plus de 1 Go au conteneur ici."
    c:
      en: "CPU is not the bottleneck; the memory limits stay at 1 GB, so the container is still killed, and the extra CPU adds cost."
      fr: "Le processeur n'est pas le goulet d'étranglement ; les limites de mémoire restent à 1 Go, donc le conteneur est toujours arrêté, et le processeur supplémentaire ajoute un coût."
    d:
      en: "Each report is generated by a single task, so additional tasks do not reduce the memory needed by the task that runs a report."
      fr: "Chaque rapport est généré par une seule tâche ; des tâches supplémentaires ne réduisent donc pas la mémoire nécessaire à la tâche qui produit un rapport."
references:
  - title: Troubleshooting Amazon ECS OutOfMemoryError errors
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/out-of-memory.html
  - title: Amazon ECS task definition parameters for Fargate
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definition_parameters.html
