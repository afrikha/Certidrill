id: dvac03-4c-kiro-cloudwatch-mcp
objective: "4.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer at AnyCompany uses Kiro to optimize a set of AWS Lambda functions. The developer wants the Kiro agent to base its suggestions on the actual production telemetry of the account, such as function duration metrics, active alarms, and log patterns. The agent must query this data on demand during the conversation, without the developer copying data into the chat.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany utilise Kiro pour optimiser un ensemble de fonctions AWS Lambda. Il veut que l'agent Kiro fonde ses suggestions sur la télémétrie de production réelle du compte, comme les métriques de durée des fonctions, les alarmes actives et les modèles de journaux. L'agent doit interroger ces données à la demande pendant la conversation, sans que le développeur copie de données dans la conversation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add the AWS Documentation MCP server to the MCP configuration of Kiro.", fr: "Ajouter le serveur MCP AWS Documentation à la configuration MCP de Kiro." }
    - id: b
      text: { en: "Create a steering file and paste the latest metrics and alarms into it every week.", fr: "Créer un fichier d'orientation (steering) et y coller chaque semaine les dernières métriques et alarmes." }
    - id: c
      text: { en: "Create an agent hook that runs each time a handler file is saved.", fr: "Créer un hook d'agent qui s'exécute chaque fois qu'un fichier de gestionnaire est enregistré." }
    - id: d
      text: { en: "Add the AWS Labs CloudWatch MCP server to Kiro with credentials that can read CloudWatch data.", fr: "Ajouter le serveur MCP CloudWatch d'AWS Labs à Kiro avec des informations d'identification qui peuvent lire les données CloudWatch." }
answer: { optionId: d }
explanation:
  correct:
    en: "MCP servers give Kiro additional tools and context from external systems. The open source CloudWatch MCP server lets AI agents analyze metrics, alarms and logs, including log pattern detection, through a conversational interface, so the agent can query production telemetry when it needs it."
    fr: "Les serveurs MCP apportent à Kiro des outils et du contexte supplémentaires provenant de systèmes externes. Le serveur MCP CloudWatch open source permet à des agents d'IA d'analyser des métriques, des alarmes et des journaux, y compris la détection de modèles de journaux, via une interface conversationnelle : l'agent peut donc interroger la télémétrie de production quand il en a besoin."
  options:
    a:
      en: "The AWS Documentation MCP server searches and reads AWS documentation; it has no access to the metrics, alarms or logs of the account."
      fr: "Le serveur MCP AWS Documentation recherche et lit la documentation AWS ; il n'a pas accès aux métriques, aux alarmes ni aux journaux du compte."
    b:
      en: "A steering file holds static text that is out of date between updates, and pasting the data is the manual copying the developer wants to avoid."
      fr: "Un fichier d'orientation contient du texte statique, obsolète entre deux mises à jour, et y coller les données est précisément la copie manuelle que le développeur veut éviter."
    c:
      en: "A hook triggers agent actions on file events; it does not give the agent access to CloudWatch data."
      fr: "Un hook déclenche des actions d'agent sur des événements de fichiers ; il ne donne pas à l'agent l'accès aux données CloudWatch."
references:
  - title: Amazon CloudWatch and Application Signals MCP servers for AI-assisted troubleshooting
    url: https://aws.amazon.com/about-aws/whats-new/2025/07/amazon-cloudwatch-application-signals-mcp-servers-for-ai-assisted-troubleshooting
