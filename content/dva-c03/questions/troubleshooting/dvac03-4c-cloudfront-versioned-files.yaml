id: dvac03-4c-cloudfront-versioned-files
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany hosts a single-page application in Amazon S3 behind Amazon CloudFront and deploys several times each day. The JavaScript and CSS files are cached for one year to keep pages fast, and index.html is cached for 60 seconds. After a deployment, users receive the old app.js file. Users who load the new index.html must get the new files immediately, and users who still have the previous index.html must keep receiving the files that match it.

    Which solution will meet these requirements?
  fr: |
    AnyCompany héberge une application monopage dans Amazon S3 derrière Amazon CloudFront et déploie plusieurs fois par jour. Les fichiers JavaScript et CSS sont mis en cache pendant un an pour garder des pages rapides, et index.html est mis en cache pendant 60 secondes. Après un déploiement, les utilisateurs reçoivent l'ancien fichier app.js. Les utilisateurs qui chargent le nouvel index.html doivent obtenir immédiatement les nouveaux fichiers, et ceux qui ont encore l'index.html précédent doivent continuer à recevoir les fichiers qui lui correspondent.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a build version to each JavaScript and CSS file name, and reference the new names from index.html.", fr: "Ajouter un numéro de build au nom de chaque fichier JavaScript et CSS, et référencer les nouveaux noms depuis index.html." }
    - id: b
      text: { en: "Create a CloudFront invalidation for the /* path after each deployment.", fr: "Créer une invalidation CloudFront pour le chemin /* après chaque déploiement." }
    - id: c
      text: { en: "Set the TTL of the JavaScript and CSS files to 0 in the cache policy.", fr: "Définir la TTL des fichiers JavaScript et CSS à 0 dans la politique de cache." }
    - id: d
      text: { en: "Turn on S3 Versioning for the bucket that stores the application files.", fr: "Activer S3 Versioning pour le compartiment qui stocke les fichiers de l'application." }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS recommends a version identifier in file or folder names to update content served by CloudFront. A new name is a new object, so it is fetched from the origin immediately without waiting for the cached file to expire and without paying for invalidations, and the old files keep serving the users of the previous index.html."
    fr: "AWS recommande un identifiant de version dans les noms de fichiers ou de dossiers pour mettre à jour le contenu servi par CloudFront. Un nouveau nom est un nouvel objet : il est récupéré immédiatement depuis l'origine sans attendre l'expiration du fichier en cache et sans payer d'invalidations, et les anciens fichiers continuent de servir les utilisateurs de l'index.html précédent."
  options:
    b:
      en: "An invalidation replaces app.js under the same name, so users who still have the previous index.html would receive files that do not match it."
      fr: "Une invalidation remplace app.js sous le même nom : les utilisateurs qui ont encore l'index.html précédent recevraient des fichiers qui ne lui correspondent pas."
    c:
      en: "A TTL of 0 sends every asset request to the origin, which removes the benefit of caching the files for one year and slows pages."
      fr: "Une TTL de 0 envoie chaque requête de ressource à l'origine, ce qui supprime l'intérêt de la mise en cache d'un an et ralentit les pages."
    d:
      en: "S3 Versioning keeps previous versions of objects in the bucket; it does not change what CloudFront serves from its cache."
      fr: "S3 Versioning conserve les versions précédentes des objets dans le compartiment ; il ne change pas ce que CloudFront sert depuis son cache."
references:
  - title: Use file versioning to update or remove content with a CloudFront distribution
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/UpdatingExistingObjects.html
