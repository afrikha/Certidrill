id: dvac03-4a-insights-json-string
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application logs JSON events to CloudWatch Logs. The payload field of each event is a JSON-encoded string, as in the following event.

    ```json
    { "level": "ERROR", "payload": "{\"orderId\":\"o-5521\",\"amount\":42}" }
    ```

    The CloudWatch Logs Insights query `filter payload.orderId = "o-5521"` returns no results, although the event exists in the selected time range.

    Which query will return the events for order o-5521?
  fr: |
    Une application journalise des événements JSON dans CloudWatch Logs. Le champ payload de chaque événement est une chaîne encodée en JSON, comme dans l'événement suivant.

    ```json
    { "level": "ERROR", "payload": "{\"orderId\":\"o-5521\",\"amount\":42}" }
    ```

    La requête CloudWatch Logs Insights `filter payload.orderId = "o-5521"` ne renvoie aucun résultat, alors que l'événement existe dans la plage de temps sélectionnée.

    Quelle requête renvoie les événements de la commande o-5521 ?
body:
  options:
    - { id: a, text: "`filter payload.0.orderId = \"o-5521\"`" }
    - { id: b, text: "`filter @message.payload.orderId = \"o-5521\"`" }
    - { id: c, text: "`fields payload | filter orderId = \"o-5521\"`" }
    - { id: d, text: "`fields jsonParse(payload).orderId as orderId | filter orderId = \"o-5521\"`" }
answer: { optionId: d }
explanation:
  correct:
    en: "Dot notation only traverses fields that were stored as nested JSON objects at ingestion; a JSON-encoded string is a single leaf value. The jsonParse function parses the string so that its orderId sub-field can be extracted and then filtered."
    fr: "La notation pointée ne parcourt que les champs stockés comme objets JSON imbriqués lors de l'ingestion ; une chaîne encodée en JSON est une valeur unique. La fonction jsonParse analyse la chaîne pour que son sous-champ orderId puisse être extrait puis filtré."
  options:
    a:
      en: "The numeric path segment addresses an array element, and payload is a string, not an array."
      fr: "Le segment de chemin numérique désigne un élément de tableau, et payload est une chaîne, pas un tableau."
    b:
      en: "@message is the raw event text; prefixing the path with it does not parse the encoded string."
      fr: "@message est le texte brut de l'événement ; préfixer le chemin avec ce champ n'analyse pas la chaîne encodée."
    c:
      en: "No orderId field exists at the top level of the event, so the filter matches nothing."
      fr: "Aucun champ orderId n'existe au premier niveau de l'événement : le filtre ne trouve rien."
references:
  - title: Supported logs and discovered fields
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_AnalyzeLogData-discoverable-fields.html
