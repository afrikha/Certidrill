id: dvac03-4a-async-events-dropped
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon S3 event notifications invoke an AWS Lambda function asynchronously for each uploaded file. Some files are never processed. For the last day, the CloudWatch metrics of the function show AsyncEventsReceived at 12,000, Invocations at 14,500, Errors at 3,400 and AsyncEventsDropped at 950. The function has no dead-letter queue and no destination. The developer must keep every failed event so that it can be analyzed and reprocessed.

    Which solution will meet this requirement?
  fr: |
    Des notifications d'événements Amazon S3 appellent une fonction AWS Lambda de manière asynchrone pour chaque fichier chargé. Certains fichiers ne sont jamais traités. Sur la dernière journée, les métriques CloudWatch de la fonction indiquent AsyncEventsReceived à 12 000, Invocations à 14 500, Errors à 3 400 et AsyncEventsDropped à 950. La fonction n'a ni file d'attente de lettres mortes ni destination. Le développeur doit conserver chaque événement en échec pour pouvoir l'analyser et le retraiter.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Set the reserved concurrency of the function to 0 until the errors are fixed.", fr: "Définir la simultanéité réservée de la fonction sur 0 jusqu'à la correction des erreurs." } }
    - { id: b, text: { en: "Configure an on-failure destination, such as an Amazon SQS queue, for asynchronous invocations of the function.", fr: "Configurer une destination en cas d'échec, par exemple une file d'attente Amazon SQS, pour les appels asynchrones de la fonction." } }
    - { id: c, text: { en: "Increase the timeout of the function to its maximum value.", fr: "Porter le délai d'expiration de la fonction à sa valeur maximale." } }
    - { id: d, text: { en: "Enable the DeadLetterErrors metric so that dropped events are recorded in CloudWatch.", fr: "Activer la métrique DeadLetterErrors pour que les événements abandonnés soient enregistrés dans CloudWatch." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Invocations exceed AsyncEventsReceived because failed events are retried, and AsyncEventsDropped shows events discarded after the retries are exhausted or the maximum event age is reached. When an OnFailure destination or a dead-letter queue is configured, Lambda sends these events there before dropping them, so they can be analyzed and reprocessed."
    fr: "Invocations dépasse AsyncEventsReceived parce que les événements en échec sont réessayés, et AsyncEventsDropped montre les événements abandonnés après épuisement des nouvelles tentatives ou à l'atteinte de l'âge maximal de l'événement. Lorsqu'une destination OnFailure ou une file d'attente de lettres mortes est configurée, Lambda y envoie ces événements avant de les abandonner : ils peuvent alors être analysés et retraités."
  options:
    a:
      en: "With reserved concurrency set to 0, every event is throttled and eventually dropped, which loses even more events."
      fr: "Avec une simultanéité réservée de 0, chaque événement est limité puis finit par être abandonné, ce qui fait perdre encore plus d'événements."
    c:
      en: "The metrics do not show that the errors are timeouts, and a longer timeout does not keep the events that still fail."
      fr: "Les métriques ne montrent pas que les erreurs sont des expirations, et un délai plus long ne conserve pas les événements qui échouent encore."
    d:
      en: "DeadLetterErrors counts failures to deliver to a dead-letter queue; a metric does not store the event payloads."
      fr: "DeadLetterErrors compte les échecs de livraison vers une file d'attente de lettres mortes ; une métrique ne stocke pas le contenu des événements."
references:
  - title: Types of metrics for Lambda functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-types.html
