id: dvac03-4a-xray-segment-flags
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer investigates a failed request of a checkout service. The trace contains the following segment document (simplified).

    ```json
    {
      "name": "checkout-service",
      "http": { "response": { "status": 500 } },
      "fault": true,
      "subsegments": [
        {
          "name": "payments.example.com",
          "namespace": "remote",
          "http": { "response": { "status": 429 } },
          "error": true,
          "throttle": true
        }
      ]
    }
    ```

    Which two conclusions can the developer draw from this segment? (Choose two.)
  fr: |
    Un développeur analyse une requête en échec d'un service de paiement de commandes. La trace contient le document de segment suivant (simplifié).

    ```json
    {
      "name": "checkout-service",
      "http": { "response": { "status": 500 } },
      "fault": true,
      "subsegments": [
        {
          "name": "payments.example.com",
          "namespace": "remote",
          "http": { "response": { "status": 429 } },
          "error": true,
          "throttle": true
        }
      ]
    }
    ```

    Quelles sont les deux conclusions que le développeur peut tirer de ce segment ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The downstream payments API throttled the call made by the checkout service.", fr: "L'API de paiement en aval a limité l'appel effectué par le service de paiement de commandes." } }
    - { id: b, text: { en: "The client of the checkout service sent an invalid request.", fr: "Le client du service de paiement de commandes a envoyé une requête non valide." } }
    - { id: c, text: { en: "The checkout service returned a server error to its caller.", fr: "Le service de paiement de commandes a renvoyé une erreur serveur à son appelant." } }
    - { id: d, text: { en: "The call to payments.example.com was made with an AWS SDK client.", fr: "L'appel vers payments.example.com a été effectué avec un client du kit SDK AWS." } }
    - { id: e, text: { en: "The payments API had an internal server fault.", fr: "L'API de paiement a subi une défaillance interne du serveur." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "In a segment document, throttle is set for a 429 Too Many Requests response, error for a 4xx client error and fault for a 5xx server error. The subsegment therefore shows that the downstream API throttled the call, and the segment shows that the checkout service answered its own caller with a 500 server error."
    fr: "Dans un document de segment, throttle est défini pour une réponse 429 Too Many Requests, error pour une erreur client 4xx et fault pour une erreur serveur 5xx. Le sous-segment montre donc que l'API en aval a limité l'appel, et le segment montre que le service de paiement de commandes a répondu à son propre appelant par une erreur serveur 500."
  options:
    b:
      en: "A client error would set error on the checkout-service segment with a 4xx status; the segment has fault and status 500."
      fr: "Une erreur client définirait error sur le segment checkout-service avec un statut 4xx ; le segment a fault et le statut 500."
    d:
      en: "The remote namespace is used for downstream calls other than AWS SDK calls, which use the aws namespace."
      fr: "L'espace de noms remote est utilisé pour les appels en aval autres que les appels du kit SDK AWS, qui utilisent l'espace de noms aws."
    e:
      en: "The payments subsegment has status 429 with error and throttle, not a 5xx status with fault."
      fr: "Le sous-segment de paiement a le statut 429 avec error et throttle, pas un statut 5xx avec fault."
references:
  - title: AWS X-Ray segment documents
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-api-segmentdocuments.html
