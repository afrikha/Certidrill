id: dvac03-4b-alarm-encrypted-sns-topic
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AnyCompany CloudWatch alarm goes into the ALARM state, but its Amazon SNS topic never delivers the notification. A message published to the topic from the console reaches the confirmed email subscribers. The topic uses server-side encryption with the AWS managed key `aws/sns`.

    Which solution will make the alarm notifications reach the subscribers?
  fr: |
    Une alarme CloudWatch d'AnyCompany passe à l'état ALARM, mais sa rubrique Amazon SNS ne livre jamais la notification. Un message publié dans la rubrique depuis la console parvient aux abonnés e-mail confirmés. La rubrique utilise le chiffrement côté serveur avec la clé gérée par AWS `aws/sns`.

    Quelle solution permet aux notifications de l'alarme de parvenir aux abonnés ?
body:
  options:
    - { id: a, text: { en: "Add a statement to the key policy of `aws/sns` that allows `cloudwatch.amazonaws.com` to call `kms:GenerateDataKey*` and `kms:Decrypt`.", fr: "Ajouter à la politique de clé de `aws/sns` une instruction qui autorise `cloudwatch.amazonaws.com` à appeler `kms:GenerateDataKey*` et `kms:Decrypt`." } }
    - { id: b, text: { en: "Encrypt the topic with a customer managed key whose key policy allows `cloudwatch.amazonaws.com` to use the key.", fr: "Chiffrer la rubrique avec une clé gérée par le client dont la politique de clé autorise `cloudwatch.amazonaws.com` à utiliser la clé." } }
    - { id: c, text: { en: "Add a statement to the topic policy that allows `cloudwatch.amazonaws.com` to call `sns:Publish`, and keep the current key.", fr: "Ajouter à la politique de rubrique une instruction qui autorise `cloudwatch.amazonaws.com` à appeler `sns:Publish`, et conserver la clé actuelle." } }
    - { id: d, text: { en: "Attach an IAM role that allows `sns:Publish` and `kms:Decrypt` to the alarm, and select it in the alarm action.", fr: "Attacher à l'alarme un rôle IAM qui autorise `sns:Publish` et `kms:Decrypt`, et le sélectionner dans l'action d'alarme." } }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudWatch alarms can publish to an encrypted topic only if CloudWatch can use the KMS key. That requires a customer managed symmetric key whose key policy allows the `cloudwatch.amazonaws.com` service principal to call `kms:GenerateDataKey*` and `kms:Decrypt`."
    fr: "Les alarmes CloudWatch ne peuvent publier dans une rubrique chiffrée que si CloudWatch peut utiliser la clé KMS. Il faut une clé symétrique gérée par le client dont la politique de clé autorise le principal de service `cloudwatch.amazonaws.com` à appeler `kms:GenerateDataKey*` et `kms:Decrypt`."
  options:
    a:
      en: "The key policy of an AWS managed key cannot be edited, which is why a customer managed key is needed."
      fr: "La politique de clé d'une clé gérée par AWS ne peut pas être modifiée : c'est pourquoi une clé gérée par le client est nécessaire."
    c:
      en: "Publishing permission alone does not help, because CloudWatch still cannot use the `aws/sns` key to encrypt the message."
      fr: "L'autorisation de publication seule n'aide pas : CloudWatch ne peut toujours pas utiliser la clé `aws/sns` pour chiffrer le message."
    d:
      en: "CloudWatch alarm actions do not use an IAM role that you attach; access is granted to the CloudWatch service principal in the key policy."
      fr: "Les actions d'alarme CloudWatch n'utilisent pas de rôle IAM que vous attachez ; l'accès est accordé au principal de service CloudWatch dans la politique de clé."
references:
  - title: Managing Amazon SNS encryption keys and costs
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-key-management.html
