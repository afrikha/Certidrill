id: dvac03-4a-filter-pattern-json
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A service writes one JSON log event per HTTP request to a CloudWatch Logs log group named /app/api. Each event contains a numeric statusCode field. From a terminal, a developer needs to retrieve only the events whose statusCode is 500 by using the AWS CLI.

    Which command will meet this requirement?
  fr: |
    Un service écrit un événement de journal JSON par requête HTTP dans un groupe de journaux CloudWatch Logs nommé /app/api. Chaque événement contient un champ numérique statusCode. Depuis un terminal, un développeur doit récupérer uniquement les événements dont statusCode vaut 500 à l'aide de l'AWS CLI.

    Quelle commande répond à cette exigence ?
body:
  options:
    - { id: a, text: "`aws logs filter-log-events --log-group-name /app/api --filter-pattern 'statusCode=500'`" }
    - { id: b, text: "`aws logs filter-log-events --log-group-name /app/api --filter-pattern '[$.statusCode = 500]'`" }
    - { id: c, text: "`aws logs filter-log-events --log-group-name /app/api --filter-pattern '{ $.statusCode = 500 }'`" }
    - { id: d, text: "`aws logs filter-log-events --log-group-name /app/api --filter-pattern '{ statusCode == 500 }'`" }
answer: { optionId: c }
explanation:
  correct:
    en: "For JSON log events, a filter pattern is a selector in braces that starts with $ and compares a field, for example { $.statusCode = 500 }. The same syntax works for filter-log-events, metric filters, subscription filters and Live Tail."
    fr: "Pour les événements de journal JSON, un modèle de filtre est un sélecteur entre accolades qui commence par $ et compare un champ, par exemple { $.statusCode = 500 }. La même syntaxe fonctionne pour filter-log-events, les filtres de métriques, les filtres d'abonnement et Live Tail."
  options:
    a:
      en: "Without braces, the pattern is a term match on the text statusCode=500, which does not appear in the JSON text of the events."
      fr: "Sans accolades, le modèle recherche le terme statusCode=500, qui n'apparaît pas dans le texte JSON des événements."
    b:
      en: "Square brackets introduce a pattern for space-delimited events, not a JSON selector."
      fr: "Les crochets introduisent un modèle pour des événements délimités par des espaces, pas un sélecteur JSON."
    d:
      en: "JSON selectors must start with $. and use = for equality, so this pattern is not valid."
      fr: "Les sélecteurs JSON doivent commencer par $. et utiliser = pour l'égalité : ce modèle n'est pas valide."
references:
  - title: Filter pattern syntax for metric filters, subscription filters, filter log events, and Live Tail
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/FilterAndPatternSyntax.html
