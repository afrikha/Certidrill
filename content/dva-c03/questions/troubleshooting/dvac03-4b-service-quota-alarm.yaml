id: dvac03-4b-service-quota-alarm
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AnyCompany application launches Amazon EC2 instances on demand. Last month, launches failed because the account reached a service quota. The developers must receive a notification when the usage of that quota goes above 80 percent of the applied quota value, and the alert must keep working if the quota is raised later.

    Which solution will meet these requirements?
  fr: |
    Une application d'AnyCompany lance des instances Amazon EC2 à la demande. Le mois dernier, des lancements ont échoué car le compte a atteint un quota de service. Les développeurs doivent recevoir une notification quand l'utilisation de ce quota dépasse 80 % de la valeur de quota appliquée, et l'alerte doit continuer de fonctionner si le quota est augmenté plus tard.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS Budgets cost budget for Amazon EC2 that sends an alert at 80 percent of the budgeted monthly amount.", fr: "Créer un budget de coûts AWS Budgets pour Amazon EC2 qui envoie une alerte à 80 % du montant mensuel budgété." } }
    - { id: b, text: { en: "Create an Amazon EventBridge rule that matches Service Quotas quota increase request events and targets an Amazon SNS topic.", fr: "Créer une règle Amazon EventBridge qui correspond aux événements de demande d'augmentation de quota de Service Quotas et cible une rubrique Amazon SNS." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on the average `CPUUtilization` of the instances with a threshold of 80 percent and an Amazon SNS action.", fr: "Créer une alarme CloudWatch sur la moyenne de `CPUUtilization` des instances avec un seuil de 80 % et une action Amazon SNS." } }
    - { id: d, text: { en: "Create a CloudWatch alarm with an SNS action on `m1/SERVICE_QUOTA(m1)*100` above 80, where `m1` is the quota usage metric.", fr: "Créer une alarme CloudWatch avec une action SNS sur `m1/SERVICE_QUOTA(m1)*100` au-dessus de 80, où `m1` est la métrique d'utilisation du quota." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Services publish usage metrics for some quotas, and the `SERVICE_QUOTA` metric math function returns the current quota value for a usage metric. Alarming on usage divided by the quota, times 100, fires at 80 percent and follows the quota when it changes."
    fr: "Les services publient des métriques d'utilisation pour certains quotas, et la fonction de calcul de métrique `SERVICE_QUOTA` renvoie la valeur actuelle du quota pour une métrique d'utilisation. Une alarme sur l'utilisation divisée par le quota, multipliée par 100, se déclenche à 80 % et suit le quota quand il change."
  options:
    a:
      en: "A cost budget tracks spending, not how close the account is to a service quota."
      fr: "Un budget de coûts suit les dépenses, pas la proximité du compte avec un quota de service."
    b:
      en: "These events report quota increase requests; they say nothing about current usage of the quota."
      fr: "Ces événements signalent des demandes d'augmentation de quota ; ils n'indiquent rien sur l'utilisation actuelle du quota."
    c:
      en: "CPU utilization measures the load of running instances, not the number of resources counted against the quota."
      fr: "L'utilisation du processeur mesure la charge des instances en cours d'exécution, pas le nombre de ressources décomptées du quota."
references:
  - title: Visualizing your service quotas and setting alarms
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Quotas-Visualize-Alarms.html
  - title: Service Quotas and Amazon CloudWatch alarms
    url: https://docs.aws.amazon.com/servicequotas/latest/userguide/configure-cloudwatch.html
