id: dvac03-4c-lambda-cpu-bound-memory
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a Python AWS Lambda function that resizes and compresses product images. The function uses the default memory setting of 128 MB. The REPORT log lines show a maximum memory used of about 90 MB, but each invocation takes about 9 seconds, and profiling shows that the time is spent in CPU-intensive compression code. The company needs to reduce the duration of each invocation without changing the code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une fonction AWS Lambda en Python qui redimensionne et compresse des images de produits. La fonction utilise le paramètre de mémoire par défaut de 128 Mo. Les lignes de journal REPORT indiquent une mémoire maximale utilisée d'environ 90 Mo, mais chaque invocation dure environ 9 secondes, et le profilage montre que ce temps est passé dans du code de compression gourmand en processeur. L'entreprise doit réduire la durée de chaque invocation sans modifier le code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure provisioned concurrency on an alias of the function.", fr: "Configurer la simultanéité provisionnée sur un alias de la fonction." }
    - id: b
      text: { en: "Increase the memory setting of the function.", fr: "Augmenter le paramètre de mémoire de la fonction." }
    - id: c
      text: { en: "Increase the timeout setting of the function.", fr: "Augmenter le paramètre de délai d'expiration de la fonction." }
    - id: d
      text: { en: "Increase the ephemeral storage of the function.", fr: "Augmenter le stockage éphémère de la fonction." }
answer: { optionId: b }
explanation:
  correct:
    en: "Lambda allocates CPU power in proportion to the memory configured for the function. A CPU-bound function therefore runs faster when its memory setting is increased, even if it does not need the extra memory. 128 MB is the lowest setting and is recommended only for simple functions."
    fr: "Lambda alloue la puissance de processeur proportionnellement à la mémoire configurée pour la fonction. Une fonction limitée par le processeur s'exécute donc plus vite quand on augmente son paramètre de mémoire, même si elle n'a pas besoin de la mémoire supplémentaire. 128 Mo est le paramètre le plus bas, recommandé uniquement pour des fonctions simples."
  options:
    a:
      en: "Provisioned concurrency keeps execution environments initialized to remove cold-start latency; it does not give the handler more CPU power during each invocation."
      fr: "La simultanéité provisionnée garde des environnements d'exécution initialisés pour supprimer la latence de démarrage à froid ; elle ne donne pas plus de puissance de processeur au gestionnaire pendant chaque invocation."
    c:
      en: "A longer timeout only lets the function run longer before it is stopped; it does not make the compression faster."
      fr: "Un délai d'expiration plus long permet seulement à la fonction de s'exécuter plus longtemps avant d'être arrêtée ; il n'accélère pas la compression."
    d:
      en: "Ephemeral storage is the /tmp space of the function; it does not change the CPU power available to the code."
      fr: "Le stockage éphémère est l'espace /tmp de la fonction ; il ne modifie pas la puissance de processeur disponible pour le code."
references:
  - title: Configure Lambda Event Function memory
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html
