id: dvac03-4c-emf-partner-latency
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Node.js AWS Lambda function calls a partner's payment API. A developer needs a custom Amazon CloudWatch metric for the time spent in this call, with a PartnerName dimension, so that the team can alarm on its p95. The solution must not add synchronous API calls to the invocation path. The request ID of each invocation must stay searchable in the logs but must not be a metric dimension.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda en Node.js appelle l'API de paiement d'un partenaire. Un développeur a besoin d'une métrique Amazon CloudWatch personnalisée pour le temps passé dans cet appel, avec une dimension PartnerName, afin que l'équipe puisse créer une alarme sur son p95. La solution ne doit pas ajouter d'appels d'API synchrones au chemin d'invocation. L'ID de requête de chaque invocation doit rester consultable dans les journaux, mais ne doit pas être une dimension de métrique.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Call the PutMetricData API at the end of each invocation, with PartnerName and the request ID as dimensions.", fr: "Appeler l'API PutMetricData à la fin de chaque invocation, avec PartnerName et l'ID de requête comme dimensions." }
    - id: b
      text: { en: "Write a log event in the embedded metric format with the latency metric, the PartnerName dimension, and the request ID as a property.", fr: "Écrire un événement de journal au format de métrique intégrée (EMF) avec la métrique de latence, la dimension PartnerName et l'ID de requête comme propriété." }
    - id: c
      text: { en: "Record the latency of the partner call as an annotation on the trace of each invocation.", fr: "Enregistrer la latence de l'appel au partenaire comme annotation sur la trace de chaque invocation." }
    - id: d
      text: { en: "Turn on Lambda Insights and create an alarm on the duration metric of the function.", fr: "Activer Lambda Insights et créer une alarme sur la métrique de durée de la fonction." }
answer: { optionId: b }
explanation:
  correct:
    en: "The embedded metric format embeds custom metrics in log events, and CloudWatch extracts them asynchronously, so the function makes no synchronous metrics API call. Only the declared dimensions, such as PartnerName, create metrics; other fields, such as the request ID, stay in the log event, where Logs Insights can query them."
    fr: "Le format de métrique intégrée (EMF) intègre des métriques personnalisées dans les événements de journal, et CloudWatch les extrait de manière asynchrone : la fonction n'effectue donc aucun appel synchrone à une API de métriques. Seules les dimensions déclarées, comme PartnerName, créent des métriques ; les autres champs, comme l'ID de requête, restent dans l'événement de journal, où Logs Insights peut les interroger."
  options:
    a:
      en: "PutMetricData is a synchronous API call in the invocation path, and using the request ID as a dimension would create a separate metric for each invocation."
      fr: "PutMetricData est un appel d'API synchrone dans le chemin d'invocation, et utiliser l'ID de requête comme dimension créerait une métrique distincte pour chaque invocation."
    c:
      en: "An annotation makes traces searchable, but it does not create a CloudWatch metric on which the team can alarm."
      fr: "Une annotation rend les traces consultables, mais ne crée pas de métrique CloudWatch sur laquelle l'équipe peut définir une alarme."
    d:
      en: "The function's duration includes all of its work, not only the partner call, and it has no PartnerName dimension."
      fr: "La durée de la fonction inclut tout son travail, pas seulement l'appel au partenaire, et elle n'a pas de dimension PartnerName."
references:
  - title: Embedding metrics within logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Embedded_Metric_Format.html
