id: dvac03-4c-dax-consistent-read
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer added a DynamoDB Accelerator (DAX) cluster in front of an Amazon DynamoDB table to reduce read latency. The application reads items with the following code:

    ```python
    response = dax.get_item(
        TableName="Profiles",
        Key={"PlayerId": {"S": player_id}},
        ConsistentRead=True,
    )
    ```

    After the change, the read latency is the same as before, and the DAX cluster shows almost no cache hits. The business accepts profile data that is a few seconds old.

    Which solution will reduce the read latency?
  fr: |
    Un développeur a ajouté un cluster DynamoDB Accelerator (DAX) devant une table Amazon DynamoDB pour réduire la latence de lecture. L'application lit les éléments avec le code suivant :

    ```python
    response = dax.get_item(
        TableName="Profiles",
        Key={"PlayerId": {"S": player_id}},
        ConsistentRead=True,
    )
    ```

    Après la modification, la latence de lecture est la même qu'avant, et le cluster DAX n'affiche presque aucun accès réussi au cache. Le métier accepte des données de profil vieilles de quelques secondes.

    Quelle solution réduit la latence de lecture ?
body:
  options:
    - id: a
      text: { en: "Remove ConsistentRead=True so that the GetItem calls use eventually consistent reads.", fr: "Supprimer ConsistentRead=True afin que les appels GetItem utilisent des lectures à cohérence éventuelle." }
    - id: b
      text: { en: "Increase the TTL of the item cache in the DAX parameter group.", fr: "Augmenter la durée de vie (TTL) du cache d'éléments dans le groupe de paramètres DAX." }
    - id: c
      text: { en: "Change the DAX cluster to a larger node type.", fr: "Passer le cluster DAX à un type de nœud plus grand." }
    - id: d
      text: { en: "Replace GetItem with a Query call that keeps ConsistentRead=True so that the query cache is used.", fr: "Remplacer GetItem par un appel Query qui conserve ConsistentRead=True afin d'utiliser le cache de requêtes." }
answer: { optionId: a }
explanation:
  correct:
    en: "DAX passes strongly consistent reads (ConsistentRead set to true) through to DynamoDB, and the results are not cached. Because the business accepts slightly stale data, using eventually consistent reads lets DAX serve the items from its item cache with microsecond latency."
    fr: "DAX transmet les lectures fortement cohérentes (ConsistentRead à true) directement à DynamoDB, et leurs résultats ne sont pas mis en cache. Comme le métier accepte des données légèrement obsolètes, utiliser des lectures à cohérence éventuelle permet à DAX de servir les éléments depuis son cache d'éléments avec une latence de l'ordre de la microseconde."
  options:
    b:
      en: "The TTL only matters for items stored in the cache; strongly consistent reads never populate it, so a longer TTL changes nothing."
      fr: "La TTL ne compte que pour les éléments stockés dans le cache ; les lectures fortement cohérentes ne l'alimentent jamais, donc une TTL plus longue ne change rien."
    c:
      en: "A larger node type adds capacity, but the requests still bypass the cache and go to DynamoDB."
      fr: "Un type de nœud plus grand ajoute de la capacité, mais les requêtes contournent toujours le cache et vont à DynamoDB."
    d:
      en: "Strongly consistent Query requests are also passed through to DynamoDB without being cached, so the latency would not improve."
      fr: "Les requêtes Query fortement cohérentes sont elles aussi transmises à DynamoDB sans être mises en cache : la latence ne s'améliorerait pas."
references:
  - title: DAX and DynamoDB consistency models
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.consistency.html
