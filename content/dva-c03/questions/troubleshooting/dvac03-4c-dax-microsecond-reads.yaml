id: dvac03-4c-dax-microsecond-reads
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's gaming application reads player profiles from an Amazon DynamoDB table with eventually consistent GetItem calls. The same profiles are read many times per minute, and the reads currently take single-digit milliseconds. The company needs microsecond read latency for these repeated reads with minimal changes to the application code.

    Which solution will meet these requirements?
  fr: |
    L'application de jeu d'AnyCompany lit des profils de joueurs dans une table Amazon DynamoDB avec des appels GetItem à cohérence éventuelle. Les mêmes profils sont lus de nombreuses fois par minute, et les lectures prennent actuellement quelques millisecondes. L'entreprise a besoin d'une latence de lecture de l'ordre de la microseconde pour ces lectures répétées, avec un minimum de modifications du code de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Switch the table to on-demand capacity mode.", fr: "Passer la table en mode de capacité à la demande." }
    - id: b
      text: { en: "Add an Amazon ElastiCache for Valkey cluster and implement lazy loading in the code.", fr: "Ajouter un cluster Amazon ElastiCache for Valkey et mettre en œuvre le chargement différé dans le code." }
    - id: c
      text: { en: "Create a DynamoDB Accelerator (DAX) cluster and replace the DynamoDB client with the DAX client.", fr: "Créer un cluster DynamoDB Accelerator (DAX) et remplacer le client DynamoDB par le client DAX." }
    - id: d
      text: { en: "Create a global secondary index and read the profiles from the index.", fr: "Créer un index secondaire global et lire les profils à partir de l'index." }
answer: { optionId: c }
explanation:
  correct:
    en: "DAX is an in-memory cache for DynamoDB that reduces the response time of eventually consistent reads from single-digit milliseconds to microseconds. It is API-compatible with DynamoDB, so the application mostly needs to use the DAX client instead of the DynamoDB client."
    fr: "DAX est un cache en mémoire pour DynamoDB qui ramène le temps de réponse des lectures à cohérence éventuelle de quelques millisecondes à quelques microsecondes. Il est compatible avec l'API DynamoDB : l'application doit surtout utiliser le client DAX à la place du client DynamoDB."
  options:
    a:
      en: "On-demand capacity changes how throughput is provisioned and billed; reads still have DynamoDB's millisecond latency."
      fr: "La capacité à la demande change la manière dont le débit est provisionné et facturé ; les lectures conservent la latence en millisecondes de DynamoDB."
    b:
      en: "ElastiCache can cache the profiles, but the application would need new cache-aside code, which is more than a minimal change."
      fr: "ElastiCache peut mettre les profils en cache, mais l'application aurait besoin d'un nouveau code de mise en cache à la demande (cache-aside), ce qui dépasse une modification minimale."
    d:
      en: "A global secondary index supports other access patterns; reads from it are still served by DynamoDB with millisecond latency."
      fr: "Un index secondaire global prend en charge d'autres modèles d'accès ; les lectures sur l'index restent servies par DynamoDB avec une latence en millisecondes."
references:
  - title: In-memory acceleration with DynamoDB Accelerator (DAX)
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html
