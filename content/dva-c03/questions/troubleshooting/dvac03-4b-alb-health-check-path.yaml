id: dvac03-4b-alb-health-check-path
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a web application on Amazon EC2 instances behind an Application Load Balancer. The target group uses the default health check settings. The application answers `/` with an HTTP 302 redirect to its login page, and all targets show `Target.ResponseCodeMismatch`. The application exposes `/health`, which returns HTTP 200 only when the application can serve requests. The health check must fail when the application cannot serve requests.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application web sur des instances Amazon EC2 derrière un Application Load Balancer. Le groupe cible utilise les paramètres de vérification de l'état par défaut. L'application répond à `/` par une redirection HTTP 302 vers sa page de connexion, et toutes les cibles indiquent `Target.ResponseCodeMismatch`. L'application expose `/health`, qui renvoie HTTP 200 uniquement quand elle peut traiter des requêtes. La vérification de l'état doit échouer quand l'application ne peut pas traiter de requêtes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the success codes of the health check to `200-499`.", fr: "Remplacer les codes de réussite de la vérification de l'état par `200-499`." } }
    - { id: b, text: { en: "Change the health check path of the target group to `/health`.", fr: "Remplacer le chemin de la vérification de l'état du groupe cible par `/health`." } }
    - { id: c, text: { en: "Increase the health check timeout to 60 seconds.", fr: "Augmenter le délai d'expiration de la vérification de l'état à 60 secondes." } }
    - { id: d, text: { en: "Decrease the healthy threshold count to 2.", fr: "Réduire le seuil de bonne santé à 2." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The default health check sends `GET /` and expects the default success code 200, so the 302 response is a response code mismatch. Pointing the health check to `/health`, which returns 200 only when the application can serve requests, makes targets healthy when they work and unhealthy when they do not."
    fr: "La vérification de l'état par défaut envoie `GET /` et attend le code de réussite par défaut 200 : la réponse 302 est donc une non-correspondance de code. Faire pointer la vérification vers `/health`, qui ne renvoie 200 que si l'application peut traiter des requêtes, rend les cibles saines quand elles fonctionnent et non saines sinon."
  options:
    a:
      en: "Accepting every code up to 499 would also accept errors such as 404, so the check would pass even when the application cannot serve requests."
      fr: "Accepter tous les codes jusqu'à 499 accepterait aussi des erreurs comme 404 : la vérification réussirait même si l'application ne peut pas traiter de requêtes."
    c:
      en: "The targets answer in time; the problem is the response code, not a timeout."
      fr: "Les cibles répondent à temps ; le problème est le code de réponse, pas un délai d'expiration."
    d:
      en: "Fewer successes are needed, but every check still fails with the 302 response."
      fr: "Moins de réussites sont nécessaires, mais chaque vérification échoue toujours avec la réponse 302."
references:
  - title: Health checks for Application Load Balancer target groups
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
