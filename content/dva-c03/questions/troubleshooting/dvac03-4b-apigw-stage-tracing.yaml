id: dvac03-4b-apigw-stage-tracing
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany exposes AWS Lambda functions through an Amazon API Gateway REST API. Active tracing is turned on for the functions. In the X-Ray trace map, the Lambda functions appear but API Gateway does not, and the developers cannot see how long requests spend in API Gateway.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose des fonctions AWS Lambda au moyen d'une API REST Amazon API Gateway. Le traçage actif est activé pour les fonctions. Dans la carte des traces X-Ray, les fonctions Lambda apparaissent mais pas API Gateway, et les développeurs ne voient pas le temps que les requêtes passent dans API Gateway.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the `AWSXRayDaemonWriteAccess` policy to the role in the API Gateway account settings.", fr: "Ajouter la politique `AWSXRayDaemonWriteAccess` au rôle défini dans les paramètres de compte d'API Gateway." } }
    - { id: b, text: { en: "Turn on X-Ray tracing in the settings of the API stage.", fr: "Activer le traçage X-Ray dans les paramètres de l'étape de l'API." } }
    - { id: c, text: { en: "Turn on API caching on the stage.", fr: "Activer la mise en cache de l'API sur l'étape." } }
    - { id: d, text: { en: "Turn on execution logging at the INFO level on the stage.", fr: "Activer la journalisation de l'exécution au niveau INFO sur l'étape." } }
answer: { optionId: b }
explanation:
  correct:
    en: "X-Ray tracing for a REST API is a stage setting. When it is turned on, API Gateway records a segment for the requests that it samples, so the API appears in the trace map with its own latency before the Lambda nodes."
    fr: "Le traçage X-Ray d'une API REST est un paramètre d'étape. Une fois activé, API Gateway enregistre un segment pour les requêtes qu'il échantillonne : l'API apparaît dans la carte des traces avec sa propre latence, avant les nœuds Lambda."
  options:
    a:
      en: "The account-level role is used to write CloudWatch logs; tracing stays off until it is turned on for the stage."
      fr: "Le rôle au niveau du compte sert à écrire les journaux CloudWatch ; le traçage reste désactivé tant qu'il n'est pas activé pour l'étape."
    c:
      en: "Caching stores responses to reduce calls to the backend; it does not produce traces."
      fr: "La mise en cache stocke les réponses pour réduire les appels au backend ; elle ne produit pas de traces."
    d:
      en: "Execution logs go to CloudWatch Logs; they do not add API Gateway to the X-Ray trace map."
      fr: "Les journaux d'exécution vont dans CloudWatch Logs ; ils n'ajoutent pas API Gateway à la carte des traces X-Ray."
references:
  - title: Trace user requests to REST APIs using X-Ray in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-xray.html
