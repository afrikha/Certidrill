id: dvac03-4c-sns-filter-body
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany publishes order events to an Amazon SNS topic. Each message body is a JSON object such as `{"orderId": "o-1001", "region": "EU", "total": 42.5}`. The publisher does not set message attributes and cannot be changed. An Amazon SQS queue for the European fulfillment service is subscribed to the topic, and the service discards the 80 % of messages whose region is not `EU`. The company wants the queue to receive only the European orders.

    Which solution will meet these requirements?
  fr: |
    AnyCompany publie des événements de commande dans une rubrique Amazon SNS. Chaque corps de message est un objet JSON tel que `{"orderId": "o-1001", "region": "EU", "total": 42.5}`. L'éditeur ne définit pas d'attributs de message et ne peut pas être modifié. Une file d'attente Amazon SQS du service de traitement des commandes européen est abonnée à la rubrique, et le service rejette les 80 % de messages dont la région n'est pas `EU`. L'entreprise veut que la file d'attente reçoive uniquement les commandes européennes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a filter policy on region to the subscription, and keep the default filter policy scope.", fr: "Ajouter une politique de filtre sur region à l'abonnement et conserver l'étendue de politique de filtre par défaut." }
    - id: b
      text: { en: "Keep the subscription unchanged, and filter on region in the consumer code after it reads each message.", fr: "Conserver l'abonnement tel quel et filtrer sur region dans le code du consommateur après la lecture de chaque message." }
    - id: c
      text: { en: "Create a separate SNS topic for each region, and subscribe the queue to the EU topic only.", fr: "Créer une rubrique SNS distincte par région et abonner la file d'attente à la seule rubrique EU." }
    - id: d
      text: { en: "Add a filter policy on region to the subscription, and set the filter policy scope to MessageBody.", fr: "Ajouter une politique de filtre sur region à l'abonnement et définir l'étendue de la politique de filtre sur MessageBody." }
answer: { optionId: d }
explanation:
  correct:
    en: "A subscription filter policy makes SNS deliver only the messages that match it. Because the region is in the JSON body and not in message attributes, the subscription's FilterPolicyScope must be set to MessageBody so that the policy is evaluated against the payload."
    fr: "Une politique de filtre d'abonnement fait livrer par SNS uniquement les messages qui y correspondent. Comme la région se trouve dans le corps JSON et non dans les attributs de message, le paramètre FilterPolicyScope de l'abonnement doit valoir MessageBody pour que la politique soit évaluée sur la charge utile."
  options:
    a:
      en: "The default scope, MessageAttributes, evaluates message attributes; these messages have none, so no message would match and the queue would receive nothing."
      fr: "L'étendue par défaut, MessageAttributes, évalue les attributs de message ; ces messages n'en ont pas, donc aucun message ne correspondrait et la file d'attente ne recevrait rien."
    b:
      en: "This is the current behavior: the queue still receives every message and the service keeps spending resources on messages it discards."
      fr: "C'est le comportement actuel : la file d'attente reçoit toujours chaque message et le service continue de consommer des ressources pour des messages qu'il rejette."
    c:
      en: "Separate topics per region require the publisher to publish to different topics, but the publisher cannot be changed."
      fr: "Des rubriques distinctes par région exigent que l'éditeur publie dans des rubriques différentes, or l'éditeur ne peut pas être modifié."
references:
  - title: Amazon SNS message filtering
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-message-filtering.html
