id: dvac03-4b-lambda-log-level-filter
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has a Node.js 22 AWS Lambda function that uses `console.debug()` and `console.info()` heavily. The function uses the default plain text log format. In production, the log ingestion cost is too high. Only WARN, ERROR and FATAL entries must be sent to Amazon CloudWatch Logs in production, and developers must be able to receive DEBUG entries again in the test environment by changing configuration only. The application code must not change.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'une fonction AWS Lambda Node.js 22 qui utilise beaucoup `console.debug()` et `console.info()`. La fonction utilise le format de journal texte brut par défaut. En production, le coût d'ingestion des journaux est trop élevé. Seules les entrées WARN, ERROR et FATAL doivent être envoyées à Amazon CloudWatch Logs en production, et les développeurs doivent pouvoir recevoir de nouveau les entrées DEBUG dans l'environnement de test en modifiant uniquement la configuration. Le code de l'application ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the plain text format and set the application log level of the function to WARN.", fr: "Conserver le format texte brut et définir le niveau de journal d'application de la fonction sur WARN." } }
    - { id: b, text: { en: "Set the log format to JSON and set the application log level of the function to WARN.", fr: "Définir le format de journal sur JSON et le niveau de journal d'application de la fonction sur WARN." } }
    - { id: c, text: { en: "Set the log format to JSON and set the system log level of the function to WARN.", fr: "Définir le format de journal sur JSON et le niveau de journal système de la fonction sur WARN." } }
    - { id: d, text: { en: "Set the retention of the function's log group to 1 day in production.", fr: "Définir la conservation du groupe de journaux de la fonction sur 1 jour en production." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Lambda log-level filtering requires the JSON log format. With the application log level set to WARN, Lambda does not send INFO and DEBUG output to CloudWatch Logs, which removes their ingestion cost. The level is a function setting, so the test environment can use DEBUG without a code change."
    fr: "Le filtrage par niveau de journal de Lambda exige le format de journal JSON. Avec le niveau de journal d'application défini sur WARN, Lambda n'envoie pas la sortie INFO et DEBUG à CloudWatch Logs, ce qui supprime son coût d'ingestion. Le niveau est un paramètre de la fonction : l'environnement de test peut utiliser DEBUG sans modifier le code."
  options:
    a:
      en: "Log-level filtering works only when the function uses the JSON log format; with plain text, all application output is still sent."
      fr: "Le filtrage par niveau de journal ne fonctionne que si la fonction utilise le format de journal JSON ; en texte brut, toute la sortie de l'application est toujours envoyée."
    c:
      en: "The system log level filters the logs that Lambda itself generates (platform events), not the application's `console` output."
      fr: "Le niveau de journal système filtre les journaux générés par Lambda lui-même (événements de la plateforme), pas la sortie `console` de l'application."
    d:
      en: "Retention deletes stored events later; every entry is still ingested and billed, so the ingestion cost does not drop."
      fr: "La conservation supprime les événements stockés plus tard ; chaque entrée est toujours ingérée et facturée, donc le coût d'ingestion ne baisse pas."
references:
  - title: Log-level filtering
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-log-level.html
