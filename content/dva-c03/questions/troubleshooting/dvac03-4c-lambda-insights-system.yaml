id: dvac03-4c-lambda-insights-system
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer needs system-level metrics for several AWS Lambda functions, including CPU time, memory, disk, and network usage, together with diagnostic information about cold starts. The developer must not change the function code.

    Which solution will meet these requirements?
  fr: |
    Un développeur a besoin de métriques système pour plusieurs fonctions AWS Lambda, notamment le temps processeur, la mémoire, le disque et l'utilisation du réseau, ainsi que d'informations de diagnostic sur les démarrages à froid. Le développeur ne doit pas modifier le code des fonctions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on AWS X-Ray active tracing for the functions.", fr: "Activer le suivi actif AWS X-Ray pour les fonctions." }
    - id: b
      text: { en: "Create CloudWatch Logs metric filters on the REPORT lines of the functions.", fr: "Créer des filtres de métriques CloudWatch Logs sur les lignes REPORT des fonctions." }
    - id: c
      text: { en: "Turn on CloudWatch Lambda Insights by adding its extension layer to the functions.", fr: "Activer CloudWatch Lambda Insights en ajoutant sa couche d'extension aux fonctions." }
    - id: d
      text: { en: "Turn on AWS CloudTrail data events for the functions.", fr: "Activer les événements de données AWS CloudTrail pour les fonctions." }
answer: { optionId: c }
explanation:
  correct:
    en: "Lambda Insights collects system-level metrics such as CPU time, memory, disk and network usage, and diagnostic information such as cold starts and worker shutdowns. It is delivered as a CloudWatch Lambda extension in a layer, so it requires no change to the function code."
    fr: "Lambda Insights collecte des métriques système telles que le temps processeur, la mémoire, le disque et l'utilisation du réseau, ainsi que des informations de diagnostic comme les démarrages à froid et les arrêts de processus de travail (worker). Il est fourni sous forme d'extension Lambda CloudWatch dans une couche : aucune modification du code des fonctions n'est nécessaire."
  options:
    a:
      en: "Active tracing records the timing of requests through the function and its calls; it does not report CPU, disk or network usage."
      fr: "Le suivi actif enregistre la chronologie des requêtes dans la fonction et ses appels ; il ne rapporte pas l'utilisation du processeur, du disque ou du réseau."
    b:
      en: "REPORT lines contain duration and memory values, but no CPU time, disk or network data."
      fr: "Les lignes REPORT contiennent des valeurs de durée et de mémoire, mais aucune donnée de temps processeur, de disque ou de réseau."
    d:
      en: "CloudTrail data events record API activity such as invocations; they provide no system-level performance metrics."
      fr: "Les événements de données CloudTrail enregistrent l'activité d'API, comme les invocations ; ils ne fournissent aucune métrique de performances système."
references:
  - title: Lambda Insights
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Lambda-Insights.html
