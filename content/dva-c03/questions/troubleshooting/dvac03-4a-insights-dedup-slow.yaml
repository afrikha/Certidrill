id: dvac03-4a-insights-dedup-slow
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer investigates slow invocations of an AWS Lambda function that is invoked by a client that retries requests. The developer needs a CloudWatch Logs Insights query that lists the 20 most recent invocations that lasted more than 1 second, with each request ID shown only once.

    Which query will meet this requirement?
  fr: |
    Un développeur analyse les appels lents d'une fonction AWS Lambda appelée par un client qui réessaie ses requêtes. Il a besoin d'une requête CloudWatch Logs Insights qui liste les 20 appels les plus récents ayant duré plus d'une seconde, chaque ID de requête n'apparaissant qu'une fois.

    Quelle requête répond à cette exigence ?
body:
  options:
    - { id: a, text: "`filter @type = \"REPORT\" and @duration > 1 | sort @timestamp desc | dedup @requestId | limit 20`" }
    - { id: b, text: "`filter @type = \"REPORT\" and @duration > 1000 | stats count(*) by @requestId | limit 20`" }
    - { id: c, text: "`filter @type = \"REPORT\" and @duration > 1000 | sort @timestamp desc | dedup @requestId | limit 20`" }
    - { id: d, text: "`filter @type = \"REPORT\" and @duration > 1000 | sort @timestamp desc | dedup @logStream | limit 20`" }
answer: { optionId: c }
explanation:
  correct:
    en: "The @duration field of REPORT lines is in milliseconds, so the filter uses 1000 for one second. The dedup command removes duplicate results that share the same @requestId, such as the ones caused by retries, and the sort and limit keep the 20 most recent invocations."
    fr: "Le champ @duration des lignes REPORT est exprimé en millisecondes : le filtre utilise donc 1000 pour une seconde. La commande dedup supprime les résultats en double qui partagent le même @requestId, comme ceux dus aux nouvelles tentatives, et le tri et limit conservent les 20 appels les plus récents."
  options:
    a:
      en: "@duration is in milliseconds, so a threshold of 1 selects almost every invocation."
      fr: "@duration est en millisecondes : un seuil de 1 sélectionne presque tous les appels."
    b:
      en: "stats returns a count per request ID instead of the invocations themselves, without ordering them by time."
      fr: "stats renvoie un comptage par ID de requête au lieu des appels eux-mêmes, sans les classer par date."
    d:
      en: "Deduplicating on @logStream keeps one invocation per execution environment, not one per request ID."
      fr: "Dédupliquer sur @logStream conserve un appel par environnement d'exécution, pas un par ID de requête."
references:
  - title: Sample queries
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-examples.html
