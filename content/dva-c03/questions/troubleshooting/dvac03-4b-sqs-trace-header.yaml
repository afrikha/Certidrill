id: dvac03-4b-sqs-trace-header
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AnyCompany producer application sends messages to an Amazon SQS standard queue. Its AWS SDK calls are instrumented, so each message carries the producer's trace header. A worker that runs on Amazon ECS polls the queue with `ReceiveMessage` and processes each message. In AWS X-Ray, the worker's processing appears as separate traces that are not linked to the producer's traces.

    Which solution will link the worker's processing to the producer's trace?
  fr: |
    Une application productrice d'AnyCompany envoie des messages vers une file d'attente Amazon SQS standard. Ses appels au SDK AWS sont instrumentés : chaque message transporte l'en-tête de trace du producteur. Un processus de travail qui s'exécute sur Amazon ECS interroge la file avec `ReceiveMessage` et traite chaque message. Dans AWS X-Ray, le traitement du processus apparaît sous forme de traces distinctes, non liées aux traces du producteur.

    Quelle solution lie le traitement du processus à la trace du producteur ?
body:
  options:
    - { id: a, text: { en: "Turn on active tracing in the settings of the SQS queue so that the queue appears between the two services.", fr: "Activer le traçage actif dans les paramètres de la file SQS pour que la file apparaisse entre les deux services." } }
    - { id: b, text: { en: "Increase the sampling reservoir of the worker's service so that every message that it processes is traced.", fr: "Augmenter le réservoir d'échantillonnage du service du processus pour que chaque message traité soit tracé." } }
    - { id: c, text: { en: "Replace the queue with a FIFO queue, and use the producer's trace ID as the message group ID of each message.", fr: "Remplacer la file par une file FIFO, et utiliser l'ID de trace du producteur comme ID de groupe de chaque message." } }
    - { id: d, text: { en: "Request the `AWSTraceHeader` system attribute in `ReceiveMessage`, and use it as the parent context of the processing.", fr: "Demander l'attribut système `AWSTraceHeader` dans `ReceiveMessage`, et l'utiliser comme contexte parent du traitement." } }
answer: { optionId: d }
explanation:
  correct:
    en: "SQS carries the trace header of the sender in the `AWSTraceHeader` message system attribute. Lambda consumers recover it automatically, but other consumers must request the attribute, read the header and restore the trace ID and parent ID so that their work joins the producer's trace."
    fr: "SQS transporte l'en-tête de trace de l'expéditeur dans l'attribut système de message `AWSTraceHeader`. Les consommateurs Lambda le récupèrent automatiquement, mais les autres consommateurs doivent demander l'attribut, lire l'en-tête et restaurer l'ID de trace et l'ID parent pour que leur traitement rejoigne la trace du producteur."
  options:
    a:
      en: "SQS queues have no tracing setting; the trace header travels with the message whatever the queue configuration."
      fr: "Les files SQS n'ont pas de paramètre de traçage ; l'en-tête de trace voyage avec le message quelle que soit la configuration de la file."
    b:
      en: "Tracing more messages creates more unlinked traces; the worker still does not know the producer's trace context."
      fr: "Tracer plus de messages crée davantage de traces non liées ; le processus ne connaît toujours pas le contexte de trace du producteur."
    c:
      en: "Message group IDs control ordering in FIFO queues; they do not propagate trace context."
      fr: "Les ID de groupe de messages contrôlent l'ordre dans les files FIFO ; ils ne propagent pas le contexte de trace."
references:
  - title: Amazon SQS and AWS X-Ray
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-services-sqs.html
