id: dvac03-4b-ecs-otel-collector-sidecar
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany builds a new containerized service that runs on Amazon ECS with AWS Fargate. The service is instrumented with an OpenTelemetry SDK that exports traces over OTLP. The traces must appear in AWS X-Ray, and the team must not adopt tracing components that are in maintenance mode.

    Which solution will meet these requirements?
  fr: |
    AnyCompany crée un nouveau service conteneurisé qui s'exécute sur Amazon ECS avec AWS Fargate. Le service est instrumenté avec un SDK OpenTelemetry qui exporte les traces via OTLP. Les traces doivent apparaître dans AWS X-Ray, et l'équipe ne doit pas adopter de composants de traçage en mode maintenance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run the CloudWatch agent as a sidecar container that receives OTLP traces, point the OTLP endpoint of the application to it, and allow `xray:PutTraceSegments` in the task execution role.", fr: "Exécuter l'agent CloudWatch comme conteneur sidecar qui reçoit les traces OTLP, faire pointer le point de terminaison OTLP de l'application vers lui et autoriser `xray:PutTraceSegments` dans le rôle d'exécution de tâche." } }
    - { id: b, text: { en: "Run the CloudWatch agent as a sidecar container that receives OTLP traces, point the OTLP endpoint of the application to it, and allow `xray:PutTraceSegments` in the task role.", fr: "Exécuter l'agent CloudWatch comme conteneur sidecar qui reçoit les traces OTLP, faire pointer le point de terminaison OTLP de l'application vers lui et autoriser `xray:PutTraceSegments` dans le rôle de tâche." } }
    - { id: c, text: { en: "Run the X-Ray daemon as a sidecar container and replace the OpenTelemetry SDK with the X-Ray SDK.", fr: "Exécuter le démon X-Ray comme conteneur sidecar et remplacer le SDK OpenTelemetry par le SDK X-Ray." } }
    - { id: d, text: { en: "Turn on Container Insights with enhanced observability for the cluster.", fr: "Activer Container Insights avec l'observabilité améliorée pour le cluster." } }
answer: { optionId: b }
explanation:
  correct:
    en: "For Amazon ECS, AWS recommends running the CloudWatch agent or an OpenTelemetry Collector as a sidecar that receives OTLP traces and exports them to X-Ray. The application sends traces to the sidecar endpoint, and the task role, which the containers use, needs `xray:PutTraceSegments`."
    fr: "Pour Amazon ECS, AWS recommande d'exécuter l'agent CloudWatch ou un OpenTelemetry Collector comme sidecar qui reçoit les traces OTLP et les exporte vers X-Ray. L'application envoie les traces au point de terminaison du sidecar, et le rôle de tâche, utilisé par les conteneurs, a besoin de `xray:PutTraceSegments`."
  options:
    a:
      en: "The task execution role is used by Amazon ECS to pull images and send container logs; the sidecar calls X-Ray with the task role credentials."
      fr: "Le rôle d'exécution de tâche sert à Amazon ECS pour extraire les images et envoyer les journaux des conteneurs ; le sidecar appelle X-Ray avec les informations d'identification du rôle de tâche."
    c:
      en: "The X-Ray SDKs and daemon entered maintenance mode in February 2026, so the team must not adopt them."
      fr: "Les SDK et le démon X-Ray sont passés en mode maintenance en février 2026 : l'équipe ne doit pas les adopter."
    d:
      en: "Container Insights collects container metrics and performance data; it does not receive the application's OTLP traces."
      fr: "Container Insights collecte des métriques et des données de performances des conteneurs ; il ne reçoit pas les traces OTLP de l'application."
references:
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
