id: dvac03-4a-python-log-level
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python AWS Lambda function uses the plain text log format and the standard logging module. While debugging, a developer adds `logger.info()` calls to trace the values of a request. The CloudWatch log group of the function shows the START, END and REPORT lines and the messages written with `logger.warning()`, but none of the INFO messages.

    What should the developer do to see the INFO messages?
  fr: |
    Une fonction AWS Lambda Python utilise le format de journal texte brut et le module standard logging. Pour déboguer, un développeur ajoute des appels `logger.info()` afin de suivre les valeurs d'une requête. Le groupe de journaux CloudWatch de la fonction affiche les lignes START, END et REPORT ainsi que les messages écrits avec `logger.warning()`, mais aucun message INFO.

    Que doit faire le développeur pour voir les messages INFO ?
body:
  options:
    - { id: a, text: { en: "Call `logger.setLevel(\"INFO\")` on the logger in the function code.", fr: "Appeler `logger.setLevel(\"INFO\")` sur le journaliseur dans le code de la fonction." } }
    - { id: b, text: { en: "Add the logs:PutLogEvents permission to the execution role of the function.", fr: "Ajouter l'autorisation logs:PutLogEvents au rôle d'exécution de la fonction." } }
    - { id: c, text: { en: "Increase the retention period of the log group of the function.", fr: "Augmenter la période de conservation du groupe de journaux de la fonction." } }
    - { id: d, text: { en: "Enable active tracing on the function so that the messages are recorded in the trace.", fr: "Activer le traçage actif sur la fonction pour que les messages soient enregistrés dans la trace." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With the plain text log format, the default log level for Python runtimes is WARN, so Lambda sends only WARN and more severe messages to CloudWatch Logs. Setting the logger level to INFO in code makes the INFO messages appear."
    fr: "Avec le format de journal texte brut, le niveau de journalisation par défaut des environnements d'exécution Python est WARN : Lambda n'envoie à CloudWatch Logs que les messages WARN et plus graves. Définir le niveau du journaliseur sur INFO dans le code fait apparaître les messages INFO."
  options:
    b:
      en: "WARN messages and the REPORT lines already reach the log group, so the role can write logs."
      fr: "Les messages WARN et les lignes REPORT parviennent déjà au groupe de journaux : le rôle peut donc écrire des journaux."
    c:
      en: "Retention controls how long stored events are kept; the INFO messages were never sent."
      fr: "La conservation détermine la durée de stockage des événements ; les messages INFO n'ont jamais été envoyés."
    d:
      en: "Tracing records segments and timing data; it does not change which log messages the logging module emits."
      fr: "Le traçage enregistre des segments et des durées ; il ne change pas les messages émis par le module logging."
references:
  - title: Log and monitor Python Lambda functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/python-logging.html
