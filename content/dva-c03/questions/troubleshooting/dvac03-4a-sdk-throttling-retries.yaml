id: dvac03-4a-sdk-throttling-retries
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A nightly batch job written in Python uses boto3 with its default retry configuration to write items to an Amazon DynamoDB table in provisioned capacity mode. During short traffic peaks, a few writes fail with ProvisionedThroughputExceededException after the SDK has stopped retrying. The company does not want to change the table capacity, and the job has plenty of time to finish.

    Which solution will reduce these failures with the LEAST development effort?
  fr: |
    Une tâche de traitement par lots nocturne écrite en Python utilise boto3 avec sa configuration de nouvelle tentative par défaut pour écrire des éléments dans une table Amazon DynamoDB en mode de capacité provisionnée. Lors de courts pics de trafic, quelques écritures échouent avec ProvisionedThroughputExceededException une fois que le SDK a cessé ses nouvelles tentatives. L'entreprise ne veut pas modifier la capacité de la table, et la tâche dispose de beaucoup de temps pour se terminer.

    Quelle solution réduit ces échecs avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: { en: "Wrap each write in a loop that retries immediately until the call succeeds.", fr: "Placer chaque écriture dans une boucle qui réessaie immédiatement jusqu'à ce que l'appel réussisse." } }
    - { id: b, text: { en: "Use strongly consistent reads before each write so that the write capacity is not exceeded.", fr: "Utiliser des lectures fortement cohérentes avant chaque écriture pour ne pas dépasser la capacité d'écriture." } }
    - { id: c, text: { en: "Create the client with `Config(retries={'mode': 'standard', 'total_max_attempts': 10})`.", fr: "Créer le client avec `Config(retries={'mode': 'standard', 'total_max_attempts': 10})`." } }
    - { id: d, text: { en: "Create the client with `Config(connect_timeout=30, read_timeout=60)`.", fr: "Créer le client avec `Config(connect_timeout=30, read_timeout=60)`." } }
answer: { optionId: c }
explanation:
  correct:
    en: "ProvisionedThroughputExceededException is a throttling error that the boto3 standard retry mode retries with exponential backoff. Raising total_max_attempts in a Config object gives the SDK more backed-off attempts to absorb short peaks, with a one-line change and no new retry code."
    fr: "ProvisionedThroughputExceededException est une erreur de limitation que le mode de nouvelle tentative standard de boto3 réessaie avec un backoff exponentiel. Augmenter total_max_attempts dans un objet Config donne au SDK davantage de tentatives espacées pour absorber les pics courts, avec une modification d'une ligne et sans nouveau code de nouvelle tentative."
  options:
    a:
      en: "Immediate retries without backoff add load during the peak and can make the throttling worse; they also require custom code."
      fr: "Des nouvelles tentatives immédiates sans backoff ajoutent de la charge pendant le pic et peuvent aggraver la limitation ; elles exigent aussi du code personnalisé."
    b:
      en: "Reads consume read capacity and do nothing to reduce write throttling; strongly consistent reads even consume more read capacity."
      fr: "Les lectures consomment de la capacité de lecture et ne réduisent pas la limitation des écritures ; les lectures fortement cohérentes en consomment même davantage."
    d:
      en: "The requests are rejected by DynamoDB, not timing out, so longer connection and read timeouts do not change the result."
      fr: "Les requêtes sont rejetées par DynamoDB, elles n'expirent pas : des délais de connexion et de lecture plus longs ne changent pas le résultat."
references:
  - title: Retries
    url: https://docs.aws.amazon.com/boto3/latest/guide/retries.html
