id: dvac03-4c-cloudfront-cache-key
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany serves product pages such as `/product?id=123` through an Amazon CloudFront distribution with an Application Load Balancer origin. Marketing links add `utm_source` and `utm_campaign` query strings with many different values. The origin must receive these values to log them for analytics, but the page content depends only on `id`. The cache policy currently includes all query strings in the cache key, and the cache hit ratio is low.

    Which solution will increase the cache hit ratio and meet these requirements?
  fr: |
    AnyCompany sert des pages de produits telles que `/product?id=123` via une distribution Amazon CloudFront dont l'origine est un Application Load Balancer. Les liens marketing ajoutent les chaînes de requête `utm_source` et `utm_campaign` avec de nombreuses valeurs différentes. L'origine doit recevoir ces valeurs pour les journaliser à des fins d'analyse, mais le contenu de la page ne dépend que de `id`. La politique de cache inclut actuellement toutes les chaînes de requête dans la clé de cache, et le taux d'accès au cache (cache hit ratio) est faible.

    Quelle solution augmente le taux d'accès au cache et répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep all query strings in the cache key, and increase the default TTL of the cache policy.", fr: "Conserver toutes les chaînes de requête dans la clé de cache et augmenter la TTL par défaut de la politique de cache." }
    - id: b
      text: { en: "Use a cache policy that includes only the id query string, and an origin request policy that forwards all query strings.", fr: "Utiliser une politique de cache qui inclut uniquement la chaîne de requête id, et une politique de requête d'origine qui transmet toutes les chaînes de requête." }
    - id: c
      text: { en: "Use a cache policy that includes only the id query string, and remove the origin request policy.", fr: "Utiliser une politique de cache qui inclut uniquement la chaîne de requête id, et supprimer la politique de requête d'origine." }
    - id: d
      text: { en: "Use a cache policy that includes no query strings, and an origin request policy that forwards all query strings.", fr: "Utiliser une politique de cache qui n'inclut aucune chaîne de requête, et une politique de requête d'origine qui transmet toutes les chaînes de requête." }
answer: { optionId: b }
explanation:
  correct:
    en: "Values in the cache key are automatically sent to the origin, and an origin request policy sends additional values to the origin without adding them to the cache key. Keeping only id in the cache key stops CloudFront from caching a separate copy for each campaign value, while the origin request policy still delivers the utm values to the origin for logging."
    fr: "Les valeurs de la clé de cache sont automatiquement envoyées à l'origine, et une politique de requête d'origine envoie des valeurs supplémentaires à l'origine sans les ajouter à la clé de cache. Ne garder que id dans la clé de cache empêche CloudFront de mettre en cache une copie distincte par valeur de campagne, tandis que la politique de requête d'origine transmet toujours les valeurs utm à l'origine pour la journalisation."
  options:
    a:
      en: "A longer TTL does not help when every combination of utm values creates a different cache key; most requests would still be cache misses."
      fr: "Une TTL plus longue n'aide pas quand chaque combinaison de valeurs utm crée une clé de cache différente ; la plupart des requêtes resteraient des échecs d'accès au cache."
    c:
      en: "Without an origin request policy, only the cache key values reach the origin, so the origin would no longer receive the utm values it must log."
      fr: "Sans politique de requête d'origine, seules les valeurs de la clé de cache atteignent l'origine : l'origine ne recevrait plus les valeurs utm qu'elle doit journaliser."
    d:
      en: "Without id in the cache key, CloudFront would return the page of the first cached product for every id."
      fr: "Sans id dans la clé de cache, CloudFront renverrait la page du premier produit mis en cache pour chaque id."
references:
  - title: Control origin requests with a policy
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-origin-requests.html
