id: dvac03-4b-shared-custom-log-group
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's order application is made of 12 AWS Lambda functions. Each function writes to its default log group. The developers want all the logs of the application in a single log group named `/anycompany/orders` so that they can search one log group and set its retention once. Each entry must still show which function wrote it. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    L'application de commandes d'AnyCompany se compose de 12 fonctions AWS Lambda. Chaque fonction écrit dans son groupe de journaux par défaut. Les développeurs veulent tous les journaux de l'application dans un seul groupe de journaux nommé `/anycompany/orders` afin de rechercher dans un seul groupe et d'en définir la conservation une seule fois. Chaque entrée doit toujours indiquer la fonction qui l'a écrite. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the CloudWatch log group of each function's logging configuration to `/anycompany/orders`.", fr: "Définir le groupe de journaux CloudWatch de la configuration de journalisation de chaque fonction sur `/anycompany/orders`." } }
    - { id: b, text: { en: "Add a subscription filter to each default log group that streams events to a Lambda function writing to `/anycompany/orders`.", fr: "Ajouter à chaque groupe de journaux par défaut un filtre d'abonnement qui diffuse les événements vers une fonction Lambda écrivant dans `/anycompany/orders`." } }
    - { id: c, text: { en: "Save a CloudWatch Logs Insights query that selects the 12 default log groups and share it with the developers.", fr: "Enregistrer une requête CloudWatch Logs Insights qui sélectionne les 12 groupes de journaux par défaut et la partager avec les développeurs." } }
    - { id: d, text: { en: "Change the code of each function to call `PutLogEvents` on `/anycompany/orders` with the function name in each event.", fr: "Modifier le code de chaque fonction pour appeler `PutLogEvents` sur `/anycompany/orders` avec le nom de la fonction dans chaque événement." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A Lambda function can send its logs to a custom log group instead of `/aws/lambda/<function name>`, and several functions can share the same log group. Lambda keeps the entries attributable because each log stream name contains the function name and version."
    fr: "Une fonction Lambda peut envoyer ses journaux vers un groupe de journaux personnalisé au lieu de `/aws/lambda/<function name>`, et plusieurs fonctions peuvent partager le même groupe. Lambda conserve l'attribution des entrées car chaque nom de flux de journaux contient le nom et la version de la fonction."
  options:
    b:
      en: "Twelve subscription filters plus a forwarding function work, but they add components to run and pay for, and the default log groups still keep their copies."
      fr: "Douze filtres d'abonnement et une fonction de transfert fonctionnent, mais ajoutent des composants à exploiter et à payer, et les groupes par défaut conservent leurs copies."
    c:
      en: "A query can read several log groups, but the logs stay in 12 log groups whose retention must still be set one by one."
      fr: "Une requête peut lire plusieurs groupes de journaux, mais les journaux restent dans 12 groupes dont la conservation doit toujours être définie un par un."
    d:
      en: "Calling the CloudWatch Logs API from every function means code changes in 12 functions, extra latency and extra permissions."
      fr: "Appeler l'API CloudWatch Logs depuis chaque fonction impose des modifications de code dans 12 fonctions, une latence et des autorisations supplémentaires."
references:
  - title: Configuring CloudWatch log groups
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-loggroups.html
