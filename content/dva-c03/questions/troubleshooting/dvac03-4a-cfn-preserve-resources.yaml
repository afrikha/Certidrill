id: dvac03-4a-cfn-preserve-resources
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CloudFormation template launches an Amazon EC2 instance that runs cfn-init and then cfn-signal. Stack creation keeps failing when the CreationPolicy times out, and the rollback terminates the instance before the developer can read /var/log/cfn-init.log. The developer needs to inspect the instance after the next failed attempt.

    Which solution will meet this requirement?
  fr: |
    Un modèle AWS CloudFormation lance une instance Amazon EC2 qui exécute cfn-init puis cfn-signal. La création de la pile échoue à chaque fois à l'expiration de la politique de création (CreationPolicy), et la restauration résilie l'instance avant que le développeur puisse lire /var/log/cfn-init.log. Le développeur doit pouvoir inspecter l'instance après la prochaine tentative en échec.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Create the stack with `--disable-rollback`, which is the Preserve successfully provisioned resources option.", fr: "Créer la pile avec `--disable-rollback`, qui correspond à l'option Preserve successfully provisioned resources." } }
    - { id: b, text: { en: "Add a DeletionPolicy of Retain to the instance and create the stack with the default failure options.", fr: "Ajouter une DeletionPolicy Retain à l'instance et créer la pile avec les options d'échec par défaut." } }
    - { id: c, text: { en: "Enable termination protection on the stack before creating it again.", fr: "Activer la protection contre la résiliation sur la pile avant de la recréer." } }
    - { id: d, text: { en: "Create the stack with `--on-failure DELETE` so that the logs are kept in the stack events.", fr: "Créer la pile avec `--on-failure DELETE` pour que les journaux soient conservés dans les événements de la pile." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With rollback disabled, CloudFormation keeps the resources that were successfully created and leaves the stack in CREATE_FAILED, so the instance stays available for inspection of its cfn-init and cloud-init logs. The developer can then fix the template and update or roll back the stack."
    fr: "Avec la restauration désactivée, CloudFormation conserve les ressources créées avec succès et laisse la pile en CREATE_FAILED : l'instance reste disponible pour inspecter ses journaux cfn-init et cloud-init. Le développeur peut ensuite corriger le modèle et mettre à jour ou restaurer la pile."
  options:
    b:
      en: "Retain keeps the instance outside the stack after the rollback, but it leaves an orphaned resource to clean up and is not the failure option designed for troubleshooting."
      fr: "Retain conserve l'instance hors de la pile après la restauration, mais laisse une ressource orpheline à nettoyer et n'est pas l'option d'échec prévue pour le dépannage."
    c:
      en: "Termination protection prevents the stack from being deleted by a user; it does not stop the rollback of a failed creation."
      fr: "La protection contre la résiliation empêche un utilisateur de supprimer la pile ; elle n'empêche pas la restauration d'une création en échec."
    d:
      en: "DELETE removes the whole stack after a failure, and stack events never contain instance log files."
      fr: "DELETE supprime toute la pile après un échec, et les événements de pile ne contiennent jamais les fichiers journaux de l'instance."
references:
  - title: Choose how to handle failures when provisioning resources
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stack-failure-options.html
  - title: Troubleshooting CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/troubleshooting.html
