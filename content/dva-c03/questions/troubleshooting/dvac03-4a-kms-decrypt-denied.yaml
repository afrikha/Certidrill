id: dvac03-4a-kms-decrypt-denied
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function reads objects from an Amazon S3 bucket. The objects are encrypted with SSE-KMS by using a customer managed key in the same account, and the key policy allows IAM policies to grant access to the key. The execution role allows s3:GetObject on the bucket, but every GetObject call fails with an AccessDenied error.

    Which permission must be added to the execution role?
  fr: |
    Une fonction AWS Lambda lit des objets d'un compartiment Amazon S3. Les objets sont chiffrés avec SSE-KMS à l'aide d'une clé gérée par le client dans le même compte, et la politique de clé autorise les politiques IAM à accorder l'accès à la clé. Le rôle d'exécution autorise s3:GetObject sur le compartiment, mais chaque appel GetObject échoue avec une erreur AccessDenied.

    Quelle autorisation faut-il ajouter au rôle d'exécution ?
body:
  options:
    - { id: a, text: { en: "kms:GenerateDataKey on the key", fr: "kms:GenerateDataKey sur la clé" } }
    - { id: b, text: { en: "kms:Decrypt on the key", fr: "kms:Decrypt sur la clé" } }
    - { id: c, text: { en: "s3:GetObjectAcl on the objects of the bucket", fr: "s3:GetObjectAcl sur les objets du compartiment" } }
    - { id: d, text: { en: "kms:DescribeKey on the key", fr: "kms:DescribeKey sur la clé" } }
answer: { optionId: b }
explanation:
  correct:
    en: "To download an object encrypted with an AWS KMS key, the caller needs kms:Decrypt on that key in addition to s3:GetObject. Without it, S3 cannot decrypt the data key and the request is denied."
    fr: "Pour télécharger un objet chiffré avec une clé AWS KMS, l'appelant a besoin de kms:Decrypt sur cette clé en plus de s3:GetObject. Sans cette autorisation, S3 ne peut pas déchiffrer la clé de données et la requête est refusée."
  options:
    a:
      en: "kms:GenerateDataKey is required to upload (encrypt) objects with SSE-KMS, not to read them."
      fr: "kms:GenerateDataKey est nécessaire pour charger (chiffrer) des objets avec SSE-KMS, pas pour les lire."
    c:
      en: "s3:GetObjectAcl reads the object ACL; it is not needed to download the object and does not grant use of the key."
      fr: "s3:GetObjectAcl lit l'ACL de l'objet ; cette autorisation n'est pas nécessaire au téléchargement et ne permet pas d'utiliser la clé."
    d:
      en: "kms:DescribeKey returns key metadata only; it does not allow decryption."
      fr: "kms:DescribeKey ne renvoie que les métadonnées de la clé ; cette autorisation ne permet pas le déchiffrement."
references:
  - title: Using server-side encryption with AWS KMS keys (SSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html
