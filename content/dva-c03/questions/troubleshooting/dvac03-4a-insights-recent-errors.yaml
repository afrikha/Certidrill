id: dvac03-4a-insights-recent-errors
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer needs to list the 20 most recent log events that contain the word ERROR in the log group of an AWS Lambda function by using CloudWatch Logs Insights. The word can appear anywhere in the message.

    Which query will return these events?
  fr: |
    Un développeur doit lister, avec CloudWatch Logs Insights, les 20 événements de journal les plus récents qui contiennent le mot ERROR dans le groupe de journaux d'une fonction AWS Lambda. Le mot peut apparaître n'importe où dans le message.

    Quelle requête renvoie ces événements ?
body:
  options:
    - { id: a, text: "`fields @timestamp, @message | filter @message like /ERROR/ | sort @timestamp desc | limit 20`" }
    - { id: b, text: "`fields @timestamp, @message | filter @message = \"ERROR\" | sort @timestamp desc | limit 20`" }
    - { id: c, text: "`fields @timestamp, @message | filter @message like /ERROR/ | sort @timestamp asc | limit 20`" }
    - { id: d, text: "`filter @message like /ERROR/ | stats count(*) by @timestamp | limit 20`" }
answer: { optionId: a }
explanation:
  correct:
    en: "The like operator with a regular expression matches ERROR anywhere in @message. Sorting on @timestamp in descending order puts the newest events first, and limit 20 keeps only the 20 most recent ones."
    fr: "L'opérateur like avec une expression régulière trouve ERROR n'importe où dans @message. Le tri décroissant sur @timestamp place les événements les plus récents en premier, et limit 20 ne conserve que les 20 plus récents."
  options:
    b:
      en: "The equality operator matches only messages whose whole content is exactly ERROR."
      fr: "L'opérateur d'égalité ne trouve que les messages dont le contenu entier est exactement ERROR."
    c:
      en: "An ascending sort returns the 20 oldest matching events of the time range."
      fr: "Un tri croissant renvoie les 20 événements correspondants les plus anciens de la plage de temps."
    d:
      en: "The stats command returns aggregated counts instead of the log events themselves."
      fr: "La commande stats renvoie des comptages agrégés au lieu des événements de journal eux-mêmes."
references:
  - title: Sample queries
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-examples.html
