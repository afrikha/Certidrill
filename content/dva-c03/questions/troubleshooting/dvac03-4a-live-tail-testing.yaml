id: dvac03-4a-live-tail-testing
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During a test session, a developer sends requests to an application and wants to see, as they are ingested, only the new events that contain the term Exception in two CloudWatch Logs log groups of the Standard log class. The developer does not want to rerun a query after each request.

    Which solution will meet these requirements?
  fr: |
    Pendant une session de test, un développeur envoie des requêtes à une application et veut voir, au fur et à mesure de leur ingestion, uniquement les nouveaux événements qui contiennent le terme Exception dans deux groupes de journaux CloudWatch Logs de la classe Standard. Il ne veut pas relancer une requête après chaque envoi.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Export the two log groups to Amazon S3 and download the files after each request.", fr: "Exporter les deux groupes de journaux vers Amazon S3 et télécharger les fichiers après chaque requête." } }
    - { id: b, text: { en: "Create a metric filter on each log group and watch the metric graph in CloudWatch.", fr: "Créer un filtre de métrique sur chaque groupe de journaux et observer le graphique de la métrique dans CloudWatch." } }
    - { id: c, text: { en: "Create a subscription filter on each log group that sends the events to Amazon Data Firehose.", fr: "Créer un filtre d'abonnement sur chaque groupe de journaux qui envoie les événements vers Amazon Data Firehose." } }
    - { id: d, text: { en: "Start a CloudWatch Logs Live Tail session on both log groups with the filter pattern Exception.", fr: "Démarrer une session CloudWatch Logs Live Tail sur les deux groupes de journaux avec le modèle de filtre Exception." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Live Tail streams new log events as they are ingested, from the console or with aws logs start-live-tail, and applies a filter pattern to show only matching events. A session can include several log groups and needs no query to rerun."
    fr: "Live Tail diffuse les nouveaux événements de journal au fur et à mesure de leur ingestion, depuis la console ou avec aws logs start-live-tail, et applique un modèle de filtre pour n'afficher que les événements correspondants. Une session peut porter sur plusieurs groupes de journaux et ne demande aucune requête à relancer."
  options:
    a:
      en: "Exports are batch copies that take time to complete; they do not show events as they arrive."
      fr: "Les exportations sont des copies par lots qui prennent du temps ; elles n'affichent pas les événements à leur arrivée."
    b:
      en: "A metric filter only counts matching events; the graph does not show the log events themselves."
      fr: "Un filtre de métrique ne fait que compter les événements correspondants ; le graphique n'affiche pas les événements de journal eux-mêmes."
    c:
      en: "A subscription filter delivers events to another service for processing or storage; it adds a delivery pipeline instead of showing the events in real time."
      fr: "Un filtre d'abonnement livre les événements à un autre service pour traitement ou stockage ; il ajoute un pipeline de livraison au lieu d'afficher les événements en temps réel."
references:
  - title: Troubleshoot with CloudWatch Logs Live Tail
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_LiveTail.html
