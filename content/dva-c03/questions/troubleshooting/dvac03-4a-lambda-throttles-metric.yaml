id: dvac03-4a-lambda-throttles-metric
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function has a reserved concurrency of 100. During a sales event, its CloudWatch metrics show the following for the same period: Throttles rises sharply, Errors stays at 0, Invocations stays flat, and the Maximum statistic of ConcurrentExecutions stays at 100.

    Which conclusion is supported by these metrics?
  fr: |
    Une fonction AWS Lambda a une simultanéité réservée de 100. Pendant une opération commerciale, ses métriques CloudWatch montrent sur la même période : Throttles augmente fortement, Errors reste à 0, Invocations reste stable et la statistique Maximum de ConcurrentExecutions reste à 100.

    Quelle conclusion ces métriques permettent-elles de tirer ?
body:
  options:
    - { id: a, text: { en: "The function code throws exceptions that Lambda reports as throttles.", fr: "Le code de la fonction lève des exceptions que Lambda signale comme des limitations." } }
    - { id: b, text: { en: "The function reaches its reserved concurrency, and Lambda rejects the additional requests.", fr: "La fonction atteint sa simultanéité réservée, et Lambda rejette les requêtes supplémentaires." } }
    - { id: c, text: { en: "The invocations time out before they finish, and Lambda retries them.", fr: "Les appels expirent avant de se terminer, et Lambda les réessaie." } }
    - { id: d, text: { en: "Lambda fails to send failed events to the dead-letter queue of the function.", fr: "Lambda n'arrive pas à envoyer les événements en échec vers la file d'attente de lettres mortes de la fonction." } }
answer: { optionId: b }
explanation:
  correct:
    en: "When ConcurrentExecutions reaches the reserved concurrency of the function, Lambda throttles additional requests with TooManyRequestsException. Throttled requests are counted in Throttles but not in Invocations or Errors, which matches the flat Invocations and zero Errors."
    fr: "Lorsque ConcurrentExecutions atteint la simultanéité réservée de la fonction, Lambda limite les requêtes supplémentaires avec TooManyRequestsException. Les requêtes limitées sont comptées dans Throttles mais ni dans Invocations ni dans Errors, ce qui correspond à Invocations stable et à Errors nul."
  options:
    a:
      en: "Exceptions thrown by the code are function errors and would increase the Errors metric, which stays at 0."
      fr: "Les exceptions levées par le code sont des erreurs de fonction et feraient augmenter la métrique Errors, qui reste à 0."
    c:
      en: "Timeouts are function errors counted in Errors; they are not reported as throttles."
      fr: "Les expirations sont des erreurs de fonction comptées dans Errors ; elles ne sont pas signalées comme des limitations."
    d:
      en: "Failures to deliver to a dead-letter queue appear in the DeadLetterErrors metric, not in Throttles."
      fr: "Les échecs de livraison vers une file d'attente de lettres mortes apparaissent dans la métrique DeadLetterErrors, pas dans Throttles."
references:
  - title: Types of metrics for Lambda functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-types.html
