id: dvac03-4a-alb-502-keepalive
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A web application runs on Amazon EC2 instances behind an Application Load Balancer that uses the default idle timeout of 60 seconds. Clients receive intermittent HTTP 502 errors. CloudWatch shows that HTTPCode_ELB_5XX_Count rises while HTTPCode_Target_5XX_Count stays at 0, and the application logs contain no failed requests. The web server on the instances closes idle keep-alive connections after 5 seconds.

    Which change will resolve the errors?
  fr: |
    Une application web s'exécute sur des instances Amazon EC2 derrière un Application Load Balancer qui utilise le délai d'inactivité par défaut de 60 secondes. Les clients reçoivent des erreurs HTTP 502 intermittentes. CloudWatch montre que HTTPCode_ELB_5XX_Count augmente tandis que HTTPCode_Target_5XX_Count reste à 0, et les journaux de l'application ne contiennent aucune requête en échec. Le serveur web des instances ferme les connexions keep-alive inactives après 5 secondes.

    Quelle modification élimine ces erreurs ?
body:
  options:
    - { id: a, text: { en: "Increase the health check interval of the target group to 60 seconds.", fr: "Porter l'intervalle de vérification de l'état du groupe cible à 60 secondes." } }
    - { id: b, text: { en: "Increase the deregistration delay of the target group to 600 seconds.", fr: "Porter le délai d'annulation de l'enregistrement du groupe cible à 600 secondes." } }
    - { id: c, text: { en: "Configure the web server keep-alive timeout to be longer than the load balancer idle timeout.", fr: "Configurer le délai keep-alive du serveur web pour qu'il soit plus long que le délai d'inactivité de l'équilibreur de charge." } }
    - { id: d, text: { en: "Reduce the load balancer idle timeout to 1 second.", fr: "Réduire le délai d'inactivité de l'équilibreur de charge à 1 seconde." } }
answer: { optionId: c }
explanation:
  correct:
    en: "HTTPCode_ELB_5XX_Count counts errors generated by the load balancer itself, while target errors would appear in HTTPCode_Target_5XX_Count. A 502 is generated when the target closes the connection while the load balancer has an outstanding request, which happens when the target keep-alive duration is shorter than the idle timeout. A target keep-alive longer than the idle timeout lets the load balancer close idle connections first."
    fr: "HTTPCode_ELB_5XX_Count compte les erreurs générées par l'équilibreur de charge lui-même, alors que les erreurs des cibles apparaîtraient dans HTTPCode_Target_5XX_Count. Une erreur 502 est générée lorsque la cible ferme la connexion alors que l'équilibreur a une requête en cours, ce qui arrive quand la durée keep-alive de la cible est plus courte que le délai d'inactivité. Un keep-alive de la cible plus long que le délai d'inactivité permet à l'équilibreur de fermer le premier les connexions inactives."
  options:
    a:
      en: "Health check timing does not change how long connections stay open, and the targets are not failing their requests."
      fr: "La fréquence des vérifications de l'état ne change pas la durée d'ouverture des connexions, et les cibles ne font pas échouer leurs requêtes."
    b:
      en: "The deregistration delay applies to targets being removed from the group; no target is being deregistered here."
      fr: "Le délai d'annulation de l'enregistrement s'applique aux cibles retirées du groupe ; aucune cible n'est retirée ici."
    d:
      en: "A 1-second idle timeout closes connections during normal slow requests, which causes 504 errors instead of removing the mismatch safely."
      fr: "Un délai d'inactivité d'une seconde ferme des connexions pendant des requêtes lentes normales, ce qui provoque des erreurs 504 au lieu de corriger l'écart sans risque."
references:
  - title: Troubleshoot your Application Load Balancers
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-troubleshooting.html
