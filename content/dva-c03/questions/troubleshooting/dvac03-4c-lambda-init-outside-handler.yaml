id: dvac03-4c-lambda-init-outside-handler
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function contains the following code:

    ```python
    import boto3, json

    def handler(event, context):
        s3 = boto3.client("s3")
        obj = s3.get_object(Bucket="anycompany-config", Key="rules.json")
        rules = json.loads(obj["Body"].read())
        return evaluate(rules, event)
    ```

    Another team updates `rules.json` once a week without redeploying the function, and the function can use rules that are a few hours old. A developer needs to reduce the duration of the invocations with the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda contient le code suivant :

    ```python
    import boto3, json

    def handler(event, context):
        s3 = boto3.client("s3")
        obj = s3.get_object(Bucket="anycompany-config", Key="rules.json")
        rules = json.loads(obj["Body"].read())
        return evaluate(rules, event)
    ```

    Une autre équipe met à jour `rules.json` une fois par semaine sans redéployer la fonction, et la fonction peut utiliser des règles vieilles de quelques heures. Un développeur doit réduire la durée des invocations avec le MOINS d'effort de développement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the memory setting of the function so that the download runs faster.", fr: "Augmenter le paramètre de mémoire de la fonction afin que le téléchargement soit plus rapide." }
    - id: b
      text: { en: "Move the client creation and the rules download outside the handler so that they run once per execution environment.", fr: "Déplacer la création du client et le téléchargement des règles hors du gestionnaire afin qu'ils s'exécutent une fois par environnement d'exécution." }
    - id: c
      text: { en: "Configure provisioned concurrency so that execution environments are initialized before requests arrive.", fr: "Configurer la simultanéité provisionnée afin que les environnements d'exécution soient initialisés avant l'arrivée des requêtes." }
    - id: d
      text: { en: "Package rules.json in a Lambda layer and read it from the /opt directory in the handler.", fr: "Placer rules.json dans une couche Lambda et le lire depuis le répertoire /opt dans le gestionnaire." }
answer: { optionId: b }
explanation:
  correct:
    en: "Lambda reuses execution environments, and code outside the handler runs only when an environment is initialized. Creating the client and loading the rules at that point lets later invocations on the same environment skip the S3 download, which reduces their duration. The rules can be a few hours old, so caching them for the life of an environment is acceptable."
    fr: "Lambda réutilise les environnements d'exécution, et le code situé hors du gestionnaire ne s'exécute qu'à l'initialisation d'un environnement. Créer le client et charger les règles à ce moment permet aux invocations suivantes sur le même environnement d'éviter le téléchargement S3, ce qui réduit leur durée. Les règles peuvent dater de quelques heures, donc les mettre en cache pendant la vie d'un environnement est acceptable."
  options:
    a:
      en: "More memory adds CPU and network capacity, but every invocation would still create a client and download the file."
      fr: "Plus de mémoire ajoute de la capacité de processeur et de réseau, mais chaque invocation créerait toujours un client et téléchargerait le fichier."
    c:
      en: "Provisioned concurrency runs the initialization code in advance, but this code is inside the handler, so it still runs on every invocation."
      fr: "La simultanéité provisionnée exécute le code d'initialisation à l'avance, mais ce code se trouve dans le gestionnaire : il s'exécute donc toujours à chaque invocation."
    d:
      en: "A layer is part of the deployed function; each weekly change would require publishing a new layer version and updating the function, which the other team does not do."
      fr: "Une couche fait partie de la fonction déployée ; chaque modification hebdomadaire exigerait de publier une nouvelle version de couche et de mettre à jour la fonction, ce que l'autre équipe ne fait pas."
references:
  - title: Best practices for working with AWS Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/best-practices.html
