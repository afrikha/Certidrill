id: dvac03-4a-gsi-back-pressure
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application writes orders to an Amazon DynamoDB table in provisioned capacity mode. The table has a global secondary index (GSI) named StatusIndex with its own provisioned write capacity. During peaks, PutItem calls on the base table fail with ProvisionedThroughputExceededException, although the consumed write capacity of the table stays below 40 % of its provisioned write capacity. The exception reports the reason IndexWriteProvisionedThroughputExceeded and the ARN of StatusIndex.

    Which solution will resolve the throttling?
  fr: |
    Une application écrit des commandes dans une table Amazon DynamoDB en mode de capacité provisionnée. La table possède un index secondaire global (GSI) nommé StatusIndex avec sa propre capacité d'écriture provisionnée. Lors des pics, les appels PutItem sur la table de base échouent avec ProvisionedThroughputExceededException, alors que la capacité d'écriture consommée par la table reste inférieure à 40 % de sa capacité d'écriture provisionnée. L'exception indique la raison IndexWriteProvisionedThroughputExceeded et l'ARN de StatusIndex.

    Quelle solution élimine la limitation ?
body:
  options:
    - { id: a, text: { en: "Increase the provisioned write capacity of the base table.", fr: "Augmenter la capacité d'écriture provisionnée de la table de base." } }
    - { id: b, text: { en: "Increase the provisioned write capacity of StatusIndex.", fr: "Augmenter la capacité d'écriture provisionnée de StatusIndex." } }
    - { id: c, text: { en: "Put a DynamoDB Accelerator (DAX) cluster in front of the table.", fr: "Placer un cluster DynamoDB Accelerator (DAX) devant la table." } }
    - { id: d, text: { en: "Replace StatusIndex with a local secondary index on the same attribute.", fr: "Remplacer StatusIndex par un index secondaire local sur le même attribut." } }
answer: { optionId: b }
explanation:
  correct:
    en: "GSIs are updated asynchronously, and when a GSI lacks write capacity, DynamoDB throttles writes to the base table to keep the index consistent. This back pressure returns ProvisionedThroughputExceededException with the IndexWriteProvisionedThroughputExceeded reason and the ARN of the index, so the index needs more write capacity."
    fr: "Les GSI sont mis à jour de manière asynchrone, et lorsqu'un GSI manque de capacité d'écriture, DynamoDB limite les écritures sur la table de base pour garder l'index cohérent. Cette contre-pression renvoie ProvisionedThroughputExceededException avec la raison IndexWriteProvisionedThroughputExceeded et l'ARN de l'index : c'est l'index qui a besoin de plus de capacité d'écriture."
  options:
    a:
      en: "The base table already has unused write capacity; the limit that is reached is the write capacity of the index."
      fr: "La table de base dispose déjà de capacité d'écriture inutilisée ; la limite atteinte est la capacité d'écriture de l'index."
    c:
      en: "DAX is a read cache; writes still go to the table and still update the index."
      fr: "DAX est un cache de lecture ; les écritures sont toujours envoyées à la table et mettent toujours l'index à jour."
    d:
      en: "A local secondary index can only be created when the table is created and must share the partition key of the table, so it cannot simply replace a GSI on an existing table."
      fr: "Un index secondaire local ne peut être créé qu'à la création de la table et doit partager la clé de partition de la table : il ne peut pas simplement remplacer un GSI sur une table existante."
references:
  - title: Understanding Global Secondary Index (GSI) write throttling and back pressure in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/gsi-throttling.html
