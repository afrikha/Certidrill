id: dvac03-4a-beanstalk-ai-permissions
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer requests an AI-powered environment analysis for an AWS Elastic Beanstalk environment that runs on a supported Amazon Linux 2023 platform version. The account already uses Anthropic models in Amazon Bedrock, so the model use case form and the AWS Marketplace subscription are in place. The analysis fails with an AccessDeniedException. The IAM user of the developer has full Elastic Beanstalk permissions.

    Which change will allow the analysis to run?
  fr: |
    Un développeur demande une analyse d'environnement fondée sur l'IA pour un environnement AWS Elastic Beanstalk qui s'exécute sur une version de plateforme Amazon Linux 2023 prise en charge. Le compte utilise déjà des modèles Anthropic dans Amazon Bedrock : le formulaire de cas d'usage du modèle et l'abonnement AWS Marketplace sont en place. L'analyse échoue avec une AccessDeniedException. L'utilisateur IAM du développeur dispose de toutes les autorisations Elastic Beanstalk.

    Quelle modification permet à l'analyse de s'exécuter ?
body:
  options:
    - { id: a, text: { en: "Add bedrock:InvokeModel, bedrock:ListFoundationModels, elasticbeanstalk:DescribeEvents and elasticbeanstalk:DescribeEnvironmentHealth to the EC2 instance profile of the environment.", fr: "Ajouter bedrock:InvokeModel, bedrock:ListFoundationModels, elasticbeanstalk:DescribeEvents et elasticbeanstalk:DescribeEnvironmentHealth au profil d'instance EC2 de l'environnement." } }
    - { id: b, text: { en: "Add bedrock:InvokeModel, bedrock:ListFoundationModels, elasticbeanstalk:DescribeEvents and elasticbeanstalk:DescribeEnvironmentHealth to the IAM user of the developer.", fr: "Ajouter bedrock:InvokeModel, bedrock:ListFoundationModels, elasticbeanstalk:DescribeEvents et elasticbeanstalk:DescribeEnvironmentHealth à l'utilisateur IAM du développeur." } }
    - { id: c, text: { en: "Add bedrock:InvokeModel, bedrock:ListFoundationModels, elasticbeanstalk:DescribeEvents and elasticbeanstalk:DescribeEnvironmentHealth to a resource policy on the environment.", fr: "Ajouter bedrock:InvokeModel, bedrock:ListFoundationModels, elasticbeanstalk:DescribeEvents et elasticbeanstalk:DescribeEnvironmentHealth à une politique de ressource sur l'environnement." } }
    - { id: d, text: { en: "Create an interface VPC endpoint for Amazon Bedrock Runtime in the VPC of the environment.", fr: "Créer un point de terminaison de VPC d'interface pour Amazon Bedrock Runtime dans le VPC de l'environnement." } }
answer: { optionId: a }
explanation:
  correct:
    en: "In a standard Elastic Beanstalk environment, a script on an instance of the environment collects the events, health information and logs and sends them to Amazon Bedrock in the account. The calls therefore use the EC2 instance profile, which must allow bedrock:InvokeModel, bedrock:ListFoundationModels, elasticbeanstalk:DescribeEvents and elasticbeanstalk:DescribeEnvironmentHealth."
    fr: "Dans un environnement Elastic Beanstalk standard, un script exécuté sur une instance de l'environnement collecte les événements, les informations d'intégrité et les journaux, puis les envoie à Amazon Bedrock dans le compte. Les appels utilisent donc le profil d'instance EC2, qui doit autoriser bedrock:InvokeModel, bedrock:ListFoundationModels, elasticbeanstalk:DescribeEvents et elasticbeanstalk:DescribeEnvironmentHealth."
  options:
    b:
      en: "The analysis is run by an instance of the environment, not with the credentials of the developer who requests it."
      fr: "L'analyse est exécutée par une instance de l'environnement, pas avec les informations d'identification du développeur qui la demande."
    c:
      en: "Elastic Beanstalk environments do not support resource policies; permissions for the analysis come from the instance profile."
      fr: "Les environnements Elastic Beanstalk ne prennent pas en charge de politique de ressource ; les autorisations de l'analyse proviennent du profil d'instance."
    d:
      en: "A missing network path causes connection errors, not an AccessDeniedException returned by an authorization check."
      fr: "L'absence de chemin réseau provoque des erreurs de connexion, pas une AccessDeniedException renvoyée par un contrôle d'autorisation."
references:
  - title: AI-powered environment analysis
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/health-ai-analysis.html
