id: dvac03-4a-investigation-alarm-action
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a CloudWatch alarm on the error rate of its order API. When the alarm fires, the on-call developer spends a long time correlating metrics, logs, recent deployments and AWS CloudTrail change events before forming a hypothesis. The company wants an AI-generated analysis with root cause hypotheses to start automatically whenever the alarm enters the ALARM state, with the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'une alarme CloudWatch sur le taux d'erreur de son API de commandes. Lorsque l'alarme se déclenche, le développeur d'astreinte passe beaucoup de temps à corréler métriques, journaux, déploiements récents et événements de modification AWS CloudTrail avant de formuler une hypothèse. L'entreprise veut qu'une analyse générée par IA, avec des hypothèses de cause racine, démarre automatiquement chaque fois que l'alarme passe à l'état ALARM, avec le MOINS d'effort de développement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an alarm action that sends a notification to an Amazon SNS topic subscribed by the on-call developer.", fr: "Ajouter une action d'alarme qui envoie une notification à une rubrique Amazon SNS à laquelle le développeur d'astreinte est abonné." } }
    - { id: b, text: { en: "Create an Amazon EventBridge rule for the alarm state change that invokes a Lambda function, which gathers the telemetry and sends it to Amazon Bedrock.", fr: "Créer une règle Amazon EventBridge sur le changement d'état de l'alarme qui appelle une fonction Lambda chargée de collecter la télémétrie et de l'envoyer à Amazon Bedrock." } }
    - { id: c, text: { en: "Create a log anomaly detector on the log group of the API and add the anomalies to a dashboard.", fr: "Créer un détecteur d'anomalies de journaux sur le groupe de journaux de l'API et ajouter les anomalies à un tableau de bord." } }
    - { id: d, text: { en: "Set up a CloudWatch investigation group, and add an alarm action that starts a CloudWatch investigation.", fr: "Configurer un groupe d'investigation CloudWatch, et ajouter une action d'alarme qui démarre une investigation CloudWatch." } }
answer: { optionId: d }
explanation:
  correct:
    en: "CloudWatch investigations is a generative AI assistant that scans telemetry such as metrics, logs, deployment events and CloudTrail change events, and proposes root cause hypotheses. After the one-time investigation group setup, an alarm action can start an investigation automatically when the alarm enters the ALARM state, with no code to write."
    fr: "CloudWatch investigations est un assistant d'IA générative qui analyse la télémétrie, comme les métriques, les journaux, les événements de déploiement et les événements de modification CloudTrail, et propose des hypothèses de cause racine. Après la configuration unique du groupe d'investigation, une action d'alarme peut démarrer automatiquement une investigation lorsque l'alarme passe à l'état ALARM, sans code à écrire."
  options:
    a:
      en: "A notification only alerts the developer, who still has to correlate the data by hand; no analysis is produced."
      fr: "Une notification ne fait qu'alerter le développeur, qui doit toujours corréler les données à la main ; aucune analyse n'est produite."
    b:
      en: "This custom pipeline can work, but the code that collects and correlates telemetry must be written and maintained, which is far more effort."
      fr: "Ce pipeline personnalisé peut fonctionner, mais le code qui collecte et corrèle la télémétrie doit être écrit et maintenu, ce qui demande bien plus d'effort."
    c:
      en: "Anomaly detection flags unusual log patterns in one log group; it does not correlate deployments and change events or propose root causes when the alarm fires."
      fr: "La détection d'anomalies signale des modèles de journaux inhabituels dans un groupe de journaux ; elle ne corrèle pas les déploiements et les événements de modification et ne propose pas de causes racines au déclenchement de l'alarme."
references:
  - title: CloudWatch investigations
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Investigations.html
  - title: Methods to create an investigation
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/creation-methods.html
