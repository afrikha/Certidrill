id: dvac03-4a-import-module-error
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer deploys a Python AWS Lambda function by uploading a .zip file that contains only app.py. The code imports the third-party requests library. Every invocation fails with the following error in the CloudWatch logs.

    ```text
    Runtime.ImportModuleError: Unable to import module 'app': No module named 'requests'
    ```

    Which solution will fix the error?
  fr: |
    Un développeur déploie une fonction AWS Lambda Python en chargeant un fichier .zip qui contient uniquement app.py. Le code importe la bibliothèque tierce requests. Chaque appel échoue avec l'erreur suivante dans les journaux CloudWatch.

    ```text
    Runtime.ImportModuleError: Unable to import module 'app': No module named 'requests'
    ```

    Quelle solution corrige l'erreur ?
body:
  options:
    - { id: a, text: { en: "Increase the memory of the function so that the runtime can load the library.", fr: "Augmenter la mémoire de la fonction pour que l'environnement d'exécution puisse charger la bibliothèque." } }
    - { id: b, text: { en: "Change the handler setting from `app.handler` to `requests.handler`.", fr: "Modifier le paramètre du gestionnaire de `app.handler` en `requests.handler`." } }
    - { id: c, text: { en: "Set a PYTHONPATH environment variable that points to `/var/task/requests`.", fr: "Définir une variable d'environnement PYTHONPATH qui pointe vers `/var/task/requests`." } }
    - { id: d, text: { en: "Install requests with `pip install --target` and add it at the root of the .zip file, or provide it in a layer.", fr: "Installer requests avec `pip install --target` et l'ajouter à la racine du fichier .zip, ou le fournir dans une couche." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The deployment package contains no copy of requests, so the import fails before the handler runs. For a .zip deployment, the handler file and all dependencies must be at the root of the archive; a Lambda layer is the alternative way to provide them."
    fr: "Le package de déploiement ne contient aucune copie de requests : l'importation échoue avant l'exécution du gestionnaire. Pour un déploiement .zip, le fichier du gestionnaire et toutes les dépendances doivent se trouver à la racine de l'archive ; une couche Lambda est l'autre moyen de les fournir."
  options:
    a:
      en: "The module is missing from the package; memory has no effect on whether Python can find it."
      fr: "Le module est absent du package ; la mémoire n'a aucune influence sur la capacité de Python à le trouver."
    b:
      en: "The handler must point to the function in app.py; requests is a library, not the handler module."
      fr: "Le gestionnaire doit pointer vers la fonction de app.py ; requests est une bibliothèque, pas le module du gestionnaire."
    c:
      en: "Changing the search path does not help, because the library files were never deployed."
      fr: "Modifier le chemin de recherche n'aide pas, car les fichiers de la bibliothèque n'ont jamais été déployés."
references:
  - title: Working with .zip file archives for Python Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/python-package.html
