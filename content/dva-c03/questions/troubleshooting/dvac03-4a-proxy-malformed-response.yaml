id: dvac03-4a-proxy-malformed-response
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company exposes an AWS Lambda function through an Amazon API Gateway REST API that uses a Lambda proxy integration. The function runs without errors and its logs show the expected order data, but every client receives an HTTP 502 response. The handler ends with the following code.

    ```python
    def handler(event, context):
        order = create_order(event)
        return {"orderId": order.id, "status": "CREATED"}
    ```

    Which change will fix the issue?
  fr: |
    Une entreprise expose une fonction AWS Lambda via une API REST Amazon API Gateway qui utilise une intégration de proxy Lambda. La fonction s'exécute sans erreur et ses journaux montrent les données de commande attendues, mais chaque client reçoit une réponse HTTP 502. Le gestionnaire se termine par le code suivant.

    ```python
    def handler(event, context):
        order = create_order(event)
        return {"orderId": order.id, "status": "CREATED"}
    ```

    Quelle modification corrige le problème ?
body:
  options:
    - { id: a, text: { en: "Return `{\"statusCode\": 201, \"body\": json.dumps({\"orderId\": order.id, \"status\": \"CREATED\"})}`.", fr: "Renvoyer `{\"statusCode\": 201, \"body\": json.dumps({\"orderId\": order.id, \"status\": \"CREATED\"})}`." } }
    - { id: b, text: { en: "Return `json.dumps({\"orderId\": order.id, \"status\": \"CREATED\"})` so that the response is a JSON string.", fr: "Renvoyer `json.dumps({\"orderId\": order.id, \"status\": \"CREATED\"})` pour que la réponse soit une chaîne JSON." } }
    - { id: c, text: { en: "Add `\"isBase64Encoded\": False` to the dictionary that the handler returns.", fr: "Ajouter `\"isBase64Encoded\": False` au dictionnaire renvoyé par le gestionnaire." } }
    - { id: d, text: { en: "Add a 201 method response and an integration response mapping template to the API method.", fr: "Ajouter une réponse de méthode 201 et un modèle de mappage de réponse d'intégration à la méthode d'API." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With a Lambda proxy integration, API Gateway requires the function to return an object with a statusCode and, optionally, headers and a body that is a string. Any other output shape makes API Gateway return 502 Bad Gateway even though the function succeeded."
    fr: "Avec une intégration de proxy Lambda, API Gateway exige que la fonction renvoie un objet contenant statusCode et, en option, des en-têtes et un body de type chaîne. Toute autre forme de sortie fait renvoyer 502 Bad Gateway par API Gateway, même si la fonction a réussi."
  options:
    b:
      en: "A bare JSON string still lacks the statusCode field that the proxy integration requires, so the response stays malformed."
      fr: "Une simple chaîne JSON ne contient toujours pas le champ statusCode exigé par l'intégration de proxy : la réponse reste mal formée."
    c:
      en: "isBase64Encoded is optional; the output still has no statusCode and no string body."
      fr: "isBase64Encoded est facultatif ; la sortie n'a toujours ni statusCode ni body de type chaîne."
    d:
      en: "Integration responses and mapping templates are not used by a proxy integration; the function output itself must follow the proxy format."
      fr: "Les réponses d'intégration et les modèles de mappage ne sont pas utilisés par une intégration de proxy : c'est la sortie de la fonction qui doit respecter le format du proxy."
references:
  - title: Lambda proxy integrations in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-lambda-proxy-integrations.html
