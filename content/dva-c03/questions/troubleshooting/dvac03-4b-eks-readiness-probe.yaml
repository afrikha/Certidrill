id: dvac03-4b-eks-readiness-probe
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an API on Amazon EKS. Every hour, each pod refreshes an in-memory cache for about 20 seconds and cannot serve requests during that time. The pods have only a liveness probe on `/healthz`, which fails during the refresh, so the kubelet restarts the containers and the warm cache is lost. During a refresh, a pod must stop receiving traffic without being restarted.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une API sur Amazon EKS. Toutes les heures, chaque pod actualise un cache en mémoire pendant environ 20 secondes et ne peut pas traiter de requêtes pendant ce temps. Les pods n'ont qu'une sonde de vivacité (liveness) sur `/healthz`, qui échoue pendant l'actualisation : le kubelet redémarre les conteneurs et le cache chaud est perdu. Pendant une actualisation, un pod doit cesser de recevoir du trafic sans être redémarré.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a startup probe on `/healthz` with a high failure threshold so that the refresh does not trigger a restart.", fr: "Ajouter une sonde de démarrage (startup) sur `/healthz` avec un seuil d'échec élevé pour que l'actualisation ne déclenche pas de redémarrage." } }
    - { id: b, text: { en: "Add a PodDisruptionBudget with `minAvailable` set to 2 so that pods are not all disrupted at the same time.", fr: "Ajouter un PodDisruptionBudget avec `minAvailable` défini sur 2 pour que les pods ne soient pas tous interrompus en même temps." } }
    - { id: c, text: { en: "Increase the `initialDelaySeconds` of the liveness probe to 60 so that the probe waits longer before it checks the pod.", fr: "Augmenter le paramètre `initialDelaySeconds` de la sonde de vivacité à 60 pour que la sonde attende plus longtemps avant de vérifier le pod." } }
    - { id: d, text: { en: "Add a readiness probe that fails during the refresh, and limit the liveness probe to checking that the process responds.", fr: "Ajouter une sonde de disponibilité (readiness) qui échoue pendant l'actualisation, et limiter la sonde de vivacité à vérifier que le processus répond." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A failed readiness probe does not restart the pod; it removes the pod from the Service endpoints until the probe succeeds again. A liveness probe is meant to detect a stuck process and triggers a restart, so it must not fail during a normal refresh."
    fr: "L'échec d'une sonde de disponibilité ne redémarre pas le pod ; il retire le pod des points de terminaison du Service jusqu'à ce que la sonde réussisse de nouveau. Une sonde de vivacité sert à détecter un processus bloqué et déclenche un redémarrage : elle ne doit pas échouer pendant une actualisation normale."
  options:
    a:
      en: "A startup probe only holds off the other probes while the application starts; it does nothing during the hourly refresh."
      fr: "Une sonde de démarrage ne fait que retarder les autres sondes pendant le démarrage de l'application ; elle n'a aucun effet pendant l'actualisation horaire."
    b:
      en: "A PodDisruptionBudget limits voluntary disruptions such as node drains; it does not stop probe-driven restarts or traffic to a pod."
      fr: "Un PodDisruptionBudget limite les interruptions volontaires comme le drainage de nœuds ; il n'empêche ni les redémarrages dus aux sondes ni le trafic vers un pod."
    c:
      en: "The initial delay only postpones the first probe after the container starts; the probe still fails and restarts the container during each refresh."
      fr: "Le délai initial ne fait que retarder la première sonde après le démarrage du conteneur ; la sonde échoue toujours et redémarre le conteneur à chaque actualisation."
references:
  - title: Running highly-available applications
    url: https://docs.aws.amazon.com/eks/latest/best-practices/application.html
