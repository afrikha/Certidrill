id: dvac03-4b-beanstalk-enhanced-health
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a web application in an AWS Elastic Beanstalk environment with basic health reporting. The developers want each instance's health status with the causes of problems, request and latency data reported about every 10 seconds, and the status of each instance during deployments.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application web dans un environnement AWS Elastic Beanstalk avec le rapport d'état de base. Les développeurs veulent l'état de santé de chaque instance avec les causes des problèmes, des données de requêtes et de latence transmises environ toutes les 10 secondes, et l'état de chaque instance pendant les déploiements.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on enhanced health reporting for the environment.", fr: "Activer le rapport d'état amélioré pour l'environnement." } }
    - { id: b, text: { en: "Turn on detailed monitoring for the environment's EC2 instances.", fr: "Activer la surveillance détaillée des instances EC2 de l'environnement." } }
    - { id: c, text: { en: "Turn on log streaming to CloudWatch Logs for the environment.", fr: "Activer la diffusion des journaux vers CloudWatch Logs pour l'environnement." } }
    - { id: d, text: { en: "Configure the load balancer health check to run every 10 seconds.", fr: "Configurer la vérification de l'état de l'équilibreur de charge pour qu'elle s'exécute toutes les 10 secondes." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Enhanced health reporting uses a health agent on each instance that reports operating system metrics and web server request data to Elastic Beanstalk every 10 seconds. Elastic Beanstalk shows a status with causes for each instance and tracks the deployment status of each instance."
    fr: "Le rapport d'état amélioré utilise un agent de santé sur chaque instance, qui transmet toutes les 10 secondes à Elastic Beanstalk des métriques du système d'exploitation et des données de requêtes du serveur web. Elastic Beanstalk affiche un statut avec les causes pour chaque instance et suit l'état de déploiement de chaque instance."
  options:
    b:
      en: "Detailed monitoring sends EC2 metrics every minute; it gives no per-instance health causes or deployment status."
      fr: "La surveillance détaillée envoie les métriques EC2 chaque minute ; elle ne fournit ni causes de santé par instance ni état de déploiement."
    c:
      en: "Log streaming copies log files to CloudWatch Logs; it does not compute health statuses."
      fr: "La diffusion des journaux copie les fichiers journaux vers CloudWatch Logs ; elle ne calcule pas d'états de santé."
    d:
      en: "Load balancer health checks only report whether each target answers; basic health still gives no causes, request data or deployment status."
      fr: "Les vérifications de l'état de l'équilibreur de charge indiquent seulement si chaque cible répond ; l'état de base ne fournit toujours ni causes, ni données de requêtes, ni état de déploiement."
references:
  - title: Enhanced health reporting and monitoring in Elastic Beanstalk
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/health-enhanced.html
