id: dvac03-4a-insights-parse-glob
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legacy application writes plain text log events such as the following line to CloudWatch Logs.

    ```text
    2026-11-03T10:15:02Z INFO checkout user=u-1842 latencyMs=732 status=200
    ```

    A developer needs the average latency for each HTTP status by using CloudWatch Logs Insights, without changing the application.

    Which query will meet this requirement?
  fr: |
    Une application existante écrit dans CloudWatch Logs des événements de journal en texte brut, comme la ligne suivante.

    ```text
    2026-11-03T10:15:02Z INFO checkout user=u-1842 latencyMs=732 status=200
    ```

    Un développeur a besoin de la latence moyenne pour chaque statut HTTP à l'aide de CloudWatch Logs Insights, sans modifier l'application.

    Quelle requête répond à cette exigence ?
body:
  options:
    - { id: a, text: "`stats avg(latencyMs) by status`" }
    - { id: b, text: "`parse @message \"latencyMs=* status=*\" as latency, status | stats avg(latency) by status`" }
    - { id: c, text: "`filter @message like /latencyMs/ | stats avg(@duration) by status`" }
    - { id: d, text: "`fields latencyMs, status | stats avg(latencyMs) by bin(1h)`" }
answer: { optionId: b }
explanation:
  correct:
    en: "Logs Insights discovers fields automatically only for JSON events and some AWS log types, not for arbitrary plain text. The parse command with a glob pattern extracts the values that replace each asterisk into named fields, which stats can then average by status."
    fr: "Logs Insights ne découvre automatiquement les champs que pour les événements JSON et certains types de journaux AWS, pas pour du texte brut quelconque. La commande parse avec un modèle glob extrait dans des champs nommés les valeurs qui remplacent chaque astérisque, que stats peut ensuite moyenner par statut."
  options:
    a:
      en: "latencyMs and status are not discovered fields in plain text events, so the query has nothing to aggregate."
      fr: "latencyMs et status ne sont pas des champs découverts dans des événements en texte brut : la requête n'a rien à agréger."
    c:
      en: "@duration is a field of Lambda REPORT lines, not the latency written by this application, and status is still not extracted."
      fr: "@duration est un champ des lignes REPORT de Lambda, pas la latence écrite par cette application, et status n'est toujours pas extrait."
    d:
      en: "The fields are still not extracted, and grouping by bin(1h) gives an average per hour instead of per status."
      fr: "Les champs ne sont toujours pas extraits, et le regroupement par bin(1h) donne une moyenne par heure au lieu d'une moyenne par statut."
references:
  - title: Sample queries
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-examples.html
  - title: Supported logs and discovered fields
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_AnalyzeLogData-discoverable-fields.html
