id: dvac03-4a-kiro-mcp-cloudwatch
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer uses Kiro to troubleshoot a serverless application. The developer wants the Kiro agent to query CloudWatch logs, metrics and alarms of the AWS account directly while it analyzes an error, instead of the developer copying logs into the chat. The agent must use a read-only IAM role.

    Which solution will meet these requirements?
  fr: |
    Un développeur utilise Kiro pour dépanner une application sans serveur. Il veut que l'agent Kiro interroge directement les journaux, métriques et alarmes CloudWatch du compte AWS pendant qu'il analyse une erreur, au lieu que le développeur copie les journaux dans le chat. L'agent doit utiliser un rôle IAM en lecture seule.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a steering file that lists the names of the log groups and alarms of the application.", fr: "Ajouter un fichier de pilotage (steering) qui liste les noms des groupes de journaux et des alarmes de l'application." } }
    - { id: b, text: { en: "Add the CloudWatch console URL of the log group to the chat with the #url context provider.", fr: "Ajouter l'URL de la console CloudWatch du groupe de journaux au chat avec le fournisseur de contexte #url." } }
    - { id: c, text: { en: "Configure a CloudWatch MCP server in the Kiro MCP configuration, for example with the AWS Observability power, using credentials for the read-only role.", fr: "Configurer un serveur MCP CloudWatch dans la configuration MCP de Kiro, par exemple avec le power AWS Observability, en utilisant les informations d'identification du rôle en lecture seule." } }
    - { id: d, text: { en: "Create an agent hook that exports the log group to Amazon S3 whenever a file is saved.", fr: "Créer un hook d'agent qui exporte le groupe de journaux vers Amazon S3 à chaque enregistrement de fichier." } }
answer: { optionId: c }
explanation:
  correct:
    en: "MCP servers connect the Kiro agent to external tools and APIs. A CloudWatch MCP server, which the AWS Observability Kiro power bundles with Application Signals, CloudTrail and AWS documentation servers, lets the agent query logs, metrics and alarms itself, with the permissions of the credentials it is given."
    fr: "Les serveurs MCP connectent l'agent Kiro à des outils et des API externes. Un serveur MCP CloudWatch, que le power Kiro AWS Observability regroupe avec des serveurs Application Signals, CloudTrail et de documentation AWS, permet à l'agent d'interroger lui-même les journaux, métriques et alarmes, avec les autorisations des informations d'identification qui lui sont fournies."
  options:
    a:
      en: "Steering files give the agent context and standards; they give it no access to the account data."
      fr: "Les fichiers de pilotage donnent à l'agent du contexte et des normes ; ils ne lui donnent aucun accès aux données du compte."
    b:
      en: "A console URL requires a signed-in browser session; the agent cannot read account data through it with the read-only role."
      fr: "Une URL de console exige une session de navigateur authentifiée ; l'agent ne peut pas lire les données du compte par ce biais avec le rôle en lecture seule."
    d:
      en: "Exporting logs on every save is slow and costly, and it still does not let the agent query metrics and alarms."
      fr: "Exporter les journaux à chaque enregistrement est lent et coûteux, et ne permet toujours pas à l'agent d'interroger les métriques et les alarmes."
references:
  - title: MCP
    url: https://kiro.dev/docs/mcp/
