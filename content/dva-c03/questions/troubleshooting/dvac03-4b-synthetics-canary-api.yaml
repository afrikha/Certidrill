id: dvac03-4b-synthetics-canary-api
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has a public checkout API that receives almost no traffic at night. Last month, the API was broken for several hours overnight, and nobody noticed until customers complained in the morning. The team must detect within 5 minutes that the full checkout flow fails, even when no customers are using the API, and must be notified.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'une API publique de paiement qui ne reçoit presque aucun trafic la nuit. Le mois dernier, l'API a été en panne pendant plusieurs heures dans la nuit, et personne ne s'en est aperçu avant les plaintes des clients le matin. L'équipe doit détecter en moins de 5 minutes l'échec du parcours de paiement complet, même quand aucun client n'utilise l'API, et être notifiée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an alarm on the `5XXError` metric of the API with a threshold of 1 and an action that notifies an Amazon SNS topic.", fr: "Créer une alarme sur la métrique `5XXError` de l'API avec un seuil de 1 et une action qui notifie une rubrique Amazon SNS." } }
    - { id: b, text: { en: "Create a CloudWatch Synthetics canary that runs the checkout flow every 5 minutes, with an alarm on its `SuccessPercent` metric.", fr: "Créer un canary CloudWatch Synthetics qui exécute le parcours de paiement toutes les 5 minutes, avec une alarme sur sa métrique `SuccessPercent`." } }
    - { id: c, text: { en: "Turn on X-Ray tracing for the API, and create an X-Ray group with a filter expression for failed requests.", fr: "Activer le traçage X-Ray pour l'API, et créer un groupe X-Ray avec une expression de filtre pour les requêtes échouées." } }
    - { id: d, text: { en: "Configure the target group health checks of the backend to call the checkout endpoint every 5 seconds.", fr: "Configurer les vérifications de l'état du groupe cible du backend pour appeler le point de terminaison de paiement toutes les 5 secondes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A Synthetics canary is a script that runs on a schedule and performs the same steps as a customer, so it tests the API even without live traffic. Canaries publish metrics such as `SuccessPercent` in the `CloudWatchSynthetics` namespace, and an alarm on that metric notifies the team when runs fail."
    fr: "Un canary Synthetics est un script qui s'exécute selon une planification et effectue les mêmes étapes qu'un client : il teste l'API même sans trafic réel. Les canaries publient des métriques comme `SuccessPercent` dans l'espace de noms `CloudWatchSynthetics`, et une alarme sur cette métrique notifie l'équipe en cas d'échec des exécutions."
  options:
    a:
      en: "With no traffic at night, the API returns no errors, so the metric cannot reveal a failure until customers call the API."
      fr: "Sans trafic la nuit, l'API ne renvoie aucune erreur : la métrique ne peut révéler une panne qu'une fois que des clients appellent l'API."
    c:
      en: "Traces are recorded only for real requests, so nothing is traced while nobody uses the API, and a group sends no notification by itself."
      fr: "Les traces ne sont enregistrées que pour des requêtes réelles : rien n'est tracé tant que personne n'utilise l'API, et un groupe n'envoie aucune notification par lui-même."
    d:
      en: "Target health checks test each backend target, not the full checkout flow through the API, and they do not notify anyone."
      fr: "Les vérifications de l'état des cibles testent chaque cible du backend, pas le parcours de paiement complet via l'API, et elles ne notifient personne."
references:
  - title: Synthetic monitoring (canaries)
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries.html
  - title: CloudWatch metrics published by canaries
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries_metrics.html
