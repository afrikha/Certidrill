id: dvac03-4c-apigw-cache-key
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an Amazon API Gateway REST API with a `GET /products` method that accepts a `category` query string. A developer enabled caching on the prod stage with a TTL of 300 seconds. Since then, a request for `/products?category=books` sometimes returns the toys that another client requested a few seconds earlier.

    Which solution will fix the issue and keep caching enabled?
  fr: |
    AnyCompany dispose d'une API REST Amazon API Gateway avec une méthode `GET /products` qui accepte une chaîne de requête `category`. Un développeur a activé la mise en cache sur l'étape prod avec une TTL de 300 secondes. Depuis, une requête `/products?category=books` renvoie parfois les jouets demandés par un autre client quelques secondes plus tôt.

    Quelle solution corrige le problème tout en gardant la mise en cache activée ?
body:
  options:
    - id: a
      text: { en: "Flush the cache of the prod stage.", fr: "Vider le cache de l'étape prod." }
    - id: b
      text: { en: "Set the cache TTL of the method to 0.", fr: "Définir la TTL de cache de la méthode à 0." }
    - id: c
      text: { en: "Increase the cache capacity of the prod stage.", fr: "Augmenter la capacité du cache de l'étape prod." }
    - id: d
      text: { en: "Add method.request.querystring.category as a cache key parameter of the method.", fr: "Ajouter method.request.querystring.category comme paramètre de clé de cache de la méthode." }
answer: { optionId: d }
explanation:
  correct:
    en: "API Gateway indexes cached responses by cache keys built from the method or integration parameters that you specify. When category is a cache key parameter, `/products?category=books` and `/products?category=toys` are cached separately, so each category gets its own response."
    fr: "API Gateway indexe les réponses en cache par des clés de cache construites à partir des paramètres de méthode ou d'intégration que vous indiquez. Quand category est un paramètre de clé de cache, `/products?category=books` et `/products?category=toys` sont mis en cache séparément, et chaque catégorie obtient sa propre réponse."
  options:
    a:
      en: "Flushing removes the current entries, but the next response would again be cached for all categories under the same key."
      fr: "Vider le cache supprime les entrées actuelles, mais la réponse suivante serait de nouveau mise en cache pour toutes les catégories sous la même clé."
    b:
      en: "A TTL of 0 disables caching for the method, which does not keep caching enabled."
      fr: "Une TTL de 0 désactive la mise en cache pour la méthode, ce qui ne garde pas la mise en cache activée."
    c:
      en: "A larger cache holds more entries, but the category value is still not part of the cache key."
      fr: "Un cache plus grand contient plus d'entrées, mais la valeur de category ne fait toujours pas partie de la clé de cache."
references:
  - title: Cache settings for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-caching.html
