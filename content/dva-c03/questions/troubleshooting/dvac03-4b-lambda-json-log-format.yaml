id: dvac03-4b-lambda-json-log-format
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a Python 3.13 AWS Lambda function that writes its logs with the standard `logging` module. The logs reach Amazon CloudWatch Logs as plain text lines. The operations team wants every log entry to be a JSON object with the level, the timestamp and the Lambda request ID as separate keys so that the entries can be filtered by field. The application code must not change.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une fonction AWS Lambda Python 3.13 qui écrit ses journaux avec le module standard `logging`. Les journaux arrivent dans Amazon CloudWatch Logs sous forme de lignes de texte brut. L'équipe d'exploitation veut que chaque entrée de journal soit un objet JSON avec le niveau, l'horodatage et l'ID de requête Lambda comme clés distinctes, afin de pouvoir filtrer les entrées par champ. Le code de l'application ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the Powertools for AWS Lambda (Python) layer to the function.", fr: "Ajouter la couche Powertools for AWS Lambda (Python) à la fonction." } }
    - { id: b, text: { en: "Turn on active tracing for the function.", fr: "Activer le traçage actif pour la fonction." } }
    - { id: c, text: { en: "Set the log format of the function to JSON in its logging configuration.", fr: "Définir le format de journal de la fonction sur JSON dans sa configuration de journalisation." } }
    - { id: d, text: { en: "Create a metric filter with a JSON filter pattern on the function's log group.", fr: "Créer un filtre de métrique avec un modèle de filtre JSON sur le groupe de journaux de la fonction." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Lambda's advanced logging controls let you switch a function from the default plain text format to JSON. For Python 3.8 and later, Lambda then wraps the output of the `logging` module in JSON records with `timestamp`, `level`, `message` and `requestId`, without any code change."
    fr: "Les contrôles de journalisation avancés de Lambda permettent de passer une fonction du format texte brut par défaut au format JSON. Pour Python 3.8 et versions ultérieures, Lambda encapsule alors la sortie du module `logging` dans des enregistrements JSON avec `timestamp`, `level`, `message` et `requestId`, sans modifier le code."
  options:
    a:
      en: "The Powertools Logger produces structured logs only when the code imports and uses it, so adding the layer alone changes nothing and using it requires a code change."
      fr: "Le Logger de Powertools ne produit des journaux structurés que si le code l'importe et l'utilise : ajouter la couche seule ne change rien, et l'utiliser impose une modification du code."
    b:
      en: "Active tracing sends trace segments to AWS X-Ray; it does not change the format of the function's log entries."
      fr: "Le traçage actif envoie des segments de trace à AWS X-Ray ; il ne change pas le format des entrées de journal de la fonction."
    d:
      en: "A metric filter turns matching log events into metric data points; the log entries stay in plain text."
      fr: "Un filtre de métrique transforme les événements de journal correspondants en points de données de métrique ; les entrées de journal restent en texte brut."
references:
  - title: Configuring JSON and plain text log formats
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-logformat.html
  - title: Log and monitor Python Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/python-logging.html
