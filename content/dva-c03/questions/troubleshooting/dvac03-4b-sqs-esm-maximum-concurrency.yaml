id: dvac03-4b-sqs-esm-maximum-concurrency
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AnyCompany AWS Lambda function processes messages from two Amazon SQS standard queues through two event source mappings in standard mode: `orders` (high volume) and `refunds` (low volume). During order peaks, the `orders` queue uses all the concurrency available to the function and refunds wait for a long time. The team wants `orders` to use at most 80 concurrent invocations and `refunds` at most 20, without messages being throttled and returned to the queues because of these limits.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda d'AnyCompany traite les messages de deux files d'attente Amazon SQS standard au moyen de deux mappages de source d'événement en mode standard : `orders` (volume élevé) et `refunds` (faible volume). Lors des pics de commandes, la file `orders` utilise toute la simultanéité disponible pour la fonction et les remboursements attendent longtemps. L'équipe veut que `orders` utilise au maximum 80 appels simultanés et `refunds` au maximum 20, sans que des messages soient limités et renvoyés dans les files à cause de ces limites.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the reserved concurrency of the function to 100 so that the two queues share a guaranteed pool of capacity.", fr: "Définir la simultanéité réservée de la fonction sur 100 pour que les deux files partagent une capacité garantie." } }
    - { id: b, text: { en: "Set the batch size of the `orders` mapping to 1 and the batch size of the `refunds` mapping to 10.", fr: "Définir la taille de lot du mappage `orders` sur 1 et celle du mappage `refunds` sur 10." } }
    - { id: c, text: { en: "Set maximum concurrency to 80 on the `orders` mapping and 20 on `refunds`, with a reserved concurrency of at least 100.", fr: "Définir la simultanéité maximale sur 80 pour le mappage `orders` et 20 pour `refunds`, avec une simultanéité réservée d'au moins 100." } }
    - { id: d, text: { en: "Increase the visibility timeout of the `orders` queue so that the function receives its messages less often.", fr: "Augmenter le délai de visibilité de la file `orders` pour que la fonction reçoive ses messages moins souvent." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The maximum concurrency setting of an SQS event source mapping caps how many invocations that queue can start, so each queue gets its own limit and Lambda does not poll more than it can invoke. Keeping the function's reserved concurrency at least equal to the sum of the mapping limits avoids throttling."
    fr: "Le paramètre de simultanéité maximale d'un mappage de source d'événement SQS plafonne le nombre d'appels que cette file peut démarrer : chaque file a sa propre limite et Lambda n'interroge pas plus qu'il ne peut appeler. Une simultanéité réservée de la fonction au moins égale à la somme des limites des mappages évite la limitation."
  options:
    a:
      en: "Reserved concurrency is shared by both queues, so `orders` can still take all 100, and pollers can receive more messages than the function can run, which throttles them back to the queue."
      fr: "La simultanéité réservée est partagée par les deux files : `orders` peut toujours prendre les 100, et les processus d'interrogation peuvent recevoir plus de messages que la fonction ne peut en traiter, ce qui les renvoie dans la file."
    b:
      en: "Batch size sets how many messages each invocation receives; it does not cap the number of concurrent invocations per queue."
      fr: "La taille de lot définit le nombre de messages reçus par appel ; elle ne plafonne pas le nombre d'appels simultanés par file."
    d:
      en: "The visibility timeout controls when an unprocessed message becomes visible again; it does not limit concurrency and delays retries."
      fr: "Le délai de visibilité contrôle quand un message non traité redevient visible ; il ne limite pas la simultanéité et retarde les nouvelles tentatives."
references:
  - title: Configuring scaling behavior for SQS event source mappings
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html
