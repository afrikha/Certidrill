id: dvac03-4b-statistic-sets-batching
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AnyCompany worker on Amazon EC2 calls `PutMetricData` once for every item it processes, which is several thousand calls each minute for the `ItemDuration` metric. The API cost is high and some calls are throttled. The dashboards only need the minimum, maximum, average and count of `ItemDuration` per minute.

    Which solution is the MOST cost-effective?
  fr: |
    Un processus de travail d'AnyCompany sur Amazon EC2 appelle `PutMetricData` une fois pour chaque élément traité, soit plusieurs milliers d'appels par minute pour la métrique `ItemDuration`. Le coût d'API est élevé et certains appels sont limités. Les tableaux de bord n'ont besoin que du minimum, du maximum, de la moyenne et du nombre de `ItemDuration` par minute.

    Quelle solution est la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Aggregate the durations in memory and publish one statistic set each minute.", fr: "Agréger les durées en mémoire et publier un ensemble de statistiques chaque minute." } }
    - { id: b, text: { en: "Publish each data point with `StorageResolution` set to 1.", fr: "Publier chaque point de données avec `StorageResolution` défini sur 1." } }
    - { id: c, text: { en: "Keep one call per item and add retries with exponential backoff for throttled calls.", fr: "Conserver un appel par élément et ajouter des nouvelles tentatives avec temporisation exponentielle pour les appels limités." } }
    - { id: d, text: { en: "Keep one call per item, and send the calls from a pool of parallel threads.", fr: "Conserver un appel par élément, et envoyer les appels depuis un pool de threads parallèles." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A statistic set carries pre-aggregated Sum, Minimum, Maximum and SampleCount values in one data point, from which CloudWatch computes the average. One call per minute replaces thousands, which removes the throttling and most of the request cost while keeping the required statistics."
    fr: "Un ensemble de statistiques transporte des valeurs Sum, Minimum, Maximum et SampleCount pré-agrégées dans un seul point de données, à partir desquelles CloudWatch calcule la moyenne. Un appel par minute remplace des milliers d'appels, ce qui supprime la limitation et l'essentiel du coût des requêtes tout en conservant les statistiques demandées."
  options:
    b:
      en: "High resolution keeps every call and adds cost; it does not reduce the number of requests."
      fr: "La haute résolution conserve chaque appel et ajoute un coût ; elle ne réduit pas le nombre de requêtes."
    c:
      en: "Retries make throttled calls succeed later, but every call is still billed, so the cost does not drop."
      fr: "Les nouvelles tentatives font aboutir plus tard les appels limités, mais chaque appel reste facturé : le coût ne baisse pas."
    d:
      en: "Parallel calls increase the request rate, which causes more throttling and the same cost."
      fr: "Des appels parallèles augmentent le débit de requêtes, ce qui cause davantage de limitation pour le même coût."
references:
  - title: Publish custom metrics (PutMetricData / EMF)
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/publishingMetrics.html
