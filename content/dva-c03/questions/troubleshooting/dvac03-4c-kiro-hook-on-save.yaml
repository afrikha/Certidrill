id: dvac03-4c-kiro-hook-on-save
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's developers use Kiro to build AWS Lambda functions. The team wants Kiro to review a handler for performance problems, such as AWS SDK clients created inside the handler or Scan operations used instead of Query, every time a developer saves a file in the `src/handlers/` folder. Developers must not have to ask for the review.

    Which solution will meet these requirements?
  fr: |
    Les développeurs d'AnyCompany utilisent Kiro pour créer des fonctions AWS Lambda. L'équipe veut que Kiro examine un gestionnaire à la recherche de problèmes de performances, comme des clients du kit SDK AWS créés dans le gestionnaire ou des opérations Scan utilisées à la place de Query, chaque fois qu'un développeur enregistre un fichier du dossier `src/handlers/`. Les développeurs ne doivent pas avoir à demander cet examen.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a steering file with the fileMatch inclusion mode for src/handlers/ that lists the performance rules.", fr: "Ajouter un fichier d'orientation (steering) en mode d'inclusion fileMatch pour src/handlers/ qui liste les règles de performances." }
    - id: b
      text: { en: "Create a spec for src/handlers/ whose tasks.md file contains a performance review task.", fr: "Créer une spécification (spec) pour src/handlers/ dont le fichier tasks.md contient une tâche d'examen des performances." }
    - id: c
      text: { en: "Create an agent hook that runs when a file in src/handlers/ is saved and prompts the agent to review it.", fr: "Créer un hook d'agent qui s'exécute à l'enregistrement d'un fichier de src/handlers/ et demande à l'agent d'examiner le fichier." }
    - id: d
      text: { en: "Add the AWS Documentation MCP server to the workspace MCP configuration of Kiro.", fr: "Ajouter le serveur MCP AWS Documentation à la configuration MCP de l'espace de travail Kiro." }
answer: { optionId: c }
explanation:
  correct:
    en: "Kiro agent hooks are automated triggers that run predefined agent actions when events occur, such as saving, creating or deleting files. A hook triggered by saves in src/handlers/ with an agent prompt that reviews the file for the performance rules runs the review automatically."
    fr: "Les hooks d'agent Kiro sont des déclencheurs automatisés qui exécutent des actions d'agent prédéfinies quand des événements se produisent, comme l'enregistrement, la création ou la suppression de fichiers. Un hook déclenché par les enregistrements dans src/handlers/, avec une invite d'agent qui examine le fichier selon les règles de performances, exécute l'examen automatiquement."
  options:
    a:
      en: "A fileMatch steering file adds the rules to Kiro's context when it works on matching files, but it does not trigger a review when a file is saved."
      fr: "Un fichier d'orientation en mode fileMatch ajoute les règles au contexte de Kiro quand il travaille sur les fichiers correspondants, mais il ne déclenche pas d'examen à l'enregistrement d'un fichier."
    b:
      en: "A spec turns a feature or a bug fix into requirements, design and tasks that are run on request; it does not react to file saves."
      fr: "Une spécification transforme une fonctionnalité ou une correction en exigences, conception et tâches exécutées sur demande ; elle ne réagit pas aux enregistrements de fichiers."
    d:
      en: "The AWS Documentation MCP server lets Kiro search AWS documentation; it does not run anything when a file is saved."
      fr: "Le serveur MCP AWS Documentation permet à Kiro de rechercher dans la documentation AWS ; il n'exécute rien à l'enregistrement d'un fichier."
references:
  - title: Kiro Documentation
    url: https://aws.amazon.com/documentation-overview/kiro/
  - title: Hooks
    url: https://kiro.dev/docs/hooks/
