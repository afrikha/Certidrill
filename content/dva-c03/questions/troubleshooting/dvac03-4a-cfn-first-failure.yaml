id: dvac03-4a-cfn-first-failure
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer creates an AWS CloudFormation stack from a new template. After several minutes, the stack status is ROLLBACK_COMPLETE, and the developer needs to find the root cause of the failure.

    Where should the developer look first?
  fr: |
    Un développeur crée une pile AWS CloudFormation à partir d'un nouveau modèle. Après plusieurs minutes, le statut de la pile est ROLLBACK_COMPLETE, et le développeur doit trouver la cause racine de l'échec.

    Où le développeur doit-il chercher en premier ?
body:
  options:
    - { id: a, text: { en: "The status reason of the ROLLBACK_COMPLETE event at the top of the stack events list", fr: "La raison du statut de l'événement ROLLBACK_COMPLETE en haut de la liste des événements de la pile" } }
    - { id: b, text: { en: "The status reason of the first CREATE_FAILED event in the stack events", fr: "La raison du statut du premier événement CREATE_FAILED dans les événements de la pile" } }
    - { id: c, text: { en: "The drift detection results of the stack", fr: "Les résultats de la détection de dérive de la pile" } }
    - { id: d, text: { en: "The Outputs tab of the stack", fr: "L'onglet Sorties (Outputs) de la pile" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Stack events record each resource operation with a status reason that often contains the error returned by CloudFormation or by the underlying service. The first failure event is the one that triggered the rollback, so its status reason points to the root cause."
    fr: "Les événements de la pile enregistrent chaque opération sur une ressource avec une raison de statut qui contient souvent l'erreur renvoyée par CloudFormation ou par le service sous-jacent. Le premier événement d'échec est celui qui a déclenché la restauration : sa raison de statut indique la cause racine."
  options:
    a:
      en: "Events are listed newest first; the ROLLBACK_COMPLETE event only reports that the cleanup finished, and later failures can be consequences of the first one."
      fr: "Les événements sont listés du plus récent au plus ancien ; l'événement ROLLBACK_COMPLETE indique seulement que le nettoyage est terminé, et les échecs ultérieurs peuvent découler du premier."
    c:
      en: "Drift detection compares resources with the template after out-of-band changes; it does not explain a failed creation, and the resources were deleted by the rollback."
      fr: "La détection de dérive compare les ressources au modèle après des modifications hors CloudFormation ; elle n'explique pas un échec de création, et les ressources ont été supprimées par la restauration."
    d:
      en: "Outputs are values declared by the template; a stack that failed to create has no useful outputs."
      fr: "Les sorties sont des valeurs déclarées par le modèle ; une pile dont la création a échoué n'a pas de sorties utiles."
references:
  - title: Troubleshooting CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/troubleshooting.html
  - title: View CloudFormation stack events
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/view-stack-events.html
