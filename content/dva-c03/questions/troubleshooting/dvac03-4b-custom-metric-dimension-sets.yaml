id: dvac03-4b-custom-metric-dimension-sets
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's services publish a custom metric named `Latency` with two dimensions, `Service` and `Endpoint`, in every data point. A developer creates an Amazon CloudWatch alarm on `Latency` with only the dimension `Service=checkout` to watch the latency of all checkout endpoints together. The alarm stays in the `INSUFFICIENT_DATA` state while the services are busy.

    Which solution will make the alarm evaluate the latency of all checkout endpoints?
  fr: |
    Les services d'AnyCompany publient une métrique personnalisée nommée `Latency` avec deux dimensions, `Service` et `Endpoint`, dans chaque point de données. Un développeur crée une alarme Amazon CloudWatch sur `Latency` avec la seule dimension `Service=checkout` pour surveiller ensemble la latence de tous les points de terminaison de paiement. L'alarme reste à l'état `INSUFFICIENT_DATA` alors que les services sont actifs.

    Quelle solution permet à l'alarme d'évaluer la latence de tous les points de terminaison de paiement ?
body:
  options:
    - { id: a, text: { en: "Change the statistic of the alarm from Average to Sum.", fr: "Remplacer la statistique Average de l'alarme par Sum." } }
    - { id: b, text: { en: "Also publish each data point with a dimension set that contains only `Service`.", fr: "Publier aussi chaque point de données avec un ensemble de dimensions qui ne contient que `Service`." } }
    - { id: c, text: { en: "Set the alarm to treat missing data as not breaching.", fr: "Configurer l'alarme pour traiter les données manquantes comme non en infraction (notBreaching)." } }
    - { id: d, text: { en: "Wait 15 minutes for the metric to appear in `ListMetrics`, and then recreate the alarm.", fr: "Attendre 15 minutes que la métrique apparaisse dans `ListMetrics`, puis recréer l'alarme." } }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudWatch treats each unique combination of dimensions as a separate metric and does not aggregate custom metrics across dimensions. No data was ever published for `Service=checkout` alone, so the alarm finds none; publishing each value also with a `Service`-only dimension set creates that metric."
    fr: "CloudWatch traite chaque combinaison unique de dimensions comme une métrique distincte et n'agrège pas les métriques personnalisées d'une dimension à l'autre. Aucune donnée n'a jamais été publiée pour `Service=checkout` seul, donc l'alarme n'en trouve aucune ; publier aussi chaque valeur avec un ensemble de dimensions limité à `Service` crée cette métrique."
  options:
    a:
      en: "The statistic does not matter when the metric the alarm points to has no data points at all."
      fr: "La statistique n'a pas d'importance quand la métrique visée par l'alarme n'a aucun point de données."
    c:
      en: "This only hides the problem: the alarm would show OK while it still watches no data."
      fr: "Cela ne fait que masquer le problème : l'alarme afficherait OK tout en ne surveillant toujours aucune donnée."
    d:
      en: "The delay applies to new metrics, but the `Service`-only metric is never created, however long you wait."
      fr: "Le délai concerne les nouvelles métriques, mais la métrique limitée à `Service` n'est jamais créée, quel que soit le temps d'attente."
references:
  - title: Metrics concepts
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html
