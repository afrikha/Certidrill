id: dvac03-4b-heartbeat-missing-data
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AnyCompany batch worker publishes a custom metric named `Heartbeat` with a value of 1 every minute while it runs. The team creates a CloudWatch alarm on the Sum of `Heartbeat` over 60-second periods, with 3 evaluation periods and the condition "less than 1". The alarm must go into the ALARM state and notify the team when the worker stops publishing the metric.

    How should the team configure the treatment of missing data for the alarm?
  fr: |
    Un processus de traitement par lots d'AnyCompany publie chaque minute, pendant son exécution, une métrique personnalisée nommée `Heartbeat` avec une valeur de 1. L'équipe crée une alarme CloudWatch sur la somme de `Heartbeat` par périodes de 60 secondes, avec 3 périodes d'évaluation et la condition « inférieur à 1 ». L'alarme doit passer à l'état ALARM et notifier l'équipe quand le processus cesse de publier la métrique.

    Comment l'équipe doit-elle configurer le traitement des données manquantes pour l'alarme ?
body:
  options:
    - { id: a, text: { en: "Treat missing data as `notBreaching`.", fr: "Traiter les données manquantes comme `notBreaching`." } }
    - { id: b, text: { en: "Treat missing data as `ignore`.", fr: "Traiter les données manquantes comme `ignore`." } }
    - { id: c, text: { en: "Treat missing data as `breaching`.", fr: "Traiter les données manquantes comme `breaching`." } }
    - { id: d, text: { en: "Keep the default setting, `missing`.", fr: "Conserver le paramètre par défaut, `missing`." } }
answer: { optionId: c }
explanation:
  correct:
    en: "When the worker stops, no data points arrive. With `breaching`, CloudWatch counts the missing points as breaching the threshold, so after three periods without a heartbeat the alarm goes into ALARM and runs its notification action."
    fr: "Quand le processus s'arrête, aucun point de données n'arrive. Avec `breaching`, CloudWatch compte les points manquants comme dépassant le seuil : après trois périodes sans battement de cœur, l'alarme passe à l'état ALARM et exécute son action de notification."
  options:
    a:
      en: "`notBreaching` counts missing points as good, so the alarm stays OK when the worker stops."
      fr: "`notBreaching` compte les points manquants comme bons : l'alarme reste à OK quand le processus s'arrête."
    b:
      en: "`ignore` keeps the current state, so an alarm that was OK stays OK."
      fr: "`ignore` conserve l'état actuel : une alarme à OK reste à OK."
    d:
      en: "With `missing`, an evaluation range with no data moves the alarm to INSUFFICIENT_DATA, not ALARM, so the ALARM notification is not sent."
      fr: "Avec `missing`, une plage d'évaluation sans données fait passer l'alarme à INSUFFICIENT_DATA, pas à ALARM : la notification ALARM n'est pas envoyée."
references:
  - title: Configuring how CloudWatch alarms treat missing data
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarms-and-missing-data.html
