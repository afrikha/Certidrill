id: dvac03-4b-metric-filter-errors
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A legacy application on Amazon EC2 writes lines such as `ERROR PaymentDeclined order=8812` to a file. The CloudWatch agent already sends the file to an Amazon CloudWatch Logs log group in the Standard log class. The team needs a CloudWatch metric that counts these errors so that they can graph it and alarm on it. The application code must not change, and the solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une ancienne application sur Amazon EC2 écrit dans un fichier des lignes comme `ERROR PaymentDeclined order=8812`. L'agent CloudWatch envoie déjà ce fichier vers un groupe de journaux Amazon CloudWatch Logs de la classe Standard. L'équipe a besoin d'une métrique CloudWatch qui compte ces erreurs pour la représenter et déclencher une alarme dessus. Le code de l'application ne doit pas changer, et la solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a subscription filter that sends matching events to a Lambda function that calls `PutMetricData`.", fr: "Ajouter un filtre d'abonnement qui envoie les événements correspondants à une fonction Lambda qui appelle `PutMetricData`." } }
    - { id: b, text: { en: "Change the application so that it writes its errors in the CloudWatch embedded metric format.", fr: "Modifier l'application pour qu'elle écrive ses erreurs au format de métrique intégrée (EMF) de CloudWatch." } }
    - { id: c, text: { en: "Create a metric filter on the log group for `ERROR PaymentDeclined` with a metric value of 1 and a default value of 0.", fr: "Créer sur le groupe de journaux un filtre de métrique pour `ERROR PaymentDeclined` avec une valeur de métrique de 1 et une valeur par défaut de 0." } }
    - { id: d, text: { en: "Add the `procstat` plugin to the CloudWatch agent configuration on the instances to count the error lines.", fr: "Ajouter le plug-in `procstat` à la configuration de l'agent CloudWatch des instances pour compter les lignes d'erreur." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A metric filter turns log events that match a pattern into CloudWatch metric data points as the logs are ingested. A metric value of 1 counts each match, and a default value of 0 reports a data point in periods with logs but no match, so the metric can be graphed and used in alarms."
    fr: "Un filtre de métrique transforme les événements de journal qui correspondent à un modèle en points de données de métrique CloudWatch au moment de l'ingestion. Une valeur de métrique de 1 compte chaque correspondance, et une valeur par défaut de 0 publie un point dans les périodes avec des journaux mais sans correspondance : la métrique peut être représentée et utilisée dans des alarmes."
  options:
    a:
      en: "This works but adds a function to write, run and pay for, which the built-in metric filter avoids."
      fr: "Cela fonctionne, mais ajoute une fonction à écrire, exploiter et payer, ce que le filtre de métrique intégré évite."
    b:
      en: "Writing the embedded metric format requires changing the application code."
      fr: "Écrire au format de métrique intégrée exige de modifier le code de l'application."
    d:
      en: "The `procstat` plugin collects metrics about processes (CPU, memory), not about the content of log lines."
      fr: "Le plug-in `procstat` collecte des métriques sur les processus (processeur, mémoire), pas sur le contenu des lignes de journal."
references:
  - title: Creating metrics from log events using filters
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/MonitoringLogData.html
