id: dvac03-4b-high-resolution-metric
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AnyCompany trading application publishes a custom metric named `QueueLag` with `PutMetricData`. The operations team needs an Amazon CloudWatch alarm that evaluates the metric over 10-second periods so that it reacts within seconds.

    Which solution will meet these requirements?
  fr: |
    Une application de négociation d'AnyCompany publie une métrique personnalisée nommée `QueueLag` avec `PutMetricData`. L'équipe d'exploitation a besoin d'une alarme Amazon CloudWatch qui évalue la métrique sur des périodes de 10 secondes afin de réagir en quelques secondes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Publish the metric with the default storage resolution and create the alarm with a 10-second period.", fr: "Publier la métrique avec la résolution de stockage par défaut et créer l'alarme avec une période de 10 secondes." } }
    - { id: b, text: { en: "Turn on detailed monitoring for the EC2 instances that run the application.", fr: "Activer la surveillance détaillée des instances EC2 qui exécutent l'application." } }
    - { id: c, text: { en: "Publish a statistic set every minute and create the alarm with a 60-second period.", fr: "Publier un ensemble de statistiques chaque minute et créer l'alarme avec une période de 60 secondes." } }
    - { id: d, text: { en: "Publish the metric with `StorageResolution` set to 1 and create a high-resolution alarm with a 10-second period.", fr: "Publier la métrique avec `StorageResolution` défini sur 1 et créer une alarme haute résolution avec une période de 10 secondes." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A custom metric published with a storage resolution of 1 is a high-resolution metric stored at 1-second granularity. High-resolution alarms can use a 10-second or 30-second period, at a higher price than standard alarms."
    fr: "Une métrique personnalisée publiée avec une résolution de stockage de 1 est une métrique haute résolution stockée à la granularité d'une seconde. Les alarmes haute résolution peuvent utiliser une période de 10 ou 30 secondes, à un prix plus élevé que les alarmes standard."
  options:
    a:
      en: "Standard-resolution metrics have one-minute granularity, so an alarm on them cannot use a 10-second period."
      fr: "Les métriques de résolution standard ont une granularité d'une minute : une alarme sur ces métriques ne peut pas utiliser une période de 10 secondes."
    b:
      en: "Detailed monitoring sends EC2 metrics every minute; it does not change the resolution of a custom metric."
      fr: "La surveillance détaillée envoie les métriques EC2 chaque minute ; elle ne change pas la résolution d'une métrique personnalisée."
    c:
      en: "A 60-second period cannot react within seconds."
      fr: "Une période de 60 secondes ne permet pas de réagir en quelques secondes."
references:
  - title: Publish custom metrics (PutMetricData / EMF)
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/publishingMetrics.html
