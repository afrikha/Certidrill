id: dvac03-4a-contributor-insights-keys
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon DynamoDB table in provisioned capacity mode reports throttled requests during peaks, although its consumed read and write capacity stays well below the provisioned capacity at table level. The developer suspects that a few partition key values receive most of the traffic and needs to identify them with the LEAST operational overhead. The partition key values do not contain sensitive data.

    Which solution will meet these requirements?
  fr: |
    Une table Amazon DynamoDB en mode de capacité provisionnée signale des requêtes limitées pendant les pics, alors que sa capacité de lecture et d'écriture consommée reste bien en dessous de la capacité provisionnée au niveau de la table. Le développeur soupçonne que quelques valeurs de clé de partition reçoivent l'essentiel du trafic et doit les identifier avec le MOINS de charge opérationnelle. Les valeurs de clé de partition ne contiennent pas de données sensibles.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable CloudWatch Contributor Insights for DynamoDB on the table and review the most throttled keys.", fr: "Activer CloudWatch Contributor Insights pour DynamoDB sur la table et examiner les clés les plus limitées." } }
    - { id: b, text: { en: "Enable DynamoDB Streams and write a Lambda function that counts the keys of the modified items.", fr: "Activer DynamoDB Streams et écrire une fonction Lambda qui compte les clés des éléments modifiés." } }
    - { id: c, text: { en: "Enable AWS CloudTrail data events for the table and query the events with Amazon Athena.", fr: "Activer les événements de données AWS CloudTrail pour la table et interroger les événements avec Amazon Athena." } }
    - { id: d, text: { en: "Create a CloudWatch alarm on the ConsumedWriteCapacityUnits metric of the table.", fr: "Créer une alarme CloudWatch sur la métrique ConsumedWriteCapacityUnits de la table." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Throttling while the table-level consumption is low points to traffic concentrated on a few partitions. CloudWatch Contributor Insights for DynamoDB shows the most accessed and most throttled keys of a table or index through managed rules and graphs, with no code to write."
    fr: "Une limitation alors que la consommation au niveau de la table est faible indique un trafic concentré sur quelques partitions. CloudWatch Contributor Insights pour DynamoDB affiche les clés les plus consultées et les plus limitées d'une table ou d'un index au moyen de règles et de graphiques gérés, sans code à écrire."
  options:
    b:
      en: "A stream only contains successful item modifications, so it misses reads and throttled requests, and the counting function must be built and run."
      fr: "Un flux ne contient que les modifications d'éléments réussies : il ignore les lectures et les requêtes limitées, et la fonction de comptage doit être développée et exploitée."
    c:
      en: "Data events plus Athena queries can work but add a trail, storage and queries to maintain, which is more overhead than a built-in feature."
      fr: "Les événements de données et des requêtes Athena peuvent fonctionner, mais ajoutent un journal de suivi, du stockage et des requêtes à maintenir, soit plus de charge qu'une fonctionnalité intégrée."
    d:
      en: "A table-level metric aggregates all keys, so it cannot show which partition key values are hot."
      fr: "Une métrique au niveau de la table agrège toutes les clés : elle ne peut pas montrer quelles valeurs de clé de partition sont sollicitées."
references:
  - title: "CloudWatch contributor insights for DynamoDB: How it works"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/contributorinsights_HowItWorks.html
  - title: Troubleshooting throttling in Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TroubleshootingThrottling.html
