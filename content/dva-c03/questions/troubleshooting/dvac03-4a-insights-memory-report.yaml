id: dvac03-4a-insights-memory-report
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer suspects that an AWS Lambda function is configured with much more memory than it needs. The developer wants a CloudWatch Logs Insights query on the log group of the function that returns, in megabytes, the configured memory and the highest memory actually used during the selected time range.

    Which query will meet this requirement?
  fr: |
    Un développeur soupçonne qu'une fonction AWS Lambda est configurée avec beaucoup plus de mémoire que nécessaire. Il veut une requête CloudWatch Logs Insights sur le groupe de journaux de la fonction qui renvoie, en mégaoctets, la mémoire configurée et la mémoire maximale réellement utilisée pendant la plage de temps sélectionnée.

    Quelle requête répond à cette exigence ?
body:
  options:
    - { id: a, text: "`filter @type = \"START\" | stats max(@memorySize / 1000 / 1000) as provisionedMB, max(@maxMemoryUsed / 1000 / 1000) as maxUsedMB`" }
    - { id: b, text: "`filter @type = \"REPORT\" | stats avg(@duration) as provisionedMB, max(@billedDuration) as maxUsedMB`" }
    - { id: c, text: "`filter @type = \"REPORT\" | stats max(@memorySize / 1000 / 1000) as provisionedMB, max(@maxMemoryUsed / 1000 / 1000) as maxUsedMB`" }
    - { id: d, text: "`filter @type = \"REPORT\" | fields @memorySize, @maxMemoryUsed | sort @maxMemoryUsed asc | limit 1`" }
answer: { optionId: c }
explanation:
  correct:
    en: "The memory figures are in the REPORT line that Lambda writes at the end of each invocation, which Logs Insights exposes as the @memorySize and @maxMemoryUsed fields. These fields are in bytes, so dividing by 1,000 twice gives megabytes, and the max function returns the configured size and the peak usage."
    fr: "Les valeurs de mémoire se trouvent dans la ligne REPORT écrite par Lambda à la fin de chaque appel, que Logs Insights expose dans les champs @memorySize et @maxMemoryUsed. Ces champs sont en octets : une double division par 1 000 donne des mégaoctets, et la fonction max renvoie la taille configurée et l'utilisation maximale."
  options:
    a:
      en: "START lines carry only the request ID and version; the memory fields come from REPORT lines."
      fr: "Les lignes START ne contiennent que l'ID de requête et la version ; les champs de mémoire proviennent des lignes REPORT."
    b:
      en: "@duration and @billedDuration are durations, not memory values, whatever names the query gives them."
      fr: "@duration et @billedDuration sont des durées, pas des valeurs de mémoire, quels que soient les noms que leur donne la requête."
    d:
      en: "Sorting in ascending order with limit 1 returns the invocation that used the least memory, in bytes."
      fr: "Un tri croissant avec limit 1 renvoie l'appel qui a utilisé le moins de mémoire, en octets."
references:
  - title: Sample queries
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-examples.html
