id: dvac03-4c-lambda-throttle-metrics
objective: "4.3.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An Amazon API Gateway REST API invokes an AWS Lambda function that has a reserved concurrency of 50. During traffic peaks, clients receive HTTP 429 errors. A developer suspects that the function cannot scale beyond its concurrency limit.

    Which two Lambda metrics should the developer review to confirm this? (Choose two.)
  fr: |
    Une API REST Amazon API Gateway invoque une fonction AWS Lambda dont la simultanéité réservée est de 50. Pendant les pics de trafic, les clients reçoivent des erreurs HTTP 429. Un développeur soupçonne que la fonction ne peut pas monter en charge au-delà de sa limite de simultanéité.

    Quelles sont les deux métriques Lambda que le développeur doit examiner pour le confirmer ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "Duration" }
    - { id: b, text: "Throttles" }
    - { id: c, text: "IteratorAge" }
    - { id: d, text: "DeadLetterErrors" }
    - { id: e, text: "ConcurrentExecutions" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "ConcurrentExecutions is the number of function instances processing events; when it reaches the reserved concurrency limit, Lambda throttles additional requests. Throttles counts the invocation requests that were rejected with a TooManyRequestsException error, which confirms that the limit is reached."
    fr: "ConcurrentExecutions est le nombre d'instances de la fonction qui traitent des événements ; quand il atteint la limite de simultanéité réservée, Lambda limite les requêtes supplémentaires. Throttles compte les requêtes d'invocation rejetées avec une erreur TooManyRequestsException, ce qui confirme que la limite est atteinte."
  options:
    a:
      en: "Duration shows how long the code runs for each event; it does not show whether requests are rejected for lack of concurrency."
      fr: "Duration indique combien de temps le code s'exécute pour chaque événement ; elle ne montre pas si des requêtes sont rejetées faute de simultanéité."
    c:
      en: "IteratorAge applies to stream event sources such as Kinesis and DynamoDB Streams, not to synchronous invocations from API Gateway."
      fr: "IteratorAge s'applique aux sources d'événements de flux telles que Kinesis et DynamoDB Streams, pas aux invocations synchrones depuis API Gateway."
    d:
      en: "DeadLetterErrors counts failures to send asynchronous events to a dead-letter queue; it is unrelated to synchronous throttling."
      fr: "DeadLetterErrors compte les échecs d'envoi d'événements asynchrones vers une file d'attente de lettres mortes ; elle est sans rapport avec la limitation des invocations synchrones."
references:
  - title: Types of metrics for Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-types.html
