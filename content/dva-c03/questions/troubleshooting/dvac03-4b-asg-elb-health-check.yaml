id: dvac03-4b-asg-elb-health-check
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs an application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. Sometimes the application process hangs while the instance keeps running. The load balancer marks the target as unhealthy, but the Auto Scaling group never replaces the instance.

    Which solution will make the Auto Scaling group replace these instances automatically?
  fr: |
    AnyCompany exécute une application sur des instances Amazon EC2 d'un Auto Scaling group derrière un Application Load Balancer. Parfois, le processus de l'application se bloque alors que l'instance continue de s'exécuter. L'équilibreur de charge marque la cible comme non saine, mais l'Auto Scaling group ne remplace jamais l'instance.

    Quelle solution permet à l'Auto Scaling group de remplacer automatiquement ces instances ?
body:
  options:
    - { id: a, text: { en: "Create a CloudWatch alarm on the `StatusCheckFailed_System` metric with the EC2 recover action.", fr: "Créer une alarme CloudWatch sur la métrique `StatusCheckFailed_System` avec l'action de récupération EC2." } }
    - { id: b, text: { en: "Increase the health check grace period of the Auto Scaling group.", fr: "Augmenter la période de grâce de la vérification de l'état de l'Auto Scaling group." } }
    - { id: c, text: { en: "Turn on Elastic Load Balancing health checks for the Auto Scaling group.", fr: "Activer les vérifications de l'état Elastic Load Balancing pour l'Auto Scaling group." } }
    - { id: d, text: { en: "Reduce the deregistration delay of the target group to 0 seconds.", fr: "Réduire le délai de désinscription du groupe cible à 0 seconde." } }
answer: { optionId: c }
explanation:
  correct:
    en: "By default, an Auto Scaling group uses only the EC2 status checks, which pass while the instance is running. When ELB health checks are turned on, an instance that the load balancer reports as unhealthy is marked unhealthy and replaced."
    fr: "Par défaut, un Auto Scaling group n'utilise que les vérifications de statut EC2, qui réussissent tant que l'instance est en cours d'exécution. Quand les vérifications de l'état ELB sont activées, une instance signalée comme non saine par l'équilibreur de charge est marquée non saine et remplacée."
  options:
    a:
      en: "System status checks detect problems of the underlying host, not a hung application process, and recovery does not use the load balancer's view."
      fr: "Les vérifications de statut du système détectent les problèmes de l'hôte sous-jacent, pas un processus d'application bloqué, et la récupération n'utilise pas l'avis de l'équilibreur de charge."
    b:
      en: "A longer grace period only delays health evaluation of new instances; the group still ignores ELB health."
      fr: "Une période de grâce plus longue ne fait que retarder l'évaluation des nouvelles instances ; le groupe ignore toujours l'état ELB."
    d:
      en: "The deregistration delay controls connection draining; it does not make the group replace instances."
      fr: "Le délai de désinscription contrôle le drainage des connexions ; il ne fait pas remplacer les instances par le groupe."
references:
  - title: About the health checks for your Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/health-checks-overview.html
