id: dvac03-4b-asg-target-tracking-cpu
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a CPU-bound web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. The number of concurrent users changes throughout the day without a predictable pattern. The group must add and remove instances automatically to keep the average CPU utilization near 50 percent, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application web gourmande en processeur sur des instances Amazon EC2 d'un Auto Scaling group derrière un Application Load Balancer. Le nombre d'utilisateurs simultanés varie au cours de la journée sans schéma prévisible. Le groupe doit ajouter et retirer des instances automatiquement pour maintenir l'utilisation moyenne du processeur autour de 50 %, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create scheduled actions that change the desired capacity every hour.", fr: "Créer des actions planifiées qui modifient la capacité souhaitée toutes les heures." } }
    - { id: b, text: { en: "Create two CloudWatch alarms on CPU utilization and attach step scaling policies for scale-out and scale-in.", fr: "Créer deux alarmes CloudWatch sur l'utilisation du processeur et y attacher des politiques de mise à l'échelle par étapes pour l'augmentation et la réduction." } }
    - { id: c, text: { en: "Create a target tracking scaling policy on the load balancer's total `RequestCount` metric.", fr: "Créer une politique de suivi de cible sur la métrique `RequestCount` totale de l'équilibreur de charge." } }
    - { id: d, text: { en: "Create a target tracking scaling policy on `ASGAverageCPUUtilization` with a target value of 50.", fr: "Créer une politique de suivi de cible sur `ASGAverageCPUUtilization` avec une valeur cible de 50." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A target tracking policy works like a thermostat: you choose a metric and a target value, and Amazon EC2 Auto Scaling creates and manages the CloudWatch alarms that add or remove instances to keep the metric near the target. `ASGAverageCPUUtilization` is a predefined metric for the group's average CPU."
    fr: "Une politique de suivi de cible fonctionne comme un thermostat : vous choisissez une métrique et une valeur cible, et Amazon EC2 Auto Scaling crée et gère les alarmes CloudWatch qui ajoutent ou retirent des instances pour maintenir la métrique près de la cible. `ASGAverageCPUUtilization` est une métrique prédéfinie pour l'utilisation moyenne du processeur du groupe."
  options:
    a:
      en: "Scheduled actions suit predictable patterns; with unpredictable load, they do not follow actual CPU utilization."
      fr: "Les actions planifiées conviennent aux schémas prévisibles ; avec une charge imprévisible, elles ne suivent pas l'utilisation réelle du processeur."
    b:
      en: "Step scaling works, but you must create and tune the alarms and steps yourself, which target tracking does for you."
      fr: "La mise à l'échelle par étapes fonctionne, mais vous devez créer et ajuster vous-même les alarmes et les paliers, ce que le suivi de cible fait à votre place."
    c:
      en: "The total request count does not change in proportion to the number of instances, so it is not a valid target tracking metric; `ALBRequestCountPerTarget` would be."
      fr: "Le nombre total de requêtes ne varie pas en proportion du nombre d'instances : ce n'est pas une métrique valide pour le suivi de cible, contrairement à `ALBRequestCountPerTarget`."
references:
  - title: Target tracking scaling policies for Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
