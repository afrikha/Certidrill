id: dvac03-4c-sqs-esm-max-concurrency
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function has two Amazon SQS event source mappings: one for a high-volume orders queue and one for a low-volume returns queue. The function writes to an Amazon RDS for MySQL database that can handle about 10 concurrent writers from the orders workload. During order peaks, the function scales out and the database returns too-many-connections errors. The developer must limit the concurrent invocations caused by the orders queue to 10 without limiting the returns queue.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda possède deux mappages de source d'événement Amazon SQS : l'un pour une file d'attente de commandes à fort volume et l'autre pour une file d'attente de retours à faible volume. La fonction écrit dans une base de données Amazon RDS for MySQL capable de gérer environ 10 rédacteurs simultanés pour la charge des commandes. Pendant les pics de commandes, la fonction monte en charge et la base de données renvoie des erreurs de connexions trop nombreuses. Le développeur doit limiter à 10 les invocations simultanées provoquées par la file d'attente des commandes sans limiter la file d'attente des retours.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the reserved concurrency of the function to 10.", fr: "Définir la simultanéité réservée de la fonction à 10." }
    - id: b
      text: { en: "Set the maximum concurrency of the orders event source mapping to 10.", fr: "Définir la simultanéité maximale du mappage de source d'événement des commandes à 10." }
    - id: c
      text: { en: "Set the batch size of the orders event source mapping to 1.", fr: "Définir la taille de lot du mappage de source d'événement des commandes à 1." }
    - id: d
      text: { en: "Configure the orders queue as a delay queue with a 60-second delay.", fr: "Configurer la file d'attente des commandes comme file d'attente à retard avec un délai de 60 secondes." }
answer: { optionId: b }
explanation:
  correct:
    en: "The maximum concurrency setting of an SQS event source mapping caps the number of concurrent function instances that this event source can invoke, and it is set per event source. Setting it to 10 on the orders mapping protects the database and leaves the returns mapping unlimited. The function's reserved concurrency, if any, must be at least the total maximum concurrency of its SQS sources."
    fr: "Le paramètre de simultanéité maximale d'un mappage de source d'événement SQS plafonne le nombre d'instances simultanées de la fonction que cette source d'événement peut invoquer, et il se définit par source d'événement. Le fixer à 10 sur le mappage des commandes protège la base de données et laisse le mappage des retours sans limite. La simultanéité réservée de la fonction, si elle existe, doit être au moins égale au total des simultanéités maximales de ses sources SQS."
  options:
    a:
      en: "Reserved concurrency limits the whole function, so the returns queue would share the same 10 instances, and the pollers can still receive more messages than the function can run, which throttles them."
      fr: "La simultanéité réservée limite toute la fonction : la file d'attente des retours partagerait les mêmes 10 instances, et les processus d'interrogation (pollers) peuvent toujours recevoir plus de messages que la fonction ne peut en exécuter, ce qui les limite."
    c:
      en: "A smaller batch size does not cap concurrency; it creates more invocations and can increase the number of concurrent writers."
      fr: "Une taille de lot plus petite ne plafonne pas la simultanéité ; elle crée plus d'invocations et peut augmenter le nombre de rédacteurs simultanés."
    d:
      en: "A delay queue only postpones the delivery of new messages; once the delay ends, Lambda can still scale out without limit."
      fr: "Une file d'attente à retard reporte seulement la livraison des nouveaux messages ; à la fin du délai, Lambda peut toujours monter en charge sans limite."
references:
  - title: Configuring scaling behavior for SQS event source mappings
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html
