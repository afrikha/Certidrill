id: dvac03-4a-beanstalk-full-logs
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A deployment of a new application version to an AWS Elastic Beanstalk environment fails. The environment events report that the instance deployment failed and refer to eb-engine.log. The last 100 lines of the logs do not show the start of the problem. Log streaming to CloudWatch Logs is not enabled, and the developer needs the complete log files of the instances with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Le déploiement d'une nouvelle version d'application dans un environnement AWS Elastic Beanstalk échoue. Les événements de l'environnement signalent l'échec du déploiement sur l'instance et renvoient vers eb-engine.log. Les 100 dernières lignes des journaux ne montrent pas le début du problème. La diffusion des journaux vers CloudWatch Logs n'est pas activée, et le développeur a besoin des fichiers journaux complets des instances avec le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Request the full logs (bundle logs) of the environment and download the ZIP archive.", fr: "Demander les journaux complets (bundle logs) de l'environnement et télécharger l'archive ZIP." } }
    - { id: b, text: { en: "Enable log streaming to CloudWatch Logs and search the log group for the failed deployment.", fr: "Activer la diffusion des journaux vers CloudWatch Logs et rechercher le déploiement en échec dans le groupe de journaux." } }
    - { id: c, text: { en: "Search AWS CloudTrail for the UpdateEnvironment call of the deployment.", fr: "Rechercher dans AWS CloudTrail l'appel UpdateEnvironment du déploiement." } }
    - { id: d, text: { en: "Enable enhanced health reporting and read the causes on the Health page.", fr: "Activer les rapports d'intégrité améliorés et lire les causes sur la page Santé (Health)." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Tail logs contain only the last 100 lines of the most common logs. Bundle logs contain the full log files, including the Elastic Beanstalk operational logs, packaged in a ZIP archive that is available through a presigned URL for 15 minutes."
    fr: "Les journaux de fin (tail logs) ne contiennent que les 100 dernières lignes des journaux les plus courants. Les journaux complets (bundle logs) contiennent les fichiers journaux entiers, y compris les journaux de fonctionnement d'Elastic Beanstalk, regroupés dans une archive ZIP accessible par une URL présignée pendant 15 minutes."
  options:
    b:
      en: "Streaming starts sending logs only after it is enabled and requires extra configuration, so it is more effort and may miss the content of the earlier failure."
      fr: "La diffusion n'envoie les journaux qu'après son activation et demande une configuration supplémentaire : c'est plus d'effort, et le contenu de l'échec précédent peut manquer."
    c:
      en: "CloudTrail records the API call that started the deployment, not the log files written on the instances."
      fr: "CloudTrail enregistre l'appel d'API qui a lancé le déploiement, pas les fichiers journaux écrits sur les instances."
    d:
      en: "Enhanced health shows health status and causes, not the complete deployment log files."
      fr: "Les rapports d'intégrité améliorés affichent l'état et ses causes, pas les fichiers journaux complets du déploiement."
references:
  - title: Viewing logs from Amazon EC2 instances in your Elastic Beanstalk environment
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.logging.html
