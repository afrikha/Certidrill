id: dvac03-4a-conditional-check-failed
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two worker processes update the same items in an Amazon DynamoDB table. Each item has a numeric version attribute, and the code calls UpdateItem with a condition expression that requires the version to match the value that the worker read earlier and increments it. During load tests, the logs show occasional ConditionalCheckFailedException errors. No update must be lost.

    How should the developer handle these errors?
  fr: |
    Deux processus de travail mettent à jour les mêmes éléments d'une table Amazon DynamoDB. Chaque élément possède un attribut numérique version, et le code appelle UpdateItem avec une expression de condition qui exige que la version corresponde à la valeur lue précédemment par le processus, puis l'incrémente. Pendant les tests de charge, les journaux montrent des erreurs ConditionalCheckFailedException occasionnelles. Aucune mise à jour ne doit être perdue.

    Comment le développeur doit-il traiter ces erreurs ?
body:
  options:
    - { id: a, text: { en: "Increase the write capacity of the table, because the errors indicate throttled writes.", fr: "Augmenter la capacité d'écriture de la table, car les erreurs indiquent des écritures limitées." } }
    - { id: b, text: { en: "Remove the condition expression so that the last writer always succeeds.", fr: "Supprimer l'expression de condition pour que le dernier écrivain réussisse toujours." } }
    - { id: c, text: { en: "Read the item again, reapply the change to the current values, and retry the conditional update.", fr: "Relire l'élément, réappliquer la modification aux valeurs actuelles, puis réessayer la mise à jour conditionnelle." } }
    - { id: d, text: { en: "Switch the earlier read to an eventually consistent read to reduce conflicts.", fr: "Passer la lecture précédente en lecture éventuellement cohérente pour réduire les conflits." } }
answer: { optionId: c }
explanation:
  correct:
    en: "ConditionalCheckFailedException here is the expected result of optimistic locking: another worker changed the item after it was read, so the version no longer matches. The worker must reload the item, reapply its change and retry, which keeps both updates."
    fr: "Ici, ConditionalCheckFailedException est le résultat attendu du verrouillage optimiste : un autre processus a modifié l'élément après sa lecture, donc la version ne correspond plus. Le processus doit recharger l'élément, réappliquer sa modification et réessayer, ce qui conserve les deux mises à jour."
  options:
    a:
      en: "Throttling returns ProvisionedThroughputExceededException or ThrottlingException, not a failed condition; more capacity does not change the version check."
      fr: "La limitation renvoie ProvisionedThroughputExceededException ou ThrottlingException, pas une condition en échec ; plus de capacité ne change rien à la vérification de version."
    b:
      en: "Without the condition, a worker overwrites changes it never read, so updates are lost."
      fr: "Sans la condition, un processus écrase des modifications qu'il n'a jamais lues : des mises à jour sont perdues."
    d:
      en: "An eventually consistent read can return an older version, which makes failed conditions more likely, not less."
      fr: "Une lecture éventuellement cohérente peut renvoyer une version plus ancienne, ce qui rend les conditions en échec plus probables, pas moins."
references:
  - title: DynamoDB and optimistic locking with version number
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DynamoDBMapper.OptimisticLocking.html
