id: dvac03-4c-kiro-code-efficiency
objective: "4.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new development team at AnyCompany has just created its AWS accounts and has no existing subscriptions to AWS developer tools. The team wants an agentic AI development environment that can analyze the AWS Lambda handlers in its repository, explain inefficient code such as Amazon DynamoDB calls made inside loops, and propose code changes.

    Which solution will meet these requirements?
  fr: |
    Une nouvelle équipe de développement d'AnyCompany vient de créer ses comptes AWS et ne dispose d'aucun abonnement existant à des outils de développement AWS. L'équipe veut un environnement de développement d'IA agentique capable d'analyser les gestionnaires AWS Lambda de son référentiel, d'expliquer le code inefficace, comme des appels Amazon DynamoDB effectués dans des boucles, et de proposer des modifications du code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Sign up for Amazon Q Developer and ask its IDE plugin to review the handlers.", fr: "S'inscrire à Amazon Q Developer et demander à son plug-in d'IDE d'examiner les gestionnaires." }
    - id: b
      text: { en: "Open the repository in Kiro and ask the Kiro agent to review the handlers.", fr: "Ouvrir le référentiel dans Kiro et demander à l'agent Kiro d'examiner les gestionnaires." }
    - id: c
      text: { en: "Create an AWS Cloud9 environment and use its AI assistant to review the handlers.", fr: "Créer un environnement AWS Cloud9 et utiliser son assistant d'IA pour examiner les gestionnaires." }
    - id: d
      text: { en: "Associate the repository with Amazon CodeGuru Reviewer to review the handlers.", fr: "Associer le référentiel à Amazon CodeGuru Reviewer pour examiner les gestionnaires." }
answer: { optionId: b }
explanation:
  correct:
    en: "Kiro is an agentic development environment that can chat about the codebase, explain code and build changes step by step, including design documents, code and tests. It is available to new customers and is the successor that AWS names for Amazon Q Developer."
    fr: "Kiro est un environnement de développement agentique qui peut converser à propos du code, expliquer le code et construire des modifications pas à pas, y compris des documents de conception, du code et des tests. Il est disponible pour les nouveaux clients et constitue le successeur désigné par AWS pour Amazon Q Developer."
  options:
    a:
      en: "Amazon Q Developer stopped accepting new sign-ups on May 15, 2026, so a team without an existing subscription cannot start using it."
      fr: "Amazon Q Developer n'accepte plus de nouvelles inscriptions depuis le 15 mai 2026 : une équipe sans abonnement existant ne peut pas commencer à l'utiliser."
    c:
      en: "AWS Cloud9 has been closed to new customers since July 25, 2024."
      fr: "AWS Cloud9 est fermé aux nouveaux clients depuis le 25 juillet 2024."
    d:
      en: "Amazon CodeGuru Reviewer has been in maintenance since October 7, 2025, so new customers cannot onboard."
      fr: "Amazon CodeGuru Reviewer est en maintenance depuis le 7 octobre 2025 : les nouveaux clients ne peuvent pas l'adopter."
references:
  - title: Kiro Documentation
    url: https://aws.amazon.com/documentation-overview/kiro/
  - title: Services in Maintenance
    url: https://docs.aws.amazon.com/general/latest/gr/maintenance_services.html
