id: dvac03-4b-ecs-healthcheck-failure-causes
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer adds the following container health check to an Amazon ECS task definition for a service on AWS Fargate. The application answers `/health` correctly when it is called from another container in the same task. However, the container is always reported as UNHEALTHY and the tasks are replaced.

    ```json
    "healthCheck": {
      "command": ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"],
      "interval": 30,
      "timeout": 5,
      "retries": 3
    }
    ```

    Which two issues could cause this behavior? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur ajoute la vérification de l'état de conteneur suivante à une définition de tâche Amazon ECS pour un service sur AWS Fargate. L'application répond correctement sur `/health` quand elle est appelée depuis un autre conteneur de la même tâche. Pourtant, le conteneur est toujours signalé UNHEALTHY et les tâches sont remplacées.

    ```json
    "healthCheck": {
      "command": ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"],
      "interval": 30,
      "timeout": 5,
      "retries": 3
    }
    ```

    Quels sont les deux problèmes qui pourraient causer ce comportement ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The container image does not include `curl`.", fr: "L'image du conteneur ne contient pas `curl`." } }
    - { id: b, text: { en: "The task's security group does not allow inbound traffic on port 8080.", fr: "Le groupe de sécurité de la tâche n'autorise pas le trafic entrant sur le port 8080." } }
    - { id: c, text: { en: "The `/health` endpoint takes longer than 5 seconds to respond.", fr: "Le point de terminaison `/health` met plus de 5 secondes à répondre." } }
    - { id: d, text: { en: "The task execution role does not allow `ecs:DescribeTasks`.", fr: "Le rôle d'exécution de tâche n'autorise pas `ecs:DescribeTasks`." } }
    - { id: e, text: { en: "The service is not registered with a load balancer target group.", fr: "Le service n'est pas inscrit auprès d'un groupe cible d'équilibreur de charge." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The health check command runs inside the container, so the tools it uses must be in the image; without `curl`, the shell returns a non-zero exit code and every check fails. A check that does not succeed within `timeout` seconds also counts as a failure, so a slow endpoint makes the container UNHEALTHY after the retries."
    fr: "La commande de vérification de l'état s'exécute dans le conteneur : les outils qu'elle utilise doivent se trouver dans l'image. Sans `curl`, le shell renvoie un code de sortie non nul et chaque vérification échoue. Une vérification qui ne réussit pas dans le délai `timeout` compte aussi comme un échec : un point de terminaison lent rend le conteneur UNHEALTHY après les tentatives."
  options:
    b:
      en: "The command calls `localhost` inside the container, so the security group, which filters traffic at the task's network interface, is not involved."
      fr: "La commande appelle `localhost` dans le conteneur : le groupe de sécurité, qui filtre le trafic au niveau de l'interface réseau de la tâche, n'intervient pas."
    d:
      en: "The health check runs a command in the container; it needs no IAM permission."
      fr: "La vérification de l'état exécute une commande dans le conteneur ; elle n'a besoin d'aucune autorisation IAM."
    e:
      en: "Container health checks work without a load balancer."
      fr: "Les vérifications de l'état de conteneur fonctionnent sans équilibreur de charge."
references:
  - title: Determine Amazon ECS task health using container health checks
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/healthcheck.html
  - title: HealthCheck
    url: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_HealthCheck.html
