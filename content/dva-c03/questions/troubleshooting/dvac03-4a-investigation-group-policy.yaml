id: dvac03-4a-investigation-group-policy
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer set up the CloudWatch investigation group of an account with an IAM role that CloudWatch investigations can assume. The developer then added an alarm action to start an investigation, but when the alarm enters the ALARM state, no investigation is created. Investigations that the developer starts manually from the console work.

    Which configuration is missing?
  fr: |
    Un développeur a configuré le groupe d'investigation CloudWatch d'un compte avec un rôle IAM que CloudWatch investigations peut assumer. Il a ensuite ajouté une action d'alarme pour démarrer une investigation, mais lorsque l'alarme passe à l'état ALARM, aucune investigation n'est créée. Les investigations que le développeur démarre manuellement depuis la console fonctionnent.

    Quelle configuration manque-t-il ?
body:
  options:
    - { id: a, text: { en: "A trust policy on the investigation group role that allows the aiops.amazonaws.com service principal to assume it", fr: "Une politique d'approbation sur le rôle du groupe d'investigation qui autorise le principal de service aiops.amazonaws.com à l'assumer" } }
    - { id: b, text: { en: "A resource policy on the investigation group that allows the aiops.alarms.cloudwatch.amazonaws.com service principal to call aiops:CreateInvestigation and aiops:CreateInvestigationEvent", fr: "Une politique de ressource sur le groupe d'investigation qui autorise le principal de service aiops.alarms.cloudwatch.amazonaws.com à appeler aiops:CreateInvestigation et aiops:CreateInvestigationEvent" } }
    - { id: c, text: { en: "The AIOpsConsoleAdminPolicy managed policy attached to the IAM user of the developer", fr: "La politique gérée AIOpsConsoleAdminPolicy attachée à l'utilisateur IAM du développeur" } }
    - { id: d, text: { en: "An Amazon SNS topic selected in the chat client integration section of the investigation group", fr: "Une rubrique Amazon SNS sélectionnée dans la section d'intégration du client de chat du groupe d'investigation" } }
answer: { optionId: b }
explanation:
  correct:
    en: "For an alarm to start investigations, the investigation group needs a resource policy that allows the CloudWatch alarms service principal, aiops.alarms.cloudwatch.amazonaws.com, to perform aiops:CreateInvestigation and aiops:CreateInvestigationEvent, ideally restricted with aws:SourceAccount and aws:SourceArn conditions."
    fr: "Pour qu'une alarme démarre des investigations, le groupe d'investigation a besoin d'une politique de ressource qui autorise le principal de service des alarmes CloudWatch, aiops.alarms.cloudwatch.amazonaws.com, à effectuer aiops:CreateInvestigation et aiops:CreateInvestigationEvent, idéalement restreinte par des conditions aws:SourceAccount et aws:SourceArn."
  options:
    a:
      en: "The role is already assumable by CloudWatch investigations, and manual investigations work; the alarm path needs permission on the investigation group itself."
      fr: "Le rôle peut déjà être assumé par CloudWatch investigations, et les investigations manuelles fonctionnent ; le chemin de l'alarme exige une autorisation sur le groupe d'investigation lui-même."
    c:
      en: "The policy of the developer matters for console use, which already works; it does not let the alarm create investigations."
      fr: "La politique du développeur compte pour l'usage de la console, qui fonctionne déjà ; elle ne permet pas à l'alarme de créer des investigations."
    d:
      en: "The SNS topic sends investigation notifications to Slack or Microsoft Teams; it is optional and does not create investigations."
      fr: "La rubrique SNS envoie les notifications d'investigation vers Slack ou Microsoft Teams ; elle est facultative et ne crée pas d'investigations."
references:
  - title: Start a CloudWatch investigations from an alarm
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Start-Investigation-Alarm.html
  - title: Set up an investigation group
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Investigations-GetStarted-Group.html
