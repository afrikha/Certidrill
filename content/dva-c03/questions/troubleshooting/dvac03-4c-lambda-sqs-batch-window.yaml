id: dvac03-4c-lambda-sqs-batch-window
objective: "4.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function processes messages from an Amazon SQS standard queue through an event source mapping that uses the default batch size of 10 and no batching window. Messages arrive as a steady trickle, so most invocations receive only one or two messages, and the number of invocations is high. The developer wants each invocation to process up to 100 messages. A delay of up to 30 seconds before processing is acceptable.

    Which two changes should the developer make to the event source mapping? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une fonction AWS Lambda traite les messages d'une file d'attente standard Amazon SQS via un mappage de source d'événement qui utilise la taille de lot par défaut de 10 et aucune fenêtre de traitement par lot. Les messages arrivent au compte-gouttes de façon régulière : la plupart des invocations ne reçoivent qu'un ou deux messages, et le nombre d'invocations est élevé. Le développeur veut que chaque invocation traite jusqu'à 100 messages. Un délai de 30 secondes au maximum avant le traitement est acceptable.

    Quelles sont les deux modifications que le développeur doit apporter au mappage de source d'événement ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the ReceiveMessageWaitTimeSeconds attribute of the queue to 20.", fr: "Définir l'attribut ReceiveMessageWaitTimeSeconds de la file d'attente à 20." } }
    - { id: b, text: { en: "Set the batch size of the event source mapping to 100.", fr: "Définir la taille de lot du mappage de source d'événement à 100." } }
    - { id: c, text: { en: "Configure provisioned concurrency on the function.", fr: "Configurer la simultanéité provisionnée sur la fonction." } }
    - { id: d, text: { en: "Set MaximumBatchingWindowInSeconds of the event source mapping to 20.", fr: "Définir MaximumBatchingWindowInSeconds du mappage de source d'événement à 20." } }
    - { id: e, text: { en: "Decrease the visibility timeout of the queue.", fr: "Réduire le délai de visibilité de la file d'attente." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The batch size sets the maximum number of records per invocation, so it must be raised to 100. The batching window makes Lambda gather records for up to the configured time before invoking the function, which fills larger batches when messages trickle in. A batch size over 10 also requires a batching window of at least 1 second, and the window is supported for standard queues."
    fr: "La taille de lot fixe le nombre maximal d'enregistrements par invocation : elle doit donc passer à 100. La fenêtre de traitement par lot fait attendre Lambda jusqu'à la durée configurée pour rassembler des enregistrements avant d'invoquer la fonction, ce qui remplit des lots plus grands quand les messages arrivent au compte-gouttes. Une taille de lot supérieure à 10 exige d'ailleurs une fenêtre d'au moins 1 seconde, et la fenêtre est prise en charge pour les files d'attente standard."
  options:
    a:
      en: "The queue's long-polling setting does not control how many messages the event source mapping groups into one invocation."
      fr: "Le paramètre d'interrogation longue (long polling) de la file d'attente ne contrôle pas combien de messages le mappage de source d'événement regroupe dans une invocation."
    c:
      en: "Provisioned concurrency reduces cold starts; it does not change the number of messages in each batch."
      fr: "La simultanéité provisionnée réduit les démarrages à froid ; elle ne change pas le nombre de messages de chaque lot."
    e:
      en: "A shorter visibility timeout can cause duplicate processing and has no effect on batch size; AWS recommends a visibility timeout of at least six times the function timeout."
      fr: "Un délai de visibilité plus court peut provoquer des traitements en double et n'a aucun effet sur la taille des lots ; AWS recommande un délai de visibilité d'au moins six fois le délai d'expiration de la fonction."
references:
  - title: Creating and configuring an Amazon SQS event source mapping
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
