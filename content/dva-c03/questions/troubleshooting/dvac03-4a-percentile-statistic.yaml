id: dvac03-4a-percentile-statistic
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CloudWatch dashboard shows the Average statistic of the Duration metric of an AWS Lambda function at about 120 ms, which meets the target of the team. However, some users report requests that take several seconds. The developer needs a statistic that shows how slow the slowest requests are, without being hidden by the many fast requests.

    Which statistic should the developer display?
  fr: |
    Un tableau de bord CloudWatch affiche la statistique Average de la métrique Duration d'une fonction AWS Lambda à environ 120 ms, ce qui respecte l'objectif de l'équipe. Pourtant, certains utilisateurs signalent des requêtes qui prennent plusieurs secondes. Le développeur a besoin d'une statistique qui montre la lenteur des requêtes les plus lentes, sans qu'elle soit masquée par les nombreuses requêtes rapides.

    Quelle statistique le développeur doit-il afficher ?
body:
  options:
    - { id: a, text: "Sum" }
    - { id: b, text: "SampleCount" }
    - { id: c, text: "Minimum" }
    - { id: d, text: "p99" }
answer: { optionId: d }
explanation:
  correct:
    en: "Duration supports percentile statistics. The p99 statistic shows the duration that 99 % of invocations do not exceed, so it reveals the tail latency that an average hides."
    fr: "Duration prend en charge les statistiques de centile. La statistique p99 indique la durée que 99 % des appels ne dépassent pas : elle révèle la latence de queue qu'une moyenne masque."
  options:
    a:
      en: "Sum adds all durations together and grows with traffic; it does not isolate slow requests."
      fr: "Sum additionne toutes les durées et augmente avec le trafic ; elle n'isole pas les requêtes lentes."
    b:
      en: "SampleCount is the number of data points, not a duration."
      fr: "SampleCount est le nombre de points de données, pas une durée."
    c:
      en: "Minimum shows the fastest invocation, which is the opposite of what is needed."
      fr: "Minimum montre l'appel le plus rapide, soit l'inverse de ce qui est demandé."
references:
  - title: Types of metrics for Lambda functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-types.html
