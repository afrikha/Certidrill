id: dvac03-4a-report-lines-cold-start
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Users report that the first request to an API after a quiet period is slow, while later requests are fast. The CloudWatch log group of the AWS Lambda function behind the API contains the following REPORT lines (request IDs shortened).

    ```text
    REPORT RequestId: 1a2b Duration: 41.20 ms Billed Duration: 42 ms Memory Size: 1024 MB Max Memory Used: 182 MB Init Duration: 1210.55 ms
    REPORT RequestId: 3c4d Duration: 35.87 ms Billed Duration: 36 ms Memory Size: 1024 MB Max Memory Used: 183 MB
    REPORT RequestId: 5e6f Duration: 37.02 ms Billed Duration: 38 ms Memory Size: 1024 MB Max Memory Used: 183 MB
    ```

    Which two conclusions are supported by these log lines? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Des utilisateurs signalent que la première requête vers une API après une période calme est lente, alors que les suivantes sont rapides. Le groupe de journaux CloudWatch de la fonction AWS Lambda derrière l'API contient les lignes REPORT suivantes (ID de requête raccourcis).

    ```text
    REPORT RequestId: 1a2b Duration: 41.20 ms Billed Duration: 42 ms Memory Size: 1024 MB Max Memory Used: 182 MB Init Duration: 1210.55 ms
    REPORT RequestId: 3c4d Duration: 35.87 ms Billed Duration: 36 ms Memory Size: 1024 MB Max Memory Used: 183 MB
    REPORT RequestId: 5e6f Duration: 37.02 ms Billed Duration: 38 ms Memory Size: 1024 MB Max Memory Used: 183 MB
    ```

    Quelles sont les deux conclusions étayées par ces lignes de journal ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The first request was served by a new execution environment that spent about 1.2 seconds loading the function and running code outside the handler.", fr: "La première requête a été servie par un nouvel environnement d'exécution qui a passé environ 1,2 seconde à charger la fonction et à exécuter le code hors du gestionnaire." } }
    - { id: b, text: { en: "The handler itself takes more than one second on every request.", fr: "Le gestionnaire lui-même prend plus d'une seconde à chaque requête." } }
    - { id: c, text: { en: "The function was throttled before the first request was accepted.", fr: "La fonction a été limitée avant l'acceptation de la première requête." } }
    - { id: d, text: { en: "The function uses less than a fifth of the memory that is configured for it.", fr: "La fonction utilise moins d'un cinquième de la mémoire qui lui est configurée." } }
    - { id: e, text: { en: "The first request nearly reached the configured timeout of the function.", fr: "La première requête a presque atteint le délai d'expiration configuré de la fonction." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Init Duration appears only for the first request that an execution environment serves and measures the time to load the function and run the code outside the handler, which explains the slow first request. Max Memory Used is about 183 MB out of 1,024 MB configured, so less than a fifth of the memory is used."
    fr: "Init Duration n'apparaît que pour la première requête servie par un environnement d'exécution et mesure le temps de chargement de la fonction et d'exécution du code hors du gestionnaire, ce qui explique la lenteur de la première requête. Max Memory Used est d'environ 183 Mo sur 1 024 Mo configurés : moins d'un cinquième de la mémoire est utilisé."
  options:
    b:
      en: "Duration, the time spent in the handler, is about 35 to 41 ms for every request."
      fr: "Duration, le temps passé dans le gestionnaire, est d'environ 35 à 41 ms pour chaque requête."
    c:
      en: "A throttled request is rejected and produces no REPORT line; all three requests ran."
      fr: "Une requête limitée est rejetée et ne produit aucune ligne REPORT ; les trois requêtes se sont exécutées."
    e:
      en: "Nothing in the REPORT lines shows the configured timeout, and the handler ran for only 41 ms."
      fr: "Rien dans les lignes REPORT n'indique le délai d'expiration configuré, et le gestionnaire n'a duré que 41 ms."
references:
  - title: Log and monitor Python Lambda functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/python-logging.html
