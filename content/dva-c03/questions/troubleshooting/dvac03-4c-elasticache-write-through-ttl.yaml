id: dvac03-4c-elasticache-write-through-ttl
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores its product catalog in an Amazon Aurora MySQL database and caches products in Amazon ElastiCache with a lazy loading strategy and a TTL of 1 hour. After a price update, customers can see the old price for up to 1 hour. The company requires that reads after an update return the new price. The memory used by products that are rarely read must also stay limited.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke son catalogue de produits dans une base de données Amazon Aurora MySQL et met les produits en cache dans Amazon ElastiCache avec une stratégie de chargement différé (lazy loading) et une durée de vie (TTL) de 1 heure. Après une mise à jour de prix, les clients peuvent voir l'ancien prix pendant 1 heure au maximum. L'entreprise exige que les lectures qui suivent une mise à jour renvoient le nouveau prix. La mémoire utilisée par les produits rarement lus doit aussi rester limitée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep lazy loading and reduce the TTL of the cached products to 5 minutes.", fr: "Conserver le chargement différé et réduire la TTL des produits en cache à 5 minutes." }
    - id: b
      text: { en: "Write each updated product to the cache when it is written to the database, with no TTL on the keys.", fr: "Écrire chaque produit mis à jour dans le cache lors de son écriture en base de données, sans TTL sur les clés." }
    - id: c
      text: { en: "Replace ElastiCache with a DynamoDB Accelerator (DAX) cluster in front of the database.", fr: "Remplacer ElastiCache par un cluster DynamoDB Accelerator (DAX) devant la base de données." }
    - id: d
      text: { en: "Write each updated product to the cache when it is written to the database, and keep a TTL on every key.", fr: "Écrire chaque produit mis à jour dans le cache lors de son écriture en base de données, et conserver une TTL sur chaque clé." }
answer: { optionId: d }
explanation:
  correct:
    en: "With write-through, the application updates the cache whenever it writes to the database, so the cached price is always current. Write-through alone fills the cache with data that is rarely read (cache churn); adding a TTL makes unused keys expire, and lazy loading can still repopulate expired keys on a miss."
    fr: "Avec l'écriture simultanée (write-through), l'application met à jour le cache à chaque écriture en base de données : le prix en cache est donc toujours à jour. L'écriture simultanée seule remplit le cache de données rarement lues (renouvellement inutile du cache) ; ajouter une TTL fait expirer les clés inutilisées, et le chargement différé peut toujours recharger les clés expirées en cas d'échec d'accès au cache."
  options:
    a:
      en: "A shorter TTL reduces staleness but customers can still see the old price for up to 5 minutes after an update."
      fr: "Une TTL plus courte réduit l'obsolescence, mais les clients peuvent toujours voir l'ancien prix pendant 5 minutes au maximum après une mise à jour."
    b:
      en: "Without a TTL, every written product stays in memory even if it is never read, so the memory used by rarely read products is not limited."
      fr: "Sans TTL, chaque produit écrit reste en mémoire même s'il n'est jamais lu : la mémoire utilisée par les produits rarement lus n'est donc pas limitée."
    c:
      en: "DAX is a cache for Amazon DynamoDB tables only; it cannot cache an Aurora MySQL database."
      fr: "DAX est un cache réservé aux tables Amazon DynamoDB ; il ne peut pas mettre en cache une base de données Aurora MySQL."
references:
  - title: Caching strategies for Memcached
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
