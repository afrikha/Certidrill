id: dvac03-4a-query-results-summary
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During an incident, a CloudWatch Logs Insights query returns several thousand error events from an API. The on-call developer wants a concise, human-readable explanation of what the results show, with suggested next steps, directly in the Logs Insights console.

    Which feature should the developer use?
  fr: |
    Pendant un incident, une requête CloudWatch Logs Insights renvoie plusieurs milliers d'événements d'erreur d'une API. Le développeur d'astreinte veut une explication concise et lisible de ce que montrent les résultats, avec des pistes d'action, directement dans la console Logs Insights.

    Quelle fonctionnalité le développeur doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "Summarize results, after the query completes", fr: "Summarize results, une fois la requête terminée" } }
    - { id: b, text: { en: "The compare feature, against the previous time range", fr: "La fonctionnalité de comparaison avec la plage de temps précédente" } }
    - { id: c, text: { en: "A saved query with parameters", fr: "Une requête enregistrée avec des paramètres" } }
    - { id: d, text: { en: "A field index on the error code field", fr: "Un index de champ sur le champ du code d'erreur" } }
answer: { optionId: a }
explanation:
  correct:
    en: "After a query completes, Summarize results uses Amazon Bedrock to turn the query results into a concise natural language summary with actionable insights. The query results are not used to train or improve CloudWatch Logs Insights or Amazon Bedrock."
    fr: "Une fois la requête terminée, Summarize results utilise Amazon Bedrock pour transformer les résultats en un résumé concis en langage naturel, avec des informations exploitables. Les résultats de requête ne servent pas à entraîner ni à améliorer CloudWatch Logs Insights ou Amazon Bedrock."
  options:
    b:
      en: "Comparison shows how log patterns changed between two time ranges; it does not write an explanation of the results."
      fr: "La comparaison montre l'évolution des modèles de journaux entre deux plages de temps ; elle ne rédige pas d'explication des résultats."
    c:
      en: "A saved query makes the query reusable; it does not interpret the results."
      fr: "Une requête enregistrée rend la requête réutilisable ; elle n'interprète pas les résultats."
    d:
      en: "Field indexes reduce the data scanned and speed up queries; they do not explain results."
      fr: "Les index de champ réduisent les données analysées et accélèrent les requêtes ; ils n'expliquent pas les résultats."
references:
  - title: Generate a natural language summary from CloudWatch Logs Insights query results
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs-Insights-Query-Results-Summary.html
