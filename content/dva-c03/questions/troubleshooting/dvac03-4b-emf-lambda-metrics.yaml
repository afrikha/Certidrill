id: dvac03-4b-emf-lambda-metrics
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AnyCompany AWS Lambda function handles thousands of requests each minute. It calls `PutMetricData` synchronously in every invocation to publish custom metrics, which adds latency and API cost. The developers often add new metrics and must not have to change any CloudWatch configuration when they do. Each metric data point must stay linked to the log event of the invocation that produced it.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda d'AnyCompany traite des milliers de requêtes par minute. Elle appelle `PutMetricData` de façon synchrone à chaque appel pour publier des métriques personnalisées, ce qui ajoute de la latence et un coût d'API. Les développeurs ajoutent souvent de nouvelles métriques et ne doivent alors modifier aucune configuration CloudWatch. Chaque point de données de métrique doit rester lié à l'événement de journal de l'appel qui l'a produit.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Write each metric to standard output in the CloudWatch embedded metric format, and remove the `PutMetricData` calls.", fr: "Écrire chaque métrique sur la sortie standard au format de métrique intégrée (EMF) de CloudWatch, et supprimer les appels `PutMetricData`." } }
    - { id: b, text: { en: "Log each value as plain text, and create one metric filter for each metric on the log group of the function.", fr: "Journaliser chaque valeur en texte brut, et créer un filtre de métrique pour chaque métrique sur le groupe de journaux de la fonction." } }
    - { id: c, text: { en: "Keep the `PutMetricData` calls, and publish statistic sets instead of single values in each invocation.", fr: "Conserver les appels `PutMetricData`, et publier des ensembles de statistiques au lieu de valeurs uniques à chaque appel." } }
    - { id: d, text: { en: "Send the values from the function code to a CloudWatch agent over the StatsD protocol on UDP port 8125.", fr: "Envoyer les valeurs depuis le code de la fonction à un agent CloudWatch via le protocole StatsD sur le port UDP 8125." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With the embedded metric format, the function writes structured JSON log events and CloudWatch extracts the metrics asynchronously, so no metrics API call is made during the invocation. The metric definitions travel in each log event, so new metrics need no CloudWatch configuration, and the detailed event stays queryable in Logs Insights."
    fr: "Avec le format de métrique intégrée, la fonction écrit des événements de journal JSON structurés et CloudWatch en extrait les métriques de façon asynchrone : aucun appel d'API de métriques n'a lieu pendant l'appel de la fonction. Les définitions de métriques voyagent dans chaque événement, donc les nouvelles métriques ne demandent aucune configuration CloudWatch, et l'événement détaillé reste interrogeable dans Logs Insights."
  options:
    b:
      en: "Metric filters avoid API calls, but each new metric needs a new filter, which is a CloudWatch configuration change."
      fr: "Les filtres de métrique évitent les appels d'API, mais chaque nouvelle métrique demande un nouveau filtre, ce qui est une modification de la configuration CloudWatch."
    c:
      en: "Statistic sets reduce the number of data points, but the function still makes a synchronous API call in every invocation."
      fr: "Les ensembles de statistiques réduisent le nombre de points de données, mais la fonction fait toujours un appel d'API synchrone à chaque appel."
    d:
      en: "No CloudWatch agent runs in the Lambda execution environment to receive StatsD packets."
      fr: "Aucun agent CloudWatch ne s'exécute dans l'environnement d'exécution Lambda pour recevoir des paquets StatsD."
references:
  - title: Embedding metrics within logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Embedded_Metric_Format.html
