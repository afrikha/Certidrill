id: dvac03-4b-statsd-cloudwatch-agent
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany moves an application to Amazon EC2 Linux instances. The application already sends counters and timers with a StatsD client library. The team wants these metrics in Amazon CloudWatch without changing the application code and with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany migre une application vers des instances Amazon EC2 Linux. L'application envoie déjà des compteurs et des minuteurs avec une bibliothèque cliente StatsD. L'équipe veut ces métriques dans Amazon CloudWatch sans modifier le code de l'application et avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Replace the StatsD client with calls to `PutMetricData` in the application.", fr: "Remplacer le client StatsD par des appels à `PutMetricData` dans l'application." } }
    - { id: b, text: { en: "Turn on detailed monitoring for the instances so that metrics are sent to CloudWatch every minute.", fr: "Activer la surveillance détaillée des instances pour que les métriques soient envoyées à CloudWatch chaque minute." } }
    - { id: c, text: { en: "Write the metrics to a log file and create metric filters on the log group.", fr: "Écrire les métriques dans un fichier journal et créer des filtres de métrique sur le groupe de journaux." } }
    - { id: d, text: { en: "Install the CloudWatch agent with a `statsd` section in the `metrics_collected` part of its configuration.", fr: "Installer l'agent CloudWatch avec une section `statsd` dans la partie `metrics_collected` de sa configuration." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The CloudWatch agent can receive StatsD metrics over UDP, on port 8125 by default, aggregate them and publish them to CloudWatch, in the `CWAgent` namespace unless configured otherwise. The application keeps sending to its StatsD endpoint unchanged."
    fr: "L'agent CloudWatch peut recevoir des métriques StatsD via UDP, sur le port 8125 par défaut, les agréger et les publier dans CloudWatch, dans l'espace de noms `CWAgent` sauf configuration contraire. L'application continue d'envoyer vers son point de terminaison StatsD sans modification."
  options:
    a:
      en: "Replacing the client library is a code change."
      fr: "Remplacer la bibliothèque cliente est une modification du code."
    b:
      en: "Detailed monitoring sends the EC2 metrics every minute; it does not collect application metrics."
      fr: "La surveillance détaillée envoie les métriques EC2 chaque minute ; elle ne collecte pas les métriques de l'application."
    c:
      en: "Writing the metrics to a file needs a code change, and metric filters add configuration for every metric."
      fr: "Écrire les métriques dans un fichier exige une modification du code, et les filtres de métrique ajoutent une configuration pour chaque métrique."
references:
  - title: Retrieve custom metrics with StatsD
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-custom-metrics-statsd.html
