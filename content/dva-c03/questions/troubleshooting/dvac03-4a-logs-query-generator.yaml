id: dvac03-4a-logs-query-generator
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer who is new to CloudWatch Logs Insights must find the 10 slowest requests in the log group of an application during an incident. The developer does not know the query syntax and wants to describe the need in plain English, then understand each line of the query that is produced.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Un développeur qui découvre CloudWatch Logs Insights doit trouver les 10 requêtes les plus lentes dans le groupe de journaux d'une application pendant un incident. Il ne connaît pas la syntaxe des requêtes et veut décrire son besoin en anglais courant, puis comprendre chaque ligne de la requête produite.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Append the pattern command to a query and read the Patterns tab.", fr: "Ajouter la commande pattern à une requête et lire l'onglet Modèles (Patterns)." } }
    - { id: b, text: { en: "Create a log anomaly detector on the log group and review the anomalies.", fr: "Créer un détecteur d'anomalies de journaux sur le groupe de journaux et examiner les anomalies." } }
    - { id: c, text: { en: "Use the query generator in the Logs Insights query editor with a natural language prompt.", fr: "Utiliser le générateur de requêtes de l'éditeur Logs Insights avec une invite en langage naturel." } }
    - { id: d, text: { en: "Export the log group to Amazon S3 and query the files with Amazon Athena.", fr: "Exporter le groupe de journaux vers Amazon S3 et interroger les fichiers avec Amazon Athena." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Logs Insights query generator turns a plain English prompt, such as \"Find the 10 slowest requests\", into a query and explains how each line of the query works. The developer can refine the prompt and choose Update query without learning the syntax first."
    fr: "Le générateur de requêtes de Logs Insights transforme une invite en anglais courant, comme « Find the 10 slowest requests », en requête et explique le fonctionnement de chaque ligne. Le développeur peut affiner l'invite et choisir Update query sans apprendre d'abord la syntaxe."
  options:
    a:
      en: "The pattern command groups events into recurring text patterns; it does not build a query from a description or sort requests by duration."
      fr: "La commande pattern regroupe les événements en modèles de texte récurrents ; elle ne construit pas de requête à partir d'une description et ne trie pas les requêtes par durée."
    b:
      en: "An anomaly detector trains on past events and flags unusual patterns; it does not answer an ad hoc question about the slowest requests."
      fr: "Un détecteur d'anomalies s'entraîne sur les événements passés et signale des modèles inhabituels ; il ne répond pas à une question ponctuelle sur les requêtes les plus lentes."
    d:
      en: "An export and Athena tables add work during an incident, and the developer would still have to write SQL."
      fr: "Une exportation et des tables Athena ajoutent du travail pendant un incident, et le développeur devrait quand même écrire du SQL."
references:
  - title: Use natural language to generate and update CloudWatch Logs Insights queries
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs-Insights-Query-Assist.html
