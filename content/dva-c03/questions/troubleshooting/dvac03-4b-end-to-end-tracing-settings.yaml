id: dvac03-4b-end-to-end-tracing-settings
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AnyCompany Amazon API Gateway REST API starts an AWS Step Functions Express workflow, which invokes AWS Lambda functions. Active tracing is already turned on for the functions. The developers want one end-to-end trace in AWS X-Ray that includes API Gateway, the state machine and the functions.

    Which combination of steps will meet these requirements? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une API REST Amazon API Gateway d'AnyCompany démarre un flux de travail AWS Step Functions Express, qui appelle des fonctions AWS Lambda. Le traçage actif est déjà activé pour les fonctions. Les développeurs veulent une trace de bout en bout dans AWS X-Ray qui inclut API Gateway, la machine d'état et les fonctions.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on X-Ray tracing on the API stage.", fr: "Activer le traçage X-Ray sur l'étape de l'API." } }
    - { id: b, text: { en: "Set the tracing mode of the functions to PassThrough.", fr: "Définir le mode de traçage des fonctions sur PassThrough." } }
    - { id: c, text: { en: "Turn on X-Ray tracing for the state machine and allow `xray:PutTraceSegments` and `xray:PutTelemetryRecords` in its role.", fr: "Activer le traçage X-Ray pour la machine d'état et autoriser `xray:PutTraceSegments` et `xray:PutTelemetryRecords` dans son rôle." } }
    - { id: d, text: { en: "Set the logging level of the state machine to ALL with execution data included.", fr: "Définir le niveau de journalisation de la machine d'état sur ALL avec les données d'exécution incluses." } }
    - { id: e, text: { en: "Create an X-Ray group with a filter expression for the API.", fr: "Créer un groupe X-Ray avec une expression de filtre pour l'API." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "API Gateway records segments when X-Ray tracing is turned on for the stage, and it passes the trace header to the workflow. A state machine with X-Ray tracing turned on, whose role can call `xray:PutTraceSegments` and `xray:PutTelemetryRecords`, adds its own segments to the same trace before the traced Lambda functions."
    fr: "API Gateway enregistre des segments quand le traçage X-Ray est activé pour l'étape, et transmet l'en-tête de trace au flux de travail. Une machine d'état avec le traçage X-Ray activé, dont le rôle peut appeler `xray:PutTraceSegments` et `xray:PutTelemetryRecords`, ajoute ses propres segments à la même trace avant les fonctions Lambda tracées."
  options:
    b:
      en: "PassThrough only forwards the header and stops Lambda from sending the function segments that are already recorded."
      fr: "PassThrough ne fait que transmettre l'en-tête et empêche Lambda d'envoyer les segments de fonction déjà enregistrés."
    d:
      en: "Logging sends execution history to CloudWatch Logs; it does not add the state machine to the trace."
      fr: "La journalisation envoie l'historique d'exécution vers CloudWatch Logs ; elle n'ajoute pas la machine d'état à la trace."
    e:
      en: "A group filters traces that are already recorded; it does not record any new segment."
      fr: "Un groupe filtre des traces déjà enregistrées ; il n'enregistre aucun nouveau segment."
references:
  - title: Trace Step Functions request data in AWS X-Ray
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-xray-tracing.html
  - title: Trace user requests to REST APIs using X-Ray in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-xray.html
