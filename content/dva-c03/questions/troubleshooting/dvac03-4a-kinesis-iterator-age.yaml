id: dvac03-4a-kinesis-iterator-age
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function consumes an Amazon Kinesis data stream through an event source mapping. Over the last two hours, the Maximum statistic of the IteratorAge metric of the function has grown steadily from a few seconds to more than 40 minutes, while the Errors metric stays at 0.

    What does this trend indicate?
  fr: |
    Une fonction AWS Lambda consomme un flux de données Amazon Kinesis via un mappage de source d'événement. Au cours des deux dernières heures, la statistique Maximum de la métrique IteratorAge de la fonction est passée progressivement de quelques secondes à plus de 40 minutes, tandis que la métrique Errors reste à 0.

    Qu'indique cette tendance ?
body:
  options:
    - { id: a, text: { en: "The function takes more than 40 minutes to process each batch of records.", fr: "La fonction met plus de 40 minutes à traiter chaque lot d'enregistrements." } }
    - { id: b, text: { en: "The stream retention period is about to expire for all the records in the stream.", fr: "La période de conservation du flux est sur le point d'expirer pour tous les enregistrements du flux." } }
    - { id: c, text: { en: "The function is falling behind: records wait longer and longer in the stream before they are sent to the function.", fr: "La fonction prend du retard : les enregistrements attendent de plus en plus longtemps dans le flux avant d'être envoyés à la fonction." } }
    - { id: d, text: { en: "The event source mapping is sending each record to the function several times.", fr: "Le mappage de source d'événement envoie chaque enregistrement plusieurs fois à la fonction." } }
answer: { optionId: c }
explanation:
  correct:
    en: "IteratorAge measures the time between when the stream receives a record and when the event source mapping sends it to the function. A steadily growing value with no errors means that records arrive faster than the function processes them, so the backlog grows."
    fr: "IteratorAge mesure le temps entre la réception d'un enregistrement par le flux et son envoi à la fonction par le mappage de source d'événement. Une valeur en hausse constante sans erreur signifie que les enregistrements arrivent plus vite que la fonction ne les traite : l'arriéré augmente."
  options:
    a:
      en: "Processing time is measured by the Duration metric; IteratorAge measures how long records wait before they are sent to the function."
      fr: "Le temps de traitement est mesuré par la métrique Duration ; IteratorAge mesure l'attente des enregistrements avant leur envoi à la fonction."
    b:
      en: "IteratorAge shows the age of the last record sent to the function; it does not show that all records are near expiry, although a long backlog can eventually reach the retention limit."
      fr: "IteratorAge indique l'âge du dernier enregistrement envoyé à la fonction ; il ne montre pas que tous les enregistrements sont près d'expirer, même si un arriéré prolongé peut finir par atteindre la limite de conservation."
    d:
      en: "Repeated deliveries come from retries after function errors, and Errors stays at 0 here."
      fr: "Les livraisons répétées proviennent de nouvelles tentatives après des erreurs de fonction, et Errors reste à 0 ici."
references:
  - title: Types of metrics for Lambda functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-types.html
