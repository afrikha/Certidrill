id: dvac03-4b-provisioned-concurrency-alias-target
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer publishes version 7 of an AWS Lambda function, creates an alias named `prod` that points to it, and configures provisioned concurrency of 100 on the `prod` alias. The provisioned environments never process requests, and users still experience cold starts. The Amazon API Gateway integration uses the function ARN without a qualifier.

    Which solution will make requests use the provisioned concurrency?
  fr: |
    Un développeur publie la version 7 d'une fonction AWS Lambda, crée un alias nommé `prod` qui pointe vers elle et configure une simultanéité provisionnée de 100 sur l'alias `prod`. Les environnements provisionnés ne traitent jamais de requêtes, et les utilisateurs subissent toujours des démarrages à froid. L'intégration Amazon API Gateway utilise l'ARN de la fonction sans qualificateur.

    Quelle solution permet aux requêtes d'utiliser la simultanéité provisionnée ?
body:
  options:
    - { id: a, text: { en: "Configure provisioned concurrency on `$LATEST` instead of the alias.", fr: "Configurer la simultanéité provisionnée sur `$LATEST` au lieu de l'alias." } }
    - { id: b, text: { en: "Set the reserved concurrency of the function to 100.", fr: "Définir la simultanéité réservée de la fonction sur 100." } }
    - { id: c, text: { en: "Change the API Gateway integration to invoke the `prod` alias ARN.", fr: "Modifier l'intégration API Gateway pour appeler l'ARN de l'alias `prod`." } }
    - { id: d, text: { en: "Publish version 8 and update the `prod` alias to point to it.", fr: "Publier la version 8 et mettre à jour l'alias `prod` pour qu'il pointe vers elle." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Provisioned concurrency applies to the version or alias on which it is configured. An unqualified ARN invokes `$LATEST`, so the requests never reach the pre-initialized environments of `prod`; the event source must invoke the alias."
    fr: "La simultanéité provisionnée s'applique à la version ou à l'alias sur lequel elle est configurée. Un ARN non qualifié appelle `$LATEST` : les requêtes n'atteignent jamais les environnements préinitialisés de `prod`. La source d'événements doit appeler l'alias."
  options:
    a:
      en: "Provisioned concurrency cannot be configured on `$LATEST`."
      fr: "La simultanéité provisionnée ne peut pas être configurée sur `$LATEST`."
    b:
      en: "Reserved concurrency limits and guarantees capacity, but the requests still go to `$LATEST` with on-demand environments."
      fr: "La simultanéité réservée limite et garantit la capacité, mais les requêtes vont toujours vers `$LATEST` avec des environnements à la demande."
    d:
      en: "A new version changes what the alias points to, but API Gateway still bypasses the alias."
      fr: "Une nouvelle version change la cible de l'alias, mais API Gateway contourne toujours l'alias."
references:
  - title: Configuring provisioned concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
