id: dvac03-4b-provisioned-concurrency-schedule
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AnyCompany AWS Lambda function needs provisioned concurrency of 200 on its `live` alias from 08:00 to 20:00 on weekdays. Outside these hours, traffic is very low and provisioned concurrency must be reduced to 5 to save costs. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda d'AnyCompany a besoin d'une simultanéité provisionnée de 200 sur son alias `live` de 08:00 à 20:00 les jours ouvrés. En dehors de ces heures, le trafic est très faible et la simultanéité provisionnée doit être réduite à 5 pour économiser. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Register the alias as an Application Auto Scaling scalable target for `lambda:function:ProvisionedConcurrency` and create two scheduled actions.", fr: "Inscrire l'alias comme cible extensible Application Auto Scaling pour `lambda:function:ProvisionedConcurrency` et créer deux actions planifiées." } }
    - { id: b, text: { en: "Create two Amazon EventBridge Scheduler schedules that invoke a custom Lambda function, which calls `PutProvisionedConcurrencyConfig` with 200 or 5.", fr: "Créer deux planifications Amazon EventBridge Scheduler qui appellent une fonction Lambda personnalisée, laquelle appelle `PutProvisionedConcurrencyConfig` avec 200 ou 5." } }
    - { id: c, text: { en: "Create a target tracking policy on `LambdaProvisionedConcurrencyUtilization` with a target value of 0.7 and a minimum capacity of 5.", fr: "Créer une politique de suivi de cible sur `LambdaProvisionedConcurrencyUtilization` avec une valeur cible de 0,7 et une capacité minimale de 5." } }
    - { id: d, text: { en: "Set the reserved concurrency of the function to 200 during business hours and to 5 at night.", fr: "Définir la simultanéité réservée de la fonction sur 200 pendant les heures de bureau et sur 5 la nuit." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Application Auto Scaling can manage the provisioned concurrency of an alias or version. Scheduled scaling is the recommended choice for predictable traffic: one scheduled action raises the capacity to 200 before 08:00 and another lowers it to 5 at 20:00, with no code to maintain."
    fr: "Application Auto Scaling peut gérer la simultanéité provisionnée d'un alias ou d'une version. La mise à l'échelle planifiée est le choix recommandé pour un trafic prévisible : une action planifiée porte la capacité à 200 avant 08:00 et une autre la ramène à 5 à 20:00, sans code à maintenir."
  options:
    b:
      en: "This works, but it adds a custom function, its permissions and its error handling to maintain."
      fr: "Cela fonctionne, mais ajoute une fonction personnalisée, ses autorisations et sa gestion des erreurs à maintenir."
    c:
      en: "Target tracking reacts to utilization after load has persisted for minutes, so capacity is not in place at 08:00 and the morning ramp-up still hits cold starts."
      fr: "Le suivi de cible réagit à l'utilisation après plusieurs minutes de charge soutenue : la capacité n'est pas en place à 08:00 et la montée en charge du matin subit toujours des démarrages à froid."
    d:
      en: "Reserved concurrency caps the function but does not pre-initialize environments, and a cap of 5 at night would throttle requests."
      fr: "La simultanéité réservée plafonne la fonction sans initialiser d'environnements à l'avance, et un plafond de 5 la nuit limiterait les requêtes."
references:
  - title: Configuring provisioned concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
