id: dvac03-4a-beanstalk-ai-analysis
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After a configuration change, an AWS Elastic Beanstalk environment on a recent Amazon Linux 2023 platform version reports a Degraded health status. A developer wants an AI-generated explanation of the root cause and recommended next steps, based on the recent events, health information and logs of the environment, with the LEAST effort. The developer uses the EB CLI 3.27.

    Which solution will meet these requirements?
  fr: |
    Après une modification de configuration, un environnement AWS Elastic Beanstalk sur une version récente de plateforme Amazon Linux 2023 signale un état d'intégrité Degraded. Un développeur veut une explication générée par IA de la cause racine et des actions recommandées, à partir des événements récents, des informations d'intégrité et des journaux de l'environnement, avec le MOINS d'effort. Le développeur utilise l'EB CLI 3.27.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run `eb logs --all` and paste the logs into the Amazon Bedrock playground.", fr: "Exécuter `eb logs --all` et coller les journaux dans le terrain de jeu (playground) d'Amazon Bedrock." } }
    - { id: b, text: { en: "Run `eb health --refresh` and review the causes reported for each instance.", fr: "Exécuter `eb health --refresh` et examiner les causes signalées pour chaque instance." } }
    - { id: c, text: { en: "Run `eb logs --analyze` and review the returned results.", fr: "Exécuter `eb logs --analyze` et examiner les résultats renvoyés." } }
    - { id: d, text: { en: "Run `eb events --follow` and review the environment events.", fr: "Exécuter `eb events --follow` et examiner les événements de l'environnement." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Elastic Beanstalk AI-powered environment analysis collects recent events, health information and logs, sends them to Amazon Bedrock and returns the likely root causes with recommended solutions. It can be requested with the AI Analysis button in the console, with request-environment-info using the analyze info type, or with eb logs --analyze in EB CLI 3.27 or later."
    fr: "L'analyse d'environnement fondée sur l'IA d'Elastic Beanstalk collecte les événements récents, les informations d'intégrité et les journaux, les envoie à Amazon Bedrock et renvoie les causes racines probables avec des solutions recommandées. Elle se demande avec le bouton AI Analysis de la console, avec request-environment-info et le type d'information analyze, ou avec eb logs --analyze dans l'EB CLI 3.27 ou ultérieure."
  options:
    a:
      en: "Copying logs by hand into a playground takes more effort, leaves out the events and health data, and may expose log content."
      fr: "Copier les journaux à la main dans un terrain de jeu demande plus d'effort, laisse de côté les événements et les données d'intégrité, et peut exposer le contenu des journaux."
    b:
      en: "Enhanced health reports per-instance status and causes, but it does not analyze logs or generate an explanation with next steps."
      fr: "Les rapports d'intégrité améliorés indiquent l'état et les causes par instance, mais n'analysent pas les journaux et ne génèrent pas d'explication avec des actions."
    d:
      en: "Following events only displays them as they occur; it produces no root cause analysis or recommendations."
      fr: "Suivre les événements ne fait que les afficher au fil de l'eau ; aucune analyse des causes racines ni recommandation n'est produite."
references:
  - title: AI-powered environment analysis
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/health-ai-analysis.html
