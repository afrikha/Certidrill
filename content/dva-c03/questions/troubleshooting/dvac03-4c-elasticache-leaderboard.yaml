id: dvac03-4c-elasticache-leaderboard
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is building a real-time leaderboard that ranks millions of players by score. The application must update scores continuously and return the top 100 players with very low latency. The cache must replicate its data to another Availability Zone and fail over automatically.

    Which solution will meet these requirements?
  fr: |
    AnyCompany crée un classement en temps réel qui ordonne des millions de joueurs selon leur score. L'application doit mettre à jour les scores en continu et renvoyer les 100 meilleurs joueurs avec une très faible latence. Le cache doit répliquer ses données dans une autre zone de disponibilité et basculer automatiquement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An Amazon ElastiCache for Memcached cluster with several nodes in different Availability Zones.", fr: "Un cluster Amazon ElastiCache for Memcached avec plusieurs nœuds dans différentes zones de disponibilité." }
    - id: b
      text: { en: "An Amazon ElastiCache for Valkey replication group that uses sorted sets, with Multi-AZ automatic failover.", fr: "Un groupe de réplication Amazon ElastiCache for Valkey qui utilise des ensembles triés (sorted sets), avec basculement automatique Multi-AZ." }
    - id: c
      text: { en: "An Amazon CloudFront distribution that caches the responses of the leaderboard API.", fr: "Une distribution Amazon CloudFront qui met en cache les réponses de l'API de classement." }
    - id: d
      text: { en: "A DAX cluster that caches Query results on a global secondary index sorted by score.", fr: "Un cluster DAX qui met en cache les résultats de Query sur un index secondaire global trié par score." }
answer: { optionId: b }
explanation:
  correct:
    en: "Valkey (like Redis OSS) supports complex data types such as sorted sets, which keep members ordered by score and return the top ranks directly. It also supports replication with automatic failover across Availability Zones, which Memcached does not."
    fr: "Valkey (comme Redis OSS) prend en charge des types de données complexes tels que les ensembles triés, qui gardent les membres classés par score et renvoient directement les premiers rangs. Il prend aussi en charge la réplication avec basculement automatique entre zones de disponibilité, ce que Memcached ne fait pas."
  options:
    a:
      en: "Memcached supports only simple data types and has no replication or automatic failover."
      fr: "Memcached ne prend en charge que des types de données simples et ne propose ni réplication ni basculement automatique."
    c:
      en: "CloudFront caches responses for their TTL, so the leaderboard would not reflect continuous score updates in real time."
      fr: "CloudFront met les réponses en cache pendant leur TTL : le classement ne refléterait donc pas en temps réel les mises à jour continues des scores."
    d:
      en: "The DAX query cache is not updated when items change; cached Query results stay stale until their TTL expires, which fails the real-time requirement."
      fr: "Le cache de requêtes DAX n'est pas mis à jour quand les éléments changent ; les résultats de Query en cache restent obsolètes jusqu'à l'expiration de leur TTL, ce qui ne respecte pas l'exigence de temps réel."
references:
  - title: Comparing node-based Valkey, Memcached, and Redis OSS clusters
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/SelectEngine.html
