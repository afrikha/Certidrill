id: dvac03-4c-bedrock-slow-query-advice
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every week, a scheduled AWS Lambda function at AnyCompany extracts the 20 slowest SQL statements from the Amazon Aurora slow query log in CloudWatch Logs. The team wants a foundation model to analyze these statements and suggest index and query improvements for a weekly report. The solution must have the LEAST operational overhead, and the team does not want to manage any model infrastructure.

    Which solution will meet these requirements?
  fr: |
    Chaque semaine, une fonction AWS Lambda planifiée d'AnyCompany extrait les 20 instructions SQL les plus lentes du journal des requêtes lentes d'Amazon Aurora dans CloudWatch Logs. L'équipe veut qu'un modèle de fondation analyse ces instructions et suggère des améliorations d'index et de requêtes pour un rapport hebdomadaire. La solution doit avoir le MOINS de charge opérationnelle, et l'équipe ne veut gérer aucune infrastructure de modèle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Call the Amazon Bedrock Converse API from the function with the statements in the prompt, and allow `bedrock:InvokeModel` for the execution role.", fr: "Appeler l'API Converse d'Amazon Bedrock depuis la fonction avec les instructions dans l'invite, et autoriser `bedrock:InvokeModel` pour le rôle d'exécution." }
    - id: b
      text: { en: "Run an open source model on an Amazon EC2 GPU instance, and call the model from the function.", fr: "Exécuter un modèle open source sur une instance GPU Amazon EC2 et appeler le modèle depuis la fonction." }
    - id: c
      text: { en: "Create an Amazon Q Business application, and upload the statements to it as documents every week.", fr: "Créer une application Amazon Q Business et y charger chaque semaine les instructions sous forme de documents." }
    - id: d
      text: { en: "Create a CloudWatch Logs anomaly detector for the log group of the slow query log.", fr: "Créer un détecteur d'anomalies CloudWatch Logs pour le groupe de journaux du journal des requêtes lentes." }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Bedrock gives API access to foundation models with no model infrastructure to manage. The Converse API, on the bedrock-runtime endpoint, provides one request format for all models that support messages, and calling it requires the `bedrock:InvokeModel` permission, so the existing function only needs one API call and a permission."
    fr: "Amazon Bedrock donne accès par API à des modèles de fondation sans infrastructure de modèle à gérer. L'API Converse, sur le point de terminaison bedrock-runtime, offre un format de requête unique pour tous les modèles qui prennent en charge les messages, et son appel exige l'autorisation `bedrock:InvokeModel` : la fonction existante n'a donc besoin que d'un appel d'API et d'une autorisation."
  options:
    b:
      en: "Running a model on EC2 means managing instances, scaling and patching, which is the model infrastructure the team does not want."
      fr: "Exécuter un modèle sur EC2 implique de gérer des instances, la mise à l'échelle et les correctifs, soit l'infrastructure de modèle que l'équipe ne veut pas."
    c:
      en: "Amazon Q Business has been in maintenance since June 30, 2026, so new customers cannot onboard, and uploading documents every week adds manual work."
      fr: "Amazon Q Business est en maintenance depuis le 30 juin 2026 : les nouveaux clients ne peuvent pas l'adopter, et charger des documents chaque semaine ajoute du travail manuel."
    d:
      en: "A log anomaly detector flags unusual log patterns; it does not analyze SQL statements or suggest index and query improvements."
      fr: "Un détecteur d'anomalies de journaux signale des modèles de journaux inhabituels ; il n'analyse pas d'instructions SQL et ne suggère pas d'améliorations d'index ni de requêtes."
references:
  - title: Inference using Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
