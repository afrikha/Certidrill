id: dvac03-4a-bedrock-error-summaries
objective: "4.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants troubleshooting suggestions to be generated automatically whenever its order service, an AWS Lambda function, logs an event that contains ERROR. The suggestions must come from a foundation model in Amazon Bedrock and be posted to the chat channel of the team by a new Lambda function named error-advisor. The solution must start the analysis as soon as the error is logged.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise veut que des suggestions de dépannage soient générées automatiquement chaque fois que son service de commandes, une fonction AWS Lambda, journalise un événement qui contient ERROR. Les suggestions doivent provenir d'un modèle de fondation d'Amazon Bedrock et être publiées dans le canal de discussion de l'équipe par une nouvelle fonction Lambda nommée error-advisor. La solution doit lancer l'analyse dès que l'erreur est journalisée.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a subscription filter with the ERROR filter pattern on the log group of the order service, with error-advisor as the destination.", fr: "Créer un filtre d'abonnement avec le modèle de filtre ERROR sur le groupe de journaux du service de commandes, avec error-advisor comme destination." } }
    - { id: b, text: { en: "Create a metric filter with the ERROR filter pattern on the log group, and configure the metric filter to invoke error-advisor.", fr: "Créer un filtre de métrique avec le modèle de filtre ERROR sur le groupe de journaux, et configurer le filtre de métrique pour qu'il appelle error-advisor." } }
    - { id: c, text: { en: "In error-advisor, call the Converse API of the bedrock-runtime client, and allow bedrock:InvokeModel on the model in the execution role.", fr: "Dans error-advisor, appeler l'API Converse du client bedrock-runtime, et autoriser bedrock:InvokeModel sur le modèle dans le rôle d'exécution." } }
    - { id: d, text: { en: "In error-advisor, call the Converse API of the bedrock-runtime client, and allow only bedrock:InvokeModelWithResponseStream in the execution role.", fr: "Dans error-advisor, appeler l'API Converse du client bedrock-runtime, et n'autoriser que bedrock:InvokeModelWithResponseStream dans le rôle d'exécution." } }
    - { id: e, text: { en: "Start a model customization job that fine-tunes the model on the log history before error-advisor calls it.", fr: "Lancer une tâche de personnalisation de modèle qui affine le modèle sur l'historique des journaux avant qu'error-advisor l'appelle." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A subscription filter delivers matching log events from a log group to a destination such as a Lambda function as they are ingested. The function can then send the error to a model with the Converse API on the bedrock-runtime endpoint, which requires permission for the bedrock:InvokeModel operation."
    fr: "Un filtre d'abonnement livre les événements de journal correspondants d'un groupe de journaux à une destination, comme une fonction Lambda, au fur et à mesure de leur ingestion. La fonction peut ensuite envoyer l'erreur à un modèle avec l'API Converse sur le point de terminaison bedrock-runtime, ce qui exige l'autorisation pour l'opération bedrock:InvokeModel."
  options:
    b:
      en: "A metric filter turns matching events into a metric value; it cannot invoke a function or pass the log event to it."
      fr: "Un filtre de métrique transforme les événements correspondants en valeur de métrique ; il ne peut pas appeler de fonction ni lui transmettre l'événement de journal."
    d:
      en: "bedrock:InvokeModelWithResponseStream is the permission for ConverseStream; Converse requires bedrock:InvokeModel."
      fr: "bedrock:InvokeModelWithResponseStream est l'autorisation de ConverseStream ; Converse exige bedrock:InvokeModel."
    e:
      en: "Fine-tuning is not needed to analyze an error with a foundation model, and it adds cost and time without meeting any stated requirement."
      fr: "L'affinage n'est pas nécessaire pour analyser une erreur avec un modèle de fondation, et il ajoute coût et délai sans répondre à aucune exigence énoncée."
references:
  - title: Inference using Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
  - title: Filter pattern syntax for metric filters, subscription filters, filter log events, and Live Tail
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/FilterAndPatternSyntax.html
