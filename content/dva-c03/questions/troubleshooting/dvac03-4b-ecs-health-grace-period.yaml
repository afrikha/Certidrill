id: dvac03-4b-ecs-health-grace-period
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AnyCompany Java application runs as an Amazon ECS service behind an Application Load Balancer. Each new task needs about 3 minutes to load its cache before it answers the target group health checks. During deployments, the service stops new tasks after about one minute because their load balancer health checks fail, and it launches tasks in a loop. After startup, failed tasks must still be detected as quickly as they are today.

    Which solution will meet these requirements?
  fr: |
    Une application Java d'AnyCompany s'exécute en tant que service Amazon ECS derrière un Application Load Balancer. Chaque nouvelle tâche a besoin d'environ 3 minutes pour charger son cache avant de répondre aux vérifications de l'état du groupe cible. Pendant les déploiements, le service arrête les nouvelles tâches au bout d'environ une minute car leurs vérifications de l'état d'équilibreur de charge échouent, et il lance des tâches en boucle. Après le démarrage, les tâches défaillantes doivent toujours être détectées aussi vite qu'aujourd'hui.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the unhealthy threshold count of the target group to 10.", fr: "Définir le seuil de mauvaise santé du groupe cible sur 10." } }
    - { id: b, text: { en: "Add a container health check with a `startPeriod` of 240 seconds to the task definition.", fr: "Ajouter à la définition de tâche une vérification de l'état de conteneur avec un `startPeriod` de 240 secondes." } }
    - { id: c, text: { en: "Increase the deregistration delay of the target group to 240 seconds.", fr: "Augmenter le délai de désinscription du groupe cible à 240 secondes." } }
    - { id: d, text: { en: "Set `healthCheckGracePeriodSeconds` to 240 on the ECS service.", fr: "Définir `healthCheckGracePeriodSeconds` sur 240 sur le service ECS." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The health check grace period of a service is the time after a task first starts during which the ECS service scheduler ignores unhealthy Elastic Load Balancing and container health checks. A value of 240 seconds covers the cache load, and the normal health check settings apply as soon as the period ends."
    fr: "La période de grâce de vérification de l'état d'un service est la durée, après le premier démarrage d'une tâche, pendant laquelle le planificateur de service ECS ignore les échecs des vérifications de l'état Elastic Load Balancing et de conteneur. Une valeur de 240 secondes couvre le chargement du cache, et les paramètres normaux de vérification s'appliquent dès la fin de la période."
  options:
    a:
      en: "A higher threshold slows the detection of every failure, including after startup, which the requirements forbid."
      fr: "Un seuil plus élevé ralentit la détection de chaque défaillance, y compris après le démarrage, ce que les exigences interdisent."
    b:
      en: "`startPeriod` applies only to the container health check; the failing load balancer health checks still make the scheduler stop the tasks."
      fr: "`startPeriod` ne s'applique qu'à la vérification de l'état de conteneur ; les échecs des vérifications de l'équilibreur de charge font toujours arrêter les tâches par le planificateur."
    c:
      en: "The deregistration delay controls how long a target drains connections when it is removed; it does not affect new tasks that fail health checks."
      fr: "Le délai de désinscription contrôle la durée de drainage des connexions d'une cible retirée ; il n'a pas d'effet sur les nouvelles tâches qui échouent aux vérifications."
references:
  - title: Amazon ECS service definition parameters
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service_definition_parameters.html
