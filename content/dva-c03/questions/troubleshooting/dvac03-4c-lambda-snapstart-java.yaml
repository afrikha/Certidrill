id: dvac03-4c-lambda-snapstart-java
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany exposes a Java 21 AWS Lambda function through Amazon API Gateway. The function's framework takes about 6 seconds to initialize, so requests that reach a new execution environment are slow. Traffic is spiky and unpredictable. The function uses the default ephemeral storage and does not use Amazon EFS. The company needs to reduce the cold-start latency in the MOST cost-effective way.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose une fonction AWS Lambda en Java 21 via Amazon API Gateway. Le framework de la fonction met environ 6 secondes à s'initialiser : les requêtes qui arrivent sur un nouvel environnement d'exécution sont donc lentes. Le trafic est irrégulier et imprévisible. La fonction utilise le stockage éphémère par défaut et n'utilise pas Amazon EFS. L'entreprise doit réduire la latence de démarrage à froid de la manière la plus économique.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure provisioned concurrency on an alias, sized for the expected traffic peak.", fr: "Configurer la simultanéité provisionnée sur un alias, dimensionnée pour le pic de trafic attendu." }
    - id: b
      text: { en: "Increase the memory setting of the function to the maximum of 10,240 MB.", fr: "Augmenter le paramètre de mémoire de la fonction au maximum de 10 240 Mo." }
    - id: c
      text: { en: "Change the function architecture to arm64 and rebuild the deployment package.", fr: "Passer l'architecture de la fonction à arm64 et reconstruire le package de déploiement." }
    - id: d
      text: { en: "Turn on SnapStart, publish a version, and invoke it through an alias that points to the version.", fr: "Activer SnapStart, publier une version et l'invoquer via un alias qui pointe vers cette version." }
answer: { optionId: d }
explanation:
  correct:
    en: "SnapStart initializes the function when a version is published, takes a snapshot of the initialized environment and resumes new environments from that snapshot, which often brings startup below one second. It works only on published versions and aliases that point to them. For Java managed runtimes, SnapStart has no additional cost beyond standard request and duration charges."
    fr: "SnapStart initialise la fonction lors de la publication d'une version, prend un instantané de l'environnement initialisé et reprend les nouveaux environnements à partir de cet instantané, ce qui ramène souvent le démarrage sous la seconde. Il ne fonctionne que sur les versions publiées et les alias qui pointent vers elles. Pour les runtimes gérés Java, SnapStart n'entraîne aucun coût en plus des frais standard de requêtes et de durée."
  options:
    a:
      en: "Provisioned concurrency also removes cold starts, but it is billed for the configured environments all the time, and sizing it for unpredictable peaks costs more than SnapStart for Java."
      fr: "La simultanéité provisionnée supprime aussi les démarrages à froid, mais elle est facturée en permanence pour les environnements configurés, et la dimensionner pour des pics imprévisibles coûte plus cher que SnapStart pour Java."
    b:
      en: "More CPU can shorten initialization somewhat, but the function would still initialize from scratch and every invocation would cost much more."
      fr: "Plus de processeur peut raccourcir un peu l'initialisation, mais la fonction s'initialiserait toujours depuis zéro et chaque invocation coûterait beaucoup plus cher."
    c:
      en: "The arm64 architecture improves price performance, but each new environment still runs the full 6-second framework initialization."
      fr: "L'architecture arm64 améliore le rapport prix/performances, mais chaque nouvel environnement exécute toujours l'initialisation complète de 6 secondes du framework."
references:
  - title: Improving startup performance with Lambda SnapStart
    url: https://docs.aws.amazon.com/lambda/latest/dg/snapstart.html
