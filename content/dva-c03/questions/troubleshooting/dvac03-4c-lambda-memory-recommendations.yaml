id: dvac03-4c-lambda-memory-recommendations
objective: "4.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an AWS Lambda function that uses the x86_64 architecture and is configured with 2,048 MB of memory. The function has been invoked thousands of times each day for the last month. A developer suspects that the memory setting is higher than necessary and wants a data-based recommendation for the memory setting that balances cost and performance.

    Which two actions will provide such a recommendation? (Choose two.) Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany dispose d'une fonction AWS Lambda qui utilise l'architecture x86_64 et qui est configurée avec 2 048 Mo de mémoire. La fonction a été invoquée des milliers de fois par jour au cours du dernier mois. Un développeur soupçonne que le paramètre de mémoire est plus élevé que nécessaire et veut une recommandation fondée sur des données pour le paramètre de mémoire, qui équilibre coût et performances.

    Quelles sont les deux actions qui fournissent une telle recommandation ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure provisioned concurrency and review the ProvisionedConcurrencyUtilization metric.", fr: "Configurer la simultanéité provisionnée et examiner la métrique ProvisionedConcurrencyUtilization." } }
    - { id: b, text: { en: "Opt in to AWS Compute Optimizer and review the memory recommendation in the Lambda console.", fr: "Activer AWS Compute Optimizer et examiner la recommandation de mémoire dans la console Lambda." } }
    - { id: c, text: { en: "Turn on AWS X-Ray active tracing and review the Initialization subsegment of the traces.", fr: "Activer le suivi actif AWS X-Ray et examiner le sous-segment Initialization des traces." } }
    - { id: d, text: { en: "Increase the ephemeral storage of the function and review the REPORT log lines.", fr: "Augmenter le stockage éphémère de la fonction et examiner les lignes de journal REPORT." } }
    - { id: e, text: { en: "Run the open source AWS Lambda Power Tuning tool against the function.", fr: "Exécuter l'outil open source AWS Lambda Power Tuning sur la fonction." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "After an opt-in, AWS Compute Optimizer analyzes the function's metrics and shows memory recommendations in the General configuration of the Lambda console; it supports only x86_64 functions, which is the case here. AWS Lambda Power Tuning uses AWS Step Functions to run the function with different memory settings and measures cost and performance, so it also gives a data-based setting."
    fr: "Après activation, AWS Compute Optimizer analyse les métriques de la fonction et affiche des recommandations de mémoire dans la configuration générale de la console Lambda ; il ne prend en charge que les fonctions x86_64, ce qui est le cas ici. AWS Lambda Power Tuning utilise AWS Step Functions pour exécuter la fonction avec différents paramètres de mémoire et mesure le coût et les performances : il fournit lui aussi un paramètre fondé sur des données."
  options:
    a:
      en: "ProvisionedConcurrencyUtilization shows how much of the provisioned concurrency is used; it says nothing about the right memory setting."
      fr: "ProvisionedConcurrencyUtilization montre la part de simultanéité provisionnée utilisée ; elle n'indique rien sur le bon paramètre de mémoire."
    c:
      en: "The Initialization subsegment shows the duration of the init phase; it does not recommend a memory setting."
      fr: "Le sous-segment Initialization montre la durée de la phase d'initialisation ; il ne recommande pas de paramètre de mémoire."
    d:
      en: "Ephemeral storage is /tmp disk space and is unrelated to the memory setting; changing it produces no memory recommendation."
      fr: "Le stockage éphémère est de l'espace disque /tmp sans rapport avec le paramètre de mémoire ; le modifier ne produit aucune recommandation de mémoire."
references:
  - title: Configure Lambda Event Function memory
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html
