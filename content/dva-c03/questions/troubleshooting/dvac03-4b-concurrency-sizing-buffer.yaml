id: dvac03-4b-concurrency-sizing-buffer
objective: "4.3.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    An AnyCompany AWS Lambda function receives a peak of 400 requests per second, and each invocation lasts 250 milliseconds on average. The team wants to configure provisioned concurrency for the peak, following the Lambda guidance of adding a 10 percent buffer to the estimated concurrency.

    How much provisioned concurrency should the team configure?
  fr: |
    Une fonction AWS Lambda d'AnyCompany reçoit un pic de 400 requêtes par seconde, et chaque appel dure en moyenne 250 millisecondes. L'équipe veut configurer la simultanéité provisionnée pour le pic, en suivant la recommandation de Lambda d'ajouter une marge de 10 % à la simultanéité estimée.

    Quelle simultanéité provisionnée l'équipe doit-elle configurer ?
body:
  options:
    - { id: a, text: "100" }
    - { id: b, text: "110" }
    - { id: c, text: "400" }
    - { id: d, text: "440" }
answer: { optionId: b }
explanation:
  correct:
    en: "Concurrency equals the average requests per second multiplied by the average duration in seconds: 400 × 0.25 = 100. Adding the suggested 10 percent buffer gives 110."
    fr: "La simultanéité est égale au nombre moyen de requêtes par seconde multiplié par la durée moyenne en secondes : 400 × 0,25 = 100. L'ajout de la marge suggérée de 10 % donne 110."
  options:
    a:
      en: "100 is the estimated concurrency without the 10 percent buffer."
      fr: "100 est la simultanéité estimée sans la marge de 10 %."
    c:
      en: "400 is the request rate; concurrency also depends on how long each invocation lasts."
      fr: "400 est le débit de requêtes ; la simultanéité dépend aussi de la durée de chaque appel."
    d:
      en: "440 adds the buffer to the request rate instead of the concurrency."
      fr: "440 ajoute la marge au débit de requêtes au lieu de la simultanéité."
references:
  - title: Configuring provisioned concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
  - title: Understanding Lambda Event Function scaling
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html
