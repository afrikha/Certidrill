id: dvac03-4c-sqs-visibility-six-times
objective: "4.3.3"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    An AWS Lambda function has a timeout of 120 seconds and processes an Amazon SQS standard queue through an event source mapping with a MaximumBatchingWindowInSeconds of 10. The visibility timeout of the queue is 120 seconds. When the function is throttled during peaks, some messages are processed twice. The developer wants to set the visibility timeout of the queue to the lowest value that follows the AWS recommendation for Lambda event source mappings.

    Which value should the developer set?
  fr: |
    Une fonction AWS Lambda a un délai d'expiration de 120 secondes et traite une file d'attente standard Amazon SQS via un mappage de source d'événement dont MaximumBatchingWindowInSeconds vaut 10. Le délai de visibilité de la file d'attente est de 120 secondes. Quand la fonction est limitée pendant les pics, certains messages sont traités deux fois. Le développeur veut définir le délai de visibilité de la file d'attente à la valeur la plus basse qui respecte la recommandation d'AWS pour les mappages de source d'événement Lambda.

    Quelle valeur le développeur doit-il définir ?
body:
  options:
    - id: a
      text: { en: "240 seconds", fr: "240 secondes" }
    - id: b
      text: { en: "720 seconds", fr: "720 secondes" }
    - id: c
      text: { en: "730 seconds", fr: "730 secondes" }
    - id: d
      text: { en: "900 seconds", fr: "900 secondes" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS recommends a visibility timeout of at least six times the function timeout, so that Lambda has time to retry when the function is throttled. When a batching window is configured, the recommendation adds the value of MaximumBatchingWindowInSeconds: 6 × 120 + 10 = 730 seconds."
    fr: "AWS recommande un délai de visibilité d'au moins six fois le délai d'expiration de la fonction, afin que Lambda ait le temps de réessayer quand la fonction est limitée. Quand une fenêtre de traitement par lot est configurée, la recommandation ajoute la valeur de MaximumBatchingWindowInSeconds : 6 × 120 + 10 = 730 secondes."
  options:
    a:
      en: "Twice the function timeout is below the recommended six times the function timeout plus the batching window."
      fr: "Deux fois le délai d'expiration de la fonction est inférieur à la recommandation de six fois ce délai plus la fenêtre de traitement par lot."
    b:
      en: "720 seconds is six times the function timeout but does not add the 10-second batching window."
      fr: "720 secondes représente six fois le délai d'expiration de la fonction, mais n'ajoute pas la fenêtre de traitement par lot de 10 secondes."
    d:
      en: "900 seconds follows the recommendation but is not the lowest value that does."
      fr: "900 secondes respecte la recommandation, mais n'est pas la valeur la plus basse qui la respecte."
references:
  - title: Creating and configuring an Amazon SQS event source mapping
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
