id: dvac03-4c-lambda-arm64-cost
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a compute-intensive Python AWS Lambda function on the x86_64 architecture at high volume. The function's dependencies are either pure Python or publish arm64 builds, and the deployment package is built in the company's pipeline. The company wants to improve the price performance of the function in the MOST cost-effective way, without changing the function's logic.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute à fort volume une fonction AWS Lambda en Python gourmande en calcul, sur l'architecture x86_64. Les dépendances de la fonction sont soit du Python pur, soit publiées en versions arm64, et le package de déploiement est construit dans le pipeline de l'entreprise. L'entreprise veut améliorer le rapport prix/performances de la fonction de la manière la plus économique, sans modifier la logique de la fonction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Double the memory setting of the function to give it more CPU power.", fr: "Doubler le paramètre de mémoire de la fonction pour lui donner plus de puissance de processeur." }
    - id: b
      text: { en: "Configure provisioned concurrency on an alias of the function.", fr: "Configurer la simultanéité provisionnée sur un alias de la fonction." }
    - id: c
      text: { en: "Rebuild the package with arm64 dependencies and change the function architecture to arm64.", fr: "Reconstruire le package avec des dépendances arm64 et passer l'architecture de la fonction à arm64." }
    - id: d
      text: { en: "Turn on Lambda SnapStart and invoke the function through a published version.", fr: "Activer Lambda SnapStart et invoquer la fonction via une version publiée." }
answer: { optionId: c }
explanation:
  correct:
    en: "Functions on the arm64 architecture (AWS Graviton processors) can achieve significantly better price and performance than the equivalent x86_64 function, and AWS recommends arm64 for compute-intensive workloads. Because every dependency has an arm64 build, the team only has to build an arm64-compatible package and set the architecture to arm64."
    fr: "Les fonctions sur l'architecture arm64 (processeurs AWS Graviton) peuvent offrir un rapport prix/performances nettement meilleur que la fonction x86_64 équivalente, et AWS recommande arm64 pour les charges de travail gourmandes en calcul. Comme chaque dépendance existe en version arm64, l'équipe doit seulement construire un package compatible arm64 et définir l'architecture sur arm64."
  options:
    a:
      en: "More memory adds CPU power but also raises the price of every millisecond, so it is not the most cost-effective way to improve price performance."
      fr: "Plus de mémoire ajoute de la puissance de processeur mais augmente aussi le prix de chaque milliseconde ; ce n'est donc pas la manière la plus économique d'améliorer le rapport prix/performances."
    b:
      en: "Provisioned concurrency removes cold starts at an extra cost; it does not make the compute-intensive code cheaper or faster."
      fr: "La simultanéité provisionnée supprime les démarrages à froid moyennant un coût supplémentaire ; elle ne rend pas le code gourmand en calcul moins cher ni plus rapide."
    d:
      en: "SnapStart reduces cold-start initialization time; it does not change the cost or speed of the computation in each invocation."
      fr: "SnapStart réduit le temps d'initialisation des démarrages à froid ; il ne change ni le coût ni la vitesse du calcul de chaque invocation."
references:
  - title: Selecting and configuring an instruction set architecture for your Lambda function
    url: https://docs.aws.amazon.com/lambda/latest/dg/foundation-arch.html
