id: dvac03-4a-insights-correlation-id
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An order passes through three AWS Lambda functions that each write structured JSON logs to their own CloudWatch Logs log group. Every event includes a correlationId field. A customer reports a problem with the order whose correlation ID is c-7731. A developer must see, in one result set and in time order, every event for that order and the log group that each event came from, with the LEAST effort.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une commande passe par trois fonctions AWS Lambda qui écrivent chacune des journaux JSON structurés dans leur propre groupe de journaux CloudWatch Logs. Chaque événement contient un champ correlationId. Un client signale un problème avec la commande dont l'ID de corrélation est c-7731. Un développeur doit voir, dans un seul ensemble de résultats et par ordre chronologique, tous les événements de cette commande et le groupe de journaux d'origine de chaque événement, avec le MOINS d'effort.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Select the three log groups in a single CloudWatch Logs Insights query.", fr: "Sélectionner les trois groupes de journaux dans une seule requête CloudWatch Logs Insights." } }
    - { id: b, text: { en: "Create a subscription filter on each log group that streams the events to Amazon OpenSearch Service.", fr: "Créer un filtre d'abonnement sur chaque groupe de journaux qui diffuse les événements vers Amazon OpenSearch Service." } }
    - { id: c, text: { en: "Use `fields @timestamp, @log, @message | filter correlationId = \"c-7731\" | sort @timestamp asc` as the query.", fr: "Utiliser `fields @timestamp, @log, @message | filter correlationId = \"c-7731\" | sort @timestamp asc` comme requête." } }
    - { id: d, text: { en: "Use `fields @timestamp, @message | filter @logStream = \"c-7731\" | sort @timestamp asc` as the query.", fr: "Utiliser `fields @timestamp, @message | filter @logStream = \"c-7731\" | sort @timestamp asc` comme requête." } }
    - { id: e, text: { en: "Run `aws logs get-log-events` for each log stream of the three log groups and merge the output.", fr: "Exécuter `aws logs get-log-events` pour chaque flux de journaux des trois groupes de journaux et fusionner les résultats." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A Logs Insights query can run against several log groups at once, so one query covers the three functions. The correlationId field is discovered from the JSON events, and the @log system field identifies the log group of each event in the form account-id:log-group-name."
    fr: "Une requête Logs Insights peut porter sur plusieurs groupes de journaux à la fois : une seule requête couvre les trois fonctions. Le champ correlationId est découvert à partir des événements JSON, et le champ système @log identifie le groupe de journaux de chaque événement sous la forme account-id:log-group-name."
  options:
    b:
      en: "Streaming to OpenSearch Service requires a domain and pipelines to set up, which is far more effort than a query."
      fr: "La diffusion vers OpenSearch Service exige un domaine et des pipelines à mettre en place, soit bien plus d'effort qu'une requête."
    d:
      en: "Log stream names identify execution environments, not orders, so this filter matches nothing; the query also omits @log."
      fr: "Les noms de flux de journaux identifient des environnements d'exécution, pas des commandes : ce filtre ne trouve rien, et la requête omet aussi @log."
    e:
      en: "Reading every log stream one by one and merging the output by hand is slow and does not filter on the correlation ID."
      fr: "Lire chaque flux de journaux un par un et fusionner les résultats à la main est lent et ne filtre pas sur l'ID de corrélation."
references:
  - title: Supported logs and discovered fields
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_AnalyzeLogData-discoverable-fields.html
  - title: Analyzing log data with CloudWatch Logs Insights
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/AnalyzingLogData.html
