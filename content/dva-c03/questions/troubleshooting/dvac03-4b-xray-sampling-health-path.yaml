id: dvac03-4b-xray-sampling-health-path
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AnyCompany service on Amazon EC2 is instrumented with ADOT and reads its sampling rules from AWS X-Ray. Most recorded traces are load balancer health checks on the `/health` path, which raises costs and hides real requests. The team wants to stop tracing `/health` requests and keep the current sampling for every other request, without redeploying the service.

    Which solution will meet these requirements?
  fr: |
    Un service d'AnyCompany sur Amazon EC2 est instrumenté avec ADOT et lit ses règles d'échantillonnage depuis AWS X-Ray. La plupart des traces enregistrées sont des vérifications de l'état de l'équilibreur de charge sur le chemin `/health`, ce qui augmente les coûts et masque les vraies requêtes. L'équipe veut cesser de tracer les requêtes `/health` et conserver l'échantillonnage actuel pour toutes les autres requêtes, sans redéployer le service.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the reservoir and the fixed rate of the default sampling rule to 0 so that health check requests are not traced.", fr: "Définir le réservoir et le taux fixe de la règle d'échantillonnage par défaut sur 0 pour que les vérifications de l'état ne soient pas tracées." } }
    - { id: b, text: { en: "Add a local sampling rules JSON file to the service with a rule that matches `/health` with a fixed rate of 0.", fr: "Ajouter au service un fichier JSON de règles d'échantillonnage local avec une règle qui correspond à `/health` avec un taux fixe de 0." } }
    - { id: c, text: { en: "Create an X-Ray sampling rule for `/health` with a reservoir and rate of 0 and a priority that is evaluated before the default rule.", fr: "Créer une règle d'échantillonnage X-Ray pour `/health` avec un réservoir et un taux de 0 et une priorité évaluée avant la règle par défaut." } }
    - { id: d, text: { en: "Create an X-Ray group with a filter expression that excludes the `/health` path from the traces of the service.", fr: "Créer un groupe X-Ray avec une expression de filtre qui exclut le chemin `/health` des traces du service." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Services evaluate sampling rules in ascending order of priority and use the first rule that matches. A rule for `/health` with a reservoir and rate of 0 stops tracing those requests, other requests still fall through to the default rule, and services that read rules from X-Ray pick up the change without a deployment."
    fr: "Les services évaluent les règles d'échantillonnage par ordre croissant de priorité et appliquent la première règle qui correspond. Une règle pour `/health` avec un réservoir et un taux de 0 arrête le traçage de ces requêtes, les autres requêtes continuent d'utiliser la règle par défaut, et les services qui lisent les règles depuis X-Ray appliquent la modification sans déploiement."
  options:
    a:
      en: "Changing the default rule stops tracing for every request that matches no other rule, not only `/health`."
      fr: "Modifier la règle par défaut arrête le traçage de toutes les requêtes qui ne correspondent à aucune autre règle, pas seulement `/health`."
    b:
      en: "Local rules are read from the deployed code and configuration, so changing them requires a redeployment."
      fr: "Les règles locales sont lues depuis le code et la configuration déployés : les modifier exige un redéploiement."
    d:
      en: "Groups filter the traces that you view after they are recorded; the health check traces are still recorded and billed."
      fr: "Les groupes filtrent les traces consultées après leur enregistrement ; les traces des vérifications de l'état sont toujours enregistrées et facturées."
references:
  - title: Configuring sampling rules
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-console-sampling.html
