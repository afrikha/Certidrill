id: dvac03-4b-putmetricdata-namespace-policy
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AnyCompany application on Amazon ECS publishes custom metrics with `PutMetricData`. Following least privilege, the security team requires the task role to be allowed to publish metrics only in the `AnyCompany/Checkout` namespace.

    Which policy statement will meet these requirements?
  fr: |
    Une application d'AnyCompany sur Amazon ECS publie des métriques personnalisées avec `PutMetricData`. Selon le principe du moindre privilège, l'équipe de sécurité exige que le rôle de tâche ne soit autorisé à publier des métriques que dans l'espace de noms `AnyCompany/Checkout`.

    Quelle instruction de politique répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Allow `cloudwatch:*` on `Resource: \"*\"` with a `StringEquals` condition on `cloudwatch:namespace` set to `AnyCompany/Checkout`.", fr: "Autoriser `cloudwatch:*` sur `Resource: \"*\"` avec une condition `StringEquals` sur `cloudwatch:namespace` définie sur `AnyCompany/Checkout`." } }
    - { id: b, text: { en: "Allow `logs:PutLogEvents` on the log group named `AnyCompany/Checkout`.", fr: "Autoriser `logs:PutLogEvents` sur le groupe de journaux nommé `AnyCompany/Checkout`." } }
    - { id: c, text: { en: "Allow `cloudwatch:PutMetricData` on `Resource: \"*\"` with a `StringEquals` condition on `cloudwatch:namespace` set to `AnyCompany/Checkout`.", fr: "Autoriser `cloudwatch:PutMetricData` sur `Resource: \"*\"` avec une condition `StringEquals` sur `cloudwatch:namespace` définie sur `AnyCompany/Checkout`." } }
    - { id: d, text: { en: "Allow `cloudwatch:PutMetricData` on `Resource: \"*\"` with no condition.", fr: "Autoriser `cloudwatch:PutMetricData` sur `Resource: \"*\"` sans condition." } }
answer: { optionId: c }
explanation:
  correct:
    en: "`PutMetricData` is restricted to a namespace with the `cloudwatch:namespace` condition key, on `Resource: \"*\"`. Allowing only that action with a `StringEquals` condition on `AnyCompany/Checkout` lets the role publish in that namespace and nowhere else."
    fr: "`PutMetricData` se restreint à un espace de noms avec la clé de condition `cloudwatch:namespace`, sur `Resource: \"*\"`. Autoriser uniquement cette action avec une condition `StringEquals` sur `AnyCompany/Checkout` permet au rôle de publier dans cet espace de noms et nulle part ailleurs."
  options:
    a:
      en: "The namespace condition limits only the actions that use it; `cloudwatch:*` also grants every other CloudWatch action, which is not least privilege."
      fr: "La condition d'espace de noms ne limite que les actions qui l'utilisent ; `cloudwatch:*` accorde aussi toutes les autres actions CloudWatch, ce qui n'est pas le moindre privilège."
    b:
      en: "`PutLogEvents` writes log events, not metric data points published with `PutMetricData`."
      fr: "`PutLogEvents` écrit des événements de journal, pas des points de données de métrique publiés avec `PutMetricData`."
    d:
      en: "Without the condition, the role can publish in any namespace."
      fr: "Sans la condition, le rôle peut publier dans n'importe quel espace de noms."
references:
  - title: Using condition keys to limit access to CloudWatch namespaces
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/iam-cw-condition-keys-namespace.html
