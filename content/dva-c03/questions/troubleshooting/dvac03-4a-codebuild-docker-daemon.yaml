id: dvac03-4a-codebuild-docker-daemon
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CodeBuild project builds a container image with `docker build` and pushes it to Amazon ECR. The build fails, and the build log contains the following line.

    ```text
    Cannot connect to the Docker daemon at unix:/var/run/docker.sock. Is the docker daemon running?
    ```

    Which change will fix the build?
  fr: |
    Un projet AWS CodeBuild construit une image de conteneur avec `docker build` et la pousse vers Amazon ECR. La génération échoue, et son journal contient la ligne suivante.

    ```text
    Cannot connect to the Docker daemon at unix:/var/run/docker.sock. Is the docker daemon running?
    ```

    Quelle modification corrige la génération ?
body:
  options:
    - { id: a, text: { en: "Add the ecr:GetAuthorizationToken permission to the CodeBuild service role.", fr: "Ajouter l'autorisation ecr:GetAuthorizationToken au rôle de service CodeBuild." } }
    - { id: b, text: { en: "Enable privileged mode in the environment settings of the build project.", fr: "Activer le mode privilégié dans les paramètres d'environnement du projet de génération." } }
    - { id: c, text: { en: "Select a larger compute type for the build project.", fr: "Sélectionner un type de calcul plus grand pour le projet de génération." } }
    - { id: d, text: { en: "Move the docker build command from the build phase to the post_build phase.", fr: "Déplacer la commande docker build de la phase build vers la phase post_build." } }
answer: { optionId: b }
explanation:
  correct:
    en: "This error means that the build does not run in privileged mode, so the Docker daemon is not available. Enabling privileged mode in the project environment allows the build to run Docker commands."
    fr: "Cette erreur signifie que la génération ne s'exécute pas en mode privilégié : le démon Docker n'est donc pas disponible. Activer le mode privilégié dans l'environnement du projet permet à la génération d'exécuter des commandes Docker."
  options:
    a:
      en: "A missing ECR permission fails the login or push step with an authorization error, not the connection to the Docker daemon."
      fr: "Une autorisation ECR manquante fait échouer la connexion au registre ou l'envoi avec une erreur d'autorisation, pas la connexion au démon Docker."
    c:
      en: "The compute type changes CPU, memory and disk; it does not make the Docker daemon available."
      fr: "Le type de calcul modifie le processeur, la mémoire et le disque ; il ne rend pas le démon Docker disponible."
    d:
      en: "The daemon is unavailable in every phase without privileged mode, so moving the command does not help."
      fr: "Sans mode privilégié, le démon est indisponible dans toutes les phases : déplacer la commande n'aide pas."
references:
  - title: Troubleshooting AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/troubleshooting.html
