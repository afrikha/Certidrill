id: dvac03-4a-insights-errors-per-bin
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application writes structured JSON logs to CloudWatch Logs. Each event has a level field, for example `"level": "ERROR"`. To see when a problem started, a developer needs a CloudWatch Logs Insights query that returns the number of ERROR events for each 5-minute interval.

    Which query will meet this requirement?
  fr: |
    Une application écrit des journaux JSON structurés dans CloudWatch Logs. Chaque événement possède un champ level, par exemple `"level": "ERROR"`. Pour savoir quand un problème a commencé, un développeur a besoin d'une requête CloudWatch Logs Insights qui renvoie le nombre d'événements ERROR pour chaque intervalle de 5 minutes.

    Quelle requête répond à cette exigence ?
body:
  options:
    - { id: a, text: "`filter level = \"ERROR\" | stats count(*) by @logStream`" }
    - { id: b, text: "`filter level = \"ERROR\" | stats count(*) by bin(5m)`" }
    - { id: c, text: "`filter level = \"ERROR\" | sort @timestamp desc | limit 5`" }
    - { id: d, text: "`stats count(*) by level | filter level = \"ERROR\" | limit 5m`" }
answer: { optionId: b }
explanation:
  correct:
    en: "Logs Insights discovers the fields of JSON log events, so the level field can be filtered directly. The stats command with bin(5m) groups the matching events into 5-minute buckets and counts them, which gives a time series of errors."
    fr: "Logs Insights découvre les champs des événements de journal JSON : le champ level peut donc être filtré directement. La commande stats avec bin(5m) regroupe les événements correspondants par tranches de 5 minutes et les compte, ce qui donne une série chronologique des erreurs."
  options:
    a:
      en: "Grouping by @logStream counts errors per log stream, not per time interval."
      fr: "Le regroupement par @logStream compte les erreurs par flux de journaux, pas par intervalle de temps."
    c:
      en: "This query returns the five latest error events, not a count per interval."
      fr: "Cette requête renvoie les cinq derniers événements d'erreur, pas un comptage par intervalle."
    d:
      en: "limit takes a number of rows, not a time interval, and the query returns one total per level instead of per interval."
      fr: "limit attend un nombre de lignes, pas un intervalle de temps, et la requête renvoie un total par niveau au lieu d'un total par intervalle."
references:
  - title: Sample queries
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-examples.html
  - title: Supported logs and discovered fields
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_AnalyzeLogData-discoverable-fields.html
