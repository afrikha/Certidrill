id: dvac03-4c-cloudfront-hit-ratio
objective: "4.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany serves static images and a product API through an Amazon CloudFront distribution with a single custom origin in one AWS Region. The cache policy includes the `User-Agent` header in the cache key because the origin returns smaller images to mobile devices. Viewers are spread across many edge locations, and the cache hit ratio is about 40 %.

    Which two actions will increase the cache hit ratio? (Choose two.) Each correct answer presents a complete solution.
  fr: |
    AnyCompany sert des images statiques et une API de produits via une distribution Amazon CloudFront dotée d'une seule origine personnalisée dans une Région AWS. La politique de cache inclut l'en-tête `User-Agent` dans la clé de cache, car l'origine renvoie des images plus petites aux appareils mobiles. Les utilisateurs sont répartis sur de nombreux emplacements périphériques, et le taux d'accès au cache (cache hit ratio) est d'environ 40 %.

    Quelles sont les deux actions qui augmentent le taux d'accès au cache ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replace User-Agent in the cache key with the CloudFront-Is-Mobile-Viewer header.", fr: "Remplacer User-Agent dans la clé de cache par l'en-tête CloudFront-Is-Mobile-Viewer." } }
    - { id: b, text: { en: "Include all cookies in the cache key so that each user gets a personalized copy.", fr: "Inclure tous les cookies dans la clé de cache afin que chaque utilisateur obtienne une copie personnalisée." } }
    - { id: c, text: { en: "Configure the origin to add `Cache-Control: no-store` to its responses.", fr: "Configurer l'origine pour ajouter `Cache-Control: no-store` à ses réponses." } }
    - { id: d, text: { en: "Turn on CloudFront Origin Shield for the origin.", fr: "Activer CloudFront Origin Shield pour l'origine." } }
    - { id: e, text: { en: "Include all viewer headers in the cache key of the image cache behavior.", fr: "Inclure tous les en-têtes de l'utilisateur dans la clé de cache du comportement de cache des images." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "User-Agent has a very large number of unique values, so caching on it creates many copies of each object; AWS recommends caching on the CloudFront-Is-*-Viewer headers instead when only the device type matters. Origin Shield adds a central caching layer in front of the origin, which also improves the cache hit ratio."
    fr: "User-Agent a un très grand nombre de valeurs uniques : mettre en cache selon cet en-tête crée de nombreuses copies de chaque objet ; AWS recommande d'utiliser plutôt les en-têtes CloudFront-Is-*-Viewer quand seul le type d'appareil compte. Origin Shield ajoute une couche de cache centrale devant l'origine, ce qui améliore aussi le taux d'accès au cache."
  options:
    b:
      en: "Adding all cookies to the cache key creates a separate cached object for each cookie combination, which lowers the cache hit ratio."
      fr: "Ajouter tous les cookies à la clé de cache crée un objet en cache distinct par combinaison de cookies, ce qui réduit le taux d'accès au cache."
    c:
      en: "With a minimum TTL of 0, CloudFront respects no-store and stops caching the responses, so the cache hit ratio drops."
      fr: "Avec une TTL minimale de 0, CloudFront respecte no-store et cesse de mettre les réponses en cache : le taux d'accès au cache baisse."
    e:
      en: "Every header added to the cache key multiplies the number of cached variants, which lowers the cache hit ratio."
      fr: "Chaque en-tête ajouté à la clé de cache multiplie le nombre de variantes en cache, ce qui réduit le taux d'accès au cache."
references:
  - title: Increase the proportion of requests that are served directly from the CloudFront caches (cache hit ratio)
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cache-hit-ratio.html
  - title: Manage how long content stays in the cache (expiration)
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html
