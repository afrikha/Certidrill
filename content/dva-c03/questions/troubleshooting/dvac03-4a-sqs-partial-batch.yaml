id: dvac03-4a-sqs-partial-batch
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function receives batches of 10 messages from an Amazon SQS standard queue. When one message in a batch has an invalid payload, the function raises an exception, and the CloudWatch logs show that the nine valid messages of the batch are processed again on the next attempt. The batch size must stay at 10, and only the failed messages may be retried.

    Which combination of changes will meet these requirements? (Choose two.)
  fr: |
    Une fonction AWS Lambda reçoit des lots de 10 messages d'une file d'attente Amazon SQS standard. Lorsqu'un message d'un lot a une charge utile non valide, la fonction lève une exception, et les journaux CloudWatch montrent que les neuf messages valides du lot sont de nouveau traités lors de la tentative suivante. La taille de lot doit rester à 10, et seuls les messages en échec peuvent faire l'objet d'une nouvelle tentative.

    Quelle combinaison de modifications répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set FunctionResponseTypes to ReportBatchItemFailures on the event source mapping.", fr: "Définir FunctionResponseTypes sur ReportBatchItemFailures dans le mappage de source d'événement." } }
    - { id: b, text: { en: "Catch exceptions per record and return the messageId of each failed record as an itemIdentifier in batchItemFailures.", fr: "Intercepter les exceptions par enregistrement et renvoyer le messageId de chaque enregistrement en échec comme itemIdentifier dans batchItemFailures." } }
    - { id: c, text: { en: "Catch exceptions per record and return the receiptHandle of each failed record as an itemIdentifier in batchItemFailures.", fr: "Intercepter les exceptions par enregistrement et renvoyer le receiptHandle de chaque enregistrement en échec comme itemIdentifier dans batchItemFailures." } }
    - { id: d, text: { en: "Raise the exception only after all records are processed, with the failed message IDs in the error message.", fr: "Lever l'exception seulement après le traitement de tous les enregistrements, avec les ID des messages en échec dans le message d'erreur." } }
    - { id: e, text: { en: "Set maxReceiveCount to 1 in the redrive policy of the queue.", fr: "Définir maxReceiveCount sur 1 dans la politique de redirection (redrive policy) de la file d'attente." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "By default, a failed invocation makes the whole batch visible again. With ReportBatchItemFailures enabled on the event source mapping, the function returns a batchItemFailures list whose itemIdentifier values are the message IDs of the failed records, and only those messages return to the queue."
    fr: "Par défaut, un appel en échec rend tout le lot de nouveau visible. Avec ReportBatchItemFailures activé sur le mappage de source d'événement, la fonction renvoie une liste batchItemFailures dont les valeurs itemIdentifier sont les ID de message des enregistrements en échec, et seuls ces messages reviennent dans la file d'attente."
  options:
    c:
      en: "An itemIdentifier must be a message ID of the batch; an identifier that does not match a message ID makes Lambda treat the whole batch as failed."
      fr: "Un itemIdentifier doit être un ID de message du lot ; un identifiant qui ne correspond à aucun ID de message fait considérer tout le lot comme en échec."
    d:
      en: "Any exception thrown by the function marks the entire batch as failed, whatever the error message contains."
      fr: "Toute exception levée par la fonction marque le lot entier comme en échec, quel que soit le contenu du message d'erreur."
    e:
      en: "A maxReceiveCount of 1 sends failed messages to the dead-letter queue after one attempt, but the valid messages of the batch are still reprocessed."
      fr: "Un maxReceiveCount de 1 envoie les messages en échec vers la file d'attente de lettres mortes après une tentative, mais les messages valides du lot sont toujours retraités."
references:
  - title: Handling errors for an SQS event source in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html
