id: dvac03-4c-lambda-secrets-extension
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python AWS Lambda function calls the AWS Secrets Manager GetSecretValue API at the start of every invocation to get database credentials. The function runs millions of times each day, and the Secrets Manager calls add cost and latency. The secret is rotated every month, and the function must use the rotated credentials within 5 minutes of a rotation. The company wants the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda en Python appelle l'API GetSecretValue d'AWS Secrets Manager au début de chaque invocation pour obtenir les informations d'identification de la base de données. La fonction s'exécute des millions de fois par jour, et les appels à Secrets Manager ajoutent du coût et de la latence. Le secret fait l'objet d'une rotation chaque mois, et la fonction doit utiliser les informations d'identification renouvelées dans les 5 minutes qui suivent une rotation. L'entreprise veut le MOINS d'effort de développement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the credentials in an encrypted environment variable of the function and update it after each rotation.", fr: "Stocker les informations d'identification dans une variable d'environnement chiffrée de la fonction et la mettre à jour après chaque rotation." }
    - id: b
      text: { en: "Store the secret in an Amazon ElastiCache cluster and read it from the cluster in each invocation.", fr: "Stocker le secret dans un cluster Amazon ElastiCache et le lire depuis le cluster à chaque invocation." }
    - id: c
      text: { en: "Add the AWS Parameters and Secrets Lambda Extension layer and get the secret from its local HTTP endpoint.", fr: "Ajouter la couche AWS Parameters and Secrets Lambda Extension et obtenir le secret depuis son point de terminaison HTTP local." }
    - id: d
      text: { en: "Retrieve the secret once outside the handler and keep it in a global variable for the life of the environment.", fr: "Récupérer le secret une seule fois hors du gestionnaire et le conserver dans une variable globale pendant toute la vie de l'environnement." }
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS Parameters and Secrets Lambda Extension retrieves and caches secrets for the function, which reduces Secrets Manager calls, cost and latency. The function calls the extension's local HTTP endpoint (port 2773) with the session token header. By default, the extension caches secrets for 300 seconds, so rotated credentials are picked up within 5 minutes."
    fr: "L'extension AWS Parameters and Secrets Lambda Extension récupère et met en cache les secrets pour la fonction, ce qui réduit les appels à Secrets Manager, le coût et la latence. La fonction appelle le point de terminaison HTTP local de l'extension (port 2773) avec l'en-tête du jeton de session. Par défaut, l'extension met les secrets en cache pendant 300 secondes : les informations d'identification renouvelées sont donc prises en compte en 5 minutes."
  options:
    a:
      en: "Environment variables are updated only by changing the function configuration, so each rotation would need a manual or scripted update, and the secret would be stored outside Secrets Manager."
      fr: "Les variables d'environnement ne sont mises à jour qu'en modifiant la configuration de la fonction : chaque rotation exigerait une mise à jour manuelle ou scriptée, et le secret serait stocké hors de Secrets Manager."
    b:
      en: "A separate cache cluster requires new code to load, refresh and secure the secret, which is more development effort than the extension."
      fr: "Un cluster de cache séparé exige du nouveau code pour charger, actualiser et sécuriser le secret, soit plus d'effort de développement que l'extension."
    d:
      en: "An execution environment can live for hours, so a value cached for the life of the environment may not reflect a rotation within 5 minutes."
      fr: "Un environnement d'exécution peut vivre des heures : une valeur mise en cache pendant toute sa vie peut ne pas refléter une rotation dans les 5 minutes."
references:
  - title: Use Secrets Manager secrets in Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-secrets-manager.html
