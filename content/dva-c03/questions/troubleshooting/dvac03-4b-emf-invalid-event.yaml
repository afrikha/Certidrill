id: dvac03-4b-emf-invalid-event
objective: "4.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AnyCompany AWS Lambda function prints the following log event to publish a custom metric in the embedded metric format. The event appears in Amazon CloudWatch Logs, but no `QuoteLatency` metric is created.

    ```python
    import json, time

    def handler(event, context):
        print(json.dumps({
            "_aws": {
                "Timestamp": int(time.time()),
                "CloudWatchMetrics": [{
                    "Namespace": "AnyCompany/Quotes",
                    "Dimensions": [["Tier"]],
                    "Metrics": [{"Name": "QuoteLatency", "Unit": "Milliseconds"}]
                }]
            },
            "detail": {"Tier": event["tier"], "QuoteLatency": 87}
        }))
    ```

    Which combination of changes will make CloudWatch create the metric? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une fonction AWS Lambda d'AnyCompany affiche l'événement de journal suivant pour publier une métrique personnalisée au format de métrique intégrée (EMF). L'événement apparaît dans Amazon CloudWatch Logs, mais aucune métrique `QuoteLatency` n'est créée.

    ```python
    import json, time

    def handler(event, context):
        print(json.dumps({
            "_aws": {
                "Timestamp": int(time.time()),
                "CloudWatchMetrics": [{
                    "Namespace": "AnyCompany/Quotes",
                    "Dimensions": [["Tier"]],
                    "Metrics": [{"Name": "QuoteLatency", "Unit": "Milliseconds"}]
                }]
            },
            "detail": {"Tier": event["tier"], "QuoteLatency": 87}
        }))
    ```

    Quelle combinaison de modifications permet à CloudWatch de créer la métrique ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Move `Tier` and `QuoteLatency` out of `detail` to the root of the JSON object.", fr: "Déplacer `Tier` et `QuoteLatency` hors de `detail`, à la racine de l'objet JSON." } }
    - { id: b, text: { en: "Add the `cloudwatch:PutMetricData` permission to the function's execution role.", fr: "Ajouter l'autorisation `cloudwatch:PutMetricData` au rôle d'exécution de la fonction." } }
    - { id: c, text: { en: "Change `Dimensions` to `[\"Tier\"]` instead of `[[\"Tier\"]]`.", fr: "Remplacer `Dimensions` par `[\"Tier\"]` au lieu de `[[\"Tier\"]]`." } }
    - { id: d, text: { en: "Set `Timestamp` to the time in milliseconds, for example `int(time.time() * 1000)`.", fr: "Définir `Timestamp` en millisecondes, par exemple `int(time.time() * 1000)`." } }
    - { id: e, text: { en: "Add `\"StorageResolution\": 1` to the metric definition.", fr: "Ajouter `\"StorageResolution\": 1` à la définition de la métrique." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The names in `Dimensions` and `Metrics` must reference root-level members of the log event; nested members under `detail` do not count. The `Timestamp` is in milliseconds since the epoch and must be no more than 14 days in the past, so a value in seconds is read as a date in 1970 and makes the event invalid."
    fr: "Les noms figurant dans `Dimensions` et `Metrics` doivent référencer des membres de la racine de l'événement de journal ; les membres imbriqués sous `detail` ne comptent pas. Le champ `Timestamp` est exprimé en millisecondes depuis l'époque Unix et ne doit pas dater de plus de 14 jours : une valeur en secondes est lue comme une date de 1970 et rend l'événement invalide."
  options:
    b:
      en: "Metrics in the embedded metric format are extracted from the logs; the function only needs permission to write logs, not `PutMetricData`."
      fr: "Les métriques au format EMF sont extraites des journaux ; la fonction n'a besoin que d'une autorisation d'écriture des journaux, pas de `PutMetricData`."
    c:
      en: "`Dimensions` is an array of dimension sets, each of which is an array of keys, so `[[\"Tier\"]]` is the correct form."
      fr: "`Dimensions` est un tableau d'ensembles de dimensions, chacun étant un tableau de clés : `[[\"Tier\"]]` est donc la bonne forme."
    e:
      en: "`StorageResolution` only chooses between standard and high resolution; the default of 60 is valid."
      fr: "`StorageResolution` ne fait que choisir entre résolution standard et haute résolution ; la valeur par défaut 60 est valide."
references:
  - title: "Specification: Embedded metric format"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Embedded_Metric_Format_Specification.html
