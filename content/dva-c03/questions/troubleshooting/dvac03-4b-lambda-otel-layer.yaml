id: dvac03-4b-lambda-otel-layer
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is building new Python AWS Lambda functions packaged as .zip files. The developers want OpenTelemetry-based tracing that automatically instruments the AWS SDK and HTTP calls, without adding instrumentation code to the functions and without using components that are in maintenance mode.

    Which solution will meet these requirements?
  fr: |
    AnyCompany crée de nouvelles fonctions AWS Lambda Python empaquetées en fichiers .zip. Les développeurs veulent un traçage basé sur OpenTelemetry qui instrumente automatiquement les appels au SDK AWS et les appels HTTP, sans ajouter de code d'instrumentation aux fonctions et sans utiliser de composants en mode maintenance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the AWS Lambda Layer for OpenTelemetry and set `OTEL_SERVICE_NAME` to the function name.", fr: "Ajouter l'AWS Lambda Layer for OpenTelemetry et définir `OTEL_SERVICE_NAME` sur le nom de la fonction." } }
    - { id: b, text: { en: "Add the AWS Lambda Layer for OpenTelemetry and set `AWS_LAMBDA_EXEC_WRAPPER` to `/opt/otel-instrument`.", fr: "Ajouter l'AWS Lambda Layer for OpenTelemetry et définir `AWS_LAMBDA_EXEC_WRAPPER` sur `/opt/otel-instrument`." } }
    - { id: c, text: { en: "Package the X-Ray SDK for Python with the functions and call `patch_all()` at the start of each module.", fr: "Empaqueter le SDK X-Ray pour Python avec les fonctions et appeler `patch_all()` au début de chaque module." } }
    - { id: d, text: { en: "Add the Lambda Insights extension layer to the functions.", fr: "Ajouter la couche d'extension Lambda Insights aux fonctions." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The AWS Lambda Layer for OpenTelemetry (ADOT) provides the auto-instrumentation libraries. Setting `AWS_LAMBDA_EXEC_WRAPPER` to `/opt/otel-instrument` makes the runtime start through the OpenTelemetry wrapper, which instruments AWS SDK and HTTP calls without code changes."
    fr: "L'AWS Lambda Layer for OpenTelemetry (ADOT) fournit les bibliothèques d'instrumentation automatique. Définir `AWS_LAMBDA_EXEC_WRAPPER` sur `/opt/otel-instrument` fait démarrer l'environnement d'exécution au moyen du wrapper OpenTelemetry, qui instrumente les appels au SDK AWS et les appels HTTP sans modification du code."
  options:
    a:
      en: "`OTEL_SERVICE_NAME` only names the service; without the exec wrapper variable, the layer's instrumentation is never loaded."
      fr: "`OTEL_SERVICE_NAME` ne fait que nommer le service ; sans la variable du wrapper d'exécution, l'instrumentation de la couche n'est jamais chargée."
    c:
      en: "This adds instrumentation code and relies on the X-Ray SDK, which is in maintenance mode."
      fr: "Cela ajoute du code d'instrumentation et repose sur le SDK X-Ray, qui est en mode maintenance."
    d:
      en: "Lambda Insights collects system-level performance metrics and diagnostics; it does not produce distributed traces."
      fr: "Lambda Insights collecte des métriques de performances et des diagnostics au niveau système ; il ne produit pas de traces distribuées."
references:
  - title: Enable your applications on Lambda
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Application-Signals-Enable-LambdaMain.html
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
