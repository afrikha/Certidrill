id: dvac03-4c-lambda-report-oom
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function written in Node.js parses JSON files of varying sizes that are uploaded to an Amazon S3 bucket. Some invocations fail when large files are processed. For every failed invocation, the REPORT log line shows `Memory Size: 512 MB Max Memory Used: 512 MB`, and the duration is far below the configured timeout.

    Which solution will resolve the failures?
  fr: |
    Une fonction AWS Lambda écrite en Node.js analyse des fichiers JSON de tailles variables chargés dans un compartiment Amazon S3. Certaines invocations échouent lors du traitement de gros fichiers. Pour chaque invocation en échec, la ligne de journal REPORT indique `Memory Size: 512 MB Max Memory Used: 512 MB`, et la durée est très inférieure au délai d'expiration configuré.

    Quelle solution résout ces échecs ?
body:
  options:
    - id: a
      text: { en: "Increase the memory setting of the function.", fr: "Augmenter le paramètre de mémoire de la fonction." }
    - id: b
      text: { en: "Increase the ephemeral storage of the function.", fr: "Augmenter le stockage éphémère de la fonction." }
    - id: c
      text: { en: "Increase the timeout setting of the function.", fr: "Augmenter le paramètre de délai d'expiration de la fonction." }
    - id: d
      text: { en: "Increase the reserved concurrency of the function.", fr: "Augmenter la simultanéité réservée de la fonction." }
answer: { optionId: a }
explanation:
  correct:
    en: "The Max Memory Used field of the REPORT line equals the configured memory size, so the large files exhaust the function's memory. AWS recommends using Max Memory Used to decide whether to add memory; increasing the memory setting gives each invocation enough memory to parse the large files."
    fr: "Le champ Max Memory Used de la ligne REPORT est égal à la taille de mémoire configurée : les gros fichiers épuisent donc la mémoire de la fonction. AWS recommande d'utiliser Max Memory Used pour décider s'il faut ajouter de la mémoire ; augmenter le paramètre de mémoire donne à chaque invocation assez de mémoire pour analyser les gros fichiers."
  options:
    b:
      en: "Ephemeral storage is disk space in /tmp; the failures come from memory being exhausted, not from a full /tmp directory."
      fr: "Le stockage éphémère est de l'espace disque dans /tmp ; les échecs viennent de l'épuisement de la mémoire, pas d'un répertoire /tmp plein."
    c:
      en: "The invocations end far before the timeout, so a longer timeout does not address the cause."
      fr: "Les invocations se terminent bien avant le délai d'expiration, donc un délai plus long ne traite pas la cause."
    d:
      en: "Reserved concurrency controls how many invocations run at the same time; each invocation would still run out of memory."
      fr: "La simultanéité réservée contrôle le nombre d'invocations exécutées en même temps ; chaque invocation manquerait toujours de mémoire."
references:
  - title: Best practices for working with AWS Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/best-practices.html
