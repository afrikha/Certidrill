id: dvac03-4b-lambda-logs-permissions
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer creates an AWS Lambda function with the AWS CLI. The execution role has a single inline policy that allows `dynamodb:PutItem` on one table. Invocations succeed and items are written, but no log group or log entries for the function appear in Amazon CloudWatch Logs.

    Which solution will make the function's logs appear?
  fr: |
    Un développeur crée une fonction AWS Lambda avec l'AWS CLI. Le rôle d'exécution possède une seule politique en ligne qui autorise `dynamodb:PutItem` sur une table. Les appels réussissent et les éléments sont écrits, mais aucun groupe de journaux ni aucune entrée de journal de la fonction n'apparaît dans Amazon CloudWatch Logs.

    Quelle solution fait apparaître les journaux de la fonction ?
body:
  options:
    - { id: a, text: { en: "Attach the `AWSXRayDaemonWriteAccess` managed policy to the execution role.", fr: "Attacher la politique gérée `AWSXRayDaemonWriteAccess` au rôle d'exécution." } }
    - { id: b, text: { en: "Attach the `AWSLambdaBasicExecutionRole` managed policy to the execution role.", fr: "Attacher la politique gérée `AWSLambdaBasicExecutionRole` au rôle d'exécution." } }
    - { id: c, text: { en: "Add a statement to the function's resource-based policy that allows `logs.amazonaws.com` to invoke it.", fr: "Ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise `logs.amazonaws.com` à l'appeler." } }
    - { id: d, text: { en: "Attach the `CloudWatchLogsReadOnlyAccess` managed policy to the developer's IAM user.", fr: "Attacher la politique gérée `CloudWatchLogsReadOnlyAccess` à l'utilisateur IAM du développeur." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Lambda uploads logs with the permissions of the execution role, which needs `logs:CreateLogGroup`, `logs:CreateLogStream` and `logs:PutLogEvents`. The `AWSLambdaBasicExecutionRole` managed policy grants them. When a function is created with the CLI, Lambda does not add them for you."
    fr: "Lambda charge les journaux avec les autorisations du rôle d'exécution, qui doit disposer de `logs:CreateLogGroup`, `logs:CreateLogStream` et `logs:PutLogEvents`. La politique gérée `AWSLambdaBasicExecutionRole` les accorde. Quand une fonction est créée avec la CLI, Lambda ne les ajoute pas à votre place."
  options:
    a:
      en: "This policy allows sending trace data to AWS X-Ray; it grants no CloudWatch Logs write permission."
      fr: "Cette politique autorise l'envoi de données de trace à AWS X-Ray ; elle n'accorde aucune autorisation d'écriture dans CloudWatch Logs."
    c:
      en: "CloudWatch Logs does not invoke the function; the function itself must be allowed to write logs through its execution role."
      fr: "CloudWatch Logs n'appelle pas la fonction ; c'est la fonction qui doit être autorisée à écrire des journaux au moyen de son rôle d'exécution."
    d:
      en: "Read permissions for the developer do not help when the logs are never written in the first place."
      fr: "Des autorisations de lecture pour le développeur n'aident pas si les journaux ne sont jamais écrits."
references:
  - title: Sending Lambda Event Function logs to CloudWatch Logs
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs.html
