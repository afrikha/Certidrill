id: dvac03-4c-cloudwatch-investigations
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany created a new AWS account in November 2026 for a serverless application. After a deployment, a CloudWatch alarm on the p99 latency of the application's API goes into the ALARM state. The developer wants an AI-powered assistant to scan the related metrics, logs, and deployment events and to propose root-cause hypotheses, starting from the alarm and without deploying additional tooling.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a créé un nouveau compte AWS en novembre 2026 pour une application sans serveur. Après un déploiement, une alarme CloudWatch sur le p99 de latence de l'API de l'application passe à l'état ALARM. Le développeur veut qu'un assistant fondé sur l'IA analyse les métriques, les journaux et les événements de déploiement associés et propose des hypothèses de cause racine, à partir de l'alarme et sans déployer d'outils supplémentaires.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on Amazon DevOps Guru for the stack of the application.", fr: "Activer Amazon DevOps Guru pour la pile de l'application." }
    - id: b
      text: { en: "Create a log anomaly detector for the log group of the API.", fr: "Créer un détecteur d'anomalies de journaux pour le groupe de journaux de l'API." }
    - id: c
      text: { en: "Start a CloudWatch investigation from the alarm.", fr: "Lancer une investigation CloudWatch à partir de l'alarme." }
    - id: d
      text: { en: "Opt in to AWS Compute Optimizer for the account.", fr: "Activer AWS Compute Optimizer pour le compte." }
answer: { optionId: c }
explanation:
  correct:
    en: "CloudWatch investigations is a generative AI-powered assistant that scans the telemetry related to an alarm, a metric or a Logs Insights query and surfaces related metrics, logs, deployment events and root-cause hypotheses. It runs inside CloudWatch, so no additional tooling has to be deployed."
    fr: "CloudWatch investigations est un assistant fondé sur l'IA générative qui analyse la télémétrie liée à une alarme, à une métrique ou à une requête Logs Insights et fait ressortir les métriques, journaux, événements de déploiement et hypothèses de cause racine associés. Il s'exécute dans CloudWatch : aucun outil supplémentaire n'est à déployer."
  options:
    a:
      en: "Amazon DevOps Guru stopped accepting new customers on October 29, 2026, so the new account cannot use it."
      fr: "Amazon DevOps Guru n'accepte plus de nouveaux clients depuis le 29 octobre 2026 : le nouveau compte ne peut donc pas l'utiliser."
    b:
      en: "A log anomaly detector flags unusual log patterns in one log group; it does not correlate metrics and deployment events or propose root-cause hypotheses."
      fr: "Un détecteur d'anomalies de journaux signale des modèles inhabituels dans un groupe de journaux ; il ne corrèle pas métriques et événements de déploiement et ne propose pas d'hypothèses de cause racine."
    d:
      en: "Compute Optimizer recommends resource configurations from utilization history; it does not investigate an alarm."
      fr: "Compute Optimizer recommande des configurations de ressources à partir de l'historique d'utilisation ; il n'investigue pas une alarme."
references:
  - title: CloudWatch investigations
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Investigations.html
  - title: Amazon DevOps Guru end of support
    url: https://docs.aws.amazon.com/devops-guru/latest/userguide/devops-guru-end-of-support.html
