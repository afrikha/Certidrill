id: dvac03-4a-cloudtrail-data-events
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Objects keep disappearing from an Amazon S3 bucket that an application uses. A developer searches the AWS CloudTrail Event history for DeleteObject events from the last two days and finds none. The account has no trail, and the developer must be able to identify who deletes objects in this bucket from now on.

    Which solution will meet this requirement?
  fr: |
    Des objets disparaissent régulièrement d'un compartiment Amazon S3 utilisé par une application. Un développeur recherche dans l'historique des événements AWS CloudTrail les événements DeleteObject des deux derniers jours et n'en trouve aucun. Le compte n'a aucun journal de suivi (trail), et le développeur doit pouvoir identifier dorénavant qui supprime des objets dans ce compartiment.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Create a trail that logs S3 data events for the bucket, and query the delivered log files with Amazon Athena.", fr: "Créer un journal de suivi qui enregistre les événements de données S3 du compartiment, et interroger les fichiers journaux livrés avec Amazon Athena." } }
    - { id: b, text: { en: "Run `aws cloudtrail lookup-events` with the EventName attribute set to DeleteObject.", fr: "Exécuter `aws cloudtrail lookup-events` avec l'attribut EventName défini sur DeleteObject." } }
    - { id: c, text: { en: "Extend the Event history search to the full 90 days that it retains.", fr: "Étendre la recherche dans l'historique des événements aux 90 jours complets qu'il conserve." } }
    - { id: d, text: { en: "Create a CloudTrail Insights selector that records unusual DeleteObject activity in the Event history.", fr: "Créer un sélecteur CloudTrail Insights qui enregistre l'activité DeleteObject inhabituelle dans l'historique des événements." } }
answer: { optionId: a }
explanation:
  correct:
    en: "DeleteObject is an object-level S3 data event. The Event history contains only the last 90 days of management events and does not show data events, so a trail or event data store must be configured to record data events for the bucket from now on. The log files delivered to S3 can then be queried with Athena."
    fr: "DeleteObject est un événement de données S3 au niveau objet. L'historique des événements ne contient que les 90 derniers jours d'événements de gestion et n'affiche pas les événements de données : il faut configurer un journal de suivi ou un magasin de données d'événements qui enregistre dorénavant les événements de données du compartiment. Les fichiers journaux livrés dans S3 peuvent ensuite être interrogés avec Athena."
  options:
    b:
      en: "lookup-events searches the same Event history, which does not contain data events."
      fr: "lookup-events interroge le même historique des événements, qui ne contient pas les événements de données."
    c:
      en: "A longer search range does not help, because data events are never recorded in the Event history."
      fr: "Une plage de recherche plus longue n'aide pas, car les événements de données ne sont jamais enregistrés dans l'historique des événements."
    d:
      en: "Insights events flag unusual API call volumes; they do not record each object deletion, and the Event history does not show Insights events either."
      fr: "Les événements Insights signalent des volumes inhabituels d'appels d'API ; ils n'enregistrent pas chaque suppression d'objet, et l'historique des événements n'affiche pas non plus les événements Insights."
references:
  - title: Working with CloudTrail event history
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
