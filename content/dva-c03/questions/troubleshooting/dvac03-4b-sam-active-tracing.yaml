id: dvac03-4b-sam-active-tracing
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany defines its AWS Lambda functions in an AWS SAM template. The developers want Lambda to record traces of the invocations of a function in AWS X-Ray, including the Lambda service segment and the function segment, for the requests that are sampled.

    Which property should the developers add to the `AWS::Serverless::Function` resource?
  fr: |
    AnyCompany définit ses fonctions AWS Lambda dans un modèle AWS SAM. Les développeurs veulent que Lambda enregistre dans AWS X-Ray des traces des appels d'une fonction, y compris le segment du service Lambda et le segment de la fonction, pour les requêtes échantillonnées.

    Quelle propriété les développeurs doivent-ils ajouter à la ressource `AWS::Serverless::Function` ?
body:
  options:
    - { id: a, text: "`Tracing: PassThrough`" }
    - { id: b, text: "`AutoPublishAlias: live`" }
    - { id: c, text: "`Tracing: Active`" }
    - { id: d, text: "`Environment: {Variables: {_X_AMZN_TRACE_ID: Active}}`" }
answer: { optionId: c }
explanation:
  correct:
    en: "`Tracing: Active` on an `AWS::Serverless::Function` turns on Lambda active tracing (`TracingConfig` with `Mode: Active` in CloudFormation). Lambda then sends traces for sampled requests, with an `AWS::Lambda` service segment and an `AWS::Lambda::Function` segment."
    fr: "`Tracing: Active` sur une ressource `AWS::Serverless::Function` active le traçage actif de Lambda (`TracingConfig` avec `Mode: Active` dans CloudFormation). Lambda envoie alors des traces pour les requêtes échantillonnées, avec un segment de service `AWS::Lambda` et un segment `AWS::Lambda::Function`."
  options:
    a:
      en: "In PassThrough mode, Lambda only forwards the tracing header downstream and does not send traces itself."
      fr: "En mode PassThrough, Lambda ne fait que transmettre l'en-tête de traçage en aval et n'envoie pas lui-même de traces."
    b:
      en: "`AutoPublishAlias` publishes a version and points an alias to it on each deployment; it does not turn on tracing."
      fr: "`AutoPublishAlias` publie une version et y fait pointer un alias à chaque déploiement ; il n'active pas le traçage."
    d:
      en: "`_X_AMZN_TRACE_ID` is a reserved variable that Lambda sets with the trace header of each invocation; it cannot be used to turn on tracing."
      fr: "`_X_AMZN_TRACE_ID` est une variable réservée que Lambda définit avec l'en-tête de trace de chaque appel ; elle ne permet pas d'activer le traçage."
references:
  - title: Visualize Lambda Event Function invocations using AWS X-Ray
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-xray.html
