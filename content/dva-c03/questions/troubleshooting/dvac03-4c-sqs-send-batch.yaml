id: dvac03-4c-sqs-send-batch
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AnyCompany application sends thousands of telemetry events per second to an Amazon SQS standard queue. Each event is about 2 KB and is sent with its own SendMessage call. The company wants to reduce the number of SQS API requests with minimal changes to the application.

    Which solution will meet these requirements?
  fr: |
    Une application d'AnyCompany envoie des milliers d'événements de télémétrie par seconde vers une file d'attente standard Amazon SQS. Chaque événement fait environ 2 Ko et est envoyé par son propre appel SendMessage. L'entreprise veut réduire le nombre de requêtes d'API SQS avec un minimum de modifications de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Group the events and send them with SendMessageBatch, with up to 10 messages per request.", fr: "Regrouper les événements et les envoyer avec SendMessageBatch, avec jusqu'à 10 messages par requête." }
    - id: b
      text: { en: "Use the Amazon SQS Extended Client Library to store each event payload in Amazon S3.", fr: "Utiliser l'Amazon SQS Extended Client Library pour stocker la charge utile de chaque événement dans Amazon S3." }
    - id: c
      text: { en: "Set WaitTimeSeconds to 20 on the requests that the application sends.", fr: "Définir WaitTimeSeconds à 20 sur les requêtes envoyées par l'application." }
    - id: d
      text: { en: "Convert the queue to a FIFO queue with content-based deduplication.", fr: "Convertir la file d'attente en file d'attente FIFO avec déduplication basée sur le contenu." }
answer: { optionId: a }
explanation:
  correct:
    en: "SendMessageBatch sends up to 10 messages in a single request, so batching the small events divides the number of send requests by up to 10. The change is limited to the code that sends the events."
    fr: "SendMessageBatch envoie jusqu'à 10 messages en une seule requête : regrouper les petits événements divise donc le nombre de requêtes d'envoi jusqu'à 10. La modification se limite au code qui envoie les événements."
  options:
    b:
      en: "The Extended Client Library is for payloads larger than the SQS message size limit; it adds an S3 request per message instead of reducing requests."
      fr: "L'Extended Client Library sert aux charges utiles qui dépassent la taille maximale d'un message SQS ; elle ajoute une requête S3 par message au lieu de réduire les requêtes."
    c:
      en: "WaitTimeSeconds is a ReceiveMessage parameter for long polling on the consumer side; it does not apply to sending messages."
      fr: "WaitTimeSeconds est un paramètre de ReceiveMessage pour l'interrogation longue côté consommateur ; il ne s'applique pas à l'envoi de messages."
    d:
      en: "A FIFO queue adds ordering and deduplication; each event would still be sent with its own request. An existing standard queue also cannot be converted to FIFO."
      fr: "Une file d'attente FIFO ajoute l'ordre et la déduplication ; chaque événement serait toujours envoyé par sa propre requête. De plus, une file d'attente standard existante ne peut pas être convertie en FIFO."
references:
  - title: Amazon SQS message quotas
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
