id: dvac03-4b-mask-sensitive-logs
objective: "4.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AnyCompany application writes customer email addresses and credit card numbers into its Amazon CloudWatch Logs log group. Developers must keep querying the log group with CloudWatch Logs Insights, but they must see these values masked. Only the security team must be able to see the original values. The application code must not change.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application d'AnyCompany écrit des adresses e-mail de clients et des numéros de carte de crédit dans son groupe de journaux Amazon CloudWatch Logs. Les développeurs doivent continuer à interroger le groupe de journaux avec CloudWatch Logs Insights, mais doivent voir ces valeurs masquées. Seule l'équipe de sécurité doit pouvoir voir les valeurs d'origine. Le code de l'application ne doit pas changer.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a data protection policy on the log group with managed data identifiers for email addresses and credit card numbers.", fr: "Créer une politique de protection des données sur le groupe de journaux avec des identifiants de données gérés pour les adresses e-mail et les numéros de carte de crédit." } }
    - { id: b, text: { en: "Associate a customer managed AWS KMS key with the log group and allow `kms:Decrypt` only to the security team.", fr: "Associer une clé AWS KMS gérée par le client au groupe de journaux et n'autoriser `kms:Decrypt` qu'à l'équipe de sécurité." } }
    - { id: c, text: { en: "Grant the `logs:Unmask` permission only to the IAM role that the security team uses.", fr: "Accorder l'autorisation `logs:Unmask` uniquement au rôle IAM utilisé par l'équipe de sécurité." } }
    - { id: d, text: { en: "Give the developers a saved Logs Insights query that uses `parse` to hide the sensitive fields.", fr: "Fournir aux développeurs une requête Logs Insights enregistrée qui utilise `parse` pour masquer les champs sensibles." } }
    - { id: e, text: { en: "Add a subscription filter with a Lambda function that redacts the values and writes them to a second log group.", fr: "Ajouter un filtre d'abonnement avec une fonction Lambda qui expurge les valeurs et les écrit dans un second groupe de journaux." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A CloudWatch Logs data protection policy detects the selected managed data identifiers at ingestion and masks them at every egress point, including Logs Insights. Only principals with the `logs:Unmask` permission can view the unmasked data, so granting it to the security team alone completes the solution."
    fr: "Une politique de protection des données CloudWatch Logs détecte les identifiants de données gérés sélectionnés à l'ingestion et les masque à chaque point de sortie, y compris Logs Insights. Seuls les principaux disposant de l'autorisation `logs:Unmask` peuvent voir les données non masquées : l'accorder à la seule équipe de sécurité complète la solution."
  options:
    b:
      en: "KMS encryption protects the data at rest; developers without `kms:Decrypt` could not query the log group at all, and those with it would see the values in clear."
      fr: "Le chiffrement KMS protège les données au repos ; les développeurs sans `kms:Decrypt` ne pourraient plus du tout interroger le groupe, et ceux qui l'ont verraient les valeurs en clair."
    d:
      en: "A saved query hides nothing for anyone who runs another query, so the values stay visible."
      fr: "Une requête enregistrée ne masque rien pour qui exécute une autre requête : les valeurs restent visibles."
    e:
      en: "The original log group still holds the clear values, and the solution adds a function and a second copy of the logs to manage."
      fr: "Le groupe de journaux d'origine contient toujours les valeurs en clair, et la solution ajoute une fonction et une seconde copie des journaux à gérer."
references:
  - title: Help protect sensitive log data with masking
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
