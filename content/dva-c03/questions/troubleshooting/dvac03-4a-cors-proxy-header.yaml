id: dvac03-4a-cors-proxy-header
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A single-page application served from https://app.example.com calls an Amazon API Gateway REST API whose GET /orders method uses a Lambda proxy integration. A developer enabled CORS on the resource in the API Gateway console and redeployed the stage. The OPTIONS preflight request now returns the expected Access-Control-Allow-Origin header, but the browser still blocks the GET responses because they have no Access-Control-Allow-Origin header.

    Which solution will resolve the issue?
  fr: |
    Une application monopage servie depuis https://app.example.com appelle une API REST Amazon API Gateway dont la méthode GET /orders utilise une intégration de proxy Lambda. Un développeur a activé CORS sur la ressource dans la console API Gateway et a redéployé l'étape. La requête préliminaire OPTIONS renvoie maintenant l'en-tête Access-Control-Allow-Origin attendu, mais le navigateur bloque toujours les réponses GET, car elles n'ont pas d'en-tête Access-Control-Allow-Origin.

    Quelle solution résout le problème ?
body:
  options:
    - { id: a, text: { en: "Add an Access-Control-Allow-Origin header mapping to the integration response of the GET method.", fr: "Ajouter un mappage d'en-tête Access-Control-Allow-Origin à la réponse d'intégration de la méthode GET." } }
    - { id: b, text: { en: "Return an Access-Control-Allow-Origin header in the headers of the response that the Lambda function returns.", fr: "Renvoyer un en-tête Access-Control-Allow-Origin dans les en-têtes de la réponse renvoyée par la fonction Lambda." } }
    - { id: c, text: { en: "Add an Access-Control-Allow-Credentials header to the OPTIONS method response.", fr: "Ajouter un en-tête Access-Control-Allow-Credentials à la réponse de méthode OPTIONS." } }
    - { id: d, text: { en: "Attach a resource policy to the API that allows requests from the app.example.com origin.", fr: "Attacher à l'API une politique de ressource qui autorise les requêtes provenant de l'origine app.example.com." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Enabling CORS in the console configures the OPTIONS preflight, but with a Lambda proxy integration API Gateway passes the function output to the client as is. To enable CORS for a proxy integration, the function must add Access-Control-Allow-Origin to the headers of its output."
    fr: "Activer CORS dans la console configure la requête préliminaire OPTIONS, mais avec une intégration de proxy Lambda, API Gateway transmet tel quel au client le résultat de la fonction. Pour activer CORS avec une intégration de proxy, la fonction doit ajouter Access-Control-Allow-Origin aux en-têtes de sa sortie."
  options:
    a:
      en: "A proxy integration does not use integration response mappings, so the header must come from the function output."
      fr: "Une intégration de proxy n'utilise pas les mappages de réponse d'intégration : l'en-tête doit provenir de la sortie de la fonction."
    c:
      en: "The preflight already succeeds; the missing header is on the actual GET responses, and credentials are not part of the problem."
      fr: "La requête préliminaire réussit déjà ; l'en-tête manquant concerne les réponses GET réelles, et les informations d'identification ne sont pas en cause."
    d:
      en: "Resource policies control who may invoke the API; they do not add CORS headers to responses."
      fr: "Les politiques de ressource contrôlent qui peut appeler l'API ; elles n'ajoutent pas d'en-têtes CORS aux réponses."
references:
  - title: Lambda proxy integrations in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-lambda-proxy-integrations.html
