id: dvac03-4c-ml-anomaly-detection
objective: "4.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The latency metric of AnyCompany's checkout service follows strong daily and weekly patterns, so alarms with static thresholds raise many false alarms. The team also wants to be notified when new or unusual patterns appear in the service's application logs, such as a new error message, without defining the patterns in advance.

    Which two actions should the team take? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    La métrique de latence du service de paiement d'AnyCompany suit de forts schémas quotidiens et hebdomadaires : les alarmes à seuil statique déclenchent donc beaucoup de fausses alertes. L'équipe veut aussi être avertie quand des modèles nouveaux ou inhabituels apparaissent dans les journaux applicatifs du service, comme un nouveau message d'erreur, sans définir ces modèles à l'avance.

    Quelles sont les deux actions que l'équipe doit effectuer ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a metric filter that matches ERROR in the logs, and an alarm on the resulting metric.", fr: "Créer un filtre de métriques qui détecte ERROR dans les journaux et une alarme sur la métrique obtenue." } }
    - { id: b, text: { en: "Create a CloudWatch alarm based on an anomaly detection model of the latency metric.", fr: "Créer une alarme CloudWatch fondée sur un modèle de détection d'anomalies de la métrique de latence." } }
    - { id: c, text: { en: "Create a composite alarm that combines several static-threshold latency alarms.", fr: "Créer une alarme composite qui combine plusieurs alarmes de latence à seuil statique." } }
    - { id: d, text: { en: "Increase the period of the static-threshold latency alarm to 1 hour.", fr: "Porter la période de l'alarme de latence à seuil statique à 1 heure." } }
    - { id: e, text: { en: "Create a CloudWatch Logs anomaly detector for the log group of the service.", fr: "Créer un détecteur d'anomalies CloudWatch Logs pour le groupe de journaux du service." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "CloudWatch anomaly detection uses statistical and machine learning algorithms to model a metric's normal behavior, including hourly, daily and weekly seasonality, and an alarm can compare the metric with the expected band instead of a static threshold. A log anomaly detector uses machine learning and pattern recognition to learn the normal content of a log group and flags new patterns or significant variations without predefined patterns."
    fr: "La détection d'anomalies CloudWatch utilise des algorithmes statistiques et d'apprentissage automatique pour modéliser le comportement normal d'une métrique, y compris la saisonnalité horaire, quotidienne et hebdomadaire, et une alarme peut comparer la métrique à la bande attendue au lieu d'un seuil statique. Un détecteur d'anomalies de journaux utilise l'apprentissage automatique et la reconnaissance de modèles pour apprendre le contenu normal d'un groupe de journaux et signale de nouveaux modèles ou des variations importantes sans modèle prédéfini."
  options:
    a:
      en: "A metric filter matches a pattern that the team must define in advance, so it does not detect new kinds of log messages."
      fr: "Un filtre de métriques détecte un modèle que l'équipe doit définir à l'avance : il ne détecte donc pas de nouveaux types de messages de journaux."
    c:
      en: "A composite alarm combines alarm states, but each underlying alarm still uses a static threshold that ignores the daily and weekly patterns."
      fr: "Une alarme composite combine des états d'alarmes, mais chaque alarme sous-jacente utilise toujours un seuil statique qui ignore les schémas quotidiens et hebdomadaires."
    d:
      en: "A longer period smooths the metric and delays detection, but the static threshold still does not follow the seasonal patterns."
      fr: "Une période plus longue lisse la métrique et retarde la détection, mais le seuil statique ne suit toujours pas les schémas saisonniers."
references:
  - title: Using CloudWatch anomaly detection
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
  - title: Log anomaly detection
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/LogsAnomalyDetection.html
