id: dvac03-4b-composite-alarm-noise
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has two CloudWatch alarms for an API: `HighLatency` and `High5xx`. Each alarm emails the on-call team, which receives many notifications for short latency spikes that do not affect customers. The team wants a single email only when both alarms are in the ALARM state at the same time.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de deux alarmes CloudWatch pour une API : `HighLatency` et `High5xx`. Chaque alarme envoie un e-mail à l'équipe d'astreinte, qui reçoit de nombreuses notifications pour de brefs pics de latence sans impact sur les clients. L'équipe veut un seul e-mail, uniquement quand les deux alarmes sont à l'état ALARM en même temps.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a composite alarm with the rule `ALARM(\"HighLatency\") AND ALARM(\"High5xx\")` and an SNS action, and remove the child alarms' actions.", fr: "Créer une alarme composite avec la règle `ALARM(\"HighLatency\") AND ALARM(\"High5xx\")` et une action SNS, et supprimer les actions des alarmes enfants." } }
    - { id: b, text: { en: "Change both alarms to require 3 out of 5 breaching data points before they go into the ALARM state and notify the team.", fr: "Modifier les deux alarmes pour exiger 3 points de données sur 5 en infraction avant de passer à l'état ALARM et de notifier l'équipe." } }
    - { id: c, text: { en: "Add a subscription filter policy to the SNS topic so that it delivers only messages from the `High5xx` alarm.", fr: "Ajouter une politique de filtre d'abonnement à la rubrique SNS pour qu'elle ne livre que les messages de l'alarme `High5xx`." } }
    - { id: d, text: { en: "Create an Amazon EventBridge rule that matches the state changes of both alarms to ALARM and targets the existing SNS topic.", fr: "Créer une règle Amazon EventBridge qui correspond aux passages à l'état ALARM des deux alarmes et cible la rubrique SNS existante." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A composite alarm evaluates the states of other alarms with a rule expression. With `AND`, it goes into ALARM only when both alarms are in ALARM and sends one notification; the child alarms keep evaluating their metrics without sending their own emails."
    fr: "Une alarme composite évalue l'état d'autres alarmes au moyen d'une expression de règle. Avec `AND`, elle ne passe à l'état ALARM que si les deux alarmes sont à ALARM et envoie une seule notification ; les alarmes enfants continuent d'évaluer leurs métriques sans envoyer leurs propres e-mails."
  options:
    b:
      en: "M out of N reduces alerts for very short spikes, but each alarm still notifies on its own, not only when both are in ALARM."
      fr: "Le mode M sur N réduit les alertes pour des pics très brefs, mais chaque alarme notifie toujours seule, pas uniquement quand les deux sont à ALARM."
    c:
      en: "Filtering on one alarm drops all latency information and still notifies whenever `High5xx` alone is in ALARM."
      fr: "Filtrer sur une alarme supprime toute information de latence et notifie toujours dès que `High5xx` seule est à ALARM."
    d:
      en: "The rule fires on a state change of either alarm; it cannot require both to be in ALARM at once."
      fr: "La règle se déclenche au changement d'état de l'une ou l'autre alarme ; elle ne peut pas exiger que les deux soient à ALARM en même temps."
references:
  - title: Create a composite alarm
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Create_Composite_Alarm.html
