id: dvac03-4b-codedeploy-deployment-notify
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys an application to Amazon EC2 instances with AWS CodeDeploy. The developers must receive an email when a deployment of the `web-prod` deployment group succeeds or fails.

    Which solutions will meet these requirements? (Choose two.) Each correct answer presents a complete solution.
  fr: |
    AnyCompany déploie une application sur des instances Amazon EC2 avec AWS CodeDeploy. Les développeurs doivent recevoir un e-mail quand un déploiement du groupe de déploiement `web-prod` réussit ou échoue.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a trigger to the deployment group for the deployment success and deployment failure events that publishes to an Amazon SNS topic with email subscriptions.", fr: "Ajouter au groupe de déploiement un déclencheur pour les événements de réussite et d'échec de déploiement qui publie dans une rubrique Amazon SNS avec des abonnements e-mail." } }
    - { id: b, text: { en: "Add a `ValidateService` hook script to the AppSpec file that publishes a message to an Amazon SNS topic.", fr: "Ajouter au fichier AppSpec un script de hook `ValidateService` qui publie un message dans une rubrique Amazon SNS." } }
    - { id: c, text: { en: "Create an Amazon EventBridge rule for CodeDeploy deployment state-change events with the SUCCESS and FAILURE states that targets an Amazon SNS topic.", fr: "Créer une règle Amazon EventBridge pour les événements de changement d'état de déploiement CodeDeploy avec les états SUCCESS et FAILURE, qui cible une rubrique Amazon SNS." } }
    - { id: d, text: { en: "Turn on automatic rollback when a deployment fails for the deployment group.", fr: "Activer la restauration automatique en cas d'échec de déploiement pour le groupe de déploiement." } }
    - { id: e, text: { en: "Configure an AWS CloudTrail trail to send an Amazon SNS notification each time it delivers a log file.", fr: "Configurer un journal de suivi AWS CloudTrail pour qu'il envoie une notification Amazon SNS à chaque livraison de fichier journal." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "CodeDeploy triggers on a deployment group publish deployment or instance events, such as Success and Failure, to an SNS topic. CodeDeploy also sends deployment state-change events to EventBridge, where a rule that matches the SUCCESS and FAILURE states can target an SNS topic. Either one emails the subscribers."
    fr: "Les déclencheurs CodeDeploy d'un groupe de déploiement publient des événements de déploiement ou d'instance, comme Success et Failure, dans une rubrique SNS. CodeDeploy envoie aussi des événements de changement d'état de déploiement à EventBridge, où une règle qui correspond aux états SUCCESS et FAILURE peut cibler une rubrique SNS. Chacune des deux solutions envoie un e-mail aux abonnés."
  options:
    b:
      en: "A lifecycle hook runs only when the deployment reaches that step on an instance, so a deployment that fails earlier sends nothing."
      fr: "Un hook de cycle de vie ne s'exécute que si le déploiement atteint cette étape sur une instance : un déploiement qui échoue plus tôt n'envoie rien."
    d:
      en: "Automatic rollback redeploys the last good revision; it does not notify anyone."
      fr: "La restauration automatique redéploie la dernière révision valide ; elle ne notifie personne."
    e:
      en: "CloudTrail notifications report that a log file was delivered, not that a deployment finished."
      fr: "Les notifications CloudTrail signalent la livraison d'un fichier journal, pas la fin d'un déploiement."
references:
  - title: Monitoring deployments with Amazon SNS event notifications
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/monitoring-sns-event-notifications.html
  - title: Monitoring deployments with Amazon CloudWatch Events
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/monitoring-cloudwatch-events.html
