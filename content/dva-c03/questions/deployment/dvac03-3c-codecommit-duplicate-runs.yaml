id: dvac03-3c-codecommit-duplicate-runs
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer creates an AWS CodePipeline pipeline with AWS CloudFormation. The source action uses an AWS CodeCommit repository and the `main` branch, and its configuration does not set PollForSourceChanges. The developer also creates an Amazon EventBridge rule that starts the pipeline when the `main` branch changes. Every push to `main` now starts two pipeline executions. The developer wants one execution per push, with change detection that AWS recommends.

    Which solution will meet these requirements?
  fr: |
    Un développeur crée un pipeline AWS CodePipeline avec AWS CloudFormation. L'action source utilise un référentiel AWS CodeCommit et la branche `main`, et sa configuration ne définit pas PollForSourceChanges. Le développeur crée aussi une règle Amazon EventBridge qui démarre le pipeline lorsque la branche `main` change. Chaque push sur `main` démarre désormais deux exécutions du pipeline. Le développeur veut une exécution par push, avec la détection des modifications recommandée par AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Delete the EventBridge rule so that the source action detects changes with its default configuration.", fr: "Supprimer la règle EventBridge afin que l'action source détecte les modifications avec sa configuration par défaut." }
    - id: b
      text: { en: "Set PollForSourceChanges to false in the configuration of the CodeCommit source action.", fr: "Définir PollForSourceChanges sur false dans la configuration de l'action source CodeCommit." }
    - id: c
      text: { en: "Set OutputArtifactFormat to CODEBUILD_CLONE_REF in the configuration of the source action.", fr: "Définir OutputArtifactFormat sur CODEBUILD_CLONE_REF dans la configuration de l'action source." }
    - id: d
      text: { en: "Set the execution mode of the pipeline to SUPERSEDED so that the duplicate execution is discarded.", fr: "Définir le mode d'exécution du pipeline sur SUPERSEDED afin que l'exécution en double soit abandonnée." }
answer: { optionId: b }
explanation:
  correct:
    en: "When PollForSourceChanges is omitted, it defaults to true, so the pipeline both polls the repository and is started by the EventBridge rule. AWS recommends EventBridge for CodeCommit change detection and says to set PollForSourceChanges to false to avoid duplicate executions."
    fr: "Lorsque PollForSourceChanges est omis, sa valeur par défaut est true : le pipeline interroge donc le référentiel et est aussi démarré par la règle EventBridge. AWS recommande EventBridge pour détecter les modifications CodeCommit et indique de définir PollForSourceChanges sur false pour éviter les exécutions en double."
  options:
    a:
      en: "Without the rule, the pipeline falls back to polling, which AWS does not recommend for change detection."
      fr: "Sans la règle, le pipeline revient à l'interrogation périodique, qu'AWS ne recommande pas pour détecter les modifications."
    c:
      en: "The output artifact format controls what the source action passes to CodeBuild, not how the pipeline is started."
      fr: "Le format de l'artefact de sortie contrôle ce que l'action source transmet à CodeBuild, pas la façon dont le pipeline est démarré."
    d:
      en: "SUPERSEDED is already the default mode; both executions still start, and the cause of the duplicates remains."
      fr: "SUPERSEDED est déjà le mode par défaut ; les deux exécutions démarrent toujours, et la cause des doublons demeure."
references:
  - title: CodeCommit source action reference
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodeCommit.html
