id: dvac03-3b-ctr-fargate-cpu-memory
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at AnyCompany registers an Amazon ECS task definition for AWS Fargate with the following task-level settings. Registration fails because the combination is not valid. The application needs 4 GB of memory and very little CPU, and the company wants the MOST cost-effective valid configuration.

    ```json
    { "requiresCompatibilities": ["FARGATE"], "networkMode": "awsvpc", "cpu": "256", "memory": "4096" }
    ```

    Which change will meet these requirements?
  fr: |
    Un développeur d'AnyCompany enregistre une définition de tâche Amazon ECS pour AWS Fargate avec les paramètres de niveau tâche suivants. L'enregistrement échoue parce que la combinaison n'est pas valide. L'application a besoin de 4 Go de mémoire et de très peu de processeur, et l'entreprise veut la configuration valide la PLUS rentable.

    ```json
    { "requiresCompatibilities": ["FARGATE"], "networkMode": "awsvpc", "cpu": "256", "memory": "4096" }
    ```

    Quelle modification répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set cpu to 512 and keep memory at 4096.", fr: "Définir cpu sur 512 et conserver memory à 4096." } }
    - { id: b, text: { en: "Keep cpu at 256 and set memory to 2048.", fr: "Conserver cpu à 256 et définir memory sur 2048." } }
    - { id: c, text: { en: "Set cpu to 1024 and keep memory at 4096.", fr: "Définir cpu sur 1024 et conserver memory à 4096." } }
    - { id: d, text: { en: "Remove the task-level cpu and memory and set memory to 4096 in the container definition only.", fr: "Supprimer cpu et memory au niveau de la tâche et définir memory sur 4096 uniquement dans la définition de conteneur." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Fargate task definitions must set CPU and memory at the task level, using one of the supported combinations. With 256 CPU units (0.25 vCPU) memory can go up to 2 GB, while 512 CPU units (0.5 vCPU) support 1 to 4 GB, so 512 with 4096 MiB is the smallest valid size that provides 4 GB."
    fr: "Les définitions de tâche Fargate doivent définir le processeur et la mémoire au niveau de la tâche, selon l'une des combinaisons prises en charge. Avec 256 unités de processeur (0,25 vCPU), la mémoire peut aller jusqu'à 2 Go, alors que 512 unités (0,5 vCPU) acceptent de 1 à 4 Go : 512 avec 4 096 Mio est donc la plus petite taille valide qui fournit 4 Go."
  options:
    b:
      en: "This combination is valid but gives the application only 2 GB of the 4 GB of memory it needs."
      fr: "Cette combinaison est valide, mais ne donne à l'application que 2 Go des 4 Go de mémoire dont elle a besoin."
    c:
      en: "1 vCPU with 4 GB is valid but costs more than 0.5 vCPU with 4 GB, and the application needs very little CPU."
      fr: "1 vCPU avec 4 Go est valide, mais coûte plus cher que 0,5 vCPU avec 4 Go, et l'application a besoin de très peu de processeur."
    d:
      en: "Fargate requires CPU and memory at the task level, so a task definition without them cannot run on Fargate."
      fr: "Fargate exige le processeur et la mémoire au niveau de la tâche : une définition de tâche sans ces valeurs ne peut pas s'exécuter sur Fargate."
references:
  - title: Amazon ECS task definition differences for Fargate
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-tasks-services.html
