id: dvac03-3a-regional-endpoint
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A REST API was created in Amazon API Gateway with the default endpoint type. Almost all of its traffic is a high volume of POST requests from Amazon EC2 instances in the same AWS Region as the API. The API must remain reachable from the internet for an external monitoring service. The developer wants to reduce connection overhead for the EC2 callers.

    Which solution will meet these requirements?
  fr: |
    Une API REST a été créée dans Amazon API Gateway avec le type de point de terminaison par défaut. Presque tout son trafic est un volume élevé de requêtes POST provenant d'instances Amazon EC2 situées dans la même Région AWS que l'API. L'API doit rester accessible depuis Internet pour un service de surveillance externe. Le développeur veut réduire la surcharge de connexion des instances EC2 appelantes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the endpoint type of the API to private and create an interface VPC endpoint for the EC2 instances.", fr: "Changer le type de point de terminaison de l'API en privé et créer un point de terminaison de VPC d'interface pour les instances EC2." } }
    - { id: b, text: { en: "Change the endpoint type of the API from edge-optimized to Regional.", fr: "Changer le type de point de terminaison de l'API d'optimisé pour la périphérie à régional." } }
    - { id: c, text: { en: "Enable caching on the stage so that repeated requests are served by API Gateway.", fr: "Activer la mise en cache sur l'étape pour que les requêtes répétées soient servies par API Gateway." } }
    - { id: d, text: { en: "Create a usage plan with a higher throttling rate for the API keys of the EC2 instances.", fr: "Créer un plan d'utilisation avec un débit de limitation plus élevé pour les clés d'API des instances EC2." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Edge-optimized is the default endpoint type for REST APIs and routes requests through the nearest CloudFront Point of Presence. A Regional endpoint is meant for clients in the same Region and reduces connection overhead for callers such as EC2 instances, while staying public."
    fr: "Le type optimisé pour la périphérie est le type de point de terminaison par défaut des API REST et achemine les requêtes par le point de présence CloudFront le plus proche. Un point de terminaison régional est destiné aux clients de la même Région et réduit la surcharge de connexion pour des appelants comme des instances EC2, tout en restant public."
  options:
    a:
      en: "A private API can be called only from a VPC, so the external monitoring service could no longer reach it."
      fr: "Une API privée ne peut être appelée que depuis un VPC : le service de surveillance externe ne pourrait plus l'atteindre."
    c:
      en: "Only GET methods are cached by default, and caching does not change the connection path of POST requests."
      fr: "Seules les méthodes GET sont mises en cache par défaut, et la mise en cache ne change pas le chemin de connexion des requêtes POST."
    d:
      en: "Throttling limits do not reduce connection overhead; they only cap the request rate."
      fr: "Les limites de débit ne réduisent pas la surcharge de connexion ; elles plafonnent seulement le débit des requêtes."
references:
  - title: API endpoint types for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-endpoint-types.html
