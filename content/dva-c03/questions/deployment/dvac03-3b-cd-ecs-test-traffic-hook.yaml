id: dvac03-3b-cd-ecs-test-traffic-hook
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany deploys an Amazon ECS service with AWS CodeDeploy blue/green deployments behind an Application Load Balancer that has a production listener and a test listener. A Lambda function runs integration tests through the test listener. The tests must run as soon as the test listener routes traffic to the replacement task set, before any production traffic reaches it, and a failure must roll back the deployment.

    In which AppSpec hook should the developer register the Lambda function?
  fr: |
    AnyCompany déploie un service Amazon ECS avec des déploiements bleu/vert AWS CodeDeploy derrière un Application Load Balancer doté d'un écouteur de production et d'un écouteur de test. Une fonction Lambda exécute des tests d'intégration au moyen de l'écouteur de test. Les tests doivent s'exécuter dès que l'écouteur de test achemine le trafic vers l'ensemble de tâches de remplacement, avant que le trafic de production ne l'atteigne, et un échec doit restaurer le déploiement.

    Dans quel hook AppSpec le développeur doit-il enregistrer la fonction Lambda ?
body:
  options:
    - { id: a, text: "AfterAllowTestTraffic" }
    - { id: b, text: "BeforeInstall" }
    - { id: c, text: "AfterAllowTraffic" }
    - { id: d, text: "ValidateService" }
answer: { optionId: a }
explanation:
  correct:
    en: "For ECS deployments, AfterAllowTestTraffic runs after the test listener serves traffic to the replacement task set and before production traffic is shifted, and its result can trigger a rollback. The hook function reports its result to CodeDeploy with PutLifecycleEventHookExecutionStatus."
    fr: "Pour les déploiements ECS, AfterAllowTestTraffic s'exécute après que l'écouteur de test a servi du trafic à l'ensemble de tâches de remplacement et avant le basculement du trafic de production, et son résultat peut déclencher une restauration. La fonction du hook signale son résultat à CodeDeploy avec PutLifecycleEventHookExecutionStatus."
  options:
    b:
      en: "BeforeInstall runs before the replacement task set is created, so there is nothing to test, and a rollback is not possible at that point."
      fr: "BeforeInstall s'exécute avant la création de l'ensemble de tâches de remplacement : il n'y a rien à tester, et aucune restauration n'est possible à ce stade."
    c:
      en: "AfterAllowTraffic runs after production traffic has been shifted to the replacement task set, which is too late."
      fr: "AfterAllowTraffic s'exécute après le basculement du trafic de production vers l'ensemble de tâches de remplacement, ce qui est trop tard."
    d:
      en: "ValidateService is a hook of EC2/on-premises deployments; it does not exist for ECS deployments."
      fr: "ValidateService est un hook des déploiements EC2/sur site ; il n'existe pas pour les déploiements ECS."
references:
  - title: AppSpec 'hooks' section
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html
