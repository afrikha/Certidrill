id: dvac03-3a-rds-secret-rotation
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application on Amazon ECS connects to an Amazon Aurora MySQL database. The database credentials differ between the test and production environments. The security team requires the credentials to be rotated automatically every 30 days, and the application must read the current credentials at run time.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une application sur Amazon ECS se connecte à une base de données Amazon Aurora MySQL. Les informations d'identification de la base de données diffèrent entre les environnements de test et de production. L'équipe de sécurité exige qu'elles soient renouvelées automatiquement tous les 30 jours, et l'application doit lire les informations d'identification actuelles à l'exécution.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Store the credentials in Parameter Store SecureString parameters and write a scheduled Lambda function that changes them every 30 days.", fr: "Stocker les informations d'identification dans des paramètres SecureString de Parameter Store et écrire une fonction Lambda planifiée qui les modifie tous les 30 jours." } }
    - { id: b, text: { en: "Store the credentials in environment variables of the task definition and register a new revision with new values every 30 days.", fr: "Stocker les informations d'identification dans des variables d'environnement de la définition de tâche et enregistrer tous les 30 jours une nouvelle révision avec de nouvelles valeurs." } }
    - { id: c, text: { en: "Store the credentials in an AWS AppConfig freeform configuration profile and deploy a new version every 30 days.", fr: "Stocker les informations d'identification dans un profil de configuration libre AWS AppConfig et déployer une nouvelle version tous les 30 jours." } }
    - { id: d, text: { en: "Store the credentials of each environment in an AWS Secrets Manager secret with automatic rotation on a 30-day schedule.", fr: "Stocker les informations d'identification de chaque environnement dans un secret AWS Secrets Manager avec une rotation automatique planifiée tous les 30 jours." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Secrets Manager rotates secrets on a schedule, either with managed rotation or with a rotation Lambda function that updates both the secret and the database. One secret per environment keeps the values separate, and the application reads the current version at run time."
    fr: "Secrets Manager renouvelle les secrets selon un calendrier, soit par rotation gérée, soit par une fonction Lambda de rotation qui met à jour à la fois le secret et la base de données. Un secret par environnement sépare les valeurs, et l'application lit la version actuelle à l'exécution."
  options:
    a:
      en: "Parameter Store has no built-in rotation, so the team must write and maintain the code that changes both the parameter and the database password."
      fr: "Parameter Store n'a pas de rotation intégrée : l'équipe doit écrire et maintenir le code qui modifie à la fois le paramètre et le mot de passe de la base de données."
    b:
      en: "Plaintext environment variables expose the credentials, and each change needs a manual revision and redeployment."
      fr: "Les variables d'environnement en texte clair exposent les informations d'identification, et chaque changement demande une révision et un redéploiement manuels."
    c:
      en: "AppConfig deploys configuration but does not change the database password, so rotation remains a manual process."
      fr: "AppConfig déploie de la configuration mais ne modifie pas le mot de passe de la base de données : la rotation reste manuelle."
references:
  - title: Rotate AWS Secrets Manager secrets
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html
