id: dvac03-3b-tevt-http-api-v2-method
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany migrated a Python AWS Lambda function from an Amazon API Gateway REST API to an HTTP API. The HTTP API integration uses payload format version 2.0, which the team must keep because the function reads the cookies array. The team still runs its unit tests with events copied from the REST API proxy template. The tests pass, but in production the function raises a KeyError on the following line.

    ```python
    method = event["httpMethod"]
    ```

    Which solution will fix the function and keep the tests aligned with production events?
  fr: |
    AnyCompany a migré une fonction AWS Lambda Python d'une API REST Amazon API Gateway vers une API HTTP. L'intégration de l'API HTTP utilise la version 2.0 du format de charge utile, que l'équipe doit conserver parce que la fonction lit le tableau cookies. L'équipe exécute toujours ses tests unitaires avec des événements copiés du modèle de proxy de l'API REST. Les tests réussissent, mais en production la fonction lève une erreur KeyError sur la ligne suivante.

    ```python
    method = event["httpMethod"]
    ```

    Quelle solution corrige la fonction et maintient les tests alignés sur les événements de production ?
body:
  options:
    - { id: a, text: { en: "Change the integration to payload format version 1.0 and keep the REST API test events.", fr: "Passer l'intégration à la version 1.0 du format de charge utile et conserver les événements de test de l'API REST." } }
    - { id: b, text: { en: "Read the method from event[\"headers\"][\"method\"] and add that header to the existing test events.", fr: "Lire la méthode dans event[\"headers\"][\"method\"] et ajouter cet en-tête aux événements de test existants." } }
    - { id: c, text: { en: "Read the method from event[\"requestContext\"][\"http\"][\"method\"] and rebuild the test events in the version 2.0 format.", fr: "Lire la méthode dans event[\"requestContext\"][\"http\"][\"method\"] et reconstruire les événements de test au format de la version 2.0." } }
    - { id: d, text: { en: "Enable the Lambda proxy integration option on the HTTP API route so that API Gateway adds the httpMethod field.", fr: "Activer l'option d'intégration de proxy Lambda sur la route de l'API HTTP afin qu'API Gateway ajoute le champ httpMethod." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In payload format version 2.0, the HTTP method is in requestContext.http.method, while version 1.0 uses the top-level httpMethod field. The handler must read the new location, and the test events must use the 2.0 shape (version, routeKey, rawPath, cookies, requestContext.http) to catch this kind of difference."
    fr: "Dans la version 2.0 du format de charge utile, la méthode HTTP se trouve dans requestContext.http.method, alors que la version 1.0 utilise le champ httpMethod de premier niveau. Le gestionnaire doit lire le nouvel emplacement, et les événements de test doivent utiliser la forme 2.0 (version, routeKey, rawPath, cookies, requestContext.http) pour détecter ce type de différence."
  options:
    a:
      en: "Version 1.0 would restore httpMethod, but the team must keep version 2.0 because the function depends on the cookies array."
      fr: "La version 1.0 rétablirait httpMethod, mais l'équipe doit conserver la version 2.0, car la fonction dépend du tableau cookies."
    b:
      en: "The method is not sent as a header; adding a fake header to the tests would make them pass while production requests still fail."
      fr: "La méthode n'est pas envoyée comme en-tête ; ajouter un faux en-tête aux tests les ferait réussir alors que les requêtes de production échoueraient toujours."
    d:
      en: "HTTP API Lambda integrations have no separate proxy option to turn on, and nothing adds httpMethod to a version 2.0 event."
      fr: "Les intégrations Lambda des API HTTP n'ont pas d'option de proxy distincte à activer, et rien n'ajoute httpMethod à un événement de la version 2.0."
references:
  - title: Create AWS Lambda proxy integrations for HTTP APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-develop-integrations-lambda.html
