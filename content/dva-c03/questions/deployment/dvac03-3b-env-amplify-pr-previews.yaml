id: dvac03-3b-env-amplify-pr-previews
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany hosts a frontend web app on AWS Amplify Hosting with continuous deployment from the main branch of a private GitHub repository. Reviewers want every pull request to be built and deployed to its own temporary URL so that they can check the change before merging. The temporary deployment must be removed automatically when the pull request is closed.

    Which solution will meet these requirements?
  fr: |
    AnyCompany héberge une application web frontend sur AWS Amplify Hosting avec un déploiement continu depuis la branche main d'un référentiel GitHub privé. Les relecteurs veulent que chaque pull request soit générée et déployée sur sa propre URL temporaire afin de vérifier la modification avant la fusion. Le déploiement temporaire doit être supprimé automatiquement lorsque la pull request est fermée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Connect each feature branch to the app manually and disconnect it after the pull request is merged.", fr: "Connecter manuellement chaque branche de fonctionnalité à l'application et la déconnecter après la fusion de la pull request." } }
    - { id: b, text: { en: "Turn on password protection for the main branch and share the password with the reviewers.", fr: "Activer la protection par mot de passe pour la branche main et partager le mot de passe avec les relecteurs." } }
    - { id: c, text: { en: "Turn on pull request previews for the main branch in the Previews settings of the app.", fr: "Activer les aperçus de pull requests pour la branche main dans les paramètres Previews de l'application." } }
    - { id: d, text: { en: "Create a second Amplify app that deploys the main branch to a staging custom domain.", fr: "Créer une seconde application Amplify qui déploie la branche main sur un domaine personnalisé de préproduction." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With web previews for pull requests, Amplify builds each pull request against the selected branch and deploys it to a unique preview URL. When the pull request is closed, Amplify deletes the preview URL and any temporary backend environment that it created."
    fr: "Avec les aperçus web des pull requests, Amplify génère chaque pull request ciblant la branche sélectionnée et la déploie sur une URL d'aperçu unique. Lorsque la pull request est fermée, Amplify supprime l'URL d'aperçu et tout environnement backend temporaire qu'il a créé."
  options:
    a:
      en: "Manual branch connections work but require manual setup and cleanup for every pull request."
      fr: "Les connexions de branche manuelles fonctionnent, mais exigent une configuration et un nettoyage manuels pour chaque pull request."
    b:
      en: "Password protection restricts access to an existing branch deployment; it does not deploy pull requests."
      fr: "La protection par mot de passe restreint l'accès au déploiement d'une branche existante ; elle ne déploie pas les pull requests."
    d:
      en: "A second app would deploy only main again, not the unmerged changes of each pull request."
      fr: "Une seconde application déploierait de nouveau uniquement main, pas les modifications non fusionnées de chaque pull request."
references:
  - title: Web previews for pull requests
    url: https://docs.aws.amazon.com/amplify/latest/userguide/pr-previews.html
