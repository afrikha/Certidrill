id: dvac03-3a-sam-build-container
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer uses AWS SAM on a macOS laptop to build a Python Lambda function. The function depends on a library that contains natively compiled C extensions and has no prebuilt wheel. After `sam build` and `sam deploy`, the function fails at import because the compiled module is not compatible with the Lambda execution environment. Docker is installed on the laptop. The developer wants to keep the same `sam build` and `sam deploy` workflow.

    Which solution will meet these requirements?
  fr: |
    Un développeur utilise AWS SAM sur un ordinateur portable macOS pour créer une fonction Lambda Python. La fonction dépend d'une bibliothèque qui contient des extensions C compilées nativement et qui n'a pas de wheel précompilé. Après `sam build` et `sam deploy`, la fonction échoue à l'importation, car le module compilé n'est pas compatible avec l'environnement d'exécution Lambda. Docker est installé sur l'ordinateur portable. Le développeur veut conserver le même flux `sam build` et `sam deploy`.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run sam build --use-container so that the dependencies are built inside a Lambda-like Docker container.", fr: "Exécuter sam build --use-container pour que les dépendances soient construites dans un conteneur Docker semblable à Lambda." } }
    - { id: b, text: { en: "Run sam build --cached so that the build reuses the artifacts of the last successful build.", fr: "Exécuter sam build --cached pour que le build réutilise les artefacts du dernier build réussi." } }
    - { id: c, text: { en: "Run sam build --parallel so that the functions and layers of the template are built at the same time.", fr: "Exécuter sam build --parallel pour que les fonctions et les couches du modèle soient construites en même temps." } }
    - { id: d, text: { en: "Set the Architectures property of the function to arm64 to match the processor of the laptop.", fr: "Définir la propriété Architectures de la fonction sur arm64 pour correspondre au processeur de l'ordinateur portable." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The --use-container option of sam build builds the function inside a Lambda-like Docker container, which is the documented choice for packages with natively compiled dependencies. The compiled modules then target the Linux environment of Lambda, and sam deploy is unchanged."
    fr: "L'option --use-container de sam build construit la fonction dans un conteneur Docker semblable à Lambda, ce qui est le choix documenté pour les packages avec des dépendances compilées nativement. Les modules compilés ciblent alors l'environnement Linux de Lambda, et sam deploy reste inchangé."
  options:
    b:
      en: "Caching reuses unchanged build artifacts, which still contain the modules compiled for macOS."
      fr: "La mise en cache réutilise les artefacts de build inchangés, qui contiennent toujours les modules compilés pour macOS."
    c:
      en: "Parallel builds only change the build order and speed, not the platform the modules are compiled for."
      fr: "Les builds parallèles changent seulement l'ordre et la vitesse du build, pas la plateforme pour laquelle les modules sont compilés."
    d:
      en: "The modules are compiled for macOS, not Linux, so matching the processor architecture does not make them loadable by Lambda."
      fr: "Les modules sont compilés pour macOS, pas pour Linux : faire correspondre l'architecture du processeur ne les rend pas chargeables par Lambda."
references:
  - title: sam build
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-cli-command-reference-sam-build.html
