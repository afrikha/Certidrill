id: dvac03-3a-openapi-mock-import
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A partner has shared an OpenAPI 3.0 definition with 30 operations for an API that it has not built yet. A developer at AnyCompany must give the team a mock of every operation in Amazon API Gateway within a day so that integration code can be written. The mock must not call any backend, and the developer wants to avoid creating each method by hand.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    Un partenaire a partagé une définition OpenAPI 3.0 de 30 opérations pour une API qu'il n'a pas encore créée. Un développeur d'AnyCompany doit fournir à l'équipe, dans la journée, une version fictive (mock) de chaque opération dans Amazon API Gateway pour que le code d'intégration puisse être écrit. La version fictive ne doit appeler aucun backend, et le développeur veut éviter de créer chaque méthode à la main.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: { en: "Create the 30 methods in the API Gateway console and configure a mock integration on each one.", fr: "Créer les 30 méthodes dans la console API Gateway et configurer une intégration fictive sur chacune." } }
    - { id: b, text: { en: "Add an x-amazon-apigateway-integration extension of type mock, with request templates and responses, to each operation and import the definition as a REST API.", fr: "Ajouter à chaque opération une extension x-amazon-apigateway-integration de type mock, avec des modèles de requête et des réponses, et importer la définition comme API REST." } }
    - { id: c, text: { en: "Import the definition as an HTTP API and set the x-amazon-apigateway-integration type of each operation to mock.", fr: "Importer la définition comme API HTTP et définir le type x-amazon-apigateway-integration de chaque opération sur mock." } }
    - { id: d, text: { en: "Add an x-amazon-apigateway-integration extension of type http_proxy that points to https://example.com to each operation and import the definition.", fr: "Ajouter à chaque opération une extension x-amazon-apigateway-integration de type http_proxy qui pointe vers https://example.com, et importer la définition." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The x-amazon-apigateway-integration extension defines the integration of each operation in an OpenAPI definition, and its type mock integrates with API Gateway without invoking any backend. The requestTemplates and responses properties provide the status code and the sample bodies, so one import creates all 30 mocked methods."
    fr: "L'extension x-amazon-apigateway-integration définit l'intégration de chaque opération dans une définition OpenAPI, et son type mock intègre API Gateway sans appeler de backend. Les propriétés requestTemplates et responses fournissent le code d'état et les corps d'exemple : un seul import crée les 30 méthodes fictives."
  options:
    a:
      en: "This produces the same mocks, but creating 30 methods by hand is the effort the developer wants to avoid."
      fr: "Cela produit les mêmes versions fictives, mais créer 30 méthodes à la main est l'effort que le développeur veut éviter."
    c:
      en: "HTTP APIs do not support mock integrations, so the operations cannot be mocked in an HTTP API."
      fr: "Les API HTTP ne prennent pas en charge les intégrations fictives : les opérations ne peuvent pas être simulées dans une API HTTP."
    d:
      en: "An http_proxy integration forwards every request to an HTTP backend, which the mock must not call."
      fr: "Une intégration http_proxy transmet chaque requête à un backend HTTP, que la version fictive ne doit pas appeler."
references:
  - title: x-amazon-apigateway-integration object
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-swagger-extensions-integration.html
