id: dvac03-3a-ecr-docker-login
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A build script runs on an Amazon EC2 instance that has an instance profile with permissions to push to an Amazon ECR repository in the us-east-1 Region of account 111122223333. The script builds an image with Docker, but `docker push` fails with an authentication error. The script must not use long-lived credentials.

    Which command should the script run before `docker push`?
  fr: |
    Un script de build s'exécute sur une instance Amazon EC2 dont le profil d'instance a les autorisations de transférer vers un référentiel Amazon ECR de la Région us-east-1 du compte 111122223333. Le script crée une image avec Docker, mais `docker push` échoue avec une erreur d'authentification. Le script ne doit pas utiliser d'informations d'identification de longue durée.

    Quelle commande le script doit-il exécuter avant `docker push` ?
body:
  options:
    - { id: a, text: "aws ecr get-authorization-token --region us-east-1 | docker login --username AWS --password-stdin 111122223333.dkr.ecr.us-east-1.amazonaws.com" }
    - { id: b, text: "aws sts get-session-token | docker login --username AWS --password-stdin 111122223333.dkr.ecr.us-east-1.amazonaws.com" }
    - { id: c, text: "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 111122223333.dkr.ecr.us-east-1.amazonaws.com" }
    - { id: d, text: "aws ecr describe-registry --region us-east-1 | docker login --username AWS --password-stdin 111122223333.dkr.ecr.us-east-1.amazonaws.com" }
answer: { optionId: c }
explanation:
  correct:
    en: "aws ecr get-login-password retrieves and decodes an authorization token for the registry, which is piped to docker login with the user name AWS. The token uses the permissions of the instance profile and is valid for 12 hours in the Region that issued it."
    fr: "aws ecr get-login-password récupère et décode un jeton d'autorisation pour le registre, qui est transmis à docker login avec le nom d'utilisateur AWS. Le jeton utilise les autorisations du profil d'instance et est valide 12 heures dans la Région qui l'a émis."
  options:
    a:
      en: "get-authorization-token returns a JSON document with a base64-encoded token; piping that output does not give docker login a valid password."
      fr: "get-authorization-token renvoie un document JSON avec un jeton encodé en base64 : transmettre cette sortie ne donne pas un mot de passe valide à docker login."
    b:
      en: "STS session tokens are AWS API credentials, not Docker registry passwords, and the ECR registry rejects them."
      fr: "Les jetons de session STS sont des informations d'identification d'API AWS, pas des mots de passe de registre Docker, et le registre ECR les refuse."
    d:
      en: "describe-registry returns the registry settings, not an authentication token."
      fr: "describe-registry renvoie les paramètres du registre, pas un jeton d'authentification."
references:
  - title: Private registry authentication in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/registry_auth.html
