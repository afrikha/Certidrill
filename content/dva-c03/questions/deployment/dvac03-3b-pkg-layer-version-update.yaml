id: dvac03-3b-pkg-layer-version-update
objective: "3.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's AWS Lambda function billing-export uses version 3 of a layer named pdf-tools. Clients invoke the function through an alias named prod, which points to published version 12 of the function. A developer fixed a bug in the layer and published it as layer version 4. Production must use the fixed layer, and clients must keep invoking the prod alias.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    La fonction AWS Lambda billing-export d'AnyCompany utilise la version 3 d'une couche nommée pdf-tools. Les clients invoquent la fonction au moyen d'un alias nommé prod, qui pointe vers la version publiée 12 de la fonction. Un développeur a corrigé un bogue dans la couche et l'a publiée comme version de couche 4. La production doit utiliser la couche corrigée, et les clients doivent continuer à invoquer l'alias prod.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Update the layer configuration of $LATEST to the ARN of pdf-tools version 4.", fr: "Mettre à jour la configuration des couches de $LATEST avec l'ARN de la version 4 de pdf-tools." } }
    - { id: b, text: { en: "Delete version 3 of the layer so that the function loads the newest layer version.", fr: "Supprimer la version 3 de la couche afin que la fonction charge la version de couche la plus récente." } }
    - { id: c, text: { en: "Publish a new function version and point the prod alias to it.", fr: "Publier une nouvelle version de la fonction et faire pointer l'alias prod vers celle-ci." } }
    - { id: d, text: { en: "Update the layer configuration of version 12 of the function to the ARN of pdf-tools version 4.", fr: "Mettre à jour la configuration des couches de la version 12 de la fonction avec l'ARN de la version 4 de pdf-tools." } }
    - { id: e, text: { en: "Upload the fixed files into layer version 3 so that existing function versions pick them up.", fr: "Charger les fichiers corrigés dans la version de couche 3 afin que les versions de fonction existantes les prennent en compte." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A function references an exact layer version ARN, and layers are part of the immutable configuration of a published function version. The developer updates $LATEST to use pdf-tools version 4, publishes a new function version, and moves the prod alias to it, so clients keep the same alias."
    fr: "Une fonction référence l'ARN exact d'une version de couche, et les couches font partie de la configuration immuable d'une version de fonction publiée. Le développeur met à jour $LATEST pour utiliser la version 4 de pdf-tools, publie une nouvelle version de la fonction et y déplace l'alias prod : les clients conservent le même alias."
  options:
    b:
      en: "Functions are pinned to a layer version and never move to a newer one automatically; deleting version 3 does not make version 12 use version 4."
      fr: "Les fonctions sont liées à une version de couche et ne passent jamais automatiquement à une version plus récente ; supprimer la version 3 ne fait pas utiliser la version 4 à la version 12."
    d:
      en: "Layers are part of a published version's configuration, which cannot be changed after publishing."
      fr: "Les couches font partie de la configuration d'une version publiée, qui ne peut plus être modifiée après la publication."
    e:
      en: "A layer version is an immutable snapshot; its content cannot be replaced after it is published."
      fr: "Une version de couche est un instantané immuable ; son contenu ne peut pas être remplacé après sa publication."
references:
  - title: Managing Lambda Event Function dependencies with layers
    url: https://docs.aws.amazon.com/lambda/latest/dg/chapter-layers.html
  - title: Manage Lambda Event Function versions
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-versions.html
