id: dvac03-3b-aitest-kiro-steering-tests
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers at AnyCompany use Kiro to generate and update pytest tests. The tests must follow team rules: mock AWS calls instead of calling real services, use shared fixtures from conftest.py, and keep one assertion topic per test. The rules must be applied automatically whenever Kiro works on files that match tests/**/*.py, but they must not be added to every other interaction.

    Which solution will meet these requirements?
  fr: |
    Les développeurs d'AnyCompany utilisent Kiro pour générer et mettre à jour des tests pytest. Les tests doivent suivre les règles de l'équipe : simuler les appels AWS au lieu d'appeler les vrais services, utiliser les fixtures partagées de conftest.py et garder un seul sujet d'assertion par test. Les règles doivent être appliquées automatiquement chaque fois que Kiro travaille sur des fichiers qui correspondent à tests/**/*.py, mais elles ne doivent pas être ajoutées à toutes les autres interactions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Write the rules in a .kiro/steering/ file that uses the always inclusion mode.", fr: "Écrire les règles dans un fichier de .kiro/steering/ qui utilise le mode d'inclusion always." } }
    - { id: b, text: { en: "Write the rules in an AGENTS.md file at the root of the workspace.", fr: "Écrire les règles dans un fichier AGENTS.md à la racine de l'espace de travail." } }
    - { id: c, text: { en: "Create an agent hook with a Prompt Submit trigger that adds the rules to each prompt.", fr: "Créer un hook d'agent avec un déclencheur Prompt Submit qui ajoute les règles à chaque invite." } }
    - { id: d, text: { en: "Write the rules in a .kiro/steering/ file that uses fileMatch inclusion with tests/**/*.py.", fr: "Écrire les règles dans un fichier de .kiro/steering/ qui utilise l'inclusion fileMatch avec tests/**/*.py." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Steering files give Kiro persistent project knowledge, and their front matter sets the inclusion mode. The fileMatch mode loads the file only when Kiro works with files that match the pattern, so the test rules apply to test files without being added to unrelated interactions."
    fr: "Les fichiers steering donnent à Kiro une connaissance persistante du projet, et leur front matter définit le mode d'inclusion. Le mode fileMatch ne charge le fichier que lorsque Kiro travaille sur des fichiers qui correspondent au modèle : les règles de test s'appliquent aux fichiers de test sans être ajoutées aux interactions sans rapport."
  options:
    a:
      en: "The always mode, which is the default, includes the file in every interaction, which the team wants to avoid."
      fr: "Le mode always, qui est le mode par défaut, inclut le fichier dans toutes les interactions, ce que l'équipe veut éviter."
    b:
      en: "Kiro always includes AGENTS.md files and they do not support inclusion modes, so the rules would be loaded everywhere."
      fr: "Kiro inclut toujours les fichiers AGENTS.md, qui ne prennent pas en charge les modes d'inclusion : les règles seraient chargées partout."
    c:
      en: "A Prompt Submit hook runs on every prompt, so the rules would be added to every interaction, not only to work on test files."
      fr: "Un hook Prompt Submit s'exécute à chaque invite : les règles seraient ajoutées à toutes les interactions, pas seulement au travail sur les fichiers de test."
references:
  - title: Steering - Features - Docs - Kiro
    url: https://kiro.dev/docs/steering/
