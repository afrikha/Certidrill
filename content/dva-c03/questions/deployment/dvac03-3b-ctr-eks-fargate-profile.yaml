id: dvac03-3b-ctr-eks-fargate-profile
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon EKS cluster at AnyCompany has no EC2 nodes. Its only Fargate profile, named apps, has one selector for the orders namespace. A developer applies a new Deployment manifest in a new namespace named payments, and all its pods stay in the Pending state. The payments pods must run on AWS Fargate.

    Which solution will meet these requirements?
  fr: |
    Un cluster Amazon EKS d'AnyCompany n'a aucun nœud EC2. Son unique profil Fargate, nommé apps, possède un sélecteur pour l'espace de noms orders. Un développeur applique un nouveau manifeste de Deployment dans un nouvel espace de noms nommé payments, et tous ses pods restent à l'état Pending. Les pods de payments doivent s'exécuter sur AWS Fargate.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Edit the apps Fargate profile and add a selector for the payments namespace.", fr: "Modifier le profil Fargate apps et y ajouter un sélecteur pour l'espace de noms payments." } }
    - { id: b, text: { en: "Create a new Fargate profile with a selector for the payments namespace.", fr: "Créer un nouveau profil Fargate avec un sélecteur pour l'espace de noms payments." } }
    - { id: c, text: { en: "Add a nodeSelector for the orders namespace to the pod template of the Deployment.", fr: "Ajouter au modèle de pod du Deployment un nodeSelector pour l'espace de noms orders." } }
    - { id: d, text: { en: "Add permissions for the payments namespace to the Fargate pod execution role of the apps profile.", fr: "Ajouter des autorisations pour l'espace de noms payments au rôle d'exécution de pod Fargate du profil apps." } }
answer: { optionId: b }
explanation:
  correct:
    en: "EKS schedules a pod on Fargate only when it matches a selector of a Fargate profile, and each selector must name a namespace. Fargate profiles cannot be changed after creation, so the developer creates a new profile (or a replacement profile) whose selector matches payments."
    fr: "EKS ne planifie un pod sur Fargate que s'il correspond à un sélecteur d'un profil Fargate, et chaque sélecteur doit désigner un espace de noms. Les profils Fargate ne peuvent pas être modifiés après leur création : le développeur crée donc un nouveau profil (ou un profil de remplacement) dont le sélecteur correspond à payments."
  options:
    a:
      en: "Fargate profiles are immutable; to change selectors you create a new profile and delete the original if needed."
      fr: "Les profils Fargate sont immuables ; pour changer les sélecteurs, vous créez un nouveau profil et supprimez l'original si nécessaire."
    c:
      en: "Profile selectors match the pod's own namespace and labels; a nodeSelector does not move pods into another namespace's profile."
      fr: "Les sélecteurs de profil portent sur l'espace de noms et les étiquettes du pod lui-même ; un nodeSelector ne fait pas entrer les pods dans le profil d'un autre espace de noms."
    d:
      en: "The pod execution role is used by the EKS components on Fargate, for example to pull images; it does not decide which pods are scheduled on Fargate."
      fr: "Le rôle d'exécution de pod est utilisé par les composants EKS sur Fargate, par exemple pour extraire les images ; il ne décide pas quels pods sont planifiés sur Fargate."
references:
  - title: Define which Pods use AWS Fargate when launched
    url: https://docs.aws.amazon.com/eks/latest/userguide/fargate-profile.html
