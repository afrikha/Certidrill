id: dvac03-3c-lambda-weighted-alias
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function named `orders` has an alias named `prod` that points to version 6. A developer has published version 7 and wants 5% of the invocations of the `prod` alias to run version 7, without using AWS CodeDeploy.

    Which AWS CLI command should the developer run?
  fr: |
    Une fonction AWS Lambda nommée `orders` possède un alias nommé `prod` qui pointe vers la version 6. Un développeur a publié la version 7 et veut que 5 % des appels de l'alias `prod` exécutent la version 7, sans utiliser AWS CodeDeploy.

    Quelle commande AWS CLI le développeur doit-il exécuter ?
body:
  options:
    - { id: a, text: 'aws lambda update-alias --function-name orders --name prod --function-version $LATEST --routing-config AdditionalVersionWeights={"6"=0.95}' }
    - { id: b, text: 'aws lambda update-alias --function-name orders --name prod --function-version 7 --routing-config AdditionalVersionWeights={"6"=0.05}' }
    - { id: c, text: 'aws lambda put-provisioned-concurrency-config --function-name orders --qualifier 7 --provisioned-concurrent-executions 5' }
    - { id: d, text: 'aws lambda update-alias --function-name orders --name prod --function-version 6 --routing-config AdditionalVersionWeights={"7"=0.05}' }
answer: { optionId: d }
explanation:
  correct:
    en: "A weighted alias points to a primary version and sends the weight set in AdditionalVersionWeights to one additional version; the primary version receives the rest. Keeping version 6 as the primary version and giving version 7 a weight of 0.05 sends about 5% of the invocations to version 7."
    fr: "Un alias pondéré pointe vers une version principale et envoie le poids défini dans AdditionalVersionWeights vers une version supplémentaire ; la version principale reçoit le reste. Conserver la version 6 comme version principale et donner un poids de 0,05 à la version 7 envoie environ 5 % des appels vers la version 7."
  options:
    a:
      en: "A weighted alias must point to published versions; it cannot point to $LATEST, and this weighting would not target version 7."
      fr: "Un alias pondéré doit pointer vers des versions publiées ; il ne peut pas pointer vers $LATEST, et cette pondération ne viserait pas la version 7."
    b:
      en: "This makes version 7 the primary version, so it receives 95% of the invocations and version 6 only 5%."
      fr: "Cette commande fait de la version 7 la version principale : elle reçoit 95 % des appels et la version 6 seulement 5 %."
    c:
      en: "Provisioned concurrency keeps instances of version 7 initialized but does not route any alias traffic to it."
      fr: "La simultanéité provisionnée maintient des instances de la version 7 initialisées mais n'y achemine aucun trafic de l'alias."
references:
  - title: Implement Lambda canary deployments using a weighted alias
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuring-alias-routing.html
