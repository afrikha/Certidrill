id: dvac03-3c-ai-post-deploy-validation
objective: "3.3.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS CodePipeline V2 pipeline deploys a serverless API in a stage named `DeployProd`. After the deployment succeeds, the company wants an automated validation: an AWS Lambda function sends recent error logs and latency metrics to an Amazon Bedrock model, which judges whether the release is healthy, and the function returns an error when it is not. If the release is not healthy, the stage must automatically roll back to the last successful execution.

    Which solution will meet these requirements?
  fr: |
    Un pipeline AWS CodePipeline V2 déploie une API sans serveur dans une étape nommée `DeployProd`. Une fois le déploiement réussi, l'entreprise veut une validation automatisée : une fonction AWS Lambda envoie les journaux d'erreurs et les métriques de latence récents à un modèle Amazon Bedrock, qui juge si la version est saine, et la fonction renvoie une erreur lorsqu'elle ne l'est pas. Si la version n'est pas saine, l'étape doit être restaurée automatiquement à la dernière exécution réussie.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a beforeEntry condition to the DeployProd stage with a LambdaInvoke rule for the function and a SKIP result.", fr: "Ajouter à l'étape DeployProd une condition beforeEntry avec une règle LambdaInvoke pour la fonction et un résultat SKIP." }
    - id: b
      text: { en: "Add an onFailure condition to the DeployProd stage with a LambdaInvoke rule for the function and a ROLLBACK result.", fr: "Ajouter à l'étape DeployProd une condition onFailure avec une règle LambdaInvoke pour la fonction et un résultat ROLLBACK." }
    - id: c
      text: { en: "Add a manual approval action after the deploy action and include the output of the model in the approval notification.", fr: "Ajouter une action d'approbation manuelle après l'action de déploiement et inclure la sortie du modèle dans la notification d'approbation." }
    - id: d
      text: { en: "Add an onSuccess condition to the DeployProd stage with a LambdaInvoke rule for the function and a ROLLBACK result.", fr: "Ajouter à l'étape DeployProd une condition onSuccess avec une règle LambdaInvoke pour la fonction et un résultat ROLLBACK." }
answer: { optionId: d }
explanation:
  correct:
    en: "An onSuccess condition runs its rules after the stage succeeds, and its result can be ROLLBACK or FAIL. When the LambdaInvoke rule fails because the function reports an unhealthy release, the condition fails and CodePipeline rolls the stage back to the previous successful execution."
    fr: "Une condition onSuccess exécute ses règles après la réussite de l'étape, et son résultat peut être ROLLBACK ou FAIL. Lorsque la règle LambdaInvoke échoue parce que la fonction signale une version non saine, la condition échoue et CodePipeline restaure l'étape à l'exécution réussie précédente."
  options:
    a:
      en: "An entry condition runs before the deployment, so it cannot validate the deployed release, and SKIP would skip the deployment instead of rolling it back."
      fr: "Une condition d'entrée s'exécute avant le déploiement : elle ne peut pas valider la version déployée, et SKIP ignorerait le déploiement au lieu de le restaurer."
    b:
      en: "An onFailure condition is checked only when the stage fails; after a successful deployment it never runs."
      fr: "Une condition onFailure n'est vérifiée que lorsque l'étape échoue ; après un déploiement réussi, elle ne s'exécute jamais."
    c:
      en: "A manual approval needs a human decision, so the rollback would not be automatic."
      fr: "Une approbation manuelle exige une décision humaine : la restauration ne serait pas automatique."
references:
  - title: How do stage conditions work?
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/concepts-how-it-works-conditions.html
  - title: Configure conditions for a stage
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/stage-conditions.html
