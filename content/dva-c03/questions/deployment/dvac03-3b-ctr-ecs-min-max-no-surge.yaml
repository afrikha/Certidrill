id: dvac03-3b-ctr-ecs-min-max-no-surge
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs an Amazon ECS service with a desired count of 4 tasks and the rolling update deployment type. A third-party license allows at most 4 running tasks of the application at any time, including during deployments. During a deployment, at most one task can be missing from the desired count. Each deployment must be able to progress.

    Which deployment configuration will meet these requirements?
  fr: |
    AnyCompany exécute un service Amazon ECS avec un nombre souhaité de 4 tâches et le type de déploiement de mise à jour propagée. Une licence tierce autorise au plus 4 tâches de l'application en cours d'exécution à tout moment, y compris pendant les déploiements. Pendant un déploiement, il peut manquer au plus une tâche par rapport au nombre souhaité. Chaque déploiement doit pouvoir progresser.

    Quelle configuration de déploiement répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "minimumHealthyPercent 100 and maximumPercent 100", fr: "minimumHealthyPercent 100 et maximumPercent 100" } }
    - { id: b, text: { en: "minimumHealthyPercent 50 and maximumPercent 100", fr: "minimumHealthyPercent 50 et maximumPercent 100" } }
    - { id: c, text: { en: "minimumHealthyPercent 75 and maximumPercent 150", fr: "minimumHealthyPercent 75 et maximumPercent 150" } }
    - { id: d, text: { en: "minimumHealthyPercent 75 and maximumPercent 100", fr: "minimumHealthyPercent 75 et maximumPercent 100" } }
answer: { optionId: d }
explanation:
  correct:
    en: "maximumPercent caps running tasks during a deployment and is rounded down, so 100 % of 4 keeps the count at 4 or fewer. minimumHealthyPercent is rounded up, so 75 % of 4 keeps at least 3 healthy tasks, which lets the scheduler stop one old task, start one new task, and repeat."
    fr: "maximumPercent plafonne les tâches en cours pendant un déploiement et est arrondi à l'inférieur : 100 % de 4 maintient le nombre à 4 ou moins. minimumHealthyPercent est arrondi au supérieur : 75 % de 4 conserve au moins 3 tâches saines, ce qui permet au planificateur d'arrêter une ancienne tâche, d'en démarrer une nouvelle, puis de recommencer."
  options:
    a:
      en: "With both values at 100 %, the scheduler can neither stop nor start a task, so the deployment gets stuck."
      fr: "Avec les deux valeurs à 100 %, le planificateur ne peut ni arrêter ni démarrer de tâche : le déploiement reste bloqué."
    b:
      en: "50 % of 4 lets the scheduler stop 2 tasks at once, which exceeds the one missing task allowed."
      fr: "50 % de 4 permet au planificateur d'arrêter 2 tâches à la fois, ce qui dépasse la tâche manquante autorisée."
    c:
      en: "150 % of 4 allows up to 6 running tasks, which violates the license limit of 4."
      fr: "150 % de 4 autorise jusqu'à 6 tâches en cours d'exécution, ce qui enfreint la limite de licence de 4."
references:
  - title: Deploy Amazon ECS services by replacing tasks
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-ecs.html
