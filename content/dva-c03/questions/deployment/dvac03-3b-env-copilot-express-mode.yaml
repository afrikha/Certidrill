id: dvac03-3b-env-copilot-express-mode
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany created its test and production environments for a containerized HTTPS web API with AWS Copilot environments. AWS Copilot CLI reached end of support on June 12, 2026. The team must now create a new staging environment for the same container image on AWS Fargate, with a public HTTPS URL, a load balancer, and auto scaling. The team wants the LEAST operational overhead and does not want to write or maintain infrastructure code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a créé ses environnements de test et de production pour une API web HTTPS conteneurisée avec des environnements AWS Copilot. L'AWS Copilot CLI a atteint sa fin de support le 12 juin 2026. L'équipe doit maintenant créer un nouvel environnement de préproduction pour la même image de conteneur sur AWS Fargate, avec une URL HTTPS publique, un équilibreur de charge et une mise à l'échelle automatique. L'équipe veut le MOINS de charge opérationnelle possible et ne veut ni écrire ni maintenir de code d'infrastructure.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run copilot env init and copilot deploy to add a staging environment to the existing Copilot application.", fr: "Exécuter copilot env init et copilot deploy pour ajouter un environnement de préproduction à l'application Copilot existante." } }
    - { id: b, text: { en: "Write an AWS CDK app that uses the ApplicationLoadBalancedFargateService construct and deploy it for staging.", fr: "Écrire une application AWS CDK qui utilise la construction ApplicationLoadBalancedFargateService et la déployer pour la préproduction." } }
    - { id: c, text: { en: "Create an Amazon ECS Express Mode service for staging from the container image, a task execution role, and an infrastructure role.", fr: "Créer un service Amazon ECS Express Mode pour la préproduction à partir de l'image de conteneur, d'un rôle d'exécution de tâche et d'un rôle d'infrastructure." } }
    - { id: d, text: { en: "Create an ECS cluster, an Application Load Balancer, target groups, and scaling policies for staging one by one in the console.", fr: "Créer un par un dans la console un cluster ECS, un Application Load Balancer, des groupes cibles et des politiques de mise à l'échelle pour la préproduction." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon ECS Express Mode needs only a container image, a task execution role, and an infrastructure role, and it provisions a Fargate service with an HTTPS URL, a load balancer with TLS, auto scaling, and monitoring. AWS recommends it as the fastest migration path from Copilot for standard web applications and APIs."
    fr: "Amazon ECS Express Mode n'a besoin que d'une image de conteneur, d'un rôle d'exécution de tâche et d'un rôle d'infrastructure, et il provisionne un service Fargate avec une URL HTTPS, un équilibreur de charge avec TLS, la mise à l'échelle automatique et la surveillance. AWS le recommande comme chemin de migration le plus rapide depuis Copilot pour les applications web et API standard."
  options:
    a:
      en: "After its end of support, Copilot CLI receives no new features or security updates from AWS, so it should not be used for new environments."
      fr: "Après sa fin de support, l'AWS Copilot CLI ne reçoit plus de nouvelles fonctionnalités ni de mises à jour de sécurité d'AWS : il ne faut pas l'utiliser pour de nouveaux environnements."
    b:
      en: "AWS CDK is the recommended path when fine-grained control is needed, but it means writing and maintaining infrastructure code, which the team wants to avoid."
      fr: "AWS CDK est le chemin recommandé lorsqu'un contrôle précis est nécessaire, mais il implique d'écrire et de maintenir du code d'infrastructure, ce que l'équipe veut éviter."
    d:
      en: "Building each resource by hand works but has the highest operational overhead and is hard to repeat."
      fr: "Créer chaque ressource à la main fonctionne, mais présente la charge opérationnelle la plus élevée et est difficile à reproduire."
references:
  - title: Amazon ECS Express Mode
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-overview.html
