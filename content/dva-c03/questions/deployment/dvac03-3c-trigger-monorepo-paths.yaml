id: dvac03-3c-trigger-monorepo-paths
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps several microservices in one GitLab repository. Each service has its own folder, such as `services/orders/`, and its own AWS CodePipeline V2 pipeline with a source action that uses an AWS CodeConnections connection. Every pipeline currently starts on every push to the `main` branch, even when a commit changes only another service. A developer wants the orders pipeline to start only for pushes to `main` that change files under `services/orders/`.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    Une entreprise conserve plusieurs microservices dans un même référentiel GitLab. Chaque service a son propre dossier, par exemple `services/orders/`, et son propre pipeline AWS CodePipeline V2 avec une action source qui utilise une connexion AWS CodeConnections. Actuellement, chaque pipeline démarre à chaque push sur la branche `main`, même lorsqu'un commit ne modifie qu'un autre service. Un développeur veut que le pipeline orders démarre uniquement pour les push sur `main` qui modifient des fichiers sous `services/orders/`.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - id: a
      text: { en: "Split the repository into one repository per service and connect each pipeline to the repository of its service.", fr: "Scinder le référentiel en un référentiel par service et connecter chaque pipeline au référentiel de son service." }
    - id: b
      text: { en: "Add a beforeEntry condition with a VariableCheck rule that compares the commit message with the word `orders`.", fr: "Ajouter une condition beforeEntry avec une règle VariableCheck qui compare le message de commit au mot `orders`." }
    - id: c
      text: { en: "Add a push trigger with a branches filter that includes `main` and a file paths filter that includes `services/orders/**`.", fr: "Ajouter un déclencheur push avec un filtre de branches qui inclut `main` et un filtre de chemins de fichiers qui inclut `services/orders/**`." }
    - id: d
      text: { en: "Add a buildspec command that runs `git diff` and ends the build early when no file under `services/orders/` changed.", fr: "Ajouter une commande au buildspec qui exécute `git diff` et termine le build plus tôt si aucun fichier sous `services/orders/` n'a changé." }
answer: { optionId: c }
explanation:
  correct:
    en: "Inside one push filter, the branch and file path conditions are combined with AND, so the pipeline starts only for pushes to `main` in which at least one changed file matches `services/orders/**`. The filter is pure pipeline configuration, with no code to write."
    fr: "Dans un même filtre push, les conditions de branche et de chemin de fichier sont combinées par un ET : le pipeline ne démarre que pour les push sur `main` dont au moins un fichier modifié correspond à `services/orders/**`. Le filtre relève uniquement de la configuration du pipeline, sans code à écrire."
  options:
    a:
      en: "Separate repositories would work but require a large migration of code, history and tooling."
      fr: "Des référentiels séparés fonctionneraient mais exigent une lourde migration du code, de l'historique et de l'outillage."
    b:
      en: "The pipeline still starts on every push, and the commit message does not reliably show which folders a commit changed."
      fr: "Le pipeline démarre toujours à chaque push, et le message de commit n'indique pas de façon fiable quels dossiers un commit a modifiés."
    d:
      en: "Every push still starts the pipeline and a build, and the developer must write and maintain the comparison logic."
      fr: "Chaque push démarre toujours le pipeline et un build, et le développeur doit écrire et maintenir la logique de comparaison."
references:
  - title: Automate starting pipelines using triggers and filtering
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-triggers.html
