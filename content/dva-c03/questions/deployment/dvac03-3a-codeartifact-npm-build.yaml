id: dvac03-3a-codeartifact-npm-build
objective: "3.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany publishes its private npm packages to an AWS CodeArtifact repository. An AWS CodeBuild project for a Node.js service must install these packages when it runs `npm install`. The security team does not allow long-lived tokens or access keys in the project settings, the buildspec or the Git repository.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany publie ses packages npm privés dans un référentiel AWS CodeArtifact. Un projet AWS CodeBuild d'un service Node.js doit installer ces packages lorsqu'il exécute `npm install`. L'équipe de sécurité n'autorise aucun jeton ni aucune clé d'accès de longue durée dans les paramètres du projet, le buildspec ou le référentiel Git.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the pre_build phase of the buildspec, run aws codeartifact login --tool npm with the domain, domain owner and repository.", fr: "Dans la phase pre_build du buildspec, exécuter aws codeartifact login --tool npm avec le domaine, le propriétaire du domaine et le référentiel." } }
    - { id: b, text: { en: "Generate a CodeArtifact authorization token once and commit an .npmrc file that contains it to the Git repository.", fr: "Générer une fois un jeton d'autorisation CodeArtifact et valider dans le référentiel Git un fichier .npmrc qui le contient." } }
    - { id: c, text: { en: "Give the CodeBuild service role codeartifact:GetAuthorizationToken, GetRepositoryEndpoint, ReadFromRepository and sts:GetServiceBearerToken.", fr: "Accorder au rôle de service CodeBuild codeartifact:GetAuthorizationToken, GetRepositoryEndpoint, ReadFromRepository et sts:GetServiceBearerToken." } }
    - { id: d, text: { en: "Give the CodeBuild service role only the codeartifact:PublishPackageVersion permission on the repository.", fr: "Accorder au rôle de service CodeBuild uniquement l'autorisation codeartifact:PublishPackageVersion sur le référentiel." } }
    - { id: e, text: { en: "Store the access key of an IAM user in plaintext environment variables of the project and configure npm to use it.", fr: "Stocker la clé d'accès d'un utilisateur IAM dans des variables d'environnement en texte clair du projet et configurer npm pour l'utiliser." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Running aws codeartifact login --tool npm in pre_build configures npm with a short-lived token obtained with the credentials of the build. For that call and the package reads, the CodeBuild service role needs codeartifact:GetAuthorizationToken, GetRepositoryEndpoint and ReadFromRepository, plus sts:GetServiceBearerToken for the codeartifact.amazonaws.com service."
    fr: "Exécuter aws codeartifact login --tool npm dans pre_build configure npm avec un jeton de courte durée obtenu avec les informations d'identification du build. Pour cet appel et la lecture des packages, le rôle de service CodeBuild a besoin de codeartifact:GetAuthorizationToken, GetRepositoryEndpoint et ReadFromRepository, ainsi que de sts:GetServiceBearerToken pour le service codeartifact.amazonaws.com."
  options:
    b:
      en: "A token committed to Git is a stored secret that the policy forbids, and it stops working when it expires."
      fr: "Un jeton validé dans Git est un secret stocké que la politique interdit, et il cesse de fonctionner à son expiration."
    d:
      en: "PublishPackageVersion is only needed to publish packages; it does not allow the build to obtain a token or read packages."
      fr: "PublishPackageVersion n'est nécessaire que pour publier des packages ; il ne permet pas au build d'obtenir un jeton ni de lire des packages."
    e:
      en: "An IAM user access key is a long-lived credential, which the security team forbids, and plaintext variables expose it."
      fr: "La clé d'accès d'un utilisateur IAM est une information d'identification de longue durée, que l'équipe de sécurité interdit, et des variables en texte clair l'exposent."
references:
  - title: Using npm packages in CodeBuild
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/using-npm-packages-in-codebuild.html
