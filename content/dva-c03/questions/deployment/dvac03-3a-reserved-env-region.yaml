id: dvac03-3a-reserved-env-region
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer deploys the same Node.js Lambda function in three AWS Regions. The code must build Amazon S3 URLs that include the Region where the function runs. The developer tries to add an environment variable named `AWS_REGION` with a different value in each Region, but the configuration update is rejected.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    Un développeur déploie la même fonction Lambda Node.js dans trois Régions AWS. Le code doit construire des URL Amazon S3 qui incluent la Région dans laquelle la fonction s'exécute. Le développeur tente d'ajouter une variable d'environnement nommée `AWS_REGION` avec une valeur différente dans chaque Région, mais la mise à jour de la configuration est refusée.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: { en: "Name the variable AWS_DEFAULT_REGION instead and set its value in each Region.", fr: "Nommer plutôt la variable AWS_DEFAULT_REGION et définir sa valeur dans chaque Région." } }
    - { id: b, text: { en: "Store the Region name in a Parameter Store parameter in each Region and read it when the function initializes.", fr: "Stocker le nom de la Région dans un paramètre Parameter Store de chaque Région et le lire à l'initialisation de la fonction." } }
    - { id: c, text: { en: "Build a separate deployment package for each Region with the Region name written in the code.", fr: "Créer un package de déploiement distinct pour chaque Région avec le nom de la Région écrit dans le code." } }
    - { id: d, text: { en: "Read the AWS_REGION environment variable that Lambda already sets in the execution environment.", fr: "Lire la variable d'environnement AWS_REGION que Lambda définit déjà dans l'environnement d'exécution." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS_REGION is a reserved environment variable: Lambda sets it to the Region of the function, and it cannot be set in the function configuration. The code only has to read process.env.AWS_REGION, with no extra resource or package."
    fr: "AWS_REGION est une variable d'environnement réservée : Lambda la définit sur la Région de la fonction, et elle ne peut pas être définie dans la configuration de la fonction. Le code n'a qu'à lire process.env.AWS_REGION, sans ressource ni package supplémentaire."
  options:
    a:
      en: "AWS_DEFAULT_REGION is also reserved, so the update is rejected in the same way."
      fr: "AWS_DEFAULT_REGION est également réservée : la mise à jour est refusée de la même façon."
    b:
      en: "This works, but it adds parameters, IAM permissions and an API call to obtain a value that Lambda already provides."
      fr: "Cela fonctionne, mais ajoute des paramètres, des autorisations IAM et un appel d'API pour obtenir une valeur que Lambda fournit déjà."
    c:
      en: "This works, but maintaining one package per Region is the most effort and breaks the single build."
      fr: "Cela fonctionne, mais maintenir un package par Région demande le plus d'effort et casse le build unique."
references:
  - title: Working with Lambda environment variables
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-envvars.html
