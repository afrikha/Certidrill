id: dvac03-3a-layer-python-structure
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 12 Python Lambda functions that use the same internal validation library and the same version of the `pydantic` package. Today each function bundles these libraries in its own .zip deployment package. The developers want to maintain the shared libraries as one separate artifact and keep the function packages small.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany dispose de 12 fonctions Lambda Python qui utilisent la même bibliothèque interne de validation et la même version du package `pydantic`. Aujourd'hui, chaque fonction intègre ces bibliothèques dans son propre package de déploiement .zip. Les développeurs veulent gérer les bibliothèques partagées comme un seul artefact distinct et garder des packages de fonction légers.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Build a .zip file in which the libraries are installed under a top-level python/ directory, and publish it as a Lambda layer version.", fr: "Créer un fichier .zip dans lequel les bibliothèques sont installées sous un répertoire python/ de premier niveau, et le publier comme version de couche Lambda." } }
    - { id: b, text: { en: "Build a .zip file in which the libraries are installed at the root, and publish it as a Lambda layer version.", fr: "Créer un fichier .zip dans lequel les bibliothèques sont installées à la racine, et le publier comme version de couche Lambda." } }
    - { id: c, text: { en: "Add the layer version ARN to the layer configuration of each of the 12 functions.", fr: "Ajouter l'ARN de la version de couche à la configuration des couches de chacune des 12 fonctions." } }
    - { id: d, text: { en: "Upload the libraries to an S3 bucket and set the PYTHONPATH environment variable of each function to the S3 URI.", fr: "Charger les bibliothèques dans un compartiment S3 et définir la variable d'environnement PYTHONPATH de chaque fonction sur l'URI S3." } }
    - { id: e, text: { en: "Publish the libraries to an AWS CodeArtifact repository and set the handler of each function to import them from the repository endpoint.", fr: "Publier les bibliothèques dans un référentiel AWS CodeArtifact et configurer le gestionnaire de chaque fonction pour les importer depuis le point de terminaison du référentiel." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A layer is a .zip archive that Lambda extracts into /opt of the execution environment. For Python, the paths python and python/lib/python3.x/site-packages inside the layer are on the import path, so the libraries must be under python/. Each function then references the layer version ARN in its configuration."
    fr: "Une couche est une archive .zip que Lambda extrait dans /opt de l'environnement d'exécution. Pour Python, les chemins python et python/lib/python3.x/site-packages de la couche font partie du chemin d'importation : les bibliothèques doivent donc se trouver sous python/. Chaque fonction référence ensuite l'ARN de la version de couche dans sa configuration."
  options:
    b:
      en: "Layer content at the root lands directly in /opt, which is not one of the folders on the Python import path, so the imports fail."
      fr: "Le contenu placé à la racine de la couche arrive directement dans /opt, qui ne fait pas partie des dossiers du chemin d'importation Python : les importations échouent."
    d:
      en: "Python cannot import modules from an S3 URI; dependencies must be in the deployment package, a layer or another file system path."
      fr: "Python ne peut pas importer de modules depuis une URI S3 ; les dépendances doivent se trouver dans le package de déploiement, une couche ou un autre chemin du système de fichiers."
    e:
      en: "CodeArtifact stores packages for build tools such as pip; a Lambda handler cannot import modules from a repository endpoint at run time."
      fr: "CodeArtifact stocke des packages pour des outils de build comme pip ; un gestionnaire Lambda ne peut pas importer de modules depuis le point de terminaison d'un référentiel à l'exécution."
references:
  - title: Packaging your layer content
    url: https://docs.aws.amazon.com/lambda/latest/dg/packaging-layers.html
