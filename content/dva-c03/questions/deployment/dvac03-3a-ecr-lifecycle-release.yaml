id: dvac03-3a-ecr-lifecycle-release
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team pushes images of a payment service to an Amazon ECR private repository. The repository must keep only the 20 most recent images whose tags start with `release-`. Untagged images must be deleted 7 days after they are pushed. Images with other tags must not be affected.

    Which lifecycle policy will meet these requirements?
  fr: |
    Une équipe transfère les images d'un service de paiement vers un référentiel privé Amazon ECR. Le référentiel ne doit conserver que les 20 images les plus récentes dont les balises commencent par `release-`. Les images sans balise doivent être supprimées 7 jours après leur transfert. Les images portant d'autres balises ne doivent pas être affectées.

    Quelle politique de cycle de vie répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "One rule with tagStatus any, countType imageCountMoreThan and countNumber 20, and the expire action.", fr: "Une règle avec tagStatus any, countType imageCountMoreThan et countNumber 20, et l'action expire." } }
    - { id: b, text: { en: "Rule 1: tagged, tagPatternList release-*, sinceImagePushed, 20 days. Rule 2: untagged, imageCountMoreThan 7. Both expire.", fr: "Règle 1 : tagged, tagPatternList release-*, sinceImagePushed, 20 jours. Règle 2 : untagged, imageCountMoreThan 7. Les deux avec expire." } }
    - { id: c, text: { en: "Rule 1: untagged, sinceImagePushed, 7 days. Rule 2: tagStatus any, imageCountMoreThan 20. Both expire.", fr: "Règle 1 : untagged, sinceImagePushed, 7 jours. Règle 2 : tagStatus any, imageCountMoreThan 20. Les deux avec expire." } }
    - { id: d, text: { en: "Rule 1: tagged, tagPatternList release-*, imageCountMoreThan 20. Rule 2: untagged, sinceImagePushed, 7 days. Both expire.", fr: "Règle 1 : tagged, tagPatternList release-*, imageCountMoreThan 20. Règle 2 : untagged, sinceImagePushed, 7 jours. Les deux avec expire." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A tagged rule with a release-* pattern and imageCountMoreThan 20 sorts the matching images by push time and expires all but the 20 newest. An untagged rule with sinceImagePushed, countUnit days and countNumber 7 expires untagged images older than 7 days. Images with other tags match neither rule and are kept."
    fr: "Une règle tagged avec le modèle release-* et imageCountMoreThan 20 trie les images correspondantes par date de transfert et fait expirer toutes sauf les 20 plus récentes. Une règle untagged avec sinceImagePushed, countUnit days et countNumber 7 fait expirer les images sans balise de plus de 7 jours. Les images portant d'autres balises ne correspondent à aucune règle et sont conservées."
  options:
    a:
      en: "tagStatus any selects every image, so images with other tags and untagged images are counted and expired too."
      fr: "tagStatus any sélectionne toutes les images : les images portant d'autres balises et les images sans balise sont aussi comptées et expirées."
    b:
      en: "The count types are swapped: release images would expire after 20 days whatever their number, and untagged images would be kept by count instead of age."
      fr: "Les types de comptage sont inversés : les images release expireraient après 20 jours quel que soit leur nombre, et les images sans balise seraient conservées selon leur nombre au lieu de leur âge."
    c:
      en: "Rule 2 with tagStatus any also expires images with other tags once more than 20 images exist."
      fr: "La règle 2 avec tagStatus any fait aussi expirer les images portant d'autres balises dès qu'il existe plus de 20 images."
references:
  - title: Examples of lifecycle policies in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/lifecycle_policy_examples.html
