id: dvac03-3a-ecs-tag-digest
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon ECS service on AWS Fargate uses a task definition whose container image is `111122223333.dkr.ecr.eu-west-1.amazonaws.com/web:stable`. A developer pushes a rebuilt image with the same `stable` tag. Two days later the service scales out, and the new tasks still run the previous image. The team wants all tasks of the service to run the rebuilt image without registering a new task definition revision.

    Which solution will meet these requirements?
  fr: |
    Un service Amazon ECS sur AWS Fargate utilise une définition de tâche dont l'image de conteneur est `111122223333.dkr.ecr.eu-west-1.amazonaws.com/web:stable`. Un développeur transfère une image reconstruite avec la même balise `stable`. Deux jours plus tard, le service monte en charge et les nouvelles tâches exécutent toujours l'image précédente. L'équipe veut que toutes les tâches du service exécutent l'image reconstruite sans enregistrer de nouvelle révision de la définition de tâche.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Stop the running tasks one at a time so that the service scheduler replaces them with tasks that pull the image again.", fr: "Arrêter les tâches en cours une par une pour que le planificateur du service les remplace par des tâches qui extraient de nouveau l'image." } }
    - { id: b, text: { en: "Run aws ecs update-service with the --force-new-deployment option for the service.", fr: "Exécuter aws ecs update-service avec l'option --force-new-deployment pour le service." } }
    - { id: c, text: { en: "Turn on tag immutability for the repository so that ECS resolves the stable tag again at the next scale-out.", fr: "Activer l'immuabilité des balises du référentiel pour qu'ECS résolve de nouveau la balise stable à la prochaine montée en charge." } }
    - { id: d, text: { en: "Increase the desired count of the service so that the additional tasks start from the rebuilt image.", fr: "Augmenter le nombre souhaité de tâches du service pour que les tâches supplémentaires démarrent à partir de l'image reconstruite." } }
answer: { optionId: b }
explanation:
  correct:
    en: "By default, Amazon ECS resolves the image tag to an image digest when a deployment starts and uses that digest for every task it starts afterward, including replacements and scale-out. Forcing a new deployment establishes the digest of the rebuilt image and replaces the tasks with the same task definition revision."
    fr: "Par défaut, Amazon ECS résout la balise d'image en condensé (digest) au début d'un déploiement et utilise ce condensé pour toutes les tâches qu'il démarre ensuite, remplacements et montée en charge compris. Forcer un nouveau déploiement établit le condensé de l'image reconstruite et remplace les tâches avec la même révision de définition de tâche."
  options:
    a:
      en: "Replacement tasks of the current deployment use the digest established when the deployment started, so they run the previous image again."
      fr: "Les tâches de remplacement du déploiement actuel utilisent le condensé établi au début du déploiement : elles exécutent de nouveau l'image précédente."
    c:
      en: "Tag immutability only blocks future overwrites of a tag in the repository; it does not change the digest that the ECS deployment uses."
      fr: "L'immuabilité des balises bloque seulement les écrasements futurs d'une balise dans le référentiel ; elle ne change pas le condensé utilisé par le déploiement ECS."
    d:
      en: "This is what already happened: tasks added by scaling use the digest of the current deployment, not the newly pushed image."
      fr: "C'est ce qui s'est déjà produit : les tâches ajoutées par la montée en charge utilisent le condensé du déploiement actuel, pas l'image nouvellement transférée."
references:
  - title: Deploy Amazon ECS services by replacing tasks
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-ecs.html
