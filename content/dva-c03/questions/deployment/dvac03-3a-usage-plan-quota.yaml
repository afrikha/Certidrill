id: dvac03-3a-usage-plan-quota
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany exposes a REST API in Amazon API Gateway to about 40 partners. Each partner must be limited to 10,000 requests per day and to a steady rate of 50 requests per second. Partners are already authenticated by a Lambda authorizer, and the limits must be enforced by API Gateway without new application code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose une API REST Amazon API Gateway à environ 40 partenaires. Chaque partenaire doit être limité à 10 000 requêtes par jour et à un débit constant de 50 requêtes par seconde. Les partenaires sont déjà authentifiés par un mécanisme d'autorisation Lambda, et les limites doivent être appliquées par API Gateway sans nouveau code applicatif.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the stage-level throttling rate of the prod stage to 50 requests per second.", fr: "Définir la limitation au niveau de l'étape prod à 50 requêtes par seconde." } }
    - { id: b, text: { en: "Set method-level throttling of 50 requests per second on each method of the prod stage.", fr: "Définir une limitation au niveau de chaque méthode de l'étape prod à 50 requêtes par seconde." } }
    - { id: c, text: { en: "Count each partner's requests in an Amazon DynamoDB table from the Lambda authorizer and deny calls over the limits.", fr: "Compter les requêtes de chaque partenaire dans une table Amazon DynamoDB depuis le mécanisme d'autorisation Lambda et refuser les appels au-delà des limites." } }
    - { id: d, text: { en: "Create a usage plan with a 50 requests per second rate and a 10,000 per day quota, and associate one API key per partner.", fr: "Créer un plan d'utilisation avec un débit de 50 requêtes par seconde et un quota de 10 000 par jour, et y associer une clé d'API par partenaire." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Usage plans apply per-client throttling and quotas to the clients identified by the API keys associated with the plan. Methods are set to require an API key, and requests over the limits receive 429 Too Many Requests; AWS applies these limits on a best-effort basis."
    fr: "Les plans d'utilisation appliquent une limitation et des quotas par client aux clients identifiés par les clés d'API associées au plan. Les méthodes sont configurées pour exiger une clé d'API, et les requêtes au-delà des limites reçoivent 429 Too Many Requests ; AWS applique ces limites au mieux (best-effort)."
  options:
    a:
      en: "Stage-level throttling is shared by all clients of the stage, so one partner can use the whole rate, and it has no daily quota."
      fr: "La limitation au niveau de l'étape est partagée par tous les clients de l'étape : un partenaire peut consommer tout le débit, et elle n'a pas de quota quotidien."
    b:
      en: "Method-level throttling is also shared by all callers of each method and has no daily quota."
      fr: "La limitation au niveau des méthodes est aussi partagée par tous les appelants de chaque méthode et n'a pas de quota quotidien."
    c:
      en: "This requires new code and a table to maintain, which the requirements exclude."
      fr: "Cela demande du nouveau code et une table à maintenir, ce que les exigences excluent."
references:
  - title: Throttle requests to your REST APIs for better throughput in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html
