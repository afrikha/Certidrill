id: dvac03-3a-stagevar-lambda-alias
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Amazon API Gateway REST API has a `dev` stage and a `prod` stage. Both stages use a Lambda integration with the `orders` function, which has a `dev` alias and a `prod` alias that point to different versions. Each stage must call the alias with the same name, and the API definition must stay identical in both stages.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une API REST Amazon API Gateway a une étape (stage) `dev` et une étape `prod`. Les deux étapes utilisent une intégration Lambda avec la fonction `orders`, qui a un alias `dev` et un alias `prod` pointant vers des versions différentes. Chaque étape doit appeler l'alias du même nom, et la définition de l'API doit rester identique dans les deux étapes.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the integration's function to orders:${stageVariables.lambdaAlias} and define a lambdaAlias stage variable in each stage.", fr: "Définir la fonction de l'intégration sur orders:${stageVariables.lambdaAlias} et créer une variable d'étape lambdaAlias dans chaque étape." } }
    - { id: b, text: { en: "Run aws lambda add-permission for each alias to allow apigateway.amazonaws.com to invoke it from the API.", fr: "Exécuter aws lambda add-permission pour chaque alias afin d'autoriser apigateway.amazonaws.com à l'appeler depuis l'API." } }
    - { id: c, text: { en: "Create a usage plan for each stage that references the Lambda alias that the stage must call.", fr: "Créer pour chaque étape un plan d'utilisation qui référence l'alias Lambda que l'étape doit appeler." } }
    - { id: d, text: { en: "Enable canary settings on the prod stage with a stage variable override that points to the prod alias.", fr: "Activer les paramètres de canary sur l'étape prod avec un remplacement de variable d'étape qui pointe vers l'alias prod." } }
    - { id: e, text: { en: "Add an ALIAS environment variable to the orders function and set a different value for each stage.", fr: "Ajouter une variable d'environnement ALIAS à la fonction orders et définir une valeur différente pour chaque étape." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Stage variables can name a different Lambda function, or function alias, for each stage, so one API definition calls orders:dev in dev and orders:prod in prod. When a stage variable names the function, API Gateway does not add the invoke permission, so it must be granted on each alias with aws lambda add-permission."
    fr: "Les variables d'étape peuvent désigner une fonction Lambda, ou un alias de fonction, différents pour chaque étape : une seule définition d'API appelle orders:dev dans dev et orders:prod dans prod. Lorsqu'une variable d'étape désigne la fonction, API Gateway n'ajoute pas l'autorisation d'appel : elle doit être accordée sur chaque alias avec aws lambda add-permission."
  options:
    c:
      en: "Usage plans set throttling and quotas for API keys; they do not choose an integration target."
      fr: "Les plans d'utilisation définissent la limitation et les quotas des clés d'API ; ils ne choisissent pas la cible d'intégration."
    d:
      en: "Canary settings split traffic within one stage; they do not give each stage its own alias."
      fr: "Les paramètres de canary répartissent le trafic au sein d'une étape ; ils ne donnent pas à chaque étape son propre alias."
    e:
      en: "An environment variable is read by the function after it is invoked; it cannot decide which alias API Gateway calls."
      fr: "Une variable d'environnement est lue par la fonction une fois appelée ; elle ne peut pas décider de l'alias qu'API Gateway appelle."
references:
  - title: Use stage variables for a REST API in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/stage-variables.html
