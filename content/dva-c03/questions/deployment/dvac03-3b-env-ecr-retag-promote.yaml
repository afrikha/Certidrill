id: dvac03-3b-env-ecr-retag-promote
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany promotes container images between environments by tag. After an image tagged 2.4.0-rc1 in an Amazon ECR repository named checkout passes its tests, the same image must also carry the tag 2.4.0, which the production Amazon ECS service references. The promotion step runs in an AWS CodeBuild project that has the AWS CLI but no Docker daemon, and the image must not be rebuilt.

    Which solution will meet these requirements?
  fr: |
    AnyCompany promeut les images de conteneur d'un environnement à l'autre par balise. Lorsqu'une image balisée 2.4.0-rc1 dans un référentiel Amazon ECR nommé checkout réussit ses tests, la même image doit aussi porter la balise 2.4.0, que le service Amazon ECS de production référence. L'étape de promotion s'exécute dans un projet AWS CodeBuild qui dispose de l'AWS CLI mais d'aucun démon Docker, et l'image ne doit pas être recréée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run aws ecr tag-resource on the checkout repository with a tag whose key is 2.4.0 and whose value is the image digest.", fr: "Exécuter aws ecr tag-resource sur le référentiel checkout avec une étiquette dont la clé est 2.4.0 et la valeur le condensé de l'image." } }
    - { id: b, text: { en: "Read the manifest of 2.4.0-rc1 with aws ecr batch-get-image, then call aws ecr put-image with it and --image-tag 2.4.0.", fr: "Lire le manifeste de 2.4.0-rc1 avec aws ecr batch-get-image, puis appeler aws ecr put-image avec ce manifeste et --image-tag 2.4.0." } }
    - { id: c, text: { en: "Run docker build from the same commit with the tag 2.4.0 and push the resulting image to the checkout repository.", fr: "Exécuter docker build à partir du même commit avec la balise 2.4.0 et envoyer l'image obtenue dans le référentiel checkout." } }
    - { id: d, text: { en: "Add a registry replication rule so that ECR copies the 2.4.0-rc1 image into a second repository named checkout-prod.", fr: "Ajouter une règle de réplication au registre afin qu'ECR copie l'image 2.4.0-rc1 dans un second référentiel nommé checkout-prod." } }
answer: { optionId: b }
explanation:
  correct:
    en: "For images with a Docker Image Manifest V2 Schema 2 manifest, ECR can retag an image without pulling or pushing it: batch-get-image returns the manifest of the existing tag, and put-image with --image-tag stores the same manifest under a new tag. Both tags then point to the same image digest."
    fr: "Pour les images dotées d'un manifeste Docker Image Manifest V2 Schema 2, ECR peut rebaliser une image sans l'extraire ni l'envoyer : batch-get-image renvoie le manifeste de la balise existante, et put-image avec --image-tag stocke le même manifeste sous une nouvelle balise. Les deux balises pointent alors vers le même condensé (digest) d'image."
  options:
    a:
      en: "tag-resource adds AWS resource tags (key-value metadata) to the repository; it does not add an image tag to an image."
      fr: "tag-resource ajoute des étiquettes de ressource AWS (métadonnées clé-valeur) au référentiel ; il n'ajoute pas de balise d'image à une image."
    c:
      en: "Rebuilding produces a new image, which violates the requirement, and the build environment has no Docker daemon."
      fr: "Recréer l'image produit une nouvelle image, ce qui enfreint l'exigence, et l'environnement de build n'a pas de démon Docker."
    d:
      en: "Replication copies images to other Regions or accounts according to registry rules; it does not add the 2.4.0 tag that the production service references."
      fr: "La réplication copie des images vers d'autres Régions ou comptes selon les règles du registre ; elle n'ajoute pas la balise 2.4.0 que référence le service de production."
references:
  - title: Retagging an image in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-retag.html
