id: dvac03-3a-regional-custom-domain
objective: "3.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer has a Regional REST API in the eu-west-1 Region. Clients must call it at `https://api.example.com` instead of the default execute-api URL. The example.com domain is hosted in Amazon Route 53. The developer will create a Regional custom domain name and map the API's prod stage to it.

    Which additional steps must the developer take? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur a une API REST régionale dans la Région eu-west-1. Les clients doivent l'appeler à l'adresse `https://api.example.com` au lieu de l'URL execute-api par défaut. Le domaine example.com est hébergé dans Amazon Route 53. Le développeur va créer un nom de domaine personnalisé régional et y mapper l'étape prod de l'API.

    Quelles étapes supplémentaires le développeur doit-il effectuer ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Request or import an ACM certificate for api.example.com in the eu-west-1 Region.", fr: "Demander ou importer un certificat ACM pour api.example.com dans la Région eu-west-1." } }
    - { id: b, text: { en: "Request or import an ACM certificate for api.example.com in the us-east-1 Region.", fr: "Demander ou importer un certificat ACM pour api.example.com dans la Région us-east-1." } }
    - { id: c, text: { en: "Create a Route 53 alias A record for api.example.com that targets the regional domain name of the custom domain name.", fr: "Créer dans Route 53 un enregistrement A d'alias pour api.example.com qui cible le nom de domaine régional du nom de domaine personnalisé." } }
    - { id: d, text: { en: "Create a Route 53 CNAME record for api.example.com that targets the default execute-api URL of the prod stage.", fr: "Créer dans Route 53 un enregistrement CNAME pour api.example.com qui cible l'URL execute-api par défaut de l'étape prod." } }
    - { id: e, text: { en: "Create a CloudFront distribution in front of the API and attach the certificate to the distribution.", fr: "Créer une distribution CloudFront devant l'API et attacher le certificat à la distribution." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A Regional custom domain name needs a Region-specific ACM certificate in the same Region as the API. With Route 53, an A alias record whose target is the regionalDomainName of the custom domain name, such as d-1234abcd.execute-api.eu-west-1.amazonaws.com, sends requests for api.example.com to API Gateway."
    fr: "Un nom de domaine personnalisé régional nécessite un certificat ACM propre à la Région, dans la même Région que l'API. Avec Route 53, un enregistrement A d'alias dont la cible est le regionalDomainName du nom de domaine personnalisé, par exemple d-1234abcd.execute-api.eu-west-1.amazonaws.com, envoie les requêtes pour api.example.com vers API Gateway."
  options:
    b:
      en: "A certificate in us-east-1 is what edge-optimized custom domain names use; a Regional custom domain name needs one in the API's Region."
      fr: "Un certificat dans us-east-1 est ce qu'utilisent les noms de domaine personnalisés optimisés pour la périphérie ; un nom de domaine personnalisé régional en exige un dans la Région de l'API."
    d:
      en: "DNS must point to the custom domain name's own regional domain name; the default execute-api endpoint does not serve requests for api.example.com."
      fr: "Le DNS doit pointer vers le nom de domaine régional du nom de domaine personnalisé ; le point de terminaison execute-api par défaut ne sert pas les requêtes pour api.example.com."
    e:
      en: "A Regional custom domain name does not need a CloudFront distribution; adding one is extra infrastructure."
      fr: "Un nom de domaine personnalisé régional n'a pas besoin de distribution CloudFront ; en ajouter une crée une infrastructure inutile."
references:
  - title: Set up a Regional custom domain name in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-regional-api-custom-domain-create.html
