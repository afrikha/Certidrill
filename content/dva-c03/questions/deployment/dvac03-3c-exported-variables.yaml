id: dvac03-3c-exported-variables
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CodePipeline pipeline has a Build stage with an AWS CodeBuild action and a Deploy stage with an AWS CloudFormation deploy action. The build computes an image tag, pushes the image and must pass the tag to the deploy action, which sets it in ParameterOverrides. The buildspec contains the following commands:

    ```yaml
    version: 0.2
    phases:
      build:
        commands:
          - export IMAGE_TAG="build-${CODEBUILD_BUILD_NUMBER}"
          - docker build -t "$REPO_URI:$IMAGE_TAG" .
          - docker push "$REPO_URI:$IMAGE_TAG"
    ```

    Which solution will pass the tag to the deploy action with the LEAST development effort?
  fr: |
    Un pipeline AWS CodePipeline comporte une étape Build avec une action AWS CodeBuild et une étape Deploy avec une action de déploiement AWS CloudFormation. Le build calcule une balise d'image, pousse l'image et doit transmettre la balise à l'action de déploiement, qui la définit dans ParameterOverrides. Le buildspec contient les commandes suivantes :

    ```yaml
    version: 0.2
    phases:
      build:
        commands:
          - export IMAGE_TAG="build-${CODEBUILD_BUILD_NUMBER}"
          - docker build -t "$REPO_URI:$IMAGE_TAG" .
          - docker push "$REPO_URI:$IMAGE_TAG"
    ```

    Quelle solution transmet la balise à l'action de déploiement avec le MOINS d'effort de développement ?
body:
  options:
    - id: a
      text: { en: "Define IMAGE_TAG as a pipeline-level variable and let the `export` command in the build overwrite its value.", fr: "Définir IMAGE_TAG comme variable de niveau pipeline et laisser la commande `export` du build remplacer sa valeur." }
    - id: b
      text: { en: "Declare IMAGE_TAG under `env: variables` in the buildspec so that CodePipeline reads its value after the build.", fr: "Déclarer IMAGE_TAG sous `env: variables` dans le buildspec afin que CodePipeline lise sa valeur après le build." }
    - id: c
      text: { en: "Write the tag to Parameter Store, and add a Lambda invoke action that calls UpdatePipeline to set the tag in the deploy action.", fr: "Écrire la balise dans Parameter Store, et ajouter une action d'appel Lambda qui appelle UpdatePipeline pour définir la balise dans l'action de déploiement." }
    - id: d
      text: { en: "List IMAGE_TAG under `env: exported-variables`, set the namespace BuildVariables on the build action, and use `#{BuildVariables.IMAGE_TAG}`.", fr: "Lister IMAGE_TAG sous `env: exported-variables`, définir l'espace de noms BuildVariables sur l'action de build, et utiliser `#{BuildVariables.IMAGE_TAG}`." }
answer: { optionId: d }
explanation:
  correct:
    en: "Variables listed under `exported-variables` become output variables of the CodeBuild action. When the producing action has a namespace, a later action can reference them with the `#{namespace.variable}` syntax, for example in ParameterOverrides."
    fr: "Les variables listées sous `exported-variables` deviennent des variables de sortie de l'action CodeBuild. Lorsque l'action productrice a un espace de noms, une action ultérieure peut les référencer avec la syntaxe `#{espace_de_noms.variable}`, par exemple dans ParameterOverrides."
  options:
    a:
      en: "Pipeline-level variables are resolved when the execution starts; a build cannot change their value."
      fr: "Les variables de niveau pipeline sont résolues au démarrage de l'exécution ; un build ne peut pas changer leur valeur."
    b:
      en: "Variables under `env: variables` are only environment variables of the build container; only exported variables are passed to CodePipeline."
      fr: "Les variables sous `env: variables` ne sont que des variables d'environnement du conteneur de build ; seules les variables exportées sont transmises à CodePipeline."
    c:
      en: "This needs custom code, and updating the pipeline stops the execution that is in progress."
      fr: "Cette solution exige du code personnalisé, et la mise à jour du pipeline arrête l'exécution en cours."
references:
  - title: Variables reference
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/reference-variables.html
  - title: Build specification reference for CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
