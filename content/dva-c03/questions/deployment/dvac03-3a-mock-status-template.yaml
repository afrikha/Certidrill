id: dvac03-3a-mock-status-template
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer configures `GET /status` of a REST API with a mock integration. The method has a 200 method response, and the 200 integration response has the mapping template `{"state": "ok"}`. The integration response for 200 must be the one that API Gateway returns for every call.

    What should the integration request mapping template for application/json contain?
  fr: |
    Un développeur configure `GET /status` d'une API REST avec une intégration fictive (mock). La méthode a une réponse de méthode 200, et la réponse d'intégration 200 a le modèle de mappage `{"state": "ok"}`. La réponse d'intégration 200 doit être celle qu'API Gateway renvoie à chaque appel.

    Que doit contenir le modèle de mappage de la requête d'intégration pour application/json ?
body:
  options:
    - { id: a, text: "{\"statusCode\": 200}" }
    - { id: b, text: "{\"body\": {\"state\": \"ok\"}}" }
    - { id: c, text: "$input.json('$')" }
    - { id: d, text: "{\"httpStatus\": \"200 OK\"}" }
answer: { optionId: a }
explanation:
  correct:
    en: "With a mock integration, the integration request mapping template produces the status code that selects the integration response; `{\"statusCode\": 200}` selects the 200 integration response. The body that the client receives comes from the mapping template of that integration response."
    fr: "Avec une intégration fictive, le modèle de mappage de la requête d'intégration produit le code d'état qui sélectionne la réponse d'intégration ; `{\"statusCode\": 200}` sélectionne la réponse d'intégration 200. Le corps reçu par le client provient du modèle de mappage de cette réponse d'intégration."
  options:
    b:
      en: "The request template does not produce the response body; without a statusCode, it does not select the 200 integration response."
      fr: "Le modèle de requête ne produit pas le corps de la réponse ; sans statusCode, il ne sélectionne pas la réponse d'intégration 200."
    c:
      en: "This passes the client's request body through, which contains no statusCode to select an integration response."
      fr: "Cela transmet le corps de la requête du client, qui ne contient aucun statusCode pour sélectionner une réponse d'intégration."
    d:
      en: "API Gateway reads the statusCode key of a mock request template; httpStatus is not used for the selection."
      fr: "API Gateway lit la clé statusCode d'un modèle de requête fictive ; httpStatus n'est pas utilisé pour la sélection."
references:
  - title: Mock integrations for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-mock-integration.html
