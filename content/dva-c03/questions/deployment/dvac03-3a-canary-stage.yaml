id: dvac03-3a-canary-stage
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The prod stage of an Amazon API Gateway REST API calls a Lambda alias through the stage variable `lambdaAlias`, which is set to `v7`. A developer has published a new alias, `v8`. About 10% of prod traffic must go to `v8` through the existing prod URL, and the requests that reach `v8` must have their own API Gateway execution logs and metrics. After validation, the change must be promoted to all traffic.

    Which solution will meet these requirements?
  fr: |
    L'étape prod d'une API REST Amazon API Gateway appelle un alias Lambda par la variable d'étape `lambdaAlias`, définie sur `v7`. Un développeur a publié un nouvel alias, `v8`. Environ 10 % du trafic de prod doit aller vers `v8` par l'URL prod existante, et les requêtes qui atteignent `v8` doivent avoir leurs propres journaux d'exécution et métriques API Gateway. Après validation, la modification doit être promue à tout le trafic.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a beta stage whose lambdaAlias variable is v8 and ask 10% of the clients to switch to the beta stage URL.", fr: "Créer une étape beta dont la variable lambdaAlias vaut v8 et demander à 10 % des clients de passer à l'URL de l'étape beta." } }
    - { id: b, text: { en: "Enable canary settings on the prod stage with percentTraffic 10 and a stage variable override that sets lambdaAlias to v8.", fr: "Activer les paramètres de canary sur l'étape prod avec percentTraffic 10 et un remplacement de variable d'étape qui définit lambdaAlias sur v8." } }
    - { id: c, text: { en: "Configure weighted routing on the v7 alias so that it sends 10% of its invocations to the version behind v8.", fr: "Configurer un routage pondéré sur l'alias v7 pour qu'il envoie 10 % de ses appels vers la version qui se trouve derrière v8." } }
    - { id: d, text: { en: "Create a usage plan for the prod stage that throttles v7 so that the remaining requests are sent to v8.", fr: "Créer pour l'étape prod un plan d'utilisation qui limite v7 pour que les requêtes restantes soient envoyées vers v8." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A canary release on a stage randomly sends percentTraffic of the requests to the canary, and stageVariableOverrides can replace production stage variables for those requests only. Canary requests get separate execution logs (a /Canary log group) and metrics, and the canary can then be promoted to the production release."
    fr: "Une version canary sur une étape envoie aléatoirement percentTraffic des requêtes vers le canary, et stageVariableOverrides peut remplacer les variables d'étape de production pour ces seules requêtes. Les requêtes canary ont des journaux d'exécution (groupe de journaux /Canary) et des métriques distincts, et le canary peut ensuite être promu en version de production."
  options:
    a:
      en: "A separate stage has its own URL, so clients must change endpoints, and the split is not a share of prod traffic."
      fr: "Une étape distincte a sa propre URL : les clients doivent changer de point de terminaison, et la répartition n'est pas une part du trafic de prod."
    c:
      en: "Alias weighted routing splits the traffic inside Lambda, so API Gateway cannot log or measure the v8 requests separately."
      fr: "Le routage pondéré d'alias répartit le trafic dans Lambda : API Gateway ne peut pas journaliser ni mesurer séparément les requêtes v8."
    d:
      en: "Usage plans throttle API keys; throttled requests receive 429 errors and are never redirected to another alias."
      fr: "Les plans d'utilisation limitent des clés d'API ; les requêtes limitées reçoivent des erreurs 429 et ne sont jamais redirigées vers un autre alias."
references:
  - title: Set up an API Gateway canary release deployment
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/canary-release.html
