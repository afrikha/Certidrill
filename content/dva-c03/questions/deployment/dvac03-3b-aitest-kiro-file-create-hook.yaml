id: dvac03-3b-aitest-kiro-file-create-hook
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team at AnyCompany uses the Kiro IDE to build a Node.js service. Whenever the Kiro agent creates a new source file under src/handlers/, the team wants Kiro to automatically write a matching unit test file in tests/handlers/ that follows the team's test conventions. Developers must not have to remember to ask for the tests.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'AnyCompany utilise l'IDE Kiro pour créer un service Node.js. Chaque fois que l'agent Kiro crée un nouveau fichier source sous src/handlers/, l'équipe veut que Kiro écrive automatiquement un fichier de test unitaire correspondant dans tests/handlers/ en suivant les conventions de test de l'équipe. Les développeurs ne doivent pas avoir à penser à demander les tests.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a steering file in .kiro/steering/ that describes the test conventions and where the test files must be stored.", fr: "Ajouter dans .kiro/steering/ un fichier steering qui décrit les conventions de test et l'emplacement des fichiers de test." } }
    - { id: b, text: { en: "Create an agent hook with a File Create trigger on src/handlers/ and an agent prompt action that writes the matching test.", fr: "Créer un hook d'agent avec un déclencheur File Create sur src/handlers/ et une action de prompt d'agent qui écrit le test correspondant." } }
    - { id: c, text: { en: "Create an agent hook with a Session Start trigger and an agent prompt action that asks Kiro to write tests for all handlers.", fr: "Créer un hook d'agent avec un déclencheur Session Start et une action de prompt d'agent qui demande à Kiro d'écrire des tests pour tous les gestionnaires." } }
    - { id: d, text: { en: "Add a task to the tasks.md file of the current spec that reminds developers to ask Kiro for the unit tests.", fr: "Ajouter au fichier tasks.md de la spec en cours une tâche qui rappelle aux développeurs de demander les tests unitaires à Kiro." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Kiro hooks run an action automatically when an event occurs. A File Create hook fires when the agent creates files that match its pattern, and an agent prompt action instructs Kiro to generate the companion test file, which is one of the documented uses of hooks."
    fr: "Les hooks Kiro exécutent automatiquement une action lorsqu'un événement se produit. Un hook File Create se déclenche lorsque l'agent crée des fichiers qui correspondent à son modèle, et une action de prompt d'agent demande à Kiro de générer le fichier de test associé, ce qui fait partie des usages documentés des hooks."
  options:
    a:
      en: "Steering gives Kiro persistent guidance on how to write tests, but it does not trigger any work when a file is created."
      fr: "Le steering donne à Kiro des consignes persistantes sur la façon d'écrire les tests, mais ne déclenche aucun travail à la création d'un fichier."
    c:
      en: "A Session Start hook fires once when a chat session begins, not each time a handler file is created."
      fr: "Un hook Session Start se déclenche une seule fois au début d'une session de chat, pas à chaque création d'un fichier de gestionnaire."
    d:
      en: "A reminder task still depends on developers asking for tests, which violates the requirement."
      fr: "Une tâche de rappel dépend toujours des développeurs qui doivent demander les tests, ce qui enfreint l'exigence."
references:
  - title: Hooks - Features - Docs - Kiro
    url: https://kiro.dev/docs/hooks/
  - title: Hook triggers - Hooks - Features - Docs - Kiro
    url: https://kiro.dev/docs/hooks/types/
