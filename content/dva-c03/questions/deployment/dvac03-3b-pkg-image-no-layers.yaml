id: dvac03-3b-pkg-image-no-layers
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is converting a Node.js AWS Lambda function from a .zip package to a container image built from the AWS base image for Node.js. The .zip version used a shared Lambda layer that provides an internal logging library. After the conversion, the developer tries to attach the same layer version to the image-based function, and the update is rejected.

    How should the developer include the logging library?
  fr: |
    AnyCompany convertit une fonction AWS Lambda Node.js d'un package .zip vers une image de conteneur construite à partir de l'image de base AWS pour Node.js. La version .zip utilisait une couche Lambda partagée qui fournit une bibliothèque interne de journalisation. Après la conversion, le développeur essaie d'associer la même version de couche à la fonction basée sur une image, et la mise à jour est rejetée.

    Comment le développeur doit-il inclure la bibliothèque de journalisation ?
body:
  options:
    - { id: a, text: { en: "Publish a new version of the layer with the container image package type listed as compatible.", fr: "Publier une nouvelle version de la couche en déclarant le type de package image de conteneur comme compatible." } }
    - { id: b, text: { en: "Copy the logging library into the image in the Dockerfile so that it is part of the container image.", fr: "Copier la bibliothèque de journalisation dans l'image dans le Dockerfile afin qu'elle fasse partie de l'image de conteneur." } }
    - { id: c, text: { en: "Mount an Amazon EFS file system that contains the layer's .zip file and unzip it into /opt at startup.", fr: "Monter un système de fichiers Amazon EFS qui contient le fichier .zip de la couche et le décompresser dans /opt au démarrage." } }
    - { id: d, text: { en: "Attach the layer to an alias of the function instead of to the function version.", fr: "Associer la couche à un alias de la fonction plutôt qu'à la version de la fonction." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Layers can be used only with functions deployed as .zip file archives. For a function defined as a container image, the runtime and all code dependencies, including shared libraries, must be packaged into the image when it is built."
    fr: "Les couches ne peuvent être utilisées qu'avec des fonctions déployées sous forme d'archives .zip. Pour une fonction définie comme image de conteneur, le runtime et toutes les dépendances du code, y compris les bibliothèques partagées, doivent être intégrés à l'image lors de sa création."
  options:
    a:
      en: "No layer setting makes a layer usable by an image-based function; image functions do not support layers."
      fr: "Aucun paramètre de couche ne rend une couche utilisable par une fonction basée sur une image ; les fonctions basées sur une image ne prennent pas en charge les couches."
    c:
      en: "The image file system is read-only except /tmp, and unzipping a library at every startup adds complexity and cold start time instead of packaging it."
      fr: "Le système de fichiers de l'image est en lecture seule sauf /tmp, et décompresser une bibliothèque à chaque démarrage ajoute de la complexité et du temps de démarrage à froid au lieu de l'intégrer."
    d:
      en: "An alias only points to versions and has no layer configuration of its own."
      fr: "Un alias pointe seulement vers des versions et n'a pas de configuration de couches propre."
references:
  - title: Managing Lambda Event Function dependencies with layers
    url: https://docs.aws.amazon.com/lambda/latest/dg/chapter-layers.html
