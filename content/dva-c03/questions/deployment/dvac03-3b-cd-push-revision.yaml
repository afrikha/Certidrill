id: dvac03-3b-cd-push-revision
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at AnyCompany has an application folder that contains the code, the scripts, and an appspec.yml file at its root. The developer must bundle the folder as a revision, upload it to the S3 bucket billing-revisions in the Region of the target EC2 instances, register it with the CodeDeploy application billing-app, and then deploy it to the deployment group prod. The developer wants the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany dispose d'un dossier d'application qui contient le code, les scripts et un fichier appspec.yml à sa racine. Le développeur doit empaqueter le dossier en révision, le charger dans le compartiment S3 billing-revisions de la Région des instances EC2 cibles, l'associer à l'application CodeDeploy billing-app, puis le déployer dans le groupe de déploiement prod. Le développeur veut le MOINS d'efforts possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run aws deploy push for billing-app with the S3 location and the folder as source, then run aws deploy create-deployment for prod.", fr: "Exécuter aws deploy push pour billing-app avec l'emplacement S3 et le dossier comme source, puis exécuter aws deploy create-deployment pour prod." } }
    - { id: b, text: { en: "Run aws s3 sync to copy the folder to billing-revisions, then run aws deploy create-deployment for prod with bundleType set to zip.", fr: "Exécuter aws s3 sync pour copier le dossier dans billing-revisions, puis exécuter aws deploy create-deployment pour prod avec bundleType défini sur zip." } }
    - { id: c, text: { en: "Run aws cloudformation package on appspec.yml to upload the folder, then run aws deploy create-deployment with the output file.", fr: "Exécuter aws cloudformation package sur appspec.yml pour charger le dossier, puis exécuter aws deploy create-deployment avec le fichier de sortie." } }
    - { id: d, text: { en: "Copy the folder to each instance with AWS Systems Manager Run Command, then run aws deploy create-deployment for prod without a revision.", fr: "Copier le dossier sur chaque instance avec AWS Systems Manager Run Command, puis exécuter aws deploy create-deployment pour prod sans révision." } }
answer: { optionId: a }
explanation:
  correct:
    en: "aws deploy push bundles the files and the AppSpec file into a .zip revision, uploads it to the S3 location, and associates it with the CodeDeploy application. aws deploy create-deployment then deploys that bucket, key, and bundle type to the deployment group."
    fr: "aws deploy push empaquette les fichiers et le fichier AppSpec dans une révision .zip, la charge à l'emplacement S3 et l'associe à l'application CodeDeploy. aws deploy create-deployment déploie ensuite ce compartiment, cette clé et ce type de bundle dans le groupe de déploiement."
  options:
    b:
      en: "s3 sync copies individual files instead of creating a .zip bundle, so there is no zip object for the deployment to use."
      fr: "s3 sync copie des fichiers individuels au lieu de créer un bundle .zip : il n'existe aucun objet zip que le déploiement puisse utiliser."
    c:
      en: "cloudformation package uploads artifacts referenced by a CloudFormation template; it does not build a CodeDeploy revision from appspec.yml."
      fr: "cloudformation package charge les artefacts référencés par un modèle CloudFormation ; il ne crée pas de révision CodeDeploy à partir d'appspec.yml."
    d:
      en: "A CodeDeploy deployment always deploys a revision; copying files by hand bypasses CodeDeploy and requires much more effort."
      fr: "Un déploiement CodeDeploy déploie toujours une révision ; copier les fichiers à la main contourne CodeDeploy et demande beaucoup plus d'efforts."
references:
  - title: Push a revision for CodeDeploy to Amazon S3 (EC2/On-Premises deployments only)
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/application-revisions-push.html
