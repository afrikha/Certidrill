id: dvac03-3a-sam-start-lambda-tests
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team writes automated integration tests in Python for an AWS SAM application. The tests use a boto3 Lambda client to call `invoke` on the functions of the template. In the CI job, which has Docker, the tests must run against the local function code without deploying any stack, and the test code must stay unchanged except for the client configuration.

    Which solution will meet these requirements?
  fr: |
    Une équipe écrit des tests d'intégration automatisés en Python pour une application AWS SAM. Les tests utilisent un client Lambda boto3 pour appeler `invoke` sur les fonctions du modèle. Dans le job de CI, qui dispose de Docker, les tests doivent s'exécuter sur le code local des fonctions sans déployer de pile, et le code des tests doit rester inchangé, à l'exception de la configuration du client.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run sam local start-api and set the endpoint_url of the boto3 Lambda client to the local API address.", fr: "Exécuter sam local start-api et définir l'endpoint_url du client Lambda boto3 sur l'adresse de l'API locale." } }
    - { id: b, text: { en: "Run sam remote invoke for each function from the tests and parse the command output.", fr: "Exécuter sam remote invoke pour chaque fonction depuis les tests et analyser la sortie de la commande." } }
    - { id: c, text: { en: "Replace each boto3 invoke call with a subprocess call to sam local invoke and an event file.", fr: "Remplacer chaque appel invoke de boto3 par un appel subprocess à sam local invoke avec un fichier d'événement." } }
    - { id: d, text: { en: "Run sam local start-lambda and set the endpoint_url of the boto3 Lambda client to http://127.0.0.1:3001.", fr: "Exécuter sam local start-lambda et définir l'endpoint_url du client Lambda boto3 sur http://127.0.0.1:3001." } }
answer: { optionId: d }
explanation:
  correct:
    en: "sam local start-lambda starts a local endpoint that emulates Lambda, so AWS SDK and AWS CLI calls can invoke the template's functions locally. Pointing the boto3 Lambda client at the local endpoint, http://127.0.0.1:3001 by default, keeps the invoke calls of the tests unchanged."
    fr: "sam local start-lambda démarre un point de terminaison local qui émule Lambda : les appels du SDK AWS et de l'AWS CLI peuvent appeler localement les fonctions du modèle. Faire pointer le client Lambda boto3 vers le point de terminaison local, http://127.0.0.1:3001 par défaut, conserve les appels invoke des tests."
  options:
    a:
      en: "sam local start-api serves the API Gateway routes over HTTP; it does not expose the Lambda invoke API that the boto3 client calls."
      fr: "sam local start-api sert les routes API Gateway en HTTP ; il n'expose pas l'API invoke de Lambda qu'appelle le client boto3."
    b:
      en: "sam remote invoke needs functions deployed to the AWS Cloud, and it changes the test code."
      fr: "sam remote invoke nécessite des fonctions déployées dans le cloud AWS, et il modifie le code des tests."
    c:
      en: "This runs the code locally, but it rewrites every test instead of only the client configuration."
      fr: "Cela exécute le code localement, mais réécrit chaque test au lieu de la seule configuration du client."
references:
  - title: Introduction to testing with sam local start-lambda
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-local-start-lambda.html
