id: dvac03-3c-ai-approval-guardrails
objective: "3.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company plans to let an AI agent recommend whether builds should be promoted from staging to production in its AWS CodePipeline pipeline. The security team requires that a manipulated prompt cannot make the agent promote a release to production, and that a named person remains accountable for every production promotion.

    Which solution will meet these requirements?
  fr: |
    Une entreprise prévoit de laisser un agent d'IA recommander si des builds doivent être promus de l'environnement intermédiaire vers la production dans son pipeline AWS CodePipeline. L'équipe de sécurité exige qu'une invite manipulée ne puisse pas amener l'agent à promouvoir une version en production, et qu'une personne nommée reste responsable de chaque promotion en production.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Give the agent's role the AdministratorAccess policy so that the agent can also fix failed production deployments without waiting for a human.", fr: "Attribuer la politique AdministratorAccess au rôle de l'agent afin qu'il puisse aussi corriger les déploiements en production en échec sans attendre un humain." }
    - id: b
      text: { en: "Allow the agent to call codepipeline:UpdatePipeline so that it can add or remove the production approval action depending on the risk.", fr: "Autoriser l'agent à appeler codepipeline:UpdatePipeline afin qu'il ajoute ou supprime l'action d'approbation de production selon le risque." }
    - id: c
      text: { en: "Allow the agent to call codepipeline:PutApprovalResult on every approval action in the account so that promotions are faster.", fr: "Autoriser l'agent à appeler codepipeline:PutApprovalResult sur toutes les actions d'approbation du compte afin d'accélérer les promotions." }
    - id: d
      text: { en: "Send the agent's recommendation to the reviewers of a production manual approval action, and give the agent read-only access.", fr: "Envoyer la recommandation de l'agent aux réviseurs d'une action d'approbation manuelle de production, et donner à l'agent un accès en lecture seule." }
answer: { optionId: d }
explanation:
  correct:
    en: "When the agent can only read pipeline state and post a recommendation, even a manipulated prompt cannot approve a production release, because IAM does not allow the agent to call PutApprovalResult. A human reviewer approves or rejects the manual approval action, and that decision is recorded with the reviewer's identity."
    fr: "Lorsque l'agent peut seulement lire l'état du pipeline et publier une recommandation, même une invite manipulée ne peut pas approuver une version de production, car IAM ne permet pas à l'agent d'appeler PutApprovalResult. Un réviseur humain approuve ou rejette l'action d'approbation manuelle, et cette décision est enregistrée avec l'identité du réviseur."
  options:
    a:
      en: "Administrator access lets a manipulated agent do anything in the account, including deploying to production."
      fr: "Un accès administrateur permet à un agent manipulé de tout faire dans le compte, y compris déployer en production."
    b:
      en: "An agent that can remove the approval action can promote a release with no human decision."
      fr: "Un agent capable de supprimer l'action d'approbation peut promouvoir une version sans décision humaine."
    c:
      en: "The agent could approve production releases itself, so no person is accountable for those promotions."
      fr: "L'agent pourrait approuver lui-même des versions de production : aucune personne ne serait responsable de ces promotions."
references:
  - title: Grant approval permissions to an IAM user in CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals-iam-permissions.html
  - title: Add a manual approval action to a stage
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
