id: dvac03-3a-eb-requirements
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer deploys a Flask web application to an AWS Elastic Beanstalk environment that runs on the Python platform. The developer uploads a source bundle that contains only the application code. The application fails to start because Flask is not installed on the instances. Elastic Beanstalk must install the dependencies on each instance during deployment.

    Which solution will meet these requirements?
  fr: |
    Un développeur déploie une application web Flask dans un environnement AWS Elastic Beanstalk qui s'exécute sur la plateforme Python. Il charge un bundle de source qui ne contient que le code de l'application. L'application ne démarre pas, car Flask n'est pas installé sur les instances. Elastic Beanstalk doit installer les dépendances sur chaque instance pendant le déploiement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a Procfile at the top level of the source bundle that lists Flask and its version.", fr: "Ajouter un Procfile au premier niveau du bundle de source qui liste Flask et sa version." } }
    - { id: b, text: { en: "Add a requirements.txt file that lists Flask at the top level of the source bundle.", fr: "Ajouter un fichier requirements.txt qui liste Flask au premier niveau du bundle de source." } }
    - { id: c, text: { en: "Add a requirements.txt file that lists Flask inside the .ebextensions folder of the source bundle.", fr: "Ajouter un fichier requirements.txt qui liste Flask dans le dossier .ebextensions du bundle de source." } }
    - { id: d, text: { en: "Add a buildspec.yml file that runs pip install flask in its install phase to the source bundle.", fr: "Ajouter au bundle de source un fichier buildspec.yml qui exécute pip install flask dans sa phase install." } }
answer: { optionId: b }
explanation:
  correct:
    en: "On the Python platform, Elastic Beanstalk looks for requirements.txt in the top-level directory of the source bundle and runs pip install -r requirements.txt when it deploys an instance. Pipfile.lock or Pipfile are alternatives, with requirements.txt taking precedence."
    fr: "Sur la plateforme Python, Elastic Beanstalk recherche requirements.txt dans le répertoire de premier niveau du bundle de source et exécute pip install -r requirements.txt lorsqu'il déploie une instance. Pipfile.lock ou Pipfile sont des alternatives, requirements.txt étant prioritaire."
  options:
    a:
      en: "A Procfile declares the commands that start the application processes; it does not install packages."
      fr: "Un Procfile déclare les commandes qui démarrent les processus de l'application ; il n'installe pas de packages."
    c:
      en: "The requirements file must be in the top-level directory of the bundle; .ebextensions holds .config files, not dependency files."
      fr: "Le fichier des dépendances doit se trouver au premier niveau du bundle ; .ebextensions contient des fichiers .config, pas des fichiers de dépendances."
    d:
      en: "buildspec.yml is read by AWS CodeBuild; Elastic Beanstalk ignores it when it deploys a source bundle."
      fr: "buildspec.yml est lu par AWS CodeBuild ; Elastic Beanstalk l'ignore lorsqu'il déploie un bundle de source."
references:
  - title: Specifying dependencies using a requirements file on Elastic Beanstalk
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/python-configuration-requirements.html
