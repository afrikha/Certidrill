id: dvac03-3c-ecs-linear-config
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon ECS service on AWS Fargate runs behind an Application Load Balancer and uses AWS CodeDeploy blue/green deployments. For each release, traffic must move to the replacement task set in equal increments of 10% every 3 minutes until it receives all the traffic.

    Which deployment configuration should the developer choose?
  fr: |
    Un service Amazon ECS sur AWS Fargate s'exécute derrière un Application Load Balancer et utilise des déploiements bleu/vert AWS CodeDeploy. Pour chaque version, le trafic doit passer vers le jeu de tâches de remplacement par incréments égaux de 10 % toutes les 3 minutes, jusqu'à ce qu'il reçoive la totalité du trafic.

    Quelle configuration de déploiement le développeur doit-il choisir ?
body:
  options:
    - { id: a, text: CodeDeployDefault.ECSCanary10Percent5Minutes }
    - { id: b, text: CodeDeployDefault.ECSAllAtOnce }
    - { id: c, text: CodeDeployDefault.LambdaLinear10PercentEvery3Minutes }
    - { id: d, text: CodeDeployDefault.ECSLinear10PercentEvery3Minutes }
answer: { optionId: d }
explanation:
  correct:
    en: "Linear configurations shift traffic in equal increments with an equal number of minutes between them. CodeDeployDefault.ECSLinear10PercentEvery3Minutes moves 10% of the traffic to the replacement task set every 3 minutes until all the traffic has moved."
    fr: "Les configurations linéaires transfèrent le trafic par incréments égaux séparés par le même nombre de minutes. CodeDeployDefault.ECSLinear10PercentEvery3Minutes déplace 10 % du trafic vers le jeu de tâches de remplacement toutes les 3 minutes jusqu'au transfert complet."
  options:
    a:
      en: "A canary configuration shifts traffic in two increments: 10%, then the remaining 90% after 5 minutes."
      fr: "Une configuration canary transfère le trafic en deux incréments : 10 %, puis les 90 % restants au bout de 5 minutes."
    b:
      en: "ECSAllAtOnce moves all the traffic to the replacement task set at once."
      fr: "ECSAllAtOnce déplace tout le trafic vers le jeu de tâches de remplacement en une seule fois."
    c:
      en: "This configuration belongs to the AWS Lambda compute platform and cannot be used by an ECS deployment group."
      fr: "Cette configuration appartient à la plateforme de calcul AWS Lambda et ne peut pas être utilisée par un groupe de déploiement ECS."
references:
  - title: Working with deployment configurations in CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
