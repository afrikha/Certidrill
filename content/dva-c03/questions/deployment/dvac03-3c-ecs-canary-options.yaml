id: dvac03-3c-ecs-canary-options
objective: "3.3.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company is creating a new Amazon ECS service on AWS Fargate behind an Application Load Balancer. For each release, 10% of production traffic must go to the new revision for 15 minutes before all traffic moves. If a CloudWatch alarm on HTTP 5xx errors enters the ALARM state during the deployment, traffic must automatically return to the previous revision.

    Which two solutions will meet these requirements? (Choose two.) Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise crée un nouveau service Amazon ECS sur AWS Fargate derrière un Application Load Balancer. Pour chaque version, 10 % du trafic de production doit aller vers la nouvelle révision pendant 15 minutes avant que tout le trafic ne soit transféré. Si une alarme CloudWatch sur les erreurs HTTP 5xx passe à l'état ALARM pendant le déploiement, le trafic doit revenir automatiquement vers la révision précédente.

    Quelles sont les deux solutions qui répondent à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Use the ECS deployment controller with the canary deployment strategy, 10% canary traffic, a 15-minute canary bake time, and the alarm configured with rollback.", fr: "Utiliser le contrôleur de déploiement ECS avec la stratégie de déploiement canary, 10 % de trafic canary, un temps de stabilisation (bake time) canary de 15 minutes et l'alarme configurée avec restauration." } }
    - { id: b, text: { en: "Use rolling updates with the deployment circuit breaker and rollback enabled, and set maximumPercent to 110.", fr: "Utiliser des mises à jour propagées avec le disjoncteur de déploiement et la restauration activés, et définir maximumPercent sur 110." } }
    - { id: c, text: { en: "Use the CodeDeploy deployment controller with CodeDeployDefault.ECSCanary10Percent15Minutes and a deployment group that rolls back when alarm thresholds are met.", fr: "Utiliser le contrôleur de déploiement CodeDeploy avec CodeDeployDefault.ECSCanary10Percent15Minutes et un groupe de déploiement qui effectue une restauration quand les seuils d'alarme sont atteints." } }
    - { id: d, text: { en: "Use the CodeDeploy deployment controller with CodeDeployDefault.ECSLinear10PercentEvery1Minutes and automatic rollback when a deployment fails.", fr: "Utiliser le contrôleur de déploiement CodeDeploy avec CodeDeployDefault.ECSLinear10PercentEvery1Minutes et la restauration automatique en cas d'échec du déploiement." } }
    - { id: e, text: { en: "Use rolling updates with minimumHealthyPercent set to 90 and the 5xx alarm configured with rollback in the deployment configuration.", fr: "Utiliser des mises à jour propagées avec minimumHealthyPercent défini sur 90 et l'alarme 5xx configurée avec restauration dans la configuration de déploiement." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Amazon ECS canary deployments send a configurable share of production traffic to the new revision, wait for the canary bake time, then shift the rest, and roll back when a configured alarm fires. A CodeDeploy blue/green deployment with ECSCanary10Percent15Minutes shifts 10% and then the remaining 90% after 15 minutes, and the deployment group can roll back when alarm thresholds are met."
    fr: "Les déploiements canary Amazon ECS envoient une part configurable du trafic de production vers la nouvelle révision, attendent la fin du temps de stabilisation canary, transfèrent le reste, et effectuent une restauration lorsqu'une alarme configurée se déclenche. Un déploiement bleu/vert CodeDeploy avec ECSCanary10Percent15Minutes transfère 10 % puis les 90 % restants au bout de 15 minutes, et le groupe de déploiement peut effectuer une restauration quand les seuils d'alarme sont atteints."
  options:
    b:
      en: "The circuit breaker reacts to tasks that fail to start or fail health checks; rolling updates do not hold 10% of traffic on the new revision for 15 minutes."
      fr: "Le disjoncteur réagit aux tâches qui ne démarrent pas ou échouent aux vérifications de l'état ; les mises à jour propagées ne maintiennent pas 10 % du trafic sur la nouvelle révision pendant 15 minutes."
    d:
      en: "This linear configuration reaches 100% after 10 one-minute steps, and rollback on deployment failure does not react to the 5xx alarm."
      fr: "Cette configuration linéaire atteint 100 % après 10 étapes d'une minute, et la restauration en cas d'échec du déploiement ne réagit pas à l'alarme 5xx."
    e:
      en: "Rolling updates replace tasks without a 10% traffic phase of 15 minutes; minimumHealthyPercent only limits how many tasks are stopped at a time."
      fr: "Les mises à jour propagées remplacent les tâches sans phase de 15 minutes à 10 % du trafic ; minimumHealthyPercent limite seulement le nombre de tâches arrêtées à la fois."
references:
  - title: Amazon ECS canary deployments
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/canary-deployment.html
  - title: Working with deployment configurations in CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
