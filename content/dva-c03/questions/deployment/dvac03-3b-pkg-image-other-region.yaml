id: dvac03-3b-pkg-image-other-region
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's CI pipeline pushes a Lambda container image to an Amazon ECR private repository in us-east-1 for every release. The company now needs to deploy the same image-based function in eu-west-1 as well. Creating the eu-west-1 function with the us-east-1 image URI fails. The team wants each new release image to be available for eu-west-1 automatically, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Le pipeline de CI d'AnyCompany envoie une image de conteneur Lambda dans un référentiel privé Amazon ECR de us-east-1 à chaque livraison. L'entreprise doit maintenant déployer aussi la même fonction basée sur une image dans eu-west-1. La création de la fonction de eu-west-1 avec l'URI de l'image de us-east-1 échoue. L'équipe veut que chaque nouvelle image de livraison soit disponible automatiquement pour eu-west-1, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a repository policy in us-east-1 that allows the Lambda service in eu-west-1 to pull the image across Regions.", fr: "Ajouter dans us-east-1 une politique de référentiel qui autorise le service Lambda de eu-west-1 à extraire l'image d'une Région à l'autre." } }
    - { id: b, text: { en: "Push the image to an Amazon ECR Public repository and reference the public image URI for the eu-west-1 function.", fr: "Envoyer l'image dans un référentiel Amazon ECR Public et référencer l'URI de l'image publique pour la fonction de eu-west-1." } }
    - { id: c, text: { en: "Configure cross-Region replication to eu-west-1 in the private registry and use the replicated image for the function.", fr: "Configurer la réplication entre Régions vers eu-west-1 dans le registre privé et utiliser l'image répliquée pour la fonction." } }
    - { id: d, text: { en: "Add a second pipeline job that rebuilds the image from the Dockerfile and pushes it in eu-west-1 for every release.", fr: "Ajouter au pipeline une seconde tâche qui reconstruit l'image à partir du Dockerfile et l'envoie dans eu-west-1 à chaque livraison." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A Lambda function must use an image from an Amazon ECR repository in the same Region as the function. Registry-level cross-Region replication automatically copies every image pushed after it is configured to the destination Region, so the eu-west-1 function can reference the replicated image without extra pipeline work."
    fr: "Une fonction Lambda doit utiliser une image d'un référentiel Amazon ECR situé dans la même Région que la fonction. La réplication entre Régions au niveau du registre copie automatiquement dans la Région de destination chaque image envoyée après sa configuration : la fonction de eu-west-1 peut référencer l'image répliquée sans travail supplémentaire dans le pipeline."
  options:
    a:
      en: "Permissions do not remove the requirement that the repository be in the function's Region."
      fr: "Les autorisations ne suppriment pas l'exigence selon laquelle le référentiel doit se trouver dans la Région de la fonction."
    b:
      en: "Lambda needs the image in an Amazon ECR repository in the function's Region, and publishing internal code publicly exposes it to anyone."
      fr: "Lambda a besoin de l'image dans un référentiel Amazon ECR de la Région de la fonction, et publier du code interne l'expose à tout le monde."
    d:
      en: "Rebuilding works but doubles build work for each release and can produce an image that differs from the tested one."
      fr: "Reconstruire fonctionne, mais double le travail de build à chaque livraison et peut produire une image différente de celle qui a été testée."
references:
  - title: Create a Lambda Event Function using a container image
    url: https://docs.aws.amazon.com/lambda/latest/dg/images-create.html
  - title: Private image replication in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/replication.html
