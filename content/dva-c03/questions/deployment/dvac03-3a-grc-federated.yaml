id: dvac03-3a-grc-federated
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers at AnyCompany sign in to AWS through AWS IAM Identity Center and use temporary credentials in named AWS CLI profiles. They must clone and push to AWS CodeCommit repositories over HTTPS from their workstations. The company does not create IAM users and does not allow long-term credentials.

    Which solution will meet these requirements?
  fr: |
    Les développeurs d'AnyCompany se connectent à AWS par AWS IAM Identity Center et utilisent des informations d'identification temporaires dans des profils nommés de l'AWS CLI. Ils doivent cloner des référentiels AWS CodeCommit et y transférer du code en HTTPS depuis leurs postes de travail. L'entreprise ne crée pas d'utilisateurs IAM et n'autorise pas d'informations d'identification de longue durée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Generate HTTPS Git credentials for each developer in IAM and store them in the Git credential manager.", fr: "Générer dans IAM des informations d'identification Git HTTPS pour chaque développeur et les stocker dans le gestionnaire d'informations d'identification Git." } }
    - { id: b, text: { en: "Upload an SSH public key for each developer in IAM and clone the repositories with their SSH URLs.", fr: "Charger dans IAM une clé publique SSH pour chaque développeur et cloner les référentiels avec leurs URL SSH." } }
    - { id: c, text: { en: "Create an access key for a shared automation identity and configure it as the default AWS CLI profile.", fr: "Créer une clé d'accès pour une identité d'automatisation partagée et la configurer comme profil AWS CLI par défaut." } }
    - { id: d, text: { en: "Install git-remote-codecommit and clone with codecommit:// URLs that name the developer's AWS CLI profile.", fr: "Installer git-remote-codecommit et cloner avec des URL codecommit:// qui indiquent le profil AWS CLI du développeur." } }
answer: { optionId: d }
explanation:
  correct:
    en: "git-remote-codecommit extends Git to sign CodeCommit requests with AWS CLI credentials. It is the recommended method for federated access, identity providers and temporary credentials, and it does not require Git credentials; a URL such as codecommit://Profile@Repo selects the profile."
    fr: "git-remote-codecommit étend Git pour signer les requêtes CodeCommit avec les informations d'identification de l'AWS CLI. C'est la méthode recommandée pour l'accès fédéré, les fournisseurs d'identité et les informations d'identification temporaires, et elle ne nécessite pas d'informations d'identification Git ; une URL comme codecommit://Profile@Repo sélectionne le profil."
  options:
    a:
      en: "HTTPS Git credentials are long-term credentials attached to IAM users, which the company does not create."
      fr: "Les informations d'identification Git HTTPS sont des informations de longue durée liées à des utilisateurs IAM, que l'entreprise ne crée pas."
    b:
      en: "SSH keys for CodeCommit are also attached to IAM users and are long-term credentials."
      fr: "Les clés SSH pour CodeCommit sont aussi liées à des utilisateurs IAM et sont des informations d'identification de longue durée."
    c:
      en: "An access key is a long-term credential, and sharing it removes individual accountability."
      fr: "Une clé d'accès est une information d'identification de longue durée, et la partager supprime la traçabilité individuelle."
references:
  - title: Setup steps for HTTPS connections to AWS CodeCommit with git-remote-codecommit
    url: https://docs.aws.amazon.com/codecommit/latest/userguide/setting-up-git-remote-codecommit.html
