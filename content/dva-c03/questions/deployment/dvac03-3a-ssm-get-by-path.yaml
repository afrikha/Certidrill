id: dvac03-3a-ssm-get-by-path
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application stores its settings in AWS Systems Manager Parameter Store under one path per environment, for example `/orders/prod/db/host`, `/orders/prod/db/password` (SecureString) and `/orders/prod/api/timeout`. When it starts in production, the Python code must load every parameter under `/orders/prod` with the SecureString values decrypted, following `NextToken` until all pages are read.

    Which call should the code make for each page?
  fr: |
    Une application stocke ses paramètres dans AWS Systems Manager Parameter Store sous un chemin par environnement, par exemple `/orders/prod/db/host`, `/orders/prod/db/password` (SecureString) et `/orders/prod/api/timeout`. À son démarrage en production, le code Python doit charger tous les paramètres situés sous `/orders/prod` avec les valeurs SecureString déchiffrées, en suivant `NextToken` jusqu'à ce que toutes les pages soient lues.

    Quel appel le code doit-il effectuer pour chaque page ?
body:
  options:
    - { id: a, text: "ssm.get_parameter(Name=\"/orders/prod\", WithDecryption=True)" }
    - { id: b, text: "ssm.get_parameters_by_path(Path=\"/orders/prod\", Recursive=True, WithDecryption=True)" }
    - { id: c, text: "ssm.get_parameters_by_path(Path=\"/orders/prod\")" }
    - { id: d, text: "ssm.get_parameters(Names=[\"/orders/prod/*\"], WithDecryption=True)" }
answer: { optionId: b }
explanation:
  correct:
    en: "GetParametersByPath returns the parameters under a hierarchy level. Recursive retrieves all levels below the path, such as /orders/prod/db/host, and WithDecryption returns SecureString values decrypted. Results are paginated with NextToken, with at most 10 items per page."
    fr: "GetParametersByPath renvoie les paramètres situés sous un niveau de hiérarchie. Recursive récupère tous les niveaux sous le chemin, comme /orders/prod/db/host, et WithDecryption renvoie les valeurs SecureString déchiffrées. Les résultats sont paginés avec NextToken, avec au plus 10 éléments par page."
  options:
    a:
      en: "get_parameter reads one parameter by its exact name; /orders/prod is a path, not a parameter."
      fr: "get_parameter lit un paramètre par son nom exact ; /orders/prod est un chemin, pas un paramètre."
    c:
      en: "Without Recursive, only the parameters directly under /orders/prod are returned, not those under /orders/prod/db, and SecureString values stay encrypted."
      fr: "Sans Recursive, seuls les paramètres situés directement sous /orders/prod sont renvoyés, pas ceux de /orders/prod/db, et les valeurs SecureString restent chiffrées."
    d:
      en: "get_parameters takes exact parameter names and does not expand wildcards."
      fr: "get_parameters prend des noms de paramètres exacts et ne développe pas les caractères génériques."
references:
  - title: GetParametersByPath
    url: https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_GetParametersByPath.html
  - title: Working with parameter hierarchies in Parameter Store
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-hierarchies.html
