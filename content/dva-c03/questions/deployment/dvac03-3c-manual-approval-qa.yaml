id: dvac03-3c-manual-approval-qa
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline has Build, Staging and Production stages. Before a release reaches production, a QA lead must review the staging website and explicitly approve the release. The QA lead must receive an email that contains a link to the staging URL, and only principals that use the QA IAM role can approve.

    Which two actions should a developer take to meet these requirements? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le pipeline AWS CodePipeline d'une entreprise comporte les étapes Build, Staging et Production. Avant qu'une version n'atteigne la production, un responsable QA doit examiner le site web intermédiaire et approuver explicitement la version. Le responsable QA doit recevoir un e-mail contenant un lien vers l'URL intermédiaire, et seuls les principaux qui utilisent le rôle IAM QA peuvent approuver.

    Quelles sont les deux actions qu'un développeur doit effectuer pour répondre à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a manual approval action to the Production stage that notifies an SNS topic with an email subscription and includes the staging URL for review.", fr: "Ajouter à l'étape Production une action d'approbation manuelle qui notifie une rubrique SNS avec un abonnement par e-mail et inclut l'URL intermédiaire pour la révision." } }
    - { id: b, text: { en: "Disable the transition into the Production stage and allow the QA role to call codepipeline:EnableStageTransition on the pipeline.", fr: "Désactiver la transition vers l'étape Production et autoriser le rôle QA à appeler codepipeline:EnableStageTransition sur le pipeline." } }
    - { id: c, text: { en: "Add an invoke action that runs an AWS Lambda function which waits until the QA lead replies to an email that the function sends.", fr: "Ajouter une action d'appel qui exécute une fonction AWS Lambda attendant que le responsable QA réponde à un e-mail envoyé par la fonction." } }
    - { id: d, text: { en: "Allow the QA role to call codepipeline:PutApprovalResult on the ARN of the approval action, with read access to the pipeline state.", fr: "Autoriser le rôle QA à appeler codepipeline:PutApprovalResult sur l'ARN de l'action d'approbation, avec un accès en lecture à l'état du pipeline." } }
    - { id: e, text: { en: "Allow the QA role to call codepipeline:StartPipelineExecution on the pipeline.", fr: "Autoriser le rôle QA à appeler codepipeline:StartPipelineExecution sur le pipeline." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A manual approval action stops the execution until someone approves or rejects it, and it can publish to an SNS topic a notification that includes the URL for review. Approving requires codepipeline:PutApprovalResult, which can be scoped to the ARN of the approval action (pipeline/stage/action), so only the QA role can approve."
    fr: "Une action d'approbation manuelle arrête l'exécution jusqu'à ce que quelqu'un l'approuve ou la rejette, et elle peut publier dans une rubrique SNS une notification qui contient l'URL de révision. L'approbation exige codepipeline:PutApprovalResult, que l'on peut limiter à l'ARN de l'action d'approbation (pipeline/étape/action) afin que seul le rôle QA puisse approuver."
  options:
    b:
      en: "A disabled transition holds the execution, but it sends no email with the review link and records no approval or rejection."
      fr: "Une transition désactivée retient l'exécution, mais elle n'envoie aucun e-mail avec le lien de révision et n'enregistre aucune approbation ni aucun rejet."
    c:
      en: "A review can take days, far longer than the maximum timeout of a Lambda function (minutes, not hours); the approval action already provides this waiting state."
      fr: "Une révision peut prendre des jours, bien plus que la durée maximale d'une fonction Lambda (des minutes, pas des heures) ; l'action d'approbation fournit déjà cet état d'attente."
    e:
      en: "Starting a new execution does not approve the execution that waits before production."
      fr: "Démarrer une nouvelle exécution n'approuve pas l'exécution qui attend avant la production."
references:
  - title: Add a manual approval action to a stage
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
  - title: Grant approval permissions to an IAM user in CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals-iam-permissions.html
