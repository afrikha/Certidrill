id: dvac03-3a-appconfig-bake-rollback
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team uses AWS AppConfig feature flags in a production environment. A new flag must reach 20% more of the targets at each step over 10 minutes. If an Amazon CloudWatch alarm on the error rate goes into the ALARM state during the rollout or during the 10 minutes after the flag reaches all targets, AppConfig must roll the deployment back automatically.

    Which solution will meet these requirements?
  fr: |
    Une équipe utilise des indicateurs de fonctionnalité (feature flags) AWS AppConfig dans un environnement de production. Un nouvel indicateur doit atteindre 20 % de cibles de plus à chaque étape sur 10 minutes. Si une alarme Amazon CloudWatch sur le taux d'erreurs passe à l'état ALARM pendant le déploiement ou pendant les 10 minutes qui suivent l'arrivée de l'indicateur sur toutes les cibles, AppConfig doit annuler automatiquement le déploiement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use AppConfig.AllAtOnce and an EventBridge rule on the alarm that invokes a Lambda function to stop the deployment.", fr: "Utiliser AppConfig.AllAtOnce et une règle EventBridge sur l'alarme qui appelle une fonction Lambda pour arrêter le déploiement." } }
    - { id: b, text: { en: "Use a linear strategy with a growth factor of 20, a 10-minute duration and no bake time, and add the alarm as a monitor of the environment.", fr: "Utiliser une stratégie linéaire avec un facteur de croissance de 20, une durée de 10 minutes et sans temps de stabilisation, et ajouter l'alarme comme moniteur de l'environnement." } }
    - { id: c, text: { en: "Use a linear strategy with a growth factor of 20, a 10-minute duration and a 10-minute bake time, and add the alarm as a monitor of the environment.", fr: "Utiliser une stratégie linéaire avec un facteur de croissance de 20, une durée de 10 minutes et un temps de stabilisation de 10 minutes, et ajouter l'alarme comme moniteur de l'environnement." } }
    - { id: d, text: { en: "Use an exponential strategy with a growth factor of 20 and a 10-minute bake time, and add the alarm as a monitor of the environment.", fr: "Utiliser une stratégie exponentielle avec un facteur de croissance de 20 et un temps de stabilisation de 10 minutes, et ajouter l'alarme comme moniteur de l'environnement." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A linear strategy with a growth factor of 20 adds 20% of the targets at each step over the deployment duration. The bake time is how long AppConfig keeps watching the CloudWatch alarms after 100% of the targets have the configuration; an alarm during the rollout or the bake time rolls the deployment back, given permissions to read the alarms."
    fr: "Une stratégie linéaire avec un facteur de croissance de 20 ajoute 20 % des cibles à chaque étape pendant la durée du déploiement. Le temps de stabilisation est la durée pendant laquelle AppConfig continue de surveiller les alarmes CloudWatch une fois que 100 % des cibles ont la configuration ; une alarme pendant le déploiement ou le temps de stabilisation annule le déploiement, si AppConfig a les autorisations de lire les alarmes."
  options:
    a:
      en: "AllAtOnce sends the flag to every target at once instead of 20% steps, and the custom rollback code is unnecessary."
      fr: "AllAtOnce envoie l'indicateur à toutes les cibles d'un coup au lieu de paliers de 20 %, et le code d'annulation personnalisé est inutile."
    b:
      en: "Without a bake time, the deployment is complete as soon as it reaches 100%, so an alarm in the next 10 minutes no longer rolls it back."
      fr: "Sans temps de stabilisation, le déploiement est terminé dès qu'il atteint 100 % : une alarme dans les 10 minutes suivantes ne l'annule plus."
    d:
      en: "Exponential growth doubles the share at each step instead of adding 20% of the targets each time."
      fr: "La croissance exponentielle double la part à chaque étape au lieu d'ajouter 20 % des cibles à chaque fois."
references:
  - title: Working with deployment strategies
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-deployment-strategy.html
