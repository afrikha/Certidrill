id: dvac03-3b-pkg-zip-over-50mb
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CI job at AnyCompany updates a Python AWS Lambda function in eu-west-1 with aws lambda update-function-code --zip-file fileb://function.zip. The .zip file has grown to 68 MB, and its unzipped content is 190 MB. The command now fails because the request is too large. The team wants to keep the .zip deployment package with the LEAST change to the job.

    Which solution will meet these requirements?
  fr: |
    Une tâche de CI d'AnyCompany met à jour une fonction AWS Lambda Python dans eu-west-1 avec aws lambda update-function-code --zip-file fileb://function.zip. Le fichier .zip atteint maintenant 68 Mo, et son contenu décompressé fait 190 Mo. La commande échoue désormais parce que la requête est trop volumineuse. L'équipe veut conserver le package de déploiement .zip avec le MOINS de modifications possible de la tâche.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Request a Service Quotas increase for the direct upload size of Lambda deployment packages.", fr: "Demander une augmentation de quota dans Service Quotas pour la taille de chargement direct des packages de déploiement Lambda." } }
    - { id: b, text: { en: "Upload function.zip to an S3 bucket in us-east-1 and run update-function-code with --s3-bucket and --s3-key.", fr: "Charger function.zip dans un compartiment S3 de us-east-1 et exécuter update-function-code avec --s3-bucket et --s3-key." } }
    - { id: c, text: { en: "Rebuild the function as a container image and push it to Amazon ECR.", fr: "Reconstruire la fonction sous forme d'image de conteneur et l'envoyer dans Amazon ECR." } }
    - { id: d, text: { en: "Upload function.zip to an S3 bucket in eu-west-1 and run update-function-code with --s3-bucket and --s3-key.", fr: "Charger function.zip dans un compartiment S3 de eu-west-1 et exécuter update-function-code avec --s3-bucket et --s3-key." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A .zip package uploaded directly through the Lambda API is limited to 50 MB zipped, so larger files must be uploaded to Amazon S3 first. The bucket must be in the same Region as the function, and the 190 MB unzipped content stays under the 250 MB unzipped limit."
    fr: "Un package .zip chargé directement au moyen de l'API Lambda est limité à 50 Mo compressé : les fichiers plus volumineux doivent d'abord être chargés dans Amazon S3. Le compartiment doit se trouver dans la même Région que la fonction, et le contenu décompressé de 190 Mo reste sous la limite de 250 Mo décompressés."
  options:
    a:
      en: "The 50 MB direct upload limit is not raised through a quota request; AWS documents uploading larger files through Amazon S3."
      fr: "La limite de 50 Mo du chargement direct ne se relève pas par une demande de quota ; AWS indique de charger les fichiers plus volumineux au moyen d'Amazon S3."
    b:
      en: "Lambda reads the package from a bucket in the function's Region; a bucket in us-east-1 cannot be used for a function in eu-west-1."
      fr: "Lambda lit le package depuis un compartiment de la Région de la fonction ; un compartiment de us-east-1 ne peut pas servir pour une fonction de eu-west-1."
    c:
      en: "A container image works but replaces the .zip package and requires a Dockerfile, a registry, and a different build, which is more change than needed."
      fr: "Une image de conteneur fonctionne, mais remplace le package .zip et exige un Dockerfile, un registre et un build différent, ce qui est plus de changement que nécessaire."
references:
  - title: Working with .zip file archives for Python Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/python-package.html
  - title: Lambda quotas
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
