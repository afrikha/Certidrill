id: dvac03-3b-env-amplify-branch-autodetect
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany deploys a web app with AWS Amplify Hosting from a Git repository. The release team creates a new Git branch, such as release-3.2, for each release candidate. Each of these branches must be deployed automatically as its own Amplify environment as soon as it is pushed, without anyone connecting the branch in the console.

    Which solution will meet these requirements?
  fr: |
    AnyCompany déploie une application web avec AWS Amplify Hosting depuis un référentiel Git. L'équipe de livraison crée une nouvelle branche Git, par exemple release-3.2, pour chaque version candidate. Chacune de ces branches doit être déployée automatiquement comme environnement Amplify distinct dès son envoi, sans que personne ne connecte la branche dans la console.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on branch autodetection with the pattern release* in the branch settings of the app.", fr: "Activer la détection automatique des branches avec le modèle release* dans les paramètres de branche de l'application." } }
    - { id: b, text: { en: "Turn on pull request previews for the main branch.", fr: "Activer les aperçus de pull requests pour la branche main." } }
    - { id: c, text: { en: "Add an environment variable named AWS_BRANCH with the value release* to the app.", fr: "Ajouter à l'application une variable d'environnement nommée AWS_BRANCH avec la valeur release*." } }
    - { id: d, text: { en: "Create an incoming webhook for the app and call it from a script after each branch is created.", fr: "Créer un webhook entrant pour l'application et l'appeler depuis un script après la création de chaque branche." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Branch autodetection deploys every branch whose name matches one of the configured patterns; release* matches all branches that begin with release. Amplify connects and builds each matching branch automatically after it is pushed."
    fr: "La détection automatique des branches déploie chaque branche dont le nom correspond à l'un des modèles configurés ; release* correspond à toutes les branches qui commencent par release. Amplify connecte et génère automatiquement chaque branche correspondante après son envoi."
  options:
    b:
      en: "Pull request previews deploy pull requests that target a branch; they do not create an environment for each pushed release branch."
      fr: "Les aperçus de pull requests déploient les pull requests qui ciblent une branche ; ils ne créent pas d'environnement pour chaque branche de version envoyée."
    c:
      en: "AWS_BRANCH is a built-in variable that contains the name of the branch being built; setting it does not connect branches."
      fr: "AWS_BRANCH est une variable intégrée qui contient le nom de la branche en cours de génération ; la définir ne connecte pas de branches."
    d:
      en: "An incoming webhook starts a build of a branch that is already connected and needs a custom script, so it does not meet the requirement."
      fr: "Un webhook entrant lance la génération d'une branche déjà connectée et exige un script personnalisé : il ne répond donc pas à l'exigence."
references:
  - title: Pattern-based feature branch deployments
    url: https://docs.aws.amazon.com/amplify/latest/userguide/pattern-based-feature-branch-deployments.html
