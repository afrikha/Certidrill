id: dvac03-3b-cd-applicationstop-ignore
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS CodeDeploy in-place deployment to Amazon EC2 instances failed at the ApplicationStop event because the stop.sh script of the current revision has a bug. The developer fixed stop.sh in a new revision, but every new deployment of that revision still fails at ApplicationStop on the same instances.

    Which solution will allow the new revision to be deployed?
  fr: |
    Un déploiement sur place AWS CodeDeploy vers des instances Amazon EC2 a échoué à l'événement ApplicationStop parce que le script stop.sh de la révision actuelle comporte un bogue. Le développeur a corrigé stop.sh dans une nouvelle révision, mais chaque nouveau déploiement de cette révision échoue toujours à ApplicationStop sur les mêmes instances.

    Quelle solution permet de déployer la nouvelle révision ?
body:
  options:
    - { id: a, text: { en: "Increase the timeout of the ApplicationStop hook in the AppSpec file of the new revision.", fr: "Augmenter le délai d'expiration du hook ApplicationStop dans le fichier AppSpec de la nouvelle révision." } }
    - { id: b, text: { en: "Move the stop.sh script from ApplicationStop to BeforeInstall in the AppSpec file of the new revision.", fr: "Déplacer le script stop.sh d'ApplicationStop vers BeforeInstall dans le fichier AppSpec de la nouvelle révision." } }
    - { id: c, text: { en: "Create the deployment with the --ignore-application-stop-failures option.", fr: "Créer le déploiement avec l'option --ignore-application-stop-failures." } }
    - { id: d, text: { en: "Change the deployment configuration of the deployment group to CodeDeployDefault.AllAtOnce.", fr: "Remplacer la configuration de déploiement du groupe de déploiement par CodeDeployDefault.AllAtOnce." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The ApplicationStop event uses the AppSpec file and scripts of the previous successfully deployed revision, so the broken stop.sh keeps running whatever the new revision contains. With --ignore-application-stop-failures, a failed ApplicationStop does not fail the deployment, which continues with DownloadBundle and installs the fixed revision."
    fr: "L'événement ApplicationStop utilise le fichier AppSpec et les scripts de la révision précédemment déployée avec succès : le stop.sh défectueux continue donc de s'exécuter, quel que soit le contenu de la nouvelle révision. Avec --ignore-application-stop-failures, un échec d'ApplicationStop ne fait pas échouer le déploiement, qui continue avec DownloadBundle et installe la révision corrigée."
  options:
    a:
      en: "Changes to the new revision's AppSpec file do not affect ApplicationStop, which uses the previous revision's files, and the script fails because of a bug, not a timeout."
      fr: "Les modifications du fichier AppSpec de la nouvelle révision n'ont pas d'effet sur ApplicationStop, qui utilise les fichiers de la révision précédente, et le script échoue à cause d'un bogue, pas d'un délai."
    b:
      en: "The old revision's AppSpec file still runs the broken stop.sh at ApplicationStop before the new AppSpec file is used."
      fr: "Le fichier AppSpec de l'ancienne révision exécute toujours le stop.sh défectueux à ApplicationStop avant que le nouveau fichier AppSpec ne soit utilisé."
    d:
      en: "The deployment configuration only sets how many instances are updated at once; ApplicationStop still fails on each instance."
      fr: "La configuration de déploiement définit seulement combien d'instances sont mises à jour à la fois ; ApplicationStop échoue toujours sur chaque instance."
references:
  - title: AppSpec 'hooks' section
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html
  - title: create-deployment — AWS CLI Command Reference
    url: https://docs.aws.amazon.com/cli/latest/reference/deploy/create-deployment.html
