id: dvac03-3c-ai-auto-approve-test
objective: "3.3.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS CodePipeline pipeline has a manual approval action named `ApproveTest` in a stage named `TestGate`, before the deployment to a test environment. The action publishes to an Amazon SNS topic. A developer has written an AWS Lambda function that sends the change details and test results to an Amazon Bedrock model and decides whether the change is low risk. Low-risk changes must be approved automatically; other changes must wait for a human. The function must have least-privilege permissions.

    Which two additional steps should the developer take? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Un pipeline AWS CodePipeline comporte une action d'approbation manuelle nommée `ApproveTest` dans une étape nommée `TestGate`, avant le déploiement dans un environnement de test. L'action publie dans une rubrique Amazon SNS. Un développeur a écrit une fonction AWS Lambda qui envoie les détails de la modification et les résultats des tests à un modèle Amazon Bedrock et décide si la modification présente un faible risque. Les modifications à faible risque doivent être approuvées automatiquement ; les autres doivent attendre un humain. La fonction doit disposer d'autorisations de moindre privilège.

    Quelles sont les deux étapes supplémentaires que le développeur doit effectuer ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Allow the function's role to call codepipeline:UpdatePipeline so that it can remove the approval action for low-risk changes.", fr: "Autoriser le rôle de la fonction à appeler codepipeline:UpdatePipeline afin qu'elle supprime l'action d'approbation pour les modifications à faible risque." } }
    - { id: b, text: { en: "Subscribe the function to the SNS topic, and read the pipeline, stage and action names and the approval token from the notification.", fr: "Abonner la fonction à la rubrique SNS, et lire les noms du pipeline, de l'étape et de l'action ainsi que le jeton d'approbation dans la notification." } }
    - { id: c, text: { en: "Allow the function's role to call codepipeline:EnableStageTransition on the pipeline, and enable the transition for low-risk changes.", fr: "Autoriser le rôle de la fonction à appeler codepipeline:EnableStageTransition sur le pipeline, et activer la transition pour les modifications à faible risque." } }
    - { id: d, text: { en: "Allow codepipeline:PutApprovalResult only on the ARN of the ApproveTest action, and call PutApprovalResult with the Approved status for low-risk changes.", fr: "Autoriser codepipeline:PutApprovalResult uniquement sur l'ARN de l'action ApproveTest, et appeler PutApprovalResult avec le statut Approved pour les modifications à faible risque." } }
    - { id: e, text: { en: "Store the approval token in a pipeline-level variable so that the function can read it when the pipeline starts.", fr: "Stocker le jeton d'approbation dans une variable de niveau pipeline afin que la fonction puisse le lire au démarrage du pipeline." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The SNS notification of an approval action contains the pipeline, stage and action names and the token of the approval request, which PutApprovalResult requires. Scoping codepipeline:PutApprovalResult to the action ARN (pipeline/TestGate/ApproveTest) lets the function answer only this approval; for other changes it does nothing, and the request waits for a human."
    fr: "La notification SNS d'une action d'approbation contient les noms du pipeline, de l'étape et de l'action ainsi que le jeton de la demande d'approbation, exigé par PutApprovalResult. Limiter codepipeline:PutApprovalResult à l'ARN de l'action (pipeline/TestGate/ApproveTest) permet à la fonction de répondre uniquement à cette approbation ; pour les autres modifications, elle ne fait rien et la demande attend un humain."
  options:
    a:
      en: "Changing the pipeline structure is far broader than answering one approval, and an update stops the execution in progress."
      fr: "Modifier la structure du pipeline est bien plus large que répondre à une approbation, et une mise à jour arrête l'exécution en cours."
    c:
      en: "Enabling a transition does not answer the approval action, which still blocks the stage."
      fr: "Activer une transition ne répond pas à l'action d'approbation, qui bloque toujours l'étape."
    e:
      en: "The token is generated when the approval action runs, after the execution has started, so it cannot be a pipeline-level variable."
      fr: "Le jeton est généré lorsque l'action d'approbation s'exécute, après le démarrage de l'exécution : il ne peut pas être une variable de niveau pipeline."
references:
  - title: PutApprovalResult
    url: https://docs.aws.amazon.com/codepipeline/latest/APIReference/API_PutApprovalResult.html
  - title: Grant approval permissions to an IAM user in CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals-iam-permissions.html
