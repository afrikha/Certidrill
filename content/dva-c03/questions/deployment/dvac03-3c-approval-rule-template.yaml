id: dvac03-3c-approval-rule-template
objective: "3.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 40 AWS CodeCommit repositories in one AWS Region. Every pull request whose destination is the `main` branch must receive two approvals from principals that use the SeniorDevelopers IAM role before it can be merged. Pull requests to other branches need no approval, and new pull requests must get the requirement automatically.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise possède 40 référentiels AWS CodeCommit dans une même Région AWS. Chaque demande d'extraction dont la destination est la branche `main` doit recevoir deux approbations de principaux qui utilisent le rôle IAM SeniorDevelopers avant de pouvoir être fusionnée. Les demandes d'extraction vers d'autres branches n'exigent aucune approbation, et les nouvelles demandes d'extraction doivent recevoir l'exigence automatiquement.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Ask each author to add an approval rule that requires two approvals to every pull request that targets `main`.", fr: "Demander à chaque auteur d'ajouter une règle d'approbation exigeant deux approbations à chaque demande d'extraction qui cible `main`." }
    - id: b
      text: { en: "Add a manual approval action that the SeniorDevelopers role must approve to each pipeline before its deploy stage.", fr: "Ajouter à chaque pipeline, avant son étape de déploiement, une action d'approbation manuelle que le rôle SeniorDevelopers doit approuver." }
    - id: c
      text: { en: "Create an approval rule template for `refs/heads/main` that needs two SeniorDevelopers approvals, and associate it with the repositories.", fr: "Créer pour `refs/heads/main` un modèle de règle d'approbation qui exige deux approbations SeniorDevelopers, et l'associer aux référentiels." }
    - id: d
      text: { en: "Deny the pull request merge actions on the `main` branch to every principal except the SeniorDevelopers role.", fr: "Refuser les actions de fusion de demandes d'extraction sur `main` à tous les principaux sauf au rôle SeniorDevelopers." }
answer: { optionId: c }
explanation:
  correct:
    en: "An approval rule template defines the number of approvals and an optional approval pool once, and creates the rule automatically on new pull requests in every associated repository. Its destination references limit the rule to pull requests that target `main`. Templates can be associated only with repositories in their own Region, which is the case here."
    fr: "Un modèle de règle d'approbation définit une seule fois le nombre d'approbations et un groupe d'approbateurs facultatif, et crée automatiquement la règle sur les nouvelles demandes d'extraction de chaque référentiel associé. Ses références de destination limitent la règle aux demandes d'extraction qui ciblent `main`. Un modèle ne peut être associé qu'à des référentiels de sa Région, ce qui est le cas ici."
  options:
    a:
      en: "Rules added by hand to each pull request are not automatic and depend on every author."
      fr: "Des règles ajoutées à la main à chaque demande d'extraction ne sont pas automatiques et dépendent de chaque auteur."
    b:
      en: "A pipeline approval happens after the code is merged; it controls deployments, not merges."
      fr: "Une approbation de pipeline intervient après la fusion du code ; elle contrôle les déploiements, pas les fusions."
    d:
      en: "This only restricts who can merge; it does not require two approvals before a merge."
      fr: "Cette solution limite seulement qui peut fusionner ; elle n'exige pas deux approbations avant une fusion."
references:
  - title: Working with approval rule templates
    url: https://docs.aws.amazon.com/codecommit/latest/userguide/approval-rule-templates.html
