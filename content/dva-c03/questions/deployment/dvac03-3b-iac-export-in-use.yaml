id: dvac03-3b-iac-export-in-use
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At AnyCompany, a network stack exports the ID of a private subnet with the export name net-app-subnet. Three application stacks read it with Fn::ImportValue. The network team must move the applications to a new subnet, but the update of the network stack that changes the exported value fails.

    Which solution will meet these requirements?
  fr: |
    Chez AnyCompany, une pile réseau exporte l'ID d'un sous-réseau privé sous le nom d'exportation net-app-subnet. Trois piles d'application le lisent avec Fn::ImportValue. L'équipe réseau doit déplacer les applications vers un nouveau sous-réseau, mais la mise à jour de la pile réseau qui modifie la valeur exportée échoue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a DependsOn attribute that points to the network stack in each application stack, then update the network stack again.", fr: "Ajouter dans chaque pile d'application un attribut DependsOn qui pointe vers la pile réseau, puis mettre de nouveau à jour la pile réseau." } }
    - { id: b, text: { en: "Update the three application stacks to stop importing net-app-subnet, then update the network stack.", fr: "Mettre à jour les trois piles d'application pour qu'elles n'importent plus net-app-subnet, puis mettre à jour la pile réseau." } }
    - { id: c, text: { en: "Rename the export in the network stack in the same update that changes the subnet ID value.", fr: "Renommer l'exportation dans la pile réseau au cours de la même mise à jour qui modifie la valeur de l'ID du sous-réseau." } }
    - { id: d, text: { en: "Turn off termination protection on the application stacks, then update the network stack again.", fr: "Désactiver la protection contre la résiliation des piles d'application, puis mettre de nouveau à jour la pile réseau." } }
answer: { optionId: b }
explanation:
  correct:
    en: "After another stack imports an exported output, CloudFormation does not allow the exporting stack to modify or delete that output. All imports must be removed first, for example by replacing Fn::ImportValue with a parameter or a new export, and aws cloudformation list-imports shows which stacks still use the export."
    fr: "Lorsqu'une autre pile importe une sortie exportée, CloudFormation n'autorise pas la pile exportatrice à modifier ni supprimer cette sortie. Toutes les importations doivent d'abord être retirées, par exemple en remplaçant Fn::ImportValue par un paramètre ou une nouvelle exportation, et aws cloudformation list-imports montre quelles piles utilisent encore l'exportation."
  options:
    a:
      en: "DependsOn orders resources inside one template; it does not lift the restriction on imported exports."
      fr: "DependsOn ordonne les ressources au sein d'un modèle ; il ne lève pas la restriction sur les exportations importées."
    c:
      en: "Renaming removes the old export, which is still imported, so the update fails for the same reason."
      fr: "Renommer supprime l'ancienne exportation, qui est toujours importée : la mise à jour échoue pour la même raison."
    d:
      en: "Termination protection only prevents stack deletion; it has nothing to do with the export restriction."
      fr: "La protection contre la résiliation empêche seulement la suppression des piles ; elle n'a aucun rapport avec la restriction des exportations."
references:
  - title: Get exported outputs from a deployed CloudFormation stack
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-exports.html
