id: dvac03-3c-codedeploy-alarm-rollback
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AWS CodeDeploy deploys a web application in place to Amazon EC2 instances behind an Application Load Balancer. Some deployments succeed, but the new version then returns HTTP 5xx errors. An Amazon CloudWatch alarm already monitors the 5xx count of the load balancer. The company wants CodeDeploy to redeploy the last known good revision automatically when the alarm enters the ALARM state during a deployment.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    AWS CodeDeploy déploie une application web sur place sur des instances Amazon EC2 derrière un Application Load Balancer. Certains déploiements réussissent, mais la nouvelle version renvoie ensuite des erreurs HTTP 5xx. Une alarme Amazon CloudWatch surveille déjà le nombre d'erreurs 5xx de l'équilibreur de charge. L'entreprise veut que CodeDeploy redéploie automatiquement la dernière bonne révision connue lorsque l'alarme passe à l'état ALARM pendant un déploiement.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - id: a
      text: { en: "Add a ValidateService hook script that reads the alarm state with the CloudWatch API and exits with an error when the alarm is in ALARM.", fr: "Ajouter un script de hook ValidateService qui lit l'état de l'alarme avec l'API CloudWatch et se termine en erreur lorsque l'alarme est à l'état ALARM." }
    - id: b
      text: { en: "Add a trigger to the deployment group that sends deployment failure notifications to an Amazon SNS topic for the team.", fr: "Ajouter au groupe de déploiement un déclencheur qui envoie les notifications d'échec de déploiement à une rubrique Amazon SNS pour l'équipe." }
    - id: c
      text: { en: "Add the alarm to the deployment group and enable automatic rollback when alarm thresholds are met.", fr: "Ajouter l'alarme au groupe de déploiement et activer la restauration automatique quand les seuils d'alarme sont atteints." }
    - id: d
      text: { en: "Enable only the automatic rollback option for deployments that fail in the deployment group.", fr: "Activer uniquement l'option de restauration automatique des déploiements en échec dans le groupe de déploiement." }
answer: { optionId: c }
explanation:
  correct:
    en: "A deployment group can monitor CloudWatch alarms and stop a deployment when an alarm activates. With the option to roll back when alarm thresholds are met, CodeDeploy then redeploys the last known good revision as a new deployment, with no code to write."
    fr: "Un groupe de déploiement peut surveiller des alarmes CloudWatch et arrêter un déploiement lorsqu'une alarme s'active. Avec l'option de restauration quand les seuils d'alarme sont atteints, CodeDeploy redéploie alors la dernière bonne révision connue sous la forme d'un nouveau déploiement, sans code à écrire."
  options:
    a:
      en: "This needs a custom script on every instance, and it checks the alarm only once per instance during that lifecycle event."
      fr: "Cette solution exige un script personnalisé sur chaque instance, et elle ne vérifie l'alarme qu'une fois par instance pendant cet événement de cycle de vie."
    b:
      en: "Notifications inform the team but do not roll anything back, and the deployment does not fail when only the alarm fires."
      fr: "Les notifications informent l'équipe mais ne restaurent rien, et le déploiement n'échoue pas lorsque seule l'alarme se déclenche."
    d:
      en: "The lifecycle events succeed, so the deployment does not fail and this option never starts a rollback for 5xx errors."
      fr: "Les événements de cycle de vie réussissent : le déploiement n'échoue pas et cette option ne lance jamais de restauration pour les erreurs 5xx."
references:
  - title: Configure advanced options for a deployment group
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-groups-configure-advanced-options.html
  - title: Redeploy and roll back a deployment with CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployments-rollback-and-redeploy.html
