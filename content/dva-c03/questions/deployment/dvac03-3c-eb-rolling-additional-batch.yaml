id: dvac03-3c-eb-rolling-additional-batch
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A web application runs in an AWS Elastic Beanstalk environment of eight Amazon EC2 instances behind an Application Load Balancer. At peak hours, the environment needs all eight instances. Deployments must keep the full serving capacity at all times, and it is acceptable for the old and new versions to serve traffic at the same time during a deployment. The company wants to launch as few additional instances as possible.

    Which deployment policy will meet these requirements?
  fr: |
    Une application web s'exécute dans un environnement AWS Elastic Beanstalk de huit instances Amazon EC2 derrière un Application Load Balancer. Aux heures de pointe, l'environnement a besoin des huit instances. Les déploiements doivent conserver en permanence toute la capacité de service, et il est acceptable que l'ancienne et la nouvelle version servent du trafic en même temps pendant un déploiement. L'entreprise veut lancer le moins d'instances supplémentaires possible.

    Quelle politique de déploiement répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Rolling, with a batch size of 25 percent", fr: "Rolling, avec une taille de lot de 25 %" } }
    - { id: b, text: { en: "Rolling with additional batch", fr: "Rolling with additional batch" } }
    - { id: c, text: { en: "Immutable", fr: "Immutable" } }
    - { id: d, text: { en: "All at once", fr: "All at once" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Rolling with additional batch launches one extra batch of instances before it takes any instance out of service, so the environment keeps its full capacity while batches are updated. Only one batch of additional instances is launched, and it is terminated when the deployment completes."
    fr: "Rolling with additional batch lance un lot d'instances supplémentaire avant de retirer une instance du service : l'environnement conserve toute sa capacité pendant la mise à jour des lots. Un seul lot d'instances supplémentaires est lancé, et il est arrêté à la fin du déploiement."
  options:
    a:
      en: "Rolling updates batches in place, so capacity drops by one batch (two instances) during the deployment."
      fr: "Rolling met à jour les lots sur place : la capacité diminue d'un lot (deux instances) pendant le déploiement."
    c:
      en: "Immutable keeps full capacity but launches a complete new set of eight instances, which is more than one additional batch."
      fr: "Immutable conserve toute la capacité mais lance un nouvel ensemble complet de huit instances, soit plus qu'un lot supplémentaire."
    d:
      en: "All at once updates every instance at the same time, so the application is briefly out of service."
      fr: "All at once met à jour toutes les instances en même temps : l'application est brièvement hors service."
references:
  - title: Deployment policies and settings
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.rolling-version-deploy.html
