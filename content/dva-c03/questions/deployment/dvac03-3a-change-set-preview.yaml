id: dvac03-3a-change-set-preview
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer has modified the AWS CloudFormation template of a production stack. Before the update runs, the team lead wants to review which resources CloudFormation will add, modify or delete, with a before-and-after view of the changed properties.

    Which solution will meet these requirements?
  fr: |
    Un développeur a modifié le modèle AWS CloudFormation d'une pile de production. Avant l'exécution de la mise à jour, le responsable d'équipe veut examiner les ressources que CloudFormation va ajouter, modifier ou supprimer, avec une vue avant-après des propriétés modifiées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run drift detection on the stack and review the drift results.", fr: "Exécuter la détection de dérive sur la pile et examiner les résultats de dérive." } }
    - { id: b, text: { en: "Add rollback triggers with CloudWatch alarms to the stack and update it.", fr: "Ajouter des déclencheurs de restauration avec des alarmes CloudWatch à la pile et la mettre à jour." } }
    - { id: c, text: { en: "Create a change set with the modified template and review it before executing it.", fr: "Créer un jeu de modifications avec le modèle modifié et l'examiner avant de l'exécuter." } }
    - { id: d, text: { en: "Update the stack with the rollback on failure option disabled and review the events.", fr: "Mettre à jour la pile avec l'option de restauration en cas d'échec désactivée et examiner les événements." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A change set shows which resources CloudFormation will add, modify or delete, with a before-and-after comparison of resource properties, and nothing changes until the change set is executed. It does not guarantee that the update will succeed, although pre-deployment checks catch common failure causes."
    fr: "Un jeu de modifications montre les ressources que CloudFormation va ajouter, modifier ou supprimer, avec une comparaison avant-après des propriétés, et rien ne change tant que le jeu de modifications n'est pas exécuté. Il ne garantit pas la réussite de la mise à jour, même si des vérifications avant déploiement détectent les causes d'échec courantes."
  options:
    a:
      en: "Drift detection compares the current resources with the deployed template, not with the modified template."
      fr: "La détection de dérive compare les ressources actuelles au modèle déployé, pas au modèle modifié."
    b:
      en: "Rollback triggers act during and after the update; they do not show the planned changes beforehand."
      fr: "Les déclencheurs de restauration agissent pendant et après la mise à jour ; ils ne montrent pas les modifications prévues à l'avance."
    d:
      en: "This applies the changes immediately to production, so there is nothing to review before the update."
      fr: "Cela applique immédiatement les modifications en production : il n'y a rien à examiner avant la mise à jour."
references:
  - title: Update CloudFormation stacks using change sets
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-updating-stacks-changesets.html
