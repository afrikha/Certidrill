id: dvac03-3a-ecr-cross-account-pull
objective: "3.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A platform team stores container images in an Amazon ECR private repository in account 111122223333. Amazon ECS tasks on AWS Fargate in account 444455556666, in the same Region, must pull these images by using their task execution role. The images must not be copied to another registry.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une équipe plateforme stocke des images de conteneur dans un référentiel privé Amazon ECR du compte 111122223333. Des tâches Amazon ECS sur AWS Fargate du compte 444455556666, dans la même Région, doivent extraire ces images à l'aide de leur rôle d'exécution de tâche. Les images ne doivent pas être copiées vers un autre registre.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "In 111122223333, add a repository policy that allows account 444455556666 ecr:BatchGetImage, ecr:GetDownloadUrlForLayer and ecr:BatchCheckLayerAvailability.", fr: "Dans 111122223333, ajouter une politique de référentiel qui autorise le compte 444455556666 à ecr:BatchGetImage, ecr:GetDownloadUrlForLayer et ecr:BatchCheckLayerAvailability." } }
    - { id: b, text: { en: "In 111122223333, add ecr:GetAuthorizationToken to the repository policy so that account 444455556666 can authenticate to the registry.", fr: "Dans 111122223333, ajouter ecr:GetAuthorizationToken à la politique de référentiel pour que le compte 444455556666 puisse s'authentifier auprès du registre." } }
    - { id: c, text: { en: "In 444455556666, allow ecr:GetAuthorizationToken and the image pull actions on the repository ARN in an IAM policy of the task execution role.", fr: "Dans 444455556666, autoriser ecr:GetAuthorizationToken et les actions d'extraction d'images sur l'ARN du référentiel dans une politique IAM du rôle d'exécution de tâche." } }
    - { id: d, text: { en: "In 111122223333, configure cross-account replication of the repository to the private registry of account 444455556666.", fr: "Dans 111122223333, configurer la réplication entre comptes du référentiel vers le registre privé du compte 444455556666." } }
    - { id: e, text: { en: "In 444455556666, create a pull through cache rule that uses Amazon ECR Public as the upstream registry.", fr: "Dans 444455556666, créer une règle de cache d'extraction qui utilise Amazon ECR Public comme registre en amont." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Cross-account pulls need both sides: the repository policy in the owning account must allow the pull actions for the consuming account, and the identity-based policy of the role in the consuming account must allow them too. ecr:GetAuthorizationToken is required to authenticate to any registry and must be granted through an IAM policy, not a repository policy."
    fr: "Les extractions entre comptes nécessitent les deux côtés : la politique de référentiel du compte propriétaire doit autoriser les actions d'extraction pour le compte consommateur, et la politique basée sur l'identité du rôle du compte consommateur doit aussi les autoriser. ecr:GetAuthorizationToken est requis pour s'authentifier auprès de tout registre et doit être accordé par une politique IAM, pas par une politique de référentiel."
  options:
    b:
      en: "GetAuthorizationToken is not tied to a repository; Amazon ECR requires that it be granted through an IAM policy of the caller."
      fr: "GetAuthorizationToken n'est pas lié à un référentiel ; Amazon ECR exige qu'il soit accordé par une politique IAM de l'appelant."
    d:
      en: "Replication copies the images to the other account's registry, which the requirements forbid."
      fr: "La réplication copie les images vers le registre de l'autre compte, ce que les exigences interdisent."
    e:
      en: "The images are in a private repository, not in Amazon ECR Public, and a cache rule would also copy them into another registry."
      fr: "Les images se trouvent dans un référentiel privé, pas dans Amazon ECR Public, et une règle de cache les copierait aussi dans un autre registre."
references:
  - title: Private repository policy examples in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/repository-policy-examples.html
