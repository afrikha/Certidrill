id: dvac03-3c-cfn-preserve-resources
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer creates a large AWS CloudFormation stack in a development account. Creation fails late because one resource lacks an IAM permission, and CloudFormation then deletes every resource it created, which takes 30 minutes each time. The developer wants to keep the resources that were created successfully, fix the permission, and retry only the failed resource.

    Which solution will meet these requirements?
  fr: |
    Un développeur crée une grande pile AWS CloudFormation dans un compte de développement. La création échoue tardivement parce qu'une ressource n'a pas une autorisation IAM, puis CloudFormation supprime toutes les ressources qu'il a créées, ce qui prend 30 minutes à chaque fois. Le développeur veut conserver les ressources créées avec succès, corriger l'autorisation et relancer uniquement la ressource en échec.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable termination protection on the stack before it is created.", fr: "Activer la protection contre la résiliation sur la pile avant sa création." }
    - id: b
      text: { en: "Create the stack with --disable-rollback, then retry the operation after the permission is fixed.", fr: "Créer la pile avec --disable-rollback, puis relancer l'opération une fois l'autorisation corrigée." }
    - id: c
      text: { en: "Set the DeletionPolicy attribute to Retain on every resource in the template.", fr: "Définir l'attribut DeletionPolicy sur Retain pour chaque ressource du modèle." }
    - id: d
      text: { en: "Add a rollback trigger with MonitoringTimeInMinutes set to 0.", fr: "Ajouter un déclencheur de restauration avec MonitoringTimeInMinutes défini sur 0." }
answer: { optionId: b }
explanation:
  correct:
    en: "The stack failure option Preserve successfully provisioned resources (--disable-rollback or --on-failure DO_NOTHING on create) keeps the resources that reached CREATE_COMPLETE when the operation fails. After fixing the cause, the developer retries the operation, and CloudFormation provisions only the failed resources."
    fr: "L'option d'échec Preserve successfully provisioned resources (--disable-rollback ou --on-failure DO_NOTHING à la création) conserve les ressources arrivées à CREATE_COMPLETE lorsque l'opération échoue. Après avoir corrigé la cause, le développeur relance l'opération, et CloudFormation ne provisionne que les ressources en échec."
  options:
    a:
      en: "Termination protection prevents a user from deleting the stack; it does not stop the rollback of a failed creation."
      fr: "La protection contre la résiliation empêche un utilisateur de supprimer la pile ; elle n'empêche pas la restauration d'une création en échec."
    c:
      en: "Retain leaves the resources in the account outside the stack after the rollback, so they cannot be reused by a retry of the stack."
      fr: "Retain laisse les ressources dans le compte, hors de la pile, après la restauration : une nouvelle tentative de la pile ne peut pas les réutiliser."
    d:
      en: "Rollback triggers start rollbacks when alarms fire; they do not prevent the rollback of a failed creation."
      fr: "Les déclencheurs de restauration lancent des restaurations quand des alarmes se déclenchent ; ils n'empêchent pas la restauration d'une création en échec."
references:
  - title: Choose how to handle failures when provisioning resources
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stack-failure-options.html
