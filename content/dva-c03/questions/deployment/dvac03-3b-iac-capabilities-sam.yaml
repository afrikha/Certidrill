id: dvac03-3b-iac-capabilities-sam
objective: "3.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A deployment script at AnyCompany creates a stack directly from an AWS SAM template, without a change set, by using the following command. The template declares Transform: AWS::Serverless-2016-10-31 and contains an AWS::IAM::Role resource with the property RoleName: orders-api-role. The command fails with an InsufficientCapabilities error.

    ```bash
    aws cloudformation create-stack --stack-name orders-api \
        --template-body file://packaged.yaml
    ```

    Which changes to the command are required? (Choose two.)
  fr: |
    Un script de déploiement d'AnyCompany crée une pile directement à partir d'un modèle AWS SAM, sans jeu de modifications, à l'aide de la commande suivante. Le modèle déclare Transform: AWS::Serverless-2016-10-31 et contient une ressource AWS::IAM::Role avec la propriété RoleName: orders-api-role. La commande échoue avec une erreur InsufficientCapabilities.

    ```bash
    aws cloudformation create-stack --stack-name orders-api \
        --template-body file://packaged.yaml
    ```

    Quelles modifications de la commande sont nécessaires ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add CAPABILITY_IAM to the --capabilities option.", fr: "Ajouter CAPABILITY_IAM à l'option --capabilities." } }
    - { id: b, text: { en: "Add CAPABILITY_NAMED_IAM to the --capabilities option.", fr: "Ajouter CAPABILITY_NAMED_IAM à l'option --capabilities." } }
    - { id: c, text: { en: "Add CAPABILITY_AUTO_EXPAND to the --capabilities option.", fr: "Ajouter CAPABILITY_AUTO_EXPAND à l'option --capabilities." } }
    - { id: d, text: { en: "Add the --disable-rollback option.", fr: "Ajouter l'option --disable-rollback." } }
    - { id: e, text: { en: "Add the --role-arn option with a CloudFormation service role that has IAM permissions.", fr: "Ajouter l'option --role-arn avec un rôle de service CloudFormation doté d'autorisations IAM." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "A template with IAM resources that have custom names requires CAPABILITY_NAMED_IAM. The AWS::Serverless transform is a macro, and creating a stack directly from a template that contains macros, without reviewing a change set first, requires CAPABILITY_AUTO_EXPAND."
    fr: "Un modèle comportant des ressources IAM avec des noms personnalisés exige CAPABILITY_NAMED_IAM. La transformation AWS::Serverless est une macro, et créer une pile directement à partir d'un modèle qui contient des macros, sans examiner d'abord un jeu de modifications, exige CAPABILITY_AUTO_EXPAND."
  options:
    a:
      en: "CAPABILITY_IAM is enough for IAM resources without custom names; a role with RoleName requires CAPABILITY_NAMED_IAM."
      fr: "CAPABILITY_IAM suffit pour des ressources IAM sans nom personnalisé ; un rôle avec RoleName exige CAPABILITY_NAMED_IAM."
    d:
      en: "--disable-rollback keeps the created resources when stack creation fails; it does not acknowledge IAM resources or macros."
      fr: "--disable-rollback conserve les ressources créées en cas d'échec de la création de la pile ; il ne valide ni les ressources IAM ni les macros."
    e:
      en: "A service role changes which credentials CloudFormation uses, but the InsufficientCapabilities error still requires the explicit capability acknowledgments."
      fr: "Un rôle de service change les informations d'identification utilisées par CloudFormation, mais l'erreur InsufficientCapabilities exige toujours la validation explicite des capacités."
references:
  - title: CreateStack
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_CreateStack.html
