id: dvac03-3b-tevt-remote-invoke-shared
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys an AWS SAM application in a stack named orders-dev. The team stores a shareable test event named smoke for the function with the logical ID OrderFunction. After each deployment, a script must run the deployed function in the AWS Cloud with this shared event, without keeping a copy of the event in the repository.

    Which command will meet these requirements?
  fr: |
    AnyCompany déploie une application AWS SAM dans une pile nommée orders-dev. L'équipe stocke un événement de test partageable nommé smoke pour la fonction dont l'ID logique est OrderFunction. Après chaque déploiement, un script doit exécuter la fonction déployée dans le cloud AWS avec cet événement partagé, sans conserver de copie de l'événement dans le référentiel.

    Quelle commande répond à ces exigences ?
body:
  options:
    - { id: a, text: "sam remote invoke OrderFunction --stack-name orders-dev --test-event-name smoke" }
    - { id: b, text: "sam local invoke OrderFunction --event smoke" }
    - { id: c, text: "sam remote test-event put OrderFunction --stack-name orders-dev --name smoke" }
    - { id: d, text: "aws lambda invoke --function-name OrderFunction --qualifier smoke response.json" }
answer: { optionId: a }
explanation:
  correct:
    en: "sam remote invoke runs a deployed function in the AWS Cloud, and --test-event-name selects a shareable test event stored in the EventBridge schema registry. When the function is identified by its logical ID, --stack-name tells the SAM CLI which stack to look in."
    fr: "sam remote invoke exécute une fonction déployée dans le cloud AWS, et --test-event-name sélectionne un événement de test partageable stocké dans le registre de schémas EventBridge. Lorsque la fonction est identifiée par son ID logique, --stack-name indique à la CLI SAM dans quelle pile la chercher."
  options:
    b:
      en: "sam local invoke runs the function locally in a container and expects a path to an event file, not the name of a shareable event."
      fr: "sam local invoke exécute la fonction localement dans un conteneur et attend le chemin d'un fichier d'événement, pas le nom d'un événement partageable."
    c:
      en: "test-event put saves a local event file to the registry; it does not invoke the function, and it would need a file in the repository."
      fr: "test-event put enregistre un fichier d'événement local dans le registre ; il n'invoque pas la fonction et nécessiterait un fichier dans le référentiel."
    d:
      en: "The qualifier is a version or alias of the function, not a test event, and the logical ID is not the deployed function name."
      fr: "Le qualificatif est une version ou un alias de la fonction, pas un événement de test, et l'ID logique n'est pas le nom de la fonction déployée."
references:
  - title: Introduction to cloud testing with sam remote test-event
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-remote-test-event.html
