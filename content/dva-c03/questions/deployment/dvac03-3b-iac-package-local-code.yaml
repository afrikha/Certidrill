id: dvac03-3b-iac-package-local-code
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CloudFormation template at AnyCompany defines an AWS::Lambda::Function whose Code property points to the local folder ./src, and an AWS::CloudFormation::Stack whose TemplateURL points to the local file ./network.yaml. A CI job must deploy the template with the AWS CLI, and the local files must be uploaded automatically.

    Which solution will meet these requirements?
  fr: |
    Un modèle AWS CloudFormation d'AnyCompany définit une AWS::Lambda::Function dont la propriété Code pointe vers le dossier local ./src, et une AWS::CloudFormation::Stack dont la propriété TemplateURL pointe vers le fichier local ./network.yaml. Une tâche de CI doit déployer le modèle avec l'AWS CLI, et les fichiers locaux doivent être chargés automatiquement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run aws cloudformation validate-template on the template, then run aws cloudformation deploy with the original template.", fr: "Exécuter aws cloudformation validate-template sur le modèle, puis exécuter aws cloudformation deploy avec le modèle d'origine." } }
    - { id: b, text: { en: "Run aws cloudformation package with --s3-bucket, then run aws cloudformation deploy with the template that it writes.", fr: "Exécuter aws cloudformation package avec --s3-bucket, puis exécuter aws cloudformation deploy avec le modèle qu'il écrit." } }
    - { id: c, text: { en: "Run aws cloudformation create-change-set with --template-body file://template.yaml, then execute the change set.", fr: "Exécuter aws cloudformation create-change-set avec --template-body file://template.yaml, puis exécuter le jeu de modifications." } }
    - { id: d, text: { en: "Run aws s3 sync to copy the project folder to a bucket, then run aws cloudformation deploy with the original template.", fr: "Exécuter aws s3 sync pour copier le dossier du projet dans un compartiment, puis exécuter aws cloudformation deploy avec le modèle d'origine." } }
answer: { optionId: b }
explanation:
  correct:
    en: "aws cloudformation package uploads the local artifacts that the template references, such as function code folders and nested stack templates, to an S3 bucket. It then writes a copy of the template in which the local paths are replaced by the S3 locations, and that template can be deployed with aws cloudformation deploy."
    fr: "aws cloudformation package charge dans un compartiment S3 les artefacts locaux référencés par le modèle, comme les dossiers de code des fonctions et les modèles de piles imbriquées. Il écrit ensuite une copie du modèle dans laquelle les chemins locaux sont remplacés par les emplacements S3, et ce modèle peut être déployé avec aws cloudformation deploy."
  options:
    a:
      en: "Validation checks the template syntax but uploads nothing, so CloudFormation still cannot read the local paths."
      fr: "La validation vérifie la syntaxe du modèle mais ne charge rien : CloudFormation ne peut toujours pas lire les chemins locaux."
    c:
      en: "A change set uses the template as written; CloudFormation cannot read files from the CI machine's local folders."
      fr: "Un jeu de modifications utilise le modèle tel qu'il est écrit ; CloudFormation ne peut pas lire les fichiers des dossiers locaux de la machine de CI."
    d:
      en: "Syncing files to S3 does not change the local paths in the template, so CloudFormation still has no S3 location for the code and nested template."
      fr: "Synchroniser les fichiers dans S3 ne change pas les chemins locaux du modèle : CloudFormation n'a toujours pas d'emplacement S3 pour le code et le modèle imbriqué."
references:
  - title: Upload local artifacts to an S3 bucket with the AWS CLI
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-cli-package.html
