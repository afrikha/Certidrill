id: dvac03-3b-cd-ec2-instance-prereqs
objective: "3.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany launches new Amazon EC2 Linux instances with the tag App=billing and creates an AWS CodeDeploy deployment group that targets this tag. The application revisions are stored as .zip bundles in a private Amazon S3 bucket. The first in-place deployment cannot complete on any instance.

    Which combination of steps must the developer complete on the instances? (Choose two.)
  fr: |
    AnyCompany lance de nouvelles instances Amazon EC2 Linux avec la balise App=billing et crée un groupe de déploiement AWS CodeDeploy qui cible cette balise. Les révisions de l'application sont stockées sous forme de bundles .zip dans un compartiment Amazon S3 privé. Le premier déploiement sur place ne peut se terminer sur aucune instance.

    Quelle combinaison d'étapes le développeur doit-il effectuer sur les instances ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the CodeDeploy agent and make sure that it is running.", fr: "Installer l'agent CodeDeploy et vérifier qu'il est en cours d'exécution." } }
    - { id: b, text: { en: "Attach the CodeDeploy service role to the instances as their instance profile.", fr: "Associer le rôle de service CodeDeploy aux instances comme profil d'instance." } }
    - { id: c, text: { en: "Attach an IAM instance profile whose role allows s3:Get* and s3:List* on the revision bucket.", fr: "Associer un profil d'instance IAM dont le rôle autorise s3:Get* et s3:List* sur le compartiment des révisions." } }
    - { id: d, text: { en: "Assign a public IP address to each instance so that CodeDeploy can connect to it over SSH.", fr: "Attribuer une adresse IP publique à chaque instance afin que CodeDeploy puisse s'y connecter en SSH." } }
    - { id: e, text: { en: "Copy the AppSpec file to the root directory of each instance before the deployment.", fr: "Copier le fichier AppSpec dans le répertoire racine de chaque instance avant le déploiement." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The CodeDeploy agent on each instance polls CodeDeploy, downloads the revision, and runs the lifecycle events, so it must be installed and running. The instance needs an IAM instance profile whose role can read the S3 bucket that stores the revisions."
    fr: "L'agent CodeDeploy de chaque instance interroge CodeDeploy, télécharge la révision et exécute les événements de cycle de vie : il doit donc être installé et en cours d'exécution. L'instance a besoin d'un profil d'instance IAM dont le rôle peut lire le compartiment S3 qui stocke les révisions."
  options:
    b:
      en: "The service role is assumed by the CodeDeploy service itself, for example to read tags and Auto Scaling groups; the instances need their own role for S3 access."
      fr: "Le rôle de service est assumé par le service CodeDeploy lui-même, par exemple pour lire les balises et les groupes Auto Scaling ; les instances ont besoin de leur propre rôle pour accéder à S3."
    d:
      en: "CodeDeploy does not connect to instances over SSH; the agent initiates the communication."
      fr: "CodeDeploy ne se connecte pas aux instances en SSH ; c'est l'agent qui initie la communication."
    e:
      en: "The AppSpec file is part of the revision bundle that the agent downloads; it is not copied to the instance in advance."
      fr: "Le fichier AppSpec fait partie du bundle de révision que l'agent télécharge ; il n'est pas copié sur l'instance à l'avance."
references:
  - title: Configure an Amazon EC2 instance to work with CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/instances-ec2-configure.html
