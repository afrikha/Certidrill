id: dvac03-3a-pipeline-filepath-trigger
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores several microservices in one GitHub monorepo. A V2 type AWS CodePipeline pipeline for the payments service uses a CodeStarSourceConnection source action on the `main` branch. Today the pipeline runs for every push to `main`. It must run only when a push to `main` changes files under `services/payments/`.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    AnyCompany stocke plusieurs microservices dans un même monorepo GitHub. Un pipeline AWS CodePipeline de type V2 pour le service de paiement utilise une action source CodeStarSourceConnection sur la branche `main`. Aujourd'hui, le pipeline s'exécute pour chaque transfert (push) vers `main`. Il ne doit s'exécuter que lorsqu'un transfert vers `main` modifie des fichiers sous `services/payments/`.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: { en: "Set DetectChanges to false and start the pipeline from an AWS CodeBuild project whose webhook has a FILE_PATH filter.", fr: "Définir DetectChanges sur false et démarrer le pipeline depuis un projet AWS CodeBuild dont le webhook a un filtre FILE_PATH." } }
    - { id: b, text: { en: "Move the payments service to its own branch and change the source action to track that branch.", fr: "Déplacer le service de paiement dans sa propre branche et modifier l'action source pour suivre cette branche." } }
    - { id: c, text: { en: "Add a push trigger to the pipeline with branches includes main and filePaths includes services/payments/**.", fr: "Ajouter au pipeline un déclencheur push avec branches includes main et filePaths includes services/payments/**." } }
    - { id: d, text: { en: "Add a pull request trigger to the pipeline for the CLOSED event on the main branch.", fr: "Ajouter au pipeline un déclencheur de demande d'extraction (pull request) pour l'événement CLOSED sur la branche main." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Pipeline triggers on a connection source can filter push events on branches, file paths and Git tags, and the filters can be combined in one push trigger. A push trigger that includes main and services/payments/** starts the pipeline only for pushes to main that change those files."
    fr: "Les déclencheurs d'un pipeline sur une source de connexion peuvent filtrer les événements push par branches, chemins de fichiers et balises Git, et les filtres peuvent être combinés dans un même déclencheur push. Un déclencheur push qui inclut main et services/payments/** ne démarre le pipeline que pour les transferts vers main qui modifient ces fichiers."
  options:
    a:
      en: "This can work, but it adds a CodeBuild project, a webhook and code to start the pipeline, which is more effort than a built-in trigger filter."
      fr: "Cela peut fonctionner, mais ajoute un projet CodeBuild, un webhook et du code pour démarrer le pipeline, ce qui demande plus d'effort qu'un filtre de déclencheur intégré."
    b:
      en: "Splitting the monorepo into service branches changes the team's Git workflow and is not needed to filter on paths."
      fr: "Découper le monorepo en branches par service modifie le flux Git de l'équipe et n'est pas nécessaire pour filtrer sur des chemins."
    d:
      en: "Without a file path filter, every merged pull request starts the pipeline, and direct pushes to main are no longer handled."
      fr: "Sans filtre de chemin de fichier, chaque demande d'extraction fusionnée démarre le pipeline, et les transferts directs vers main ne sont plus traités."
references:
  - title: Add trigger with code push or pull request event types
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-filter.html
