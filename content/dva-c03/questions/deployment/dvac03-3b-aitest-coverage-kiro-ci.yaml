id: dvac03-3b-aitest-coverage-kiro-ci
objective: "3.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany builds a Java service in AWS CodeBuild. The build already runs the unit tests and produces a JaCoCo XML coverage file at target/site/jacoco/jacoco.xml. The team wants to view the line and branch coverage of each build in the CodeBuild console, and wants an AI agent to write new unit tests automatically for uncovered code paths during the build, without a person in the loop.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany génère un service Java dans AWS CodeBuild. Le build exécute déjà les tests unitaires et produit un fichier de couverture JaCoCo XML à l'emplacement target/site/jacoco/jacoco.xml. L'équipe veut consulter la couverture des lignes et des branches de chaque build dans la console CodeBuild, et veut qu'un agent d'IA écrive automatiquement de nouveaux tests unitaires pour les chemins de code non couverts pendant le build, sans intervention humaine.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a reports section to the buildspec with a JACOCOXML report group that points to jacoco.xml.", fr: "Ajouter au buildspec une section reports avec un groupe de rapports JACOCOXML qui pointe vers jacoco.xml." } }
    - { id: b, text: { en: "Add jacoco.xml to the artifacts section of the buildspec so that CodeBuild uploads the coverage file to Amazon S3.", fr: "Ajouter jacoco.xml à la section artifacts du buildspec afin que CodeBuild charge le fichier de couverture dans Amazon S3." } }
    - { id: c, text: { en: "Run kiro-cli chat --no-interactive in a build command with a prompt to write tests for the gaps in jacoco.xml.", fr: "Exécuter kiro-cli chat --no-interactive dans une commande de build avec une invite qui demande d'écrire des tests pour les lacunes de jacoco.xml." } }
    - { id: d, text: { en: "Install the Amazon Q Developer plugin in the build image and run its unit test generation command on the classes.", fr: "Installer le plug-in Amazon Q Developer dans l'image de build et exécuter sa commande de génération de tests unitaires sur les classes." } }
    - { id: e, text: { en: "Add a Kiro steering file to the repository that asks the agent to raise the test coverage of uncovered code paths.", fr: "Ajouter au référentiel un fichier steering Kiro qui demande à l'agent d'augmenter la couverture de test des chemins non couverts." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "CodeBuild creates code coverage reports from the reports section of the buildspec; JaCoCo XML is a supported format with the file-format value JACOCOXML, and the console then shows the coverage of each build. Kiro CLI headless mode runs a prompt non-interactively in a pipeline with an API key in KIRO_API_KEY, so the agent can read the coverage file and write tests without a person."
    fr: "CodeBuild crée des rapports de couverture de code à partir de la section reports du buildspec ; JaCoCo XML est un format pris en charge avec la valeur file-format JACOCOXML, et la console affiche ensuite la couverture de chaque build. Le mode sans interface (headless) de la CLI Kiro exécute une invite de façon non interactive dans un pipeline avec une clé d'API dans KIRO_API_KEY : l'agent peut lire le fichier de couverture et écrire des tests sans intervention humaine."
  options:
    b:
      en: "Build artifacts are only uploaded files; CodeBuild does not parse them into coverage reports in the console."
      fr: "Les artefacts de build ne sont que des fichiers chargés ; CodeBuild ne les analyse pas pour créer des rapports de couverture dans la console."
    d:
      en: "Amazon Q Developer closed to new sign-ups in May 2026 and Kiro is its successor, so it is not a choice for this new pipeline."
      fr: "Amazon Q Developer est fermé aux nouvelles inscriptions depuis mai 2026 et Kiro lui succède : ce n'est pas un choix pour ce nouveau pipeline."
    e:
      en: "A steering file only guides Kiro when Kiro runs; it does not run an agent in the build."
      fr: "Un fichier steering ne fait qu'orienter Kiro lorsqu'il s'exécute ; il n'exécute pas d'agent dans le build."
references:
  - title: Create code coverage reports
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/code-coverage-report.html
  - title: Headless mode - CLI - Docs - Kiro
    url: https://kiro.dev/docs/cli/headless/
