id: dvac03-3a-samconfig-env
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team deploys one AWS SAM application to dev, test and prod. Each environment uses its own stack name and its own values for the TableName and LogLevel template parameters. Developers must deploy any environment with a short, repeatable command, without typing parameter values or answering prompts.

    Which solution will meet these requirements?
  fr: |
    Une équipe déploie une application AWS SAM en dev, test et prod. Chaque environnement utilise son propre nom de pile et ses propres valeurs pour les paramètres de modèle TableName et LogLevel. Les développeurs doivent déployer n'importe quel environnement avec une commande courte et reproductible, sans saisir de valeurs de paramètres ni répondre à des invites.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Maintain three copies of the template with the values written as defaults and choose the file with --template-file.", fr: "Maintenir trois copies du modèle avec les valeurs écrites comme valeurs par défaut et choisir le fichier avec --template-file." } }
    - { id: b, text: { en: "Define dev, test and prod environments in samconfig.toml with stack_name and parameter_overrides, and run sam deploy --config-env.", fr: "Définir des environnements dev, test et prod dans samconfig.toml avec stack_name et parameter_overrides, et exécuter sam deploy --config-env." } }
    - { id: c, text: { en: "Run sam deploy --guided for each deployment and enter the stack name and the parameter values for the environment.", fr: "Exécuter sam deploy --guided pour chaque déploiement et saisir le nom de pile et les valeurs de paramètres de l'environnement." } }
    - { id: d, text: { en: "Deploy the same stack everywhere and edit the Lambda environment variables in the console after each deployment.", fr: "Déployer la même pile partout et modifier les variables d'environnement Lambda dans la console après chaque déploiement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A samconfig.toml file can hold several named environments, each with tables such as [prod.deploy.parameters]. The --config-env option selects the environment, and parameter_overrides values take precedence over the template defaults, so sam deploy --config-env prod deploys the right stack with the right values."
    fr: "Un fichier samconfig.toml peut contenir plusieurs environnements nommés, chacun avec des tables comme [prod.deploy.parameters]. L'option --config-env sélectionne l'environnement, et les valeurs de parameter_overrides prennent le pas sur les valeurs par défaut du modèle : sam deploy --config-env prod déploie la bonne pile avec les bonnes valeurs."
  options:
    a:
      en: "Three template copies drift apart over time and every change must be made three times."
      fr: "Trois copies du modèle divergent avec le temps, et chaque modification doit être faite trois fois."
    c:
      en: "Guided mode asks for the values interactively, which the developers must avoid."
      fr: "Le mode guidé demande les valeurs de façon interactive, ce que les développeurs doivent éviter."
    d:
      en: "Manual console edits are not repeatable and are overwritten by the next deployment."
      fr: "Les modifications manuelles dans la console ne sont pas reproductibles et sont écrasées par le déploiement suivant."
references:
  - title: AWS SAM CLI configuration file
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
