id: dvac03-3a-mock-conditional-error
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Testers use a mock integration on `GET /inventory` in the test stage of a REST API to simulate a supplier API. They need the same method and stage URL to return a 200 response with sample data by default, and a 503 response with an error body when the request contains the query string `simulate=outage`. No backend may be called.

    Which configuration will meet these requirements?
  fr: |
    Des testeurs utilisent une intégration fictive (mock) sur `GET /inventory` dans l'étape test d'une API REST pour simuler l'API d'un fournisseur. Ils ont besoin que la même méthode et la même URL d'étape renvoient par défaut une réponse 200 avec des données d'exemple, et une réponse 503 avec un corps d'erreur lorsque la requête contient la chaîne de requête `simulate=outage`. Aucun backend ne doit être appelé.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a second stage whose stage variable sets the status code to 503 and give testers its URL for outage tests.", fr: "Créer une seconde étape dont une variable d'étape fixe le code d'état à 503 et donner son URL aux testeurs pour les tests de panne." } }
    - { id: b, text: { en: "Add a request validator that rejects requests with simulate=outage, and customize its gateway response with status 503.", fr: "Ajouter un validateur de requêtes qui refuse les requêtes avec simulate=outage, et personnaliser sa réponse de passerelle avec le statut 503." } }
    - { id: c, text: { en: "Return statusCode 503 or 200 from an #if on $input.params('simulate') in the request template, with 200 and 503 integration responses.", fr: "Renvoyer statusCode 503 ou 200 par un #if sur $input.params('simulate') dans le modèle de requête, avec des réponses d'intégration 200 et 503." } }
    - { id: d, text: { en: "Add an HTTP integration to the method for outage tests and switch to it with a stage variable when simulate=outage.", fr: "Ajouter à la méthode une intégration HTTP pour les tests de panne et y basculer avec une variable d'étape lorsque simulate=outage." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The integration request mapping template of a mock can contain logic: a #if on $input.params('simulate') returns statusCode 503 for outage tests and 200 otherwise. Each status code selects its own integration response, whose mapping template provides the sample body or the error body."
    fr: "Le modèle de mappage de la requête d'intégration d'une intégration fictive peut contenir de la logique : un #if sur $input.params('simulate') renvoie statusCode 503 pour les tests de panne et 200 sinon. Chaque code d'état sélectionne sa propre réponse d'intégration, dont le modèle de mappage fournit le corps d'exemple ou le corps d'erreur."
  options:
    a:
      en: "A second stage changes the URL, but the testers need the same method and stage URL for both cases."
      fr: "Une seconde étape change l'URL, alors que les testeurs ont besoin de la même méthode et de la même URL d'étape dans les deux cas."
    b:
      en: "Request validators check required parameters and body models; they cannot reject a request because a parameter has a given value."
      fr: "Les validateurs de requêtes vérifient les paramètres obligatoires et les modèles de corps ; ils ne peuvent pas refuser une requête parce qu'un paramètre a une valeur donnée."
    d:
      en: "A method has a single integration, an HTTP integration would call a backend, and a stage variable cannot change the integration type."
      fr: "Une méthode n'a qu'une seule intégration, une intégration HTTP appellerait un backend, et une variable d'étape ne peut pas changer le type d'intégration."
references:
  - title: Mock integrations for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-mock-integration.html
