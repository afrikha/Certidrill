id: dvac03-3a-cache-invalidation-auth
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A REST API in Amazon API Gateway has caching enabled on its prod stage with a 300-second TTL. The backend load is much higher than expected because some mobile clients send the `Cache-Control: max-age=0` header on every request. Only an internal administration tool, which signs its requests with an IAM role, must be able to refresh cache entries. Other clients must keep getting responses.

    Which solution will meet these requirements?
  fr: |
    Une API REST Amazon API Gateway a la mise en cache activée sur son étape prod avec une durée de vie (TTL) de 300 secondes. La charge du backend est bien plus élevée que prévu, car certains clients mobiles envoient l'en-tête `Cache-Control: max-age=0` à chaque requête. Seul un outil d'administration interne, qui signe ses requêtes avec un rôle IAM, doit pouvoir actualiser les entrées du cache. Les autres clients doivent continuer à recevoir des réponses.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Require authorization for cache invalidation with the SUCCEED_WITH_RESPONSE_HEADER strategy, and allow execute-api:InvalidateCache for the role.", fr: "Exiger une autorisation pour l'invalidation du cache avec la stratégie SUCCEED_WITH_RESPONSE_HEADER, et autoriser execute-api:InvalidateCache pour le rôle." } }
    - { id: b, text: { en: "Require authorization for cache invalidation with the FAIL_WITH_403 strategy, and allow execute-api:InvalidateCache for the role.", fr: "Exiger une autorisation pour l'invalidation du cache avec la stratégie FAIL_WITH_403, et autoriser execute-api:InvalidateCache pour le rôle." } }
    - { id: c, text: { en: "Raise the TTL of the stage cache to 3,600 seconds so that cached entries stay valid longer.", fr: "Porter la durée de vie du cache de l'étape à 3 600 secondes pour que les entrées restent valides plus longtemps." } }
    - { id: d, text: { en: "Set the TTL of the stage cache to 0 seconds so that clients can no longer invalidate cached entries.", fr: "Définir la durée de vie du cache de l'étape à 0 seconde pour que les clients ne puissent plus invalider les entrées." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Without an authorization requirement, any client can bypass and refresh the cache with `Cache-Control: max-age=0`. Requiring authorization limits this to callers allowed execute-api:InvalidateCache, and SUCCEED_WITH_RESPONSE_HEADER ignores the header from other clients, serves them normally and adds a warning header."
    fr: "Sans exigence d'autorisation, n'importe quel client peut contourner et actualiser le cache avec `Cache-Control: max-age=0`. Exiger une autorisation réserve cette possibilité aux appelants autorisés à execute-api:InvalidateCache, et SUCCEED_WITH_RESPONSE_HEADER ignore l'en-tête des autres clients, les sert normalement et ajoute un en-tête d'avertissement."
  options:
    b:
      en: "FAIL_WITH_403 also blocks unauthorized invalidation, but the mobile clients that send the header would receive 403 errors instead of responses."
      fr: "FAIL_WITH_403 bloque aussi l'invalidation non autorisée, mais les clients mobiles qui envoient l'en-tête recevraient des erreurs 403 au lieu de réponses."
    c:
      en: "A longer TTL does not stop clients from bypassing the cache with the header."
      fr: "Une durée de vie plus longue n'empêche pas les clients de contourner le cache avec l'en-tête."
    d:
      en: "A TTL of 0 disables caching, so every request reaches the backend."
      fr: "Une durée de vie de 0 désactive la mise en cache : chaque requête atteint le backend."
references:
  - title: Cache settings for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-caching.html
