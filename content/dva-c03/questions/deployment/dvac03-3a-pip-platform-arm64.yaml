id: dvac03-3a-pip-platform-arm64
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A CI job runs on an x86_64 Linux build host that cannot run containers. The job builds the .zip deployment package of a Python 3.12 Lambda function that is configured with the arm64 architecture. One dependency publishes manylinux wheels for both x86_64 and aarch64. After deployment, the function fails at import because the installed binary targets the wrong architecture. The function must stay on arm64.

    Which solution will meet these requirements?
  fr: |
    Un job de CI s'exécute sur un hôte de build Linux x86_64 qui ne peut pas exécuter de conteneurs. Le job crée le package de déploiement .zip d'une fonction Lambda Python 3.12 configurée avec l'architecture arm64. Une dépendance publie des wheels manylinux pour x86_64 et pour aarch64. Après le déploiement, la fonction échoue à l'importation, car le binaire installé cible la mauvaise architecture. La fonction doit rester sur arm64.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Replace the pip step with sam build --use-container so that the package is built in a Lambda-like environment.", fr: "Remplacer l'étape pip par sam build --use-container pour que le package soit construit dans un environnement semblable à Lambda." } }
    - { id: b, text: { en: "Run `pip install --no-binary=:all: --target package` so that the dependency is compiled from source on the build host.", fr: "Exécuter `pip install --no-binary=:all: --target package` pour que la dépendance soit compilée à partir des sources sur l'hôte de build." } }
    - { id: c, text: { en: "Run `pip install --platform manylinux2014_aarch64 --only-binary=:all: --implementation cp --python-version 3.12 --target package`.", fr: "Exécuter `pip install --platform manylinux2014_aarch64 --only-binary=:all: --implementation cp --python-version 3.12 --target package`." } }
    - { id: d, text: { en: "Delete the __pycache__ folders from the package so that the runtime recompiles the dependency for arm64 at startup.", fr: "Supprimer les dossiers __pycache__ du package pour que l'environnement d'exécution recompile la dépendance pour arm64 au démarrage." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With the --platform, --only-binary, --implementation and --python-version options, pip downloads the wheel built for the target platform instead of the build host. Lambda documents manylinux2014_aarch64 for arm64 functions, so the package contains the aarch64 binary without needing a container."
    fr: "Avec les options --platform, --only-binary, --implementation et --python-version, pip télécharge le wheel construit pour la plateforme cible au lieu de celle de l'hôte de build. Lambda documente manylinux2014_aarch64 pour les fonctions arm64 : le package contient le binaire aarch64 sans conteneur."
  options:
    a:
      en: "sam build --use-container needs a container runtime such as Docker, which the build host cannot run."
      fr: "sam build --use-container nécessite un moteur de conteneurs comme Docker, que l'hôte de build ne peut pas exécuter."
    b:
      en: "Compiling from source on an x86_64 host produces an x86_64 binary, which is the same architecture problem."
      fr: "Compiler à partir des sources sur un hôte x86_64 produit un binaire x86_64 : le problème d'architecture reste le même."
    d:
      en: "Removing __pycache__ is recommended, but bytecode is not the issue: the compiled extension module is still built for x86_64 and Python does not recompile it."
      fr: "Supprimer __pycache__ est recommandé, mais le bytecode n'est pas en cause : le module d'extension compilé reste construit pour x86_64 et Python ne le recompile pas."
references:
  - title: Working with .zip file archives for Python Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/python-package.html
