id: dvac03-3a-eb-deploy-staged
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer uses the EB CLI in a Git repository to deploy an application to an AWS Elastic Beanstalk test environment. The developer edits several files and adds them to the Git staging area with `git add`, but does not commit them. After `eb deploy`, the environment still runs the previous code. The developer wants to test the staged changes without committing them.

    Which command should the developer run?
  fr: |
    Un développeur utilise l'EB CLI dans un référentiel Git pour déployer une application dans un environnement de test AWS Elastic Beanstalk. Il modifie plusieurs fichiers et les ajoute à la zone de transit Git avec `git add`, sans les valider. Après `eb deploy`, l'environnement exécute toujours l'ancien code. Le développeur veut tester les modifications indexées sans les valider.

    Quelle commande le développeur doit-il exécuter ?
body:
  options:
    - { id: a, text: "eb use test" }
    - { id: b, text: "eb deploy --staged" }
    - { id: c, text: "eb deploy --label staged-test" }
    - { id: d, text: "eb init --source codecommit/test" }
answer: { optionId: b }
explanation:
  correct:
    en: "In a Git repository, the EB CLI deploys the latest commit of the current branch, with the commit ID as the version label. The --staged option deploys the changes that were added to the staging area without a commit."
    fr: "Dans un référentiel Git, l'EB CLI déploie le dernier commit de la branche actuelle, avec l'ID du commit comme étiquette de version. L'option --staged déploie les modifications ajoutées à la zone de transit sans commit."
  options:
    a:
      en: "eb use associates the current branch with an environment; the next deployment still uses the latest commit."
      fr: "eb use associe la branche actuelle à un environnement ; le déploiement suivant utilise toujours le dernier commit."
    c:
      en: "--label only names the application version; the content is still the latest commit."
      fr: "--label nomme seulement la version de l'application ; le contenu reste le dernier commit."
    d:
      en: "eb init configures the project and its default settings; it does not deploy uncommitted changes."
      fr: "eb init configure le projet et ses paramètres par défaut ; il ne déploie pas de modifications non validées."
references:
  - title: Using the EB CLI with Git
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/eb3-cli-git.html
