id: dvac03-3a-connection-pending
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer deploys an AWS CloudFormation template that creates an AWS CodeConnections connection to GitHub and an AWS CodePipeline pipeline that uses it in its source action. The pipeline service role already allows codeconnections:UseConnection on the connection. The source stage fails, and the console shows the connection in the PENDING status.

    What should the developer do to fix the issue?
  fr: |
    Un développeur déploie un modèle AWS CloudFormation qui crée une connexion AWS CodeConnections vers GitHub et un pipeline AWS CodePipeline qui l'utilise dans son action source. Le rôle de service du pipeline autorise déjà codeconnections:UseConnection sur la connexion. L'étape source échoue, et la console affiche la connexion avec le statut PENDING.

    Que doit faire le développeur pour résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Add the codestar-connections:UseConnection permission to the pipeline service role as well.", fr: "Ajouter aussi l'autorisation codestar-connections:UseConnection au rôle de service du pipeline." } }
    - { id: b, text: { en: "Delete the connection and create it again with the aws codestar-connections create-connection command.", fr: "Supprimer la connexion et la recréer avec la commande aws codestar-connections create-connection." } }
    - { id: c, text: { en: "Update the pending connection in the console and complete the GitHub authorization so that its status becomes AVAILABLE.", fr: "Mettre à jour la connexion en attente dans la console et terminer l'autorisation GitHub pour que son statut devienne AVAILABLE." } }
    - { id: d, text: { en: "Set DetectChanges to true in the source action so that the pipeline activates the connection on the next push.", fr: "Définir DetectChanges sur true dans l'action source pour que le pipeline active la connexion au prochain transfert." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A connection created through the AWS CLI or CloudFormation is in the PENDING status by default. It cannot be used until someone completes the handshake with the provider in the console, which installs or selects the GitHub App and changes the status to AVAILABLE."
    fr: "Une connexion créée par l'AWS CLI ou CloudFormation a le statut PENDING par défaut. Elle ne peut pas être utilisée tant que quelqu'un n'a pas terminé l'échange avec le fournisseur dans la console, ce qui installe ou sélectionne l'application GitHub et fait passer le statut à AVAILABLE."
  options:
    a:
      en: "Permissions are not the cause: a pending connection fails whatever the role allows until the handshake is completed."
      fr: "Les autorisations ne sont pas en cause : une connexion en attente échoue quelles que soient les autorisations du rôle tant que l'échange n'est pas terminé."
    b:
      en: "A connection created with the CLI is also PENDING and still has to be completed in the console."
      fr: "Une connexion créée avec la CLI a aussi le statut PENDING et doit toujours être finalisée dans la console."
    d:
      en: "DetectChanges controls whether new commits start the pipeline; it does not authorize a pending connection."
      fr: "DetectChanges détermine si les nouveaux commits démarrent le pipeline ; il n'autorise pas une connexion en attente."
references:
  - title: GitHub connections
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/connections-github.html
