id: dvac03-3c-apigw-canary
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company exposes a REST API in Amazon API Gateway through a stage named `prod`. A stage variable named `lambdaAlias` selects the alias of the backend AWS Lambda function. The next release adds new resources and methods to the API and uses a new Lambda alias. The team wants 5% of `prod` requests, chosen at random, to use the new release, with separate logs and metrics for those requests, before the release serves all clients.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise expose une API REST dans Amazon API Gateway via une étape nommée `prod`. Une variable d'étape nommée `lambdaAlias` sélectionne l'alias de la fonction AWS Lambda backend. La prochaine version ajoute de nouvelles ressources et méthodes à l'API et utilise un nouvel alias Lambda. L'équipe veut que 5 % des requêtes `prod`, choisies au hasard, utilisent la nouvelle version, avec des journaux et des métriques séparés pour ces requêtes, avant que la version ne serve tous les clients.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Deploy the API as a canary on the `prod` stage with percentTraffic set to 5 and a `lambdaAlias` override, then promote it.", fr: "Déployer l'API comme canary sur l'étape `prod` avec percentTraffic défini sur 5 et un remplacement de `lambdaAlias`, puis le promouvoir." }
    - id: b
      text: { en: "Configure the current Lambda alias as a weighted alias that sends 5% of invocations to the new function version.", fr: "Configurer l'alias Lambda actuel comme un alias pondéré qui envoie 5 % des appels vers la nouvelle version de la fonction." }
    - id: c
      text: { en: "Deploy the new API to a second stage and create Amazon Route 53 weighted records that send 5% of requests to that stage.", fr: "Déployer la nouvelle API dans une seconde étape et créer des enregistrements pondérés Amazon Route 53 qui envoient 5 % des requêtes vers cette étape." }
    - id: d
      text: { en: "Deploy the new API to a second stage and give the URL of that stage to 5% of the API clients.", fr: "Déployer la nouvelle API dans une seconde étape et communiquer l'URL de cette étape à 5 % des clients de l'API." }
answer: { optionId: a }
explanation:
  correct:
    en: "A canary release on a stage sends a random percentTraffic share of requests to a new deployment while the rest stays on the production release, and stage variables can be overridden for the canary. Canary requests get their own execution and access logs and metrics, and promoting the canary makes the new deployment the production release of the stage."
    fr: "Une version canary sur une étape envoie une part aléatoire percentTraffic des requêtes vers un nouveau déploiement tandis que le reste reste sur la version de production, et les variables d'étape peuvent être remplacées pour le canary. Les requêtes canary ont leurs propres journaux d'exécution et d'accès et leurs propres métriques, et la promotion du canary fait du nouveau déploiement la version de production de l'étape."
  options:
    b:
      en: "A weighted alias only splits traffic between function versions; the new API resources and methods would not be deployed to the stage."
      fr: "Un alias pondéré ne répartit le trafic qu'entre des versions de fonction ; les nouvelles ressources et méthodes de l'API ne seraient pas déployées dans l'étape."
    c:
      en: "Stages of one API share the same hostname with different paths, so DNS weighting needs custom domains and more configuration to manage."
      fr: "Les étapes d'une même API partagent le même nom d'hôte avec des chemins différents : la pondération DNS exige des domaines personnalisés et davantage de configuration à gérer."
    d:
      en: "Selected clients are not a random 5% of requests, and clients must change the URL that they call."
      fr: "Des clients choisis ne représentent pas 5 % aléatoires des requêtes, et les clients doivent changer l'URL qu'ils appellent."
references:
  - title: Set up an API Gateway canary release deployment
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/canary-release.html
