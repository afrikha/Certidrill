id: dvac03-3b-iac-sam-policy-templates
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS SAM template at AnyCompany defines a function named OrdersFunction and an AWS::DynamoDB::Table named OrdersTable. The function must create, read, update, and delete items in OrdersTable only. The team wants least-privilege permissions with the LEAST template code.

    Which change to the OrdersFunction resource will meet these requirements?
  fr: |
    Un modèle AWS SAM d'AnyCompany définit une fonction nommée OrdersFunction et une AWS::DynamoDB::Table nommée OrdersTable. La fonction doit créer, lire, mettre à jour et supprimer des éléments uniquement dans OrdersTable. L'équipe veut des autorisations de moindre privilège avec le MOINS de code de modèle possible.

    Quelle modification de la ressource OrdersFunction répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the AmazonDynamoDBFullAccess managed policy to the Policies property.", fr: "Ajouter la politique gérée AmazonDynamoDBFullAccess à la propriété Policies." } }
    - { id: b, text: { en: "Add an environment variable TABLE_NAME with the value !Ref OrdersTable.", fr: "Ajouter une variable d'environnement TABLE_NAME avec la valeur !Ref OrdersTable." } }
    - { id: c, text: { en: "Add a separate AWS::IAM::Role with an inline policy that lists each DynamoDB action, and reference it in the Role property.", fr: "Ajouter un AWS::IAM::Role distinct avec une politique en ligne qui liste chaque action DynamoDB, et le référencer dans la propriété Role." } }
    - { id: d, text: { en: "Add a DynamoDBCrudPolicy policy template with TableName: !Ref OrdersTable to the Policies property.", fr: "Ajouter un modèle de politique DynamoDBCrudPolicy avec TableName: !Ref OrdersTable à la propriété Policies." } }
answer: { optionId: d }
explanation:
  correct:
    en: "SAM policy templates are predefined permission sets that you add under Policies with values for their placeholders. DynamoDBCrudPolicy grants create, read, update, and delete permissions scoped to the table named in TableName, so two lines give a least-privilege policy."
    fr: "Les modèles de politique SAM sont des ensembles d'autorisations prédéfinis que vous ajoutez sous Policies avec des valeurs pour leurs espaces réservés. DynamoDBCrudPolicy accorde les autorisations de création, lecture, mise à jour et suppression limitées à la table indiquée dans TableName : deux lignes suffisent pour une politique de moindre privilège."
  options:
    a:
      en: "The managed policy allows every DynamoDB action on every table, which is not least privilege."
      fr: "La politique gérée autorise toutes les actions DynamoDB sur toutes les tables, ce qui n'est pas le moindre privilège."
    b:
      en: "An environment variable tells the code which table to use but grants no permissions."
      fr: "Une variable d'environnement indique au code quelle table utiliser, mais n'accorde aucune autorisation."
    c:
      en: "A hand-written role can be least privilege, but it needs much more template code than a policy template."
      fr: "Un rôle écrit à la main peut respecter le moindre privilège, mais il demande beaucoup plus de code de modèle qu'un modèle de politique."
references:
  - title: AWS SAM policy templates
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-policy-templates.html
