id: dvac03-3a-mock-test-env
objective: "3.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A Lambda function calls a third-party shipping API. The base URL of that API comes from the function's `SHIPPING_API_URL` environment variable. The provider has no sandbox, and automated tests in the test environment must never call the real provider. The tests need realistic responses for the three operations that the function uses, and the function code must not change.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une fonction Lambda appelle l'API d'expédition d'un tiers. L'URL de base de cette API provient de la variable d'environnement `SHIPPING_API_URL` de la fonction. Le fournisseur n'a pas de sandbox, et les tests automatisés de l'environnement de test ne doivent jamais appeler le vrai fournisseur. Les tests ont besoin de réponses réalistes pour les trois opérations utilisées par la fonction, et le code de la fonction ne doit pas changer.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a REST API whose three resources use mock integrations that return sample responses from integration response mapping templates.", fr: "Créer une API REST dont les trois ressources utilisent des intégrations fictives (mock) qui renvoient des réponses d'exemple depuis des modèles de mappage de réponse d'intégration." } }
    - { id: b, text: { en: "Create an HTTP API whose three routes use mock integrations that return sample responses defined in parameter mappings.", fr: "Créer une API HTTP dont les trois routes utilisent des intégrations fictives qui renvoient des réponses d'exemple définies dans des mappages de paramètres." } }
    - { id: c, text: { en: "Set SHIPPING_API_URL of the test environment's function to the invoke URL of the mock API's stage.", fr: "Définir SHIPPING_API_URL de la fonction de l'environnement de test sur l'URL d'appel de l'étape de l'API fictive." } }
    - { id: d, text: { en: "Configure an on-failure destination for the test function so that failed calls to the provider are captured.", fr: "Configurer une destination en cas d'échec pour la fonction de test afin de capturer les appels en échec vers le fournisseur." } }
    - { id: e, text: { en: "Enable API Gateway caching in front of the provider's API so that tests reuse earlier responses.", fr: "Activer la mise en cache API Gateway devant l'API du fournisseur pour que les tests réutilisent des réponses précédentes." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A REST API with mock integrations returns responses generated by API Gateway with no backend call, so it can stand in for the provider. Because the function reads the base URL from an environment variable, pointing the test function at the mock API's stage URL switches the dependency without changing code."
    fr: "Une API REST avec des intégrations fictives renvoie des réponses générées par API Gateway sans appel de backend : elle peut remplacer le fournisseur. Comme la fonction lit l'URL de base dans une variable d'environnement, faire pointer la fonction de test vers l'URL de l'étape de l'API fictive change la dépendance sans modifier le code."
  options:
    b:
      en: "HTTP APIs do not support mock integrations."
      fr: "Les API HTTP ne prennent pas en charge les intégrations fictives."
    d:
      en: "A destination records the results of asynchronous invocations; the function still calls the real provider."
      fr: "Une destination enregistre les résultats des appels asynchrones ; la fonction appelle toujours le vrai fournisseur."
    e:
      en: "Any cache miss still reaches the real provider, and the first calls of each test always do."
      fr: "Chaque absence dans le cache atteint toujours le vrai fournisseur, comme les premiers appels de chaque test."
references:
  - title: Mock integrations for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-mock-integration.html
  - title: Working with Lambda environment variables
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-envvars.html
