id: dvac03-3a-rest-vs-http
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer is creating a new public API in Amazon API Gateway for a Lambda backend. The API must cache responses at the API layer, validate request bodies against a model before the backend is invoked, and be protected by an AWS WAF web ACL. The developer would prefer an HTTP API because of its lower price.

    Which solution will meet these requirements?
  fr: |
    Un développeur crée une nouvelle API publique dans Amazon API Gateway pour un backend Lambda. L'API doit mettre en cache les réponses au niveau de l'API, valider les corps de requête par rapport à un modèle avant l'appel du backend, et être protégée par une liste ACL web AWS WAF. Le développeur préférerait une API HTTP en raison de son prix plus bas.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an HTTP API with a JWT authorizer, and validate the request bodies in the Lambda function.", fr: "Créer une API HTTP avec un mécanisme d'autorisation JWT, et valider les corps de requête dans la fonction Lambda." } }
    - { id: b, text: { en: "Create an HTTP API, associate the AWS WAF web ACL with its stage, and turn on caching for the stage.", fr: "Créer une API HTTP, associer la liste ACL web AWS WAF à son étape, et activer la mise en cache de l'étape." } }
    - { id: c, text: { en: "Create a REST API with a request validator and a model, enable stage caching, and associate the AWS WAF web ACL with the stage.", fr: "Créer une API REST avec un validateur de requêtes et un modèle, activer la mise en cache de l'étape, et associer la liste ACL web AWS WAF à l'étape." } }
    - { id: d, text: { en: "Create an HTTP API with automatic deployments, and cache the responses in the Lambda execution environment.", fr: "Créer une API HTTP avec des déploiements automatiques, et mettre en cache les réponses dans l'environnement d'exécution Lambda." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Caching, request validation and AWS WAF are features of REST APIs only; HTTP APIs support none of them. A REST API with a request validator and a model, stage caching and a web ACL on the stage meets all three requirements."
    fr: "La mise en cache, la validation des requêtes et AWS WAF sont des fonctionnalités réservées aux API REST ; les API HTTP n'en prennent en charge aucune. Une API REST avec un validateur de requêtes et un modèle, la mise en cache de l'étape et une liste ACL web sur l'étape répond aux trois exigences."
  options:
    a:
      en: "A JWT authorizer handles authentication, not caching or AWS WAF, and validating in Lambda happens after the backend is invoked."
      fr: "Un mécanisme d'autorisation JWT gère l'authentification, pas la mise en cache ni AWS WAF, et la validation dans Lambda a lieu après l'appel du backend."
    b:
      en: "HTTP APIs do not support AWS WAF or API caching."
      fr: "Les API HTTP ne prennent en charge ni AWS WAF ni la mise en cache d'API."
    d:
      en: "Automatic deployments do not add any of the three features, and a cache in each Lambda environment is not an API-layer cache."
      fr: "Les déploiements automatiques n'ajoutent aucune des trois fonctionnalités, et un cache dans chaque environnement Lambda n'est pas un cache au niveau de l'API."
references:
  - title: Choose between REST APIs and HTTP APIs
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-vs-rest.html
