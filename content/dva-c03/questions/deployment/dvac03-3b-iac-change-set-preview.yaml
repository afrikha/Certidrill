id: dvac03-3b-iac-change-set-preview
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at AnyCompany modified the AWS CloudFormation template of a production stack, including a property change on an Amazon RDS DB instance. Before any resource is modified, the developer must see which resources the update will add, modify, or replace.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany a modifié le modèle AWS CloudFormation d'une pile de production, notamment une propriété d'une instance de base de données Amazon RDS. Avant toute modification de ressource, le développeur doit voir quelles ressources la mise à jour va ajouter, modifier ou remplacer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run drift detection on the stack and review which resources differ from the template.", fr: "Exécuter la détection de dérive sur la pile et examiner quelles ressources diffèrent du modèle." } }
    - { id: b, text: { en: "Update the stack with rollback disabled and review the stack events.", fr: "Mettre à jour la pile avec la restauration désactivée et examiner les événements de la pile." } }
    - { id: c, text: { en: "Attach a stack policy that denies Update:Replace on the DB instance.", fr: "Associer une politique de pile qui refuse Update:Replace sur l'instance de base de données." } }
    - { id: d, text: { en: "Create a change set from the modified template and review it before executing it.", fr: "Créer un jeu de modifications à partir du modèle modifié et l'examiner avant de l'exécuter." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A change set compares the modified template with the current stack and lists each resource that will be added, modified, or removed, including whether a modification requires replacement. Nothing changes until the developer executes the change set."
    fr: "Un jeu de modifications compare le modèle modifié à la pile actuelle et liste chaque ressource qui sera ajoutée, modifiée ou supprimée, en indiquant si une modification exige un remplacement. Rien ne change tant que le développeur n'exécute pas le jeu de modifications."
  options:
    a:
      en: "Drift detection compares the deployed resources with the current template; it does not preview a new template."
      fr: "La détection de dérive compare les ressources déployées au modèle actuel ; elle ne prévisualise pas un nouveau modèle."
    b:
      en: "This performs the update, so resources are modified before the developer can review anything."
      fr: "Cela effectue la mise à jour : les ressources sont modifiées avant que le développeur ne puisse examiner quoi que ce soit."
    c:
      en: "A stack policy protects resources from updates but does not show what the update would change."
      fr: "Une politique de pile protège des ressources contre les mises à jour, mais ne montre pas ce que la mise à jour modifierait."
references:
  - title: Update CloudFormation stacks using change sets
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-updating-stacks-changesets.html
