id: dvac03-3c-ai-iac-provisioning
objective: "3.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A development team wants to use Kiro to speed up the provisioning of new test environments that contain a VPC, an Amazon ECS service and an Amazon DynamoDB table. Every environment must be reproducible and reviewed before it is created, and it must be created by the team's existing AWS CodePipeline pipeline, which uses the AWS CloudFormation deploy action.

    Which approach will meet these requirements?
  fr: |
    Une équipe de développement veut utiliser Kiro pour accélérer le provisionnement de nouveaux environnements de test contenant un VPC, un service Amazon ECS et une table Amazon DynamoDB. Chaque environnement doit être reproductible et révisé avant sa création, et il doit être créé par le pipeline AWS CodePipeline existant de l'équipe, qui utilise l'action de déploiement AWS CloudFormation.

    Quelle approche répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Let a Kiro agent create the resources directly with AWS CLI calls under an administrator role each time an environment is requested.", fr: "Laisser un agent Kiro créer directement les ressources par des appels AWS CLI sous un rôle administrateur chaque fois qu'un environnement est demandé." }
    - id: b
      text: { en: "Ask Kiro to write a runbook of AWS Management Console steps, and have an operator follow it for each new environment.", fr: "Demander à Kiro de rédiger un runbook d'étapes dans l'AWS Management Console, et faire suivre ce runbook par un opérateur pour chaque nouvel environnement." }
    - id: c
      text: { en: "Use Kiro to generate CloudFormation templates or AWS CDK code, review them in a pull request, and let the pipeline deploy them.", fr: "Utiliser Kiro pour générer des modèles CloudFormation ou du code AWS CDK, les réviser dans une demande d'extraction, et laisser le pipeline les déployer." }
    - id: d
      text: { en: "Write the templates in AWS Cloud9 environments with AI code completion, and deploy them from the Cloud9 terminal.", fr: "Écrire les modèles dans des environnements AWS Cloud9 avec la complétion de code par IA, et les déployer depuis le terminal Cloud9." }
answer: { optionId: c }
explanation:
  correct:
    en: "Generated infrastructure as code is versioned, can be reviewed in a pull request like any other code, and produces identical environments every time. The CloudFormation deploy action can create a change set (CHANGE_SET_REPLACE) and then execute it (CHANGE_SET_EXECUTE), so the pipeline, not the AI tool, creates the resources."
    fr: "L'infrastructure en tant que code générée est versionnée, peut être révisée dans une demande d'extraction comme tout autre code, et produit à chaque fois des environnements identiques. L'action de déploiement CloudFormation peut créer un jeu de modifications (CHANGE_SET_REPLACE) puis l'exécuter (CHANGE_SET_EXECUTE) : c'est le pipeline, et non l'outil d'IA, qui crée les ressources."
  options:
    a:
      en: "Direct CLI calls are neither reviewed nor reproducible, bypass the pipeline, and give the agent far more permissions than needed."
      fr: "Des appels CLI directs ne sont ni révisés ni reproductibles, contournent le pipeline et donnent à l'agent bien plus d'autorisations que nécessaire."
    b:
      en: "Manual console steps are slow, error-prone and not reproducible, and the pipeline does not create the environment."
      fr: "Des étapes manuelles dans la console sont lentes, sujettes aux erreurs et non reproductibles, et le pipeline ne crée pas l'environnement."
    d:
      en: "AWS Cloud9 is closed to new customers, and deploying from a terminal bypasses both the review and the pipeline."
      fr: "AWS Cloud9 n'est plus ouvert aux nouveaux clients, et un déploiement depuis un terminal contourne à la fois la révision et le pipeline."
references:
  - title: CI/CD and automation for serverless AI
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-serverless/cicd-and-automation.html
  - title: CloudFormation deploy action reference
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CloudFormation.html
