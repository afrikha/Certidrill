id: dvac03-3a-full-clone-git-metadata
objective: "3.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS CodePipeline pipeline uses a CodeStarSourceConnection source action for a GitHub repository, followed by an AWS CodeBuild action. The buildspec runs `git describe --tags` to compute the version number of the build. The command fails because the build directory is not a Git repository. The pipeline must keep using the connection.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un pipeline AWS CodePipeline utilise une action source CodeStarSourceConnection pour un référentiel GitHub, suivie d'une action AWS CodeBuild. Le buildspec exécute `git describe --tags` pour calculer le numéro de version du build. La commande échoue, car le répertoire de build n'est pas un référentiel Git. Le pipeline doit continuer à utiliser la connexion.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the OutputArtifactFormat of the source action to CODEBUILD_CLONE_REF (full clone).", fr: "Définir l'OutputArtifactFormat de l'action source sur CODEBUILD_CLONE_REF (clonage complet)." } }
    - { id: b, text: { en: "Add the codeconnections:UseConnection permission for the connection to the CodeBuild service role.", fr: "Ajouter l'autorisation codeconnections:UseConnection pour la connexion au rôle de service CodeBuild." } }
    - { id: c, text: { en: "Add the codeconnections:UseConnection permission to the bucket policy of the pipeline artifact store.", fr: "Ajouter l'autorisation codeconnections:UseConnection à la politique du compartiment du magasin d'artefacts du pipeline." } }
    - { id: d, text: { en: "Set the DetectChanges parameter of the source action to false.", fr: "Définir le paramètre DetectChanges de l'action source sur false." } }
    - { id: e, text: { en: "Add `git-credential-helper: yes` to the env section of the buildspec.", fr: "Ajouter `git-credential-helper: yes` à la section env du buildspec." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "By default, the source action stores a ZIP file of the code without Git metadata. The CODEBUILD_CLONE_REF format passes a reference to the repository so that the CodeBuild action clones it and can run Git commands. CodeBuild then uses the connection itself, so its service role needs codeconnections:UseConnection on the connection."
    fr: "Par défaut, l'action source stocke un fichier ZIP du code sans métadonnées Git. Le format CODEBUILD_CLONE_REF transmet une référence au référentiel pour que l'action CodeBuild le clone et puisse exécuter des commandes Git. CodeBuild utilise alors lui-même la connexion : son rôle de service a besoin de codeconnections:UseConnection sur la connexion."
  options:
    c:
      en: "UseConnection is an identity-based permission of the role that uses the connection; a bucket policy does not grant it."
      fr: "UseConnection est une autorisation basée sur l'identité du rôle qui utilise la connexion ; une politique de compartiment ne l'accorde pas."
    d:
      en: "DetectChanges only controls whether new commits start the pipeline automatically; the artifact stays a ZIP file."
      fr: "DetectChanges détermine seulement si les nouveaux commits démarrent automatiquement le pipeline ; l'artefact reste un fichier ZIP."
    e:
      en: "The credential helper configures Git credentials for AWS CodeCommit; it does not add Git metadata to a ZIP artifact from a connection."
      fr: "L'assistant d'informations d'identification configure Git pour AWS CodeCommit ; il n'ajoute pas de métadonnées Git à un artefact ZIP provenant d'une connexion."
references:
  - title: CodeStarSourceConnection for Bitbucket Cloud, GitHub, GitHub Enterprise Server, GitLab.com, and GitLab self-managed actions
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodestarConnectionSource.html
  - title: Troubleshooting CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/troubleshooting.html
