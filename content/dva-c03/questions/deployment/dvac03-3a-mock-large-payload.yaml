id: dvac03-3a-mock-large-payload
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A REST API in Amazon API Gateway uses mock integrations to simulate a product search service for load tests. A new test scenario needs `GET /search` to return about 500 generated product records, with values that vary between calls. Writing that response in an integration response mapping template has become hard to maintain. The simulated endpoint must stay in the same API.

    Which solution will meet these requirements?
  fr: |
    Une API REST Amazon API Gateway utilise des intégrations fictives (mock) pour simuler un service de recherche de produits lors de tests de charge. Un nouveau scénario de test a besoin que `GET /search` renvoie environ 500 enregistrements de produits générés, avec des valeurs qui varient d'un appel à l'autre. Écrire cette réponse dans un modèle de mappage de réponse d'intégration est devenu difficile à maintenir. Le point de terminaison simulé doit rester dans la même API.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Replace the mock integration of GET /search with a Lambda integration whose function generates the product records.", fr: "Remplacer l'intégration fictive de GET /search par une intégration Lambda dont la fonction génère les enregistrements de produits." } }
    - { id: b, text: { en: "Enable caching on the stage with a larger cache capacity so that the large response is stored.", fr: "Activer la mise en cache sur l'étape avec une capacité de cache plus grande pour que la réponse volumineuse soit stockée." } }
    - { id: c, text: { en: "Split the response across several mapping templates, one for each content type of the method.", fr: "Répartir la réponse sur plusieurs modèles de mappage, un pour chaque type de contenu de la méthode." } }
    - { id: d, text: { en: "Store the product records in stage variables and read them from the integration response mapping template.", fr: "Stocker les enregistrements de produits dans des variables d'étape et les lire depuis le modèle de mappage de la réponse d'intégration." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Mock integrations are not intended for large response templates, and AWS suggests a Lambda integration for those cases. A Lambda function can generate any number of varying records in code while the method stays in the same API and stage."
    fr: "Les intégrations fictives ne sont pas destinées aux modèles de réponse volumineux, et AWS propose une intégration Lambda dans ces cas. Une fonction Lambda peut générer en code n'importe quel nombre d'enregistrements variables, tandis que la méthode reste dans la même API et la même étape."
  options:
    b:
      en: "Caching stores responses that already exist; it does not generate them, and cached responses would not vary between calls."
      fr: "La mise en cache stocke des réponses existantes ; elle ne les génère pas, et des réponses en cache ne varieraient pas d'un appel à l'autre."
    c:
      en: "Each content type has one template, and a client receives only one of them, so splitting does not reduce the template to maintain."
      fr: "Chaque type de contenu a un modèle, et un client n'en reçoit qu'un : le découpage ne réduit pas le modèle à maintenir."
    d:
      en: "Stage variables hold small configuration values; they are not meant to store large data sets."
      fr: "Les variables d'étape contiennent de petites valeurs de configuration ; elles ne sont pas faites pour stocker de grands jeux de données."
references:
  - title: Mock integrations for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-mock-integration.html
