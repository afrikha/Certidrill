id: dvac03-3b-env-alias-promotion
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an AWS Lambda function named orders that has an alias named prod. In production, the function is invoked by an Amazon API Gateway REST API through a Lambda integration and by an Amazon SQS queue through an event source mapping. To release a new version, the team wants to publish the version and update only the prod alias, without changing the API or the event source mapping.

    Which combination of configurations will meet these requirements? (Choose two.)
  fr: |
    AnyCompany exécute une fonction AWS Lambda nommée orders qui possède un alias nommé prod. En production, la fonction est invoquée par une API REST Amazon API Gateway au moyen d'une intégration Lambda et par une file d'attente Amazon SQS au moyen d'un mappage de source d'événement. Pour livrer une nouvelle version, l'équipe veut publier la version et mettre à jour uniquement l'alias prod, sans modifier l'API ni le mappage de source d'événement.

    Quelle combinaison de configurations répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the function of the API Gateway integration to the unqualified ARN of the orders function.", fr: "Définir comme fonction de l'intégration API Gateway l'ARN non qualifié de la fonction orders." } }
    - { id: b, text: { en: "Set the function of the API Gateway integration to the ARN of the orders:prod alias.", fr: "Définir comme fonction de l'intégration API Gateway l'ARN de l'alias orders:prod." } }
    - { id: c, text: { en: "Create the event source mapping on the ARN of the orders:prod alias.", fr: "Créer le mappage de source d'événement sur l'ARN de l'alias orders:prod." } }
    - { id: d, text: { en: "Create the event source mapping on the ARN of the version that is currently in production.", fr: "Créer le mappage de source d'événement sur l'ARN de la version actuellement en production." } }
    - { id: e, text: { en: "Add a stage variable that contains the production version number and use it in the integration ARN.", fr: "Ajouter une variable d'étape qui contient le numéro de la version de production et l'utiliser dans l'ARN de l'intégration." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "An alias is a pointer that you can move to a new version, and callers that use the alias ARN follow it without any change. When both the API integration and the event source mapping reference orders:prod, publishing a version and running update-alias is the whole release."
    fr: "Un alias est un pointeur que vous pouvez déplacer vers une nouvelle version, et les appelants qui utilisent l'ARN de l'alias le suivent sans aucune modification. Lorsque l'intégration de l'API et le mappage de source d'événement référencent tous deux orders:prod, publier une version et exécuter update-alias suffit pour la livraison."
  options:
    a:
      en: "An unqualified ARN invokes $LATEST, so production would run unpublished code instead of the version that the prod alias points to."
      fr: "Un ARN non qualifié invoque $LATEST : la production exécuterait du code non publié au lieu de la version vers laquelle pointe l'alias prod."
    d:
      en: "A version ARN is fixed, so every release would require changing the event source mapping."
      fr: "Un ARN de version est fixe : chaque livraison exigerait de modifier le mappage de source d'événement."
    e:
      en: "The stage variable would have to be updated for every release, which changes the API configuration."
      fr: "La variable d'étape devrait être mise à jour à chaque livraison, ce qui modifie la configuration de l'API."
references:
  - title: Create an alias for a Lambda Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-aliases.html
  - title: Manage Lambda Event Function versions
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-versions.html
