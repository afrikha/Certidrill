id: dvac03-3b-tevt-shareable-console
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A development team at AnyCompany tests an AWS Lambda function from the Lambda console. One developer has built a detailed JSON test event that reproduces a customer order. Every developer in the same AWS account must be able to see, edit, and run this test event from the console, and the team wants the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une équipe de développement d'AnyCompany teste une fonction AWS Lambda depuis la console Lambda. Un développeur a construit un événement de test JSON détaillé qui reproduit une commande client. Chaque développeur du même compte AWS doit pouvoir voir, modifier et exécuter cet événement de test depuis la console, et l'équipe veut le MOINS d'efforts possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Save the event as a private test event and ask each developer to open it from the function's Test tab.", fr: "Enregistrer l'événement comme événement de test privé et demander à chaque développeur de l'ouvrir depuis l'onglet Test de la fonction." } }
    - { id: b, text: { en: "Store the JSON payload in an AWS Systems Manager Parameter Store parameter and have each developer paste it into a new test event.", fr: "Stocker la charge utile JSON dans un paramètre AWS Systems Manager Parameter Store et demander à chaque développeur de la coller dans un nouvel événement de test." } }
    - { id: c, text: { en: "Save the event as a shareable test event so that Lambda stores it in the EventBridge schema registry for the account.", fr: "Enregistrer l'événement comme événement de test partageable afin que Lambda le stocke dans le registre de schémas EventBridge du compte." } }
    - { id: d, text: { en: "Create an Amazon EventBridge rule that sends the JSON payload to the function on a schedule.", fr: "Créer une règle Amazon EventBridge qui envoie la charge utile JSON à la fonction selon une planification." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A shareable test event is visible to other users of the same AWS account, who can edit it and invoke the function with it. Lambda stores shareable events as schemas in the lambda-testevent-schemas registry of Amazon EventBridge, so users need the corresponding schema registry permissions."
    fr: "Un événement de test partageable est visible par les autres utilisateurs du même compte AWS, qui peuvent le modifier et invoquer la fonction avec. Lambda stocke les événements partageables sous forme de schémas dans le registre lambda-testevent-schemas d'Amazon EventBridge : les utilisateurs ont donc besoin des autorisations correspondantes sur le registre de schémas."
  options:
    a:
      en: "A private test event is available only to the user who created it, so the other developers cannot see it."
      fr: "Un événement de test privé n'est disponible que pour l'utilisateur qui l'a créé : les autres développeurs ne peuvent pas le voir."
    b:
      en: "Each developer would have to copy the payload and maintain a separate test event, which is more effort and lets the copies diverge."
      fr: "Chaque développeur devrait copier la charge utile et gérer son propre événement de test, ce qui demande plus d'efforts et laisse les copies diverger."
    d:
      en: "A scheduled rule invokes the function automatically; it does not give developers a test event they can edit and run from the console."
      fr: "Une règle planifiée invoque la fonction automatiquement ; elle ne donne pas aux développeurs un événement de test qu'ils peuvent modifier et exécuter depuis la console."
references:
  - title: Testing Lambda Event Functions in the console
    url: https://docs.aws.amazon.com/lambda/latest/dg/testing-functions.html
