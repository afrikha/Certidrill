id: dvac03-3a-params-secrets-extension
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Lambda function that handles thousands of requests each minute calls the AWS Secrets Manager GetSecretValue API on every invocation to read an API key for its environment. The calls add latency and cost. The developer wants the value to be cached in each execution environment for up to 5 minutes without writing caching code or adding an SDK caching library.

    Which solution will meet these requirements?
  fr: |
    Une fonction Lambda qui traite des milliers de requêtes par minute appelle l'API GetSecretValue d'AWS Secrets Manager à chaque appel pour lire une clé d'API de son environnement. Ces appels ajoutent de la latence et des coûts. Le développeur veut que la valeur soit mise en cache dans chaque environnement d'exécution pendant 5 minutes au plus, sans écrire de code de mise en cache ni ajouter de bibliothèque de cache du SDK.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Copy the API key into a plaintext environment variable of the function at each deployment.", fr: "Copier la clé d'API dans une variable d'environnement en texte clair de la fonction à chaque déploiement." } }
    - { id: b, text: { en: "Configure provisioned concurrency so that the same execution environments keep the value in memory.", fr: "Configurer la simultanéité provisionnée pour que les mêmes environnements d'exécution gardent la valeur en mémoire." } }
    - { id: c, text: { en: "Add the AWS Parameters and Secrets Lambda Extension layer and request the secret from its local HTTP endpoint on port 2773.", fr: "Ajouter la couche AWS Parameters and Secrets Lambda Extension et demander le secret à son point de terminaison HTTP local sur le port 2773." } }
    - { id: d, text: { en: "Write the secret to /tmp on the first invocation and read the file on later invocations of the environment.", fr: "Écrire le secret dans /tmp lors du premier appel et lire le fichier lors des appels suivants de l'environnement." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS Parameters and Secrets Lambda Extension retrieves and caches Secrets Manager secrets and Parameter Store parameters without the SDK. The function sends a GET request to localhost on port 2773 with the X-Aws-Parameters-Secrets-Token header set to its session token, and SECRETS_MANAGER_TTL defaults to 300 seconds."
    fr: "L'extension AWS Parameters and Secrets Lambda Extension récupère et met en cache les secrets Secrets Manager et les paramètres Parameter Store sans le SDK. La fonction envoie une requête GET à localhost sur le port 2773 avec l'en-tête X-Aws-Parameters-Secrets-Token défini sur son jeton de session, et SECRETS_MANAGER_TTL vaut 300 secondes par défaut."
  options:
    a:
      en: "A plaintext copy of the secret in the configuration exposes it and goes stale when the secret changes."
      fr: "Une copie en texte clair du secret dans la configuration l'expose et devient obsolète quand le secret change."
    b:
      en: "Provisioned concurrency keeps environments initialized, but the code still calls GetSecretValue on every invocation unless caching is added."
      fr: "La simultanéité provisionnée garde des environnements initialisés, mais le code appelle toujours GetSecretValue à chaque appel si aucune mise en cache n'est ajoutée."
    d:
      en: "This is caching code that the developer must write, with an expiry to manage, and it leaves the secret in plaintext on disk."
      fr: "C'est du code de mise en cache que le développeur doit écrire, avec une expiration à gérer, et il laisse le secret en texte clair sur le disque."
references:
  - title: Using Parameter Store parameters in AWS Lambda functions
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/ps-integration-lambda-extensions.html
  - title: Use AWS Secrets Manager secrets in AWS Lambda functions
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/retrieving-secrets_lambda.html
