id: dvac03-3a-cdk-snapshot-refactor
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team is refactoring a large AWS CDK app in TypeScript: it moves resources into reusable constructs without intending to change the deployed infrastructure. The team wants its Jest tests to fail immediately if the refactoring changes anything at all in the synthesized AWS CloudFormation template.

    Which type of test will meet these requirements?
  fr: |
    Une équipe refactorise une grande application AWS CDK en TypeScript : elle déplace des ressources dans des constructions réutilisables sans vouloir modifier l'infrastructure déployée. L'équipe veut que ses tests Jest échouent immédiatement si la refactorisation modifie quoi que ce soit dans le modèle AWS CloudFormation synthétisé.

    Quel type de test répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A snapshot test that compares the synthesized template with a stored baseline template.", fr: "Un test d'instantané qui compare le modèle synthétisé à un modèle de référence stocké." } }
    - { id: b, text: { en: "Fine-grained assertions with hasResourceProperties on the most important resources.", fr: "Des assertions détaillées avec hasResourceProperties sur les ressources les plus importantes." } }
    - { id: c, text: { en: "A test that calls resourceCountIs for each resource type of the stack.", fr: "Un test qui appelle resourceCountIs pour chaque type de ressource de la pile." } }
    - { id: d, text: { en: "A test that runs cdk synth and passes when the command exits without an error.", fr: "Un test qui exécute cdk synth et réussit lorsque la commande se termine sans erreur." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A snapshot test compares the synthesized template with a previously stored baseline, so any difference makes it fail. AWS describes snapshot tests as most useful for refactoring, where an unintended template change must be noticed at once."
    fr: "Un test d'instantané compare le modèle synthétisé à une référence stockée précédemment : toute différence le fait échouer. AWS présente les tests d'instantané comme particulièrement utiles pour la refactorisation, où une modification involontaire du modèle doit être remarquée immédiatement."
  options:
    b:
      en: "hasResourceProperties checks only the listed properties and ignores the others, so many changes would pass."
      fr: "hasResourceProperties vérifie seulement les propriétés listées et ignore les autres : beaucoup de modifications passeraient."
    c:
      en: "Counting resources misses any change to their properties."
      fr: "Compter les ressources ne détecte aucune modification de leurs propriétés."
    d:
      en: "A successful synthesis only proves that the app runs; it does not compare the result with anything."
      fr: "Une synthèse réussie prouve seulement que l'application s'exécute ; elle ne compare le résultat à rien."
references:
  - title: Testing AWS CDK applications
    url: https://docs.aws.amazon.com/cdk/v2/guide/testing.html
