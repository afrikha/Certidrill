id: dvac03-3a-redeploy-stage
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer adds a new `GET /reports` method with a Lambda integration to an existing Amazon API Gateway REST API in the console. Clients that call `https://a1b2c3d4e5.execute-api.us-east-2.amazonaws.com/prod/reports` receive an error, while the existing methods of the prod stage still work.

    What should the developer do so that clients can call the new method?
  fr: |
    Un développeur ajoute dans la console une nouvelle méthode `GET /reports` avec une intégration Lambda à une API REST Amazon API Gateway existante. Les clients qui appellent `https://a1b2c3d4e5.execute-api.us-east-2.amazonaws.com/prod/reports` reçoivent une erreur, alors que les méthodes existantes de l'étape prod fonctionnent toujours.

    Que doit faire le développeur pour que les clients puissent appeler la nouvelle méthode ?
body:
  options:
    - { id: a, text: { en: "Flush the cache of the prod stage so that clients stop receiving cached responses.", fr: "Vider le cache de l'étape prod pour que les clients ne reçoivent plus de réponses mises en cache." } }
    - { id: b, text: { en: "Enable CORS on the /reports resource so that API Gateway accepts the requests.", fr: "Activer CORS sur la ressource /reports pour qu'API Gateway accepte les requêtes." } }
    - { id: c, text: { en: "Create a new deployment of the API to the prod stage.", fr: "Créer un nouveau déploiement de l'API vers l'étape prod." } }
    - { id: d, text: { en: "Add a stage variable named reports to the prod stage.", fr: "Ajouter une variable d'étape nommée reports à l'étape prod." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A stage serves a snapshot of the API taken at deployment time. Every time a REST API is updated, including new methods, integrations or authorizers, it must be redeployed to a stage for the change to reach that stage's URL."
    fr: "Une étape sert un instantané de l'API pris au moment du déploiement. Chaque fois qu'une API REST est modifiée, notamment par de nouvelles méthodes, intégrations ou mécanismes d'autorisation, elle doit être redéployée vers une étape pour que la modification atteigne l'URL de cette étape."
  options:
    a:
      en: "The method does not exist in the deployed snapshot yet, so there is no cached response to flush."
      fr: "La méthode n'existe pas encore dans l'instantané déployé : il n'y a aucune réponse en cache à vider."
    b:
      en: "CORS affects browser cross-origin calls; the method is missing from the prod stage for all clients."
      fr: "CORS concerne les appels inter-origines des navigateurs ; la méthode est absente de l'étape prod pour tous les clients."
    d:
      en: "Stage variables pass values to the deployed API; they do not add undeployed methods to the stage."
      fr: "Les variables d'étape transmettent des valeurs à l'API déployée ; elles n'ajoutent pas à l'étape des méthodes non déployées."
references:
  - title: Deploy REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-deploy-api.html
