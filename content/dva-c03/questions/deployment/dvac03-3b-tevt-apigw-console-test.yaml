id: dvac03-3b-tevt-apigw-console-test
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at AnyCompany changed the integration of the GET /products/{id} method of an Amazon API Gateway REST API. Before clients use it, the developer wants to send one request with a chosen path parameter and query string, and see the status code, response body, headers, latency, and execution log entries for that single call. The developer wants the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany a modifié l'intégration de la méthode GET /products/{id} d'une API REST Amazon API Gateway. Avant que les clients ne l'utilisent, le développeur veut envoyer une requête avec un paramètre de chemin et une chaîne de requête choisis, et voir le code d'état, le corps de la réponse, les en-têtes, la latence et les entrées du journal d'exécution de cet appel. Le développeur veut le MOINS d'efforts possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on access logging for the stage, call the method with curl, and search the access log group in CloudWatch Logs.", fr: "Activer la journalisation des accès pour l'étape, appeler la méthode avec curl et rechercher dans le groupe de journaux d'accès de CloudWatch Logs." } }
    - { id: b, text: { en: "Open the method in the API Gateway console, enter the path parameter and query string on the Test tab, and choose Test.", fr: "Ouvrir la méthode dans la console API Gateway, saisir le paramètre de chemin et la chaîne de requête dans l'onglet Test, puis choisir Test." } }
    - { id: c, text: { en: "Turn on AWS X-Ray active tracing for the stage and inspect the trace map after calling the method.", fr: "Activer le suivi actif AWS X-Ray pour l'étape et examiner la carte de suivi après avoir appelé la méthode." } }
    - { id: d, text: { en: "Generate an SDK for the stage, write a client program that calls the method, and print the response.", fr: "Générer un SDK pour l'étape, écrire un programme client qui appelle la méthode et afficher la réponse." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Test tab of a REST API method lets you enter path parameters, query strings, headers, and a body, and then shows the status, response body and headers, latency, and log entries for the call. The test calls the real integration, so any changes it makes in the backend are real."
    fr: "L'onglet Test d'une méthode d'API REST permet de saisir des paramètres de chemin, des chaînes de requête, des en-têtes et un corps, puis affiche l'état, le corps et les en-têtes de la réponse, la latence et les entrées de journal de l'appel. Le test appelle la véritable intégration : toute modification qu'il effectue dans le backend est réelle."
  options:
    a:
      en: "Access logs record one line per request in the format you define; they need setup and do not show the integration's execution details as the Test tab does."
      fr: "Les journaux d'accès enregistrent une ligne par requête au format que vous définissez ; ils demandent une configuration et ne montrent pas les détails d'exécution de l'intégration comme l'onglet Test."
    c:
      en: "X-Ray shows latency segments across services, not the response body, headers, and execution log of a single test request, and it needs extra setup."
      fr: "X-Ray montre des segments de latence entre services, pas le corps, les en-têtes et le journal d'exécution d'une requête de test, et il demande une configuration supplémentaire."
    d:
      en: "Writing a client program is far more effort and does not return the execution log entries."
      fr: "Écrire un programme client demande beaucoup plus d'efforts et ne renvoie pas les entrées du journal d'exécution."
references:
  - title: Use the API Gateway console to test a REST API method
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-test-method.html
