id: dvac03-3c-trigger-release-tags
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A development team stores an application in a GitHub repository. An AWS CodePipeline V2 pipeline uses a source action with an AWS CodeConnections connection to the repository and starts on every push to the `main` branch. The team wants the pipeline to start only when a release tag that begins with `v` (for example, `v2.4.0`) is pushed to the repository.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une équipe de développement stocke une application dans un référentiel GitHub. Un pipeline AWS CodePipeline V2 utilise une action source avec une connexion AWS CodeConnections au référentiel et démarre à chaque push sur la branche `main`. L'équipe veut que le pipeline démarre uniquement lorsqu'une balise de version commençant par `v` (par exemple `v2.4.0`) est poussée dans le référentiel.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Set the BranchName parameter of the source action to `refs/tags/v*` so that the action watches release tags.", fr: "Définir le paramètre BranchName de l'action source sur `refs/tags/v*` afin que l'action surveille les balises de version." }
    - id: b
      text: { en: "Add a push trigger to the pipeline with a tags filter that includes the `v*` pattern.", fr: "Ajouter au pipeline un déclencheur de type push avec un filtre de balises qui inclut le modèle `v*`." }
    - id: c
      text: { en: "Define a pipeline-level variable with the default value `v*` and reference it in the source action configuration.", fr: "Définir une variable de niveau pipeline avec la valeur par défaut `v*` et la référencer dans la configuration de l'action source." }
    - id: d
      text: { en: "Add a CodeBuild action at the start of the pipeline that stops the execution when the commit has no `v` tag.", fr: "Ajouter au début du pipeline une action CodeBuild qui arrête l'exécution lorsque le commit n'a pas de balise `v`." }
answer: { optionId: b }
explanation:
  correct:
    en: "V2 pipelines with a CodeConnections source support triggers whose push filters can match Git tags with glob patterns. With a filter in place, the pipeline no longer starts on every change: only a pushed tag that matches `v*` starts an execution, and no code is needed."
    fr: "Les pipelines V2 dont la source passe par CodeConnections prennent en charge des déclencheurs dont les filtres push peuvent cibler des balises Git avec des modèles glob. Dès qu'un filtre est défini, le pipeline ne démarre plus à chaque modification : seule une balise poussée correspondant à `v*` lance une exécution, sans aucun code."
  options:
    a:
      en: "BranchName names a branch to watch; when triggers are configured it is only used for manual starts, and it does not filter on tags."
      fr: "BranchName désigne une branche à surveiller ; lorsque des déclencheurs sont configurés, il ne sert qu'aux démarrages manuels et ne filtre pas sur les balises."
    c:
      en: "Pipeline-level variables cannot be used in source actions, and variables do not decide which events start the pipeline."
      fr: "Les variables de niveau pipeline ne peuvent pas être utilisées dans les actions source, et les variables ne déterminent pas quels événements démarrent le pipeline."
    d:
      en: "The pipeline would still start on every push, and the custom check adds code and build time to maintain."
      fr: "Le pipeline démarrerait toujours à chaque push, et la vérification personnalisée ajoute du code et du temps de build à maintenir."
references:
  - title: Add trigger with code push or pull request event types
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-filter.html
  - title: What type of pipeline is right for me?
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipeline-types-planning.html
