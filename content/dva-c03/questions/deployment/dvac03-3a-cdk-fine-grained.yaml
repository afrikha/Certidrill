id: dvac03-3a-cdk-fine-grained
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team writes an AWS CDK app in Python. A stack creates a Lambda function that must always have a 30-second timeout and the python3.12 runtime. The team wants a pytest unit test that fails if either property changes. The test must not fail when other properties of the template change, for example after a CDK upgrade.

    Which test code will meet these requirements?
  fr: |
    Une équipe écrit une application AWS CDK en Python. Une pile crée une fonction Lambda qui doit toujours avoir un délai d'expiration de 30 secondes et l'environnement d'exécution python3.12. L'équipe veut un test unitaire pytest qui échoue si l'une de ces propriétés change. Le test ne doit pas échouer lorsque d'autres propriétés du modèle changent, par exemple après une mise à niveau du CDK.

    Quel code de test répond à ces exigences ?
body:
  options:
    - { id: a, text: "assert Template.from_stack(stack).to_json() == snapshot" }
    - { id: b, text: "Template.from_stack(stack).has_resource_properties(\"AWS::Lambda::Function\", {\"Timeout\": 30, \"Runtime\": \"python3.12\"})" }
    - { id: c, text: "Template.from_stack(stack).resource_count_is(\"AWS::Lambda::Function\", 1)" }
    - { id: d, text: "subprocess.run([\"cdk\", \"diff\"], check=True)" }
answer: { optionId: b }
explanation:
  correct:
    en: "This is a fine-grained assertion from the aws_cdk.assertions module. has_resource_properties requires that the listed properties exist with the given values but ignores the other properties of the resource, so only a change of Timeout or Runtime makes the test fail."
    fr: "Il s'agit d'une assertion détaillée (fine-grained) du module aws_cdk.assertions. has_resource_properties exige que les propriétés listées existent avec les valeurs indiquées mais ignore les autres propriétés de la ressource : seule une modification de Timeout ou de Runtime fait échouer le test."
  options:
    a:
      en: "A snapshot test compares the whole synthesized template, so any change, including one caused by a CDK upgrade, makes it fail."
      fr: "Un test d'instantané compare tout le modèle synthétisé : toute modification, y compris celle causée par une mise à niveau du CDK, le fait échouer."
    c:
      en: "This checks only how many functions the stack contains, not their timeout or runtime."
      fr: "Cela vérifie seulement le nombre de fonctions de la pile, pas leur délai d'expiration ni leur environnement d'exécution."
    d:
      en: "cdk diff compares the app with a deployed stack and needs AWS access; it is not an assertion on specific properties."
      fr: "cdk diff compare l'application avec une pile déployée et nécessite un accès à AWS ; ce n'est pas une assertion sur des propriétés précises."
references:
  - title: Testing AWS CDK applications
    url: https://docs.aws.amazon.com/cdk/v2/guide/testing.html
