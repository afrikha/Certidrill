id: dvac03-3a-pip-target-root
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at AnyCompany writes a Python Lambda function that imports the `requests` library. The developer zips only `lambda_function.py` and uploads the .zip file. Every invocation fails with an error that says the `requests` module cannot be found. The function must keep using a .zip deployment package.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany écrit une fonction Lambda Python qui importe la bibliothèque `requests`. Il compresse uniquement `lambda_function.py` et charge le fichier .zip. Chaque appel échoue avec une erreur indiquant que le module `requests` est introuvable. La fonction doit continuer à utiliser un package de déploiement .zip.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a requirements.txt file that lists requests to the .zip file so that Lambda installs the library when the execution environment starts.", fr: "Ajouter au fichier .zip un fichier requirements.txt qui liste requests pour que Lambda installe la bibliothèque au démarrage de l'environnement d'exécution." } }
    - { id: b, text: { en: "Increase the ephemeral storage of the function so that the runtime can download the library into /tmp on the first invocation.", fr: "Augmenter le stockage éphémère de la fonction pour que l'environnement d'exécution puisse télécharger la bibliothèque dans /tmp lors du premier appel." } }
    - { id: c, text: { en: "Run pip install --target ./package requests, then zip the contents of the package directory and lambda_function.py at the root of the .zip file.", fr: "Exécuter pip install --target ./package requests, puis compresser le contenu du répertoire package et lambda_function.py à la racine du fichier .zip." } }
    - { id: d, text: { en: "Run pip install --target ./package requests, then zip the package directory itself so that the library is stored in a package/ folder.", fr: "Exécuter pip install --target ./package requests, puis compresser le répertoire package lui-même pour que la bibliothèque soit stockée dans un dossier package/." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Lambda does not install dependencies for a .zip package: the libraries must be inside the package. The documented method installs them with pip install --target into a local directory, then zips that directory's contents with the handler file so that everything sits at the root of the .zip file, where the Python runtime finds it."
    fr: "Lambda n'installe pas les dépendances d'un package .zip : les bibliothèques doivent se trouver dans le package. La méthode documentée les installe avec pip install --target dans un répertoire local, puis compresse le contenu de ce répertoire avec le fichier du gestionnaire pour que tout se trouve à la racine du fichier .zip, où l'environnement d'exécution Python le trouve."
  options:
    a:
      en: "Lambda ignores a requirements.txt file in a .zip package; installing from requirements.txt at deployment is an Elastic Beanstalk behavior, not a Lambda one."
      fr: "Lambda ignore un fichier requirements.txt dans un package .zip ; l'installation depuis requirements.txt au déploiement est un comportement d'Elastic Beanstalk, pas de Lambda."
    b:
      en: "Ephemeral storage only adds space in /tmp; the runtime never downloads missing libraries by itself."
      fr: "Le stockage éphémère ajoute seulement de l'espace dans /tmp ; l'environnement d'exécution ne télécharge jamais lui-même les bibliothèques manquantes."
    d:
      en: "The dependencies must be at the root of the .zip file; a package/ subfolder is not on the Python import path, so the import still fails."
      fr: "Les dépendances doivent se trouver à la racine du fichier .zip ; un sous-dossier package/ ne fait pas partie du chemin d'importation Python, et l'importation échoue toujours."
references:
  - title: Working with .zip file archives for Python Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/python-package.html
