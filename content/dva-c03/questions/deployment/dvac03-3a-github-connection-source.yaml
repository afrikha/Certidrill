id: dvac03-3a-github-connection-source
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany keeps the code of an application in a GitHub repository that belongs to the company's GitHub organization. A developer is creating an AWS CodePipeline pipeline that must start automatically when code is pushed to the repository. The security team does not allow personal access tokens to be stored in AWS.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany conserve le code d'une application dans un référentiel GitHub qui appartient à l'organisation GitHub de l'entreprise. Un développeur crée un pipeline AWS CodePipeline qui doit démarrer automatiquement lorsque du code est transféré (push) vers le référentiel. L'équipe de sécurité n'autorise pas le stockage de jetons d'accès personnels dans AWS.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Mirror the GitHub repository to an AWS CodeCommit repository with a scheduled job and use CodeCommit as the source action.", fr: "Mettre en miroir le référentiel GitHub dans un référentiel AWS CodeCommit avec un job planifié et utiliser CodeCommit comme action source." } }
    - { id: b, text: { en: "Create a connection with AWS CodeConnections by installing the GitHub App, and use it in a CodeStarSourceConnection source action.", fr: "Créer une connexion avec AWS CodeConnections en installant l'application GitHub, et l'utiliser dans une action source CodeStarSourceConnection." } }
    - { id: c, text: { en: "Store a personal access token in AWS Secrets Manager and have a CodeBuild webhook copy the source to Amazon S3 for the pipeline.", fr: "Stocker un jeton d'accès personnel dans AWS Secrets Manager et faire copier la source vers Amazon S3 par un webhook CodeBuild pour le pipeline." } }
    - { id: d, text: { en: "Have a GitHub Actions workflow upload a .zip file of the code to Amazon S3 and use an S3 source action in the pipeline.", fr: "Faire charger par un workflow GitHub Actions un fichier .zip du code dans Amazon S3 et utiliser une action source S3 dans le pipeline." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A connection authorizes CodePipeline through the AWS Connector for GitHub app instead of a stored token. The CodeStarSourceConnection action (GitHub via GitHub App in the console) starts the pipeline on code pushes by default, with no copy job to maintain."
    fr: "Une connexion autorise CodePipeline par l'application AWS Connector for GitHub au lieu d'un jeton stocké. L'action CodeStarSourceConnection (GitHub via GitHub App dans la console) démarre le pipeline à chaque transfert de code par défaut, sans job de copie à maintenir."
  options:
    a:
      en: "A mirroring job must be built, scheduled and maintained, and it needs credentials for GitHub; it also delays the start of the pipeline."
      fr: "Un job de mise en miroir doit être créé, planifié et maintenu, et il a besoin d'informations d'identification pour GitHub ; il retarde aussi le démarrage du pipeline."
    c:
      en: "This stores a personal access token in AWS, which the security team forbids, and adds an extra copy step."
      fr: "Cette solution stocke un jeton d'accès personnel dans AWS, ce que l'équipe de sécurité interdit, et ajoute une étape de copie."
    d:
      en: "The workflow needs AWS credentials in GitHub and an extra upload step to maintain, which is more overhead than a connection."
      fr: "Le workflow a besoin d'informations d'identification AWS dans GitHub et d'une étape de chargement à maintenir, ce qui représente plus de charge qu'une connexion."
references:
  - title: GitHub connections
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/connections-github.html
