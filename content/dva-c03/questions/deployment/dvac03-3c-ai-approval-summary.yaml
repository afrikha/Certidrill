id: dvac03-3c-ai-approval-summary
objective: "3.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's AWS CodePipeline pipeline has a manual approval action before the production stage, and the action publishes to an Amazon SNS topic. Reviewers spend a long time reading code diffs. The company wants every approval request to come with an AI-generated summary of the changes and their possible impact. A human must still approve every production deployment.

    Which solution will meet these requirements?
  fr: |
    Le pipeline AWS CodePipeline d'AnyCompany comporte une action d'approbation manuelle avant l'étape de production, et cette action publie dans une rubrique Amazon SNS. Les réviseurs passent beaucoup de temps à lire les différences de code. L'entreprise veut que chaque demande d'approbation soit accompagnée d'un résumé des modifications et de leur impact possible, généré par IA. Un humain doit toujours approuver chaque déploiement en production.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Subscribe a Lambda function to the topic that gets the diff, asks an Amazon Bedrock model to summarize it with the Converse API, and sends the summary to the reviewers.", fr: "Abonner à la rubrique une fonction Lambda qui récupère les différences, demande à un modèle Amazon Bedrock de les résumer avec l'API Converse et envoie le résumé aux réviseurs." }
    - id: b
      text: { en: "Subscribe a Lambda function to the topic that asks an Amazon Bedrock model to rate the risk and calls PutApprovalResult with Approved for low-risk changes.", fr: "Abonner à la rubrique une fonction Lambda qui demande à un modèle Amazon Bedrock d'évaluer le risque et appelle PutApprovalResult avec Approved pour les modifications à faible risque." }
    - id: c
      text: { en: "Ask each reviewer to install the Amazon Q Developer IDE plugin and to request a summary of the diff before approving the action.", fr: "Demander à chaque réviseur d'installer le plug-in d'IDE Amazon Q Developer et de demander un résumé des différences avant d'approuver l'action." }
    - id: d
      text: { en: "Replace the approval action with a beforeEntry condition whose LambdaInvoke rule asks an Amazon Bedrock model to rate the risk of the changes.", fr: "Remplacer l'action d'approbation par une condition beforeEntry dont la règle LambdaInvoke demande à un modèle Amazon Bedrock d'évaluer le risque des modifications." }
answer: { optionId: a }
explanation:
  correct:
    en: "The approval action publishes a JSON notification to SNS, which can invoke a Lambda function. The function can send the diff to a Bedrock model with the Converse API and deliver the summary to the reviewers, who still approve or reject the action themselves, so the AI supports the decision without making it."
    fr: "L'action d'approbation publie une notification JSON dans SNS, qui peut appeler une fonction Lambda. La fonction peut envoyer les différences à un modèle Bedrock avec l'API Converse et transmettre le résumé aux réviseurs, qui approuvent ou rejettent toujours eux-mêmes l'action : l'IA aide à la décision sans la prendre."
  options:
    b:
      en: "The function would approve production deployments itself, which removes the required human approval."
      fr: "La fonction approuverait elle-même des déploiements en production, ce qui supprime l'approbation humaine exigée."
    c:
      en: "The summary is not attached to the approval requests, and Amazon Q Developer no longer accepts new sign-ups (Kiro is its successor)."
      fr: "Le résumé n'est pas joint aux demandes d'approbation, et Amazon Q Developer n'accepte plus de nouvelles inscriptions (Kiro lui succède)."
    d:
      en: "Removing the approval action removes the human decision; the condition decides automatically whether the stage runs."
      fr: "Supprimer l'action d'approbation supprime la décision humaine ; la condition décide automatiquement si l'étape s'exécute."
references:
  - title: Add a manual approval action to a stage
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
  - title: Inference using Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
