id: dvac03-3b-aitest-kiro-headless-ci
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany wants its CI pipeline to run the Kiro CLI on every pull request to generate missing regression tests and run them. The step runs without a terminal. The Kiro agent needs only to read files, write files under tests/, and run the test command. The team wants the MOST secure configuration.

    Which solution will meet these requirements?
  fr: |
    AnyCompany veut que son pipeline CI exécute la CLI Kiro sur chaque pull request pour générer les tests de régression manquants et les exécuter. L'étape s'exécute sans terminal. L'agent Kiro doit seulement lire des fichiers, écrire des fichiers sous tests/ et exécuter la commande de test. L'équipe veut la configuration la PLUS sécurisée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run kiro-cli chat --no-interactive with --trust-all-tools, and read the KIRO_API_KEY value from a CI secret.", fr: "Exécuter kiro-cli chat --no-interactive avec --trust-all-tools, et lire la valeur de KIRO_API_KEY depuis un secret de CI." } }
    - { id: b, text: { en: "Run kiro-cli chat --no-interactive with --trust-tools limited to the required tools, and commit the KIRO_API_KEY value in the pipeline configuration file.", fr: "Exécuter kiro-cli chat --no-interactive avec --trust-tools limité aux outils nécessaires, et valider la valeur de KIRO_API_KEY dans le fichier de configuration du pipeline." } }
    - { id: c, text: { en: "Run kiro-cli chat --no-interactive with --trust-tools limited to the required tools, and read the KIRO_API_KEY value from a CI secret.", fr: "Exécuter kiro-cli chat --no-interactive avec --trust-tools limité aux outils nécessaires, et lire la valeur de KIRO_API_KEY depuis un secret de CI." } }
    - { id: d, text: { en: "Start an interactive kiro-cli session in the build container and approve each tool call from the build log.", fr: "Démarrer une session kiro-cli interactive dans le conteneur de build et approuver chaque appel d'outil depuis le journal de build." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Headless mode runs a prompt with kiro-cli chat --no-interactive and authenticates with an API key in the KIRO_API_KEY environment variable, which should come from a secret and never be committed. Kiro recommends --trust-tools with specific tool IDs instead of --trust-all-tools so that the agent can use only the tools the job needs."
    fr: "Le mode sans interface (headless) exécute un prompt avec kiro-cli chat --no-interactive et s'authentifie avec une clé d'API dans la variable d'environnement KIRO_API_KEY, qui doit provenir d'un secret et ne jamais être validée dans le référentiel. Kiro recommande --trust-tools avec des ID d'outils précis plutôt que --trust-all-tools, afin que l'agent n'utilise que les outils nécessaires à la tâche."
  options:
    a:
      en: "--trust-all-tools approves every tool call for the session, which grants the agent more than the job needs."
      fr: "--trust-all-tools approuve tous les appels d'outils de la session, ce qui accorde à l'agent plus que ce dont la tâche a besoin."
    b:
      en: "A committed API key can be read by anyone with access to the repository; the key must be stored as a secret."
      fr: "Une clé d'API validée dans le référentiel peut être lue par toute personne qui y a accès ; la clé doit être stockée comme secret."
    d:
      en: "A CI step has no terminal to answer approval prompts, so an interactive session cannot run unattended."
      fr: "Une étape de CI n'a pas de terminal pour répondre aux demandes d'approbation : une session interactive ne peut pas s'exécuter sans surveillance."
references:
  - title: Headless mode - CLI - Docs - Kiro
    url: https://kiro.dev/docs/cli/headless/
