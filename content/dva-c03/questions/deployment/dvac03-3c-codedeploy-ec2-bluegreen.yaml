id: dvac03-3c-codedeploy-ec2-bluegreen
objective: "3.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application runs on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. AWS CodeDeploy deploys it in place with CodeDeployDefault.OneAtATime, and a failed deployment leaves instances on mixed versions. The new version must be installed on new instances before they receive traffic. The previous version must stay available on the original instances for 1 hour after traffic moves, and instances that are no longer needed must not keep running after that.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une application s'exécute sur des instances Amazon EC2 d'un groupe Auto Scaling derrière un Application Load Balancer. AWS CodeDeploy la déploie sur place avec CodeDeployDefault.OneAtATime, et un déploiement en échec laisse les instances sur des versions mélangées. La nouvelle version doit être installée sur de nouvelles instances avant qu'elles ne reçoivent du trafic. La version précédente doit rester disponible sur les instances d'origine pendant 1 heure après le transfert du trafic, et les instances devenues inutiles ne doivent plus s'exécuter ensuite.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Keep the in-place deployment type and change the deployment configuration to CodeDeployDefault.HalfAtATime.", fr: "Conserver le type de déploiement sur place et passer la configuration de déploiement à CodeDeployDefault.HalfAtATime." }
    - id: b
      text: { en: "Use a blue/green deployment group that copies the Auto Scaling group and terminates the original instances 60 minutes after traffic is rerouted.", fr: "Utiliser un groupe de déploiement bleu/vert qui copie le groupe Auto Scaling et arrête les instances d'origine 60 minutes après le réacheminement du trafic." }
    - id: c
      text: { en: "Use a blue/green deployment group that copies the Auto Scaling group and keeps the original instances running after traffic is rerouted.", fr: "Utiliser un groupe de déploiement bleu/vert qui copie le groupe Auto Scaling et laisse les instances d'origine s'exécuter après le réacheminement du trafic." }
    - id: d
      text: { en: "Keep the in-place deployment type and enable automatic rollback when a deployment fails.", fr: "Conserver le type de déploiement sur place et activer la restauration automatique en cas d'échec du déploiement." }
answer: { optionId: b }
explanation:
  correct:
    en: "An EC2 blue/green deployment provisions replacement instances (here by copying the Auto Scaling group), installs the revision on them and only then reroutes load balancer traffic to them. The original instances are deregistered and, with the terminate option, are terminated after the wait time you set, so they stay available for 1 hour and then stop costing money."
    fr: "Un déploiement bleu/vert EC2 provisionne des instances de remplacement (ici en copiant le groupe Auto Scaling), y installe la révision, puis seulement réachemine vers elles le trafic de l'équilibreur de charge. Les instances d'origine sont désenregistrées et, avec l'option d'arrêt, sont arrêtées après le délai d'attente défini : elles restent disponibles 1 heure puis ne coûtent plus rien."
  options:
    a:
      en: "In-place deployments still install the new version on the instances that serve traffic, half of them at a time."
      fr: "Les déploiements sur place installent toujours la nouvelle version sur les instances qui servent le trafic, la moitié à la fois."
    c:
      en: "This meets the availability requirement, but the original instances keep running and generating cost after the hour."
      fr: "Cette solution répond à l'exigence de disponibilité, mais les instances d'origine continuent de s'exécuter et de coûter après l'heure."
    d:
      en: "A rollback redeploys the last good revision onto the same instances; the new version is still installed on instances that serve traffic."
      fr: "Une restauration redéploie la dernière bonne révision sur les mêmes instances ; la nouvelle version est toujours installée sur des instances qui servent le trafic."
references:
  - title: CodeDeploy primary components
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/primary-components.html
  - title: Create a deployment group for an EC2/On-Premises blue/green deployment (console)
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-groups-create-blue-green.html
