id: dvac03-3b-cd-asg-scale-out
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an application on Amazon EC2 instances in an Auto Scaling group. The launch template uses a custom AMI that already includes the CodeDeploy agent and tags each instance with App=shop. The AWS CodeDeploy deployment group targets the tag App=shop. Instances launched by scale-out events start without the application until someone runs a new deployment. New instances must receive the deployed revision automatically, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application sur des instances Amazon EC2 d'un groupe Auto Scaling. Le modèle de lancement utilise une AMI personnalisée qui inclut déjà l'agent CodeDeploy et balise chaque instance avec App=shop. Le groupe de déploiement AWS CodeDeploy cible la balise App=shop. Les instances lancées par des événements de montée en charge démarrent sans l'application tant que personne n'exécute un nouveau déploiement. Les nouvelles instances doivent recevoir automatiquement la révision déployée, avec le MOINS d'efforts possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon EventBridge rule for instance launch events that invokes a Lambda function to call create-deployment.", fr: "Créer une règle Amazon EventBridge pour les événements de lancement d'instance qui invoque une fonction Lambda appelant create-deployment." } }
    - { id: b, text: { en: "Add user data to the launch template that downloads the latest bundle from Amazon S3 and starts the application.", fr: "Ajouter au modèle de lancement des données utilisateur qui téléchargent le dernier bundle depuis Amazon S3 et démarrent l'application." } }
    - { id: c, text: { en: "Change the deployment configuration of the deployment group to CodeDeployDefault.AllAtOnce.", fr: "Remplacer la configuration de déploiement du groupe de déploiement par CodeDeployDefault.AllAtOnce." } }
    - { id: d, text: { en: "Update the deployment group to target the Auto Scaling group instead of the EC2 tag.", fr: "Mettre à jour le groupe de déploiement pour qu'il cible le groupe Auto Scaling au lieu de la balise EC2." } }
answer: { optionId: d }
explanation:
  correct:
    en: "When a deployment group includes an Auto Scaling group, CodeDeploy installs Auto Scaling lifecycle hooks in it. The launch hook is always enabled, so each instance launched by a scale-out receives the application revision that was last deployed to the group, provided the CodeDeploy agent is on the AMI."
    fr: "Lorsqu'un groupe de déploiement inclut un groupe Auto Scaling, CodeDeploy y installe des hooks de cycle de vie Auto Scaling. Le hook de lancement est toujours activé : chaque instance lancée par une montée en charge reçoit la révision d'application déployée en dernier dans le groupe, à condition que l'agent CodeDeploy soit présent dans l'AMI."
  options:
    a:
      en: "This works but requires custom code and permissions, which is more effort than the built-in Auto Scaling integration."
      fr: "Cela fonctionne, mais exige du code et des autorisations personnalisés, ce qui demande plus d'efforts que l'intégration Auto Scaling intégrée."
    b:
      en: "User data bypasses CodeDeploy, so the lifecycle hooks do not run and the deployed revision can differ from what CodeDeploy tracks."
      fr: "Les données utilisateur contournent CodeDeploy : les hooks de cycle de vie ne s'exécutent pas et la révision déployée peut différer de celle que suit CodeDeploy."
    c:
      en: "The deployment configuration controls how many instances are updated during a deployment; it does not start deployments to new instances."
      fr: "La configuration de déploiement détermine combien d'instances sont mises à jour pendant un déploiement ; elle ne lance pas de déploiement vers les nouvelles instances."
references:
  - title: Integrating CodeDeploy with Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/integrations-aws-auto-scaling.html
