id: dvac03-3b-iac-sam-transform
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at AnyCompany writes a template that defines an AWS::Serverless::Function and an AWS::Serverless::SimpleTable, and deploys it with aws cloudformation deploy. CloudFormation rejects the template because the resource types are not recognized.

    ```yaml
    AWSTemplateFormatVersion: "2010-09-09"
    Resources:
      ApiFunction:
        Type: AWS::Serverless::Function
        Properties:
          Runtime: python3.12
          Handler: app.handler
          CodeUri: s3://example-artifacts/api.zip
    ```

    Which change will fix the template?
  fr: |
    Un développeur d'AnyCompany écrit un modèle qui définit une AWS::Serverless::Function et une AWS::Serverless::SimpleTable, et le déploie avec aws cloudformation deploy. CloudFormation rejette le modèle parce que les types de ressources ne sont pas reconnus.

    ```yaml
    AWSTemplateFormatVersion: "2010-09-09"
    Resources:
      ApiFunction:
        Type: AWS::Serverless::Function
        Properties:
          Runtime: python3.12
          Handler: app.handler
          CodeUri: s3://example-artifacts/api.zip
    ```

    Quelle modification corrige le modèle ?
body:
  options:
    - { id: a, text: { en: "Change AWSTemplateFormatVersion to 2016-10-31 in the template.", fr: "Remplacer AWSTemplateFormatVersion par 2016-10-31 dans le modèle." } }
    - { id: b, text: { en: "Add a Globals section that sets the Runtime for all functions.", fr: "Ajouter une section Globals qui définit le Runtime de toutes les fonctions." } }
    - { id: c, text: { en: "Add Transform: AWS::Serverless-2016-10-31 to the template.", fr: "Ajouter Transform: AWS::Serverless-2016-10-31 au modèle." } }
    - { id: d, text: { en: "Add a Metadata section that lists the AWS SAM resource types.", fr: "Ajouter une section Metadata qui liste les types de ressources AWS SAM." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS SAM resource types are processed by the AWS::Serverless transform, a macro hosted by CloudFormation that expands them into standard CloudFormation resources. Without the Transform declaration, CloudFormation does not know the AWS::Serverless types."
    fr: "Les types de ressources AWS SAM sont traités par la transformation AWS::Serverless, une macro hébergée par CloudFormation qui les développe en ressources CloudFormation standard. Sans la déclaration Transform, CloudFormation ne connaît pas les types AWS::Serverless."
  options:
    a:
      en: "2010-09-09 is the only valid template format version; 2016-10-31 is the version of the SAM transform, not of the template format."
      fr: "2010-09-09 est la seule version de format de modèle valide ; 2016-10-31 est la version de la transformation SAM, pas du format de modèle."
    b:
      en: "Globals is itself a SAM feature and also needs the transform; it does not make the resource types valid."
      fr: "Globals est lui-même une fonctionnalité SAM qui nécessite aussi la transformation ; il ne rend pas les types de ressources valides."
    d:
      en: "Metadata holds extra information about the template; it does not load the SAM transform."
      fr: "Metadata contient des informations supplémentaires sur le modèle ; il ne charge pas la transformation SAM."
references:
  - title: AWS SAM template anatomy
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-specification-template-anatomy.html
