id: dvac03-3a-ecr-pull-through-dockerhub
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AWS CodeBuild projects at AnyCompany build images from Dockerfiles whose `FROM` lines pull public base images from Docker Hub. Builds often fail because of Docker Hub rate limits. The team wants the base images to be served from the company's Amazon ECR private registry and refreshed from Docker Hub automatically, without maintaining a copy job.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Les projets AWS CodeBuild d'AnyCompany créent des images à partir de Dockerfiles dont les lignes `FROM` extraient des images de base publiques de Docker Hub. Les builds échouent souvent à cause des limites de débit de Docker Hub. L'équipe veut que les images de base soient servies depuis le registre privé Amazon ECR de l'entreprise et actualisées automatiquement depuis Docker Hub, sans maintenir de job de copie.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the Docker Hub credentials in an AWS Secrets Manager secret whose name starts with ecr-pullthroughcache/, in the same account and Region.", fr: "Stocker les informations d'identification Docker Hub dans un secret AWS Secrets Manager dont le nom commence par ecr-pullthroughcache/, dans le même compte et la même Région." } }
    - { id: b, text: { en: "Store the Docker Hub credentials in a Parameter Store SecureString parameter and reference it from the registry settings.", fr: "Stocker les informations d'identification Docker Hub dans un paramètre SecureString de Parameter Store et le référencer dans les paramètres du registre." } }
    - { id: c, text: { en: "Create a pull through cache rule for Docker Hub and change the FROM lines to the private registry URI with the rule's prefix.", fr: "Créer une règle de cache d'extraction (pull through cache) pour Docker Hub et modifier les lignes FROM vers l'URI du registre privé avec le préfixe de la règle." } }
    - { id: d, text: { en: "Create a replication rule in the private registry with Docker Hub as the source registry.", fr: "Créer une règle de réplication dans le registre privé avec Docker Hub comme registre source." } }
    - { id: e, text: { en: "Enable enhanced scanning on the private registry so that base images are fetched from Docker Hub when they are scanned.", fr: "Activer l'analyse améliorée sur le registre privé pour que les images de base soient récupérées depuis Docker Hub lors de leur analyse." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A pull through cache rule syncs an upstream registry with the private registry: the first pull through the private registry URI caches the image, and Amazon ECR checks the upstream for a newer version of the tag at least once every 24 hours. Docker Hub requires authentication, stored in a Secrets Manager secret with the ecr-pullthroughcache/ prefix in the same account and Region as the rule."
    fr: "Une règle de cache d'extraction synchronise un registre en amont avec le registre privé : la première extraction via l'URI du registre privé met l'image en cache, et Amazon ECR vérifie en amont l'existence d'une nouvelle version de la balise au moins une fois toutes les 24 heures. Docker Hub exige une authentification, stockée dans un secret Secrets Manager avec le préfixe ecr-pullthroughcache/ dans le même compte et la même Région que la règle."
  options:
    b:
      en: "Pull through cache rules read upstream credentials only from Secrets Manager secrets, not from Parameter Store."
      fr: "Les règles de cache d'extraction lisent les informations d'identification en amont uniquement dans des secrets Secrets Manager, pas dans Parameter Store."
    d:
      en: "ECR replication copies images between Amazon ECR registries; Docker Hub cannot be a replication source."
      fr: "La réplication ECR copie des images entre registres Amazon ECR ; Docker Hub ne peut pas être une source de réplication."
    e:
      en: "Enhanced scanning analyzes images already in the registry for vulnerabilities; it never pulls images from another registry."
      fr: "L'analyse améliorée examine les vulnérabilités des images déjà présentes dans le registre ; elle n'extrait jamais d'images d'un autre registre."
references:
  - title: Sync an upstream registry with an Amazon ECR private registry
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/pull-through-cache.html
