id: dvac03-3b-env-http-api-autodeploy
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has an Amazon API Gateway HTTP API with a dev stage and a prod stage. Developers want every route or integration change to be available on the dev stage immediately, without creating a deployment by hand. The prod stage must change only when a developer explicitly deploys the API to it.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'une API HTTP Amazon API Gateway avec une étape dev et une étape prod. Les développeurs veulent que chaque modification de route ou d'intégration soit disponible immédiatement sur l'étape dev, sans créer de déploiement à la main. L'étape prod ne doit changer que lorsqu'un développeur y déploie explicitement l'API.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on automatic deployments for both the dev stage and the prod stage of the API.", fr: "Activer les déploiements automatiques pour l'étape dev et pour l'étape prod de l'API." } }
    - { id: b, text: { en: "Turn on automatic deployments for the dev stage only, and deploy to prod explicitly for each release.", fr: "Activer les déploiements automatiques pour l'étape dev uniquement, et déployer explicitement vers prod à chaque livraison." } }
    - { id: c, text: { en: "Rename the dev stage to $default so that API Gateway serves the latest configuration from the base URL.", fr: "Renommer l'étape dev en $default afin qu'API Gateway serve la configuration la plus récente depuis l'URL de base." } }
    - { id: d, text: { en: "Add a stage variable named autoDeploy with the value true to the dev stage of the API.", fr: "Ajouter à l'étape dev de l'API une variable d'étape nommée autoDeploy avec la valeur true." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A deployment is a snapshot of the API configuration, and changes take effect on a stage only after a deployment. Automatic deployments are a stage setting: turned on for dev, every change is released to dev automatically, while prod keeps its last deployment until someone deploys again."
    fr: "Un déploiement est un instantané de la configuration de l'API, et les modifications ne prennent effet sur une étape qu'après un déploiement. Les déploiements automatiques sont un paramètre d'étape : activés pour dev, chaque modification y est publiée automatiquement, tandis que prod conserve son dernier déploiement jusqu'à un nouveau déploiement."
  options:
    a:
      en: "Automatic deployments on prod would release every change to production without an explicit deployment."
      fr: "Les déploiements automatiques sur prod publieraient chaque modification en production sans déploiement explicite."
    c:
      en: "$default only means the stage is served from the base URL; it still needs a deployment or automatic deployments to pick up changes."
      fr: "$default signifie seulement que l'étape est servie depuis l'URL de base ; elle a toujours besoin d'un déploiement ou des déploiements automatiques pour prendre en compte les modifications."
    d:
      en: "Stage variables are key-value pairs used in the API configuration; a variable named autoDeploy does not change how the stage is deployed."
      fr: "Les variables d'étape sont des paires clé-valeur utilisées dans la configuration de l'API ; une variable nommée autoDeploy ne change pas la façon dont l'étape est déployée."
references:
  - title: Stages for HTTP APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-stages.html
