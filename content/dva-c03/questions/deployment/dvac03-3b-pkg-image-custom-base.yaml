id: dvac03-3b-pkg-image-custom-base
objective: "3.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany must package a Python AWS Lambda function as a container image built on the company's hardened Debian base image, which is not provided by AWS and contains no Lambda components. Developers must also be able to invoke the function locally with docker run and curl before they push the image to Amazon ECR.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany doit empaqueter une fonction AWS Lambda Python sous forme d'image de conteneur construite sur l'image de base Debian renforcée de l'entreprise, qui n'est pas fournie par AWS et ne contient aucun composant Lambda. Les développeurs doivent aussi pouvoir invoquer la fonction localement avec docker run et curl avant d'envoyer l'image dans Amazon ECR.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the Lambda runtime interface client for Python and make it the image entry point.", fr: "Installer le client d'interface d'exécution (runtime interface client) Lambda pour Python et en faire le point d'entrée de l'image." } }
    - { id: b, text: { en: "Attach a Lambda layer that contains the Python runtime and the handler's dependencies to the function.", fr: "Associer à la fonction une couche Lambda qui contient le runtime Python et les dépendances du gestionnaire." } }
    - { id: c, text: { en: "Test locally by running the image with the Lambda runtime interface emulator.", fr: "Tester localement en exécutant l'image avec l'émulateur d'interface d'exécution (runtime interface emulator) Lambda." } }
    - { id: d, text: { en: "Build the image as a multi-architecture image so that it runs on both arm64 and x86_64 functions.", fr: "Construire l'image comme image multi-architecture afin qu'elle s'exécute sur des fonctions arm64 et x86_64." } }
    - { id: e, text: { en: "Add a USER root instruction to the Dockerfile so that the function can write anywhere in its file system.", fr: "Ajouter une instruction USER root au Dockerfile afin que la fonction puisse écrire partout dans son système de fichiers." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Images that are not AWS base images must include a runtime interface client, which implements the Lambda Runtime API and passes events to the handler. AWS base images already contain a runtime interface emulator for local testing, but a non-AWS image needs the emulator added so that a local docker run can accept HTTP invocation requests."
    fr: "Les images qui ne sont pas des images de base AWS doivent inclure un client d'interface d'exécution, qui implémente l'API Runtime de Lambda et transmet les événements au gestionnaire. Les images de base AWS contiennent déjà un émulateur d'interface d'exécution pour les tests locaux, mais une image non AWS a besoin de cet émulateur pour qu'un docker run local accepte des requêtes d'invocation HTTP."
  options:
    b:
      en: "Functions defined as container images do not support layers; the runtime must be in the image."
      fr: "Les fonctions définies comme images de conteneur ne prennent pas en charge les couches ; le runtime doit se trouver dans l'image."
    d:
      en: "Lambda does not support functions that use multi-architecture container images; the image must target one architecture."
      fr: "Lambda ne prend pas en charge les fonctions qui utilisent des images de conteneur multi-architecture ; l'image doit cibler une seule architecture."
    e:
      en: "The image must run on a read-only file system with only /tmp writable, and no USER instruction is needed."
      fr: "L'image doit s'exécuter sur un système de fichiers en lecture seule où seul /tmp est accessible en écriture, et aucune instruction USER n'est nécessaire."
references:
  - title: Create a Lambda Event Function using a container image
    url: https://docs.aws.amazon.com/lambda/latest/dg/images-create.html
