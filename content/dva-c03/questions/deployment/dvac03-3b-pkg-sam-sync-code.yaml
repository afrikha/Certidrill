id: dvac03-3b-pkg-sam-sync-code
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at AnyCompany iterates on the code of an AWS Lambda function that is part of an AWS SAM application deployed to a personal development stack. Each sam deploy takes several minutes because it creates and runs a CloudFormation change set, even when only the function code changed. The developer wants code changes to reach the development function in seconds while editing.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany fait évoluer le code d'une fonction AWS Lambda qui fait partie d'une application AWS SAM déployée dans une pile de développement personnelle. Chaque sam deploy prend plusieurs minutes, car il crée et exécute un jeu de modifications CloudFormation, même lorsque seul le code de la fonction a changé. Le développeur veut que les modifications de code atteignent la fonction de développement en quelques secondes pendant qu'il travaille.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run sam sync --watch against the development stack while editing the code.", fr: "Exécuter sam sync --watch sur la pile de développement pendant la modification du code." } }
    - { id: b, text: { en: "Run sam deploy --no-confirm-changeset after each code change to skip the prompt.", fr: "Exécuter sam deploy --no-confirm-changeset après chaque modification du code pour éviter l'invite." } }
    - { id: c, text: { en: "Run sam local start-lambda so that the deployed function uses the local code.", fr: "Exécuter sam local start-lambda afin que la fonction déployée utilise le code local." } }
    - { id: d, text: { en: "Package the function as a container image so that CloudFormation skips the change set.", fr: "Empaqueter la fonction sous forme d'image de conteneur afin que CloudFormation ignore le jeu de modifications." } }
answer: { optionId: a }
explanation:
  correct:
    en: "sam sync updates resources through service APIs when it can, so a code-only change is uploaded with the Lambda API without a CloudFormation deployment, and --watch syncs each saved change automatically. Because this causes drift in the stack, AWS recommends sam sync for development stacks only and sam deploy or a pipeline for production."
    fr: "sam sync met à jour les ressources au moyen des API des services lorsque c'est possible : une modification limitée au code est chargée avec l'API Lambda sans déploiement CloudFormation, et --watch synchronise automatiquement chaque modification enregistrée. Comme cela crée une dérive de la pile, AWS recommande sam sync uniquement pour les piles de développement, et sam deploy ou un pipeline pour la production."
  options:
    b:
      en: "Skipping the confirmation prompt still creates and executes a change set, so each deployment still takes minutes."
      fr: "Ignorer la demande de confirmation crée et exécute toujours un jeu de modifications : chaque déploiement prend toujours plusieurs minutes."
    c:
      en: "start-lambda runs a local endpoint that emulates Lambda; it does not change the code of the function deployed in AWS."
      fr: "start-lambda exécute un point de terminaison local qui émule Lambda ; il ne change pas le code de la fonction déployée dans AWS."
    d:
      en: "Image-based functions are still deployed through CloudFormation change sets by sam deploy, and building and pushing an image adds time."
      fr: "Les fonctions basées sur une image sont toujours déployées au moyen de jeux de modifications CloudFormation par sam deploy, et générer puis envoyer une image ajoute du temps."
references:
  - title: Introduction to using sam sync to sync to AWS Cloud
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-sync.html
