id: dvac03-3c-continue-update-rollback
objective: "3.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An update of an AWS CloudFormation stack failed. During the rollback, CloudFormation could not restore an Amazon SQS queue that an operator had deleted manually, and the stack is now in the UPDATE_ROLLBACK_FAILED state. The deleted queue cannot be restored. The developer must return the stack to a state in which it can be updated again, without deleting the stack.

    Which solution will meet these requirements?
  fr: |
    La mise à jour d'une pile AWS CloudFormation a échoué. Pendant la restauration, CloudFormation n'a pas pu rétablir une file d'attente Amazon SQS qu'un opérateur avait supprimée manuellement, et la pile est maintenant à l'état UPDATE_ROLLBACK_FAILED. La file d'attente supprimée ne peut pas être rétablie. Le développeur doit ramener la pile dans un état où elle peut de nouveau être mise à jour, sans supprimer la pile.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Delete the stack, then create it again from the same template and parameters.", fr: "Supprimer la pile, puis la recréer à partir du même modèle et des mêmes paramètres." }
    - id: b
      text: { en: "Run cancel-update-stack on the stack to cancel the rollback that failed.", fr: "Exécuter cancel-update-stack sur la pile pour annuler la restauration en échec." }
    - id: c
      text: { en: "Run update-stack with the previous template to replace the failed state of the stack.", fr: "Exécuter update-stack avec le modèle précédent pour remplacer l'état en échec de la pile." }
    - id: d
      text: { en: "Run continue-update-rollback with --resources-to-skip set to the logical ID of the queue.", fr: "Exécuter continue-update-rollback avec --resources-to-skip défini sur l'ID logique de la file d'attente." }
answer: { optionId: d }
explanation:
  correct:
    en: "A stack in UPDATE_ROLLBACK_FAILED must finish its rollback before it can be updated. When the cause cannot be fixed, continue-update-rollback with --resources-to-skip skips the resources that failed to roll back, and the stack reaches UPDATE_ROLLBACK_COMPLETE. The skipped resources no longer match the template, so they must be reconciled before the next update."
    fr: "Une pile à l'état UPDATE_ROLLBACK_FAILED doit terminer sa restauration avant de pouvoir être mise à jour. Lorsque la cause ne peut pas être corrigée, continue-update-rollback avec --resources-to-skip ignore les ressources dont la restauration a échoué, et la pile atteint UPDATE_ROLLBACK_COMPLETE. Les ressources ignorées ne correspondent plus au modèle : il faut les aligner avant la prochaine mise à jour."
  options:
    a:
      en: "Deleting the stack is explicitly excluded and would remove every resource of the stack."
      fr: "La suppression de la pile est explicitement exclue et supprimerait toutes les ressources de la pile."
    b:
      en: "cancel-update-stack applies only to an update that is still in progress."
      fr: "cancel-update-stack s'applique uniquement à une mise à jour encore en cours."
    c:
      en: "A stack in UPDATE_ROLLBACK_FAILED cannot be updated until the rollback is completed."
      fr: "Une pile à l'état UPDATE_ROLLBACK_FAILED ne peut pas être mise à jour tant que la restauration n'est pas terminée."
references:
  - title: Continue rolling back an update
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-updating-stacks-continueupdaterollback.html
