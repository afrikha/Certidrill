id: dvac03-3b-tevt-cli-binary-format
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at AnyCompany uses AWS CLI version 2 in a test script to invoke an AWS Lambda function synchronously with an inline JSON test payload. The command fails before the function runs, with an error stating that the payload is not valid base64.

    ```bash
    aws lambda invoke --function-name order-validator \
        --payload '{"orderId": "42", "total": 19.90}' response.json
    ```

    Which change will make the command send the JSON payload to the function?
  fr: |
    Un développeur d'AnyCompany utilise l'AWS CLI version 2 dans un script de test pour invoquer une fonction AWS Lambda de façon synchrone avec une charge utile de test JSON en ligne. La commande échoue avant l'exécution de la fonction, avec une erreur indiquant que la charge utile n'est pas un base64 valide.

    ```bash
    aws lambda invoke --function-name order-validator \
        --payload '{"orderId": "42", "total": 19.90}' response.json
    ```

    Quelle modification permet à la commande d'envoyer la charge utile JSON à la fonction ?
body:
  options:
    - { id: a, text: { en: "Add --invocation-type DryRun to the command line.", fr: "Ajouter --invocation-type DryRun à la ligne de commande." } }
    - { id: b, text: { en: "Add --log-type Tail to the command line.", fr: "Ajouter --log-type Tail à la ligne de commande." } }
    - { id: c, text: { en: "Add --qualifier '$LATEST' to the command line.", fr: "Ajouter --qualifier '$LATEST' à la ligne de commande." } }
    - { id: d, text: { en: "Add --cli-binary-format raw-in-base64-out.", fr: "Ajouter --cli-binary-format raw-in-base64-out." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The --payload parameter is a blob, and AWS CLI version 2 expects blobs as base64-encoded strings by default. The --cli-binary-format raw-in-base64-out option makes the CLI accept the raw JSON text, as AWS CLI version 1 did, so the payload reaches the function."
    fr: "Le paramètre --payload est un blob, et l'AWS CLI version 2 attend par défaut des blobs encodés en base64. L'option --cli-binary-format raw-in-base64-out fait accepter le texte JSON brut par la CLI, comme le faisait l'AWS CLI version 1, et la charge utile parvient à la fonction."
  options:
    a:
      en: "DryRun only validates the parameters and the caller's permission to invoke the function; it does not run the function with the payload."
      fr: "DryRun valide seulement les paramètres et l'autorisation de l'appelant à invoquer la fonction ; il n'exécute pas la fonction avec la charge utile."
    b:
      en: "Tail returns the last 4 KB of the execution log in the response; it does not change how the payload is encoded."
      fr: "Tail renvoie les 4 derniers Ko du journal d'exécution dans la réponse ; il ne change pas l'encodage de la charge utile."
    c:
      en: "The qualifier selects a version or alias of the function; the payload would still be rejected as invalid base64."
      fr: "Le qualificatif sélectionne une version ou un alias de la fonction ; la charge utile serait toujours rejetée comme base64 non valide."
references:
  - title: invoke — AWS CLI Command Reference
    url: https://docs.aws.amazon.com/cli/latest/reference/lambda/invoke.html
