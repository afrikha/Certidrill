id: dvac03-3c-pipeline-stage-auto-rollback
objective: "3.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS CodePipeline V2 pipeline deploys a single-page application. Its Deploy stage contains an Amazon S3 deploy action that writes the files to a website bucket, followed by an AWS CodeBuild action that runs smoke tests against the site. When the smoke tests fail, the site must automatically go back to the source revision of the last execution in which the Deploy stage succeeded.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un pipeline AWS CodePipeline V2 déploie une application monopage. Son étape Deploy contient une action de déploiement Amazon S3 qui écrit les fichiers dans un compartiment de site web, suivie d'une action AWS CodeBuild qui exécute des tests de fumée sur le site. Lorsque les tests de fumée échouent, le site doit revenir automatiquement à la révision source de la dernière exécution au cours de laquelle l'étape Deploy a réussi.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Configure the Deploy stage with an onFailure result of ROLLBACK.", fr: "Configurer l'étape Deploy avec un résultat onFailure ROLLBACK." }
    - id: b
      text: { en: "Enable automatic retry on stage failure for the Deploy stage.", fr: "Activer la nouvelle tentative automatique en cas d'échec pour l'étape Deploy." }
    - id: c
      text: { en: "Enable versioning on the website bucket and invoke a Lambda function that restores the previous object versions when the stage fails.", fr: "Activer la gestion des versions sur le compartiment du site et appeler une fonction Lambda qui rétablit les versions précédentes des objets lorsque l'étape échoue." }
    - id: d
      text: { en: "Add a beforeEntry condition with a CloudWatchAlarm rule and a FAIL result to the Deploy stage.", fr: "Ajouter à l'étape Deploy une condition beforeEntry avec une règle CloudWatchAlarm et un résultat FAIL." }
answer: { optionId: a }
explanation:
  correct:
    en: "Stage rollback, available in V2 pipelines, starts a new execution of the stage with the source revisions and artifacts of the last execution in which the stage succeeded. With onFailure set to ROLLBACK, a failed smoke test fails the stage and CodePipeline rolls it back automatically, provided that one earlier successful execution exists in the current pipeline structure."
    fr: "La restauration d'étape, disponible dans les pipelines V2, lance une nouvelle exécution de l'étape avec les révisions source et les artefacts de la dernière exécution au cours de laquelle l'étape a réussi. Avec onFailure défini sur ROLLBACK, un test de fumée en échec fait échouer l'étape et CodePipeline la restaure automatiquement, à condition qu'une exécution réussie antérieure existe dans la structure actuelle du pipeline."
  options:
    b:
      en: "A retry runs the same failing revision again; it does not go back to the previous revision."
      fr: "Une nouvelle tentative réexécute la même révision en échec ; elle ne revient pas à la révision précédente."
    c:
      en: "This can work, but it requires custom code and its own failure handling, which stage rollback provides natively."
      fr: "Cette solution peut fonctionner, mais elle exige du code personnalisé et sa propre gestion des erreurs, que la restauration d'étape fournit nativement."
    d:
      en: "An entry condition is checked before the stage starts; it cannot revert files after the smoke tests fail."
      fr: "Une condition d'entrée est vérifiée avant le démarrage de l'étape ; elle ne peut pas rétablir les fichiers après l'échec des tests de fumée."
references:
  - title: Configure a stage for automatic rollback
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/stage-rollback-auto.html
  - title: Configuring stage rollback
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/stage-rollback.html
