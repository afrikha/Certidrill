id: dvac03-3b-env-function-url-alias
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany exposes an AWS Lambda function to partners through Lambda function URLs. The test environment and the production environment each need their own stable HTTPS endpoint, and each endpoint must keep invoking the same published code until the team promotes a release. A developer runs aws lambda create-function-url-config --qualifier 12 to create the production URL for version 12, and the request is rejected.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose une fonction AWS Lambda à ses partenaires au moyen d'URL de fonction Lambda. L'environnement de test et l'environnement de production ont chacun besoin de leur propre point de terminaison HTTPS stable, et chaque point de terminaison doit continuer à invoquer le même code publié jusqu'à ce que l'équipe promeuve une version. Un développeur exécute aws lambda create-function-url-config --qualifier 12 pour créer l'URL de production de la version 12, et la requête est rejetée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create one function URL on $LATEST and have partners add a version query parameter to choose the environment.", fr: "Créer une URL de fonction sur $LATEST et demander aux partenaires d'ajouter un paramètre de requête de version pour choisir l'environnement." } }
    - { id: b, text: { en: "Create test and prod aliases on published versions, add a function URL to each alias, and promote by updating the alias.", fr: "Créer des alias test et prod sur des versions publiées, ajouter une URL de fonction à chaque alias, et promouvoir en mettant à jour l'alias." } }
    - { id: c, text: { en: "Retry the command with --auth-type NONE, because function URLs on published versions cannot use AWS_IAM authentication.", fr: "Relancer la commande avec --auth-type NONE, car les URL de fonction des versions publiées ne peuvent pas utiliser l'authentification AWS_IAM." } }
    - { id: d, text: { en: "Create a function URL for each published version and give partners the new URL after every release.", fr: "Créer une URL de fonction pour chaque version publiée et donner la nouvelle URL aux partenaires après chaque livraison." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A function URL can be attached to an alias or to the unpublished $LATEST version, but not to a published version. A URL per alias gives each environment a stable endpoint, and moving the alias to a new version promotes a release without changing the URL."
    fr: "Une URL de fonction peut être associée à un alias ou à la version non publiée $LATEST, mais pas à une version publiée. Une URL par alias donne à chaque environnement un point de terminaison stable, et déplacer l'alias vers une nouvelle version promeut une livraison sans changer l'URL."
  options:
    a:
      en: "A URL on $LATEST always runs the latest unpublished code, and a query parameter does not select a version."
      fr: "Une URL sur $LATEST exécute toujours le code non publié le plus récent, et un paramètre de requête ne sélectionne pas de version."
    c:
      en: "The rejection is caused by the qualifier, not the authentication type: published versions cannot have function URLs at all."
      fr: "Le rejet est dû au qualificatif, pas au type d'authentification : les versions publiées ne peuvent pas du tout avoir d'URL de fonction."
    d:
      en: "Function URLs cannot be created for published versions, and changing the endpoint at each release breaks the stable endpoint requirement."
      fr: "Il est impossible de créer des URL de fonction pour des versions publiées, et changer de point de terminaison à chaque livraison enfreint l'exigence de point de terminaison stable."
references:
  - title: Creating and managing Lambda function URLs
    url: https://docs.aws.amazon.com/lambda/latest/dg/urls-configuration.html
