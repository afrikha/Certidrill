id: dvac03-3b-env-alias-provisioned
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses one AWS Lambda function for two environments. Developers invoke $LATEST for development, and production traffic uses an alias named prod. Production must have 50 pre-initialized execution environments to avoid cold starts, and development must not pay for any pre-initialized environments. A developer tries to set provisioned concurrency on $LATEST, and the request fails.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise une seule fonction AWS Lambda pour deux environnements. Les développeurs invoquent $LATEST pour le développement, et le trafic de production utilise un alias nommé prod. La production doit disposer de 50 environnements d'exécution pré-initialisés pour éviter les démarrages à froid, et le développement ne doit payer aucun environnement pré-initialisé. Un développeur essaie de définir une simultanéité provisionnée sur $LATEST, et la requête échoue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set reserved concurrency to 50 on the function.", fr: "Définir une simultanéité réservée de 50 sur la fonction." } }
    - { id: b, text: { en: "Set provisioned concurrency to 50 on the prod alias.", fr: "Définir une simultanéité provisionnée de 50 sur l'alias prod." } }
    - { id: c, text: { en: "Set provisioned concurrency to 50 on the unqualified function ARN.", fr: "Définir une simultanéité provisionnée de 50 sur l'ARN non qualifié de la fonction." } }
    - { id: d, text: { en: "Set the memory of the prod alias to the maximum so that its environments stay initialized.", fr: "Définir la mémoire de l'alias prod au maximum afin que ses environnements restent initialisés." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Provisioned concurrency must be applied to a published version or an alias, never to $LATEST. Configuring it on the prod alias pre-initializes 50 environments for the version that the alias points to, while invocations of $LATEST use on-demand concurrency."
    fr: "La simultanéité provisionnée doit être appliquée à une version publiée ou à un alias, jamais à $LATEST. La configurer sur l'alias prod pré-initialise 50 environnements pour la version vers laquelle pointe l'alias, tandis que les invocations de $LATEST utilisent la simultanéité à la demande."
  options:
    a:
      en: "Reserved concurrency sets aside and caps concurrency for the whole function; it does not pre-initialize execution environments."
      fr: "La simultanéité réservée réserve et plafonne la simultanéité de toute la fonction ; elle ne pré-initialise pas d'environnements d'exécution."
    c:
      en: "The unqualified ARN refers to $LATEST, which cannot have provisioned concurrency."
      fr: "L'ARN non qualifié désigne $LATEST, qui ne peut pas avoir de simultanéité provisionnée."
    d:
      en: "Memory is a setting of the function version, not of the alias, and more memory does not keep environments initialized."
      fr: "La mémoire est un paramètre de la version de la fonction, pas de l'alias, et plus de mémoire ne maintient pas les environnements initialisés."
references:
  - title: Configuring provisioned concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
