id: dvac03-3c-cross-region-action
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CodePipeline pipeline in the us-east-1 Region deploys an AWS CloudFormation stack in us-east-1. The company must now deploy the same stack to eu-west-1 in the same AWS account, from the same pipeline, after the us-east-1 deployment succeeds.

    Which solution will meet these requirements?
  fr: |
    Un pipeline AWS CodePipeline de la Région us-east-1 déploie une pile AWS CloudFormation dans us-east-1. L'entreprise doit désormais déployer la même pile dans eu-west-1, dans le même compte AWS et depuis le même pipeline, après la réussite du déploiement dans us-east-1.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a second pipeline in eu-west-1 with its own source action, and keep the two pipelines synchronized.", fr: "Créer un second pipeline dans eu-west-1 avec sa propre action source, et maintenir les deux pipelines synchronisés." }
    - id: b
      text: { en: "Replicate the artifact bucket to a bucket in eu-west-1 with S3 Cross-Region Replication, and point the deploy action at the replica.", fr: "Répliquer le compartiment d'artefacts vers un compartiment de eu-west-1 avec la réplication entre Régions S3, et pointer l'action de déploiement vers la réplique." }
    - id: c
      text: { en: "Add a CloudFormation deploy action with its Region set to eu-west-1, and add an eu-west-1 artifact bucket to the pipeline's artifact stores.", fr: "Ajouter une action de déploiement CloudFormation dont la Région est eu-west-1, et ajouter un compartiment d'artefacts de eu-west-1 aux magasins d'artefacts du pipeline." }
    - id: d
      text: { en: "Add a second source action that runs in eu-west-1 so that the artifacts are created in that Region.", fr: "Ajouter une seconde action source qui s'exécute dans eu-west-1 afin que les artefacts soient créés dans cette Région." }
answer: { optionId: c }
explanation:
  correct:
    en: "A cross-Region action runs in a Region other than the pipeline's Region: you set the action's Region and provide an artifact bucket for each Region in the pipeline's artifact stores. CodePipeline copies the action's input artifacts to that Region before it runs the action."
    fr: "Une action entre Régions s'exécute dans une autre Région que celle du pipeline : on définit la Région de l'action et on fournit un compartiment d'artefacts par Région dans les magasins d'artefacts du pipeline. CodePipeline copie les artefacts d'entrée de l'action dans cette Région avant d'exécuter l'action."
  options:
    a:
      en: "A second pipeline duplicates the configuration and can drift; it also does not wait for the us-east-1 deployment."
      fr: "Un second pipeline duplique la configuration et peut diverger ; il n'attend pas non plus le déploiement dans us-east-1."
    b:
      en: "Deploy actions read input artifacts from the pipeline's artifact store, not from a bucket that you choose; CodePipeline copies the artifacts itself."
      fr: "Les actions de déploiement lisent leurs artefacts d'entrée dans le magasin d'artefacts du pipeline, pas dans un compartiment de votre choix ; CodePipeline copie lui-même les artefacts."
    d:
      en: "Source actions cannot be cross-Region actions."
      fr: "Les actions source ne peuvent pas être des actions entre Régions."
references:
  - title: Add a cross-region action in CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/actions-create-cross-region.html
