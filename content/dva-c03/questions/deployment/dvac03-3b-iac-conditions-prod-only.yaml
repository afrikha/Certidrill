id: dvac03-3b-iac-conditions-prod-only
objective: "3.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys one AWS CloudFormation template to a dev stack and a prod stack. The template must create an Amazon CloudWatch alarm and an Amazon SNS topic for on-call alerts only in the prod stack. The same template file must be used for both stacks, and the environment must be chosen when the stack is deployed.

    Which combination of template changes will meet these requirements? (Choose two.)
  fr: |
    AnyCompany déploie un même modèle AWS CloudFormation dans une pile dev et une pile prod. Le modèle doit créer une alarme Amazon CloudWatch et une rubrique Amazon SNS pour les alertes d'astreinte uniquement dans la pile prod. Le même fichier de modèle doit être utilisé pour les deux piles, et l'environnement doit être choisi au moment du déploiement de la pile.

    Quelle combinaison de modifications du modèle répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a parameter named EnvType with AllowedValues dev and prod, which each stack deployment sets.", fr: "Ajouter un paramètre nommé EnvType avec les valeurs autorisées dev et prod, défini à chaque déploiement de pile." } }
    - { id: b, text: { en: "Add a Mappings section keyed by AWS Region that lists the alarm thresholds for each environment.", fr: "Ajouter une section Mappings indexée par Région AWS qui liste les seuils d'alarme de chaque environnement." } }
    - { id: c, text: { en: "Add a DependsOn attribute from the alarm to the SNS topic so that the topic is created first.", fr: "Ajouter un attribut DependsOn de l'alarme vers la rubrique SNS afin que la rubrique soit créée en premier." } }
    - { id: d, text: { en: "Add an IsProd condition that uses Fn::Equals on EnvType, and set Condition: IsProd on both resources.", fr: "Ajouter une condition IsProd qui utilise Fn::Equals sur EnvType, et définir Condition: IsProd sur les deux ressources." } }
    - { id: e, text: { en: "Set DeletionPolicy: Delete on the alarm and the topic so that the dev stack does not keep them.", fr: "Définir DeletionPolicy: Delete sur l'alarme et la rubrique afin que la pile dev ne les conserve pas." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A parameter lets the deployer choose the environment for each stack, and AllowedValues restricts the input. A condition built with Fn::Equals evaluates that parameter, and CloudFormation creates a resource that has a Condition attribute only when the condition is true."
    fr: "Un paramètre permet à la personne qui déploie de choisir l'environnement de chaque pile, et AllowedValues restreint la saisie. Une condition construite avec Fn::Equals évalue ce paramètre, et CloudFormation ne crée une ressource dotée d'un attribut Condition que lorsque la condition est vraie."
  options:
    b:
      en: "Mappings look up values by key, such as a Region, but they cannot decide whether a resource is created."
      fr: "Les mappages recherchent des valeurs par clé, comme une Région, mais ne peuvent pas décider si une ressource est créée."
    c:
      en: "DependsOn sets creation order; both resources would still be created in every stack."
      fr: "DependsOn définit l'ordre de création ; les deux ressources seraient toujours créées dans chaque pile."
    e:
      en: "DeletionPolicy controls what happens when a resource is deleted, not whether it is created, and it cannot differ per stack without conditions."
      fr: "DeletionPolicy détermine ce qui se passe lorsqu'une ressource est supprimée, pas si elle est créée, et elle ne peut pas varier selon la pile sans conditions."
references:
  - title: CloudFormation template Conditions syntax
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/conditions-section-structure.html
