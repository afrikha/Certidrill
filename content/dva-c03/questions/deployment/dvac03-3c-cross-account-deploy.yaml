id: dvac03-3c-cross-account-deploy
objective: "3.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs an AWS CodePipeline pipeline in a tools account (111111111111). The pipeline builds an AWS SAM application and must deploy its AWS CloudFormation stack into a production account (222222222222). The artifact bucket is encrypted with the default AWS managed key for Amazon S3, and its bucket policy already grants the production account access to the bucket.

    Which two actions must a developer take to complete the cross-account deployment? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    AnyCompany exécute un pipeline AWS CodePipeline dans un compte d'outillage (111111111111). Le pipeline génère une application AWS SAM et doit déployer sa pile AWS CloudFormation dans un compte de production (222222222222). Le compartiment d'artefacts est chiffré avec la clé gérée par AWS par défaut pour Amazon S3, et sa politique de compartiment accorde déjà l'accès au compte de production.

    Quelles sont les deux actions qu'un développeur doit effectuer pour mettre en place le déploiement entre comptes ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Keep the AWS managed key and add a statement to the bucket policy that allows the production account to decrypt the artifacts.", fr: "Conserver la clé gérée par AWS et ajouter à la politique de compartiment une instruction autorisant le compte de production à déchiffrer les artefacts." } }
    - { id: b, text: { en: "Encrypt the artifact store with a customer managed AWS KMS key whose key policy allows the production account to use the key.", fr: "Chiffrer le magasin d'artefacts avec une clé AWS KMS gérée par le client dont la politique de clé autorise le compte de production à utiliser la clé." } }
    - { id: c, text: { en: "Configure the CloudFormation deploy action as a cross-Region action in the Region of the production stack.", fr: "Configurer l'action de déploiement CloudFormation comme une action entre Régions dans la Région de la pile de production." } }
    - { id: d, text: { en: "Create an IAM user in the production account and store its access keys in pipeline-level variables for the deploy action.", fr: "Créer un utilisateur IAM dans le compte de production et stocker ses clés d'accès dans des variables de niveau pipeline pour l'action de déploiement." } }
    - { id: e, text: { en: "Create a role in the production account that trusts the pipeline's service role, and set it as the roleArn of the deploy action.", fr: "Créer dans le compte de production un rôle qui approuve le rôle de service du pipeline, et le définir comme roleArn de l'action de déploiement." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Another account can read the artifacts only if it can use the encryption key, so the artifact store must use a customer managed KMS key that grants the production account access. The deploy action then sets roleArn to a role in the production account that trusts the pipeline's service role, and CodePipeline assumes that role to run the CloudFormation deployment there."
    fr: "Un autre compte ne peut lire les artefacts que s'il peut utiliser la clé de chiffrement : le magasin d'artefacts doit donc utiliser une clé KMS gérée par le client qui accorde l'accès au compte de production. L'action de déploiement définit ensuite roleArn sur un rôle du compte de production qui approuve le rôle de service du pipeline, et CodePipeline assume ce rôle pour y exécuter le déploiement CloudFormation."
  options:
    a:
      en: "A bucket policy cannot grant use of a KMS key, and the key policy of an AWS managed key cannot be changed to allow another account."
      fr: "Une politique de compartiment ne peut pas accorder l'utilisation d'une clé KMS, et la politique d'une clé gérée par AWS ne peut pas être modifiée pour autoriser un autre compte."
    c:
      en: "A cross-Region action changes where the action runs, not which account it acts in, and it grants no access to the production account."
      fr: "Une action entre Régions change l'endroit où l'action s'exécute, pas le compte dans lequel elle agit, et elle n'accorde aucun accès au compte de production."
    d:
      en: "Long-term access keys are insecure, and pipeline variables are rendered in plaintext; deploy actions assume roles instead."
      fr: "Les clés d'accès à long terme ne sont pas sûres, et les variables de pipeline sont affichées en clair ; les actions de déploiement assument plutôt des rôles."
references:
  - title: Create a pipeline in CodePipeline that uses resources from another AWS account
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-create-cross-account.html
