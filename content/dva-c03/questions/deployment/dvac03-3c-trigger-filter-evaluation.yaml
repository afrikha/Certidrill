id: dvac03-3c-trigger-filter-evaluation
objective: "3.3.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A team manages releases with branches named `release/<version>` and with version tags. An AWS CodePipeline V2 pipeline that uses an AWS CodeConnections source action named `Source` has the following trigger configuration:

    ```json
    "triggers": [
      {
        "providerType": "CodeStarSourceConnection",
        "gitConfiguration": {
          "sourceActionName": "Source",
          "push": [
            {
              "branches": {
                "includes": ["release/**"],
                "excludes": ["release/legacy/**"]
              }
            },
            {
              "tags": {
                "includes": ["v*"]
              }
            }
          ]
        }
      }
    ]
    ```

    Which two events will start the pipeline? (Choose two.)
  fr: |
    Une équipe gère ses versions avec des branches nommées `release/<version>` et avec des balises de version. Un pipeline AWS CodePipeline V2 qui utilise une action source AWS CodeConnections nommée `Source` a la configuration de déclencheur suivante :

    ```json
    "triggers": [
      {
        "providerType": "CodeStarSourceConnection",
        "gitConfiguration": {
          "sourceActionName": "Source",
          "push": [
            {
              "branches": {
                "includes": ["release/**"],
                "excludes": ["release/legacy/**"]
              }
            },
            {
              "tags": {
                "includes": ["v*"]
              }
            }
          ]
        }
      }
    ]
    ```

    Quels sont les deux événements qui démarreront le pipeline ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A commit is pushed to the `main` branch.", fr: "Un commit est poussé sur la branche `main`." } }
    - { id: b, text: { en: "A commit is pushed to the `release/legacy/1.9` branch.", fr: "Un commit est poussé sur la branche `release/legacy/1.9`." } }
    - { id: c, text: { en: "A commit is pushed to the `release/2.5` branch.", fr: "Un commit est poussé sur la branche `release/2.5`." } }
    - { id: d, text: { en: "A pull request is opened from `feature/login` to `release/2.5`.", fr: "Une demande d'extraction est ouverte de `feature/login` vers `release/2.5`." } }
    - { id: e, text: { en: "The tag `v2.5.0` is pushed.", fr: "La balise `v2.5.0` est poussée." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Separate push filters are combined with OR, so a push starts the pipeline if it matches either the branch filter or the tag filter. A push to `release/2.5` matches the `release/**` include and no exclude, and the tag `v2.5.0` matches `v*`."
    fr: "Des filtres push distincts sont combinés par un OU : un push démarre le pipeline s'il correspond au filtre de branches ou au filtre de balises. Un push vers `release/2.5` correspond à l'inclusion `release/**` et à aucune exclusion, et la balise `v2.5.0` correspond à `v*`."
  options:
    a:
      en: "`main` matches no include pattern of the branch filter."
      fr: "`main` ne correspond à aucun modèle d'inclusion du filtre de branches."
    b:
      en: "The branch matches both the include and the exclude patterns, and excludes take precedence over includes."
      fr: "La branche correspond aux modèles d'inclusion et d'exclusion, et les exclusions l'emportent sur les inclusions."
    d:
      en: "The trigger has no pullRequest configuration, so pull request events do not start the pipeline."
      fr: "Le déclencheur n'a pas de configuration pullRequest : les événements de demande d'extraction ne démarrent pas le pipeline."
references:
  - title: Automate starting pipelines using triggers and filtering
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-triggers.html
