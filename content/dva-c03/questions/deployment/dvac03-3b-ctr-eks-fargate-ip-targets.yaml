id: dvac03-3b-ctr-eks-fargate-ip-targets
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys a web service to an Amazon EKS cluster in which the pods of the web namespace run on AWS Fargate. The team applies a Kubernetes Ingress manifest that the AWS Load Balancer Controller uses to create an Application Load Balancer with instance targets. The load balancer is created, but its target group never contains healthy targets for the pods.

    Which change will make the load balancer route traffic to the pods?
  fr: |
    AnyCompany déploie un service web dans un cluster Amazon EKS dans lequel les pods de l'espace de noms web s'exécutent sur AWS Fargate. L'équipe applique un manifeste Ingress Kubernetes que l'AWS Load Balancer Controller utilise pour créer un Application Load Balancer avec des cibles de type instance. L'équilibreur de charge est créé, mais son groupe cible ne contient jamais de cibles saines pour les pods.

    Quelle modification permet à l'équilibreur de charge d'acheminer le trafic vers les pods ?
body:
  options:
    - { id: a, text: { en: "Expose the pods with a NodePort Service and keep the instance target type.", fr: "Exposer les pods avec un Service NodePort et conserver le type de cible instance." } }
    - { id: b, text: { en: "Add hostPort to the container ports in the Deployment manifest.", fr: "Ajouter hostPort aux ports de conteneur dans le manifeste du Deployment." } }
    - { id: c, text: { en: "Move the Fargate profile to public subnets so that the pods get public IP addresses.", fr: "Déplacer le profil Fargate vers des sous-réseaux publics afin que les pods obtiennent des adresses IP publiques." } }
    - { id: d, text: { en: "Configure the Ingress so that the load balancer uses the IP target type.", fr: "Configurer l'Ingress afin que l'équilibreur de charge utilise le type de cible IP." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Application Load Balancers and Network Load Balancers can be used with Fargate pods only with IP targets, because Fargate pods do not run on nodes that you can register as instances. With the IP target type, the controller registers each pod's IP address in the target group."
    fr: "Les Application Load Balancers et les Network Load Balancers ne peuvent être utilisés avec des pods Fargate qu'avec des cibles IP, car les pods Fargate ne s'exécutent pas sur des nœuds que vous pouvez enregistrer comme instances. Avec le type de cible IP, le contrôleur enregistre l'adresse IP de chaque pod dans le groupe cible."
  options:
    a:
      en: "Services exposed by Fargate pods run only in IP target mode, not in node instance mode, so a NodePort with instance targets still cannot reach them."
      fr: "Les services exposés par des pods Fargate ne fonctionnent qu'en mode de cible IP, pas en mode instance de nœud : un NodePort avec des cibles instance ne peut toujours pas les atteindre."
    b:
      en: "Pods that run on Fargate cannot specify hostPort or hostNetwork in their manifest."
      fr: "Les pods qui s'exécutent sur Fargate ne peuvent pas spécifier hostPort ni hostNetwork dans leur manifeste."
    c:
      en: "Fargate pods are supported only in private subnets and are not assigned public IP addresses."
      fr: "Les pods Fargate ne sont pris en charge que dans des sous-réseaux privés et ne reçoivent pas d'adresse IP publique."
references:
  - title: Simplify compute management with AWS Fargate
    url: https://docs.aws.amazon.com/eks/latest/userguide/fargate.html
