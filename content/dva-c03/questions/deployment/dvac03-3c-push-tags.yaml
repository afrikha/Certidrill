id: dvac03-3c-push-tags
objective: "3.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CodePipeline V2 pipeline uses an AWS CodeConnections source action for a GitHub repository. Its trigger starts the pipeline when a tag that matches `release-*` is pushed. A developer runs the following commands, and the commit appears on the `main` branch in GitHub, but the pipeline does not start:

    ```bash
    git tag release-1.8
    git push origin main
    ```

    What should the developer do to start the pipeline for this release?
  fr: |
    Un pipeline AWS CodePipeline V2 utilise une action source AWS CodeConnections pour un référentiel GitHub. Son déclencheur démarre le pipeline lorsqu'une balise correspondant à `release-*` est poussée. Un développeur exécute les commandes suivantes ; le commit apparaît sur la branche `main` dans GitHub, mais le pipeline ne démarre pas :

    ```bash
    git tag release-1.8
    git push origin main
    ```

    Que doit faire le développeur pour démarrer le pipeline pour cette version ?
body:
  options:
    - id: a
      text: { en: "Change the execution mode of the pipeline to QUEUED.", fr: "Passer le mode d'exécution du pipeline à QUEUED." }
    - id: b
      text: { en: "Rename the tag so that it starts with `v` instead of `release-`.", fr: "Renommer la balise pour qu'elle commence par `v` au lieu de `release-`." }
    - id: c
      text: { en: "Delete and recreate the CodeConnections connection to GitHub.", fr: "Supprimer et recréer la connexion CodeConnections vers GitHub." }
    - id: d
      text: { en: "Push the tag to the remote with `git push origin release-1.8`.", fr: "Pousser la balise vers le référentiel distant avec `git push origin release-1.8`." }
answer: { optionId: d }
explanation:
  correct:
    en: "Pushing a branch does not push the tags that were created locally, so GitHub never received `release-1.8` and the tag filter had nothing to match. Pushing the tag explicitly (or all new tags with `git push --tags`) sends it to the remote, and the matching tag starts the pipeline."
    fr: "Pousser une branche ne pousse pas les balises créées localement : GitHub n'a jamais reçu `release-1.8` et le filtre de balises n'avait rien à faire correspondre. Pousser explicitement la balise (ou toutes les nouvelles balises avec `git push --tags`) l'envoie au référentiel distant, et la balise correspondante démarre le pipeline."
  options:
    a:
      en: "The execution mode controls how executions run once started; no execution was started."
      fr: "Le mode d'exécution contrôle le déroulement des exécutions une fois démarrées ; aucune exécution n'a démarré."
    b:
      en: "The tag name already matches `release-*`; the problem is that the tag is not on the remote."
      fr: "Le nom de la balise correspond déjà à `release-*` ; le problème est que la balise n'est pas sur le référentiel distant."
    c:
      en: "The connection is not involved when a developer pushes to GitHub, and recreating it does not send the missing tag to the remote."
      fr: "La connexion n'intervient pas lorsqu'un développeur pousse vers GitHub, et la recréer n'envoie pas la balise manquante au référentiel distant."
references:
  - title: Create a Git tag in AWS CodeCommit
    url: https://docs.aws.amazon.com/codecommit/latest/userguide/how-to-create-tag.html
  - title: Add trigger with code push or pull request event types
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-filter.html
