id: dvac03-3b-pkg-sam-layer-buildmethod
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at AnyCompany defines a Lambda layer in an AWS SAM template. The layer's source folder deps/ contains only a requirements.txt file. When the developer runs sam build, the layer is copied as is and the Python packages are never installed. The developer wants sam build to install the packages into the layer in the folder structure that the Python runtime expects.

    Which change to the template will meet these requirements?
  fr: |
    Un développeur d'AnyCompany définit une couche Lambda dans un modèle AWS SAM. Le dossier source de la couche, deps/, ne contient qu'un fichier requirements.txt. Lorsque le développeur exécute sam build, la couche est copiée telle quelle et les packages Python ne sont jamais installés. Le développeur veut que sam build installe les packages dans la couche selon la structure de dossiers attendue par le runtime Python.

    Quelle modification du modèle répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add CompatibleRuntimes with the value python3.12 to the properties of the AWS::Serverless::LayerVersion resource.", fr: "Ajouter CompatibleRuntimes avec la valeur python3.12 aux propriétés de la ressource AWS::Serverless::LayerVersion." } }
    - { id: b, text: { en: "Add a Metadata section with BuildMethod set to python3.12 to the AWS::Serverless::LayerVersion resource.", fr: "Ajouter une section Metadata avec BuildMethod défini sur python3.12 à la ressource AWS::Serverless::LayerVersion." } }
    - { id: c, text: { en: "Add the layer to the Layers property in the Globals section of the template.", fr: "Ajouter la couche à la propriété Layers dans la section Globals du modèle." } }
    - { id: d, text: { en: "Set RetentionPolicy to Retain on the AWS::Serverless::LayerVersion resource.", fr: "Définir RetentionPolicy sur Retain sur la ressource AWS::Serverless::LayerVersion." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS SAM builds a layer only when the AWS::Serverless::LayerVersion resource has a Metadata section with a BuildMethod entry. With a runtime identifier such as python3.12, sam build installs the dependencies from ContentUri into the layout that the runtime expects; without Metadata, SAM does not build the layer."
    fr: "AWS SAM ne génère une couche que si la ressource AWS::Serverless::LayerVersion possède une section Metadata avec une entrée BuildMethod. Avec un identifiant de runtime comme python3.12, sam build installe les dépendances de ContentUri selon l'organisation attendue par le runtime ; sans Metadata, SAM ne génère pas la couche."
  options:
    a:
      en: "CompatibleRuntimes only declares which runtimes can use the layer; it does not tell SAM to build it."
      fr: "CompatibleRuntimes déclare seulement quels runtimes peuvent utiliser la couche ; il ne demande pas à SAM de la générer."
    c:
      en: "Attaching the layer to every function through Globals does not change how the layer itself is built."
      fr: "Associer la couche à toutes les fonctions au moyen de Globals ne change pas la façon dont la couche elle-même est générée."
    d:
      en: "RetentionPolicy controls whether old layer versions are kept when they are replaced or deleted; it has no effect on the build."
      fr: "RetentionPolicy détermine si les anciennes versions de couche sont conservées lorsqu'elles sont remplacées ou supprimées ; elle n'a aucun effet sur la génération."
references:
  - title: Building Lambda layers in AWS SAM
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/building-layers.html
