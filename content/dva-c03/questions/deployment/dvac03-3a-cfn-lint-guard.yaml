id: dvac03-3a-cfn-lint-guard
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A CI pipeline deploys AWS CloudFormation templates written by several teams. Before any deployment, the pipeline must fail if a template uses an invalid property name or an invalid property value for a resource type. It must also fail if any AWS::S3::Bucket resource in a template does not enable versioning, which is a company rule.

    Which combination of checks will meet these requirements? (Choose two.)
  fr: |
    Un pipeline de CI déploie des modèles AWS CloudFormation écrits par plusieurs équipes. Avant tout déploiement, le pipeline doit échouer si un modèle utilise un nom ou une valeur de propriété non valide pour un type de ressource. Il doit aussi échouer si une ressource AWS::S3::Bucket d'un modèle n'active pas la gestion des versions, ce qui est une règle de l'entreprise.

    Quelle combinaison de vérifications répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run cfn-lint on each template.", fr: "Exécuter cfn-lint sur chaque modèle." } }
    - { id: b, text: { en: "Run CloudFormation drift detection on each stack.", fr: "Exécuter la détection de dérive CloudFormation sur chaque pile." } }
    - { id: c, text: { en: "Run AWS CloudFormation Guard with a rules file that requires versioning on buckets.", fr: "Exécuter AWS CloudFormation Guard avec un fichier de règles qui exige la gestion des versions sur les compartiments." } }
    - { id: d, text: { en: "Enable termination protection on each stack.", fr: "Activer la protection contre la résiliation sur chaque pile." } }
    - { id: e, text: { en: "Attach a stack policy that denies Update:Replace on bucket resources.", fr: "Attacher une politique de pile qui refuse Update:Replace sur les ressources de compartiment." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "cfn-lint inspects the template structure, including resource property names and allowed values. CloudFormation Guard is a policy-as-code tool that validates JSON or YAML data, such as templates, against rules written in its DSL; it does not check syntax or allowed values, which is why both checks are needed."
    fr: "cfn-lint inspecte la structure du modèle, notamment les noms et les valeurs autorisées des propriétés de ressource. CloudFormation Guard est un outil de stratégie en tant que code (policy-as-code) qui valide des données JSON ou YAML, comme des modèles, par rapport à des règles écrites dans son DSL ; il ne vérifie ni la syntaxe ni les valeurs autorisées, d'où la nécessité des deux vérifications."
  options:
    b:
      en: "Drift detection compares deployed resources with their stack configuration; it runs after deployment and does not check templates."
      fr: "La détection de dérive compare les ressources déployées à la configuration de leur pile ; elle s'exécute après le déploiement et ne vérifie pas les modèles."
    d:
      en: "Termination protection only prevents a stack from being deleted."
      fr: "La protection contre la résiliation empêche seulement la suppression d'une pile."
    e:
      en: "A stack policy protects existing resources during stack updates; it does not validate a template before deployment."
      fr: "Une politique de pile protège les ressources existantes pendant les mises à jour de pile ; elle ne valide pas un modèle avant le déploiement."
references:
  - title: What is AWS CloudFormation Guard?
    url: https://docs.aws.amazon.com/cfn-guard/latest/ug/what-is-guard.html
  - title: sam validate
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-cli-command-reference-sam-validate.html
