id: dvac03-3c-protect-main-branch
objective: "3.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team stores its application in an AWS CodeCommit repository. The developers group has the AWSCodeCommitPowerUser managed policy. Developers must still be able to create branches, push to their own branches and open pull requests, but they must not push or merge directly to the `main` branch.

    Which solution will meet these requirements?
  fr: |
    Une équipe stocke son application dans un référentiel AWS CodeCommit. Le groupe des développeurs dispose de la politique gérée AWSCodeCommitPowerUser. Les développeurs doivent toujours pouvoir créer des branches, pousser vers leurs propres branches et ouvrir des demandes d'extraction (pull requests), mais ils ne doivent pas pousser ni fusionner directement sur la branche `main`.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an approval rule template that requires two approvals for pull requests that target `main`, and associate it with the repository.", fr: "Créer un modèle de règle d'approbation qui exige deux approbations pour les demandes d'extraction ciblant `main`, et l'associer au référentiel." }
    - id: b
      text: { en: "Attach a policy to the group that denies GitPush, PutFile and the merge actions when codecommit:References is `refs/heads/main`.", fr: "Attacher au groupe une politique qui refuse GitPush, PutFile et les actions de fusion lorsque codecommit:References vaut `refs/heads/main`." }
    - id: c
      text: { en: "Attach a policy to the group that denies codecommit:CreatePullRequest when the destination of the pull request is the `main` branch.", fr: "Attacher au groupe une politique qui refuse codecommit:CreatePullRequest lorsque la destination de la demande d'extraction est la branche `main`." }
    - id: d
      text: { en: "Replace the AWSCodeCommitPowerUser policy of the group with the AWSCodeCommitReadOnly managed policy.", fr: "Remplacer la politique AWSCodeCommitPowerUser du groupe par la politique gérée AWSCodeCommitReadOnly." }
answer: { optionId: b }
explanation:
  correct:
    en: "An IAM Deny statement on codecommit:GitPush, the file actions and the merge actions, with a condition on the codecommit:References key, blocks pushes and merges to the listed branches only. The policy also needs a Null condition on that key for GitPush, because of how Git sends references, and developers keep their other permissions."
    fr: "Une instruction IAM Deny sur codecommit:GitPush, les actions sur les fichiers et les actions de fusion, avec une condition sur la clé codecommit:References, bloque les push et les fusions vers les seules branches listées. La politique doit aussi comporter une condition Null sur cette clé pour GitPush, en raison de la façon dont Git envoie les références, et les développeurs conservent leurs autres autorisations."
  options:
    a:
      en: "Approval rules control when a pull request can be merged, but they do not block a direct Git push to `main`."
      fr: "Les règles d'approbation déterminent quand une demande d'extraction peut être fusionnée, mais elles ne bloquent pas un push Git direct sur `main`."
    c:
      en: "Developers must keep opening pull requests, and this policy does not block direct pushes or merges."
      fr: "Les développeurs doivent pouvoir ouvrir des demandes d'extraction, et cette politique ne bloque ni les push directs ni les fusions."
    d:
      en: "Read-only access also blocks branch creation and pushes to the developers' own branches."
      fr: "Un accès en lecture seule bloque aussi la création de branches et les push vers les branches des développeurs."
references:
  - title: Limit pushes and merges to branches in AWS CodeCommit
    url: https://docs.aws.amazon.com/codecommit/latest/userguide/how-to-conditional-branch.html
