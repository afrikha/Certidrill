id: dvac03-3b-aitest-kiro-post-task-hook
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team at AnyCompany implements features with Kiro specs in the Kiro IDE. Each time Kiro completes a task from tasks.md, the team wants the full regression test suite to run automatically with the command npm test, so that a broken task is detected before the next task starts.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'AnyCompany implémente des fonctionnalités avec des specs Kiro dans l'IDE Kiro. Chaque fois que Kiro termine une tâche de tasks.md, l'équipe veut que la suite complète de tests de régression s'exécute automatiquement avec la commande npm test, afin qu'une tâche défectueuse soit détectée avant le début de la tâche suivante.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a hook with a Pre Task Execution trigger and a shell command action that runs npm test.", fr: "Créer un hook avec un déclencheur Pre Task Execution et une action de commande shell qui exécute npm test." } }
    - { id: b, text: { en: "Create a hook with a File Delete trigger and a shell command action that runs npm test.", fr: "Créer un hook avec un déclencheur File Delete et une action de commande shell qui exécute npm test." } }
    - { id: c, text: { en: "Create a hook with a Prompt Submit trigger and an agent prompt action that asks Kiro to run the tests.", fr: "Créer un hook avec un déclencheur Prompt Submit et une action d'invite d'agent qui demande à Kiro d'exécuter les tests." } }
    - { id: d, text: { en: "Create a hook with a Post Task Execution trigger and a shell command action that runs npm test.", fr: "Créer un hook avec un déclencheur Post Task Execution et une action de commande shell qui exécute npm test." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The Post Task Execution trigger fires after a spec task completes, and a shell command action runs the given command from the project root. Running npm test at that point checks each task's changes before Kiro moves on."
    fr: "Le déclencheur Post Task Execution se déclenche après la fin d'une tâche de spec, et une action de commande shell exécute la commande indiquée depuis la racine du projet. Exécuter npm test à ce moment vérifie les modifications de chaque tâche avant que Kiro ne passe à la suite."
  options:
    a:
      en: "Pre Task Execution fires before a task begins, so it would test the code before the task's changes exist."
      fr: "Pre Task Execution se déclenche avant le début d'une tâche : il testerait le code avant que les modifications de la tâche n'existent."
    b:
      en: "File Delete fires only when the agent deletes matching files, not when a task completes."
      fr: "File Delete ne se déclenche que lorsque l'agent supprime des fichiers correspondants, pas à la fin d'une tâche."
    c:
      en: "Prompt Submit fires when the user submits a prompt, which is not tied to the completion of spec tasks."
      fr: "Prompt Submit se déclenche lorsque l'utilisateur soumet une invite, ce qui n'est pas lié à la fin des tâches de spec."
references:
  - title: Hook triggers - Hooks - Features - Docs - Kiro
    url: https://kiro.dev/docs/hooks/types/
