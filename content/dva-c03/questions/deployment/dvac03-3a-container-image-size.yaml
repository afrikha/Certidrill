id: dvac03-3a-container-image-size
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data team at AnyCompany is building a Python Lambda function that depends on several scientific libraries and a model file. The code, the libraries and the model total 1.8 GB uncompressed. The team wants to keep the function on Lambda and to ship the code and all its dependencies as one deployment artifact.

    Which solution will meet these requirements?
  fr: |
    Une équipe de données d'AnyCompany crée une fonction Lambda Python qui dépend de plusieurs bibliothèques scientifiques et d'un fichier de modèle. Le code, les bibliothèques et le modèle totalisent 1,8 Go non compressés. L'équipe veut garder la fonction sur Lambda et livrer le code et toutes ses dépendances sous la forme d'un seul artefact de déploiement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Split the dependencies across five Lambda layers so that each layer stays under 250 MB unzipped.", fr: "Répartir les dépendances sur cinq couches Lambda pour que chaque couche reste sous 250 Mo décompressés." } }
    - { id: b, text: { en: "Build a container image from an AWS base image for Python, push it to Amazon ECR and create the function from the image.", fr: "Créer une image de conteneur à partir d'une image de base AWS pour Python, la transférer vers Amazon ECR et créer la fonction à partir de l'image." } }
    - { id: c, text: { en: "Upload the .zip file to an S3 bucket and reference it in the function configuration to raise the unzipped size limit.", fr: "Charger le fichier .zip dans un compartiment S3 et le référencer dans la configuration de la fonction pour relever la limite de taille décompressée." } }
    - { id: d, text: { en: "Set the ephemeral storage of the function to 10,240 MB and keep all the dependencies in the .zip file.", fr: "Définir le stockage éphémère de la fonction à 10 240 Mo et conserver toutes les dépendances dans le fichier .zip." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A .zip deployment is limited to 250 MB unzipped, including all layers. A container image can be up to 10 GB uncompressed, including all its layers, so the code, libraries and model fit in one image stored in Amazon ECR."
    fr: "Un déploiement .zip est limité à 250 Mo décompressés, couches comprises. Une image de conteneur peut atteindre 10 Go non compressés, toutes couches comprises : le code, les bibliothèques et le modèle tiennent dans une seule image stockée dans Amazon ECR."
  options:
    a:
      en: "The 250 MB unzipped limit applies to the function package and all its layers together, so splitting does not help; it also creates several artifacts instead of one."
      fr: "La limite de 250 Mo décompressés s'applique au package de la fonction et à toutes ses couches ensemble : le découpage n'aide pas, et il crée plusieurs artefacts au lieu d'un seul."
    c:
      en: "Uploading through Amazon S3 only lifts the limit on the zipped file sent through the API; the 250 MB unzipped limit still applies."
      fr: "Le chargement via Amazon S3 lève seulement la limite du fichier compressé envoyé par l'API ; la limite de 250 Mo décompressés s'applique toujours."
    d:
      en: "Ephemeral storage is scratch space in /tmp at run time; it does not change the maximum size of the deployment package."
      fr: "Le stockage éphémère est un espace de travail dans /tmp à l'exécution ; il ne modifie pas la taille maximale du package de déploiement."
references:
  - title: Lambda quotas
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
  - title: Create a Lambda Event Function using a container image
    url: https://docs.aws.amazon.com/lambda/latest/dg/images-create.html
