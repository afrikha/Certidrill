id: dvac03-3c-ecs-circuit-breaker
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon ECS service uses the rolling update deployment type. A release with a broken container image produces tasks that never reach the RUNNING state, and the deployment keeps trying to launch tasks for hours. The developer wants ECS to detect such a failed deployment and automatically return the service to the last deployment that completed.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un service Amazon ECS utilise le type de déploiement par mise à jour propagée. Une version avec une image de conteneur défectueuse produit des tâches qui n'atteignent jamais l'état RUNNING, et le déploiement continue de lancer des tâches pendant des heures. Le développeur veut qu'ECS détecte un tel déploiement en échec et ramène automatiquement le service au dernier déploiement terminé.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Switch the service to the CodeDeploy deployment controller and enable automatic rollback when a deployment fails.", fr: "Passer le service au contrôleur de déploiement CodeDeploy et activer la restauration automatique en cas d'échec du déploiement." }
    - id: b
      text: { en: "Set minimumHealthyPercent to 100 so that the tasks of the previous deployment keep running.", fr: "Définir minimumHealthyPercent sur 100 afin que les tâches du déploiement précédent continuent de s'exécuter." }
    - id: c
      text: { en: "Enable the deployment circuit breaker with rollback in the deployment configuration of the service.", fr: "Activer le disjoncteur de déploiement avec restauration dans la configuration de déploiement du service." }
    - id: d
      text: { en: "Create an EventBridge rule that invokes a Lambda function to update the service with the previous task definition.", fr: "Créer une règle EventBridge qui appelle une fonction Lambda pour mettre à jour le service avec la définition de tâche précédente." }
answer: { optionId: c }
explanation:
  correct:
    en: "The deployment circuit breaker of a rolling update counts tasks that fail to launch or fail health checks and marks the deployment FAILED when the threshold is reached. With rollback enabled, ECS then rolls the service back to the most recent deployment in the COMPLETED state."
    fr: "Le disjoncteur de déploiement d'une mise à jour propagée compte les tâches qui ne se lancent pas ou échouent aux vérifications de l'état, et marque le déploiement FAILED lorsque le seuil est atteint. Avec la restauration activée, ECS ramène alors le service au déploiement le plus récent à l'état COMPLETED."
  options:
    a:
      en: "This requires a new blue/green setup with CodeDeploy resources and target groups, which is more work than a setting on the existing service."
      fr: "Cette solution exige une nouvelle configuration bleu/vert avec des ressources CodeDeploy et des groupes cibles, soit plus de travail qu'un paramètre du service existant."
    b:
      en: "Keeping old tasks running preserves capacity, but the failed deployment never stops and is never rolled back."
      fr: "Conserver les anciennes tâches préserve la capacité, mais le déploiement en échec ne s'arrête jamais et n'est jamais restauré."
    d:
      en: "Custom code is needed, and without the circuit breaker the deployment is not marked as failed, so there is no failure event to react to."
      fr: "Du code personnalisé est nécessaire, et sans disjoncteur le déploiement n'est pas marqué en échec : il n'y a donc pas d'événement d'échec auquel réagir."
references:
  - title: How the Amazon ECS deployment circuit breaker detects failures
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-circuit-breaker.html
