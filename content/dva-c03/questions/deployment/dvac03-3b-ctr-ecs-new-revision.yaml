id: dvac03-3b-ctr-ecs-new-revision
objective: "3.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs an Amazon ECS service named web on AWS Fargate with the rolling update deployment type. The service uses revision 14 of the task definition family web, whose container image is web:1.8.0. The CI pipeline has pushed the image web:1.9.0 to Amazon ECR. The service must be updated to run the new image with a rolling update.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany exécute un service Amazon ECS nommé web sur AWS Fargate avec le type de déploiement de mise à jour propagée (rolling update). Le service utilise la révision 14 de la famille de définitions de tâche web, dont l'image de conteneur est web:1.8.0. Le pipeline de CI a envoyé l'image web:1.9.0 dans Amazon ECR. Le service doit être mis à jour pour exécuter la nouvelle image avec une mise à jour propagée.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Register a new revision of the web task definition family that references web:1.9.0.", fr: "Enregistrer une nouvelle révision de la famille de définitions de tâche web qui référence web:1.9.0." } }
    - { id: b, text: { en: "Edit revision 14 in place to replace web:1.8.0 with web:1.9.0.", fr: "Modifier la révision 14 sur place pour remplacer web:1.8.0 par web:1.9.0." } }
    - { id: c, text: { en: "Run aws ecs update-service --force-new-deployment while the service keeps using revision 14.", fr: "Exécuter aws ecs update-service --force-new-deployment pendant que le service continue d'utiliser la révision 14." } }
    - { id: d, text: { en: "Run aws ecs update-service with --task-definition set to the new revision of the web family.", fr: "Exécuter aws ecs update-service avec --task-definition défini sur la nouvelle révision de la famille web." } }
    - { id: e, text: { en: "Set the desired count of the service to 0 and then back to its previous value.", fr: "Définir le nombre souhaité de tâches du service sur 0, puis le remettre à sa valeur précédente." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The image is part of the task definition, so a new image tag needs a new task definition revision. Updating the service to that revision starts a deployment in which the scheduler replaces running tasks according to minimumHealthyPercent and maximumPercent."
    fr: "L'image fait partie de la définition de tâche : une nouvelle balise d'image exige une nouvelle révision de définition de tâche. Mettre à jour le service avec cette révision démarre un déploiement dans lequel le planificateur remplace les tâches en cours selon minimumHealthyPercent et maximumPercent."
  options:
    b:
      en: "Task definition revisions cannot be edited after registration; a change always creates a new revision."
      fr: "Les révisions de définition de tâche ne peuvent pas être modifiées après leur enregistrement ; une modification crée toujours une nouvelle révision."
    c:
      en: "A forced deployment restarts tasks from revision 14, which still references web:1.8.0."
      fr: "Un déploiement forcé redémarre les tâches à partir de la révision 14, qui référence toujours web:1.8.0."
    e:
      en: "Scaling to zero causes downtime instead of a rolling update and still starts tasks from revision 14."
      fr: "Réduire à zéro provoque une interruption au lieu d'une mise à jour propagée et démarre toujours les tâches à partir de la révision 14."
references:
  - title: Deploy Amazon ECS services by replacing tasks
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-ecs.html
