id: dvac03-3a-ecs-secrets-kms
objective: "3.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An Amazon ECS task on AWS Fargate must receive the production database password as the `DB_PASSWORD` environment variable. The password is stored in an AWS Secrets Manager secret that is encrypted with a customer managed AWS KMS key. The password must not appear in plaintext in the task definition.

    Which combination of steps will meet these requirements? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une tâche Amazon ECS sur AWS Fargate doit recevoir le mot de passe de la base de données de production dans la variable d'environnement `DB_PASSWORD`. Le mot de passe est stocké dans un secret AWS Secrets Manager chiffré avec une clé AWS KMS gérée par le client. Le mot de passe ne doit pas apparaître en texte clair dans la définition de tâche.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Add a secrets entry with the name DB_PASSWORD and a valueFrom set to the ARN of the secret in the container definition.", fr: "Ajouter dans la définition de conteneur une entrée secrets avec le nom DB_PASSWORD et un valueFrom défini sur l'ARN du secret." } }
    - { id: b, text: { en: "Allow secretsmanager:GetSecretValue on the secret in a policy of the task execution role.", fr: "Autoriser secretsmanager:GetSecretValue sur le secret dans une politique du rôle d'exécution de tâche." } }
    - { id: c, text: { en: "Allow kms:Decrypt on the customer managed key in a policy of the task execution role.", fr: "Autoriser kms:Decrypt sur la clé gérée par le client dans une politique du rôle d'exécution de tâche." } }
    - { id: d, text: { en: "Add an environment entry whose value is a CloudFormation dynamic reference to the secret in the task definition template.", fr: "Ajouter une entrée environment dont la valeur est une référence dynamique CloudFormation au secret dans le modèle de la définition de tâche." } }
    - { id: e, text: { en: "Allow secretsmanager:GetSecretValue on the secret in a policy of the task role instead of the task execution role.", fr: "Autoriser secretsmanager:GetSecretValue sur le secret dans une politique du rôle de tâche au lieu du rôle d'exécution de tâche." } }
    - { id: f, text: { en: "Turn on automatic rotation for the secret so that running tasks receive the new value in DB_PASSWORD.", fr: "Activer la rotation automatique du secret pour que les tâches en cours reçoivent la nouvelle valeur dans DB_PASSWORD." } }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: "The secrets section of a container definition injects a secret as an environment variable when the container starts, with only the ARN in the task definition. Amazon ECS reads it with the task execution role, which needs secretsmanager:GetSecretValue and, because the secret uses a customer managed key, kms:Decrypt on that key."
    fr: "La section secrets d'une définition de conteneur injecte un secret comme variable d'environnement au démarrage du conteneur, avec seulement l'ARN dans la définition de tâche. Amazon ECS le lit avec le rôle d'exécution de tâche, qui a besoin de secretsmanager:GetSecretValue et, comme le secret utilise une clé gérée par le client, de kms:Decrypt sur cette clé."
  options:
    d:
      en: "CloudFormation resolves the dynamic reference at deployment and writes the plaintext value into the environment section of the registered task definition."
      fr: "CloudFormation résout la référence dynamique au déploiement et écrit la valeur en texte clair dans la section environment de la définition de tâche enregistrée."
    e:
      en: "The task role is used by the application code; secrets in the container definition are retrieved with the task execution role."
      fr: "Le rôle de tâche est utilisé par le code de l'application ; les secrets de la définition de conteneur sont récupérés avec le rôle d'exécution de tâche."
    f:
      en: "Secrets are injected only when the container starts; a rotated value reaches the application only after new tasks are launched."
      fr: "Les secrets ne sont injectés qu'au démarrage du conteneur ; une valeur renouvelée n'atteint l'application qu'après le lancement de nouvelles tâches."
references:
  - title: Pass Secrets Manager secrets through Amazon ECS environment variables
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/secrets-envvar-secrets-manager.html
  - title: Amazon ECS task execution IAM role
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html
