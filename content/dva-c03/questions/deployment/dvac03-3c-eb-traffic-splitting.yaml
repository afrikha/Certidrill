id: dvac03-3c-eb-traffic-splitting
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application in an AWS Elastic Beanstalk environment that uses an Application Load Balancer. For the next release, the team wants to send 15% of client traffic to the new version for 10 minutes and then shift all traffic if the new instances are healthy. If they are not healthy, traffic must return quickly to the existing instances. The environment URL must not change.

    Which configuration will meet these requirements?
  fr: |
    Une entreprise exécute une application dans un environnement AWS Elastic Beanstalk qui utilise un Application Load Balancer. Pour la prochaine version, l'équipe veut envoyer 15 % du trafic client vers la nouvelle version pendant 10 minutes, puis transférer tout le trafic si les nouvelles instances sont saines. Si elles ne le sont pas, le trafic doit revenir rapidement vers les instances existantes. L'URL de l'environnement ne doit pas changer.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set DeploymentPolicy to Immutable and BatchSize to 15 with BatchSizeType set to Percentage.", fr: "Définir DeploymentPolicy sur Immutable et BatchSize sur 15 avec BatchSizeType défini sur Percentage." }
    - id: b
      text: { en: "Clone the environment, deploy the new version to the clone, and swap the environment URLs after 10 minutes.", fr: "Cloner l'environnement, déployer la nouvelle version dans le clone, et permuter les URL des environnements au bout de 10 minutes." }
    - id: c
      text: { en: "Set DeploymentPolicy to TrafficSplitting, NewVersionPercent to 15 and EvaluationTime to 10.", fr: "Définir DeploymentPolicy sur TrafficSplitting, NewVersionPercent sur 15 et EvaluationTime sur 10." }
    - id: d
      text: { en: "Set DeploymentPolicy to RollingWithAdditionalBatch, BatchSize to 15 percent and the command timeout to 600 seconds.", fr: "Définir DeploymentPolicy sur RollingWithAdditionalBatch, BatchSize sur 15 % et le délai d'expiration de commande sur 600 secondes." }
answer: { optionId: c }
explanation:
  correct:
    en: "A traffic-splitting deployment launches the new version on a full set of new instances and has the load balancer send NewVersionPercent of client traffic to them for EvaluationTime minutes. If the new instances stay healthy, all traffic shifts; otherwise traffic goes back to the old instances and the new ones are terminated. It requires an Application Load Balancer."
    fr: "Un déploiement par répartition du trafic (TrafficSplitting) lance la nouvelle version sur un ensemble complet de nouvelles instances et fait envoyer par l'équilibreur de charge NewVersionPercent du trafic client vers elles pendant EvaluationTime minutes. Si les nouvelles instances restent saines, tout le trafic est transféré ; sinon, il revient vers les anciennes instances et les nouvelles sont arrêtées. Il exige un Application Load Balancer."
  options:
    a:
      en: "An immutable deployment does not send a chosen percentage of client traffic to the new version; batch settings apply to rolling policies."
      fr: "Un déploiement immuable n'envoie pas un pourcentage choisi du trafic client vers la nouvelle version ; les paramètres de lot s'appliquent aux politiques rolling."
    b:
      en: "Swapping URLs moves all traffic at once through DNS to another environment; there is no 15% phase."
      fr: "La permutation des URL déplace tout le trafic d'un coup, par le DNS, vers un autre environnement ; il n'y a pas de phase à 15 %."
    d:
      en: "Rolling batches move whole instances, not a percentage of traffic, and batches that are already updated keep the new version if the deployment fails."
      fr: "Les lots rolling déplacent des instances entières, pas un pourcentage du trafic, et les lots déjà mis à jour conservent la nouvelle version en cas d'échec."
references:
  - title: Deployment policies and settings
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.rolling-version-deploy.html
