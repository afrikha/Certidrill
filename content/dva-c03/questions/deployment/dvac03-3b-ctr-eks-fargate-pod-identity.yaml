id: dvac03-3b-ctr-eks-fargate-pod-identity
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany deploys a reporting service to an Amazon EKS cluster. The pods run on AWS Fargate and must read objects from an Amazon S3 bucket. The team created an IAM role that trusts pods.eks.amazonaws.com and an EKS Pod Identity association between that role and the service account used in the Deployment manifest. The AWS SDK in the pods cannot obtain credentials. The team wants to keep using EKS Pod Identity associations for this service.

    Which solution will meet these requirements?
  fr: |
    AnyCompany déploie un service de rapports dans un cluster Amazon EKS. Les pods s'exécutent sur AWS Fargate et doivent lire des objets d'un compartiment Amazon S3. L'équipe a créé un rôle IAM qui approuve pods.eks.amazonaws.com et une association EKS Pod Identity entre ce rôle et le compte de service utilisé dans le manifeste du Deployment. Le kit SDK AWS des pods ne parvient pas à obtenir d'informations d'identification. L'équipe veut continuer à utiliser des associations EKS Pod Identity pour ce service.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy the EKS Pod Identity Agent as a DaemonSet in the namespace that the Fargate profile selects.", fr: "Déployer l'agent EKS Pod Identity comme DaemonSet dans l'espace de noms sélectionné par le profil Fargate." } }
    - { id: b, text: { en: "Add the S3 read permissions to the Fargate pod execution role of the profile.", fr: "Ajouter les autorisations de lecture S3 au rôle d'exécution de pod Fargate du profil." } }
    - { id: c, text: { en: "Run the service's pods on Linux EC2 nodes of a managed node group, and keep the association.", fr: "Exécuter les pods du service sur des nœuds EC2 Linux d'un groupe de nœuds géré, et conserver l'association." } }
    - { id: d, text: { en: "Set hostNetwork: true in the pod template so that the pods can reach the credentials endpoint.", fr: "Définir hostNetwork: true dans le modèle de pod afin que les pods puissent atteindre le point de terminaison des informations d'identification." } }
answer: { optionId: c }
explanation:
  correct:
    en: "EKS Pod Identity does not support pods that run on AWS Fargate; it works for pods on Linux EC2 nodes, where the Pod Identity Agent runs on each node and issues the credentials. Running the pods on a managed node group lets the existing association provide the role's credentials."
    fr: "EKS Pod Identity ne prend pas en charge les pods qui s'exécutent sur AWS Fargate ; il fonctionne pour les pods sur des nœuds EC2 Linux, où l'agent Pod Identity s'exécute sur chaque nœud et délivre les informations d'identification. Exécuter les pods sur un groupe de nœuds géré permet à l'association existante de fournir les informations d'identification du rôle."
  options:
    a:
      en: "DaemonSets are not supported on Fargate, and Pod Identity itself is not supported for Fargate pods."
      fr: "Les DaemonSets ne sont pas pris en charge sur Fargate, et Pod Identity lui-même n'est pas pris en charge pour les pods Fargate."
    b:
      en: "The pod execution role is for the EKS components on Fargate, such as image pulls; it does not give credentials to the application code."
      fr: "Le rôle d'exécution de pod sert aux composants EKS sur Fargate, comme l'extraction des images ; il ne donne pas d'informations d'identification au code de l'application."
    d:
      en: "Pods that run on Fargate cannot specify hostNetwork in their manifest."
      fr: "Les pods qui s'exécutent sur Fargate ne peuvent pas spécifier hostNetwork dans leur manifeste."
references:
  - title: Learn how EKS Pod Identity grants pods access to AWS services
    url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
  - title: Simplify compute management with AWS Fargate
    url: https://docs.aws.amazon.com/eks/latest/userguide/fargate.html
