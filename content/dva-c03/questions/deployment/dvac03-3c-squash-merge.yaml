id: dvac03-3c-squash-merge
objective: "3.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team merges feature branches into `main` through pull requests in an AWS CodeCommit repository. Feature branches contain many small work-in-progress commits. The release notes are generated from the history of `main` and must show exactly one commit for each merged pull request. The individual commits of the feature branches do not need to be kept, and the approval rules of the pull requests must still be enforced.

    Which merge strategy should the team use?
  fr: |
    Une équipe fusionne des branches de fonctionnalité dans `main` via des demandes d'extraction dans un référentiel AWS CodeCommit. Les branches de fonctionnalité contiennent de nombreux petits commits de travail en cours. Les notes de version sont générées à partir de l'historique de `main` et doivent présenter exactement un commit par demande d'extraction fusionnée. Les commits individuels des branches de fonctionnalité n'ont pas besoin d'être conservés, et les règles d'approbation des demandes d'extraction doivent toujours s'appliquer.

    Quelle stratégie de fusion l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Merge each pull request with the fast-forward merge strategy.", fr: "Fusionner chaque demande d'extraction avec la stratégie de fusion fast-forward." }
    - id: b
      text: { en: "Merge each pull request with the three-way merge strategy.", fr: "Fusionner chaque demande d'extraction avec la stratégie de fusion three-way." }
    - id: c
      text: { en: "Merge each pull request with the squash merge strategy.", fr: "Fusionner chaque demande d'extraction avec la stratégie de fusion squash." }
    - id: d
      text: { en: "Merge each feature branch locally with `git merge --squash` and push the result to `main`.", fr: "Fusionner localement chaque branche de fonctionnalité avec `git merge --squash` et pousser le résultat sur `main`." }
answer: { optionId: c }
explanation:
  correct:
    en: "A squash merge combines the changes of the source branch into a single commit on the destination branch, so `main` gets one commit per pull request and the individual commits are not kept. Merging in the console or with the AWS CLI also enforces the approval rules of the pull request."
    fr: "Une fusion squash combine les modifications de la branche source en un seul commit sur la branche de destination : `main` reçoit un commit par demande d'extraction et les commits individuels ne sont pas conservés. La fusion dans la console ou avec l'AWS CLI applique aussi les règles d'approbation de la demande d'extraction."
  options:
    a:
      en: "Fast-forward moves `main` to the last commit of the source branch, so every work-in-progress commit appears in the history of `main`."
      fr: "Fast-forward déplace `main` vers le dernier commit de la branche source : chaque commit de travail en cours apparaît dans l'historique de `main`."
    b:
      en: "A three-way merge keeps all the individual commits and adds a merge commit."
      fr: "Une fusion three-way conserve tous les commits individuels et ajoute un commit de fusion."
    d:
      en: "A local merge pushed to `main` bypasses the approval rules of the pull request."
      fr: "Une fusion locale poussée sur `main` contourne les règles d'approbation de la demande d'extraction."
references:
  - title: Merge a pull request in an AWS CodeCommit repository
    url: https://docs.aws.amazon.com/codecommit/latest/userguide/how-to-merge-pull-request.html
