id: dvac03-3b-pkg-image-update-code
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function at AnyCompany is deployed from the container image 111122223333.dkr.ecr.eu-west-1.amazonaws.com/resizer:prod. To pick up an updated AWS base image, a developer rebuilds the image and pushes it to Amazon ECR with the same prod tag. Hours later, the function still runs the previous image.

    Which action will make the function run the rebuilt image?
  fr: |
    Une fonction AWS Lambda d'AnyCompany est déployée à partir de l'image de conteneur 111122223333.dkr.ecr.eu-west-1.amazonaws.com/resizer:prod. Pour prendre en compte une image de base AWS mise à jour, un développeur reconstruit l'image et l'envoie dans Amazon ECR avec la même balise prod. Des heures plus tard, la fonction exécute toujours l'image précédente.

    Quelle action permet à la fonction d'exécuter l'image reconstruite ?
body:
  options:
    - { id: a, text: { en: "Run aws lambda publish-version for the function.", fr: "Exécuter aws lambda publish-version pour la fonction." } }
    - { id: b, text: { en: "Change the memory setting of the function so that Lambda recycles its execution environments.", fr: "Modifier le paramètre de mémoire de la fonction afin que Lambda recycle ses environnements d'exécution." } }
    - { id: c, text: { en: "Turn on tag immutability for the resizer repository.", fr: "Activer l'immuabilité des balises pour le référentiel resizer." } }
    - { id: d, text: { en: "Run aws lambda update-function-code with --image-uri set to the image URI.", fr: "Exécuter aws lambda update-function-code avec --image-uri défini sur l'URI de l'image." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Pushing a new image to the repository does not change the function. AWS documents that to use an updated base image you rebuild the container image and then update the function code, which makes Lambda fetch and optimize the new image before the function becomes Active again."
    fr: "Envoyer une nouvelle image dans le référentiel ne modifie pas la fonction. AWS indique que pour utiliser une image de base mise à jour, il faut reconstruire l'image de conteneur puis mettre à jour le code de la fonction, ce qui conduit Lambda à récupérer et optimiser la nouvelle image avant que la fonction ne redevienne Active."
  options:
    a:
      en: "publish-version snapshots the function's current code and configuration, which still reference the previous image."
      fr: "publish-version prend un instantané du code et de la configuration actuels de la fonction, qui référencent toujours l'image précédente."
    b:
      en: "A configuration change does not update the function code, so new environments still use the previous image."
      fr: "Une modification de configuration ne met pas à jour le code de la fonction : les nouveaux environnements utilisent toujours l'image précédente."
    c:
      en: "Tag immutability prevents future pushes from overwriting tags; it does not deploy anything to the function."
      fr: "L'immuabilité des balises empêche les envois futurs d'écraser des balises ; elle ne déploie rien dans la fonction."
references:
  - title: Create a Lambda Event Function using a container image
    url: https://docs.aws.amazon.com/lambda/latest/dg/images-create.html
