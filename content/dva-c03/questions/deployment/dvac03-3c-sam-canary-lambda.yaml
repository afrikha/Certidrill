id: dvac03-3c-sam-canary-lambda
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer deploys an AWS Lambda function with AWS SAM. Clients invoke the function through an alias named `live`. For each new release, 10% of the traffic must go to the new version for 10 minutes, and then all the traffic must move to the new version. AWS CodeDeploy must manage the traffic shift.

    Which change to the function in the SAM template will meet these requirements?
  fr: |
    Un développeur déploie une fonction AWS Lambda avec AWS SAM. Les clients appellent la fonction via un alias nommé `live`. Pour chaque nouvelle version, 10 % du trafic doit aller vers la nouvelle version pendant 10 minutes, puis la totalité du trafic doit passer à la nouvelle version. AWS CodeDeploy doit gérer le transfert du trafic.

    Quelle modification de la fonction dans le modèle SAM répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add `AutoPublishAlias: live` and a `DeploymentPreference` with `Type: Canary10Percent10Minutes`.", fr: "Ajouter `AutoPublishAlias: live` et un `DeploymentPreference` avec `Type: Canary10Percent10Minutes`." }
    - id: b
      text: { en: "Add `AutoPublishAlias: live` and a `DeploymentPreference` with `Type: Linear10PercentEvery10Minutes`.", fr: "Ajouter `AutoPublishAlias: live` et un `DeploymentPreference` avec `Type: Linear10PercentEvery10Minutes`." }
    - id: c
      text: { en: "Add `AutoPublishAlias: live` and a `ProvisionedConcurrencyConfig` sized to 10% of the expected concurrency.", fr: "Ajouter `AutoPublishAlias: live` et un `ProvisionedConcurrencyConfig` dimensionné à 10 % de la simultanéité attendue." }
    - id: d
      text: { en: "Add `AutoPublishAlias: live` and a `DeploymentPreference` with `Type: AllAtOnce` and a PreTraffic hook that waits 10 minutes.", fr: "Ajouter `AutoPublishAlias: live` et un `DeploymentPreference` avec `Type: AllAtOnce` et un hook PreTraffic qui attend 10 minutes." }
answer: { optionId: a }
explanation:
  correct:
    en: "AutoPublishAlias publishes a new version on each code change and points the alias at it, and DeploymentPreference makes CodeDeploy shift the alias traffic. A canary type shifts traffic in two increments: Canary10Percent10Minutes sends 10% to the new version, then the remaining 90% after 10 minutes."
    fr: "AutoPublishAlias publie une nouvelle version à chaque modification du code et y fait pointer l'alias, et DeploymentPreference fait transférer le trafic de l'alias par CodeDeploy. Un type canary transfère le trafic en deux incréments : Canary10Percent10Minutes envoie 10 % vers la nouvelle version, puis les 90 % restants au bout de 10 minutes."
  options:
    b:
      en: "A linear type adds 10% every 10 minutes, so the full shift takes 100 minutes instead of one 10-minute step."
      fr: "Un type linéaire ajoute 10 % toutes les 10 minutes : le transfert complet prend 100 minutes au lieu d'une seule étape de 10 minutes."
    c:
      en: "Provisioned concurrency keeps execution environments initialized; it does not split traffic between versions and does not use CodeDeploy."
      fr: "La simultanéité provisionnée maintient des environnements d'exécution initialisés ; elle ne répartit pas le trafic entre versions et n'utilise pas CodeDeploy."
    d:
      en: "A PreTraffic hook runs before any traffic shifts; AllAtOnce then moves all the traffic in one step, with no 10% phase."
      fr: "Un hook PreTraffic s'exécute avant tout transfert de trafic ; AllAtOnce déplace ensuite tout le trafic en une seule étape, sans phase à 10 %."
references:
  - title: Deploying serverless applications gradually with AWS SAM
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html
