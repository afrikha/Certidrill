id: dvac03-3b-aitest-bedrock-test-analysis
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs integration tests in an AWS CodeBuild project. When tests fail, a post_build command runs a Python script that sends the failing test output to one Amazon Bedrock model with the boto3 bedrock-runtime converse() call and attaches the model's summary to the build report. The call fails with an AccessDeniedException. The team wants to follow the principle of least privilege.

    Which change to the CodeBuild service role will meet these requirements?
  fr: |
    AnyCompany exécute des tests d'intégration dans un projet AWS CodeBuild. Lorsque des tests échouent, une commande post_build exécute un script Python qui envoie la sortie des tests en échec à un modèle Amazon Bedrock avec l'appel converse() de bedrock-runtime dans boto3, puis joint le résumé du modèle au rapport de build. L'appel échoue avec une erreur AccessDeniedException. L'équipe veut respecter le principe du moindre privilège.

    Quelle modification du rôle de service CodeBuild répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Allow bedrock:InvokeModel on the ARN of the model that the script uses.", fr: "Autoriser bedrock:InvokeModel sur l'ARN du modèle utilisé par le script." } }
    - { id: b, text: { en: "Allow bedrock:InvokeModelWithResponseStream on the ARN of the model that the script uses.", fr: "Autoriser bedrock:InvokeModelWithResponseStream sur l'ARN du modèle utilisé par le script." } }
    - { id: c, text: { en: "Allow bedrock:* on all resources.", fr: "Autoriser bedrock:* sur toutes les ressources." } }
    - { id: d, text: { en: "Allow bedrock:CreateModelInvocationJob on the ARN of the model that the script uses.", fr: "Autoriser bedrock:CreateModelInvocationJob sur l'ARN du modèle utilisé par le script." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The Converse operation requires permission for the bedrock:InvokeModel action. Scoping that action to the ARN of the single model used by the script grants only what the build step needs."
    fr: "L'opération Converse nécessite l'autorisation de l'action bedrock:InvokeModel. Limiter cette action à l'ARN du seul modèle utilisé par le script n'accorde que ce dont l'étape de build a besoin."
  options:
    b:
      en: "bedrock:InvokeModelWithResponseStream is the permission for ConverseStream; the script calls the non-streaming Converse operation."
      fr: "bedrock:InvokeModelWithResponseStream est l'autorisation de ConverseStream ; le script appelle l'opération Converse sans streaming."
    c:
      en: "bedrock:* on all resources would make the call work but grants far more than the build needs, which breaks least privilege."
      fr: "bedrock:* sur toutes les ressources ferait fonctionner l'appel, mais accorde bien plus que ce dont le build a besoin, ce qui enfreint le moindre privilège."
    d:
      en: "CreateModelInvocationJob starts batch inference jobs; it does not authorize a Converse call."
      fr: "CreateModelInvocationJob démarre des tâches d'inférence par lots ; il n'autorise pas un appel Converse."
references:
  - title: Inference using Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
