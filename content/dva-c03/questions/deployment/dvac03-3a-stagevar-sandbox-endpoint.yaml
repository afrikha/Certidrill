id: dvac03-3a-stagevar-sandbox-endpoint
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A REST API in Amazon API Gateway uses an HTTP integration to call a payment provider. The provider offers a simulated sandbox at `sandbox.pay.example.com` and its live service at `api.pay.example.com`. The test stage must send requests to the sandbox and the prod stage to the live service, with one API definition for both stages.

    Which solution will meet these requirements?
  fr: |
    Une API REST Amazon API Gateway utilise une intégration HTTP pour appeler un prestataire de paiement. Le prestataire propose un environnement de simulation (sandbox) à `sandbox.pay.example.com` et son service réel à `api.pay.example.com`. L'étape test doit envoyer les requêtes vers la sandbox et l'étape prod vers le service réel, avec une seule définition d'API pour les deux étapes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use a stage variable so that the test stage uses a mock integration and the prod stage uses the HTTP integration.", fr: "Utiliser une variable d'étape pour que l'étape test utilise une intégration fictive (mock) et l'étape prod l'intégration HTTP." } }
    - { id: b, text: { en: "Create two REST APIs, one for each provider host, and deploy each API to its own stage.", fr: "Créer deux API REST, une pour chaque hôte du prestataire, et déployer chaque API dans sa propre étape." } }
    - { id: c, text: { en: "Set the integration endpoint URL to https://${stageVariables.payHost}/v1/charges and set payHost in each stage.", fr: "Définir l'URL du point de terminaison de l'intégration sur https://${stageVariables.payHost}/v1/charges et définir payHost dans chaque étape." } }
    - { id: d, text: { en: "Enable a canary on the prod stage with 0 percent of traffic that points to the sandbox host.", fr: "Activer un canary sur l'étape prod avec 0 % du trafic qui pointe vers l'hôte de la sandbox." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Stage variables can be used in the endpoint URL of an HTTP integration, so the same API definition calls a different web host in each stage. The test stage sets payHost to the sandbox host and the prod stage to the live host."
    fr: "Les variables d'étape peuvent être utilisées dans l'URL du point de terminaison d'une intégration HTTP : la même définition d'API appelle un hôte web différent dans chaque étape. L'étape test définit payHost sur l'hôte de la sandbox et l'étape prod sur l'hôte réel."
  options:
    a:
      en: "A stage variable cannot switch the integration type of a method between stages; it can only change values such as the endpoint."
      fr: "Une variable d'étape ne peut pas changer le type d'intégration d'une méthode selon l'étape ; elle peut seulement modifier des valeurs comme le point de terminaison."
    b:
      en: "Two APIs mean two definitions to keep in sync, which breaks the single definition requirement."
      fr: "Deux API impliquent deux définitions à synchroniser, ce qui enfreint l'exigence d'une définition unique."
    d:
      en: "A canary splits the traffic of one stage; with 0 percent it sends nothing, and the test stage still calls the live host."
      fr: "Un canary répartit le trafic d'une seule étape ; à 0 % il n'envoie rien, et l'étape test appelle toujours l'hôte réel."
references:
  - title: Use stage variables for a REST API in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/stage-variables.html
