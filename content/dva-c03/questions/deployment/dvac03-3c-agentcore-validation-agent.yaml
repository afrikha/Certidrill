id: dvac03-3c-agentcore-validation-agent
objective: "3.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has built an AI agent that runs post-deployment checks on its staging environment. The agent calls existing AWS Lambda functions that query health endpoints and verify test data, and the pipeline invokes the agent after each deployment. The company wants to host the agent in a serverless environment with session isolation, and to expose the existing Lambda functions to the agent as tools without writing tool server code.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise a créé un agent d'IA qui exécute des vérifications post-déploiement sur son environnement intermédiaire. L'agent appelle des fonctions AWS Lambda existantes qui interrogent des points de terminaison de santé et vérifient des données de test, et le pipeline appelle l'agent après chaque déploiement. L'entreprise veut héberger l'agent dans un environnement sans serveur avec isolation des sessions, et exposer les fonctions Lambda existantes à l'agent en tant qu'outils sans écrire de code de serveur d'outils.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Host the agent on Amazon Bedrock AgentCore Runtime, and use AgentCore Gateway to expose the Lambda functions as MCP-compatible tools.", fr: "Héberger l'agent sur Amazon Bedrock AgentCore Runtime, et utiliser AgentCore Gateway pour exposer les fonctions Lambda en tant qu'outils compatibles MCP." }
    - id: b
      text: { en: "Run the agent as an Amazon ECS service on AWS Fargate, and write an MCP server that wraps each Lambda function as a tool.", fr: "Exécuter l'agent comme service Amazon ECS sur AWS Fargate, et écrire un serveur MCP qui encapsule chaque fonction Lambda en tant qu'outil." }
    - id: c
      text: { en: "Run the agent on Amazon EC2 instances in an Auto Scaling group, and write an MCP server that wraps each Lambda function as a tool.", fr: "Exécuter l'agent sur des instances Amazon EC2 d'un groupe Auto Scaling, et écrire un serveur MCP qui encapsule chaque fonction Lambda en tant qu'outil." }
    - id: d
      text: { en: "Run the agent in an AWS CodeBuild project, and hand-write tool definitions that call each Lambda function through the AWS SDK.", fr: "Exécuter l'agent dans un projet AWS CodeBuild, et écrire à la main des définitions d'outils qui appellent chaque fonction Lambda via le kit SDK AWS." }
answer: { optionId: a }
explanation:
  correct:
    en: "AgentCore Runtime is a serverless environment for deploying and scaling agents with session isolation. AgentCore Gateway converts existing APIs and Lambda functions into MCP-compatible tools, so the agent can call them without custom tool server code."
    fr: "AgentCore Runtime est un environnement sans serveur qui déploie et met à l'échelle des agents avec isolation des sessions. AgentCore Gateway convertit des API et des fonctions Lambda existantes en outils compatibles MCP : l'agent peut les appeler sans code de serveur d'outils personnalisé."
  options:
    b:
      en: "Fargate removes server management, but the team must write and operate an MCP server and build session isolation itself."
      fr: "Fargate supprime la gestion des serveurs, mais l'équipe doit écrire et exploiter un serveur MCP et construire elle-même l'isolation des sessions."
    c:
      en: "EC2 instances are not serverless, and the team must also write and operate the MCP server."
      fr: "Les instances EC2 ne sont pas sans serveur, et l'équipe doit aussi écrire et exploiter le serveur MCP."
    d:
      en: "Hand-written tool definitions are the tool code that the company wants to avoid, and a build project is not an agent hosting environment with session isolation."
      fr: "Des définitions d'outils écrites à la main sont justement le code d'outils que l'entreprise veut éviter, et un projet de build n'est pas un environnement d'hébergement d'agents avec isolation des sessions."
references:
  - title: Overview - Amazon Bedrock AgentCore
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
