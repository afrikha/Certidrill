id: dvac03-3b-cd-file-exists-overwrite
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys a web application to Amazon EC2 instances with AWS CodeDeploy in-place deployments. During an incident, an operator manually copied a patched file to /var/www/app/config.php on every instance. The next deployment fails at the Install event because that file already exists and was not part of the previous successful deployment. The version of the file in the new revision must be used, and the team wants no new scripts.

    Which change will meet these requirements?
  fr: |
    AnyCompany déploie une application web sur des instances Amazon EC2 avec des déploiements sur place AWS CodeDeploy. Pendant un incident, un opérateur a copié à la main un fichier corrigé vers /var/www/app/config.php sur chaque instance. Le déploiement suivant échoue à l'événement Install, car ce fichier existe déjà et ne faisait pas partie du déploiement précédent réussi. La version du fichier de la nouvelle révision doit être utilisée, et l'équipe ne veut aucun nouveau script.

    Quelle modification répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add file_exists_behavior: RETAIN to the AppSpec file.", fr: "Ajouter file_exists_behavior: RETAIN au fichier AppSpec." } }
    - { id: b, text: { en: "Add file_exists_behavior: OVERWRITE to the AppSpec file.", fr: "Ajouter file_exists_behavior: OVERWRITE au fichier AppSpec." } }
    - { id: c, text: { en: "Add a permissions section for /var/www/app to the AppSpec file.", fr: "Ajouter une section permissions pour /var/www/app au fichier AppSpec." } }
    - { id: d, text: { en: "Create the deployment with the --ignore-application-stop-failures option.", fr: "Créer le déploiement avec l'option --ignore-application-stop-failures." } }
answer: { optionId: b }
explanation:
  correct:
    en: "file_exists_behavior tells CodeDeploy what to do with files that exist in a target location but were not part of the previous successful deployment. The default, DISALLOW, fails the deployment; OVERWRITE replaces the file on the instance with the version from the revision being deployed."
    fr: "file_exists_behavior indique à CodeDeploy que faire des fichiers qui existent dans un emplacement cible mais ne faisaient pas partie du déploiement précédent réussi. La valeur par défaut, DISALLOW, fait échouer le déploiement ; OVERWRITE remplace le fichier de l'instance par la version de la révision en cours de déploiement."
  options:
    a:
      en: "RETAIN keeps the manually copied file and uses it in the new deployment, so the revision's version would not be used."
      fr: "RETAIN conserve le fichier copié à la main et l'utilise dans le nouveau déploiement : la version de la révision ne serait pas utilisée."
    c:
      en: "The permissions section sets ownership and modes of installed files; it does not resolve a conflict with an existing file."
      fr: "La section permissions définit le propriétaire et les modes des fichiers installés ; elle ne résout pas un conflit avec un fichier existant."
    d:
      en: "This option only ignores failures of ApplicationStop, BeforeBlockTraffic, and AfterBlockTraffic, not of the Install event."
      fr: "Cette option ignore uniquement les échecs d'ApplicationStop, BeforeBlockTraffic et AfterBlockTraffic, pas ceux de l'événement Install."
references:
  - title: AppSpec 'files' section (EC2/On-Premises deployments only)
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-files.html
