id: dvac03-3b-cd-hook-afterinstall
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany deploys a web application to Amazon EC2 instances with AWS CodeDeploy in-place deployments. Each revision contains a script, migrate.sh, that configures the application by reading files from the revision. The script must run after CodeDeploy copies the revision files to their destination on the instance and before the application is started.

    In which lifecycle event hook of the AppSpec file should the developer run migrate.sh?
  fr: |
    AnyCompany déploie une application web sur des instances Amazon EC2 avec des déploiements sur place AWS CodeDeploy. Chaque révision contient un script, migrate.sh, qui configure l'application en lisant des fichiers de la révision. Le script doit s'exécuter après que CodeDeploy a copié les fichiers de la révision vers leur destination sur l'instance, et avant le démarrage de l'application.

    Dans quel hook d'événement de cycle de vie du fichier AppSpec le développeur doit-il exécuter migrate.sh ?
body:
  options:
    - { id: a, text: "BeforeInstall" }
    - { id: b, text: "AfterInstall" }
    - { id: c, text: "ApplicationStart" }
    - { id: d, text: "ValidateService" }
answer: { optionId: b }
explanation:
  correct:
    en: "In an in-place EC2 deployment, the order is ApplicationStop, DownloadBundle, BeforeInstall, Install, AfterInstall, ApplicationStart, and ValidateService. Install is reserved for CodeDeploy, which copies the files, so AfterInstall is the first scriptable hook in which the new files are in place and the application has not started."
    fr: "Dans un déploiement EC2 sur place, l'ordre est ApplicationStop, DownloadBundle, BeforeInstall, Install, AfterInstall, ApplicationStart et ValidateService. Install est réservé à CodeDeploy, qui copie les fichiers : AfterInstall est donc le premier hook scriptable dans lequel les nouveaux fichiers sont en place sans que l'application ait démarré."
  options:
    a:
      en: "BeforeInstall runs before the Install event copies the revision files, so the new files are not yet at their destination."
      fr: "BeforeInstall s'exécute avant que l'événement Install ne copie les fichiers de la révision : les nouveaux fichiers ne sont pas encore à leur destination."
    c:
      en: "ApplicationStart is where the application is started; running the script there does not guarantee it finishes before the start."
      fr: "ApplicationStart est l'événement dans lequel l'application est démarrée ; y exécuter le script ne garantit pas qu'il se termine avant le démarrage."
    d:
      en: "ValidateService runs after the application has started, to check that the deployment succeeded."
      fr: "ValidateService s'exécute après le démarrage de l'application, pour vérifier que le déploiement a réussi."
references:
  - title: AppSpec 'hooks' section
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html
