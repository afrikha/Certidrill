id: dvac03-3a-private-api
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is building an internal inventory API with Amazon API Gateway. Only applications that run in one of the company's VPCs may call the API. The API must not be reachable from the internet.

    Which solution will meet these requirements?
  fr: |
    AnyCompany crée une API interne d'inventaire avec Amazon API Gateway. Seules les applications qui s'exécutent dans l'un des VPC de l'entreprise peuvent appeler l'API. L'API ne doit pas être accessible depuis Internet.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a private REST API, create an interface VPC endpoint for API Gateway in the VPC, and restrict the resource policy with aws:SourceVpce.", fr: "Créer une API REST privée, créer un point de terminaison de VPC d'interface pour API Gateway dans le VPC, et restreindre la politique de ressource avec aws:SourceVpce." } }
    - { id: b, text: { en: "Create a Regional REST API and attach a security group that allows only the CIDR range of the VPC.", fr: "Créer une API REST régionale et lui attacher un groupe de sécurité qui n'autorise que la plage CIDR du VPC." } }
    - { id: c, text: { en: "Create an edge-optimized REST API and add an AWS WAF geographic match rule that blocks other countries.", fr: "Créer une API REST optimisée pour la périphérie et ajouter une règle de correspondance géographique AWS WAF qui bloque les autres pays." } }
    - { id: d, text: { en: "Create an HTTP API with a private integration that reaches the backend through a VPC link.", fr: "Créer une API HTTP avec une intégration privée qui atteint le backend par un lien VPC." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A private REST API can be called only from a VPC through an interface VPC endpoint. A resource policy with aws:SourceVpc or aws:SourceVpce conditions restricts access to the chosen VPCs or endpoints."
    fr: "Une API REST privée ne peut être appelée que depuis un VPC, par un point de terminaison de VPC d'interface. Une politique de ressource avec des conditions aws:SourceVpc ou aws:SourceVpce limite l'accès aux VPC ou aux points de terminaison choisis."
  options:
    b:
      en: "API Gateway APIs do not use security groups, and a Regional API has a public endpoint."
      fr: "Les API API Gateway n'utilisent pas de groupes de sécurité, et une API régionale a un point de terminaison public."
    c:
      en: "An edge-optimized API is public by design; a geographic rule still lets anyone in the allowed country call it."
      fr: "Une API optimisée pour la périphérie est publique par nature ; une règle géographique laisse toujours n'importe qui dans le pays autorisé l'appeler."
    d:
      en: "A VPC link lets the API reach a private backend, but the HTTP API endpoint itself stays public; private endpoints exist only for REST APIs."
      fr: "Un lien VPC permet à l'API d'atteindre un backend privé, mais le point de terminaison de l'API HTTP reste public ; les points de terminaison privés n'existent que pour les API REST."
references:
  - title: Private REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-private-apis.html
