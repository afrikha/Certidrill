id: dvac03-3a-codecommit-double-run
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CodePipeline pipeline has an AWS CodeCommit source action. The source action configuration does not include the PollForSourceChanges parameter. A developer adds an Amazon EventBridge rule that starts the pipeline when the `main` branch changes. Since then, every push to `main` starts two pipeline executions. The pipeline must keep event-based change detection.

    Which solution will meet these requirements?
  fr: |
    Un pipeline AWS CodePipeline a une action source AWS CodeCommit. La configuration de l'action source ne contient pas le paramètre PollForSourceChanges. Un développeur ajoute une règle Amazon EventBridge qui démarre le pipeline lorsque la branche `main` change. Depuis, chaque transfert vers `main` démarre deux exécutions du pipeline. Le pipeline doit conserver la détection des modifications basée sur les événements.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Delete the EventBridge rule so that only one change detection method starts the pipeline.", fr: "Supprimer la règle EventBridge pour qu'une seule méthode de détection des modifications démarre le pipeline." } }
    - { id: b, text: { en: "Change the execution mode of the pipeline to SUPERSEDED so that the second execution replaces the first.", fr: "Passer le mode d'exécution du pipeline à SUPERSEDED pour que la seconde exécution remplace la première." } }
    - { id: c, text: { en: "Add a manual approval action after the source stage so that only one of the two executions continues.", fr: "Ajouter une action d'approbation manuelle après l'étape source pour qu'une seule des deux exécutions continue." } }
    - { id: d, text: { en: "Add the PollForSourceChanges parameter with the value false to the source action configuration.", fr: "Ajouter le paramètre PollForSourceChanges avec la valeur false à la configuration de l'action source." } }
answer: { optionId: d }
explanation:
  correct:
    en: "When PollForSourceChanges is omitted, CodePipeline polls the repository by default. With an EventBridge rule as well, each change is detected twice. Setting PollForSourceChanges to false keeps the recommended EventBridge detection and removes the duplicate execution."
    fr: "Lorsque PollForSourceChanges est omis, CodePipeline interroge le référentiel par défaut. Avec une règle EventBridge en plus, chaque modification est détectée deux fois. Définir PollForSourceChanges sur false conserve la détection EventBridge recommandée et supprime l'exécution en double."
  options:
    a:
      en: "Deleting the rule leaves only polling, which is not event-based and is the method AWS recommends moving away from."
      fr: "Supprimer la règle ne laisse que l'interrogation, qui n'est pas basée sur les événements et que AWS recommande d'abandonner."
    b:
      en: "SUPERSEDED mode still starts two executions per change; it only lets the newer one overtake the older one."
      fr: "Le mode SUPERSEDED démarre toujours deux exécutions par modification ; il permet seulement à la plus récente de dépasser la plus ancienne."
    c:
      en: "An approval step hides the symptom with manual work; the pipeline still starts twice for each push."
      fr: "Une étape d'approbation masque le symptôme par un travail manuel ; le pipeline démarre toujours deux fois à chaque transfert."
references:
  - title: Migrate polling pipelines to use event-based change detection
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/update-change-detection.html
