id: dvac03-3a-sam-sync-watch
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer tests a Lambda function against real Amazon DynamoDB tables and IAM permissions in a personal development stack that was deployed with AWS SAM. Each `sam deploy` after a small code change takes several minutes because it goes through AWS CloudFormation. The developer wants code changes to reach the development stack within seconds each time a file is saved. The production stack is deployed by a CI/CD pipeline.

    Which solution will meet these requirements?
  fr: |
    Un développeur teste une fonction Lambda avec de vraies tables Amazon DynamoDB et de vraies autorisations IAM dans une pile de développement personnelle déployée avec AWS SAM. Chaque `sam deploy` après une petite modification du code prend plusieurs minutes, car il passe par AWS CloudFormation. Le développeur veut que les modifications du code atteignent la pile de développement en quelques secondes chaque fois qu'un fichier est enregistré. La pile de production est déployée par un pipeline CI/CD.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run sam deploy --no-confirm-changeset after each change so that the deployment does not wait for confirmation.", fr: "Exécuter sam deploy --no-confirm-changeset après chaque modification pour que le déploiement n'attende pas de confirmation." } }
    - { id: b, text: { en: "Run sam build --cached after each change so that only the modified function is rebuilt.", fr: "Exécuter sam build --cached après chaque modification pour que seule la fonction modifiée soit reconstruite." } }
    - { id: c, text: { en: "Run sam sync --watch against the development stack.", fr: "Exécuter sam sync --watch sur la pile de développement." } }
    - { id: d, text: { en: "Run sam local start-lambda and point the tests at the local endpoint.", fr: "Exécuter sam local start-lambda et faire pointer les tests vers le point de terminaison local." } }
answer: { optionId: c }
explanation:
  correct:
    en: "sam sync --watch watches local files and syncs each change to the AWS Cloud by the quickest method available, using service APIs such as the Lambda API instead of a CloudFormation deployment for code changes. AWS recommends it for development stacks only, with sam deploy or a pipeline for production."
    fr: "sam sync --watch surveille les fichiers locaux et synchronise chaque modification avec le cloud AWS par la méthode la plus rapide disponible, en utilisant des API de service comme l'API Lambda au lieu d'un déploiement CloudFormation pour les modifications du code. AWS le recommande uniquement pour les piles de développement, avec sam deploy ou un pipeline pour la production."
  options:
    a:
      en: "Skipping the confirmation prompt still runs a full CloudFormation change set deployment, which is the slow part."
      fr: "Ignorer l'invite de confirmation exécute toujours un déploiement complet par jeu de modifications CloudFormation, qui est la partie lente."
    b:
      en: "Caching speeds up the build only; deploying the result still goes through CloudFormation."
      fr: "La mise en cache accélère seulement le build ; le déploiement du résultat passe toujours par CloudFormation."
    d:
      en: "A local emulator does not test against the real cloud permissions between resources, which the developer needs."
      fr: "Un émulateur local ne teste pas les vraies autorisations entre ressources dans le cloud, dont le développeur a besoin."
references:
  - title: Introduction to using sam sync to sync to AWS Cloud
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-sync.html
