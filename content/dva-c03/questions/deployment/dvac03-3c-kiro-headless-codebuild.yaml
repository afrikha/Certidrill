id: dvac03-3c-kiro-headless-codebuild
objective: "3.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team wants an AWS CodeBuild action in its pipeline to run the Kiro CLI without user interaction, review the changed code for security issues, and save the review from standard output as a build artifact. The Kiro API key is stored in an AWS Secrets Manager secret named `kiro/api-key`. During the review, the agent only needs to read files and search the code.

    Which buildspec configuration is the MOST secure?
  fr: |
    Une équipe veut qu'une action AWS CodeBuild de son pipeline exécute Kiro CLI sans interaction utilisateur, examine le code modifié à la recherche de problèmes de sécurité et enregistre la revue issue de la sortie standard comme artefact de build. La clé d'API Kiro est stockée dans un secret AWS Secrets Manager nommé `kiro/api-key`. Pendant la revue, l'agent a seulement besoin de lire des fichiers et de rechercher dans le code.

    Quelle configuration de buildspec est la PLUS sécurisée ?
body:
  options:
    - id: a
      text: { en: "Put the key in `env: variables` as KIRO_API_KEY and run `kiro-cli chat --v3 --no-interactive --trust-all-tools` with the review prompt.", fr: "Placer la clé dans `env: variables` sous le nom KIRO_API_KEY et exécuter `kiro-cli chat --v3 --no-interactive --trust-all-tools` avec l'invite de revue." }
    - id: b
      text: { en: "Map KIRO_API_KEY to the secret in `env: secrets-manager` and run `kiro-cli chat --v3 --no-interactive --trust-tools=read_file,grep_search` with the review prompt.", fr: "Associer KIRO_API_KEY au secret dans `env: secrets-manager` et exécuter `kiro-cli chat --v3 --no-interactive --trust-tools=read_file,grep_search` avec l'invite de revue." }
    - id: c
      text: { en: "Map KIRO_API_KEY to the secret in `env: secrets-manager` and run `kiro-cli chat --v3 --no-interactive --trust-all-tools` with the review prompt.", fr: "Associer KIRO_API_KEY au secret dans `env: secrets-manager` et exécuter `kiro-cli chat --v3 --no-interactive --trust-all-tools` avec l'invite de revue." }
    - id: d
      text: { en: "Map KIRO_API_KEY to the secret in `env: secrets-manager` and list it under `env: exported-variables` so that later stages can reuse the key.", fr: "Associer KIRO_API_KEY au secret dans `env: secrets-manager` et le lister sous `env: exported-variables` afin que les étapes suivantes puissent réutiliser la clé." }
answer: { optionId: b }
explanation:
  correct:
    en: "Kiro CLI headless mode runs a prompt with `--no-interactive` and authenticates with the KIRO_API_KEY environment variable. Because nobody can approve tool calls, tools must be pre-approved, and `--trust-tools` with only the read and search tools follows least privilege. The `env: secrets-manager` mapping reads the key from Secrets Manager at build time instead of storing it in plaintext."
    fr: "Le mode headless de Kiro CLI exécute une invite avec `--no-interactive` et s'authentifie avec la variable d'environnement KIRO_API_KEY. Comme personne ne peut approuver les appels d'outils, ceux-ci doivent être pré-approuvés, et `--trust-tools` limité aux outils de lecture et de recherche respecte le moindre privilège. Le mappage `env: secrets-manager` lit la clé dans Secrets Manager au moment du build au lieu de la stocker en clair."
  options:
    a:
      en: "Values under `env: variables` are plaintext and visible in the console and the CLI, and `--trust-all-tools` lets the agent use every tool."
      fr: "Les valeurs sous `env: variables` sont en clair et visibles dans la console et la CLI, et `--trust-all-tools` permet à l'agent d'utiliser tous les outils."
    c:
      en: "The key is protected, but `--trust-all-tools` lets the agent write files and run commands that the review does not need."
      fr: "La clé est protégée, mais `--trust-all-tools` permet à l'agent d'écrire des fichiers et d'exécuter des commandes dont la revue n'a pas besoin."
    d:
      en: "Secrets Manager values cannot be exported, and passing the key to other stages would expose it; the run also has no Kiro command."
      fr: "Les valeurs Secrets Manager ne peuvent pas être exportées, et transmettre la clé à d'autres étapes l'exposerait ; cette configuration n'exécute en outre aucune commande Kiro."
references:
  - title: Headless mode
    url: https://kiro.dev/docs/cli/headless/
  - title: Build specification reference for CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
