id: dvac03-3b-cd-lambda-appspec-version
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at AnyCompany uses AWS CodeDeploy to shift traffic for the live alias of an AWS Lambda function named pricing. The alias points to version 9. The developer just deployed new code to the function and created a deployment with the following AppSpec file, but the deployment fails.

    ```yaml
    version: 0.0
    Resources:
      - pricingFunction:
          Type: AWS::Lambda::Function
          Properties:
            Name: pricing
            Alias: live
            CurrentVersion: "9"
            TargetVersion: "$LATEST"
    ```

    Which solution will make the deployment shift the live alias to the new code?
  fr: |
    Un développeur d'AnyCompany utilise AWS CodeDeploy pour basculer le trafic de l'alias live d'une fonction AWS Lambda nommée pricing. L'alias pointe vers la version 9. Le développeur vient de déployer du nouveau code dans la fonction et a créé un déploiement avec le fichier AppSpec suivant, mais le déploiement échoue.

    ```yaml
    version: 0.0
    Resources:
      - pricingFunction:
          Type: AWS::Lambda::Function
          Properties:
            Name: pricing
            Alias: live
            CurrentVersion: "9"
            TargetVersion: "$LATEST"
    ```

    Quelle solution permet au déploiement de basculer l'alias live vers le nouveau code ?
body:
  options:
    - { id: a, text: { en: "Remove CurrentVersion so that CodeDeploy reads the current version from the alias.", fr: "Supprimer CurrentVersion afin que CodeDeploy lise la version actuelle depuis l'alias." } }
    - { id: b, text: { en: "Set Alias to $LATEST and TargetVersion to 9.", fr: "Définir Alias sur $LATEST et TargetVersion sur 9." } }
    - { id: c, text: { en: "Replace Name with the unqualified ARN of the function and keep TargetVersion as $LATEST.", fr: "Remplacer Name par l'ARN non qualifié de la fonction et conserver TargetVersion à $LATEST." } }
    - { id: d, text: { en: "Publish a new version of the function and set TargetVersion to that version number.", fr: "Publier une nouvelle version de la fonction et définir TargetVersion sur ce numéro de version." } }
answer: { optionId: d }
explanation:
  correct:
    en: "In a Lambda AppSpec file, name, alias, currentversion, and targetversion are all required, and both version values must be positive integers that identify published versions. CodeDeploy shifts the alias from CurrentVersion to TargetVersion, so the new code must first be published as a version."
    fr: "Dans un fichier AppSpec Lambda, name, alias, currentversion et targetversion sont tous obligatoires, et les deux valeurs de version doivent être des entiers positifs qui identifient des versions publiées. CodeDeploy bascule l'alias de CurrentVersion vers TargetVersion : le nouveau code doit donc d'abord être publié comme version."
  options:
    a:
      en: "CurrentVersion is a required property of the Lambda resources section, and TargetVersion would still be invalid."
      fr: "CurrentVersion est une propriété obligatoire de la section resources pour Lambda, et TargetVersion resterait non valide."
    b:
      en: "$LATEST is not an alias, and targeting version 9 would shift traffic to the code that already runs."
      fr: "$LATEST n'est pas un alias, et cibler la version 9 basculerait le trafic vers le code déjà en service."
    c:
      en: "TargetVersion must be a published version number; $LATEST is not accepted, whatever form the function name takes."
      fr: "TargetVersion doit être un numéro de version publiée ; $LATEST n'est pas accepté, quelle que soit la forme du nom de la fonction."
references:
  - title: AppSpec 'resources' section (Amazon ECS and AWS Lambda deployments only)
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-resources.html
