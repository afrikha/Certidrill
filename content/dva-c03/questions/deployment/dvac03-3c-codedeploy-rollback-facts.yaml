id: dvac03-3c-codedeploy-rollback-facts
objective: "3.3.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS CodeDeploy in-place deployment to Amazon EC2 instances failed, and the deployment group's automatic rollback ran. During the failed deployment, an AfterInstall script created the file `/opt/app/cache/index.db` on each instance, and a BeforeInstall script changed the schema of the application's database.

    Which two statements describe the result of the rollback? (Choose two.)
  fr: |
    Un déploiement sur place AWS CodeDeploy vers des instances Amazon EC2 a échoué, et la restauration automatique du groupe de déploiement s'est exécutée. Pendant le déploiement en échec, un script AfterInstall a créé le fichier `/opt/app/cache/index.db` sur chaque instance, et un script BeforeInstall a modifié le schéma de la base de données de l'application.

    Quelles sont les deux affirmations qui décrivent le résultat de la restauration ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The rollback restores the failed deployment, which keeps its deployment ID.", fr: "La restauration rétablit le déploiement en échec, qui conserve son ID de déploiement." } }
    - { id: b, text: { en: "The rollback is a new deployment, with a new deployment ID, of the last known good revision.", fr: "La restauration est un nouveau déploiement, avec un nouvel ID de déploiement, de la dernière bonne révision connue." } }
    - { id: c, text: { en: "The rollback deletes every file in the destination folders, including files that hook scripts created.", fr: "La restauration supprime tous les fichiers des dossiers de destination, y compris ceux créés par les scripts de hook." } }
    - { id: d, text: { en: "The file that the AfterInstall script created is still on the instances after the rollback.", fr: "Le fichier créé par le script AfterInstall est toujours présent sur les instances après la restauration." } }
    - { id: e, text: { en: "The rollback reverses the database schema change that the BeforeInstall script made.", fr: "La restauration annule la modification du schéma de base de données effectuée par le script BeforeInstall." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "CodeDeploy rolls back by deploying the last known good revision again as a new deployment with a new deployment ID. Before that deployment, it removes only the files listed in its cleanup file, which are the files it installed; files that scripts created during lifecycle events are not listed and stay on the instances."
    fr: "CodeDeploy effectue une restauration en redéployant la dernière bonne révision connue sous la forme d'un nouveau déploiement doté d'un nouvel ID. Avant ce déploiement, il ne supprime que les fichiers listés dans son fichier de nettoyage, c'est-à-dire les fichiers qu'il a installés ; les fichiers créés par des scripts pendant les événements de cycle de vie n'y figurent pas et restent sur les instances."
  options:
    a:
      en: "CodeDeploy does not restore an earlier deployment; it creates a new one."
      fr: "CodeDeploy ne rétablit pas un déploiement antérieur ; il en crée un nouveau."
    c:
      en: "Only the files in the cleanup file are removed, not every file in the destination folders."
      fr: "Seuls les fichiers du fichier de nettoyage sont supprimés, pas tous les fichiers des dossiers de destination."
    e:
      en: "CodeDeploy does not undo the side effects of scripts, such as database changes; the scripts must handle that."
      fr: "CodeDeploy n'annule pas les effets de bord des scripts, comme les modifications de base de données ; c'est aux scripts de les gérer."
references:
  - title: Redeploy and roll back a deployment with CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployments-rollback-and-redeploy.html
