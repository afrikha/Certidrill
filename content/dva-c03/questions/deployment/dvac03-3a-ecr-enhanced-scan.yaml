id: dvac03-3a-ecr-enhanced-scan
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores the images of its Python and Node.js microservices in Amazon ECR. The security team requires that the images be checked for vulnerabilities in both operating system packages and programming language packages. Findings must be updated automatically when new vulnerabilities are published, even for images that were pushed months ago.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke les images de ses microservices Python et Node.js dans Amazon ECR. L'équipe de sécurité exige que les images soient vérifiées pour détecter les vulnérabilités des packages du système d'exploitation et des packages des langages de programmation. Les résultats doivent être mis à jour automatiquement lorsque de nouvelles vulnérabilités sont publiées, même pour des images transférées il y a plusieurs mois.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on basic scanning with the scan on push frequency for all repositories.", fr: "Activer l'analyse de base avec la fréquence d'analyse lors du transfert pour tous les référentiels." } }
    - { id: b, text: { en: "Turn on basic scanning and start a manual scan of every image each week.", fr: "Activer l'analyse de base et lancer chaque semaine une analyse manuelle de chaque image." } }
    - { id: c, text: { en: "Turn on tag immutability so that scanned images cannot be replaced by unscanned ones.", fr: "Activer l'immuabilité des balises pour que les images analysées ne puissent pas être remplacées par des images non analysées." } }
    - { id: d, text: { en: "Turn on enhanced scanning with Amazon Inspector and the continuous scanning frequency.", fr: "Activer l'analyse améliorée avec Amazon Inspector et la fréquence d'analyse continue." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Enhanced scanning integrates Amazon ECR with Amazon Inspector to scan for operating system and programming language package vulnerabilities. With continuous scanning, findings are updated as new vulnerabilities appear, and Amazon Inspector sends events to EventBridge."
    fr: "L'analyse améliorée intègre Amazon ECR à Amazon Inspector pour rechercher les vulnérabilités des packages du système d'exploitation et des langages de programmation. Avec l'analyse continue, les résultats sont mis à jour à mesure que de nouvelles vulnérabilités apparaissent, et Amazon Inspector envoie des événements à EventBridge."
  options:
    a:
      en: "Basic scanning covers only operating system vulnerabilities, and scan on push checks an image only when it is pushed."
      fr: "L'analyse de base ne couvre que les vulnérabilités du système d'exploitation, et l'analyse lors du transfert ne vérifie une image qu'au moment de son transfert."
    b:
      en: "Manual basic scans still miss programming language packages and are not automatic."
      fr: "Les analyses de base manuelles ignorent toujours les packages des langages de programmation et ne sont pas automatiques."
    c:
      en: "Tag immutability prevents tag overwrites; it does not scan images."
      fr: "L'immuabilité des balises empêche l'écrasement des balises ; elle n'analyse pas les images."
references:
  - title: Scan images for software vulnerabilities in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning.html
