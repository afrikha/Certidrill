id: dvac03-3a-codebuild-pr-webhook
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team hosts a service in a GitHub repository. An AWS CodeBuild project runs the unit tests. The tests must run when a pull request that targets the `main` branch is opened or receives new commits. Pull requests that target other branches must not start a build.

    Which webhook filter group will meet these requirements?
  fr: |
    Une équipe héberge un service dans un référentiel GitHub. Un projet AWS CodeBuild exécute les tests unitaires. Les tests doivent s'exécuter lorsqu'une demande d'extraction (pull request) qui cible la branche `main` est ouverte ou reçoit de nouveaux commits. Les demandes d'extraction qui ciblent d'autres branches ne doivent pas démarrer de build.

    Quel groupe de filtres de webhook répond à ces exigences ?
body:
  options:
    - { id: a, text: "EVENT: PULL_REQUEST_CREATED, PULL_REQUEST_UPDATED — BASE_REF: ^refs/heads/main$" }
    - { id: b, text: "EVENT: PUSH — HEAD_REF: ^refs/heads/main$" }
    - { id: c, text: "EVENT: PULL_REQUEST_MERGED — BASE_REF: ^refs/heads/main$" }
    - { id: d, text: "EVENT: PULL_REQUEST_CREATED, PULL_REQUEST_UPDATED — HEAD_REF: ^refs/heads/main$" }
answer: { optionId: a }
explanation:
  correct:
    en: "PULL_REQUEST_CREATED and PULL_REQUEST_UPDATED cover a pull request that is opened or receives new commits. BASE_REF, which works only with pull request events, matches the branch that the pull request targets, so only pull requests into main start a build; all filters of the group must match."
    fr: "PULL_REQUEST_CREATED et PULL_REQUEST_UPDATED couvrent une demande d'extraction ouverte ou qui reçoit de nouveaux commits. BASE_REF, utilisable seulement avec les événements de demande d'extraction, correspond à la branche ciblée par la demande : seules les demandes vers main démarrent un build, car tous les filtres du groupe doivent correspondre."
  options:
    b:
      en: "PUSH with a HEAD_REF of main builds after code lands on main, not when pull requests are opened or updated."
      fr: "PUSH avec HEAD_REF sur main déclenche un build une fois le code arrivé sur main, pas à l'ouverture ou à la mise à jour des demandes d'extraction."
    c:
      en: "PULL_REQUEST_MERGED fires only when the pull request is merged, too late to test the proposed changes."
      fr: "PULL_REQUEST_MERGED ne se déclenche qu'à la fusion de la demande, trop tard pour tester les modifications proposées."
    d:
      en: "HEAD_REF matches the source branch of the pull request, so this group starts builds only for pull requests whose source branch is main."
      fr: "HEAD_REF correspond à la branche source de la demande : ce groupe ne démarre des builds que pour les demandes dont la branche source est main."
references:
  - title: GitHub webhook events
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/github-webhook.html
