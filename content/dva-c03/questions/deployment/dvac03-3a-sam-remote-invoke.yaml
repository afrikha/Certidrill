id: dvac03-3a-sam-remote-invoke
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pipeline deploys an AWS SAM application to a stack named `orders-test`. The template contains several functions, including one with the logical ID `OrderFunction`. After the deployment, an integration test step must invoke the deployed `OrderFunction` in the AWS Cloud with the event in `events/order.json`, without looking up the physical function name.

    Which command should the test step run?
  fr: |
    Un pipeline déploie une application AWS SAM dans une pile nommée `orders-test`. Le modèle contient plusieurs fonctions, dont une avec l'ID logique `OrderFunction`. Après le déploiement, une étape de test d'intégration doit appeler la fonction `OrderFunction` déployée dans le cloud AWS avec l'événement de `events/order.json`, sans rechercher le nom physique de la fonction.

    Quelle commande l'étape de test doit-elle exécuter ?
body:
  options:
    - { id: a, text: "sam remote invoke OrderFunction --stack-name orders-test --event-file events/order.json" }
    - { id: b, text: "sam local invoke OrderFunction --event events/order.json" }
    - { id: c, text: "aws lambda invoke --function-name OrderFunction --payload fileb://events/order.json out.json" }
    - { id: d, text: "sam local start-lambda --template template.yaml --env-vars events/order.json" }
answer: { optionId: a }
explanation:
  correct:
    en: "sam remote invoke sends an event to a Lambda function that is deployed in the AWS Cloud. When the function is named by its logical ID, the --stack-name option tells the AWS SAM CLI which stack to resolve it in, and --event-file reads the event from a file."
    fr: "sam remote invoke envoie un événement à une fonction Lambda déployée dans le cloud AWS. Lorsque la fonction est désignée par son ID logique, l'option --stack-name indique à l'AWS SAM CLI dans quelle pile la résoudre, et --event-file lit l'événement depuis un fichier."
  options:
    b:
      en: "sam local invoke runs the function code in a local container, not the deployed function in the AWS Cloud."
      fr: "sam local invoke exécute le code de la fonction dans un conteneur local, pas la fonction déployée dans le cloud AWS."
    c:
      en: "The Lambda API expects the function name or ARN; the logical ID of the template is not the name of the deployed function."
      fr: "L'API Lambda attend le nom ou l'ARN de la fonction ; l'ID logique du modèle n'est pas le nom de la fonction déployée."
    d:
      en: "sam local start-lambda starts a local emulator, and --env-vars takes environment variable overrides, not an event."
      fr: "sam local start-lambda démarre un émulateur local, et --env-vars prend des valeurs de variables d'environnement, pas un événement."
references:
  - title: Introduction to testing in the cloud with sam remote invoke
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-remote-invoke.html
