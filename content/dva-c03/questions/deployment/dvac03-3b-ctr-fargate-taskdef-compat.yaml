id: dvac03-3b-ctr-fargate-taskdef-compat
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is moving an Amazon ECS service from EC2 container instances to AWS Fargate. The current task definition is shown below. When the developer creates a Fargate service from it, ECS reports that the task definition is not compatible with Fargate.

    ```json
    {
      "family": "web",
      "networkMode": "bridge",
      "cpu": "512",
      "memory": "1024",
      "containerDefinitions": [
        { "name": "web", "image": "111122223333.dkr.ecr.eu-west-1.amazonaws.com/web:1.8.0",
          "portMappings": [ { "containerPort": 8080 } ] }
      ]
    }
    ```

    Which combination of changes will make the task definition valid for Fargate? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany déplace un service Amazon ECS d'instances de conteneur EC2 vers AWS Fargate. La définition de tâche actuelle est présentée ci-dessous. Lorsque le développeur crée un service Fargate à partir de celle-ci, ECS signale que la définition de tâche n'est pas compatible avec Fargate.

    ```json
    {
      "family": "web",
      "networkMode": "bridge",
      "cpu": "512",
      "memory": "1024",
      "containerDefinitions": [
        { "name": "web", "image": "111122223333.dkr.ecr.eu-west-1.amazonaws.com/web:1.8.0",
          "portMappings": [ { "containerPort": 8080 } ] }
      ]
    }
    ```

    Quelle combinaison de modifications rend la définition de tâche valide pour Fargate ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set networkMode to awsvpc.", fr: "Définir networkMode sur awsvpc." } }
    - { id: b, text: { en: "Set networkMode to host.", fr: "Définir networkMode sur host." } }
    - { id: c, text: { en: "Add \"requiresCompatibilities\": [\"FARGATE\"] to the task definition.", fr: "Ajouter \"requiresCompatibilities\": [\"FARGATE\"] à la définition de tâche." } }
    - { id: d, text: { en: "Add \"privileged\": true to the container definition.", fr: "Ajouter \"privileged\": true à la définition de conteneur." } }
    - { id: e, text: { en: "Add a links entry to the container definition.", fr: "Ajouter une entrée links à la définition de conteneur." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Fargate tasks always use the awsvpc network mode, which gives each task its own elastic network interface. The task definition must also declare the Fargate launch type in requiresCompatibilities so that ECS validates it for Fargate; the task-level cpu and memory values here are already a valid Fargate combination."
    fr: "Les tâches Fargate utilisent toujours le mode réseau awsvpc, qui donne à chaque tâche sa propre interface réseau Elastic. La définition de tâche doit aussi déclarer le type de lancement Fargate dans requiresCompatibilities pour qu'ECS la valide pour Fargate ; les valeurs cpu et memory de niveau tâche forment déjà ici une combinaison Fargate valide."
  options:
    b:
      en: "Fargate does not support the host network mode; only awsvpc is allowed."
      fr: "Fargate ne prend pas en charge le mode réseau host ; seul awsvpc est autorisé."
    d:
      en: "privileged is one of the task definition parameters that are not valid in Fargate tasks."
      fr: "privileged fait partie des paramètres de définition de tâche qui ne sont pas valides pour les tâches Fargate."
    e:
      en: "links is not valid in Fargate tasks; containers in the same task communicate over localhost in awsvpc mode."
      fr: "links n'est pas valide pour les tâches Fargate ; les conteneurs d'une même tâche communiquent par localhost en mode awsvpc."
references:
  - title: Amazon ECS task definition differences for Fargate
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-tasks-services.html
