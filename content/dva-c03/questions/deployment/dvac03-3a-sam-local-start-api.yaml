id: dvac03-3a-sam-local-start-api
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer builds a serverless application with AWS SAM. The template defines several Lambda functions that are invoked by Amazon API Gateway routes. Before deploying anything, the developer wants to send HTTP requests with curl to the routes defined in the template and see the responses of the functions on the laptop, where Docker is installed.

    Which command should the developer use?
  fr: |
    Un développeur crée une application sans serveur avec AWS SAM. Le modèle définit plusieurs fonctions Lambda appelées par des routes Amazon API Gateway. Avant tout déploiement, le développeur veut envoyer des requêtes HTTP avec curl aux routes définies dans le modèle et voir les réponses des fonctions sur son ordinateur portable, où Docker est installé.

    Quelle commande le développeur doit-il utiliser ?
body:
  options:
    - { id: a, text: "sam remote invoke" }
    - { id: b, text: "sam local invoke" }
    - { id: c, text: "sam sync --watch" }
    - { id: d, text: "sam local start-api" }
answer: { optionId: d }
explanation:
  correct:
    en: "sam local start-api runs the functions locally behind a local HTTP server that hosts the routes of the template, for example http://127.0.0.1:3000/hello. The functions run in local Docker containers, and code changes are picked up without restarting the command."
    fr: "sam local start-api exécute les fonctions localement derrière un serveur HTTP local qui héberge les routes du modèle, par exemple http://127.0.0.1:3000/hello. Les fonctions s'exécutent dans des conteneurs Docker locaux, et les modifications du code sont prises en compte sans redémarrer la commande."
  options:
    a:
      en: "sam remote invoke works only on resources that are already deployed to the AWS Cloud."
      fr: "sam remote invoke ne fonctionne que sur des ressources déjà déployées dans le cloud AWS."
    b:
      en: "sam local invoke runs one function once with an event; it does not serve the template's routes to HTTP clients such as curl."
      fr: "sam local invoke exécute une fonction une fois avec un événement ; il ne sert pas les routes du modèle à des clients HTTP comme curl."
    c:
      en: "sam sync deploys the application to a stack in the AWS Cloud, which the developer wants to avoid at this point."
      fr: "sam sync déploie l'application dans une pile du cloud AWS, ce que le développeur veut éviter à ce stade."
references:
  - title: Introduction to testing with sam local start-api
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-local-start-api.html
