id: dvac03-3b-iac-deletionpolicy-retain
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany creates a short-lived AWS CloudFormation stack for each customer pilot. The stack contains AWS Lambda functions, an Amazon API Gateway API, and an Amazon DynamoDB table named PilotResults. When a pilot ends, the team deletes the stack to remove the compute and API resources, but the PilotResults table and its data must remain for later analysis.

    Which change to the template will meet these requirements?
  fr: |
    AnyCompany crée une pile AWS CloudFormation de courte durée pour chaque projet pilote client. La pile contient des fonctions AWS Lambda, une API Amazon API Gateway et une table Amazon DynamoDB nommée PilotResults. À la fin d'un projet pilote, l'équipe supprime la pile pour retirer les ressources de calcul et d'API, mais la table PilotResults et ses données doivent être conservées pour une analyse ultérieure.

    Quelle modification du modèle répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set DeletionPolicy: Snapshot on the PilotResults table resource.", fr: "Définir DeletionPolicy: Snapshot sur la ressource de la table PilotResults." } }
    - { id: b, text: { en: "Turn on termination protection for the stack.", fr: "Activer la protection contre la résiliation pour la pile." } }
    - { id: c, text: { en: "Set DeletionPolicy: Retain on the PilotResults table resource.", fr: "Définir DeletionPolicy: Retain sur la ressource de la table PilotResults." } }
    - { id: d, text: { en: "Add a stack policy that denies Update:Delete on the PilotResults table.", fr: "Ajouter une politique de pile qui refuse Update:Delete sur la table PilotResults." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With DeletionPolicy: Retain, CloudFormation keeps the resource and its contents when the stack is deleted, and it can be used on any resource type. The rest of the stack is deleted as usual, so the compute and API resources are removed while the table remains."
    fr: "Avec DeletionPolicy: Retain, CloudFormation conserve la ressource et son contenu lorsque la pile est supprimée, et cet attribut peut être utilisé sur tout type de ressource. Le reste de la pile est supprimé normalement : les ressources de calcul et d'API sont retirées tandis que la table est conservée."
  options:
    a:
      en: "Snapshot applies only to resource types that support snapshots, such as RDS, EBS volumes, and ElastiCache; AWS::DynamoDB::Table is not one of them."
      fr: "Snapshot ne s'applique qu'aux types de ressources qui prennent en charge les instantanés, comme RDS, les volumes EBS et ElastiCache ; AWS::DynamoDB::Table n'en fait pas partie."
    b:
      en: "Termination protection blocks deletion of the whole stack, so the team could not remove the compute and API resources."
      fr: "La protection contre la résiliation bloque la suppression de toute la pile : l'équipe ne pourrait pas retirer les ressources de calcul et d'API."
    d:
      en: "A stack policy controls updates to resources during stack updates; it does not keep a resource when the stack itself is deleted."
      fr: "Une politique de pile contrôle les mises à jour des ressources pendant les mises à jour de pile ; elle ne conserve pas une ressource lorsque la pile elle-même est supprimée."
references:
  - title: DeletionPolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-deletionpolicy.html
