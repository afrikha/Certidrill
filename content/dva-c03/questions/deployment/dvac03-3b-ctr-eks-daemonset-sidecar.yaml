id: dvac03-3b-ctr-eks-daemonset-sidecar
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany moves a Kubernetes application to an Amazon EKS cluster where all pods run on AWS Fargate. On the previous cluster, a security agent ran as a DaemonSet so that one copy ran next to the application pods on every node. After the migration, the agent's DaemonSet pods never start, and the application pods run without the agent. The agent must run alongside every application pod.

    Which solution will meet these requirements?
  fr: |
    AnyCompany déplace une application Kubernetes vers un cluster Amazon EKS où tous les pods s'exécutent sur AWS Fargate. Sur l'ancien cluster, un agent de sécurité s'exécutait comme DaemonSet afin qu'une copie s'exécute à côté des pods de l'application sur chaque nœud. Après la migration, les pods du DaemonSet de l'agent ne démarrent jamais, et les pods de l'application s'exécutent sans l'agent. L'agent doit s'exécuter à côté de chaque pod de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a Fargate profile selector for the namespace in which the agent's DaemonSet is deployed.", fr: "Ajouter un sélecteur de profil Fargate pour l'espace de noms dans lequel le DaemonSet de l'agent est déployé." } }
    - { id: b, text: { en: "Mark the agent container as privileged in the DaemonSet manifest so that it can run on Fargate.", fr: "Marquer le conteneur de l'agent comme privilégié dans le manifeste du DaemonSet afin qu'il puisse s'exécuter sur Fargate." } }
    - { id: c, text: { en: "Add the agent as a sidecar container in the pod template of the application's Deployment.", fr: "Ajouter l'agent comme conteneur sidecar dans le modèle de pod du Deployment de l'application." } }
    - { id: d, text: { en: "Change the DaemonSet into a Deployment with one replica in the same namespace.", fr: "Transformer le DaemonSet en Deployment avec un seul réplica dans le même espace de noms." } }
answer: { optionId: c }
explanation:
  correct:
    en: "DaemonSets are not supported on Fargate, because each Fargate pod runs in its own isolated environment rather than on shared nodes. AWS recommends reconfiguring a daemon to run as a sidecar container in the pods that need it, so every application pod gets its own agent."
    fr: "Les DaemonSets ne sont pas pris en charge sur Fargate, car chaque pod Fargate s'exécute dans son propre environnement isolé plutôt que sur des nœuds partagés. AWS recommande de reconfigurer un démon pour qu'il s'exécute comme conteneur sidecar dans les pods qui en ont besoin : chaque pod de l'application obtient ainsi son propre agent."
  options:
    a:
      en: "A selector cannot make a DaemonSet work on Fargate, because DaemonSets are not supported there."
      fr: "Un sélecteur ne peut pas faire fonctionner un DaemonSet sur Fargate, car les DaemonSets n'y sont pas pris en charge."
    b:
      en: "Privileged containers are not supported on Fargate, and this does not solve the DaemonSet limitation."
      fr: "Les conteneurs privilégiés ne sont pas pris en charge sur Fargate, et cela ne résout pas la limitation des DaemonSets."
    d:
      en: "A single-replica Deployment runs one agent in its own pod, not one next to every application pod."
      fr: "Un Deployment à un seul réplica exécute un seul agent dans son propre pod, et non un agent à côté de chaque pod de l'application."
references:
  - title: Simplify compute management with AWS Fargate
    url: https://docs.aws.amazon.com/eks/latest/userguide/fargate.html
