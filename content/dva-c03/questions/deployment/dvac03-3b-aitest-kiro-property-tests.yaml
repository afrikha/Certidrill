id: dvac03-3b-aitest-kiro-property-tests
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at AnyCompany uses a Kiro spec in the Kiro IDE to build a discount calculation module. One requirement states that the final price must never be negative and never exceed the list price, for any combination of coupons. The developer wants tests that check this rule against many generated inputs and that report the smallest input that breaks the rule when a test fails.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany utilise une spec Kiro dans l'IDE Kiro pour créer un module de calcul de remises. Une exigence indique que le prix final ne doit jamais être négatif ni dépasser le prix catalogue, pour toute combinaison de coupons. Le développeur veut des tests qui vérifient cette règle sur de nombreuses entrées générées et qui indiquent la plus petite entrée qui enfreint la règle lorsqu'un test échoue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run Analyze Requirements on the spec so that Kiro reports inconsistencies, ambiguities, and gaps in the requirement.", fr: "Exécuter Analyze Requirements sur la spec afin que Kiro signale les incohérences, ambiguïtés et lacunes de l'exigence." } }
    - { id: b, text: { en: "Create a File Save hook that asks Kiro to add one example-based unit test for each coupon type of the module.", fr: "Créer un hook File Save qui demande à Kiro d'ajouter un test unitaire basé sur des exemples pour chaque type de coupon du module." } }
    - { id: c, text: { en: "Use spec correctness so that Kiro derives a property from the requirement and generates and runs property-based tests.", fr: "Utiliser la correction (correctness) des specs afin que Kiro dérive une propriété de l'exigence, puis génère et exécute des tests basés sur les propriétés." } }
    - { id: d, text: { en: "Add a manually included steering file that lists sample coupon combinations and the price that each must produce.", fr: "Ajouter un fichier steering à inclusion manuelle qui liste des exemples de combinaisons de coupons et le prix que chacune doit produire." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Kiro extracts properties from the spec requirements, identifies the testable ones, and generates property-based tests that try many random inputs. When a property test fails, shrinking reduces the failing input to the smallest one that still reproduces the failure, and Kiro presents the scenario so the developer can fix the code, the test, or the requirement."
    fr: "Kiro extrait des propriétés des exigences de la spec, identifie celles qui sont testables et génère des tests basés sur les propriétés qui essaient de nombreuses entrées aléatoires. Lorsqu'un test de propriété échoue, la réduction (shrinking) ramène l'entrée en échec à la plus petite qui reproduit encore l'échec, et Kiro présente le scénario pour que le développeur corrige le code, le test ou l'exigence."
  options:
    a:
      en: "Analyze Requirements reviews the requirement text before design; it does not generate or run tests against the code."
      fr: "Analyze Requirements examine le texte des exigences avant la conception ; il ne génère ni n'exécute de tests sur le code."
    b:
      en: "Example-based tests check only the chosen examples and do not shrink a failing input to a minimal case."
      fr: "Les tests basés sur des exemples ne vérifient que les exemples choisis et ne réduisent pas une entrée en échec à un cas minimal."
    d:
      en: "Steering adds guidance to Kiro's context; a list of samples does not generate inputs or find a minimal failing case."
      fr: "Le steering ajoute des consignes au contexte de Kiro ; une liste d'exemples ne génère pas d'entrées et ne trouve pas de cas d'échec minimal."
references:
  - title: Correctness - Specs - Features - Docs - Kiro
    url: https://kiro.dev/docs/specs/correctness/
