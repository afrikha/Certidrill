id: dvac03-3a-http-api-no-mock
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team builds its public APIs as Amazon API Gateway HTTP APIs. For contract tests, the team needs a set of endpoints that return fixed sample responses defined in API Gateway, without running any backend code or calling another service.

    Which solution will meet these requirements?
  fr: |
    Une équipe crée ses API publiques sous forme d'API HTTP Amazon API Gateway. Pour des tests de contrat, l'équipe a besoin d'un ensemble de points de terminaison qui renvoient des réponses d'exemple fixes définies dans API Gateway, sans exécuter de code backend ni appeler un autre service.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add routes to an HTTP API with a Lambda proxy integration that returns the sample responses.", fr: "Ajouter des routes à une API HTTP avec une intégration de proxy Lambda qui renvoie les réponses d'exemple." } }
    - { id: b, text: { en: "Add routes to an HTTP API with a private integration that targets an Application Load Balancer fixed response.", fr: "Ajouter des routes à une API HTTP avec une intégration privée qui cible une réponse fixe d'un Application Load Balancer." } }
    - { id: c, text: { en: "Add routes to an HTTP API and choose the mock integration type for each route.", fr: "Ajouter des routes à une API HTTP et choisir le type d'intégration fictive (mock) pour chaque route." } }
    - { id: d, text: { en: "Create a REST API and configure a mock integration for each method.", fr: "Créer une API REST et configurer une intégration fictive (mock) pour chaque méthode." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Mock integrations are a feature of REST APIs only; HTTP APIs do not offer them. A REST API with a mock integration on each method returns responses generated by API Gateway itself, with no backend."
    fr: "Les intégrations fictives sont une fonctionnalité réservée aux API REST ; les API HTTP ne les proposent pas. Une API REST avec une intégration fictive sur chaque méthode renvoie des réponses générées par API Gateway lui-même, sans backend."
  options:
    a:
      en: "A Lambda function is backend code, which the requirements exclude."
      fr: "Une fonction Lambda est du code backend, ce que les exigences excluent."
    b:
      en: "This calls another service, the load balancer, through a VPC link instead of answering from API Gateway."
      fr: "Cela appelle un autre service, l'équilibreur de charge, par un lien VPC au lieu de répondre depuis API Gateway."
    c:
      en: "HTTP APIs do not support mock integrations."
      fr: "Les API HTTP ne prennent pas en charge les intégrations fictives."
references:
  - title: Choose between REST APIs and HTTP APIs
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-vs-rest.html
