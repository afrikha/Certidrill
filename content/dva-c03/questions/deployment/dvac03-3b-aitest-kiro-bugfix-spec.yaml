id: dvac03-3b-aitest-kiro-bugfix-spec
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at AnyCompany must fix a bug in an invoicing service: invoices with a zero tax rate are rejected. The developer uses Kiro and wants a structured workflow that records the defect, the expected behavior, and the existing behaviors that must not change, and that generates tests proving that the bug existed, that it is fixed, and that no regression was introduced.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany doit corriger un bogue dans un service de facturation : les factures dont le taux de taxe est nul sont rejetées. Le développeur utilise Kiro et veut un flux de travail structuré qui enregistre le défaut, le comportement attendu et les comportements existants qui ne doivent pas changer, et qui génère des tests prouvant que le bogue existait, qu'il est corrigé et qu'aucune régression n'a été introduite.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Bugfix Spec whose bugfix.md records the current, expected, and unchanged behavior.", fr: "Créer une Bugfix Spec dont le fichier bugfix.md consigne les comportements actuel, attendu et inchangé." } }
    - { id: b, text: { en: "Create a feature spec and describe the fix as a new user story in requirements.md.", fr: "Créer une spec de fonctionnalité et décrire la correction comme une nouvelle user story dans requirements.md." } }
    - { id: c, text: { en: "Create an Agent Stop hook that runs the existing test suite after each agent response.", fr: "Créer un hook Agent Stop qui exécute la suite de tests existante après chaque réponse de l'agent." } }
    - { id: d, text: { en: "Add a steering file that tells Kiro to avoid changing code outside the tax calculation module.", fr: "Ajouter un fichier steering qui demande à Kiro d'éviter de modifier le code en dehors du module de calcul des taxes." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A Bugfix Spec replaces requirements.md with bugfix.md, which has Current Behavior, Expected Behavior, and Unchanged Behavior sections. Its tasks generate property-based tests that check that the bug is reproducible, that it is fixed, and that the unchanged behaviors still hold."
    fr: "Une Bugfix Spec remplace requirements.md par bugfix.md, qui comporte les sections Current Behavior, Expected Behavior et Unchanged Behavior. Ses tâches génèrent des tests basés sur les propriétés qui vérifient que le bogue est reproductible, qu'il est corrigé et que les comportements inchangés sont toujours respectés."
  options:
    b:
      en: "A feature spec captures new requirements; it does not record the defect and the behaviors to preserve, or generate tests that prove the bug existed."
      fr: "Une spec de fonctionnalité capture de nouvelles exigences ; elle n'enregistre pas le défaut et les comportements à préserver, et ne génère pas de tests prouvant l'existence du bogue."
    c:
      en: "Running existing tests can catch some regressions, but it records nothing about the defect and adds no test for the bug."
      fr: "Exécuter les tests existants peut détecter certaines régressions, mais n'enregistre rien sur le défaut et n'ajoute aucun test pour le bogue."
    d:
      en: "Steering guides how Kiro works; it does not document the bug or generate tests for the fix."
      fr: "Le steering oriente la façon de travailler de Kiro ; il ne documente pas le bogue et ne génère pas de tests pour la correction."
references:
  - title: Bugfix Specs - Specs - Features - Docs - Kiro
    url: https://kiro.dev/docs/specs/bugfix-specs/
