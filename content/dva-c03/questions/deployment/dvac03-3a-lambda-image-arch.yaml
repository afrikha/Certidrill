id: dvac03-3a-lambda-image-arch
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CI pipeline on an arm64 build host builds a container image from the AWS base image for Python and pushes it to Amazon ECR. The Lambda function that uses the image is configured with the x86_64 architecture and must stay on x86_64. After the update, the function fails to initialize with an exec format error.

    Which solution will meet these requirements?
  fr: |
    Un pipeline de CI sur un hôte de build arm64 crée une image de conteneur à partir de l'image de base AWS pour Python et la transfère vers Amazon ECR. La fonction Lambda qui utilise l'image est configurée avec l'architecture x86_64 et doit rester sur x86_64. Après la mise à jour, la fonction ne parvient pas à s'initialiser et renvoie une erreur exec format error.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Build the image with docker buildx build --platform linux/amd64 --provenance=false, push it and update the function code.", fr: "Créer l'image avec docker buildx build --platform linux/amd64 --provenance=false, la transférer et mettre à jour le code de la fonction." } }
    - { id: b, text: { en: "Build a multi-architecture image for linux/amd64 and linux/arm64, push it and update the function code.", fr: "Créer une image multi-architecture pour linux/amd64 et linux/arm64, la transférer et mettre à jour le code de la fonction." } }
    - { id: c, text: { en: "Change the FROM line to the latest tag of the base image, rebuild on the same host and update the function code.", fr: "Remplacer la ligne FROM par la balise latest de l'image de base, reconstruire sur le même hôte et mettre à jour le code de la fonction." } }
    - { id: d, text: { en: "Change the architecture of the function to arm64 so that it matches the image produced by the build host.", fr: "Changer l'architecture de la fonction en arm64 pour qu'elle corresponde à l'image produite par l'hôte de build." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The image must target the architecture of the function. The --platform linux/amd64 option builds an x86_64 image whatever the build host architecture, and Lambda documents --provenance=false to make the image compatible with Lambda."
    fr: "L'image doit cibler l'architecture de la fonction. L'option --platform linux/amd64 crée une image x86_64 quelle que soit l'architecture de l'hôte de build, et Lambda documente --provenance=false pour rendre l'image compatible avec Lambda."
  options:
    b:
      en: "Lambda provides multi-architecture base images, but a function image must target only one architecture; Lambda does not support multi-architecture images."
      fr: "Lambda fournit des images de base multi-architecture, mais l'image d'une fonction doit cibler une seule architecture ; Lambda ne prend pas en charge les images multi-architecture."
    c:
      en: "The base image tag does not change the target platform: the arm64 host still produces an arm64 image."
      fr: "La balise de l'image de base ne change pas la plateforme cible : l'hôte arm64 produit toujours une image arm64."
    d:
      en: "This would make the image run, but the function must stay on x86_64."
      fr: "L'image fonctionnerait, mais la fonction doit rester sur x86_64."
references:
  - title: Deploy Python Lambda Event Functions with container images
    url: https://docs.aws.amazon.com/lambda/latest/dg/python-image.html
