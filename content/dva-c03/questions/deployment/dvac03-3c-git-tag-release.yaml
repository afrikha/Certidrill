id: dvac03-3c-git-tag-release
objective: "3.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team releases an application from the `main` branch of an AWS CodeCommit repository. The team must permanently mark the exact commit that was deployed as release 3.2.0, so that any developer can later check out or redeploy that commit after `main` has moved on.

    Which solution will meet these requirements?
  fr: |
    Une équipe publie une application à partir de la branche `main` d'un référentiel AWS CodeCommit. L'équipe doit marquer de façon permanente le commit exact qui a été déployé comme version 3.2.0, afin que tout développeur puisse ensuite extraire ou redéployer ce commit une fois que `main` aura avancé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create the Git tag `v3.2.0` on the deployed commit and push it with `git push origin v3.2.0`.", fr: "Créer la balise Git `v3.2.0` sur le commit déployé et la pousser avec `git push origin v3.2.0`." }
    - id: b
      text: { en: "Add the resource tag `release=3.2.0` to the repository with `aws codecommit tag-resource`.", fr: "Ajouter l'étiquette de ressource `release=3.2.0` au référentiel avec `aws codecommit tag-resource`." }
    - id: c
      text: { en: "Add the text `release 3.2.0` to the commit message of the next commit on `main`.", fr: "Ajouter le texte `release 3.2.0` au message du prochain commit sur `main`." }
    - id: d
      text: { en: "Write the commit ID of release 3.2.0 in the description of the repository.", fr: "Écrire l'ID de commit de la version 3.2.0 dans la description du référentiel." }
answer: { optionId: a }
explanation:
  correct:
    en: "A Git tag is a named label attached to a specific commit, so `v3.2.0` keeps pointing to the deployed commit when `main` moves. Tags are created in the local repository and must be pushed to the CodeCommit remote, for example with `git push origin v3.2.0`."
    fr: "Une balise Git est une étiquette nommée attachée à un commit précis : `v3.2.0` continue donc de désigner le commit déployé lorsque `main` avance. Les balises sont créées dans le référentiel local et doivent être poussées vers le référentiel distant CodeCommit, par exemple avec `git push origin v3.2.0`."
  options:
    b:
      en: "A resource tag is key-value metadata on the repository as an AWS resource; it does not identify any commit."
      fr: "Une étiquette de ressource est une métadonnée clé-valeur du référentiel en tant que ressource AWS ; elle n'identifie aucun commit."
    c:
      en: "A message on a later commit points to that later commit, not to the deployed one, and Git cannot check it out by name."
      fr: "Un message sur un commit ultérieur désigne ce commit ultérieur, pas celui qui a été déployé, et Git ne peut pas l'extraire par son nom."
    d:
      en: "The description is free text that anyone can change, and it is not a Git reference that tools can check out."
      fr: "La description est un texte libre que n'importe qui peut modifier, et ce n'est pas une référence Git que les outils peuvent extraire."
references:
  - title: Create a Git tag in AWS CodeCommit
    url: https://docs.aws.amazon.com/codecommit/latest/userguide/how-to-create-tag.html
