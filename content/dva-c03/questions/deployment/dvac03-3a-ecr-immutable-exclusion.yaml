id: dvac03-3a-ecr-immutable-exclusion
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CI pipeline pushes container images to an Amazon ECR repository with version tags such as `v2.4.1`. A version tag must never point to a different image after it is pushed. The pipeline also moves the `latest` tag to the newest build on every push, and the development team wants to keep that behavior in the same repository.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un pipeline de CI transfère des images de conteneur vers un référentiel Amazon ECR avec des balises de version comme `v2.4.1`. Une balise de version ne doit jamais désigner une autre image après son transfert. Le pipeline déplace aussi la balise `latest` vers le build le plus récent à chaque transfert, et l'équipe de développement veut conserver ce comportement dans le même référentiel.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Set the image tag mutability of the repository to IMMUTABLE_WITH_EXCLUSION with a wildcard exclusion filter for latest.", fr: "Définir la mutabilité des balises d'image du référentiel sur IMMUTABLE_WITH_EXCLUSION avec un filtre d'exclusion générique pour latest." } }
    - { id: b, text: { en: "Set the image tag mutability of the repository to IMMUTABLE so that no tag can be overwritten after it is pushed.", fr: "Définir la mutabilité des balises d'image du référentiel sur IMMUTABLE pour qu'aucune balise ne puisse être écrasée après son transfert." } }
    - { id: c, text: { en: "Add a lifecycle policy rule that expires any image tagged latest as soon as a newer image is pushed.", fr: "Ajouter une règle de politique de cycle de vie qui fait expirer toute image balisée latest dès qu'une image plus récente est transférée." } }
    - { id: d, text: { en: "Push version tags to a second repository with immutable tags and keep latest in the current mutable repository.", fr: "Transférer les balises de version vers un second référentiel à balises immuables et garder latest dans le référentiel actuel, modifiable." } }
answer: { optionId: a }
explanation:
  correct:
    en: "IMMUTABLE_WITH_EXCLUSION makes every tag immutable except the tags that match the exclusion filters. With a filter for latest, pushing an existing version tag returns ImageTagAlreadyExistsException, while the pipeline can still move latest, with a single repository setting."
    fr: "IMMUTABLE_WITH_EXCLUSION rend toutes les balises immuables sauf celles qui correspondent aux filtres d'exclusion. Avec un filtre pour latest, le transfert d'une balise de version existante renvoie ImageTagAlreadyExistsException, tandis que le pipeline peut toujours déplacer latest, avec un seul paramètre du référentiel."
  options:
    b:
      en: "IMMUTABLE applies to all tags, so every push that moves latest fails with ImageTagAlreadyExistsException."
      fr: "IMMUTABLE s'applique à toutes les balises : chaque transfert qui déplace latest échoue avec ImageTagAlreadyExistsException."
    c:
      en: "Lifecycle policies delete or archive images; they do not stop a version tag from being moved to another image."
      fr: "Les politiques de cycle de vie suppriment ou archivent des images ; elles n'empêchent pas une balise de version d'être déplacée vers une autre image."
    d:
      en: "This protects the version tags, but it splits the images across two repositories against the team's wish and adds pipeline changes."
      fr: "Cela protège les balises de version, mais répartit les images sur deux référentiels contre le souhait de l'équipe et ajoute des modifications au pipeline."
references:
  - title: Preventing image tags from being overwritten in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-tag-mutability.html
