id: dvac03-3a-appconfig-json-schema
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A microservice reads a freeform JSON configuration that is stored in the AWS AppConfig hosted configuration store. Last week, a deployment set `maxRetries` to the string "five" instead of an integer and broke the service in production. AnyCompany wants AppConfig to reject a configuration with wrong types before the deployment reaches any target.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    Un microservice lit une configuration JSON libre (freeform) stockée dans le magasin de configurations hébergé d'AWS AppConfig. La semaine dernière, un déploiement a défini `maxRetries` sur la chaîne "five" au lieu d'un entier et a cassé le service en production. AnyCompany veut qu'AppConfig refuse une configuration aux types incorrects avant que le déploiement n'atteigne une cible.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: { en: "Add a JSON Schema validator that declares maxRetries as an integer to the configuration profile.", fr: "Ajouter au profil de configuration un validateur JSON Schema qui déclare maxRetries comme un entier." } }
    - { id: b, text: { en: "Use a deployment strategy with a bake time and a CloudWatch alarm on service errors to roll the deployment back.", fr: "Utiliser une stratégie de déploiement avec un temps de stabilisation et une alarme CloudWatch sur les erreurs du service pour annuler le déploiement." } }
    - { id: c, text: { en: "Write a Lambda function that parses the JSON and checks each type, and add it as a validator of the configuration profile.", fr: "Écrire une fonction Lambda qui analyse le JSON et vérifie chaque type, et l'ajouter comme validateur du profil de configuration." } }
    - { id: d, text: { en: "Move each setting to a separate Parameter Store parameter with an allowed pattern that accepts only digits.", fr: "Déplacer chaque paramètre vers un paramètre Parameter Store distinct avec un modèle autorisé qui n'accepte que des chiffres." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Validators make sure that configuration data is syntactically and semantically correct before it is deployed. A JSON Schema validator is supported for freeform configurations and only needs a schema document, so a string in an integer field is rejected without writing code."
    fr: "Les validateurs garantissent que les données de configuration sont syntaxiquement et sémantiquement correctes avant leur déploiement. Un validateur JSON Schema est pris en charge pour les configurations libres et ne demande qu'un document de schéma : une chaîne dans un champ entier est refusée sans écrire de code."
  options:
    b:
      en: "Alarm-based rollback reacts after the bad configuration has reached targets and caused errors, which is what must be avoided."
      fr: "L'annulation basée sur une alarme réagit une fois la mauvaise configuration arrivée sur les cibles et les erreurs produites, ce qu'il faut éviter."
    c:
      en: "A Lambda validator also rejects the configuration, but it needs code to write, test and maintain, which is more effort than a schema."
      fr: "Un validateur Lambda refuse aussi la configuration, mais il demande du code à écrire, tester et maintenir, ce qui représente plus d'effort qu'un schéma."
    d:
      en: "Moving the configuration out of AppConfig means rewriting how the service loads it, which is far more effort."
      fr: "Sortir la configuration d'AppConfig oblige à réécrire la façon dont le service la charge, ce qui demande beaucoup plus d'effort."
references:
  - title: Understanding validators
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-configuration-and-profile-validators.html
