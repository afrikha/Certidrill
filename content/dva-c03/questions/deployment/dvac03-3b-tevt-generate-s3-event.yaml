id: dvac03-3b-tevt-generate-s3-event
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at AnyCompany maintains an AWS SAM application. One AWS Lambda function processes Amazon S3 PUT notifications for a bucket named invoices-upload. The developer wants to run the function on a local machine with a realistic S3 event payload that contains this bucket name, without uploading any object to Amazon S3.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany gère une application AWS SAM. Une fonction AWS Lambda traite les notifications PUT Amazon S3 d'un compartiment nommé invoices-upload. Le développeur veut exécuter la fonction sur une machine locale avec une charge utile d'événement S3 réaliste qui contient ce nom de compartiment, sans charger d'objet dans Amazon S3.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run sam local start-lambda, then upload a test object to the invoices-upload bucket with the AWS CLI to trigger it.", fr: "Exécuter sam local start-lambda, puis charger un objet de test dans le compartiment invoices-upload avec l'AWS CLI pour la déclencher." } }
    - { id: b, text: { en: "Run sam local generate-event s3 put --bucket invoices-upload > event.json, then run sam local invoke --event event.json.", fr: "Exécuter sam local generate-event s3 put --bucket invoices-upload > event.json, puis exécuter sam local invoke --event event.json." } }
    - { id: c, text: { en: "Run sam validate on the template, then run sam local invoke for the function without any event file.", fr: "Exécuter sam validate sur le modèle, puis exécuter sam local invoke pour la fonction sans aucun fichier d'événement." } }
    - { id: d, text: { en: "Deploy the stack to the AWS Cloud, then run sam remote invoke for the function with the --event-file option.", fr: "Déployer la pile dans le cloud AWS, puis exécuter sam remote invoke pour la fonction avec l'option --event-file." } }
answer: { optionId: b }
explanation:
  correct:
    en: "sam local generate-event produces sample event payloads for many AWS services; the s3 put event accepts options such as --bucket and --key to customize the payload. Redirecting the output to a file and passing it to sam local invoke --event runs the function locally with that event."
    fr: "sam local generate-event produit des exemples de charges utiles d'événements pour de nombreux services AWS ; l'événement s3 put accepte des options comme --bucket et --key pour personnaliser la charge utile. Rediriger la sortie vers un fichier et le passer à sam local invoke --event exécute la fonction localement avec cet événement."
  options:
    a:
      en: "Uploading an object to the real bucket violates the requirement, and a local Lambda endpoint does not receive S3 notifications."
      fr: "Charger un objet dans le vrai compartiment enfreint l'exigence, et un point de terminaison Lambda local ne reçoit pas les notifications S3."
    c:
      en: "sam validate only checks the template, and invoking without an event file does not provide the S3 payload the function needs."
      fr: "sam validate vérifie uniquement le modèle, et une invocation sans fichier d'événement ne fournit pas la charge utile S3 dont la fonction a besoin."
    d:
      en: "sam remote invoke runs the deployed function in the AWS Cloud, not on the local machine, and it still needs an event file to be written first."
      fr: "sam remote invoke exécute la fonction déployée dans le cloud AWS, pas sur la machine locale, et il faut quand même écrire d'abord un fichier d'événement."
references:
  - title: Introduction to testing with sam local generate-event
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-local-generate-event.html
