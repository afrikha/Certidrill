id: dvac03-3c-codedeploy-stop-rollback
objective: "3.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AWS CodeDeploy is shifting traffic from version 14 to version 15 of an AWS Lambda function with CodeDeployDefault.LambdaLinear10PercentEvery10Minutes, and 30% of the traffic has moved. Customers report a defect that no CloudWatch alarm detects. The developer must immediately end the deployment and send all the traffic back to version 14.

    Which AWS CLI command should the developer run?
  fr: |
    AWS CodeDeploy transfère le trafic de la version 14 vers la version 15 d'une fonction AWS Lambda avec CodeDeployDefault.LambdaLinear10PercentEvery10Minutes, et 30 % du trafic a été transféré. Des clients signalent un défaut qu'aucune alarme CloudWatch ne détecte. Le développeur doit immédiatement mettre fin au déploiement et renvoyer tout le trafic vers la version 14.

    Quelle commande AWS CLI le développeur doit-il exécuter ?
body:
  options:
    - { id: a, text: "aws deploy stop-deployment --deployment-id d-EXAMPLE111 --no-auto-rollback-enabled" }
    - { id: b, text: "aws deploy update-deployment-group --application-name orders-app --current-deployment-group-name orders-dg --deployment-config-name CodeDeployDefault.LambdaAllAtOnce" }
    - { id: c, text: "aws deploy continue-deployment --deployment-id d-EXAMPLE111" }
    - { id: d, text: "aws deploy stop-deployment --deployment-id d-EXAMPLE111 --auto-rollback-enabled" }
answer: { optionId: d }
explanation:
  correct:
    en: "CodeDeploy offers two ways to stop a deployment: stop it, or stop it and roll it back. The stop-deployment command with --auto-rollback-enabled ends the deployment and rolls it back, which returns the alias traffic to the previous version."
    fr: "CodeDeploy propose deux façons d'arrêter un déploiement : l'arrêter, ou l'arrêter et le restaurer. La commande stop-deployment avec --auto-rollback-enabled met fin au déploiement et le restaure, ce qui renvoie le trafic de l'alias vers la version précédente."
  options:
    a:
      en: "This stops the deployment without a rollback, so the traffic does not go back to version 14."
      fr: "Cette commande arrête le déploiement sans restauration : le trafic ne revient pas vers la version 14."
    b:
      en: "Changing the deployment group configuration affects only future deployments, and AllAtOnce would move all traffic forward, not back."
      fr: "Modifier la configuration du groupe de déploiement n'affecte que les futurs déploiements, et AllAtOnce déplacerait tout le trafic vers l'avant, pas vers l'arrière."
    c:
      en: "continue-deployment resumes a deployment that waits for a decision, such as an EC2 blue/green deployment waiting to reroute traffic; it does not roll back."
      fr: "continue-deployment reprend un déploiement en attente d'une décision, comme un déploiement bleu/vert EC2 qui attend le réacheminement du trafic ; il ne restaure rien."
references:
  - title: Stop a deployment with CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployments-stop.html
