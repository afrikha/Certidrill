id: dvac03-3c-pr-validation-trigger
objective: "3.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team develops in feature branches of a GitHub repository and merges them into `main` through pull requests. A separate AWS CodePipeline V2 validation pipeline, with an AWS CodeConnections source action, must build and unit test the code of every pull request that targets `main`, each time the pull request is opened or updated, before it is merged. Pushes to feature branches without a pull request must not start the pipeline.

    Which trigger configuration will meet these requirements?
  fr: |
    Une équipe développe dans des branches de fonctionnalité d'un référentiel GitHub et les fusionne dans `main` via des demandes d'extraction (pull requests). Un pipeline de validation AWS CodePipeline V2 distinct, avec une action source AWS CodeConnections, doit générer et tester unitairement le code de chaque demande d'extraction qui cible `main`, à chaque ouverture ou mise à jour de la demande, avant sa fusion. Les push vers des branches de fonctionnalité sans demande d'extraction ne doivent pas démarrer le pipeline.

    Quelle configuration de déclencheur répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "A push trigger with a branches filter that includes `feature/**`", fr: "Un déclencheur push avec un filtre de branches qui inclut `feature/**`" }
    - id: b
      text: { en: "A pull request trigger with the OPEN and UPDATED events and a branches filter that includes `main`", fr: "Un déclencheur de demande d'extraction avec les événements OPEN et UPDATED et un filtre de branches qui inclut `main`" }
    - id: c
      text: { en: "A pull request trigger with the CLOSED event and a branches filter that includes `main`", fr: "Un déclencheur de demande d'extraction avec l'événement CLOSED et un filtre de branches qui inclut `main`" }
    - id: d
      text: { en: "A push trigger with a branches filter that includes `main`", fr: "Un déclencheur push avec un filtre de branches qui inclut `main`" }
answer: { optionId: b }
explanation:
  correct:
    en: "A pull request trigger starts the pipeline on the selected pull request events, and its branches filter applies to the destination branch. With OPEN and UPDATED events and `main` as the branch, every pull request to `main` is built from the commit on its source branch each time it is opened or updated, and plain pushes do not start the pipeline."
    fr: "Un déclencheur de demande d'extraction démarre le pipeline sur les événements de demande d'extraction choisis, et son filtre de branches s'applique à la branche de destination. Avec les événements OPEN et UPDATED et la branche `main`, chaque demande d'extraction vers `main` est générée à partir du commit de sa branche source à chaque ouverture ou mise à jour, et les simples push ne démarrent pas le pipeline."
  options:
    a:
      en: "This starts the pipeline on every push to a feature branch, including pushes that have no pull request."
      fr: "Ce déclencheur démarre le pipeline à chaque push vers une branche de fonctionnalité, y compris les push sans demande d'extraction."
    c:
      en: "The CLOSED event fires when the pull request is merged or closed, which is too late to validate it before the merge."
      fr: "L'événement CLOSED se produit lorsque la demande d'extraction est fusionnée ou fermée, ce qui est trop tard pour la valider avant la fusion."
    d:
      en: "Pushes to `main` happen after the merge, so the code is not validated before it reaches `main`."
      fr: "Les push vers `main` ont lieu après la fusion : le code n'est pas validé avant d'arriver sur `main`."
references:
  - title: Add trigger with code push or pull request event types
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-filter.html
