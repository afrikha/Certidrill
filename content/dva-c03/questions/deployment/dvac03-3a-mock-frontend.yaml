id: dvac03-3a-mock-frontend
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A mobile team at AnyCompany must start building screens that call `GET /catalog` on a new Amazon API Gateway REST API, but the backend service will not be ready for several weeks. The team needs the method to return a fixed sample JSON body at its final path. Later, the backend will replace the sample without any change to the URL that the app calls. No backend infrastructure must be built for now.

    Which solution will meet these requirements?
  fr: |
    Une équipe mobile d'AnyCompany doit commencer à créer des écrans qui appellent `GET /catalog` sur une nouvelle API REST Amazon API Gateway, mais le service backend ne sera pas prêt avant plusieurs semaines. L'équipe a besoin que la méthode renvoie un corps JSON d'exemple fixe à son chemin définitif. Plus tard, le backend remplacera l'exemple sans aucune modification de l'URL appelée par l'application. Aucune infrastructure backend ne doit être créée pour l'instant.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Lambda function that returns the sample JSON and use it as a Lambda proxy integration for GET /catalog.", fr: "Créer une fonction Lambda qui renvoie le JSON d'exemple et l'utiliser comme intégration de proxy Lambda pour GET /catalog." } }
    - { id: b, text: { en: "Configure GET /catalog with a mock integration whose integration response returns the sample JSON, and deploy the API to a dev stage.", fr: "Configurer GET /catalog avec une intégration fictive (mock) dont la réponse d'intégration renvoie le JSON d'exemple, et déployer l'API dans une étape dev." } }
    - { id: c, text: { en: "Host the sample JSON as catalog.json in an S3 bucket with static website hosting and give its URL to the team.", fr: "Héberger le JSON d'exemple sous le nom catalog.json dans un compartiment S3 avec l'hébergement de site web statique et donner son URL à l'équipe." } }
    - { id: d, text: { en: "Enable caching on the dev stage and preload the cache with the sample JSON for GET /catalog.", fr: "Activer la mise en cache sur l'étape dev et précharger le cache avec le JSON d'exemple pour GET /catalog." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A mock integration lets API Gateway return a response without calling any backend, which lets dependent teams work before the backend is ready. The sample body comes from the integration response mapping template, and later the integration of the same method is changed without changing the stage URL."
    fr: "Une intégration fictive permet à API Gateway de renvoyer une réponse sans appeler de backend, ce qui permet aux équipes dépendantes de travailler avant que le backend soit prêt. Le corps d'exemple provient du modèle de mappage de la réponse d'intégration, et l'intégration de la même méthode est ensuite modifiée sans changer l'URL de l'étape."
  options:
    a:
      en: "A Lambda function is backend infrastructure to build and maintain, which the team wants to avoid for now."
      fr: "Une fonction Lambda est une infrastructure backend à créer et maintenir, ce que l'équipe veut éviter pour l'instant."
    c:
      en: "The S3 website URL is not the API's final path, so the app would have to change its URL when the backend is ready."
      fr: "L'URL du site web S3 n'est pas le chemin définitif de l'API : l'application devrait changer d'URL quand le backend sera prêt."
    d:
      en: "The API Gateway cache stores integration responses; it cannot be preloaded with content, and a method still needs an integration."
      fr: "Le cache API Gateway stocke des réponses d'intégration ; il ne peut pas être préchargé avec du contenu, et une méthode a toujours besoin d'une intégration."
references:
  - title: Mock integrations for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-mock-integration.html
