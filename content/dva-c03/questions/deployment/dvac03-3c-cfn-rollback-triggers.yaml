id: dvac03-3c-cfn-rollback-triggers
objective: "3.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer updates an AWS CloudFormation stack that contains AWS Lambda functions and an Amazon API Gateway API. Errors caused by a bad update sometimes appear only a few minutes after the update completes. If the CloudWatch alarm `api-5xx` enters the ALARM state during the update or within 15 minutes after it, CloudFormation must automatically roll back the entire update.

    Which solution will meet these requirements?
  fr: |
    Un développeur met à jour une pile AWS CloudFormation qui contient des fonctions AWS Lambda et une API Amazon API Gateway. Les erreurs causées par une mauvaise mise à jour n'apparaissent parfois que quelques minutes après la fin de la mise à jour. Si l'alarme CloudWatch `api-5xx` passe à l'état ALARM pendant la mise à jour ou dans les 15 minutes qui suivent, CloudFormation doit restaurer automatiquement l'ensemble de la mise à jour.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run update-stack with the alarm as a rollback trigger and MonitoringTimeInMinutes set to 15.", fr: "Exécuter update-stack avec l'alarme comme déclencheur de restauration et MonitoringTimeInMinutes défini sur 15." }
    - id: b
      text: { en: "Run update-stack with --disable-rollback, and run rollback-stack if the alarm enters the ALARM state.", fr: "Exécuter update-stack avec --disable-rollback, puis exécuter rollback-stack si l'alarme passe à l'état ALARM." }
    - id: c
      text: { en: "Apply a stack policy that denies Update:Replace on the Lambda functions and the API during the update.", fr: "Appliquer une politique de pile qui refuse Update:Replace sur les fonctions Lambda et l'API pendant la mise à jour." }
    - id: d
      text: { en: "Add an alarm action that invokes a Lambda function, which calls CancelUpdateStack on the stack.", fr: "Ajouter une action d'alarme qui appelle une fonction Lambda, laquelle appelle CancelUpdateStack sur la pile." }
answer: { optionId: a }
explanation:
  correct:
    en: "Rollback triggers make CloudFormation watch up to five CloudWatch alarms during a stack create or update and for the monitoring period afterward. If an alarm enters ALARM in either period, CloudFormation rolls back the whole operation; MonitoringTimeInMinutes can be set from 0 to 180."
    fr: "Les déclencheurs de restauration font surveiller par CloudFormation jusqu'à cinq alarmes CloudWatch pendant la création ou la mise à jour d'une pile et pendant la période de surveillance qui suit. Si une alarme passe à ALARM pendant l'une ou l'autre période, CloudFormation restaure toute l'opération ; MonitoringTimeInMinutes peut aller de 0 à 180."
  options:
    b:
      en: "Disabling rollback preserves the failed state, and running rollback-stack by hand is not an automatic rollback."
      fr: "Désactiver la restauration conserve l'état en échec, et exécuter rollback-stack à la main n'est pas une restauration automatique."
    c:
      en: "A stack policy only prevents updates to protected resources; it does not watch alarms or roll back."
      fr: "Une politique de pile empêche seulement la mise à jour des ressources protégées ; elle ne surveille pas d'alarme et ne restaure rien."
    d:
      en: "An update can be canceled only while it is in progress, so this does not cover the 15 minutes after the update completes, and it needs custom code."
      fr: "Une mise à jour ne peut être annulée que pendant son exécution : cette solution ne couvre pas les 15 minutes qui suivent la fin de la mise à jour, et elle exige du code personnalisé."
references:
  - title: Roll back your CloudFormation stack on alarm breach with rollback triggers
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-rollback-triggers.html
