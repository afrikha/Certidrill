id: dvac03-3c-execution-mode-queued
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team uses an AWS CodePipeline V2 pipeline to deploy an API to a shared staging environment and then run integration tests against it. Developers merge several commits every hour. The team finds that some commits are never deployed or tested, because newer executions overtake older executions that are waiting between stages. Every commit must be deployed and tested, one at a time, in the order in which it was merged.

    Which solution will meet these requirements?
  fr: |
    Une équipe utilise un pipeline AWS CodePipeline V2 pour déployer une API dans un environnement intermédiaire partagé, puis exécuter des tests d'intégration sur cet environnement. Les développeurs fusionnent plusieurs commits par heure. L'équipe constate que certains commits ne sont jamais déployés ni testés, car des exécutions plus récentes dépassent des exécutions plus anciennes qui attendent entre deux étapes. Chaque commit doit être déployé et testé, un à la fois, dans l'ordre de sa fusion.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the execution mode of the pipeline to QUEUED.", fr: "Passer le mode d'exécution du pipeline à QUEUED." }
    - id: b
      text: { en: "Change the execution mode of the pipeline to PARALLEL.", fr: "Passer le mode d'exécution du pipeline à PARALLEL." }
    - id: c
      text: { en: "Keep the SUPERSEDED mode and disable the inbound transition of the staging stage while tests run.", fr: "Conserver le mode SUPERSEDED et désactiver la transition entrante de l'étape intermédiaire pendant les tests." }
    - id: d
      text: { en: "Configure automatic retry on stage failure for the staging stage.", fr: "Configurer la nouvelle tentative automatique en cas d'échec pour l'étape intermédiaire." }
answer: { optionId: a }
explanation:
  correct:
    en: "In QUEUED mode, executions are processed one by one in the order in which they were queued, and waiting executions never overtake executions that have already started. Each commit therefore reaches the shared environment and its tests in turn. QUEUED requires a V2 pipeline."
    fr: "En mode QUEUED, les exécutions sont traitées une par une dans leur ordre de mise en file d'attente, et les exécutions en attente ne dépassent jamais celles déjà démarrées. Chaque commit atteint donc à son tour l'environnement partagé et ses tests. QUEUED exige un pipeline V2."
  options:
    b:
      en: "PARALLEL runs executions at the same time without queues, so several commits would deploy to the shared environment simultaneously and interfere with each other's tests."
      fr: "PARALLEL lance les exécutions en même temps sans file d'attente : plusieurs commits seraient déployés simultanément dans l'environnement partagé et perturberaient les tests les uns des autres."
    c:
      en: "A disabled transition only holds executions; in SUPERSEDED mode a newer waiting execution still replaces the older one, so commits are still skipped."
      fr: "Une transition désactivée ne fait que retenir les exécutions ; en mode SUPERSEDED, une exécution en attente plus récente remplace toujours la plus ancienne, et des commits sont toujours ignorés."
    d:
      en: "Retries rerun failed stages; they do not stop newer executions from superseding waiting ones."
      fr: "Les nouvelles tentatives relancent les étapes en échec ; elles n'empêchent pas des exécutions plus récentes de remplacer celles en attente."
references:
  - title: How pipeline executions work
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/concepts-how-it-works.html
