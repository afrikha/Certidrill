id: dvac03-3b-tevt-local-api-request
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer at AnyCompany builds an AWS SAM application in which a Lambda function handles GET /orders/{id} through an Amazon API Gateway REST API with a Lambda proxy integration. The developer wants to run the function on a local machine with a realistic API Gateway proxy request for GET /orders/123, without deploying anything to AWS.

    Which solutions will meet these requirements? (Choose two.)
  fr: |
    Un développeur d'AnyCompany crée une application AWS SAM dans laquelle une fonction Lambda traite GET /orders/{id} au moyen d'une API REST Amazon API Gateway avec une intégration de proxy Lambda. Le développeur veut exécuter la fonction sur une machine locale avec une requête de proxy API Gateway réaliste pour GET /orders/123, sans rien déployer sur AWS.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run sam local generate-event apigateway aws-proxy, set the path and pathParameters in the output file, and run sam local invoke --event with that file.", fr: "Exécuter sam local generate-event apigateway aws-proxy, définir path et pathParameters dans le fichier de sortie, puis exécuter sam local invoke --event avec ce fichier." } }
    - { id: b, text: { en: "Run sam local start-api and send a GET request for /orders/123 to the local endpoint with curl.", fr: "Exécuter sam local start-api et envoyer une requête GET pour /orders/123 au point de terminaison local avec curl." } }
    - { id: c, text: { en: "Run sam local generate-event sqs receive-message and pass the output to sam local invoke --event.", fr: "Exécuter sam local generate-event sqs receive-message et passer la sortie à sam local invoke --event." } }
    - { id: d, text: { en: "Run sam remote invoke with an event file that contains the proxy request.", fr: "Exécuter sam remote invoke avec un fichier d'événement qui contient la requête de proxy." } }
    - { id: e, text: { en: "Run sam validate --lint and then call the stage URL of the API for /orders/123.", fr: "Exécuter sam validate --lint, puis appeler l'URL d'étape de l'API pour /orders/123." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "sam local generate-event apigateway aws-proxy creates a sample proxy event that can be edited and passed to sam local invoke. sam local start-api runs a local HTTP server that emulates API Gateway, so a curl request to the local path invokes the function with a proxy event built from the request. Both run entirely on the local machine."
    fr: "sam local generate-event apigateway aws-proxy crée un exemple d'événement de proxy qui peut être modifié et passé à sam local invoke. sam local start-api exécute un serveur HTTP local qui émule API Gateway : une requête curl vers le chemin local invoque la fonction avec un événement de proxy construit à partir de la requête. Les deux s'exécutent entièrement sur la machine locale."
  options:
    c:
      en: "An SQS receive-message event has a Records array of messages, not the shape of an API Gateway proxy request."
      fr: "Un événement SQS receive-message contient un tableau Records de messages, pas la forme d'une requête de proxy API Gateway."
    d:
      en: "sam remote invoke runs the function deployed in the AWS Cloud, which violates the requirement not to deploy anything."
      fr: "sam remote invoke exécute la fonction déployée dans le cloud AWS, ce qui enfreint l'exigence de ne rien déployer."
    e:
      en: "A stage URL exists only for a deployed API, and linting the template does not run the function."
      fr: "Une URL d'étape n'existe que pour une API déployée, et l'analyse du modèle n'exécute pas la fonction."
references:
  - title: Introduction to testing with sam local start-api
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-local-start-api.html
  - title: Introduction to testing with sam local generate-event
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-local-generate-event.html
