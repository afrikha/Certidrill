id: dvac03-2c-sm-cross-account-cmk
objective: "2.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A secret in AWS Secrets Manager in account A stores the credentials of a partner API. The secret is encrypted with the AWS managed key aws/secretsmanager. An AWS Lambda function in account B must read the secret. The secret's resource policy allows the function's execution role to call secretsmanager:GetSecretValue, and the role's identity-based policy allows the same action on the full secret ARN. The function still receives an access denied error.

    Which solution will resolve the issue?
  fr: |
    Un secret AWS Secrets Manager du compte A stocke les informations d'identification d'une API partenaire. Le secret est chiffré avec la clé gérée par AWS aws/secretsmanager. Une fonction AWS Lambda du compte B doit lire le secret. La politique de ressource du secret autorise le rôle d'exécution de la fonction à appeler secretsmanager:GetSecretValue, et la politique basée sur l'identité du rôle autorise la même action sur l'ARN complet du secret. La fonction reçoit toujours une erreur d'accès refusé.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Add kms:Decrypt on the aws/secretsmanager key of account A, by its full key ARN, to the identity-based policy of the execution role in account B.", fr: "Ajouter kms:Decrypt sur la clé aws/secretsmanager du compte A, via l'ARN complet de la clé, à la politique basée sur l'identité du rôle d'exécution du compte B." }
    - id: b
      text: { en: "Replicate the secret from account A to account B, and have the function read the replica with its own account's credentials.", fr: "Répliquer le secret du compte A vers le compte B, et faire lire la réplique par la fonction avec les informations d'identification de son propre compte." }
    - id: c
      text: { en: "Re-encrypt the secret with a customer managed key in account A, and allow the role kms:Decrypt in the key policy and in its own IAM policy.", fr: "Rechiffrer le secret avec une clé gérée par le client du compte A, et autoriser kms:Decrypt au rôle dans la politique de clé et dans sa propre politique IAM." }
    - id: d
      text: { en: "Change the function code to call GetSecretValue with the secret name instead of the full ARN, so that Secrets Manager resolves the account.", fr: "Modifier le code de la fonction pour appeler GetSecretValue avec le nom du secret au lieu de l'ARN complet, afin que Secrets Manager résolve le compte." }
answer: { optionId: c }
explanation:
  correct:
    en: "Cross-account access to a secret needs the secret's resource policy, the caller's identity policy, and permission to decrypt with the secret's KMS key. The AWS managed key aws/secretsmanager cannot be used across accounts, so the secret must be encrypted with a customer managed key whose key policy allows the external role, and the role's own policy must allow kms:Decrypt on that key."
    fr: "L'accès intercompte à un secret exige la politique de ressource du secret, la politique d'identité de l'appelant et l'autorisation de déchiffrer avec la clé KMS du secret. La clé gérée par AWS aws/secretsmanager ne peut pas être utilisée entre comptes : le secret doit être chiffré avec une clé gérée par le client dont la politique de clé autorise le rôle externe, et la politique du rôle doit autoriser kms:Decrypt sur cette clé."
  options:
    a:
      en: "The key policy of an AWS managed key cannot be changed to allow another account, so an identity policy in account B cannot grant use of aws/secretsmanager."
      fr: "La politique de clé d'une clé gérée par AWS ne peut pas être modifiée pour autoriser un autre compte : une politique d'identité du compte B ne peut pas accorder l'utilisation d'aws/secretsmanager."
    b:
      en: "Secrets Manager replicates secrets to other Regions of the same account, not to other accounts."
      fr: "Secrets Manager réplique les secrets vers d'autres Régions du même compte, pas vers d'autres comptes."
    d:
      en: "A secret in another account must be referenced by its full ARN; a name is resolved in the caller's own account."
      fr: "Un secret d'un autre compte doit être référencé par son ARN complet ; un nom est résolu dans le propre compte de l'appelant."
references:
  - title: Access AWS Secrets Manager secrets from a different account
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access_examples_cross.html
