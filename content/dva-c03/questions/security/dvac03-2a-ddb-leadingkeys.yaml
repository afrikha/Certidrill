id: dvac03-2a-ddb-leadingkeys
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A mobile app gets temporary AWS credentials from an Amazon Cognito identity pool and stores user settings in an Amazon DynamoDB table named UserSettings. The partition key of the table holds the Amazon Cognito identity ID of each user. Each user must be able to read and write only their own items.

    Which condition should the developer add to the statement of the authenticated role that allows GetItem, PutItem, UpdateItem, and Query on the table?
  fr: |
    Une application mobile obtient des informations d'identification AWS temporaires d'un groupe d'identités Amazon Cognito et stocke les paramètres des utilisateurs dans une table Amazon DynamoDB nommée UserSettings. La clé de partition de la table contient l'ID d'identité Amazon Cognito de chaque utilisateur. Chaque utilisateur ne doit pouvoir lire et écrire que ses propres éléments.

    Quelle condition le développeur doit-il ajouter à l'instruction du rôle authentifié qui autorise GetItem, PutItem, UpdateItem et Query sur la table ?
body:
  options:
    - { id: a, text: "`\"ForAllValues:StringEquals\": {\"dynamodb:LeadingKeys\": [\"${cognito-identity.amazonaws.com:sub}\"]}`" }
    - { id: b, text: "`\"ForAllValues:StringEquals\": {\"dynamodb:Attributes\": [\"${cognito-identity.amazonaws.com:sub}\"]}`" }
    - { id: c, text: "`\"ForAnyValue:StringLike\": {\"cognito-identity.amazonaws.com:amr\": \"authenticated\"}`" }
    - { id: d, text: "`\"StringEqualsIfExists\": {\"dynamodb:Select\": \"SPECIFIC_ATTRIBUTES\"}`" }
answer: { optionId: a }
explanation:
  correct:
    en: "dynamodb:LeadingKeys contains the partition key values that a request accesses, and the ${cognito-identity.amazonaws.com:sub} policy variable resolves to the identity ID of the caller. With ForAllValues:StringEquals, every key in the request must equal the caller's identity ID, so users reach only their own items."
    fr: "dynamodb:LeadingKeys contient les valeurs de clé de partition auxquelles une demande accède, et la variable de politique ${cognito-identity.amazonaws.com:sub} prend la valeur de l'ID d'identité de l'appelant. Avec ForAllValues:StringEquals, chaque clé de la demande doit être égale à l'ID d'identité de l'appelant : les utilisateurs n'atteignent que leurs propres éléments."
  options:
    b:
      en: "dynamodb:Attributes lists attribute names that a request accesses, not partition key values."
      fr: "dynamodb:Attributes liste les noms d'attributs auxquels une demande accède, pas les valeurs de clé de partition."
    c:
      en: "The amr key belongs in the role's trust policy to separate authenticated and guest users; it does not limit which items a user reads."
      fr: "La clé amr s'utilise dans la politique d'approbation du rôle pour distinguer les utilisateurs authentifiés des invités ; elle ne limite pas les éléments qu'un utilisateur lit."
    d:
      en: "dynamodb:Select controls which attributes a read returns, not which items the caller can access."
      fr: "dynamodb:Select contrôle les attributs renvoyés par une lecture, pas les éléments auxquels l'appelant peut accéder."
references:
  - title: IAM roles
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/iam-roles.html
  - title: Using IAM policy conditions for fine-grained access control
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/specifying-conditions.html
