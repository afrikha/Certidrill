id: dvac03-2a-presigned-expiry-role
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Lambda function generates S3 presigned GET URLs for invoices stored in a private bucket. It sets ExpiresIn to 7 days and emails the links to customers. Customers report that the links stop working after a few hours. The links must work for 7 days, and the company does not allow IAM user access keys.

    Which solution will meet these requirements?
  fr: |
    Une fonction Lambda génère des URL présignées S3 pour des demandes GET sur des factures stockées dans un compartiment privé. Elle définit ExpiresIn à 7 jours et envoie les liens aux clients par e-mail. Les clients signalent que les liens cessent de fonctionner au bout de quelques heures. Les liens doivent fonctionner pendant 7 jours, et l'entreprise n'autorise pas les clés d'accès d'utilisateur IAM.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deliver the invoices through CloudFront with origin access control, and email 7-day CloudFront signed URLs from a trusted key group.", fr: "Distribuer les factures par CloudFront avec le contrôle d'accès à l'origine (OAC), et envoyer des URL signées CloudFront de 7 jours issues d'un groupe de clés approuvé." } }
    - { id: b, text: { en: "Increase the maximum session duration of the function's execution role to 12 hours, and generate the URLs again.", fr: "Porter la durée de session maximale du rôle d'exécution de la fonction à 12 heures et générer de nouveau les URL." } }
    - { id: c, text: { en: "Set ExpiresIn to 14 days so that the URLs remain valid after the execution role credentials are renewed.", fr: "Définir ExpiresIn à 14 jours pour que les URL restent valides après le renouvellement des informations d'identification du rôle d'exécution." } }
    - { id: d, text: { en: "Call AWS STS GetSessionToken in the function with a 7-day duration, and sign the URLs with those credentials.", fr: "Appeler AWS STS GetSessionToken dans la fonction avec une durée de 7 jours et signer les URL avec ces informations d'identification." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An S3 presigned URL cannot outlive the credentials that signed it, and the function signs with short-lived role session credentials. A CloudFront signed URL is signed with the private key of a trusted key group and expires at the time set in its policy, independently of IAM sessions, while origin access control keeps the bucket private."
    fr: "Une URL présignée S3 ne peut pas survivre aux informations d'identification qui l'ont signée, et la fonction signe avec des informations d'identification de session de rôle de courte durée. Une URL signée CloudFront est signée avec la clé privée d'un groupe de clés approuvé et expire à l'heure fixée dans sa politique, indépendamment des sessions IAM, tandis que le contrôle d'accès à l'origine garde le compartiment privé."
  options:
    b:
      en: "Even 12 hours is far shorter than 7 days, so the links would still stop working early."
      fr: "Même 12 heures restent bien inférieures à 7 jours : les liens cesseraient toujours de fonctionner trop tôt."
    c:
      en: "SigV4 presigned URLs are limited to 7 days, and a URL still stops working when the signing credentials expire."
      fr: "Les URL présignées SigV4 sont limitées à 7 jours, et une URL cesse quand même de fonctionner à l'expiration des informations d'identification de signature."
    d:
      en: "GetSessionToken must be called with the long-term credentials of an IAM user, which the company does not allow."
      fr: "GetSessionToken doit être appelé avec les informations d'identification à long terme d'un utilisateur IAM, que l'entreprise n'autorise pas."
references:
  - title: Download and upload objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html
  - title: Specify signers that can create signed URLs and signed cookies
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-trusted-signers.html
