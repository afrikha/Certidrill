id: dvac03-2c-session-manager-no-ssh
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Developers need interactive shell access to Amazon EC2 development instances in private subnets. The security team requires that no inbound ports are open on the instances' security groups and that no SSH keys must be created, distributed, or rotated.

    Which solution will meet these requirements?
  fr: |
    Des développeurs ont besoin d'un accès shell interactif à des instances de développement Amazon EC2 situées dans des sous-réseaux privés. L'équipe de sécurité exige qu'aucun port entrant ne soit ouvert dans les groupes de sécurité des instances et qu'aucune clé SSH ne doive être créée, distribuée ni renouvelée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use AWS Systems Manager Session Manager with an instance profile that grants Systems Manager permissions, and run aws ssm start-session.", fr: "Utiliser AWS Systems Manager Session Manager avec un profil d'instance qui accorde les autorisations Systems Manager, et exécuter aws ssm start-session." }
    - id: b
      text: { en: "Launch a bastion host in a public subnet with a key pair, and allow inbound port 22 from the bastion host to the instances.", fr: "Lancer un hôte bastion dans un sous-réseau public avec une paire de clés, et autoriser le port 22 entrant depuis l'hôte bastion vers les instances." }
    - id: c
      text: { en: "Create an EC2 Instance Connect Endpoint in the VPC, and allow inbound port 22 from the endpoint's security group to the instances.", fr: "Créer un point de terminaison EC2 Instance Connect dans le VPC, et autoriser le port 22 entrant depuis le groupe de sécurité du point de terminaison vers les instances." }
    - id: d
      text: { en: "Import one key pair per developer, and allow inbound port 22 only from the company's VPN address range to the instances.", fr: "Importer une paire de clés par développeur, et autoriser le port 22 entrant vers les instances uniquement depuis la plage d'adresses du VPN de l'entreprise." }
answer: { optionId: a }
explanation:
  correct:
    en: "Session Manager opens the session through SSM Agent, so inbound SSH ports can stay closed and no bastion host or SSH keys are needed. Access is granted and revoked centrally with IAM policies, and session activity can be logged to Amazon S3 or CloudWatch Logs."
    fr: "Session Manager ouvre la session via SSM Agent : les ports SSH entrants peuvent rester fermés et aucun hôte bastion ni clé SSH n'est nécessaire. L'accès est accordé et révoqué de façon centralisée avec des politiques IAM, et l'activité des sessions peut être journalisée dans Amazon S3 ou CloudWatch Logs."
  options:
    b:
      en: "A bastion host needs a key pair and an open inbound port 22 on the instances, which breaks both requirements."
      fr: "Un hôte bastion nécessite une paire de clés et un port 22 entrant ouvert sur les instances, ce qui enfreint les deux exigences."
    c:
      en: "An EC2 Instance Connect Endpoint still requires inbound SSH from the endpoint to the instances, so an inbound port stays open."
      fr: "Un point de terminaison EC2 Instance Connect exige toujours un accès SSH entrant depuis le point de terminaison vers les instances : un port entrant reste ouvert."
    d:
      en: "Imported key pairs must still be created and distributed, and port 22 stays open to the VPN range."
      fr: "Les paires de clés importées doivent toujours être créées et distribuées, et le port 22 reste ouvert à la plage du VPN."
references:
  - title: AWS Systems Manager Session Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html
