id: dvac03-2d-denied-topic-practice
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A travel company's assistant on Amazon Bedrock must refuse to give legal advice about immigration and visa applications. A developer created a denied topic with the definition "Everything except questions about our trips". The guardrail now blocks many legitimate requests, and some visa questions still get answers.

    Which changes follow Amazon Bedrock Guardrails best practices for denied topics? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    L'assistant d'une agence de voyages sur Amazon Bedrock doit refuser de donner des conseils juridiques sur l'immigration et les demandes de visa. Un développeur a créé un sujet refusé avec la définition « Everything except questions about our trips ». La barrière de protection (guardrail) bloque désormais de nombreuses requêtes légitimes, et certaines questions sur les visas obtiennent toujours une réponse.

    Quelles modifications suivent les bonnes pratiques d'Amazon Bedrock Guardrails pour les sujets refusés ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Rewrite the definition to describe the subject to deny, such as legal advice about immigration or visa applications, without exceptions.", fr: "Réécrire la définition pour décrire le sujet à refuser, par exemple les conseils juridiques sur l'immigration ou les demandes de visa, sans exceptions." } }
    - { id: b, text: { en: "Rewrite the definition as an instruction, such as \"Block all content about visas and immigration law\".", fr: "Réécrire la définition sous forme d'instruction, par exemple « Block all content about visas and immigration law »." } }
    - { id: c, text: { en: "Add up to five sample phrases that show typical visa and immigration questions to deny.", fr: "Ajouter jusqu'à cinq exemples de phrases qui illustrent des questions typiques sur les visas et l'immigration à refuser." } }
    - { id: d, text: { en: "Add the names of all the countries that the company serves to the definition so that the topic matches them.", fr: "Ajouter à la définition les noms de tous les pays desservis par l'entreprise afin que le sujet les détecte." } }
    - { id: e, text: { en: "Replace the denied topic with a prompt attack filter set to HIGH strength on prompts.", fr: "Remplacer le sujet refusé par un filtre d'attaques par invite réglé sur la force HIGH sur les invites." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A denied topic works best with a precise definition (up to 200 characters) of the subject to deny, without negative wording or exceptions such as \"everything except\". Up to five sample phrases of up to 100 characters each show the kind of content to filter and improve detection."
    fr: "Un sujet refusé fonctionne mieux avec une définition précise (jusqu'à 200 caractères) du sujet à refuser, sans formulation négative ni exceptions comme « everything except ». Jusqu'à cinq exemples de phrases de 100 caractères au maximum illustrent le type de contenu à filtrer et améliorent la détection."
  options:
    b:
      en: "AWS advises against instructions in the definition; a phrase like \"Block all content about...\" is an instruction, not a definition of the topic."
      fr: "AWS déconseille les instructions dans la définition ; une phrase comme « Block all content about... » est une instruction, pas une définition du sujet."
    d:
      en: "Denied topics should not be used to catch specific words or entities, and country names would also block legitimate trip questions."
      fr: "Les sujets refusés ne doivent pas servir à détecter des mots ou des entités précis, et des noms de pays bloqueraient aussi des questions légitimes sur les voyages."
    e:
      en: "The prompt attack filter detects jailbreaks and injections, not ordinary questions about a forbidden subject."
      fr: "Le filtre d'attaques par invite détecte les jailbreaks et les injections, pas des questions ordinaires sur un sujet interdit."
references:
  - title: Block denied topics to help remove harmful content
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
