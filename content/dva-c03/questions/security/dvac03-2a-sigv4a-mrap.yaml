id: dvac03-2a-sigv4a-mrap
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an Amazon S3 Multi-Region Access Point. A developer writes a lightweight HTTP client in a language that has no AWS SDK. The client signs requests with a Signature Version 4 implementation that derives a signing key for us-east-1. Requests to the Multi-Region Access Point are rejected, while the same code works against a bucket in us-east-1.

    Which change will resolve the issue?
  fr: |
    Une entreprise utilise un point d'accès multirégion (Multi-Region Access Point) Amazon S3. Un développeur écrit un client HTTP léger dans un langage qui n'a pas d'AWS SDK. Le client signe les demandes avec une implémentation de Signature Version 4 qui dérive une clé de signature pour us-east-1. Les demandes vers le point d'accès multirégion sont rejetées, alors que le même code fonctionne vers un compartiment de us-east-1.

    Quelle modification résout le problème ?
body:
  options:
    - { id: a, text: { en: "Derive a signing key for every Region of the Multi-Region Access Point, and send one signature per Region.", fr: "Dériver une clé de signature pour chaque Région du point d'accès multirégion et envoyer une signature par Région." } }
    - { id: b, text: { en: "Sign the requests with Signature Version 4a, which uses an asymmetric key that is valid for all Regions.", fr: "Signer les demandes avec Signature Version 4a, qui utilise une clé asymétrique valide pour toutes les Régions." } }
    - { id: c, text: { en: "Send the requests unsigned, and add the bucket owner's account ID in the x-amz-expected-bucket-owner header.", fr: "Envoyer les demandes sans signature et ajouter l'ID de compte du propriétaire du compartiment dans l'en-tête x-amz-expected-bucket-owner." } }
    - { id: d, text: { en: "Add the X-Amz-Security-Token header with the session token of the IAM user that signs the requests.", fr: "Ajouter l'en-tête X-Amz-Security-Token avec le jeton de session de l'utilisateur IAM qui signe les demandes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "SigV4 derives a symmetric key scoped to one Region, one service and one day. Multi-Region requests such as those to S3 Multi-Region Access Points require SigV4a, which signs with an ECDSA private key that is valid for all Regions; the AWS SDKs and the AWS CLI switch to it automatically, but a custom client must implement it."
    fr: "SigV4 dérive une clé symétrique limitée à une Région, un service et un jour. Les demandes multirégions, comme celles vers les points d'accès multirégions S3, exigent SigV4a, qui signe avec une clé privée ECDSA valide pour toutes les Régions ; les AWS SDK et l'AWS CLI l'utilisent automatiquement, mais un client personnalisé doit l'implémenter."
  options:
    a:
      en: "SigV4 has no mechanism that accepts several Region-specific signatures for one request."
      fr: "SigV4 ne dispose d'aucun mécanisme qui accepte plusieurs signatures propres à des Régions pour une même demande."
    c:
      en: "Unsigned requests are anonymous, and that header only checks the bucket owner; it does not authenticate the caller."
      fr: "Les demandes non signées sont anonymes, et cet en-tête ne fait que vérifier le propriétaire du compartiment ; il n'authentifie pas l'appelant."
    d:
      en: "Long-term IAM user keys have no session token, and the problem is the signing algorithm, not a missing token."
      fr: "Les clés à long terme d'un utilisateur IAM n'ont pas de jeton de session, et le problème vient de l'algorithme de signature, pas d'un jeton manquant."
references:
  - title: AWS Signature Version 4 for API requests
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv.html
