id: dvac03-2a-multi-oac-signed-urls
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores e-books in a private Amazon S3 bucket that uses SSE-KMS encryption. Customers must download the e-books only through Amazon CloudFront signed URLs, and they must not be able to bypass CloudFront by requesting the objects from S3 directly.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise stocke des livres numériques dans un compartiment Amazon S3 privé chiffré avec SSE-KMS. Les clients ne doivent télécharger les livres que par des URL signées Amazon CloudFront, et ils ne doivent pas pouvoir contourner CloudFront en demandant les objets directement à S3.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure a legacy origin access identity (OAI), and grant it s3:GetObject in the bucket policy.", fr: "Configurer une identité d'accès à l'origine (OAI) héritée et lui accorder s3:GetObject dans la politique de compartiment." } }
    - { id: b, text: { en: "Configure origin access control, and allow the CloudFront service principal for this distribution in the bucket and KMS key policies.", fr: "Configurer le contrôle d'accès à l'origine et autoriser le principal de service CloudFront de cette distribution dans les politiques du compartiment et de la clé KMS." } }
    - { id: c, text: { en: "Make the objects public, and add a bucket policy condition on the Referer header of the distribution.", fr: "Rendre les objets publics et ajouter une condition de politique de compartiment sur l'en-tête Referer de la distribution." } }
    - { id: d, text: { en: "Generate S3 presigned URLs in an origin request policy of the distribution for each customer request.", fr: "Générer des URL présignées S3 dans une politique de demande d'origine de la distribution pour chaque demande client." } }
    - { id: e, text: { en: "Turn on Restrict viewer access for the cache behavior, and add a trusted key group that holds the signing public key.", fr: "Activer Restrict viewer access pour le comportement de cache et ajouter un groupe de clés approuvé qui contient la clé publique de signature." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Origin access control signs CloudFront's requests to S3, supports SSE-KMS, and works with a bucket policy that allows cloudfront.amazonaws.com with an AWS:SourceArn condition for the distribution; the KMS key policy must also allow the distribution. Restricting viewer access with a trusted key group makes CloudFront reject requests without a valid signed URL."
    fr: "Le contrôle d'accès à l'origine signe les demandes de CloudFront vers S3, prend en charge SSE-KMS et s'utilise avec une politique de compartiment qui autorise cloudfront.amazonaws.com avec une condition AWS:SourceArn pour la distribution ; la politique de la clé KMS doit aussi autoriser la distribution. Restreindre l'accès des utilisateurs avec un groupe de clés approuvé fait rejeter par CloudFront les demandes sans URL signée valide."
  options:
    a:
      en: "OAI is legacy and does not support objects encrypted with SSE-KMS."
      fr: "L'OAI est une fonction héritée et ne prend pas en charge les objets chiffrés avec SSE-KMS."
    c:
      en: "Public objects can be downloaded from S3 directly, and the Referer header is set by the client and easy to forge."
      fr: "Des objets publics peuvent être téléchargés directement depuis S3, et l'en-tête Referer est défini par le client et facile à falsifier."
    d:
      en: "Origin request policies choose the headers, cookies and query strings sent to the origin; they do not generate presigned URLs."
      fr: "Les politiques de demande d'origine choisissent les en-têtes, cookies et chaînes de requête envoyés à l'origine ; elles ne génèrent pas d'URL présignées."
references:
  - title: Restrict access to an Amazon S3 origin
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html
  - title: Specify signers that can create signed URLs and signed cookies
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-trusted-signers.html
