id: dvac03-2d-masking-ingestion
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer attached a data protection policy that masks email addresses to the log group of an AI assistant. New log events now show masked email addresses. Log events written to the log group last week still show unmasked addresses to the same developer, who does not have the logs:Unmask permission.

    Which statement explains this behavior?
  fr: |
    Un développeur a attaché au groupe de journaux d'un assistant d'IA une politique de protection des données qui masque les adresses e-mail. Les nouveaux événements du journal affichent désormais des adresses e-mail masquées. Les événements écrits dans le groupe de journaux la semaine dernière affichent toujours des adresses non masquées pour ce même développeur, qui ne dispose pas de l'autorisation logs:Unmask.

    Quelle affirmation explique ce comportement ?
body:
  options:
    - { id: a, text: { en: "Data protection policies are applied to existing events in a background job that can take several days to finish.", fr: "Les politiques de protection des données sont appliquées aux événements existants par une tâche en arrière-plan qui peut prendre plusieurs jours." } }
    - { id: b, text: { en: "Sensitive data is detected and masked when events are ingested, so events ingested before the policy was attached are not masked.", fr: "Les données sensibles sont détectées et masquées lors de l'ingestion des événements : les événements ingérés avant l'attachement de la politique ne sont pas masqués." } }
    - { id: c, text: { en: "The policy masks data only in CloudWatch Logs Insights query results, not when events are viewed in the console.", fr: "La politique masque les données uniquement dans les résultats des requêtes CloudWatch Logs Insights, pas lors de la consultation des événements dans la console." } }
    - { id: d, text: { en: "The policy contains only an Audit operation, so it reports findings for the older events without masking them.", fr: "La politique ne contient qu'une opération Audit : elle signale les données détectées dans les anciens événements sans les masquer." } }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudWatch Logs detects and masks sensitive data when log events are ingested into the log group. Events ingested before the data protection policy was set are not masked, which is why the policy must be in place before sensitive AI interactions are logged."
    fr: "CloudWatch Logs détecte et masque les données sensibles lorsque les événements du journal sont ingérés dans le groupe de journaux. Les événements ingérés avant la mise en place de la politique ne sont pas masqués : la politique doit donc exister avant la journalisation d'interactions d'IA sensibles."
  options:
    a:
      en: "There is no background job that masks older events; only events ingested after the policy is set are masked."
      fr: "Aucune tâche en arrière-plan ne masque les anciens événements ; seuls les événements ingérés après la mise en place de la politique sont masqués."
    c:
      en: "Masking applies at all egress points, including the console, Logs Insights, metric filters, and subscription filters."
      fr: "Le masquage s'applique à tous les points de sortie, y compris la console, Logs Insights, les filtres de métriques et les filtres d'abonnement."
    d:
      en: "The new events are masked, so the policy has a Deidentify operation; the difference comes from when the events were ingested."
      fr: "Les nouveaux événements sont masqués : la politique comporte donc une opération Deidentify ; la différence vient du moment d'ingestion des événements."
references:
  - title: Help protect sensitive log data with masking
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
