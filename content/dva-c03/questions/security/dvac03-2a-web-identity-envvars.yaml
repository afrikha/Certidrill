id: dvac03-2a-web-identity-envvars
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a container on a third-party Kubernetes platform outside AWS. The platform mounts a signed OIDC token for the workload at /var/run/secrets/tokens/aws-token and refreshes it. A developer created an IAM OIDC identity provider for the platform's issuer and an IAM role that trusts it. The application uses the default credential provider chain of the AWS SDK, and its code must not change.

    Which configuration will give the application temporary credentials for the role?
  fr: |
    Une entreprise exécute un conteneur sur une plateforme Kubernetes tierce hors d'AWS. La plateforme monte un jeton OIDC signé pour la charge de travail dans /var/run/secrets/tokens/aws-token et l'actualise. Un développeur a créé un fournisseur d'identité OIDC IAM pour l'émetteur de la plateforme et un rôle IAM qui l'approuve. L'application utilise la chaîne de fournisseurs d'identification par défaut de l'AWS SDK, et son code ne doit pas changer.

    Quelle configuration donne à l'application des informations d'identification temporaires pour le rôle ?
body:
  options:
    - { id: a, text: { en: "Set AWS_SESSION_TOKEN to the contents of the token file, and set AWS_ROLE_ARN to the role ARN.", fr: "Définir AWS_SESSION_TOKEN sur le contenu du fichier de jeton et AWS_ROLE_ARN sur l'ARN du rôle." } }
    - { id: b, text: { en: "Set AWS_ROLE_ARN to the role ARN, and set AWS_WEB_IDENTITY_TOKEN_FILE to the path of the token file.", fr: "Définir AWS_ROLE_ARN sur l'ARN du rôle et AWS_WEB_IDENTITY_TOKEN_FILE sur le chemin du fichier de jeton." } }
    - { id: c, text: { en: "Set AWS_CONTAINER_CREDENTIALS_RELATIVE_URI to the path of the token file, and set AWS_PROFILE to default.", fr: "Définir AWS_CONTAINER_CREDENTIALS_RELATIVE_URI sur le chemin du fichier de jeton et AWS_PROFILE sur default." } }
    - { id: d, text: { en: "Set AWS_PROFILE to a profile whose credential_source is EcsContainer and whose role_arn is the role ARN.", fr: "Définir AWS_PROFILE sur un profil dont credential_source vaut EcsContainer et dont role_arn est l'ARN du rôle." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The web identity credential provider reads AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE, calls AssumeRoleWithWebIdentity with the token, and refreshes the credentials. AWS_ROLE_SESSION_NAME is optional. No code change is needed because the provider is part of the default chain."
    fr: "Le fournisseur d'identification par identité web lit AWS_ROLE_ARN et AWS_WEB_IDENTITY_TOKEN_FILE, appelle AssumeRoleWithWebIdentity avec le jeton et actualise les informations d'identification. AWS_ROLE_SESSION_NAME est facultatif. Aucune modification du code n'est nécessaire, car ce fournisseur fait partie de la chaîne par défaut."
  options:
    a:
      en: "AWS_SESSION_TOKEN must hold an AWS STS session token used with an access key pair; an OIDC token is not one."
      fr: "AWS_SESSION_TOKEN doit contenir un jeton de session AWS STS utilisé avec une paire de clés d'accès ; un jeton OIDC n'en est pas un."
    c:
      en: "This variable points the SDK to the Amazon ECS container credentials endpoint, not to a token file."
      fr: "Cette variable indique au SDK le point de terminaison des informations d'identification de conteneur Amazon ECS, pas un fichier de jeton."
    d:
      en: "EcsContainer takes source credentials from the Amazon ECS container endpoint, which does not exist on a third-party platform."
      fr: "EcsContainer prend les informations d'identification source du point de terminaison de conteneur Amazon ECS, qui n'existe pas sur une plateforme tierce."
references:
  - title: Configuring environment variables for the AWS CLI
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-envvars.html
  - title: AWS SDKs and Tools standardized credential providers
    url: https://docs.aws.amazon.com/sdkref/latest/guide/standardized-credentials.html
