id: dvac03-2b-efs-tls-mount
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon EC2 Linux instances mount an Amazon EFS file system with the standard NFS client by using mount -t nfs4. A security review requires all data in transit between the instances and the file system to be encrypted. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Des instances Amazon EC2 Linux montent un système de fichiers Amazon EFS avec le client NFS standard à l'aide de mount -t nfs4. Un examen de sécurité exige que toutes les données en transit entre les instances et le système de fichiers soient chiffrées. La solution doit avoir la charge opérationnelle la plus FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on encryption at rest for the file system with a customer managed AWS KMS key.", fr: "Activer le chiffrement au repos du système de fichiers avec une clé AWS KMS gérée par le client." }
    - id: b
      text: { en: "Create a new encrypted file system, copy the data to it with AWS DataSync, and update the mounts.", fr: "Créer un nouveau système de fichiers chiffré, y copier les données avec AWS DataSync, puis mettre à jour les montages." }
    - id: c
      text: { en: "Create an interface VPC endpoint for Amazon EFS, and mount the file system through that endpoint.", fr: "Créer un point de terminaison de VPC d'interface pour Amazon EFS, puis monter le système de fichiers par ce point de terminaison." }
    - id: d
      text: { en: "Install amazon-efs-utils, and mount the file system with the EFS mount helper and the tls option.", fr: "Installer amazon-efs-utils, puis monter le système de fichiers avec l'assistant de montage EFS et l'option tls." }
answer: { optionId: d }
explanation:
  correct:
    en: "The EFS mount helper in amazon-efs-utils sets up a TLS connection to the file system when the mount command includes -o tls, and all NFS traffic then goes through that encrypted connection. No data moves and the file system does not change."
    fr: "L'assistant de montage EFS d'amazon-efs-utils établit une connexion TLS vers le système de fichiers lorsque la commande de montage inclut -o tls, et tout le trafic NFS passe ensuite par cette connexion chiffrée. Aucune donnée n'est déplacée et le système de fichiers ne change pas."
  options:
    a:
      en: "Encryption at rest protects stored data, not data in transit, and it can be chosen only when a file system is created."
      fr: "Le chiffrement au repos protège les données stockées et non les données en transit, et il ne peut être choisi qu'à la création d'un système de fichiers."
    b:
      en: "A new file system encrypted at rest still receives unencrypted NFS traffic from the standard client, and the migration adds overhead."
      fr: "Un nouveau système de fichiers chiffré au repos reçoit toujours le trafic NFS non chiffré du client standard, et la migration ajoute de la charge."
    c:
      en: "An interface endpoint serves the EFS management API, not NFS traffic, which goes to mount targets; private connectivity does not encrypt the NFS data."
      fr: "Un point de terminaison d'interface sert l'API de gestion d'EFS et non le trafic NFS, qui passe par les cibles de montage ; une connectivité privée ne chiffre pas les données NFS."
references:
  - title: Encrypting data in transit
    url: https://docs.aws.amazon.com/efs/latest/ug/encryption-in-transit.html
  - title: Mounting on EC2 Linux instances using the EFS mount helper
    url: https://docs.aws.amazon.com/efs/latest/ug/mounting-fs-mount-helper-ec2-linux.html
