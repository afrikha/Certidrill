id: dvac03-2a-multi-credential-process
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer is writing an internal tool that the AWS CLI will run through the credential_process setting of a profile. The tool obtains temporary AWS credentials from the company's credential broker.

    Which statements about the tool are true? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur écrit un outil interne que l'AWS CLI exécutera par le paramètre credential_process d'un profil. L'outil obtient des informations d'identification AWS temporaires auprès du service d'identification de l'entreprise.

    Quelles affirmations sur l'outil sont vraies ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The tool must write the credentials to ~/.aws/credentials, and the AWS CLI reads that file after the tool exits.", fr: "L'outil doit écrire les informations d'identification dans ~/.aws/credentials, et l'AWS CLI lit ce fichier après la fin de l'outil." } }
    - { id: b, text: { en: "The AWS CLI caches the tool's output in ~/.aws/cli/cache, so the tool does not need any caching of its own.", fr: "L'AWS CLI met en cache la sortie de l'outil dans ~/.aws/cli/cache : l'outil n'a besoin d'aucune mise en cache propre." } }
    - { id: c, text: { en: "The tool must print JSON to standard output with Version set to 1 and the AccessKeyId, SecretAccessKey, and SessionToken values.", fr: "L'outil doit écrire sur la sortie standard un JSON avec Version défini à 1 et les valeurs AccessKeyId, SecretAccessKey et SessionToken." } }
    - { id: d, text: { en: "The credential_process value can start the path of the tool with ~ to refer to the user's home folder.", fr: "La valeur de credential_process peut commencer le chemin de l'outil par ~ pour désigner le dossier personnel de l'utilisateur." } }
    - { id: e, text: { en: "If the output includes an Expiration timestamp, the AWS CLI runs the tool again before the credentials expire.", fr: "Si la sortie inclut un horodatage Expiration, l'AWS CLI exécute de nouveau l'outil avant l'expiration des informations d'identification." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "The CLI reads a JSON document from STDOUT with Version 1, AccessKeyId, SecretAccessKey, SessionToken for temporary credentials, and Expiration as an ISO 8601 timestamp. When Expiration is present, the CLI runs the command again before that time; without it, the credentials are treated as long-term and never refreshed."
    fr: "La CLI lit sur STDOUT un document JSON avec Version 1, AccessKeyId, SecretAccessKey, SessionToken pour des informations d'identification temporaires, et Expiration sous forme d'horodatage ISO 8601. Quand Expiration est présent, la CLI réexécute la commande avant cette heure ; sans lui, les informations d'identification sont considérées comme à long terme et ne sont jamais actualisées."
  options:
    a:
      en: "The CLI reads the tool's standard output; it does not expect the tool to write a file."
      fr: "La CLI lit la sortie standard de l'outil ; elle n'attend pas que l'outil écrive un fichier."
    b:
      en: "The CLI does not cache external process credentials the way it caches assume-role credentials; caching must be built into the tool."
      fr: "La CLI ne met pas en cache les informations d'identification d'un processus externe comme celles d'un rôle assumé ; la mise en cache doit être intégrée à l'outil."
    d:
      en: "The path must be a full path: ~ and environment variables such as $HOME are not supported."
      fr: "Le chemin doit être complet : ~ et les variables d'environnement comme $HOME ne sont pas pris en charge."
references:
  - title: Sourcing credentials with an external process in the AWS CLI
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sourcing-external.html
