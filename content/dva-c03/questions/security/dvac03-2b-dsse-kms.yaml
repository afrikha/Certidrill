id: dvac03-2b-dsse-kms
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A government contractor stores documents in Amazon S3. A regulatory standard requires two independent layers of encryption at rest for every object, with the encryption keys managed in AWS KMS. The company does not want to add a client-side encryption library to its applications.

    Which solution will meet these requirements?
  fr: |
    Un sous-traitant gouvernemental stocke des documents dans Amazon S3. Une norme réglementaire exige deux couches indépendantes de chiffrement au repos pour chaque objet, avec des clés de chiffrement gérées dans AWS KMS. L'entreprise ne veut pas ajouter de bibliothèque de chiffrement côté client à ses applications.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Encrypt the objects with SSE-KMS and a customer managed key, and turn on S3 Bucket Keys.", fr: "Chiffrer les objets avec SSE-KMS et une clé gérée par le client, et activer les S3 Bucket Keys." }
    - id: b
      text: { en: "Encrypt the objects with SSE-KMS by using a multi-Region key that is replicated to a second Region.", fr: "Chiffrer les objets avec SSE-KMS à l'aide d'une clé multi-Région répliquée dans une seconde Région." }
    - id: c
      text: { en: "Encrypt the objects with DSSE-KMS by setting the x-amz-server-side-encryption header to aws:kms:dsse.", fr: "Chiffrer les objets avec DSSE-KMS en définissant l'en-tête x-amz-server-side-encryption sur aws:kms:dsse." }
    - id: d
      text: { en: "Encrypt the objects with SSE-S3, and replicate them to a second bucket that uses SSE-KMS.", fr: "Chiffrer les objets avec SSE-S3, et les répliquer vers un second compartiment qui utilise SSE-KMS." }
answer: { optionId: c }
explanation:
  correct:
    en: "DSSE-KMS applies two independent layers of AES-256 encryption on the server side: one with a data key from AWS KMS and one with a separate key managed by Amazon S3. It is designed for standards that require multilayer encryption, and it needs no client-side library."
    fr: "DSSE-KMS applique côté serveur deux couches indépendantes de chiffrement AES-256 : l'une avec une clé de données d'AWS KMS, l'autre avec une clé distincte gérée par Amazon S3. Il est conçu pour les normes qui exigent un chiffrement multicouche, et ne nécessite aucune bibliothèque côté client."
  options:
    a:
      en: "SSE-KMS applies a single layer of encryption; Bucket Keys only reduce KMS requests."
      fr: "SSE-KMS applique une seule couche de chiffrement ; les Bucket Keys ne font que réduire les requêtes KMS."
    b:
      en: "A multi-Region key can be used in several Regions, but each object still has a single layer of encryption."
      fr: "Une clé multi-Région peut être utilisée dans plusieurs Régions, mais chaque objet n'a toujours qu'une seule couche de chiffrement."
    d:
      en: "Each copy of the object has one layer of encryption; two copies with different methods are not two layers on the same object."
      fr: "Chaque copie de l'objet a une seule couche de chiffrement ; deux copies avec des méthodes différentes ne constituent pas deux couches sur le même objet."
references:
  - title: Using dual-layer server-side encryption with AWS KMS keys (DSSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingDSSEncryption.html
