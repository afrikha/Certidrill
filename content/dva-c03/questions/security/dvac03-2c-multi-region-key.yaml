id: dvac03-2c-multi-region-key
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is building a new application that encrypts sensitive attributes on the client side before it writes them to an Amazon DynamoDB global table in us-east-1. A copy of the application in eu-west-1 reads the replicated items and must decrypt the attributes. Decryption in eu-west-1 must not call AWS KMS in us-east-1, and the data must not be re-encrypted during replication.

    Which solution will meet these requirements?
  fr: |
    Une entreprise développe une nouvelle application qui chiffre côté client des attributs sensibles avant de les écrire dans une table globale Amazon DynamoDB dans us-east-1. Une copie de l'application dans eu-west-1 lit les éléments répliqués et doit déchiffrer les attributs. Le déchiffrement dans eu-west-1 ne doit pas appeler AWS KMS dans us-east-1, et les données ne doivent pas être rechiffrées pendant la réplication.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a single-Region key in each Region with the same alias name, and have each copy of the application use the alias in its own Region.", fr: "Créer une clé à région unique dans chaque Région avec le même nom d'alias, et faire utiliser à chaque copie de l'application l'alias de sa propre Région." }
    - id: b
      text: { en: "Create a single-Region key in us-east-1, and allow the role of the eu-west-1 application to call Decrypt on that key by its key ARN.", fr: "Créer une clé à région unique dans us-east-1, et autoriser le rôle de l'application d'eu-west-1 à appeler Decrypt sur cette clé via son ARN." }
    - id: c
      text: { en: "Create a single-Region key in each Region, and call ReEncrypt for every item with the eu-west-1 key as the destination key before replication.", fr: "Créer une clé à région unique dans chaque Région, et appeler ReEncrypt pour chaque élément avec la clé d'eu-west-1 comme clé de destination avant la réplication." }
    - id: d
      text: { en: "Create a multi-Region primary key in us-east-1, replicate it to eu-west-1, and have each copy of the application use the key in its own Region.", fr: "Créer une clé principale multi-Régions dans us-east-1, la répliquer dans eu-west-1, et faire utiliser à chaque copie de l'application la clé de sa propre Région." }
answer: { optionId: d }
explanation:
  correct:
    en: "Related multi-Region keys share the same key ID and key material, so a replica key in eu-west-1 can decrypt ciphertext produced with the primary key in us-east-1. Data is encrypted in one Region and decrypted in another without re-encryption or a cross-Region call to AWS KMS. Because the application is new, the key can be created as multi-Region from the start; an existing single-Region key cannot be converted."
    fr: "Des clés multi-Régions associées partagent le même ID de clé et le même matériel de clé : une clé réplica dans eu-west-1 peut déchiffrer le texte chiffré produit avec la clé principale dans us-east-1. Les données sont chiffrées dans une Région et déchiffrées dans une autre sans rechiffrement ni appel interrégional à AWS KMS. L'application étant nouvelle, la clé peut être créée multi-Régions dès le départ ; une clé à région unique existante ne peut pas être convertie."
  options:
    a:
      en: "An alias is only a name: the two keys have different key material, so the eu-west-1 key cannot decrypt ciphertext from the us-east-1 key."
      fr: "Un alias n'est qu'un nom : les deux clés ont un matériel de clé différent, donc la clé d'eu-west-1 ne peut pas déchiffrer le texte chiffré de la clé d'us-east-1."
    b:
      en: "Every decryption would call AWS KMS in us-east-1, which the requirements forbid."
      fr: "Chaque déchiffrement appellerait AWS KMS dans us-east-1, ce que les exigences interdisent."
    c:
      en: "ReEncrypt re-encrypts every item under another key, which the requirements forbid, and it adds one KMS call per item."
      fr: "ReEncrypt rechiffre chaque élément sous une autre clé, ce que les exigences interdisent, et ajoute un appel KMS par élément."
references:
  - title: Multi-Region keys in AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html
