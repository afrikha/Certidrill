id: dvac03-2d-gateway-jwt
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company exposes internal tools to AI agents through an Amazon Bedrock AgentCore Gateway. The calling applications sign in their users with an Amazon Cognito user pool and receive JWT access tokens for one app client. The gateway itself must reject any call that does not carry a valid token issued for that app client.

    Which inbound authorization configuration will meet these requirements?
  fr: |
    Une entreprise expose des outils internes à des agents d'IA par une passerelle Amazon Bedrock AgentCore Gateway. Les applications appelantes connectent leurs utilisateurs avec un groupe d'utilisateurs Amazon Cognito et reçoivent des jetons d'accès JWT pour un client d'application. La passerelle elle-même doit rejeter tout appel qui ne porte pas un jeton valide émis pour ce client d'application.

    Quelle configuration d'autorisation entrante répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the authorizer type to AUTHENTICATE_ONLY so that the gateway verifies each caller before forwarding the request.", fr: "Définir le type d'autorisateur sur AUTHENTICATE_ONLY afin que la passerelle vérifie chaque appelant avant de transmettre la requête." } }
    - { id: b, text: { en: "Set the authorizer type to CUSTOM_JWT with the user pool's discovery URL and the app client ID in allowedClients.", fr: "Définir le type d'autorisateur sur CUSTOM_JWT avec l'URL de découverte du groupe d'utilisateurs et l'ID du client d'application dans allowedClients." } }
    - { id: c, text: { en: "Set the authorizer type to NONE, and have each target validate the JWT that it receives from the gateway.", fr: "Définir le type d'autorisateur sur NONE, et faire valider par chaque cible le JWT qu'elle reçoit de la passerelle." } }
    - { id: d, text: { en: "Use IAM authorization, and attach a policy that allows bedrock-agentcore:InvokeGateway to the Cognito user pool.", fr: "Utiliser l'autorisation IAM, et attacher au groupe d'utilisateurs Cognito une politique qui autorise bedrock-agentcore:InvokeGateway." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A CUSTOM_JWT authorizer makes the gateway validate the JWT against the identity provider's discovery URL and check the client_id claim against the allowed clients. Calls without a valid token for the app client are rejected before they reach the targets."
    fr: "Un autorisateur CUSTOM_JWT fait valider le JWT par la passerelle à l'aide de l'URL de découverte du fournisseur d'identité et vérifier la revendication client_id par rapport aux clients autorisés. Les appels sans jeton valide pour le client d'application sont rejetés avant d'atteindre les cibles."
  options:
    a:
      en: "AUTHENTICATE_ONLY verifies a SigV4 signature, not a JWT, and makes no authorization decision."
      fr: "AUTHENTICATE_ONLY vérifie une signature SigV4, pas un JWT, et ne prend aucune décision d'autorisation."
    c:
      en: "With NONE, the gateway forwards any caller, so the gateway itself does not reject calls without a valid token."
      fr: "Avec NONE, la passerelle transmet tous les appelants : la passerelle elle-même ne rejette pas les appels sans jeton valide."
    d:
      en: "A user pool is not an IAM principal, and users with JWTs do not sign requests with IAM credentials."
      fr: "Un groupe d'utilisateurs n'est pas un principal IAM, et les utilisateurs munis de JWT ne signent pas leurs requêtes avec des informations d'identification IAM."
references:
  - title: Set up inbound authorization for your gateway
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-inbound-auth.html
