id: dvac03-2b-sse-kms-upload-perms
objective: "2.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An Amazon S3 bucket uses SSE-KMS with a customer managed key as its default encryption. The key policy contains the default statement that enables IAM policies for the account. An application role allows s3:PutObject and s3:GetObject on the bucket. Small uploads fail with an AccessDenied error from AWS KMS, large files sent with multipart upload also fail, and downloads of existing objects fail.

    Which permissions must be added on the key to the policy of the application role? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compartiment Amazon S3 utilise comme chiffrement par défaut SSE-KMS avec une clé gérée par le client. La politique de clé contient l'instruction par défaut qui active les politiques IAM pour le compte. Le rôle d'une application autorise s3:PutObject et s3:GetObject sur le compartiment. Les petits chargements échouent avec une erreur AccessDenied d'AWS KMS, les fichiers volumineux envoyés par chargement partitionné échouent aussi, et les téléchargements d'objets existants échouent.

    Quelles autorisations faut-il ajouter sur la clé à la politique du rôle de l'application ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: kms:GenerateDataKey
    - id: b
      text: kms:CreateGrant
    - id: c
      text: kms:GenerateDataKeyPair
    - id: d
      text: kms:Decrypt
    - id: e
      text: kms:ReEncrypt*
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "When an object is uploaded with SSE-KMS, Amazon S3 asks AWS KMS for a data key on behalf of the caller, which requires kms:GenerateDataKey. Reading an object requires kms:Decrypt to decrypt its data key. A multipart upload needs both permissions, so these two permissions fix all three failures."
    fr: "Lorsqu'un objet est chargé avec SSE-KMS, Amazon S3 demande à AWS KMS une clé de données pour le compte de l'appelant, ce qui exige kms:GenerateDataKey. La lecture d'un objet exige kms:Decrypt pour déchiffrer sa clé de données. Un chargement partitionné nécessite les deux autorisations : ces deux autorisations corrigent donc les trois échecs."
  options:
    b:
      en: "Amazon S3 does not need a grant from the caller to encrypt or decrypt objects with SSE-KMS."
      fr: "Amazon S3 n'a pas besoin d'un octroi de l'appelant pour chiffrer ou déchiffrer des objets avec SSE-KMS."
    c:
      en: "GenerateDataKeyPair returns asymmetric data key pairs, which SSE-KMS does not use."
      fr: "GenerateDataKeyPair renvoie des paires de clés de données asymétriques, que SSE-KMS n'utilise pas."
    e:
      en: "ReEncrypt moves ciphertext from one KMS key to another; normal uploads and downloads do not call it."
      fr: "ReEncrypt fait passer un texte chiffré d'une clé KMS à une autre ; les chargements et téléchargements normaux ne l'appellent pas."
references:
  - title: Using server-side encryption with AWS KMS keys (SSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html
