id: dvac03-2d-agentcore-identity
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An agent hosted on Amazon Bedrock AgentCore Runtime must read each user's files in a third-party SaaS storage service that supports OAuth 2.0. The agent must act on behalf of the signed-in user, with that user's consent. The agent code must not contain or store any client secret or refresh token.

    Which solution will meet these requirements?
  fr: |
    Un agent hébergé sur Amazon Bedrock AgentCore Runtime doit lire les fichiers de chaque utilisateur dans un service de stockage SaaS tiers qui prend en charge OAuth 2.0. L'agent doit agir au nom de l'utilisateur connecté, avec le consentement de celui-ci. Le code de l'agent ne doit contenir ni stocker aucun secret client ni jeton d'actualisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the OAuth client secret in an environment variable of the runtime, and exchange it for a token at the start of each session.", fr: "Stocker le secret client OAuth dans une variable d'environnement de l'environnement d'exécution, et l'échanger contre un jeton au début de chaque session." } }
    - { id: b, text: { en: "Configure an OAuth 2.0 credential provider in AgentCore Identity, and use the @requires_access_token decorator with auth_flow set to M2M.", fr: "Configurer un fournisseur d'informations d'identification OAuth 2.0 dans AgentCore Identity, et utiliser le décorateur @requires_access_token avec auth_flow défini sur M2M." } }
    - { id: c, text: { en: "Store one refresh token of a service account in AWS Secrets Manager, and have the agent read it with the GetSecretValue API.", fr: "Stocker un jeton d'actualisation d'un compte de service dans AWS Secrets Manager, et faire lire ce jeton par l'agent avec l'API GetSecretValue." } }
    - { id: d, text: { en: "Configure an OAuth 2.0 credential provider in AgentCore Identity, and use the @requires_access_token decorator with auth_flow set to USER_FEDERATION.", fr: "Configurer un fournisseur d'informations d'identification OAuth 2.0 dans AgentCore Identity, et utiliser le décorateur @requires_access_token avec auth_flow défini sur USER_FEDERATION." } }
answer: { optionId: d }
explanation:
  correct:
    en: "USER_FEDERATION runs a three-legged OAuth flow: the user authorizes access through the URL passed to on_auth_url, and AgentCore Identity stores the access and refresh tokens in its token vault. The decorator injects a token for that user at run time, so the agent code holds no secret."
    fr: "USER_FEDERATION exécute un flux OAuth à trois acteurs : l'utilisateur autorise l'accès par l'URL transmise à on_auth_url, et AgentCore Identity stocke les jetons d'accès et d'actualisation dans son coffre de jetons. Le décorateur injecte un jeton de cet utilisateur à l'exécution : le code de l'agent ne détient aucun secret."
  options:
    a:
      en: "The secret would be stored with the runtime configuration, and a client secret alone does not give access on behalf of each user."
      fr: "Le secret serait stocké dans la configuration de l'environnement d'exécution, et un secret client seul ne donne pas un accès au nom de chaque utilisateur."
    b:
      en: "M2M is the machine-to-machine flow: the agent acts as itself, not on behalf of the signed-in user with consent."
      fr: "M2M est le flux de machine à machine : l'agent agit en son propre nom, pas au nom de l'utilisateur connecté avec son consentement."
    c:
      en: "A shared service account token gives the same access for every user, not access on behalf of each user, and the agent would handle a refresh token."
      fr: "Un jeton de compte de service partagé donne le même accès pour tous les utilisateurs, et non un accès au nom de chacun, et l'agent manipulerait un jeton d'actualisation."
references:
  - title: Obtain OAuth 2.0 access token
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-authentication.html
