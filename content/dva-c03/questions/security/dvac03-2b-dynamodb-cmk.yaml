id: dvac03-2b-dynamodb-cmk
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer created an Amazon DynamoDB table with the default settings. A new security requirement states that the company must control the key policy of the encryption key that protects the table and must audit each use of that key in AWS CloudTrail. The table must stay online, and no data can be migrated.

    Which solution will meet these requirements?
  fr: |
    Un développeur a créé une table Amazon DynamoDB avec les paramètres par défaut. Une nouvelle exigence de sécurité impose que l'entreprise contrôle la politique de clé de la clé de chiffrement qui protège la table et audite chaque utilisation de cette clé dans AWS CloudTrail. La table doit rester en ligne, et aucune donnée ne peut être migrée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Make no change, because the default encryption at rest of DynamoDB already meets the requirement.", fr: "Ne rien modifier, car le chiffrement au repos par défaut de DynamoDB répond déjà à l'exigence." }
    - id: b
      text: { en: "Export the table to Amazon S3, and import the data into a new table that uses a customer managed key.", fr: "Exporter la table vers Amazon S3, puis importer les données dans une nouvelle table qui utilise une clé gérée par le client." }
    - id: c
      text: { en: "Switch the encryption at rest of the table to the AWS managed key aws/dynamodb.", fr: "Basculer le chiffrement au repos de la table vers la clé gérée par AWS aws/dynamodb." }
    - id: d
      text: { en: "Switch the encryption at rest of the table to a customer managed key that the company creates in AWS KMS.", fr: "Basculer le chiffrement au repos de la table vers une clé gérée par le client que l'entreprise crée dans AWS KMS." }
answer: { optionId: d }
explanation:
  correct:
    en: "DynamoDB encrypts all tables at rest and lets you switch the key type of an existing table at any time without recreating it. A customer managed key is created, owned, and controlled by the company, including its key policy, and its use is logged in CloudTrail."
    fr: "DynamoDB chiffre toutes les tables au repos et permet de changer à tout moment le type de clé d'une table existante sans la recréer. Une clé gérée par le client est créée, détenue et contrôlée par l'entreprise, y compris sa politique de clé, et son utilisation est journalisée dans CloudTrail."
  options:
    a:
      en: "The default is an AWS owned key, which the company cannot see, manage, or audit."
      fr: "La valeur par défaut est une clé détenue par AWS, que l'entreprise ne peut ni voir, ni gérer, ni auditer."
    b:
      en: "The key type of an existing table can be changed in place, so the export and import adds a data migration that the requirement forbids."
      fr: "Le type de clé d'une table existante peut être modifié sur place : l'exportation et l'importation ajoutent une migration de données que l'exigence interdit."
    c:
      en: "An AWS managed key is logged in CloudTrail, but AWS controls its key policy, which fails the requirement."
      fr: "Une clé gérée par AWS est journalisée dans CloudTrail, mais AWS contrôle sa politique de clé, ce qui ne respecte pas l'exigence."
references:
  - title: DynamoDB encryption at rest
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/EncryptionAtRest.html
