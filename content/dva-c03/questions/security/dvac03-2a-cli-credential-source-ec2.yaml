id: dvac03-2a-cli-credential-source-ec2
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A maintenance script runs on an Amazon EC2 instance that has an instance profile. The script runs AWS CLI commands with --profile reporting to read data in another account through the role ReportingReadRole, which trusts the instance profile role. No credentials file exists on the instance, and the company forbids storing access keys on it.

    Which configuration of the reporting profile will meet these requirements?
  fr: |
    Un script de maintenance s'exécute sur une instance Amazon EC2 dotée d'un profil d'instance. Le script exécute des commandes de l'AWS CLI avec --profile reporting pour lire des données d'un autre compte par le rôle ReportingReadRole, qui approuve le rôle du profil d'instance. Aucun fichier credentials n'existe sur l'instance, et l'entreprise interdit d'y stocker des clés d'accès.

    Quelle configuration du profil reporting répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "`role_arn` set to the ReportingReadRole ARN and `source_profile = default`.", fr: "`role_arn` défini sur l'ARN de ReportingReadRole et `source_profile = default`." } }
    - { id: b, text: { en: "`credential_process` set to a script that reads the instance metadata service and prints the credentials.", fr: "`credential_process` défini sur un script qui lit le service de métadonnées d'instance et affiche les informations d'identification." } }
    - { id: c, text: { en: "`role_arn` set to the ReportingReadRole ARN and `credential_source = Ec2InstanceMetadata`.", fr: "`role_arn` défini sur l'ARN de ReportingReadRole et `credential_source = Ec2InstanceMetadata`." } }
    - { id: d, text: { en: "`role_arn` set to the ReportingReadRole ARN and `web_identity_token_file` set to the instance identity document.", fr: "`role_arn` défini sur l'ARN de ReportingReadRole et `web_identity_token_file` défini sur le document d'identité de l'instance." } }
answer: { optionId: c }
explanation:
  correct:
    en: "credential_source tells the CLI where to get the source credentials instead of a source_profile. With Ec2InstanceMetadata, the CLI uses the instance profile credentials to call AssumeRole for the role in role_arn, so no access key is stored on the instance."
    fr: "credential_source indique à la CLI où obtenir les informations d'identification source au lieu d'un source_profile. Avec Ec2InstanceMetadata, la CLI utilise les informations d'identification du profil d'instance pour appeler AssumeRole sur le rôle de role_arn : aucune clé d'accès n'est stockée sur l'instance."
  options:
    a:
      en: "source_profile must name a profile that holds credentials, and no such profile exists on the instance."
      fr: "source_profile doit désigner un profil qui contient des informations d'identification, et aucun profil de ce type n'existe sur l'instance."
    b:
      en: "The script would return the instance role's own credentials without assuming ReportingReadRole, and a custom credential process adds risk."
      fr: "Le script renverrait les informations d'identification du rôle de l'instance sans assumer ReportingReadRole, et un processus d'identification personnalisé ajoute des risques."
    d:
      en: "The instance identity document is not an OIDC token, so AssumeRoleWithWebIdentity would reject it."
      fr: "Le document d'identité de l'instance n'est pas un jeton OIDC : AssumeRoleWithWebIdentity le rejetterait."
references:
  - title: Using an IAM role in the AWS CLI
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-role.html
