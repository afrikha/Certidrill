id: dvac03-2b-role-chaining-duration
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A batch script runs with temporary credentials of the IAM role BatchRole, which it obtained from an earlier AssumeRole call. The script then calls AssumeRole for the role ReportRole in another account with DurationSeconds set to 7200. ReportRole has a maximum session duration of 14,400 seconds, and its trust policy allows BatchRole. The call fails with a validation error about the requested duration. The script must keep working with ReportRole for 2 hours.

    Which solution will meet these requirements?
  fr: |
    Un script de traitement par lots s'exécute avec les informations d'identification temporaires du rôle IAM BatchRole, obtenues par un appel AssumeRole précédent. Le script appelle ensuite AssumeRole sur le rôle ReportRole d'un autre compte avec DurationSeconds défini sur 7200. ReportRole a une durée de session maximale de 14 400 secondes, et sa politique d'approbation autorise BatchRole. L'appel échoue avec une erreur de validation sur la durée demandée. Le script doit continuer à travailler avec ReportRole pendant 2 heures.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the maximum session duration of ReportRole to 43,200 seconds, and call AssumeRole again with the same duration.", fr: "Augmenter la durée de session maximale de ReportRole à 43 200 secondes, puis rappeler AssumeRole avec la même durée." }
    - id: b
      text: { en: "Set DurationSeconds to 43200 in the AssumeRole call so that the request uses the highest duration that STS supports.", fr: "Définir DurationSeconds sur 43200 dans l'appel AssumeRole pour que la requête utilise la durée la plus élevée prise en charge par STS." }
    - id: c
      text: { en: "Call GetSessionToken with the BatchRole credentials and a duration of 7,200 seconds, and use the result in the other account.", fr: "Appeler GetSessionToken avec les informations d'identification de BatchRole et une durée de 7 200 secondes, puis utiliser le résultat dans l'autre compte." }
    - id: d
      text: { en: "Request a DurationSeconds value of 3600 or less, and call AssumeRole again to refresh the credentials before they expire.", fr: "Demander une valeur DurationSeconds de 3600 ou moins, puis rappeler AssumeRole pour renouveler les informations d'identification avant leur expiration." }
answer: { optionId: d }
explanation:
  correct:
    en: "Using the credentials of one role to assume another role is role chaining, and a chained session is limited to one hour whatever the maximum session duration of the role. A DurationSeconds value above 3600 therefore fails. The script must request one hour or less and assume ReportRole again before the credentials expire."
    fr: "Utiliser les informations d'identification d'un rôle pour en assumer un autre constitue un chaînage de rôles (role chaining), et une session chaînée est limitée à une heure, quelle que soit la durée de session maximale du rôle. Une valeur DurationSeconds supérieure à 3600 échoue donc. Le script doit demander une heure ou moins et assumer de nouveau ReportRole avant l'expiration des informations d'identification."
  options:
    a:
      en: "The maximum session duration does not apply to chained sessions, which stay limited to one hour."
      fr: "La durée de session maximale ne s'applique pas aux sessions chaînées, qui restent limitées à une heure."
    b:
      en: "43,200 seconds exceeds both the one-hour limit of role chaining and the role's maximum session duration, so the call still fails."
      fr: "43 200 secondes dépassent à la fois la limite d'une heure du chaînage de rôles et la durée de session maximale du rôle : l'appel échoue toujours."
    c:
      en: "GetSessionToken must be called with the credentials of an IAM user or the root user, not with role credentials, and it does not give access to a role in another account."
      fr: "GetSessionToken doit être appelé avec les informations d'identification d'un utilisateur IAM ou de l'utilisateur racine, et non avec celles d'un rôle, et il ne donne pas accès à un rôle d'un autre compte."
references:
  - title: Methods to assume a role
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use.html
  - title: AssumeRole
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
