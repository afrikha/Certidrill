id: dvac03-2a-apigw-scopes-access-token
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon API Gateway REST API uses an Amazon Cognito user pool authorizer. A developer adds the OAuth scope orders/read to the GET /orders method and redeploys the API. The web app still sends the user's ID token in the Authorization header, and every call to GET /orders now returns 401 Unauthorized.

    Which change will resolve the issue?
  fr: |
    Une API REST Amazon API Gateway utilise un mécanisme d'autorisation de groupe d'utilisateurs Amazon Cognito. Un développeur ajoute la portée OAuth orders/read à la méthode GET /orders et redéploie l'API. L'application web envoie toujours le jeton d'identification de l'utilisateur dans l'en-tête Authorization, et chaque appel à GET /orders renvoie désormais 401 Unauthorized.

    Quelle modification résout le problème ?
body:
  options:
    - { id: a, text: { en: "Add a token validation regular expression that matches the aud claim of the ID token.", fr: "Ajouter une expression régulière de validation du jeton qui correspond à la revendication aud du jeton d'identification." } }
    - { id: b, text: { en: "Send an access token that contains the orders/read scope in the Authorization header.", fr: "Envoyer dans l'en-tête Authorization un jeton d'accès qui contient la portée orders/read." } }
    - { id: c, text: { en: "Switch the method to IAM authorization and sign the requests with the ID token.", fr: "Passer la méthode en autorisation IAM et signer les demandes avec le jeton d'identification." } }
    - { id: d, text: { en: "Enable API caching on the stage so that the authorizer result for the ID token is reused.", fr: "Activer la mise en cache de l'API sur l'étape (stage) pour réutiliser le résultat d'autorisation du jeton d'identification." } }
answer: { optionId: b }
explanation:
  correct:
    en: "When a method has authorization scopes, the Cognito authorizer treats the token as an access token and compares its scope claim with the scopes of the method; without scopes, it expects an ID token. The app must request the orders/read scope during sign-in and send the resulting access token."
    fr: "Quand une méthode a des portées d'autorisation, le mécanisme d'autorisation Cognito traite le jeton comme un jeton d'accès et compare sa revendication scope aux portées de la méthode ; sans portées, il attend un jeton d'identification. L'application doit demander la portée orders/read à la connexion et envoyer le jeton d'accès obtenu."
  options:
    a:
      en: "The aud regular expression does not add scopes to the ID token, and it rejects access tokens, which have no aud claim."
      fr: "L'expression régulière sur aud n'ajoute pas de portées au jeton d'identification, et elle rejette les jetons d'accès, qui n'ont pas de revendication aud."
    c:
      en: "IAM authorization needs SigV4 signatures made with AWS credentials; an ID token is not an AWS credential."
      fr: "L'autorisation IAM exige des signatures SigV4 calculées avec des informations d'identification AWS ; un jeton d'identification n'en est pas une."
    d:
      en: "Stage caching stores integration responses; it does not change how the authorizer checks scopes."
      fr: "La mise en cache de l'étape stocke les réponses d'intégration ; elle ne change pas la façon dont le mécanisme d'autorisation vérifie les portées."
references:
  - title: Integrate a REST API with an Amazon Cognito user pool
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-enable-cognito-user-pool.html
