id: dvac03-2b-listbucket-arn
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer attaches the following identity-based policy to the IAM role of an application:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:ListBucket", "s3:GetObject"],
          "Resource": "arn:aws:s3:::media-assets/*"
        }
      ]
    }
    ```

    The application can download objects by key, but its ListObjectsV2 calls on the media-assets bucket return an AccessDenied error. The developer must fix the problem without allowing any additional action.

    Which solution will meet these requirements?
  fr: |
    Un développeur attache la politique basée sur l'identité suivante au rôle IAM d'une application :

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:ListBucket", "s3:GetObject"],
          "Resource": "arn:aws:s3:::media-assets/*"
        }
      ]
    }
    ```

    L'application peut télécharger des objets par leur clé, mais ses appels ListObjectsV2 sur le compartiment media-assets renvoient une erreur AccessDenied. Le développeur doit corriger le problème sans autoriser aucune action supplémentaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add arn:aws:s3:::media-assets to the Resource element so that s3:ListBucket applies to the bucket itself.", fr: "Ajouter arn:aws:s3:::media-assets à l'élément Resource pour que s3:ListBucket s'applique au compartiment lui-même." }
    - id: b
      text: { en: "Replace s3:ListBucket with s3:ListObjectsV2 in the Action element so that the action matches the API name.", fr: "Remplacer s3:ListBucket par s3:ListObjectsV2 dans l'élément Action pour que l'action corresponde au nom de l'API." }
    - id: c
      text: { en: "Add s3:ListAllMyBuckets to the Action element so that the role can list the bucket contents.", fr: "Ajouter s3:ListAllMyBuckets à l'élément Action pour que le rôle puisse lister le contenu du compartiment." }
    - id: d
      text: { en: "Add a bucket policy that allows s3:ListBucket on arn:aws:s3:::media-assets/* to the role.", fr: "Ajouter une politique de compartiment qui autorise s3:ListBucket sur arn:aws:s3:::media-assets/* pour le rôle." }
answer: { optionId: a }
explanation:
  correct:
    en: "The s3:ListBucket permission, which ListObjectsV2 requires, applies to the bucket resource, whose ARN has no /* suffix. The resource arn:aws:s3:::media-assets/* matches objects only, so it works for s3:GetObject but never matches a list request. Adding the bucket ARN fixes the request without adding any action."
    fr: "L'autorisation s3:ListBucket, requise par ListObjectsV2, s'applique à la ressource compartiment, dont l'ARN n'a pas de suffixe /*. La ressource arn:aws:s3:::media-assets/* ne correspond qu'aux objets : elle convient à s3:GetObject mais ne correspond jamais à une requête de liste. Ajouter l'ARN du compartiment corrige la requête sans ajouter d'action."
  options:
    b:
      en: "ListObjectsV2 is an API operation, not an IAM action; its permission is s3:ListBucket, so the policy would no longer allow listing at all."
      fr: "ListObjectsV2 est une opération d'API et non une action IAM ; son autorisation est s3:ListBucket, la politique n'autoriserait donc plus du tout la liste."
    c:
      en: "s3:ListAllMyBuckets lists the buckets of the account, not the objects in a bucket, and it adds an action, which the requirement forbids."
      fr: "s3:ListAllMyBuckets liste les compartiments du compte et non les objets d'un compartiment, et il ajoute une action, ce que l'exigence interdit."
    d:
      en: "The bucket policy repeats the same mistake, because s3:ListBucket on the object ARN pattern never matches a list request."
      fr: "La politique de compartiment reproduit la même erreur, car s3:ListBucket sur le modèle d'ARN des objets ne correspond jamais à une requête de liste."
references:
  - title: Identity-based policy examples for Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-policies-s3.html
