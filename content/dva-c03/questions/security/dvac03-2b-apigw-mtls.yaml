id: dvac03-2b-apigw-mtls
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Partner systems call an Amazon API Gateway REST API through a Regional custom domain name that uses the TLS_1_2 security policy. AnyCompany issues a client certificate to each partner from its own private certificate authority. The company must authenticate partners by their client certificate during the TLS handshake, without writing authorizer code, and partners must not be able to bypass the check.

    Which solution will meet these requirements?
  fr: |
    Des systèmes partenaires appellent une API REST Amazon API Gateway par un nom de domaine personnalisé Regional qui utilise la stratégie de sécurité TLS_1_2. AnyCompany délivre à chaque partenaire un certificat client émis par sa propre autorité de certification privée. L'entreprise doit authentifier les partenaires par leur certificat client pendant la négociation TLS, sans écrire de code d'autorisation, et les partenaires ne doivent pas pouvoir contourner la vérification.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a Lambda authorizer that reads the partner's certificate from a request header and validates it against the private CA.", fr: "Créer un mécanisme d'autorisation Lambda qui lit le certificat du partenaire dans un en-tête de requête et le valide auprès de l'autorité de certification privée." }
    - id: b
      text: { en: "Upload the CA chain as a PEM truststore to Amazon S3, turn on mutual TLS for the custom domain with it, and disable the default execute-api endpoint.", fr: "Charger la chaîne de l'autorité de certification sous forme de magasin de confiance PEM dans Amazon S3, activer le TLS mutuel du domaine personnalisé avec celui-ci, et désactiver le point de terminaison execute-api par défaut." }
    - id: c
      text: { en: "Generate a client certificate in API Gateway for the stage, and give its PEM-encoded certificate to every partner to present.", fr: "Générer un certificat client dans API Gateway pour l'étape (stage), et remettre son certificat encodé en PEM à chaque partenaire pour qu'il le présente." }
    - id: d
      text: { en: "Change the custom domain name to edge-optimized, import the CA chain into AWS Certificate Manager in us-east-1, and redeploy the API.", fr: "Passer le nom de domaine personnalisé en optimisé pour la périphérie, importer la chaîne de l'autorité de certification dans AWS Certificate Manager en us-east-1, puis redéployer l'API." }
answer: { optionId: b }
explanation:
  correct:
    en: "Mutual TLS on a Regional custom domain name makes API Gateway verify each client certificate against a truststore, a PEM file in Amazon S3 that holds the issuing CA chain. Clients without a trusted certificate fail the handshake. Disabling the default execute-api endpoint ensures that clients can reach the API only through the custom domain name, where mutual TLS applies."
    fr: "Le TLS mutuel sur un nom de domaine personnalisé Regional fait vérifier par API Gateway chaque certificat client par rapport à un magasin de confiance, un fichier PEM dans Amazon S3 qui contient la chaîne de l'autorité de certification émettrice. Les clients sans certificat approuvé échouent à la négociation. Désactiver le point de terminaison execute-api par défaut garantit que les clients n'atteignent l'API que par le nom de domaine personnalisé, où le TLS mutuel s'applique."
  options:
    a:
      en: "A Lambda authorizer is authorizer code, and a certificate copied into a header does not prove that the client holds the private key."
      fr: "Un mécanisme d'autorisation Lambda est du code d'autorisation, et un certificat copié dans un en-tête ne prouve pas que le client détient la clé privée."
    c:
      en: "An API Gateway client certificate authenticates API Gateway to the backend integration; it does not authenticate callers."
      fr: "Un certificat client API Gateway authentifie API Gateway auprès de l'intégration backend ; il n'authentifie pas les appelants."
    d:
      en: "Mutual TLS is supported only on Regional custom domain names, and the truststore is a file in Amazon S3, not an ACM import."
      fr: "Le TLS mutuel n'est pris en charge que sur les noms de domaine personnalisés Regional, et le magasin de confiance est un fichier dans Amazon S3 et non une importation ACM."
references:
  - title: Require client certificates for your API with mutual TLS authentication in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api-mutual-tls.html
