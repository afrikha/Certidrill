id: dvac03-2c-macie-custom-identifier
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon Macie to scan Amazon S3 buckets that store HR exports. The exports contain internal employee IDs in the format EMP- followed by six digits. Macie does not report these IDs today. The company wants Macie to report them, but only when the word "employee" appears near the match, to reduce false positives.

    What should the developer configure in Macie?
  fr: |
    Une entreprise utilise Amazon Macie pour analyser des compartiments Amazon S3 qui stockent des exports RH. Les exports contiennent des ID d'employés internes au format EMP- suivi de six chiffres. Macie ne signale pas ces ID aujourd'hui. L'entreprise veut que Macie les signale, mais uniquement quand le mot « employee » apparaît à proximité de la correspondance, afin de réduire les faux positifs.

    Que doit configurer le développeur dans Macie ?
body:
  options:
    - id: a
      text: { en: "An allow list of the regular expression type with the pattern EMP-\\d{6}, added to the sensitive data discovery job", fr: "Une liste d'autorisation de type expression régulière avec le modèle EMP-\\d{6}, ajoutée à la tâche de découverte des données sensibles" }
    - id: b
      text: { en: "A custom data identifier with the regular expression EMP-\\d{6} and the keyword employee, used by the discovery job", fr: "Un identifiant de données personnalisé avec l'expression régulière EMP-\\d{6} et le mot-clé employee, utilisé par la tâche de découverte" }
    - id: c
      text: { en: "A suppression rule that archives every finding whose matched text does not contain the word employee", fr: "Une règle de suppression qui archive chaque résultat dont le texte correspondant ne contient pas le mot employee" }
    - id: d
      text: { en: "The recommended set of managed data identifiers, with the Medium severity applied to every finding of the job", fr: "L'ensemble recommandé d'identifiants de données gérés, avec la gravité Medium appliquée à chaque résultat de la tâche" }
answer: { optionId: b }
explanation:
  correct:
    en: "Custom data identifiers detect organization-specific data such as employee IDs. Each one has a required regular expression and optional keywords that must appear near the match, plus optional ignore words. They supplement the managed data identifiers in discovery jobs and automated sensitive data discovery."
    fr: "Les identifiants de données personnalisés détectent des données propres à l'organisation, comme des ID d'employés. Chacun comporte une expression régulière obligatoire et des mots-clés facultatifs qui doivent apparaître près de la correspondance, ainsi que des mots à ignorer facultatifs. Ils complètent les identifiants de données gérés dans les tâches de découverte et la découverte automatisée."
  options:
    a:
      en: "An allow list does the opposite: Macie ignores text that matches it, even if a data identifier would otherwise report it."
      fr: "Une liste d'autorisation fait l'inverse : Macie ignore le texte qui y correspond, même si un identifiant de données le signalerait autrement."
    c:
      en: "Suppression rules only archive findings that already exist; the IDs are not detected at all today, so there is nothing to filter."
      fr: "Les règles de suppression ne font qu'archiver des résultats existants ; les ID ne sont pas détectés aujourd'hui, il n'y a donc rien à filtrer."
    d:
      en: "Managed data identifiers detect standard data types; they do not know the company's internal EMP- format, and severity does not change detection."
      fr: "Les identifiants de données gérés détectent des types de données standard ; ils ne connaissent pas le format interne EMP-, et la gravité ne change pas la détection."
references:
  - title: Building custom data identifiers
    url: https://docs.aws.amazon.com/macie/latest/user/custom-data-identifiers.html
  - title: Defining sensitive data exceptions with allow lists
    url: https://docs.aws.amazon.com/macie/latest/user/allow-lists.html
