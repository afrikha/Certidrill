id: dvac03-2c-lambda-secret-caching
objective: "2.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A Python AWS Lambda function calls GetSecretValue on AWS Secrets Manager at the start of every invocation to read database credentials. The function runs millions of times each day, and the Secrets Manager API calls add latency and cost. The secret is rotated every 30 days, and the function must use the new value within one hour after a rotation.

    Which solutions will meet these requirements? (Choose two.)

    Each correct answer presents a complete solution.
  fr: |
    Une fonction AWS Lambda en Python appelle GetSecretValue sur AWS Secrets Manager au début de chaque invocation pour lire des informations d'identification de base de données. La fonction s'exécute des millions de fois par jour, et les appels d'API Secrets Manager ajoutent de la latence et du coût. Le secret change tous les 30 jours par rotation, et la fonction doit utiliser la nouvelle valeur moins d'une heure après une rotation.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Copy the secret value into an environment variable of the function during each deployment, and read the variable in the handler.", fr: "Copier la valeur du secret dans une variable d'environnement de la fonction à chaque déploiement, et lire la variable dans le gestionnaire." } }
    - { id: b, text: { en: "Add the AWS Parameters and Secrets Lambda Extension layer, and request the secret from the extension's local HTTP endpoint.", fr: "Ajouter la couche AWS Parameters and Secrets Lambda Extension, et demander le secret au point de terminaison HTTP local de l'extension." } }
    - { id: c, text: { en: "Configure provisioned concurrency on the function so that execution environments are initialized before invocations arrive.", fr: "Configurer la simultanéité provisionnée sur la fonction pour que les environnements d'exécution soient initialisés avant l'arrivée des invocations." } }
    - { id: d, text: { en: "Use the aws-secretsmanager-caching library with a SecretCache object created outside the handler and its default refresh interval.", fr: "Utiliser la bibliothèque aws-secretsmanager-caching avec un objet SecretCache créé hors du gestionnaire et son intervalle d'actualisation par défaut." } }
    - { id: e, text: { en: "Increase the memory of the function so that the GetSecretValue calls complete faster and cost less per invocation.", fr: "Augmenter la mémoire de la fonction pour que les appels GetSecretValue se terminent plus vite et coûtent moins cher par invocation." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The Parameters and Secrets Lambda Extension caches secrets in the execution environment and serves them on localhost:2773; its cache TTL is 300 seconds by default. The Secrets Manager caching library for Python keeps secrets in memory and refreshes them every hour by default. Both cut most GetSecretValue calls and pick up a rotated value within the hour."
    fr: "AWS Parameters and Secrets Lambda Extension met les secrets en cache dans l'environnement d'exécution et les sert sur localhost:2773 ; la durée de vie du cache est de 300 secondes par défaut. La bibliothèque de mise en cache Secrets Manager pour Python garde les secrets en mémoire et les actualise toutes les heures par défaut. Les deux suppriment la plupart des appels GetSecretValue et récupèrent une valeur renouvelée dans l'heure."
  options:
    a:
      en: "The environment variable keeps the old value until the next deployment, so a rotated secret would not be used within one hour, and the value is exposed in the function configuration."
      fr: "La variable d'environnement garde l'ancienne valeur jusqu'au déploiement suivant : un secret renouvelé ne serait pas utilisé dans l'heure, et la valeur est exposée dans la configuration de la fonction."
    c:
      en: "Provisioned concurrency pre-initializes environments but does not cache anything by itself; the handler still calls GetSecretValue on every invocation."
      fr: "La simultanéité provisionnée pré-initialise des environnements mais ne met rien en cache d'elle-même ; le gestionnaire appelle toujours GetSecretValue à chaque invocation."
    e:
      en: "More memory does not reduce the number of API calls; every invocation still calls Secrets Manager and pays for the request."
      fr: "Plus de mémoire ne réduit pas le nombre d'appels d'API ; chaque invocation appelle toujours Secrets Manager et paie la requête."
references:
  - title: Use Secrets Manager secrets in Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-secrets-manager.html
  - title: Get a Secrets Manager secret value using Python with client-side caching
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/retrieving-secrets_cache-python.html
