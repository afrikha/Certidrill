id: dvac03-2d-prompt-attack-tags
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application joins fixed instructions with the user's text and calls InvokeModel with a guardrail. The guardrail's prompt attack filter is set to HIGH strength with the BLOCK action, but tests show that injected text such as "ignore all previous instructions" is never blocked.

    ```python
    body = {"prompt": INSTRUCTIONS + "\n\nQuestion: " + user_text, "max_tokens": 512}
    response = client.invoke_model(
        modelId=MODEL_ID,
        guardrailIdentifier=GUARDRAIL_ID,
        guardrailVersion="3",
        body=json.dumps(body),
    )
    ```

    The filter must evaluate the user's text, and a user must not be able to move text out of the evaluated section by typing a closing tag. Which solution will meet these requirements?
  fr: |
    Une application assemble des instructions fixes et le texte de l'utilisateur, puis appelle InvokeModel avec une barrière de protection (guardrail). Le filtre d'attaques par invite (prompt attack) de la barrière de protection est réglé sur la force HIGH avec l'action BLOCK, mais les tests montrent qu'un texte injecté comme « ignore all previous instructions » n'est jamais bloqué.

    ```python
    body = {"prompt": INSTRUCTIONS + "\n\nQuestion: " + user_text, "max_tokens": 512}
    response = client.invoke_model(
        modelId=MODEL_ID,
        guardrailIdentifier=GUARDRAIL_ID,
        guardrailVersion="3",
        body=json.dumps(body),
    )
    ```

    Le filtre doit évaluer le texte de l'utilisateur, et un utilisateur ne doit pas pouvoir faire sortir du texte de la section évaluée en tapant une balise fermante. Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Wrap user_text in amazon-bedrock-guardrails-guardContent tags with a random suffix generated for each request, and pass that suffix as tagSuffix in the body.", fr: "Encadrer user_text de balises amazon-bedrock-guardrails-guardContent avec un suffixe aléatoire généré à chaque requête, et passer ce suffixe comme tagSuffix dans le corps." } }
    - { id: b, text: { en: "Wrap user_text in amazon-bedrock-guardrails-guardContent tags with a fixed suffix stored in the configuration, and pass that suffix as tagSuffix in the body.", fr: "Encadrer user_text de balises amazon-bedrock-guardrails-guardContent avec un suffixe fixe stocké dans la configuration, et passer ce suffixe comme tagSuffix dans le corps." } }
    - { id: c, text: { en: "Enable the prompt attack filter on model responses in addition to prompts, with the same HIGH strength and BLOCK action.", fr: "Activer le filtre d'attaques par invite sur les réponses du modèle en plus des invites, avec la même force HIGH et la même action BLOCK." } }
    - { id: d, text: { en: "Add a denied topic named Instruction override with sample phrases such as \"ignore all previous instructions\".", fr: "Ajouter un sujet refusé nommé Instruction override avec des exemples de phrases comme « ignore all previous instructions »." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With InvokeModel, the prompt attack filter evaluates only content wrapped in input tags; without tags, prompt attacks are not filtered. AWS recommends a new random tagSuffix for every request, set in amazon-bedrock-guardrailConfig, so that a user cannot predict and close the tag to inject text outside it."
    fr: "Avec InvokeModel, le filtre d'attaques par invite n'évalue que le contenu encadré de balises d'entrée ; sans balises, les attaques par invite ne sont pas filtrées. AWS recommande un nouveau tagSuffix aléatoire à chaque requête, défini dans amazon-bedrock-guardrailConfig, afin qu'un utilisateur ne puisse pas deviner et fermer la balise pour injecter du texte à l'extérieur."
  options:
    b:
      en: "Tags make the filter evaluate the text, but a static suffix can be guessed: a user can close the tag and add instructions after it, outside the evaluated section."
      fr: "Les balises font évaluer le texte par le filtre, mais un suffixe fixe peut être deviné : un utilisateur peut fermer la balise et ajouter des instructions après elle, hors de la section évaluée."
    c:
      en: "The prompt attack filter has only input settings; it does not apply to model responses, and the input still has no tags."
      fr: "Le filtre d'attaques par invite n'a que des paramètres d'entrée ; il ne s'applique pas aux réponses du modèle, et l'entrée n'a toujours pas de balises."
    d:
      en: "A denied topic does not make the prompt attack filter evaluate anything, and topic matching is not designed to detect injection attempts."
      fr: "Un sujet refusé ne fait rien évaluer par le filtre d'attaques par invite, et la détection de sujets n'est pas conçue pour repérer les tentatives d'injection."
references:
  - title: Detect prompt attacks with Amazon Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
  - title: Apply tags to user input to filter content
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tagging.html
