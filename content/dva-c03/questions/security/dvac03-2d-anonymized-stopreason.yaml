id: dvac03-2d-anonymized-stopreason
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application calls the Converse API with a guardrail whose sensitive information filter masks email addresses in responses. The code treats every response whose stopReason is guardrail_intervened as blocked and shows an error. Users now get errors for answers that only contained an email address. The application must show masked answers and show an error only when the guardrail blocks a response.

    Which solution will meet these requirements?
  fr: |
    Une application appelle l'API Converse avec une barrière de protection (guardrail) dont le filtre d'informations sensibles masque les adresses e-mail dans les réponses. Le code traite toute réponse dont le stopReason est guardrail_intervened comme bloquée et affiche une erreur. Les utilisateurs reçoivent désormais des erreurs pour des réponses qui contenaient seulement une adresse e-mail. L'application doit afficher les réponses masquées et n'afficher une erreur que lorsque la barrière de protection bloque une réponse.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the filter action for email addresses to NONE so that the stopReason of these answers stays end_turn.", fr: "Changer l'action du filtre pour les adresses e-mail en NONE afin que le stopReason de ces réponses reste end_turn." } }
    - { id: b, text: { en: "Call ConverseStream with streamProcessingMode set to async so that masked answers are streamed before the assessment ends.", fr: "Appeler ConverseStream avec streamProcessingMode défini sur async afin que les réponses masquées soient diffusées avant la fin de l'évaluation." } }
    - { id: c, text: { en: "Enable trace in guardrailConfig and check whether the guardrail trace reports the ANONYMIZED action or the BLOCKED action.", fr: "Activer trace dans guardrailConfig et vérifier si la trace de la barrière de protection indique l'action ANONYMIZED ou l'action BLOCKED." } }
    - { id: d, text: { en: "Show an error only when stopReason is content_filtered, and treat guardrail_intervened as a successful answer.", fr: "N'afficher une erreur que lorsque stopReason vaut content_filtered, et traiter guardrail_intervened comme une réponse réussie." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A sensitive information filter with the ANONYMIZE action also sets stopReason to guardrail_intervened, even though the masked output is usable. The trace returned when trace is enabled tells masking from blocking through its action field (ANONYMIZED or BLOCKED)."
    fr: "Un filtre d'informations sensibles avec l'action ANONYMIZE définit lui aussi stopReason sur guardrail_intervened, même si la sortie masquée est utilisable. La trace renvoyée lorsque trace est activé distingue le masquage du blocage par son champ action (ANONYMIZED ou BLOCKED)."
  options:
    a:
      en: "NONE only reports detections and no longer masks the email addresses, which breaks the masking requirement."
      fr: "NONE se contente de signaler les détections et ne masque plus les adresses e-mail, ce qui enfreint l'exigence de masquage."
    b:
      en: "The streaming mode changes when chunks are sent relative to the assessment; it does not tell the application whether a response was masked or blocked."
      fr: "Le mode de diffusion change le moment d'envoi des fragments par rapport à l'évaluation ; il n'indique pas à l'application si une réponse a été masquée ou bloquée."
    d:
      en: "Guardrail blocks are also reported with guardrail_intervened, so blocked messages would be shown as successful answers."
      fr: "Les blocages de la barrière de protection sont aussi signalés par guardrail_intervened : les messages bloqués seraient affichés comme des réponses réussies."
references:
  - title: Include a guardrail with the Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
