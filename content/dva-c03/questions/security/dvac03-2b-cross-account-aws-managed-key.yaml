id: dvac03-2b-cross-account-aws-managed-key
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application in account A uploads objects to an Amazon S3 bucket in account A with SSE-KMS and the AWS managed key aws/s3. The bucket policy allows the role DataReader in account B to call s3:GetObject, and the policy of DataReader allows s3:GetObject on the bucket. Every download by DataReader fails with an AccessDenied error. The company wants account B to read the objects that are uploaded from now on, with the least privilege.

    Which solution will meet these requirements?
  fr: |
    Une application du compte A charge des objets dans un compartiment Amazon S3 du compte A avec SSE-KMS et la clé gérée par AWS aws/s3. La politique de compartiment autorise le rôle DataReader du compte B à appeler s3:GetObject, et la politique de DataReader autorise s3:GetObject sur le compartiment. Chaque téléchargement par DataReader échoue avec une erreur AccessDenied. L'entreprise veut que le compte B puisse lire les objets chargés à partir de maintenant, avec le moindre privilège.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a statement to the key policy of aws/s3 that allows DataReader to call kms:Decrypt.", fr: "Ajouter à la politique de clé d'aws/s3 une instruction qui autorise DataReader à appeler kms:Decrypt." }
    - id: b
      text: { en: "Allow kms:Decrypt on the aws/s3 key of account A in the identity-based policy of DataReader.", fr: "Autoriser kms:Decrypt sur la clé aws/s3 du compte A dans la politique basée sur l'identité de DataReader." }
    - id: c
      text: { en: "Encrypt new objects with a customer managed key whose key policy allows DataReader to call kms:Decrypt.", fr: "Chiffrer les nouveaux objets avec une clé gérée par le client dont la politique de clé autorise DataReader à appeler kms:Decrypt." }
    - id: d
      text: { en: "Encrypt new objects with DSSE-KMS and the aws/s3 key, and allow DataReader to call kms:Decrypt.", fr: "Chiffrer les nouveaux objets avec DSSE-KMS et la clé aws/s3, puis autoriser DataReader à appeler kms:Decrypt." }
answer: { optionId: c }
explanation:
  correct:
    en: "Objects encrypted with the AWS managed key aws/s3 cannot be shared across accounts, because its key policy cannot be changed to trust another account. A customer managed key lets account A grant kms:Decrypt to DataReader in the key policy, and the role in account B also needs kms:Decrypt on that key ARN in its own policy."
    fr: "Les objets chiffrés avec la clé gérée par AWS aws/s3 ne peuvent pas être partagés entre comptes, car sa politique de clé ne peut pas être modifiée pour approuver un autre compte. Une clé gérée par le client permet au compte A d'accorder kms:Decrypt à DataReader dans la politique de clé, et le rôle du compte B a aussi besoin de kms:Decrypt sur l'ARN de cette clé dans sa propre politique."
  options:
    a:
      en: "The key policy of an AWS managed key is controlled by AWS and cannot be edited."
      fr: "La politique de clé d'une clé gérée par AWS est contrôlée par AWS et ne peut pas être modifiée."
    b:
      en: "An identity-based policy in account B is not enough, because the key policy of aws/s3 does not allow principals of other accounts."
      fr: "Une politique basée sur l'identité dans le compte B ne suffit pas, car la politique de clé d'aws/s3 n'autorise pas les principaux d'autres comptes."
    d:
      en: "DSSE-KMS with the same AWS managed key has the same cross-account limitation."
      fr: "DSSE-KMS avec la même clé gérée par AWS a la même limitation entre comptes."
references:
  - title: Using server-side encryption with AWS KMS keys (SSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html
