id: dvac03-2a-userpool-oidc-b2b
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company runs a multi-tenant web application. Its Amazon API Gateway REST API validates Amazon Cognito user pool tokens with a Cognito user pool authorizer. A new enterprise customer wants its employees to sign in with the customer's own OpenID Connect (OIDC) identity provider. The API and its authorizer must not change.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels exploite une application web multilocataire. Son API REST Amazon API Gateway valide les jetons d'un groupe d'utilisateurs Amazon Cognito avec un mécanisme d'autorisation de groupe d'utilisateurs Cognito. Un nouveau client d'entreprise veut que ses employés se connectent avec son propre fournisseur d'identité OpenID Connect (OIDC). L'API et son mécanisme d'autorisation ne doivent pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an IAM OIDC identity provider for the customer's issuer, and have the app call AssumeRoleWithWebIdentity.", fr: "Créer un fournisseur d'identité OIDC IAM pour l'émetteur du client et faire appeler AssumeRoleWithWebIdentity par l'application." } }
    - { id: b, text: { en: "Replace the user pool authorizer with a Lambda authorizer that also validates the customer's OIDC tokens.", fr: "Remplacer le mécanisme d'autorisation du groupe d'utilisateurs par un mécanisme d'autorisation Lambda qui valide aussi les jetons OIDC du client." } }
    - { id: c, text: { en: "Add the customer's provider to the user pool as an OIDC identity provider, and enable it on the app client.", fr: "Ajouter le fournisseur du client au groupe d'utilisateurs comme fournisseur d'identité OIDC et l'activer sur le client d'application." } }
    - { id: d, text: { en: "Add the customer's provider to an Amazon Cognito identity pool, and send the identity ID to the API.", fr: "Ajouter le fournisseur du client à un groupe d'identités Amazon Cognito et envoyer l'ID d'identité à l'API." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A user pool can federate OIDC identity providers that are assigned to an app client. Amazon Cognito acts as the identity provider of the app, so federated users receive the same user pool tokens as other users and the existing authorizer keeps working. The app can redirect these users to their provider with the idp_identifier or identity_provider parameter."
    fr: "Un groupe d'utilisateurs peut fédérer des fournisseurs d'identité OIDC attribués à un client d'application. Amazon Cognito joue le rôle de fournisseur d'identité de l'application : les utilisateurs fédérés reçoivent les mêmes jetons du groupe d'utilisateurs que les autres, et le mécanisme d'autorisation existant continue de fonctionner. L'application peut rediriger ces utilisateurs vers leur fournisseur avec le paramètre idp_identifier ou identity_provider."
  options:
    a:
      en: "An IAM OIDC provider yields AWS credentials, not user pool tokens, so the user pool authorizer would reject the requests."
      fr: "Un fournisseur OIDC IAM fournit des informations d'identification AWS, pas des jetons du groupe d'utilisateurs : le mécanisme d'autorisation rejetterait les demandes."
    b:
      en: "Replacing the authorizer changes the API, which the requirements forbid."
      fr: "Remplacer le mécanisme d'autorisation modifie l'API, ce que les exigences interdisent."
    d:
      en: "An identity pool issues identity IDs and AWS credentials; an identity ID is not a token that the user pool authorizer accepts."
      fr: "Un groupe d'identités émet des ID d'identité et des informations d'identification AWS ; un ID d'identité n'est pas un jeton accepté par le mécanisme d'autorisation."
references:
  - title: User pool sign-in with third party identity providers
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-identity-federation.html
