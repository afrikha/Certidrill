id: dvac03-2b-cli-profile-role
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer works on a laptop. The default AWS CLI profile provides credentials for an IAM identity that is allowed to assume the role arn:aws:iam::333333333333:role/QaDeploy. The developer wants to run AWS CLI commands as that role by adding --profile qa, and wants the AWS CLI to call AssumeRole and refresh the temporary credentials automatically.

    Which solution will meet these requirements?
  fr: |
    Un développeur travaille sur un ordinateur portable. Le profil AWS CLI par défaut fournit les informations d'identification d'une identité IAM autorisée à assumer le rôle arn:aws:iam::333333333333:role/QaDeploy. Le développeur veut exécuter des commandes AWS CLI avec ce rôle en ajoutant --profile qa, et veut que l'AWS CLI appelle AssumeRole et renouvelle automatiquement les informations d'identification temporaires.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a [profile qa] section to ~/.aws/config with role_arn set to the role ARN and source_profile set to default.", fr: "Ajouter une section [profile qa] à ~/.aws/config avec role_arn défini sur l'ARN du rôle et source_profile défini sur default." }
    - id: b
      text: { en: "Add a [qa] section to ~/.aws/credentials with aws_access_key_id set to the role ARN and no secret key.", fr: "Ajouter une section [qa] à ~/.aws/credentials avec aws_access_key_id défini sur l'ARN du rôle et sans clé secrète." }
    - id: c
      text: { en: "Add a [profile qa] section to ~/.aws/config with role_arn set to the role ARN and credential_source set to Ec2InstanceMetadata.", fr: "Ajouter une section [profile qa] à ~/.aws/config avec role_arn défini sur l'ARN du rôle et credential_source défini sur Ec2InstanceMetadata." }
    - id: d
      text: { en: "Run aws sts get-session-token, and paste the returned credentials into a [qa] section of ~/.aws/credentials.", fr: "Exécuter aws sts get-session-token, puis coller les informations d'identification renvoyées dans une section [qa] de ~/.aws/credentials." }
answer: { optionId: a }
explanation:
  correct:
    en: "A profile with role_arn and source_profile tells the AWS CLI to use the credentials of the source profile to call AssumeRole for the role. The CLI caches the temporary credentials and requests new ones automatically when they expire, so commands with --profile qa run as QaDeploy."
    fr: "Un profil avec role_arn et source_profile indique à l'AWS CLI d'utiliser les informations d'identification du profil source pour appeler AssumeRole sur le rôle. La CLI met en cache les informations d'identification temporaires et en demande de nouvelles automatiquement à leur expiration : les commandes avec --profile qa s'exécutent donc avec QaDeploy."
  options:
    b:
      en: "A role ARN is not an access key; the credentials file holds access keys, and this entry gives the CLI nothing it can sign requests with."
      fr: "Un ARN de rôle n'est pas une clé d'accès ; le fichier credentials contient des clés d'accès, et cette entrée ne donne à la CLI rien avec quoi signer les requêtes."
    c:
      en: "Ec2InstanceMetadata takes the base credentials from an EC2 instance profile, which does not exist on the developer's laptop."
      fr: "Ec2InstanceMetadata prend les informations d'identification de base dans un profil d'instance EC2, qui n'existe pas sur l'ordinateur portable du développeur."
    d:
      en: "GetSessionToken returns temporary credentials for the same identity, not for the role, and pasted credentials are not refreshed automatically."
      fr: "GetSessionToken renvoie des informations d'identification temporaires pour la même identité et non pour le rôle, et des informations collées ne sont pas renouvelées automatiquement."
references:
  - title: Using an IAM role in the AWS CLI
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-role.html
