id: dvac03-2d-grounding-check
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company's assistant passes excerpts of policy documents to a model in Amazon Bedrock as reference text with each question. Users report answers that contain facts that do not appear in the excerpts. The developer must block responses that are not supported by the reference text.

    Which guardrail policy should the developer configure?
  fr: |
    L'assistant d'un assureur transmet, avec chaque question, des extraits de documents contractuels à un modèle d'Amazon Bedrock comme texte de référence. Des utilisateurs signalent des réponses qui contiennent des faits absents des extraits. Le développeur doit bloquer les réponses qui ne sont pas étayées par le texte de référence.

    Quelle politique de barrière de protection (guardrail) le développeur doit-il configurer ?
body:
  options:
    - { id: a, text: { en: "A contextual grounding check, with the excerpts as the grounding source and the question as the query", fr: "Une vérification de l'ancrage contextuel, avec les extraits comme source d'ancrage et la question comme requête" } }
    - { id: b, text: { en: "A content filter for the Misconduct category set to HIGH strength on responses, with the BLOCK action", fr: "Un filtre de contenu pour la catégorie Misconduct réglé sur la force HIGH sur les réponses, avec l'action BLOCK" } }
    - { id: c, text: { en: "A denied topic whose definition describes statements that are not found in the company's policy documents", fr: "Un sujet refusé dont la définition décrit les affirmations absentes des documents contractuels de l'entreprise" } }
    - { id: d, text: { en: "A prompt attack filter set to HIGH strength on prompts, with the BLOCK action and input tags", fr: "Un filtre d'attaques par invite réglé sur la force HIGH sur les invites, avec l'action BLOCK et des balises d'entrée" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A contextual grounding check scores whether a response is grounded in the source and relevant to the query. A response that scores below the grounding threshold (0 to 0.99) is treated as a hallucination and blocked."
    fr: "Une vérification de l'ancrage contextuel évalue si une réponse est ancrée dans la source et pertinente pour la requête. Une réponse dont le score est inférieur au seuil d'ancrage (de 0 à 0,99) est traitée comme une hallucination et bloquée."
  options:
    b:
      en: "Content filters detect harmful categories such as misconduct; they do not compare a response with the reference text."
      fr: "Les filtres de contenu détectent des catégories nuisibles comme les comportements répréhensibles ; ils ne comparent pas une réponse au texte de référence."
    c:
      en: "Denied topics block subjects of conversation; they cannot check whether each statement is supported by the excerpts passed with a request."
      fr: "Les sujets refusés bloquent des thèmes de conversation ; ils ne peuvent pas vérifier si chaque affirmation est étayée par les extraits transmis avec une requête."
    d:
      en: "The prompt attack filter detects jailbreaks and injections in prompts; it does not evaluate whether responses are grounded."
      fr: "Le filtre d'attaques par invite détecte les jailbreaks et les injections dans les invites ; il n'évalue pas l'ancrage des réponses."
references:
  - title: Use contextual grounding check to filter hallucinations in responses
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
