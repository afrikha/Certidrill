id: dvac03-2a-multi-jwt-verify
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A containerized service on Amazon ECS receives Amazon Cognito user pool access tokens in the Authorization header. The service is not behind an API Gateway authorizer and must validate each token in its code before it processes the request.

    Which checks must the service perform? (Choose three.)
  fr: |
    Un service conteneurisé sur Amazon ECS reçoit des jetons d'accès d'un groupe d'utilisateurs Amazon Cognito dans l'en-tête Authorization. Le service n'est pas placé derrière un mécanisme d'autorisation API Gateway et doit valider chaque jeton dans son code avant de traiter la demande.

    Quelles vérifications le service doit-il effectuer ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Verify the signature with the public key of the user pool's JWKS URI whose kid matches the token header.", fr: "Vérifier la signature avec la clé publique du JWKS URI du groupe d'utilisateurs dont le kid correspond à l'en-tête du jeton." } }
    - { id: b, text: { en: "Decrypt the token payload with the app client secret before reading any of its claims.", fr: "Déchiffrer la charge utile du jeton avec le secret du client d'application avant de lire ses revendications." } }
    - { id: c, text: { en: "Check that the exp claim is in the future and that the iss claim matches the user pool URL.", fr: "Vérifier que la revendication exp est dans le futur et que la revendication iss correspond à l'URL du groupe d'utilisateurs." } }
    - { id: d, text: { en: "Call AWS STS GetCallerIdentity with the token to confirm the identity of the user.", fr: "Appeler AWS STS GetCallerIdentity avec le jeton pour confirmer l'identité de l'utilisateur." } }
    - { id: e, text: { en: "Check that the aud claim of the access token matches the ID of the app client.", fr: "Vérifier que la revendication aud du jeton d'accès correspond à l'ID du client d'application." } }
    - { id: f, text: { en: "Check that the token_use claim is access and that the client_id claim matches the app client ID.", fr: "Vérifier que la revendication token_use vaut access et que la revendication client_id correspond à l'ID du client d'application." } }
answer: { optionIds: [ a, c, f ] }
explanation:
  correct:
    en: "Cognito signs tokens with RS256, so the service verifies the signature with the JWKS key that has the same kid. It then checks that exp is not passed, that iss is https://cognito-idp.region.amazonaws.com/userPoolId, that token_use is access, and that client_id matches the app client. AWS offers the aws-jwt-verify library for these checks in Node.js."
    fr: "Cognito signe les jetons avec RS256 : le service vérifie la signature avec la clé du JWKS qui a le même kid. Il vérifie ensuite qu'exp n'est pas dépassé, qu'iss vaut https://cognito-idp.region.amazonaws.com/userPoolId, que token_use vaut access et que client_id correspond au client d'application. AWS propose la bibliothèque aws-jwt-verify pour ces contrôles en Node.js."
  options:
    b:
      en: "User pool access and ID tokens are signed, not encrypted; their payload is base64url-encoded JSON."
      fr: "Les jetons d'accès et d'identification d'un groupe d'utilisateurs sont signés, pas chiffrés ; leur charge utile est du JSON encodé en base64url."
    d:
      en: "AWS STS authenticates SigV4-signed requests made with AWS credentials; it does not accept user pool tokens."
      fr: "AWS STS authentifie des demandes signées SigV4 avec des informations d'identification AWS ; il n'accepte pas les jetons d'un groupe d'utilisateurs."
    e:
      en: "Only ID tokens have an aud claim; access tokens carry the app client ID in client_id."
      fr: "Seuls les jetons d'identification ont une revendication aud ; les jetons d'accès portent l'ID du client d'application dans client_id."
references:
  - title: Verifying JSON web tokens
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-using-tokens-verifying-a-jwt.html
