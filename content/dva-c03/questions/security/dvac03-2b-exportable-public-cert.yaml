id: dvac03-2b-exportable-public-cert
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a public website on Amazon EC2 instances where NGINX terminates TLS directly, with no load balancer and no Amazon CloudFront distribution. The company wants AWS Certificate Manager (ACM) to issue and renew a publicly trusted certificate for the site. The team will deploy each renewed certificate to the instances itself.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un site web public sur des instances Amazon EC2 où NGINX termine directement TLS, sans équilibreur de charge ni distribution Amazon CloudFront. L'entreprise veut qu'AWS Certificate Manager (ACM) émette et renouvelle un certificat approuvé publiquement pour le site. L'équipe déploiera elle-même chaque certificat renouvelé sur les instances.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Request a standard ACM public certificate, and call ExportCertificate to retrieve the certificate and its private key.", fr: "Demander un certificat public ACM standard, puis appeler ExportCertificate pour récupérer le certificat et sa clé privée." }
    - id: b
      text: { en: "Issue a private certificate for the site from AWS Private CA, and install it with its private key on the instances.", fr: "Émettre un certificat privé pour le site à partir d'AWS Private CA, puis l'installer avec sa clé privée sur les instances." }
    - id: c
      text: { en: "Request an ACM public certificate with export enabled, export it, and redeploy it when ACM sends a renewal event to EventBridge.", fr: "Demander un certificat public ACM avec l'exportation activée, l'exporter, puis le redéployer lorsqu'ACM envoie un événement de renouvellement à EventBridge." }
    - id: d
      text: { en: "Import a certificate from a third-party CA into ACM, and rely on ACM managed renewal for future renewals.", fr: "Importer dans ACM un certificat d'une autorité de certification tierce, et s'appuyer sur le renouvellement géré d'ACM pour les renouvellements futurs." }
answer: { optionId: c }
explanation:
  correct:
    en: "ACM exportable public certificates can be used outside integrated services, such as on EC2 instances. Export must be enabled when the certificate is requested (Export=ENABLED). ACM renews the certificate before expiration and sends an EventBridge notification, and the company deploys the renewed certificate itself."
    fr: "Les certificats publics exportables d'ACM peuvent être utilisés en dehors des services intégrés, par exemple sur des instances EC2. L'exportation doit être activée lors de la demande du certificat (Export=ENABLED). ACM renouvelle le certificat avant son expiration et envoie une notification EventBridge, et l'entreprise déploie elle-même le certificat renouvelé."
  options:
    a:
      en: "A public certificate requested without the export option cannot be exported; a new certificate with export enabled is required."
      fr: "Un certificat public demandé sans l'option d'exportation ne peut pas être exporté ; un nouveau certificat avec l'exportation activée est nécessaire."
    b:
      en: "Browsers do not trust certificates from a private CA, so a public website would show certificate errors."
      fr: "Les navigateurs n'approuvent pas les certificats d'une autorité de certification privée : un site web public afficherait des erreurs de certificat."
    d:
      en: "ACM never renews imported certificates, which fails the renewal requirement."
      fr: "ACM ne renouvelle jamais les certificats importés, ce qui ne respecte pas l'exigence de renouvellement."
references:
  - title: AWS Certificate Manager exportable public certificates
    url: https://docs.aws.amazon.com/acm/latest/userguide/acm-exportable-certificates.html
  - title: Request a public certificate in AWS Certificate Manager
    url: https://docs.aws.amazon.com/acm/latest/userguide/acm-public-certificates.html
