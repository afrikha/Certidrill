id: dvac03-2d-vpce-endpoint-url
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer created an interface VPC endpoint for the com.amazonaws.us-east-1.bedrock-runtime service. Private DNS must stay disabled on the endpoint because the network team manages DNS centrally. The endpoint's security group allows inbound HTTPS from the application subnets, which have no internet access. The application creates its client as follows, and every model call times out.

    ```python
    import boto3

    client = boto3.client("bedrock-runtime", region_name="us-east-1")
    ```

    The application must reach Amazon Bedrock through the endpoint. Which solution will meet these requirements?
  fr: |
    Un développeur a créé un point de terminaison de VPC d'interface pour le service com.amazonaws.us-east-1.bedrock-runtime. Le DNS privé doit rester désactivé sur le point de terminaison, car l'équipe réseau gère le DNS de manière centralisée. Le groupe de sécurité du point de terminaison autorise le trafic HTTPS entrant depuis les sous-réseaux de l'application, qui n'ont pas d'accès à Internet. L'application crée son client comme suit, et chaque appel au modèle expire.

    ```python
    import boto3

    client = boto3.client("bedrock-runtime", region_name="us-east-1")
    ```

    L'application doit atteindre Amazon Bedrock par le point de terminaison. Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create the client for the bedrock service instead of bedrock-runtime so that the SDK uses the control plane host name.", fr: "Créer le client pour le service bedrock au lieu de bedrock-runtime afin que le SDK utilise le nom d'hôte du plan de contrôle." } }
    - { id: b, text: { en: "Pass endpoint_url with the endpoint-specific DNS name, such as https://vpce-id.bedrock-runtime.us-east-1.vpce.amazonaws.com.", fr: "Passer endpoint_url avec le nom DNS propre au point de terminaison, par exemple https://vpce-id.bedrock-runtime.us-east-1.vpce.amazonaws.com." } }
    - { id: c, text: { en: "Add an aws:SourceVpce condition with the endpoint ID to the IAM policy of the application's execution role.", fr: "Ajouter une condition aws:SourceVpce avec l'ID du point de terminaison à la politique IAM du rôle d'exécution de l'application." } }
    - { id: d, text: { en: "Attach a custom endpoint policy that allows bedrock:InvokeModel for all principals on all resources.", fr: "Attacher une politique de point de terminaison personnalisée qui autorise bedrock:InvokeModel pour tous les principaux sur toutes les ressources." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Without private DNS, the default bedrock-runtime host name still resolves to the public endpoint, which the subnets cannot reach. The SDK must be given the endpoint-specific DNS name in endpoint_url so that calls go to the endpoint's network interfaces."
    fr: "Sans DNS privé, le nom d'hôte par défaut de bedrock-runtime se résout toujours vers le point de terminaison public, que les sous-réseaux ne peuvent pas atteindre. Il faut indiquer au SDK le nom DNS propre au point de terminaison dans endpoint_url pour que les appels aillent vers les interfaces réseau du point de terminaison."
  options:
    a:
      en: "The control plane host name is also public without private DNS, and the control plane does not serve model inference calls."
      fr: "Le nom d'hôte du plan de contrôle est lui aussi public sans DNS privé, et le plan de contrôle ne traite pas les appels d'inférence."
    c:
      en: "A condition key restricts which requests are allowed; it does not change where the SDK sends them, so the calls still time out."
      fr: "Une clé de condition limite les requêtes autorisées ; elle ne change pas la destination des appels du SDK, qui expirent toujours."
    d:
      en: "The default endpoint policy already allows full access. The problem is name resolution, not authorization."
      fr: "La politique de point de terminaison par défaut autorise déjà l'accès complet. Le problème est la résolution de noms, pas l'autorisation."
references:
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
