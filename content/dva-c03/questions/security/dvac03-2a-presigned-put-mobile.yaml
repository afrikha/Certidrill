id: dvac03-2a-presigned-put-mobile
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's mobile app lets signed-in users upload videos of up to 2 GB to a private Amazon S3 bucket. The app must not hold AWS credentials, and the video data must not pass through the company's backend. A Lambda function behind an authenticated API runs for each upload request.

    Which solution will meet these requirements?
  fr: |
    L'application mobile d'une entreprise permet aux utilisateurs connectés de charger des vidéos de 2 Go au plus dans un compartiment Amazon S3 privé. L'application ne doit détenir aucune information d'identification AWS, et les données vidéo ne doivent pas transiter par le backend de l'entreprise. Une fonction Lambda placée derrière une API authentifiée s'exécute pour chaque demande de chargement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a bucket policy that allows s3:PutObject for all principals when the request comes from the app's user agent.", fr: "Ajouter une politique de compartiment qui autorise s3:PutObject pour tous les principaux quand la demande provient de l'agent utilisateur de l'application." } }
    - { id: b, text: { en: "Have the Lambda function return a presigned URL for a PUT request on the object key that is valid for a short time.", fr: "Faire renvoyer par la fonction Lambda une URL présignée pour une demande PUT sur la clé de l'objet, valide pendant une courte durée." } }
    - { id: c, text: { en: "Have the Lambda function return the temporary credentials of its execution role so that the app can call PutObject.", fr: "Faire renvoyer par la fonction Lambda les informations d'identification temporaires de son rôle d'exécution pour que l'application appelle PutObject." } }
    - { id: d, text: { en: "Have the app send the video to the API, and have the Lambda function write the video to the bucket.", fr: "Faire envoyer la vidéo à l'API par l'application, et faire écrire la vidéo dans le compartiment par la fonction Lambda." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A presigned URL lets someone without AWS credentials upload one object directly to S3. The URL is signed with the function's credentials, is limited by their permissions and by the expiration time, and applies to the single key named in the URL."
    fr: "Une URL présignée permet à une personne sans informations d'identification AWS de charger un objet directement dans S3. L'URL est signée avec les informations d'identification de la fonction, est limitée par leurs autorisations et par la durée d'expiration, et ne s'applique qu'à la clé indiquée dans l'URL."
  options:
    a:
      en: "The user agent is set by the client and is easy to forge, so anyone could write to the bucket."
      fr: "L'agent utilisateur est défini par le client et facile à falsifier : n'importe qui pourrait écrire dans le compartiment."
    c:
      en: "The app would hold AWS credentials, with every permission of the execution role, which the requirements forbid."
      fr: "L'application détiendrait des informations d'identification AWS avec toutes les autorisations du rôle d'exécution, ce que les exigences interdisent."
    d:
      en: "The video would pass through the company's backend, which the requirements forbid."
      fr: "La vidéo transiterait par le backend de l'entreprise, ce que les exigences interdisent."
references:
  - title: Uploading objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/PresignedUrlUploadObject.html
