id: dvac03-2a-cli-role-mfa-profile
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer has an AWS CLI profile named dev that contains the access keys of an IAM user in account 111122223333. The developer must run commands in account 444455556666 by assuming the role DeployRole, whose trust policy requires MFA. The AWS CLI must assume the role and prompt for the MFA code automatically when the developer uses a profile named deploy.

    Which settings should the deploy profile contain in the ~/.aws/config file?
  fr: |
    Un développeur dispose d'un profil AWS CLI nommé dev qui contient les clés d'accès d'un utilisateur IAM du compte 111122223333. Le développeur doit exécuter des commandes dans le compte 444455556666 en assumant le rôle DeployRole, dont la politique d'approbation exige la MFA. L'AWS CLI doit assumer le rôle et demander le code MFA automatiquement quand le développeur utilise un profil nommé deploy.

    Quels paramètres le profil deploy doit-il contenir dans le fichier ~/.aws/config ?
body:
  options:
    - { id: a, text: { en: "`role_arn` set to the DeployRole ARN, `source_profile = dev`, and `mfa_serial` set to the ARN of the developer's MFA device.", fr: "`role_arn` défini sur l'ARN de DeployRole, `source_profile = dev` et `mfa_serial` défini sur l'ARN du dispositif MFA du développeur." } }
    - { id: b, text: { en: "`role_arn` set to the DeployRole ARN, `credential_source = Environment`, and `mfa_serial` set to the DeployRole ARN.", fr: "`role_arn` défini sur l'ARN de DeployRole, `credential_source = Environment` et `mfa_serial` défini sur l'ARN de DeployRole." } }
    - { id: c, text: { en: "`aws_session_token` set to the current MFA code, `source_profile = dev`, and `region` set to the Region of DeployRole.", fr: "`aws_session_token` défini sur le code MFA actuel, `source_profile = dev` et `region` défini sur la Région de DeployRole." } }
    - { id: d, text: { en: "`sso_role_name = DeployRole`, `sso_account_id = 444455556666`, and `mfa_serial` set to the ARN of the MFA device.", fr: "`sso_role_name = DeployRole`, `sso_account_id = 444455556666` et `mfa_serial` défini sur l'ARN du dispositif MFA." } }
answer: { optionId: a }
explanation:
  correct:
    en: "role_arn names the role, and source_profile names the profile whose credentials call sts:AssumeRole. mfa_serial identifies the IAM user's MFA device, so the CLI prompts for a one-time code and passes it to AssumeRole. The CLI caches the role credentials in ~/.aws/cli/cache and refreshes them when they expire."
    fr: "role_arn désigne le rôle, et source_profile le profil dont les informations d'identification appellent sts:AssumeRole. mfa_serial identifie le dispositif MFA de l'utilisateur IAM : la CLI demande un code à usage unique et le transmet à AssumeRole. La CLI met en cache les informations d'identification du rôle dans ~/.aws/cli/cache et les actualise à leur expiration."
  options:
    b:
      en: "credential_source = Environment takes the source credentials from environment variables instead of the dev profile, and mfa_serial must identify an MFA device, not a role."
      fr: "credential_source = Environment prend les informations d'identification source dans les variables d'environnement et non dans le profil dev, et mfa_serial doit identifier un dispositif MFA, pas un rôle."
    c:
      en: "A session token is part of temporary credentials, not an MFA code, and without role_arn the CLI never assumes DeployRole."
      fr: "Un jeton de session fait partie d'informations d'identification temporaires, ce n'est pas un code MFA, et sans role_arn la CLI n'assume jamais DeployRole."
    d:
      en: "sso_* settings use IAM Identity Center permission sets; they cannot assume an IAM role from IAM user credentials."
      fr: "Les paramètres sso_* utilisent des ensembles d'autorisations IAM Identity Center ; ils ne permettent pas d'assumer un rôle IAM à partir des informations d'identification d'un utilisateur IAM."
references:
  - title: Using an IAM role in the AWS CLI
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-role.html
