id: dvac03-2b-caa-record
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer requests a public certificate from AWS Certificate Manager (ACM) for shop.example.com with DNS validation. The validation CNAME record is created and the domain is validated, but the certificate request then fails. The DNS zone of example.com contains the following record:

    `example.com. CAA 0 issue "ca.example.net"`

    The company wants ACM to issue the certificate and keep renewing it automatically.

    Which solution will meet these requirements?
  fr: |
    Un développeur demande à AWS Certificate Manager (ACM) un certificat public pour shop.example.com avec une validation DNS. L'enregistrement CNAME de validation est créé et le domaine est validé, mais la demande de certificat échoue ensuite. La zone DNS d'example.com contient l'enregistrement suivant :

    `example.com. CAA 0 issue "ca.example.net"`

    L'entreprise veut qu'ACM émette le certificat et continue de le renouveler automatiquement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a CAA record for example.com with the issue tag and the value \"amazon.com\", and request the certificate again.", fr: "Ajouter un enregistrement CAA pour example.com avec la balise issue et la valeur \"amazon.com\", puis demander de nouveau le certificat." }
    - id: b
      text: { en: "Delete the validation CNAME record, and request the certificate again with email validation.", fr: "Supprimer l'enregistrement CNAME de validation, puis demander de nouveau le certificat avec une validation par e-mail." }
    - id: c
      text: { en: "Add a CAA record for example.com with the iodef tag and the address of the security team, and request the certificate again.", fr: "Ajouter un enregistrement CAA pour example.com avec la balise iodef et l'adresse de l'équipe de sécurité, puis demander de nouveau le certificat." }
    - id: d
      text: { en: "Request the certificate again in the us-east-1 Region, where ACM does not check CAA records.", fr: "Demander de nouveau le certificat dans la Région us-east-1, où ACM ne vérifie pas les enregistrements CAA." }
answer: { optionId: a }
explanation:
  correct:
    en: "After validating the domain, ACM checks CAA records. When CAA records exist for the domain, one of them must name an Amazon CA (amazon.com, amazontrust.com, awstrust.com, or amazonaws.com) with the issue tag, otherwise ACM cannot issue the certificate. Adding that record keeps the existing CA allowed and lets ACM issue and renew the certificate."
    fr: "Après avoir validé le domaine, ACM vérifie les enregistrements CAA. Lorsque des enregistrements CAA existent pour le domaine, l'un d'eux doit nommer une autorité de certification Amazon (amazon.com, amazontrust.com, awstrust.com ou amazonaws.com) avec la balise issue ; sinon, ACM ne peut pas émettre le certificat. Ajouter cet enregistrement conserve l'autorisation de l'autorité existante et permet à ACM d'émettre et de renouveler le certificat."
  options:
    b:
      en: "The CAA check applies whatever the validation method, and email validation removes automatic renewal."
      fr: "La vérification CAA s'applique quelle que soit la méthode de validation, et la validation par e-mail supprime le renouvellement automatique."
    c:
      en: "ACM ignores the iodef tag, and it does not authorize any CA to issue certificates."
      fr: "ACM ignore la balise iodef, et elle n'autorise aucune autorité de certification à émettre des certificats."
    d:
      en: "ACM checks CAA records in every Region; changing the Region does not change the DNS record that blocks issuance."
      fr: "ACM vérifie les enregistrements CAA dans toutes les Régions ; changer de Région ne change pas l'enregistrement DNS qui bloque l'émission."
references:
  - title: Set up to use AWS Certificate Manager
    url: https://docs.aws.amazon.com/acm/latest/userguide/setup-caa.html
