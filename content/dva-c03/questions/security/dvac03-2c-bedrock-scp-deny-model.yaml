id: dvac03-2c-bedrock-scp-deny-model
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations. After a legal review, the company decides that no account may use one specific third-party foundation model in Amazon Bedrock, including accounts that have never invoked it. Administrators of the member accounts must not be able to remove the restriction.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations. Après un examen juridique, l'entreprise décide qu'aucun compte ne peut utiliser un modèle de fondation tiers précis dans Amazon Bedrock, y compris les comptes qui ne l'ont jamais invoqué. Les administrateurs des comptes membres ne doivent pas pouvoir lever cette restriction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach an SCP that denies aws-marketplace:Subscribe with an aws-marketplace:ProductId condition for the model's product ID.", fr: "Attacher une SCP qui refuse aws-marketplace:Subscribe avec une condition aws-marketplace:ProductId pour l'ID de produit du modèle." }
    - id: b
      text: { en: "Delete the model agreement in every account where the model was used, and tell developers not to invoke it again.", fr: "Supprimer l'accord du modèle dans chaque compte où il a été utilisé, et demander aux développeurs de ne plus l'invoquer." }
    - id: c
      text: { en: "Attach an SCP to the organization root that denies all bedrock actions on the foundation model ARN of that model in all Regions.", fr: "Attacher à la racine de l'organisation une SCP qui refuse toutes les actions bedrock sur l'ARN du modèle de fondation de ce modèle dans toutes les Régions." }
    - id: d
      text: { en: "Add an IAM policy that denies bedrock:InvokeModel on the model to every IAM role in each member account.", fr: "Ajouter à chaque rôle IAM de chaque compte membre une politique IAM qui refuse bedrock:InvokeModel sur le modèle." }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS recommends Deny statements on Amazon Bedrock actions, at the organization level with an SCP or at the account level with IAM, to block a model before or after it is used. An SCP applies to every principal of the member accounts, including their administrators, and cannot be changed from inside a member account."
    fr: "AWS recommande des instructions Deny sur les actions Amazon Bedrock, au niveau de l'organisation avec une SCP ou au niveau du compte avec IAM, pour bloquer un modèle avant ou après son utilisation. Une SCP s'applique à tous les principaux des comptes membres, y compris leurs administrateurs, et ne peut pas être modifiée depuis un compte membre."
  options:
    a:
      en: "Denying aws-marketplace:Subscribe alone does not block the first invocation of a model, and accounts already subscribed could keep using it."
      fr: "Refuser seulement aws-marketplace:Subscribe ne bloque pas la première invocation d'un modèle, et les comptes déjà abonnés pourraient continuer à l'utiliser."
    b:
      en: "Deleting an agreement is not enough: invoking the model again creates the access again."
      fr: "Supprimer un accord ne suffit pas : invoquer de nouveau le modèle recrée l'accès."
    d:
      en: "Administrators of a member account can detach or edit IAM policies in their own account, and new roles would not be covered."
      fr: "Les administrateurs d'un compte membre peuvent détacher ou modifier les politiques IAM de leur compte, et les nouveaux rôles ne seraient pas couverts."
references:
  - title: Request access to models
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-access.html
