id: dvac03-2d-pii-anonymize
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses Amazon Bedrock to summarize support call transcripts for analysts. Customer names and email addresses must be masked in the summaries, but the rest of each summary must still be returned to the analysts.

    Which guardrail configuration will meet these requirements?
  fr: |
    Une entreprise utilise Amazon Bedrock pour résumer des transcriptions d'appels au support à destination d'analystes. Les noms et adresses e-mail des clients doivent être masqués dans les résumés, mais le reste de chaque résumé doit toujours être renvoyé aux analystes.

    Quelle configuration de barrière de protection (guardrail) répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A sensitive information filter with the BLOCK action for the NAME and EMAIL entity types on responses", fr: "Un filtre d'informations sensibles avec l'action BLOCK pour les types d'entités NAME et EMAIL sur les réponses" } }
    - { id: b, text: { en: "A sensitive information filter with the ANONYMIZE action for the NAME and EMAIL entity types on responses", fr: "Un filtre d'informations sensibles avec l'action ANONYMIZE pour les types d'entités NAME et EMAIL sur les réponses" } }
    - { id: c, text: { en: "A denied topic named Customer identity whose definition describes names and email addresses", fr: "Un sujet refusé nommé Customer identity dont la définition décrit les noms et les adresses e-mail" } }
    - { id: d, text: { en: "A word filter that lists the names and email addresses of all current customers", fr: "Un filtre de mots qui répertorie les noms et adresses e-mail de tous les clients actuels" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The ANONYMIZE action of a sensitive information filter replaces each detected entity with its type, such as {NAME} or {EMAIL}, and returns the rest of the response. Separate output settings let the developer apply it to model responses."
    fr: "L'action ANONYMIZE d'un filtre d'informations sensibles remplace chaque entité détectée par son type, par exemple {NAME} ou {EMAIL}, et renvoie le reste de la réponse. Des paramètres de sortie distincts permettent de l'appliquer aux réponses du modèle."
  options:
    a:
      en: "BLOCK replaces the whole response with the blocked message, so the analysts would not get the summary."
      fr: "BLOCK remplace toute la réponse par le message de blocage : les analystes ne recevraient pas le résumé."
    c:
      en: "Denied topics block subjects of conversation; AWS advises against using them to catch specific words or entities, and they block instead of masking."
      fr: "Les sujets refusés bloquent des thèmes de conversation ; AWS déconseille de les utiliser pour détecter des mots ou entités précis, et ils bloquent au lieu de masquer."
    d:
      en: "Word filters match exact words and block content; a list of every customer would be impossible to maintain and would not mask the values."
      fr: "Les filtres de mots détectent des mots exacts et bloquent le contenu ; une liste de tous les clients serait impossible à tenir à jour et ne masquerait pas les valeurs."
references:
  - title: Remove PII from conversations by using sensitive information filters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
