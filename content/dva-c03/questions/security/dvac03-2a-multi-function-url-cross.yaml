id: dvac03-2a-multi-function-url-cross
objective: "2.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A Lambda function in account 111122223333 has a function URL with the AWS_IAM auth type that was created in 2026. A role in account 444455556666 must call the function URL with SigV4-signed requests. The calls currently fail with 403 Forbidden. The function URL must keep requiring IAM authentication.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une fonction Lambda du compte 111122223333 possède une URL de fonction avec le type d'authentification AWS_IAM, créée en 2026. Un rôle du compte 444455556666 doit appeler l'URL de fonction avec des demandes signées SigV4. Les appels échouent actuellement avec 403 Forbidden. L'URL de fonction doit continuer d'exiger l'authentification IAM.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the auth type of the function URL to NONE, and check the caller's account ID in the function code.", fr: "Passer le type d'authentification de l'URL de fonction à NONE et vérifier l'ID de compte de l'appelant dans le code de la fonction." } }
    - { id: b, text: { en: "In account 444455556666, allow lambda:InvokeFunctionUrl and lambda:InvokeFunction on the function in the role's identity-based policy.", fr: "Dans le compte 444455556666, autoriser lambda:InvokeFunctionUrl et lambda:InvokeFunction sur la fonction dans la politique basée sur l'identité du rôle." } }
    - { id: c, text: { en: "In account 111122223333, add a resource-based policy that grants lambda:InvokeFunctionUrl and lambda:InvokeFunction to the role.", fr: "Dans le compte 111122223333, ajouter une politique basée sur les ressources qui accorde lambda:InvokeFunctionUrl et lambda:InvokeFunction au rôle." } }
    - { id: d, text: { en: "In account 111122223333, add a resource-based policy that grants only lambda:InvokeFunctionUrl to the role.", fr: "Dans le compte 111122223333, ajouter une politique basée sur les ressources qui accorde uniquement lambda:InvokeFunctionUrl au rôle." } }
    - { id: e, text: { en: "Create an IAM user in account 111122223333, and give its access keys to the caller to sign the requests.", fr: "Créer un utilisateur IAM dans le compte 111122223333 et donner ses clés d'accès à l'appelant pour signer les demandes." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "For a cross-account call to an AWS_IAM function URL, the caller needs both an identity-based policy in its own account and a resource-based policy on the function. Since October 2025, new function URLs require both lambda:InvokeFunctionUrl and lambda:InvokeFunction in these policies."
    fr: "Pour un appel entre comptes vers une URL de fonction AWS_IAM, l'appelant a besoin à la fois d'une politique basée sur l'identité dans son propre compte et d'une politique basée sur les ressources sur la fonction. Depuis octobre 2025, les nouvelles URL de fonction exigent à la fois lambda:InvokeFunctionUrl et lambda:InvokeFunction dans ces politiques."
  options:
    a:
      en: "NONE removes IAM authentication, which the requirements forbid; any caller allowed by the resource policy could invoke the URL unsigned."
      fr: "NONE supprime l'authentification IAM, ce que les exigences interdisent ; tout appelant autorisé par la politique de ressource pourrait appeler l'URL sans signature."
    d:
      en: "New function URLs also require lambda:InvokeFunction, so granting only lambda:InvokeFunctionUrl still returns 403."
      fr: "Les nouvelles URL de fonction exigent aussi lambda:InvokeFunction : accorder seulement lambda:InvokeFunctionUrl renvoie toujours 403."
    e:
      en: "Sharing long-term access keys across accounts replaces the role with long-term credentials and is not a secure practice."
      fr: "Partager des clés d'accès à long terme entre comptes remplace le rôle par des informations d'identification à long terme et n'est pas une pratique sécurisée."
references:
  - title: Control access to Lambda function URLs
    url: https://docs.aws.amazon.com/lambda/latest/dg/urls-auth.html
