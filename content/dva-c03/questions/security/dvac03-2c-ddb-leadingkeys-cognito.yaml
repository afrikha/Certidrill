id: dvac03-2c-ddb-leadingkeys-cognito
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A mobile application signs users in and obtains temporary AWS credentials from an Amazon Cognito identity pool. Each user's profile, which contains personal data, is stored in an Amazon DynamoDB table whose partition key is the user's Cognito identity ID. The application calls DynamoDB directly. Each user must be able to read and update only the items that belong to that user.

    Which condition should the developer add to the IAM policy of the authenticated role?
  fr: |
    Une application mobile connecte les utilisateurs et obtient des informations d'identification AWS temporaires d'un groupe d'identités Amazon Cognito. Le profil de chaque utilisateur, qui contient des données personnelles, est stocké dans une table Amazon DynamoDB dont la clé de partition est l'ID d'identité Cognito de l'utilisateur. L'application appelle DynamoDB directement. Chaque utilisateur ne doit pouvoir lire et mettre à jour que les éléments qui lui appartiennent.

    Quelle condition le développeur doit-il ajouter à la politique IAM du rôle authentifié ?
body:
  options:
    - id: a
      text: '"ForAllValues:StringEquals": { "dynamodb:LeadingKeys": ["${cognito-identity.amazonaws.com:sub}"] }'
    - id: b
      text: '"ForAllValues:StringEquals": { "dynamodb:LeadingKeys": ["${aws:username}"] }'
    - id: c
      text: '"ForAllValues:StringEquals": { "dynamodb:Attributes": ["${cognito-identity.amazonaws.com:sub}"] }'
    - id: d
      text: '"StringEquals": { "aws:PrincipalTag/identity": "${cognito-identity.amazonaws.com:aud}" }'
answer: { optionId: a }
explanation:
  correct:
    en: "dynamodb:LeadingKeys holds the partition key values of the items in the request. The ${cognito-identity.amazonaws.com:sub} policy variable resolves to the caller's Cognito identity ID, so each user can access only the items whose partition key equals that ID."
    fr: "dynamodb:LeadingKeys contient les valeurs de clé de partition des éléments de la requête. La variable de politique ${cognito-identity.amazonaws.com:sub} prend la valeur de l'ID d'identité Cognito de l'appelant : chaque utilisateur n'accède qu'aux éléments dont la clé de partition est égale à cet ID."
  options:
    b:
      en: "aws:username is defined only for IAM users; federated users of an identity pool assume a role and have no IAM user name."
      fr: "aws:username n'est défini que pour les utilisateurs IAM ; les utilisateurs fédérés d'un groupe d'identités endossent un rôle et n'ont pas de nom d'utilisateur IAM."
    c:
      en: "dynamodb:Attributes contains attribute names, not partition key values, so comparing it with the identity ID does not restrict which items are read."
      fr: "dynamodb:Attributes contient des noms d'attributs, pas des valeurs de clé de partition : la comparer à l'ID d'identité ne limite pas les éléments lus."
    d:
      en: "The aud value is the identity pool ID, which is the same for every user, so this condition cannot separate one user's items from another's."
      fr: "La valeur aud est l'ID du groupe d'identités, identique pour tous les utilisateurs : cette condition ne peut pas séparer les éléments d'un utilisateur de ceux d'un autre."
references:
  - title: "Amazon DynamoDB: Allows Row-Level Access to DynamoDB Based on an Amazon Cognito ID"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_examples_dynamodb_rows.html
  - title: Using IAM policy conditions for fine-grained access control
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/specifying-conditions.html
