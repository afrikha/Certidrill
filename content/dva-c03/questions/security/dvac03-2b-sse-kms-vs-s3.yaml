id: dvac03-2b-sse-kms-vs-s3
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon S3 bucket stores financial reports encrypted with SSE-S3. A new requirement states that a principal that has s3:GetObject permission must also have separate permission on the encryption key to read the plaintext, and that each use of the key must be auditable in AWS CloudTrail. The encryption must remain server-side.

    Which solution will meet these requirements?
  fr: |
    Un compartiment Amazon S3 stocke des rapports financiers chiffrés avec SSE-S3. Une nouvelle exigence impose qu'un principal disposant de l'autorisation s3:GetObject ait aussi une autorisation distincte sur la clé de chiffrement pour lire les données en clair, et que chaque utilisation de la clé puisse être auditée dans AWS CloudTrail. Le chiffrement doit rester côté serveur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Encrypt the objects with SSE-KMS and a customer managed key that has a restrictive key policy.", fr: "Chiffrer les objets avec SSE-KMS et une clé gérée par le client dotée d'une politique de clé restrictive." }
    - id: b
      text: { en: "Keep SSE-S3, and turn on S3 Bucket Keys in the default encryption configuration of the bucket.", fr: "Conserver SSE-S3, et activer les S3 Bucket Keys dans la configuration de chiffrement par défaut du compartiment." }
    - id: c
      text: { en: "Encrypt the objects with SSE-C, and store the customer-provided key in AWS Secrets Manager.", fr: "Chiffrer les objets avec SSE-C, et stocker la clé fournie par le client dans AWS Secrets Manager." }
    - id: d
      text: { en: "Keep SSE-S3, and turn on S3 Versioning and MFA delete for the bucket.", fr: "Conserver SSE-S3, et activer la gestion des versions S3 et la suppression MFA pour le compartiment." }
answer: { optionId: a }
explanation:
  correct:
    en: "With SSE-KMS, reading an object requires kms:Decrypt on the KMS key in addition to s3:GetObject, so the key policy adds a separate layer of access control. Every use of the key is an AWS KMS request that CloudTrail records."
    fr: "Avec SSE-KMS, la lecture d'un objet exige kms:Decrypt sur la clé KMS en plus de s3:GetObject : la politique de clé ajoute donc un niveau distinct de contrôle d'accès. Chaque utilisation de la clé est une requête AWS KMS enregistrée par CloudTrail."
  options:
    b:
      en: "S3 Bucket Keys apply only to SSE-KMS; SSE-S3 has no key permissions and no KMS events to audit."
      fr: "Les S3 Bucket Keys ne s'appliquent qu'à SSE-KMS ; SSE-S3 n'a ni autorisations de clé ni événements KMS à auditer."
    c:
      en: "With SSE-C, the key is sent in each request and its use is not logged as key events, and storing it in Secrets Manager only adds a secret to manage."
      fr: "Avec SSE-C, la clé est envoyée dans chaque requête et son utilisation n'est pas journalisée sous forme d'événements de clé ; la stocker dans Secrets Manager ne fait qu'ajouter un secret à gérer."
    d:
      en: "Versioning and MFA delete protect against deletion; they add no permission on the encryption key."
      fr: "La gestion des versions et la suppression MFA protègent contre la suppression ; elles n'ajoutent aucune autorisation sur la clé de chiffrement."
references:
  - title: Using server-side encryption with AWS KMS keys (SSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html
