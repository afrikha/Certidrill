id: dvac03-2a-roles-anywhere-onprem
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs batch jobs on on-premises Linux servers. The jobs use the AWS SDK for Python (Boto3) to write objects to Amazon S3. Each server already has an X.509 certificate issued by the company's AWS Private CA. The security team wants to remove the IAM user access keys stored on the servers without changing the job code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des tâches par lots sur des serveurs Linux sur site. Les tâches utilisent l'AWS SDK pour Python (Boto3) pour écrire des objets dans Amazon S3. Chaque serveur possède déjà un certificat X.509 émis par l'AWS Private CA de l'entreprise. L'équipe de sécurité veut supprimer les clés d'accès d'utilisateur IAM stockées sur les serveurs sans modifier le code des tâches.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the access keys in AWS Secrets Manager, and have each job retrieve them when it starts.", fr: "Stocker les clés d'accès dans AWS Secrets Manager et faire récupérer les clés par chaque tâche à son démarrage." } }
    - { id: b, text: { en: "Create an Amazon Cognito identity pool with guest access, and have each job call GetCredentialsForIdentity.", fr: "Créer un groupe d'identités Amazon Cognito avec accès invité et faire appeler GetCredentialsForIdentity par chaque tâche." } }
    - { id: c, text: { en: "Run aws login once on each server, and let the jobs use the cached login credentials.", fr: "Exécuter aws login une fois sur chaque serveur et laisser les tâches utiliser les informations d'identification de connexion en cache." } }
    - { id: d, text: { en: "Configure IAM Roles Anywhere with a trust anchor for the CA and a profile, and set credential_process to the credential helper.", fr: "Configurer IAM Roles Anywhere avec une ancre d'approbation pour l'autorité de certification et un profil, et définir credential_process sur l'assistant d'identification." } }
answer: { optionId: d }
explanation:
  correct:
    en: "IAM Roles Anywhere gives workloads outside AWS temporary credentials in exchange for X.509 certificates from a CA registered as a trust anchor, such as AWS Private CA. The credential helper is configured as a credential_process in the config file, so the SDK default credential chain obtains and refreshes the credentials without code changes."
    fr: "IAM Roles Anywhere donne aux charges de travail hors d'AWS des informations d'identification temporaires en échange de certificats X.509 émis par une autorité inscrite comme ancre d'approbation, comme AWS Private CA. L'assistant d'identification est configuré comme credential_process dans le fichier config : la chaîne d'identification par défaut du SDK obtient et actualise les informations d'identification sans modifier le code."
  options:
    a:
      en: "The keys remain long-term credentials, the jobs need other credentials to call Secrets Manager, and the code must change."
      fr: "Les clés restent des informations d'identification à long terme, les tâches ont besoin d'autres informations d'identification pour appeler Secrets Manager, et le code doit changer."
    b:
      en: "Guest identities are unauthenticated, so anyone could obtain the role, and the job code would have to change."
      fr: "Les identités invitées ne sont pas authentifiées, n'importe qui pourrait donc obtenir le rôle, et le code des tâches devrait changer."
    c:
      en: "aws login is an interactive browser sign-in for people, and its session ends after at most 12 hours."
      fr: "aws login est une connexion interactive par navigateur destinée à des personnes, et sa session se termine au bout de 12 heures au plus."
references:
  - title: What is AWS Identity and Access Management Roles Anywhere?
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
  - title: AWS SDKs and Tools standardized credential providers
    url: https://docs.aws.amazon.com/sdkref/latest/guide/standardized-credentials.html
