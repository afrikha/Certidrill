id: dvac03-2a-authorizer-cache-policy
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon API Gateway REST API uses a TOKEN Lambda authorizer with authorization caching enabled and a TTL of 300 seconds. The authorizer returns a policy that allows execute-api:Invoke only on the methodArn of the incoming request. After a successful call to GET /orders, calls with the same token to GET /invoices fail with 403 for several minutes, although the user is entitled to both methods. The company wants to keep authorizer caching to limit Lambda invocations.

    Which change will resolve the issue?
  fr: |
    Une API REST Amazon API Gateway utilise un mécanisme d'autorisation Lambda de type TOKEN avec la mise en cache des autorisations activée et une durée de vie (TTL) de 300 secondes. Le mécanisme d'autorisation renvoie une politique qui autorise execute-api:Invoke uniquement sur le methodArn de la demande reçue. Après un appel réussi à GET /orders, les appels avec le même jeton à GET /invoices échouent avec 403 pendant plusieurs minutes, alors que l'utilisateur a droit aux deux méthodes. L'entreprise veut conserver la mise en cache du mécanisme d'autorisation pour limiter les appels Lambda.

    Quelle modification résout le problème ?
body:
  options:
    - { id: a, text: { en: "Set the authorizer result TTL to 0 seconds so that API Gateway invokes the authorizer for every request.", fr: "Définir la TTL du résultat d'autorisation à 0 seconde pour qu'API Gateway appelle le mécanisme d'autorisation à chaque demande." } }
    - { id: b, text: { en: "Change the authorizer to a REQUEST authorizer that uses the Authorization header as its only identity source.", fr: "Remplacer le mécanisme d'autorisation par un mécanisme REQUEST dont l'en-tête Authorization est la seule source d'identité." } }
    - { id: c, text: { en: "Add a resource policy to the API that allows execute-api:Invoke for all principals on every method.", fr: "Ajouter à l'API une politique de ressource qui autorise execute-api:Invoke pour tous les principaux sur toutes les méthodes." } }
    - { id: d, text: { en: "Return a policy that allows every method and resource that the user of the token is entitled to call.", fr: "Renvoyer une politique qui autorise toutes les méthodes et ressources que l'utilisateur du jeton a le droit d'appeler." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With caching, API Gateway stores the returned policy under the token and reuses it for any method of the API until the TTL expires. A policy limited to the first methodArn therefore denies the other methods, so the authorizer must return a policy that covers all the resources and methods the user may call."
    fr: "Avec la mise en cache, API Gateway stocke la politique renvoyée sous la clé du jeton et la réutilise pour toute méthode de l'API jusqu'à l'expiration de la TTL. Une politique limitée au premier methodArn refuse donc les autres méthodes : le mécanisme d'autorisation doit renvoyer une politique couvrant toutes les ressources et méthodes que l'utilisateur peut appeler."
  options:
    a:
      en: "A TTL of 0 disables caching, which the company wants to keep."
      fr: "Une TTL de 0 désactive la mise en cache, que l'entreprise veut conserver."
    b:
      en: "The cache key would still be the same token, so the cached policy for GET /orders would still be reused."
      fr: "La clé de cache serait toujours le même jeton : la politique mise en cache pour GET /orders serait toujours réutilisée."
    c:
      en: "A resource policy does not change the policy cached for the token, and allowing all principals weakens access control."
      fr: "Une politique de ressource ne modifie pas la politique mise en cache pour le jeton, et autoriser tous les principaux affaiblit le contrôle d'accès."
references:
  - title: Use API Gateway Lambda authorizers
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-use-lambda-authorizer.html
