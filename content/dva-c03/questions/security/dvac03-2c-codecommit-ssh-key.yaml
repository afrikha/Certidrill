id: dvac03-2c-codecommit-ssh-key
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer on Linux wants to clone AWS CodeCommit repositories over SSH with an IAM user. The developer generated a key pair with ssh-keygen, uploaded the public key on the Security credentials tab of the IAM user, and is now creating the following ~/.ssh/config file:

    ```text
    Host git-codecommit.*.amazonaws.com
      User <value>
      IdentityFile ~/.ssh/codecommit_rsa
    ```

    Which value should the developer use for User?
  fr: |
    Un développeur sous Linux veut cloner des référentiels AWS CodeCommit en SSH avec un utilisateur IAM. Le développeur a généré une paire de clés avec ssh-keygen, a chargé la clé publique dans l'onglet Security credentials de l'utilisateur IAM, et crée maintenant le fichier ~/.ssh/config suivant :

    ```text
    Host git-codecommit.*.amazonaws.com
      User <value>
      IdentityFile ~/.ssh/codecommit_rsa
    ```

    Quelle valeur le développeur doit-il utiliser pour User ?
body:
  options:
    - id: a
      text: { en: "The access key ID of the IAM user, which starts with AKIA", fr: "L'ID de clé d'accès de l'utilisateur IAM, qui commence par AKIA" }
    - id: b
      text: { en: "The name of the IAM user that owns the uploaded public key", fr: "Le nom de l'utilisateur IAM propriétaire de la clé publique chargée" }
    - id: c
      text: { en: "The SSH key ID that IAM displays for the key, which starts with APKA", fr: "L'ID de clé SSH qu'IAM affiche pour la clé, qui commence par APKA" }
    - id: d
      text: { en: "The 12-digit ID of the AWS account that contains the repositories", fr: "L'ID à 12 chiffres du compte AWS qui contient les référentiels" }
answer: { optionId: c }
explanation:
  correct:
    en: "After the public key is uploaded to the IAM user, IAM displays an SSH key ID such as APKAEIBAERJR2EXAMPLE. CodeCommit uses this ID as the SSH user name to find the IAM user and its key, so it goes in the User line of ~/.ssh/config together with the private key file."
    fr: "Une fois la clé publique chargée pour l'utilisateur IAM, IAM affiche un ID de clé SSH tel que APKAEIBAERJR2EXAMPLE. CodeCommit utilise cet ID comme nom d'utilisateur SSH pour retrouver l'utilisateur IAM et sa clé : il figure donc sur la ligne User de ~/.ssh/config avec le fichier de clé privée."
  options:
    a:
      en: "Access keys sign AWS API requests and are used by the HTTPS credential helper, not as the SSH user name for CodeCommit."
      fr: "Les clés d'accès signent les requêtes d'API AWS et servent à l'assistant d'informations d'identification HTTPS, pas de nom d'utilisateur SSH pour CodeCommit."
    b:
      en: "The IAM user name is not the SSH user name; CodeCommit identifies the uploaded key by its SSH key ID."
      fr: "Le nom de l'utilisateur IAM n'est pas le nom d'utilisateur SSH ; CodeCommit identifie la clé chargée par son ID de clé SSH."
    d:
      en: "The account ID does not identify an SSH public key, so CodeCommit cannot authenticate the connection with it."
      fr: "L'ID de compte n'identifie pas une clé publique SSH : CodeCommit ne peut pas authentifier la connexion avec."
references:
  - title: Setup steps for SSH connections to AWS CodeCommit repositories on Linux, macOS, or Unix
    url: https://docs.aws.amazon.com/codecommit/latest/userguide/setting-up-ssh-unixes.html
