id: dvac03-2c-hmac-token-verify
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An API issues JSON Web Tokens (JWTs) signed with the HS256 algorithm, an HMAC with SHA-256. Today the shared HMAC secret is stored in AWS Secrets Manager and loaded into the memory of every API instance. A new security requirement states that the secret key material must never leave AWS KMS unencrypted. The token format must not change.

    Which solution will meet these requirements?
  fr: |
    Une API émet des jetons JWT (JSON Web Token) signés avec l'algorithme HS256, un HMAC avec SHA-256. Aujourd'hui, le secret HMAC partagé est stocké dans AWS Secrets Manager et chargé dans la mémoire de chaque instance de l'API. Une nouvelle exigence de sécurité impose que le matériel de clé secrète ne quitte jamais AWS KMS en clair. Le format des jetons ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an HMAC_256 KMS key, call GenerateMac with HMAC_SHA_256 to create each token tag, and call VerifyMac to validate tokens.", fr: "Créer une clé KMS HMAC_256, appeler GenerateMac avec HMAC_SHA_256 pour créer la balise de chaque jeton, et appeler VerifyMac pour valider les jetons." }
    - id: b
      text: { en: "Create an RSA_2048 KMS key with key usage SIGN_VERIFY, call Sign to sign each token, and call Verify to validate tokens.", fr: "Créer une clé KMS RSA_2048 avec l'utilisation de clé SIGN_VERIFY, appeler Sign pour signer chaque jeton, et appeler Verify pour valider les jetons." }
    - id: c
      text: { en: "Keep the secret in Secrets Manager, encrypt it with a customer managed KMS key, and enable automatic rotation of the secret every 30 days.", fr: "Conserver le secret dans Secrets Manager, le chiffrer avec une clé KMS gérée par le client, et activer la rotation automatique du secret tous les 30 jours." }
    - id: d
      text: { en: "Create a symmetric encryption KMS key, call Encrypt on each token payload, and call Decrypt to validate tokens received by the API.", fr: "Créer une clé KMS de chiffrement symétrique, appeler Encrypt sur la charge utile de chaque jeton, et appeler Decrypt pour valider les jetons reçus par l'API." }
answer: { optionId: a }
explanation:
  correct:
    en: "HMAC KMS keys compute and verify HMAC tags inside AWS KMS with GenerateMac and VerifyMac, and their key material never leaves AWS KMS unencrypted. AWS lists the verification of JWTs as a typical use case, and HMAC_SHA_256 keeps the HS256 token format."
    fr: "Les clés KMS HMAC calculent et vérifient les balises HMAC dans AWS KMS avec GenerateMac et VerifyMac, et leur matériel de clé ne quitte jamais AWS KMS en clair. AWS cite la vérification des JWT comme cas d'usage typique, et HMAC_SHA_256 conserve le format de jeton HS256."
  options:
    b:
      en: "Asymmetric signatures also keep the key in AWS KMS, but they produce RS256-style tokens, which changes the token format."
      fr: "Les signatures asymétriques gardent aussi la clé dans AWS KMS, mais elles produisent des jetons de type RS256, ce qui change le format des jetons."
    c:
      en: "The secret would still be decrypted and loaded into the memory of every instance, so the key material leaves AWS KMS."
      fr: "Le secret serait toujours déchiffré et chargé dans la mémoire de chaque instance : le matériel de clé quitte AWS KMS."
    d:
      en: "Encrypting the payload does not produce an HS256 token, and Encrypt accepts at most 4 KB, so the token format changes."
      fr: "Chiffrer la charge utile ne produit pas de jeton HS256, et Encrypt accepte au maximum 4 Ko : le format des jetons change."
references:
  - title: HMAC keys in AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/hmac.html
