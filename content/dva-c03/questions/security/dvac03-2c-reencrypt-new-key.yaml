id: dvac03-2c-reencrypt-new-key
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application stores database passwords that were encrypted with the KMS Encrypt operation under a symmetric KMS key named key A. After a change of ownership, the company must protect all these ciphertexts with a different symmetric KMS key named key B. The plaintext passwords must never be returned to the application during the change.

    Which solution will meet these requirements?
  fr: |
    Une application stocke des mots de passe de base de données chiffrés avec l'opération KMS Encrypt sous une clé KMS symétrique nommée clé A. Après un changement de propriétaire, l'entreprise doit protéger tous ces textes chiffrés avec une autre clé KMS symétrique nommée clé B. Les mots de passe en texte clair ne doivent jamais être renvoyés à l'application pendant le changement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable automatic key rotation on key A with a rotation period of 90 days, and keep the existing ciphertexts.", fr: "Activer la rotation automatique de la clé A avec une période de 90 jours, et conserver les textes chiffrés existants." }
    - id: b
      text: { en: "Call Decrypt on each ciphertext with key A, then call Encrypt on each password with key B, and store the result.", fr: "Appeler Decrypt sur chaque texte chiffré avec la clé A, puis Encrypt sur chaque mot de passe avec la clé B, et stocker le résultat." }
    - id: c
      text: { en: "Call ReEncrypt on each ciphertext with key A as the source key and key B as the destination key, and store the result.", fr: "Appeler ReEncrypt sur chaque texte chiffré avec la clé A comme clé source et la clé B comme clé de destination, et stocker le résultat." }
    - id: d
      text: { en: "Update the alias that the application uses so that it points to key B, and keep the existing ciphertexts.", fr: "Mettre à jour l'alias utilisé par l'application pour qu'il pointe vers la clé B, et conserver les textes chiffrés existants." }
answer: { optionId: c }
explanation:
  correct:
    en: "ReEncrypt decrypts the ciphertext and encrypts it again under the destination key entirely inside AWS KMS, so the response contains only the new ciphertext. The caller needs kms:ReEncryptFrom on key A and kms:ReEncryptTo on key B."
    fr: "ReEncrypt déchiffre le texte chiffré et le chiffre de nouveau sous la clé de destination entièrement dans AWS KMS : la réponse ne contient que le nouveau texte chiffré. L'appelant a besoin de kms:ReEncryptFrom sur la clé A et de kms:ReEncryptTo sur la clé B."
  options:
    a:
      en: "Rotation changes the key material of key A but keeps the same key; the ciphertexts are still protected by key A, not key B."
      fr: "La rotation change le matériel de clé de la clé A mais conserve la même clé : les textes chiffrés restent protégés par la clé A, et non par la clé B."
    b:
      en: "Decrypt returns the plaintext passwords to the application, which the requirements forbid."
      fr: "Decrypt renvoie les mots de passe en texte clair à l'application, ce que les exigences interdisent."
    d:
      en: "An alias change affects only new encryption requests; existing ciphertexts stay encrypted under key A."
      fr: "Un changement d'alias n'affecte que les nouvelles requêtes de chiffrement ; les textes chiffrés existants restent chiffrés sous la clé A."
references:
  - title: ReEncrypt
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_ReEncrypt.html
