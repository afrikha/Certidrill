id: dvac03-2d-agentcore-policy
objective: "2.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AI agents call a processRefund tool, the only tool of an Amazon Bedrock AgentCore Gateway. The company must enforce, outside the agents' code, that the tool runs only for refunds of 500 USD or less. The limit must hold even if a prompt injection manipulates an agent.

    Which actions should the developer take? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Des agents d'IA appellent un outil processRefund, le seul outil d'une passerelle Amazon Bedrock AgentCore Gateway. L'entreprise doit imposer, en dehors du code des agents, que l'outil ne s'exécute que pour des remboursements de 500 USD ou moins. La limite doit tenir même si une injection d'invite manipule un agent.

    Quelles actions le développeur doit-il effectuer ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add an instruction to each agent's system prompt that forbids refunds above 500 USD.", fr: "Ajouter à l'invite système de chaque agent une instruction qui interdit les remboursements supérieurs à 500 USD." } }
    - { id: b, text: { en: "Create a policy engine in Policy in AgentCore, and associate it with the gateway.", fr: "Créer un moteur de politiques dans Policy in AgentCore, et l'associer à la passerelle." } }
    - { id: c, text: { en: "Write a Cedar forbid policy for the processRefund tool without a condition, so that it overrides any permit policy.", fr: "Écrire une politique Cedar forbid pour l'outil processRefund sans condition, afin qu'elle prévale sur toute politique permit." } }
    - { id: d, text: { en: "Add a denied topic for refunds above 500 USD to a guardrail associated with each agent.", fr: "Ajouter un sujet refusé pour les remboursements supérieurs à 500 USD à une barrière de protection associée à chaque agent." } }
    - { id: e, text: { en: "Write a Cedar permit policy for the processRefund tool whose condition limits the amount input to 500 or less.", fr: "Écrire une politique Cedar permit pour l'outil processRefund dont la condition limite l'entrée amount à 500 ou moins." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Policy in AgentCore evaluates every tool call that passes through an associated gateway against Cedar policies stored in a policy engine, outside the agent's code. The engine denies by default, so a permit policy whose condition checks the tool's amount input allows only refunds of 500 USD or less, whatever the agent was told."
    fr: "Policy in AgentCore évalue chaque appel d'outil qui passe par une passerelle associée au regard des politiques Cedar stockées dans un moteur de politiques, en dehors du code de l'agent. Le moteur refuse par défaut : une politique permit dont la condition vérifie l'entrée amount de l'outil n'autorise que les remboursements de 500 USD ou moins, quoi qu'on ait dit à l'agent."
  options:
    a:
      en: "A system prompt instruction lives in the agent and can be overridden by a prompt injection; it is not enforced outside the agent."
      fr: "Une instruction d'invite système réside dans l'agent et peut être contournée par une injection d'invite ; elle n'est pas appliquée en dehors de l'agent."
    c:
      en: "Forbid wins over permit, so an unconditional forbid would block every refund, including those of 500 USD or less."
      fr: "Forbid l'emporte sur permit : une interdiction sans condition bloquerait tous les remboursements, y compris ceux de 500 USD ou moins."
    d:
      en: "A guardrail filters text that the model reads or writes; it does not check the parameters of tool calls at the gateway."
      fr: "Une barrière de protection filtre le texte que le modèle lit ou écrit ; elle ne vérifie pas les paramètres des appels d'outils au niveau de la passerelle."
references:
  - title: "Policy in Amazon Bedrock AgentCore: Control Agent Interactions"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html
  - title: Core concepts
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy-core-concepts.html
