id: dvac03-2c-ssm-securestring-api-key
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer must store a 64-character API key for a third-party weather service that several AWS Lambda functions use. The key must be encrypted at rest and readable only by the functions' IAM roles. The provider never rotates the key, and the company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    Un développeur doit stocker une clé d'API de 64 caractères pour un service météo tiers qu'utilisent plusieurs fonctions AWS Lambda. La clé doit être chiffrée au repos et lisible uniquement par les rôles IAM des fonctions. Le fournisseur ne fait jamais changer la clé, et l'entreprise veut la solution la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the key as a standard-tier SecureString parameter in AWS Systems Manager Parameter Store.", fr: "Stocker la clé comme paramètre SecureString du niveau standard dans AWS Systems Manager Parameter Store." }
    - id: b
      text: { en: "Store the key as an advanced-tier SecureString parameter in AWS Systems Manager Parameter Store.", fr: "Stocker la clé comme paramètre SecureString du niveau avancé dans AWS Systems Manager Parameter Store." }
    - id: c
      text: { en: "Store the key as a secret in AWS Secrets Manager encrypted with the aws/secretsmanager key.", fr: "Stocker la clé comme secret dans AWS Secrets Manager chiffré avec la clé aws/secretsmanager." }
    - id: d
      text: { en: "Store the key as a standard-tier String parameter in AWS Systems Manager Parameter Store.", fr: "Stocker la clé comme paramètre String du niveau standard dans AWS Systems Manager Parameter Store." }
answer: { optionId: a }
explanation:
  correct:
    en: "A SecureString parameter is encrypted with an AWS KMS key, and reading it requires ssm:GetParameter plus decryption, so access can be limited to the functions' roles. Standard-tier parameters have no additional charge and hold values up to 4 KB, which is enough for this key."
    fr: "Un paramètre SecureString est chiffré avec une clé AWS KMS, et sa lecture exige ssm:GetParameter et le déchiffrement : l'accès peut être limité aux rôles des fonctions. Les paramètres du niveau standard n'entraînent aucun frais supplémentaire et contiennent des valeurs jusqu'à 4 Ko, ce qui suffit pour cette clé."
  options:
    b:
      en: "Advanced-tier parameters are charged and are needed only for values larger than 4 KB, parameter policies, or more parameters."
      fr: "Les paramètres du niveau avancé sont payants et ne sont nécessaires que pour des valeurs de plus de 4 Ko, des politiques de paramètres ou davantage de paramètres."
    c:
      en: "Secrets Manager charges per secret; its rotation features are not needed for a key that is never rotated, so it costs more."
      fr: "Secrets Manager facture chaque secret ; ses fonctions de rotation sont inutiles pour une clé jamais renouvelée : la solution coûte plus cher."
    d:
      en: "A String parameter is stored in plaintext, so the key would not be encrypted at rest."
      fr: "Un paramètre String est stocké en clair : la clé ne serait pas chiffrée au repos."
references:
  - title: Choosing parameter tiers in Parameter Store
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-advanced-parameters.html
  - title: AWS KMS encryption for AWS Systems Manager Parameter Store SecureString parameters
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/secure-string-parameter-kms-encryption.html
