id: dvac03-2c-import-key-pair
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer needs SSH access to Amazon Linux test instances that are launched with an Amazon EC2 key pair. The company's security policy requires that the private key is generated on the developer's workstation and is never generated by, sent to, or stored in AWS.

    Which solution will meet these requirements?
  fr: |
    Un développeur a besoin d'un accès SSH à des instances de test Amazon Linux lancées avec une paire de clés Amazon EC2. La politique de sécurité de l'entreprise exige que la clé privée soit générée sur le poste de travail du développeur et ne soit jamais générée par AWS, envoyée à AWS ni stockée dans AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run aws ec2 create-key-pair with --key-type ed25519 --key-format pem, and save the KeyMaterial output to a file on the workstation.", fr: "Exécuter aws ec2 create-key-pair avec --key-type ed25519 --key-format pem, et enregistrer la sortie KeyMaterial dans un fichier du poste de travail." }
    - id: b
      text: { en: "Run ssh-keygen on the workstation, then run aws ec2 import-key-pair with the .pub file as the public key material.", fr: "Exécuter ssh-keygen sur le poste de travail, puis exécuter aws ec2 import-key-pair avec le fichier .pub comme matériel de clé publique." }
    - id: c
      text: { en: "Declare an AWS::EC2::KeyPair resource without a PublicKeyMaterial property in an AWS CloudFormation template, and deploy the stack.", fr: "Déclarer une ressource AWS::EC2::KeyPair sans propriété PublicKeyMaterial dans un modèle AWS CloudFormation, et déployer la pile." }
    - id: d
      text: { en: "Create the key pair in the Amazon EC2 console in the .ppk format, and download the private key file once to the workstation.", fr: "Créer la paire de clés dans la console Amazon EC2 au format .ppk, et télécharger une seule fois le fichier de clé privée sur le poste de travail." }
answer: { optionId: b }
explanation:
  correct:
    en: "When you import a key pair, you generate it with a third-party tool such as ssh-keygen and upload only the public key with import-key-pair. AWS never has the private key. The instances can then be launched with the imported key pair name."
    fr: "Lorsque vous importez une paire de clés, vous la générez avec un outil tiers comme ssh-keygen et ne chargez que la clé publique avec import-key-pair. AWS ne possède jamais la clé privée. Les instances peuvent ensuite être lancées avec le nom de la paire de clés importée."
  options:
    a:
      en: "create-key-pair generates the key pair in AWS and returns the private key in the response, so the private key is generated by AWS and sent over the network."
      fr: "create-key-pair génère la paire de clés dans AWS et renvoie la clé privée dans la réponse : la clé privée est générée par AWS et transmise sur le réseau."
    c:
      en: "A key pair that CloudFormation creates is generated by AWS, and its private key is stored in AWS Systems Manager Parameter Store."
      fr: "Une paire de clés créée par CloudFormation est générée par AWS, et sa clé privée est stockée dans AWS Systems Manager Parameter Store."
    d:
      en: "A key pair created in the console is generated by AWS; downloading the private key once does not change where it was generated."
      fr: "Une paire de clés créée dans la console est générée par AWS ; télécharger la clé privée une seule fois ne change pas l'endroit où elle a été générée."
references:
  - title: Create a key pair for your Amazon EC2 instance
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/create-key-pairs.html
