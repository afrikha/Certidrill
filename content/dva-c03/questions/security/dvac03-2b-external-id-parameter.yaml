id: dvac03-2b-external-id-parameter
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany sells a SaaS monitoring product that runs in its own AWS account. Each customer creates an IAM role whose trust policy allows AnyCompany's account and contains a StringEquals condition on sts:ExternalId with a unique value that AnyCompany generated for that customer. AnyCompany's Python collector calls assume_role with only the RoleArn and RoleSessionName parameters and receives an AccessDenied error for every customer.

    Which change will fix the collector?
  fr: |
    AnyCompany vend un produit de surveillance SaaS qui s'exécute dans son propre compte AWS. Chaque client crée un rôle IAM dont la politique d'approbation autorise le compte d'AnyCompany et contient une condition StringEquals sur sts:ExternalId avec une valeur unique qu'AnyCompany a générée pour ce client. Le collecteur Python d'AnyCompany appelle assume_role avec seulement les paramètres RoleArn et RoleSessionName, et reçoit une erreur AccessDenied pour chaque client.

    Quelle modification corrige le collecteur ?
body:
  options:
    - id: a
      text: { en: "Pass the customer's unique value in the ExternalId parameter of the assume_role call.", fr: "Passer la valeur unique du client dans le paramètre ExternalId de l'appel assume_role." }
    - id: b
      text: { en: "Pass the customer's unique value in the RoleSessionName parameter of the assume_role call.", fr: "Passer la valeur unique du client dans le paramètre RoleSessionName de l'appel assume_role." }
    - id: c
      text: { en: "Pass the customer's unique value in the SourceIdentity parameter of the assume_role call.", fr: "Passer la valeur unique du client dans le paramètre SourceIdentity de l'appel assume_role." }
    - id: d
      text: { en: "Pass the customer's unique value as a session tag in the Tags parameter of the assume_role call.", fr: "Passer la valeur unique du client comme balise de session dans le paramètre Tags de l'appel assume_role." }
answer: { optionId: a }
explanation:
  correct:
    en: "The sts:ExternalId condition key is set from the ExternalId parameter of AssumeRole. Without that parameter the condition does not match and the trust policy denies the call. The external ID protects each customer against the confused deputy problem."
    fr: "La clé de condition sts:ExternalId prend la valeur du paramètre ExternalId d'AssumeRole. Sans ce paramètre, la condition ne correspond pas et la politique d'approbation refuse l'appel. L'ID externe protège chaque client contre le problème de l'adjoint confus."
  options:
    b:
      en: "The session name sets the sts:RoleSessionName context, not sts:ExternalId, so the condition still fails."
      fr: "Le nom de session alimente le contexte sts:RoleSessionName et non sts:ExternalId : la condition échoue toujours."
    c:
      en: "A source identity is recorded for auditing and is evaluated with sts:SourceIdentity, not with sts:ExternalId."
      fr: "Une identité source est enregistrée pour l'audit et s'évalue avec sts:SourceIdentity, et non avec sts:ExternalId."
    d:
      en: "Session tags are evaluated with the aws:RequestTag and aws:PrincipalTag keys, so they do not satisfy an sts:ExternalId condition."
      fr: "Les balises de session s'évaluent avec les clés aws:RequestTag et aws:PrincipalTag : elles ne satisfont pas une condition sts:ExternalId."
references:
  - title: Access to AWS accounts owned by third parties
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_third-party.html
