id: dvac03-2a-apigw-iam-auth-call
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A method of an Amazon API Gateway REST API uses AWS_IAM authorization. A service that runs on an Amazon EC2 instance with an instance profile must call the GET /prices method of the prod stage.

    Which solution will allow the service to call the method?
  fr: |
    Une méthode d'une API REST Amazon API Gateway utilise l'autorisation AWS_IAM. Un service qui s'exécute sur une instance Amazon EC2 dotée d'un profil d'instance doit appeler la méthode GET /prices de l'étape prod.

    Quelle solution permet au service d'appeler la méthode ?
body:
  options:
    - { id: a, text: { en: "Allow execute-api:Invoke on the method's ARN in the instance role, and sign the requests with SigV4.", fr: "Autoriser execute-api:Invoke sur l'ARN de la méthode dans le rôle de l'instance et signer les demandes avec SigV4." } }
    - { id: b, text: { en: "Create an API key for the service, and send it in the x-api-key header of each request.", fr: "Créer une clé d'API pour le service et l'envoyer dans l'en-tête x-api-key de chaque demande." } }
    - { id: c, text: { en: "Allow lambda:InvokeFunction on the backend function in the instance role, and call the API unsigned.", fr: "Autoriser lambda:InvokeFunction sur la fonction backend dans le rôle de l'instance et appeler l'API sans signature." } }
    - { id: d, text: { en: "Send the ARN of the instance role in the Authorization header, and allow apigateway:GET in its policy.", fr: "Envoyer l'ARN du rôle de l'instance dans l'en-tête Authorization et autoriser apigateway:GET dans sa politique." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With AWS_IAM authorization, callers must sign requests with SigV4 (or SigV4a) by using AWS credentials, here the instance profile credentials. The caller's policy must allow execute-api:Invoke on a resource such as arn:aws:execute-api:region:account-id:api-id/prod/GET/prices."
    fr: "Avec l'autorisation AWS_IAM, les appelants doivent signer les demandes avec SigV4 (ou SigV4a) à l'aide d'informations d'identification AWS, ici celles du profil d'instance. La politique de l'appelant doit autoriser execute-api:Invoke sur une ressource comme arn:aws:execute-api:region:account-id:api-id/prod/GET/prices."
  options:
    b:
      en: "API keys serve usage plans and throttling; they do not satisfy IAM authorization."
      fr: "Les clés d'API servent aux plans d'utilisation et à la limitation ; elles ne satisfont pas l'autorisation IAM."
    c:
      en: "API Gateway invokes the backend with its own permissions; the caller must still send a signed request with execute-api:Invoke permission."
      fr: "API Gateway appelle le backend avec ses propres autorisations ; l'appelant doit quand même envoyer une demande signée et avoir l'autorisation execute-api:Invoke."
    d:
      en: "A role ARN is not a credential, and apigateway:GET permits reading API configuration, not invoking methods."
      fr: "Un ARN de rôle n'est pas une information d'identification, et apigateway:GET permet de lire la configuration de l'API, pas d'appeler des méthodes."
references:
  - title: Control access to a REST API with IAM permissions
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/permissions.html
