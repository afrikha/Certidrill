id: dvac03-2c-cwl-account-policy
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs hundreds of AWS Lambda functions and Amazon ECS services in one AWS account. Development teams create new log groups every week. The security team must make sure that credit card numbers and US driver's license numbers are masked in every existing and future Amazon CloudWatch Logs log group in the account, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des centaines de fonctions AWS Lambda et de services Amazon ECS dans un seul compte AWS. Les équipes de développement créent de nouveaux groupes de journaux chaque semaine. L'équipe de sécurité doit s'assurer que les numéros de carte de crédit et de permis de conduire américains sont masqués dans tous les groupes de journaux Amazon CloudWatch Logs existants et futurs du compte, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run aws logs put-data-protection-policy for each log group, and add the command to the deployment pipeline of every team.", fr: "Exécuter aws logs put-data-protection-policy pour chaque groupe de journaux, et ajouter la commande au pipeline de déploiement de chaque équipe." }
    - id: b
      text: { en: "Create an Amazon EventBridge rule for CreateLogGroup events that invokes a Lambda function to add a data protection policy to the new group.", fr: "Créer une règle Amazon EventBridge pour les événements CreateLogGroup qui invoque une fonction Lambda pour ajouter une politique de protection des données au nouveau groupe." }
    - id: c
      text: { en: "Enable Amazon Macie in the account, and configure automated sensitive data discovery for the CloudWatch Logs log groups.", fr: "Activer Amazon Macie dans le compte, et configurer la découverte automatisée des données sensibles pour les groupes de journaux CloudWatch Logs." }
    - id: d
      text: { en: "Run aws logs put-account-policy with --policy-type DATA_PROTECTION_POLICY and --scope ALL, with the two managed data identifiers.", fr: "Exécuter aws logs put-account-policy avec --policy-type DATA_PROTECTION_POLICY et --scope ALL, avec les deux identifiants de données gérés." }
answer: { optionId: d }
explanation:
  correct:
    en: "An account-level data protection policy applies to all current log groups and to log groups created in the future, so no per-group automation is needed. If a log group also has its own policy, the identifiers of both policies are audited and masked."
    fr: "Une politique de protection des données au niveau du compte s'applique à tous les groupes de journaux actuels et à ceux créés à l'avenir : aucune automatisation par groupe n'est nécessaire. Si un groupe de journaux possède aussi sa propre politique, les identifiants des deux politiques sont audités et masqués."
  options:
    a:
      en: "Per-group policies work, but every team must remember to apply them, which adds operational overhead and leaves gaps for groups created outside the pipelines."
      fr: "Les politiques par groupe fonctionnent, mais chaque équipe doit penser à les appliquer, ce qui ajoute de la charge opérationnelle et laisse des trous pour les groupes créés hors des pipelines."
    b:
      en: "Event-driven automation works but requires code to build and maintain, which is more overhead than one account-level policy."
      fr: "L'automatisation événementielle fonctionne mais demande du code à créer et à maintenir, soit plus de charge qu'une seule politique au niveau du compte."
    c:
      en: "Macie discovers sensitive data in Amazon S3 buckets; it does not inspect or mask CloudWatch Logs log groups."
      fr: "Macie découvre des données sensibles dans les compartiments Amazon S3 ; il n'inspecte ni ne masque les groupes de journaux CloudWatch Logs."
references:
  - title: Create an account-wide data protection policy
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data-accountlevel.html
