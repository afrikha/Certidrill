id: dvac03-2b-bucket-keys-cost
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application writes millions of small objects each day to an Amazon S3 bucket whose default encryption is SSE-KMS with a customer managed key. The AWS KMS request charges are high. The company must keep SSE-KMS with the same key and wants to reduce the KMS request costs with the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une application écrit chaque jour des millions de petits objets dans un compartiment Amazon S3 dont le chiffrement par défaut est SSE-KMS avec une clé gérée par le client. Les frais de requêtes AWS KMS sont élevés. L'entreprise doit conserver SSE-KMS avec la même clé et veut réduire les coûts des requêtes KMS avec le MOINS d'efforts de développement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the default encryption of the bucket to DSSE-KMS with the same customer managed key.", fr: "Changer le chiffrement par défaut du compartiment en DSSE-KMS avec la même clé gérée par le client." }
    - id: b
      text: { en: "Turn on S3 Bucket Keys in the default encryption configuration of the bucket.", fr: "Activer les S3 Bucket Keys dans la configuration de chiffrement par défaut du compartiment." }
    - id: c
      text: { en: "Encrypt the objects in the application with the Amazon S3 Encryption Client and the same key as the wrapping key.", fr: "Chiffrer les objets dans l'application avec l'Amazon S3 Encryption Client et la même clé comme clé d'encapsulation." }
    - id: d
      text: { en: "Request a higher AWS KMS request quota for the account in the Region of the bucket.", fr: "Demander un quota de requêtes AWS KMS plus élevé pour le compte dans la Région du compartiment." }
answer: { optionId: b }
explanation:
  correct:
    en: "An S3 Bucket Key is a short-lived bucket-level key that AWS KMS generates and that Amazon S3 uses to create data keys for new objects, so most uploads no longer call AWS KMS. This can reduce KMS request costs by up to 99 percent while the objects stay encrypted with SSE-KMS and the same key. It is a bucket setting, so no code changes."
    fr: "Une S3 Bucket Key est une clé de courte durée au niveau du compartiment, générée par AWS KMS, qu'Amazon S3 utilise pour créer les clés de données des nouveaux objets : la plupart des chargements n'appellent plus AWS KMS. Cela peut réduire jusqu'à 99 % les coûts des requêtes KMS, tandis que les objets restent chiffrés avec SSE-KMS et la même clé. C'est un paramètre du compartiment : aucun code ne change."
  options:
    a:
      en: "DSSE-KMS adds a second layer of encryption and costs more, and S3 Bucket Keys are not supported with it."
      fr: "DSSE-KMS ajoute une seconde couche de chiffrement et coûte plus cher, et les S3 Bucket Keys ne sont pas prises en charge avec lui."
    c:
      en: "Client-side encryption requires code changes, still uses a unique data key for each object, and no longer uses SSE-KMS."
      fr: "Le chiffrement côté client nécessite des modifications du code, utilise toujours une clé de données unique par objet et n'utilise plus SSE-KMS."
    d:
      en: "A higher quota allows more requests but does not reduce the number of billed KMS requests."
      fr: "Un quota plus élevé autorise davantage de requêtes mais ne réduit pas le nombre de requêtes KMS facturées."
references:
  - title: Reducing the cost of SSE-KMS with Amazon S3 Bucket Keys
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-key.html
