id: dvac03-2b-s3-events-encrypted-sqs
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer configures Amazon S3 event notifications to send ObjectCreated events to an Amazon SQS queue. The queue policy allows s3.amazonaws.com to call sqs:SendMessage with an aws:SourceArn condition for the bucket. A compliance rule requires the queue to be encrypted with SSE-KMS. The queue uses the AWS managed key for Amazon SQS, and no event messages arrive in the queue.

    Which solution will meet these requirements?
  fr: |
    Un développeur configure des notifications d'événements Amazon S3 pour envoyer les événements ObjectCreated dans une file d'attente Amazon SQS. La politique de la file d'attente autorise s3.amazonaws.com à appeler sqs:SendMessage avec une condition aws:SourceArn pour le compartiment. Une règle de conformité exige que la file d'attente soit chiffrée avec SSE-KMS. La file d'attente utilise la clé gérée par AWS pour Amazon SQS, et aucun message d'événement n'arrive dans la file d'attente.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Encrypt the queue with a customer managed key whose key policy allows s3.amazonaws.com to call kms:GenerateDataKey and kms:Decrypt.", fr: "Chiffrer la file d'attente avec une clé gérée par le client dont la politique de clé autorise s3.amazonaws.com à appeler kms:GenerateDataKey et kms:Decrypt." }
    - id: b
      text: { en: "Add a statement to the key policy of the AWS managed key for Amazon SQS that allows s3.amazonaws.com to use the key.", fr: "Ajouter à la politique de clé de la clé gérée par AWS pour Amazon SQS une instruction qui autorise s3.amazonaws.com à utiliser la clé." }
    - id: c
      text: { en: "Replace SSE-KMS on the queue with SSE-SQS, which uses encryption keys owned by Amazon SQS.", fr: "Remplacer SSE-KMS sur la file d'attente par SSE-SQS, qui utilise des clés de chiffrement détenues par Amazon SQS." }
    - id: d
      text: { en: "Allow kms:GenerateDataKey and kms:Decrypt on the key in the execution role of the Lambda function that consumes the queue.", fr: "Autoriser kms:GenerateDataKey et kms:Decrypt sur la clé dans le rôle d'exécution de la fonction Lambda qui consomme la file d'attente." }
answer: { optionId: a }
explanation:
  correct:
    en: "To send to an SSE-KMS queue, Amazon S3 must use the KMS key to protect each message. AWS services such as S3 event notifications work with encrypted queues only through a customer managed key whose key policy allows the service principal to call kms:GenerateDataKey and kms:Decrypt."
    fr: "Pour envoyer dans une file d'attente SSE-KMS, Amazon S3 doit utiliser la clé KMS pour protéger chaque message. Les services AWS comme les notifications d'événements S3 ne fonctionnent avec des files d'attente chiffrées que par une clé gérée par le client dont la politique de clé autorise le principal de service à appeler kms:GenerateDataKey et kms:Decrypt."
  options:
    b:
      en: "The key policy of an AWS managed key for Amazon SQS cannot be modified."
      fr: "La politique de clé d'une clé gérée par AWS pour Amazon SQS ne peut pas être modifiée."
    c:
      en: "SSE-SQS is not SSE-KMS, so this change breaks the compliance rule."
      fr: "SSE-SQS n'est pas SSE-KMS : cette modification enfreint la règle de conformité."
    d:
      en: "The consumer's permissions matter only after messages are in the queue; Amazon S3 still cannot use the key to send them."
      fr: "Les autorisations du consommateur n'interviennent qu'une fois les messages dans la file d'attente ; Amazon S3 ne peut toujours pas utiliser la clé pour les envoyer."
references:
  - title: Amazon SQS Key management
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-key-management.html
  - title: Granting permissions to publish event notification messages to a destination
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/grant-destinations-permissions-to-s3.html
