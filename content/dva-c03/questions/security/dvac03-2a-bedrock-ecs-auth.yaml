id: dvac03-2a-bedrock-ecs-auth
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a containerized application on Amazon ECS with AWS Fargate. The application calls the Amazon Bedrock Converse API with the AWS SDK for Python (Boto3). A developer proposes generating an Amazon Bedrock API key and storing it in the AWS_BEARER_TOKEN_BEDROCK environment variable of the task.

    Which solution is the MOST secure way to authenticate the calls?
  fr: |
    Une entreprise exécute une application conteneurisée sur Amazon ECS avec AWS Fargate. L'application appelle l'API Converse d'Amazon Bedrock avec l'AWS SDK pour Python (Boto3). Un développeur propose de générer une clé d'API Amazon Bedrock et de la stocker dans la variable d'environnement AWS_BEARER_TOKEN_BEDROCK de la tâche.

    Quelle solution est la manière la PLUS sécurisée d'authentifier les appels ?
body:
  options:
    - { id: a, text: { en: "Generate a long-term Amazon Bedrock API key with a 30-day expiration, and store it in the task environment variable.", fr: "Générer une clé d'API Amazon Bedrock à long terme qui expire au bout de 30 jours et la stocker dans la variable d'environnement de la tâche." } }
    - { id: b, text: { en: "Generate a short-term Amazon Bedrock API key during each deployment, and store it in the task environment variable.", fr: "Générer une clé d'API Amazon Bedrock à court terme à chaque déploiement et la stocker dans la variable d'environnement de la tâche." } }
    - { id: c, text: { en: "Grant bedrock:InvokeModel to the task role, and let Boto3 sign the Converse requests with the task role credentials.", fr: "Accorder bedrock:InvokeModel au rôle de tâche et laisser Boto3 signer les demandes Converse avec les informations d'identification du rôle de tâche." } }
    - { id: d, text: { en: "Create an IAM user with the AmazonBedrockLimitedAccess policy, and pass its access keys to the task as variables.", fr: "Créer un utilisateur IAM avec la politique AmazonBedrockLimitedAccess et passer ses clés d'accès à la tâche sous forme de variables." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Converse requires the bedrock:InvokeModel permission. With a task role, the SDK obtains temporary credentials from the ECS container credentials endpoint, refreshes them automatically and signs each request with SigV4, so no bearer token or key is stored in the task."
    fr: "Converse exige l'autorisation bedrock:InvokeModel. Avec un rôle de tâche, le SDK obtient des informations d'identification temporaires du point de terminaison des informations d'identification de conteneur ECS, les actualise automatiquement et signe chaque demande avec SigV4 : aucun jeton porteur ni aucune clé n'est stocké dans la tâche."
  options:
    a:
      en: "AWS recommends long-term Amazon Bedrock API keys for exploration only; the key is a stored bearer token tied to an IAM user."
      fr: "AWS ne recommande les clés d'API Amazon Bedrock à long terme que pour l'exploration ; la clé est un jeton porteur stocké lié à un utilisateur IAM."
    b:
      en: "A short-term key lasts at most 12 hours or the session duration, so a long-running task would fail after it expires, and the bearer token is still stored."
      fr: "Une clé à court terme dure 12 heures au plus ou la durée de la session : une tâche de longue durée échouerait après son expiration, et le jeton porteur resterait stocké."
    d:
      en: "IAM user access keys are long-term credentials that must be rotated and can leak from the task configuration."
      fr: "Les clés d'accès d'un utilisateur IAM sont des informations d'identification à long terme à renouveler, qui peuvent fuiter de la configuration de la tâche."
references:
  - title: Inference using Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
  - title: API keys
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/api-keys.html
