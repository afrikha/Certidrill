id: dvac03-2c-bedrock-short-term-api-key
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a production integration that calls Amazon Bedrock through a third-party HTTP tool. The tool can authenticate only with a bearer token in the Authorization header. The integration runs in a container that already has an IAM role with permissions on the required models, and it can run a small Python helper before each request. The solution must be the MOST secure.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute en production une intégration qui appelle Amazon Bedrock via un outil HTTP tiers. L'outil ne peut s'authentifier qu'avec un jeton porteur (bearer token) dans l'en-tête Authorization. L'intégration s'exécute dans un conteneur qui dispose déjà d'un rôle IAM avec des autorisations sur les modèles nécessaires, et elle peut exécuter un petit utilitaire Python avant chaque requête. La solution doit être la PLUS sécurisée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an IAM user with the required permissions, create a long-term Amazon Bedrock API key with a 365-day expiration, and store it in the container image.", fr: "Créer un utilisateur IAM avec les autorisations nécessaires, créer une clé d'API Amazon Bedrock à long terme qui expire au bout de 365 jours, et la stocker dans l'image du conteneur." }
    - id: b
      text: { en: "Create an IAM user with the required permissions, create an access key for it, and pass the access key ID and secret access key as the bearer token.", fr: "Créer un utilisateur IAM avec les autorisations nécessaires, lui créer une clé d'accès, et passer l'ID de clé d'accès et la clé d'accès secrète comme jeton porteur." }
    - id: c
      text: { en: "Generate a short-term Amazon Bedrock API key from the role's credentials with the token generator library, and refresh it before it expires.", fr: "Générer une clé d'API Amazon Bedrock à court terme à partir des informations d'identification du rôle avec la bibliothèque de génération de jetons, et la renouveler avant son expiration." }
    - id: d
      text: { en: "Create a long-term Amazon Bedrock API key for an IAM user, store it in AWS Secrets Manager, and rotate it manually every 90 days.", fr: "Créer une clé d'API Amazon Bedrock à long terme pour un utilisateur IAM, la stocker dans AWS Secrets Manager, et la renouveler manuellement tous les 90 jours." }
answer: { optionId: c }
explanation:
  correct:
    en: "A short-term Amazon Bedrock API key is generated from the session of an IAM principal, inherits its permissions, and is valid for at most 12 hours. AWS recommends short-term keys for production, and the token generator returns a cached token while it is still valid and a new one otherwise."
    fr: "Une clé d'API Amazon Bedrock à court terme est générée à partir de la session d'un principal IAM, en hérite les autorisations et est valide 12 heures au maximum. AWS recommande les clés à court terme pour la production, et le générateur de jetons renvoie un jeton en cache tant qu'il est valide et un nouveau sinon."
  options:
    a:
      en: "Long-term API keys are meant for exploration only, and a key baked into an image is a long-lived credential that is easy to leak."
      fr: "Les clés d'API à long terme sont réservées à l'exploration, et une clé intégrée à une image est une information d'identification de longue durée facile à divulguer."
    b:
      en: "Access keys sign requests with Signature Version 4; they are not bearer tokens, and long-term IAM user keys are less secure than the role's temporary credentials."
      fr: "Les clés d'accès signent les requêtes avec Signature Version 4 ; ce ne sont pas des jetons porteurs, et des clés à long terme d'utilisateur IAM sont moins sûres que les informations d'identification temporaires du rôle."
    d:
      en: "Storing the key in Secrets Manager protects it at rest, but it is still a long-term key that AWS does not recommend for production."
      fr: "Stocker la clé dans Secrets Manager la protège au repos, mais cela reste une clé à long terme qu'AWS ne recommande pas pour la production."
references:
  - title: API keys
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/api-keys.html
