id: dvac03-2b-permissions-replaced
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer's IAM user has permission to read the Amazon S3 bucket dev-artifacts. The developer uses the AWS CLI to assume the role ProdReadOnly, whose only policy allows reading the production buckets. While using the role's credentials, the command aws s3 ls s3://dev-artifacts fails with an AccessDenied error, although the same command worked with the user's credentials. The bucket policy of dev-artifacts grants nothing to ProdReadOnly.

    What is the cause of the error?
  fr: |
    L'utilisateur IAM d'un développeur est autorisé à lire le compartiment Amazon S3 dev-artifacts. Le développeur utilise l'AWS CLI pour assumer le rôle ProdReadOnly, dont la seule politique autorise la lecture des compartiments de production. Avec les informations d'identification du rôle, la commande aws s3 ls s3://dev-artifacts échoue avec une erreur AccessDenied, alors que la même commande fonctionnait avec les informations d'identification de l'utilisateur. La politique de compartiment de dev-artifacts n'accorde rien à ProdReadOnly.

    Quelle est la cause de l'erreur ?
body:
  options:
    - id: a
      text: { en: "Temporary credentials from AWS STS cannot call Amazon S3 list operations.", fr: "Les informations d'identification temporaires d'AWS STS ne peuvent pas appeler les opérations de liste d'Amazon S3." }
    - id: b
      text: { en: "A role session keeps the permissions of the IAM user only when the user signed in with MFA.", fr: "Une session de rôle ne conserve les autorisations de l'utilisateur IAM que si l'utilisateur s'est connecté avec la MFA." }
    - id: c
      text: { en: "While the developer uses the role's credentials, only the permissions of the role apply, not those of the IAM user.", fr: "Pendant que le développeur utilise les informations d'identification du rôle, seules les autorisations du rôle s'appliquent, et non celles de l'utilisateur IAM." }
    - id: d
      text: { en: "The AWS CLI cache still holds the user's credentials, and Amazon S3 rejects requests that mix two identities.", fr: "Le cache de l'AWS CLI contient encore les informations d'identification de l'utilisateur, et Amazon S3 rejette les requêtes qui mélangent deux identités." }
answer: { optionId: c }
explanation:
  correct:
    en: "When a principal assumes a role, it temporarily gives up its original permissions and takes on only the permissions of the role. ProdReadOnly does not allow listing dev-artifacts and the bucket policy grants nothing to the role, so the request is denied; the developer must use the user's own credentials again to read that bucket."
    fr: "Lorsqu'un principal assume un rôle, il renonce temporairement à ses autorisations d'origine et ne dispose que de celles du rôle. ProdReadOnly n'autorise pas la liste de dev-artifacts et la politique de compartiment n'accorde rien au rôle : la requête est refusée, et le développeur doit revenir à ses propres informations d'identification pour lire ce compartiment."
  options:
    a:
      en: "Temporary credentials can call any operation that the role's policies allow, including S3 list operations."
      fr: "Les informations d'identification temporaires peuvent appeler toute opération autorisée par les politiques du rôle, y compris les opérations de liste S3."
    b:
      en: "MFA can be required to assume a role, but it never merges the user's permissions into the role session."
      fr: "La MFA peut être exigée pour assumer un rôle, mais elle ne fusionne jamais les autorisations de l'utilisateur dans la session de rôle."
    d:
      en: "The CLI cache stores the role's temporary credentials, and each request is signed with a single set of credentials."
      fr: "Le cache de la CLI stocke les informations d'identification temporaires du rôle, et chaque requête est signée avec un seul jeu d'informations d'identification."
references:
  - title: Cross account resource access in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_compare-resource-policies.html
