id: dvac03-2a-github-oidc-sub
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys an application from the GitHub repository anycompany/orders-api with GitHub Actions. A developer created an IAM OIDC identity provider for token.actions.githubusercontent.com and is writing the trust policy of the deployment role:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Federated": "arn:aws:iam::111122223333:oidc-provider/token.actions.githubusercontent.com"
          },
          "Action": "sts:AssumeRoleWithWebIdentity",
          "Condition": {
            "StringEquals": {
              "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
            }
          }
        }
      ]
    }
    ```

    Only workflows that run on the main branch of this repository must be able to assume the role.

    Which change should the developer make to the StringEquals block?
  fr: |
    Une entreprise déploie une application depuis le dépôt GitHub anycompany/orders-api avec GitHub Actions. Un développeur a créé un fournisseur d'identité OIDC IAM pour token.actions.githubusercontent.com et rédige la politique d'approbation (trust policy) du rôle de déploiement :

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Federated": "arn:aws:iam::111122223333:oidc-provider/token.actions.githubusercontent.com"
          },
          "Action": "sts:AssumeRoleWithWebIdentity",
          "Condition": {
            "StringEquals": {
              "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
            }
          }
        }
      ]
    }
    ```

    Seuls les workflows exécutés sur la branche main de ce dépôt doivent pouvoir assumer le rôle.

    Quelle modification le développeur doit-il apporter au bloc StringEquals ?
body:
  options:
    - { id: a, text: { en: "Set `token.actions.githubusercontent.com:aud` to `anycompany/orders-api` instead of `sts.amazonaws.com`.", fr: "Définir `token.actions.githubusercontent.com:aud` sur `anycompany/orders-api` au lieu de `sts.amazonaws.com`." } }
    - { id: b, text: { en: "Add `token.actions.githubusercontent.com:sub` with the value `repo:anycompany/orders-api:ref:refs/heads/main`.", fr: "Ajouter `token.actions.githubusercontent.com:sub` avec la valeur `repo:anycompany/orders-api:ref:refs/heads/main`." } }
    - { id: c, text: { en: "Add `aws:PrincipalTag/repository` with the value `anycompany/orders-api` and the branch name.", fr: "Ajouter `aws:PrincipalTag/repository` avec la valeur `anycompany/orders-api` et le nom de la branche." } }
    - { id: d, text: { en: "Add `token.actions.githubusercontent.com:sub` with the value `repo:anycompany/orders-api:*`.", fr: "Ajouter `token.actions.githubusercontent.com:sub` avec la valeur `repo:anycompany/orders-api:*`." } }
answer: { optionId: b }
explanation:
  correct:
    en: "GitHub puts the repository and the branch in the sub claim of its OIDC token, in the form repo:org/repo:ref:refs/heads/branch. A StringEquals condition on that exact value limits the role to main-branch workflows of the repository, and IAM requires a sub condition in trust policies for the GitHub provider."
    fr: "GitHub place le dépôt et la branche dans la revendication sub de son jeton OIDC, sous la forme repo:org/repo:ref:refs/heads/branche. Une condition StringEquals sur cette valeur exacte limite le rôle aux workflows de la branche main du dépôt, et IAM exige une condition sub dans les politiques d'approbation du fournisseur GitHub."
  options:
    a:
      en: "The audience of GitHub tokens for AWS is sts.amazonaws.com. Changing it makes every token fail the condition and does not identify a branch."
      fr: "L'audience des jetons GitHub destinés à AWS est sts.amazonaws.com. La modifier fait échouer tous les jetons et n'identifie aucune branche."
    c:
      en: "Principal tags come from session tags of the role session; the repository and branch are carried by the sub claim, not by a principal tag."
      fr: "Les balises de principal proviennent des balises de session du rôle ; le dépôt et la branche sont portés par la revendication sub, pas par une balise de principal."
    d:
      en: "With StringEquals the asterisk is not a wildcard, so no token matches; with StringLike the value would allow every branch of the repository."
      fr: "Avec StringEquals, l'astérisque n'est pas un caractère générique : aucun jeton ne correspond ; avec StringLike, la valeur autoriserait toutes les branches du dépôt."
references:
  - title: Create a role for OpenID Connect federation (console)
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
  - title: OIDC federation
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html
