id: dvac03-2d-guardrail-trace-logs
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Lambda function calls the Converse API with trace enabled and a guardrail that masks names and email addresses in responses. For troubleshooting, the function writes the full Converse response to its CloudWatch Logs log group. Placeholders such as {NAME} appear in the output text, but security finds the original names and email addresses in the log group. Security requires that these values are never written to CloudWatch Logs. The application uses only the output message and the guardrail action.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    Une fonction Lambda appelle l'API Converse avec trace activé et une barrière de protection (guardrail) qui masque les noms et adresses e-mail dans les réponses. Pour le dépannage, la fonction écrit la réponse Converse complète dans son groupe de journaux CloudWatch Logs. Des espaces réservés comme {NAME} apparaissent dans le texte de sortie, mais l'équipe de sécurité trouve les noms et adresses e-mail d'origine dans le groupe de journaux. La sécurité exige que ces valeurs ne soient jamais écrites dans CloudWatch Logs. L'application n'utilise que le message de sortie et l'action de la barrière de protection.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: { en: "Change the filter action to BLOCK so that the response contains the configured blocked message instead of the masked text.", fr: "Changer l'action du filtre en BLOCK afin que la réponse contienne le message de blocage configuré au lieu du texte masqué." } }
    - { id: b, text: { en: "Log only the output message and the guardrail action instead of the full response, because the trace holds the original values.", fr: "Ne journaliser que le message de sortie et l'action de la barrière de protection au lieu de la réponse complète, car la trace contient les valeurs d'origine." } }
    - { id: c, text: { en: "Set outputScope to FULL so that the guardrail returns masked values in every field of the Converse response.", fr: "Définir outputScope sur FULL afin que la barrière de protection renvoie des valeurs masquées dans tous les champs de la réponse Converse." } }
    - { id: d, text: { en: "Attach a data protection policy to the log group with managed data identifiers for names and email addresses.", fr: "Attacher au groupe de journaux une politique de protection des données avec des identifiants de données gérés pour les noms et les adresses e-mail." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The guardrail trace contains the unmasked values: the match field of a PII entity filter holds the original value, not the masked output. Logging only the output message and the action, which the application already reads, keeps the original values out of CloudWatch Logs with a small code change."
    fr: "La trace de la barrière de protection contient les valeurs non masquées : le champ match d'un filtre d'entités PII contient la valeur d'origine, pas la sortie masquée. Ne journaliser que le message de sortie et l'action, que l'application lit déjà, tient les valeurs d'origine hors de CloudWatch Logs avec une petite modification du code."
  options:
    a:
      en: "Blocking changes the application's behavior, and the trace written to the logs would still contain the detected values."
      fr: "Le blocage change le comportement de l'application, et la trace écrite dans les journaux contiendrait toujours les valeurs détectées."
    c:
      en: "outputScope set to FULL asks for more detail, including entries that were not detected, for debugging; it does not mask the original values in the trace."
      fr: "outputScope défini sur FULL demande plus de détails, y compris les entrées non détectées, pour le débogage ; il ne masque pas les valeurs d'origine dans la trace."
    d:
      en: "A data protection policy masks the values when they are read, but they are still stored in the log group and can be unmasked, which breaks the requirement."
      fr: "Une politique de protection des données masque les valeurs à la lecture, mais elles restent stockées dans le groupe de journaux et peuvent être démasquées, ce qui enfreint l'exigence."
references:
  - title: Remove PII from conversations by using sensitive information filters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
  - title: Include a guardrail with the Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
