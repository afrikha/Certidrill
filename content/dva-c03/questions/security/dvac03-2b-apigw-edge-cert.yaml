id: dvac03-2b-apigw-edge-cert
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer creates an edge-optimized custom domain name, api.example.com, for an Amazon API Gateway REST API that is deployed in the eu-central-1 Region. An issued certificate from AWS Certificate Manager (ACM) in eu-central-1 covers api.example.com, but API Gateway does not offer it when the developer configures the custom domain name. The API must keep its edge-optimized endpoint.

    Which solution will meet these requirements?
  fr: |
    Un développeur crée un nom de domaine personnalisé optimisé pour la périphérie (edge-optimized), api.example.com, pour une API REST Amazon API Gateway déployée dans la Région eu-central-1. Un certificat émis par AWS Certificate Manager (ACM) en eu-central-1 couvre api.example.com, mais API Gateway ne le propose pas lorsque le développeur configure le nom de domaine personnalisé. L'API doit conserver son point de terminaison optimisé pour la périphérie.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the custom domain name to the Regional endpoint type, and select the eu-central-1 certificate.", fr: "Passer le nom de domaine personnalisé au type de point de terminaison Regional, et sélectionner le certificat d'eu-central-1." }
    - id: b
      text: { en: "Request a wildcard certificate for *.example.com in ACM in eu-central-1, and select it instead.", fr: "Demander un certificat générique pour *.example.com dans ACM en eu-central-1, et le sélectionner à la place." }
    - id: c
      text: { en: "Create an Amazon CloudFront distribution in front of the API, and attach the eu-central-1 certificate to the distribution.", fr: "Créer une distribution Amazon CloudFront devant l'API, et attacher le certificat d'eu-central-1 à la distribution." }
    - id: d
      text: { en: "Request or import a certificate for api.example.com in ACM in us-east-1, and select it for the custom domain name.", fr: "Demander ou importer un certificat pour api.example.com dans ACM en us-east-1, et le sélectionner pour le nom de domaine personnalisé." }
answer: { optionId: d }
explanation:
  correct:
    en: "An edge-optimized custom domain name uses CloudFront, so its ACM certificate must be requested or imported in the US East (N. Virginia) Region, whatever the Region of the API. A Regional custom domain name would instead use a certificate in the API's Region."
    fr: "Un nom de domaine personnalisé optimisé pour la périphérie utilise CloudFront : son certificat ACM doit donc être demandé ou importé dans la Région USA Est (Virginie du Nord), quelle que soit la Région de l'API. Un nom de domaine personnalisé Regional utiliserait au contraire un certificat de la Région de l'API."
  options:
    a:
      en: "A Regional custom domain name would accept the eu-central-1 certificate, but the API must keep its edge-optimized endpoint."
      fr: "Un nom de domaine personnalisé Regional accepterait le certificat d'eu-central-1, mais l'API doit conserver son point de terminaison optimisé pour la périphérie."
    b:
      en: "A wildcard certificate in eu-central-1 is still in the wrong Region for an edge-optimized domain name."
      fr: "Un certificat générique en eu-central-1 reste dans la mauvaise Région pour un nom de domaine optimisé pour la périphérie."
    c:
      en: "CloudFront also requires its certificate in us-east-1, and a separate distribution replaces the edge-optimized endpoint instead of keeping it."
      fr: "CloudFront exige lui aussi son certificat en us-east-1, et une distribution distincte remplace le point de terminaison optimisé pour la périphérie au lieu de le conserver."
references:
  - title: Get certificates ready in AWS Certificate Manager
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-custom-domains-prerequisites.html
