id: dvac03-2b-sns-sqs-queue-policy
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer subscribes an unencrypted Amazon SQS standard queue to an Amazon SNS topic in the same account by using the AWS CLI. Messages that are published to the topic never arrive in the queue. The queue has no access policy statements. The company wants only this topic to be able to deliver messages to the queue.

    Which solution will meet these requirements?
  fr: |
    Un développeur abonne une file d'attente standard Amazon SQS non chiffrée à une rubrique Amazon SNS du même compte à l'aide de l'AWS CLI. Les messages publiés dans la rubrique n'arrivent jamais dans la file d'attente. La file d'attente ne possède aucune instruction de politique d'accès. L'entreprise veut que seule cette rubrique puisse remettre des messages dans la file d'attente.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach a policy that allows sns:Publish on the topic to the IAM role of the application that publishes messages.", fr: "Attacher une politique qui autorise sns:Publish sur la rubrique au rôle IAM de l'application qui publie les messages." }
    - id: b
      text: { en: "Add a queue policy that allows sqs:ReceiveMessage to sns.amazonaws.com with an aws:SourceArn condition set to the topic ARN.", fr: "Ajouter une politique de file d'attente qui autorise sqs:ReceiveMessage pour sns.amazonaws.com avec une condition aws:SourceArn définie sur l'ARN de la rubrique." }
    - id: c
      text: { en: "Add a topic access policy that allows sqs:SendMessage to sqs.amazonaws.com with an aws:SourceArn condition set to the queue ARN.", fr: "Ajouter une politique d'accès de rubrique qui autorise sqs:SendMessage pour sqs.amazonaws.com avec une condition aws:SourceArn définie sur l'ARN de la file d'attente." }
    - id: d
      text: { en: "Add a queue policy that allows sqs:SendMessage to sns.amazonaws.com with an aws:SourceArn condition set to the topic ARN.", fr: "Ajouter une politique de file d'attente qui autorise sqs:SendMessage pour sns.amazonaws.com avec une condition aws:SourceArn définie sur l'ARN de la rubrique." }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon SNS delivers to the queue as the sns.amazonaws.com service principal, so the queue's resource-based policy must allow sqs:SendMessage for that principal. The aws:SourceArn condition limits the permission to this topic and protects against the confused deputy problem."
    fr: "Amazon SNS remet les messages dans la file d'attente en tant que principal de service sns.amazonaws.com : la politique basée sur les ressources de la file d'attente doit donc autoriser sqs:SendMessage pour ce principal. La condition aws:SourceArn limite l'autorisation à cette rubrique et protège contre le problème de l'adjoint confus."
  options:
    a:
      en: "The publisher can already publish to the topic; the failure is between SNS and SQS, which an identity-based policy of the publisher does not control."
      fr: "L'éditeur peut déjà publier dans la rubrique ; l'échec se situe entre SNS et SQS, ce que ne contrôle pas une politique basée sur l'identité de l'éditeur."
    b:
      en: "SNS needs to send messages to the queue, not receive them, so sqs:ReceiveMessage does not allow delivery."
      fr: "SNS doit envoyer des messages dans la file d'attente et non les recevoir : sqs:ReceiveMessage ne permet pas la remise."
    c:
      en: "The permission to write to a queue must be granted on the queue; a topic policy controls who can use the topic."
      fr: "L'autorisation d'écrire dans une file d'attente doit être accordée sur la file d'attente ; une politique de rubrique contrôle qui peut utiliser la rubrique."
references:
  - title: Subscribing an Amazon SQS queue to an Amazon SNS topic
    url: https://docs.aws.amazon.com/sns/latest/dg/subscribe-sqs-queue-to-sns-topic.html
