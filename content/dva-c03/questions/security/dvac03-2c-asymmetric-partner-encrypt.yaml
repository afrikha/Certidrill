id: dvac03-2c-asymmetric-partner-encrypt
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A partner company that has no AWS account must send AnyCompany short sensitive values of less than 150 bytes each. The partner must encrypt each value before sending it, and only AnyCompany's application on AWS must be able to decrypt the values. The private key material must never leave AWS KMS, and the partner must not receive any AWS credentials.

    Which solution will meet these requirements?
  fr: |
    Une entreprise partenaire qui n'a pas de compte AWS doit envoyer à AnyCompany de courtes valeurs sensibles de moins de 150 octets chacune. Le partenaire doit chiffrer chaque valeur avant de l'envoyer, et seule l'application d'AnyCompany sur AWS doit pouvoir déchiffrer les valeurs. Le matériel de clé privée ne doit jamais quitter AWS KMS, et le partenaire ne doit recevoir aucune information d'identification AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a symmetric KMS key, create an IAM user for the partner with kms:Encrypt on the key, and give the partner its access keys.", fr: "Créer une clé KMS symétrique, créer pour le partenaire un utilisateur IAM avec kms:Encrypt sur la clé, et lui remettre ses clés d'accès." }
    - id: b
      text: { en: "Create an RSA KMS key with key usage ENCRYPT_DECRYPT, give the partner the key from GetPublicKey, and call Decrypt with RSAES_OAEP_SHA_256.", fr: "Créer une clé KMS RSA avec l'utilisation de clé ENCRYPT_DECRYPT, remettre au partenaire la clé obtenue par GetPublicKey, et appeler Decrypt avec RSAES_OAEP_SHA_256." }
    - id: c
      text: { en: "Create an RSA KMS key with key usage SIGN_VERIFY, give the partner the key from GetPublicKey, and call Verify on each value received.", fr: "Créer une clé KMS RSA avec l'utilisation de clé SIGN_VERIFY, remettre au partenaire la clé obtenue par GetPublicKey, et appeler Verify sur chaque valeur reçue." }
    - id: d
      text: { en: "Call GenerateDataKeyPair with an RSA_2048 spec, send the plaintext private key to the partner, and keep the public key in the application.", fr: "Appeler GenerateDataKeyPair avec la spécification RSA_2048, envoyer la clé privée en texte clair au partenaire, et garder la clé publique dans l'application." }
answer: { optionId: b }
explanation:
  correct:
    en: "The public key of an asymmetric KMS key can be downloaded with GetPublicKey and used outside AWS by anyone, without AWS credentials, to encrypt data. Only principals allowed to call Decrypt on the KMS key can decrypt; for an asymmetric key the request must specify KeyId and the same EncryptionAlgorithm. An RSA_2048 key with RSAES_OAEP_SHA_256 accepts up to 190 bytes, enough for these values."
    fr: "La clé publique d'une clé KMS asymétrique peut être téléchargée avec GetPublicKey et utilisée hors d'AWS par n'importe qui, sans information d'identification AWS, pour chiffrer des données. Seuls les principaux autorisés à appeler Decrypt sur la clé KMS peuvent déchiffrer ; pour une clé asymétrique, la requête doit indiquer KeyId et le même EncryptionAlgorithm. Une clé RSA_2048 avec RSAES_OAEP_SHA_256 accepte jusqu'à 190 octets, assez pour ces valeurs."
  options:
    a:
      en: "This gives the partner long-term AWS credentials, which the requirements forbid."
      fr: "Cette solution remet au partenaire des informations d'identification AWS à long terme, ce que les exigences interdisent."
    c:
      en: "A SIGN_VERIFY key signs and verifies data; it cannot encrypt or decrypt, so the values would not be confidential."
      fr: "Une clé SIGN_VERIFY signe et vérifie des données ; elle ne peut ni chiffrer ni déchiffrer : les valeurs ne seraient pas confidentielles."
    d:
      en: "The private key would leave AWS KMS in plaintext, and the partner, not AnyCompany, could decrypt."
      fr: "La clé privée quitterait AWS KMS en texte clair, et c'est le partenaire, et non AnyCompany, qui pourrait déchiffrer."
references:
  - title: Download public key
    url: https://docs.aws.amazon.com/kms/latest/developerguide/download-public-key.html
  - title: Decrypt
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_Decrypt.html
