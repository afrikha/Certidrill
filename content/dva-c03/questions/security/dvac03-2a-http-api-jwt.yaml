id: dvac03-2a-http-api-jwt
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is building an Amazon API Gateway HTTP API. Callers authenticate with a third-party OAuth 2.0 provider that issues RSA-signed JWT access tokens and publishes its signing keys at a jwks_uri. Each route must accept only tokens from that issuer that contain a route-specific scope.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise développe une API HTTP Amazon API Gateway. Les appelants s'authentifient auprès d'un fournisseur OAuth 2.0 tiers qui émet des jetons d'accès JWT signés par RSA et publie ses clés de signature à un jwks_uri. Chaque route ne doit accepter que les jetons de cet émetteur qui contiennent une portée propre à la route.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create a JWT authorizer with the provider's issuer URL and audience, and set authorization scopes on each route.", fr: "Créer un mécanisme d'autorisation JWT avec l'URL de l'émetteur et l'audience du fournisseur, et définir des portées d'autorisation sur chaque route." } }
    - { id: b, text: { en: "Create a Lambda authorizer that downloads the provider's keys, validates each token, and checks the scope.", fr: "Créer un mécanisme d'autorisation Lambda qui télécharge les clés du fournisseur, valide chaque jeton et vérifie la portée." } }
    - { id: c, text: { en: "Add the provider to an Amazon Cognito user pool as an OIDC identity provider, and validate user pool tokens.", fr: "Ajouter le fournisseur à un groupe d'utilisateurs Amazon Cognito comme fournisseur d'identité OIDC et valider les jetons du groupe." } }
    - { id: d, text: { en: "Set the routes to IAM authorization, and have callers exchange each token with AssumeRoleWithWebIdentity.", fr: "Définir les routes en autorisation IAM et faire échanger chaque jeton par les appelants avec AssumeRoleWithWebIdentity." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A JWT authorizer verifies the token signature with the keys of the issuer's jwks_uri and checks iss, aud or client_id, exp, nbf and iat. When a route has authorization scopes, the token's scope or scp claim must contain one of them. No code is needed."
    fr: "Un mécanisme d'autorisation JWT vérifie la signature du jeton avec les clés du jwks_uri de l'émetteur et contrôle iss, aud ou client_id, exp, nbf et iat. Quand une route a des portées d'autorisation, la revendication scope ou scp du jeton doit en contenir une. Aucun code n'est nécessaire."
  options:
    b:
      en: "A Lambda authorizer works, but the team must write and maintain the validation code and the key caching."
      fr: "Un mécanisme d'autorisation Lambda fonctionne, mais l'équipe doit écrire et maintenir le code de validation et la mise en cache des clés."
    c:
      en: "Federating the provider into a user pool changes the tokens that callers receive and adds a user pool to operate, while the provider's tokens can be validated directly."
      fr: "Fédérer le fournisseur dans un groupe d'utilisateurs change les jetons que reçoivent les appelants et ajoute un groupe à exploiter, alors que les jetons du fournisseur peuvent être validés directement."
    d:
      en: "Callers would have to obtain AWS credentials and sign every request with SigV4, and the route scopes of the token would no longer be checked."
      fr: "Les appelants devraient obtenir des informations d'identification AWS et signer chaque demande avec SigV4, et les portées du jeton ne seraient plus vérifiées."
references:
  - title: Control access to HTTP APIs with JWT authorizers in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-jwt-authorizer.html
