id: dvac03-2b-sse-c-new-bucket
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany keeps its encryption keys in an on-premises HSM, and a policy forbids storing those keys in AWS. The company wants Amazon S3 to perform the encryption so that applications do not need a client-side encryption library. In November 2026, a developer creates a new general purpose bucket and uploads objects over HTTPS with SSE-C headers. Every upload fails with HTTP 403 AccessDenied, although the application role allows s3:PutObject on the bucket.

    Which solution will meet these requirements?
  fr: |
    AnyCompany conserve ses clés de chiffrement dans un HSM sur site, et une politique interdit de stocker ces clés dans AWS. L'entreprise veut qu'Amazon S3 effectue le chiffrement pour que les applications n'aient pas besoin d'une bibliothèque de chiffrement côté client. En novembre 2026, un développeur crée un nouveau compartiment à usage général et charge des objets en HTTPS avec des en-têtes SSE-C. Chaque chargement échoue avec l'erreur HTTP 403 AccessDenied, bien que le rôle de l'application autorise s3:PutObject sur le compartiment.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Send the SSE-C requests over HTTP instead of HTTPS so that Amazon S3 can read the customer key headers.", fr: "Envoyer les requêtes SSE-C en HTTP au lieu de HTTPS pour qu'Amazon S3 puisse lire les en-têtes de clé client." }
    - id: b
      text: { en: "Import the HSM key material into an AWS KMS key, and upload the objects with SSE-KMS and that key.", fr: "Importer le matériel de clé du HSM dans une clé AWS KMS, puis charger les objets avec SSE-KMS et cette clé." }
    - id: c
      text: { en: "Add s3:PutEncryptionConfiguration to the policy of the application role, and retry the uploads.", fr: "Ajouter s3:PutEncryptionConfiguration à la politique du rôle de l'application, puis relancer les chargements." }
    - id: d
      text: { en: "Call PutBucketEncryption on the bucket with BlockedEncryptionTypes set to NONE, and retry the uploads.", fr: "Appeler PutBucketEncryption sur le compartiment avec BlockedEncryptionTypes défini sur NONE, puis relancer les chargements." }
answer: { optionId: d }
explanation:
  correct:
    en: "SSE-C lets Amazon S3 encrypt objects with a key that the customer sends in each request and that S3 never stores. Since April 2026, SSE-C is disabled by default for new general purpose buckets, and write requests that specify SSE-C are rejected with 403 AccessDenied. Unblocking it with PutBucketEncryption and BlockedEncryptionTypes set to NONE allows the uploads."
    fr: "SSE-C permet à Amazon S3 de chiffrer les objets avec une clé que le client envoie dans chaque requête et que S3 ne stocke jamais. Depuis avril 2026, SSE-C est désactivé par défaut pour les nouveaux compartiments à usage général, et les requêtes d'écriture qui spécifient SSE-C sont rejetées avec l'erreur 403 AccessDenied. Le débloquer avec PutBucketEncryption et BlockedEncryptionTypes défini sur NONE autorise les chargements."
  options:
    a:
      en: "Amazon S3 rejects SSE-C requests sent over HTTP, and a key sent over HTTP must be treated as compromised."
      fr: "Amazon S3 rejette les requêtes SSE-C envoyées en HTTP, et une clé envoyée en HTTP doit être considérée comme compromise."
    b:
      en: "Imported key material is stored in AWS KMS, which breaks the policy that forbids storing the keys in AWS."
      fr: "Le matériel de clé importé est stocké dans AWS KMS, ce qui enfreint la politique qui interdit de stocker les clés dans AWS."
    c:
      en: "s3:PutEncryptionConfiguration only lets a principal change the bucket's encryption configuration; adding it without making that change leaves SSE-C blocked."
      fr: "s3:PutEncryptionConfiguration permet seulement à un principal de modifier la configuration de chiffrement du compartiment ; l'ajouter sans effectuer cette modification laisse SSE-C bloqué."
references:
  - title: Blocking or unblocking SSE-C for a general purpose bucket
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/blocking-unblocking-s3-c-encryption-gpb.html
  - title: Using server-side encryption with customer-provided keys (SSE-C)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/ServerSideEncryptionCustomerKeys.html
