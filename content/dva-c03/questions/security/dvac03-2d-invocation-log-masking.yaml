id: dvac03-2d-invocation-log-masking
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company enabled Amazon Bedrock model invocation logging to a CloudWatch Logs log group. The application's guardrail masks email addresses and phone numbers with the ANONYMIZE action. An audit finds unmasked email addresses and phone numbers in the input field of the log events. Developers need the logs for troubleshooting but must not see these values.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a activé la journalisation des invocations de modèles Amazon Bedrock vers un groupe de journaux CloudWatch Logs. La barrière de protection (guardrail) de l'application masque les adresses e-mail et les numéros de téléphone avec l'action ANONYMIZE. Un audit trouve des adresses e-mail et des numéros de téléphone non masqués dans le champ input des événements du journal. Les développeurs ont besoin des journaux pour le dépannage, mais ne doivent pas voir ces valeurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the sensitive information filter action for prompts from ANONYMIZE to BLOCK so that the values are no longer logged.", fr: "Changer l'action du filtre d'informations sensibles pour les invites de ANONYMIZE à BLOCK afin que les valeurs ne soient plus journalisées." } }
    - { id: b, text: { en: "Associate a customer managed AWS KMS key with the log group so that the logged values are encrypted at rest.", fr: "Associer une clé AWS KMS gérée par le client au groupe de journaux afin que les valeurs journalisées soient chiffrées au repos." } }
    - { id: c, text: { en: "Enable trace in the guardrail configuration so that the log events record the masked version of each request.", fr: "Activer trace dans la configuration de la barrière de protection afin que les événements du journal enregistrent la version masquée de chaque requête." } }
    - { id: d, text: { en: "Attach a data protection policy to the log group with managed data identifiers for email addresses and phone numbers.", fr: "Attacher au groupe de journaux une politique de protection des données avec des identifiants de données gérés pour les adresses e-mail et les numéros de téléphone." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Guardrail masking does not apply to model invocation logs: the input field always contains the original request, and AWS recommends CloudWatch Logs data protection to protect it. A data protection policy masks the matching data at every egress point, and only principals with logs:Unmask can see the original values."
    fr: "Le masquage de la barrière de protection ne s'applique pas aux journaux d'invocation des modèles : le champ input contient toujours la requête d'origine, et AWS recommande la protection des données de CloudWatch Logs pour le protéger. Une politique de protection des données masque les données correspondantes à chaque point de sortie, et seuls les principaux disposant de logs:Unmask voient les valeurs d'origine."
  options:
    a:
      en: "Invocation logs record the original request whatever the guardrail does, so blocking still leaves the values in the input field and also breaks the application."
      fr: "Les journaux d'invocation enregistrent la requête d'origine quoi que fasse la barrière de protection : le blocage laisse les valeurs dans le champ input et casse en plus l'application."
    b:
      en: "KMS encryption protects the data at rest, but developers who can read the log group still see the decrypted values."
      fr: "Le chiffrement KMS protège les données au repos, mais les développeurs qui peuvent lire le groupe de journaux voient toujours les valeurs déchiffrées."
    c:
      en: "The trace contains the original matched PII values, so it does not mask anything in the logs."
      fr: "La trace contient les valeurs PII d'origine détectées : elle ne masque rien dans les journaux."
references:
  - title: Remove PII from conversations by using sensitive information filters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
  - title: Help protect sensitive log data with masking
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
