id: dvac03-2d-agentcore-session
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company hosts a chat agent on Amazon Bedrock AgentCore Runtime for thousands of users. Each conversation must run isolated from the others so that one user's context, memory, and files are never visible to another user. The developer wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise héberge un agent conversationnel sur Amazon Bedrock AgentCore Runtime pour des milliers d'utilisateurs. Chaque conversation doit s'exécuter isolée des autres, afin que le contexte, la mémoire et les fichiers d'un utilisateur ne soient jamais visibles par un autre utilisateur. Le développeur veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send the same runtimeSessionId for all users so that their requests reuse a warm microVM and avoid cold starts.", fr: "Envoyer le même runtimeSessionId pour tous les utilisateurs afin que leurs requêtes réutilisent une microVM déjà démarrée et évitent les démarrages à froid." } }
    - { id: b, text: { en: "Deploy a separate agent runtime for each user, and route each user's requests to the ARN of that user's runtime.", fr: "Déployer un environnement d'exécution d'agent distinct pour chaque utilisateur, et acheminer les requêtes de chacun vers l'ARN de son environnement." } }
    - { id: c, text: { en: "Generate a unique runtimeSessionId for each user conversation, map it to the user in the backend, and send it on every call.", fr: "Générer un runtimeSessionId unique pour chaque conversation utilisateur, l'associer à l'utilisateur dans le backend et l'envoyer à chaque appel." } }
    - { id: d, text: { en: "Configure session storage with a mount path so that each user's files persist after the session stops.", fr: "Configurer le stockage de session avec un chemin de montage afin que les fichiers de chaque utilisateur persistent après l'arrêt de la session." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AgentCore Runtime gives each session its own microVM with isolated compute, memory, and filesystem, and sanitizes the memory when the session ends. AgentCore does not map sessions to users, so the backend must use a different session ID for each user or conversation and keep that mapping."
    fr: "AgentCore Runtime attribue à chaque session sa propre microVM avec un calcul, une mémoire et un système de fichiers isolés, et nettoie la mémoire à la fin de la session. AgentCore n'associe pas les sessions aux utilisateurs : le backend doit utiliser un ID de session différent pour chaque utilisateur ou conversation et conserver cette association."
  options:
    a:
      en: "A shared session ID puts every user in the same session and microVM, so context and files would be shared between users."
      fr: "Un ID de session partagé place tous les utilisateurs dans la même session et la même microVM : le contexte et les fichiers seraient partagés entre utilisateurs."
    b:
      en: "Separate runtimes also isolate users, but managing thousands of runtimes adds far more operational overhead than session IDs."
      fr: "Des environnements distincts isolent aussi les utilisateurs, mais gérer des milliers d'environnements ajoute bien plus de charge opérationnelle que des ID de session."
    d:
      en: "Session storage keeps files across stop and resume of a session; it does not isolate users from each other."
      fr: "Le stockage de session conserve les fichiers entre l'arrêt et la reprise d'une session ; il n'isole pas les utilisateurs les uns des autres."
references:
  - title: Use isolated sessions for agents
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
