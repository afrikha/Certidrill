id: dvac03-2a-cli-sso-two-accounts
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer uses IAM Identity Center to access a development account and a production account from the AWS CLI. The developer wants to sign in once in the browser and then run commands in either account by choosing a profile. The CLI tokens must refresh automatically.

    Which configuration will meet these requirements?
  fr: |
    Un développeur utilise IAM Identity Center pour accéder à un compte de développement et à un compte de production depuis l'AWS CLI. Il veut se connecter une seule fois dans le navigateur, puis exécuter des commandes dans l'un ou l'autre compte en choisissant un profil. Les jetons de la CLI doivent s'actualiser automatiquement.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create one profile, and run aws configure sso again each time the developer switches accounts.", fr: "Créer un seul profil et exécuter de nouveau aws configure sso chaque fois que le développeur change de compte." } }
    - { id: b, text: { en: "Create two profiles that each contain sso_start_url and sso_region without an sso-session section.", fr: "Créer deux profils qui contiennent chacun sso_start_url et sso_region sans section sso-session." } }
    - { id: c, text: { en: "Create an IAM user in each account, and store both access key pairs as two profiles in the credentials file.", fr: "Créer un utilisateur IAM dans chaque compte et stocker les deux paires de clés d'accès comme deux profils du fichier credentials." } }
    - { id: d, text: { en: "Create two profiles that reference the same sso-session section, each with its own sso_account_id and sso_role_name.", fr: "Créer deux profils qui référencent la même section sso-session, chacun avec ses propres sso_account_id et sso_role_name." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Several profiles can reuse one sso-session section, each profile naming its account and role. One aws sso login for that session signs the developer in, and the CLI refreshes the token and the role credentials of both profiles automatically."
    fr: "Plusieurs profils peuvent réutiliser une même section sso-session, chacun désignant son compte et son rôle. Un seul aws sso login pour cette session connecte le développeur, et la CLI actualise automatiquement le jeton et les informations d'identification des deux profils."
  options:
    a:
      en: "Rerunning the wizard for every switch rewrites the profile and requires a new sign-in, which fails the sign-in-once requirement."
      fr: "Relancer l'assistant à chaque changement réécrit le profil et impose une nouvelle connexion, ce qui ne respecte pas l'exigence d'une connexion unique."
    b:
      en: "Profiles without an sso-session section use the legacy configuration, which does not refresh tokens automatically."
      fr: "Les profils sans section sso-session utilisent la configuration héritée, qui n'actualise pas les jetons automatiquement."
    c:
      en: "This replaces IAM Identity Center with long-term access keys of IAM users."
      fr: "Cela remplace IAM Identity Center par des clés d'accès à long terme d'utilisateurs IAM."
references:
  - title: Configuring IAM Identity Center authentication with the AWS CLI
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sso.html
