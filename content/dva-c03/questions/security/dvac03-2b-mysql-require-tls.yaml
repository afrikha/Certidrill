id: dvac03-2b-mysql-require-tls
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an Amazon RDS for MySQL 8.4 DB instance that uses a custom DB parameter group. Some client applications connect without TLS. The company must ensure that the DB instance rejects every unencrypted client connection for all database users, without changing each database user account.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une instance de base de données Amazon RDS for MySQL 8.4 qui utilise un groupe de paramètres de base de données personnalisé. Certaines applications clientes se connectent sans TLS. L'entreprise doit s'assurer que l'instance de base de données rejette toute connexion client non chiffrée pour tous les utilisateurs de la base de données, sans modifier chaque compte d'utilisateur de la base de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run ALTER USER with the REQUIRE SSL clause for each database user.", fr: "Exécuter ALTER USER avec la clause REQUIRE SSL pour chaque utilisateur de la base de données." }
    - id: b
      text: { en: "Turn on encryption at rest for the DB instance with a customer managed KMS key.", fr: "Activer le chiffrement au repos de l'instance de base de données avec une clé KMS gérée par le client." }
    - id: c
      text: { en: "Set the require_secure_transport parameter to 1 in the custom DB parameter group.", fr: "Définir le paramètre require_secure_transport sur 1 dans le groupe de paramètres de base de données personnalisé." }
    - id: d
      text: { en: "Change the security group of the DB instance to allow inbound traffic only on port 443.", fr: "Modifier le groupe de sécurité de l'instance de base de données pour n'autoriser le trafic entrant que sur le port 443." }
answer: { optionId: c }
explanation:
  correct:
    en: "For RDS for MySQL 8.4 and earlier, require_secure_transport defaults to 0 and allows unencrypted connections. Setting it to 1 in the DB parameter group makes the DB instance reject every connection that does not use SSL/TLS, for all users, and the parameter takes effect without a reboot."
    fr: "Pour RDS for MySQL 8.4 et versions antérieures, require_secure_transport vaut 0 par défaut et autorise les connexions non chiffrées. Le définir sur 1 dans le groupe de paramètres de base de données fait rejeter par l'instance toute connexion qui n'utilise pas SSL/TLS, pour tous les utilisateurs, et le paramètre prend effet sans redémarrage."
  options:
    a:
      en: "REQUIRE SSL enforces TLS user by user, which fails the requirement not to change each user account."
      fr: "REQUIRE SSL impose TLS utilisateur par utilisateur, ce qui ne respecte pas l'exigence de ne pas modifier chaque compte d'utilisateur."
    b:
      en: "Encryption at rest protects stored data and does not affect how clients connect."
      fr: "Le chiffrement au repos protège les données stockées et n'a aucun effet sur la façon dont les clients se connectent."
    d:
      en: "MySQL clients connect on the database port, and a security group filters ports, not whether the connection uses TLS."
      fr: "Les clients MySQL se connectent sur le port de la base de données, et un groupe de sécurité filtre des ports, et non l'utilisation de TLS par la connexion."
references:
  - title: Requiring SSL/TLS for all connections to a MySQL DB instance on Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/mysql-ssl-connections.require-ssl.html
