id: dvac03-2d-s3-log-protection
objective: "2.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company sends Amazon Bedrock model invocation logs to an Amazon S3 bucket. The logs contain customer prompts and model responses. The company requires that the log objects are encrypted with a customer managed AWS KMS key and that only the security team's IAM role can read their content.

    Which actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Une entreprise envoie les journaux d'invocation des modèles Amazon Bedrock vers un compartiment Amazon S3. Les journaux contiennent des invites de clients et des réponses de modèles. L'entreprise exige que les objets de journal soient chiffrés avec une clé AWS KMS gérée par le client et que seul le rôle IAM de l'équipe de sécurité puisse lire leur contenu.

    Quelles actions répondent à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure SSE-KMS with the key on the bucket, and allow bedrock.amazonaws.com to use kms:GenerateDataKey in the key policy.", fr: "Configurer SSE-KMS avec la clé sur le compartiment, et autoriser bedrock.amazonaws.com à utiliser kms:GenerateDataKey dans la politique de clé." } }
    - { id: b, text: { en: "Enable ACLs on the bucket, and grant READ on the log prefix only to the canonical user ID of the security team's account.", fr: "Activer les ACL sur le compartiment, et accorder READ sur le préfixe des journaux uniquement à l'ID d'utilisateur canonique du compte de l'équipe de sécurité." } }
    - { id: c, text: { en: "Allow kms:Decrypt on the key only for the security team's role, and allow s3:GetObject on the log prefix only for that role.", fr: "N'autoriser kms:Decrypt sur la clé que pour le rôle de l'équipe de sécurité, et n'autoriser s3:GetObject sur le préfixe des journaux que pour ce rôle." } }
    - { id: d, text: { en: "Deliver the logs to a bucket in a dedicated security account so that the application developers have no access to them.", fr: "Envoyer les journaux vers un compartiment d'un compte de sécurité dédié afin que les développeurs de l'application n'y aient pas accès." } }
    - { id: e, text: { en: "Deliver the logs to a bucket in another Region so that the log data is isolated from the application's Region.", fr: "Envoyer les journaux vers un compartiment d'une autre Région afin d'isoler les données de journal de la Région de l'application." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "For an SSE-KMS destination, the key policy must let the Amazon Bedrock service principal call kms:GenerateDataKey, scoped with aws:SourceAccount and aws:SourceArn, so that Amazon Bedrock can write encrypted objects. Reading an SSE-KMS object needs both s3:GetObject and kms:Decrypt, so granting them only to the security team's role limits who can read the logs."
    fr: "Pour une destination SSE-KMS, la politique de clé doit permettre au principal de service Amazon Bedrock d'appeler kms:GenerateDataKey, avec les conditions aws:SourceAccount et aws:SourceArn, afin qu'Amazon Bedrock puisse écrire des objets chiffrés. La lecture d'un objet SSE-KMS exige à la fois s3:GetObject et kms:Decrypt : les accorder uniquement au rôle de l'équipe de sécurité limite qui peut lire les journaux."
  options:
    b:
      en: "Model invocation logging requires the destination bucket to have ACLs disabled, and ACLs cannot target one IAM role."
      fr: "La journalisation des invocations de modèles exige que les ACL du compartiment de destination soient désactivées, et les ACL ne peuvent pas cibler un rôle IAM."
    d:
      en: "The destination bucket must be in the same account and Region as the logging configuration."
      fr: "Le compartiment de destination doit se trouver dans le même compte et la même Région que la configuration de journalisation."
    e:
      en: "The destination bucket must be in the same Region as the logging configuration, and a Region change does not restrict who can read the logs."
      fr: "Le compartiment de destination doit se trouver dans la même Région que la configuration de journalisation, et un changement de Région ne limite pas qui peut lire les journaux."
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
