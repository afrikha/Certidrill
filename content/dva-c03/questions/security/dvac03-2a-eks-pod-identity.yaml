id: dvac03-2a-eks-pod-identity
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs several Amazon EKS clusters on Amazon EC2 Linux nodes. A new microservice in each cluster needs read access to an Amazon DynamoDB table. Only the pods of that microservice must receive the permissions. The company wants to reuse one IAM role in every cluster without editing the role's trust policy when a cluster is added.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute plusieurs clusters Amazon EKS sur des nœuds Linux Amazon EC2. Un nouveau microservice de chaque cluster a besoin d'un accès en lecture à une table Amazon DynamoDB. Seuls les pods de ce microservice doivent recevoir les autorisations. L'entreprise veut réutiliser un même rôle IAM dans tous les clusters sans modifier la politique d'approbation du rôle quand un cluster est ajouté.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an EKS Pod Identity association between the role and the microservice's service account in each cluster.", fr: "Créer, dans chaque cluster, une association EKS Pod Identity entre le rôle et le compte de service du microservice." } }
    - { id: b, text: { en: "Create an IAM OIDC identity provider for each cluster and annotate the service account with the role ARN (IRSA).", fr: "Créer un fournisseur d'identité OIDC IAM pour chaque cluster et annoter le compte de service avec l'ARN du rôle (IRSA)." } }
    - { id: c, text: { en: "Attach the DynamoDB permissions to the IAM role of the managed node group in each cluster.", fr: "Attacher les autorisations DynamoDB au rôle IAM du groupe de nœuds gérés de chaque cluster." } }
    - { id: d, text: { en: "Store the access keys of an IAM user in a Kubernetes secret that the microservice pods mount.", fr: "Stocker les clés d'accès d'un utilisateur IAM dans un secret Kubernetes monté par les pods du microservice." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With EKS Pod Identity, the role trusts the single service principal pods.eks.amazonaws.com, so the same role works in any cluster without trust policy changes. The association maps the role to one service account, and the Pod Identity Agent gives credentials only to pods that use it. EC2 Linux nodes are supported."
    fr: "Avec EKS Pod Identity, le rôle approuve le principal de service unique pods.eks.amazonaws.com : le même rôle fonctionne dans n'importe quel cluster sans modifier la politique d'approbation. L'association lie le rôle à un compte de service, et l'agent Pod Identity ne fournit des informations d'identification qu'aux pods qui l'utilisent. Les nœuds Linux EC2 sont pris en charge."
  options:
    b:
      en: "IRSA works, but it needs one OIDC provider per cluster and a trust policy that references each cluster's provider, so the trust policy changes for every new cluster."
      fr: "IRSA fonctionne, mais il faut un fournisseur OIDC par cluster et une politique d'approbation qui référence le fournisseur de chaque cluster : la politique change pour chaque nouveau cluster."
    c:
      en: "The node role is available to every pod on the nodes, so pods of other workloads would also get the permissions."
      fr: "Le rôle des nœuds est disponible pour tous les pods des nœuds : les pods d'autres charges de travail obtiendraient aussi les autorisations."
    d:
      en: "Long-term access keys must be rotated and distributed manually, which adds overhead and risk compared with temporary role credentials."
      fr: "Des clés d'accès à long terme doivent être renouvelées et distribuées manuellement, ce qui ajoute de la charge et des risques par rapport aux informations d'identification temporaires d'un rôle."
references:
  - title: Learn how EKS Pod Identity grants pods access to AWS services
    url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
