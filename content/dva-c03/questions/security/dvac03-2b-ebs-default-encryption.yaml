id: dvac03-2b-ebs-default-encryption
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Developers at AnyCompany launch Amazon EC2 instances in the us-east-1 Region by using the AWS CLI, AWS CloudFormation templates, and the AWS Management Console. The company requires every new Amazon EBS volume in that Region of the account to be encrypted, without changing any template or script.

    Which solution will meet these requirements?
  fr: |
    Les développeurs d'AnyCompany lancent des instances Amazon EC2 dans la Région us-east-1 à l'aide de l'AWS CLI, de modèles AWS CloudFormation et de l'AWS Management Console. L'entreprise exige que chaque nouveau volume Amazon EBS de cette Région du compte soit chiffré, sans modifier aucun modèle ni script.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable Amazon EBS encryption by default for the account in the us-east-1 Region.", fr: "Activer le chiffrement Amazon EBS par défaut pour le compte dans la Région us-east-1." }
    - id: b
      text: { en: "Set the Encrypted property to true for every volume in the CloudFormation templates.", fr: "Définir la propriété Encrypted sur true pour chaque volume dans les modèles CloudFormation." }
    - id: c
      text: { en: "Create encrypted snapshots of all volumes every night, and replace the volumes from the snapshots.", fr: "Créer chaque nuit des instantanés chiffrés de tous les volumes, puis remplacer les volumes à partir de ces instantanés." }
    - id: d
      text: { en: "Enable default encryption on the Amazon S3 bucket that stores the EBS snapshots of the account.", fr: "Activer le chiffrement par défaut sur le compartiment Amazon S3 qui stocke les instantanés EBS du compte." }
answer: { optionId: a }
explanation:
  correct:
    en: "EBS encryption by default is an account setting for each Region. Once it is enabled, every new volume is encrypted, whatever tool launches it, with the aws/ebs AWS managed key or a customer managed key that you choose. It does not affect existing volumes."
    fr: "Le chiffrement EBS par défaut est un paramètre du compte propre à chaque Région. Une fois activé, chaque nouveau volume est chiffré, quel que soit l'outil qui le lance, avec la clé gérée par AWS aws/ebs ou une clé gérée par le client de votre choix. Il n'a pas d'effet sur les volumes existants."
  options:
    b:
      en: "Editing every template is the change the requirement forbids, and it does not cover the AWS CLI scripts and the console."
      fr: "Modifier chaque modèle est justement le changement que l'exigence interdit, et cela ne couvre ni les scripts AWS CLI ni la console."
    c:
      en: "Nightly snapshots leave new volumes unencrypted until the next run and add heavy operations."
      fr: "Des instantanés nocturnes laissent les nouveaux volumes non chiffrés jusqu'à l'exécution suivante et ajoutent de lourdes opérations."
    d:
      en: "EBS snapshots are not stored in a bucket of the account, so S3 default encryption has no effect on EBS volumes."
      fr: "Les instantanés EBS ne sont pas stockés dans un compartiment du compte : le chiffrement par défaut de S3 n'a aucun effet sur les volumes EBS."
references:
  - title: Enable Amazon EBS encryption by default
    url: https://docs.aws.amazon.com/ebs/latest/userguide/encryption-by-default.html
