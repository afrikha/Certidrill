id: dvac03-2a-saml-api-access
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's employees sign in to an on-premises SAML 2.0 identity provider. A developer is writing an internal desktop tool that calls AWS APIs with the corporate identity of each employee. The company does not want to create IAM users and does not use IAM Identity Center.

    Which solution will meet these requirements?
  fr: |
    Les employés d'une entreprise se connectent à un fournisseur d'identité SAML 2.0 sur site. Un développeur écrit un outil de bureau interne qui appelle des API AWS avec l'identité d'entreprise de chaque employé. L'entreprise ne veut pas créer d'utilisateurs IAM et n'utilise pas IAM Identity Center.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Have the tool call AWS STS GetFederationToken with the SAML assertion that the identity provider returns.", fr: "Faire appeler par l'outil AWS STS GetFederationToken avec l'assertion SAML renvoyée par le fournisseur d'identité." } }
    - { id: b, text: { en: "Have the tool call AWS STS AssumeRoleWithWebIdentity with the SAML assertion that the identity provider returns.", fr: "Faire appeler par l'outil AWS STS AssumeRoleWithWebIdentity avec l'assertion SAML renvoyée par le fournisseur d'identité." } }
    - { id: c, text: { en: "Create a SAML identity provider in IAM and a role that trusts it, and have the tool call AWS STS AssumeRoleWithSAML.", fr: "Créer un fournisseur d'identité SAML dans IAM et un rôle qui l'approuve, et faire appeler par l'outil AWS STS AssumeRoleWithSAML." } }
    - { id: d, text: { en: "Add the identity provider to an Amazon Cognito user pool, and sign the AWS API calls with the user pool ID token.", fr: "Ajouter le fournisseur d'identité à un groupe d'utilisateurs Amazon Cognito et signer les appels d'API AWS avec le jeton d'identification du groupe." } }
answer: { optionId: c }
explanation:
  correct:
    en: "For SAML 2.0 API access, the IdP metadata is registered as a SAML identity provider in IAM and a role trust policy names that provider. The tool passes the SAML assertion, the provider ARN and the role ARN to AssumeRoleWithSAML and receives temporary security credentials, so no IAM user is needed."
    fr: "Pour l'accès aux API par SAML 2.0, les métadonnées du fournisseur sont inscrites comme fournisseur d'identité SAML dans IAM et la politique d'approbation d'un rôle désigne ce fournisseur. L'outil transmet l'assertion SAML, l'ARN du fournisseur et l'ARN du rôle à AssumeRoleWithSAML et reçoit des informations d'identification de sécurité temporaires : aucun utilisateur IAM n'est nécessaire."
  options:
    a:
      en: "GetFederationToken is called with the long-term credentials of an IAM user and does not accept a SAML assertion."
      fr: "GetFederationToken s'appelle avec les informations d'identification à long terme d'un utilisateur IAM et n'accepte pas d'assertion SAML."
    b:
      en: "AssumeRoleWithWebIdentity accepts JSON Web Tokens from OIDC providers, not SAML assertions."
      fr: "AssumeRoleWithWebIdentity accepte des jetons web JSON de fournisseurs OIDC, pas des assertions SAML."
    d:
      en: "User pool tokens authenticate users to applications; they are not AWS credentials and cannot sign AWS API requests."
      fr: "Les jetons d'un groupe d'utilisateurs authentifient les utilisateurs auprès des applications ; ce ne sont pas des informations d'identification AWS et ils ne peuvent pas signer de demandes d'API AWS."
references:
  - title: SAML 2.0 federation
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_saml.html
  - title: Request temporary security credentials
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp_request.html
