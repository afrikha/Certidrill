id: dvac03-2b-permissions-boundary
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany lets developers create IAM roles for their AWS Lambda functions. Developers must keep choosing the policies that they attach to their roles. The security team requires that a role created by a developer can never perform actions outside Amazon DynamoDB, Amazon S3, and Amazon CloudWatch Logs, even if a developer attaches the AdministratorAccess policy to it. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany permet aux développeurs de créer des rôles IAM pour leurs fonctions AWS Lambda. Les développeurs doivent continuer à choisir les politiques qu'ils attachent à leurs rôles. L'équipe de sécurité exige qu'un rôle créé par un développeur ne puisse jamais effectuer d'actions en dehors d'Amazon DynamoDB, d'Amazon S3 et d'Amazon CloudWatch Logs, même si un développeur lui attache la politique AdministratorAccess. La solution doit avoir la charge opérationnelle la plus FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Have the security team review the policies of every new role before developers can attach the role to a function.", fr: "Faire examiner par l'équipe de sécurité les politiques de chaque nouveau rôle avant que les développeurs puissent attacher le rôle à une fonction." }
    - id: b
      text: { en: "Create a boundary policy for the three services, and allow iam:CreateRole only when iam:PermissionsBoundary is that policy.", fr: "Créer une politique de limite pour les trois services, et n'autoriser iam:CreateRole que si iam:PermissionsBoundary est cette politique." }
    - id: c
      text: { en: "Create a policy that allows only the three services, and set it as the permissions boundary of the developers' own role.", fr: "Créer une politique gérée qui n'autorise que les trois services, et la définir comme limite d'autorisations du rôle IAM des développeurs eux-mêmes." }
    - id: d
      text: { en: "Create an inline policy that denies all other services, and ask developers to add it to each role after they create the role.", fr: "Créer une politique en ligne qui refuse tous les autres services, et demander aux développeurs de l'ajouter à chaque rôle après sa création." }
answer: { optionId: b }
explanation:
  correct:
    en: "A permissions boundary sets the maximum permissions of a role: the effective permissions are the intersection of the role's policies and the boundary, so even AdministratorAccess cannot exceed it. The iam:PermissionsBoundary condition key forces developers to attach that boundary when they create a role, which enforces the rule automatically. The developers' policy should also deny changing or removing the boundary."
    fr: "Une limite d'autorisations fixe les autorisations maximales d'un rôle : les autorisations effectives sont l'intersection des politiques du rôle et de la limite, si bien que même AdministratorAccess ne peut pas la dépasser. La clé de condition iam:PermissionsBoundary oblige les développeurs à attacher cette limite lorsqu'ils créent un rôle, ce qui applique la règle automatiquement. La politique des développeurs doit aussi refuser la modification ou la suppression de la limite."
  options:
    a:
      en: "A manual review of every role adds a lot of operational overhead and does not stop a developer from attaching AdministratorAccess later."
      fr: "Un examen manuel de chaque rôle ajoute une forte charge opérationnelle et n'empêche pas un développeur d'attacher AdministratorAccess plus tard."
    c:
      en: "A boundary on the developers' role limits what the developers can do, not the permissions of the roles that they create for their functions."
      fr: "Une limite sur le rôle des développeurs restreint ce que les développeurs peuvent faire, et non les autorisations des rôles qu'ils créent pour leurs fonctions."
    d:
      en: "Relying on developers to add the deny policy is not enforced, and a developer can remove the inline policy at any time."
      fr: "Compter sur les développeurs pour ajouter la politique de refus n'est pas une application contrainte, et un développeur peut supprimer la politique en ligne à tout moment."
references:
  - title: Permissions boundaries for IAM entities
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
