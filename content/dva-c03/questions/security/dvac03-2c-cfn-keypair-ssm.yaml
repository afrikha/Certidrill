id: dvac03-2c-cfn-keypair-ssm
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer deploys a development environment with an AWS CloudFormation template. The template contains an AWS::EC2::KeyPair resource without a PublicKeyMaterial property, so a new key pair is created, and an EC2 instance uses that key pair. After the stack is created, the developer needs the private key to connect to the instance with SSH.

    Where can the developer retrieve the private key?
  fr: |
    Un développeur déploie un environnement de développement avec un modèle AWS CloudFormation. Le modèle contient une ressource AWS::EC2::KeyPair sans propriété PublicKeyMaterial : une nouvelle paire de clés est donc créée, et une instance EC2 utilise cette paire de clés. Une fois la pile créée, le développeur a besoin de la clé privée pour se connecter à l'instance en SSH.

    Où le développeur peut-il récupérer la clé privée ?
body:
  options:
    - id: a
      text: { en: "In the Outputs section of the stack, where CloudFormation returns the key material of every key pair it creates", fr: "Dans la section Outputs de la pile, où CloudFormation renvoie le matériel de clé de chaque paire de clés qu'il crée" }
    - id: b
      text: { en: "In the response of aws ec2 describe-key-pairs called with the --include-public-key option for the key pair", fr: "Dans la réponse d'aws ec2 describe-key-pairs appelé avec l'option --include-public-key pour la paire de clés" }
    - id: c
      text: { en: "In AWS Secrets Manager, in a secret that CloudFormation creates with the same name as the key pair", fr: "Dans AWS Secrets Manager, dans un secret que CloudFormation crée avec le même nom que la paire de clés" }
    - id: d
      text: { en: "In AWS Systems Manager Parameter Store, in a parameter named /ec2/keypair/ followed by the key pair ID", fr: "Dans AWS Systems Manager Parameter Store, dans un paramètre nommé /ec2/keypair/ suivi de l'ID de la paire de clés" }
answer: { optionId: d }
explanation:
  correct:
    en: "When CloudFormation creates a new key pair, the private key is saved to Parameter Store under /ec2/keypair/ followed by the key pair ID. The developer retrieves it with aws ssm get-parameter --with-decryption and saves it to a .pem file."
    fr: "Lorsque CloudFormation crée une nouvelle paire de clés, la clé privée est enregistrée dans Parameter Store sous /ec2/keypair/ suivi de l'ID de la paire de clés. Le développeur la récupère avec aws ssm get-parameter --with-decryption et l'enregistre dans un fichier .pem."
  options:
    a:
      en: "CloudFormation does not output the key material; exposing a private key in stack outputs would also make it visible to anyone who can describe the stack."
      fr: "CloudFormation ne renvoie pas le matériel de clé en sortie ; exposer une clé privée dans les sorties de la pile la rendrait en outre visible à quiconque peut décrire la pile."
    b:
      en: "describe-key-pairs can return the public key only; Amazon EC2 never returns a private key after creation."
      fr: "describe-key-pairs ne peut renvoyer que la clé publique ; Amazon EC2 ne renvoie jamais de clé privée après la création."
    c:
      en: "CloudFormation stores the private key of a new key pair in Parameter Store, not in Secrets Manager."
      fr: "CloudFormation stocke la clé privée d'une nouvelle paire de clés dans Parameter Store, et non dans Secrets Manager."
references:
  - title: Create a key pair for your Amazon EC2 instance
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/create-key-pairs.html
