id: dvac03-2b-db-encryption-sdk
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application stores customer records in an Amazon DynamoDB table. A new rule requires the tax ID attribute to be encrypted in the application before it is written, so that DynamoDB never stores or receives the plaintext value. The other attributes must stay readable for queries, and each record must be protected against unauthorized changes such as swapped attribute values.

    Which solution will meet these requirements?
  fr: |
    Une application stocke des fiches clients dans une table Amazon DynamoDB. Une nouvelle règle impose que l'attribut de numéro fiscal soit chiffré dans l'application avant son écriture, afin que DynamoDB ne stocke ni ne reçoive jamais la valeur en clair. Les autres attributs doivent rester lisibles pour les requêtes, et chaque enregistrement doit être protégé contre les modifications non autorisées, comme l'échange de valeurs d'attributs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use the AWS Database Encryption SDK to encrypt the tax ID attribute and sign each item in the application.", fr: "Utiliser l'AWS Database Encryption SDK pour chiffrer l'attribut de numéro fiscal et signer chaque élément dans l'application." }
    - id: b
      text: { en: "Switch the encryption at rest of the table to a customer managed AWS KMS key with a restrictive key policy.", fr: "Basculer le chiffrement au repos de la table vers une clé AWS KMS gérée par le client dotée d'une politique de clé restrictive." }
    - id: c
      text: { en: "Store each tax ID as a SecureString parameter in Parameter Store, and keep only the parameter name in the item.", fr: "Stocker chaque numéro fiscal sous forme de paramètre SecureString dans Parameter Store, et ne conserver que le nom du paramètre dans l'élément." }
    - id: d
      text: { en: "Use the Amazon S3 Encryption Client to encrypt the tax ID value before the application writes the item.", fr: "Utiliser l'Amazon S3 Encryption Client pour chiffrer la valeur du numéro fiscal avant que l'application écrive l'élément." }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS Database Encryption SDK, formerly the DynamoDB Encryption Client, adds client-side, attribute-level encryption to DynamoDB. You choose which attributes are encrypted and which are included in the signature, so the tax ID is stored as ciphertext, the other attributes stay in plaintext, and the record signature detects added, removed, or swapped values."
    fr: "L'AWS Database Encryption SDK, anciennement DynamoDB Encryption Client, ajoute à DynamoDB un chiffrement côté client au niveau des attributs. Vous choisissez les attributs chiffrés et ceux inclus dans la signature : le numéro fiscal est stocké sous forme chiffrée, les autres attributs restent en clair, et la signature de l'enregistrement détecte les valeurs ajoutées, supprimées ou échangées."
  options:
    b:
      en: "Encryption at rest is server-side, so DynamoDB still receives the plaintext, and it does not sign records."
      fr: "Le chiffrement au repos est côté serveur : DynamoDB reçoit toujours la valeur en clair, et il ne signe pas les enregistrements."
    c:
      en: "Parameter Store encrypts on the server side, so AWS receives the plaintext, and storing one parameter per customer does not scale or sign the records."
      fr: "Parameter Store chiffre côté serveur : AWS reçoit donc la valeur en clair, et stocker un paramètre par client ne passe pas à l'échelle et ne signe pas les enregistrements."
    d:
      en: "The Amazon S3 Encryption Client encrypts S3 objects during PutObject and GetObject; it is not designed for DynamoDB attributes and does not sign items."
      fr: "L'Amazon S3 Encryption Client chiffre des objets S3 pendant PutObject et GetObject ; il n'est pas conçu pour les attributs DynamoDB et ne signe pas les éléments."
references:
  - title: What is the AWS Database Encryption SDK?
    url: https://docs.aws.amazon.com/database-encryption-sdk/latest/devguide/what-is-database-encryption-sdk.html
