id: dvac03-2c-buildspec-secrets
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The buildspec.yml file of an AWS CodeBuild project, stored in the source repository, contains the following section. The password is visible in the repository and in the build project details.

    ```yaml
    env:
      variables:
        REGISTRY_PASSWORD: "s3cr3t-value"
    phases:
      pre_build:
        commands:
          - echo "$REGISTRY_PASSWORD" | docker login -u ci --password-stdin registry.example.com
    ```

    The password is now stored in an AWS Secrets Manager secret named ci/registry, under the JSON key password. The CodeBuild service role allows secretsmanager:GetSecretValue on the secret.

    How should the developer change the env section?
  fr: |
    Le fichier buildspec.yml d'un projet AWS CodeBuild, stocké dans le référentiel source, contient la section suivante. Le mot de passe est visible dans le référentiel et dans les détails du projet de build.

    ```yaml
    env:
      variables:
        REGISTRY_PASSWORD: "s3cr3t-value"
    phases:
      pre_build:
        commands:
          - echo "$REGISTRY_PASSWORD" | docker login -u ci --password-stdin registry.example.com
    ```

    Le mot de passe est désormais stocké dans un secret AWS Secrets Manager nommé ci/registry, sous la clé JSON password. Le rôle de service CodeBuild autorise secretsmanager:GetSecretValue sur le secret.

    Comment le développeur doit-il modifier la section env ?
body:
  options:
    - id: a
      text: { en: "Under env, add parameter-store: with the entry REGISTRY_PASSWORD: \"ci/registry:password\", and remove the variables entry.", fr: "Sous env, ajouter parameter-store: avec l'entrée REGISTRY_PASSWORD: \"ci/registry:password\", et retirer l'entrée variables." }
    - id: b
      text: { en: "Under env, add secrets-manager: with the entry REGISTRY_PASSWORD: \"ci/registry:password\", and remove the variables entry.", fr: "Sous env, ajouter secrets-manager: avec l'entrée REGISTRY_PASSWORD: \"ci/registry:password\", et retirer l'entrée variables." }
    - id: c
      text: { en: "Under env, keep variables: and set REGISTRY_PASSWORD to \"{{resolve:secretsmanager:ci/registry:SecretString:password}}\".", fr: "Sous env, conserver variables: et définir REGISTRY_PASSWORD sur \"{{resolve:secretsmanager:ci/registry:SecretString:password}}\"." }
    - id: d
      text: { en: "Under env, add exported-variables: with the entry REGISTRY_PASSWORD, and remove the value from the variables entry.", fr: "Sous env, ajouter exported-variables: avec l'entrée REGISTRY_PASSWORD, et retirer la valeur de l'entrée variables." }
answer: { optionId: b }
explanation:
  correct:
    en: "The secrets-manager mapping of a buildspec uses the format secret-id:json-key:version-stage:version-id, so ci/registry:password retrieves the password key of the AWSCURRENT version. CodeBuild retrieves the value with its service role at build time and masks it in the build logs when the output matches the stored value."
    fr: "Le mappage secrets-manager d'un buildspec utilise le format secret-id:json-key:version-stage:version-id : ci/registry:password récupère la clé password de la version AWSCURRENT. CodeBuild récupère la valeur avec son rôle de service au moment du build et la masque dans les journaux de build lorsque la sortie correspond à la valeur stockée."
  options:
    a:
      en: "The parameter-store mapping reads Parameter Store parameters by name and needs ssm:GetParameters; ci/registry:password is not a parameter name."
      fr: "Le mappage parameter-store lit des paramètres de Parameter Store par leur nom et exige ssm:GetParameters ; ci/registry:password n'est pas un nom de paramètre."
    c:
      en: "Dynamic references are resolved by AWS CloudFormation, not by CodeBuild, so the build would receive the literal string."
      fr: "Les références dynamiques sont résolues par AWS CloudFormation, pas par CodeBuild : le build recevrait la chaîne littérale."
    d:
      en: "exported-variables passes variables to later stages of an AWS CodePipeline pipeline; it does not retrieve a secret."
      fr: "exported-variables transmet des variables aux étapes suivantes d'un pipeline AWS CodePipeline ; il ne récupère aucun secret."
references:
  - title: Build specification reference for CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
