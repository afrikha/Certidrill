id: dvac03-2a-cf-signed-cookies-hls
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company streams training videos in HLS format through an Amazon CloudFront distribution. Each video consists of a playlist and hundreds of segment files. Only paying subscribers may watch the videos, and the company does not want to change the URLs that the video player requests.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias diffuse des vidéos de formation au format HLS par une distribution Amazon CloudFront. Chaque vidéo se compose d'une liste de lecture et de centaines de fichiers de segments. Seuls les abonnés payants peuvent regarder les vidéos, et l'entreprise ne veut pas changer les URL que demande le lecteur vidéo.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Generate a CloudFront signed URL for each segment file when a subscriber starts a video.", fr: "Générer une URL signée CloudFront pour chaque fichier de segment quand un abonné lance une vidéo." } }
    - { id: b, text: { en: "Generate an S3 presigned URL for the playlist, and let the player request the segments from S3.", fr: "Générer une URL présignée S3 pour la liste de lecture et laisser le lecteur demander les segments à S3." } }
    - { id: c, text: { en: "Set CloudFront signed cookies for subscribers, and restrict viewer access on the cache behavior of the videos.", fr: "Définir des cookies signés CloudFront pour les abonnés et restreindre l'accès des utilisateurs (Restrict viewer access) sur le comportement de cache des vidéos." } }
    - { id: d, text: { en: "Configure origin access control on the distribution, and allow only subscribers in the bucket policy.", fr: "Configurer le contrôle d'accès à l'origine sur la distribution et n'autoriser que les abonnés dans la politique de compartiment." } }
answer: { optionId: c }
explanation:
  correct:
    en: "CloudFront recommends signed cookies when users need access to multiple restricted files, such as all the files of an HLS video, and when the existing URLs must not change. Restricting viewer access with a trusted key group makes CloudFront require a valid signed cookie or signed URL."
    fr: "CloudFront recommande les cookies signés quand les utilisateurs doivent accéder à plusieurs fichiers restreints, comme tous les fichiers d'une vidéo HLS, et quand les URL existantes ne doivent pas changer. Restreindre l'accès des utilisateurs avec un groupe de clés approuvé oblige CloudFront à exiger un cookie signé ou une URL signée valide."
  options:
    a:
      en: "Signed URLs change every URL that the player requests and need one signature per segment."
      fr: "Les URL signées changent chaque URL demandée par le lecteur et exigent une signature par segment."
    b:
      en: "The segments would bypass CloudFront, would also need signatures, and the URLs would change."
      fr: "Les segments contourneraient CloudFront, auraient aussi besoin de signatures, et les URL changeraient."
    d:
      en: "Origin access control restricts the bucket to CloudFront; it does not authenticate viewers, who are not IAM principals."
      fr: "Le contrôle d'accès à l'origine réserve le compartiment à CloudFront ; il n'authentifie pas les utilisateurs, qui ne sont pas des principaux IAM."
references:
  - title: Decide to use signed URLs or signed cookies
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-choosing-signed-urls-cookies.html
