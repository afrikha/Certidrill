id: dvac03-2b-cross-account-bucket
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an application on Amazon EC2 instances in account A (111111111111). The instances use an instance profile with the IAM role ReportReader. The application must download objects from an Amazon S3 bucket named reports-bucket that belongs to account B (222222222222). The objects are encrypted with SSE-S3. The company requires the least privilege and no long-term credentials.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany exécute une application sur des instances Amazon EC2 dans le compte A (111111111111). Les instances utilisent un profil d'instance avec le rôle IAM ReportReader. L'application doit télécharger des objets depuis un compartiment Amazon S3 nommé reports-bucket qui appartient au compte B (222222222222). Les objets sont chiffrés avec SSE-S3. L'entreprise exige le moindre privilège et aucune information d'identification à long terme.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "In account A, attach a policy to ReportReader that allows s3:GetObject on arn:aws:s3:::reports-bucket/*.", fr: "Dans le compte A, attacher à ReportReader une politique qui autorise s3:GetObject sur arn:aws:s3:::reports-bucket/*." }
    - id: b
      text: { en: "In account A, attach a policy to ReportReader that allows sts:AssumeRole on arn:aws:s3:::reports-bucket.", fr: "Dans le compte A, attacher à ReportReader une politique qui autorise sts:AssumeRole sur arn:aws:s3:::reports-bucket." }
    - id: c
      text: { en: "In account B, add a bucket policy that allows s3:* on the bucket and its objects to the principal arn:aws:iam::111111111111:root.", fr: "Dans le compte B, ajouter une politique de compartiment qui autorise s3:* sur le compartiment et ses objets pour le principal arn:aws:iam::111111111111:root." }
    - id: d
      text: { en: "In account B, add a bucket policy that allows s3:GetObject on arn:aws:s3:::reports-bucket/* to the principal arn:aws:iam::111111111111:role/ReportReader.", fr: "Dans le compte B, ajouter une politique de compartiment qui autorise s3:GetObject sur arn:aws:s3:::reports-bucket/* pour le principal arn:aws:iam::111111111111:role/ReportReader." }
    - id: e
      text: { en: "In account B, create an IAM user that can read the bucket, and store its access keys on the instances.", fr: "Dans le compte B, créer un utilisateur IAM qui peut lire le compartiment, et stocker ses clés d'accès sur les instances." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A cross-account request is allowed only when both sides allow it. The identity-based policy of ReportReader in account A allows the call, and the bucket policy in account B allows that specific role to read the objects. Objects encrypted with SSE-S3 need no extra KMS permission."
    fr: "Une requête entre comptes n'est autorisée que si les deux côtés l'autorisent. La politique basée sur l'identité de ReportReader dans le compte A autorise l'appel, et la politique de compartiment du compte B autorise ce rôle précis à lire les objets. Les objets chiffrés avec SSE-S3 ne nécessitent aucune autorisation KMS supplémentaire."
  options:
    b:
      en: "sts:AssumeRole applies to IAM roles, not to S3 buckets, so this statement grants nothing useful."
      fr: "sts:AssumeRole s'applique aux rôles IAM et non aux compartiments S3 : cette instruction n'accorde rien d'utile."
    c:
      en: "Granting s3:* to the whole of account A gives every action to any principal that account A allows, which fails the least-privilege requirement."
      fr: "Accorder s3:* à tout le compte A donne toutes les actions à n'importe quel principal autorisé par le compte A, ce qui ne respecte pas l'exigence de moindre privilège."
    e:
      en: "Access keys of an IAM user are long-term credentials, which the company forbids."
      fr: "Les clés d'accès d'un utilisateur IAM sont des informations d'identification à long terme, que l'entreprise interdit."
references:
  - title: Cross-account policy evaluation logic
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html
