id: dvac03-2a-aws-login-console
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A startup's developers sign in to the AWS Management Console as IAM users with MFA. The company does not use IAM Identity Center. The developers now need to run the AWS CLI and SDK scripts on their laptops, and the security team wants to remove all long-term access keys. The laptops have the latest version of AWS CLI version 2.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Les développeurs d'une start-up se connectent à l'AWS Management Console en tant qu'utilisateurs IAM avec MFA. L'entreprise n'utilise pas IAM Identity Center. Les développeurs doivent maintenant exécuter l'AWS CLI et des scripts SDK sur leurs ordinateurs portables, et l'équipe de sécurité veut supprimer toutes les clés d'accès à long terme. Les ordinateurs disposent de la dernière version de l'AWS CLI version 2.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Use AWS CloudShell for all scripts, and copy the local project files to the CloudShell home directory.", fr: "Utiliser AWS CloudShell pour tous les scripts et copier les fichiers locaux du projet dans le répertoire personnel de CloudShell." } }
    - { id: b, text: { en: "Configure IAM Roles Anywhere with a trust anchor, and issue an X.509 certificate to each laptop.", fr: "Configurer IAM Roles Anywhere avec une ancre d'approbation (trust anchor) et émettre un certificat X.509 pour chaque ordinateur." } }
    - { id: c, text: { en: "Attach the SignInLocalDevelopmentAccess managed policy to the users, and have them run aws login.", fr: "Attacher la politique gérée SignInLocalDevelopmentAccess aux utilisateurs et leur faire exécuter aws login." } }
    - { id: d, text: { en: "Create access keys for each user, and store them in AWS Secrets Manager with automatic rotation.", fr: "Créer des clés d'accès pour chaque utilisateur et les stocker dans AWS Secrets Manager avec rotation automatique." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The aws login command (AWS CLI 2.32.0 or later) uses the console sign-in in a browser to issue temporary credentials to a profile with a login_session setting. The CLI and the SDKs refresh them automatically for up to 12 hours, and IAM users need the SignInLocalDevelopmentAccess managed policy."
    fr: "La commande aws login (AWS CLI 2.32.0 ou ultérieure) utilise la connexion à la console dans un navigateur pour émettre des informations d'identification temporaires vers un profil doté d'un paramètre login_session. La CLI et les SDK les actualisent automatiquement pendant 12 heures au plus, et les utilisateurs IAM ont besoin de la politique gérée SignInLocalDevelopmentAccess."
  options:
    a:
      en: "CloudShell runs in the browser, not on the laptops, so the local scripts and tools would have to move."
      fr: "CloudShell s'exécute dans le navigateur, pas sur les ordinateurs : les scripts et outils locaux devraient être déplacés."
    b:
      en: "Roles Anywhere targets workloads outside AWS and requires a certificate authority and certificate management, which is far more effort."
      fr: "Roles Anywhere vise des charges de travail hors d'AWS et exige une autorité de certification et la gestion de certificats, ce qui demande bien plus d'effort."
    d:
      en: "Rotated access keys are still long-term credentials, which the security team wants to remove."
      fr: "Des clés d'accès renouvelées restent des informations d'identification à long terme, que l'équipe de sécurité veut supprimer."
references:
  - title: Login for AWS local development using console credentials
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sign-in.html
  - title: Programmatic access with AWS security credentials
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/security-creds-programmatic-access.html
