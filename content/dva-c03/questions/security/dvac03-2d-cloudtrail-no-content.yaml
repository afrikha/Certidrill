id: dvac03-2d-cloudtrail-no-content
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must keep an audit record of which IAM principals invoke Amazon Bedrock models with the InvokeModel and Converse APIs, and when. Company policy forbids storing the text of prompts and responses anywhere in the account. The developer wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit conserver un enregistrement d'audit indiquant quels principaux IAM invoquent des modèles Amazon Bedrock avec les API InvokeModel et Converse, et à quel moment. La politique de l'entreprise interdit de stocker le texte des invites et des réponses où que ce soit dans le compte. Le développeur veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use the AWS CloudTrail management events that record the InvokeModel and Converse calls, and keep model invocation logging disabled.", fr: "Utiliser les événements de gestion AWS CloudTrail qui enregistrent les appels InvokeModel et Converse, et laisser la journalisation des invocations de modèles désactivée." } }
    - { id: b, text: { en: "Enable model invocation logging to Amazon S3 with only the Image and Embedding data types selected.", fr: "Activer la journalisation des invocations de modèles vers Amazon S3 avec uniquement les types de données Image et Embedding sélectionnés." } }
    - { id: c, text: { en: "Enable model invocation logging to CloudWatch Logs, and attach a data protection policy that masks all managed data identifiers.", fr: "Activer la journalisation des invocations de modèles vers CloudWatch Logs, et attacher une politique de protection des données qui masque tous les identifiants de données gérés." } }
    - { id: d, text: { en: "Create a CloudTrail trail with data events for Amazon Bedrock so that the InvokeModel and Converse calls are recorded.", fr: "Créer un journal de suivi CloudTrail avec des événements de données pour Amazon Bedrock afin d'enregistrer les appels InvokeModel et Converse." } }
answer: { optionId: a }
explanation:
  correct:
    en: "CloudTrail logs InvokeModel, InvokeModelWithResponseStream, Converse, and ConverseStream as management events, which are recorded by default with the caller identity, the time, and the model ID. Model invocation logging is disabled by default and is the feature that stores prompt and response bodies, so leaving it off meets the policy."
    fr: "CloudTrail journalise InvokeModel, InvokeModelWithResponseStream, Converse et ConverseStream comme des événements de gestion, enregistrés par défaut avec l'identité de l'appelant, l'heure et l'ID du modèle. La journalisation des invocations de modèles est désactivée par défaut et c'est elle qui stocke le corps des invites et des réponses : la laisser désactivée respecte la politique."
  options:
    b:
      en: "Without the Text data type, text model invocations are not logged at all, so the audit record would miss them; the other types would also store content."
      fr: "Sans le type de données Text, les invocations de modèles de texte ne sont pas journalisées du tout : l'enregistrement d'audit les manquerait ; les autres types stockeraient aussi du contenu."
    c:
      en: "Masking covers only the selected sensitive data types; the prompt and response text is still stored in the log group."
      fr: "Le masquage ne couvre que les types de données sensibles choisis ; le texte des invites et des réponses reste stocké dans le groupe de journaux."
    d:
      en: "These calls are management events, not data events, so data events add cost and configuration without recording them."
      fr: "Ces appels sont des événements de gestion, pas des événements de données : les événements de données ajoutent un coût et une configuration sans les enregistrer."
references:
  - title: Monitor Amazon Bedrock API calls using CloudTrail
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
