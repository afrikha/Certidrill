id: dvac03-2c-db-encryption-sdk
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Java application stores customer records in an Amazon DynamoDB table. Each item contains a CustomerId partition key, a Name attribute, and an Ssn attribute that holds a social security number. The Ssn values must be encrypted before they leave the application, so that operators who have read access to the table cannot see them. Name must stay readable, and the application must detect any tampering with the items.

    Which solution will meet these requirements?
  fr: |
    Une application Java stocke des fiches clients dans une table Amazon DynamoDB. Chaque élément contient une clé de partition CustomerId, un attribut Name et un attribut Ssn qui contient un numéro de sécurité sociale. Les valeurs Ssn doivent être chiffrées avant de quitter l'application, afin que les opérateurs qui ont un accès en lecture à la table ne puissent pas les voir. Name doit rester lisible, et l'application doit détecter toute altération des éléments.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure DynamoDB encryption at rest with a customer managed AWS KMS key, and allow only the application role to use the key.", fr: "Configurer le chiffrement au repos de DynamoDB avec une clé AWS KMS gérée par le client, et n'autoriser que le rôle de l'application à utiliser la clé." }
    - id: b
      text: { en: "Add a Deny statement on dynamodb:Attributes for Ssn to the operators' IAM policies, and keep the default DynamoDB encryption at rest.", fr: "Ajouter aux politiques IAM des opérateurs une instruction Deny sur dynamodb:Attributes pour Ssn, et conserver le chiffrement au repos par défaut de DynamoDB." }
    - id: c
      text: { en: "Use the AWS Database Encryption SDK for DynamoDB with ENCRYPT_AND_SIGN for Ssn and SIGN_ONLY for CustomerId and Name.", fr: "Utiliser AWS Database Encryption SDK pour DynamoDB avec ENCRYPT_AND_SIGN pour Ssn et SIGN_ONLY pour CustomerId et Name." }
    - id: d
      text: { en: "Use the AWS Database Encryption SDK for DynamoDB with ENCRYPT_AND_SIGN for CustomerId and Ssn and DO_NOTHING for Name.", fr: "Utiliser AWS Database Encryption SDK pour DynamoDB avec ENCRYPT_AND_SIGN pour CustomerId et Ssn et DO_NOTHING pour Name." }
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS Database Encryption SDK performs client-side, attribute-level encryption and signing, so Ssn is encrypted before it reaches DynamoDB. SIGN_ONLY keeps CustomerId and Name readable while including them in the item signature, which detects tampering. Primary key attributes must use SIGN_ONLY (or SIGN_AND_INCLUDE_IN_ENCRYPTION_CONTEXT), never encryption."
    fr: "AWS Database Encryption SDK effectue un chiffrement et une signature côté client, au niveau des attributs : Ssn est chiffré avant d'atteindre DynamoDB. SIGN_ONLY laisse CustomerId et Name lisibles tout en les incluant dans la signature de l'élément, ce qui détecte les altérations. Les attributs de clé primaire doivent utiliser SIGN_ONLY (ou SIGN_AND_INCLUDE_IN_ENCRYPTION_CONTEXT), jamais le chiffrement."
  options:
    a:
      en: "Encryption at rest is server-side and transparent: anyone with read access to the table still receives Ssn in plaintext, and nothing detects tampering."
      fr: "Le chiffrement au repos est côté serveur et transparent : toute personne ayant un accès en lecture à la table reçoit encore Ssn en clair, et rien ne détecte les altérations."
    b:
      en: "An IAM condition restricts access but does not encrypt Ssn before it leaves the application, and it provides no tamper detection."
      fr: "Une condition IAM restreint l'accès mais ne chiffre pas Ssn avant qu'il quitte l'application, et elle n'offre aucune détection d'altération."
    d:
      en: "The partition key cannot be encrypted because DynamoDB needs it to locate items, and DO_NOTHING leaves Name outside the signature."
      fr: "La clé de partition ne peut pas être chiffrée, car DynamoDB en a besoin pour localiser les éléments, et DO_NOTHING laisse Name hors de la signature."
references:
  - title: AWS Database Encryption SDK concepts
    url: https://docs.aws.amazon.com/database-encryption-sdk/latest/devguide/concepts.html
