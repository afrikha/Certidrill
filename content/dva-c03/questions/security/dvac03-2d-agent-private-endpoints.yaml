id: dvac03-2d-agent-private-endpoints
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A Lambda function in private subnets without internet access calls the InvokeAgent API of an Amazon Bedrock agent. The function also downloads the documents that users attach from an Amazon S3 bucket in the same Region. All traffic must stay private, and the company wants the MOST cost-effective solution.

    Which combination of VPC endpoints will meet these requirements? (Choose two.)
  fr: |
    Une fonction Lambda située dans des sous-réseaux privés sans accès à Internet appelle l'API InvokeAgent d'un agent Amazon Bedrock. La fonction télécharge aussi les documents joints par les utilisateurs depuis un compartiment Amazon S3 de la même Région. Tout le trafic doit rester privé, et l'entreprise veut la solution la PLUS rentable.

    Quelle combinaison de points de terminaison de VPC répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "An interface endpoint for com.amazonaws.region.bedrock-agent", fr: "Un point de terminaison d'interface pour com.amazonaws.region.bedrock-agent" } }
    - { id: b, text: { en: "An interface endpoint for com.amazonaws.region.bedrock-agent-runtime", fr: "Un point de terminaison d'interface pour com.amazonaws.region.bedrock-agent-runtime" } }
    - { id: c, text: { en: "An interface endpoint for com.amazonaws.region.s3", fr: "Un point de terminaison d'interface pour com.amazonaws.region.s3" } }
    - { id: d, text: { en: "An interface endpoint for com.amazonaws.region.bedrock-runtime", fr: "Un point de terminaison d'interface pour com.amazonaws.region.bedrock-runtime" } }
    - { id: e, text: { en: "A gateway endpoint for com.amazonaws.region.s3", fr: "Un point de terminaison de passerelle pour com.amazonaws.region.s3" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "InvokeAgent belongs to the Agents runtime API, served privately by an interface endpoint for bedrock-agent-runtime. For Amazon S3, a gateway endpoint keeps the traffic private and has no additional charge, which makes it cheaper than an interface endpoint."
    fr: "InvokeAgent appartient à l'API d'exécution des agents, servie en privé par un point de terminaison d'interface pour bedrock-agent-runtime. Pour Amazon S3, un point de terminaison de passerelle garde le trafic privé et n'entraîne aucun coût supplémentaire, ce qui le rend moins cher qu'un point de terminaison d'interface."
  options:
    a:
      en: "bedrock-agent is the build-time API used to create and configure agents; it does not serve InvokeAgent."
      fr: "bedrock-agent est l'API de conception qui sert à créer et configurer les agents ; elle ne sert pas InvokeAgent."
    c:
      en: "An S3 interface endpoint also keeps traffic private, but it is billed per hour and per GB, so it is not the most cost-effective choice."
      fr: "Un point de terminaison d'interface S3 garde aussi le trafic privé, mais il est facturé à l'heure et au Go : ce n'est pas le choix le plus rentable."
    d:
      en: "bedrock-runtime serves direct model calls such as InvokeModel and Converse, which the function does not make; the agent calls its model on the service side."
      fr: "bedrock-runtime sert les appels directs aux modèles comme InvokeModel et Converse, que la fonction n'effectue pas ; l'agent appelle son modèle côté service."
references:
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
