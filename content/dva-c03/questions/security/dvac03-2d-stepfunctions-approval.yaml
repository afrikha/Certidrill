id: dvac03-2d-stepfunctions-approval
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AI agent's refund tool starts an AWS Step Functions workflow. Refunds above 1,000 USD must wait until a manager approves or rejects them in an internal web application, which can take up to two days. The workflow must continue as soon as the manager decides, and it must not run compute while it waits.

    Which solution will meet these requirements?
  fr: |
    L'outil de remboursement d'un agent d'IA démarre un flux de travail AWS Step Functions. Les remboursements supérieurs à 1 000 USD doivent attendre qu'un responsable les approuve ou les rejette dans une application web interne, ce qui peut prendre jusqu'à deux jours. Le flux de travail doit reprendre dès que le responsable a décidé, et il ne doit pas exécuter de calcul pendant l'attente.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "In a Standard workflow, use a Task state with .waitForTaskToken that sends $$.Task.Token to the approval application, which calls SendTaskSuccess or SendTaskFailure.", fr: "Dans un flux de travail Standard, utiliser un état Task avec .waitForTaskToken qui envoie $$.Task.Token à l'application d'approbation, qui appelle SendTaskSuccess ou SendTaskFailure." } }
    - { id: b, text: { en: "In an Express workflow, use a Task state with .waitForTaskToken that sends $$.Task.Token to the approval application, which calls SendTaskSuccess or SendTaskFailure.", fr: "Dans un flux de travail Express, utiliser un état Task avec .waitForTaskToken qui envoie $$.Task.Token à l'application d'approbation, qui appelle SendTaskSuccess ou SendTaskFailure." } }
    - { id: c, text: { en: "In a Standard workflow, invoke a Lambda function that polls an Amazon DynamoDB approval table in a loop until the manager's decision is written.", fr: "Dans un flux de travail Standard, invoquer une fonction Lambda qui interroge en boucle une table d'approbation Amazon DynamoDB jusqu'à ce que la décision du responsable soit écrite." } }
    - { id: d, text: { en: "In a Standard workflow, add a Wait state of 48 hours, then read the manager's decision from an Amazon DynamoDB approval table.", fr: "Dans un flux de travail Standard, ajouter un état Wait de 48 heures, puis lire la décision du responsable dans une table d'approbation Amazon DynamoDB." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The .waitForTaskToken callback pattern pauses the task until an external process returns the task token with SendTaskSuccess or SendTaskFailure, which fits human approvals. The workflow resumes as soon as the call arrives and runs no compute while it waits; callback tasks are supported in Standard workflows."
    fr: "Le modèle de rappel .waitForTaskToken met la tâche en pause jusqu'à ce qu'un processus externe renvoie le jeton de tâche avec SendTaskSuccess ou SendTaskFailure, ce qui convient aux approbations humaines. Le flux de travail reprend dès l'arrivée de l'appel et n'exécute aucun calcul pendant l'attente ; les tâches de rappel sont prises en charge dans les flux de travail Standard."
  options:
    b:
      en: "Express workflows do not support the callback (.waitForTaskToken) integration pattern."
      fr: "Les flux de travail Express ne prennent pas en charge le modèle d'intégration par rappel (.waitForTaskToken)."
    c:
      en: "A polling Lambda function runs compute during the wait and cannot run for two days within its maximum timeout."
      fr: "Une fonction Lambda d'interrogation exécute du calcul pendant l'attente et ne peut pas tourner deux jours dans la limite de son délai d'expiration maximal."
    d:
      en: "A fixed Wait state always waits 48 hours, so the workflow does not continue as soon as the manager decides."
      fr: "Un état Wait fixe attend toujours 48 heures : le flux de travail ne reprend pas dès que le responsable a décidé."
references:
  - title: Discover service integration patterns in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
