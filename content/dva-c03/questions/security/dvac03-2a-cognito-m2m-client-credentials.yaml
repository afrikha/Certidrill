id: dvac03-2a-cognito-m2m-client-credentials
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon API Gateway REST API uses an Amazon Cognito user pool authorizer, and its methods require custom scopes of a user pool resource server. A nightly batch job that runs without any user must call the POST /invoices method. The job must not sign in as a user, and its tokens must grant only the invoices/write scope.

    Which solution will meet these requirements?
  fr: |
    Une API REST Amazon API Gateway utilise un mécanisme d'autorisation de groupe d'utilisateurs Amazon Cognito, et ses méthodes exigent des portées personnalisées d'un serveur de ressources du groupe d'utilisateurs. Une tâche par lots nocturne qui s'exécute sans utilisateur doit appeler la méthode POST /invoices. La tâche ne doit pas se connecter en tant qu'utilisateur, et ses jetons ne doivent accorder que la portée invoices/write.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a user for the job in the user pool, and sign in with USER_PASSWORD_AUTH to obtain an ID token.", fr: "Créer un utilisateur pour la tâche dans le groupe d'utilisateurs et se connecter avec USER_PASSWORD_AUTH pour obtenir un jeton d'identification." } }
    - { id: b, text: { en: "Create an IAM role for the job, and sign each request with SigV4 by using the role's credentials.", fr: "Créer un rôle IAM pour la tâche et signer chaque demande avec SigV4 à l'aide des informations d'identification du rôle." } }
    - { id: c, text: { en: "Create an app client with a client secret, assign it the invoices/write scope, and use the client credentials grant.", fr: "Créer un client d'application avec un secret client, lui attribuer la portée invoices/write et utiliser l'octroi des informations d'identification client (client credentials)." } }
    - { id: d, text: { en: "Create an identity pool for the job, and send its identity ID in the Authorization header of each request.", fr: "Créer un groupe d'identités pour la tâche et envoyer son ID d'identité dans l'en-tête Authorization de chaque demande." } }
answer: { optionId: c }
explanation:
  correct:
    en: "For machine-to-machine access, a confidential app client with a client secret requests a token from the token endpoint with grant_type=client_credentials. The access token contains only the custom scopes of the resource server that are assigned to the client, and the authorizer checks them against the method's scopes."
    fr: "Pour l'accès de machine à machine, un client d'application confidentiel doté d'un secret client demande un jeton au point de terminaison de jeton avec grant_type=client_credentials. Le jeton d'accès ne contient que les portées personnalisées du serveur de ressources attribuées au client, et le mécanisme d'autorisation les compare aux portées de la méthode."
  options:
    a:
      en: "The job would sign in as a user, which is forbidden, and a method with scopes expects an access token, not an ID token."
      fr: "La tâche se connecterait en tant qu'utilisateur, ce qui est interdit, et une méthode avec des portées attend un jeton d'accès, pas un jeton d'identification."
    b:
      en: "SigV4 signatures are checked by IAM authorization; a Cognito user pool authorizer does not accept them."
      fr: "Les signatures SigV4 sont vérifiées par l'autorisation IAM ; un mécanisme d'autorisation de groupe d'utilisateurs Cognito ne les accepte pas."
    d:
      en: "An identity ID is an identifier in an identity pool, not a token that the user pool authorizer can validate."
      fr: "Un ID d'identité est un identifiant dans un groupe d'identités, pas un jeton que le mécanisme d'autorisation peut valider."
references:
  - title: Scopes, M2M, and resource servers
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-define-resource-servers.html
  - title: Integrate a REST API with an Amazon Cognito user pool
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-enable-cognito-user-pool.html
