id: dvac03-2d-kiro-content-collection
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A development team uses Kiro with individual subscriptions that sign in with AWS Builder ID. The company's security policy requires that the developers' prompts and the code that Kiro generates are not collected for service improvement or model training. Usage metrics can still be shared. The company does not want to change the type of subscription.

    Which solution will meet these requirements?
  fr: |
    Une équipe de développement utilise Kiro avec des abonnements individuels qui se connectent avec AWS Builder ID. La politique de sécurité de l'entreprise exige que les invites des développeurs et le code généré par Kiro ne soient pas collectés pour l'amélioration du service ou l'entraînement de modèles. Les métriques d'utilisation peuvent toujours être partagées. L'entreprise ne veut pas changer de type d'abonnement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "In each developer's Kiro settings, clear the Usage Analytics And Performance Metrics option under Telemetry and Content.", fr: "Dans les paramètres Kiro de chaque développeur, décocher l'option Usage Analytics And Performance Metrics sous Telemetry and Content." } }
    - { id: b, text: { en: "Have an administrator configure a customer managed AWS KMS key that Kiro uses to encrypt stored content.", fr: "Faire configurer par un administrateur une clé AWS KMS gérée par le client que Kiro utilise pour chiffrer le contenu stocké." } }
    - { id: c, text: { en: "In each developer's Kiro settings, clear the Content Collection for Service Improvement option under Telemetry and Content.", fr: "Dans les paramètres Kiro de chaque développeur, décocher l'option Content Collection for Service Improvement sous Telemetry and Content." } }
    - { id: d, text: { en: "Route the developers' traffic to Kiro through the corporate VPN so that the content stays on a private network path.", fr: "Faire passer le trafic des développeurs vers Kiro par le VPN de l'entreprise afin que le contenu reste sur un chemin réseau privé." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Free Tier and individual subscribers are not opted out by default, so Kiro may use their prompts and generated code to improve the service, including model training. Clearing the content collection option in the Telemetry and Content settings stops this, while the separate telemetry option keeps sharing usage metrics."
    fr: "Les utilisateurs du niveau gratuit et les abonnés individuels ne sont pas exclus par défaut : Kiro peut utiliser leurs invites et le code généré pour améliorer le service, y compris l'entraînement de modèles. Décocher l'option de collecte de contenu dans les paramètres Telemetry and Content arrête cette collecte, tandis que l'option de télémétrie distincte continue de partager les métriques d'utilisation."
  options:
    a:
      en: "This option controls telemetry (usage analytics and performance metrics), which may still be shared; it does not stop content collection."
      fr: "Cette option contrôle la télémétrie (analyses d'utilisation et métriques de performances), qui peut toujours être partagée ; elle n'arrête pas la collecte de contenu."
    b:
      en: "Customer managed keys are an enterprise administration feature, and encrypting content at rest does not change whether it is used for service improvement."
      fr: "Les clés gérées par le client sont une fonctionnalité d'administration entreprise, et le chiffrement du contenu au repos ne change pas son utilisation pour l'amélioration du service."
    d:
      en: "The network path does not change how the service uses the content that it receives."
      fr: "Le chemin réseau ne change pas la façon dont le service utilise le contenu qu'il reçoit."
references:
  - title: Data protection
    url: https://kiro.dev/docs/privacy-and-security/data-protection/
