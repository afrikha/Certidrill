id: dvac03-2c-bedrock-conversestream-perm
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A chat application calls the Amazon Bedrock Converse API with an IAM role whose policy allows bedrock:InvokeModel on the model that the application uses. To display answers as they are generated, a developer replaces the Converse call with a ConverseStream call. The new call fails with AccessDeniedException, while Converse calls still succeed.

    Which permission should the developer add to the role's policy?
  fr: |
    Une application de chat appelle l'API Amazon Bedrock Converse avec un rôle IAM dont la politique autorise bedrock:InvokeModel sur le modèle utilisé par l'application. Pour afficher les réponses au fur et à mesure de leur génération, un développeur remplace l'appel Converse par un appel ConverseStream. Le nouvel appel échoue avec AccessDeniedException, alors que les appels Converse réussissent toujours.

    Quelle autorisation le développeur doit-il ajouter à la politique du rôle ?
body:
  options:
    - { id: a, text: bedrock:InvokeModelWithResponseStream }
    - { id: b, text: bedrock:CreateModelInvocationJob }
    - { id: c, text: bedrock:GetFoundationModel }
    - { id: d, text: bedrock:InvokeAgent }
answer: { optionId: a }
explanation:
  correct:
    en: "Converse is authorized by the bedrock:InvokeModel action, and ConverseStream by the bedrock:InvokeModelWithResponseStream action. The role must allow the streaming action on the same model ARN."
    fr: "Converse est autorisé par l'action bedrock:InvokeModel, et ConverseStream par l'action bedrock:InvokeModelWithResponseStream. Le rôle doit autoriser l'action de streaming sur le même ARN de modèle."
  options:
    b:
      en: "CreateModelInvocationJob starts batch inference jobs; it does not authorize real-time streaming calls."
      fr: "CreateModelInvocationJob lance des tâches d'inférence par lots ; elle n'autorise pas les appels de streaming en temps réel."
    c:
      en: "GetFoundationModel returns details about a model; it does not authorize inference."
      fr: "GetFoundationModel renvoie les détails d'un modèle ; elle n'autorise pas l'inférence."
    d:
      en: "InvokeAgent calls an Amazon Bedrock agent, not a model through the Converse API."
      fr: "InvokeAgent appelle un agent Amazon Bedrock, pas un modèle via l'API Converse."
references:
  - title: Inference using Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
