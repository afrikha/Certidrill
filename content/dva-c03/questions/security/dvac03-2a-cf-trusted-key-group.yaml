id: dvac03-2a-cf-trusted-key-group
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer is setting up Amazon CloudFront signed URLs for a private download area. Company policy forbids any use of the AWS account root user, and the signing keys must be rotated by automation that calls the CloudFront API.

    Which solution will meet these requirements?
  fr: |
    Un développeur configure des URL signées Amazon CloudFront pour une zone de téléchargement privée. La politique de l'entreprise interdit toute utilisation de l'utilisateur racine du compte AWS, et les clés de signature doivent être renouvelées par une automatisation qui appelle l'API CloudFront.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Sign in as the root user once to create a CloudFront key pair, and store the private key in AWS Secrets Manager.", fr: "Se connecter une fois en tant qu'utilisateur racine pour créer une paire de clés CloudFront et stocker la clé privée dans AWS Secrets Manager." } }
    - { id: b, text: { en: "Upload a public key to CloudFront, add it to a key group, and add the key group as a trusted key group of the cache behavior.", fr: "Charger une clé publique dans CloudFront, l'ajouter à un groupe de clés et ajouter ce groupe comme groupe de clés approuvé du comportement de cache." } }
    - { id: c, text: { en: "Create an access key for an IAM user, and use its secret access key to sign the CloudFront URLs.", fr: "Créer une clé d'accès pour un utilisateur IAM et utiliser sa clé d'accès secrète pour signer les URL CloudFront." } }
    - { id: d, text: { en: "Request a public certificate in ACM for the distribution, and sign the URLs with the certificate's key.", fr: "Demander un certificat public dans ACM pour la distribution et signer les URL avec la clé du certificat." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Trusted key groups are the recommended signers: they need no root user, they can be managed with the CloudFront API and controlled with IAM policies, and they support automated rotation. The developer uploads only the public key, signs with the matching private key, and uses the public key ID as Key-Pair-Id."
    fr: "Les groupes de clés approuvés sont les signataires recommandés : ils n'exigent pas l'utilisateur racine, se gèrent par l'API CloudFront, se contrôlent avec des politiques IAM et permettent une rotation automatisée. Le développeur ne charge que la clé publique, signe avec la clé privée correspondante et utilise l'ID de la clé publique comme Key-Pair-Id."
  options:
    a:
      en: "Only the root user can create CloudFront key pairs, and they are managed in the console only, so rotation cannot be automated."
      fr: "Seul l'utilisateur racine peut créer des paires de clés CloudFront, qui se gèrent uniquement dans la console : la rotation ne peut pas être automatisée."
    c:
      en: "CloudFront verifies signed URLs with an RSA or ECDSA public key of a signer, not with IAM access keys."
      fr: "CloudFront vérifie les URL signées avec une clé publique RSA ou ECDSA d'un signataire, pas avec des clés d'accès IAM."
    d:
      en: "An ACM certificate provides TLS for the distribution; CloudFront does not use it to verify signed URLs."
      fr: "Un certificat ACM fournit le TLS de la distribution ; CloudFront ne l'utilise pas pour vérifier les URL signées."
references:
  - title: Specify signers that can create signed URLs and signed cookies
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-trusted-signers.html
