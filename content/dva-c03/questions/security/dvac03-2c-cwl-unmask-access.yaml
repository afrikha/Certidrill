id: dvac03-2c-cwl-unmask-access
objective: "2.2.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company applied a data protection policy to an Amazon CloudWatch Logs log group so that customer phone numbers are masked. During incidents, the on-call engineers must be able to see the original phone numbers in specific log events. All other users must continue to see the masked values.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise a appliqué une politique de protection des données à un groupe de journaux Amazon CloudWatch Logs afin que les numéros de téléphone des clients soient masqués. Lors des incidents, les ingénieurs d'astreinte doivent pouvoir voir les numéros d'origine dans certains événements de journal. Tous les autres utilisateurs doivent continuer à voir les valeurs masquées.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Grant the on-call engineers' IAM role the logs:Unmask permission on the log group.", fr: "Accorder au rôle IAM des ingénieurs d'astreinte l'autorisation logs:Unmask sur le groupe de journaux." } }
    - { id: b, text: { en: "Grant the on-call engineers' IAM role kms:Decrypt on the AWS KMS key that encrypts the log group.", fr: "Accorder au rôle IAM des ingénieurs d'astreinte kms:Decrypt sur la clé AWS KMS qui chiffre le groupe de journaux." } }
    - { id: c, text: { en: "Delete the data protection policy at the start of each incident, and create it again when the incident is closed.", fr: "Supprimer la politique de protection des données au début de chaque incident, et la recréer à la clôture de l'incident." } }
    - { id: d, text: { en: "Have the engineers run aws logs get-log-events with the --unmask option, or use the unmask command in CloudWatch Logs Insights.", fr: "Faire exécuter par les ingénieurs aws logs get-log-events avec l'option --unmask, ou utiliser la commande unmask dans CloudWatch Logs Insights." } }
    - { id: e, text: { en: "Grant the on-call engineers' IAM role logs:GetDataProtectionPolicy on the log group so that masking is skipped.", fr: "Accorder au rôle IAM des ingénieurs d'astreinte logs:GetDataProtectionPolicy sur le groupe de journaux pour que le masquage soit ignoré." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Masked data can be viewed only by principals that have the logs:Unmask permission. Those principals still see masked values by default and must explicitly request the original values, for example with the --unmask option of get-log-events or the unmask command in Logs Insights."
    fr: "Les données masquées ne peuvent être vues que par les principaux disposant de l'autorisation logs:Unmask. Ces principaux voient tout de même les valeurs masquées par défaut et doivent demander explicitement les valeurs d'origine, par exemple avec l'option --unmask de get-log-events ou la commande unmask dans Logs Insights."
  options:
    b:
      en: "The KMS key controls access to the encrypted log data at rest; masking is applied independently, so key access does not reveal masked values."
      fr: "La clé KMS contrôle l'accès aux journaux chiffrés au repos ; le masquage s'applique indépendamment : l'accès à la clé ne révèle pas les valeurs masquées."
    c:
      en: "Events ingested while the policy existed stay masked, and events ingested without the policy would be visible to all users."
      fr: "Les événements ingérés pendant que la politique existait restent masqués, et ceux ingérés sans la politique seraient visibles par tous les utilisateurs."
    e:
      en: "logs:GetDataProtectionPolicy only reads the policy document; it does not reveal masked data."
      fr: "logs:GetDataProtectionPolicy ne fait que lire le document de politique ; il ne révèle pas les données masquées."
references:
  - title: Help protect sensitive log data with masking
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
  - title: get-log-events
    url: https://docs.aws.amazon.com/cli/latest/reference/logs/get-log-events.html
