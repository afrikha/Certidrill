id: dvac03-2b-s3-default-sse-kms
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application uploads objects to a new Amazon S3 bucket without any encryption header. A compliance rule requires every new object to be encrypted at rest with a key whose use is logged in AWS CloudTrail and whose key policy the company controls. The application code must not change.

    Which solution will meet these requirements?
  fr: |
    Une application charge des objets dans un nouveau compartiment Amazon S3 sans aucun en-tête de chiffrement. Une règle de conformité exige que chaque nouvel objet soit chiffré au repos avec une clé dont l'utilisation est journalisée dans AWS CloudTrail et dont l'entreprise contrôle la politique de clé. Le code de l'application ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure the default encryption of the bucket to use SSE-KMS with a customer managed key.", fr: "Configurer le chiffrement par défaut du compartiment pour utiliser SSE-KMS avec une clé gérée par le client." }
    - id: b
      text: { en: "Keep the SSE-S3 encryption that Amazon S3 applies to every new object by default.", fr: "Conserver le chiffrement SSE-S3 qu'Amazon S3 applique par défaut à chaque nouvel objet." }
    - id: c
      text: { en: "Configure the default encryption of the bucket to use SSE-KMS with the AWS managed key aws/s3.", fr: "Configurer le chiffrement par défaut du compartiment pour utiliser SSE-KMS avec la clé gérée par AWS aws/s3." }
    - id: d
      text: { en: "Add a bucket policy that denies s3:PutObject requests whose x-amz-server-side-encryption header is not aws:kms.", fr: "Ajouter une politique de compartiment qui refuse les requêtes s3:PutObject dont l'en-tête x-amz-server-side-encryption n'est pas aws:kms." }
answer: { optionId: a }
explanation:
  correct:
    en: "Default encryption applies to new uploads that do not specify encryption, so no code change is needed. With SSE-KMS and a customer managed key, every use of the key is an AWS KMS call recorded in CloudTrail, and the company writes and controls the key policy."
    fr: "Le chiffrement par défaut s'applique aux nouveaux chargements qui ne spécifient pas de chiffrement : aucune modification du code n'est nécessaire. Avec SSE-KMS et une clé gérée par le client, chaque utilisation de la clé est un appel AWS KMS enregistré dans CloudTrail, et l'entreprise rédige et contrôle la politique de clé."
  options:
    b:
      en: "SSE-S3 uses keys that Amazon S3 manages, so the company controls no key policy and key use does not appear as KMS events in CloudTrail."
      fr: "SSE-S3 utilise des clés gérées par Amazon S3 : l'entreprise ne contrôle aucune politique de clé et l'utilisation des clés n'apparaît pas sous forme d'événements KMS dans CloudTrail."
    c:
      en: "The key policy of an AWS managed key is set by AWS and cannot be changed, which fails the requirement to control the key policy."
      fr: "La politique de clé d'une clé gérée par AWS est définie par AWS et ne peut pas être modifiée, ce qui ne respecte pas l'exigence de contrôle de la politique de clé."
    d:
      en: "The application sends no encryption header, so this policy would reject its uploads unless the code changes."
      fr: "L'application n'envoie aucun en-tête de chiffrement : cette politique rejetterait ses chargements sauf modification du code."
references:
  - title: Configuring default encryption
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/default-bucket-encryption.html
  - title: Using server-side encryption with AWS KMS keys (SSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html
