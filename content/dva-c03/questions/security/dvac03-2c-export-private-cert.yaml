id: dvac03-2c-export-private-cert
objective: "2.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has a general-purpose CA in AWS Private CA. A developer must install a TLS certificate for dev-api.corp.internal on an NGINX server that runs on an Amazon EC2 instance. The certificate must be issued by the company's private CA and managed in AWS Certificate Manager (ACM), and the developer needs the certificate, the chain, and the private key as files.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise dispose d'une CA en mode général dans AWS Private CA. Un développeur doit installer un certificat TLS pour dev-api.corp.internal sur un serveur NGINX qui s'exécute sur une instance Amazon EC2. Le certificat doit être émis par la CA privée de l'entreprise et géré dans AWS Certificate Manager (ACM), et le développeur a besoin du certificat, de la chaîne et de la clé privée sous forme de fichiers.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run aws acm request-certificate with --domain-name dev-api.corp.internal and --certificate-authority-arn set to the ARN of the private CA.", fr: "Exécuter aws acm request-certificate avec --domain-name dev-api.corp.internal et --certificate-authority-arn défini sur l'ARN de la CA privée." } }
    - { id: b, text: { en: "Create the CNAME record that ACM provides for DNS validation of dev-api.corp.internal in the company's private hosted zone.", fr: "Créer, dans la zone hébergée privée de l'entreprise, l'enregistrement CNAME fourni par ACM pour la validation DNS de dev-api.corp.internal." } }
    - { id: c, text: { en: "Run aws acm export-certificate with the certificate ARN and a passphrase, and save the certificate, the chain, and the encrypted private key.", fr: "Exécuter aws acm export-certificate avec l'ARN du certificat et une phrase secrète, et enregistrer le certificat, la chaîne et la clé privée chiffrée." } }
    - { id: d, text: { en: "Run aws acm get-certificate with the certificate ARN, and save the certificate, the chain, and the private key that it returns.", fr: "Exécuter aws acm get-certificate avec l'ARN du certificat, et enregistrer le certificat, la chaîne et la clé privée renvoyés." } }
    - { id: e, text: { en: "Run aws acm import-certificate with a key generated on the instance, so that ACM signs the certificate with the private CA.", fr: "Exécuter aws acm import-certificate avec une clé générée sur l'instance, pour qu'ACM signe le certificat avec la CA privée." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Specifying --certificate-authority-arn makes ACM request a private certificate signed by that AWS Private CA; private certificates do not go through DNS or email domain validation. export-certificate then returns the certificate, the certificate chain, and the private key encrypted with the passphrase, ready to install on the server."
    fr: "Indiquer --certificate-authority-arn fait demander par ACM un certificat privé signé par cette AWS Private CA ; les certificats privés ne passent pas par la validation de domaine DNS ou par e-mail. export-certificate renvoie ensuite le certificat, la chaîne de certificats et la clé privée chiffrée avec la phrase secrète, prêts à être installés sur le serveur."
  options:
    b:
      en: "DNS validation is used for public certificates; a private certificate is issued by the private CA without domain validation."
      fr: "La validation DNS sert aux certificats publics ; un certificat privé est émis par la CA privée sans validation de domaine."
    d:
      en: "get-certificate returns the certificate and its chain but never the private key; export-certificate is needed for the key."
      fr: "get-certificate renvoie le certificat et sa chaîne, jamais la clé privée ; export-certificate est nécessaire pour la clé."
    e:
      en: "import-certificate stores a certificate that was issued elsewhere; it does not ask the private CA to sign anything, and ACM does not renew imported certificates."
      fr: "import-certificate stocke un certificat émis ailleurs ; il ne demande aucune signature à la CA privée, et ACM ne renouvelle pas les certificats importés."
references:
  - title: Request a private certificate in AWS Certificate Manager
    url: https://docs.aws.amazon.com/acm/latest/userguide/gs-acm-request-private.html
  - title: Export an AWS Certificate Manager private certificate
    url: https://docs.aws.amazon.com/acm/latest/userguide/export-private.html
