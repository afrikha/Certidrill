id: dvac03-2d-unmask-permission
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data protection policy masks personal data in a CloudWatch Logs log group that stores the transcripts of an AI chatbot. During an incident, a security investigator must see the original values of some log events. All other developers must keep seeing masked values.

    Which solution will meet these requirements?
  fr: |
    Une politique de protection des données masque les données personnelles dans un groupe de journaux CloudWatch Logs qui stocke les transcriptions d'un chatbot d'IA. Lors d'un incident, une enquêtrice de sécurité doit voir les valeurs d'origine de certains événements du journal. Tous les autres développeurs doivent continuer à voir les valeurs masquées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Grant the investigator the logs:Unmask permission, and have the investigator use unmask(@message) in a CloudWatch Logs Insights query.", fr: "Accorder à l'enquêtrice l'autorisation logs:Unmask, et lui faire utiliser unmask(@message) dans une requête CloudWatch Logs Insights." } }
    - { id: b, text: { en: "Grant the investigator kms:Decrypt on the log group's KMS key, and have the investigator read the events with the GetLogEvents API.", fr: "Accorder à l'enquêtrice kms:Decrypt sur la clé KMS du groupe de journaux, et lui faire lire les événements avec l'API GetLogEvents." } }
    - { id: c, text: { en: "Grant the investigator the logs:GetDataProtectionPolicy permission, and have the investigator view the events in the console.", fr: "Accorder à l'enquêtrice l'autorisation logs:GetDataProtectionPolicy, et lui faire consulter les événements dans la console." } }
    - { id: d, text: { en: "Remove the data protection policy from the log group during the investigation, then attach it again afterward.", fr: "Retirer la politique de protection des données du groupe de journaux pendant l'enquête, puis la rattacher ensuite." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Only principals with the logs:Unmask permission can view unmasked data. The investigator can then use unmask(@message) in Logs Insights (or the unmask parameter of GetLogEvents and FilterLogEvents), while other users keep seeing masked values."
    fr: "Seuls les principaux disposant de l'autorisation logs:Unmask peuvent consulter les données non masquées. L'enquêtrice peut alors utiliser unmask(@message) dans Logs Insights (ou le paramètre unmask de GetLogEvents et FilterLogEvents), tandis que les autres utilisateurs continuent de voir les valeurs masquées."
  options:
    b:
      en: "KMS permissions let a principal read encrypted log data, but masked values stay masked without logs:Unmask."
      fr: "Les autorisations KMS permettent de lire des données de journal chiffrées, mais les valeurs masquées restent masquées sans logs:Unmask."
    c:
      en: "This permission lets the investigator read the policy document, not the unmasked data."
      fr: "Cette autorisation permet de lire le document de politique, pas les données non masquées."
    d:
      en: "Removing the policy would affect every user of the log group, so other developers would no longer be protected."
      fr: "Retirer la politique concernerait tous les utilisateurs du groupe de journaux : les autres développeurs ne seraient plus protégés."
references:
  - title: View unmasked data
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data-viewunmasked.html
