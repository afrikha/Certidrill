id: dvac03-2b-dns-validation-renewal
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany uses a public certificate from AWS Certificate Manager (ACM) on an Application Load Balancer. The certificate was validated by email, and each renewal waits until someone approves a validation email; once, the approval was missed. The domain is hosted in Amazon Route 53. The company wants renewals to happen without any manual action.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise un certificat public d'AWS Certificate Manager (ACM) sur un Application Load Balancer. Le certificat a été validé par e-mail, et chaque renouvellement attend qu'une personne approuve un e-mail de validation ; une fois, l'approbation a été oubliée. Le domaine est hébergé dans Amazon Route 53. L'entreprise veut que les renouvellements se fassent sans aucune action manuelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Export the certificate, and import it back into ACM so that ACM tracks and handles its expiration.", fr: "Exporter le certificat, puis le réimporter dans ACM pour qu'ACM suive et gère son expiration." }
    - id: b
      text: { en: "Create an Amazon CloudWatch alarm on the DaysToExpiry metric that notifies the team.", fr: "Créer une alarme Amazon CloudWatch sur la métrique DaysToExpiry qui avertit l'équipe." }
    - id: c
      text: { en: "Issue a private certificate for the domain from AWS Private CA, and use it on the listener.", fr: "Émettre un certificat privé pour le domaine à partir d'AWS Private CA, et l'utiliser sur l'écouteur." }
    - id: d
      text: { en: "Replace the certificate with a DNS-validated certificate, and keep the ACM CNAME record in Route 53.", fr: "Remplacer le certificat par un certificat validé par DNS, et conserver l'enregistrement CNAME d'ACM dans Route 53." }
answer: { optionId: d }
explanation:
  correct:
    en: "With DNS validation, ACM renews a certificate automatically as long as the certificate is in use and the validation CNAME record stays in place. In Route 53 the record can be created from the ACM console, and it needs to be added only once."
    fr: "Avec la validation DNS, ACM renouvelle automatiquement un certificat tant qu'il est utilisé et que l'enregistrement CNAME de validation reste en place. Dans Route 53, l'enregistrement peut être créé depuis la console ACM, et il ne doit être ajouté qu'une seule fois."
  options:
    a:
      en: "Imported certificates are never renewed by ACM, so this makes renewal fully manual."
      fr: "ACM ne renouvelle jamais les certificats importés : cette option rend le renouvellement entièrement manuel."
    b:
      en: "An alarm warns the team before expiration, but someone still has to approve the renewal."
      fr: "Une alarme avertit l'équipe avant l'expiration, mais une personne doit toujours approuver le renouvellement."
    c:
      en: "Public clients do not trust certificates from a private CA, so the site would show certificate errors."
      fr: "Les clients publics n'approuvent pas les certificats d'une autorité de certification privée : le site afficherait des erreurs de certificat."
references:
  - title: AWS Certificate Manager DNS validation
    url: https://docs.aws.amazon.com/acm/latest/userguide/dns-validation.html
