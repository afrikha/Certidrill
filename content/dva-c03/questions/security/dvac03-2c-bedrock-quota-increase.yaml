id: dvac03-2c-bedrock-quota-increase
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A document summarization service uses on-demand inference in Amazon Bedrock. After a new customer was onboarded, the steady traffic of the service exceeds the tokens-per-minute quota of the model in the account and Region, and many requests fail with ThrottlingException even after retries with exponential backoff. The quota is marked as adjustable.

    What should the developer do to obtain more sustained throughput for this model?
  fr: |
    Un service de synthèse de documents utilise l'inférence à la demande dans Amazon Bedrock. Après l'arrivée d'un nouveau client, le trafic régulier du service dépasse le quota de jetons par minute du modèle pour le compte et la Région, et de nombreuses requêtes échouent avec ThrottlingException, même après des nouvelles tentatives avec backoff exponentiel. Le quota est indiqué comme ajustable.

    Que doit faire le développeur pour obtenir un débit soutenu plus élevé pour ce modèle ?
body:
  options:
    - id: a
      text: { en: "Create a separate IAM role for each Lambda function that calls the model, so that each role receives its own quota.", fr: "Créer un rôle IAM distinct pour chaque fonction Lambda qui appelle le modèle, afin que chaque rôle reçoive son propre quota." }
    - id: b
      text: { en: "Switch the service from IAM role credentials to an Amazon Bedrock API key, so that requests are counted against a separate quota.", fr: "Faire passer le service des informations d'identification du rôle IAM à une clé d'API Amazon Bedrock, afin que les requêtes soient comptées sur un quota distinct." }
    - id: c
      text: { en: "Disable the retries in the SDK client configuration, and resend failed requests immediately from the application code.", fr: "Désactiver les nouvelles tentatives dans la configuration du client du SDK, et renvoyer immédiatement les requêtes en échec depuis le code de l'application." }
    - id: d
      text: { en: "Request an increase of the model's tokens-per-minute quota for Amazon Bedrock in the Service Quotas console.", fr: "Demander une augmentation du quota de jetons par minute du modèle pour Amazon Bedrock dans la console Service Quotas." }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Bedrock limits on-demand inference with per-model quotas, mostly in tokens per minute, for each account and Region. Quotas are not raised automatically: for an adjustable quota, the developer selects Amazon Bedrock in the Service Quotas console and requests an increase."
    fr: "Amazon Bedrock limite l'inférence à la demande avec des quotas par modèle, surtout en jetons par minute, pour chaque compte et chaque Région. Les quotas ne sont pas relevés automatiquement : pour un quota ajustable, le développeur sélectionne Amazon Bedrock dans la console Service Quotas et demande une augmentation."
  options:
    a:
      en: "The quota applies to the account and Region, not to each IAM role, so more roles do not add throughput."
      fr: "Le quota s'applique au compte et à la Région, pas à chaque rôle IAM : davantage de rôles n'ajoutent pas de débit."
    b:
      en: "An API key only changes how requests are authenticated; they still count against the same model quota of the account and Region."
      fr: "Une clé d'API ne change que la façon dont les requêtes sont authentifiées ; elles comptent toujours sur le même quota de modèle du compte et de la Région."
    c:
      en: "Immediate resends without backoff increase the request rate and make throttling worse; they do not raise the quota."
      fr: "Des renvois immédiats sans backoff augmentent le débit de requêtes et aggravent la limitation ; ils ne relèvent pas le quota."
references:
  - title: Request an increase for Amazon Bedrock quotas
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/quotas-increase.html
