id: dvac03-2c-bedrock-ec2-credentials
objective: "2.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A developer is deploying a Python application to Amazon EC2 instances. The application uses the AWS SDK for Python (Boto3) to call the Amazon Bedrock Converse API on two specific models. The company wants the MOST secure way to give the application access to Amazon Bedrock.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un développeur déploie une application Python sur des instances Amazon EC2. L'application utilise le kit AWS SDK pour Python (Boto3) pour appeler l'API Amazon Bedrock Converse sur deux modèles précis. L'entreprise veut le moyen le PLUS sécurisé de donner à l'application l'accès à Amazon Bedrock.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a long-term Amazon Bedrock API key and set it in the AWS_BEARER_TOKEN_BEDROCK environment variable on each instance.", fr: "Créer une clé d'API Amazon Bedrock à long terme et la définir dans la variable d'environnement AWS_BEARER_TOKEN_BEDROCK sur chaque instance." } }
    - { id: b, text: { en: "Attach an IAM role through an instance profile, with a policy that allows bedrock:InvokeModel only on the two model ARNs.", fr: "Attacher un rôle IAM via un profil d'instance, avec une politique qui n'autorise bedrock:InvokeModel que sur les ARN des deux modèles." } }
    - { id: c, text: { en: "Create the Boto3 client without explicit credentials, so that the SDK default credential provider chain obtains the role's credentials.", fr: "Créer le client Boto3 sans informations d'identification explicites, pour que la chaîne de fournisseurs d'informations d'identification par défaut du SDK obtienne celles du rôle." } }
    - { id: d, text: { en: "Create an IAM user with the AmazonBedrockFullAccess policy, and store its access keys in the ~/.aws/credentials file of each instance.", fr: "Créer un utilisateur IAM avec la politique AmazonBedrockFullAccess, et stocker ses clés d'accès dans le fichier ~/.aws/credentials de chaque instance." } }
    - { id: e, text: { en: "Attach the AmazonBedrockFullAccess managed policy to the instance profile role so that the application can call any model.", fr: "Attacher la politique gérée AmazonBedrockFullAccess au rôle du profil d'instance pour que l'application puisse appeler n'importe quel modèle." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "An instance profile delivers temporary, automatically rotated credentials to the instance, and a policy scoped to the two model ARNs follows least privilege; Converse is authorized by bedrock:InvokeModel. Boto3 finds the role's credentials through its default credential provider chain, so no credential is stored in code or on disk."
    fr: "Un profil d'instance fournit à l'instance des informations d'identification temporaires renouvelées automatiquement, et une politique limitée aux ARN des deux modèles respecte le moindre privilège ; Converse est autorisé par bedrock:InvokeModel. Boto3 trouve les informations d'identification du rôle via sa chaîne de fournisseurs par défaut : aucune information d'identification n'est stockée dans le code ni sur disque."
  options:
    a:
      en: "Long-term API keys are meant for exploration only, and a key in an environment variable is a long-lived credential on every instance."
      fr: "Les clés d'API à long terme sont réservées à l'exploration, et une clé dans une variable d'environnement est une information d'identification de longue durée sur chaque instance."
    d:
      en: "Long-term access keys stored on disk can leak, and the full-access policy grants far more than the two models."
      fr: "Des clés d'accès à long terme stockées sur disque peuvent fuiter, et la politique d'accès complet accorde bien plus que les deux modèles."
    e:
      en: "A full-access policy allows every model and many management actions, which is not least privilege."
      fr: "Une politique d'accès complet autorise tous les modèles et de nombreuses actions de gestion, ce qui ne respecte pas le moindre privilège."
references:
  - title: Identity-based policy examples for Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/security_iam_id-based-policy-examples.html
  - title: Inference using Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
