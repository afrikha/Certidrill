id: dvac03-2d-return-control
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's Amazon Bedrock agent must update records in an internal system that only the company's application server can reach, with the signed-in user's own session. After the agent collects the parameters, the application itself must run the update. The developer does not want to deploy a Lambda function for this action.

    Which solution will meet these requirements?
  fr: |
    L'agent Amazon Bedrock d'une entreprise doit mettre à jour des enregistrements dans un système interne que seul le serveur d'applications de l'entreprise peut atteindre, avec la session propre de l'utilisateur connecté. Une fois que l'agent a recueilli les paramètres, c'est l'application elle-même qui doit effectuer la mise à jour. Le développeur ne veut pas déployer de fonction Lambda pour cette action.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set requireConfirmation to ENABLED for the action group's function so that the user approves each update.", fr: "Définir requireConfirmation sur ENABLED pour la fonction du groupe d'actions afin que l'utilisateur approuve chaque mise à jour." } }
    - { id: b, text: { en: "Set customControl to RETURN_CONTROL in the actionGroupExecutor, and send the result back in the next InvokeAgent call.", fr: "Définir customControl sur RETURN_CONTROL dans l'actionGroupExecutor, et renvoyer le résultat lors de l'appel InvokeAgent suivant." } }
    - { id: c, text: { en: "Pass the user's session token in sessionAttributes so that the agent calls the internal system directly with that token.", fr: "Passer le jeton de session de l'utilisateur dans sessionAttributes afin que l'agent appelle directement le système interne avec ce jeton." } }
    - { id: d, text: { en: "Attach the action group's Lambda function to the VPC of the internal system and give it an interface VPC endpoint.", fr: "Rattacher la fonction Lambda du groupe d'actions au VPC du système interne et lui donner un point de terminaison de VPC d'interface." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With return of control, InvokeAgent returns a returnControl object with the invocationId and the parameters elicited from the user, and no Lambda function is needed. The application runs the action in its own environment and sends the result in sessionState.returnControlInvocationResults with the same invocationId."
    fr: "Avec le retour de contrôle, InvokeAgent renvoie un objet returnControl avec l'invocationId et les paramètres recueillis auprès de l'utilisateur, et aucune fonction Lambda n'est nécessaire. L'application exécute l'action dans son propre environnement et renvoie le résultat dans sessionState.returnControlInvocationResults avec le même invocationId."
  options:
    a:
      en: "User confirmation adds an approval step, but the requirement is for the application to run the action itself without a Lambda function."
      fr: "La confirmation utilisateur ajoute une étape d'approbation, mais l'exigence est que l'application exécute elle-même l'action sans fonction Lambda."
    c:
      en: "Session attributes are passed to the action group's executor; the agent does not call external systems itself, and a user token should not travel this way."
      fr: "Les attributs de session sont transmis à l'exécuteur du groupe d'actions ; l'agent n'appelle pas lui-même de systèmes externes, et un jeton utilisateur ne doit pas circuler ainsi."
    d:
      en: "This still requires a Lambda function, which the developer does not want, and the application would not run the action itself."
      fr: "Cela nécessite toujours une fonction Lambda, dont le développeur ne veut pas, et l'application n'exécuterait pas elle-même l'action."
references:
  - title: Return control to the agent developer by sending elicited information in an InvokeAgent response
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-returncontrol.html
