id: dvac03-2b-alb-end-to-end-tls
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A web application runs on Amazon EC2 instances behind an Application Load Balancer (ALB). The ALB has an HTTP listener on port 80 that forwards to a target group that uses HTTP on port 80. A new requirement states that traffic must be encrypted between clients and the ALB and between the ALB and the instances. The instances can use a self-signed certificate.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application web s'exécute sur des instances Amazon EC2 derrière un Application Load Balancer (ALB). L'ALB possède un écouteur HTTP sur le port 80 qui transfère vers un groupe cible utilisant HTTP sur le port 80. Une nouvelle exigence impose que le trafic soit chiffré entre les clients et l'ALB, et entre l'ALB et les instances. Les instances peuvent utiliser un certificat auto-signé.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Place a Network Load Balancer with a TCP listener on port 443 in front of the ALB.", fr: "Placer devant l'ALB un Network Load Balancer avec un écouteur TCP sur le port 443." }
    - id: b
      text: { en: "Add an HTTPS listener on port 443 to the ALB that uses a certificate from AWS Certificate Manager.", fr: "Ajouter à l'ALB un écouteur HTTPS sur le port 443 qui utilise un certificat d'AWS Certificate Manager." }
    - id: c
      text: { en: "Turn on stickiness with an application-based cookie in the existing target group.", fr: "Activer la persistance avec un cookie basé sur l'application dans le groupe cible existant." }
    - id: d
      text: { en: "Create a target group that uses HTTPS, install a self-signed certificate on the instances, and forward the listener to it.", fr: "Créer un groupe cible qui utilise HTTPS, installer un certificat auto-signé sur les instances, et y transférer l'écouteur." }
    - id: e
      text: { en: "Change the security group of the instances to allow inbound traffic only from the ALB on port 443.", fr: "Modifier le groupe de sécurité des instances pour n'autoriser le trafic entrant que depuis l'ALB sur le port 443." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "An HTTPS listener with an ACM certificate terminates TLS from clients at the ALB. A target group that uses the HTTPS protocol makes the ALB open a new TLS connection to each instance; the ALB does not validate target certificates, so a self-signed certificate on the instances is enough."
    fr: "Un écouteur HTTPS avec un certificat ACM termine à l'ALB le TLS des clients. Un groupe cible qui utilise le protocole HTTPS fait ouvrir par l'ALB une nouvelle connexion TLS vers chaque instance ; l'ALB ne valide pas les certificats des cibles, un certificat auto-signé sur les instances suffit donc."
  options:
    a:
      en: "A TCP listener on the Network Load Balancer passes traffic through without encrypting it, and the ALB would still use HTTP."
      fr: "Un écouteur TCP sur le Network Load Balancer fait transiter le trafic sans le chiffrer, et l'ALB utiliserait toujours HTTP."
    c:
      en: "Stickiness routes a client to the same target; it does not encrypt any connection."
      fr: "La persistance dirige un client vers la même cible ; elle ne chiffre aucune connexion."
    e:
      en: "Restricting the source and port filters traffic but does not encrypt it."
      fr: "Restreindre la source et le port filtre le trafic mais ne le chiffre pas."
references:
  - title: Target groups for your Application Load Balancers
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html
  - title: Create an HTTPS listener for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html
