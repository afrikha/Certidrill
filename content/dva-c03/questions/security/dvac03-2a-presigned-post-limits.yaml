id: dvac03-2a-presigned-post-limits
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A web application lets users upload profile pictures from an HTML form directly to an Amazon S3 bucket. Each file must be smaller than 5 MB and must be stored under the prefix avatars/ followed by the user's ID. S3 must reject uploads that break these rules before it stores the object.

    Which solution will meet these requirements?
  fr: |
    Une application web permet aux utilisateurs de charger des photos de profil depuis un formulaire HTML directement dans un compartiment Amazon S3. Chaque fichier doit faire moins de 5 Mo et doit être stocké sous le préfixe avatars/ suivi de l'ID de l'utilisateur. S3 doit rejeter les chargements qui enfreignent ces règles avant de stocker l'objet.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Generate a presigned PUT URL with ExpiresIn set to 60 seconds so that large files cannot finish uploading.", fr: "Générer une URL PUT présignée avec ExpiresIn défini à 60 secondes pour que les gros fichiers ne puissent pas finir leur chargement." } }
    - { id: b, text: { en: "Add an S3 Event Notification that invokes a Lambda function to delete objects larger than 5 MB.", fr: "Ajouter une notification d'événement S3 qui appelle une fonction Lambda pour supprimer les objets de plus de 5 Mo." } }
    - { id: c, text: { en: "Return the temporary credentials of a role limited to avatars/* and let the browser call PutObject.", fr: "Renvoyer les informations d'identification temporaires d'un rôle limité à avatars/* et laisser le navigateur appeler PutObject." } }
    - { id: d, text: { en: "Generate a presigned POST with generate_presigned_post and conditions on content-length-range and on the $key prefix.", fr: "Générer un POST présigné avec generate_presigned_post et des conditions sur content-length-range et sur le préfixe de $key." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A presigned POST returns a URL and form fields that contain a signed policy document. S3 checks the upload against the policy: content-length-range sets the minimum and maximum size in bytes, and a starts-with condition on $key enforces the prefix, so non-compliant uploads are rejected."
    fr: "Un POST présigné renvoie une URL et des champs de formulaire qui contiennent un document de politique signé. S3 vérifie le chargement par rapport à la politique : content-length-range fixe la taille minimale et maximale en octets, et une condition starts-with sur $key impose le préfixe ; les chargements non conformes sont rejetés."
  options:
    a:
      en: "The expiration limits when the upload can start, not the size of the file."
      fr: "L'expiration limite le moment où le chargement peut commencer, pas la taille du fichier."
    b:
      en: "The notification runs after S3 has stored the object, so the size is not enforced at upload time."
      fr: "La notification s'exécute après que S3 a stocké l'objet : la taille n'est pas imposée au moment du chargement."
    c:
      en: "IAM permissions can limit the key prefix but not the object size, and the browser would hold AWS credentials."
      fr: "Les autorisations IAM peuvent limiter le préfixe de la clé mais pas la taille de l'objet, et le navigateur détiendrait des informations d'identification AWS."
references:
  - title: HTML forms (AWS signature version 2)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/HTTPPOSTForms.html
