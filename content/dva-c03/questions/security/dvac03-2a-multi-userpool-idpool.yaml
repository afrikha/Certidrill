id: dvac03-2a-multi-userpool-idpool
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is building a mobile app. Users must sign in with an email address and a password or with their Facebook account. After sign-in, the app must upload files directly to an Amazon S3 bucket by using temporary AWS credentials that are specific to each user.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise développe une application mobile. Les utilisateurs doivent se connecter avec une adresse e-mail et un mot de passe ou avec leur compte Facebook. Après la connexion, l'application doit charger des fichiers directement dans un compartiment Amazon S3 à l'aide d'informations d'identification AWS temporaires propres à chaque utilisateur.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an Amazon Cognito user pool that has Facebook configured as a social identity provider.", fr: "Créer un groupe d'utilisateurs Amazon Cognito dans lequel Facebook est configuré comme fournisseur d'identité social." } }
    - { id: b, text: { en: "Create an IAM user for each app user and return the user's access keys after the first sign-in.", fr: "Créer un utilisateur IAM pour chaque utilisateur de l'application et renvoyer ses clés d'accès après la première connexion." } }
    - { id: c, text: { en: "Configure an API Gateway REST API with a Cognito user pool authorizer in front of the bucket.", fr: "Configurer une API REST API Gateway avec un mécanisme d'autorisation de groupe d'utilisateurs Cognito devant le compartiment." } }
    - { id: d, text: { en: "Create an Amazon Cognito identity pool that uses the user pool as an authentication provider.", fr: "Créer un groupe d'identités Amazon Cognito qui utilise le groupe d'utilisateurs comme fournisseur d'authentification." } }
    - { id: e, text: { en: "Enable IAM Identity Center and add Facebook as the external identity source of the app.", fr: "Activer IAM Identity Center et ajouter Facebook comme source d'identité externe de l'application." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The user pool is the directory for email and password users and federates Facebook sign-in, so the app always receives user pool tokens. The identity pool exchanges the user pool ID token for temporary credentials of an IAM role, and policies can use the identity ID to limit each user to their own data."
    fr: "Le groupe d'utilisateurs est l'annuaire des utilisateurs par e-mail et mot de passe et fédère la connexion Facebook : l'application reçoit toujours des jetons du groupe d'utilisateurs. Le groupe d'identités échange le jeton d'identification contre des informations d'identification temporaires d'un rôle IAM, et les politiques peuvent utiliser l'ID d'identité pour limiter chaque utilisateur à ses propres données."
  options:
    b:
      en: "IAM user access keys are long-term credentials, and one IAM user per app user does not scale."
      fr: "Les clés d'accès d'utilisateurs IAM sont des informations d'identification à long terme, et un utilisateur IAM par utilisateur d'application ne passe pas à l'échelle."
    c:
      en: "An authorizer protects API methods but gives the app no AWS credentials, and the uploads would no longer go directly to S3."
      fr: "Un mécanisme d'autorisation protège des méthodes d'API mais ne donne aucune information d'identification AWS à l'application, et les chargements n'iraient plus directement dans S3."
    e:
      en: "IAM Identity Center manages workforce access to AWS accounts and applications, not consumer sign-in for a mobile app."
      fr: "IAM Identity Center gère l'accès du personnel aux comptes AWS et aux applications, pas la connexion des clients d'une application mobile."
references:
  - title: User pool sign-in with third party identity providers
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-identity-federation.html
  - title: Identity pools authentication flow
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html
