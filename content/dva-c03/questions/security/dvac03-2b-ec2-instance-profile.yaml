id: dvac03-2b-ec2-instance-profile
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer is moving a Python application to Amazon EC2 instances. The application uses boto3 to read messages from an Amazon SQS queue. During development, the application used an access key that was stored in the ~/.aws/credentials file. The company forbids long-term credentials on instances and wants the credentials to rotate automatically without any code change.

    Which solution will meet these requirements?
  fr: |
    Un développeur migre une application Python vers des instances Amazon EC2. L'application utilise boto3 pour lire les messages d'une file d'attente Amazon SQS. Pendant le développement, l'application utilisait une clé d'accès stockée dans le fichier ~/.aws/credentials. L'entreprise interdit les informations d'identification à long terme sur les instances et veut que les informations d'identification soient renouvelées automatiquement sans aucune modification du code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the access key in Parameter Store as a SecureString parameter, and have the application read it at startup.", fr: "Stocker la clé d'accès dans Parameter Store sous forme de paramètre SecureString, et faire lire ce paramètre par l'application au démarrage." }
    - id: b
      text: { en: "Use an instance profile with an IAM role that has the SQS permissions, and delete the credentials file.", fr: "Utiliser un profil d'instance avec un rôle IAM doté des autorisations SQS, et supprimer le fichier credentials." }
    - id: c
      text: { en: "Keep the access key on the instances, and have the application call GetSessionToken with it every hour.", fr: "Conserver la clé d'accès sur les instances, et faire appeler GetSessionToken par l'application avec cette clé toutes les heures." }
    - id: d
      text: { en: "Pass the access key to the instances in user data, and export it as environment variables at boot.", fr: "Transmettre la clé d'accès aux instances dans les données utilisateur, et l'exporter en variables d'environnement au démarrage." }
answer: { optionId: b }
explanation:
  correct:
    en: "An instance profile delivers the role's temporary credentials through the instance metadata service, and EC2 refreshes them before they expire. The boto3 default credential chain finds these credentials automatically when no other source is configured, so removing the credentials file is the only change."
    fr: "Un profil d'instance fournit les informations d'identification temporaires du rôle par le service de métadonnées d'instance, et EC2 les renouvelle avant leur expiration. La chaîne d'informations d'identification par défaut de boto3 les trouve automatiquement lorsqu'aucune autre source n'est configurée : supprimer le fichier credentials est la seule modification."
  options:
    a:
      en: "The access key stays a long-term credential, and reading it from Parameter Store requires a code change."
      fr: "La clé d'accès reste une information d'identification à long terme, et la lire depuis Parameter Store nécessite une modification du code."
    c:
      en: "The long-term access key remains on the instances, and the hourly GetSessionToken calls require a code change."
      fr: "La clé d'accès à long terme reste sur les instances, et les appels GetSessionToken horaires nécessitent une modification du code."
    d:
      en: "User data and environment variables still hold a long-term key, which is also readable by anyone who can view the instance user data."
      fr: "Les données utilisateur et les variables d'environnement contiennent toujours une clé à long terme, lisible en plus par toute personne qui peut consulter les données utilisateur de l'instance."
references:
  - title: Use an IAM role to grant permissions to applications running on Amazon EC2 instances
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2.html
