id: dvac03-2c-bedrock-marketplace-first-use
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer deploys an application to a new AWS account in a commercial Region. The application role allows only bedrock:InvokeModel on a third-party model that is sold through AWS Marketplace and that has never been used in the account. The first invocations fail with AccessDeniedException. The security team requires that the application role keeps least-privilege permissions after the model is available.

    Which solution will meet these requirements?
  fr: |
    Un développeur déploie une application dans un nouveau compte AWS, dans une Région commerciale. Le rôle de l'application n'autorise que bedrock:InvokeModel sur un modèle tiers vendu via AWS Marketplace et jamais utilisé dans le compte. Les premières invocations échouent avec AccessDeniedException. L'équipe de sécurité exige que le rôle de l'application conserve des autorisations de moindre privilège une fois le modèle disponible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Open the Model access page of the Amazon Bedrock console in the Region, and submit an access request for the model on behalf of the role.", fr: "Ouvrir la page Model access de la console Amazon Bedrock dans la Région, et soumettre une demande d'accès au modèle pour le compte du rôle." }
    - id: b
      text: { en: "Have an administrator with the aws-marketplace Subscribe, Unsubscribe, and ViewSubscriptions permissions invoke the model once.", fr: "Faire invoquer une fois le modèle par un administrateur disposant des autorisations aws-marketplace Subscribe, Unsubscribe et ViewSubscriptions." }
    - id: c
      text: { en: "Attach the AmazonBedrockFullAccess managed policy to the application role, so that the role can complete the subscription whenever it is needed.", fr: "Attacher la politique gérée AmazonBedrockFullAccess au rôle de l'application, pour que le rôle puisse finaliser l'abonnement chaque fois que nécessaire." }
    - id: d
      text: { en: "Submit the Anthropic first-time use form from the account, and wait until the agreement status is AVAILABLE before retrying.", fr: "Soumettre depuis le compte le formulaire de première utilisation d'Anthropic, et attendre que le statut de l'accord soit AVAILABLE avant de réessayer." }
answer: { optionId: b }
explanation:
  correct:
    en: "In commercial Regions, access to a third-party model is enabled on first use: the first invocation starts an AWS Marketplace subscription, which requires the aws-marketplace Subscribe, Unsubscribe, and ViewSubscriptions permissions. These permissions are needed only once per account, so an administrator can enable the model and the application keeps only bedrock:InvokeModel."
    fr: "Dans les Régions commerciales, l'accès à un modèle tiers est activé à la première utilisation : la première invocation lance un abonnement AWS Marketplace, qui exige les autorisations aws-marketplace Subscribe, Unsubscribe et ViewSubscriptions. Ces autorisations ne sont nécessaires qu'une fois par compte : un administrateur peut activer le modèle et l'application ne conserve que bedrock:InvokeModel."
  options:
    a:
      en: "In commercial Regions, there is no access request to submit on the Model access page; that page now applies only to AWS GovCloud (US)."
      fr: "Dans les Régions commerciales, il n'y a plus de demande d'accès à soumettre sur la page Model access ; cette page ne concerne désormais qu'AWS GovCloud (US)."
    c:
      en: "A broad managed policy would make the first call succeed, but it leaves the application role with far more permissions than it needs."
      fr: "Une politique gérée large ferait réussir le premier appel, mais laisserait au rôle de l'application bien plus d'autorisations que nécessaire."
    d:
      en: "The first-time use form concerns Anthropic models only; the model is from another provider and needs an AWS Marketplace subscription."
      fr: "Le formulaire de première utilisation ne concerne que les modèles Anthropic ; le modèle provient d'un autre fournisseur et nécessite un abonnement AWS Marketplace."
references:
  - title: Request access to models
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-access.html
