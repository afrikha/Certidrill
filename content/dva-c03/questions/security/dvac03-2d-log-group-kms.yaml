id: dvac03-2d-log-group-kms
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Lambda function in the us-east-1 Region writes AI chat transcripts to an existing CloudWatch Logs log group. A new requirement states that the log group's data must be encrypted with a customer managed AWS KMS key.

    Which solution will meet this requirement?
  fr: |
    Une fonction Lambda de la Région us-east-1 écrit des transcriptions de conversations d'IA dans un groupe de journaux CloudWatch Logs existant. Une nouvelle exigence impose que les données du groupe de journaux soient chiffrées avec une clé AWS KMS gérée par le client.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Create an asymmetric KMS key, allow the CloudWatch Logs service principal in its key policy, and associate it with the log group.", fr: "Créer une clé KMS asymétrique, autoriser le principal de service CloudWatch Logs dans sa politique de clé, et l'associer au groupe de journaux." } }
    - { id: b, text: { en: "Encrypt the function's environment variables with a customer managed KMS key in the Lambda function configuration.", fr: "Chiffrer les variables d'environnement de la fonction avec une clé KMS gérée par le client dans la configuration de la fonction Lambda." } }
    - { id: c, text: { en: "Create a symmetric KMS key, allow logs.us-east-1.amazonaws.com in its key policy, and run the aws logs associate-kms-key command.", fr: "Créer une clé KMS symétrique, autoriser logs.us-east-1.amazonaws.com dans sa politique de clé, et exécuter la commande aws logs associate-kms-key." } }
    - { id: d, text: { en: "Attach a data protection policy to the log group that names the customer managed key in its Deidentify operation.", fr: "Attacher au groupe de journaux une politique de protection des données qui indique la clé gérée par le client dans son opération Deidentify." } }
answer: { optionId: c }
explanation:
  correct:
    en: "CloudWatch Logs encrypts a log group with a symmetric KMS key whose key policy allows the Regional CloudWatch Logs service principal. For an existing log group, the key is associated with the associate-kms-key command, and newly ingested data is then encrypted with it."
    fr: "CloudWatch Logs chiffre un groupe de journaux avec une clé KMS symétrique dont la politique de clé autorise le principal de service CloudWatch Logs régional. Pour un groupe de journaux existant, la clé est associée avec la commande associate-kms-key, et les données ingérées ensuite sont chiffrées avec elle."
  options:
    a:
      en: "CloudWatch Logs supports only symmetric KMS keys; an asymmetric key must not be used for log groups."
      fr: "CloudWatch Logs ne prend en charge que les clés KMS symétriques ; une clé asymétrique ne doit pas être utilisée pour les groupes de journaux."
    b:
      en: "This encrypts the function's environment variables, not the log data that the function writes to CloudWatch Logs."
      fr: "Cela chiffre les variables d'environnement de la fonction, pas les données de journal que la fonction écrit dans CloudWatch Logs."
    d:
      en: "A data protection policy masks sensitive data; its Deidentify operation takes an empty MaskConfig and does not encrypt the log group."
      fr: "Une politique de protection des données masque les données sensibles ; son opération Deidentify prend un MaskConfig vide et ne chiffre pas le groupe de journaux."
references:
  - title: Encrypt log data in CloudWatch Logs using AWS Key Management Service
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/encrypt-log-data-kms.html
