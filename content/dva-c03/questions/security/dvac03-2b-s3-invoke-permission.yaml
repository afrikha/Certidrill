id: dvac03-2b-s3-invoke-permission
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer uses the AWS CLI to configure an Amazon S3 event notification so that object uploads to a bucket invoke an AWS Lambda function in the same account. When the developer saves the notification configuration, Amazon S3 rejects it because it cannot validate the Lambda destination. The company requires the least privilege and protection against other AWS accounts invoking the function through Amazon S3.

    Which solution will meet these requirements?
  fr: |
    Un développeur utilise l'AWS CLI pour configurer une notification d'événement Amazon S3 afin que les chargements d'objets dans un compartiment appellent une fonction AWS Lambda du même compte. Lorsque le développeur enregistre la configuration de notification, Amazon S3 la rejette, car il ne parvient pas à valider la destination Lambda. L'entreprise exige le moindre privilège et une protection contre l'appel de la fonction par d'autres comptes AWS par l'intermédiaire d'Amazon S3.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add s3:PutBucketNotification to the function's execution role, and save the notification configuration again.", fr: "Ajouter s3:PutBucketNotification au rôle d'exécution de la fonction, puis enregistrer de nouveau la configuration de notification." }
    - id: b
      text: { en: "Add lambda:InvokeFunction on the function ARN to the function's execution role, with a condition on the bucket ARN.", fr: "Ajouter lambda:InvokeFunction sur l'ARN de la fonction au rôle d'exécution de la fonction, avec l'ARN du compartiment comme condition." }
    - id: c
      text: { en: "Add a resource-based policy statement that allows s3.amazonaws.com to invoke the function, with the bucket as source ARN and the account as source account.", fr: "Ajouter une instruction de politique basée sur les ressources qui autorise s3.amazonaws.com à appeler la fonction, avec le compartiment comme ARN source et le compte comme compte source." }
    - id: d
      text: { en: "Add a resource-based policy statement that allows s3.amazonaws.com to invoke the function, with no source ARN or source account condition.", fr: "Ajouter une instruction de politique basée sur les ressources qui autorise s3.amazonaws.com à appeler la fonction, sans condition d'ARN source ni de compte source." }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon S3 invokes the function asynchronously as a service principal, so the permission belongs in the function's resource-based policy (for example with aws lambda add-permission). A bucket ARN contains no account ID, and another account could create a bucket with the same name after a deletion, so the statement adds the source account in addition to the source ARN."
    fr: "Amazon S3 appelle la fonction de manière asynchrone en tant que principal de service ; l'autorisation se place donc dans la politique basée sur les ressources de la fonction (par exemple avec aws lambda add-permission). Un ARN de compartiment ne contient pas d'ID de compte et un autre compte pourrait créer un compartiment du même nom après une suppression : l'instruction ajoute donc le compte source en plus de l'ARN source."
  options:
    a:
      en: "The developer's own identity needs s3:PutBucketNotification to save the configuration; the function's execution role is not involved, and S3 still has no permission to invoke the function."
      fr: "C'est l'identité du développeur qui a besoin de s3:PutBucketNotification pour enregistrer la configuration ; le rôle d'exécution de la fonction n'intervient pas, et S3 n'a toujours pas l'autorisation d'appeler la fonction."
    b:
      en: "The execution role defines what the function can do, not which principals can invoke it, so Amazon S3 still cannot invoke the function."
      fr: "Le rôle d'exécution définit ce que la fonction peut faire, et non les principaux qui peuvent l'appeler : Amazon S3 ne peut toujours pas appeler la fonction."
    d:
      en: "A statement without conditions lets the S3 service invoke the function on behalf of any bucket in any account, which fails the least-privilege and confused deputy requirements."
      fr: "Une instruction sans condition permet au service S3 d'appeler la fonction pour n'importe quel compartiment de n'importe quel compte, ce qui ne respecte pas les exigences de moindre privilège et de protection contre l'adjoint confus."
references:
  - title: Working with resource-based policies in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/access-control-resource-based.html
  - title: Granting permissions to publish event notification messages to a destination
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/grant-destinations-permissions-to-s3.html
