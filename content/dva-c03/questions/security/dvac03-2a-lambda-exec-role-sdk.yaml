id: dvac03-2a-lambda-exec-role-sdk
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer is writing a Lambda function in Python that reads objects from an Amazon S3 bucket with Boto3. A teammate suggests adding the access keys of an IAM user to the function configuration so that the code can authenticate to S3.

    Which solution is the MOST secure?
  fr: |
    Un développeur écrit une fonction Lambda en Python qui lit des objets d'un compartiment Amazon S3 avec Boto3. Un collègue propose d'ajouter les clés d'accès d'un utilisateur IAM à la configuration de la fonction pour que le code puisse s'authentifier auprès de S3.

    Quelle solution est la PLUS sécurisée ?
body:
  options:
    - { id: a, text: { en: "Add the access keys as encrypted environment variables, and create the Boto3 client with these values.", fr: "Ajouter les clés d'accès comme variables d'environnement chiffrées et créer le client Boto3 avec ces valeurs." } }
    - { id: b, text: { en: "Store the access keys in AWS Systems Manager Parameter Store, and read them when the function starts.", fr: "Stocker les clés d'accès dans AWS Systems Manager Parameter Store et les lire au démarrage de la fonction." } }
    - { id: c, text: { en: "Call AWS STS AssumeRole on the execution role at the start of each invocation, and use the returned credentials.", fr: "Appeler AWS STS AssumeRole sur le rôle d'exécution au début de chaque appel et utiliser les informations d'identification renvoyées." } }
    - { id: d, text: { en: "Grant s3:GetObject to the function's execution role, and create the Boto3 client without passing credentials.", fr: "Accorder s3:GetObject au rôle d'exécution de la fonction et créer le client Boto3 sans lui passer d'informations d'identification." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Lambda assumes the execution role when it invokes the function and gives the runtime the role's temporary credentials. The SDK default credential chain finds them automatically, so the code signs S3 requests without any stored key."
    fr: "Lambda assume le rôle d'exécution quand il appelle la fonction et fournit à l'environnement d'exécution les informations d'identification temporaires du rôle. La chaîne d'identification par défaut du SDK les trouve automatiquement : le code signe les demandes S3 sans aucune clé stockée."
  options:
    a:
      en: "Encryption protects the values at rest, but they remain long-term credentials that must be rotated and can leak."
      fr: "Le chiffrement protège les valeurs au repos, mais elles restent des informations d'identification à long terme à renouveler, qui peuvent fuiter."
    b:
      en: "The keys remain long-term credentials, and the function already needs role credentials to read Parameter Store."
      fr: "Les clés restent des informations d'identification à long terme, et la fonction a déjà besoin des informations d'identification du rôle pour lire Parameter Store."
    c:
      en: "Lambda already assumes the execution role; AWS advises against calling sts:AssumeRole for it in the function code."
      fr: "Lambda assume déjà le rôle d'exécution ; AWS déconseille d'appeler sts:AssumeRole sur ce rôle dans le code de la fonction."
references:
  - title: Defining Lambda function permissions with an execution role
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
