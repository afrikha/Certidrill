id: dvac03-2b-explicit-deny
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application runs with an IAM role that has the following identity-based policy:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": "s3:*",
          "Resource": ["arn:aws:s3:::app-data", "arn:aws:s3:::app-data/*"]
        },
        {
          "Effect": "Deny",
          "Action": "s3:DeleteObject",
          "Resource": "arn:aws:s3:::app-data/audit/*"
        }
      ]
    }
    ```

    The bucket policy of app-data, in the same account, allows the role to call s3:DeleteObject on all objects in the bucket. The bucket does not use S3 Object Lock or versioning. The application calls DeleteObject for the key audit/2026-11.log.

    What is the result of the request?
  fr: |
    Une application s'exécute avec un rôle IAM qui possède la politique basée sur l'identité suivante :

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": "s3:*",
          "Resource": ["arn:aws:s3:::app-data", "arn:aws:s3:::app-data/*"]
        },
        {
          "Effect": "Deny",
          "Action": "s3:DeleteObject",
          "Resource": "arn:aws:s3:::app-data/audit/*"
        }
      ]
    }
    ```

    La politique de compartiment d'app-data, dans le même compte, autorise le rôle à appeler s3:DeleteObject sur tous les objets du compartiment. Le compartiment n'utilise ni S3 Object Lock ni la gestion des versions. L'application appelle DeleteObject pour la clé audit/2026-11.log.

    Quel est le résultat de la requête ?
body:
  options:
    - id: a
      text: { en: "The request succeeds, because the bucket policy explicitly allows s3:DeleteObject for the role.", fr: "La requête réussit, car la politique de compartiment autorise explicitement s3:DeleteObject pour le rôle." }
    - id: b
      text: { en: "The request succeeds, because the Allow statement appears first in the identity-based policy.", fr: "La requête réussit, car l'instruction Allow apparaît en premier dans la politique basée sur l'identité." }
    - id: c
      text: { en: "The request fails, because a bucket policy cannot grant permissions to a role in the same account.", fr: "La requête échoue, car une politique de compartiment ne peut pas accorder d'autorisations à un rôle du même compte." }
    - id: d
      text: { en: "The request fails, because an explicit deny in any applicable policy overrides every allow.", fr: "La requête échoue, car un refus explicite dans n'importe quelle politique applicable l'emporte sur toute autorisation." }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS evaluates all applicable policies together. The Deny statement matches s3:DeleteObject on audit/2026-11.log, and an explicit deny overrides the allows of both the identity-based policy and the bucket policy, so the request is denied."
    fr: "AWS évalue ensemble toutes les politiques applicables. L'instruction Deny correspond à s3:DeleteObject sur audit/2026-11.log, et un refus explicite l'emporte sur les autorisations de la politique basée sur l'identité comme de la politique de compartiment : la requête est refusée."
  options:
    a:
      en: "An allow in a resource-based policy never overrides an explicit deny in an identity-based policy."
      fr: "Une autorisation dans une politique basée sur les ressources ne l'emporte jamais sur un refus explicite dans une politique basée sur l'identité."
    b:
      en: "The order of statements has no effect on policy evaluation; an explicit deny wins wherever it appears."
      fr: "L'ordre des instructions n'a aucun effet sur l'évaluation des politiques ; un refus explicite l'emporte où qu'il se trouve."
    c:
      en: "Within one account, an allow in either the identity-based policy or the bucket policy is enough; the request fails only because of the explicit deny."
      fr: "Dans un même compte, une autorisation dans la politique basée sur l'identité ou dans la politique de compartiment suffit ; la requête échoue uniquement à cause du refus explicite."
references:
  - title: Policy evaluation logic
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html
