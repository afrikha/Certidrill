id: dvac03-2b-private-ca-internal
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's microservices call each other through internal Application Load Balancers by using host names in the private domain corp.internal, which is not a public DNS domain. The company needs TLS certificates for these names that the company's own clients trust and that are renewed automatically. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Les microservices d'AnyCompany s'appellent entre eux par des Application Load Balancers internes en utilisant des noms d'hôte du domaine privé corp.internal, qui n'est pas un domaine DNS public. L'entreprise a besoin pour ces noms de certificats TLS approuvés par ses propres clients et renouvelés automatiquement. La solution doit avoir la charge opérationnelle la plus FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Request public certificates in ACM for the corp.internal names, and validate them with DNS validation.", fr: "Demander dans ACM des certificats publics pour les noms corp.internal, et les valider par validation DNS." }
    - id: b
      text: { en: "Generate self-signed certificates with OpenSSL, and import them into ACM for the load balancers.", fr: "Générer des certificats auto-signés avec OpenSSL, et les importer dans ACM pour les équilibreurs de charge." }
    - id: c
      text: { en: "Create a CA in AWS Private CA, distribute its root certificate to the clients, and request ACM private certificates from it.", fr: "Créer une autorité de certification dans AWS Private CA, distribuer son certificat racine aux clients, et demander des certificats privés ACM issus de celle-ci." }
    - id: d
      text: { en: "Request exportable public certificates in ACM for the corp.internal names, and install them on the services.", fr: "Demander dans ACM des certificats publics exportables pour les noms corp.internal, et les installer sur les services." }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Private CA issues certificates for private names, and clients trust them once the private root certificate is in their trust store. A private certificate requested through ACM and associated with a load balancer is eligible for ACM managed renewal, so no manual renewal is needed."
    fr: "AWS Private CA émet des certificats pour des noms privés, et les clients les approuvent dès que le certificat racine privé figure dans leur magasin de confiance. Un certificat privé demandé par ACM et associé à un équilibreur de charge est éligible au renouvellement géré d'ACM : aucun renouvellement manuel n'est nécessaire."
  options:
    a:
      en: "A public CA cannot validate or issue certificates for a domain that does not exist in public DNS."
      fr: "Une autorité de certification publique ne peut ni valider ni émettre de certificats pour un domaine qui n'existe pas dans le DNS public."
    b:
      en: "Imported certificates are not renewed by ACM, and self-signed certificates must each be trusted separately."
      fr: "ACM ne renouvelle pas les certificats importés, et chaque certificat auto-signé doit être approuvé séparément."
    d:
      en: "Exportable public certificates are still public certificates that require a publicly validated domain."
      fr: "Les certificats publics exportables restent des certificats publics qui exigent un domaine validé publiquement."
references:
  - title: What is AWS Private CA?
    url: https://docs.aws.amazon.com/privateca/latest/userguide/PcaWelcome.html
  - title: Managed certificate renewal in AWS Certificate Manager
    url: https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html
