id: dvac03-2b-rds-encrypt-bluegreen
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a production application on an unencrypted Amazon RDS for MySQL DB instance. An audit requires the database storage to be encrypted with a customer managed AWS KMS key. The application must keep using the same database endpoint, and the change must cause the LEAST downtime.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application de production sur une instance de base de données Amazon RDS for MySQL non chiffrée. Un audit exige que le stockage de la base de données soit chiffré avec une clé AWS KMS gérée par le client. L'application doit continuer à utiliser le même point de terminaison de base de données, et la modification doit causer le MOINS d'interruption possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Modify the DB instance to turn on storage encryption with the key, and apply the change during the next maintenance window.", fr: "Modifier l'instance de base de données pour activer le chiffrement du stockage avec la clé, et appliquer la modification lors de la prochaine fenêtre de maintenance." }
    - id: b
      text: { en: "Create a blue/green deployment that sets the key as the target KMS key of the green environment, and then switch over.", fr: "Créer un déploiement bleu/vert qui définit la clé comme clé KMS cible de l'environnement vert, puis effectuer le basculement." }
    - id: c
      text: { en: "Copy a snapshot of the DB instance with encryption, restore a new DB instance from the copy, and point the application to it.", fr: "Copier un instantané de l'instance de base de données avec chiffrement, restaurer une nouvelle instance à partir de la copie, et y diriger l'application." }
    - id: d
      text: { en: "Create an encrypted read replica of the DB instance with the key, and then promote the read replica to a standalone instance.", fr: "Créer un réplica en lecture chiffré de l'instance de base de données avec la clé, puis promouvoir le réplica en instance autonome." }
answer: { optionId: b }
explanation:
  correct:
    en: "A blue/green deployment can create a green environment whose storage is encrypted with a different KMS key, which encrypts an unencrypted DB instance. The green environment stays synchronized by replication, and the switchover, usually under a minute, renames the green instances and endpoints to match the blue ones so the application needs no change."
    fr: "Un déploiement bleu/vert peut créer un environnement vert dont le stockage est chiffré avec une autre clé KMS, ce qui chiffre une instance de base de données non chiffrée. L'environnement vert reste synchronisé par réplication, et le basculement, généralement inférieur à une minute, renomme les instances et points de terminaison verts pour qu'ils correspondent aux bleus : l'application n'a besoin d'aucune modification."
  options:
    a:
      en: "Encryption cannot be turned on for an existing unencrypted DB instance by modifying it."
      fr: "Le chiffrement ne peut pas être activé en modifiant une instance de base de données existante non chiffrée."
    c:
      en: "The snapshot method works, but writes must stop during the snapshot, copy, and restore, and the restored instance has a new endpoint."
      fr: "La méthode par instantané fonctionne, mais les écritures doivent s'arrêter pendant l'instantané, la copie et la restauration, et l'instance restaurée a un nouveau point de terminaison."
    d:
      en: "RDS does not support an encrypted read replica of an unencrypted DB instance."
      fr: "RDS ne prend pas en charge un réplica en lecture chiffré d'une instance de base de données non chiffrée."
references:
  - title: Limitations and considerations for Amazon RDS blue/green deployments
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments-considerations.html
  - title: Encrypting Amazon RDS resources
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html
