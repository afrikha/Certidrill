id: dvac03-2b-sqs-esm-actions
objective: "2.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A developer creates an event source mapping so that an AWS Lambda function processes messages from an Amazon SQS standard queue. The queue uses SSE-SQS encryption. Instead of the AWS managed policy, the developer writes a custom policy for the function's execution role that is limited to the queue ARN.

    Which actions must the policy allow so that Lambda can poll and process the messages? (Choose three.)
  fr: |
    Un développeur crée un mappage de source d'événements pour qu'une fonction AWS Lambda traite les messages d'une file d'attente standard Amazon SQS. La file d'attente utilise le chiffrement SSE-SQS. Au lieu de la politique gérée par AWS, le développeur écrit pour le rôle d'exécution de la fonction une politique personnalisée limitée à l'ARN de la file d'attente.

    Quelles actions la politique doit-elle autoriser pour que Lambda puisse interroger la file d'attente et traiter les messages ? (Choisissez-en trois.)
body:
  choose: 3
  options:
    - id: a
      text: sqs:SendMessage
    - id: b
      text: sqs:ReceiveMessage
    - id: c
      text: sqs:DeleteMessage
    - id: d
      text: sqs:ListQueues
    - id: e
      text: lambda:InvokeFunction
    - id: f
      text: sqs:GetQueueAttributes
answer: { optionIds: [ b, c, f ] }
explanation:
  correct:
    en: "With an event source mapping, Lambda polls the queue by using the function's execution role. It needs sqs:ReceiveMessage to read batches, sqs:DeleteMessage to remove messages after successful processing, and sqs:GetQueueAttributes to read the queue configuration; these are the SQS actions of the AWSLambdaSQSQueueExecutionRole managed policy. SSE-SQS uses keys owned by Amazon SQS, so no KMS permission is needed."
    fr: "Avec un mappage de source d'événements, Lambda interroge la file d'attente à l'aide du rôle d'exécution de la fonction. Il a besoin de sqs:ReceiveMessage pour lire les lots, de sqs:DeleteMessage pour supprimer les messages après un traitement réussi et de sqs:GetQueueAttributes pour lire la configuration de la file d'attente ; ce sont les actions SQS de la politique gérée AWSLambdaSQSQueueExecutionRole. SSE-SQS utilise des clés détenues par Amazon SQS : aucune autorisation KMS n'est nécessaire."
  options:
    a:
      en: "The function consumes messages; it does not send messages to the queue."
      fr: "La fonction consomme des messages ; elle n'envoie pas de messages dans la file d'attente."
    d:
      en: "Polling a known queue does not require listing the queues of the account."
      fr: "Interroger une file d'attente connue ne nécessite pas de lister les files d'attente du compte."
    e:
      en: "The event source mapping is a Lambda resource that invokes the function itself; the execution role does not need permission to invoke the function."
      fr: "Le mappage de source d'événements est une ressource Lambda qui appelle elle-même la fonction ; le rôle d'exécution n'a pas besoin d'autorisation pour appeler la fonction."
references:
  - title: Creating and configuring an Amazon SQS event source mapping
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
  - title: AWSLambdaSQSQueueExecutionRole
    url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaSQSQueueExecutionRole.html
