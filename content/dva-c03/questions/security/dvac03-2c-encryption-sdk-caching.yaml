id: dvac03-2c-encryption-sdk-caching
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function encrypts about 3,000 small messages per second with the AWS Encryption SDK and an AWS KMS keyring. Each message currently gets a new data key, and the function receives ThrottlingException errors from AWS KMS during peaks. KMS request charges are also growing. The security team accepts that one data key protects up to 1,000 messages for at most 5 minutes. The function must keep processing every message at the current rate.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une fonction AWS Lambda chiffre environ 3 000 petits messages par seconde avec AWS Encryption SDK et un keyring AWS KMS. Chaque message reçoit actuellement une nouvelle clé de données, et la fonction reçoit des erreurs ThrottlingException d'AWS KMS lors des pics. Les frais de requêtes KMS augmentent aussi. L'équipe de sécurité accepte qu'une clé de données protège jusqu'à 1 000 messages pendant 5 minutes au maximum. La fonction doit continuer à traiter tous les messages au rythme actuel.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Request an increase of the AWS KMS cryptographic request rate quota for the account and Region, and keep one data key per message.", fr: "Demander une augmentation du quota de débit des requêtes cryptographiques AWS KMS pour le compte et la Région, en conservant une clé de données par message." }
    - id: b
      text: { en: "Set reserved concurrency on the function so that fewer instances call AWS KMS at the same time during peaks.", fr: "Définir une simultanéité réservée sur la fonction pour que moins d'instances appellent AWS KMS en même temps lors des pics." }
    - id: c
      text: { en: "Configure data key caching in the AWS Encryption SDK with a maximum age of 5 minutes and a limit of 1,000 messages per data key.", fr: "Configurer la mise en cache des clés de données dans AWS Encryption SDK avec un âge maximal de 5 minutes et une limite de 1 000 messages par clé de données." }
    - id: d
      text: { en: "Replace the AWS Encryption SDK with direct calls to the KMS Encrypt operation for each message, because the messages are smaller than 4 KB.", fr: "Remplacer AWS Encryption SDK par des appels directs à l'opération KMS Encrypt pour chaque message, puisque les messages font moins de 4 Ko." }
answer: { optionId: c }
explanation:
  correct:
    en: "Data key caching lets the AWS Encryption SDK reuse a data key for several messages instead of calling AWS KMS each time, which reduces throttling and KMS request charges. Security thresholds such as maximum age and maximum messages per key keep reuse within the limits the security team accepted."
    fr: "La mise en cache des clés de données permet à AWS Encryption SDK de réutiliser une clé de données pour plusieurs messages au lieu d'appeler AWS KMS à chaque fois, ce qui réduit la limitation et les frais de requêtes KMS. Des seuils de sécurité comme l'âge maximal et le nombre maximal de messages par clé maintiennent la réutilisation dans les limites acceptées par l'équipe de sécurité."
  options:
    a:
      en: "A higher quota can remove the throttling, but every message still costs a KMS request, so the growing request charges are not reduced."
      fr: "Un quota plus élevé peut supprimer la limitation, mais chaque message coûte toujours une requête KMS : les frais de requêtes croissants ne baissent pas."
    b:
      en: "Limiting concurrency reduces the processing rate during peaks, which breaks the requirement to keep processing every message at the current rate."
      fr: "Limiter la simultanéité réduit le rythme de traitement lors des pics, ce qui enfreint l'exigence de traiter tous les messages au rythme actuel."
    d:
      en: "Calling Encrypt for each message still makes one KMS request per message, so throttling and charges stay the same."
      fr: "Appeler Encrypt pour chaque message fait toujours une requête KMS par message : la limitation et les frais restent identiques."
references:
  - title: Data key caching
    url: https://docs.aws.amazon.com/encryption-sdk/latest/developer-guide/data-key-caching.html
