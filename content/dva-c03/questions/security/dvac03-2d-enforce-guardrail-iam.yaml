id: dvac03-2d-enforce-guardrail-iam
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Several developer teams call InvokeModel on Amazon Bedrock with one shared IAM role. Some policies attached to the role allow bedrock:InvokeModel on all foundation models. The security team must make sure that every inference request made with this role applies version 2 of the guardrail gr7example, and no other version.

    Which statement should the security team add to the role's policies?
  fr: |
    Plusieurs équipes de développeurs appellent InvokeModel sur Amazon Bedrock avec un même rôle IAM partagé. Certaines politiques attachées au rôle autorisent bedrock:InvokeModel sur tous les modèles de fondation. L'équipe de sécurité doit s'assurer que chaque requête d'inférence effectuée avec ce rôle applique la version 2 de la barrière de protection (guardrail) gr7example, et aucune autre version.

    Quelle instruction l'équipe de sécurité doit-elle ajouter aux politiques du rôle ?
body:
  options:
    - { id: a, text: { en: "An Allow statement for bedrock:ApplyGuardrail on the ARN of the gr7example guardrail", fr: "Une instruction Allow pour bedrock:ApplyGuardrail sur l'ARN de la barrière de protection gr7example" } }
    - { id: b, text: { en: "A Deny statement for bedrock:InvokeModel with a StringNotEquals condition on bedrock:GuardrailIdentifier set to the ARN of version 2", fr: "Une instruction Deny pour bedrock:InvokeModel avec une condition StringNotEquals sur bedrock:GuardrailIdentifier définie sur l'ARN de la version 2" } }
    - { id: c, text: { en: "A Deny statement for bedrock:InvokeModel with an ArnNotLike condition on bedrock:GuardrailIdentifier set to the guardrail ARN followed by *", fr: "Une instruction Deny pour bedrock:InvokeModel avec une condition ArnNotLike sur bedrock:GuardrailIdentifier définie sur l'ARN de la barrière suivi de *" } }
    - { id: d, text: { en: "An Allow statement for bedrock:InvokeModel with a StringEquals condition on bedrock:GuardrailIdentifier set to the ARN of version 2", fr: "Une instruction Allow pour bedrock:InvokeModel avec une condition StringEquals sur bedrock:GuardrailIdentifier définie sur l'ARN de la version 2" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The bedrock:GuardrailIdentifier condition key carries the guardrail and version used by an inference request. An explicit Deny when the key is not the ARN of version 2 (the guardrail ARN followed by :2) rejects requests without that guardrail version, whatever other policies allow."
    fr: "La clé de condition bedrock:GuardrailIdentifier contient la barrière de protection et la version utilisées par une requête d'inférence. Un refus explicite lorsque la clé n'est pas l'ARN de la version 2 (l'ARN de la barrière suivi de :2) rejette les requêtes sans cette version, quelles que soient les autres politiques."
  options:
    a:
      en: "ApplyGuardrail permission lets the role evaluate text with the guardrail; it does not force InvokeModel requests to use it."
      fr: "L'autorisation ApplyGuardrail permet au rôle d'évaluer du texte avec la barrière de protection ; elle n'oblige pas les requêtes InvokeModel à l'utiliser."
    c:
      en: "A wildcard after the ARN matches any version of the guardrail, including DRAFT, so other versions would still be accepted."
      fr: "Un caractère générique après l'ARN correspond à toutes les versions de la barrière de protection, y compris DRAFT : d'autres versions seraient toujours acceptées."
    d:
      en: "An Allow with a condition adds a permission but does not override the other policies that already allow InvokeModel without a guardrail."
      fr: "Une autorisation avec condition ajoute une permission mais ne prévaut pas sur les autres politiques qui autorisent déjà InvokeModel sans barrière de protection."
references:
  - title: Enforce the use of specific guardrails in model inference requests
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-permissions-id.html
