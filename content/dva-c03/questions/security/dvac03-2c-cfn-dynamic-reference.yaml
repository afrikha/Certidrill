id: dvac03-2c-cfn-dynamic-reference
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer maintains an AWS CloudFormation template that creates an Amazon RDS DB instance. Today the master password is passed as a NoEcho template parameter at every deployment. The password is already stored in an AWS Secrets Manager secret named prod/orders/db, whose JSON value contains the keys username and password. The template must read the password from the secret, and the password must not appear in the template.

    ```yaml
    OrdersDb:
      Type: AWS::RDS::DBInstance
      Properties:
        Engine: mysql
        DBInstanceClass: db.t3.medium
        AllocatedStorage: '20'
        MasterUsername: admin
        MasterUserPassword: <value>
    ```

    Which value should the developer use for MasterUserPassword?
  fr: |
    Un développeur maintient un modèle AWS CloudFormation qui crée une instance de base de données Amazon RDS. Aujourd'hui, le mot de passe principal est transmis à chaque déploiement comme paramètre de modèle NoEcho. Le mot de passe est déjà stocké dans un secret AWS Secrets Manager nommé prod/orders/db, dont la valeur JSON contient les clés username et password. Le modèle doit lire le mot de passe dans le secret, et le mot de passe ne doit pas apparaître dans le modèle.

    ```yaml
    OrdersDb:
      Type: AWS::RDS::DBInstance
      Properties:
        Engine: mysql
        DBInstanceClass: db.t3.medium
        AllocatedStorage: '20'
        MasterUsername: admin
        MasterUserPassword: <value>
    ```

    Quelle valeur le développeur doit-il utiliser pour MasterUserPassword ?
body:
  options:
    - id: a
      text: "'{{resolve:ssm:prod/orders/db:password}}'"
    - id: b
      text: "'{{resolve:secretsmanager:prod/orders/db:SecretString:password:AWSPREVIOUS}}'"
    - id: c
      text: "!GetAtt OrdersDb.MasterUserSecret.SecretArn"
    - id: d
      text: "'{{resolve:secretsmanager:prod/orders/db:SecretString:password}}'"
answer: { optionId: d }
explanation:
  correct:
    en: "A secretsmanager dynamic reference retrieves the secret during stack operations: the syntax is the secret ID, SecretString, then the JSON key. Without a version stage or version ID, CloudFormation uses the AWSCURRENT version. The template contains only the reference, and CloudFormation does not persist the resolved value."
    fr: "Une référence dynamique secretsmanager récupère le secret pendant les opérations de pile : la syntaxe est l'ID du secret, SecretString, puis la clé JSON. Sans étiquette ni ID de version, CloudFormation utilise la version AWSCURRENT. Le modèle ne contient que la référence, et CloudFormation ne conserve pas la valeur résolue."
  options:
    a:
      en: "The ssm dynamic reference reads Parameter Store String parameters by parameter name; it does not read Secrets Manager secrets or JSON keys."
      fr: "La référence dynamique ssm lit des paramètres String de Parameter Store par leur nom ; elle ne lit ni les secrets Secrets Manager ni les clés JSON."
    b:
      en: "The syntax is valid, but AWSPREVIOUS selects the previous version of the secret, so the instance would get an old password instead of the current one."
      fr: "La syntaxe est valide, mais AWSPREVIOUS sélectionne la version précédente du secret : l'instance recevrait un ancien mot de passe au lieu du mot de passe actuel."
    c:
      en: "A resource cannot reference its own attribute in its properties, and MasterUserSecret exists only when RDS manages the password, not for an existing secret."
      fr: "Une ressource ne peut pas référencer son propre attribut dans ses propriétés, et MasterUserSecret n'existe que lorsque RDS gère le mot de passe, pas pour un secret existant."
references:
  - title: Get a secret or secret value from Secrets Manager
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-secretsmanager.html
