id: dvac03-2a-multi-lambda-accessdenied
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A Lambda function uses the AWS SDK for JavaScript v3 to write items to an Amazon DynamoDB table named Orders. The code creates the DynamoDBClient without any credentials option. Every PutItem call fails with an AccessDeniedException error.

    Which issues could cause this error? (Choose two.)
  fr: |
    Une fonction Lambda utilise l'AWS SDK pour JavaScript v3 pour écrire des éléments dans une table Amazon DynamoDB nommée Orders. Le code crée le DynamoDBClient sans aucune option d'informations d'identification. Chaque appel PutItem échoue avec une erreur AccessDeniedException.

    Quels problèmes peuvent causer cette erreur ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The permissions policy of the execution role does not allow dynamodb:PutItem on the ARN of the Orders table.", fr: "La politique d'autorisations du rôle d'exécution n'autorise pas dynamodb:PutItem sur l'ARN de la table Orders." } }
    - { id: b, text: { en: "The function has no resource-based policy that allows dynamodb.amazonaws.com to invoke it.", fr: "La fonction n'a pas de politique basée sur les ressources qui autorise dynamodb.amazonaws.com à l'appeler." } }
    - { id: c, text: { en: "The code does not read the AWS_ACCESS_KEY_ID environment variable before it creates the client.", fr: "Le code ne lit pas la variable d'environnement AWS_ACCESS_KEY_ID avant de créer le client." } }
    - { id: d, text: { en: "The execution role has a permissions boundary that does not allow dynamodb:PutItem.", fr: "Le rôle d'exécution a une limite d'autorisations qui n'autorise pas dynamodb:PutItem." } }
    - { id: e, text: { en: "The function is connected to a VPC that has no NAT gateway and no DynamoDB VPC endpoint.", fr: "La fonction est connectée à un VPC sans passerelle NAT ni point de terminaison de VPC DynamoDB." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The SDK signs requests with the execution role credentials, so DynamoDB authorizes the role. An action succeeds only when the identity-based policy allows it and the permissions boundary also allows it; a missing allow in either one results in AccessDeniedException."
    fr: "Le SDK signe les demandes avec les informations d'identification du rôle d'exécution : DynamoDB autorise donc le rôle. Une action ne réussit que si la politique basée sur l'identité l'autorise et que la limite d'autorisations l'autorise aussi ; une autorisation manquante dans l'une ou l'autre entraîne AccessDeniedException."
  options:
    b:
      en: "A function's resource-based policy controls who can invoke the function, not what the function can call."
      fr: "La politique basée sur les ressources d'une fonction contrôle qui peut appeler la fonction, pas ce que la fonction peut appeler."
    c:
      en: "The SDK default credential chain reads the role credentials from the environment automatically; the code does not need to read them."
      fr: "La chaîne d'identification par défaut du SDK lit automatiquement les informations d'identification du rôle dans l'environnement ; le code n'a pas besoin de les lire."
    e:
      en: "Without a network path, the calls time out instead of returning an authorization error."
      fr: "Sans chemin réseau, les appels expirent au lieu de renvoyer une erreur d'autorisation."
references:
  - title: Defining Lambda function permissions with an execution role
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
  - title: Permissions boundaries for IAM entities
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
