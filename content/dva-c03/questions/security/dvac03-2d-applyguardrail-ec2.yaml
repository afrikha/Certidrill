id: dvac03-2d-applyguardrail-ec2
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company hosts an open-source language model on Amazon EC2 instances. The company already uses an Amazon Bedrock guardrail with content filters and PII masking for its other applications. The same guardrail must check the prompts and the responses of the self-hosted model, and the model must keep running on Amazon EC2.

    Which solution will meet these requirements?
  fr: |
    Une entreprise héberge un modèle de langage open source sur des instances Amazon EC2. L'entreprise utilise déjà, pour ses autres applications, une barrière de protection (guardrail) Amazon Bedrock avec des filtres de contenu et un masquage des PII. La même barrière de protection doit contrôler les invites et les réponses du modèle auto-hébergé, et le modèle doit continuer à s'exécuter sur Amazon EC2.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send each prompt to the Converse API with guardrailConfig, then forward the response from Amazon Bedrock to the self-hosted model.", fr: "Envoyer chaque invite à l'API Converse avec guardrailConfig, puis transmettre la réponse d'Amazon Bedrock au modèle auto-hébergé." } }
    - { id: b, text: { en: "Export the guardrail configuration with the GetGuardrail API and load it into the inference server on the EC2 instances.", fr: "Exporter la configuration de la barrière de protection avec l'API GetGuardrail et la charger dans le serveur d'inférence des instances EC2." } }
    - { id: c, text: { en: "Add an amazon-bedrock-guardrailConfig field with a tagSuffix to the requests that the application sends to the self-hosted model.", fr: "Ajouter un champ amazon-bedrock-guardrailConfig avec un tagSuffix aux requêtes que l'application envoie au modèle auto-hébergé." } }
    - { id: d, text: { en: "Call the ApplyGuardrail API with source set to INPUT for each prompt and with source set to OUTPUT for each response.", fr: "Appeler l'API ApplyGuardrail avec source défini sur INPUT pour chaque invite et avec source défini sur OUTPUT pour chaque réponse." } }
answer: { optionId: d }
explanation:
  correct:
    en: "ApplyGuardrail evaluates any text against a guardrail without invoking a foundation model. The application calls it with source INPUT before sending a prompt to the self-hosted model and with source OUTPUT on the model's response, and uses the masked or blocked result."
    fr: "ApplyGuardrail évalue n'importe quel texte avec une barrière de protection sans invoquer de modèle de fondation. L'application l'appelle avec source INPUT avant d'envoyer une invite au modèle auto-hébergé et avec source OUTPUT sur la réponse du modèle, puis utilise le résultat masqué ou bloqué."
  options:
    a:
      en: "Converse invokes a model in Amazon Bedrock, which adds an unneeded model call and does not check the self-hosted model's responses."
      fr: "Converse invoque un modèle dans Amazon Bedrock, ce qui ajoute un appel de modèle inutile et ne contrôle pas les réponses du modèle auto-hébergé."
    b:
      en: "Guardrails are evaluated by the Amazon Bedrock service; a configuration exported with GetGuardrail cannot run inside another inference server."
      fr: "Les barrières de protection sont évaluées par le service Amazon Bedrock ; une configuration exportée avec GetGuardrail ne peut pas s'exécuter dans un autre serveur d'inférence."
    c:
      en: "This field is read only by Amazon Bedrock Invoke APIs; a self-hosted model ignores it."
      fr: "Ce champ n'est lu que par les API Invoke d'Amazon Bedrock ; un modèle auto-hébergé l'ignore."
references:
  - title: Use the ApplyGuardrail API in your application
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-independent-api.html
