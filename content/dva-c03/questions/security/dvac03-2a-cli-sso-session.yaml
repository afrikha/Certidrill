id: dvac03-2a-cli-sso-session
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's developers are workforce users in IAM Identity Center. They need to run AWS CLI commands from their laptops. The company does not allow long-term access keys, and the CLI must refresh its tokens automatically while the IAM Identity Center session is valid.

    Which solution will meet these requirements?
  fr: |
    Les développeurs d'une entreprise sont des utilisateurs du personnel dans IAM Identity Center. Ils doivent exécuter des commandes de l'AWS CLI depuis leurs ordinateurs portables. L'entreprise n'autorise pas les clés d'accès à long terme, et la CLI doit actualiser ses jetons automatiquement tant que la session IAM Identity Center est valide.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Copy the short-term credentials from the AWS access portal into the credentials file each morning.", fr: "Copier chaque matin les informations d'identification à court terme du portail d'accès AWS dans le fichier credentials." } }
    - { id: b, text: { en: "Run aws configure sso to create a profile that uses an sso-session section, then run aws sso login.", fr: "Exécuter aws configure sso pour créer un profil qui utilise une section sso-session, puis exécuter aws sso login." } }
    - { id: c, text: { en: "Add sso_start_url and sso_region directly to each profile without an sso-session section, then run aws sso login.", fr: "Ajouter sso_start_url et sso_region directement à chaque profil sans section sso-session, puis exécuter aws sso login." } }
    - { id: d, text: { en: "Create an IAM user for each developer in each account, and require MFA for the users' access keys.", fr: "Créer un utilisateur IAM pour chaque développeur dans chaque compte et exiger la MFA pour les clés d'accès des utilisateurs." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The SSO token provider configuration, created by aws configure sso, stores the start URL and Region in an sso-session section that profiles reference. After aws sso login, the CLI refreshes the tokens and renews the AWS credentials automatically while the IAM Identity Center session lasts."
    fr: "La configuration du fournisseur de jetons SSO, créée par aws configure sso, stocke l'URL de démarrage et la Région dans une section sso-session référencée par les profils. Après aws sso login, la CLI actualise les jetons et renouvelle automatiquement les informations d'identification AWS pendant toute la session IAM Identity Center."
  options:
    a:
      en: "Copied credentials expire and are never refreshed, so developers must copy them again by hand."
      fr: "Les informations d'identification copiées expirent sans jamais être actualisées : les développeurs doivent les recopier à la main."
    c:
      en: "This is the legacy non-refreshable configuration, which does not support automatic token refresh."
      fr: "Il s'agit de la configuration héritée non actualisable, qui ne prend pas en charge l'actualisation automatique des jetons."
    d:
      en: "IAM user access keys are long-term credentials; requiring MFA does not make them temporary."
      fr: "Les clés d'accès d'utilisateurs IAM sont des informations d'identification à long terme ; exiger la MFA ne les rend pas temporaires."
references:
  - title: Configuring IAM Identity Center authentication with the AWS CLI
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sso.html
