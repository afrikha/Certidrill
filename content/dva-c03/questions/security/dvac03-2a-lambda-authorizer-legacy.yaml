id: dvac03-2a-lambda-authorizer-legacy
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company exposes an Amazon API Gateway REST API. Clients send a bearer token issued by a legacy on-premises identity service. The tokens are not JWTs, and only the legacy service can validate them through an HTTPS endpoint. API Gateway must reject requests with an invalid token before the backend is called.

    Which solution will meet these requirements?
  fr: |
    Une entreprise expose une API REST Amazon API Gateway. Les clients envoient un jeton porteur (bearer token) émis par un service d'identité hérité sur site. Les jetons ne sont pas des JWT, et seul le service hérité peut les valider par un point de terminaison HTTPS. API Gateway doit rejeter les demandes dont le jeton n'est pas valide avant l'appel du backend.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure an Amazon Cognito user pool authorizer that uses the legacy service as its token issuer.", fr: "Configurer un mécanisme d'autorisation de groupe d'utilisateurs Amazon Cognito qui utilise le service hérité comme émetteur de jetons." } }
    - { id: b, text: { en: "Set the method authorization to AWS_IAM, and have clients send the token in the X-Amz-Security-Token header.", fr: "Définir l'autorisation de la méthode sur AWS_IAM et faire envoyer le jeton par les clients dans l'en-tête X-Amz-Security-Token." } }
    - { id: c, text: { en: "Require an API key on each method, and create one usage plan for each client of the legacy service.", fr: "Exiger une clé d'API sur chaque méthode et créer un plan d'utilisation pour chaque client du service hérité." } }
    - { id: d, text: { en: "Configure a TOKEN Lambda authorizer whose function calls the legacy service and returns an IAM policy.", fr: "Configurer un mécanisme d'autorisation Lambda de type TOKEN dont la fonction appelle le service hérité et renvoie une politique IAM." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A TOKEN Lambda authorizer receives the bearer token, can call an external provider to validate it, and returns a principal ID and an IAM policy. API Gateway invokes the integration only when the policy allows the call, and returns 403 when it denies it."
    fr: "Un mécanisme d'autorisation Lambda de type TOKEN reçoit le jeton porteur, peut appeler un fournisseur externe pour le valider et renvoie un ID de principal et une politique IAM. API Gateway n'appelle l'intégration que si la politique autorise l'appel, et renvoie 403 quand elle le refuse."
  options:
    a:
      en: "A Cognito user pool authorizer validates only tokens issued by that user pool."
      fr: "Un mécanisme d'autorisation de groupe d'utilisateurs Cognito ne valide que les jetons émis par ce groupe d'utilisateurs."
    b:
      en: "AWS_IAM authorization requires SigV4 signatures made with AWS credentials; a legacy token is not an AWS session token."
      fr: "L'autorisation AWS_IAM exige des signatures SigV4 calculées avec des informations d'identification AWS ; un jeton hérité n'est pas un jeton de session AWS."
    c:
      en: "API keys identify clients for usage plans and throttling; they do not validate the legacy tokens."
      fr: "Les clés d'API identifient les clients pour les plans d'utilisation et la limitation ; elles ne valident pas les jetons hérités."
references:
  - title: Use API Gateway Lambda authorizers
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-use-lambda-authorizer.html
