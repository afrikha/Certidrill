id: dvac03-2b-cross-account-lambda-steps
objective: "2.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function in account A (111111111111) must write items to an Amazon DynamoDB table in account B (222222222222). The security team of account B requires that the access be granted through an IAM role that account B owns, and the company forbids long-term credentials.

    Which combination of steps will meet these requirements? (Choose three.)
  fr: |
    Une fonction AWS Lambda du compte A (111111111111) doit écrire des éléments dans une table Amazon DynamoDB du compte B (222222222222). L'équipe de sécurité du compte B exige que l'accès soit accordé par un rôle IAM appartenant au compte B, et l'entreprise interdit les informations d'identification à long terme.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en trois.)
body:
  choose: 3
  options:
    - id: a
      text: { en: "In account B, create a role that allows dynamodb:PutItem on the table and whose trust policy allows the function's execution role.", fr: "Dans le compte B, créer un rôle qui autorise dynamodb:PutItem sur la table et dont la politique d'approbation autorise le rôle d'exécution de la fonction." }
    - id: b
      text: { en: "In account B, create a role that allows dynamodb:PutItem on the table and whose trust policy allows lambda.amazonaws.com.", fr: "Dans le compte B, créer un rôle qui autorise dynamodb:PutItem sur la table et dont la politique d'approbation autorise lambda.amazonaws.com." }
    - id: c
      text: { en: "In account A, allow sts:AssumeRole on the ARN of the account B role in the policy of the function's execution role.", fr: "Dans le compte A, autoriser sts:AssumeRole sur l'ARN du rôle du compte B dans la politique du rôle d'exécution de la fonction." }
    - id: d
      text: { en: "In account A, add a statement to the function's resource-based policy that allows account B to invoke the function.", fr: "Dans le compte A, ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise le compte B à appeler la fonction." }
    - id: e
      text: { en: "In the function code, call AssumeRole for the account B role, and create the DynamoDB client with the temporary credentials.", fr: "Dans le code de la fonction, appeler AssumeRole sur le rôle du compte B, et créer le client DynamoDB avec les informations d'identification temporaires." }
    - id: f
      text: { en: "In account B, attach a resource-based policy to the table that allows the function's execution role to call dynamodb:PutItem.", fr: "Dans le compte B, attacher à la table une politique basée sur les ressources qui autorise le rôle d'exécution de la fonction à appeler dynamodb:PutItem." }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "The role in account B holds the DynamoDB permission and trusts the function's execution role. The execution role needs sts:AssumeRole on that role ARN, because cross-account role assumption requires permission on both sides. The function code then calls AssumeRole and builds the DynamoDB client with the returned access key, secret key, and session token."
    fr: "Le rôle du compte B porte l'autorisation DynamoDB et approuve le rôle d'exécution de la fonction. Le rôle d'exécution a besoin de sts:AssumeRole sur l'ARN de ce rôle, car assumer un rôle entre comptes nécessite une autorisation des deux côtés. Le code de la fonction appelle ensuite AssumeRole et crée le client DynamoDB avec la clé d'accès, la clé secrète et le jeton de session renvoyés."
  options:
    b:
      en: "Trusting lambda.amazonaws.com lets Lambda functions of account B use the role as an execution role; it does not let a function of account A assume it."
      fr: "Approuver lambda.amazonaws.com permet aux fonctions Lambda du compte B d'utiliser le rôle comme rôle d'exécution ; cela ne permet pas à une fonction du compte A de l'assumer."
    d:
      en: "Nothing in account B needs to invoke the function; the function calls into account B."
      fr: "Rien dans le compte B n'a besoin d'appeler la fonction ; c'est la fonction qui appelle le compte B."
    f:
      en: "A table resource-based policy can grant cross-account access, but it does not use an IAM role of account B, which the security team requires."
      fr: "Une politique basée sur les ressources de la table peut accorder un accès entre comptes, mais elle n'utilise pas de rôle IAM du compte B, ce qu'exige l'équipe de sécurité."
references:
  - title: Create a role to give permissions to an IAM user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-user.html
  - title: AssumeRole
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
