id: dvac03-2b-ecs-task-role
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a containerized API on Amazon ECS with AWS Fargate. The task definition sets executionRoleArn to a role that has the AmazonECSTaskExecutionRolePolicy managed policy, and images are pulled from Amazon ECR successfully. Application code that uses the AWS SDK to call sqs:SendMessage on a queue fails because the SDK cannot find credentials. Only the application containers of this task must be able to send messages to the queue.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany exécute une API conteneurisée sur Amazon ECS avec AWS Fargate. La définition de tâche définit executionRoleArn sur un rôle qui possède la politique gérée AmazonECSTaskExecutionRolePolicy, et les images sont extraites d'Amazon ECR sans problème. Le code de l'application, qui utilise le kit SDK AWS pour appeler sqs:SendMessage sur une file d'attente, échoue, car le kit SDK ne trouve aucune information d'identification. Seuls les conteneurs d'application de cette tâche doivent pouvoir envoyer des messages dans la file d'attente.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Create an IAM role that trusts ecs-tasks.amazonaws.com and whose policy allows sqs:SendMessage on the queue.", fr: "Créer un rôle IAM qui approuve ecs-tasks.amazonaws.com et dont la politique autorise sqs:SendMessage sur la file d'attente." }
    - id: b
      text: { en: "Add sqs:SendMessage on the queue to the policy of the role that executionRoleArn references.", fr: "Ajouter sqs:SendMessage sur la file d'attente à la politique du rôle référencé par executionRoleArn." }
    - id: c
      text: { en: "Store the access keys of an IAM user in AWS Secrets Manager, and inject them into the container as environment variables.", fr: "Stocker les clés d'accès d'un utilisateur IAM dans AWS Secrets Manager, et les injecter dans le conteneur sous forme de variables d'environnement." }
    - id: d
      text: { en: "Set the taskRoleArn parameter of the task definition to the new role, and deploy the new task definition revision.", fr: "Définir le paramètre taskRoleArn de la définition de tâche sur le nouveau rôle, et déployer la nouvelle révision de la définition de tâche." }
    - id: e
      text: { en: "Add a queue policy that allows sqs:SendMessage to the ecs-tasks.amazonaws.com service principal.", fr: "Ajouter une politique de file d'attente qui autorise sqs:SendMessage pour le principal de service ecs-tasks.amazonaws.com." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Application containers receive credentials from the task IAM role, which must trust ecs-tasks.amazonaws.com and is set with taskRoleArn in the task definition. The SDK in the container then obtains the role's temporary credentials through the container credential provider, and only tasks that use this definition get the permission."
    fr: "Les conteneurs d'application reçoivent leurs informations d'identification du rôle IAM de tâche, qui doit approuver ecs-tasks.amazonaws.com et se définit avec taskRoleArn dans la définition de tâche. Le kit SDK du conteneur obtient alors les informations d'identification temporaires du rôle par le fournisseur d'informations d'identification de conteneur, et seules les tâches qui utilisent cette définition reçoivent l'autorisation."
  options:
    b:
      en: "The task execution role is used by Amazon ECS to pull images and send logs; its credentials are not provided to the application code."
      fr: "Le rôle d'exécution de tâche est utilisé par Amazon ECS pour extraire les images et envoyer les journaux ; ses informations d'identification ne sont pas fournies au code de l'application."
    c:
      en: "Access keys of an IAM user are long-term credentials that must be rotated manually, while a task role provides temporary credentials."
      fr: "Les clés d'accès d'un utilisateur IAM sont des informations d'identification à long terme à renouveler manuellement, alors qu'un rôle de tâche fournit des informations d'identification temporaires."
    e:
      en: "The SDK calls are signed with the task's credentials, not by the ECS service principal, and such a policy would not be limited to this task."
      fr: "Les appels du kit SDK sont signés avec les informations d'identification de la tâche et non par le principal de service ECS, et une telle politique ne serait pas limitée à cette tâche."
references:
  - title: Amazon ECS task IAM role
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html
  - title: Amazon ECS task definition parameters for Fargate
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definition_parameters.html
