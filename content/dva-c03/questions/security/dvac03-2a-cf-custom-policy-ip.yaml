id: dvac03-2a-cf-custom-policy-ip
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company shares a large data file with a partner through an Amazon CloudFront distribution that requires signed URLs. The URL must become valid next Monday at 00:00 UTC, expire 48 hours later, and work only from the partner's IPv4 range 203.0.113.0/24. IPv6 is disabled on the distribution.

    Which solution will meet these requirements?
  fr: |
    Une entreprise partage un gros fichier de données avec un partenaire par une distribution Amazon CloudFront qui exige des URL signées. L'URL doit devenir valide lundi prochain à 00:00 UTC, expirer 48 heures plus tard et ne fonctionner que depuis la plage IPv4 du partenaire, 203.0.113.0/24. IPv6 est désactivé sur la distribution.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a signed URL with a custom policy that uses DateGreaterThan, DateLessThan, and IpAddress with AWS:SourceIp.", fr: "Créer une URL signée avec une politique personnalisée qui utilise DateGreaterThan, DateLessThan et IpAddress avec AWS:SourceIp." } }
    - { id: b, text: { en: "Create a signed URL with a canned policy whose Expires value is 48 hours after next Monday at 00:00 UTC.", fr: "Créer une URL signée avec une politique prédéfinie (canned) dont la valeur Expires se situe 48 heures après lundi prochain à 00:00 UTC." } }
    - { id: c, text: { en: "Create an S3 presigned URL with ExpiresIn set to 48 hours, and add aws:SourceIp to its query string.", fr: "Créer une URL présignée S3 avec ExpiresIn défini à 48 heures et ajouter aws:SourceIp à sa chaîne de requête." } }
    - { id: d, text: { en: "Create a signed URL with a canned policy, and add an AWS WAF rule that allows only 203.0.113.0/24.", fr: "Créer une URL signée avec une politique prédéfinie et ajouter une règle AWS WAF qui n'autorise que 203.0.113.0/24." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A custom policy can set a start time with DateGreaterThan, the required expiration with DateLessThan, and one IPv4 address or CIDR range with IpAddress and AWS:SourceIp. The URL then carries the Policy, Signature and Key-Pair-Id parameters."
    fr: "Une politique personnalisée peut fixer une heure de début avec DateGreaterThan, l'expiration obligatoire avec DateLessThan et une adresse ou une plage CIDR IPv4 avec IpAddress et AWS:SourceIp. L'URL porte alors les paramètres Policy, Signature et Key-Pair-Id."
  options:
    b:
      en: "A canned policy sets only an expiration time, so the URL would be valid immediately and from any address."
      fr: "Une politique prédéfinie ne fixe qu'une heure d'expiration : l'URL serait valide immédiatement et depuis n'importe quelle adresse."
    c:
      en: "An S3 presigned URL cannot carry an IP condition, is valid as soon as it is created, and bypasses the distribution."
      fr: "Une URL présignée S3 ne peut pas porter de condition d'adresse IP, est valide dès sa création et contourne la distribution."
    d:
      en: "AWS WAF can filter the IP range, but a canned policy still cannot delay the start of validity."
      fr: "AWS WAF peut filtrer la plage IP, mais une politique prédéfinie ne peut toujours pas retarder le début de validité."
references:
  - title: Create a signed URL using a custom policy
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-creating-signed-url-custom-policy.html
  - title: Create a signed URL using a canned policy
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-creating-signed-url-canned-policy.html
