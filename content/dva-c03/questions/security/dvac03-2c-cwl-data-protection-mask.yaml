id: dvac03-2c-cwl-data-protection-mask
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function logs complete request payloads to its Amazon CloudWatch Logs log group for troubleshooting. The payloads contain customer email addresses. The company must prevent email addresses from being displayed to engineers who read the logs in the console, in CloudWatch Logs Insights, or through subscription filters. The function code must not be changed.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda journalise les charges utiles complètes des requêtes dans son groupe de journaux Amazon CloudWatch Logs à des fins de dépannage. Les charges utiles contiennent les adresses e-mail des clients. L'entreprise doit empêcher que les adresses e-mail soient affichées aux ingénieurs qui lisent les journaux dans la console, dans CloudWatch Logs Insights ou via des filtres d'abonnement. Le code de la fonction ne doit pas être modifié.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Associate a customer managed AWS KMS key with the log group, and deny kms:Decrypt on the key to the engineers.", fr: "Associer une clé AWS KMS gérée par le client au groupe de journaux, et refuser kms:Decrypt sur la clé aux ingénieurs." }
    - id: b
      text: { en: "Create a subscription filter that sends the log events to a Lambda function that removes email addresses and writes them to a new log group.", fr: "Créer un filtre d'abonnement qui envoie les événements à une fonction Lambda qui supprime les adresses e-mail et les écrit dans un nouveau groupe de journaux." }
    - id: c
      text: { en: "Create a data protection policy on the log group with the EmailAddress managed data identifier and a Deidentify statement.", fr: "Créer sur le groupe de journaux une politique de protection des données avec l'identifiant de données géré EmailAddress et une instruction Deidentify." }
    - id: d
      text: { en: "Create a metric filter that matches email address patterns, and set an alarm that notifies the team when a match is found.", fr: "Créer un filtre de métrique qui correspond aux formats d'adresse e-mail, et définir une alarme qui avertit l'équipe en cas de correspondance." }
answer: { optionId: c }
explanation:
  correct:
    en: "A CloudWatch Logs data protection policy detects sensitive data with managed data identifiers at ingestion and masks it at every egress point, including the console, Logs Insights, metric filters, and subscription filters. Only principals with the logs:Unmask permission can see the original values. Events ingested before the policy was created are not masked."
    fr: "Une politique de protection des données CloudWatch Logs détecte les données sensibles à l'ingestion avec des identifiants de données gérés et les masque à chaque point de sortie, dont la console, Logs Insights, les filtres de métrique et les filtres d'abonnement. Seuls les principaux disposant de l'autorisation logs:Unmask voient les valeurs d'origine. Les événements ingérés avant la création de la politique ne sont pas masqués."
  options:
    a:
      en: "A KMS key encrypts the log data at rest; engineers without key access could not read any log at all, and the email addresses would not be masked for those who can."
      fr: "Une clé KMS chiffre les journaux au repos ; les ingénieurs sans accès à la clé ne pourraient lire aucun journal, et les adresses ne seraient pas masquées pour ceux qui y ont accès."
    b:
      en: "The original log group still contains the email addresses in clear, so engineers who read it would still see them."
      fr: "Le groupe de journaux d'origine contient toujours les adresses e-mail en clair : les ingénieurs qui le lisent les verraient encore."
    d:
      en: "A metric filter only counts matches and an alarm only notifies; neither hides the email addresses from readers."
      fr: "Un filtre de métrique ne fait que compter les correspondances et une alarme ne fait qu'avertir ; aucun ne masque les adresses aux lecteurs."
references:
  - title: Help protect sensitive log data with masking
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
