id: dvac03-2b-mfa-serial-profile
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The trust policy of the IAM role BillingAdmin allows the developer's AWS account only when aws:MultiFactorAuthPresent is true. A developer has an AWS CLI profile named admin with role_arn set to the role ARN and source_profile set to cli-user. Every command with --profile admin fails with an AccessDenied error when the AWS CLI calls AssumeRole. The developer's IAM user has the virtual MFA device arn:aws:iam::111111111111:mfa/dev-user. The company wants to keep the MFA requirement.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    La politique d'approbation du rôle IAM BillingAdmin n'autorise le compte AWS du développeur que si aws:MultiFactorAuthPresent est vrai. Un développeur dispose d'un profil AWS CLI nommé admin, avec role_arn défini sur l'ARN du rôle et source_profile défini sur cli-user. Chaque commande avec --profile admin échoue avec une erreur AccessDenied lorsque l'AWS CLI appelle AssumeRole. L'utilisateur IAM du développeur possède le périphérique MFA virtuel arn:aws:iam::111111111111:mfa/dev-user. L'entreprise veut conserver l'exigence de MFA.

    Quelle solution répond à ces exigences avec le MOINS d'efforts ?
body:
  options:
    - id: a
      text: { en: "Add an aws_session_token entry to the cli-user profile in the ~/.aws/credentials file.", fr: "Ajouter une entrée aws_session_token au profil cli-user dans le fichier ~/.aws/credentials." }
    - id: b
      text: { en: "Add external_id set to the MFA device ARN to the admin profile in the ~/.aws/config file.", fr: "Ajouter external_id défini sur l'ARN du périphérique MFA au profil admin dans le fichier ~/.aws/config." }
    - id: c
      text: { en: "Move the MFA condition from the trust policy of BillingAdmin to the permissions policy of the role.", fr: "Déplacer la condition MFA de la politique d'approbation de BillingAdmin vers la politique d'autorisations du rôle." }
    - id: d
      text: { en: "Add mfa_serial set to the MFA device ARN to the admin profile so that the AWS CLI prompts for a code.", fr: "Ajouter mfa_serial défini sur l'ARN du périphérique MFA au profil admin pour que l'AWS CLI demande un code." }
answer: { optionId: d }
explanation:
  correct:
    en: "With mfa_serial in the profile, the AWS CLI prompts for the one-time code and sends the device ARN and the code in the AssumeRole call. AWS STS then marks the session as authenticated with MFA, which satisfies the trust policy condition, and the CLI caches the role credentials until they expire."
    fr: "Avec mfa_serial dans le profil, l'AWS CLI demande le code à usage unique et envoie l'ARN du périphérique et le code dans l'appel AssumeRole. AWS STS marque alors la session comme authentifiée par MFA, ce qui satisfait la condition de la politique d'approbation, et la CLI met en cache les informations d'identification du rôle jusqu'à leur expiration."
  options:
    a:
      en: "A session token without an MFA code proves nothing about MFA, and adding one by hand to a long-term profile breaks it once the token expires."
      fr: "Un jeton de session sans code MFA ne prouve rien quant à la MFA, et l'ajouter à la main à un profil à long terme le rend inutilisable dès l'expiration du jeton."
    b:
      en: "An external ID is a separate trust policy condition for third parties; it is not an MFA code."
      fr: "Un ID externe est une condition distincte de politique d'approbation destinée aux tiers ; ce n'est pas un code MFA."
    c:
      en: "Rewriting the role's policies takes more effort than a profile setting, and the AssumeRole call still carries no MFA information."
      fr: "Réécrire les politiques du rôle demande plus d'efforts qu'un paramètre de profil, et l'appel AssumeRole ne contient toujours aucune information MFA."
references:
  - title: Using an IAM role in the AWS CLI
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-role.html
