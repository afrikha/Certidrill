id: dvac03-2a-idpool-guest-upload
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building a mobile game. Players can upload screenshots to an Amazon S3 bucket before they create an account. The app must not contain long-term AWS credentials, and each upload must use temporary credentials with limited permissions.

    Which solution will meet these requirements?
  fr: |
    Une entreprise développe un jeu mobile. Les joueurs peuvent charger des captures d'écran dans un compartiment (bucket) Amazon S3 avant de créer un compte. L'application ne doit contenir aucune information d'identification AWS à long terme, et chaque chargement doit utiliser des informations d'identification temporaires aux autorisations limitées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon Cognito user pool and grant the user pool app client permission to write to the bucket.", fr: "Créer un groupe d'utilisateurs (user pool) Amazon Cognito et accorder au client d'application du groupe l'autorisation d'écrire dans le compartiment." } }
    - { id: b, text: { en: "Create an IAM user with write access to the bucket and store its access keys in the app's encrypted settings.", fr: "Créer un utilisateur IAM ayant un accès en écriture au compartiment et stocker ses clés d'accès dans les paramètres chiffrés de l'application." } }
    - { id: c, text: { en: "Create an Amazon Cognito identity pool with guest access enabled and give its unauthenticated role write access to the bucket.", fr: "Créer un groupe d'identités (identity pool) Amazon Cognito avec l'accès invité activé et donner à son rôle non authentifié un accès en écriture au compartiment." } }
    - { id: d, text: { en: "Enable S3 Transfer Acceleration on the bucket and let the app send anonymous upload requests to the bucket.", fr: "Activer S3 Transfer Acceleration sur le compartiment et laisser l'application envoyer des demandes de chargement anonymes au compartiment." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Cognito identity pools issue temporary, limited-privilege AWS credentials. With guest (unauthenticated) access enabled, the app calls GetId and GetCredentialsForIdentity without any sign-in and receives the credentials of the unauthenticated role, which can be limited to s3:PutObject on the bucket."
    fr: "Les groupes d'identités Amazon Cognito émettent des informations d'identification AWS temporaires aux privilèges limités. Avec l'accès invité (non authentifié) activé, l'application appelle GetId et GetCredentialsForIdentity sans connexion et reçoit les informations d'identification du rôle non authentifié, que l'on peut limiter à s3:PutObject sur le compartiment."
  options:
    a:
      en: "A user pool is a user directory that issues JSON Web Tokens after sign-in. It is not an IAM principal, so it cannot receive S3 permissions, and it requires players to sign in."
      fr: "Un groupe d'utilisateurs est un annuaire qui émet des jetons web JSON après la connexion. Ce n'est pas un principal IAM : il ne peut pas recevoir d'autorisations S3, et il oblige les joueurs à se connecter."
    b:
      en: "Access keys of an IAM user are long-term credentials, and embedding them in a distributed app breaks the stated requirement."
      fr: "Les clés d'accès d'un utilisateur IAM sont des informations d'identification à long terme, et les intégrer dans une application distribuée enfreint l'exigence."
    d:
      en: "Transfer Acceleration only speeds up transfers. Anonymous uploads would require a bucket policy that lets anyone write, and they use no temporary credentials."
      fr: "Transfer Acceleration accélère seulement les transferts. Des chargements anonymes exigeraient une politique de compartiment permettant à tout le monde d'écrire, sans aucune information d'identification temporaire."
references:
  - title: Identity pools authentication flow
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html
  - title: IAM roles
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/iam-roles.html
