id: dvac03-2b-role-session-name-audit
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An internal web application runs on Amazon EC2. For each signed-in employee, the backend calls AssumeRole for the role TenantData and then calls Amazon S3 with the temporary credentials. Every AssumeRole call uses the RoleSessionName value backend. In the AWS CloudTrail data events for Amazon S3, the security team cannot tell which employee made each request. The company wants to identify the employee in each S3 event with the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une application web interne s'exécute sur Amazon EC2. Pour chaque employé connecté, le backend appelle AssumeRole sur le rôle TenantData, puis appelle Amazon S3 avec les informations d'identification temporaires. Chaque appel AssumeRole utilise la valeur backend pour RoleSessionName. Dans les événements de données AWS CloudTrail d'Amazon S3, l'équipe de sécurité ne peut pas savoir quel employé a effectué chaque requête. L'entreprise veut identifier l'employé dans chaque événement S3 avec le MOINS d'efforts de développement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable S3 server access logging on the buckets, and join the logs with the application logs.", fr: "Activer la journalisation des accès au serveur S3 sur les compartiments, et croiser ces journaux avec ceux de l'application." }
    - id: b
      text: { en: "Set RoleSessionName to the employee's user name in each AssumeRole call.", fr: "Définir RoleSessionName sur le nom d'utilisateur de l'employé dans chaque appel AssumeRole." }
    - id: c
      text: { en: "Create one IAM role for each employee, and have the backend assume the matching role.", fr: "Créer un rôle IAM par employé, et faire assumer au backend le rôle correspondant." }
    - id: d
      text: { en: "Pass the employee's user name in the ExternalId parameter of each AssumeRole call.", fr: "Passer le nom d'utilisateur de l'employé dans le paramètre ExternalId de chaque appel AssumeRole." }
answer: { optionId: b }
explanation:
  correct:
    en: "The role session name becomes part of the assumed-role ARN (arn:aws:sts::account:assumed-role/TenantData/session-name), which CloudTrail records in the userIdentity element of every event made with those credentials. Using the employee's user name as the session name identifies the employee in each S3 data event with a one-line change."
    fr: "Le nom de session du rôle fait partie de l'ARN du rôle assumé (arn:aws:sts::account:assumed-role/TenantData/session-name), que CloudTrail enregistre dans l'élément userIdentity de chaque événement effectué avec ces informations d'identification. Utiliser le nom d'utilisateur de l'employé comme nom de session identifie l'employé dans chaque événement de données S3 avec une modification d'une ligne."
  options:
    a:
      en: "Server access logs show the same assumed-role requester for every employee, so joining them with other logs adds effort without a reliable identity."
      fr: "Les journaux d'accès au serveur montrent le même demandeur de rôle assumé pour tous les employés : les croiser avec d'autres journaux ajoute des efforts sans identité fiable."
    c:
      en: "One role per employee would work but requires creating and maintaining many roles, which is far more effort than changing the session name."
      fr: "Un rôle par employé fonctionnerait, mais nécessite de créer et de maintenir de nombreux rôles, ce qui demande bien plus d'efforts que de modifier le nom de session."
    d:
      en: "The external ID is checked by the trust policy during AssumeRole; it is not part of the session identity that appears in the S3 events."
      fr: "L'ID externe est vérifié par la politique d'approbation lors d'AssumeRole ; il ne fait pas partie de l'identité de session qui apparaît dans les événements S3."
references:
  - title: Logging IAM and AWS STS API calls with AWS CloudTrail
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/cloudtrail-integration.html
