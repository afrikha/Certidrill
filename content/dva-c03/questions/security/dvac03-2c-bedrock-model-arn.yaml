id: dvac03-2c-bedrock-model-arn
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function in account 111122223333 calls the Amazon Bedrock InvokeModel API in us-east-1 with the model ID amazon.titan-embed-text-v2:0 to create embeddings. The function's execution role has the following identity-based policy:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": "bedrock:InvokeModel",
          "Resource": "arn:aws:bedrock:us-east-1:111122223333:foundation-model/amazon.titan-embed-text-v2:0"
        }
      ]
    }
    ```

    Every call fails with AccessDeniedException. No other policy denies Amazon Bedrock actions.

    Which change will fix the error?
  fr: |
    Une fonction AWS Lambda du compte 111122223333 appelle l'API Amazon Bedrock InvokeModel dans us-east-1 avec l'ID de modèle amazon.titan-embed-text-v2:0 pour créer des embeddings. Le rôle d'exécution de la fonction possède la politique basée sur l'identité suivante :

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": "bedrock:InvokeModel",
          "Resource": "arn:aws:bedrock:us-east-1:111122223333:foundation-model/amazon.titan-embed-text-v2:0"
        }
      ]
    }
    ```

    Chaque appel échoue avec AccessDeniedException. Aucune autre politique ne refuse les actions Amazon Bedrock.

    Quelle modification corrige l'erreur ?
body:
  options:
    - id: a
      text: { en: "Add aws-marketplace:Subscribe, aws-marketplace:Unsubscribe, and aws-marketplace:ViewSubscriptions on all resources to the policy.", fr: "Ajouter à la politique aws-marketplace:Subscribe, aws-marketplace:Unsubscribe et aws-marketplace:ViewSubscriptions sur toutes les ressources." }
    - id: b
      text: { en: "Add bedrock:InvokeModelWithResponseStream to the Action element of the statement, on the same foundation model resource.", fr: "Ajouter bedrock:InvokeModelWithResponseStream dans l'élément Action de l'instruction, sur la même ressource de modèle de fondation." }
    - id: c
      text: { en: "Submit the first-time use form for the account in the Amazon Bedrock console, and wait for the agreement before the next call.", fr: "Soumettre le formulaire de première utilisation pour le compte dans la console Amazon Bedrock, et attendre l'accord avant le prochain appel." }
    - id: d
      text: { en: "Remove the account ID from the resource ARN, so that it reads arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0.", fr: "Retirer l'ID de compte de l'ARN de ressource, pour obtenir arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0." }
answer: { optionId: d }
explanation:
  correct:
    en: "Foundation models are AWS-owned resources, so their ARNs have an empty account field: arn:aws:bedrock:region::foundation-model/model-id. A Resource element that contains an account ID never matches the model, so the allow does not apply and the request is denied."
    fr: "Les modèles de fondation sont des ressources détenues par AWS : leur ARN a un champ de compte vide, arn:aws:bedrock:region::foundation-model/model-id. Un élément Resource qui contient un ID de compte ne correspond jamais au modèle : l'autorisation ne s'applique pas et la requête est refusée."
  options:
    a:
      en: "AWS Marketplace permissions are needed only for the first use of models sold through AWS Marketplace; Amazon models have no Marketplace product, and the ARN would still not match."
      fr: "Les autorisations AWS Marketplace ne sont nécessaires qu'à la première utilisation de modèles vendus via AWS Marketplace ; les modèles Amazon n'ont pas de produit Marketplace, et l'ARN ne correspondrait toujours pas."
    b:
      en: "InvokeModelWithResponseStream is needed only for streaming calls; the function uses InvokeModel, and the ARN would still not match."
      fr: "InvokeModelWithResponseStream n'est nécessaire que pour les appels en streaming ; la fonction utilise InvokeModel, et l'ARN ne correspondrait toujours pas."
    c:
      en: "The first-time use form applies to some Anthropic models, not to Amazon Titan models."
      fr: "Le formulaire de première utilisation concerne certains modèles Anthropic, pas les modèles Amazon Titan."
references:
  - title: Identity-based policy examples for Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/security_iam_id-based-policy-examples.html
  - title: Request access to models
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-access.html
