id: dvac03-2b-update-object-encryption
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon S3 general purpose bucket holds 400 million objects encrypted with SSE-S3, in several storage classes. A new compliance rule requires all objects, existing and new, to be encrypted with SSE-KMS and a customer managed key. The storage class and the last modified date of each existing object must not change. The company wants the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Un compartiment Amazon S3 à usage général contient 400 millions d'objets chiffrés avec SSE-S3, dans plusieurs classes de stockage. Une nouvelle règle de conformité exige que tous les objets, existants et nouveaux, soient chiffrés avec SSE-KMS et une clé gérée par le client. La classe de stockage et la date de dernière modification de chaque objet existant ne doivent pas changer. L'entreprise veut le MOINS d'efforts possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the default encryption of the bucket to SSE-KMS with the key, and let Amazon S3 re-encrypt the existing objects.", fr: "Changer le chiffrement par défaut du compartiment en SSE-KMS avec la clé, et laisser Amazon S3 rechiffrer les objets existants." }
    - id: b
      text: { en: "Change the default encryption of the bucket to SSE-KMS with the key, and run an S3 Batch Operations job that updates the encryption of the existing objects.", fr: "Changer le chiffrement par défaut du compartiment en SSE-KMS avec la clé, et exécuter une tâche S3 Batch Operations qui met à jour le chiffrement des objets existants." }
    - id: c
      text: { en: "Change the default encryption of the bucket to SSE-KMS with the key, and run an S3 Batch Operations job that copies each object onto itself.", fr: "Changer le chiffrement par défaut du compartiment en SSE-KMS avec la clé, et exécuter une tâche S3 Batch Operations qui copie chaque objet sur lui-même." }
    - id: d
      text: { en: "Change the default encryption of the bucket to SSE-KMS with the key, and run a Lambda function that downloads and uploads each object again.", fr: "Changer le chiffrement par défaut du compartiment en SSE-KMS avec la clé, et exécuter une fonction Lambda qui télécharge puis charge de nouveau chaque objet." }
answer: { optionId: b }
explanation:
  correct:
    en: "Default encryption applies only to new uploads. The UpdateObjectEncryption operation, which S3 Batch Operations can run across billions of objects, changes SSE-S3 objects to SSE-KMS by re-encrypting their data keys, without copying the data. It preserves the object metadata, including the storage class and the last modified date."
    fr: "Le chiffrement par défaut ne s'applique qu'aux nouveaux chargements. L'opération UpdateObjectEncryption, que S3 Batch Operations peut exécuter sur des milliards d'objets, fait passer des objets SSE-S3 en SSE-KMS en rechiffrant leurs clés de données, sans copier les données. Elle conserve les métadonnées des objets, y compris la classe de stockage et la date de dernière modification."
  options:
    a:
      en: "Changing the default encryption does not change the encryption of objects that already exist in the bucket."
      fr: "Changer le chiffrement par défaut ne modifie pas le chiffrement des objets déjà présents dans le compartiment."
    c:
      en: "Copying an object onto itself rewrites it as a new object, which changes its last modified date."
      fr: "Copier un objet sur lui-même le réécrit comme un nouvel objet, ce qui change sa date de dernière modification."
    d:
      en: "Downloading and uploading 400 million objects takes far more effort and also changes the last modified dates."
      fr: "Télécharger et charger de nouveau 400 millions d'objets demande bien plus d'efforts et change aussi les dates de dernière modification."
references:
  - title: Updating server-side encryption for existing data
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/update-sse-encryption.html
