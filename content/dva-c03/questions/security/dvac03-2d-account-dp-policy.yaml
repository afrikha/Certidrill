id: dvac03-2d-account-dp-policy
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs many Lambda functions that log conversations with an AI assistant. New functions are deployed every week, each with its own log group. Credit card numbers must be masked in all current and future log groups of the account.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute de nombreuses fonctions Lambda qui journalisent des conversations avec un assistant d'IA. De nouvelles fonctions sont déployées chaque semaine, chacune avec son propre groupe de journaux. Les numéros de carte bancaire doivent être masqués dans tous les groupes de journaux actuels et futurs du compte.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create a subscription filter on each log group that sends events to a Lambda function that removes credit card numbers.", fr: "Créer sur chaque groupe de journaux un filtre d'abonnement qui envoie les événements à une fonction Lambda chargée de supprimer les numéros de carte." } }
    - { id: b, text: { en: "Attach a data protection policy to each existing log group, and add an EventBridge rule that attaches it to new log groups.", fr: "Attacher une politique de protection des données à chaque groupe de journaux existant, et ajouter une règle EventBridge qui l'attache aux nouveaux groupes de journaux." } }
    - { id: c, text: { en: "Create a metric filter for credit card patterns in each log group, and an alarm that notifies the developers.", fr: "Créer dans chaque groupe de journaux un filtre de métriques pour les modèles de numéros de carte, et une alarme qui avertit les développeurs." } }
    - { id: d, text: { en: "Create an account-level data protection policy in CloudWatch Logs with the managed data identifier for credit card numbers.", fr: "Créer dans CloudWatch Logs une politique de protection des données au niveau du compte avec l'identifiant de données géré pour les numéros de carte bancaire." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An account-level data protection policy applies to all existing log groups of the account and to log groups created in the future. One policy with the credit card managed data identifier masks the numbers everywhere without per-group work."
    fr: "Une politique de protection des données au niveau du compte s'applique à tous les groupes de journaux existants du compte et à ceux créés à l'avenir. Une seule politique avec l'identifiant de données géré pour les numéros de carte les masque partout, sans travail groupe par groupe."
  options:
    a:
      en: "A subscription filter forwards copies of the events; the events stored in the log group keep the numbers, and every group needs its own filter."
      fr: "Un filtre d'abonnement transfère des copies des événements ; les événements stockés dans le groupe de journaux conservent les numéros, et chaque groupe a besoin de son propre filtre."
    b:
      en: "Log group policies would work, but the automation for new groups adds overhead that an account-level policy avoids."
      fr: "Des politiques par groupe de journaux fonctionneraient, mais l'automatisation pour les nouveaux groupes ajoute une charge qu'une politique au niveau du compte évite."
    c:
      en: "A metric filter and an alarm only detect the numbers; they do not mask them."
      fr: "Un filtre de métriques et une alarme ne font que détecter les numéros ; ils ne les masquent pas."
references:
  - title: Help protect sensitive log data with masking
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
