id: dvac03-2d-lambda-sourcearn
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Lambda function implements the action group of one Amazon Bedrock agent. Other agents in the same AWS account must not be able to invoke this function, even if a developer adds the function to their action groups.

    Which resource-based policy statement should the developer attach to the function?
  fr: |
    Une fonction Lambda implémente le groupe d'actions d'un seul agent Amazon Bedrock. Les autres agents du même compte AWS ne doivent pas pouvoir invoquer cette fonction, même si un développeur l'ajoute à leurs groupes d'actions.

    Quelle instruction de politique basée sur les ressources le développeur doit-il attacher à la fonction ?
body:
  options:
    - { id: a, text: { en: "Allow lambda:InvokeFunction for the bedrock.amazonaws.com principal with an AWS:SourceAccount condition set to the account ID.", fr: "Autoriser lambda:InvokeFunction pour le principal bedrock.amazonaws.com avec une condition AWS:SourceAccount définie sur l'ID du compte." } }
    - { id: b, text: { en: "Allow sts:AssumeRole for the bedrock.amazonaws.com principal with an AWS:SourceArn condition set to the agent's ARN.", fr: "Autoriser sts:AssumeRole pour le principal bedrock.amazonaws.com avec une condition AWS:SourceArn définie sur l'ARN de l'agent." } }
    - { id: c, text: { en: "Allow lambda:InvokeFunction for the bedrock.amazonaws.com principal with an AWS:SourceArn condition set to the agent's ARN.", fr: "Autoriser lambda:InvokeFunction pour le principal bedrock.amazonaws.com avec une condition AWS:SourceArn définie sur l'ARN de l'agent." } }
    - { id: d, text: { en: "Allow lambda:InvokeFunction for the agent's service role with an AWS:SourceAccount condition set to the account ID.", fr: "Autoriser lambda:InvokeFunction pour le rôle de service de l'agent avec une condition AWS:SourceAccount définie sur l'ID du compte." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Bedrock invokes action group functions as the bedrock.amazonaws.com service principal, which needs lambda:InvokeFunction in the function's resource-based policy. An AWS:SourceArn condition set to the agent's ARN (with AWS:SourceAccount) limits the permission to that one agent."
    fr: "Amazon Bedrock invoque les fonctions des groupes d'actions en tant que principal de service bedrock.amazonaws.com, qui a besoin de lambda:InvokeFunction dans la politique basée sur les ressources de la fonction. Une condition AWS:SourceArn définie sur l'ARN de l'agent (avec AWS:SourceAccount) limite l'autorisation à ce seul agent."
  options:
    a:
      en: "An account condition alone lets every agent in the account invoke the function."
      fr: "Une condition sur le compte seule permet à tous les agents du compte d'invoquer la fonction."
    b:
      en: "sts:AssumeRole belongs in a role trust policy, not in a Lambda function policy, and it grants no permission to invoke the function."
      fr: "sts:AssumeRole relève de la politique d'approbation d'un rôle, pas de la politique d'une fonction Lambda, et n'accorde aucune autorisation d'invoquer la fonction."
    d:
      en: "The documented permission is granted to the bedrock.amazonaws.com service principal, and an account condition does not identify the calling agent."
      fr: "L'autorisation documentée est accordée au principal de service bedrock.amazonaws.com, et une condition sur le compte n'identifie pas l'agent appelant."
references:
  - title: Create a service role for Amazon Bedrock Agents
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-permissions.html
