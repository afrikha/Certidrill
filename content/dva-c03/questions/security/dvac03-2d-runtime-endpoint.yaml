id: dvac03-2d-runtime-endpoint
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an AWS Lambda function in private subnets of a VPC. The subnets have no route to an internet gateway or a NAT gateway, and they must stay without internet access. The function must call the Amazon Bedrock Converse API. The developer does not want to change the SDK client code of the function.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une fonction AWS Lambda dans des sous-réseaux privés d'un VPC. Les sous-réseaux n'ont aucune route vers une passerelle Internet ou une passerelle NAT, et ils doivent rester sans accès à Internet. La fonction doit appeler l'API Converse d'Amazon Bedrock. Le développeur ne veut pas modifier le code du client SDK de la fonction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a gateway VPC endpoint for Amazon Bedrock and add it to the route tables of the private subnets.", fr: "Créer un point de terminaison de VPC de passerelle pour Amazon Bedrock et l'ajouter aux tables de routage des sous-réseaux privés." } }
    - { id: b, text: { en: "Create an interface VPC endpoint for the com.amazonaws.region.bedrock service with private DNS enabled.", fr: "Créer un point de terminaison de VPC d'interface pour le service com.amazonaws.region.bedrock avec le DNS privé activé." } }
    - { id: c, text: { en: "Create an interface VPC endpoint for the com.amazonaws.region.bedrock-runtime service with private DNS enabled.", fr: "Créer un point de terminaison de VPC d'interface pour le service com.amazonaws.region.bedrock-runtime avec le DNS privé activé." } }
    - { id: d, text: { en: "Add a NAT gateway in a public subnet and route the outbound traffic of the private subnets through it.", fr: "Ajouter une passerelle NAT dans un sous-réseau public et faire passer par elle le trafic sortant des sous-réseaux privés." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Converse is part of the Amazon Bedrock Runtime API, which is reached privately through an interface endpoint (AWS PrivateLink) for the bedrock-runtime service. With private DNS enabled, the default bedrock-runtime Regional host name resolves to the endpoint's private addresses, so the SDK code does not change."
    fr: "Converse fait partie de l'API Amazon Bedrock Runtime, accessible en privé par un point de terminaison d'interface (AWS PrivateLink) pour le service bedrock-runtime. Avec le DNS privé activé, le nom d'hôte régional par défaut de bedrock-runtime se résout vers les adresses privées du point de terminaison : le code SDK ne change pas."
  options:
    a:
      en: "Gateway endpoints exist only for Amazon S3 and DynamoDB. Amazon Bedrock is reached through interface endpoints."
      fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et DynamoDB. Amazon Bedrock est accessible par des points de terminaison d'interface."
    b:
      en: "The bedrock service is the control plane API (models, guardrails, configuration). Inference calls such as Converse use the bedrock-runtime service."
      fr: "Le service bedrock est l'API du plan de contrôle (modèles, barrières de protection, configuration). Les appels d'inférence comme Converse utilisent le service bedrock-runtime."
    d:
      en: "A NAT gateway gives the subnets outbound internet access, which the requirements forbid."
      fr: "Une passerelle NAT donne aux sous-réseaux un accès sortant à Internet, ce que les exigences interdisent."
references:
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
