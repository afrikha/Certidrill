id: dvac03-2d-no-training
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company is building an application that sends patient questions to a foundation model through the Amazon Bedrock InvokeModel API, on demand. The compliance team requires that the prompts and responses are not used to train the base models and are not shared with the model provider.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de santé développe une application qui envoie des questions de patients à un modèle de fondation par l'API InvokeModel d'Amazon Bedrock, à la demande. L'équipe de conformité exige que les invites et les réponses ne soient pas utilisées pour entraîner les modèles de base et ne soient pas partagées avec le fournisseur du modèle.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Purchase Provisioned Throughput for the model so that the requests run on capacity that is dedicated to the account.", fr: "Acheter du Provisioned Throughput pour le modèle afin que les requêtes s'exécutent sur une capacité dédiée au compte." } }
    - { id: b, text: { en: "Keep calling the model on demand, because Amazon Bedrock does not use prompts or responses for training or share them.", fr: "Continuer à appeler le modèle à la demande, car Amazon Bedrock n'utilise pas les invites ni les réponses pour l'entraînement et ne les partage pas." } }
    - { id: c, text: { en: "Fine-tune a custom model so that the prompts are processed by a private copy of the model instead of the base model.", fr: "Affiner un modèle personnalisé afin que les invites soient traitées par une copie privée du modèle au lieu du modèle de base." } }
    - { id: d, text: { en: "Enable model invocation logging to an encrypted S3 bucket so that the model provider cannot read the prompts.", fr: "Activer la journalisation des invocations de modèles vers un compartiment S3 chiffré afin que le fournisseur du modèle ne puisse pas lire les invites." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS and third-party model providers do not use the inputs to or outputs from Amazon Bedrock to train their models, and inputs and outputs are not shared with model providers. Models run in deployment accounts operated by AWS that the providers cannot access, so no extra configuration is needed."
    fr: "AWS et les fournisseurs tiers de modèles n'utilisent pas les entrées ni les sorties d'Amazon Bedrock pour entraîner leurs modèles, et les entrées et sorties ne sont pas partagées avec les fournisseurs. Les modèles s'exécutent dans des comptes de déploiement exploités par AWS auxquels les fournisseurs n'ont pas accès : aucune configuration supplémentaire n'est nécessaire."
  options:
    a:
      en: "Provisioned Throughput buys dedicated capacity for throughput; it adds cost and is not what keeps data out of training, which already applies on demand."
      fr: "Le Provisioned Throughput achète une capacité dédiée pour le débit ; il ajoute un coût et n'est pas ce qui exclut les données de l'entraînement, ce qui s'applique déjà à la demande."
    c:
      en: "Fine-tuning adds a training job and a custom model to manage, and the base model already does not learn from the prompts."
      fr: "L'affinage ajoute une tâche d'entraînement et un modèle personnalisé à gérer, alors que le modèle de base n'apprend déjà pas des invites."
    d:
      en: "Invocation logging stores extra copies of the prompts in the account; providers never had access to them, so it adds data to protect without meeting a new need."
      fr: "La journalisation des invocations stocke des copies supplémentaires des invites dans le compte ; les fournisseurs n'y ont jamais eu accès : elle ajoute des données à protéger sans répondre à un nouveau besoin."
references:
  - title: Amazon Bedrock FAQs
    url: https://aws.amazon.com/bedrock/faqs/
  - title: Data protection
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html
