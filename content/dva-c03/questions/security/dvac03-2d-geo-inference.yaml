id: dvac03-2d-geo-inference
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company in the EU calls a foundation model in Amazon Bedrock from the eu-west-1 Region. Traffic peaks now exceed the on-demand capacity available to the company in that Region, so the developer wants Amazon Bedrock to route requests to other Regions. Regulations require that the prompts are processed only in EU Regions. The company does not want a capacity commitment.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de l'UE appelle un modèle de fondation dans Amazon Bedrock depuis la Région eu-west-1. Les pics de trafic dépassent désormais la capacité à la demande dont l'entreprise dispose dans cette Région : le développeur veut qu'Amazon Bedrock achemine les requêtes vers d'autres Régions. La réglementation exige que les invites ne soient traitées que dans des Régions de l'UE. L'entreprise ne veut pas d'engagement de capacité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Invoke the model through an EU geographic cross-Region inference profile.", fr: "Invoquer le modèle par un profil d'inférence interrégional géographique EU." } }
    - { id: b, text: { en: "Invoke the model through a global cross-Region inference profile.", fr: "Invoquer le modèle par un profil d'inférence interrégional global." } }
    - { id: c, text: { en: "Purchase Provisioned Throughput for the model in eu-west-1.", fr: "Acheter du Provisioned Throughput pour le modèle dans eu-west-1." } }
    - { id: d, text: { en: "Create interface VPC endpoints for bedrock-runtime in several EU Regions.", fr: "Créer des points de terminaison de VPC d'interface pour bedrock-runtime dans plusieurs Régions de l'UE." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A geographic inference profile lets Amazon Bedrock route each request to a Region within one geography, such as the EU, which suits data residency rules. It adds capacity across Regions at standard on-demand pricing, without a commitment."
    fr: "Un profil d'inférence géographique permet à Amazon Bedrock d'acheminer chaque requête vers une Région d'une même zone géographique, comme l'UE, ce qui convient aux règles de résidence des données. Il ajoute de la capacité entre Régions au tarif à la demande standard, sans engagement."
  options:
    b:
      en: "A global profile can route requests to any supported commercial Region worldwide, which breaks the EU-only processing rule."
      fr: "Un profil global peut acheminer les requêtes vers n'importe quelle Région commerciale prise en charge dans le monde, ce qui enfreint la règle de traitement dans l'UE uniquement."
    c:
      en: "Provisioned Throughput is a capacity commitment, which the company does not want, and it does not route requests to other Regions."
      fr: "Le Provisioned Throughput est un engagement de capacité, dont l'entreprise ne veut pas, et il n'achemine pas les requêtes vers d'autres Régions."
    d:
      en: "VPC endpoints give private connectivity to one Region's service; they do not route requests across Regions, which the application would have to do itself."
      fr: "Les points de terminaison de VPC donnent une connectivité privée au service d'une Région ; ils n'acheminent pas les requêtes entre Régions, ce que l'application devrait faire elle-même."
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
