id: dvac03-2c-short-lived-ca
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A development team runs internal test services on Amazon EC2 and in containers under host names such as orders.test.internal. The team's own tooling requests a new private TLS certificate for each service every time the service is redeployed, at least every 5 days, and installs it on the service. Clients must trust every certificate through one company root CA, and no revocation is needed. The solution must be the MOST cost-effective.

    Which solution will meet these requirements?
  fr: |
    Une équipe de développement exécute des services de test internes sur Amazon EC2 et dans des conteneurs, sous des noms d'hôte tels que orders.test.internal. L'outillage de l'équipe demande un nouveau certificat TLS privé pour chaque service à chaque redéploiement du service, au moins tous les 5 jours, et l'installe sur le service. Les clients doivent approuver chaque certificat via une seule autorité de certification (CA) racine de l'entreprise, et aucune révocation n'est nécessaire. La solution doit être la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a subordinate CA in short-lived certificate mode in AWS Private CA, and issue certificates valid for 7 days or less with IssueCertificate.", fr: "Créer une CA subordonnée en mode certificat de courte durée (short-lived) dans AWS Private CA, et émettre avec IssueCertificate des certificats valides 7 jours au plus." }
    - id: b
      text: { en: "Create a subordinate CA in general-purpose mode in AWS Private CA, request private certificates through ACM, and export them for each service.", fr: "Créer une CA subordonnée en mode général (general-purpose) dans AWS Private CA, demander des certificats privés via ACM, et les exporter pour chaque service." }
    - id: c
      text: { en: "Request public certificates from AWS Certificate Manager (ACM) for each host name with DNS validation, and export them for each service.", fr: "Demander des certificats publics à AWS Certificate Manager (ACM) pour chaque nom d'hôte avec la validation DNS, et les exporter pour chaque service." }
    - id: d
      text: { en: "Generate a self-signed certificate with OpenSSL on each service at deployment time, and import each certificate into ACM.", fr: "Générer un certificat autosigné avec OpenSSL sur chaque service au moment du déploiement, et importer chaque certificat dans ACM." }
answer: { optionId: a }
explanation:
  correct:
    en: "A CA in short-lived certificate mode issues certificates valid for at most seven days and costs less than a general-purpose CA. Short validity removes the need for revocation, and a subordinate CA chains to the company root CA. ACM cannot issue certificates from a short-lived CA, so the tooling calls IssueCertificate on AWS Private CA directly."
    fr: "Une CA en mode certificat de courte durée émet des certificats valides sept jours au maximum et coûte moins cher qu'une CA en mode général. La courte validité supprime le besoin de révocation, et une CA subordonnée se rattache à la CA racine de l'entreprise. ACM ne pouvant pas émettre de certificats depuis une CA de courte durée, l'outillage appelle directement IssueCertificate sur AWS Private CA."
  options:
    b:
      en: "A general-purpose CA works technically, but it costs more than a short-lived CA for certificates that live only a few days."
      fr: "Une CA en mode général fonctionne techniquement, mais elle coûte plus cher qu'une CA de courte durée pour des certificats qui ne vivent que quelques jours."
    c:
      en: "A public CA cannot validate private names such as orders.test.internal, and the certificates would not chain to the company root CA."
      fr: "Une CA publique ne peut pas valider des noms privés comme orders.test.internal, et les certificats ne se rattacheraient pas à la CA racine de l'entreprise."
    d:
      en: "Each self-signed certificate is its own trust anchor, so clients cannot trust them all through one company root CA."
      fr: "Chaque certificat autosigné est sa propre ancre d'approbation : les clients ne peuvent pas tous les approuver via une seule CA racine de l'entreprise."
references:
  - title: Understand AWS Private CA CA modes
    url: https://docs.aws.amazon.com/privateca/latest/userguide/short-lived-certificates.html
