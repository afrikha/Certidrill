id: dvac03-2c-kms-encrypt-size-limit
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building a document service in Python. The service must encrypt PDF files of 2 MB to 10 MB in the application before it uploads them to Amazon S3, by using a symmetric customer managed key in AWS KMS. A developer calls the KMS Encrypt operation with the file content, and every request fails with a validation error. The solution must make as few calls to AWS KMS as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise développe un service de documents en Python. Le service doit chiffrer, dans l'application, des fichiers PDF de 2 Mo à 10 Mo avant de les charger dans Amazon S3, à l'aide d'une clé symétrique gérée par le client dans AWS KMS. Un développeur appelle l'opération KMS Encrypt avec le contenu du fichier, et chaque requête échoue avec une erreur de validation. La solution doit effectuer le moins d'appels possible à AWS KMS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Split each file into 4 KB chunks, call Encrypt for each chunk, and store the encrypted chunks together in one S3 object.", fr: "Découper chaque fichier en blocs de 4 Ko, appeler Encrypt pour chaque bloc et stocker les blocs chiffrés ensemble dans un seul objet S3." }
    - id: b
      text: { en: "Replace the key with an asymmetric RSA_4096 KMS key, and call Encrypt with the RSAES_OAEP_SHA_256 algorithm for each file.", fr: "Remplacer la clé par une clé KMS asymétrique RSA_4096, et appeler Encrypt avec l'algorithme RSAES_OAEP_SHA_256 pour chaque fichier." }
    - id: c
      text: { en: "Call GenerateDataKey once per file, encrypt the file locally with the plaintext key, and store the encrypted data key with the object.", fr: "Appeler GenerateDataKey une fois par fichier, chiffrer le fichier localement avec la clé de données en texte clair, et stocker la clé de données chiffrée avec l'objet." }
    - id: d
      text: { en: "Request a Service Quotas increase for the maximum plaintext size of the Encrypt operation in the account and Region.", fr: "Demander, dans Service Quotas, une augmentation de la taille maximale du texte clair de l'opération Encrypt pour le compte et la Région." }
answer: { optionId: c }
explanation:
  correct:
    en: "Encrypt accepts at most 4,096 bytes of plaintext with a symmetric key; it is meant for small secrets such as passwords or identifiers. Envelope encryption solves the problem: one GenerateDataKey call returns a plaintext data key to encrypt the file locally and an encrypted copy to store with the object, which Decrypt turns back into the data key when the file is read."
    fr: "Encrypt accepte au maximum 4 096 octets de texte clair avec une clé symétrique ; l'opération est prévue pour de petits secrets comme des mots de passe ou des identifiants. Le chiffrement d'enveloppe résout le problème : un seul appel GenerateDataKey renvoie une clé de données en texte clair pour chiffrer le fichier localement et une copie chiffrée à stocker avec l'objet, que Decrypt retransforme en clé de données à la lecture du fichier."
  options:
    a:
      en: "Chunking would need thousands of Encrypt calls per file, which contradicts the requirement to minimize calls to AWS KMS and adds cost and throttling risk."
      fr: "Le découpage nécessiterait des milliers d'appels Encrypt par fichier, ce qui contredit l'exigence de limiter les appels à AWS KMS et ajoute du coût et un risque de limitation."
    b:
      en: "Asymmetric keys accept even less data: an RSA_4096 key with RSAES_OAEP_SHA_256 encrypts at most 446 bytes."
      fr: "Les clés asymétriques acceptent encore moins de données : une clé RSA_4096 avec RSAES_OAEP_SHA_256 chiffre au maximum 446 octets."
    d:
      en: "The 4,096-byte plaintext limit of Encrypt is part of the API, not an adjustable quota."
      fr: "La limite de 4 096 octets de texte clair d'Encrypt fait partie de l'API ; ce n'est pas un quota ajustable."
references:
  - title: Encrypt
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_Encrypt.html
  - title: GenerateDataKey
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_GenerateDataKey.html
