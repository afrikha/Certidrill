id: dvac03-2a-ecs-task-role
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs two services as Amazon ECS tasks on the same Amazon EC2 container instances. The orders service must send messages to an Amazon SQS queue, and the reports service must read objects from an Amazon S3 bucket. Today, both services use the permissions of the container instance role. Each service must receive only its own permissions.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute deux services sous forme de tâches Amazon ECS sur les mêmes instances de conteneur Amazon EC2. Le service orders doit envoyer des messages à une file d'attente Amazon SQS, et le service reports doit lire des objets d'un compartiment Amazon S3. Aujourd'hui, les deux services utilisent les autorisations du rôle de l'instance de conteneur. Chaque service ne doit recevoir que ses propres autorisations.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create one IAM role per service that trusts ecs-tasks.amazonaws.com, and set it as the taskRoleArn of each task definition.", fr: "Créer un rôle IAM par service qui approuve ecs-tasks.amazonaws.com et le définir comme taskRoleArn de chaque définition de tâche." } }
    - { id: b, text: { en: "Create one IAM role per service that trusts ecs-tasks.amazonaws.com, and set it as the executionRoleArn of each task definition.", fr: "Créer un rôle IAM par service qui approuve ecs-tasks.amazonaws.com et le définir comme executionRoleArn de chaque définition de tâche." } }
    - { id: c, text: { en: "Attach both sets of permissions to the container instance role, and require IMDSv2 on the container instances.", fr: "Attacher les deux ensembles d'autorisations au rôle de l'instance de conteneur et exiger IMDSv2 sur les instances de conteneur." } }
    - { id: d, text: { en: "Run each service on its own container instances, and give each instance profile the permissions of one service.", fr: "Exécuter chaque service sur ses propres instances de conteneur et donner à chaque profil d'instance les autorisations d'un service." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A task role, set with taskRoleArn, gives the containers of a task credentials through the ECS container credentials endpoint, and the SDK container provider uses them automatically. When a task has a task role, the SDK uses only those credentials, so each service gets only its own permissions."
    fr: "Un rôle de tâche, défini par taskRoleArn, fournit aux conteneurs d'une tâche des informations d'identification par le point de terminaison des informations d'identification de conteneur ECS, et le fournisseur de conteneur du SDK les utilise automatiquement. Quand une tâche a un rôle de tâche, le SDK n'utilise que ces informations d'identification : chaque service n'obtient que ses propres autorisations."
  options:
    b:
      en: "The task execution role is used by the ECS agent to pull images and send logs; its permissions are not available to the application code."
      fr: "Le rôle d'exécution de tâche sert à l'agent ECS pour extraire les images et envoyer les journaux ; ses autorisations ne sont pas disponibles pour le code de l'application."
    c:
      en: "IMDSv2 protects the metadata service but does not separate permissions: every container would still get both sets."
      fr: "IMDSv2 protège le service de métadonnées mais ne sépare pas les autorisations : chaque conteneur obtiendrait toujours les deux ensembles."
    d:
      en: "This separates permissions, but it adds instances to manage and pay for instead of using task roles."
      fr: "Cela sépare les autorisations, mais ajoute des instances à gérer et à payer au lieu d'utiliser des rôles de tâche."
references:
  - title: Amazon ECS task IAM role
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html
