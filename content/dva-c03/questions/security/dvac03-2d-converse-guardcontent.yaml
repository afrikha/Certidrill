id: dvac03-2d-converse-guardcontent
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer calls the Amazon Bedrock Converse API with a guardrail. Each user message contains two text blocks: a long product catalog extract that the company trusts, and the customer's question. The guardrail evaluates the whole message, which raises costs and causes false positives on the catalog text. Only the customer's question must be evaluated.

    Which solution will meet these requirements?
  fr: |
    Un développeur appelle l'API Converse d'Amazon Bedrock avec une barrière de protection (guardrail). Chaque message utilisateur contient deux blocs de texte : un long extrait du catalogue de produits, auquel l'entreprise fait confiance, et la question du client. La barrière de protection évalue tout le message, ce qui augmente les coûts et provoque des faux positifs sur le texte du catalogue. Seule la question du client doit être évaluée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Wrap the customer's question in amazon-bedrock-guardrails-guardContent XML tags and set tagSuffix in amazon-bedrock-guardrailConfig.", fr: "Encadrer la question du client de balises XML amazon-bedrock-guardrails-guardContent et définir tagSuffix dans amazon-bedrock-guardrailConfig." } }
    - { id: b, text: { en: "Call the ApplyGuardrail API on the catalog extract with source set to OUTPUT before each Converse call.", fr: "Appeler l'API ApplyGuardrail sur l'extrait du catalogue avec source défini sur OUTPUT avant chaque appel Converse." } }
    - { id: c, text: { en: "Put the customer's question in a guardContent content block and leave the catalog extract in a plain text block.", fr: "Placer la question du client dans un bloc de contenu guardContent et laisser l'extrait du catalogue dans un bloc de texte simple." } }
    - { id: d, text: { en: "Set trace to disabled in guardrailConfig so that the guardrail skips the content blocks that the application adds.", fr: "Définir trace sur disabled dans guardrailConfig afin que la barrière de protection ignore les blocs de contenu ajoutés par l'application." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With the Converse API, a guardContent block marks the content to assess. Once a message contains a guardContent block, the guardrail evaluates only the guardContent blocks and skips the other content blocks, so the catalog text is no longer assessed."
    fr: "Avec l'API Converse, un bloc guardContent indique le contenu à évaluer. Dès qu'un message contient un bloc guardContent, la barrière de protection n'évalue que les blocs guardContent et ignore les autres blocs de contenu : le texte du catalogue n'est plus évalué."
  options:
    a:
      en: "XML input tags apply to the InvokeModel and InvokeModelWithResponseStream APIs; with Converse, the selection is made with guardContent blocks."
      fr: "Les balises d'entrée XML s'appliquent aux API InvokeModel et InvokeModelWithResponseStream ; avec Converse, la sélection se fait avec des blocs guardContent."
    b:
      en: "An extra ApplyGuardrail call adds a second evaluation of the catalog; it does not stop Converse from evaluating the whole message."
      fr: "Un appel ApplyGuardrail supplémentaire ajoute une seconde évaluation du catalogue ; il n'empêche pas Converse d'évaluer tout le message."
    d:
      en: "trace controls whether the response includes details of the guardrail's assessment; it does not change what is evaluated."
      fr: "trace détermine si la réponse inclut le détail de l'évaluation de la barrière de protection ; il ne change pas ce qui est évalué."
references:
  - title: Include a guardrail with the Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
