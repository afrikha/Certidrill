id: dvac03-2a-ddb-attributes-select
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores employee records in an Amazon DynamoDB table whose partition key is EmployeeId. A partner application uses an IAM role to call GetItem and Query on the table. The partner must be able to read only the EmployeeId, Name, and Department attributes and must never receive the Salary attribute, even if its code omits a projection expression.

    Which policy configuration will meet these requirements?
  fr: |
    Une entreprise stocke les dossiers des employés dans une table Amazon DynamoDB dont la clé de partition est EmployeeId. Une application partenaire utilise un rôle IAM pour appeler GetItem et Query sur la table. Le partenaire ne doit pouvoir lire que les attributs EmployeeId, Name et Department et ne doit jamais recevoir l'attribut Salary, même si son code omet l'expression de projection.

    Quelle configuration de politique répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A deny statement that uses ForAnyValue:StringEquals on dynamodb:Attributes with the value Salary.", fr: "Une instruction de refus qui utilise ForAnyValue:StringEquals sur dynamodb:Attributes avec la valeur Salary." } }
    - { id: b, text: { en: "An allow statement with ForAllValues:StringEquals on dynamodb:Attributes for the three attributes, and dynamodb:ReturnValues limited to NONE.", fr: "Une instruction d'autorisation avec ForAllValues:StringEquals sur dynamodb:Attributes pour les trois attributs, et dynamodb:ReturnValues limité à NONE." } }
    - { id: c, text: { en: "An allow statement with ForAllValues:StringEquals on dynamodb:Attributes for the three attributes, and dynamodb:Select limited to SPECIFIC_ATTRIBUTES.", fr: "Une instruction d'autorisation avec ForAllValues:StringEquals sur dynamodb:Attributes pour les trois attributs, et dynamodb:Select limité à SPECIFIC_ATTRIBUTES." } }
    - { id: d, text: { en: "An allow statement with ForAllValues:StringEquals on dynamodb:LeadingKeys for the three attribute names, and dynamodb:Select limited to SPECIFIC_ATTRIBUTES.", fr: "Une instruction d'autorisation avec ForAllValues:StringEquals sur dynamodb:LeadingKeys pour les trois noms d'attributs, et dynamodb:Select limité à SPECIFIC_ATTRIBUTES." } }
answer: { optionId: c }
explanation:
  correct:
    en: "dynamodb:Attributes restricts the attributes that a request can name, and the list must include the key attributes. A StringEqualsIfExists condition that sets dynamodb:Select to SPECIFIC_ATTRIBUTES forces every read to name its attributes, so a request that asks for the whole item is denied instead of returning Salary."
    fr: "dynamodb:Attributes limite les attributs qu'une demande peut nommer, et la liste doit inclure les attributs de clé. Une condition StringEqualsIfExists qui fixe dynamodb:Select à SPECIFIC_ATTRIBUTES oblige chaque lecture à nommer ses attributs : une demande qui réclame l'élément entier est refusée au lieu de renvoyer Salary."
  options:
    a:
      en: "A read that names no attributes returns the whole item without matching the deny condition. AWS recommends allow-list conditions for this pattern."
      fr: "Une lecture qui ne nomme aucun attribut renvoie l'élément entier sans correspondre à la condition de refus. AWS recommande des conditions de type liste d'autorisation pour ce modèle."
    b:
      en: "ReturnValues concerns the response of write operations. A GetItem without a projection still returns all attributes, because ForAllValues is true when the key is absent."
      fr: "ReturnValues concerne la réponse des opérations d'écriture. Un GetItem sans projection renvoie toujours tous les attributs, car ForAllValues est vrai quand la clé est absente."
    d:
      en: "dynamodb:LeadingKeys holds partition key values, not attribute names, so this condition would block normal reads instead of filtering attributes."
      fr: "dynamodb:LeadingKeys contient des valeurs de clé de partition, pas des noms d'attributs : cette condition bloquerait les lectures normales au lieu de filtrer les attributs."
references:
  - title: Using IAM policy conditions for fine-grained access control
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/specifying-conditions.html
