id: dvac03-2a-abac-tagsession
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer uses an Amazon Cognito identity pool to give users of a user pool access to Amazon S3. Users must access only the prefix of their own department. The developer enables attributes for access control and maps the immutable department attribute to a principal tag. The permissions policy of the authenticated role allows access to `arn:aws:s3:::anycompany-docs/${aws:PrincipalTag/department}/*`.

    After the change, GetCredentialsForIdentity calls fail with an access denied error. The trust policy of the role allows the cognito-identity.amazonaws.com principal to perform sts:AssumeRoleWithWebIdentity, with conditions on aud and amr.

    What should the developer do to resolve the issue?
  fr: |
    Un développeur utilise un groupe d'identités Amazon Cognito pour donner aux utilisateurs d'un groupe d'utilisateurs l'accès à Amazon S3. Les utilisateurs ne doivent accéder qu'au préfixe de leur propre service. Le développeur active les attributs pour le contrôle d'accès (attributes for access control) et associe l'attribut non modifiable department à une balise de principal. La politique d'autorisations du rôle authentifié autorise l'accès à `arn:aws:s3:::anycompany-docs/${aws:PrincipalTag/department}/*`.

    Après la modification, les appels GetCredentialsForIdentity échouent avec une erreur d'accès refusé. La politique d'approbation du rôle autorise le principal cognito-identity.amazonaws.com à effectuer sts:AssumeRoleWithWebIdentity, avec des conditions sur aud et amr.

    Que doit faire le développeur pour résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Replace `${aws:PrincipalTag/department}` with `${cognito-identity.amazonaws.com:sub}` in the permissions policy.", fr: "Remplacer `${aws:PrincipalTag/department}` par `${cognito-identity.amazonaws.com:sub}` dans la politique d'autorisations." } }
    - { id: b, text: { en: "Switch the identity pool to the basic (classic) flow so that the app passes the tags to AWS STS itself.", fr: "Passer le groupe d'identités au flux de base (classique) pour que l'application transmette elle-même les balises à AWS STS." } }
    - { id: c, text: { en: "Add the iam:PassRole action for the authenticated role to the permissions policy of the same role.", fr: "Ajouter l'action iam:PassRole sur le rôle authentifié à la politique d'autorisations de ce même rôle." } }
    - { id: d, text: { en: "Add the sts:TagSession action to the statement of the role's trust policy.", fr: "Ajouter l'action sts:TagSession à l'instruction de la politique d'approbation du rôle." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Attributes for access control pass the mapped claims to AWS STS as session tags, which become principal tags. The role's trust policy must therefore allow both sts:AssumeRoleWithWebIdentity and sts:TagSession for the Cognito principal; without sts:TagSession, the role cannot be assumed with tags."
    fr: "Les attributs pour le contrôle d'accès transmettent les revendications associées à AWS STS sous forme de balises de session, qui deviennent des balises de principal. La politique d'approbation du rôle doit donc autoriser à la fois sts:AssumeRoleWithWebIdentity et sts:TagSession pour le principal Cognito ; sans sts:TagSession, le rôle ne peut pas être assumé avec des balises."
  options:
    a:
      en: "The identity ID differs for every user, so this would give per-user prefixes instead of department prefixes; it also leaves the trust policy problem unsolved for the tags."
      fr: "L'ID d'identité est propre à chaque utilisateur : on obtiendrait des préfixes par utilisateur et non par service, et le problème des balises dans la politique d'approbation resterait entier."
    b:
      en: "The basic flow is not recommended, and the role would still need sts:TagSession in its trust policy to accept tags."
      fr: "Le flux de base n'est pas recommandé, et le rôle aurait toujours besoin de sts:TagSession dans sa politique d'approbation pour accepter des balises."
    c:
      en: "iam:PassRole is needed by the person who sets roles on the identity pool, not when users obtain credentials."
      fr: "iam:PassRole est nécessaire à la personne qui définit les rôles du groupe d'identités, pas lorsque les utilisateurs obtiennent des informations d'identification."
references:
  - title: Using attributes for access control
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/attributes-for-access-control.html
