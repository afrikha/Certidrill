id: dvac03-2b-cloudfront-cert-region
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany serves a static website through an Amazon CloudFront distribution whose origin is an Amazon S3 bucket in the eu-west-1 Region. The company wants viewers to reach the site at https://www.example.com with a public certificate from AWS Certificate Manager (ACM). A developer requested the certificate in ACM in eu-west-1, and it is issued, but it does not appear in the list of certificates in the distribution settings.

    Which solution will meet these requirements?
  fr: |
    AnyCompany diffuse un site web statique par une distribution Amazon CloudFront dont l'origine est un compartiment Amazon S3 de la Région eu-west-1. L'entreprise veut que les utilisateurs accèdent au site à l'adresse https://www.example.com avec un certificat public d'AWS Certificate Manager (ACM). Un développeur a demandé le certificat dans ACM en eu-west-1 et il est émis, mais il n'apparaît pas dans la liste des certificats des paramètres de la distribution.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Request the certificate again in eu-west-1 with email validation instead of DNS validation.", fr: "Demander de nouveau le certificat en eu-west-1 avec une validation par e-mail au lieu d'une validation DNS." }
    - id: b
      text: { en: "Request or import the certificate in ACM in the US East (N. Virginia) Region, us-east-1.", fr: "Demander ou importer le certificat dans ACM dans la Région USA Est (Virginie du Nord), us-east-1." }
    - id: c
      text: { en: "Attach the eu-west-1 certificate to an Application Load Balancer, and use the load balancer as the origin.", fr: "Attacher le certificat d'eu-west-1 à un Application Load Balancer, et utiliser l'équilibreur de charge comme origine." }
    - id: d
      text: { en: "Issue a private certificate for www.example.com from AWS Private CA in eu-west-1, and use it on the distribution.", fr: "Émettre un certificat privé pour www.example.com à partir d'AWS Private CA en eu-west-1, et l'utiliser sur la distribution." }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudFront is a global service and uses only ACM certificates that are requested or imported in the US East (N. Virginia) Region. A certificate for www.example.com in us-east-1 appears in the distribution settings, wherever the origin is located."
    fr: "CloudFront est un service global et n'utilise que des certificats ACM demandés ou importés dans la Région USA Est (Virginie du Nord). Un certificat pour www.example.com en us-east-1 apparaît dans les paramètres de la distribution, quel que soit l'emplacement de l'origine."
  options:
    a:
      en: "The validation method does not change the Region of the certificate, which is what CloudFront checks."
      fr: "La méthode de validation ne change pas la Région du certificat, ce que vérifie CloudFront."
    c:
      en: "A certificate on the origin secures the connection from CloudFront to the origin, not the viewer connection to www.example.com."
      fr: "Un certificat sur l'origine sécurise la connexion de CloudFront vers l'origine, et non la connexion des utilisateurs à www.example.com."
    d:
      en: "Browsers do not trust certificates from a private CA, and the Region would still be wrong for CloudFront."
      fr: "Les navigateurs n'approuvent pas les certificats d'une autorité de certification privée, et la Région resterait inadaptée à CloudFront."
references:
  - title: Managed automation with integrated services
    url: https://docs.aws.amazon.com/acm/latest/userguide/acm-services.html
