id: dvac03-2b-kms-key-policy
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer uses the AWS CLI to create a customer managed AWS KMS key with a custom key policy. The key policy lists only the security team's administrator role as a principal. An AWS Lambda function's execution role has an identity-based policy that allows kms:Decrypt on the key ARN, but the function receives an AccessDeniedException when it calls Decrypt. The company does not want to grant the function any other KMS permission.

    Which solution will meet these requirements?
  fr: |
    Un développeur utilise l'AWS CLI pour créer une clé AWS KMS gérée par le client avec une politique de clé personnalisée. La politique de clé ne mentionne comme principal que le rôle d'administrateur de l'équipe de sécurité. Le rôle d'exécution d'une fonction AWS Lambda possède une politique basée sur l'identité qui autorise kms:Decrypt sur l'ARN de la clé, mais la fonction reçoit une erreur AccessDeniedException lorsqu'elle appelle Decrypt. L'entreprise ne veut accorder à la fonction aucune autre autorisation KMS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Replace the statement in the execution role's policy with one that allows kms:* on all resources.", fr: "Remplacer l'instruction de la politique du rôle d'exécution par une instruction qui autorise kms:* sur toutes les ressources." }
    - id: b
      text: { en: "Create an alias for the key, and reference the alias ARN instead of the key ARN in the execution role's policy.", fr: "Créer un alias pour la clé, et référencer l'ARN de l'alias au lieu de l'ARN de la clé dans la politique du rôle d'exécution." }
    - id: c
      text: { en: "Add a statement to the key policy that allows the function's execution role to call kms:Decrypt on the key.", fr: "Ajouter à la politique de clé une instruction qui autorise le rôle d'exécution de la fonction à appeler kms:Decrypt sur la clé." }
    - id: d
      text: { en: "Add a statement to the function's resource-based policy that allows kms.amazonaws.com to invoke the function.", fr: "Ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise kms.amazonaws.com à appeler la fonction." }
answer: { optionId: c }
explanation:
  correct:
    en: "Every KMS key must have a key policy, and IAM policies take effect for a key only if the key policy allows it, usually through the statement that gives the account principal access. This custom key policy has no such statement, so the identity-based policy is ineffective. Allowing the execution role to call kms:Decrypt directly in the key policy grants exactly the needed permission."
    fr: "Chaque clé KMS doit avoir une politique de clé, et les politiques IAM ne prennent effet pour une clé que si la politique de clé le permet, généralement par l'instruction qui donne accès au principal du compte. Cette politique de clé personnalisée ne contient pas cette instruction : la politique basée sur l'identité est donc sans effet. Autoriser directement le rôle d'exécution à appeler kms:Decrypt dans la politique de clé accorde exactement l'autorisation nécessaire."
  options:
    a:
      en: "A broader identity-based policy is still ineffective because the key policy does not enable IAM policies, and kms:* breaks the requirement to grant no other permission."
      fr: "Une politique basée sur l'identité plus large reste sans effet, car la politique de clé n'active pas les politiques IAM, et kms:* enfreint l'exigence de n'accorder aucune autre autorisation."
    b:
      en: "Referencing an alias does not change how the key policy is evaluated; the key policy still does not allow the role or enable IAM policies."
      fr: "Référencer un alias ne change pas l'évaluation de la politique de clé ; celle-ci n'autorise toujours pas le rôle et n'active pas les politiques IAM."
    d:
      en: "AWS KMS does not invoke the function; the function calls AWS KMS, so the permission must be granted on the key."
      fr: "AWS KMS n'appelle pas la fonction ; c'est la fonction qui appelle AWS KMS, l'autorisation doit donc être accordée sur la clé."
references:
  - title: Default key policy
    url: https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html
