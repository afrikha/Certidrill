id: dvac03-2c-macie-eventbridge-notify
objective: "2.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Customers upload files to an Amazon S3 bucket through a web application. The security team must be notified automatically by email when uploaded files contain sensitive data such as bank account numbers or health insurance identifiers. The solution must not require the company to write code that inspects file content.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Des clients chargent des fichiers dans un compartiment (bucket) Amazon S3 via une application web. L'équipe de sécurité doit être avertie automatiquement par e-mail lorsque des fichiers chargés contiennent des données sensibles comme des numéros de compte bancaire ou des identifiants d'assurance maladie. La solution ne doit pas obliger l'entreprise à écrire du code qui inspecte le contenu des fichiers.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure an S3 event notification for s3:ObjectCreated:* events that publishes to an Amazon SNS topic with an email subscription.", fr: "Configurer une notification d'événement S3 pour les événements s3:ObjectCreated:* qui publie dans une rubrique Amazon SNS avec un abonnement par e-mail." } }
    - { id: b, text: { en: "Create an Amazon EventBridge rule that matches Macie finding events and sends them to an Amazon SNS topic with an email subscription.", fr: "Créer une règle Amazon EventBridge qui correspond aux événements de résultats Macie et les envoie à une rubrique Amazon SNS avec un abonnement par e-mail." } }
    - { id: c, text: { en: "Enable Amazon GuardDuty Malware Protection for S3 on the bucket, and send its findings to the security team.", fr: "Activer Amazon GuardDuty Malware Protection for S3 sur le compartiment, et envoyer ses résultats à l'équipe de sécurité." } }
    - { id: d, text: { en: "Enable Amazon Macie, and run a daily scheduled sensitive data discovery job on the bucket with the managed data identifiers.", fr: "Activer Amazon Macie, et exécuter sur le compartiment une tâche quotidienne planifiée de découverte des données sensibles avec les identifiants de données gérés." } }
    - { id: e, text: { en: "Turn on AWS CloudTrail data events for the bucket, and create a CloudWatch metric filter and alarm on PutObject calls.", fr: "Activer les événements de données AWS CloudTrail pour le compartiment, et créer un filtre de métrique et une alarme CloudWatch sur les appels PutObject." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A scheduled Macie sensitive data discovery job inspects new objects with managed data identifiers and creates sensitive data findings. Macie publishes these findings to Amazon EventBridge automatically, so a rule can route them to an SNS topic that emails the security team."
    fr: "Une tâche planifiée de découverte des données sensibles Macie inspecte les nouveaux objets avec des identifiants de données gérés et crée des résultats de données sensibles. Macie publie automatiquement ces résultats dans Amazon EventBridge : une règle peut les acheminer vers une rubrique SNS qui envoie un e-mail à l'équipe de sécurité."
  options:
    a:
      en: "An S3 event notification fires for every upload, whether or not the file contains sensitive data, so the team would be notified about all files."
      fr: "Une notification d'événement S3 se déclenche à chaque chargement, que le fichier contienne ou non des données sensibles : l'équipe serait avertie pour tous les fichiers."
    c:
      en: "GuardDuty Malware Protection for S3 scans uploads for malware, not for sensitive data such as account numbers."
      fr: "GuardDuty Malware Protection for S3 analyse les chargements à la recherche de logiciels malveillants, pas de données sensibles comme des numéros de compte."
    e:
      en: "CloudTrail data events record the API calls, not the content of the objects, so the alarm would fire on uploads regardless of their content."
      fr: "Les événements de données CloudTrail enregistrent les appels d'API, pas le contenu des objets : l'alarme se déclencherait à chaque chargement, quel que soit le contenu."
references:
  - title: Processing Macie findings with Amazon EventBridge
    url: https://docs.aws.amazon.com/macie/latest/user/findings-monitor-events-eventbridge.html
