id: dvac03-2a-userpool-social-signin
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is developing a web application. Users must be able to sign in with their Google or Apple accounts, or with an email address and a password. The application needs a single user directory and must receive the same type of tokens for every user, whatever the sign-in method. The developers want the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise développe une application web. Les utilisateurs doivent pouvoir se connecter avec leur compte Google ou Apple, ou avec une adresse e-mail et un mot de passe. L'application a besoin d'un annuaire d'utilisateurs unique et doit recevoir le même type de jetons pour chaque utilisateur, quelle que soit la méthode de connexion. Les développeurs veulent le MOINS d'effort de développement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon Cognito user pool, add Google and Apple as identity providers, and use managed login.", fr: "Créer un groupe d'utilisateurs Amazon Cognito, ajouter Google et Apple comme fournisseurs d'identité et utiliser la connexion gérée (managed login)." } }
    - { id: b, text: { en: "Create an Amazon Cognito identity pool with Google and Apple as providers, and store passwords in Amazon DynamoDB.", fr: "Créer un groupe d'identités Amazon Cognito avec Google et Apple comme fournisseurs, et stocker les mots de passe dans Amazon DynamoDB." } }
    - { id: c, text: { en: "Create IAM OIDC identity providers for Google and Apple, and create an IAM user for each email user.", fr: "Créer des fournisseurs d'identité OIDC IAM pour Google et Apple, et créer un utilisateur IAM pour chaque utilisateur par e-mail." } }
    - { id: d, text: { en: "Enable IAM Identity Center and add Google and Apple as external identity providers for application users.", fr: "Activer IAM Identity Center et ajouter Google et Apple comme fournisseurs d'identité externes pour les utilisateurs de l'application." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A user pool is a user directory that supports local users and federation with Google, Apple, Facebook, Login with Amazon, SAML 2.0 and OIDC providers. Federated sign-in uses a user pool domain and managed login, and Amazon Cognito acts as the identity provider of the app, so the app always receives user pool tokens."
    fr: "Un groupe d'utilisateurs est un annuaire qui prend en charge les utilisateurs locaux et la fédération avec Google, Apple, Facebook, Login with Amazon et les fournisseurs SAML 2.0 et OIDC. La connexion fédérée utilise un domaine du groupe d'utilisateurs et la connexion gérée, et Amazon Cognito joue le rôle de fournisseur d'identité de l'application : celle-ci reçoit toujours des jetons du groupe d'utilisateurs."
  options:
    b:
      en: "An identity pool exchanges tokens for AWS credentials; it is not a user directory. Building password storage yourself adds effort and risk."
      fr: "Un groupe d'identités échange des jetons contre des informations d'identification AWS ; ce n'est pas un annuaire d'utilisateurs. Développer soi-même le stockage des mots de passe ajoute de l'effort et des risques."
    c:
      en: "IAM OIDC providers let roles be assumed with web identity tokens; they do not sign users in to an app, and IAM users are not meant for application customers."
      fr: "Les fournisseurs OIDC IAM permettent d'assumer des rôles avec des jetons d'identité web ; ils ne connectent pas les utilisateurs à une application, et les utilisateurs IAM ne sont pas destinés aux clients d'une application."
    d:
      en: "IAM Identity Center manages workforce access to AWS accounts and applications. It is not a customer directory with social sign-in."
      fr: "IAM Identity Center gère l'accès du personnel aux comptes AWS et aux applications. Ce n'est pas un annuaire de clients avec connexion par réseau social."
references:
  - title: User pool sign-in with third party identity providers
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-identity-federation.html
