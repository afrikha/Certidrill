id: dvac03-2d-regex-account-ref
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's assistant built on Amazon Bedrock sometimes repeats internal account references in its answers. The references use the format ACC- followed by eight digits, for example ACC-40417215. The references must be replaced with a placeholder in responses, and the rest of each response must still be returned. The guardrail already handles other personal data.

    Which change to the guardrail will meet these requirements?
  fr: |
    L'assistant d'une banque créé sur Amazon Bedrock répète parfois des références de compte internes dans ses réponses. Les références ont le format ACC- suivi de huit chiffres, par exemple ACC-40417215. Les références doivent être remplacées par un espace réservé dans les réponses, et le reste de chaque réponse doit toujours être renvoyé. La barrière de protection (guardrail) traite déjà les autres données personnelles.

    Quelle modification de la barrière de protection répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the US_BANK_ACCOUNT_NUMBER entity type to the sensitive information filter with the ANONYMIZE action.", fr: "Ajouter le type d'entité US_BANK_ACCOUNT_NUMBER au filtre d'informations sensibles avec l'action ANONYMIZE." } }
    - { id: b, text: { en: "Add a word filter that contains the string ACC- so that matching words are removed from the responses.", fr: "Ajouter un filtre de mots qui contient la chaîne ACC- afin que les mots correspondants soient retirés des réponses." } }
    - { id: c, text: { en: "Add a denied topic whose definition describes internal account references, with the output action set to BLOCK.", fr: "Ajouter un sujet refusé dont la définition décrit les références de compte internes, avec l'action de sortie définie sur BLOCK." } }
    - { id: d, text: { en: "Add a regex to the sensitive information filter with the pattern ACC-[0-9]{8} and the ANONYMIZE action.", fr: "Ajouter une expression régulière au filtre d'informations sensibles avec le modèle ACC-[0-9]{8} et l'action ANONYMIZE." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Sensitive information filters accept custom regex entities in addition to the predefined PII types. A regex that matches the internal format, with the ANONYMIZE action, masks each reference and returns the rest of the response."
    fr: "Les filtres d'informations sensibles acceptent des entités personnalisées par expression régulière en plus des types de PII prédéfinis. Une expression régulière qui correspond au format interne, avec l'action ANONYMIZE, masque chaque référence et renvoie le reste de la réponse."
  options:
    a:
      en: "US_BANK_ACCOUNT_NUMBER detects US bank account numbers, not the company's own ACC- reference format."
      fr: "US_BANK_ACCOUNT_NUMBER détecte les numéros de compte bancaire américains, pas le format de référence ACC- propre à l'entreprise."
    b:
      en: "Word filters match exact words or phrases and block the content; they cannot match a variable pattern or mask it."
      fr: "Les filtres de mots détectent des mots ou expressions exacts et bloquent le contenu ; ils ne peuvent pas détecter un modèle variable ni le masquer."
    c:
      en: "A denied topic blocks the whole response instead of masking the reference, and denied topics are not meant to catch specific entities."
      fr: "Un sujet refusé bloque toute la réponse au lieu de masquer la référence, et les sujets refusés ne sont pas conçus pour détecter des entités précises."
references:
  - title: Remove PII from conversations by using sensitive information filters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
