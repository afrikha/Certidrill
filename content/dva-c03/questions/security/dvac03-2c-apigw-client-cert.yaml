id: dvac03-2c-apigw-client-cert
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company exposes an Amazon API Gateway REST API whose methods use HTTP integrations with a backend web server that runs on Amazon EC2 and is reachable from the internet. The backend team must make sure that the web server accepts only requests that come from API Gateway. The backend is not in a VPC that API Gateway can reach privately.

    Which solution will meet these requirements?
  fr: |
    Une entreprise expose une API REST Amazon API Gateway dont les méthodes utilisent des intégrations HTTP avec un serveur web backend qui s'exécute sur Amazon EC2 et est accessible depuis Internet. L'équipe backend doit s'assurer que le serveur web n'accepte que les requêtes qui proviennent d'API Gateway. Le backend ne se trouve pas dans un VPC qu'API Gateway peut atteindre de façon privée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable mutual TLS on a custom domain name for the API with a truststore in Amazon S3, and require client certificates.", fr: "Activer le TLS mutuel sur un nom de domaine personnalisé de l'API avec un magasin d'approbation (truststore) dans Amazon S3, et exiger des certificats clients." }
    - id: b
      text: { en: "Create an API key and a usage plan for the stage, and configure the web server to check the x-api-key header of each request.", fr: "Créer une clé d'API et un plan d'utilisation pour l'étape, et configurer le serveur web pour vérifier l'en-tête x-api-key de chaque requête." }
    - id: c
      text: { en: "Add a resource policy to the API that allows execute-api:Invoke only from the public IP address of the web server.", fr: "Ajouter à l'API une politique de ressource qui n'autorise execute-api:Invoke que depuis l'adresse IP publique du serveur web." }
    - id: d
      text: { en: "Generate a client certificate in API Gateway, select it on the stage, and have the web server verify it with its public key.", fr: "Générer un certificat client dans API Gateway, le sélectionner sur l'étape, et le faire vérifier par le serveur web avec sa clé publique." }
answer: { optionId: d }
explanation:
  correct:
    en: "API Gateway can generate a self-signed client certificate, keep its private key, and present the certificate on every call to the HTTP integrations of the stage. The backend uses the PEM-encoded public key to verify that the caller is API Gateway. The certificate is valid for 365 days, so it must be rotated before it expires."
    fr: "API Gateway peut générer un certificat client autosigné, en conserver la clé privée et présenter le certificat à chaque appel des intégrations HTTP de l'étape. Le backend utilise la clé publique encodée en PEM pour vérifier que l'appelant est API Gateway. Le certificat est valide 365 jours : il faut le renouveler avant son expiration."
  options:
    a:
      en: "Mutual TLS on a custom domain authenticates the clients that call API Gateway, not API Gateway when it calls the backend."
      fr: "Le TLS mutuel sur un domaine personnalisé authentifie les clients qui appellent API Gateway, pas API Gateway lorsqu'il appelle le backend."
    b:
      en: "API keys identify clients of the API for usage plans; API Gateway does not forward them as proof of origin, and they are not an authentication mechanism."
      fr: "Les clés d'API identifient les clients de l'API pour les plans d'utilisation ; API Gateway ne les transmet pas comme preuve d'origine, et ce n'est pas un mécanisme d'authentification."
    c:
      en: "A resource policy controls who can invoke the API; it does not let the backend recognize requests sent by API Gateway."
      fr: "Une politique de ressource contrôle qui peut invoquer l'API ; elle ne permet pas au backend de reconnaître les requêtes envoyées par API Gateway."
references:
  - title: Use an API Gateway-generated certificate for backend authentication in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/getting-started-client-side-ssl-authentication.html
