id: dvac03-2a-cloudshell-locked-laptop
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer needs to run a few AWS CLI commands to inspect Amazon DynamoDB tables in an account. The developer's laptop is managed by the company, and no software can be installed on it. The developer can sign in to the AWS Management Console, and the company does not allow access keys.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Un développeur doit exécuter quelques commandes de l'AWS CLI pour examiner des tables Amazon DynamoDB d'un compte. Son ordinateur portable est géré par l'entreprise et aucun logiciel ne peut y être installé. Le développeur peut se connecter à l'AWS Management Console, et l'entreprise n'autorise pas les clés d'accès.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Open AWS CloudShell from the console, and run the commands in its preauthenticated shell.", fr: "Ouvrir AWS CloudShell depuis la console et exécuter les commandes dans son shell déjà authentifié." } }
    - { id: b, text: { en: "Write a Lambda function that runs the commands, and invoke it from the console for each command.", fr: "Écrire une fonction Lambda qui exécute les commandes et l'appeler depuis la console pour chaque commande." } }
    - { id: c, text: { en: "Launch an Amazon EC2 instance with an instance profile, and connect to it with EC2 Instance Connect.", fr: "Lancer une instance Amazon EC2 avec un profil d'instance et s'y connecter avec EC2 Instance Connect." } }
    - { id: d, text: { en: "Run aws login on the laptop to obtain temporary credentials from the console session.", fr: "Exécuter aws login sur l'ordinateur portable pour obtenir des informations d'identification temporaires à partir de la session de console." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS CloudShell is a browser-based shell launched from the console. It is already authenticated with the console identity and includes the AWS CLI, so nothing is installed on the laptop and no access key is created."
    fr: "AWS CloudShell est un shell dans le navigateur lancé depuis la console. Il est déjà authentifié avec l'identité de la console et inclut l'AWS CLI : rien n'est installé sur l'ordinateur et aucune clé d'accès n'est créée."
  options:
    b:
      en: "This works without keys but requires writing, deploying and updating a function for simple commands."
      fr: "Cela fonctionne sans clés, mais il faut écrire, déployer et mettre à jour une fonction pour de simples commandes."
    c:
      en: "This works without keys but adds an instance to launch, secure and pay for."
      fr: "Cela fonctionne sans clés, mais ajoute une instance à lancer, sécuriser et payer."
    d:
      en: "aws login is a command of the AWS CLI, which cannot be installed on the laptop."
      fr: "aws login est une commande de l'AWS CLI, qui ne peut pas être installée sur l'ordinateur."
references:
  - title: Programmatic access with AWS security credentials
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/security-creds-programmatic-access.html
