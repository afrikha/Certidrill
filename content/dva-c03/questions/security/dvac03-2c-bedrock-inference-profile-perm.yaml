id: dvac03-2c-bedrock-inference-profile-perm
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application in us-east-1 calls Converse with the model ID us.amazon.nova-pro-v1:0, a system-defined US cross-Region inference profile, to get more throughput. The application role allows bedrock:InvokeModel only on the ARN of that inference profile. Some requests succeed, but many fail with AccessDeniedException. The company wants the role to be able to invoke the model only through this inference profile.

    Which change will meet these requirements?
  fr: |
    Une application dans us-east-1 appelle Converse avec l'ID de modèle us.amazon.nova-pro-v1:0, un profil d'inférence interrégional US défini par le système, pour obtenir plus de débit. Le rôle de l'application n'autorise bedrock:InvokeModel que sur l'ARN de ce profil d'inférence. Certaines requêtes réussissent, mais beaucoup échouent avec AccessDeniedException. L'entreprise veut que le rôle ne puisse invoquer le modèle que via ce profil d'inférence.

    Quelle modification répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Also allow bedrock:InvokeModel on the foundation model ARN in us-east-1 only, with a bedrock:InferenceProfileArn condition set to the profile ARN.", fr: "Autoriser aussi bedrock:InvokeModel sur l'ARN du modèle de fondation dans us-east-1 uniquement, avec une condition bedrock:InferenceProfileArn égale à l'ARN du profil." }
    - id: b
      text: { en: "Also allow bedrock:InvokeModel on the foundation model ARN in every destination Region of the profile, with a bedrock:InferenceProfileArn condition set to the profile ARN.", fr: "Autoriser aussi bedrock:InvokeModel sur l'ARN du modèle de fondation dans chaque Région de destination du profil, avec une condition bedrock:InferenceProfileArn égale à l'ARN du profil." }
    - id: c
      text: { en: "Create an application inference profile that copies the system-defined profile, and allow bedrock:InvokeModel only on the ARN of the new application profile.", fr: "Créer un profil d'inférence d'application qui copie le profil défini par le système, et n'autoriser bedrock:InvokeModel que sur l'ARN de ce nouveau profil d'application." }
    - id: d
      text: { en: "Also allow bedrock:InvokeModel on the foundation model ARN in every destination Region of the profile, without any condition on the profile.", fr: "Autoriser aussi bedrock:InvokeModel sur l'ARN du modèle de fondation dans chaque Région de destination du profil, sans aucune condition sur le profil." }
answer: { optionId: b }
explanation:
  correct:
    en: "When a policy lists an inference profile, it must also allow the foundation model in each Region where the profile can route requests; requests routed to a Region whose model is not allowed are denied. The bedrock:InferenceProfileArn condition key limits those model permissions to calls made through the specified profile."
    fr: "Lorsqu'une politique cite un profil d'inférence, elle doit aussi autoriser le modèle de fondation dans chaque Région vers laquelle le profil peut acheminer les requêtes ; les requêtes acheminées vers une Région dont le modèle n'est pas autorisé sont refusées. La clé de condition bedrock:InferenceProfileArn limite ces autorisations sur le modèle aux appels faits via le profil indiqué."
  options:
    a:
      en: "The condition is correct, but requests routed to the other destination Regions of the profile would still be denied, so many calls would keep failing."
      fr: "La condition est correcte, mais les requêtes acheminées vers les autres Régions de destination du profil seraient toujours refusées : beaucoup d'appels continueraient d'échouer."
    c:
      en: "An application inference profile that routes across Regions has the same requirement: the foundation models in its destination Regions must also be allowed."
      fr: "Un profil d'inférence d'application qui achemine entre Régions a la même exigence : les modèles de fondation de ses Régions de destination doivent aussi être autorisés."
    d:
      en: "This fixes the errors, but without the condition the role could also invoke the model directly in those Regions, outside the inference profile."
      fr: "Cela corrige les erreurs, mais sans la condition le rôle pourrait aussi invoquer le modèle directement dans ces Régions, hors du profil d'inférence."
references:
  - title: Prerequisites for inference profiles
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-prereq.html
