id: dvac03-2d-findings-alarm
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A CloudWatch Logs log group stores conversations between customers and an AI assistant. A data protection policy on the log group masks personal data. The security team must receive an alarm whenever personal data is detected in the log group, and must get a detailed report of each detection in an Amazon S3 bucket that already exists.

    Which actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un groupe de journaux CloudWatch Logs stocke les conversations entre des clients et un assistant d'IA. Une politique de protection des données sur le groupe de journaux masque les données personnelles. L'équipe de sécurité doit recevoir une alarme chaque fois que des données personnelles sont détectées dans le groupe de journaux, et doit obtenir un rapport détaillé de chaque détection dans un compartiment Amazon S3 existant.

    Quelles actions répondent à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the S3 bucket name to the MaskConfig object of the Deidentify operation in the data protection policy.", fr: "Ajouter le nom du compartiment S3 à l'objet MaskConfig de l'opération Deidentify de la politique de protection des données." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the LogEventsWithFindings metric in the AWS/Logs namespace for the log group.", fr: "Créer une alarme CloudWatch sur la métrique LogEventsWithFindings de l'espace de noms AWS/Logs pour le groupe de journaux." } }
    - { id: c, text: { en: "Turn on CloudTrail Insights for the account's trail, and alarm on unusual PutLogEvents activity.", fr: "Activer CloudTrail Insights sur le journal de suivi du compte, et créer une alarme sur une activité PutLogEvents inhabituelle." } }
    - { id: d, text: { en: "Add the S3 bucket as a FindingsDestination in the Audit operation of the data protection policy.", fr: "Ajouter le compartiment S3 comme FindingsDestination dans l'opération Audit de la politique de protection des données." } }
    - { id: e, text: { en: "Export the log group to the S3 bucket every day with the aws logs create-export-task command.", fr: "Exporter chaque jour le groupe de journaux vers le compartiment S3 avec la commande aws logs create-export-task." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "When data that matches the policy's identifiers is detected, CloudWatch Logs emits the LogEventsWithFindings metric in the AWS/Logs namespace, which can drive an alarm. The Audit operation of the policy sends audit findings reports to the destinations listed in FindingsDestination, which can be an existing S3 bucket."
    fr: "Lorsque des données correspondant aux identifiants de la politique sont détectées, CloudWatch Logs émet la métrique LogEventsWithFindings dans l'espace de noms AWS/Logs, qui peut déclencher une alarme. L'opération Audit de la politique envoie les rapports d'audit vers les destinations listées dans FindingsDestination, qui peut être un compartiment S3 existant."
  options:
    a:
      en: "The MaskConfig object of the Deidentify operation must be empty; report destinations belong to the Audit operation."
      fr: "L'objet MaskConfig de l'opération Deidentify doit être vide ; les destinations des rapports relèvent de l'opération Audit."
    c:
      en: "CloudTrail Insights detects unusual API call volumes; it does not detect personal data inside log events."
      fr: "CloudTrail Insights détecte des volumes inhabituels d'appels d'API ; il ne détecte pas de données personnelles dans les événements du journal."
    e:
      en: "An export copies the log events once a day; it does not produce detection reports or an alarm."
      fr: "Une exportation copie les événements du journal une fois par jour ; elle ne produit ni rapports de détection ni alarme."
references:
  - title: Help protect sensitive log data with masking
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
  - title: Create a data protection policy for a single log group
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data-start.html
