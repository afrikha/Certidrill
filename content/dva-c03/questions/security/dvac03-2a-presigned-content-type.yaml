id: dvac03-2a-presigned-content-type
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A backend service generates presigned upload URLs with the following code:

    ```python
    url = s3.generate_presigned_url(
        ClientMethod="put_object",
        Params={"Bucket": "anycompany-uploads", "Key": key, "ContentType": "image/png"},
        ExpiresIn=300,
    )
    ```

    A test script uploads a PNG file within one minute with the following command, and Amazon S3 returns 403 SignatureDoesNotMatch. The clock of the test server is synchronized.

    ```bash
    curl -X PUT -T photo.png "$URL"
    ```

    Which change will fix the upload?
  fr: |
    Un service backend génère des URL de chargement présignées avec le code suivant :

    ```python
    url = s3.generate_presigned_url(
        ClientMethod="put_object",
        Params={"Bucket": "anycompany-uploads", "Key": key, "ContentType": "image/png"},
        ExpiresIn=300,
    )
    ```

    Un script de test charge un fichier PNG en moins d'une minute avec la commande suivante, et Amazon S3 renvoie 403 SignatureDoesNotMatch. L'horloge du serveur de test est synchronisée.

    ```bash
    curl -X PUT -T photo.png "$URL"
    ```

    Quelle modification corrige le chargement ?
body:
  options:
    - { id: a, text: { en: "Add s3:PutObjectAcl to the permissions of the role that generates the URL.", fr: "Ajouter s3:PutObjectAcl aux autorisations du rôle qui génère l'URL." } }
    - { id: b, text: { en: "Increase ExpiresIn to 3600 seconds so that the signature remains valid longer.", fr: "Porter ExpiresIn à 3600 secondes pour que la signature reste valide plus longtemps." } }
    - { id: c, text: { en: "Add the header `-H \"Content-Type: image/png\"` to the curl command.", fr: "Ajouter l'en-tête `-H \"Content-Type: image/png\"` à la commande curl." } }
    - { id: d, text: { en: "Remove the Key parameter so that the URL accepts any object name.", fr: "Supprimer le paramètre Key pour que l'URL accepte n'importe quel nom d'objet." } }
answer: { optionId: c }
explanation:
  correct:
    en: "ContentType is part of the signed request, so the uploader must send a Content-Type header with the same value. Without it, the signature that S3 computes differs from the one in the URL and the request fails with SignatureDoesNotMatch."
    fr: "ContentType fait partie de la demande signée : la personne qui charge doit envoyer un en-tête Content-Type de même valeur. Sans lui, la signature calculée par S3 diffère de celle de l'URL et la demande échoue avec SignatureDoesNotMatch."
  options:
    a:
      en: "The error is a signature mismatch, not a missing permission, and the upload sets no ACL."
      fr: "L'erreur est une signature non concordante, pas une autorisation manquante, et le chargement ne définit aucune ACL."
    b:
      en: "The upload happens well within the 300-second validity period, so the expiration is not the cause."
      fr: "Le chargement a lieu bien avant la fin des 300 secondes de validité : l'expiration n'est pas en cause."
    d:
      en: "Key is a required parameter; a presigned URL always targets one object key."
      fr: "Key est un paramètre obligatoire ; une URL présignée cible toujours une seule clé d'objet."
references:
  - title: Uploading objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/PresignedUrlUploadObject.html
