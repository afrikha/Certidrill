id: dvac03-2d-require-confirmation
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's Amazon Bedrock agent has an action group whose functions run in a Lambda function. One function, cancelSubscription, must never run unless the user explicitly approves the cancellation in the application first. The other functions of the action group must keep running in the Lambda function without approval.

    Which solution will meet these requirements?
  fr: |
    L'agent Amazon Bedrock d'une entreprise possède un groupe d'actions dont les fonctions s'exécutent dans une fonction Lambda. L'une d'elles, cancelSubscription, ne doit jamais s'exécuter sans que l'utilisateur ait d'abord approuvé explicitement la résiliation dans l'application. Les autres fonctions du groupe d'actions doivent continuer à s'exécuter dans la fonction Lambda sans approbation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable the agent's default pre-processing prompt so that the model classifies each user input before orchestration.", fr: "Activer l'invite de prétraitement par défaut de l'agent afin que le modèle classe chaque entrée utilisateur avant l'orchestration." } }
    - { id: b, text: { en: "Associate a guardrail with the agent that has a denied topic for subscription cancellations.", fr: "Associer à l'agent une barrière de protection qui comporte un sujet refusé pour les résiliations d'abonnement." } }
    - { id: c, text: { en: "Set customControl to RETURN_CONTROL in the actionGroupExecutor of the action group that contains the function.", fr: "Définir customControl sur RETURN_CONTROL dans l'actionGroupExecutor du groupe d'actions qui contient la fonction." } }
    - { id: d, text: { en: "Set requireConfirmation to ENABLED for the cancelSubscription function in the function schema of the action group.", fr: "Définir requireConfirmation sur ENABLED pour la fonction cancelSubscription dans le schéma de fonctions du groupe d'actions." } }
answer: { optionId: d }
explanation:
  correct:
    en: "requireConfirmation is set per function. When it is ENABLED, the agent returns the planned invocation to the application in a returnControl object, and the function runs only if the application sends back a CONFIRM confirmationState. The other functions are not affected."
    fr: "requireConfirmation se définit par fonction. Lorsqu'il vaut ENABLED, l'agent renvoie l'invocation prévue à l'application dans un objet returnControl, et la fonction ne s'exécute que si l'application renvoie un confirmationState CONFIRM. Les autres fonctions ne sont pas concernées."
  options:
    a:
      en: "The pre-processing prompt decides whether user input is safe to process; it does not ask the user to approve a specific action."
      fr: "L'invite de prétraitement décide si une entrée utilisateur peut être traitée sans risque ; elle ne demande pas à l'utilisateur d'approuver une action précise."
    b:
      en: "A denied topic would block cancellation requests entirely instead of letting the user approve them."
      fr: "Un sujet refusé bloquerait entièrement les demandes de résiliation au lieu de laisser l'utilisateur les approuver."
    c:
      en: "Return of control applies to the whole action group, so every function would be returned to the application instead of running in the Lambda function."
      fr: "Le retour de contrôle s'applique à tout le groupe d'actions : toutes les fonctions seraient renvoyées à l'application au lieu de s'exécuter dans la fonction Lambda."
references:
  - title: Get user confirmation before invoking action group function
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-userconfirmation.html
  - title: Add an action group to your agent in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-action-add.html
