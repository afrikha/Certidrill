id: dvac03-2a-idpool-group-roles
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's mobile app signs users in with an Amazon Cognito user pool and obtains AWS credentials from an Amazon Cognito identity pool. Users belong to user pool groups such as editors and readers, and each group needs a different IAM role. A user who belongs to several groups must receive the role of the group with the highest priority. Users can edit their own custom attributes on the app's profile page.

    Which solution will meet these requirements in the MOST secure way?
  fr: |
    L'application mobile d'une entreprise connecte les utilisateurs avec un groupe d'utilisateurs Amazon Cognito et obtient des informations d'identification AWS d'un groupe d'identités Amazon Cognito. Les utilisateurs appartiennent à des groupes du groupe d'utilisateurs, comme editors et readers, et chaque groupe a besoin d'un rôle IAM différent. Un utilisateur membre de plusieurs groupes doit recevoir le rôle du groupe ayant la priorité la plus élevée. Les utilisateurs peuvent modifier leurs propres attributs personnalisés sur la page de profil de l'application.

    Quelle solution répond à ces exigences de la manière la PLUS sécurisée ?
body:
  options:
    - { id: a, text: { en: "Add a custom:team attribute to the user pool, and create identity pool rules that map custom:team values to the roles.", fr: "Ajouter un attribut custom:team au groupe d'utilisateurs et créer des règles du groupe d'identités qui associent les valeurs de custom:team aux rôles." } }
    - { id: b, text: { en: "Assign an IAM role and a precedence value to each user pool group, and configure the identity pool to choose the role from the token.", fr: "Attribuer un rôle IAM et une valeur de priorité (precedence) à chaque groupe, et configurer le groupe d'identités pour choisir le rôle à partir du jeton." } }
    - { id: c, text: { en: "Enable the basic (classic) flow and have the app pass the role ARN of the user's group to AssumeRoleWithWebIdentity.", fr: "Activer le flux de base (classique) et faire transmettre par l'application l'ARN du rôle du groupe de l'utilisateur à AssumeRoleWithWebIdentity." } }
    - { id: d, text: { en: "Give the default authenticated role every permission, and have the app hide features based on the cognito:groups claim.", fr: "Donner toutes les autorisations au rôle authentifié par défaut, et faire masquer des fonctions par l'application selon la revendication cognito:groups." } }
answer: { optionId: b }
explanation:
  correct:
    en: "When groups have IAM roles, the ID token carries cognito:roles and cognito:preferred_role, which is the role of the group with the best (lowest) precedence value. With Choose role from token, the identity pool issues credentials for that preferred role. Group membership is managed by administrators, so users cannot change which role they get."
    fr: "Quand les groupes ont des rôles IAM, le jeton d'identification contient cognito:roles et cognito:preferred_role, c'est-à-dire le rôle du groupe ayant la meilleure (plus faible) valeur de priorité. Avec l'option de choix du rôle à partir du jeton (Choose role from token), le groupe d'identités émet des informations d'identification pour ce rôle préféré. L'appartenance aux groupes est gérée par les administrateurs : les utilisateurs ne peuvent pas changer le rôle qu'ils obtiennent."
  options:
    a:
      en: "Users can edit the custom attribute, so they could map themselves to any role. AWS advises mapping only claims that users cannot change."
      fr: "Les utilisateurs peuvent modifier l'attribut personnalisé et pourraient donc s'associer à n'importe quel rôle. AWS recommande de n'associer que des revendications que les utilisateurs ne peuvent pas modifier."
    c:
      en: "Role selection in the client can be tampered with, the basic flow is not recommended, and nothing enforces the group priority."
      fr: "Le choix du rôle dans le client peut être falsifié, le flux de base n'est pas recommandé et rien n'impose la priorité des groupes."
    d:
      en: "Every user would receive all permissions; hiding features in the app is not access control."
      fr: "Chaque utilisateur recevrait toutes les autorisations ; masquer des fonctions dans l'application n'est pas un contrôle d'accès."
references:
  - title: Using role-based access control
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/role-based-access-control.html
