id: dvac03-2c-ecs-secret-execution-role
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer passes a database password to an Amazon ECS task on AWS Fargate with the following container definition excerpt. The secret is encrypted with the aws/secretsmanager key.

    ```json
    "secrets": [
      {
        "name": "DB_PASSWORD",
        "valueFrom": "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/orders-AbCdEf:password::"
      }
    ]
    ```

    The task fails to start with an error that the secret cannot be retrieved. The task role allows secretsmanager:GetSecretValue on the secret.

    Which change will fix the error?
  fr: |
    Un développeur transmet un mot de passe de base de données à une tâche Amazon ECS sur AWS Fargate avec l'extrait de définition de conteneur suivant. Le secret est chiffré avec la clé aws/secretsmanager.

    ```json
    "secrets": [
      {
        "name": "DB_PASSWORD",
        "valueFrom": "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/orders-AbCdEf:password::"
      }
    ]
    ```

    La tâche ne démarre pas, avec une erreur indiquant que le secret ne peut pas être récupéré. Le rôle de tâche autorise secretsmanager:GetSecretValue sur le secret.

    Quelle modification corrige l'erreur ?
body:
  options:
    - id: a
      text: { en: "Add a resource policy to the secret that allows the ecs-tasks.amazonaws.com service principal to call secretsmanager:GetSecretValue.", fr: "Ajouter au secret une politique de ressource qui autorise le principal de service ecs-tasks.amazonaws.com à appeler secretsmanager:GetSecretValue." }
    - id: b
      text: { en: "Add secretsmanager:GetSecretValue on the secret to the task execution role that is referenced in the task definition.", fr: "Ajouter secretsmanager:GetSecretValue sur le secret au rôle d'exécution de tâche référencé dans la définition de tâche." }
    - id: c
      text: { en: "Remove the :password:: suffix from valueFrom so that the container receives the full secret and parses the password itself.", fr: "Retirer le suffixe :password:: de valueFrom pour que le conteneur reçoive le secret complet et en extraie lui-même le mot de passe." }
    - id: d
      text: { en: "Add kms:Decrypt on the aws/secretsmanager key to the task role, and grant the role ssm:GetParameters on the secret ARN.", fr: "Ajouter au rôle de tâche kms:Decrypt sur la clé aws/secretsmanager, et accorder au rôle ssm:GetParameters sur l'ARN du secret." }
answer: { optionId: b }
explanation:
  correct:
    en: "Secrets referenced in the secrets section of a task definition are retrieved by the ECS agent before the container starts, with the task execution role. That role needs secretsmanager:GetSecretValue on the secret, and kms:Decrypt only when a customer managed key encrypts it. The task role is for API calls made by the application code."
    fr: "Les secrets référencés dans la section secrets d'une définition de tâche sont récupérés par l'agent ECS avant le démarrage du conteneur, avec le rôle d'exécution de tâche. Ce rôle a besoin de secretsmanager:GetSecretValue sur le secret, et de kms:Decrypt seulement si une clé gérée par le client le chiffre. Le rôle de tâche sert aux appels d'API faits par le code de l'application."
  options:
    a:
      en: "The secret is retrieved with the credentials of the task execution role, not by the service principal, so a resource policy for the service principal does not fix the missing role permission."
      fr: "Le secret est récupéré avec les informations d'identification du rôle d'exécution de tâche, pas par le principal de service : une politique de ressource pour ce principal ne corrige pas l'autorisation manquante du rôle."
    c:
      en: "Selecting a JSON key with :password:: is valid on Fargate platform version 1.4.0 or later; the failure comes from the missing permission on the execution role."
      fr: "Sélectionner une clé JSON avec :password:: est valide sur la version de plateforme Fargate 1.4.0 ou ultérieure ; l'échec vient de l'autorisation manquante sur le rôle d'exécution."
    d:
      en: "The task role is not used to inject secrets, and the AWS managed key does not need an IAM grant for use through Secrets Manager in the same account."
      fr: "Le rôle de tâche ne sert pas à injecter les secrets, et la clé gérée par AWS n'a pas besoin d'autorisation IAM pour être utilisée via Secrets Manager dans le même compte."
references:
  - title: Amazon ECS task execution IAM role
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html
  - title: Pass Secrets Manager secrets through Amazon ECS environment variables
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/secrets-envvar-secrets-manager.html
