id: dvac03-2d-session-attributes
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon Bedrock agent answers questions about orders. Its action group Lambda function reads a customerId parameter that the model extracts from the conversation. During testing, a user typed another customer's ID and received that customer's orders. The application authenticates users with Amazon Cognito before it calls InvokeAgent.

    Which solution will prevent users from reading other customers' orders?
  fr: |
    Un agent Amazon Bedrock répond à des questions sur les commandes. La fonction Lambda de son groupe d'actions lit un paramètre customerId que le modèle extrait de la conversation. Pendant les tests, un utilisateur a tapé l'ID d'un autre client et a reçu les commandes de ce client. L'application authentifie les utilisateurs avec Amazon Cognito avant d'appeler InvokeAgent.

    Quelle solution empêche les utilisateurs de lire les commandes d'autres clients ?
body:
  options:
    - { id: a, text: { en: "Have the application set customerId in sessionAttributes from the validated Cognito token, and have the Lambda function use that value.", fr: "Faire définir customerId dans sessionAttributes par l'application à partir du jeton Cognito validé, et faire utiliser cette valeur par la fonction Lambda." } }
    - { id: b, text: { en: "Have the application set customerId in promptSessionAttributes, and add the $prompt_session_attributes$ placeholder to the orchestration prompt template.", fr: "Faire définir customerId dans promptSessionAttributes par l'application, et ajouter l'espace réservé $prompt_session_attributes$ au modèle d'invite d'orchestration." } }
    - { id: c, text: { en: "Associate a guardrail with the agent whose prompt attack filter blocks attempts to change the customer ID during the session.", fr: "Associer à l'agent une barrière de protection dont le filtre d'attaques par invite bloque les tentatives de modifier l'ID client pendant la session." } }
    - { id: d, text: { en: "Add an instruction to the agent that tells the model to use only the first customer ID that the user gives in each session.", fr: "Ajouter à l'agent une instruction qui demande au modèle de n'utiliser que le premier ID client donné par l'utilisateur dans chaque session." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Session attributes persist for the session and are passed to the action group's Lambda function in its input event. When the application sets the ID from the authenticated Cognito identity and the function uses that value, the identity no longer depends on text that the model extracts from user input."
    fr: "Les attributs de session persistent pendant toute la session et sont transmis à la fonction Lambda du groupe d'actions dans son événement d'entrée. Lorsque l'application définit l'ID à partir de l'identité Cognito authentifiée et que la fonction utilise cette valeur, l'identité ne dépend plus d'un texte que le modèle extrait de l'entrée utilisateur."
  options:
    b:
      en: "Prompt session attributes are inserted into the prompt, but the Lambda function still trusts the customerId parameter that the model produces, which the user's text can influence."
      fr: "Les attributs de session d'invite sont insérés dans l'invite, mais la fonction Lambda fait toujours confiance au paramètre customerId produit par le modèle, que le texte de l'utilisateur peut influencer."
    c:
      en: "Typing another customer's ID is not a jailbreak or an injection, and an authorization decision must not depend on what the model extracts."
      fr: "Taper l'ID d'un autre client n'est ni un jailbreak ni une injection, et une décision d'autorisation ne doit pas dépendre de ce que le modèle extrait."
    d:
      en: "An instruction only influences the model; the user can still give any ID first, so access is not enforced."
      fr: "Une instruction ne fait qu'influencer le modèle ; l'utilisateur peut toujours donner n'importe quel ID en premier : l'accès n'est pas contrôlé."
references:
  - title: Control agent session context
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-session-state.html
