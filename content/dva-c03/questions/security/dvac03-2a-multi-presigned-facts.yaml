id: dvac03-2a-multi-presigned-facts
objective: "2.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A developer generates S3 presigned GET URLs with the AWS SDK for Python (Boto3) by using the access keys of an IAM user. The developer is documenting how the URLs behave for the support team.

    Which statements are true? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur génère des URL présignées S3 pour des demandes GET avec l'AWS SDK pour Python (Boto3) à l'aide des clés d'accès d'un utilisateur IAM. Il documente le comportement des URL pour l'équipe de support.

    Quelles affirmations sont vraies ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A recipient can use the same presigned URL several times until it expires.", fr: "Un destinataire peut utiliser la même URL présignée plusieurs fois jusqu'à son expiration." } }
    - { id: b, text: { en: "A recipient needs an IAM identity in the account to use the presigned URL.", fr: "Un destinataire a besoin d'une identité IAM dans le compte pour utiliser l'URL présignée." } }
    - { id: c, text: { en: "The S3 console can create presigned URLs that remain valid for up to 7 days.", fr: "La console S3 peut créer des URL présignées valides jusqu'à 7 jours." } }
    - { id: d, text: { en: "If the IAM user's access key is deactivated, the presigned URL stops working.", fr: "Si la clé d'accès de l'utilisateur IAM est désactivée, l'URL présignée cesse de fonctionner." } }
    - { id: e, text: { en: "A presigned GET URL lets the recipient download any object under the same prefix.", fr: "Une URL GET présignée permet au destinataire de télécharger n'importe quel objet du même préfixe." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A presigned URL can be used multiple times until its expiration time. It carries the authority of the credentials that signed it, so it stops working when those credentials are revoked, deleted or deactivated, even before the expiration time."
    fr: "Une URL présignée peut être utilisée plusieurs fois jusqu'à son heure d'expiration. Elle porte l'autorité des informations d'identification qui l'ont signée : elle cesse de fonctionner quand ces informations d'identification sont révoquées, supprimées ou désactivées, même avant l'heure d'expiration."
  options:
    b:
      en: "Recipients need no AWS credentials; the signature in the URL authenticates the request."
      fr: "Les destinataires n'ont besoin d'aucune information d'identification AWS ; la signature de l'URL authentifie la demande."
    c:
      en: "The S3 console allows 1 minute to 12 hours; up to 7 days is possible with the AWS CLI or SDKs."
      fr: "La console S3 permet de 1 minute à 12 heures ; jusqu'à 7 jours est possible avec l'AWS CLI ou les SDK."
    e:
      en: "A presigned URL is signed for one bucket and one object key."
      fr: "Une URL présignée est signée pour un compartiment et une clé d'objet."
references:
  - title: Download and upload objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html
