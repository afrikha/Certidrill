id: dvac03-2a-cognito-totp-setup
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application uses an Amazon Cognito user pool in which TOTP software token MFA is enabled. A developer is adding a settings page where a signed-in user can register an authenticator app as their MFA method.

    Which sequence of API calls should the page use?
  fr: |
    Une application utilise un groupe d'utilisateurs Amazon Cognito dans lequel la MFA par jeton logiciel TOTP est activée. Un développeur ajoute une page de paramètres où un utilisateur connecté peut inscrire une application d'authentification comme méthode MFA.

    Quelle séquence d'appels d'API la page doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "AssociateSoftwareToken, then VerifySoftwareToken with a code from the app, then SetUserMFAPreference.", fr: "AssociateSoftwareToken, puis VerifySoftwareToken avec un code de l'application, puis SetUserMFAPreference." } }
    - { id: b, text: { en: "CreateVirtualMFADevice, then EnableMFADevice with two codes from the app, then SetUserMFAPreference.", fr: "CreateVirtualMFADevice, puis EnableMFADevice avec deux codes de l'application, puis SetUserMFAPreference." } }
    - { id: c, text: { en: "AssociateSoftwareToken, then AWS STS GetSessionToken with a code from the app, then UpdateUserPool.", fr: "AssociateSoftwareToken, puis AWS STS GetSessionToken avec un code de l'application, puis UpdateUserPool." } }
    - { id: d, text: { en: "AdminCreateUser, then AdminSetUserPassword, then RespondToAuthChallenge with a code from the app.", fr: "AdminCreateUser, puis AdminSetUserPassword, puis RespondToAuthChallenge avec un code de l'application." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AssociateSoftwareToken returns a shared secret that the page shows as text or a QR code for the authenticator app. VerifySoftwareToken checks a code from the app and associates the TOTP factor with the user, and SetUserMFAPreference turns TOTP on for sign-in. TOTP sends no SMS or email."
    fr: "AssociateSoftwareToken renvoie un secret partagé que la page affiche sous forme de texte ou de code QR pour l'application d'authentification. VerifySoftwareToken vérifie un code de l'application et associe le facteur TOTP à l'utilisateur, et SetUserMFAPreference active TOTP pour la connexion. TOTP n'envoie ni SMS ni e-mail."
  options:
    b:
      en: "CreateVirtualMFADevice and EnableMFADevice are IAM operations for IAM users, not for user pool users."
      fr: "CreateVirtualMFADevice et EnableMFADevice sont des opérations IAM destinées aux utilisateurs IAM, pas aux utilisateurs d'un groupe d'utilisateurs."
    c:
      en: "GetSessionToken returns AWS credentials for IAM users, and UpdateUserPool changes the pool configuration, not one user's factor."
      fr: "GetSessionToken renvoie des informations d'identification AWS pour des utilisateurs IAM, et UpdateUserPool modifie la configuration du groupe, pas le facteur d'un utilisateur."
    d:
      en: "These calls create a user and set a password. RespondToAuthChallenge answers sign-in challenges once TOTP is registered."
      fr: "Ces appels créent un utilisateur et définissent un mot de passe. RespondToAuthChallenge répond aux défis de connexion une fois TOTP inscrit."
references:
  - title: TOTP software token MFA
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-mfa-totp.html
