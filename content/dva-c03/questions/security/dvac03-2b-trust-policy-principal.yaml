id: dvac03-2b-trust-policy-principal
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The IAM role DeployReader in account 222222222222 has the following trust policy:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "Service": "ec2.amazonaws.com" },
          "Action": "sts:AssumeRole"
        }
      ]
    }
    ```

    A build job in account 111111111111 runs with the IAM role BuildRole, whose policy allows sts:AssumeRole on the ARN of DeployReader. The job's AssumeRole call fails with an AccessDenied error. The company wants only BuildRole to be able to assume DeployReader from account 111111111111.

    Which solution will meet these requirements?
  fr: |
    Le rôle IAM DeployReader du compte 222222222222 possède la politique d'approbation suivante :

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "Service": "ec2.amazonaws.com" },
          "Action": "sts:AssumeRole"
        }
      ]
    }
    ```

    Une tâche de génération du compte 111111111111 s'exécute avec le rôle IAM BuildRole, dont la politique autorise sts:AssumeRole sur l'ARN de DeployReader. L'appel AssumeRole de la tâche échoue avec une erreur AccessDenied. L'entreprise veut que seul BuildRole puisse assumer DeployReader depuis le compte 111111111111.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a statement that allows sts:AssumeRole on the ARN of DeployReader to the permissions policy of DeployReader.", fr: "Ajouter à la politique d'autorisations de DeployReader une instruction qui autorise sts:AssumeRole sur l'ARN de DeployReader." }
    - id: b
      text: { en: "Add a statement to the trust policy of DeployReader that allows sts:AssumeRole for the principal arn:aws:iam::111111111111:role/BuildRole.", fr: "Ajouter à la politique d'approbation de DeployReader une instruction qui autorise sts:AssumeRole pour le principal arn:aws:iam::111111111111:role/BuildRole." }
    - id: c
      text: { en: "Add a statement to the trust policy of DeployReader that allows sts:AssumeRole for the principal arn:aws:iam::111111111111:root.", fr: "Ajouter à la politique d'approbation de DeployReader une instruction qui autorise sts:AssumeRole pour le principal arn:aws:iam::111111111111:root." }
    - id: d
      text: { en: "Add a statement that allows iam:PassRole on the ARN of DeployReader to the policy of BuildRole.", fr: "Ajouter à la politique de BuildRole une instruction qui autorise iam:PassRole sur l'ARN de DeployReader." }
answer: { optionId: b }
explanation:
  correct:
    en: "Assuming a role across accounts needs two permissions. BuildRole already has sts:AssumeRole on the role ARN in account 111111111111, but the trust policy of DeployReader trusts only the EC2 service. Naming the BuildRole ARN as a principal in the trust policy completes the configuration and lets no other principal of account 111111111111 assume the role."
    fr: "Assumer un rôle entre comptes nécessite deux autorisations. BuildRole possède déjà sts:AssumeRole sur l'ARN du rôle dans le compte 111111111111, mais la politique d'approbation de DeployReader n'approuve que le service EC2. Nommer l'ARN de BuildRole comme principal dans la politique d'approbation complète la configuration et n'autorise aucun autre principal du compte 111111111111 à assumer le rôle."
  options:
    a:
      en: "The permissions policy defines what the role can do after it is assumed; it does not control who can assume the role."
      fr: "La politique d'autorisations définit ce que le rôle peut faire une fois assumé ; elle ne contrôle pas qui peut assumer le rôle."
    c:
      en: "Trusting the account principal would let any identity of account 111111111111 that has sts:AssumeRole permission assume the role, not only BuildRole."
      fr: "Approuver le principal du compte permettrait à toute identité du compte 111111111111 disposant de l'autorisation sts:AssumeRole d'assumer le rôle, et pas seulement à BuildRole."
    d:
      en: "iam:PassRole lets a principal pass a role to an AWS service, such as an EC2 instance; it does not let the principal assume the role."
      fr: "iam:PassRole permet à un principal de transmettre un rôle à un service AWS, comme une instance EC2 ; il ne permet pas au principal d'assumer le rôle."
references:
  - title: Create a role to give permissions to an IAM user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-user.html
