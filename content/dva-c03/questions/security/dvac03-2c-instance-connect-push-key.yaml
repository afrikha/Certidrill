id: dvac03-2c-instance-connect-push-key
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team of developers needs occasional SSH access to Amazon Linux 2023 development instances that have public IPv4 addresses and EC2 Instance Connect installed. Each developer has a personal SSH key pair generated with ssh-keygen. The company wants access to be controlled by IAM policies and does not want any long-lived developer public keys to be stored on the instances.

    Which solution will meet these requirements?
  fr: |
    Une équipe de développeurs a besoin d'un accès SSH ponctuel à des instances de développement Amazon Linux 2023 qui ont des adresses IPv4 publiques et sur lesquelles EC2 Instance Connect est installé. Chaque développeur possède une paire de clés SSH personnelle générée avec ssh-keygen. L'entreprise veut que l'accès soit contrôlé par des politiques IAM et ne veut stocker sur les instances aucune clé publique de développeur à longue durée de vie.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Import each developer's public key with aws ec2 import-key-pair, and relaunch the instances with the imported key pairs.", fr: "Importer la clé publique de chaque développeur avec aws ec2 import-key-pair, et relancer les instances avec les paires de clés importées." }
    - id: b
      text: { en: "Add the developers' public keys to ~/.ssh/authorized_keys through instance user data when the instances are launched.", fr: "Ajouter les clés publiques des développeurs à ~/.ssh/authorized_keys via les données utilisateur au lancement des instances." }
    - id: c
      text: { en: "Store one shared private key in AWS Secrets Manager, and allow the developers to read the secret before they connect.", fr: "Stocker une clé privée partagée dans AWS Secrets Manager, et autoriser les développeurs à lire le secret avant de se connecter." }
    - id: d
      text: { en: "Run aws ec2-instance-connect send-ssh-public-key with the developer's public key, and then connect with SSH within 60 seconds.", fr: "Exécuter aws ec2-instance-connect send-ssh-public-key avec la clé publique du développeur, puis se connecter en SSH dans les 60 secondes." }
answer: { optionId: d }
explanation:
  correct:
    en: "The EC2 Instance Connect API pushes the public key to the instance metadata, where it stays for 60 seconds, so no long-lived key is stored on the instance. The permission to push keys is granted by IAM policies, which control who can connect to which instances."
    fr: "L'API EC2 Instance Connect pousse la clé publique dans les métadonnées de l'instance, où elle reste 60 secondes : aucune clé à longue durée de vie n'est stockée sur l'instance. L'autorisation de pousser des clés est accordée par des politiques IAM, qui contrôlent qui peut se connecter à quelles instances."
  options:
    a:
      en: "An instance has one launch key pair, whose public key stays in authorized_keys; this stores long-lived keys and IAM does not control the SSH access."
      fr: "Une instance a une seule paire de clés de lancement, dont la clé publique reste dans authorized_keys : des clés à longue durée de vie sont stockées et IAM ne contrôle pas l'accès SSH."
    b:
      en: "Keys added through user data stay on the instances indefinitely, which the company does not want."
      fr: "Les clés ajoutées via les données utilisateur restent indéfiniment sur les instances, ce que l'entreprise ne veut pas."
    c:
      en: "A shared key needs its public key stored permanently on the instances, and it cannot identify individual developers."
      fr: "Une clé partagée exige que sa clé publique soit stockée en permanence sur les instances, et elle ne permet pas d'identifier chaque développeur."
references:
  - title: Connect to a Linux instance using EC2 Instance Connect
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-connect-methods.html
