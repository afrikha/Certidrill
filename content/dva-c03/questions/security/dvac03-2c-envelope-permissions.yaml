id: dvac03-2c-envelope-permissions
objective: "2.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function uses envelope encryption with a symmetric customer managed key. When it writes a record, it asks AWS KMS for a new data key, encrypts the record locally, and stores the encrypted data key with the record. When it reads a record, it asks AWS KMS to decrypt the stored data key. The key policy delegates access control to IAM policies.

    Which two permissions must the execution role of the function have on the key, following the principle of least privilege? (Choose two.)
  fr: |
    Une fonction AWS Lambda utilise le chiffrement d'enveloppe avec une clé symétrique gérée par le client. Lorsqu'elle écrit un enregistrement, elle demande à AWS KMS une nouvelle clé de données, chiffre l'enregistrement localement et stocke la clé de données chiffrée avec l'enregistrement. Lorsqu'elle lit un enregistrement, elle demande à AWS KMS de déchiffrer la clé de données stockée. La politique de clé délègue le contrôle d'accès aux politiques IAM.

    Quelles sont les deux autorisations dont le rôle d'exécution de la fonction doit disposer sur la clé, selon le principe du moindre privilège ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: kms:Encrypt }
    - { id: b, text: kms:GenerateDataKey }
    - { id: c, text: kms:ReEncryptFrom }
    - { id: d, text: kms:Decrypt }
    - { id: e, text: kms:CreateGrant }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "GenerateDataKey returns a plaintext data key and its encrypted copy, so the write path needs kms:GenerateDataKey. The read path calls Decrypt on the encrypted data key, so it needs kms:Decrypt. No other KMS action is used."
    fr: "GenerateDataKey renvoie une clé de données en texte clair et sa copie chiffrée : l'écriture nécessite kms:GenerateDataKey. La lecture appelle Decrypt sur la clé de données chiffrée : elle nécessite kms:Decrypt. Aucune autre action KMS n'est utilisée."
  options:
    a:
      en: "The data key is already returned encrypted by GenerateDataKey, and the record itself is encrypted locally, so Encrypt is never called."
      fr: "La clé de données est déjà renvoyée chiffrée par GenerateDataKey, et l'enregistrement est chiffré localement : Encrypt n'est jamais appelé."
    c:
      en: "kms:ReEncryptFrom is needed only to re-encrypt ciphertext under another key with ReEncrypt, which the function does not do."
      fr: "kms:ReEncryptFrom n'est nécessaire que pour rechiffrer un texte chiffré sous une autre clé avec ReEncrypt, ce que la fonction ne fait pas."
    e:
      en: "Grants delegate key use to other principals; the function uses the key directly and does not create grants."
      fr: "Les octrois (grants) délèguent l'utilisation de la clé à d'autres principaux ; la fonction utilise la clé directement et ne crée pas d'octroi."
references:
  - title: GenerateDataKey
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_GenerateDataKey.html
  - title: Decrypt
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_Decrypt.html
