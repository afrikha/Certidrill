id: dvac03-2c-sm-rds-managed-rotation
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application connects to an Amazon RDS for MySQL DB instance with the master user credentials, which are hardcoded in a configuration file. The company wants the password removed from the configuration file and rotated automatically on a schedule, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une application se connecte à une instance de base de données Amazon RDS for MySQL avec les informations d'identification de l'utilisateur principal, codées en dur dans un fichier de configuration. L'entreprise veut retirer le mot de passe du fichier de configuration et le faire changer automatiquement selon un calendrier, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the password as a SecureString parameter in Parameter Store, and schedule a Lambda function that changes the password and the parameter.", fr: "Stocker le mot de passe comme paramètre SecureString dans Parameter Store, et planifier une fonction Lambda qui change le mot de passe et le paramètre." }
    - id: b
      text: { en: "Modify the DB instance with --manage-master-user-password, and have the application read the RDS-managed secret from AWS Secrets Manager.", fr: "Modifier l'instance de base de données avec --manage-master-user-password, et faire lire par l'application le secret géré par RDS dans AWS Secrets Manager." }
    - id: c
      text: { en: "Store the password in an AWS Lambda environment variable encrypted with a customer managed KMS key, and read it at startup.", fr: "Stocker le mot de passe dans une variable d'environnement AWS Lambda chiffrée avec une clé KMS gérée par le client, et la lire au démarrage." }
    - id: d
      text: { en: "Create a secret in AWS Secrets Manager, write a custom rotation Lambda function for MySQL, and turn on rotation for the secret.", fr: "Créer un secret dans AWS Secrets Manager, écrire une fonction Lambda de rotation personnalisée pour MySQL, et activer la rotation du secret." }
answer: { optionId: b }
explanation:
  correct:
    en: "When RDS manages the master user password in Secrets Manager, it creates the secret and rotates it with managed rotation, every seven days by default, without a rotation Lambda function to build or maintain. The application retrieves the current credentials from the secret instead of the configuration file."
    fr: "Lorsque RDS gère le mot de passe de l'utilisateur principal dans Secrets Manager, il crée le secret et le fait changer par rotation gérée, tous les sept jours par défaut, sans fonction Lambda de rotation à créer ni à maintenir. L'application récupère les informations d'identification actuelles dans le secret au lieu du fichier de configuration."
  options:
    a:
      en: "Parameter Store has no built-in rotation, so the company would have to write and operate the rotation function itself."
      fr: "Parameter Store n'a pas de rotation intégrée : l'entreprise devrait écrire et exploiter elle-même la fonction de rotation."
    c:
      en: "An environment variable is encrypted at rest but is never rotated, so the password stays the same until someone changes it manually."
      fr: "Une variable d'environnement est chiffrée au repos mais n'est jamais renouvelée : le mot de passe reste le même jusqu'à ce que quelqu'un le change manuellement."
    d:
      en: "Rotation by a Lambda function works, but writing and maintaining a custom function adds overhead that managed rotation avoids."
      fr: "La rotation par fonction Lambda fonctionne, mais écrire et maintenir une fonction personnalisée ajoute une charge que la rotation gérée évite."
references:
  - title: Password management with Amazon RDS and AWS Secrets Manager
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-secrets-manager.html
  - title: Managed rotation for AWS Secrets Manager secrets
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_managed.html
