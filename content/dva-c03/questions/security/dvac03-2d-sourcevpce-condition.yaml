id: dvac03-2d-sourcevpce-condition
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application on Amazon EC2 instances in a VPC assumes an IAM role to call InvokeModel on Amazon Bedrock through the interface VPC endpoint vpce-0a1b2c3d4e5f60789. A security policy requires that calls made with this role succeed only when they go through this endpoint, even if the role's temporary credentials are used from outside the VPC.

    Which solution will meet these requirements?
  fr: |
    Une application qui s'exécute sur des instances Amazon EC2 dans un VPC endosse un rôle IAM pour appeler InvokeModel sur Amazon Bedrock par le point de terminaison de VPC d'interface vpce-0a1b2c3d4e5f60789. Une politique de sécurité exige que les appels effectués avec ce rôle ne réussissent que s'ils passent par ce point de terminaison, même si les informations d'identification temporaires du rôle sont utilisées depuis l'extérieur du VPC.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a statement to the role's policy that denies bedrock:InvokeModel when aws:SourceVpce is not equal to vpce-0a1b2c3d4e5f60789.", fr: "Ajouter à la politique du rôle une instruction qui refuse bedrock:InvokeModel lorsque aws:SourceVpce n'est pas égal à vpce-0a1b2c3d4e5f60789." } }
    - { id: b, text: { en: "Attach an endpoint policy to vpce-0a1b2c3d4e5f60789 that allows bedrock:InvokeModel only for the role's ARN.", fr: "Attacher à vpce-0a1b2c3d4e5f60789 une politique de point de terminaison qui autorise bedrock:InvokeModel uniquement pour l'ARN du rôle." } }
    - { id: c, text: { en: "Add a statement to the role's policy that denies bedrock:InvokeModel when aws:SourceIp is not in the VPC CIDR range.", fr: "Ajouter à la politique du rôle une instruction qui refuse bedrock:InvokeModel lorsque aws:SourceIp n'est pas dans la plage CIDR du VPC." } }
    - { id: d, text: { en: "Associate a security group with the endpoint that allows inbound HTTPS only from the instances' security group.", fr: "Associer au point de terminaison un groupe de sécurité qui autorise le trafic HTTPS entrant uniquement depuis le groupe de sécurité des instances." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The aws:SourceVpce key holds the ID of the VPC endpoint that carried the request, and it is present only when a VPC endpoint is used. A Deny when the key does not match the endpoint ID blocks every call made with the role outside that endpoint, whatever other permissions allow."
    fr: "La clé aws:SourceVpce contient l'ID du point de terminaison de VPC qui a transporté la requête, et elle n'est présente que si un point de terminaison de VPC est utilisé. Un refus lorsque la clé ne correspond pas à l'ID du point de terminaison bloque tout appel effectué avec le rôle en dehors de ce point de terminaison, quelles que soient les autres autorisations."
  options:
    b:
      en: "An endpoint policy controls only the requests that pass through the endpoint. Calls made with the credentials from outside the VPC go to the public endpoint and are not affected."
      fr: "Une politique de point de terminaison ne contrôle que les requêtes qui passent par ce point de terminaison. Les appels effectués avec les informations d'identification depuis l'extérieur du VPC vont vers le point de terminaison public et ne sont pas concernés."
    c:
      en: "aws:SourceIp compares public IP addresses; it does not identify requests that arrive through a specific VPC endpoint, so this condition does not enforce the endpoint path."
      fr: "aws:SourceIp compare des adresses IP publiques ; elle n'identifie pas les requêtes arrivées par un point de terminaison de VPC précis : cette condition n'impose donc pas le passage par le point de terminaison."
    d:
      en: "A security group limits network access to the endpoint, but it does nothing for calls made with the credentials outside the VPC."
      fr: "Un groupe de sécurité limite l'accès réseau au point de terminaison, mais il n'a aucun effet sur les appels effectués avec les informations d'identification en dehors du VPC."
references:
  - title: AWS global condition context keys
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
