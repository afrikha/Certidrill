id: dvac03-2b-lambda-role-dynamodb
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is developing an AWS Lambda function that writes order records to an Amazon DynamoDB table named Orders in the same AWS account. Every call to PutItem fails with an AccessDeniedException. The company wants to grant the function only the permissions that it needs and to follow AWS security best practices.

    Which solution will meet these requirements?
  fr: |
    AnyCompany développe une fonction AWS Lambda qui écrit des enregistrements de commandes dans une table Amazon DynamoDB nommée Orders, dans le même compte AWS. Chaque appel à PutItem échoue avec une erreur AccessDeniedException. L'entreprise veut accorder à la fonction uniquement les autorisations dont elle a besoin et suivre les bonnes pratiques de sécurité AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an IAM user that is allowed to call dynamodb:PutItem, and store its access keys in the function's environment variables.", fr: "Créer un utilisateur IAM autorisé à appeler dynamodb:PutItem, et stocker ses clés d'accès dans les variables d'environnement de la fonction." }
    - id: b
      text: { en: "Attach an identity-based policy that allows dynamodb:PutItem on the ARN of the Orders table to the function's execution role.", fr: "Attacher au rôle d'exécution de la fonction une politique basée sur l'identité qui autorise dynamodb:PutItem sur l'ARN de la table Orders." }
    - id: c
      text: { en: "Add a statement to the function's resource-based policy that allows dynamodb:PutItem on the ARN of the Orders table.", fr: "Ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise dynamodb:PutItem sur l'ARN de la table Orders." }
    - id: d
      text: { en: "Attach the AmazonDynamoDBFullAccess AWS managed policy to the function's execution role.", fr: "Attacher la politique gérée par AWS AmazonDynamoDBFullAccess au rôle d'exécution de la fonction." }
answer: { optionId: b }
explanation:
  correct:
    en: "Lambda assumes the function's execution role on each invocation, so the permissions that the function code uses come from the policies attached to that role. A policy that allows only dynamodb:PutItem on the Orders table ARN grants exactly what the function needs, without any long-term credentials."
    fr: "Lambda assume le rôle d'exécution de la fonction à chaque appel ; les autorisations utilisées par le code de la fonction proviennent donc des politiques attachées à ce rôle. Une politique qui n'autorise que dynamodb:PutItem sur l'ARN de la table Orders accorde exactement ce dont la fonction a besoin, sans aucune information d'identification à long terme."
  options:
    a:
      en: "Long-term access keys stored in environment variables go against best practices, because the execution role already provides temporary credentials that rotate automatically."
      fr: "Des clés d'accès à long terme stockées dans des variables d'environnement vont à l'encontre des bonnes pratiques, car le rôle d'exécution fournit déjà des informations d'identification temporaires renouvelées automatiquement."
    c:
      en: "The function's resource-based policy controls who can invoke the function; it does not give the function permission to call other services."
      fr: "La politique basée sur les ressources de la fonction contrôle qui peut appeler la fonction ; elle ne donne pas à la fonction l'autorisation d'appeler d'autres services."
    d:
      en: "AmazonDynamoDBFullAccess grants every DynamoDB action on every table, which fails the requirement to grant only the permissions that the function needs."
      fr: "AmazonDynamoDBFullAccess accorde toutes les actions DynamoDB sur toutes les tables, ce qui ne respecte pas l'exigence de n'accorder que les autorisations nécessaires à la fonction."
references:
  - title: Defining Lambda function permissions with an execution role
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
