id: dvac03-2c-bedrock-anthropic-ftu
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer wants to call an Anthropic Claude model that requires the Anthropic first-time use form, from a standalone AWS account that has never used Anthropic models. The developer's role allows bedrock:InvokeModel on the model and the required AWS Marketplace permissions, and the account has a valid payment method. Every invocation returns AccessDeniedException.

    Which combination of steps will resolve the issue? (Choose two.)
  fr: |
    Un développeur veut appeler un modèle Anthropic Claude qui exige le formulaire de première utilisation d'Anthropic, depuis un compte AWS autonome qui n'a jamais utilisé de modèle Anthropic. Le rôle du développeur autorise bedrock:InvokeModel sur le modèle ainsi que les autorisations AWS Marketplace nécessaires, et le compte dispose d'un moyen de paiement valide. Chaque invocation renvoie AccessDeniedException.

    Quelle combinaison d'étapes résout le problème ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Submit the company's use case details in the Amazon Bedrock console or with the PutUseCaseForModelAccess API.", fr: "Soumettre les détails du cas d'usage de l'entreprise dans la console Amazon Bedrock ou avec l'API PutUseCaseForModelAccess." } }
    - { id: b, text: { en: "Request an increase of the model's tokens-per-minute quota in the Service Quotas console.", fr: "Demander une augmentation du quota de jetons par minute du modèle dans la console Service Quotas." } }
    - { id: c, text: { en: "Purchase Provisioned Throughput for the model, and invoke the provisioned model ARN instead of the model ID.", fr: "Acheter du débit provisionné (Provisioned Throughput) pour le modèle, et invoquer l'ARN du modèle provisionné au lieu de l'ID du modèle." } }
    - { id: d, text: { en: "Generate a short-term Amazon Bedrock API key, and send the requests with the key instead of the role credentials.", fr: "Générer une clé d'API Amazon Bedrock à court terme, et envoyer les requêtes avec la clé au lieu des informations d'identification du rôle." } }
    - { id: e, text: { en: "Run aws bedrock get-foundation-model-availability for the model, and retry only after the agreement becomes AVAILABLE.", fr: "Exécuter aws bedrock get-foundation-model-availability pour le modèle, et ne réessayer qu'une fois l'accord passé à AVAILABLE." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "For the Anthropic models that require it, the first-time use form must be submitted once per account, or once in the organization's management account. After a successful submission the agreement can stay PENDING, and invocations return AccessDeniedException until get-foundation-model-availability shows it as AVAILABLE."
    fr: "Pour les modèles Anthropic qui l'exigent, le formulaire de première utilisation doit être soumis une fois par compte, ou une fois dans le compte de gestion de l'organisation. Après une soumission réussie, l'accord peut rester PENDING, et les invocations renvoient AccessDeniedException tant que get-foundation-model-availability ne l'indique pas AVAILABLE."
  options:
    b:
      en: "Exceeding a quota returns ThrottlingException, not AccessDeniedException, and more quota does not complete the use case agreement."
      fr: "Le dépassement d'un quota renvoie ThrottlingException, pas AccessDeniedException, et un quota plus élevé ne finalise pas l'accord de cas d'usage."
    c:
      en: "Provisioned Throughput adds dedicated capacity but does not replace the first-time use form, and it adds cost without solving the access issue."
      fr: "Le débit provisionné ajoute une capacité dédiée mais ne remplace pas le formulaire de première utilisation, et il ajoute un coût sans résoudre le problème d'accès."
    d:
      en: "A short-term API key inherits the role's permissions; it does not change the account's model access, so the error remains."
      fr: "Une clé d'API à court terme hérite des autorisations du rôle ; elle ne change pas l'accès du compte au modèle : l'erreur persiste."
references:
  - title: Request access to models
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-access.html
