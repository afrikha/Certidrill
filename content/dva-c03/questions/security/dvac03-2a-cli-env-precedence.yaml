id: dvac03-2a-cli-env-precedence
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer configured the default AWS CLI profile with aws configure sso and signed in with aws sso login. Earlier, in the same terminal, the developer exported AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for a test IAM user. The command aws sts get-caller-identity now returns the test IAM user instead of the IAM Identity Center role.

    Which statement explains this behavior?
  fr: |
    Un développeur a configuré le profil par défaut de l'AWS CLI avec aws configure sso et s'est connecté avec aws sso login. Plus tôt, dans le même terminal, le développeur avait exporté AWS_ACCESS_KEY_ID et AWS_SECRET_ACCESS_KEY pour un utilisateur IAM de test. La commande aws sts get-caller-identity renvoie maintenant l'utilisateur IAM de test au lieu du rôle IAM Identity Center.

    Quelle affirmation explique ce comportement ?
body:
  options:
    - { id: a, text: { en: "The AWS CLI reads the credentials file before IAM Identity Center profiles, and the exported keys were written to that file.", fr: "L'AWS CLI lit le fichier credentials avant les profils IAM Identity Center, et les clés exportées ont été écrites dans ce fichier." } }
    - { id: b, text: { en: "Credentials in environment variables take precedence over the IAM Identity Center settings of the config file.", fr: "Les informations d'identification des variables d'environnement sont prioritaires sur les paramètres IAM Identity Center du fichier config." } }
    - { id: c, text: { en: "The IAM Identity Center profile is ignored until the developer runs aws sso logout in the terminal.", fr: "Le profil IAM Identity Center est ignoré tant que le développeur n'a pas exécuté aws sso logout dans le terminal." } }
    - { id: d, text: { en: "The AWS CLI always prefers long-term access keys to temporary credentials when both are available.", fr: "L'AWS CLI préfère toujours les clés d'accès à long terme aux informations d'identification temporaires quand les deux sont disponibles." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The AWS CLI looks for credentials in a fixed order: command line options, environment variables, assume role, web identity, IAM Identity Center, the credentials file, a custom process, the config file, container credentials, then instance profile credentials. The exported variables win, so the developer must unset them or pass --profile."
    fr: "L'AWS CLI recherche les informations d'identification dans un ordre fixe : options de ligne de commande, variables d'environnement, rôle assumé, identité web, IAM Identity Center, fichier credentials, processus personnalisé, fichier config, informations d'identification de conteneur, puis profil d'instance. Les variables exportées l'emportent : le développeur doit les supprimer ou passer --profile."
  options:
    a:
      en: "IAM Identity Center comes before the credentials file in the order, and exporting variables does not write to any file."
      fr: "IAM Identity Center précède le fichier credentials dans l'ordre, et exporter des variables n'écrit dans aucun fichier."
    c:
      en: "aws sso logout deletes the cached IAM Identity Center credentials; it does not activate the profile."
      fr: "aws sso logout supprime les informations d'identification IAM Identity Center en cache ; il n'active pas le profil."
    d:
      en: "The CLI does not choose credentials by type; it uses the first source found in its precedence order."
      fr: "La CLI ne choisit pas les informations d'identification selon leur type ; elle utilise la première source trouvée dans son ordre de priorité."
references:
  - title: Configuring settings for the AWS CLI
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-quickstart.html
  - title: Configuring environment variables for the AWS CLI
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-envvars.html
