id: dvac03-2a-idpool-enhanced-calls
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer is adding AWS access to a mobile app that signs users in with an Amazon Cognito user pool. An Amazon Cognito identity pool uses rules that map token claims to different IAM roles. After a user signs in, the app must obtain temporary AWS credentials for that user with the fewest API calls.

    Which sequence of API calls should the app use?
  fr: |
    Un développeur ajoute un accès AWS à une application mobile qui connecte les utilisateurs avec un groupe d'utilisateurs Amazon Cognito. Un groupe d'identités Amazon Cognito utilise des règles qui associent des revendications (claims) du jeton à différents rôles IAM. Après la connexion d'un utilisateur, l'application doit obtenir des informations d'identification AWS temporaires pour cet utilisateur avec le moins d'appels d'API possible.

    Quelle séquence d'appels d'API l'application doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "GetId, then GetOpenIdToken, then AWS STS AssumeRoleWithWebIdentity.", fr: "GetId, puis GetOpenIdToken, puis AWS STS AssumeRoleWithWebIdentity." } }
    - { id: b, text: { en: "AWS STS GetSessionToken with the user pool ID token, then GetId.", fr: "AWS STS GetSessionToken avec le jeton d'identification du groupe d'utilisateurs, puis GetId." } }
    - { id: c, text: { en: "GetId, then AWS STS AssumeRoleWithSAML with the user pool ID token.", fr: "GetId, puis AWS STS AssumeRoleWithSAML avec le jeton d'identification du groupe d'utilisateurs." } }
    - { id: d, text: { en: "GetId, then GetCredentialsForIdentity with the same user pool ID token.", fr: "GetId, puis GetCredentialsForIdentity avec le même jeton d'identification du groupe d'utilisateurs." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The enhanced (simplified) flow needs two calls: GetId returns the identity ID, and GetCredentialsForIdentity returns AWS credentials for the same proof of authentication. The identity pool selects the role from its rules, so the client needs no role logic and never calls AWS STS. AWS recommends this flow."
    fr: "Le flux amélioré (simplifié) nécessite deux appels : GetId renvoie l'ID d'identité, et GetCredentialsForIdentity renvoie des informations d'identification AWS pour la même preuve d'authentification. Le groupe d'identités choisit le rôle à partir de ses règles : le client n'a besoin d'aucune logique de choix de rôle et n'appelle jamais AWS STS. AWS recommande ce flux."
  options:
    a:
      en: "This is the basic (classic) flow. It needs three calls, and it fails with an error when the identity pool has role mappings."
      fr: "Il s'agit du flux de base (classique). Il nécessite trois appels et échoue avec une erreur quand le groupe d'identités a des mappages de rôles."
    b:
      en: "GetSessionToken is called with the long-term credentials of an IAM user; it does not accept a JSON Web Token."
      fr: "GetSessionToken s'appelle avec les informations d'identification à long terme d'un utilisateur IAM ; il n'accepte pas de jeton web JSON."
    c:
      en: "AssumeRoleWithSAML takes a SAML 2.0 assertion, not a user pool JSON Web Token."
      fr: "AssumeRoleWithSAML prend une assertion SAML 2.0, pas un jeton web JSON du groupe d'utilisateurs."
references:
  - title: Identity pools authentication flow
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html
