id: dvac03-2a-presigned-signature-age
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Several teams generate S3 presigned URLs for objects in a shared bucket, and some teams set ExpiresIn to several days. The security team wants Amazon S3 to reject every presigned URL request to the bucket when the signature is more than 10 minutes old, whatever expiration the teams choose. The teams must not change their code.

    Which solution will meet these requirements?
  fr: |
    Plusieurs équipes génèrent des URL présignées S3 pour des objets d'un compartiment partagé, et certaines définissent ExpiresIn à plusieurs jours. L'équipe de sécurité veut qu'Amazon S3 rejette toute demande par URL présignée vers le compartiment quand la signature a plus de 10 minutes, quelle que soit l'expiration choisie par les équipes. Les équipes ne doivent pas modifier leur code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a bucket policy statement that denies s3:* when s3:signatureAge is NumericGreaterThan 600.", fr: "Ajouter une instruction de politique de compartiment qui refuse s3:* quand s3:signatureAge est NumericGreaterThan 600." } }
    - { id: b, text: { en: "Add a bucket policy statement that denies s3:* when s3:signatureAge is NumericGreaterThan 600000.", fr: "Ajouter une instruction de politique de compartiment qui refuse s3:* quand s3:signatureAge est NumericGreaterThan 600000." } }
    - { id: c, text: { en: "Set the maximum session duration of every IAM role that the teams use to 10 minutes.", fr: "Définir à 10 minutes la durée de session maximale de chaque rôle IAM utilisé par les équipes." } }
    - { id: d, text: { en: "Add a bucket policy statement that denies s3:* when aws:MultiFactorAuthAge is greater than 600.", fr: "Ajouter une instruction de politique de compartiment qui refuse s3:* quand aws:MultiFactorAuthAge est supérieur à 600." } }
answer: { optionId: b }
explanation:
  correct:
    en: "s3:signatureAge is a SigV4 condition key, expressed in milliseconds, that gives the age of the request signature. A bucket policy that denies requests when it is greater than 600000 rejects presigned URLs signed more than 10 minutes earlier, without any change in the teams' code."
    fr: "s3:signatureAge est une clé de condition SigV4, exprimée en millisecondes, qui donne l'âge de la signature de la demande. Une politique de compartiment qui refuse les demandes quand elle dépasse 600000 rejette les URL présignées signées plus de 10 minutes auparavant, sans modifier le code des équipes."
  options:
    a:
      en: "The key is in milliseconds, so 600 means 0.6 second and almost every request would be denied."
      fr: "La clé est en millisecondes : 600 correspond à 0,6 seconde, et presque toutes les demandes seraient refusées."
    c:
      en: "A role's maximum session duration cannot be less than 1 hour, and URLs signed with IAM user keys are not affected."
      fr: "La durée de session maximale d'un rôle ne peut pas être inférieure à 1 heure, et les URL signées avec des clés d'utilisateur IAM ne sont pas concernées."
    d:
      en: "aws:MultiFactorAuthAge measures time since MFA authentication, not the age of a signature, and it is absent when MFA was not used."
      fr: "aws:MultiFactorAuthAge mesure le temps écoulé depuis l'authentification MFA, pas l'âge d'une signature, et elle est absente quand la MFA n'a pas été utilisée."
references:
  - title: Download and upload objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html
