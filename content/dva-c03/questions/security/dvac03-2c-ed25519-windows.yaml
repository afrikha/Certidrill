id: dvac03-2c-ed25519-windows
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer automates the creation of development environments. The script creates a key pair for new Windows Server instances, and the developer must then retrieve the Administrator password with aws ec2 get-password-data and the private key file.

    ```bash
    aws ec2 create-key-pair --key-name win-dev \
      --key-type ed25519 --key-format pem \
      --query "KeyMaterial" --output text > win-dev.pem
    ```

    The Windows instances cannot be used with this key pair.

    Which change will fix the script?
  fr: |
    Un développeur automatise la création d'environnements de développement. Le script crée une paire de clés pour de nouvelles instances Windows Server, puis le développeur doit récupérer le mot de passe Administrator avec aws ec2 get-password-data et le fichier de clé privée.

    ```bash
    aws ec2 create-key-pair --key-name win-dev \
      --key-type ed25519 --key-format pem \
      --query "KeyMaterial" --output text > win-dev.pem
    ```

    Les instances Windows ne peuvent pas être utilisées avec cette paire de clés.

    Quelle modification corrige le script ?
body:
  options:
    - id: a
      text: { en: "Replace --key-format pem with --key-format ppk so that the private key can be used by Windows tools.", fr: "Remplacer --key-format pem par --key-format ppk pour que la clé privée soit utilisable par les outils Windows." }
    - id: b
      text: { en: "Generate an ED25519 key pair with ssh-keygen and import its public key with aws ec2 import-key-pair instead.", fr: "Générer plutôt une paire de clés ED25519 avec ssh-keygen et importer sa clé publique avec aws ec2 import-key-pair." }
    - id: c
      text: { en: "Replace --key-type ed25519 with --key-type rsa so that the key pair can be used with Windows instances.", fr: "Remplacer --key-type ed25519 par --key-type rsa pour que la paire de clés soit utilisable avec des instances Windows." }
    - id: d
      text: { en: "Store the KeyMaterial output in AWS Secrets Manager and pass the secret ARN to get-password-data.", fr: "Stocker la sortie KeyMaterial dans AWS Secrets Manager et passer l'ARN du secret à get-password-data." }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon EC2 supports ED25519 key pairs only for Linux instances; Windows instances need an RSA key pair. The Administrator password is encrypted with the launch key pair, and get-password-data with --priv-launch-key uses the RSA private key file to decrypt it."
    fr: "Amazon EC2 ne prend en charge les paires de clés ED25519 que pour les instances Linux ; les instances Windows nécessitent une paire de clés RSA. Le mot de passe Administrator est chiffré avec la paire de clés de lancement, et get-password-data avec --priv-launch-key utilise le fichier de clé privée RSA pour le déchiffrer."
  options:
    a:
      en: "The format only changes how the private key is encoded (OpenSSH or PuTTY); the key type is still ED25519, which Windows instances do not support."
      fr: "Le format ne change que l'encodage de la clé privée (OpenSSH ou PuTTY) ; le type de clé reste ED25519, que les instances Windows ne prennent pas en charge."
    b:
      en: "An imported ED25519 key is still an ED25519 key; imported ED25519 keys are also accepted only for Linux instances."
      fr: "Une clé ED25519 importée reste une clé ED25519 ; les clés ED25519 importées ne sont elles aussi acceptées que pour les instances Linux."
    d:
      en: "get-password-data takes a private key file in --priv-launch-key, not a secret ARN, and the key type would still be wrong."
      fr: "get-password-data prend un fichier de clé privée dans --priv-launch-key, pas un ARN de secret, et le type de clé serait toujours incorrect."
references:
  - title: Create a key pair for your Amazon EC2 instance
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/create-key-pairs.html
  - title: get-password-data
    url: https://docs.aws.amazon.com/cli/latest/reference/ec2/get-password-data.html
