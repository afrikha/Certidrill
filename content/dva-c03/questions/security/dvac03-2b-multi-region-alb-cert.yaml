id: dvac03-2b-multi-region-alb-cert
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany deploys the same API behind Application Load Balancers in the us-east-1 and ap-southeast-2 Regions, with Amazon Route 53 latency-based routing for api.example.com. A DNS-validated certificate from AWS Certificate Manager (ACM) for api.example.com is in use in us-east-1. When a developer creates the HTTPS listener in ap-southeast-2, the certificate cannot be selected. The company wants ACM to keep renewing all certificates automatically.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    AnyCompany déploie la même API derrière des Application Load Balancers dans les Régions us-east-1 et ap-southeast-2, avec un routage Amazon Route 53 basé sur la latence pour api.example.com. Un certificat AWS Certificate Manager (ACM) validé par DNS pour api.example.com est utilisé en us-east-1. Lorsqu'un développeur crée l'écouteur HTTPS en ap-southeast-2, le certificat ne peut pas être sélectionné. L'entreprise veut qu'ACM continue de renouveler automatiquement tous les certificats.

    Quelle solution répond à ces exigences avec le MOINS d'efforts ?
body:
  options:
    - id: a
      text: { en: "Request a certificate for api.example.com in ACM in ap-southeast-2, and attach it to that Region's HTTPS listener.", fr: "Demander un certificat pour api.example.com dans ACM en ap-southeast-2, et l'attacher à l'écouteur HTTPS de cette Région." }
    - id: b
      text: { en: "Export the us-east-1 certificate with its private key, and import it into ACM in ap-southeast-2.", fr: "Exporter le certificat d'us-east-1 avec sa clé privée, puis l'importer dans ACM en ap-southeast-2." }
    - id: c
      text: { en: "Reference the ARN of the us-east-1 certificate in the ap-southeast-2 listener by using the AWS CLI instead of the console.", fr: "Référencer l'ARN du certificat d'us-east-1 dans l'écouteur d'ap-southeast-2 à l'aide de l'AWS CLI au lieu de la console." }
    - id: d
      text: { en: "Replace the ALB in ap-southeast-2 with a Network Load Balancer whose TLS listener uses the us-east-1 certificate.", fr: "Remplacer l'ALB d'ap-southeast-2 par un Network Load Balancer dont l'écouteur TLS utilise le certificat d'us-east-1." }
answer: { optionId: a }
explanation:
  correct:
    en: "ACM certificates are Regional resources, so each Region's load balancer needs a certificate in its own Region. Because the validation CNAME record for api.example.com is already in place, the new certificate in ap-southeast-2 is validated without extra DNS work, and ACM renews it automatically."
    fr: "Les certificats ACM sont des ressources régionales : l'équilibreur de charge de chaque Région a besoin d'un certificat dans sa propre Région. Comme l'enregistrement CNAME de validation pour api.example.com est déjà en place, le nouveau certificat en ap-southeast-2 est validé sans travail DNS supplémentaire, et ACM le renouvelle automatiquement."
  options:
    b:
      en: "A standard ACM public certificate cannot be exported, and an imported certificate is never renewed by ACM."
      fr: "Un certificat public ACM standard ne peut pas être exporté, et ACM ne renouvelle jamais un certificat importé."
    c:
      en: "A certificate ARN belongs to one Region; listeners in another Region cannot use it, whatever the tool."
      fr: "Un ARN de certificat appartient à une seule Région ; les écouteurs d'une autre Région ne peuvent pas l'utiliser, quel que soit l'outil."
    d:
      en: "Network Load Balancers have the same Regional limitation, and replacing the load balancer adds effort."
      fr: "Les Network Load Balancers ont la même limitation régionale, et remplacer l'équilibreur de charge ajoute des efforts."
references:
  - title: Import certificates into AWS Certificate Manager
    url: https://docs.aws.amazon.com/acm/latest/userguide/import-certificate.html
  - title: AWS Certificate Manager DNS validation
    url: https://docs.aws.amazon.com/acm/latest/userguide/dns-validation.html
