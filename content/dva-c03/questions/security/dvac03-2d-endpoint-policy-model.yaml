id: dvac03-2d-endpoint-policy-model
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Several teams run applications in a shared VPC that reach Amazon Bedrock through one interface VPC endpoint for bedrock-runtime. Each team manages its own IAM roles, and the platform team cannot edit them. The platform team must ensure that any request passing through this endpoint can invoke only one approved foundation model, whatever permissions the teams grant to their roles.

    Which solution will meet these requirements?
  fr: |
    Plusieurs équipes exécutent des applications dans un VPC partagé qui accèdent à Amazon Bedrock par un point de terminaison de VPC d'interface unique pour bedrock-runtime. Chaque équipe gère ses propres rôles IAM, que l'équipe plateforme ne peut pas modifier. L'équipe plateforme doit garantir que toute requête qui passe par ce point de terminaison ne peut invoquer qu'un seul modèle de fondation approuvé, quelles que soient les autorisations que les équipes accordent à leurs rôles.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Disable private DNS on the endpoint so that only applications that set the endpoint URL can call Amazon Bedrock.", fr: "Désactiver le DNS privé sur le point de terminaison afin que seules les applications qui indiquent l'URL du point de terminaison puissent appeler Amazon Bedrock." } }
    - { id: b, text: { en: "Change the endpoint's security group so that it allows HTTPS only from the subnets of the approved applications.", fr: "Modifier le groupe de sécurité du point de terminaison afin qu'il n'autorise le trafic HTTPS que depuis les sous-réseaux des applications approuvées." } }
    - { id: c, text: { en: "Enable model invocation logging and create an alarm that fires when a request invokes another model.", fr: "Activer la journalisation des invocations de modèles et créer une alarme qui se déclenche lorsqu'une requête invoque un autre modèle." } }
    - { id: d, text: { en: "Replace the default endpoint policy with one that allows bedrock:InvokeModel only on the approved model's ARN.", fr: "Remplacer la politique de point de terminaison par défaut par une politique qui autorise bedrock:InvokeModel uniquement sur l'ARN du modèle approuvé." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An endpoint policy specifies which principals, actions, and resources are allowed through the endpoint, in addition to the callers' IAM policies. The default policy allows full access; a custom policy that allows invocation only on the approved model ARN blocks other models for every team without touching their roles."
    fr: "Une politique de point de terminaison indique les principaux, actions et ressources autorisés par le point de terminaison, en plus des politiques IAM des appelants. La politique par défaut autorise l'accès complet ; une politique personnalisée qui n'autorise l'invocation que sur l'ARN du modèle approuvé bloque les autres modèles pour toutes les équipes sans modifier leurs rôles."
  options:
    a:
      en: "Disabling private DNS only changes how clients find the endpoint; it does not limit which model a request can invoke."
      fr: "Désactiver le DNS privé change seulement la façon dont les clients trouvent le point de terminaison ; cela ne limite pas le modèle qu'une requête peut invoquer."
    b:
      en: "A security group filters network traffic by source; it cannot inspect which model an API request targets."
      fr: "Un groupe de sécurité filtre le trafic réseau selon la source ; il ne peut pas examiner le modèle visé par une requête d'API."
    c:
      en: "Logging and alarms detect the use of other models after the fact; they do not prevent it."
      fr: "La journalisation et les alarmes détectent l'utilisation d'autres modèles après coup ; elles ne l'empêchent pas."
references:
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
