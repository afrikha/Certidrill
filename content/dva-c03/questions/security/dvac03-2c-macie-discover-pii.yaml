id: dvac03-2c-macie-discover-pii
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's applications have written millions of customer documents to dozens of Amazon S3 general purpose buckets over several years. The compliance team must find out which buckets contain personally identifiable information (PII), such as passport numbers and credit card numbers, and must keep this assessment up to date. The solution must require the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Les applications d'une entreprise ont écrit, depuis plusieurs années, des millions de documents clients dans des dizaines de compartiments (buckets) Amazon S3 à usage général. L'équipe de conformité doit déterminer quels compartiments contiennent des informations personnelles identifiables (PII), comme des numéros de passeport et de carte de crédit, et doit tenir cette évaluation à jour. La solution doit demander le MOINS d'effort de développement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable Amazon GuardDuty S3 Protection, and review the findings that GuardDuty generates for each bucket.", fr: "Activer Amazon GuardDuty S3 Protection, et examiner les résultats que GuardDuty génère pour chaque compartiment." }
    - id: b
      text: { en: "Enable Amazon Macie automated sensitive data discovery, and review the sensitive data findings and bucket statistics.", fr: "Activer la découverte automatisée des données sensibles d'Amazon Macie, et examiner les résultats de données sensibles et les statistiques des compartiments." }
    - id: c
      text: { en: "Write an AWS Lambda function that downloads every object, matches it against regular expressions, and stores the results in DynamoDB.", fr: "Écrire une fonction AWS Lambda qui télécharge chaque objet, le compare à des expressions régulières et stocke les résultats dans DynamoDB." }
    - id: d
      text: { en: "Turn on AWS CloudTrail data events for the buckets, and query the events with Amazon Athena to find objects that contain PII.", fr: "Activer les événements de données AWS CloudTrail pour les compartiments, et interroger les événements avec Amazon Athena pour trouver les objets qui contiennent des PII." }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Macie uses managed data identifiers to detect sensitive data such as PII and financial data in S3 objects. Automated sensitive data discovery continually samples objects across the bucket inventory, produces findings daily, and updates per-bucket statistics, without custom code."
    fr: "Amazon Macie utilise des identifiants de données gérés pour détecter des données sensibles comme des PII et des données financières dans les objets S3. La découverte automatisée des données sensibles échantillonne en continu les objets de l'inventaire des compartiments, produit des résultats chaque jour et met à jour les statistiques par compartiment, sans code personnalisé."
  options:
    a:
      en: "GuardDuty S3 Protection detects threats and suspicious access patterns; it does not inspect object content for PII."
      fr: "GuardDuty S3 Protection détecte les menaces et les accès suspects ; il n'inspecte pas le contenu des objets pour y chercher des PII."
    c:
      en: "A custom scanner can work, but writing and maintaining it requires much more development effort than a managed service."
      fr: "Un analyseur personnalisé peut fonctionner, mais l'écrire et le maintenir demande bien plus d'effort de développement qu'un service géré."
    d:
      en: "CloudTrail data events record API calls on objects, not the content of the objects, so they cannot reveal PII in documents."
      fr: "Les événements de données CloudTrail enregistrent les appels d'API sur les objets, pas leur contenu : ils ne peuvent pas révéler des PII dans les documents."
references:
  - title: Performing automated sensitive data discovery
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-asdd.html
