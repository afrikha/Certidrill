id: dvac03-2b-s3-secure-transport
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany stores customer documents in an Amazon S3 bucket. Several applications and IAM roles access the bucket. The company must ensure that the bucket rejects every request that is not sent over HTTPS, including requests from principals whose IAM policies allow access.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke des documents clients dans un compartiment Amazon S3. Plusieurs applications et rôles IAM accèdent au compartiment. L'entreprise doit s'assurer que le compartiment rejette toute requête qui n'est pas envoyée en HTTPS, y compris les requêtes des principaux dont les politiques IAM autorisent l'accès.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure the default encryption of the bucket to use SSE-KMS with a customer managed key.", fr: "Configurer le chiffrement par défaut du compartiment pour utiliser SSE-KMS avec une clé gérée par le client." }
    - id: b
      text: { en: "Turn on all four S3 Block Public Access settings for the bucket.", fr: "Activer les quatre paramètres S3 Block Public Access pour le compartiment." }
    - id: c
      text: { en: "Add a bucket policy statement that denies s3:* to all principals when aws:SecureTransport is false.", fr: "Ajouter une instruction de politique de compartiment qui refuse s3:* à tous les principaux lorsque aws:SecureTransport est faux." }
    - id: d
      text: { en: "Add a bucket policy statement that allows s3:* to all principals when aws:SecureTransport is true.", fr: "Ajouter une instruction de politique de compartiment qui autorise s3:* à tous les principaux lorsque aws:SecureTransport est vrai." }
answer: { optionId: c }
explanation:
  correct:
    en: "The aws:SecureTransport condition key is false when a request arrives over plain HTTP. An explicit Deny on that condition in the bucket policy overrides any allow from IAM policies, so every unencrypted request is rejected whatever the caller's permissions."
    fr: "La clé de condition aws:SecureTransport vaut faux lorsqu'une requête arrive en HTTP simple. Un refus explicite sur cette condition dans la politique de compartiment l'emporte sur toute autorisation des politiques IAM : chaque requête non chiffrée est rejetée, quelles que soient les autorisations de l'appelant."
  options:
    a:
      en: "Default encryption protects data at rest; it does not reject requests sent over HTTP."
      fr: "Le chiffrement par défaut protège les données au repos ; il ne rejette pas les requêtes envoyées en HTTP."
    b:
      en: "Block Public Access prevents public access through policies and ACLs; it does not inspect the transport of authorized requests."
      fr: "Block Public Access empêche l'accès public par les politiques et les ACL ; il n'examine pas le transport des requêtes autorisées."
    d:
      en: "An Allow statement does not block anything, so HTTP requests from principals with IAM permissions are still accepted, and the statement opens the bucket to everyone over HTTPS."
      fr: "Une instruction Allow ne bloque rien : les requêtes HTTP des principaux disposant d'autorisations IAM restent acceptées, et l'instruction ouvre le compartiment à tous en HTTPS."
references:
  - title: Security best practices for Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/security-best-practices.html
