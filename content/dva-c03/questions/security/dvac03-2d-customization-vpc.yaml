id: dvac03-2d-customization-vpc
objective: "2.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company stores fine-tuning data in an Amazon S3 bucket. The bucket policy denies every request that does not arrive through the S3 gateway endpoint vpce-0fe1d2c3b4a596870, which is associated with the route tables of all subnets of the company's VPC. A developer starts an Amazon Bedrock model customization job with a service role that has s3:GetObject and s3:ListBucket on the bucket. The job fails with an access denied error when it reads the training data.

    Which actions should the developer take to fix the job without weakening the bucket policy? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise stocke des données d'affinage dans un compartiment Amazon S3. La politique de compartiment refuse toute requête qui n'arrive pas par le point de terminaison de passerelle S3 vpce-0fe1d2c3b4a596870, associé aux tables de routage de tous les sous-réseaux du VPC de l'entreprise. Un développeur lance une tâche de personnalisation de modèle Amazon Bedrock avec un rôle de service qui dispose de s3:GetObject et s3:ListBucket sur le compartiment. La tâche échoue avec une erreur d'accès refusé lorsqu'elle lit les données d'entraînement.

    Quelles actions le développeur doit-il effectuer pour corriger la tâche sans affaiblir la politique de compartiment ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Specify a vpcConfig with subnets and security groups of the company's VPC in the CreateModelCustomizationJob request.", fr: "Indiquer un vpcConfig avec des sous-réseaux et des groupes de sécurité du VPC de l'entreprise dans la requête CreateModelCustomizationJob." } }
    - { id: b, text: { en: "Add a statement to the bucket policy that allows the bedrock.amazonaws.com service principal to read the bucket.", fr: "Ajouter à la politique de compartiment une instruction qui autorise le principal de service bedrock.amazonaws.com à lire le compartiment." } }
    - { id: c, text: { en: "Create an interface VPC endpoint for com.amazonaws.region.bedrock-runtime in the company's VPC.", fr: "Créer un point de terminaison de VPC d'interface pour com.amazonaws.region.bedrock-runtime dans le VPC de l'entreprise." } }
    - { id: d, text: { en: "Grant the job's service role the Amazon EC2 permissions that Amazon Bedrock needs to create network interfaces in those subnets.", fr: "Accorder au rôle de service de la tâche les autorisations Amazon EC2 dont Amazon Bedrock a besoin pour créer des interfaces réseau dans ces sous-réseaux." } }
    - { id: e, text: { en: "Encrypt the training data with an AWS KMS key and grant the service role permission to decrypt it.", fr: "Chiffrer les données d'entraînement avec une clé AWS KMS et accorder au rôle de service l'autorisation de les déchiffrer." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "With a vpcConfig, Amazon Bedrock creates network interfaces in the given subnets with the given security groups, so the job reaches Amazon S3 through the VPC and its gateway endpoint, which satisfies the bucket policy. The service role must have the EC2 permissions for those network interfaces, scoped to the subnets and security groups."
    fr: "Avec un vpcConfig, Amazon Bedrock crée des interfaces réseau dans les sous-réseaux indiqués avec les groupes de sécurité indiqués : la tâche atteint Amazon S3 par le VPC et son point de terminaison de passerelle, ce qui satisfait la politique de compartiment. Le rôle de service doit disposer des autorisations EC2 pour ces interfaces réseau, limitées aux sous-réseaux et groupes de sécurité."
  options:
    b:
      en: "The explicit Deny for requests outside the endpoint still applies, so an Allow does not fix the error, and it widens the policy."
      fr: "Le refus explicite des requêtes extérieures au point de terminaison s'applique toujours : une autorisation ne corrige pas l'erreur et élargit la politique."
    c:
      en: "A bedrock-runtime endpoint carries inference calls from the VPC to Amazon Bedrock; it does not route the job's reads from Amazon S3 through the VPC."
      fr: "Un point de terminaison bedrock-runtime transporte les appels d'inférence du VPC vers Amazon Bedrock ; il ne fait pas passer par le VPC les lectures de la tâche dans Amazon S3."
    e:
      en: "Encryption does not change the network path of the requests, so the bucket policy still denies them."
      fr: "Le chiffrement ne change pas le chemin réseau des requêtes : la politique de compartiment les refuse toujours."
references:
  - title: Model customization access and security
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-model-job-access-security.html
