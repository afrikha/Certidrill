id: dvac03-2c-data-key-without-plaintext
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has two services. A provisioning service creates a record for each new customer and must store an encrypted data key in that record. Later, a separate processing service decrypts the data key and uses it to encrypt the customer's files. The security team requires that the provisioning service never receives plaintext key material.

    Which AWS KMS operation should the provisioning service call?
  fr: |
    AnyCompany dispose de deux services. Un service de provisionnement crée un enregistrement pour chaque nouveau client et doit y stocker une clé de données chiffrée. Plus tard, un service de traitement distinct déchiffre la clé de données et l'utilise pour chiffrer les fichiers du client. L'équipe de sécurité exige que le service de provisionnement ne reçoive jamais de matériel de clé en texte clair.

    Quelle opération AWS KMS le service de provisionnement doit-il appeler ?
body:
  options:
    - id: a
      text: { en: "GenerateDataKeyWithoutPlaintext with a symmetric encryption KMS key and KeySpec AES_256.", fr: "GenerateDataKeyWithoutPlaintext avec une clé KMS de chiffrement symétrique et KeySpec AES_256." }
    - id: b
      text: { en: "GenerateDataKey with a symmetric encryption KMS key, and discard the Plaintext field of the response.", fr: "GenerateDataKey avec une clé KMS de chiffrement symétrique, en ignorant le champ Plaintext de la réponse." }
    - id: c
      text: { en: "GenerateRandom to create 32 random bytes, followed by Encrypt with a symmetric encryption KMS key.", fr: "GenerateRandom pour créer 32 octets aléatoires, puis Encrypt avec une clé KMS de chiffrement symétrique." }
    - id: d
      text: { en: "GenerateDataKeyPair with an RSA_2048 key pair spec, and store the PrivateKeyCiphertextBlob field of the response.", fr: "GenerateDataKeyPair avec la spécification de paire de clés RSA_2048, en stockant le champ PrivateKeyCiphertextBlob de la réponse." }
answer: { optionId: a }
explanation:
  correct:
    en: "GenerateDataKeyWithoutPlaintext returns only the data key encrypted under the KMS key, so the caller never sees the plaintext. AWS documents this exact pattern: a component that creates containers stores the encrypted data key, and another component calls Decrypt when it needs to encrypt data. The provisioning role needs kms:GenerateDataKeyWithoutPlaintext and the processing role needs kms:Decrypt."
    fr: "GenerateDataKeyWithoutPlaintext ne renvoie que la clé de données chiffrée sous la clé KMS : l'appelant ne voit jamais le texte clair. AWS documente précisément ce modèle : un composant qui crée des conteneurs stocke la clé de données chiffrée, et un autre composant appelle Decrypt quand il doit chiffrer des données. Le rôle de provisionnement a besoin de kms:GenerateDataKeyWithoutPlaintext et le rôle de traitement de kms:Decrypt."
  options:
    b:
      en: "GenerateDataKey returns the plaintext key in the response, so the provisioning service receives it even if the code discards it."
      fr: "GenerateDataKey renvoie la clé en texte clair dans la réponse : le service de provisionnement la reçoit même si le code l'ignore."
    c:
      en: "The provisioning service would generate the random bytes itself and then pass them to Encrypt, so it handles the plaintext key."
      fr: "Le service de provisionnement générerait lui-même les octets aléatoires avant de les passer à Encrypt : il manipulerait la clé en texte clair."
    d:
      en: "GenerateDataKeyPair returns an asymmetric pair, including the plaintext private key; GenerateDataKeyPairWithoutPlaintext would be needed, and an RSA pair does not fit symmetric file encryption."
      fr: "GenerateDataKeyPair renvoie une paire asymétrique, dont la clé privée en texte clair ; il faudrait GenerateDataKeyPairWithoutPlaintext, et une paire RSA ne convient pas au chiffrement symétrique de fichiers."
references:
  - title: GenerateDataKeyWithoutPlaintext
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_GenerateDataKeyWithoutPlaintext.html
