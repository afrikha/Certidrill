id: dvac03-2c-sm-replica-dr
objective: "2.2.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company stores database credentials in an AWS Secrets Manager secret in us-east-1, with automatic rotation turned on. A disaster recovery copy of the application runs in us-west-2 and must be able to read the same credentials even if us-east-1 is unavailable. The credentials in us-west-2 must always match the rotated value, with the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise stocke des informations d'identification de base de données dans un secret AWS Secrets Manager dans us-east-1, avec la rotation automatique activée. Une copie de reprise après sinistre de l'application s'exécute dans us-west-2 et doit pouvoir lire les mêmes informations d'identification même si us-east-1 est indisponible. Les informations d'identification dans us-west-2 doivent toujours correspondre à la valeur renouvelée, avec le MOINS de charge opérationnelle.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a second secret in us-west-2, and add a step to the rotation function that writes each new value to that secret.", fr: "Créer un second secret dans us-west-2, et ajouter à la fonction de rotation une étape qui écrit chaque nouvelle valeur dans ce secret." } }
    - { id: b, text: { en: "Configure the application in us-west-2 to call the Secrets Manager endpoint in us-west-2 for the secret name.", fr: "Configurer l'application de us-west-2 pour appeler le point de terminaison Secrets Manager de us-west-2 pour le nom du secret." } }
    - { id: c, text: { en: "Replicate the secret to us-west-2 with aws secretsmanager replicate-secret-to-regions.", fr: "Répliquer le secret dans us-west-2 avec aws secretsmanager replicate-secret-to-regions." } }
    - { id: d, text: { en: "Promote the replica in us-west-2 to a standalone secret, so that the application in us-west-2 owns its copy.", fr: "Promouvoir la réplique de us-west-2 en secret autonome, pour que l'application de us-west-2 possède sa propre copie." } }
    - { id: e, text: { en: "Configure the application in us-west-2 to read the secret from the Secrets Manager endpoint in us-east-1 with its full ARN.", fr: "Configurer l'application de us-west-2 pour lire le secret auprès du point de terminaison Secrets Manager de us-east-1 avec son ARN complet." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "A replica secret keeps the same name, and its ARN differs only by Region. When rotation runs on the primary secret, Secrets Manager propagates the new value to every replica, so the application in us-west-2 reads current credentials from its local Regional endpoint, even during an outage in us-east-1."
    fr: "Une réplique de secret conserve le même nom, et son ARN ne diffère que par la Région. Quand la rotation s'exécute sur le secret principal, Secrets Manager propage la nouvelle valeur à chaque réplique : l'application de us-west-2 lit des informations d'identification à jour sur son point de terminaison régional local, même pendant une panne de us-east-1."
  options:
    a:
      en: "Maintaining a second secret with custom rotation code works but adds code and failure points that replication provides without effort."
      fr: "Maintenir un second secret avec du code de rotation personnalisé fonctionne, mais ajoute du code et des points de défaillance que la réplication évite."
    d:
      en: "A promoted secret becomes independent of the primary, so later rotations would no longer update it."
      fr: "Un secret promu devient indépendant du secret principal : les rotations suivantes ne le mettraient plus à jour."
    e:
      en: "Reading from the us-east-1 endpoint fails when us-east-1 is unavailable, which breaks the disaster recovery requirement."
      fr: "La lecture sur le point de terminaison de us-east-1 échoue quand us-east-1 est indisponible, ce qui enfreint l'exigence de reprise après sinistre."
references:
  - title: Replicate AWS Secrets Manager secrets across Regions
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/create-manage-multi-region-secrets.html
