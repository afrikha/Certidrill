id: dvac03-2b-imported-cert-monitoring
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany bought a certificate from a third-party certificate authority and imported it into AWS Certificate Manager (ACM). The certificate is used on an Amazon API Gateway Regional custom domain name. The team wants an automatic warning several weeks before the certificate expires so that it can reimport a new certificate in time.

    Which solutions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany a acheté un certificat auprès d'une autorité de certification tierce et l'a importé dans AWS Certificate Manager (ACM). Le certificat est utilisé sur un nom de domaine personnalisé Regional d'Amazon API Gateway. L'équipe veut un avertissement automatique plusieurs semaines avant l'expiration du certificat afin de pouvoir réimporter un nouveau certificat à temps.

    Quelles solutions répondent à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Create an Amazon CloudWatch alarm on the ACM DaysToExpiry metric of the certificate, with an Amazon SNS action.", fr: "Créer une alarme Amazon CloudWatch sur la métrique ACM DaysToExpiry du certificat, avec une action Amazon SNS." }
    - id: b
      text: { en: "Rely on ACM managed renewal, which renews the imported certificate before it expires.", fr: "S'appuyer sur le renouvellement géré d'ACM, qui renouvelle le certificat importé avant son expiration." }
    - id: c
      text: { en: "Create an Amazon EventBridge rule that matches ACM Certificate Approaching Expiration events and targets an Amazon SNS topic.", fr: "Créer une règle Amazon EventBridge qui correspond aux événements ACM Certificate Approaching Expiration et cible une rubrique Amazon SNS." }
    - id: d
      text: { en: "Create an AWS CloudTrail trail that records the management events of ACM in the account.", fr: "Créer un journal de suivi AWS CloudTrail qui enregistre les événements de gestion d'ACM dans le compte." }
    - id: e
      text: { en: "Turn on execution logging for the API stage to record the TLS details of each request.", fr: "Activer la journalisation de l'exécution de l'étape (stage) d'API pour enregistrer les détails TLS de chaque requête." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "ACM does not renew imported certificates, so the team must track expiration. ACM publishes the DaysToExpiry metric for each certificate, so an alarm on a threshold sends a warning. ACM also sends daily Certificate Approaching Expiration events to EventBridge, starting 45 days before expiration for imported certificates by default, which a rule can route to SNS."
    fr: "ACM ne renouvelle pas les certificats importés : l'équipe doit donc suivre leur expiration. ACM publie la métrique DaysToExpiry pour chaque certificat, et une alarme sur un seuil envoie un avertissement. ACM envoie aussi chaque jour des événements Certificate Approaching Expiration à EventBridge, à partir de 45 jours avant l'expiration par défaut pour les certificats importés, qu'une règle peut acheminer vers SNS."
  options:
    b:
      en: "Imported certificates are not eligible for managed renewal; only certificates that ACM issues are renewed."
      fr: "Les certificats importés ne sont pas éligibles au renouvellement géré ; seuls les certificats émis par ACM sont renouvelés."
    d:
      en: "CloudTrail records API calls made to ACM; it does not produce a warning when a certificate approaches expiration."
      fr: "CloudTrail enregistre les appels d'API effectués vers ACM ; il ne produit pas d'avertissement à l'approche de l'expiration d'un certificat."
    e:
      en: "Execution logs describe API requests and give no expiration warning."
      fr: "Les journaux d'exécution décrivent les requêtes d'API et ne donnent aucun avertissement d'expiration."
references:
  - title: Amazon EventBridge support for ACM
    url: https://docs.aws.amazon.com/acm/latest/userguide/supported-events.html
  - title: Supported CloudWatch metrics
    url: https://docs.aws.amazon.com/acm/latest/userguide/cloudwatch-metrics.html
