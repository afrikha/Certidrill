id: dvac03-2a-multi-mfa-cli
objective: "2.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Developers use the AWS CLI with the access keys of their IAM users. Each IAM user has a virtual MFA device. The security team requires that developers can call ec2:TerminateInstances only after they authenticate with MFA.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Des développeurs utilisent l'AWS CLI avec les clés d'accès de leurs utilisateurs IAM. Chaque utilisateur IAM dispose d'un dispositif MFA virtuel. L'équipe de sécurité exige que les développeurs ne puissent appeler ec2:TerminateInstances qu'après s'être authentifiés avec la MFA.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a BoolIfExists condition on aws:MultiFactorAuthPresent set to true to the statement that allows ec2:TerminateInstances.", fr: "Ajouter une condition BoolIfExists sur aws:MultiFactorAuthPresent définie à true à l'instruction qui autorise ec2:TerminateInstances." } }
    - { id: b, text: { en: "Add a Bool condition on aws:MultiFactorAuthPresent set to true to the statement that allows ec2:TerminateInstances.", fr: "Ajouter une condition Bool sur aws:MultiFactorAuthPresent définie à true à l'instruction qui autorise ec2:TerminateInstances." } }
    - { id: c, text: { en: "Have developers call aws sts assume-role-with-web-identity with the MFA code as the web identity token.", fr: "Faire appeler aws sts assume-role-with-web-identity par les développeurs avec le code MFA comme jeton d'identité web." } }
    - { id: d, text: { en: "Enable MFA on the root user of the account so that every IAM user inherits the MFA requirement.", fr: "Activer la MFA sur l'utilisateur racine du compte pour que chaque utilisateur IAM hérite de l'exigence de MFA." } }
    - { id: e, text: { en: "Have developers call aws sts get-session-token with --serial-number and --token-code and use the returned credentials.", fr: "Faire appeler aws sts get-session-token avec --serial-number et --token-code par les développeurs et utiliser les informations d'identification renvoyées." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "A Bool condition on aws:MultiFactorAuthPresent allows the action only for requests made with credentials that carry MFA context. Developers obtain such credentials by calling GetSessionToken with the MFA device identifier and the current code, then use the returned temporary credentials for the protected call."
    fr: "Une condition Bool sur aws:MultiFactorAuthPresent n'autorise l'action que pour les demandes faites avec des informations d'identification porteuses du contexte MFA. Les développeurs obtiennent ces informations d'identification en appelant GetSessionToken avec l'identifiant du dispositif MFA et le code actuel, puis utilisent les informations d'identification temporaires renvoyées pour l'appel protégé."
  options:
    a:
      en: "Requests made with long-term access keys do not contain the key, and BoolIfExists evaluates to true when the key is absent, so the action would be allowed without MFA."
      fr: "Les demandes faites avec des clés d'accès à long terme ne contiennent pas la clé, et BoolIfExists est vrai quand la clé est absente : l'action serait autorisée sans MFA."
    c:
      en: "AssumeRoleWithWebIdentity takes an OIDC token and does not support MFA parameters."
      fr: "AssumeRoleWithWebIdentity prend un jeton OIDC et ne prend pas en charge les paramètres MFA."
    d:
      en: "MFA on the root user protects only the root user; IAM users do not inherit it."
      fr: "La MFA de l'utilisateur racine ne protège que cet utilisateur ; les utilisateurs IAM n'en héritent pas."
references:
  - title: Secure API access with MFA
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa_configure-api-require.html
