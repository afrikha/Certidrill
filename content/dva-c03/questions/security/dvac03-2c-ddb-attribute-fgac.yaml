id: dvac03-2c-ddb-attribute-fgac
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company stores patient items in an Amazon DynamoDB table named Patients. The partition key is PatientId, and the items also contain AppointmentTime, Diagnosis, and InsuranceNumber. A scheduling application must be able to call GetItem and Query on the table but must never read the Diagnosis or InsuranceNumber attributes, which contain protected health information (PHI). A developer is writing the IAM policy statement for the application role.

    Which condition should the developer add to the statement that allows dynamodb:GetItem and dynamodb:Query?
  fr: |
    Une entreprise de santé stocke des éléments de patients dans une table Amazon DynamoDB nommée Patients. La clé de partition est PatientId, et les éléments contiennent aussi AppointmentTime, Diagnosis et InsuranceNumber. Une application de planification doit pouvoir appeler GetItem et Query sur la table, mais ne doit jamais lire les attributs Diagnosis et InsuranceNumber, qui contiennent des informations de santé protégées (PHI). Un développeur rédige l'instruction de politique IAM du rôle de l'application.

    Quelle condition le développeur doit-il ajouter à l'instruction qui autorise dynamodb:GetItem et dynamodb:Query ?
body:
  options:
    - id: a
      text: { en: "ForAnyValue:StringEquals on dynamodb:Attributes with PatientId and AppointmentTime, and StringEqualsIfExists on dynamodb:Select with SPECIFIC_ATTRIBUTES", fr: "ForAnyValue:StringEquals sur dynamodb:Attributes avec PatientId et AppointmentTime, et StringEqualsIfExists sur dynamodb:Select avec SPECIFIC_ATTRIBUTES" }
    - id: b
      text: { en: "ForAllValues:StringEquals on dynamodb:LeadingKeys with PatientId and AppointmentTime, and StringEqualsIfExists on dynamodb:Select with SPECIFIC_ATTRIBUTES", fr: "ForAllValues:StringEquals sur dynamodb:LeadingKeys avec PatientId et AppointmentTime, et StringEqualsIfExists sur dynamodb:Select avec SPECIFIC_ATTRIBUTES" }
    - id: c
      text: { en: "ForAllValues:StringEquals on dynamodb:Attributes with PatientId and AppointmentTime, and StringEqualsIfExists on dynamodb:Select with SPECIFIC_ATTRIBUTES", fr: "ForAllValues:StringEquals sur dynamodb:Attributes avec PatientId et AppointmentTime, et StringEqualsIfExists sur dynamodb:Select avec SPECIFIC_ATTRIBUTES" }
    - id: d
      text: { en: "StringEqualsIfExists on dynamodb:Select with ALL_PROJECTED_ATTRIBUTES, and StringEquals on dynamodb:ReturnValues with ALL_NEW", fr: "StringEqualsIfExists sur dynamodb:Select avec ALL_PROJECTED_ATTRIBUTES, et StringEquals sur dynamodb:ReturnValues avec ALL_NEW" }
answer: { optionId: c }
explanation:
  correct:
    en: "dynamodb:Attributes holds the top-level attributes that a request accesses, and ForAllValues:StringEquals allows the request only if every requested attribute is in the list. Requiring Select to be SPECIFIC_ATTRIBUTES prevents requests that ask for all attributes. The list must include the primary key attribute so that DynamoDB can perform the request."
    fr: "dynamodb:Attributes contient les attributs de premier niveau auxquels une requête accède, et ForAllValues:StringEquals n'autorise la requête que si chaque attribut demandé figure dans la liste. Exiger que Select vaille SPECIFIC_ATTRIBUTES empêche les requêtes qui demandent tous les attributs. La liste doit inclure l'attribut de clé primaire pour que DynamoDB puisse exécuter la requête."
  options:
    a:
      en: "ForAnyValue is true as soon as one requested attribute matches, so a request for PatientId and Diagnosis together would be allowed."
      fr: "ForAnyValue est vrai dès qu'un attribut demandé correspond : une requête portant à la fois sur PatientId et Diagnosis serait autorisée."
    b:
      en: "dynamodb:LeadingKeys contains partition key values, such as a patient ID, not attribute names, so it cannot restrict which attributes are read."
      fr: "dynamodb:LeadingKeys contient des valeurs de clé de partition, comme un ID de patient, et non des noms d'attributs : elle ne peut pas limiter les attributs lus."
    d:
      en: "These values do not restrict attribute names, and ALL_NEW returns every attribute of an updated item, which would expose more data."
      fr: "Ces valeurs ne limitent pas les noms d'attributs, et ALL_NEW renvoie tous les attributs d'un élément mis à jour, ce qui exposerait davantage de données."
references:
  - title: Using IAM policy conditions for fine-grained access control
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/specifying-conditions.html
