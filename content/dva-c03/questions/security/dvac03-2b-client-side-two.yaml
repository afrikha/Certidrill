id: dvac03-2b-client-side-two
objective: "2.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A healthcare application uploads patient files to an Amazon S3 bucket. A new rule requires the files to be encrypted before they leave the application servers, so that AWS never receives the plaintext data.

    Which solutions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application de santé charge des fichiers de patients dans un compartiment Amazon S3. Une nouvelle règle impose que les fichiers soient chiffrés avant de quitter les serveurs de l'application, afin qu'AWS ne reçoive jamais les données en clair.

    Quelles solutions répondent à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Configure the default encryption of the bucket to use SSE-KMS with a customer managed key.", fr: "Configurer le chiffrement par défaut du compartiment pour utiliser SSE-KMS avec une clé gérée par le client." }
    - id: b
      text: { en: "Use the Amazon S3 Encryption Client in the application to encrypt each object before the PutObject request.", fr: "Utiliser l'Amazon S3 Encryption Client dans l'application pour chiffrer chaque objet avant la requête PutObject." }
    - id: c
      text: { en: "Upload the files with DSSE-KMS so that Amazon S3 applies two layers of encryption.", fr: "Charger les fichiers avec DSSE-KMS pour qu'Amazon S3 applique deux couches de chiffrement." }
    - id: d
      text: { en: "Upload the files with SSE-C, and provide a key that the company manages in each request.", fr: "Charger les fichiers avec SSE-C, en fournissant dans chaque requête une clé gérée par l'entreprise." }
    - id: e
      text: { en: "Encrypt each file with the AWS Encryption SDK, and then upload the result with the standard S3 client.", fr: "Chiffrer chaque fichier avec l'AWS Encryption SDK, puis charger le résultat avec le client S3 standard." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Client-side encryption happens in the application before the upload, so Amazon S3 receives and stores only ciphertext. The Amazon S3 Encryption Client encrypts and decrypts objects transparently during PutObject and GetObject, and the AWS Encryption SDK encrypts any data with a unique data key protected by the wrapping keys that you choose."
    fr: "Le chiffrement côté client a lieu dans l'application avant le chargement : Amazon S3 ne reçoit et ne stocke que du texte chiffré. L'Amazon S3 Encryption Client chiffre et déchiffre les objets de façon transparente pendant PutObject et GetObject, et l'AWS Encryption SDK chiffre n'importe quelles données avec une clé de données unique protégée par les clés d'encapsulation de votre choix."
  options:
    a:
      en: "SSE-KMS is server-side encryption, so Amazon S3 receives the plaintext over TLS and encrypts it after it arrives."
      fr: "SSE-KMS est un chiffrement côté serveur : Amazon S3 reçoit les données en clair par TLS et les chiffre après leur arrivée."
    c:
      en: "DSSE-KMS is also server-side encryption; the two layers are applied by Amazon S3 after it receives the plaintext."
      fr: "DSSE-KMS est lui aussi un chiffrement côté serveur ; les deux couches sont appliquées par Amazon S3 après réception des données en clair."
    d:
      en: "With SSE-C, Amazon S3 receives both the plaintext and the key, and performs the encryption on the server side."
      fr: "Avec SSE-C, Amazon S3 reçoit à la fois les données en clair et la clé, et effectue le chiffrement côté serveur."
references:
  - title: Protecting data by using client-side encryption
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingClientSideEncryption.html
  - title: What is the AWS Encryption SDK?
    url: https://docs.aws.amazon.com/encryption-sdk/latest/developer-guide/introduction.html
