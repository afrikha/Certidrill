id: dvac03-2a-sigv4-clock-skew
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application on an on-premises server uses the AWS SDK for Java to call Amazon S3. The application worked for months, but now every request fails with RequestTimeTooSkewed errors. The credentials and the code have not changed.

    Which action will resolve the issue?
  fr: |
    Une application sur un serveur sur site utilise l'AWS SDK pour Java pour appeler Amazon S3. L'application fonctionnait depuis des mois, mais chaque demande échoue maintenant avec des erreurs RequestTimeTooSkewed. Les informations d'identification et le code n'ont pas changé.

    Quelle action résout le problème ?
body:
  options:
    - { id: a, text: { en: "Rotate the access key of the IAM user, because the signing key derived from it has expired.", fr: "Renouveler la clé d'accès de l'utilisateur IAM, car la clé de signature qui en dérive a expiré." } }
    - { id: b, text: { en: "Synchronize the server clock with a reliable time source, such as an NTP server.", fr: "Synchroniser l'horloge du serveur avec une source de temps fiable, comme un serveur NTP." } }
    - { id: c, text: { en: "Switch the SDK to Signature Version 4a so that requests are signed for all Regions.", fr: "Passer le SDK à Signature Version 4a pour que les demandes soient signées pour toutes les Régions." } }
    - { id: d, text: { en: "Add the X-Amz-Security-Token header to every request that the application sends.", fr: "Ajouter l'en-tête X-Amz-Security-Token à chaque demande envoyée par l'application." } }
answer: { optionId: b }
explanation:
  correct:
    en: "SigV4 requests include a timestamp, and in most cases AWS denies a request that does not arrive within five minutes of that timestamp, to protect against replay. A drifting server clock makes every signature look too old or too new, so the clock must be synchronized."
    fr: "Les demandes SigV4 contiennent un horodatage, et dans la plupart des cas AWS refuse une demande qui n'arrive pas dans les cinq minutes suivant cet horodatage, pour se protéger des rejeux. Une horloge de serveur qui dérive rend chaque signature trop ancienne ou trop récente : il faut synchroniser l'horloge."
  options:
    a:
      en: "Access keys do not expire, and the SDK derives a new signing key for each day automatically."
      fr: "Les clés d'accès n'expirent pas, et le SDK dérive automatiquement une nouvelle clé de signature chaque jour."
    c:
      en: "SigV4a is for multi-Region requests; its signatures are also timestamped, so the skew remains."
      fr: "SigV4a sert aux demandes multirégions ; ses signatures sont aussi horodatées, et le décalage demeure."
    d:
      en: "The security token is needed only with temporary credentials and has nothing to do with request time."
      fr: "Le jeton de sécurité n'est nécessaire qu'avec des informations d'identification temporaires et n'a aucun rapport avec l'heure de la demande."
references:
  - title: AWS Signature Version 4 for API requests
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv.html
