# DVA-C03 objectives — AWS Certified Developer - Associate (DVA-C03) Exam Guide (no version number
# or date printed; DVA-C03 in use from December 1, 2026), English HTML/Markdown domain pages,
# checked on 2026-11-19 (each domain read twice, HTML and Markdown, identical).
# One group per task statement (title without the "Task n.n:" prefix and final period).
# The DVA-C03 guide has a single "Skill n.n.n" list per task (no "Knowledge of" / "Skills in"
# split): objectives = every skill bullet, in the guide's order, codes <domain>.<task>.<n> = the
# guide's skill numbers. `code` is the stable key referenced by question files and course sections.
# English: verbatim, "Skill n.n.n:" prefix and final periods removed.
# French: NO French guide exists (the fr_fr URLs of the DVA-C03 and DVA-C02 guides serve the
# English text), so ALL French group titles and objectives are our translation, following
# BRIEF-AWS §6 and AWS fr_fr documentation terminology: AWS service and feature names in English
# (Amazon S3 Event Notifications, S3 Lifecycle, Parameter Store, AWS Private CA, provisioned
# concurrency...), English term in brackets where the French is not settled (retry with backoff,
# graceful degradation, concurrency, timeout, runtime, handler, layers, dead-letter queues, event
# source mappings, TTL, spec-driven, redaction, denied topics, prompt injection, tool use,
# human-in-the-loop, mock, stage, Dockerfiles, rolling, rollback, labels, health checks,
# liveness and readiness probes, connection pooling, fan-out); policy = « politique »;
# DynamoDB operations Query and Scan kept as API names; 2.1.7 "Assume" = « Assumer » (IAM fr_fr).
development:
- group:
    en: Develop code for applications that are hosted on AWS
    fr: Développer du code pour des applications hébergées sur AWS
  objectives:
  - code: 1.1.1
    en: Identify tightly coupled and loosely coupled systems, and use AWS services to decouple system components
    fr: Identifier les systèmes fortement couplés et faiblement couplés, et utiliser les services AWS pour découpler les composants d'un système
  - code: 1.1.2
    en: Choose between synchronous and asynchronous patterns (for example, Amazon API Gateway synchronous invocation, Amazon SQS based asynchronous processing, Amazon EventBridge event-driven workflows)
    fr: Choisir entre des modèles synchrones et asynchrones (par exemple, invocation synchrone avec Amazon API Gateway, traitement asynchrone basé sur Amazon SQS, flux de travail pilotés par les événements avec Amazon EventBridge)
  - code: 1.1.3
    en: Create and maintain fault-tolerant and resilient applications (for example, by configuring retry with backoff, graceful degradation)
    fr: Créer et maintenir des applications tolérantes aux pannes et résilientes (par exemple, en configurant des nouvelles tentatives avec backoff [retry with backoff], une dégradation progressive [graceful degradation])
  - code: 1.1.4
    en: Create, extend, and maintain APIs (for example, configure response/request transformations, by enforcing validation rules)
    fr: Créer, étendre et maintenir des API (par exemple, configurer des transformations de réponse/requête, en appliquant des règles de validation)
  - code: 1.1.5
    en: Develop code that interacts with AWS services by using APIs and AWS SDKs
    fr: Développer du code qui interagit avec les services AWS à l'aide des API et des kits SDK AWS
  - code: 1.1.6
    en: Manage streaming data by using AWS services
    fr: Gérer des données de streaming à l'aide des services AWS
  - code: 1.1.7
    en: Serialize and deserialize data to integrate application code with AWS services
    fr: Sérialiser et désérialiser des données pour intégrer le code d'application aux services AWS
  - code: 1.1.8
    en: Implement event-driven patterns (for example, by using EventBridge, Amazon S3 Event Notifications, Amazon SQS, Amazon SNS)
    fr: Mettre en œuvre des modèles pilotés par les événements (par exemple, à l'aide d'EventBridge, d'Amazon S3 Event Notifications, d'Amazon SQS, d'Amazon SNS)
  - code: 1.1.9
    en: Use AI-assisted development tools to generate, review, and optimize code (for example, spec-driven code generation, automated code reviews, intelligent code completion, refactoring suggestions, security scanning)
    fr: Utiliser des outils de développement assistés par l'IA pour générer, réviser et optimiser du code (par exemple, génération de code pilotée par les spécifications [spec-driven], revues de code automatisées, complétion de code intelligente, suggestions de refactorisation, analyse de sécurité)
  - code: 1.1.10
    en: Integrate managed AWS AI services into applications
    fr: Intégrer des services d'IA gérés d'AWS dans des applications
- group:
    en: Develop code for AWS Lambda
    fr: Développer du code pour AWS Lambda
  objectives:
  - code: 1.2.1
    en: Grant Lambda functions access to private resources in VPCs
    fr: Accorder aux fonctions Lambda l'accès à des ressources privées dans des VPC
  - code: 1.2.2
    en: Configure Lambda functions by defining environment variables and parameters (for example, memory, concurrency, timeout, runtime, handler, layers, extensions)
    fr: Configurer des fonctions Lambda en définissant des variables d'environnement et des paramètres (par exemple, mémoire, simultanéité [concurrency], délai d'expiration [timeout], environnement d'exécution [runtime], gestionnaire [handler], couches [layers], extensions)
  - code: 1.2.3
    en: Handle event lifecycles and errors (for example, by using Lambda destinations, dead-letter queues)
    fr: Gérer le cycle de vie des événements et les erreurs (par exemple, à l'aide des destinations Lambda, des files d'attente de lettres mortes [dead-letter queues])
  - code: 1.2.4
    en: Integrate Lambda functions with AWS services by using code, event source mappings, and destinations (for example, API Gateway, Amazon DynamoDB)
    fr: Intégrer des fonctions Lambda aux services AWS à l'aide de code, de mappages de source d'événements [event source mappings] et de destinations (par exemple, API Gateway, Amazon DynamoDB)
- group:
    en: Use data stores during application development
    fr: Utiliser des magasins de données lors du développement d'applications
  objectives:
  - code: 1.3.1
    en: Manage data lifecycles (for example, by using Amazon S3 Lifecycle policies, TTL, retention periods)
    fr: Gérer le cycle de vie des données (par exemple, à l'aide des politiques S3 Lifecycle d'Amazon S3, de la durée de vie [TTL], des périodes de conservation)
  - code: 1.3.2
    en: Choose AWS data stores (for example, Amazon ElastiCache, DynamoDB, Amazon S3, Amazon RDS) based on access patterns
    fr: Choisir des magasins de données AWS (par exemple, Amazon ElastiCache, DynamoDB, Amazon S3, Amazon RDS) en fonction des modèles d'accès
  - code: 1.3.3
    en: Determine the appropriate caching solution based on data store selection
    fr: Déterminer la solution de mise en cache appropriée en fonction du magasin de données choisi
  - code: 1.3.4
    en: Configure DynamoDB to support applications (for example, by selecting high-cardinality partition keys, applying read consistency models, performing query and scan operations, by defining keys, attributes, and indexes)
    fr: Configurer DynamoDB pour prendre en charge des applications (par exemple, en sélectionnant des clés de partition à cardinalité élevée, en appliquant des modèles de cohérence de lecture, en effectuant des opérations Query et Scan, en définissant des clés, des attributs et des index)
security:
- group:
    en: Implement authentication and authorization mechanisms for applications and AWS services
    fr: Mettre en œuvre des mécanismes d'authentification et d'autorisation pour les applications et les services AWS
  objectives:
  - code: 2.1.1
    en: Implement identity federation
    fr: Mettre en œuvre la fédération d'identités
  - code: 2.1.2
    en: Implement access control (for example, fine-grained permissions, security tokens, MFA)
    fr: Mettre en œuvre le contrôle d'accès (par exemple, autorisations détaillées, jetons de sécurité, MFA)
  - code: 2.1.3
    en: Configure programmatic access to AWS
    fr: Configurer l'accès par programmation à AWS
  - code: 2.1.4
    en: Use presigned URLs to provide secure, time-limited access (for example, by using Amazon S3 and Amazon CloudFront)
    fr: Utiliser des URL présignées pour fournir un accès sécurisé et limité dans le temps (par exemple, à l'aide d'Amazon S3 et d'Amazon CloudFront)
  - code: 2.1.5
    en: Make authenticated calls to AWS services
    fr: Effectuer des appels authentifiés aux services AWS
  - code: 2.1.6
    en: Define permissions for IAM principals (for example, users, roles, services) and resources
    fr: Définir les autorisations des principaux IAM (par exemple, utilisateurs, rôles, services) et des ressources
  - code: 2.1.7
    en: Assume an IAM role
    fr: Assumer un rôle IAM
- group:
    en: Implement encryption and manage sensitive data by using AWS services
    fr: Mettre en œuvre le chiffrement et gérer les données sensibles à l'aide des services AWS
  objectives:
  - code: 2.2.1
    en: Apply encryption at rest and in transit
    fr: Appliquer le chiffrement au repos et en transit
  - code: 2.2.2
    en: Manage certificates by using AWS services (for example, AWS Certificate Manager, AWS Private CA)
    fr: Gérer les certificats à l'aide des services AWS (par exemple, AWS Certificate Manager, AWS Private CA)
  - code: 2.2.3
    en: Select and apply client-side or server-side encryption
    fr: Choisir et appliquer le chiffrement côté client ou côté serveur
  - code: 2.2.4
    en: Use encryption keys to encrypt and decrypt data
    fr: Utiliser des clés de chiffrement pour chiffrer et déchiffrer des données
  - code: 2.2.5
    en: Generate certificates and SSH keys for development purposes
    fr: Générer des certificats et des clés SSH à des fins de développement
  - code: 2.2.6
    en: Identify, mask, and limit access to sensitive data (for example, personally identifiable information [PII], protected health information [PHI]) by using AWS services
    fr: Identifier et masquer les données sensibles et en limiter l'accès (par exemple, informations personnelles identifiables [PII], informations de santé protégées [PHI]) à l'aide des services AWS
  - code: 2.2.7
    en: Use secret management services to secure sensitive data
    fr: Utiliser des services de gestion des secrets pour sécuriser les données sensibles
- group:
    en: Identify and mitigate security risks associated with using and integrating AI services into application development
    fr: Identifier et atténuer les risques de sécurité liés à l'utilisation et à l'intégration de services d'IA dans le développement d'applications
  objectives:
  - code: 2.3.1
    en: Request and manage access to AI services
    fr: Demander et gérer l'accès aux services d'IA
  - code: 2.3.2
    en: Use data privacy controls to transmit data to AI services (for example, by using VPC endpoints to establish private connectivity, ensuring that inputs and outputs are not used to train AI models)
    fr: Utiliser des contrôles de confidentialité des données pour transmettre des données aux services d'IA (par exemple, en utilisant des points de terminaison de VPC pour établir une connectivité privée, en s'assurant que les entrées et les sorties ne sont pas utilisées pour entraîner des modèles d'IA)
  - code: 2.3.3
    en: Filter and control AI model inputs and outputs (for example, by applying content filtering, sensitive information detection, PII/PHI redaction, denied topic policies, prompt injection and manipulation protection)
    fr: Filtrer et contrôler les entrées et les sorties des modèles d'IA (par exemple, en appliquant un filtrage de contenu, une détection des informations sensibles, un masquage [redaction] des PII/PHI, des politiques de sujets refusés [denied topics], une protection contre l'injection et la manipulation d'invites [prompt injection])
  - code: 2.3.4
    en: Secure AI agent interactions (for example, by using tool-use authorization, session isolation, human-in-the-loop approval flows for sensitive actions)
    fr: Sécuriser les interactions des agents d'IA (par exemple, en utilisant l'autorisation d'utilisation des outils [tool use], l'isolation des sessions, des flux d'approbation avec intervention humaine [human-in-the-loop] pour les actions sensibles)
  - code: 2.3.5
    en: Protect sensitive content in monitoring logs during interactions with AI services
    fr: Protéger le contenu sensible dans les journaux de surveillance lors des interactions avec les services d'IA
deployment:
- group:
    en: Prepare application artifacts to be deployed to AWS
    fr: Préparer les artefacts d'application à déployer sur AWS
  objectives:
  - code: 3.1.1
    en: Manage dependencies for code modules (for example, environment variables, configuration files, container images) within packages
    fr: Gérer les dépendances des modules de code (par exemple, variables d'environnement, fichiers de configuration, images de conteneur) au sein des packages
  - code: 3.1.2
    en: Build and manage container images for deployment (for example, by using Amazon ECR, Docker files, container image tagging, lifecycle policies)
    fr: Créer et gérer des images de conteneur pour le déploiement (par exemple, à l'aide d'Amazon ECR, de fichiers Docker [Dockerfiles], du balisage des images de conteneur, de politiques de cycle de vie)
  - code: 3.1.3
    en: Use code repositories in deployment environments
    fr: Utiliser des référentiels de code dans les environnements de déploiement
  - code: 3.1.4
    en: Manage environment-specific application configuration by using AWS services (for example, AWS AppConfig, AWS Systems Manager Parameter Store, AWS Secrets Manager, Amazon API Gateway, AWS Lambda)
    fr: Gérer la configuration d'application propre à chaque environnement à l'aide des services AWS (par exemple, AWS AppConfig, AWS Systems Manager Parameter Store, AWS Secrets Manager, Amazon API Gateway, AWS Lambda)
  - code: 3.1.5
    en: Use API Gateway features and resources (for example, stage-specific URLs, endpoints)
    fr: Utiliser les fonctionnalités et les ressources d'API Gateway (par exemple, URL propres à chaque étape [stage], points de terminaison)
- group:
    en: Implement and automate application testing in AWS environments
    fr: Mettre en œuvre et automatiser les tests d'applications dans des environnements AWS
  objectives:
  - code: 3.2.1
    en: Develop and validate tests (for example, by using AWS SAM, AWS CDK, AWS CloudFormation)
    fr: Développer et valider des tests (par exemple, à l'aide d'AWS SAM, d'AWS CDK, d'AWS CloudFormation)
  - code: 3.2.2
    en: Use mock APIs for external dependencies by using AWS services and tools (for example, API Gateway)
    fr: Utiliser des API fictives [mock] pour les dépendances externes à l'aide des services et outils AWS (par exemple, API Gateway)
  - code: 3.2.3
    en: Create application test events (for example, by using JSON payloads to test Lambda functions and API Gateway APIs)
    fr: Créer des événements de test d'application (par exemple, à l'aide de charges utiles JSON pour tester des fonctions Lambda et des API d'API Gateway)
  - code: 3.2.4
    en: Create and configure application environments (for example, Lambda aliases, container image tags, AWS Amplify branches, AWS Copilot environments, API Gateway APIs)
    fr: Créer et configurer des environnements d'application (par exemple, alias Lambda, balises d'image de conteneur, branches AWS Amplify, environnements AWS Copilot, API d'API Gateway)
  - code: 3.2.5
    en: Use AWS AI tools to generate tests and automate repetitive testing workflows (for example, automated test execution, test result analysis, regression testing automation, test coverage)
    fr: Utiliser les outils d'IA d'AWS pour générer des tests et automatiser les flux de travail de test répétitifs (par exemple, exécution automatisée des tests, analyse des résultats de test, automatisation des tests de régression, couverture de test)
- group:
    en: Deploy code by using AWS continuous integration and continuous delivery (CI/CD) services
    fr: Déployer du code à l'aide des services d'intégration continue et de livraison continue (CI/CD) d'AWS
  objectives:
  - code: 3.3.1
    en: Use Lambda deployment packaging methods to optimize deployment efficiency (for example, .zip files, container images, layers)
    fr: Utiliser les méthodes de packaging de déploiement Lambda pour optimiser l'efficacité du déploiement (par exemple, fichiers .zip, images de conteneur, couches)
  - code: 3.3.2
    en: Deploy containerized applications by using AWS container orchestration services (for example, Amazon ECS task definitions, Amazon EKS manifests, AWS Fargate launch types, rolling updates)
    fr: Déployer des applications conteneurisées à l'aide des services d'orchestration de conteneurs d'AWS (par exemple, définitions de tâches Amazon ECS, manifestes Amazon EKS, types de lancement AWS Fargate, mises à jour propagées [rolling updates])
  - code: 3.3.3
    en: Use infrastructure as code (IaC) templates (for example, CloudFormation templates, AWS SAM templates)
    fr: Utiliser des modèles d'infrastructure en tant que code (IaC) (par exemple, modèles CloudFormation, modèles AWS SAM)
  - code: 3.3.4
    en: Deploy application revisions to target environments by using AWS CodeDeploy
    fr: Déployer des révisions d'application dans des environnements cibles à l'aide d'AWS CodeDeploy
  - code: 3.3.5
    en: Use AWS CodePipeline to orchestrate CI/CD pipelines (for example, invoke pipelines from linked code repositories, orchestrate progression through multiple environments)
    fr: Utiliser AWS CodePipeline pour orchestrer des pipelines CI/CD (par exemple, déclencher des pipelines depuis des référentiels de code liés, orchestrer la progression à travers plusieurs environnements)
  - code: 3.3.6
    en: Implement deployment strategies for application releases (for example, blue/green, canary, rolling)
    fr: Mettre en œuvre des stratégies de déploiement pour les versions d'application (par exemple, bleu/vert, canary, propagé [rolling])
  - code: 3.3.7
    en: Implement automatic or manual rollback by using AWS services (for example, CloudFormation, CodeDeploy)
    fr: Mettre en œuvre une restauration [rollback] automatique ou manuelle à l'aide des services AWS (par exemple, CloudFormation, CodeDeploy)
  - code: 3.3.8
    en: Use source control features to manage application versions and releases (for example, labels, branches)
    fr: Utiliser les fonctionnalités du contrôle de code source pour gérer les versions et les livraisons d'application (par exemple, étiquettes [labels], branches)
  - code: 3.3.9
    en: Use AWS AI tools to support CI/CD workflows (for example, automated deployment approvals, environment provisioning, post-deployment validation)
    fr: Utiliser les outils d'IA d'AWS pour prendre en charge les flux de travail CI/CD (par exemple, approbations de déploiement automatisées, provisionnement d'environnements, validation post-déploiement)
troubleshooting:
- group:
    en: Assist in a root cause analysis
    fr: Contribuer à une analyse des causes racines
  objectives:
  - code: 4.1.1
    en: Debug application code and service integration issues to identify defects
    fr: Déboguer le code d'application et les problèmes d'intégration de services pour identifier les défauts
  - code: 4.1.2
    en: Interpret application metrics, logs, and traces
    fr: Interpréter les métriques, les journaux et les traces d'application
  - code: 4.1.3
    en: Query logs to find relevant data
    fr: Interroger les journaux pour trouver les données pertinentes
  - code: 4.1.4
    en: Troubleshoot deployment failures by using output logs
    fr: Dépanner les échecs de déploiement à l'aide des journaux de sortie
  - code: 4.1.5
    en: Use AWS AI tools to analyze errors and to generate troubleshooting suggestions
    fr: Utiliser les outils d'IA d'AWS pour analyser les erreurs et générer des suggestions de dépannage
- group:
    en: Apply logging, monitoring, and observability best practices
    fr: Appliquer les bonnes pratiques de journalisation, de surveillance et d'observabilité
  objectives:
  - code: 4.2.1
    en: Implement effective logging strategies to record application behavior and state (for example, by using structured logging for application events and user actions)
    fr: Mettre en œuvre des stratégies de journalisation efficaces pour enregistrer le comportement et l'état de l'application (par exemple, à l'aide de la journalisation structurée des événements d'application et des actions des utilisateurs)
  - code: 4.2.2
    en: Implement code that emits custom metrics
    fr: Mettre en œuvre du code qui émet des métriques personnalisées
  - code: 4.2.3
    en: Implement notification alerts for specific actions (for example, quota limits, deployment completions)
    fr: Mettre en œuvre des alertes de notification pour des actions spécifiques (par exemple, limites de quotas, fins de déploiement)
  - code: 4.2.4
    en: Implement tracing by using AWS services and tools
    fr: Mettre en œuvre le traçage à l'aide des services et outils AWS
  - code: 4.2.5
    en: Monitor workload health (for example, by using application health checks, liveness and readiness probes)
    fr: Surveiller l'état de santé des charges de travail (par exemple, à l'aide de vérifications de l'état [health checks] de l'application, de sondes de vivacité et de disponibilité [liveness and readiness probes])
- group:
    en: Optimize applications by using AWS services and features
    fr: Optimiser les applications à l'aide des services et fonctionnalités AWS
  objectives:
  - code: 4.3.1
    en: Apply concurrency concepts (for example, AWS Lambda provisioned concurrency, Amazon EC2 Auto Scaling, thread pool management, connection pooling)
    fr: Appliquer les concepts de simultanéité (par exemple, simultanéité provisionnée [provisioned concurrency] d'AWS Lambda, Amazon EC2 Auto Scaling, gestion des pools de threads, regroupement de connexions [connection pooling])
  - code: 4.3.2
    en: Optimize memory and compute power for an application
    fr: Optimiser la mémoire et la puissance de calcul d'une application
  - code: 4.3.3
    en: Optimize application messaging (for example, by using Amazon SQS queues, Amazon SNS fan-out patterns)
    fr: Optimiser la messagerie applicative (par exemple, à l'aide de files d'attente Amazon SQS, de modèles de diffusion [fan-out] Amazon SNS)
  - code: 4.3.4
    en: Implement caching by using AWS services (for example, Amazon ElastiCache, Amazon DynamoDB Accelerator [DAX], Amazon CloudFront)
    fr: Mettre en œuvre la mise en cache à l'aide des services AWS (par exemple, Amazon ElastiCache, Amazon DynamoDB Accelerator [DAX], Amazon CloudFront)
  - code: 4.3.5
    en: Detect performance bottlenecks by using AWS services (for example, Amazon CloudWatch)
    fr: Détecter les goulets d'étranglement de performance à l'aide des services AWS (par exemple, Amazon CloudWatch)
  - code: 4.3.6
    en: Use AWS AI tools to identify optimization opportunities (for example, performance bottleneck detection, resource usage optimization, code efficiency improvement)
    fr: Utiliser les outils d'IA d'AWS pour identifier des opportunités d'optimisation (par exemple, détection des goulets d'étranglement de performance, optimisation de l'utilisation des ressources, amélioration de l'efficacité du code)
