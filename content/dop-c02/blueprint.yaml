# DOP-C02 — AWS Certified DevOps Engineer – Professional
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-23):
#   - AWS Certified DevOps Engineer - Professional (DOP-C02) Exam Guide, HTML page and Markdown copies under
#     https://docs.aws.amazon.com/aws-certification/latest/devops-engineer-professional-02/devops-engineer-professional-02.html
#     (domain pages devops-engineer-professional-02-domain1..6, dop-technologies-concepts,
#     dop-02-in-scope-services) and the PDF in the same folder. The guide has no out-of-scope
#     services list (only out-of-scope job tasks) and no revisions page.
#     The fr_fr path serves the English text (meta locale en_us): no French guide exists.
#   - Certification page: https://aws.amazon.com/certification/certified-devops-engineer-professional/
#     (links to the DOP-C02 guide only, no DOP-C03 announced; 180 minutes, 75 questions, multiple
#     choice or multiple response, 300 USD; languages offered: English, Japanese, Korean, and
#     Simplified Chinese — the Korean version retires after December 31, 2026; Pearson VUE test
#     center or online proctored).
# Guide version: none printed (no version number, no publication date, no revisions page; the PDF
# only carries "Copyright © 2026") → blueprint.version 'DOP-C02'.
# Exam facts: 75 questions = 65 scored + 10 unscored (not identified); scaled score 100–1,000,
# pass at 750, compensatory scoring, no penalty for guessing; response types: multiple choice
# (1 correct of 4) and multiple response (2 or more correct of 5 or more). No ordering or matching
# item, no case study. The guide does not state the duration (180 min from the certification page).
# Unscored questions are not modelled: the mock exam scores all 75 questions.
# Domain weights: share of scored content as published (22 / 17 / 15 / 15 / 14 / 17 %).
# difficultyMix: professional level, middle of the target ranges (easy 0.10–0.20,
# medium 0.45–0.55, hard 0.30–0.40); the schema takes one share per level.
certification:
  code: dop-c02
  title: AWS Certified DevOps Engineer – Professional
  vendor: AWS
  # The official exam is not offered in French: the site offers this certification in English only.
  languages: [en]
  active: false

blueprint:
  version: 'DOP-C02'
  durationMin: 180
  questionCount: { min: 75, max: 75 }
  passScore: 750
  maxScore: 1000
  # AWS gives no partial credit on multiple-response questions (see docs/SPECS-AWS.md §3.3);
  # dragdrop states the AWS rule too, though this exam has no such question.
  scoring:
    multi: all_or_nothing
    dragdrop: all_or_nothing

  # Target share of each question type in an exam (0..1). The real exam has only
  # multiple choice (single) and multiple response (multi).
  typeMix:
    single: { min: 0.78, max: 0.88 }
    multi: { min: 0.12, max: 0.22 }

  difficultyMix: { easy: 0.15, medium: 0.50, hard: 0.35 }

  structure:
    caseStudies:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
      placement: end
    series:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
    maxPerObjective: 2
    warningsMin: [10, 5]
    # Readiness index (0–100), the central indicator of the dashboard.
    # index = weighted sum of four criteria, each worth 0–100 points:
    #   level       — weighted average of the last `window` exams, weights 1, 2, …, n
    #                 from the oldest to the latest
    #   consistency — lowest of the last `recent` exams
    #   domains     — weakest domain, averaged over the last `recent` exams
    #   freshness   — share of never-seen questions, and date of the last exam
    # Scores map to points linearly: `scale.from` or less → 0, `scale.to` or more → 100.
    # "Ready" = index at `bands.ready` or more AND five rules (minAttempts,
    # consecutive × minScore, domainFloor, freshness.minNewShare: at least that
    # share of never-seen questions in the `recent` exams, freshness.zeroDays: a
    # last exam at most that old); while a rule fails, the index stays
    # under `bands.ready`.
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale: { from: 600, to: 850 }
      weights: { level: 0.5, consistency: 0.2, domains: 0.2, freshness: 0.1 }
      bands: { progressing: 50, almost: 70, ready: 85 }
      # Recency: full up to staleDays after the last exam, then down to 0 at zeroDays;
      # past zeroDays, no "ready" until a new exam.
      freshness: { staleDays: 30, zeroDays: 90, minNewShare: 0.5 }
    # XP, levels, domain mastery and badges: the "gaming" side. They reward
    # effort and progress; only the readiness index says "ready".
    progression:
      xp:
        base: 50            # any finished exam
        scoreFrom: 400      # score XP = (score - 400) × 0.5: 0 at 400, 300 at 1000
        perPoint: 0.5
        knownShare: 0.5     # only half the score XP on questions already seen
        passBonus: 100      # at 750 or more
        bestBonus: 75       # best score so far
        domainBonus: 50     # per domain at least 50 points above the previous exam
        domainGain: 50
      levels:
        - { xp: 0, title: { en: First commit pusher } }
        - { xp: 150, title: { en: Build fixer } }
        - { xp: 400, title: { en: Pipeline wirer } }
        - { xp: 750, title: { en: Stack templater } }
        - { xp: 1200, title: { en: Deployment strategist } }
        - { xp: 1750, title: { en: Observability tuner } }
        - { xp: 2400, title: { en: Incident responder } }
        - { xp: 3150, title: { en: Guardrail automator } }
        - { xp: 4000, title: { en: Professional DevOps engineer } }
        - { xp: 5000, title: { en: Continuous delivery legend } }
      mastery: { bronze: 650, silver: 700, gold: 850 }
      badges:
        hatTrick: { count: 3, min: 800 }
        regular: { weeks: 4 }
        comeback: { gain: 150 }


domains:
  - code: sdlc
    order: 1
    weight: { min: 0.22, max: 0.22 }
    title:
      en: SDLC Automation
  - code: config
    order: 2
    weight: { min: 0.17, max: 0.17 }
    title:
      en: Configuration Management and IaC
  - code: resilience
    order: 3
    weight: { min: 0.15, max: 0.15 }
    title:
      en: Resilient Cloud Solutions
  - code: monitoring
    order: 4
    weight: { min: 0.15, max: 0.15 }
    title:
      en: Monitoring and Logging
  - code: incident
    order: 5
    weight: { min: 0.14, max: 0.14 }
    title:
      en: Incident and Event Response
  - code: security
    order: 6
    weight: { min: 0.17, max: 0.17 }
    title:
      en: Security and Compliance
