#                   32-multi-az-multi-region (3.1.1, 3.1.3, 3.1.7, 3.1.9);
#   task 3.2 (9)  → 33-scaling-metrics-caching (3.2.1, 3.2.2, 3.2.5, 3.2.6, 3.2.8) and
#                   34-containers-serverless (3.2.3, 3.2.4, 3.2.7, 3.2.9);
#   task 4.1 (13) → 41-metrics-collection (4.1.1, 4.1.2, 4.1.5, 4.1.7–4.1.9) and
#                   42-log-storage-processing (4.1.3, 4.1.4, 4.1.6, 4.1.10–4.1.13);
#   task 4.2 (10) → 43-alarms-dashboards-tracing (4.2.1, 4.2.2, 4.2.6–4.2.8) and
#                   44-log-analysis-auditing (4.2.3–4.2.5, 4.2.9, 4.2.10);
#   task 4.3 (11) → 45-event-automation-agents (4.3.1, 4.3.3, 4.3.6–4.3.10) and
#                   46-auto-scaling-health-checks (4.3.2, 4.3.4, 4.3.5, 4.3.11).
