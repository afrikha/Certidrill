# Course manifest: modules, chapter order (the order of this list), titles, reading time
# and AWS documentation references. Sections, their titles and their objectives are read from
# chapters/<id>.<locale>.md (the section markers), never duplicated here.
# English only (certification.languages: [en]): chapters are <id>.en.md, titles { en } only.
