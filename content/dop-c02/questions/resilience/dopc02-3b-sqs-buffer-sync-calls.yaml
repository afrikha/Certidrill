id: dopc02-3b-sqs-buffer-sync-calls
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An e-commerce company has an order service that calls an inventory service synchronously over HTTPS for every new order. The inventory service runs on Amazon EC2 instances in an Auto Scaling group. During flash sales, the inventory service cannot scale fast enough, the calls time out, and customers see order failures. The order service only needs an acknowledgment that the inventory update was recorded, not the result. The company wants orders to be accepted during spikes even when the inventory service is slow or temporarily unavailable.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the HTTP client timeout and add retries with exponential backoff in the order service for calls to the inventory service.
    - id: b
      text:
        en: |-
          Put an Application Load Balancer in front of the inventory service, and enable cross-zone load balancing to spread the calls evenly.
    - id: c
      text:
        en: |-
          Have the order service send inventory updates to an SQS queue, and have the inventory service poll the queue and scale on its backlog.
    - id: d
      text:
        en: |-
          Configure scheduled scaling to double the minimum capacity of the inventory service group shortly before each announced flash sale.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Well-Architected Reliability Pillar recommends asynchronous interaction through a durable intermediary such as an SQS queue when only an acknowledgment is needed. The queue accepts messages even when the consumer is slow or unavailable, so orders succeed, and the inventory service processes the backlog at its own pace and can scale on it.
  options:
    a:
      en: |-
        Longer timeouts and retries keep the services tightly coupled; when the inventory service is unavailable, orders still fail, and retries add load during the spike.
    b:
      en: |-
        A load balancer spreads calls but does not add buffering, so calls still fail when all inventory instances are saturated or unavailable.
    d:
      en: |-
        Scheduled scaling helps only for known events, and the services remain synchronously coupled, so an unexpected spike or outage still causes order failures.
references:
  - title: REL04-BP02 Implement loosely coupled dependencies - Reliability Pillar
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_prevent_interaction_failure_loosely_coupled_system.html
