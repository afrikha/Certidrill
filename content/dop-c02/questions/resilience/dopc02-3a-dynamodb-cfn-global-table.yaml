id: dopc02-3a-dynamodb-cfn-global-table
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company defines an Amazon DynamoDB table as an AWS::DynamoDB::Table resource in an AWS CloudFormation stack in us-east-1. The table holds several million items. The company wants to turn the table into a global table with a replica in eu-west-1 and to keep managing the table, including its replicas, with CloudFormation from now on. The data must not be put at risk during the change.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the resource type in the template from AWS::DynamoDB::Table to AWS::DynamoDB::GlobalTable, add an eu-west-1 replica to the resource, and update the stack.
    - id: b
      text:
        en: |-
          Set the table's DeletionPolicy to Retain, remove it from the stack, add an eu-west-1 replica to the table, and import the table into the stack as an AWS::DynamoDB::GlobalTable resource.
    - id: c
      text:
        en: |-
          Deploy a stack set that creates an AWS::DynamoDB::Table resource with the same name in eu-west-1, and turn on DynamoDB Streams for the tables in both Regions.
    - id: d
      text:
        en: |-
          Keep the us-east-1 table in its stack, and create a second stack in eu-west-1 that defines the eu-west-1 replica as an AWS::DynamoDB::GlobalTable resource.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS warns that converting a single-Region table to a global table by changing its CloudFormation resource type can delete the table. The safe procedure is to retain the table, remove it from the stack, add the replica to convert it to a global table, and then import it into the stack as an AWS::DynamoDB::GlobalTable resource. All replicas are then defined in that one stack, as AWS recommends.
  options:
    a:
      en: |-
        Changing the resource type makes CloudFormation replace the resource, which can delete the existing table and its data.
    c:
      en: |-
        Two tables with the same name are independent tables; turning on streams does not replicate data between them, so this is not a global table.
    d:
      en: |-
        AWS recommends defining all replicas of a global table in one stack in a single reference Region; spreading replicas across stacks can cause drift errors during replica updates.
references:
  - title: "Best practices for global tables - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_reqs_bestpractices.html
