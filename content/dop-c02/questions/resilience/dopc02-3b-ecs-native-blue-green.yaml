id: dopc02-3b-ecs-native-blue-green
objective: "3.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a customer portal as an Amazon ECS service on AWS Fargate behind an Application Load Balancer and deploys it with rolling updates. The company wants to change the release process. A new revision must receive test traffic, and an AWS Lambda function must validate it before production traffic moves. After production traffic moves, the previous revision must keep running for 30 minutes so that the team can roll back instantly. The deployment must roll back automatically when a CloudWatch alarm on 5xx errors goes into ALARM. The team wants to manage deployments entirely in Amazon ECS without creating resources in another deployment service.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the deployment strategy of the service to BLUE_GREEN with a 30-minute bake time, a Lambda hook at the test traffic stage, and the alarm.
    - id: b
      text:
        en: |-
          Change the deployment controller to CODE_DEPLOY, and create a CodeDeploy deployment group with an AfterAllowTestTraffic Lambda hook, a 30-minute wait, and the alarm.
    - id: c
      text:
        en: |-
          Keep the rolling strategy, set minimumHealthyPercent to 100 and maximumPercent to 200, and enable the deployment circuit breaker with rollback and the alarm.
    - id: d
      text:
        en: |-
          Change the deployment controller to EXTERNAL, and have a pipeline script create task sets, switch the listener rules, and delete the old task set after 30 minutes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon ECS supports blue/green deployments natively with the BLUE_GREEN strategy. The green revision can receive test traffic through listener rules, Lambda lifecycle hooks run at stages such as the test traffic shift, and the bake time keeps the blue revision running after the production shift for fast rollback. The deployment rolls back automatically when validation fails or the configured CloudWatch alarms go into ALARM.
  options:
    b:
      en: |-
        This meets the functional requirements, but it creates a CodeDeploy application and deployment group, which the team wants to avoid.
    c:
      en: |-
        A rolling update replaces tasks in place: there is no test traffic stage for a validation hook, and the previous revision is not kept running after the deployment.
    d:
      en: |-
        The EXTERNAL controller hands deployment control to a custom tool, so the team would build and maintain the traffic switching and rollback logic itself.
references:
  - title: Amazon ECS blue/green service deployments workflow - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/blue-green-deployment-how-it-works.html
  - title: DeploymentConfiguration - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_DeploymentConfiguration.html
