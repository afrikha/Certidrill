id: dopc02-3b-dax-hot-reads
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online gaming company stores player profiles in an Amazon DynamoDB table. A small set of popular profiles is read thousands of times per second during tournaments, and the table's read capacity costs keep rising. The game servers use the AWS SDK for Java and can tolerate eventually consistent reads. The company wants microsecond read latency for these repeated reads with minimal application code changes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a DynamoDB Accelerator (DAX) cluster, and change the game servers to use the DAX client with the cluster endpoint.
    - id: b
      text:
        en: |-
          Add a global secondary index on the player ID, and send the profile reads to the index instead of the base table.
    - id: c
      text:
        en: |-
          Convert the table to a global table with replicas in two more Regions, and spread the reads across the replicas.
    - id: d
      text:
        en: |-
          Enable DynamoDB Streams, and have an AWS Lambda function copy changed profiles to an Amazon S3 bucket that the game servers read from.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      DAX is an in-memory cache that is API-compatible with DynamoDB, so applications switch to the DAX client with minimal changes. For eventually consistent reads, it reduces response times from single-digit milliseconds to microseconds, and it fits workloads that repeatedly read a small set of hot items while reducing the read capacity consumed by the table.
  options:
    b:
      en: |-
        An index is still served by DynamoDB with millisecond latency and consumes its own read capacity, so neither latency nor cost improves.
    c:
      en: |-
        Replicas add write and storage costs in each Region and still return millisecond reads.
    d:
      en: |-
        This adds a custom pipeline and code changes, and reads from Amazon S3 are slower than DynamoDB reads, not faster.
references:
  - title: In-memory acceleration with DynamoDB Accelerator (DAX) - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html
