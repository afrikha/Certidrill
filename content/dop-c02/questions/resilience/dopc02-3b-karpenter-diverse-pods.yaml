id: dopc02-3b-karpenter-diverse-pods
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data analytics company runs an Amazon EKS cluster with self-managed add-ons. Cluster Autoscaler scales five managed node groups, each with one instance size. The workloads change often: some pods need large memory, some need arm64 nodes, and batch jobs create bursts of hundreds of pods. Pods regularly stay Pending because no node group matches their requests, and the team keeps adding node groups. Nodes also stay underused after bursts end. The company wants nodes to be chosen from many instance types based on the requests of pending pods and wants underused nodes to be consolidated automatically.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a mixed instances policy with instance types of different sizes and architectures to one node group, and keep Cluster Autoscaler for scaling.
    - id: b
      text:
        en: |-
          Configure the Kubernetes Horizontal Pod Autoscaler on every deployment so that the number of pods follows their CPU and memory utilization.
    - id: c
      text:
        en: |-
          Increase the maximum size of every node group, and lower the scale-down utilization threshold of Cluster Autoscaler.
    - id: d
      text:
        en: |-
          Replace Cluster Autoscaler with Karpenter, and define a NodePool that allows many instance families and both architectures, with consolidation.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Karpenter watches pods that cannot be scheduled, evaluates their requirements and launches nodes chosen from the allowed instance types, so one flexible NodePool replaces many node groups. Its disruption settings consolidate empty or underused nodes after bursts.
  options:
    a:
      en: |-
        Cluster Autoscaler expects the instance types of a mixed instances policy to have the same CPU, memory and GPU shape and simulates scheduling with the first type, so different sizes cause wasted or unschedulable capacity.
    b:
      en: |-
        The Horizontal Pod Autoscaler changes the number of pods; it does not create nodes that fit pending pods.
    c:
      en: |-
        Larger node groups do not help pods whose requests no node group matches, and the team would still create node groups for new requirements.
references:
  - title: Karpenter - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/best-practices/karpenter.html
  - title: Cluster Autoscaler - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/best-practices/cas.html
