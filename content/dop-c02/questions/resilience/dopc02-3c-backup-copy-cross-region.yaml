id: dopc02-3c-backup-copy-cross-region
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company protects its Amazon EBS volumes and Amazon EFS file systems in us-east-1 with an AWS Backup plan that takes daily backups and keeps them for 30 days. A new disaster recovery requirement states that a copy of each daily backup must exist in us-east-2 and be kept for 90 days. The copies must be encrypted with a customer managed AWS KMS key that the disaster recovery team controls in us-east-2. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an EventBridge rule that matches completed backup jobs and invokes a Lambda function that starts a copy job of each new recovery point to a vault in us-east-2.
    - id: b
      text:
        en: |-
          Create a backup vault in us-east-2 that uses the disaster recovery team's KMS key, and add a copy action to the existing backup rule that targets this vault with a 90-day retention.
    - id: c
      text:
        en: |-
          Add a cross-Region copy rule for the EBS snapshots in an Amazon Data Lifecycle Manager policy, and turn on Amazon EFS replication to a file system in us-east-2.
    - id: d
      text:
        en: |-
          Create a second backup plan in us-east-2 with a daily rule and a 90-day retention that selects the same EBS volumes and EFS file systems by tag.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A backup rule can copy each recovery point to a vault in another Region, with its own retention for the copies. AWS Backup re-encrypts the copy with the KMS key of the destination vault, so a vault that uses the disaster recovery team's key meets the encryption requirement without any custom code.
  options:
    a:
      en: |-
        Custom code that starts copy jobs duplicates a feature that backup rules provide natively, which adds operational overhead.
    c:
      en: |-
        EFS replication keeps a single current copy of the file system rather than 90 days of daily backups, and managing two different tools adds overhead compared with one backup rule.
    d:
      en: |-
        A backup plan protects resources in its own Region, so a plan in us-east-2 cannot back up the volumes and file systems in us-east-1.
references:
  - title: Creating backup copies across AWS Regions - AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/cross-region-backup.html
