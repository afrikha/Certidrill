id: dopc02-3c-backup-cross-account-region
objective: "3.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs Amazon RDS for PostgreSQL DB instances in eu-west-1 in a workload account. The DB instances are encrypted with a customer managed AWS KMS key. To protect against the loss of the Region and against a compromise of the workload account, every daily backup must also be copied to a custom vault in a separate backup account, in eu-north-1. Both accounts belong to the same organization in AWS Organizations. The backup plan in the workload account already has a copy action that targets the ARN of the destination vault, but every copy job fails. The destination vault has no access policy, and nobody has changed the AWS Backup settings of the organization.

    Which combination of actions will make the copy jobs succeed? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          From the management account of the organization, turn on cross-account backup in the AWS Backup settings.
    - id: b
      text:
        en: |-
          Change the copy action to target the default backup vault of the backup account in eu-north-1 instead of the custom vault.
    - id: c
      text:
        en: |-
          Re-encrypt the DB instances with the AWS managed key for Amazon RDS so that the backup account can decrypt the snapshots.
    - id: d
      text:
        en: |-
          Add an access policy to the destination vault that allows backup:CopyIntoBackupVault from the organization, and share the customer managed key with the backup account.
    - id: e
      text:
        en: |-
          Turn on Amazon RDS automated backups replication from eu-west-1 to eu-north-1 for the DB instances in the workload account.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Cross-account copies require both accounts to be in the same organization and cross-account backup to be turned on from the management account, and the destination vault must have an access policy that allows backup:CopyIntoBackupVault. When the source resources use a customer managed key, that key must be shared with the destination account; Amazon RDS supports a cross-Region and cross-account copy in a single action.
  options:
    b:
      en: |-
        The default vault cannot be the destination of a cross-account copy, so the copy jobs would still fail.
    c:
      en: |-
        AWS managed key policies cannot be changed or shared with another account, so this change would prevent the cross-account copy instead of enabling it.
    e:
      en: |-
        Automated backups replication keeps the copies in the workload account, so a compromise of that account would still affect them.
references:
  - title: Creating backup copies across AWS accounts - AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/create-cross-account-backup.html
  - title: AWS Backup feature availability - AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html
