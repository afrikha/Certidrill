id: dopc02-3b-rds-blue-green-upgrade
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company runs a patient scheduling application on Amazon RDS for PostgreSQL in a Multi-AZ DB instance deployment. The company must upgrade the database to a new major engine version. The DevOps team must test the upgraded database with production data before the cutover. During the cutover, the database can be unavailable for about one minute at most, and no data can be lost. The application team will not change the database endpoint in the application configuration.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Modify the DB instance to the new major version with the Apply immediately option during a low-traffic period, after taking a manual snapshot for rollback.
    - id: b
      text:
        en: |-
          Restore a snapshot to a new DB instance on the new major version, replicate changes with AWS DMS, and update the endpoint in the application after testing.
    - id: c
      text:
        en: |-
          Create a cross-Region read replica, upgrade it to the new major version, and promote it to a standalone DB instance when the tests succeed.
    - id: d
      text:
        en: |-
          Create an RDS blue/green deployment with the new major version on the green environment, test the green environment, and then switch over.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An RDS blue/green deployment creates a synchronized green copy of the production environment that can run a new major engine version and be tested while production continues. The switchover usually takes under a minute with no data loss, and the green environment receives the names and endpoints of the production environment, so the application needs no change.
  options:
    a:
      en: |-
        An in-place major version upgrade cannot be tested with production data beforehand, and the database is unavailable for the duration of the upgrade, which is not limited to about one minute.
    b:
      en: |-
        The application team will not change the endpoint, and this design also adds a DMS migration that the team must build and operate.
    c:
      en: |-
        A promoted replica is a new DB instance with a different endpoint, so the application configuration would have to change.
references:
  - title: Overview of Amazon RDS Blue/Green Deployments - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments-overview.html
