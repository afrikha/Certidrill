id: dopc02-3c-s3-rtc-batch-replication
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company stores 400 TB of video files in an Amazon S3 bucket in us-east-1 that has versioning turned on. The objects are in the S3 Standard and S3 Standard-IA storage classes. A new disaster recovery policy requires a copy of every object in a bucket in us-west-2, including the objects that are already stored. New objects must be replicated within 15 minutes, and the operations team must be notified about any object that takes longer than 15 minutes to replicate. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a replication rule to the us-west-2 bucket without S3 Replication Time Control, and run a daily Lambda function that compares S3 Inventory reports of both buckets and notifies the team.
    - id: b
      text:
        en: |-
          Create a replication rule to the us-west-2 bucket with S3 Replication Time Control turned on, and wait for the rule to replicate the existing objects in the background.
    - id: c
      text:
        en: |-
          Create a replication rule with S3 Replication Time Control turned on, send the OperationMissedThreshold events to an SNS topic, and run an S3 Batch Replication job for the existing objects.
    - id: d
      text:
        en: |-
          Protect the bucket with an AWS Backup plan that takes hourly backups, and add a copy action to the backup rule that targets a vault in us-west-2.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      S3 Replication Time Control replicates most objects in seconds and 99.9% of them within 15 minutes, and it turns on replication metrics and the OperationMissedThreshold event, which notifies the owner when an object is not replicated within 15 minutes. Live replication handles only new objects, so a one-time S3 Batch Replication job copies the objects that existed before the rule.
  options:
    a:
      en: |-
        Without Replication Time Control there is no 15-minute replication target or missed-threshold event, and the comparison function is custom code that detects delays only once a day.
    b:
      en: |-
        A replication rule replicates only objects written after it is created; existing objects need an S3 Batch Replication job.
    d:
      en: |-
        Hourly backups and their copies cannot meet a 15-minute target, and the copies are recovery points that must be restored before the objects can be used in us-west-2.
references:
  - title: Meeting compliance requirements with S3 Replication Time Control - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-time-control.html
  - title: Replicating existing objects with Batch Replication - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-batch-replication-batch.html
