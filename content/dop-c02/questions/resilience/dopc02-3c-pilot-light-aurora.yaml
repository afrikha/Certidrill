id: dopc02-3c-pilot-light-aurora
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an e-commerce application in eu-west-1 on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer, with an Amazon Aurora MySQL database. For a Regional disaster, the company requires that no more than a few minutes of orders be lost, and it accepts an RTO of 2 hours. The data must therefore be replicated continuously to eu-central-1. The company does not want to pay for application servers in eu-central-1 until a disaster occurs, and it wants the lowest cost that meets the objectives.

    Which disaster recovery solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use AWS Backup to back up the Aurora cluster and the EC2 instances once a day with a copy to eu-central-1, and during a disaster deploy the whole stack and restore the backups there.
    - id: b
      text:
        en: |-
          Add an Aurora global database secondary cluster in eu-central-1, and keep AMIs and a CloudFormation stack there with the Auto Scaling group at zero capacity, ready to scale out after the database fails over.
    - id: c
      text:
        en: |-
          Add an Aurora global database secondary cluster in eu-central-1, and run the full stack there with the Auto Scaling group at two instances behind its own load balancer, ready to scale out.
    - id: d
      text:
        en: |-
          Run the full stack in both Regions at production capacity, and use Aurora global database write forwarding with Route 53 latency records so that both Regions serve orders.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      This is a pilot light: the data is replicated continuously by the Aurora global database, which keeps the RPO low, while the application servers in the recovery Region are switched off. During a disaster, the team fails over the database and scales out the Auto Scaling group from the prepared AMIs and template, which fits an RTO of hours at a lower cost than running servers.
  options:
    a:
      en: |-
        Daily backups allow up to a day of lost orders, which fails the requirement to lose no more than a few minutes of data.
    c:
      en: |-
        This is a warm standby: it meets the objectives but pays continuously for running application servers in eu-central-1, which the company wants to avoid.
    d:
      en: |-
        Multi-site active/active runs full capacity in both Regions, which is the most expensive strategy and far exceeds a 2-hour RTO.
references:
  - title: "Disaster recovery options in the cloud - Disaster Recovery of Workloads on AWS: Recovery in the Cloud"
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
