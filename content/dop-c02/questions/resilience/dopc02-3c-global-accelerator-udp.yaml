id: dopc02-3c-global-accelerator-udp
objective: "3.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a multiplayer game backend on Amazon EC2 instances behind Network Load Balancers in three AWS Regions. The game client uses a custom protocol over UDP. Many players connect from corporate networks whose firewalls allow outbound traffic only to an approved list of IP addresses, so the company must publish a small set of static IP addresses that does not change when the company adds Regions. Player traffic must enter the AWS network at a location close to the player. When the endpoints in one Region become unhealthy, new connections must be sent to healthy Regions automatically.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon CloudFront distribution with the three Network Load Balancers as origins in an origin group, and publish the CloudFront IP address ranges to the players.
    - id: b
      text:
        en: |-
          Assign Elastic IP addresses to the Network Load Balancers, create Route 53 latency records with health checks for them, and publish all the Elastic IP addresses to the players.
    - id: c
      text:
        en: |-
          Replace the Network Load Balancers with Application Load Balancers, and add the three Application Load Balancers as endpoints of a standard accelerator in AWS Global Accelerator.
    - id: d
      text:
        en: |-
          Create a standard accelerator in AWS Global Accelerator with a UDP listener and one endpoint group per Region that contains the Network Load Balancer, and publish the accelerator's static IP addresses.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A standard accelerator provides static anycast IP addresses that are advertised from the AWS edge network, so players enter the AWS network close to their location and the addresses stay the same when endpoint groups are added. Global Accelerator supports TCP and UDP listeners, checks the health of its endpoints, and directs new connections to healthy endpoints in other Regions.
  options:
    a:
      en: |-
        CloudFront serves HTTP and HTTPS traffic, not a custom UDP protocol, and its IP address ranges are large and change over time, so they cannot be used as a small fixed allow list.
    b:
      en: |-
        The list of Elastic IP addresses grows every time a Region is added, so the players' firewall allow lists would have to change, and traffic would cross the public internet to each Region instead of entering the AWS network at the edge.
    c:
      en: |-
        Application Load Balancers support only HTTP and HTTPS listeners, so they cannot receive the game's UDP traffic.
references:
  - title: How AWS Global Accelerator works - AWS Global Accelerator
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction-how-it-works.html
  - title: What is AWS Global Accelerator? - AWS Global Accelerator
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html
