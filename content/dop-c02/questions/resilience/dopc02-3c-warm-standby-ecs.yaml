id: dopc02-3c-warm-standby-ecs
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payments company runs an API as an Amazon ECS service on AWS Fargate behind an Application Load Balancer in us-east-1. The data is stored in an Amazon Aurora PostgreSQL global database with a secondary cluster in us-west-2. In us-west-2, the same ECS service and load balancer exist with a desired count of zero tasks. A recovery test showed that starting the tasks, warming caches, and validating the stack took longer than the business accepts. The new requirement is that the recovery Region must be able to serve requests immediately at reduced capacity when the primary Region fails, and then scale to full production capacity. The company wants the lowest cost that meets the requirement.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the desired count at zero in us-west-2, but replicate the container images to us-west-2 in advance so that the tasks start faster during a failover.
    - id: b
      text:
        en: |-
          Run the ECS service in us-west-2 at full production capacity, and send half of the traffic to each Region with Route 53 weighted records.
    - id: c
      text:
        en: |-
          Remove the ECS service from us-west-2, and recover by deploying the stack from AWS CloudFormation and restoring the latest AWS Backup copy of the database.
    - id: d
      text:
        en: |-
          Keep a small number of tasks running in us-west-2 with service auto scaling configured up to production capacity, and fail over the database and DNS during a disaster.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Changing the pilot light into a warm standby keeps a scaled-down but fully functional copy of the workload running, so the recovery Region can handle traffic immediately at reduced capacity. Service auto scaling then brings the service to production capacity, and only a few tasks run in us-west-2 during normal operation.
  options:
    a:
      en: |-
        With zero tasks, the stack is still a pilot light: it cannot process requests until tasks are started, warmed, and validated, which is the delay the test exposed.
    b:
      en: |-
        Running full production capacity in both Regions is a multi-site active/active design, which costs more than the requirement needs.
    c:
      en: |-
        Backup and restore has the longest recovery time of all strategies and cannot serve requests immediately after a failure.
references:
  - title: "Disaster recovery options in the cloud - Disaster Recovery of Workloads on AWS: Recovery in the Cloud"
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
