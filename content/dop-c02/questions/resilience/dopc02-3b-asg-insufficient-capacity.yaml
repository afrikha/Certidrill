id: dopc02-3b-asg-insufficient-capacity
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a stateless compute-intensive API on On-Demand Amazon EC2 instances in an Auto Scaling group across three Availability Zones. The launch template specifies a single instance type. During regional peaks, scale-out activities fail in one Availability Zone with InsufficientInstanceCapacity errors, and latency rises until capacity becomes available again. The application runs correctly on several current-generation instance types with similar vCPU and memory. The company does not want to pay for capacity that it does not use.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create On-Demand Capacity Reservations for the peak number of instances in each Availability Zone, and target them from the launch template.
    - id: b
      text:
        en: |-
          Remove the affected Availability Zone from the Auto Scaling group so that all scale-out activities go to the other two zones.
    - id: c
      text:
        en: |-
          Increase the maximum capacity of the Auto Scaling group so that scale-out activities request more instances when a launch fails.
    - id: d
      text:
        en: |-
          Add a mixed instances policy that lists several instance types with similar vCPU and memory, or uses attribute-based instance type selection.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A mixed instances group can launch any of several instance types, so when one instance type has no capacity in a zone, Auto Scaling can launch another qualifying type there. Attribute-based instance type selection lets the group choose any type that matches the vCPU and memory requirements, and On-Demand allocation strategies such as lowest price or prioritized decide the order.
  options:
    a:
      en: |-
        Capacity Reservations guarantee capacity but are billed whether or not instances run in them, which the company does not want.
    b:
      en: |-
        Removing a zone reduces availability, and the same single instance type can run out of capacity in the remaining zones.
    c:
      en: |-
        The maximum capacity is not the problem; launches fail because the only instance type has no capacity in that zone.
references:
  - title: Auto Scaling groups with multiple instance types and purchase options - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-mixed-instances-groups.html
  - title: Allocation strategies for multiple instance types - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/allocation-strategies.html
