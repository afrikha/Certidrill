id: dopc02-3a-alb-zonal-shift
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a single-Region application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer (ALB) in three Availability Zones, with the default cross-zone load balancing. During an incident, requests that pass through one Availability Zone show high latency and intermittent errors, but the targets in that zone still pass the ALB health checks. The other two zones have enough capacity to absorb all the traffic, and zonal shift is already enabled on the ALB. The on-call engineer needs a temporary mitigation that moves traffic away from the affected zone within minutes and can be reversed when the zone recovers.

    Which action will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Start a zonal shift in Amazon Application Recovery Controller (ARC) for the ALB away from the affected Availability Zone, with an expiration, and cancel it when the zone recovers.
    - id: b
      text:
        en: |-
          Turn off cross-zone load balancing in the target group so that the load balancer node in the affected zone sends requests only to the targets in its own zone.
    - id: c
      text:
        en: |-
          Put the instances of the affected Availability Zone in the Standby state in the Auto Scaling group, and return them to service when the zone recovers.
    - id: d
      text:
        en: |-
          Create a Route 53 failover record that points to the ALB, and invert its health check so that Route 53 treats the primary record as unhealthy.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A zonal shift moves traffic for a supported resource away from an impaired Availability Zone to the healthy zones of the same Region. For an ALB with cross-zone load balancing enabled, it blocks traffic to the targets in that zone and removes the zone's load balancer IP addresses from DNS. Each shift has an expiration of up to three days, and you can cancel it at any time to bring traffic back.
  options:
    b:
      en: |-
        Without cross-zone load balancing, the load balancer node in the affected zone keeps receiving its share of clients and sends them only to the impaired targets, which makes the problem worse.
    c:
      en: |-
        Standby removes the instances from the target group, but the load balancer node in the affected zone stays in DNS and keeps receiving requests through the impaired zone.
    d:
      en: |-
        The application runs in a single Region, so there is no secondary record to fail over to, and marking the only record unhealthy cannot move traffic to the other zones.
references:
  - title: "Zonal shift in ARC - Amazon Application Recovery Controller (ARC)"
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-shift.html
  - title: "Zonal shift for your Application Load Balancer - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/zonal-shift.html
