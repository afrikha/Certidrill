id: dopc02-3c-backup-restore-testing
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An auditor requires a financial company to prove every month that the AWS Backup recovery points of its Amazon RDS DB instances and Amazon EBS volumes can be restored, and to record how long each restore takes. Today an engineer restores a few recovery points manually, runs a validation script against them, and deletes the restored resources, which takes two days every month. The company wants to automate this process with the LEAST operational overhead. The restored resources must stay available long enough for the validation script to run and must then be deleted automatically.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Backup Audit Manager framework with the controls for backup frequency and retention, and send its monthly report to the auditor.
    - id: b
      text:
        en: |-
          Create an AWS Step Functions workflow, started every month, that calls the StartRestoreJob API for each resource, runs the script, and deletes the restored resources.
    - id: c
      text:
        en: |-
          Create an AWS Backup restore testing plan with a monthly schedule and one selection per resource type, with a retention period long enough for the validation script to run.
    - id: d
      text:
        en: |-
          Run monthly recovery drills in AWS Elastic Disaster Recovery for the DB instances and EBS volumes, and terminate the drill instances after the validation script runs.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS Backup restore testing runs restore jobs on a schedule for the selected resource types, records the duration of each restore job, and deletes the restored resources when the test completes. A retention period of 1 to 168 hours keeps the restored resources available for validation before AWS Backup deletes them.
  options:
    a:
      en: |-
        Backup Audit Manager checks backup settings, but frequency and retention controls do not restore any recovery point, so they do not prove that the backups can be restored.
    b:
      en: |-
        The workflow would work, but building and maintaining the restore, tracking, and cleanup logic is more overhead than the managed restore testing feature.
    d:
      en: |-
        Elastic Disaster Recovery replicates source servers; it does not restore AWS Backup recovery points of RDS DB instances or EBS volumes.
references:
  - title: Restore testing - AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/restore-testing.html
