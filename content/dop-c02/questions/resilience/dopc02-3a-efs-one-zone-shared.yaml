id: dopc02-3a-efs-one-zone-shared
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs a content management system on Amazon EC2 instances in an Auto Scaling group across three Availability Zones in us-east-1. The instances share uploaded files through an Amazon EFS One Zone file system in us-east-1a. When us-east-1a was impaired, the instances in the other two Availability Zones kept running but returned errors because they could not read the shared files. The company needs shared storage that stays available if any single Availability Zone fails, without changing how the application reads and writes files.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an EFS Regional file system with a mount target in each Availability Zone, copy the data to it, and mount it on each instance through the mount target in the instance's Availability Zone.
    - id: b
      text:
        en: |-
          Add mount targets in us-east-1b and us-east-1c to the existing One Zone file system, and update each instance to mount the target in its own Availability Zone.
    - id: c
      text:
        en: |-
          Configure EFS replication from the One Zone file system to a new One Zone file system in us-east-1b, and remount the instances on the replica when us-east-1a fails.
    - id: d
      text:
        en: |-
          Replace the file system with an Amazon EBS io2 volume that has Multi-Attach enabled, and attach the volume to every instance in the Auto Scaling group.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      EFS Regional file systems store data redundantly across multiple Availability Zones and keep serving data when one or more zones are unavailable. You can create one mount target in each Availability Zone, so instances in the surviving zones keep using their local mount target. The application still uses the same NFS file system interface.
  options:
    b:
      en: |-
        A One Zone file system can have only a single mount target, and its data is stored in one Availability Zone, so it stays a single point of failure.
    c:
      en: |-
        The replica is not writable until its replication configuration is deleted, the failover is a manual step, and replication can lag behind the source (an RPO of 15 minutes for most file systems), so it does not give continuous availability.
    d:
      en: |-
        An EBS volume lives in a single Availability Zone and can be attached only to instances in that zone, so it keeps the dependency on one zone and cannot serve instances in the other two.
references:
  - title: "Features of Amazon EFS - Amazon Elastic File System"
    url: https://docs.aws.amazon.com/efs/latest/ug/features.html
  - title: "How Amazon EFS works - Amazon Elastic File System"
    url: https://docs.aws.amazon.com/efs/latest/ug/how-it-works.html
