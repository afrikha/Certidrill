id: dopc02-3c-asg-elb-health-check
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in an Auto Scaling group across three Availability Zones behind an Application Load Balancer. Sometimes the application process on an instance stops responding. The load balancer then marks the target as unhealthy and stops routing requests to it, but the instance stays in the Auto Scaling group for hours, and the application runs with reduced capacity. The EC2 status checks of these instances keep passing. The company wants such instances to be replaced automatically.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the unhealthy threshold count of the target group health check to 10 so that the load balancer keeps sending requests to the instance until it recovers.
    - id: b
      text:
        en: |-
          Add a target tracking scaling policy on average CPU utilization so that the Auto Scaling group launches more instances when capacity is reduced.
    - id: c
      text:
        en: |-
          Turn on Elastic Load Balancing health checks for the Auto Scaling group, and set a health check grace period that covers the startup time of the application.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on the UnHealthyHostCount metric of the target group with the EC2 reboot action so that the unhealthy instance restarts.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      By default, an Auto Scaling group replaces only instances that fail the EC2 status checks. With Elastic Load Balancing health checks turned on, the group also replaces an instance that the load balancer reports as unhealthy, and the grace period prevents new instances from being replaced while they are still starting.
  options:
    a:
      en: |-
        A higher threshold only delays the detection of the failed target and sends more requests to a process that does not respond; the instance is still never replaced.
    b:
      en: |-
        A CPU-based policy does not detect the hung process, and the unhealthy instance stays in the group and keeps counting toward its capacity.
    d:
      en: |-
        UnHealthyHostCount is a target group metric without an instance dimension, so an alarm on it cannot reboot a specific instance, and a reboot does not replace the instance.
references:
  - title: Attach an Elastic Load Balancing load balancer to your Auto Scaling group - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-add-elb-healthcheck.html
  - title: Set the health check grace period for an Auto Scaling group - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/health-check-grace-period.html
