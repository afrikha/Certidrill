id: dopc02-3c-rto-rpo-definitions
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company is documenting the recovery objectives of its claims application before a DevOps team designs the disaster recovery solution. The business states that after a disaster, the application must be serving users again no later than 4 hours after the interruption begins. The business also states that it can accept losing, at most, the claims that were entered during the last 15 minutes before the interruption.

    Which statement correctly describes these objectives?
body:
  options:
    - id: a
      text:
        en: |-
          The recovery time objective (RTO) is 15 minutes, and the recovery point objective (RPO) is 4 hours, because the RPO limits how long the service can be unavailable.
    - id: b
      text:
        en: |-
          The RTO and the RPO are both 4 hours, because the RPO is measured from the time that the service is restored.
    - id: c
      text:
        en: |-
          The RTO is 4 hours, measured forward from the interruption, and the RPO is 15 minutes, measured back from the interruption to the last recovery point.
    - id: d
      text:
        en: |-
          The RPO is 15 minutes, and the RTO is 4 hours and 15 minutes, because the RTO includes the RPO.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The RTO is the maximum acceptable delay between the interruption of service and the restoration of service, here 4 hours. The RPO is the maximum acceptable amount of time since the last data recovery point, which defines the acceptable data loss, here 15 minutes of claims.
  options:
    a:
      en: |-
        This option swaps the two objectives: the time allowed to restore service is the RTO, and the window of data that can be lost is the RPO.
    b:
      en: |-
        The RPO is measured backward from the interruption to the last recovery point, not from the restoration of service, so it is 15 minutes, not 4 hours.
    d:
      en: |-
        The two objectives are independent: the RTO is measured from the interruption to the restoration of service and does not add the RPO.
references:
  - title: "Business Continuity Plan (BCP) - Disaster Recovery of Workloads on AWS: Recovery in the Cloud"
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/business-continuity-plan-bcp.html
