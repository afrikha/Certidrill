id: dopc02-3c-aurora-write-forwarding
objective: "3.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company runs its booking application in us-east-1, eu-west-1, and ap-southeast-2. The data is stored in an Amazon Aurora PostgreSQL global database whose primary cluster is in us-east-1, with secondary clusters in the two other Regions. About 95% of the database statements are reads, but users occasionally update their preferences from every Region. Today the application in each secondary Region opens a second database connection to the writer in us-east-1 and sends its writes there, and this split logic causes frequent bugs. The company wants the application in each Region to send both reads and writes to its local cluster only. The company does not want to move the primary Region or change the database engine.

    Which solution will meet these requirements with the LEAST application change?
body:
  options:
    - id: a
      text:
        en: |-
          Detach the two secondary clusters from the global database so that each becomes a standalone writer, and replicate changes between the three clusters with PostgreSQL logical replication.
    - id: b
      text:
        en: |-
          Turn on write forwarding for the secondary clusters, and point the application in each Region to its local cluster endpoint so that Aurora forwards write statements to the primary cluster.
    - id: c
      text:
        en: |-
          Create an Amazon RDS Proxy in each secondary Region that targets the writer of the primary cluster, and point the application in each Region to its local proxy for reads and writes.
    - id: d
      text:
        en: |-
          Migrate the preference data to Amazon DynamoDB global tables, and rewrite the data access layer so that every Region reads and writes its local replica.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With write forwarding, an application connected to a secondary cluster can run write statements; the secondary cluster forwards them to the primary cluster, which applies them and replicates the changes to every secondary cluster. Aurora handles the cross-Region connection and the session context, so the application uses a single local endpoint and no longer needs its own logic to route writes to us-east-1.
  options:
    a:
      en: |-
        Three independent writers with logical replication create a multi-writer topology with conflict and loop handling that the team must build and operate, and it gives up the managed global database.
    c:
      en: |-
        An RDS Proxy is created in the same Region as the database that it targets, and even if writes could reach us-east-1 through it, reads would no longer be served by the local cluster.
    d:
      en: |-
        Moving the data to DynamoDB changes the database engine and requires rewriting the data access layer, which is the largest application change of all the options.
references:
  - title: Using write forwarding in an Amazon Aurora global database - Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-write-forwarding.html
