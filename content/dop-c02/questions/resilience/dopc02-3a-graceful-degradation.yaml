id: dopc02-3a-graceful-degradation
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer's product page calls an internal recommendation service before it renders. When the recommendation service is slow, product pages time out, and the business loses sales. The business states that recommendations are optional: the product page and the checkout must keep working, possibly with generic or no recommendations, whenever the recommendation service is impaired. The DevOps team must translate this statement into a design change.

    Which change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Triple the capacity of the recommendation service and deploy it across three Availability Zones so that it is less likely to be slow.
    - id: b
      text:
        en: |-
          Increase the timeout of the call to the recommendation service and add five immediate retries so that more requests eventually succeed.
    - id: c
      text:
        en: |-
          Deploy a second copy of the recommendation service in another Region, and use Route 53 failover records to switch to it when it is slow.
    - id: d
      text:
        en: |-
          Make the recommendation call a soft dependency: use a short timeout, return a cached or default list when it fails, and add a circuit breaker.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The business requirement means that the recommendation service must stop being a hard dependency of the product page. With graceful degradation, the page keeps its core function when the dependency fails, by serving cached, alternate, or no data. A short timeout bounds the delay, and a circuit breaker stops sending requests to an overloaded service while it recovers.
  options:
    a:
      en: |-
        More capacity lowers the probability of slowness, but the page still fails whenever the service is impaired because it remains a hard dependency.
    b:
      en: |-
        Longer timeouts make the pages slower, and immediate retries add load to an already overloaded service, which can make the outage worse.
    c:
      en: |-
        A second Region adds cost and complexity, and the page still depends on a recommendation service being available, so a slow response still breaks the page.
references:
  - title: "REL05-BP01 Implement graceful degradation to transform applicable hard dependencies into soft dependencies - Reliability Pillar"
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_graceful_degradation.html
