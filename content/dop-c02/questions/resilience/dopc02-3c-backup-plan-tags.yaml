id: dopc02-3c-backup-plan-tags
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has hundreds of Amazon EBS volumes, Amazon EFS file systems, and Amazon RDS DB instances in one AWS account, and teams create new resources every week. Every resource that has the tag backup=daily must be backed up every day, and each backup must be kept for 35 days. Resources that teams create later with this tag must be protected without any manual step.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Backup plan with a daily backup rule and a retention of 35 days, and assign resources to the plan with a selection on the tag backup=daily.
    - id: b
      text:
        en: |-
          Create an Amazon Data Lifecycle Manager policy that targets the tag backup=daily, creates snapshots every day, and keeps each snapshot for 35 days.
    - id: c
      text:
        en: |-
          Create an EventBridge Scheduler schedule that runs a Lambda function every day to back up each tagged resource and delete the backups that are older than 35 days.
    - id: d
      text:
        en: |-
          Create an AWS Backup plan with a daily backup rule and a retention of 35 days, and add the ARN of each tagged resource to the plan's resource assignment.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An AWS Backup plan defines the schedule and the retention of the backups, and a resource assignment can select resources by tag across supported services such as EBS, EFS, and RDS. Resources that receive the tag later are included in the next backups without any manual step.
  options:
    b:
      en: |-
        Data Lifecycle Manager manages EBS snapshots and EBS-backed AMIs only, so it would not protect the EFS file systems or the RDS DB instances.
    c:
      en: |-
        A custom function would work, but writing and maintaining backup and deletion code is more operational overhead than a managed backup plan.
    d:
      en: |-
        Listing resource ARNs requires someone to update the assignment every time a team creates a resource, which is the manual step the company wants to avoid.
references:
  - title: Select AWS services to backup - AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/assigning-resources.html
