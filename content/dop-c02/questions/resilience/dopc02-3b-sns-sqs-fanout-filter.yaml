id: dopc02-3b-sns-sqs-fanout-filter
objective: "3.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's checkout application emits an order event for every purchase. Three teams consume these events: billing, shipping, and fraud analysis. Each team must receive its own copy of every relevant event and must be able to stop its consumers for several hours for maintenance without losing events. The fraud team wants to receive only orders with an attribute named risk set to high. The checkout application must publish each event only once and must not know which teams consume it.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Have the checkout application send each event to a single Amazon SQS queue that the three teams poll with their own consumers.
    - id: b
      text:
        en: |-
          Have the checkout application publish each event to an Amazon SNS topic, with the risk value as a message attribute.
    - id: c
      text:
        en: |-
          Subscribe one Amazon SQS queue per team to the topic, and add a filter policy on the fraud team's subscription that matches risk set to high.
    - id: d
      text:
        en: |-
          Subscribe an HTTPS endpoint of each team's consumer service directly to the topic, and add a filter policy on the fraud team's subscription.
    - id: e
      text:
        en: |-
          Have the checkout application call an AWS Lambda function for each team, and let each function filter and store the events it needs.
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      Publishing once to an SNS topic and subscribing one SQS queue per team is the fanout pattern: each queue receives its own copy, and messages persist in the queue while a team's consumers are stopped. A subscription filter policy on the message attribute lets the fraud team's queue receive only high-risk orders without any change to the publisher.
  options:
    a:
      en: |-
        Consumers of a single queue compete for messages, so each event is processed by only one team instead of all three.
    d:
      en: |-
        A push to an HTTPS endpoint fails while the team's service is stopped, and events are lost once the delivery retries are exhausted, so maintenance of several hours is not covered.
    e:
      en: |-
        The checkout application would have to know every consumer and call each one, which couples the publisher to the teams and publishes the event several times.
references:
  - title: Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing - Amazon Simple Notification Service
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
  - title: REL04-BP02 Implement loosely coupled dependencies - Reliability Pillar
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_prevent_interaction_failure_loosely_coupled_system.html
