id: dopc02-3a-composite-availability
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company calculates the designed availability of a two-tier workload before it signs a customer SLA. The web tier runs two independent copies of the application, one in each of two Availability Zones, behind a load balancer whose own availability is ignored for this exercise. Each copy is designed for 99.9% availability, and either copy can serve all traffic alone. Every request also needs the database, which is a hard dependency designed for 99.95% availability.

    What is the designed availability of the workload?
body:
  options:
    - id: a
      text:
        en: |-
          About 99.75%, because the two web copies and the database act as three components in series.
    - id: b
      text:
        en: |-
          About 99.9999%, because the redundant web tier determines the availability of the whole workload.
    - id: c
      text:
        en: |-
          About 99.95%, because the redundant web tier reaches about 99.9999% and the database then caps the result.
    - id: d
      text:
        en: |-
          About 99.9%, because the workload cannot be more available than one copy of its web tier.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Independent redundant components give 100% minus the product of their failure rates: 100% − (0.1% × 0.1%) = 99.9999% for the web tier. The database is a hard dependency, so its availability multiplies in: 99.9999% × 99.95% is about 99.95%. The database now limits the workload, so it is the component to improve if the company needs a higher target.
  options:
    a:
      en: |-
        Multiplying the two web copies treats them as if both were required; because either copy can serve all traffic, they are redundant, not serial.
    b:
      en: |-
        The redundant web tier reaches about 99.9999%, but the database is still a hard dependency whose 99.95% multiplies in.
    d:
      en: |-
        Redundancy raises availability above that of a single copy; the single-copy figure would apply only if one copy had to carry all traffic with no alternative.
references:
  - title: "Availability - Reliability Pillar"
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html
