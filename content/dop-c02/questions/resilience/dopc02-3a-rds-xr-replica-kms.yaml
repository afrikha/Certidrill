id: dopc02-3a-rds-xr-replica-kms
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for PostgreSQL DB instance in us-east-1 that is encrypted with a customer managed AWS KMS key in us-east-1. Analysts in Europe need low-latency, read-only access to the data in eu-west-1. The company also wants the same copy to serve as a DR database that it can promote if us-east-1 fails. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on cross-Region automated backup replication to eu-west-1, and restore a new DB instance from the replicated backups for the analysts every morning.
    - id: b
      text:
        en: |-
          Create a cross-Region read replica in eu-west-1, and specify the ARN of the us-east-1 customer managed key to encrypt the replica.
    - id: c
      text:
        en: |-
          Create an AWS DMS task with a full load and ongoing replication from the DB instance to a new RDS for PostgreSQL DB instance in eu-west-1.
    - id: d
      text:
        en: |-
          Create a cross-Region read replica in eu-west-1, specify a KMS key in eu-west-1 to encrypt it, and promote the replica if us-east-1 fails.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A cross-Region read replica serves reads closer to users and improves disaster recovery, and you can promote it to a standalone DB instance. To create an encrypted replica in another Region, the source must be encrypted and you choose a KMS key in the destination Region. For PostgreSQL, the replica is not promoted automatically, so promotion is a runbook step.
  options:
    a:
      en: |-
        A daily restore gives analysts data that is up to a day old and adds a recurring rebuild, which is more overhead than a continuously replicated replica.
    b:
      en: |-
        KMS keys are Regional: the replica in eu-west-1 must be encrypted with a key in eu-west-1, not with the source Region's key.
    c:
      en: |-
        AWS DMS works, but it adds a replication instance and tasks to manage, while RDS provides native cross-Region replicas.
references:
  - title: "Creating a read replica in a different AWS Region - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.XRgn.html
  - title: "Promoting a read replica to be a standalone DB instance - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.Promote.html
