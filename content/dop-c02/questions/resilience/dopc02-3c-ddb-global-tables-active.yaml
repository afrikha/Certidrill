id: dopc02-3c-ddb-global-tables-active
objective: "3.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs a player-profile service on AWS Lambda behind Amazon API Gateway in us-east-1. The profiles are stored in an Amazon DynamoDB table in on-demand capacity mode. The company is deploying the same serverless stack in eu-west-1 and ap-northeast-1 so that players connect to the closest Region. Players must be able to update their profiles from any Region with low, local write latency, and an outage of one Region must not stop writes in the other Regions. The application already tolerates eventually consistent reads across Regions. The company does not want to write or operate custom replication code.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the single table in us-east-1, and configure the Lambda functions in eu-west-1 and ap-northeast-1 to read and write the table through its us-east-1 Regional endpoint.
    - id: b
      text:
        en: |-
          Create a table in each Region, enable DynamoDB Streams on each table, and deploy Lambda functions that read each stream and write the changes to the tables in the other two Regions.
    - id: c
      text:
        en: |-
          Convert the table to a global table that uses multi-Region eventual consistency, add replicas in eu-west-1 and ap-northeast-1, and point each Regional stack to its local replica.
    - id: d
      text:
        en: |-
          Create a table in each Region, and use AWS Backup to copy hourly backups of the us-east-1 table to the other Regions and restore them into the local tables.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A DynamoDB global table replicates data automatically between its replicas, and any replica can serve reads and writes, so each Regional stack writes locally and keeps working if another Region fails. Multi-Region eventual consistency replicates asynchronously with last-writer-wins conflict resolution, which matches an application that tolerates eventually consistent reads, and the existing DynamoDB APIs work without application changes.
  options:
    a:
      en: |-
        Every write from Europe and Asia would cross Regions to us-east-1, which fails the local write latency requirement, and an outage of us-east-1 would stop writes everywhere.
    b:
      en: |-
        Stream-based replication with Lambda functions is exactly the custom replication code that the company wants to avoid, and the team would also have to handle conflicts and replication loops itself.
    d:
      en: |-
        Restoring backups creates new tables and copies data only from one Region, so writes made in the other Regions would be lost and the data would be up to an hour old.
references:
  - title: Global tables - multi-active, multi-Region replication - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html
