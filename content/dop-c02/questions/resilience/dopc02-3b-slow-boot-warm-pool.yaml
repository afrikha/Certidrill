id: dopc02-3b-slow-boot-warm-pool
objective: "3.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A gaming company runs matchmaking servers on On-Demand Amazon EC2 instances in an Auto Scaling group. Each new instance runs a user data script that installs packages and downloads 20 GB of game assets, which takes about 15 minutes before the instance can serve players. Traffic spikes are unpredictable and last 20 to 30 minutes, so most new capacity arrives too late. The company does not want to keep extra running instances in the group to absorb spikes. The company wants to reduce the time between a scale-out decision and an instance serving traffic.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Increase the health check grace period of the group to 20 minutes so that new instances are not replaced before the script finishes.
    - id: b
      text:
        en: |-
          Build a custom AMI that already contains the packages and game assets with EC2 Image Builder, and use it in the launch template.
    - id: c
      text:
        en: |-
          Replace the dynamic scaling policy with scheduled actions that raise capacity at the times of the largest spikes of the previous week.
    - id: d
      text:
        en: |-
          Add a warm pool of stopped instances to the group, with a lifecycle hook that keeps each instance from being stopped until its initialization completes.
    - id: e
      text:
        en: |-
          Set a default instance warmup of 15 minutes on the group so that scaling policies account for the initialization time of new instances.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Baking packages and assets into the AMI removes most of the work from the boot path. A warm pool keeps pre-initialized instances stopped beside the group, where only their EBS volumes and Elastic IP addresses are billed, and scale-out draws from them, which cuts latency for applications with long boot times. A lifecycle hook makes sure an instance finishes initializing before it is stopped in the pool.
  options:
    a:
      en: |-
        The grace period only delays health checks; the instance still needs 15 minutes before it can serve players.
    c:
      en: |-
        The spikes are unpredictable, so scheduled actions based on last week would miss them and add capacity when it is not needed.
    e:
      en: |-
        The warmup only keeps new instances out of the aggregated metrics; it does not make them ready sooner.
references:
  - title: Decrease latency for applications with long boot times using warm pools - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-warm-pools.html
