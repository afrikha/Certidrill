id: dopc02-3a-identify-spofs
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A DevOps engineer reviews the following components of an application in one AWS Region before a launch:

    - An Application Load Balancer with subnets in three Availability Zones.
    - An EC2 Auto Scaling group across the same three zones, with Elastic Load Balancing health checks turned on.
    - An ElastiCache for Valkey replication group with a primary node and one replica in different zones, with Multi-AZ turned on.
    - An RDS for PostgreSQL Single-AZ DB instance with a read replica in another Availability Zone.
    - A standalone EC2 instance in one zone that runs the hourly billing jobs from cron.
    - An Amazon EFS Regional file system with a mount target in each Availability Zone.

    Which two components are single points of failure that need manual action to recover from the loss of one Availability Zone? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The Application Load Balancer
    - id: b
      text:
        en: |-
          The RDS for PostgreSQL DB instance and its read replica
    - id: c
      text:
        en: |-
          The ElastiCache for Valkey replication group
    - id: d
      text:
        en: |-
          The standalone EC2 instance that runs the billing jobs
    - id: e
      text:
        en: |-
          The EFS file system
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      A read replica does not take over automatically: someone must promote it, which stops replication and turns it into a standalone DB instance, and the applications must then be pointed at it. The standalone billing instance has nothing to replace it in another zone, so the jobs stop until someone rebuilds it. Both need manual action after the loss of their zone.
  options:
    a:
      en: |-
        The load balancer has a node in each enabled Availability Zone and keeps routing through the healthy zones.
    c:
      en: |-
        With Multi-AZ and a replica in another zone, ElastiCache promotes the replica automatically and keeps the primary endpoint.
    e:
      en: |-
        A Regional file system stores data across multiple Availability Zones and stays available through the mount targets of the other zones.
references:
  - title: "Promoting a read replica to be a standalone DB instance - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.Promote.html
  - title: "Minimizing downtime in ElastiCache by using Multi-AZ with Valkey and Redis OSS - Amazon ElastiCache"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/AutoFailover.html
