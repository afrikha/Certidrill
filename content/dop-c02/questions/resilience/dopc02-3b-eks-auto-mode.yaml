id: dopc02-3b-eks-auto-mode
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company is moving 40 microservices from an on-premises Kubernetes cluster to AWS. The services are packaged as Helm charts and must keep using the Kubernetes API. Several services rely on DaemonSets for log collection. The company wants AWS to provision and scale worker nodes, patch their operating system, and provision load balancers for Kubernetes Services and Ingress resources. The DevOps team does not want to install or upgrade a node autoscaler or a load balancer controller.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EKS cluster with EKS Auto Mode enabled, and deploy the Helm charts to the cluster.
    - id: b
      text:
        en: |-
          Create an Amazon EKS cluster with managed node groups, and install Cluster Autoscaler and the AWS Load Balancer Controller with Helm.
    - id: c
      text:
        en: |-
          Create an Amazon EKS cluster that runs all pods on AWS Fargate profiles, and deploy the Helm charts to the cluster.
    - id: d
      text:
        en: |-
          Convert the Helm charts to Amazon ECS task definitions, and run the services on AWS Fargate behind an Application Load Balancer.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      EKS Auto Mode manages node provisioning and autoscaling (with Karpenter), node OS patching and lifecycle, load balancer provisioning for Services and Ingress, storage and networking components. The workloads keep the standard Kubernetes API, and DaemonSets run on the managed nodes.
  options:
    b:
      en: |-
        Managed node groups work, but the team would install, configure and upgrade Cluster Autoscaler and the load balancer controller, which it wants to avoid.
    c:
      en: |-
        EKS pods on Fargate do not support DaemonSets, so the log collection services would not run.
    d:
      en: |-
        Amazon ECS does not expose the Kubernetes API, so the Helm charts and Kubernetes manifests could not be used.
references:
  - title: Automate cluster infrastructure with EKS Auto Mode - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/automode.html
  - title: Simplify compute management with AWS Fargate - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/fargate.html
