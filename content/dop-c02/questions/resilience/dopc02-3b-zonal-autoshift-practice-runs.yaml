id: dopc02-3b-zonal-autoshift-practice-runs
objective: "3.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company runs an order-tracking API on Amazon EC2 instances in an Auto Scaling group that spans three Availability Zones in one AWS Region. An Application Load Balancer distributes traffic to the instances. During a recent partial impairment of one Availability Zone, the instances in that zone kept passing health checks but responded slowly, and the operations team needed 40 minutes to notice the problem and move traffic manually. The company wants AWS to move traffic away from an impaired Availability Zone automatically, without building its own detection logic. The application must still handle peak traffic while one Availability Zone is out of service, and the company wants to validate regularly that the shift works.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on per-zone target response time for each Availability Zone, and invoke a Lambda function from the alarm that deregisters the instances of that zone from the target group.
    - id: b
      text:
        en: |-
          Enable zonal autoshift for the load balancer in Amazon Application Recovery Controller (ARC) without configuring practice runs, and let the Auto Scaling group scale out in the remaining zones after the shift starts.
    - id: c
      text:
        en: |-
          Configure ARC practice runs and enable zonal autoshift for the load balancer, and set the Auto Scaling group minimum capacity so that two Availability Zones can serve peak traffic.
    - id: d
      text:
        en: |-
          Create a Route 53 health check for each Availability Zone's load balancer node IP address, and configure failover routing records that remove the node of an unhealthy zone from DNS answers.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Zonal autoshift lets AWS start a zonal shift on the customer's behalf when its own telemetry detects an Availability Zone impairment, so no custom detection is needed, and Application Load Balancers are a supported resource. Practice runs are required to enable zonal autoshift and give the regular validation the company wants. AWS recommends pre-scaling capacity in all zones because autoshifts and practice runs do not wait for auto scaling, so the minimum capacity must cover peak traffic with one zone lost.
  options:
    a:
      en: |-
        This is custom detection and remediation code that the company must build and maintain, and it does not provide regular validation of the shift.
    b:
      en: |-
        Zonal autoshift cannot be enabled without practice runs. Relying on scale-out after the shift also leaves the application under-provisioned, because an autoshift does not wait for auto scaling.
    d:
      en: |-
        The company does not control per-zone DNS records for an Application Load Balancer, and slow but healthy instances would not fail such a health check. This is also a custom design instead of the managed zonal shift capability.
references:
  - title: Zonal autoshift in ARC - Amazon Application Recovery Controller (ARC)
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-autoshift.html
  - title: Supported resources - Amazon Application Recovery Controller (ARC)
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-shift.resource-types.html
