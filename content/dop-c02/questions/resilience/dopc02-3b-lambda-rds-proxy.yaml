id: dopc02-3b-lambda-rds-proxy
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a serverless API with Amazon API Gateway and AWS Lambda. The Lambda functions query an Amazon RDS for MySQL database. During traffic spikes, Lambda scales to hundreds of concurrent executions, each function opens its own database connection, and the database returns "too many connections" errors. The company wants to fix the errors without changing the database instance class and with minimal code changes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the max_connections parameter in the DB parameter group to the account concurrency quota of Lambda.
    - id: b
      text:
        en: |-
          Add an RDS read replica and send half of the Lambda functions' queries to the replica endpoint.
    - id: c
      text:
        en: |-
          Set provisioned concurrency on the functions so that execution environments are reused between invocations.
    - id: d
      text:
        en: |-
          Create an Amazon RDS Proxy for the database, and change the functions to connect to the proxy endpoint.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      RDS Proxy keeps a pool of database connections and reuses them for many client connections, and it can cap the number of connections it opens to protect the database from surges. The functions only need to point to the proxy endpoint, and the proxy can use Secrets Manager credentials or IAM authentication.
  options:
    a:
      en: |-
        Connections consume memory on the database, so raising the limit to the Lambda concurrency level can exhaust the current instance class instead of fixing the surge.
    b:
      en: |-
        A replica only spreads read traffic; every function still opens its own connection, and writes still go to the primary.
    c:
      en: |-
        Provisioned concurrency reduces cold starts but still allows hundreds of concurrent environments, each with its own connection.
references:
  - title: Amazon RDS Proxy - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html
