id: dopc02-3b-fargate-spot-strategy
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a stateless image-resizing service as an Amazon ECS service on AWS Fargate with a desired count that varies between 6 and 40 tasks. The containers handle SIGTERM and finish their work within 60 seconds. To reduce cost, the company wants to use Fargate Spot. At least two tasks must always run on Fargate On-Demand capacity. Above those two tasks, the company wants one task on Fargate for every three tasks on Fargate Spot.

    Which capacity provider strategy will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          FARGATE_SPOT with a base of 2 and a weight of 3, and FARGATE with a weight of 1.
    - id: b
      text:
        en: |-
          FARGATE with a base of 2 and a weight of 1, and FARGATE_SPOT with a weight of 3.
    - id: c
      text:
        en: |-
          FARGATE with a base of 2 and a weight of 3, and FARGATE_SPOT with a weight of 1.
    - id: d
      text:
        en: |-
          FARGATE with a base of 2 and a weight of 1, and FARGATE_SPOT with a base of 4 and a weight of 3.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The base is the minimum number of tasks placed on one capacity provider before the weights apply, so a base of 2 on FARGATE keeps two On-Demand tasks. The remaining tasks are split by the relative weights, so weights of 1 for FARGATE and 3 for FARGATE_SPOT place one On-Demand task for every three Spot tasks. Spot tasks receive a two-minute warning through SIGTERM and an EventBridge event before interruption.
  options:
    a:
      en: |-
        The base is on FARGATE_SPOT, so the two guaranteed tasks would run on Spot capacity that can be interrupted.
    c:
      en: |-
        The weights are reversed: this places three On-Demand tasks for every Spot task.
    d:
      en: |-
        Only one capacity provider in a strategy can have a base value, so this strategy is not valid.
references:
  - title: Amazon ECS clusters for Fargate - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-capacity-providers.html
