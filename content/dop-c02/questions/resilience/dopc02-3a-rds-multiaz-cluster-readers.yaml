id: dopc02-3a-rds-multiaz-cluster-readers
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs its order database on Amazon RDS for PostgreSQL as a Single-AZ DB instance. A nightly reporting job runs heavy read-only queries against the same DB instance and slows down order processing. The company needs automatic failover to another Availability Zone if the writer's Availability Zone fails. The reporting job must run on the standby capacity that already exists for high availability, not on additional read replicas that the team must create and manage.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Modify the DB instance to a Multi-AZ DB instance deployment, and point the reporting job at the standby DB instance in the second Availability Zone.
    - id: b
      text:
        en: |-
          Create a read replica in another Availability Zone for the reporting job, and use an EventBridge rule with a Lambda function to promote the replica if the primary fails.
    - id: c
      text:
        en: |-
          Move the database to an RDS for PostgreSQL Multi-AZ DB cluster deployment, and point the reporting job at the reader endpoint of the DB cluster.
    - id: d
      text:
        en: |-
          Create a cross-Region read replica for the reporting job, and promote it to a standalone DB instance if the primary Availability Zone fails.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Multi-AZ DB cluster has one writer and two reader DB instances in three Availability Zones, kept in sync with semisynchronous replication. The readers serve read traffic and one of them is promoted automatically if the writer fails, so the reporting job runs on the high availability standbys through the reader endpoint. The cluster also offers lower write latency than a Multi-AZ DB instance deployment.
  options:
    a:
      en: |-
        The standby of a Multi-AZ DB instance deployment cannot serve read traffic; AWS directs read-only workloads to a Multi-AZ DB cluster or to a read replica instead.
    b:
      en: |-
        This adds a read replica that the team must manage, and promotion stops replication and turns the replica into a standalone instance through custom automation instead of a managed automatic failover.
    d:
      en: |-
        A cross-Region read replica is another resource to manage, it replicates asynchronously, and promoting it is a disaster recovery action, not an automatic failover inside the Region.
references:
  - title: "Multi-AZ DB cluster deployments for Amazon RDS - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html
  - title: "Multi-AZ DB instance deployments for Amazon RDS - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
