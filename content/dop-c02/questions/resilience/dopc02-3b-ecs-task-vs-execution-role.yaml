id: dopc02-3b-ecs-task-vs-execution-role
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is moving an order-export application to Amazon ECS on AWS Fargate. The container image is in a private Amazon ECR repository in the same account, and the task definition uses the awslogs log driver. The task definition injects a database password from AWS Secrets Manager as an environment variable through the secrets parameter. The application code uploads export files to an Amazon S3 bucket with the AWS SDK. The security team requires least privilege and separation between the permissions that ECS uses and the permissions of the application code.

    Which combination of IAM configurations will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Attach an instance profile with s3:PutObject on the bucket to the Fargate hosts that run the tasks.
    - id: b
      text:
        en: |-
          Grant ECR pull, CloudWatch Logs and secretsmanager:GetSecretValue permissions to the task role, and do not define a task execution role.
    - id: c
      text:
        en: |-
          Define a task execution role with the AmazonECSTaskExecutionRolePolicy managed policy and secretsmanager:GetSecretValue on the secret.
    - id: d
      text:
        en: |-
          Define a task role with s3:PutObject on the export bucket, and let the AWS SDK in the container use the task role credentials.
    - id: e
      text:
        en: |-
          Add s3:PutObject on the export bucket to the task execution role so that the application can upload the files with the SDK.
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |-
      The task execution role is used by the ECS and Fargate agents to pull private ECR images, send logs with awslogs, and fetch secrets referenced in the task definition, so it needs the managed execution policy plus GetSecretValue on the secret. The task role provides the credentials that the application code uses, so the S3 permission belongs there.
  options:
    a:
      en: |-
        Fargate does not expose its hosts, so there is no instance profile to attach; application permissions come from the task role.
    b:
      en: |-
        Pulling the image, sending logs and injecting secrets are done by the agent with the task execution role, not with the task role, so the task would fail to start.
    e:
      en: |-
        The execution role credentials are given to the agent and are not accessible to the containers, and mixing the permissions breaks the required separation.
references:
  - title: Amazon ECS task execution IAM role - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html
