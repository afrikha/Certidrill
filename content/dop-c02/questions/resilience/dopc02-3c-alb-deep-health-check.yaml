id: dopc02-3c-alb-deep-health-check
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An API runs as Amazon ECS tasks on AWS Fargate that are registered as ip targets in an Application Load Balancer target group. The target group health check requests /static/ping.html with the default interval of 30 seconds and the default unhealthy threshold of 2. When the worker thread pool of a task is exhausted, the task still serves the static file but returns 503 errors or times out for API calls, so the load balancer keeps routing requests to it. The developers added a /health endpoint that returns 200 only when the task's worker pool can accept work; the endpoint does not call any shared dependency. The company wants the load balancer to stop routing to such a task within about 30 seconds.

    Which health check configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the /static/ping.html path, and reduce the health check interval to 5 seconds and the unhealthy threshold to 2 so that failures are detected sooner.
    - id: b
      text:
        en: |-
          Change the health check path to /health, and set the health check interval to 10 seconds and the unhealthy threshold to 3.
    - id: c
      text:
        en: |-
          Change the health check path to /health, and raise the healthy threshold to 10 so that a task with an exhausted worker pool is detected faster.
    - id: d
      text:
        en: |-
          Keep the /static/ping.html path, and set the deregistration delay of the target group to 0 seconds so that failed tasks stop receiving requests immediately.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The health check must request an endpoint that fails when the task cannot process API calls, and the /health endpoint does so without depending on a shared service that could make every target fail at once. The load balancer takes a target out of service after the unhealthy threshold of consecutive failures, so 3 failures at a 10-second interval remove the task in about 30 seconds.
  options:
    a:
      en: |-
        The static file is still served by a task whose worker pool is exhausted, so the health check keeps passing however often it runs.
    c:
      en: |-
        The healthy threshold controls how many consecutive successes bring a target back into service; raising it does not detect failures faster.
    d:
      en: |-
        The deregistration delay applies to targets that are being deregistered; the failed task is never marked unhealthy or deregistered while the static file check passes.
references:
  - title: Health checks for Application Load Balancer target groups - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
