id: dopc02-3b-ecs-express-mode
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A startup that has just opened its first AWS account wants to deploy a stateless containerized REST API. The developers have the container image in Amazon ECR but little AWS experience. The API needs a public HTTPS URL, a load balancer, automatic scaling with traffic, and basic monitoring. The company wants AWS to create and wire these components from the image with the fewest decisions, and it wants no additional charge beyond the resources that run the API.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS App Runner service from the ECR image, and let App Runner provide the HTTPS URL and scale the service.
    - id: b
      text:
        en: |-
          Create an Amazon ECS Express Mode service from the ECR image, with a task execution role and an infrastructure role.
    - id: c
      text:
        en: |-
          Create an Amazon EKS cluster in Auto Mode, and deploy the image with a Deployment, a Service, an Ingress, and a Horizontal Pod Autoscaler.
    - id: d
      text:
        en: |-
          Write a CloudFormation template for an ECS service on Fargate with an Application Load Balancer, target groups, ACM certificate, and scaling policies.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon ECS Express Mode needs only a container image, a task execution role and an infrastructure role. It creates a Fargate-based ECS service with an accessible URL, a load balancer with TLS, auto scaling policies, monitoring and networking, and it has no additional charge beyond the underlying resources.
  options:
    a:
      en: |-
        AWS App Runner is no longer open to new customers, and AWS recommends Amazon ECS Express Mode instead, so a new account cannot use it.
    c:
      en: |-
        EKS Auto Mode manages nodes, but the team must still write and maintain Kubernetes manifests, and the EKS cluster itself has an hourly charge.
    d:
      en: |-
        Writing and maintaining a full template requires many decisions and AWS expertise that the developers do not have.
references:
  - title: Amazon ECS Express Mode - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-overview.html
  - title: What is AWS App Runner? - AWS App Runner
    url: https://docs.aws.amazon.com/apprunner/latest/dg/what-is-apprunner.html
