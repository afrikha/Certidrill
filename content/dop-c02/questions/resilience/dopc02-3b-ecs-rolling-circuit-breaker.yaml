id: dopc02-3b-ecs-rolling-circuit-breaker
objective: "3.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an order API as an Amazon ECS service of six tasks on AWS Fargate with the rolling update (ECS) deployment controller. The deployment configuration uses a minimumHealthyPercent of 50 and a maximumPercent of 100. During deployments, only three tasks serve traffic and latency rises. Last week, a revision with a bad image kept failing to start, and the deployment kept launching tasks for hours until an engineer intervened. The company wants full serving capacity during deployments and automatic return to the last working revision when new tasks cannot start or fail their health checks.

    Which combination of changes will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set minimumHealthyPercent to 100 and maximumPercent to 200 in the deployment configuration of the service.
    - id: b
      text:
        en: |-
          Change the deployment controller to CODE_DEPLOY, and set minimumHealthyPercent to 100 and maximumPercent to 200 on the service.
    - id: c
      text:
        en: |-
          Enable the deployment circuit breaker on the service with the rollback option turned on.
    - id: d
      text:
        en: |-
          Set both minimumHealthyPercent and maximumPercent to 100 so that the service never runs fewer or more than six tasks.
    - id: e
      text:
        en: |-
          Set Availability Zone rebalancing to ENABLED on the service so that failed tasks are restarted in another Availability Zone.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      With a minimumHealthyPercent of 100 and a maximumPercent of 200, the scheduler starts new tasks before stopping old ones, so six tasks keep serving during the deployment. The deployment circuit breaker detects tasks that fail to reach RUNNING or fail health checks, and with rollback enabled it returns the service to the last deployment in the COMPLETED state.
  options:
    b:
      en: |-
        With the CODE_DEPLOY controller, custom minimumHealthyPercent and maximumPercent values are not used, and the circuit breaker is available only with the rolling update controller.
    d:
      en: |-
        With both values at 100, the scheduler can neither stop an old task nor start an extra one, so the deployment cannot replace any task.
    e:
      en: |-
        Availability Zone rebalancing corrects the distribution of healthy tasks across zones; it does not detect failed deployments or roll them back.
references:
  - title: How the Amazon ECS deployment circuit breaker detects failures - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-circuit-breaker.html
  - title: DeploymentConfiguration - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_DeploymentConfiguration.html
