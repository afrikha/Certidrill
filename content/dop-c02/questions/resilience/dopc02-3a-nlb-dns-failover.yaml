id: dopc02-3a-nlb-dns-failover
objective: "3.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a TCP service behind a Network Load Balancer (NLB) in three Availability Zones, with cross-zone load balancing turned off. Each zone has 10 targets. When a bad configuration reached most targets in one zone, the NLB node in that zone kept receiving a third of the clients and sent them to the few remaining healthy targets, which became overloaded. The company wants clients to stop resolving the IP address of a zone automatically when fewer than half of the targets in that zone are healthy, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on cross-zone load balancing so that each NLB node sends traffic to the healthy targets in all three Availability Zones.
    - id: b
      text:
        en: |-
          Create a Route 53 health check for each zonal IP address of the NLB, and publish the three addresses in a multivalue answer record.
    - id: c
      text:
        en: |-
          Set the unhealthy state routing threshold of the target group to 50% so that the NLB node sends traffic to all targets in the zone.
    - id: d
      text:
        en: |-
          Set the DNS failover minimum healthy targets percentage in the target group health settings to 50%.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With DNS failover in the target group health settings, when the healthy targets in a zone fall below the threshold, Elastic Load Balancing marks the IP addresses of that zone's load balancer node as unhealthy in DNS, so clients resolve the name only to healthy zones. With cross-zone load balancing turned off, the threshold is evaluated for each zone separately.
  options:
    a:
      en: |-
        Cross-zone load balancing spreads traffic across zones, but the zone's IP address stays in DNS, and the thresholds would then apply to the total of all targets instead of each zone.
    b:
      en: |-
        This builds custom DNS records outside the NLB's own name, and a health check on a node IP address tests the node, not the share of healthy targets behind it.
    c:
      en: |-
        Routing failover makes the node send traffic to all targets, including unhealthy ones; it does not remove the zone's IP address from DNS.
references:
  - title: "Target group health - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/target-group-health.html
