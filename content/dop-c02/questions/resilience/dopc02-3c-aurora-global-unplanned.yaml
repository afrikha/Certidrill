id: dopc02-3c-aurora-global-unplanned
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon Aurora MySQL global database with the primary cluster in us-east-1 and a secondary cluster in us-west-2 that runs the same engine version. The applications connect through the global writer endpoint. An event impairs us-east-1, and the primary cluster is unreachable. The business accepts losing the few seconds of transactions that were not yet replicated. The applications must resume writes in us-west-2 within minutes, without any change to their configuration, and the database must keep its global database topology so that us-east-1 can return as a secondary Region when it recovers.

    Which recovery action will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run the failover-global-cluster command with the --allow-data-loss option and the us-west-2 cluster as the target, and keep the applications on the global writer endpoint.
    - id: b
      text:
        en: |-
          Run the switchover-global-cluster command with the us-west-2 cluster as the target, and keep the applications on the global writer endpoint.
    - id: c
      text:
        en: |-
          Detach the us-west-2 cluster from the global database to promote it to a standalone cluster, and update the applications to use the new cluster endpoint.
    - id: d
      text:
        en: |-
          Restore the most recent automated snapshot of the primary cluster to a new cluster in us-west-2, and update the global writer endpoint to point to the new cluster.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A managed global database failover promotes the chosen secondary cluster within minutes without waiting for replication to catch up, so the RPO is a few seconds of replication lag. The global writer endpoint keeps the same name after the failover, and when us-east-1 recovers, Aurora adds it back as a secondary and rebuilds it from the new primary.
  options:
    b:
      en: |-
        A switchover is for planned operations when all clusters are healthy: it first synchronizes the secondary with the primary, which cannot happen while the primary is unreachable.
    c:
      en: |-
        Detach and promote is the manual fallback: it breaks the global database topology and requires changing the application's endpoint.
    d:
      en: |-
        The snapshots of the primary cluster are stored in us-east-1, restoring them takes far longer than a few minutes, and the global writer endpoint cannot be repointed to a standalone cluster.
references:
  - title: Using switchover or failover in Amazon Aurora Global Database - Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html
