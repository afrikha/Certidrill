id: dopc02-3a-ec2-region-sla
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a production application on Amazon EC2 instances that are all in one Availability Zone in eu-west-1. The legal team is preparing customer contracts and wants the infrastructure to qualify for the Amazon EC2 Region-Level SLA of 99.99% Monthly Uptime Percentage instead of the Instance-Level SLA.

    Which change will meet this requirement?
body:
  options:
    - id: a
      text:
        en: |-
          Move the instances to Dedicated Hosts that are allocated in the same Availability Zone.
    - id: b
      text:
        en: |-
          Purchase a Compute Savings Plan that covers every instance in the Region.
    - id: c
      text:
        en: |-
          Run the instances concurrently across two or more Availability Zones in eu-west-1.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm that recovers each instance when its system status check fails.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Amazon EC2 Region-Level SLA of 99.99% applies when the running instances are deployed concurrently across two or more Availability Zones in the same Region. Each individual instance is otherwise covered only by the Instance-Level SLA of 99.5%. Spreading the instances across zones is what qualifies the deployment.
  options:
    a:
      en: |-
        The tenancy of an instance does not change which SLA applies, and the instances would still run in a single Availability Zone.
    b:
      en: |-
        A Savings Plan changes how the instances are billed, not how they are deployed, so it has no effect on the SLA.
    d:
      en: |-
        Instance recovery helps a single instance after a hardware issue, but every instance stays in one Availability Zone, so only the Instance-Level SLA applies.
references:
  - title: "Amazon Compute Service Level Agreement"
    url: https://aws.amazon.com/compute/sla/
  - title: "Availability - Reliability Pillar"
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html
