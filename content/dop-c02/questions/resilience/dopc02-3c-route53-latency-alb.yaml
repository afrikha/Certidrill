id: dopc02-3c-route53-latency-alb
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company runs its web application behind an Application Load Balancer (ALB) in us-west-2 and has deployed an identical copy of the application behind an ALB in eu-central-1. A public hosted zone in Amazon Route 53 hosts the domain name app.example.com. Users must be sent to the Region that gives them the lowest network latency. If the ALB in one Region has no healthy targets, users must be sent to the other Region automatically.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create two latency alias records for app.example.com, one for each Region, that point to the Regional ALB, and set Evaluate target health to Yes on both records.
    - id: b
      text:
        en: |-
          Create two weighted alias records for app.example.com with equal weights that point to the two ALBs, and set Evaluate target health to Yes on both records.
    - id: c
      text:
        en: |-
          Create a geolocation alias record for Europe that points to the eu-central-1 ALB and a default geolocation alias record that points to the us-west-2 ALB.
    - id: d
      text:
        en: |-
          Create a primary failover alias record that points to the us-west-2 ALB and a secondary failover alias record that points to the eu-central-1 ALB, with Evaluate target health set to Yes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Latency-based routing answers each DNS query with the record of the Region that gives the user the lowest latency, based on latency data that Route 53 collects between users and AWS Regions. With Evaluate target health set to Yes on alias records that point to load balancers, Route 53 routes traffic away from an ALB that is unhealthy, so users are sent to the other Region.
  options:
    b:
      en: |-
        Weighted records split traffic by the configured weights, not by latency, so about half of the users would be sent to the more distant Region.
    c:
      en: |-
        Geolocation routing is based on where the user is, not on measured latency, and without health evaluation users are not moved when a Region has no healthy targets.
    d:
      en: |-
        Failover routing sends all users to the primary Region while it is healthy, so users near eu-central-1 would not get the lowest latency.
references:
  - title: Latency-based routing - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-latency.html
  - title: Values specific for simple alias records - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resource-record-sets-values-alias.html
