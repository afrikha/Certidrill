id: dopc02-3a-s3-crr-sse-kms
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company replicates an S3 bucket in us-east-1 to a bucket in us-west-2 with S3 Cross-Region Replication. New objects that use SSE-S3 replicate correctly, but objects that applications upload with SSE-KMS and a customer managed key in us-east-1 are not replicated. Security policy requires the replicas in us-west-2 to be encrypted with a customer managed key that resides in us-west-2. The replication role already has permissions to read the source objects and write to the destination bucket.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Specify the ARN of the us-east-1 customer managed key as the replica KMS key in the replication rule, and grant the replication role kms:Decrypt and kms:Encrypt on that key.
    - id: b
      text:
        en: |-
          Opt in to replicating SSE-KMS objects in the replication rule, set a us-west-2 key as the replica KMS key, and grant the role kms:Decrypt on the source key and kms:Encrypt on the replica key.
    - id: c
      text:
        en: |-
          Turn on S3 Replication Time Control for the replication rule so that the encrypted objects are replicated within 15 minutes, and keep the current replication role.
    - id: d
      text:
        en: |-
          Set the default encryption of the destination bucket to SSE-KMS with a us-west-2 key and turn on S3 Bucket Keys, without changing the replication rule.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      By default, Amazon S3 does not replicate objects encrypted with SSE-KMS. You must opt in with the SseKmsEncryptedObjects source selection criterion, name a replica KMS key that is in the same Region as the destination bucket, and grant the replication role kms:Decrypt on the source key and kms:Encrypt on the replica key.
  options:
    a:
      en: |-
        The replica KMS key must be in the Region of the destination bucket; S3 does not validate the key when the rule is saved, so replication would fail.
    c:
      en: |-
        Replication Time Control sets a replication time target, but SSE-KMS objects are still excluded until the rule opts in to them.
    d:
      en: |-
        Default encryption on the destination applies to objects written there; it does not make the replication rule select SSE-KMS objects.
references:
  - title: "Replicating encrypted objects (SSE-S3, SSE-KMS, DSSE-KMS, SSE-C) - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-config-for-kms-objects.html
