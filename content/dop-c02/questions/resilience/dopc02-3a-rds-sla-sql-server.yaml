id: dopc02-3a-rds-sla-sql-server
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs its ERP database on Amazon RDS for SQL Server as a Single-AZ DB instance. A contract with the company's largest customer now requires the database tier to be covered by the 99.95% Monthly Uptime Percentage commitment of the Amazon RDS SLA. The company must keep the SQL Server engine and wants the simplest change.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Modify the DB instance to use a Multi-AZ DB instance deployment.
    - id: b
      text:
        en: |-
          Move the database to a Multi-AZ DB cluster deployment with two readable standbys.
    - id: c
      text:
        en: |-
          Create a read replica of the DB instance in another Availability Zone.
    - id: d
      text:
        en: |-
          Set the automated backup retention to 35 days, and copy snapshots to another Region.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The Amazon RDS SLA commits to 99.95% for Multi-AZ DB instances and Multi-AZ DB clusters, and to 99.5% for Single-DB instances. The Multi-AZ DB instance deployment option is available for RDS for SQL Server, and it provisions a synchronous standby in another Availability Zone.
  options:
    b:
      en: |-
        The SLA defines Multi-AZ DB clusters for MySQL and PostgreSQL only, so this option does not keep the SQL Server engine.
    c:
      en: |-
        A read replica does not change the deployment option of the source DB instance, which stays a Single-DB instance covered at 99.5%.
    d:
      en: |-
        Backups and snapshot copies help recovery, but the DB instance remains a Single-DB instance under the 99.5% commitment.
references:
  - title: "Amazon RDS SLA"
    url: https://aws.amazon.com/rds/sla/
  - title: "Multi-AZ DB instance deployments for Amazon RDS - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
