id: dopc02-3c-org-backup-policy
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has 150 member accounts in AWS Organizations and adds new accounts every month. In every account, the resources tagged tier=critical in us-east-1 must be backed up every 12 hours, and each backup must be copied to a vault in us-west-2 of the same account. Administrators of the member accounts must not be able to change the backup schedule. The company wants a central, automated solution with the LEAST operational overhead.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Deploy a Lambda function in each member account that creates an AWS Backup plan with the schedule, the copy rule, and the tag selection when the account is created.
    - id: b
      text:
        en: |-
          Attach a backup policy to the organization root that defines the 12-hour rule, the copy action to us-west-2, the tag selection, and the vault and IAM role names.
    - id: c
      text:
        en: |-
          Use CloudFormation StackSets with service-managed permissions and automatic deployment to create the backup vaults in both Regions and the IAM role in every member account.
    - id: d
      text:
        en: |-
          Create an AWS Backup Audit Manager framework in each account with a control that reports resources tagged tier=critical that are not protected by a backup plan.
    - id: e
      text:
        en: |-
          Attach a service control policy to the organization root that denies backup:DeleteBackupPlan and backup:UpdateBackupPlan to every principal in the member accounts.
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: |-
      An Organizations backup policy applies a backup plan, with its schedule, copy actions, tag-based selection, vault, and IAM role, to every account under the target, and member accounts see the effective plan as immutable. The vaults must exist in each account and Region that receives the policy, and the IAM role must exist too, so StackSets with automatic deployment creates them in current and future accounts.
  options:
    a:
      en: |-
        Per-account Lambda functions are custom automation to maintain, and plans created in the member accounts can be changed by their administrators.
    d:
      en: |-
        Backup Audit Manager reports on backup compliance, but it does not create any backup plan, so no backups would be taken.
    e:
      en: |-
        An SCP can stop changes to existing plans, but it does not create the backup plans, vaults, or IAM roles, so no backups would be taken.
references:
  - title: Backup policies - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_backup.html
  - title: Backup policy syntax and examples - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_backup_syntax.html
