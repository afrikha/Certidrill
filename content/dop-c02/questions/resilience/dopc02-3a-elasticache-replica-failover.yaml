id: dopc02-3a-elasticache-replica-failover
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company stores player session data in an Amazon ElastiCache for Valkey replication group with cluster mode disabled. The replication group has one primary node in us-west-2a and no replicas. An impairment of us-west-2a made the cache unavailable, and the application failed until the node was replaced. The company wants writes to resume automatically within seconds if the primary node's Availability Zone fails, and the application must keep using the same primary endpoint.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on Multi-AZ with automatic failover for the existing replication group without adding nodes, so that ElastiCache recreates the primary node in another Availability Zone.
    - id: b
      text:
        en: |-
          Create a global datastore with a secondary cluster in another AWS Region, and promote the secondary cluster when the primary node becomes unavailable.
    - id: c
      text:
        en: |-
          Schedule daily automatic backups of the replication group, and restore the latest backup to a new cluster in another Availability Zone when the primary node fails.
    - id: d
      text:
        en: |-
          Add a read replica in a different Availability Zone, and turn on Multi-AZ with automatic failover for the replication group.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Multi-AZ requires at least one replica in an Availability Zone other than the primary's. When the primary fails, ElastiCache promotes the replica with the least replication lag, writes typically resume within a few seconds, and ElastiCache propagates the DNS name so that the primary endpoint does not change for the application.
  options:
    a:
      en: |-
        For cluster mode disabled, Multi-AZ can be turned on only for a replication group that has at least one available read replica; with a single node there is nothing to promote.
    b:
      en: |-
        A global datastore protects against a Regional event, and promoting the secondary cluster is a manual action in another Region that also changes the endpoint that the application uses.
    c:
      en: |-
        Restoring a backup is a manual, slow process that loses every change made since the last backup, so writes would not resume within seconds.
references:
  - title: "Minimizing downtime in ElastiCache by using Multi-AZ with Valkey and Redis OSS - Amazon ElastiCache"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/AutoFailover.html
