id: dopc02-3b-target-tracking-metric-choice
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a stateless web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. Each request has a similar cost, and CPU utilization of the instances rises with the number of requests they serve. The DevOps team is replacing a set of manually tuned step scaling policies with target tracking policies. The team wants metrics whose value increases or decreases in proportion to the number of instances in the group, so that the policies converge on the right capacity.

    Which metrics should the team use for the target tracking policies? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          ASGAverageCPUUtilization of the Auto Scaling group.
    - id: b
      text:
        en: |-
          RequestCount of the Application Load Balancer.
    - id: c
      text:
        en: |-
          TargetResponseTime of the Application Load Balancer.
    - id: d
      text:
        en: |-
          ALBRequestCountPerTarget of the target group.
    - id: e
      text:
        en: |-
          HealthyHostCount of the target group.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A target tracking metric must describe how busy an instance is and change in proportion to the number of instances. Average CPU utilization of the group and the average request count per target both fall when instances are added and rise when instances are removed, and both are predefined target tracking metrics for EC2 Auto Scaling.
  options:
    b:
      en: |-
        The total number of requests received by the load balancer does not depend on how many instances serve them, so it does not converge when capacity changes.
    c:
      en: |-
        Latency can rise with utilization but does not change proportionally to capacity, so AWS advises against it as a target tracking metric.
    e:
      en: |-
        The number of healthy hosts measures capacity, not load; using it as the target would make the group chase its own size.
references:
  - title: Target tracking scaling policies for Amazon EC2 Auto Scaling - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
