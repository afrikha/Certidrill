id: dopc02-3a-efs-replication-failback
objective: "3.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company stores engineering files on an Amazon EFS Regional file system in us-east-1 and uses EFS replication to keep a replica file system in us-west-2. The DR runbook must cover a full Regional failover. During an outage of us-east-1, the application in us-west-2 must be able to write to the replica. After us-east-1 recovers, the company will move back to the original file system in us-east-1 and must keep every change that was written in us-west-2 during the outage.

    Which combination of actions should the runbook include? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          During the outage, update the file system policy of the replica to grant elasticfilesystem:ClientWrite to the IAM role of the application.
    - id: b
      text:
        en: |-
          During the outage, delete the replication configuration so that the replica file system in us-west-2 becomes writable.
    - id: c
      text:
        en: |-
          After recovery, re-create the original replication configuration on the us-east-1 file system with the us-west-2 file system as the destination.
    - id: d
      text:
        en: |-
          After recovery, restore the latest AWS Backup recovery point of the us-west-2 file system to a new file system in us-east-1.
    - id: e
      text:
        en: |-
          After recovery, create a replication configuration on the us-west-2 file system with the original us-east-1 file system as the destination.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      You fail over to an EFS replica by deleting its replication configuration; the replica then becomes writable. To keep the changes made during the failover, you create a replication configuration on the replica with the original file system as the destination, so that EFS transfers the differences back. When that replication completes, you re-create the original configuration to resume replication from us-east-1.
  options:
    a:
      en: |-
        A file system policy controls client access, but the replica stays read-only as long as it is the destination of a replication configuration.
    c:
      en: |-
        Re-creating the original configuration makes EFS update the replica to match the primary, which discards the changes written in us-west-2 during the failover.
    d:
      en: |-
        A backup holds only the data up to its recovery point, and restoring it creates a new file system instead of updating the original one, so recent changes can be lost.
references:
  - title: "Using the replica - Amazon Elastic File System"
    url: https://docs.aws.amazon.com/efs/latest/ug/replication-fail-over.html
  - title: "Replicating EFS file systems - Amazon Elastic File System"
    url: https://docs.aws.amazon.com/efs/latest/ug/efs-replication.html
