id: dopc02-3a-alb-subnet-free-ips
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's Application Load Balancer (ALB) is enabled in three Availability Zones. In us-east-1b, the ALB uses a /24 subnet that is shared with hundreds of other network interfaces and has only three free IP addresses left. During a traffic spike, clients whose connections reached the load balancer node in us-east-1b received 5xx errors and connection timeouts, while all targets were healthy and lightly loaded. The company must prevent this from happening again.

    Which solution will meet this requirement?
body:
  options:
    - id: a
      text:
        en: |-
          Register more targets in us-east-1b so that the load balancer node in that zone has more targets to send requests to.
    - id: b
      text:
        en: |-
          Create a dedicated subnet of /27 or larger in us-east-1b, and change the ALB's subnet for us-east-1b to the new subnet.
    - id: c
      text:
        en: |-
          Move the targets in us-east-1b to a larger subnet in the same Availability Zone, and keep the ALB configuration unchanged.
    - id: d
      text:
        en: |-
          Turn off cross-zone load balancing at the target group level so that the node in us-east-1b handles less traffic.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Each ALB subnet needs a CIDR block of at least /27 and at least eight free IP addresses so that the load balancer can scale out. When a subnet runs out of usable IP addresses during scaling, the ALB runs with insufficient capacity in that zone, and the stalled scaling can cause 5xx errors or timeouts. A dedicated subnet with free addresses lets the node in us-east-1b scale.
  options:
    a:
      en: |-
        The targets were healthy and lightly loaded; the load balancer node could not scale because its subnet had no free IP addresses.
    c:
      en: |-
        The targets' subnet is not the constraint; the ALB nodes use the subnet configured on the load balancer for each zone.
    d:
      en: |-
        Cross-zone settings change which targets each node uses, not how many clients reach the node in us-east-1b, so the node still cannot scale.
references:
  - title: "Application Load Balancers - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html
