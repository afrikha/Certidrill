id: dopc02-3c-aurora-global-switchover-drill
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Regulators require a bank to run its core application from its disaster recovery Region for one week every quarter. The data is stored in an Amazon Aurora MySQL global database with the primary cluster in eu-west-1 and a secondary cluster in eu-central-1, and both clusters run the same engine version. The drill must not lose any committed transaction. During the drill, the global database must keep its topology with eu-west-1 as a secondary Region, and after the week the bank must return to eu-west-1 the same way.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run the failover-global-cluster command with the --allow-data-loss option and the eu-central-1 cluster as the target, and run the same command toward eu-west-1 after the week.
    - id: b
      text:
        en: |-
          Detach the eu-central-1 cluster from the global database and promote it, and add eu-west-1 back as a secondary Region of a new global database after the week.
    - id: c
      text:
        en: |-
          Run an AWS FIS experiment that disrupts cross-Region connectivity from the application subnets in eu-west-1, and move the application traffic to eu-central-1 for the week.
    - id: d
      text:
        en: |-
          Run the switchover-global-cluster command with the eu-central-1 cluster as the target, and run a switchover with the eu-west-1 cluster as the target after the week.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A switchover synchronizes the secondary cluster with the primary before it changes roles, so the RPO is 0, and it keeps the global database topology with the old primary as a secondary. AWS describes this operation for planned scenarios such as regulatory Regional rotation, and a second switchover returns the primary to eu-west-1.
  options:
    a:
      en: |-
        A failover does not wait for replication to catch up, so transactions can be lost, which is acceptable only for unplanned outages.
    b:
      en: |-
        Detach and promote breaks the global database topology and forces the bank to rebuild the global database after the drill.
    c:
      en: |-
        Disrupting network connectivity does not move the writer of the global database, so the application in eu-central-1 would still depend on the primary cluster in eu-west-1.
references:
  - title: Using switchover or failover in Amazon Aurora Global Database - Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html
