id: dopc02-3a-route53-failover-alias
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an active-passive web application in two AWS Regions. In each Region, an Application Load Balancer (ALB) fronts an Auto Scaling group. The company wants Amazon Route 53 to send all traffic to the primary Region and to answer with the secondary Region only when the primary ALB has no healthy targets. The DevOps team wants to avoid creating separate Route 53 health checks.

    Which configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create two weighted alias records with weights of 100 and 0 for the primary and secondary ALBs, and set Evaluate Target Health to No on both records.
    - id: b
      text:
        en: |-
          Create primary and secondary failover records as CNAME records that point to the DNS names of the two ALBs, without health checks.
    - id: c
      text:
        en: |-
          Create two latency alias records, one for each ALB, and associate an HTTPS health check with the record of the primary Region only.
    - id: d
      text:
        en: |-
          Create primary and secondary failover alias records that point to the two ALBs, and set Evaluate Target Health to Yes on both records.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The failover routing policy implements active-passive failover: Route 53 answers with the primary record while it is healthy and with the secondary record otherwise. For alias records that point to AWS resources such as ALBs, AWS recommends setting Evaluate Target Health to Yes instead of creating health checks, so the health of the ALB's targets decides the answer.
  options:
    a:
      en: |-
        With Evaluate Target Health set to No and no health check, Route 53 never sees the primary ALB as unhealthy, so it keeps answering with the record that has the nonzero weight.
    b:
      en: |-
        A non-alias failover record without a health check is always considered healthy, so Route 53 would never answer with the secondary record.
    c:
      en: |-
        Latency records are active-active: users closer to the secondary Region receive it even when the primary is healthy, and the design also adds a separate health check.
references:
  - title: "Active-active and active-passive failover - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-types.html
