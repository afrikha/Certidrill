id: dopc02-3b-large-payload-claim-check
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a Java document-processing pipeline. A producer application sends scanned documents to consumers through an Amazon SQS standard queue so that the consumers can scale independently. A new customer sends documents of up to 200 MB, which is larger than the maximum SQS message size, and those sends fail. The company wants to keep the queue-based design and wants the smallest change to the producer and consumer code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the SQS queue with an Amazon SNS topic, and subscribe the consumers to the topic with HTTPS subscriptions to receive the documents.
    - id: b
      text:
        en: |-
          Use the Amazon SQS Extended Client Library for Java so that payloads are stored in Amazon S3 and the messages carry a reference.
    - id: c
      text:
        en: |-
          Compress each document and split it into several SQS messages that the consumers reassemble by using a sequence number in a message attribute.
    - id: d
      text:
        en: |-
          Convert the queue to a FIFO queue with content-based deduplication so that large documents are accepted and processed only once.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      This is the claim-check pattern. The Extended Client Library for Java stores the message payload in an S3 bucket and sends a message that contains a reference to the object, and the consumer library retrieves the object transparently. The queue still decouples producers and consumers, and the code change is limited to using the extended client.
  options:
    a:
      en: |-
        SNS also has a maximum message size, so large documents would still fail, and HTTPS push removes the buffering that let consumers scale independently.
    c:
      en: |-
        Splitting and reassembling requires substantial custom code, and parts of one document can be received by different consumers of a standard queue.
    d:
      en: |-
        FIFO queues have the same maximum message size, and deduplication does not change how large a message can be.
references:
  - title: Managing large Amazon SQS messages using Java and Amazon S3 - Amazon Simple Queue Service
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-s3-messages.html
