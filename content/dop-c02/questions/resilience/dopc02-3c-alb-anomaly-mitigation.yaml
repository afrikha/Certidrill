id: dopc02-3c-alb-anomaly-mitigation
objective: "3.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application runs on 12 Amazon EC2 instances that are registered in an Application Load Balancer target group that uses the round robin routing algorithm. Occasionally, one instance develops a partial failure: it keeps passing the health checks, but it returns a much higher rate of HTTP 5xx errors than the other instances until an engineer replaces it. The company wants the load balancer to automatically send less traffic to such an instance and to return traffic to it gradually after it recovers. The target group does not use sticky sessions or slow start mode, and the company wants no custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the routing algorithm of the target group to least outstanding requests so that instances that respond slowly receive fewer new requests.
    - id: b
      text:
        en: |-
          Reduce the health check interval to 5 seconds and the unhealthy threshold to 2 so that the load balancer removes the failing instance from service sooner.
    - id: c
      text:
        en: |-
          Create a CloudWatch alarm on the HTTPCode_Target_5XX_Count metric that invokes a Lambda function to deregister the instance with the highest error rate.
    - id: d
      text:
        en: |-
          Change the routing algorithm of the target group to weighted random, and turn on anomaly mitigation of automatic target weights.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Automatic target weights compare the rate of HTTP 5xx errors and connection failures of each target with its peers and mark targets with a significantly higher rate as anomalous, independently of health checks. With the weighted random algorithm and anomaly mitigation turned on, the load balancer reduces the traffic to anomalous targets and gradually restores it when they return to normal.
  options:
    a:
      en: |-
        Least outstanding requests balances by the number of in-progress requests; an instance that fails quickly with 5xx errors may have few outstanding requests and receive even more traffic.
    b:
      en: |-
        The failing instance passes its health checks, so faster health checks never take it out of service.
    c:
      en: |-
        A Lambda function is the custom code that the company wants to avoid, and deregistering the instance does not return traffic to it gradually after it recovers.
references:
  - title: Edit target group attributes for your Application Load Balancer - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html
