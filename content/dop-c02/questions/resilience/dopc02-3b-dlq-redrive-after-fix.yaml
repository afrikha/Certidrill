id: dopc02-3b-dlq-redrive-after-fix
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon SQS standard queue to decouple an invoicing service from its consumers. The queue has a redrive policy that moves a message to a dead-letter queue after five failed receives. A faulty consumer release caused about 40,000 messages to move to the dead-letter queue before the team rolled it back. The fixed consumers are now healthy. The team wants to reprocess the failed messages through the normal consumers without overwhelming them and without writing code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the maxReceiveCount of the redrive policy on the source queue so that the messages in the dead-letter queue are returned automatically.
    - id: b
      text:
        en: |-
          Point the consumers at the dead-letter queue until it is empty, and then point them back at the source queue.
    - id: c
      text:
        en: |-
          Configure the dead-letter queue as an event source for a new AWS Lambda function that sends each message back to the source queue.
    - id: d
      text:
        en: |-
          Start a dead-letter queue redrive to the source queue with a custom maximum velocity that the consumers can absorb.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      SQS dead-letter queue redrive moves messages from the dead-letter queue back to the source queue (or another queue of the same type) as an asynchronous task started from the console or with StartMessageMoveTask. A custom maximum velocity limits the number of messages moved per second, so the normal consumers are not overwhelmed.
  options:
    a:
      en: |-
        Changing maxReceiveCount affects only future failures; it does not move messages that are already in the dead-letter queue.
    b:
      en: |-
        Repointing the consumers requires configuration changes and deployments, and new messages on the source queue would wait while the consumers drain the dead-letter queue.
    c:
      en: |-
        This requires writing and maintaining a function, which the team wants to avoid, while the built-in redrive already moves the messages at a controlled rate.
references:
  - title: Learn how to configure a dead-letter queue redrive in Amazon SQS - Amazon Simple Queue Service
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-configure-dead-letter-queue-redrive.html
