id: dopc02-3c-ssm-multi-region-runbook
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 20 workload accounts in AWS Organizations. Its disaster recovery procedure is a custom AWS Systems Manager Automation runbook that, in us-west-2, scales out the pilot-light Auto Scaling groups and restores the latest AWS Backup copies of the EBS volumes that have the tag dr=restore. During a disaster, the operations team must start the runbook once from a central operations account and have it run in us-west-2 in all 20 accounts. No more than 5 accounts may run the runbook at the same time, and dispatch to further accounts must stop when failures exceed a small threshold. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Lambda function in the operations account that assumes a role in each workload account in turn and calls the StartAutomationExecution API, counting failures to decide whether to continue.
    - id: b
      text:
        en: |-
          Share the runbook with the 20 accounts, and give the on-call engineer of each account a procedure to start the runbook in us-west-2 when the operations team declares a disaster.
    - id: c
      text:
        en: |-
          Deploy the runbook to each account with CloudFormation StackSets, and create an EventBridge rule in each account that starts the runbook when an AWS Health event for us-east-1 is received.
    - id: d
      text:
        en: |-
          Share the runbook, create the automation administration role in the operations account and the execution role in each account, and start the automation with target locations, a concurrency of 5, and an error threshold.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Systems Manager Automation can run a runbook in multiple accounts and Regions from a central account: the AWS-SystemsManager-AutomationAdministrationRole is created in the central account, the AWS-SystemsManager-AutomationExecutionRole in each target account, and custom runbooks are shared with the targets. Target locations set the accounts and Regions, and TargetLocationMaxConcurrency and TargetLocationMaxErrors control how many account-Region pairs run at once and when dispatch stops.
  options:
    a:
      en: |-
        A custom function reimplements the cross-account dispatch, concurrency, and error handling that Automation provides natively, which adds operational overhead.
    b:
      en: |-
        Twenty manual executions are not a single start from the operations account, and they give no central control of concurrency or failures.
    c:
      en: |-
        Starting the runbook automatically from Health events removes the operations team's decision to declare a disaster and gives no control over concurrency or failure thresholds.
references:
  - title: Running automations in multiple AWS Regions and accounts - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-automations-multiple-accounts-regions.html
