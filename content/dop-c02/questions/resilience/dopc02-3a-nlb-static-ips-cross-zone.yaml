id: dopc02-3a-nlb-static-ips-cross-zone
objective: "3.1.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company exposes a TCP API to partners who must allowlist a fixed set of IP addresses in their firewalls. The partners connect to those IP addresses directly and cache them for months, so the company cannot rely on DNS changes. The API runs on Amazon EC2 instances in three Availability Zones. Every allowlisted IP address must keep forwarding connections even when all the targets in its own Availability Zone are unhealthy, and the API must stay reachable if one Availability Zone fails.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an internet-facing Application Load Balancer in three Availability Zones, and associate an Elastic IP address with each of its subnets.
    - id: b
      text:
        en: |-
          Create an internet-facing Network Load Balancer with a subnet and an Elastic IP address in each of the three Availability Zones, and give the partners the three addresses.
    - id: c
      text:
        en: |-
          Create an internet-facing Network Load Balancer with a subnet in one Availability Zone and one Elastic IP address, and register targets from all three zones.
    - id: d
      text:
        en: |-
          Set the DNS failover minimum healthy targets count of the target group to 1 so that a zone without healthy targets is removed from DNS.
    - id: e
      text:
        en: |-
          Turn on cross-zone load balancing for the Network Load Balancer so that each node can forward connections to healthy targets in other Availability Zones.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      An internet-facing Network Load Balancer can have an Elastic IP address for each enabled Availability Zone, which gives the partners static addresses in three zones, so the API stays reachable through the other addresses if one zone fails. With cross-zone load balancing turned on, each node distributes connections across the registered targets in all enabled zones, so an address keeps working even when the targets of its own zone are unhealthy.
  options:
    a:
      en: |-
        Application Load Balancers do not support Elastic IP addresses, and their node addresses can change, so they cannot be allowlisted as a fixed set.
    c:
      en: |-
        A load balancer in a single Availability Zone exposes one address that becomes unreachable when that zone fails.
    d:
      en: |-
        DNS failover only changes DNS answers; the partners connect to cached IP addresses and never see the change.
references:
  - title: "Update the Availability Zones for your Network Load Balancer - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/availability-zones.html
  - title: "How Elastic Load Balancing works - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html
