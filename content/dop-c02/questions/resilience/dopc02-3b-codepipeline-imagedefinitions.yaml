id: dopc02-3b-codepipeline-imagedefinitions
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS CodePipeline to deploy a containerized API to an Amazon ECS service that uses rolling updates. A CodeBuild stage builds the Docker image, tags it with the commit ID, and pushes it to Amazon ECR. The deploy stage uses the Amazon ECS standard deployment action with the build output artifact as input. The deploy stage fails because the action cannot find the information it needs to update the service. The task definition has one container named api.

    What should the DevOps engineer do to fix the pipeline?
body:
  options:
    - id: a
      text:
        en: |-
          Write an imageDetail.json file that contains the ImageURI of the new image in post_build, and export it as a build artifact.
    - id: b
      text:
        en: |-
          Write an appspec.yaml file that names the container api and its container port in post_build, and export it as a build artifact.
    - id: c
      text:
        en: |-
          Write a taskdef.json file that contains the full task definition with the new image in post_build, and export it as a build artifact.
    - id: d
      text:
        en: |-
          Write an imagedefinitions.json file that maps the container name api to the new imageUri in post_build, and export it as a build artifact.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Amazon ECS standard deployment action reads an imagedefinitions.json file: a JSON array of objects with the container name and the imageUri to deploy. The documentation suggests writing it in the post_build phase of the buildspec and exporting it as an output artifact.
  options:
    a:
      en: |-
        imageDetail.json, with a single ImageURI key, is the file used by the Amazon ECS blue/green (CodeDeploy) deployment action, not by the standard action.
    b:
      en: |-
        An AppSpec file is used by CodeDeploy for blue/green deployments; the standard ECS action does not read it.
    c:
      en: |-
        A task definition file is an input of the CodeDeploy blue/green action; the standard action needs the image definitions file to update the container image.
references:
  - title: Image definitions file reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/file-reference.html
