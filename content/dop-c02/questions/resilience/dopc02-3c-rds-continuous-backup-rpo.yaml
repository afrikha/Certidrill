id: dopc02-3c-rds-continuous-backup-rpo
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs its order database on an Amazon RDS for PostgreSQL Multi-AZ DB instance deployment. An AWS Backup plan takes a snapshot of the DB instance every 12 hours. A new policy sets an RPO of 15 minutes for logical errors such as an accidental DELETE statement, with recovery to a chosen point in time during the last 7 days. The company wants the LEAST operational overhead and no change to the database architecture.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the backup rule of the AWS Backup plan to take a snapshot of the DB instance every hour, and keep each snapshot for 7 days.
    - id: b
      text:
        en: |-
          Turn on continuous backup in the AWS Backup rule for the DB instance with a retention of at least 7 days, and restore to the required point in time when an error occurs.
    - id: c
      text:
        en: |-
          Create a cross-Region read replica of the DB instance, and promote the replica to a standalone DB instance when an accidental change is detected.
    - id: d
      text:
        en: |-
          Schedule an AWS Lambda function every 10 minutes that exports the changed rows of each table to Amazon S3, and import the rows again after an error.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Continuous backup in AWS Backup takes a full backup and then backs up the transaction logs, so the DB instance can be restored to a chosen second within a retention of up to 35 days. For Amazon RDS, the latest restorable time is within the last 5 minutes, which meets a 15-minute RPO without changing the database.
  options:
    a:
      en: |-
        Hourly snapshots still allow up to one hour of data loss, which fails the 15-minute RPO, and they restore only to the time of each snapshot.
    c:
      en: |-
        A read replica applies the accidental DELETE statement too, so promoting it does not recover the deleted data.
    d:
      en: |-
        A custom export and import process adds code to build and maintain and is not a consistent point-in-time recovery of the database.
references:
  - title: Continuous backups and point-in-time recovery (PITR) - AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/point-in-time-recovery.html
