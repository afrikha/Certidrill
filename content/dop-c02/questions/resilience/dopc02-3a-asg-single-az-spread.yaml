id: dopc02-3a-asg-single-az-spread
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer (ALB). The ALB is enabled in three Availability Zones, but the Auto Scaling group was created with a single private subnet in only one of those Availability Zones. Last week, an impairment of that Availability Zone made the application unavailable for two hours. The company needs the application to keep serving requests if one Availability Zone fails. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the Auto Scaling group to a larger instance type, and create a CloudWatch alarm with the EC2 recover action for each instance in the group.
    - id: b
      text:
        en: |-
          Update the Auto Scaling group to use one private subnet in each of the three Availability Zones that the ALB uses, so that instances are balanced across the zones.
    - id: c
      text:
        en: |-
          Launch the instances into a cluster placement group in the current Availability Zone, and double the minimum capacity of the Auto Scaling group.
    - id: d
      text:
        en: |-
          Deploy a copy of the whole stack in a second AWS Region, and use Amazon Route 53 failover records to send traffic there when the primary ALB is unhealthy.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An Auto Scaling group launches instances only in the Availability Zones of the subnets it is configured with. With a subnet in each of the three zones, the balanced distribution strategies keep an equal number of instances in each zone, and the balanced best effort strategy launches in another healthy zone when launches fail in one zone. The ALB already has nodes in the three zones, so traffic reaches the surviving instances with no new components.
  options:
    a:
      en: |-
        Larger instances and instance recovery still keep all the capacity in one Availability Zone, so an impairment of that zone still takes the application down.
    c:
      en: |-
        A cluster placement group packs instances close together inside one Availability Zone, which strengthens the dependency on that zone instead of removing it.
    d:
      en: |-
        A second Region also survives the loss of an Availability Zone, but it duplicates the whole stack and adds a cross-Region failover process, which is far more overhead than spreading the existing group across zones.
references:
  - title: "Auto Scaling group Availability Zone distribution - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-availability-zone-balanced.html
  - title: "Application Load Balancers - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html
