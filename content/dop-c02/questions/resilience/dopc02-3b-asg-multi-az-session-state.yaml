id: dopc02-3b-asg-multi-az-session-state
objective: "3.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs a web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. All instances run in a single Availability Zone, and each instance keeps user shopping sessions in local memory. The company must keep the application available if an Availability Zone fails. Users must not lose their sessions when the instance that served them is terminated or becomes unavailable.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add subnets in two more Availability Zones to the Auto Scaling group and the load balancer, and enable duration-based sticky sessions on the target group.
    - id: b
      text:
        en: |-
          Move sessions to a Multi-AZ Amazon ElastiCache cluster, and add subnets in two more zones to the Auto Scaling group and the load balancer.
    - id: c
      text:
        en: |-
          Replace the instances with a larger instance type in the same Availability Zone, and enable EC2 automatic recovery on each instance in the group.
    - id: d
      text:
        en: |-
          Launch the instances in a cluster placement group, and configure the Auto Scaling group to replace unhealthy instances based on load balancer health checks.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Spreading the Auto Scaling group and the load balancer across several Availability Zones keeps the application running when one zone fails, and the group keeps capacity balanced across the enabled zones. Storing sessions outside the instances in a replicated ElastiCache cluster makes the web tier stateless, so any remaining instance can serve a user whose instance is lost.
  options:
    a:
      en: |-
        Sticky sessions keep a user on the same instance, but the session data still lives in that instance's memory and is lost when the instance fails.
    c:
      en: |-
        All instances stay in one Availability Zone, so a zone failure still stops the application, and sessions remain in local memory.
    d:
      en: |-
        A cluster placement group keeps instances in a single Availability Zone, and sessions are still lost when an instance is replaced.
references:
  - title: Auto Scaling group Availability Zone distribution - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-availability-zone-balanced.html
