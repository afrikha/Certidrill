id: dopc02-3b-sfn-callback-approval
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company is building a serverless claims workflow. The workflow validates a claim with an AWS Lambda function, then sends the claim through an Amazon SQS queue to an assessment application that the company runs in the same AWS account. Human assessors can take up to five days to return a decision through that application. The workflow must then pay or reject the claim, and each payment must run exactly once. The company wants no compute resources running or polling while the workflow waits for the decision.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use an AWS Step Functions Express workflow with a Wait state of five days after the SQS task, followed by a Lambda function that reads the decision.
    - id: b
      text:
        en: |-
          Use a Lambda function that sends the claim to the queue and then polls a DynamoDB table for the decision until the function times out and is invoked again.
    - id: c
      text:
        en: |-
          Use a Step Functions Standard workflow with an SQS task that uses .waitForTaskToken, and have the application call SendTaskSuccess with the token.
    - id: d
      text:
        en: |-
          Use an AWS Step Functions Standard workflow with an Amazon ECS RunTask task that uses the .sync pattern and runs a container that waits for the decision.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The callback pattern pauses the task until an external system returns the task token with SendTaskSuccess or SendTaskFailure, with nothing running in the meantime. It is supported by Standard workflows, which can run for up to one year and have exactly-once execution semantics, which suits payments.
  options:
    a:
      en: |-
        Express workflows run for at most five minutes and are at-least-once when asynchronous, so they cannot wait five days or guarantee single payments; a fixed wait also ignores when the decision arrives.
    b:
      en: |-
        Polling from Lambda keeps compute running while waiting, which the company wants to avoid, and adds custom retry logic.
    d:
      en: |-
        The .sync pattern waits until the ECS task completes, so a container would run, and be billed, for up to five days while it waits for the decision.
references:
  - title: Discover service integration patterns in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
  - title: Choosing workflow type in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
