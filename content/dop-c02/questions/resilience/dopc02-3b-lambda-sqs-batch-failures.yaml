id: dopc02-3b-lambda-sqs-batch-failures
objective: "3.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company processes payment notifications with an AWS Lambda function that reads from an Amazon SQS standard queue through an event source mapping with a batch size of 10. The function timeout is 60 seconds, and the queue visibility timeout is 60 seconds. When one record in a batch fails validation, the function raises an exception. The operations team sees successfully processed records being processed again. The team also sees duplicates when the function is throttled during traffic peaks. The company wants to stop reprocessing records that already succeeded and to follow AWS recommendations for the queue configuration.

    Which combination of changes will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Turn on ReportBatchItemFailures on the event source mapping, and change the function to catch errors per record and return the failed message IDs in batchItemFailures.
    - id: b
      text:
        en: |-
          Reduce the batch size of the event source mapping to 1 and set a batching window of 0 seconds, and keep raising an exception when a record fails.
    - id: c
      text:
        en: |-
          Lower the function timeout to 10 seconds so that each invocation finishes well before the 60-second visibility timeout of the queue expires.
    - id: d
      text:
        en: |-
          Replace the standard queue with a FIFO queue with content-based deduplication so that a record cannot be delivered to the function twice.
    - id: e
      text:
        en: |-
          Set the visibility timeout of the queue to at least six times the function timeout, for example 360 seconds.
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      Without a partial batch response, a failure makes every message of the batch visible again, including the successful ones. With ReportBatchItemFailures, the function returns only the failed message IDs, and only those return to the queue. AWS recommends a visibility timeout of at least six times the function timeout so that Lambda has time to retry when invocations are throttled before messages become visible again.
  options:
    b:
      en: |-
        A batch size of 1 avoids reprocessing other records but greatly lowers throughput and increases invocations, and it does not fix the visibility timeout problem.
    c:
      en: |-
        A shorter timeout could stop valid long invocations and does not address throttling retries; AWS recommends raising the visibility timeout relative to the function timeout instead.
    d:
      en: |-
        Deduplication applies to messages sent by producers within the deduplication interval; it does not stop a failed batch from returning to the queue, and the ordering semantics would reduce throughput.
references:
  - title: Handling errors for an SQS event source in Lambda - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html
  - title: Creating and configuring an Amazon SQS event source mapping - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
