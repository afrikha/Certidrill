id: dopc02-3c-lambda-provisioned-schedule
objective: "3.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company exposes a Node.js AWS Lambda function through an Amazon API Gateway REST API. Every weekday between 08:00 and 10:00 local time, traffic rises within minutes from a few requests to about 400 concurrent requests. During this rise, users see high latency on many requests because new execution environments must be initialized. Outside this window the traffic is low and the latency is acceptable. The company wants to remove the initialization latency during the morning peak and pay for pre-initialized capacity only when it is needed.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the reserved concurrency of the function to 400 so that Lambda keeps 400 execution environments initialized and ready for the morning peak.
    - id: b
      text:
        en: |-
          Publish a version and an alias, point the API integration to the alias, and add Application Auto Scaling scheduled actions that raise the alias's provisioned concurrency before 08:00 and lower it after 10:00.
    - id: c
      text:
        en: |-
          Turn on Lambda SnapStart for the function, and keep the API integration pointed to the unqualified function ARN so that the $LATEST version uses the snapshot.
    - id: d
      text:
        en: |-
          Publish a version and an alias, point the API integration to the alias, and configure a fixed provisioned concurrency of 400 on the alias for the whole day.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Provisioned concurrency keeps execution environments initialized before requests arrive, and it is configured on a version or an alias that the event source must invoke. Application Auto Scaling scheduled scaling fits a predictable daily pattern: the alias has 400 pre-initialized environments only during the peak, and the company stops paying for them afterward.
  options:
    a:
      en: |-
        Reserved concurrency guarantees and caps the number of concurrent executions of the function, but it does not initialize execution environments in advance, so the peak would still see initialization latency.
    c:
      en: |-
        SnapStart supports Java, Python, and .NET runtimes, not Node.js, and it works only on published versions and aliases, never on $LATEST.
    d:
      en: |-
        A fixed provisioned concurrency removes the latency but charges for 400 pre-initialized environments all day, which fails the requirement to pay for them only when needed.
references:
  - title: Configuring provisioned concurrency for an Event Function - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
  - title: Improving startup performance with Lambda SnapStart - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/snapstart.html
