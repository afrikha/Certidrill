id: dopc02-3b-predictive-plus-target-tracking
objective: "3.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An HR software company runs a web application on Amazon EC2 instances in an Auto Scaling group with a target tracking policy on average CPU utilization. Traffic follows a strong weekday pattern: it rises sharply at 08:00 local time and falls in the evening, and the group has several months of history. New instances need about 10 minutes before they can serve requests, so users see high latency every morning until the group catches up. Unplanned spikes also occur during the day when customers run payroll. The company wants capacity in place before the morning rise, a fast reaction to unplanned spikes, and capacity removed when it is no longer needed, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the target tracking policy with a predictive scaling policy in forecast and scale mode, with instances pre-launched 10 minutes before each forecast hour.
    - id: b
      text:
        en: |-
          Add scheduled actions that raise the minimum capacity at 07:45 and lower it at 19:00 on weekdays, and remove the target tracking policy.
    - id: c
      text:
        en: |-
          Add a predictive scaling policy in forecast and scale mode with a 10-minute pre-launch buffer, and keep the target tracking policy.
    - id: d
      text:
        en: |-
          Replace the target tracking policy with a step scaling policy that adds 50% capacity when CPU utilization exceeds 40% for one minute.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Predictive scaling forecasts the daily and weekly pattern from the history and launches capacity before the forecast load; the SchedulingBufferTime (pre-launch) setting covers the 10-minute initialization. When several policies are active, the group uses the highest desired capacity, so target tracking still reacts to unplanned spikes, and it also performs scale-in, which predictive scaling does not do.
  options:
    a:
      en: |-
        Without a dynamic policy, unplanned payroll spikes are not handled, and predictive scaling never scales in, so capacity is not removed when the load falls.
    b:
      en: |-
        Scheduled actions must be maintained by hand as the pattern changes, and without target tracking the group cannot react to unplanned spikes.
    d:
      en: |-
        Step scaling is still reactive, so the 10-minute initialization still causes morning latency, and aggressive steps overshoot capacity.
references:
  - title: How predictive scaling works - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/predictive-scaling-policy-overview.html
