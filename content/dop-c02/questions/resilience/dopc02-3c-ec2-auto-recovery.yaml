id: dopc02-3c-ec2-auto-recovery
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a licensed legacy application on a single Amazon EC2 instance. The license is bound to the instance ID and the private IP address, so the instance cannot be replaced by an Auto Scaling group. The instance uses only Amazon EBS volumes and has an Elastic IP address. When an underlying hardware problem occurs, the instance must be recovered automatically with the same instance ID, private IP address, and Elastic IP address. The operations team must also receive a notification each time a recovery is started.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the StatusCheckFailed_Instance metric of the instance with the EC2 reboot action and an Amazon SNS notification action.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on the StatusCheckFailed_System metric of the instance with the EC2 recover action and an Amazon SNS notification action.
    - id: c
      text:
        en: |-
          Create daily AMIs with Amazon Data Lifecycle Manager, and use an EventBridge rule that launches a new instance from the latest AMI when the instance becomes impaired.
    - id: d
      text:
        en: |-
          Create an Auto Scaling group with a minimum, maximum, and desired capacity of one instance that launches from an AMI of the instance, with EC2 health checks.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Hardware problems on the underlying host make the system status check fail, and the recover action of a CloudWatch alarm on StatusCheckFailed_System moves the instance to another host. The recovered instance keeps its instance ID, private and Elastic IP addresses, metadata, and attached EBS volumes, and the same alarm can notify an SNS topic.
  options:
    a:
      en: |-
        The instance status check detects problems inside the instance, not host hardware failures, and a reboot keeps the instance on the same impaired host.
    c:
      en: |-
        A new instance launched from an AMI gets a new instance ID and private IP address, which breaks the license.
    d:
      en: |-
        Auto Scaling replaces an unhealthy instance with a new instance that has a new instance ID and private IP address, which breaks the license.
references:
  - title: Automatic instance recovery - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-recover.html
