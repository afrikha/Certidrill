id: dopc02-3b-ecs-managed-instances-gpu
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company runs its web services as Amazon ECS services on AWS Fargate. The company is adding a video-analysis service that runs a containerized model and needs GPU-accelerated instances. With Fargate, the platform team does not manage AMIs, patching, or the scaling of container instances, and it wants to keep it that way for the new service. The company wants to keep using Amazon ECS and its existing Fargate-compatible task definitions where possible.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Add a GPU resource requirement to the task definition of the video-analysis service, and run the service on the existing Fargate capacity provider.
    - id: b
      text:
        en: |-
          Create an EC2 capacity provider with an Auto Scaling group that uses the ECS-optimized GPU AMI, and patch the instances with Systems Manager Patch Manager.
    - id: c
      text:
        en: |-
          Create an Amazon ECS Managed Instances capacity provider whose instance requirements include a GPU accelerator type, and run the service on it.
    - id: d
      text:
        en: |-
          Deploy the video-analysis container as an AWS App Runner service with an instance configuration that requests GPU-accelerated compute.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon ECS Managed Instances runs tasks on EC2 instance types that can be chosen through a capacity provider, including GPU-accelerated types, while AWS provisions, scales, patches and maintains the instances. It is compatible with Fargate task definitions on platform version 1.4.0, so moving a service is mainly a capacity provider change.
  options:
    a:
      en: |-
        The gpu parameter is not valid for Fargate tasks, and Fargate does not let you choose GPU instance types.
    b:
      en: |-
        This works, but the team would manage the Auto Scaling group, AMI updates and patching, which it wants to avoid.
    d:
      en: |-
        App Runner is no longer open to new customers (AWS recommends Amazon ECS Express Mode instead), and moving the service to it would take it out of Amazon ECS, which the company wants to keep.
references:
  - title: Architect for Amazon ECS Managed Instances - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ManagedInstances.html
  - title: Amazon ECS task definition differences for Fargate - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-tasks-services.html
