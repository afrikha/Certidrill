id: dopc02-3a-downtime-budget-target
objective: "3.1.5"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    The product owner of a video delivery platform states that customers will tolerate at most 1 hour of unplanned downtime per year, in total. The DevOps team must translate this statement into an availability target for the architecture. To control cost, the team wants the lowest availability target that still satisfies the statement.

    Which availability target should the team use?
body:
  options:
    - id: a
      text:
        en: |-
          99.9%
    - id: b
      text:
        en: |-
          99.95%
    - id: c
      text:
        en: |-
          99.99%
    - id: d
      text:
        en: |-
          99.999%
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An availability of 99.99% allows about 52 minutes of unavailability per year, which fits within the 1-hour budget. The next lower target, 99.95%, allows about 4 hours and 22 minutes per year, which exceeds it. The Reliability Pillar also lists 99.99% as typical for video delivery workloads.
  options:
    a:
      en: |-
        99.9% allows about 8 hours and 45 minutes of unavailability per year.
    b:
      en: |-
        99.95% allows about 4 hours and 22 minutes of unavailability per year.
    d:
      en: |-
        99.999% allows only about 5 minutes per year; it meets the statement but costs more than the lowest sufficient target.
references:
  - title: "Availability - Reliability Pillar"
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html
