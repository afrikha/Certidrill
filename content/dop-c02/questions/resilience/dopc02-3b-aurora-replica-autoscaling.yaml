id: dopc02-3b-aurora-replica-autoscaling
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A news company runs an Amazon Aurora MySQL DB cluster with one writer and two Aurora Replicas. The application sends reads to the two replicas through their instance endpoints, which are listed in its configuration. When a major story breaks, read traffic multiplies for a few hours, replica CPU reaches 100%, and page loads slow down. Write traffic does not change. The company wants read capacity to grow and shrink with demand automatically and wants the application to use any new capacity without configuration changes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an Aurora Auto Scaling policy on average replica CPU utilization, and keep the application on the instance endpoints of the two existing replicas.
    - id: b
      text:
        en: |-
          Enable storage autoscaling on the cluster, and raise the maximum storage threshold so that the cluster can absorb the extra read traffic.
    - id: c
      text:
        en: |-
          Scale the writer instance to a larger DB instance class, and send all reads to the cluster endpoint during breaking news events.
    - id: d
      text:
        en: |-
          Add an Aurora Auto Scaling target tracking policy on the RDSReaderAverageCPUUtilization metric, and send reads to the cluster's reader endpoint.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Aurora Auto Scaling adds Aurora Replicas when the average CPU utilization of the readers exceeds the target and removes the replicas it created when demand falls, between a minimum and maximum of 0 to 15 replicas. The reader endpoint distributes connections across the available replicas, so the application uses new replicas without configuration changes.
  options:
    a:
      en: |-
        New replicas would be created, but the application would keep sending reads only to the two configured instance endpoints, so it would not use them.
    b:
      en: |-
        Storage autoscaling adds storage space; it does not add compute for read traffic.
    c:
      en: |-
        A larger writer requires a manual change and adds a fixed cost, and sending reads to the writer competes with write traffic instead of scaling reads automatically.
references:
  - title: Amazon Aurora Auto Scaling with Aurora Replicas - Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Integrating.AutoScaling.html
  - title: PredefinedMetricSpecification - Application Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/application/APIReference/API_PredefinedMetricSpecification.html
