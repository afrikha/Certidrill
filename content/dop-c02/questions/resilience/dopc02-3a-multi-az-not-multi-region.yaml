id: dopc02-3a-multi-az-not-multi-region
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is migrating an internal HR portal to AWS. The business requires the portal to keep working if a single data center fails. No regulation or contract requires the portal to survive the loss of a whole AWS Region, and the business accepts a recovery from backups in that unlikely case. The company wants the LOWEST cost architecture that meets these requirements.

    Which architecture should the DevOps team design?
body:
  options:
    - id: a
      text:
        en: |-
          Run the portal in two AWS Regions behind Route 53 latency records, with a database that replicates between the Regions.
    - id: b
      text:
        en: |-
          Run the portal in one Region across at least two Availability Zones, with a Multi-AZ database and regular backups.
    - id: c
      text:
        en: |-
          Run the portal in one Availability Zone, and restore it from nightly backups in another Availability Zone after a failure.
    - id: d
      text:
        en: |-
          Run the portal in one Region across two Availability Zones, and keep a scaled-down warm standby copy in a second Region.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Each Availability Zone is one or more separate data centers, so a deployment across at least two zones with a Multi-AZ database survives the loss of a data center. AWS recommends running production workloads in at least two Availability Zones and lists a multi-Region architecture where a multi-AZ one meets the business requirements as an anti-pattern, because multiple Regions add cost and complexity.
  options:
    a:
      en: |-
        An active multi-Region deployment duplicates every component and adds cross-Region data replication, which is far more than the requirements call for.
    c:
      en: |-
        A single-AZ deployment is unavailable during the restore after a data center failure, so the portal would not keep working.
    d:
      en: |-
        The warm standby in a second Region adds a permanently running copy that the business does not need, since it accepts recovery from backups after a Regional loss.
references:
  - title: "REL10-BP01 Deploy the workload to multiple locations - Reliability Pillar"
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_fault_isolation_multiaz_region_system.html
