id: dopc02-3a-s3-mrap-failover
objective: "3.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's document service reads and writes objects in an S3 bucket in us-east-1 through the AWS SDK. A second bucket exists in us-west-2. During normal operations, all requests must go to us-east-1. If us-east-1 has a Regional disruption, the service must keep reading and writing objects in us-west-2, and the failover must not require code changes or a redeployment. Objects written during the disruption must also be present in us-east-1 after it recovers.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an S3 Multi-Region Access Point for both buckets with us-east-1 active and us-west-2 passive, send all requests to it, and use its failover controls to shift traffic.
    - id: b
      text:
        en: |-
          Add both buckets to a CloudFront origin group, and send the uploads and the downloads of the service through the CloudFront distribution.
    - id: c
      text:
        en: |-
          Configure two-way S3 Cross-Region Replication rules between the bucket in us-east-1 and the bucket in us-west-2.
    - id: d
      text:
        en: |-
          Turn on S3 Transfer Acceleration for both buckets, and configure the SDK to retry failed requests against the bucket in us-west-2.
    - id: e
      text:
        en: |-
          Configure S3 Same-Region Replication from the bucket in us-east-1 to a second bucket in us-east-1.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Multi-Region Access Point failover controls support an active-passive setup: traffic goes to the active Region normally, and during a failover all requests, including GET and PUT, are directed to the bucket that you set as active. With two-way Cross-Region Replication rules, the buckets stay synchronized, so objects written in us-west-2 during the disruption are replicated back to us-east-1.
  options:
    b:
      en: |-
        CloudFront origin failover applies only to GET, HEAD, and OPTIONS requests, so uploads would not fail over to the second bucket.
    d:
      en: |-
        Transfer Acceleration speeds up transfers to one bucket; retrying against another bucket requires code changes, and nothing replicates the new objects back.
    e:
      en: |-
        Same-Region Replication keeps the copy in us-east-1, which does not help during a disruption of that Region.
references:
  - title: "Amazon S3 Multi-Region Access Points failover controls - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/MrapFailover.html
  - title: "Optimize high availability with CloudFront origin failover - Amazon CloudFront"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html
