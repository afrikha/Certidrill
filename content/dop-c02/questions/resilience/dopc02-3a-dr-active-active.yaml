id: dopc02-3a-dr-active-active
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a ticket marketplace for customers in North America and Europe from us-east-1 and eu-west-1. The business states that a Regional failure must not require any recovery step: customers must keep buying tickets from the other Region with no promotion of a database and no deployment, and nearly no confirmed purchase can be lost. Customers in each geography must also write with low latency. The business accepts the cost of running full capacity in both Regions. The purchase data is stored in Amazon DynamoDB.

    Which DR strategy will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Warm standby: run a scaled-down copy of the stack in eu-west-1 with a DynamoDB global table, and scale it out when us-east-1 fails.
    - id: b
      text:
        en: |-
          Pilot light: keep a DynamoDB global table replica in eu-west-1, and deploy the application there from templates when us-east-1 fails.
    - id: c
      text:
        en: |-
          Multi-site active/active: serve traffic from both Regions with Route 53 latency records and health checks, and store purchases in a DynamoDB global table.
    - id: d
      text:
        en: |-
          Backup and restore: copy DynamoDB backups to eu-west-1 with AWS Backup, and restore the table and the application there when us-east-1 fails.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In a multi-site active/active strategy, the workload runs and serves traffic in more than one Region, so there is no failover step: Route 53 stops answering with the unhealthy Region and the other Region keeps serving. A DynamoDB global table accepts writes in every replica Region and replicates them asynchronously, which gives local write latency and a near-zero RPO.
  options:
    a:
      en: |-
        A warm standby can serve traffic immediately but at reduced capacity and must be scaled out, and it does not let European customers write locally during normal operations.
    b:
      en: |-
        Pilot light cannot serve requests until the application is deployed, which is a recovery step that the business does not accept.
    d:
      en: |-
        Backup and restore requires restoring the data and the application after the disaster, which gives the longest recovery time and loses the changes made since the last backup.
references:
  - title: "Disaster recovery options in the cloud - Disaster Recovery of Workloads on AWS: Recovery in the Cloud"
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
  - title: "How DynamoDB global tables work - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html
