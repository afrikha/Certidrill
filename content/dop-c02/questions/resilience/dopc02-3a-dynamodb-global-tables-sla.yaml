id: dopc02-3a-dynamodb-global-tables-sla
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company stores card tokens in an Amazon DynamoDB table in us-east-1. The company wants this data layer to be covered by the 99.999% Monthly Uptime Percentage commitment of the DynamoDB SLA. The same AWS account also has five other DynamoDB tables in us-east-1 that hold reference data for the same application. The application can redirect its requests to another AWS Region during a Regional availability issue.

    Which solution will meet this requirement?
body:
  options:
    - id: a
      text:
        en: |-
          Switch the tokens table to on-demand capacity mode and turn on point-in-time recovery so that the table can be restored after a failure.
    - id: b
      text:
        en: |-
          Add a replica of the tokens table in us-west-2 to make it a global table, and keep the five reference tables as single-Region tables.
    - id: c
      text:
        en: |-
          Place a DynamoDB Accelerator (DAX) cluster with nodes in three Availability Zones in front of all six tables.
    - id: d
      text:
        en: |-
          Add a replica in us-west-2 to all six tables so that they are global tables, and fail over the application to us-west-2 during a Regional issue.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The DynamoDB SLA commits to 99.999% only when all of the customer's tables in the Region are part of global tables for the whole billing cycle and the customer makes reasonable attempts to fail over during a single-Region availability issue. Otherwise the Standard SLA of 99.99% applies. All six tables must therefore become global tables, and the application must redirect its requests during a Regional issue.
  options:
    a:
      en: |-
        Capacity mode and point-in-time recovery do not change the commitment; a single-Region table is covered by the 99.99% Standard SLA.
    b:
      en: |-
        The Standard SLA applies when any of the customer's tables in the Region are not part of global tables, so the five single-Region tables keep the Region at 99.99%.
    c:
      en: |-
        DAX is an in-memory cache in front of DynamoDB; it does not change which DynamoDB SLA applies to the tables.
references:
  - title: "Amazon DynamoDB Service Level Agreement"
    url: https://aws.amazon.com/dynamodb/sla/
  - title: "How DynamoDB global tables work - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html
