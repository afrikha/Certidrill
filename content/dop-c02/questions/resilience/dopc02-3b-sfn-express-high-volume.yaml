id: dopc02-3b-sfn-express-high-volume
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A smart-meter company receives millions of meter readings per hour through Amazon EventBridge. Each reading starts an AWS Step Functions Standard workflow of four short Lambda steps that complete in under five seconds and write the result to Amazon DynamoDB with idempotent PutItem calls. The Step Functions bill has grown with the number of state transitions, and the team has hit state transition throttling during peaks. The team does not need the execution history in the Step Functions API; CloudWatch Logs is enough.

    Which change will reduce cost and remove the throttling with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Request a quota increase for state transitions, and turn on CloudWatch Logs logging for the existing Standard workflows.
    - id: b
      text:
        en: |-
          Recreate the state machine as an Express workflow with logging to CloudWatch Logs, and start it from the EventBridge rule.
    - id: c
      text:
        en: |-
          Change the workflow type of the existing state machine from Standard to Express in the state machine settings.
    - id: d
      text:
        en: |-
          Replace the workflow with a single Lambda function that runs the four steps and is invoked by an EventBridge Pipes pipe.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Express workflows suit high-volume, short (up to five minutes), idempotent processing. They are billed by number of executions, duration and memory instead of state transitions, and they have no state transition rate limit. Their history is available through CloudWatch Logs, which meets the stated need.
  options:
    a:
      en: |-
        A quota increase may relieve throttling, but the cost driver, billing per state transition, remains.
    c:
      en: |-
        The workflow type cannot be changed after a state machine is created; a new Express state machine must be created.
    d:
      en: |-
        Rewriting the steps into one function is more effort than recreating the state machine and loses the workflow orchestration and its retry handling.
references:
  - title: Choosing workflow type in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
