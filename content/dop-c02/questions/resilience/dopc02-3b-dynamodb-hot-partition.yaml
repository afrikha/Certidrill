id: dopc02-3b-dynamodb-hot-partition
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A broadcaster runs a live voting application that stores votes in an Amazon DynamoDB table in on-demand mode. The partition key is the candidate ID, and each vote increments a counter item for the candidate. During a televised final with three candidates, the application receives about 6,000 writes per second, and many writes are throttled. CloudWatch shows that the table-level consumed write capacity is far below the table limits. The company needs the table to absorb the write rate without losing votes, and results can be computed every few seconds.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Shard the writes by adding a random suffix from a fixed range to the candidate ID, and compute each total by reading all of the candidate's shards.
    - id: b
      text:
        en: |-
          Switch the table to provisioned capacity mode with 10,000 write capacity units and auto scaling, keeping the candidate ID as the partition key.
    - id: c
      text:
        en: |-
          Add a global secondary index with the candidate ID as its partition key, and send the counter updates to the index instead of the table.
    - id: d
      text:
        en: |-
          Put a DynamoDB Accelerator (DAX) cluster in front of the table so that the cache absorbs the counter writes during the final.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A single partition supports up to 1,000 write units per second, so three candidate keys concentrate the votes on a few partitions even when the table has capacity left. Write sharding spreads each candidate across many partition key values, and the application aggregates the shards when it computes the results.
  options:
    b:
      en: |-
        More table capacity does not raise the per-partition limit, so the writes to the three hot keys would still be throttled.
    c:
      en: |-
        Applications cannot write directly to a global secondary index, and an index keyed on candidate ID would have the same hot keys.
    d:
      en: |-
        DAX is a read cache; writes go through to the table, so the hot partitions still receive every write.
references:
  - title: Best practices for designing and using partition keys effectively in DynamoDB - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html
