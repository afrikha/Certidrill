id: dopc02-3a-alb-enable-third-az
objective: "3.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company added a third Availability Zone, us-east-2c, to an Auto Scaling group that is attached to an Application Load Balancer (ALB). The instances in us-east-2c are registered in the target group, but they receive no requests, while the instances in us-east-2a and us-east-2b are busy. The ALB was created with subnets in us-east-2a and us-east-2b only.

    Which action will make the ALB send traffic to the instances in us-east-2c?
body:
  options:
    - id: a
      text:
        en: |-
          Enable us-east-2c on the ALB by adding a subnet from that zone.
    - id: b
      text:
        en: |-
          Turn on cross-zone load balancing in the target group attributes.
    - id: c
      text:
        en: |-
          Change the routing algorithm to least outstanding requests.
    - id: d
      text:
        en: |-
          Add a second listener for the instances in us-east-2c.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An ALB creates a load balancer node in each zone that you enable by specifying one subnet from that zone. Targets registered in a zone that is not enabled on the load balancer do not receive traffic, so the ALB needs a subnet in us-east-2c (with a /27 or larger CIDR block and at least eight free IP addresses).
  options:
    b:
      en: |-
        Cross-zone load balancing is already on by default for an ALB target group, and it spreads traffic only across targets in enabled zones.
    c:
      en: |-
        The routing algorithm chooses among targets that the load balancer can route to; targets in a zone that is not enabled are still excluded.
    d:
      en: |-
        Listeners define ports and rules; they do not enable Availability Zones on the load balancer.
references:
  - title: "Application Load Balancers - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html
