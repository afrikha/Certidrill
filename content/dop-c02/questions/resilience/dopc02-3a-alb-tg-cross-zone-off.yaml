id: dopc02-3a-alb-tg-cross-zone-off
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a latency-sensitive service on Amazon EC2 instances in three Availability Zones behind an Application Load Balancer (ALB). The architects are moving to a zonal isolation design: a request that enters the ALB through one Availability Zone must be served only by targets in that same zone, so that a problem with one zone's targets does not affect requests that enter through the other zones. Each zone has the same number of targets, and the company wants to keep a single ALB.

    Which configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn off cross-zone load balancing in the attributes of the load balancer itself.
    - id: b
      text:
        en: |-
          Turn on duration-based stickiness in the target group so that each client keeps the same target.
    - id: c
      text:
        en: |-
          Turn off cross-zone load balancing in the attributes of the ALB's target group.
    - id: d
      text:
        en: |-
          Create one target group per zone, and forward to all three target groups with equal weights.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      For Application Load Balancers, cross-zone load balancing is always on at the load balancer level, but it can be turned off at the target group level. When it is off, each load balancer node distributes traffic only to the registered targets in its own Availability Zone, which gives the zonal isolation that the architects want.
  options:
    a:
      en: |-
        An ALB does not let you turn off cross-zone load balancing at the load balancer level; the setting exists only on the target group.
    b:
      en: |-
        Stickiness binds a client to a target, which can be in any zone; it does not keep requests in the zone where they entered.
    d:
      en: |-
        A weighted forward action splits requests across the target groups regardless of the zone through which they entered the load balancer.
references:
  - title: "How Elastic Load Balancing works - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html
