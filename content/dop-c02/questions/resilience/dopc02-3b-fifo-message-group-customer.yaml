id: dopc02-3b-fifo-message-group-customer
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank processes account transactions through an Amazon SQS FIFO queue. Several consumers on Amazon ECS process the messages. Transactions of the same account must be processed in the exact order in which they were sent, but transactions of different accounts are independent. Today, the producer sets the same message group ID on every message, so only one transaction is processed at a time and the backlog grows during business hours. The company wants to increase processing parallelism without breaking the ordering requirement.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the message group ID of each message to the account ID of the transaction, and keep the consumers polling the same FIFO queue.
    - id: b
      text:
        en: |-
          Replace the FIFO queue with a standard queue, and add more ECS consumers so that more transactions are processed at the same time.
    - id: c
      text:
        en: |-
          Set a unique message deduplication ID on each message so that consumers can receive several messages of the group at the same time.
    - id: d
      text:
        en: |-
          Create one FIFO queue for each consumer, and have the producer distribute messages across the queues in a round-robin order.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A FIFO queue preserves strict order within a message group ID, and messages of different groups can be processed by different consumers at the same time. Using the account ID as the group ID keeps each account's transactions in order while transactions of many accounts are processed in parallel.
  options:
    b:
      en: |-
        A standard queue does not guarantee ordering, so transactions of the same account could be processed out of order.
    c:
      en: |-
        The deduplication ID only prevents duplicate messages; while a message of a group is in flight, no other message of that group is returned, whatever the deduplication ID.
    d:
      en: |-
        Round-robin distribution spreads the transactions of one account across queues and consumers, so their order is no longer guaranteed.
references:
  - title: FIFO queue delivery logic in Amazon SQS - Amazon Simple Queue Service
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-understanding-logic.html
