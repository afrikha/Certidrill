id: dopc02-3c-snapstart-java-alias
objective: "3.2.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs a Java 21 AWS Lambda function behind an Amazon API Gateway HTTP API. The function loads a large framework during initialization, and new execution environments add several seconds of latency during unpredictable traffic bursts. The company wants to reduce this startup latency without paying for execution environments that are kept initialized all the time. The API integration currently invokes the unqualified function ARN, which runs the $LATEST version. The function uses 512 MB of ephemeral storage and does not mount an Amazon EFS file system.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Turn on SnapStart for the function, and keep the API integration on the unqualified function ARN so that every invocation of $LATEST is restored from the snapshot.
    - id: b
      text:
        en: |-
          Turn on SnapStart for the function, and publish a new function version so that Lambda initializes the function and takes a snapshot of the initialized environment.
    - id: c
      text:
        en: |-
          Configure provisioned concurrency on the published version together with SnapStart so that snapshots are restored in environments that are already running.
    - id: d
      text:
        en: |-
          Increase the ephemeral storage of the function to 10,240 MB so that the snapshot can cache the framework classes between invocations.
    - id: e
      text:
        en: |-
          Create an alias that points to the published version, and update the API integration so that API Gateway invokes the alias instead of the unqualified function ARN.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      SnapStart initializes the function when a version is published, takes a snapshot of the initialized environment, and resumes new environments from that snapshot, which removes most of the framework loading time. SnapStart works only on published versions and on aliases that point to them, so the integration must invoke the alias, and for Java managed runtimes SnapStart has no additional cost.
  options:
    a:
      en: |-
        SnapStart cannot be used on the unpublished $LATEST version, so invocations of the unqualified ARN would still initialize normally.
    c:
      en: |-
        SnapStart does not support provisioned concurrency, and provisioned concurrency is the always-initialized capacity that the company does not want to pay for.
    d:
      en: |-
        SnapStart does not support ephemeral storage larger than 512 MB, so this change would prevent SnapStart from being used.
references:
  - title: Improving startup performance with Lambda SnapStart - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/snapstart.html
