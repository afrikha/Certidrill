id: dopc02-3a-serial-dependency-availability
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineering team designs an order service for 99.99% availability. The order service has two hard dependencies, an inventory service and a payment service, each designed for 99.99% availability and failing independently of each other. If either dependency is unavailable, the order service cannot process orders. A product manager asks what availability the order service can be expected to deliver and what the team should change to reach its 99.99% target.

    Which answer is correct?
body:
  options:
    - id: a
      text:
        en: |-
          About 99.99%, because a system is as available as its least available component, so the current design already meets the target.
    - id: b
      text:
        en: |-
          About 99.97%, because hard dependencies multiply; the team should remove dependencies from the critical path or make them redundant.
    - id: c
      text:
        en: |-
          About 99.9999%, because independent components add their nines; the team should add a third dependency to reach the target.
    - id: d
      text:
        en: |-
          About 99.98%, because only the two dependencies count; the team should raise the availability of the order service itself.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The availability of a workload with hard dependencies is the product of its own availability and that of each dependency: 99.99% × 99.99% × 99.99% is about 99.97%. To reach the target, the team must reduce hard dependencies, for example by turning a dependency into a soft one that the service can tolerate being unavailable, or make each dependency redundant so that its effective availability rises.
  options:
    a:
      en: |-
        Availability is not the minimum of the components: every hard dependency multiplies in, so the result is lower than any single component.
    c:
      en: |-
        Adding nines applies to independent redundant components, not to dependencies that are all required; another hard dependency would lower availability further.
    d:
      en: |-
        The order service's own availability also multiplies in, so the result is about 99.97%, not 99.98%.
references:
  - title: "Availability - Reliability Pillar"
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html
