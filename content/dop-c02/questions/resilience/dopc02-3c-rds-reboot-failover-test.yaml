id: dopc02-3c-rds-reboot-failover-test
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs its application database on an Amazon RDS for PostgreSQL Multi-AZ DB instance deployment. Before a compliance audit, the DevOps team must demonstrate that the application reconnects correctly when the primary DB instance fails over to the standby in another Availability Zone. The test must use a native Amazon RDS operation and must not change the configuration of the DB instance.

    Which action should the team take?
body:
  options:
    - id: a
      text:
        en: |-
          Modify the DB instance to a Single-AZ deployment, and then modify it back to a Multi-AZ deployment while the application is running.
    - id: b
      text:
        en: |-
          Reboot the DB instance with the force failover option, and observe how the application reconnects after the DNS record changes.
    - id: c
      text:
        en: |-
          Stop the DB instance, start it again a few minutes later, and observe how the application reconnects after the DB instance is available.
    - id: d
      text:
        en: |-
          Create a read replica of the DB instance in another Availability Zone, promote the read replica, and point the application to the promoted DB instance.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A reboot with failover (the --force-failover option of reboot-db-instance) forces the primary DB instance of a Multi-AZ deployment to fail over to its standby in another Availability Zone. Amazon RDS updates the DNS record to point to the new primary, which simulates a failure and shows whether the application cleans up and re-establishes its connections.
  options:
    a:
      en: |-
        Changing the deployment type modifies the configuration of the DB instance, and converting it back does not perform a failover to an existing standby.
    c:
      en: |-
        Stopping the DB instance makes the database unavailable instead of promoting the standby, so it does not test the Multi-AZ failover.
    d:
      en: |-
        Promoting a read replica creates a separate standalone DB instance and changes the application's endpoint, which is not a Multi-AZ failover.
references:
  - title: Rebooting a DB instance - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_RebootInstance.html
