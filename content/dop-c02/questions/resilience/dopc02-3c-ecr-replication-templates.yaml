id: dopc02-3c-ecr-replication-templates
objective: "3.2.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company deploys a containerized service to Amazon ECS on AWS Fargate in us-east-1 and is expanding the service to eu-west-1 and ap-south-1 to serve users worldwide. The CI pipeline pushes images only to private Amazon ECR repositories in us-east-1 whose names start with the prefix orders/. The ECS tasks in the new Regions must pull images from repositories in their own Region so that deployments do not depend on us-east-1. Every repository that holds these images must have tag immutability turned on and the same lifecycle policy as the source repositories. The company wants the LEAST operational overhead.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          In the us-east-1 private registry settings, add a replication rule with eu-west-1 and ap-south-1 as destinations and a repository filter on the orders prefix.
    - id: b
      text:
        en: |-
          Add a repository policy to the source repositories that allows the task execution roles in the other Regions to pull, and keep the us-east-1 image URIs in all task definitions.
    - id: c
      text:
        en: |-
          In the eu-west-1 and ap-south-1 private registry settings, add a replication rule that pulls the images of the orders repositories from the us-east-1 registry.
    - id: d
      text:
        en: |-
          In eu-west-1 and ap-south-1, create a repository creation template for the orders prefix, applied to replication, that sets tag immutability and the lifecycle policy.
    - id: e
      text:
        en: |-
          Turn on S3 Cross-Region Replication for the bucket that stores the image layers of the orders repositories, with buckets in eu-west-1 and ap-south-1 as destinations.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      ECR replication is configured in the registry settings of the source Region, can be filtered by repository prefix, and copies the images to a repository with the same name in each destination Region. Repository settings such as tag mutability and lifecycle policies are not replicated, so a repository creation template applied to replication sets them when ECR creates the destination repositories.
  options:
    b:
      en: |-
        Pulling across Regions works, but the tasks would still depend on us-east-1 for every deployment, which the requirements forbid.
    c:
      en: |-
        Replication rules are defined in the source registry and push images to the destinations; a destination registry cannot define a rule that pulls from another Region.
    e:
      en: |-
        ECR stores image layers in storage that the service manages; customers cannot access that storage or configure S3 replication on it.
references:
  - title: Private image replication in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/replication.html
  - title: Templates to control repositories created during a pull through cache, create on push, or replication action - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/repository-creation-templates.html
