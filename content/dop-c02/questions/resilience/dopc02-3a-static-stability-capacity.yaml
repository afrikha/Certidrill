id: dopc02-3a-static-stability-capacity
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a stateless web tier in an Amazon EC2 Auto Scaling group behind an Application Load Balancer in three Availability Zones. At peak, the tier needs 12 instances of the current size. A recent event showed that instance launches can be delayed during large-scale impairments, so the company wants the tier to be statically stable: losing any one Availability Zone at peak must not require launching or starting instances. The company wants the MOST cost-effective configuration that meets this goal.

    Which configuration should the company use?
body:
  options:
    - id: a
      text:
        en: |-
          Keep 12 instances, 4 in each Availability Zone, and add a target tracking scaling policy so that the group replaces lost capacity in the healthy zones.
    - id: b
      text:
        en: |-
          Run 18 instances at all times, 6 in each Availability Zone, so that any two zones can carry the peak load together.
    - id: c
      text:
        en: |-
          Run 24 instances at all times, 12 in each of two Availability Zones, and remove the third zone from the group and from the load balancer.
    - id: d
      text:
        en: |-
          Keep 12 instances, 4 in each Availability Zone, and add a warm pool of 6 stopped instances that the group can put in service when a zone fails.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Static stability means that the capacity needed after a failure is already in service before the failure. With three Availability Zones, the two surviving zones must carry the 12-instance peak, so each zone needs 6 instances, 18 in total, which is 50% more than the peak. Adding zones reduces the extra capacity that static stability requires.
  options:
    a:
      en: |-
        This design depends on launching instances during the event, which relies on the control plane and on spare capacity in the other zones: the bimodal behavior that static stability avoids.
    c:
      en: |-
        Two zones of 12 instances each are also statically stable, but they need 24 instances instead of 18, so this design is not the most cost-effective.
    d:
      en: |-
        Warm pool instances are stopped, so the group must still start them and move them into service during the event, which is not static stability.
references:
  - title: "REL11-BP05 Use static stability to prevent bimodal behavior - Reliability Pillar"
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_withstand_component_failures_static_stability.html
