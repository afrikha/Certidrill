id: dopc02-3b-nlb-udp-static-ip
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a multiplayer game backend that communicates with game clients over UDP. The servers run on Amazon EC2 instances in an Auto Scaling group across two Availability Zones. The company's partners must allow the backend through their firewalls by IP address, so the entry point must have one fixed public IP address per Availability Zone. Each client flow must stay on the same server for its lifetime, and the solution must scale to very high packet rates.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Application Load Balancer with an HTTPS listener, and enable duration-based sticky sessions on the target group of the Auto Scaling group.
    - id: b
      text:
        en: |-
          Create an internet-facing Network Load Balancer with a UDP listener and one Elastic IP address per subnet, and attach the group's target group.
    - id: c
      text:
        en: |-
          Create an Amazon CloudFront distribution with the EC2 instances as a custom origin, and give the partners the CloudFront IP address ranges.
    - id: d
      text:
        en: |-
          Assign an Elastic IP address to each EC2 instance, and create a Route 53 multivalue answer record with a health check for each instance.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Network Load Balancer works at layer 4, supports UDP listeners, and handles very high request rates. Each load balancer node has a static IP address in its Availability Zone, and an internet-facing load balancer can use one Elastic IP address per subnet. UDP flows are routed consistently to a single target for their lifetime.
  options:
    a:
      en: |-
        An Application Load Balancer handles HTTP and HTTPS only, so it cannot carry the game's UDP traffic, and its IP addresses are not fixed.
    c:
      en: |-
        CloudFront does not proxy arbitrary UDP traffic, and its IP address ranges are shared and large, not one fixed address per zone.
    d:
      en: |-
        Instances launched and terminated by the Auto Scaling group would each need a new Elastic IP address and firewall change, and there is no load balancing of flows.
references:
  - title: What is a Network Load Balancer? - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html
