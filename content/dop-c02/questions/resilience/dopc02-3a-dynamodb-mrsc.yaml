id: dopc02-3a-dynamodb-mrsc
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A fintech company is launching a ledger service that will store balances in a new, empty Amazon DynamoDB table. The service will run in us-east-1, us-east-2, and us-west-2. If any one of these Regions fails, no acknowledged write can be lost, and a strongly consistent read in any Region must always return the latest balance. The service writes single items with conditional writes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a global table with multi-Region eventual consistency in the three Regions, and use strongly consistent reads in every Region.
    - id: b
      text:
        en: |-
          Create a single-Region table in us-east-1 with point-in-time recovery, and use AWS Backup to copy its backups to the other two Regions every hour.
    - id: c
      text:
        en: |-
          Create a global table with multi-Region strong consistency in the three Regions before any data is written to the table.
    - id: d
      text:
        en: |-
          Create a table in each Region, and use DynamoDB Streams and Lambda functions to copy every change to the tables in the other two Regions.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A global table with multi-Region strong consistency (MRSC) replicates each write synchronously to at least one other Region before returning success, so it supports an RPO of zero. Strongly consistent reads on any replica return the latest version, and conditional writes are evaluated against it. An MRSC table spans exactly three Regions, and it must be created from a table that holds no items.
  options:
    a:
      en: |-
        Multi-Region eventual consistency replicates asynchronously, so its RPO equals the replication delay, and a strongly consistent read can return stale data when the item was last written in another Region.
    b:
      en: |-
        Hourly backup copies give an RPO of up to an hour, and the service would run in only one Region until a restore completes.
    d:
      en: |-
        Custom stream-based copying is asynchronous, can lose acknowledged writes during a Regional failure, and leaves conflict handling to the team.
references:
  - title: "How DynamoDB global tables work - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html
