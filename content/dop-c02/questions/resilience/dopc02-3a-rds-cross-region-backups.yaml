id: dopc02-3a-rds-cross-region-backups
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for PostgreSQL Multi-AZ DB instance deployment in eu-west-1. The DR plan requires that, if eu-west-1 becomes unavailable, the team can restore the database in eu-central-1 to any point in time within the backup retention period. The company does not want to pay for a running DB instance in eu-central-1, and it accepts a recovery time of several hours.

    Which solution will meet these requirements MOST cost-effectively?
body:
  options:
    - id: a
      text:
        en: |-
          Create a cross-Region read replica in eu-central-1, and promote it to a standalone DB instance during a disaster.
    - id: b
      text:
        en: |-
          Turn on cross-Region automated backup replication for the DB instance with eu-central-1 as the destination Region.
    - id: c
      text:
        en: |-
          Use AWS Backup to copy the daily snapshot of the DB instance to a backup vault in eu-central-1.
    - id: d
      text:
        en: |-
          Migrate the database to an Aurora PostgreSQL global database with a secondary DB cluster in eu-central-1.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Cross-Region automated backup replication copies the snapshots and the transaction logs of the DB instance to the destination Region as soon as they are ready, so the team can restore to a point in time in eu-central-1. It is supported for Multi-AZ DB instance deployments, and the company pays only for the data transfer and the backup storage, not for a running instance.
  options:
    a:
      en: |-
        A read replica is a running DB instance that is billed all the time, and promoting it gives only its latest state, not any point in time.
    c:
      en: |-
        Daily snapshot copies allow restores only to the time of each snapshot, not to any point in time.
    d:
      en: |-
        A global database needs a migration and a secondary cluster that runs and is billed continuously, which is not the most cost-effective solution.
references:
  - title: "Replicating automated backups to another AWS Region - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReplicateBackups.html
