id: dopc02-3a-aurora-managed-rpo
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon Aurora PostgreSQL global database with the primary DB cluster in us-east-1 and secondary DB clusters in us-west-2 and eu-west-1. An auditor requires that, if the primary Region is lost, no more than 60 seconds of committed transactions can be lost. When replication falls behind, the business prefers to pause writes rather than risk a larger loss. The DevOps team wants to use a managed feature instead of custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the rds.global_db_rpo parameter to 60 in the DB cluster parameter group of the primary DB cluster.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on the AuroraGlobalDBReplicationLag metric that invokes a Lambda function to revoke write privileges from the application's database user.
    - id: c
      text:
        en: |-
          Turn on write forwarding for the secondary DB clusters so that every write is committed in more than one Region before it returns.
    - id: d
      text:
        en: |-
          Schedule a global database switchover every minute so that the secondary DB clusters stay synchronized with the primary DB cluster.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Managed RPO is available for Aurora PostgreSQL-based global databases. The rds.global_db_rpo parameter sets an upper bound, in seconds, on the data that can be lost: Aurora commits a transaction when at least one secondary cluster lags by less than the RPO and blocks transactions when all secondary clusters lag more. With two secondary clusters, writes continue as long as one of them stays within 60 seconds.
  options:
    b:
      en: |-
        This is custom code that reacts only after an alarm evaluation period, so transactions can still be committed while the lag exceeds 60 seconds.
    c:
      en: |-
        Write forwarding sends writes received by a secondary cluster to the primary cluster; it does not make the primary cluster wait for replication before it commits.
    d:
      en: |-
        A switchover is a planned operation that changes the primary Region and interrupts writes; it is not a way to bound replication lag.
references:
  - title: "Using switchover or failover in Amazon Aurora Global Database - Amazon Aurora"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html
