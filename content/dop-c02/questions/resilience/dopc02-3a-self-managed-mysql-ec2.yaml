id: dopc02-3a-self-managed-mysql-ec2
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's e-commerce application uses a MySQL database that runs on a single Amazon EC2 instance with one Amazon EBS volume. The web tier already runs in an Auto Scaling group across three Availability Zones. An architecture review identifies the database as a single point of failure. The company wants the database to fail over automatically to another Availability Zone with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm that recovers the database instance automatically when its system status check fails.
    - id: b
      text:
        en: |-
          Use Amazon Data Lifecycle Manager to snapshot the EBS volume every hour, and restore the latest snapshot in another zone after a failure.
    - id: c
      text:
        en: |-
          Migrate the database to Amazon RDS for MySQL with a Multi-AZ DB instance deployment.
    - id: d
      text:
        en: |-
          Move the database to a larger instance type with an io2 EBS volume to improve the durability of the data.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In a Multi-AZ DB instance deployment, Amazon RDS provisions and maintains a synchronous standby replica in a different Availability Zone and fails over to it automatically. As a managed service, RDS also removes the operating system and database administration of the self-managed instance.
  options:
    a:
      en: |-
        Instance recovery brings the instance back in the same Availability Zone, so it does not help when that zone fails.
    b:
      en: |-
        Restoring snapshots is a manual process that loses up to an hour of data, not an automatic failover.
    d:
      en: |-
        A larger instance and a more durable volume still form a single instance in one Availability Zone.
references:
  - title: "Multi-AZ DB instance deployments for Amazon RDS - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
