id: dopc02-3b-default-instance-warmup
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a Java API on Amazon EC2 instances in an Auto Scaling group with a target tracking policy that keeps average CPU utilization at 50%. The group uses the default cooldown of 300 seconds and has no default instance warmup configured. Each new instance runs at nearly 100% CPU for about 8 minutes while it loads caches, and it serves traffic only after that. During each scale-out, the group launches several waves of instances and ends up with far more capacity than the load requires, then scales in later. The company wants to stop this overshoot by following AWS recommendations.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the health check grace period of the group to 600 seconds so that new instances are not evaluated until their caches are loaded.
    - id: b
      text:
        en: |-
          Set a default instance warmup of about 540 seconds so that new instances stay out of the aggregated metrics while they initialize.
    - id: c
      text:
        en: |-
          Raise the target value of the target tracking policy from 50% to 80% so that the high CPU of new instances triggers fewer scale-out activities.
    - id: d
      text:
        en: |-
          Turn on instance scale-in protection for new instances so that the extra capacity launched during scale-out is not removed and relaunched.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Until its warmup time expires, an instance is not counted in the group's aggregated metrics, and while instances warm up the policy scales out only if the instances that are not warming up exceed the target. Without a default instance warmup, target tracking falls back to the default cooldown (300 seconds), which is shorter than the 8-minute initialization, so the high CPU of new instances triggers more scale-out. AWS recommends setting the default instance warmup, which is not enabled by default.
  options:
    a:
      en: |-
        The grace period only delays health check evaluation; the new instances' CPU metrics still feed the aggregated metric and cause the overshoot.
    c:
      en: |-
        A higher target makes the group run hotter at steady state, and new instances at nearly 100% CPU still push the average up, so the overshoot remains.
    d:
      en: |-
        Scale-in protection keeps the unnecessary instances running longer instead of preventing their launch, which increases cost.
references:
  - title: Set the default instance warmup for an Auto Scaling group - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-default-instance-warmup.html
  - title: Target tracking scaling policies for Amazon EC2 Auto Scaling - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
