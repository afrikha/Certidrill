id: dopc02-3b-lambda-pc-utilization-metric
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company exposes a pricing API through Amazon API Gateway and an AWS Lambda function. The function is invoked through an alias named live, which has provisioned concurrency set to a fixed value. Traffic varies during the day, and customers see cold-start latency when traffic exceeds the provisioned value. At night, most of the provisioned concurrency is idle, which increases cost. The company wants provisioned concurrency to follow demand automatically with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the ConcurrentExecutions metric of the function, and invoke a Lambda function from the alarm that calls PutProvisionedConcurrencyConfig with a new value.
    - id: b
      text:
        en: |-
          Register the live alias as a scalable target in Application Auto Scaling, and create a target tracking policy on the LambdaProvisionedConcurrencyUtilization metric.
    - id: c
      text:
        en: |-
          Set reserved concurrency on the function to the expected daily peak so that Lambda keeps enough execution environments initialized for traffic spikes.
    - id: d
      text:
        en: |-
          Register the $LATEST version as a scalable target in Application Auto Scaling, and create a target tracking policy on the Invocations metric of the function.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Application Auto Scaling can manage provisioned concurrency on a function alias or version. A target tracking policy on the predefined LambdaProvisionedConcurrencyUtilization metric creates the CloudWatch alarms and adds or removes provisioned concurrency to keep utilization near the target (for example 0.7), so capacity follows demand without custom code.
  options:
    a:
      en: |-
        This custom alarm-and-function design works but must be built and maintained, which is more overhead than the managed target tracking policy.
    c:
      en: |-
        Reserved concurrency only guarantees and caps concurrency; it does not keep execution environments initialized, so cold starts remain.
    d:
      en: |-
        Provisioned concurrency cannot be applied to $LATEST, and the total number of invocations is not a utilization metric for provisioned concurrency.
references:
  - title: Configuring provisioned concurrency for an Event Function - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
  - title: PredefinedMetricSpecification - Application Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/application/APIReference/API_PredefinedMetricSpecification.html
