id: dopc02-3c-fis-aurora-failover
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon Aurora PostgreSQL DB cluster with one writer instance and two reader instances in different Availability Zones. The site reliability team wants to run a monthly game day that forces an Aurora failover while synthetic traffic runs against the application. The test must stop automatically if the application's error-rate CloudWatch alarm enters the ALARM state. The team wants a managed solution that keeps a record of each test, with the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an EventBridge Scheduler schedule that invokes a Lambda function each month to call the FailoverDBCluster API and poll the error-rate alarm during the test.
    - id: b
      text:
        en: |-
          Create an AWS FIS experiment template with the aws:rds:reboot-db-instances action and the forceFailover parameter set to true, targeting the writer instance, with the alarm as a stop condition.
    - id: c
      text:
        en: |-
          Create an AWS FIS experiment template with the aws:rds:failover-db-cluster action targeting the DB cluster, and add the error-rate alarm as a stop condition.
    - id: d
      text:
        en: |-
          Create a Systems Manager Automation runbook that reboots each reader instance in turn, and add a step that checks the error-rate alarm between the reboots.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The AWS FIS action aws:rds:failover-db-cluster runs the FailoverDBCluster API on the target Aurora DB cluster, which promotes a reader to writer. A stop condition based on a CloudWatch alarm stops the experiment automatically, and FIS keeps the history of each experiment that runs from the template.
  options:
    a:
      en: |-
        The custom function would have to implement the failover, the alarm monitoring, and the stopping logic, which is more custom code than an FIS experiment.
    b:
      en: |-
        The forceFailover parameter applies to Multi-AZ DB instance deployments; rebooting an Aurora writer instance does not promote a reader.
    d:
      en: |-
        Rebooting reader instances does not force the writer to fail over, so the test would not exercise the failover behavior of the application.
references:
  - title: AWS FIS Actions reference - AWS Fault Injection Service
    url: https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html
