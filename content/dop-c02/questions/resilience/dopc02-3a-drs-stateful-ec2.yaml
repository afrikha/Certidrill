id: dopc02-3a-drs-stateful-ec2
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company runs a legacy stateful application on three Amazon EC2 instances in us-east-2. Each instance has large Amazon EBS data volumes, and the vendor does not support any change to the application or its embedded database. The DR plan requires recovery in us-west-2 with an RPO of seconds and an RTO of minutes. The company does not want to pay for full-size standby instances while there is no disaster.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use AWS Backup to take hourly snapshots of the EBS volumes and copy them to us-west-2, then create volumes and instances from the latest copies during a disaster.
    - id: b
      text:
        en: |-
          Create daily AMIs of the instances with Amazon Data Lifecycle Manager, copy them to us-west-2, and launch instances from the AMIs during a disaster.
    - id: c
      text:
        en: |-
          Run three identical instances in us-west-2 at all times, and synchronize their data volumes every minute with a cron job that runs rsync.
    - id: d
      text:
        en: |-
          Set up AWS Elastic Disaster Recovery to replicate the instances to a staging area in us-west-2, and launch recovery instances during a disaster.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS Elastic Disaster Recovery continuously replicates the blocks written to the source disks into a staging area in the chosen Region, which uses low-cost storage and minimal compute. It supports RPOs of seconds and RTOs of minutes, and it can recover EC2 instances in another Region by launching recovery instances only when needed, without changing the application.
  options:
    a:
      en: |-
        Hourly snapshots give an RPO of up to an hour, and rebuilding volumes and instances by hand lengthens the recovery time.
    b:
      en: |-
        Daily AMIs give an RPO of up to a day, far beyond the required seconds.
    c:
      en: |-
        Full-size standby instances cost money all the time, copying open database files with rsync is not crash consistent, and a one-minute schedule cannot give an RPO of seconds.
references:
  - title: "AWS Elastic Disaster Recovery FAQs"
    url: https://aws.amazon.com/disaster-recovery/faqs/
  - title: "What is Elastic Disaster Recovery? - AWS Elastic Disaster Recovery"
    url: https://docs.aws.amazon.com/drs/latest/userguide/what-is-drs.html
