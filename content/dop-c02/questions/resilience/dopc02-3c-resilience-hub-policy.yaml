id: dopc02-3c-resilience-hub-policy
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys dozens of applications with AWS CloudFormation. For each application, the owner has agreed with the business on RTO and RPO targets for application, infrastructure, Availability Zone, and Region disruptions. The DevOps team must check whether each application can meet its targets and get recommendations for alarms, standard operating procedures, and fault injection tests. The team must also learn when a later change makes an application stop meeting its targets. The team wants a managed AWS service instead of a custom assessment tool.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Review the fault tolerance checks of AWS Trusted Advisor for each account, and create an EventBridge rule that notifies the team when a check status changes.
    - id: b
      text:
        en: |-
          Create an AWS Backup Audit Manager framework with the controls for backup frequency, retention, and restore time, and generate a daily report for each application.
    - id: c
      text:
        en: |-
          Deploy an AWS Config conformance pack of resilience-related managed rules to every account, and review the noncompliant resources of each application.
    - id: d
      text:
        en: |-
          Add each application to AWS Resilience Hub with a resiliency policy that holds its RTO and RPO targets, run assessments, and act on the recommendations and drift results.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS Resilience Hub assesses each application against a resiliency policy that sets RTO and RPO targets for application, infrastructure, Availability Zone, and Region disruptions. Its assessments report gaps and produce recommendations for alarms, standard operating procedures, and AWS Fault Injection Service experiments, and drift detection flags application components that met the policy in a previous assessment but no longer do.
  options:
    a:
      en: |-
        Trusted Advisor checks general fault tolerance best practices per account; it does not evaluate applications against their own RTO and RPO targets or recommend operating procedures and experiments.
    b:
      en: |-
        Backup Audit Manager audits backup settings and restore times, but it does not assess the whole application against Availability Zone and Region disruptions or recommend alarms and fault injection tests.
    c:
      en: |-
        Config rules evaluate individual resource configurations; they have no notion of an application's RTO and RPO targets and do not recommend procedures or tests.
references:
  - title: AWS Resilience Hub concepts - AWS Resilience Hub
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/concepts-terms.html
  - title: What is AWS Resilience Hub? - AWS Resilience Hub
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/what-is.html
