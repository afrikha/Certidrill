id: dopc02-3b-ecs-service-scaling-metric
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a CPU-intensive report-rendering API as an Amazon ECS service on AWS Fargate. The service sits behind an Application Load Balancer, and each request takes a variable amount of CPU depending on the size of the report. Memory usage stays stable as load increases. The DevOps team wants to add Service Auto Scaling so that the number of tasks follows the CPU load of the service.

    Which metric should the team use in a target tracking scaling policy?
body:
  options:
    - id: a
      text:
        en: |-
          The ECSServiceAverageMemoryUtilization predefined metric of the service.
    - id: b
      text:
        en: |-
          The RequestCount metric of the Application Load Balancer for the whole load balancer.
    - id: c
      text:
        en: |-
          The ECSServiceAverageCPUUtilization predefined metric of the service.
    - id: d
      text:
        en: |-
          The CPUReservation metric of the ECS cluster that runs the service.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      ECSServiceAverageCPUUtilization is a predefined Application Auto Scaling metric for ECS services. It measures the average CPU use of the service's tasks, which tracks this CPU-bound workload better than request counts when the cost of each request varies.
  options:
    a:
      en: |-
        Memory usage stays stable as load increases, so a memory metric would not trigger scaling when the service needs more tasks.
    b:
      en: |-
        The total request count of the load balancer does not change in proportion to the number of tasks, and requests have very different CPU costs here.
    d:
      en: |-
        CPUReservation describes how much of the cluster's registered EC2 capacity is reserved by tasks; it is not a utilization metric of a Fargate service.
references:
  - title: Use a target metric to scale Amazon ECS services - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-autoscaling-targettracking.html
  - title: PredefinedMetricSpecification - Application Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/application/APIReference/API_PredefinedMetricSpecification.html
