id: dopc02-3b-sqs-esm-max-concurrency
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has an AWS Lambda function that reads orders from two Amazon SQS queues through two event source mappings: a priority queue and a bulk queue. Each order calls a partner API that the partner limits to about 20 concurrent requests from the bulk channel. During bulk imports, the bulk queue scales the function to hundreds of concurrent executions, the partner API rejects calls, and priority orders are delayed. The function has reserved concurrency of 100. The company wants to limit only the bulk queue to 20 concurrent invocations while priority orders keep the remaining capacity, without adding services.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the maximum concurrency of the bulk queue's event source mapping to 20, and set no maximum concurrency on the priority queue's mapping.
    - id: b
      text:
        en: |-
          Lower the reserved concurrency of the function to 20 so that the bulk queue cannot invoke more than 20 instances of the function.
    - id: c
      text:
        en: |-
          Set the batch size of the bulk queue's event source mapping to 20 and the batching window to 300 seconds so that fewer invocations run at once.
    - id: d
      text:
        en: |-
          Set the maximum concurrency of both event source mappings to 20 so that neither queue can send more than 20 concurrent requests to the partner.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Maximum concurrency is an event source level setting that limits how many concurrent function instances one SQS event source can invoke, so the bulk queue is capped at 20 while the priority queue can still use the rest of the function's reserved concurrency of 100. It costs nothing to configure, and the total of the maximums stays below the reserved concurrency, as AWS recommends.
  options:
    b:
      en: |-
        Reserved concurrency applies to the whole function, so priority orders would also be limited to 20 and would be throttled during bulk imports.
    c:
      en: |-
        Batch size and batching window change how many records each invocation receives, not how many invocations run concurrently.
    d:
      en: |-
        Only the bulk channel is limited by the partner; capping the priority queue at 20 as well takes capacity away from priority orders.
references:
  - title: Configuring scaling behavior for SQS event source mappings - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html
