id: dopc02-3a-requirements-to-aurora-design
objective: "3.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A retailer's checkout database runs on an Amazon Aurora MySQL DB cluster in us-east-1 that has a single writer instance and no reader instances. The business defines two requirements. If an Availability Zone fails, the database must recover automatically, typically in less than a minute, without losing committed transactions. If the Region fails, the database must become writable in us-west-2 within 15 minutes, with only the most recent seconds of transactions at risk.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add an Aurora Replica to the DB cluster in a different Availability Zone from the writer instance.
    - id: b
      text:
        en: |-
          Rely on Aurora to recover the writer instance automatically when its Availability Zone fails.
    - id: c
      text:
        en: |-
          Use AWS Backup to copy snapshots of the DB cluster to us-west-2 every hour.
    - id: d
      text:
        en: |-
          Add the DB cluster to an Aurora global database with a secondary DB cluster in us-west-2.
    - id: e
      text:
        en: |-
          Turn on Aurora Backtrack for the DB cluster with a target window of 24 hours.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Aurora replicates every write synchronously across Availability Zones to six storage nodes of the cluster volume. With an Aurora Replica in another zone, Aurora promotes it when the writer fails, and service is typically restored in less than 60 seconds without losing committed data. An Aurora global database replicates asynchronously to a secondary cluster in us-west-2 that can be promoted to take writes in minutes, so only transactions not yet replicated are at risk.
  options:
    b:
      en: |-
        Without a replica, Aurora recovers the writer host in the same Availability Zone, which typically takes up to 10 minutes; if the whole zone is out, someone must create a new instance in another zone.
    c:
      en: |-
        Hourly snapshot copies give an RPO of up to an hour, and restoring a cluster from a snapshot can exceed the 15-minute target.
    e:
      en: |-
        Backtrack rewinds the cluster in place to an earlier time to undo mistakes; it does not protect against the loss of an Availability Zone or a Region.
references:
  - title: "High availability for Amazon Aurora - Amazon Aurora"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html
  - title: "Using switchover or failover in Amazon Aurora Global Database - Amazon Aurora"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html
