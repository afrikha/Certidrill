id: dopc02-3a-elasticache-global-promote
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel booking company caches seat availability in Amazon ElastiCache for Valkey. The cache is part of a global datastore: the primary cluster is in us-east-1 and a secondary cluster is in us-west-2. The application runs in both Regions, and the us-west-2 copy only reads from its local cluster. The DR runbook states that if us-east-1 has a Regional disruption, the application in us-west-2 must start writing to the cache in us-west-2 with the data that was already replicated, without waiting for a rebuild.

    Which runbook step will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call the TestFailover API on a node group of the primary cluster so that a replica in another Availability Zone of us-east-1 becomes the primary node.
    - id: b
      text:
        en: |-
          Restore the most recent backup of the primary cluster to a new cluster in us-west-2, and point the application in us-west-2 at the new cluster.
    - id: c
      text:
        en: |-
          Promote the secondary cluster in us-west-2 to be the primary cluster of the global datastore, and send the application's writes to it.
    - id: d
      text:
        en: |-
          Point the application's writes at the reader endpoint of the secondary cluster in us-west-2, which forwards them to the primary cluster.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In a global datastore, the primary cluster accepts writes and secondary clusters in other Regions accept only reads while replicating asynchronously. If the primary cluster is degraded, you promote a secondary cluster to be the new primary, from the Region that contains it. The promoted cluster already holds the replicated data, so writes can start in us-west-2 without a restore.
  options:
    a:
      en: |-
        A failover inside us-east-1 changes the primary node within the Region that is disrupted; it does not make the us-west-2 cluster writable.
    b:
      en: |-
        Restoring a backup builds a new cluster from an older point in time, which is slower and loses the changes that were already replicated to us-west-2.
    d:
      en: |-
        A secondary cluster only accepts read requests; ElastiCache does not forward writes from a secondary cluster to the primary cluster.
references:
  - title: "Replication across AWS Regions using global datastores - Amazon ElastiCache"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Redis-Global-Datastore.html
