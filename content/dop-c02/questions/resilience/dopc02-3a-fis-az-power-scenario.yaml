id: dopc02-3a-fis-az-power-scenario
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is preparing to launch an application that runs on Amazon EC2 instances in Auto Scaling groups, an Amazon Aurora DB cluster with a writer and a reader in different Availability Zones, and an Amazon ElastiCache replication group. Architects suspect that some components still depend on a single Availability Zone. Before launch, the DevOps team wants to observe how the whole application behaves when one Availability Zone loses power completely, including the loss of network connectivity in its subnets and the database and cache failovers. The experiment must stop automatically if the customer-facing error rate alarm in CloudWatch goes into the ALARM state.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Fault Injection Service experiment template from the AZ Availability: Power Interruption scenario, tag the target resources, and add the error rate alarm as a stop condition.
    - id: b
      text:
        en: |-
          Run an AWS Resilience Hub assessment of the application, and review the estimated RTO for Availability Zone disruptions in the assessment report.
    - id: c
      text:
        en: |-
          Start an Amazon Application Recovery Controller (ARC) zonal shift away from one Availability Zone for the load balancer, and watch the error rate alarm during the shift.
    - id: d
      text:
        en: |-
          Write a Systems Manager Automation runbook that stops the instances in one Availability Zone and reboots the database, and run it manually.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The AZ Availability: Power Interruption scenario of AWS FIS injects the expected symptoms of a complete power loss in one Availability Zone: it stops instances, pauses launches, disrupts subnet connectivity, fails over RDS and Aurora clusters, and pauses ElastiCache replication. Targets are selected by tags. The scenario has no stop conditions by default, so the team adds the error rate alarm as one.
  options:
    b:
      en: |-
        An assessment estimates whether the application meets its RTO and RPO targets; it does not inject any failure, so hidden dependencies stay hidden.
    c:
      en: |-
        A zonal shift only moves traffic away from a zone; the database, the cache, and the subnets of that zone keep working, so the experiment does not reproduce a power loss.
    d:
      en: |-
        A custom runbook covers only part of the symptoms (no network disruption, no cache failover) and has no automatic stop condition, which is more effort for a weaker test.
references:
  - title: "AZ Availability: Power Interruption - AWS Fault Injection Service"
    url: https://docs.aws.amazon.com/fis/latest/userguide/az-availability-scenario.html
