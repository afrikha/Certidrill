id: dopc02-3b-lambda-reserved-concurrency
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs about 30 AWS Lambda functions in one account and Region, which has the default concurrency quota of 1,000. A payment-authorization function needs up to 200 concurrent executions. Every night, a reporting function that processes files from Amazon S3 scales to more than 900 concurrent executions, and payment requests then fail with throttling errors. The other functions in the account also have unpredictable traffic. The company must guarantee that the payment function can always reach 200 concurrent executions, whatever the other functions do.

    Which solution will meet these requirements MOST cost-effectively?
body:
  options:
    - id: a
      text:
        en: |-
          Request an increase of the account concurrency quota through Service Quotas, and monitor the ConcurrentExecutions metric with a CloudWatch alarm.
    - id: b
      text:
        en: |-
          Configure provisioned concurrency of 200 on an alias of the payment function, and invoke the payment function through that alias.
    - id: c
      text:
        en: |-
          Configure reserved concurrency of 200 on the payment function so that this capacity is set aside for it in the account.
    - id: d
      text:
        en: |-
          Configure reserved concurrency of 700 on the reporting function so that it can no longer consume the capacity that the payment function needs.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Reserved concurrency removes capacity from the shared unreserved pool and sets it aside for one function, so other functions cannot consume it. Configuring reserved concurrency has no additional charge, which makes it the most cost-effective way to guarantee the 200 executions.
  options:
    a:
      en: |-
        A higher quota is still a shared pool, so the reporting function could consume it again, and nothing guarantees capacity to the payment function.
    b:
      en: |-
        Provisioned concurrency also guarantees initialized capacity, but it is charged while configured, so it is not the most cost-effective choice when cold starts are not the problem.
    d:
      en: |-
        Capping the reporting function leaves 300 in the shared pool, which the other functions can still consume, so 200 executions are not guaranteed to the payment function.
references:
  - title: Configuring reserved concurrency for an Event Function - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-concurrency.html
  - title: Understanding Lambda Event Function scaling - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html
