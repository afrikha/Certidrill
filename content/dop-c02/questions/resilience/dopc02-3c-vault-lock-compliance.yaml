id: dopc02-3c-vault-lock-compliance
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company stores its AWS Backup recovery points in a dedicated backup vault. After a ransomware incident at another company, the security team requires that nobody, including the root user of the account and administrators with full IAM permissions, can delete recovery points or shorten their retention before it ends. Any backup or copy job that sets a retention shorter than 30 days must fail. The team wants a short period after applying the configuration during which it can still correct a mistake.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Apply AWS Backup Vault Lock to the vault in governance mode with a minimum retention of 30 days.
    - id: b
      text:
        en: |-
          Add a vault access policy that denies backup:DeleteRecoveryPoint and backup:UpdateRecoveryPointLifecycle to every principal except a break-glass role.
    - id: c
      text:
        en: |-
          Apply AWS Backup Vault Lock to the vault in compliance mode with a minimum retention of 30 days and a grace time of 3 days.
    - id: d
      text:
        en: |-
          Attach a service control policy to the account that denies backup:DeleteRecoveryPoint and backup:UpdateRecoveryPointLifecycle for all principals.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In compliance mode, Vault Lock can be changed or removed only during its grace time, which is at least 3 days; after the lock date, no user, including the root user, and not even AWS can change or delete the lock, delete recovery points, or change their lifecycle before the retention ends. The minimum retention setting makes backup and copy jobs with a shorter retention fail.
  options:
    a:
      en: |-
        In governance mode, users with sufficient IAM permissions can remove or change the lock, so administrators could still delete recovery points.
    b:
      en: |-
        An administrator with full permissions can edit or delete the vault access policy, and a policy does not make jobs with a short retention fail.
    d:
      en: |-
        Administrators of the organization can detach the SCP, and an SCP does not enforce a minimum retention on backup jobs.
references:
  - title: AWS Backup Vault Lock - AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html
