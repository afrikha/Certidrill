id: dopc02-3b-eks-pod-readiness-gates
objective: "3.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys a web application to Amazon EKS as a Kubernetes Deployment with rolling updates. The AWS Load Balancer Controller exposes the pods through an Application Load Balancer with IP targets. The pods have readiness probes and a preStop hook, and the application drains in-flight requests on SIGTERM. During each rolling update, clients receive 502 and 503 errors for a short time. Investigation shows that old pods are terminated while the new pods are still registering in the target group and have not yet passed the load balancer health checks.

    Which solution will prevent these errors?
body:
  options:
    - id: a
      text:
        en: |-
          Change the target type of the Ingress to instance so that the load balancer sends traffic to node ports instead of pod IP addresses.
    - id: b
      text:
        en: |-
          Set the deregistration delay of the target group to 0 seconds so that terminating pods are removed from the target group immediately.
    - id: c
      text:
        en: |-
          Enable pod readiness gate injection for the namespace so that new pods become Ready only after their load balancer targets are healthy.
    - id: d
      text:
        en: |-
          Add a liveness probe to the pods so that Kubernetes restarts containers that do not respond before the load balancer sends them traffic.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With pod readiness gates, the AWS Load Balancer Controller sets the pod condition to Ready only after the pod is registered and healthy as a target. The rolling update then waits for new pods to be healthy on the load balancer before it terminates old pods, which removes the gap that causes the errors.
  options:
    a:
      en: |-
        Instance targets add a node-level hop and make the load balancer health status a less direct reflection of pod health; they do not make the rollout wait for target registration.
    b:
      en: |-
        A zero deregistration delay drops in-flight requests on terminating pods, which adds errors instead of fixing the registration gap.
    d:
      en: |-
        A liveness probe restarts unhealthy containers; it does not make the rollout wait for new pods to become healthy targets.
references:
  - title: Load Balancing - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/best-practices/load-balancing.html
