id: dopc02-3a-private-nat-per-az
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's application VPC has private subnets in three Availability Zones. The workloads reach a partner network that has an overlapping CIDR range through a transit gateway, so all private subnets send that traffic to a single private NAT gateway in us-east-1a through one shared route table. A failure review flags this design as a single point of failure for partner connectivity. The company must make sure that the loss of one Availability Zone does not interrupt partner traffic from the other zones.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the private NAT gateway with a regional NAT gateway, and point the shared route table of the private subnets at the regional NAT gateway ID.
    - id: b
      text:
        en: |-
          Create a private NAT gateway in each Availability Zone, and give the private subnets of each zone a route table that targets the NAT gateway in the same zone.
    - id: c
      text:
        en: |-
          Create a second private NAT gateway in us-east-1b, and add a second route for the partner CIDR range to the shared route table that targets the new NAT gateway.
    - id: d
      text:
        en: |-
          Replace the private NAT gateway with a NAT instance in an Auto Scaling group that has a minimum and maximum of one instance across the three Availability Zones.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A zonal NAT gateway runs in a single Availability Zone, so for high availability you create one NAT gateway per zone and route each zone's private subnets to the NAT gateway in the same zone. The loss of one zone then affects only the subnets of that zone. This is the design for private NAT, which regional NAT gateways do not support.
  options:
    a:
      en: |-
        Regional NAT gateways do not support private NAT; AWS directs workloads that need private connectivity to zonal NAT gateways.
    c:
      en: |-
        A route table cannot hold two routes for the same destination CIDR range, and a shared table gives no zone affinity, so this does not remove the single point of failure.
    d:
      en: |-
        A single NAT instance is still one point of failure; replacing it after a zone failure takes minutes, drops connections, and adds instance management.
references:
  - title: "Regional NAT gateways for automatic multi-AZ expansion - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html
