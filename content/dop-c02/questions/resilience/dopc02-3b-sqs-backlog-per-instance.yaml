id: dopc02-3b-sqs-backlog-per-instance
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company processes image-conversion jobs from an Amazon SQS standard queue with Amazon EC2 instances in an Auto Scaling group. Each instance processes one message at a time, and processing takes 0.5 seconds on average. Most of that time is spent waiting on a downstream API, so CPU utilization stays low even when the queue grows. The business accepts that a message waits at most 60 seconds before processing starts. Today, a target tracking policy on average CPU utilization rarely scales out, and messages wait several minutes during peaks. The company wants the group to scale in proportion to the work waiting in the queue without publishing custom metrics from application code.

    Which scaling configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          A target tracking policy on the ApproximateNumberOfMessagesVisible metric of the queue, with a target value of 120.
    - id: b
      text:
        en: |-
          A target tracking policy on a metric math expression that divides ApproximateNumberOfMessagesVisible by GroupInServiceInstances, with a target value of 30.
    - id: c
      text:
        en: |-
          A target tracking policy on the ASGAverageCPUUtilization metric of the group, with a lower target value of 20.
    - id: d
      text:
        en: |-
          A target tracking policy on a metric math expression that divides ApproximateNumberOfMessagesVisible by GroupInServiceInstances, with a target value of 120.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The backlog per instance (visible messages divided by InService instances) changes in proportion to the group size, so it is a valid target tracking metric, and a metric math expression avoids publishing a custom metric. The target is the acceptable backlog per instance: acceptable latency divided by average processing time, 60 / 0.5 = 120 messages per instance.
  options:
    a:
      en: |-
        The total number of visible messages does not change in proportion to the number of instances, so the policy can add more instances than needed while the queue drains.
    b:
      en: |-
        The metric is right, but 30 multiplies latency by processing time instead of dividing it, which scales out far more than the 60-second latency requires.
    c:
      en: |-
        CPU utilization does not reflect this I/O-bound workload, so a lower CPU target still does not follow the queue backlog.
references:
  - title: Scaling policy based on Amazon SQS - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html
  - title: Create a target tracking scaling policy using metric math - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-target-tracking-metric-math.html
