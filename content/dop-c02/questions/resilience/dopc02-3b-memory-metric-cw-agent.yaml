id: dopc02-3b-memory-metric-cw-agent
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a Java caching service on Amazon EC2 Linux instances in an Auto Scaling group. Load tests show that the instances run out of memory long before CPU utilization exceeds 30%. The group has a target tracking policy on average CPU utilization, so it does not scale out before the instances fail. The DevOps team wants the group to scale on the average memory utilization of its instances. The instances use an IAM role that allows them to publish CloudWatch metrics.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Install the CloudWatch agent to publish mem_used_percent aggregated on the AutoScalingGroupName dimension, and target track on that metric.
    - id: b
      text:
        en: |-
          Enable detailed monitoring on the launch template so that EC2 publishes memory utilization every minute, and create a target tracking policy on that metric.
    - id: c
      text:
        en: |-
          Enable group metrics collection on the Auto Scaling group, and create a target tracking policy on the GroupInServiceCapacity metric with a memory-based target.
    - id: d
      text:
        en: |-
          Install the CloudWatch agent with mem_used_percent per instance, and create a step scaling policy with one alarm for each instance ID in the group.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The CloudWatch agent collects mem_used_percent on Linux, which the default EC2 metrics do not include. Adding the AutoScalingGroupName dimension with append_dimensions and rolling up on it with aggregation_dimensions produces one metric for the whole group, which can drive a target tracking policy as a custom utilization metric.
  options:
    b:
      en: |-
        Detailed monitoring only increases the frequency of the default EC2 metrics; it does not add memory utilization, which requires the CloudWatch agent.
    c:
      en: |-
        GroupInServiceCapacity counts capacity units in service; it does not measure memory usage and does not change with load.
    d:
      en: |-
        Per-instance alarms do not follow instances that are launched or terminated, so the policy would break as soon as the group scales.
references:
  - title: Manually create or edit the CloudWatch agent configuration file - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
  - title: Metrics collected by the CloudWatch agent - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/metrics-collected-by-CloudWatch-agent.html
