id: dopc02-3c-dynamodb-pitr-restore
objective: "3.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A faulty release corrupted items in the Orders table in Amazon DynamoDB at 14:05 UTC. Point-in-time recovery has been turned on for the table for 20 days. The table uses provisioned capacity with auto scaling, a Time to Live (TTL) attribute, DynamoDB Streams that feed an AWS Lambda function, CloudWatch alarms, and cost allocation tags. The team must recover the data as it was at 14:04 UTC and make the recovered table behave exactly like the original table before the application is switched to it.

    Which combination of actions should the recovery runbook include? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run the restore-table-to-point-in-time command with Orders as both the source and the target table name so that the corrupted items are overwritten in place.
    - id: b
      text:
        en: |-
          Turn point-in-time recovery off and on again on the Orders table before the restore so that the latest restorable time is refreshed.
    - id: c
      text:
        en: |-
          Run the restore-table-to-point-in-time command with Orders as the source table, a new target table name, and a restore date and time of 14:04 UTC.
    - id: d
      text:
        en: |-
          Rely on the restore to copy the auto scaling policies, TTL settings, stream settings, alarms, and tags from the source table to the restored table.
    - id: e
      text:
        en: |-
          On the restored table, configure the auto scaling policies, TTL, the stream and the Lambda event source mapping, the CloudWatch alarms, the tags, and point-in-time recovery.
answer: { optionIds: [c, e] }
explanation:
  correct:
    en: |-
      A point-in-time restore always creates a new table, so the command needs a new target table name and the restore time just before the corruption. The restore brings back the data, the indexes, the provisioned capacity, and the encryption settings, but auto scaling policies, IAM policies, CloudWatch alarms, tags, stream settings, TTL settings, and point-in-time recovery must be configured manually on the restored table.
  options:
    a:
      en: |-
        A restore cannot target the existing table; DynamoDB requires a new table name for the restored table.
    b:
      en: |-
        Turning point-in-time recovery off and on resets the restorable window, so the table could no longer be restored to 14:04 UTC.
    d:
      en: |-
        These settings are not restored with the data, so the restored table would run without auto scaling, TTL, streams, alarms, and tags.
references:
  - title: Restoring a DynamoDB table to a point in time - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery.Tutorial.html
  - title: Point-in-time backups for DynamoDB - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Point-in-time-recovery.html
