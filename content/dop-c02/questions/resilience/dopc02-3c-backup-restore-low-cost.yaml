id: dopc02-3c-backup-restore-low-cost
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an internal reporting application on Amazon EC2 instances with an Amazon RDS for MySQL DB instance in us-east-1. All the infrastructure is defined in AWS CloudFormation templates. After a business impact analysis, the company sets the disaster recovery objectives for a Regional outage to an RTO of 24 hours and an RPO of 24 hours. The recovery must happen in us-west-2. The company wants the MOST cost-effective solution that meets these objectives.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use AWS Backup to take daily backups of the EC2 instances and the DB instance with a copy to a vault in us-west-2, and during a disaster deploy the CloudFormation stacks in us-west-2 and restore the copies.
    - id: b
      text:
        en: |-
          Create a cross-Region read replica of the DB instance in us-west-2, and deploy the CloudFormation stacks in us-west-2 with the Auto Scaling group running at minimum capacity.
    - id: c
      text:
        en: |-
          Migrate the database to an Aurora global database with a secondary cluster in us-west-2, and keep AMIs and the CloudFormation stacks ready in us-west-2 with the application tier stopped.
    - id: d
      text:
        en: |-
          Deploy the full application in us-west-2 behind Route 53 latency records, and use an Aurora global database with write forwarding so that both Regions serve users.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Backup and restore is the lowest-cost disaster recovery strategy: nothing runs in the recovery Region, and the infrastructure is redeployed from infrastructure as code before the backups are restored. Daily backups copied to us-west-2 meet the 24-hour RPO, and redeploying the CloudFormation stacks and restoring the data fits within a 24-hour RTO.
  options:
    b:
      en: |-
        A read replica and running instances form a warm standby, which pays continuously for a database and compute in us-west-2 to achieve an RTO and RPO far shorter than required.
    c:
      en: |-
        A pilot light with an Aurora global database keeps a database cluster running in us-west-2 and requires a database migration, which costs more than needed for a 24-hour RPO and RTO.
    d:
      en: |-
        Multi-site active/active is the most expensive strategy, with full capacity in both Regions, for objectives that tolerate a full day of downtime and data loss.
references:
  - title: "Disaster recovery options in the cloud - Disaster Recovery of Workloads on AWS: Recovery in the Cloud"
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
