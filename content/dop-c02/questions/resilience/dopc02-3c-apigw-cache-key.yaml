id: dopc02-3c-apigw-cache-key
objective: "3.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A weather company exposes a REST API in Amazon API Gateway with an AWS Lambda integration. Clients call `GET /forecast?city={name}`, and the forecast of each city changes every 10 minutes. During storms, thousands of clients request the same few cities, and the Lambda function and the forecast database behind it are overloaded. The company wants to reduce the number of calls to the backend with the LEAST change to the application. Each client must receive the forecast of the city that it requested, and the forecast must never be more than 10 minutes old.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on API caching for the stage with a TTL of 600 seconds, and configure the city query string parameter as a cache key of the GET /forecast method.
    - id: b
      text:
        en: |-
          Turn on API caching for the stage with the default TTL, and keep the method request settings of the GET /forecast method unchanged.
    - id: c
      text:
        en: |-
          Turn on API caching for the stage with a TTL of 3,600 seconds, and configure the city query string parameter as a cache key of the GET /forecast method.
    - id: d
      text:
        en: |-
          Configure provisioned concurrency on an alias of the Lambda function, and point the API integration to the alias so that more requests are served at the same time.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      API Gateway caches endpoint responses for a stage for the configured TTL, so repeated requests are answered without calling the Lambda function. A query string parameter configured as a cache key makes API Gateway cache the response of each city separately, and a TTL of 600 seconds keeps every cached forecast within the 10-minute freshness limit.
  options:
    b:
      en: |-
        Without the city parameter as a cache key, the cached response is not separated by city, so clients could receive the forecast of another city.
    c:
      en: |-
        A TTL of one hour lets the cache return forecasts that are up to an hour old, which breaks the 10-minute freshness requirement.
    d:
      en: |-
        Provisioned concurrency reduces initialization latency but still calls the function and the database for every request, so the backend stays overloaded.
references:
  - title: Cache settings for REST APIs in API Gateway - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-caching.html
