id: dopc02-3c-route53-inverted-health-check
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon Route 53 failover routing for api.example.com. The primary record points to an endpoint in us-east-1 and is associated with an HTTPS health check. The secondary record points to an endpoint in us-west-2. For a disaster recovery test, the team must make Route 53 answer with the secondary record without stopping or changing the primary application, its load balancer, or its security groups. After the test, the team must return to normal routing with a single change.

    Which action should the team take?
body:
  options:
    - id: a
      text:
        en: |-
          Edit the health check of the primary record and turn on the Invert health check status setting, and then turn it off after the test.
    - id: b
      text:
        en: |-
          Edit the health check of the primary record and turn on the Disabled setting, and then turn it off after the test.
    - id: c
      text:
        en: |-
          Edit the health check of the primary record to use a request interval of 10 seconds and a failure threshold of 1, and then restore the values after the test.
    - id: d
      text:
        en: |-
          Change the routing policy of the primary record to weighted with a weight of 0 for the test, and then change it back to failover after the test.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The Inverted setting makes Route 53 consider a health check unhealthy when it would otherwise be healthy, so the primary failover record is treated as unhealthy and Route 53 answers with the secondary record. Turning the setting off restores normal routing without touching the application.
  options:
    b:
      en: |-
        After a health check is disabled, Route 53 considers it always healthy and keeps routing traffic to the primary resource, so no failover occurs.
    c:
      en: |-
        A faster health check still reports the healthy primary endpoint as healthy, and the request interval cannot be changed after the health check is created.
    d:
      en: |-
        Records with the same name and type must use the same routing policy, so this would require deleting and re-creating the failover records instead of a single reversible change.
references:
  - title: HealthCheckConfig - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/APIReference/API_HealthCheckConfig.html
