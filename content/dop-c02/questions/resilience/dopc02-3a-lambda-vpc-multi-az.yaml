id: dopc02-3a-lambda-vpc-multi-az
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an AWS Lambda function that reads from an Amazon RDS Multi-AZ DB instance in private subnets. The function is connected to the VPC with a single private subnet in us-east-1a. During an impairment of us-east-1a, the database failed over successfully, but every invocation of the function failed.

    Which change will make the function resilient to the loss of one Availability Zone?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the VPC settings of the function with private subnets in multiple Availability Zones.
    - id: b
      text:
        en: |-
          Configure provisioned concurrency so that execution environments are initialized in advance.
    - id: c
      text:
        en: |-
          Increase the reserved concurrency and the timeout of the function to allow more retries.
    - id: d
      text:
        en: |-
          Publish a new version and use an alias with weighted routing between two function versions.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Lambda runs functions in multiple Availability Zones, but a function connected to a VPC uses network interfaces in the subnets that you choose. AWS recommends specifying subnets in multiple Availability Zones for high availability, so the function can still reach the VPC when one zone fails.
  options:
    b:
      en: |-
        Provisioned concurrency reduces cold starts, but the function still reaches the VPC only through the subnet in us-east-1a.
    c:
      en: |-
        More concurrency and a longer timeout do not change the network placement of the function, so every invocation still fails during the impairment.
    d:
      en: |-
        Versions and aliases manage code releases; both versions would share the same single-subnet VPC configuration.
references:
  - title: "Resilience in AWS Lambda - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/security-resilience.html
