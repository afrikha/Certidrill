id: dopc02-3a-cron-to-scheduler
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a reconciliation script every 15 minutes from cron on a single Amazon EC2 instance in one Availability Zone. Each run takes about 2 minutes and calls internal APIs in the VPC. When the instance's Availability Zone was impaired, no reconciliation ran for 3 hours. The company wants the job to keep running on schedule if any Availability Zone fails, with retries for failed runs, and with the LEAST operational overhead. Two runs must never process the same period at the same time.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run the script from cron on two EC2 instances in different Availability Zones so that one of the instances is always available.
    - id: b
      text:
        en: |-
          Put the instance in an Auto Scaling group with a minimum and maximum of one instance across three Availability Zones, and keep the cron schedule on the instance.
    - id: c
      text:
        en: |-
          Create a CloudWatch alarm that recovers the instance automatically when its system status check fails.
    - id: d
      text:
        en: |-
          Move the script to a Lambda function connected to private subnets in multiple Availability Zones, and invoke it from an EventBridge Scheduler schedule with a retry policy.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      EventBridge Scheduler is a serverless scheduler that runs cron or rate schedules, invokes Lambda as a templated target, and retries failed invocations according to the schedule's retry policy. Lambda runs functions in multiple Availability Zones, and connecting it to subnets in several zones keeps access to the internal APIs when one zone fails, with no instance to manage.
  options:
    a:
      en: |-
        Two instances that run the same cron schedule execute every run twice, which breaks the requirement that two runs never process the same period at the same time.
    b:
      en: |-
        The group replaces the instance in another zone, but the replacement takes minutes, runs are missed meanwhile, there are no retries, and the team still manages an instance.
    c:
      en: |-
        Instance recovery keeps the instance in the same Availability Zone, so an impairment of that zone still stops the job.
references:
  - title: "What is Amazon EventBridge Scheduler? - EventBridge Scheduler"
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/what-is-scheduler.html
  - title: "Resilience in AWS Lambda - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/security-resilience.html
