id: dopc02-3c-apigw-usage-plans
objective: "3.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company exposes a REST API in Amazon API Gateway to partner companies. The partners are already authenticated by a Lambda authorizer. Each partner subscribes to a Basic, Standard, or Premium tier, and each tier has its own request rate limit and monthly request quota. The company wants to apply the limits of its tier to each partner and to see the request usage of each partner.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure default method throttling on the API stage with the Premium rate limit, and override the throttling of individual methods for the Basic and Standard tiers.
    - id: b
      text:
        en: |-
          Set a different reserved concurrency on the backend Lambda functions for each tier, and route each partner to the functions of its tier from the Lambda authorizer.
    - id: c
      text:
        en: |-
          Create a usage plan for each tier with its throttling and quota limits, issue an API key to each partner, and associate each API key with the usage plan of the partner's tier.
    - id: d
      text:
        en: |-
          Associate an AWS WAF web ACL with the API stage, and add a rate-based rule for each partner that blocks requests above the rate limit of the partner's tier.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A usage plan sets throttling and quota limits that apply to each API key associated with it, and API keys identify each partner so that API Gateway can report usage per key. API keys are used here to meter partners, not to authorize them, so the Lambda authorizer remains in place; usage plan limits are applied on a best-effort basis and are not a security control.
  options:
    a:
      en: |-
        Stage and method throttling apply to all callers of the stage or method, so they cannot give each partner its own limit, and they do not provide a monthly quota or per-partner usage.
    b:
      en: |-
        Reserved concurrency limits how many instances of a function run at once; it is not a per-partner request rate or monthly quota, and it gives no usage report per partner.
    d:
      en: |-
        A rate-based rule limits request rates over a short evaluation window, but it does not enforce a monthly quota or report the usage of each partner.
references:
  - title: Usage plans and API keys for REST APIs in API Gateway - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html
