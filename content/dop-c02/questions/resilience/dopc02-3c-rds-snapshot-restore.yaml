id: dopc02-3c-rds-snapshot-restore
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's application connects to an Amazon RDS for MySQL DB instance through the name db.internal.example.com, which is a CNAME record in an Amazon Route 53 private hosted zone that points to the DB instance endpoint. The DB instance uses a custom DB parameter group and a custom VPC security group. An operator accidentally dropped a table, and the team decides to recover from a manual DB snapshot that was taken at 02:00. The recovery runbook must bring the application back with the same database configuration and without changing the application's configuration.

    Which recovery procedure will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Restore the DB snapshot onto the existing DB instance so that the DB instance keeps its endpoint, its DB parameter group, and its VPC security group.
    - id: b
      text:
        en: |-
          Restore the DB snapshot to a new DB instance with the default settings, and update the CNAME record in the private hosted zone to the endpoint of the new DB instance.
    - id: c
      text:
        en: |-
          Restore the DB snapshot to a new DB instance with the custom DB parameter group and VPC security group, and update the application's connection string to the new endpoint.
    - id: d
      text:
        en: |-
          Restore the DB snapshot to a new DB instance with the custom DB parameter group and VPC security group, and update the CNAME record in the private hosted zone to the new endpoint.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Restoring a DB snapshot always creates a new DB instance with its own endpoint, and the default DB parameter group and default VPC security group are used unless other ones are specified during the restore. Specifying the custom groups keeps the same database configuration, and updating the CNAME record moves the application to the new DB instance without changing its configuration.
  options:
    a:
      en: |-
        Amazon RDS cannot restore a DB snapshot to an existing DB instance; a restore always creates a new DB instance.
    b:
      en: |-
        With the default settings, the new DB instance uses the default DB parameter group and the default VPC security group, so the database configuration would differ from the original one.
    c:
      en: |-
        Changing the connection string modifies the application's configuration, which the runbook must avoid because the CNAME record can be updated instead.
references:
  - title: Restoring to a DB instance - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_RestoreFromSnapshot.html
