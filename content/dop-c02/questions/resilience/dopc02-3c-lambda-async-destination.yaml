id: dopc02-3c-lambda-async-destination
objective: "3.2.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Amazon S3 event notifications invoke an AWS Lambda function asynchronously for each invoice file that is uploaded to a bucket. Some files are malformed, and the function returns an error for them; Lambda retries these events with the default settings and then discards them. A malformed file never succeeds on a retry, so a failed event must be retried at most once. An event that waits in the queue for more than 1 hour must no longer be processed. For every event that fails, an Amazon SQS queue must receive a record that contains the original event, the function's error response, and the reason why the event was discarded, such as exhausted retries, so that a remediation process can fix the file. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an SQS dead-letter queue on the function, and set the maximum retry attempts to 1 and the maximum event age to 1 hour in the asynchronous invocation settings.
    - id: b
      text:
        en: |-
          Set the maximum retry attempts to 0, and wrap the function handler in an exception handler that sends the event and the error message to the SQS queue before it returns.
    - id: c
      text:
        en: |-
          Set the maximum retry attempts to 1 and the maximum event age to 1 hour in the asynchronous invocation settings, and add an on-failure destination that targets the SQS queue.
    - id: d
      text:
        en: |-
          Send the S3 event notifications to an SQS queue that the function polls, and configure the queue's redrive policy with a maximum receive count of 2 and a dead-letter queue.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The asynchronous invocation settings of a function set the number of retries (0 to 2) and the maximum age of an event in the queue (up to 6 hours). An on-failure destination receives a record when an event fails all processing attempts or exceeds the maximum age, and the record contains the request payload, the condition that ended processing (for example, RetriesExhausted), and the response context and error returned by the function.
  options:
    a:
      en: |-
        A dead-letter queue receives the content of the event with only a request ID, an error code, and a truncated error message as attributes, without the response details or the condition that discarded the event.
    b:
      en: |-
        The exception handler is custom code, and it does not capture failures that happen outside the handler, such as timeouts, or events that exceed the maximum age.
    d:
      en: |-
        Moving to an SQS event source changes the architecture, and messages in the dead-letter queue contain only the original message, without the function's error response.
references:
  - title: Capturing records of Lambda asynchronous invocations - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-retain-records.html
  - title: Configuring error handling settings for Lambda asynchronous invocations - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-configuring.html
