id: dopc02-3b-elasticache-write-through-ttl
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company caches product data from an Amazon RDS database in an Amazon ElastiCache (Memcached) cluster. The application uses lazy loading: on a cache miss, it reads the product from the database and writes it to the cache without an expiration time. When merchandisers change a price, customers keep seeing the old price until the item is evicted, sometimes for days. Prices must appear in the cache as soon as they are written to the database. The company also wants rarely read products to leave the cache over time instead of filling it.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep lazy loading, and set a TTL of 24 hours on every key that the application writes to the cache.
    - id: b
      text:
        en: |-
          Add more nodes to the cluster so that items are evicted less often and the cache can hold the whole product catalog.
    - id: c
      text:
        en: |-
          Update the cache with each price change when it is written to the database, and set a TTL on every key.
    - id: d
      text:
        en: |-
          Remove the cache and send all product reads to an RDS read replica so that customers always read current data.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Write-through updates the cache whenever data is written to the database, so cached prices are not stale. Its drawback, cache churn from data that is never read, is reduced by adding a TTL to each key, which also lets lazy loading refresh items that expire.
  options:
    a:
      en: |-
        A TTL limits how long data stays stale but does not make price changes appear immediately; customers could see old prices for up to 24 hours.
    b:
      en: |-
        More nodes reduce evictions, which keeps stale prices in the cache even longer, and they add cost.
    d:
      en: |-
        Removing the cache gives up its latency and offload benefits, and read replicas use asynchronous replication, so reads can still lag behind the writer.
references:
  - title: Caching strategies for Memcached - Amazon ElastiCache
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
