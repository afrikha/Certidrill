id: dopc02-3c-cloudfront-origin-failover-test
objective: "3.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company serves a product catalog through Amazon CloudFront. The default cache behavior uses an origin group whose primary origin is an Application Load Balancer in us-east-1 and whose secondary origin is an Application Load Balancer in us-west-2. The failover criteria of the origin group are the HTTP status codes 500 and 502, and the origins use the default connection settings. During a failover test, the team blocked all traffic to the primary load balancer in its security group. Viewers waited about 30 seconds for each request and then received errors instead of content from the secondary origin. The team wants GET requests to fail over to the secondary origin after no more than a few seconds when the primary origin cannot be reached.

    Which combination of changes will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add POST and PUT to the cached HTTP methods of the default cache behavior so that all requests can fail over to the secondary origin.
    - id: b
      text:
        en: |-
          Add the status codes 503 and 504 to the failover criteria of the origin group so that connection failures and timeouts cause a failover.
    - id: c
      text:
        en: |-
          Add the status codes 403 and 404 to the failover criteria of the origin group so that requests blocked by the security group cause a failover.
    - id: d
      text:
        en: |-
          Reduce the origin connection attempts of the primary origin to 1 and its origin connection timeout to a few seconds.
    - id: e
      text:
        en: |-
          Turn on Origin Shield in us-east-1 for the primary origin so that CloudFront detects the unavailable origin from a single caching layer.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      CloudFront fails over when the primary origin returns a configured status code, when it cannot connect and 503 is a failover criterion, or when it times out and 504 is a failover criterion. By default CloudFront tries the primary origin 3 times with a 10-second connection timeout, which explains the 30-second wait, so 1 attempt and a timeout of a few seconds make the failover start quickly.
  options:
    a:
      en: |-
        Origin failover applies only to GET, HEAD, and OPTIONS requests, and the cached methods of a cache behavior can include only these methods, so POST and PUT requests never fail over.
    c:
      en: |-
        A security group that blocks traffic produces no HTTP response at all, so the primary origin never returns a 403 or 404 status code in this test.
    e:
      en: |-
        Origin Shield adds a caching layer in front of the origin; it does not change the failover criteria or the connection attempts and timeout.
references:
  - title: Optimize high availability with CloudFront origin failover - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html
