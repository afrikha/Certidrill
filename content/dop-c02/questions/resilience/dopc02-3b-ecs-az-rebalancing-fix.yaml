id: dopc02-3b-ecs-az-rebalancing-fix
objective: "3.1.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A media company runs a replica Amazon ECS service of 12 tasks on an EC2 capacity provider. The Auto Scaling group of the capacity provider keeps container instances with spare capacity in each of three Availability Zones. Availability Zone rebalancing is set to ENABLED on the service. The service uses a single placement strategy of binpack on memory, a minimumHealthyPercent of 50, and a maximumPercent of 100. After an Availability Zone disruption ended, all 12 tasks stayed in the two other zones, and the team had to redistribute them manually. The company wants Amazon ECS to restore an even task distribution across the three zones automatically after future disruptions.

    Which combination of changes will meet this requirement? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a memberOf placement constraint on attribute:ecs.availability-zone that lists the three Availability Zones of the cluster.
    - id: b
      text:
        en: |-
          Make a spread strategy on attribute:ecs.availability-zone the first placement strategy of the service, followed by binpack on memory.
    - id: c
      text:
        en: |-
          Change the scheduling strategy of the service from REPLICA to DAEMON so that every container instance in each zone runs a task.
    - id: d
      text:
        en: |-
          Set the Availability Zone distribution strategy of the Auto Scaling group to balanced only so that instances are retried in the same zone.
    - id: e
      text:
        en: |-
          Raise the maximumPercent of the service deployment configuration above 100, for example to 200.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Availability Zone rebalancing starts tasks in the zones with the fewest tasks before it stops tasks in the overloaded zones. It works only when Availability Zone spread is the first placement strategy (or no strategy is set), and it does not work when maximumPercent is 100, because the service could not run the extra tasks during the move. Fixing both conditions lets the already enabled feature act on its own.
  options:
    a:
      en: |-
        Rebalancing does not work with a placement constraint on attribute:ecs.availability-zone, so this change would block it instead of enabling it.
    c:
      en: |-
        Rebalancing supports only the REPLICA scheduling strategy, and a DAEMON service would change the task count instead of keeping 12 tasks balanced.
    d:
      en: |-
        The container instances are already present in all three zones; the imbalance is in task placement, which the Auto Scaling group setting does not control.
references:
  - title: Balancing an Amazon ECS service across Availability Zones - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-rebalancing.html
