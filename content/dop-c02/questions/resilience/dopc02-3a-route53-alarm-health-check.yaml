id: dopc02-3a-route53-alarm-health-check
objective: "3.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs an active-passive application in two AWS Regions. Amazon Route 53 failover alias records point to an Application Load Balancer (ALB) in each Region, with Evaluate Target Health set to Yes. During a recent incident, a faulty dependency caused 30% of the requests in the primary Region to fail, but the instances kept passing the ALB health checks, so Route 53 never failed over. The application publishes a custom CloudWatch metric named ErrorRate at standard resolution. The company wants Route 53 to fail over automatically when the average ErrorRate exceeds 5% over 5 minutes.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm with a metric math expression that divides the HTTPCode_Target_5XX_Count metric of the ALB by its RequestCount metric, and alarm on 3 out of 5 data points.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on the ErrorRate metric that uses the Average statistic over a 5-minute period with a threshold of 5.
    - id: c
      text:
        en: |-
          Create a Route 53 health check that monitors the data stream of the CloudWatch alarm, and associate it with the primary failover record.
    - id: d
      text:
        en: |-
          Create a calculated health check that monitors the primary ALB, and set Evaluate Target Health to No on the secondary failover record.
    - id: e
      text:
        en: |-
          Lower the unhealthy threshold of the ALB target group health check so that targets in the primary Region fail their health checks sooner.
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      A Route 53 health check can monitor the data stream of a CloudWatch alarm; it supports standard-resolution metrics and the Average, Minimum, Maximum, Sum, and SampleCount statistics. When the ErrorRate data meets the alarm criteria, the health check becomes unhealthy, and because it is associated with the primary failover record, Route 53 answers with the secondary record.
  options:
    a:
      en: |-
        Route 53 health checks do not support alarms that use metric math or "M out of N" evaluation, so this alarm cannot drive the failover.
    d:
      en: |-
        A calculated health check monitors other Route 53 health checks, not an ALB, and nothing in it measures the error rate.
    e:
      en: |-
        The targets keep passing their health checks during this kind of failure, so a lower threshold does not change the target health that Route 53 evaluates.
references:
  - title: "Types of Amazon Route 53 health checks - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-types.html
  - title: "Active-active and active-passive failover - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-types.html
