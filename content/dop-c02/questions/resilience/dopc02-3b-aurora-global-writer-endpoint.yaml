id: dopc02-3b-aurora-global-writer-endpoint
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs an Amazon Aurora PostgreSQL global database with the primary cluster in us-east-1 and a secondary cluster in us-west-2. Application servers in both Regions send all writes to the cluster endpoint of the primary cluster, which is stored in their configuration files. Networking between the two VPCs is already in place. Twice a year, the company performs a managed switchover to move the primary cluster to the other Region. After each switchover, engineers must edit and redeploy the configuration of every application server, which extends the maintenance window. The company wants writes to reach the new primary cluster after a switchover without any configuration change.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the application servers in both Regions to send writes to the global writer endpoint of the global database.
    - id: b
      text:
        en: |-
          Store the primary cluster endpoint in AWS Systems Manager Parameter Store and add a runbook step that updates the parameter after each switchover.
    - id: c
      text:
        en: |-
          Create Route 53 failover records that point to the cluster endpoints of both clusters, with a health check on the database port of each endpoint.
    - id: d
      text:
        en: |-
          Configure the application servers to send writes to the reader endpoint of the cluster in their own Region so that each Region uses its local cluster.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An Aurora global database provides a global writer endpoint that always points to the writer instance of the current primary cluster. After a switchover or failover, Aurora repoints this endpoint to the newly promoted cluster, so applications do not need a new connection string. The update depends on DNS caching, so clients should not cache DNS entries for long.
  options:
    b:
      en: |-
        The runbook step still requires an action after each switchover, and the applications must reread the parameter, so the overhead remains.
    c:
      en: |-
        The endpoints of both clusters accept connections on the database port, so a port health check cannot tell which cluster is the writer, and the records would need manual maintenance.
    d:
      en: |-
        A reader endpoint connects only to reader instances, which cannot accept writes, so write traffic would fail.
references:
  - title: Connecting to Amazon Aurora Global Database - Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-connecting.html
