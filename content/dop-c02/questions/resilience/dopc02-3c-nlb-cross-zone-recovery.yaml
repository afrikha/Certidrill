id: dopc02-3c-nlb-cross-zone-recovery
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a TCP service behind an internet-facing Network Load Balancer that is enabled in three Availability Zones. A fixed fleet of six Amazon EC2 instances, two in each Availability Zone, is registered by instance ID in the target group, and the cross-zone load balancing settings are at their defaults. When one instance in an Availability Zone fails its health checks, the remaining instance in that zone receives all the traffic of that zone's load balancer node and becomes overloaded, while the instances in the other zones have spare capacity. The company wants each load balancer node to spread its traffic across the healthy targets in all three Availability Zones.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on cross-zone load balancing for the target group so that each load balancer node distributes traffic across the healthy targets in all enabled Availability Zones.
    - id: b
      text:
        en: |-
          Replace the Network Load Balancer with an Application Load Balancer, because Application Load Balancers always distribute traffic across all Availability Zones.
    - id: c
      text:
        en: |-
          Create a Route 53 health check for each zonal IP address of the load balancer, and use failover records to remove the IP address of a zone that has a failed instance.
    - id: d
      text:
        en: |-
          Turn on zonal shift for the Network Load Balancer, and start a zonal shift away from an Availability Zone each time one of its instances fails a health check.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      By default, each Network Load Balancer node distributes traffic only to the registered targets in its own Availability Zone. Cross-zone load balancing, which can be turned on for the load balancer or for a target group, makes each node distribute traffic across the healthy targets in all enabled Availability Zones, so the loss of one instance is absorbed by the whole fleet.
  options:
    b:
      en: |-
        Application Load Balancers handle HTTP and HTTPS traffic, not a raw TCP service, so they cannot replace this Network Load Balancer.
    c:
      en: |-
        Removing a zone from DNS also removes the healthy instance of that zone from service, which wastes capacity and requires custom health checks for each zonal address.
    d:
      en: |-
        A zonal shift moves all traffic away from the zone, including from its healthy instance, and starting it manually after each failure is an operational step rather than an automatic recovery.
references:
  - title: Network Load Balancers - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/network-load-balancers.html
