id: dopc02-3c-replication-not-backup
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company runs an active/active application in two AWS Regions. The data is stored in an Amazon DynamoDB global table with a replica in each Region, and the company reports an RPO close to zero for a Regional outage. During a review, auditors ask how the company would recover if a faulty deployment overwrote thousands of items with incorrect values. The company must be able to recover the data to its state one minute before such an event, at any time during the last 14 days.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Rely on the replica in the other Region, and redirect the application to that Region when corrupted items are detected in the local replica.
    - id: b
      text:
        en: |-
          Add a third replica in another Region, and remove that replica from the global table when corrupted items are detected so that it keeps the correct data.
    - id: c
      text:
        en: |-
          Turn on point-in-time recovery for the replicas with a recovery period of at least 14 days, and restore to a new table at the required second when corruption is detected.
    - id: d
      text:
        en: |-
          Turn on DynamoDB Streams for the table, and replay the stream records of the last 14 days in reverse order to undo the incorrect writes.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Replication protects against infrastructure disasters, but it copies corrupted data to every Region, so the recovery point for data corruption still depends on backups. Point-in-time recovery provides continuous backups with per-second granularity and a recovery period of 1 to 35 days, and a restore creates a new table with the data as it was at the chosen time.
  options:
    a:
      en: |-
        Global tables replicate every write to all replicas, so the other Region holds the same incorrect values within seconds.
    b:
      en: |-
        The third replica receives the incorrect writes as quickly as the others, and detection always happens after replication, so the replica would not hold the correct data.
    d:
      en: |-
        DynamoDB Streams keeps stream records for 24 hours, not 14 days, and replaying records is custom recovery code rather than a restore to a point in time.
references:
  - title: Point-in-time backups for DynamoDB - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Point-in-time-recovery.html
  - title: "Disaster recovery options in the cloud - Disaster Recovery of Workloads on AWS: Recovery in the Cloud"
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
