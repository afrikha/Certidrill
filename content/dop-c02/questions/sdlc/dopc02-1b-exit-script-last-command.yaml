id: dopc02-1b-exit-script-last-command
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodeBuild project runs on a Linux image. The build phase of its buildspec contains one command, ./scripts/run-tests.sh. The script runs python -m pytest tests/ --junitxml=reports/junit.xml and then runs echo "Test run complete" on the next line. The reports section publishes reports/junit.xml to a report group. Yesterday, the test report showed 14 failed test cases, but the build status was SUCCEEDED and the pipeline deployed the release. The company wants failed tests to fail the build, with the smallest change.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the script so that it ends with the exit code of the pytest command instead of the exit code of the echo command.
    - id: b
      text:
        en: |-
          Add on-failure: ABORT to the build phase of the buildspec so that CodeBuild stops the build and marks it as failed when any test fails.
    - id: c
      text:
        en: |-
          Move the ./scripts/run-tests.sh command from the build phase to the post_build phase of the buildspec.
    - id: d
      text:
        en: |-
          Set file-format: JUNITXML explicitly in the reports section so that CodeBuild evaluates the test case results and sets the build status.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CodeBuild fails a phase when a command returns a non-zero exit code. A shell script returns the exit code of its last command, here echo, which succeeds, so the failing pytest result is lost; the script must propagate the pytest exit code.
  options:
    b:
      en: |-
        on-failure defines what happens after a command fails, but the script returns 0, so CodeBuild never sees a failure.
    c:
      en: |-
        The script still returns 0 in any phase, so moving it does not change the build status.
    d:
      en: |-
        JUNITXML is already the default format; a report records the results, but the build status comes from the exit codes of the commands.
references:
  - title: Build specification reference for CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
