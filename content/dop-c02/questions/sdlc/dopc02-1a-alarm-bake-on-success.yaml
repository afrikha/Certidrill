id: dopc02-1a-alarm-bake-on-success
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys a serverless API from an AWS CodePipeline pipeline of type V2 in QUEUED execution mode. The pipeline and the application are in the same account. One stage deploys the release to us-east-1 with AWS CloudFormation, and the next stage deploys it to eu-west-1. An Amazon CloudWatch alarm in us-east-1 tracks the API's 5XX error rate. If the alarm is in the ALARM state after the us-east-1 deployment completes, the us-east-1 stage must return to the last release that succeeded in that stage, and the eu-west-1 stage must not run. The company does not want to write custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an onFailure condition with the ROLLBACK result to the us-east-1 stage so that the stage is rolled back when the alarm is in the ALARM state.
    - id: b
      text:
        en: |-
          Add an AWS Lambda invoke action after the deployment in the us-east-1 stage that reads the alarm state and redeploys the previous template when the alarm is in ALARM.
    - id: c
      text:
        en: |-
          Add a manual approval action at the start of the eu-west-1 stage, and ask the operators to check the alarm and roll back us-east-1 by hand when it is in ALARM.
    - id: d
      text:
        en: |-
          Add an on-success condition to the us-east-1 stage with a CloudWatchAlarm rule for the alarm and the ROLLBACK result.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      On-success conditions run their rules after the stage succeeds and before the pipeline continues. For a CloudWatchAlarm rule, the OK and INSUFFICIENT_DATA states meet the condition; when the alarm is in ALARM, the ROLLBACK result rolls the stage back to the most recent successful execution, and the execution does not proceed to eu-west-1. Stage rollback is not available in PARALLEL mode, which this pipeline does not use.
  options:
    a:
      en: |-
        An onFailure condition engages only when the stage fails. Here the CloudFormation deployment succeeds, so the condition never runs even though the alarm is in ALARM.
    b:
      en: |-
        A Lambda invoke action means custom code to read the alarm and redeploy, which the company wants to avoid.
    c:
      en: |-
        A manual approval and a manual rollback rely on operators, so neither the rollback nor the block of the next stage is automatic.
references:
  - title: Configure conditions for a stage - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/stage-conditions.html
  - title: How do stage conditions work? - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/concepts-how-it-works-conditions.html
