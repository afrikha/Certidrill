id: dopc02-1d-codebuild-ecr-service-role
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team maintains a custom build image in an Amazon ECR repository in a tooling account, 111122223333. AWS CodeBuild projects in 25 application accounts must use this image as their build environment image. A project in application account 444455556666 fails in the PROVISIONING phase with an access denied error when it pulls the image. The project's environment sets imagePullCredentialsType to CODEBUILD. The company requires least privilege.

    Which solution will resolve the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Set imagePullCredentialsType to SERVICE_ROLE, give the project's service role the ECR pull permissions, and add a repository policy statement that allows account 444455556666 to pull the image.
    - id: b
      text:
        en: |-
          Keep imagePullCredentialsType as CODEBUILD, and add a repository policy statement that allows codebuild.amazonaws.com with an aws:SourceAccount condition equal to 444455556666.
    - id: c
      text:
        en: |-
          Keep imagePullCredentialsType as CODEBUILD, and give the project's service role ecr:* on the repository ARN in its identity-based policy only.
    - id: d
      text:
        en: |-
          Run the project in a VPC that has interface endpoints for ecr.api and ecr.dkr and a gateway endpoint for Amazon S3.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CodeBuild credentials (CODEBUILD) are for images in the project's own account; for an image in another account, the project must pull with its service role (SERVICE_ROLE). The repository policy must then allow the application account to pull (ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability), and the service role needs those permissions and ecr:GetAuthorizationToken in its identity-based policy.
  options:
    b:
      en: |-
        CodeBuild documents the codebuild.amazonaws.com service principal for projects that use CodeBuild credentials on images in their own account; a cross-account image must be pulled with the project's service role.
    c:
      en: |-
        A cross-account pull also needs the repository policy in the tooling account to allow it, and ecr:* far exceeds least privilege.
    d:
      en: |-
        The error is an authorization failure, not a network failure; VPC endpoints do not grant access to another account's repository.
references:
  - title: Amazon ECR sample for CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/sample-ecr.html
