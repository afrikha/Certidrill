id: dopc02-1a-github-connection-pending
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DevOps team defines its pipelines in AWS CloudFormation templates. A template creates a connection to GitHub through AWS CodeConnections and an AWS CodePipeline pipeline whose source action uses the connection ARN. The stack deploys successfully, but the source action fails, and the connection shows the PENDING status. The pipeline service role already allows the codeconnections:UseConnection and codestar-connections:UseConnection actions on the connection.

    What should the team do to resolve the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Delete the connection, create it again with the AWS CLI create-connection command and the GitHub provider type, and rerun the pipeline.
    - id: b
      text:
        en: |-
          Open the pending connection in the console, complete the handshake with GitHub through an app installation, and then complete the connection.
    - id: c
      text:
        en: |-
          Use the AWS CLI to change the status of the connection to AVAILABLE, and then retry the failed source action in the pipeline.
    - id: d
      text:
        en: |-
          Create an AWS CodeStar project linked to the GitHub repository so that CodeStar authorizes the connection for the pipeline.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A connection created through the AWS CLI or CloudFormation is in the PENDING status by default. It becomes AVAILABLE only after someone updates it in the console and completes the handshake with GitHub through the app installation that is associated with the connection.
  options:
    a:
      en: |-
        A connection created with the AWS CLI is also PENDING, so re-creating it does not change the outcome.
    c:
      en: |-
        A pending connection cannot be updated with the AWS CLI; the console is required.
    d:
      en: |-
        AWS CodeStar was shut down in July 2024, and it never authorized CodeConnections connections.
references:
  - title: Update a pending connection - Developer Tools console
    url: https://docs.aws.amazon.com/dtconsole/latest/userguide/connections-update.html
