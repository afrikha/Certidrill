id: dopc02-1a-codeartifact-origin-controls
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company publishes an internal npm package named anycompany-auth to an AWS CodeArtifact repository named internal. The package was first published in 2021. The internal repository has an upstream repository named npm-store that has an external connection to public:npmjs. Last week, someone published a package with the same name and a higher version number to the npm public registry, and several builds installed that version. The security team has deleted the malicious versions from both repositories. The company must make sure that builds can get only the versions of anycompany-auth that the company publishes, while all other public packages remain available.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Remove the external connection from npm-store, and copy the public packages that the builds need into the internal repository by hand.
    - id: b
      text:
        en: |-
          Pin the exact version of anycompany-auth in the package.json and package-lock.json files of every project that uses the package.
    - id: c
      text:
        en: |-
          Add a repository policy to npm-store that denies the codeartifact:PublishPackageVersion action to every principal in the company's accounts.
    - id: d
      text:
        en: |-
          Set the package origin controls of anycompany-auth in the internal repository to allow direct publishing and to block upstream versions.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Allowing a package to receive versions both from direct publishing and from public sources exposes it to a dependency substitution attack. Package origin controls set to publish ALLOW and upstream BLOCK let the company publish new versions while versions from upstream repositories and the external connection are no longer retained. Packages created before about May 2022 default to ALLOW for both settings, which is why this package was exposed.
  options:
    a:
      en: |-
        Removing the external connection blocks every public package and replaces a managed proxy with manual copying.
    b:
      en: |-
        Version pinning in each project is manual, must be repeated for every project, and does not stop a public version from being ingested when the pin is updated.
    c:
      en: |-
        The attack came from the external connection, not from publishing to npm-store, so denying publishing does not stop the public versions from being ingested.
references:
  - title: Editing package origin controls - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/package-origin-controls.html
