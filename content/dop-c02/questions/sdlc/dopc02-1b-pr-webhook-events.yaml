id: dopc02-1b-pr-webhook-events
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company hosts its application code in a GitHub repository. An AWS CodeBuild project compiles the code and runs the unit tests, but developers start the builds manually from the console. The team wants the unit tests to run automatically every time a pull request is opened, every time new commits are pushed to an open pull request, and when a closed pull request is reopened. Builds must not run for other repository events.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a webhook for the project with a filter group that contains the PUSH event and a HEAD_REF filter of ^refs/heads/main$, so that every merged change is tested.
    - id: b
      text:
        en: |-
          Create a webhook for the project with a filter group that contains the PULL_REQUEST_CREATED, PULL_REQUEST_UPDATED, and PULL_REQUEST_REOPENED events.
    - id: c
      text:
        en: |-
          Create a webhook for the project with a filter group that contains only the PULL_REQUEST_MERGED event.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge Scheduler schedule that starts a build of the project every 15 minutes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A CodeBuild webhook starts a build for the GitHub events listed in its filter groups. PULL_REQUEST_CREATED covers new pull requests, PULL_REQUEST_UPDATED covers new commits pushed to an open pull request, and PULL_REQUEST_REOPENED covers reopened pull requests.
  options:
    a:
      en: |-
        A PUSH filter on main runs builds only for commits pushed to main, not for pull requests opened against it.
    c:
      en: |-
        PULL_REQUEST_MERGED fires only when a pull request is merged, after the review in which the test results were needed.
    d:
      en: |-
        A schedule builds the default branch at fixed times; it is not tied to pull request events and runs even when nothing changed.
references:
  - title: GitHub webhook events - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/github-webhook.html
