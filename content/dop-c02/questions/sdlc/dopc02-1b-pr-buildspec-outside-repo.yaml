id: dopc02-1b-pr-buildspec-outside-repo
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodeBuild project runs tests for every pull request in a GitHub repository through a webhook. The project's service role can read secrets that the integration tests need. Any of the company's 300 developers can open pull requests, and some pull requests legitimately change files at the root of the repository, including the buildspec.yml file. The security team requires that every pull request is built, but no pull request author can change the build commands that run with the service role.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a FILE_PATH filter with excludeMatchedPattern set to true that excludes ^buildspec.yml$, so that pull requests that change the buildspec do not start a build.
    - id: b
      text:
        en: |-
          Define the buildspec inline in the CodeBuild project, or in an Amazon S3 bucket that only the platform team can write to, instead of in the repository.
    - id: c
      text:
        en: |-
          Set the webhook's pull request build policy to require comment approval for all pull requests from users without an approver role.
    - id: d
      text:
        en: |-
          Scope down the project's service role to the minimum permissions that the integration tests need, and rotate the secrets that the role can read every week.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When the buildspec is defined inline in the project or stored in Amazon S3, it is visible only to the project owner, and pull requests cannot change it to run unwanted commands. Every pull request is still built with the commands that the platform team controls.
  options:
    a:
      en: |-
        Excluding buildspec changes would skip building those pull requests, but the security team requires every pull request to be built.
    c:
      en: |-
        Comment approval delays builds until someone approves, but the approved build still runs the buildspec from the pull request.
    d:
      en: |-
        Least privilege limits the damage, but pull request authors could still change the commands that run with the remaining permissions.
references:
  - title: Use webhooks with AWS CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/webhooks.html
