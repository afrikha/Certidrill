id: dopc02-1c-ecs-rolling-rollback
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company deploys an Amazon ECS service on AWS Fargate with the rolling update deployment type. Two recent releases caused incidents. In the first, the new tasks crashed at start-up, and the deployment kept trying to start them for a long time. In the second, the new tasks were healthy, but the application's HTTP 5xx rate rose, and an Amazon CloudWatch alarm entered the ALARM state. The company wants both kinds of failed deployments to roll back automatically to the previous service revision.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Turn on the deployment circuit breaker with rollback in the service's deployment configuration.
    - id: b
      text:
        en: |-
          Add the CloudWatch alarm to an AWS CodeDeploy deployment group and turn on rollback when the alarm threshold is met.
    - id: c
      text:
        en: |-
          Increase the health check grace period of the service, so that the load balancer waits longer before it marks new tasks as unhealthy.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule on task state changes that invokes an AWS Lambda function to update the service to the previous task definition.
    - id: e
      text:
        en: |-
          Add the CloudWatch alarm to the deployment configuration of the service, with rollback turned on.
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      Rolling deployments support two failure-detection methods, which can be used together. The deployment circuit breaker stops and rolls back a deployment whose tasks cannot start or reach a steady state, and CloudWatch alarms in the deployment configuration roll back a deployment based on application metrics.
  options:
    b:
      en: |-
        CodeDeploy alarms apply only to services that use the CODE_DEPLOY deployment controller, not to rolling updates.
    c:
      en: |-
        A longer grace period delays failure detection; it rolls nothing back.
    d:
      en: |-
        Custom event-driven code duplicates built-in features and must decide what a failure is on its own.
references:
  - title: "Deploy Amazon ECS services by replacing tasks - Amazon Elastic Container Service"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-ecs.html
