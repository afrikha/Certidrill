id: dopc02-1a-env-parity-template
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs dev, test, and prod environments for an application in three AWS accounts. Engineers built the test environment manually in the AWS Management Console months ago. The prod environment was created from an AWS CloudFormation template, but engineers have since edited some resources by hand. A release that passed all tests failed in production because of a security group rule that existed only in the test environment. The company wants every environment to be created from the same definition, with only the instance size and the domain name differing between environments. Changes to that definition must be versioned and reviewed.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use AWS Config to record the configuration of the three environments, compare the recorded configurations every week, and correct differences manually in the console.
    - id: b
      text:
        en: |-
          Before each release, use the CloudFormation IaC generator to create a template from the production resources and deploy that template to the test account.
    - id: c
      text:
        en: |-
          Create an AMI of each production instance before each release and launch the test instances from those AMIs so that the servers in both environments are identical.
    - id: d
      text:
        en: |-
          Store one CloudFormation template in the Git repository with a template configuration file per environment, and deploy every environment with the pipeline's CloudFormation action.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A single template in version control defines every environment, and pull requests give the review and history the company needs. The CodePipeline CloudFormation deploy action accepts a template configuration file from the input artifact, so each environment supplies only its own parameter values, such as instance size and domain name.
  options:
    a:
      en: |-
        AWS Config detects differences after they exist, and the corrections stay manual; the environments are still not created from one reviewed definition.
    b:
      en: |-
        Generating a template from production copies the hand-made changes of production, and the definition is regenerated each time instead of being versioned and reviewed.
    c:
      en: |-
        AMIs copy only the server contents; security groups, networking, and the other resources that caused the failure would still differ.
references:
  - title: CloudFormation deploy action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CloudFormation.html
