id: dopc02-1c-ec2-codedeploy-bluegreen
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. AWS CodeDeploy deploys each release in place, one instance at a time. Deployments reduce capacity, and rolling back a bad release takes as long as the deployment itself. The company wants each release to run on new instances, and the old instances to stay available for 1 hour so that traffic can be moved back quickly.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the in-place deployment type, and change the deployment configuration of the deployment group from CodeDeployDefault.OneAtATime to CodeDeployDefault.HalfAtATime.
    - id: b
      text:
        en: |-
          Keep the in-place deployment type, and add a lifecycle hook to the Auto Scaling group that waits 1 hour before it terminates instances after a deployment.
    - id: c
      text:
        en: |-
          Change the deployment group to a blue/green deployment that copies the Auto Scaling group, and terminate the original instances 60 minutes after traffic is rerouted.
    - id: d
      text:
        en: |-
          Change the deployment group to use CodeDeployDefault.AllAtOnce, and take an AMI of the instances before each deployment to restore them if the release fails.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An EC2 blue/green deployment in CodeDeploy can create the replacement environment by copying the existing Auto Scaling group, deploy the release to the new instances, and reroute the load balancer traffic to them. The deployment group's setting for terminating the original instances can wait 60 minutes, which keeps the old environment ready for a fast rollback.
  options:
    a:
      en: |-
        An in-place deployment still updates the existing instances, so no new instances are created and capacity still drops.
    b:
      en: |-
        An in-place deployment updates the instances themselves, so there are no old instances with the previous release to fall back to.
    d:
      en: |-
        All at once updates every existing instance at the same time, and restoring from an AMI is a slow manual rollback.
references:
  - title: "Deployment prerequisites - AWS CodeDeploy"
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployments-create-prerequisites.html
  - title: "Working with deployment configurations in CodeDeploy - AWS CodeDeploy"
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
