id: dopc02-1c-fargate-ephemeral-storage
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs batch jobs as Amazon ECS tasks on AWS Fargate, platform version 1.4.0. Each job downloads up to 120 GiB of input files, processes them, and uploads the results to Amazon S3. The files are not needed after the task stops. Jobs now fail with "no space left on device" errors. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the ephemeralStorage sizeInGiB parameter of the task definition to 150, and keep writing the files to the task's local storage.
    - id: b
      text:
        en: |-
          Create an Amazon EFS file system with mount targets in the task subnets, and mount it as a volume in the task definition for the working files.
    - id: c
      text:
        en: |-
          Attach an existing 200 GiB EBS volume to each task by referencing the volume ID in the task definition's volume configuration.
    - id: d
      text:
        en: |-
          Increase the CPU and memory of the task definition to the maximum Fargate size, so that the task receives more local storage.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Fargate tasks on platform version 1.4.0 or later get 20 GiB of ephemeral storage by default, which can be raised to 200 GiB with the ephemeralStorage parameter. Temporary job files that disappear with the task fit this storage, which needs only a task definition change.
  options:
    b:
      en: |-
        EFS works, but it adds a file system, mount targets, and network I/O for data that is only temporary, which is more overhead.
    c:
      en: |-
        ECS attaches only new EBS volumes to tasks, created at launch or from a snapshot; an existing volume cannot be attached.
    d:
      en: |-
        Ephemeral storage is set by its own parameter; increasing CPU and memory does not add disk space.
references:
  - title: "Fargate task ephemeral storage for Amazon ECS - Amazon Elastic Container Service"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-task-storage.html
  - title: "Use Amazon EBS volumes with Amazon ECS - Amazon Elastic Container Service"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ebs-volumes.html
