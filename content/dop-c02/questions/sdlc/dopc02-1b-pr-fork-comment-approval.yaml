id: dopc02-1b-pr-fork-comment-approval
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company maintains a public open source SDK on GitHub. An AWS CodeBuild project with a webhook runs the integration tests for every pull request, and the project's service role can create resources in a dedicated test account. External contributors submit pull requests from forks, and the security team is concerned that a malicious pull request could change the build to misuse the service role. Pull requests from the company's maintainers must keep building automatically. Pull requests from forks must build only after a maintainer has reviewed the change and approved the build. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the webhook's pull request build policy to require comment approval for fork pull requests, with the GITHUB_ADMIN and GITHUB_MAINTAIN approver roles.
    - id: b
      text:
        en: |-
          Add an ACTOR_ACCOUNT_ID filter to the webhook filter group that matches only the GitHub user IDs of the maintainers who review external contributions.
    - id: c
      text:
        en: |-
          Add a FILE_PATH filter with excludeMatchedPattern set to true that excludes ^buildspec.yml$ from the webhook filter group.
    - id: d
      text:
        en: |-
          Add an AWS CodePipeline manual approval action that a maintainer must approve after the CodeBuild project finishes running the integration tests.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Pull request comment approval with the FORK_PULL_REQUESTS option holds builds for pull requests from forks until a user with an approver role comments with the latest commit SHA. Users who hold an approver role still get automatic builds for their own pull requests.
  options:
    b:
      en: |-
        An ACTOR_ACCOUNT_ID filter would never build pull requests from external contributors, even after a maintainer reviews them.
    c:
      en: |-
        Excluding buildspec changes skips those pull requests entirely, and malicious test code in other files would still run with the service role without any review.
    d:
      en: |-
        The webhook build runs the untrusted code before the approval, so an approval afterward protects nothing.
references:
  - title: Pull request comment approval - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/pull-request-build-policy.html
  - title: Use webhooks with AWS CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/webhooks.html
