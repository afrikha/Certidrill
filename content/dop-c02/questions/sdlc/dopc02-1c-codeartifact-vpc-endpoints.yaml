id: dopc02-1c-codeartifact-vpc-endpoints
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs AWS CodeBuild projects in private subnets of a VPC that has no internet gateway and no NAT gateway. The VPC already has interface endpoints for AWS STS, Amazon CloudWatch Logs, and every other service that the builds use. The projects build Java applications with Maven. Each build runs `aws codeartifact get-authorization-token` and then downloads its dependencies from an AWS CodeArtifact repository in the same Region.

    Which additional VPC endpoints must the company create? (Endpoint service names omit the com.amazonaws.region prefix.)
body:
  options:
    - id: a
      text:
        en: |-
          Interface endpoints for codeartifact.api, codeartifact.repositories, and ecr.api, all with private DNS enabled.
    - id: b
      text:
        en: |-
          Interface endpoints for codeartifact.repositories and ecr.api with private DNS enabled, and a gateway endpoint for Amazon S3.
    - id: c
      text:
        en: |-
          Interface endpoints for codeartifact.api and ecr.api with private DNS enabled, and a gateway endpoint for Amazon S3.
    - id: d
      text:
        en: |-
          Interface endpoints for codeartifact.api and codeartifact.repositories with private DNS enabled, and a gateway endpoint for Amazon S3.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The codeartifact.api endpoint serves API calls such as GetAuthorizationToken, and the codeartifact.repositories endpoint serves package manager traffic such as Maven downloads. CodeArtifact stores package assets in Amazon S3, so Maven also downloads the JAR files from S3, which requires an S3 gateway endpoint in a VPC without internet access.
  options:
    a:
      en: |-
        Without an S3 gateway endpoint, Maven can read package metadata but cannot download the assets that CodeArtifact stores in Amazon S3; the ECR endpoint is not used by Maven.
    b:
      en: |-
        Without the codeartifact.api endpoint, the get-authorization-token call fails, so the build has no token to authenticate Maven; the ECR endpoint does not help.
    c:
      en: |-
        Without the codeartifact.repositories endpoint, Maven cannot reach the repository endpoint to resolve packages; the ECR endpoint does not help.
references:
  - title: "Create VPC endpoints for CodeArtifact - CodeArtifact"
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/create-vpc-endpoints.html
  - title: "Create the Amazon S3 gateway endpoint - CodeArtifact"
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/create-s3-gateway-endpoint.html
