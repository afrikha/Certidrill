id: dopc02-1b-device-farm-fuzz-seed
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A gaming company's AWS CodePipeline pipeline includes an AWS Device Farm test action that runs the built-in fuzz test (BUILTIN_FUZZ) on a device pool of 25 phones for every release candidate. The action sends 6,000 random UI events to the app. When a fuzz run crashes the app, developers cannot tell whether a later release fixed the crash, because each run sends a different series of events. The team wants every pipeline run to send exactly the same series of UI events so that results can be compared across releases. The team does not want to replace the fuzz test with scripted tests.

    Which change to the Device Farm action configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase FuzzEventCount to 10,000 so that every run covers more of the app's screens.
    - id: b
      text:
        en: |-
          Set FuzzEventThrottle to 1,000 milliseconds so that the events are sent at a fixed pace.
    - id: c
      text:
        en: |-
          Set RecordVideo to true so that developers can replay the events that caused each crash.
    - id: d
      text:
        en: |-
          Set FuzzRandomizerSeed to the same fixed value in every pipeline run.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      FuzzRandomizerSeed is the seed that the fuzz test uses to randomize UI events, and using the same seed produces identical sequences of events. A fixed seed makes every run reproducible, so a crash either recurs or disappears after a fix.
  options:
    a:
      en: |-
        More events change the length of the run, but each run still uses a different random sequence.
    b:
      en: |-
        FuzzEventThrottle sets the wait time between events; it does not control which events are generated.
    c:
      en: |-
        A video records what happened in one run; it does not make the next run send the same events.
references:
  - title: AWS Device Farm test action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-DeviceFarm.html
