id: dopc02-1a-ecr-pull-through-docker-hub
objective: "1.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's AWS CodeBuild projects pull base images from Docker Hub in their Dockerfiles, and builds fail regularly because of Docker Hub rate limits. The security team wants every base image to be pulled from the company's Amazon ECR private registry so that the registry's scanning applies to it. The cached images must be refreshed from Docker Hub automatically, without custom code. The company has a paid Docker Hub account with an access token.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Store the Docker Hub user name and access token in an AWS Secrets Manager secret whose name starts with ecr-pullthroughcache/, in the registry's account and Region.
    - id: b
      text:
        en: |-
          Add a replication rule to the Amazon ECR registry settings with Docker Hub as the source registry and the company's private registry as the destination.
    - id: c
      text:
        en: |-
          Run the CodeBuild projects in a VPC with a NAT gateway so that all the requests to Docker Hub come from a single public IP address.
    - id: d
      text:
        en: |-
          Create a pull through cache rule for Docker Hub with an ECR repository prefix and the secret, and change the Dockerfiles to pull through that prefix.
    - id: e
      text:
        en: |-
          Run a nightly CodeBuild job that pulls the base images from Docker Hub and pushes them to Amazon ECR repositories with the same names.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A pull through cache rule caches images from an upstream registry in the private registry, and images are pulled by using the rule's repository prefix in the ECR URI. Docker Hub requires authentication, so its credentials must be stored in a Secrets Manager secret whose name starts with ecr-pullthroughcache/, in the same account and Region as the rule.
  options:
    b:
      en: |-
        Replication copies images between Amazon ECR private registries; Docker Hub cannot be a replication source.
    c:
      en: |-
        A NAT gateway changes the source IP address but the images would still come from Docker Hub, not from the private registry, and the limits still apply.
    e:
      en: |-
        A nightly copy job is custom work to maintain, and the images are refreshed only once a day instead of by the managed cache.
references:
  - title: Creating a pull through cache rule in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/pull-through-cache-creating-rule.html
