id: dopc02-1d-codeartifact-cross-account
objective: "1.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has an AWS CodeArtifact domain named corp and a repository named libs in a shared-services account, 111122223333. A CodeBuild service role in an application account, 444455556666, must download packages from libs but must not publish to it. The role's identity-based policy already allows codeartifact:GetAuthorizationToken, codeartifact:GetRepositoryEndpoint, and codeartifact:ReadFromRepository on the domain and repository ARNs, and sts:GetServiceBearerToken. The domain and the repository have no resource policies.

    Which combination of steps will grant the access with the LEAST privilege? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a domain policy to corp that allows codeartifact:GetAuthorizationToken for account 444455556666.
    - id: b
      text:
        en: |-
          Create a repository in account 444455556666 and associate an external connection that points to the libs repository.
    - id: c
      text:
        en: |-
          Add a bucket policy to the domain's package assets S3 bucket that allows s3:GetObject for account 444455556666.
    - id: d
      text:
        en: |-
          Add a repository policy to libs that allows codeartifact:ReadFromRepository and codeartifact:GetRepositoryEndpoint for account 444455556666.
    - id: e
      text:
        en: |-
          Add a repository policy to libs that allows codeartifact:PublishPackageVersion and codeartifact:ReadFromRepository for account 444455556666.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Cross-account access to CodeArtifact needs an allow in a resource policy and in the caller's identity-based policy. The domain owner must grant codeartifact:GetAuthorizationToken on the domain, and fetching packages also requires codeartifact:ReadFromRepository on the repository, granted here with the read-only repository policy.
  options:
    b:
      en: |-
        External connections only link a repository to supported public repositories such as npmjs.com or PyPI; another CodeArtifact repository is used as an upstream repository, not as an external connection.
    c:
      en: |-
        The package assets bucket is managed by CodeArtifact, not by the customer; access to packages is controlled by the domain and repository policies.
    e:
      en: |-
        PublishPackageVersion lets the role publish packages, which the requirement forbids and which exceeds least privilege.
references:
  - title: Repository policies - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/repo-policies.html
  - title: Domain policies - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/domain-policies.html
