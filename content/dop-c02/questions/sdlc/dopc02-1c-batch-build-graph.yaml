id: dopc02-1c-batch-build-graph
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company keeps three microservices and an integration test package in one repository. An AWS CodePipeline pipeline builds them with one AWS CodeBuild action. The company wants the three microservices to build in parallel, and the integration package to build only after all three microservice builds succeed. Everything must run inside the same build action. The deploy stage expects one artifact that contains the outputs of every build.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Define a build matrix in the batch section of the buildspec with one entry for each microservice and for the integration package, and enable batch builds on the CodeBuild action.
    - id: b
      text:
        en: |-
          Define a build graph in the batch section in which the integration task lists the three microservice tasks in `depend-on`, and set BatchEnabled and CombineArtifacts on the action.
    - id: c
      text:
        en: |-
          Define a build fanout with `parallelism` set to 4 in the batch section of the buildspec, and enable batch builds and combined artifacts on the CodeBuild action.
    - id: d
      text:
        en: |-
          Create three CodeBuild actions with the same run order and a fourth action with a higher run order, and add a fifth action that merges the four output artifacts into one.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A build graph runs tasks in dependency order: tasks without dependencies run in parallel, and a task with `depend-on` starts only after the tasks it lists complete. In the CodePipeline CodeBuild action, BatchEnabled runs the batch inside one action and CombineArtifacts merges the artifacts of every build into a single output artifact.
  options:
    a:
      en: |-
        A build matrix runs every combination in parallel; it cannot make the integration build wait for the three microservice builds.
    c:
      en: |-
        A build fanout splits one task, typically a test suite, into parallel shards; it does not express dependencies between different builds.
    d:
      en: |-
        Five actions spread across run orders break the requirement to run everything in one action and add a custom merge step to maintain.
references:
  - title: "Run builds in batches - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/batch-build.html
  - title: "AWS CodeBuild build and test action reference - AWS CodePipeline"
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodeBuild.html
