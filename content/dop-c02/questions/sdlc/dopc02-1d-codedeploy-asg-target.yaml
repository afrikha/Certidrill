id: dopc02-1d-codedeploy-asg-target
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company deploys a Java application with AWS CodeDeploy to Amazon EC2 instances. The deployment group targets instances that have the tag App=orders. The instances belong to an Auto Scaling group that scales out during peak hours. Instances launched by scale-out start without the application and receive it only at the next release. The company wants each new instance to receive the last successfully deployed revision automatically before the instance is put into service.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add user data to the launch template that downloads the newest revision .zip file from Amazon S3 and runs the application's install scripts.
    - id: b
      text:
        en: |-
          Change the deployment group so that it targets the Auto Scaling group instead of the App=orders EC2 tag.
    - id: c
      text:
        en: |-
          Create an EventBridge rule for EC2 Instance Launch Successful events that starts a new deployment of the deployment group.
    - id: d
      text:
        en: |-
          Enable the option that adds a termination hook to the Auto Scaling group in the deployment group settings.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When a deployment group targets an Auto Scaling group, CodeDeploy installs a launch lifecycle hook. Each new instance waits in Pending:Wait while CodeDeploy deploys the last successful revision to it, and it goes into service only when that deployment succeeds.
  options:
    a:
      en: |-
        User data bypasses CodeDeploy: the newest object in the bucket is not necessarily the last successful revision, the deployment is not tracked, and the lifecycle hooks of the AppSpec file are not run.
    c:
      en: |-
        The instance is already in service when the launch event fires, and the new deployment redeploys the whole deployment group instead of only the new instance.
    d:
      en: |-
        The termination hook only runs lifecycle events such as ApplicationStop when instances are terminated during scale-in; it does not deploy to new instances.
references:
  - title: Integrating CodeDeploy with Amazon EC2 Auto Scaling - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/integrations-aws-auto-scaling.html
