id: dopc02-1b-build-matrix-runtimes
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company maintains a Python data access library. Its unit and component tests must run on every pull request against each combination of three Python versions (3.11, 3.12, and 3.13) and two database engines (PostgreSQL and MySQL), six combinations in total. One AWS CodeBuild project with a single buildspec runs the tests; the buildspec reads the PYTHON_VERSION and DB_ENGINE environment variables to select the runtime and to start the matching database container. The six combinations must run in parallel. The company wants the LEAST configuration effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure a batch build with a build fanout and a parallelism of 6 so that CodeBuild runs six builds of the buildspec at the same time.
    - id: b
      text:
        en: |-
          Configure a batch build with a build graph of six entries, each with its own environment variables and a depend-on entry for the previous one.
    - id: c
      text:
        en: |-
          Create six CodeBuild projects, one per combination, each with its own webhook and environment variables.
    - id: d
      text:
        en: |-
          Configure a batch build with a build matrix whose dynamic environment variables list the three PYTHON_VERSION values and the two DB_ENGINE values.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A build matrix creates a separate build for each combination of the listed buildspecs and environment variable values and runs them in parallel. Three Python versions and two engines produce the six required builds from one project and one buildspec.
  options:
    a:
      en: |-
        A build fanout splits one test task across identical builds for sharding; every build gets the same variables, so the combinations are not covered.
    b:
      en: |-
        depend-on makes each build wait for the previous one, so the combinations do not run in parallel.
    c:
      en: |-
        Six projects with six webhooks work but need much more configuration than one batch build.
references:
  - title: Run builds in batches - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/batch-build.html
