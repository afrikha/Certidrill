id: dopc02-1c-cfn-package-lambda
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A development team stores an AWS CloudFormation template in a Git repository. The template defines several AWS Lambda functions whose `Code` properties point to local folders of the repository. The team wants AWS CodePipeline to deploy the template automatically after every merge to the main branch. Developers must not run any deployment step from their workstations. A CloudFormation deploy action that uses the source artifact fails because CloudFormation cannot use the local paths.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the CloudFormation deploy action on the source artifact, and set its template path to the template file in the root of the repository instead of a subfolder.
    - id: b
      text:
        en: |-
          Ask developers to run `aws cloudformation deploy` from their workstations after each merge, and keep the pipeline only for the build and test stages.
    - id: c
      text:
        en: |-
          Add an AWS CodeBuild action that runs `aws cloudformation package` with an S3 bucket, and pass the rewritten template that it outputs to the CloudFormation deploy action.
    - id: d
      text:
        en: |-
          Add an Amazon S3 deploy action that extracts the source artifact into a bucket, and replace the local paths in the `Code` properties with the name of that bucket.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `aws cloudformation package` uploads the local artifacts that a template references (folders are zipped first) to an S3 bucket and returns a copy of the template in which each local path is replaced by its S3 location. Running it in a CodeBuild action and passing the packaged template as an output artifact lets the CloudFormation deploy action create the functions without any manual step.
  options:
    a:
      en: |-
        Moving the template does not change its `Code` properties: CloudFormation still cannot read local folders.
    b:
      en: |-
        Running the deployment from workstations is the manual step that the team must eliminate.
    d:
      en: |-
        The S3 deploy action extracts individual files; Lambda needs a .zip object referenced by bucket and key for each function, and editing the template by hand after each change is manual work.
references:
  - title: "package — AWS CLI 2.37.12 Command Reference"
    url: https://docs.aws.amazon.com/cli/latest/reference/cloudformation/package.html
