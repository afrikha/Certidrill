id: dopc02-1d-heartbeat-leftover-hooks
objective: "1.4.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team deleted an AWS CodeDeploy application named web without first deleting its deployment group, and then recreated the application with a new deployment group that targets the same Auto Scaling group. Since then, every instance that the Auto Scaling group launches waits in Pending:Wait and is then abandoned with the status reason "Lifecycle Action with token ... was abandoned: Heartbeat Timeout". Deployments that the new deployment group runs on the existing instances succeed. The account is not near its CodeDeploy quotas.

    Which solution will resolve the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Find the lifecycle hooks that the old deployment group left on the Auto Scaling group, delete only those hooks, and update the new deployment group with the Auto Scaling group name so that CodeDeploy reinstalls its hook.
    - id: b
      text:
        en: |-
          Increase the heartbeat timeout of every lifecycle hook on the Auto Scaling group to two hours so that the launch deployments have enough time to complete.
    - id: c
      text:
        en: |-
          Suspend the Launch process of the Auto Scaling group, run a deployment to all existing instances, and then resume the Launch process.
    - id: d
      text:
        en: |-
          Delete every lifecycle hook on the Auto Scaling group, including the hook of the new deployment group, and keep the deployment group targeting the Auto Scaling group.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Deleting an application before its deployment groups can leave CodeDeploy-managed lifecycle hooks on the Auto Scaling group; nothing completes them, so launches end in a heartbeat timeout. The documented fix is to identify the leftover hooks (describe-lifecycle-hooks), delete only those, and run update-deployment-group with the Auto Scaling group so that CodeDeploy reinstalls its own hook.
  options:
    b:
      en: |-
        The old hook belongs to a deployment group that no longer exists, so no deployment will ever complete it; a longer timeout only delays the abandonment.
    c:
      en: |-
        Suspending launches does not remove the orphaned hook, so new instances fail again as soon as the Launch process resumes.
    d:
      en: |-
        Deleting the new deployment group's hook stops CodeDeploy from deploying to new instances, so they would go into service without the application.
references:
  - title: Troubleshoot Amazon EC2 Auto Scaling issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-auto-scaling.html
