id: dopc02-1b-artifact-lambda-code-signing
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys AWS Lambda functions as .zip file archives through AWS CodePipeline. The build stage signs each package with an AWS Signer signing profile. The security team created a code signing configuration that lists this signing profile as the allowed publisher and attached it to all the functions. During a test, an engineer deployed an unsigned package from a laptop, and the deployment succeeded with only a warning. The security team requires that Lambda rejects any package that is not signed by the allowed signing profile.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the UntrustedArtifactOnDeployment policy of the code signing configuration to Enforce.
    - id: b
      text:
        en: |-
          Add a service control policy that denies lambda:UpdateFunctionCode to every principal except the pipeline's deployment role.
    - id: c
      text:
        en: |-
          Turn on S3 Object Lock in compliance mode for the bucket that stores the signed packages.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on the SignatureValidationErrors metric that notifies the security team through Amazon SNS.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The UntrustedArtifactOnDeployment policy defines what Lambda does when a package fails the signature checks. The default, Warn, allows the deployment and only issues a warning; Enforce also blocks the deployment.
  options:
    b:
      en: |-
        An SCP limits who can deploy, but Lambda would still accept an unsigned package deployed by the pipeline role.
    c:
      en: |-
        Object Lock protects stored objects from deletion or overwrite; it does not make Lambda verify signatures.
    d:
      en: |-
        An alarm detects the problem after the unsigned package is deployed; it does not reject the deployment.
references:
  - title: Using code signing to verify code integrity with Lambda - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-codesigning.html
