id: dopc02-1b-stage-onfailure-rollback
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys a containerized web service with an AWS CodePipeline V2 pipeline whose structure has not changed for several months. The Production stage contains an Amazon ECS deploy action followed by an AWS CodeBuild action that runs smoke tests against the production endpoint. Last week, the smoke tests failed after a deployment, and the faulty version stayed in production for an hour until an engineer redeployed the previous release by hand. The company wants the pipeline to return production to the last successful release automatically whenever the smoke tests fail. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an onFailure condition with the ROLLBACK result on the Production stage.
    - id: b
      text:
        en: |-
          Configure automatic stage retry on the Production stage with the retry mode set to retry failed actions.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule for failed pipeline executions that invokes a Lambda function, which starts a new execution with the previous source revision.
    - id: d
      text:
        en: |-
          Configure a beforeEntry condition with a CloudWatchAlarm rule and the FAIL result on the Production stage.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A stage condition of type On Failure supports the Rollback result, which rolls the stage back to the previous successful pipeline execution when an action in the stage, here the smoke test, fails. The rollback works because the previous execution was started in the current pipeline structure version.
  options:
    b:
      en: |-
        Retrying the failed smoke test action runs it again against the faulty version; it does not restore the previous release.
    c:
      en: |-
        A Lambda function that restarts the pipeline is custom code for what a stage condition already does.
    d:
      en: |-
        An entry condition is checked before the stage starts, so it cannot react to smoke tests that fail after the deployment.
references:
  - title: Configure conditions for a stage - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/stage-conditions.html
