id: dopc02-1d-codeartifact-bearer-token
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodeBuild project builds a Node.js application and must download npm packages from an AWS CodeArtifact repository in the same account. The project's service role has an IAM policy that allows codeartifact:GetAuthorizationToken, codeartifact:GetRepositoryEndpoint, and codeartifact:ReadFromRepository on the domain and the repository. The buildspec runs aws codeartifact login --tool npm in the pre_build phase, and this command fails with an AccessDenied error. The build must never publish packages, and the company requires least privilege.

    Which change will resolve the error?
body:
  options:
    - id: a
      text:
        en: |-
          Add sts:AssumeRole on the service role's own ARN to the service role policy so that the build can obtain a session for CodeArtifact.
    - id: b
      text:
        en: |-
          Add a statement to the domain's resource policy that allows sts:GetServiceBearerToken for the CodeBuild service role.
    - id: c
      text:
        en: |-
          Add codeartifact:PublishPackageVersion and codeartifact:PutPackageMetadata on the repository to the service role policy.
    - id: d
      text:
        en: |-
          Add sts:GetServiceBearerToken to the service role policy with the condition sts:AWSServiceName equal to codeartifact.amazonaws.com.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      GetAuthorizationToken requires both codeartifact:GetAuthorizationToken and sts:GetServiceBearerToken in the caller's identity-based policy. The CodeArtifact documentation for CodeBuild grants sts:GetServiceBearerToken with the condition sts:AWSServiceName = codeartifact.amazonaws.com, which limits the permission to CodeArtifact tokens.
  options:
    a:
      en: |-
        The build already runs with the service role's credentials; assuming the same role adds nothing and does not grant the missing sts:GetServiceBearerToken permission.
    b:
      en: |-
        sts:GetServiceBearerToken can be written in a domain policy, but it has no effect there: the permission must be in the identity-based policy of the role.
    c:
      en: |-
        Publishing permissions are not needed to read packages, break the least-privilege requirement, and do not fix the token request.
references:
  - title: AWS CodeArtifact authentication and tokens - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/tokens-authentication.html
  - title: Using npm packages in CodeBuild - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/using-npm-packages-in-codebuild.html
