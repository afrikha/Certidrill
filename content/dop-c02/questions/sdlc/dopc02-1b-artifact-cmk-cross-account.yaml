id: dopc02-1b-artifact-cmk-cross-account
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs AWS CodePipeline in a tools account (111122223333). The pipeline's Amazon S3 artifact bucket uses the default encryption that the pipeline wizard configured with the AWS managed key aws/s3. The company adds a deploy action that runs in a production account (444455556666) by assuming a cross-account role. The action fails because the production account cannot decrypt the input artifact. Company policy requires every artifact to stay encrypted with AWS KMS.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Edit the key policy of the aws/s3 AWS managed key in the tools account to allow the production account's cross-account role to use the key for decryption.
    - id: b
      text:
        en: |-
          Remove the default encryption from the artifact bucket, and add a statement to the bucket policy that allows the production account's cross-account role to read the artifacts.
    - id: c
      text:
        en: |-
          Configure S3 Replication from the artifact bucket to a bucket in the production account, and change the deploy action so that it reads its input artifact from the replica bucket.
    - id: d
      text:
        en: |-
          Create a customer managed KMS key that the production account is allowed to use, set it as the artifact store encryption key, and grant the production account access in the bucket policy.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A pipeline that uses resources in another AWS account requires a customer managed key, created in the pipeline's Region, whose key policy grants the other account access. The artifact store references this key, and the bucket policy allows the other account to read the artifacts.
  options:
    a:
      en: |-
        AWS managed key policies are controlled by the service and cannot be changed, and resources encrypted with an AWS managed key cannot be shared with other accounts.
    b:
      en: |-
        Removing the encryption breaks the policy that every artifact must stay encrypted with AWS KMS.
    c:
      en: |-
        CodePipeline passes artifacts through its own artifact store, and the copies would still need a key that the production account can use.
references:
  - title: Create a pipeline in CodePipeline that uses resources from another AWS account - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-create-cross-account.html
  - title: AWS KMS keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html
