id: dopc02-1a-cross-account-cfn-steps
objective: "1.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs AWS CodePipeline in a shared tooling account (111122223333). The pipeline's artifact bucket is encrypted with a customer managed KMS key in the tooling account. The company adds a stage with an AWS CloudFormation deploy action that must create and update a stack in a workload account (444455556666) in the same Region. Security policy forbids long-term access keys, and the resources of the stack must be created with permissions that are scoped to the workload account.

    Which combination of steps will meet these requirements? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Create the pipeline's artifact bucket in the workload account, and grant the tooling account's pipeline service role permission to write artifacts to that bucket.
    - id: b
      text:
        en: |-
          Grant the workload account use of the KMS key in its key policy, and allow the workload account to read and write objects in the bucket policy of the artifact bucket.
    - id: c
      text:
        en: |-
          Create a role in the workload account that trusts the pipeline service role, allow the service role to assume it, and set it as the roleArn of the deploy action.
    - id: d
      text:
        en: |-
          Create an IAM user in the workload account, and store its access keys in Secrets Manager so that the CloudFormation action can sign its requests with them.
    - id: e
      text:
        en: |-
          Set the region field of the deploy action to the Region of the workload account so that CodePipeline copies the artifacts into the workload account.
    - id: f
      text:
        en: |-
          Create a CloudFormation service role in the workload account, set it as the RoleArn of the deploy action, and allow the cross-account role to pass it.
answer: { optionIds: [ b, c, f ] }
explanation:
  correct:
    en: |-
      The workload account must be able to decrypt and read the artifacts, so both the key policy and the artifact bucket policy must grant it access. The action's roleArn points to a cross-account role in the workload account that the pipeline service role assumes. The CloudFormation RoleArn must be in the same account as the role that runs the action, so the service role that creates the stack's resources lives in the workload account.
  options:
    a:
      en: |-
        The artifact bucket must be in the pipeline's account and Region; CodePipeline does not use an artifact store in another account.
    d:
      en: |-
        Pipeline actions use roles, not access keys, and long-term keys are forbidden by the security policy.
    e:
      en: |-
        The region field creates a cross-Region action; it does not move artifacts into another account, and the workload account is in the same Region.
references:
  - title: Create a pipeline in CodePipeline that uses resources from another AWS account - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-create-cross-account.html
  - title: CloudFormation deploy action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CloudFormation.html
