id: dopc02-1a-codedeploy-alarm-rollback
objective: "1.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS CodeDeploy blue/green deployments for an application on Amazon EC2 instances in an Auto Scaling group. An Amazon CloudWatch alarm named web-5xx-high monitors the HTTP 5XX error rate of the Application Load Balancer. If the alarm enters the ALARM state during a deployment, the deployment must stop and CodeDeploy must redeploy the last known good revision automatically. The company does not want to write custom code.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add the web-5xx-high alarm to the alarm configuration of the deployment group, and grant the CodeDeploy service role the required CloudWatch permissions.
    - id: b
      text:
        en: |-
          Create an EventBridge rule that matches the alarm's state change to ALARM and invokes a Lambda function that stops the deployment.
    - id: c
      text:
        en: |-
          Configure a CodeDeploy trigger on the deployment group that sends the alarm's notifications to an Amazon SNS topic subscribed by CodeDeploy.
    - id: d
      text:
        en: |-
          Enable automatic rollback on the deployment group with the option to roll back when alarm thresholds are met.
    - id: e
      text:
        en: |-
          Enable automatic rollback on the deployment group with only the option to roll back when a deployment fails.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A deployment group can be associated with up to ten CloudWatch alarms, and the deployment stops when one of them is activated; the CodeDeploy service role needs CloudWatch permissions for this. With rollback when alarm thresholds are met, CodeDeploy then redeploys the last known good revision as a new deployment.
  options:
    b:
      en: |-
        A Lambda function that stops deployments is custom code for behavior that the deployment group provides natively.
    c:
      en: |-
        CodeDeploy triggers send notifications about deployment events to SNS; CodeDeploy does not subscribe to topics to react to alarms.
    e:
      en: |-
        Rolling back only on deployment failure does not cover the alarm option; the alarm-based rollback must be selected for an activated alarm to redeploy the last good revision.
references:
  - title: Configure advanced options for a deployment group - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-groups-configure-advanced-options.html
  - title: Monitoring deployments with CloudWatch alarms in CodeDeploy - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/monitoring-create-alarms.html
