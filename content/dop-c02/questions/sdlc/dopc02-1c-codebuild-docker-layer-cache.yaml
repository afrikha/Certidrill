id: dopc02-1c-codebuild-docker-layer-cache
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company builds Docker images in an AWS CodeBuild project on a Linux environment that is not connected to a VPC. Builds start every few minutes during the workday. Each build spends most of its time pulling a large base image and rebuilding layers that rarely change. The company wants to shorten the builds without changing the Dockerfile or adding new AWS services.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on the local cache with source cache mode, so that the project reuses the Git metadata of the repository between builds.
    - id: b
      text:
        en: |-
          Move the project to AWS Lambda compute, so that the build environment starts faster than on Amazon EC2 compute.
    - id: c
      text:
        en: |-
          Turn on the local cache with Docker layer cache mode, and run the project in privileged mode.
    - id: d
      text:
        en: |-
          Turn on the local cache with custom cache mode, and list the folder that contains the application source code under cache paths.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Docker layer cache mode of the CodeBuild local cache keeps existing Docker layers on the build host, which avoids pulling large images and rebuilding unchanged layers. It is available for Linux environments and requires the privileged flag. A local cache suits frequent builds, because only the host that created the cache can reuse it.
  options:
    a:
      en: |-
        Source cache mode caches Git metadata only; it does nothing for Docker image layers.
    b:
      en: |-
        Lambda compute does not support Docker builds, so the project could not build images at all.
    d:
      en: |-
        Custom cache mode caches directories listed in the buildspec, not the Docker layer store, and caching the source folder can override the downloaded sources.
references:
  - title: "Local caching - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/caching-local.html
  - title: "Cache builds to improve performance - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-caching.html
