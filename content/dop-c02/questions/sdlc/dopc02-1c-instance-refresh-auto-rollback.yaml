id: dopc02-1c-instance-refresh-auto-rollback
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys each release as a new AMI. A pipeline creates a new version of the launch template and starts an instance refresh on the Auto Scaling group. The Auto Scaling group references the launch template version $Latest. The company wants the instance refresh to roll back automatically to the previous AMI if the refresh fails or if an Amazon CloudWatch alarm on HTTP 5xx errors enters the ALARM state during the refresh.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep $Latest on the Auto Scaling group, and start the instance refresh with AutoRollback set to true and the 5xx alarm in the alarm specification.
    - id: b
      text:
        en: |-
          Use numbered launch template versions, and start the refresh with a desired configuration for the new version, AutoRollback set to true, and the 5xx alarm.
    - id: c
      text:
        en: |-
          Change the launch template to resolve the AMI from a Systems Manager parameter, and start the refresh with AutoRollback set to true and the 5xx alarm.
    - id: d
      text:
        en: |-
          Keep $Latest on the Auto Scaling group, and start the refresh with the 5xx alarm in the alarm specification and AutoRollback left unset.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Rollback is available only when the refresh specifies a desired configuration, and only to a launch template referenced by a specific version number, not $Latest or $Default. With AutoRollback set to true, the refresh rolls back if it fails or if one of the specified alarms enters the ALARM state.
  options:
    a:
      en: |-
        Rollback is not available when the group uses $Latest or $Default, so there is no fixed previous configuration to return to.
    c:
      en: |-
        Rollback is not supported for a launch template that uses a Systems Manager parameter as an AMI alias.
    d:
      en: |-
        An alarm without auto rollback makes the refresh fail without rolling back, and $Latest prevents rollback anyway.
references:
  - title: "Undo changes with a manual or auto rollback - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/instance-refresh-rollback.html
