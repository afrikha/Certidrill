id: dopc02-1a-cross-account-secret-cmk
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security account (111122223333) stores a code-signing key in an AWS Secrets Manager secret encrypted with the AWS managed key aws/secretsmanager. An AWS CodeBuild project in a tooling account (444455556666) must read the secret during builds. Administrators added a resource policy to the secret that allows the CodeBuild service role to call secretsmanager:GetSecretValue, and gave the role the same action on the secret's full ARN in its identity policy. The builds still fail with an access denied error when they read the secret.

    Which additional steps will resolve the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Add kms:Decrypt on the ARN of the aws/secretsmanager key in the security account to the identity policy of the CodeBuild service role in the tooling account.
    - id: b
      text:
        en: |-
          Replicate the secret into the tooling account with Secrets Manager replication, and reference the replica in the buildspec of the project.
    - id: c
      text:
        en: |-
          Encrypt the secret with a customer managed key in the security account whose key policy allows the role to decrypt, and add kms:Decrypt on that key to the role.
    - id: d
      text:
        en: |-
          Attach the AWS managed SecretsManagerReadWrite policy to the CodeBuild service role so that it can read and decrypt secrets in any account.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The AWS managed key aws/secretsmanager cannot be used for cross-account access. The secret must be encrypted with a customer managed key whose key policy allows the other account's role to use kms:Decrypt, and the role's identity policy must also allow kms:Decrypt on that key, in addition to the resource and identity policies for the secret.
  options:
    a:
      en: |-
        The key policy of an AWS managed key cannot grant another account access, so an identity policy alone cannot allow decryption with it.
    b:
      en: |-
        Secrets Manager replication copies a secret to other Regions of the same account; it does not create a replica in another account.
    d:
      en: |-
        Identity permissions in the tooling account do not overcome the missing access to the KMS key, and the policy grants far more than the build needs.
references:
  - title: Access AWS Secrets Manager secrets from a different account - AWS Secrets Manager
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access_examples_cross.html
