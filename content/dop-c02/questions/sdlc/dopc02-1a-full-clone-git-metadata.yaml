id: dopc02-1a-full-clone-git-metadata
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's build computes the application version by running git describe --tags, which needs the repository's commit history and tags. The AWS CodePipeline pipeline uses a GitHub source action through AWS CodeConnections with the default output artifact format, followed by an AWS CodeBuild action. The build fails because the source directory is not a Git repository. Security policy forbids storing GitHub tokens in build projects or environment variables.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the output artifact format of the source action to full clone (CODEBUILD_CLONE_REF), and allow the CodeBuild service role to use the connection.
    - id: b
      text:
        en: |-
          Turn on the local source cache mode in the CodeBuild project so that Git metadata from earlier builds is available to the git describe command.
    - id: c
      text:
        en: |-
          Add a git clone command to the buildspec that uses a GitHub personal access token stored as a plaintext environment variable of the project.
    - id: d
      text:
        en: |-
          Set the output artifact format of the source action to full clone (CODEBUILD_CLONE_REF), and pass the output artifact directly to an AWS CodeDeploy action.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With CODEBUILD_CLONE_REF, the source action outputs a reference to the repository instead of a ZIP of the files, and a downstream CodeBuild action clones the repository with its Git metadata. The CodeBuild service role needs permission to use the connection (codeconnections:UseConnection), so no token is stored in the project.
  options:
    b:
      en: |-
        The source cache keeps Git metadata of sources that CodeBuild clones itself; a ZIP input artifact from CodePipeline still contains no repository history.
    c:
      en: |-
        Storing a token in a plaintext environment variable violates the security policy and exposes the token in the console.
    d:
      en: |-
        The Git URL reference can be used only by downstream CodeBuild actions; passing it to other actions results in an error, and the build still lacks the history.
references:
  - title: CodeStarSourceConnection for Bitbucket Cloud, GitHub, GitHub Enterprise Server, GitLab.com, and GitLab self-managed actions - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodestarConnectionSource.html
