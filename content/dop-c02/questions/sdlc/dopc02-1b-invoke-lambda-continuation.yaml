id: dopc02-1b-invoke-lambda-continuation
objective: "1.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline uses an AWS Lambda invoke action to start a data validation test suite in an external test platform through its API. The suite takes about 40 minutes, and the function currently waits for the result, so it reaches the Lambda timeout and the action fails. The team that owns the function wants to keep using it, and the result of the suite must decide whether the pipeline continues. The solution must be fully automated and require the fewest changes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the function's timeout to 60 minutes so that the function can wait for the test suite to finish and then report the result.
    - id: b
      text:
        en: |-
          Make the function start the suite and call PutJobSuccessResult with a continuation token, then check the suite's status on each new invocation and report the final result.
    - id: c
      text:
        en: |-
          Replace the Lambda invoke action with a Step Functions invoke action that runs an Express workflow, which calls the function in a loop with a Wait state until the suite finishes.
    - id: d
      text:
        en: |-
          Add a manual approval action after the Lambda invoke action so that a tester approves the pipeline when the suite finishes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A continuation token lets a Lambda invoke action monitor a long-running asynchronous process: CodePipeline invokes the function again with the token, and the action can continue beyond the 15-minute Lambda limit. The final call to PutJobSuccessResult or PutJobFailureResult decides whether the pipeline continues.
  options:
    a:
      en: |-
        A Lambda function cannot run for longer than 15 minutes.
    c:
      en: |-
        CodePipeline does not wait for an Express workflow to finish, so the suite's result would not decide whether the pipeline continues, and Express workflows cannot run for 40 minutes anyway.
    d:
      en: |-
        A manual approval adds a human step, and the solution must be fully automated.
references:
  - title: Invoke an AWS Lambda function in a pipeline in CodePipeline - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/actions-invoke-lambda-function.html
