id: dopc02-1b-shared-report-group-arn
objective: "1.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has 30 AWS CodeBuild projects, one per microservice. Each buildspec contains a reports section with an entry named unit-tests, and the quality team now sees 30 report groups such as orders-unit-tests and payments-unit-tests. The quality team wants the unit test results of all 30 projects in one report group named unit-tests, which the team has already created, so that it can follow pass rates in one place. The service roles must have only the permissions that they need.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Replace the unit-tests entry name in each buildspec's reports section with the ARN of the unit-tests report group.
    - id: b
      text:
        en: |-
          Keep the unit-tests entry name in each buildspec, and delete the 30 project-specific report groups so that CodeBuild reuses the group named unit-tests.
    - id: c
      text:
        en: |-
          Allow codebuild:CreateReport, codebuild:UpdateReport, and codebuild:BatchPutTestCases in each service role, with the unit-tests report group ARN as the resource.
    - id: d
      text:
        en: |-
          Set the batch report mode of each project to Aggregate so that the results of all projects are combined into one report.
    - id: e
      text:
        en: |-
          Configure each project-specific report group to export its raw results to the same Amazon S3 bucket.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      In a reports section, a new name creates a report group named after the project and that name, while an existing report group's ARN makes all projects write to that group. Writing test results requires CreateReport, UpdateReport, and BatchPutTestCases, which can be scoped to the report group ARN; CreateReportGroup is no longer needed because the group exists.
  options:
    b:
      en: |-
        A name in the reports section is always prefixed with the project name, so CodeBuild would recreate the project-specific groups.
    d:
      en: |-
        Batch report mode controls how a batch build reports its status to the source provider; it does not merge report groups.
    e:
      en: |-
        Exported raw files in a bucket are not a report group in which the team can follow pass rates.
references:
  - title: Build specification reference for CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
  - title: Test report permissions - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/test-permissions.html
