id: dopc02-1a-execution-mode-queued
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an AWS CodePipeline pipeline of type V2 that runs on every push to the main branch and deploys to a single shared production environment. Developers often merge several commits within a few minutes. An audit found that some commits have no production deployment record: while a production deployment was running, a newer execution replaced an older one that was waiting before the production stage. The auditors require that every merged commit is deployed to production in its own execution, in the order in which the commits were merged.

    Which change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the SUPERSEDED execution mode, and add a manual approval action before the production stage so that each execution is reviewed.
    - id: b
      text:
        en: |-
          Change the execution mode to PARALLEL so that every commit runs in its own execution without waiting for other executions.
    - id: c
      text:
        en: |-
          Disable the transition into the production stage while a deployment runs, and enable it again when the deployment is complete.
    - id: d
      text:
        en: |-
          Change the execution mode to QUEUED so that executions are processed one by one in the order in which they were started.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      In QUEUED mode, which requires a V2 pipeline, waiting executions do not overtake executions that have already started; they queue at locked stages and run one by one in order. Every commit therefore gets its own production deployment, in merge order.
  options:
    a:
      en: |-
        SUPERSEDED is the behavior that lets a newer execution replace an older waiting one; an approval action does not change that.
    b:
      en: |-
        PARALLEL executions run independently and simultaneously against the same shared production environment, so ordering is not guaranteed; AWS suggests this mode for targets that are not shared.
    c:
      en: |-
        Disabling the transition is manual, and in SUPERSEDED mode a newer execution can still replace an older one that waits before the stage.
references:
  - title: How pipeline executions work - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/concepts-how-it-works.html
