id: dopc02-1c-ecr-pull-through-docker-hub
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodeBuild projects pull public base images from Docker Hub during every build. Builds increasingly fail because of Docker Hub rate limits. The company has an authenticated Docker Hub account. The company wants the base images to be cached in Amazon ECR in the same account and Region, refreshed from Docker Hub automatically, and used by the builds with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the Docker Hub credentials in an AWS Secrets Manager secret whose name starts with `ecr-pullthroughcache/`, create a pull through cache rule for Docker Hub that uses it, and reference the ECR cache URIs in the Dockerfiles.
    - id: b
      text:
        en: |-
          Store the Docker Hub credentials in an AWS Systems Manager Parameter Store SecureString parameter, create a pull through cache rule for Docker Hub that uses it, and reference the ECR cache URIs in the Dockerfiles.
    - id: c
      text:
        en: |-
          Create an ECR registry replication rule that uses Docker Hub as the source registry and the company's private registry as the destination, and reference the replicated repositories in the Dockerfiles.
    - id: d
      text:
        en: |-
          Create a scheduled CodeBuild project that pulls each base image from Docker Hub, pushes it to an ECR repository every night, and update the Dockerfiles to use those repositories.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An ECR pull through cache rule caches images from an upstream registry the first time they are pulled through the private registry URI, creates the repositories automatically, and checks the upstream for a newer version when a cached image has not been validated in the last 24 hours. Docker Hub requires authentication through a Secrets Manager secret whose name uses the `ecr-pullthroughcache/` prefix, in the same account and Region as the rule.
  options:
    b:
      en: |-
        Pull through cache rules read upstream credentials only from Secrets Manager secrets with the required prefix, not from Parameter Store.
    c:
      en: |-
        Registry replication copies images between ECR private registries only; Docker Hub cannot be a replication source.
    d:
      en: |-
        A scheduled copy job works, but it is custom code to maintain, and it must be updated for each new base image.
references:
  - title: "Sync an upstream registry with an Amazon ECR private registry - Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/pull-through-cache.html
