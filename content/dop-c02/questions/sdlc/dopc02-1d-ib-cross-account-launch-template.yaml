id: dopc02-1d-ib-cross-account-launch-template
objective: "1.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations. An EC2 Image Builder pipeline in a shared-services account builds a hardened AMI every week. The AMI is encrypted with a customer managed AWS KMS key whose key policy already allows the workload accounts to use the key. Three workload accounts each run an Auto Scaling group from a launch template that the workload account owns, in the same Region as the pipeline. After each pipeline run, the new AMI must be available in the three workload accounts, and each workload account's launch template must get a new default version that uses the new AMI. The DevOps team wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          In the distribution settings, grant launch permission to the organization ARN and add a launch template configuration with the account ID of each workload account. Create no IAM roles in the workload accounts.
    - id: b
      text:
        en: |-
          Create an EventBridge rule that matches completed Image Builder images and invokes a Lambda function that shares the AMI and assumes a role in each workload account to create a new launch template version.
    - id: c
      text:
        en: |-
          In the distribution settings, list the workload accounts in targetAccountIds and add a launch template configuration with each account ID. In each workload account, create the EC2ImageBuilderDistributionCrossAccountRole role that trusts the shared-services account.
    - id: d
      text:
        en: |-
          Create an Image Builder pipeline in each workload account that uses a copy of the shared image recipe and distributes the AMI to its own Region with a launch template configuration for its own launch template.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Image Builder distribution settings can copy the AMI to target accounts and create a new launch template version in another account when the configuration includes that account ID. For cross-account launch template updates, Image Builder assumes the EC2ImageBuilderDistributionCrossAccountRole in the target account, which carries the Ec2ImageBuilderCrossAccountDistributionAccess managed policy, the launch template permissions and the KMS permissions for encrypted AMIs. setDefaultVersion defaults to true, so the new version becomes the default.
  options:
    a:
      en: |-
        A cross-account launch template update requires the target account in targetAccountIds or in the launchPermission userIds; permissions granted through organizationArns are rejected for this purpose. Image Builder also needs the cross-account role in each workload account to update their launch templates.
    b:
      en: |-
        This works, but it replaces a built-in distribution feature with custom code that the team must write, secure and maintain, which is not the least operational overhead.
    d:
      en: |-
        Running one pipeline per account builds the same image several times and multiplies the pipelines, recipes and components to maintain, while a single pipeline can distribute to the other accounts.
references:
  - title: Configure AMI distribution with an EC2 launch template - EC2 Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/dist-using-launch-template.html
  - title: Set up cross-account AMI distribution with Image Builder - EC2 Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/cross-account-dist.html
