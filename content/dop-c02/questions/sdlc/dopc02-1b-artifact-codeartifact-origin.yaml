id: dopc02-1b-artifact-codeartifact-origin
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's AWS CodeArtifact repository has an external connection to the public npm registry, and builds install both public packages and internal packages from it. The internal package acme-billing-utils was first published directly to the repository in 2021. The security team learns that someone has published a package with the same name and a higher version number to the public npm registry. The company must make sure that builds never receive the public package with this name, while the team can continue to publish new internal versions and builds can still install other public packages.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Remove the external connection to the public npm registry from the repository.
    - id: b
      text:
        en: |-
          Add a statement to the repository policy that denies codeartifact:ReadFromRepository to the build roles.
    - id: c
      text:
        en: |-
          Ask the teams to pin the current version of acme-billing-utils in every package.json file.
    - id: d
      text:
        en: |-
          Set the package origin controls of acme-billing-utils to publish ALLOW and upstream BLOCK.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Package origin controls protect against dependency substitution: upstream BLOCK stops versions from being ingested from upstream repositories or public sources, while publish ALLOW keeps direct publishing. A package first published directly gets these settings by default, but packages created before about May 2022 default to ALLOW for both and must be set explicitly.
  options:
    a:
      en: |-
        Removing the external connection would also stop builds from installing the other public packages they need.
    b:
      en: |-
        ReadFromRepository applies to the whole repository, so denying it blocks every package, not only the public copy.
    c:
      en: |-
        Pinning depends on every team and does not stop a new or changed package.json from pulling the public version through the repository.
references:
  - title: Editing package origin controls - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/package-origin-controls.html
