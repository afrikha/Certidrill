id: dopc02-1c-ecr-creation-template-replication
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company builds container images in a central tooling account and pushes them to Amazon ECR in us-east-1. A registry replication rule copies every repository to two workload accounts, each in us-east-1 and eu-west-1. Teams create new repositories in the tooling account at any time. The security team requires that every replicated repository in the workload accounts use tag immutability, encryption with a customer managed AWS KMS key, and a lifecycle policy that expires untagged images. Today, the replicated repositories are created with default settings.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Configure tag immutability, KMS encryption, and the lifecycle policy on the source repositories, and add ecr:ReplicateImage to the destination registry policies so that ECR replicates the settings.
    - id: b
      text:
        en: |-
          In each workload account and Region, create a repository creation template that applies to replication with the required settings, and give it a repository creation role that can use the KMS key.
    - id: c
      text:
        en: |-
          In each workload account and Region, create an Amazon EventBridge rule on CreateRepository events that invokes an AWS Lambda function to apply the required settings.
    - id: d
      text:
        en: |-
          Remove ecr:CreateRepository from the destination registry policies, and have the workload accounts create each new repository with the required settings before the first push.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Replication does not copy repository settings, and repository and lifecycle policies are never replicated. A repository creation template that applies to replication sets tag mutability, encryption, repository policy, and lifecycle policy when ECR creates the repository in the destination registry. A repository creation role is required when the template uses KMS encryption or resource tags.
  options:
    a:
      en: |-
        Repository settings are not replicated by default, and repository and lifecycle policies are never replicated, whatever the registry policy allows.
    c:
      en: |-
        Custom Lambda code in four account-Region pairs works, but it adds code to maintain and leaves a window in which images land in unprotected repositories.
    d:
      en: |-
        Pre-creating every repository by hand in four account-Region pairs is a manual step that does not scale with teams creating repositories at any time.
references:
  - title: "Templates to control repositories created during a pull through cache, create on push, or replication action - Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/repository-creation-templates.html
  - title: "Private image replication in Amazon ECR - Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/replication.html
