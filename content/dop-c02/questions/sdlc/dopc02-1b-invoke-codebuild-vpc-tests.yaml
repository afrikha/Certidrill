id: dopc02-1b-invoke-codebuild-vpc-tests
objective: "1.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline has a test stage with an AWS CodeBuild test action that runs integration tests. The tests must query an Amazon RDS for PostgreSQL DB instance that runs in private subnets of the test VPC, and they also download packages from a public package index. The VPC has private subnets with a route to a NAT gateway and public subnets with a route to an internet gateway. The tests currently fail because they cannot connect to the database. Company policy forbids exposing the database to the internet.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the CodeBuild project with the VPC, the public subnets, and a security group, so that the builds can reach both the database and the internet.
    - id: b
      text:
        en: |-
          Make the DB instance publicly accessible and allow inbound traffic on port 5432 from the IP address ranges of CodeBuild in the Region.
    - id: c
      text:
        en: |-
          Configure the CodeBuild project with the VPC, the private subnets, and a security group that the database's security group allows on port 5432.
    - id: d
      text:
        en: |-
          Create an interface VPC endpoint for CodeBuild in the test VPC so that the builds run inside the VPC.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When a CodeBuild project is configured with a VPC, its builds run with network interfaces in the chosen subnets, so they can reach resources such as an RDS database in a private subnet. AWS recommends private subnets for builds; the NAT gateway provides the internet access that the builds need for public packages.
  options:
    a:
      en: |-
        CodeBuild does not assign Elastic IP addresses to its network interfaces, so builds in public subnets have no internet access; a NAT gateway is required.
    b:
      en: |-
        A publicly accessible database breaks the company policy.
    d:
      en: |-
        An interface endpoint lets clients in the VPC call the CodeBuild API privately; it does not place the builds in the VPC.
references:
  - title: Use AWS CodeBuild with Amazon Virtual Private Cloud - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/vpc-support.html
