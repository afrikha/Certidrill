id: dopc02-1b-stage-test-order
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is designing a new AWS CodePipeline pipeline for a web application. The pipeline has four stages: Build, Test (deploys to a test environment), Staging, and Production. The company wants to run unit tests, a static scan of the source code, integration tests, browser-based acceptance tests, and synthetic monitoring. Developers must get feedback as early as possible, and slower tests that need deployed resources must run only where those resources exist.

    Which placement of the tests will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Build: integration tests. Test: unit tests and static scan. Staging: synthetic monitoring. Production: browser-based acceptance tests.
    - id: b
      text:
        en: |-
          Build: browser-based acceptance tests. Test: integration tests. Staging: unit tests and static scan. Production: synthetic monitoring.
    - id: c
      text:
        en: |-
          Build: none. Test: unit tests, static scan, and integration tests. Staging: none. Production: browser-based acceptance tests and synthetic monitoring.
    - id: d
      text:
        en: |-
          Build: unit tests and static scan. Test: integration tests. Staging: browser-based acceptance tests. Production: synthetic monitoring.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Unit tests and static scans need no deployed resources and run in seconds or minutes, so they belong in the build stage for the fastest feedback. Integration tests need the deployed test environment, acceptance tests need a production-like staging environment, and synthetic monitoring keeps checking the live production application.
  options:
    a:
      en: |-
        Integration tests cannot run in the build stage before anything is deployed, and acceptance tests in production find defects only after customers see them.
    b:
      en: |-
        Browser-based acceptance tests need a deployed application, and running unit tests as late as staging delays the cheapest feedback.
    c:
      en: |-
        Running unit tests only after a deployment delays feedback, and running acceptance tests in production exposes customers to untested features.
references:
  - title: AWS CodeBuild build and test action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodeBuild.html
