id: dopc02-1b-sca-source-scan
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores the source code of a Node.js application in GitHub and builds it with an AWS CodePipeline V2 pipeline that uses an AWS CodeConnections source action. An audit found that a release shipped an open source npm package with a known critical vulnerability. The security team wants every pipeline run to scan the application's source code and third-party dependencies before the build stage. The run must stop when the scan reports any critical vulnerability. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an Amazon Inspector InspectorScan action in SourceCodeScan mode after the source stage, with CriticalThreshold set to 0.
    - id: b
      text:
        en: |-
          Associate the repository with Amazon CodeGuru Security and add a Lambda invoke action that fails the pipeline when CodeGuru Security reports a critical finding.
    - id: c
      text:
        en: |-
          Turn on Amazon ECR basic scanning with scan on push for the repository that stores the application image, and review the findings before each release.
    - id: d
      text:
        en: |-
          Enable Amazon Macie on the pipeline's artifact bucket and fail the pipeline when Macie reports a high-severity finding for the source artifact.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The CodePipeline InspectorScan action uses Amazon Inspector to scan source code from repositories such as GitHub, including open source dependencies, and fails the action when the number of findings at a severity exceeds the configured threshold. A CriticalThreshold of 0 stops the run as soon as one critical vulnerability is found, with no scanner to operate.
  options:
    b:
      en: |-
        Amazon CodeGuru Security was discontinued on November 20, 2025, so it cannot be used for new scans, and the Lambda function would be custom code to maintain.
    c:
      en: |-
        ECR scanning runs on a container image after it is built and pushed, not on the source before the build stage, and a manual review does not stop the run automatically.
    d:
      en: |-
        Macie discovers sensitive data such as personal information in S3 objects; it does not detect vulnerabilities in software dependencies.
references:
  - title: Amazon Inspector InspectorScan invoke action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-InspectorScan.html
