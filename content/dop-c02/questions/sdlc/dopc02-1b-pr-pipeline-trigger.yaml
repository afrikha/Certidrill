id: dopc02-1b-pr-pipeline-trigger
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an AWS CodePipeline V2 pipeline with a source action that connects to GitHub through AWS CodeConnections. The pipeline runs when commits are pushed to main and deploys to production. The company creates a second pipeline that deploys to an ephemeral test environment and runs integration tests. The second pipeline must run whenever a pull request that targets any release/ branch, such as release/2.4, is opened or receives new commits. The tests must use the code of the pull request's source branch.

    Which trigger configuration for the second pipeline will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          A push trigger on the source action with a branch filter that includes release/**, so that every change to a release branch is tested.
    - id: b
      text:
        en: |-
          No trigger, with BranchName set to release/** and DetectChanges set to true in the source action configuration.
    - id: c
      text:
        en: |-
          A pull request trigger with the Opened and Updated events and a branch filter that includes release/** on the source action.
    - id: d
      text:
        en: |-
          A pull request trigger with the Closed event and a branch filter that includes release/** on the source action.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A pull request trigger starts the pipeline when a pull request is opened, updated, or closed, filtered by the target branches, and the execution uses the commit on the pull request's source branch. Selecting only the Opened and Updated events tests each change before the merge.
  options:
    a:
      en: |-
        A push trigger runs only when commits land on a release branch, which is after the merge, and uses the destination branch commit.
    b:
      en: |-
        BranchName is not a branch pattern; with triggers it is only the default branch for manual starts, so pull requests would not start the pipeline.
    d:
      en: |-
        The Closed event fires when the pull request is merged or closed, too late for testing the change during review.
references:
  - title: Add trigger with code push or pull request event types - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-filter.html
