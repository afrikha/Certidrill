id: dopc02-1c-codeartifact-two-external
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS CodeArtifact for its internal npm and Python packages, which are published to a repository named team-repo. Developers and AWS CodeBuild projects must use team-repo as their only repository, and it must also serve public packages from npmjs.com and from PyPI. The platform team added an external connection to npmjs.com on team-repo. When the team tried to add a second external connection to PyPI on the same repository, the request failed.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a second domain that holds a repository with an external connection to PyPI, and add that repository as an upstream repository of team-repo in the first domain.
    - id: b
      text:
        en: |-
          Request a service quota increase for the number of external connections per repository, and then add the PyPI external connection to team-repo.
    - id: c
      text:
        en: |-
          Create one repository with an external connection to npmjs.com and another with an external connection to PyPI, and add both as upstream repositories of team-repo.
    - id: d
      text:
        en: |-
          Create an Amazon ECR pull through cache rule for PyPI, and configure pip in the builds to use the ECR registry in addition to team-repo.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A CodeArtifact repository can have only one external connection, but it can have up to 10 upstream repositories. Placing each external connection on its own repository and adding both as upstreams of team-repo lets clients reach internal and public npm and Python packages through team-repo alone.
  options:
    a:
      en: |-
        Upstream repositories must be in the same domain as the downstream repository, so a repository in another domain cannot be added.
    b:
      en: |-
        One external connection per repository is a fixed rule of the service, not an adjustable quota.
    d:
      en: |-
        ECR pull through cache rules support container registries only, and clients would no longer use team-repo as their only repository.
references:
  - title: "Working with upstream repositories in CodeArtifact - CodeArtifact"
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/repos-upstream.html
  - title: "Add or remove upstream repositories - CodeArtifact"
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/repo-upstream-add.html
