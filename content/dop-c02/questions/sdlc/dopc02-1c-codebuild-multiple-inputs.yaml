id: dopc02-1c-codebuild-multiple-inputs
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline has two source actions: one for the application repository and one for a repository of shared build scripts and configuration files. An AWS CodeBuild action must run the buildspec of the application repository and use files from the shared repository during the build. The company does not want to store Git credentials in the build or copy files between repositories.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store a Git access token in AWS Secrets Manager, and clone the shared repository in the install phase of the application buildspec.
    - id: b
      text:
        en: |-
          Add a CodeBuild action before the build that copies the shared files to an S3 bucket, and download them with the AWS CLI during the build.
    - id: c
      text:
        en: |-
          Give the CodeBuild action both source artifacts as inputs with PrimarySource set to the application artifact, and read the shared files from their own source directory.
    - id: d
      text:
        en: |-
          Merge the shared repository into the application repository as a subfolder, and remove the second source action from the pipeline.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A CodeBuild action accepts up to five input artifacts. PrimarySource selects the artifact whose buildspec runs and whose directory is `$CODEBUILD_SRC_DIR`; each other input artifact is extracted to its own directory exposed as `$CODEBUILD_SRC_DIR_<inputArtifactName>`. No credentials or file copies are needed.
  options:
    a:
      en: |-
        Cloning in the build requires storing and rotating Git credentials, which the company wants to avoid.
    b:
      en: |-
        An extra action and bucket copy the files between locations, which adds steps that the multiple-input feature makes unnecessary.
    d:
      en: |-
        Merging the repositories copies the shared files into each application repository, which the company does not want.
references:
  - title: "AWS CodeBuild build and test action reference - AWS CodePipeline"
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodeBuild.html
