id: dopc02-1b-integration-real-dynamodb
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an order service on AWS Lambda that reads and writes an Amazon DynamoDB table. The CI/CD pipeline in AWS CodePipeline runs unit tests in AWS CodeBuild, and every DynamoDB call in those tests is replaced by a mock. Unit test line coverage is 92%. Twice in the last month, releases failed in production: once because the function's IAM role lacked dynamodb:UpdateItem, and once because the code used an attribute name that did not match the table's partition key. The company wants the pipeline to catch this kind of defect before production.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Raise the minimum line coverage of the unit tests to 98%, and add unit tests for the data access layer that use the existing DynamoDB mocks for every table operation.
    - id: b
      text:
        en: |-
          Add an InspectorScan action in SourceCodeScan mode before the build action, and fail the pipeline when the scan reports any critical or high finding in the function code.
    - id: c
      text:
        en: |-
          After deployment to a test account, add a CodeBuild test action that runs integration tests against the real function and DynamoDB table with the function's own IAM role.
    - id: d
      text:
        en: |-
          Run a Distributed Load Testing on AWS test against the production API after each release, and roll back the release when the error rate of the API rises.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Missing IAM permissions and a mismatched key schema only appear when the code talks to the real service with the real role, which is what an integration test does. Running these tests after deploying to a test account catches both defects before the release reaches production.
  options:
    a:
      en: |-
        More unit tests with mocks still never call DynamoDB or evaluate the IAM role, so both failures would pass again; coverage measures executed lines, not correct integration.
    b:
      en: |-
        A source code scan looks for vulnerabilities in code and dependencies; it does not check IAM permissions at run time or the table's key schema.
    d:
      en: |-
        Testing in production after the release finds the defect only once customers are affected, and a load test targets capacity, not functional correctness.
references:
  - title: AWS CodeBuild build and test action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodeBuild.html
