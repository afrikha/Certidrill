id: dopc02-1c-ecr-lifecycle-priority
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores the container images of a payment service in an Amazon ECR repository. The company must always keep the 15 most recent images whose tags start with `prod`, regardless of their age. Untagged images must be removed 1 day after they are pushed. Every other image must be removed when it is more than 30 days old. The company wants ECR to enforce these rules without custom code.

    Which lifecycle policy will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Priority 1: tagged images matching `prod*`, expire when the count is more than 15. Priority 2: untagged images, expire 1 day after push. Priority 3: tag status `any`, expire 30 days after push.
    - id: b
      text:
        en: |-
          Priority 1: tag status `any`, expire 30 days after push. Priority 2: tagged images matching `prod*`, expire when the count is more than 15. Priority 3: untagged images, expire 1 day after push.
    - id: c
      text:
        en: |-
          Priority 1: tagged images matching `prod*`, expire 30 days after push. Priority 2: untagged images, expire 1 day after push. Priority 3: tag status `any`, expire when the count is more than 15.
    - id: d
      text:
        en: |-
          Priority 1: untagged images, expire 1 day after push. Priority 2: tagged images matching `prod*`, expire when the count is more than 15. Tag immutability turned on for the repository.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An image that matches the tagging requirements of a rule cannot be expired by a lower-priority rule, so the 15 newest `prod` images, matched by rule 1, are protected from the 30-day `any` rule. Older `prod` images beyond the 15 are expired by rule 1, untagged images by rule 2, and every other image by rule 3. A rule with tag status `any` must have the highest `rulePriority` value, which this policy respects.
  options:
    b:
      en: |-
        A rule with tag status `any` must have the highest priority value and be evaluated last; placed first, it would also expire recent `prod` images older than 30 days.
    c:
      en: |-
        Rule 1 removes `prod` images by age instead of keeping the 15 newest, and the `any` rule removes other images by count instead of by age.
    d:
      en: |-
        No rule removes other tagged images after 30 days, and tag immutability does not delete anything.
references:
  - title: "Automate the cleanup of images by using lifecycle policies in Amazon ECR - Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/LifecyclePolicies.html
  - title: "Lifecycle policy properties in Amazon ECR - Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/lifecycle_policy_parameters.html
