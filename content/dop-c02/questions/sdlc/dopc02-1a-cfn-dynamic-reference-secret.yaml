id: dopc02-1a-cfn-dynamic-reference-secret
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys an AWS CloudFormation template to dev, test, and prod accounts from an AWS CodePipeline pipeline. The template creates an Amazon ElastiCache replication group whose AuthToken property is passed today as a NoEcho parameter, and the value is stored in a template configuration file in the Git repository. In each account, the security team has already created an AWS Secrets Manager secret named cache/auth with a JSON key named token. The token must no longer appear in the repository, the pipeline definition, or the template. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the NoEcho parameter, and move the token from the template configuration file to the ParameterOverrides of the CloudFormation action in the pipeline.
    - id: b
      text:
        en: |-
          Set the AuthToken property to the dynamic reference {{resolve:secretsmanager:cache/auth:SecretString:token}}, and remove the parameter.
    - id: c
      text:
        en: |-
          Copy the token to a SecureString parameter in Parameter Store, and set the AuthToken property to a {{resolve:ssm:...}} dynamic reference to it.
    - id: d
      text:
        en: |-
          Write a Lambda-backed custom resource that reads the secret, and pass the value to the AuthToken property with Fn::GetAtt.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A secretsmanager dynamic reference makes CloudFormation retrieve the secret value during stack operations, so the template and the pipeline contain only the reference; neither Secrets Manager nor CloudFormation logs should persist the resolved value. Because the secret has the same name in each account, one template works for every environment.
  options:
    a:
      en: |-
        ParameterOverrides are part of the pipeline definition, so the token would still be stored in the pipeline.
    c:
      en: |-
        The ssm dynamic reference supports only String and StringList parameters, not SecureString, and copying the secret creates a second copy to keep in sync.
    d:
      en: |-
        A custom resource is a Lambda function to write and maintain, while a dynamic reference already retrieves the secret natively during the stack operation.
references:
  - title: Get a secret or secret value from Secrets Manager - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-secretsmanager.html
  - title: Get a plaintext value from Systems Manager Parameter Store - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-ssm.html
