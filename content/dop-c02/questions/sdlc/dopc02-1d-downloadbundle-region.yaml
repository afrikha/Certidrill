id: dopc02-1d-downloadbundle-region
objective: "1.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company expands an application from us-east-1 to eu-west-1. It creates an AWS CodeDeploy application and deployment group in eu-west-1 for the new Amazon EC2 instances. The deployment in eu-west-1 references the same revision .zip file that the us-east-1 deployments use, in an S3 bucket in us-east-1 that uses SSE-S3 encryption. The instance profile of the new instances allows s3:Get* and s3:List* on that bucket. The deployment fails in the DownloadBundle event with the error UnknownError: not opened for reading.

    Which solution will resolve the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Add kms:Decrypt for the bucket's encryption key to the instance profile, and redeploy the revision.
    - id: b
      text:
        en: |-
          Store a copy of the revision in an S3 bucket in eu-west-1, and reference that bucket in the eu-west-1 deployment.
    - id: c
      text:
        en: |-
          Add a bucket policy that allows the codedeploy.amazonaws.com service principal to read the revision object.
    - id: d
      text:
        en: |-
          Enable S3 Transfer Acceleration on the bucket so that the instances in eu-west-1 can download the revision.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For EC2 deployments, the revision bucket must be in the same Region as the target instances. An instance in another Region than the bucket is a documented cause of the DownloadBundle error "UnknownError: not opened for reading"; each Region needs its own bucket and copy of the revision.
  options:
    a:
      en: |-
        The bucket uses SSE-S3, so no customer KMS key permission is involved, and the instance profile already allows reading the object.
    c:
      en: |-
        The CodeDeploy agent downloads the revision with the instance profile's credentials, not with the CodeDeploy service principal.
    d:
      en: |-
        Transfer Acceleration speeds up long-distance transfers but does not remove the requirement that the revision bucket be in the instances' Region.
references:
  - title: Troubleshoot EC2/On-Premises deployment issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-deployments.html
  - title: Push a revision for CodeDeploy to Amazon S3 (EC2/On-Premises deployments only) - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/application-revisions-push.html
