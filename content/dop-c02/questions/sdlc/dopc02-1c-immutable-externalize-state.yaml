id: dopc02-1c-immutable-externalize-state
objective: "1.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is moving an application on Amazon EC2 instances in an Auto Scaling group from in-place updates to immutable deployments that replace every instance. Each instance currently stores three kinds of data on its EBS volume: documents uploaded by users, which the developers can store elsewhere with a small code change; application log files, which operators read during incident reviews; and generated report files, which every instance must read and write through a shared file system path. No data may be lost when instances are replaced.

    Which combination of actions will meet these requirements? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Change the application to store the uploaded documents in an Amazon S3 bucket.
    - id: b
      text:
        en: |-
          Set DeleteOnTermination to false on the EBS volumes, so that the data volumes survive when instances are replaced.
    - id: c
      text:
        en: |-
          Send the application logs to Amazon CloudWatch Logs with the CloudWatch agent.
    - id: d
      text:
        en: |-
          Take hourly EBS snapshots of every instance with an Amazon Data Lifecycle Manager policy.
    - id: e
      text:
        en: |-
          Store the report files on instance store volumes, so that they get faster local I/O.
    - id: f
      text:
        en: |-
          Store the report files on an Amazon EFS file system that every instance mounts.
answer: { optionIds: [ a, c, f ] }
explanation:
  correct:
    en: |-
      Immutable deployments discard instances, so state must live outside them. Amazon S3 durably stores the uploaded documents once the code writes them there, the CloudWatch agent ships the log files to CloudWatch Logs before the instances go away, and Amazon EFS gives every instance the same shared file system path for the reports.
  options:
    b:
      en: |-
        Detached volumes survive, but new instances do not use them, and the data is scattered over orphaned volumes.
    d:
      en: |-
        Hourly snapshots lose up to an hour of data and are not attached to the replacement instances.
    e:
      en: |-
        Instance store data is lost when an instance stops or is replaced, and it is not shared.
references:
  - title: "How Amazon EFS works - Amazon Elastic File System"
    url: https://docs.aws.amazon.com/efs/latest/ug/how-it-works.html
  - title: "Collect metrics, logs, and traces using the CloudWatch agent - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Install-CloudWatch-Agent.html
