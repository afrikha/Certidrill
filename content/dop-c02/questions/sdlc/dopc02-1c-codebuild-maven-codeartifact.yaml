id: dopc02-1c-codebuild-maven-codeartifact
objective: "1.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's Java builds in AWS CodeBuild download every Maven dependency from Maven Central at each build. The security team now requires that builds get dependencies only from an AWS CodeArtifact repository that has an external connection to Maven Central. The builds must not use long-lived credentials. The company also wants to reduce the time that each build spends downloading dependencies that did not change.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          In the pre_build phase, export a token from `aws codeartifact get-authorization-token`, and use it in a settings.xml mirror that points to the repository.
    - id: b
      text:
        en: |-
          In the pre_build phase, run `aws codeartifact login --tool maven` so that the AWS CLI writes the repository endpoint and the token into the Maven settings file.
    - id: c
      text:
        en: |-
          Create a CodeArtifact authorization token with a duration of 12 hours once a day, and store it as a plaintext environment variable in the build project.
    - id: d
      text:
        en: |-
          Add the local Maven repository folder, /root/.m2, to the cache paths of the buildspec, and turn on a cache for the build project.
    - id: e
      text:
        en: |-
          Turn on the local cache with source cache mode for the build project, so that previously downloaded Maven dependencies are reused.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Maven is not one of the tools that `aws codeartifact login` configures, so the build gets a short-lived token with get-authorization-token, using the project's service role, and passes it to Maven through settings.xml and an environment variable. Caching the local Maven repository with a custom local cache or an S3 cache avoids downloading unchanged dependencies at every build.
  options:
    b:
      en: |-
        `aws codeartifact login` supports dotnet, npm, nuget, pip, swift, and twine only; there is no maven tool value.
    c:
      en: |-
        A token stored in the project configuration is a long-lived plaintext credential, which the security team forbids.
    e:
      en: |-
        Source cache mode caches Git metadata of the source, not the local Maven repository.
references:
  - title: "AWS CodeArtifact authentication and tokens - CodeArtifact"
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/tokens-authentication.html
  - title: "Build specification reference for CodeBuild - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
