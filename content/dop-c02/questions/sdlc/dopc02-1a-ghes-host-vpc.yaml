id: dopc02-1a-ghes-host-vpc
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs GitHub Enterprise Server on Amazon EC2 instances in private subnets of a VPC in us-east-1. The server is not reachable from the internet, and its TLS certificate is issued by the company's private certificate authority. The DevOps team wants an AWS CodePipeline pipeline in the same account and Region to start automatically when commits are pushed to a repository on this server. The team wants to use a managed source integration instead of building its own synchronization.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create a connection with the GitHub provider type, install the AWS Connector for GitHub app in the server's organization, and use the connection in the source action.
    - id: b
      text:
        en: |-
          Run an AWS CodeBuild project in the VPC every 5 minutes that clones the repository and uploads a ZIP file to a versioned bucket that an Amazon S3 source action watches.
    - id: c
      text:
        en: |-
          Create a GitHub Enterprise Server host with the VPC, subnets, security groups, and TLS certificate, set up the host, then create a connection on it for the source action.
    - id: d
      text:
        en: |-
          Expose the server through an internet-facing Application Load Balancer, and create a connection with the GitHub provider type that uses the load balancer's DNS name.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Installed providers such as GitHub Enterprise Server use a host resource that represents the infrastructure where the provider runs. When the server is reachable only inside a VPC, the host is created with the VPC ID, subnets, security groups, and, for a non-public certificate authority, the TLS certificate. After the host is set up and Available, a connection on the host feeds the CodeStarSourceConnection source action.
  options:
    a:
      en: |-
        The GitHub provider type connects to github.com; a server installed in a private VPC needs a GitHub Enterprise Server host.
    b:
      en: |-
        A scheduled clone-and-upload job is custom synchronization with polling delays, which the team wants to avoid.
    d:
      en: |-
        Exposing the server to the internet changes the company's security posture, and the GitHub provider type still does not target a self-hosted server.
references:
  - title: Create a host - Developer Tools console
    url: https://docs.aws.amazon.com/dtconsole/latest/userguide/connections-host-create.html
