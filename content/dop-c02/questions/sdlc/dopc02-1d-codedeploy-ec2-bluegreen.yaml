id: dopc02-1d-codedeploy-ec2-bluegreen
objective: "1.4.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an application on 30 Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. AWS CodeDeploy in-place deployments with CodeDeployDefault.OneAtATime take two hours and reduce capacity while they run. The company has new requirements: a full-capacity fleet with the new revision must be ready before production traffic moves to it, and the previous instances must stay available for one hour after the traffic moves, for fast rollback, and must then be removed automatically to control costs. Releases must need no manual steps.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use a blue/green deployment group that automatically copies the Auto Scaling group, reroutes traffic immediately, and terminates the original instances 60 minutes after the traffic is rerouted.
    - id: b
      text:
        en: |-
          Use a blue/green deployment group that automatically copies the Auto Scaling group, reroutes traffic immediately, and keeps the original instances running after the traffic is rerouted.
    - id: c
      text:
        en: |-
          Use a blue/green deployment group that automatically copies the Auto Scaling group, waits for a manual choice to reroute traffic, and terminates the original instances after 60 minutes.
    - id: d
      text:
        en: |-
          Keep the in-place deployment group, change the deployment configuration to CodeDeployDefault.HalfAtATime, and enable automatic rollback when the deployment fails.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An EC2 blue/green deployment can copy the Auto Scaling group to provision a replacement fleet with as many instances as are healthy in the original group, install the revision, and then register it with the load balancer. Choosing to terminate the original instances after a wait period keeps them for fast rollback during that period and then removes them automatically.
  options:
    b:
      en: |-
        Keeping the original instances running leaves them in place after the hour, so someone must remove them manually and they keep generating costs.
    c:
      en: |-
        Waiting for a manual choice to reroute traffic adds a manual step to every release, which the company does not want.
    d:
      en: |-
        An in-place deployment updates the existing instances, so capacity is still reduced during the deployment and no previous fleet remains for fast rollback.
references:
  - title: Create a deployment group for an EC2/On-Premises blue/green deployment (console) - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-groups-create-blue-green.html
  - title: Integrating CodeDeploy with Elastic Load Balancing - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/integrations-aws-elastic-load-balancing.html
