id: dopc02-1c-imagebuilder-ssm-parent
objective: "1.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's EC2 Image Builder image recipe uses a fixed AMI ID as its parent image. Engineers update the recipe by hand when AWS publishes a new Amazon Linux 2023 AMI. The company wants each build to start from the latest Amazon Linux 2023 AMI that AWS publishes, without manual recipe updates and without custom code. The pipeline must check every day and build a new image only when the parent image has changed since the last build.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an AWS Lambda function that runs every day, looks up the latest Amazon Linux 2023 AMI ID, and creates a new recipe version with that ID.
    - id: b
      text:
        en: |-
          Set the parent image of the image recipe to the public AWS Systems Manager parameter that holds the latest Amazon Linux 2023 AMI ID.
    - id: c
      text:
        en: |-
          Set the pipeline schedule to a daily expression with the EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE start condition.
    - id: d
      text:
        en: |-
          Set the pipeline schedule to a daily expression with the EXPRESSION_MATCH_ONLY start condition.
    - id: e
      text:
        en: |-
          Convert the image recipe to a container recipe that uses the Amazon Linux 2023 image from Amazon ECR Public as its base image.
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      An image recipe can take its parent image from a Systems Manager Parameter Store parameter, such as the public parameter that AWS updates with each new Amazon Linux 2023 AMI. With the EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE start condition, the pipeline evaluates its schedule daily and builds only when a dependency changed, and a change in the parameter value counts as a dependency update.
  options:
    a:
      en: |-
        A daily Lambda function that rewrites the recipe is custom code, which the company wants to avoid.
    d:
      en: |-
        EXPRESSION_MATCH_ONLY builds a new image every time the expression matches, even when the parent image has not changed.
    e:
      en: |-
        A container recipe produces container images, not AMIs.
references:
  - title: "Manage recipes in Image Builder - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-recipes.html
  - title: "Schedule - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/APIReference/API_Schedule.html
