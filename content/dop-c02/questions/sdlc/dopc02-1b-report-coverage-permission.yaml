id: dopc02-1b-report-coverage-permission
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CodeBuild project named billing has published JUnit test reports for months. Its service role has a policy that allows codebuild:CreateReportGroup, codebuild:CreateReport, codebuild:UpdateReport, and codebuild:BatchPutTestCases on arn:aws:codebuild:eu-west-1:111122223333:report-group/billing-*. A developer adds a second entry named coverage to the reports section, with file-format COBERTURAXML. The tests still run and the test report is still created, but the coverage report fails with an access denied error.

    Which change will fix the problem while following the principle of least privilege?
body:
  options:
    - id: a
      text:
        en: |-
          Add codebuild:BatchGetReports to the policy statement for the billing-* report groups.
    - id: b
      text:
        en: |-
          Add s3:PutObject on the project's artifact bucket to the service role policy.
    - id: c
      text:
        en: |-
          Add codebuild:BatchPutCodeCoverages to the policy statement for the billing-* report groups.
    - id: d
      text:
        en: |-
          Replace the resource of the policy statement with * so that the role can write to any report group.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Test reports need CreateReportGroup, CreateReport, UpdateReport, and BatchPutTestCases, and code coverage reports also need codebuild:BatchPutCodeCoverages. The new group is named billing-coverage, so it already matches the billing-* resource; only the missing action must be added.
  options:
    a:
      en: |-
        BatchGetReports reads existing reports; it does not allow the build to upload coverage data.
    b:
      en: |-
        Coverage data is uploaded to the report, not to the artifact bucket, and the test report already works without this permission.
    d:
      en: |-
        A wildcard resource grants more than needed and still lacks the BatchPutCodeCoverages action.
references:
  - title: Test report permissions - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/test-permissions.html
