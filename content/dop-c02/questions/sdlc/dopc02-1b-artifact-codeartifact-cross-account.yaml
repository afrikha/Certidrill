id: dopc02-1b-artifact-codeartifact-cross-account
objective: "1.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company keeps an AWS CodeArtifact domain and a shared-libs repository in a shared services account (111122223333). AWS CodeBuild projects in a workload account (444455556666) must download packages from shared-libs and must not be able to publish to it. The service role of the projects has an identity-based policy that allows codeartifact:GetAuthorizationToken on the domain, codeartifact:GetRepositoryEndpoint and codeartifact:ReadFromRepository on the repository, and sts:GetServiceBearerToken. The builds still fail with access denied errors.

    Which combination of actions in the shared services account will fix the problem with the LEAST privilege? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a domain policy that allows the workload account's service role to call codeartifact:GetAuthorizationToken.
    - id: b
      text:
        en: |-
          Add a repository policy that allows the workload account's service role codeartifact:ReadFromRepository and codeartifact:GetRepositoryEndpoint on shared-libs.
    - id: c
      text:
        en: |-
          Add a repository policy that allows the workload account's service role codeartifact:PublishPackageVersion on every package in shared-libs.
    - id: d
      text:
        en: |-
          Add sts:GetServiceBearerToken for the workload account's service role to the domain policy.
    - id: e
      text:
        en: |-
          Add an external connection from shared-libs to the workload account so that its builds can reach the repository.
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      Cross-account access needs an allow in both an identity-based policy and a resource policy. The repository policy grants the read actions, and a domain policy must grant at least codeartifact:GetAuthorizationToken, or the package manager cannot authenticate to download packages.
  options:
    c:
      en: |-
        Publishing is not needed and is explicitly forbidden, so granting it breaks least privilege.
    d:
      en: |-
        sts:GetServiceBearerToken has no effect in a domain policy; it must be granted in the role's identity-based policy, where it already is.
    e:
      en: |-
        External connections link a repository to public package repositories, not to other AWS accounts.
references:
  - title: Repository policies - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/repo-policies.html
  - title: AWS CodeArtifact authentication and tokens - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/tokens-authentication.html
