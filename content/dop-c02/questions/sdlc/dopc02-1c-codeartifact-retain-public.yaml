id: dopc02-1c-codeartifact-retain-public
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's AWS CodeBuild projects download open source npm packages directly from the public npm registry. Last month, a maintainer removed a package version that the company's builds depended on, and the builds failed for a day. The company wants its builds to keep working with package versions that they have already consumed, even if those versions are later removed from the public registry.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an Amazon S3 cache for the CodeBuild projects, and add the node_modules folder of each project to the cache paths in the buildspec.
    - id: b
      text:
        en: |-
          Create an Amazon ECR pull through cache rule for the public npm registry, and configure npm in the builds to use the ECR private registry.
    - id: c
      text:
        en: |-
          Turn on the local custom cache mode for the CodeBuild projects, and add the npm cache folder of each project to the cache paths in the buildspec.
    - id: d
      text:
        en: |-
          Create an AWS CodeArtifact repository with an external connection to the public npm registry, and configure the builds to install packages from it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When a client requests a package through a CodeArtifact repository with an external connection, CodeArtifact fetches it from the public registry and retains the package version in the repository. A retained version stays available from CodeArtifact even if it later changes or disappears upstream, so builds keep working.
  options:
    a:
      en: |-
        A build cache is an optimization, not a durable store: a cache miss or an invalidated cache sends npm back to the public registry.
    b:
      en: |-
        ECR pull through cache rules support container registries only; they cannot proxy the npm registry.
    c:
      en: |-
        A local cache is kept only on the build host that created it and is not guaranteed for the next build.
references:
  - title: "Requesting a package version with upstream repositories - CodeArtifact"
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/repo-upstream-behavior.html
  - title: "Working with upstream repositories in CodeArtifact - CodeArtifact"
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/repos-upstream.html
