id: dopc02-1b-fanout-e2e-shards
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs 2,400 independent browser-based end-to-end tests in a single AWS CodeBuild build as part of its AWS CodePipeline pipeline. The suite now takes 3 hours and 40 minutes, which delays every release. The company wants the suite to finish in less than 30 minutes. The release manager also wants one consolidated test report for each pipeline run instead of separate reports to merge by hand. The company wants to make the fewest changes to the tests.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure a batch build with a build matrix that defines eight values of a SHARD environment variable, so that eight builds run the suite in parallel.
    - id: b
      text:
        en: |-
          Configure a batch build with a build fanout and a parallelism of 8, and run the tests with the codebuild-tests-run command so that CodeBuild splits them.
    - id: c
      text:
        en: |-
          Replace the CodeBuild action with eight Commands actions that share the same runOrder value, and give each action the commands to run one eighth of the test files.
    - id: d
      text:
        en: |-
          Configure a batch build with a build graph of eight builds, each with a depend-on entry for the previous build and one eighth of the tests.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A build fanout splits one test task into several parallel builds based on the parallelism value, and the codebuild-tests-run command distributes the tests across the environments automatically. CodeBuild then merges the reports of the individual builds into a single test report at the batch level.
  options:
    a:
      en: |-
        A build matrix runs one build for each combination of buildspecs and variable values, and each of those builds runs the whole suite unless the tests are rewritten to split themselves.
    c:
      en: |-
        Commands actions require the company to split the tests by hand, and they produce no consolidated CodeBuild test report.
    d:
      en: |-
        depend-on makes each build wait for the previous one, so the eight builds run one after the other and the suite is not faster.
references:
  - title: Execute parallel tests in batch builds - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/parallel-test.html
  - title: Run builds in batches - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/batch-build.html
