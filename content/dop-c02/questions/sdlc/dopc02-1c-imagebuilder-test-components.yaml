id: dopc02-1c-imagebuilder-test-components
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an EC2 Image Builder pipeline to produce a golden AMI with a web server and monitoring agents. Last month, an AMI in which the web server did not start was distributed to the workload accounts, and several Auto Scaling groups launched broken instances. The company wants every new AMI to be validated automatically by launching it and checking that the web server responds. An AMI that fails the checks must not be distributed.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Add a test component that checks the web server to the image recipe, so that Image Builder runs it on an instance launched from the new AMI.
    - id: b
      text:
        en: |-
          Add the web server checks to the user data of the pipeline's infrastructure configuration, so that the build instance runs them when it starts.
    - id: c
      text:
        en: |-
          Add an AWS CodeDeploy deployment to a test Auto Scaling group after distribution, and deregister the AMI in every account if the deployment fails.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule on the image completion event that invokes an AWS Lambda function to launch an instance from the AMI and run the checks.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Test components run in the test stage, after the snapshot is taken: for an AMI, Image Builder launches a new instance from the new image and runs the component's `test` phase on it. The image is created and distributed only after the test stage completes successfully, so a broken AMI never reaches the workload accounts.
  options:
    b:
      en: |-
        User data runs on the build instance before the image is taken; it does not test an instance launched from the final AMI and does not stop distribution.
    c:
      en: |-
        The checks run after the AMI is already distributed, and the cleanup across accounts adds custom work.
    d:
      en: |-
        The completion event arrives after distribution, so a broken AMI is already in the workload accounts, and the Lambda function is custom code.
references:
  - title: "Use components to customize your Image Builder image - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-components.html
