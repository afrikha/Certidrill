id: dopc02-1b-synthetics-har-benchmark
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A publishing company deploys its news website to a staging environment through AWS CodePipeline before each release. Readers have complained that the home page became slower after some releases, but nobody can say which page element caused the slowdown. The company wants each staging deployment to record the load time of every resource that the home page requests, so that results can be compared between releases. No real users access the staging environment. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an Amazon CloudWatch RUM app monitor to the staging website and compare the page load times and resource timings that it reports for each release.
    - id: b
      text:
        en: |-
          Run a Distributed Load Testing on AWS test with 1,000 simulated users against the home page after each staging deployment.
    - id: c
      text:
        en: |-
          Run an Amazon CloudWatch Synthetics canary from the heartbeat monitoring blueprint once after each staging deployment and keep the HAR file of each run.
    - id: d
      text:
        en: |-
          Instrument the backend with the AWS X-Ray SDK and compare the trace durations of the home page requests for each release.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The heartbeat monitoring blueprint loads a URL and stores a screenshot and an HTTP archive (HAR) file, which gives the load time of each item on the page. A canary can run once, so the pipeline can produce one comparable HAR file per release without real users.
  options:
    a:
      en: |-
        RUM collects data from actual user sessions, and nobody uses the staging environment.
    b:
      en: |-
        A load test measures the server's behavior under concurrent traffic; it does not record the load time of each resource in the browser.
    d:
      en: |-
        Backend traces do not show browser-side resource loading, and the X-Ray SDKs are in maintenance mode; AWS recommends OpenTelemetry for new instrumentation.
references:
  - title: Using canary blueprints - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries_Blueprints.html
  - title: CloudWatch RUM - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM.html
