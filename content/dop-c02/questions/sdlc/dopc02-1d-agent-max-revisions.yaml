id: dopc02-1d-agent-max-revisions
objective: "1.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys a 900 MB application revision with AWS CodeDeploy several times each day to Amazon EC2 Linux instances that have small root volumes. After a few weeks, the root volumes fill up, the CodeDeploy agent stops, and deployments fail with HEALTH_CONSTRAINTS errors. Most of the used space is in /opt/codedeploy-agent/deployment-root, which holds many earlier revisions. The company does not want to resize the volumes, and deployments must keep working normally, including the ApplicationStop hook of the previous revision.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Set :root_dir: in the agent configuration file to /tmp so that the stored revisions are removed every time the instances reboot.
    - id: b
      text:
        en: |-
          Set :max_revisions: in the agent configuration file to a lower value, such as 2, and restart the CodeDeploy agent on the instances.
    - id: c
      text:
        en: |-
          Add an AfterInstall hook script to the revision that deletes every directory under /opt/codedeploy-agent/deployment-root.
    - id: d
      text:
        en: |-
          Set :enable_archive_reuse: to false in the agent configuration file so that the agent downloads a fresh bundle for each deployment.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      By default the agent keeps the five most recent revisions plus the currently deployed one under its root directory. :max_revisions: sets how many archived revisions are kept, and the agent deletes older ones, which frees space while keeping the previous revision that ApplicationStop uses.
  options:
    a:
      en: |-
        The root directory also stores the deployment history and the instructions files that CodeDeploy uses for later deployments; losing it at each reboot breaks ApplicationStop and file cleanup, and nothing limits its size between reboots.
    c:
      en: |-
        Deleting the agent's working directories during a deployment removes the current and previous revisions and the deployment instructions, which breaks this and later deployments.
    d:
      en: |-
        Disabling archive reuse only forces a new download on RESTART deployments; it does not limit how many revisions are kept on disk.
references:
  - title: CodeDeploy agent configuration reference - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-agent-configuration.html
  - title: Troubleshoot EC2/On-Premises deployment issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-deployments.html
