id: dopc02-1a-cross-account-kms-artifacts
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an AWS CodePipeline pipeline in a tooling account (111122223333) in us-east-1. A new stage deploys the application with AWS CodeDeploy to Amazon EC2 instances in a production account (444455556666). The DevOps engineer created a cross-account role in the production account, allowed the pipeline service role to assume it, and set the role as the roleArn of the deploy action. The artifact bucket policy allows the production account to read the artifacts. The pipeline's artifact store uses the default AWS managed key for Amazon S3 (aws/s3). The deployment fails because the production account cannot decrypt the artifacts.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a customer managed KMS key in us-east-1 in the tooling account, allow the pipeline service role and the production account in its key policy, and set it as the artifact store key by ARN.
    - id: b
      text:
        en: |-
          Add a statement to the key policy of the aws/s3 AWS managed key that allows the production account to use kms:Decrypt, and keep the artifact store configuration unchanged.
    - id: c
      text:
        en: |-
          Create a customer managed KMS key in the production account, allow the tooling account in its key policy, and set it as the artifact store key by using its alias.
    - id: d
      text:
        en: |-
          Configure S3 replication from the artifact bucket to a bucket in the production account, and point the CodeDeploy deployment group at the replica bucket.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Cross-account actions need the artifact store to use a customer managed key in the pipeline's Region, with a key policy that lets the pipeline service role and the target account use it. The key is set in the pipeline's artifact store by key ID or ARN, because aliases are recognized only in the account that created the key.
  options:
    b:
      en: |-
        The key policy of an AWS managed key cannot be edited, so the production account cannot be granted use of the aws/s3 key.
    c:
      en: |-
        Aliases are recognized only in the account that owns the key, so a cross-account key must be referenced by key ID or ARN; the documented setup also places the key with the pipeline.
    d:
      en: |-
        The CodeDeploy action receives its input artifact from the pipeline's artifact store, not from a deployment group setting, and replicated objects would still need a usable key.
references:
  - title: Create a pipeline in CodePipeline that uses resources from another AWS account - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-create-cross-account.html
