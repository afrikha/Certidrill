id: dopc02-1c-asg-shared-files-efs
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a content management application on Amazon EC2 instances in an Auto Scaling group across three Availability Zones. The application writes user-uploaded files to a directory on each instance's EBS volume. The company has started immutable deployments that replace every instance, and uploaded files are lost or visible on only one instance. The application must keep using a standard file system path, and the company cannot change the application code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an io2 EBS volume with Multi-Attach enabled, and attach it to every instance in the Auto Scaling group from the launch template.
    - id: b
      text:
        en: |-
          Create an Amazon EFS file system with a mount target in each Availability Zone, and mount it on the upload directory from the launch template's user data.
    - id: c
      text:
        en: |-
          Create an Amazon Data Lifecycle Manager policy that snapshots the EBS volumes hourly, and restore the latest snapshot on each new instance.
    - id: d
      text:
        en: |-
          Change the launch template to an instance type with instance store volumes, and write the uploaded files to the instance store volume.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon EFS is a Regional file system that instances in several Availability Zones mount concurrently over NFSv4, through a mount target in each Availability Zone. Mounting it on the upload directory gives every instance, old or new, the same files without changing the code.
  options:
    a:
      en: |-
        EBS Multi-Attach works only within one Availability Zone and needs a cluster-aware file system, so it cannot serve instances in three Availability Zones.
    c:
      en: |-
        Snapshots give each new instance its own copy from the past hour; files are still lost between snapshots and are not shared between instances.
    d:
      en: |-
        Instance store data is lost when the instance is replaced and is never shared between instances.
references:
  - title: "How Amazon EFS works - Amazon Elastic File System"
    url: https://docs.aws.amazon.com/efs/latest/ug/how-it-works.html
