id: dopc02-1a-pipeline-as-code-self-mutate
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team manages 25 AWS CodePipeline pipelines that engineers created and still edit by hand in the console. The pipelines of similar services have drifted apart, and nobody can tell who changed a stage or why. The team members are experienced TypeScript developers. The team wants the pipeline definitions to follow the same lifecycle as application code: stored in Git, reviewed through pull requests, and applied automatically when a change is merged, including changes that add new deployment stages. After the first deployment, no engineer should have to deploy pipeline changes manually.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Export the JSON definition of each pipeline every night with the get-pipeline command, and commit the files to a Git repository so that every change is versioned.
    - id: b
      text:
        en: |-
          Create an AWS Config custom rule that detects changes to the pipelines and notifies the platform team through Amazon SNS so that changes can be reviewed.
    - id: c
      text:
        en: |-
          Define the pipelines in AWS CloudFormation templates stored in Git, and have an engineer run aws cloudformation deploy after each merged pull request.
    - id: d
      text:
        en: |-
          Define the pipelines with CDK Pipelines in a TypeScript AWS CDK app stored in Git, deploy the app once, and let each pipeline update itself when changes are merged.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CDK Pipelines are self-updating: after the pipeline is deployed manually once, it updates its own definition from the repository, and new stages or stacks added in code are configured automatically. The definitions live in Git and go through pull requests like application code.
  options:
    a:
      en: |-
        Nightly exports record changes after the fact; engineers still edit the pipelines in the console, and nothing applies reviewed changes automatically.
    b:
      en: |-
        Detecting changes does not prevent console edits and does not apply reviewed definitions; it only adds notifications.
    c:
      en: |-
        The definitions are versioned, but every merged change still needs an engineer to deploy it manually, which the team wants to avoid.
references:
  - title: Continuous integration and delivery (CI/CD) using CDK Pipelines - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/cdk-pipeline.html
