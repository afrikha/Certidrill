id: dopc02-1b-pr-base-ref-file-path
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company keeps the code of 12 microservices in one GitHub repository (github.com). Each service lives in its own folder, such as services/payments/. The payments team owns an AWS CodeBuild project that runs the payments test suite and is triggered by a webhook. Developers work in feature branches and open pull requests into main or into long-lived release branches. The payments team wants its project to build only for pull requests that are opened or updated with main as the target branch and that change at least one file under services/payments/.

    Which webhook filter configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          One filter group: EVENT is PULL_REQUEST_CREATED, PULL_REQUEST_UPDATED; HEAD_REF is ^refs/heads/main$; FILE_PATH is ^services/payments/.
    - id: b
      text:
        en: |-
          Two filter groups: the first with EVENT PULL_REQUEST_CREATED, PULL_REQUEST_UPDATED and BASE_REF ^refs/heads/main$; the second with EVENT PULL_REQUEST_CREATED, PULL_REQUEST_UPDATED and FILE_PATH ^services/payments/.
    - id: c
      text:
        en: |-
          One filter group: EVENT is PULL_REQUEST_CREATED, PULL_REQUEST_UPDATED; BASE_REF is ^refs/heads/main$; COMMIT_MESSAGE is ^payments.
    - id: d
      text:
        en: |-
          One filter group: EVENT is PULL_REQUEST_CREATED, PULL_REQUEST_UPDATED; BASE_REF is ^refs/heads/main$; FILE_PATH is ^services/payments/.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      All the filters in one filter group must match for a build to start, so one group combines the pull request events, the target branch, and the changed path. For pull request events, BASE_REF is the branch the pull request merges into, and FILE_PATH matches the paths of the changed files.
  options:
    a:
      en: |-
        HEAD_REF is the source branch of the pull request, here a feature branch, so a HEAD_REF of main never matches these pull requests.
    b:
      en: |-
        Filter groups are combined with OR, so this starts builds for every pull request into main and for payments changes into release branches.
    c:
      en: |-
        COMMIT_MESSAGE matches the text of the head commit message, not the files that changed, so it depends on developer wording.
references:
  - title: GitHub webhook events - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/github-webhook.html
