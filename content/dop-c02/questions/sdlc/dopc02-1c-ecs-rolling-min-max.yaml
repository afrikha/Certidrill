id: dopc02-1c-ecs-rolling-min-max
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon ECS service with 6 tasks on a cluster of Amazon EC2 container instances. The cluster has no spare capacity for additional tasks and does not scale out during deployments. The service uses rolling updates. The company requires that at least 4 tasks keep running during each deployment, and that deployments finish as quickly as possible within that constraint.

    Which deployment configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set minimumHealthyPercent to 50 and maximumPercent to 100.
    - id: b
      text:
        en: |-
          Set minimumHealthyPercent to 100 and maximumPercent to 200.
    - id: c
      text:
        en: |-
          Set minimumHealthyPercent to 75 and maximumPercent to 100.
    - id: d
      text:
        en: |-
          Set minimumHealthyPercent to 66 and maximumPercent to 100.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      minimumHealthyPercent is rounded up: 66% of 6 is 3.96, which becomes 4 tasks. With maximumPercent at 100, no extra tasks are needed, and the scheduler can stop 2 old tasks at a time and replace them, which keeps 4 tasks running and is the fastest configuration that respects the constraint.
  options:
    a:
      en: |-
        50% of 6 is 3 tasks, which is fewer than the 4 tasks that must keep running.
    b:
      en: |-
        The scheduler must start new tasks before stopping old ones, but the cluster has no spare capacity, so the deployment cannot progress.
    c:
      en: |-
        75% of 6 rounds up to 5 tasks, so the scheduler replaces only 1 task at a time, which is slower than necessary.
references:
  - title: "Deploy Amazon ECS services by replacing tasks - Amazon Elastic Container Service"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-ecs.html
