id: dopc02-1b-invoke-sfn-standard-workflow
objective: "1.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline has a Performance stage with an AWS Step Functions invoke action. The state machine loads test data, runs a benchmark as an Amazon ECS task, compares the results with a baseline, and ends in a Fail state when latency regresses by more than 10%. A run takes about 4 minutes. Last week, the state machine execution failed, but the action succeeded and the release continued to the Production stage. The state machine was created as an Express workflow. The company wants a regression to stop the pipeline.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Recreate the state machine as a Standard workflow and point the Step Functions invoke action to the new state machine.
    - id: b
      text:
        en: |-
          Add an output artifact to the Step Functions invoke action so that CodePipeline reads the execution result.
    - id: c
      text:
        en: |-
          Increase the timeout of the Step Functions invoke action so that CodePipeline waits until the execution ends.
    - id: d
      text:
        en: |-
          Set the ExecutionNamePrefix parameter of the action so that CodePipeline can find the execution and read its status.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      For a Standard state machine, CodePipeline polls DescribeExecution until the execution ends and fails the action when the status is FAILED, TIMED_OUT, or ABORTED. For an Express state machine, the action succeeds as soon as the execution starts, whatever its result.
  options:
    b:
      en: |-
        Express state machines do not support output artifacts, and an artifact would not change how the action's status is decided.
    c:
      en: |-
        The action does not wait for an Express execution at all, so its timeout is never reached.
    d:
      en: |-
        ExecutionNamePrefix only sets the execution name; it does not make the action wait for an Express execution.
references:
  - title: AWS Step Functions invoke action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-StepFunctions.html
