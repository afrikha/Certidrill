id: dopc02-1c-imagebuilder-lifecycle-policy
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's EC2 Image Builder pipeline produces a hardened AMI every night and distributes it to three workload accounts in two AWS Regions. The cost of the EBS snapshots behind old AMIs keeps growing. The company wants each AMI to be deprecated after 30 days and deleted, with its snapshots, after 90 days. The three newest images of each recipe version must always be kept, whatever their age. AMIs that carry the tag Retain=true must never be deleted.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Image Builder lifecycle policy with a deprecate rule at 30 days, a delete rule at 90 days that retains at least three images and removes snapshots, and an exclusion rule on the AMI tag Retain=true.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge Scheduler schedule that invokes an AWS Lambda function in each account and Region to deprecate and deregister AMIs and delete their snapshots by creation date and tag.
    - id: c
      text:
        en: |-
          Create an Amazon EC2 Recycle Bin retention rule for AMIs with a 90-day retention period in each account and Region, with a resource tag condition that excludes AMIs tagged Retain=true.
    - id: d
      text:
        en: |-
          Create an AWS Backup plan with a 90-day retention period in each account and Region that backs up the instances launched from the AMIs and excludes resources tagged Retain=true.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Image Builder lifecycle policies deprecate, disable, and delete the images that a pipeline produced, including AMIs distributed to other accounts and Regions, and can delete the associated snapshots. An age-based delete rule can retain a minimum number of images per recipe version, and an exclusion rule on output AMI tags protects tagged AMIs. The policy runs daily with no code to maintain.
  options:
    b:
      en: |-
        Custom Lambda code in every account and Region works but has far more operational overhead than the built-in lifecycle policy.
    c:
      en: |-
        Recycle Bin only keeps deleted AMIs recoverable for a retention period; it neither deprecates nor deletes AMIs on a schedule.
    d:
      en: |-
        AWS Backup creates new recovery points of instances; it does not deprecate or delete the AMIs that the pipeline produced.
references:
  - title: "Manage lifecycle policies for Image Builder images - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-image-lifecycles.html
  - title: "How lifecycle management rules work for Image Builder image resources - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/image-lifecycle-rules.html
