id: dopc02-1b-stage-load-preprod
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company streams video metadata through an API that runs on Amazon ECS behind an Application Load Balancer. Every night, a load test runs against the production API, and on two occasions it degraded latency for real customers in other time zones. The company wants to validate the performance of each release before the release reaches production. The results must reflect production behavior as closely as possible, and the tests must not affect customers.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the nightly load test against production, but limit the generated load to 50% of the observed peak traffic and run it at the time of lowest customer activity.
    - id: b
      text:
        en: |-
          Start the API in a container inside the AWS CodeBuild build environment, and run the load test against that container during the build stage of each release.
    - id: c
      text:
        en: |-
          Add a pre-production stage that deploys the release to an environment sized like production, runs the load test there, and gates the Production stage.
    - id: d
      text:
        en: |-
          Replace the load test with an Amazon CloudWatch Synthetics heartbeat canary that calls the production API every minute.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Load tests belong in a dedicated pre-production stage: an environment with the same architecture and sizing as production gives representative results, and no customer traffic shares it. Placing the stage before production turns the test into a release gate.
  options:
    a:
      en: |-
        Any load test against production still competes with customer traffic, and a reduced load no longer validates behavior at peak.
    b:
      en: |-
        A single build container has none of the production load balancer, scaling, or networking, so its results do not reflect production behavior.
    d:
      en: |-
        A heartbeat canary checks availability and latency with a single client; it does not generate load, so it cannot validate performance at scale.
references:
  - title: Automate the testing of your software applications at scale - Distributed Load Testing on AWS
    url: https://docs.aws.amazon.com/solutions/latest/distributed-load-testing-on-aws/solution-overview.html
