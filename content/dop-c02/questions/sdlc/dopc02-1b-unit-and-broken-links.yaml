id: dopc02-1b-unit-and-broken-links
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A travel company releases its booking website and a public marketing site through AWS CodePipeline. Two recent incidents were not detected by any test. In the first, a change to a currency conversion function rounded amounts incorrectly. In the second, a content update left dozens of links on the marketing site returning HTTP 404 errors after the production deployment. The company wants to add the appropriate type of automated test for each problem. Each test must run without manual steps.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Write unit tests for the currency conversion function and run them in the CodeBuild build action on every commit, with results published to a CodeBuild test report.
    - id: b
      text:
        en: |-
          Run a Distributed Load Testing on AWS test against the booking website after each deployment to detect calculation errors that appear only under heavy load.
    - id: c
      text:
        en: |-
          Create an AWS Fault Injection Service experiment that stops the marketing site's instances after each production deployment and checks how the site recovers.
    - id: d
      text:
        en: |-
          Create an Amazon CloudWatch Synthetics canary from the broken link checker blueprint for the marketing site, and run it after each production deployment.
    - id: e
      text:
        en: |-
          Add an InspectorScan action in SourceCodeScan mode to both pipelines, and fail the run when the scan reports any finding of medium severity or higher.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A rounding error in one function is a logic defect that a unit test catches in isolation on every commit, and CodeBuild test reports show which test case failed. Dead links are found by crawling the deployed site, which is what the CloudWatch Synthetics broken link checker blueprint does: it collects the links on a page and reports 404 errors and other bad responses.
  options:
    b:
      en: |-
        A load test measures capacity and latency under many concurrent users; it does not verify that a calculation returns the correct value.
    c:
      en: |-
        A fault injection experiment tests resilience to failures such as stopped instances; it does not check the links on the site.
    e:
      en: |-
        A source code scan finds known vulnerabilities in code and dependencies; neither a rounding error nor a broken link is a vulnerability.
references:
  - title: Test reports in AWS CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/test-reporting.html
  - title: Using canary blueprints - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries_Blueprints.html
