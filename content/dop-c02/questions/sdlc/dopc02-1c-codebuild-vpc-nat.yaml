id: dopc02-1c-codebuild-vpc-nat
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company configured an AWS CodeBuild project to run in a VPC so that its integration tests can reach an Amazon RDS database. The project uses two public subnets whose route tables send 0.0.0.0/0 to an internet gateway, and the subnets automatically assign public IPv4 addresses. Since the change, every build fails while it downloads dependencies from the internet. The database security group already allows the build security group.

    Which solution will allow the builds to reach the internet?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the project to use private subnets whose route tables send 0.0.0.0/0 to a NAT gateway that runs in a public subnet.
    - id: b
      text:
        en: |-
          Allocate an Elastic IP address for each Availability Zone, and associate it with the network interfaces that CodeBuild creates for each build.
    - id: c
      text:
        en: |-
          Add an inbound rule to the build security group that allows return traffic from 0.0.0.0/0 on the ephemeral port range.
    - id: d
      text:
        en: |-
          Create a gateway VPC endpoint for Amazon S3 in the VPC, and associate it with the route tables of the two public subnets.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CodeBuild network interfaces in a VPC never get a public IP address: CodeBuild cannot attach Elastic IP addresses, and EC2 does not auto-assign public IPv4 addresses to network interfaces created outside an instance launch. CodeBuild must therefore use private subnets with a route to a NAT gateway or NAT instance that sits in a public subnet.
  options:
    b:
      en: |-
        CodeBuild does not support assigning Elastic IP addresses to the network interfaces that it creates.
    c:
      en: |-
        Security groups are stateful, so return traffic is already allowed; the build fails because its network interface has no public IP address.
    d:
      en: |-
        An S3 gateway endpoint only reaches Amazon S3; the builds download dependencies from internet hosts, which still need a NAT device.
references:
  - title: "Use AWS CodeBuild with Amazon Virtual Private Cloud - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/vpc-support.html
