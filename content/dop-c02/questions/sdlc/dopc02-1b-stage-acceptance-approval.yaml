id: dopc02-1b-stage-acceptance-approval
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company uses AWS CodePipeline to release a claims portal. The Staging stage deploys the portal and then runs automated acceptance tests in AWS CodeBuild. A new regulation requires that a product owner tests each release in the staging environment and records an approval or rejection, with comments, before the release can reach production. Product owners must be notified by email when a release is waiting, and the notification must include the address of the staging portal. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a manual approval action after the acceptance tests in the Staging stage, with an Amazon SNS topic that emails the product owners and the staging portal as the URL for review.
    - id: b
      text:
        en: |-
          Disable the transition into the Production stage, and ask product owners to enable the transition after they test the staging portal.
    - id: c
      text:
        en: |-
          Add a Lambda invoke action that emails the product owners through Amazon SES and uses continuation tokens to keep the job open until a reply with the decision is received.
    - id: d
      text:
        en: |-
          Configure the acceptance test project to publish to an Amazon SNS email topic in its post_build phase, and have product owners rerun the pipeline from the console to approve.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A manual approval action stops the pipeline until an authorized person approves or rejects it with comments, and it can publish to an SNS topic, created in the pipeline's Region, whose message includes the URL to review. Manual approvals are intended for manual quality assurance testing before a revision moves to the next stage.
  options:
    b:
      en: |-
        Enabling a disabled transition records no approval decision or comments, and it sends no notification to the product owners.
    c:
      en: |-
        Email parsing and continuation tokens are custom code that the managed approval action already provides.
    d:
      en: |-
        Rerunning the pipeline is not a recorded approval, and nothing stops the original run from continuing to production.
references:
  - title: Add a manual approval action to a stage - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
