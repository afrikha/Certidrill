id: dopc02-1c-codeartifact-archive-version
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company publishes its internal npm packages to an AWS CodeArtifact repository. Version 2.4.1 of a shared library contains a critical vulnerability. Several services pin that version in their package-lock.json files and run `npm ci` in AWS CodeBuild. The security team requires that no build can download version 2.4.1 anymore, including builds that use lock files. The auditors require that the assets of the version be kept so that the version can be made available again after the investigation.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the status of version 2.4.1 to Unlisted, so that npm no longer lists the version and dependency resolution no longer selects it for new installations.
    - id: b
      text:
        en: |-
          Change the status of version 2.4.1 to Archived, so that package managers can no longer download it while the assets stay in the repository.
    - id: c
      text:
        en: |-
          Change the status of version 2.4.1 to Disposed, so that package managers can no longer download it and the repository stops charging for its storage.
    - id: d
      text:
        en: |-
          Delete version 2.4.1 with the DeletePackageVersions API, and publish the same version again from the original build output if it is needed later.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An Archived package version can no longer be downloaded by package managers, so builds that depend on it fail, even with a lock file. Its assets are kept, and the status can be changed back to Unlisted or Published after the investigation.
  options:
    a:
      en: |-
        An Unlisted version can still be downloaded when it is referenced explicitly, for example by a package-lock.json file used by `npm ci`.
    c:
      en: |-
        Disposed permanently deletes the assets, and the status cannot be changed back to Published, which breaks the audit requirement.
    d:
      en: |-
        Deleting the version removes it and its assets from the repository; the auditors require the original assets to be kept.
references:
  - title: "Packages overview - CodeArtifact"
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/packages-overview.html
