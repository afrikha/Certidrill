id: dopc02-1c-ecs-unique-image-tags
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's Amazon ECS task definitions reference the image tag `prod`, which the pipeline moves to each new image in Amazon ECR. After a bad release, an engineer updated the service to the previous task definition revision, but the new tasks started the faulty image again. The company requires that each task definition revision always run the same image, so that deploying an earlier revision restores the earlier release. The company wants to keep using image tags in the task definitions.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on the deployment circuit breaker with rollback, so that ECS returns to the previous task definition revision automatically when a deployment fails.
    - id: b
      text:
        en: |-
          Add a lifecycle policy to the repository that keeps only the 10 most recent images, so that faulty images are removed from the repository quickly.
    - id: c
      text:
        en: |-
          Tag each image with its commit ID, turn on tag immutability for the repository, and register a task definition revision with that tag for each release.
    - id: d
      text:
        en: |-
          Change the pipeline to tag every new image `latest` instead of `prod`, and reference the `latest` tag in every new task definition revision.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With a unique tag per build and tag immutability, a tag can never be moved to another image, so each task definition revision is bound to one image. Deploying an earlier revision then runs the earlier image, which makes releases immutable and rollbacks reliable.
  options:
    a:
      en: |-
        The circuit breaker returns to the previous revision, but that revision still references the moving `prod` tag, so it starts the faulty image again.
    b:
      en: |-
        Expiring old images does not stop the `prod` tag from moving, and it can delete the image that a rollback needs.
    d:
      en: |-
        `latest` is just another moving tag, so every revision still resolves to whichever image holds it.
references:
  - title: "Preventing image tags from being overwritten in Amazon ECR - Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-tag-mutability.html
