id: dopc02-1a-ecr-lifecycle-untagged
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's build pipeline pushes a container image to an Amazon ECR private repository for every commit, dozens of times a day. Images that are promoted to production receive a tag that starts with release-, such as release-1.4.2. All other images become untagged when newer builds move their tags. Storage costs are growing. The company wants untagged images to be deleted 7 days after they were pushed and wants to keep only the 20 most recent images whose tags start with release-. The company does not want to write custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a lifecycle policy with a rule that expires untagged images 7 days after push and a rule that expires tagged release- images beyond a count of 20.
    - id: b
      text:
        en: |-
          Turn on tag immutability, and add a lifecycle policy rule that selects all images and expires them when the repository holds more than 20 images.
    - id: c
      text:
        en: |-
          Create an EventBridge Scheduler schedule that runs an AWS Lambda function every day to call BatchDeleteImage for images that are older than 7 days.
    - id: d
      text:
        en: |-
          Add a lifecycle policy rule that expires tagged release- images 7 days after push, and turn on tag immutability so that untagged images are removed.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      One lifecycle rule selects untagged images with the sinceImagePushed count type and a count of 7 days, and another selects tagged images with the release- prefix and the imageCountMoreThan count type set to 20. Amazon ECR evaluates the rules and expires the matching images, usually within 24 hours after they meet the criteria, without custom code.
  options:
    b:
      en: |-
        A count rule on all images would expire release images once the 20-image limit is reached by any builds, and it does not apply the 7-day rule to untagged images.
    c:
      en: |-
        A scheduled Lambda function is custom code, and deleting every image older than 7 days would also delete the release images.
    d:
      en: |-
        This rule deletes release images after 7 days instead of keeping the 20 most recent, and tag immutability does not delete untagged images.
references:
  - title: Automate the cleanup of images by using lifecycle policies in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/LifecyclePolicies.html
