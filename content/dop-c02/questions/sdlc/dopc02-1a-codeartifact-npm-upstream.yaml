id: dopc02-1a-codeartifact-npm-upstream
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 30 development teams. Each team has its own AWS CodeArtifact repository in a shared domain, and each of these repositories has an external connection to public:npmjs. The same public packages are fetched and stored again in every team repository, and the security team cannot review public package intake in one place. The company wants all teams to get public npm packages through a single repository that fetches them from the npm public registry, so that a package fetched once is available to every team repository.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a separate CodeArtifact domain for each team, and move each team repository and its external connection into the team's own domain.
    - id: b
      text:
        en: |-
          Create one repository with the external connection to public:npmjs, remove the external connections from the team repositories, and add that repository as their upstream.
    - id: c
      text:
        en: |-
          Configure every team repository as an upstream repository of the other team repositories so that a package fetched by one team becomes visible to all teams.
    - id: d
      text:
        en: |-
          Run a nightly AWS CodeBuild job that downloads the approved npm packages into an Amazon S3 bucket, and point the npm clients of the teams to the bucket.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CodeArtifact's intended pattern is one repository per domain with the external connection to a public repository, and every other repository configured with that repository as an upstream. Packages fetched from npmjs once are then reused by all the downstream repositories instead of being fetched and stored again. A repository can have only one external connection.
  options:
    a:
      en: |-
        Separate domains isolate the teams even more, so public packages would still be fetched separately and there would be no single point of intake.
    c:
      en: |-
        Chaining 30 repositories as upstreams of each other keeps 30 external connections and creates a complex search order without a single intake point.
    d:
      en: |-
        An S3 bucket is not a package registry for npm clients, and the nightly job is custom work that CodeArtifact already provides.
references:
  - title: Connect a CodeArtifact repository to a public repository - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/external-connection.html
