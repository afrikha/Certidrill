id: dopc02-1b-stage-parallel-runorder
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company releases a mobile banking app and its backend through AWS CodePipeline. The QA stage runs three actions one after the other: an AWS CodeBuild test action for API integration tests (about 20 minutes), an AWS Device Farm test action for the Android app (about 25 minutes), and an Amazon Inspector InspectorScan action in ECRImageScan mode (about 10 minutes). The three actions are independent of each other, and all three must pass before the Production stage starts. The company wants to reduce the duration of the QA stage as much as possible without removing any test.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable BatchEnabled on the CodeBuild action and define a build list in the buildspec that runs the three test suites as parallel builds.
    - id: b
      text:
        en: |-
          Move each of the three actions into its own stage between the QA stage and the Production stage.
    - id: c
      text:
        en: |-
          Set the same runOrder value on the three actions in the QA stage so that they run in parallel.
    - id: d
      text:
        en: |-
          Change the compute type of the CodeBuild project to BUILD_GENERAL1_LARGE to speed up the integration tests.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Actions in the same stage that share a runOrder value run in parallel, and the stage succeeds only when all of them succeed. The QA stage then takes about as long as its slowest action, 25 minutes instead of 55, and Production still waits for all three tests.
  options:
    a:
      en: |-
        A CodeBuild batch runs only CodeBuild builds; the Device Farm and Amazon Inspector tests are separate action providers that a buildspec cannot run.
    b:
      en: |-
        Stages run one after the other, so separate stages keep the tests sequential and do not shorten the release.
    d:
      en: |-
        A larger compute type can shorten only the CodeBuild action; the three actions still run in sequence.
references:
  - title: Action declaration - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-requirements.html
