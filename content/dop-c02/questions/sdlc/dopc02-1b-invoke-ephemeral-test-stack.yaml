id: dopc02-1b-invoke-ephemeral-test-stack
objective: "1.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants each run of its AWS CodePipeline pipeline to create a fresh test environment from an AWS CloudFormation template, run integration tests against it with an AWS CodeBuild test action, and then remove the environment so that it costs nothing between runs. If the tests fail, the environment must stay in place so that engineers can investigate it before they delete it themselves. The company wants to use built-in pipeline actions and no custom code.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a CloudFormation deploy action with the CREATE_UPDATE action mode in a stage before the test action.
    - id: b
      text:
        en: |-
          Add a CloudFormation deploy action with the CHANGE_SET_REPLACE action mode in a stage before the test action.
    - id: c
      text:
        en: |-
          Add a CloudFormation deploy action with the DELETE_ONLY action mode in a stage after the test action.
    - id: d
      text:
        en: |-
          Add a Lambda invoke action after the test action that calls DeleteStack and waits for the stack deletion to finish.
    - id: e
      text:
        en: |-
          Add a CloudFormation deploy action with the REPLACE_ON_FAILURE action mode in a stage after the test action.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      CREATE_UPDATE creates the stack if it does not exist or updates it, so the test environment exists before the tests run. DELETE_ONLY deletes the stack, and because it is in a later stage, it runs only when the tests succeed; a failed test stops the run and leaves the environment for investigation.
  options:
    b:
      en: |-
        CHANGE_SET_REPLACE only creates or replaces a change set; no resources exist until the change set is executed.
    d:
      en: |-
        A Lambda function that deletes the stack is custom code for what the DELETE_ONLY action mode already does.
    e:
      en: |-
        REPLACE_ON_FAILURE creates or updates a stack, or replaces a failed one; it never removes the environment.
references:
  - title: CloudFormation deploy action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CloudFormation.html
