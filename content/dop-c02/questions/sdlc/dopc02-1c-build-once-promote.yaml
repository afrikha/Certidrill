id: dopc02-1c-build-once-promote
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company promotes a Java application through development, staging, and production accounts with AWS CodePipeline. Each stage has its own AWS CodeBuild action that compiles the same commit again, with environment-specific endpoints written into a properties file inside the JAR. An audit found that the JAR deployed to production differs from the JAR that passed the staging tests. The company now requires that the exact binary that was tested in staging is the binary deployed to production.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Keep one build per stage, but pin the build image version and every dependency version so that the separate compilations produce the same output.
    - id: b
      text:
        en: |-
          Build the JAR once in the first stage, and pass the same output artifact to the deploy actions of the staging and production stages.
    - id: c
      text:
        en: |-
          Store a copy of the JAR in an S3 bucket in each account, and rebuild the copy in an account only when the commit ID of the source changes.
    - id: d
      text:
        en: |-
          Add a manual approval action before production in which a reviewer compares the checksums of the staging and production JAR files.
    - id: e
      text:
        en: |-
          Remove the environment-specific values from the build, and have the application read them at deployment or run time from Parameter Store parameters in each account.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Building once and promoting the same output artifact through every stage guarantees that production runs the binary that staging tested. That is only possible if nothing environment-specific is compiled into the artifact, so the endpoints move to configuration that each account supplies, such as AWS Systems Manager Parameter Store parameters.
  options:
    a:
      en: |-
        Separate compilations still produce separate binaries with different environment values inside, so the production JAR is not the tested one.
    c:
      en: |-
        Each account still holds its own rebuilt copy, which is not the artifact that passed staging.
    d:
      en: |-
        A manual comparison only detects the difference after the fact; it does not make the binaries identical, and it adds a manual step.
references:
  - title: "AWS CodeBuild build and test action reference - AWS CodePipeline"
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodeBuild.html
  - title: "Build specification reference for CodeBuild - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
