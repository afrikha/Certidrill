id: dopc02-1c-lambda-sam-canary
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys an AWS Lambda function behind Amazon API Gateway with AWS SAM through AWS CodePipeline. For each release, the company wants 10% of the traffic to go to the new version for 10 minutes before the rest of the traffic shifts. A validation function must run before any production traffic reaches the new version. If an Amazon CloudWatch alarm on the function's errors enters the ALARM state during the deployment, the traffic must return to the previous version automatically.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Use AutoPublishAlias and a DeploymentPreference of type Linear10PercentEvery1Minute with the alarm, and add the validation function as a PostTraffic hook.
    - id: b
      text:
        en: |-
          Publish a new version in the pipeline, and update the weights of a weighted alias with the AWS CLI after 10 minutes if the alarm is still in the OK state.
    - id: c
      text:
        en: |-
          Configure an API Gateway canary release on the production stage that sends 10% of the requests to the new deployment, and promote the canary after 10 minutes.
    - id: d
      text:
        en: |-
          Use AutoPublishAlias and a DeploymentPreference of type Canary10Percent10Minutes with the alarm in Alarms, and add the validation function as a PreTraffic hook.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With AutoPublishAlias and DeploymentPreference, AWS SAM publishes a new version and creates an AWS CodeDeploy deployment that shifts traffic on the alias. Canary10Percent10Minutes sends 10% of the traffic first and the rest after 10 minutes, the PreTraffic hook runs before any traffic shifts, and an alarm in Alarms makes CodeDeploy roll back.
  options:
    a:
      en: |-
        Linear10PercentEvery1Minute shifts 10% every minute instead of holding 10% for 10 minutes, and a PostTraffic hook runs after all traffic has shifted.
    b:
      en: |-
        Scripting alias weights in the pipeline is custom logic and rolls nothing back automatically while the traffic is split.
    c:
      en: |-
        An API Gateway canary splits requests between stage deployments, not function versions, and it has no alarm-based automatic rollback.
references:
  - title: "Deploying serverless applications gradually with AWS SAM - AWS Serverless Application Model"
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html
