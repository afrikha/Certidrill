id: dopc02-1a-buildspec-secrets-manager
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team's buildspec file, stored in a Git repository, defines a DOCKERHUB_TOKEN variable in the env variables section with the token in plaintext. The token is used during the build to log in to a container registry. The security team requires that the token is removed from the repository and from the CodeBuild project configuration, stored encrypted in a service that supports rotation, and retrieved only at build time.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Move the variable from the buildspec to the environment variables of the CodeBuild project with the PLAINTEXT type.
    - id: b
      text:
        en: |-
          Encrypt the token with AWS KMS, commit the ciphertext to the repository, and decrypt it in the pre_build phase with the aws kms decrypt command.
    - id: c
      text:
        en: |-
          Store the token in AWS Secrets Manager, reference it in the secrets-manager section of the buildspec env block, and allow the service role to read the secret.
    - id: d
      text:
        en: |-
          Store the token in an Amazon S3 object encrypted with SSE-KMS, and download the object in the install phase of the buildspec.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The env/secrets-manager section maps a local environment variable to a secret ID, with an optional JSON key and version, and CodeBuild retrieves the value at build time. Secrets Manager stores the value encrypted and supports rotation, and the CodeBuild service role needs permission to get the secret value.
  options:
    a:
      en: |-
        Plaintext project environment variables are displayed in the console and the AWS CLI, and the token would still be stored in the project configuration.
    b:
      en: |-
        The encrypted token would still be stored in the repository, and the decryption step is custom work without rotation support.
    d:
      en: |-
        An S3 object can hold the token encrypted, but it is not a secrets service with rotation, and the download step adds custom work.
references:
  - title: Build specification reference for CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
