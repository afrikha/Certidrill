id: dopc02-1c-beanstalk-traffic-splitting
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an API in an AWS Elastic Beanstalk environment with an Application Load Balancer. For each release, the company wants 10% of client traffic to go to the new version for 15 minutes, on new instances only, while the existing instances keep serving the rest. If the new instances fail health checks during that period, all traffic must return to the existing instances automatically. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use the Immutable deployment policy, and set the health check success threshold to Ok and the command timeout to 900 seconds.
    - id: b
      text:
        en: |-
          Clone the environment for each release, deploy the new version to the clone, and swap the environment URLs after 15 minutes of manual testing.
    - id: c
      text:
        en: |-
          Use the Rolling with additional batch deployment policy, with a fixed batch size equal to 10% of the instances.
    - id: d
      text:
        en: |-
          Use the Traffic splitting deployment policy with NewVersionPercent set to 10 and EvaluationTime set to 15.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A traffic-splitting deployment launches a full set of new instances in a temporary Auto Scaling group and sends the configured percentage of client traffic to them for the evaluation time. If the new instances are unhealthy, Elastic Beanstalk returns all traffic to the original instances and terminates the new ones; it requires an Application Load Balancer, which the environment has.
  options:
    a:
      en: |-
        An Immutable deployment moves traffic to the new instances only after they pass health checks, without sending a percentage of traffic to them for 15 minutes.
    b:
      en: |-
        Cloning and swapping URLs is a manual blue/green process with a DNS cutover and no automatic 10% evaluation.
    c:
      en: |-
        Rolling with additional batch updates existing instances and does not split traffic by percentage.
references:
  - title: "Deployment policies and settings - AWS Elastic Beanstalk"
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.rolling-version-deploy.html
