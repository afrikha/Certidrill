id: dopc02-1a-continuous-deployment-gate
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company releases a web application with AWS CodePipeline. The pipeline has a source stage connected to a GitHub repository, a build stage that runs unit tests in AWS CodeBuild, a staging stage that deploys the application and runs automated integration tests, and a production stage. A manual approval action at the start of the production stage is approved once a day by a release manager. The company wants to adopt continuous deployment so that every change that passes all the automated tests reaches production without waiting for a person.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the manual approval action and configure it to publish to an Amazon SNS topic so that the release manager is notified as soon as a change reaches the action.
    - id: b
      text:
        en: |-
          Remove the manual approval action so that the production stage runs automatically after the integration tests in the staging stage succeed.
    - id: c
      text:
        en: |-
          Replace the manual approval action with an Amazon EventBridge Scheduler schedule that starts the pipeline once a day after business hours.
    - id: d
      text:
        en: |-
          Move the production stage into a second pipeline that the release manager starts manually after reviewing the staging test results.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Continuous delivery keeps a manual approval before production, while continuous deployment releases to production automatically without explicit approval. Removing the approval action makes the automated tests the only gate, so every change that passes them is deployed to production.
  options:
    a:
      en: |-
        A notification speeds up the review, but a person must still approve every change, which is continuous delivery, not continuous deployment.
    c:
      en: |-
        A daily schedule batches the changes of the day and delays them; changes still wait instead of reaching production as soon as they pass the tests.
    d:
      en: |-
        A pipeline that a person starts manually keeps a human checkpoint before production, which the company wants to remove.
references:
  - title: What is Continuous Delivery? – Amazon Web Services
    url: https://aws.amazon.com/devops/continuous-delivery/
  - title: Add a manual approval action to a stage - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
