id: dopc02-1c-eks-fargate-efs-static
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a document processing application on Amazon EKS. The pods run on AWS Fargate across three Availability Zones. All replicas must read and write the same files at the same time through a persistent volume, and the data must survive pod restarts and redeployments. The company has created an Amazon EFS file system with a mount target in each Availability Zone.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Install the Amazon EBS CSI driver, and create a StorageClass for gp3 volumes and a PersistentVolumeClaim with the ReadWriteMany access mode.
    - id: b
      text:
        en: |-
          Create a StorageClass for the EFS CSI driver with dynamic provisioning, and a PersistentVolumeClaim that requests a new access point for the application.
    - id: c
      text:
        en: |-
          Create a PersistentVolume that references the existing EFS file system through the EFS CSI driver, and a PersistentVolumeClaim with the ReadWriteMany access mode.
    - id: d
      text:
        en: |-
          Use an emptyDir volume in the pod specification, and run a sidecar container that synchronizes the directory with the other replicas.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Pods on Fargate mount EFS file systems automatically without installing the driver, but only with static provisioning: you create a PersistentVolume that points to the existing file system. EFS is shared across Availability Zones and supports concurrent read and write access from many pods, and the data persists independently of the pods.
  options:
    a:
      en: |-
        EBS volumes live in one Availability Zone and attach to one node, so they cannot provide shared read-write access to pods in three Availability Zones.
    b:
      en: |-
        Dynamic provisioning of EFS volumes is not supported for pods on Fargate nodes.
    d:
      en: |-
        An emptyDir volume is deleted with the pod and is not shared between pods; a custom sync sidecar does not provide a consistent shared file system.
references:
  - title: "Use elastic file system storage with Amazon EFS - Amazon EKS"
    url: https://docs.aws.amazon.com/eks/latest/userguide/efs-csi.html
