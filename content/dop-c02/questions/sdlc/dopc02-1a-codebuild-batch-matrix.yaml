id: dopc02-1a-codebuild-batch-matrix
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company builds a data access library with AWS CodeBuild. Before each release, two test suites, each defined in its own buildspec file, must run against three database engines that the tests select through a DB_ENGINE environment variable (postgres, mysql, and mariadb). All six combinations must run in parallel, and the release must stop if any combination fails. The company wants to use a single CodeBuild project and the least configuration.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable batch builds for the project, and define a build-matrix whose dynamic section lists the two buildspec files and the three DB_ENGINE values.
    - id: b
      text:
        en: |-
          Enable batch builds for the project, and define a build-fanout with a parallelism of 6 so that CodeBuild runs the six combinations in parallel.
    - id: c
      text:
        en: |-
          Create six CodeBuild projects, one for each combination, and run them as six parallel actions in the same stage of an AWS CodePipeline pipeline.
    - id: d
      text:
        en: |-
          Enable batch builds for the project, and define a build-graph in which each of the six builds depends on the build defined before it.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A build matrix defines configurations in its dynamic section, such as buildspec files and environment variable values, and CodeBuild creates a separate build for each combination and runs them in parallel. Two buildspec files and three values produce six builds in one batch, and the batch fails when a build fails unless failures are ignored. Batch builds need a batch service role.
  options:
    b:
      en: |-
        A build fanout splits one test run into shards; it does not combine different buildspec files with different variable values.
    c:
      en: |-
        Six projects and six actions work, but they need much more configuration than one batch build in a single project.
    d:
      en: |-
        A build graph runs tasks in dependency order, so a chain of dependencies makes the six builds run one after another instead of in parallel.
references:
  - title: Run builds in batches - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/batch-build.html
  - title: Batch build buildspec reference - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/batch-build-buildspec.html
