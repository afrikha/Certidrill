id: dopc02-1b-pr-and-merge-builds
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores a Java service in a GitHub repository and uses two AWS CodeBuild projects with webhooks. The unit-tests project runs in 4 minutes. The regression project runs a 50-minute regression suite. The company wants the unit-tests project to run for every pull request that targets main when it is opened and whenever commits are added to it. The regression project must run once each time a pull request is merged into main. Developers create pull requests from feature branches.

    Which combination of webhook filter groups will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          For the unit-tests project: EVENT is PULL_REQUEST_CREATED, PULL_REQUEST_UPDATED and BASE_REF is ^refs/heads/main$.
    - id: b
      text:
        en: |-
          For the unit-tests project: EVENT is PUSH and HEAD_REF is ^refs/heads/main$.
    - id: c
      text:
        en: |-
          For the regression project: EVENT is PULL_REQUEST_MERGED and HEAD_REF is ^refs/heads/main$.
    - id: d
      text:
        en: |-
          For the regression project: EVENT is PULL_REQUEST_MERGED and BASE_REF is ^refs/heads/main$.
    - id: e
      text:
        en: |-
          For the unit-tests project: EVENT is PULL_REQUEST_CREATED, PULL_REQUEST_MERGED and BASE_REF is ^refs/heads/main$.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      PULL_REQUEST_CREATED and PULL_REQUEST_UPDATED cover a new pull request and each new commit on it, and BASE_REF restricts them to pull requests that target main. PULL_REQUEST_MERGED with BASE_REF ^refs/heads/main$ fires once when a pull request is merged into main.
  options:
    b:
      en: |-
        A push to main happens only after the merge, so the unit tests would not run while the pull request is open.
    c:
      en: |-
        HEAD_REF is the pull request's source branch, a feature branch here, so this filter never matches pull requests merged into main.
    e:
      en: |-
        Without PULL_REQUEST_UPDATED, new commits on an open pull request are not tested, and merges would start unit test builds that are not required.
references:
  - title: GitHub webhook events - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/github-webhook.html
