id: dopc02-1c-lambda-version-alias
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's Amazon API Gateway API invokes an AWS Lambda function by its unqualified ARN. Each deployment uploads new code to the function, and rolling back means rebuilding and uploading the previous code, which takes about 20 minutes. The company wants each release to be an immutable snapshot of code and configuration, and a rollback to take seconds.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Publish a version of the function at each deployment, point the API Gateway integration to an alias, and roll back by pointing the alias to the previous version.
    - id: b
      text:
        en: |-
          Turn on S3 Versioning on the bucket that holds the deployment packages, and roll back by updating the function code from the previous object version.
    - id: c
      text:
        en: |-
          Keep invoking $LATEST, and store a copy of each deployment package in AWS CodeArtifact so that the previous code can be uploaded again.
    - id: d
      text:
        en: |-
          Set reserved concurrency on the function to zero during each deployment, and restore it after the smoke tests pass on the new code.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A published Lambda version locks the code and most configuration settings, so it is an immutable snapshot, while $LATEST stays mutable. An alias points to a version and can be repointed instantly, so the API calls the alias and a rollback is a single alias update.
  options:
    b:
      en: |-
        Restoring an older package still overwrites $LATEST in place, which is a mutable deployment and slower than switching an alias.
    c:
      en: |-
        $LATEST is overwritten by every deployment, so a rollback is still a new upload of the old code.
    d:
      en: |-
        Setting concurrency to zero throttles the function; it provides neither a snapshot of the release nor a rollback.
references:
  - title: "Manage Lambda function versions - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-versions.html
