id: dopc02-1c-ecr-immutability-scanning
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is creating an Amazon ECR repository for production images. The deployment tooling relies on the `latest` tag, which must keep moving to the newest image. Every other tag must never point to a different image once it has been pushed. The security team requires that images be scanned for vulnerabilities in both operating system packages and programming language packages, and that findings be updated as new vulnerabilities are published, without rescanning manually.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the tag mutability of the repository to IMMUTABLE, so that no tag in the repository can be overwritten by a later push.
    - id: b
      text:
        en: |-
          Turn on basic scanning with scan on push for the repository, so that each image is scanned against the CVE database when it is pushed.
    - id: c
      text:
        en: |-
          Set the tag mutability of the repository to IMMUTABLE_WITH_EXCLUSION with an exclusion filter for the `latest` tag.
    - id: d
      text:
        en: |-
          Add a statement to the repository policy that denies ecr:PutImage for every principal, except for the CI/CD role, on existing tags.
    - id: e
      text:
        en: |-
          Turn on enhanced scanning with continuous scanning in the registry scanning configuration, which uses Amazon Inspector.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      IMMUTABLE_WITH_EXCLUSION makes every tag immutable except the tags that match the exclusion filters, so `latest` can still move while the release tags are locked. Enhanced scanning, which integrates with Amazon Inspector, covers operating system and programming language packages and scans continuously, updating findings as new vulnerabilities are published.
  options:
    a:
      en: |-
        IMMUTABLE applies to every tag, so the next push of `latest` fails with an ImageTagAlreadyExistsException error.
    b:
      en: |-
        Basic scanning covers operating system packages only and scans on push or manually, not continuously.
    d:
      en: |-
        Repository policies have no condition on whether a tag already exists, so this statement cannot protect existing tags.
references:
  - title: "Preventing image tags from being overwritten in Amazon ECR - Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-tag-mutability.html
  - title: "Scan images for software vulnerabilities in Amazon ECR - Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning.html
