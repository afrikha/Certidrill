id: dopc02-1d-ecs-execution-role-pull
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an Amazon ECS service on AWS Fargate. The task definition references an image in a private Amazon ECR repository in the same account and Region. The task definition specifies a task role that has the AmazonEC2ContainerRegistryReadOnly managed policy, and it specifies no task execution role. New tasks fail to start with a CannotPullContainerError error.

    Which solution will resolve the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Add a statement to the repository policy that allows ecr:BatchGetImage and ecr:GetDownloadUrlForLayer for the ecs-tasks.amazonaws.com service principal.
    - id: b
      text:
        en: |-
          Attach the AmazonEC2ContainerRegistryReadOnly managed policy to the ECS service-linked role, and redeploy the service.
    - id: c
      text:
        en: |-
          Create a task execution role with the AmazonECSTaskExecutionRolePolicy managed policy, and set it as the execution role in the task definition.
    - id: d
      text:
        en: |-
          Add a statement to the repository policy that allows ecr:GetAuthorizationToken for the task role, and redeploy the service.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The ECS and Fargate agents pull images with the task execution role, not with the task role, which is used by the application's own AWS API calls. The AmazonECSTaskExecutionRolePolicy managed policy includes the permissions needed to pull images from Amazon ECR.
  options:
    a:
      en: |-
        Image pulls are made with the credentials of the task execution role; without that role the agent has no credentials, whatever the repository policy allows.
    b:
      en: |-
        Service-linked roles have permissions defined by AWS and are not used to pull task images; the image pull uses the task execution role.
    d:
      en: |-
        ecr:GetAuthorizationToken must be granted by an identity-based policy, and the task role is not used to pull the image.
references:
  - title: Amazon ECS task execution IAM role - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html
