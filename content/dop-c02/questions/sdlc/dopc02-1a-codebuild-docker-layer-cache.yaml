id: dopc02-1a-codebuild-docker-layer-cache
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CodeBuild project builds a large container image about 40 times a day on Linux EC2 compute in privileged mode. Most of the build time is spent pulling large base images over the network and rebuilding Docker layers that did not change since the previous build. The team wants to reduce the build time with the fewest changes to the project and the buildspec.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the compute type of the project to AWS Lambda so that each build starts faster and does not wait for instance provisioning.
    - id: b
      text:
        en: |-
          Turn on local caching in the project with the Docker layer cache mode so that existing Docker layers are reused on the build host.
    - id: c
      text:
        en: |-
          Turn on local caching in the project with the source cache mode so that only the changes between commits are pulled.
    - id: d
      text:
        en: |-
          Change the compute type of the project to a larger instance size so that docker build runs with more vCPUs and memory.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Docker layer cache mode caches existing Docker layers on the build host, which suits projects that build or pull large images often. It is available for Linux only and requires privileged mode, which the project already uses.
  options:
    a:
      en: |-
        Lambda compute does not support Docker builds, privileged mode, or caching.
    c:
      en: |-
        The source cache mode caches Git metadata for large repositories; it does not keep Docker layers or base images.
    d:
      en: |-
        More compute does not avoid pulling the base images again or rebuilding unchanged layers, and it raises the cost of every build.
references:
  - title: Local caching - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/caching-local.html
  - title: Cache builds to improve performance - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-caching.html
