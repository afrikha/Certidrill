id: dopc02-1a-commit-id-image-tag
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline has a GitHub source action that uses AWS CodeConnections with the default settings and the SourceVariables namespace. An AWS CodeBuild action then builds a container image and pushes it to Amazon ECR. The company wants each image tag to be the commit ID that started the pipeline execution, so that every running container can be traced back to its commit.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Run git rev-parse HEAD in the buildspec to read the commit ID from the source artifact, and use the result as the image tag.
    - id: b
      text:
        en: |-
          Add an environment variable set to #{SourceVariables.CommitId} to the CodeBuild action, and use it as the image tag in the buildspec.
    - id: c
      text:
        en: |-
          Use the CODEBUILD_BUILD_ID environment variable as the image tag so that the tag is unique for every build of the image.
    - id: d
      text:
        en: |-
          Turn on tag immutability for the ECR repository so that Amazon ECR tags each pushed image with the commit ID automatically.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The CodeStarSourceConnection action outputs variables such as CommitId, BranchName, and CommitMessage. A downstream action references them with the namespace, for example #{SourceVariables.CommitId}, so the CodeBuild action receives the commit ID as an environment variable.
  options:
    a:
      en: |-
        With the default CODE_ZIP output format, the source artifact is a ZIP of the files without Git metadata, so git commands cannot read the commit.
    c:
      en: |-
        The build ID identifies the CodeBuild build, not the commit, so it cannot be traced back to the source revision.
    d:
      en: |-
        Tag immutability only prevents tags from being overwritten; Amazon ECR does not create tags from commit IDs.
references:
  - title: CodeStarSourceConnection for Bitbucket Cloud, GitHub, GitHub Enterprise Server, GitLab.com, and GitLab self-managed actions - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodestarConnectionSource.html
  - title: AWS CodeBuild build and test action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodeBuild.html
