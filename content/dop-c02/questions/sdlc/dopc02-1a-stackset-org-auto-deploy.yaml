id: dopc02-1a-stackset-org-auto-deploy
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations with all features enabled. The security team maintains an AWS CloudFormation template that creates an IAM role and an Amazon EventBridge rule in every account of the Workloads organizational unit (OU), in us-east-1 and eu-west-1. An account vending process adds new accounts to the OU every week, and each new account must receive the resources without anyone editing the pipeline or a list of accounts. Template changes are committed to a Git repository and deployed by an AWS CodePipeline pipeline in an account that is registered as a delegated administrator for CloudFormation StackSets.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Use a CloudFormationStackSet action with the SELF_MANAGED permission model and an accounts file in the repository, and use a Lambda function to add each new account ID to the file.
    - id: b
      text:
        en: |-
          Add a CloudFormation deploy action for each account and Region with a cross-account role, and add new actions to the pipeline when new accounts join the OU.
    - id: c
      text:
        en: |-
          Use a CloudFormationStackSet action with SERVICE_MANAGED permissions and automatic deployment enabled, then a CloudFormationStackInstances action that targets the OU in both Regions.
    - id: d
      text:
        en: |-
          Use a CloudFormationStackInstances action with SELF_MANAGED permissions that targets the organization root ID in both Regions, and run the pipeline every week.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With the service-managed permission model, StackSets creates the required roles in Organizations member accounts, and the OrganizationsAutoDeployment setting deploys stack instances to accounts that are added to a target OU. The CloudFormationStackInstances action deploys the stack set to the OU in the listed Regions, so new accounts are covered without changing the pipeline. Trusted access between StackSets and Organizations must be enabled.
  options:
    a:
      en: |-
        Self-managed permissions need administration and execution roles in every account, and maintaining the accounts file with a Lambda function is custom work.
    b:
      en: |-
        One action per account and Region must be added by hand for every new account, which the company explicitly wants to avoid.
    d:
      en: |-
        The self-managed model accepts only account IDs as deployment targets, not an organization root or OU, and a weekly run would still leave new accounts waiting.
references:
  - title: CloudFormation StackSets deploy action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-StackSets.html
