id: dopc02-1a-lambda-canary-config
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company deploys new versions of an AWS Lambda function with AWS CodeDeploy, which shifts traffic on the function's live alias. For each release, the company wants 10% of the traffic to go to the new version first. If no problem is detected after 10 minutes, the remaining 90% of the traffic must shift to the new version in one step.

    Which deployment configuration should the company use?
body:
  options:
    - id: a
      text: CodeDeployDefault.LambdaLinear10PercentEvery10Minutes
    - id: b
      text: CodeDeployDefault.LambdaCanary10Percent10Minutes
    - id: c
      text: CodeDeployDefault.LambdaAllAtOnce
    - id: d
      text: CodeDeployDefault.LambdaCanary10Percent5Minutes
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A canary configuration shifts traffic in two increments: the first percentage, then the rest after the specified interval. LambdaCanary10Percent10Minutes sends 10% of the traffic to the new version and shifts the remaining 90% after 10 minutes.
  options:
    a:
      en: |-
        A linear configuration shifts 10% more traffic every 10 minutes, so the release takes about 100 minutes in ten equal steps.
    c:
      en: |-
        AllAtOnce shifts all the traffic to the new version immediately, without a first 10% step.
    d:
      en: |-
        This canary configuration shifts the remaining 90% after 5 minutes instead of 10.
references:
  - title: Working with deployment configurations in CodeDeploy - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
