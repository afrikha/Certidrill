id: dopc02-1b-guard-iac-policy-tests
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's platform team maintains AWS CloudFormation templates in a GitHub repository. An AWS CodeBuild project runs on every pull request, and an AWS CodePipeline pipeline deploys merged changes. A security standard says that every Amazon S3 bucket must have versioning enabled and must block public access. The security team wants a policy-as-code test that evaluates the templates in the pull request build, so that developers get feedback before any CloudFormation operation runs in any account. The team wants to write the policies in a declarative rule language and unit test the rules themselves.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy AWS Config managed rules for S3 bucket versioning and public access to every account through a conformance pack, with automatic remediation through Systems Manager Automation.
    - id: b
      text:
        en: |-
          Write AWS CloudFormation Guard rules for the S3 settings, test the rules with Guard's unit testing framework, and run Guard validation against the templates in the pull request build.
    - id: c
      text:
        en: |-
          Run cfn-lint against the templates in the pull request build and fail the build when cfn-lint reports any error.
    - id: d
      text:
        en: |-
          Add a manual approval action before the deploy stage so that a security engineer reviews each CloudFormation change set.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudFormation Guard is an open source policy-as-code tool with a declarative rule language that validates JSON or YAML data, including CloudFormation templates, and it has a built-in unit testing framework for the rules. Running it in the pull request build is shift-left testing: noncompliant templates are reported before any stack operation.
  options:
    a:
      en: |-
        AWS Config rules are detective controls that evaluate resources after they are deployed, so developers get no feedback in the pull request build.
    c:
      en: |-
        cfn-lint validates template syntax and property values; it does not provide Guard's declarative policy language or a unit testing framework for the company's rules.
    d:
      en: |-
        A manual review is not an automated test and happens only after merge, not in the pull request build.
references:
  - title: What is AWS CloudFormation Guard?
    url: https://docs.aws.amazon.com/cfn-guard/latest/ug/what-is-guard.html
