id: dopc02-1c-adopt-immutable-ec2
objective: "1.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in an Auto Scaling group. Today, AWS CodeDeploy installs each release on the running instances, and Patch Manager patches them every week. The instances have drifted apart, and new instances take 15 minutes to install software at launch. The company wants to adopt an immutable deployment pattern in which every release and every patch level is a new, tested image that replaces the running instances.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Keep CodeDeploy in-place deployments, and change the deployment configuration to CodeDeployDefault.OneAtATime to reduce the impact of failed releases.
    - id: b
      text:
        en: |-
          Build a new AMI that contains the patched operating system and the release with an EC2 Image Builder pipeline that the release pipeline starts.
    - id: c
      text:
        en: |-
          Create a Systems Manager State Manager association that reapplies the desired configuration to every instance every 30 minutes.
    - id: d
      text:
        en: |-
          Create a new launch template version with the new AMI, and start an instance refresh on the Auto Scaling group to replace the instances.
    - id: e
      text:
        en: |-
          Run the release installation with Systems Manager Run Command on all instances, and patch them in the same maintenance window.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      In an immutable pattern, the release and patches are baked into a new AMI, built and tested by an Image Builder pipeline, and instances are never modified after launch. A new launch template version and an instance refresh then replace the running instances, so the fleet is uniform and new instances start without installing software.
  options:
    a:
      en: |-
        In-place deployments modify running instances, which is the mutable pattern the company wants to leave.
    c:
      en: |-
        State Manager corrects drift on running instances, which is still a mutable pattern, and it does not shorten launch time.
    e:
      en: |-
        Run Command changes the running instances in place, which is a mutable pattern.
references:
  - title: "Use an instance refresh to update instances in an Auto Scaling group - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-instance-refresh.html
  - title: "Manage recipes in Image Builder - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-recipes.html
