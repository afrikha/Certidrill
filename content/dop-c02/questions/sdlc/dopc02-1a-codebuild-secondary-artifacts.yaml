id: dopc02-1a-codebuild-secondary-artifacts
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS CodeBuild action in an AWS CodePipeline pipeline compiles an application. Its buildspec has a single artifacts section that outputs one artifact. The company now wants the same build to produce two separate output artifacts: an application bundle named AppBundle for an AWS CodeDeploy action, and a packaged AWS CloudFormation template named InfraTemplate for a CloudFormation action in a later stage. The application must be built only once for each execution.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a second CodeBuild action to the same stage that runs the same buildspec and outputs the InfraTemplate artifact.
    - id: b
      text:
        en: |-
          Turn on the BatchEnabled and CombineArtifacts options of the CodeBuild action so that the action outputs both artifacts.
    - id: c
      text:
        en: |-
          Declare two output artifacts on the CodeBuild action of the pipeline, named AppBundle and InfraTemplate.
    - id: d
      text:
        en: |-
          Set the PrimarySource parameter of the CodeBuild action to AppBundle so that the action outputs the second artifact separately.
    - id: e
      text:
        en: |-
          Define secondary-artifacts in the buildspec with the identifiers AppBundle and InfraTemplate, each with its own list of files.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      When a CodeBuild action has more than one output artifact, every artifact must be defined as a secondary artifact in the buildspec, and the output artifact names in CodePipeline must match the artifact identifiers in the buildspec. The action declares both outputs, and later actions take AppBundle or InfraTemplate as their input artifact.
  options:
    a:
      en: |-
        A second action runs the build a second time, which the company wants to avoid.
    b:
      en: |-
        CombineArtifacts merges the outputs of the builds of a batch into one artifact; it does not split one build's output into two named artifacts.
    d:
      en: |-
        PrimarySource selects which input artifact contains the buildspec when an action has several inputs; it has no effect on output artifacts.
references:
  - title: AWS CodeBuild build and test action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodeBuild.html
  - title: Build specification reference for CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
