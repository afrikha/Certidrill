id: dopc02-1a-delivery-to-deployment
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company deploys an application to Amazon EC2 instances in an Auto Scaling group by using AWS CodeDeploy from an AWS CodePipeline pipeline. After each deployment to a staging environment, QA engineers test the release manually for two days and then approve a manual approval action that starts the production stage. An Amazon CloudWatch alarm already monitors the application's error rate in production. The company wants to move to continuous deployment and release several times a day. Production must stay protected: a release that raises the error rate must be reverted without human action.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a second manual approval action after the production deployment so that QA engineers confirm each release in production.
    - id: b
      text:
        en: |-
          Replace the manual QA testing and the manual approval action with an automated acceptance test action in AWS CodeBuild that runs against the staging environment.
    - id: c
      text:
        en: |-
          Collect the commits of each day and run the production stage once a day at a fixed time by using an Amazon EventBridge Scheduler schedule.
    - id: d
      text:
        en: |-
          Change the production deployment group to the CodeDeployDefault.AllAtOnce deployment configuration so that each release finishes faster.
    - id: e
      text:
        en: |-
          Add the error rate alarm to the production deployment group and enable automatic rollback when alarm thresholds are met.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Continuous deployment removes the manual approval, so automated acceptance tests must replace the manual QA gate to keep quality checks before production. Associating the alarm with the deployment group and enabling rollback when alarm thresholds are met makes CodeDeploy redeploy the last known good revision automatically when the alarm is activated.
  options:
    a:
      en: |-
        Another manual approval adds a human step, which is incompatible with continuous deployment and does not revert a bad release.
    c:
      en: |-
        A daily window batches changes and prevents several releases a day; it also does not revert a release that raises the error rate.
    d:
      en: |-
        Deploying to all instances at once makes a bad release affect the whole fleet and does nothing to revert it.
references:
  - title: Configure advanced options for a deployment group - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-groups-configure-advanced-options.html
  - title: What is Continuous Delivery? – Amazon Web Services
    url: https://aws.amazon.com/devops/continuous-delivery/
