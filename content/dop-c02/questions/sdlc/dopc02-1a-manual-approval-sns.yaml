id: dopc02-1a-manual-approval-sns
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline deploys an application to a staging environment and then to production. A new compliance rule requires a designated change approver to review each release before the production deployment starts. Approvers must receive an email when a release is waiting for them, and the decision must be recorded in the pipeline.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Add an AWS CodeBuild action before production that emails the approvers through Amazon SES and polls an Amazon DynamoDB table until an approver records a decision.
    - id: b
      text:
        en: |-
          Disable the transition into the production stage, and ask the approvers to enable the transition in the console after they review each release.
    - id: c
      text:
        en: |-
          Add a manual approval action at the start of the production stage that publishes to an Amazon SNS topic with the approvers' email subscriptions, and allow approvers to approve.
    - id: d
      text:
        en: |-
          Add an AWS Lambda invoke action that pauses the pipeline for 24 hours before production so that approvers can stop the execution if they find a problem.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A manual approval action stops the pipeline until someone with the required IAM permissions approves or rejects it, and the decision is part of the execution history. The action can publish to an SNS topic in the same Region as the pipeline, which sends the email notifications. If no one responds within seven days, the action fails.
  options:
    a:
      en: |-
        A custom email and polling solution duplicates what the manual approval action provides and adds code and resources to maintain.
    b:
      en: |-
        Disabling the transition blocks the release, but nobody is notified and no approval decision is recorded for the execution.
    d:
      en: |-
        A timed pause does not require an approval: releases go to production automatically after 24 hours even if nobody reviewed them.
references:
  - title: Add a manual approval action to a stage - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
