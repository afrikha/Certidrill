id: dopc02-1a-applicationstop-previous-revision
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS CodeDeploy for in-place deployments to Amazon EC2 instances. The last successful revision contains an ApplicationStop script with a wrong path, so the script now exits with an error. The team fixed the script in a new revision, but every deployment of the new revision fails at the ApplicationStop lifecycle event on all instances. The team wants to deploy the fixed revision without replacing the instances and with the least effort.

    What should the team do?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the timeout of the ApplicationStop hook in the AppSpec file of the new revision, and deploy the new revision again.
    - id: b
      text:
        en: |-
          Move the stop logic to a BeforeInstall hook in the new revision, remove the ApplicationStop hook from its AppSpec file, and deploy it again.
    - id: c
      text:
        en: |-
          Create a deployment of the new revision with the option to ignore ApplicationStop failures, such as --ignore-application-stop-failures.
    - id: d
      text:
        en: |-
          Redeploy the revision that was deployed before the faulty one so that its ApplicationStop script runs, and then deploy the new revision.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The CodeDeploy agent runs the ApplicationStop, BeforeBlockTraffic, and AfterBlockTraffic scripts from the AppSpec file of the previous successful deployment. When that script never succeeds, a deployment created with the ignore option continues despite the failure; after the fixed revision is deployed, later deployments use the fixed script.
  options:
    a:
      en: |-
        ApplicationStop runs from the previous successful revision, so changes to the new AppSpec file do not affect it, and a longer timeout does not fix a wrong path.
    b:
      en: |-
        The faulty ApplicationStop script of the previous successful revision still runs first, so the deployment still fails.
    d:
      en: |-
        Any new deployment, including a redeployment of an older revision, first runs the faulty ApplicationStop script of the last successful revision and fails the same way.
references:
  - title: Troubleshoot EC2/On-Premises deployment issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-deployments.html
  - title: AppSpec 'hooks' section - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html
