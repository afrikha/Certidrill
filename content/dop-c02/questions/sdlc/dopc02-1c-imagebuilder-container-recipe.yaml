id: dopc02-1c-imagebuilder-container-recipe
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses EC2 Image Builder build components to harden its AMIs. The company now wants hardened container base images too, built every month with the same build components, and pushed to an Amazon ECR repository from which the development teams pull. The images must be tested before they are published. The company wants a managed process with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the build components to a new image recipe, and configure the distribution settings of the pipeline to push the output to the Amazon ECR repository.
    - id: b
      text:
        en: |-
          Use AWS App2Container to containerize an instance launched from the hardened AMI, and push the resulting image to the Amazon ECR repository each month.
    - id: c
      text:
        en: |-
          Write a Dockerfile that reproduces the hardening steps, and build and push it with a scheduled AWS CodeBuild project that runs the tests in the post_build phase.
    - id: d
      text:
        en: |-
          Create a container recipe with a Dockerfile template, the build components, test components, and the ECR repository as target, and run it from a pipeline on a monthly schedule.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An Image Builder container recipe uses a Dockerfile template, the build and test components of the company, and a required target Amazon ECR repository. A pipeline with a monthly schedule builds, tests, and pushes the image, reusing the same components as the AMI recipes.
  options:
    a:
      en: |-
        An image recipe produces AMIs; only a container recipe produces a container image and pushes it to Amazon ECR.
    b:
      en: |-
        AWS App2Container is closed to new customers and containerizes existing applications; it does not build hardened base images from components.
    c:
      en: |-
        A separate Dockerfile duplicates the hardening steps outside the shared components and adds a build project to maintain.
references:
  - title: "Manage recipes in Image Builder - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-recipes.html
