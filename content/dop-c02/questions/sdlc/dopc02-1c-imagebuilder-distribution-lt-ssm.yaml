id: dopc02-1c-imagebuilder-distribution-lt-ssm
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company builds a golden AMI with an EC2 Image Builder pipeline in a tooling account. The AMI must be copied to two workload accounts. In each workload account, an Auto Scaling group uses a launch template, and the new AMI must become the default version of that launch template. Application teams in the workload accounts also read the current AMI ID from an AWS Systems Manager Parameter Store parameter. The company wants no custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Share the AMI with the workload accounts through launch permissions, and add an Amazon SNS topic to the pipeline that triggers an AWS Lambda function in each account to update the launch template and parameter.
    - id: b
      text:
        en: |-
          Distribute the AMI to the workload accounts, and change each launch template to reference the AMI through a Parameter Store parameter that the application teams update after each build.
    - id: c
      text:
        en: |-
          In the distribution settings, add the workload accounts as target accounts, a launch template configuration with setDefaultVersion for each account, and an SSM parameter configuration for each account.
    - id: d
      text:
        en: |-
          Distribute the AMI to the workload accounts, and run an AWS Systems Manager Automation runbook on a schedule in each account to find the newest AMI and update the launch template and parameter.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Image Builder distribution settings can copy the AMI to target accounts, create a new launch template version that uses it and make it the default for a given account, and create or update a Parameter Store parameter in the target account with the output AMI ID. A role named EC2ImageBuilderDistributionCrossAccountRole in each destination account, with the launch template and SSM permissions, lets the distribution do this without code.
  options:
    a:
      en: |-
        The SNS-triggered Lambda functions are custom code that the built-in distribution settings make unnecessary.
    b:
      en: |-
        Updating the parameter by hand after each build is a manual step, and it does not make the new AMI the default launch template version.
    d:
      en: |-
        A scheduled runbook adds delay and custom logic to pick the newest AMI, which the distribution settings already handle at build time.
references:
  - title: "Distribution - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/APIReference/API_Distribution.html
  - title: "Set up cross-account AMI distribution with Image Builder - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/cross-account-dist.html
