id: dopc02-1d-cloudfront-staging-distribution
objective: "1.4.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company serves its website through an Amazon CloudFront distribution with a custom domain name. The DevOps team often changes cache behaviors and origin settings, and a recent change to the cache key caused errors for all viewers. The team now wants to test each configuration change on about 5% of real viewer requests, keep each viewer on the same configuration for the whole session, and then apply the change to all viewers without changing DNS records.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a second distribution with the changed configuration, and use Route 53 weighted alias records that send 95% of the queries to the current distribution and 5% to the new one.
    - id: b
      text:
        en: |-
          Add a Lambda@Edge viewer request function that sends a random 5% of the requests to a second origin that serves the changed configuration.
    - id: c
      text:
        en: |-
          Create a staging distribution and a continuous deployment policy with weight-based traffic of 5% and session stickiness, and promote the staging configuration after validation.
    - id: d
      text:
        en: |-
          Create a staging distribution and a continuous deployment policy with header-based traffic that uses an aws-cf-cd- header, and promote the staging configuration after validation.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CloudFront continuous deployment routes a share of the primary distribution's viewer requests to a staging distribution that holds the new configuration. A weight-based policy with session stickiness keeps each viewer on the same distribution during a session, and after validation the staging configuration is promoted to the primary distribution, with no DNS change.
  options:
    a:
      en: |-
        Weighted DNS records change the DNS configuration and depend on resolver caching, so they neither control the share of requests precisely nor keep a viewer on one configuration.
    b:
      en: |-
        A second origin only changes where requests are fetched; cache behaviors and the cache key still come from the single distribution, and the function is custom code.
    d:
      en: |-
        Header-based routing sends only requests that carry the specific header, which suits internal testing but not a sample of real viewer traffic.
references:
  - title: Learn how continuous deployment works - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/understanding-continuous-deployment.html
  - title: Use CloudFront continuous deployment to safely test CDN configuration changes - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/continuous-deployment.html
