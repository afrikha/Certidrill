id: dopc02-1d-ib-lifecycle-policy
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses EC2 Image Builder pipelines to build a new AMI every night for each of 12 image recipes. The distribution settings copy each AMI to four Regions and share it with several accounts. Amazon EBS snapshot costs keep growing because old AMIs are never removed. The company wants to keep only the five newest images of each recipe version, deregister the older AMIs and delete their snapshots everywhere they were distributed, and never remove an AMI that launched an instance in the last 30 days. The solution must be automated and require the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an EventBridge scheduled rule that runs a Lambda function every day to list the AMIs of each recipe, keep the five newest, and deregister the others and delete their snapshots in each Region.
    - id: b
      text:
        en: |-
          Create Recycle Bin retention rules for AMIs and EBS snapshots in each Region with a retention period of 30 days, and tag the AMIs that launched instances in the last 30 days.
    - id: c
      text:
        en: |-
          Create an Image Builder lifecycle policy with a deprecation rule for images older than 5 days, and add an exclusion rule for AMIs that launched an instance in the last 30 days.
    - id: d
      text:
        en: |-
          Create an Image Builder lifecycle policy with a count-based delete rule that retains five images and deletes AMIs and snapshots, and add an exclusion rule for AMIs that launched an instance in the last 30 days.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Image Builder lifecycle policies run daily and can delete image resources by count (keep the newest N images per recipe version), deregistering the output AMIs and deleting their snapshots, including copies distributed to other Regions and accounts. A last-launched exclusion rule protects AMIs that launched an instance within the specified period, with no custom code.
  options:
    a:
      en: |-
        The scheduled function works but is custom code that must handle every Region, every shared account and the launch-time check, while a managed lifecycle policy does the same.
    b:
      en: |-
        Recycle Bin only keeps resources after they are deleted so that they can be restored; it never deletes old AMIs, so it does not reduce snapshot costs.
    c:
      en: |-
        Deprecation only hides AMIs from general searches; the AMIs and their snapshots remain, so storage costs keep growing.
references:
  - title: How lifecycle management rules work for Image Builder image resources - EC2 Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/image-lifecycle-rules.html
  - title: Manage lifecycle policies for Image Builder images - EC2 Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-image-lifecycles.html
