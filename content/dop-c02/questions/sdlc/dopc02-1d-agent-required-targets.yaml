id: dopc02-1d-agent-required-targets
objective: "1.4.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is standardizing its releases on AWS CodeDeploy. The workloads are a Java application on Amazon EC2 instances in an Auto Scaling group, a .NET application on on-premises Windows servers, AWS Lambda functions deployed with AWS SAM, an Amazon ECS service on EC2 container instances that uses blue/green deployments, and an Amazon ECS service on AWS Fargate. The platform team must decide where to install and maintain the CodeDeploy agent.

    For which workloads must the team install the CodeDeploy agent? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The Java application on EC2 instances in the Auto Scaling group
    - id: b
      text:
        en: |-
          The Lambda functions deployed with AWS SAM
    - id: c
      text:
        en: |-
          The .NET application on the on-premises Windows servers
    - id: d
      text:
        en: |-
          The ECS service on EC2 container instances with blue/green deployments
    - id: e
      text:
        en: |-
          The ECS service on AWS Fargate
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      The CodeDeploy agent is used only by the EC2/On-Premises compute platform: it runs on each instance or server, downloads the revision, and runs the AppSpec hook scripts. EC2 instances in Auto Scaling groups and registered on-premises servers both need it.
  options:
    b:
      en: |-
        Lambda deployments shift traffic between function versions behind an alias; CodeDeploy needs no agent, and validation runs in Lambda hook functions.
    d:
      en: |-
        ECS deployments shift traffic between task sets through the load balancer; hooks are Lambda functions, so container instances need no CodeDeploy agent, whatever the launch type.
    e:
      en: |-
        ECS deployments on Fargate are managed by CodeDeploy and Amazon ECS without any agent on the infrastructure.
references:
  - title: AppSpec 'hooks' section - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html
  - title: Configure an Amazon EC2 instance to work with CodeDeploy - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/instances-ec2-configure.html
