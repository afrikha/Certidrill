id: dopc02-1c-beanstalk-immutable
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application in an AWS Elastic Beanstalk environment with a load balancer and 12 instances. The environment uses the Rolling deployment policy. A recent deployment failed halfway, and the environment was left with some instances on the new version and some on the old version until an engineer redeployed the previous version. The company requires that a failed deployment leave the existing instances untouched and that the environment keep full capacity during deployments.

    Which deployment policy will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Rolling with additional batch
    - id: b
      text:
        en: |-
          All at once
    - id: c
      text:
        en: |-
          Immutable
    - id: d
      text:
        en: |-
          Rolling with a smaller batch size
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An Immutable deployment launches a full set of new instances in a separate Auto Scaling group alongside the existing ones. If the new instances fail health checks, they are terminated and the original instances, never modified, keep serving traffic at full capacity.
  options:
    a:
      en: |-
        The extra batch keeps capacity, but the existing instances are still updated batch by batch, so a failure leaves mixed versions.
    b:
      en: |-
        All at once updates every existing instance at the same time, with downtime and no protection against a failed deployment.
    d:
      en: |-
        A smaller batch still updates the existing instances and reduces capacity during each batch.
references:
  - title: "Deployment policies and settings - AWS Elastic Beanstalk"
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.rolling-version-deploy.html
