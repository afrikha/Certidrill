id: dopc02-1d-agent-cfn-init-order
objective: "1.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company provisions an Auto Scaling group with AWS CloudFormation. The launch template uses a custom AMI with the AWS CodeDeploy agent preinstalled and enabled to start at boot. At launch, cfn-init installs the language runtime and writes configuration files, which takes about 10 minutes. A CodeDeploy deployment group targets the Auto Scaling group. Launch deployments to new instances often fail in the ApplicationStart hook because the runtime is not installed yet. The company wants new instances to receive the application reliably without adding fixed delays to the deployment.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the timeout of the ApplicationStart hook in the AppSpec file to 3,600 seconds so that the script waits for the runtime.
    - id: b
      text:
        en: |-
          Configure the AMI so that the CodeDeploy agent is stopped at boot, and start the agent as the last command of the cfn-init configuration.
    - id: c
      text:
        en: |-
          Add a custom launch lifecycle hook to the Auto Scaling group that waits until cfn-init sends a cfn-signal before the CodeDeploy lifecycle hook runs.
    - id: d
      text:
        en: |-
          Remove the agent from the AMI, and install it with a user data command that runs before cfn-init starts.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CodeDeploy requires the order: instance starts, all cfn-init bootstrapping completes, then the agent starts and deploys the latest revision. With the agent preinstalled in the AMI, AWS recommends keeping it stopped at creation and starting it as the final step of cfn-init, so the launch deployment begins only when the instance is ready.
  options:
    a:
      en: |-
        A longer timeout does not make the script wait for the runtime; a start command that fails because the runtime is missing still fails at once, and the approach relies on delays.
    c:
      en: |-
        The order of custom Auto Scaling lifecycle hooks relative to the CodeDeploy hook cannot be predetermined, so the launch deployment can still start first.
    d:
      en: |-
        Installing and starting the agent before cfn-init makes the agent available even earlier, so the deployment still races the bootstrap scripts.
references:
  - title: Integrating CodeDeploy with Amazon EC2 Auto Scaling - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/integrations-aws-auto-scaling.html
  - title: Troubleshoot Amazon EC2 Auto Scaling issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-auto-scaling.html
