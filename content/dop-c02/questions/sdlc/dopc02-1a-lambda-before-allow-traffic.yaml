id: dopc02-1a-lambda-before-allow-traffic
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company exposes an AWS Lambda function through an Amazon API Gateway API that invokes the function's live alias. AWS CodeDeploy shifts traffic to each new version with a canary deployment configuration. Before any customer request reaches a new version, an integration test suite must invoke that version directly and verify the results. If the tests fail, the deployment must stop and no customer request must have reached the new version.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an AfterAllowTraffic hook to the AppSpec file that invokes a Lambda function that runs the test suite against the new version.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on the function's Errors metric, add it to the deployment group, and enable automatic rollback when the alarm is activated.
    - id: c
      text:
        en: |-
          Add a ValidateService hook to the AppSpec file that runs a script with the test suite and returns a non-zero exit code when a test fails.
    - id: d
      text:
        en: |-
          Add a BeforeAllowTraffic hook to the AppSpec file that invokes a Lambda function that runs the test suite and reports the result to CodeDeploy.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      For Lambda deployments, the BeforeAllowTraffic hook runs before any traffic shifts to the new function version. The hook function runs the tests and calls PutLifecycleEventHookExecutionStatus with Succeeded or Failed; a Failed status, or no status within one hour, fails the deployment before customers reach the new version.
  options:
    a:
      en: |-
        AfterAllowTraffic runs after all the traffic has shifted to the new version, so customers would already have reached it.
    b:
      en: |-
        An alarm reacts to errors produced by real traffic, so customers would already have reached the new version before the rollback.
    c:
      en: |-
        ValidateService is a lifecycle event of EC2/On-Premises deployments; Lambda deployments support only the BeforeAllowTraffic and AfterAllowTraffic hooks.
references:
  - title: AppSpec 'hooks' section - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html
