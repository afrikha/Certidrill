id: dopc02-1d-health-constraints-skipped
objective: "1.4.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company creates an AWS CodeDeploy deployment group for 10 new Amazon EC2 instances in a private subnet. The instances have an instance profile that allows them to read the revision bucket. The first deployment fails with a HEALTH_CONSTRAINTS error, and every lifecycle event of every instance shows the status Skipped.

    Which issues could cause this failure? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The ValidateService script of the revision returns a nonzero exit code on every instance.
    - id: b
      text:
        en: |-
          The deployment group uses the CodeDeployDefault.AllAtOnce deployment configuration.
    - id: c
      text:
        en: |-
          The CodeDeploy agent is not installed on the instances or is not running.
    - id: d
      text:
        en: |-
          The health check path of the load balancer target group returns HTTP 404 for the application.
    - id: e
      text:
        en: |-
          The private subnet has no route to a NAT gateway and no VPC endpoints for CodeDeploy.
answer: { optionIds: [c, e] }
explanation:
  correct:
    en: |-
      Lifecycle events are skipped when the agent never picks up the deployment. Documented causes include an agent that is not installed or not running and instances that cannot reach CodeDeploy and Amazon S3 over HTTPS, for example a private subnet without a NAT gateway or VPC endpoints.
  options:
    a:
      en: |-
        A failing script makes the ValidateService event fail, after the earlier events have run; the events would not all be skipped.
    b:
      en: |-
        AllAtOnce only controls how many instances are deployed at the same time; it does not prevent the agent from running the events.
    d:
      en: |-
        A failing health check makes the traffic events, such as AllowTraffic, fail after the revision is installed; it does not skip every event.
references:
  - title: Troubleshoot EC2/On-Premises deployment issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-deployments.html
