id: dopc02-1a-trigger-release-tags
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores an application in a GitHub repository that is connected to two AWS CodePipeline pipelines of type V2 through AWS CodeConnections. Today, both pipelines start on every push to the main branch. The staging pipeline must keep running on every push to main. The production pipeline must run only when a release manager pushes a Git tag whose name starts with release-, such as release-2.3.0, and must deploy the commit that the tag points to.

    How should the company configure the production pipeline?
body:
  options:
    - id: a
      text:
        en: |-
          Set the BranchName parameter of the source action to release-* so that the action detects pushes of release tags.
    - id: b
      text:
        en: |-
          Set DetectChanges to false on the source action, and have the release manager start the pipeline manually with the tag name as a pipeline variable.
    - id: c
      text:
        en: |-
          Add a trigger to the source action with a push filter whose tags include pattern is release-*, without a branch filter.
    - id: d
      text:
        en: |-
          Add a trigger to the source action with a pull request filter for the Closed event on the main branch.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Triggers with filters, available in V2 pipelines, can start an execution on a push of Git tags that match include and exclude patterns. The execution uses the commit that was pushed, so the release manager's tag push deploys the tagged commit, while the staging pipeline keeps its branch trigger.
  options:
    a:
      en: |-
        BranchName identifies a single branch for change detection; it does not match tags or glob patterns.
    b:
      en: |-
        A manual start is not triggered by the tag push, and a pipeline variable does not select which commit the source action fetches.
    d:
      en: |-
        A closed pull request trigger starts the pipeline on merges into main, not on release tags.
references:
  - title: Add trigger with code push or pull request event types - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-filter.html
