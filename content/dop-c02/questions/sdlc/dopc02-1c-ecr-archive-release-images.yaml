id: dopc02-1c-ecr-archive-release-images
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company must keep every production release image in Amazon ECR for 2 years for audit purposes. Release images are tagged with the prefix `release-`. Release images that have not been pulled for 90 days are almost never pulled again, and the company accepts a delay of up to 1 hour before such an image can be used. Untagged images are leftovers from builds and must be deleted 7 days after they are pushed. The company wants to reduce storage costs by using only ECR features.

    Which combination of lifecycle policy rules will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          A rule that selects tagged images that match `release-*` and transitions images that have not been pulled for 90 days to the archive storage class.
    - id: b
      text:
        en: |-
          A rule that selects tagged images that match `release-*` and expires images that were pushed more than 90 days ago.
    - id: c
      text:
        en: |-
          A rule that selects images with tag status `any` and transitions every image that is older than 7 days to the archive storage class.
    - id: d
      text:
        en: |-
          A rule that selects untagged images and expires images that were pushed more than 7 days ago.
    - id: e
      text:
        en: |-
          A rule that selects tagged images that match `release-*` and keeps only the 90 most recent images by expiring the rest.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      ECR lifecycle rules can transition images to the low-cost archive storage class based on the time since the last pull; archived images are kept and can be restored to standard storage, typically within 20 minutes, when needed. A separate rule for untagged images with `sinceImagePushed` set to 7 days expires the build leftovers.
  options:
    b:
      en: |-
        Expiring release images after 90 days deletes them before the 2-year audit retention ends.
    c:
      en: |-
        This rule would archive recent release images and untagged leftovers too, and it does not delete the untagged images after 7 days.
    e:
      en: |-
        Keeping only a count of images can delete release images younger than 2 years and does not reduce the cost of the images it keeps.
references:
  - title: "Lifecycle policy properties in Amazon ECR - Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/lifecycle_policy_parameters.html
  - title: "Archiving an image in Amazon ECR - Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/archive_restore_image.html
