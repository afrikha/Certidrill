id: dopc02-1b-invoke-ecs-test-traffic-hook
objective: "1.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys an Amazon ECS service with AWS CodeDeploy blue/green deployments from AWS CodePipeline. The Application Load Balancer has a production listener on port 443 and a test listener on port 8443. The QA team has written API tests as an AWS Lambda function. The tests must run against the replacement task set through the test listener before any production traffic reaches it, and a failure must roll back the deployment automatically. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Register the function for the BeforeInstall hook in the AppSpec file, and have it report Failed to CodeDeploy when a test fails.
    - id: b
      text:
        en: |-
          Register the function for the AfterAllowTestTraffic hook in the AppSpec file, and have it report Failed to CodeDeploy when a test fails.
    - id: c
      text:
        en: |-
          Register the function for the AfterAllowTraffic hook in the AppSpec file, and have it report Failed to CodeDeploy when a test fails.
    - id: d
      text:
        en: |-
          Add a Lambda invoke action that runs the function after the CodeDeploy action, and add a stage that redeploys the previous task definition when it fails.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AfterAllowTestTraffic runs after the test listener starts serving traffic to the replacement task set and before production traffic is shifted. The function reports its result with PutLifecycleEventHookExecutionStatus, and a Failed status rolls the deployment back.
  options:
    a:
      en: |-
        BeforeInstall runs before the replacement task set exists, so there is nothing to test, and a rollback is not possible at that point.
    c:
      en: |-
        AfterAllowTraffic runs after production traffic is already served by the replacement task set.
    d:
      en: |-
        After the CodeDeploy action completes, production traffic has already shifted, and a redeploy stage adds work that CodeDeploy rollback already provides.
references:
  - title: AppSpec 'hooks' section - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html
