id: dopc02-1c-codebuild-lambda-compute-fit
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants to cut the start-up time of its AWS CodeBuild projects by moving them from Amazon EC2 compute to AWS Lambda compute. The company will move only the projects that can run on Lambda compute without any change to what they do. All projects use curated CodeBuild images and finish in less than 10 minutes.

    Which project can the company move to Lambda compute?
body:
  options:
    - id: a
      text:
        en: |-
          A Node.js project that runs `npm ci` with a local custom cache for the npm cache folder, and publishes a package to AWS CodeArtifact.
    - id: b
      text:
        en: |-
          A Python project that runs `sam build` and `sam package` on the public network, and uploads the packaged template as its artifact.
    - id: c
      text:
        en: |-
          A Java project that runs in a VPC so that it can download dependencies from AWS CodeArtifact through interface VPC endpoints.
    - id: d
      text:
        en: |-
          A Go project that installs extra system libraries with `yum install` in the install phase before it compiles the code.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Lambda compute runs curated images that include the AWS CLI, AWS SAM CLI, and Python, with builds of up to 15 minutes. A SAM packaging project that needs no root access, no cache, and no VPC fits these limits, so it can move without change.
  options:
    a:
      en: |-
        Lambda compute does not support caching, so the local custom cache configuration would have to be removed.
    c:
      en: |-
        Lambda compute does not support VPC connectivity, so the project could no longer reach the interface endpoints.
    d:
      en: |-
        Lambda compute does not support tools that require root permissions, such as `yum`.
references:
  - title: "Run builds on AWS Lambda compute - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/lambda.html
