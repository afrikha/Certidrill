id: dopc02-1c-artifact-bucket-noncurrent
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipelines store their artifacts in a central Amazon S3 artifact bucket that has S3 Versioning enabled. To control costs, an administrator added an S3 Lifecycle rule with an Expiration action of 30 days for all objects. Three months later, the storage of the bucket still grows every week. The list of object versions shows many versions that are older than 30 days. The pipelines never need artifacts that are older than 30 days.

    Which change will stop the storage growth with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Add a transition to the S3 Glacier Deep Archive storage class after 30 days to the existing lifecycle rule, so that old artifact versions cost less to store.
    - id: b
      text:
        en: |-
          Suspend S3 Versioning on the bucket, so that the existing Expiration action permanently deletes the objects instead of adding delete markers.
    - id: c
      text:
        en: |-
          Add a NoncurrentVersionExpiration action to the existing lifecycle rule, so that noncurrent versions are permanently deleted a few days after they become noncurrent.
    - id: d
      text:
        en: |-
          Add an AbortIncompleteMultipartUpload action with a value of 7 days to the existing lifecycle rule, so that parts of failed uploads are removed.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In a versioning-enabled bucket, the Expiration action does not delete data: it adds a delete marker, and the previous current version becomes noncurrent and is kept. NoncurrentVersionExpiration permanently removes noncurrent versions after the specified number of days, which stops the growth without any manual cleanup.
  options:
    a:
      en: |-
        A colder storage class lowers the price per GB, but the noncurrent versions are still kept, so the stored volume keeps growing.
    b:
      en: |-
        Suspending versioning does not remove the noncurrent versions that already exist, so the old artifacts stay in the bucket.
    d:
      en: |-
        This action only cleans up parts of incomplete multipart uploads; it does not touch the noncurrent object versions that use the storage.
references:
  - title: "Examples of S3 Lifecycle configurations - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-configuration-examples.html
