id: dopc02-1c-lambda-image-package-size
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data science team deploys a Python AWS Lambda function as a .zip file archive through an AWS CodePipeline pipeline. A new release adds machine learning libraries, and the unzipped deployment package, including its layers, is now 1.4 GB. The deployment of the new release fails. The team must keep running the code on Lambda and must not add code that downloads dependencies at run time. The team wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Split the libraries across five Lambda layers so that each layer stays below the size quota of a single .zip file archive, and attach the layers to the function.
    - id: b
      text:
        en: |-
          Upload the .zip file archive to an Amazon S3 bucket in the build stage, and point the function's code configuration to the S3 object instead of uploading it directly.
    - id: c
      text:
        en: |-
          Increase the ephemeral storage of the function to 10,240 MB, and copy the libraries from an Amazon S3 bucket to /tmp when the execution environment initializes.
    - id: d
      text:
        en: |-
          Change the build stage to produce a container image, push the image to Amazon ECR, and deploy the function from the container image instead of the .zip file archive.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A .zip deployment package is limited to 250 MB unzipped, and that limit includes all layers. A container image function can be up to 10 GB uncompressed, including all layers, so building an image and deploying it from Amazon ECR keeps the code on Lambda without run-time downloads.
  options:
    a:
      en: |-
        The 250 MB unzipped quota applies to the function and all of its layers together, so splitting the libraries into layers does not help.
    b:
      en: |-
        Uploading through Amazon S3 only lifts the 50 MB limit on a directly uploaded .zip file; the 250 MB unzipped limit still applies.
    c:
      en: |-
        Downloading the libraries into /tmp at initialization is the run-time download logic that the team must avoid.
references:
  - title: "Lambda quotas - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
