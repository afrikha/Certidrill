id: dopc02-1c-codeartifact-shared-domain
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations with one AWS account per product team. Each team wants to create and administer its own AWS CodeArtifact repositories in its own account. The platform team requires that package assets used by several teams be stored only once, that all assets be encrypted with a single AWS KMS key, and that the platform team control centrally which accounts can create repositories and who can configure connections to public repositories.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CodeArtifact domain with the same name in every team account, encrypt each domain with the same multi-Region KMS key, and copy shared packages between the domains.
    - id: b
      text:
        en: |-
          Create one domain and one repository in a shared services account, and give each team account a repository policy that allows it to publish and read packages.
    - id: c
      text:
        en: |-
          Create a domain in each team account, and add the repositories of the other teams' domains as upstream repositories so that shared packages are fetched instead of copied.
    - id: d
      text:
        en: |-
          Create one domain in a shared services account, attach a domain policy that grants CreateRepository to the team accounts, and have the teams create repositories in their accounts in that domain.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A domain stores each asset once, whatever the number of repositories that contain it, and encrypts all assets with a single KMS key. A repository can be owned by a different account than the domain owner when the domain policy, set with PutDomainPermissionsPolicy, grants that account CreateRepository. The domain policy also lets the platform team control access and external connections centrally.
  options:
    a:
      en: |-
        Each domain stores its own copy of the assets, so shared packages are stored several times, and policies are no longer central.
    b:
      en: |-
        A single repository in the shared account does not give each team its own repositories in its own account.
    c:
      en: |-
        Upstream repositories must be in the same domain, and separate domains do not deduplicate storage.
references:
  - title: "Domain overview - CodeArtifact"
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/domain-overview.html
  - title: "Add or remove upstream repositories - CodeArtifact"
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/repo-upstream-add.html
