id: dopc02-1d-agent-install-state-manager
objective: "1.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company plans to use AWS CodeDeploy for 600 Amazon EC2 instances that run Amazon Linux and Windows Server. All instances are managed nodes in AWS Systems Manager, with a current SSM Agent and an instance profile that includes the AmazonSSMManagedInstanceCore policy. The company must install the CodeDeploy agent on every existing and future instance and keep the agent updated to new versions. The company wants the LEAST operational effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Install the CodeDeploy agent in the AMIs with an EC2 Image Builder component, and rebuild the AMIs every month to pick up new agent versions.
    - id: b
      text:
        en: |-
          Add a script to the user data of every launch template that downloads the CodeDeploy agent installer from the Regional resource kit bucket and runs it.
    - id: c
      text:
        en: |-
          Create a CodeDeploy deployment group that targets all instances by tag, and deploy a revision whose AppSpec hooks install the latest CodeDeploy agent.
    - id: d
      text:
        en: |-
          Create a State Manager association that runs AWS-ConfigureAWSPackage to install the CodeDeploy agent Distributor package on a schedule, targeting the instances by tag.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CodeDeploy publishes its agent as a Systems Manager Distributor package. A State Manager association with the AWS-ConfigureAWSPackage document installs the package on a schedule, so it reaches existing instances, new instances that carry the target tag, and new agent versions without extra work.
  options:
    a:
      en: |-
        A baked agent covers only instances launched from new AMIs; existing instances are not updated, and the agent stays at the version of the last build between rebuilds.
    b:
      en: |-
        User data runs only at the first boot of new instances, so existing instances get nothing and installed agents are never updated.
    c:
      en: |-
        A CodeDeploy deployment needs a running CodeDeploy agent on the instance, so it cannot install the first agent.
references:
  - title: Install the CodeDeploy agent using AWS Systems Manager - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/codedeploy-agent-operations-install-ssm.html
  - title: Install or update Distributor packages - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/distributor-working-with-packages-deploy.html
