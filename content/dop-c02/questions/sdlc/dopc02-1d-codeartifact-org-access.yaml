id: dopc02-1d-codeartifact-org-access
objective: "1.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 80 AWS accounts in AWS Organizations, and AWS Control Tower Account Factory creates new accounts every week. A shared-services account owns an AWS CodeArtifact domain with a repository named release. The CI roles in every account of the organization must be able to download packages from release, and no principal outside the organization may have access. A CloudFormation StackSet already deploys the required CodeArtifact and AWS STS permissions to the CI roles of every account, including new accounts. The company wants the LEAST operational overhead as accounts are added.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a domain policy statement that allows codeartifact:GetAuthorizationToken and a repository policy statement on release that allows read actions, both with Principal "*" and the condition aws:PrincipalOrgID equal to the organization ID.
    - id: b
      text:
        en: |-
          Add each account's root principal to the domain policy and the repository policy, and invoke a Lambda function from an EventBridge rule on new accounts that appends the new account ID to both policies.
    - id: c
      text:
        en: |-
          Attach a service control policy (SCP) to the organization root that allows codeartifact:GetAuthorizationToken and codeartifact:ReadFromRepository on the domain and repository ARNs.
    - id: d
      text:
        en: |-
          Create an IAM Identity Center permission set with the CodeArtifact read actions, assign it to every account in the organization, and leave the domain and repository without resource policies.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Cross-account access to CodeArtifact needs an allow in a resource policy: GetAuthorizationToken on the domain and ReadFromRepository on the repository. With the aws:PrincipalOrgID condition, the statements cover every current and future account of the organization and exclude all other principals, so nothing changes when accounts are added.
  options:
    b:
      en: |-
        Listing account IDs works but requires custom automation to keep both policies up to date for every new account, which is more overhead than one organization condition.
    c:
      en: |-
        SCPs only limit the maximum permissions of accounts; they never grant access, and they do not replace the resource policies required for cross-account access.
    d:
      en: |-
        Permission sets grant access to human users who sign in through IAM Identity Center, not to CI roles, and cross-account access still needs the domain and repository resource policies.
references:
  - title: Domain policies - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/domain-policies.html
  - title: Repository policies - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/repo-policies.html
