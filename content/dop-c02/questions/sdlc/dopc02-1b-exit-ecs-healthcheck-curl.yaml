id: dopc02-1b-exit-ecs-healthcheck-curl
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an API on Amazon ECS with AWS Fargate. The essential container of the task definition has a container health check whose command is ["CMD-SHELL", "curl http://localhost:8080/health"], with an interval of 30 seconds and 3 retries. When the API cannot reach its database, the /health endpoint returns HTTP 503. During an outage last week, the tasks remained HEALTHY for 2 hours, and ECS did not replace them. The company wants ECS to consider the container unhealthy whenever the endpoint returns an HTTP error status, without changing the application code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the retries value to 10 and reduce the interval to 5 seconds so that ECS checks the endpoint more often.
    - id: b
      text:
        en: |-
          Set the startPeriod of the health check to 0 so that failed checks count toward the retries immediately after the task starts.
    - id: c
      text:
        en: |-
          Mark the container as non-essential so that ECS evaluates its health check independently of the task status.
    - id: d
      text:
        en: |-
          Change the command to ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"].
answer: { optionId: d }
explanation:
  correct:
    en: |-
      ECS treats an exit code of 0 as a successful health check and any non-zero exit code as a failure. Without -f, curl exits with 0 whenever it receives an HTTP response, even a 503; with -f it returns an error for HTTP error statuses, and || exit 1 guarantees a non-zero code, so the container and therefore the task become UNHEALTHY.
  options:
    a:
      en: |-
        The command still exits with 0 on a 503 response, so more frequent checks still succeed.
    b:
      en: |-
        The start period only affects checks during startup; the checks pass anyway because curl exits with 0.
    c:
      en: |-
        Only essential containers with a health check determine the task's health, so a non-essential container would never make the task unhealthy.
references:
  - title: Determine Amazon ECS task health using container health checks - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/healthcheck.html
