id: dopc02-1a-build-once-promote
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has one AWS CodePipeline pipeline with dev, test, and prod stages for a containerized service on Amazon ECS. Each stage contains an AWS CodeBuild action that compiles the source code and builds a container image tagged with the stage name, followed by an ECS deploy action. Several production incidents were traced to library versions that differed between the image that passed the tests in the test stage and the image that was deployed in the prod stage. Endpoints and connection settings differ between the environments. The company wants the image that passes testing to be exactly the image that runs in production.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Pin every dependency version in the build files, and keep a build action in each stage so that each environment receives an image built with the same dependency versions.
    - id: b
      text:
        en: |-
          Create a Git tag when the test stage succeeds, and make the prod stage build its image from that tag so that production uses the same commit as the tested image.
    - id: c
      text:
        en: |-
          Build the image once in a build stage, tag it with the commit ID, and deploy that image URI in every stage, with the environment settings read from Parameter Store.
    - id: d
      text:
        en: |-
          Turn on tag immutability for the Amazon ECR repository so that the image tag of each stage cannot be overwritten after the build action pushes it.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Building once and promoting the same artifact through the stages guarantees that production runs the exact image that passed the tests. The build action outputs the image URI (for example in an imagedefinitions.json file) that every ECS deploy action consumes, and the settings that differ per environment stay outside the image, for example in Systems Manager Parameter Store.
  options:
    a:
      en: |-
        Each stage still rebuilds the image, so base image updates, operating system packages, or transitive dependencies can still differ between the tested image and the production image.
    b:
      en: |-
        The same commit rebuilt later can still produce a different image, because the build pulls base images and dependencies again at a different time.
    d:
      en: |-
        Immutable tags prevent overwriting a tag, but each stage still builds and pushes its own image, so the images can differ.
references:
  - title: Image definitions file reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/file-reference.html
  - title: CodeStarSourceConnection for Bitbucket Cloud, GitHub, GitHub Enterprise Server, GitLab.com, and GitLab self-managed actions - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodestarConnectionSource.html
