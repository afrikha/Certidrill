id: dopc02-1b-ui-test-gui-workflow
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company deploys its web storefront to a staging environment through AWS CodePipeline. After a recent release, the login form rendered correctly but its Submit button no longer worked, and no existing test detected the problem. The pipeline already runs unit tests in AWS CodeBuild and an Amazon Inspector source code scan. The company wants an automated test that fills in the login form in a browser, submits it, and verifies the text of the page that follows. The company wants to write as little test code as possible.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add more unit tests for the login controller and publish their results in a CodeBuild test report in JUnit XML format.
    - id: b
      text:
        en: |-
          Create a CloudWatch Synthetics canary from the GUI workflow builder blueprint with Input text, Click, and Verify text steps, and run it once after each staging deployment.
    - id: c
      text:
        en: |-
          Create a CloudWatch Synthetics canary from the heartbeat monitoring blueprint that loads the login page URL after each staging deployment and stores a screenshot of the page.
    - id: d
      text:
        en: |-
          Run a Distributed Load Testing on AWS test that sends HTTP POST requests with test credentials to the login endpoint after each staging deployment.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The problem is a user interface defect, so it needs a UI test that drives a real browser. The CloudWatch Synthetics GUI workflow builder blueprint generates a canary that performs actions such as Input text, Click, and Verify text without hand-written browser code, and a canary can run once instead of on a schedule.
  options:
    a:
      en: |-
        Unit tests check code in isolation and never interact with the rendered page in a browser, so they would not catch a button that does not work.
    c:
      en: |-
        The heartbeat blueprint only loads a URL and captures a screenshot and HAR file; it does not fill in or submit the form, so the broken button would go unnoticed.
    d:
      en: |-
        A load test sends HTTP requests directly to endpoints to measure capacity; it does not exercise the browser UI, so a broken button is invisible to it.
references:
  - title: Using canary blueprints - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries_Blueprints.html
  - title: Synthetic monitoring (canaries) - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries.html
