id: dopc02-1c-imagebuilder-scan-gate
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company builds AMIs with an EC2 Image Builder pipeline and distributes them to its workload accounts. Amazon Inspector is activated in the build account. A new security policy states that an AMI with any finding of HIGH or CRITICAL severity must never be distributed, while AMIs with MEDIUM or lower findings can be distributed. The company wants to use built-in features only.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on image scanning in the pipeline with the TEST_INSTANCE_CVE scan type, so that Amazon Inspector scans the test instance and records the findings with the image.
    - id: b
      text:
        en: |-
          Turn on image scanning in the pipeline with the ON_DEMAND_AMI_CVE scan type and a scan result condition whose maximum severity label is MEDIUM.
    - id: c
      text:
        en: |-
          Turn on image scanning in the pipeline with the ON_DEMAND_AMI_CVE scan type and a scan result condition whose maximum severity label is HIGH.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule on Amazon Inspector findings that invokes an AWS Lambda function to deregister AMIs with HIGH or CRITICAL findings.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With an on-demand AMI scan, a scan result condition makes the image fail in the test stage, so it is not distributed, when it has a finding more severe than the maximum severity label. Setting the label to MEDIUM blocks HIGH findings, and a CRITICAL finding always fails the image.
  options:
    a:
      en: |-
        Test instance scans save a snapshot of the findings for later investigation; they do not stop the image from being distributed.
    c:
      en: |-
        A maximum severity label of HIGH lets AMIs with HIGH findings pass and be distributed.
    d:
      en: |-
        The function acts after distribution and is custom code; the policy forbids distributing such AMIs at all.
references:
  - title: "Amazon Inspector integration in Image Builder - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/integ-inspector.html
