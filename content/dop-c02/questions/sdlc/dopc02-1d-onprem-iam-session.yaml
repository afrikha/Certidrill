id: dopc02-1d-onprem-iam-session
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to use AWS CodeDeploy to release an internal application to 150 on-premises Linux servers. The security policy forbids long-term IAM access keys on servers. The company already runs a credential service that can obtain temporary AWS credentials on each server and refresh them before they expire. Deployment groups must select the servers by tags.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run the aws deploy register command on each server so that CodeDeploy creates an IAM user for the server, writes its credentials to the configuration file, and registers the server.
    - id: b
      text:
        en: |-
          Create one IAM user for all servers, store its access key in codedeploy.onpremises.yml on every server, and register each server with register-on-premises-instance and the IAM user ARN.
    - id: c
      text:
        en: |-
          Create an IAM role, assume it on each server with a unique session name, set iam_session_arn and aws_credentials_file in codedeploy.onpremises.yml, register each server with the session ARN, and tag it.
    - id: d
      text:
        en: |-
          Register the servers as hybrid managed nodes in AWS Systems Manager with an activation, and create deployment groups that select the servers by their managed node IDs.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The IAM session ARN method uses temporary AWS STS credentials that the company refreshes on each server, and AWS recommends it for production. The agent reads the session ARN and the credentials file path from codedeploy.onpremises.yml, register-on-premises-instance registers the server with --iam-session-arn, and add-tags-to-on-premises-instances adds the tags that deployment groups use.
  options:
    a:
      en: |-
        The register command creates an IAM user with static, permanent credentials on the server, which the security policy forbids; AWS advises it only for non-production use.
    b:
      en: |-
        A shared IAM user puts a long-term access key on every server, which the security policy forbids.
    d:
      en: |-
        Systems Manager registration is needed to install the agent with Distributor, but CodeDeploy deployment groups select on-premises instances registered with CodeDeploy by their tags, not Systems Manager managed node IDs.
references:
  - title: Use the register-on-premises-instance command (IAM Session ARN) to register an on-premises instance - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/register-on-premises-instance-iam-session-arn.html
  - title: Register an on-premises instance with CodeDeploy - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/on-premises-instances-register.html
