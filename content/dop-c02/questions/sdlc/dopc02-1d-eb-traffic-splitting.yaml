id: dopc02-1d-eb-traffic-splitting
objective: "1.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application in an AWS Elastic Beanstalk environment with an Application Load Balancer and eight instances. For the next releases, 15% of client traffic must go to the new version for 10 minutes while the environment's health is evaluated. If the new version is healthy, all traffic must then move to it. If it is unhealthy, all traffic must quickly return to the existing instances. The environment URL and DNS records must not change.

    Which deployment approach will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the deployment policy to Immutable so that a full set of new instances is launched in a temporary Auto Scaling group.
    - id: b
      text:
        en: |-
          Set the deployment policy to Rolling with additional batch, with a batch size of 15%, and rely on the health check of each batch.
    - id: c
      text:
        en: |-
          Clone the environment, deploy the new version to the clone, and swap the environment URLs after 10 minutes of testing.
    - id: d
      text:
        en: |-
          Set the deployment policy to Traffic splitting, with a traffic split of 15% and an evaluation time of 10 minutes.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Traffic splitting launches a full set of new instances and sends the configured percentage of client traffic (NewVersionPercent) to them for the evaluation time (EvaluationTime). If the new instances stay healthy, they receive all traffic; otherwise traffic moves back to the old instances and the new ones are terminated. It requires an Application Load Balancer.
  options:
    a:
      en: |-
        An immutable deployment tests the health of the new instances, but it does not send a controlled 15% share of client traffic to them for an evaluation period.
    b:
      en: |-
        Rolling with additional batch updates batches of instances in sequence; traffic is not split by percentage, and a failure leaves mixed versions that require another deployment to fix.
    c:
      en: |-
        Swapping environment URLs swaps CNAME records, so DNS changes, and the switch moves all traffic at once instead of 15% first.
references:
  - title: Deployment policies and settings - AWS Elastic Beanstalk
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.rolling-version-deploy.html
  - title: Blue/Green deployments with Elastic Beanstalk - AWS Elastic Beanstalk
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.CNAMESwap.html
