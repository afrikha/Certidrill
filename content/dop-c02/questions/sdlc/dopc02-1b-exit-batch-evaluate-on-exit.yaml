id: dopc02-1b-exit-batch-evaluate-on-exit
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs 200 integration test shards as AWS Batch jobs after each nightly build. The test runner exits with code 0 when all tests pass, code 1 when tests fail, and code 75 when the shared test environment is temporarily unavailable. The company wants a shard to be retried at most twice, and only when it exits with code 75. Any other failure, including exit code 1, other exit codes, and container errors, must end the job immediately without a retry.

    Which retry strategy in the job definition will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          attempts set to 3, and evaluateOnExit with one entry: action RETRY with onExitCode "75".
    - id: b
      text:
        en: |-
          attempts set to 3, without any evaluateOnExit entries.
    - id: c
      text:
        en: |-
          attempts set to 3, and evaluateOnExit with two entries: action RETRY with onExitCode "75", then action EXIT with onReason "*".
    - id: d
      text:
        en: |-
          attempts set to 3, and evaluateOnExit with two entries: action EXIT with onExitCode "1", then action RETRY with onExitCode "75".
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Three attempts allow the first run plus two retries. The RETRY entry matches exit code 75, and the final EXIT entry with onReason "*" catches every other failure; it is needed because a job that matches none of the evaluateOnExit entries is retried.
  options:
    a:
      en: |-
        When no entry matches, AWS Batch retries the job, so exit code 1 and every other failure would also be retried.
    b:
      en: |-
        Without evaluateOnExit, every failed attempt is retried, including test failures.
    d:
      en: |-
        Exit codes other than 1 and 75, and container errors, match no entry and are therefore retried.
references:
  - title: Automated job retries - AWS Batch
    url: https://docs.aws.amazon.com/batch/latest/userguide/job_retries.html
  - title: EvaluateOnExit - AWS Batch
    url: https://docs.aws.amazon.com/batch/latest/APIReference/API_EvaluateOnExit.html
