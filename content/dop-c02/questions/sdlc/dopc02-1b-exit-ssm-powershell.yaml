id: dopc02-1b-exit-ssm-powershell
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a .NET application on a fleet of Windows Server instances managed by AWS Systems Manager. After each deployment, an AWS Step Functions workflow uses Run Command with the AWS-RunPowerShellScript document to run a smoke test script on every instance. The workflow treats a command status of Success as a passed test. The script checks the application's Windows service and writes FAILED to the output when the service is stopped, but the command status is always Success. The company wants the command to report failure when the check fails.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run the same script with the AWS-RunShellScript document instead of AWS-RunPowerShellScript.
    - id: b
      text:
        en: |-
          Change the script to call exit with a non-zero value, such as exit 1, when the service check fails.
    - id: c
      text:
        en: |-
          Increase the executionTimeout parameter of the command so that the script has time to report the failure.
    - id: d
      text:
        en: |-
          Send the command output to an Amazon S3 bucket and to Amazon CloudWatch Logs for each instance.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Run Command derives the command status from the exit code of the script, which by default is the exit code of the last command. In PowerShell, the script must call exit explicitly with a non-zero value when the check fails, or Run Command might not capture the failure.
  options:
    a:
      en: |-
        AWS-RunShellScript runs shell scripts on Linux and macOS instances, not PowerShell on Windows Server.
    c:
      en: |-
        The script finishes in time; its problem is that it never returns a failing exit code.
    d:
      en: |-
        Storing the output keeps the FAILED text, but the command status still shows Success.
references:
  - title: Using exit codes in commands - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/command-exit-codes.html
