id: dopc02-1b-load-dlt-jmeter
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer expects about 40,000 concurrent shoppers during a seasonal sale, coming from North America, Europe, and Asia. The performance team already has Apache JMeter scripts for the checkout API. Before the sale, the team must generate this load from several AWS Regions at a sustained rate and find bottlenecks. The team does not want to provision or manage any load generation servers.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run the JMeter scripts in a single AWS CodeBuild build that uses the largest available compute type.
    - id: b
      text:
        en: |-
          Create Amazon CloudWatch Synthetics API canaries in three Regions that call the checkout API every minute.
    - id: c
      text:
        en: |-
          Create an AWS Fault Injection Service experiment that runs CPU stress on the checkout service's tasks during business hours.
    - id: d
      text:
        en: |-
          Deploy Distributed Load Testing on AWS and run the JMeter scripts as a load test across the three Regions.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Distributed Load Testing on AWS runs load test containers on Amazon ECS on AWS Fargate, so there are no servers to manage. It accepts JMeter, k6, and Locust scripts and can simulate tens of thousands of concurrent users across multiple Regions at a continuous pace.
  options:
    a:
      en: |-
        A single build environment in one Region cannot generate traffic from several Regions and is not designed to simulate tens of thousands of concurrent users.
    b:
      en: |-
        Canaries run a single scripted client on a schedule to monitor availability and latency; they do not generate sustained load.
    c:
      en: |-
        CPU stress tests how the service behaves when its resources are degraded; it does not generate user traffic to find bottlenecks under load.
references:
  - title: Automate the testing of your software applications at scale - Distributed Load Testing on AWS
    url: https://docs.aws.amazon.com/solutions/latest/distributed-load-testing-on-aws/solution-overview.html
