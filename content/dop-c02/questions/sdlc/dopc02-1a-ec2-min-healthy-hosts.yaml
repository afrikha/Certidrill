id: dopc02-1a-ec2-min-healthy-hosts
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS CodeDeploy for in-place deployments to a fleet of 8 Amazon EC2 instances behind an Application Load Balancer. During a deployment, at least 6 instances must remain available to serve traffic at all times. Within that constraint, each deployment must finish as quickly as possible.

    Which deployment configuration should the company use?
body:
  options:
    - id: a
      text:
        en: |-
          CodeDeployDefault.OneAtATime, which deploys the revision to one instance at a time.
    - id: b
      text:
        en: |-
          CodeDeployDefault.HalfAtATime, which deploys the revision to up to half of the instances at a time.
    - id: c
      text:
        en: |-
          A custom deployment configuration with a minimum healthy hosts value of type FLEET_PERCENT set to 75.
    - id: d
      text:
        en: |-
          CodeDeployDefault.AllAtOnce, which deploys the revision to as many instances as possible at once.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The minimum healthy hosts value of a custom EC2/On-Premises deployment configuration is the number or percentage of instances that must remain available during the deployment. With 75% of 8 instances, 6 must stay healthy, so CodeDeploy can update 2 instances at a time, which is faster than one at a time while keeping the required capacity.
  options:
    a:
      en: |-
        One instance at a time keeps 7 instances available but takes longer than necessary, which fails the speed requirement.
    b:
      en: |-
        Deploying to half of the fleet at once leaves only 4 instances available, fewer than the required 6.
    d:
      en: |-
        Deploying to all instances at once can leave no instance available to serve traffic during the deployment.
references:
  - title: Create a deployment configuration with CodeDeploy - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations-create.html
  - title: Working with deployment configurations in CodeDeploy - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
