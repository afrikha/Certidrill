id: dopc02-1a-hotfix-revision-override
objective: "1.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company uses an AWS CodePipeline pipeline of type V2 with a GitHub source action on the main branch, followed by build, test, and production stages. The pipeline defines a pipeline-level variable named TicketId that the production deploy action writes as a resource tag. During an incident, the company decides to redeploy a known good commit from two weeks ago to production. The redeployment must run through all the build and test actions, must not add commits to the main branch or change the pipeline definition, and must record the incident ticket number with the execution.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run git revert on the main branch for every commit after the known good commit, and push the result so that the pipeline starts.
    - id: b
      text:
        en: |-
          Start the pipeline with a source revision override of type COMMIT_ID for the source action, set to the ID of the known good commit.
    - id: c
      text:
        en: |-
          Create a Git tag on the known good commit and push the tag to GitHub so that the pipeline starts from the tagged commit.
    - id: d
      text:
        en: |-
          Roll back the production stage manually to the pipeline execution from two weeks ago that deployed the known good commit.
    - id: e
      text:
        en: |-
          Provide the incident ticket number as the value of the TicketId variable when the execution is started.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A source revision override starts an execution with a specific commit ID instead of the head of the branch, and the execution runs every stage, including build and test. Pipeline-level variables accept values when an execution is started, and those values apply to that execution only, so the ticket number is recorded with it.
  options:
    a:
      en: |-
        Reverting adds new commits to the main branch, which the company wants to avoid.
    c:
      en: |-
        The pipeline has no trigger on tag pushes, so pushing a tag does not start an execution.
    d:
      en: |-
        A stage rollback redeploys the earlier execution's artifacts in the production stage only, without running the build and test actions again.
references:
  - title: Start a pipeline with a source revision override - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-trigger-source-overrides.html
  - title: Variables reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/reference-variables.html
