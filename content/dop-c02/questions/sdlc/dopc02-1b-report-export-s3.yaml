id: dopc02-1b-report-export-s3
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company has 25 AWS CodeBuild projects. Their buildspecs all reference one existing report group by its ARN for unit test results in JUnit XML format. Auditors now require the raw unit test result files of every run to be kept for 1 year. The team notices that the reports of older runs can no longer be viewed. The buildspecs are owned by other teams and must not be changed.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the report group to export the raw test results to an Amazon S3 bucket, and add an S3 Lifecycle rule that expires the objects after 1 year.
    - id: b
      text:
        en: |-
          Add a secondary artifact to each buildspec that uploads the JUnit XML files to an Amazon S3 bucket, and add an S3 Lifecycle rule that expires them after 1 year.
    - id: c
      text:
        en: |-
          Set the retention of the CodeBuild CloudWatch Logs log groups of the 25 projects to 1 year.
    - id: d
      text:
        en: |-
          Create an AWS Backup plan with a daily rule and a 1-year retention period that backs up the report group.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A CodeBuild report expires 30 days after it is created. Export is configured on the report group, so every build that writes to it uploads the raw test result files to the S3 bucket, where exported files do not expire; an S3 Lifecycle rule then enforces the 1-year retention.
  options:
    b:
      en: |-
        Secondary artifacts require changes to all 25 buildspecs, which the team is not allowed to make.
    c:
      en: |-
        Build logs are not the raw JUnit XML result files that the auditors require.
    d:
      en: |-
        AWS Backup does not protect CodeBuild report groups; the export to S3 is the mechanism for keeping test results longer than 30 days.
references:
  - title: Test reports in AWS CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/test-reporting.html
