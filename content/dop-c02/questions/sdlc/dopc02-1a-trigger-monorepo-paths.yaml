id: dopc02-1a-trigger-monorepo-paths
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps three microservices in a single GitHub repository, in the services/orders/, services/payments/, and services/catalog/ folders. Each microservice has its own AWS CodePipeline pipeline of type V2 with a source action that uses AWS CodeConnections. Today, every push to the main branch starts all three pipelines. The payments pipeline must start only when files under services/payments/ change on the main branch, and changes to README.md files must never start it.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Add a push trigger to the payments pipeline that includes the main branch and the services/payments/** file path, and excludes the **/README.md file path.
    - id: b
      text:
        en: |-
          Add an AWS CodeBuild action at the start of the payments pipeline that runs git diff and stops the execution when no file under services/payments/ changed.
    - id: c
      text:
        en: |-
          Split the repository into one repository per microservice, and connect each pipeline to its own repository and main branch.
    - id: d
      text:
        en: |-
          Configure a GitHub webhook that calls an AWS Lambda function, and make the function inspect the changed files and start the matching pipeline.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Push triggers in V2 pipelines filter on branches and on file paths with include and exclude glob patterns. When the include and exclude lists match the same file, the exclude wins, so README.md changes are ignored while other changes under services/payments/ start the pipeline.
  options:
    b:
      en: |-
        The pipeline still starts for every push, and the git diff step is custom logic that must be maintained.
    c:
      en: |-
        Splitting the repository is a large reorganization of the code and the teams' workflow when a trigger filter solves the problem.
    d:
      en: |-
        A webhook with a Lambda function is custom code that duplicates the managed trigger filters.
references:
  - title: Add trigger with code push or pull request event types - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-filter.html
