id: dopc02-1d-alb-weighted-target-groups
objective: "1.4.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company runs blue and green versions of a web application on two Auto Scaling groups, each behind its own Application Load Balancer. Releases shift traffic with Amazon Route 53 weighted records that point to the two load balancers. During the last release, some corporate clients kept reaching the blue version for hours after its weight was set to 0, because their resolvers cached DNS answers longer than the record TTL. Users who switched between versions during the shift also lost their shopping carts. The company wants to shift traffic in controlled percentages that do not depend on client DNS caching, and to keep each user on one version during the shift.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Lower the TTL of the weighted records to a few seconds, and shift the weights in smaller steps during each release.
    - id: b
      text:
        en: |-
          Put both Auto Scaling groups' target groups behind one load balancer whose listener rule forwards to both target groups with weights, and enable target group stickiness on the rule.
    - id: c
      text:
        en: |-
          Replace the weighted records with failover records that use a health check on the blue load balancer, and fail the health check to move traffic.
    - id: d
      text:
        en: |-
          Enable duration-based sticky sessions on the target group of each load balancer, and keep the Route 53 weighted records for the traffic shift.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An Application Load Balancer forward action can send traffic to several target groups with a weight for each, so the split happens at the load balancer, under a single DNS name, and changes take effect without waiting for DNS caches. Target group stickiness in the forward action keeps a client on the same target group for the configured duration.
  options:
    a:
      en: |-
        The problem is resolvers that ignore the TTL, so a lower TTL does not stop clients from reaching the old version, and DNS still cannot keep a user on one version.
    c:
      en: |-
        Failover routing moves all traffic at once instead of in controlled percentages and still depends on DNS caching.
    d:
      en: |-
        Target-level sticky sessions only keep a client on one target inside a target group; with two load balancers, the choice of version is still made by DNS.
references:
  - title: Action types for listener rules - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-action-types.html
