id: dopc02-1a-beanstalk-traffic-splitting
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application in an AWS Elastic Beanstalk environment with an Application Load Balancer and 10 instances. For each new version, the company wants 15% of the client traffic to go to the new version for 20 minutes while the rest stays on the current version. If the new instances fail health checks during that time, traffic must move back to the current version automatically. The environment must keep its full capacity throughout the deployment.

    Which deployment policy should the company configure?
body:
  options:
    - id: a
      text:
        en: |-
          Traffic splitting, with a traffic split of 15% and an evaluation time of 20 minutes.
    - id: b
      text:
        en: |-
          Immutable, with the new instances launched in a temporary Auto Scaling group.
    - id: c
      text:
        en: |-
          Rolling with additional batch, with a batch size of 15% of the instances.
    - id: d
      text:
        en: |-
          Rolling, with a batch size of 15% of the instances and a 20-minute pause between batches.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Traffic splitting launches a full set of new instances, like an immutable deployment, and sends the configured percentage of client traffic to them for the evaluation time. If the new instances fail, Elastic Beanstalk moves traffic back to the old instances and terminates the new ones, quickly and without reducing capacity. The policy requires an Application Load Balancer.
  options:
    b:
      en: |-
        Immutable deployments protect the old instances if the deployment fails, but they do not send a fixed share of traffic to the new version for an evaluation period.
    c:
      en: |-
        Rolling with additional batch keeps capacity, but each batch moves fully to the new version, and a failure leaves mixed versions that require a redeployment to roll back.
    d:
      en: |-
        Rolling deployments take each batch out of service, which reduces capacity, and a failure requires redeploying a known good version.
references:
  - title: Deployment policies and settings - AWS Elastic Beanstalk
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.rolling-version-deploy.html
