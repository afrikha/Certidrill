id: dopc02-1d-apigw-canary-release
objective: "1.4.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company exposes a REST API in Amazon API Gateway with a stage named prod. The Lambda integration invokes the function alias named in a stage variable, lambdaAlias, which is set to v1. The next release changes both the API configuration, with new request validation and mapping templates, and the function code, published behind a new alias named v2. The company wants 5% of the prod stage requests to use both the new API configuration and the new code, with separate logs and metrics for those requests, before the release serves all requests.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure weighted alias routing on the v1 alias so that 5% of its invocations run the new function version.
    - id: b
      text:
        en: |-
          Deploy the API to the prod stage with canary settings that set percentTraffic to 5 and override the lambdaAlias stage variable to v2.
    - id: c
      text:
        en: |-
          Create a CodeDeploy deployment for the function with the CodeDeployDefault.LambdaCanary10Percent5Minutes deployment configuration.
    - id: d
      text:
        en: |-
          After the canary metrics are validated, promote the canary so that its deployment and stage variables become the prod stage settings.
    - id: e
      text:
        en: |-
          Enable the stage cache and set useStageCache to true in the canary settings so that canary requests are logged separately.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      An API Gateway canary release adds canary settings to a stage: percentTraffic sends that share of requests to the new deployment, and stageVariableOverrides can point those requests at the v2 alias. Canary requests get their own execution and access logs and metrics; promoting the canary then makes its deployment and settings the stage's production release.
  options:
    a:
      en: |-
        Alias weighting splits only the function code; the new API configuration would serve no requests, and the canary requests would not be logged separately.
    c:
      en: |-
        CodeDeploy shifts traffic between function versions only, not the API configuration, and it sends 10% instead of 5%.
    e:
      en: |-
        useStageCache only controls whether canary requests use the stage cache; separate canary logs come from enabling logging, not from caching.
references:
  - title: Set up an API Gateway canary release deployment - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/canary-release.html
