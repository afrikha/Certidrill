id: dopc02-1a-tooling-account-pipeline
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has dev, staging, and production accounts in AWS Organizations. Each account contains its own AWS CodePipeline pipeline that pulls the same repository and builds the application separately. Developers have administrator access in the dev account, and an audit found that a developer removed the test actions from the dev pipeline. The security team now requires that developers cannot change pipeline definitions, that the artifact deployed to production is the same artifact that was tested in dev and staging, and that production is changed only by the pipeline.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the three pipelines, and attach an SCP that denies codepipeline:UpdatePipeline to every account except the production account.
    - id: b
      text:
        en: |-
          Create one pipeline in a dedicated tooling account that builds once and deploys to each environment through cross-account roles, and give developers no write access to that account.
    - id: c
      text:
        en: |-
          Create one pipeline in the dev account that builds once and deploys to the staging and production accounts through cross-account roles assumed by the pipeline.
    - id: d
      text:
        en: |-
          Replace the pipelines with an AWS CodeBuild project in each account that a webhook starts on every push to the main branch and that deploys to its own account.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A central pipeline in a separate tooling account keeps the pipeline definition out of reach of developers, builds the artifact once, and promotes the same artifact into each workload account by assuming a cross-account role for each deploy action. Production changes come only from that pipeline's role.
  options:
    a:
      en: |-
        Each account still builds its own artifact, so production does not receive the tested artifact, and the production pipeline is left editable.
    c:
      en: |-
        Developers are administrators in the dev account, so they could still change a pipeline hosted there.
    d:
      en: |-
        Separate builds in each account produce different artifacts, and developers with administrator access could change the dev project.
references:
  - title: Create a pipeline in CodePipeline that uses resources from another AWS account - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-create-cross-account.html
