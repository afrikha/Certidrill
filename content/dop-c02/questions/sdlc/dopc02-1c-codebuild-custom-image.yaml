id: dopc02-1c-codebuild-custom-image
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's AWS CodeBuild project compiles C++ code with a specific compiler version that is not included in any curated CodeBuild image. Every build spends 8 minutes downloading and installing the compiler in the install phase. The company wants to remove this installation time from each build.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on the local cache with source cache mode, so that the compiler installation is reused by the next build on the same host.
    - id: b
      text:
        en: |-
          Move the project to AWS Lambda compute, so that the install phase runs on a build environment that starts faster.
    - id: c
      text:
        en: |-
          Change the compute type of the project to a larger size, so that the compiler downloads and installs in less time.
    - id: d
      text:
        en: |-
          Build a custom Docker image that contains the compiler, push it to Amazon ECR, and use it as the build environment image of the project.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CodeBuild can use a Docker image stored in Amazon ECR as the build environment. Preinstalling the compiler in a custom image removes the install step from every build; the project pulls the image with CodeBuild credentials or its service role, and the repository policy grants the pull.
  options:
    a:
      en: |-
        Source cache mode caches Git metadata of the source, not software installed in the build environment.
    b:
      en: |-
        Lambda compute does not support tools that require root permissions to install, and it would still install the compiler at every build.
    c:
      en: |-
        A larger compute type does not remove the download and installation from each build.
references:
  - title: "Amazon ECR sample for CodeBuild - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/sample-ecr.html
