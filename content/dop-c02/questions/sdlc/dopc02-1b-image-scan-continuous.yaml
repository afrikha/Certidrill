id: dopc02-1b-image-scan-continuous
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company builds container images in AWS CodeBuild and pushes them to an Amazon ECR private repository. An AWS CodePipeline pipeline then deploys the images to Amazon ECS. The pipeline already runs an Amazon Inspector InspectorScan action in SourceCodeScan mode on the application source. A penetration test found a vulnerable OS package that came from the base image. The security team has two requirements: the pipeline must stop before deployment if the pushed image has any critical or high vulnerability, and images that are already deployed must be re-evaluated automatically when new vulnerabilities are published.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on ECR basic scanning with scan on push for the repository, and add a manual approval action whose reviewer checks the critical and high findings of each image before deployment.
    - id: b
      text:
        en: |-
          Lower CriticalThreshold and HighThreshold of the existing SourceCodeScan action to 0, and add the Dockerfile to the source artifact so that the base image is scanned.
    - id: c
      text:
        en: |-
          Create an Amazon Inspector Classic assessment template that targets the ECS container instances, and run the assessment from a Lambda invoke action before the deploy stage starts.
    - id: d
      text:
        en: |-
          Turn on ECR enhanced scanning with continuous scanning for the repository, and add an InspectorScan action in ECRImageScan mode with CriticalThreshold and HighThreshold of 0.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An InspectorScan action in ECRImageScan mode scans the pushed image, including its OS packages, and fails the action when findings exceed the thresholds, which stops the run before deployment. ECR enhanced scanning integrates with Amazon Inspector and, with a continuous scanning filter, re-evaluates images in the repository as new vulnerabilities are published.
  options:
    a:
      en: |-
        Basic scanning on push does not give the automatic continuous re-evaluation of enhanced scanning, and a manual review does not stop the run automatically.
    b:
      en: |-
        A source code scan analyzes the application code and its dependencies, not the packages installed in the built image, and it does nothing for images already deployed.
    c:
      en: |-
        Amazon Inspector Classic, including its assessment templates, was shut down on May 20, 2026; current Amazon Inspector scans ECR images automatically.
references:
  - title: Amazon Inspector InspectorScan invoke action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-InspectorScan.html
  - title: Scan images for OS and programming language package vulnerabilities in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning-enhanced.html
