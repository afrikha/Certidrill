id: dopc02-1a-ecs-task-secrets
objective: "1.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A pipeline deploys an Amazon ECS service on AWS Fargate. The task definition passes the database user name and password to the container as plaintext environment variables. The security team has stored the credentials in an AWS Secrets Manager secret as JSON with the keys username and password, encrypted with the default aws/secretsmanager key. The container must receive the two values as environment variables when it starts, and the values must no longer appear in the task definition.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          In the container definition, add secrets entries whose valueFrom is the secret ARN followed by the JSON key, such as :password:: for the DB_PASSWORD variable.
    - id: b
      text:
        en: |-
          Grant secretsmanager:GetSecretValue on the secret to the task role that the application code inside the container uses.
    - id: c
      text:
        en: |-
          Add an environmentFiles entry to the container definition that points to the ARN of the secret in Secrets Manager.
    - id: d
      text:
        en: |-
          Grant secretsmanager:GetSecretValue on the secret to the task execution role of the task definition.
    - id: e
      text:
        en: |-
          Add kms:Decrypt on the aws/secretsmanager key to the task role, and add a key policy statement for the task role to that key.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The secrets parameter of a container definition injects a Secrets Manager value, or a single JSON key of it, as an environment variable when the container starts. The ECS and Fargate agents retrieve the value with the task execution role, which needs secretsmanager:GetSecretValue; kms:Decrypt is needed only for a customer managed key.
  options:
    b:
      en: |-
        The task role is for API calls made by the application code; secrets injected into environment variables are retrieved by the agent with the task execution role.
    c:
      en: |-
        Environment files are objects in Amazon S3, not Secrets Manager secrets.
    e:
      en: |-
        The secret uses the default key, so no KMS permission is needed, and the key policy of an AWS managed key cannot be edited.
references:
  - title: Pass Secrets Manager secrets through Amazon ECS environment variables - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/secrets-envvar-secrets-manager.html
  - title: Amazon ECS task execution IAM role - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html
