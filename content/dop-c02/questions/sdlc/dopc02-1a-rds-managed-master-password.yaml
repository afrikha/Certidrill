id: dopc02-1a-rds-managed-master-password
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pipeline deploys an AWS CloudFormation stack that creates an Amazon RDS for PostgreSQL DB instance with a single-AZ configuration and no read replicas. Today the master user password is a NoEcho template parameter whose value an engineer types into the pipeline's parameter overrides. The security team requires that no person ever sees or handles the master password, that the password is stored in AWS Secrets Manager, and that it rotates automatically on a schedule.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the NoEcho parameter, and write an AWS Lambda function that generates a new password every 30 days and runs a stack update with it.
    - id: b
      text:
        en: |-
          Store the password as a SecureString parameter in Parameter Store, and update it every 30 days from an EventBridge Scheduler schedule and a Lambda function.
    - id: c
      text:
        en: |-
          Generate a random password in an AWS CodeBuild action of the pipeline, and pass it to the stack as a parameter override for each deployment.
    - id: d
      text:
        en: |-
          Set ManageMasterUserPassword to true on the DB instance resource so that Amazon RDS generates the password, stores it in Secrets Manager, and rotates it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When RDS manages the master user password, it generates the password, stores it in Secrets Manager, and rotates it every seven days by default, with a configurable schedule and no rotation function to maintain. Nobody types or sees the password, and applications read it from the secret.
  options:
    a:
      en: |-
        A custom rotation function and stack updates are code to maintain, and the password does not live in Secrets Manager.
    b:
      en: |-
        Parameter Store is not Secrets Manager, and the scheduled rotation is custom code; the database password also would not change by itself.
    c:
      en: |-
        Passing a generated password as a parameter override exposes it to the pipeline and its logs, and it changes only at deployment time instead of on a schedule.
references:
  - title: Password management with Amazon RDS and AWS Secrets Manager - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-secrets-manager.html
