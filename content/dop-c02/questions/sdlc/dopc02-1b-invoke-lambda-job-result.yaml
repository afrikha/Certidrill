id: dopc02-1b-invoke-lambda-job-result
objective: "1.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company added an AWS Lambda invoke action to the Staging stage of its AWS CodePipeline pipeline. The function sends HTTP requests to the staging website and checks the responses. The function's logs show that it runs and that the checks pass within a few seconds, but the pipeline action stays In progress until it times out and fails. The pipeline service role allows lambda:InvokeFunction.

    Which solution will fix the problem?
body:
  options:
    - id: a
      text:
        en: |-
          Make the function call PutJobSuccessResult or PutJobFailureResult with the event's job ID, and allow these actions in its execution role.
    - id: b
      text:
        en: |-
          Increase the function's timeout to 15 minutes and raise its memory so that the function has enough time to send its result back to CodePipeline.
    - id: c
      text:
        en: |-
          Add lambda:InvokeAsync to the pipeline service role so that CodePipeline can receive the function's result.
    - id: d
      text:
        en: |-
          Change the function's handler to return a response with HTTP status code 200 when the checks pass and status code 500 when they fail.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CodePipeline does not use the function's return value; the function must report the outcome by calling PutJobSuccessResult or PutJobFailureResult with the job ID from the CodePipeline.job event. Its execution role needs codepipeline:PutJobSuccessResult and codepipeline:PutJobFailureResult.
  options:
    b:
      en: |-
        The function already finishes in seconds; a longer timeout does not report any result to CodePipeline.
    c:
      en: |-
        The function is already invoked, as its logs show; the missing piece is the result that the function must send back.
    d:
      en: |-
        CodePipeline ignores the handler's return value, so the job stays in progress until the action times out.
references:
  - title: Invoke an AWS Lambda function in a pipeline in CodePipeline - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/actions-invoke-lambda-function.html
