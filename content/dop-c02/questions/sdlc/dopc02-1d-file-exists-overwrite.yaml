id: dopc02-1d-file-exists-overwrite
objective: "1.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    During an incident, an engineer manually copied a file named feature-flags.json to /var/www/app/config/ on all the Amazon EC2 instances of a deployment group. The next application revision now includes its own feature-flags.json at the same path. The AWS CodeDeploy deployment of this revision fails with the message that a specified file already exists at this location. The company wants the revision's version of the file on every instance, without changing the revision and without signing in to the instances.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Redeploy the revision and choose to retain the content, so that CodeDeploy keeps the existing file and continues the deployment.
    - id: b
      text:
        en: |-
          Add a BeforeInstall hook script to the revision that deletes /var/www/app/config/feature-flags.json, and redeploy the new revision.
    - id: c
      text:
        en: |-
          Delete the deployment group, create it again with the same name and the same instances, and redeploy the revision.
    - id: d
      text:
        en: |-
          Redeploy the revision and choose to overwrite the content, so that the revision's version of the file replaces the existing file.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CodeDeploy fails by default when a file that it did not deploy already exists at a target path. The deployment can instead overwrite or retain such content; overwrite replaces the manually placed file with the revision's version, which is the documented choice for this case (--file-exists-behavior OVERWRITE in the AWS CLI).
  options:
    a:
      en: |-
        Retain keeps the manually copied file and skips the revision's version, so the instances would not get the revision's file.
    b:
      en: |-
        A cleanup script would work, but it changes the revision, which the company wants to avoid.
    c:
      en: |-
        Recreating a deployment group with the same name is itself a documented cause of this error, and it does not change how existing files are handled.
references:
  - title: Redeploy and roll back a deployment with CodeDeploy - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployments-rollback-and-redeploy.html
  - title: Troubleshoot EC2/On-Premises deployment issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-deployments.html
