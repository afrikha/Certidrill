id: dopc02-1b-exit-finally-retry
objective: "1.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodeBuild project runs on on-demand EC2 compute with a Linux image provided by CodeBuild. In the install phase, pip downloads dependencies from an internal package mirror that sometimes fails with a "connection timed out" error. In the build phase, docker compose starts a database container, the integration tests run, and then commands save the container logs and run docker compose down. When the tests fail, the log and cleanup commands are skipped. The company wants the log and cleanup commands to run in every build, the build to fail whenever the tests fail, and timed-out downloads to be retried automatically.

    Which combination of buildspec changes will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Append || true to the test command so that the commands that follow it always run.
    - id: b
      text:
        en: |-
          Move the log and cleanup commands to a separate AWS CodePipeline action that runs after the CodeBuild action.
    - id: c
      text:
        en: |-
          Move the log and cleanup commands into a finally block of the build phase.
    - id: d
      text:
        en: |-
          Set on-failure: ABORT on the install phase.
    - id: e
      text:
        en: |-
          Set on-failure: RETRY-3-.*connection timed out.* on the install phase.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      Commands in a finally block run after the commands block even when one of its commands fails, and the phase still fails if any command failed, so the build fails when the tests fail. on-failure with RETRY-count-regex retries the phase up to the given count only when the error matches the expression, and it is supported with the EC2 compute images that CodeBuild provides.
  options:
    a:
      en: |-
        || true turns every test failure into exit code 0, so the build would succeed even when the tests fail.
    b:
      en: |-
        When the CodeBuild action fails, the pipeline does not run the next action, and the containers exist only inside the build environment.
    d:
      en: |-
        ABORT stops the build at the first failure of the install phase; it does not retry the download.
references:
  - title: Build specification reference for CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
