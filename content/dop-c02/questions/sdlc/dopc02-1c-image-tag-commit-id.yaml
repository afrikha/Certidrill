id: dopc02-1c-image-tag-commit-id
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company builds container images with AWS CodeBuild in an AWS CodePipeline pipeline. The source action uses AWS CodeConnections to read a GitHub repository. The images are pushed to an Amazon ECR repository that has tag immutability turned on. The security team requires that each image tag identifies, on its own, the exact Git commit that the image was built from. An Amazon ECS standard deploy action later in the pipeline must deploy the image that the build produced, by using the imagedefinitions.json file that the build outputs.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Tag the image with `$CODEBUILD_RESOLVED_SOURCE_VERSION` in the buildspec, and write the same tag into the imagedefinitions.json file that the build outputs for the deploy action.
    - id: b
      text:
        en: |-
          Tag the image with `$CODEBUILD_BUILD_NUMBER` in the buildspec, and write the same tag into the imagedefinitions.json file that the build outputs for the deploy action.
    - id: c
      text:
        en: |-
          Tag the image `latest` on every build, and write `latest` into the imagedefinitions.json file so that the deploy action always picks up the newest image.
    - id: d
      text:
        en: |-
          Tag the image with `$CODEBUILD_WEBHOOK_HEAD_REF` in the buildspec, and write the same tag into the imagedefinitions.json file that the build outputs for the deploy action.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      For a build started by CodePipeline, `CODEBUILD_RESOLVED_SOURCE_VERSION` contains the source revision that CodePipeline provides, which is the commit ID for a Git source. It is unique per commit, so it works with tag immutability and identifies the commit from the tag alone. Writing the same tag into imagedefinitions.json makes the deploy action use exactly the image that the build pushed.
  options:
    b:
      en: |-
        The build number is unique, but it identifies a CodeBuild run, not a Git commit; finding the commit requires looking up the build record.
    c:
      en: |-
        With tag immutability, the second push of `latest` is rejected, and `latest` never identifies a commit.
    d:
      en: |-
        This variable holds the branch or tag reference of a webhook event: it is not unique per commit, so immutability rejects later pushes, and pipeline-started builds are not webhook builds.
references:
  - title: "Environment variables in build environments - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-env-ref-env-vars.html
  - title: "Preventing image tags from being overwritten in Amazon ECR - Amazon ECR"
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-tag-mutability.html
