id: dopc02-1b-artifact-ecr-immutable-tags
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores its container images in an Amazon ECR private repository. The release pipeline tags each tested image with its semantic version, such as v2.7.1, and production deployments reference these tags. Last month, a developer pushed a rebuilt image with an existing version tag, and production ran code that had never been tested. The company wants every version tag to keep pointing to the image that was first pushed with it. Development environments use a latest tag that must keep moving to the newest image.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a lifecycle policy to the repository that expires untagged images one day after they are pushed to the repository.
    - id: b
      text:
        en: |-
          Add a repository policy that denies ecr:PutImage to every principal except the release pipeline's role.
    - id: c
      text:
        en: |-
          Set the repository's image tag mutability to IMMUTABLE_WITH_EXCLUSION, with an exclusion filter for the latest tag.
    - id: d
      text:
        en: |-
          Turn on enhanced scanning with continuous scanning for the repository and alert on new findings.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With tag immutability, ECR returns ImageTagAlreadyExistsException when an image is pushed with a tag that already exists in the repository. The IMMUTABLE_WITH_EXCLUSION setting with an exclusion filter keeps latest updatable while every other tag stays immutable.
  options:
    a:
      en: |-
        A lifecycle policy removes old images; it does not stop a push from moving an existing tag to a new image.
    b:
      en: |-
        The release pipeline could still overwrite an existing version tag, so the tags would not be protected.
    d:
      en: |-
        Scanning finds vulnerabilities in images; it does not prevent tags from being overwritten.
references:
  - title: Preventing image tags from being overwritten in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-tag-mutability.html
