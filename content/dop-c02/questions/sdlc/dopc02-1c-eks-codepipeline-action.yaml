id: dopc02-1c-eks-codepipeline-action
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs applications on a private Amazon EKS cluster. The company stores each application's Helm chart in the application repository and uses an AWS CodePipeline V2 pipeline to build images and push them to Amazon ECR. The company wants the pipeline to install the Helm release on the cluster after each build. The company wants the LEAST operational overhead and no long-lived cluster credentials.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Install the AWS CodeDeploy agent on the cluster nodes, and add a CodeDeploy deploy action whose AppSpec file runs `helm upgrade` in an AfterInstall hook.
    - id: b
      text:
        en: |-
          Add an Amazon EKS deploy action with the Helm chart location, the cluster's subnets and security groups, and an EKS access entry for the pipeline role.
    - id: c
      text:
        en: |-
          Add an AWS Lambda invoke action that runs a function packaged with the Helm binary and a kubeconfig file stored in AWS Secrets Manager.
    - id: d
      text:
        en: |-
          Add an AWS CodeBuild action that runs `helm upgrade` with a kubeconfig file that contains a service account token stored in the build project's environment variables.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The CodePipeline EKS deploy action, available in V2 pipelines, deploys Kubernetes manifests or Helm charts to public or private clusters; for a private cluster you give it subnets and security groups in the cluster VPC. Access is granted by adding the pipeline service role or action role as an EKS access entry, so no long-lived credentials are stored.
  options:
    a:
      en: |-
        CodeDeploy would treat the nodes as EC2 instances, run Helm on every node, and need cluster credentials on them; it has no Kubernetes deployment support.
    c:
      en: |-
        A Lambda function with Helm and a stored kubeconfig is custom tooling with a long-lived credential.
    d:
      en: |-
        A service account token in the project configuration is a long-lived credential, and the custom build adds overhead.
references:
  - title: "Amazon Elastic Kubernetes Service (EKS) deploy action reference - AWS CodePipeline"
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-EKS.html
