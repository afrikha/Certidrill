id: dopc02-1d-agent-proxy-uri
objective: "1.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs Amazon EC2 instances in private subnets. A security control requires all outbound HTTPS traffic to go through a corporate HTTP proxy fleet, and the subnets have no other route out of the VPC. The company installs the AWS CodeDeploy agent on the instances and creates a deployment group, but every deployment fails with a HEALTH_CONSTRAINTS error and all lifecycle events are skipped. The agent log shows connection timeouts to the CodeDeploy endpoint.

    Which change will resolve the issue while meeting the security control?
body:
  options:
    - id: a
      text:
        en: |-
          Add an outbound rule to the instances' security group that allows TCP port 443 to 0.0.0.0/0, and restart the CodeDeploy agent.
    - id: b
      text:
        en: |-
          Set :wait_between_runs: in the agent configuration file to a higher value so that the agent polls CodeDeploy less often.
    - id: c
      text:
        en: |-
          Set :proxy_uri: in the agent configuration file to the URL of the corporate proxy, and restart the CodeDeploy agent.
    - id: d
      text:
        en: |-
          Set :log_aws_wire: to true in the agent configuration file, and redeploy the revision to the deployment group.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The agent must reach CodeDeploy and Amazon S3 over HTTPS. When instances can only go out through an HTTP proxy, the proxy is set with :proxy_uri: in the agent configuration file; a missing proxy setting is a documented cause of HEALTH_CONSTRAINTS failures with skipped events.
  options:
    a:
      en: |-
        The subnets have no route out of the VPC except through the proxy, so opening the security group does not create a path, and direct egress would violate the control.
    b:
      en: |-
        The polling interval does not change how the agent connects; the agent still cannot reach the endpoint.
    d:
      en: |-
        Wire logging only records Amazon S3 traffic for troubleshooting; it does not fix connectivity.
references:
  - title: CodeDeploy agent configuration reference - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-agent-configuration.html
  - title: Troubleshoot EC2/On-Premises deployment issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-deployments.html
