id: dopc02-1a-codebuild-privileged-docker
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A DevOps engineer creates an AWS CodeBuild project that uses a CodeBuild-managed Amazon Linux image on EC2 compute. The buildspec runs docker build and pushes the image to Amazon ECR. The project's service role already has the Amazon ECR permissions to push images. The build fails at the docker build command with an error saying that it cannot connect to the Docker daemon.

    What should the engineer do to fix the build?
body:
  options:
    - id: a
      text:
        en: |-
          Change the project's compute type to AWS Lambda so that the build runs in a container runtime that supports image builds.
    - id: b
      text:
        en: |-
          Add the ecr:GetAuthorizationToken permission to the service role so that the build can log in to the registry.
    - id: c
      text:
        en: |-
          Turn on local caching with the Docker layer cache mode so that the build reuses the layers of earlier builds.
    - id: d
      text:
        en: |-
          Turn on privileged mode in the environment settings of the project so that the build can use the Docker daemon.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Privileged mode must be enabled when a project builds Docker images; otherwise every build that tries to interact with the Docker daemon fails. CodeBuild-managed images with Docker support start the daemon for the build once privileged mode is on.
  options:
    a:
      en: |-
        Lambda compute does not support Docker builds or privileged mode.
    b:
      en: |-
        The service role already has the push permissions, and the error is about reaching the Docker daemon, not about registry authentication.
    c:
      en: |-
        Docker layer caching speeds up builds, but it itself requires privileged mode and does not fix the daemon error.
references:
  - title: Create a build project in AWS CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/create-project.html
  - title: Run builds on AWS Lambda compute - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/lambda.html
