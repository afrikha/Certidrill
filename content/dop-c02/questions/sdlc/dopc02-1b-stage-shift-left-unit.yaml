id: dopc02-1b-stage-shift-left-unit
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline has these stages: Source, Deploy-Test (an AWS CloudFormation deployment to a shared test environment that takes about 20 minutes), Test, and Production. The Test stage runs one AWS CodeBuild action that executes both the unit tests and the integration tests. Developers learn about failing unit tests about 40 minutes after they push a commit. When unit tests fail, the shared test environment is already running the broken code, which blocks other teams. The company wants the fastest possible feedback on unit tests and must keep testing integrations against the deployed environment.

    Which combination of changes will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Move both the unit tests and the integration tests to a CodeBuild action that runs after the Production deployment, so that the test environment is never blocked.
    - id: b
      text:
        en: |-
          Add a Build stage before Deploy-Test with a CodeBuild action that runs the unit tests, so that a failure stops the run before the test environment is updated.
    - id: c
      text:
        en: |-
          Remove the integration tests from the pipeline and raise the unit test coverage target to compensate for the integration scenarios that are no longer tested.
    - id: d
      text:
        en: |-
          Run the integration tests in the new Build stage against mocks of the test environment's services.
    - id: e
      text:
        en: |-
          Keep the integration tests in a CodeBuild test action in the Test stage, after the Deploy-Test stage has updated the environment.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Unit tests need no deployed resources, so running them in a stage before Deploy-Test gives feedback within minutes and stops a broken revision before it reaches the shared environment. Integration tests still need the deployed resources, so they stay in a test action after the deployment.
  options:
    a:
      en: |-
        Testing after production deployment gives the slowest feedback and lets broken code reach customers.
    c:
      en: |-
        Unit test coverage does not replace integration tests, and the company must keep testing integrations against the deployed environment.
    d:
      en: |-
        Tests against mocks are no longer integration tests against the deployed environment, which the company must keep.
references:
  - title: AWS CodeBuild build and test action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodeBuild.html
