id: dopc02-1b-fis-stop-instances-stress
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a tracking application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer in a staging account. While a load test runs against staging, the company wants to verify that the application keeps serving requests when the instances tagged Tier=web are stopped for 10 minutes and then started again. If the Amazon CloudWatch alarm on the load balancer's HTTP 5xx error rate enters the ALARM state, the test must stop immediately. The company wants to write as little custom code as possible.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Use Systems Manager Run Command with AWS-RunShellScript to run shutdown -h now on the instances tagged Tier=web.
    - id: b
      text:
        en: |-
          Create an AWS Fault Injection Service experiment template with the aws:ec2:stop-instances action, targets selected by the tag Tier=web, and startInstancesAfterDuration set to PT10M.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule for the alarm's state change that invokes a Lambda function to stop the experiment.
    - id: d
      text:
        en: |-
          Start an instance refresh on the Auto Scaling group with a minimum healthy percentage of 50% during the load test.
    - id: e
      text:
        en: |-
          Add a stop condition to the experiment template that references the CloudWatch alarm on the HTTP 5xx error rate.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      AWS Fault Injection Service provides the aws:ec2:stop-instances action, whose startInstancesAfterDuration parameter starts the instances again after the specified time, and targets can be selected by tags. Stop conditions are CloudWatch alarms that the service watches during the experiment, and it stops the experiment when one is triggered.
  options:
    a:
      en: |-
        Shutting down instances from Run Command does not restart them after 10 minutes and has no automatic abort when the alarm fires.
    c:
      en: |-
        A Lambda function that stops the experiment is custom code for what a stop condition already does.
    d:
      en: |-
        An instance refresh replaces instances with new ones; it does not stop and restart the tagged instances, and it has no stop condition.
references:
  - title: AWS FIS Actions reference - AWS Fault Injection Service
    url: https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html
  - title: What is AWS Fault Injection Service? - AWS Fault Injection Service
    url: https://docs.aws.amazon.com/fis/latest/userguide/what-is.html
