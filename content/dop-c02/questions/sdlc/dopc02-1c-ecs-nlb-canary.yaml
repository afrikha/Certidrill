id: dopc02-1c-ecs-nlb-canary
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is creating a new Amazon ECS service on AWS Fargate behind a Network Load Balancer, because clients need static IP addresses and long-lived TCP connections. For each release, the company wants 10% of the traffic to move to the new tasks, a 15-minute observation period, and then the rest of the traffic. A CloudWatch alarm on the error rate must roll the deployment back automatically. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use the ECS deployment controller with the canary deployment strategy, a canary percentage of 10 and a canary bake time of 15 minutes, and the alarm with rollback in the deployment configuration.
    - id: b
      text:
        en: |-
          Use the CODE_DEPLOY deployment controller, and create an AWS CodeDeploy deployment group with the CodeDeployDefault.ECSCanary10Percent15Minutes configuration and the alarm.
    - id: c
      text:
        en: |-
          Replace the Network Load Balancer with an Application Load Balancer, and use AWS CodeDeploy blue/green deployments with the CodeDeployDefault.ECSCanary10Percent15Minutes configuration.
    - id: d
      text:
        en: |-
          Create two ECS services behind two Network Load Balancers, and use Amazon Route 53 weighted records that a pipeline step changes from 10% to 100% after 15 minutes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon ECS supports built-in canary deployments with the ECS deployment controller, including for services behind a Network Load Balancer. The deployment configuration sets the canary percentage and bake time, and CloudWatch alarms with rollback enabled revert the deployment automatically, without a separate deployment service.
  options:
    b:
      en: |-
        With a Network Load Balancer, CodeDeploy ECS deployments support only CodeDeployDefault.ECSAllAtOnce, so a canary configuration cannot be used.
    c:
      en: |-
        An Application Load Balancer does not provide static IP addresses, which the clients require.
    d:
      en: |-
        Two services and DNS weight changes add infrastructure and pipeline logic, and DNS caching makes the traffic split and the rollback imprecise.
references:
  - title: "Required resources for Amazon ECS canary deployments - Amazon Elastic Container Service"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/canary-deployment-implementation.html
  - title: "Working with deployment configurations in CodeDeploy - AWS CodeDeploy"
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
