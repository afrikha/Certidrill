id: dopc02-1d-ib-instance-refresh
objective: "1.4.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's EC2 Image Builder pipeline builds a new AMI every month. Its distribution settings include a launch template configuration, with setDefaultVersion set to true, for the launch template of an Auto Scaling group in the same account. After the last pipeline run, the launch template has a new default version that uses the new AMI. However, the running instances still use the old AMI, and instances launched by scale-out after the run also use the old AMI. After each pipeline run, all instances must move to the new AMI with no manual edits to the launch template or the Auto Scaling group, and the group must keep most of its capacity during the replacement.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Update the Auto Scaling group to use the launch template version number that is the newest version today.
    - id: b
      text:
        en: |-
          Configure the Auto Scaling group to use the $Default version of the launch template.
    - id: c
      text:
        en: |-
          Add a warm pool to the Auto Scaling group so that pre-initialized instances are created from the new AMI.
    - id: d
      text:
        en: |-
          Keep automatic updates to outdated instances enabled in a CodeDeploy deployment group that targets the Auto Scaling group.
    - id: e
      text:
        en: |-
          Start an instance refresh of the Auto Scaling group with a minimum healthy percentage after each pipeline run.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      Image Builder only creates a new launch template version and, with setDefaultVersion, makes it the default; it does not change the Auto Scaling group or replace instances. If the group uses $Default, scale-out launches use each new AMI without edits, and an instance refresh with a minimum healthy percentage replaces the running instances in batches while keeping capacity.
  options:
    a:
      en: |-
        A specific version number pins the group to that version, so next month's AMI would again require a manual edit of the group; scale-out already used the old AMI for this reason.
    c:
      en: |-
        Warm pool instances are created from the group's launch template version and do not replace the running instances; they do not solve the version pinning.
    d:
      en: |-
        CodeDeploy follow-on deployments update outdated application revisions on instances, not the AMI that instances were launched from.
references:
  - title: Configure AMI distribution with an EC2 launch template - EC2 Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/dist-using-launch-template.html
  - title: Use an instance refresh to update instances in an Auto Scaling group - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-instance-refresh.html
