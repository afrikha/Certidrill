id: dopc02-1b-coverage-jacoco-report
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company builds a Java service with Apache Maven in AWS CodeBuild. The unit tests run in the build phase, and the JaCoCo plugin writes a coverage file to target/site/jacoco/jacoco.xml. Team leads want to see the line coverage and branch coverage of every build in the CodeBuild console without downloading files. The company wants the LEAST effort.

    Which change to the buildspec will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add target/site/jacoco/jacoco.xml to the artifacts section so that the file is uploaded to Amazon S3 with the build output.
    - id: b
      text:
        en: |-
          Add an entry to the reports section with target/site/jacoco/jacoco.xml in files and file-format set to JACOCOXML.
    - id: c
      text:
        en: |-
          Add an entry to the reports section with target/site/jacoco/jacoco.xml in files and file-format set to JUNITXML.
    - id: d
      text:
        en: |-
          Print the coverage file to the build log and query the coverage values with CloudWatch Logs Insights.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CodeBuild creates code coverage reports from JaCoCo XML, SimpleCov JSON, Clover XML, Cobertura XML, and LCOV INFO files. A reports entry with file-format JACOCOXML creates a coverage report for each build, which shows line coverage and branch coverage in the console.
  options:
    a:
      en: |-
        An artifact is only a stored file; someone would have to download and open it to see the coverage.
    c:
      en: |-
        JUNITXML is a test report format; the JaCoCo file contains coverage data, not test case results.
    d:
      en: |-
        Querying logs requires extra work for every build and does not give the coverage view of the console.
references:
  - title: Create code coverage reports - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/code-coverage-report.html
