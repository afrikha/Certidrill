id: dopc02-1d-codedeploy-cross-region-actions
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in Auto Scaling groups in us-east-1 and eu-west-1. An AWS CodePipeline pipeline in us-east-1 builds the application with AWS CodeBuild and stores the output .zip revision in the pipeline's S3 artifact bucket in us-east-1. An AWS CodeDeploy application and deployment group exist in each Region. Each build must be deployed to both Regions by the same pipeline execution, after one manual approval. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          After the approval action, add a CodeDeploy deploy action for each Region, set the Region of the second action to eu-west-1, and add an eu-west-1 artifact bucket to the pipeline's artifactStores.
    - id: b
      text:
        en: |-
          After the approval action, add one CodeDeploy deploy action that targets the us-east-1 deployment group, and add the eu-west-1 Auto Scaling group to that deployment group.
    - id: c
      text:
        en: |-
          Replicate the artifact bucket to a bucket in eu-west-1 with S3 Cross-Region Replication, and create a second pipeline in eu-west-1 with an S3 source action, an approval action and a CodeDeploy action.
    - id: d
      text:
        en: |-
          After the approval action, add a Lambda invoke action that calls CreateDeployment in eu-west-1 with the S3 location of the revision in the us-east-1 artifact bucket.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CodePipeline supports cross-Region actions for AWS action providers such as CodeDeploy: the pipeline needs an artifact bucket in each Region where it runs an action, declared in artifactStores. CodePipeline copies the input artifacts of the cross-Region action to that Region's bucket, so a single execution and a single approval drive both deployments.
  options:
    b:
      en: |-
        A CodeDeploy deployment group belongs to one Region and can only target Auto Scaling groups in that Region; the instances must also download the revision from a bucket in their own Region.
    c:
      en: |-
        A second pipeline duplicates the approval and the pipeline configuration to maintain, and the two Regions are no longer deployed by the same execution.
    d:
      en: |-
        For EC2 deployments, the revision bucket must be in the same Region as the target instances, so the eu-west-1 deployment would fail to download the bundle; the custom function also adds code to maintain.
references:
  - title: Add a cross-region action in CodePipeline - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/actions-create-cross-region.html
  - title: Push a revision for CodeDeploy to Amazon S3 (EC2/On-Premises deployments only) - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/application-revisions-push.html
