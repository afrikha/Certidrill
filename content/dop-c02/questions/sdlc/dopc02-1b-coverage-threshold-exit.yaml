id: dopc02-1b-coverage-threshold-exit
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company builds a Python application in AWS CodeBuild. The buildspec runs pytest with the pytest-cov plugin, which writes a Cobertura XML file, and the reports section publishes it as a code coverage report with file-format COBERTURAXML. A new engineering policy states that any build whose line coverage is below 80% must fail before the artifact is deployed. The team wants to keep the existing coverage report and use the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the file-format of the coverage report to CLOVERXML so that CodeBuild compares the coverage with the policy.
    - id: b
      text:
        en: |-
          Configure the report group to export the raw coverage files to an Amazon S3 bucket with S3 Versioning enabled.
    - id: c
      text:
        en: |-
          Add on-failure: ABORT to the build phase of the buildspec so that CodeBuild stops the build when the line coverage of the report is too low.
    - id: d
      text:
        en: |-
          Add the --cov-fail-under=80 option to the pytest command so that the command returns a non-zero exit code when line coverage is below 80%.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A CodeBuild coverage report displays line and branch coverage, but the build status comes from the exit codes of the buildspec commands. Making the coverage tool exit with a non-zero code below the threshold fails the build phase, and the existing report is still published.
  options:
    a:
      en: |-
        The file format only tells CodeBuild how to parse the file; changing it does not add a threshold, and the file is in Cobertura format.
    b:
      en: |-
        Exporting raw files keeps them longer but does not evaluate coverage or change the build status.
    c:
      en: |-
        on-failure acts only when a command fails, and no command fails when coverage is low.
references:
  - title: Create code coverage reports - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/code-coverage-report.html
  - title: Build specification reference for CodeBuild - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
