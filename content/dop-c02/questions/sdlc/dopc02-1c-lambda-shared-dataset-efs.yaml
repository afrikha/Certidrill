id: dopc02-1c-lambda-shared-dataset-efs
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs several AWS Lambda functions that read a 4 GB reference dataset. A nightly batch job on Amazon EC2 rebuilds the dataset, and every function must use the new data as soon as the job finishes, without a redeployment. The company does not want to add code that downloads the dataset to the functions. The functions are already connected to the company's VPC, which spans two Availability Zones.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Package the dataset in a Lambda layer, publish a new layer version after each batch run, and update the functions to use the new layer version.
    - id: b
      text:
        en: |-
          Build the dataset into a container image after each batch run, push it to Amazon ECR, and update the functions to use the new image.
    - id: c
      text:
        en: |-
          Increase the ephemeral storage of the functions to 10,240 MB, and copy the dataset from Amazon S3 into /tmp when each execution environment initializes.
    - id: d
      text:
        en: |-
          Store the dataset on an Amazon EFS file system with a mount target in each Availability Zone, and mount it in the functions through an access point under /mnt.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Lambda functions connected to a VPC can mount an Amazon EFS file system through an access point, with a local mount path that starts with /mnt/ and a mount target in each Availability Zone that the functions use. The batch job writes the new dataset once, and every function reads it immediately, with no redeployment and no download code.
  options:
    a:
      en: |-
        A layer counts toward the 250 MB unzipped limit of a .zip function, far below 4 GB, and each update is a redeployment.
    b:
      en: |-
        A container image can hold 4 GB, but every nightly refresh then requires a new image and a function update, which is a redeployment.
    c:
      en: |-
        Copying the dataset into /tmp at initialization is the download code that the company wants to avoid, and running environments would keep the old copy.
references:
  - title: "Configuring Amazon EFS file system access - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-filesystem-efs.html
  - title: "Lambda quotas - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
