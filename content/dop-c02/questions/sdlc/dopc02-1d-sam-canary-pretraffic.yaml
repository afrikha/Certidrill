id: dopc02-1d-sam-canary-pretraffic
objective: "1.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys a serverless API whose AWS Lambda functions are defined in an AWS SAM template and released by AWS CodePipeline. Clients invoke the functions through an alias named live. For each release, a validation function must run against the new version before any production traffic reaches it. Then 10% of the traffic must go to the new version for 10 minutes before all traffic shifts. The release must roll back automatically if an existing CloudWatch alarm on the alias's errors enters the ALARM state.

    Which configuration of the function resources will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          AutoPublishAlias set to live, and a DeploymentPreference with Type Linear10PercentEvery1Minute, the alarm in Alarms, and the validation function as the PostTraffic hook.
    - id: b
      text:
        en: |-
          AutoPublishAlias set to live, and a DeploymentPreference with Type Canary10Percent10Minutes, the alarm in Alarms, and the validation function as the PreTraffic hook.
    - id: c
      text:
        en: |-
          A live alias with a routing configuration that sends 10% to the new version, and an EventBridge rule on the alarm that invokes a function to reset the alias weights.
    - id: d
      text:
        en: |-
          AutoPublishAlias set to live, and a DeploymentPreference with Type Canary10Percent10Minutes, the alarm in Alarms, and the validation function as the PostTraffic hook.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AutoPublishAlias publishes a new version and points the alias at it through CodeDeploy. Canary10Percent10Minutes shifts 10% of the traffic, then the rest after 10 minutes; the PreTraffic hook runs before any traffic shifts, and CodeDeploy rolls back if a hook reports failure or an alarm in Alarms is triggered.
  options:
    a:
      en: |-
        Linear10PercentEvery1Minute shifts 10% every minute instead of holding 10% for 10 minutes, and a PostTraffic hook runs only after all traffic has shifted.
    c:
      en: |-
        Manual alias weights with a custom rollback function rebuild what SAM and CodeDeploy provide, and nothing runs the validation function before traffic reaches the new version.
    d:
      en: |-
        The PostTraffic hook runs after traffic shifting completes, so production traffic would reach the new version before the validation function runs.
references:
  - title: Deploying serverless applications gradually with AWS SAM - AWS Serverless Application Model
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html
  - title: Working with deployment configurations in CodeDeploy - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
