id: dopc02-1b-device-farm-real-devices
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank publishes a native Android app. Its AWS CodePipeline pipeline builds the APK file in AWS CodeBuild and runs unit tests. Two recent releases crashed only on specific phone models, which the unit tests could not detect. The mobile team has Appium tests written in Java with TestNG and wants them to run on about 40 real device models during every pipeline run, before the app is published. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an AWS Device Farm test action after the build action, with a device pool of the 40 models and the APPIUM_JAVA_TESTNG test type.
    - id: b
      text:
        en: |-
          Add a CodeBuild test action that starts 40 Android emulator images in parallel and runs the Appium tests against each emulator.
    - id: c
      text:
        en: |-
          Create an Amazon CloudWatch Synthetics canary with a Playwright script that opens the app and runs the test steps after each build.
    - id: d
      text:
        en: |-
          Add Amazon CloudWatch RUM to the app and block the release when RUM reports crashes from the 40 device models.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The Device Farm test action runs the app and its tests on the devices of a device pool, and it supports Appium Java TestNG tests through the APPIUM_JAVA_TESTNG test type. Device Farm manages the real devices, so the team maintains only the tests and the pool.
  options:
    b:
      en: |-
        Emulators are not the real device models on which the crashes happened, and running 40 of them in builds is infrastructure to maintain.
    c:
      en: |-
        Synthetics canaries drive headless browsers for web pages and APIs; they cannot install and test a native Android app.
    d:
      en: |-
        RUM collects data from real user sessions after the release, so crashes are found only once customers have the app.
references:
  - title: AWS Device Farm test action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-DeviceFarm.html
