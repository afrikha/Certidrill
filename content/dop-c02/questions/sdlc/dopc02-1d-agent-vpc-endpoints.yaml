id: dopc02-1d-agent-vpc-endpoints
objective: "1.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in private subnets that have no route to a NAT gateway or an internet gateway, and the subnets must stay without internet access. The company wants to deploy the application with AWS CodeDeploy. The application revisions are stored in an S3 bucket in the same Region, which the instances already reach through a gateway endpoint for Amazon S3. The CodeDeploy agent is installed and running, but deployments fail because the agent cannot communicate with CodeDeploy.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create interface endpoints for codedeploy and codedeploy-commands-secure, set :enable_auth_policy: to true in the agent configuration, and add the codedeploy-commands-secure actions to the instance profile.
    - id: b
      text:
        en: |-
          Create interface endpoints for codedeploy and codedeploy-commands-secure, keep the default agent configuration, and add the AWSCodeDeployRole managed policy to the instance profile.
    - id: c
      text:
        en: |-
          Create an interface endpoint for codedeploy only, set :proxy_uri: in the agent configuration to the DNS name of the endpoint, and restart the agent.
    - id: d
      text:
        en: |-
          Create interface endpoints for codedeploy and codedeploy-commands-secure, set :use_fips_mode: to true in the agent configuration, and restart the agent.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      EC2 deployments through AWS PrivateLink need interface endpoints for both com.amazonaws.region.codedeploy and com.amazonaws.region.codedeploy-commands-secure. The agent must use IAM authorization (:enable_auth_policy: true), and the instance profile must allow the codedeploy-commands-secure actions such as PollHostCommand and PutHostCommandComplete.
  options:
    b:
      en: |-
        With the default :enable_auth_policy: false the agent cannot use the VPC endpoints, and AWSCodeDeployRole is the policy for the CodeDeploy service role, not for instances.
    c:
      en: |-
        :proxy_uri: is for an HTTP proxy, not a VPC endpoint, and EC2 deployments also need the codedeploy-commands-secure endpoint.
    d:
      en: |-
        FIPS mode selects FIPS endpoints in US Regions; it does not enable the IAM authorization that the agent needs to use the VPC endpoints.
references:
  - title: Use CodeDeploy with Amazon Virtual Private Cloud - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/vpc-endpoints.html
  - title: CodeDeploy agent configuration reference - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-agent-configuration.html
