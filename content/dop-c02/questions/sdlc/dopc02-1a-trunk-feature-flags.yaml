id: dopc02-1a-trunk-feature-flags
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A product team keeps a feature branch for each new feature, and some branches live for several months. Merging these branches into the main branch causes large conflicts and risky releases that contain many changes at once. The team wants every developer to integrate code into the main branch several times a day, even when a feature is not finished, without exposing unfinished features to customers. Product managers must be able to turn a finished feature on for customers at launch time, and turn it off immediately if issues occur, without a new deployment of the application.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Adopt trunk-based development with short-lived branches, and wrap unfinished features in AWS AppConfig feature flags that the application reads at runtime.
    - id: b
      text:
        en: |-
          Keep one branch per feature, and add AWS CodePipeline triggers with branch filters that deploy each feature branch to production when the feature is complete.
    - id: c
      text:
        en: |-
          Merge each feature into the main branch only at launch time, and use AWS CodeDeploy blue/green deployments so that the previous version can be restored quickly.
    - id: d
      text:
        en: |-
          Store an on/off switch for each feature in the environment variables of the application's AWS Lambda functions, and change the variables through the pipeline at launch.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Trunk-based development keeps branches short-lived so that code is integrated into the main branch continuously. AWS AppConfig feature flags let the team deploy code that stays hidden until the flag is enabled, then enable or disable the feature in real time without redeploying the application.
  options:
    b:
      en: |-
        Long-lived feature branches remain, so the merge conflicts and large releases do not go away, and launching a feature still requires a deployment.
    c:
      en: |-
        Merging only at launch is the opposite of integrating several times a day, and turning a feature off would require a redeployment or a rollback instead of a switch.
    d:
      en: |-
        Changing Lambda environment variables through the pipeline is a new deployment of the function configuration, so features cannot be switched on or off without a deployment.
references:
  - title: What is AWS AppConfig? - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/what-is-appconfig.html
