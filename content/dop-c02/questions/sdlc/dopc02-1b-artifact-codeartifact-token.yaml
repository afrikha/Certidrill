id: dopc02-1b-artifact-codeartifact-token
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodeBuild projects download Maven dependencies from an AWS CodeArtifact repository in the same account. An engineer generates a CodeArtifact authorization token on a laptop twice a day and pastes it into a plaintext environment variable of each project. Builds fail whenever the engineer forgets to refresh the token. The security team forbids storing package repository credentials, and the company wants no manual steps.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the token in AWS Secrets Manager, rotate it every 12 hours with a rotation Lambda function that calls GetAuthorizationToken, and reference the secret in the environment variables of each project.
    - id: b
      text:
        en: |-
          In the pre_build phase, run aws codeartifact get-authorization-token with the project's service role, which allows codeartifact:GetAuthorizationToken and sts:GetServiceBearerToken, and export the token.
    - id: c
      text:
        en: |-
          Add sts:GetServiceBearerToken for the projects' service roles to the CodeArtifact domain policy so that the builds can download packages without a token.
    - id: d
      text:
        en: |-
          Generate a token with --duration-seconds set to 43200 and store it as a SecureString parameter in AWS Systems Manager Parameter Store.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Each build can request its own short-lived token with the service role, so no credential is stored and nothing must be refreshed by hand. GetAuthorizationToken requires both codeartifact:GetAuthorizationToken and sts:GetServiceBearerToken, and keeping the token in an environment variable avoids writing it to a file.
  options:
    a:
      en: |-
        A stored and rotated secret is still a stored credential, and the rotation function is custom code to maintain.
    c:
      en: |-
        sts:GetServiceBearerToken has no effect in a domain policy, and package managers still need a token to authenticate.
    d:
      en: |-
        43,200 seconds is the 12-hour maximum, so the stored token still expires and must be refreshed.
references:
  - title: AWS CodeArtifact authentication and tokens - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/tokens-authentication.html
