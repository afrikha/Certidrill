id: dopc02-1a-deployment-window-entry
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company uses an AWS CodePipeline pipeline of type V2 to release an application. Developers merge changes throughout the day, and each execution passes through build, test, and production stages. A new change-management policy allows production deployments only on weekdays between 09:00 and 16:00 in the America/New_York time zone. Executions that reach the production stage outside that window must not deploy to production. The release process must remain automated, and the company does not want to write or maintain custom code.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Add an on-success condition with a DeploymentWindow rule to the production stage so that the stage is rolled back when it completes outside the allowed window.
    - id: b
      text:
        en: |-
          Add an entry condition with a DeploymentWindow rule to the production stage, with a cron expression for the allowed days and hours and the America/New_York time zone.
    - id: c
      text:
        en: |-
          Create two EventBridge Scheduler schedules that invoke AWS Lambda functions to disable and enable the transition into the production stage at 16:00 and 09:00.
    - id: d
      text:
        en: |-
          Add a manual approval action at the start of the production stage and instruct the approvers to approve executions only inside the allowed window.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Stage conditions are available in V2 pipelines. An entry condition is evaluated before the stage starts, and the DeploymentWindow rule succeeds only when the current date and time match its cron expression in the configured time zone, so the production stage is not entered outside the window. No custom code is needed.
  options:
    a:
      en: |-
        An on-success condition is evaluated after the stage has already deployed to production, so a deployment outside the window has already happened before the rule acts.
    c:
      en: |-
        Toggling stage transitions on a schedule works, but it requires Lambda functions and schedules that the company must write and maintain.
    d:
      en: |-
        A manual approval relies on people respecting the window and makes the release process manual, which the company does not want.
references:
  - title: DeploymentWindow - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/rule-reference-DeploymentWindow.html
  - title: Configure conditions for a stage - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/stage-conditions.html
