id: dopc02-1a-amplify-pr-previews
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A front-end team hosts a static React application on AWS Amplify Hosting. The app is connected to a private GitHub repository through the Amplify GitHub App, and the main branch is deployed to production. Reviewers want every pull request that targets main to be deployed automatically to its own URL so that they can test the change before it is merged. Each review environment must be removed automatically when its pull request is closed.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Connect each feature branch to the Amplify app manually when its pull request is opened, and disconnect the branch after the pull request is merged.
    - id: b
      text:
        en: |-
          Create an AWS CodePipeline pull request trigger that deploys each pull request to its own S3 bucket and CloudFront distribution, and delete them with a Lambda function.
    - id: c
      text:
        en: |-
          Turn on web previews for pull requests on the main branch in the Amplify Hosting console, and keep the existing GitHub App connection.
    - id: d
      text:
        en: |-
          Create a password-protected review branch in the Amplify app, and ask developers to merge each pull request into the review branch before main.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amplify web previews deploy every pull request to a unique preview URL that is separate from the main site. When the pull request is closed, Amplify deletes the preview URL and any temporary backend linked to it. Each open pull request counts toward the Amplify quota of branches per app.
  options:
    a:
      en: |-
        Connecting and disconnecting branches by hand for every pull request is manual work that previews automate.
    b:
      en: |-
        Building per-pull-request infrastructure and cleanup code duplicates a managed Amplify feature.
    d:
      en: |-
        A single shared review branch mixes all pull requests in one environment instead of one URL per pull request.
references:
  - title: Web previews for pull requests - AWS Amplify Hosting
    url: https://docs.aws.amazon.com/amplify/latest/userguide/pr-previews.html
