id: dopc02-1a-cdk-bootstrap-trust
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses CDK Pipelines in a tooling account (111122223333) in us-east-1. The tooling account was bootstrapped, and the pipeline deploys its own stacks successfully. The DevOps engineer adds a stage to the AWS CDK app that deploys the application to a production account (444455556666) in us-east-1. The production stage fails because the pipeline cannot use the CDK deployment roles in the production account. The security team requires that CloudFormation deployments in the production account run with a customer managed policy named CdkDeployPolicy, which already exists in that account, instead of AdministratorAccess.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Bootstrap the production account in us-east-1 with --trust 111122223333 and --cloudformation-execution-policies set to the ARN of CdkDeployPolicy.
    - id: b
      text:
        en: |-
          Bootstrap the tooling account again with --trust 444455556666 so that the production account can accept deployments from the pipeline.
    - id: c
      text:
        en: |-
          Create an IAM user with CdkDeployPolicy in the production account, and pass its access keys to the pipeline's AWS CodeBuild actions as environment variables.
    - id: d
      text:
        en: |-
          Bootstrap the production account in us-east-1 with only --cloudformation-execution-policies set to CdkDeployPolicy, and add the pipeline role to the bootstrap bucket policy.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Every target environment of a CDK pipeline must be bootstrapped. The --trust option names the pipeline's account so that it can deploy into the environment, and --cloudformation-execution-policies sets the policy under which CloudFormation deployments run, which lets the company use a scoped policy instead of AdministratorAccess.
  options:
    b:
      en: |-
        Trust is declared in the target environment, not in the pipeline's account; bootstrapping the tooling account with the production account ID trusts in the wrong direction.
    c:
      en: |-
        Long-term access keys are not how CDK Pipelines deploy across accounts and create a credential that must be protected and rotated.
    d:
      en: |-
        Without --trust, the bootstrap roles in the production account do not trust the pipeline's account, so the deployment still fails.
references:
  - title: Continuous integration and delivery (CI/CD) using CDK Pipelines - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/cdk-pipeline.html
