id: dopc02-1d-applicationstop-previous-revision
objective: "1.4.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS CodeDeploy in-place deployments to release an application to 40 Amazon EC2 instances. Revision v14 was deployed successfully last week. Since then, a configuration management change renamed the operating system service that the ApplicationStop script of v14 stops, so that script now exits with an error. The team built revision v15 with a corrected ApplicationStop script, but the deployment of v15 fails on every instance in the ApplicationStop lifecycle event. The team must deploy v15 with the LEAST effort and without signing in to the instances.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the timeout of the ApplicationStop hook in the AppSpec file of v15, and create a new deployment of v15 to the same deployment group.
    - id: b
      text:
        en: |-
          Roll back the deployment group to revision v13, which has a valid ApplicationStop script, and then create a new deployment of v15.
    - id: c
      text:
        en: |-
          Create a new deployment of v15 with the option to not fail the deployment to an instance if the ApplicationStop lifecycle event fails.
    - id: d
      text:
        en: |-
          Create a second deployment group in the same application that targets the same instances, and deploy v15 to the new deployment group.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The agent runs ApplicationStop, BeforeBlockTraffic and AfterBlockTraffic from the AppSpec file and scripts of the last successful deployment, so the broken v14 script runs no matter what v15 contains. Creating the deployment with --ignore-application-stop-failures (or the matching console option) lets v15 install; once v15 succeeds, later deployments use its corrected script.
  options:
    a:
      en: |-
        ApplicationStop runs the v14 AppSpec file and script, so a change to the v15 AppSpec file has no effect, and the script fails because of the renamed service, not because of a timeout.
    b:
      en: |-
        A rollback is a new deployment that also starts with the ApplicationStop script of the last successful revision, v14, so it fails the same way.
    d:
      en: |-
        A second deployment group skips the old ApplicationStop script, but installing files that another deployment group already placed at the same paths fails with a file-already-exists error, and the instances would then belong to two deployment groups.
references:
  - title: Troubleshoot EC2/On-Premises deployment issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-deployments.html
  - title: AppSpec 'hooks' section - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html
