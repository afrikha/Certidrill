id: dopc02-1a-codebuild-reserved-fleet
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs several hundred AWS CodeBuild builds a day on on-demand EC2 compute. Developers complain that builds wait to be provisioned before they start. The builds also need a licensed compiler toolchain that takes 10 minutes to install in every build, and the company has packaged that toolchain in a custom Amazon Machine Image (AMI). The company accepts paying for build capacity that is sometimes idle, but it does not want to manage build servers itself.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Change the projects to AWS Lambda compute so that builds start in seconds, and install the toolchain in the install phase of the buildspec.
    - id: b
      text:
        en: |-
          Create a CodeBuild reserved capacity fleet that uses the custom AMI, and configure the build projects to run their builds on that fleet.
    - id: c
      text:
        en: |-
          Request a quota increase for the number of concurrent builds, and cache the toolchain installation files in an Amazon S3 cache.
    - id: d
      text:
        en: |-
          Launch an Auto Scaling group of Amazon EC2 instances from the custom AMI, and run the builds on them as Jenkins agents.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Reserved capacity fleets keep dedicated instances that remain idle and ready to process builds immediately, and they can use a custom AMI that meets CodeBuild's prerequisites. The fleet is charged while its instances are provisioned, which the company accepts, and CodeBuild still manages the instances.
  options:
    a:
      en: |-
        Lambda compute does not support custom runtime environments or tools that need root permissions, and installing the toolchain in every build keeps the 10-minute delay.
    c:
      en: |-
        More concurrent builds do not remove provisioning time, and caching installation files still leaves the toolchain to be installed in each build.
    d:
      en: |-
        A self-managed Jenkins agent fleet is build infrastructure that the company must operate, which it wants to avoid.
references:
  - title: Run builds on reserved capacity fleets - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/fleets.html
