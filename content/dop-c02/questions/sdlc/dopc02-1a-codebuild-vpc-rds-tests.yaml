id: dopc02-1a-codebuild-vpc-rds-tests
objective: "1.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS CodeBuild project runs integration tests that must connect to an Amazon RDS for PostgreSQL database in private subnets of a VPC. The tests also download npm packages from the public npm registry during the build. The VPC, which is owned by the same account, has public subnets with an internet gateway and private subnets. Today the project has no VPC configuration, so the tests cannot reach the database. The database's security group must not allow traffic from the internet.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure the project with the VPC's public subnets so that the build network interfaces receive public IP addresses for the npm downloads.
    - id: b
      text:
        en: |-
          Configure the project with private subnets whose route tables send internet-bound traffic to a NAT gateway in a public subnet.
    - id: c
      text:
        en: |-
          Add an inbound rule to the project's security group that allows PostgreSQL traffic from the database's security group.
    - id: d
      text:
        en: |-
          Assign a security group to the project, and allow inbound PostgreSQL traffic in the database's security group from the project's security group.
    - id: e
      text:
        en: |-
          Change the project to AWS Lambda compute, and attach the Lambda compute environment to the database subnets of the VPC.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      A VPC-enabled build should use private subnets, and it needs a NAT gateway or NAT instance to reach public endpoints such as the npm registry. The database's security group must allow the database port from the security group that is attached to the build's network interfaces; the build itself needs no inbound rules.
  options:
    a:
      en: |-
        CodeBuild cannot assign Elastic IP addresses to the network interfaces it creates, and public IP addresses are not assigned automatically to them, so a public subnet gives no internet access.
    c:
      en: |-
        The build opens the connection to the database, so the inbound rule belongs on the database's security group; AWS recommends no inbound rules for the builds.
    e:
      en: |-
        Lambda compute in CodeBuild does not support VPC connectivity.
references:
  - title: Use AWS CodeBuild with Amazon Virtual Private Cloud - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/vpc-support.html
