id: dopc02-1c-imagebuilder-golden-ami
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations team builds its golden AMI by hand every month: an engineer launches an instance, applies operating system updates, installs agents, runs a checklist, and creates an image. The process takes a day and sometimes misses steps. The company wants a managed AWS service that builds the AMI on a schedule from versioned definitions, tests it, and distributes it to other AWS Regions.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS OpsWorks stack with recipes that configure the instance, and create an image from an OpsWorks instance at the end of each monthly run.
    - id: b
      text:
        en: |-
          Add the update and installation commands to the user data of the launch templates, so that every new instance configures itself when it starts.
    - id: c
      text:
        en: |-
          Create an EC2 Image Builder pipeline with an image recipe, build and test components, an infrastructure configuration, distribution settings, and a monthly schedule.
    - id: d
      text:
        en: |-
          Create an AWS Backup plan that creates a monthly AMI of a reference instance and copies the recovery points to the other Regions.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      EC2 Image Builder automates the creation, testing, and distribution of AMIs. A pipeline combines a versioned image recipe (parent image and components), an infrastructure configuration for the build and test instances, and distribution settings for other Regions and accounts, and it runs on a schedule.
  options:
    a:
      en: |-
        AWS OpsWorks reached its full shutdown in May 2024 and cannot be used.
    b:
      en: |-
        User data configures each instance at boot instead of producing a tested image, which slows every launch and can drift over time.
    d:
      en: |-
        AWS Backup copies the state of an existing instance; it does not apply versioned build steps or run tests.
references:
  - title: "Manage recipes in Image Builder - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-recipes.html
  - title: "Use components to customize your Image Builder image - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-components.html
