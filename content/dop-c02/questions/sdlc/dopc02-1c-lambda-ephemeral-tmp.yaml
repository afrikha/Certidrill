id: dopc02-1c-lambda-ephemeral-tmp
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS Lambda function converts uploaded videos. During each invocation, the function writes up to 3 GB of intermediate files to /tmp and deletes them before it returns. Invocations of large videos now fail because /tmp runs out of space. The intermediate files are never shared between invocations. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the ephemeral storage setting of the function to 4,096 MB.
    - id: b
      text:
        en: |-
          Increase the memory setting of the function to 10,240 MB, so that /tmp grows with it.
    - id: c
      text:
        en: |-
          Connect the function to a VPC, and mount an Amazon EFS file system for the intermediate files.
    - id: d
      text:
        en: |-
          Add a Lambda layer that provides additional disk space to the function's execution environment.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The /tmp storage of a Lambda function can be configured from 512 MB to 10,240 MB. Raising it above the 3 GB of intermediate files is a single configuration change, which suits temporary data that is never shared.
  options:
    b:
      en: |-
        Memory and ephemeral storage are separate settings; more memory adds CPU, not /tmp space.
    c:
      en: |-
        EFS works, but it adds VPC networking, a file system, and mount targets for data that is only temporary.
    d:
      en: |-
        Layers add code and libraries to the deployment package; they do not provide writable disk space.
references:
  - title: "Lambda quotas - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
