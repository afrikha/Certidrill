id: dopc02-1a-s3-source-versioning
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A partner delivers application bundles to a company by uploading a file named app-bundle.zip to an Amazon S3 bucket. The company wants an AWS CodePipeline pipeline to start whenever a new app-bundle.zip file is uploaded and to use that file as the source artifact. The pipeline will use an Amazon S3 source action.

    How should the company configure the source bucket?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on S3 Transfer Acceleration so that CodePipeline detects the uploaded object faster.
    - id: b
      text:
        en: |-
          Turn on S3 Object Lock in governance mode so that each uploaded bundle is kept unchanged.
    - id: c
      text:
        en: |-
          Configure an S3 event notification that publishes to an Amazon SNS topic that starts the pipeline.
    - id: d
      text:
        en: |-
          Turn on versioning, and have the partner upload the bundle as a single ZIP file with that object key.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The S3 source action requires a source bucket with versioning enabled, and the source files are uploaded as a single ZIP file whose object key is configured in the action. Change detection uses an Amazon EventBridge rule that the console creates, or polling.
  options:
    a:
      en: |-
        Transfer Acceleration speeds up long-distance uploads; it has no role in detecting source changes.
    b:
      en: |-
        Object Lock protects object versions from deletion but is not what the source action requires.
    c:
      en: |-
        The S3 source action detects changes through EventBridge or polling; an SNS topic cannot start the pipeline by itself.
references:
  - title: Amazon S3 source action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-S3.html
