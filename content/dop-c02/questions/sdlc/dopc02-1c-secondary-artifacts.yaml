id: dopc02-1c-secondary-artifacts
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company releases a web application with AWS CodePipeline. A single AWS CodeBuild action compiles the application and must hand two different outputs to later actions. A packaged AWS CloudFormation template with its parameter files goes to a CloudFormation deploy action. A folder of static web assets goes to an Amazon S3 deploy action that extracts the files into a website bucket. The build takes 25 minutes, so the company does not want it to run more than once per pipeline execution. Each deploy action must receive only the files that it needs.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Define one output artifact on the build action that contains both folders, and set `discard-paths: yes` in the buildspec so that each deploy action reads only the files that it needs from the artifact.
    - id: b
      text:
        en: |-
          Define two output artifacts on the build action, declare them under `secondary-artifacts` in the buildspec with identifiers that match the output artifact names, and give each deploy action its matching artifact.
    - id: c
      text:
        en: |-
          Add a second CodeBuild action to the same stage that uses the same project with a different buildspec file, so that each of the two actions produces one of the two outputs.
    - id: d
      text:
        en: |-
          List the paths of the two output folders under `exported-variables` in the buildspec, and reference the variables in the input configuration of each deploy action.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A CodeBuild action in CodePipeline can produce up to five output artifacts. When there is more than one, each output is defined as a secondary artifact in the buildspec, and the CodePipeline output artifact names must match the buildspec identifiers (the `artifacts/files` sequence is still required). The build runs once, and each deploy action consumes only its own artifact.
  options:
    a:
      en: |-
        `discard-paths` only flattens the directory structure of one artifact. Both deploy actions would still receive every file, and the S3 deploy action would publish the templates to the website bucket.
    c:
      en: |-
        Two actions run two builds of 25 minutes each, which breaks the requirement to build only once per pipeline execution.
    d:
      en: |-
        Exported variables pass short string values to later actions; they cannot carry files, and deploy actions read files only from input artifacts.
references:
  - title: "AWS CodeBuild build and test action reference - AWS CodePipeline"
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodeBuild.html
  - title: "Build specification reference for CodeBuild - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
