id: dopc02-1a-codebuild-github-actions-runner
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses GitHub Actions workflows for continuous integration on GitHub-hosted runners. Some jobs now need to reach resources in a private VPC and to call AWS APIs. The security team forbids storing long-term AWS access keys as GitHub secrets. The company does not want to operate its own runner fleet and does not want to rewrite the workflows. Each job must run on a fresh environment that is discarded when the job ends.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Launch an Amazon EC2 Auto Scaling group in the VPC with an instance profile, and register the instances as self-hosted runners for the repository.
    - id: b
      text:
        en: |-
          Rewrite the workflows as buildspec files, and run them in AWS CodeBuild projects that an AWS CodePipeline pipeline starts on every push.
    - id: c
      text:
        en: |-
          Create a CodeBuild runner project in the VPC with a WORKFLOW_JOB_QUEUED webhook, and set runs-on in the jobs to the codebuild-<project-name> runner label.
    - id: d
      text:
        en: |-
          Create an IAM user with the required permissions, store its access keys in a GitHub environment, and connect the GitHub-hosted runners to the VPC through a VPN.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CodeBuild can host self-hosted GitHub Actions runners: a runner project receives WORKFLOW_JOB_QUEUED events from a webhook and starts a build that runs one ephemeral runner for each job, which ends when the job completes. The job's runs-on label contains the project name with the run ID and run attempt, and the project's VPC configuration and service role give access to private resources and AWS APIs without stored keys.
  options:
    a:
      en: |-
        An Auto Scaling group of runners is a fleet that the company must operate, patch, and scale, and its instances are not discarded after each job.
    b:
      en: |-
        Moving to buildspec files means rewriting the workflows, which the company does not want.
    d:
      en: |-
        Storing long-term access keys in GitHub is forbidden by the security team, and a VPN for hosted runners adds infrastructure to operate.
references:
  - title: "Tutorial: Configure a CodeBuild-hosted GitHub Actions runner - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/action-runner.html
