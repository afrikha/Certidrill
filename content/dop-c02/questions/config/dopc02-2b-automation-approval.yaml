id: dopc02-2b-automation-approval
objective: "2.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An operations team is writing a Systems Manager Automation runbook that restarts the primary database of a critical application in a single account and Region. Before the restart, the runbook must pause until one of two on-call engineers, who sign in with IAM roles, approves it. The engineers must receive an email when an approval is needed. If nobody approves within 2 hours, the runbook must stop without restarting the database.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add an aws:approve step before the restart with the two role ARNs as approvers, a minimum of one approval, a timeout of 7,200 seconds, and onFailure set to Abort.
    - id: b
      text:
        en: |-
          Create a Systems Manager Change Manager change template that requires approval from the on-call engineers before it runs the runbook.
    - id: c
      text:
        en: |-
          Create an SNS topic whose name starts with Automation, subscribe the engineers' email addresses, and set the topic as the notification ARN of the approval step.
    - id: d
      text:
        en: |-
          Add an aws:sleep step of 2 hours before the restart, and ask the engineers to cancel the execution from the console if they do not approve.
    - id: e
      text:
        en: |-
          Start the runbook as a multi-account and multi-Region automation from the Operations account, so that the approval step can be answered from that account.
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      The aws:approve action pauses an automation until the designated principals, which can be IAM role ARNs, approve or reject it, and it resumes once the minimum number of approvals is reached. Its timeout is set with timeoutSeconds, and Abort stops the runbook if the step fails or times out. Approval notifications go to the SNS topic in NotificationArn, whose name must begin with Automation.
  options:
    b:
      en: |-
        Change Manager has been closed to new customers since November 7, 2025, so it should not be used in a new design.
    d:
      en: |-
        A sleep step only waits; the restart would run after 2 hours unless someone intervenes, which is the opposite of the requirement.
    e:
      en: |-
        The aws:approve action does not support multi-account and Region automations.
references:
  - title: aws:approve – Pause an automation for manual approval - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-approve.html
