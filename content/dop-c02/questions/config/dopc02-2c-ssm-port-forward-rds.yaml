id: dopc02-2c-ssm-port-forward-rds
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL DB instance in private subnets of a VPC. Developers must sometimes connect to the database from their laptops with a desktop SQL client. The security team requires that no security group allows inbound traffic from the internet, that no SSH keys are distributed, and that access is granted and revoked with IAM policies. An Amazon EC2 instance in the same VPC is already a Systems Manager managed node with a recent SSM Agent, and its security group can reach the database on port 3306. The developers have the AWS CLI and the Session Manager plugin installed.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Start a Session Manager session with the AWS-StartPortForwardingSession document that targets the identifier of the DB instance and forwards local port 3306 to port 3306.
    - id: b
      text:
        en: |-
          Start a Session Manager session with the AWS-StartPortForwardingSessionToRemoteHost document that targets the managed EC2 instance, with the DB endpoint as the host and 3306 as the port.
    - id: c
      text:
        en: |-
          Set up AWS Client VPN in the VPC with certificate-based authentication, and let the developers connect to the DB endpoint over the VPN tunnel.
    - id: d
      text:
        en: |-
          Move the managed EC2 instance to a public subnet, allow SSH from the office IP range, and let the developers open SSH tunnels to the DB endpoint.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Session Manager can forward a local port to a remote host through a managed node; the remote host does not need to be a managed node itself. The session uses outbound connections from SSM Agent, so no inbound port or SSH key is needed, and access is controlled with IAM policies on ssm:StartSession.
  options:
    a:
      en: |-
        A Session Manager target must be a managed node. The DB instance is not one, so the session must target the EC2 instance and name the database as the remote host.
    c:
      en: |-
        Client VPN works, but it adds an endpoint, certificates, and client software to manage, which is more overhead than reusing the existing managed node.
    d:
      en: |-
        SSH tunnels need an inbound SSH rule and distributed SSH keys, which the security team forbids.
references:
  - title: Start a session - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-working-with-sessions-start.html
  - title: AWS Systems Manager Session Manager - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html
