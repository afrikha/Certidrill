id: dopc02-2b-move-account-between-orgs
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is selling a business unit, and the unit's AWS account must move from the company's organization to the buyer's organization. The account is currently the delegated administrator for Amazon GuardDuty in the company's organization. It was created through AWS Organizations two years ago and has never had its own payment method or support plan. The buyer's management account has already sent an invitation to the account.

    Which sequence of actions will move the account to the buyer's organization?
body:
  options:
    - id: a
      text:
        en: |-
          Accept the buyer's invitation from the account; AWS Organizations removes the account from the company's organization when it joins the buyer's organization.
    - id: b
      text:
        en: |-
          Remove the account from the company's organization, then add a payment method and a support plan to it, and then accept the buyer's invitation.
    - id: c
      text:
        en: |-
          Deregister the account as the GuardDuty delegated administrator, add the standalone account information, remove it from the organization, and accept the buyer's invitation.
    - id: d
      text:
        en: |-
          Close the account, have the buyer create a new account in its organization, and restore the business unit's workload there from AWS Backup copies.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An account can be removed from an organization only when it has the information needed to operate as a standalone account, such as a payment method, verified contact information, and a support plan. It also cannot be a delegated administrator for a service enabled in the organization, so it must be deregistered first. After it leaves, it can accept the pending invitation from the buyer's organization.
  options:
    a:
      en: |-
        An account belongs to only one organization, and there is no direct transfer: it must leave the current organization before it can join another one.
    b:
      en: |-
        The removal would fail, because the account lacks the standalone information and is still a delegated administrator.
    d:
      en: |-
        Closing the account and rebuilding the workload is unnecessary and disruptive, because the account itself can move.
references:
  - title: Removing a member account from an organization with AWS Organizations - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_accounts_remove.html
