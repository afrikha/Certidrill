id: dopc02-2a-sam-canary-hooks
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company deploys an AWS Lambda function behind Amazon API Gateway with an AWS SAM template. The function has been deployed several times, and API Gateway invokes it without a qualifier. For the next releases, 10 % of the traffic must go to the new version for 10 minutes before all traffic shifts. A test function must check the new version before any traffic reaches it. The release must roll back automatically if an Amazon CloudWatch alarm on the function's errors fires, with the LEAST custom code.

    Which combination of changes should the DevOps engineer make to the SAM template? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the AutoPublishAlias property of the function to live, and make the API Gateway integration invoke the live alias.
    - id: b
      text:
        en: |-
          Add canary settings with a 10 % traffic share to the API Gateway stage, and promote the canary after 10 minutes if the alarm has not fired.
    - id: c
      text:
        en: |-
          Add a DeploymentPreference with the Type Canary10Percent10Minutes, the error alarm under Alarms, and the test function as the PreTraffic hook.
    - id: d
      text:
        en: |-
          Add a DeploymentPreference with the Type Linear10PercentEvery10Minutes, the error alarm under Alarms, and the test function as the PostTraffic hook.
    - id: e
      text:
        en: |-
          Add an AWS::CodeDeploy::DeploymentGroup resource for the ECS compute platform that references the function and the error alarm.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      AutoPublishAlias makes SAM publish a new version on each code change and point an alias at it, and the caller must invoke the alias for traffic shifting to apply. DeploymentPreference makes SAM create the CodeDeploy resources: Canary10Percent10Minutes sends 10 % first and the rest after 10 minutes, the PreTraffic hook runs before traffic shifts, and the alarms trigger a rollback.
  options:
    b:
      en: |-
        A stage canary has no pre-traffic test hook or automatic alarm rollback, so promotion and rollback would need custom work.
    d:
      en: |-
        A linear configuration shifts 10 % every 10 minutes, not 10 % and then the rest, and a PostTraffic hook runs only after all traffic has shifted.
    e:
      en: |-
        Lambda deployments use the Lambda compute platform, and SAM creates the CodeDeploy application and deployment group itself when DeploymentPreference is set.
references:
  - title: Deploying serverless applications gradually with AWS SAM - AWS Serverless Application Model
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html
