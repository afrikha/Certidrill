id: dopc02-2a-sam-local-testing
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company is building a serverless API with AWS Lambda functions, Amazon API Gateway, and an Amazon DynamoDB table. The developers find raw AWS CloudFormation resource definitions for functions, permissions, and API routes too verbose. They want a shorter template syntax for serverless resources that CloudFormation still deploys. Before they push a change, they also want to run each function on their workstations with sample API Gateway events. Every developer workstation already has Docker installed.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Define the resources with AWS::Lambda::Function and AWS::ApiGateway::RestApi resources, and test each change by deploying a personal development stack and calling its API.
    - id: b
      text:
        en: |-
          Package the function and its API routes as a CloudFormation module in the registry, and test each change by creating a change set for a development stack.
    - id: c
      text:
        en: |-
          Write the templates in the AWS CDK, and test each change by running cdk diff against the development account before the developers push the change.
    - id: d
      text:
        en: |-
          Write an AWS SAM template with AWS::Serverless::Function resources and Api events, and test each function with sam local invoke and generated sample events.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS SAM adds the AWS::Serverless transform, whose resource types expand into the full Lambda, permission, and API Gateway resources at deployment, so the templates stay short and CloudFormation still deploys them. The SAM CLI runs a function locally in a Docker container with sam local invoke, and sam local generate-event creates sample API Gateway events to pass with --event.
  options:
    a:
      en: |-
        Raw CloudFormation resources are the verbose syntax that the developers want to avoid, and deploying a stack for every change is not local testing.
    b:
      en: |-
        A module packages reusable resources but does not run any function code; a change set only previews resource changes and tests nothing.
    c:
      en: |-
        cdk diff compares the synthesized template with the deployed stack; it does not invoke any function with a sample event.
references:
  - title: Introduction to testing with sam local invoke - AWS Serverless Application Model
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-local-invoke.html
