id: dopc02-2b-ct-lifecycle-event
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company provisions accounts with AWS Control Tower Account Factory. After each account is provisioned and its Control Tower baseline is in place, an idempotent AWS Step Functions workflow must register the account in the company's CMDB and create AWS Budgets alerts in it. Sometimes an account creation fails and an administrator retries it from the console. The workflow must start only after Control Tower has finished provisioning the account, and it must also run when a failed creation is retried successfully.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an EventBridge rule in the management account that matches the AWS Organizations CreateAccount API call recorded by CloudTrail, and target the workflow.
    - id: b
      text:
        en: |-
          Create an EventBridge rule in each new account that matches its first AWS Config configuration item change, and send the event to the workflow through a cross-account event bus.
    - id: c
      text:
        en: |-
          Create an EventBridge rule in the management account in the home Region that matches only the CreateManagedAccount lifecycle event, and target the workflow.
    - id: d
      text:
        en: |-
          Create an EventBridge rule in the management account in the home Region that matches successful CreateManagedAccount and UpdateManagedAccount lifecycle events, and target the workflow.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Control Tower lifecycle events mark the completion of an action and are delivered to EventBridge in the management account in the home Region, with a Succeeded or Failed state. When a failed account creation is retried, Control Tower records UpdateManagedAccount instead of CreateManagedAccount, so AWS advises matching both events. The workflow is idempotent, so running it after other account updates is harmless.
  options:
    a:
      en: |-
        The CreateAccount API call is recorded when account creation starts, before Control Tower has applied its baseline and controls.
    b:
      en: |-
        A Config configuration item does not indicate that Control Tower provisioning has finished, and the rule would have to exist in each account before the account is created.
    c:
      en: |-
        A retried creation emits UpdateManagedAccount, not CreateManagedAccount, so the workflow would not run for retried accounts.
references:
  - title: Lifecycle Events in AWS Control Tower - AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/userguide/lifecycle-events.html
