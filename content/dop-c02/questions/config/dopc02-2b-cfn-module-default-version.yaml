id: dopc02-2b-cfn-module-default-version
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's cloud center of excellence publishes a CloudFormation module named AnyCompany::Storage::SecureBucket::MODULE that creates an S3 bucket with encryption, versioning, and access logging. Application teams in 40 accounts and two Regions reference the module in their stack templates. A service-managed StackSet registers the module in every account and Region with an AWS::CloudFormation::ModuleVersion resource. The team has built a new module package that adds a bucket policy that denies requests that do not use TLS. The new version must be used by every application stack the next time the stack is updated, and every account and Region must resolve the same module version.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Register the new package once in the StackSet administrator account, because CloudFormation shares the latest registered module version with every account in the organization.
    - id: b
      text:
        en: |-
          Update the ModulePackage property of the ModuleVersion resource in the StackSet, and ask the teams to update their stacks with the option to use the previous template.
    - id: c
      text:
        en: |-
          Register the new package in every account and Region, and set it as the default version only in the StackSet administrator account, which the other accounts use as their reference.
    - id: d
      text:
        en: |-
          Update the StackSet so that it registers the new package and adds an AWS::CloudFormation::ModuleDefaultVersion resource for it, and have the teams update their stacks normally.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A stack operation uses the module version that is the default in the account and Region where the operation runs, and the first registered version stays the default until another version is explicitly set as default. Registering the new version and setting it as default through the StackSet makes every account and Region resolve the same version. Changing the default does not update stacks, but the next normal stack update reprocesses the template with the new default version.
  options:
    a:
      en: |-
        Modules are private extensions registered per account and Region. Registering a version in one account does not make it available in the other accounts.
    b:
      en: |-
        The new version would be registered but would not become the default, and an update that uses the previous template reuses the previously processed template without reprocessing the module.
    c:
      en: |-
        The default version is a setting of each account and Region. Stacks in other accounts and Regions use their own default version, not the one in the administrator account.
references:
  - title: Understand module versioning - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/module-versioning.html
  - title: AWS::CloudFormation::ModuleVersion - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-cloudformation-moduleversion.html
