id: dopc02-2c-inventory-installed-software
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs 800 Amazon EC2 instances that are Systems Manager managed nodes in one account and Region. A vendor announces a critical flaw in one version of a logging library package. The operations team must find which instances have that package version installed, and it wants the same answer to be available for future questions without writing scripts.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Set up Systems Manager Inventory to collect application data from all managed nodes, and filter the inventory by application name and version.
    - id: b
      text:
        en: |-
          Run a shell script on all instances with Run Command each time the question arises, and search the command output for the package version.
    - id: c
      text:
        en: |-
          Search the AWS CloudTrail event history for the API calls that installed the package version on the instances.
    - id: d
      text:
        en: |-
          Turn on VPC Flow Logs, and query the logs for connections to the package repository that distributes the affected version.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Systems Manager Inventory collects metadata from managed nodes, including installed applications and their versions, on a schedule. The data can be filtered or queried at any time without running a script, so later questions are answered the same way.
  options:
    b:
      en: |-
        A Run Command script works once, but it must be written and rerun for every new question, which is the scripting the team wants to avoid.
    c:
      en: |-
        Packages are installed inside the operating system, not through AWS API calls, so CloudTrail does not record them.
    d:
      en: |-
        Flow logs show network connections, not which package version is installed, and an instance can have the package without a recent download.
references:
  - title: Recording Software Configuration for Managed Instances with AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/recording-managed-instance-inventory.html
