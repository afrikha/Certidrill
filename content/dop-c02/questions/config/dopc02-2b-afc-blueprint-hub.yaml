id: dopc02-2b-afc-blueprint-hub
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Control Tower with eu-west-1 as its home Region. The platform team wants every new account in the Workloads OU to be created with a standard VPC, IAM roles, and a budget that are defined in a CloudFormation template. The customization must be selected when an account is created or enrolled from the Control Tower console. The team does not want to build or maintain any pipeline, and it follows the AWS recommendations for where customization artifacts are stored.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy Customizations for AWS Control Tower (CfCT), and add the template and a manifest entry that targets the Workloads OU to its configuration repository.
    - id: b
      text:
        en: |-
          Create the template as an AWS Service Catalog product in the management account in us-east-1, and select it as the blueprint when accounts are created in Account Factory.
    - id: c
      text:
        en: |-
          Create the template as an AWS Service Catalog product in a dedicated hub account in eu-west-1, add the AWSControlTowerBlueprintAccess role, and select it as the blueprint in Account Factory.
    - id: d
      text:
        en: |-
          Deploy Account Factory for Terraform (AFT), and convert the template into Terraform configuration that runs as an account customization for the Workloads OU.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Account Factory Customization (AFC) applies a blueprint, which is an AWS Service Catalog product, when an account is created, enrolled, or updated from the Control Tower console, so no pipeline is needed. The blueprint must be in a hub account in the landing zone home Region, AWS strongly recommends not using the management account as the hub account, and the AWSControlTowerBlueprintAccess role must exist with the required name and trust policy.
  options:
    a:
      en: |-
        CfCT deploys customizations through a CodePipeline-based pipeline that the team would have to maintain, and it is not selected per account in the Control Tower console.
    b:
      en: |-
        Blueprints must be in the home Region (eu-west-1), and AWS recommends against using the management account as the hub account.
    d:
      en: |-
        AFT is a Terraform pipeline that the team would have to deploy and maintain, which the team wants to avoid.
references:
  - title: Customize accounts with Account Factory Customization (AFC) - AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/userguide/af-customization-page.html
