id: dopc02-2c-sfn-callback-approval
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company orchestrates its database maintenance automation with AWS Step Functions Standard workflows. A new requirement states that, before the maintenance step runs, the workflow must open a change ticket in a third-party IT service management (ITSM) system and wait until the ticket is approved, which can take up to 5 days. The ITSM system can call an Amazon API Gateway webhook when the ticket is approved or rejected. The company wants no polling and no compute charges while the workflow waits.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a loop of a Wait state of 10 minutes and a Lambda task that calls the ITSM API to read the ticket status, and exit the loop when the ticket is approved.
    - id: b
      text:
        en: |-
          Convert the workflow to an Express workflow, and add a Lambda task with the .waitForTaskToken suffix that opens the ticket and waits for the webhook.
    - id: c
      text:
        en: |-
          Add a Lambda task that opens the ticket and then sleeps in a loop until the ITSM system reports that the ticket is approved, with the function timeout set to its maximum.
    - id: d
      text:
        en: |-
          Add a Lambda task with the .waitForTaskToken suffix that opens the ticket with the task token, and have the webhook call SendTaskSuccess or SendTaskFailure with that token.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The callback pattern pauses a Standard workflow until an external process returns the task token with SendTaskSuccess or SendTaskFailure, which suits human approvals and third-party systems. The wait can last up to the one-year execution limit, involves no polling, and runs no compute while it waits.
  options:
    a:
      en: |-
        A Wait and Lambda loop is polling, which the company wants to avoid, and every check invokes the function.
    b:
      en: |-
        Express workflows run for at most five minutes and do not support the .waitForTaskToken pattern.
    c:
      en: |-
        A Lambda function runs for at most 15 minutes per invocation and is charged while it sleeps, so it cannot wait 5 days for the approval.
references:
  - title: Discover service integration patterns in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
