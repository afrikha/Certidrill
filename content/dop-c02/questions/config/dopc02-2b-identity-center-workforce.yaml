id: dopc02-2b-identity-center-workforce
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 70 AWS accounts in AWS Organizations and 400 engineers whose identities are stored in an external SAML 2.0 identity provider that supports SCIM. Engineers need different levels of access in different accounts based on their group membership in the identity provider. Access must be removed automatically when an engineer leaves the company.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create IAM users for the engineers in a central identity account, and let them assume roles in the other accounts through cross-account trust policies.
    - id: b
      text:
        en: |-
          Create a SAML identity provider in IAM in each of the 70 accounts, and map the identity provider groups to IAM roles in each account.
    - id: c
      text:
        en: |-
          Create IAM users in each account with the permissions they need, and use AWS Config to find users who have not signed in for 90 days.
    - id: d
      text:
        en: |-
          Connect the identity provider to IAM Identity Center with SCIM provisioning, and assign permission sets to the identity provider groups for each account.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      IAM Identity Center connects once to the external identity provider, and SCIM keeps users and groups synchronized, so a departing engineer loses access when the provider disables the identity. Permission sets assigned to groups for each account become Identity Center-controlled roles in those accounts, and changes to a permission set propagate automatically.
  options:
    a:
      en: |-
        IAM users duplicate identities outside the identity provider, so departures must be handled by hand.
    b:
      en: |-
        Per-account SAML federation works, but it must be configured and maintained in all 70 accounts.
    c:
      en: |-
        Thousands of IAM users with long-term credentials are hard to manage, and detecting inactivity does not remove access when someone leaves.
references:
  - title: Manage AWS accounts with permission sets - AWS IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html
