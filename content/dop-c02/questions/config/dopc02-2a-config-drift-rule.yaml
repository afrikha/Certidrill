id: dopc02-2a-config-drift-rule
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank manages 12 AWS CloudFormation stacks in a production account. Operators sometimes change security group rules and AWS Lambda environment variables in the console during incidents, and these changes are not reported back to the infrastructure team. The bank requires continuous detection of every stack whose resources no longer match their templates, with a notification to the infrastructure team and a compliance history for auditors. AWS Config is already recording in the account. The bank wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule that matches AWS CloudTrail events for security group and Lambda API calls, and send the events to an Amazon SNS topic for the infrastructure team.
    - id: b
      text:
        en: |-
          Schedule an AWS Lambda function every hour that calls DetectStackDrift for each stack and publishes the drifted stacks to an Amazon SNS topic for the infrastructure team.
    - id: c
      text:
        en: |-
          Deploy the cloudformation-stack-drift-detection-check AWS Config managed rule with a role that can detect drift, and notify the team when a stack becomes NON_COMPLIANT.
    - id: d
      text:
        en: |-
          Turn on termination protection for all 12 stacks, and add a stack policy that denies Update:* on the security groups and the Lambda functions.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The managed rule runs drift detection on each CloudFormation stack, on configuration changes and periodically, and reports a stack as NON_COMPLIANT when its drift status is DRIFTED. AWS Config keeps the compliance history, and compliance change notifications can reach the team without any code to maintain.
  options:
    a:
      en: |-
        CloudTrail events show API calls, not whether a stack resource still matches its template, and they include the calls that CloudFormation itself makes during updates.
    b:
      en: |-
        A scheduled function is custom code to maintain, and it provides no compliance history for auditors.
    d:
      en: |-
        Stack policies and termination protection only control CloudFormation operations; they neither stop console changes nor detect drift.
references:
  - title: cloudformation-stack-drift-detection-check - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/cloudformation-stack-drift-detection-check.html
