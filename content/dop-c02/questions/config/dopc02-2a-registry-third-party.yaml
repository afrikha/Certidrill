id: dopc02-2a-registry-third-party
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An e-commerce company monitors its applications with a third-party SaaS monitoring product. The vendor has published a public resource type for its monitors in the AWS CloudFormation registry. The company wants to define the monitors in the same templates as the AWS resources of each application and deploy them in three accounts and two AWS Regions. The DevOps team does not want to write or maintain any provisioning code for the monitors. The team must receive the vendor's minor and patch fixes automatically, but a new major version must never be applied without a review.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a Lambda-backed custom resource to each template that calls the vendor's API to create, update, and delete the monitors, and store the vendor API key in AWS Secrets Manager.
    - id: b
      text:
        en: |-
          Download the vendor's resource type schema, build the handlers with the CloudFormation CLI, and register the type as a private extension in each account and Region with the submit command.
    - id: c
      text:
        en: |-
          Activate the vendor's public extension in each account and Region with an execution role, turn on automatic updates for minor versions, and reference the type name in the templates.
    - id: d
      text:
        en: |-
          Create a CloudFormation macro that transforms a vendor-specific section of each template into calls to the vendor's API, and deploy the macro in each account and Region.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A third-party public extension must be activated in each account and Region before templates can use it; activation can pass an execution role that grants the permissions the extension's handlers need. With automatic updates turned on, CloudFormation uses new minor and patch versions at the next stack operation, while major versions, which can contain breaking changes, must be adopted manually.
  options:
    a:
      en: |-
        A custom resource is provisioning code that the team must write and maintain, which the requirements exclude.
    b:
      en: |-
        Building and registering the handlers as a private extension makes the team maintain the provisioning code and its versions instead of using the vendor's published extension.
    d:
      en: |-
        A macro only transforms template text before processing; it does not manage the create, update, and delete lifecycle of the monitors and would still be custom code to maintain.
references:
  - title: Use third-party public extensions from the CloudFormation registry - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/registry-public.html
