id: dopc02-2a-appconfig-validators
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A fintech company stores the throttling settings of its payment API as a free-form JSON configuration in AWS AppConfig. Last month, a deployment with a misspelled key and a request limit higher than a downstream partner's contractual limit caused an outage. The company wants AppConfig to reject such a configuration before any target receives it. The structure and data types must be checked declaratively. The request limit must be compared with the partner's current limit, which only the partner's API returns.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a JSON Schema validator to the configuration profile that defines the allowed keys, required properties, and data types.
    - id: b
      text:
        en: |-
          Add an Amazon CloudWatch alarm on the API error rate to the AppConfig environment so that AppConfig rolls back a deployment that causes errors.
    - id: c
      text:
        en: |-
          Increase the bake time of the deployment strategy so that AppConfig monitors the deployment longer before it marks the deployment as complete.
    - id: d
      text:
        en: |-
          Add an AWS Lambda validator to the configuration profile that calls the partner's API and fails when the request limit is higher than the partner's limit.
    - id: e
      text:
        en: |-
          Create an AWS Config custom rule that evaluates the AppConfig configuration profile and marks it as noncompliant when the request limit is too high.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      AppConfig supports up to two validators per configuration profile and runs them when a deployment starts, before any target receives the data. A JSON Schema validator checks the structure and types declaratively, and a Lambda validator can run custom logic such as calling the partner's API; validation fails if the function throws an exception.
  options:
    b:
      en: |-
        An alarm-based rollback reacts after the bad configuration has reached targets, which is the outage the company wants to prevent.
    c:
      en: |-
        Bake time only extends alarm monitoring after the configuration has reached all targets; it validates nothing beforehand.
    e:
      en: |-
        AWS Config rules evaluate resource configurations after the fact and cannot block an AppConfig deployment.
references:
  - title: Understanding validators - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-configuration-and-profile-validators.html
