id: dopc02-2c-compliance-dashboard
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses Patch Manager to patch its managed nodes and State Manager associations to enforce their configuration. An operations manager wants one view in Systems Manager that shows, for each managed node, whether it is missing approved patches and whether its associations applied successfully, with the option to drill down into the noncompliant nodes.

    Which Systems Manager capability should the manager use?
body:
  options:
    - id: a
      text:
        en: |-
          Systems Manager Inventory, filtered on the installed applications of each managed node
    - id: b
      text:
        en: |-
          Systems Manager Run Command history, filtered on failed commands for each managed node
    - id: c
      text:
        en: |-
          Systems Manager Parameter Store, with one parameter per node that stores its last patch date
    - id: d
      text:
        en: |-
          Systems Manager Compliance, filtered on the noncompliant resources of each compliance type
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Systems Manager Compliance scans the fleet for patch compliance and configuration inconsistencies; by default it shows patching data from Patch Manager and association data from State Manager, and it lets you drill down into noncompliant resources.
  options:
    a:
      en: |-
        Inventory lists installed software and other metadata, but it does not evaluate patch or association compliance.
    b:
      en: |-
        Run Command history shows ad hoc command results, not the compliance status of patches and associations.
    c:
      en: |-
        Parameter Store stores configuration values; maintaining a parameter per node is a manual process that does not report compliance.
references:
  - title: AWS Systems Manager Compliance - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-compliance.html
