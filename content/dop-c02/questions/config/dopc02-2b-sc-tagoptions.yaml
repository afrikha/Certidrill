id: dopc02-2b-sc-tagoptions
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company provisions infrastructure for its business units through 30 AWS Service Catalog products in one portfolio. Finance requires that every provisioned product carry a CostCenter tag whose value is chosen from an approved list of six values. The same taxonomy must apply to every product in the portfolio, and the company does not want to edit the product templates.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an AWS Organizations tag policy that defines the CostCenter key and its six values, and enforce it for the CloudFormation stack resource type.
    - id: b
      text:
        en: |-
          Create TagOptions for the CostCenter key with the six approved values in the TagOption library, and associate them with the portfolio.
    - id: c
      text:
        en: |-
          Add a CostCenter parameter with the six values as AllowedValues to each product template, and pass it to the Tags property of every resource.
    - id: d
      text:
        en: |-
          Add a template constraint to each product that requires a CostCenter tag with one of the six values on every resource in the template.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      TagOptions are key-value pairs managed in AWS Service Catalog that define user-selectable values for allowed tags. When they are associated with a portfolio, Service Catalog applies them to every product provisioned from it, without any change to the templates.
  options:
    a:
      en: |-
        Tag policies standardize tags when resources are tagged, but untagged resources are not evaluated, so they do not make the tag mandatory.
    c:
      en: |-
        This would work only by editing all 30 templates, which the company wants to avoid.
    d:
      en: |-
        Template constraints narrow the allowed values of template parameters. They cannot add or require tags on the resources.
references:
  - title: AWS Service Catalog TagOption Library - AWS Service Catalog
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/tagoptions.html
  - title: Tag policies - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_tag-policies.html
