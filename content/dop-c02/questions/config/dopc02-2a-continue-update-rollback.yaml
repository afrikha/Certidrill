id: dopc02-2a-continue-update-rollback
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company runs a production AWS CloudFormation stack that contains an Amazon DynamoDB table with customer data, an Amazon SQS queue, and AWS Lambda functions. A stack update failed, and the rollback also failed because an operator had deleted a Lambda layer version outside CloudFormation that the previous function configuration needs. The stack is now in the UPDATE_ROLLBACK_FAILED state, and the layer version cannot be restored. The company must get the stack back to a state in which it can deploy a corrected template. The DynamoDB table and its data must not be affected.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a change set from the corrected template, review the changes for the Lambda function, and execute the change set on the stack.
    - id: b
      text:
        en: |-
          Continue the update rollback and skip the Lambda function that cannot be rolled back, then make the function consistent with the template before the next update.
    - id: c
      text:
        en: |-
          Change the pipeline's CloudFormation deploy action to REPLACE_ON_FAILURE mode, and run the pipeline again with the corrected template.
    - id: d
      text:
        en: |-
          Retry the stack operation with the Preserve successfully provisioned resources option so that CloudFormation provisions only the failed Lambda function.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For a stack in UPDATE_ROLLBACK_FAILED, ContinueUpdateRollback with the ResourcesToSkip parameter lets CloudFormation mark the resources that cannot roll back as UPDATE_COMPLETE and finish the rollback. Other resources such as the table are untouched; the skipped function must then be made consistent with the template, or later updates can fail.
  options:
    a:
      en: |-
        A change set cannot be created for a stack in UPDATE_ROLLBACK_FAILED; the rollback must be continued first.
    c:
      en: |-
        REPLACE_ON_FAILURE deletes a stack in a failed state and creates a new one, which would delete the DynamoDB table and its data.
    d:
      en: |-
        Preserving provisioned resources and retrying apply to stacks in CREATE_FAILED or UPDATE_FAILED; they do not recover a failed rollback.
references:
  - title: Troubleshooting CloudFormation - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/troubleshooting.html
  - title: Choose how to handle failures when provisioning resources - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stack-failure-options.html
