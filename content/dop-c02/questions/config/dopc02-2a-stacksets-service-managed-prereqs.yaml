id: dopc02-2a-stacksets-service-managed-prereqs
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has just created an organization in AWS Organizations with consolidated billing only and invited its 25 existing accounts. A DevOps engineer tries to create a stack set with service-managed permissions from the management account, but the option is not available. The engineer wants StackSets to create the required IAM roles in the member accounts. No delegated administrator is needed.

    Which combination of steps must the engineer take before the service-managed stack set can be created? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Enable all features in the organization from the management account, and have the member accounts approve the change.
    - id: b
      text:
        en: |-
          Create AWSCloudFormationStackSetExecutionRole in each member account with a trust policy for the management account.
    - id: c
      text:
        en: |-
          Activate trusted access with AWS Organizations from the StackSets page of the CloudFormation console in the management account.
    - id: d
      text:
        en: |-
          Register a member account as a delegated administrator for StackSets with the member.org.stacksets.cloudformation.amazonaws.com service principal.
    - id: e
      text:
        en: |-
          Create an AWS Config aggregator for the organization so that StackSets can discover the member accounts and their OUs.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Service-managed stack sets require all features in AWS Organizations; with consolidated billing only, they cannot be created. Trusted access must then be activated from the management account, which creates the service-linked role there, and StackSets creates the roles in member accounts when it deploys.
  options:
    b:
      en: |-
        Creating execution roles by hand is the self-managed model; service-managed stack sets create their own roles in member accounts.
    d:
      en: |-
        A delegated administrator is optional and itself requires trusted access first; the engineer works from the management account.
    e:
      en: |-
        StackSets reads accounts and OUs through its Organizations integration; an AWS Config aggregator plays no part.
references:
  - title: Activate trusted access for StackSets with AWS Organizations - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-activate-trusted-access.html
