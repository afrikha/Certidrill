id: dopc02-2c-state-mgr-cw-agent
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company requires the Amazon CloudWatch agent to be installed on every Amazon EC2 instance that has the tag Monitoring=Standard. All instances are Systems Manager managed nodes. Instances with the tag are launched every day, and administrators sometimes uninstall the agent while troubleshooting. The agent must be installed on new tagged instances and reinstalled where it was removed, without manual work.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run the AWS-ConfigureAWSPackage document once with Run Command on the tagged instances to install the AmazonCloudWatchAgent package.
    - id: b
      text:
        en: |-
          Add commands that install the CloudWatch agent to the user data of the launch templates that create the tagged instances.
    - id: c
      text:
        en: |-
          Create an AWS OpsWorks stack with a recipe that installs the CloudWatch agent, and register the tagged instances with the stack.
    - id: d
      text:
        en: |-
          Create a State Manager association that runs AWS-ConfigureAWSPackage to install AmazonCloudWatchAgent on the tagged instances on a schedule.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A State Manager association keeps managed nodes in a defined state: it runs when created, when a new node matching the targets comes online, and again on its schedule. With AWS-ConfigureAWSPackage and the AmazonCloudWatchAgent Distributor package, new tagged instances get the agent and removed agents are reinstalled at the next run.
  options:
    a:
      en: |-
        Run Command makes a one-time change; instances launched later or agents removed later are not covered.
    b:
      en: |-
        User data runs only at the first launch, so an agent removed later is not reinstalled.
    c:
      en: |-
        AWS OpsWorks reached end of life in May 2024 and is no longer available.
references:
  - title: Understanding how State Manager works - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/state-manager-about.html
  - title: AWS Systems Manager Distributor - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/distributor.html
