id: dopc02-2b-image-builder-golden-ami
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company needs a golden Amazon Linux AMI every month that contains the latest operating system patches, the CloudWatch agent, and the company's hardening settings. The AMI must pass automated tests before release. It must be available in us-east-1, eu-west-1, and ap-southeast-1 to all accounts in the Workloads OU. A launch template in each Region of the Shared Services account must reference the new AMI after each release.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Run Packer from a scheduled CodeBuild project, and use a Lambda function to copy the AMI to the Regions, grant launch permissions, and update the launch templates.
    - id: b
      text:
        en: |-
          Create an EC2 Image Builder pipeline with a monthly schedule, a recipe with build and test components, and distribution settings for the Regions, the OU, and the launch templates.
    - id: c
      text:
        en: |-
          Create an Amazon Data Lifecycle Manager AMI policy for a reference instance that creates an AMI every month, copies it to the Regions, and shares it with the accounts.
    - id: d
      text:
        en: |-
          Run the AWS-UpdateLinuxAmi Automation runbook monthly from a maintenance window, and then share and copy the resulting AMI with a second custom runbook.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An Image Builder pipeline builds the image on a schedule from a recipe whose components install software and run tests. Its distribution settings copy the AMI to other Regions, grant launch permissions to accounts, organizations, or OUs, and can update EC2 launch templates with the new AMI.
  options:
    a:
      en: |-
        Packer, CodeBuild, and Lambda form a custom pipeline that the team would have to build and maintain.
    c:
      en: |-
        Data Lifecycle Manager images an existing instance; it does not patch, install software, or test the image.
    d:
      en: |-
        A second custom runbook is needed for distribution and launch templates, which is more to maintain than Image Builder's built-in distribution.
references:
  - title: Manage Image Builder distribution settings - EC2 Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-distribution-settings.html
