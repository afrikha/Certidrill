id: dopc02-2c-cloud-control-api
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A platform team is building an internal self-service tool. The tool must create, read, update, delete, and list resources of more than 100 AWS resource types, and also some third-party resource types that the company has registered in the CloudFormation registry. Resources are created one at a time from a web form, and the team does not want each request to create or update a CloudFormation stack. The team wants to call one consistent set of API operations for every resource type instead of writing code against each service's own API.

    Which solution will meet these requirements with the LEAST development effort?
body:
  options:
    - id: a
      text:
        en: |-
          Use the AWS SDK clients of each service, and write an adapter class per resource type that maps the tool's operations to that service's API actions.
    - id: b
      text:
        en: |-
          Generate a CloudFormation template for each request, and deploy it as a new stack so that CloudFormation creates and tracks each resource.
    - id: c
      text:
        en: |-
          Use the AWS Resource Groups Tagging API to create, update, and list the resources by tag, and delete them by calling DeleteResource on each tag value.
    - id: d
      text:
        en: |-
          Use AWS Cloud Control API, and call CreateResource, GetResource, UpdateResource, DeleteResource, and ListResources with the type name and properties of each resource.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Cloud Control API exposes a standard set of create, read, update, delete, and list operations for AWS and third-party resource types, so the tool does not need code specific to each service. It does not require a stack, unlike CloudFormation, and it tracks asynchronous requests with GetResourceRequestStatus.
  options:
    a:
      en: |-
        Writing an adapter for more than 100 resource types against each service's own API is the most development effort, which is what the team wants to avoid.
    b:
      en: |-
        Deploying one stack per request is exactly the stack-based model that the team does not want, and it adds stack management to every request.
    c:
      en: |-
        The Resource Groups Tagging API reads and changes tags on existing resources; it cannot create, update, or delete the resources themselves.
references:
  - title: What is AWS Cloud Control API? - Cloud Control API
    url: https://docs.aws.amazon.com/cloudcontrolapi/latest/userguide/what-is-cloudcontrolapi.html
