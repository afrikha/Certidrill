id: dopc02-2b-ssm-automation-multi-account
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's Operations account is the delegated administrator for AWS Systems Manager in its organization. The team must run a custom Automation runbook once on all EC2 instances tagged Env=prod in the 30 accounts of the Workloads OU, in three Regions. The rollout must run in at most 10% of the account-Region pairs at a time. It must stop starting new account-Region pairs if more than two pairs fail. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use a service-managed StackSet to create a State Manager association for the runbook in each account and Region, with a concurrency of 10% and an error threshold of 2.
    - id: b
      text:
        en: |-
          From the Operations account, run Run Command against the Workloads OU in the three Regions with a maximum concurrency of 10% and a maximum error count of 2.
    - id: c
      text:
        en: |-
          Write a Lambda function in the Operations account that assumes a role in each account and starts the runbook in each Region in sequence, counting failures.
    - id: d
      text:
        en: |-
          Deploy the Automation execution role to the target accounts and the administration role to the Operations account, then start the runbook with target locations for the OU and Regions.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Automation can run a runbook from a central account across accounts, OUs, and Regions when the administration role is in the central account and the execution role is in every target account. Target locations select the OU and Regions, the targets select the Env=prod instances, and TargetLocationMaxConcurrency (10%) and TargetLocationMaxErrors (2) control the rollout across account-Region pairs. Targeting OUs works from the management account or a delegated administrator.
  options:
    a:
      en: |-
        State Manager associations apply a configuration on a schedule; a one-time run does not need an association in every account and Region, and their rate controls work per association, not across account-Region pairs.
    b:
      en: |-
        Run Command runs in the account and Region where it is called; it has no multi-account or OU targeting.
    c:
      en: |-
        Custom code that rebuilds multi-account orchestration and error counting adds overhead that the managed feature avoids.
references:
  - title: Running automations in multiple AWS Regions and accounts - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-automations-multiple-accounts-regions.html
