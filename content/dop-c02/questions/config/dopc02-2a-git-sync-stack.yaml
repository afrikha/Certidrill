id: dopc02-2a-git-sync-stack
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A small analytics team stores an AWS CloudFormation template and its parameter values in a GitHub repository. Today, an engineer runs the AWS CLI from a laptop to update the stack after each merge to the main branch, and updates are sometimes forgotten. The team wants the stack to be updated automatically whenever the template or the parameter file changes on the main branch. The team does not need build, test, or approval stages.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create a pipeline in AWS CodePipeline with a GitHub source action and a CloudFormation deploy action in CREATE_UPDATE mode for the stack.
    - id: b
      text:
        en: |-
          Configure a GitHub webhook that calls an AWS Lambda function through a function URL, and make the function call UpdateStack with the new template.
    - id: c
      text:
        en: |-
          Turn on Git sync for the stack with an AWS CodeConnections connection to the repository, and add a stack deployment file that holds the parameters.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge schedule that starts an AWS CodeBuild project every 15 minutes to clone the repository and run aws cloudformation deploy.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Git sync makes CloudFormation monitor a GitHub, GitLab, or Bitbucket repository for changes to a template and a stack deployment file that holds the parameters, and update the stack automatically when they change. It needs only a connection and the deployment file, with no pipeline, function, or build project to operate.
  options:
    a:
      en: |-
        A pipeline works, but it is an extra resource with its own roles and artifact store to operate when no build, test, or approval stage is needed.
    b:
      en: |-
        A webhook and a Lambda function are custom code that the team would have to secure and maintain.
    d:
      en: |-
        A scheduled build runs whether or not anything changed, delays updates by up to 15 minutes, and adds a build project to maintain.
references:
  - title: Syncing stacks with source code stored in a Git repository with Git sync - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/git-sync.html
