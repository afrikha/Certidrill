id: dopc02-2c-opsworks-chef-migration
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company used AWS OpsWorks Stacks until the service shut down, and it still has the Chef cookbooks that configured its Amazon Linux application servers. The cookbooks are stored as a .zip file in an S3 bucket. The servers are Systems Manager managed nodes. The company wants the cookbooks to run every night to bring the servers back to the desired state, and it wants the results reported in Systems Manager Compliance. The company wants the LEAST rework of its existing configuration code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a State Manager association that runs AWS-ApplyChefRecipes nightly with the S3 bucket as the source, the run list of the recipes, and a compliance severity.
    - id: b
      text:
        en: |-
          Rewrite the cookbooks as Ansible playbooks, and create a State Manager association that runs AWS-ApplyAnsiblePlaybooks nightly with a compliance severity.
    - id: c
      text:
        en: |-
          Create an AWS OpsWorks for Chef Automate server, upload the cookbooks to it, and register the servers as nodes that run chef-client nightly.
    - id: d
      text:
        en: |-
          Run the AWS-RunShellScript document with Run Command to install chef-client and run the cookbooks once on all the servers.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS-ApplyChefRecipes runs existing Chef cookbooks from Amazon S3, GitHub, Git, or HTTP sources on Linux managed nodes, installs the Chef client if needed, and reports results to Systems Manager Compliance (Custom:Chef by default). A State Manager association runs it on the nightly schedule.
  options:
    b:
      en: |-
        Rewriting the cookbooks in Ansible is the rework the company wants to avoid when Chef recipes can run as they are.
    c:
      en: |-
        All OpsWorks services, including OpsWorks for Chef Automate, are shut down and cannot be used.
    d:
      en: |-
        Run Command applies the configuration once; nothing runs it nightly or reports compliance.
references:
  - title: Creating associations that run Chef recipes - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state-manager-chef.html
