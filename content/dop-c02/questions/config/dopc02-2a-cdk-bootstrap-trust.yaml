id: dopc02-2a-cdk-bootstrap-trust
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a CDK Pipelines pipeline in a tools account (111111111111). The pipeline deploys an application to a production account (222222222222) in eu-west-1 and, since this week, also in us-east-1. Deployments to eu-west-1 succeed. The new us-east-1 deployment fails with the message "Policy contains a statement with one or more invalid principals". The security team requires CloudFormation in production to use a restricted IAM policy that it maintains, not AdministratorAccess.

    Which solution will fix the deployment?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM role with AdministratorAccess in the production account that trusts the tools account, and reference the role in the pipeline's deployment stage.
    - id: b
      text:
        en: |-
          Run cdk bootstrap for the tools account in us-east-1 with --trust 222222222222 so that the production account can read the pipeline's artifacts.
    - id: c
      text:
        en: |-
          Add a manual approval step before the us-east-1 stage, and redeploy the pipeline stack from a workstation with cdk deploy.
    - id: d
      text:
        en: |-
          Run cdk bootstrap for aws://222222222222/us-east-1 with --trust 111111111111 and --cloudformation-execution-policies set to the security team's policy ARN.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Every environment, meaning an account and Region pair, must be bootstrapped before the CDK can deploy to it, and the invalid principals error means the target environment lacks the bootstrap roles. Bootstrapping production in us-east-1 with --trust lets the pipeline account assume the deployment roles, and --cloudformation-execution-policies attaches the restricted policy to the CloudFormation execution role.
  options:
    a:
      en: |-
        CDK Pipelines deploy through the bootstrap roles of the target environment, not an arbitrary role, and AdministratorAccess violates the security requirement.
    b:
      en: |-
        Trust goes the other way: the target environment must trust the pipeline account, and the production environment in us-east-1 would still have no bootstrap resources.
    c:
      en: |-
        An approval step and a manual redeployment do not create the missing bootstrap roles in the target environment.
references:
  - title: Bootstrap your environment for use with the AWS CDK - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/bootstrapping-env.html
  - title: Continuous integration and delivery (CI/CD) using CDK Pipelines - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/cdk-pipeline.html
