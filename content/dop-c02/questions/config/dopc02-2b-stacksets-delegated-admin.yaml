id: dopc02-2b-stacksets-delegated-admin
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's platform team runs its infrastructure pipelines in a Deployment account in the Deployments OU. The pipelines must create and update StackSets that deploy baseline stacks to several OUs, including automatic deployment to accounts that join those OUs later. Security policy forbids the pipelines from using any credentials or roles in the management account. Trusted access between CloudFormation StackSets and AWS Organizations is already activated.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          From the management account, register the Deployment account as a StackSets delegated administrator, and have the pipelines create service-managed StackSets as the delegated administrator.
    - id: b
      text:
        en: |-
          Have the pipelines create self-managed StackSets in the Deployment account, and deploy the administration and execution roles to every target account in advance.
    - id: c
      text:
        en: |-
          Create a role in the management account that trusts the Deployment account, and have the pipelines assume it to create service-managed StackSets.
    - id: d
      text:
        en: |-
          Make the Deployment account the delegated administrator for AWS Organizations policy management, and have the pipelines create service-managed StackSets from it.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The management account can register up to five member accounts as StackSets delegated administrators. A delegated administrator creates and manages service-managed StackSets for the organization (calling the StackSets APIs as a delegated administrator), including automatic deployment to OUs, without using management account credentials.
  options:
    b:
      en: |-
        Self-managed StackSets target explicit accounts and do not support automatic deployment to accounts that join an OU later.
    c:
      en: |-
        The pipelines would use a role in the management account, which the security policy forbids.
    d:
      en: |-
        Delegated administration of AWS Organizations policies does not register the account for StackSets, so it cannot create service-managed StackSets.
references:
  - title: Register a delegated administrator member account - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-delegated-admin.html
