id: dopc02-2a-stacksets-auto-deploy-ou
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses AWS Organizations with all features enabled and has 60 accounts in a Workloads organizational unit (OU). The security team has an AWS CloudFormation template that creates a read-only audit IAM role and an Amazon SNS topic for security alerts. The template must be deployed to every account in the Workloads OU in two AWS Regions. Accounts that are added to the OU later must receive the stacks automatically. The team does not want to create IAM roles in each account by hand.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a stack set with self-managed permissions, create the StackSets execution role in each account, and add new accounts to the stack set when they join.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule for the CreateAccount event that invokes an AWS Lambda function, which creates the stack in each Region of the new account.
    - id: c
      text:
        en: |-
          Activate trusted access for StackSets, and create a stack set with service-managed permissions that targets the Workloads OU with automatic deployment turned on.
    - id: d
      text:
        en: |-
          Create a pipeline in AWS CodePipeline with one CloudFormation deploy action for each account and Region, and add actions when new accounts join the OU.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With service-managed permissions, StackSets deploys to accounts of an OU and creates the required IAM roles itself. Automatic deployment creates the stacks in accounts that are added to the target OU later, with no manual step.
  options:
    a:
      en: |-
        Self-managed permissions require the execution role in every account and manual additions of new accounts, which the team wants to avoid.
    b:
      en: |-
        A Lambda function is custom code, and accounts that are moved into the OU rather than created would be missed.
    d:
      en: |-
        A pipeline with one action per account and Region needs manual changes for each new account and does not create the cross-account roles.
references:
  - title: Enable or disable automatic deployments for StackSets in AWS Organizations - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-manage-auto-deployment.html
  - title: Activate trusted access for StackSets with AWS Organizations - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-activate-trusted-access.html
