id: dopc02-2c-cloudshell-adhoc-cli
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's operations engineers sign in to the AWS Management Console through IAM Identity Center. During incidents, they sometimes need to run AWS CLI commands against the account they are signed in to. The company's managed laptops do not allow software installation, and a security policy forbids storing access keys on any device. The engineers want to run the commands from a browser with the permissions they already have in the console.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Launch a small Amazon EC2 instance with the AWS CLI installed, and let the engineers connect to it through EC2 Instance Connect when they need to run commands.
    - id: b
      text:
        en: |-
          Create an IAM user with access keys for each engineer, and store the keys in AWS Secrets Manager so that the engineers can retrieve them during incidents.
    - id: c
      text:
        en: |-
          Open AWS CloudShell from the console, and run the AWS CLI commands in the shell with the credentials of the current console session.
    - id: d
      text:
        en: |-
          Install the AWS CLI on a shared jump server in the data center, and configure it with a named profile that assumes an administrator role.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CloudShell is a browser-based shell launched from the console, with the AWS CLI preinstalled and the credentials of the console session available automatically. Nothing is installed on the laptop, no access keys are stored, and CloudShell has no additional charge.
  options:
    a:
      en: |-
        An EC2 instance must be launched, patched, and given an instance role, which adds operational overhead, and the engineers would run commands with the instance's permissions instead of their own.
    b:
      en: |-
        IAM user access keys are long-term credentials, which the security policy is meant to avoid, and the engineers would still need a CLI installed somewhere.
    d:
      en: |-
        A shared jump server is extra infrastructure to maintain, and its profile gives every engineer the same role instead of the permissions of their own console session.
references:
  - title: What is AWS CloudShell? - AWS CloudShell
    url: https://docs.aws.amazon.com/cloudshell/latest/userguide/welcome.html
