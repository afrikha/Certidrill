id: dopc02-2c-dsc-mof-windows
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company manages 300 Windows Server instances that are Systems Manager managed nodes. Its configuration team already describes the desired state of the servers with PowerShell Desired State Configuration (DSC) and compiles the configurations into MOF files. The company wants the MOF files applied every 4 hours so that any configuration drift is corrected automatically, and it wants the results to appear in Systems Manager Compliance. The company wants to reuse the MOF files without new configuration tooling.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Upload the MOF files to the root of an S3 bucket, and give the instance role of the servers read access to the bucket.
    - id: b
      text:
        en: |-
          Create an AWS OpsWorks for Puppet Enterprise server, and convert the DSC configurations into Puppet manifests for the Windows servers.
    - id: c
      text:
        en: |-
          Create a State Manager association that runs AWS-ApplyDSCMofs every 4 hours with MofOperationMode set to ReportOnly.
    - id: d
      text:
        en: |-
          Create a State Manager association that runs AWS-ApplyDSCMofs every 4 hours with MofOperationMode set to Apply.
    - id: e
      text:
        en: |-
          Add the MOF files to the user data of the launch template, and run Start-DscConfiguration when each server first starts.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      AWS-ApplyDSCMofs runs existing MOF files on Windows Server managed nodes through State Manager and reports results under the Custom:DSC compliance type. It can download the MOF files from the root of an S3 bucket when the instance role allows GetObject and ListBucket, and the Apply mode corrects noncompliant settings on each scheduled run.
  options:
    b:
      en: |-
        OpsWorks for Puppet Enterprise is shut down, and converting the configurations is the new tooling the company wants to avoid.
    c:
      en: |-
        ReportOnly records compliance data without changing the servers, so drift would not be corrected.
    e:
      en: |-
        User data runs at first launch only, so drift that appears later is never corrected or reported.
references:
  - title: Creating associations that run MOF files - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state-manager-using-mof-file.html
