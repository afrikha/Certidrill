id: dopc02-2a-stacksets-retain-on-removal
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses a service-managed stack set with automatic deployment to create a logging stack in every account of a Workloads OU. The stack includes an Amazon S3 bucket with audit logs, an IAM role, and Amazon CloudWatch alarms. When a business unit is divested, its accounts are moved out of the Workloads OU and later removed from the organization. Legal rules require that the whole logging stack stay in place and keep working in those accounts after they leave the OU. Accounts that join the OU must still receive the stack automatically.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn off automatic deployment for the stack set, and add new accounts to the stack set by hand when they join the Workloads OU.
    - id: b
      text:
        en: |-
          Add DeletionPolicy: Retain to the S3 bucket in the template, and keep automatic deployment with the Delete stacks option for removed accounts.
    - id: c
      text:
        en: |-
          Keep automatic deployment turned on, and set the account removal behavior to Retain stacks so that removed accounts keep their stacks.
    - id: d
      text:
        en: |-
          Convert the stack set to self-managed permissions so that stack instances are no longer linked to the OU membership of the accounts.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Automatic deployment has an account removal setting: with RetainStacksOnAccountRemoval, stacks in accounts removed from a target OU stay in their current state but are no longer part of the stack set. Automatic deployment still creates stacks in accounts that join the OU.
  options:
    a:
      en: |-
        New accounts would no longer receive the stack automatically, which the company requires.
    b:
      en: |-
        DeletionPolicy keeps only the bucket; the stack, the IAM role, and the alarms would still be deleted when the account leaves the OU.
    d:
      en: |-
        Self-managed stack sets do not deploy automatically to accounts that join an OU, and the permission model of an existing stack set is not switched this way.
references:
  - title: Enable or disable automatic deployments for StackSets in AWS Organizations - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-manage-auto-deployment.html
