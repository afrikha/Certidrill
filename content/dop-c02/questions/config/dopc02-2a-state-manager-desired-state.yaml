id: dopc02-2a-state-manager-desired-state
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs 400 Amazon Linux instances in several Auto Scaling groups. All instances are Systems Manager managed nodes and carry the tag Tier=web. A security agent must be installed and running on every instance with a specific configuration file. Operators sometimes stop the agent while troubleshooting and forget to restart it. The company requires the configuration to be corrected automatically within 30 minutes, applied to new instances when they launch, and reported in a compliance view.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a State Manager association that targets Tier=web with a Command document that installs, configures, and starts the agent, and set a rate(30 minutes) schedule.
    - id: b
      text:
        en: |-
          Run a Run Command command with the AWS-RunShellScript document against Tier=web that installs, configures, and starts the agent on every instance.
    - id: c
      text:
        en: |-
          Create a maintenance window with a weekly schedule and a Run Command task that installs, configures, and starts the agent on Tier=web.
    - id: d
      text:
        en: |-
          Add the agent installation and configuration to the user data of the launch templates, and replace the instances with an instance refresh.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A State Manager association keeps managed nodes in a defined state on a cron or rate schedule, and associations are applied to new nodes that match the target, including instances launched by Auto Scaling. Association status is reported in compliance, so the company can see nodes that are out of the desired state.
  options:
    b:
      en: |-
        Run Command runs once; it does not correct the agent later or configure instances that launch afterward.
    c:
      en: |-
        A weekly maintenance window misses the 30-minute correction requirement and does not apply the configuration to instances when they launch.
    d:
      en: |-
        User data runs only at first boot, so an agent that an operator stops later is never corrected, and no compliance is reported.
references:
  - title: AWS Systems Manager State Manager - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state.html
  - title: Choosing between State Manager and Maintenance Windows - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/state-manager-vs-maintenance-windows.html
