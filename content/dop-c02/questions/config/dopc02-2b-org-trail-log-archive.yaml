id: dopc02-2b-org-trail-log-archive
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 120 accounts in AWS Organizations with all features enabled and adds about five accounts each month. Each account has its own CloudTrail trail, deployed by a self-managed StackSet, and administrators in member accounts have stopped logging on their trails several times. The security team requires that management events from every current and future account be delivered to an S3 bucket in the Log Archive account. Member account administrators must not be able to stop, delete, or change the logging configuration. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Convert the StackSet to service-managed permissions with automatic deployment to the organization root, and point every member account trail to the Log Archive bucket.
    - id: b
      text:
        en: |-
          Create a CloudTrail Lake event data store for the organization in the Log Archive account, and delete the per-account trails after the data store starts collecting events.
    - id: c
      text:
        en: |-
          Create an AWS Config aggregator in the Log Archive account with the organization as its source, and deliver its configuration snapshots to the Log Archive bucket.
    - id: d
      text:
        en: |-
          Create an organization trail from the management account that delivers to the Log Archive bucket with a bucket policy that allows CloudTrail to write, and then delete the per-account trails.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An organization trail, created from the management account or a CloudTrail delegated administrator, logs events for every account in the organization, including accounts that join later, into one bucket with a folder per account ID. Users in member accounts can see the organization trail but cannot delete it, turn logging off, or change it. The bucket in the Log Archive account needs a bucket policy that lets CloudTrail deliver the organization's logs.
  options:
    a:
      en: |-
        Trails created in member accounts are owned by those accounts, so their administrators could still stop or change them.
    b:
      en: |-
        CloudTrail Lake has been closed to new customers since May 31, 2026, and it would not deliver log files to the Log Archive S3 bucket.
    c:
      en: |-
        AWS Config records resource configurations and compliance, not the API activity that CloudTrail management events capture.
references:
  - title: Creating a trail for an organization - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html
