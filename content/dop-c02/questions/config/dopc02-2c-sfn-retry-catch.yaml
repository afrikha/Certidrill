id: dopc02-2c-sfn-retry-catch
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Step Functions Standard workflow rotates credentials in a partner's system. One Task state invokes an AWS Lambda function synchronously, and the function fails intermittently with Lambda.ServiceException errors and with a custom PartnerThrottled error when the partner API is busy. A DevOps engineer must retry these two errors up to 5 times with increasing, randomized delays. If the errors persist, or if any other error occurs, the workflow must publish a message to an Amazon SNS topic. The engineer must not change the function code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the function's asynchronous invocation settings with 2 retry attempts and an SNS on-failure destination, and leave the Task state unchanged.
    - id: b
      text:
        en: |-
          Add a retrier with States.ALL first and a retrier for the two errors second, and add a catcher that sends the two errors to an SNS publish state.
    - id: c
      text:
        en: |-
          Add a retrier for the two errors with MaxAttempts 5, a BackoffRate of 2, and JitterStrategy FULL, and add a catcher for States.ALL that goes to an SNS publish state.
    - id: d
      text:
        en: |-
          Increase the function timeout to 15 minutes and wrap the Task state in a Parallel state, and add a catcher for the two errors that goes to an SNS publish state.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A retrier that matches the two error names retries with an interval multiplied by BackoffRate after each attempt, and JitterStrategy FULL randomizes each delay. Retriers are applied first; when the retries are exhausted, or for any other error, the States.ALL catcher sends the execution to the state that publishes to SNS.
  options:
    a:
      en: |-
        Step Functions invokes the function synchronously, so asynchronous retry settings and destinations do not apply, and Lambda allows at most 2 asynchronous retries.
    b:
      en: |-
        States.ALL must be the last retrier, and catching only the two errors leaves other errors without a notification.
    d:
      en: |-
        A longer timeout and a Parallel state do not retry anything, and the catcher ignores other errors.
references:
  - title: Handling errors in Step Functions workflows - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
