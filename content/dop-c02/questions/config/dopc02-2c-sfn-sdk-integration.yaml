id: dopc02-2c-sfn-sdk-integration
objective: "2.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company backs up the root volumes of selected Amazon EC2 instances with an AWS Step Functions Standard workflow. Each Task state invokes a small AWS Lambda function whose only code calls one Amazon EC2 API action, such as CreateSnapshot or DescribeSnapshots, and returns the response. A DevOps engineer must remove these Lambda functions to reduce code maintenance while keeping the same workflow logic. The workflow's execution role currently allows only lambda:InvokeFunction.

    Which combination of steps should the engineer take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Replace each Lambda task with a Task state whose Resource is an AWS SDK integration such as arn:aws:states:::aws-sdk:ec2:createSnapshot, with the API parameters in PascalCase.
    - id: b
      text:
        en: |-
          Convert the state machine to an Express workflow, because AWS SDK integrations are available only in Express workflows.
    - id: c
      text:
        en: |-
          Rely on Step Functions to add the Amazon EC2 permissions to the execution role automatically when the state machine definition is saved.
    - id: d
      text:
        en: |-
          Add the ec2:CreateSnapshot and ec2:DescribeSnapshots permissions to the execution role of the state machine.
    - id: e
      text:
        en: |-
          Add a resource-based policy to each EC2 volume that allows the states.amazonaws.com service principal to call the snapshot API actions.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      AWS SDK integrations let a Task state call almost any AWS API action directly through a Resource of the form arn:aws:states:::aws-sdk:serviceName:apiAction, so the Lambda wrappers are no longer needed. Step Functions cannot generate IAM policies for AWS SDK integrations, so the engineer must add the EC2 actions to the execution role.
  options:
    b:
      en: |-
        AWS SDK integrations are available in both Standard and Express workflows, and the workflow type cannot be changed after the state machine is created.
    c:
      en: |-
        Step Functions does not generate IAM policies for AWS SDK integrations; the execution role must be updated manually.
    e:
      en: |-
        EBS volumes do not support resource-based policies; Step Functions calls the API with the permissions of its execution role.
references:
  - title: Learning to use AWS service SDK integrations in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/supported-services-awssdk.html
  - title: Choosing workflow type in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
