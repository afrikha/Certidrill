id: dopc02-2a-stacksets-concurrency-mode
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company updates a stack set that has stack instances in 300 accounts in each of four AWS Regions. Updates currently take many hours because the Regions are processed one after another and only a few accounts are updated at a time. The company wants all four Regions to be updated at the same time, with 40 accounts in progress at once in each Region. The operation must be marked as failed in a Region after more than five stack instances fail there. The company accepts that operations already in progress finish after that point, but concurrency must not drop as failures occur.

    Which deployment options will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Region concurrency Parallel, concurrency mode Soft failure tolerance, failure tolerance 5, and maximum concurrent accounts 40.
    - id: b
      text:
        en: |-
          Region concurrency Parallel, concurrency mode Strict failure tolerance, failure tolerance 5, and maximum concurrent accounts 40.
    - id: c
      text:
        en: |-
          Region concurrency Sequential, concurrency mode Soft failure tolerance, failure tolerance 5, and maximum concurrent accounts 40.
    - id: d
      text:
        en: |-
          Region concurrency Parallel, concurrency mode Soft failure tolerance, failure tolerance 100 %, and maximum concurrent accounts 40.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Parallel Region concurrency deploys to all specified Regions at the same time. With Soft failure tolerance, the actual concurrency stays at the maximum concurrent accounts whatever the failures, and the failure tolerance only decides when the operation is marked as failed, while operations already queued can still finish.
  options:
    b:
      en: |-
        Strict failure tolerance limits the actual concurrency to the failure tolerance plus one, here 6 accounts, and lowers it further with each failure.
    c:
      en: |-
        Sequential Region concurrency processes one Region at a time, so the four Regions are not updated together.
    d:
      en: |-
        A failure tolerance of 100 % never stops the operation, so it is not marked as failed after more than five failures.
references:
  - title: Choose the Concurrency Mode for CloudFormation StackSets - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/concurrency-mode.html
  - title: StackSets concepts - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-concepts.html
