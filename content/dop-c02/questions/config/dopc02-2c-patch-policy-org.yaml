id: dopc02-2c-patch-policy-org
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 60 accounts in AWS Organizations and runs Windows Server and Amazon Linux managed nodes in four AWS Regions. The company wants every managed node in every account and Region to be scanned for missing patches every day and patched every Sunday night. New accounts that join the organization must be covered automatically. The company wants to use the AWS managed patch baselines and does not want to maintain patching resources in each account and Region.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Use a CloudFormation stack set to deploy two maintenance windows to every account and Region, one that runs AWS-RunPatchBaseline with Scan daily and one with Install on Sunday.
    - id: b
      text:
        en: |-
          Create patch groups in each account by tagging the managed nodes, and register the AWS managed patch baselines for those patch groups in each Region.
    - id: c
      text:
        en: |-
          Create a patch policy in Quick Setup that targets the entire organization and all four Regions, with a daily scan schedule and a Sunday installation schedule.
    - id: d
      text:
        en: |-
          Create a State Manager association in the management account that runs AWS-RunPatchBaseline with Install every Sunday on the managed nodes of all accounts.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Quick Setup patch policy can target all accounts and Regions of an organization, or selected OUs, from one configuration, with separate scan and install schedules. It runs AWS-RunPatchBaseline with the baseline chosen for each operating system, and AWS recommends patch policies for organization-wide patching.
  options:
    a:
      en: |-
        Maintenance windows are limited to one account-Region pair, so the stack set deploys and maintains patching resources in every account and Region, which the company wants to avoid.
    b:
      en: |-
        Patch groups only choose which baseline applies; they schedule nothing, are configured per account and Region, and are not needed with patch policies.
    d:
      en: |-
        A State Manager association runs in its own account and Region only, so an association in the management account cannot patch nodes in the other accounts, and it does not scan daily.
references:
  - title: Patch policy configurations in Quick Setup - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-policies.html
