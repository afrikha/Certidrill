id: dopc02-2b-discount-sharing
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A holding company uses consolidated billing in AWS Organizations for 25 accounts. One subsidiary's account bought Compute Savings Plans and EC2 Reserved Instances for its own workloads. The subsidiary is charged internally for its own usage and requires that its commitments benefit only its own account. It must also not receive discounts from commitments that other accounts bought. The subsidiary account must stay in the organization under the same SCPs.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Move the subsidiary account to its own OU, and attach an SCP that prevents other accounts from using the subsidiary's Savings Plans and Reserved Instances.
    - id: b
      text:
        en: |-
          Remove the subsidiary account from the organization until its commitments expire, and then invite it back into the organization.
    - id: c
      text:
        en: |-
          Activate cost allocation tags and AWS Cost Categories so that the subsidiary's commitment discounts are reported only against the subsidiary.
    - id: d
      text:
        en: |-
          In the management account's billing preferences, deactivate Reserved Instance and Savings Plans discount sharing for the subsidiary account.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The management account controls discount sharing for each account in the organization. A commitment is shared only when both the owning account and the receiving account have sharing activated, so deactivating sharing for the subsidiary keeps its commitments for its own usage and stops it from receiving other accounts' discounts.
  options:
    a:
      en: |-
        SCPs limit API permissions; they do not control how billing discounts are applied across the consolidated bill.
    b:
      en: |-
        The subsidiary must stay in the organization, and removing it would also take it out from under the SCPs.
    c:
      en: |-
        Tags and cost categories change how costs are reported, not how discounts are applied, so the discounts would still be shared.
references:
  - title: Reserved Instances and Savings Plans discount sharing - AWS Billing
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ri-turn-off.html
