id: dopc02-2b-invite-account-admin-role
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company acquired a startup whose production workload runs in a standalone AWS account. The company wants to bring this account into its organization in AWS Organizations, which has all features enabled. After the move, operations engineers in the management account must administer the account the same way that they administer accounts created through AWS Organizations: by assuming OrganizationAccountAccessRole in the account.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Call the CreateAccount API with the email address of the startup account so that AWS Organizations adds the existing account to the organization.
    - id: b
      text:
        en: |-
          Send an invitation from the management account to the startup account, and have an administrator of the startup account accept it.
    - id: c
      text:
        en: |-
          After the invitation is accepted, wait for AWS Organizations to create OrganizationAccountAccessRole in the startup account.
    - id: d
      text:
        en: |-
          In the startup account, create a role named OrganizationAccountAccessRole with AdministratorAccess and a trust policy that trusts the management account.
    - id: e
      text:
        en: |-
          Attach an SCP to the startup account that grants administrator permissions to the operations engineers of the management account.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      An existing standalone account joins an organization by accepting an invitation from the management account. AWS Organizations creates OrganizationAccountAccessRole automatically only in accounts that it creates, so in an invited account an administrator must create the role, with administrator permissions and a trust policy for the management account.
  options:
    a:
      en: |-
        CreateAccount always creates a new account; it cannot add an existing account to the organization.
    c:
      en: |-
        AWS Organizations does not create OrganizationAccountAccessRole in invited member accounts.
    e:
      en: |-
        SCPs never grant permissions; they only set the maximum permissions available in member accounts.
references:
  - title: Accessing a member account that has OrganizationAccountAccessRole with AWS Organizations - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_accounts_access-cross-account-role.html
