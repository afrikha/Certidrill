id: dopc02-2b-centralized-root-access
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has 200 member accounts in AWS Organizations. Most were created years ago and still have root user passwords, and some have root user access keys. The security team wants to remove root user credentials from all member accounts and stop maintaining them. The team must keep the ability to perform root-only tasks, such as unlocking an S3 bucket whose bucket policy denies all principals. The security team works from a Security Tooling account.

    Which combination of actions will meet these requirements with the LEAST operational overhead? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          From the management account, enable centralized root access for member accounts with trusted access for IAM, and make the Security Tooling account the IAM delegated administrator.
    - id: b
      text:
        en: |-
          Attach an SCP to the organization root that denies every action when the request is made by the root user of any member account in the organization.
    - id: c
      text:
        en: |-
          From the Security Tooling account, run the privileged task that deletes the root user credentials of each member account, and use privileged actions to unlock bucket policies.
    - id: d
      text:
        en: |-
          Recover the root password of each member account through its email address, delete any root access keys, and store the password in a vault protected by MFA.
    - id: e
      text:
        en: |-
          Set up IAM Identity Center and assign the security team a permission set with AdministratorAccess in every member account for root-only tasks.
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      Centralized root access is enabled from the management account with trusted access for IAM, the root credentials management and privileged root actions capabilities, and an optional IAM delegated administrator. The management account or the delegated administrator can then delete member account root credentials and perform privileged tasks such as removing a bucket policy that denies all principals. New accounts created in the organization have no root credentials by default.
  options:
    b:
      en: |-
        An SCP restricts the root user but does not remove its credentials, and it would also block the root-only tasks that the team must keep.
    d:
      en: |-
        Handling 200 root passwords by hand is the maintenance the team wants to stop.
    e:
      en: |-
        Permission sets create IAM roles, and roles cannot perform the tasks that require root user credentials.
references:
  - title: Centralize root access for member accounts - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-enable-root-access.html
  - title: AWS account root user - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
