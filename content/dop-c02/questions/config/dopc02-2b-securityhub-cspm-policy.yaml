id: dopc02-2b-securityhub-cspm-policy
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 300 accounts in AWS Organizations. Each account team has managed AWS Security Hub CSPM on its own, and the enabled standards and controls differ between accounts. The security team, which works from a delegated administrator account, must enable Security Hub CSPM with the AWS Foundational Security Best Practices standard in every account in us-east-1 and eu-west-1. One control must be disabled only for accounts in the Sandbox OU, and new accounts must be configured automatically. Account administrators must not be able to change these settings.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create Security Hub CSPM declarative policies in AWS Organizations: one attached to the root that enables the standard in both Regions, and one for the Sandbox OU that disables the control.
    - id: b
      text:
        en: |-
          Deploy a service-managed StackSet with automatic deployment that creates the Security Hub CSPM hub and the standard subscription in each account in both Regions.
    - id: c
      text:
        en: |-
          Invite every account to the delegated administrator account in both Regions, and ask each account team to enable the standard and disable the control as needed.
    - id: d
      text:
        en: |-
          Deploy an organization conformance pack based on the Foundational Security Best Practices rules from the delegated administrator account in both Regions.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Security Hub CSPM declarative policies are AWS Organizations policies that specify where Security Hub CSPM is enabled in each Region, together with the standards, controls, and control parameters. They can target the root, OUs, or accounts, and accounts that join or move into a target inherit the effective policy. AWS now recommends them over central configuration for managing Security Hub CSPM across an organization.
  options:
    b:
      en: |-
        Resources created by StackSets in member accounts can be changed by account administrators, and the Sandbox exception would need a separate StackSet.
    c:
      en: |-
        Invitations and per-account settings rely on each account team, so the configuration is neither consistent nor protected from changes.
    d:
      en: |-
        A conformance pack deploys AWS Config rules; it does not enable Security Hub CSPM or its standards and controls.
references:
  - title: Managing accounts with declarative policies in Security Hub CSPM - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/accounts-orgs-policies.html
