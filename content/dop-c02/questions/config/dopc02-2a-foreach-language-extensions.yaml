id: dopc02-2a-foreach-language-extensions
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS company deploys one AWS CloudFormation stack for its message-processing layer. Company policy requires all infrastructure code to stay in CloudFormation YAML. The template currently contains 12 nearly identical blocks, each with an Amazon SQS queue, a dead-letter queue, and an Amazon CloudWatch alarm for one tenant. The tenant names are already passed to the stack in a CommaDelimitedList parameter. The DevOps team wants each new tenant to need only a new parameter value, and the team does not want to maintain any AWS Lambda function for template processing.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudFormation macro backed by a Lambda function that reads the tenant list and adds the queues and alarm of each tenant to the template during processing.
    - id: b
      text:
        en: |-
          Add the AWS::LanguageExtensions transform to the template, and wrap the queue, dead-letter queue, and alarm in a Fn::ForEach loop over the tenant list parameter.
    - id: c
      text:
        en: |-
          Define one condition per tenant that checks the tenant list with Fn::Equals, and attach these conditions to the 12 existing blocks of resources.
    - id: d
      text:
        en: |-
          Move the tenant names into a Mappings section, and use Fn::FindInMap in a single block of resources to look up the name of each tenant during deployment.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Fn::ForEach repeats a template fragment for each item of a collection, which can be a Ref to a CommaDelimitedList parameter, and it can generate resources in the Resources section. It requires the AWS::LanguageExtensions transform, which AWS manages, so no Lambda function has to be written or maintained.
  options:
    a:
      en: |-
        A macro works, but it is backed by a Lambda function that the team must write and maintain, which the requirements exclude.
    c:
      en: |-
        Conditions only include or skip resources that are already written in the template; the 12 duplicated blocks remain, and a new tenant still needs a new block.
    d:
      en: |-
        Fn::FindInMap returns one value from a mapping; it cannot repeat a block of resources once for each tenant.
references:
  - title: Fn::ForEach - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/intrinsic-function-reference-foreach.html
