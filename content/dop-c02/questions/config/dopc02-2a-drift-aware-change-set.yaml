id: dopc02-2a-drift-aware-change-set
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company deploys an AWS CloudFormation stack every week from its pipeline. Drift detection shows that operators changed the stack outside CloudFormation: an ingress rule was removed from a security group and the memory size of an AWS Lambda function was increased. The template is correct and must stay unchanged for these resources. The company wants the next deployment to return every drifted property to its template value. Before the deployment runs, a reviewer must see the live values that will be overwritten.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a standard change set from the template, have the reviewer approve it, and execute it so that CloudFormation rewrites every resource of the stack.
    - id: b
      text:
        en: |-
          Delete the drifted resources in the console, and then update the stack with the template so that CloudFormation re-creates them with the template values.
    - id: c
      text:
        en: |-
          Import the drifted security group and Lambda function into the stack again with a change set of type IMPORT, and then execute the change set.
    - id: d
      text:
        en: |-
          Create a change set with the deployment mode set to REVERT_DRIFT, have the reviewer check the actual and previous values, and execute it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A drift-aware change set compares the actual state of the resources with the previous deployment and the new template, and its description shows the drifted values. When executed, it brings drifted resources back to the desired template state even if the template did not change for those resources.
  options:
    a:
      en: |-
        A standard change set compares the new template only with the previous template, so it shows no change for these resources and does not revert their drift.
    b:
      en: |-
        Deleting resources by hand causes an outage, and a normal update does not re-create resources whose definition did not change in the template.
    c:
      en: |-
        The resources are already managed by the stack, so they cannot be imported again, and an import does not change resource properties.
references:
  - title: Using drift-aware change sets - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/drift-aware-change-sets.html
