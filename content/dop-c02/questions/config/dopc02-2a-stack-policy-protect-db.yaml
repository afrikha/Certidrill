id: dopc02-2a-stack-policy-protect-db
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company has one AWS CloudFormation stack for a shared environment. Several teams update the stack through their pipelines several times each day. The stack contains an Amazon Aurora DB cluster with the logical ID ProductionDatabase. A recent template change replaced the cluster by accident. The company wants stack updates to be unable to replace or delete ProductionDatabase, whatever IAM permissions the caller has, while updates to all other resources continue unchanged. Planned maintenance on the cluster must still be possible for a single update.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an IAM policy to the pipeline roles that denies cloudformation:UpdateStack, and give a separate maintenance role permission to update the stack.
    - id: b
      text:
        en: |-
          Set a stack policy that allows Update:* on all resources and denies Update:Replace and Update:Delete on ProductionDatabase, and pass an override policy during planned maintenance.
    - id: c
      text:
        en: |-
          Turn on termination protection for the stack, and turn it off with the cloudformation:UpdateTerminationProtection permission during planned maintenance.
    - id: d
      text:
        en: |-
          Add DeletionPolicy: Retain to ProductionDatabase, and remove the attribute from the template during planned maintenance.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A stack policy applies to every user during stack updates, and a Deny statement on the logical ID blocks the selected update actions for that resource only. Update:Replace and Update:Delete cover replacement and removal, while the Allow statement keeps all other updates working; a temporary override policy applies to one update without changing the stack policy.
  options:
    a:
      en: |-
        Denying UpdateStack blocks every update to every resource, and IAM controls who can call the API rather than which resource changes an update may make.
    c:
      en: |-
        Termination protection only prevents deletion of the whole stack; it does not stop an update from replacing the cluster.
    d:
      en: |-
        DeletionPolicy applies when the stack is deleted or the resource is removed from the template; it does not prevent a replacement during an update.
references:
  - title: Prevent updates to stack resources - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/protect-stack-resources.html
