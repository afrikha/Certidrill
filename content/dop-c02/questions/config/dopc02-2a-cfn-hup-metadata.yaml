id: dopc02-2a-cfn-hup-metadata
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a stateful reporting application on three standalone Amazon EC2 instances that an AWS CloudFormation stack creates. Each instance is configured at launch by cfn-init from the AWS::CloudFormation::Init metadata of the instance resource, which installs packages and writes configuration files. When the team changes the metadata and updates the stack, the running instances keep the old configuration. The team wants metadata changes to be applied to the running instances after each stack update. The instances must not be restarted or replaced.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the UserData property of each instance in every update so that CloudFormation runs the user data script and cfn-init again.
    - id: b
      text:
        en: |-
          Run the cfn-hup daemon on each instance with a post.update hook on the instance's AWS::CloudFormation::Init metadata path that runs cfn-init.
    - id: c
      text:
        en: |-
          Add a CreationPolicy to each instance, and make cfn-init send a new cfn-signal each time the metadata of the instance changes.
    - id: d
      text:
        en: |-
          Move the instances into an Auto Scaling group with an AutoScalingReplacingUpdate policy so that each update applies the new metadata.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      cfn-hup is a daemon that checks resource metadata at an interval and runs the action of a hook when the metadata changes. A post.update hook on the AWS::CloudFormation::Init path that runs cfn-init applies the new configuration to the running instances without a restart.
  options:
    a:
      en: |-
        Changing the UserData of an instance with an EBS root volume makes CloudFormation restart the instance, which the team must avoid.
    c:
      en: |-
        CreationPolicy only applies when a resource is created; signals do not make an instance apply new metadata.
    d:
      en: |-
        AutoScalingReplacingUpdate replaces the instances, which the requirements forbid for this stateful application.
references:
  - title: cfn-hup - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/cfn-hup.html
  - title: AWS::EC2::Instance - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-instance.html
