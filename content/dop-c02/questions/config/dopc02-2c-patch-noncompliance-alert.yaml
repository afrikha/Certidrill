id: dopc02-2c-patch-noncompliance-alert
objective: "2.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company patches its managed nodes with a Patch Manager patch policy that scans every day. AWS Config is recording all resource types in the account. The compliance team wants AWS Config to evaluate the patch compliance status of each managed node, and wants an email notification through an existing Amazon SNS topic as soon as a node becomes noncompliant. The company wants to use managed features instead of custom code.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule that matches Config Rules Compliance Change events with a NON_COMPLIANT new evaluation result, and target the SNS topic.
    - id: b
      text:
        en: |-
          Create an AWS CloudTrail metric filter for the PutComplianceItems API call, and create a CloudWatch alarm on the metric that notifies the SNS topic.
    - id: c
      text:
        en: |-
          Deploy the ec2-managedinstance-applications-required AWS Config managed rule with the names of the patches that each node must have.
    - id: d
      text:
        en: |-
          Deploy the ec2-managedinstance-patch-compliance-status-check AWS Config managed rule in the account.
    - id: e
      text:
        en: |-
          Activate Amazon Inspector EC2 scanning, and subscribe the SNS topic to the findings that Amazon Inspector sends for missing patches.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The ec2-managedinstance-patch-compliance-status-check managed rule evaluates the AWS::SSM::PatchCompliance resource type and is compliant only when the Patch Manager status is COMPLIANT. AWS Config sends Config Rules Compliance Change events to EventBridge, so a rule that matches NON_COMPLIANT results can notify the SNS topic.
  options:
    b:
      en: |-
        A metric filter on an API call does not show whether a node is compliant, and it is not an AWS Config evaluation.
    c:
      en: |-
        The applications-required rule checks installed applications, not patch compliance, and listing every patch by hand is not maintainable.
    e:
      en: |-
        Amazon Inspector reports vulnerabilities, not the Patch Manager compliance status, and the requirement is an AWS Config evaluation.
references:
  - title: ec2-managedinstance-patch-compliance-status-check - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/ec2-managedinstance-patch-compliance-status-check.html
  - title: Monitoring AWS Config with Amazon EventBridge - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/monitor-config-with-cloudwatchevents.html
