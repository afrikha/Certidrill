id: dopc02-2c-state-mgr-apply-at-cron
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses a State Manager association to apply a hardening configuration document to all managed nodes with the tag Tier=Web. Applying the document restarts the web server. The association has a cron schedule for Sundays at 02:00, the company's only approved change window. When an Auto Scaling group scales out on weekdays, the new instances run the association as soon as they become managed nodes, and their web servers restart while they serve traffic. The company wants the association to run only in the change window. New instances already launch from a hardened AMI.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Change the schedule of the association from a cron expression to a rate expression of 7 days, so that it runs once a week.
    - id: b
      text:
        en: |-
          Set the MaxConcurrency of the association to 1 so that only one new instance at a time restarts its web server.
    - id: c
      text:
        en: |-
          Update the association to set ApplyOnlyAtCronInterval to true so that it runs only at the scheduled cron times.
    - id: d
      text:
        en: |-
          Delete the association, and register the document as a Run Command task in a maintenance window that opens on Sundays at 02:00.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      By default an association also runs when it is created and when a target change is detected, such as a new node coming online. Setting ApplyOnlyAtCronInterval to true (Apply association only at the next specified cron interval) makes it run only according to its cron schedule, so new instances are hardened in the Sunday window.
  options:
    a:
      en: |-
        A rate expression does not stop runs on new targets, and ApplyOnlyAtCronInterval is not supported with rate expressions.
    b:
      en: |-
        MaxConcurrency limits how many nodes run at once but still restarts the web server of every new instance on weekdays.
    d:
      en: |-
        A maintenance window with a Run Command task also runs only in the window, but it replaces the association with more resources to manage, while one setting on the existing association meets the requirement.
references:
  - title: CreateAssociation - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_CreateAssociation.html
  - title: Understanding how State Manager works - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/state-manager-about.html
