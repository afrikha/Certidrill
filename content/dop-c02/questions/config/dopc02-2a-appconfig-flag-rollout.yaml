id: dopc02-2a-appconfig-flag-rollout
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company runs its checkout service on Amazon ECS tasks in three environments. The product team wants to turn on a new payment option at runtime, without building or redeploying the service. The change must reach production tasks gradually over about 30 minutes. If the checkout error-rate alarm in Amazon CloudWatch enters the ALARM state during the rollout, the previous value must be restored automatically. The value must be checked against a schema before any rollout starts.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the flag in an AWS Systems Manager Parameter Store parameter, and update the parameter from a pipeline that reverts the value when the alarm fires.
    - id: b
      text:
        en: |-
          Create an AWS AppConfig feature flag profile, add the alarm to the production environment, and deploy the flag with the AppConfig.Linear20PercentEvery6Minutes strategy.
    - id: c
      text:
        en: |-
          Set the flag as an environment variable in the ECS task definition, and roll it out with an ECS rolling deployment that has the deployment circuit breaker turned on.
    - id: d
      text:
        en: |-
          Store the flag in an Amazon S3 object, and deploy a new object version with AWS CodeDeploy in a linear configuration with alarm-based rollback.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS AppConfig deploys feature flags at runtime with a deployment strategy; AppConfig.Linear20PercentEvery6Minutes reaches all targets in 30 minutes. AppConfig rolls back automatically when an alarm attached to the environment enters ALARM during the deployment, and feature flag data is validated against a JSON Schema before it is deployed.
  options:
    a:
      en: |-
        Parameter Store has no gradual rollout or alarm-based rollback, so the pipeline logic would be custom, and every task would see the new value at once.
    c:
      en: |-
        An environment variable change needs a new task definition revision and a redeployment of the service, which the product team wants to avoid.
    d:
      en: |-
        CodeDeploy deploys application revisions to compute platforms, not object versions to an S3 key, and the service would still need code to read and refresh the object.
references:
  - title: Using predefined deployment strategies - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-deployment-strategy-predefined.html
  - title: Monitoring deployments for automatic rollback - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/monitoring-deployments.html
