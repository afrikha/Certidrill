id: dopc02-2c-sfn-express-high-volume
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company processes IoT device events with an automation workflow. Amazon EventBridge starts one workflow execution for each event, at peaks of several thousand executions per second. Each execution runs four AWS Lambda functions in sequence and completes in under 20 seconds, and every step writes its result with an idempotent PUT to an Amazon DynamoDB table. The company does not need the execution history in the Step Functions console, because it sends workflow logs to Amazon CloudWatch Logs. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Step Functions Standard workflow, and start an execution for each event from the EventBridge rule.
    - id: b
      text:
        en: |-
          Create an AWS Step Functions Standard workflow with a Distributed Map state, and send the events to it in batches.
    - id: c
      text:
        en: |-
          Run each event through an AWS Batch job that runs the four steps in one container, and submit the job from the EventBridge rule.
    - id: d
      text:
        en: |-
          Create an AWS Step Functions Express workflow, and start an asynchronous execution for each event from the EventBridge rule.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Express workflows suit high-volume, short event processing: they run for up to five minutes, are priced by number of executions, duration, and memory, and have no state transition rate limit. Asynchronous Express executions are at-least-once, which is acceptable because every step is idempotent.
  options:
    a:
      en: |-
        Standard workflows are priced per state transition and are subject to state transition throttling, so thousands of short executions per second cost more.
    b:
      en: |-
        Distributed Map is for large datasets processed in parallel; batching events in a Standard workflow adds per-transition charges and delay.
    c:
      en: |-
        AWS Batch adds job scheduling and container startup to every event, which is slower and costlier for 20-second workflows.
references:
  - title: Choosing workflow type in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
