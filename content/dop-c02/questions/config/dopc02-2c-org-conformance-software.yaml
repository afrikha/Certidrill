id: dopc02-2c-org-conformance-software
objective: "2.3.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has 120 accounts in AWS Organizations, and a security account is the delegated administrator for AWS Config. Every account runs managed nodes in one Region. The compliance team requires two AWS Config managed rules in every account: one that checks the Patch Manager compliance status of each node and one that checks that an approved endpoint agent is installed. The rules must be deployed to new accounts automatically, and member accounts must not be able to modify them. Today, the AWS Config recorder in each account records only Amazon EC2 and IAM resource types.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          From the security account, deploy an organization conformance pack that contains the ec2-managedinstance-patch-compliance-status-check and ec2-managedinstance-applications-required rules.
    - id: b
      text:
        en: |-
          Create an AWS Config aggregator in the security account that collects data from all accounts, and add the two managed rules to the aggregator.
    - id: c
      text:
        en: |-
          Update the AWS Config recorder in every account to also record the patch compliance and managed instance inventory resource types.
    - id: d
      text:
        en: |-
          Create an SCP that denies config:PutConfigRule, and attach it to the root so that member accounts cannot create their own rules.
    - id: e
      text:
        en: |-
          Enable the AWS Foundational Security Best Practices standard in AWS Security Hub CSPM for all accounts, because it contains both checks.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      An organization conformance pack deployed from the management account or a delegated administrator deploys its rules to every member account, including accounts that join later, and member accounts cannot modify them. The two rules evaluate the AWS::SSM::PatchCompliance and AWS::SSM::ManagedInstanceInventory resource types, so the recorders must record those types.
  options:
    b:
      en: |-
        An aggregator collects configuration and compliance data for viewing; it does not deploy or run rules in the member accounts.
    d:
      en: |-
        An SCP that blocks rule creation does not deploy the required rules, and it could block the conformance pack deployment itself.
    e:
      en: |-
        The standard includes a patch compliance control but nothing that checks for the company's endpoint agent, so it cannot replace the two rules.
references:
  - title: Managing Conformance Packs for AWS Config Across all Accounts in Your Organization
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformance-pack-organization-apis.html
  - title: ec2-managedinstance-patch-compliance-status-check - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/ec2-managedinstance-patch-compliance-status-check.html
