id: dopc02-2b-cdk-construct-codeartifact
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team has built an AWS CDK L3 construct in TypeScript that creates a VPC with standard subnets, VPC flow logs, and VPC endpoint policies. Twenty application teams in different accounts of the company's organization must consume versioned releases of the construct as an npm dependency. Each team must be able to pin a version and upgrade on its own schedule. The construct must not be published to any public registry.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Publish each release as an npm package to an AWS CodeArtifact repository, and allow the organization's accounts to read packages through the repository policy.
    - id: b
      text:
        en: |-
          Convert the construct into a CloudFormation module, register it in each account, and have the teams reference it in their CDK applications as an npm dependency.
    - id: c
      text:
        en: |-
          Upload each release of the construct's source files to a shared S3 bucket, and have each team copy the files into its own repository when it upgrades.
    - id: d
      text:
        en: |-
          Publish each release to the AWS Serverless Application Repository as a private application, and share it with the organization's accounts.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CodeArtifact is a managed artifact repository that works with npm, so teams can install, pin, and upgrade the construct like any other package. Packages in CodeArtifact cannot be made public, and a repository policy can grant read access to the other accounts of the organization.
  options:
    b:
      en: |-
        A CloudFormation module is a registry extension used in templates. It is not an npm package, and it does not give teams a versioned TypeScript library.
    c:
      en: |-
        Copying source files by hand loses package versioning and dependency management, and it adds manual work for every release.
    d:
      en: |-
        The Serverless Application Repository distributes AWS SAM applications for deployment. It is not an npm registry for code libraries.
references:
  - title: What is AWS CodeArtifact? - CodeArtifact
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html
