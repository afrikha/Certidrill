id: dopc02-2b-ct-register-ou
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has set up an AWS Control Tower landing zone in its existing organization. An OU named Legacy contains 45 accounts that predate Control Tower, and none of them has existing AWS Config resources. Auto-enrollment is not turned on in the landing zone settings. The company wants all 45 accounts to be governed by Control Tower and its mandatory controls with the LEAST effort. The administrator's role is included in the Account Factory portfolio.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use the Enroll account workflow in the Control Tower console for each of the 45 accounts, one account at a time.
    - id: b
      text:
        en: |-
          Move the 45 accounts into the Sandbox OU that Control Tower created, because accounts in foundational OUs are enrolled automatically.
    - id: c
      text:
        en: |-
          Update the landing zone to the latest version, which enrolls every account of the organization in Control Tower.
    - id: d
      text:
        en: |-
          Register the Legacy OU with Control Tower, which enrolls the member accounts of the OU and applies the mandatory controls to them.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Registering an existing OU enrolls its member accounts in the landing zone and enables the mandatory controls on the OU and all its accounts. An OU can be registered when it contains up to 1,000 accounts, so all 45 accounts are enrolled in one operation.
  options:
    a:
      en: |-
        Enrolling 45 accounts one at a time is far more effort than registering their OU once.
    b:
      en: |-
        The Sandbox OU is an additional OU, not a foundational one, and without auto-enrollment, moving accounts does not enroll them.
    c:
      en: |-
        Updating the landing zone does not enroll accounts in unregistered OUs.
references:
  - title: Register an existing organizational unit with AWS Control Tower - AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/userguide/importing-existing.html
