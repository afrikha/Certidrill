id: dopc02-2a-stacksets-management-account
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses a service-managed stack set that targets the root of its organization in AWS Organizations. The stack set creates an Amazon EventBridge rule and an IAM role that forward security events to a central account. After deployment, the stack instances exist in all 85 member accounts, but auditors find that the management account has neither the rule nor the role. The auditors require the same resources in the management account. The company wants to keep the service-managed stack set for the member accounts.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on automatic deployment for the stack set so that CloudFormation adds the management account at the next stack set operation.
    - id: b
      text:
        en: |-
          Add the management account ID to the deployment targets of the stack set with the UNION account filter type, and update the stack set.
    - id: c
      text:
        en: |-
          Move the management account into a new OU, and add that OU to the deployment targets of the service-managed stack set.
    - id: d
      text:
        en: |-
          Deploy the same template to the management account separately, for example as a stack in that account, because service-managed stack sets never deploy there.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CloudFormation does not deploy stacks to the management account with service-managed stack sets, even if the account is part of the organization or an OU. The management account needs its own deployment of the template, such as a regular stack or a self-managed stack set.
  options:
    a:
      en: |-
        Automatic deployment adds accounts that join the target OUs; it never deploys to the management account.
    b:
      en: |-
        Account filters only refine the accounts within the targeted organization or OUs, and the management account is excluded whatever the filter.
    c:
      en: |-
        The management account is excluded even if it belongs to a targeted OU.
references:
  - title: Create CloudFormation StackSets with service-managed permissions - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-associate-stackset-with-org.html
