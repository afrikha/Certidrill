id: dopc02-2c-cli-page-size-timeout
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DevOps engineer maintains a shell script that runs aws s3api list-objects against a bucket that holds several million objects. The script must write the key of every object in the bucket to a file. Since the bucket grew, the command often fails with a timed out error. The engineer wants to keep using the AWS CLI command and to change the script as little as possible.

    Which change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the --no-paginate option so that the AWS CLI makes a single call to Amazon S3 instead of following the pagination tokens.
    - id: b
      text:
        en: |-
          Add the --max-items option with a value of 100 so that the AWS CLI prints fewer keys in each run of the script.
    - id: c
      text:
        en: |-
          Add a --query expression that selects only the Key field so that the AWS CLI receives smaller responses from Amazon S3.
    - id: d
      text:
        en: |-
          Add the --page-size option with a smaller value so that the AWS CLI requests fewer items in each call to Amazon S3.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When list commands on large numbers of resources time out, the AWS CLI documentation recommends a smaller --page-size. The CLI makes more calls that each request fewer items, so each call is more likely to finish before the timeout, and the output still contains every item.
  options:
    a:
      en: |-
        --no-paginate stops the CLI from following pagination tokens, so the output contains only the first page of results instead of every key.
    b:
      en: |-
        --max-items limits the number of items in the output and returns a NextToken, so a single run of the unchanged script no longer writes every key.
    c:
      en: |-
        --query filters the output on the client side after the responses are received, so the size and duration of each call to Amazon S3 do not change.
references:
  - title: Using the pagination options in the AWS CLI - AWS Command Line Interface
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-usage-pagination.html
