id: dopc02-2b-sc-org-share-local-role
objective: "2.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company maintains an AWS Service Catalog portfolio of approved infrastructure products in a Shared Services account, which is registered as a Service Catalog delegated administrator. The portfolio must be available in every current and future account of the Workloads OU with the LEAST operational overhead. Product and constraint changes made in the Shared Services account must appear in the recipient accounts automatically. A StackSet deploys an IAM role named SCLaunchRole, which has the permissions to provision the products, to the Shared Services account and to every account in the Workloads OU. Developers in the recipient accounts must not need those permissions.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Share the portfolio from the Shared Services account with the Workloads OU by using AWS Organizations sharing.
    - id: b
      text:
        en: |-
          Share the portfolio with each account ID, and have an administrator in each recipient account import the portfolio.
    - id: c
      text:
        en: |-
          Add a launch constraint to each product that specifies the full ARN of SCLaunchRole in the Shared Services account.
    - id: d
      text:
        en: |-
          Add a launch constraint to each product that specifies the role name SCLaunchRole instead of a role ARN.
    - id: e
      text:
        en: |-
          Add a stack set constraint to each product that names SCLaunchRole as the StackSet administrator role.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      A delegated administrator can share a portfolio with an OU, which shares it with every account in that OU, and portfolios shared through AWS Organizations do not need to be imported; the products and constraints stay in sync with the shared portfolio. A launch constraint that uses a role name instead of an ARN is account-agnostic: each account uses its own role with that name, which must exist in the account that created the constraint and in the user's account.
  options:
    b:
      en: |-
        Account-by-account sharing requires an import in each account and a new share for every new account, which is more overhead than sharing with the OU.
    c:
      en: |-
        A full ARN points to the role in one specific account, so launches in the recipient accounts would not use their local SCLaunchRole.
    e:
      en: |-
        A stack set constraint controls StackSets deployment options for a product. It does not provide the role that Service Catalog assumes to launch products.
references:
  - title: Sharing a Portfolio - AWS Service Catalog
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/catalogs_portfolios_sharing_how-to-share.html
  - title: AWS Service Catalog Launch Constraints - AWS Service Catalog
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/constraints-launch.html
