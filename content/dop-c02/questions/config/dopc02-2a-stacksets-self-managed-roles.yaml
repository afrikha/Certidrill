id: dopc02-2a-stacksets-self-managed-roles
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has acquired a business that operates four AWS accounts in its own separate organization in AWS Organizations. The accounts will not join the company's organization for at least a year. The company's platform account must deploy a monitoring baseline to these four accounts in three AWS Regions with AWS CloudFormation StackSets. The security team requires that StackSets use only roles whose permissions the company defines.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create AWSCloudFormationStackSetAdministrationRole in the platform account and AWSCloudFormationStackSetExecutionRole, trusting the platform account, in each acquired account, then use self-managed permissions.
    - id: b
      text:
        en: |-
          Activate trusted access for StackSets in the company's organization, and create a stack set with service-managed permissions that targets the four account IDs.
    - id: c
      text:
        en: |-
          Register the platform account as a delegated administrator for StackSets in the acquired organization, and create a service-managed stack set from the platform account.
    - id: d
      text:
        en: |-
          Create an execution role in the platform account that trusts the four acquired accounts, and create a stack set with self-managed permissions in each acquired account.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Self-managed permissions can deploy to any account in which an execution role can be created. The administration role in the administrator account lets CloudFormation assume AWSCloudFormationStackSetExecutionRole in each target account, and that role trusts the administrator account and holds only the permissions that the company grants.
  options:
    b:
      en: |-
        Service-managed permissions deploy only to accounts in the company's own organization, and the acquired accounts are not in it.
    c:
      en: |-
        A delegated administrator must be a member account of the organization that registers it, and the platform account is not in the acquired organization.
    d:
      en: |-
        The trust is reversed: the execution role belongs in each target account and trusts the administrator account, and the stack set is created once in the administrator account.
references:
  - title: Grant self-managed permissions - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-prereqs-self-managed.html
