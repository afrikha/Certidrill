id: dopc02-2b-policy-staging-ou
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to add an SCP that denies the creation of IAM users with access keys in every workload account. Last quarter, an SCP change broke a production deployment pipeline because one of its roles relied on an action that the new SCP denied. The DevOps team must now validate every new or changed SCP against representative accounts and workloads before it reaches any production account.

    Which approach follows AWS guidance for multi-account environments?
body:
  options:
    - id: a
      text:
        en: |-
          Attach the SCP to the organization root in audit mode, review the requests that it would have denied in CloudTrail, and then switch it to enforcement mode.
    - id: b
      text:
        en: |-
          Create a Policy Staging OU with test accounts that mirror the production setup, test the SCP there, and then attach it to production OUs progressively.
    - id: c
      text:
        en: |-
          Attach the SCP to the management account first, because changes there do not affect member accounts, and run the pipeline from it.
    - id: d
      text:
        en: |-
          Attach the SCP to the production OUs during a maintenance window, and detach it if CloudTrail shows AccessDenied errors for the pipeline roles.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The recommended Policy Staging OU holds accounts used to test and validate new or changed organization policies before they are applied to production. After testing, AWS advises attaching the change to more specific OUs first and then to broader OUs over time.
  options:
    a:
      en: |-
        SCPs have no audit mode: an attached SCP is enforced immediately for every account under its target.
    c:
      en: |-
        SCPs do not affect the management account, so attaching the SCP there tests nothing.
    d:
      en: |-
        This applies the untested SCP to production accounts, which is what the team must avoid.
references:
  - title: Recommended OUs and accounts - Organizing Your AWS Environment Using Multiple Accounts
    url: https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/recommended-ous-and-accounts.html
  - title: Service control policy examples - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples_general.html
