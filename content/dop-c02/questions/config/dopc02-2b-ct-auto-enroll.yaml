id: dopc02-2b-ct-auto-enroll
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's AWS Control Tower landing zone governs 300 accounts in several registered OUs. Administrators frequently move accounts between registered OUs from the AWS Organizations console in the management account when projects change owners. Each move causes inheritance drift, and the operations team must then update the account so that it gets the baselines and controls of its new OU. The company wants accounts to get the baselines and controls of the destination OU automatically after future moves, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an EventBridge rule for the Organizations MoveAccount event that invokes a Lambda function to re-register the destination OU through the Control Tower API.
    - id: b
      text:
        en: |-
          Update the landing zone settings to turn on auto-enrollment, so that accounts moved between registered OUs inherit the baselines and controls of the destination OU.
    - id: c
      text:
        en: |-
          Attach an SCP to all registered OUs that denies organizations:MoveAccount, so that accounts can be moved only by updating them in Account Factory.
    - id: d
      text:
        en: |-
          Send Control Tower drift notifications to an SNS topic in the Audit account, and have the operations team re-register the destination OU after each notification.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With auto-enrollment turned on, accounts moved between two registered OUs no longer show inheritance drift: they automatically inherit the baselines and controls of the new OU, and those of the previous OU are removed. It can be turned on by updating the landing zone, but it does not retroactively resolve drift caused by earlier moves.
  options:
    a:
      en: |-
        This builds and maintains custom code, and re-registering a whole OU for each move is far heavier than the built-in setting.
    c:
      en: |-
        Accounts are moved from the management account, and SCPs do not restrict principals in the management account, so the SCP would not block the moves.
    d:
      en: |-
        Notifications only report the drift; the operations team would still fix each move by hand.
references:
  - title: Optionally configure auto-enrollment for accounts - AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/userguide/configure-auto-enroll.html
