id: dopc02-2a-opsworks-chef-to-state-manager
objective: "2.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company used AWS OpsWorks Stacks to apply Chef cookbooks to its Linux application servers until the service was shut down. The servers now run as Amazon EC2 instances that are Systems Manager managed nodes and are tagged Role=app. The cookbooks are stored as a tar.gz archive in an Amazon S3 bucket. The company wants the cookbooks applied to all Role=app instances every 30 minutes, including new instances, without running a Chef server. The results of each run must appear in Systems Manager compliance.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Re-create the OpsWorks stack with a custom layer that runs the cookbooks, and register the existing EC2 instances with the layer.
    - id: b
      text:
        en: |-
          Create a State Manager association with the AWS-ApplyChefRecipes document that targets Role=app, uses the S3 archive as the source, and runs every 30 minutes.
    - id: c
      text:
        en: |-
          Deploy the cookbook archive as a freeform configuration profile in AWS AppConfig, and start a deployment to the Role=app instances every 30 minutes.
    - id: d
      text:
        en: |-
          Grant the instance profile of the Role=app instances read access to the S3 bucket and permission to send compliance items to Systems Manager.
    - id: e
      text:
        en: |-
          Run the AWS-RunShellScript document with Run Command against Role=app to install the Chef client and run chef-client in local mode once.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      AWS-ApplyChefRecipes runs Chef recipes on Linux managed nodes from a State Manager association, downloads cookbooks from sources such as Amazon S3, installs the Chef client by default, and reports results with a Custom:Chef compliance type. The instance profile needs read access to the S3 source and permission to put compliance items, and the association applies on its schedule to every matching node, including new ones.
  options:
    a:
      en: |-
        OpsWorks Stacks has reached end of life and is disabled for new and existing customers, so the stack cannot be re-created.
    c:
      en: |-
        AppConfig deploys configuration data that applications read; it does not run Chef recipes on instances.
    e:
      en: |-
        A single Run Command execution runs once, does not reach instances launched later, and does not report Chef results as compliance.
references:
  - title: Creating associations that run Chef recipes - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state-manager-chef.html
