id: dopc02-2a-maintenance-window-ordered-tasks
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company applies operating system updates to a fleet of web servers once a month. The work must run only between 02:00 and 04:00 on the first Sunday of the month, and no new task may start in the last 30 minutes of that period. The update process has three steps that must run in order: deregister the servers from the load balancer, patch them, and register them again. The company wants to use Systems Manager capabilities and the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a State Manager association with the AWS-RunPatchBaseline document and a cron expression for the first Sunday of every month at 02:00.
    - id: b
      text:
        en: |-
          Run the AWS-RunPatchBaseline document with Run Command on the first Sunday of each month, before and after deregistering the servers in the console.
    - id: c
      text:
        en: |-
          Create a maintenance window with a 2-hour duration and a 30-minute cutoff, and register the three steps as tasks with priorities that set their order.
    - id: d
      text:
        en: |-
          Create an AWS AppConfig deployment strategy with a 2-hour deployment time, and deploy a configuration that tells the servers to install the updates.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Maintenance windows run tasks only within a defined schedule, duration, and cutoff, and their tasks can be Run Command or Automation tasks. Task priorities control the order: tasks with a lower priority start after tasks with a higher priority reach a final state.
  options:
    a:
      en: |-
        State Manager is designed for ongoing desired state; an association has no execution window, cutoff time, or ordered list of tasks.
    b:
      en: |-
        Running commands and changing the load balancer by hand is a manual process with no enforced time window.
    d:
      en: |-
        AppConfig deploys configuration data to applications; it does not install operating system updates or orchestrate load balancer steps.
references:
  - title: Choosing between State Manager and Maintenance Windows - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/state-manager-vs-maintenance-windows.html
