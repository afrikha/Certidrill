id: dopc02-2b-pipeline-cross-account-roles
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs AWS CodePipeline in a Tooling account. A CodeBuild project in the pipeline must deploy CloudFormation stacks into Dev, Test, and Prod accounts of the same organization. The security team forbids long-term credentials and wants each target account to control what the pipeline is allowed to do in it.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          In each target account, create a deployment role that trusts the CodeBuild service role of the Tooling account and has only the permissions for the stacks.
    - id: b
      text:
        en: |-
          Attach an SCP to the OU of the target accounts that allows sts:AssumeRole for the principals of the Tooling account in every target account.
    - id: c
      text:
        en: |-
          Create an IAM user in each target account, and store its access keys in AWS Secrets Manager in the Tooling account for CodeBuild to retrieve.
    - id: d
      text:
        en: |-
          Add a policy to the CodeBuild service role in the Tooling account that allows sts:AssumeRole on the deployment role ARN of each target account.
    - id: e
      text:
        en: |-
          Add the account IDs of the target accounts as principals in the trust policy of the CodeBuild service role in the Tooling account.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Cross-account access with roles needs both sides: the role in the target account trusts the calling principal and holds the permissions that the target account chooses, and the caller's identity-based policy allows sts:AssumeRole on that role. CodeBuild then receives temporary credentials for each target account.
  options:
    b:
      en: |-
        SCPs do not grant permissions, so an SCP cannot allow the role assumption.
    c:
      en: |-
        IAM user access keys are long-term credentials, which the security team forbids.
    e:
      en: |-
        This lets the target accounts assume the CodeBuild role, which is the opposite direction from what the pipeline needs.
references:
  - title: "IAM tutorial: Delegate access across AWS accounts using IAM roles - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html
  - title: Service control policies (SCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
