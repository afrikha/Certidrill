id: dopc02-2c-lambda-autotag-creator
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants every new Amazon EC2 instance to be tagged with the ARN of the identity that launched it, within seconds of the launch. An AWS CloudTrail trail already logs management events in the account. Developers launch instances from the console, the AWS CLI, and several tools, and the company cannot change those tools.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a tag policy in AWS Organizations that requires a Creator tag key, and set the tag value to the ARN of the identity that launches each instance.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule for RunInstances CloudTrail events, and invoke a Lambda function that tags the new instances with the caller's ARN.
    - id: c
      text:
        en: |-
          Create an AWS Config rule with the required-tags managed rule for the Creator tag key, and review the noncompliant instances every day.
    - id: d
      text:
        en: |-
          Schedule a Lambda function every hour that lists the instances launched in the last hour and tags each one with the ARN of the instance profile role.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With an active trail, EventBridge receives AWS API Call via CloudTrail events for write management events such as RunInstances. The event contains the userIdentity of the caller and the IDs of the new instances, so a Lambda function can call CreateTags within seconds, whatever tool launched the instance.
  options:
    a:
      en: |-
        Tag policies standardize tag keys and values; they do not add tags or know which identity launched an instance.
    c:
      en: |-
        The required-tags rule only reports instances without the tag; it does not add the tag or know the creator.
    d:
      en: |-
        An hourly scan does not tag within seconds, and the instance profile role is not the identity that launched the instance.
references:
  - title: AWS service events delivered via AWS CloudTrail - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
