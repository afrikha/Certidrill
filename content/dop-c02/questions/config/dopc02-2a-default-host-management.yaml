id: dopc02-2a-default-host-management
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 900 Amazon EC2 instances in one account and AWS Region. Many instances were launched by different teams without an instance profile, and others use team-specific instance profiles that grant no Systems Manager permissions. All instances use IMDSv2 and run a current version of SSM Agent. The operations team must make every instance a Systems Manager managed node so that it can use Patch Manager, Inventory, and Session Manager. The team cannot change the instance profiles that the other teams own and wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write an AWS Lambda function that attaches the AmazonSSMManagedInstanceCore policy to every instance profile and creates a profile for each instance that has none.
    - id: b
      text:
        en: |-
          Create a hybrid activation with a registration limit of 900, and register each EC2 instance as a managed node with the activation code and ID.
    - id: c
      text:
        en: |-
          Create a State Manager association that targets all instances in the Region and runs the AWS-UpdateSSMAgent document to register the agent.
    - id: d
      text:
        en: |-
          Turn on Default Host Management Configuration in the Region with the AWSSystemsManagerDefaultEC2InstanceManagementRole role.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Default Host Management Configuration makes Systems Manager manage EC2 instances of a Region and account without an instance profile, through a default role, when the instances use IMDSv2 and SSM Agent 3.2.582.0 or later. An existing instance profile that does not allow ssm:UpdateInstanceInformation does not prevent it, so the other teams' profiles stay unchanged.
  options:
    a:
      en: |-
        Changing every instance profile is custom code and modifies the profiles that the operations team is not allowed to change.
    b:
      en: |-
        Hybrid activations register servers and VMs outside EC2; registering 900 EC2 instances this way is a manual process on each instance.
    c:
      en: |-
        State Manager associations run only on nodes that are already managed, so they cannot reach the unmanaged instances.
references:
  - title: Managing EC2 instances automatically with Default Host Management Configuration - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/fleet-manager-default-host-management-configuration.html
