id: dopc02-2a-stacksets-parameter-overrides
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a service-managed stack set to deploy Amazon CloudWatch alarms for its API fleet to all accounts of a Production OU in three AWS Regions. The template has a parameter named LatencyThresholdMs with a value of 300. Because of network distance, the stacks in ap-southeast-2 need a value of 450. The template must stay identical for all stacks, and the company does not want to maintain a second stack set.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Add a condition on AWS::Region to the template that selects 450 for ap-southeast-2, and update the stack set with the new template.
    - id: b
      text:
        en: |-
          Override LatencyThresholdMs with 450 for the stack instances of the Production OU in ap-southeast-2 by running update-stack-instances with parameter overrides.
    - id: c
      text:
        en: |-
          Create a second stack set with a copy of the template for ap-southeast-2 only, and set LatencyThresholdMs to 450 in that stack set.
    - id: d
      text:
        en: |-
          Update the template of only the ap-southeast-2 stack instances with a default value of 450 for LatencyThresholdMs.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Stack set parameter values can be overridden for the stacks of selected accounts and Regions, and the overrides are kept during later stack set updates. For service-managed permissions, update-stack-instances takes the OU as a deployment target and the Region, while the template stays the same for every stack.
  options:
    a:
      en: |-
        Changing the template to embed Region logic violates the requirement that the template stay identical, and it hard-codes values in the template.
    c:
      en: |-
        A second stack set is the duplication the company wants to avoid.
    d:
      en: |-
        Template updates always apply to all stacks of a stack set; a template cannot be changed for only some stack instances.
references:
  - title: Override parameter values on stacks within your CloudFormation StackSet - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stackinstances-override.html
