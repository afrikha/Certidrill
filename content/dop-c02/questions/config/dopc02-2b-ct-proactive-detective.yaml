id: dopc02-2b-ct-proactive-detective
objective: "2.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company governs its accounts with AWS Control Tower, and all infrastructure in the Workloads OU is deployed with CloudFormation. The company has two new requirements. First, a CloudFormation stack must fail before it creates an Amazon RDS DB instance that does not have encryption at rest. Second, the security team must see the existing DB instances in the OU that were created without storage encryption. The company wants to use Control Tower managed controls.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Activate a CloudFormation Hook for RDS encryption only in the management account, so that member accounts of the Workloads OU inherit it.
    - id: b
      text:
        en: |-
          Enable the proactive control that requires RDS DB instances to have encryption at rest configured on the Workloads OU.
    - id: c
      text:
        en: |-
          Deploy an AWS Config conformance pack from the management account that blocks the creation of unencrypted DB instances.
    - id: d
      text:
        en: |-
          Enable the detective control that detects whether storage encryption is enabled for RDS DB instances on the Workloads OU.
    - id: e
      text:
        en: |-
          Attach a tag policy to the Workloads OU that requires an Encrypted tag on every RDS DB instance.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      Proactive controls are implemented with CloudFormation hooks: they check resources before CloudFormation provisions them, and noncompliant resources are not provisioned. Detective controls are implemented with AWS Config rules and report noncompliant resources that already exist. Both are enabled on an OU and apply to every account in it.
  options:
    a:
      en: |-
        Controls apply to the accounts of the OU on which they are enabled; a hook in the management account does not apply to member accounts.
    c:
      en: |-
        AWS Config rules evaluate resources after they exist and cannot block their creation.
    e:
      en: |-
        Tag policies standardize tags; they do not require them and cannot check encryption settings.
references:
  - title: Control behavior and guidance - AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/controlreference/control-behavior.html
  - title: Amazon Relational Database Service (Amazon RDS) controls - AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/controlreference/rds-rules.html
