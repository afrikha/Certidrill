id: dopc02-2a-cdk-escape-hatch
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A DevOps team manages an Amazon S3 bucket with the L2 Bucket construct in an AWS CDK app written in TypeScript. The app uses the construct's grant methods to give permissions on the bucket to several AWS Lambda functions. AWS CloudFormation recently added a new property to the AWS::S3::Bucket resource. The CDK version that the team must keep this quarter exposes the property neither on the L2 construct nor on the L1 CfnBucket class. The team must set the property in the synthesized template on every deployment and keep the grant methods.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Get the CfnBucket of the bucket through node.defaultChild, and call addPropertyOverride with the property name and value so that it is written to the template.
    - id: b
      text:
        en: |-
          Replace the L2 Bucket construct with an L1 CfnBucket construct, and write IAM policy statements for each Lambda function to replace the grant methods.
    - id: c
      text:
        en: |-
          Add a custom resource backed by a Lambda function that calls the S3 API to set the property after CloudFormation creates or updates the bucket.
    - id: d
      text:
        en: |-
          Run cdk synth in the pipeline, edit the bucket resource in the template file in the cdk.out folder with a script, and then deploy that folder.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An escape hatch reaches the L1 construct inside an L2 construct through node.defaultChild, and raw overrides such as addPropertyOverride write properties that the L1 class does not model yet. The L2 construct and its grant methods stay in place, and the property is synthesized into the template on every run.
  options:
    b:
      en: |-
        Dropping to an L1 construct loses the L2 grant methods, and the property would still be missing from this CfnBucket version, so more work is needed for no gain.
    c:
      en: |-
        A custom resource adds code to maintain and changes the bucket outside its CloudFormation definition, which shows up as drift.
    d:
      en: |-
        cdk.out is regenerated by every synthesis, so editing it with a script is fragile custom tooling that the CDK escape hatches make unnecessary.
references:
  - title: Customize constructs from the AWS Construct Library - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/cfn-layer.html
