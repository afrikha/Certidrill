id: dopc02-2b-rcp-data-perimeter
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 150 member accounts in AWS Organizations with all features enabled. Developers manage their own S3 bucket policies and SQS queue policies, and an audit found several policies that grant access to external AWS accounts. The security team must ensure that no principal outside the organization can access S3 buckets or SQS queues in member accounts, even when a resource policy grants that access. The team must not edit each resource policy, and AWS services that access these resources on the company's behalf must keep working.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP to the organization root that denies s3:* and sqs:* when aws:PrincipalOrgID does not equal the organization ID.
    - id: b
      text:
        en: |-
          Turn on S3 Block Public Access at the account level in every member account with a service-managed StackSet that has automatic deployment.
    - id: c
      text:
        en: |-
          Deploy AWS Config rules for S3 bucket policies and SQS queue policies with automatic remediation that removes external principals.
    - id: d
      text:
        en: |-
          Attach an RCP to the organization root that denies s3:* and sqs:* when aws:PrincipalOrgID does not equal the organization ID and the principal is not an AWS service.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Resource control policies set the maximum permissions for resources in member accounts, whatever their resource policies say, and they support Amazon S3 and Amazon SQS. A Deny for principals outside the organization creates a data perimeter without editing any policy, and excluding requests from AWS service principals (for example with aws:PrincipalIsAWSService) keeps service integrations working.
  options:
    a:
      en: |-
        SCPs limit the principals inside the organization's member accounts; they cannot restrict external principals that access the company's resources.
    b:
      en: |-
        Block Public Access stops public access but not access granted to specific external accounts, and it does not cover SQS queues.
    c:
      en: |-
        Remediation happens after a noncompliant policy is detected, so external access remains possible until then.
references:
  - title: Resource control policies (RCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
