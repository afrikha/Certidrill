id: dopc02-2a-update-replace-snapshot
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company manages an Amazon RDS for PostgreSQL DB instance in an AWS CloudFormation stack. A planned template change modifies a DB instance property that requires replacement, and the change advisory board has approved the replacement. Compliance rules require a final snapshot of the old DB instance before CloudFormation deletes it. The same rules require a final snapshot if the stack is deleted later. The company does not want the old DB instance to keep running after the update.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add DeletionPolicy: Snapshot to the DB instance, and update the stack with the modified template.
    - id: b
      text:
        en: |-
          Add UpdateReplacePolicy: Retain and DeletionPolicy: Retain to the DB instance, and update the stack with the modified template.
    - id: c
      text:
        en: |-
          Add UpdateReplacePolicy: Snapshot and DeletionPolicy: Snapshot to the DB instance, and update the stack with the modified template.
    - id: d
      text:
        en: |-
          Set a stack policy that denies Update:Replace on the DB instance, and update the stack with the modified template.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      UpdateReplacePolicy applies when an update replaces a resource, and Snapshot makes CloudFormation snapshot an AWS::RDS::DBInstance before deleting the old instance. DeletionPolicy covers stack deletion and removal from the template, so the two attributes together meet both compliance rules without keeping the old instance.
  options:
    a:
      en: |-
        DeletionPolicy does not apply to replacement during an update, so the old instance would be deleted without a snapshot because the default UpdateReplacePolicy is Delete.
    b:
      en: |-
        Retain keeps the old DB instance running and billing after the update, which the company does not want, and it takes no snapshot.
    d:
      en: |-
        Denying Update:Replace makes the approved update fail instead of replacing the DB instance with a snapshot.
references:
  - title: UpdateReplacePolicy attribute - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatereplacepolicy.html
