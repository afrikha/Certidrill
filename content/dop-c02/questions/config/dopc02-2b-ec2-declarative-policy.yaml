id: dopc02-2b-ec2-declarative-policy
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 250 member accounts in AWS Organizations. The security team requires that no EBS snapshot be publicly shared, including snapshots that are already public. New AMIs must not be publicly shared, and every new EC2 instance must require IMDSv2. Account administrators must not be able to change these settings, and the settings must stay enforced when Amazon EC2 adds new APIs. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP that denies sharing snapshots and AMIs with all accounts and denies ec2:RunInstances unless the ec2:MetadataHttpTokens condition key is required.
    - id: b
      text:
        en: |-
          Deploy AWS Config rules with automatic remediation that make public snapshots and AMIs private and stop instances that allow IMDSv1.
    - id: c
      text:
        en: |-
          Attach an EC2 declarative policy to the root that blocks all snapshot sharing, blocks new public AMI sharing, and sets IMDSv2 as required with enforcement.
    - id: d
      text:
        en: |-
          Run a Systems Manager Automation runbook every month across all accounts and Regions that sets the account-level EC2 snapshot, AMI, and metadata settings.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Declarative policies are enforced in the service control plane, so the configuration is maintained even when the service adds new features or APIs, and account administrators cannot change the attributes. The EC2 policy supports snapshot block public access (block_all_sharing makes existing public snapshots private), image block public access (block_new_sharing), and instance metadata defaults with IMDSv2 required and enforced.
  options:
    a:
      en: |-
        An SCP acts on API calls: snapshots that are already public stay public, and new APIs could bypass the listed actions.
    b:
      en: |-
        Remediation happens after the fact, so snapshots and instances would be noncompliant until the rules run.
    d:
      en: |-
        Account administrators could change the settings between runs, so the settings are not enforced.
references:
  - title: Declarative policies in AWS Organizations - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_declarative.html
  - title: EC2 policy syntax and examples - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_declarative_syntax.html
