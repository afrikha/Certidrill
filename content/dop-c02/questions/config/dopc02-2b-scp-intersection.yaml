id: dopc02-2b-scp-intersection
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The SCPs that apply to an account in the Analytics OU allow only s3:* and athena:* actions; the FullAWSAccess policy is not attached at any level above the account. A data engineer in the account uses an IAM role whose identity-based policy allows s3:GetObject, dynamodb:Query, and glue:GetTable on all resources. No resource-based policy or permissions boundary applies.

    Which actions can the data engineer perform?
body:
  options:
    - id: a
      text:
        en: |-
          Only s3:GetObject.
    - id: b
      text:
        en: |-
          s3:GetObject, dynamodb:Query, and glue:GetTable.
    - id: c
      text:
        en: |-
          All Amazon S3 and Amazon Athena actions.
    - id: d
      text:
        en: |-
          s3:GetObject and all Amazon Athena actions.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The effective permissions are the intersection of what the SCPs allow and what the identity-based policy allows. Only s3:GetObject is allowed by both; the DynamoDB and Glue actions are outside the SCPs, and the role has no permission for the other S3 or Athena actions.
  options:
    b:
      en: |-
        The SCPs do not allow DynamoDB or Glue actions, so the identity-based policy cannot grant them.
    c:
      en: |-
        SCPs never grant permissions; the role must also allow an action through its own policy.
    d:
      en: |-
        Athena actions are allowed by the SCPs but not by the role's policy, so they are denied.
references:
  - title: Service control policies (SCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
