id: dopc02-2a-parameter-hierarchy-path
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs the same order application in development, staging, and production in one AWS account. Each environment needs about 30 configuration values, a few of which are database passwords. At startup, each application instance must load all the values of its own environment with one API call and decrypt the passwords. Production instances must not be able to read development or staging values. The company wants a solution with no additional service to operate.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store each value as a separate secret in AWS Secrets Manager, and call GetSecretValue for each value when the instance starts.
    - id: b
      text:
        en: |-
          Store all the values of the three environments in one JSON file in an Amazon S3 bucket, and filter the file by environment in the application.
    - id: c
      text:
        en: |-
          Store the values in Parameter Store under paths such as /order/prod/, call GetParametersByPath with decryption, and allow each role only its path.
    - id: d
      text:
        en: |-
          Store the values as items in an Amazon DynamoDB table with the environment as the partition key, and query the table when the instance starts.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Parameter Store hierarchies organize parameters with slash-separated paths, and GetParametersByPath returns the parameters under a path in one call, with SecureString values decrypted when requested. IAM policies can grant each environment's role access only to the parameter ARNs under its own path.
  options:
    a:
      en: |-
        One secret per value needs about 30 GetSecretValue calls at each startup instead of one, and Secrets Manager charges per secret.
    b:
      en: |-
        A single object gives every environment all values, including the other environments' passwords, so production cannot be restricted to its own values.
    d:
      en: |-
        A DynamoDB table is an additional resource to design, provision, and operate for configuration data, which the company wants to avoid.
references:
  - title: Working with parameter hierarchies in Parameter Store - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-hierarchies.html
