id: dopc02-2c-config-inventory-history
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company runs Windows Server and Linux managed nodes on Amazon EC2 and on premises. Systems Manager Inventory collects application data from all nodes every 30 minutes, and a resource data sync exports the data to an S3 bucket. Auditors now require a timeline that shows, for each node, when each application or Windows update was installed, upgraded, or removed over the past year. The company also wants a notification through its existing AWS Config delivery channel whenever the software on a node changes.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on AWS Config recording of the managed instance inventory resource type in each account and Region, and use the configuration timeline of each node.
    - id: b
      text:
        en: |-
          Turn on versioning on the resource data sync bucket, and compare the object versions of each node's inventory file to build the timeline.
    - id: c
      text:
        en: |-
          Create a trail in AWS CloudTrail that records management events, and filter the events for the software installations on each node.
    - id: d
      text:
        en: |-
          Increase the Inventory collection frequency to every 5 minutes, and use the Inventory console to compare the current data with the previous collection.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS Config records the software inventory of managed instances when recording of that resource type is on and Systems Manager Inventory collects the data. Each change becomes a configuration item, so the configuration timeline shows the history of installed applications and Windows updates, and changes are sent to the delivery channel.
  options:
    b:
      en: |-
        The data sync overwrites each node's inventory with the latest data, and comparing object versions is a custom process with no change notification.
    c:
      en: |-
        CloudTrail records AWS API calls; software installed inside the operating system does not produce management events.
    d:
      en: |-
        Inventory shows the latest collected state, not a history, so more frequent collection still gives no timeline over a year.
references:
  - title: Recording Software Configuration for Managed Instances with AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/recording-managed-instance-inventory.html
  - title: Creating a resource data sync for Inventory - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/inventory-create-resource-data-sync.html
