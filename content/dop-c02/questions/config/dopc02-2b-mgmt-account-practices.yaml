id: dopc02-2b-mgmt-account-practices
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS Organizations management account still hosts a production web application and a CI/CD pipeline from the time before the company adopted a multi-account strategy. An internal review found that the organization's service control policies do not limit the IAM roles that the pipeline uses. Several platform teams also sign in to the management account to administer CloudFormation StackSets and AWS Service Catalog for the organization. The company wants to align the management account with AWS best practices.

    Which combination of actions should the company take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Attach an SCP directly to the management account that denies all actions except AWS Organizations and billing actions for the pipeline roles.
    - id: b
      text:
        en: |-
          Move the management account into the Workloads OU so that the SCPs attached to that OU also apply to the pipeline roles.
    - id: c
      text:
        en: |-
          Migrate the production application and the pipeline to member accounts, and keep in the management account only the resources that must be there.
    - id: d
      text:
        en: |-
          Grant all developers read-only access to the management account so that they can troubleshoot the workloads after the migration.
    - id: e
      text:
        en: |-
          Register member accounts as delegated administrators for CloudFormation StackSets and AWS Service Catalog, and have the platform teams work from those accounts.
answer: { optionIds: [c, e] }
explanation:
  correct:
    en: |-
      SCPs never restrict users or roles in the management account, so AWS recommends keeping workloads and data out of it and storing resources in member accounts. Registering member accounts as delegated administrators for services such as StackSets and Service Catalog lets teams administer them for the organization without access to the management account.
  options:
    a:
      en: |-
        SCPs do not affect users or roles in the management account, so this SCP would have no effect.
    b:
      en: |-
        Wherever the management account sits in the hierarchy, SCPs do not apply to it.
    d:
      en: |-
        Best practice is to limit access to the management account to the administrators who must make changes to the organization, not to widen it.
references:
  - title: Best practices for the management account - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_best-practices_mgmt-acct.html
  - title: Service control policies (SCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
