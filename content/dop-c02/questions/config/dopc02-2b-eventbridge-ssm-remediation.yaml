id: dopc02-2b-eventbridge-ssm-remediation
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's organization trail records management events for all accounts, and EventBridge receives these events in each account. Security policy requires that, within minutes after anyone adds a security group rule that allows 0.0.0.0/0 on port 22 in a production account, the rule be removed automatically. Each removal must be recorded in Systems Manager. The team has written an Automation runbook that revokes such rules for a given security group ID. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch Logs metric filter on the VPC flow logs for inbound port 22 traffic, with an alarm that notifies the security team through Amazon SNS.
    - id: b
      text:
        en: |-
          Create an AWS Config rule that runs every 24 hours to find security groups open on port 22, with the runbook configured as its automatic remediation.
    - id: c
      text:
        en: |-
          In each production account, create an EventBridge rule for AuthorizeSecurityGroupIngress calls that starts the runbook with the security group ID as its input.
    - id: d
      text:
        en: |-
          Create a Lambda function that runs every hour, calls DescribeSecurityGroups in each production account, and revokes the matching rules.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      EventBridge can match the AuthorizeSecurityGroupIngress API call that CloudTrail records and start a Systems Manager Automation runbook as the rule's target, using an IAM role for EventBridge. An input transformer passes the group ID to the runbook, the reaction happens within minutes, and each execution is recorded in Automation's history.
  options:
    a:
      en: |-
        Flow logs record traffic, not rule changes, and the alarm only notifies people; nothing removes the rule.
    b:
      en: |-
        A rule that runs every 24 hours can leave the port open for up to a day, which misses the within-minutes requirement.
    d:
      en: |-
        Hourly polling with custom code is slower than the requirement and is more code to maintain.
references:
  - title: Event bus targets in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-targets.html
