id: dopc02-2b-bucket-policy-principalorgid
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores shared deployment artifacts in an S3 bucket that uses SSE-S3 encryption in a Shared Services account. IAM roles in every account of the company's organization have identity-based policies that allow s3:GetObject on the bucket. Roles in all accounts, including accounts created in the future, must be able to read the artifacts. No principal outside the organization may read them, and the company does not want to update the bucket policy when accounts are added.

    Which bucket policy statement will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Allow s3:GetObject to a list of the account IDs of all member accounts, and have a Lambda function add new account IDs when accounts are created.
    - id: b
      text:
        en: |-
          Allow s3:GetObject to Principal "*" with a condition that requires the aws:PrincipalOrgID key to equal the company's organization ID.
    - id: c
      text:
        en: |-
          Allow s3:GetObject to Principal "*" with a condition that requires the aws:ResourceOrgID key to equal the company's organization ID.
    - id: d
      text:
        en: |-
          Share the bucket with the organization through AWS RAM, and allow s3:GetObject to the principals of the resource share.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The aws:PrincipalOrgID condition key compares the organization of the requesting principal with the value in the policy. It replaces a list of account IDs, so accounts that join the organization later get access automatically and principals outside the organization are refused.
  options:
    a:
      en: |-
        This needs custom code and policy updates for every new account, which the company wants to avoid.
    c:
      en: |-
        aws:ResourceOrgID describes the organization of the resource being accessed, which is always the company's organization for this bucket, so the statement would allow any principal.
    d:
      en: |-
        AWS RAM does not share S3 buckets (among S3 resources it shares only S3 Access Grants instances); access to a bucket from other accounts is granted with the bucket policy.
references:
  - title: AWS global condition context keys - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
  - title: Shareable AWS resources - AWS Resource Access Manager
    url: https://docs.aws.amazon.com/ram/latest/userguide/shareable.html
