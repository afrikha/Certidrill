id: dopc02-2b-guardduty-regional-admin
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company designated its Security Tooling account as the Amazon GuardDuty delegated administrator in us-east-1 and set organization auto-enable to ALL there. Workloads also run in eu-west-1 and ap-southeast-2. The security team sees no GuardDuty findings from member accounts in those two Regions in the Security Tooling account. The team must manage GuardDuty for all accounts in all three Regions from the Security Tooling account.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Designate a different member account as the GuardDuty delegated administrator in each of the two Regions, and aggregate their findings in AWS Security Hub CSPM.
    - id: b
      text:
        en: |-
          From the management account, designate the Security Tooling account as the GuardDuty delegated administrator in eu-west-1 and ap-southeast-2, and set auto-enable to ALL in each Region.
    - id: c
      text:
        en: |-
          Enable GuardDuty in the management account in eu-west-1 and ap-southeast-2, so that member account findings there are forwarded to the delegated administrator in us-east-1.
    - id: d
      text:
        en: |-
          Change the auto-enable configuration in us-east-1 to include all Regions, so that the delegated administrator manages GuardDuty in every Region.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      GuardDuty is a Regional service, so the delegated administrator and its member accounts must be set up in each Region where GuardDuty is used. The same account must be the delegated administrator in all Regions, and the ALL auto-enable setting covers existing and new member accounts in each Region.
  options:
    a:
      en: |-
        GuardDuty requires the same delegated administrator account across all Regions, and the team must manage GuardDuty from the Security Tooling account.
    c:
      en: |-
        GuardDuty in the management account does not enable or manage member accounts, and findings are not forwarded between Regions.
    d:
      en: |-
        The auto-enable configuration applies only in the Region where it is set; there is no multi-Region setting.
references:
  - title: Managing GuardDuty accounts with AWS Organizations - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_organizations.html
