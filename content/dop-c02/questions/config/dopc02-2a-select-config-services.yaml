id: dopc02-2a-select-config-services
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is replacing a set of retired and in-house tools for configuration management. It has three requirements. First, record every configuration change of its AWS resources and evaluate the resources against compliance rules. Second, keep the software and settings of its Amazon EC2 instances in a defined state on a schedule. Third, change application settings at runtime with gradual rollouts and automatic rollback. The company wants AWS managed services.

    Which combination of services will meet these requirements? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          AWS Config
    - id: b
      text:
        en: |-
          AWS OpsWorks for Puppet Enterprise
    - id: c
      text:
        en: |-
          AWS Systems Manager State Manager
    - id: d
      text:
        en: |-
          AWS CloudTrail Lake
    - id: e
      text:
        en: |-
          AWS AppConfig
    - id: f
      text:
        en: |-
          AWS Systems Manager Change Manager
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      AWS Config records resource configuration changes and evaluates resources with rules. State Manager associations keep managed nodes in a defined state on a schedule. AppConfig deploys application configuration and feature flags with deployment strategies and rolls back on CloudWatch alarms.
  options:
    b:
      en: |-
        All OpsWorks services, including OpsWorks for Puppet Enterprise, have reached end of life and are disabled.
    d:
      en: |-
        CloudTrail Lake records API activity rather than resource configuration states, and it is no longer open to new customers.
    f:
      en: |-
        Change Manager handles approval workflows for operational changes, does not keep instances in a desired state, and is no longer open to new customers.
references:
  - title: What Is AWS Config? - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html
  - title: AWS Systems Manager State Manager - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state.html
