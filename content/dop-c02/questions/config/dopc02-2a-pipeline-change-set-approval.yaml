id: dopc02-2a-pipeline-change-set-approval
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A financial services company uses AWS CodePipeline to deploy AWS CloudFormation templates to a production account. Today, the production stage uses one CloudFormation deploy action in CREATE_UPDATE mode, so changes reach production as soon as the stage starts. The company's change process now requires that the proposed resource changes be prepared without modifying the stack. A change manager must review those changes and approve them in the pipeline. Only after the approval can the changes be applied to the stack.

    Which combination of actions should the DevOps engineer configure in the production stage, in order? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          A CloudFormation deploy action in CHANGE_SET_REPLACE mode that creates the change set from the template artifact.
    - id: b
      text:
        en: |-
          A CloudFormation deploy action in REPLACE_ON_FAILURE mode that updates the stack after the change manager reviews the template.
    - id: c
      text:
        en: |-
          A manual approval action that notifies the change manager through an Amazon SNS topic with a link to the change set.
    - id: d
      text:
        en: |-
          An AWS Systems Manager Change Manager change request that the change manager approves before the pipeline continues.
    - id: e
      text:
        en: |-
          A CloudFormation deploy action in CHANGE_SET_EXECUTE mode that executes the change set on the production stack.
    - id: f
      text:
        en: |-
          A CloudFormation deploy action in CREATE_UPDATE mode that runs after the approval with the same template artifact.
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      CHANGE_SET_REPLACE creates or re-creates a change set without changing the stack, a manual approval action pauses the pipeline and notifies the reviewer, and CHANGE_SET_EXECUTE applies exactly the reviewed change set. This sequence ensures that what is approved is what is deployed.
  options:
    b:
      en: |-
        REPLACE_ON_FAILURE updates the stack directly with no change set to review, and it can delete and re-create a stack in a failed state, which is meant for testing.
    d:
      en: |-
        Systems Manager Change Manager is no longer open to new customers, and the pipeline's own manual approval action already provides the approval gate.
    f:
      en: |-
        CREATE_UPDATE applies the template directly instead of the change set that was reviewed, so the approved changes and the applied changes could differ.
references:
  - title: CloudFormation deploy action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CloudFormation.html
