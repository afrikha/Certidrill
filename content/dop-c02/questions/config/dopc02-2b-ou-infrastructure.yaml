id: dopc02-2b-ou-infrastructure
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is designing its AWS Organizations structure by following the AWS guidance for organizing a multi-account environment. A network team will run AWS Transit Gateway, shared Route 53 Resolver rules, and centralized internet egress in dedicated accounts. These networking services will be shared with all the company's workload accounts.

    In which OU should the company place the network accounts?
body:
  options:
    - id: a
      text:
        en: |-
          The Security OU, which groups the accounts that apply security policies and governance controls across the organization.
    - id: b
      text:
        en: |-
          The Infrastructure OU, which groups the accounts that host core infrastructure and networking services shared across the organization.
    - id: c
      text:
        en: |-
          The Workloads OU, which groups the accounts that host the organization's production and non-production business workloads.
    - id: d
      text:
        en: |-
          The Deployments OU, which groups the accounts that host the services that deploy applications and infrastructure across accounts.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In the recommended OU structure, the Infrastructure OU is a foundational OU for accounts that host and manage core infrastructure and networking services shared across the organization, such as a network account that owns a transit gateway and shared egress.
  options:
    a:
      en: |-
        The Security OU is for accounts that apply security, governance, and compliance controls, such as log archive and security tooling accounts, not for shared networking.
    c:
      en: |-
        The Workloads OU holds business application accounts. Shared networking that serves all workloads belongs in the Infrastructure OU.
    d:
      en: |-
        The Deployments OU holds the accounts that orchestrate deployments, such as CI/CD tooling accounts, not network services.
references:
  - title: Recommended OUs and accounts - Organizing Your AWS Environment Using Multiple Accounts
    url: https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/recommended-ous-and-accounts.html
