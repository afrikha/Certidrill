id: dopc02-2b-enable-all-features
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company created its organization in AWS Organizations several years ago with consolidated billing features only. The organization has 15 member accounts: 10 were invited and 5 were created through AWS Organizations. The company now wants to use service control policies on its OUs.

    What must the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable the SCP policy type on the organization root, because consolidated billing organizations support SCPs once the policy type is enabled.
    - id: b
      text:
        en: |-
          Create a new organization with all features, remove each account from the current organization, and invite each account to the new one.
    - id: c
      text:
        en: |-
          Start enabling all features from the management account, have each of the 10 invited accounts approve the request, and then enable the SCP policy type.
    - id: d
      text:
        en: |-
          Enable trusted access for AWS Control Tower, which switches the organization to all features without approval from the member accounts.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      SCPs are available only in an organization with all features enabled. When the management account starts the change, every invited account must approve it, while accounts created through AWS Organizations do not receive a request. The change is one-way, and the SCP policy type can then be enabled on the root.
  options:
    a:
      en: |-
        SCPs are not available in an organization that has only consolidated billing features.
    b:
      en: |-
        The existing organization can be switched to all features in place, so rebuilding it is unnecessary work.
    d:
      en: |-
        Trusted access for a service requires all features, and enabling all features always needs approval from invited accounts.
references:
  - title: Enabling all features for an organization with AWS Organizations - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_org_support-all-features.html
