id: dopc02-2a-config-sg-history
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team investigates a data exposure that happened three weeks ago in a production account. The team must find which inbound rules a specific security group had on that day and which network interfaces and EC2 instances were attached to the group at that time. The team also wants a notification for every future change to security groups in the account. The company wants a managed solution that keeps this history without custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on AWS Config recording for security groups and related resources, review the configuration timeline and relationships, and send change notifications through Amazon SNS.
    - id: b
      text:
        en: |-
          Create an AWS CloudTrail Lake event data store, and query it with SQL for the security group calls made on that day and since then.
    - id: c
      text:
        en: |-
          Turn on VPC Flow Logs for every subnet, and query the logs with Amazon Athena to rebuild the rules that were in effect on that day.
    - id: d
      text:
        en: |-
          Collect Systems Manager Inventory from every instance every 30 minutes, and query the network configuration that each node reported on that day.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS Config records how resource configurations change over time and how resources relate to each other, so the configuration timeline of the security group shows its rules and attached resources at a past date. Configuration stream notifications can be sent through Amazon SNS for every change.
  options:
    b:
      en: |-
        CloudTrail Lake is no longer open to new customers, and API events show calls, not the resulting rule set and attachments at a point in time.
    c:
      en: |-
        Flow logs record accepted and rejected traffic, not the configured rules or the group's attachments, so the rule set cannot be rebuilt reliably.
    d:
      en: |-
        Inventory describes software and settings on managed nodes; it does not record security group rules or their attachments.
references:
  - title: What Is AWS Config? - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html
