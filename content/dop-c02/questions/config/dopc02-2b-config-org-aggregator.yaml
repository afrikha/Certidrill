id: dopc02-2b-config-org-aggregator
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 80 accounts in AWS Organizations and uses AWS Config in four Regions. The Audit account is registered as a delegated administrator for AWS Config. Auditors need a single view, in the Audit account, of resource configurations and compliance status across all accounts and Regions, including accounts added later. The company does not want to request authorization from each account.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy an organization conformance pack from the Audit account in each of the four Regions.
    - id: b
      text:
        en: |-
          Create an organization trail that delivers CloudTrail logs from all accounts to a bucket in the Audit account.
    - id: c
      text:
        en: |-
          Deliver Config snapshots from every account to an S3 bucket in the Audit account, and query them with Amazon Athena.
    - id: d
      text:
        en: |-
          Create an AWS Config aggregator in the Audit account with the organization as its source and all four Regions selected.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An aggregator collects Config configuration and compliance data from source accounts and Regions into the aggregator account. When the source is the organization, all accounts with Config enabled are included, no authorization is required, and aggregators have no additional cost.
  options:
    a:
      en: |-
        Conformance packs deploy rules; they do not provide a central view of resources across accounts.
    b:
      en: |-
        CloudTrail records API activity, not the configuration and compliance status of resources.
    c:
      en: |-
        This builds a custom solution with delivery channels and queries in every account, which the managed aggregator already provides.
references:
  - title: Multi-Account Multi-Region Data Aggregation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html
