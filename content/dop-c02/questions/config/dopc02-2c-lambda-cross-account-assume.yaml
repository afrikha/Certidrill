id: dopc02-2c-lambda-cross-account-assume
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 25 member accounts in AWS Organizations and a central automation account. Every evening, an AWS Lambda function in the automation account must stop the Amazon EC2 instances that lack a CostCenter tag in every member account. The security team forbids long-term credentials and requires least privilege. The company wants to deploy the cross-account permissions consistently, including to accounts that join the organization later.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy a role that allows only the needed EC2 actions and trusts the function's role with an auto-deploying service-managed stack set, and assume it in each account.
    - id: b
      text:
        en: |-
          Create an IAM user with only the needed EC2 permissions in each member account, and store its access keys in AWS Secrets Manager in the automation account for the function to read.
    - id: c
      text:
        en: |-
          Add a statement that allows the 25 member accounts to the function's resource-based policy, so that the function can call the EC2 API in those accounts with its own execution role.
    - id: d
      text:
        en: |-
          Create a role with the AdministratorAccess policy that trusts the automation account in each member account by hand, and have the function assume the role in each account.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A cross-account role in each member account, trusted by the function's execution role, lets the function obtain temporary credentials with AssumeRole and call the EC2 API there. A service-managed stack set with automatic deployment creates the role in every account, including accounts that join later, and the role allows only the two required actions.
  options:
    b:
      en: |-
        IAM user access keys are long-term credentials, which the security team forbids, and they must be created in each new account by hand.
    c:
      en: |-
        A function's resource-based policy controls who can invoke the function; it does not let the function act in other accounts.
    d:
      en: |-
        AdministratorAccess and a trust in the whole automation account violate least privilege, and the roles would not be deployed to new accounts automatically.
references:
  - title: Access for an IAM user in another AWS account that you own - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_aws-accounts.html
  - title: Enable or disable automatic deployments for StackSets in AWS Organizations - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-manage-auto-deployment.html
