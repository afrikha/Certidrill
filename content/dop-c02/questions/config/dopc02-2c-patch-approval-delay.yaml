id: dopc02-2c-patch-approval-delay
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company patches its Amazon Linux production instances with Patch Manager every week. After a faulty package update caused an outage, the change board decided that production must install only security patches that have been released or updated at least 7 days earlier. Newer patches must be installed automatically once they reach that age, without anyone editing the configuration each week.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a custom patch baseline with an approval rule that sets an auto-approval cutoff date 7 days before the day the baseline is created.
    - id: b
      text:
        en: |-
          Create a custom patch baseline with an approval rule for security patches that sets an auto-approval delay of 7 days, and use it for the production instances.
    - id: c
      text:
        en: |-
          Keep the AWS managed patch baseline, and add every patch released in the last 7 days to its rejected patches list before each weekly patching run.
    - id: d
      text:
        en: |-
          Keep the AWS managed patch baseline, and move the weekly installation schedule of the production instances 7 days after the schedule of the test instances.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An auto-approval delay approves each patch a set number of days after it is released or last updated, so a 7-day delay keeps every newer patch out of production until it is 7 days old. The rule applies to new patches automatically, with no weekly edits.
  options:
    a:
      en: |-
        A cutoff date is fixed: patches released after that date are never approved automatically, so the baseline would have to be edited every week.
    c:
      en: |-
        AWS managed baselines cannot be edited, and maintaining a rejected list by hand every week is the manual work the board wants to avoid.
    d:
      en: |-
        Delaying the schedule does not age the patches: a patch released the day before the production run would still be installed.
references:
  - title: Predefined and custom patch baselines - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-predefined-and-custom-patch-baselines.html
