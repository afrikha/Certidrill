id: dopc02-2a-rollback-trigger-alarm
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company deploys a web application with an AWS CloudFormation stack that contains an Application Load Balancer, an Auto Scaling group, and AWS Lambda functions. The team has an Amazon CloudWatch composite alarm that combines the 5XX error rate and the p99 latency of the application. Some stack updates have introduced errors that appeared only a few minutes after the update completed. The company wants CloudFormation to roll back the entire update automatically if the composite alarm enters the ALARM state during the update or in the 15 minutes after all resources are updated. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the composite alarm as a rollback trigger in the stack's rollback configuration, and set the monitoring time to 15 minutes for each update.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule for the alarm state change that invokes a Lambda function, and make the function call CancelUpdateStack on the stack.
    - id: c
      text:
        en: |-
          Add a CreationPolicy with a 15-minute timeout to the Auto Scaling group, and make the instances send a failure signal when the alarm is in the ALARM state.
    - id: d
      text:
        en: |-
          Create an AWS CodeDeploy deployment group for the stack with automatic rollback when the composite alarm is in the ALARM state for 15 minutes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Rollback triggers make CloudFormation monitor up to five CloudWatch alarms, including composite alarms, during a create or update and for a monitoring time of 0 to 180 minutes after the last resource is deployed. If an alarm enters ALARM in that window, CloudFormation rolls back the whole operation with no custom code.
  options:
    b:
      en: |-
        This is custom code, and CancelUpdateStack only works while an update is in progress, so it cannot roll back an update that has already completed.
    c:
      en: |-
        CreationPolicy applies only when a resource is created, not during stack updates, and instances do not evaluate CloudWatch alarms.
    d:
      en: |-
        CodeDeploy rolls back application revisions that it deploys to EC2, ECS, or Lambda; it cannot roll back a CloudFormation stack update.
references:
  - title: Roll back your CloudFormation stack on alarm breach with rollback triggers - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-rollback-triggers.html
