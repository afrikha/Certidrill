id: dopc02-2a-ssm-parameters-decouple-stacks
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A network team owns an AWS CloudFormation stack that exports the IDs of a shared VPC's subnets and security groups. Twenty application stacks owned by other teams use Fn::ImportValue to read these exports. When the network team replaced a security group, its stack update failed because the export was in use by other stacks. The network team wants to change these values in the future without coordinating a change in all 20 stacks first. Each application stack must pick up the new values at its next deployment, and the teams must keep separate stack lifecycles.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Convert the 20 application stacks into nested stacks of the network stack, and pass the subnet and security group IDs to them as nested stack parameters.
    - id: b
      text:
        en: |-
          Export the values under a new export name for each change, and ask each team to switch its Fn::ImportValue to the new name before the old export is removed.
    - id: c
      text:
        en: |-
          Deploy the network stack as a stack set to every account and Region that the applications use, and keep the Fn::ImportValue references in the application templates.
    - id: d
      text:
        en: |-
          Write the IDs to Parameter Store with AWS::SSM::Parameter resources in the network stack, and read them in the application templates with SSM parameter types.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An exported output cannot be changed or removed while another stack imports it, which caused the failure. Parameter Store values have no such lock: the network stack can update them at any time, and application stacks that declare SSM parameter types read the current value each time they are created or updated.
  options:
    a:
      en: |-
        Nested stacks are created and updated through their parent stack, so the teams would lose their separate stack lifecycles.
    b:
      en: |-
        Versioned export names still need a coordinated change in all 20 stacks for every new value, which the network team wants to avoid.
    c:
      en: |-
        Deploying the network stack with StackSets does not change how exports are locked by importing stacks.
references:
  - title: Specify existing resources at runtime with CloudFormation-supplied parameter types - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cloudformation-supplied-parameter-types.html
  - title: Refer to resource outputs in another CloudFormation stack - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/walkthrough-crossstackref.html
