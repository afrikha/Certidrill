id: dopc02-2b-sc-launch-constraint
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's platform team publishes an AWS Service Catalog portfolio in a shared application account. The portfolio contains a CloudFormation product that creates an Amazon RDS for PostgreSQL DB instance with encryption, automated backups, a dedicated security group, and approved parameter groups. Application developers in the account must be able to launch, update, and terminate this product themselves. The developers must not be able to create RDS DB instances, security groups, or KMS grants directly outside AWS Service Catalog. The security team wants least-privilege permissions for the developers and no manual step for each launch.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the developers an IAM policy that allows the RDS, EC2 security group, KMS, and CloudFormation actions that the template uses, and add a template constraint that limits the DB instance classes.
    - id: b
      text:
        en: |-
          Grant the developers the AWS Service Catalog end-user permissions, and add a stack set constraint to the product that names an IAM StackSet administrator role with the RDS permissions.
    - id: c
      text:
        en: |-
          Create an IAM role that AWS Service Catalog can assume with the CloudFormation, RDS, EC2, and KMS permissions, add it to the product as a launch constraint, and grant the developers only end-user permissions.
    - id: d
      text:
        en: |-
          Create an IAM role with the RDS, EC2, and KMS permissions, and allow the developers to assume it so that they can launch the product from the AWS Service Catalog console under that role.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A launch constraint names the IAM role that AWS Service Catalog assumes when a user launches, updates, or terminates the product, so the resources are created with the role's permissions instead of the user's. The developers then need only the Service Catalog end-user actions such as servicecatalog:ProvisionProduct, which stay on their own identity. They cannot call RDS, EC2, or KMS directly.
  options:
    a:
      en: |-
        Without a launch constraint, provisioning uses the developers' own permissions, so they would also be able to create DB instances, security groups, and grants directly. A template constraint only limits parameter values.
    b:
      en: |-
        A stack set constraint configures the accounts, Regions, and StackSet administrator role for StackSets deployments. It does not give Service Catalog a launch role, so the launch would still use the developers' permissions.
    d:
      en: |-
        Developers who can assume a role with RDS, EC2, and KMS permissions can use that role outside AWS Service Catalog, which breaks the requirement.
references:
  - title: AWS Service Catalog Launch Constraints - AWS Service Catalog
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/constraints-launch.html
