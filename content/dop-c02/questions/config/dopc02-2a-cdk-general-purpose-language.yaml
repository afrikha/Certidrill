id: dopc02-2a-cdk-general-purpose-language
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team at a fintech company maintains hand-written AWS CloudFormation YAML templates for 40 microservices. Most of the templates are copies of each other with small differences, and every change to the common pattern must be repeated in 40 files. The team members are experienced TypeScript developers. They want to define the infrastructure with loops, classes, and unit tests, and to publish the shared patterns as an internal library that service teams import. CloudFormation must remain the deployment engine so that the team keeps stack rollback and drift detection. The team wants the LEAST custom tooling.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Convert the templates to AWS SAM templates, and move the common settings of the services into the Globals section of each template.
    - id: b
      text:
        en: |-
          Rewrite the infrastructure as an AWS CDK app in TypeScript, publish the shared patterns as a construct library, and deploy the synthesized CloudFormation templates.
    - id: c
      text:
        en: |-
          Write a Python script that renders the 40 templates from Jinja2 files in an AWS CodeBuild project, and deploy the rendered templates with the AWS CLI.
    - id: d
      text:
        en: |-
          Create a CloudFormation macro backed by an AWS Lambda function that expands a custom shorthand syntax into the full resources of each service.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The AWS CDK lets the team define infrastructure in TypeScript with loops, classes, and unit tests, and share patterns as construct libraries that other teams import. The CDK synthesizes standard CloudFormation templates, so stacks are still deployed by CloudFormation with rollback and drift detection, and no custom rendering tool has to be maintained.
  options:
    a:
      en: |-
        The SAM Globals section only shares properties among serverless resources inside one template; it gives no loops, classes, unit tests, or cross-team library.
    c:
      en: |-
        A Jinja2 rendering script is custom tooling that the team must build, test, and maintain, which the LEAST custom tooling requirement excludes.
    d:
      en: |-
        A macro means writing and operating a Lambda function and a private shorthand syntax, and it gives no type checking or unit-testing framework for the infrastructure code.
references:
  - title: Customize constructs from the AWS Construct Library - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/cfn-layer.html
