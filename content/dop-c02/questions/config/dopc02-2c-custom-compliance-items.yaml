id: dopc02-2c-custom-compliance-items
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's security team requires an in-house endpoint protection agent of version 7.2 or later on every managed node. A script that runs on each node through a State Manager association already detects the installed agent version. The operations team reviews patch compliance and association compliance in Systems Manager Compliance, and it wants the result of the agent check to appear there as its own compliance type, next to patch and association data, with CRITICAL severity for noncompliant nodes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Have the script call the PutComplianceItems API for the node with the Custom:EndpointAgent compliance type, a CRITICAL severity, and the check status.
    - id: b
      text:
        en: |-
          Have the script publish a custom Amazon CloudWatch metric with the agent version, and create an alarm with CRITICAL in its name for nodes below version 7.2.
    - id: c
      text:
        en: |-
          Have the script write the agent version as a custom inventory type with the PutInventory API, and filter the inventory for nodes below version 7.2.
    - id: d
      text:
        en: |-
          Have the script call the PutEvaluations API of an AWS Config custom rule for each node, with a NON_COMPLIANT result for nodes below version 7.2.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      PutComplianceItems registers custom compliance details on a managed node under a compliance type named Custom:<name>, with a severity and a status for each item. Systems Manager Compliance then shows this custom type next to the patch and association compliance data.
  options:
    b:
      en: |-
        A CloudWatch metric and alarm are monitoring data; they do not appear as a compliance type in Systems Manager Compliance.
    c:
      en: |-
        Custom inventory records metadata about the node; it has no compliance status or severity and is not shown as a compliance type.
    d:
      en: |-
        PutEvaluations returns results for an invocation of an AWS Config rule, and the results appear in AWS Config, not as a compliance type in Systems Manager Compliance.
references:
  - title: PutComplianceItems - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_PutComplianceItems.html
  - title: AWS Systems Manager Compliance - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-compliance.html
