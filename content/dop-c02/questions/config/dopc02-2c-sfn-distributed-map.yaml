id: dopc02-2c-sfn-distributed-map
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company must reprocess 4 million objects in an S3 bucket. For each object, an existing AWS Step Functions workflow checks the object's metadata, copies the object to a new storage location when a condition is met, and then tags it; each step is an AWS Lambda function. The company wants thousands of objects processed in parallel, wants the run to continue unless more than 1 % of the objects fail, and wants the results of every object written to Amazon S3 for review. The company wants to reuse the existing workflow steps with the least custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an inline Map state to the workflow that receives the list of object keys as input and runs the steps for each key with MaxConcurrency set to 5,000.
    - id: b
      text:
        en: |-
          Add a Distributed Map state with an ItemReader that lists the bucket's objects, run the steps as child workflows, set ToleratedFailurePercentage to 1, and add a ResultWriter.
    - id: c
      text:
        en: |-
          Write one Lambda function that lists the objects, runs the three steps for each object in sequence, and writes the results to Amazon S3 before its timeout.
    - id: d
      text:
        en: |-
          Start one Express workflow execution for each object from a script, and use a Catch field in each execution to count failures in an Amazon DynamoDB table.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Map state in Distributed mode reads items from an S3 data source and runs each item as a child workflow, with up to 10,000 child executions in parallel. ToleratedFailurePercentage lets the Map Run continue until the failure share exceeds the threshold, and ResultWriter writes the results of the child executions to Amazon S3.
  options:
    a:
      en: |-
        Inline mode is meant for at most 40 concurrent iterations, small inputs, and an execution history under 25,000 events, so it cannot handle 4 million objects.
    c:
      en: |-
        A single function processes objects sequentially and stops after at most 15 minutes, so it cannot process 4 million objects in parallel.
    d:
      en: |-
        Starting 4 million executions from a script and counting failures in DynamoDB is custom code, and nothing stops the run at the 1 % threshold.
references:
  - title: Using Map state in Distributed mode for large-scale parallel workloads in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-map-distributed.html
