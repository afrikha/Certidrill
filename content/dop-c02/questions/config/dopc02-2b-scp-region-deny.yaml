id: dopc02-2b-scp-region-deny
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company must keep all its workloads in eu-west-1 and eu-central-1. The DevOps team attached an SCP to the Workloads OU with a single Deny statement for all actions on all resources when aws:RequestedRegion is not one of these two Regions. Since then, engineers in workload accounts cannot manage IAM roles, open AWS Support cases, or change Route 53 records, and CloudFront distribution updates fail. The company wants to restore these global services while keeping the Region restriction for all Regional services.

    Which change to the SCP will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the Deny statement with an Allow statement for all actions with the same Region condition, and detach the FullAWSAccess policy from the OU.
    - id: b
      text:
        en: |-
          Change the Deny statement to use NotAction with the global services that the company uses, such as IAM, Route 53, CloudFront, and AWS Support, and keep the Region condition.
    - id: c
      text:
        en: |-
          Add us-east-1 to the list of Regions in the condition of the Deny statement, so that requests to global service endpoints are no longer denied.
    - id: d
      text:
        en: |-
          Keep the Deny statement, and add an Allow statement for iam:*, route53:*, cloudfront:*, and support:* to the same SCP.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Global services such as IAM, Route 53, CloudFront, and AWS Support are served from us-east-1, so a Deny on every action outside the approved Regions also blocks them. Using NotAction exempts the listed global services from the Deny while every other action remains denied outside eu-west-1 and eu-central-1.
  options:
    a:
      en: |-
        An Allow statement limited to the two Regions still does not allow the global services, whose requests are made to us-east-1, so they stay blocked.
    c:
      en: |-
        Allowing us-east-1 would also allow every Regional service there, which breaks the residency requirement.
    d:
      en: |-
        An explicit Deny always overrides an Allow, so the global service actions would still be denied.
references:
  - title: Service control policies (SCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
  - title: AWS global condition context keys - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
