id: dopc02-2b-scp-protect-role
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team deploys an IAM role named SecAuditRole to every member account with a service-managed StackSet. Administrators of the member accounts use roles that have the AdministratorAccess policy. The administrators must not be able to modify or delete SecAuditRole, its policies, or its trust policy. The StackSet must still be able to update the role in every account.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a permissions boundary to the administrators' roles in every account that denies IAM write actions on SecAuditRole.
    - id: b
      text:
        en: |-
          Attach an SCP that denies IAM write actions on the SecAuditRole ARN unless aws:PrincipalArn matches the StackSets execution role.
    - id: c
      text:
        en: |-
          Create an AWS Config rule that detects changes to SecAuditRole and sends a notification to the security team through Amazon SNS.
    - id: d
      text:
        en: |-
          Add a statement to the trust policy of SecAuditRole that denies the administrators' roles any action on SecAuditRole.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An SCP applies to every principal in the member accounts, including administrators and the root user, and account administrators cannot change it. The ArnNotLike condition on aws:PrincipalArn exempts the StackSets execution role, so the StackSet can still update SecAuditRole.
  options:
    a:
      en: |-
        Administrators with full IAM permissions can remove a permissions boundary from their own roles, so it is not a reliable control.
    c:
      en: |-
        A Config rule only detects the change after it happens; it does not prevent it.
    d:
      en: |-
        A trust policy controls only who can assume the role, not who can modify or delete it.
references:
  - title: Service control policies (SCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
