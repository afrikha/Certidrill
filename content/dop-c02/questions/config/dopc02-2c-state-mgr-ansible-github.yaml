id: dopc02-2c-state-mgr-ansible-github
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores its Ansible playbooks in a private GitHub repository. It wants a fleet of Ubuntu Server managed nodes to apply the main playbook every night so that their configuration returns to the desired state. Ansible is not installed on the nodes, and the company does not want to build a new AMI. The GitHub personal access token must not appear in plaintext in the association. The company wants to use the document that AWS currently recommends for this task.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a State Manager association that runs AWS-RunAnsiblePlaybook with the playbook URL and the token in its parameters, and set a nightly schedule.
    - id: b
      text:
        en: |-
          Create a State Manager association that runs AWS-ApplyAnsiblePlaybooks with SourceType GitHub, InstallDependencies False, and the token as a String parameter in Parameter Store.
    - id: c
      text:
        en: |-
          Create a nightly maintenance window that runs AWS-RunShellScript to install Ansible, clone the repository with the token in the command, and run the playbook.
    - id: d
      text:
        en: |-
          Create a State Manager association that runs AWS-ApplyAnsiblePlaybooks with SourceType GitHub, InstallDependencies True, and a tokenInfo value that references a SecureString parameter.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS-ApplyAnsiblePlaybooks is the recommended document for associations that run Ansible playbooks, and it can download them from GitHub. With InstallDependencies set to True it installs Ansible and its dependencies on Ubuntu Server, and the tokenInfo value can reference a SecureString parameter with the {{ssm-secure:...}} syntax so the token is not stored in plaintext.
  options:
    a:
      en: |-
        AWS-RunAnsiblePlaybook is deprecated in favor of AWS-ApplyAnsiblePlaybooks, and the token would be stored in plaintext in the association parameters.
    b:
      en: |-
        With InstallDependencies set to False, Ansible is not installed on the nodes, and a String parameter does not encrypt the token.
    c:
      en: |-
        The token would appear in plaintext in the command, and a custom script replaces the managed document that AWS recommends.
references:
  - title: Creating associations that run Ansible playbooks - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state-manager-ansible.html
