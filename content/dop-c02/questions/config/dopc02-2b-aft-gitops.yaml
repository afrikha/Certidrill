id: dopc02-2b-aft-gitops
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's platform team manages all its infrastructure with Terraform Community Edition and stores the code in a Git repository through AWS CodeConnections. The company already has an AWS Control Tower landing zone. The team wants to request new accounts as code with a pull request and a git push, apply a set of customizations to every account, and apply extra customizations to some accounts. All accounts must be governed by Control Tower.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy Account Factory for Terraform (AFT) in a dedicated AFT management account, and manage the account request files and the customizations in its repositories.
    - id: b
      text:
        en: |-
          Use Account Factory Customization with an External product type blueprint that references the Terraform configuration, and create each account from the Control Tower console.
    - id: c
      text:
        en: |-
          Use the Terraform aws_organizations_account resource in the management account to create the accounts, and run the customizations from a CodeBuild project after each apply.
    - id: d
      text:
        en: |-
          Deploy Customizations for AWS Control Tower (CfCT), and translate the Terraform configurations into CloudFormation templates that its manifest references.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AFT sets up a Terraform pipeline that provisions and customizes accounts that Control Tower governs. Account requests are Terraform files submitted with a git push, and customizations can target all accounts, a set of accounts, or individual accounts. AFT runs in its own AFT management account and supports Terraform Community Edition and repositories connected through CodeConnections.
  options:
    b:
      en: |-
        AFC can run a Terraform blueprint, but accounts are created from the console, not requested as code through pull requests, and only one blueprint applies to an account.
    c:
      en: |-
        Accounts created directly through AWS Organizations are not enrolled in Control Tower, so they would not be governed by it.
    d:
      en: |-
        CfCT uses CloudFormation templates and SCPs, so the team would have to rewrite its Terraform code and would lose its Terraform workflow.
references:
  - title: Overview of AWS Control Tower Account Factory for Terraform (AFT) - AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/userguide/aft-overview.html
