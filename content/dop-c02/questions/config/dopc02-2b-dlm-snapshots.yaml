id: dopc02-2b-dlm-snapshots
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs EC2 instances whose EBS volumes are tagged Backup=daily. The operations team must create a snapshot of each tagged volume every day, keep the 14 most recent snapshots, and copy each snapshot to a second Region for disaster recovery. The solution must not add charges beyond snapshot storage, and the team does not want to maintain any code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon Data Lifecycle Manager snapshot policy that targets the Backup=daily tag, with a daily schedule, a retention count of 14, and a cross-Region copy rule.
    - id: b
      text:
        en: |-
          Create an EventBridge Scheduler schedule that invokes a Lambda function every day to create, copy, and delete the snapshots of the tagged volumes.
    - id: c
      text:
        en: |-
          Create a Systems Manager maintenance window that runs a shell script on each instance every day to create and copy snapshots with the AWS CLI.
    - id: d
      text:
        en: |-
          Create an EC2 Image Builder pipeline with a daily schedule that builds AMIs of the instances and distributes them to the second Region.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon Data Lifecycle Manager automates the creation, retention, and deletion of EBS snapshots, with policies that can copy backups to other Regions for disaster recovery. It is a managed feature with no additional cost, so only the snapshot storage is charged.
  options:
    b:
      en: |-
        This works only with custom code that the team would have to write and maintain.
    c:
      en: |-
        A script on each instance is custom code, and the instances need credentials and permissions to manage snapshots.
    d:
      en: |-
        Image Builder builds new images from a recipe; it does not back up the data on the existing volumes.
references:
  - title: Automate backups with Amazon Data Lifecycle Manager - Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-lifecycle.html
