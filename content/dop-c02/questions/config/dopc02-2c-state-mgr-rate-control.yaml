id: dopc02-2c-state-mgr-rate-control
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps the configuration of 600 web servers in the desired state with a State Manager association that runs an Ansible playbook every night. A faulty playbook change once made all the servers unavailable at the same time. The company now requires that at most 10 % of the servers apply the playbook at the same time. It also requires that the association stop sending the playbook to more servers after 5 servers have failed.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Split the servers into 10 tag groups, and create one association per group with schedules 1 hour apart.
    - id: b
      text:
        en: |-
          Set MaxConcurrency to 10% and MaxErrors to 4 on the association.
    - id: c
      text:
        en: |-
          Set MaxConcurrency to 60 and MaxErrors to 5% on the association.
    - id: d
      text:
        en: |-
          Run the playbook with Run Command every night from a maintenance window with a concurrency of 10%.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Association rate controls limit how many targets run at the same time (MaxConcurrency, as a number or a percentage) and when to stop sending requests (MaxErrors). With MaxErrors set to 4, the association stops sending requests when the fifth error is received, so no more servers receive the playbook after 5 failures.
  options:
    a:
      en: |-
        Ten groups limit concurrency by schedule only, and nothing stops the later groups when the earlier ones fail.
    c:
      en: |-
        MaxErrors of 5% of 600 targets allows 30 errors before stopping, far more than 5 failed servers.
    d:
      en: |-
        This sets no error threshold and replaces the association with a maintenance window task without improving anything.
references:
  - title: CreateAssociation - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_CreateAssociation.html
