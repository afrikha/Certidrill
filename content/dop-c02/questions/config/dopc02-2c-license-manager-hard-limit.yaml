id: dopc02-2c-license-manager-hard-limit
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has bought licenses for 96 vCPUs of a commercial database product under a bring-your-own-license agreement. Teams launch Amazon EC2 instances for the product from a shared AMI in several accounts. An audit found that the teams had exceeded the license count, and the company must now make sure that no launch can make usage exceed 96 vCPUs. The company wants a managed solution that does not depend on teams following a manual process.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Config rule that marks instances launched from the AMI as noncompliant when the total vCPU count exceeds 96, and notify the teams.
    - id: b
      text:
        en: |-
          Create a service quota request that lowers the On-Demand instance vCPU quota of each account so that the total across accounts stays under 96 vCPUs.
    - id: c
      text:
        en: |-
          Create a self-managed license in AWS License Manager that counts 96 vCPUs with the license limit enforced, associate it with the AMI, and share it with the accounts.
    - id: d
      text:
        en: |-
          Create a self-managed license in AWS License Manager that counts 96 vCPUs without enforcing the license limit, associate it with the AMI, and share it with the accounts.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A self-managed license in License Manager counts usage by vCPUs, cores, sockets, or instances. When the license limit is enforced (a hard limit), License Manager prevents a resource from deploying once the limit is reached, so no launch can exceed the 96 licensed vCPUs.
  options:
    a:
      en: |-
        An AWS Config rule detects the overuse after the instances are running; it does not block the launch.
    b:
      en: |-
        Service quotas apply to all EC2 usage of each account, not to the database product, and they would block unrelated workloads.
    d:
      en: |-
        Without enforcement, the limit is a soft limit: License Manager only notifies when it is exceeded and does not block the launch.
references:
  - title: Create a self-managed license in License Manager - AWS License Manager
    url: https://docs.aws.amazon.com/license-manager/latest/userguide/create-license-configuration.html
