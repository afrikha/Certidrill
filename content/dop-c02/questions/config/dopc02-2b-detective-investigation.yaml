id: dopc02-2b-detective-investigation
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon GuardDuty across its organization with a Security Tooling account as the delegated administrator. During a recent incident, analysts needed two weeks of custom queries to reconstruct what a compromised IAM role had done, from which IP addresses, and how its activity related to several GuardDuty findings. For future incidents, the security team wants interactive visualizations that link CloudTrail activity, VPC flow data, and GuardDuty findings across all accounts. The team does not want to build or operate a log analytics pipeline.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable Amazon Inspector in all accounts from the Security Tooling account, and review the findings for the affected roles and instances.
    - id: b
      text:
        en: |-
          Create Athena tables over the organization trail and VPC flow logs, and build Quick Sight dashboards in AWS Quick for each investigation.
    - id: c
      text:
        en: |-
          Designate the Security Tooling account as the Amazon Detective administrator for the organization, and enable the organization accounts as behavior graph members.
    - id: d
      text:
        en: |-
          Enable cross-Region aggregation in Security Hub CSPM, and create custom insights that group the GuardDuty findings by IAM role.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon Detective automatically extracts events from CloudTrail and VPC flow logs, ingests GuardDuty findings, and builds a behavior graph with interactive visualizations to find the root cause of findings. With AWS Organizations, the management account designates a Detective administrator account that enables the organization accounts as members of the behavior graph.
  options:
    a:
      en: |-
        Amazon Inspector scans workloads for software vulnerabilities and network exposure; it does not investigate API activity.
    b:
      en: |-
        Athena tables and dashboards are the custom analytics pipeline that the team wants to avoid.
    d:
      en: |-
        Insights group and count findings; they do not show the underlying CloudTrail and network activity behind them.
references:
  - title: What is Amazon Detective? - Amazon Detective
    url: https://docs.aws.amazon.com/detective/latest/userguide/what-is-detective.html
