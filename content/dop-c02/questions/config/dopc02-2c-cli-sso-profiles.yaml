id: dopc02-2c-cli-sso-profiles
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 40 AWS accounts in AWS Organizations, and its workforce signs in through IAM Identity Center. Platform engineers run AWS CLI version 2 scripts against several accounts, and today they use IAM user access keys stored in their local credentials files. The security team wants to remove all IAM user access keys. The engineers must use short-term credentials, must sign in through their browser, and want the CLI to renew expired credentials automatically while their Identity Center session is still valid.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run aws configure sso to create an sso-session section and a named profile for each account and role, and have the engineers run aws sso login before they run their scripts.
    - id: b
      text:
        en: |-
          Create named profiles that set sso_start_url and sso_region directly in each profile without an sso-session section, and have the engineers run aws sso login.
    - id: c
      text:
        en: |-
          Keep one IAM user access key per engineer, require MFA, and have the engineers call aws sts get-session-token at the start of each working day.
    - id: d
      text:
        en: |-
          Store the access keys of each engineer in AWS Secrets Manager with automatic rotation, and have the scripts read the current keys at startup.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      aws configure sso creates the recommended SSO token provider configuration: an sso-session section shared by named profiles that each select an account and a role. After aws sso login in the browser, the CLI retrieves temporary role credentials and renews them automatically until the Identity Center session expires.
  options:
    b:
      en: |-
        Setting the start URL and Region directly in each profile is the legacy, non-refreshable configuration, so the CLI cannot renew the token automatically.
    c:
      en: |-
        get-session-token still depends on a long-term IAM user access key, which the security team wants to remove.
    d:
      en: |-
        Rotated access keys are still long-term IAM user credentials, and the scripts would not sign in through the browser.
references:
  - title: Configuring IAM Identity Center authentication with the AWS CLI - AWS Command Line Interface
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sso.html
