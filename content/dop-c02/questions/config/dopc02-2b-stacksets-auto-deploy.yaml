id: dopc02-2b-stacksets-auto-deploy
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations with all features enabled, and trusted access for CloudFormation StackSets is activated. Every account in the Workloads OU must contain the same baseline: an IAM role for the incident response team, an SNS topic for operational alerts, and an S3 bucket for application logs. New accounts are added to the OU every week, and the baseline must be deployed to them without manual steps. When an account is moved out of the OU, its baseline resources must be removed.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create a self-managed StackSet in the management account, create the execution role in each account, and add new account IDs to the StackSet every week.
    - id: b
      text:
        en: |-
          Create a StackSet with service-managed permissions that targets the Workloads OU, enable automatic deployment, and set the account removal behavior to delete stacks.
    - id: c
      text:
        en: |-
          Create an EventBridge rule for the Organizations CreateAccount event that invokes a Lambda function to assume OrganizationAccountAccessRole and create the stack.
    - id: d
      text:
        en: |-
          Create a StackSet with service-managed permissions that targets the Workloads OU, enable automatic deployment, and set the account removal behavior to retain stacks.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With service-managed permissions and automatic deployment, StackSets deploys stack instances when accounts are added to the target OU and runs a delete operation when they are removed from it or moved to another OU. Choosing Delete stacks as the account removal behavior removes the baseline resources from accounts that leave the OU.
  options:
    a:
      en: |-
        Self-managed StackSets need execution roles created in each account and accounts added by hand, which is the manual work the company wants to avoid.
    c:
      en: |-
        This is custom code, it reacts to account creation instead of OU membership, and it does not remove the baseline when an account leaves the OU.
    d:
      en: |-
        With Retain stacks, the resources stay in an account that leaves the OU and are only removed from the StackSet, so the removal requirement fails.
references:
  - title: Enable or disable automatic deployments for StackSets in AWS Organizations - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-manage-auto-deployment.html
