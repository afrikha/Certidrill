id: dopc02-2c-inventory-data-sync-athena
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 30 accounts in AWS Organizations and runs managed nodes in us-east-1, eu-west-1, and ap-southeast-2. Systems Manager Inventory is already configured in every account and Region. An audit team in a central account in us-east-1 must run SQL queries across the installed software of all managed nodes. The data must stay up to date as new inventory is collected, and the team wants a managed export rather than custom scripts.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          In the central account, create one Organizations-based resource data sync in us-east-1, which collects inventory from every Region of every account into a central S3 bucket.
    - id: b
      text:
        en: |-
          Schedule an AWS Lambda function in each account and Region that calls the GetInventory API every night and writes the results to a central S3 bucket for Amazon Athena.
    - id: c
      text:
        en: |-
          Create an organization trail in AWS CloudTrail that delivers to a central S3 bucket, and query the installed software from the trail's log files with Amazon Athena.
    - id: d
      text:
        en: |-
          Create an Organizations-based resource data sync in each of the three Regions that sends inventory to one central S3 bucket, and query the bucket with Amazon Athena.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A resource data sync sends inventory to a central S3 bucket and keeps it updated as new data is collected, and an Organizations-based sync covers all member accounts. A sync must be created in each Region where inventory is collected, pointing to the same bucket, and the data can then be queried with Athena.
  options:
    a:
      en: |-
        A resource data sync covers only the Region where it is created, so the inventory of eu-west-1 and ap-southeast-2 would be missing.
    b:
      en: |-
        Nightly Lambda functions in 90 account-Region pairs are custom code to write and maintain, and the data would be up to a day old.
    c:
      en: |-
        CloudTrail records AWS API calls, not the software installed inside the operating systems, so the trail's log files do not contain the inventory.
references:
  - title: Creating a resource data sync for Inventory - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/inventory-create-resource-data-sync.html
