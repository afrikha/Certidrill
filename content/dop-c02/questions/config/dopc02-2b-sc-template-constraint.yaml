id: dopc02-2b-sc-template-constraint
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company offers an Amazon EC2 product through AWS Service Catalog. The product's CloudFormation template has an InstanceType parameter that accepts any instance type. The same product is in two portfolios in the same account: a development portfolio and a data science portfolio whose users need large GPU instances. Users of the development portfolio must be able to choose only t3.micro or t3.small. The company does not want to maintain a second copy of the template.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a template constraint to the product in the development portfolio with a rule that allows only t3.micro and t3.small for the InstanceType parameter.
    - id: b
      text:
        en: |-
          Set AllowedValues for the InstanceType parameter to t3.micro and t3.small in the template, and publish the template as a new version of the product.
    - id: c
      text:
        en: |-
          Attach an SCP to the account that denies ec2:RunInstances unless the ec2:InstanceType condition key is t3.micro or t3.small.
    - id: d
      text:
        en: |-
          Create a TagOption with the key InstanceType and the values t3.micro and t3.small, and associate it with the development portfolio.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A template constraint adds rules that narrow the values that end users can choose for the template's parameters. Template constraints are bound to one portfolio, so the rule applies to the development portfolio while the data science portfolio keeps the full list of instance types from the same template.
  options:
    b:
      en: |-
        AllowedValues in the template would apply to every portfolio that contains the product, so the data science users would lose the GPU instance types.
    c:
      en: |-
        The SCP would apply to every principal in the account, including the data science users who share the account, so they could no longer launch GPU instances.
    d:
      en: |-
        TagOptions are templates for AWS tags that Service Catalog applies to provisioned products. They do not restrict template parameter values.
references:
  - title: AWS Service Catalog Template Constraints - AWS Service Catalog
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/catalogs_constraints_template-constraints.html
