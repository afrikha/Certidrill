id: dopc02-2c-config-blocked-apps
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's software policy prohibits two remote-access applications on its Amazon EC2 instances. All instances are Systems Manager managed nodes, and Systems Manager Inventory collects application data from them. AWS Config records all resource types except the managed instance inventory resource type. The compliance team wants AWS Config to show continuously, in its compliance dashboard, which instances have either prohibited application installed. The team wants the LEAST development effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the ec2-managedinstance-applications-required managed rule with the two application names, so that instances with either application are reported as noncompliant.
    - id: b
      text:
        en: |-
          Turn on AWS Config recording of the managed instance inventory resource type, and deploy the ec2-managedinstance-applications-blacklisted managed rule with the two application names.
    - id: c
      text:
        en: |-
          Write an AWS Config custom Lambda rule that calls the ListInventoryEntries API for each instance every hour and reports the instances that have either application installed.
    - id: d
      text:
        en: |-
          Activate Amazon Inspector EC2 scanning, and create an AWS Config rule that marks instances as noncompliant when Amazon Inspector reports a finding for either application.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The ec2-managedinstance-applications-blacklisted managed rule checks that none of the listed applications are installed and evaluates the AWS::SSM::ManagedInstanceInventory resource type, which AWS Config records from Systems Manager Inventory data. Recording that resource type is therefore required, and the managed rule needs no code.
  options:
    a:
      en: |-
        The applications-required rule reports instances that lack the listed applications as noncompliant, so instances with prohibited software would appear as compliant.
    c:
      en: |-
        A custom Lambda rule works, but it is code to write and maintain when a managed rule already performs this check.
    d:
      en: |-
        Amazon Inspector reports software vulnerabilities, not applications prohibited by company policy, and no managed rule turns its findings into this check.
references:
  - title: ec2-managedinstance-applications-blacklisted - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/ec2-managedinstance-applications-blacklisted.html
  - title: Recording Software Configuration for Managed Instances with AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/recording-managed-instance-inventory.html
