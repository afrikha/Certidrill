id: dopc02-2c-ssm-private-endpoints
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company launches Amazon EC2 instances from a hardened Amazon Linux 2023 AMI that includes a current version of SSM Agent. The instances run in private subnets of a VPC that has no internet gateway and no NAT gateway, and the company will not add internet access. The instances have no IAM instance profile, and Default Host Management Configuration is not turned on. Administrators must run commands on the instances with Run Command and open shell sessions with Session Manager.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create interface VPC endpoints for the ssm, ssmmessages, and ec2messages services in the VPC, with a security group that allows HTTPS from the private subnets.
    - id: b
      text:
        en: |-
          Create a gateway VPC endpoint for Systems Manager, and add a route to the endpoint in the route tables of the private subnets.
    - id: c
      text:
        en: |-
          Attach an IAM instance profile whose role includes the AmazonSSMManagedInstanceCore managed policy to the instances.
    - id: d
      text:
        en: |-
          Add an inbound rule for port 22 from the VPC CIDR range to the security group of the instances so that Session Manager can reach them.
    - id: e
      text:
        en: |-
          Create a gateway VPC endpoint for Amazon S3 only, because SSM Agent retrieves Run Command and Session Manager requests from an Amazon S3 bucket.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Without internet access, SSM Agent reaches Systems Manager through interface VPC endpoints: ssm for the service, ssmmessages for Run Command and the Session Manager data channel, and ec2messages for older agent versions. The agent also needs permissions, which an instance profile with AmazonSSMManagedInstanceCore provides when Default Host Management Configuration is off.
  options:
    b:
      en: |-
        Systems Manager is reached through interface endpoints; gateway endpoints exist only for Amazon S3 and DynamoDB.
    d:
      en: |-
        SSM Agent opens outbound HTTPS connections to the service, so Session Manager needs no inbound rule on the instances.
    e:
      en: |-
        SSM Agent uses Amazon S3 for agent updates and optional files or output logs; it receives commands and session traffic through the ssm, ssmmessages, and ec2messages endpoints, and it would still have no permissions.
references:
  - title: Improve the security of EC2 instances by using VPC endpoints for Systems Manager - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/setup-create-vpc.html
  - title: AWS Systems Manager Session Manager - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html
