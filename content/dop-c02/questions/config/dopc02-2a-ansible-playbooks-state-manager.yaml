id: dopc02-2a-ansible-playbooks-state-manager
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company configures 300 Amazon EC2 instances that run Red Hat Enterprise Linux with Ansible playbooks. A cron job on a bastion host runs the playbooks over SSH every night. The security team wants to close inbound SSH on all instances and remove the bastion host. The playbooks are stored in a GitHub repository, and the instances are already Systems Manager managed nodes. The company wants to keep its playbooks and needs the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS OpsWorks Stacks custom layer for the instances, and configure the layer to run the playbooks during its configure lifecycle event every night.
    - id: b
      text:
        en: |-
          Install AWS CodeDeploy agents on the instances, and run the playbooks from an AfterInstall hook of a nightly deployment that a scheduled pipeline starts.
    - id: c
      text:
        en: |-
          Create a State Manager association with the AWS-ApplyAnsiblePlaybooks document that uses GitHub as the source, installs dependencies, and runs on a nightly cron schedule.
    - id: d
      text:
        en: |-
          Run the playbooks from an AWS CodeBuild project every night, and connect the project to the instances over SSH through a VPC configuration.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS-ApplyAnsiblePlaybooks runs Ansible playbooks from GitHub or Amazon S3 on managed nodes through a State Manager association, and with InstallDependencies set to True it installs Ansible and its dependencies on RHEL. SSM Agent runs the playbooks locally, so inbound SSH and the bastion host are no longer needed.
  options:
    a:
      en: |-
        OpsWorks Stacks has reached end of life and is disabled for new and existing customers.
    b:
      en: |-
        CodeDeploy deploys application revisions; using nightly deployments to run playbooks adds a pipeline, revisions, and agents for a task State Manager already does.
    d:
      en: |-
        A build project that connects over SSH still needs inbound SSH on the instances, which the security team wants to close.
references:
  - title: Creating associations that run Ansible playbooks - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state-manager-ansible.html
