id: dopc02-2a-iac-generator-existing
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a legacy application whose 120 resources were created manually in the AWS Management Console in one account and one AWS Region. The resources include Amazon S3 buckets, Amazon DynamoDB tables, AWS Lambda functions, and VPC endpoints. A DevOps engineer must bring all these resources under AWS CloudFormation management. The resources must not be re-created, and the application must not have downtime. The company also plans to convert the result into an AWS CDK app next year.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Run a resource scan with the CloudFormation IaC generator, generate a template from the scanned resources and their related resources, and import the resources into a new stack.
    - id: b
      text:
        en: |-
          Write a template by hand from the output of the AWS CLI describe and get commands for each resource, and create a new stack from the template.
    - id: c
      text:
        en: |-
          Export the configuration items of the resources with AWS Config advanced queries, and deploy them to the account as a CloudFormation StackSet.
    - id: d
      text:
        en: |-
          Create an empty stack, run drift detection on it so that CloudFormation adopts the resources it finds, and then add the drifted resources to the template.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The IaC generator scans the resources of the Region that CloudFormation does not manage, builds a template from selected resources and their related resources, and imports them into a stack without re-creating them. A single template can hold up to 500 resources, and the generated result can later be migrated into a CDK app with cdk migrate.
  options:
    b:
      en: |-
        Writing 120 resource definitions by hand is the most effort, and creating a new stack from the template would try to create new resources instead of importing the existing ones.
    c:
      en: |-
        AWS Config configuration items are not CloudFormation templates, and a StackSet creates new stacks and resources; it does not adopt existing resources.
    d:
      en: |-
        Drift detection only compares resources that a stack already manages with their template; it never adopts unmanaged resources.
references:
  - title: Generate templates from existing resources with IaC generator - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/generate-IaC.html
