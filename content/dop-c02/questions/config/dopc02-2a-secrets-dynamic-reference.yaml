id: dopc02-2a-secrets-dynamic-reference
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company creates an Amazon RDS for MySQL DB instance with an AWS CloudFormation template. The master user name and password are already stored in an existing AWS Secrets Manager secret that other applications also use. Security policy forbids the password from appearing in the template, in stack parameters, or in the pipeline configuration. The DevOps engineer needs the template to set the master credentials of the DB instance from that secret.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set MasterUsername and MasterUserPassword to {{resolve:secretsmanager:...}} dynamic references that point to the username and password keys of the existing secret.
    - id: b
      text:
        en: |-
          Add a template parameter with NoEcho set to true for the password, and pass the password from the pipeline configuration when the stack is created.
    - id: c
      text:
        en: |-
          Add a template parameter of the SecureString Systems Manager parameter type, and pass the name of a SecureString parameter that holds the password.
    - id: d
      text:
        en: |-
          Store the password in a Mappings section of the template, and encrypt the template file in the Amazon S3 bucket with an AWS KMS key.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A secretsmanager dynamic reference makes CloudFormation retrieve a key of a secret when it creates or updates the resource, so the password never appears in the template or in parameters. Without a version stage or ID, the reference resolves the AWSCURRENT version.
  options:
    b:
      en: |-
        NoEcho masks the value in outputs, but the password would still be stored in the pipeline configuration and passed as a parameter, which the policy forbids.
    c:
      en: |-
        CloudFormation does not support SecureString as a template parameter type; secure strings are used through dynamic references in resource properties.
    d:
      en: |-
        Mappings are plain text in the template, which the policy forbids regardless of how the template file is encrypted at rest.
references:
  - title: Get a secret or secret value from Secrets Manager - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-secretsmanager.html
  - title: Specify existing resources at runtime with CloudFormation-supplied parameter types - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cloudformation-supplied-parameter-types.html
