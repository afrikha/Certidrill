id: dopc02-2a-distributor-agent-package
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must install an in-house monitoring agent on 1,500 Linux and Windows Server managed nodes. The agent has a different installer for each operating system and a new version every month. New nodes, which receive the tag Monitoring=on at launch, must get the agent automatically. When the team publishes a new version, every node must move to it without taking the application offline. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the installers in an Amazon S3 bucket, and add commands to the user data of every launch template that download and install the latest installer.
    - id: b
      text:
        en: |-
          Publish the installers as an AWS AppConfig freeform configuration, and deploy each new version to the Monitoring=on nodes with a linear deployment strategy.
    - id: c
      text:
        en: |-
          Run a Run Command command with the AWS-RunShellScript and AWS-RunPowerShellScript documents each month against Monitoring=on to install the new version.
    - id: d
      text:
        en: |-
          Create a Systems Manager Distributor package, and create a State Manager association with AWS-ConfigureAWSPackage for Monitoring=on that uses in-place updates on a schedule.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A Distributor package holds an installer for each platform and publishes versions, and the AWS-ConfigureAWSPackage document installs the package. A State Manager association that targets the tag installs the package on new nodes automatically and keeps nodes on the current version on its schedule, and the In-place update installation type avoids taking the application offline.
  options:
    a:
      en: |-
        User data runs only at first boot, so existing nodes never receive new versions, and the scripts must handle both operating systems.
    b:
      en: |-
        AppConfig delivers configuration data to applications that read it; it does not install software on nodes.
    c:
      en: |-
        Monthly commands are a manual task that does not cover nodes launched between runs.
references:
  - title: AWS Systems Manager Distributor - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/distributor.html
  - title: Install or update Distributor packages - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/distributor-working-with-packages-deploy.html
