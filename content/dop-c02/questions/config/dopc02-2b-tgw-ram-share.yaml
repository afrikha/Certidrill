id: dopc02-2b-tgw-ram-share
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a Network account in its Infrastructure OU that owns an AWS Transit Gateway in us-east-1, with auto accept shared attachments turned on. VPCs in the 60 accounts of the Workloads OU, in the same Region, must connect to this transit gateway, and new accounts are added to that OU every month. The network team wants to keep ownership and routing of the transit gateway in the Network account. Resource sharing with AWS Organizations is enabled in AWS RAM.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create a transit gateway in each workload account, and create transit gateway peering attachments to the transit gateway in the Network account.
    - id: b
      text:
        en: |-
          Create VPC peering connections from each workload VPC to a hub VPC in the Network account, and route traffic between VPCs through the hub VPC.
    - id: c
      text:
        en: |-
          Share the transit gateway with the Workloads OU through AWS RAM in the Network account, so that each workload account can attach its VPCs to it.
    - id: d
      text:
        en: |-
          Create a role in the Network account that the workload pipelines assume to create transit gateway VPC attachments for the VPCs in their own accounts.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A transit gateway works across accounts: the owner shares it with AWS RAM, and the accounts it is shared with can attach their VPCs to it. Sharing with an OU covers the accounts that join it later, and with auto accept turned on the attachments do not need manual acceptance, while the Network account keeps the transit gateway and its route tables.
  options:
    a:
      en: |-
        Separate transit gateways in every account multiply resources and routing to manage, and ownership of routing would no longer be central.
    b:
      en: |-
        VPC peering is not transitive, so traffic cannot be routed between workload VPCs through a hub VPC, and each new account needs new peering connections.
    d:
      en: |-
        A VPC attachment is created by the VPC owner in the account where the VPC is, after the transit gateway is shared with it. A role in the Network account cannot attach VPCs that belong to other accounts.
references:
  - title: Transit gateways in AWS Transit Gateway - Amazon VPC
    url: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-transit-gateways.html
