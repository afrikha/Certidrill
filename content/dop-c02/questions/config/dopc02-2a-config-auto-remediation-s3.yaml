id: dopc02-2a-config-auto-remediation-s3
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company requires that no Amazon S3 bucket in its production account allow public access through bucket-level settings. Developers sometimes turn off Block Public Access on a bucket while testing and forget to turn it back on. The company wants every such change detected and reverted automatically within minutes, with a record of each evaluation and remediation for auditors. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the s3-bucket-level-public-access-prohibited AWS Config managed rule, and configure automatic remediation with an AWS managed Systems Manager Automation runbook that turns on Block Public Access.
    - id: b
      text:
        en: |-
          Create a Systems Manager State Manager association that runs every 30 minutes on the managed nodes and resets the Block Public Access settings of every bucket.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule that matches PutPublicAccessBlock calls, and invoke an AWS Lambda function that turns Block Public Access back on.
    - id: d
      text:
        en: |-
          Set an AWS AppConfig configuration that holds the required Block Public Access settings, and deploy it to the buckets with an AllAtOnce strategy.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The managed rule is evaluated on configuration changes and marks a bucket NON_COMPLIANT when its bucket-level settings are public. Automatic remediation runs a Systems Manager Automation document with the ID of the noncompliant bucket, with optional retries, and AWS Config keeps the evaluation and remediation records.
  options:
    b:
      en: |-
        An association runs documents on managed nodes; scripting bucket changes from instances is custom code, and the 30-minute schedule is slower than required.
    c:
      en: |-
        A Lambda function is custom code to maintain, and the solution keeps no compliance record for auditors.
    d:
      en: |-
        AppConfig delivers configuration data to applications; it cannot apply settings to S3 buckets.
references:
  - title: s3-bucket-level-public-access-prohibited - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-level-public-access-prohibited.html
  - title: Setting Up Auto Remediation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
