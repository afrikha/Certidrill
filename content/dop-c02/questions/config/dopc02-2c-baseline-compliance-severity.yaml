id: dopc02-2c-baseline-compliance-severity
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company patches its Amazon Linux managed nodes with a custom patch baseline. In Systems Manager Compliance, nodes that are missing approved patches appear as noncompliant with an UNSPECIFIED severity, so the security team cannot sort them by risk. The team wants every node that is missing an approved patch from this baseline to be reported with a HIGH severity. The team does not want to change which patches are approved.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the auto-approval delay of the approval rules in the custom patch baseline to 0 days so that the missing patches are reported sooner.
    - id: b
      text:
        en: |-
          Set the compliance reporting level of the approved patches in the custom patch baseline to High.
    - id: c
      text:
        en: |-
          Set the ComplianceSeverity of the State Manager association that runs the patch scan to HIGH.
    - id: d
      text:
        en: |-
          Add the missing patches to the approved patches list of the custom patch baseline with the HIGH classification.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A custom patch baseline lets you set a compliance severity level, such as Critical or High, for approved patches. If any approved patch is reported as Missing, the overall compliance severity reported for the node is the level that you set, and the approval rules stay unchanged.
  options:
    a:
      en: |-
        The auto-approval delay changes which patches are approved and when, which the team does not want, and it does not set a severity.
    c:
      en: |-
        The association severity applies to association compliance, not to the patch compliance that the baseline reports.
    d:
      en: |-
        The approved patches list has no severity setting, and adding patches to it changes which patches are approved.
references:
  - title: Predefined and custom patch baselines - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-predefined-and-custom-patch-baselines.html
