id: dopc02-2b-org-conformance-pack
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's Audit account is the delegated administrator for AWS Config in its organization, and Config recording is enabled in every account in us-east-1 and eu-west-1. The security team has written a conformance pack template that contains Config rules for encryption and logging and remediation actions that use Systems Manager Automation runbooks. The conformance pack must be deployed to all current and future member accounts in both Regions and managed from the Audit account.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Config aggregator in the Audit account with the organization as its source, and add the conformance pack to the aggregator in each Region.
    - id: b
      text:
        en: |-
          Create a self-managed StackSet in the Audit account with an AWS::Config::ConformancePack resource, and add each new account ID to it.
    - id: c
      text:
        en: |-
          From the Audit account, deploy the template as an organization conformance pack with PutOrganizationConformancePack in us-east-1 and in eu-west-1.
    - id: d
      text:
        en: |-
          Enable a Security Hub CSPM standard in the Audit account, which deploys the rules and remediation actions of the template to the member accounts.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A conformance pack packages Config rules and remediation actions as one entity, and the management account or a Config delegated administrator can deploy it across the organization with PutOrganizationConformancePack. The call is Regional, so it runs once per Region, and accounts that join the organization later receive the conformance pack automatically.
  options:
    a:
      en: |-
        An aggregator is a read-only view of configuration and compliance data; it cannot deploy rules or conformance packs to source accounts.
    b:
      en: |-
        A self-managed StackSet does not reach new accounts automatically, so every new account would have to be added by hand.
    d:
      en: |-
        Security Hub CSPM standards contain AWS-defined controls; they do not deploy the company's own conformance pack template.
references:
  - title: Managing Conformance Packs for AWS Config Across all Accounts in Your Organization - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformance-pack-organization-apis.html
  - title: Conformance Packs for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformance-packs.html
