id: dopc02-2b-account-factory-basic
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has an AWS Control Tower landing zone, and auto-enrollment is not turned on in the landing zone settings. An operations engineer must create a new account for a project team in the registered Workloads OU. The account must be governed by Control Tower and receive the controls of the Workloads OU as soon as it is created.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Create the account with Account Factory in the Control Tower console, and select the Workloads OU for it.
    - id: b
      text:
        en: |-
          Create the account in the AWS Organizations console, and then move it into the Workloads OU.
    - id: c
      text:
        en: |-
          Create the account with an AWS::Organizations::Account resource in a CloudFormation stack in the management account.
    - id: d
      text:
        en: |-
          Sign up for a new standalone account, invite it to the organization, and then enroll it in Control Tower.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Account Factory creates the account and enrolls it in Control Tower in one operation, in the registered OU that the engineer selects. The account receives the baselines and controls of that OU immediately.
  options:
    b:
      en: |-
        An account created in AWS Organizations is not enrolled in Control Tower. Without auto-enrollment, moving it into the OU still requires a separate enrollment.
    c:
      en: |-
        The CloudFormation resource creates the account through AWS Organizations, so the account is not enrolled in Control Tower.
    d:
      en: |-
        This works but needs a separate sign-up, an invitation, and an enrollment, which is more effort than Account Factory.
references:
  - title: Optionally configure auto-enrollment for accounts - AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/userguide/configure-auto-enroll.html
  - title: About enrolling existing accounts - AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/userguide/enroll-account.html
