id: dopc02-2b-cfn-guard-hook
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has written AWS CloudFormation Guard rules that require encryption for EBS volumes, RDS DB instances, and S3 buckets. The rules run with cfn-guard validate in a CodeBuild stage of every deployment pipeline. An audit found unencrypted resources that engineers created by deploying stacks from their workstations with the AWS CLI. Engineers must still be allowed to deploy stacks from their workstations for experiments. Every CloudFormation stack operation in the account must be checked against the same Guard rules, and noncompliant resources must not be provisioned.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP that denies cloudformation:CreateStack and cloudformation:UpdateStack unless the request comes from the CodeBuild service roles of the pipelines.
    - id: b
      text:
        en: |-
          Deploy AWS Config rules for EBS, RDS, and S3 encryption with automatic remediation that encrypts noncompliant resources after they are created.
    - id: c
      text:
        en: |-
          Activate a Guard Hook in the account that evaluates the existing Guard rules from Amazon S3 against resource operations and is configured to fail noncompliant operations.
    - id: d
      text:
        en: |-
          Apply a stack policy to every stack that denies updates to resources that do not have encryption enabled.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CloudFormation Hooks inspect resource configurations server-side before they are provisioned, whatever tool started the stack operation. A Guard Hook reuses Guard rules as its evaluation logic, and in fail mode CloudFormation stops the operation so noncompliant resources are not created. The cfn-guard CLI alone gives no server-side enforcement.
  options:
    a:
      en: |-
        The SCP would block engineers from deploying stacks from their workstations, which the company must still allow.
    b:
      en: |-
        AWS Config evaluates resources after they exist, so unencrypted resources would still be provisioned first, and some resources, such as RDS DB instances, cannot simply be encrypted in place.
    d:
      en: |-
        A stack policy protects existing stack resources from unintended updates. It does not evaluate new resources against compliance rules.
references:
  - title: What are CloudFormation Hooks? - CloudFormation
    url: https://docs.aws.amazon.com/cloudformation-cli/latest/hooks-userguide/what-is-cloudformation-hooks.html
  - title: What is AWS CloudFormation Guard? - AWS CloudFormation Guard
    url: https://docs.aws.amazon.com/cfn-guard/latest/ug/what-is-guard.html
