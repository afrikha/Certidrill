id: dopc02-2c-sdk-retry-adaptive
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a nightly inventory job as a single Python process that uses the AWS SDK for Python (Boto3) to call one AWS API action thousands of times. The job is not time-sensitive, but it often fails partway through with ThrottlingException errors after the SDK's default number of attempts. The job uses one client object for all its calls. A DevOps engineer must make the job reduce its own request rate when it is throttled and retry more times before it fails. The engineer must not change the application code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the retry_mode setting to legacy in the shared AWS config file of the job's runtime environment, so that the SDK uses its service-specific retry rules.
    - id: b
      text:
        en: |-
          Set the AWS_RETRY_MODE environment variable to adaptive and the AWS_MAX_ATTEMPTS environment variable to a higher value in the job's runtime environment.
    - id: c
      text:
        en: |-
          Set the AWS_MAX_ATTEMPTS environment variable to 1 so that throttled calls fail fast, and schedule the job to rerun every hour until it completes.
    - id: d
      text:
        en: |-
          Split the job into several parallel processes that each call the API action for a subset of the resources, so that the job finishes before throttling starts.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Adaptive retry mode includes the exponential backoff with jitter of standard mode and adds a client-side rate limiter that slows the request rate after throttling responses, which suits a single-resource, throttling-heavy, latency-tolerant job. The retry mode and the maximum number of attempts can be set through environment variables or the shared config file, so no code change is needed.
  options:
    a:
      en: |-
        Legacy mode exists only for backward compatibility; it has no client-side rate limiter and does not reduce the request rate after throttling.
    c:
      en: |-
        A max_attempts value of 1 disables retries, so every throttled call fails immediately; rerunning the whole job does not slow its request rate.
    d:
      en: |-
        Parallel processes increase the request rate against the same API action, which makes throttling worse, and splitting the job changes how it is written and run.
references:
  - title: Retry behavior - AWS SDKs and Tools
    url: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html
