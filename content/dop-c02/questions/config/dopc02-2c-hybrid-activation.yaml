id: dopc02-2c-hybrid-activation
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants to patch 200 on-premises Linux servers with Patch Manager in the same way as its Amazon EC2 instances. The servers can reach the Systems Manager endpoints over a Site-to-Site VPN, and SSM Agent is not installed on them yet. The company wants each server to appear as a managed node so that its patch compliance is reported with the rest of the fleet.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Turn on Default Host Management Configuration in the Region so that the servers receive Systems Manager permissions automatically.
    - id: b
      text:
        en: |-
          Create an IAM instance profile with the AmazonSSMManagedInstanceCore policy, and associate it with each server by its host name.
    - id: c
      text:
        en: |-
          Create a hybrid activation with a registration limit of 200 and an IAM service role that trusts the ssm.amazonaws.com service principal.
    - id: d
      text:
        en: |-
          Install SSM Agent on each server, and register the server with the activation code, the activation ID, and the Region of the activation.
    - id: e
      text:
        en: |-
          Install the unified CloudWatch agent on each server, and configure it to send the list of installed packages to Systems Manager.
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |-
      Non-EC2 machines become managed nodes through a hybrid activation, which provides an activation code and ID and names the IAM service role that the nodes use. SSM Agent is then installed on each server and registered with the code, ID, and Region, and the servers appear with mi- node IDs that Patch Manager can patch and report on.
  options:
    a:
      en: |-
        Default Host Management Configuration gives permissions to Amazon EC2 instances only; it does not register on-premises servers.
    b:
      en: |-
        Instance profiles can be attached only to EC2 instances, not to on-premises servers.
    e:
      en: |-
        The CloudWatch agent collects metrics and logs; it does not register servers with Systems Manager or report patch compliance.
references:
  - title: Create a hybrid activation to register nodes with Systems Manager - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/hybrid-activation-managed-nodes.html
  - title: Install SSM Agent on hybrid Linux nodes - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/hybrid-multicloud-ssm-agent-install-linux.html
