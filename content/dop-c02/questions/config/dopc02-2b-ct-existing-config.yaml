id: dopc02-2b-ct-existing-config
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants to bring 12 existing accounts under AWS Control Tower governance. The accounts are in an unregistered OU. Each account already has an AWS Config configuration recorder and delivery channel in every governed Region, and these resources feed a third-party compliance tool. The compliance team will not accept stopping or deleting the Config recorders during the migration.

    Which approach will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Open an AWS Support case to add the accounts to the allow list, adapt the existing Config resources as Control Tower documents, and then register the OU.
    - id: b
      text:
        en: |-
          Use the Enroll account workflow for each account in the Control Tower console, which adopts the existing Config recorders and delivery channels.
    - id: c
      text:
        en: |-
          Delete the existing recorders and delivery channels in each account, register the OU, and reconnect the third-party tool to the new Config resources.
    - id: d
      text:
        en: |-
          Move the accounts into a registered OU, and deploy an organization conformance pack that re-creates the Config recorders in each account.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Accounts that have existing AWS Config resources can be enrolled only after AWS Support adds them to an allow list. The existing recorders and delivery channels are then updated as documented (a dedicated IAM role, the Control Tower Config bucket and Audit SNS topic), and the accounts are enrolled with Register OU or Re-register OU. Control Tower does not create Config resources in these accounts.
  options:
    b:
      en: |-
        The Enroll account workflow fails for accounts with existing Config resources; only Register OU or Re-register OU works after the allow-list step.
    c:
      en: |-
        Deleting the recorders stops Config recording, which the compliance team does not accept.
    d:
      en: |-
        Conformance packs deploy Config rules and remediations; they do not create configuration recorders, and the accounts would still need the allow-list process.
references:
  - title: Enroll accounts that have existing AWS Config resources - AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/userguide/existing-config-resources.html
