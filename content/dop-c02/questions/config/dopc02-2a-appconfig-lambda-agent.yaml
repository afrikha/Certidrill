id: dopc02-2a-appconfig-lambda-agent
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company has AWS Lambda functions that handle several thousand invocations each second. Each invocation calls the AWS AppConfig StartConfigurationSession and GetLatestConfiguration API operations to read the current feature flags. The AppConfig charges and the function duration have grown with traffic. The company still wants flag changes to reach the functions within about one minute and to keep using AppConfig deployment strategies. The developers want the smallest change to the function code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Copy the flags into Lambda environment variables from the deployment pipeline, and update the function configuration each time a flag changes.
    - id: b
      text:
        en: |-
          Cache the flags in an Amazon ElastiCache cluster, and add code to each function that reads the cache and refreshes it from AppConfig every minute.
    - id: c
      text:
        en: |-
          Add the AWS AppConfig Agent Lambda extension as a layer, set its poll interval to 60 seconds, and read the flags from the local HTTP endpoint.
    - id: d
      text:
        en: |-
          Call StartConfigurationSession only during the init phase, and call GetLatestConfiguration on every invocation with the token from that session.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The AppConfig Agent Lambda extension calls AppConfig on behalf of the function, keeps the configuration in a local cache, and checks for new data in the background when the poll interval has elapsed. The function reads the flags from localhost:2772, so code changes are minimal and API calls, cost, and duration drop.
  options:
    a:
      en: |-
        Environment variables bypass AppConfig deployment strategies and validation, and each change requires a function configuration update.
    b:
      en: |-
        An ElastiCache cluster and refresh code add infrastructure and custom logic that the managed extension already provides.
    d:
      en: |-
        GetLatestConfiguration would still be called on every invocation, so the call volume and charges would remain high.
references:
  - title: Understanding how the AWS AppConfig Agent Lambda extension works - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-integration-lambda-extensions-how-it-works.html
  - title: Using AWS AppConfig Agent with AWS Lambda - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-integration-lambda-extensions.html
