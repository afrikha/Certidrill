id: dopc02-2b-third-party-external-id
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a third-party SaaS monitoring provider that needs read-only access to 40 accounts of the company's organization. The provider serves many customers from its own AWS account and assigns a unique identifier to each customer. The security team must prevent the confused deputy problem and does not allow long-term credentials. The access must be deployed consistently to all current and future accounts in the organization.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM user with the ReadOnlyAccess policy in each account, and give the provider the access keys of each user through a secure channel.
    - id: b
      text:
        en: |-
          Deploy a role with a service-managed StackSet whose trust policy allows the provider's account and requires aws:PrincipalOrgID to equal the company's organization ID.
    - id: c
      text:
        en: |-
          Deploy a role with a service-managed StackSet whose trust policy allows the provider's account and requires sts:ExternalId to equal the identifier that the provider assigned.
    - id: d
      text:
        en: |-
          Deploy a role with a service-managed StackSet whose trust policy allows the provider's account without conditions, and limit the role's permissions with an SCP.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A third party should access customer accounts by assuming a role whose trust policy names its account and requires an external ID that the third party generated for that customer. The external ID prevents the provider from being tricked into using one customer's role on behalf of another. A service-managed StackSet with automatic deployment creates the role in every current and future account.
  options:
    a:
      en: |-
        IAM user access keys are long-term credentials, which the security team does not allow.
    b:
      en: |-
        The provider's principals are not in the company's organization, so this condition would block them, and it does not address the confused deputy problem.
    d:
      en: |-
        Without the external ID condition, the role is exposed to the confused deputy problem.
references:
  - title: Access to AWS accounts owned by third parties - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_third-party.html
