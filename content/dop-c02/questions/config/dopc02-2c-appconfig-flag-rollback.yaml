id: dopc02-2c-appconfig-flag-rollback
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a checkout application on Amazon ECS. The application reads its feature flags from a JSON file that is built into the container image, so every flag change requires a new image and a new deployment. The company wants to change flags without redeploying the application, roll each change out gradually to the running tasks over 30 minutes, and roll the change back automatically if an existing Amazon CloudWatch alarm on checkout errors goes into the ALARM state during the rollout.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the flags in AWS AppConfig, have the tasks read them through the AppConfig Agent, and deploy changes with a linear strategy to an environment that monitors the alarm.
    - id: b
      text:
        en: |-
          Store the flags in a Systems Manager Parameter Store parameter, and create a State Manager association that writes the parameter to each task's JSON file every 30 minutes.
    - id: c
      text:
        en: |-
          Keep the flags in the container image, and deploy each change with an AWS CodeDeploy blue/green deployment that shifts traffic linearly over 30 minutes with alarm-based rollback.
    - id: d
      text:
        en: |-
          Store the flags in AWS Secrets Manager, and configure a rotation schedule of 30 minutes so that the tasks receive the new values gradually.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AppConfig deploys configuration data, including feature flags, to running applications that retrieve it with the AppConfig Agent or the data plane API, so no redeployment is needed. A deployment strategy rolls the change out gradually, and if a CloudWatch alarm attached to the environment goes into ALARM during the deployment, AppConfig rolls back to the previous version automatically.
  options:
    b:
      en: |-
        State Manager targets managed nodes, not containers in ECS tasks, and the association gives no gradual rollout or alarm-based rollback.
    c:
      en: |-
        A blue/green deployment still builds and deploys a new image for every flag change, which the company wants to avoid.
    d:
      en: |-
        Secrets Manager rotation is for credentials; it does not roll out values gradually or roll back on an alarm.
references:
  - title: Monitoring deployments for automatic rollback - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/monitoring-deployments.html
  - title: Working with deployment strategies - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-deployment-strategy.html
