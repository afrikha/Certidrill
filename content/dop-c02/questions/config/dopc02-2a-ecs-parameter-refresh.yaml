id: dopc02-2a-ecs-parameter-refresh
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon ECS service on AWS Fargate behind an Application Load Balancer. The container definition reads a database endpoint and a feature setting from AWS Systems Manager Parameter Store through the secrets section with valueFrom. An operator updated both parameters during a database migration, but the running tasks still use the old values an hour later. The application code reads the values only from environment variables and must not be changed. The service must stay available while the new values are applied.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add ssm:GetParameters on both parameters to the task role, and wait for the ECS agent to refresh the environment variables of the running containers.
    - id: b
      text:
        en: |-
          Convert both parameters to the advanced tier and attach an Expiration parameter policy so that ECS reads them again when they expire.
    - id: c
      text:
        en: |-
          Run aws ecs execute-command in each task to export the new values as environment variables in the running container processes.
    - id: d
      text:
        en: |-
          Update the service with the force new deployment option so that ECS starts new tasks, which receive the current values, and drains the old tasks.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      ECS injects Parameter Store values into environment variables only when a container starts, so running containers never receive later changes. A force new deployment starts new tasks that read the current values and replaces the old tasks under the service's rolling deployment settings, which keeps the service available.
  options:
    a:
      en: |-
        Parameter values are retrieved with the task execution role at container start; no permission change makes ECS refresh the variables of running containers.
    b:
      en: |-
        Parameter policies only delete a parameter at expiration or send notifications; they never make ECS re-inject values into running containers.
    c:
      en: |-
        Exporting variables in an interactive session changes only that shell, not the environment of the running application process, and it is a manual change to each task.
references:
  - title: Pass Systems Manager parameters through Amazon ECS environment variables - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/secrets-envvar-ssm-paramstore.html
