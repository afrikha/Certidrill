id: dopc02-2a-template-static-checks
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company stores its AWS CloudFormation templates in a Git repository and validates every pull request in an AWS CodeBuild project. Templates that use invalid property values for a resource type have reached the deployment stage and failed there. The security team also requires that every template define encryption and versioning for each Amazon S3 bucket. Both checks must run on the template files in the pull request, before any resource is created or changed in an AWS account. The security rules must be written as policy as code that the security team maintains.

    Which combination of tools should the DevOps engineer run in the CodeBuild project? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run cfn-lint to check the templates against the CloudFormation resource specification, including property names, types, and values.
    - id: b
      text:
        en: |-
          Create a change set for each template in a sandbox account, and fail the build if the change set shows that an S3 bucket will be replaced.
    - id: c
      text:
        en: |-
          Deploy the AWS Config managed rules for S3 bucket encryption and versioning, and fail the build when a bucket is reported as noncompliant.
    - id: d
      text:
        en: |-
          Run AWS CloudFormation Guard with a rule file from the security team that requires encryption and versioning on every S3 bucket resource.
    - id: e
      text:
        en: |-
          Run drift detection on the stacks that the templates update, and fail the build if any S3 bucket shows a MODIFIED drift status.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      cfn-lint validates templates against the resource specification, which catches invalid property values before deployment. CloudFormation Guard evaluates JSON or YAML templates against rules written in its policy-as-code language, so the security team can maintain the encryption and versioning rules; Guard itself does not check syntax or allowed property values, which is why both tools are needed.
  options:
    b:
      en: |-
        A change set previews resource changes in an account; it does not validate property values against the specification or enforce encryption and versioning rules.
    c:
      en: |-
        AWS Config rules evaluate resources that already exist in an account, so they act only after the buckets are deployed.
    e:
      en: |-
        Drift detection compares deployed resources with their stack template; it checks nothing in the pull request and enforces no security rule.
references:
  - title: What is AWS CloudFormation Guard? - AWS CloudFormation Guard
    url: https://docs.aws.amazon.com/cfn-guard/latest/ug/what-is-guard.html
