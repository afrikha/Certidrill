id: dopc02-2a-ssm-ami-parameter-type
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys the same AWS CloudFormation template for a batch fleet in six AWS Regions. The template has a Mappings section with the ID of the latest Amazon Linux AMI for each Region, and an engineer updates the mapping by hand every month. Some Regions have run outdated AMIs because the mapping was not updated. The company wants each stack creation or update to use the latest Amazon Linux AMI of its Region. The solution must not need any code or any mapping maintenance.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Schedule an AWS Lambda function each month that calls DescribeImages in every Region and commits the new AMI IDs to the Mappings section of the template.
    - id: b
      text:
        en: |-
          Declare a parameter of type AWS::SSM::Parameter::Value<AWS::EC2::Image::Id> whose default is the public Systems Manager parameter for the latest Amazon Linux AMI.
    - id: c
      text:
        en: |-
          Add a Lambda-backed custom resource that looks up the latest Amazon Linux AMI in the stack's Region, and reference its returned attribute as the ImageId.
    - id: d
      text:
        en: |-
          Build an AMI with an EC2 Image Builder pipeline in each Region, and pass the AMI ID of the Region as a parameter value at each stack deployment.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With a Systems Manager parameter type, the parameter value is the name of a Parameter Store key, and CloudFormation reads the stored value when a stack is created or updated or a change set is created. The public parameters under /aws/service/ami-amazon-linux-latest/ hold the latest AMI ID of each Region, so no code or mapping is needed.
  options:
    a:
      en: |-
        A scheduled function is code to maintain, and the mapping can still be out of date between runs.
    c:
      en: |-
        A custom resource is code that the company must write and maintain, which the requirements exclude.
    d:
      en: |-
        Building custom AMIs adds pipelines in six Regions, and passing AMI IDs by hand is the manual maintenance the company wants to remove.
references:
  - title: Specify existing resources at runtime with CloudFormation-supplied parameter types - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cloudformation-supplied-parameter-types.html
