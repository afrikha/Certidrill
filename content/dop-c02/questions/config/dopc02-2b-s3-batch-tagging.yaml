id: dopc02-2b-s3-batch-tagging
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company stores 900 million existing objects in an S3 bucket. A new data classification policy requires that the tag set of every existing object be replaced with three new tags. A daily S3 Inventory report in CSV format is already configured for the bucket. The company wants a managed solution that tracks progress and produces a report of the result for each object, with the LEAST custom code.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure an S3 Event Notification for object creation events that invokes a Lambda function to tag each object.
    - id: b
      text:
        en: |-
          Use the manifest of the latest S3 Inventory report as the manifest of an S3 Batch Operations job.
    - id: c
      text:
        en: |-
          Add an S3 Lifecycle rule to the bucket that applies the three new tags to all current objects.
    - id: d
      text:
        en: |-
          Configure S3 Replication from the bucket to itself with a rule that replaces the tags of the replicated objects.
    - id: e
      text:
        en: |-
          Configure the S3 Batch Operations job to replace all object tags with the three new tags, and request a completion report.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      S3 Batch Operations performs one operation, such as replacing object tags, on lists of up to billions of objects, tracks progress, and can write a completion report that describes the result of each task. An S3 Inventory report in CSV format can be used directly as the job's manifest.
  options:
    a:
      en: |-
        Event notifications fire only for new events, so the 900 million existing objects would never be tagged.
    c:
      en: |-
        Lifecycle rules transition or expire objects; they cannot add or replace tags.
    d:
      en: |-
        Replication copies objects to a destination bucket; it does not rewrite the tag sets of objects in place.
references:
  - title: Performing object operations in bulk with Batch Operations - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/batch-ops.html
