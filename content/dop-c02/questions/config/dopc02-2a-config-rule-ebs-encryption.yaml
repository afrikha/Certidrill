id: dopc02-2a-config-rule-ebs-encryption
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company must prove to auditors that every Amazon EBS volume attached to its EC2 instances is encrypted. The auditors want a continuous evaluation of the volumes as they are created or changed, a list of the noncompliant volumes, and the history of compliance over time. The company does not want to write custom code.

    Which AWS service should the company use?
body:
  options:
    - id: a
      text:
        en: |-
          AWS AppConfig, with a configuration profile that lists the required encryption setting of each volume and a validator.
    - id: b
      text:
        en: |-
          AWS Config, with the managed rule that checks whether attached EBS volumes are encrypted.
    - id: c
      text:
        en: |-
          AWS Systems Manager State Manager, with an association that checks the encryption of the volumes on each instance.
    - id: d
      text:
        en: |-
          AWS CloudFormation drift detection, run on every stack that creates EC2 instances and EBS volumes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Config rules evaluate resource configurations continuously as resources are created, changed, or deleted, flag noncompliant resources, and keep the compliance history. AWS provides managed rules, including one for the encryption of attached EBS volumes, so no code is needed.
  options:
    a:
      en: |-
        AppConfig deploys configuration data to applications; it does not evaluate the configuration of AWS resources.
    c:
      en: |-
        State Manager keeps the software and settings of managed nodes in a desired state; it is not designed to evaluate AWS resource properties such as volume encryption, and doing so would need custom scripts.
    d:
      en: |-
        Drift detection only covers resources managed by stacks and compares them with their templates; it does not evaluate an encryption requirement.
references:
  - title: What Is AWS Config? - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html
