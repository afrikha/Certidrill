id: dopc02-2b-delegated-admin-security
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has administered Amazon GuardDuty, AWS Security Hub CSPM, and AWS Config organization rules from its AWS Organizations management account. As a result, the security engineers have broad IAM roles in the management account. A new internal policy requires that the management account be used only for tasks that must be performed there. The security engineers must work from a dedicated Security Tooling account and keep organization-wide administration of these three services.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          From the management account, register the Security Tooling account as the delegated administrator for GuardDuty, Security Hub CSPM, and AWS Config, and remove the engineers' roles from the management account.
    - id: b
      text:
        en: |-
          Move the management account into the Security OU, and attach an SCP to that OU that allows the engineers only GuardDuty, Security Hub CSPM, and AWS Config actions.
    - id: c
      text:
        en: |-
          Create a role in the management account that trusts the Security Tooling account, and have the engineers assume it to administer the three services.
    - id: d
      text:
        en: |-
          Send GuardDuty and Security Hub CSPM invitations from the Security Tooling account to each member account, and keep the AWS Config organization rules in the management account.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Services that integrate with AWS Organizations let the management account register a member account as their delegated administrator, which receives the administrative permissions for that service across the organization. AWS recommends using the management account only for tasks that require it, so delegating the security services to a Security Tooling account lets the engineers' roles in the management account be removed.
  options:
    b:
      en: |-
        SCPs do not restrict users or roles in the management account, wherever it sits, so this does not limit the engineers' access.
    c:
      en: |-
        The engineers would still act in the management account through the assumed role, which the policy forbids.
    d:
      en: |-
        Invitation-based administration must be repeated for every new account, and AWS Config rules would still be administered from the management account.
references:
  - title: Delegated administrator for AWS services that work with Organizations - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_integrate_delegated_admin.html
  - title: Best practices for the management account - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_best-practices_mgmt-acct.html
