id: dopc02-2c-image-builder-asg-ami
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a web tier in Auto Scaling groups in three AWS accounts. Each group launches instances from the default version of a launch template in its own account. Instances are replaced often by scaling events, and instances launched from the current AMI miss the patches that were released since the AMI was built. The company requires every new instance to be fully patched before it passes health checks, without longer boot times. The AMI must be rebuilt monthly with the latest patches and must be used by the three groups without manual steps or custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a State Manager association in each account that runs AWS-RunPatchBaseline with Install on every new instance as soon as it becomes a managed node.
    - id: b
      text:
        en: |-
          Create a Patch Manager maintenance window in each account that patches the instances of the Auto Scaling groups every night, and keep the current AMI.
    - id: c
      text:
        en: |-
          Create a monthly EC2 Image Builder pipeline whose distribution settings share the AMI with the three accounts and create a new default version of each launch template.
    - id: d
      text:
        en: |-
          Write an AWS Lambda function that runs monthly, launches an instance, patches it, creates an AMI, and calls CreateLaunchTemplateVersion in each account.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Image Builder pipelines can run on a schedule and build a patched AMI. Their distribution settings can create a new launch template version with the new AMI ID, in the same account or in other accounts, and make it the default version, so the Auto Scaling groups launch patched instances with no extra boot-time work.
  options:
    a:
      en: |-
        Patching at boot lengthens the time before an instance is ready, and an instance can pass health checks before the patching has finished.
    b:
      en: |-
        Nightly patching leaves new instances unpatched until the next window, and the source AMI stays out of date.
    d:
      en: |-
        A custom Lambda pipeline would work, but it is the custom code that the company wants to avoid when Image Builder provides the same steps as a managed service.
references:
  - title: Configure AMI distribution with an EC2 launch template - EC2 Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/dist-using-launch-template.html
