id: dopc02-2a-stacksets-delegated-admin
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations with all features enabled, and trusted access for StackSets is already activated. The platform team works from a dedicated infrastructure tooling member account. The security team does not allow the platform team to sign in to or assume any role in the management account. The platform team must create and update stack sets that deploy to all accounts in several OUs, including accounts added to these OUs later.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create stack sets with self-managed permissions in the tooling account, and create AWSCloudFormationStackSetExecutionRole in every target account.
    - id: b
      text:
        en: |-
          From the management account, register the tooling account as a delegated administrator for StackSets, and create service-managed stack sets from the tooling account.
    - id: c
      text:
        en: |-
          Create an IAM role in the management account that the tooling account can assume, and create service-managed stack sets through that role.
    - id: d
      text:
        en: |-
          Create the stack sets in the management account, and share them with the tooling account through AWS Resource Access Manager so that the platform team can update them.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An administrator of the management account can register a member account as a delegated administrator for StackSets. That account can then create and manage service-managed stack sets that target OUs, including automatic deployment to accounts added later, without anyone signing in to the management account.
  options:
    a:
      en: |-
        Self-managed stack sets need roles created in every account and do not deploy automatically to accounts added to the OUs.
    c:
      en: |-
        Assuming a role in the management account is exactly what the security team forbids.
    d:
      en: |-
        Stack sets cannot be shared through AWS RAM; delegated administration is the mechanism for managing them from a member account.
references:
  - title: Register a delegated administrator member account - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-delegated-admin.html
