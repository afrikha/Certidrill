id: dopc02-2b-run-command-rate-control
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must run a one-time shell script on 600 managed EC2 instances tagged Role=web in one account and Region. No more than 30 instances may run the script at the same time. Systems Manager must stop sending the script to more instances as soon as more than 5 instances have failed. The complete output of every invocation must be kept in Amazon S3 for audit.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run AWS-RunShellScript with Run Command, target tag:Role=web, set max concurrency to 30 and max errors to 5, and specify an S3 bucket for the command output.
    - id: b
      text:
        en: |-
          Run AWS-RunShellScript with Run Command, target tag:Role=web, set max concurrency to 5 and max errors to 30, and specify an S3 bucket for the command output.
    - id: c
      text:
        en: |-
          Create a State Manager association with AWS-RunShellScript that targets tag:Role=web, runs every 30 minutes, and writes its output to an S3 bucket.
    - id: d
      text:
        en: |-
          Have engineers start Session Manager sessions to the instances in batches of 30, run the script, and log the sessions to an S3 bucket.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Run Command targets managed nodes by tag, and its rate controls set how many nodes run the command at once (max concurrency) and how many errors are allowed before it stops sending the command to more nodes (max errors). With max errors set to 5, Systems Manager stops after the sixth error; invocations already running can finish. Command output can be written to an S3 bucket.
  options:
    b:
      en: |-
        The values are swapped: only 5 instances would run at once, and up to 30 failures would be tolerated.
    c:
      en: |-
        A State Manager association keeps applying the document on a schedule, which does not fit a one-time task.
    d:
      en: |-
        Running the script by hand in interactive sessions is manual and has no automatic error threshold.
references:
  - title: Run commands at scale - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/send-commands-multiple.html
