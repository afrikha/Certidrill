id: dopc02-2a-cdk-pipelines-self-mutation
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DevOps team defines both its application stacks and its delivery pipeline in one AWS CDK app that uses CDK Pipelines. The pipeline was deployed once from a workstation with cdk deploy. The team now wants to add a staging stage that deploys to a new account, which has already been bootstrapped to trust the pipeline account. Engineers must not need administrator credentials on their workstations for this or later pipeline changes. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the stage to the CDK app with addStage, and push the change so that the pipeline's self-mutation step updates the pipeline before it deploys the stages.
    - id: b
      text:
        en: |-
          Add the stage to the CDK app, synthesize the pipeline template, and have an administrator update the pipeline stack from a workstation with the AWS CLI.
    - id: c
      text:
        en: |-
          Create an AWS Lambda function that runs on each commit, reads the CDK app, and calls the CodePipeline UpdatePipeline API to add the new stage.
    - id: d
      text:
        en: |-
          Delete the pipeline stack, add the stage to the CDK app, and deploy the pipeline again from a workstation with cdk deploy.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CDK Pipelines are self-updating: when stages or stacks are added to the app, the pipeline reconfigures itself from the pushed source before it deploys the application. After the first deployment, pipeline changes need only a commit, not workstation credentials.
  options:
    b:
      en: |-
        A manual update by an administrator needs workstation credentials for every pipeline change, which the team wants to avoid.
    c:
      en: |-
        A custom function duplicates what self-mutation already does and is code to build and maintain.
    d:
      en: |-
        Deleting and redeploying the pipeline needs administrator credentials on a workstation and loses the pipeline's execution history.
references:
  - title: Continuous integration and delivery (CI/CD) using CDK Pipelines - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/cdk-pipeline.html
