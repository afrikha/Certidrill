id: dopc02-2a-change-set-preview
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company manages its production database tier with an AWS CloudFormation stack that contains an Amazon RDS DB instance and its parameter group. A DevOps engineer has modified the template to change several properties of the DB instance. Before the change is applied, the change advisory board must review exactly which resources will be added, modified, or deleted and whether the DB instance will be replaced. The stack must not change until the board approves.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run aws cloudformation validate-template on the modified template, and send the output to the board before the engineer updates the stack.
    - id: b
      text:
        en: |-
          Update the stack with the Preserve successfully provisioned resources option, and roll the stack back if the board rejects the change.
    - id: c
      text:
        en: |-
          Run drift detection on the stack, and give the board the list of resources whose actual configuration differs from the modified template.
    - id: d
      text:
        en: |-
          Create a change set from the modified template, give the board the list of changes and their replacement values, and execute the change set after approval.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A change set shows which resources CloudFormation will add, modify, or delete and whether a modification replaces a resource, without changing the stack. The stack changes only when the change set is executed, so the board can review it first.
  options:
    a:
      en: |-
        validate-template only checks that the template is well formed; it does not compare the template with the running stack.
    b:
      en: |-
        Updating the stack applies the change immediately, before the board has approved it.
    c:
      en: |-
        Drift detection compares the resources with the template that is already deployed, not with the modified template.
references:
  - title: Update CloudFormation stacks using change sets - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-updating-stacks-changesets.html
