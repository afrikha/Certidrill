id: dopc02-2b-cdk-aspects-validation
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company defines its infrastructure with the AWS CDK in TypeScript. A platform team maintains a shared construct library, but application teams also use L1 and L2 constructs and third-party construct libraries directly in their stacks. The applications do not use CDK Stage constructs. Security requires that synthesis fail in every application pipeline if any S3 bucket in a stack does not have versioning enabled, including buckets that higher-level constructs create indirectly. The check must run before any template is deployed and must not require changes to each construct.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an L3 construct for S3 buckets to the shared library that always enables versioning, and require every team to use it instead of the s3.Bucket construct.
    - id: b
      text:
        en: |-
          Publish an aspect in the shared library that visits each construct, adds an error annotation to every CfnBucket without versioning, and is applied to every stack with Aspects.of().
    - id: c
      text:
        en: |-
          Use escape hatches in each stack to set the VersioningConfiguration property on every CfnBucket after the stack's constructs are defined.
    - id: d
      text:
        en: |-
          Deploy the AWS Config managed rule s3-bucket-versioning-enabled in every account so that buckets without versioning are reported to the security team.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An aspect applies an operation to every construct in a scope during synthesis, including constructs created inside higher-level and third-party constructs. When the aspect adds an error annotation to a noncompliant CfnBucket, synthesis fails and the cloud assembly cannot be deployed. No construct has to change, because the aspect visits them from outside.
  options:
    a:
      en: |-
        A compliant L3 construct helps only when teams use it. Buckets that third-party constructs or direct L1 and L2 usage create would not be checked, and nothing makes synthesis fail.
    c:
      en: |-
        Escape hatches change resources one stack at a time and must be added to every stack. They modify the template instead of failing synthesis when a bucket is noncompliant.
    d:
      en: |-
        AWS Config evaluates buckets after they are deployed. It does not stop synthesis or deployment.
references:
  - title: Aspects and the AWS CDK - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/aspects.html
