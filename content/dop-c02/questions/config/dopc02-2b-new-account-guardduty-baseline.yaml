id: dopc02-2b-new-account-guardduty-baseline
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's Security Tooling account is the delegated administrator for Amazon GuardDuty in every Region that the company uses, and GuardDuty is enabled in all existing member accounts. Every new account created in the organization must automatically have GuardDuty enabled and managed by the Security Tooling account. Every new account must also receive a read-only IAM role that the security team's automation assumes. The company wants the LEAST custom code.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an EventBridge rule for the CreateAccount event that invokes a Lambda function to create a GuardDuty detector in the new account and invite it from the Security Tooling account.
    - id: b
      text:
        en: |-
          In the Security Tooling account, configure the GuardDuty organization auto-enable setting for new member accounts in each Region that the company uses.
    - id: c
      text:
        en: |-
          Deploy the AWS Config managed rule guardduty-enabled-centralized as an organization rule so that new accounts are evaluated for GuardDuty.
    - id: d
      text:
        en: |-
          Create a self-managed StackSet for the read-only role, and add each new account to the StackSet after the account is created.
    - id: e
      text:
        en: |-
          Create a StackSet with service-managed permissions for the read-only role that targets the organization root with automatic deployment enabled.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      The GuardDuty delegated administrator can set organization auto-enable so that GuardDuty is enabled and managed for accounts that join the organization, in each Region where it is configured. A service-managed StackSet with automatic deployment deploys the IAM role to every account that is added to the target, with no code.
  options:
    a:
      en: |-
        Custom Lambda code is unnecessary because GuardDuty auto-enable is a managed feature, and invitations are not needed for organization members.
    c:
      en: |-
        This Config rule only reports whether GuardDuty is enabled; it does not enable it.
    d:
      en: |-
        Self-managed StackSets require adding each new account by hand, which is not automatic.
references:
  - title: Managing GuardDuty accounts with AWS Organizations - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_organizations.html
  - title: Enable or disable automatic deployments for StackSets in AWS Organizations - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-manage-auto-deployment.html
