id: dopc02-5a-replayable-event-designs
objective: "5.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is designing how order events are distributed to its consumers. Consumer applications are added several times a year, and each new consumer must be able to process the order events of the 3 days before it was deployed, without asking the producers to publish them again. Existing consumers must not be affected when a new consumer reprocesses past events.

    Which designs will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Send the events to an Amazon SQS standard queue with a 4-day message retention period, and have every consumer poll the queue.
    - id: b
      text:
        en: |-
          Publish the events to an Amazon SNS standard topic, and give each consumer's subscription a dead-letter queue with a 14-day retention period.
    - id: c
      text:
        en: |-
          Write the events to an Amazon Kinesis data stream with a retention period of at least 3 days, and have each consumer read the stream from 3 days back.
    - id: d
      text:
        en: |-
          Publish the events to an Amazon EventBridge event bus with an archive, and replay the last 3 days of the archive only to the new consumer's rule.
    - id: e
      text:
        en: |-
          Send the events to an AWS Lambda function asynchronously, and configure an on-failure destination that keeps the events in an Amazon SQS queue.
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |-
      A Kinesis data stream keeps records for its retention period regardless of reads, so a new consumer can start reading 3 days back without affecting other consumers. An EventBridge archive keeps the events received by the bus, and a replay can target only specific rules on the source bus, such as the new consumer's rule.
  options:
    a:
      en: |-
        A queue message is gone once a consumer deletes it, and consumers of one queue compete for messages, so a new consumer cannot read the past 3 days.
    b:
      en: |-
        An SNS topic keeps no history; dead-letter queues receive only messages that failed delivery to existing subscriptions.
    e:
      en: |-
        An on-failure destination keeps only events that failed processing, not all past events for a new consumer.
references:
  - title: "Change the data retention period - Amazon Kinesis Data Streams"
    url: https://docs.aws.amazon.com/streams/latest/dev/kinesis-extended-retention.html
  - title: "Archiving and replaying events in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-archive.html
