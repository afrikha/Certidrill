id: dopc02-5a-input-transformer-readable-alert
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations team uses an Amazon EventBridge rule on the default event bus that matches EC2 Instance State-change Notification events for production instances. The rule targets an Amazon SNS topic with email subscriptions. The on-call engineers complain that each email contains the full event as raw JSON. They want each email to contain one readable sentence with the instance ID, the new state, and the time of the change. The team does not want to write or maintain any code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an AWS Lambda function as the rule target that formats the event into a sentence and publishes the result to the SNS topic.
    - id: b
      text:
        en: |-
          Add a subscription filter policy to each email subscription that selects the instance-id, state, and time fields of the event payload.
    - id: c
      text:
        en: |-
          Configure an input transformer on the rule target with an input path for the instance ID, state, and time, and an input template that builds the sentence.
    - id: d
      text:
        en: |-
          Configure the rule target with a constant JSON input that contains a sentence explaining that an instance state has changed.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An input transformer changes the event before EventBridge delivers it to the target. The input path defines variables from JSON paths of the event (such as $.detail.instance-id, $.detail.state, and $.time), and the input template uses those variables to build a string, so the topic receives one readable sentence without any code.
  options:
    a:
      en: |-
        A Lambda function works, but it is custom code that the team must write and maintain, which the requirements exclude.
    b:
      en: |-
        SNS subscription filter policies decide which messages a subscriber receives; they do not reshape or extract fields from the message body.
    d:
      en: |-
        A constant input replaces the event with fixed text, so the email would no longer contain the instance ID, the state, or the time.
references:
  - title: "Amazon EventBridge input transformation - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-transform-target-input.html
