id: dopc02-5a-quick-setup-host-mgmt-org
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 300 AWS accounts in AWS Organizations and runs Amazon EC2 instances in several Regions. All instances are launched from AMIs that include SSM Agent. From the management account, the cloud platform team must make sure that, on every instance in every account and Region, SSM Agent is updated every two weeks, inventory is collected every 30 minutes, missing patches are scanned for daily, and the unified CloudWatch agent is installed. The team wants the LEAST operational overhead, including for accounts added later.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use a service-managed CloudFormation StackSet to deploy State Manager associations for the four tasks to every account and Region of the organization.
    - id: b
      text:
        en: |-
          Create a Systems Manager Quick Setup host management configuration in the management account that targets the entire organization.
    - id: c
      text:
        en: |-
          Sign in to each account, and create a Systems Manager Quick Setup host management configuration that targets all instances in each Region.
    - id: d
      text:
        en: |-
          Deploy an organization AWS Config conformance pack that checks the SSM Agent version, inventory collection, patch compliance, and CloudWatch agent status.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Quick Setup host management configuration combines these exact options: SSM Agent updates every two weeks, inventory every 30 minutes, a daily patch scan, and installation of the CloudWatch agent. When it is created from the management account with the Entire organization target, it is deployed to all OUs and Regions of the organization.
  options:
    a:
      en: |-
        StackSets can deploy the associations, but the team would have to write and maintain the templates and documents that Quick Setup provides.
    c:
      en: |-
        Per-account configurations repeat the work in 300 accounts and in every new account, which is the overhead that the organization target avoids.
    d:
      en: |-
        AWS Config conformance packs evaluate compliance; they do not update agents, collect inventory, or install software.
references:
  - title: "Set up Amazon EC2 host management using Quick Setup - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/quick-setup-host-management.html
