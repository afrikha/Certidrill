id: dopc02-5a-eventbridge-target-retry-dlq
objective: "5.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An Amazon EventBridge rule in us-east-1 starts an AWS Step Functions state machine for each incoming claim event. During traffic peaks, some StartExecution requests fail with throttling errors, and EventBridge keeps retrying them for many hours, so stale claims start processing long after they are no longer valid. The company wants EventBridge to stop retrying a claim event 2 hours after it was received and to keep every event that could not be delivered so that an operator can review it.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the retry policy of the rule's target to a maximum event age of 2 hours.
    - id: b
      text:
        en: |-
          Set the retry policy of the rule's target to a maximum of 0 retry attempts so that failed events are kept immediately.
    - id: c
      text:
        en: |-
          Configure an Amazon SQS FIFO queue in us-east-1 as the dead-letter queue of the rule's target.
    - id: d
      text:
        en: |-
          Configure an Amazon SQS standard queue in us-east-1 as the dead-letter queue of the rule's target, with a queue policy that allows EventBridge to send messages.
    - id: e
      text:
        en: |-
          Configure an Amazon SQS standard queue in us-west-2 as the dead-letter queue of the rule's target so that failed events are kept in another Region.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      By default, EventBridge retries a failed delivery for up to 24 hours and 185 attempts, and the target's retry policy can shorten the time it keeps trying. When retries are exhausted, the event is dropped unless the target has a dead-letter queue, which must be an SQS standard queue in the same Region as the rule, with permission for EventBridge to send to it.
  options:
    b:
      en: |-
        With no retries, transient throttling errors would send events to the dead-letter queue immediately instead of retrying them for up to 2 hours.
    c:
      en: |-
        EventBridge supports only standard queues as dead-letter queues; a FIFO queue cannot be used.
    e:
      en: |-
        The dead-letter queue must be in the same Region as the rule.
references:
  - title: "How EventBridge retries delivering events - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rule-retry-policy.html
  - title: "Using dead-letter queues to process undelivered events in EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rule-dlq.html
