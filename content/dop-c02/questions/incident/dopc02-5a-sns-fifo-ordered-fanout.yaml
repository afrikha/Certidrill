id: dopc02-5a-sns-fifo-ordered-fanout
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's core system publishes account ledger events. Two downstream services, statements and fraud scoring, must each receive every event in its own Amazon SQS queue so that each service can be stopped for maintenance without losing events. Each service must process the events of a given account in the exact order in which they were published. When the core system retries a publish after a timeout, the duplicate must not be delivered to the services. The core system must publish each event once and must not know which services consume it.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Publish the events to an Amazon SNS FIFO topic with the account ID as the message group ID and a deduplication ID, and subscribe one Amazon SQS FIFO queue for each service.
    - id: b
      text:
        en: |-
          Publish the events to an Amazon SNS FIFO topic with the account ID as the message group ID and a deduplication ID, and subscribe one Amazon SQS standard queue for each service.
    - id: c
      text:
        en: |-
          Send the events to one Amazon SQS FIFO queue with the account ID as the message group ID and content-based deduplication, and have both services poll the queue.
    - id: d
      text:
        en: |-
          Publish the events to an Amazon SNS standard topic, subscribe one Amazon SQS standard queue for each service, and have each service sort the events by timestamp.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An SNS FIFO topic delivers messages to subscribed SQS FIFO queues in order within each message group and drops duplicate publishes, so each service gets every event of an account exactly in order in its own durable queue. The publisher sends once to the topic and does not need to know the subscribers.
  options:
    b:
      en: |-
        SQS standard queues subscribed to an SNS FIFO topic get only best-effort ordering and at-least-once delivery, so neither strict order nor duplicate removal is guaranteed.
    c:
      en: |-
        With one queue, each message is received and deleted by only one of the two services, so the services would not each get every event.
    d:
      en: |-
        A standard topic and standard queues provide no ordering or deduplication, and sorting by timestamp in each service is custom code that still cannot guarantee the published order or remove duplicates.
references:
  - title: "Message ordering and deduplication strategies using Amazon SNS FIFO topics - Amazon Simple Notification Service"
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-fifo-topics.html
