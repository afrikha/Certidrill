id: dopc02-5a-esm-filter-drop-heartbeats
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's devices send JSON messages to an Amazon SQS standard queue, and an AWS Lambda function processes them through an event source mapping. About 90% of the messages have a type field set to heartbeat. No application needs heartbeat messages, but the function is invoked for them, and Lambda costs are high. The company wants the function to stop receiving heartbeat messages without changing the function code or the devices.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add filter criteria to the event source mapping so that only messages whose body type field is not heartbeat invoke the function.
    - id: b
      text:
        en: |-
          Increase the batch size of the event source mapping so that each invocation of the function processes more messages, including heartbeats.
    - id: c
      text:
        en: |-
          Set a reserved concurrency on the function so that fewer invocations run at the same time when many heartbeat messages arrive.
    - id: d
      text:
        en: |-
          Configure a redrive policy on the queue that moves heartbeat messages to a dead-letter queue after one receive.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Event source mappings support filter criteria on the message body of SQS messages, using the same syntax as EventBridge patterns. Lambda invokes the function only for matching messages and automatically removes non-matching SQS messages from the queue, which is acceptable here because no application needs heartbeats.
  options:
    b:
      en: |-
        Larger batches reduce the number of invocations, but the function still receives and processes every heartbeat message.
    c:
      en: |-
        Reserved concurrency only limits parallel invocations; the heartbeat messages are still delivered to the function, just more slowly.
    d:
      en: |-
        A redrive policy moves messages only after they fail processing a number of times; it cannot select messages by their content.
references:
  - title: "Control which events Lambda sends to your Event Function - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventfiltering.html
