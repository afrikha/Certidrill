id: dopc02-5b-warm-pool-launch-hook
objective: "5.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Auto Scaling group with a warm pool to shorten scale-out time. The warm pool keeps instances in the Stopped state. The user data script installs and configures the application, which takes about 8 minutes. The engineers notice that instances enter the warm pool and are stopped before the script finishes. When these instances later move into service, parts of the application are missing, and the instances fail their Application Load Balancer health checks. The warm pool must stay in the Stopped state to control cost.

    Which combination of steps will fix the issue? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a lifecycle hook for the EC2_INSTANCE_LAUNCHING lifecycle action to the Auto Scaling group.
    - id: b
      text:
        en: |-
          Change the state of the warm pool to Running so that the user data script can finish before the instance is used.
    - id: c
      text:
        en: |-
          Increase the health check grace period of the Auto Scaling group to 15 minutes.
    - id: d
      text:
        en: |-
          At the end of the user data script, call complete-lifecycle-action with the CONTINUE result for the instance.
    - id: e
      text:
        en: |-
          Add a lifecycle hook for the EC2_INSTANCE_TERMINATING lifecycle action to the Auto Scaling group.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The stop or hibernate action of a warm pool does not wait for user data to finish. A launch lifecycle hook holds the instance in a wait state, and the script releases it with complete-lifecycle-action and CONTINUE once the bootstrap has finished, so the instance is stopped only when it is fully configured.
  options:
    b:
      en: |-
        Running instances in the warm pool would finish the script, but the company must keep the pool Stopped to control cost.
    c:
      en: |-
        A longer grace period only delays health checks; the instance is still stopped in the middle of the script and comes back incomplete.
    e:
      en: |-
        A termination hook acts when an instance leaves the group, not while it is being initialized for the warm pool.
references:
  - title: Amazon EC2 Auto Scaling lifecycle hooks - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html
