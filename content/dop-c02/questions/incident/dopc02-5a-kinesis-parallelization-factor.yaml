id: dopc02-5a-kinesis-parallelization-factor
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A fleet management company streams vehicle position records to an Amazon Kinesis data stream with 4 shards in provisioned mode, using the vehicle ID as the partition key. An AWS Lambda function reads the stream through an event source mapping and calls an external geocoding API for each record, which takes about 200 ms. The stream's write capacity is sufficient and there is only one consumer, but the IteratorAge metric keeps growing during business hours. Records of the same vehicle must be processed in order. The company does not want to add shards to the stream.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Register an enhanced fan-out consumer for the function so that it gets dedicated read throughput from each shard of the stream.
    - id: b
      text:
        en: |-
          Increase the parallelization factor of the event source mapping so that Lambda processes several batches from each shard at the same time.
    - id: c
      text:
        en: |-
          Set a batching window of 60 seconds on the event source mapping so that each invocation of the function receives more records.
    - id: d
      text:
        en: |-
          Increase the reserved concurrency of the function so that Lambda can run more invocations at the same time for the stream.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The function is the bottleneck, not the read throughput. A parallelization factor between 1 and 10 lets Lambda process up to that many batches from each shard concurrently, and Lambda still processes the records of each partition key in order, so throughput grows without adding shards.
  options:
    a:
      en: |-
        Enhanced fan-out helps when several consumers compete for a shard's read throughput; with one consumer whose processing is slow, it does not speed up the function.
    c:
      en: |-
        A batching window makes Lambda wait to gather more records; it adds latency and does not add concurrent processing per shard.
    d:
      en: |-
        With the default parallelization factor, the mapping runs only one batch per shard at a time, so more reserved concurrency would not be used.
references:
  - title: "Using Lambda to process records from Amazon Kinesis Data Streams - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
