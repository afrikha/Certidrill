id: dopc02-5b-securityhub-finding-remediation
objective: "5.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Security Hub CSPM in a single production account. A control reports Amazon EBS snapshots that are publicly restorable. A DevOps engineer created a Security Hub CSPM automation rule that matches failed findings of this control and sets their severity to CRITICAL and their workflow status to NOTIFIED. A week later, the same snapshots are still public. The company requires public snapshots to be made private automatically within minutes, with each fix recorded in AWS Systems Manager.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an action to the automation rule that sets the compliance status of the matching findings to PASSED so that the snapshots are made private.
    - id: b
      text:
        en: |-
          Create a custom action in Security Hub CSPM that sends selected findings to an Automation runbook that removes public access from the snapshot.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule for this control's FAILED findings that starts an Automation runbook to make the snapshot private.
    - id: d
      text:
        en: |-
          Disable the control in Security Hub CSPM, and add an automation rule that suppresses future findings for public snapshots.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Security Hub CSPM sends findings to EventBridge, so a rule on the failed findings of the control can start an Automation runbook within minutes. Each runbook execution is recorded in Systems Manager.
  options:
    a:
      en: |-
        Automation rules only change finding fields; marking a finding as passed does not change the snapshot, it only hides the problem.
    b:
      en: |-
        A custom action runs only when someone selects findings in the console and sends them, so the remediation would not be automatic.
    d:
      en: |-
        Disabling the control and suppressing findings stops the reporting and leaves the snapshots public.
references:
  - title: Understanding automation rules in Security Hub CSPM - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/automation-rules.html
