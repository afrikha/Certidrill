id: dopc02-5b-codedeploy-ecs-hook-callback
objective: "5.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys an Amazon ECS service with AWS CodeDeploy blue/green deployments. A new AWS Lambda function was added to the AfterAllowTestTraffic hook of the AppSpec file to run API tests against the test listener. The function's logs show that every test passes within 2 minutes and that the function ends with an AccessDenied error. Each deployment then stays in progress for about one hour and fails with a message that it timed out while waiting for a status callback.

    What should the DevOps engineer do to fix the deployments?
body:
  options:
    - id: a
      text:
        en: |-
          Add the codedeploy:PutLifecycleEventHookExecutionStatus permission to the execution role of the Lambda function.
    - id: b
      text:
        en: |-
          Increase the timeout of the Lambda function to 15 minutes so that it can report its result to CodeDeploy.
    - id: c
      text:
        en: |-
          Move the function from the AfterAllowTestTraffic hook to the BeforeInstall hook so that it runs before the test listener is used.
    - id: d
      text:
        en: |-
          Add the lambda:InvokeFunction permission for the function to the CodeDeploy service role of the deployment group.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A hook function must call PutLifecycleEventHookExecutionStatus to return Succeeded or Failed, and CodeDeploy expects this callback within one hour of invoking the hook. The function runs, so CodeDeploy can invoke it, but the AccessDenied error shows that its execution role cannot report the result.
  options:
    b:
      en: |-
        The function finishes in 2 minutes and fails on a permission error, so a longer timeout does not let it report the result.
    c:
      en: |-
        At BeforeInstall the replacement task set does not receive test traffic yet, and the function would still be unable to report its status.
    d:
      en: |-
        The logs show that the function is invoked and runs, so CodeDeploy already has permission to invoke it.
references:
  - title: Troubleshoot Amazon ECS deployment issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-ecs.html
