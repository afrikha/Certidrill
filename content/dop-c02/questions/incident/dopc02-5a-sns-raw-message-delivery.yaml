id: dopc02-5a-sns-raw-message-delivery
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company publishes JSON order messages to an Amazon SNS standard topic, and an Amazon SQS queue subscribed to the topic feeds a legacy order processor. The processor cannot parse the messages, because each message body contains an SNS JSON document with fields such as Type, MessageId, TopicArn, and Message instead of the original order. The company cannot change the processor or the publisher.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the topic to an SNS FIFO topic and the queue to an SQS FIFO queue so that the original message body is delivered.
    - id: b
      text:
        en: |-
          Set the filter policy scope of the queue's subscription to MessageBody so that SNS delivers only the message body to the queue.
    - id: c
      text:
        en: |-
          Turn on raw message delivery for the queue's subscription so that SNS delivers the published message without its JSON envelope.
    - id: d
      text:
        en: |-
          Configure the publisher's messages with message attributes so that SNS stores its metadata in attributes instead of the body.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With raw message delivery turned on for an SQS subscription, SNS strips its metadata and sends the published message as is. Without it, SNS wraps each message in a JSON document that contains the metadata and the original message in the Message field.
  options:
    a:
      en: |-
        FIFO topics and queues add ordering and deduplication; they do not remove the JSON envelope from the delivered messages.
    b:
      en: |-
        The filter policy scope only chooses whether a filter policy applies to message attributes or to the message body; it does not change the delivered format.
    d:
      en: |-
        Message attributes do not change the format of the body; without raw delivery, SNS still wraps the message in its JSON envelope, and the publisher cannot be changed anyway.
references:
  - title: "Amazon SNS raw message delivery - Amazon Simple Notification Service"
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-large-payload-raw-message-delivery.html
