id: dopc02-5b-asg-kms-client-error
objective: "5.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company moved to a new launch template version whose AMI has EBS snapshots encrypted with a customer managed AWS KMS key. The key is in the same account as the Auto Scaling group and was created with a key policy that allows only the account's administrators. Since the change, the group fails to launch any instance, and each scaling activity shows the status message "Client.InternalError: Client error on launch". The engineers can launch an instance manually from the same launch template with their own credentials.

    What should the DevOps engineer do to resolve the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Request an increase of the On-Demand instance quota in the Region, because the error means that the account reached its instance limit.
    - id: b
      text:
        en: |-
          Add kms:Decrypt and kms:CreateGrant permissions for the key to the IAM instance profile in the launch template.
    - id: c
      text:
        en: |-
          Create a grant on the key for the engineers' IAM role, because Amazon EC2 Auto Scaling launches instances with the credentials of the last user who updated the group.
    - id: d
      text:
        en: |-
          Add a statement to the key policy that allows the service-linked role used by the Auto Scaling group to use the key.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      This error usually means that the service-linked role of the Auto Scaling group cannot use the customer managed key that encrypts the EBS volumes. For a key in the same account, a key policy statement that allows the service-linked role to use the key resolves it; the engineers succeed because their own principal is allowed by the key policy.
  options:
    a:
      en: |-
        An instance quota problem produces a message that instances are already running, not Client.InternalError.
    b:
      en: |-
        The instance profile is used by the instance after it starts; the launch and the volume creation are done with the Auto Scaling service-linked role.
    c:
      en: |-
        Amazon EC2 Auto Scaling launches instances with its service-linked role, not with the credentials of a user.
references:
  - title: "Troubleshoot Amazon EC2 Auto Scaling: EC2 instance launch failures - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ts-as-instancelaunchfailure.html
