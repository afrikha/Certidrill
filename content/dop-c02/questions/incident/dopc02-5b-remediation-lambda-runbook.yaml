id: dopc02-5b-remediation-lambda-runbook
objective: "5.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an AWS Config custom rule to flag resources that do not carry the mandatory cost allocation tags of their account. The platform team already has an AWS Lambda function named TagFixer that receives a resource ID and applies the correct tags. The company wants AWS Config to fix every noncompliant resource automatically, wants the remediation status of each resource to appear in AWS Config, and does not want to rewrite the tagging logic.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a remediation configuration for the rule with the TagFixer function ARN as the target, set it to automatic, and map the function's input to the resource ID.
    - id: b
      text:
        en: |-
          Associate a custom Automation runbook whose aws:invokeLambdaFunction step calls TagFixer as the rule's automatic remediation, with an assume role that can invoke TagFixer.
    - id: c
      text:
        en: |-
          Call TagFixer from the evaluation function of the custom rule so that each resource is tagged before the rule reports its compliance status to AWS Config.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule for the AWS Config compliance change events of the rule that invokes TagFixer with the resource ID taken from each event.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Config remediation actions run Systems Manager Automation documents, so a small custom runbook that calls the existing function lets AWS Config run it automatically and track each execution. The assume role must be allowed to invoke TagFixer, because the AmazonSSMAutomationRole managed policy only covers functions whose names start with Automation.
  options:
    a:
      en: |-
        A remediation configuration accepts only a Systems Manager document as its target type, not a Lambda function.
    c:
      en: |-
        An evaluation function that changes the resources it evaluates hides the noncompliance and records no remediation in AWS Config.
    d:
      en: |-
        This fixes the resources, but the fixes happen outside AWS Config remediation, so AWS Config shows no remediation status.
references:
  - title: RemediationConfiguration - AWS Config
    url: https://docs.aws.amazon.com/config/latest/APIReference/API_RemediationConfiguration.html
  - title: Create the service roles for Automation using the console - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-setup-iam.html
