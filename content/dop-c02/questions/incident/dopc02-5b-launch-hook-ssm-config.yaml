id: dopc02-5b-launch-hook-ssm-config
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. The instances use an AWS-provided AMI that is replaced every month, so the company does not bake its own software into the AMI. Every new instance must run an AWS Systems Manager command document that installs a security agent and registers the instance in an internal inventory. The instance must not receive traffic until the document has succeeded, and an instance on which the document fails must be terminated and replaced. The company wants the MOST automated solution.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an Amazon SNS notification for EC2_INSTANCE_LAUNCH events on the group, and subscribe an AWS Lambda function that runs the command document on the new instance with Run Command.
    - id: b
      text:
        en: |-
          Add a launch lifecycle hook, and use an Amazon EventBridge rule on its lifecycle action event to start a runbook that runs the document and then sends CONTINUE, or ABANDON on failure.
    - id: c
      text:
        en: |-
          Create a State Manager association that targets the group's tag and runs the command document every 30 minutes, and increase the group's health check grace period to 30 minutes.
    - id: d
      text:
        en: |-
          Set a slow start duration of 15 minutes on the target group, and create a State Manager association that targets the group's tag so that the document runs on each new instance.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A launch lifecycle hook holds each new instance in a wait state before it is put in service, and Amazon EC2 Auto Scaling sends the lifecycle action event to EventBridge. The runbook runs the document and completes the action: CONTINUE puts the instance in service, and ABANDON makes Auto Scaling terminate and replace it.
  options:
    a:
      en: |-
        The launch notification is sent after the instance has launched and joined the group, so the instance can receive traffic before the document runs, and a failure does not replace it.
    c:
      en: |-
        The association can run up to 30 minutes after the instance is in service, and the grace period only delays health checks; it does not keep traffic away or replace an instance on which the document failed.
    d:
      en: |-
        Slow start still sends a growing share of requests to the new target, and nothing terminates an instance on which the document fails.
references:
  - title: Amazon EC2 Auto Scaling lifecycle hooks - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html
