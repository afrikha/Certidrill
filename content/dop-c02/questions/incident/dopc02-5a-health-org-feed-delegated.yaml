id: dopc02-5a-health-org-feed-delegated
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 120 AWS accounts in AWS Organizations with all features enabled, and all its workloads run in us-east-1. The operations team works from a dedicated Operations account. The team wants every AWS Health event that affects any account in the organization to reach one Amazon EventBridge rule in the Operations account, which opens tickets. The company does not want to deploy or maintain any resources in the member accounts, and it wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use a service-managed CloudFormation StackSet to deploy, in every member account, an EventBridge rule that forwards aws.health events to an event bus in the Operations account.
    - id: b
      text:
        en: |-
          Create an EventBridge rule for aws.health events in the management account, and add a target that forwards the matched events to an event bus in the Operations account.
    - id: c
      text:
        en: |-
          Turn on AWS Health organizational view, register the Operations account as a delegated administrator for AWS Health, and create the aws.health rule in the Operations account.
    - id: d
      text:
        en: |-
          Schedule an AWS Lambda function in the Operations account that calls the AWS Health API every 5 minutes for each member account and creates a ticket for each new event.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With organizational view turned on, the management account or a delegated administrator account receives a single feed of AWS Health events from all accounts in the organization through EventBridge. Registering the Operations account as delegated administrator lets one rule there see every account's events, and nothing has to be deployed in the member accounts.
  options:
    a:
      en: |-
        This forwards the events, but it deploys and maintains rules and roles in all 120 member accounts, which the company wants to avoid.
    b:
      en: |-
        Without organizational view, an EventBridge rule receives AWS Health events only for its own account, so the management account would forward only its own events.
    d:
      en: |-
        Polling every account with custom code adds operational overhead and delay, while the managed organizational feed delivers the events to EventBridge directly.
references:
  - title: "Aggregating AWS Health events using organizational view and delegated administrator access - AWS Health"
    url: https://docs.aws.amazon.com/health/latest/ug/aggregating-health-events.html
  - title: "Managing delegated administrator views for an organization - AWS Health"
    url: https://docs.aws.amazon.com/health/latest/ug/delegated-administrator-organizational-view.html
