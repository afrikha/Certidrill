id: dopc02-5a-kinesis-retention-reprocess
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An industrial IoT company collects telemetry records from 50,000 sensors. Three applications owned by different teams must each read every record, and each application must process the records of a given sensor in the order in which they were produced. A data science team is building a fourth application, and each time it deploys a new model it must reprocess the records of the previous 5 days from the same source. The producers cannot send records again. The company wants a managed solution with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write the records to an Amazon Kinesis data stream with the sensor ID as the partition key, keep the default retention period, and have each application read the stream with its own consumer.
    - id: b
      text:
        en: |-
          Write the records to an Amazon Kinesis data stream with the sensor ID as the partition key, increase the retention period to 7 days, and have each application read the stream with its own consumer.
    - id: c
      text:
        en: |-
          Publish the records to an Amazon SNS FIFO topic with the sensor ID as the message group ID, and subscribe one Amazon SQS FIFO queue with a 14-day retention period for each application.
    - id: d
      text:
        en: |-
          Send the records to one Amazon SQS FIFO queue with the sensor ID as the message group ID and a 14-day retention period, and have the four applications poll the queue.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Kinesis data stream keeps records for its retention period whether or not they have been read, so several applications can read the same records, in order for each partition key, and an application can reprocess older records. The default retention is 24 hours, so it must be increased (up to 365 days is possible) to cover 5 days of history.
  options:
    a:
      en: |-
        With the default retention of 24 hours, the records of the previous 5 days are no longer in the stream when the data science team deploys a new model.
    c:
      en: |-
        Each queue receives copies only from the time it is subscribed, and a message is gone once the application deletes it, so the fourth application cannot reprocess the previous 5 days on each deployment.
    d:
      en: |-
        Each message of one queue is delivered to only one of the applications, so the applications would not each receive every record, and processed messages cannot be read again.
references:
  - title: "Change the data retention period - Amazon Kinesis Data Streams"
    url: https://docs.aws.amazon.com/streams/latest/dev/kinesis-extended-retention.html
