id: dopc02-5b-application-insights-dotnet
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company migrated a .NET application with a Microsoft IIS web tier and a SQL Server database to Amazon EC2. The small operations team does not know which metrics and logs to collect for this stack. It wants a managed service that scans the application's resources, sets up the right monitors, detects problems such as SQL Server failed backups and memory leaks, shows likely root causes, and lets engineers resolve issues by running Systems Manager Automation documents through OpsCenter.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the application to Amazon CloudWatch Application Insights, and use its dashboards, problem insights, and OpsCenter integration.
    - id: b
      text:
        en: |-
          Turn on CloudWatch Container Insights for the EC2 instances, and create alarms on its memory metrics.
    - id: c
      text:
        en: |-
          Create CloudWatch Contributor Insights rules on the IIS and SQL Server logs to find the top error sources.
    - id: d
      text:
        en: |-
          Install the CloudWatch agent with a default configuration on the instances, and build dashboards and alarms for every metric it publishes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CloudWatch Application Insights scans the application's resources and recommends and configures metrics and logs for its components, detects anomalies and errors, and gives root cause insights for common .NET and SQL Server problems. Its integration with OpsCenter lets engineers resolve issues by running Automation documents.
  options:
    b:
      en: |-
        Container Insights monitors container platforms such as Amazon ECS and Amazon EKS, not an IIS and SQL Server stack on EC2 instances.
    c:
      en: |-
        Contributor Insights ranks top contributors in logs; it does not choose the monitors for the stack, detect problems, or suggest root causes.
    d:
      en: |-
        A default agent configuration still leaves the team to choose what matters, build the detection, and work out the causes, which it cannot do.
references:
  - title: Detect common application problems with CloudWatch Application Insights - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-application-insights.html
