id: dopc02-5b-traces-slow-dependency
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an order service on Amazon EC2 instances. Each request to the service calls four other internal services and Amazon DynamoDB. Amazon CloudWatch metrics show that the p99 latency of the service has doubled since yesterday, but the average CPU and memory of all the instances are unchanged. The service is not instrumented for tracing yet. The team must find which downstream call makes the slow requests slow, and wants to use components that AWS recommends for new instrumentation.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Instrument the service with the AWS X-Ray SDK, run the X-Ray daemon on the instances, and inspect the trace map for the slow segments.
    - id: b
      text:
        en: |-
          Turn on detailed monitoring for the instances, and graph the per-minute latency metrics of the service next to the DynamoDB metrics.
    - id: c
      text:
        en: |-
          Instrument the service with AWS Distro for OpenTelemetry, send the traces through the CloudWatch agent to AWS X-Ray, and inspect the slow traces in the trace map.
    - id: d
      text:
        en: |-
          Add the request duration to the application logs, and use CloudWatch Logs Insights to find the requests with the longest duration.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Traces show where time is spent in each hop of a request, which metrics and single log lines cannot do. AWS recommends OpenTelemetry instrumentation, such as ADOT, with the CloudWatch agent or the OpenTelemetry Collector for new work, and the traces stay visible in the X-Ray trace map.
  options:
    a:
      en: |-
        The X-Ray SDKs and daemon entered maintenance mode on February 25, 2026, with releases limited to security fixes, so AWS recommends OpenTelemetry for new instrumentation.
    b:
      en: |-
        Finer metrics show when latency rises but not which downstream call of a slow request causes it.
    d:
      en: |-
        The total duration identifies slow requests but not which of the five downstream calls took the time.
references:
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation - AWS X-Ray
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
