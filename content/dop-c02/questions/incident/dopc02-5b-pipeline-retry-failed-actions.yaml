id: dopc02-5b-pipeline-retry-failed-actions
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CodePipeline pipeline has a Deploy stage with three parallel AWS CloudFormation actions, one for each microservice. In the latest execution, the action for the orders service failed because of a transient API throttling error, and the other two actions had already succeeded. The DevOps engineer has confirmed that the throttling has stopped. The engineer wants to deploy the orders service from the same execution and artifacts without redeploying the other two services or running the earlier stages again.

    Which action should the engineer take?
body:
  options:
    - id: a
      text:
        en: |-
          Choose Release change on the pipeline so that a new execution deploys the same source revision.
    - id: b
      text:
        en: |-
          Run retry-stage-execution for the Deploy stage with the retry mode ALL_ACTIONS.
    - id: c
      text:
        en: |-
          Roll back the Deploy stage to the last successful execution, and then start a new execution of the pipeline.
    - id: d
      text:
        en: |-
          Run retry-stage-execution for the Deploy stage with the retry mode FAILED_ACTIONS.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Retrying failed actions reruns only the actions that failed in the stage, inside the same pipeline execution, while the successful actions keep their results. The pipeline structure has not changed, so the failed stage can be retried.
  options:
    a:
      en: |-
        Release change starts a new execution that runs every stage again, including the source and build stages.
    b:
      en: |-
        ALL_ACTIONS reruns every action in the stage from the first one, which redeploys the two services that already succeeded.
    c:
      en: |-
        A rollback redeploys the previous artifacts, and the new execution then runs every stage again.
references:
  - title: Configuring stage retry for a failed stage or failed actions - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/stage-retry.html
