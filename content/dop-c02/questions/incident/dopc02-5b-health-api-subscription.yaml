id: dopc02-5b-health-api-subscription
objective: "5.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A startup that has no paid AWS Support plan wrote a script that calls the AWS Health API DescribeEvents operation every 5 minutes and opens tickets for new events that affect its account. Every call fails with a SubscriptionRequiredException error. The script's IAM role has the AWSHealthFullAccess managed policy. The company wants new AWS Health events for its account to open tickets automatically through an existing AWS Lambda function, at no additional cost and without changing its support plan.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the script to call the passive AWS Health endpoint in us-east-2, which serves requests from accounts on any support plan.
    - id: b
      text:
        en: |-
          Create Amazon EventBridge rules for aws.health events in the Regions that the company uses, with the Lambda function as the target.
    - id: c
      text:
        en: |-
          Change the script to call the global AWS Health endpoint so that the request is routed to an endpoint that accepts it.
    - id: d
      text:
        en: |-
          Add the health:DescribeEvents action to an inline policy of the script's role, because the managed policy does not cover the operation.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Using the AWS Health API requires one of the eligible AWS Support plans, and calls from an account without one return SubscriptionRequiredException. All AWS customers can receive AWS Health events through EventBridge at no additional cost, so rules in the Regions in use can invoke the existing function.
  options:
    a:
      en: |-
        The active and passive endpoints serve the same API with the same support plan requirement; the passive one only adds the risk of older data.
    c:
      en: |-
        The global endpoint resolves to the active Regional endpoint, so the subscription requirement is the same.
    d:
      en: |-
        The error is about the support plan, not IAM permissions, and the managed policy already grants AWS Health access.
references:
  - title: Integrating AWS Health with other systems using the AWS Health API - AWS Health
    url: https://docs.aws.amazon.com/health/latest/ug/health-api.html
  - title: What is AWS Health? - AWS Health
    url: https://docs.aws.amazon.com/health/latest/ug/what-is-aws-health.html
