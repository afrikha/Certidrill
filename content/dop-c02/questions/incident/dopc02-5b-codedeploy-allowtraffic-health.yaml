id: dopc02-5b-codedeploy-allowtraffic-health
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS CodeDeploy blue/green deployments for an application on Amazon EC2 instances behind an Application Load Balancer. After the team moved the application's status page from /health to /status, every deployment fails during the AllowTraffic lifecycle event. All the earlier lifecycle events succeed on the replacement instances, the hook scripts run without errors, and the CodeDeploy agent logs show no error for AllowTraffic.

    What is the most likely cause?
body:
  options:
    - id: a
      text:
        en: |-
          The ApplicationStop script of the last successful revision fails on the original instances.
    - id: b
      text:
        en: |-
          The instance profile of the replacement instances no longer allows access to the revision bucket.
    - id: c
      text:
        en: |-
          The target group's health check still uses the old path, so the replacement instances never pass it.
    - id: d
      text:
        en: |-
          A hook script that runs during AllowTraffic exceeds the timeout set in the AppSpec file.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A blue/green deployment that fails in AllowTraffic without any cause in the deployment logs is typically due to incorrectly configured load balancer health checks. Here the target group still probes the old path, so the replacement instances fail their health checks; correcting the health check configuration fixes it.
  options:
    a:
      en: |-
        ApplicationStop runs before the new revision is installed, and the earlier lifecycle events succeed, so it is not what fails here.
    b:
      en: |-
        Without access to the revision, the deployment would fail when the revision is downloaded, before the install events that succeeded.
    d:
      en: |-
        AppSpec scripts cannot be attached to AllowTraffic, and the stem states that every hook script runs without errors.
references:
  - title: Troubleshoot EC2/On-Premises deployment issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-deployments.html
