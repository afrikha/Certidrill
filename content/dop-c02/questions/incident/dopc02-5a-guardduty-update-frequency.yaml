id: dopc02-5a-guardduty-update-frequency
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses Amazon GuardDuty in 50 member accounts, and a Security account is the GuardDuty delegated administrator. An Amazon EventBridge rule in the Security account sends GuardDuty Finding events to the company's automated response workflow. New findings reach the workflow within minutes, but new occurrences of an existing finding, such as continued port probing from the same IP address, sometimes reach the workflow several hours later. The security team requires these updates within 15 minutes for every member account.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          In each member account, change the GuardDuty notification frequency for updated findings to 15 minutes, and keep the rule in the Security account.
    - id: b
      text:
        en: |-
          In each member account, create an EventBridge rule for GuardDuty Finding events that forwards them to an event bus in the Security account.
    - id: c
      text:
        en: |-
          Deploy an AWS Lambda function in each member account that calls the GuardDuty GetFindings API every 5 minutes and sends changes to the workflow.
    - id: d
      text:
        en: |-
          In the Security account, change the GuardDuty notification frequency for updated findings from the default 6 hours to 15 minutes.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      GuardDuty sends a finding with a new finding ID in near real time, but it aggregates subsequent occurrences of a finding into one event per interval, 6 hours by default. Only the administrator account can change this frequency, to 15 minutes, 1 hour, or 6 hours, and its rules already receive the findings of the member accounts.
  options:
    a:
      en: |-
        A member account cannot change the notification frequency for its own findings; the setting belongs to the administrator account.
    b:
      en: |-
        Forwarding adds no speed: the member accounts receive updated findings at the same aggregated frequency, and the administrator's rule already receives them.
    c:
      en: |-
        Polling every account is custom code to maintain, while the managed frequency setting in the administrator account solves the delay.
references:
  - title: "Processing GuardDuty findings with Amazon EventBridge - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_eventbridge.html
