id: dopc02-5b-opsitem-dedup-string
objective: "5.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an Amazon EventBridge rule to create OpsItems in AWS Systems Manager OpsCenter when Amazon EC2 Auto Scaling fails to launch an instance. During a capacity shortage, one Auto Scaling group retried for an hour and produced more than 200 OpsItems for the same problem, and the engineers lost track of the real work items. The team wants one open OpsItem per Auto Scaling group for this problem, while still getting a new OpsItem if the problem comes back after the first one is resolved.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the EventBridge rule with a CloudWatch composite alarm on the group's metrics that creates the OpsItem.
    - id: b
      text:
        en: |-
          Add an Amazon SNS topic between the rule and OpsCenter with a subscription filter policy that drops repeated launch failure events.
    - id: c
      text:
        en: |-
          Set a deduplication string that contains the Auto Scaling group name in the OpsItems that the EventBridge rule creates.
    - id: d
      text:
        en: |-
          Change the rule's pattern so that it matches only the first launch failure event of each hour for the group.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      OpsCenter uses a deduplication string, which can be set on the EventBridge rule that creates OpsItems, to avoid creating a new OpsItem while a matching one is open. Including the group name gives one open OpsItem per group, and a new one is created after the existing one is resolved.
  options:
    a:
      en: |-
        Launch failures are events, not metric values, so group metrics would not report each failure, and an alarm does not address the duplicate OpsItems that the rule creates.
    b:
      en: |-
        SNS filter policies filter on message attributes or content; they keep no state, so they cannot tell a repeated failure from the first one.
    d:
      en: |-
        Event patterns match the content of each event; they cannot count events or select the first one in a time window.
references:
  - title: AWS Systems Manager OpsCenter - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter.html
