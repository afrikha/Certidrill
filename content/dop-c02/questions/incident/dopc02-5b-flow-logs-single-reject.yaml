id: dopc02-5b-flow-logs-single-reject
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After a security hardening change, a monitoring system can no longer ping an Amazon EC2 instance. The subnet uses the default network ACL, which allows all inbound and outbound traffic. VPC Flow Logs on the instance's network interface show a single REJECT record for each ICMP request from the monitoring system to the instance, and no record for any reply.

    What is the most likely root cause?
body:
  options:
    - id: a
      text:
        en: |-
          The instance's security group has no outbound rule that allows ICMP replies to the monitoring system.
    - id: b
      text:
        en: |-
          The network ACL drops the replies because network ACLs are stateless.
    - id: c
      text:
        en: |-
          The instance's security group no longer has an inbound rule that allows ICMP from the monitoring system.
    - id: d
      text:
        en: |-
          The operating system firewall on the instance drops the ICMP requests.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When the security group denies the inbound request, Flow Logs show a single REJECT record because the traffic never reaches the instance, so no reply exists. The default network ACL allows everything, which leaves the security group's inbound rules as the cause.
  options:
    a:
      en: |-
        Security groups are stateful, so replies to an allowed request are allowed without an outbound rule; and the request itself is rejected.
    b:
      en: |-
        The default network ACL allows all traffic in both directions, and a dropped reply would appear as an ACCEPT for the request followed by a REJECT for the reply.
    d:
      en: |-
        Flow Logs record the decisions of security groups and network ACLs; a request dropped by the operating system firewall would have passed them and been recorded as ACCEPT.
references:
  - title: Flow log record examples - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-records-examples.html
