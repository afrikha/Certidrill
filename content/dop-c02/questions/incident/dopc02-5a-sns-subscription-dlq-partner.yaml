id: dopc02-5a-sns-subscription-dlq-partner
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company publishes order events to an Amazon SNS standard topic. The topic has three subscriptions: two Amazon SQS queues owned by internal teams and the HTTPS endpoint of a delivery partner. Last week, the partner changed its endpoint configuration by mistake, and for 3 hours every delivery to it failed with client-side errors. Those orders were lost. The company wants to keep any message that cannot be delivered to the partner for up to 14 days so that it can be redelivered later, without changing how the internal queues receive messages.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon SQS FIFO queue with a 14-day retention period, and set it as the dead-letter queue in a redrive policy on the partner's HTTPS subscription.
    - id: b
      text:
        en: |-
          Increase the number of retries and the maximum delay in the delivery retry policy of the partner's HTTPS subscription so that deliveries are retried for 14 days.
    - id: c
      text:
        en: |-
          Create an Amazon SQS standard queue in the same account and Region with a 14-day retention period, and set it as the dead-letter queue in a redrive policy on the partner's subscription.
    - id: d
      text:
        en: |-
          Create an Amazon SQS standard queue with a 14-day retention period, and set it as the dead-letter queue in a redrive policy on the SNS topic.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      SNS dead-letter queues are attached to individual subscriptions, so only the partner's deliveries are affected. Without a dead-letter queue, SNS discards messages that fail with client-side errors or that exhaust the retries; with one, it moves them to an SQS queue in the same account and Region, and a standard topic's subscription uses a standard queue.
  options:
    a:
      en: |-
        Subscriptions of a standard topic use standard queues as dead-letter queues; FIFO queues are for subscriptions of FIFO topics.
    b:
      en: |-
        SNS does not retry deliveries that fail with client-side errors, so a longer retry policy would not have saved these messages.
    d:
      en: |-
        A dead-letter queue is attached to a subscription, not to the topic, because deliveries happen at the subscription level.
references:
  - title: "Amazon SNS dead-letter queues - Amazon Simple Notification Service"
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-dead-letter-queues.html
