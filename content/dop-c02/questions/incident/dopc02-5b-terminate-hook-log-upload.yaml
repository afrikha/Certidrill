id: dopc02-5b-terminate-hook-log-upload
objective: "5.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer, and the group scales in every night. The application writes its logs to the instance's local disk, and the logs are lost when an instance is terminated. Auditors now require the logs of every terminated instance to be copied to an Amazon S3 bucket. Copying the logs takes up to 5 minutes. The group must keep scaling in as it does today.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on instance scale-in protection for the group so that no instance is terminated before an operator copies its logs to the S3 bucket.
    - id: b
      text:
        en: |-
          Add a launch lifecycle hook that installs a cron job on each instance to copy the logs to the S3 bucket every hour.
    - id: c
      text:
        en: |-
          Add a termination lifecycle hook, and have an Amazon EventBridge rule on its event run a script that copies the logs and completes the action.
    - id: d
      text:
        en: |-
          Increase the deregistration delay of the load balancer target group to 10 minutes so that the instance has time to copy its logs before it is terminated.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A termination lifecycle hook keeps the instance in a wait state before it is terminated, and Amazon EC2 Auto Scaling sends the lifecycle action event to EventBridge. The script copies the logs and completes the lifecycle action, and the default one-hour timeout leaves enough time for a 5-minute copy.
  options:
    a:
      en: |-
        Scale-in protection stops the group from terminating protected instances, so the nightly scale-in no longer works, and the copy stays manual.
    b:
      en: |-
        An hourly copy loses the logs written since the last run before the instance terminates.
    d:
      en: |-
        The deregistration delay lets in-flight requests finish; nothing runs the copy, and the instance is terminated once the delay ends.
references:
  - title: Amazon EC2 Auto Scaling lifecycle hooks - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html
