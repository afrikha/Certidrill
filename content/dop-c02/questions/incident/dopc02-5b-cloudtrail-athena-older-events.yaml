id: dopc02-5b-cloudtrail-athena-older-events
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is doing a root cause analysis of a data loss. The team believes that a lifecycle rule on an Amazon S3 bucket was changed about 5 months ago, and it must find which principal made the change and when. An organization trail has delivered CloudTrail management events for all accounts to a central S3 bucket for 2 years. AWS Config was not recording in the affected account at that time. The team wants an answer within the hour, with the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Look up the PutBucketLifecycleConfiguration events in the CloudTrail event history of the affected account and Region.
    - id: b
      text:
        en: |-
          Create a CloudTrail Lake event data store, import the trail's log files from the central bucket, and query them with SQL.
    - id: c
      text:
        en: |-
          Create an Amazon Athena table over the trail's log files in the central bucket, and query it for lifecycle API calls on the bucket.
    - id: d
      text:
        en: |-
          Open the AWS Config resource timeline of the bucket and filter on CloudTrail events around the suspected date.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Athena queries CloudTrail log files directly in Amazon S3, and a table for the trail can be created from the CloudTrail console or in Athena. The trail kept 2 years of events, so a query on the event name and bucket returns the principal and time of the change.
  options:
    a:
      en: |-
        The event history covers only the past 90 days of management events, so a change from 5 months ago is no longer there.
    b:
      en: |-
        CloudTrail Lake has been closed to new customers since May 31, 2026, so the company cannot create a new event data store.
    d:
      en: |-
        AWS Config was not recording in the account at that time, so the bucket has no timeline for that period.
references:
  - title: Query AWS CloudTrail logs - Amazon Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/cloudtrail-logs.html
  - title: Working with CloudTrail event history - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
