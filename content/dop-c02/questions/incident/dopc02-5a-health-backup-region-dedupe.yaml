id: dopc02-5a-health-backup-region-dedupe
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs its workloads only in eu-central-1. An Amazon EventBridge rule for aws.health events in eu-central-1 sends events to an AWS Lambda function that creates tickets. To keep receiving AWS Health events if eu-central-1 itself has an issue, a DevOps engineer added the same rule and function in us-west-2. Since then, most events create two tickets. The company wants to keep receiving events if either Region has a problem, and it must continue to receive public events about service issues in eu-central-1.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a detail.backupEvent false condition to the event pattern of the rule in us-west-2 so that it ignores the copies of the events that are sent there.
    - id: b
      text:
        en: |-
          Keep both rules, and make the ticketing function skip any event whose detail.communicationId has already created a ticket.
    - id: c
      text:
        en: |-
          Delete both rules, and create one central rule in us-west-2 that receives the account-specific events of all Regions through simplified integration.
    - id: d
      text:
        en: |-
          Move the second rule from us-west-2 to us-east-1, which is the backup Region for the events of eu-central-1.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Health sends each event to its Region and to a backup Region, which is US West (Oregon) for every Region except Oregon itself. For a highly available integration, AWS recommends rules in both the Region and the backup Region with de-duplication on detail.communicationId, which removes the duplicate tickets while keeping both delivery paths.
  options:
    a:
      en: |-
        Filtering out backup events in us-west-2 stops the duplicates but also removes the copy that protects against an issue in eu-central-1, which defeats the purpose of the second rule.
    c:
      en: |-
        Simplified integration gives no high availability and does not deliver public events shown on the AWS Health Dashboard, so two requirements fail.
    d:
      en: |-
        US East (N. Virginia) is the backup Region only for US West (Oregon); events from eu-central-1 are backed up in us-west-2, so a rule in us-east-1 would not receive their copies.
references:
  - title: "Creating EventBridge rules for AWS Region coverage - AWS Health"
    url: https://docs.aws.amazon.com/health/latest/ug/choosing-a-region.html
