id: dopc02-5b-cfn-delete-failed-bucket
objective: "5.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team deletes an AWS CloudFormation stack for a retired test environment. The deletion ends in the DELETE_FAILED state because an Amazon S3 bucket in the stack still contains objects. The objects are test results that the team must keep. All the other resources of the stack must be deleted.

    What should the team do?
body:
  options:
    - id: a
      text:
        en: |-
          Delete the stack again and specify the bucket's logical ID in the resources to retain.
    - id: b
      text:
        en: |-
          Run continue-update-rollback on the stack and skip the bucket.
    - id: c
      text:
        en: |-
          Empty the bucket, and then delete the stack again.
    - id: d
      text:
        en: |-
          Detect drift on the stack, and then delete the stack again after the drift results are available.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When a stack is in DELETE_FAILED because CloudFormation cannot delete a resource, rerunning the deletion with RetainResources deletes the stack and leaves the named resource in place. The bucket and its test results stay, and the other resources are deleted.
  options:
    b:
      en: |-
        continue-update-rollback applies to a stack in UPDATE_ROLLBACK_FAILED, not to a failed deletion.
    c:
      en: |-
        Emptying the bucket lets the deletion succeed, but it deletes the test results that the team must keep.
    d:
      en: |-
        Drift detection only reports differences from the template; it does not unblock the deletion of a non-empty bucket.
references:
  - title: Troubleshooting CloudFormation - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/troubleshooting.html
