id: dopc02-5a-trail-required-api-events
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company created a new AWS account for a payments workload in us-east-1. The security team must be notified within minutes whenever anyone calls the AWS KMS ScheduleKeyDeletion API in the account. A DevOps engineer created an Amazon EventBridge rule on the default event bus in us-east-1 with the event pattern source aws.kms, detail-type "AWS API Call via CloudTrail", and eventName ScheduleKeyDeletion, and an Amazon SNS topic as the target. The topic's access policy allows EventBridge to publish. The account has no CloudTrail trail; the engineers can see the test calls in CloudTrail Event history, but no notification arrives.

    What should the DevOps engineer do to make the rule receive these events?
body:
  options:
    - id: a
      text:
        en: |-
          Change the state of the rule to ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS so that the rule matches every management event that CloudTrail records for AWS KMS.
    - id: b
      text:
        en: |-
          Create a CloudTrail trail in the account that logs management events, and make sure that logging is turned on for the trail.
    - id: c
      text:
        en: |-
          Add an IAM role to the rule's target so that EventBridge has permission to read the matching API calls from CloudTrail Event history.
    - id: d
      text:
        en: |-
          Create a custom event bus for security events, and move the rule to that bus so that it receives the AWS KMS API call events from CloudTrail.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      EventBridge receives events with the "AWS API Call via CloudTrail" detail-type only when a CloudTrail trail with logging enabled exists in the account. Event history shows the calls but does not deliver them to EventBridge. ScheduleKeyDeletion is a write management event, so a rule in the default ENABLED state matches it once a trail is logging.
  options:
    a:
      en: |-
        The ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS state is needed only for read-only management events. ScheduleKeyDeletion is a write event, and without a logging trail no CloudTrail event reaches EventBridge in any rule state.
    c:
      en: |-
        EventBridge does not read Event history; without a trail that is logging, no API call event reaches the default bus, whatever permissions the target has.
    d:
      en: |-
        CloudTrail events are delivered to the default event bus only. A rule on a custom bus would receive nothing unless a default-bus rule forwarded the events, and there would still be no events without a trail.
references:
  - title: "AWS service events delivered via AWS CloudTrail - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
