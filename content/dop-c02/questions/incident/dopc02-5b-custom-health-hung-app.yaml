id: dopc02-5b-custom-health-hung-app
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a TCP service on Amazon EC2 instances in an Auto Scaling group behind a Network Load Balancer. The target group uses TCP health checks, and the group uses both EC2 and ELB health checks. Occasionally the application deadlocks: the port stays open, but the application stops processing requests. A watchdog script on each instance already detects the deadlock within 30 seconds. The company wants a deadlocked instance to be replaced automatically as soon as the watchdog detects the problem, with the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon CloudWatch alarm on the StatusCheckFailed_Instance metric of each instance with an EC2 recover action.
    - id: b
      text:
        en: |-
          Make the watchdog script call set-instance-health with the Unhealthy status for its own instance, and allow that call in the instance profile.
    - id: c
      text:
        en: |-
          Change the health check type of the Auto Scaling group from ELB to EC2 so that the group stops trusting the TCP health checks.
    - id: d
      text:
        en: |-
          Make the watchdog script reboot the instance with the operating system command when it detects a deadlock.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A custom health check sends the instance's health directly to Amazon EC2 Auto Scaling, which replaces an instance marked Unhealthy right away. The watchdog already detects the deadlock that the TCP health check cannot see, so one API call per detection completes the solution.
  options:
    a:
      en: |-
        The instance status checks keep passing because the operating system is healthy, and the recover action does not replace the instance.
    c:
      en: |-
        EC2 health checks see only the instance state and status checks, so the deadlocked instance would still be considered healthy.
    d:
      en: |-
        A reboot keeps the same instance instead of replacing it, which the company requires.
references:
  - title: Set up a custom health check for your Auto Scaling group - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/set-up-a-custom-health-check.html
