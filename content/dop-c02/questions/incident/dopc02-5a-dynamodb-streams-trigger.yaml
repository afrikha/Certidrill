id: dopc02-5a-dynamodb-streams-trigger
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An order service writes orders to an Amazon DynamoDB table. A new shipping process must start within seconds every time an order item is created or modified. The order service is a third-party application whose code cannot be changed, and it does not publish any events. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Schedule an AWS Lambda function every minute that scans the table for items with a recent update timestamp and starts the shipping process for each one.
    - id: b
      text:
        en: |-
          Turn on DynamoDB Streams for the table, and associate the stream with an AWS Lambda function that starts the shipping process for each change.
    - id: c
      text:
        en: |-
          Export the table to Amazon S3 every hour, and configure an S3 event notification that invokes a Lambda function to start the shipping process.
    - id: d
      text:
        en: |-
          Deploy an AWS Config custom rule for the table that is triggered by configuration changes and starts the shipping process from its Lambda function.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With DynamoDB Streams turned on, every mutation of the table's items is captured as a stream record. A Lambda function associated with the stream is invoked as new records arrive, because Lambda polls the stream several times per second, so the shipping process starts within seconds without changing the writer.
  options:
    a:
      en: |-
        A scheduled scan adds up to a minute of delay, consumes read capacity on every run, and relies on a timestamp attribute that the third-party writer may not set.
    c:
      en: |-
        Hourly exports cannot start a process within seconds of each change.
    d:
      en: |-
        AWS Config records the configuration of the table resource, not the items written to it, so item changes would never trigger the rule.
references:
  - title: "DynamoDB Streams and AWS Lambda triggers - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.Lambda.html
