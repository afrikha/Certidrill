id: dopc02-5b-ecs-ecr-private-endpoints
objective: "5.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company moved an Amazon ECS service on AWS Fargate (platform version 1.4.0) to private subnets that have no route to the internet. The task image is stored in a private Amazon ECR repository in the same Region. The tasks use the awslogs log driver, and a CloudWatch Logs interface VPC endpoint already exists in the VPC. Since the move, every task stops with a CannotPullContainerError. The task execution role is unchanged and was able to pull the image before. The subnets must not get internet access.

    Which combination of resources should the DevOps engineer create? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          An interface VPC endpoint for com.amazonaws.region.ecr.dkr with private DNS turned on.
    - id: b
      text:
        en: |-
          An interface VPC endpoint for com.amazonaws.region.ecr.api.
    - id: c
      text:
        en: |-
          A NAT gateway in a public subnet with a default route from the private subnets.
    - id: d
      text:
        en: |-
          A gateway VPC endpoint for Amazon S3 associated with the route tables of the private subnets.
    - id: e
      text:
        en: |-
          An interface VPC endpoint for AWS Systems Manager so that the tasks can retrieve the image location.
    - id: f
      text:
        en: |-
          A pull through cache rule in Amazon ECR so that the image is copied into the VPC.
answer: { optionIds: [ a, b, d ] }
explanation:
  correct:
    en: |-
      Fargate tasks on platform version 1.4.0 or later need both Amazon ECR interface endpoints, ecr.api for the API calls and ecr.dkr for the Docker registry calls with private DNS, and an S3 gateway endpoint because ECR stores the image layers in Amazon S3. The CloudWatch Logs endpoint for awslogs already exists.
  options:
    c:
      en: |-
        A NAT gateway would restore the pulls through the internet, which the subnets must not have.
    e:
      en: |-
        Pulling an image from ECR does not use Systems Manager; the image URI is in the task definition.
    f:
      en: |-
        A pull through cache copies images from an upstream registry into ECR; it does not give the private subnets a path to ECR.
references:
  - title: Amazon ECR interface VPC endpoints (AWS PrivateLink) - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/vpc-endpoints.html
  - title: Viewing Amazon ECS stopped task errors - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/stopped-task-errors.html
