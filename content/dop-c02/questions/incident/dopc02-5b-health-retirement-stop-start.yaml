id: dopc02-5b-health-retirement-stop-start
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs 300 standalone Amazon EC2 instances with EBS root volumes. Each instance runs a stateful application that tolerates a restart of a few minutes at any time, and no data is stored on instance store volumes. When AWS detects a failing host, AWS Health schedules the affected instances to stop. Today, operators read these notices and stop and start each instance by hand. The company wants each affected instance to be moved to a new host automatically as soon as AWS Health publishes the scheduled event, with the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule for AWS Health events of the EC2 service that invokes an Automation runbook to reboot each instance listed in the event.
    - id: b
      text:
        en: |-
          Create an Amazon CloudWatch alarm on the StatusCheckFailed_System metric of each instance with an EC2 recover action.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule for AWS Health scheduledChange events of EC2 that starts an Automation runbook to stop and start each affected instance.
    - id: d
      text:
        en: |-
          Create daily AMIs of every instance with Amazon Data Lifecycle Manager, and launch a replacement from the latest AMI after each scheduled stop.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Retirement of an EBS-backed instance is announced as a scheduled change in AWS Health, and stopping and starting the instance migrates it to a new host. An EventBridge rule on these events can start a managed runbook for each instance ID in the affectedEntities of the event, without custom code.
  options:
    a:
      en: |-
        A reboot keeps the instance on the same host, so it does not move the instance away from the failing hardware.
    b:
      en: |-
        The alarm reacts only after a system status check fails; it does not act on the scheduled event before the host fails.
    d:
      en: |-
        Waiting for the scheduled stop and relaunching from an AMI adds downtime, loses changes made since the last AMI, and needs custom orchestration.
references:
  - title: Manage Amazon EC2 instances scheduled to stop or retire - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/schedevents_actions_retire.html
  - title: "Reference: AWS Health events Amazon EventBridge schema - AWS Health"
    url: https://docs.aws.amazon.com/health/latest/ug/aws-health-events-eventbridge-schema.html
