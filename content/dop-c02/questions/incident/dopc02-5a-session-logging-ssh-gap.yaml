id: dopc02-5a-session-logging-ssh-gap
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company manages Linux Amazon EC2 instances with AWS Systems Manager. The session preferences of Session Manager send session logs to an Amazon CloudWatch Logs log group, and the screen utility is installed on all instances. Most engineers connect with their usual SSH client through Session Manager by using the AWS-StartSSHSession document, and some use port forwarding sessions. An audit found that the log group contains the commands and output of only a few sessions. Auditors require the commands and output of every interactive session to be logged.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on CloudWatch Logs streaming in the Session Manager preferences so that session data is sent continuously instead of at the end of each session.
    - id: b
      text:
        en: |-
          Encrypt the session data with an AWS KMS key in the Session Manager preferences so that the content of SSH sessions can be read and logged.
    - id: c
      text:
        en: |-
          Require engineers to use standard Session Manager shell sessions, and deny the AWS-StartSSHSession and port forwarding documents in their IAM policies.
    - id: d
      text:
        en: |-
          Grant the instance profile permission to write to the log group, and send the session logs to Amazon S3 as well as to CloudWatch Logs.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Session Manager cannot log sessions that connect through SSH or port forwarding, because SSH encrypts the data inside the session and Session Manager is only a tunnel. Logging commands and output for every session therefore requires standard shell sessions, enforced by denying the SSH and port forwarding documents in the engineers' IAM policies.
  options:
    a:
      en: |-
        Streaming changes when log data is sent, but SSH and port forwarding sessions are still not logged at all.
    b:
      en: |-
        KMS encryption of session data does not let Session Manager read the content that SSH encrypts end to end, so these sessions stay unlogged.
    d:
      en: |-
        Permissions and a second destination help only for sessions that can be logged; SSH and port forwarding sessions would still be missing.
references:
  - title: "Enabling and disabling session logging - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-logging.html
