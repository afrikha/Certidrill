id: dopc02-5b-hook-heartbeat-long-export
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs search nodes on Amazon EC2 instances in an Auto Scaling group. Before a node terminates, it must export its local index to Amazon S3 so that no data is lost. A termination lifecycle hook with the default heartbeat timeout holds each terminating node, and a script on the node completes the lifecycle action when the export ends. Exports take between 40 minutes and 3 hours, depending on the size of the index, and the nodes with the largest indexes are terminated before their export finishes. The group must keep scaling in normally, and every export must finish before its node terminates.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Make the export script call record-lifecycle-action-heartbeat every 30 minutes, and complete the lifecycle action when the export ends.
    - id: b
      text:
        en: |-
          Set the default result of the termination lifecycle hook to CONTINUE so that Auto Scaling waits for the script to complete the action.
    - id: c
      text:
        en: |-
          Increase the health check grace period of the group to 4 hours so that a node is not terminated while its export runs.
    - id: d
      text:
        en: |-
          Turn on instance scale-in protection for all the nodes in the group so that no node terminates before its export finishes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The default heartbeat timeout is one hour, and recording a heartbeat restarts it, so the node stays in the wait state until the export ends. The global limit is 48 hours or 100 times the heartbeat timeout, whichever is smaller, which leaves room for a 3-hour export.
  options:
    b:
      en: |-
        The default result applies when the timeout expires. For a terminating instance, both CONTINUE and ABANDON let it terminate, so long exports are still cut off after one hour.
    c:
      en: |-
        The grace period only delays health checks of new instances; it has no effect on a scale-in termination.
    d:
      en: |-
        Protecting every node stops the group from scaling in, which the company must keep doing.
references:
  - title: Amazon EC2 Auto Scaling lifecycle hooks - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html
