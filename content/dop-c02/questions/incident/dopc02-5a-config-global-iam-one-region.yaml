id: dopc02-5a-config-global-iam-one-region
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys the same AWS Config configuration recorder to eight Regions with a CloudFormation StackSet. The recorder records all resource types, including the global IAM resource types (users, groups, roles, and policies). The security team notices that every change to an IAM role creates a configuration item in all eight Regions, and that the periodic rules that check IAM resources sometimes fail because of API throttling. The team still needs a complete configuration history of IAM resources.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the recording frequency of the recorder in all eight Regions to daily so that IAM resources are recorded at most once per day in each Region.
    - id: b
      text:
        en: |-
          Record the global IAM resource types in only one supported Region, and exclude them from the recorders in the other seven Regions.
    - id: c
      text:
        en: |-
          Exclude the global IAM resource types from the recorders in all eight Regions, and use the IAM credential report for the history.
    - id: d
      text:
        en: |-
          Create an AWS Config aggregator in one Region so that the configuration items recorded in the eight Regions are merged into one copy.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS recommends recording the global IAM resource types once, in one supported Region, to avoid duplicate configuration items, unnecessary evaluations, and API throttling. The history is still complete because one Region records every change to these global resources.
  options:
    a:
      en: |-
        Daily recording still records the same global IAM resources in all eight Regions, so the duplicates and duplicate evaluations remain, and the history becomes less detailed.
    c:
      en: |-
        Excluding the types everywhere removes the IAM configuration history that the team still needs.
    d:
      en: |-
        An aggregator collects data from accounts and Regions for viewing; it does not stop the recorders from creating duplicate configuration items or evaluations.
references:
  - title: "Recording AWS Resources with AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/select-resources.html
