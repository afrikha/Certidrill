id: dopc02-5a-run-command-alarm-percentage
objective: "5.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company must apply a configuration change with Systems Manager Run Command to all Amazon EC2 instances tagged Tier=app. The number of tagged instances changes constantly because of Auto Scaling, from about 80 to about 400. The change must run on no more than 10 % of the tagged instances at a time. If the existing CloudWatch alarm on the application's error rate goes into the ALARM state during the rollout, no further instances may start the command.

    Which combination of settings will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the concurrency of the command to a percentage of 10 % of the targets.
    - id: b
      text:
        en: |-
          Set the concurrency of the command to a fixed number of 10 targets.
    - id: c
      text:
        en: |-
          Set the error threshold of the command to 0 so that it stops on the first failed invocation.
    - id: d
      text:
        en: |-
          Apply the error rate CloudWatch alarm to the command so that pending invocations do not run when the alarm activates.
    - id: e
      text:
        en: |-
          Register the command as a task of a maintenance window with a cutoff of 10 minutes.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      When targets are selected by tag and their number is uncertain, AWS recommends a percentage for concurrency, so 10 % always means 10 % of the current targets. A CloudWatch alarm applied to the command stops the rollout: when the alarm activates, pending command invocations do not run.
  options:
    b:
      en: |-
        A fixed number of 10 is far below 10 % when there are 400 instances and above it when there are fewer than 100.
    c:
      en: |-
        The error threshold reacts to failed command invocations, not to the application's error rate alarm.
    e:
      en: |-
        A maintenance window controls when tasks run; its cutoff does not stop the rollout when the alarm fires.
references:
  - title: "Running commands from the console - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-commands-console.html
