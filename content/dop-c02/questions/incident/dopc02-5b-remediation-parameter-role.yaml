id: dopc02-5b-remediation-parameter-role
objective: "5.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A DevOps engineer writes a custom Automation runbook that turns on server access logging for an Amazon S3 bucket. The runbook has two parameters: BucketName and AutomationAssumeRole. The engineer will attach the runbook to an AWS Config rule as an automatic remediation. Each execution must act on the bucket that the rule found noncompliant, and the runbook must be allowed to change the bucket's logging configuration.

    Which combination of steps should the engineer take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant the s3:PutBucketLogging permission to the AWS Config service-linked role so that AWS Config can change the bucket.
    - id: b
      text:
        en: |-
          Set BucketName to a static value that lists the names of all the buckets in the account.
    - id: c
      text:
        en: |-
          Map BucketName to the resource ID parameter so that AWS Config passes the ID of each noncompliant bucket at run time.
    - id: d
      text:
        en: |-
          Change the rule to a periodic trigger so that AWS Config passes the list of noncompliant buckets to the runbook.
    - id: e
      text:
        en: |-
          Pass in AutomationAssumeRole an IAM role that trusts ssm.amazonaws.com and allows the S3 actions that the runbook calls.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      When a parameter is mapped to the resource ID, AWS Config substitutes the ID of the noncompliant resource at run time, so each execution targets one bucket. Automation performs the changes with the assume role, which must trust the Systems Manager service and allow every API action that the runbook calls.
  options:
    a:
      en: |-
        The runbook does not run with the AWS Config service-linked role; it runs with the role passed in AutomationAssumeRole.
    b:
      en: |-
        A static value gives every execution the same input instead of the bucket that is noncompliant.
    d:
      en: |-
        The trigger type controls when the rule evaluates; AWS Config still starts one remediation per noncompliant resource and passes only the mapped parameters.
references:
  - title: Setting Up Auto Remediation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
  - title: Create the service roles for Automation using the console - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-setup-iam.html
