id: dopc02-5a-pipes-sqs-enrich-workflow
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer writes every order to an Amazon SQS queue. Only orders whose status field is PAID must be processed. Each paid order must first be enriched with customer data returned by the public HTTPS API of the company's SaaS CRM provider, and the enriched order must then start an execution of an AWS Step Functions state machine within seconds. The DevOps team does not want to write or maintain integration code for this flow, and it wants to pay only for the orders that are processed.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Lambda function with an event source mapping on the queue that skips unpaid orders, calls the CRM API, and starts the state machine with the enriched order.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule on the default event bus that matches messages of the queue with status PAID, with an input transformer that calls the CRM API and a state machine target.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge pipe with the queue as the source, a filter on status PAID, an API destination for the CRM API as the enrichment, and the state machine as the target.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge Scheduler schedule that starts the state machine every minute, and have the state machine receive messages from the queue and call the CRM API.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      EventBridge Pipes connects a source such as an SQS queue to a target for point-to-point integrations, with an optional filter, an optional enrichment step, and no integration code. An API destination can be the enrichment, events that do not match the filter are not processed, and only matching events are charged.
  options:
    a:
      en: |-
        This works, but the Lambda function is integration code that the team would have to write, deploy, and maintain.
    b:
      en: |-
        Messages in an SQS queue are not events on an event bus, so no rule can match them, and an input transformer only reshapes an event; it cannot call an API.
    d:
      en: |-
        A schedule that runs every minute does not start processing within seconds, and the polling and API calls must be designed and maintained in the state machine.
references:
  - title: "Amazon EventBridge Pipes - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes.html
  - title: "API destinations as targets in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-api-destinations.html
