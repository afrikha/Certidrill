id: dopc02-5b-reachability-blocking-component
objective: "5.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    After a network change, an application on an Amazon EC2 instance can no longer connect to a database instance in another subnet of the same VPC. The change touched security groups, network ACLs, and route tables, and the team does not know which component now blocks the traffic. The application is stopped, so no traffic is flowing. The team wants to identify the blocking component from the configuration, without generating test traffic.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on VPC Flow Logs for the subnet of the instance, and look for REJECT records between the two instances.
    - id: b
      text:
        en: |-
          Run Reachability Analyzer with the EC2 instance as the source and the database instance as the destination on the database port.
    - id: c
      text:
        en: |-
          Search the AWS CloudTrail event history for the API calls of the change, and review each modified rule.
    - id: d
      text:
        en: |-
          Configure VPC Traffic Mirroring from the instance's network interface to a monitoring appliance, and inspect the packets.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Reachability Analyzer is a configuration analysis tool that tests connectivity between a source and a destination in VPCs. When the destination is not reachable, it identifies the blocking component, such as a security group, network ACL, or route table.
  options:
    a:
      en: |-
        Flow Logs record only traffic that is actually sent, and the application is stopped; a REJECT record also does not name the rule that blocked it.
    c:
      en: |-
        CloudTrail lists every change, but the team would still have to work out by hand which of them blocks this path.
    d:
      en: |-
        Traffic Mirroring copies real packets, so it needs traffic to flow and does not analyze the configuration.
references:
  - title: What is Reachability Analyzer? - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html
