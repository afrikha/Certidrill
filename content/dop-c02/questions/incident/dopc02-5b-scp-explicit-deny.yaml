id: dopc02-5b-scp-explicit-deny
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A deployment pipeline in a workload account assumes a role named DeployRole that has the AdministratorAccess managed policy. Since this morning, the pipeline's AWS CloudFormation stack updates fail. The stack events show this message for an AWS Lambda function update: "User: arn:aws:sts::111122223333:assumed-role/DeployRole/pipeline is not authorized to perform: lambda:UpdateFunctionCode ... with an explicit deny in a service control policy". Nobody changed DeployRole or the pipeline.

    What is the root cause, and how should it be resolved?
body:
  options:
    - id: a
      text:
        en: |-
          DeployRole's identity-based policy does not allow the action; attach a policy that allows lambda:UpdateFunctionCode to the role.
    - id: b
      text:
        en: |-
          A permissions boundary on DeployRole denies the action; remove the boundary from the role in the workload account.
    - id: c
      text:
        en: |-
          An SCP that applies to the account denies the action; change the denying SCP statement from the management account.
    - id: d
      text:
        en: |-
          The function's resource-based policy denies DeployRole; add a statement to the function policy that allows the role to update the code.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Access denied messages name the type of policy that caused the denial, and "with an explicit deny in a service control policy" points to an SCP from AWS Organizations, often with the policy ARN. No permission granted inside the account can override an explicit deny in an SCP, so the fix is made where the SCPs are managed.
  options:
    a:
      en: |-
        AdministratorAccess already allows the action, and the message reports an explicit deny in an SCP, not a missing allow in an identity-based policy.
    b:
      en: |-
        A permissions boundary denial is reported as an explicit deny in a permissions boundary, not in a service control policy.
    d:
      en: |-
        A resource-based policy denial is reported as an explicit deny in a resource-based policy, and adding an allow cannot override an explicit deny.
references:
  - title: Troubleshoot access denied error messages - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied.html
