id: dopc02-5b-ecs-stopped-task-reasons
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tasks of an Amazon ECS service on AWS Fargate stop unexpectedly a few times each night, and the service scheduler replaces them. When the engineers check in the morning, the stopped tasks no longer appear in the ECS console, so they cannot see why the tasks stopped. The team wants the stop code and stopped reason of every stopped task to be kept for 30 days for analysis, without custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run aws ecs describe-tasks with the desired status STOPPED every morning to read the stop reasons of the night's tasks.
    - id: b
      text:
        en: |-
          Search the AWS CloudTrail event history every morning for StopTask calls, and read the stop reason in each event.
    - id: c
      text:
        en: |-
          Change the cluster settings so that the ECS console and the ECS API keep stopped tasks for 30 days.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule for ECS Task State Change events of stopped tasks that sends them to a log group with 30-day retention.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      ECS sends a task state change event to EventBridge when a task stops, and the event includes the stoppedReason and stopCode fields. Sending these events to a log group keeps every reason for the retention period, without code.
  options:
    a:
      en: |-
        Stopped tasks are kept only for a short time, and the console shows them for one hour, so a check in the morning misses the tasks that stopped during the night.
    b:
      en: |-
        CloudTrail records API calls; a task that stops because its essential container exits is not stopped by a StopTask call, and CloudTrail events do not carry the stop code of the task.
    c:
      en: |-
        There is no setting that extends how long stopped tasks are shown in the console.
references:
  - title: Amazon ECS task state change events - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs_task_events.html
  - title: Viewing Amazon ECS stopped task errors - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/stopped-task-errors.html
