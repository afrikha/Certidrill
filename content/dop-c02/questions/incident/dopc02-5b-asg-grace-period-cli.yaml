id: dopc02-5b-asg-grace-period-cli
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team creates an Auto Scaling group with the AWS CLI and attaches it to an Application Load Balancer target group, with ELB health checks turned on for the group. The application needs about 4 minutes after launch before it answers the target group's health check. The group never stabilizes: instances launch, are marked unhealthy and terminated after about one minute, and are replaced in a loop. The same configuration created earlier in the console worked. The group has no lifecycle hooks. Instances whose application stops answering must still be replaced automatically.

    What should the team do?
body:
  options:
    - id: a
      text:
        en: |-
          Set the health check grace period of the group to 300 seconds.
    - id: b
      text:
        en: |-
          Turn off ELB health checks for the group so that only the EC2 status checks decide instance health.
    - id: c
      text:
        en: |-
          Increase the deregistration delay of the target group to 300 seconds.
    - id: d
      text:
        en: |-
          Increase the healthy threshold of the target group's health check to 10 consecutive successes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The health check grace period defaults to 300 seconds in the console but to 0 seconds when a group is created with the AWS CLI or an SDK, which turns it off. Without it, the ELB health check marks the starting instances unhealthy and Auto Scaling replaces them; a grace period longer than the startup time stops the loop.
  options:
    b:
      en: |-
        EC2 status checks do not see an application that stops answering, so such instances would no longer be replaced.
    c:
      en: |-
        The deregistration delay applies to targets that are being removed, not to new instances that are starting.
    d:
      en: |-
        A higher healthy threshold makes it slower for an instance to be considered healthy; it does not protect it during startup.
references:
  - title: Set the health check grace period for an Auto Scaling group - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/health-check-grace-period.html
