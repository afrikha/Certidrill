id: dopc02-5b-spot-capacity-rebalancing
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs queue workers on Spot Instances in an Auto Scaling group that uses several instance types across three Availability Zones with the price-capacity-optimized allocation strategy. When a Spot Instance is interrupted, its worker often cannot finish the message it is processing, and the message is processed again later. A termination lifecycle hook with a 15-minute heartbeat timeout was added to let workers finish, but interrupted instances still stop working about two minutes after the interruption notice. The company wants workers on at-risk instances to have more time to finish, and wants replacement capacity to be launched automatically.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the heartbeat timeout of the termination lifecycle hook to one hour, and make the worker record a heartbeat every 10 minutes.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule for the Spot Instance interruption warning that invokes an AWS Lambda function to launch a replacement instance in the same Availability Zone.
    - id: c
      text:
        en: |-
          Turn on instance scale-in protection for every instance while its worker processes a message.
    - id: d
      text:
        en: |-
          Turn on Capacity Rebalancing for the Auto Scaling group so that it replaces Spot Instances that receive a rebalance recommendation before they are interrupted.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Amazon EC2 sends a rebalance recommendation when a Spot Instance is at elevated risk of interruption, and with Capacity Rebalancing the group launches a replacement and then terminates the at-risk instance, running the termination hook. The worker therefore usually gets more time than the two-minute interruption notice, and new capacity is launched without custom code.
  options:
    a:
      en: |-
        A lifecycle hook does not delay a Spot interruption, which comes with a two-minute notice, so a longer timeout does not give the worker more time.
    b:
      en: |-
        The interruption warning arrives two minutes before the interruption, so the worker gets no extra time, and the group already replaces interrupted capacity without custom code.
    c:
      en: |-
        Scale-in protection prevents scale-in terminations by the group, not interruptions of Spot capacity by Amazon EC2.
references:
  - title: Capacity Rebalancing in Auto Scaling to replace at-risk Spot Instances - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-capacity-rebalancing.html
  - title: Amazon EC2 Auto Scaling lifecycle hooks - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html
