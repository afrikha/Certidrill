id: dopc02-5a-asg-standby-troubleshoot
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application on 6 Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer, with Elastic Load Balancing health checks turned on for the group. One instance intermittently returns wrong responses, and an engineer needs about 1 hour to troubleshoot it in place. During that time, the instance must receive no user traffic, Auto Scaling must not terminate it, and the application must keep serving users with 6 instances.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Put the instance into the Standby state without decrementing the desired capacity, and exit the Standby state when the troubleshooting is complete.
    - id: b
      text:
        en: |-
          Put the instance into the Standby state and decrement the desired capacity, and exit the Standby state when the troubleshooting is complete.
    - id: c
      text:
        en: |-
          Suspend the HealthCheck process of the group while the engineer troubleshoots the instance, and resume it afterward.
    - id: d
      text:
        en: |-
          Turn on instance scale-in protection for the instance while the engineer troubleshoots it, and turn it off afterward.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An instance in Standby stays in the Auto Scaling group but is deregistered from the load balancer, and Auto Scaling does not run health checks on it. If the desired capacity is not decremented, Auto Scaling launches a replacement instance so that 6 instances keep serving traffic; exiting Standby registers the instance again.
  options:
    b:
      en: |-
        Decrementing the desired capacity prevents the launch of a replacement, so only 5 instances would serve users during the troubleshooting.
    c:
      en: |-
        Suspending HealthCheck keeps the instance from being marked unhealthy, but it stays registered with the load balancer and keeps receiving user traffic.
    d:
      en: |-
        Scale-in protection does not stop health check replacement, and the instance would keep receiving user traffic.
references:
  - title: "Temporarily remove instances from your Auto Scaling group - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-enter-exit-standby.html
