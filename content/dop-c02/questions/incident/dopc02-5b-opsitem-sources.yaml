id: dopc02-5b-opsitem-sources
objective: "5.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is adopting AWS Systems Manager OpsCenter as the single place where operators view, investigate, and resolve operational issues. The DevOps team wants OpsItems to be created automatically, without custom code, from the monitoring signals that the company already uses.

    Which sources can create OpsItems automatically in OpsCenter? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Amazon CloudWatch alarms that enter the ALARM state.
    - id: b
      text:
        en: |-
          AWS CloudTrail trails that deliver log files to Amazon S3.
    - id: c
      text:
        en: |-
          Amazon EventBridge rules that match events from AWS services.
    - id: d
      text:
        en: |-
          AWS Config aggregators that collect data from several accounts.
    - id: e
      text:
        en: |-
          Amazon CloudWatch Logs subscription filters on application log groups.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      CloudWatch can create an OpsItem when an alarm enters the ALARM state, and an EventBridge rule can create an OpsItem when it matches an event from an AWS service, such as an Auto Scaling launch failure or an AWS Health maintenance alert. OpsItems can also be created by CloudWatch Application Insights or manually.
  options:
    b:
      en: |-
        A trail stores API activity in S3 log files; it does not create OpsItems.
    d:
      en: |-
        An aggregator gives a read-only view of configuration and compliance data; it does not create OpsItems.
    e:
      en: |-
        Subscription filters stream log events to destinations such as Kinesis, Firehose, or Lambda; OpsCenter is not one of their destinations.
references:
  - title: AWS Systems Manager OpsCenter - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter.html
