id: dopc02-5a-refresh-replace-root-volume
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research company runs GPU instances in an Auto Scaling group that already uses a mixed instances policy with two GPU instance types and a numbered launch template version. GPU capacity in the Region is scarce, and each instance keeps a model cache on its instance store volumes that takes hours to rebuild. The security team has published a patched AMI, and the instances must boot from that AMI. The company wants to apply the AMI without launching new instances and without losing the instance store data or the instances' IP addresses.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a launch template version with the patched AMI, and start an instance refresh with that version and a minimum healthy percentage of 100.
    - id: b
      text:
        en: |-
          Use Run Command to install the same patches on the running instances, and update the launch template so that future instances use the patched AMI.
    - id: c
      text:
        en: |-
          Start an instance refresh with the ReplaceRootVolume strategy and a mixed instances policy whose overrides set the patched AMI ID for each instance type.
    - id: d
      text:
        en: |-
          Create a launch template version with the patched AMI, and start an instance refresh with skip matching so that only outdated instances are replaced.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With the ReplaceRootVolume strategy, an instance refresh replaces only the root EBS volume with one created from the specified AMI and keeps the instance running. Network interfaces and IP addresses, non-root EBS volumes, and instance store data are preserved, which avoids launching new instances. The strategy requires a mixed instances policy whose overrides set the ImageId and a numbered launch template version.
  options:
    a:
      en: |-
        A standard instance refresh launches new instances, which depends on scarce GPU capacity and loses the instance store cache and the IP addresses.
    b:
      en: |-
        Patching in place does not make the instances boot from the patched AMI, which the security team requires.
    d:
      en: |-
        Skip matching only avoids replacing instances that already match; every outdated instance would still be replaced by a new instance.
references:
  - title: "Replace root volumes during instance refresh - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/replace-root-volume.html
