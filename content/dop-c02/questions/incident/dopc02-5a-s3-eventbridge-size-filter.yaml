id: dopc02-5a-s3-eventbridge-size-filter
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company stores uploaded video files in an Amazon S3 bucket. Each new object must start three independent processes: a transcoding workflow only for objects whose key ends in .mov and whose size is larger than 1 GB, a metadata indexing service for every object, and an audit pipeline. The audit team also wants to keep the object creation events for 30 days so that it can resend them to the audit pipeline after a failure. The company wants to add or change consumers later without changing the bucket configuration, and it does not want to write routing code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on Amazon EventBridge for the bucket, create one rule per consumer with the key suffix and numeric size conditions it needs, and archive the Object Created events for 30 days.
    - id: b
      text:
        en: |-
          Configure three S3 event notifications on the bucket for s3:ObjectCreated:* events, each with a suffix filter where needed, that send the events to three Amazon SQS queues with a 14-day message retention period.
    - id: c
      text:
        en: |-
          Configure one S3 event notification on the bucket that sends s3:ObjectCreated:* events to an Amazon SNS topic, and subscribe the three consumers to the topic with subscription filter policies on the object key.
    - id: d
      text:
        en: |-
          Configure one S3 event notification on the bucket that invokes an AWS Lambda function, and have the function check the key and size and start the consumer that matches each object.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When EventBridge is turned on for a bucket, S3 sends all its supported events, including Object Created, to the default event bus, and rules route them to any number of targets. Rule patterns can match the key suffix and use numeric matching on the object size, consumers are added as rules without touching the bucket, and an archive keeps the events so that they can be replayed.
  options:
    b:
      en: |-
        S3 event notification filters support only key prefix and suffix, not object size, and each new consumer requires a change to the bucket's notification configuration. Queues also cannot resend a message after it has been consumed and deleted.
    c:
      en: |-
        An SNS topic keeps no copy of the events, so the audit team could not resend them later, and the size condition would have to be checked by the consumers.
    d:
      en: |-
        The Lambda function is custom routing code that the company would have to write and change for every new consumer, and it keeps no events for later replay.
references:
  - title: "Using EventBridge - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
  - title: "EventBridge event message structure - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/ev-events.html
