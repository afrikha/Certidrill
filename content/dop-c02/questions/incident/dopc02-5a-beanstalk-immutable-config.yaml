id: dopc02-5a-beanstalk-immutable-config
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application in an AWS Elastic Beanstalk environment with 8 instances behind a load balancer. The operations team must change the environment's instance type, which requires Elastic Beanstalk to replace all instances. During the change, the environment must keep its full serving capacity at all times. If the new instances fail their health checks, the existing instances must remain in service, untouched.

    Which rolling update setting should the team use for this configuration change?
body:
  options:
    - id: a
      text:
        en: |-
          RollingUpdateType set to Health, with MaxBatchSize set to 1 and MinInstancesInService set to 7.
    - id: b
      text:
        en: |-
          RollingUpdateType set to Time, with MaxBatchSize set to 2 and a PauseTime of 5 minutes between batches.
    - id: c
      text:
        en: |-
          RollingUpdateType set to Immutable, so that the change is applied to a fresh group of instances.
    - id: d
      text:
        en: |-
          RollingUpdateEnabled set to false, so that all instances are replaced at the same time.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      For configuration changes that replace instances, the Immutable rolling update type applies the change to a fresh group of instances. The existing instances keep serving at full capacity until the new ones are healthy, and if the new instances fail, the existing ones are not modified.
  options:
    a:
      en: |-
        A health-based rolling update terminates each batch before launching its replacement, so capacity drops by one instance at a time, and existing instances are already replaced when a later batch fails.
    b:
      en: |-
        A time-based rolling update also terminates batches before replacing them and does not wait for health, so capacity drops and unhealthy batches can continue.
    d:
      en: |-
        Replacing all instances at once removes the serving capacity during the change.
references:
  - title: "Elastic Beanstalk rolling environment configuration updates - AWS Elastic Beanstalk"
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.rollingupdates.html
