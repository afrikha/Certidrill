id: dopc02-5b-lambda-insights-memory
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs 40 AWS Lambda functions on the Python runtime, which uses Amazon Linux 2023. Some functions are intermittently slow, and the developers suspect memory pressure, CPU limits, or cold starts, but the standard Lambda metrics in Amazon CloudWatch do not show memory or CPU use. The DevOps team wants system-level metrics and cold start information for each function, with dashboards, without changing the function code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the CloudWatch Lambda Insights extension layer to the functions, and use the Lambda Insights dashboards in CloudWatch.
    - id: b
      text:
        en: |-
          Turn on CloudWatch Container Insights for the account so that it collects CPU and memory metrics for the Lambda execution environments.
    - id: c
      text:
        en: |-
          Turn on detailed monitoring for the functions so that Lambda publishes CPU and memory metrics every minute.
    - id: d
      text:
        en: |-
          Create metric filters on the function log groups for the words cold start and out of memory, and graph the resulting metrics.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Lambda Insights is a CloudWatch Lambda extension delivered as a layer that collects system-level metrics such as CPU time, memory, disk, and network, plus diagnostic information such as cold starts, for every invocation. It requires no code change and is supported on Amazon Linux 2 and Amazon Linux 2023 runtimes.
  options:
    b:
      en: |-
        Container Insights collects metrics for container platforms such as Amazon ECS and Amazon EKS, not for Lambda functions.
    c:
      en: |-
        Detailed monitoring is an Amazon EC2 feature; it is not a Lambda setting and does not add memory or CPU metrics for functions.
    d:
      en: |-
        Metric filters can only count text that appears in the logs; Lambda does not log these phrases for each cold start or memory issue, and the filters cannot produce CPU use or system-level metrics.
references:
  - title: Lambda Insights - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Lambda-Insights.html
