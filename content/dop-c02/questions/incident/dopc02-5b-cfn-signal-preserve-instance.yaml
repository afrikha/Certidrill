id: dopc02-5b-cfn-signal-preserve-instance
objective: "5.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A new AWS CloudFormation template creates an Amazon EC2 instance with a creation policy. The instance's user data runs cfn-init and then cfn-signal. Stack creation fails with the message that the instance did not receive the required number of signals, and CloudFormation rolls back and deletes the instance, so the engineers cannot see what happened on it. The template works in another Region with a different AMI. The engineers want to find the cause on the instance with the fewest changes to the template.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the Timeout of the creation policy to 2 hours, and create the stack again to give cfn-init more time.
    - id: b
      text:
        en: |-
          Read the stack events of the failed stack, because they include the output of the cfn-init commands.
    - id: c
      text:
        en: |-
          Run drift detection on the failed stack, and review the differences reported for the instance.
    - id: d
      text:
        en: |-
          Create the stack again with rollback on failure disabled, and read the cfn-init and cloud-init logs on the instance.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With rollback on failure disabled, CloudFormation does not delete the instance when the stack fails to create, so the engineers can log in to it. The cfn-init and cloud-init logs show whether the helper scripts exist on the new AMI and which step failed before cfn-signal ran.
  options:
    a:
      en: |-
        A longer timeout only delays the failure if the signal never arrives, and the rollback still deletes the instance.
    b:
      en: |-
        Stack events show the status reason, such as the missing signals, but not the output of the commands that ran on the instance.
    c:
      en: |-
        Drift detection compares resource configurations with the template; it does not show what happened inside the instance, and the instance no longer exists.
references:
  - title: Troubleshooting CloudFormation - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/troubleshooting.html
  - title: Choose how to handle failures when provisioning resources - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stack-failure-options.html
