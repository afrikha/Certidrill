id: dopc02-5a-asg-suspend-healthcheck-maintenance
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in an Auto Scaling group that uses Elastic Load Balancing health checks. Next Saturday, a planned 2-hour database migration will make the application's health check endpoint fail on every instance, although the instances themselves will stay intact. After the migration, the existing instances must continue to run without being replaced. The group's target tracking scaling policy must still be able to add instances if the load increases during the migration.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Suspend the Launch and Terminate processes of the group for the duration of the migration, and resume them when the migration is complete.
    - id: b
      text:
        en: |-
          Turn on instance scale-in protection for every instance in the group for the duration of the migration, and turn it off afterward.
    - id: c
      text:
        en: |-
          Suspend the HealthCheck process of the group for the duration of the migration, and resume it when the health checks pass again.
    - id: d
      text:
        en: |-
          Suspend the AZRebalance process of the group for the duration of the migration, and resume it when the migration is complete.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The HealthCheck process is the one that marks instances unhealthy when Amazon EC2 or Elastic Load Balancing reports them as unhealthy. While it is suspended, the failing health checks do not mark the instances unhealthy, so they are not replaced, and the other processes, including Launch for scale-out, keep working.
  options:
    a:
      en: |-
        Suspending Launch prevents the scaling policy from adding instances during the migration, which the requirements forbid.
    b:
      en: |-
        Scale-in protection does not protect instances from health check replacement, so the instances would still be terminated.
    d:
      en: |-
        AZRebalance only balances instances across Availability Zones; failing health checks would still lead to the instances being marked unhealthy and replaced.
references:
  - title: "Suspend and resume Amazon EC2 Auto Scaling processes - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-suspend-resume-processes.html
  - title: "Use instance scale-in protection to control instance termination - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-instance-protection.html
