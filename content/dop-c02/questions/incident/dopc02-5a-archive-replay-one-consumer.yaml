id: dopc02-5a-archive-replay-one-consumer
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company publishes shipment events from several producer applications to a custom event bus in Amazon EventBridge that uses rules and targets. Six rules on the bus deliver events to six consumer teams. When the bus was created, the DevOps team also created an archive on the bus with no event pattern and a 30-day retention period. Yesterday, a defective release of the billing team's AWS Lambda function, which is the target of the rule named billing-rule, processed every event between 09:00 and 15:00 UTC incorrectly but returned no errors. The function has been fixed. The billing team must reprocess the events from that period. The producers cannot publish the events again, and the other five consumers and their code must not be affected.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Configure a dead-letter queue on the target of billing-rule, and start a redrive of the dead-letter queue messages for the period to the fixed Lambda function.
    - id: b
      text:
        en: |-
          Start a replay from the archive for 09:00 to 15:00 UTC to the source event bus, and specify billing-rule as the only rule that receives the replayed events.
    - id: c
      text:
        en: |-
          Create a new event bus that contains a copy of billing-rule, and start a replay from the archive for 09:00 to 15:00 UTC to the new event bus.
    - id: d
      text:
        en: |-
          Start a replay from the archive for 09:00 to 15:00 UTC to all rules of the source event bus, and update the other consumers to drop events that contain the replay-name field.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An EventBridge archive keeps the events that the bus received, and a replay sends the events of a chosen time window back to the source event bus. A replay can be limited to specific rules on that bus, so only billing-rule delivers the replayed events to the fixed function and the other consumers see nothing.
  options:
    a:
      en: |-
        The function returned no errors, so the events were delivered successfully and never reached a dead-letter queue. A dead-letter queue configured now cannot hold events from yesterday.
    c:
      en: |-
        Archived events can be replayed only to the event bus that the archive was created on, not to another bus.
    d:
      en: |-
        This works only by changing the code of five other consumers, which the requirements forbid, and adds overhead that a replay limited to billing-rule avoids.
references:
  - title: "Archiving and replaying events in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-archive.html
