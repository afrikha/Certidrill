id: dopc02-5b-scaling-activity-history
objective: "5.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's Auto Scaling group did not reach its desired capacity during a traffic peak last night. The group's desired capacity rose from 4 to 10 instances, but only 6 instances were running at the peak. An engineer must find out why Amazon EC2 Auto Scaling did not launch the other instances.

    Where should the engineer look first?
body:
  options:
    - id: a
      text:
        en: |-
          The system logs of the running instances, which record why their peers failed to start.
    - id: b
      text:
        en: |-
          The CPUUtilization metric of the group in Amazon CloudWatch, which shows whether the new instances were overloaded.
    - id: c
      text:
        en: |-
          The AWS Config configuration timeline of the launch template, which shows the launch errors of each version.
    - id: d
      text:
        en: |-
          The scaling activities of the Auto Scaling group, which include a status message for each failed launch.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Amazon EC2 Auto Scaling records an activity for every launch and termination, and a failed launch carries an error message such as insufficient capacity, a missing security group, or a KMS key problem. The activity history, also available with describe-scaling-activities, is the first place to read why instances were not launched.
  options:
    a:
      en: |-
        The instances that failed never started, and running instances do not log the launches of other instances.
    b:
      en: |-
        A metric shows load on the running instances, not why the missing ones never launched.
    c:
      en: |-
        AWS Config records configuration changes of the launch template, not the errors of launch attempts.
references:
  - title: "Troubleshoot Amazon EC2 Auto Scaling: EC2 instance launch failures - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ts-as-instancelaunchfailure.html
