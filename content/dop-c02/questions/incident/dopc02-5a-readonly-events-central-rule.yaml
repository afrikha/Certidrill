id: dopc02-5a-readonly-events-central-rule
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security team wants to detect reconnaissance activity. It must be alerted when a role named ci-deployer calls any List or Describe API in any of the company's 30 accounts. An organization trail logs all management events, read and write. In each account, a rule on the default event bus forwards AWS API Call via CloudTrail events to a central event bus in the Security account, and these forwarding rules are in the ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS state. On the central bus, a new rule in the default ENABLED state matches the ci-deployer role and List or Describe event names. Write events from the forwarding rules already trigger other rules on the central bus, but the new rule never fires.

    What should the DevOps engineer do to make the new rule fire?
body:
  options:
    - id: a
      text:
        en: |-
          Add data event selectors to the organization trail so that List and Describe calls are recorded as data events.
    - id: b
      text:
        en: |-
          Set the state of the rule on the central bus to ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS.
    - id: c
      text:
        en: |-
          Change the forwarding rules in each account back to the ENABLED state so that they forward all management events.
    - id: d
      text:
        en: |-
          Create the detection rule on the default event bus of the Security account instead of on the central bus.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      List and Describe calls are read-only management events, which only rules in the ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS state match. When read-only events are forwarded to another bus, both the forwarding rule on the default bus and the rule on the destination bus need that state, and here only the forwarding rules have it.
  options:
    a:
      en: |-
        List and Describe calls are management events, and the trail already logs read events; data event selectors would not change how the central rule matches them.
    c:
      en: |-
        A rule in the ENABLED state does not match read-only management events, so this change would stop forwarding them at all.
    d:
      en: |-
        The forwarded events arrive on the central bus, not on the Security account's default bus, so a rule there would see none of them.
references:
  - title: "AWS service events delivered via AWS CloudTrail - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
