id: dopc02-5a-asg-maintenance-launch-before
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a licensing service on two On-Demand Amazon EC2 instances in an Auto Scaling group with a minimum, maximum, and desired capacity of 2. When an instance fails its health check, Auto Scaling terminates it and launches a replacement at the same time, and the service runs on a single instance for several minutes, which causes errors at peak times. The company wants at least 2 healthy instances at all times when an instance is replaced, and it does not want to pay for a third instance permanently.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set an instance maintenance policy on the group with a minimum healthy percentage of 100 and a maximum healthy percentage of 200.
    - id: b
      text:
        en: |-
          Set an instance maintenance policy on the group with a minimum healthy percentage of 0 and a maximum healthy percentage of 100.
    - id: c
      text:
        en: |-
          Turn on Capacity Rebalancing for the group so that Auto Scaling launches a new instance before it terminates an unhealthy one.
    - id: d
      text:
        en: |-
          Increase the health check grace period of the group so that Auto Scaling waits longer before it replaces an unhealthy instance.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      By default, a health check failure is handled by terminating and launching at the same time. An instance maintenance policy with a minimum healthy percentage of 100 and a maximum above 100 makes Auto Scaling launch the replacement first and terminate the unhealthy instance only when the new one is ready, so the group temporarily grows instead of shrinking.
  options:
    b:
      en: |-
        These values describe the terminate-and-launch behavior, which lets capacity drop below the desired capacity during a replacement.
    c:
      en: |-
        Capacity Rebalancing replaces Spot Instances that receive a rebalance recommendation; it does not change how unhealthy On-Demand instances are replaced.
    d:
      en: |-
        The grace period only delays the first health check of new instances; the unhealthy instance would still be terminated before its replacement is ready.
references:
  - title: "Instance maintenance policy for Auto Scaling group - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/instance-maintenance-policy-overview-and-considerations.html
  - title: "Instance maintenance policies - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-instance-maintenance-policy.html
