id: dopc02-5b-eks-node-join-access-entry
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team adds self-managed Amazon EC2 nodes to an Amazon EKS cluster that uses access entries for authentication. The nodes start and the bootstrap script runs with the correct cluster name, but the nodes never appear in kubectl get nodes. The nodes are in private subnets with a route to a NAT gateway and can reach the cluster endpoint. The engineers attached the AmazonEKSWorkerNodePolicy to the node IAM role and created an access entry with the ARN of the instance profile of the nodes.

    What should the team do so that the nodes join the cluster?
body:
  options:
    - id: a
      text:
        en: |-
          Attach the AmazonEKSClusterPolicy managed policy to the node IAM role so that the nodes can register with the cluster.
    - id: b
      text:
        en: |-
          Create the access entry with the ARN of the node IAM role instead of the ARN of the instance profile.
    - id: c
      text:
        en: |-
          Move the nodes to public subnets so that they can reach the cluster endpoint through its public address.
    - id: d
      text:
        en: |-
          Add the instance profile ARN to the cluster's security group so that the kubelet can authenticate.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The kubelet authenticates with the credentials of the node's IAM role, so the access entry, or the aws-auth mapping on clusters that use it, must name the node IAM role ARN, not the instance profile ARN. Without a matching entry, the nodes cannot register with the cluster.
  options:
    a:
      en: |-
        AmazonEKSClusterPolicy is for the cluster role used by the EKS control plane; it does not map the nodes' identity in the cluster.
    c:
      en: |-
        The nodes already reach the endpoint through the NAT gateway, so moving them to public subnets does not fix the authentication.
    d:
      en: |-
        Security groups control network traffic by IP address and port; they cannot contain IAM ARNs or authenticate a principal.
references:
  - title: Troubleshoot problems with Amazon EKS clusters and nodes - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/troubleshooting.html
