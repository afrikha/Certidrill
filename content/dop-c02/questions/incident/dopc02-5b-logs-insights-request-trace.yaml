id: dopc02-5b-logs-insights-request-trace
objective: "5.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon API Gateway REST API invokes three AWS Lambda functions in sequence, and each function writes JSON logs that include a requestId field to its own Amazon CloudWatch Logs log group. A customer reports a failed request from 2 hours ago and provides its request ID. The on-call engineer must see every log line for that request from the three functions, in time order, as quickly as possible.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a metric filter on each log group that matches the request ID, and graph the three metrics on one dashboard.
    - id: b
      text:
        en: |-
          Run one CloudWatch Logs Insights query on the three log groups that filters on the request ID and sorts the results by timestamp.
    - id: c
      text:
        en: |-
          Start a CloudWatch Logs Live Tail session on the three log groups with a filter on the request ID.
    - id: d
      text:
        en: |-
          Export the three log groups to Amazon S3, create an Amazon Athena table on the export, and query it for the request ID.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudWatch Logs Insights queries several log groups at once and automatically discovers the fields of JSON log events. One query that filters on requestId and sorts by @timestamp returns the request's lines from all three functions in order.
  options:
    a:
      en: |-
        Metric filters apply only to events ingested after they are created, and they produce counts, not the log lines.
    c:
      en: |-
        Live Tail streams new log events as they arrive, so it does not show events from 2 hours ago.
    d:
      en: |-
        An export and an Athena table work but take far longer to set up than a direct query of the log groups.
references:
  - title: Analyzing log data with CloudWatch Logs Insights - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/AnalyzingLogData.html
