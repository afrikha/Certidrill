id: dopc02-5b-flow-logs-nacl-reply
objective: "5.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Partners report that they cannot reach a company's API, which runs on an Amazon EC2 instance in a public subnet. VPC Flow Logs are enabled on the instance's network interface. For a partner's IP address, each connection attempt produces two records: an ACCEPT record for traffic from the partner to the instance on TCP port 443, and a REJECT record for traffic from the instance's port 443 back to the partner's ephemeral port. The instance's security group allows inbound TCP 443 from the partner's range and has no outbound rules.

    What is the cause of the failure?
body:
  options:
    - id: a
      text:
        en: |-
          The network ACL of the subnet does not allow outbound traffic to the partner on the ephemeral port range.
    - id: b
      text:
        en: |-
          The security group has no outbound rule, so the responses from the instance to the partner are dropped.
    - id: c
      text:
        en: |-
          The route table of the subnet has no route back to the partner's network, so the response is rejected.
    - id: d
      text:
        en: |-
          The application on the instance refuses the connection, so VPC Flow Logs records the response as REJECT.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Security groups are stateful, so the response to an allowed inbound request is allowed whatever the outbound rules are. Network ACLs are stateless: an ACCEPT for the request followed by a REJECT for the reply shows that the subnet's network ACL blocks the return traffic, which goes to the client's ephemeral port.
  options:
    b:
      en: |-
        A security group allows the response to an allowed request automatically, even without any outbound rule.
    c:
      en: |-
        REJECT means that a security group or network ACL did not allow the traffic, and the record pair shows the request reaching the instance and the reply being dropped by a stateless rule.
    d:
      en: |-
        Flow Logs record whether security groups and network ACLs allowed the traffic, not whether the application accepted the connection.
references:
  - title: Flow log record examples - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-records-examples.html
