id: dopc02-5b-asg-pending-wait-stuck
objective: "5.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During a scale-out, new instances of an Auto Scaling group stay in the Pending:Wait state for about an hour and are then terminated, so the group never reaches its desired capacity. The instances pass their EC2 status checks, and the user data finishes successfully. The group has a launch lifecycle hook whose default result is ABANDON, and an Amazon EventBridge rule starts a configuration runbook for each lifecycle action.

    What is the most likely cause?
body:
  options:
    - id: a
      text:
        en: |-
          The health check grace period is too short, so the instances are marked unhealthy before they finish booting.
    - id: b
      text:
        en: |-
          Nothing completes the lifecycle action, so the hook times out and its ABANDON default result terminates the instances.
    - id: c
      text:
        en: |-
          The group has reached its maximum capacity, so the new instances cannot be put in service.
    - id: d
      text:
        en: |-
          The warm pool of the group is full, so the new instances wait until a pool instance is released.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A launch hook holds the instance in Pending:Wait until a lifecycle action result is sent or the timeout, one hour by default, expires. Because the runbook never completes the action, the timeout applies the default result, and ABANDON terminates and replaces the instance; check the runbook executions and the permission to call complete-lifecycle-action.
  options:
    a:
      en: |-
        Health checks and the grace period apply after the instance is in service, and these instances never leave Pending:Wait.
    c:
      en: |-
        At maximum capacity, the group does not launch more instances; these instances were launched and are waiting on the hook.
    d:
      en: |-
        A warm pool provides pre-initialized instances; it does not hold newly launched instances in Pending:Wait.
references:
  - title: Amazon EC2 Auto Scaling lifecycle hooks - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html
