id: dopc02-5b-logs-insights-pattern
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After a release, the error rate of a service rises. Its Amazon CloudWatch Logs log group receives thousands of ERROR lines per hour, but almost every line is unique because the messages contain order IDs, timestamps, and durations. A DevOps engineer must quickly find which kinds of error messages appeared after the release and what share of the error lines each kind represents, without knowing the message formats in advance.

    Which CloudWatch Logs Insights query should the engineer run?
body:
  options:
    - id: a
      text:
        en: |-
          filter @message like /ERROR/ | stats count(*) by @message | sort count(*) desc
    - id: b
      text:
        en: |-
          filter @message like /ERROR/ | stats count(*) by bin(5m) | sort @timestamp desc
    - id: c
      text:
        en: |-
          filter @message like /ERROR/ | pattern @message
    - id: d
      text:
        en: |-
          filter @message like /ERROR/ | dedup @message | limit 100
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The pattern command clusters log events into recurring text structures and replaces the variable parts with tokens. For each pattern it returns the number of matching events and their ratio, so the engineer sees each kind of error and its share without writing parsing rules.
  options:
    a:
      en: |-
        Grouping by the full message gives almost one group per line, because the IDs and durations make each message unique.
    b:
      en: |-
        This shows how the error count changes over time but not which kinds of errors occur.
    d:
      en: |-
        Removing duplicate messages still returns unique lines, so nothing is grouped and no share is computed.
references:
  - title: pattern - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-Pattern.html
