id: dopc02-5b-remediation-approval-step
objective: "5.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an AWS Config rule in one account and AWS Region to detect Amazon RDS DB instances that are publicly accessible. Changing a DB instance can affect running applications, so the security team must approve every fix. When a DB instance becomes noncompliant, a remediation must start automatically and notify the security team, and the DB instance must not be modified until a member of the security team approves. Every approval and change must be recorded. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Associate a custom Automation runbook with the rule as an automatic remediation. Make its first step aws:approve with the security team's IAM role as approver and an Amazon SNS topic for notification, followed by a step that turns off public access.
    - id: b
      text:
        en: |-
          Configure a manual remediation on the rule with an Automation runbook that turns off public access, and ask the security team to review the rule every day and start the remediation for each DB instance it approves.
    - id: c
      text:
        en: |-
          Create an AWS Systems Manager Change Manager change template with the security team as approvers, and create a change request from an Amazon EventBridge rule for each noncompliant DB instance.
    - id: d
      text:
        en: |-
          Configure an automatic remediation with an Automation runbook that turns off public access, and set MaximumAutomaticAttempts to 1 so that the security team can review each execution.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The aws:approve action pauses the automation until the designated principals approve or reject it and can notify them through an SNS topic. AWS Config starts the runbook automatically, nothing changes before approval, and the execution history records the approval and the change.
  options:
    b:
      en: |-
        A manual remediation does not start automatically or notify anyone, and a daily review adds manual work and delay.
    c:
      en: |-
        Change Manager has been closed to new customers since November 7, 2025, and the design needs extra components that AWS Config remediation already provides.
    d:
      en: |-
        The number of attempts only limits retries; the DB instance is still modified without any approval.
references:
  - title: "aws:approve – Pause an automation for manual approval - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-approve.html
  - title: Setting Up Auto Remediation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
