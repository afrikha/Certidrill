id: dopc02-5a-config-advanced-query-aggregator
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 60 AWS accounts in AWS Organizations and uses AWS Config in four Regions. An organization-wide aggregator already exists in the Audit account. During a cost review, the finance team asks for a list, within the hour, of every Amazon EBS volume in every account and Region whose state is available, which means that it is not attached to any instance. The DevOps team must not deploy anything new into the member accounts.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the ec2-volume-inuse-check AWS Config managed rule to all accounts as an organization rule, and export the noncompliant volumes from the aggregator.
    - id: b
      text:
        en: |-
          Run an AWS Config advanced query against the aggregator in the Audit account that selects EBS volumes whose state is available.
    - id: c
      text:
        en: |-
          Configure a delivery channel in every account to export configuration snapshots to Amazon S3, and query the snapshots with Amazon Athena.
    - id: d
      text:
        en: |-
          Use AWS Systems Manager Inventory in each account to list the attached volumes of each managed node, and compare the results with the list of volumes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Config advanced queries use a subset of SQL SELECT syntax to query the current configuration of resources by their properties, and they can run from a central account across all accounts and Regions of an aggregator. One query that filters EBS volumes on their state returns the list immediately without deploying anything.
  options:
    a:
      en: |-
        An organization rule deploys new rules into the member accounts, which the requirements forbid, and it is more work than one query.
    c:
      en: |-
        Configuring delivery channels in every account deploys new configuration into the member accounts and takes far longer than an advanced query.
    d:
      en: |-
        Inventory is collected from managed nodes and does not list unattached volumes, and the comparison would be manual work in 60 accounts.
references:
  - title: "Querying the Current Configuration State of AWS Resources with AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/querying-AWS-resources.html
