id: dopc02-5a-quick-setup-agent-missing
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deployed a Systems Manager Quick Setup host management configuration from its management account to the entire organization, with the options to update SSM Agent every two weeks and collect inventory every 30 minutes. Default Host Management Configuration is turned on in every account and Region, and all instances can reach the Systems Manager endpoints. Weeks later, about 60 instances launched from a custom hardened Linux AMI still do not appear as managed nodes in Fleet Manager, while instances launched from Amazon Linux AMIs do.

    What should the DevOps engineer do to make these instances managed nodes?
body:
  options:
    - id: a
      text:
        en: |-
          Edit the Quick Setup configuration to also select the option to update the EC2 launch agent every 30 days, and redeploy it to the organization.
    - id: b
      text:
        en: |-
          Install SSM Agent on the instances, for example by adding it to the custom AMI and to the launch user data, so that they can register with Systems Manager.
    - id: c
      text:
        en: |-
          Attach an instance profile with the AmazonSSMManagedInstanceCore policy to the instances so that Systems Manager can manage them without the agent.
    - id: d
      text:
        en: |-
          Wait for the next two-week agent update cycle of the Quick Setup configuration, which installs SSM Agent on the instances that do not have it.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Quick Setup's agent option updates SSM Agent where it is already present; it does not install the agent on instances where it is missing. A node becomes managed only when SSM Agent is running on it, so the agent must be installed on the hardened AMI's instances, while Default Host Management Configuration already provides the permissions.
  options:
    a:
      en: |-
        The launch agent option updates existing EC2 launch agents such as cloud-init; it does not install SSM Agent.
    c:
      en: |-
        Permissions are already provided by Default Host Management Configuration, and no permission makes an instance managed without SSM Agent running on it.
    d:
      en: |-
        Quick Setup doesn't install the agent on instances where it's not already present, so the update cycle would never fix these instances.
references:
  - title: "Set up Amazon EC2 host management using Quick Setup - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/quick-setup-host-management.html
  - title: "Automating updates to SSM Agent - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/ssm-agent-automatic-updates.html
