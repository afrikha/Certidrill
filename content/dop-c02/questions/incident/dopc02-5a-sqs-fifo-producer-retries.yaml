id: dopc02-5a-sqs-fifo-producer-retries
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment service sends a message to an Amazon SQS standard queue for each payment, and a legacy settlement application processes the queue. When the payment service does not receive a response in time, it retries the send, and some payments are then settled twice. The settlement application cannot be changed to detect duplicates. Each payment has a unique payment ID, and retries always happen within 1 minute of the first attempt.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the visibility timeout of the queue so that the settlement application has more time to process and delete each message before it becomes visible again.
    - id: b
      text:
        en: |-
          Move to an SQS FIFO queue, and have the payment service set the message deduplication ID of each message to a new random value for every send attempt.
    - id: c
      text:
        en: |-
          Turn on long polling for the queue so that the settlement application receives each message only once from the queue.
    - id: d
      text:
        en: |-
          Move to an SQS FIFO queue, and have the payment service set the message deduplication ID of each message to the payment ID.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      In a FIFO queue, a message deduplication ID ensures that, within a 5-minute deduplication window, a message sent again with the same ID is acknowledged but not delivered. Using the payment ID makes every retry of the same payment a duplicate that SQS discards, since retries happen within 1 minute.
  options:
    a:
      en: |-
        The duplicates are created by the producer's retries, which are separate messages; a longer visibility timeout only affects redelivery of one received message.
    b:
      en: |-
        A new random ID for each attempt makes every retry look like a new message, so the duplicates would still be delivered.
    c:
      en: |-
        Long polling reduces empty responses; it does not remove separate messages that the producer sent twice.
references:
  - title: "Using the message deduplication ID in Amazon SQS - Amazon Simple Queue Service"
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/using-messagededuplicationid-property.html
