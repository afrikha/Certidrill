id: dopc02-5b-health-opsitem-runbook
objective: "5.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company receives AWS Health scheduled maintenance events for Amazon EC2 instances that run stateful workloads. Because each workload has its own business constraints, an engineer must decide when to act on each event. The operations team wants every such event to create a work item that can be assigned and tracked to resolution, and engineers must be able to stop and start the affected instance from that work item when they choose. AWS Systems Manager Incident Manager is not available to the company, and the company wants no custom code.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule for AWS Health scheduledChange events of the EC2 service that creates an OpsItem in AWS Systems Manager OpsCenter.
    - id: b
      text:
        en: |-
          Create an Amazon CloudWatch alarm on the StatusCheckFailed_System metric of each instance that creates an OpsItem when it enters the ALARM state.
    - id: c
      text:
        en: |-
          Have the engineers run an Automation runbook that stops and starts the instance from the Runbooks section of the OpsItem's related resource.
    - id: d
      text:
        en: |-
          Send the AWS Health events to an Amazon SNS topic with an email subscription, and track the work items in a shared spreadsheet.
    - id: e
      text:
        en: |-
          Create an Amazon EventBridge rule for the same events that starts an Automation runbook to stop and start the instance immediately.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      OpsCenter creates OpsItems from EventBridge events, including AWS Health maintenance alerts, and OpsItems have a status that teams track to resolution. Each OpsItem includes a Runbooks section from which an engineer runs an Automation runbook on a related resource at the time they choose.
  options:
    b:
      en: |-
        A failed system status check happens after hardware fails; it does not track the scheduled event before the maintenance.
    d:
      en: |-
        Email and a spreadsheet give no tracked work item linked to the resource and no way to run the fix from it.
    e:
      en: |-
        An immediate automatic restart removes the engineer's decision about when to act, which each workload requires.
references:
  - title: AWS Systems Manager OpsCenter - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter.html
