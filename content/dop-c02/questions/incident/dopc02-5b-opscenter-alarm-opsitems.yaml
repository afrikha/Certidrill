id: dopc02-5b-opscenter-alarm-opsitems
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's operations team receives Amazon CloudWatch alarm emails for its Amazon EC2 and Amazon EBS resources. The emails give no context, and engineers spend time finding the affected resources and the fix. The team wants every critical alarm to open a work item that lists the related resources, can be assigned and tracked to resolution, and offers Systems Manager Automation runbooks that engineers can run on the affected resource from the work item. The company is a new customer of AWS Systems Manager and wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create AWS Systems Manager Incident Manager response plans for the critical alarms, with runbooks attached to each plan.
    - id: b
      text:
        en: |-
          Subscribe an AWS Lambda function to the alarm topic that creates a ticket in a self-hosted tracking tool with the alarm details and a list of runbook names.
    - id: c
      text:
        en: |-
          Add the critical alarms to a CloudWatch dashboard with links to the Automation runbooks, and keep the email notifications for assignment.
    - id: d
      text:
        en: |-
          Configure the critical alarms to create OpsItems in AWS Systems Manager OpsCenter, and have engineers run the suggested Automation runbooks from each OpsItem.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CloudWatch alarms can create an OpsItem in OpsCenter when they enter the ALARM state, and existing alarms can be edited to do so. Each OpsItem tracks status and related resources and has a Runbooks section from which engineers run Automation runbooks on a resource.
  options:
    a:
      en: |-
        Incident Manager has been closed to new customers since November 7, 2025, so a new customer cannot adopt it.
    b:
      en: |-
        A custom function and a self-hosted tool add code and infrastructure to maintain, while OpsCenter provides these features.
    c:
      en: |-
        A dashboard does not create work items that can be assigned and tracked to resolution.
references:
  - title: Configure CloudWatch alarms to create OpsItems - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-create-OpsItems-from-CloudWatch-Alarms.html
  - title: AWS Systems Manager Incident Manager - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/incident-manager.html
