id: dopc02-5a-refresh-checkpoints-validation
objective: "5.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs 50 Amazon EC2 instances in an Auto Scaling group and has created a new launch template version with an updated AMI. The release process requires the instances to be replaced in phases: after 20 % and after 50 % of the instances are new, the replacement must pause for 30 minutes so that testers can validate the application, and then all instances must be replaced. The testers must be notified automatically each time a pause begins. The company wants to use managed features only.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Start an instance refresh with checkpoint percentages of 20, 50, and 100, and a checkpoint delay of 1,800 seconds.
    - id: b
      text:
        en: |-
          Start an instance refresh with checkpoint percentages of 20 and 50, and a checkpoint delay of 1,800 seconds.
    - id: c
      text:
        en: |-
          Start an instance refresh with a minimum healthy percentage of 20, and resume it manually after the testers finish each validation.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule that matches the instance refresh checkpoint events of the group and targets an Amazon SNS topic for the testers.
    - id: e
      text:
        en: |-
          Add a launch lifecycle hook with a heartbeat timeout of 30 minutes, and have the testers complete the lifecycle action of each new instance.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Checkpoints make an instance refresh pause when a given percentage of instances is new, and the checkpoint delay sets how long it waits before it continues. Auto Scaling emits an event for each checkpoint except the 100 percent one, so an EventBridge rule can notify the testers through SNS. The last checkpoint must be 100 for all instances to be replaced.
  options:
    b:
      en: |-
        If the last checkpoint is below 100, the refresh stops replacing instances at that checkpoint and does not continue to 100 percent.
    c:
      en: |-
        The minimum healthy percentage controls how many instances can be replaced at once; it does not pause the refresh at given phases.
    e:
      en: |-
        A lifecycle hook pauses each instance, not the refresh at 20 and 50 percent, and the testers would have to act on 50 instances one by one.
references:
  - title: "Add checkpoints to an instance refresh - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-adding-checkpoints-instance-refresh.html
