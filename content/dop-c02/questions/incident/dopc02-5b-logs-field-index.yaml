id: dopc02-5b-logs-field-index
objective: "5.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's microservices write JSON logs to about 600 Amazon CloudWatch Logs log groups whose names start with /prod/. During incidents, engineers run CloudWatch Logs Insights queries across these log groups to find all events with a given transactionId. The queries scan several terabytes, take minutes, and generate high charges, although each transaction appears in only a few hundred events. The company wants these lookups to scan less data and return faster for new logs, without changing the applications or the log group structure.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a metric filter on each log group with transactionId as a dimension, and query the metrics instead of the logs.
    - id: b
      text:
        en: |-
          Move the log groups to the Infrequent Access log class so that the queries scan less data.
    - id: c
      text:
        en: |-
          Change the queries to use the pattern command on transactionId so that matching events are clustered before they are scanned.
    - id: d
      text:
        en: |-
          Create a field index policy for transactionId, and query with filterIndex across the log groups selected by the /prod/ prefix.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A field index lets Logs Insights skip events that are known not to contain the indexed value, which reduces the data scanned and returns results faster for equality searches on high-cardinality fields such as transaction IDs. filterIndex can query many log groups selected by name prefix; only events ingested after the policy is created are indexed, which fits the requirement for new logs.
  options:
    a:
      en: |-
        A metric dimension with one value per transaction creates very high-cardinality metrics and returns counts, not the log events.
    b:
      en: |-
        The log class changes the price and features of a log group; it does not make a query scan less data for the same events.
    c:
      en: |-
        pattern clusters the events that the query has already read; it does not reduce the data scanned.
references:
  - title: Create field indexes to improve query performance and reduce scan volume - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs-Field-Indexing.html
