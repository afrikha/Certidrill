id: dopc02-5b-remediation-exception-stop
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Config rule checks that Amazon S3 buckets have server access logging turned on. The rule has an automatic remediation with a custom Automation runbook, MaximumAutomaticAttempts set to 3, and RetryAttemptSeconds set to 600. A bug in the runbook made it fail within seconds on one bucket. Within 10 minutes, three remediation executions failed on that bucket. Since then, AWS Config has not started another remediation for the bucket, although the bucket is still NON_COMPLIANT and other buckets are still remediated.

    What is the reason for this behavior?
body:
  options:
    - id: a
      text:
        en: |-
          AWS Config disables automatic remediation for the whole rule after a remediation execution fails, until an operator turns it back on.
    - id: b
      text:
        en: |-
          AWS Config remediates a resource only when its configuration changes, and the bucket's configuration has not changed since the last failure.
    - id: c
      text:
        en: |-
          The rule's assume role lost its permissions after the third failure, so AWS Config can no longer start the runbook for that bucket.
    - id: d
      text:
        en: |-
          The three attempts failed within the 600-second window, so AWS Config added a remediation exception for the bucket.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      RetryAttemptSeconds is the window that AWS Config uses to decide whether to stop retrying. When MaximumAutomaticAttempts attempts are made within that window, AWS Config adds a remediation exception to the resource to prevent infinite remediation attempts, while the other resources of the rule are still remediated.
  options:
    a:
      en: |-
        The exception applies to the resource whose remediation kept failing, not to the rule; the other buckets are still being remediated.
    b:
      en: |-
        Automatic remediation retries failed executions without a new configuration change, up to the configured number of attempts.
    c:
      en: |-
        Failed executions do not change IAM permissions; the runbook failed because of its own bug.
references:
  - title: RemediationConfiguration - AWS Config
    url: https://docs.aws.amazon.com/config/latest/APIReference/API_RemediationConfiguration.html
