id: dopc02-5b-health-scheduled-pattern
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon EventBridge rule with the pattern {"source": ["aws.health"]} sends every AWS Health event of a company's account to an AWS Lambda function that plans maintenance work. The function now receives operational issues, account notifications, and events for many services, and the team spends time discarding them. The function must receive only events that announce upcoming planned changes to the company's Amazon EC2 resources, and the team does not want to add filtering code to the function.

    How should the DevOps engineer change the rule?
body:
  options:
    - id: a
      text:
        en: |-
          Add "detail": {"service": ["EC2"], "eventTypeCategory": ["scheduledChange"]} to the event pattern.
    - id: b
      text:
        en: |-
          Add "detail": {"service": ["EC2"], "eventTypeCategory": ["issue"]} to the event pattern.
    - id: c
      text:
        en: |-
          Change the detail-type in the event pattern to AWS Health Abuse Event, and add "detail": {"service": ["EC2"]}.
    - id: d
      text:
        en: |-
          Add "detail": {"service": ["EC2"], "statusCode": ["closed"]} to the event pattern.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS Health events carry the affected service and an event type category, which is issue, accountNotification, investigation, or scheduledChange. Matching the EC2 service and the scheduledChange category in the pattern sends only planned changes, such as instance retirement, to the function.
  options:
    b:
      en: |-
        The issue category is for service issues, not for planned changes.
    c:
      en: |-
        AWS Health Abuse Event is the detail type for abuse reports, not for maintenance or other planned changes.
    d:
      en: |-
        A closed status code means that the event has ended, so the function would receive past events of every category instead of upcoming changes.
references:
  - title: "Reference: AWS Health events Amazon EventBridge schema - AWS Health"
    url: https://docs.aws.amazon.com/health/latest/ug/aws-health-events-eventbridge-schema.html
