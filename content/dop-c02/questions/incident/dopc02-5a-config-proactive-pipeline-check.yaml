id: dopc02-5a-config-proactive-pipeline-check
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys infrastructure with AWS CloudFormation from a CI/CD pipeline. AWS Config managed rules in detective mode report noncompliant resources, but only after the resources have been provisioned, and the security team then has to ask for fixes. The team wants the pipeline to check each resource definition against the same AWS Config rules before anything is provisioned, and to stop the deployment when a resource would be NON_COMPLIANT. The rules that the team uses support both evaluation modes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on the proactive evaluation mode for the rules, and rely on AWS Config to block the provisioning of any resource that the proactive evaluation reports as NON_COMPLIANT.
    - id: b
      text:
        en: |-
          Turn on the proactive evaluation mode for the rules, and add a pipeline step that requests a proactive evaluation of each resource definition and fails the stage when the result is NON_COMPLIANT.
    - id: c
      text:
        en: |-
          Change the trigger of the rules to periodic with a 1-hour frequency, and add a pipeline step that waits for the next evaluation before the deployment continues.
    - id: d
      text:
        en: |-
          Keep the rules in detective mode, and add automatic remediation with Systems Manager Automation runbooks so that noncompliant resources are fixed after they are provisioned.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Proactive evaluation checks whether a set of resource properties would be COMPLIANT or NON_COMPLIANT before the resource is deployed, while detective evaluation checks deployed resources. Proactive rules do not prevent deployment by themselves, so the pipeline must request the evaluation and stop the stage when the result is NON_COMPLIANT.
  options:
    a:
      en: |-
        Proactive rules neither remediate nor prevent the deployment of resources flagged as NON_COMPLIANT, so nothing would stop the provisioning.
    c:
      en: |-
        Periodic rules still evaluate resources that already exist, so the check would happen after provisioning, and the pipeline would wait up to an hour.
    d:
      en: |-
        Remediation fixes resources after they are provisioned, which is exactly what the team wants to avoid.
references:
  - title: "Components of an AWS Config Rule - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config-rules.html
