id: dopc02-5a-cross-region-pipeline-failures
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs AWS CodePipeline pipelines in us-east-1, eu-west-1, ap-southeast-2, and sa-east-1 in a single AWS account. The DevOps team maintains a set of Amazon EventBridge rules on the default event bus in us-east-1 that route pipeline failures to the right on-call team. The team wants CodePipeline Pipeline Execution State Change events with a FAILED state from all four Regions to be processed by those rules in us-east-1, without duplicating the routing rules in every Region and without custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          In eu-west-1, ap-southeast-2, and sa-east-1, create a rule on the default event bus that matches the failed pipeline executions and targets the default event bus in us-east-1.
    - id: b
      text:
        en: |-
          Create a multi-Region AWS CloudTrail trail with its home Region in us-east-1 so that the pipeline events from all Regions are delivered to the default event bus in us-east-1.
    - id: c
      text:
        en: |-
          Change the event pattern of the routing rules in us-east-1 to include a region field that lists the four Regions, so that they match the events of every Region.
    - id: d
      text:
        en: |-
          In each of the three other Regions, create an AWS Lambda function that is invoked by a rule for failed executions and calls PutEvents on the default event bus in us-east-1.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A rule can target an event bus in another Region, so one forwarding rule in each of the other Regions sends the failed executions to the default bus in us-east-1, where the existing routing rules process them. This needs no code and no copy of the routing rules.
  options:
    b:
      en: |-
        A trail logs API calls to its destinations; it does not move service events such as CodePipeline state changes from one Region's event bus to another.
    c:
      en: |-
        A rule only receives events from the bus it belongs to in its own Region, so adding a region field cannot bring events from other Regions.
    d:
      en: |-
        The Lambda functions forward the events, but they are custom code that a forwarding rule with a cross-Region bus target makes unnecessary.
references:
  - title: "Sending and receiving events between AWS Regions in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cross-region.html
