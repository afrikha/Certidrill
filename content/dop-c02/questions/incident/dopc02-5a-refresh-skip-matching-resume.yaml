id: dopc02-5a-refresh-skip-matching-resume
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 40 Amazon EC2 instances in an Auto Scaling group. An engineer started an instance refresh with a desired configuration that uses launch template version 8, and then canceled it because of an unrelated incident after 25 instances had been replaced. The 25 new instances run version 8 and are healthy, and the other 15 still run version 7. The company now wants all instances to run version 8 while replacing as few instances as possible.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Start a new instance refresh with a desired configuration that uses version 8, and turn on skip matching.
    - id: b
      text:
        en: |-
          Start a new instance refresh with a desired configuration that uses version 8, and turn off skip matching.
    - id: c
      text:
        en: |-
          Terminate the 15 instances that run version 7 so that the Auto Scaling group launches replacement instances automatically.
    - id: d
      text:
        en: |-
          Start a rollback of the canceled instance refresh so that the group returns to a consistent configuration first.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Skip matching tells Auto Scaling to ignore instances that already match the desired configuration, so only the 15 instances that still run version 7 are replaced. After the refresh succeeds, the group itself is updated to the desired configuration. Canceling the earlier refresh did not roll back the instances that it had replaced.
  options:
    b:
      en: |-
        Without skip matching, every instance is replaced, including the 25 that already run version 8.
    c:
      en: |-
        The group's own configuration was not updated by the canceled refresh, so the replacements could be launched from version 7 again.
    d:
      en: |-
        A rollback returns instances to the previous configuration, version 7, which is the opposite of the goal and replaces the 25 new instances.
references:
  - title: "Use an instance refresh with skip matching - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-instance-refresh-skip-matching.html
  - title: "Add checkpoints to an instance refresh - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-adding-checkpoints-instance-refresh.html
