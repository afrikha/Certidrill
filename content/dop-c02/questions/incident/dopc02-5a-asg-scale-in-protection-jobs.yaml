id: dopc02-5a-asg-scale-in-protection-jobs
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A video company runs transcoding workers on Amazon EC2 instances in an Auto Scaling group that scales on the backlog of an Amazon SQS queue. Each job takes between 20 and 90 minutes. When the backlog drops, scale-in terminates instances that are still transcoding, and those jobs must restart from the beginning. Instances that are idle must still be terminated quickly to save cost.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the termination policy of the group to NewestInstance so that the instances that started most recently are terminated first during scale-in.
    - id: b
      text:
        en: |-
          Suspend the Terminate process of the group, and resume it once a day during a low-traffic period to remove the extra instances.
    - id: c
      text:
        en: |-
          Increase the cooldown of the scale-in policy to 90 minutes so that running jobs can finish before the group removes instances.
    - id: d
      text:
        en: |-
          Have each worker turn on instance scale-in protection for its instance when it starts a job and turn it off when it finishes the job.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Instance scale-in protection controls which instances Auto Scaling can terminate during scale-in, and it can be turned on or off for individual instances at any time. Workers that protect themselves only while a job runs are never chosen for scale-in in the middle of a job, while idle instances stay eligible for termination.
  options:
    a:
      en: |-
        The newest instances can be the ones that are transcoding, so a termination policy based on launch time still interrupts running jobs.
    b:
      en: |-
        Suspending Terminate blocks every scale-in, so idle instances keep running for up to a day, which fails the cost requirement.
    c:
      en: |-
        A longer cooldown only delays scaling activities; it does not prevent the group from choosing a busy instance when it scales in.
references:
  - title: "Use instance scale-in protection to control instance termination - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-instance-protection.html
