id: dopc02-5b-acm-imported-expiry-event
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company imports TLS certificates issued by an external certificate authority into AWS Certificate Manager (ACM) and attaches them to Application Load Balancers. Renewing a certificate means requesting a new one from the external authority and reimporting it into ACM. The company has built an AWS Step Functions workflow that performs these steps, but operators start it by hand, and an expired certificate has already caused an outage. The workflow must now start automatically 60 days before each imported certificate expires. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule for ACM Certificate Expired events that starts the workflow for the certificate named in the event.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule for ACM Certificate Renewal Action Required events that starts the workflow when ACM cannot renew an imported certificate.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge Scheduler schedule that starts the workflow every day, and add a first state that lists the certificates and ends the execution unless one expires in exactly 60 days.
    - id: d
      text:
        en: |-
          Set the expiry events window to 60 days with the ACM PutAccountConfiguration action, and create an Amazon EventBridge rule for ACM Certificate Approaching Expiration events that starts the workflow.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      ACM sends a daily Certificate Approaching Expiration event for active certificates, including imported ones, starting 45 days before expiration by default. PutAccountConfiguration changes when these events start, so the rule can start the existing workflow 60 days ahead without new code.
  options:
    a:
      en: |-
        Certificate Expired events are not available for imported certificates, and starting the renewal after expiration is too late.
    b:
      en: |-
        Renewal Action Required events are sent when ACM's managed renewal fails and are not available for imported certificates, which ACM does not renew.
    c:
      en: |-
        This works but adds custom listing and date logic to the workflow, while ACM already emits an expiration event.
references:
  - title: Amazon EventBridge support for ACM - AWS Certificate Manager
    url: https://docs.aws.amazon.com/acm/latest/userguide/supported-events.html
