id: dopc02-5b-rca-route-table-change
objective: "5.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Since Tuesday, instances in one private subnet of a production VPC cannot reach an on-premises network, while other subnets are unaffected. AWS Config records all resource types in the account. The incident review must establish what changed in the subnet's route table, what the route table looked like before the change, and which IAM principal made the change.

    Which combination of actions will provide this information? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Review the AWS Config resource timeline of the route table to compare its configuration items before and after Tuesday.
    - id: b
      text:
        en: |-
          Run Reachability Analyzer from an affected instance to the on-premises network to list the routes that were deleted.
    - id: c
      text:
        en: |-
          Search the AWS CloudTrail event history for route table API calls such as DeleteRoute or ReplaceRoute on the route table, and read the identity of the caller.
    - id: d
      text:
        en: |-
          Create a CloudWatch Contributor Insights rule on the VPC Flow Logs to find the principal that generates the rejected traffic.
    - id: e
      text:
        en: |-
          Query the VPC Flow Logs of the subnet with CloudWatch Logs Insights to see the route table entries that were used before Tuesday.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The AWS Config resource timeline records configuration items of the route table over time, so the team can compare the routes before and after the change. CloudTrail event history keeps 90 days of management events, including the identity that called the API, which shows who made the change.
  options:
    b:
      en: |-
        Reachability Analyzer analyzes the current configuration and identifies the blocking component; it does not show history or who changed it.
    d:
      en: |-
        Flow logs describe network traffic, not IAM principals, so they cannot show who changed the route table.
    e:
      en: |-
        Flow log records contain addresses, ports, and actions, not the route table entries.
references:
  - title: Viewing Compliance History for your AWS Resources with AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/view-manage-resource-console.html
  - title: Working with CloudTrail event history - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
