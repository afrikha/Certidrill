id: dopc02-5b-contributor-insights-error-urls
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's web servers send JSON access logs to an Amazon CloudWatch Logs log group. Each log event contains the fields url, status, and clientIp, and thousands of distinct URLs are requested every hour. During incidents, the on-call engineers lose time running ad hoc queries to find which URLs produce the most HTTP 5xx responses. They want a continuously updated graph of the 10 URLs with the most 5xx responses that they can add to their incident dashboard, without writing or running code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a metric filter on the log group that publishes a 5xx count metric with the url field as a dimension, and graph the metric on the dashboard.
    - id: b
      text:
        en: |-
          Create an AWS X-Ray group with a filter expression on HTTP 5xx responses, and add the group's service map to the dashboard.
    - id: c
      text:
        en: |-
          Save a CloudWatch Logs Insights query that counts 5xx responses by url, and ask the engineers to run the saved query at the start of each incident.
    - id: d
      text:
        en: |-
          Create a CloudWatch Contributor Insights rule on the log group that counts 5xx responses by url, and add its top contributors graph to the dashboard.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Contributor Insights rules analyze log events in real time and build time series of the top-N contributors for the fields you choose, such as the URLs that generate the most errors. The rule's graph can be shown on a dashboard without any query or code.
  options:
    a:
      en: |-
        A metric filter with a dimension for every one of thousands of URLs creates high-cardinality custom metrics and does not rank the top 10 for the engineers.
    b:
      en: |-
        The web servers only send access logs; X-Ray groups need traces from instrumented applications and do not read log groups.
    c:
      en: |-
        A saved query is still run by hand during each incident, which is what the engineers want to stop doing.
references:
  - title: Use Contributor Insights to analyze high-cardinality data - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContributorInsights.html
