id: dopc02-5b-remediation-rate-controls
objective: "5.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is about to turn on automatic remediation for an AWS Config rule that currently reports 400 noncompliant Amazon EC2 instances. The remediation runbook restarts an application service on each instance. To limit the impact, no more than 5 % of the noncompliant instances may be remediated at the same time, and AWS Config must stop starting new remediations for the rule if more than 10 % of them fail.

    How should the DevOps engineer configure the remediation?
body:
  options:
    - id: a
      text:
        en: |-
          Set MaximumAutomaticAttempts to 5 and RetryAttemptSeconds to 600 in the remediation configuration of the rule.
    - id: b
      text:
        en: |-
          Keep the default execution controls of the remediation configuration, because they already limit concurrency to 5 % and errors to 10 %.
    - id: c
      text:
        en: |-
          Set ConcurrentExecutionRatePercentage to 5 and ErrorPercentage to 10 in the SSM controls of the remediation's execution controls.
    - id: d
      text:
        en: |-
          Add MaxConcurrency 5% and MaxErrors 10% to the aws:runCommand step of the runbook that restarts the service.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The SsmControls of a remediation configuration set the maximum share of remediation actions that run in parallel for the rule and the share of errors after which Systems Manager stops running automations on the rule's noncompliant resources.
  options:
    a:
      en: |-
        These settings control retries of a failed remediation on one resource, not how many resources are remediated at the same time.
    b:
      en: |-
        The defaults are 10 % for concurrency and 50 % for errors, which are both higher than the limits the company requires.
    d:
      en: |-
        AWS Config starts a separate execution for each instance, so rate control inside one execution's Run Command step does not limit how many executions run together.
references:
  - title: SsmControls - AWS Config
    url: https://docs.aws.amazon.com/config/latest/APIReference/API_SsmControls.html
