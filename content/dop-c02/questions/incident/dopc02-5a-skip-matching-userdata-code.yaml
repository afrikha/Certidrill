id: dopc02-5a-skip-matching-userdata-code
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in an Auto Scaling group. The launch template's user data script downloads the latest application build from an Amazon S3 bucket when an instance boots, so the launch template does not change between releases. To deploy a new build, an engineer uploaded it to the bucket and started an instance refresh with skip matching turned on and no desired configuration. The refresh completed successfully within seconds, but all instances still run the previous build.

    What should the engineer do to deploy the new build to all instances?
body:
  options:
    - id: a
      text:
        en: |-
          Start a new instance refresh with skip matching turned on and the current launch template version set as the desired configuration.
    - id: b
      text:
        en: |-
          Start a new instance refresh with skip matching turned off so that every instance is replaced and runs the user data script again.
    - id: c
      text:
        en: |-
          Set the minimum healthy percentage of the refresh to 100 so that the refresh cannot complete before the instances are replaced.
    - id: d
      text:
        en: |-
          Add a checkpoint at 100 % to the instance refresh so that the refresh waits until every instance has been checked against the new build.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Skip matching compares instances only with the configuration of the group or the desired configuration, and it does not know whether a user data script pulls new code. Because nothing in the configuration changed, every instance matched and none was replaced; turning off skip matching replaces all instances, which then download the new build at boot.
  options:
    a:
      en: |-
        The current launch template version is the configuration that every instance already uses, so skip matching would again replace nothing.
    c:
      en: |-
        The minimum healthy percentage only limits how many instances are replaced at once; with skip matching, no instance needs replacement at all.
    d:
      en: |-
        Checkpoints pause a refresh after a percentage of instances is replaced; they do not compare instances with the application build.
references:
  - title: "Use an instance refresh with skip matching - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-instance-refresh-skip-matching.html
