id: dopc02-5b-codebuild-session-breakpoint
objective: "5.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS CodeBuild project uses the standard Amazon Linux curated image. Its build phase fails intermittently with an error that the engineers cannot reproduce on their workstations. They want to pause a build just before the failing command, open a shell in the running build container to inspect files and environment variables, and then let the build continue. They do not want to open any inbound ports.

    Which combination of steps will meet these requirements? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Turn on session connection for the build in the environment overrides when the build is started.
    - id: b
      text:
        en: |-
          Add codebuild-breakpoint to the buildspec before the failing command, and run codebuild-resume when done.
    - id: c
      text:
        en: |-
          Allow the ssmmessages actions for the control and data channels in the CodeBuild service role.
    - id: d
      text:
        en: |-
          Turn on privileged mode for the project so that the build container accepts interactive sessions.
    - id: e
      text:
        en: |-
          Run the build in a VPC with a security group that allows inbound SSH from the engineers' network.
    - id: f
      text:
        en: |-
          Install SSM Agent in the build image, because the curated images do not include it.
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |-
      CodeBuild supports debugging with Session Manager: with session connection enabled, codebuild-breakpoint pauses the build, the engineer connects through Session Manager, and codebuild-resume continues the build. The service role needs the ssmmessages permissions to open the session channels.
  options:
    d:
      en: |-
        Privileged mode is for building Docker images; it is not required for a Session Manager connection.
    e:
      en: |-
        Session Manager does not need SSH or inbound ports, and the engineers do not want to open any.
    f:
      en: |-
        The Linux standard curated images already include SSM Agent configured for this feature; only custom images need it installed.
references:
  - title: Debug builds with Session Manager - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/session-manager.html
