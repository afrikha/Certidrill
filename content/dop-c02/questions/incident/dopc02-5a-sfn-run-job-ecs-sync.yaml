id: dopc02-5a-sfn-run-job-ecs-sync
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a nightly data migration as an Amazon ECS task on AWS Fargate. An AWS Step Functions workflow must start the task and then run validation and notification steps only after the task has finished. If the task fails, the workflow must fail. The run takes up to 2 hours. The company wants the LEAST custom code and no polling logic.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use an Express workflow with a Task state whose resource is arn:aws:states:::ecs:runTask.sync, followed by the validation and notification states.
    - id: b
      text:
        en: |-
          Use a Standard workflow with a Task state whose resource is arn:aws:states:::aws-sdk:ecs:runTask, followed by the validation and notification states.
    - id: c
      text:
        en: |-
          Use a Standard workflow with a Task state whose resource is arn:aws:states:::ecs:runTask.sync, followed by the validation and notification states.
    - id: d
      text:
        en: |-
          Use a Standard workflow that starts the task from a Lambda function, then loops through a Wait state and a Lambda function that checks the task status.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Run a Job (.sync) integration pattern makes Step Functions wait until the job finishes before it moves to the next state, and the Amazon ECS optimized integration supports it in Standard workflows. A Standard workflow also allows a run of 2 hours, and a failed task fails the state.
  options:
    a:
      en: |-
        Express workflows support only the Request Response pattern, and they cannot run for 2 hours.
    b:
      en: |-
        AWS SDK integrations do not support the .sync pattern, so this state returns as soon as the task is started and the next steps would run too early.
    d:
      en: |-
        The loop works, but it is custom polling code that the .sync integration makes unnecessary.
references:
  - title: "Discover service integration patterns in Step Functions - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
