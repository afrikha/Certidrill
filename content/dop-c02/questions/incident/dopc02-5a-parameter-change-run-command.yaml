id: dopc02-5a-parameter-change-run-command
objective: "5.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores an application's runtime settings in a Systems Manager Parameter Store parameter named /web/prod/settings. The application runs on Amazon EC2 instances that are tagged App=web and are Systems Manager managed nodes. When the parameter is updated, a reload script must run on every tagged instance within a few minutes so that the application reads the new value. The company wants the LEAST operational overhead and no custom code beyond the existing reload script.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule that matches Parameter Store Change events from aws.ssm for the /web/prod/settings parameter with the Update operation.
    - id: b
      text:
        en: |-
          Add an ExpirationNotification parameter policy to the parameter so that Parameter Store sends an event each time the value is updated.
    - id: c
      text:
        en: |-
          Set the rule's target to Run Command with the AWS-RunShellScript document, targets selected by the tag App=web, and an IAM role that allows EventBridge to run the command.
    - id: d
      text:
        en: |-
          Create a State Manager association that runs the reload script on the instances tagged App=web every 30 minutes.
    - id: e
      text:
        en: |-
          Create an AWS Config custom rule for the parameter whose Lambda function runs the reload script on the instances through SSH.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Parameter Store emits Parameter Store Change events to EventBridge for Create, Update, Delete, and LabelParameterVersion operations, so a rule can match updates of one parameter. EventBridge can start Run Command on managed nodes selected by tag, which runs the reload script within minutes of the change.
  options:
    b:
      en: |-
        Parameter policies send events about expiration and missing changes, not about each update, and they require the advanced tier.
    d:
      en: |-
        An association every 30 minutes can reload up to 30 minutes after the change, and it reloads even when nothing changed.
    e:
      en: |-
        This is custom code with SSH access to instances, while EventBridge and Run Command already provide the trigger and the execution.
references:
  - title: "Setting up notifications or triggering actions based on Parameter Store events - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-cwe.html
