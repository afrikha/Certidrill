id: dopc02-5a-no-chained-bus-forwarding
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 25 workload accounts. Each workload account has a rule on its default event bus that forwards Amazon GuardDuty findings to an event bus in a central Operations account, and rules on that bus notify the operations team as expected. The security team now wants the same findings in its own Security account. A DevOps engineer added a rule on the Operations account's bus that matches the GuardDuty findings and targets an event bus in the Security account. The resource-based policy of the Security bus allows events:PutEvents from every account in the organization, and the IAM role of the new target is correct. Findings generated in the Operations account itself reach the Security account, but no finding from the workload accounts arrives.

    What should the DevOps engineer do to deliver the workload accounts' findings to the Security account?
body:
  options:
    - id: a
      text:
        en: |-
          Add the 25 workload account IDs to the account field of the event pattern of the forwarding rule in the Operations account.
    - id: b
      text:
        en: |-
          Change the state of the forwarding rule in the Operations account to ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS.
    - id: c
      text:
        en: |-
          Create a rule on the Security bus whose event pattern matches the 25 workload account IDs, and keep the forwarding rule in the Operations account.
    - id: d
      text:
        en: |-
          Add the Security account's event bus as a second target, with an IAM role, on the existing forwarding rule in each workload account.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      EventBridge does not forward events that a bus received from another account on to a third account. The events must therefore be sent directly from each workload account, for example by adding the Security bus as a second target of the existing forwarding rule, with a role that allows events:PutEvents; the Security bus policy already allows every account of the organization.
  options:
    a:
      en: |-
        The rule already matches the events; the events are dropped because they came from another account and cannot be sent on to a third account, whatever the pattern says.
    b:
      en: |-
        This rule state concerns read-only CloudTrail management events; GuardDuty findings are service events, and the chaining limit still applies.
    c:
      en: |-
        A rule on the Security bus can only match events that reach the bus, and the second hop from the Operations account still does not deliver the workload accounts' findings.
references:
  - title: "Sending and receiving events between AWS accounts in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cross-account.html
