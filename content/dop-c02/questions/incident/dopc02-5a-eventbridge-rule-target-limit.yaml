id: dopc02-5a-eventbridge-rule-target-limit
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company publishes an OrderPlaced event to a custom event bus in Amazon EventBridge that uses rules and targets. A rule with an event pattern for OrderPlaced already delivers the event to five independent consumers. A sixth and a seventh team now want to receive every OrderPlaced event. When a DevOps engineer tries to add a sixth target to the rule, the request fails. Every consumer must keep receiving its own copy of each event, and the company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the targets of the rule with one Amazon SQS queue, and have all seven consumers poll that queue for OrderPlaced events.
    - id: b
      text:
        en: |-
          Replace the targets of the rule with an AWS Lambda function that receives each event and invokes the seven consumers one after another.
    - id: c
      text:
        en: |-
          Create a second rule on the same event bus with the same event pattern, and add the two new consumers as targets of that rule.
    - id: d
      text:
        en: |-
          Create a second event bus, replace one target of the existing rule with that bus, and create rules on the second bus for the displaced consumer and the two new teams.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Each EventBridge rule can have up to five targets, and an event can match several rules. A second rule with the same pattern delivers its own copy of every OrderPlaced event to the new consumers, without changing the existing rule or any consumer.
  options:
    a:
      en: |-
        Consumers of one SQS queue compete for messages: each event would be processed by only one of the seven consumers instead of all of them.
    b:
      en: |-
        The function is custom fan-out code that the team must maintain, and a failure of one consumer could affect the delivery to the others.
    d:
      en: |-
        This can work, but it adds a bus, an extra forwarding hop, and changes for an existing consumer, which is more overhead than a second rule on the same bus.
references:
  - title: "Amazon EventBridge event bus (default and Classic) - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-bus.html
