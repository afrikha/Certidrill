id: dopc02-5b-health-dashboard-account
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Users report errors from an application that runs on Amazon EC2 instances in one AWS Region. The public AWS Health Dashboard page shows no current issues for Amazon EC2 in that Region. Before investigating the application, the on-call engineer wants to check whether AWS has reported any event that affects the company's own resources, such as scheduled maintenance or an issue with specific instances.

    Where should the engineer look?
body:
  options:
    - id: a
      text:
        en: |-
          The AWS CloudTrail event history of the account, filtered on events from the Amazon EC2 service.
    - id: b
      text:
        en: |-
          The Amazon CloudWatch metrics of the instances in the AWS/EC2 namespace, compared with last week.
    - id: c
      text:
        en: |-
          The AWS Health Dashboard Your account health page, after signing in to the account.
    - id: d
      text:
        en: |-
          The AWS Config resource timeline of each instance, filtered on compliance events.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The public service health page shows only public events, which are not specific to an account. After signing in, Your account health shows the events that can affect the account and its resources, such as issues with specific instances and scheduled changes.
  options:
    a:
      en: |-
        CloudTrail records API calls made in the account, not AWS Health events about AWS services or the company's resources.
    b:
      en: |-
        Metrics show how the instances behave, not the events that AWS has reported about them.
    d:
      en: |-
        The AWS Config timeline shows configuration and compliance changes of a resource, not AWS events that affect it.
references:
  - title: AWS Health Dashboard - AWS Health
    url: https://docs.aws.amazon.com/health/latest/ug/aws-health-dashboard-status.html
