id: dopc02-5a-kinesis-batching-window-cost
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function reads an Amazon Kinesis data stream through an event source mapping and loads the records into an analytics database through a bulk-load API. The stream receives a steady but low volume of records, so the function is invoked several times per second with only a few records each time, and the database works much more efficiently with larger batches. The business accepts that records are loaded up to 1 minute after they are written.

    Which change will reduce the number of invocations and produce larger batches?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the parallelization factor of the event source mapping so that more batches are read from each shard at the same time.
    - id: b
      text:
        en: |-
          Register an enhanced fan-out consumer for the function so that records are pushed to it with lower latency.
    - id: c
      text:
        en: |-
          Set a batching window of up to 60 seconds on the event source mapping, together with a larger batch size.
    - id: d
      text:
        en: |-
          Set the starting position of the event source mapping to TRIM_HORIZON so that the function reads the oldest records first.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A batching window makes Lambda keep reading records for up to the configured time (at most 5 minutes) until it has a full batch, the window expires, or the payload reaches 6 MB. A 60-second window with a larger batch size produces fewer invocations with more records, within the accepted delay.
  options:
    a:
      en: |-
        A higher parallelization factor runs more concurrent batches per shard, which increases the number of invocations instead of reducing it.
    b:
      en: |-
        Enhanced fan-out lowers read latency; it does not make Lambda wait to build larger batches.
    d:
      en: |-
        The starting position only decides where a new mapping starts reading; it does not change the size of the batches.
references:
  - title: "Using Lambda to process records from Amazon Kinesis Data Streams - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
