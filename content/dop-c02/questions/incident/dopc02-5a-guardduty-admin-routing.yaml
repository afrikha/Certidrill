id: dopc02-5a-guardduty-admin-routing
objective: "5.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon GuardDuty in 40 member accounts, and a Security account is the GuardDuty delegated administrator. Three of the member accounts process cardholder data. The PCI team wants an Amazon SNS notification for every GuardDuty finding with a severity of 7 or higher from those three accounts only. All findings must remain visible to the security analysts in GuardDuty, and the routing must be managed only from the Security account so that member account administrators cannot change it.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          In the Security account, create an Amazon EventBridge rule for GuardDuty Finding events whose pattern matches detail.accountId with the three account IDs, and target the PCI team's SNS topic.
    - id: b
      text:
        en: |-
          In the event pattern of the Security account rule, match detail.severity with a numeric condition of greater than or equal to 7.
    - id: c
      text:
        en: |-
          In the event pattern of the Security account rule, match detail.severity with the string value HIGH.
    - id: d
      text:
        en: |-
          In each of the three cardholder data accounts, create an EventBridge rule for GuardDuty Finding events that targets the PCI team's SNS topic.
    - id: e
      text:
        en: |-
          In the Security account, create a GuardDuty suppression rule that archives every finding with a severity lower than 7.
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      EventBridge rules in the GuardDuty administrator account are triggered by the findings of the member accounts, and the detail.accountId field identifies the account of each finding. The severity is a numeric field, so a numeric condition of 7 or higher selects the high-severity findings without touching the findings themselves.
  options:
    c:
      en: |-
        detail.severity is a number, so a string value such as HIGH never matches it.
    d:
      en: |-
        Rules in the member accounts can be changed by the administrators of those accounts, and the administrator account already receives the member findings.
    e:
      en: |-
        Suppressed findings are archived automatically and are not sent to EventBridge, which changes what the analysts see and affects every team, not only the PCI notifications.
references:
  - title: "Processing GuardDuty findings with Amazon EventBridge - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_eventbridge.html
