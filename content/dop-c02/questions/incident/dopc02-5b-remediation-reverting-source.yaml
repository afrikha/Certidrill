id: dopc02-5b-remediation-reverting-source
objective: "5.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Config rule with automatic remediation keeps versioning turned on for the Amazon S3 buckets of a data platform. Every morning, the compliance dashboard shows the same 12 buckets as having been NON_COMPLIANT during the night and then remediated. CloudTrail shows that at 01:00 every night, the role of a scheduled AWS Lambda function owned by the platform team calls PutBucketVersioning with the status Suspended on those buckets. The function applies bucket settings from a configuration file in the team's repository and must keep managing the other settings of the buckets. The company wants the buckets to stay compliant at all times.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the configuration file that the function applies so that versioning stays Enabled, and keep the AWS Config rule and remediation.
    - id: b
      text:
        en: |-
          Increase MaximumAutomaticAttempts of the remediation to 25 so that AWS Config reverts each nightly change faster and more reliably.
    - id: c
      text:
        en: |-
          Change the rule from a configuration change trigger to a periodic trigger that runs every hour to catch the nightly change.
    - id: d
      text:
        en: |-
          Attach a service control policy to the account that denies s3:PutBucketVersioning to all principals, including the function's role.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A remediation that works and is then undone shows that another process keeps applying the old configuration. Fixing that source of truth stops the nightly drift, and the rule with its remediation stays as a safety net.
  options:
    b:
      en: |-
        The remediation already succeeds; more attempts do not stop the function from suspending versioning every night.
    c:
      en: |-
        A periodic trigger detects the change later than a configuration change trigger, so the buckets stay noncompliant for longer.
    d:
      en: |-
        Denying the action to all principals also blocks the remediation runbook, which needs the same action to turn versioning back on.
references:
  - title: Remediating Noncompliant Resources with AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/remediation.html
  - title: Working with CloudTrail event history - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
