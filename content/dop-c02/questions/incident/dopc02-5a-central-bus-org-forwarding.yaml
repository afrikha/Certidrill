id: dopc02-5a-central-bus-org-forwarding
objective: "5.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has 40 workload accounts in AWS Organizations and uses only us-east-1. An organization trail logs management events for all accounts. The security team owns an event bus named security-events in its Security account. Rules on that bus must receive every AuthorizeSecurityGroupIngress API call event from every workload account, including accounts that are created later. The company wants the LEAST operational overhead and does not want to grant access to principals outside the organization.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a resource-based policy to the security-events bus that allows events:PutEvents for all principals when aws:PrincipalOrgID equals the organization ID.
    - id: b
      text:
        en: |-
          Create a rule on the security-events bus with an account field that lists the 40 workload account IDs, so that the bus receives their events from the organization trail.
    - id: c
      text:
        en: |-
          Create an archive on the default event bus of each workload account, and replay the archived events to the security-events bus every hour.
    - id: d
      text:
        en: |-
          Use a service-managed StackSet with automatic deployment to create, in each workload account, a default-bus rule that targets the security-events bus with an IAM role that allows events:PutEvents on it.
    - id: e
      text:
        en: |-
          Create a rule on the default event bus of the management account, which receives the API call events of all member accounts because the trail is an organization trail.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Each account's API call events arrive only on that account's default bus, so every workload account needs a rule that sends them to the central bus, with an IAM role for the cross-account target. The central bus must allow events:PutEvents from the organization in its resource-based policy, and a StackSet with automatic deployment adds the rule to future accounts.
  options:
    b:
      en: |-
        A rule on the central bus filters events that reach the bus; it does not pull events from other accounts, so without forwarding rules nothing arrives.
    c:
      en: |-
        Archived events can be replayed only to the bus that the archive belongs to, so a replay cannot move them to another account.
    e:
      en: |-
        An organization trail centralizes log files, but EventBridge receives each account's API call events only on that account's own default bus.
references:
  - title: "Sending and receiving events between AWS accounts in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cross-account.html
  - title: "AWS service events delivered via AWS CloudTrail - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
