id: dopc02-5a-config-daily-recording
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses AWS Config in a development account where resources change many times a day. The compliance team only needs, for each resource, the most recent configuration of each day, and only when it differs from the previously recorded configuration. The company does not use AWS Firewall Manager. The team wants AWS Config to keep recording all resource types but to stop recording a configuration item for every change.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the recording strategy of the configuration recorder to record specific resource types, and remove the resource types that change most often.
    - id: b
      text:
        en: |-
          Reduce the retention period of the configuration items to 30 days so that AWS Config keeps fewer configuration items for each resource.
    - id: c
      text:
        en: |-
          Change the AWS Config rules of the account from configuration change triggers to periodic triggers with a 24-hour frequency.
    - id: d
      text:
        en: |-
          Change the recording frequency of the configuration recorder from continuous recording to daily recording.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With daily recording, AWS Config delivers one configuration item per resource that represents its most recent state over the last 24 hours, and only if it differs from the previous configuration item. Continuous recording, the alternative, records a configuration item whenever a change occurs.
  options:
    a:
      en: |-
        Removing resource types stops recording them entirely, but the team must keep recording all resource types.
    b:
      en: |-
        The retention period only controls how long recorded configuration items are kept; AWS Config still records one for every change.
    c:
      en: |-
        Rule triggers control when rules evaluate resources; they do not change how often the recorder creates configuration items.
references:
  - title: "Recording AWS Resources with AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/select-resources.html
