id: dopc02-5a-sqs-esm-failure-redrive
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function processes messages from an Amazon SQS standard queue through an event source mapping. Some malformed messages make the function fail every time, so they return to the queue after each visibility timeout and are retried until the 4-day retention period expires. A DevOps engineer configured an on-failure destination in the function's asynchronous invocation settings, but no message has ever arrived there. The company wants each message that fails 5 times to be set aside in another queue for analysis.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure a dead-letter queue in the function configuration of the Lambda function so that Lambda sends the failed messages to that queue.
    - id: b
      text:
        en: |-
          Configure an on-failure destination on the event source mapping that sends failed messages to another SQS queue after 5 failed attempts.
    - id: c
      text:
        en: |-
          Keep the on-failure destination of the asynchronous invocation settings, and lower the maximum event age so that failed messages reach it sooner.
    - id: d
      text:
        en: |-
          Configure a redrive policy on the source queue with a dead-letter queue and a maximum receive count of 5.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With an SQS event source, failed messages return to the queue, and the failure handling belongs to the queue itself: a redrive policy moves a message to the dead-letter queue after the maximum receive count. AWS states that for SQS sources the dead-letter queue must be configured on the queue, not on the function.
  options:
    a:
      en: |-
        A function-level dead-letter queue applies to asynchronous invocations; an event source mapping invokes the function synchronously, so the queue would never receive these messages.
    b:
      en: |-
        Event source mappings keep records of failed invocations in a destination only for Kinesis, DynamoDB, and Kafka sources, not for SQS.
    c:
      en: |-
        Asynchronous invocation settings apply only when the function is invoked asynchronously, which is not the case for messages polled from SQS by an event source mapping.
references:
  - title: "Capturing records of Lambda asynchronous invocations - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-retain-records.html
