id: dopc02-5b-fis-validate-root-cause
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After an outage, a team's root cause hypothesis is that the application fails when several of its Amazon EC2 instances stop at the same time, because the remaining instances run out of database connections. Before investing in a fix, the team wants to reproduce the failure in the staging environment by stopping a selected set of tagged instances. The test must stop automatically if the staging error rate alarm in Amazon CloudWatch enters the ALARM state, and the team wants a managed, repeatable experiment with the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write a script that stops the tagged instances with the AWS CLI, and ask an engineer to watch the alarm and stop the script if the alarm fires.
    - id: b
      text:
        en: |-
          Create a CloudWatch Synthetics canary that calls the application every minute, and stop the instances by hand while the canary runs.
    - id: c
      text:
        en: |-
          Run an AWS Resilience Hub assessment of the application, and use the report to confirm that the instances run out of database connections.
    - id: d
      text:
        en: |-
          Create an AWS Fault Injection Service experiment template that stops instances selected by tag, with the error rate alarm as a stop condition.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS Fault Injection Service runs experiments from a template that defines actions, targets selected by tags or other criteria, and stop conditions. A stop condition is a CloudWatch alarm, and AWS FIS stops the experiment when it is triggered, so the test is repeatable and guarded without custom code.
  options:
    a:
      en: |-
        A script and a person watching the alarm are custom and manual, and the stop depends on someone reacting in time.
    b:
      en: |-
        The canary observes the application, but the fault is still injected by hand and nothing stops the test when the alarm fires.
    c:
      en: |-
        An assessment evaluates the application's design against resilience policies; it does not inject the failure to prove the hypothesis.
references:
  - title: What is AWS Fault Injection Service? - AWS Fault Injection Service
    url: https://docs.aws.amazon.com/fis/latest/userguide/what-is.html
