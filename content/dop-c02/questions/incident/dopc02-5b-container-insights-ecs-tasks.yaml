id: dopc02-5b-container-insights-ecs-tasks
objective: "5.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs 30 services on an Amazon ECS cluster. During incidents, the engineers cannot tell which tasks or services are running out of memory, because the metrics they use are aggregated across the cluster and services. They also need to see container restart failures. For rare investigations, they sometimes need a breakdown finer than the metrics that CloudWatch creates, and they do not want to pay for extra custom metrics for these occasional needs.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Turn on CloudWatch Container Insights for the cluster, and use its task-level and service-level metrics and diagnostic information.
    - id: b
      text:
        en: |-
          Add the CloudWatch Lambda Insights layer to the task definitions so that each container publishes memory metrics.
    - id: c
      text:
        en: |-
          Query the Container Insights performance log events with CloudWatch Logs Insights when the engineers need a finer breakdown.
    - id: d
      text:
        en: |-
          Create a metric filter for every container field in the performance log events so that all possible metrics are always available.
    - id: e
      text:
        en: |-
          Turn on VPC Flow Logs for the cluster subnets to find which tasks use the most memory.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Container Insights collects CPU, memory, disk, and network data as performance log events and creates aggregated metrics at the cluster, task, and service levels, with diagnostic information such as container restart failures. CloudWatch does not create every possible metric from these events, but Logs Insights can analyze the raw events for more granularity when needed.
  options:
    b:
      en: |-
        Lambda Insights is an extension for Lambda functions, not for ECS tasks.
    d:
      en: |-
        Metric filters for every field create the custom metrics that the company does not want to pay for, when the raw events can be queried on demand.
    e:
      en: |-
        Flow logs record network traffic, not memory use.
references:
  - title: Container Insights - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContainerInsights.html
