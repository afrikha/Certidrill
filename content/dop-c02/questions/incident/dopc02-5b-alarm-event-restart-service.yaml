id: dopc02-5b-alarm-event-restart-service
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A legacy application runs on three standalone Amazon EC2 instances managed by AWS Systems Manager. Its service leaks memory, and the CloudWatch agent publishes memory use with an InstanceId dimension. Each instance has an Amazon CloudWatch alarm on this metric. Until the vendor ships a fix, the application service must be restarted on an instance as soon as that instance's alarm enters the ALARM state, without rebooting the instance, and the output of every restart must be kept. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an EC2 reboot action to each alarm so that the instance restarts and frees its memory when the alarm enters the ALARM state.
    - id: b
      text:
        en: |-
          Create a State Manager association that runs a command to restart the service on the three instances every hour.
    - id: c
      text:
        en: |-
          Configure the alarms to create OpsItems in OpsCenter, and ask the on-call engineer to run the restart runbook from each OpsItem.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule for CloudWatch Alarm State Change events of these alarms with the ALARM state that starts an Automation runbook to restart the service on the instance from the alarm's dimension.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CloudWatch sends an event to EventBridge whenever an alarm changes state, with the alarm's new state and configuration, including its metric dimensions. A rule on the ALARM state can start an Automation runbook that restarts the service on the affected instance, and the execution history keeps the output of each restart.
  options:
    a:
      en: |-
        Alarm actions can reboot the instance but cannot run a command, and the company must not reboot the instances.
    b:
      en: |-
        An hourly restart runs whether or not memory is high and can wait up to an hour after the alarm fires.
    c:
      en: |-
        The restart depends on an engineer, so it is not done as soon as the alarm fires.
references:
  - title: Alarm events and EventBridge - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-and-eventbridge.html
  - title: Using Amazon CloudWatch alarms - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html
