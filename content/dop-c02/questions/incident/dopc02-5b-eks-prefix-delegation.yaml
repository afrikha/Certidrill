id: dopc02-5b-eks-prefix-delegation
objective: "5.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon EKS cluster with the Amazon VPC CNI plugin on a managed node group of small Nitro-based instances. After a new microservice was deployed, many pods stay Pending, and the scheduler reports that the nodes have reached their maximum number of pods, although CPU and memory use on the nodes is below 40 %. The cluster subnets still have thousands of free IP addresses. The company wants to run more pods on the same instance types and avoid disrupting the running workloads.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on IP prefix assignment in the VPC CNI plugin, and move the workloads to a new managed node group.
    - id: b
      text:
        en: |-
          Add a secondary CIDR block to the VPC and configure custom networking so that pods receive IP addresses from new subnets.
    - id: c
      text:
        en: |-
          Increase the CPU and memory requests of the new microservice so that the scheduler spreads its pods across more nodes.
    - id: d
      text:
        en: |-
          Restart the aws-node pods on every node so that the VPC CNI plugin releases unused secondary IP addresses.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Without prefix assignment, each node gets individual secondary IP addresses, and the small instance types limit how many pods they can run. Assigning IP prefixes gives each node more addresses for pods, and AWS recommends creating new node groups for the transition rather than a rolling replacement of existing nodes.
  options:
    b:
      en: |-
        Custom networking helps when the subnets run out of addresses; here the subnets have thousands of free addresses, and the limit is per node.
    c:
      en: |-
        Larger requests make fewer pods fit on each node; they do not raise the per-node pod limit.
    d:
      en: |-
        Restarting the CNI pods disrupts networking on the nodes and does not change the number of addresses each node can assign.
references:
  - title: Assign more IP addresses to Amazon EKS nodes with prefixes - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/cni-increase-ip-addresses.html
