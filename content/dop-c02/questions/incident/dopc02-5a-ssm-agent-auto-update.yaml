id: dopc02-5a-ssm-agent-auto-update
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company manages 800 Amazon EC2 instances in one AWS account and Region as AWS Systems Manager managed nodes. During an audit, the operations team found that many nodes run old versions of SSM Agent because the instances were launched from AMIs of different ages. The team wants every managed node in the account to check regularly for a new version of SSM Agent and install it automatically, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run the AWS-UpdateSSMAgent document with Run Command against all managed nodes at the beginning of each month.
    - id: b
      text:
        en: |-
          Build new AMIs that contain the latest SSM Agent every month, and relaunch all instances from the new AMIs.
    - id: c
      text:
        en: |-
          Turn on the Auto update SSM Agent setting on the Settings tab of Fleet Manager for the account.
    - id: d
      text:
        en: |-
          Use Systems Manager Inventory to list nodes with old agent versions, and update them from Fleet Manager every week.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Auto update SSM Agent setting in Fleet Manager makes Systems Manager check every two weeks for a new agent version and update all managed nodes with the AWS-UpdateSSMAgent document. It creates and manages the State Manager association for the team, which is the method AWS recommends.
  options:
    a:
      en: |-
        Running the document manually each month works, but it is a recurring manual task that the automatic setting removes.
    b:
      en: |-
        Rebuilding AMIs and relaunching instances is far more work than updating the agent in place.
    d:
      en: |-
        Inventory shows which versions are installed, but the updates would still be a weekly manual task.
references:
  - title: "Automating updates to SSM Agent - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/ssm-agent-automatic-updates.html
