id: dopc02-5b-ecs-all-at-once-health
objective: "5.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys an Amazon ECS service behind an Application Load Balancer with AWS CodeDeploy blue/green deployments that use the CodeDeployDefault.ECSAllAtOnce configuration. Yesterday, CodeDeploy reported a successful deployment, but the new tasks then failed the load balancer health checks and the application was unavailable until an engineer started a rollback by hand. The company wants future deployments to detect unhealthy replacement tasks before all production traffic depends on them and to roll back automatically, without writing custom test code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the health check grace period of the ECS service so that the new tasks have more time to start before traffic is shifted.
    - id: b
      text:
        en: |-
          Change to a canary deployment configuration, and add an alarm on the target group's unhealthy hosts to the deployment group with automatic rollback.
    - id: c
      text:
        en: |-
          Keep the all-at-once configuration, and turn on the deployment circuit breaker with rollback in the ECS service definition.
    - id: d
      text:
        en: |-
          Keep the all-at-once configuration, and set a longer wait time before the original task set is terminated after the deployment succeeds.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With an all-at-once configuration, the load balancer health checks start on the replacement task set after the traffic has been shifted, which is why the deployment looked successful. A canary configuration, supported with Application Load Balancers, shifts a small share first, and the alarm makes CodeDeploy roll back automatically while most traffic still goes to the original tasks.
  options:
    a:
      en: |-
        A longer grace period delays health checks; it does not stop a broken task set from receiving all the traffic, and nothing rolls back.
    c:
      en: |-
        The deployment circuit breaker applies to the rolling update deployment type of ECS, not to deployments controlled by CodeDeploy.
    d:
      en: |-
        Keeping the original task set allows a faster manual rollback, but nothing detects the failure or rolls back automatically.
references:
  - title: Troubleshoot Amazon ECS deployment issues - AWS CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-ecs.html
