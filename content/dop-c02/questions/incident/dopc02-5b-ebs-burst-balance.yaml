id: dopc02-5b-ebs-burst-balance
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A reporting application on an Amazon EC2 instance uses a 200 GiB gp2 data volume. Every night, the batch job is fast for the first 40 minutes and then slows down sharply until it ends hours later. CPU and memory use stay low. During the slow period, the volume's read and write operations settle at about 600 IOPS in total, and the BurstBalance metric of the volume is at 0 %. The company wants the job to run at its early speed for its whole duration without increasing the size of the volume.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the instance to a larger instance type with more vCPUs and memory.
    - id: b
      text:
        en: |-
          Change the volume type to gp3, which provides a baseline of 3,000 IOPS regardless of volume size.
    - id: c
      text:
        en: |-
          Increase the size of the gp2 volume to 400 GiB so that it earns I/O credits twice as fast.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on BurstBalance that reboots the instance when the balance reaches 0 %.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A gp2 volume gets a baseline of 3 IOPS per GiB, 600 IOPS for 200 GiB, and bursts to 3,000 IOPS while it has I/O credits; a BurstBalance of 0 % shows that the credits are exhausted, which explains the slowdown. gp3 sustains a 3,000 IOPS baseline without burst credits at any size, so the job keeps its early speed.
  options:
    a:
      en: |-
        CPU and memory are not the bottleneck; the volume is limited to its baseline IOPS.
    c:
      en: |-
        A larger volume breaks the size constraint, and a 400 GiB gp2 volume still has only a 1,200 IOPS baseline, below the 3,000 IOPS burst, so the job would still slow down once the credits run out.
    d:
      en: |-
        A reboot does not restore I/O credits, which are earned only when I/O demand drops to baseline or lower.
references:
  - title: Amazon EBS General Purpose SSD volumes - Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html
