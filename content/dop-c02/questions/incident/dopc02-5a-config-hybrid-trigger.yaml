id: dopc02-5a-config-hybrid-trigger
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has an AWS Config custom Lambda rule that checks whether each Amazon EC2 instance runs an AMI from a list of approved AMI IDs stored in a Parameter Store parameter. The rule must evaluate an instance as soon as the instance's configuration changes. The security team updates the approved list a few times a week, so the rule must also re-evaluate every instance at least once a day, even when the instances do not change.

    How should the rule be triggered?
body:
  options:
    - id: a
      text:
        en: |-
          Use a configuration change trigger whose scope is the AWS::EC2::Instance resource type, with no other trigger.
    - id: b
      text:
        en: |-
          Use a periodic trigger with a frequency of 24 hours, with no configuration change trigger.
    - id: c
      text:
        en: |-
          Use a periodic trigger with a frequency of 1 hour, with no configuration change trigger.
    - id: d
      text:
        en: |-
          Use a configuration change trigger for EC2 instances together with a periodic trigger with a 24-hour frequency.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A rule can combine both trigger types: AWS Config then evaluates resources when it detects a configuration change in the rule's scope and also at the chosen frequency. The change trigger covers instance changes immediately, and the 24-hour periodic trigger re-evaluates every instance after the approved list changes.
  options:
    a:
      en: |-
        A change trigger alone never re-evaluates instances that do not change, so an AMI removed from the approved list would stay COMPLIANT.
    b:
      en: |-
        A periodic trigger alone evaluates a changed instance only at the next run, up to 24 hours later, not as soon as it changes.
    c:
      en: |-
        A periodic trigger alone still evaluates a changed instance only at the next run, up to an hour later, not as soon as it changes.
references:
  - title: "Components of an AWS Config Rule - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config-rules.html
