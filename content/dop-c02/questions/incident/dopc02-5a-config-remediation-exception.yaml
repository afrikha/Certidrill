id: dopc02-5a-config-remediation-exception
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an AWS Config rule that checks that Amazon S3 buckets have versioning enabled, with automatic remediation through a Systems Manager Automation runbook. For a 30-day legal review, versioning must stay disabled on one bucket named claims-intake, which the rule currently reports as NON_COMPLIANT. During the review, the bucket must keep appearing as NON_COMPLIANT in compliance reports, and all other buckets must keep their automatic remediation. After 30 days, automatic remediation must apply to the bucket again without any manual step.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the remediation of the rule from automatic to manual for 30 days, and remediate the other noncompliant buckets manually during that period.
    - id: b
      text:
        en: |-
          Tag the claims-intake bucket, and change the scope of the rule so that it evaluates only buckets that do not have this tag for the next 30 days.
    - id: c
      text:
        en: |-
          Create a remediation exception for the claims-intake bucket on the rule, with an expiration time 30 days in the future and a message that explains the review.
    - id: d
      text:
        en: |-
          Delete the evaluation results of the rule for the claims-intake bucket every day so that the automatic remediation is never triggered for it.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A remediation exception removes a specific NON_COMPLIANT resource from automatic remediation for a rule, while the rule keeps evaluating and reporting it. The exception is deleted automatically at its expiration time, so automatic remediation applies to the bucket again after 30 days.
  options:
    a:
      en: |-
        Manual remediation applies to every resource of the rule, so the other buckets would lose their automatic remediation.
    b:
      en: |-
        A bucket outside the rule's scope is no longer evaluated, so it would not appear as NON_COMPLIANT, and someone would have to change the scope back after 30 days.
    d:
      en: |-
        The rule evaluates the bucket again after the results are deleted, so remediation can still run, and the daily task is manual work.
references:
  - title: "PutRemediationExceptions - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/APIReference/API_PutRemediationExceptions.html
