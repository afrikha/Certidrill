id: dopc02-5a-config-auto-remediation-retries
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an AWS Config rule with automatic remediation that runs a Systems Manager Automation runbook to enable default encryption on noncompliant resources. Occasionally, the runbook fails because of a transient API throttling error, and the resource then stays noncompliant until an engineer notices it and starts the remediation by hand. The company wants these transient failures to be handled without human action.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the trigger of the rule to periodic with a 1-hour frequency so that the rule evaluates the resource again every hour.
    - id: b
      text:
        en: |-
          Configure the automatic remediation of the rule with a number of retries and a retry period, for example 5 attempts within 300 seconds.
    - id: c
      text:
        en: |-
          Add a remediation exception for every resource whose remediation fails so that AWS Config tries the remediation again later.
    - id: d
      text:
        en: |-
          Configure an Amazon SNS notification for the rule, and have the engineers subscribe to it so that they can start the remediation sooner.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Automatic remediation can be set to try again when a resource is still noncompliant after a remediation attempt: the retries and the period in seconds are part of the remediation configuration. Retries occur only when the remediation fails and within the specified period, which covers transient errors such as throttling.
  options:
    a:
      en: |-
        A new evaluation finds the resource NON_COMPLIANT again, but it does not retry a remediation execution that failed.
    c:
      en: |-
        A remediation exception does the opposite: it removes the resource from automatic remediation until the exception is cleared.
    d:
      en: |-
        Notifications make the engineers react faster, but the remediation still depends on human action.
references:
  - title: "Setting Up Auto Remediation for AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
