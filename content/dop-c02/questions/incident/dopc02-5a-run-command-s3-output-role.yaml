id: dopc02-5a-run-command-s3-output-role
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A DevOps engineer uses Systems Manager Run Command to apply a configuration script to 200 Amazon EC2 instances and needs the complete output of every invocation for an audit. The engineer selected the option to write command output to an Amazon S3 bucket and specified the bucket and prefix. The engineer's IAM user has s3:PutObject permission on the bucket, and the bucket policy does not deny access. The commands succeed, but no output objects appear in the bucket.

    What should the engineer do to make the output appear in the bucket?
body:
  options:
    - id: a
      text:
        en: |-
          Add s3:PutObject permission for the bucket and prefix to the IAM role of the instance profile that is attached to the instances.
    - id: b
      text:
        en: |-
          Add a bucket policy statement that allows the ssm.amazonaws.com service principal to write objects to the bucket and prefix.
    - id: c
      text:
        en: |-
          Turn on Amazon SNS notifications for the command so that Systems Manager sends the output to the bucket through the topic.
    - id: d
      text:
        en: |-
          Turn on S3 server access logging for the bucket so that the write requests from Systems Manager are recorded and accepted.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The permissions used to write Run Command output to S3 are those of the instance profile for EC2 instances (or the IAM service role for hybrid nodes), not those of the user who runs the command. The instance profile's role must therefore allow s3:PutObject on the bucket and prefix.
  options:
    b:
      en: |-
        The output is written from the managed node with the node's credentials, not by the Systems Manager service principal.
    c:
      en: |-
        SNS notifications report the status of the command; they do not deliver output to the bucket.
    d:
      en: |-
        Server access logging records requests; it does not grant permissions or change whether writes succeed.
references:
  - title: "Running commands from the console - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-commands-console.html
