id: dopc02-5a-sources-needing-setup
objective: "5.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A DevOps engineer is preparing a new AWS account for a workload in us-east-1. The account has default settings: no AWS CloudTrail trail exists and no Amazon S3 bucket has any notification configured. The engineer creates five Amazon EventBridge rules on the default event bus in us-east-1, one for each of the following event types, and targets an Amazon SNS topic. The engineer wants to know which rules will not receive any event until an additional configuration is made outside EventBridge.

    Which rules will not receive events until additional configuration is made? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          A rule for Object Created events from an S3 bucket named media-uploads in the account.
    - id: b
      text:
        en: |-
          A rule for EC2 Instance State-change Notification events for the account's instances.
    - id: c
      text:
        en: |-
          A rule for AWS API Call via CloudTrail events for the ec2 RunInstances API.
    - id: d
      text:
        en: |-
          A rule for CloudWatch Alarm State Change events for the account's alarms.
    - id: e
      text:
        en: |-
          A rule for AWS Health events about scheduled changes to the account's resources.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      S3 sends bucket events to EventBridge only after EventBridge notifications are turned on for the bucket. Events with the AWS API Call via CloudTrail detail-type require a CloudTrail trail with logging enabled. EC2 state changes, CloudWatch alarm state changes, and AWS Health events reach the default bus without extra setup.
  options:
    b:
      en: |-
        Amazon EC2 sends instance state-change events to the default event bus automatically.
    d:
      en: |-
        CloudWatch sends an event to EventBridge whenever an alarm changes state, without any configuration.
    e:
      en: |-
        AWS Health delivers events about the account to EventBridge rules without additional configuration.
references:
  - title: "Using EventBridge - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
  - title: "AWS service events delivered via AWS CloudTrail - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
