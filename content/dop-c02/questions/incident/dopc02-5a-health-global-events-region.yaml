id: dopc02-5a-health-global-events-region
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs all its workloads in eu-west-1 and eu-central-1. A DevOps engineer created an Amazon EventBridge rule for aws.health events in each of the two Regions, and each rule sends the events to the company's ticketing integration. Last month, AWS Health published an event about AWS Identity and Access Management (IAM) that affected the company's account, but no ticket was created, although tickets are created as expected for Amazon EC2 and Amazon RDS events in both Regions.

    What should the DevOps engineer do so that tickets are also created for events like this one?
body:
  options:
    - id: a
      text:
        en: |-
          Add IAM to the list of services in the event pattern of the two existing rules in eu-west-1 and eu-central-1.
    - id: b
      text:
        en: |-
          Create the same rule in us-west-2, because AWS Health sends the events of all other Regions to that Region as backup events.
    - id: c
      text:
        en: |-
          Turn on AWS Health organizational view so that events that are not specific to a Region reach the rules in every Region.
    - id: d
      text:
        en: |-
          Create the same rule in us-east-1, because AWS Health delivers global events, such as IAM events, in that Region.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS Health events that are not specific to a Region are global events, and IAM events are among them. To receive global events, a rule must exist in US East (N. Virginia), so adding the same rule and target there closes the gap.
  options:
    a:
      en: |-
        The rules in the EU Regions never receive global events, so adding IAM to their patterns changes nothing.
    b:
      en: |-
        US West (Oregon) is the backup Region that receives copies of regional events from the other Regions; global events are delivered in US East (N. Virginia).
    c:
      en: |-
        Organizational view aggregates events from several accounts; it does not change the Region in which global events are delivered.
references:
  - title: "Creating EventBridge rules for AWS Region coverage - AWS Health"
    url: https://docs.aws.amazon.com/health/latest/ug/choosing-a-region.html
