id: dopc02-5a-config-retention-history
objective: "5.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's data retention policy requires that the AWS Config configuration history of its production account be kept for exactly 1 year and then deleted. AWS Config uses the default retention settings and delivers configuration history and snapshot files to an Amazon S3 bucket that is used only for this purpose. The configuration recorder must keep running without interruption.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the AWS Config retention period for configuration items to 365 days instead of the default of 7 years.
    - id: b
      text:
        en: |-
          Change the recording frequency of the configuration recorder to daily so that AWS Config keeps fewer configuration items.
    - id: c
      text:
        en: |-
          Stop the configuration recorder at the end of each year so that AWS Config deletes the configuration items of the previous year.
    - id: d
      text:
        en: |-
          Add an S3 Lifecycle rule to the delivery bucket that expires objects 365 days after they are created.
    - id: e
      text:
        en: |-
          Change the delivery frequency of configuration snapshots from every hour to every 24 hours.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      AWS Config keeps configuration items for 7 years by default, and the retention period can be set between 30 days and 7 years, after which older data is deleted from AWS Config's own store. Files delivered to Amazon S3 follow S3's own retention, so a Lifecycle expiration rule on the delivery bucket is also needed.
  options:
    b:
      en: |-
        Daily recording changes how often configuration items are created, not how long they are kept.
    c:
      en: |-
        Stopping the recorder interrupts recording, which is not allowed, and it does not delete past configuration items.
    e:
      en: |-
        The snapshot delivery frequency controls how often files are written to S3; it does not delete any history.
references:
  - title: "Deleting AWS Config Data - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/delete-config-data-with-retention-period.html
