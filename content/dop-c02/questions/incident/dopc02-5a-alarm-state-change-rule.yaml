id: dopc02-5a-alarm-state-change-rule
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has about 300 Amazon CloudWatch alarms that many teams created over several years. The names of the production alarms start with prod-, and the alarms have different actions or no actions at all. The operations team has an AWS Lambda function that opens a ticket for an alarm. A ticket must be opened every time any production alarm changes to the ALARM state, including alarms created later, and the team does not want to modify the existing alarms.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an Amazon SNS action for the ALARM state to every existing production alarm, and subscribe the Lambda function to that SNS topic.
    - id: b
      text:
        en: |-
          Create a composite alarm whose rule combines all the production alarms with OR, and add an alarm action that invokes the Lambda function.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule for CloudWatch Alarm State Change events with a prod- prefix match on the alarm name and the ALARM state, targeting the function.
    - id: d
      text:
        en: |-
          Create a CloudWatch metric stream for all namespaces, and have the Lambda function evaluate the alarm thresholds on the streamed metrics.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CloudWatch sends an event to EventBridge whenever an alarm changes state, with source aws.cloudwatch, detail-type CloudWatch Alarm State Change, and fields such as detail.alarmName and detail.state.value. A rule with prefix matching on the alarm name and a match on the ALARM state covers existing and future production alarms without touching them.
  options:
    a:
      en: |-
        This modifies all existing alarms, and every alarm created later would also need the action added by hand.
    b:
      en: |-
        A composite alarm must be updated for each new alarm, and it changes state only once while any child alarm is in ALARM, so later child transitions would not open their own tickets.
    d:
      en: |-
        Metric streams send metric data, not alarm states, and re-evaluating thresholds in the function duplicates the alarms with custom code.
references:
  - title: "Alarm events and EventBridge - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-and-eventbridge.html
