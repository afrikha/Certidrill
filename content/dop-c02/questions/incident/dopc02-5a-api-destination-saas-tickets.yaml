id: dopc02-5a-api-destination-saas-tickets
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a third-party SaaS incident management tool that exposes a public HTTPS REST API. Each request must include an API key in a header, and the vendor rejects more than 10 requests per second. The company wants AWS Health events and Amazon GuardDuty findings from its account to create incidents in the tool. Events that cannot be delivered must be kept for investigation. The company does not want to write or host any code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an EventBridge rule that invokes an AWS Lambda function, which reads the API key from AWS Secrets Manager, calls the vendor API, and retries with backoff when it receives errors.
    - id: b
      text:
        en: |-
          Create an EventBridge connection with API key authorization, an API destination for the vendor endpoint with an invocation rate limit of 10 per second, and a rule that targets it with a dead-letter queue.
    - id: c
      text:
        en: |-
          Create an EventBridge connection with API key authorization and an API destination for the vendor endpoint with no invocation rate limit, and a rule that targets it without a dead-letter queue.
    - id: d
      text:
        en: |-
          Create an AWS Systems Manager Incident Manager response plan for the events, and integrate the response plan with the vendor's incident tool.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An API destination is an HTTPS endpoint that a rule can invoke directly, and its connection holds the authorization, such as an API key, in a secret that EventBridge creates in Secrets Manager. The invocation rate limit keeps calls under the vendor's limit, and a dead-letter queue on the target keeps the events that still fail after the retries.
  options:
    a:
      en: |-
        This works, but the Lambda function is code that the company would have to write and host, which the requirements exclude.
    c:
      en: |-
        Without a rate limit the rule can exceed the vendor's 10 requests per second, and without a dead-letter queue the events that still fail after the retries are dropped.
    d:
      en: |-
        AWS Systems Manager Incident Manager has been closed to new customers since November 7, 2025, and it is not needed to call a third-party API from EventBridge.
references:
  - title: "API destinations as targets in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-api-destinations.html
