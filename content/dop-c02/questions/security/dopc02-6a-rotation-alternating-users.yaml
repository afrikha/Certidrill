id: dopc02-6a-rotation-alternating-users
objective: "6.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payment application connects to an Amazon Aurora PostgreSQL DB cluster with a database user named app_user. The credentials are stored in an AWS Secrets Manager secret that a Lambda rotation function rotates every 30 days with the single user strategy. During each rotation, some new connections are refused for a short time, which causes failed payments. The application must always get valid credentials, including while a rotation is running, and its code must not change. The secret for the cluster's master user is also stored in Secrets Manager.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the single user strategy, and rotate the secret every day so that each rotation changes the password for a shorter period of time.
    - id: b
      text:
        en: |-
          Keep the single user strategy, and replicate the secret to a second Region so that the application can read the replica while the primary secret rotates.
    - id: c
      text:
        en: |-
          Switch to a rotation function that uses the alternating users strategy, and give it the master user secret so that it can manage the cloned user.
    - id: d
      text:
        en: |-
          Turn on the ManageMasterUserPassword setting of the DB cluster so that Amazon RDS takes over the rotation of the app_user secret with managed rotation.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With the alternating users strategy, Secrets Manager rotates between two database users, so the credentials that the application receives during rotation are still valid. Because a user usually cannot clone itself, the rotation function needs a superuser secret, here the master user secret.
  options:
    a:
      en: |-
        More frequent rotation creates more short windows in which connections can be refused.
    b:
      en: |-
        Replicas receive the same rotated value, so they do not provide a second valid credential during rotation.
    d:
      en: |-
        Managed master user passwords apply to the master user only; app_user would still be rotated by the single user function.
references:
  - title: "Lambda function rotation strategies - AWS Secrets Manager"
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotation-strategy.html
