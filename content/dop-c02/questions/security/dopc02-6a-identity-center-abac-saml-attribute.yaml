id: dopc02-6a-identity-center-abac-saml-attribute
objective: "6.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses IAM Identity Center with an external SAML 2.0 identity provider (IdP) and SCIM provisioning. The company wants permission set policies to compare a user's cost center with the CostCenter tag on resources. The IdP holds each user's cost center, but the attribute is not part of the attributes that the IdP provisions to the Identity Center directory through SCIM, and the IdP team cannot change the SCIM mapping. The IdP team can add attributes to the SAML assertion.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Have the IdP send the cost center as a SAML attribute named https://aws.amazon.com/SAML/Attributes/PrincipalTag:CostCenter, and use aws:PrincipalTag/CostCenter in the permission set policies.
    - id: b
      text:
        en: |-
          Select a CostCenter attribute that maps to the Identity Center directory on the Attributes for access control page, and use aws:PrincipalTag/CostCenter in the permission set policies.
    - id: c
      text:
        en: |-
          Add a CostCenter tag to the IAM role that Identity Center creates for the permission set in each account, and use aws:PrincipalTag/CostCenter in the permission set policies.
    - id: d
      text:
        en: |-
          Have the IdP send the cost center as a SAML attribute named https://aws.amazon.com/SAML/Attributes/AccessControl:CostCenter, and use aws:PrincipalTag/CostCenter in the permission set policies.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With an external IdP, Identity Center accepts attributes for access control directly from the SAML assertion when they are named https://aws.amazon.com/SAML/Attributes/AccessControl:TagKey. Identity Center passes them to the account as session tags, which policies read with aws:PrincipalTag. No directory mapping is needed.
  options:
    a:
      en: |-
        The PrincipalTag attribute name is used for session tags in federation through an IAM SAML provider, not for Identity Center attributes for access control.
    b:
      en: |-
        Mapped attributes take their values from the Identity Center directory, which does not contain the cost center because SCIM does not provision it.
    c:
      en: |-
        A tag on the role is the same for every user of the permission set, so it cannot carry each user's cost center.
references:
  - title: "Attributes for access control - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/attributesforaccesscontrol.html
