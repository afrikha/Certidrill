id: dopc02-6b-acm-dns-validation-renewal
objective: "6.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company buys a TLS certificate for shop.example.com from a third-party certificate authority every year and imports it into AWS Certificate Manager (ACM) for an Application Load Balancer. The certificate expired twice in the past because nobody reimported the renewed certificate in time. The example.com domain is hosted in Amazon Route 53, and the company has no contractual reason to keep the third-party authority. The company wants certificate renewal to require no manual steps.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep importing the third-party certificate, and create an Amazon EventBridge rule that emails the operations team when the certificate approaches expiration.
    - id: b
      text:
        en: |-
          Request a public certificate from ACM with email validation, and associate it with the load balancer listener instead of the imported certificate.
    - id: c
      text:
        en: |-
          Request an ACM public certificate with DNS validation, create its CNAME record in Route 53, and associate the certificate with the listener.
    - id: d
      text:
        en: |-
          Create an AWS Lambda function that downloads the renewed certificate from the third-party authority every month and reimports it into ACM.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      ACM renews DNS-validated certificates automatically as long as the certificate is in use and the validation CNAME record stays in place, so no one has to act at renewal time. Imported certificates are never renewed by ACM, which is the cause of the past outages.
  options:
    a:
      en: |-
        A reminder still leaves a manual reimport at every renewal, which is the step that failed twice.
    b:
      en: |-
        Email-validated certificates need someone to respond to the validation email; ACM renews certificates without manual action when DNS validation is used.
    d:
      en: |-
        The Lambda function is custom code that depends on the third-party authority's process; an ACM-issued, DNS-validated certificate renews without any code.
references:
  - title: "AWS Certificate Manager DNS validation - AWS Certificate Manager"
    url: https://docs.aws.amazon.com/acm/latest/userguide/dns-validation.html
  - title: "Managed certificate renewal in AWS Certificate Manager - AWS Certificate Manager"
    url: https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html
