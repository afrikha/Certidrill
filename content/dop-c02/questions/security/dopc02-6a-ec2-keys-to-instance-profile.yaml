id: dopc02-6a-ec2-keys-to-instance-profile
objective: "6.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An application on 30 running Amazon EC2 instances reads messages from an Amazon SQS queue. It uses the AWS SDK default credential provider chain, and the access keys of an IAM user are stored in the ~/.aws/credentials file on each instance. No instance has an IAM role today. The security team requires that the instances stop using long-term credentials. The instances must not be stopped or restarted, and the application code must not change.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a profile with role_arn and source_profile settings to the credentials file so that the application assumes a role by using the IAM user's access keys.
    - id: b
      text:
        en: |-
          Stop each instance in a maintenance window, attach an instance profile with the SQS permissions while the instance is stopped, and start the instance again.
    - id: c
      text:
        en: |-
          Store the IAM user's access keys in AWS Secrets Manager with automatic rotation, and change the application to read the keys from Secrets Manager at startup.
    - id: d
      text:
        en: |-
          Create an IAM role with the SQS permissions and an instance profile for it, and attach the instance profile to each running instance with the associate-iam-instance-profile command.
    - id: e
      text:
        en: |-
          Delete the credentials file from each instance so that the SDK default credential provider chain uses the credentials of the role attached to the instance.
answer: { optionIds: [d, e] }
explanation:
  correct:
    en: |-
      An instance profile can be attached to a running instance without a stop or restart, and the application then receives temporary role credentials from the instance metadata service. The SDK default chain reads the shared credentials file before it falls back to the instance role, so the file with the access keys must be removed for the role credentials to be used.
  options:
    a:
      en: |-
        The role would still be assumed with the IAM user's long-term access keys stored on the instances.
    b:
      en: |-
        An instance profile can be attached to a running instance, and the instances must not be stopped.
    c:
      en: |-
        The application code would change, and the instances would still use long-term IAM user access keys.
references:
  - title: "Attach an IAM role to an instance - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/attach-iam-role.html
