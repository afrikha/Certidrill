id: dopc02-6a-multi-region-secret-replica
objective: "6.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application in us-east-1 with a warm standby in eu-west-1. Both copies connect to an Amazon Aurora global database with the same database user, whose credentials are in an AWS Secrets Manager secret in us-east-1 that rotates every 30 days. During a Regional failover test, the eu-west-1 application could not read the secret while us-east-1 was unavailable. The standby must read the current credentials from its own Region, and the company does not want to write code to keep the secrets synchronized.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replicate the secret to eu-west-1, keep rotation turned on for the primary secret, and configure the eu-west-1 application to read the replica secret.
    - id: b
      text:
        en: |-
          Create an EventBridge rule for rotation events in us-east-1 that invokes a Lambda function, which writes the new value to a secret in eu-west-1.
    - id: c
      text:
        en: |-
          Configure the eu-west-1 application to read the secret in us-east-1 at startup and to cache the value until its next restart.
    - id: d
      text:
        en: |-
          Create a separate secret in eu-west-1 for the same database user, turn on rotation every 30 days for it, and configure the eu-west-1 application to read it.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A replica secret is kept in sync with its primary: when the primary rotates, the new value propagates to every replica, so rotation is not managed separately. The standby reads the replica in its own Region even when us-east-1 is unavailable.
  options:
    b:
      en: |-
        This is synchronization code to build and maintain, which the company wants to avoid.
    c:
      en: |-
        The standby still depends on us-east-1 at startup and would keep stale credentials after a rotation.
    d:
      en: |-
        Two independent rotations would set different passwords for the same database user, so one of the secrets would always be wrong.
references:
  - title: "Replicate AWS Secrets Manager secrets across Regions - AWS Secrets Manager"
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/create-manage-multi-region-secrets.html
