id: dopc02-6b-private-ca-internal-alb
objective: "6.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company runs internal web applications behind internal Application Load Balancers. The applications use host names in the corp.internal domain, which exists only in an Amazon Route 53 private hosted zone. The company's security policy requires TLS for all internal traffic with certificates issued by a private certificate authority that the company controls; the company can distribute the authority's root certificate to all managed laptops. Certificates must renew without manual work, and the company does not want to operate certificate authority servers.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Request public certificates from AWS Certificate Manager (ACM) for the corp.internal host names with DNS validation, and create the validation records in the private hosted zone.
    - id: b
      text:
        en: |-
          Create a CA in AWS Private CA, distribute its root certificate to the laptops, and use private certificates from ACM on the load balancers.
    - id: c
      text:
        en: |-
          Generate self-signed certificates with an AWS Lambda function every 90 days, and import them into ACM for the load balancers.
    - id: d
      text:
        en: |-
          Create an AWS CloudHSM cluster, generate the certificates' key pairs in the HSMs, and upload the certificates to the load balancers.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Private CA is a managed private certificate authority that the company controls without running CA servers, and its root certificate can be distributed to the laptops. Private certificates requested through ACM and associated with an AWS service such as Elastic Load Balancing are eligible for managed renewal, so no CA server or manual renewal is needed.
  options:
    a:
      en: |-
        Public certificates require domain validation through public DNS; records in a private hosted zone cannot prove control of corp.internal to ACM.
    c:
      en: |-
        Self-signed certificates are not issued by a company certificate authority, and imported certificates are not renewed by ACM; the Lambda function is custom renewal code.
    d:
      en: |-
        CloudHSM stores keys in HSMs that the company manages; it is not a certificate authority and does not issue or renew certificates.
references:
  - title: "Managed certificate renewal in AWS Certificate Manager - AWS Certificate Manager"
    url: https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html
  - title: "Attach a policy for cross-account access - AWS Private Certificate Authority"
    url: https://docs.aws.amazon.com/privateca/latest/userguide/pca-ram.html
