id: dopc02-6b-flow-log-custom-format-recreate
objective: "6.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company publishes VPC flow logs in the default format to an S3 bucket. During an investigation, analysts found that the logs show the address of a NAT gateway instead of the original source of the traffic, and that they cannot tell the direction of each flow. The security team wants future records to include the pkt-srcaddr, pkt-dstaddr, and flow-direction fields. The analysts' Athena queries will be updated for the new format.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Modify the existing flow log to use a custom record format that adds the pkt-srcaddr, pkt-dstaddr, and flow-direction fields.
    - id: b
      text:
        en: |-
          Create a new flow log with a custom format that includes the default fields and the three new fields, and then delete the existing one.
    - id: c
      text:
        en: |-
          Add the three fields to the Athena table definition so that they are extracted from the existing records.
    - id: d
      text:
        en: |-
          Replace the flow log with VPC Traffic Mirroring sessions that send the traffic of every network interface to a packet analysis appliance.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The record format of a flow log is chosen when the flow log is created and cannot be changed afterward. To add the pkt-srcaddr, pkt-dstaddr and flow-direction fields, create a new flow log with a custom format that includes them, then delete the old flow log.
  options:
    a:
      en: |-
        A flow log's configuration and record format cannot be modified after creation.
    c:
      en: |-
        The default format does not contain these fields, so a different table definition cannot extract them.
    d:
      en: |-
        Traffic Mirroring copies packets for deep inspection; it is far more costly and complex than adding fields to flow log records.
references:
  - title: "Flow log limitations - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-limitations.html
  - title: "Flow log records - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html
