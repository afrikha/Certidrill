id: dopc02-6b-acm-cloudfront-us-east-1
objective: "6.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company deploys all of its infrastructure to the eu-west-1 Region with an AWS CloudFormation pipeline. A new stack in eu-west-1 requests an AWS Certificate Manager (ACM) certificate for www.example.com with DNS validation and creates an Amazon CloudFront distribution that references the certificate ARN for HTTPS between viewers and CloudFront. The certificate is issued, but the stack fails when it creates the distribution because the certificate cannot be used. The company wants to keep using ACM-managed certificates that renew automatically.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Request the certificate in the us-east-1 Region with DNS validation, for example from a separate stack, and pass its ARN to the distribution.
    - id: b
      text:
        en: |-
          Export the eu-west-1 certificate and import it into ACM in the us-east-1 Region, and reference the imported certificate in the distribution.
    - id: c
      text:
        en: |-
          Request the certificate again in eu-west-1 with email validation instead of DNS validation, and reference the new ARN in the distribution.
    - id: d
      text:
        en: |-
          Associate the eu-west-1 certificate with the Application Load Balancer origin, and configure the distribution to forward HTTPS requests to the origin.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      To use an ACM certificate for HTTPS between viewers and CloudFront, the certificate must be requested or imported in the US East (N. Virginia) Region, us-east-1. A DNS-validated certificate requested there stays managed by ACM and renews automatically.
  options:
    b:
      en: |-
        An imported certificate is not renewed by ACM, so this breaks the requirement for automatic renewal.
    c:
      en: |-
        The validation method is not the problem; a certificate in eu-west-1 cannot be used by CloudFront whatever its validation method.
    d:
      en: |-
        A certificate on the origin secures CloudFront-to-origin traffic only; viewers still connect to the distribution, which needs its own certificate from us-east-1.
references:
  - title: "Requirements for using SSL/TLS certificates with CloudFront - Amazon CloudFront"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html
