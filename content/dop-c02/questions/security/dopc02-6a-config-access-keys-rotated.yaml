id: dopc02-6a-config-access-keys-rotated
objective: "6.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 45 accounts in AWS Organizations. A few third-party tools still require IAM user access keys, and the security standard says that every active access key must be rotated at least every 90 days. The security team needs a continuously updated compliance view, across all accounts, of the IAM users whose active access keys exceed that age. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Schedule a Lambda function in each account that reads the IAM credential report and writes keys older than 90 days to a central DynamoDB table.
    - id: b
      text:
        en: |-
          Deploy the access-keys-rotated AWS Config managed rule with maxAccessKeyAge set to 90 as an organization rule, and view compliance in an aggregator.
    - id: c
      text:
        en: |-
          Create an IAM Access Analyzer unused access analyzer for the organization, and review its findings for unused access keys every week.
    - id: d
      text:
        en: |-
          Enable Amazon GuardDuty for the organization, and review the findings that GuardDuty reports for IAM user access keys.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The access-keys-rotated managed rule checks periodically whether active IAM access keys were rotated within maxAccessKeyAge days, 90 by default, and reports noncompliant users. Deployed as an organization rule with an aggregator, it gives one compliance view without custom code. The rule does not cover root user access keys.
  options:
    a:
      en: |-
        This is custom code to build and maintain in every account.
    c:
      en: |-
        Unused access findings report keys that are not used; a key used every day but never rotated would not appear.
    d:
      en: |-
        GuardDuty reports suspicious use of credentials, not the age of access keys.
references:
  - title: "access-keys-rotated - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/access-keys-rotated.html
