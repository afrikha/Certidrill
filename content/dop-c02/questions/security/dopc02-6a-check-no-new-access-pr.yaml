id: dopc02-6a-check-no-new-access-pr
objective: "6.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team stores the IAM policies of 120 roles as JSON files in a Git repository, and an AWS CodePipeline pipeline deploys merged changes with AWS CloudFormation. Many pull requests only reorganize statements or remove permissions, and the security team wants those changes to merge without its review. A pull request that would allow any access that the currently approved version of a policy does not allow must fail its build and wait for a security review. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          In the pull request build, run the IAM Access Analyzer check-no-public-access command for each changed policy, and fail the build when the command reports that the policy grants public access.
    - id: b
      text:
        en: |-
          In the pull request build, run the IAM Access Analyzer check-no-new-access command for each changed policy with the approved version as the existing policy, and fail the build when the result is FAIL.
    - id: c
      text:
        en: |-
          Create an IAM Access Analyzer unused access analyzer for the account, and send its findings to the security team for review after the pipeline deploys each change.
    - id: d
      text:
        en: |-
          In the pull request build, run the IAM Access Analyzer check-access-not-granted command for each changed policy with a list of sensitive actions, and fail the build when the result is FAIL.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The CheckNoNewAccess custom policy check compares an updated policy with an existing version and reports whether the update grants new access. Running it in the pull request build blocks only the changes that add access, so reorganizations and removals pass without review.
  options:
    a:
      en: |-
        CheckNoPublicAccess checks whether a resource policy allows public access; it does not detect new access granted to roles.
    c:
      en: |-
        Unused access findings appear after deployment and report permissions that are not used, not permissions that a change adds.
    d:
      en: |-
        CheckAccessNotGranted only checks the listed actions, so new access to any action outside the list would pass.
references:
  - title: "Validate policies with IAM Access Analyzer custom policy checks - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-custom-policy-checks.html
