id: dopc02-6a-third-party-key-rotation
objective: "6.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's order service calls a third-party shipping API with an API key. The key is stored in an encrypted configuration file in the application's Amazon S3 bucket, and an engineer creates a new key in the provider's portal and updates the file every 30 days. The provider offers an API to create and revoke keys. The company wants the key rotated automatically every 30 days and wants the application to read the current key at run time.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Store the key as an advanced SecureString parameter in Systems Manager Parameter Store, and attach a parameter policy with an expiration of 30 days.
    - id: b
      text:
        en: |-
          Keep the key in the S3 bucket, and add an S3 Lifecycle rule that expires the configuration file every 30 days so that a new file is created.
    - id: c
      text:
        en: |-
          Store the key in AWS Secrets Manager, and rotate it every 30 days with a Lambda function that replaces the key through the provider's API.
    - id: d
      text:
        en: |-
          Encrypt the configuration file with an AWS KMS customer managed key, and turn on automatic key rotation for that KMS key.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Secrets Manager rotates secrets on a schedule. For secrets that are not managed by an AWS service, rotation runs a Lambda function that updates both the secret and the external service, here by calling the provider's API. The application reads the current value from Secrets Manager.
  options:
    a:
      en: |-
        A parameter policy can expire or flag a parameter, but it does not create a new key at the provider; Parameter Store has no built-in rotation, so the update would be custom work.
    b:
      en: |-
        A Lifecycle rule only deletes the object; it does not create a new key at the provider.
    d:
      en: |-
        Rotating the KMS key changes the key material that encrypts data; it does not change the third-party API key.
references:
  - title: "Rotate AWS Secrets Manager secrets - AWS Secrets Manager"
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html
