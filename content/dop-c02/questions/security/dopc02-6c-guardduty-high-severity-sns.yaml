id: dopc02-6c-guardduty-high-severity-sns
objective: "6.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses Amazon GuardDuty in 25 accounts of its organization in AWS Organizations. The Security Tooling account is the GuardDuty delegated administrator, and all member accounts are associated with it in us-east-1, the only Region in use. The on-call security engineers must receive an email within minutes of every new high or critical severity finding from any account. Low and medium severity findings must not be sent.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          In the Security Tooling account, create an EventBridge rule for GuardDuty Finding events whose detail.severity is numerically 7 or higher, with an SNS topic that emails the engineers as the target.
    - id: b
      text:
        en: |-
          In each member account, create an EventBridge rule for GuardDuty Finding events whose detail.severity is numerically 7 or higher, with an SNS topic that emails the engineers as the target.
    - id: c
      text:
        en: |-
          In the Security Tooling account, create a CloudWatch alarm on the GuardDuty findings metric with a threshold of 7, with an SNS topic that emails the engineers as the alarm action.
    - id: d
      text:
        en: |-
          In the Security Tooling account, export the findings to an S3 bucket, and schedule a Lambda function every hour that emails the engineers the findings with a severity of 7 or higher.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      GuardDuty sends new findings to EventBridge in near real time with the source aws.guardduty and the detail type GuardDuty Finding. High severity starts at 7.0 and critical covers 9.0 to 10.0, so a numeric match of 7 or higher selects both. Rules in the delegated administrator account also match the findings of member accounts, so one rule and one SNS topic are enough.
  options:
    b:
      en: |-
        This works but requires a rule and a topic in 25 accounts, when the administrator account already receives the member findings.
    c:
      en: |-
        GuardDuty findings are delivered as events, not as a CloudWatch metric with a severity value that an alarm could evaluate.
    d:
      en: |-
        An hourly job adds custom code and does not notify the engineers within minutes of a new finding.
references:
  - title: Processing GuardDuty findings with Amazon EventBridge - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_cloudwatch.html
  - title: Severity levels of GuardDuty findings - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings-severity.html
