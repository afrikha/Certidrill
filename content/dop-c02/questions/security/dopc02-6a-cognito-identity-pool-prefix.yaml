id: dopc02-6a-cognito-identity-pool-prefix
objective: "6.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's mobile app lets signed-in users upload photos directly to an S3 bucket. Users sign in through an Amazon Cognito user pool. The app must call Amazon S3 with temporary AWS credentials, and each user must be able to read and write only the objects under a prefix that is unique to that user. The company does not want to run a backend service that issues credentials or presigned URLs.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Cognito identity pool with the user pool as its provider, give the authenticated role access to the whole bucket, and have the app add the user ID to each object key.
    - id: b
      text:
        en: |-
          Create a Cognito identity pool with the user pool as its provider, and give the authenticated role access only to the bucket path ${cognito-identity.amazonaws.com:sub}/*.
    - id: c
      text:
        en: |-
          Create a Cognito identity pool that allows unauthenticated identities, and give the guest role access only to the bucket path ${cognito-identity.amazonaws.com:sub}/*.
    - id: d
      text:
        en: |-
          Create an IAM user for each app user with a policy for that user's prefix, and send the user's access keys to the app after each successful sign-in.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Cognito identity pool exchanges the user pool token for temporary credentials of the authenticated role. The ${cognito-identity.amazonaws.com:sub} policy variable resolves to the caller's identity ID, so one role policy restricts every user to a prefix named after their own identity.
  options:
    a:
      en: |-
        Every user's credentials could read and overwrite other users' objects; the app's key naming does not restrict the credentials.
    c:
      en: |-
        Unauthenticated identities do not require a sign-in, so anyone with the app could obtain credentials; the uploads are for signed-in users.
    d:
      en: |-
        IAM users have long-term access keys, which do not meet the temporary credentials requirement and do not scale to app users.
references:
  - title: "IAM roles - Amazon Cognito"
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/iam-roles.html
