id: dopc02-6b-waf-rate-scope-down
objective: "6.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company serves its website through an Amazon CloudFront distribution with an Application Load Balancer origin, and an AWS WAF web ACL is associated with the distribution. Attackers send bursts of credential stuffing requests to the /login path from a few hundred IP addresses that change every day. Many legitimate customers browse the catalog pages from large corporate networks that share a single public IP address, and these customers generate high request rates. The security team must limit the request rate of each IP address to the /login path only, without affecting catalog traffic.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a rate-based rule to the web ACL that aggregates requests by IP address, with a scope-down statement that matches the /login URI path, and set its action to Block.
    - id: b
      text:
        en: |-
          Add a rate-based rule to the web ACL that aggregates requests by IP address for all paths, with a limit high enough for the corporate networks, and set its action to Block.
    - id: c
      text:
        en: |-
          Add the attacking IP addresses to a deny rule in the network ACL of the ALB subnets each day, and allow all other traffic.
    - id: d
      text:
        en: |-
          Subscribe to AWS Shield Advanced, add the distribution as a protected resource, and associate an Amazon Route 53 health check with it.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A rate-based rule counts requests per aggregation key, such as the IP address, and rate limits keys that exceed the limit. A scope-down statement narrows the requests the rule tracks, so only /login requests count toward the limit and catalog traffic from shared corporate IP addresses is not affected.
  options:
    b:
      en: |-
        Without a scope-down statement, all paths count toward the limit, so either the limit is too high to stop the /login bursts or the shared corporate IP addresses get blocked on catalog pages.
    c:
      en: |-
        Behind CloudFront, the ALB subnets see CloudFront addresses rather than client addresses, and a daily manual update cannot follow IP addresses that change every day.
    d:
      en: |-
        Shield Advanced with health-based detection improves DDoS detection and response; it does not rate limit one URI path for each client IP address.
references:
  - title: "Using rate-based rule statements in AWS WAF - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html
