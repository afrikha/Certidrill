id: dopc02-6a-boundary-delegate-role-creation
objective: "6.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Developers in a shared development account deploy AWS Lambda functions and must create the execution roles for their functions themselves. The security team created a customer managed policy named DevRoleBoundary that defines the maximum permissions of any role that a developer creates. Developers must not be able to create or change a role that does not have this boundary, and they must not be able to remove the boundary from a role later. The security team does not want to review each new role.

    Which combination of statements should the company add to the developers' identity-based policy? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Allow iam:CreateRole, iam:PutRolePolicy, and iam:AttachRolePolicy on role/dev/* only when the iam:PermissionsBoundary key equals the ARN of DevRoleBoundary.
    - id: b
      text:
        en: |-
          Deny iam:DeleteRolePermissionsBoundary on all roles so that no developer can remove a permissions boundary from a role.
    - id: c
      text:
        en: |-
          Attach DevRoleBoundary as the permissions boundary of the IAM group of the developers so that every role they create inherits it.
    - id: d
      text:
        en: |-
          Allow iam:CreateRole on role/dev/*, and attach an SCP to the account that allows only the actions that DevRoleBoundary allows.
    - id: e
      text:
        en: |-
          Allow iam:PutRolePermissionsBoundary on all roles so that the developers can attach DevRoleBoundary after they create each role.
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |-
      The iam:PermissionsBoundary condition key lets the developers create roles and add policies only when the role has DevRoleBoundary as its boundary, so the role's effective permissions never exceed it. Denying iam:DeleteRolePermissionsBoundary prevents a developer from removing the boundary afterward.
  options:
    c:
      en: |-
        Permissions boundaries are set on users and roles, not on groups, and a boundary is never inherited by the roles that a principal creates.
    d:
      en: |-
        An SCP limits every principal in the account, including the security team, and does not require a boundary on the new roles.
    e:
      en: |-
        Developers could create roles without a boundary, or replace the boundary with any other policy.
references:
  - title: "Permissions boundaries for IAM entities - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
