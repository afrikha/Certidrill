id: dopc02-6c-guardduty-findings-export
objective: "6.3.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's Security Tooling account is the Amazon GuardDuty delegated administrator for 40 member accounts in us-east-1 and eu-west-1. The security team wants to analyze GuardDuty findings with Amazon Athena over 3 years to find recurring patterns, but findings older than 90 days are no longer available in GuardDuty. New findings must reach the analysis store within minutes, and updates to existing findings within 1 hour. The team wants the LEAST operational overhead.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          In the Security Tooling account, configure findings export to an S3 bucket in each of the two Regions, with a KMS key whose policy allows guardduty.amazonaws.com to call kms:GenerateDataKey.
    - id: b
      text:
        en: |-
          In each member account, configure findings export to an S3 bucket in each of the two Regions, with a KMS key whose policy allows guardduty.amazonaws.com to call kms:GenerateDataKey.
    - id: c
      text:
        en: |-
          In the Security Tooling account, set the frequency for updated findings to 1 hour in each of the two Regions.
    - id: d
      text:
        en: |-
          In each member account, set the frequency for updated findings to 15 minutes in each of the two Regions.
    - id: e
      text:
        en: |-
          In the Security Tooling account, archive every finding after it is reviewed so that GuardDuty keeps it for analysis beyond 90 days.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      GuardDuty retains findings for 90 days, so an S3 export is needed for longer analysis. Export settings are Regional, the key policy must let GuardDuty generate data keys, and the administrator account's export also includes the findings of its member accounts in the same Region. New active findings are exported within about 5 minutes, and the administrator sets the frequency for updated findings (15 minutes, 1 hour or the default 6 hours) for all member accounts.
  options:
    b:
      en: |-
        Member findings are already exported by the administrator account, so configuring 40 member accounts adds overhead without benefit.
    d:
      en: |-
        Member accounts cannot change the frequency for updated findings; the administrator account's setting applies to them.
    e:
      en: |-
        Archived findings are still deleted after 90 days, and archived findings are not exported by default.
references:
  - title: Exporting generated GuardDuty findings to Amazon S3 buckets - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_exportfindings.html
  - title: Processing GuardDuty findings with Amazon EventBridge - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_cloudwatch.html
