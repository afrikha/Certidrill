id: dopc02-6b-rds-encrypt-existing-instance
objective: "6.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL DB instance that was created years ago without encryption at rest. A new policy requires the database to be encrypted with a customer managed AWS KMS key. The application can tolerate a short planned outage during a maintenance window, and the company wants the simplest process that uses RDS features.

    Which solution should a DevOps engineer use?
body:
  options:
    - id: a
      text:
        en: |-
          Modify the DB instance to turn on storage encryption with the customer managed key, and apply the change during the maintenance window.
    - id: b
      text:
        en: |-
          Create an encrypted read replica of the DB instance with the customer managed key, and promote the replica to a standalone instance in the window.
    - id: c
      text:
        en: |-
          Restore a new DB instance from an encrypted copy of a snapshot of the instance, made with the customer managed key, and point the application to it.
    - id: d
      text:
        en: |-
          Turn on EBS encryption by default in the Region with the customer managed key, and reboot the DB instance during the maintenance window.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Encryption at rest is chosen when an RDS DB instance is created and cannot be turned on later for an existing unencrypted instance. Copying an unencrypted snapshot with a KMS key creates an encrypted snapshot, and a DB instance restored from it is encrypted; the application is then pointed to the new instance.
  options:
    a:
      en: |-
        RDS does not support turning on encryption for an existing unencrypted DB instance.
    b:
      en: |-
        RDS cannot create an encrypted read replica from an unencrypted DB instance.
    d:
      en: |-
        The EBS default encryption setting applies to EC2 volumes; it does not change the storage encryption of an existing RDS DB instance.
references:
  - title: "Encrypting Amazon RDS resources - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html
