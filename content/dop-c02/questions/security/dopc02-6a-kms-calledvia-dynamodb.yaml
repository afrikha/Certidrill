id: dopc02-6a-kms-calledvia-dynamodb
objective: "6.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An order service runs with an IAM role that reads and writes items in an Amazon DynamoDB table. The table is encrypted with a customer managed AWS KMS key, and the role's policy allows kms:Encrypt, kms:Decrypt, and kms:GenerateDataKey on that key so that DynamoDB can use the key with the role's credentials. A security review requires that the role cannot use the key directly, for example by calling kms:Decrypt from the application code, while DynamoDB access continues to work. The company wants to change only the role's policy.

    Which change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a condition to the KMS statement that requires the aws:ViaAWSService key to be true, so that the key can be used only through an AWS service.
    - id: b
      text:
        en: |-
          Add a condition to the KMS statement that requires the aws:CalledVia key to contain dynamodb.amazonaws.com, with the ForAnyValue:StringEquals operator.
    - id: c
      text:
        en: |-
          Remove the KMS statement from the role's policy, because DynamoDB uses its own service-linked role to call AWS KMS for customer managed keys.
    - id: d
      text:
        en: |-
          Add a condition to the KMS statement that requires the aws:CalledViaFirst key to equal cloudformation.amazonaws.com, which deploys the table.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When DynamoDB uses the caller's credentials to call AWS KMS, the request carries aws:CalledVia with dynamodb.amazonaws.com. The key is absent when the principal calls AWS KMS directly, so the condition allows the key only through DynamoDB.
  options:
    a:
      en: |-
        aws:ViaAWSService is true for requests made through any AWS service, so the key could still be used through other services.
    c:
      en: |-
        In this scenario DynamoDB calls AWS KMS with the role's credentials, so removing the permissions would break reads and writes.
    d:
      en: |-
        The requests to AWS KMS come through DynamoDB, not CloudFormation, so this condition would break the table access.
references:
  - title: "AWS global condition context keys - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
