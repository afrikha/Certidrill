id: dopc02-6a-identity-center-delegated-admin-limit
objective: "6.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has delegated the administration of IAM Identity Center to a member account named Identity, and the identity team works only from that account. The team must add a policy to the permission set named BillingAdmin, which is provisioned only in the management account. The update fails, while the team can update the permission sets that are provisioned only in member accounts. The security team wants to keep the number of people with access to the management account as small as possible.

    What should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Move the IAM Identity Center instance from the management account to the Identity account.
    - id: b
      text:
        en: |-
          Attach an SCP to the Identity account that allows the sso:UpdatePermissionSet action for the identity team's role.
    - id: c
      text:
        en: |-
          Have an Identity Center administrator in the management account update the BillingAdmin permission set.
    - id: d
      text:
        en: |-
          Give the identity team's role in the Identity account the AdministratorAccess policy, and retry the update.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A delegated administrator can perform most Identity Center tasks, but it cannot change permission sets that are provisioned in the management account. Only an Identity Center administrator in the management account can modify them, which matches AWS guidance to keep dedicated permission sets for the management account under tight control.
  options:
    a:
      en: |-
        The Identity Center organization instance must stay in the management account; only its administration can be delegated.
    b:
      en: |-
        SCPs never grant permissions, and the limit comes from delegated administration, not from missing IAM permissions.
    d:
      en: |-
        More IAM permissions in the Identity account do not lift the restriction on permission sets provisioned in the management account.
references:
  - title: "Delegated administration - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/delegated-admin.html
