id: dopc02-6a-resource-policy-cross-account-copy
objective: "6.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data platform team runs an AWS Lambda function in account B that copies new objects every hour from an S3 bucket in account A into an S3 bucket in account B. Both accounts belong to the same organization, and the objects use SSE-S3 encryption. The function's execution role already has permissions to write to the destination bucket and to send logs to Amazon CloudWatch Logs in account B. The owners of account A will grant read access to the source bucket to that execution role only. The function must perform each copy with a single set of credentials, and the code must not switch between roles.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a bucket policy to the source bucket that allows s3:GetObject and s3:ListBucket for the ARN of the function's execution role, and leave the execution role's identity-based policy unchanged.
    - id: b
      text:
        en: |-
          Add a bucket policy to the source bucket that allows s3:* for the root principal of account B, and allow s3:GetObject and s3:ListBucket on the source bucket in the execution role's identity-based policy.
    - id: c
      text:
        en: |-
          Add a source bucket policy that allows s3:GetObject and s3:ListBucket for the ARN of the function's execution role, and allow the same actions on the source bucket in the role's own policy.
    - id: d
      text:
        en: |-
          Create a role in account A that can read the source bucket and trusts the function's execution role, and have the function assume that role before it reads the objects that it copies to account B.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With a resource-based policy, the caller keeps its own identity and permissions while it reads the shared resource, so the execution role can read from account A and write to account B with the same credentials. For cross-account access, both the caller's identity-based policy and the resource-based policy must allow the action.
  options:
    a:
      en: |-
        Across accounts, the bucket policy alone is not enough: the identity-based policy of the execution role in account B must also allow the actions.
    b:
      en: |-
        Naming the account root grants access to every principal of account B that its administrators allow, and s3:* exceeds read access; account A wants to grant read access to the execution role only.
    d:
      en: |-
        A principal that assumes a role gives up its original permissions for that session, so the code would have to switch between two sets of credentials to read and to write.
references:
  - title: "Cross account resource access in IAM - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_compare-resource-policies.html
