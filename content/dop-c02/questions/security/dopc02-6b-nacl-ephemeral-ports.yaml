id: dopc02-6b-nacl-ephemeral-ports
objective: "6.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in private subnets behind an internet-facing Application Load Balancer (ALB) in public subnets. The targets listen on TCP port 8443, and the target security group allows port 8443 from the ALB security group. To meet a segmentation requirement, a DevOps engineer associated a custom network ACL with the private subnets. The network ACL has an inbound rule that allows TCP 8443 from the CIDR blocks of the public subnets and an outbound rule that allows TCP 443 to 0.0.0.0/0. Since the change, all targets fail their health checks. The engineer must restore the health checks without opening more access than needed.

    Which change should the DevOps engineer make?
body:
  options:
    - id: a
      text:
        en: |-
          Add an inbound rule to the network ACL that allows TCP ports 1024-65535 from the CIDR blocks of the public subnets.
    - id: b
      text:
        en: |-
          Add an outbound rule to the target security group that allows TCP ports 1024-65535 to the ALB security group.
    - id: c
      text:
        en: |-
          Change the health check of the target group to use TCP port 443 instead of the traffic port 8443.
    - id: d
      text:
        en: |-
          Add an outbound rule to the network ACL that allows TCP ports 1024-65535 to the CIDR blocks of the public subnets.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Network ACLs do not track connections, so every allowed request also needs a rule for its response. Requests from Elastic Load Balancing use source ports 1024-65535, so the targets' responses to health checks and requests leave the subnet toward those ephemeral ports. An outbound rule for TCP 1024-65535 to the public subnet CIDR blocks lets the responses reach the ALB nodes and nothing more.
  options:
    a:
      en: |-
        The requests already enter on port 8443; the missing rule is for the responses, which leave the private subnets toward the ALB's ephemeral ports.
    b:
      en: |-
        Security groups are stateful, so responses to allowed inbound traffic leave the instance regardless of outbound rules; the network ACL is what drops them.
    c:
      en: |-
        Changing the health check port does not fix the network ACL: responses on any port still need an outbound rule for the ALB's ephemeral ports, and the application listens on 8443.
references:
  - title: "Custom network ACLs for your VPC - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html
  - title: "Control traffic to your AWS resources using security groups - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
