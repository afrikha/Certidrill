id: dopc02-6b-tgw-flow-logs-central
objective: "6.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's network account owns an AWS Transit Gateway that connects 40 VPCs in 25 accounts and a Site-to-Site VPN connection to the data center. Auditors require a record of all IP traffic that crosses the transit gateway, including the source and destination VPC IDs and the attachment of each flow, stored in an S3 bucket in the network account. The network team has no permissions in the workload accounts and must not depend on the application teams to configure logging.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Ask each application team to create VPC flow logs on its VPCs that publish to the S3 bucket in the network account.
    - id: b
      text:
        en: |-
          Create a trail in AWS CloudTrail in the network account that logs management events for the transit gateway and its attachments to the S3 bucket.
    - id: c
      text:
        en: |-
          Turn on AWS Config recording of the transit gateway and its attachments, and deliver configuration snapshots to the S3 bucket.
    - id: d
      text:
        en: |-
          Create a Transit Gateway flow log on the transit gateway in the network account that publishes to the S3 bucket.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Transit Gateway Flow Logs capture information about the IP traffic that goes to and from a transit gateway, with fields such as the transit gateway attachment ID and the source and destination VPC IDs, and publish it to Amazon S3, CloudWatch Logs or Firehose. The transit gateway owner creates the flow log, so the network team needs nothing in the workload accounts.
  options:
    a:
      en: |-
        VPC flow logs would depend on 25 application teams, which the requirement forbids, and they do not record the transit gateway attachment of each flow.
    b:
      en: |-
        CloudTrail records API calls that change the transit gateway, not the IP traffic that crosses it.
    c:
      en: |-
        AWS Config records the configuration of the transit gateway and its attachments, not the traffic that flows through them.
references:
  - title: "AWS Transit Gateway Flow Logs - Amazon VPC"
    url: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-flow-logs.html
