id: dopc02-6a-group-not-a-principal
objective: "6.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's operations engineers are IAM users who belong to an IAM group named OpsEngineers in a shared services account. A DevOps engineer writes an Amazon SQS queue policy in the same account that names the ARN of the OpsEngineers group as the principal, so that the engineers can purge the queue. The queue policy cannot be saved because the principal is invalid. The company wants to keep controlling this access through membership in the OpsEngineers group.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the group ARN in the queue policy with the unique ID of the OpsEngineers group, which IAM accepts as a principal identifier.
    - id: b
      text:
        en: |-
          Attach an identity-based policy that allows sqs:PurgeQueue on the queue's ARN to the OpsEngineers group, and remove the group from the queue policy.
    - id: c
      text:
        en: |-
          Add a resource-based policy to the OpsEngineers group that allows sqs:PurgeQueue on the queue's ARN, and remove the group from the queue policy.
    - id: d
      text:
        en: |-
          Name the ARN of each engineer's IAM user as a principal in the queue policy, and update the queue policy whenever the membership of the group changes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An IAM group is a collection of users for attaching permissions; it is not an authenticated principal, so it cannot appear in the Principal element of a resource-based policy. Within the same account, an identity-based policy attached to the group gives every member the permission, and access still follows group membership.
  options:
    a:
      en: |-
        A group cannot be a principal in any form, so its unique ID is not accepted either.
    c:
      en: |-
        IAM groups cannot have resource-based policies; only identity-based policies can be attached to a group.
    d:
      en: |-
        This works technically, but access would no longer follow group membership, and the policy would need manual updates.
references:
  - title: "AWS JSON policy elements: Principal - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html
