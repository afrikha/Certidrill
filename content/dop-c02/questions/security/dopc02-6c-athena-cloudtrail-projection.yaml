id: dopc02-6c-athena-cloudtrail-projection
objective: "6.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security team queries the CloudTrail log files of a trail in Amazon Athena. The table is partitioned by date, and a scheduled AWS Lambda function runs ALTER TABLE ADD PARTITION every night for the new day. When the function fails, the analysts' queries silently return no results for the missing days, and the function must be updated whenever the trail's S3 layout changes. The team wants new partitions to be available automatically as soon as log files arrive, wants queries to keep reading only the dates in their WHERE clause, and does not want to maintain any partition management job.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the Lambda function with an AWS Glue crawler that runs every hour on the trail's S3 prefix and adds the new partitions to the table.
    - id: b
      text:
        en: |-
          Re-create the table without partitions so that every query reads all log files and no partition needs to be added.
    - id: c
      text:
        en: |-
          Re-create the table with partition projection, using a date-type projection for the timestamp partition and a storage.location.template that matches the trail's S3 path.
    - id: d
      text:
        en: |-
          Migrate the analysis to a CloudTrail Lake event data store that imports the trail's events and keeps them queryable with SQL.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Because CloudTrail log files have a known path structure, Athena partition projection can compute the partitions from table properties such as projection.timestamp.type date and storage.location.template. New partitions are available automatically as data arrives, ALTER TABLE ADD PARTITION is no longer needed, and queries with a date filter read only the matching paths, which reduces query runtime.
  options:
    a:
      en: |-
        A crawler is still a scheduled partition management job, and partitions are missing until its next successful run.
    b:
      en: |-
        Without partitions, every query scans all the log files, which breaks the requirement to read only the requested dates and increases cost.
    d:
      en: |-
        CloudTrail Lake is closed to new customers, so it is not an option for a new design.
references:
  - title: Create the table for CloudTrail logs in Athena using partition projection - Amazon Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/create-cloudtrail-table-partition-projection.html
