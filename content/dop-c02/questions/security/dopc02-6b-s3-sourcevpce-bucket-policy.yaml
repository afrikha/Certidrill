id: dopc02-6b-s3-sourcevpce-bucket-policy
objective: "6.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores customer exports in an S3 bucket. Applications on EC2 instances in private subnets of one VPC access the bucket through a gateway VPC endpoint, and the endpoint policy allows access only to this bucket. A penetration test showed that an IAM access key copied from an instance still allowed downloads from a laptop on the internet. The security team requires that requests to the bucket succeed only when they arrive through the VPC endpoint, whatever the caller's IAM permissions.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a bucket policy statement that denies s3:GetObject when the aws:PrincipalOrgID condition key does not equal the company's organization ID.
    - id: b
      text:
        en: |-
          Add a bucket policy statement that denies all S3 actions on the bucket when the aws:SecureTransport condition key is false.
    - id: c
      text:
        en: |-
          Restrict the endpoint policy further so that only the application roles can call s3:GetObject on the bucket.
    - id: d
      text:
        en: |-
          Add a bucket policy statement that denies all S3 actions on the bucket when the aws:SourceVpce condition key does not equal the ID of the gateway endpoint.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A bucket policy deny with the aws:SourceVpce condition rejects any request that does not come through the specified VPC endpoint, even when the caller's IAM policy allows it. It complements the endpoint policy, which only controls what can be done through the endpoint and cannot stop requests sent from outside the VPC.
  options:
    a:
      en: |-
        The copied access key belongs to a principal of the company's organization, so a condition on the organization ID does not stop requests sent from the laptop.
    b:
      en: |-
        Requests from the laptop also use HTTPS, so a condition on secure transport does not stop them.
    c:
      en: |-
        An endpoint policy only applies to requests that go through the endpoint; requests from the laptop bypass it entirely.
references:
  - title: "Controlling access from VPC endpoints with bucket policies - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html
