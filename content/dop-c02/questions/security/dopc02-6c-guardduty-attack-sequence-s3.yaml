id: dopc02-6c-guardduty-attack-sequence-s3
objective: "6.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company enabled Amazon GuardDuty in its production account with only the foundational data sources. The account stores customer exports in several S3 buckets. The security team wants GuardDuty to correlate a multi-stage attack, such as compromised credentials that make a bucket policy overly permissive followed by data exfiltration from that bucket, into a single critical finding instead of separate signals that analysts must connect by hand. The company does not want to manage additional trails or log pipelines.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a trail that logs S3 data events for all buckets so that GuardDuty can analyze the object-level activity of the attack.
    - id: b
      text:
        en: |-
          Enable GuardDuty S3 Protection so that Extended Threat Detection can include data compromise activity in its attack sequences.
    - id: c
      text:
        en: |-
          Enable GuardDuty Malware Protection for S3 on the buckets so that every exported object is scanned when it is written.
    - id: d
      text:
        en: |-
          Enable Amazon Detective so that its behavior graph generates the correlated findings for the GuardDuty console.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Extended Threat Detection is enabled by default with GuardDuty at no additional cost and generates attack sequence findings, which are always Critical, from signals correlated within a 24-hour window. With only foundational sources it can detect that a bucket policy became overly permissive but not the exfiltration that follows; enabling S3 Protection adds the data events it needs, without any trail to manage.
  options:
    a:
      en: |-
        A data event trail is an extra resource to manage and is not needed: S3 Protection monitors S3 data events without the company configuring data event logging in CloudTrail.
    c:
      en: |-
        Malware Protection for S3 scans newly uploaded objects for malware; it does not detect exfiltration or correlate attack stages.
    d:
      en: |-
        Detective helps analysts investigate findings; it does not generate GuardDuty findings or attack sequences.
references:
  - title: GuardDuty Extended Threat Detection - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty-extended-threat-detection.html
  - title: GuardDuty S3 Protection - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/s3-protection.html
