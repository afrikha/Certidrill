id: dopc02-6c-guardduty-c2-detection
objective: "6.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company runs about 300 Amazon EC2 instances across four AWS accounts. The security team wants findings when an instance communicates with known command-and-control servers or mines cryptocurrency, and when IAM credentials are used in an unusual way. The company has not turned on VPC flow logs or Route 53 Resolver query logging. The team does not want to install agents or build and maintain log pipelines.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Activate Amazon Inspector in each account and Region so that it continuously scans the instances and reports active threats.
    - id: b
      text:
        en: |-
          Enable Amazon GuardDuty in each account and Region so that it analyzes its foundational data sources and generates threat findings.
    - id: c
      text:
        en: |-
          Enable Amazon Macie in each account and Region so that it monitors the instances' network traffic and reports suspicious activity.
    - id: d
      text:
        en: |-
          Deploy AWS Config managed rules in each account and Region so that they evaluate the instances and report the noncompliant ones.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      GuardDuty is the threat detection service: when it is enabled, it automatically analyzes CloudTrail management events, VPC flow logs from EC2 instances and DNS logs through its own data feeds. The company does not have to turn on flow logs or DNS query logging, deploy agents or manage any pipeline to get findings such as cryptocurrency mining, command-and-control communication or anomalous credential use.
  options:
    a:
      en: |-
        Amazon Inspector finds software vulnerabilities (CVEs) and network reachability issues; it does not detect active threats such as communication with command-and-control servers.
    c:
      en: |-
        Amazon Macie discovers sensitive data in Amazon S3 and evaluates bucket security; it does not analyze EC2 network traffic.
    d:
      en: |-
        AWS Config rules evaluate resource configurations against desired settings; they do not detect runtime threats or malicious network activity.
references:
  - title: What is Amazon GuardDuty? - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html
