id: dopc02-6c-cloudtrail-delegated-admin
objective: "6.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's organization trail is managed from the AWS Organizations management account. A new internal policy states that the management account must be used only for tasks that cannot be performed elsewhere. The security team works from a Security account and must create and update organization trails, including their event selectors, without any access to the management account. The organization trails must keep logging if the Security account is later replaced by another account for this role.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          From the Security account, use a StackSet with service-managed permissions to create a trail in every member account that delivers to the log archive bucket.
    - id: b
      text:
        en: |-
          Create an IAM role in the management account with CloudTrail permissions that the security team assumes from the Security account to manage the organization trails.
    - id: c
      text:
        en: |-
          From the management account, register the Security account as a CloudTrail delegated administrator, and manage the organization trails from the Security account.
    - id: d
      text:
        en: |-
          From the management account, enable trusted access for CloudTrail in AWS Organizations, and create the organization trails from the Security account.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Only the management account can register a CloudTrail delegated administrator, which can then create, update and delete organization trails. The management account remains the owner of the organization resources that the delegated administrator creates, so the trails are not deleted when the delegated administrator is removed or changed.
  options:
    a:
      en: |-
        Trails created in each member account are not organization trails, and member account administrators could stop them.
    b:
      en: |-
        Working through a role in the management account still uses the management account, which the new policy forbids.
    d:
      en: |-
        Trusted access alone does not let a member account manage organization trails; the account must be registered as a CloudTrail delegated administrator.
references:
  - title: Organization delegated administrator - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-delegated-administrator.html
