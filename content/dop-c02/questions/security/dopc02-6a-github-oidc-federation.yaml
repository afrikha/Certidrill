id: dopc02-6a-github-oidc-federation
objective: "6.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company deploys infrastructure from GitHub Actions workflows that run on GitHub-hosted runners. Today, the workflows authenticate to the company's AWS account with the access keys of an IAM user, which are stored as GitHub repository secrets. The security team requires that the workflows use only short-term credentials and that only workflows from the company's infra-live repository can obtain AWS credentials. The company does not want to change its runners.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a deployment role that trusts the IAM user, and have the workflows assume the role with the user's access keys before each deployment.
    - id: b
      text:
        en: |-
          Create an IAM Roles Anywhere trust anchor for GitHub's certificate authority, and have the workflows obtain credentials with the runners' certificates.
    - id: c
      text:
        en: |-
          Create an IAM SAML identity provider from GitHub's metadata document, and have the workflows call AssumeRoleWithSAML for a deployment role.
    - id: d
      text:
        en: |-
          Create a role that allows sts:AssumeRoleWithWebIdentity from that provider, with conditions on the aud claim and on a sub claim that matches the infra-live repository.
    - id: e
      text:
        en: |-
          Create an IAM OIDC identity provider for https://token.actions.githubusercontent.com with sts.amazonaws.com as the audience.
answer: { optionIds: [d, e] }
explanation:
  correct:
    en: |-
      GitHub Actions issues an OIDC token to each workflow run. An IAM OIDC identity provider for GitHub lets a role trust those tokens through AssumeRoleWithWebIdentity, which returns temporary credentials. The trust policy checks the aud claim and limits the sub claim to the infra-live repository, so workflows from other repositories cannot assume the role.
  options:
    a:
      en: |-
        The workflows would still hold long-term IAM user access keys in GitHub secrets.
    b:
      en: |-
        GitHub-hosted runners do not hold X.509 certificates from a CA that the company controls; Roles Anywhere is meant for workloads with such certificates.
    c:
      en: |-
        GitHub Actions federates with OIDC tokens, not SAML assertions.
references:
  - title: "Create a role for OpenID Connect federation (console) - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
  - title: "Create an OpenID Connect (OIDC) identity provider in IAM - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html
