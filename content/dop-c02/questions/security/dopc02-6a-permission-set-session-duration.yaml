id: dopc02-6a-permission-set-session-duration
objective: "6.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Engineers sign in to the AWS access portal of IAM Identity Center and open the AWS Management Console of workload accounts with a permission set named Operations. During long incident investigations, they are signed out of the account console every hour and must open it again from the portal. The security team accepts console sessions of up to 8 hours for the Operations permission set only.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the session duration of the AWS access portal to 8 hours in the Identity Center settings.
    - id: b
      text:
        en: |-
          Configure the identity provider to send a SessionDuration attribute of 28,800 seconds in its assertions.
    - id: c
      text:
        en: |-
          Set the session duration of the Operations permission set to 8 hours.
    - id: d
      text:
        en: |-
          Set the maximum session duration of the IAM role for the permission set in each account to 8 hours.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The session duration of a permission set controls how long a user stays signed in to an AWS account with it. It defaults to 1 hour and can be set to up to 12 hours, so setting it to 8 hours on Operations changes only that permission set.
  options:
    a:
      en: |-
        The access portal session controls how long users stay signed in to the portal, not how long an account console session opened with a permission set lasts.
    b:
      en: |-
        Identity Center sets the account session length from the permission set, not from attributes in the identity provider's assertion.
    d:
      en: |-
        Identity Center already creates the roles for permission sets with a 12-hour maximum; the one-hour sign-out comes from the permission set's own session duration.
references:
  - title: "Set session duration for AWS accounts - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/howtosessionduration.html
