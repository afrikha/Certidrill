id: dopc02-6a-standalone-account-saml
objective: "6.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research subsidiary operates one standalone AWS account that must stay outside the parent company's organization in AWS Organizations for legal reasons. Its 60 researchers sign in to the subsidiary's SAML 2.0 identity provider (IdP). The researchers need AWS Management Console access to the account with one of two levels of access, based on their group in the IdP. Users who are disabled in the IdP must not be able to sign in to the account again, and IAM users are not allowed.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable an account instance of IAM Identity Center in the account, connect it to the IdP, and assign two permission sets for the account to the matching IdP groups.
    - id: b
      text:
        en: |-
          Create an IAM OIDC identity provider for the IdP's issuer URL, create two roles that trust it, and have the researchers call AssumeRoleWithWebIdentity to open the console.
    - id: c
      text:
        en: |-
          Assign the standalone account to two permission sets in the parent company's organization instance of IAM Identity Center, and connect that instance to the subsidiary's IdP.
    - id: d
      text:
        en: |-
          Create an IAM SAML identity provider in the account, create two roles that trust it for sts:AssumeRoleWithSAML, and have the IdP map each group to a role in the assertion.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An IAM SAML identity provider establishes trust between the IdP and one account. Roles that trust the provider are assumed with AssumeRoleWithSAML, and the IdP's assertion maps each group to a role. Disabled users cannot get new assertions from the IdP, and no IAM user is needed.
  options:
    a:
      en: |-
        Account instances of IAM Identity Center do not support permission sets, so they cannot give access to AWS accounts.
    b:
      en: |-
        The IdP issues SAML assertions, so the trust must use a SAML provider; an OIDC provider expects OpenID Connect tokens.
    c:
      en: |-
        Permission sets of an organization instance can be assigned only to accounts in that organization, and the account must stay outside it.
references:
  - title: "SAML 2.0 federation - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_saml.html
  - title: "Account instances of IAM Identity Center - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/account-instances-identity-center.html
