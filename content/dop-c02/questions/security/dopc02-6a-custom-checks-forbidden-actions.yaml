id: dopc02-6a-custom-checks-forbidden-actions
objective: "6.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's pipeline deploys AWS CloudFormation templates that application teams write. The templates contain IAM role policies and S3 bucket policies. The security team has two rules: no identity-based policy may allow iam:CreateUser or kms:ScheduleKeyDeletion, and no bucket policy may allow public access. The checks must run in the pipeline before any CloudFormation operation, and they must not depend on earlier versions of the policies.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an external access analyzer for the organization, and stop the pipeline when the analyzer reports an active finding for an S3 bucket.
    - id: b
      text:
        en: |-
          Create an unused access analyzer for the account, and stop the pipeline when the analyzer reports unused permissions on a role.
    - id: c
      text:
        en: |-
          Run the IAM Access Analyzer check-access-not-granted command for each identity-based policy with iam:CreateUser and kms:ScheduleKeyDeletion as the access to check.
    - id: d
      text:
        en: |-
          Run the IAM Access Analyzer check-no-new-access command for each identity-based policy with the last deployed version as the existing policy.
    - id: e
      text:
        en: |-
          Run the IAM Access Analyzer check-no-public-access command for each bucket policy with AWS::S3::Bucket as the resource type.
answer: { optionIds: [c, e] }
explanation:
  correct:
    en: |-
      CheckAccessNotGranted verifies that a policy does not allow the specified actions, and CheckNoPublicAccess verifies that a resource policy for a given resource type does not grant public access. Both evaluate the policy documents themselves, so they run in the pipeline before deployment.
  options:
    a:
      en: |-
        External access findings are produced for deployed resources, so they come after the CloudFormation operation.
    b:
      en: |-
        Unused access findings describe deployed roles that do not use their permissions; they do not detect forbidden actions before deployment.
    d:
      en: |-
        CheckNoNewAccess compares a policy with an earlier version, which the checks must not depend on, and it does not target specific actions.
references:
  - title: "Validate policies with IAM Access Analyzer custom policy checks - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-custom-policy-checks.html
