id: dopc02-6c-logs-centralization-rule
objective: "6.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 70 accounts in an organization in AWS Organizations, adds accounts every month, and runs workloads in us-east-1, eu-west-1 and ap-southeast-2. Security log groups in every account have names that start with /security/. The incident response team requires a copy of these logs in a central Security account in eu-west-1, with a second copy in eu-central-1, so that investigations continue even if a member account is compromised. Only logs ingested from now on must be copied. Trusted access for CloudWatch is enabled, the Security account is a delegated administrator for CloudWatch, and the team wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Link every account to the Security account as a monitoring account with CloudWatch cross-account observability, sharing log groups whose names start with /security/.
    - id: b
      text:
        en: |-
          Create a CloudWatch Logs centralization rule for the organization and the three Regions that selects the /security/ log groups, with the Security account and eu-west-1 as destination and eu-central-1 as backup Region.
    - id: c
      text:
        en: |-
          Use a StackSet with automatic deployment to create a subscription filter on each /security/ log group that sends events to a Firehose stream that writes to a log group in the Security account.
    - id: d
      text:
        en: |-
          Schedule an AWS Lambda function in each account that runs CloudWatch Logs export tasks for the /security/ log groups to S3 buckets in eu-west-1 and eu-central-1 in the Security account.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudWatch Logs centralization rules, managed from the management account or a delegated administrator, copy log data at ingestion time from selected accounts, OUs or the whole organization and from selected Regions into a destination account. A rule can filter log groups by name and set a primary Region and an optional backup Region that stores a second copy. Only data ingested after the rule is created is centralized, which matches the requirement.
  options:
    a:
      en: |-
        Cross-account observability lets the monitoring account view and query the source accounts' data, but the logs stay in the source accounts, so no independent copy exists.
    c:
      en: |-
        Subscription filters and Firehose streams must be built and maintained in every account and Region, and a second delivery path would be needed for the copy in eu-central-1.
    d:
      en: |-
        Export tasks are batch jobs driven by custom code, and they copy logs to S3 rather than continuously at ingestion time.
references:
  - title: Cross-account cross-Region log centralization - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html
