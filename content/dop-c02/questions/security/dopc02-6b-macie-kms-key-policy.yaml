id: dopc02-6b-macie-kms-key-policy
objective: "6.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs Amazon Macie automated sensitive data discovery in all accounts. Macie reports that it could not analyze many objects in a data lake bucket. The objects are encrypted with SSE-KMS by using a customer managed key whose key policy allows only the data lake ingestion and analytics roles to use it. The bucket policy does not restrict access for the Macie service-linked role. The security team requires Macie to analyze these objects without changing their encryption.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Re-encrypt the objects with SSE-S3 by copying them in place with an S3 Batch Operations Copy job.
    - id: b
      text:
        en: |-
          Grant the Macie service-linked role s3:GetObject on the bucket and its objects in the bucket policy.
    - id: c
      text:
        en: |-
          Add a statement to the key policy that allows the Macie service-linked role to use the key to decrypt objects.
    - id: d
      text:
        en: |-
          Create a sensitive data discovery job for the bucket instead of relying on automated sensitive data discovery.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Macie can analyze objects encrypted with customer managed KMS keys only if it is allowed to use the key, and a key policy that allows only specific roles prevents decryption. Adding a key policy statement that lets the Macie service-linked role decrypt with the key fixes the problem while the objects keep their encryption.
  options:
    a:
      en: |-
        Changing the encryption of the objects is what the security team must avoid.
    b:
      en: |-
        The bucket policy is not the blocker; without permission to use the KMS key, Macie still cannot decrypt the objects.
    d:
      en: |-
        A job uses the same service-linked role and fails on the same KMS permission.
references:
  - title: "Analyzing encrypted Amazon S3 objects - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-supported-encryption-types.html
