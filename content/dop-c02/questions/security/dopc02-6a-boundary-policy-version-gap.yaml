id: dopc02-6a-boundary-policy-version-gap
objective: "6.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company lets its application teams create IAM roles in their accounts. The teams' policy allows iam:CreateRole, iam:AttachRolePolicy, and iam:PutRolePolicy only when the iam:PermissionsBoundary key equals the ARN of a customer managed policy named AppBoundary, and it denies iam:DeleteRolePermissionsBoundary. The same policy allows iam:CreatePolicy, iam:CreatePolicyVersion, and iam:SetDefaultPolicyVersion on all policies, because the teams write the policies for their roles. A review found a role that had administrator permissions while AppBoundary was still its permissions boundary.

    Which change will close this gap while the teams keep writing policies for their roles?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM Access Analyzer unused access analyzer for the accounts so that unused permissions of the teams' roles are reported.
    - id: b
      text:
        en: |-
          Remove iam:AttachRolePolicy from the allow statement so that the teams can give permissions to their roles only through inline policies.
    - id: c
      text:
        en: |-
          Add a statement that denies iam:PutRolePermissionsBoundary on all roles so that the teams cannot set a different permissions boundary on their roles.
    - id: d
      text:
        en: |-
          Add a statement that denies iam:CreatePolicyVersion, iam:SetDefaultPolicyVersion, iam:DeletePolicyVersion, and iam:DeletePolicy on the ARN of AppBoundary.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The teams can edit any customer managed policy, including AppBoundary itself, so they can create a new default version of the boundary that allows everything. Denying the actions that change or replace the boundary policy protects it, while the teams can still create and update their own policies.
  options:
    a:
      en: |-
        Unused access findings report permissions after the fact; they do not stop the teams from widening the boundary.
    b:
      en: |-
        Inline policies are limited by the boundary just like managed policies, and the boundary policy could still be edited.
    c:
      en: |-
        The role kept AppBoundary as its boundary; the gap is that the content of AppBoundary can be changed.
references:
  - title: "Permissions boundaries for IAM entities - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
