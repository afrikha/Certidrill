id: dopc02-6a-org-last-accessed-scp
objective: "6.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's Legacy OU contains 18 accounts that run older workloads. The FullAWSAccess policy is the only SCP that applies to the OU. The security team wants to replace it with an SCP that allows only the AWS services that principals in these accounts have actually used during the last year. The security team works from the management account, and SCPs are enabled in the organization. The team wants the LEAST effort to find those services.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run IAM Access Analyzer policy generation for every role in the 18 accounts over the longest available date range, and combine the services from the generated policies into the SCP.
    - id: b
      text:
        en: |-
          From the management account, generate the service last accessed report for the Legacy OU, and build the SCP from the services that the report shows as accessed in the last year.
    - id: c
      text:
        en: |-
          Create an IAM Access Analyzer unused access analyzer in each of the 18 accounts, and remove from FullAWSAccess the services that its findings report as unused.
    - id: d
      text:
        en: |-
          Create an Amazon Athena table over the organization trail's logs, and query the distinct event sources of the 18 accounts for the last year to build the SCP.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For an organization entity such as an OU, IAM last accessed information, generated from the management account, lists the services allowed by the inherited SCPs and when principals in the accounts last attempted to use them. Service data covers at least 400 days, so one report shows which services the OU used in the last year.
  options:
    a:
      en: |-
        Policy generation covers at most 90 days and works one role at a time, which is far more effort and does not cover the whole year.
    c:
      en: |-
        Unused access findings are per role and user, and FullAWSAccess cannot be edited to remove services; the analyzers add work without giving an OU-level view.
    d:
      en: |-
        This works, but building and running the queries is more effort than the report that IAM already provides for the OU.
references:
  - title: "Refine permissions in AWS using last accessed information - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_last-accessed.html
