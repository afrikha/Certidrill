id: dopc02-6a-scp-allow-with-condition-trap
objective: "6.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants the accounts in its Sandbox OU to launch only t3 and t4g Amazon EC2 instance types. The organization uses a deny list strategy, and the FullAWSAccess policy is attached at the root, at every OU, and at every account. A DevOps engineer attached an SCP to the Sandbox OU with an Allow statement for ec2:RunInstances whose condition requires the ec2:InstanceType key to match t3.* or t4g.*. Engineers can still launch m5 instances in the sandbox accounts. All other actions in the sandbox accounts must remain available.

    Which change will enforce the requirement?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the Allow statement with a Deny statement for ec2:RunInstances on instance resources when ec2:InstanceType does not match t3.* or t4g.*.
    - id: b
      text:
        en: |-
          Keep the Allow statement, and detach FullAWSAccess only from the Sandbox OU so that the conditional Allow is the only allow for EC2 launches.
    - id: c
      text:
        en: |-
          Add a permissions boundary that allows only t3 and t4g launches to the roles in the sandbox accounts, and keep the SCP unchanged.
    - id: d
      text:
        en: |-
          Move the SCP with the conditional Allow statement from the Sandbox OU to the organization root so that it is evaluated before FullAWSAccess.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      SCPs filter permissions: an action is available only if every level allows it, and an Allow statement in one SCP adds to the FullAWSAccess allow at the same level instead of narrowing it. A Deny statement with a condition on ec2:InstanceType removes every other instance type, whatever else is allowed.
  options:
    b:
      en: |-
        Without FullAWSAccess, the OU would allow only ec2:RunInstances, so every other action in the sandbox accounts would be denied.
    c:
      en: |-
        Account administrators could create roles without the boundary, and the boundary does not change why the SCP allows m5.
    d:
      en: |-
        SCPs at the root apply to all accounts, and FullAWSAccess at the root would still allow m5 launches; SCPs are not evaluated in order.
references:
  - title: "SCP syntax - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_syntax.html
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
