id: dopc02-6b-macie-scheduled-job-new-objects
objective: "6.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payments company receives files from merchants in one S3 bucket every day. A regulation requires that every object in the bucket be fully analyzed for card numbers, not sampled, and that each object be analyzed once rather than every day. The security team wants the analysis to run every day without manual steps and wants the MOST cost-effective approach.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Rely on Macie automated sensitive data discovery for the account, and make sure that the bucket is included in its scope.
    - id: b
      text:
        en: |-
          Create a one-time sensitive data discovery job for the bucket, and copy the job from the Macie console every day to run it again.
    - id: c
      text:
        en: |-
          Create a daily scheduled discovery job for the bucket, so that each run after the first analyzes only objects created or changed since the last run.
    - id: d
      text:
        en: |-
          Create a daily scheduled sensitive data discovery job for the bucket with a sampling depth of 50 percent to reduce the analysis cost.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A scheduled sensitive data discovery job runs daily, weekly or monthly; its first run can include the existing objects, and each later run analyzes only objects created or changed after the previous run. Every object is therefore analyzed fully once, without a daily manual step and without paying to analyze the same objects again.
  options:
    a:
      en: |-
        Automated discovery analyzes representative samples of objects, which does not meet the requirement to analyze every object.
    b:
      en: |-
        Copying a job every day is a manual step, and each one-time job would analyze all objects again.
    d:
      en: |-
        With a sampling depth below 100 percent, the job analyzes only part of the eligible objects, so some objects would never be analyzed.
references:
  - title: "Scope options for sensitive data discovery jobs - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-jobs-scope.html
