id: dopc02-6a-scp-deny-leave-organization
objective: "6.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company created its organization in AWS Organizations four years ago with all features enabled. Administrators of the member accounts have full permissions in their accounts. The security team must prevent any member account from leaving the organization, because the account would then no longer be subject to the organization's guardrails.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP to the organization root that denies the organizations:LeaveOrganization action.
    - id: b
      text:
        en: |-
          Delete the OrganizationAccountAccessRole role from each member account so that the account cannot be removed.
    - id: c
      text:
        en: |-
          Attach an identity-based policy that denies organizations:LeaveOrganization to the administrator roles of each member account.
    - id: d
      text:
        en: |-
          Attach a tag policy to the organization root that marks every member account as a mandatory member.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      SCPs set the maximum permissions of every principal in member accounts, including their administrators and root users, and member accounts cannot detach them. A deny on organizations:LeaveOrganization at the root therefore applies to all member accounts.
  options:
    b:
      en: |-
        OrganizationAccountAccessRole lets the management account administer the member account; deleting it does not stop the account from leaving.
    c:
      en: |-
        Account administrators can remove or override identity-based policies in their own accounts.
    d:
      en: |-
        Tag policies standardize resource tags; they do not control membership in the organization.
references:
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
