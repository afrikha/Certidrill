id: dopc02-6b-ssm-dhmc-organization
objective: "6.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 90 accounts in AWS Organizations and runs Amazon EC2 instances in three Regions. The security team requires every instance to be a Systems Manager managed node so that Session Manager replaces SSH and Patch Manager can patch it. Application teams launch thousands of instances, most of them without an IAM instance profile. The instances run the latest SSM Agent version and use IMDSv2. The security team does not want to create and attach instance profiles to the instances and wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use Quick Setup from the management account to enable Default Host Management Configuration for all accounts in the organization in the three Regions.
    - id: b
      text:
        en: |-
          Deploy a StackSet that creates an instance profile with the AmazonSSMManagedInstanceCore policy in each account, and attach it to every instance with an AWS Lambda function at launch.
    - id: c
      text:
        en: |-
          Create a hybrid activation in each account and Region, and register every instance with the activation code and activation ID at startup.
    - id: d
      text:
        en: |-
          Deploy the ec2-instance-managed-by-systems-manager AWS Config rule as an organization rule, and ask the teams to fix the noncompliant instances.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Default Host Management Configuration lets Systems Manager manage EC2 instances without an IAM instance profile, by applying a default IAM role at the account and Region level. Quick Setup can activate it for all accounts and Regions of the organization from the management account, so no instance profile has to be created or attached.
  options:
    b:
      en: |-
        Creating and attaching instance profiles with a custom Lambda function is the work the security team wants to avoid, and it conflicts with instances that already have a profile.
    c:
      en: |-
        Hybrid activations are for on-premises servers and machines in other environments; registering EC2 instances this way adds manual steps in every account and Region.
    d:
      en: |-
        The Config rule only reports unmanaged instances; the teams would still have to fix each one.
references:
  - title: "Managing EC2 instances automatically with Default Host Management Configuration - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/fleet-manager-default-host-management-configuration.html
  - title: "Set up the Default Host Management Configuration for an organization using Quick Setup - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/quick-setup-default-host-management-configuration.html
