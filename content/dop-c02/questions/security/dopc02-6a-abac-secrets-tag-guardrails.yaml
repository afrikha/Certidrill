id: dopc02-6a-abac-secrets-tag-guardrails
objective: "6.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses ABAC for AWS Secrets Manager. Engineers' roles have access-project tags, and an existing policy allows secret actions only when aws:ResourceTag/access-project equals the principal's access-project tag. Engineers must be able to create secrets for their own project only, so every new secret must get the engineer's access-project value at creation. An audit also found engineers who removed the access-project tag from their secrets, which broke the access model. The company wants to keep one policy for all projects.

    Which change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Allow secretsmanager:CreateSecret without conditions, and attach a tag policy to the account that defines the access-project key and enforces its allowed values for secrets.
    - id: b
      text:
        en: |-
          Allow secretsmanager:CreateSecret only when aws:ResourceTag/access-project equals ${aws:PrincipalTag/access-project}, and deny secretsmanager:UntagResource when aws:TagKeys matches access-*.
    - id: c
      text:
        en: |-
          Allow secretsmanager:CreateSecret only when aws:RequestTag/access-project equals ${aws:PrincipalTag/access-project}, and deny secretsmanager:UntagResource when aws:TagKeys matches access-*.
    - id: d
      text:
        en: |-
          Allow secretsmanager:CreateSecret only when aws:RequestTag/access-project equals ${aws:PrincipalTag/access-project}, and deny secretsmanager:UntagResource for all tag keys and all secrets.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      At creation, the tags are in the request, so aws:RequestTag compares the new secret's access-project tag with the principal's tag. A deny on UntagResource for tag keys that match access-* protects the tags that control access, while engineers can still remove their other tags.
  options:
    a:
      en: |-
        A tag policy standardizes tag values but does not tie the tag value to the engineer's project, and it does not evaluate secrets created without the tag.
    b:
      en: |-
        The secret does not exist yet when CreateSecret is evaluated, so its resource tags cannot be compared at creation.
    d:
      en: |-
        Denying every UntagResource request also blocks the removal of tags that do not control access, which is more than the requirement.
references:
  - title: "IAM tutorial: Define permissions to access AWS resources based on tags - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_attribute-based-access-control.html
