id: dopc02-6c-flowlogs-port-scan-query
objective: "6.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company publishes the VPC flow logs of a production VPC, in the default format, to a CloudWatch Logs log group in the Standard log class. The security team suspects that an external host is scanning the company's public instances. An analyst must list the 20 source IP addresses whose rejected traffic targeted the largest number of different destination ports in the last 24 hours.

    Which CloudWatch Logs Insights query will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          filter action = "REJECT" | stats countDistinct(dstPort) as ports by srcAddr | sort ports desc | limit 20
    - id: b
      text:
        en: |-
          filter action = "ACCEPT" | stats countDistinct(dstPort) as ports by srcAddr | sort ports desc | limit 20
    - id: c
      text:
        en: |-
          filter action = "REJECT" | stats countDistinct(srcAddr) as sources by dstPort | sort sources desc | limit 20
    - id: d
      text:
        en: |-
          filter action = "REJECT" | stats sum(bytes) as volume by srcAddr | sort volume desc | limit 20
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CloudWatch Logs Insights automatically discovers flow log fields such as action, srcAddr, dstPort and bytes. Filtering on REJECT keeps the traffic that security groups or network ACLs blocked, countDistinct(dstPort) by srcAddr gives the number of different ports each source tried, and sort with limit returns the top 20 sources.
  options:
    b:
      en: |-
        ACCEPT keeps the traffic that was allowed, not the rejected probes that the analyst must find.
    c:
      en: |-
        This groups by destination port and counts sources, which shows the most targeted ports instead of the hosts that tried the most ports.
    d:
      en: |-
        Summing bytes ranks sources by traffic volume; a port scan sends little data to many ports, so volume does not identify it.
references:
  - title: Supported logs and discovered fields - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_AnalyzeLogData-discoverable-fields.html
  - title: stats - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-Stats.html
