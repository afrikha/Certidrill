id: dopc02-6b-macie-org-automated-discovery
objective: "6.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 200 accounts in AWS Organizations and thousands of S3 general purpose buckets, all in one Region. The compliance team needs continuous visibility into which buckets in all accounts contain personal data, including buckets in accounts created later, and accepts that objects are sampled rather than all analyzed. The team does not want to choose buckets or schedule scans, and it wants an AWS managed service with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Designate a delegated Macie administrator, turn on automatic enablement for new accounts, and turn on automated sensitive data discovery.
    - id: b
      text:
        en: |-
          Create an AWS Lambda function in each account that lists new objects every day and scans them with regular expressions for personal data patterns.
    - id: c
      text:
        en: |-
          Run Amazon Athena queries on S3 Inventory reports of every bucket to find object keys that contain personal data keywords.
    - id: d
      text:
        en: |-
          Enable Amazon GuardDuty S3 Protection in every account, and review findings that report access to buckets with personal data.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Macie automated sensitive data discovery continually evaluates the S3 bucket inventory and uses sampling to select and analyze representative objects, without selecting buckets or scheduling jobs; the Macie administrator's discovery covers buckets owned by member accounts. With automatic enablement, Macie is enabled for accounts as they are added to the organization.
  options:
    b:
      en: |-
        Custom scanning functions in every account are code to build, run and pay for, and they reimplement what Macie provides.
    c:
      en: |-
        Inventory reports list object metadata; matching keywords in object keys does not inspect the content of the objects.
    d:
      en: |-
        GuardDuty S3 Protection detects suspicious access patterns; it does not inspect object content for personal data.
references:
  - title: "Performing automated sensitive data discovery - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-asdd.html
  - title: "Integrating and configuring an organization in Macie - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/accounts-mgmt-ao-integrate.html
