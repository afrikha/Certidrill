id: dopc02-6b-kms-cancel-deletion-enable
objective: "6.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's cleanup script scheduled the deletion of a customer managed AWS KMS key five days ago with a 30-day waiting period. The key is the default encryption key of an S3 bucket that holds 40 TB of SSE-KMS encrypted invoices. A nightly batch job that reads the invoices now fails with errors that state the key is pending deletion. The company must restore the job as quickly as possible without losing access to any invoice.

    What should a DevOps engineer do?
body:
  options:
    - id: a
      text:
        en: |-
          Cancel the scheduled key deletion, and run the batch job again; the key returns to the Enabled state when the deletion is canceled.
    - id: b
      text:
        en: |-
          Create a new customer managed key, copy every invoice in place with S3 Batch Operations to re-encrypt it with the new key, and then let the old key be deleted.
    - id: c
      text:
        en: |-
          Cancel the scheduled key deletion, enable the key, and run the batch job again.
    - id: d
      text:
        en: |-
          Import new key material into the existing key with the same key ID, and run the batch job again after the import completes.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A key that is pending deletion cannot be used in any cryptographic operation, but its deletion can be canceled before the waiting period ends. When CancelKeyDeletion succeeds, the key state is Disabled, so the key must also be enabled with EnableKey before the batch job can decrypt the invoices again.
  options:
    a:
      en: |-
        After a cancellation the key is Disabled, not Enabled, so the job would keep failing until someone enables the key.
    b:
      en: |-
        Copying an object requires decrypting it with the old key, which is unusable while it is pending deletion; this path also takes far longer than recovering the key.
    d:
      en: |-
        Only keys created with imported key material can take imported material, and new material could not decrypt data encrypted under the original material.
references:
  - title: "CancelKeyDeletion - AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_CancelKeyDeletion.html
  - title: "Delete an AWS KMS key - AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
