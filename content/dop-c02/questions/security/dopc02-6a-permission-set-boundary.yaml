id: dopc02-6a-permission-set-boundary
objective: "6.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses IAM Identity Center. A permission set named SandboxAdmin, with the AdministratorAccess managed policy, is assigned to a contractor group in 12 sandbox accounts. The security team now requires that the contractors can use only 15 approved AWS services in these accounts. Platform automation roles in the same accounts must keep their current permissions, and the contractors must keep administrator rights within the approved services.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a customer managed policy that allows the approved services in each sandbox account, and set it as the permissions boundary of SandboxAdmin.
    - id: b
      text:
        en: |-
          Attach an SCP to the sandbox accounts' OU that allows only the 15 approved services, and replace the FullAWSAccess policy on that OU with it.
    - id: c
      text:
        en: |-
          Add an inline policy to SandboxAdmin that allows only the 15 approved services, and keep the AdministratorAccess policy attached to the permission set.
    - id: d
      text:
        en: |-
          Replace the AdministratorAccess policy in SandboxAdmin with the PowerUserAccess AWS managed policy, and provision the permission set again.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A permission set can include a permissions boundary, which Identity Center attaches to the role it creates in each account. The contractors' effective permissions become the intersection of AdministratorAccess and the boundary, while other roles in the accounts are not affected. A customer managed boundary must exist with the same name in every account where the permission set is assigned.
  options:
    b:
      en: |-
        An SCP on the OU would also restrict the platform automation roles in those accounts.
    c:
      en: |-
        Policies in a permission set add up, so AdministratorAccess would still allow every service.
    d:
      en: |-
        PowerUserAccess still allows nearly every service, not only the 15 approved ones.
references:
  - title: "Custom permissions for AWS managed and customer managed policies - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetcustom.html
