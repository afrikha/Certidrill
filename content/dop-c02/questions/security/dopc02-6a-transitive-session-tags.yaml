id: dopc02-6a-transitive-session-tags
objective: "6.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pipeline assumes a role named Broker in a tooling account and passes a session tag project=atlas when it calls AssumeRole. With the Broker credentials, the pipeline then assumes a role named Deployer in a workload account. Deployer's policies allow actions only on resources whose project tag equals aws:PrincipalTag/project. Deployments fail with access denied errors, and CloudTrail shows that the Deployer sessions have no project tag. The trust policies of both roles already allow sts:TagSession.

    Which solution will fix the deployments without hardcoding the project in Deployer?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the maximum session duration of Deployer to 12 hours so that the session keeps the tags of the Broker session.
    - id: b
      text:
        en: |-
          Tag the Broker role with project=atlas so that the role tag is passed automatically to the sessions of the roles it assumes.
    - id: c
      text:
        en: |-
          When the pipeline assumes Broker, set project as a transitive tag key so that the tag persists in the chained Deployer session.
    - id: d
      text:
        en: |-
          Change Deployer's policies to compare the resource's project tag with aws:RequestTag/project instead of aws:PrincipalTag/project.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      By default, AWS STS does not pass session tags to later sessions in a role chain. Tags marked as transitive persist during role chaining, so the Deployer session receives project=atlas and the ABAC conditions match.
  options:
    a:
      en: |-
        The session duration has no effect on tags, and role chaining limits the session to one hour anyway.
    b:
      en: |-
        Role tags cannot be set as transitive; only session tags can be passed to later sessions.
    d:
      en: |-
        aws:RequestTag checks tags passed in a request, such as tags added to a resource; it does not hold the tags of the calling session.
references:
  - title: "Pass session tags in AWS STS - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_session-tags.html
