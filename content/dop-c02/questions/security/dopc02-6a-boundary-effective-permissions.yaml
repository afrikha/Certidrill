id: dopc02-6a-boundary-effective-permissions
objective: "6.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A reporting job uses an IAM role whose identity-based policy allows s3:GetObject and dynamodb:Query on all resources. The role has a permissions boundary that allows s3:GetObject and sqs:SendMessage on all resources. No SCP, resource-based policy, or session policy applies to the role, and none of the policies contains a Deny statement.

    Which actions can the job perform with the role?
body:
  options:
    - id: a
      text:
        en: |-
          s3:GetObject and sqs:SendMessage
    - id: b
      text:
        en: |-
          s3:GetObject only
    - id: c
      text:
        en: |-
          s3:GetObject and dynamodb:Query
    - id: d
      text:
        en: |-
          s3:GetObject, dynamodb:Query, and sqs:SendMessage
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The effective permissions of a role with a permissions boundary are the intersection of its identity-based policies and the boundary. Only s3:GetObject is allowed by both.
  options:
    a:
      en: |-
        A permissions boundary never grants permissions; sqs:SendMessage is not allowed by the identity-based policy.
    c:
      en: |-
        The boundary does not allow dynamodb:Query, so that action is implicitly denied.
    d:
      en: |-
        Neither the boundary nor the identity-based policy adds permissions on its own; only actions allowed by both are effective.
references:
  - title: "Permissions boundaries for IAM entities - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
