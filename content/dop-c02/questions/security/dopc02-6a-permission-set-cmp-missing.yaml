id: dopc02-6a-permission-set-cmp-missing
objective: "6.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an organization instance of IAM Identity Center. The platform team created a permission set named AppDeveloper that references a customer managed policy named app-developer-access with the path /platform/. Each account has its own version of this policy, which contains the ARNs of that account's resources. The team assigned the permission set to a developer group in 25 workload accounts. Provisioning succeeded in the 20 accounts that the team had prepared but reported errors for 5 accounts that joined the organization last month. The developers need the permission set in those 5 accounts, and every account must keep its own version of the policy.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create the app-developer-access policy with the path /platform/ once in the management account, which Identity Center uses as the source for all accounts.
    - id: b
      text:
        en: |-
          Create an IAM policy named app-developer-access with the root path / in each of the 5 accounts, and provision the permission set again.
    - id: c
      text:
        en: |-
          Replace the customer managed policy reference in AppDeveloper with one inline policy that lists the resource ARNs of all 25 accounts, and provision the permission set again.
    - id: d
      text:
        en: |-
          Create an IAM policy named app-developer-access with the path /platform/ in each of the 5 accounts, for example with a StackSet, and provision the permission set again.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A permission set does not carry the content of a customer managed policy; it references a policy by name and path. The policy must already exist in every account where the permission set is assigned, with the same name and path, before the assignment is provisioned. Each account keeps its own version with its own resource ARNs.
  options:
    a:
      en: |-
        The referenced policy must exist in each assigned account; a policy in the management account does not apply to the workload accounts.
    b:
      en: |-
        When a customer managed policy uses a custom path, the same path must be used in every account.
    c:
      en: |-
        One inline policy would give every account the same statements, so the account-specific policies would be lost.
references:
  - title: "Custom permissions for AWS managed and customer managed policies - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetcustom.html
