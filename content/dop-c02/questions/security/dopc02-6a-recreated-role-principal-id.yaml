id: dopc02-6a-recreated-role-principal-id
objective: "6.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores build artifacts in an S3 bucket in a shared artifacts account. The bucket policy allows s3:GetObject for the ARN of a role named PipelineRole in the tooling account, and security policy requires that no other principal of the tooling account can read the artifacts. Last week, an engineer deleted PipelineRole by mistake and recreated it with AWS CloudFormation with the same name, path, permissions, and trust policy. Since then, the pipeline receives AccessDenied errors when it reads artifacts. In the bucket policy, the principal now appears as an identifier that starts with AROA instead of the role ARN.

    Which solution will restore access?
body:
  options:
    - id: a
      text:
        en: |-
          Add the shared artifacts account to the trust policy of the recreated PipelineRole so that Amazon S3 can map the stored identifier to the new role.
    - id: b
      text:
        en: |-
          Add a statement to the bucket policy that allows s3:GetObject for the root principal of the tooling account, and keep the statement that has the identifier.
    - id: c
      text:
        en: |-
          Edit the bucket policy to replace the identifier with the ARN of the recreated PipelineRole, and save the policy so that it references the new role.
    - id: d
      text:
        en: |-
          Detach and reattach the identity-based policies of the recreated PipelineRole so that IAM updates the role identifier stored in the bucket policy.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When a policy that names a role ARN is saved, AWS stores the role's unique principal ID. A recreated role gets a new principal ID, so the old statement no longer matches and shows the orphaned ID. Replacing it with the role ARN and saving the policy stores the new role's ID and restores access for that role only.
  options:
    a:
      en: |-
        The role's trust policy controls who can assume the role; it has no effect on how the bucket policy identifies the principal.
    b:
      en: |-
        Granting the tooling account root would let any principal that the tooling account allows read the artifacts, which security policy forbids.
    d:
      en: |-
        Changing the role's own policies does not change the principal ID stored in the bucket policy.
references:
  - title: "AWS JSON policy elements: Principal - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html
