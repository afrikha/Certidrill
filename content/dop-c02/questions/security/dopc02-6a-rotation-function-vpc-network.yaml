id: dopc02-6a-rotation-function-vpc-network
objective: "6.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company turned on rotation for an AWS Secrets Manager secret that holds the credentials of an Amazon RDS for MySQL DB instance in private subnets. The rotation function runs in the same private subnets, which have no NAT gateway and no internet access, and the company will not add internet access. Rotation has never succeeded: the function logs show no activity after "Found credentials in environment variables" until the function times out. The DB instance's security group allows inbound MySQL traffic only from the application servers' security group.

    Which combination of actions will make rotation succeed? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Increase the timeout of the rotation function to 15 minutes so that its calls to the Secrets Manager endpoint can complete.
    - id: b
      text:
        en: |-
          Create a gateway VPC endpoint for Secrets Manager, and associate it with the route tables of the private subnets that the function uses.
    - id: c
      text:
        en: |-
          Remove the VPC configuration from the rotation function so that the function reaches the public Secrets Manager endpoint.
    - id: d
      text:
        en: |-
          Add an inbound rule to the DB instance's security group that allows MySQL traffic from the rotation function's security group.
    - id: e
      text:
        en: |-
          Create an interface VPC endpoint for Secrets Manager in the VPC, with a security group that allows HTTPS from the rotation function's subnets.
answer: { optionIds: [d, e] }
explanation:
  correct:
    en: |-
      A rotation function must reach both a Secrets Manager endpoint and the database. In a VPC without internet access, an interface VPC endpoint for Secrets Manager provides the endpoint, and the database's security group must allow inbound connections from the function's security group.
  options:
    a:
      en: |-
        The function has no network path to Secrets Manager, so a longer timeout only delays the failure.
    b:
      en: |-
        Gateway endpoints exist only for Amazon S3 and DynamoDB; Secrets Manager uses interface endpoints.
    c:
      en: |-
        Outside the VPC, the function could no longer reach the DB instance in the private subnets.
references:
  - title: "Troubleshoot AWS Secrets Manager rotation - AWS Secrets Manager"
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/troubleshoot_rotation.html
