id: dopc02-6a-github-oidc-sub-main-branch
objective: "6.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's GitHub organization named example-corp contains 80 repositories. The production account has an IAM OIDC identity provider for GitHub Actions. A role named ProdDeploy must be assumable only by workflow runs on the main branch of the payments-api repository. Runs from feature branches of payments-api and runs from any other repository must be rejected. The trust policy of ProdDeploy already requires the token.actions.githubusercontent.com:aud key to equal sts.amazonaws.com.

    Which additional condition should a DevOps engineer add to the trust policy?
body:
  options:
    - id: a
      text:
        en: |-
          StringEquals on token.actions.githubusercontent.com:sub with the value repo:example-corp/payments-api:ref:refs/heads/main
    - id: b
      text:
        en: |-
          StringEquals on token.actions.githubusercontent.com:aud with the value repo:example-corp/payments-api:ref:refs/heads/main
    - id: c
      text:
        en: |-
          StringLike on token.actions.githubusercontent.com:sub with the value repo:example-corp/*:ref:refs/heads/main
    - id: d
      text:
        en: |-
          StringLike on token.actions.githubusercontent.com:sub with the value repo:example-corp/payments-api:*
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The sub claim of a GitHub Actions token identifies the repository and the Git ref of the workflow run. An exact match on repo:example-corp/payments-api:ref:refs/heads/main lets only runs on the main branch of payments-api assume the role. AWS recommends limiting sub to specific repositories or branches.
  options:
    b:
      en: |-
        The aud claim must match the audience sts.amazonaws.com; this condition would contradict the existing one and reject every token.
    c:
      en: |-
        The wildcard in the repository name lets the main branch of all 80 repositories assume the role.
    d:
      en: |-
        The wildcard after the repository name matches runs from any branch of payments-api, including feature branches.
references:
  - title: "Create a role for OpenID Connect federation (console) - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
