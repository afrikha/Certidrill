id: dopc02-6b-ssm-automation-multi-account
objective: "6.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's security team has written a custom Systems Manager Automation runbook that applies a security baseline to an account and Region. The runbook must run in 50 accounts in two OUs and in four Regions, started from a central Security Tooling account. The team requires that the runbook run in no more than five account and Region pairs at the same time and that the rollout stop when more than two of these pairs fail. The team does not want to sign in to each account or write orchestration code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Share the runbook with the 50 accounts, and ask each account owner to run it in the four Regions with the Run Command rate controls.
    - id: b
      text:
        en: |-
          Create an AWS Lambda function in the Security Tooling account that loops through the accounts and Regions, assumes a role in each, and calls StartAutomationExecution with a delay between accounts.
    - id: c
      text:
        en: |-
          Create a State Manager association in each account and Region that runs the runbook once, and deploy all the associations to the OUs with a CloudFormation StackSet.
    - id: d
      text:
        en: |-
          Create the Automation administration role centrally and the execution role in each target account, then run the runbook on the two OUs and four Regions with a concurrency of 5 and an error threshold of 2.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Systems Manager Automation can run a runbook in multiple accounts and Regions from a central account. The central account needs the AWS-SystemsManager-AutomationAdministrationRole, and each target account needs the AWS-SystemsManager-AutomationExecutionRole; the execution then uses target locations with OUs or accounts, Regions, and concurrency and error thresholds.
  options:
    a:
      en: |-
        Each account owner would have to sign in and run the runbook, which is the manual process the team wants to avoid.
    b:
      en: |-
        The Lambda function is orchestration code that reimplements the multi-account execution, concurrency control and error handling that Automation provides.
    c:
      en: |-
        Associations in every account and Region spread the run across many resources and cannot enforce one concurrency limit and one error threshold for the whole rollout from the central account.
references:
  - title: "Running automations in multiple AWS Regions and accounts - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-automations-multiple-accounts-regions.html
