id: dopc02-6c-exposed-access-key-response
objective: "6.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The AWS Trusted Advisor Exposed Access Keys check shows a red Potentially compromised status for an access key of the IAM user ci-legacy. A developer had committed the key to a public code repository two days earlier. AWS has attached the AWSCompromisedKeyQuarantineV3 managed policy to the user and opened a support case. The key is used only by an old build server that runs on an Amazon EC2 instance and can be changed to use an IAM role. The company must stop any further use of the leaked key and remove anything that an attacker might have done with it.

    Which combination of actions should a DevOps engineer take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Detach the AWSCompromisedKeyQuarantineV3 policy so that the build server works again, and then rotate the access key of ci-legacy.
    - id: b
      text:
        en: |-
          Deactivate and then delete the exposed access key, and configure the build server to use an instance profile role instead of the IAM user.
    - id: c
      text:
        en: |-
          Remove the commit that contains the key from the repository history and make the repository private, and keep the key active for the build server.
    - id: d
      text:
        en: |-
          Search the CloudTrail logs for every API call made with the exposed access key ID, and delete the unauthorized resources it created, such as instances, IAM users and access keys.
    - id: e
      text:
        en: |-
          Create a second access key for ci-legacy, store it in AWS Secrets Manager for the build server, and deactivate the exposed key after the build server is updated.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Trusted Advisor recommends deleting the affected access key as soon as possible and checking the account for unauthorized usage, such as running instances, Spot requests, access keys and IAM users. Deactivating then deleting the key stops its use, and moving the build server to a role removes the long-term credential. CloudTrail records the calls made with the key ID, which shows what the attacker created so that it can be removed.
  options:
    a:
      en: |-
        The quarantine policy only limits damage and must not be removed; rotating the key does not investigate or remove what the attacker already did.
    c:
      en: |-
        A key exposed in a public repository must be considered compromised: removing the commit does not invalidate the copies that others already have.
    e:
      en: |-
        The exposed key stays active while the build server is changed, and a new long-term key keeps the same risk instead of using a role.
references:
  - title: Security - AWS Support
    url: https://docs.aws.amazon.com/awssupport/latest/user/security-checks.html
  - title: AWSCompromisedKeyQuarantineV3 - AWS Managed Policy
    url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSCompromisedKeyQuarantineV3.html
