id: dopc02-6a-scp-require-boundary-on-roles
objective: "6.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company lets application teams create IAM roles in 40 workload accounts. Every role created in these accounts by anyone other than the PlatformAdmin role must have the permissions boundary WorkloadBoundary, a customer managed policy that a StackSet deploys to each account. Account administrators have full IAM permissions in their accounts and can write new identity-based policies. They must not be able to bypass the rule or remove the boundary from a role.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy an AWS Config rule to every account that detects roles without WorkloadBoundary, and notify the security team through Amazon SNS when a role is noncompliant.
    - id: b
      text:
        en: |-
          Set WorkloadBoundary as the permissions boundary of every account administrator's role so that the roles that the administrators create inherit the same boundary.
    - id: c
      text:
        en: |-
          Attach an SCP to the workloads OU that denies iam:CreateRole without the WorkloadBoundary boundary and denies iam:DeleteRolePermissionsBoundary, except for PlatformAdmin.
    - id: d
      text:
        en: |-
          Add a statement to the identity-based policies of the application teams that allows iam:CreateRole only when iam:PermissionsBoundary matches the WorkloadBoundary policy ARN.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An SCP applies to every principal in the member accounts, including administrators, and they cannot change it from their accounts. A deny with the iam:PermissionsBoundary condition blocks any role creation without WorkloadBoundary, the deny on iam:DeleteRolePermissionsBoundary keeps it in place, and the aws:PrincipalArn condition exempts PlatformAdmin.
  options:
    a:
      en: |-
        A Config rule only detects roles after they are created; it does not prevent the creation.
    b:
      en: |-
        A permissions boundary is not inherited by the roles that a principal creates.
    d:
      en: |-
        Account administrators with full IAM permissions could write or attach another policy that allows iam:CreateRole without the condition.
references:
  - title: "SCP syntax - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_syntax.html
  - title: "Permissions boundaries for IAM entities - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
