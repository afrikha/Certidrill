id: dopc02-6b-kms-custom-key-store-cloudhsm
objective: "6.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank must encrypt data at rest in Amazon S3, Amazon EBS, and Amazon RDS with keys whose key material is generated and stored in hardware security modules (HSMs) of a cluster that the bank owns and manages. The key material must stay within AWS, and the bank wants to keep the native integration of these services with AWS KMS so that applications do not change. The bank's security team accepts operating an HSM cluster.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create AWS KMS customer managed keys with key material generated by AWS KMS, and restrict their key policies to the bank's roles.
    - id: b
      text:
        en: |-
          Create an AWS CloudHSM cluster, create an AWS KMS custom key store backed by the cluster, and use KMS keys created in that key store for the three services.
    - id: c
      text:
        en: |-
          Create an AWS CloudHSM cluster, and have the applications send keys from the cluster with each request by using SSE-C for Amazon S3 and for the EBS volumes.
    - id: d
      text:
        en: |-
          Create an AWS KMS external key store that connects to HSMs in the bank's data center, and use its KMS keys for the three services.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In an AWS CloudHSM key store, AWS KMS generates and stores non-extractable key material in a CloudHSM cluster that the bank owns and manages, and cryptographic operations run in those HSMs. The keys are still KMS keys that S3, EBS and RDS use through their normal integration with customer managed keys.
  options:
    a:
      en: |-
        Standard KMS keys are generated and protected in HSMs that AWS KMS manages, not in a cluster that the bank owns and manages.
    c:
      en: |-
        SSE-C requires the application to send the key with every S3 request, which changes the applications, and EBS and RDS do not support customer-provided keys.
    d:
      en: |-
        An external key store keeps the key material outside AWS, which breaks the requirement that it stay within AWS.
references:
  - title: "AWS CloudHSM key stores - AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-cloudhsm.html
  - title: "External key stores - AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-external.html
