id: dopc02-6a-role-chaining-one-hour
objective: "6.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A nightly export job runs on an Amazon EC2 instance with an instance profile role. The job assumes a role named ExportRole in a data account and runs for about four hours. ExportRole's maximum session duration is 12 hours, and the job calls AssumeRole with DurationSeconds set to 14,400, but the call fails. The security team requires that the job act in the data account only through ExportRole and forbids long-term credentials.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the maximum session duration of the instance profile role to 12 hours so that the role chain allows a four-hour ExportRole session.
    - id: b
      text:
        en: |-
          Create an IAM user in the data account with ExportRole's permissions, and store its access keys in AWS Secrets Manager for the job to read.
    - id: c
      text:
        en: |-
          Attach ExportRole's permissions policies to the instance profile role, and have the job call the data account with the instance profile credentials.
    - id: d
      text:
        en: |-
          Assume ExportRole with sessions of one hour or less, and have the job refresh its credentials by assuming the role again before they expire.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Assuming a role with the credentials of another role is role chaining, which limits the session to one hour whatever the role's maximum session duration is. A request for more than one hour fails, so the job must use sessions of one hour or less and refresh them by assuming ExportRole again.
  options:
    a:
      en: |-
        The one-hour limit of role chaining applies regardless of the maximum session duration of either role.
    b:
      en: |-
        IAM user access keys are long-term credentials, which the security team forbids.
    c:
      en: |-
        The job would act in the data account without ExportRole, which the security team forbids, and identity-based policies alone do not grant access to another account.
references:
  - title: "IAM roles - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_terms-and-concepts.html
