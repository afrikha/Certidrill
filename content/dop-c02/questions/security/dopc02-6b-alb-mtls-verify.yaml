id: dopc02-6b-alb-mtls-verify
objective: "6.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company exposes an HTTPS API to 5,000 factory devices through an Application Load Balancer. Each device has an X.509 client certificate issued by the company's own certificate authority. The security team requires that connections from clients without a valid certificate from this authority be rejected during TLS negotiation, before any request reaches the targets. The development team does not want to add certificate validation code to the application.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure mutual TLS in passthrough mode on the HTTPS listener so that the load balancer sends the client certificate chain to the targets in HTTP headers.
    - id: b
      text:
        en: |-
          Associate an AWS WAF web ACL with the load balancer that blocks requests in which the X-Amzn-Mtls-Clientcert header is missing.
    - id: c
      text:
        en: |-
          Replace the Application Load Balancer with a Network Load Balancer that has a TLS listener and an ACM certificate for the API domain.
    - id: d
      text:
        en: |-
          Create a trust store from the company's CA certificate bundle, and configure mutual TLS in verify mode on the HTTPS listener with that trust store.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      In mutual TLS verify mode, the Application Load Balancer authenticates the X.509 client certificate while it negotiates the TLS connection, against the CA certificate bundle in the trust store. Clients without a valid certificate are rejected at the load balancer, so the targets need no validation code.
  options:
    a:
      en: |-
        In passthrough mode the load balancer does not verify the chain; the targets must verify it, which means validation code in the application.
    b:
      en: |-
        A WAF rule inspects HTTP requests after the TLS connection is established and cannot validate a client certificate chain against the company certificate authority.
    c:
      en: |-
        A TLS listener with a server certificate encrypts traffic but does not authenticate clients with their certificates.
references:
  - title: "Mutual authentication with TLS in Application Load Balancer - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/mutual-authentication.html
