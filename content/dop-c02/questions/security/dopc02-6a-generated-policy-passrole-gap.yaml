id: dopc02-6a-generated-policy-passrole-gap
objective: "6.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A DevOps engineer replaced the broad policy of a deployment role with a policy that IAM Access Analyzer generated from 90 days of CloudTrail events. An AWS CodeBuild project uses the role to create AWS CloudFormation stacks, and it passes a role named StackExecRole to CloudFormation as the stack service role. After the change, every deployment fails with an error that says the role is not authorized to perform iam:PassRole on StackExecRole. All the other actions in the deployment succeed. The company requires least privilege.

    Which change will fix the failure?
body:
  options:
    - id: a
      text:
        en: |-
          Add a statement to the generated policy that allows iam:PassRole only on the ARN of StackExecRole.
    - id: b
      text:
        en: |-
          Add a statement to the generated policy that allows iam:PassRole on all resources, because generated policies cannot name role ARNs.
    - id: c
      text:
        en: |-
          Add a statement to the generated policy that allows iam:* on the ARN of StackExecRole to cover every IAM action of the deployment.
    - id: d
      text:
        en: |-
          Generate the policy again from the same trail with a longer date range so that the iam:PassRole calls are included.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Policy generation builds the policy from CloudTrail events, but iam:PassRole is not tracked by CloudTrail and is therefore never included in a generated policy. The engineer must add it by hand, limited to the one role that the deployment passes.
  options:
    b:
      en: |-
        Allowing iam:PassRole on every role would let the deployment pass any role, which breaks least privilege; a resource ARN can be specified.
    c:
      en: |-
        The deployment needs only iam:PassRole; allowing every IAM action on the role would let it change the role's policies.
    d:
      en: |-
        Policy generation already covers up to 90 days, and iam:PassRole never appears in CloudTrail, so no date range would add it.
references:
  - title: "IAM Access Analyzer policy generation - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-policy-generation.html
