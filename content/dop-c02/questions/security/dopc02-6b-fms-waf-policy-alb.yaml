id: dopc02-6b-fms-waf-policy-alb
objective: "6.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 120 accounts in AWS Organizations, and application teams in the Workloads OU create Application Load Balancers (ALBs) every week. The security team requires every ALB in the Workloads OU to be associated with a web ACL that contains the same AWS Managed Rules rule groups, including ALBs created later and accounts added to the OU later. Application teams must still be able to add their own rules to the web ACL of their ALBs. A Firewall Manager administrator account is already configured, and AWS Config is enabled in all accounts. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy a web ACL and its ALB associations with a CloudFormation StackSet that targets the Workloads OU with automatic deployment, and ask teams to add their ALB ARNs to the template.
    - id: b
      text:
        en: |-
          Deploy the alb-waf-enabled AWS Config managed rule to every account, and remediate noncompliant ALBs with an AWS Lambda function that creates and associates a web ACL.
    - id: c
      text:
        en: |-
          Use AWS Firewall Manager to subscribe all accounts in the Workloads OU to AWS Shield Advanced, and enable automatic application layer DDoS mitigation on every ALB.
    - id: d
      text:
        en: |-
          Create an AWS Firewall Manager AWS WAF policy with the managed rule groups for the ALB resource type, scope it to the Workloads OU, and turn on automatic remediation.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A Firewall Manager AWS WAF policy manages web ACLs for every in-scope resource with the rule groups defined in the policy, and automatic remediation creates and associates the web ACLs. Scoping it to an OU includes accounts added later, Firewall Manager adds protection to new resources automatically, and account teams can still manage their own rules in those web ACLs.
  options:
    a:
      en: |-
        A StackSet only manages the resources in its template; ALBs that teams create later stay unprotected until someone edits the template, which is a manual step.
    b:
      en: |-
        The Config rule detects ALBs without a web ACL, but the Lambda remediation is custom code to build and maintain in every account, which Firewall Manager provides as a managed feature.
    c:
      en: |-
        Shield Advanced adds DDoS protection; it does not apply the required AWS Managed Rules rule groups to each ALB.
references:
  - title: "Creating an AWS Firewall Manager policy - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/create-policy.html
  - title: "AWS Firewall Manager - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html
