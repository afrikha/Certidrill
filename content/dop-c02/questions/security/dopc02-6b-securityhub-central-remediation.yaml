id: dopc02-6b-securityhub-central-remediation
objective: "6.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's Security Tooling account is the AWS Security Hub CSPM delegated administrator for all 200 accounts in its organization, in one Region. The security team wants to remediate automatically every FAILED finding of the control that checks whether Amazon EBS default encryption is enabled, in every current and future account. All remediation code must run only in the Security Tooling account, and member accounts must contain no remediation functions. The team wants the LEAST operational overhead.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          In the Security Tooling account, create an Amazon EventBridge rule that matches Security Hub Findings - Imported events for the control with a FAILED compliance status, and target an AWS Lambda function that turns on EBS encryption by default in the finding's account.
    - id: b
      text:
        en: |-
          Create a Security Hub CSPM custom action in the Security Tooling account, and ask analysts to send each new finding of the control to the remediation function.
    - id: c
      text:
        en: |-
          Deploy a StackSet with service-managed permissions and automatic deployment to the organization root that creates an IAM role that the remediation function can assume in each account.
    - id: d
      text:
        en: |-
          Deploy the Lambda function and an EventBridge rule to every member account with a StackSet, so that each account remediates its own findings.
    - id: e
      text:
        en: |-
          Create an AWS Config aggregator in the Security Tooling account, and attach the remediation function to the aggregator as a remediation action.
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      The administrator account receives Security Hub CSPM finding events for its member accounts, so one EventBridge rule there can start the remediation for every account. The function then assumes a role in the finding's account; a StackSet with service-managed permissions and automatic deployment creates that role in every current account and in accounts added later.
  options:
    b:
      en: |-
        Custom actions are started by analysts for selected findings; they do not remediate every finding automatically.
    d:
      en: |-
        This puts remediation functions in every member account, which the security team forbids.
    e:
      en: |-
        An aggregator only collects AWS Config data for viewing; remediation actions are configured on Config rules, not on aggregators.
references:
  - title: "Security Hub CSPM event types in EventBridge - AWS Security Hub"
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-cwe-integration-types.html
  - title: "Register a delegated administrator member account - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-delegated-admin.html
