id: dopc02-6b-shield-proactive-engagement
objective: "6.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An online gaming company serves its game API through an Amazon CloudFront distribution and an Application Load Balancer, and its DNS is hosted in Amazon Route 53. The company has an AWS Enterprise Support plan. After a DDoS attack degraded the game for two hours, management set two requirements. First, AWS DDoS response experts must contact the company's on-call team directly when an attack is detected and the application becomes unhealthy. Second, the company wants protection against cost spikes in its AWS bill that are caused by DDoS attacks on these resources.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Rely on AWS Shield Standard for the distribution and the load balancer, and open a critical support case from the on-call runbook when an attack is suspected.
    - id: b
      text:
        en: |-
          Subscribe to AWS Shield Advanced, and add the CloudFront distribution and the Application Load Balancer as protected resources.
    - id: c
      text:
        en: |-
          Enable Amazon GuardDuty, and create an Amazon EventBridge rule that sends DDoS-related findings to an Amazon SNS topic that the on-call team uses.
    - id: d
      text:
        en: |-
          Associate Amazon Route 53 health checks with the protected resources, add the on-call team as emergency contacts, and enable proactive engagement.
    - id: e
      text:
        en: |-
          Create an AWS Firewall Manager AWS WAF policy that adds rate-based rules to the web ACLs of the distribution and the load balancer.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      Shield Advanced adds expanded DDoS protection for the resources that are added to it, access to the Shield Response Team with a Business or Enterprise Support plan, and cost protection in the form of service credits. With proactive engagement, the SRT contacts the company directly when the Route 53 health check associated with a protected resource becomes unhealthy during a detected event; proactive engagement is available only for resources with health-based detection.
  options:
    a:
      en: |-
        Shield Standard has no Shield Response Team proactive engagement and no DDoS cost protection; waiting for the on-call team to open a case is the manual process the company wants to replace.
    c:
      en: |-
        GuardDuty is a threat detection service; it does not involve AWS DDoS experts or provide cost protection.
    e:
      en: |-
        Rate-based rules help against HTTP floods, but they do not bring proactive contact from AWS experts or cost protection.
references:
