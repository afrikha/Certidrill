id: dopc02-6a-roles-anywhere-onprem-certs
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs nightly batch jobs on 200 on-premises Linux servers. The jobs upload files to Amazon S3 with the AWS CLI by using an IAM user's access keys, which are stored in a configuration file on each server and rotated by hand twice a year. Every server already has an X.509 certificate issued by the company's internal certificate authority (CA), and the security team revokes a server's certificate when the server is decommissioned. The security team requires that the servers stop using long-term AWS credentials. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Register the internal CA as a trust anchor in IAM Roles Anywhere, create a role that trusts IAM Roles Anywhere and a profile for it, and have the jobs obtain temporary credentials with the server certificates.
    - id: b
      text:
        en: |-
          Store the IAM user's access keys in AWS Secrets Manager with a rotation function that runs every 30 days, and have the jobs retrieve the current keys from Secrets Manager at the start of each run.
    - id: c
      text:
        en: |-
          Create an Amazon Cognito identity pool that uses the internal CA as an identity provider, and have the jobs exchange their server certificates for credentials through the identity pool.
    - id: d
      text:
        en: |-
          Create an IAM OIDC identity provider for the internal CA, and have the jobs call AssumeRoleWithWebIdentity with the server certificate as the web identity token for a role in the account.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      IAM Roles Anywhere gives workloads outside AWS temporary credentials for an IAM role in exchange for an X.509 certificate issued by a CA that is registered as a trust anchor. The servers reuse the certificates they already have, no access key is stored on them, and a decommissioned server whose certificate is revoked can no longer obtain credentials.
  options:
    b:
      en: |-
        The jobs would still use long-term IAM user access keys, and they would need yet another credential to call Secrets Manager.
    c:
      en: |-
        Cognito identity pools federate users from user pools, SAML, OIDC, or social providers; they do not accept X.509 server certificates.
    d:
      en: |-
        An OIDC provider validates signed JSON web tokens from an OpenID Connect issuer, not X.509 certificates from a private CA.
references:
  - title: "What is AWS Identity and Access Management Roles Anywhere? - IAM Roles Anywhere"
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
