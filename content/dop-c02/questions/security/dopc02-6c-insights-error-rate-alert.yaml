id: dopc02-6c-insights-error-rate-alert
objective: "6.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's multi-Region trail logs read and write management events for its production account. After an incident in which a stolen credential probed permissions for hours, the security team wants to be notified when the number of failed API calls for any API becomes unusual compared with the account's normal pattern. The volume of errors varies by API and by time of day, so the team cannot define a fixed threshold for each API. Notifications must go to an existing Amazon SNS topic, and the team does not want to write code.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Enable CloudTrail Insights on the trail for the API error rate of management events.
    - id: b
      text:
        en: |-
          Enable CloudTrail Insights on the trail for the API call rate of management events only.
    - id: c
      text:
        en: |-
          Create an EventBridge rule for the AWS API Call via CloudTrail detail type whose detail.errorCode exists, with the SNS topic as the target.
    - id: d
      text:
        en: |-
          Create an EventBridge rule for the AWS Insight via CloudTrail detail type, with the SNS topic as the target.
    - id: e
      text:
        en: |-
          Send the trail to CloudWatch Logs, create a metric filter that counts events with an errorCode, and alarm when the count exceeds 100 in 5 minutes.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      CloudTrail Insights analyzes management activity and logs Insights events only when the API call rate or the API error rate differs significantly from the account's typical pattern, so the baseline is learned per API without thresholds. Insights events are sent to EventBridge with the detail type AWS Insight via CloudTrail, where a rule can target the SNS topic.
  options:
    b:
      en: |-
        The API call rate insight detects unusual call volumes, not unusual numbers of failed calls.
    c:
      en: |-
        This rule notifies on every failed API call, which is constant noise rather than a notification of unusual error activity.
    e:
      en: |-
        A static threshold of 100 errors is exactly what the team cannot define, because error volume varies by API and by time of day.
references:
  - title: CloudTrail concepts - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html
  - title: AWS service events delivered via AWS CloudTrail - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
