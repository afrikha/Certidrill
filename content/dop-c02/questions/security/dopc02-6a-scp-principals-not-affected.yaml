id: dopc02-6a-scp-principals-not-affected
objective: "6.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A security team attaches an SCP to the root of its organization in AWS Organizations. The SCP denies the deletion of Amazon EBS snapshots for all principals. During a review, the team lists the principals that could still delete EBS snapshots if their IAM permissions allow it.

    Which principals are not restricted by this SCP? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          An IAM role in a member account that is the delegated administrator for AWS Backup
    - id: b
      text:
        en: |-
          A service-linked role in a member account
    - id: c
      text:
        en: |-
          The root user of a member account
    - id: d
      text:
        en: |-
          The OrganizationAccountAccessRole role in a member account, when an administrator of the management account assumes it
    - id: e
      text:
        en: |-
          An IAM role in the organization's management account
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      SCPs affect only member accounts, so users and roles in the management account are never restricted by them. Service-linked roles are also not affected by SCPs.
  options:
    a:
      en: |-
        SCPs apply to member accounts that are designated as delegated administrators.
    c:
      en: |-
        SCPs apply to the root user of member accounts.
    d:
      en: |-
        The role is in a member account, so its sessions are restricted by the SCP, whoever assumes it.
references:
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
