id: dopc02-6c-access-analyzer-unused-org
objective: "6.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 150 accounts in an organization in AWS Organizations. Its Security Tooling account is the delegated administrator for IAM Access Analyzer. After an audit, the security team must maintain a continuously updated list of IAM roles that have not been used for 90 days, IAM user access keys and passwords that have not been used for 90 days, and services and actions that active roles and users have not used for 90 days. The list must cover every account from the Security Tooling account. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Schedule an AWS Lambda function that assumes a role in each account every week, downloads the IAM credential report, and stores the unused credentials in an Amazon S3 bucket.
    - id: b
      text:
        en: |-
          Deploy the iam-user-unused-credentials-check AWS Config managed rule as an organization rule with a maximum credential usage age of 90 days.
    - id: c
      text:
        en: |-
          In the Security Tooling account, create an IAM Access Analyzer unused access analyzer for the current organization with a tracking period of 90 days.
    - id: d
      text:
        en: |-
          In the Security Tooling account, create an IAM Access Analyzer external access analyzer with the organization as the zone of trust in each Region.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An unused access analyzer continuously reports unused roles, unused IAM user access keys and passwords, and unused services and actions of active roles and users. Created from the delegated administrator account with the current organization selected, it covers every account centrally, and its tracking period (1 to 365 days) is set to 90 days. Unused access findings do not depend on the Region, so one analyzer is enough.
  options:
    a:
      en: |-
        The credential report covers IAM users only, not unused roles or unused permissions, and the solution requires custom code to build and maintain.
    b:
      en: |-
        This rule checks IAM users' passwords and access keys only; it does not report unused roles or unused services and actions.
    d:
      en: |-
        An external access analyzer reports resources shared with principals outside the zone of trust; it does not analyze unused access.
references:
  - title: Create an IAM Access Analyzer unused access analyzer - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-create-unused.html
  - title: Using AWS Identity and Access Management Access Analyzer - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
