id: dopc02-6b-macie-custom-data-identifier
objective: "6.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A university uses Amazon Macie to find sensitive data in S3 buckets. Student records contain a student ID in the format STU- followed by eight digits, which no managed data identifier detects. The same pattern also appears in course catalog files, where it refers to sample IDs and is not sensitive, but there it is never near the words student or enrollment. The security team wants Macie to report the student IDs and to reduce false positives from the catalog files.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an allow list that contains the regular expression STU-[0-9]{8}, and add it to the sensitive data discovery settings.
    - id: b
      text:
        en: |-
          Create a custom data identifier with the regular expression STU-[0-9]{8} and the keywords student and enrollment in a proximity rule.
    - id: c
      text:
        en: |-
          Turn on the managed data identifiers for national identification numbers in all countries so that Macie detects the student IDs.
    - id: d
      text:
        en: |-
          Create a suppression rule that archives every finding whose object key contains the word catalog, and keep the default managed data identifiers.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A custom data identifier combines a regular expression with optional keywords that must be in proximity of the matching text, so Macie reports a match only when one of the keywords appears close to the pattern. This detects student IDs in records while ignoring the same pattern in catalog files, where the keywords are absent.
  options:
    a:
      en: |-
        An allow list defines text that Macie ignores, so this would suppress the student IDs instead of detecting them.
    c:
      en: |-
        Managed identifiers for national identification numbers detect national formats, not an internal STU- format.
    d:
      en: |-
        Archiving findings by key name does not add detection for the STU- pattern, which no managed identifier finds.
references:
  - title: "Building custom data identifiers - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/custom-data-identifiers.html
