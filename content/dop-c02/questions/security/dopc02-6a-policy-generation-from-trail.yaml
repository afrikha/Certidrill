id: dopc02-6a-policy-generation-from-trail
objective: "6.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodeBuild project for an internal service has used a service role with the AdministratorAccess managed policy since the project was created two years ago. The account has a CloudTrail trail that delivers management events to an S3 bucket in the same account, and the company has never used CloudTrail Lake. The security team requires that the role keep only the actions that it actually used in the last 60 days. A DevOps engineer wants to obtain a starting policy with the LEAST effort and then narrow the resource ARNs.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM Access Analyzer external access analyzer for the account, and remove from the role the permissions that the analyzer's findings report.
    - id: b
      text:
        en: |-
          Generate a policy for the role with IAM Access Analyzer from 60 days of the trail's events, add resource ARNs, and attach it in place of AdministratorAccess.
    - id: c
      text:
        en: |-
          Review the service last accessed information of the role in the IAM console, and write a policy that allows all actions of each service that the role accessed.
    - id: d
      text:
        en: |-
          Create a CloudTrail Lake event data store, import the trail's logs, query the role's events, and write a policy by hand from the list of actions that the query returns.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      IAM Access Analyzer policy generation reviews up to 90 days of CloudTrail events for a role and builds a policy template with the services and actions that the role used. Where actions support resource-level permissions, the template contains placeholders to replace with ARNs, and the result can be saved and attached in place of the broad policy.
  options:
    a:
      en: |-
        External access findings report resources shared outside the zone of trust; they say nothing about the role's unused permissions.
    c:
      en: |-
        Last accessed information shows services and, for some services, actions; allowing all actions of each service would not reduce the role to the actions it used.
    d:
      en: |-
        CloudTrail Lake has been closed to new customers since May 31, 2026, and writing the policy by hand is more effort than generating it.
references:
  - title: "IAM Access Analyzer policy generation - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-policy-generation.html
