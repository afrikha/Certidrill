id: dopc02-6b-s3-bucket-keys-kms-requests
objective: "6.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company stores millions of small objects in an S3 bucket whose default encryption is SSE-KMS with a customer managed key. An analytics job reads and writes objects at a high rate, and the job sometimes fails with KMS throttling errors. AWS KMS request charges have also become a significant part of the bill. The security team requires the objects to stay encrypted with the same customer managed key, and the developers do not want to change the job's code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the default encryption of the bucket to SSE-S3, and keep the customer managed key for other workloads.
    - id: b
      text:
        en: |-
          Request a service quota increase for AWS KMS cryptographic operations in the Region, and keep the bucket configuration unchanged.
    - id: c
      text:
        en: |-
          Change the default encryption of the bucket to DSSE-KMS with the same customer managed key.
    - id: d
      text:
        en: |-
          Enable S3 Bucket Keys in the default encryption configuration of the bucket.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      S3 Bucket Keys let Amazon S3 use a bucket-level key, derived from the KMS key, to create data keys for objects, which greatly reduces the number of requests from S3 to AWS KMS. Fewer requests lower the KMS request cost and the request rate that counts against KMS quotas, while new objects stay encrypted with the same customer managed key and the job is unchanged.
  options:
    a:
      en: |-
        SSE-S3 does not use the customer managed key, which the security team requires.
    b:
      en: |-
        A higher quota may reduce throttling, but the number of KMS requests and their cost stay the same.
    c:
      en: |-
        Dual-layer encryption applies two layers of encryption and does not reduce KMS requests.
references:
  - title: "Reducing the cost of SSE-KMS with Amazon S3 Bucket Keys - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-key.html
