id: dopc02-6a-abac-ec2-team-tags
objective: "6.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 30 development teams that share one development account. Each engineer signs in with a role that has a team tag, such as team=search, and every Amazon EC2 instance has a team tag with the owning team's name. Engineers must be able to start, stop, and reboot only the instances of their own team. New teams are created every month, and the security team does not want to create or edit any policy when a team is added.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create one customer managed policy for each team that lists the ARNs of the team's instances, and update the policy when the team launches instances.
    - id: b
      text:
        en: |-
          Attach one policy to the engineers' roles that allows the start, stop, and reboot actions on instances when aws:RequestTag/team equals ${aws:PrincipalTag/team}.
    - id: c
      text:
        en: |-
          Create one customer managed policy for each team that allows the start, stop, and reboot actions on instances whose team tag has that team's name.
    - id: d
      text:
        en: |-
          Attach one policy to the engineers' roles that allows the start, stop, and reboot actions on instances when aws:ResourceTag/team equals ${aws:PrincipalTag/team}.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Attribute-based access control compares the principal's tag with the resource's tag, so one policy works for every team. A new team needs only tagged roles and tagged instances, without any policy change.
  options:
    a:
      en: |-
        Policies that list resources must be edited for every team and every new instance.
    b:
      en: |-
        aws:RequestTag checks tags passed in the request, such as tags added at creation; start, stop, and reboot requests do not carry the instance's team tag.
    c:
      en: |-
        Every new team would need a new policy, which the security team wants to avoid.
references:
  - title: "IAM tutorial: Define permissions to access AWS resources based on tags - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_attribute-based-access-control.html
