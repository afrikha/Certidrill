id: dopc02-6b-s3-object-ownership-enforced
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's data lake account owns an S3 bucket that receives files from 15 partner AWS accounts. The bucket policy allows the partners to call s3:PutObject, and the bucket was created years ago with ACLs enabled. Partners upload files without specifying an ACL. Analysts in the data lake account get AccessDenied errors on some partner files, because the partner that uploaded each of these files owns it. The company needs the data lake account to own and control access to every object, including existing objects, and wants access to be managed only by policies. Partners must not need to change their upload code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set S3 Object Ownership on the bucket to bucket owner enforced so that ACLs are disabled and the bucket owner owns every object.
    - id: b
      text:
        en: |-
          Add a bucket policy statement that requires the bucket-owner-full-control canned ACL on every PutObject request from the partners.
    - id: c
      text:
        en: |-
          Ask each partner to copy its objects again with the bucket-owner-full-control ACL, and keep ACLs enabled on the bucket.
    - id: d
      text:
        en: |-
          Grant the analysts' IAM role s3:GetObjectAcl and s3:PutObjectAcl on the bucket so that they can take ownership of each object.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With the bucket owner enforced setting, ACLs are disabled and the bucket owner automatically owns and has full control over every object in the bucket, including objects that other accounts uploaded. Access is then controlled only by policies, and partners' uploads keep working as long as they do not send ACLs other than bucket-owner-full-control.
  options:
    b:
      en: |-
        Requiring the canned ACL breaks partner uploads that do not send it, which forces code changes, and existing objects keep their current owners.
    c:
      en: |-
        Rewriting the objects needs work from every partner and keeps ACLs as an access mechanism, against the requirement to manage access only with policies.
    d:
      en: |-
        ACL permissions let a principal read or change an object's ACL, but they do not transfer object ownership to the bucket owner.
references:
  - title: "Controlling ownership of objects and disabling ACLs for your bucket - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/about-object-ownership.html
