id: dopc02-6b-drift-nested-explicit-props
objective: "6.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company manages a payments platform with a parent CloudFormation stack that contains a nested stack for networking. During an incident, an operator made two changes outside CloudFormation. First, the operator added an inbound rule to a security group that the networking nested stack defines. Second, the operator changed the visibility timeout of an Amazon SQS queue in the parent stack; the queue's template does not set the VisibilityTimeout property. A DevOps engineer then ran drift detection on the parent stack, which reported IN_SYNC.

    Which statements explain why neither change was reported? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Drift detection on a stack does not evaluate the resources of its nested stacks; drift detection must be run on the nested stack itself.
    - id: b
      text:
        en: |-
          Drift detection compares only the property values that are explicitly set in the template or through parameters, so a change to a property that the template does not set is not reported.
    - id: c
      text:
        en: |-
          Drift detection reports only changes that are older than 24 hours, so changes made during the incident appear later.
    - id: d
      text:
        en: |-
          Drift detection requires AWS Config to record the stack's resource types, and the account does not record SQS queues.
    - id: e
      text:
        en: |-
          Security groups do not support drift detection, so changes to their rules are never reported.
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |-
      CloudFormation drift detection checks only the property values that the template or its parameters explicitly set, not defaults or unset properties, so the visibility timeout change is invisible. It also does not evaluate the resources of nested stacks when it runs on the parent; running drift detection on the nested stack finds the new security group rule.
  options:
    c:
      en: |-
        Drift detection compares the current configuration when it runs; there is no 24-hour delay.
    d:
      en: |-
        Drift detection is a CloudFormation feature that does not depend on AWS Config recording.
    e:
      en: |-
        Security groups support drift detection; a resource type that is not supported would show NOT_CHECKED rather than IN_SYNC.
references:
  - title: "Detect unmanaged configuration changes to stacks and resources with drift detection - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-drift.html
