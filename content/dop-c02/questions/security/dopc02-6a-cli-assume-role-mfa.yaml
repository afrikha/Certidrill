id: dopc02-6a-cli-assume-role-mfa
objective: "6.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Five platform engineers are IAM users who run administrative scripts with the AWS CLI from their laptops. Their access keys allow only sts:AssumeRole on a role named PlatformAdmin, which has the administrative permissions. The security team requires that PlatformAdmin can be assumed only by users who authenticated with MFA. The engineers want the AWS CLI to prompt them for the MFA code automatically when a script uses the role.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Have the engineers call sts get-session-token with their MFA code each morning, and keep the PlatformAdmin trust policy unchanged.
    - id: b
      text:
        en: |-
          Add a condition to the PlatformAdmin trust policy that requires aws:MultiFactorAuthPresent to be true.
    - id: c
      text:
        en: |-
          Add a condition to the PlatformAdmin trust policy that requires aws:SourceIdentity to equal the engineer's IAM user name.
    - id: d
      text:
        en: |-
          Create a CLI profile with role_arn set to PlatformAdmin, source_profile set to the user's profile, and mfa_serial set to the user's MFA device.
    - id: e
      text:
        en: |-
          Deploy the access-keys-rotated AWS Config rule with maxAccessKeyAge set to 1 so that the engineers' access keys act as a second factor.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      An MFA condition in the role's trust policy makes AssumeRole fail unless the caller authenticated with MFA. A CLI profile with role_arn, source_profile, and mfa_serial makes the AWS CLI ask for the MFA code and assume the role with it when a command uses the profile.
  options:
    a:
      en: |-
        Without the trust policy condition, engineers could still assume the role with their access keys alone.
    c:
      en: |-
        Source identity records who uses the role; it does not prove that MFA was used.
    e:
      en: |-
        The Config rule only reports key age; access keys never become a second authentication factor.
references:
  - title: "Using an IAM role in the AWS CLI - AWS Command Line Interface"
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-role.html
  - title: "Secure API access with MFA - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa_configure-api-require.html
