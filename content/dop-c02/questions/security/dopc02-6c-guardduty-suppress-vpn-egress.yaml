id: dopc02-6c-guardduty-suppress-vpn-egress
objective: "6.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company routes all internet-bound traffic from its VPCs through a Site-to-Site VPN connection and egresses through its on-premises firewall, whose public addresses are in 198.51.100.0/28. Amazon GuardDuty, managed from a delegated administrator account, generates many UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS findings for API calls that instances make from these addresses. The findings flood the team's EventBridge-based paging. The team must stop paging for this expected behavior, but GuardDuty must keep reporting this finding type for any other address and every other finding type for the firewall addresses.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add 198.51.100.0/28 to a GuardDuty trusted IP list in the delegated administrator account and activate the list.
    - id: b
      text:
        en: |-
          In each member account, archive the existing findings of this type and change the EventBridge rule to drop findings from all instance roles.
    - id: c
      text:
        en: |-
          In the delegated administrator account, create a suppression rule that matches this finding type and an API caller IPv4 address of 198.51.100.0/28.
    - id: d
      text:
        en: |-
          Change the EventBridge rule to match only findings with a severity of 9 or higher so that this finding type no longer pages the team.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      This finding is commonly generated when traffic egresses through an on-premises gateway, such as over a VPN connection. A suppression rule with the finding type and the API caller IPv4 address (a CIDR range is allowed) automatically archives matching new findings, which are then not sent to EventBridge. Only the GuardDuty administrator account can create suppression rules in a multi-account environment.
  options:
    a:
      en: |-
        GuardDuty does not generate CloudTrail and VPC flow log based findings for trusted IP addresses, so every other finding type for the firewall addresses would also stop.
    b:
      en: |-
        Archiving existing findings does not affect new ones, and dropping findings for all instance roles also hides this finding type for other addresses.
    d:
      en: |-
        Raising the threshold suppresses every high severity finding of every type, not only the expected one, and other alerts would be lost.
references:
  - title: Suppression rules in GuardDuty - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/findings_suppression-rule.html
  - title: GuardDuty IAM finding types - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-iam.html
