id: dopc02-6c-lambda-missing-logs-role
objective: "6.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A DevOps engineer deploys a new AWS Lambda function with an AWS CloudFormation template. The template creates a custom execution role whose only policy allows dynamodb:PutItem on one table. The function runs successfully and writes items to the table, but the security team cannot find any log group or log events for the function in Amazon CloudWatch Logs. The team requires the function's logs for auditing, with least privilege.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable AWS X-Ray active tracing on the function so that its invocations are recorded in CloudWatch Logs.
    - id: b
      text:
        en: |-
          Attach the AWSLambdaBasicExecutionRole managed policy to the function's execution role.
    - id: c
      text:
        en: |-
          Add a resource-based policy to the function that allows the logs.amazonaws.com service principal to invoke it.
    - id: d
      text:
        en: |-
          Enable CloudTrail data events for the function so that every invocation is recorded with its output.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Lambda sends function logs to CloudWatch Logs by using the function's execution role, which needs permission to create the log group and log streams and to put log events. The AWSLambdaBasicExecutionRole managed policy grants exactly these CloudWatch Logs permissions, so the function's output appears in its log group after the change.
  options:
    a:
      en: |-
        Tracing records request traces for latency analysis; it does not give the execution role permission to write the function's logs.
    c:
      en: |-
        A resource-based policy controls who can invoke the function; logs are written with the execution role's permissions, not by CloudWatch Logs invoking the function.
    d:
      en: |-
        CloudTrail data events record who invoked the function, not the logs that the function code writes.
references:
  - title: Sending Lambda Event Function logs to CloudWatch Logs - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs.html
