id: dopc02-6a-get-session-token-mfa-cli
objective: "6.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A small company still uses IAM users for three administrators. Their identity-based policy allows ec2:StopInstances and ec2:TerminateInstances only when aws:MultiFactorAuthPresent is true, and each administrator has a virtual MFA device. The administrators can stop instances from the console after signing in with MFA, but the same AWS CLI commands with their access keys fail with access denied errors. The administrators must use the AWS CLI, and the policy must not be relaxed.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the policy condition to BoolIfExists with the value true so that requests made with long-term access keys also match the condition.
    - id: b
      text:
        en: |-
          Have each administrator sign in to the console with MFA, create a new access key for the IAM user, and run the EC2 commands with the new access key.
    - id: c
      text:
        en: |-
          Have each administrator call the AWS STS GetFederationToken operation with the access keys, and run the EC2 commands with the federated user credentials that it returns.
    - id: d
      text:
        en: |-
          Have each administrator call the AWS STS GetSessionToken operation with the MFA device's ARN and current code, and run the EC2 commands with the temporary credentials that it returns.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Requests signed with long-term access keys do not include aws:MultiFactorAuthPresent, so the Allow condition never matches them. Temporary credentials returned by GetSessionToken, when the call includes the MFA device and a current code, carry the MFA information, so the EC2 calls made with them satisfy the condition.
  options:
    a:
      en: |-
        With BoolIfExists, requests without the key would match the Allow, so long-term keys could stop and terminate instances without MFA, which relaxes the policy.
    b:
      en: |-
        An access key is a long-term credential, and requests signed with it never carry MFA information, however the key was created.
    c:
      en: |-
        The request to GetFederationToken does not include the MFA device and code, so the returned credentials do not prove MFA.
references:
  - title: "Secure API access with MFA - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa_configure-api-require.html
  - title: "AWS global condition context keys - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
