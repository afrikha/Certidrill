id: dopc02-6c-athena-cloudtrail-key-history
objective: "6.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company discovered that an IAM user access key was exposed and has deactivated it. The key had been active for 14 months. The company's multi-Region trail has delivered management events to an S3 bucket for three years and does not send events to CloudWatch Logs. The security team must list every API call made with the key during its whole lifetime, grouped by event name and source IP address, by using SQL and without moving the log data.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Filter CloudTrail Event history on the access key ID in each Region, and download the results for the whole 14-month period.
    - id: b
      text:
        en: |-
          Create an Amazon Athena table on the trail's log files in S3, and query it with a WHERE clause on the access key ID.
    - id: c
      text:
        en: |-
          Run a CloudWatch Logs Insights query that filters on the access key ID across all the log groups of the account.
    - id: d
      text:
        en: |-
          Create a CloudTrail Lake event data store, and run a SQL query that filters on the access key ID.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Athena queries CloudTrail log files directly in Amazon S3 by pointing a table at their location; the table can even be created from the CloudTrail console. A SQL query that filters on the access key ID and groups by event name and source IP address covers the full 14 months that the trail delivered.
  options:
    a:
      en: |-
        Event history keeps only the last 90 days of management events, so most of the key's activity would be missing, and it is not a SQL interface.
    c:
      en: |-
        Logs Insights queries only data in CloudWatch Logs, and this trail never sent its events there.
    d:
      en: |-
        CloudTrail Lake is closed to new customers, and the existing events would have to be copied into an event data store.
references:
  - title: Query AWS CloudTrail logs - Amazon Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/cloudtrail-logs.html
