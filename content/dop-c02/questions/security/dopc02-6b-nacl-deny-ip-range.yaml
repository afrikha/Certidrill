id: dopc02-6b-nacl-deny-ip-range
objective: "6.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company runs SFTP and HTTPS endpoints on Amazon EC2 instances that have Elastic IP addresses in a public subnet. Partners connect from many IP addresses that change often, so the security group of the instances allows TCP ports 22 and 443 from 0.0.0.0/0. The security team has identified repeated attacks on both ports from the 198.51.100.0/24 address range. The team must block all traffic from this range to every instance in the subnet while all other sources keep their access. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an inbound deny rule for 198.51.100.0/24 to the security group of the instances, and give the rule a higher priority than the existing allow rules.
    - id: b
      text:
        en: |-
          Create an AWS WAF web ACL with an IP set rule that blocks 198.51.100.0/24, and associate the web ACL with the Elastic IP addresses of the instances.
    - id: c
      text:
        en: |-
          Add an inbound deny rule for 198.51.100.0/24 to the subnet's network ACL, with a lower rule number than the rules that allow ports 22 and 443.
    - id: d
      text:
        en: |-
          Subscribe to AWS Shield Advanced, add the Elastic IP addresses as protected resources, and ask the Shield Response Team to block 198.51.100.0/24.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Network ACLs support both allow and deny rules and evaluate them from the lowest rule number upward, applying the first match. A deny rule for 198.51.100.0/24 with a lower number than the allow rules blocks the range for every instance in the subnet on all ports, while the other sources still match the allow rules.
  options:
    a:
      en: |-
        Security group rules can only allow traffic; there are no deny rules and no rule priority in a security group.
    b:
      en: |-
        AWS WAF protects HTTP(S) resources such as CloudFront, Application Load Balancers and API Gateway REST APIs; it cannot be associated with Elastic IP addresses and does not inspect SFTP.
    d:
      en: |-
        Shield Advanced adds DDoS protection and response support; it is not a way to maintain a simple IP block rule, and it adds cost and process for a one-line network ACL change.
references:
  - title: "Network ACL rules - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nacl-rules.html
  - title: "Security group rules - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html
