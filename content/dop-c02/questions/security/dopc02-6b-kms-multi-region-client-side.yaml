id: dopc02-6b-kms-multi-region-client-side
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company is designing a new application that encrypts payment records on the client side with the AWS Encryption SDK before it writes them to an Amazon DynamoDB global table in us-east-1 and us-west-2. During a us-east-1 outage, the application stack in us-west-2 must decrypt every record, including records written in us-east-1, without calling AWS KMS in us-east-1. The records must not be re-encrypted when they are replicated. The security team has an existing single-Region customer managed key in us-east-1 that it considered reusing.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Convert the existing single-Region key into a multi-Region key, replicate it to us-west-2, and use the related keys in each Region.
    - id: b
      text:
        en: |-
          Create a customer managed key in us-west-2 with the same alias as the us-east-1 key, and let the Encryption SDK select the key by alias in each Region.
    - id: c
      text:
        en: |-
          Keep the existing key in us-east-1, and allow the application role in us-west-2 to call kms:Decrypt on it through an interface VPC endpoint.
    - id: d
      text:
        en: |-
          Create a new multi-Region primary key in us-east-1, replicate it to us-west-2, and use the primary or the replica key in the Region where the application runs.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Related multi-Region keys share the same key material and key ID, so data encrypted in one Region can be decrypted in another without re-encryption or a cross-Region call to AWS KMS. An existing single-Region key cannot be converted, so the design needs a new multi-Region primary key and a replica in us-west-2.
  options:
    a:
      en: |-
        AWS KMS cannot convert an existing single-Region key into a multi-Region key.
    b:
      en: |-
        Two independent keys have different key material, so the us-west-2 key cannot decrypt data encrypted under the us-east-1 key, whatever their aliases.
    c:
      en: |-
        Decryption would still call AWS KMS in us-east-1, which fails the requirement during a us-east-1 outage.
references:
  - title: "Multi-Region keys in AWS KMS - AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html
