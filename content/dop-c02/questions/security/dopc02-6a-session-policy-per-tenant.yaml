id: dopc02-6a-session-policy-per-tenant
objective: "6.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS company processes files for 300 tenants with a fleet of worker containers. Each tenant's files are stored under its own prefix, such as tenant-0042/, in one S3 bucket. Every job processes the files of exactly one tenant, and the worker knows the tenant ID when the job starts. All workers use an IAM role named TenantWorker that can read and write the whole bucket. After a bug caused a job to overwrite another tenant's files, the security team requires that the credentials used by a job can reach only that job's tenant prefix. The company does not want to create or maintain a role for each tenant.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          When each job starts, call AssumeRole on TenantWorker with an inline session policy that allows the S3 actions only on the job's tenant prefix, and run the job with the returned credentials.
    - id: b
      text:
        en: |-
          Use IAM Access Analyzer to generate a policy from the TenantWorker activity of the last 90 days, and replace the role's policy with the generated policy.
    - id: c
      text:
        en: |-
          Add a permissions boundary to TenantWorker that allows the S3 actions only on objects under tenant prefixes, and keep running every job with the same TenantWorker session credentials.
    - id: d
      text:
        en: |-
          Create one S3 access point for each tenant prefix, and have each job send its requests through the access point of its tenant while it uses the TenantWorker credentials.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A session policy passed in the AssumeRole call limits the permissions of that one session to the intersection of the role's identity-based policies and the session policy. Each job therefore receives credentials scoped to its own tenant prefix, while all jobs keep using one role.
  options:
    b:
      en: |-
        A generated policy reflects what the role used across all tenants; it cannot restrict each job to a different prefix.
    c:
      en: |-
        A permissions boundary is fixed for the role and applies to every session in the same way, so each job could still reach every tenant prefix.
    d:
      en: |-
        The TenantWorker credentials could still access every prefix directly through the bucket, and 300 access points add maintenance.
references:
  - title: "Policies and permissions in AWS Identity and Access Management - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html
