id: dopc02-6b-cloudfront-alb-origin-lock
objective: "6.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company serves a web application through an Amazon CloudFront distribution that has an AWS WAF web ACL, with an internet-facing Application Load Balancer (ALB) as the origin. Logs show that attackers send requests directly to the ALB DNS name and bypass the web ACL. The security team requires that the ALB accept only requests that come through this distribution. The ALB must stay internet-facing.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a network ACL rule to the ALB subnets that denies traffic from the IP addresses found in the attackers' requests.
    - id: b
      text:
        en: |-
          Associate the same web ACL with the ALB, and add a rule that allows only requests whose User-Agent header contains Amazon CloudFront.
    - id: c
      text:
        en: |-
          Allow inbound HTTPS in the ALB security group only from the AWS managed prefix list for CloudFront origin-facing servers.
    - id: d
      text:
        en: |-
          Configure CloudFront to add a custom header with a secret value to origin requests, and make the ALB forward only requests that contain the header, with a default action that returns 403.
    - id: e
      text:
        en: |-
          Subscribe to AWS Shield Advanced, and add the ALB as a protected resource with automatic application layer DDoS mitigation.
answer: { optionIds: [c, d] }
explanation:
  correct:
    en: |-
      The origin-facing managed prefix list limits the ALB to traffic from CloudFront servers, and the secret custom header proves that a request came through this distribution rather than another CloudFront distribution. Together they stop direct requests to the ALB, so every request passes through the distribution's web ACL.
  options:
    a:
      en: |-
        Blocking the attackers' current addresses is reactive; any other address can still reach the ALB directly.
    b:
      en: |-
        The User-Agent header is set by the client and can be forged, so it does not prove that a request came through the distribution.
    e:
      en: |-
        Shield Advanced protects against DDoS attacks; it does not stop clients from sending requests directly to the ALB.
references:
  - title: "Restrict access to Application Load Balancers - Amazon CloudFront"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/restrict-access-to-load-balancer.html
