id: dopc02-6a-ec2-credentials-source-vpc
objective: "6.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's applications run on Amazon EC2 instances in one VPC and reach AWS services through VPC interface and gateway endpoints. After an incident in which instance profile credentials were stolen and used from outside AWS, the security team requires that credentials delivered to an EC2 instance be usable only from the VPC that the instance runs in. The rule must be one policy statement that works for every instance role, without listing VPC IDs or IP addresses.

    Which policy statement will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          An Allow statement for all actions when aws:Ec2InstanceSourcePrivateIPv4 is in the private IPv4 range of the VPC
    - id: b
      text:
        en: |-
          A Deny statement for all actions when aws:SourceIp is not in the private IPv4 range of the VPC
    - id: c
      text:
        en: |-
          A Deny statement for all actions when aws:ViaAWSService is false
    - id: d
      text:
        en: |-
          A Deny statement for all actions when aws:SourceVpc does not equal the ${aws:Ec2InstanceSourceVpc} policy variable
answer: { optionId: d }
explanation:
  correct:
    en: |-
      aws:Ec2InstanceSourceVpc identifies the VPC where EC2 role credentials were delivered, and aws:SourceVpc identifies the VPC of a request sent through a VPC endpoint. Denying requests whose source VPC differs from the delivery VPC blocks stolen credentials used elsewhere, and the policy variable avoids listing VPC IDs.
  options:
    a:
      en: |-
        AWS warns not to use the private IP key alone in an Allow statement, because private addresses are not globally unique.
    b:
      en: |-
        The statement lists address ranges, which the rule forbids, and it does not tie each credential to the VPC where it was delivered.
    c:
      en: |-
        This would deny every direct call that the application makes, not only calls from stolen credentials.
references:
  - title: "AWS global condition context keys - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
