id: dopc02-6b-sg-reference-app-tier
objective: "6.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a three-tier application in a VPC. The application tier runs in an Amazon EC2 Auto Scaling group that adds and removes instances many times a day, and the database tier runs on Amazon EC2 instances that listen on TCP port 5432. The database subnets also host other workloads. The security team requires that only instances of the application tier can connect to the database port, with no manual updates when the application tier scales.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an inbound rule to the database network ACL that allows TCP 5432 from the CIDR blocks of the application subnets.
    - id: b
      text:
        en: |-
          Add an inbound rule to the database security group that allows TCP 5432 with the application tier's security group as the source.
    - id: c
      text:
        en: |-
          Create an AWS Lambda function that adds each new application instance's private IP address to the database security group on scale-out events.
    - id: d
      text:
        en: |-
          Associate an AWS WAF web ACL with the database instances that allows only requests from the application tier's IP addresses.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When a security group is the source of a rule, the rule applies to all instances that are associated with that security group, using their private IP addresses. New application instances that receive the application security group can connect at once, and nothing must be updated when the group scales.
  options:
    a:
      en: |-
        A subnet CIDR rule allows any workload in the application subnets, not only the application tier, and stateless network ACLs also need rules for return traffic.
    c:
      en: |-
        The function is custom code that must also remove addresses on scale-in; referencing the security group gives the same result without code.
    d:
      en: |-
        AWS WAF protects HTTP resources such as load balancers and API Gateway; it cannot be associated with EC2 instances or filter database traffic.
references:
  - title: "Security group rules - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html
