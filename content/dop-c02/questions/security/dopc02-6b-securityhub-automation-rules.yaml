id: dopc02-6b-securityhub-automation-rules
objective: "6.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's Security Tooling account is the AWS Security Hub CSPM delegated administrator for 150 accounts. The control that checks whether EC2 instances have a public IPv4 address generates many findings in the 30 accounts of the Sandbox OU, where public instances are accepted. Auditors need the control to stay enabled in every account so that its compliance data is complete. The security team wants new findings of this control in the Sandbox accounts to be marked as suppressed automatically as soon as they are generated, without writing code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Disable the control for the Sandbox accounts with a Security Hub CSPM configuration policy that the Security Tooling account associates with the Sandbox OU.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule for the control's findings that invokes an AWS Lambda function, which calls BatchUpdateFindings to set the workflow status to SUPPRESSED.
    - id: c
      text:
        en: |-
          In the Security Tooling account, create an automation rule that matches the control ID and the Sandbox account IDs and sets the workflow status to SUPPRESSED.
    - id: d
      text:
        en: |-
          Create a custom insight in the Security Tooling account that groups the control's findings by account ID, and ask analysts to ignore the Sandbox accounts.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Automation rules in the Security Hub CSPM administrator account update findings automatically as they are created or updated, based on criteria such as the control ID and the account ID, with actions such as setting the workflow status. The control stays enabled and keeps producing compliance data, and no code is needed.
  options:
    a:
      en: |-
        Disabling the control stops its evaluations in the Sandbox accounts, so the auditors would lose the compliance data they require.
    b:
      en: |-
        The Lambda function is custom code to write and maintain, while automation rules provide the same update as a managed feature.
    d:
      en: |-
        An insight only groups findings for viewing; it does not change their workflow status, so the findings are not suppressed.
references:
  - title: "Understanding automation rules in Security Hub CSPM - AWS Security Hub"
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/automation-rules.html
