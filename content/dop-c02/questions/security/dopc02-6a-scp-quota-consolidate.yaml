id: dopc02-6a-scp-quota-consolidate
objective: "6.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's Workloads OU has 10 SCPs attached directly to it: FullAWSAccess and 9 deny policies. The security team must add a new deny statement that applies to every account in the Workloads OU, including accounts that are added to the OU later, and to no other OU. The attachment of a new SCP to the OU fails because the OU already has the maximum number of attached SCPs.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Detach the FullAWSAccess policy from the Workloads OU to free one slot, and attach the new SCP in its place.
    - id: b
      text:
        en: |-
          Attach the new SCP directly to each account that is currently in the Workloads OU, and keep the 10 SCPs that are attached to the OU unchanged.
    - id: c
      text:
        en: |-
          Attach the new SCP to the organization root instead of the OU, because the root has its own quota of attached SCPs.
    - id: d
      text:
        en: |-
          Merge the new statement and some existing deny SCPs into one SCP under the 10,240-character limit, and attach it in place of the merged SCPs.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A root, an OU, or an account can have up to 10 SCPs attached, and each SCP can contain up to 10,240 characters. Combining deny statements into fewer SCPs frees a slot while the OU attachment keeps covering current and future accounts in the OU.
  options:
    a:
      en: |-
        With a deny list strategy, removing FullAWSAccess leaves no allow at the OU, so every action in its accounts would be denied.
    b:
      en: |-
        Accounts added to the OU later would not get the new SCP unless someone attaches it by hand.
    c:
      en: |-
        An SCP attached to the root applies to every OU, not only to the Workloads OU.
references:
  - title: "Quotas and service limits for AWS Organizations - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
