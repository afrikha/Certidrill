id: dopc02-6c-alb-http-redirect-org
objective: "6.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company has 40 accounts in an organization in AWS Organizations and dozens of internet-facing Application Load Balancers. A security review found HTTP:80 listeners that forward customer traffic to target groups, so some customers browse the sites in clear text. Customers who type an http:// address must still reach the sites. The security team must also see continuously, from its compliance account, every load balancer that has an HTTP listener without a redirection to HTTPS. AWS Config is recording in every account, and the compliance account is the AWS Config delegated administrator.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Delete the HTTP:80 listeners and remove port 80 from the load balancers' security groups, and deploy the alb-http-to-https-redirection-check rule as an organization Config rule.
    - id: b
      text:
        en: |-
          Change the default action of each HTTP:80 listener to a redirect to HTTPS on port 443 with status code HTTP_301, and deploy the alb-http-to-https-redirection-check rule as an organization Config rule.
    - id: c
      text:
        en: |-
          Change each HTTP:80 listener to forward to a new target group that uses the HTTPS protocol on port 443, and deploy the alb-http-to-https-redirection-check rule as an organization Config rule.
    - id: d
      text:
        en: |-
          Change the default action of each HTTP:80 listener to a redirect to HTTPS, and schedule an AWS Lambda function in each account that lists the listeners and reports the noncompliant ones.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A listener redirect action with protocol HTTPS, port 443 and HTTP_301 sends clients that use http:// to the HTTPS site. The alb-http-to-https-redirection-check managed rule is NON_COMPLIANT when an HTTP listener has no HTTP to HTTPS redirection, and an organization rule deployed from the delegated administrator evaluates every account without custom code.
  options:
    a:
      en: |-
        Without an HTTP listener, customers who type an http:// address can no longer reach the sites.
    c:
      en: |-
        HTTPS to the targets protects only the traffic between the load balancer and the targets; customers still send requests to the load balancer in clear text, and the rule stays NON_COMPLIANT.
    d:
      en: |-
        A custom Lambda function in every account is code to write and maintain, when a managed Config rule already provides the check.
references:
  - title: Action types for listener rules - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-action-types.html
  - title: alb-http-to-https-redirection-check - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/alb-http-to-https-redirection-check.html
