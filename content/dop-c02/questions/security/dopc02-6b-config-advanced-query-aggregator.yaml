id: dopc02-6b-config-advanced-query-aggregator
objective: "6.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has an AWS Config aggregator in its Audit account that collects data from all 70 accounts of its organization in four Regions, and the configuration recorders record all resource types. An auditor asks for a list, by the end of the day, of every Amazon EBS volume in all accounts and Regions that is not encrypted, with its account ID, Region, and volume ID. The security team must produce the list from the Audit account without writing code and without deploying new rules.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the encrypted-volumes managed rule as an organization AWS Config rule, and export the noncompliant volumes after the first evaluations finish.
    - id: b
      text:
        en: |-
          Search CloudTrail event history in each account and Region for CreateVolume events, and keep the volumes that were created without encryption.
    - id: c
      text:
        en: |-
          Run an AWS Config advanced query against the aggregator that selects EBS volumes whose configuration shows that encryption is off, and export the results.
    - id: d
      text:
        en: |-
          Use Systems Manager Inventory in each account to collect the volumes of the managed nodes, and filter the inventory on the encryption attribute.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS Config advanced queries use a subset of SQL SELECT to query the current configuration items of recorded resources, and they can run against a configuration aggregator from a central account across multiple accounts and Regions. One query on the volume configuration returns the unencrypted volumes with their account and Region, without code or new rules.
  options:
    a:
      en: |-
        Deploying an organization rule is the new rule that the team must avoid, and it adds a deployment and an evaluation delay.
    b:
      en: |-
        Event history covers only 90 days of management events per account and Region, so older volumes are missed, and searching 280 account and Region pairs is manual work.
    d:
      en: |-
        Systems Manager Inventory collects software and configuration metadata from managed nodes; it is not an organization-wide view of EBS volume encryption, and it needs work in every account.
references:
  - title: "Querying the Current Configuration State of AWS Resources with AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/querying-AWS-resources.html
