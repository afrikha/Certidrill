id: dopc02-6c-access-analyzer-org-archive-rule
objective: "6.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 60 accounts in an organization in AWS Organizations and runs workloads in us-east-1 and eu-west-1. Each account has its own IAM Access Analyzer external access analyzer with the account as the zone of trust. These analyzers generate thousands of active findings for normal access between the company's own accounts, such as KMS keys and IAM roles shared with a central tooling account. The Security Tooling account is the delegated administrator for IAM Access Analyzer. The security team must review, from the Security Tooling account, only resources in both Regions that are shared with principals outside the organization. An external audit firm's account, 444455556666, is intentionally granted read access to several S3 buckets, and current and future findings for that account must be archived automatically.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          In the Security Tooling account, create an external access analyzer with the organization as the zone of trust in us-east-1 only, and add an archive rule that matches findings for account 444455556666.
    - id: b
      text:
        en: |-
          In the Security Tooling account, create an external access analyzer with the organization as the zone of trust in each of the two Regions, and add an archive rule that matches findings for account 444455556666 to each analyzer.
    - id: c
      text:
        en: |-
          Keep the account analyzers, and in each account create archive rules that match findings for the other 59 accounts and for account 444455556666 in each of the two Regions.
    - id: d
      text:
        en: |-
          In the Security Tooling account, create an external access analyzer with the organization as the zone of trust in each of the two Regions, and run a daily AWS Lambda function that archives the findings for account 444455556666.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With the organization as the zone of trust, access between the company's own accounts is trusted and only access by principals outside the organization creates findings. External access analysis is Regional, so an analyzer is needed in each Region that contains resources. An archive rule automatically archives new findings that match its criteria, and the existing active findings can be archived when the rule is created.
  options:
    a:
      en: |-
        An external access analyzer analyzes only the resources in its own Region, so resources in eu-west-1 would not be reviewed.
    c:
      en: |-
        Account-level analyzers with archive rules for every other account must be created and maintained in 60 accounts and two Regions, and every new account would require rule updates.
    d:
      en: |-
        A scheduled Lambda function is custom code to maintain, and findings stay active until the next run; an archive rule archives matching findings automatically.
references:
  - title: Using AWS Identity and Access Management Access Analyzer - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
  - title: Archive rules - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-archive-rules.html
