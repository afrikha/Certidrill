id: dopc02-6c-readonly-events-rule-state
objective: "6.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company stores database credentials in AWS Secrets Manager in us-east-1. Only the application role should read the secrets. The company's trail logs read and write management events. To detect credential theft, a DevOps engineer creates an EventBridge rule in us-east-1 on the default event bus with the pattern source aws.secretsmanager, detail-type AWS API Call via CloudTrail, and eventName GetSecretValue, plus an anything-but condition on the application role ARN. The rule targets an SNS topic. When an administrator reads a secret during a test, the CloudTrail log file contains the GetSecretValue event, but the rule shows no matched events.

    What should the engineer do to make the rule work?
body:
  options:
    - id: a
      text:
        en: |-
          Enable data events for Secrets Manager on the trail so that EventBridge receives the GetSecretValue calls.
    - id: b
      text:
        en: |-
          Change the state of the rule to ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS.
    - id: c
      text:
        en: |-
          Recreate the rule in the eu-west-1 Region, where Secrets Manager delivers its read events.
    - id: d
      text:
        en: |-
          Move the rule to a custom event bus, because the default bus does not receive Secrets Manager events.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      GetSecretValue is a read-only management event. EventBridge delivers CloudTrail events to the default event bus, but read-only management events are matched only by rules whose state is ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS; a rule in the default ENABLED state ignores them.
  options:
    a:
      en: |-
        GetSecretValue is already logged as a management event, and the rule did not match because of its state, not because the event is missing.
    c:
      en: |-
        CloudTrail events are delivered in the Region where the call is made; the secrets and the calls are in us-east-1.
    d:
      en: |-
        All CloudTrail events are delivered to the default event bus only, so a rule on a custom bus would receive nothing.
references:
  - title: AWS service events delivered via AWS CloudTrail - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
