id: dopc02-6b-guardduty-isolate-instance
objective: "6.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company enables Amazon GuardDuty in all its accounts. The security team wants an automated response for GuardDuty findings about EC2 instances with a severity of 7 or higher: replace the security groups of the instance with an isolation security group that has no rules, snapshot its EBS volumes for forensics, and notify the team through Amazon SNS. Findings with a lower severity and findings about other resource types must not start the response. The team already has a Systems Manager Automation runbook that performs the three steps.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule with source aws.guardduty, detail type GuardDuty Finding, detail.resource.resourceType equal to Instance, and a numeric filter of 7 or more on detail.severity, and set the runbook as the target.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule with source aws.guardduty, detail type GuardDuty Finding, detail.resource.resourceType equal to Instance, and detail.severity equal to the string HIGH, and set the runbook as the target.
    - id: c
      text:
        en: |-
          Create a GuardDuty suppression rule that matches findings with a severity of 7 or higher for EC2 instances, and attach the runbook to the suppression rule.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on the GuardDuty findings count metric with a threshold of 1, and start the runbook from an Amazon SNS subscription of the alarm.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      GuardDuty sends findings to Amazon EventBridge as GuardDuty Finding events, and the severity field is a number. An event pattern with a numeric matching filter of 7 or more on detail.severity and a resource type of Instance selects only the high-severity EC2 findings, and the runbook target performs the isolation, snapshots and notification.
  options:
    b:
      en: |-
        The severity in the finding event is numeric, so a string value of HIGH never matches and the runbook never runs.
    c:
      en: |-
        Suppression rules automatically archive matching findings; they do not run actions and would hide the findings the team wants to respond to.
    d:
      en: |-
        An alarm on a count cannot select findings by severity or resource type, and it would not pass the instance ID to the runbook.
references:
  - title: "Processing GuardDuty findings with Amazon EventBridge - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_eventbridge.html
