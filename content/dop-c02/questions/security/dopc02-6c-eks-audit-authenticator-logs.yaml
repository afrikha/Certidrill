id: dopc02-6c-eks-audit-authenticator-logs
objective: "6.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a production Amazon EKS cluster. No control plane logs are sent to Amazon CloudWatch Logs today. After a security review, the team must record which users, administrators and system components made changes through the Kubernetes API, and how IAM principals were authenticated to the cluster. To control cost, the team must turn on only the control plane log types that are needed.

    Which log types should the team enable? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          api
    - id: b
      text:
        en: |-
          audit
    - id: c
      text:
        en: |-
          authenticator
    - id: d
      text:
        en: |-
          controllerManager
    - id: e
      text:
        en: |-
          scheduler
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      The audit log type contains the Kubernetes audit logs, which record the users, administrators and system components that affected the cluster. The authenticator log type comes from the Amazon EKS component that authenticates IAM credentials for Kubernetes RBAC. Control plane log types are off by default and are enabled individually, and they go to the /aws/eks/<cluster-name>/cluster log group.
  options:
    a:
      en: |-
        The api log type contains the API server's own logs, not the record of who changed the cluster or how IAM principals were authenticated.
    d:
      en: |-
        The controllerManager log type covers the core Kubernetes control loops, not user activity or authentication.
    e:
      en: |-
        The scheduler log type records decisions about where to run Pods, not user activity or authentication.
references:
  - title: Send control plane logs to CloudWatch Logs - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html
