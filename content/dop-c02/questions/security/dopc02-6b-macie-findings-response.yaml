id: dopc02-6b-macie-findings-response
objective: "6.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's Amazon Macie delegated administrator account receives sensitive data findings for all member accounts. When Macie finds credentials, such as AWS secret access keys or private keys, in an S3 object, the object must be tagged as quarantined automatically, and the security team must also track the finding with its other security findings in AWS Security Hub CSPM. The company wants the LEAST custom code.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule for Macie Finding events whose type is a credentials finding, and target an AWS Lambda function that tags the affected object.
    - id: b
      text:
        en: |-
          Run a daily sensitive data discovery job that writes its results to an S3 bucket, and process the results with Amazon Athena queries.
    - id: c
      text:
        en: |-
          Create an Amazon Macie allow list for the credential patterns so that Macie tags the objects that contain them.
    - id: d
      text:
        en: |-
          Configure an S3 Event Notification on every bucket that invokes Macie for each new object and tags it when credentials are found.
    - id: e
      text:
        en: |-
          Configure the Macie publication settings to publish sensitive data findings to Security Hub CSPM.
answer: { optionIds: [a, e] }
explanation:
  correct:
    en: |-
      Macie publishes findings to Amazon EventBridge as events, so a rule that matches credential finding types can start a function that tags the affected object. By default Macie publishes only policy findings to Security Hub CSPM, so the publication settings must be changed to also publish sensitive data findings.
  options:
    b:
      en: |-
        A daily job and Athena queries do not tag objects automatically, and they delay the response.
    c:
      en: |-
        An allow list defines text that Macie must ignore; it never tags objects.
    d:
      en: |-
        S3 Event Notifications cannot invoke Macie, and Macie does not tag objects by itself.
references:
  - title: "Amazon EventBridge event schema for Macie findings - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/findings-publish-event-schemas.html
  - title: "Evaluating Macie findings with AWS Security Hub CSPM - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/securityhub-integration.html
