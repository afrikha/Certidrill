id: dopc02-6a-source-identity-federation
objective: "6.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Engineers federate into a central account through an IAM SAML identity provider and assume a role named Engineer. From Engineer, they assume roles in 20 workload accounts. In the workload accounts' CloudTrail logs, every action shows only the session name that the engineer chose, so auditors cannot reliably tell which employee performed an action. The auditors require that every action in the workload accounts record the employee's corporate user name, and engineers must not be able to change it during their sessions.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Require the engineers to use their corporate user name as the role session name each time they assume a workload role from the Engineer role session.
    - id: b
      text:
        en: |-
          Have the IdP send the user name as a session tag that is not transitive, and allow sts:TagSession in the trust policies of Engineer and the workload roles.
    - id: c
      text:
        en: |-
          Turn on CloudTrail data events in every workload account so that each logged action also includes the employee's corporate user name.
    - id: d
      text:
        en: |-
          Have the IdP set the user name as the source identity in the SAML assertion, and allow sts:SetSourceIdentity in the trust policies of Engineer and the workload roles.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A source identity that the IdP sets with the https://aws.amazon.com/SAML/Attributes/SourceIdentity attribute is recorded in CloudTrail for every action of the session, persists when the role is used to assume other roles, and cannot be changed during the session. The trust policies of the roles involved must allow sts:SetSourceIdentity, or the role assumption fails.
  options:
    a:
      en: |-
        Engineers choose the session name themselves, so it cannot be trusted to identify them.
    b:
      en: |-
        Tags that are not transitive are not passed to the chained sessions in the workload accounts.
    c:
      en: |-
        Data events log more operations but still identify the caller by the role session, not by the employee.
references:
  - title: "Monitor and control actions taken with assumed roles - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp_control-access_monitor.html
