id: dopc02-6a-boundary-resource-policy-user-arn
objective: "6.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A contractor uses an IAM user named ext-analyst in a data account. The user's identity-based policy allows s3:*, and its permissions boundary allows only s3:GetObject and s3:ListBucket. Another team wrote a bucket policy on a bucket named raw-exports in the same account that allows s3:DeleteObject for the principal arn:aws:iam::111122223333:user/ext-analyst. The contractor was able to delete objects from raw-exports. None of the policies contains a Deny statement, and no SCP applies to the account.

    Which statement explains this behavior?
body:
  options:
    - id: a
      text:
        en: |-
          The identity-based policy that allows s3:* is evaluated before the boundary, so its allow takes precedence over the boundary's limits.
    - id: b
      text:
        en: |-
          Permissions boundaries apply only to IAM roles, so AWS evaluates the identity-based policy of an IAM user without the boundary.
    - id: c
      text:
        en: |-
          In the same account, a resource-based policy that grants access to an IAM user ARN is not limited by an implicit deny in the user's boundary.
    - id: d
      text:
        en: |-
          Permissions boundaries limit only the IAM actions of a user, so they do not affect the Amazon S3 actions that the user performs on a bucket.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A permissions boundary caps identity-based permissions. In the same account, permissions that a resource-based policy grants directly to an IAM user ARN are not limited by an implicit deny in the boundary, so the bucket policy's allow is enough. An explicit deny, or removing the grant from the bucket policy, would block the deletion.
  options:
    a:
      en: |-
        There is no precedence by order: identity-based permissions are limited by the boundary, and an explicit deny always wins.
    b:
      en: |-
        Permissions boundaries can be set on both IAM users and IAM roles.
    d:
      en: |-
        A boundary limits every action that identity-based policies allow, not only IAM actions; s3:PutObject, for example, would be blocked for this user.
references:
  - title: "Permissions boundaries for IAM entities - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
