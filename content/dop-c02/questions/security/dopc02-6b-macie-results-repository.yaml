id: dopc02-6b-macie-results-repository
objective: "6.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's auditors require evidence of every object that Amazon Macie analyzed, including objects in which Macie found no sensitive data, for at least 2 years. The security team finds that the Macie console and findings cover only objects with sensitive data, and that sensitive data discovery results are kept by Macie for a limited time. The bank uses Macie in us-east-1 only.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure a discovery results repository in an S3 bucket in us-east-1 with a symmetric customer managed KMS key in us-east-1 that Macie can use.
    - id: b
      text:
        en: |-
          Configure Macie to publish all findings to AWS Security Hub CSPM, and export the findings to an S3 bucket with a 2-year retention.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule for Macie Finding events, and store each event in an Amazon CloudWatch Logs log group with a 2-year retention.
    - id: d
      text:
        en: |-
          Configure a discovery results repository in an S3 bucket in us-east-1 with the AWS managed key for Amazon S3 (aws/s3) to encrypt the results.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Sensitive data discovery results also cover objects in which Macie finds no sensitive data, and Macie stores them for only 90 days. For long-term retention, configure Macie to encrypt the results with a customer managed, symmetric KMS key in the same Region as the bucket and store them in an S3 bucket, with key and bucket policies that let Macie use them.
  options:
    b:
      en: |-
        Findings exist only for objects with sensitive data or policy issues, so objects without sensitive data would not be covered.
    c:
      en: |-
        Finding events also omit the objects in which Macie found nothing, so the evidence would be incomplete.
    d:
      en: |-
        The repository requires a customer managed symmetric KMS key whose key policy allows Macie; an AWS managed key cannot be used for it.
references:
  - title: "Storing and retaining sensitive data discovery results - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-results-repository-s3.html
