id: dopc02-6c-waf-log-group-prefix
objective: "6.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company protects an Application Load Balancer in eu-central-1 with an AWS WAF web ACL in the same account and Region. The security team needs the full request details of every request that the web ACL evaluates, including the matched rules, in Amazon CloudWatch Logs so that it can query them with CloudWatch Logs Insights. A DevOps engineer created a log group named /security/waf/prod in eu-central-1, but the log group does not appear as a logging destination for the web ACL. The engineer has the AWSWAFFullAccess managed policy.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM role that AWS WAF can assume with logs:PutLogEvents on /security/waf/prod, and select the role in the logging configuration of the web ACL.
    - id: b
      text:
        en: |-
          Add a CloudWatch Logs resource policy that allows the log delivery service to write to /security/waf/prod, and select the log group in the logging configuration.
    - id: c
      text:
        en: |-
          Create a log group named /security/waf/prod in the central Security account in eu-central-1, and select it as the destination of the web ACL logging configuration.
    - id: d
      text:
        en: |-
          Create a log group whose name starts with aws-waf-logs- in eu-central-1 in the same account, and select it as the destination of the web ACL logging configuration.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS WAF sends web ACL traffic logs only to a log group whose name starts with aws-waf-logs-, and the log group must be in the same Region as the web ACL and in the account that manages it. The engineer's managed policy already grants the logging permissions, such as wafv2:PutLoggingConfiguration and logs:CreateLogDelivery.
  options:
    a:
      en: |-
        The log group is not listed because of its name; the WAF logging configuration does not take an IAM role, and the required permissions come from the user who configures logging.
    b:
      en: |-
        Permissions are not the problem: a log group whose name does not start with aws-waf-logs- is not a valid AWS WAF logging destination, whatever its resource policy allows.
    c:
      en: |-
        The destination log group must be in the same account as the web ACL, and its name must still start with aws-waf-logs-.
references:
  - title: Sending protection pack (web ACL) traffic logs to a Amazon CloudWatch Logs log group - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/logging-cw-logs.html
