id: dopc02-6c-s3-sse-kms-approved-keys
objective: "6.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's security policy states that the default encryption of every S3 bucket must be SSE-KMS with one of two approved customer managed keys. An audit found existing buckets whose default encryption is SSE-S3 and buckets that use other KMS keys. The company has 30 accounts in an organization in AWS Organizations, AWS Config is recording in every account, and the compliance account deploys organization Config rules. The security team must continuously identify every noncompliant bucket, including existing buckets, whenever a bucket's configuration changes. The team does not want to write custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the s3-bucket-server-side-encryption-enabled managed rule as an organization Config rule.
    - id: b
      text:
        en: |-
          Deploy the s3-default-encryption-kms managed rule as an organization Config rule with the ARNs of the two approved keys in the kmsKeyArns parameter.
    - id: c
      text:
        en: |-
          Enable Amazon Macie in every account, and send Policy:IAMUser/S3BucketEncryptionDisabled findings to the security team through Amazon EventBridge.
    - id: d
      text:
        en: |-
          Enable Amazon GuardDuty S3 Protection in every account, and send findings about the buckets to the security team through Amazon EventBridge.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The s3-default-encryption-kms rule is NON_COMPLIANT when a bucket is not encrypted with a KMS key, and its optional kmsKeyArns parameter lists the keys that are allowed. It runs on configuration changes and evaluates existing buckets, and an organization rule covers every account without custom code.
  options:
    a:
      en: |-
        This rule is satisfied by any default encryption, including SSE-S3, so the noncompliant buckets would be reported as compliant.
    c:
      en: |-
        Macie generates this policy finding only when the setting changes after Macie is enabled, so existing buckets are missed, and it does not check which KMS key is used.
    d:
      en: |-
        S3 Protection analyzes object-level API activity for threats such as data exfiltration; it does not evaluate bucket encryption settings.
references:
  - title: s3-default-encryption-kms - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/s3-default-encryption-kms.html
  - title: Types of Macie findings - Amazon Macie
    url: https://docs.aws.amazon.com/macie/latest/user/findings-types.html
