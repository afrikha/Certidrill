id: dopc02-6b-kms-key-policy-root-delegation
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team creates customer managed AWS KMS keys with AWS CloudFormation. To limit administration, the key policy in the template grants kms:* only to a KeyAdmins IAM role. An application role in the same account has an identity-based policy that allows kms:Decrypt and kms:GenerateDataKey on the key ARN, but every call from the application fails with an AccessDenied error. From now on, the security team wants to grant applications access to these keys through IAM policies, while the KeyAdmins role keeps administering the keys.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach the AWS managed AWSKeyManagementServicePowerUser policy to the application role in addition to its current identity-based policy.
    - id: b
      text:
        en: |-
          Add a key policy statement that allows the account principal (arn:aws:iam::<account-id>:root) all KMS actions, which lets IAM policies grant access.
    - id: c
      text:
        en: |-
          Create a grant on the key for the application role with the Decrypt and GenerateDataKey operations, and repeat it for every new application role.
    - id: d
      text:
        en: |-
          Attach a service control policy to the account that allows kms:Decrypt and kms:GenerateDataKey on the key ARN for the application role.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A KMS key policy does not automatically give permissions to the account or its identities. The default key policy statement that gives the account principal full access is what lets IAM policies allow access to the key; without it, IAM policies that allow access are ineffective. Adding that statement makes the application role's existing policy work and lets the team manage access through IAM.
  options:
    a:
      en: |-
        Any IAM policy, including an AWS managed one, stays ineffective while the key policy does not allow the account to delegate access through IAM.
    c:
      en: |-
        A grant would let this role use the key, but it manages access outside IAM policies and must be repeated for every role, which does not meet the requirement.
    d:
      en: |-
        SCPs only set the maximum permissions available in member accounts; they never grant access.
references:
  - title: "Default key policy - AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html
