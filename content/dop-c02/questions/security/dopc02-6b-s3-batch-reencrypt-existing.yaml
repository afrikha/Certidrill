id: dopc02-6b-s3-batch-reencrypt-existing
objective: "6.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company changed the default encryption of an S3 bucket from SSE-S3 to SSE-KMS with a customer managed key. The bucket contains 300 million objects that were written before the change. A compliance review requires that all objects, including the existing ones, be encrypted with the customer managed key. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Wait for Amazon S3 to re-encrypt the existing objects in the background, which starts after the default encryption setting changes.
    - id: b
      text:
        en: |-
          Turn on S3 Bucket Keys for the bucket so that the existing objects start to use the customer managed key through the bucket-level key.
    - id: c
      text:
        en: |-
          Write an AWS Lambda function that lists the bucket and copies each object onto itself, and run it until all objects are processed.
    - id: d
      text:
        en: |-
          Run an S3 Batch Operations Copy job with an S3 Inventory manifest that copies the existing objects in place with SSE-KMS and the customer managed key.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A change of default encryption applies only to new objects; existing objects keep their encryption until they are rewritten. An S3 Batch Operations Copy job, with a manifest such as an S3 Inventory report, copies the existing objects in place with the new encryption settings at scale, with tracking and a completion report.
  options:
    a:
      en: |-
        Amazon S3 does not re-encrypt existing objects when the default encryption setting changes.
    b:
      en: |-
        S3 Bucket Keys apply only to new objects and do not change the key that encrypts existing objects; existing objects must be copied.
    c:
      en: |-
        A custom function is code to write, scale and track for 300 million objects, which S3 Batch Operations provides as a managed feature.
references:
  - title: "Setting default server-side encryption behavior for Amazon S3 buckets - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-encryption.html
