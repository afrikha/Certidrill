id: dopc02-6c-central-security-event-bus
objective: "6.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 120 accounts in an organization in AWS Organizations and runs all workloads in eu-west-1. Every account has a trail that logs management events. The security team wants specific API calls from every account, such as DeleteFlowLogs, PutBucketPolicy and AuthorizeSecurityGroupIngress, to arrive on a custom event bus in the SecOps account, where rules route them to the team's incident tooling. New accounts must be able to send events without changes to the SecOps account. The rules in the member accounts will be deployed with a CloudFormation StackSet.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a resource-based policy to the SecOps bus that allows events:PutEvents for the organization ID. In each account, deploy a rule that targets the SecOps bus with an IAM role that allows events:PutEvents on that bus.
    - id: b
      text:
        en: |-
          Add a resource-based policy to the SecOps bus that allows events:PutEvents for the organization ID. In each account, deploy a rule that targets the SecOps bus without an IAM role, relying on the bus policy for permission.
    - id: c
      text:
        en: |-
          In each account, deploy a rule that targets the default bus of the Log Archive account, where another rule forwards the received events to the SecOps bus.
    - id: d
      text:
        en: |-
          In the SecOps account, create a rule on the custom bus whose event pattern matches the API calls with an account field of "*", so that it receives the events of every account.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The receiving bus's resource-based policy can grant access to an entire organization, so new accounts need no change in the SecOps account. Each sender account needs a rule whose target is the receiving bus, and EventBridge requires an IAM role on cross-account event bus targets created after March 2, 2023; the console creates it automatically, but with the AWS CLI or a template the role must be created explicitly.
  options:
    b:
      en: |-
        New cross-account event bus targets must use an IAM role, even when the receiving bus policy allows the organization.
    c:
      en: |-
        EventBridge does not forward events that a receiver account got from a sender account on to a third account, so the events never reach the SecOps bus.
    d:
      en: |-
        A rule in the SecOps account matches only events that arrive on its bus, and a "*" value never matches the account field of an event.
references:
  - title: Sending and receiving events between AWS accounts in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cross-account.html
