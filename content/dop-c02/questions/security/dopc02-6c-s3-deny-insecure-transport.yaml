id: dopc02-6c-s3-deny-insecure-transport
objective: "6.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company stores shipping documents in an S3 bucket. Several internal applications and partner integrations read and write objects with IAM roles. A review of the CloudTrail data events showed that some legacy clients send their requests to the bucket over plain HTTP. The security team requires that the bucket reject every request that is not sent over HTTPS, whatever the identity-based policies of the callers allow.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure default encryption on the bucket with SSE-KMS and a customer managed key so that every object is encrypted.
    - id: b
      text:
        en: |-
          Add a bucket policy statement that allows s3:GetObject and s3:PutObject only when the aws:SecureTransport condition key is true.
    - id: c
      text:
        en: |-
          Add a bucket policy statement that denies all S3 actions to all principals when the aws:SecureTransport condition key is false.
    - id: d
      text:
        en: |-
          Turn on all four S3 Block Public Access settings for the bucket and for the account that owns the bucket.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS recommends allowing only encrypted connections by using the aws:SecureTransport condition in the bucket policy. An explicit Deny for requests where aws:SecureTransport is false overrides any Allow in identity-based or resource-based policies, so every HTTP request is rejected. The s3-bucket-ssl-requests-only Config rule can then detect buckets that lack such a policy.
  options:
    a:
      en: |-
        Default encryption protects data at rest; it does not stop clients from sending requests in plain HTTP.
    b:
      en: |-
        An Allow statement does not override other grants: callers whose identity-based policies allow these actions could still use HTTP.
    d:
      en: |-
        Block Public Access prevents public access through ACLs and policies; it does not control whether authenticated requests use HTTPS.
references:
  - title: Security best practices for Amazon S3 - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/security-best-practices.html
