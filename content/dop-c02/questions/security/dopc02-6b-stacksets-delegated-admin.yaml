id: dopc02-6b-stacksets-delegated-admin
objective: "6.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses AWS Organizations with trusted access for AWS CloudFormation StackSets enabled. The security team works only from a Security Tooling member account and must deploy baseline stacks that contain IAM roles and AWS Config rules to every account in the organization, including new accounts. Company policy forbids the security team from using the management account.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Register the Security Tooling account as a StackSets delegated administrator, and create service-managed stack sets from that account.
    - id: b
      text:
        en: |-
          Create stack sets with self-managed permissions in the Security Tooling account, and ask each account owner to create the execution role before each deployment.
    - id: c
      text:
        en: |-
          Create an IAM role in the management account that the security team assumes from the Security Tooling account to create the stack sets there.
    - id: d
      text:
        en: |-
          Share the baseline templates as AWS Service Catalog products with every account, and ask each account owner to launch them.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A member account registered as a delegated administrator can create and manage stack sets with service-managed permissions for the organization, so the security team never uses the management account. Service-managed stack sets can deploy automatically to accounts that are added to the target organization or OUs.
  options:
    b:
      en: |-
        Self-managed permissions need roles created in every account, including new ones, and depend on each account owner.
    c:
      en: |-
        Assuming a role in the management account is still using the management account, which company policy forbids.
    d:
      en: |-
        Service Catalog relies on each account owner to launch the products, so new accounts are not covered automatically.
references:
  - title: "Register a delegated administrator member account - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-delegated-admin.html
