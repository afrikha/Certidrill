id: dopc02-6b-securityhub-cross-region-aggregation
objective: "6.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 60 accounts in AWS Organizations and runs workloads in five Regions. AWS Security Hub CSPM is enabled in every account and Region, and the Security Tooling account is the delegated administrator. Analysts currently sign in to each Region to review findings. The security team wants the analysts to view and update the findings of all accounts and all five Regions from us-east-1 only, and updates made in us-east-1 must be reflected in the Region where each finding was created. The team does not want to write custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          In each Region, create an Amazon EventBridge rule that forwards Security Hub CSPM findings to an event bus in us-east-1, and import them with an AWS Lambda function that calls BatchImportFindings.
    - id: b
      text:
        en: |-
          In the Security Tooling account, set us-east-1 as the home Region for cross-Region aggregation, and link the other four Regions to it.
    - id: c
      text:
        en: |-
          Create an AWS Config aggregator in the Security Tooling account in us-east-1 that collects data from all accounts and the five Regions.
    - id: d
      text:
        en: |-
          Export the findings of each Region to an S3 bucket in us-east-1 every hour, and give the analysts Amazon Athena queries on the bucket.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With cross-Region aggregation, Security Hub CSPM replicates findings, insights and control statuses from the linked Regions to the home Region, so the administrator account sees the findings of all its member accounts and Regions in one place. Updates to findings in the home Region are replicated back to the linked Region where each finding originated, and no code is required.
  options:
    a:
      en: |-
        This is custom forwarding code, and findings imported again in us-east-1 would be copies; updates to them would not flow back to the original findings.
    c:
      en: |-
        A Config aggregator collects configuration and compliance data from AWS Config; it does not aggregate Security Hub CSPM findings or let analysts update them.
    d:
      en: |-
        Athena queries give a read-only, delayed view and require an export job; analysts could not update the findings.
references:
  - title: "Understanding cross-Region aggregation in Security Hub CSPM - AWS Security Hub"
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/finding-aggregation.html
