id: dopc02-6c-org-s3-block-public-access
objective: "6.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 250 accounts in an organization in AWS Organizations with all features enabled, and it adds new accounts every week. Twice this year, an administrator of a member account who has full Amazon S3 permissions turned off the account-level S3 Block Public Access settings and then made a bucket public with a bucket policy. The security team requires all four Block Public Access settings to apply to every S3 resource in every current and future member account, and member account administrators must not be able to change them. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the s3-account-level-public-access-blocks-periodic AWS Config rule to the organization with an automatic remediation that turns the four settings back on in each noncompliant account.
    - id: b
      text:
        en: |-
          Use a StackSet with automatic deployment to turn on Block Public Access for every bucket in each account, and require new buckets to be created through AWS Service Catalog products.
    - id: c
      text:
        en: |-
          Use a StackSet with automatic deployment to turn on the account-level settings in each account, and attach an SCP that denies s3:PutAccountPublicAccessBlock, except for the StackSet execution role.
    - id: d
      text:
        en: |-
          Enable the Amazon S3 policy type in AWS Organizations, and attach to the organization root an S3 policy that turns on all four Block Public Access settings.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Organization-level Block Public Access uses an Amazon S3 policy in AWS Organizations: it applies the four settings together to the selected accounts, overrides account-level settings and prevents account-level modifications while it is in effect. Accounts that join the organization inherit the policy from their place in the hierarchy, so a single policy on the root covers future accounts.
  options:
    a:
      en: |-
        A detective rule with remediation reacts only after the settings were turned off, which leaves a window during which a bucket can be made public, and administrators can still change the settings.
    b:
      en: |-
        Bucket-level settings can still be changed by account administrators, and buckets created outside Service Catalog would not be covered.
    c:
      en: |-
        This design works but requires a StackSet, an SCP and an exception to maintain, which is more overhead than one organization S3 policy that both applies and protects the settings.
references:
  - title: Amazon S3 policies - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_s3.html
  - title: Blocking public access to your Amazon S3 storage - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
