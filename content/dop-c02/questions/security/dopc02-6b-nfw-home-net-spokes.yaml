id: dopc02-6b-nfw-home-net-spokes
objective: "6.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company routes all outbound internet traffic from 20 spoke VPCs through an AWS Transit Gateway to a central inspection VPC that contains AWS Network Firewall endpoints and NAT gateways. The firewall policy uses the default action order and contains a stateful domain list rule group. The rule group is an allow list of approved software update domains with the TLS_SNI and HTTP_HOST target types. VPC route tables and firewall logs confirm that traffic from the spoke VPCs passes through the firewall endpoints. A test instance in the inspection VPC can reach only the approved domains, but instances in the spoke VPCs can still reach any domain over HTTPS. The security team needs the spoke VPC traffic to be filtered by the same rule group.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the firewall policy to strict action order, and give the domain list rule group the highest priority in the policy.
    - id: b
      text:
        en: |-
          Set the HOME_NET rule variable of the domain list rule group to include the CIDR blocks of the spoke VPCs and of the inspection VPC.
    - id: c
      text:
        en: |-
          Turn on appliance mode for the transit gateway attachment of the inspection VPC so that both directions of each flow use the same firewall endpoint.
    - id: d
      text:
        en: |-
          Add outbound rules to the security groups in the spoke VPCs that allow HTTPS only to the approved domain names, and remove the 0.0.0.0/0 rules.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Domain list inspection only applies to traffic from HOME_NET, which defaults to the CIDR range of the VPC where Network Firewall is deployed, so traffic from the spoke VPCs is not filtered. Setting HOME_NET in the rule group to the spoke CIDR blocks plus the inspection VPC CIDR makes the allow list apply to all routed traffic.
  options:
    a:
      en: |-
        With strict action order, the implicit denial of non-matching traffic by an allow list no longer applies, and the spoke traffic would still be outside HOME_NET.
    c:
      en: |-
        Appliance mode keeps flows symmetric through one Availability Zone; the logs show the traffic already reaches the firewall, and the domain filtering is skipped because of HOME_NET, not routing.
    d:
      en: |-
        Security group rules use IP addresses, prefix lists or security groups as destinations; they cannot reference domain names.
references:
  - title: "Stateful domain list rules groups in AWS Network Firewall - AWS Network Firewall"
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/stateful-rule-groups-domain-names.html
