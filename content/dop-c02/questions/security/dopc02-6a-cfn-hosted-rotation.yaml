id: dopc02-6a-cfn-hosted-rotation
objective: "6.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team creates an Amazon DocumentDB cluster with an AWS CloudFormation template. The security team requires that the admin password be generated by AWS Secrets Manager, never appear in the template, parameters, or pipeline, and rotate automatically every 30 days. The team does not want to write or maintain rotation code, and the whole setup must be defined in the same template.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a secret with a generated password, set the cluster's credentials with dynamic references to it, and add a RotationSchedule with the RotationLambdaARN of a function that the team writes.
    - id: b
      text:
        en: |-
          Create a secret with a generated password, reference it in the cluster with dynamic references, and add a SecretTargetAttachment and a RotationSchedule with HostedRotationLambda.
    - id: c
      text:
        en: |-
          Store the admin password as a SecureString parameter, set the cluster's password with an ssm-secure dynamic reference, and schedule a weekly Systems Manager Automation to change it.
    - id: d
      text:
        en: |-
          Pass the admin password as a NoEcho template parameter from the pipeline, store it in a secret, and turn on rotation for the secret from the console after the stack is created.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudFormation can create the secret with a password that Secrets Manager generates, reference it in the cluster with dynamic references, and add the database details with SecretTargetAttachment. A RotationSchedule with HostedRotationLambda, which requires the AWS::SecretsManager transform, creates the rotation function from an AWS template, so the team maintains no rotation code.
  options:
    a:
      en: |-
        The team would write and maintain its own rotation function.
    c:
      en: |-
        The password would not be generated by Secrets Manager, and the Automation would be custom rotation logic to maintain.
    d:
      en: |-
        The password would pass through the pipeline, and turning on rotation by hand is outside the template.
references:
  - title: "Create AWS Secrets Manager secrets in AWS CloudFormation - AWS Secrets Manager"
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/cloudformation.html
  - title: "AWS::SecretsManager::RotationSchedule - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-secretsmanager-rotationschedule.html
