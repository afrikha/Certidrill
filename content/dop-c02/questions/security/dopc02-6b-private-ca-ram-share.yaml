id: dopc02-6b-private-ca-ram-share
objective: "6.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has a central security account that owns an AWS Private CA certificate authority, and 40 workload accounts in the same organization in AWS Organizations. Teams in the workload accounts deploy internal Application Load Balancers with AWS CloudFormation and need private TLS certificates from this CA. The certificates must renew automatically, and the company does not want to create more certificate authorities. The security team must not handle certificate requests from the teams.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a subordinate certificate authority in AWS Private CA in each workload account, signed by the central certificate authority.
    - id: b
      text:
        en: |-
          Share the certificate authority with the organization by using AWS Resource Access Manager (AWS RAM).
    - id: c
      text:
        en: |-
          In the workload accounts, call the AWS Private CA IssueCertificate API from the pipelines, and import the issued certificates into ACM.
    - id: d
      text:
        en: |-
          In the workload accounts, request private certificates through AWS Certificate Manager (ACM) that specify the shared certificate authority ARN, and associate them with the load balancers.
    - id: e
      text:
        en: |-
          Have the security account export certificates from ACM and copy them to an S3 bucket that the workload pipelines import from.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      Sharing the CA through AWS RAM, directly with accounts or through the organization, attaches the required resource-based policy to the CA. The workload accounts then request certificates with the ACM RequestCertificate action and the shared CA, which produces managed certificates that install on integrated services and renew automatically; the recipient account's ACM service-linked role makes the renewal calls.
  options:
    a:
      en: |-
        A subordinate CA in every account creates 40 more certificate authorities, which the company wants to avoid.
    c:
      en: |-
        IssueCertificate produces unmanaged certificates that are not renewed automatically and must be exported and installed manually.
    e:
      en: |-
        The security team would handle every certificate, and imported certificates are not renewed by ACM.
references:
  - title: "Attach a policy for cross-account access - AWS Private Certificate Authority"
    url: https://docs.aws.amazon.com/privateca/latest/userguide/pca-ram.html
  - title: "Managed certificate renewal in AWS Certificate Manager - AWS Certificate Manager"
    url: https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html
