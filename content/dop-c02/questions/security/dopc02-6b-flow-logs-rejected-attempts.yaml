id: dopc02-6b-flow-logs-rejected-attempts
objective: "6.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company's auditors require a record of every network connection attempt to its database subnet that a security group or network ACL rejected, with the source and destination IP addresses and ports. The databases run on Amazon EC2 instances. The company does not want to install agents on the instances.

    Which AWS service or feature should the company use?
body:
  options:
    - id: a
      text:
        en: |-
          AWS CloudTrail data events for Amazon EC2 in the account.
    - id: b
      text:
        en: |-
          AWS Config recording of the security groups and network ACLs of the subnet.
    - id: c
      text:
        en: |-
          A VPC flow log on the database subnet that captures rejected traffic.
    - id: d
      text:
        en: |-
          Amazon Inspector network reachability findings for the database instances.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      VPC Flow Logs capture information about IP traffic to and from network interfaces in a subnet, including the source and destination addresses and ports and whether the traffic was accepted or rejected. A flow log with the REJECT filter on the database subnet records the rejected attempts without agents.
  options:
    a:
      en: |-
        CloudTrail records API calls to AWS services; it does not record network connections to instances.
    b:
      en: |-
        AWS Config records how the security groups and network ACLs are configured, not the traffic that they reject.
    d:
      en: |-
        Network reachability findings describe which ports could be reached from outside; they do not record actual connection attempts.
references:
  - title: "Flow log records - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html
  - title: "Logging IP traffic using VPC Flow Logs - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html
