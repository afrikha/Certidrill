id: dopc02-6c-config-recorder-central-delivery
objective: "6.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has 70 accounts in an organization in AWS Organizations with all features enabled, and it creates new accounts every month. AWS Control Tower is not used. AWS Config is enabled in only some accounts, each with its own bucket. Auditors require that AWS Config record all supported resource types in every current and future account in us-east-1 and eu-west-1, and that every account deliver its configuration history and snapshot files to one S3 bucket in the Log Archive account. The AWS Config recorders use the AWS Config service-linked role. The company wants the LEAST operational overhead.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a StackSet with service-managed permissions and automatic deployment that targets the organization root in both Regions and creates the recorder and a delivery channel to the central bucket.
    - id: b
      text:
        en: |-
          Create a StackSet with self-managed permissions that targets the current account IDs in both Regions and creates the recorder and a delivery channel to the central bucket.
    - id: c
      text:
        en: |-
          Add a bucket policy to the central bucket that allows the AWSServiceRoleForConfig role of each account to call s3:PutObject on the AWSLogs/*/Config/* prefix.
    - id: d
      text:
        en: |-
          Add a bucket policy to the central bucket that allows the config.amazonaws.com principal to call s3:GetBucketAcl, s3:ListBucket, and s3:PutObject on the AWSLogs/*/Config/* prefix.
    - id: e
      text:
        en: |-
          From the AWS Config delegated administrator account, deploy organization Config rules in both Regions so that AWS Config starts recording in every member account.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A service-managed StackSet with automatic deployment creates the recorder and delivery channel in every account under the root, and it deploys them automatically to accounts that join later. AWS Config delivers files to S3 through the config.amazonaws.com service principal, so the central bucket policy must allow that principal to check the bucket ACL, list the bucket and put objects under AWSLogs/<account-id>/Config/, with the bucket-owner-full-control ACL condition.
  options:
    b:
      en: |-
        Self-managed permissions with explicit account IDs do not deploy to new accounts automatically, so every new account requires a StackSet update.
    c:
      en: |-
        The AWS Config service-linked role cannot put objects into S3 buckets; AWS Config uses the config.amazonaws.com service principal to deliver files.
    e:
      en: |-
        Organization Config rules evaluate resources that the recorder already records; they do not create or start a configuration recorder or a delivery channel.
references:
  - title: Permissions for the Amazon S3 Bucket for the AWS Config Delivery Channel - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-policy.html
