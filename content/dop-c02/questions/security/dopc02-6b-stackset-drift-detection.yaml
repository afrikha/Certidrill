id: dopc02-6b-stackset-drift-detection
objective: "6.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys a security baseline of IAM roles and security groups to 120 accounts with a CloudFormation StackSet that uses service-managed permissions. An auditor asks which accounts have baseline resources that were changed outside CloudFormation. The security team must answer from the StackSets administrator account in one operation, and it does not want to deploy any new service or rule for this audit.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Sign in to each account, run drift detection on the stack instance, and collect the results in a spreadsheet.
    - id: b
      text:
        en: |-
          Run a drift detection operation on the stack set, and list the stack instances whose drift status is DRIFTED.
    - id: c
      text:
        en: |-
          Deploy the cloudformation-stack-drift-detection-check AWS Config rule to every account, and review the noncompliant stacks.
    - id: d
      text:
        en: |-
          Update the stack set with the same template so that every stack instance is redeployed, and review the resources that changed.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Drift detection on a stack set runs drift detection on each of its stack instances and reports the drift status of every instance and resource, from the administrator account. Instances with resources that were changed outside CloudFormation have the DRIFTED status.
  options:
    a:
      en: |-
        Signing in to 120 accounts is manual work, while stack set drift detection does the same check in one operation.
    c:
      en: |-
        The Config rule needs a deployment in every account, which the team does not want for this audit.
    d:
      en: |-
        Redeploying may overwrite drifted values without reporting them, and it does not answer which accounts drifted.
references:
  - title: "Performing drift detection on CloudFormation StackSets - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-drift.html
