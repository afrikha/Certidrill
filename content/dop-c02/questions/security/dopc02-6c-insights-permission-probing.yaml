id: dopc02-6c-insights-permission-probing
objective: "6.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's trail sends management events to a CloudWatch Logs log group in the Standard log class, and CloudWatch Logs Insights discovers the JSON fields of the events, such as errorCode, eventName and userIdentity.arn. A security analyst suspects that a stolen credential is probing permissions by calling many different APIs. The analyst needs the principals that received AccessDenied or UnauthorizedOperation errors on more than 10 different API actions in the selected time range, with the principals that tried the most actions first. A principal that retries the same denied call many times must not be listed for that reason alone.

    Which CloudWatch Logs Insights query will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          stats countDistinct(eventName) as deniedActions by userIdentity.arn | filter errorCode like /AccessDenied|UnauthorizedOperation/ and deniedActions > 10 | sort deniedActions desc
    - id: b
      text:
        en: |-
          filter errorCode like /AccessDenied|UnauthorizedOperation/ | stats count(*) as deniedActions by userIdentity.arn | filter deniedActions > 10 | sort deniedActions desc
    - id: c
      text:
        en: |-
          filter errorCode like /AccessDenied|UnauthorizedOperation/ | stats countDistinct(eventName) as deniedActions by userIdentity.arn | filter deniedActions > 10 | sort deniedActions desc
    - id: d
      text:
        en: |-
          filter errorCode like /AccessDenied|UnauthorizedOperation/ | sort @timestamp desc | stats countDistinct(eventName) as deniedActions by userIdentity.arn | filter deniedActions > 10
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The first filter keeps only denied calls, countDistinct counts the number of unique event names per principal, the filter after stats keeps the principals above 10, and the final sort lists the largest values first. Counting distinct event names means that retries of one denied call count only once.
  options:
    a:
      en: |-
        After a stats command, only the fields defined in that command can be used, so errorCode is no longer available, and the count would include allowed calls.
    b:
      en: |-
        count(*) counts denied calls, not different actions, so a principal that retries one denied call more than 10 times would be listed.
    d:
      en: |-
        A sort or limit must come after the last stats command, so this query is not valid, and it would not order the principals by the number of actions.
references:
  - title: stats - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-Stats.html
