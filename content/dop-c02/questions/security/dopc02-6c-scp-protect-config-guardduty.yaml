id: dopc02-6c-scp-protect-config-guardduty
objective: "6.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 90 member accounts in an organization in AWS Organizations. The AWS Config recorder runs in every account, and the Security Tooling account is the Amazon GuardDuty delegated administrator. Member account administrators have the AdministratorAccess policy. An audit found that one administrator stopped the Config recorder for a week and another disassociated an account from the GuardDuty administrator account. The security team must prevent these actions in all member accounts. A role named SecurityAutomation, which exists in every account, must still be able to manage the recorder and GuardDuty. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach to the organization root an SCP that denies the actions that stop or delete the Config recorder and delivery channel and that disassociate from or delete GuardDuty, for all principals.
    - id: b
      text:
        en: |-
          Attach a permissions boundary that denies these Config and GuardDuty actions to the administrators' roles in every member account.
    - id: c
      text:
        en: |-
          Create an EventBridge rule in every account that matches these API calls and starts an Automation runbook that restarts the recorder and reassociates GuardDuty.
    - id: d
      text:
        en: |-
          Attach to the organization root an SCP that denies these Config and GuardDuty actions unless aws:PrincipalArn matches the SecurityAutomation role ARN pattern.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An SCP limits the maximum permissions of every principal in member accounts, including administrators, and applies to accounts added later. Denying actions such as config:StopConfigurationRecorder, config:DeleteDeliveryChannel, guardduty:DisassociateFromAdministratorAccount and guardduty:DeleteDetector with an ArnNotLike condition on aws:PrincipalArn keeps an exception for the SecurityAutomation role only.
  options:
    a:
      en: |-
        Without an exception, the SCP also blocks the SecurityAutomation role, which must keep managing the recorder and GuardDuty.
    b:
      en: |-
        Administrators with full IAM permissions can remove a permissions boundary from their own roles, and boundaries must be applied to every role in every account.
    c:
      en: |-
        This reacts after the change has been made, so evidence is lost until the runbook runs; it does not prevent the actions.
references:
  - title: Service control policies (SCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
