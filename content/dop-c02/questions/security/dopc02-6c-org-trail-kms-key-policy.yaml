id: dopc02-6c-org-trail-kms-key-policy
objective: "6.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's management account (111111111111) owns an organization trail named org-trail in us-east-1. The trail delivers log files to an S3 bucket in the log archive account (222222222222), also in us-east-1. A new requirement states that the log files must be encrypted with SSE-KMS by using a customer managed key that the log archive account owns, and that only this trail can use the key to encrypt log files. A DevOps engineer creates a symmetric key in us-east-1 in the log archive account with the default key policy. When the engineer updates the trail to use the key, the update fails because of an insufficient key policy.

    Which key policy change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Allow the cloudtrail.amazonaws.com service principal to use kms:GenerateDataKey* and kms:DescribeKey with an aws:SourceArn condition of arn:aws:cloudtrail:us-east-1:111111111111:trail/org-trail.
    - id: b
      text:
        en: |-
          Allow the cloudtrail.amazonaws.com service principal to use kms:GenerateDataKey* and kms:DescribeKey with an aws:SourceArn condition of arn:aws:cloudtrail:us-east-1:222222222222:trail/org-trail.
    - id: c
      text:
        en: |-
          Allow the arn:aws:iam::111111111111:root principal to use kms:Encrypt, kms:GenerateDataKey* and kms:DescribeKey on the key without conditions.
    - id: d
      text:
        en: |-
          Allow the s3.amazonaws.com service principal to use kms:GenerateDataKey* and kms:DescribeKey with an aws:SourceAccount condition of 222222222222.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CloudTrail itself generates the data keys that encrypt log files, so the key policy must allow the cloudtrail.amazonaws.com service principal to call kms:GenerateDataKey* and kms:DescribeKey. The aws:SourceArn condition restricts use to the specified trail, and an organization trail is owned by the management account, so its ARN contains 111111111111.
  options:
    b:
      en: |-
        The trail belongs to the management account, not to the log archive account, so this ARN never matches and CloudTrail still cannot use the key.
    c:
      en: |-
        Granting the management account's principals does not allow the CloudTrail service to use the key, and it does not restrict the key to the trail.
    d:
      en: |-
        The requirement is CloudTrail log file encryption, which CloudTrail performs; a grant to the S3 service principal does not let the trail use the key.
references:
  - title: Configure AWS KMS key policies for CloudTrail - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/create-kms-key-policy-for-cloudtrail.html
