id: dopc02-6b-backup-vault-lock-compliance
objective: "6.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company uses AWS Backup plans in its workload accounts, and a copy rule copies every recovery point to a vault in a dedicated backup account, where the copies are retained for 90 days. A new regulation requires that every recovery point in that vault be retained for at least 365 days, and that no user, including the root user, be able to delete a recovery point or shorten its retention. The backup team wants a few days to test the configuration and correct mistakes before the protection becomes permanent. Copies must keep arriving in the vault without failures.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Lock the vault with put-backup-vault-lock-configuration, a minimum retention of 365 days, and no changeable-for-days value so that the lock is permanent at once.
    - id: b
      text:
        en: |-
          Lock the vault in compliance mode with a minimum retention of 365 days and a grace time of 3 days, and test the setup before the grace time expires.
    - id: c
      text:
        en: |-
          Attach an SCP to the backup account that denies backup:DeleteRecoveryPoint and backup:UpdateRecoveryPointLifecycle for all principals.
    - id: d
      text:
        en: |-
          Change the copy rule of the backup plans so that the copies in the backup account vault are retained for at least 365 days.
    - id: e
      text:
        en: |-
          Enable S3 Object Lock in compliance mode on the bucket that stores the recovery points of the backup account vault.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      In compliance mode, AWS Backup Vault Lock can still be changed or removed during the grace time, which must be at least 3 days; after it expires, the lock cannot be changed or deleted by any user or by AWS, and deletions by any user, including the root user, are denied. Once a minimum retention is set, copy jobs whose lifecycle retention is shorter fail, so the copy rule must keep copies for at least 365 days.
  options:
    a:
      en: |-
        Without a changeable-for-days value, the lock is created in governance mode, which users with sufficient IAM permissions can remove.
    c:
      en: |-
        An SCP can be detached or changed by administrators of the management account, so the protection is not permanent and it is not a WORM setting on the vault.
    e:
      en: |-
        Backup vaults are not S3 buckets that the company manages, so S3 Object Lock cannot be applied to their recovery points.
references:
  - title: "AWS Backup Vault Lock - AWS Backup"
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html
