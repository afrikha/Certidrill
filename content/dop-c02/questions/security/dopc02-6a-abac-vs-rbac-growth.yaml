id: dopc02-6a-abac-vs-rbac-growth
objective: "6.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company creates about 20 new projects each quarter in a shared AWS account. Today, each project gets its own IAM role with a policy that lists the ARNs of the project's resources, and an administrator updates the policy every time a developer creates a resource. Developers move between projects often. The company wants access to follow the project membership of each developer without policy changes for new projects or new resources.

    Which approach should the company use?
body:
  options:
    - id: a
      text:
        en: |-
          One SCP for each project, attached to the account, that allows only the resources of that project
    - id: b
      text:
        en: |-
          Attribute-based access control that compares project tags on the principals with project tags on the resources
    - id: c
      text:
        en: |-
          One IAM user for each developer, with inline policies that list the resources of the developer's projects
    - id: d
      text:
        en: |-
          Role-based access control with one IAM role and one policy for each project and job function
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With ABAC, one policy compares the principal's project tag with the resource's project tag. New projects and new resources need only tags, and moving a developer to another project means changing the developer's tag, not the policies.
  options:
    a:
      en: |-
        SCPs apply to the whole account, so they cannot give different projects different access, and the account can have only a limited number of them.
    c:
      en: |-
        IAM users have long-term credentials, and resource lists in inline policies still need constant updates.
    d:
      en: |-
        Role-based policies grow with every project and must be updated whenever resources are added.
references:
  - title: "IAM tutorial: Define permissions to access AWS resources based on tags - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_attribute-based-access-control.html
