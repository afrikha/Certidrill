id: dopc02-6c-iam-events-us-east-1
objective: "6.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs all its workloads in eu-west-1. Its multi-Region trail logs all management events. To detect persistence after a credential compromise, a DevOps engineer creates an EventBridge rule in eu-west-1 on the default event bus with the pattern source aws.iam, detail-type AWS API Call via CloudTrail, and eventName CreateUser or CreateAccessKey, with an SNS topic in eu-west-1 as the target. During a test, the engineer creates an IAM user and an access key, and the CloudTrail log files contain both calls, but no notification is sent. The SNS topic delivers messages that are published to it manually.

    What should the engineer do to receive the notifications?
body:
  options:
    - id: a
      text:
        en: |-
          Change the rule state to ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS so that the rule also matches these IAM events.
    - id: b
      text:
        en: |-
          Create the same rule in us-east-1, where IAM events are recorded, and target the SNS topic in eu-west-1 or a topic in us-east-1.
    - id: c
      text:
        en: |-
          Enable data events for IAM on the trail, because EventBridge receives IAM user and access key events only as data events.
    - id: d
      text:
        en: |-
          Configure the trail to send its events to a CloudWatch Logs log group in eu-west-1 so that EventBridge can read the IAM events from it.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Events of global services such as IAM, AWS STS and CloudFront are recorded in US East (N. Virginia), us-east-1, and CloudTrail events are delivered to the default event bus of that Region. A rule in eu-west-1 never sees them; the same rule in us-east-1 matches CreateUser and CreateAccessKey and can notify a topic in either Region.
  options:
    a:
      en: |-
        This state is needed only for read-only management events; CreateUser and CreateAccessKey are write events, which a rule in the default state already matches in the Region where they are delivered.
    c:
      en: |-
        CreateUser and CreateAccessKey are management events, which the trail already logs; data events would not change where the events are delivered.
    d:
      en: |-
        EventBridge receives CloudTrail events directly; it does not read them from CloudWatch Logs, and the events would still be recorded in us-east-1.
references:
  - title: CloudTrail concepts - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html
  - title: AWS service events delivered via AWS CloudTrail - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
