id: dopc02-6a-mfa-deny-boolifexists
objective: "6.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Operators in an account are IAM users who belong to a group with a policy that allows Amazon EC2 actions. To protect production, the group also has this statement: Deny ec2:TerminateInstances on all resources with the condition Bool aws:MultiFactorAuthPresent false. Operators who sign in to the console without MFA cannot terminate instances. However, an operator terminated a production instance with the AWS CLI by using only the access keys of the IAM user.

    Which change will deny the termination for every request that is not authenticated with MFA?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the Deny statement with an Allow statement for ec2:TerminateInstances with the condition Bool aws:MultiFactorAuthPresent true.
    - id: b
      text:
        en: |-
          Add the condition NumericGreaterThan aws:MultiFactorAuthAge 3600 to the Deny statement to deny sessions whose MFA is older than one hour.
    - id: c
      text:
        en: |-
          Replace the condition with Null aws:MultiFactorAuthPresent true, so that the statement denies requests in which the key is absent.
    - id: d
      text:
        en: |-
          Change the condition operator of the Deny statement from Bool to BoolIfExists, and keep the value false for aws:MultiFactorAuthPresent.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      aws:MultiFactorAuthPresent is present only for temporary credentials. Requests signed with long-term access keys do not contain the key, so a Bool condition does not match them and the Deny does not apply. With BoolIfExists and false, the Deny matches requests from temporary credentials without MFA and requests made with long-term credentials.
  options:
    a:
      en: |-
        The group's policy already allows EC2 actions, so an additional conditional Allow cannot remove the termination right.
    b:
      en: |-
        The MFA age key is also absent for long-term access keys, so CLI requests made with the keys would still not be denied.
    c:
      en: |-
        This denies only requests without the key, so console or role sessions without MFA, where the key is false, would no longer be denied.
references:
  - title: "AWS global condition context keys - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
