id: dopc02-6c-inspector-lambda-code-scanning
objective: "6.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company deploys about 200 AWS Lambda functions through a CI/CD pipeline. Amazon Inspector is activated in the account with Lambda standard scanning, and it reports vulnerable third-party packages. A penetration test found an injection flaw and weak cryptography in the handler code that the company's developers wrote, but Amazon Inspector reported nothing for these issues. The functions use runtimes that Amazon Inspector supports for all Lambda scan types and are not encrypted with customer managed keys. The security team wants these issues in the custom code to be found automatically every time a function is deployed, by using an AWS managed service.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon CodeGuru Security integration in the pipeline that scans the function code before every deployment and fails on critical findings.
    - id: b
      text:
        en: |-
          Associate the function repository with Amazon CodeGuru Reviewer so that every pull request is reviewed for security issues before deployment.
    - id: c
      text:
        en: |-
          Enable Amazon GuardDuty Lambda Protection so that the functions are monitored for malicious activity after each deployment.
    - id: d
      text:
        en: |-
          Activate Lambda code scanning in Amazon Inspector in addition to Lambda standard scanning for the account.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Lambda standard scanning examines only the application dependencies of functions and layers. Lambda code scanning, which requires standard scanning, examines the custom application code and produces code vulnerability findings such as injection flaws, data leaks, weak cryptography and missing encryption. Amazon Inspector rescans a function when its code or layers are updated.
  options:
    a:
      en: |-
        Amazon CodeGuru Security has been discontinued, so it cannot be used for a new integration.
    b:
      en: |-
        Amazon CodeGuru Reviewer no longer accepts new repository associations, so it is not an option for a new design.
    c:
      en: |-
        GuardDuty Lambda Protection monitors the network activity of functions to detect threats such as cryptomining; it does not analyze source code for vulnerabilities.
references:
  - title: Scanning AWS Lambda functions with Amazon Inspector - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-lambda.html
  - title: Amazon Inspector finding types - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/findings-types.html
