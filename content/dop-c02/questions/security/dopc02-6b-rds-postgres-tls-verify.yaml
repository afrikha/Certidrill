id: dopc02-6b-rds-postgres-tls-verify
objective: "6.2.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon RDS for PostgreSQL 14 DB instance that uses the default DB parameter group. An audit found that some clients connect without TLS. The security team requires that the database reject every connection that is not encrypted in transit, and that clients verify the identity of the database server to prevent man-in-the-middle attacks.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure the clients to connect with sslmode=require so that every connection is encrypted.
    - id: b
      text:
        en: |-
          Turn on storage encryption with a customer managed AWS KMS key on the DB instance.
    - id: c
      text:
        en: |-
          Create a custom DB parameter group with the rds.force_ssl parameter set to 1, and associate it with the DB instance.
    - id: d
      text:
        en: |-
          Restrict the DB instance's security group to allow TCP 5432 only from the application security group.
    - id: e
      text:
        en: |-
          Configure the clients to connect with sslmode=verify-full and the certificate bundle for the instance's certificate authority from AWS.
answer: { optionIds: [c, e] }
explanation:
  correct:
    en: |-
      Setting rds.force_ssl to 1 in a custom parameter group makes RDS for PostgreSQL reject connections that do not use SSL/TLS. With sslmode=verify-full and the RDS CA certificates in the trust store, clients verify the certificate chain and that the certificate's common name matches the DB instance endpoint, which guards against spoofing.
  options:
    a:
      en: |-
        sslmode=require encrypts the connection but does not check that the server certificate matches the host name, so it does not fully protect against a man-in-the-middle.
    b:
      en: |-
        Storage encryption protects data at rest; it does not encrypt or enforce TLS for connections.
    d:
      en: |-
        Restricting sources limits who can connect, but it does not require encryption in transit or verify the server.
references:
  - title: "Using SSL with a PostgreSQL DB instance - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/PostgreSQL.Concepts.General.SSL.html
