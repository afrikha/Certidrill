id: dopc02-6c-network-activity-vpce-denied
objective: "6.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's workloads in private subnets reach Amazon S3 and AWS KMS only through VPC endpoints. The VPC endpoint policies allow requests only from principals in the company's organization, to prevent data exfiltration with credentials from other accounts. The company's multi-Region CloudTrail trail logs management events. The security team must record every request that a VPC endpoint policy denies, including requests signed with credentials from outside the organization and requests to buckets in other accounts. To control cost, only the denied requests must be logged.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create VPC flow logs on the network interfaces of the VPC endpoints, and filter the records whose action field is REJECT.
    - id: b
      text:
        en: |-
          Enable CloudTrail Insights on the trail for the API error rate, and record the Insights events for S3 and AWS KMS.
    - id: c
      text:
        en: |-
          Turn on S3 server access logging for the company's buckets, and create a CloudWatch Logs metric filter for AWS KMS calls that return AccessDenied.
    - id: d
      text:
        en: |-
          Add advanced event selectors to the trail for network activity events from s3.amazonaws.com and kms.amazonaws.com with the errorCode VpceAccessDenied.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CloudTrail network activity events record the API calls made through a VPC endpoint for the endpoint owner, whoever's credentials and resources the calls use. They are off by default and are configured per event source with advanced event selectors, and the optional errorCode field set to VpceAccessDenied limits logging, and cost, to the requests that the endpoint policy denies.
  options:
    a:
      en: |-
        Flow logs record IP traffic metadata; an endpoint policy denial happens at the API level, so the network flow is accepted and no API identity is recorded.
    b:
      en: |-
        Insights events report unusual error rates, not each denied request, and they do not identify endpoint policy denials.
    c:
      en: |-
        Server access logs cover only requests to the company's own buckets, so requests through the endpoints to buckets in other accounts are missed, and a metric filter only counts matching events instead of recording each denied request.
references:
  - title: Logging network activity events - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-network-events-with-cloudtrail.html
