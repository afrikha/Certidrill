id: dopc02-6b-s3-object-lock-compliance
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A brokerage firm must keep trade confirmation files in Amazon S3 for 7 years in a write once, read many (WORM) form to meet a regulation. During that period, no user, including the root user of the account, may delete or overwrite a file version or shorten its retention period. The files are written to a new S3 bucket by an application. The firm wants the retention to apply automatically to every new file.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable S3 Object Lock on the bucket, and set a default retention of 7 years in governance mode.
    - id: b
      text:
        en: |-
          Enable S3 Versioning and MFA delete on the bucket, and add a bucket policy that denies s3:DeleteObject for all principals.
    - id: c
      text:
        en: |-
          Enable S3 Object Lock on the bucket, and set a default retention of 7 years in compliance mode.
    - id: d
      text:
        en: |-
          Add an S3 Lifecycle rule that transitions the files to S3 Glacier Deep Archive after 1 day and expires them after 7 years.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In compliance mode, a protected object version cannot be overwritten or deleted by any user, including the root user, and its retention mode cannot be changed or its period shortened. A default retention period on the bucket applies the protection automatically to each new object version.
  options:
    a:
      en: |-
        In governance mode, users with the s3:BypassGovernanceRetention permission can delete versions or shorten the retention, which the regulation forbids.
    b:
      en: |-
        A bucket policy can be changed or removed by an administrator or the root user, and MFA delete does not stop an authorized root user; this is not WORM protection.
    d:
      en: |-
        A lifecycle rule changes the storage class and expires objects; it does not stop anyone from deleting or overwriting them before 7 years.
references:
  - title: "Locking objects with Object Lock - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
