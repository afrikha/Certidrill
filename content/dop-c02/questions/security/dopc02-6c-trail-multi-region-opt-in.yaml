id: dopc02-6c-trail-multi-region-opt-in
objective: "6.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company created a CloudTrail trail in us-east-1 several years ago as a single-Region trail that delivers log files to an S3 bucket. The company now runs workloads in five Regions and plans to enable opt-in Regions next year. Auditors require that management events from every Region that is enabled in the account, now and in the future, be delivered to the same bucket. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Update the existing trail to a multi-Region trail by running the update-trail command with the --is-multi-region-trail option.
    - id: b
      text:
        en: |-
          Use a StackSet to create a single-Region trail in each Region that delivers to the same bucket, and add Regions to the StackSet as they are enabled.
    - id: c
      text:
        en: |-
          Rely on CloudTrail Event history in each Region, and export the events to the bucket with a scheduled AWS Lambda function.
    - id: d
      text:
        en: |-
          Create a CloudTrail Lake event data store that collects management events from all Regions, and keep the existing trail for us-east-1.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A multi-Region trail logs events from all Regions that are enabled in the account and delivers them to the same S3 bucket. When an opt-in Region is enabled later, CloudTrail creates an identical copy of each multi-Region trail in that Region automatically, so no further action is needed.
  options:
    b:
      en: |-
        Per-Region trails work but must be maintained in every Region, and each newly enabled Region requires a StackSet update.
    c:
      en: |-
        Event history is a 90-day view per Region, and exporting it requires custom code; a trail is the supported way to deliver events to a bucket.
    d:
      en: |-
        CloudTrail Lake is closed to new customers, and an event data store does not deliver log files to the auditors' bucket.
references:
  - title: Receiving CloudTrail log files from multiple Regions - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/receive-cloudtrail-log-files-from-multiple-regions.html
