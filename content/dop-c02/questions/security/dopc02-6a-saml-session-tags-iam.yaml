id: dopc02-6a-saml-session-tags-iam
objective: "6.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company federates its employees into one AWS account through an IAM SAML identity provider. All analysts assume the same role, Analyst. The company wants Analyst's policies to allow access to Amazon S3 objects only when the object's department tag matches the analyst's department, which the corporate IdP knows. Today the role's trust policy allows only sts:AssumeRoleWithSAML. Policies must not need to change when analysts move to another department.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add the sts:TagSession action to the statement of the Analyst trust policy that trusts the SAML identity provider.
    - id: b
      text:
        en: |-
          Tag the Analyst role with department=all so that the session tag that the IdP passes is merged with the role tag.
    - id: c
      text:
        en: |-
          Configure the IdP to send an attribute named https://aws.amazon.com/SAML/Attributes/PrincipalTag:department with the analyst's department.
    - id: d
      text:
        en: |-
          Configure the IdP to send an attribute named https://aws.amazon.com/SAML/Attributes/AccessControl:department with the analyst's department.
    - id: e
      text:
        en: |-
          Create one role for each department with a policy that allows access to objects whose department tag matches that role's department.
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      A SAML IdP passes session tags as attributes named https://aws.amazon.com/SAML/Attributes/PrincipalTag:TagKey, which policies read with aws:PrincipalTag. The trust policy of a role connected to an IdP must allow sts:TagSession, or the role assumption fails when tags are passed.
  options:
    b:
      en: |-
        A role tag has the same value for every analyst, and a session tag with the same key overrides it; it adds nothing.
    d:
      en: |-
        The AccessControl attribute name is used by IAM Identity Center for attributes for access control, not by an IAM SAML provider.
    e:
      en: |-
        One role per department is role-based access control and must change whenever departments are added.
references:
  - title: "Pass session tags in AWS STS - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_session-tags.html
