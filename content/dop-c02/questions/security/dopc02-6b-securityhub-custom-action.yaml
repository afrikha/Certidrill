id: dopc02-6b-securityhub-custom-action
objective: "6.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's security analysts review AWS Security Hub CSPM findings about overly permissive security groups in the delegated administrator account. Some findings are accepted exceptions, so remediation must never start automatically. After an analyst reviews a finding and decides to remediate it, the analyst must be able to start an existing AWS Lambda function that removes the offending rules, directly from the Security Hub CSPM console, for one or more selected findings. The team wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule that matches Security Hub Findings - Imported events for the control, and set the Lambda function as the target.
    - id: b
      text:
        en: |-
          Create an automation rule in Security Hub CSPM that matches the control's findings and invokes the Lambda function as its action.
    - id: c
      text:
        en: |-
          Create a Security Hub CSPM custom action, and an Amazon EventBridge rule that matches Findings - Custom Action events for its ARN and targets the Lambda function.
    - id: d
      text:
        en: |-
          Create a custom insight that lists the control's findings, and give the analysts permission to invoke the Lambda function from the Lambda console with the finding ID.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A custom action lets an analyst select findings in the console and send them to EventBridge as Security Hub Findings - Custom Action events. An EventBridge rule that matches the custom action ARN starts the Lambda function with the selected findings, so remediation happens only after review and without new code.
  options:
    a:
      en: |-
        Findings - Imported events are sent for every new or updated finding, so remediation would start automatically, including for accepted exceptions.
    b:
      en: |-
        Automation rules update finding fields such as workflow status or severity; they do not invoke Lambda functions, and they run automatically.
    d:
      en: |-
        Insights only group findings; invoking the function by hand from another console with copied finding IDs is a manual, error-prone process.
references:
  - title: "Using custom actions to send findings and insight results to EventBridge - AWS Security Hub"
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-cwe-custom-actions.html
  - title: "Security Hub CSPM event types in EventBridge - AWS Security Hub"
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-cwe-integration-types.html
