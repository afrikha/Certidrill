id: dopc02-6b-acm-imported-expiry-event
objective: "6.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank has 30 AWS accounts. Because of a regulatory requirement, the bank uses certificates from an external certificate authority and imports them into AWS Certificate Manager (ACM) in each account; teams import new certificates every month. The security team must open a ticket automatically through an existing AWS Lambda function in each account for every imported certificate that is close to expiration. The solution must cover certificates that are imported in the future without any configuration for each certificate. The bank wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the DaysToExpiry metric of each imported certificate, and invoke the Lambda function from an Amazon SNS topic that the alarms notify.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule that matches ACM Certificate Renewal Action Required events, and set the Lambda function as the target.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule that matches ACM Certificate Expired events, and set the Lambda function as the target.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule that matches ACM Certificate Approaching Expiration events, and set the Lambda function as the target.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      ACM sends daily Approaching Expiration events for all active certificates, including imported certificates, starting 45 days before expiration for imported and private certificates; the timing can be changed with the PutAccountConfiguration action. One EventBridge rule per account therefore covers every current and future imported certificate without per-certificate configuration.
  options:
    a:
      en: |-
        DaysToExpiry is published per certificate with the CertificateArn dimension, so each new certificate would need a new alarm, which is the per-certificate configuration the bank wants to avoid.
    b:
      en: |-
        Renewal Action Required events report failed managed renewals; they are not available for imported certificates, which ACM never renews.
    c:
      en: |-
        Certificate Expired events are not available for imported certificates, and an alert at expiry comes too late to prevent an outage.
references:
  - title: "Amazon EventBridge support for ACM - AWS Certificate Manager"
    url: https://docs.aws.amazon.com/acm/latest/userguide/supported-events.html
  - title: "Supported CloudWatch metrics - AWS Certificate Manager"
    url: https://docs.aws.amazon.com/acm/latest/userguide/cloudwatch-metrics.html
