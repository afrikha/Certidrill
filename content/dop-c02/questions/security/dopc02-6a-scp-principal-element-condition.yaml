id: dopc02-6a-scp-principal-element-condition
objective: "6.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to stop the role named Developer, which exists in every account of its Workloads OU, from deleting Amazon CloudWatch Logs log groups. Other roles in those accounts must keep their current permissions. A DevOps engineer wrote an SCP with a Deny statement for logs:DeleteLogGroup and a Principal element that names arn:aws:iam::*:role/Developer. AWS Organizations rejects the policy when the engineer tries to save it.

    How should the engineer change the SCP?
body:
  options:
    - id: a
      text:
        en: |-
          Remove the Principal element, and add a condition that applies the Deny statement only when aws:PrincipalArn matches arn:aws:iam::*:role/Developer.
    - id: b
      text:
        en: |-
          Replace the Deny statement with an Allow statement for logs:DeleteLogGroup whose Principal element names every role except Developer.
    - id: c
      text:
        en: |-
          Replace the Principal element with a NotPrincipal element that lists every role except Developer, and keep the Deny statement for logs:DeleteLogGroup.
    - id: d
      text:
        en: |-
          Remove the Principal element, and set the Resource element of the Deny statement to arn:aws:iam::*:role/Developer.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      SCPs do not support the Principal and NotPrincipal elements, because they always apply to the principals of the accounts that they are attached to. To target one role, the statement uses a condition on aws:PrincipalArn, which is supported in SCP Deny and Allow statements.
  options:
    b:
      en: |-
        An Allow statement cannot name principals in an SCP, and SCP allow statements never grant permissions.
    c:
      en: |-
        NotPrincipal is not supported in SCPs either.
    d:
      en: |-
        The Resource element identifies the log groups that the action applies to, not the caller, so the deny would match nothing.
references:
  - title: "SCP syntax - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_syntax.html
