id: dopc02-6a-ecs-task-role-block-imds
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs eight microservices as Amazon ECS services on a cluster of Amazon EC2 container instances. All tasks use the awsvpc network mode. Because the services need different AWS permissions, the container instance IAM role has accumulated permissions for Amazon S3, Amazon SQS, and Amazon DynamoDB, and every container can use them. The security team requires that each service receive only the permissions that it needs and that containers can no longer obtain the container instance role's credentials. Permissions must be changed later without any change to the container instances, and the services must stay on the EC2 launch type.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a task IAM role for each service with only its permissions, reference it as the task role in each task definition, and keep the current permissions on the container instance role.
    - id: b
      text:
        en: |-
          Create a container instance role for each service, create one Auto Scaling group capacity provider per service, and run each service on the capacity provider that has its role.
    - id: c
      text:
        en: |-
          Create a task IAM role for each service with only its permissions, reference it as the task role in each task definition, and set ECS_AWSVPC_BLOCK_IMDS to true in the ECS agent configuration.
    - id: d
      text:
        en: |-
          Create a task execution role for each service with only its permissions, reference it as the execution role in each task definition, and remove those permissions from the container instance role.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A task IAM role delivers credentials to the application code of the tasks that reference it, so each service gets its own least-privilege permissions, and changing them is a task definition change only. On EC2 container instances, containers can otherwise reach the instance metadata service and the container instance role. Setting ECS_AWSVPC_BLOCK_IMDS to true blocks that access for tasks in awsvpc mode while the tasks keep their task role permissions.
  options:
    a:
      en: |-
        The containers could still obtain the broad container instance role credentials through the instance metadata service, which the security team forbids.
    b:
      en: |-
        Separate fleets per service tie permissions to container instances, so every permission change requires a change to the instances, which the company does not accept.
    d:
      en: |-
        The task execution role is used by the ECS agent to pull images and send logs; its permissions are not given to the application code in the containers.
references:
  - title: "Amazon ECS task IAM role - Amazon Elastic Container Service"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html
