id: dopc02-6c-resolver-query-logging
objective: "6.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team suspects that malware on some Amazon EC2 instances exfiltrates data by encoding it in DNS queries to an attacker's domain. The instances run in three VPCs in one account and use the Route 53 Resolver provided by each VPC. The team must record, for every instance, the DNS names it queries, the record types, the response codes and the instance ID, and it must be able to search the records in CloudWatch Logs. The team wants an AWS managed logging feature.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create VPC flow logs for the three VPCs with a custom format that includes all available fields, and publish them to a CloudWatch Logs log group.
    - id: b
      text:
        en: |-
          Create a Route 53 Resolver query logging configuration with a CloudWatch Logs log group as the destination, and associate the three VPCs with it.
    - id: c
      text:
        en: |-
          Turn on public DNS query logging for the company's public hosted zones in Route 53, and send the logs to a CloudWatch Logs log group.
    - id: d
      text:
        en: |-
          Enable Amazon GuardDuty in the account, and export the DNS logs that GuardDuty analyzes to a CloudWatch Logs log group.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Resolver query logging records the DNS queries that originate in the VPCs you associate with the configuration, with values such as the VPC ID, source IP and instance ID, query name, record type and response code. It can deliver the logs to a CloudWatch Logs log group, an S3 bucket or a Firehose stream.
  options:
    a:
      en: |-
        Flow logs record IP traffic metadata such as addresses, ports and bytes; they never contain the DNS names that the instances query.
    c:
      en: |-
        Public DNS query logging records queries that reach Route 53 for the company's own public hosted zones, not the queries that the instances send to an attacker's domain.
    d:
      en: |-
        GuardDuty consumes DNS logs through its own feed to generate findings; it does not provide the DNS logs themselves for the team to search.
references:
  - title: Resolver query logging - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs.html
