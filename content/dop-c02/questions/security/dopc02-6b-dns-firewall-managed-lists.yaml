id: dopc02-6b-dns-firewall-managed-lists
objective: "6.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 40 VPCs in 25 accounts in AWS Organizations. Amazon GuardDuty recently reported an EC2 instance that queried domains associated with malware command-and-control servers. The security team wants a preventive control that blocks DNS resolution of known malicious domains for every VPC, including VPCs created later, by using domain lists that AWS maintains. AWS Firewall Manager is already configured for the organization.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a GuardDuty suppression rule for the DNS finding types so that queries to these domains are blocked automatically.
    - id: b
      text:
        en: |-
          Create a Firewall Manager DNS Firewall policy for all accounts with a rule group that blocks the AWS managed malware and botnet domain lists.
    - id: c
      text:
        en: |-
          Add network ACL deny rules for the IP addresses of the domains in the latest GuardDuty findings to the subnets of every VPC.
    - id: d
      text:
        en: |-
          Turn on Route 53 Resolver query logging for every VPC, and alert the security team when a logged query matches a known malicious domain.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Route 53 Resolver DNS Firewall filters the DNS queries that VPCs send to the Resolver and can block domains from AWS managed domain lists, such as malware and botnet command-and-control lists. A Firewall Manager DNS Firewall policy associates the rule group with the VPCs of every in-scope account, including VPCs and accounts added later.
  options:
    a:
      en: |-
        Suppression rules archive findings; GuardDuty detects threats but does not block DNS queries.
    c:
      en: |-
        Malicious domains change addresses often, and network ACLs hold a limited number of rules; this is reactive and does not block resolution.
    d:
      en: |-
        Query logging and alerts are detective controls; the requirement is a preventive control that blocks the resolution.
references:
  - title: "Managed Domain Lists - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-dns-firewall-managed-domain-lists.html
  - title: "AWS Firewall Manager - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html
