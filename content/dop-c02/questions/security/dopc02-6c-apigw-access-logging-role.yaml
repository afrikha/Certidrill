id: dopc02-6c-apigw-access-logging-role
objective: "6.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company exposes a REST API in Amazon API Gateway in a new account in ap-southeast-2. For security investigations, the team needs one log entry per request that records the caller's source IP address, the authenticated principal, the resource path, and the response status. A DevOps engineer creates a CloudWatch Logs log group and tries to turn on logging for the prod stage, but API Gateway returns an error that a CloudWatch Logs role ARN must be set in the account settings.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a role trusted by apigateway.amazonaws.com with AmazonAPIGatewayPushToCloudWatchLogs, set it as the CloudWatch Logs role ARN in the API Gateway settings in ap-southeast-2, and turn on access logging with the needed $context variables.
    - id: b
      text:
        en: |-
          Add a resource-based policy to the log group that allows apigateway.amazonaws.com to call logs:PutLogEvents, and turn on execution logging at the INFO level for the prod stage.
    - id: c
      text:
        en: |-
          Create a role trusted by apigateway.amazonaws.com with AmazonAPIGatewayPushToCloudWatchLogs, set it as the CloudWatch Logs role ARN in the API Gateway settings in us-east-1, and turn on access logging with the needed $context variables.
    - id: d
      text:
        en: |-
          Attach AmazonAPIGatewayPushToCloudWatchLogs to the execution role of the API's Lambda integration, and turn on access logging with the needed $context variables.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      API Gateway writes REST API logs to CloudWatch Logs through an IAM role that trusts apigateway.amazonaws.com, typically with the AmazonAPIGatewayPushToCloudWatchLogs managed policy, and the role ARN must be set in the account's cloudWatchRoleArn setting separately in each Region. Access logging records who accessed the API and how, with a format built from $context variables such as the source IP address and status.
  options:
    b:
      en: |-
        API Gateway uses the account-level role, not a log group resource policy, and execution logs describe how requests were processed rather than producing one access record per request with the chosen fields.
    c:
      en: |-
        The cloudWatchRoleArn setting is Regional; setting it in us-east-1 does not allow logging for an API in ap-southeast-2.
    d:
      en: |-
        The integration's execution role is used by the backend function, not by API Gateway to write logs, so the account-level setting is still missing.
references:
  - title: Set up CloudWatch logging for REST APIs in API Gateway - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-logging.html
