id: dopc02-6b-ebs-encryption-by-default
objective: "6.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs Amazon EC2 Auto Scaling groups in us-east-1, eu-west-1, and ap-southeast-1 in one account. Some launch templates use AMIs whose snapshots are not encrypted. The security team requires every new EBS volume in the account to be encrypted at rest in all three Regions, without changing the launch templates or the AMIs.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on EBS encryption by default in us-east-1; the setting applies to every Region of the account.
    - id: b
      text:
        en: |-
          Turn on EBS encryption by default in each of the three Regions.
    - id: c
      text:
        en: |-
          Deploy the encrypted-volumes AWS Config managed rule in the three Regions, and notify the teams that own noncompliant volumes.
    - id: d
      text:
        en: |-
          Attach an SCP to the account that denies ec2:RunInstances when the ec2:Encrypted condition key is false for the volumes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      EBS encryption by default is an account setting for each Region. Once it is turned on in a Region, every new volume and snapshot copy there is encrypted, including volumes created from unencrypted snapshots, so the launch templates and AMIs can stay unchanged.
  options:
    a:
      en: |-
        The setting is Regional; turning it on in us-east-1 leaves new volumes in eu-west-1 and ap-southeast-1 unencrypted.
    c:
      en: |-
        The rule detects unencrypted volumes after they are created; it does not encrypt new volumes.
    d:
      en: |-
        A deny only makes launches from unencrypted snapshots fail; it does not encrypt the volumes, so the Auto Scaling groups would stop launching instances.
references:
  - title: "Enable Amazon EBS encryption by default - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/encryption-by-default.html
