id: dopc02-6a-scp-deny-member-root-user
objective: "6.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 60 member accounts in AWS Organizations. A contractual process still requires that the root user credentials of these accounts exist for one more year, but the security team requires that the root user of a member account cannot perform any action in the meantime. IAM users and roles in the member accounts must keep their current permissions, and member account administrators must not be able to lift the restriction.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP to the OUs of the member accounts that denies all actions on all resources without any condition.
    - id: b
      text:
        en: |-
          Attach an SCP to the OUs of the member accounts that denies all actions when the aws:PrincipalArn key matches arn:aws:iam::*:root.
    - id: c
      text:
        en: |-
          Configure an MFA device for the root user of each member account, because SCPs do not apply to the root user.
    - id: d
      text:
        en: |-
          Attach an identity-based policy to the root user of each member account that denies all actions, and protect it with an SCP.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      SCPs apply to all principals of member accounts, including the root user. A deny statement conditioned on the root user's ARN pattern blocks only the root user, and member account administrators cannot detach the SCP.
  options:
    a:
      en: |-
        An unconditional deny would block every IAM user and role in the accounts as well.
    c:
      en: |-
        SCPs do apply to the root user of member accounts, and MFA protects the sign-in without restricting what the root user can do.
    d:
      en: |-
        Policies cannot be attached to the root user; it is not an IAM user or role.
references:
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
