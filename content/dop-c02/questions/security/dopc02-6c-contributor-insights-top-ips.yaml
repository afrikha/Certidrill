id: dopc02-6c-contributor-insights-top-ips
objective: "6.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon API Gateway REST API writes JSON access logs, with fields such as ip, status and resourcePath, to a CloudWatch Logs log group. The security team suspects credential-stuffing attempts against the login resource. The team wants a CloudWatch dashboard widget that shows, continuously and in near real time, the 10 client IP addresses that receive the most HTTP 401 responses, without anyone running queries. The team wants to use a managed CloudWatch feature and write no code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a metric filter that counts log events with status 401, and add a graph of the metric with an alarm threshold to the dashboard.
    - id: b
      text:
        en: |-
          Save a CloudWatch Logs Insights query that counts 401 responses by ip, and ask the on-call engineer to run it on the dashboard during incidents.
    - id: c
      text:
        en: |-
          Create a CloudWatch Contributor Insights rule on the log group that uses ip as the contributor key and filters on status 401, and add its report to the dashboard.
    - id: d
      text:
        en: |-
          Export the log group to Amazon S3 every day, and query the top 401 sources with Amazon Athena from a dashboard widget.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Contributor Insights analyzes log data in real time and builds time series of the top-N contributors, which is how you find top talkers such as bad hosts. A rule defines the log field that identifies a contributor, here the client IP address, and can filter the events, and its report can be shown on a dashboard without running queries.
  options:
    a:
      en: |-
        A metric filter produces a total count of 401 responses; it does not show which client IP addresses contribute the most.
    b:
      en: |-
        A saved query still has to be run by someone, so the dashboard is not updated continuously.
    d:
      en: |-
        A daily export is neither near real time nor a managed CloudWatch feature for continuous top-N analysis.
references:
  - title: Use Contributor Insights to analyze high-cardinality data - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContributorInsights.html
