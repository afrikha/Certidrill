id: dopc02-6c-revoke-leaked-role-sessions
objective: "6.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A deployment pipeline assumes the IAM role ProdDeployRole in a production account at the start of each run. The role's maximum session duration is 12 hours. A misconfigured build step printed the role session's temporary credentials, including the access key ID that starts with ASIA and the session token, in a build log that was briefly public. A DevOps engineer must make the leaked credentials unusable immediately. The role must keep its current permissions, and later pipeline runs must keep working without changes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Find the leaked access key ID on the Security credentials tab of ProdDeployRole in the IAM console, and deactivate the key.
    - id: b
      text:
        en: |-
          Reduce the maximum session duration of ProdDeployRole to 1 hour so that the leaked credentials expire sooner.
    - id: c
      text:
        en: |-
          Choose Revoke active sessions for ProdDeployRole in the IAM console so that sessions issued before now are denied.
    - id: d
      text:
        en: |-
          Remove the pipeline's principal from the trust policy of ProdDeployRole, and add it back after the build log is deleted.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Revoking active sessions attaches the AWSRevokeOlderSessions inline policy to the role. It denies all actions to requests signed with temporary credentials whose aws:TokenIssueTime is earlier than the revocation time, so the leaked credentials stop working. The role's permissions are otherwise unchanged, and the next pipeline run gets valid credentials when it assumes the role again.
  options:
    a:
      en: |-
        Role sessions use temporary credentials issued by AWS STS; a role has no access keys that can be deactivated in IAM.
    b:
      en: |-
        Changing the maximum session duration affects only new sessions; credentials that were already issued remain valid until they expire.
    d:
      en: |-
        The trust policy controls who can assume the role in the future; credentials that were already issued keep working.
references:
  - title: Revoke IAM role temporary security credentials - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_revoke-sessions.html
