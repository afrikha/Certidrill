id: dopc02-4a-agent-memory-disk
objective: "4.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a Java application on Amazon EC2 Linux instances. The application has crashed twice because the instances ran out of memory, and once because the root volume filled up. The operations team looked for memory and disk space metrics in the AWS/EC2 namespace but found only CPU, network, disk I/O, and status check metrics. The team needs memory utilization and disk space utilization metrics in CloudWatch to create alarms.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable detailed monitoring on the instances so that EC2 publishes memory and disk space utilization in 1-minute periods.
    - id: b
      text:
        en: |-
          Turn on AWS Compute Optimizer for the account, and create alarms on the memory utilization findings that it reports for the instances.
    - id: c
      text:
        en: |-
          Install the CloudWatch agent on the instances, and configure it to collect the mem_used_percent and disk_used_percent metrics.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on the StatusCheckFailed_Instance metric, which reports exhausted memory and full file systems.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Memory and file system usage are visible only inside the operating system, so EC2 does not publish them as default metrics. The CloudWatch agent collects them as custom metrics, such as mem_used_percent and disk_used_percent, which alarms can then use.
  options:
    a:
      en: |-
        Detailed monitoring changes the period of the default EC2 metrics to 1 minute; it does not add memory or disk space metrics.
    b:
      en: |-
        Compute Optimizer gives rightsizing recommendations; it does not publish memory and disk space metrics for alarms.
    d:
      en: |-
        The instance status check can fail for problems such as exhausted memory, but it reports a failure only after the fact and gives no utilization value to alarm on before a crash.
references:
  - title: Manually create or edit the CloudWatch agent configuration file - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
