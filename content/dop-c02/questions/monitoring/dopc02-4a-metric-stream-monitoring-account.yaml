id: dopc02-4a-metric-stream-monitoring-account
objective: "4.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses CloudWatch cross-account observability in us-east-1: a monitoring account is linked to 60 source accounts that share their metrics, and new accounts are linked automatically. The company now needs every metric of every account delivered in near real time to a data lake bucket in the monitoring account through Amazon Data Firehose. The platform team wants as few streaming resources as possible to manage and does not want to change anything when accounts are added.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create one metric stream in the monitoring account that sends to a Firehose stream writing to the bucket, and include the metrics from the linked source accounts.
    - id: b
      text:
        en: |-
          Deploy a metric stream and a Firehose stream to each source account with a CloudFormation StackSet, and grant each Firehose stream access to the bucket.
    - id: c
      text:
        en: |-
          Create one metric stream in the monitoring account, and add a filter for each source account ID so that their metrics are included in the stream.
    - id: d
      text:
        en: |-
          Create a CloudWatch Logs subscription filter in each source account that sends the metric data to a Firehose stream in the monitoring account.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A metric stream in a cross-account observability monitoring account can include the metrics of the linked source accounts. One stream and one Firehose stream therefore cover all accounts, and accounts linked later are covered without any change.
  options:
    b:
      en: |-
        A stream per account works but creates 60 sets of resources and cross-account permissions to manage, which the team wants to avoid.
    c:
      en: |-
        Metric stream filters select namespaces and metric names, not account IDs; source account metrics are included by the stream's source account setting.
    d:
      en: |-
        Subscription filters send log events from log groups; they do not deliver CloudWatch metrics.
references:
  - title: Use metric streams - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Metric-Streams.html
  - title: CloudWatch cross-account observability - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Unified-Cross-Account.html
