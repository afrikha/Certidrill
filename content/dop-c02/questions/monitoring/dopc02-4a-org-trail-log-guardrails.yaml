id: dopc02-4a-org-trail-log-guardrails
objective: "4.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has 80 member accounts in an organization in AWS Organizations, and the administrators of each member account have full IAM permissions in their account. CloudTrail must record the API activity of every member account, including accounts created later, and member account administrators must not be able to stop or change that logging. In each member account, the application log groups whose names start with /prod/ and their log streams must not be deleted by anyone except a PlatformAutomation role that exists in every account.

    Which combination of steps will meet these requirements with the LEAST operational overhead? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Deploy a trail to every member account with a CloudFormation StackSet that has automatic deployment enabled for new accounts in the organization.
    - id: b
      text:
        en: |-
          From the management account, create an organization trail that applies to all accounts in the organization and delivers to an S3 bucket in a log archive account.
    - id: c
      text:
        en: |-
          Deploy an AWS Config custom rule that detects deleted /prod/ log groups and an automatic remediation that re-creates them with the same name and settings.
    - id: d
      text:
        en: |-
          Attach an IAM permissions boundary that denies the CloudWatch Logs delete actions to the administrator roles in each member account.
    - id: e
      text:
        en: |-
          Attach an SCP to the member accounts that denies logs:DeleteLogGroup and logs:DeleteLogStream on /prod/* log groups unless aws:PrincipalArn matches the PlatformAutomation role.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Member accounts can see an organization trail but cannot delete it, turn logging off, or change it, and new accounts are logged automatically. An SCP limits every principal in the member accounts, including administrators and the root user, so a deny with an exception for the PlatformAutomation role protects the /prod/ log groups.
  options:
    a:
      en: |-
        Trails created in member accounts belong to those accounts, so their administrators could stop logging or delete the trails.
    c:
      en: |-
        Detection and re-creation happen after the deletion, so the log events are already lost; the rule does not prevent the change.
    d:
      en: |-
        Administrators with full IAM permissions can remove or change a permissions boundary, and it does not apply to the root user.
references:
  - title: Creating a trail for an organization - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html
  - title: Service control policies (SCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
