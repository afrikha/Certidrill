id: dopc02-4c-rds-storage-autoscaling
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an Amazon RDS for PostgreSQL DB instance with 500 GiB of General Purpose SSD storage. Monthly bulk imports have filled the storage twice, and each time an operator had to increase the allocated storage manually. The company wants the storage to grow automatically when free space runs low, up to 2,000 GiB. The change must not cause downtime, and the company doesn't want to write custom code or change the database engine.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Register the DB instance's allocated storage as a scalable target in Application Auto Scaling, and add a target tracking policy on the FreeStorageSpace metric.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on the FreeStorageSpace metric that invokes an AWS Lambda function, which calls ModifyDBInstance to add 10 percent of storage.
    - id: c
      text:
        en: |-
          Migrate the database to an Amazon Aurora PostgreSQL DB cluster, and rely on the automatic growth of the Aurora cluster volume as data is added.
    - id: d
      text:
        en: |-
          Turn on storage autoscaling for the DB instance by setting its maximum storage threshold to 2,000 GiB.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      RDS storage autoscaling is turned on by setting a maximum storage threshold (MaxAllocatedStorage), with no reboot or downtime. RDS adds storage when free space is 10 percent or less of the allocated storage for at least 5 minutes, in increments of at least 10 GiB or 10 percent, and never beyond the threshold.
  options:
    a:
      en: |-
        Storage growth of an RDS DB instance is configured on the instance itself with storage autoscaling, not through an Application Auto Scaling scalable target.
    b:
      en: |-
        This works, but it is custom code that the company wants to avoid, and it duplicates a built-in RDS feature.
    c:
      en: |-
        A migration to Aurora changes the database engine, which the company doesn't want; storage autoscaling solves the problem on the existing instance.
references:
  - title: "Managing capacity automatically with Amazon RDS storage autoscaling - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.Autoscaling.html
