id: dopc02-4c-procstat-process-alarm
objective: "4.3.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs several Java applications on each Amazon EC2 instance of a fleet. The CloudWatch agent is already installed on the instances. The order service is started with the command line java -jar /opt/orders/orders-service.jar. The operations team needs an alarm when the order service isn't running on an instance, and needs a metric for the resident memory used by that process only. The other Java processes on the instances must not be counted.

    Which CloudWatch agent configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a procstat section with exe set to java that measures pid_count and memory_rss, and create an alarm when procstat_lookup_pid_count is lower than 1.
    - id: b
      text:
        en: |-
          Add a procstat section with exe set to orders-service.jar that measures pid_count and memory_rss, and create an alarm when procstat_lookup_pid_count is lower than 1.
    - id: c
      text:
        en: |-
          Add a procstat section with pattern set to orders-service.jar that measures pid_count and memory_rss, and create an alarm when procstat_lookup_pid_count is lower than 1.
    - id: d
      text:
        en: |-
          Add a mem section that measures mem_used_percent, and create an alarm when the memory used on the instance drops sharply after the order service stops.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The procstat plugin selects processes with pid_file, exe, or pattern. pattern matches the entire command line, including parameters, so orders-service.jar selects only the order service. memory_rss gives its resident memory, and procstat_lookup_pid_count is the number of matching processes on Linux, so a value lower than 1 means that the service isn't running.
  options:
    a:
      en: |-
        exe matches the process name, which is java for every Java application, so all Java processes would be counted together.
    b:
      en: |-
        exe matches the process name, not the command line arguments; the process name is java, so nothing would match orders-service.jar.
    d:
      en: |-
        mem_used_percent is instance-wide memory, so it can't isolate the order service or reliably show that it stopped.
references:
  - title: "Collect process metrics with the procstat plugin - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-procstat-process-metrics.html
