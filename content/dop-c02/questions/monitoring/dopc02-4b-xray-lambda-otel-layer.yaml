id: dopc02-4b-xray-lambda-otel-layer
objective: "4.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs Python AWS Lambda functions, deployed from .zip packages, that call Amazon DynamoDB, Amazon SQS, and third-party HTTP APIs. Lambda active tracing is enabled, but the traces show only the Lambda service and the invocation, not the downstream calls. The team wants traces of the downstream calls and standard application metrics such as latency and faults per operation. The team must not change the function code and must not adopt instrumentation that AWS has placed in maintenance mode. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the AWS X-Ray SDK for Python to the deployment packages, and call patch_all() at the start of each handler so that the SDK records the downstream calls.
    - id: b
      text:
        en: |-
          Enable Application Signals on the functions, which adds the AWS Lambda Layer for OpenTelemetry, and attach CloudWatchLambdaApplicationSignalsExecutionRolePolicy to the execution roles.
    - id: c
      text:
        en: |-
          Add a Lambda extension that runs the AWS X-Ray daemon next to each function, and raise the X-Ray sampling rate of the functions to 100% in their tracing configuration.
    - id: d
      text:
        en: |-
          Create a CloudWatch Logs metric filter on each function's log group for the duration of downstream calls, and add the AWSXRayDaemonWriteAccess policy to the execution roles.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS recommends OpenTelemetry for tracing, and for Lambda the recommended option is the AWS Lambda Layer for OpenTelemetry, which auto-instruments Python functions without code changes. Enabling Application Signals adds the layer and its exec wrapper (AWS_LAMBDA_EXEC_WRAPPER=/opt/otel-instrument) and, with the CloudWatchLambdaApplicationSignalsExecutionRolePolicy policy, produces traces of downstream calls and standard application metrics.
  options:
    a:
      en: |-
        The X-Ray SDKs entered maintenance mode on February 25, 2026, and adding patch_all() changes the function code.
    c:
      en: |-
        The X-Ray daemon is also in maintenance mode, and Lambda does not let you configure the X-Ray sampling rate of a function.
    d:
      en: |-
        The functions do not log the duration of downstream calls, and a metric filter produces metrics, not traces of those calls.
references:
  - title: Enable your applications on Lambda - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Application-Signals-Enable-LambdaMain.html
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation - AWS X-Ray
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
