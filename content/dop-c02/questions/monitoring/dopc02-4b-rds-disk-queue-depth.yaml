id: dopc02-4b-rds-disk-queue-depth
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A reporting application uses an Amazon RDS for PostgreSQL DB instance. Users report slow reports every morning when batch imports run. CPUUtilization stays below 40%, FreeableMemory is stable, and DatabaseConnections is far below the limit. A DevOps engineer suspects that the storage cannot serve the I/O requests fast enough and wants an alarm on the CloudWatch metric that shows how many I/O requests are waiting to access the disk. Which metric should the engineer use?
body:
  options:
    - id: a
      text:
        en: |-
          DiskQueueDepth
    - id: b
      text:
        en: |-
          ReadIOPS
    - id: c
      text:
        en: |-
          FreeStorageSpace
    - id: d
      text:
        en: |-
          ReplicaLag
answer: { optionId: a }
explanation:
  correct:
    en: |-
      DiskQueueDepth is the number of outstanding read and write I/O requests waiting to access the disk. A sustained high value, together with rising ReadLatency and WriteLatency, shows that the storage cannot keep up with the workload.
  options:
    b:
      en: |-
        ReadIOPS shows how many read operations complete per second; it does not show how many requests are waiting.
    c:
      en: |-
        FreeStorageSpace measures the available storage capacity, not the I/O performance of the storage.
    d:
      en: |-
        ReplicaLag measures how far a read replica lags behind its source; it does not count the I/O requests waiting for the instance's storage.
references:
  - title: Amazon CloudWatch metrics for Amazon RDS - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-metrics.html
