id: dopc02-4b-kms-key-lifecycle-facts
objective: "4.1.13"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company associated a customer managed AWS KMS key with an Amazon CloudWatch Logs log group six months ago. The security team now plans two changes: disassociate the key from the log group, and later disable the key as part of a key cleanup. Before approving the changes, the change advisory board asks a DevOps engineer how CloudWatch Logs will behave. Which statements are correct? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          After the key is disassociated, the log data that was ingested while the key was associated stays encrypted with that key.
    - id: b
      text:
        en: |-
          After the key is disassociated, CloudWatch Logs re-encrypts all the stored log data of the group with its default encryption.
    - id: c
      text:
        en: |-
          After the key is disabled, CloudWatch Logs can no longer read the log data that was encrypted with that key.
    - id: d
      text:
        en: |-
          After the key is disabled, CloudWatch Logs keeps a cached data key, so the encrypted log data stays readable until its retention period ends.
    - id: e
      text:
        en: |-
          Disassociating the key also deletes the log data that was encrypted with it, so the data must be exported to Amazon S3 first.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      When a key is disassociated, new data uses the default CloudWatch Logs encryption, while the data ingested earlier remains encrypted with the KMS key. CloudWatch Logs needs the key whenever that data is requested, so if the key is later disabled, revoked, or deleted, the data encrypted with it can no longer be read.
  options:
    b:
      en: |-
        Disassociation changes only the encryption of newly ingested data; existing data is not re-encrypted.
    d:
      en: |-
        CloudWatch Logs must be able to use the key whenever encrypted data is requested; a disabled key makes that data unreadable.
    e:
      en: |-
        Disassociation does not delete any data; the existing data simply stays encrypted with the key.
references:
  - title: Encrypt log data in CloudWatch Logs using AWS Key Management Service - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/encrypt-log-data-kms.html
