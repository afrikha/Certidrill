id: dopc02-4c-config-remediation-assume-role
objective: "4.3.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses the access-keys-rotated AWS Config managed rule. The DevOps team wrote a Systems Manager Automation runbook that deactivates the access keys of an IAM user, and configured it as an automatic remediation action for the rule, with the IAM user as the resource ID parameter. The runbook works when an administrator starts it from the console. When AWS Config runs it automatically, the describe-remediation-execution-status command shows failed executions with access denied errors. The AutomationAssumeRole parameter of the runbook isn't set in the remediation configuration.

    Which solution will fix the issue while following the principle of least privilege?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a policy that allows the IAM actions of the runbook to the AWSServiceRoleForConfig service-linked role that AWS Config uses.
    - id: b
      text:
        en: |-
          Increase the maximum automatic attempts of the remediation to 25 so that the remediation succeeds once the permissions propagate.
    - id: c
      text:
        en: |-
          Create an IAM role that trusts ssm.amazonaws.com and allows only the actions that the runbook needs, and pass its ARN as the static AutomationAssumeRole value.
    - id: d
      text:
        en: |-
          Create an IAM role that trusts config.amazonaws.com and allows only the actions that the runbook needs, and pass its ARN as the static AutomationAssumeRole value.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When AutomationAssumeRole isn't set, the runbook runs with the permissions of whoever starts it, which works for an administrator but not when AWS Config starts it. Systems Manager Automation assumes the role passed in AutomationAssumeRole, so the role must trust ssm.amazonaws.com and contain only the permissions the runbook needs. The remediation passes it as a static parameter value, next to the resource ID parameter.
  options:
    a:
      en: |-
        Service-linked role permissions are defined by AWS and can't be extended this way, and this would grant IAM write access to AWS Config itself.
    b:
      en: |-
        Retries repeat the same call with the same missing permissions, so every attempt fails.
    d:
      en: |-
        Automation, not AWS Config, assumes this role, so a role that trusts only config.amazonaws.com can't be assumed by the runbook.
references:
  - title: "Setting Up Auto Remediation for AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
  - title: "AWS-DisablePublicAccessForSecurityGroup - AWS Systems Manager Automation Runbook Reference"
    url: https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-aws-disablepublicaccessforsecuritygroup.html
