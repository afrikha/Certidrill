id: dopc02-4a-essentials-log-class
objective: "4.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's application writes verbose DEBUG logs (about 4 TB per month) and ERROR logs to two CloudWatch Logs log groups in the Standard log class. Engineers query the DEBUG logs only ad hoc with CloudWatch Logs Insights during investigations, while the ERROR log group feeds a metric filter and a subscription filter. The company wants to lower the cost of the DEBUG logs as much as possible while keeping Logs Insights queries and a 30-day retention. The ERROR log group must keep working as it does today.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the log class of the existing DEBUG log group from Standard to Essentials, and keep its 30-day retention policy.
    - id: b
      text:
        en: |-
          Change the log class of both log groups to Essentials, and keep a 30-day retention policy on each of them.
    - id: c
      text:
        en: |-
          Keep the DEBUG log group in the Standard log class, and export its events every day to Amazon S3 with a 1-day retention policy on the log group.
    - id: d
      text:
        en: |-
          Create a new log group in the Essentials log class with a 30-day retention for the DEBUG logs, and send the DEBUG logs to it instead of the existing log group.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Essentials log class (formerly Infrequent Access) has a lower ingestion price than Standard and still supports Logs Insights queries, retention, and KMS encryption. The log class cannot be changed after a log group is created, so a new Essentials log group must receive the DEBUG logs, while the ERROR group stays in Standard.
  options:
    a:
      en: |-
        The log class of an existing log group cannot be changed; a new log group must be created in the Essentials class.
    b:
      en: |-
        The log class cannot be changed, and Essentials does not support metric filters or subscription filters, which the ERROR log group needs.
    c:
      en: |-
        The DEBUG logs would still be ingested at the Standard price, which is the main cost, and Logs Insights cannot query data that was exported to S3 and expired from the log group.
references:
  - title: Log classes - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatch_Logs_Log_Classes.html
