id: dopc02-4c-opensearch-ingestion-s3-logs
objective: "4.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores Application Load Balancer access log files in an Amazon S3 bucket. The security team wants every new log file parsed and indexed into an existing Amazon OpenSearch Service domain within a few minutes of its arrival, so that analysts can search and visualize requests. The company doesn't want to write or maintain any code for parsing or delivery.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure an S3 event notification for new objects under the access log prefix that sends a message to an Amazon SQS standard queue.
    - id: b
      text:
        en: |-
          Configure an S3 event notification for new objects that invokes an AWS Lambda function, which parses each file and sends the records to the domain with bulk requests.
    - id: c
      text:
        en: |-
          Create an Amazon Data Firehose stream that uses the S3 bucket as its source and the OpenSearch Service domain as its destination.
    - id: d
      text:
        en: |-
          Create an Amazon OpenSearch Ingestion pipeline with an S3 source that reads the SQS queue, a grok processor that parses each line, and the domain as its sink.
    - id: e
      text:
        en: |-
          Create an Amazon OpenSearch Ingestion pipeline with a recurring scheduled scan of the bucket once each day and the domain as its sink.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      For near real-time ingestion, OpenSearch Ingestion uses S3-SQS processing: the bucket sends event notifications to an SQS queue, and the pipeline reads the queue and pulls each referenced object. Processors such as grok parse each line, and the sink writes to the OpenSearch Service domain, so no parsing or delivery code is needed.
  options:
    b:
      en: |-
        The Lambda function is custom parsing and delivery code that the company would have to write and maintain.
    c:
      en: |-
        Firehose doesn't read objects from an S3 bucket as a source; S3 is one of its destinations.
    e:
      en: |-
        A daily scheduled scan is meant for batch processing, so new files would wait up to a day instead of a few minutes.
references:
  - title: "Using an OpenSearch Ingestion pipeline with Amazon S3 - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/configure-client-s3.html
