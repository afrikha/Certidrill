id: dopc02-4b-inspector-hybrid-scan-mode
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company activated Amazon Inspector two years ago and set the Amazon EC2 scan mode of its account to agent-based scanning. Most instances are managed by AWS Systems Manager. The company also runs EBS-backed instances from a vendor appliance AMI, and the vendor's support contract forbids installing any agent on them, including SSM Agent. These instances appear in Amazon Inspector without vulnerability findings because they are not scanned. The security team wants all instances scanned with the LEAST operational overhead and without changing the vendor instances. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon Inspector Classic assessment template that targets the vendor instances by tag, and schedule a weekly assessment run with Amazon EventBridge.
    - id: b
      text:
        en: |-
          Change the account's Amazon EC2 scan mode from agent-based scanning to hybrid scanning.
    - id: c
      text:
        en: |-
          Create a Systems Manager State Manager association that installs SSM Agent on the vendor instances, and attach the AmazonSSMManagedInstanceCore policy to their instance profile.
    - id: d
      text:
        en: |-
          Schedule a weekly AWS Lambda function that creates EBS snapshots of the vendor instances and calls Amazon Inspector to scan the snapshots.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In hybrid scan mode, Amazon Inspector uses agent-based scanning for instances that are managed by Systems Manager and agentless scanning for eligible EBS-backed instances that are not. Agentless scanning collects the software inventory from EBS snapshots that Amazon Inspector creates and deletes itself, so the vendor instances are scanned without installing anything.
  options:
    a:
      en: |-
        Assessment templates are a feature of Amazon Inspector Classic, which was shut down in May 2026, and Classic host assessments required their own agent on the instances.
    c:
      en: |-
        Installing SSM Agent on the vendor instances breaks the support contract, which forbids any agent.
    d:
      en: |-
        Amazon Inspector already handles snapshot-based scanning in hybrid mode; a custom snapshot pipeline adds code and cost for no benefit.
references:
  - title: Scanning Amazon EC2 instances with Amazon Inspector - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-ec2.html
