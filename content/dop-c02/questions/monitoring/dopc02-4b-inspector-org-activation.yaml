id: dopc02-4b-inspector-org-activation
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 80 accounts in an organization in AWS Organizations and runs workloads in us-east-1 and eu-central-1. The security team wants continuous vulnerability scanning of Amazon EC2 instances, Amazon ECR images, and AWS Lambda functions in every account, including accounts created in the future. All findings must be managed from a dedicated security tooling account. The team wants the LEAST operational overhead. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          From the management account, designate the security tooling account as the Amazon Inspector delegated administrator. In each of the two Regions, activate scanning for all member accounts and turn on automatic activation for new member accounts.
    - id: b
      text:
        en: |-
          In each account, create Amazon Inspector Classic assessment targets and assessment templates with the common rules packages, and schedule assessment runs that publish findings to an Amazon SNS topic in the security tooling account.
    - id: c
      text:
        en: |-
          From the management account, designate the security tooling account as the Amazon Inspector delegated administrator in us-east-1 only. Activate scanning for all member accounts there, and turn on automatic activation for new member accounts.
    - id: d
      text:
        en: |-
          Use AWS CloudFormation StackSets to activate Amazon Inspector in every account and Region, and send the findings of each account to the security tooling account with Amazon EventBridge rules.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Only the management account can designate the Amazon Inspector delegated administrator, which can then activate EC2, ECR, and Lambda scanning for member accounts and manage their findings. Amazon Inspector is a Regional service, so activation for existing members and the setting that automatically activates new member accounts must be done in each Region that the company uses.
  options:
    b:
      en: |-
        Assessment templates belong to Amazon Inspector Classic, which was shut down in May 2026, and they never scanned ECR images or Lambda functions.
    c:
      en: |-
        Amazon Inspector is Regional, so configuring only us-east-1 leaves the workloads in eu-central-1 unscanned.
    d:
      en: |-
        StackSets and per-account EventBridge forwarding add resources to build and maintain, while the delegated administrator gives central findings management natively.
references:
  - title: Designating a delegated administrator account for Amazon Inspector - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/designating-admin.html
  - title: Activating Amazon Inspector scans for member accounts - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/adding-member-accounts.html
