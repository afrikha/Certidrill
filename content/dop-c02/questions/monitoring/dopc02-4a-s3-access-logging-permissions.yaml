id: dopc02-4a-s3-access-logging-permissions
objective: "4.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company must enable S3 server access logging for a data bucket in account 111122223333 in eu-west-1 by using an AWS CloudFormation template. All buckets in the company use the Bucket owner enforced setting for S3 Object Ownership, so ACLs are disabled. The access logs must go to a dedicated logging bucket and must be encrypted at rest. The security team wants log delivery to be allowed only for the data bucket and only from this account.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create the logging bucket in the company's log archive account in eu-west-1, with default encryption set to SSE-KMS and a customer managed key.
    - id: b
      text:
        en: |-
          Grant the WRITE and READ_ACP permissions to the S3 Log Delivery group in the ACL of the logging bucket.
    - id: c
      text:
        en: |-
          Create the logging bucket in account 111122223333 in eu-west-1, with default encryption set to SSE-S3.
    - id: d
      text:
        en: |-
          Enable S3 Object Lock with a default retention period on the logging bucket, and grant logging.s3.amazonaws.com the s3:PutObjectRetention permission.
    - id: e
      text:
        en: |-
          Add a bucket policy to the logging bucket that allows logging.s3.amazonaws.com to call s3:PutObject, with aws:SourceArn set to the data bucket and aws:SourceAccount set to 111122223333.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      Server access logs must go to a bucket in the same account and Region as the source bucket, and that bucket must use SSE-S3, which still encrypts the logs at rest. With ACLs disabled, permission is granted through a bucket policy for the logging.s3.amazonaws.com service principal, scoped with aws:SourceArn and aws:SourceAccount.
  options:
    a:
      en: |-
        The destination bucket must be in the same account as the source bucket, and SSE-KMS default encryption is not supported for server access log delivery.
    b:
      en: |-
        With Bucket owner enforced, ACLs are disabled, so the Log Delivery group grant cannot be set; a bucket policy is required.
    d:
      en: |-
        A bucket with Object Lock enabled, or with a default retention period, cannot be a destination for server access logs.
references:
  - title: Enabling Amazon S3 server access logging - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/enable-server-access-logging.html
