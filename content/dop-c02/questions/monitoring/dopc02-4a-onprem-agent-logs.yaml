id: dopc02-4a-onprem-agent-logs
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company runs 200 Linux application servers in its own data center. The servers reach the public AWS endpoints through an HTTPS proxy and are not registered with AWS Systems Manager. The operations team wants the application log files from these servers in CloudWatch Logs within seconds of being written, next to the logs of its AWS workloads. The security team allows a dedicated IAM user whose permissions are limited to sending logs and metrics, and forbids any permission to change agent configuration in Parameter Store.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Install the Amazon Kinesis Agent on each server, and configure it to send the log files directly to the CloudWatch Logs log groups.
    - id: b
      text:
        en: |-
          Schedule a cron job on each server that uploads new log lines to Amazon S3 every minute, and use S3 event notifications to invoke a Lambda function that writes them to CloudWatch Logs.
    - id: c
      text:
        en: |-
          Install the CloudWatch agent on each server, store the IAM user's keys in the AmazonCloudWatchAgent profile of the shared credentials file, and set the proxy in common-config.toml.
    - id: d
      text:
        en: |-
          Install the CloudWatch agent on each server with the proxy set in common-config.toml, and attach an IAM instance profile with the CloudWatchAgentServerPolicy policy to the servers.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      For on-premises servers, the CloudWatch agent reads credentials from a named profile, AmazonCloudWatchAgent by default, in the shared credentials file, and common-config.toml sets the credentials file and the HTTPS proxy. AWS recommends an IAM user without permission to write to Parameter Store, and the agent streams log files to CloudWatch Logs continuously.
  options:
    a:
      en: |-
        The Kinesis Agent sends data to Kinesis Data Streams or Amazon Data Firehose, not directly to CloudWatch Logs log groups.
    b:
      en: |-
        Batching uploads every minute through S3 and Lambda adds delay and custom code, so logs would not arrive within seconds.
    d:
      en: |-
        Instance profiles exist only for Amazon EC2 instances; servers in a data center cannot use one, so the agent would have no credentials.
references:
  - title: Install the CloudWatch agent on on-premises servers - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/install-CloudWatch-Agent-on-premise.html
