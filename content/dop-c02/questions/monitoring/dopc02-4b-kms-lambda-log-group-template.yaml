id: dopc02-4b-kms-lambda-log-group-template
objective: "4.1.13"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys its AWS Lambda functions with AWS CloudFormation templates in a CI/CD pipeline. Today, Lambda creates each function's log group automatically at the first invocation, and the log groups use the default CloudWatch Logs encryption. A new policy requires that every log event of every function, starting with the very first invocation, be encrypted with a customer managed AWS KMS key. The key policy already allows the CloudWatch Logs service principal for the account's log groups. The company wants the LEAST operational overhead. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the KmsKeyArn property of each AWS::Lambda::Function resource to the customer managed key, so that Lambda encrypts the function's logs before it sends them to CloudWatch Logs.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule that matches CreateLogGroup events from AWS CloudTrail and invokes a function that runs associate-kms-key on every new /aws/lambda log group.
    - id: c
      text:
        en: |-
          Declare an AWS::Logs::LogGroup resource with the KmsKeyId property in each template, and configure each function to send its logs to that log group.
    - id: d
      text:
        en: |-
          Deploy the cloudwatch-log-group-encrypted AWS Config managed rule with an automatic remediation that associates the key with every noncompliant log group.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A log group created with a KMS key encrypts all the data ingested into it, so declaring the log group with KmsKeyId in the same template, before the function writes to it, covers the first invocation. The pipeline creates the log group with the function, so no extra process has to run after deployments.
  options:
    a:
      en: |-
        A function's KmsKeyArn encrypts its environment variables (and related function resources), not the log events that CloudWatch Logs stores.
    b:
      en: |-
        The association takes effect after the log group already exists and can take minutes, so the first log events are stored with the default encryption, and the custom automation adds overhead.
    d:
      en: |-
        This periodic rule detects and remediates only after the log group exists, so the first events are not encrypted with the key, and the remediation runbook must be built and maintained.
references:
  - title: Encrypt log data in CloudWatch Logs using AWS Key Management Service - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/encrypt-log-data-kms.html
