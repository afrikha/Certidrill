id: dopc02-4c-dynamodb-gsi-autoscaling
objective: "4.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application writes to an Amazon DynamoDB table in provisioned capacity mode. Auto scaling is configured on the table's write capacity with a 70 percent target utilization. The company has purchased reserved capacity, so the table must stay in provisioned mode. Last week, the team added a global secondary index (GSI) to the existing table. Since then, writes are throttled during the daily peak, although the table's consumed write capacity stays well below its provisioned write capacity, and the WriteThrottleEvents metric of the GSI is high during these periods. The company wants writes to succeed during peaks without manual capacity changes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Register the GSI's write capacity as an Application Auto Scaling scalable target, and attach a target tracking policy to the index.
    - id: b
      text:
        en: |-
          Raise the maximum write capacity of the table's auto scaling policy, and lower the target utilization of the table's policy to 50 percent.
    - id: c
      text:
        en: |-
          Add a DynamoDB Accelerator (DAX) cluster in front of the table, and send the application's write requests through the DAX cluster.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on the GSI's WriteThrottleEvents metric that notifies the team to increase the index's write capacity during peaks.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Every GSI has its own provisioned throughput, separate from the base table, and auto scaling isn't turned on for a GSI that is created on an existing table. AWS recommends applying auto scaling to the indexes as well as the table to avoid throttling. A scalable target and a target tracking policy on the index's write capacity let it follow the peak.
  options:
    b:
      en: |-
        The table's own write capacity isn't the bottleneck; the throttling comes from the GSI, whose capacity this change doesn't affect.
    c:
      en: |-
        Writes through DAX still go to the table and its index, so the index's provisioned write capacity would still be too low.
    d:
      en: |-
        This keeps a manual step during every peak, which the company wants to remove.
references:
  - title: "Managing throughput capacity automatically with DynamoDB auto scaling - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/AutoScaling.html
