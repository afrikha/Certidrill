id: dopc02-4b-config-guard-custom-policy
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's platform team has an internal standard for Amazon DynamoDB tables: every table must use on-demand capacity mode and must have deletion protection enabled, and the check must run whenever a table configuration changes. No single AWS Config managed rule covers this combination. The platform team has no developers and does not want to write, package, or maintain AWS Lambda functions. AWS Config is already recording DynamoDB tables. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Config custom policy rule written in AWS CloudFormation Guard, triggered by configuration changes to AWS::DynamoDB::Table resources.
    - id: b
      text:
        en: |-
          Create an AWS Config custom Lambda rule from a blueprint function, triggered by configuration changes to AWS::DynamoDB::Table resources.
    - id: c
      text:
        en: |-
          Add a cfn-guard validation step to the CI/CD pipeline that checks the CloudFormation templates of the DynamoDB tables before deployment.
    - id: d
      text:
        en: |-
          Create an AWS Config aggregator for the account and filter its resource inventory on AWS::DynamoDB::Table to review the table settings.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS Config custom policy rules are written in Guard, a policy-as-code language, and let you create custom rules without developing Lambda functions. They are initiated by configuration changes and evaluate the recorded configuration items of the DynamoDB tables.
  options:
    b:
      en: |-
        A custom Lambda rule requires a function whose code the team must own and maintain, even when it starts from a blueprint.
    c:
      en: |-
        A pipeline check only covers templates at deployment time; changes made later in the console or with the API are never evaluated.
    d:
      en: |-
        An aggregator only collects configuration and compliance data; it does not evaluate resources against a rule.
references:
  - title: AWS Config Custom Rules - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config_develop-rules.html
