id: dopc02-4a-firelens-split-destinations
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company runs a booking service as Amazon ECS tasks on AWS Fargate (Linux). The containers write JSON log lines to stdout, and the task definition uses the awslogs log driver. A data team needs every log line delivered continuously to Amazon S3 through Amazon Data Firehose for analytics. The operations team needs only events with level ERROR in CloudWatch Logs, and the company wants to reduce CloudWatch Logs ingestion charges. The application code must not change.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the awslogs log driver, and add a subscription filter to the log group that sends all events to the Firehose stream.
    - id: b
      text:
        en: |-
          Add an AWS for Fluent Bit log router container with FireLens, route all events to the Firehose stream and only ERROR events to CloudWatch Logs, and give the task role the needed permissions.
    - id: c
      text:
        en: |-
          Keep the awslogs log driver, and add a second log configuration to the container definition that sends the same output to the Firehose stream.
    - id: d
      text:
        en: |-
          Keep the awslogs log driver, and create a daily CloudWatch Logs export task to Amazon S3, with a 1-day retention policy on the log group.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      FireLens adds a Fluent Bit or Fluentd log router to the task that can send container logs to several AWS destinations with filtering, on Fargate and EC2 Linux. Only ERROR events are ingested into CloudWatch Logs, all events go to Firehose, and the task role grants permissions such as firehose:PutRecordBatch and the CloudWatch Logs write actions.
  options:
    a:
      en: |-
        All events would still be ingested into CloudWatch Logs before the subscription forwards them, so ingestion charges would not decrease.
    c:
      en: |-
        A container definition has a single log configuration with one log driver; it cannot send the same output through a second driver.
    d:
      en: |-
        All events would still be ingested into CloudWatch Logs, and a daily export is a batch job, not continuous delivery through Firehose.
references:
  - title: Send Amazon ECS logs to an AWS service or AWS Partner - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/using_firelens.html
