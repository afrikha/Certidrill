id: dopc02-4a-cloudtrail-integrity-validation
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company delivers the log files of a multi-Region CloudTrail trail to an S3 bucket in a dedicated log archive account. External auditors ask the company to prove, for any period they choose from now on, that no CloudTrail log file was modified or deleted after CloudTrail delivered it, and that no log file is missing from the period. The company wants a mechanism that AWS provides and does not want to build custom hashing tools.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable S3 Versioning and MFA Delete on the log bucket, and give the auditors an S3 Inventory report of all object versions for the period.
    - id: b
      text:
        en: |-
          Enable Amazon Macie on the log bucket, and give the auditors the Macie findings that report changes to the log files during the period.
    - id: c
      text:
        en: |-
          Deploy the cloudtrail-enabled AWS Config managed rule in every Region, and give the auditors the rule's compliance timeline for the period.
    - id: d
      text:
        en: |-
          Enable log file integrity validation on the trail, and run the aws cloudtrail validate-logs command with the trail ARN and the period that the auditors choose.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With log file integrity validation, CloudTrail delivers hourly digest files that contain SHA-256 hashes of the log files and are signed with RSA, each digest chaining to the previous one. Validating the files for a period reports any log file that was modified or deleted, and can confirm that no log files were delivered in a period, for files delivered after validation was enabled.
  options:
    a:
      en: |-
        Versioning and MFA Delete make deletion harder, but an inventory of versions does not prove that a file's content matches what CloudTrail delivered.
    b:
      en: |-
        Macie discovers sensitive data and reports on bucket security; it does not verify the integrity of CloudTrail log files.
    c:
      en: |-
        The cloudtrail-enabled rule shows whether a trail exists and logs; it says nothing about whether delivered files were changed or deleted.
references:
  - title: Validating CloudTrail log file integrity - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
