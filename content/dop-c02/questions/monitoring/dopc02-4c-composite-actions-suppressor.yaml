id: dopc02-4c-composite-actions-suppressor
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys a web application several times a week. During each deployment and for up to 10 minutes after it ends, the HighLatency and High5XX metric alarms often go into ALARM briefly and page the on-call engineer through an Amazon SNS topic. The pipeline already publishes a custom metric that keeps a metric alarm named DeploymentInProgress in the ALARM state while a deployment runs. The company wants no pages during a deployment or in the 10 minutes after it ends. If latency or errors are still in ALARM after those 10 minutes, the on-call engineer must be paged. The team must not add steps to the pipeline.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a composite alarm with the rule (ALARM(HighLatency) OR ALARM(High5XX)) AND NOT ALARM(DeploymentInProgress), move the SNS action to it, and remove the actions of the two alarms.
    - id: b
      text:
        en: |-
          Increase the evaluation periods of the HighLatency and High5XX alarms so that each alarm needs more than 10 minutes of breaching data points before it goes into ALARM.
    - id: c
      text:
        en: |-
          Add a Lambda action to the DeploymentInProgress alarm that disables the actions of the two alarms, and enables them again 10 minutes after DeploymentInProgress returns to OK.
    - id: d
      text:
        en: |-
          Create a composite alarm with the rule ALARM(HighLatency) OR ALARM(High5XX), DeploymentInProgress as its actions suppressor, and a 600-second extension period, and move the SNS action to it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A composite alarm can name an actions suppressor alarm: its actions are suppressed while the suppressor is in ALARM, and the extension period sets how long it keeps waiting after the suppressor leaves ALARM before it performs its actions. With a 600-second extension period, problems that persist 10 minutes after the deployment page the engineer. The SNS action must live only on the composite alarm so that the underlying alarms don't page directly.
  options:
    a:
      en: |-
        As soon as DeploymentInProgress returns to OK, the rule becomes true if latency is still in ALARM, so the engineer is paged immediately instead of after 10 minutes.
    b:
      en: |-
        Longer evaluation periods delay every page, including real incidents outside deployments, and they don't follow the deployment schedule.
    c:
      en: |-
        Alarms act only on state changes, so an alarm that is still in ALARM when its actions are enabled again doesn't page; this design also needs custom timer code.
references:
  - title: "PutCompositeAlarm - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutCompositeAlarm.html
  - title: "Using Amazon CloudWatch alarms - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Alarms.html
