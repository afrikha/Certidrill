id: dopc02-4c-alarm-m-of-n
objective: "4.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company publishes a custom Amazon CloudWatch metric named QueueLatency every minute. An alarm on this metric uses a 1-minute period, 3 evaluation periods, and 3 data points to alarm. The alarm misses incidents in which latency breaches the threshold in most minutes but drops below it for one minute in between. The team wants the alarm to go into ALARM when at least 3 of the last 5 one-minute data points breach the threshold.

    How should the team configure the alarm?
body:
  options:
    - id: a
      text:
        en: |-
          A period of 1 minute, 3 evaluation periods, and 5 data points to alarm.
    - id: b
      text:
        en: |-
          A period of 5 minutes, 1 evaluation period, and 1 data point to alarm.
    - id: c
      text:
        en: |-
          A period of 1 minute, 5 evaluation periods, and 3 data points to alarm.
    - id: d
      text:
        en: |-
          A period of 1 minute, 5 evaluation periods, and 5 data points to alarm.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Evaluation periods (N) is the number of most recent data points evaluated, and data points to alarm (M) is how many of them must breach; the breaching points don't need to be consecutive. An "M out of N" alarm of 3 out of 5 with a 1-minute period evaluates the last 5 minutes and alarms when any 3 of those data points breach.
  options:
    a:
      en: |-
        Data points to alarm must be within the evaluation periods, so 5 data points out of 3 periods isn't a valid M out of N configuration.
    b:
      en: |-
        A 5-minute period aggregates the five minutes into one data point, so the alarm no longer counts how many individual minutes breached.
    d:
      en: |-
        5 out of 5 requires every minute to breach, so the alarm would still miss incidents with a minute below the threshold.
references:
  - title: "Alarm evaluation - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-evaluation.html
