id: dopc02-4b-filter-space-delimited
objective: "4.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A web server on Amazon EC2 sends its access log to Amazon CloudWatch Logs. Each line is space-delimited with seven fields in this order: client IP address, identity, user name, timestamp in brackets, request in quotes, HTTP status code, and response size. A DevOps engineer must create a metric filter that counts only the requests that returned an HTTP status code in the 5xx range. Which filter pattern should the engineer use?
body:
  options:
    - id: a
      text:
        en: |-
          [ip, identity, user, timestamp, request, status_code = 5*, bytes]
    - id: b
      text:
        en: |-
          { $.status_code = 5* }
    - id: c
      text:
        en: |-
          ?500 ?502 ?503 ?504
    - id: d
      text:
        en: |-
          [ip, identity, user, timestamp, request, status_code, bytes = 5*]
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Space-delimited log events are matched with a bracketed list that names every field in order, and a condition can be set on any named field. status_code = 5* matches the status codes that start with 5 in the sixth field only.
  options:
    b:
      en: |-
        The $.property selector syntax applies to JSON log events. These lines are space-delimited text, not JSON.
    c:
      en: |-
        Optional terms match those numbers anywhere in the line, for example in the response size or the timestamp, and they miss other 5xx codes.
    d:
      en: |-
        The condition is on the seventh field, the response size, so the filter counts responses whose size starts with 5 instead of 5xx status codes.
references:
  - title: Filter pattern syntax for metric filters, subscription filters, filter log events, and Live Tail - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/FilterAndPatternSyntax.html
