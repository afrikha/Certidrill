id: dopc02-4b-subs-lambda-setup
objective: "4.1.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A DevOps engineer wants to process the log events of an Amazon CloudWatch Logs log group in near real time with an AWS Lambda function in the same account. The function will extract fields from each log event and write them to an Amazon DynamoDB table. The engineer creates a subscription filter on the log group with the function ARN as the destination. During testing, the subscription filter cannot be created, and once that is fixed, the function cannot read the log events from the incoming event. Which combination of steps will resolve these issues? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a statement to the function's resource-based policy that allows the logs.amazonaws.com principal to call lambda:InvokeFunction, with the log group ARN as the source ARN.
    - id: b
      text:
        en: |-
          Create an IAM role that trusts logs.amazonaws.com and allows lambda:InvokeFunction, and pass its ARN as the role ARN of the subscription filter.
    - id: c
      text:
        en: |-
          Update the function code to base64-decode the awslogs.data field and decompress the gzip payload before it reads the logEvents array.
    - id: d
      text:
        en: |-
          Add logs:GetLogEvents and logs:FilterLogEvents to the function's execution role so that the function can read the events that the subscription refers to.
    - id: e
      text:
        en: |-
          Update the function code to read the logEvents array directly from the event, and set the subscription filter's distribution to Random.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      For a Lambda destination, CloudWatch Logs needs permission in the function's resource-based policy (lambda add-permission with the logs.amazonaws.com principal and the log group ARN as source). CloudWatch Logs delivers the log events gzip-compressed and Lambda receives them base64-encoded in awslogs.data, so the code must decode and decompress the payload to get the logEvents.
  options:
    b:
      en: |-
        A role ARN is used for Kinesis Data Streams and Firehose destinations. For a Lambda destination, access comes from the function's resource-based policy.
    d:
      en: |-
        The subscription pushes the log events to the function in the invocation payload; the function does not call CloudWatch Logs APIs to read them.
    e:
      en: |-
        The logEvents array is inside the compressed, encoded payload, not at the top of the event. The distribution setting applies only to Kinesis data stream destinations.
references:
  - title: Log group-level subscription filters - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/SubscriptionFilters.html
  - title: Real-time processing of log data with subscriptions - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Subscriptions.html
