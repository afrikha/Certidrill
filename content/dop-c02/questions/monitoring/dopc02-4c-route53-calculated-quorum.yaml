id: dopc02-4c-route53-calculated-quorum
objective: "4.3.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company serves its application from a primary Region and uses Amazon Route 53 failover records to send users to a standby Region. The primary Region exposes three public endpoints: the web front end, the API, and the authentication service. Each endpoint is monitored by its own Route 53 endpoint health check. A single failed component is handled by graceful degradation, so the company wants to fail over only when at least two of the three endpoints are unhealthy.

    Which configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a calculated health check that monitors the three health checks and reports healthy when at least 2 of the 3 are healthy, and associate it with the primary failover record.
    - id: b
      text:
        en: |-
          Create a calculated health check that monitors the three health checks and reports healthy only when all of them are healthy, and associate it with the primary failover record.
    - id: c
      text:
        en: |-
          Create a calculated health check that monitors the three health checks and reports healthy when one or more of them is healthy, and associate it with the primary failover record.
    - id: d
      text:
        en: |-
          Associate the three endpoint health checks directly with the primary failover record so that Route 53 fails over when two of them report unhealthy.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A calculated health check monitors child health checks and reports healthy when at least x of y selected children are healthy. With 2 of 3, one failed endpoint leaves two healthy children, so there is no failover; two failed endpoints leave one, so the parent becomes unhealthy and Route 53 answers with the standby record.
  options:
    b:
      en: |-
        The AND option makes the parent unhealthy as soon as one endpoint fails, so a single failed component would cause a failover.
    c:
      en: |-
        The OR option keeps the parent healthy while any endpoint is healthy, so the company would fail over only when all three fail.
    d:
      en: |-
        A Route 53 record is associated with a single health check; combining several checks requires a calculated health check.
references:
  - title: "Values that you specify when you create or update health checks - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-creating-values.html
  - title: "How Amazon Route 53 determines whether a health check is healthy - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-determining-health-of-endpoints.html
