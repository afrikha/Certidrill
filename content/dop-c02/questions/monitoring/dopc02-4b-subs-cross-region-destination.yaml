id: dopc02-4b-subs-cross-region-destination
objective: "4.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations. Its workload accounts run applications that write to Amazon CloudWatch Logs log groups in us-east-1 and eu-west-1. A security account owns an Amazon Kinesis data stream in us-east-1 that a detection application reads. The security team must receive the application log events from every workload account in this stream in near real time. New workload accounts join the organization every month, and the security team must not have to change any resource in the security account when an account joins. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          In the security account, create one CloudWatch Logs destination in us-east-1 that targets the stream. Allow logs:PutSubscriptionFilter on it for the organization ID. In each workload account, create subscription filters in both Regions that point to that destination.
    - id: b
      text:
        en: |-
          In each workload account, create an IAM role that allows kinesis:PutRecord on the stream ARN. Create subscription filters in both Regions that use the stream ARN as the destination and pass that role.
    - id: c
      text:
        en: |-
          In the security account, create a CloudWatch Logs destination in us-east-1 and one in eu-west-1, both targeting the stream. Allow logs:PutSubscriptionFilter on them for the organization ID. In each workload account, subscribe log groups to the destination in their Region.
    - id: d
      text:
        en: |-
          In the security account, create a CloudWatch Logs destination in each Region that targets the stream. Add each workload account ID as a principal in the destination access policies. In each workload account, subscribe log groups to the destination in their Region.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Cross-account subscriptions go through a CloudWatch Logs destination that the receiving account owns. The log group and the destination must be in the same Region, but the stream behind the destination can be in another Region, so the security account needs one destination per source Region. An access policy with an aws:PrincipalOrgID condition lets every current and future account of the organization create subscription filters without further changes.
  options:
    a:
      en: |-
        A subscription filter must use a destination in the same Region as its log group, so the eu-west-1 log groups cannot subscribe to a destination in us-east-1.
    b:
      en: |-
        A subscription filter can target a Kinesis data stream directly only when the stream is in the same account. Cross-account delivery requires a logical destination created with PutDestination in the receiving account.
    d:
      en: |-
        Listing account IDs in the access policies works for existing accounts, but the security team would have to update both policies every time an account joins the organization.
references:
  - title: Cross-account cross-Region subscriptions - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CrossAccountSubscriptions.html
  - title: "Step 1: Create a destination - Amazon CloudWatch Logs"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CreateDestination.html
