id: dopc02-4c-eventbridge-pipeline-prefix
objective: "4.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has more than 200 pipelines in AWS CodePipeline. The names of production pipelines start with prod-, for example prod-payments and prod-search. The on-call team wants an Amazon SNS notification each time an execution of any production pipeline fails. There must be no notification for other pipelines or for other execution states, and new production pipelines must be covered without changes to the rule. All candidate patterns use the source aws.codepipeline and the detail type CodePipeline Pipeline Execution State Change.

    Which detail section should the Amazon EventBridge rule's event pattern use?
body:
  options:
    - id: a
      text:
        en: |-
          `"detail": {"state": ["FAILED"], "pipeline": ["prod-"]}`
    - id: b
      text:
        en: |-
          `"detail": {"state": ["FAILED"], "pipeline": [{"prefix": "prod-"}]}`
    - id: c
      text:
        en: |-
          `"detail": {"state": [{"anything-but": "SUCCEEDED"}], "pipeline": [{"prefix": "prod-"}]}`
    - id: d
      text:
        en: |-
          `"detail": {"state": ["FAILED"], "pipeline": [{"suffix": "prod-"}]}`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Values listed in an event pattern match exactly unless a comparison operator is used. The prefix operator matches every pipeline whose name starts with prod-, including future ones, and the FAILED state value keeps only failed executions.
  options:
    a:
      en: |-
        Without an operator, prod- is an exact value, so the rule matches only a pipeline named exactly prod-.
    c:
      en: |-
        anything-but SUCCEEDED also matches other states such as STARTED, so the team would be notified for every execution that starts.
    d:
      en: |-
        The suffix operator matches names that end with prod-, not names that start with it.
references:
  - title: "Comparison operators for use in event patterns in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-create-pattern-operators.html
