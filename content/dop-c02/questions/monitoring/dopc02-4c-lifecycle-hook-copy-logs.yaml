id: dopc02-4c-lifecycle-hook-copy-logs
objective: "4.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in an Auto Scaling group. The application writes audit logs to the instance's local disk, and a compliance rule requires every log file to be copied to Amazon S3. During scale-in events, instances are terminated before their latest logs are copied. Copying the logs takes up to 10 minutes. The instances are managed nodes in AWS Systems Manager, and the group must keep scaling in normally.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a launch lifecycle hook to the group so that each new instance waits in the Pending:Wait state until the logs of the previous instances are copied.
    - id: b
      text:
        en: |-
          Add a termination lifecycle hook to the group with a heartbeat timeout that is longer than the time needed to copy the logs.
    - id: c
      text:
        en: |-
          Turn on instance scale-in protection for all instances in the group so that scale-in events can't terminate instances before their logs are copied.
    - id: d
      text:
        en: |-
          Add a warm pool to the group with an instance reuse policy so that instances return to the pool on scale-in instead of being terminated.
    - id: e
      text:
        en: |-
          Create an EventBridge rule for the instance-terminate lifecycle action that invokes a Lambda function, which copies the logs through Run Command and completes the action.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A termination lifecycle hook pauses the instance in the Terminating:Wait state before it is terminated, for one hour by default, and EC2 Auto Scaling sends an event to Amazon EventBridge. While the instance waits, a Lambda function can copy the logs, here through Run Command on the managed node, and then call complete-lifecycle-action so that termination continues.
  options:
    a:
      en: |-
        A launch hook pauses new instances; it doesn't delay the termination of the instances whose logs must be copied.
    c:
      en: |-
        Scale-in protection stops the group from terminating protected instances, so the group could no longer scale in normally.
    d:
      en: |-
        Instances returned to a warm pool keep their logs on disk without copying them, and copies to S3 still require a trigger.
references:
  - title: "Amazon EC2 Auto Scaling lifecycle hooks - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html
