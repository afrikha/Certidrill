id: dopc02-4b-inspector-ecr-continuous
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's CI/CD pipeline builds container images and pushes them to Amazon ECR repositories that use basic scanning with scan on push. Some images stay in production for months. The security team discovered that a running image was vulnerable to a CVE that was published weeks after the image was pushed, and no finding was ever generated. The team requires that images still in use be re-evaluated automatically when new vulnerabilities are published, for both operating system and programming language packages. Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Keep basic scanning and create an Amazon EventBridge Scheduler schedule that calls StartImageScan every day for each image tag in the repositories.
    - id: b
      text:
        en: |-
          Create an Amazon Inspector Classic assessment template for the ECR repositories and schedule a daily assessment run.
    - id: c
      text:
        en: |-
          Add an Amazon CodeGuru Security scan of the container images to the pipeline, and run the pipeline again every week for the images in production.
    - id: d
      text:
        en: |-
          Activate Amazon Inspector scanning for Amazon ECR (enhanced scanning) and configure continuous scanning for the repositories.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With enhanced scanning, Amazon Inspector scans for operating system and programming language package vulnerabilities and, with continuous scanning, keeps monitoring images that are recently pushed or in use, generating new findings when relevant CVEs are added. Findings are produced automatically without any schedule to maintain.
  options:
    a:
      en: |-
        A custom daily schedule adds overhead, and basic scanning does not cover programming language packages the way Amazon Inspector enhanced scanning does.
    b:
      en: |-
        Assessment templates belong to Amazon Inspector Classic, which was shut down in May 2026 and never scanned ECR images.
    c:
      en: |-
        Amazon CodeGuru Security was discontinued in November 2025, and re-running pipelines every week is a manual workaround.
references:
  - title: Scanning Amazon Elastic Container Registry container images with Amazon Inspector - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-ecr.html
