id: dopc02-4b-composite-alarm-noise
objective: "4.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's web tier has two Amazon CloudWatch metric alarms: HighCPU on the Auto Scaling group's CPUUtilization and HighLatency on the Application Load Balancer's TargetResponseTime. Both alarms notify the on-call Amazon SNS topic. Nightly batch jobs often push CPU utilization high without affecting users, and the on-call engineers receive pages that require no action. The team must page only when both conditions are true at the same time, and the engineers must not receive a page from either alarm alone. Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a composite alarm with the rule ALARM("HighCPU") AND ALARM("HighLatency") that notifies the on-call SNS topic.
    - id: b
      text:
        en: |-
          Change HighCPU to require 5 out of 5 breaching data points so that short batch jobs no longer trigger it.
    - id: c
      text:
        en: |-
          Remove the SNS notification actions from the HighCPU and HighLatency alarms, and keep both alarms.
    - id: d
      text:
        en: |-
          Add an SNS subscription filter policy that drops every message about HighCPU before it reaches the on-call engineers.
    - id: e
      text:
        en: |-
          Create a composite alarm with the rule ALARM("HighCPU") OR ALARM("HighLatency") that notifies the on-call SNS topic.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      A composite alarm evaluates the states of the alarms it references, and the AND operator makes it go into ALARM only when both child alarms are in ALARM. The child alarms must remain to feed the rule, but without their own notification actions, so that only the composite alarm pages the engineers.
  options:
    b:
      en: |-
        A longer evaluation still pages for long batch jobs, and HighCPU keeps paging on its own even when latency is normal.
    d:
      en: |-
        Dropping all HighCPU messages also hides the case where CPU and latency are both high, and HighLatency still pages alone.
    e:
      en: |-
        With OR, the composite alarm pages when either condition is true, which is the current noisy behavior.
references:
  - title: Create a composite alarm - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Create_Composite_Alarm.html
