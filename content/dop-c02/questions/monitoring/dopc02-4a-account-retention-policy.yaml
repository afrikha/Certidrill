id: dopc02-4a-account-retention-policy
objective: "4.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's production account has about 900 CloudWatch Logs log groups. Some have no retention (Never expire), others have retention periods between 7 days and 10 years, and teams create new log groups every day through many different tools. A new data minimization policy requires that log events in every existing and future log group are kept for exactly 90 days, including log groups whose current retention is longer. The DevOps team wants the LEAST operational overhead and no custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the cw-loggroup-retention-period-check AWS Config managed rule with MinRetentionTime set to 90, and add an automatic remediation that sets the retention of noncompliant log groups to 90 days.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule that matches CreateLogGroup API calls from CloudTrail and invokes a Lambda function that sets a 90-day retention policy on the new log group.
    - id: c
      text:
        en: |-
          Create a CloudWatch Logs account-level retention policy with retentionInDays set to 90 and the RETROACTIVE enforcement mode, without selection criteria.
    - id: d
      text:
        en: |-
          Create a CloudWatch Logs account-level retention policy with retentionInDays set to 90 and the NEW_ONLY enforcement mode, without selection criteria.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An account-level retention policy sets the retention of all log groups in the account, or of a selected subset, and it overrides each log group's own setting, even a longer one. With the RETROACTIVE mode it also applies to log groups that existed before the policy; the policy takes effect 24 hours after it is created.
  options:
    a:
      en: |-
        The Config rule checks only a minimum retention, and it treats Never expire log groups as compliant, so groups with longer or unlimited retention would never be remediated.
    b:
      en: |-
        This is custom code that covers only new log groups; the existing groups with longer or unlimited retention keep their settings.
    d:
      en: |-
        With NEW_ONLY, log groups that existed before the policy keep their own retention, so the existing groups would not change to 90 days.
references:
  - title: put-account-policy — AWS CLI 2.42.1 Command Reference
    url: https://docs.aws.amazon.com/cli/latest/reference/logs/put-account-policy.html
  - title: cw-loggroup-retention-period-check - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/cw-loggroup-retention-period-check.html
