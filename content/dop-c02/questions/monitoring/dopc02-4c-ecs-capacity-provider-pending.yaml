id: dopc02-4c-ecs-capacity-provider-pending
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon ECS service on a cluster of Amazon EC2 container instances that belong to an Auto Scaling group with a fixed desired capacity of 6. The tasks must stay on EC2 instances because they depend on a licensed agent that is installed in the AMI. During peaks, Service Auto Scaling raises the desired task count, but the new tasks remain in the PENDING state because the instances have no free CPU or memory to reserve. The company wants instances to be added and removed automatically based on the tasks that need to be placed, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Auto Scaling group capacity provider with managed scaling, associate it with the cluster, and set it in the service's capacity provider strategy.
    - id: b
      text:
        en: |-
          Add a target tracking scaling policy to the Auto Scaling group that keeps the average CPU utilization of the group's instances at 60 percent.
    - id: c
      text:
        en: |-
          Increase the maximum task count of the Service Auto Scaling target, and add a scheduled action that raises the desired task count before each peak.
    - id: d
      text:
        en: |-
          Move the service to the AWS Fargate launch type, and add the FARGATE capacity provider to the cluster's default capacity provider strategy.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With managed scaling, Amazon ECS creates a target tracking policy on the Auto Scaling group driven by the CapacityProviderReservation metric (instances needed divided by instances running). Tasks that can't be placed raise the number of instances needed, so the group scales out, and empty instances are removed when demand falls.
  options:
    b:
      en: |-
        Actual CPU utilization of the running instances doesn't measure tasks that are waiting for placement; instances can be fully reserved while their CPU utilization stays low.
    c:
      en: |-
        More or earlier tasks don't add instances, so the extra tasks would still wait in PENDING.
    d:
      en: |-
        Fargate removes the instances that run the licensed agent, which the tasks require.
references:
  - title: "Automatically manage Amazon ECS capacity with cluster auto scaling - Amazon Elastic Container Service"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/cluster-auto-scaling.html
