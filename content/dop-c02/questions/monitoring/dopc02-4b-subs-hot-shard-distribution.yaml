id: dopc02-4b-subs-hot-shard-distribution
objective: "4.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company streams the logs of a high-traffic API to an Amazon Kinesis data stream in provisioned mode with 8 shards through an Amazon CloudWatch Logs subscription filter. The API runs as a single long-lived process that writes all its events to one log stream of the log group. Kinesis metrics show that one shard receives almost all the records and is throttled, while the other shards are nearly idle and the stream's total write capacity is far from used. The consumer application does not depend on the order of the records. The company wants the MOST cost-effective solution. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the stream to 16 shards with UpdateShardCount so that more write capacity is available to the subscription filter during peaks.
    - id: b
      text:
        en: |-
          Switch the stream to on-demand capacity mode so that Kinesis splits the throttled shard automatically when its traffic increases.
    - id: c
      text:
        en: |-
          Add a second subscription filter with the same filter pattern on the log group that targets the same stream, to double the delivery parallelism.
    - id: d
      text:
        en: |-
          Update the subscription filter to set its distribution to Random instead of the default grouping by log stream.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      By default, a subscription filter groups log data by log stream, so all the events of a single log stream go to the same shard. Setting the distribution to Random spreads the records across all shards of the Kinesis data stream, which uses the existing capacity at no extra cost because ordering is not required.
  options:
    a:
      en: |-
        With grouping by log stream, the records of the single log stream still land on one shard, so the new shards stay idle while the cost of the stream doubles.
    b:
      en: |-
        On-demand mode adds cost and capacity, but records that share the same grouping still map to one shard, so the hot spot remains.
    c:
      en: |-
        A second filter with the same pattern delivers every event twice to the stream; it adds records instead of spreading them.
references:
  - title: PutSubscriptionFilter - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutSubscriptionFilter.html
