id: dopc02-4a-high-resolution-alarm
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs a matchmaking service on Amazon ECS. The service calls the PutMetricData API to publish a custom metric named QueueDepth every second, without setting any optional resolution parameter. The on-call team must be paged when QueueDepth stays above 500 for 20 seconds, because players start leaving after about 30 seconds. The current alarm uses a 60-second period and fires too late. The company accepts the higher cost of faster alarms.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep publishing QueueDepth as it is, and change the alarm period to 10 seconds with 2 evaluation periods out of 2.
    - id: b
      text:
        en: |-
          Keep publishing QueueDepth as it is, and replace the alarm with a CloudWatch anomaly detection alarm that uses a 60-second period and a narrow band.
    - id: c
      text:
        en: |-
          Publish QueueDepth with StorageResolution set to 1, and create an alarm with a 10-second period that requires 2 of 2 data points above 500.
    - id: d
      text:
        en: |-
          Publish QueueDepth with StorageResolution set to 60, and create a composite alarm that combines three alarms with 60-second periods.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A custom metric is standard resolution (1 minute) unless it is published with StorageResolution 1, which stores it at 1-second resolution. Only alarms on high-resolution metrics can use a 10-second or 30-second period, so two 10-second periods detect a 20-second breach, at a higher alarm charge.
  options:
    a:
      en: |-
        Without StorageResolution 1, the metric is stored at 1-minute resolution, so an alarm cannot evaluate it in 10-second periods.
    b:
      en: |-
        An anomaly detection alarm with a 60-second period still evaluates one data point per minute, so it cannot react within 20 seconds.
    d:
      en: |-
        StorageResolution 60 is standard resolution, and combining alarms that each evaluate 60-second periods cannot detect a 20-second condition.
references:
  - title: Publish custom metrics (PutMetricData / EMF) - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/publishingMetrics.html
  - title: MetricDatum - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_MetricDatum.html
