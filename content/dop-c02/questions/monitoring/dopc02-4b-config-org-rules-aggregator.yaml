id: dopc02-4b-config-org-rules-aggregator
objective: "4.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has 200 accounts in an organization in AWS Organizations, and AWS Config recording is turned on in every account and Region. A compliance account is registered as the AWS Config delegated administrator. The compliance team must deploy the same set of AWS Config rules to every member account, and member account administrators must not be able to modify or delete these rules. The team must also see the compliance status of all accounts and Regions from the compliance account. Which combination of steps will meet these requirements with the LEAST operational overhead? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          From the compliance account, deploy the rules as organization AWS Config rules with the PutOrganizationConfigRule API in each Region.
    - id: b
      text:
        en: |-
          Create the rules in the compliance account and attach them to an AWS Config aggregator so that the aggregator deploys them to every source account.
    - id: c
      text:
        en: |-
          Create an organization-wide AWS Config aggregator in the compliance account to view the compliance data of all accounts and Regions.
    - id: d
      text:
        en: |-
          Deploy the rules with AWS CloudFormation StackSets with self-managed permissions, and give member account administrators read-only access to the stacks.
    - id: e
      text:
        en: |-
          Create the rules in the management account only, because rules created in the management account evaluate the resources of all member accounts.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Organization config rules, created with PutOrganizationConfigRule from the management account or a delegated administrator, deploy the rules to member accounts, and the member accounts cannot modify these rules. An aggregator with the organization as its source gives a read-only, multi-account, multi-Region view of the compliance data without authorizing each account.
  options:
    b:
      en: |-
        Aggregators provide a read-only view and cannot deploy rules to source accounts.
    d:
      en: |-
        StackSets with self-managed permissions require roles in every account and add stack management, and member administrators with Config permissions could still change the rules.
    e:
      en: |-
        A rule evaluates only the resources of the account and Region where it exists; rules in the management account do not evaluate member accounts.
references:
  - title: Managing AWS Config Rules Across All Accounts in Your Organization - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/config-rule-multi-account-deployment.html
  - title: Multi-Account Multi-Region Data Aggregation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html
