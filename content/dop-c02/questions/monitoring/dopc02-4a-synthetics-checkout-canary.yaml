id: dopc02-4a-synthetics-checkout-canary
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer runs its storefront behind an Application Load Balancer. At night there is almost no customer traffic, and a broken checkout page was discovered only the next morning. The DevOps team must test the sign-in, add-to-cart, and checkout steps in a headless browser every 5 minutes, keep a screenshot of each step, and raise a CloudWatch alarm when any step fails.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch Synthetics canary with a browser script that performs the three steps on a 5-minute schedule, and create an alarm on the canary's success metric.
    - id: b
      text:
        en: |-
          Create a Route 53 health check on the checkout URL with a 30-second interval, and create a CloudWatch alarm on the HealthCheckStatus metric of the health check.
    - id: c
      text:
        en: |-
          Add the CloudWatch RUM web client to the storefront pages, and create an alarm on the JavaScript error metric that RUM publishes for the checkout page.
    - id: d
      text:
        en: |-
          Configure the target group health check to request the checkout page, and create a CloudWatch alarm on the UnHealthyHostCount metric of the target group.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Synthetics canaries are scripts that run on a schedule, as often as once per minute, and follow the same steps as a customer in a headless browser. They store screenshots of the pages and publish metrics in the CloudWatchSynthetics namespace that alarms can watch, so failures are detected even when no customer is on the site.
  options:
    b:
      en: |-
        A Route 53 health check requests one endpoint and checks the response; it cannot sign in, add an item to the cart, or take screenshots of each step.
    c:
      en: |-
        RUM collects data from real user sessions; with almost no traffic at night, it would not detect the failure, and it does not script the three steps.
    d:
      en: |-
        A target group health check confirms that targets answer one path; it does not run a multi-step browser workflow or capture screenshots.
references:
  - title: Synthetic monitoring (canaries) - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries.html
