id: dopc02-4a-percentiles-statistic-sets
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company runs an API on Amazon EC2 instances. To reduce API calls, the application aggregates request latencies in memory and publishes one statistic set per minute (SampleCount, Sum, Minimum, and Maximum) for the custom metric ApiLatency. A new service level objective requires an alarm on the p99 latency of the API. When the team creates the alarm with the p99 statistic, the metric shows no data, although Average and Maximum graphs work. Latencies are always positive, and each instance handles between 300 and 2,000 requests per minute with many repeated values.

    Which change will provide p99 statistics for ApiLatency while keeping the number of PutMetricData calls low?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the statistic sets, and create the alarm on a metric math expression that computes the 99th percentile from the Maximum and SampleCount statistics.
    - id: b
      text:
        en: |-
          Publish the raw latencies in each call by using the Values and Counts arrays of the metric datum, with each unique value sent once with its number of occurrences.
    - id: c
      text:
        en: |-
          Keep the statistic sets, and publish them with StorageResolution set to 1 so that CloudWatch keeps enough detail to compute percentiles.
    - id: d
      text:
        en: |-
          Keep the statistic sets, and add the InstanceId dimension so that CloudWatch can compute percentiles for each instance separately.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudWatch needs raw data points to compute percentiles; for a statistic set, percentiles are available only when SampleCount is 1 or Minimum equals Maximum. The Values and Counts arrays send the raw distribution in one call (up to 150 unique values per call), so percentiles become available without one call per request.
  options:
    a:
      en: |-
        Metric math has no way to rebuild a percentile from pre-aggregated Maximum and SampleCount values; the distribution of the data is lost in a statistic set.
    c:
      en: |-
        Storage resolution changes the time granularity, not the aggregation; a high-resolution statistic set still has no raw values to compute percentiles.
    d:
      en: |-
        Adding a dimension splits the data into more metrics, but each one is still built from statistic sets, so percentiles remain unavailable.
references:
  - title: Metrics concepts - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html
  - title: MetricDatum - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_MetricDatum.html
