id: dopc02-4c-s3-recursive-trigger
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function is invoked by an S3 event notification for all s3:ObjectCreated:* events in a bucket. The function reads each image uploaded under the uploads/ prefix and writes a resized copy under the thumbnails/ prefix of the same bucket. After deployment, the number of invocations and objects keeps growing even when no user uploads images. The company wants to keep the thumbnails in the same bucket.

    Which change will stop this behavior?
body:
  options:
    - id: a
      text:
        en: |-
          Add a prefix filter of uploads/ to the event notification so that only objects created under uploads/ invoke the function.
    - id: b
      text:
        en: |-
          Set the reserved concurrency of the function to 1 so that only one invocation of the function can run at a time.
    - id: c
      text:
        en: |-
          Set the maximum retry attempts for asynchronous invocations of the function to 0 in the function's configuration.
    - id: d
      text:
        en: |-
          Configure an on-failure destination for the function that sends the records of failed invocations to an Amazon SQS queue.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Each thumbnail that the function writes is itself an ObjectCreated event in the bucket, so the function triggers itself in a loop. AWS recommends using two buckets or limiting the trigger to the prefix used for incoming objects. A prefix filter of uploads/ keeps the thumbnails in the same bucket without invoking the function again.
  options:
    b:
      en: |-
        Limiting concurrency only slows the loop; every thumbnail still creates a new event that invokes the function again.
    c:
      en: |-
        Retry settings apply to failed invocations. The looping invocations succeed, so each one keeps creating new events.
    d:
      en: |-
        An on-failure destination captures failed events only; the loop consists of successful invocations.
references:
  - title: "Process Amazon S3 event notifications with Lambda - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-s3.html
  - title: "Amazon S3 Event Notifications - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html
