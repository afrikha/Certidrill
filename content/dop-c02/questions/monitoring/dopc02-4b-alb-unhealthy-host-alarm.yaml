id: dopc02-4b-alb-unhealthy-host-alarm
objective: "4.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs a stateless service on Amazon EC2 instances in three Availability Zones behind an Application Load Balancer. The operations team wants an Amazon CloudWatch alarm on the target group that detects unhealthy targets. The alarm must follow the Elastic Load Balancing recommendations, must detect a target that every load balancer node considers unhealthy, and must not fire for a single data point. Which combination of settings should the team use? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Use the UnHealthyHostCount metric with the Minimum statistic and a threshold greater than 0.
    - id: b
      text:
        en: |-
          Use the HealthyHostCount metric with the Sum statistic and a threshold lower than the number of registered targets.
    - id: c
      text:
        en: |-
          Set the alarm to require more than one breaching data point, for example 2 out of 2 evaluation periods.
    - id: d
      text:
        en: |-
          Use the UnHealthyHostCount metric with the Maximum statistic so that any unhealthy target seen by one node triggers the alarm.
    - id: e
      text:
        en: |-
          Set the alarm to treat missing data as breaching, so that periods without requests also put the alarm in the ALARM state.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Elastic Load Balancing recommends monitoring a non-zero UnHealthyHostCount with the Minimum statistic, which shows targets that are unhealthy across every load balancer node and Availability Zone, and alarming on a non-zero value for more than one data point. Requiring 2 out of 2 breaching periods avoids alarms on a single transient value.
  options:
    b:
      en: |-
        Sum is not a recommended statistic for host count metrics, and deregistering a target lowers HealthyHostCount, so normal scale-in would trigger the alarm.
    d:
      en: |-
        Maximum reacts when a single node sees an unhealthy target, which is the opposite of the requirement to detect targets that every node considers unhealthy.
    e:
      en: |-
        Load balancer metrics are reported only when requests flow, so treating missing data as breaching would fire the alarm during quiet periods without any unhealthy target.
references:
  - title: CloudWatch metrics for your Application Load Balancer - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-cloudwatch-metrics.html
