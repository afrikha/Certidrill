id: dopc02-4c-route53-string-match-fast
objective: "4.3.11"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company uses Amazon Route 53 failover routing for app.example.com. The primary record points to a public endpoint in one Region. When the backend database fails, the endpoint's /status page still returns HTTP 200, with a body that contains "status":"degraded" instead of "status":"ok". The current HTTPS health check uses a 30-second request interval, so Route 53 never fails over in this case. The company wants Route 53 to fail over when the body doesn't contain "status":"ok", and to detect the failure within about 30 seconds. A DevOps engineer is creating a new health check to replace the current one.

    Which combination of settings should the engineer use? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The HTTPS type with latency graphs turned on, so that slow or degraded responses mark the endpoint unhealthy.
    - id: b
      text:
        en: |-
          The HTTPS type with string matching on the search string "status":"ok", which must appear in the first 5,120 bytes of the body.
    - id: c
      text:
        en: |-
          A request interval of 5 seconds with a failure threshold of 6.
    - id: d
      text:
        en: |-
          The Invert health check status option, so that the degraded response is reported as unhealthy.
    - id: e
      text:
        en: |-
          A request interval of 10 seconds with a failure threshold of 3.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      With string matching, Route 53 considers the endpoint healthy only if the response body contains the search string entirely within its first 5,120 bytes, so a 200 response that reports degraded fails the check. A fast 10-second request interval with a failure threshold of 3 changes the status after about three failed checks, roughly 30 seconds. The request interval can't be changed after creation, which is why a new health check is needed.
  options:
    a:
      en: |-
        Latency graphs only measure latency from the health checkers; they don't change how health is determined.
    c:
      en: |-
        Route 53 request intervals are 30 seconds (standard) or 10 seconds (fast); 5 seconds isn't available.
    d:
      en: |-
        Inverting the status would report the endpoint unhealthy when it is healthy, and healthy when it is down.
references:
  - title: "Values that you specify when you create or update health checks - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-creating-values.html
  - title: "How Amazon Route 53 determines whether a health check is healthy - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-determining-health-of-endpoints.html
