id: dopc02-4b-quicksight-athena-permissions
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores Application Load Balancer access logs in an Amazon S3 bucket named alb-logs-archive and has created an Amazon Athena table on them. The operations manager wants interactive visualizations of error trends in Quick Sight (part of AWS Quick). A Quick administrator creates an Athena data source with the default workgroup, which writes query results to the bucket aws-athena-query-results-us-east-2-111111111111. Creating the dataset fails with an error that says the user does not have sufficient permissions to connect to the dataset or run the query. The S3 buckets use SSE-S3 encryption. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach the AmazonAthenaFullAccess managed policy to the IAM role of the operations manager, and create the dataset again from the Athena console.
    - id: b
      text:
        en: |-
          In the Quick administration settings, under Security & permissions, enable access to Amazon Athena and select the alb-logs-archive bucket and the Athena query results bucket.
    - id: c
      text:
        en: |-
          Add a bucket policy on alb-logs-archive that allows the Athena service principal to read the objects, and keep the query results bucket unchanged.
    - id: d
      text:
        en: |-
          Create an AWS KMS grant that gives the Quick service role the Decrypt operation on the key that protects the two buckets.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Before Quick Sight can use Athena, a Quick administrator must authorize connections to Athena and to the S3 buckets involved in Security & permissions. This includes the source data bucket and the bucket where Athena stores the query results, because the Quick service role reads both.
  options:
    a:
      en: |-
        Quick Sight queries Athena with its own service role, not with the IAM role of the user, so the user's IAM permissions do not fix the dataset error.
    c:
      en: |-
        Athena queries run with the permissions of the caller (here the Quick service role), and the query results bucket would still be inaccessible.
    d:
      en: |-
        The buckets use SSE-S3, so there is no customer managed KMS key to grant; a KMS grant is needed only for data encrypted with a KMS key.
references:
  - title: Authorizing connections to Amazon Athena - AWS Quick
    url: https://docs.aws.amazon.com/quicksight/latest/user/athena.html
