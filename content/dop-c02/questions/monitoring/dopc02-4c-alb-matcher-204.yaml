id: dopc02-4c-alb-matcher-204
objective: "4.3.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys a new version of an API on Amazon EC2 instances behind an Application Load Balancer. The developers changed the /health endpoint so that it returns HTTP 204 No Content when the instance is healthy. After the deployment, all new targets stay unhealthy with the reason code Target.ResponseCodeMismatch, although the endpoint responds in a few milliseconds. The target group uses the default health check settings, except for the path.

    What should a DevOps engineer do so that the healthy targets pass their health checks?
body:
  options:
    - id: a
      text:
        en: |-
          Change the success codes (matcher) of the target group's health check to 200-299.
    - id: b
      text:
        en: |-
          Increase the health check timeout of the target group from 5 seconds to 30 seconds.
    - id: c
      text:
        en: |-
          Lower the healthy threshold count of the target group from 5 to 2.
    - id: d
      text:
        en: |-
          Change the health check protocol of the target group from HTTP to HTTPS.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The default success code of an Application Load Balancer HTTP health check is 200, so a 204 response is a response code mismatch. The matcher accepts values or ranges between 200 and 499; setting it to 200-299 (or including 204) makes the new response healthy.
  options:
    b:
      en: |-
        The endpoint answers in milliseconds; the failure reason is the response code, not a timeout.
    c:
      en: |-
        Fewer successful checks are required, but every check still fails because 204 doesn't match the success code 200.
    d:
      en: |-
        The protocol doesn't change the response code; the endpoint would still return 204.
references:
  - title: "Health checks for Application Load Balancer target groups - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
