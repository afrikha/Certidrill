id: dopc02-4b-xray-ecs-fargate-collector
objective: "4.2.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs a Java service as an Amazon ECS service on AWS Fargate. The developers have instrumented the application with the AWS Distro for OpenTelemetry (ADOT) Java agent, which exports traces over OTLP to localhost. No collector runs today, and no traces reach AWS X-Ray. The task definition has a task execution role that pulls images and writes container logs, and a task role that the application uses to call Amazon DynamoDB. The team wants the traces in X-Ray with the fewest components and without using components that AWS has placed in maintenance mode. Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a CloudWatch agent container configured to receive OpenTelemetry traces to the task definition, so that it runs next to the application container in each task.
    - id: b
      text:
        en: |-
          Add the xray:PutTraceSegments permission to the task execution role that ECS uses to pull images and send container logs.
    - id: c
      text:
        en: |-
          Add the xray:PutTraceSegments permission to the task role of the task definition.
    - id: d
      text:
        en: |-
          Install the AWS X-Ray daemon on the container hosts with user data, and point the ADOT agent to the daemon on UDP port 2000.
    - id: e
      text:
        en: |-
          Turn on X-Ray tracing in the ECS service configuration so that ECS sends the spans of the tasks to X-Ray.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The OTLP spans need a collector in the task: AWS documents the CloudWatch agent (version 1.300025.0 or later) or the OpenTelemetry Collector running as another container of the same task, and the CloudWatch agent replaces the X-Ray daemon with fewer agents to manage. The collector runs with the task role, which must have xray:PutTraceSegments.
  options:
    b:
      en: |-
        The task execution role is used by the ECS agent to pull images and send logs; containers in the task use the task role.
    d:
      en: |-
        Fargate does not give access to the underlying hosts, and the X-Ray daemon is in maintenance mode.
    e:
      en: |-
        Amazon ECS has no service setting that sends application spans to X-Ray; a collector must run with the application.
references:
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation - AWS X-Ray
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
