id: dopc02-4c-cw-agent-run-as-user
objective: "4.3.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A security standard requires that the CloudWatch agent on a company's Amazon Linux EC2 instances doesn't run as root. The agent must keep collecting the application log files under /var/app/logs/ and sending them to Amazon CloudWatch Logs. The instances use an instance profile whose role has the CloudWatchAgentServerPolicy policy, and long-term access keys are forbidden. A DevOps engineer has created a dedicated operating system user named cwagent for the agent.

    Which combination of steps must the engineer take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an IAM user for cwagent, and store its access keys in the shared credentials file that the agent's common-config.toml file references.
    - id: b
      text:
        en: |-
          Add the cwagent user to the sudoers file so that the agent can switch to root whenever it needs to read the log files.
    - id: c
      text:
        en: |-
          Set run_as_user to cwagent in the agent section of the CloudWatch agent configuration file, and restart the agent with the new configuration.
    - id: d
      text:
        en: |-
          Add the user name to the log group names in the agent configuration so that CloudWatch Logs accepts log events from an agent that doesn't run as root.
    - id: e
      text:
        en: |-
          Give the cwagent user read permission on the log files and execute permission on every directory in the path to the log files.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      On Linux, the agent runs as root by default; the run_as_user parameter in the agent section makes it run as another user, and the agent must be restarted for a configuration change to take effect. That user needs read permission on the log files and execute permission on every directory in their path. On EC2, the instance profile role still provides the credentials.
  options:
    a:
      en: |-
        Long-term access keys are forbidden, and they aren't needed on EC2 because the instance profile role provides credentials.
    b:
      en: |-
        Letting the agent switch to root defeats the requirement that it doesn't run as root.
    d:
      en: |-
        Log group names have nothing to do with the operating system user of the agent; CloudWatch Logs authorizes the IAM credentials.
references:
  - title: "Common scenarios with the CloudWatch agent - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-common-scenarios.html
