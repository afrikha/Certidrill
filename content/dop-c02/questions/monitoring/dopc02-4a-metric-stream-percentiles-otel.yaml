id: dopc02-4a-metric-stream-percentiles-otel
objective: "4.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company streams all metrics of the AWS/ApplicationELB namespace to an observability backend through a CloudWatch metric stream in OpenTelemetry 1.0.0 format. The backend accepts only OpenTelemetry 1.0.0 data. The SRE team now needs the p90 and p99 of the TargetResponseTime metric in the backend for every load balancer and target group. Today the stream delivers only Minimum, Maximum, SampleCount, and Sum. The company wants to keep a single stream and pay only for the statistics it needs.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the output format of the stream to JSON, and add the trimmed mean TM(10%:90%) and TM(1%:99%) statistics for TargetResponseTime.
    - id: b
      text:
        en: |-
          Create a second metric stream in OpenTelemetry 1.0.0 format that includes only the TargetResponseTime metric, and add p90 and p99 to it.
    - id: c
      text:
        en: |-
          Add p90 and p99 as additional statistics for every metric in the AWS/ApplicationELB namespace in the existing stream.
    - id: d
      text:
        en: |-
          Add p90 and p99 as additional statistics for the TargetResponseTime metric of the AWS/ApplicationELB namespace in the existing stream.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Metric streams can send additional statistics, chosen per metric, and percentiles are available in both JSON and OpenTelemetry formats. When a metric name and namespace are specified, all its dimension combinations are streamed with those statistics, and the extra statistics are billed only for that metric.
  options:
    a:
      en: |-
        The backend accepts only OpenTelemetry 1.0.0, and trimmed means are not the p90 and p99 values the team needs.
    b:
      en: |-
        A second stream is unnecessary, since additional statistics are configured per metric inside the existing stream, and the company wants a single stream.
    c:
      en: |-
        Adding percentiles to every metric of the namespace creates extra billed metric updates for statistics nobody needs.
references:
  - title: Statistics that can be streamed - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-metric-streams-statistics.html
