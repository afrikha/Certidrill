id: dopc02-4b-anomaly-seasonal-traffic
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company runs a web application behind an Application Load Balancer. Request volume follows a strong daily and weekly pattern: it is high during evenings and weekends and very low at night. An Amazon CloudWatch alarm with a static threshold on RequestCount either misses unusual drops at peak hours or fires every night. The operations team wants an alarm that adapts to the expected pattern of the metric without the team maintaining several thresholds. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create several alarms on RequestCount with different static thresholds, and enable or disable them on a schedule with Amazon EventBridge Scheduler.
    - id: b
      text:
        en: |-
          Create a CloudWatch anomaly detection alarm on RequestCount that alarms when the metric goes outside the band of expected values.
    - id: c
      text:
        en: |-
          Create a CloudWatch composite alarm that combines the existing static alarm with an alarm on the TargetResponseTime metric.
    - id: d
      text:
        en: |-
          Change the existing alarm to evaluate 10 out of 10 data points so that short variations of RequestCount no longer change its state.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudWatch anomaly detection builds a model of the metric's expected values, including hourly, daily, and weekly patterns, and an anomaly detection alarm compares the metric to the resulting band instead of a fixed number. The threshold therefore follows the traffic pattern without manual tuning.
  options:
    a:
      en: |-
        Scheduled static thresholds must be designed and maintained by the team, which is exactly what it wants to avoid, and they do not adapt when the pattern shifts.
    c:
      en: |-
        A composite alarm only combines alarm states; the static RequestCount threshold that causes the problem is still there.
    d:
      en: |-
        More evaluation periods delay the alarm but keep a single fixed threshold that does not match both night and peak traffic.
references:
  - title: Using CloudWatch anomaly detection - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
