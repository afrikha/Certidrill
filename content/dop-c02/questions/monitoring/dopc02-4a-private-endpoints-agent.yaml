id: dopc02-4a-private-endpoints-agent
objective: "4.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank runs Amazon EC2 instances in private subnets of a VPC that has no internet gateway and no NAT gateway. The CloudWatch agent on each instance must send application logs to CloudWatch Logs and memory and disk metrics to CloudWatch. The agent configuration file is baked into the AMI. A security policy requires that the telemetry travels only over the AWS network, encrypted in transit, and that a network policy can restrict which API actions are allowed from the VPC.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.region.logs with private DNS enabled, and attach an endpoint policy that allows the log ingestion actions.
    - id: b
      text:
        en: |-
          Create a gateway VPC endpoint for Amazon S3, and attach an endpoint policy that allows s3:PutObject on a bucket that receives the agent's logs and metrics.
    - id: c
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.region.events with private DNS enabled, and attach an endpoint policy that allows events:PutEvents.
    - id: d
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.region.monitoring with private DNS enabled, and attach an endpoint policy that allows cloudwatch:PutMetricData.
    - id: e
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.region.firehose with private DNS enabled, and attach an endpoint policy that allows firehose:PutRecordBatch.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The agent sends logs to the CloudWatch Logs API (logs endpoint) and metrics to the CloudWatch API (monitoring endpoint). Interface VPC endpoints for these two services keep the HTTPS traffic on the AWS network, private DNS lets the agent use the default endpoint names, and endpoint policies limit the allowed actions such as logs:PutLogEvents and cloudwatch:PutMetricData.
  options:
    b:
      en: |-
        The CloudWatch agent does not write logs or metrics to S3 for CloudWatch to read; it calls the CloudWatch Logs and CloudWatch APIs.
    c:
      en: |-
        The agent does not send telemetry through EventBridge, so this endpoint carries none of its traffic.
    e:
      en: |-
        The CloudWatch agent publishes to CloudWatch Logs and CloudWatch, not to Firehose streams, so this endpoint is not used.
references:
  - title: Using CloudWatch Logs with interface VPC endpoints - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/cloudwatch-logs-and-interface-VPC.html
  - title: Using CloudWatch, CloudWatch Synthetics, and CloudWatch Network Monitoring with interface VPC endpoints - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-and-interface-VPC.html
