id: dopc02-4a-continuous-archive-retention
objective: "4.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps application logs in CloudWatch Logs log groups in the Standard log class with Never expire retention, and storage charges keep growing. A new policy requires that log events stay in CloudWatch Logs for 30 days for troubleshooting, and that every event also reaches an S3 bucket within 15 minutes of ingestion for 5 years of archiving. A DevOps engineer proposes a Lambda function that creates a CloudWatch Logs export task for each log group every 10 minutes. The company wants a reliable design with the least custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the proposed Lambda function, run it every 10 minutes, and set a 30-day retention policy on each log group.
    - id: b
      text:
        en: |-
          Set a 30-day retention policy on each log group, and run a daily export task per log group to the S3 bucket after the retention is applied.
    - id: c
      text:
        en: |-
          Add a subscription filter to each log group that sends all events to an Amazon Data Firehose stream that writes to the S3 bucket, and set a 30-day retention policy on each log group.
    - id: d
      text:
        en: |-
          Change the log groups to the Essentials log class with a 5-year retention policy, and query old events with CloudWatch Logs Insights when they are needed.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A subscription filter delivers log events continuously to Firehose, which writes them to S3 within its buffering interval, well inside 15 minutes. A 30-day retention policy then deletes events from CloudWatch Logs, which stops the growth of storage charges.
  options:
    a:
      en: |-
        Only one export task can be active per account at a time, and log data can take up to 12 hours to become available for export, so a 10-minute schedule cannot meet the 15-minute requirement.
    b:
      en: |-
        A daily export misses the 15-minute requirement, and export tasks are batch jobs that AWS does not recommend for continuous archiving.
    d:
      en: |-
        The log class of an existing log group cannot be changed, and keeping 5 years in CloudWatch Logs does not put the events in the S3 bucket.
references:
  - title: Exporting log data to Amazon S3 - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/S3Export.html
  - title: CloudWatch Logs quotas - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/cloudwatch_limits_cwl.html
