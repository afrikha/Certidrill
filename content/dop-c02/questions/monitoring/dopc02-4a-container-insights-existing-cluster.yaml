id: dopc02-4a-container-insights-existing-cluster
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs Amazon ECS clusters on AWS Fargate in one account. A DevOps engineer set the containerInsights account setting to enhanced for the whole account by using the root principal ARN. Clusters created since then report task-level and container-level CPU, memory, and network metrics. The production cluster, which was created a year ago, still shows no Container Insights metrics. The company wants the production cluster monitored the same way without downtime and without re-creating it.

    What should the DevOps engineer do?
body:
  options:
    - id: a
      text:
        en: |-
          Run the put-account-setting-default command with containerInsights set to enhanced so that the setting also applies to clusters that existed before the change.
    - id: b
      text:
        en: |-
          Deploy the CloudWatch agent as a sidecar container in every task definition of the production services, and force a new deployment of each service.
    - id: c
      text:
        en: |-
          Create a CloudWatch metric stream that includes the AWS/ECS namespace so that the production cluster's service metrics are delivered at 1-minute resolution.
    - id: d
      text:
        en: |-
          Run the update-cluster-settings command on the production cluster with the containerInsights setting set to enhanced.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The containerInsights account setting applies only to clusters created after it is set. To add Container Insights to an existing cluster, or to upgrade it to enhanced observability, you update the cluster settings, which needs no task replacement or cluster re-creation.
  options:
    a:
      en: |-
        Changing the account default still affects only clusters created afterward; it does not turn on Container Insights for the existing production cluster.
    b:
      en: |-
        Container Insights on ECS does not require a sidecar agent in each task; adding one changes every task definition and redeploys every service for no benefit.
    c:
      en: |-
        A metric stream only forwards metrics that already exist, such as the service-level CPU and memory metrics in AWS/ECS; it does not create the task-level and container-level Container Insights metrics.
references:
  - title: Setting up Container Insights on Amazon ECS - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/deploy-container-insights-ECS-cluster.html
  - title: Container Insights - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContainerInsights.html
