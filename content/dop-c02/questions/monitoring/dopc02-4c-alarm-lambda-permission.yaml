id: dopc02-4c-alarm-lambda-permission
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DevOps engineer configures an Amazon CloudWatch alarm with a Lambda action that invokes a function in the same account to collect diagnostics when the alarm enters the ALARM state. The alarm changes to ALARM as expected, but the function is never invoked and its logs show no invocation. The engineer has already added lambda:InvokeFunction to the IAM role that the engineer used to create the alarm. The company requires least privilege and protection against the confused deputy problem.

    What should the engineer do?
body:
  options:
    - id: a
      text:
        en: |-
          Add lambda:InvokeFunction for the function to the AWSServiceRoleForCloudWatchEvents service-linked role that CloudWatch uses for alarm actions.
    - id: b
      text:
        en: |-
          Add a statement to the function's resource-based policy that allows the events.amazonaws.com principal to invoke it, with the alarm ARN as the source ARN.
    - id: c
      text:
        en: |-
          Add a statement to the function's resource-based policy that allows lambda.alarms.cloudwatch.amazonaws.com to invoke it, with source account and alarm ARN conditions.
    - id: d
      text:
        en: |-
          Add a statement to the function's resource-based policy that allows the cloudwatch.amazonaws.com principal to invoke the function, with no source conditions.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A CloudWatch alarm invokes a Lambda function as the lambda.alarms.cloudwatch.amazonaws.com service principal, which the function's resource-based policy must allow. AWS recommends the AWS:SourceAccount condition, plus AWS:SourceArn to allow only the specific alarm, to prevent confused deputy issues. Without this authorization, CloudWatch doesn't invoke the function.
  options:
    a:
      en: |-
        The function's resource-based policy authorizes the alarm action, and the permissions of a service-linked role are defined by AWS rather than edited by customers.
    b:
      en: |-
        events.amazonaws.com is the Amazon EventBridge principal; it doesn't authorize invocations by CloudWatch alarms.
    d:
      en: |-
        This is not the principal that alarm actions use, and a policy without a source account is vulnerable to confused deputy issues.
references:
  - title: "Invoke a Lambda function from an alarm - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarms-and-actions-Lambda.html
