id: dopc02-4a-metric-filter-error-count
objective: "4.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's order service runs on Amazon EC2 instances, and the CloudWatch agent sends its plain-text application log to a log group in the Standard log class. Lines that report a failure contain the word ERROR. The operations team wants a CloudWatch metric that counts these lines and an alarm that notifies an Amazon SNS topic when more than 20 errors occur in 5 minutes. The team wants a managed feature without custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a subscription filter with the ERROR pattern that sends matching events to a Lambda function, which publishes an error count with PutMetricData.
    - id: b
      text:
        en: |-
          Create a metric filter on the log group with the filter pattern ERROR and a metric value of 1, and create an alarm on the Sum of the metric over 5 minutes.
    - id: c
      text:
        en: |-
          Create a CloudWatch Logs Insights query that counts ERROR lines, and add it to a dashboard that the on-call engineers watch.
    - id: d
      text:
        en: |-
          Create a Contributor Insights rule on the log group that ranks the instances that log ERROR lines, and create an alarm on the top contributor.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A metric filter turns matching log events into a CloudWatch metric: each event that contains ERROR adds the metric value 1. An alarm on the Sum over a 5-minute period then notifies the SNS topic when the count passes 20, with no code to maintain.
  options:
    a:
      en: |-
        A Lambda function that publishes metrics is custom code, which the team wants to avoid when a metric filter does the same job.
    c:
      en: |-
        A dashboard query shows the count only when someone looks at it; it does not create a metric for an alarm that notifies SNS.
    d:
      en: |-
        Contributor Insights ranks the top contributors to a pattern; it does not produce the total count of ERROR lines that the alarm needs.
references:
  - title: Creating metrics from log events using filters - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/MonitoringLogData.html
