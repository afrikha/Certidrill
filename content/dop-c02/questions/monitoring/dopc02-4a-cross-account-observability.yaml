id: dopc02-4a-cross-account-observability
objective: "4.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has 140 workload accounts in an organization in AWS Organizations, all running in us-east-1, and creates new accounts every month. Each account sends metrics and logs to CloudWatch and traces to AWS X-Ray. The central operations team works from a dedicated monitoring account. The team must search metrics and log groups, view traces, and build dashboards across every workload account from the monitoring account without switching roles. New accounts must be included automatically, and the company does not want to copy telemetry or pay extra for sharing logs and metrics.

    Which combination of steps will meet these requirements with the LEAST operational overhead? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          In the monitoring account, configure CloudWatch cross-account observability as a monitoring account for logs, metrics, and traces, and list the organization ID as the source.
    - id: b
      text:
        en: |-
          In each workload account, create a CloudWatch metric stream and a subscription filter on every log group that send the telemetry to an Amazon Data Firehose stream in the monitoring account.
    - id: c
      text:
        en: |-
          From the management account, deploy the CloudFormation linking template as a StackSet to the whole organization so that every current and future account links to the monitoring account.
    - id: d
      text:
        en: |-
          In each workload account, create an IAM role that the operations team assumes from the monitoring account, and create cross-account dashboards that switch roles per account.
    - id: e
      text:
        en: |-
          In the monitoring account, create an Amazon OpenSearch Service domain and send the X-Ray traces and log events of every workload account to it through Lambda functions.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      CloudWatch cross-account observability lets a monitoring account search and analyze metrics, logs, and traces of linked source accounts in the same Region without copying them, at no extra cost for logs and metrics. The monitoring account is configured with the telemetry types and the organization as allowed source, and a StackSet of the linking template deployed to the organization links existing accounts and onboards new ones automatically.
  options:
    b:
      en: |-
        Metric streams and subscription filters copy the telemetry to another account, which adds Firehose charges and per-account setup, and they do not share X-Ray traces.
    d:
      en: |-
        Switching roles per account is what the team must avoid, and roles must be created again for every new account.
    e:
      en: |-
        Copying traces and logs to OpenSearch through custom Lambda functions duplicates data and is far more operational work than a managed cross-account feature.
references:
  - title: CloudWatch cross-account observability - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Unified-Cross-Account.html
  - title: Link monitoring accounts with source accounts - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Unified-Cross-Account-Setup.html
