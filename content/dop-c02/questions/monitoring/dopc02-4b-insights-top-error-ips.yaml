id: dopc02-4b-insights-top-error-ips
objective: "4.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon API Gateway REST API writes JSON access logs to an Amazon CloudWatch Logs log group. Each log event contains the fields ip, status, path, and httpMethod, and CloudWatch Logs Insights discovers these fields automatically. During an incident, the on-call engineer must list the 10 client IP addresses that received the most HTTP 5xx responses in the last hour, with the number of 5xx responses for each IP address, sorted from the highest count. Which CloudWatch Logs Insights query will return this result?
body:
  options:
    - id: a
      text:
        en: |-
          stats count(*) as errors by ip | filter status >= 500 and status <= 599 | sort errors desc | limit 10
    - id: b
      text:
        en: |-
          filter status >= 500 and status <= 599 | sort ip desc | limit 10 | stats count(*) as errors by ip
    - id: c
      text:
        en: |-
          filter status >= 500 and status <= 599 | stats count(*) as errors by ip | sort errors desc | limit 10
    - id: d
      text:
        en: |-
          fields ip, status | filter status >= 500 and status <= 599 | dedup ip | sort @timestamp desc | limit 10
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The query must filter the 5xx events first, then aggregate them per IP address with stats count(*) by ip, sort on the aggregated column, and keep the first 10 rows. Commands run in order through the pipe, so each step works on the output of the previous one.
  options:
    a:
      en: |-
        After stats, only the aggregated fields (errors and ip) remain, so the status filter that follows cannot apply to the individual requests.
    b:
      en: |-
        The limit runs before the aggregation, so only 10 log events are counted instead of all the 5xx responses of the hour.
    d:
      en: |-
        dedup returns one event per IP address without counting the errors, and the sort on the timestamp does not rank the addresses by number of errors.
references:
  - title: Sample queries - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-examples.html
  - title: CloudWatch Logs Insights language query syntax - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax.html
