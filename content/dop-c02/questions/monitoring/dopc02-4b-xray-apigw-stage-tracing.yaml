id: dopc02-4b-xray-apigw-stage-tracing
objective: "4.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company exposes an Amazon API Gateway REST API with a prod stage that invokes AWS Lambda functions. Active tracing is already enabled on the functions, but the AWS X-Ray trace map does not show API Gateway, so the team cannot see the time spent in API Gateway before each function is invoked. The team wants API Gateway to sample incoming requests and send trace data to X-Ray. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable CloudWatch execution logging at the INFO level on the prod stage, and add $context.xrayTraceId to the access log format.
    - id: b
      text:
        en: |-
          Enable detailed CloudWatch metrics on the prod stage so that latency is reported for each method.
    - id: c
      text:
        en: |-
          Enable X-Ray tracing in the settings of the prod stage, and redeploy the API to the stage.
    - id: d
      text:
        en: |-
          Add the AWSXRayDaemonWriteAccess policy to the execution roles of the Lambda functions.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      API Gateway supports active tracing for REST APIs as a stage setting. When it is enabled, API Gateway samples incoming requests according to the X-Ray sampling rules, adds the tracing header, and records a segment for the stage, so API Gateway appears on the trace map in front of the functions.
  options:
    a:
      en: |-
        Execution and access logs go to CloudWatch Logs; logging the trace ID does not make API Gateway send segments to X-Ray.
    b:
      en: |-
        Detailed metrics add per-method CloudWatch metrics but no trace data.
    d:
      en: |-
        The functions already send their traces; the missing segments are API Gateway's, which depend on the stage setting, not on the functions' permissions.
references:
  - title: Amazon API Gateway active tracing support for AWS X-Ray - AWS X-Ray
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-services-apigateway.html
