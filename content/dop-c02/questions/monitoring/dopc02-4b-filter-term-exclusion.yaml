id: dopc02-4b-filter-term-exclusion
objective: "4.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application writes plain-text log lines to an Amazon CloudWatch Logs log group. Failure lines contain the uppercase word ERROR. A load balancer health check also produces a line that contains both ERROR and HealthCheck every few seconds when a dependency is warming up, and these lines must be ignored. A DevOps engineer is creating a subscription filter that sends only the relevant failure lines to an AWS Lambda function. Which filter pattern should the engineer use?
body:
  options:
    - id: a
      text:
        en: |-
          ?ERROR -HealthCheck
    - id: b
      text:
        en: |-
          "ERROR -HealthCheck"
    - id: c
      text:
        en: |-
          ERROR HealthCheck
    - id: d
      text:
        en: |-
          ERROR -HealthCheck
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Terms separated by spaces must all match, and a term prefixed with a minus sign excludes the events that contain it. ERROR -HealthCheck matches the lines that contain ERROR and do not contain HealthCheck. Filter patterns are case sensitive, which fits the uppercase ERROR of the application.
  options:
    a:
      en: |-
        A question mark term cannot be combined with include or exclude terms: CloudWatch Logs ignores it, so the pattern would match every line without HealthCheck, not only the failures.
    b:
      en: |-
        Double quotation marks match an exact phrase, so this pattern looks for the literal text ERROR -HealthCheck.
    c:
      en: |-
        Both terms must be present, so this pattern matches only the health check lines, which are the ones to ignore.
references:
  - title: Filter pattern syntax for metric filters, subscription filters, filter log events, and Live Tail - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/FilterAndPatternSyntax.html
