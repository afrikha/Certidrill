id: dopc02-4a-live-tail-deployment
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A DevOps engineer deploys a new version of an AWS Lambda function and several Amazon ECS services that write to four CloudWatch Logs log groups in the Standard log class. During the deployment window, the engineer wants to watch new log events from the four log groups as they are ingested, show only events that contain the word ERROR, and highlight the term timeout. The engineer does not want to create or delete any resources for this short session.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run a CloudWatch Logs Insights query on the four log groups every 30 seconds with a filter on ERROR, and sort the results by timestamp.
    - id: b
      text:
        en: |-
          Create a subscription filter with the ERROR pattern on each log group that sends events to a Lambda function that prints them to a console.
    - id: c
      text:
        en: |-
          Create a metric filter with the ERROR pattern on each log group, and watch the metric on a CloudWatch dashboard with auto refresh.
    - id: d
      text:
        en: |-
          Start a CloudWatch Logs Live Tail session on the four log groups with the ERROR filter pattern, and add timeout as a highlight term.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Live Tail streams new log events in near real time as they are ingested, can follow up to 10 log groups in one console session, filters with filter patterns, and highlights terms. It is billed per minute of session and needs no resources to create or clean up.
  options:
    a:
      en: |-
        Re-running a Logs Insights query is manual polling, not a stream of events as they arrive, and it does not highlight terms.
    b:
      en: |-
        Subscription filters and a Lambda function are resources that must be created and deleted, which the engineer wants to avoid.
    c:
      en: |-
        A metric filter only counts matching events; it does not show the log events themselves, and it is a resource to create and delete.
references:
  - title: Troubleshoot with CloudWatch Logs Live Tail - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_LiveTail.html
