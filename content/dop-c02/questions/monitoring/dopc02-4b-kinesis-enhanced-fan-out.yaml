id: dopc02-4b-kinesis-enhanced-fan-out
objective: "4.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company sends application logs from Amazon CloudWatch Logs to an Amazon Kinesis data stream in provisioned mode through a subscription filter. Three AWS Lambda functions read the stream with standard event source mappings: one archives logs, one updates metrics, and one detects fraud patterns. The stream's write capacity is sufficient, but the consumers share the read throughput of each shard, and the fraud detection function now processes records with several seconds of delay. The fraud team requires the lowest possible read latency for its function, without affecting the other consumers and without changing the producers. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Double the number of shards in the stream so that the three functions share a larger total read throughput.
    - id: b
      text:
        en: |-
          Register an enhanced fan-out consumer on the stream and map the fraud detection function to that consumer's ARN instead of the stream ARN.
    - id: c
      text:
        en: |-
          Increase the batch size and the batching window of the fraud detection function's event source mapping so that it reads more records per call.
    - id: d
      text:
        en: |-
          Set the ParallelizationFactor of the fraud detection function's event source mapping to 10 so that it reads each shard with more concurrent invocations.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An enhanced fan-out consumer gets a dedicated connection with up to 2 MB per second per shard, independent of the other consumers, and records are pushed over HTTP/2 with lower latency than polling. Lambda can use such a consumer as the event source, so only the fraud detection function changes.
  options:
    a:
      en: |-
        More shards add shared read capacity at a higher cost, but the function still polls in competition with the other consumers and gets no dedicated throughput.
    c:
      en: |-
        A larger batch and a batching window make the function wait to collect records, which increases latency instead of reducing it.
    d:
      en: |-
        A parallelization factor processes a shard's batches concurrently after they are read; the function still shares the shard's read throughput with the other consumers.
references:
  - title: Develop enhanced fan-out consumers with dedicated throughput - Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/streams/latest/dev/enhanced-consumers.html
  - title: Using Lambda to process records from Amazon Kinesis Data Streams - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
