id: dopc02-4a-metric-stream-partner
objective: "4.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a third-party observability platform that is listed as a quick partner setup destination for CloudWatch metric streams. Today a scheduled Lambda function calls the GetMetricData API every 10 minutes for all namespaces and posts the results to the platform. The data arrives late, the function is throttled as the number of metrics grows, and new metrics must be added to its code by hand. The company wants all current and future CloudWatch metrics in the platform in near real time.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Run the Lambda function every minute instead of every 10 minutes, and request a higher GetMetricData API quota for the account.
    - id: b
      text:
        en: |-
          Create a metric stream with the quick partner setup for the platform that streams all metrics, providing the platform's destination URL and API key.
    - id: c
      text:
        en: |-
          Create a CloudWatch Logs subscription filter on every log group that sends the events to the platform through an Amazon Data Firehose stream.
    - id: d
      text:
        en: |-
          Export the metrics every hour with a CloudWatch Logs export task to Amazon S3, and configure the platform to import the objects from the bucket.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A metric stream sends CloudWatch metrics continuously, with near-real-time delivery, through Amazon Data Firehose. The quick partner setup needs only the destination URL and API key, and a stream of all metrics automatically includes metrics created later.
  options:
    a:
      en: |-
        Polling more often still adds delay, makes throttling worse, and keeps the custom code and the manual metric list.
    c:
      en: |-
        Subscription filters send log events, not CloudWatch metrics, so the platform would not receive the metrics.
    d:
      en: |-
        Export tasks apply to log groups, not to metrics, and an hourly batch is not near real time.
references:
  - title: Use metric streams - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Metric-Streams.html
