id: dopc02-4a-logs-data-protection-masking
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company's applications in one AWS account write to more than 300 CloudWatch Logs log groups, and teams create new log groups every week. A security review found credit card numbers in some log events. Developers must keep querying the logs with CloudWatch Logs Insights, but they must not see credit card numbers in the console, in query results, or in events sent by subscription filters. Only a fraud investigation role must be able to see the original values. The company cannot change the applications this quarter.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create an account-level CloudWatch Logs data protection policy that masks the credit card number managed data identifier, and grant logs:Unmask only to the fraud investigation role.
    - id: b
      text:
        en: |-
          Associate a customer managed AWS KMS key with every log group, and allow kms:Decrypt only for the fraud investigation role in the key policy.
    - id: c
      text:
        en: |-
          Enable Amazon Macie automated sensitive data discovery for the account so that Macie masks credit card numbers in the CloudWatch Logs log groups.
    - id: d
      text:
        en: |-
          Add a subscription filter to every log group that sends events to a Lambda function, which writes a redacted copy to new log groups that the developers use.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A data protection policy detects sensitive data with managed data identifiers, such as credit card numbers, and masks it when events are ingested. An account-level policy covers existing and future log groups, masked data stays masked in Logs Insights and subscription filters, and only principals with logs:Unmask can view the original values.
  options:
    b:
      en: |-
        KMS encryption protects the data at rest but does not mask values inside log events: a principal who can read the events sees the full numbers, and one who cannot read them cannot query the logs at all.
    c:
      en: |-
        Macie discovers sensitive data in Amazon S3; it does not scan or mask CloudWatch Logs events.
    d:
      en: |-
        Custom redaction code for 300 log groups and every new log group is high overhead, and the original log groups still hold the unmasked values.
references:
  - title: Help protect sensitive log data with masking - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
