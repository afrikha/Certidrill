id: dopc02-4b-alarm-metric-math-error-rate
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function handles between 200 and 60,000 invocations per 5 minutes depending on the time of day. Its CloudWatch alarm fires when the Errors metric has a Sum greater than 50 over 5 minutes. The alarm fires during peaks even though only a tiny share of requests fail, and it misses serious failures at night when traffic is low. The service owner wants an alarm that fires when more than 2% of invocations fail over 5 minutes, without changing the function code. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an alarm on a metric math expression 100 * e / i, where e is Errors and i is Invocations, both with the Sum statistic and a 5-minute period, with a threshold greater than 2.
    - id: b
      text:
        en: |-
          Add code to the function that publishes a custom ErrorRate metric with PutMetricData, and create an alarm on that metric with a threshold greater than 2.
    - id: c
      text:
        en: |-
          Create one alarm on Errors and one alarm on Invocations, and combine them in a composite alarm whose rule divides the two alarm values.
    - id: d
      text:
        en: |-
          Create an alarm on a SEARCH expression that returns the Errors and Invocations metrics of the function, with a threshold greater than 2.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A metric alarm can watch a metric math expression that combines several metrics into one time series. Dividing the Sum of Errors by the Sum of Invocations for the same period gives the error rate that AWS documents for Lambda, so the alarm fires on the share of failures regardless of the traffic level.
  options:
    b:
      en: |-
        Publishing a custom metric requires changing the function code, which the service owner wants to avoid.
    c:
      en: |-
        A composite alarm evaluates only the states of its child alarms; it cannot do arithmetic on metric values.
    d:
      en: |-
        Alarms cannot be based on a SEARCH expression, and the expression would return two time series instead of one rate.
references:
  - title: Create a CloudWatch alarm based on a metric math expression - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Create-alarm-on-metric-math-expression.html
  - title: Types of metrics for Lambda Event Functions - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-types.html
