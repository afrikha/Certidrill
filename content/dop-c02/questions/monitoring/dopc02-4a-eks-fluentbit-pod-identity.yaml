id: dopc02-4a-eks-fluentbit-pod-identity
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs 12 Amazon EKS clusters on managed node groups of Amazon EC2 Linux instances. A Fluent Bit DaemonSet in the amazon-cloudwatch namespace of each cluster sends container logs to CloudWatch Logs. Today the node IAM role has the CloudWatch Logs write permissions, so every pod on a node can obtain them through the instance metadata service. The security team requires that only the Fluent Bit pods get these permissions, that one IAM role trust policy works for all 12 clusters without listing each cluster, and that no IAM OIDC identity provider is created per cluster.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM OIDC identity provider for each cluster, and annotate the Fluent Bit service account with an IAM role whose trust policy lists the 12 providers.
    - id: b
      text:
        en: |-
          Create an IAM user with the CloudWatch Logs write permissions, and store its access keys in a Kubernetes secret that the Fluent Bit pods mount.
    - id: c
      text:
        en: |-
          Keep the permissions on the node IAM role, and add a Kubernetes network policy that blocks access to the instance metadata service from pods other than Fluent Bit.
    - id: d
      text:
        en: |-
          Install the EKS Pod Identity Agent add-on, create a role that trusts pods.eks.amazonaws.com, associate it with the Fluent Bit service account in each cluster, and remove the permissions from the node role.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      EKS Pod Identity associates an IAM role with a Kubernetes service account, so only pods that use that service account receive its credentials. The role trusts the single pods.eks.amazonaws.com principal, which works across clusters without an OIDC provider per cluster, and Pod Identity is supported on EC2 Linux worker nodes.
  options:
    a:
      en: |-
        IAM roles for service accounts need an OIDC identity provider per cluster and a trust policy that references each one, which the security team forbids.
    b:
      en: |-
        Long-term access keys in a Kubernetes secret must be rotated and protected manually, and they are not least-privilege credentials scoped by AWS to a service account.
    c:
      en: |-
        The permissions stay on the node role, which any pod or process with metadata access could use; a network policy is not an IAM boundary, and pods with hostNetwork bypass it.
references:
  - title: Learn how EKS Pod Identity grants pods access to AWS services - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
