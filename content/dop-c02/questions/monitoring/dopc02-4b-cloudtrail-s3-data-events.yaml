id: dopc02-4b-cloudtrail-s3-data-events
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company has an organization trail in AWS CloudTrail that logs management events to an Amazon S3 bucket in a log archive account. An auditor asks who downloaded objects from the bucket named claims-scans in the last week, and the security team finds no record of these downloads in the trail. From now on, the team must record every object download from claims-scans in the existing trail, and it wants to keep CloudTrail costs as low as possible. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable CloudTrail Insights on the trail for API call rate and API error rate, so that unusual download activity on the bucket is recorded.
    - id: b
      text:
        en: |-
          Add an advanced event selector to the trail for data events with resources.type AWS::S3::Object, resources.ARN starting with the claims-scans bucket ARN, and eventName GetObject.
    - id: c
      text:
        en: |-
          Configure the trail to log read and write management events in addition to the write management events that it logs today.
    - id: d
      text:
        en: |-
          Add an advanced event selector to the trail for data events with resources.type AWS::S3::Object and no other condition, so that all object operations are logged.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Object-level operations such as GetObject are data events, which trails do not log by default and which are charged separately. An advanced event selector can limit data events to one resource type, an ARN prefix with StartsWith, and specific event names, so the trail records only the downloads from claims-scans.
  options:
    a:
      en: |-
        Insights events report unusual API call or error rates; they do not record each download and the identity behind it.
    c:
      en: |-
        GetObject is a data event, not a read management event, so it would still not be logged.
    d:
      en: |-
        This logs every object operation on every bucket in the organization, which costs much more than the single event and bucket that are needed.
references:
  - title: Logging data events - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
