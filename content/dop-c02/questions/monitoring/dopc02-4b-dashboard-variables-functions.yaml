id: dopc02-4b-dashboard-variables-functions
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs 35 AWS Lambda functions that each need the same troubleshooting view: invocations, errors, duration percentiles, throttles, and concurrent executions. On-call engineers use the CloudWatch console and must be able to switch the view from one function to another in seconds, and each view must show only the selected function. New functions are added every month. The team wants the LEAST effort to build and maintain the dashboard. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Generate one dashboard per function with an AWS CloudFormation template, and add a new stack to the pipeline every time a function is created.
    - id: b
      text:
        en: |-
          Create one dashboard whose widgets use a SEARCH expression on the AWS/Lambda namespace, so that every widget shows all the functions at the same time.
    - id: c
      text:
        en: |-
          Create one dashboard with a separate row of widgets for each Lambda function, and share it with the on-call engineers by using a public link.
    - id: d
      text:
        en: |-
          Create one dashboard and add a property dashboard variable on the FunctionName dimension, so that the engineers select the function to display in all widgets.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A property variable changes every instance of a property, such as the FunctionName dimension, in all the widgets of the dashboard from an input in the dashboard itself. One set of widgets therefore serves every function, including new ones, and the engineers switch between functions in seconds.
  options:
    a:
      en: |-
        Thirty-five dashboards and a new stack for each function work, but they are far more to build and maintain than one dashboard with a variable.
    b:
      en: |-
        A SEARCH expression displays all the functions together, so a view cannot be limited to the selected function.
    c:
      en: |-
        One row per function shows every function at once and needs a new row for each new function, and a public link exposes the account's metrics to anyone who has it.
references:
  - title: Creating flexible CloudWatch dashboards with dashboard variables - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_dashboard_variables.html
