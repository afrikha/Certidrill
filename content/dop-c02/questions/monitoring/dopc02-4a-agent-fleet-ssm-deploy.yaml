id: dopc02-4a-agent-fleet-ssm-deploy
objective: "4.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs 400 existing Amazon EC2 instances that are managed nodes in AWS Systems Manager. Their instance profile role has the AmazonSSMManagedInstanceCore and CloudWatchAgentServerPolicy managed policies. The company must install the CloudWatch agent on all instances and apply one standard agent configuration that the platform team can update centrally later. The instances must not be replaced or rebooted, and the team wants to use AWS managed documents.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add the agent installation and configuration commands to the user data of the launch template, and update the launch template's default version.
    - id: b
      text:
        en: |-
          Store the agent configuration in a Parameter Store parameter whose name starts with AmazonCloudWatch-, by using an administrator role that can write it.
    - id: c
      text:
        en: |-
          Store the agent configuration as a secret in AWS Secrets Manager, and grant the instance profile role secretsmanager:GetSecretValue on the secret.
    - id: d
      text:
        en: |-
          Use Run Command with the AWS-RunPatchBaseline document to install the CloudWatch agent package from the operating system's patch repositories.
    - id: e
      text:
        en: |-
          Use Run Command with AWS-ConfigureAWSPackage to install AmazonCloudWatchAgent, then with AmazonCloudWatch-ManageAgent to configure the agent from Parameter Store and restart it.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      The agent configuration can be stored in Parameter Store, and CloudWatchAgentServerPolicy lets instances read parameters named AmazonCloudWatch-*. AWS-ConfigureAWSPackage installs the agent on running managed nodes, and AmazonCloudWatch-ManageAgent with the configure action and the ssm configuration source applies the stored configuration; rerunning it later applies central updates.
  options:
    a:
      en: |-
        User data runs at launch, so the 400 existing instances would have to be replaced, which is not allowed.
    c:
      en: |-
        AmazonCloudWatch-ManageAgent reads the agent configuration from Parameter Store, not from Secrets Manager.
    d:
      en: |-
        AWS-RunPatchBaseline scans for and installs operating system patches from a patch baseline; it is not the way to install and configure the CloudWatch agent.
references:
  - title: Install the CloudWatch agent using AWS Systems Manager - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/installing-cloudwatch-agent-ssm.html
  - title: CloudWatchAgentServerPolicy - AWS Managed Policy
    url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/CloudWatchAgentServerPolicy.html
