id: dopc02-4c-asg-ebs-health-check
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs batch workers in an Auto Scaling group of Nitro-based Amazon EC2 instances that pull jobs from an Amazon SQS queue. There is no load balancer. Sometimes an attached Amazon EBS data volume stops completing I/O. The worker on that instance hangs, but the instance keeps passing its EC2 system and instance status checks and stays InService, so the group never replaces it. The company wants such instances to be replaced automatically, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the StatusCheckFailed_System metric of each instance with the EC2 recover action.
    - id: b
      text:
        en: |-
          Turn on Amazon EBS health checks for the Auto Scaling group in addition to its EC2 status checks, with a suitable health check grace period.
    - id: c
      text:
        en: |-
          Change the health check type of the Auto Scaling group to Elastic Load Balancing, and set the health check grace period to 300 seconds.
    - id: d
      text:
        en: |-
          Install a script on each instance that tests the data volume every minute and calls SetInstanceHealth to mark the instance Unhealthy after a failure.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With EBS health checks turned on, EC2 Auto Scaling receives the results of the status checks on the instance's attached EBS volumes. If a volume isn't reachable or fails its I/O status checks, the instance is considered unhealthy and the group replaces it. These checks are available for Nitro-based instances and are turned on with the EBS health check type.
  options:
    a:
      en: |-
        The system status check keeps passing in this case, and the recover action addresses host problems on individual instances, not impaired EBS volumes.
    c:
      en: |-
        There is no load balancer, so there are no Elastic Load Balancing health checks to use.
    d:
      en: |-
        A custom health script works, but it is code to deploy and maintain when a built-in health check type exists.
references:
  - title: "Monitor Auto Scaling instances with impaired Amazon EBS volumes using health checks - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/monitor-and-replace-instances-with-impaired-ebs-volumes.html
  - title: "Health checks for instances in an Auto Scaling group - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html
