id: dopc02-4a-s3-log-lifecycle
objective: "4.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores Application Load Balancer access logs, all larger than 1 MB, in an S3 bucket in the S3 Standard storage class. Engineers query the logs with Amazon Athena during the first 365 days. After that, the logs are kept only for audits, which give at least 3 days' notice, so a retrieval time of up to 48 hours is acceptable. A regulation requires that the logs are deleted 2,555 days after they are written. The company wants the lowest storage cost and no manual work.

    Which combination of S3 Lifecycle actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Transition objects to S3 Glacier Instant Retrieval 365 days after creation.
    - id: b
      text:
        en: |-
          Transition objects to S3 Glacier Deep Archive 365 days after creation.
    - id: c
      text:
        en: |-
          Transition objects to S3 Glacier Flexible Retrieval 365 days after creation.
    - id: d
      text:
        en: |-
          Place an S3 Object Lock legal hold on objects 2,555 days after creation.
    - id: e
      text:
        en: |-
          Expire objects 2,555 days after creation.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      S3 Glacier Deep Archive is the lowest-cost storage class, and its bulk retrievals complete within 48 hours, which the audit notice allows. An expiration action deletes the objects 2,555 days after creation without manual work, long after the 180-day minimum storage duration of Deep Archive.
  options:
    a:
      en: |-
        Glacier Instant Retrieval returns data in milliseconds but costs more to store than Deep Archive, and fast access is not needed after 365 days.
    c:
      en: |-
        Glacier Flexible Retrieval works but costs more to store than Deep Archive, and its faster retrievals are not needed.
    d:
      en: |-
        A legal hold prevents deletion instead of deleting the objects, which is the opposite of the regulation.
references:
  - title: Transitioning objects using Amazon S3 Lifecycle - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
  - title: Understanding archive retrieval options - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html
