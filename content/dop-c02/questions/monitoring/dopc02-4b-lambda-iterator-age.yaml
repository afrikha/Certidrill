id: dopc02-4b-lambda-iterator-age
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function processes clickstream records from an Amazon Kinesis data stream through an event source mapping. Every few weeks, a traffic surge causes the function to process records much later than they were written, and the downstream dashboards show stale data for hours. The function reports no errors and no throttles during these periods. The DevOps team wants an Amazon CloudWatch alarm that detects that the processing is falling behind the stream as early as possible. Which metric should the alarm use?
body:
  options:
    - id: a
      text:
        en: |-
          The Duration metric of the function, with the Maximum statistic.
    - id: b
      text:
        en: |-
          The ConcurrentExecutions metric of the function, with the Maximum statistic.
    - id: c
      text:
        en: |-
          The IncomingRecords metric of the stream, with the Sum statistic.
    - id: d
      text:
        en: |-
          The IteratorAge metric of the function, with the Maximum statistic.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      For Kinesis, DynamoDB, and Amazon DocumentDB event sources, IteratorAge measures the time between when the stream receives a record and when the event source mapping sends it to the function. A growing IteratorAge means that the function is falling behind the stream, even when there are no errors or throttles.
  options:
    a:
      en: |-
        Duration shows how long each invocation runs; it can stay normal while records wait longer and longer in the stream.
    b:
      en: |-
        ConcurrentExecutions shows how many instances are processing events; it does not show how old the records are when they are processed.
    c:
      en: |-
        IncomingRecords shows the write volume of the stream, which rises during a surge whether or not the consumer keeps up.
references:
  - title: Types of metrics for Lambda Event Functions - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-types.html
