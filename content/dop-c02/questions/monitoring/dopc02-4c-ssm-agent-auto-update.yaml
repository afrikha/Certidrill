id: dopc02-4c-ssm-agent-auto-update
objective: "4.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 1,500 Amazon EC2 instances that are managed nodes in AWS Systems Manager in one account and Region. The instances run many different versions of SSM Agent, because teams launch them from AMIs of different ages. The company wants SSM Agent on every managed node to be updated automatically to the latest version on a regular schedule, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Ask each team to rebuild its AMIs every month with the latest version of SSM Agent and to replace its running instances.
    - id: b
      text:
        en: |-
          Turn on the Auto update SSM Agent setting in Fleet Manager, which checks for a new agent version every two weeks and updates the agent.
    - id: c
      text:
        en: |-
          Run the AWS-UpdateSSMAgent document with Run Command on all managed nodes each time AWS announces a new version of SSM Agent.
    - id: d
      text:
        en: |-
          Create an EventBridge Scheduler schedule that invokes a Lambda function every two weeks, which runs AWS-UpdateSSMAgent on all managed nodes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Auto update SSM Agent setting in Fleet Manager makes Systems Manager check for a new version every two weeks and update SSM Agent on all managed nodes in the account and Region. It creates the State Manager association for you, so there is nothing else to build or run.
  options:
    a:
      en: |-
        Rebuilding AMIs and replacing instances every month is a large recurring effort, and agents still fall behind between rebuilds.
    c:
      en: |-
        This is a manual step that depends on someone watching for new versions.
    d:
      en: |-
        This works, but it is custom code and scheduling for something that a built-in setting already does.
references:
  - title: "Automating updates to SSM Agent - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/ssm-agent-automatic-updates.html
