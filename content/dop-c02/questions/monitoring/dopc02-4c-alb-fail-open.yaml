id: dopc02-4c-alb-fail-open
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in two Availability Zones behind an Application Load Balancer. The target group health check calls /health, which returns HTTP 503 when the application can't reach its shared database. During a 40-minute database outage, every target in both Availability Zones failed its health checks at the same time. The team expected the load balancer to stop sending requests to the targets. However, the access logs show that every target kept receiving requests during the whole outage.

    Which statement explains this behavior?
body:
  options:
    - id: a
      text:
        en: |-
          When every registered target of the target group is unhealthy in all enabled Availability Zones, the load balancer fails open and routes requests to all targets.
    - id: b
      text:
        en: |-
          The default unhealthy threshold count of the target group requires 5 consecutive failed checks, so the targets were not marked unhealthy during the outage.
    - id: c
      text:
        en: |-
          The deregistration delay of the target group keeps routing new requests to unhealthy targets until the delay of 300 seconds expires for each target.
    - id: d
      text:
        en: |-
          Cross-zone load balancing is turned on, so each load balancer node ignores the health status of the registered targets in the other Availability Zone.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      If a target group contains only unhealthy registered targets, the Application Load Balancer routes requests to all of them, regardless of health status: it fails open when all targets fail health checks at the same time in all enabled Availability Zones. This is why deep health checks on a shared dependency are risky: one dependency failure makes every target unhealthy at once.
  options:
    b:
      en: |-
        The default unhealthy threshold is 2 consecutive failures with a 30-second interval, so the targets were marked unhealthy about a minute into the outage.
    c:
      en: |-
        The deregistration delay applies to targets that are being deregistered (draining), not to registered targets that fail health checks.
    d:
      en: |-
        Cross-zone load balancing distributes traffic across zones, but load balancer nodes still route only to healthy targets when at least one is healthy.
references:
  - title: "Health checks for Application Load Balancer target groups - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
