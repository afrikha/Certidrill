id: dopc02-4a-sns-encrypted-alarm-topic
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company sends CloudWatch alarm notifications to an Amazon SNS topic that pages the on-call engineers. A compliance review requires every SNS topic to be encrypted at rest, so a DevOps engineer enabled server-side encryption on the topic with the AWS managed key aws/sns. Since then, the alarms change state as expected, but no notification reaches the subscribers, and the alarm history shows failed actions. Messages published manually by an administrator are delivered. The topic must remain encrypted.

    What should the DevOps engineer do?
body:
  options:
    - id: a
      text:
        en: |-
          Add a statement to the topic's access policy that allows cloudwatch.amazonaws.com to call sns:Publish, and keep the aws/sns key.
    - id: b
      text:
        en: |-
          Edit the key policy of aws/sns to allow cloudwatch.amazonaws.com to use kms:GenerateDataKey* and kms:Decrypt.
    - id: c
      text:
        en: |-
          Grant the IAM role that created the alarms kms:Decrypt and kms:GenerateDataKey* on aws/sns, and re-create the alarm actions.
    - id: d
      text:
        en: |-
          Encrypt the topic with a customer managed key whose key policy allows cloudwatch.amazonaws.com to use kms:GenerateDataKey* and kms:Decrypt.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When an AWS service such as CloudWatch publishes to an encrypted topic, the KMS key policy must allow the service principal to use kms:GenerateDataKey* and kms:Decrypt. The key policy of an AWS managed key cannot be modified, so the topic must use a customer managed key with that statement, optionally restricted with aws:SourceAccount and aws:SourceArn.
  options:
    a:
      en: |-
        Administrators can publish, so the topic policy is not the problem; CloudWatch fails because it cannot use the KMS key that encrypts the topic.
    b:
      en: |-
        AWS managed keys have key policies that AWS manages; you cannot edit the aws/sns key policy.
    c:
      en: |-
        Alarm actions are performed by the CloudWatch service principal, not by the role that created the alarm, so permissions on that role change nothing.
references:
  - title: Managing Amazon SNS encryption keys and costs - Amazon Simple Notification Service
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-key-management.html
