id: dopc02-4b-anomaly-below-band-orders
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company publishes a custom CloudWatch metric named OrdersPlaced every minute. Order volume varies by hour and by day of the week, and marketing campaigns regularly cause large, expected spikes. A silent checkout failure last month caused orders to fall far below normal for 40 minutes before anyone noticed. The DevOps team must be notified when orders fall unexpectedly, and campaign spikes must not create notifications. Which alarm configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          An anomaly detection alarm on OrdersPlaced with the threshold type Lower than the band, which notifies an Amazon SNS topic.
    - id: b
      text:
        en: |-
          An anomaly detection alarm on OrdersPlaced with the threshold type Greater than the band, which notifies an Amazon SNS topic.
    - id: c
      text:
        en: |-
          An anomaly detection alarm on OrdersPlaced with the threshold type Outside of the band, which notifies an Amazon SNS topic.
    - id: d
      text:
        en: |-
          A static threshold alarm on OrdersPlaced that fires when the Sum over 5 minutes is lower than the lowest value observed last week.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An anomaly detection alarm can fire when the metric is above the band, below the band, or outside it in either direction. Choosing only below the band catches unexpected drops at any time of day while ignoring values above the band, such as campaign spikes.
  options:
    b:
      en: |-
        This alarm fires on unexpected increases, such as campaign spikes, and never on the drops that the team must detect.
    c:
      en: |-
        Alarming in both directions also notifies the team during campaign spikes, which the requirements exclude.
    d:
      en: |-
        The lowest value of last week is typically a night value, so a drop during the day stays above it and goes unnoticed.
references:
  - title: Using CloudWatch anomaly detection - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
