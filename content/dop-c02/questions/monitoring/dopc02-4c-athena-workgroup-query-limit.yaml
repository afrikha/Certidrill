id: dopc02-4c-athena-workgroup-query-limit
objective: "4.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores Application Load Balancer access logs in an Amazon S3 bucket, and analysts query them with Amazon Athena. The table is partitioned by day, but some analysts forget to filter on the partition column, and single queries have scanned several terabytes of data. The finance team requires that any individual query that scans more than 500 GB is stopped automatically. Analysts must still be able to run every query that stays under that limit, at any time.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a workgroup for the analysts with a per-workgroup data usage control of 500 GB per hour that sends an Amazon SNS notification to the finance team when it is reached.
    - id: b
      text:
        en: |-
          Create a workgroup for the analysts with a per-query data usage control limit of 500 GB, and allow the analysts to run queries only in that workgroup.
    - id: c
      text:
        en: |-
          Create a workgroup for the analysts with a per-workgroup data usage control of 500 GB per day whose action disables the workgroup when the threshold is reached.
    - id: d
      text:
        en: |-
          Create an S3 Lifecycle rule that transitions access logs older than 30 days to the S3 Glacier Flexible Retrieval storage class so that queries cannot scan them.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A per-query data usage control limit applies to each query that runs in the workgroup: a query that exceeds the limit is canceled, and this action can't be changed. Queries under the limit run normally. Restricting the analysts to that workgroup with IAM makes the limit apply to all of their queries.
  options:
    a:
      en: |-
        Per-workgroup controls measure the total data scanned by all queries over a period and trigger alarm actions such as SNS notifications; they don't cancel the query that crosses the threshold.
    c:
      en: |-
        Disabling the workgroup stops further queries for every analyst, including small ones, and it doesn't cancel an individual query that scans more than 500 GB.
    d:
      en: |-
        Changing the storage class of older logs doesn't limit what a single query scans; a query on recent data can still exceed 500 GB, and analysts lose easy access to older logs.
references:
  - title: "Configure per-query and per-workgroup data usage controls - Amazon Athena"
    url: https://docs.aws.amazon.com/athena/latest/ug/workgroups-setting-control-limits-cloudwatch.html
