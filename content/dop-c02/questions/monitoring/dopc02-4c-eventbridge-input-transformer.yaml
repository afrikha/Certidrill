id: dopc02-4c-eventbridge-input-transformer
objective: "4.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon EventBridge rule matches EC2 Instance State-change Notification events for the stopped and terminated states. The rule targets an Amazon SNS topic that has email subscriptions. The operations team complains that each email contains the full event as raw JSON. The team wants each email to contain one readable sentence with the instance ID, the new state, and the time of the event, without any additional code to maintain.

    What should a DevOps engineer do?
body:
  options:
    - id: a
      text:
        en: |-
          Add a subscription filter policy to each email subscription that keeps only the instance ID, state, and time fields of the message.
    - id: b
      text:
        en: |-
          Replace the SNS target with an AWS Lambda function that builds the sentence from the event and publishes it to the SNS topic.
    - id: c
      text:
        en: |-
          Change the event pattern of the rule so that it matches only the instance-id, state, and time fields in the detail of the event.
    - id: d
      text:
        en: |-
          Configure an input transformer on the rule's target that maps the instance ID, state, and time to variables and uses them in an input template.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An input transformer customizes what EventBridge sends to a target: the input path defines variables from JSON paths in the event, and the input template builds a string or JSON from them. A text template such as "Instance <instance> changed to <state> at <time>" turns each event into a readable email without code.
  options:
    a:
      en: |-
        A filter policy decides which messages a subscription receives; it doesn't change the content of the message.
    b:
      en: |-
        A Lambda function works, but it is code to maintain, which the team wants to avoid.
    c:
      en: |-
        An event pattern only selects which events match the rule; the target still receives the full event.
references:
  - title: "Amazon EventBridge input transformation - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-transform-target-input.html
