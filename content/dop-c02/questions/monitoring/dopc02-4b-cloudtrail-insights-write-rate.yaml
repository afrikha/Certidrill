id: dopc02-4b-cloudtrail-insights-write-rate
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's trail in AWS CloudTrail logs read and write management events to an Amazon S3 bucket, and analysts query these logs with Amazon Athena tables. After a credential leak in another business unit, the security team wants to detect unusual spikes in the volume of write API calls, such as a burst of RunInstances or CreateAccessKey calls, without defining thresholds for each API. The detections must be stored as CloudTrail events next to the existing trail data so that the analysts can query them in the same way. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch Logs metric filter for each sensitive API name on the trail's log group, and add an anomaly detection alarm to each metric.
    - id: b
      text:
        en: |-
          Enable Amazon GuardDuty in the account and export its findings to the trail's S3 bucket with an Amazon EventBridge rule and Amazon Data Firehose.
    - id: c
      text:
        en: |-
          Enable CloudTrail Insights on the trail for the API call rate of management events.
    - id: d
      text:
        en: |-
          Create an AWS Config periodic rule that counts the IAM access keys and EC2 instances in the account and reports NON_COMPLIANT when the counts increase.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CloudTrail Insights builds a baseline of the write management API call volume per API and generates Insights events when the current rate deviates from it, so no threshold has to be defined. Insights events are CloudTrail events that the trail delivers with its other logs; the trail must log write management events, which it already does.
  options:
    a:
      en: |-
        A metric filter is needed for every API to watch, which the team wants to avoid, and alarms are not stored as CloudTrail events.
    b:
      en: |-
        GuardDuty findings are a different format from CloudTrail events and need an export pipeline, which does not meet the requirement to store CloudTrail events.
    d:
      en: |-
        A periodic count of resources does not measure API call rates, and its results are Config evaluations, not CloudTrail events.
references:
  - title: Working with CloudTrail Insights - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-insights-events-with-cloudtrail.html
