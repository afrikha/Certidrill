id: dopc02-4a-metric-filter-json-latency
objective: "4.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An API that runs on AWS Lambda writes one JSON log event per request to its CloudWatch Logs log group, for example {"route": "/checkout", "status": 200, "latencyMs": 184}. The latencies are always positive. The site reliability team wants an alarm when the 99th percentile latency of the /checkout route exceeds 800 ms for 3 consecutive minutes. The team does not want to change the function code or deploy additional resources that run code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a metric filter with the pattern { $.route = "/checkout" } and a metric value of 1, and create an alarm on the Average of the metric with a threshold of 800.
    - id: b
      text:
        en: |-
          Create a CloudWatch Logs Insights query that computes pct(latencyMs, 99) for the /checkout route, and add the query to the team's operations dashboard.
    - id: c
      text:
        en: |-
          Create a Contributor Insights rule on the log group that uses latencyMs as the value, and create an alarm on the rule's maximum contributor value.
    - id: d
      text:
        en: |-
          Create a metric filter with the pattern { $.route = "/checkout" } and the metric value $.latencyMs, and create an alarm on the p99 statistic with 3 of 3 one-minute periods above 800.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A JSON metric filter can select events by field value and publish a field such as $.latencyMs as the metric value. Because each event becomes a raw data point, CloudWatch can compute percentiles, as long as no value is negative, so an alarm on p99 over three one-minute periods meets the requirement without code.
  options:
    a:
      en: |-
        A metric value of 1 counts requests; it does not record latency, so no percentile of latency can be computed.
    b:
      en: |-
        A Logs Insights query on a dashboard shows the percentile when someone looks; it does not create the metric that an alarm evaluates every minute.
    c:
      en: |-
        Contributor Insights ranks the largest contributors to a value; the maximum contributor is not the 99th percentile of all requests.
references:
  - title: Creating metrics from log events using filters - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/MonitoringLogData.html
