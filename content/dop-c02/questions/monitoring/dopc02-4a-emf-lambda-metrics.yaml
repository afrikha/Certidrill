id: dopc02-4a-emf-lambda-metrics
objective: "4.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company's AWS Lambda function processes about 2,000 orders per second during sales. For each invocation, the function calls the PutMetricData API to publish three business metrics (OrderValue, SeatsSold, PaymentRetries) with the dimensions EventId and Channel. During peaks, the calls add latency to each invocation and are throttled, so metrics are lost. The team wants the same metrics and dimensions without synchronous metric API calls, without running an agent, and without creating a metric filter for each metric. The detailed order record must stay searchable in CloudWatch Logs.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write each order record to stdout as a JSON log event in the CloudWatch embedded metric format that declares the three metrics and their dimensions.
    - id: b
      text:
        en: |-
          Add the CloudWatch Lambda Insights extension layer to the function so that it collects the three business metrics from each invocation.
    - id: c
      text:
        en: |-
          Buffer the metrics in the function and call PutMetricData with statistic sets once every 1,000 invocations from the same execution environment.
    - id: d
      text:
        en: |-
          Write each order record as a JSON log event, and create one metric filter for each of the three metrics on the function's log group.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With the embedded metric format, the function writes structured logs, and CloudWatch extracts the declared metrics and dimensions asynchronously. No PutMetricData call or agent is needed, only logs:PutLogEvents, which Lambda already uses, and the detailed log events remain searchable with Logs Insights.
  options:
    b:
      en: |-
        Lambda Insights collects system-level metrics of the function, such as CPU and memory; it does not extract custom business metrics.
    c:
      en: |-
        This is still a synchronous metric API call inside the function, and metrics buffered in an execution environment are lost when it is shut down.
    d:
      en: |-
        One metric filter per metric is exactly what the team wants to avoid creating and managing.
references:
  - title: Embedding metrics within logs - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Embedded_Metric_Format.html
