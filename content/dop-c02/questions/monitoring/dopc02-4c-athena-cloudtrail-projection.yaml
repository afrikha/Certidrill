id: dopc02-4c-athena-cloudtrail-projection
objective: "4.2.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's security team analyzes AWS CloudTrail logs with Amazon Athena. A trail in one account has delivered log files from the us-east-1 Region to an S3 bucket for 3 years, under the prefix AWSLogs/111122223333/CloudTrail/us-east-1/ followed by year/month/day folders. The team created the Athena table from the CloudTrail console, and the table has no partitions. Most investigations cover only the last few days, but every query scans all 3 years of logs, so queries are slow and expensive. Each new day of logs must become queryable automatically, without a scheduled job or a manual step. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Glue crawler that runs every day on the CloudTrail prefix to add the new day's partition to the table, and filter queries on the partition columns.
    - id: b
      text:
        en: |-
          Create an EventBridge Scheduler schedule that invokes a Lambda function every day to run ALTER TABLE ADD PARTITION for the new day, and filter queries on that partition.
    - id: c
      text:
        en: |-
          Re-create the table with partition projection on a date-typed timestamp column and a storage.location.template that maps it to the day prefixes, and filter queries on that column.
    - id: d
      text:
        en: |-
          Assign the team to an Athena workgroup with a per-query data usage control limit, so that any query that scans more than the last few days of logs is canceled.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Because CloudTrail logs have a known prefix structure, partition projection lets Athena calculate the partition values and their S3 locations from table properties instead of reading partitions from the AWS Glue Data Catalog. New days are queryable as soon as their logs arrive, with no ALTER TABLE ADD PARTITION, crawler, or job to run. Filtering on the projected date column limits each query to the matching day prefixes, which reduces both runtime and cost.
  options:
    a:
      en: |-
        A daily crawler is a scheduled job that the team must operate, and a new day becomes queryable only after the next crawler run.
    b:
      en: |-
        This is custom code on a schedule, which the requirements exclude; partition projection removes the need to add partitions at all.
    d:
      en: |-
        A per-query limit cancels queries that scan too much data, but it doesn't make queries read only the relevant days, so investigations would simply fail.
references:
  - title: "Create the table for CloudTrail logs in Athena using partition projection - Amazon Athena"
    url: https://docs.aws.amazon.com/athena/latest/ug/create-cloudtrail-table-partition-projection.html
  - title: "Use partition projection with Amazon Athena - Amazon Athena"
    url: https://docs.aws.amazon.com/athena/latest/ug/partition-projection.html
