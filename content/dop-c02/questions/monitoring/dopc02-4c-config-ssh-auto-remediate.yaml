id: dopc02-4c-config-ssh-auto-remediate
objective: "4.3.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's security policy forbids security groups that allow inbound SSH from 0.0.0.0/0 or ::/0. AWS Config records all resource types in the account. The security team wants every noncompliant security group detected and the offending rule removed automatically within minutes of the change, with a compliance history for auditors. The team wants to use AWS managed rules and runbooks and no custom code.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a custom AWS Config rule backed by an AWS Lambda function that inspects the inbound rules of each security group for port 22.
    - id: b
      text:
        en: |-
          Deploy the restricted-ssh AWS Config managed rule, which evaluates security groups when their configuration changes and periodically.
    - id: c
      text:
        en: |-
          Configure automatic remediation on the rule with the AWS-DisablePublicAccessForSecurityGroup runbook, GroupId as the resource ID parameter, and an AutomationAssumeRole.
    - id: d
      text:
        en: |-
          Configure automatic remediation on the rule with the AWS-PublishSNSNotification runbook so that the security team removes the offending rule.
    - id: e
      text:
        en: |-
          Create an Amazon EventBridge rule for AuthorizeSecurityGroupIngress API calls that invokes an AWS Lambda function to revoke the offending rule.
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      The restricted-ssh managed rule marks a security group NON_COMPLIANT when incoming SSH is open to 0.0.0.0/0 or ::/0, and AWS Config keeps its compliance history. The AWS-DisablePublicAccessForSecurityGroup managed runbook disables SSH and RDP ports opened to all IP addresses; with GroupId as the resource ID parameter, AWS Config passes each noncompliant group to it automatically.
  options:
    a:
      en: |-
        A custom Lambda rule is code that the team must write and maintain, while a managed rule exists.
    d:
      en: |-
        This runbook only sends a notification; a person would still have to remove the rule, so the remediation isn't automatic.
    e:
      en: |-
        This is custom code, and it doesn't give the AWS Config compliance history that auditors need.
references:
  - title: "restricted-ssh - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/restricted-ssh.html
  - title: "AWS-DisablePublicAccessForSecurityGroup - AWS Systems Manager Automation Runbook Reference"
    url: https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-aws-disablepublicaccessforsecuritygroup.html
