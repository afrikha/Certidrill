id: dopc02-4c-s3-replicate-logs-central
objective: "4.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 30 application accounts. In each account, an S3 bucket receives the access log files of the account's Application Load Balancers, and the application teams must keep these files in their own bucket. The security team also needs a copy of every new log file in a bucket in the central log archive account, and these copies must be owned by the log archive account. The company wants no custom code and no scheduled jobs.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an S3 event notification in each application bucket that invokes an AWS Lambda function, which copies each new object to the central bucket.
    - id: b
      text:
        en: |-
          Turn on versioning on all buckets, and add a replication rule to each application bucket with the central bucket as the destination and the owner override option.
    - id: c
      text:
        en: |-
          Create an S3 Batch Operations job in each application account every night that copies the objects created that day to the central bucket.
    - id: d
      text:
        en: |-
          Configure the access logs of each load balancer to be delivered to the central bucket instead of the application bucket, with a bucket policy for log delivery.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      S3 Replication copies new objects automatically to a bucket in another account, with no code. The owner override option changes the ownership of the replicas to the account that owns the destination bucket, so the log archive account owns the copies. Replication requires versioning on the source and destination buckets.
  options:
    a:
      en: |-
        This is custom code to deploy and maintain in 30 accounts.
    c:
      en: |-
        A nightly Batch Operations job is a scheduled job, and copies would arrive up to a day late.
    d:
      en: |-
        The application teams would no longer have the log files in their own bucket, which they must keep.
references:
  - title: "Replicating objects within and across Regions - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html
