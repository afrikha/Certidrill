id: dopc02-4b-cloudtrail-event-history
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup has a single AWS account and has not created any trail in AWS CloudTrail yet, and AWS Config is not enabled. This morning, an application lost connectivity because a security group was deleted yesterday afternoon. The DevOps engineer must find out which IAM principal deleted the security group and from which IP address, as quickly as possible and without deploying new resources. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a trail that delivers management events to an Amazon S3 bucket, and query the delivered log files with Amazon Athena.
    - id: b
      text:
        en: |-
          Enable VPC Flow Logs on the VPC, and search the flow log records for the IP address that made the call.
    - id: c
      text:
        en: |-
          Open CloudTrail Event history in the Region of the security group and filter on the DeleteSecurityGroup event name.
    - id: d
      text:
        en: |-
          Use the AWS Config resource timeline of the security group, which shows the IAM principal and source IP address of each change.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CloudTrail Event history is available without any configuration and shows the last 90 days of management events in a Region. DeleteSecurityGroup is a management event, and its record contains the user identity and the source IP address of the caller.
  options:
    a:
      en: |-
        A new trail records only events that occur after it is created, so yesterday's deletion would not be in its log files.
    b:
      en: |-
        Flow logs record network traffic in the VPC, not API calls, and enabling them now does not capture past events.
    d:
      en: |-
        AWS Config is not enabled in this account, and its configuration items describe resource states; the caller identity comes from the related CloudTrail event.
references:
  - title: Working with CloudTrail event history - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
