id: dopc02-4a-cloudtrail-cmk-reader-access
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores the log files of its organization trail in an S3 bucket in a log archive account. To meet a new requirement, a DevOps engineer configured the trail to encrypt log files with SSE-KMS by using a customer managed key in the log archive account, in the same Region as the bucket. New log files are delivered successfully. Security analysts work from a separate audit account through an IAM role whose policy and the bucket policy both allow s3:GetObject on the bucket, but they now receive AccessDenied errors when they open the new log files. Older log files still open.

    What should the DevOps engineer do to restore read access for the analysts?
body:
  options:
    - id: a
      text:
        en: |-
          Allow kms:Decrypt for the analysts' role in the key policy, and add kms:Decrypt on the key ARN to the IAM policy of the role in the audit account.
    - id: b
      text:
        en: |-
          Add s3:GetObjectVersion and s3:ListBucket for the analysts' role to the bucket policy, and enable S3 Versioning on the log bucket.
    - id: c
      text:
        en: |-
          Enable an S3 Bucket Key on the log bucket so that S3 decrypts the log files with a bucket-level key that the bucket policy already covers.
    - id: d
      text:
        en: |-
          Allow kms:GenerateDataKey* for cloudtrail.amazonaws.com in the key policy, with a condition on the analysts' account ID.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Reading SSE-KMS encrypted CloudTrail log files requires S3 read permissions and permission to decrypt with the KMS key. Because the key is in another account, the key policy must allow the analysts' role, and the role's IAM policy in the audit account must also allow kms:Decrypt on the key.
  options:
    b:
      en: |-
        The analysts already have s3:GetObject; the failure comes from the missing KMS permission, which more S3 actions or versioning do not provide.
    c:
      en: |-
        An S3 Bucket Key reduces calls to AWS KMS but still uses the KMS key; readers still need kms:Decrypt on that key.
    d:
      en: |-
        This statement lets CloudTrail encrypt new files, which already works; it gives the analysts no permission to decrypt.
references:
  - title: Encrypting CloudTrail log files, digest files, and event data stores with AWS KMS keys (SSE-KMS) - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/encrypting-cloudtrail-log-files-with-aws-kms.html
