id: dopc02-4c-config-remediation-exception
objective: "4.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys the s3-bucket-public-read-prohibited AWS Config managed rule with an automatic remediation that turns on S3 Block Public Access for noncompliant buckets. A marketing bucket hosts a public website and is reported as NON_COMPLIANT. The bucket must stay public for 30 more days until the website moves to Amazon CloudFront. During that time, AWS Config must keep evaluating the bucket, and all other noncompliant buckets must still be remediated automatically.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Change the remediation of the rule from automatic to manual for 30 days, and remediate the other noncompliant buckets from the console.
    - id: b
      text:
        en: |-
          Tag every bucket except the marketing bucket, and change the scope of the rule to evaluate only the resources that have this tag.
    - id: c
      text:
        en: |-
          Delete the remediation configuration, and create an EventBridge rule that starts the runbook for every noncompliant bucket except the marketing bucket.
    - id: d
      text:
        en: |-
          Add a remediation exception for the marketing bucket on the rule, with an expiration time 30 days from now.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A remediation exception removes a specific resource from auto remediation for a rule, and it is deleted automatically at its expiration time. It can be placed only on NON_COMPLIANT resources, which is the case here. The rule keeps evaluating the bucket, and auto remediation continues for all other buckets.
  options:
    a:
      en: |-
        Manual remediation affects every bucket, so the other buckets would need manual action for 30 days.
    b:
      en: |-
        The rule would stop evaluating the marketing bucket, and every new bucket would need the tag to be evaluated.
    c:
      en: |-
        This replaces a managed feature with custom routing and filtering that the team must build and later undo.
references:
  - title: "PutRemediationExceptions - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/APIReference/API_PutRemediationExceptions.html
