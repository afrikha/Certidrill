id: dopc02-4b-inspector-agent-prerequisites
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company launches Amazon EC2 instances from a custom Amazon Linux AMI that does not include SSM Agent, and the instances have no instance profile. The security team activated Amazon EC2 scanning in Amazon Inspector. The team requires the agent-based scan method so that an instance is scanned again as soon as new software is installed on it, and it wants deep inspection of application packages. Which combination of steps must a DevOps engineer take so that Amazon Inspector can scan these instances with the agent-based method? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Install SSM Agent in the custom AMI and make sure that the agent is running when the instances start.
    - id: b
      text:
        en: |-
          Install the Amazon Inspector Classic agent in the custom AMI and register the instances as an assessment target.
    - id: c
      text:
        en: |-
          Attach an instance profile to the instances with a role that has the AmazonSSMManagedInstanceCore policy.
    - id: d
      text:
        en: |-
          Open inbound TCP port 443 from the Amazon Inspector service in the security group of the instances.
    - id: e
      text:
        en: |-
          Attach an instance profile to the instances with a role that has the AmazonInspector2ReadOnlyAccess policy.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      For agent-based scanning, an instance must be a Systems Manager managed instance: SSM Agent installed and running, and permission for Systems Manager to manage it through an instance profile. AWS recommends the AmazonSSMManagedInstanceCore policy because it includes the permissions for Distributor, Inventory, and State Manager that Amazon Inspector needs.
  options:
    b:
      en: |-
        The Classic agent and assessment targets belong to Amazon Inspector Classic, which was shut down in May 2026; current Amazon Inspector uses SSM Agent.
    d:
      en: |-
        SSM Agent makes outbound connections to Systems Manager; no inbound rule from Amazon Inspector is needed.
    e:
      en: |-
        This policy lets a principal read Amazon Inspector data; it does not let Systems Manager manage the instance, so the instance stays unmanaged.
references:
  - title: Scanning Amazon EC2 instances with Amazon Inspector - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-ec2.html
