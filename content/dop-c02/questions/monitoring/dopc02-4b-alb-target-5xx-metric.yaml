id: dopc02-4b-alb-target-5xx-metric
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an order API on Amazon EC2 instances in a target group behind an Application Load Balancer. The development team wants an Amazon CloudWatch alarm that detects server errors returned by the application code on the instances. Errors that the load balancer itself generates, such as when no healthy target is available, are already covered by another alarm and must not be counted. Which metric and statistic should the alarm use?
body:
  options:
    - id: a
      text:
        en: |-
          HTTPCode_ELB_5XX_Count in the AWS/ApplicationELB namespace with the Sum statistic.
    - id: b
      text:
        en: |-
          TargetConnectionErrorCount in the AWS/ApplicationELB namespace with the Sum statistic.
    - id: c
      text:
        en: |-
          HTTPCode_Target_5XX_Count in the AWS/ApplicationELB namespace with the Sum statistic.
    - id: d
      text:
        en: |-
          HTTPCode_Target_5XX_Count in the AWS/ApplicationELB namespace with the Average statistic.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      HTTPCode_Target_5XX_Count counts the 5xx response codes generated by the targets and excludes those generated by the load balancer. Sum is the useful statistic for this count, because Minimum, Maximum, and Average all return 1.
  options:
    a:
      en: |-
        HTTPCode_ELB_5XX_Count counts the 5xx errors that originate from the load balancer, which the other alarm already covers.
    b:
      en: |-
        TargetConnectionErrorCount counts connections that the load balancer could not establish with targets, not error responses returned by the application.
    d:
      en: |-
        The Average statistic of this count metric always returns 1, so an alarm on it cannot reflect how many errors occurred.
references:
  - title: CloudWatch metrics for your Application Load Balancer - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-cloudwatch-metrics.html
