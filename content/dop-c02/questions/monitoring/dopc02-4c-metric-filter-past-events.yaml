id: dopc02-4c-metric-filter-past-events
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce application writes a line that contains PaymentDeclined to an Amazon CloudWatch Logs log group each time a card payment is declined. The log group keeps events for 30 days. At 10:00 this morning, a DevOps engineer created a metric filter that counts these lines and added the metric to a dashboard. The business team now asks for the number of declined payments per day over the previous 7 days, but the dashboard graph shows no data before 10:00. The team needs the answer today.

    What should the engineer do with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Edit the metric filter and set its default value to 0 so that CloudWatch recalculates the metric for the previous 7 days of events.
    - id: b
      text:
        en: |-
          Delete the metric filter and create it again with the same pattern so that CloudWatch applies it to the events that are already in the log group.
    - id: c
      text:
        en: |-
          Export the last 7 days of the log group to Amazon S3, create an AWS Glue crawler on the export, and count the lines per day with Amazon Athena.
    - id: d
      text:
        en: |-
          Run a CloudWatch Logs Insights query on the log group for the last 7 days that filters on PaymentDeclined and counts the matches in 1-day bins.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Metric filters don't filter data retroactively: they publish data points only for events ingested after the filter is created. The events of the previous 7 days are still in the log group, so a Logs Insights query with a filter and stats count(*) by bin(1d) returns the daily counts directly.
  options:
    a:
      en: |-
        The default value is reported for future periods in which logs are ingested but nothing matches; it doesn't recalculate past data.
    b:
      en: |-
        A re-created filter is still not retroactive; it only counts events ingested after its creation.
    c:
      en: |-
        This works, but the export, the crawler, and the table are much more effort than one query on data that is already in CloudWatch Logs.
references:
  - title: "Creating metrics from log events using filters - Amazon CloudWatch Logs"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/MonitoringLogData.html
