id: dopc02-4b-dashboard-shared-logs-widgets
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company shared an Amazon CloudWatch dashboard with five external partner engineers by using the option that shares a single dashboard with specific email addresses. The dashboard contains metric widgets and two CloudWatch Logs Insights widgets that query the log group /prod/partner-api. The partners can see the metric widgets, but the Logs Insights widgets are not visible to them. The security team requires that the partners be able to read only that log group. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add Logs Insights query and read permissions, scoped to the /prod/partner-api log group, to the IAM role that dashboard sharing created.
    - id: b
      text:
        en: |-
          Share the dashboard publicly so that anyone with the link can view it, because public sharing includes the Logs Insights widgets.
    - id: c
      text:
        en: |-
          Create an IAM user for each partner with the CloudWatchLogsReadOnlyAccess managed policy, and ask the partners to sign in to the console to view the dashboard.
    - id: d
      text:
        en: |-
          Rename the Amazon Cognito user pool that dashboard sharing created, and add the partners to a new group that has access to CloudWatch Logs.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When a dashboard is shared, CloudWatch creates an IAM role for the viewers that does not include CloudWatch Logs permissions, so Logs Insights widgets are not visible by default. Adding the Logs Insights and read actions to that role, scoped to the specific log group ARNs, displays the widgets while limiting access to that log group.
  options:
    b:
      en: |-
        A public dashboard exposes the data to anyone with the link, and it still uses a sharing role that needs the same CloudWatch Logs permissions.
    c:
      en: |-
        The managed policy grants read access to every log group in the account, which violates the requirement, and it replaces the sharing that is already in place.
    d:
      en: |-
        AWS says not to modify the Amazon Cognito and IAM resources that dashboard sharing creates, and Cognito groups do not grant CloudWatch Logs permissions to shared dashboards.
references:
  - title: Sharing CloudWatch dashboards - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-dashboard-sharing.html
