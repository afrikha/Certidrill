id: dopc02-4a-app-signals-eks-slo
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs 25 Java microservices on an Amazon EKS cluster with managed node groups. The operations team monitors only node CPU and memory today and learns about slow API operations from customer complaints. The team needs per-service and per-operation latency, fault, and error metrics, a map of the dependencies between services, and service level objectives (SLOs) with alarms on the checkout operations. The developers will not change the application source code, and the team wants to use AWS managed tooling. The solution must use instrumentation that AWS actively develops.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Add the AWS X-Ray SDK for Java to each microservice, run the X-Ray daemon as a DaemonSet, and create CloudWatch alarms on the X-Ray trace metrics for the checkout operations.
    - id: b
      text:
        en: |-
          Enable Container Insights with enhanced observability on the cluster, and create CloudWatch alarms on the pod CPU, memory, and restart metrics of the checkout pods.
    - id: c
      text:
        en: |-
          Install the Amazon CloudWatch Observability EKS add-on, enable Application Signals with the Java auto-instrumentation annotation on the workloads, and create SLOs on the checkout operations.
    - id: d
      text:
        en: |-
          Deploy Amazon Managed Service for Prometheus with a custom exporter in each microservice, and build latency and SLO panels in Amazon Managed Grafana with Grafana alert rules.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Application Signals collects call volume, latency, faults, and errors per service and operation, shows a dependency map, and lets you create SLOs with alarms. On EKS, the CloudWatch Observability add-on injects AWS Distro for OpenTelemetry auto-instrumentation into Java pods through an annotation, so no source code changes are needed.
  options:
    a:
      en: |-
        The X-Ray SDK requires code changes, and the X-Ray SDKs and daemon have been in maintenance mode since February 2026; AWS recommends OpenTelemetry-based instrumentation instead.
    b:
      en: |-
        Container Insights reports infrastructure metrics for clusters, nodes, and pods; it does not measure per-operation latency, faults, or errors, and it does not provide SLOs.
    d:
      en: |-
        A custom exporter in each microservice is a code change, and building the metrics, dependency view, and SLOs by hand adds much more operational overhead than a managed feature.
references:
  - title: Application Signals - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Application-Monitoring-Sections.html
  - title: Enable your applications on Amazon EKS clusters - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Application-Signals-Enable-EKS.html
