id: dopc02-4c-s3-cfn-notification-circular
objective: "4.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A DevOps engineer writes an AWS CloudFormation template for a log processing pipeline. The template creates an S3 bucket that receives Application Load Balancer access logs, an AWS Lambda function that parses each new log file and sends the records to Amazon CloudWatch Logs, and an AWS::Lambda::Permission resource that allows Amazon S3 to invoke the function. The permission's SourceArn references the bucket's ARN with Fn::GetAtt. The bucket's NotificationConfiguration sends s3:ObjectCreated:* events to the function, and the bucket has a DependsOn attribute on the permission. Stack creation fails because of a circular dependency. The engineer must deploy all these resources with CloudFormation.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Remove the DependsOn attribute from the bucket so that CloudFormation creates the bucket and its notification configuration before it creates the permission.
    - id: b
      text:
        en: |-
          Remove the AWS::Lambda::Permission resource, and add s3:GetObject and lambda:InvokeFunction permissions to the function's execution role instead.
    - id: c
      text:
        en: |-
          Create the stack without the bucket's NotificationConfiguration, and then update the stack to add the notification configuration to the bucket.
    - id: d
      text:
        en: |-
          Change the principal of the AWS::Lambda::Permission resource to lambda.amazonaws.com so that it no longer depends on the bucket resource.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CloudFormation can't create a bucket with a Lambda notification until the bucket has permission to invoke the function, because the destination is checked. When the permission refers to the bucket, this creates a circular dependency. AWS recommends creating the resources without the notification configuration and then updating the stack to add it.
  options:
    a:
      en: |-
        Without the permission in place, the notification configuration can't be validated, so the bucket creation fails instead.
    b:
      en: |-
        S3 is allowed to invoke a function by the function's resource-based policy; the execution role only grants permissions to the function itself.
    d:
      en: |-
        The permission must allow the S3 service principal; lambda.amazonaws.com wouldn't let S3 invoke the function.
references:
  - title: "AWS::S3::Bucket NotificationConfiguration - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-s3-bucket-notificationconfiguration.html
  - title: "Process Amazon S3 event notifications with Lambda - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-s3.html
