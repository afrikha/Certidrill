id: dopc02-4a-metric-filter-dimension-default
objective: "4.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's microservices write JSON log events to one log group, and each event has a service field with one of eight values. A DevOps engineer creates a metric filter with the pattern { $.level = "ERROR" }, a metric value of 1, and the dimension Service mapped to $.service, then creates one alarm per service with a threshold of 5 errors in 5 minutes. The alarms often go to INSUFFICIENT_DATA overnight when a service logs no errors, which pages the team. When the engineer tries to set a default value of 0 on the metric filter, the change is rejected. Errors must still be counted per service.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Remove the Service dimension from the metric filter, set a default value of 0, and keep one alarm per service on the resulting metric.
    - id: b
      text:
        en: |-
          Keep the metric filter as it is, and set each alarm to treat missing data as notBreaching.
    - id: c
      text:
        en: |-
          Keep the metric filter as it is, and set each alarm to treat missing data as breaching.
    - id: d
      text:
        en: |-
          Recreate the metric filter with the space-delimited pattern syntax so that a default value of 0 can be combined with the dimension.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A metric filter cannot have a default value when its metric has dimensions, so no data point is published in periods without errors. Treating missing data as notBreaching makes those periods count as within the threshold, so the alarms stay OK while the per-service counts keep working.
  options:
    a:
      en: |-
        Without the dimension, all services share one metric, so errors can no longer be counted per service.
    c:
      en: |-
        Treating missing data as breaching would put the alarms in ALARM whenever a service logs no errors, which is the opposite of the goal.
    d:
      en: |-
        The restriction applies to any metric with dimensions, whatever the pattern syntax, so a default value still cannot be set.
references:
  - title: Creating metrics from log events using filters - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/MonitoringLogData.html
  - title: Configuring how CloudWatch alarms treat missing data - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarms-and-missing-data.html
