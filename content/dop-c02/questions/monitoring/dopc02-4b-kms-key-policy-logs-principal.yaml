id: dopc02-4b-kms-key-policy-logs-principal
objective: "4.1.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company must encrypt the log group /prod/payments in eu-west-1 with a customer managed AWS KMS key that the security team controls. The security team creates a symmetric key in eu-west-1 whose key policy contains only the default statement that grants the account root principal full access. When a DevOps engineer runs aws logs associate-kms-key for the log group, the call fails because CloudWatch Logs cannot use the key. The security team requires that the key be usable by CloudWatch Logs only for this log group. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an IAM policy to the role of the payment application that writes the logs, allowing kms:Encrypt and kms:GenerateDataKey* on the key, and run associate-kms-key again.
    - id: b
      text:
        en: |-
          Add a key policy statement that allows the logs.eu-west-1.amazonaws.com principal to use the key, with an ArnEquals condition on kms:EncryptionContext:aws:logs:arn set to the log group ARN.
    - id: c
      text:
        en: |-
          Add a key policy statement that allows the logs.eu-west-1.amazonaws.com principal to use the key, with a kms:ViaService condition set to logs.eu-west-1.amazonaws.com.
    - id: d
      text:
        en: |-
          Create a grant on the key for the CloudWatch Logs service-linked role in the account, with the Encrypt, Decrypt, and GenerateDataKey operations.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudWatch Logs uses the key as its Regional service principal (logs.eu-west-1.amazonaws.com here), so the key policy must allow that principal (Encrypt, Decrypt, ReEncrypt*, GenerateDataKey*, Describe*). The encryption context that CloudWatch Logs sends contains the log group ARN, so an ArnEquals condition on kms:EncryptionContext:aws:logs:arn restricts the key to that single log group.
  options:
    a:
      en: |-
        The application's role is not the principal that encrypts the stored log data; CloudWatch Logs itself must be allowed in the key policy, so the association still fails.
    c:
      en: |-
        This lets CloudWatch Logs use the key, but kms:ViaService does not tell log groups apart, so any log group in the account could be encrypted with it.
    d:
      en: |-
        CloudWatch Logs does not use a service-linked role to access KMS keys for log group encryption; it needs a key policy statement for its service principal.
references:
  - title: Encrypt log data in CloudWatch Logs using AWS Key Management Service - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/encrypt-log-data-kms.html
