id: dopc02-4a-ec2-detailed-monitoring
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web tier on Amazon EC2 instances in an Auto Scaling group that is created from a launch template. A step scaling policy uses a CloudWatch alarm on the CPUUtilization metric of the group. During traffic spikes, the alarm reacts several minutes late because the instances publish CPUUtilization only every 5 minutes. The company wants the default EC2 metrics at 1-minute granularity without installing any software on the instances.

    What should a DevOps engineer do?
body:
  options:
    - id: a
      text:
        en: |-
          Install the CloudWatch agent with a metrics_collection_interval of 60 seconds, and update the alarm to use the agent's CPU metric.
    - id: b
      text:
        en: |-
          Enable detailed monitoring in a new launch template version, and start an instance refresh so that all instances use it.
    - id: c
      text:
        en: |-
          Change the alarm period from 300 seconds to 60 seconds, and set the alarm to treat missing data as breaching.
    - id: d
      text:
        en: |-
          Publish CPUUtilization as a high-resolution custom metric from a cron job on each instance, and update the alarm to use it.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With basic monitoring, EC2 publishes most default metrics in 5-minute periods; detailed monitoring makes them available in 1-minute periods at an additional charge. Enabling it in the launch template and refreshing the instances applies it to the whole group without installing software.
  options:
    a:
      en: |-
        The CloudWatch agent is software that must be installed on each instance, which the company wants to avoid; detailed monitoring already provides 1-minute default metrics.
    c:
      en: |-
        A 60-second alarm period cannot create data points that EC2 does not publish; with 5-minute data, most periods would be missing and the alarm would misfire.
    d:
      en: |-
        A cron job that publishes custom metrics is software on every instance and adds custom metric charges for data that detailed monitoring provides natively.
references:
  - title: Manage detailed monitoring for your EC2 instances - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/manage-detailed-monitoring.html
