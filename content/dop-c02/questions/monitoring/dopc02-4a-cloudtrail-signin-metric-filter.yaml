id: dopc02-4a-cloudtrail-signin-metric-filter
objective: "4.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has a CloudTrail trail that delivers management events to an S3 bucket. The security team wants a CloudWatch metric that counts failed AWS Management Console sign-in attempts so that it can be graphed on a dashboard. The team also wants an alarm that notifies an Amazon SNS topic when 3 or more failures occur within 5 minutes. The solution must use CloudWatch features and no custom code.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a metric filter directly on the S3 bucket prefix that holds the CloudTrail log files, and publish the matches as a custom metric.
    - id: b
      text:
        en: |-
          Update the trail to also send events to a CloudWatch Logs log group, with an IAM role that allows CloudTrail to create log streams and put log events.
    - id: c
      text:
        en: |-
          Create a CloudTrail Lake event data store, and schedule a SQL query every 5 minutes that counts failed ConsoleLogin events.
    - id: d
      text:
        en: |-
          On the trail's log group, create a metric filter with the pattern { ($.eventName = ConsoleLogin) && ($.errorMessage = "Failed authentication") }, and an alarm on its Sum of 3 or more in 5 minutes.
    - id: e
      text:
        en: |-
          Enable CloudTrail Insights on the trail for the error rate of API calls, and create an alarm on the Insights events for ConsoleLogin.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Metric filters work on CloudWatch Logs log groups, so the trail must first deliver events to a log group through an IAM role. A JSON metric filter that matches failed ConsoleLogin events then publishes a count that a dashboard can graph and an alarm can evaluate with the Sum statistic over 5 minutes.
  options:
    a:
      en: |-
        Metric filters can be created only on CloudWatch Logs log groups, not on S3 objects.
    c:
      en: |-
        CloudTrail Lake has been closed to new customers since May 31, 2026, and a scheduled query does not create a CloudWatch metric or alarm by itself.
    e:
      en: |-
        CloudTrail Insights detects unusual call volumes or error rates against a baseline; it does not count failed sign-ins against a fixed threshold.
references:
  - title: "Creating CloudWatch alarms for CloudTrail events: examples - AWS CloudTrail"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudwatch-alarms-for-cloudtrail.html
