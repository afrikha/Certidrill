id: dopc02-4b-kms-reader-permissions
objective: "4.1.13"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company encrypts the log group /prod/orders in us-east-1 with a customer managed AWS KMS key. The key policy allows the CloudWatch Logs service principal for this log group, and the application continues to write logs without errors. Support analysts use an IAM role that has logs:StartQuery, logs:GetQueryResults, and logs:FilterLogEvents on the log group. Since the key was associated, the analysts' CloudWatch Logs Insights queries on the log group fail with a KMS access error. The security team requires least privilege. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add logs:Unmask to the analysts' role for the log group, so that the analysts can view the encrypted log events in query results.
    - id: b
      text:
        en: |-
          Grant the analysts' role kms:Decrypt on all keys in the account, so that queries keep working if the security team rotates or replaces the key.
    - id: c
      text:
        en: |-
          Add kms:Decrypt for the CloudWatch Logs service principal to the key policy, scoped to the log group ARN in the encryption context.
    - id: d
      text:
        en: |-
          Grant the analysts' role the KMS permissions that reading needs, such as kms:Decrypt, on this key only, with a kms:ViaService condition set to logs.us-east-1.amazonaws.com.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A principal that reads encrypted log data (GetLogEvents, FilterLogEvents, StartQuery) on a log group encrypted with a customer managed key needs KMS permissions on that key as well. CloudWatch Logs calls AWS KMS on the caller's behalf, so a kms:ViaService condition for logs.us-east-1.amazonaws.com limits the permission to use through CloudWatch Logs, which is least privilege.
  options:
    a:
      en: |-
        logs:Unmask reveals data that a CloudWatch Logs data protection policy masked; it does not grant any permission on the KMS key.
    b:
      en: |-
        Decrypt on every key in the account and through any service is far broader than the analysts need.
    c:
      en: |-
        The service principal already has the access it needs, because ingestion works; the missing permission is the one of the calling analysts.
references:
  - title: Encrypt log data in CloudWatch Logs using AWS Key Management Service - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/encrypt-log-data-kms.html
