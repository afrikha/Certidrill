id: dopc02-4b-anomaly-exclude-training
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a CloudWatch anomaly detection alarm on the average CPUUtilization of an Auto Scaling group. Last week, a one-time data migration kept CPU utilization near 90% for 30 hours. Since then, the band of expected values has become much wider, and the alarm no longer fires when CPU utilization rises abnormally during business hours. The migration will not happen again. The DevOps team wants the alarm to return to its previous sensitivity as soon as possible without hiding real anomalies. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the anomaly detection threshold of the alarm so that the band becomes narrower and the alarm fires again during business hours.
    - id: b
      text:
        en: |-
          Delete the anomaly detection model and create it again on the same metric and statistic, so that the model is trained again from the beginning.
    - id: c
      text:
        en: |-
          Change the alarm statistic from Average to Maximum so that a new model is trained on a statistic that is less affected by the migration.
    - id: d
      text:
        en: |-
          Edit the anomaly detection model to exclude the time period of the migration from the data used to train the model.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CloudWatch anomaly detection lets you exclude specified time periods of the metric from model training, which is intended for deployments and other unusual events. Excluding the migration window removes its influence on the band while the rest of the training data keeps the model accurate.
  options:
    a:
      en: |-
        A higher threshold value produces a thicker band, not a narrower one, so the alarm would become even less sensitive.
    b:
      en: |-
        A new model trains on up to the last two weeks of the metric, which still contain the migration, so the band stays distorted.
    c:
      en: |-
        Models are specific to a statistic, so a Maximum model is trained on the same two weeks that include the migration and it also changes what the alarm measures.
references:
  - title: Using CloudWatch anomaly detection - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
