id: dopc02-4a-custom-metric-dimensions
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company publishes a custom metric named OrdersFailed in the namespace Logistics/Orders. Each data point carries two dimensions: Service (5 values) and InstanceId (about 60 values that change as instances are replaced). A DevOps engineer creates a CloudWatch alarm on OrdersFailed with only the dimension Service=dispatch, and the alarm stays in INSUFFICIENT_DATA although the dispatch service fails orders every minute. The metric has been published for three weeks. The alarm must evaluate the total failures of each service across all its instances.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the namespace to AWS/Orders so that CloudWatch aggregates the metric across dimensions the way it does for AWS service metrics.
    - id: b
      text:
        en: |-
          Wait up to 15 minutes for the Service=dispatch dimension combination to appear in the ListMetrics results, and then re-create the alarm on it.
    - id: c
      text:
        en: |-
          Publish OrdersFailed with StorageResolution set to 1 so that CloudWatch keeps the per-instance data points that it needs to aggregate by service.
    - id: d
      text:
        en: |-
          Also publish each OrdersFailed data point with only the Service dimension, and keep the alarm on the metric with the Service=dispatch dimension.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Each unique combination of dimensions is a separate metric, and CloudWatch does not aggregate across dimensions for custom metrics. The metric with only Service=dispatch was never published, so the alarm has no data; publishing that combination as well gives the alarm a per-service total.
  options:
    a:
      en: |-
        Namespaces that start with AWS/ follow the naming convention of AWS services, and the namespace name does not change how CloudWatch aggregates custom metrics.
    b:
      en: |-
        The metric has existed for three weeks, so propagation delay is not the cause; the Service-only combination will never appear because it is never published.
    c:
      en: |-
        Resolution controls the time granularity of the data; it does not make CloudWatch aggregate custom metrics across the InstanceId dimension.
references:
  - title: Metrics concepts - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html
