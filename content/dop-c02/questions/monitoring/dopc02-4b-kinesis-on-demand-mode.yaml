id: dopc02-4b-kinesis-on-demand-mode
objective: "4.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company streams the logs of all its game servers to an Amazon Kinesis data stream in provisioned mode through CloudWatch Logs subscription filters that use random distribution. A real-time analytics consumer reads the stream. Log volume is unpredictable: tournaments can triple traffic within an hour, at different times every week. During these peaks, all shards report write throttling and log delivery falls behind, and engineers spend hours every week resharding the stream. The company wants the LEAST operational overhead. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Switch the data stream to an on-demand capacity mode so that Kinesis scales the stream's capacity automatically with the traffic.
    - id: b
      text:
        en: |-
          Write an AWS Lambda function that a CloudWatch alarm on write throttling invokes to call UpdateShardCount and double the number of shards.
    - id: c
      text:
        en: |-
          Register an enhanced fan-out consumer for the analytics application so that the stream can accept more records from the subscription filters.
    - id: d
      text:
        en: |-
          Change the subscription filters to group records by log stream so that the records are spread more evenly across the shards.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In on-demand mode, Kinesis Data Streams needs no capacity planning and automatically scales write and read throughput, accommodating up to double the previous peak. It removes the manual resharding, and switching a stream between modes causes no disruption to its applications.
  options:
    b:
      en: |-
        A custom scaling function must be built, tested, and maintained, and it reacts only after throttling has started.
    c:
      en: |-
        Enhanced fan-out gives a consumer dedicated read throughput; it does not increase the write capacity of the shards.
    d:
      en: |-
        Random distribution already spreads the records across all shards; grouping by log stream would only concentrate them, and the whole stream is short of capacity.
references:
  - title: Choose the right mode to stream in - Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/streams/latest/dev/how-do-i-size-a-stream.html
