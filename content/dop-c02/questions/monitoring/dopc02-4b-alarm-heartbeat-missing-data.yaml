id: dopc02-4b-alarm-heartbeat-missing-data
objective: "4.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data processing job on Amazon EC2 publishes a custom metric named JobHeartbeat with a value of 1 every minute while it runs. A CloudWatch alarm on JobHeartbeat uses the Sum statistic over 5 minutes with the condition lower than 1 and the default missing data setting. The alarm is a child of a composite alarm that invokes an AWS Lambda function to restart the job when the alarm is in ALARM. Last night the job hung, stopped publishing the metric, and the alarm went to INSUFFICIENT_DATA instead of ALARM, so the job was never restarted. Which change will make the alarm go to ALARM when the job stops publishing?
body:
  options:
    - id: a
      text:
        en: |-
          Set the alarm's missing data treatment to notBreaching.
    - id: b
      text:
        en: |-
          Set the alarm's missing data treatment to ignore.
    - id: c
      text:
        en: |-
          Set the alarm's missing data treatment to breaching.
    - id: d
      text:
        en: |-
          Add an SNS notification action to the alarm for the INSUFFICIENT_DATA state.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      By default (missing), an alarm whose evaluation range has no data points goes to INSUFFICIENT_DATA. With breaching, missing data points are treated as bad, so a heartbeat metric that stops reporting puts the alarm in ALARM and the composite alarm and its Lambda action react. AWS recommends this treatment for metrics that report continuously, where missing data indicates a problem.
  options:
    a:
      en: |-
        notBreaching treats missing data points as good, so the alarm goes to OK when the job stops, which hides the failure.
    b:
      en: |-
        ignore keeps the current alarm state, so an alarm in OK stays in OK after the job stops publishing.
    d:
      en: |-
        A notification on INSUFFICIENT_DATA informs people, but the alarm still does not enter ALARM, so the composite alarm does not invoke the function.
references:
  - title: Configuring how CloudWatch alarms treat missing data - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarms-and-missing-data.html
