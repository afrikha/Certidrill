id: dopc02-4c-eventbridge-api-destination
objective: "4.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a third-party incident management tool that accepts alerts only through an HTTPS webhook. Each request must contain an API key in a custom HTTP header named X-Api-Key and a JSON body in the tool's own format. The DevOps team wants every AWS Health event for the account to create an alert in the tool. The team doesn't want to write or maintain code, and the API key must not be stored in plain text in the rule or target configuration.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a connection with API key authorization for the X-Api-Key header, an API destination for the webhook URL, and an aws.health rule that targets it with an input transformer.
    - id: b
      text:
        en: |-
          Create an EventBridge API destination for the webhook URL with the API key appended as a query string parameter, and an aws.health rule that targets it with an input transformer.
    - id: c
      text:
        en: |-
          Create an EventBridge rule for aws.health events that targets an AWS Lambda function, which reads the API key from AWS Secrets Manager, builds the body, and calls the webhook.
    - id: d
      text:
        en: |-
          Create an EventBridge rule for aws.health events that targets an Amazon SQS queue, and configure the incident management tool to read the queue with the API key.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      API destinations are HTTPS endpoints that a rule can invoke as a target. Their connection defines the authorization method and credentials, and EventBridge stores the credentials in a secret in AWS Secrets Manager. An input transformer shapes the event into the tool's JSON format, so no code is needed.
  options:
    b:
      en: |-
        The tool requires the key in a header, and a key placed in the endpoint URL is stored in plain text in the API destination's configuration.
    c:
      en: |-
        The Lambda function is code that the team would have to write and maintain.
    d:
      en: |-
        The tool accepts alerts only through its webhook; it doesn't read messages from an SQS queue.
references:
  - title: "API destinations as targets in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-api-destinations.html
  - title: "Amazon EventBridge input transformation - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-transform-target-input.html
