id: dopc02-4a-agent-asg-aggregation
objective: "4.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's Auto Scaling group of 10 to 50 Amazon EC2 instances runs a memory-bound service. The CloudWatch agent publishes mem_used_percent with the InstanceId dimension. A DevOps engineer creates a target tracking policy on the average mem_used_percent with only the AutoScalingGroupName dimension, but the policy's alarms stay in INSUFFICIENT_DATA. Instances are replaced often, and the engineer wants a single group-level metric without custom code.

    Which change will provide the metric that the scaling policy needs?
body:
  options:
    - id: a
      text:
        en: |-
          Enable group metrics collection on the Auto Scaling group so that EC2 Auto Scaling publishes the average memory utilization of the group.
    - id: b
      text:
        en: |-
          Set metrics_collection_interval to 10 seconds in the agent configuration so that CloudWatch can aggregate the high-resolution instance metrics by group.
    - id: c
      text:
        en: |-
          Add AutoScalingGroupName to append_dimensions and set aggregation_dimensions to [["AutoScalingGroupName"]] in the agent configuration.
    - id: d
      text:
        en: |-
          Enable detailed monitoring in the launch template so that CloudWatch aggregates the agent's memory metric across the instances of the group.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CloudWatch does not aggregate custom metrics across dimensions, so a metric with only AutoScalingGroupName exists only if it is published. append_dimensions adds the group name to the agent's metrics, and aggregation_dimensions makes the agent also publish mem_used_percent rolled up by AutoScalingGroupName, which the policy can track.
  options:
    a:
      en: |-
        Group metrics collection publishes group size metrics such as GroupInServiceInstances; it does not include memory utilization.
    b:
      en: |-
        A shorter interval produces high-resolution metrics per instance, but CloudWatch still does not aggregate custom metrics across dimensions.
    d:
      en: |-
        Detailed monitoring changes the period of the default EC2 metrics; it does not aggregate custom metrics published by the agent.
references:
  - title: Manually create or edit the CloudWatch agent configuration file - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
  - title: Metrics concepts - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html
