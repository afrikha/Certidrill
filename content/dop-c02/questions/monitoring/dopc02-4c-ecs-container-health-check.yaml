id: dopc02-4c-ecs-container-health-check
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a queue worker as an Amazon ECS service on AWS Fargate. The service has no load balancer because the worker only polls an Amazon SQS queue and doesn't listen on any port. Occasionally the worker process deadlocks: the container keeps running, but it stops processing messages. While it is working correctly, the worker updates a heartbeat file in the container every 10 seconds. The company wants ECS to detect a stuck worker and replace its task automatically, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on the deployment circuit breaker with rollback for the service so that ECS stops and replaces tasks that stop processing messages.
    - id: b
      text:
        en: |-
          Create an EventBridge schedule that invokes an AWS Lambda function every 5 minutes to stop the tasks whose log streams have no recent events.
    - id: c
      text:
        en: |-
          Add a healthCheck to the essential container in the task definition with a CMD-SHELL command that fails when the heartbeat file is older than 60 seconds.
    - id: d
      text:
        en: |-
          Attach a Network Load Balancer target group to the service with a TCP health check on the container port so that ECS replaces unhealthy tasks.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A container health check is a command that runs inside the container; a non-zero exit code marks the container UNHEALTHY. When an essential container is UNHEALTHY, the whole task is UNHEALTHY, and the ECS service replaces it. A command that tests the age of the heartbeat file detects the deadlock without any code outside the task.
  options:
    a:
      en: |-
        The deployment circuit breaker evaluates deployments that fail to reach a steady state; it doesn't monitor running tasks of a stable service.
    b:
      en: |-
        This is custom code to build and maintain, and log silence can also mean that the queue is empty.
    d:
      en: |-
        The worker doesn't listen on any port, and a TCP check only proves that a port accepts connections, not that the worker is processing messages.
references:
  - title: "Determine Amazon ECS task health using container health checks - Amazon Elastic Container Service"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/healthcheck.html
