id: dopc02-4a-metric-stream-s3-include
objective: "4.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A capacity planning team needs 1-minute CloudWatch metrics for Amazon EC2 and Amazon RDS kept for 3 years and queried with Amazon Athena. CloudWatch keeps 1-minute data points for only 15 days before it aggregates them into longer periods. The account publishes metrics in more than 40 namespaces, and only the AWS/EC2 and AWS/RDS namespaces are needed. The team wants the data written continuously to Amazon S3 with no code to maintain and with the lowest streaming charges.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a metric stream with the quick Amazon S3 setup and include filters for the AWS/EC2 and AWS/RDS namespaces, and add an S3 Lifecycle rule that expires objects after 3 years.
    - id: b
      text:
        en: |-
          Create a metric stream with the quick Amazon S3 setup that streams all metrics, and add an S3 Lifecycle rule that expires objects after 3 years.
    - id: c
      text:
        en: |-
          Schedule a Lambda function every minute that calls GetMetricData for the AWS/EC2 and AWS/RDS namespaces and writes the results to S3.
    - id: d
      text:
        en: |-
          Create a metric stream with an include filter for AWS/EC2 and AWS/RDS and an exclude filter for all other namespaces, and send it to a Firehose stream that writes to S3.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A metric stream continuously delivers metrics to S3 through Firehose, and the quick S3 setup creates the resources. Include filters limit the stream to the two namespaces, which keeps the per-update charges low, and a lifecycle rule enforces the 3-year retention.
  options:
    b:
      en: |-
        Streaming all 40 namespaces is billed per metric update, so it costs much more than streaming only the two needed namespaces.
    c:
      en: |-
        A polling Lambda function is code to maintain and is limited by GetMetricData throttling as the fleet grows.
    d:
      en: |-
        A metric stream can use include filters or exclude filters, but not both; the include filter alone already limits the stream.
references:
  - title: Use metric streams - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Metric-Streams.html
  - title: Metrics concepts - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html
