id: dopc02-4c-insights-pattern-errors
objective: "4.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An order-processing service writes plain-text logs to an Amazon CloudWatch Logs log group. During an incident, the log group received about 200,000 error lines in the last 2 hours. Each error line contains an order ID, a timestamp, and other variable values, so almost every line is unique. The on-call engineer doesn't know the message formats in advance. The engineer needs to see, for the last 2 hours only, which recurring error message structures occur and how many lines match each one.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Create a metric filter that matches the term ERROR on the log group, and graph the resulting metric on a dashboard for the last 2 hours.
    - id: b
      text:
        en: |-
          Run a CloudWatch Logs Insights query that filters on ERROR and groups the matching lines with stats count(*) by @message.
    - id: c
      text:
        en: |-
          Export the last 2 hours of the log group to Amazon S3, and query the exported files with Amazon Athena by using GROUP BY on the message text.
    - id: d
      text:
        en: |-
          Run a CloudWatch Logs Insights query that filters on ERROR and sends the matching lines to the pattern command on the @message field.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The pattern command of CloudWatch Logs Insights clusters log events into recurring text structures, replacing variable parts such as IDs and numbers with tokens. For each pattern it returns @pattern with @sampleCount and @ratio, so the engineer sees the main error structures and their volume without knowing the formats. The query runs ad hoc on the existing events of the last 2 hours.
  options:
    a:
      en: |-
        A metric filter only counts events ingested after it is created, and it produces a single count, not the message structures.
    b:
      en: |-
        Grouping by the full message creates one group per distinct line; because each line contains unique values, almost every group has a count of 1.
    c:
      en: |-
        Exporting and querying with Athena takes far more effort, and grouping on the full message text has the same problem as grouping by @message.
references:
  - title: "pattern - Amazon CloudWatch Logs"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-Pattern.html
  - title: "Creating metrics from log events using filters - Amazon CloudWatch Logs"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/MonitoringLogData.html
