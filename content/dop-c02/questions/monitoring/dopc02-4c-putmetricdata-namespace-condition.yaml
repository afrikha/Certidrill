id: dopc02-4c-putmetricdata-namespace-condition
objective: "4.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A nightly job on Amazon EC2 instances publishes a custom metric with the PutMetricData API in the namespace Example/Batch. The instances use an IAM role that currently has the CloudWatchFullAccess managed policy. A security review requires least privilege. The role must be able to publish metric data only in the Example/Batch namespace, and it must not be able to perform any other Amazon CloudWatch or CloudWatch Logs action.

    Which policy should replace the role's current permissions?
body:
  options:
    - id: a
      text:
        en: |-
          The CloudWatchAgentServerPolicy AWS managed policy, which allows the instances to publish metrics and log events to CloudWatch.
    - id: b
      text:
        en: |-
          A policy that allows cloudwatch:PutMetricData on all resources with a StringEquals condition on the cloudwatch:namespace key set to Example/Batch.
    - id: c
      text:
        en: |-
          A policy that allows cloudwatch:PutMetricData and cloudwatch:PutMetricAlarm on all resources, with no condition on the namespace.
    - id: d
      text:
        en: |-
          A policy that allows logs:CreateLogStream and logs:PutLogEvents on one log group, with the job writing the value in embedded metric format into Example/Batch.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      IAM condition keys can limit PutMetricData to the CloudWatch namespaces that you specify. A policy that allows only cloudwatch:PutMetricData, with a StringEquals condition on cloudwatch:namespace set to Example/Batch, lets the job publish its metric and nothing else.
  options:
    a:
      en: |-
        This managed policy grants more than PutMetricData in one namespace, including CloudWatch Logs actions that the role must not have.
    c:
      en: |-
        Without a namespace condition the role can publish into any namespace, and PutMetricAlarm is an extra CloudWatch action.
    d:
      en: |-
        These are CloudWatch Logs actions, which the role must not have, and IAM doesn't restrict the namespace declared inside the log events.
references:
  - title: "Using condition keys to limit access to CloudWatch namespaces - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/iam-cw-condition-keys-namespace.html
