id: dopc02-4c-scaling-capabilities-facts
objective: "4.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A DevOps engineer is documenting the automatic scaling of a company's data tier. The stack includes an Amazon RDS for MySQL DB instance with storage autoscaling turned on. It also includes an Amazon DynamoDB table in provisioned capacity mode with auto scaling configured on the table at a 70 percent target utilization. Last week, the team added a global secondary index (GSI) to the existing table. The engineer must describe how these features behave.

    Which statements are correct? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          RDS storage autoscaling reduces the allocated storage again after data is deleted and free space stays high for several days.
    - id: b
      text:
        en: |-
          RDS storage autoscaling adds storage when free space is 10 percent or less of the allocated storage for at least 5 minutes, within the limits on storage modifications.
    - id: c
      text:
        en: |-
          DynamoDB auto scaling reacts to sustained load: it scales out after consumed capacity exceeds the target for two consecutive minutes, and short spikes rely on burst capacity.
    - id: d
      text:
        en: |-
          Because auto scaling is configured on the table, DynamoDB auto scaling also adjusts the provisioned capacity of the new GSI.
    - id: e
      text:
        en: |-
          DynamoDB auto scaling updates the provisioned capacity within seconds, so requests above the old capacity aren't throttled while the update runs.
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      RDS storage autoscaling triggers when free space is 10 percent or less of allocated storage for at least 5 minutes, provided the previous storage optimization has completed and fewer than four storage modifications occurred in 24 hours. DynamoDB auto scaling triggers when consumed capacity breaches the target for two consecutive minutes and adjusts only for sustained changes; short spikes are absorbed by burst capacity.
  options:
    a:
      en: |-
        Storage autoscaling never shrinks storage; after a DB instance is autoscaled, its allocated storage can't be reduced.
    d:
      en: |-
        A GSI has its own provisioned capacity, and auto scaling isn't turned on for a GSI created on an existing table; it must be configured for the index.
    e:
      en: |-
        Updating provisioned capacity takes several minutes, and requests above the previous capacity are throttled during that time.
references:
  - title: "Managing capacity automatically with Amazon RDS storage autoscaling - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.Autoscaling.html
  - title: "Managing throughput capacity automatically with DynamoDB auto scaling - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/AutoScaling.html
