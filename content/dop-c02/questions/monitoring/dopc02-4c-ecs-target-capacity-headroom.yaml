id: dopc02-4c-ecs-target-capacity-headroom
objective: "4.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon ECS service on EC2 instances. The cluster uses an Auto Scaling group capacity provider with managed scaling and the default target capacity of 100 percent. When Service Auto Scaling adds tasks during traffic bursts, the new tasks stay in the PENDING state for several minutes until new instances launch and register with the cluster. The company wants new tasks to start immediately during typical bursts and accepts paying for some unused capacity. Amazon ECS must keep managing the scaling of the Auto Scaling group.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Edit the target tracking scaling policy that Amazon ECS created on the Auto Scaling group, and lower its target value to 80.
    - id: b
      text:
        en: |-
          Add a step scaling policy to the Auto Scaling group that adds two instances when the cluster's CPU reservation exceeds 70 percent.
    - id: c
      text:
        en: |-
          Raise the minimum and desired capacity of the Auto Scaling group by two instances, and turn off managed scaling on the capacity provider.
    - id: d
      text:
        en: |-
          Update the managed scaling settings of the capacity provider, and lower the target capacity percentage to 80.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With a target capacity of 100 percent, managed scaling keeps no spare instances, so new tasks wait in PENDING until new instances register. A lower target capacity keeps the CapacityProviderReservation below 100, which leaves spare instances on which new tasks start immediately. AWS states that the scaling policy must be changed through the capacity provider's managed scaling settings.
  options:
    a:
      en: |-
        Amazon ECS manages this policy; changes must be made in the capacity provider's managed scaling settings, not directly on the policy.
    b:
      en: |-
        AWS advises against managing the desired capacity of a capacity provider's Auto Scaling group with any scaling policy other than the one Amazon ECS manages.
    c:
      en: |-
        Turning off managed scaling means that Amazon ECS no longer manages the group's scaling, which the company requires.
references:
  - title: "Automatically manage Amazon ECS capacity with cluster auto scaling - Amazon Elastic Container Service"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/cluster-auto-scaling.html
