id: dopc02-4a-flow-logs-firehose-siem
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security team must send the VPC flow logs of 30 production VPCs to a third-party SIEM that ingests data through an HTTPS endpoint. The SIEM must receive the records in near real time, and a copy of the records that the SIEM rejects must be kept in Amazon S3. Today the flow logs are published to CloudWatch Logs, and a subscription filter on each log group forwards them to a Lambda function that posts them to the SIEM. The CloudWatch Logs ingestion charges for flow logs are now the largest monitoring cost, and nobody queries the flow logs in CloudWatch. The team wants to remove custom code.

    Which solution will meet these requirements MOST cost-effectively?
body:
  options:
    - id: a
      text:
        en: |-
          Publish the flow logs directly to an Amazon Data Firehose stream that has an HTTP endpoint destination for the SIEM and backs up failed records to an S3 bucket.
    - id: b
      text:
        en: |-
          Keep publishing the flow logs to CloudWatch Logs, and replace the Lambda function with a subscription filter that sends the events to an Amazon Data Firehose stream with an HTTP endpoint destination and S3 backup for failed records.
    - id: c
      text:
        en: |-
          Publish the flow logs to an S3 bucket, and configure S3 event notifications to invoke a Lambda function that posts each new object to the SIEM endpoint.
    - id: d
      text:
        en: |-
          Configure VPC Traffic Mirroring on the production instances, and send the mirrored traffic to a Network Load Balancer in front of SIEM collector instances.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      VPC flow logs can be published directly to an Amazon Data Firehose stream, which delivers to destinations such as an HTTP endpoint and can back up failed records to S3. This removes the CloudWatch Logs ingestion charges and the Lambda code while keeping near-real-time delivery.
  options:
    b:
      en: |-
        Removing the Lambda function helps, but all flow logs would still be ingested into CloudWatch Logs, which is the largest cost to remove.
    c:
      en: |-
        The Lambda function is still custom code to maintain, and S3 delivery of flow logs adds minutes of delay before the SIEM receives the records.
    d:
      en: |-
        Traffic Mirroring copies packets, not flow log records; it needs collector instances and costs far more than flow logs.
references:
  - title: Publish flow logs to Amazon Data Firehose - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-firehose.html
  - title: Configure destination settings - Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/create-destination.html
