id: dopc02-4b-config-required-tags
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's finance team allocates costs with a CostCenter tag. AWS Config is already recording all resource types in the account. The DevOps team must continuously report which Amazon EC2 instances, Amazon S3 buckets, and Amazon RDS DB instances are missing the CostCenter tag, and the report must update when a resource is created or its tags change. The team wants the LEAST development effort. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write an AWS Config custom Lambda rule that reads the tags of each resource and returns NON_COMPLIANT when CostCenter is missing.
    - id: b
      text:
        en: |-
          Activate the CostCenter tag as a cost allocation tag in the Billing and Cost Management console and review the untagged costs every month.
    - id: c
      text:
        en: |-
          Run a daily AWS Lambda function that calls the Resource Groups Tagging API and writes the untagged resources to an Amazon S3 report.
    - id: d
      text:
        en: |-
          Deploy the required-tags AWS Config managed rule with tag1Key set to CostCenter, scoped to the three resource types.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The required-tags managed rule checks whether resources have the tags that you specify (up to six keys, with optional values) and is triggered by configuration changes, so compliance updates as soon as a resource is created or retagged. It supports EC2 instances, S3 buckets, and RDS DB instances, and needs no code.
  options:
    a:
      en: |-
        A custom Lambda rule works but requires writing and maintaining code for a check that a managed rule already provides.
    b:
      en: |-
        Activating a cost allocation tag only makes it usable in cost reports; it does not report which resources lack the tag.
    c:
      en: |-
        A daily script is custom code and does not update the report when a resource is created or its tags change.
references:
  - title: required-tags - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/required-tags.html
