id: dopc02-4a-alb-access-logs-encryption
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company enforces default encryption on all S3 buckets. A DevOps engineer creates an S3 bucket for the access logs of an Application Load Balancer in the same Region, adds the bucket policy that grants s3:PutObject to logdelivery.elasticloadbalancing.amazonaws.com on the correct AWSLogs prefix, and sets default encryption to SSE-KMS with a customer managed key. Enabling access logging on the load balancer fails with an access denied error. The company requires the access logs to be encrypted at rest and wants the LEAST operational overhead.

    What should the DevOps engineer do?
body:
  options:
    - id: a
      text:
        en: |-
          Add a statement to the key policy that allows logdelivery.elasticloadbalancing.amazonaws.com to use kms:GenerateDataKey and kms:Encrypt on the customer managed key.
    - id: b
      text:
        en: |-
          Change the default encryption of the bucket to SSE-KMS with the AWS managed key aws/s3, which Elastic Load Balancing can use without a key policy change.
    - id: c
      text:
        en: |-
          Change the default encryption of the bucket to SSE-S3 so that Elastic Load Balancing can write the access log files encrypted at rest.
    - id: d
      text:
        en: |-
          Send the access logs to an Amazon Data Firehose stream that encrypts records with the customer managed key before it writes them to the bucket.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Application Load Balancer access logs support only Amazon S3 managed keys (SSE-S3) on the destination bucket; with another encryption option, log delivery is denied. SSE-S3 still encrypts every log file at rest, so the requirement is met with one setting change.
  options:
    a:
      en: |-
        SSE-KMS is not supported for ALB access log buckets, so changing the key policy does not make delivery work.
    b:
      en: |-
        The AWS managed key aws/s3 is also SSE-KMS, which ALB access log delivery does not support.
    d:
      en: |-
        ALB access logs can be delivered only to an S3 bucket, not to a Firehose stream, and adding a stream would increase overhead anyway.
references:
  - title: Enable access logs for your Application Load Balancer - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/enable-access-logging.html
