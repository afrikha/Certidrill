id: dopc02-4a-object-lock-log-archive
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A brokerage firm's archiving job copies application and database audit logs to an S3 bucket in a log archive account every hour. A regulator requires that each log object cannot be overwritten or deleted by anyone for 7 years after it is written, including administrators and the account root user. Objects must be deletable after 7 years so that storage does not grow forever. The firm wants the archiving job to stay unchanged.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable S3 Object Lock on a new bucket with a default retention of 7 years in governance mode, and grant s3:BypassGovernanceRetention to no IAM principal.
    - id: b
      text:
        en: |-
          Enable S3 Object Lock on a new bucket with a default retention of 7 years in compliance mode, and add a lifecycle rule that expires objects and permanently deletes noncurrent versions after 7 years.
    - id: c
      text:
        en: |-
          Add a bucket policy that denies s3:DeleteObject and s3:PutObject on existing keys to all principals, and remove the statement with a scheduled job after 7 years.
    - id: d
      text:
        en: |-
          Enable S3 Versioning with MFA Delete on the bucket, and place a legal hold on every object version that the archiving job writes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In compliance mode, no user, including the root user, can overwrite or delete a protected object version or shorten its retention until the retain-until date. A bucket default retention applies to every new object without changing the archiving job, and lifecycle expiration actions remove the object versions once the retention has passed.
  options:
    a:
      en: |-
        In governance mode, any principal later granted s3:BypassGovernanceRetention, such as an administrator who edits IAM policies, can delete objects, and the root user can use that permission.
    c:
      en: |-
        An administrator or the root user can edit or delete a bucket policy, so it does not stop everyone from deleting objects.
    d:
      en: |-
        A legal hold has no expiration and must be removed object by object, and the job would have to change to set it; MFA Delete can still be used by the root user to delete versions.
references:
  - title: Locking objects with Object Lock - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
