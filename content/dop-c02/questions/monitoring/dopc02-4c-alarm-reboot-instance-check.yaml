id: dopc02-4c-alarm-reboot-instance-check
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a legacy licensing server on a single Amazon EC2 instance that is not in an Auto Scaling group. The software license is tied to the instance ID. A few times each month, the operating system stops responding: the StatusCheckFailed_Instance metric reports 1, while StatusCheckFailed_System stays at 0. Each time, an operator reboots the instance manually, which solves the problem. The company wants this action to happen automatically, and the operations team must receive an email each time it happens.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the StatusCheckFailed_Instance metric with the EC2 recover action and a notification to an Amazon SNS topic that has an email subscription.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on the StatusCheckFailed_Instance metric with the EC2 reboot action and a notification to an Amazon SNS topic that has an email subscription.
    - id: c
      text:
        en: |-
          Create a CloudWatch alarm on the StatusCheckFailed_System metric with the EC2 recover action and a notification to an Amazon SNS topic that has an email subscription.
    - id: d
      text:
        en: |-
          Place the instance in an Auto Scaling group with a desired capacity of 1, and subscribe the team's email address to the group's instance termination notifications.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS recommends the reboot alarm action for instance status check failures, and the recover action for system status check failures. An alarm on StatusCheckFailed_Instance with the reboot action restarts the operating system on the same instance, which keeps its instance ID, and the SNS action sends the email.
  options:
    a:
      en: |-
        The recover action can be used only with StatusCheckFailed_System, not with StatusCheckFailed_Instance.
    c:
      en: |-
        The system status check stays at 0 in these incidents, so this alarm never fires; recovery addresses problems with the underlying host, not the operating system.
    d:
      en: |-
        The Auto Scaling group would replace the unhealthy instance with a new one that has a different instance ID, which breaks the license.
references:
  - title: "Create alarms that stop, terminate, reboot, or recover an instance - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/UsingAlarmActions.html
