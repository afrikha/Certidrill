id: dopc02-4a-agent-instance-role
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team stores the CloudWatch agent configuration in a Systems Manager Parameter Store parameter named AmazonCloudWatch-linux. A separate administrator role, used only by the platform team, writes that parameter. A fleet of Amazon EC2 instances must read the parameter, then send logs and metrics with the CloudWatch agent. The security team requires least privilege and forbids long-term credentials on the instances.

    Which IAM configuration should the team use for the instances?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an instance profile whose role has the CloudWatchAgentAdminPolicy managed policy.
    - id: b
      text:
        en: |-
          Attach an instance profile whose role has the CloudWatchAgentServerPolicy managed policy.
    - id: c
      text:
        en: |-
          Store the access keys of an IAM user that has the CloudWatchAgentServerPolicy managed policy in the agent's credentials profile.
    - id: d
      text:
        en: |-
          Attach an instance profile whose role has the CloudWatchReadOnlyAccess managed policy.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudWatchAgentServerPolicy grants the agent's write actions for metrics and logs plus ssm:GetParameter on parameters named AmazonCloudWatch-*, which is all the instances need. An instance profile gives the agent temporary credentials, so no long-term keys are stored.
  options:
    a:
      en: |-
        CloudWatchAgentAdminPolicy also grants ssm:PutParameter on the agent parameters, which the instances do not need; it is meant for the identity that writes the configuration.
    c:
      en: |-
        IAM user access keys are long-term credentials, which the security team forbids on EC2 instances where a role can be used.
    d:
      en: |-
        A read-only CloudWatch policy does not allow the agent to put metrics or log events, and it does not grant ssm:GetParameter.
references:
  - title: CloudWatchAgentServerPolicy - AWS Managed Policy
    url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/CloudWatchAgentServerPolicy.html
  - title: CloudWatchAgentAdminPolicy - AWS Managed Policy
    url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/CloudWatchAgentAdminPolicy.html
