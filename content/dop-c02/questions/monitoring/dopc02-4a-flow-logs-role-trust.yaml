id: dopc02-4a-flow-logs-role-trust
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DevOps engineer uses AWS CloudFormation to create VPC flow logs that publish to a CloudWatch Logs log group. The template creates an IAM role with a policy that allows logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogGroups, and logs:DescribeLogStreams, and the flow log references that role. The role's trust policy allows the ec2.amazonaws.com service principal to assume it. The flow log is created, but its status shows an access error and no log streams appear. The security team also asks for protection against the confused deputy problem.

    Which change will fix the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Change the trust policy principal to vpc-flow-logs.amazonaws.com, and add aws:SourceAccount and aws:SourceArn conditions that match the account and the flow log ARN.
    - id: b
      text:
        en: |-
          Add a CloudWatch Logs resource policy to the log group that allows ec2.amazonaws.com to call logs:PutLogEvents, with an aws:SourceAccount condition.
    - id: c
      text:
        en: |-
          Change the trust policy principal to logs.amazonaws.com, and add an aws:SourceArn condition that matches the ARN of the log group.
    - id: d
      text:
        en: |-
          Attach the CloudWatchAgentServerPolicy managed policy to the role, and add an aws:SourceVpc condition that matches the VPC ID.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The flow logs service assumes the role, so the trust policy must allow vpc-flow-logs.amazonaws.com. AWS recommends the aws:SourceAccount and aws:SourceArn conditions in the trust policy to prevent the confused deputy problem.
  options:
    b:
      en: |-
        Flow logs that publish to CloudWatch Logs use the IAM role passed in the flow log, and EC2 is not the principal that delivers the records.
    c:
      en: |-
        CloudWatch Logs does not assume the role; the flow logs service does, so the logs.amazonaws.com principal does not fix the access error.
    d:
      en: |-
        The role already has the needed logs actions; the trust policy is wrong, and the agent policy and aws:SourceVpc condition do not change who can assume the role.
references:
  - title: IAM role for publishing flow logs to CloudWatch Logs - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-iam-role.html
