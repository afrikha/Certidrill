id: dopc02-4b-log-anomaly-detector
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs dozens of microservices that write application logs to Amazon CloudWatch Logs log groups in the Standard log class. After several incidents, the post-incident reviews showed that each incident started with log messages that had never appeared before or with a sudden change in how often a known message appeared. The messages differ for every incident, so the team cannot predict them. The team wants to be told about such changes automatically, with the LEAST operational overhead and without writing filter patterns. Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a metric filter for the words ERROR and Exception on each log group, and create an anomaly detection alarm on each resulting metric.
    - id: b
      text:
        en: |-
          Create a log anomaly detector on each log group, and create alarms on the anomalies that the detectors report.
    - id: c
      text:
        en: |-
          Schedule a CloudWatch Logs Insights query that uses the pattern command every hour from an AWS Lambda function, and compare the results with the previous hour.
    - id: d
      text:
        en: |-
          Create a CloudWatch Contributor Insights rule on each log group that ranks the most frequent log messages, and alarm on the top contributor.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A log anomaly detector uses machine learning and pattern recognition on a log group to establish a baseline, then flags new patterns, significant changes in known patterns, and unusual token values without any pattern to write. It trains on the past two weeks of events, and alarms can be created on the anomalies it reports.
  options:
    a:
      en: |-
        Metric filters count only the words that the team defined in advance, so messages that have never been seen and do not contain these words are missed.
    c:
      en: |-
        A scheduled function and a custom comparison must be written and maintained, which is more overhead than a managed detector.
    d:
      en: |-
        Contributor Insights ranks contributors according to rules that the team writes; it does not detect messages that never appeared before.
references:
  - title: Log anomaly detection - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/LogsAnomalyDetection.html
