# DOP-C02 objectives — AWS Certified DevOps Engineer - Professional (DOP-C02) Exam Guide
# (no version number, no publication date and no revisions page; the PDF carries only
# "Copyright © 2026"), English Markdown domain pages devops-engineer-professional-02-domain1..6.md,
# checked on 2026-11-23; bullet counts cross-checked against the PDF (140 bullets, 18 task statements).
# One group per task statement (title without the "Task Statement n.n:" prefix and final period).
# The DOP-C02 guide still splits each task statement into "Knowledge of" and "Skills in":
# objectives = every "Knowledge of" bullet, then every "Skills in" bullet of that task statement,
# in the guide's order. Codes <domain>.<task>.<n>. `code` is the stable key referenced by question
# files and course sections.
# English only: the exam is not offered in French (certification page: English, Japanese, Korean,
# Simplified Chinese) and the fr_fr guide URL serves the English text (meta locale en_us).
# English: verbatim. Guide wording kept even where AWS names have changed since: "Amazon Kinesis
# Data Firehose" (4.1.8, now Amazon Data Firehose), "Amazon Quick Sight" (4.2.6, now a feature of
# AWS Quick), "AWS Security Hub" (2.2.4, 6.2.4, 6.2.5, now AWS Security Hub CSPM), "AWS OpsWorks"
# (2.1.6, 2.3.5, shut down May 1, 2024), "Amazon Inspector and common assessment templates" (4.2.3:
# assessment templates belong to Amazon Inspector Classic, shut down May 20, 2026).

sdlc:
- group:
    en: Implement CI/CD pipelines
  objectives:
  - code: '1.1.1'
    en: Software development lifecycle (SDLC) concepts, phases, and models
  - code: '1.1.2'
    en: Pipeline deployment patterns for single- and multi-account environments
  - code: '1.1.3'
    en: Configuring code, image, and artifact repositories
  - code: '1.1.4'
    en: Using version control to integrate pipelines with application environments
  - code: '1.1.5'
    en: Setting up build processes (for example, AWS CodeBuild)
  - code: '1.1.6'
    en: Managing build and deployment secrets (for example, AWS Secrets Manager, AWS Systems Manager Parameter Store)
  - code: '1.1.7'
    en: Determining appropriate deployment strategies (for example, AWS CodeDeploy)
- group:
    en: Integrate automated testing into CI/CD pipelines
  objectives:
  - code: '1.2.1'
    en: Different types of tests (for example, unit tests, integration tests, acceptance tests, user interface tests, security scans)
  - code: '1.2.2'
    en: Reasonable use of different types of tests at different stages of the CI/CD pipeline
  - code: '1.2.3'
    en: Running builds or tests when generating pull requests or code merges (for example, CodeBuild)
  - code: '1.2.4'
    en: Running load/stress tests, performance benchmarking, and application testing at scale
  - code: '1.2.5'
    en: Measuring application health based on application exit codes
  - code: '1.2.6'
    en: Automating unit tests and code coverage
  - code: '1.2.7'
    en: Invoking AWS services in a pipeline for testing
- group:
    en: Build and manage artifacts
  objectives:
  - code: '1.3.1'
    en: Artifact use cases and secure management
  - code: '1.3.2'
    en: Methods to create and generate artifacts
  - code: '1.3.3'
    en: Artifact lifecycle considerations
  - code: '1.3.4'
    en: Creating and configuring artifact repositories (for example, AWS CodeArtifact, Amazon S3, Amazon ECR)
  - code: '1.3.5'
    en: Configuring build tools for generating artifacts (for example, CodeBuild, AWS Lambda)
  - code: '1.3.6'
    en: Automating Amazon EC2 instance and container image build processes (for example, EC2 Image Builder)
- group:
    en: Implement deployment strategies for instance, container, and serverless environments
  objectives:
  - code: '1.4.1'
    en: Deployment methodologies for various platforms (for example, Amazon EC2, Amazon ECS, Amazon EKS, Lambda)
  - code: '1.4.2'
    en: Application storage patterns (for example, Amazon EFS, Amazon S3, Amazon EBS)
  - code: '1.4.3'
    en: Mutable deployment patterns in contrast to immutable deployment patterns
  - code: '1.4.4'
    en: Tools and services available for distributing code (for example, CodeDeploy, Image Builder)
  - code: '1.4.5'
    en: Configuring security permissions to allow access to artifact repositories (for example, IAM, CodeArtifact)
  - code: '1.4.6'
    en: Configuring deployment agents (for example, CodeDeploy agent)
  - code: '1.4.7'
    en: Troubleshooting deployment issues
  - code: '1.4.8'
    en: Using different deployment methods (for example, blue/green, canary)
config:
- group:
    en: Define cloud infrastructure and reusable components to provision and manage systems throughout their lifecycle
  objectives:
  - code: '2.1.1'
    en: Infrastructure as code (IaC) options and tools for AWS
  - code: '2.1.2'
    en: Change management processes for IaC-based platforms
  - code: '2.1.3'
    en: Configuration management services and strategies
  - code: '2.1.4'
    en: Composing and deploying IaC templates (for example, AWS SAM, AWS CloudFormation, AWS CDK)
  - code: '2.1.5'
    en: Applying CloudFormation stack sets across multiple accounts and AWS Regions
  - code: '2.1.6'
    en: Determining optimal configuration management services (for example, AWS OpsWorks, AWS Systems Manager, AWS Config, AWS AppConfig)
  - code: '2.1.7'
    en: Implementing infrastructure patterns, governance controls, and security standards into reusable IaC templates (for example, AWS Service Catalog, CloudFormation modules, AWS CDK)
- group:
    en: Deploy automation to create, onboard, and secure AWS accounts in a multi-account or multi-Region environment
  objectives:
  - code: '2.2.1'
    en: AWS account structures, best practices, and related AWS services
  - code: '2.2.2'
    en: Standardizing and automating account provisioning and configuration
  - code: '2.2.3'
    en: Creating, consolidating, and centrally managing accounts (for example, AWS Organizations, AWS Control Tower)
  - code: '2.2.4'
    en: Applying IAM solutions for multi-account and complex organization structures (for example, SCPs, assuming roles)
  - code: '2.2.5'
    en: Implementing and developing governance and security controls at scale (AWS Config, AWS Control Tower, AWS Security Hub, Amazon Detective, Amazon GuardDuty, Service Catalog, SCPs)
- group:
    en: Design and build automated solutions for complex tasks and large-scale environments
  objectives:
  - code: '2.3.1'
    en: AWS services and solutions to automate tasks and processes
  - code: '2.3.2'
    en: Methods and strategies to interact with the AWS software-defined infrastructure
  - code: '2.3.3'
    en: Automating system inventory, configuration, and patch management (for example, Systems Manager, AWS Config)
  - code: '2.3.4'
    en: Developing AWS Lambda function automations for complex scenarios (for example, AWS SDKs, Lambda, AWS Step Functions)
  - code: '2.3.5'
    en: Automating the configuration of software applications to the desired state (for example, OpsWorks, Systems Manager State Manager)
  - code: '2.3.6'
    en: Maintaining software compliance (for example, Systems Manager)
resilience:
- group:
    en: Implement highly available solutions to meet resilience and business requirements
  objectives:
  - code: '3.1.1'
    en: Multi-AZ and multi-Region deployments (for example, compute layer, data layer)
  - code: '3.1.2'
    en: SLAs
  - code: '3.1.3'
    en: Replication and failover methods for stateful services
  - code: '3.1.4'
    en: Techniques to achieve high availability (for example, Multi-AZ, multi-Region)
  - code: '3.1.5'
    en: Translating business requirements into technical resiliency needs
  - code: '3.1.6'
    en: Identifying and remediating single points of failure in existing workloads
  - code: '3.1.7'
    en: Enabling cross-Region solutions where available (for example, Amazon DynamoDB, Amazon RDS, Amazon Route 53, Amazon S3, Amazon CloudFront)
  - code: '3.1.8'
    en: Configuring load balancing to support cross-AZ services
  - code: '3.1.9'
    en: Configuring applications and related services to support multiple Availability Zones and AWS Regions while minimizing downtime
- group:
    en: Implement solutions that are scalable to meet business requirements
  objectives:
  - code: '3.2.1'
    en: Appropriate metrics for scaling services
  - code: '3.2.2'
    en: Loosely coupled and distributed architectures
  - code: '3.2.3'
    en: Serverless architectures
  - code: '3.2.4'
    en: Container platforms
  - code: '3.2.5'
    en: Identifying and remediating scaling issues
  - code: '3.2.6'
    en: Identifying and implementing appropriate auto scaling, load balancing, and caching solutions
  - code: '3.2.7'
    en: Deploying container-based applications (for example, Amazon ECS, Amazon EKS)
  - code: '3.2.8'
    en: Deploying workloads in multiple Regions for global scalability
  - code: '3.2.9'
    en: Configuring serverless applications (for example, Amazon API Gateway, AWS Lambda, AWS Fargate)
- group:
    en: Implement automated recovery processes to meet RTO and RPO requirements
  objectives:
  - code: '3.3.1'
    en: Disaster recovery concepts (for example, RTO, RPO)
  - code: '3.3.2'
    en: AWS Backup and recovery strategies (for example, pilot light, warm standby)
  - code: '3.3.3'
    en: Recovery procedures
  - code: '3.3.4'
    en: Testing failover of Multi-AZ and multi-Region workloads (for example, Amazon RDS, Amazon Aurora, Route 53, CloudFront)
  - code: '3.3.5'
    en: Identifying and implementing appropriate cross-Region AWS Backup and recovery strategies (for example, AWS Backup, Amazon S3, AWS Systems Manager)
  - code: '3.3.6'
    en: Configuring a load balancer to recover from backend failure
monitoring:
- group:
    en: Configure the collection, aggregation, and storage of logs and metrics
  objectives:
  - code: '4.1.1'
    en: How to monitor applications and infrastructure
  - code: '4.1.2'
    en: Amazon CloudWatch metrics (for example, namespaces, metrics, dimensions, and resolution)
  - code: '4.1.3'
    en: Real-time log ingestion
  - code: '4.1.4'
    en: Encryption options for at-rest and in-transit logs and metrics (for example, client-side and server-side, AWS KMS)
  - code: '4.1.5'
    en: Security configurations (for example, IAM roles and permissions to allow for log collection)
  - code: '4.1.6'
    en: Securely storing and managing logs
  - code: '4.1.7'
    en: Creating CloudWatch metrics from log events by using metric filters
  - code: '4.1.8'
    en: Creating CloudWatch metric streams (for example, Amazon S3 or Amazon Kinesis Data Firehose options)
  - code: '4.1.9'
    en: Collecting custom metrics (for example, using the CloudWatch agent)
  - code: '4.1.10'
    en: Managing log storage lifecycles (for example, Amazon S3 lifecycles, CloudWatch log group retention)
  - code: '4.1.11'
    en: Processing log data by using CloudWatch log subscriptions (for example, Amazon Kinesis, AWS Lambda, Amazon OpenSearch Service)
  - code: '4.1.12'
    en: Searching log data by using filter and pattern syntax or Amazon CloudWatch Logs Insights
  - code: '4.1.13'
    en: Configuring encryption of log data (for example, AWS KMS)
- group:
    en: Audit, monitor, and analyze logs and metrics to detect issues
  objectives:
  - code: '4.2.1'
    en: Anomaly detection alarms (for example, CloudWatch anomaly detection)
  - code: '4.2.2'
    en: 'Common CloudWatch metrics and logs (for example, CPU utilization with Amazon EC2, queue length with Amazon RDS, 5xx errors with an Application Load Balancer [ALB])'
  - code: '4.2.3'
    en: Amazon Inspector and common assessment templates
  - code: '4.2.4'
    en: AWS Config rules
  - code: '4.2.5'
    en: AWS CloudTrail log events
  - code: '4.2.6'
    en: Building CloudWatch dashboards and Amazon Quick Sight visualizations
  - code: '4.2.7'
    en: Associating CloudWatch alarms with CloudWatch metrics (standard and custom)
  - code: '4.2.8'
    en: Configuring AWS X-Ray for different services (for example, containers, Amazon API Gateway, Lambda)
  - code: '4.2.9'
    en: Analyzing real-time log streams (for example, using Amazon Kinesis Data Streams)
  - code: '4.2.10'
    en: Analyzing logs with AWS services (for example, Amazon Athena, CloudWatch Logs Insights)
- group:
    en: Automate monitoring and event management of complex environments
  objectives:
  - code: '4.3.1'
    en: Event-driven, asynchronous design patterns (for example, S3 Event Notifications or Amazon EventBridge events to Amazon SNS or Lambda)
  - code: '4.3.2'
    en: Capabilities of auto scaling for a variety of AWS services (for example, EC2 Auto Scaling groups, RDS storage auto scaling, Amazon DynamoDB, Amazon ECS capacity provider, Amazon EKS autoscalers)
  - code: '4.3.3'
    en: Alert notification and action capabilities (for example, CloudWatch alarms to Amazon SNS, Lambda, EC2 automatic recovery)
  - code: '4.3.4'
    en: Health check capabilities in AWS services (for example, ALB target groups, Amazon Route 53)
  - code: '4.3.5'
    en: Configuring solutions for auto scaling (for example, DynamoDB, EC2 Auto Scaling groups, RDS storage auto scaling, ECS capacity provider)
  - code: '4.3.6'
    en: Creating CloudWatch custom metrics and metric filters, alarms, and notifications (for example, Amazon SNS, Lambda)
  - code: '4.3.7'
    en: Configuring S3 events to process log files (for example, by using Lambda) and deliver log files to another destination (for example, OpenSearch Service, CloudWatch Logs)
  - code: '4.3.8'
    en: Configuring EventBridge to send notifications based on a particular event pattern
  - code: '4.3.9'
    en: 'Installing and configuring agents on EC2 instances (for example, AWS Systems Manager Agent [SSM Agent], CloudWatch agent)'
  - code: '4.3.10'
    en: Configuring AWS Config rules to remediate issues
  - code: '4.3.11'
    en: Configuring health checks (for example, Route 53, ALB)
incident:
- group:
    en: Manage event sources to process, notify, and take action in response to events
  objectives:
  - code: '5.1.1'
    en: AWS services that generate, capture, and process events (for example, AWS Health, Amazon EventBridge, AWS CloudTrail)
  - code: '5.1.2'
    en: Event-driven architectures (for example, fan out, event streaming, queuing)
  - code: '5.1.3'
    en: Integrating AWS event sources (for example, AWS Health, EventBridge, CloudTrail)
  - code: '5.1.4'
    en: Building event processing workflows (for example, Amazon SQS, Amazon Kinesis, Amazon SNS, AWS Lambda, AWS Step Functions)
- group:
    en: Implement configuration changes in response to events
  objectives:
  - code: '5.2.1'
    en: Fleet management services (for example, AWS Systems Manager, AWS Auto Scaling)
  - code: '5.2.2'
    en: Configuration management services (for example, AWS Config)
  - code: '5.2.3'
    en: Applying configuration changes to systems
  - code: '5.2.4'
    en: Modifying infrastructure configurations in response to events
  - code: '5.2.5'
    en: Remediating a non-desired system state
- group:
    en: Troubleshoot system and application failures
  objectives:
  - code: '5.3.1'
    en: AWS metrics and logging services (for example, Amazon CloudWatch, AWS X-Ray)
  - code: '5.3.2'
    en: AWS service health services (for example, AWS Health, CloudWatch, Systems Manager OpsCenter)
  - code: '5.3.3'
    en: Root cause analysis
  - code: '5.3.4'
    en: Analyzing failed deployments (for example, AWS CodePipeline, AWS CodeBuild, AWS CodeDeploy, AWS CloudFormation, CloudWatch synthetic monitoring)
  - code: '5.3.5'
    en: Analyzing incidents regarding failed processes (for example, auto scaling, Amazon ECS, Amazon EKS)
security:
- group:
    en: Implement techniques for identity and access management at scale
  objectives:
  - code: '6.1.1'
    en: Appropriate usage of different IAM entities for human and machine access (for example, users, groups, roles, identity providers, identity-based policies, resource-based policies, session policies)
  - code: '6.1.2'
    en: Identity federation techniques (for example, using IAM identity providers and AWS IAM Identity Center)
  - code: '6.1.3'
    en: Permission management delegation by using IAM permissions boundaries
  - code: '6.1.4'
    en: Organizational SCPs
  - code: '6.1.5'
    en: Designing policies to enforce least privilege access
  - code: '6.1.6'
    en: Implementing role-based and attribute-based access control patterns
  - code: '6.1.7'
    en: Automating credential rotation for machine identities (for example, AWS Secrets Manager)
  - code: '6.1.8'
    en: 'Managing permissions to control access to human and machine identities (for example, enabling multi-factor authentication [MFA], AWS STS, IAM profiles)'
- group:
    en: Apply automation for security controls and data protection
  objectives:
  - code: '6.2.1'
    en: Network security components (for example, security groups, network ACLs, routing, AWS Network Firewall, AWS WAF, AWS Shield)
  - code: '6.2.2'
    en: Certificates and public key infrastructure (PKI)
  - code: '6.2.3'
    en: Data management (for example, data classification, encryption, key management, access controls)
  - code: '6.2.4'
    en: Automating the application of security controls in multi-account and multi-Region environments (for example, AWS Security Hub, AWS Organizations, AWS Control Tower, AWS Systems Manager)
  - code: '6.2.5'
    en: 'Combining security controls to apply defense in depth (for example, AWS Certificate Manager [ACM], AWS WAF, AWS Config, AWS Config rules, Security Hub, Amazon GuardDuty, security groups, network ACLs, Amazon Detective, Network Firewall)'
  - code: '6.2.6'
    en: Automating the discovery of sensitive data at scale (for example, Amazon Macie)
  - code: '6.2.7'
    en: Encrypting data in transit and data at rest (for example, AWS KMS, AWS CloudHSM, ACM)
- group:
    en: Implement security monitoring and auditing solutions
  objectives:
  - code: '6.3.1'
    en: Security auditing services and features (for example, AWS CloudTrail, AWS Config, VPC Flow Logs, AWS CloudFormation drift detection)
  - code: '6.3.2'
    en: AWS services for identifying security vulnerabilities and events (for example, GuardDuty, Amazon Inspector, IAM Access Analyzer, AWS Config)
  - code: '6.3.3'
    en: Common cloud security threats (for example, insecure web traffic, exposed AWS access keys, S3 buckets with public access enabled or encryption disabled)
  - code: '6.3.4'
    en: Implementing robust security auditing
  - code: '6.3.5'
    en: Configuring alerting based on unexpected or anomalous security events
  - code: '6.3.6'
    en: Configuring service and application logging (for example, CloudTrail, Amazon CloudWatch Logs)
  - code: '6.3.7'
    en: Analyzing logs, metrics, and security findings
