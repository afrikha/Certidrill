# CLF-C02 — AWS Certified Cloud Practitioner
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-19):
#   - AWS Certified Cloud Practitioner (CLF-C02) Exam Guide, version 1.3, published
#     October 29, 2026 (1.0: June 24, 2026; 1.1: August 28, 2026; 1.2: September 24, 2026),
#     English PDF: https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.pdf
#     French PDF: same path under /fr_fr/ (no version number printed). The HTML guide page
#     could not be read; the PDFs were.
#   - Certification page: https://aws.amazon.com/certification/certified-cloud-practitioner/
#     (90 minutes, 65 questions, multiple choice or multiple response, 100 USD; no successor
#     version announced; only the Italian and German versions retire after December 31, 2026).
# Exam facts: 65 questions = 50 scored + 15 unscored (not identified); scaled score
# 100–1,000, pass at 700, compensatory scoring (no per-domain pass); unanswered = incorrect,
# no penalty for guessing; response types: multiple choice (1 correct of 4) and multiple
# response (2 or more correct of 5 or more). The guide itself does not state the duration.
# Unscored questions are not modelled: the mock exam scores all 65 questions.
# Domain weights: share of scored content as published (24 / 30 / 34 / 12 %).
# Readiness and progression rules are those of AZ-900 / AZ-104.
# active: false until the bank and the course are reviewed and published.
certification:
  code: clf-c02
  title: AWS Certified Cloud Practitioner
  vendor: AWS
  active: false
blueprint:
  version: '2026-10-29'
  durationMin: 90
  questionCount:
    min: 65
    max: 65
  passScore: 700
  maxScore: 1000
  # AWS gives no partial credit on multiple-response questions (see docs/SPECS-AWS.md §3.3);
  # dragdrop states the AWS rule too, though this exam has no such question.
  scoring:
    multi: all_or_nothing
    dragdrop: all_or_nothing
  # The real exam has only multiple choice (single) and multiple response (multi).
  typeMix:
    single:
      min: 0.85
      max: 0.92
    multi:
      min: 0.08
      max: 0.15
  difficultyMix:
    easy: 0.4
    medium: 0.45
    hard: 0.15
  structure:
    caseStudies:
      count:
        min: 0
        max: 0
      questionsEach:
        min: 0
        max: 0
      placement: end
    series:
      count:
        min: 0
        max: 0
      questionsEach:
        min: 0
        max: 0
    maxPerObjective: 2
    warningsMin:
    - 10
    - 5
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale:
        from: 600
        to: 850
      weights:
        level: 0.5
        consistency: 0.2
        domains: 0.2
        freshness: 0.1
      bands:
        progressing: 50
        almost: 70
        ready: 85
      freshness:
        staleDays: 30
        zeroDays: 90
        minNewShare: 0.5
    progression:
      xp:
        base: 50
        scoreFrom: 400
        perPoint: 0.5
        knownShare: 0.5
        passBonus: 100
        bestBonus: 75
        domainBonus: 50
        domainGain: 50
      levels:
      - xp: 0
        title:
          en: Cloud newcomer
          fr: Nouveau venu du cloud
      - xp: 150
        title:
          en: Console visitor
          fr: Visiteur de la console
      - xp: 400
        title:
          en: Service spotter
          fr: Repéreur de services
      - xp: 750
        title:
          en: Region explorer
          fr: Explorateur de Régions
      - xp: 1200
        title:
          en: Shared responsibility keeper
          fr: Gardien de la responsabilité partagée
      - xp: 1750
        title:
          en: Billing watcher
          fr: Vigie de la facturation
      - xp: 2400
        title:
          en: Well-Architected apprentice
          fr: Apprenti Well-Architected
      - xp: 3150
        title:
          en: AWS insider
          fr: Initié AWS
      - xp: 4000
        title:
          en: Cloud practitioner
          fr: Praticien du cloud
      - xp: 5000
