# CLF-C02 objectives — AWS Certified Cloud Practitioner (CLF-C02) Exam Guide, version 1.3
# (October 29, 2026), English PDF and French (fr_fr) PDF, checked on 2026-11-19.
# One group per task statement (title without the "Task Statement n.n:" prefix); objectives =
# every "Knowledge of" bullet, then every "Skills in" bullet of that task statement, in the
# guide's order. Codes <domain>.<task>.<n>.
# `code` is the stable key referenced by question files and course sections.
# English: verbatim. French: from the fr_fr guide (not machine-like; no version printed),
# typographic apostrophes straightened, except these edits (BRIEF-AWS §6, AWS names in English):
#   - "régions" written "Régions" (3.2.1, 3.2.3, 3.2.5, 3.2.8, 4.1.6);
#   - 1.3.3: ". Par exemple, ..." put in parentheses like the English bullet, "(ESG)" -> "[ESG]";
#   - 2.2.8: comma before "l'audit" -> semicolon, as in the English bullet;
#   - 3.3.1, 3.4.1, 3.5.1, 3.6.1: first letter capitalised ("services ..." -> "Services ...");
#   - 2.3.1: "Gérer les identités et les accès (... Gestion des identités et des accès AWS [IAM])"
#     -> "Gestion des identités et des accès (... AWS Identity and Access Management [IAM])";
#   - 2.3.5, 3.6.7: "stratégies" (policies) -> "politiques";
#   - 2.3.6: "l'IAM Identity Center" -> "IAM Identity Center";
#   - 3.1.4: "la console de gestion AWS" -> "l'AWS Management Console";
#   - 3.4.7: verb "Identifier" added (missing in the French bullet);
#   - 3.7.3: "IA Amazon SageMaker" -> "Amazon SageMaker AI";
#   - 3.7.4: "Amazon Quick Sight" -> "Amazon Quick" (name used by the English guide v1.3);
#   - 3.8.3: "Services d'émancipation du client" (machine-like) -> "Services d'accompagnement
#     des clients (Customer Enablement)";
#   - 3.8.5: "navigateur sécurisé Amazon WorkSpaces" -> "Amazon WorkSpaces Secure Browser";
#   - 4.1.1, 4.1.4, 4.1.5: purchasing options in English (On-Demand Instances, Reserved
#     Instances, Spot Instances, Savings Plans, Dedicated Hosts, Dedicated Instances,
#     Capacity Reservations);
#   - 4.2.6: "calculateur de prix AWS" -> "AWS Pricing Calculator";
#   - 4.2.8: "rapport d'utilisation et de coût AWS" -> "AWS Cost and Usage Report";
#   - 4.3.2: "Programmes AWS Support" -> "Plans AWS Support";
#   - 4.3.3, 4.3.4: English name added in parentheses (AWS Partner Network, AWS Support Center);
#   - 4.3.6: "les Recommandations AWS" -> "AWS Prescriptive Guidance";
#   - 4.3.7: "Support de base" -> "Basic Support", "AWS opérations unifiées" -> "AWS Unified Operations";
#   - 4.3.8: "tableau de bord AWS Health" -> "AWS Health Dashboard";
#   - 4.3.10: "(ISV)" written "[ISV]" inside the parentheses;
#   - 4.3.13: "AWS Solutions Architects" -> "les architectes de solutions AWS" (a role, as in English).
# Note: 3.8.5 keeps the guide's name "Amazon AppStream 2.0"; AWS documentation now calls the
# service Amazon WorkSpaces Applications.
concepts:
- group:
    en: Define the benefits of the AWS Cloud
    fr: Définir les avantages du Cloud AWS
  objectives:
  - code: 1.1.1
    en: Value proposition of the AWS Cloud
    fr: Proposition de valeur du Cloud AWS
  - code: 1.1.2
    en: Understanding the benefits of global infrastructure (for example, speed of deployment, global reach)
    fr: Comprendre les avantages d'une infrastructure globale (par exemple, la rapidité du déploiement, la portée mondiale)
  - code: 1.1.3
    en: Understanding the advantages of high availability, elasticity, and agility
    fr: Comprendre les avantages de la haute disponibilité, de l'élasticité et de l'agilité
- group:
    en: Identify design principles of the AWS Cloud
    fr: Identifier les principes de conception du Cloud AWS
  objectives:
  - code: 1.2.1
    en: AWS Well-Architected Framework
    fr: Cadre AWS Well-Architected
  - code: 1.2.2
    en: Understanding the pillars of the Well-Architected Framework (for example, operational excellence, security, reliability, performance efficiency, cost optimization, sustainability)
    fr: Comprendre les piliers du cadre Well-Architected (par exemple, l'excellence opérationnelle, la sécurité, la fiabilité, l'efficacité des performances, l'optimisation des coûts, la durabilité)
  - code: 1.2.3
    en: Identifying differences between the pillars of the Well-Architected Framework
    fr: Identifier les différences entre les piliers du cadre Well-Architected
- group:
    en: Understand the benefits of and strategies for migration to the AWS Cloud
    fr: Comprendre les avantages et les stratégies de la migration vers le Cloud AWS
  objectives:
  - code: 1.3.1
    en: Cloud adoption strategies
    fr: Stratégies d'adoption du cloud
  - code: 1.3.2
    en: Resources to support the cloud migration journey
    fr: Ressources pour soutenir le parcours de migration vers le cloud
  - code: 1.3.3
    en: Understanding the components of the AWS Cloud Adoption Framework (AWS CAF) (for example, reduced business risk; improved environmental, social, and governance [ESG] performance; increased revenue; increased operational efficiency)
    fr: Comprendre les composants du Framework d'adoption du Cloud AWS (AWS CAF) (par exemple, réduction des risques métier ; amélioration des performances environnementales, sociales et de gouvernance [ESG] ; augmentation des revenus ; augmentation de l'efficacité opérationnelle)
  - code: 1.3.4
    en: Identifying appropriate migration strategies (for example, database replication)
    fr: Identifier les stratégies de migration appropriées (par exemple, réplication des bases de données)
- group:
    en: Understand concepts of cloud economics
    fr: Comprendre les concepts de l'économie du cloud
  objectives:
  - code: 1.4.1
    en: Aspects of cloud economics
    fr: Aspects de l'économie du cloud
  - code: 1.4.2
    en: Cost savings of moving to the cloud
    fr: Économies de coûts liées au passage au cloud
  - code: 1.4.3
    en: Understanding the role of fixed costs compared with variable costs
    fr: Comprendre le rôle des coûts fixes par rapport aux coûts variables
  - code: 1.4.4
    en: Understanding costs that are associated with on-premises environments
    fr: Comprendre les coûts associés aux environnements sur site
  - code: 1.4.5
    en: Understanding the differences between licensing strategies (for example, Bring Your Own License [BYOL] model compared with included licenses)
    fr: Comprendre les différences entre les stratégies d'octroi de licences (par exemple, le modèle BYOL [Bring Your Own License] comparé aux licences incluses)
  - code: 1.4.6
    en: Understanding the concept of rightsizing
    fr: Comprendre le concept de dimensionnement approprié
  - code: 1.4.7
    en: Identifying benefits of automation
    fr: Identifier les avantages de l'automatisation
  - code: 1.4.8
    en: Understanding the economies of scale (for example, cost savings)
    fr: Comprendre les économies d'échelle (par exemple, les réductions de coûts)
security:
- group:
    en: Understand the AWS shared responsibility model
    fr: Comprendre le modèle de responsabilité partagée AWS
  objectives:
  - code: 2.1.1
    en: AWS shared responsibility model
    fr: Modèle de responsabilité partagée AWS
  - code: 2.1.2
    en: Recognizing the components of the AWS shared responsibility model
    fr: Reconnaître les composantes du modèle de responsabilité partagée AWS
  - code: 2.1.3
    en: Describing the customer's responsibilities on AWS
    fr: Décrire les responsabilités du client sur AWS
  - code: 2.1.4
    en: Describing AWS responsibilities
    fr: Décrire les responsabilités d'AWS
  - code: 2.1.5
    en: Describing responsibilities that the customer and AWS share
    fr: Décrire les responsabilités partagées du client et d'AWS
  - code: 2.1.6
    en: Describing how AWS responsibilities and customer responsibilities can shift, depending on the service used (for example, Amazon RDS, AWS Lambda, Amazon EC2)
    fr: Décrire comment les responsabilités d'AWS et celles des clients peuvent évoluer, en fonction du service utilisé (par exemple, Amazon RDS, AWS Lambda, Amazon EC2)
- group:
    en: Understand AWS Cloud security, governance, and compliance concepts
    fr: Comprendre les concepts de sécurité, de gouvernance et de conformité du Cloud AWS
  objectives:
  - code: 2.2.1
    en: AWS compliance and governance concepts
    fr: Concepts de conformité et de gouvernance AWS
  - code: 2.2.2
    en: Benefits of cloud security (for example, encryption)
    fr: Avantages de la sécurité du cloud (par exemple, le chiffrement)
  - code: 2.2.3
    en: Where to capture and locate logs that are associated with cloud security
    fr: Où capturer et localiser les journaux qui sont associés à la sécurité du cloud
  - code: 2.2.4
    en: Identifying where to find AWS compliance information (for example, AWS Artifact)
    fr: Identifier où trouver les informations relatives à la conformité AWS (par exemple, AWS Artifact)
  - code: 2.2.5
    en: Understanding compliance needs among geographic locations or industries (for example, AWS compliance)
    fr: Comprendre les besoins en matière de conformité selon les emplacements géographiques ou les secteurs d'activité (par exemple, la conformité AWS)
  - code: 2.2.6
    en: Describing how customers secure resources on AWS (for example, Amazon Inspector, AWS Security Hub, Amazon GuardDuty, AWS Shield)
    fr: Décrire comment les clients protègent les ressources sur AWS (par exemple, Amazon Inspector, AWS Security Hub, Amazon GuardDuty, AWS Shield)
  - code: 2.2.7
    en: Identifying encryption options (for example, encryption in transit, encryption at rest)
    fr: Identifier les options de chiffrement (par exemple, chiffrement en transit, chiffrement au repos)
  - code: 2.2.8
    en: Recognizing services that aid in governance and compliance (for example, monitoring with Amazon CloudWatch; auditing with AWS CloudTrail and AWS Config; reporting with access reports)
    fr: Reconnaître les services qui contribuent à la gouvernance et à la conformité (par exemple, la surveillance avec Amazon CloudWatch ; l'audit avec AWS CloudTrail et AWS Config ; la création de rapports avec les rapports d'accès)
  - code: 2.2.9
    en: Recognizing compliance requirements that vary among AWS services
    fr: Reconnaître les exigences de conformité qui varient selon les services AWS
- group:
    en: Identify AWS access management capabilities
    fr: Identifier les fonctionnalités de gestion des accès dans AWS
  objectives:
  - code: 2.3.1
    en: Identity and access management (for example, AWS Identity and Access Management [IAM])
    fr: Gestion des identités et des accès (par exemple, AWS Identity and Access Management [IAM])
  - code: 2.3.2
    en: Importance of protecting the AWS root user account
    fr: Importance de la protection du compte utilisateur racine d'AWS
  - code: 2.3.3
    en: Principle of least privilege
    fr: Principe du moindre privilège
  - code: 2.3.4
    en: AWS IAM Identity Center
    fr: AWS IAM Identity Center
  - code: 2.3.5
    en: Understanding access keys, password policies, and credential storage (for example, AWS Secrets Manager, AWS Systems Manager)
    fr: Comprendre les clés d'accès, les politiques de mots de passe et le stockage des informations d'identification (par exemple, AWS Secrets Manager, AWS Systems Manager)
  - code: 2.3.6
    en: Identifying authentication methods in AWS (for example, multi-factor authentication [MFA], IAM Identity Center, cross-account IAM roles)
    fr: Identifier les méthodes d'authentification dans AWS (par exemple, l'authentification multifacteur [MFA], IAM Identity Center, les rôles IAM inter-comptes)
  - code: 2.3.7
    en: Defining groups, users, custom policies, and managed policies in compliance with the principle of least privilege
    fr: Définir les groupes, les utilisateurs, les politiques personnalisées et les politiques gérées en respectant le principe du moindre privilège
  - code: 2.3.8
    en: Identifying tasks that only the account root user can perform
    fr: Identifier les tâches que seul l'utilisateur racine du compte peut effectuer
  - code: 2.3.9
    en: Understanding which methods can achieve root user protection
    fr: Comprendre les méthodes permettant de protéger l'utilisateur racine
  - code: 2.3.10
    en: Understanding the types of identity management (for example, federated)
    fr: Comprendre les types de gestion d'identité (par exemple, fédérée)
- group:
    en: Identify components and resources for security
    fr: Identifier les composants et les ressources pour la sécurité
  objectives:
  - code: 2.4.1
    en: Security capabilities that AWS provides
    fr: Fonctions de sécurité proposées par AWS
  - code: 2.4.2
    en: Security-related documentation that AWS provides
    fr: Documentation relative à la sécurité fournie par AWS
  - code: 2.4.3
    en: Describing AWS security features and services (for example, AWS WAF, AWS Firewall Manager, AWS Shield, Amazon GuardDuty)
    fr: Décrire les fonctionnalités et services de sécurité AWS (par exemple, AWS WAF, AWS Firewall Manager, AWS Shield, Amazon GuardDuty)
  - code: 2.4.4
    en: Understanding that third-party security products are available from AWS Marketplace
    fr: Comprendre que des produits de sécurité tiers sont disponibles sur AWS Marketplace
  - code: 2.4.5
    en: Identifying where AWS security information is available (for example, AWS Knowledge Center, AWS Security Center, AWS Security Blog)
    fr: Identifier les sources d'information sur la sécurité AWS (par exemple, AWS Knowledge Center, AWS Security Center, AWS Security Blog)
  - code: 2.4.6
    en: Understanding the use of AWS services for identifying security issues (for example, AWS Trusted Advisor)
    fr: Comprendre l'utilisation des services AWS pour identifier les problèmes de sécurité (par exemple, AWS Trusted Advisor)
technology:
- group:
    en: Define methods of deploying and operating in the AWS Cloud
    fr: Définir les méthodes de déploiement et d'opération dans le Cloud AWS
  objectives:
  - code: 3.1.1
    en: Various ways of provisioning and operating in the AWS Cloud
    fr: Diverses manières de mettre en service et d'utiliser des ressources dans le Cloud AWS
  - code: 3.1.2
    en: Various ways to access AWS services
    fr: Diverses manières d'accéder aux services AWS
  - code: 3.1.3
    en: Types of cloud deployment models
    fr: Types de modèles de déploiement de cloud
  - code: 3.1.4
    en: Deciding between options such as programmatic access (for example, APIs, SDKs, CLI), the AWS Management Console, and infrastructure as code (IaC)
    fr: Choisir entre des options telles que l'accès programmatique (par exemple, API, SDK, CLI), l'AWS Management Console et l'infrastructure as code (IaC)
  - code: 3.1.5
    en: Evaluating requirements to determine whether to use one-time operations or repeatable processes
    fr: Évaluer les besoins pour déterminer s'il est nécessaire d'utiliser des opérations ponctuelles ou des processus reproductibles
  - code: 3.1.6
    en: Identifying deployment models (for example, cloud, hybrid, on-premises)
    fr: Identifier les modèles de déploiement (par exemple, cloud, hybride, sur site)
- group:
    en: Define the AWS global infrastructure
    fr: Décrire l'infrastructure mondiale AWS
  objectives:
  - code: 3.2.1
    en: AWS Regions, Availability Zones, and edge locations
    fr: Régions AWS, zones de disponibilité et emplacements périphériques
  - code: 3.2.2
    en: High availability
    fr: Haute disponibilité
  - code: 3.2.3
    en: Use of multiple Regions
    fr: Utiliser plusieurs Régions
  - code: 3.2.4
    en: Benefits of edge locations
    fr: Avantages des emplacements périphériques
  - code: 3.2.5
    en: Describing relationships among Regions, Availability Zones, and edge locations
    fr: Décrire les relations entre les Régions, les zones de disponibilité (AZ) et les emplacements périphériques
  - code: 3.2.6
    en: Describing how to achieve high availability by using multiple Availability Zones
    fr: Décrire comment obtenir une haute disponibilité en utilisant plusieurs zones de disponibilité (AZ)
  - code: 3.2.7
    en: Recognizing that Availability Zones do not share single points of failure
    fr: Reconnaître que les zones de disponibilité (AZ) ne partagent pas de points d'échec uniques
  - code: 3.2.8
    en: Describing when to use multiple Regions (for example, disaster recovery, business continuity, low latency for end users, data sovereignty)
    fr: Décrire quand utiliser plusieurs Régions (par exemple, reprise après sinistre, continuité d'activité, faible latence pour les utilisateurs finaux, souveraineté des données)
- group:
    en: Identify AWS compute services
    fr: Identifier les services de calcul AWS
  objectives:
  - code: 3.3.1
    en: AWS compute services
    fr: Services de calcul AWS
  - code: 3.3.2
    en: Recognizing the appropriate use of various EC2 instance types (for example, compute optimized, storage optimized)
    fr: Reconnaître l'utilisation appropriée des différents types d'instance Amazon EC2 (par exemple, optimisé pour le calcul, optimisé pour le stockage)
  - code: 3.3.3
    en: Recognizing the appropriate use of various container options (for example, Amazon Elastic Container Service [Amazon ECS], Amazon Elastic Kubernetes Service [Amazon EKS])
    fr: Reconnaître l'utilisation appropriée des différentes options de conteneur (par exemple, Amazon Elastic Container Service [Amazon ECS], Amazon Elastic Kubernetes Service [Amazon EKS])
  - code: 3.3.4
    en: Recognizing the appropriate use of various serverless compute options (for example, AWS Fargate, Lambda)
    fr: Reconnaître l'utilisation appropriée des diverses options de calcul sans serveur (par exemple, AWS Fargate, AWS Lambda)
  - code: 3.3.5
    en: Recognizing that auto scaling provides elasticity
    fr: Reconnaître que le processus de mise à l'échelle automatique apporte de l'élasticité
  - code: 3.3.6
    en: Identifying the purposes of load balancers
    fr: Identifier les objectifs des équilibreurs de charge
- group:
    en: Identify AWS database services
    fr: Identifier les services de base de données AWS
  objectives:
  - code: 3.4.1
    en: AWS database services
    fr: Services de base de données AWS
  - code: 3.4.2
    en: Database migration
    fr: Migration de base de données
  - code: 3.4.3
    en: Deciding when to use EC2 hosted databases or AWS managed databases
    fr: Décider quand utiliser des bases de données hébergées par EC2 ou des bases de données gérées par AWS
  - code: 3.4.4
    en: Identifying relational databases (for example, Amazon RDS, Amazon Aurora)
    fr: Identifier les bases de données relationnelles (par exemple, Amazon RDS, Amazon Aurora)
  - code: 3.4.5
    en: Identifying NoSQL databases (for example, DynamoDB)
    fr: Identifier les bases de données NoSQL (par exemple, Amazon DynamoDB)
  - code: 3.4.6
    en: Identifying memory-based databases (for example, Amazon ElastiCache)
    fr: Identifier les bases de données basées sur la mémoire (par exemple, Amazon ElastiCache)
  - code: 3.4.7
    en: Identifying database migration tools (for example, AWS Database Migration Service [AWS DMS], AWS Schema Conversion Tool [AWS SCT])
    fr: Identifier les outils de migration de bases de données (par exemple, AWS Database Migration Service [AWS DMS], AWS Schema Conversion Tool [AWS SCT])
- group:
    en: Identify AWS network services
    fr: Identifier les services de réseau AWS
  objectives:
  - code: 3.5.1
    en: AWS network services
    fr: Services de réseau AWS
  - code: 3.5.2
    en: Identifying the components of a VPC (for example, subnets, gateways)
    fr: Identifier les composants d'un VPC (par exemple, sous-réseaux, passerelles)
  - code: 3.5.3
    en: Understanding security in a VPC (for example, network ACLs, security groups, Amazon Inspector)
    fr: Comprendre la sécurité dans un VPC (par exemple, ACL réseau, groupes de sécurité, Amazon Inspector)
  - code: 3.5.4
    en: Understanding the purpose of Amazon Route 53
    fr: Comprendre l'utilité d'Amazon Route 53
  - code: 3.5.5
    en: Identifying network connectivity options to AWS (for example, AWS VPN, AWS Direct Connect)
    fr: Identifier les options de connectivité réseau vers AWS (par exemple, AWS VPN, AWS Direct Connect)
- group:
    en: Identify AWS storage services
    fr: Identifier les services de stockage AWS
  objectives:
  - code: 3.6.1
    en: AWS storage services
    fr: Services de stockage AWS
  - code: 3.6.2
    en: Identifying the uses for object storage
    fr: Identifier les utilisations du stockage d'objets
  - code: 3.6.3
    en: Recognizing the differences in Amazon S3 storage classes
    fr: Reconnaître les différences entre les classes de stockage Amazon S3
  - code: 3.6.4
    en: Identifying block storage solutions (for example, Amazon Elastic Block Store [Amazon EBS], instance store)
    fr: Identifier les solutions de stockage en bloc (par exemple, Amazon Elastic Block Store [Amazon EBS], stockage d'instance)
  - code: 3.6.5
    en: Identifying file services (for example, Amazon Elastic File System [Amazon EFS], Amazon FSx)
    fr: Identifier les services de fichiers (par exemple, Amazon Elastic File System [Amazon EFS], Amazon FSx)
  - code: 3.6.6
    en: Identifying cached file systems (for example, AWS Storage Gateway)
    fr: Identifier les systèmes de fichiers mis en cache (par exemple, AWS Storage Gateway)
  - code: 3.6.7
    en: Understanding use cases for lifecycle policies
    fr: Comprendre les cas d'utilisation des politiques de cycle de vie
  - code: 3.6.8
    en: Understanding use cases for AWS Backup
    fr: Comprendre les cas d'utilisation d'AWS Backup
- group:
    en: Identify AWS artificial intelligence and machine learning (AI/ML) services and analytics services
    fr: Identifier les services d'intelligence artificielle et de machine learning (IA/ML) et les services analytiques d'AWS
  objectives:
  - code: 3.7.1
    en: AWS AI/ML services
    fr: Services IA/ML d'AWS
  - code: 3.7.2
    en: AWS analytics services
    fr: Services analytiques d'AWS
  - code: 3.7.3
    en: Understanding AI/ML services and the tasks that they accomplish (for example, Amazon SageMaker AI, Amazon Lex)
    fr: Comprendre les services d'IA/de ML et les tâches qu'ils accomplissent (par exemple, Amazon SageMaker AI, Amazon Lex)
  - code: 3.7.4
    en: Identifying the services for data analytics (for example, Amazon Athena, Amazon Kinesis, AWS Glue, Amazon Quick)
    fr: Identifier les services pour l'analytique des données (par exemple, Amazon Athena, Amazon Kinesis, AWS Glue, Amazon Quick)
- group:
    en: Identify services from other in-scope AWS service categories
    fr: Identifier les services d'autres catégories de services AWS incluses dans le champ de l'examen
  objectives:
  - code: 3.8.1
    en: Application integration services of Amazon EventBridge, Amazon Simple Notification Service (Amazon SNS), and Amazon Simple Queue Service (Amazon SQS)
    fr: Services d'intégration d'applications d'Amazon EventBridge, Amazon Simple Notification Service (Amazon SNS) et Amazon Simple Queue Service (Amazon SQS)
  - code: 3.8.2
    en: Business application services of Amazon Connect and Amazon Simple Email Service (Amazon SES)
    fr: Services d'applications professionnelles d'Amazon Connect et Amazon Simple Email Service (Amazon SES)
  - code: 3.8.3
    en: Customer enablement services (for example, AWS Support)
    fr: Services d'accompagnement des clients (Customer Enablement) (par exemple, AWS Support)
  - code: 3.8.4
    en: Developer tool services and capabilities (for example, AWS CodeBuild, AWS CodePipeline, and AWS X-Ray)
    fr: Services et capacités des outils pour développeur (par exemple, AWS CodeBuild, AWS CodePipeline et AWS X-Ray)
  - code: 3.8.5
    en: End-user computing services of Amazon AppStream 2.0, Amazon WorkSpaces, and Amazon WorkSpaces Secure Browser
    fr: Services de calcul pour l'utilisateur final d'Amazon AppStream 2.0, Amazon WorkSpaces et Amazon WorkSpaces Secure Browser
  - code: 3.8.6
    en: Frontend web and mobile services of AWS Amplify
    fr: Services front-end web et mobiles d'AWS Amplify
  - code: 3.8.7
    en: IoT services (for example, AWS IoT Core)
    fr: Services IoT (par exemple, AWS IoT Core)
  - code: 3.8.8
    en: Choosing the appropriate service to deliver messages and to send alerts and notifications
    fr: Choisir le service approprié pour diffuser les messages et envoyer des alertes et des notifications
  - code: 3.8.9
    en: Choosing the appropriate service to meet business application needs
    fr: Choisir le service approprié pour répondre aux besoins de l'application métier
  - code: 3.8.10
    en: Choosing the appropriate option for business support assistance
    fr: Choisir l'option appropriée pour l'assistance aux entreprises
  - code: 3.8.11
    en: Identifying the tools to develop, deploy, and troubleshoot applications
    fr: Identifier les outils pour développer, déployer et résoudre les problèmes des applications
  - code: 3.8.12
    en: Identifying the services that can present the output of virtual machines (VMs) on end-user machines
    fr: Identifier les services qui peuvent présenter la sortie des machines virtuelles (VM) sur les machines des utilisateurs finaux
  - code: 3.8.13
    en: Identifying the services that can create and deploy frontend and mobile services
    fr: Identifier les services qui peuvent créer et déployer des services front-end et mobiles
  - code: 3.8.14
    en: Identifying the services that manage IoT devices
    fr: Identifier les services qui gèrent les périphériques IoT
billing:
- group:
    en: Compare AWS pricing models
    fr: Comparer les modèles de tarification AWS
  objectives:
  - code: 4.1.1
    en: Compute purchasing options (for example, On-Demand Instances, Reserved Instances, Spot Instances, Savings Plans, Dedicated Hosts, Dedicated Instances, Capacity Reservations)
    fr: Options d'achat de capacités de calcul (par exemple, On-Demand Instances, Reserved Instances, Spot Instances, Savings Plans, Dedicated Hosts, Dedicated Instances, Capacity Reservations)
  - code: 4.1.2
    en: Storage options and tiers
    fr: Options et niveaux de stockage
  - code: 4.1.3
