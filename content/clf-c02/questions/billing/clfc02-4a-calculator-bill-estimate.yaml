id: clfc02-4a-calculator-bill-estimate
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The management account of an organization plans to add a new workload and to buy new Savings Plans. The finance team wants to estimate the effect of both changes on the whole consolidated bill, including the organization's existing usage and commitments, without changing the current commitments.

    What should the finance team use?
  fr: |
    Le compte de gestion d'une organisation prévoit d'ajouter une nouvelle charge de travail et d'acheter de nouveaux Savings Plans. L'équipe financière veut estimer l'effet de ces deux changements sur l'ensemble de la facture consolidée, en incluant l'utilisation et les engagements existants de l'organisation, sans modifier les engagements actuels.

    Que doit utiliser l'équipe financière ?
body:
  options:
    - { id: a, text: { en: "A bill estimate in the in-console AWS Pricing Calculator", fr: "Une estimation de facture dans AWS Pricing Calculator de la console" } }
    - { id: b, text: { en: "An estimate on the public AWS Pricing Calculator website", fr: "Une estimation sur le site web public d'AWS Pricing Calculator" } }
    - { id: c, text: { en: "The 18-month cost forecast in AWS Cost Explorer", fr: "La prévision des coûts sur 18 mois dans AWS Cost Explorer" } }
    - { id: d, text: { en: "A Savings Plans coverage budget in AWS Budgets", fr: "Un budget de couverture des Savings Plans dans AWS Budgets" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A bill estimate in the in-console Pricing Calculator models usage and commitment changes against the entire consolidated bill. It automatically includes last month's consolidated usage and the existing Savings Plans and Reserved Instances, and it does not affect the current commitments or the actual bill. Bill estimates are available to management and standalone accounts."
    fr: "Une estimation de facture dans Pricing Calculator de la console modélise des changements d'utilisation et d'engagements sur l'ensemble de la facture consolidée. Elle inclut automatiquement l'utilisation consolidée du mois précédent ainsi que les Savings Plans et Reserved Instances existants, sans affecter les engagements actuels ni la facture réelle. Les estimations de facture sont disponibles pour les comptes de gestion et les comptes autonomes."
  options:
    b:
      en: "The public calculator estimates workloads at public prices; it cannot import the organization's existing usage and commitments."
      fr: "Le calculateur public estime des charges de travail aux tarifs publics ; il ne peut pas importer l'utilisation et les engagements existants de l'organisation."
    c:
      en: "The Cost Explorer forecast projects costs from past usage; it cannot model a new workload or a planned commitment purchase."
      fr: "La prévision de Cost Explorer projette les coûts à partir de l'utilisation passée ; elle ne peut pas modéliser une nouvelle charge de travail ni un achat d'engagement prévu."
    d:
      en: "A coverage budget alerts when Savings Plans coverage falls below a target; it does not estimate the effect of planned changes."
      fr: "Un budget de couverture alerte lorsque la couverture des Savings Plans passe sous un objectif ; il n'estime pas l'effet de changements prévus."
references:
  - title: Generating estimates with Pricing Calculator
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/pricing-calculator.html
