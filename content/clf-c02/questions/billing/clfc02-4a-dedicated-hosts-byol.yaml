id: clfc02-4a-dedicated-hosts-byol
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to bring its existing per-core software licenses to Amazon EC2. The license terms require visibility of the number of sockets and physical cores of the server that runs the software.

    Which EC2 purchasing option meets this requirement?
  fr: |
    Une entreprise veut apporter ses licences logicielles existantes, facturées par cœur, sur Amazon EC2. Les conditions de licence exigent de connaître le nombre de sockets et de cœurs physiques du serveur qui exécute le logiciel.

    Quelle option d'achat EC2 répond à cette exigence ?
body:
  options:
    - { id: a, text: "Dedicated Instances" }
    - { id: b, text: "Dedicated Hosts" }
    - { id: c, text: "On-Demand Capacity Reservations" }
    - { id: d, text: { en: "Convertible Reserved Instances", fr: "Instances réservées convertibles" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A Dedicated Host is a physical server fully dedicated to the company. It shows the number of sockets and physical cores, gives control over instance placement, and supports bringing existing per-socket, per-core or per-VM licenses."
    fr: "Un Dedicated Host est un serveur physique entièrement dédié à l'entreprise. Il indique le nombre de sockets et de cœurs physiques, donne le contrôle du placement des instances et permet d'apporter des licences existantes par socket, par cœur ou par machine virtuelle."
  options:
    a:
      en: "Dedicated Instances run on single-tenant hardware, but they give no visibility of sockets and cores, so per-core licensing cannot be tracked."
      fr: "Les Dedicated Instances s'exécutent sur du matériel à locataire unique, mais elles ne donnent aucune visibilité sur les sockets et les cœurs : les licences par cœur ne peuvent pas être suivies."
    c:
      en: "Capacity Reservations reserve capacity in an Availability Zone; they give no visibility of the sockets and cores of the physical server."
      fr: "Les Capacity Reservations réservent de la capacité dans une zone de disponibilité ; elles ne donnent aucune visibilité sur les sockets et les cœurs du serveur physique."
    d:
      en: "Convertible Reserved Instances are a billing discount with exchange flexibility; they do not provide a dedicated physical server."
      fr: "Les instances réservées convertibles sont une remise de facturation avec une flexibilité d'échange ; elles ne fournissent pas de serveur physique dédié."
references:
  - title: Amazon EC2 Dedicated Hosts
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html
