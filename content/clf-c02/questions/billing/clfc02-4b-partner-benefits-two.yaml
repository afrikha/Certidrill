id: clfc02-4b-partner-benefits-two
objective: "4.3.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A software company is evaluating whether to join the AWS Partner Network.

    Which two are benefits of being an AWS Partner? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un éditeur de logiciels se demande s'il doit rejoindre l'AWS Partner Network.

    Quels sont les deux avantages d'être partenaire AWS ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Exemption from the service quotas of its AWS accounts", fr: "Une exemption des quotas de service de ses comptes AWS" } }
    - { id: b, text: { en: "Access to AWS Partner events, such as AWS Spotlight Days", fr: "L'accès aux événements des partenaires AWS, comme les AWS Spotlight Days" } }
    - { id: c, text: { en: "Access to the resources of AWS customers' accounts", fr: "L'accès aux ressources des comptes des clients AWS" } }
    - { id: d, text: { en: "Responsibility for the security of the AWS infrastructure", fr: "La responsabilité de la sécurité de l'infrastructure AWS" } }
    - { id: e, text: { en: "AWS programs, funding and tools to build and sell solutions", fr: "Des programmes, financements et outils AWS pour créer et vendre des solutions" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "AWS Partners use AWS programs, funding and tools to build solutions, and they can sell them through AWS Marketplace with co-selling support. They also get partner training and events, such as AWS Spotlight Days and AWS PartnerCast webinars."
    fr: "Les partenaires AWS utilisent les programmes, financements et outils d'AWS pour créer des solutions, qu'ils peuvent vendre via AWS Marketplace avec un soutien à la vente conjointe. Ils bénéficient aussi de formations et d'événements pour les partenaires, comme les AWS Spotlight Days et les webinaires AWS PartnerCast."
  options:
    a:
      en: "Service quotas apply to every account; partners request increases like any other customer."
      fr: "Les quotas de service s'appliquent à tous les comptes ; les partenaires demandent des augmentations comme tout autre client."
    c:
      en: "Being a partner gives no access to customer accounts; a customer must grant access itself."
      fr: "Être partenaire ne donne aucun accès aux comptes des clients ; c'est le client qui doit accorder l'accès."
    d:
      en: "The security of the AWS infrastructure stays the responsibility of AWS under the shared responsibility model."
      fr: "La sécurité de l'infrastructure AWS reste la responsabilité d'AWS selon le modèle de responsabilité partagée."
references:
  - title: Become an AWS Partner
    url: https://aws.amazon.com/partners/
  - title: Training and Certification for AWS Partners
    url: https://aws.amazon.com/partners/training/
