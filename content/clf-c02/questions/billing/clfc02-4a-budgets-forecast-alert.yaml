id: clfc02-4a-budgets-forecast-alert
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to receive an email before its monthly AWS costs exceed USD 5,000, based on the forecasted spend for the month.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise veut recevoir un e-mail avant que ses coûts AWS mensuels ne dépassent 5 000 USD, sur la base des dépenses prévues pour le mois.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "AWS Cost Explorer" }
    - { id: b, text: "AWS Pricing Calculator" }
    - { id: c, text: "AWS Cost and Usage Report" }
    - { id: d, text: "AWS Budgets" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Budgets lets a company set a cost budget and be alerted on actual spend or on forecasted spend, before the cost accrues. Notifications go to email addresses, an Amazon SNS topic, or both."
    fr: "AWS Budgets permet de définir un budget de coûts et d'être alerté sur les dépenses réelles ou sur les dépenses prévues, avant que le coût ne soit engagé. Les notifications sont envoyées à des adresses e-mail, à une rubrique Amazon SNS, ou aux deux."
  options:
    a:
      en: "Cost Explorer visualizes past costs and forecasts future costs, but it does not send threshold alerts."
      fr: "Cost Explorer visualise les coûts passés et prévoit les coûts futurs, mais il n'envoie pas d'alertes de seuil."
    b:
      en: "AWS Pricing Calculator estimates the cost of planned workloads; it does not monitor actual spend."
      fr: "AWS Pricing Calculator estime le coût de charges de travail prévues ; il ne surveille pas les dépenses réelles."
    c:
      en: "The Cost and Usage Report delivers detailed billing data files; it does not send alerts."
      fr: "Cost and Usage Report fournit des fichiers détaillés de données de facturation ; il n'envoie pas d'alertes."
references:
  - title: Managing your costs with AWS Budgets
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html
