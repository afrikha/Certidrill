id: clfc02-4b-tag-project-two-steps
objective: "4.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations. The finance team wants the AWS Cost and Usage Report to show the cost of each project.

    Which two actions should the company take? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise AWS Organizations. L'équipe financière souhaite que l'AWS Cost and Usage Report indique le coût de chaque projet.

    Quelles sont les deux actions que l'entreprise doit effectuer ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply a user-defined tag with the key Project to the resources.", fr: "Appliquer aux ressources une balise définie par l'utilisateur avec la clé Project." } }
    - { id: b, text: { en: "Apply a tag with the key aws:Project to the resources.", fr: "Appliquer aux ressources une balise avec la clé aws:Project." } }
    - { id: c, text: { en: "Turn on the AWS Trusted Advisor cost optimization checks.", fr: "Activer les vérifications d'optimisation des coûts d'AWS Trusted Advisor." } }
    - { id: d, text: { en: "Activate the Project tag as a cost allocation tag in the management account.", fr: "Activer la balise Project comme balise de répartition des coûts dans le compte de gestion." } }
    - { id: e, text: { en: "Create one AWS Budgets budget for each project.", fr: "Créer un budget AWS Budgets pour chaque projet." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The company first tags its resources with a user-defined tag such as Project. The tag is then activated as a cost allocation tag in the Billing and Cost Management console; in an organization, only the management account can do this. After activation, billing reports can group costs by the tag."
    fr: "L'entreprise balise d'abord ses ressources avec une balise définie par l'utilisateur, par exemple Project. La balise est ensuite activée comme balise de répartition des coûts dans la console Billing and Cost Management ; dans une organisation, seul le compte de gestion peut le faire. Après activation, les rapports de facturation peuvent regrouper les coûts par balise."
  options:
    b:
      en: "The aws: prefix is reserved for AWS-generated tags; customers cannot assign it."
      fr: "Le préfixe aws: est réservé aux balises générées par AWS ; les clients ne peuvent pas l'attribuer."
    c:
      en: "Trusted Advisor recommends ways to save money, but it does not add project costs to billing reports."
      fr: "Trusted Advisor recommande des moyens d'économiser, mais il n'ajoute pas les coûts par projet aux rapports de facturation."
    e:
      en: "Budgets send alerts against a threshold; they do not add a project dimension to the Cost and Usage Report."
      fr: "Les budgets envoient des alertes par rapport à un seuil ; ils n'ajoutent pas de dimension projet à l'AWS Cost and Usage Report."
references:
  - title: Organizing and tracking costs using AWS cost allocation tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html
  - title: Using user-defined tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/custom-tags.html
