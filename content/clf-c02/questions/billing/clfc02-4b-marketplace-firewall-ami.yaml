id: clfc02-4b-marketplace-firewall-ami
objective: "4.3.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to deploy a third-party firewall from a software vendor on Amazon EC2, pay for it by the hour, and see the charges on its AWS bill.

    Which AWS service meets these requirements?
  fr: |
    Une entreprise souhaite déployer sur Amazon EC2 un pare-feu tiers d'un éditeur de logiciels, le payer à l'heure et voir les frais sur sa facture AWS.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Artifact" }
    - { id: b, text: "AWS Marketplace" }
    - { id: c, text: "AWS Service Catalog" }
    - { id: d, text: "AWS License Manager" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Marketplace is a curated digital catalog of third-party software, data and services that run on AWS, sold by independent software vendors. Products such as AMIs can use hourly pricing, and AWS handles the billing: the charges appear on the AWS bill."
    fr: "AWS Marketplace est un catalogue numérique organisé de logiciels, de données et de services tiers qui s'exécutent sur AWS, vendus par des fournisseurs indépendants de logiciels (ISV). Des produits comme les AMI peuvent être facturés à l'heure, et AWS gère la facturation : les frais apparaissent sur la facture AWS."
  options:
    a:
      en: "AWS Artifact provides AWS compliance reports and agreements; it does not sell third-party software."
      fr: "AWS Artifact fournit les rapports de conformité et les accords d'AWS ; il ne vend pas de logiciels tiers."
    c:
      en: "Service Catalog lets an organization share its own approved IT products with its users; it is not a store of vendor software."
      fr: "Service Catalog permet à une organisation de partager ses propres produits informatiques approuvés avec ses utilisateurs ; ce n'est pas une boutique de logiciels d'éditeurs."
    d:
      en: "License Manager tracks software licenses that the company already uses; it does not sell software."
      fr: "License Manager suit les licences logicielles que l'entreprise utilise déjà ; il ne vend pas de logiciels."
references:
  - title: What is AWS Marketplace?
    url: https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html
