id: clfc02-4a-billing-case-iam
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial analyst signs in to the company's AWS account as an IAM user and must ask AWS about an invoice. The company never shares its root user credentials.

    What should the company do so that the analyst can contact AWS about the invoice?
  fr: |
    Un analyste financier se connecte au compte AWS de l'entreprise en tant qu'utilisateur IAM et doit interroger AWS au sujet d'une facture. L'entreprise ne partage jamais les informations d'identification de son utilisateur racine.

    Que doit faire l'entreprise pour que l'analyste puisse contacter AWS au sujet de la facture ?
body:
  options:
    - { id: a, text: { en: "Give the IAM user permissions to open support cases, then open an account and billing case.", fr: "Donner à l'utilisateur IAM les autorisations d'ouvrir des dossiers de support, puis ouvrir un dossier de compte et de facturation." } }
    - { id: b, text: { en: "Upgrade to Enterprise Support, because only paid plans let IAM users open billing cases.", fr: "Passer à Enterprise Support, car seuls les plans payants permettent aux utilisateurs IAM d'ouvrir des dossiers de facturation." } }
    - { id: c, text: { en: "Ask the analyst to start an instant messaging chat about the invoice from the console.", fr: "Demander à l'analyste de lancer une discussion par messagerie instantanée sur la facture depuis la console." } }
    - { id: d, text: { en: "Give the analyst the root user credentials only for the time of the case.", fr: "Donner à l'analyste les informations d'identification de l'utilisateur racine uniquement le temps du dossier." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A billing case can be opened by the root user or by an IAM identity that has permissions to open support cases. Account and billing support is free for every account, and the analyst chooses email or a phone callback as the contact option."
    fr: "Un dossier de facturation peut être ouvert par l'utilisateur racine ou par une identité IAM qui dispose des autorisations d'ouvrir des dossiers de support. Le support de compte et de facturation est gratuit pour tous les comptes, et l'analyste choisit l'e-mail ou un rappel téléphonique comme mode de contact."
  options:
    b:
      en: "Account and billing support is free with every plan, and IAM users only need the right permissions."
      fr: "Le support de compte et de facturation est gratuit avec tous les plans, et les utilisateurs IAM n'ont besoin que des bonnes autorisations."
    c:
      en: "Instant messaging is not available for billing inquiries; billing cases are answered by email or by phone."
      fr: "La messagerie instantanée n'est pas disponible pour les questions de facturation ; les dossiers de facturation reçoivent une réponse par e-mail ou par téléphone."
    d:
      en: "Sharing root user credentials breaks security best practices and is not needed, since IAM identities can open billing cases."
      fr: "Partager les informations d'identification de l'utilisateur racine enfreint les bonnes pratiques de sécurité et n'est pas nécessaire, puisque les identités IAM peuvent ouvrir des dossiers de facturation."
references:
  - title: Getting help with your bills and payments
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/billing-get-answers.html
