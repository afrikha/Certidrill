id: clfc02-4b-health-api-plan
objective: "4.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has Basic Support. Its in-house monitoring tool calls the AWS Health API to import health events, but every call fails with a SubscriptionRequiredException error.

    Which change will fix the problem MOST cost-effectively?
  fr: |
    Une entreprise dispose de Basic Support. Son outil de supervision interne appelle l'API AWS Health pour importer les événements d'état, mais chaque appel échoue avec l'erreur SubscriptionRequiredException.

    Quel changement résoudra le problème de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Upgrade the account to AWS Enterprise Support.", fr: "Passer le compte à AWS Enterprise Support." } }
    - { id: b, text: { en: "Read the RSS feed of the AWS Health Dashboard instead.", fr: "Lire plutôt le flux RSS d'AWS Health Dashboard." } }
    - { id: c, text: { en: "Upgrade the account to AWS Business Support+.", fr: "Passer le compte à AWS Business Support+." } }
    - { id: d, text: { en: "Turn on the Trusted Advisor checks for the account.", fr: "Activer les vérifications Trusted Advisor pour le compte." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS Health API requires AWS Business Support+, AWS Enterprise Support or AWS Unified Operations; an account without one of these plans gets a SubscriptionRequiredException error. Business Support+ is the least expensive of these plans."
    fr: "L'API AWS Health nécessite AWS Business Support+, AWS Enterprise Support ou AWS Unified Operations ; un compte sans l'un de ces plans reçoit l'erreur SubscriptionRequiredException. Business Support+ est le moins cher de ces plans."
  options:
    a:
      en: "Enterprise Support also gives access to the AWS Health API, but it costs more than Business Support+."
      fr: "Enterprise Support donne aussi accès à l'API AWS Health, mais il coûte plus cher que Business Support+."
    b:
      en: "The RSS feed is not the API, and its format can change; it does not fix the failing API calls."
      fr: "Le flux RSS n'est pas l'API et son format peut changer ; il ne corrige pas les appels d'API qui échouent."
    d:
      en: "Trusted Advisor checks do not grant access to the AWS Health API; the Support plan does."
      fr: "Les vérifications Trusted Advisor ne donnent pas accès à l'API AWS Health ; c'est le plan de support qui le fait."
references:
  - title: Integrating AWS Health with other systems using the AWS Health API
    url: https://docs.aws.amazon.com/health/latest/ug/health-api.html
