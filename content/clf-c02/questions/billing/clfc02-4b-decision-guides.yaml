id: clfc02-4b-decision-guides
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company cannot decide whether its new workload should use block, file or object storage on AWS. It wants official AWS guidance that compares the storage services against its data access patterns.

    Which AWS resource meets this requirement?
  fr: |
    Une entreprise n'arrive pas à choisir entre un stockage en mode bloc, fichier ou objet sur AWS pour sa nouvelle charge de travail. Elle souhaite des recommandations officielles d'AWS qui comparent les services de stockage selon ses modèles d'accès aux données.

    Quelle ressource AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "AWS Pricing Calculator" }
    - { id: b, text: "AWS Trusted Advisor" }
    - { id: c, text: "AWS Knowledge Center" }
    - { id: d, text: "AWS Decision Guides" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Decision Guides give structured comparisons of AWS services that address a similar need, with the criteria to choose between them. The Choosing an AWS storage service guide compares block, file and object storage based on data access patterns."
    fr: "Les AWS Decision Guides comparent de façon structurée les services AWS qui répondent à un même besoin, avec les critères pour choisir entre eux. Le guide Choosing an AWS storage service compare le stockage en mode bloc, fichier et objet selon les modèles d'accès aux données."
  options:
    a:
      en: "Pricing Calculator estimates the cost of an architecture you have already chosen; it does not compare which service fits a workload."
      fr: "Pricing Calculator estime le coût d'une architecture déjà choisie ; il ne compare pas les services pour déterminer celui qui convient à une charge de travail."
    b:
      en: "Trusted Advisor checks existing resources against best practices; it does not help choose a service for a new workload."
      fr: "Trusted Advisor compare les ressources existantes aux bonnes pratiques ; il n'aide pas à choisir un service pour une nouvelle charge de travail."
    c:
      en: "The Knowledge Center answers frequent questions about specific services; it does not offer structured comparisons to choose between services."
      fr: "Le Knowledge Center répond aux questions fréquentes sur des services précis ; il ne propose pas de comparaisons structurées pour choisir entre services."
references:
  - title: AWS Decision Guides
    url: https://docs.aws.amazon.com/decision-guides/
