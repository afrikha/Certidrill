id: clfc02-4a-s3-one-zone-ia
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores image thumbnails in Amazon S3. The thumbnails are accessed about once a month, must be returned in milliseconds, and can be regenerated from the originals if they are lost.

    Which S3 storage class is the MOST cost-effective for the thumbnails?
  fr: |
    Une entreprise stocke des miniatures d'images dans Amazon S3. Les miniatures sont consultées environ une fois par mois, doivent être renvoyées en quelques millisecondes et peuvent être régénérées à partir des originaux si elles sont perdues.

    Quelle classe de stockage S3 est la PLUS rentable pour les miniatures ?
body:
  options:
    - { id: a, text: "S3 Standard" }
    - { id: b, text: "S3 Standard-IA" }
    - { id: c, text: "S3 One Zone-IA" }
    - { id: d, text: "S3 Glacier Deep Archive" }
answer: { optionId: c }
explanation:
  correct:
    en: "S3 One Zone-IA is designed for re-creatable data that is accessed about once a month, with millisecond access. It stores data in a single Availability Zone, which makes it cheaper than the classes that store data across at least three Availability Zones. The possible loss of the zone is acceptable because the thumbnails can be regenerated."
    fr: "S3 One Zone-IA est conçue pour des données recréables consultées environ une fois par mois, avec un accès en millisecondes. Elle stocke les données dans une seule zone de disponibilité, ce qui la rend moins chère que les classes qui stockent les données sur au moins trois zones de disponibilité. La perte éventuelle de la zone est acceptable puisque les miniatures peuvent être régénérées."
  options:
    a:
      en: "S3 Standard is designed for frequently accessed data; its storage price is higher than that of the infrequent access classes."
      fr: "S3 Standard est conçue pour des données fréquemment consultées ; son prix de stockage est plus élevé que celui des classes à accès peu fréquent."
    b:
      en: "S3 Standard-IA fits monthly access too, but it stores data across multiple Availability Zones and costs more than One Zone-IA, a resilience the re-creatable thumbnails do not need."
      fr: "S3 Standard-IA convient aussi à un accès mensuel, mais elle stocke les données sur plusieurs zones de disponibilité et coûte plus cher que One Zone-IA, une résilience inutile pour des miniatures recréables."
    d:
      en: "S3 Glacier Deep Archive objects must be restored before access, which takes hours, so it fails the millisecond access requirement."
      fr: "Les objets S3 Glacier Deep Archive doivent être restaurés avant tout accès, ce qui prend des heures : la classe ne respecte pas l'exigence d'accès en millisecondes."
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
