id: clfc02-4a-billing-case-basic
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has the Basic Support plan. Its finance team has a question about an unexpected charge on the latest AWS bill.

    What should the finance team do?
  fr: |
    Une entreprise dispose du plan Basic Support. Son équipe financière a une question sur des frais inattendus figurant sur la dernière facture AWS.

    Que doit faire l'équipe financière ?
body:
  options:
    - { id: a, text: { en: "Upgrade to Business Support+ before asking AWS about the charge.", fr: "Passer à Business Support+ avant d'interroger AWS sur ces frais." } }
    - { id: b, text: { en: "Open an account and billing support case in the AWS Support Center.", fr: "Ouvrir un dossier Account and billing support dans le Centre de support AWS (AWS Support Center)." } }
    - { id: c, text: { en: "Run the AWS Trusted Advisor checks to dispute the charge.", fr: "Exécuter les contrôles d'AWS Trusted Advisor pour contester ces frais." } }
    - { id: d, text: { en: "Post the account's billing details on AWS re:Post to get an answer.", fr: "Publier les détails de facturation du compte sur AWS re:Post pour obtenir une réponse." } }
answer: { optionId: b }
explanation:
  correct:
    en: "All AWS account owners have access to account and billing support free of charge; only personalized technical support requires a paid support plan. The team opens a case in the Support Center and chooses Account and billing support, then gets an answer by email or by phone callback."
    fr: "Tous les titulaires de compte AWS ont accès gratuitement au support de compte et de facturation ; seul le support technique personnalisé nécessite un plan de support payant. L'équipe ouvre un dossier dans le Centre de support et choisit Account and billing support, puis reçoit une réponse par e-mail ou par rappel téléphonique."
  options:
    a:
      en: "Account and billing support is available to every account at no charge, including accounts with Basic Support."
      fr: "Le support de compte et de facturation est accessible gratuitement à tous les comptes, y compris ceux qui ont Basic Support."
    c:
      en: "Trusted Advisor runs best-practice checks on resources; it is not a channel to question or dispute a charge."
      fr: "Trusted Advisor exécute des contrôles de bonnes pratiques sur les ressources ; ce n'est pas un moyen de contester des frais."
    d:
      en: "re:Post is a public community site: it is not the place for account-specific billing details, and AWS handles bill inquiries through support cases."
      fr: "re:Post est un site communautaire public : ce n'est pas le lieu pour des détails de facturation propres au compte, et AWS traite les questions sur les factures via des dossiers de support."
references:
  - title: Getting help with your bills and payments
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/billing-get-answers.html
