id: clfc02-4a-cost-explorer-history
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manager wants to view graphs of the company's AWS costs over the past 12 months, grouped by service, and see a forecast of future costs.

    Which AWS service should the manager use?
  fr: |
    Un responsable veut afficher des graphiques des coûts AWS de l'entreprise sur les 12 derniers mois, regroupés par service, et voir une prévision des coûts futurs.

    Quel service AWS le responsable doit-il utiliser ?
body:
  options:
    - { id: a, text: "AWS Cost Explorer" }
    - { id: b, text: "AWS Budgets" }
    - { id: c, text: "AWS Trusted Advisor" }
    - { id: d, text: "AWS Pricing Calculator" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Cost Explorer shows up to the last 13 months of cost and usage data plus the current month, with graphs that can be grouped by service, and it forecasts costs for the next 18 months. Viewing costs in the Cost Explorer console is free."
    fr: "AWS Cost Explorer affiche jusqu'aux 13 derniers mois de données de coûts et d'utilisation, plus le mois en cours, dans des graphiques regroupables par service, et il prévoit les coûts des 18 mois suivants. L'affichage des coûts dans la console Cost Explorer est gratuit."
  options:
    b:
      en: "AWS Budgets tracks spend against thresholds and sends alerts; it is not the tool for exploring 12 months of cost history in graphs."
      fr: "AWS Budgets suit les dépenses par rapport à des seuils et envoie des alertes ; ce n'est pas l'outil pour explorer 12 mois d'historique de coûts en graphiques."
    c:
      en: "Trusted Advisor runs best-practice checks, including cost optimization checks; it does not chart cost history by service."
      fr: "Trusted Advisor exécute des contrôles de bonnes pratiques, notamment d'optimisation des coûts ; il ne trace pas l'historique des coûts par service."
    d:
      en: "AWS Pricing Calculator estimates the cost of planned workloads; it does not show past costs."
      fr: "AWS Pricing Calculator estime le coût de charges de travail prévues ; il n'affiche pas les coûts passés."
references:
  - title: Analyzing your costs and usage with AWS Cost Explorer
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html
