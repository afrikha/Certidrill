id: clfc02-4b-marketplace-private-offer
objective: "4.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to buy a SaaS product from an independent software vendor in AWS Marketplace. The company needs custom pricing and license terms negotiated with the vendor instead of the public listing.

    Which purchasing option meets this requirement?
  fr: |
    Une entreprise souhaite acheter un produit SaaS d'un fournisseur indépendant de logiciels (ISV) dans AWS Marketplace. Elle a besoin d'un prix et de conditions de licence personnalisés, négociés avec le fournisseur, au lieu de l'offre publique.

    Quelle option d'achat répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Buy at the listed price under the vendor's standard EULA.", fr: "Acheter au prix affiché avec le CLUF standard du fournisseur." } }
    - { id: b, text: { en: "Bring your own license (BYOL) for the product.", fr: "Utiliser sa propre licence (BYOL) pour le produit." } }
    - { id: c, text: { en: "Start a free trial of the product.", fr: "Démarrer un essai gratuit du produit." } }
    - { id: d, text: { en: "Accept a private offer from the vendor.", fr: "Accepter une offre privée du fournisseur." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A private offer is a custom offer from the seller, with negotiated pricing and a custom end user license agreement (EULA). The purchase still goes through AWS Marketplace, so the charges appear on the AWS bill."
    fr: "Une offre privée est une offre personnalisée du vendeur, avec un prix négocié et un contrat de licence utilisateur final (CLUF) personnalisé. L'achat passe toujours par AWS Marketplace : les frais apparaissent donc sur la facture AWS."
  options:
    a:
      en: "The listed price and the standard EULA are the public terms, not negotiated ones."
      fr: "Le prix affiché et le CLUF standard sont les conditions publiques, pas des conditions négociées."
    b:
      en: "BYOL uses a license that the company already owns; it does not negotiate new terms with the vendor."
      fr: "Le BYOL utilise une licence que l'entreprise possède déjà ; il ne négocie pas de nouvelles conditions avec le fournisseur."
    c:
      en: "A free trial lets the company test the product for a limited time; it gives no custom pricing."
      fr: "Un essai gratuit permet de tester le produit pendant une durée limitée ; il ne donne pas de prix personnalisé."
references:
  - title: What is AWS Marketplace?
    url: https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html
