id: clfc02-4a-spot-batch
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs nightly batch jobs that process images. The jobs can be stopped and restarted without problems, and they can run at any time during the night.

    Which Amazon EC2 purchasing option is the MOST cost-effective for these jobs?
  fr: |
    Une entreprise exécute chaque nuit des traitements par lots qui traitent des images. Les traitements peuvent être arrêtés et relancés sans problème, et ils peuvent s'exécuter à tout moment de la nuit.

    Quelle option d'achat Amazon EC2 est la PLUS rentable pour ces traitements ?
body:
  options:
    - { id: a, text: { en: "Spot Instances", fr: "Instances Spot" } }
    - { id: b, text: "On-Demand Instances" }
    - { id: c, text: "Dedicated Instances" }
    - { id: d, text: "On-Demand Capacity Reservations" }
answer: { optionId: a }
explanation:
  correct:
    en: "Spot Instances use spare EC2 capacity at steep discounts compared with On-Demand prices. EC2 can interrupt them with a two-minute warning, which is acceptable for batch jobs that can be restarted and whose timing is flexible."
    fr: "Les instances Spot utilisent la capacité EC2 inutilisée avec de fortes remises par rapport aux prix On-Demand. EC2 peut les interrompre avec un préavis de deux minutes, ce qui est acceptable pour des traitements par lots relançables dont l'horaire est flexible."
  options:
    b:
      en: "On-Demand Instances are not interrupted, but they cost more than Spot Instances, and the jobs tolerate interruptions."
      fr: "Les On-Demand Instances ne sont pas interrompues, mais elles coûtent plus cher que les instances Spot, et les traitements tolèrent les interruptions."
    c:
      en: "Dedicated Instances run on single-tenant hardware for compliance or licensing needs, at a higher price; the jobs have no such need."
      fr: "Les Dedicated Instances s'exécutent sur du matériel à locataire unique pour des besoins de conformité ou de licence, à un prix plus élevé ; les traitements n'ont pas ce besoin."
    d:
      en: "A Capacity Reservation guarantees capacity in an Availability Zone at no discount; flexible jobs do not need guaranteed capacity."
      fr: "Une Capacity Reservation garantit de la capacité dans une zone de disponibilité sans remise ; des traitements flexibles n'ont pas besoin de capacité garantie."
references:
  - title: Spot Instances
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html
