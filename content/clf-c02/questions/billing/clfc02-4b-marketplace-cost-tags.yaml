id: clfc02-4b-marketplace-cost-tags
objective: "4.3.12"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Several teams of a company subscribe to AWS Marketplace products. The charges already appear on the company's AWS bill. The finance team now wants to see the AWS Marketplace spend of each team in AWS Cost Explorer.

    What should the company do?
  fr: |
    Plusieurs équipes d'une entreprise s'abonnent à des produits AWS Marketplace. Les frais apparaissent déjà sur la facture AWS de l'entreprise. L'équipe financière souhaite désormais voir les dépenses AWS Marketplace de chaque équipe dans AWS Cost Explorer.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Ask each seller for a separate invoice for every team.", fr: "Demander à chaque vendeur une facture séparée pour chaque équipe." } }
    - { id: b, text: { en: "Create a private marketplace catalog for each team.", fr: "Créer un catalogue de place de marché privée pour chaque équipe." } }
    - { id: c, text: { en: "Tag the resources of each team and activate the tags for cost allocation.", fr: "Baliser les ressources de chaque équipe et activer les balises pour la répartition des coûts." } }
    - { id: d, text: { en: "Turn on the AWS Trusted Advisor cost optimization checks.", fr: "Activer les vérifications d'optimisation des coûts d'AWS Trusted Advisor." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Marketplace cost management relies on the AWS billing tools. Activated cost allocation tags, including vendor-metered tags, track Marketplace usage in Cost Explorer, the Cost and Usage Report and AWS Budgets; Marketplace line items also inherit the tag of the associated EC2 instance."
    fr: "La gestion des coûts d'AWS Marketplace s'appuie sur les outils de facturation AWS. Les balises de répartition des coûts activées, y compris les balises mesurées par le vendeur, suivent l'utilisation Marketplace dans Cost Explorer, l'AWS Cost and Usage Report et AWS Budgets ; les lignes Marketplace héritent aussi de la balise de l'instance EC2 associée."
  options:
    a:
      en: "AWS handles billing for AWS Marketplace and the charges are on the AWS bill; separate seller invoices would not appear in Cost Explorer."
      fr: "AWS gère la facturation d'AWS Marketplace et les frais figurent sur la facture AWS ; des factures séparées des vendeurs n'apparaîtraient pas dans Cost Explorer."
    b:
      en: "A private marketplace controls which products users can buy; it does not break down spending in Cost Explorer."
      fr: "Une place de marché privée contrôle les produits que les utilisateurs peuvent acheter ; elle ne ventile pas les dépenses dans Cost Explorer."
    d:
      en: "Trusted Advisor recommends savings; it does not group Marketplace spending by team."
      fr: "Trusted Advisor recommande des économies ; il ne regroupe pas les dépenses Marketplace par équipe."
references:
  - title: "AWS Marketplace: Cost Management"
    url: https://aws.amazon.com/marketplace/features/cost-management
  - title: Using user-defined tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/custom-tags.html
