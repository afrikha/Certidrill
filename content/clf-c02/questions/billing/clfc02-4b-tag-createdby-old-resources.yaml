id: clfc02-4b-tag-createdby-old-resources
objective: "4.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Last week, a company activated the AWS-generated aws:createdBy cost allocation tag from its management account. In AWS Cost Explorer, Amazon EC2 instances launched last year in the us-east-1 Region show no value for this tag.

    What is the reason?
  fr: |
    La semaine dernière, une entreprise a activé la balise de répartition des coûts générée par AWS aws:createdBy depuis son compte de gestion. Dans AWS Cost Explorer, les instances Amazon EC2 lancées l'année dernière dans la Région us-east-1 n'ont aucune valeur pour cette balise.

    Quelle en est la raison ?
body:
  options:
    - { id: a, text: { en: "Each member account must also activate the tag in its own Billing console.", fr: "Chaque compte membre doit aussi activer la balise dans sa propre console Billing." } }
    - { id: b, text: { en: "The tag is shown only in the Tag Editor, not in billing tools.", fr: "La balise n'apparaît que dans Tag Editor, pas dans les outils de facturation." } }
    - { id: c, text: { en: "AWS applies the tag only to resources created after its activation.", fr: "AWS n'applique la balise qu'aux ressources créées après son activation." } }
    - { id: d, text: { en: "The tag is supported only for AWS CloudFormation stacks.", fr: "La balise n'est prise en charge que pour les piles AWS CloudFormation." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The aws:createdBy tag is not retroactive: AWS adds it only to resources created after the tag is activated. Instances launched last year therefore have no createdBy value, while new instances in a supported Region such as us-east-1 receive it."
    fr: "La balise aws:createdBy n'est pas rétroactive : AWS ne l'ajoute qu'aux ressources créées après son activation. Les instances lancées l'année dernière n'ont donc pas de valeur createdBy, alors que les nouvelles instances d'une Région prise en charge comme us-east-1 la reçoivent."
  options:
    a:
      en: "When the management account activates an AWS-generated tag, it is activated for all member accounts; member accounts cannot activate it."
      fr: "Quand le compte de gestion active une balise générée par AWS, elle est activée pour tous les comptes membres ; les comptes membres ne peuvent pas l'activer."
    b:
      en: "It is the opposite: the createdBy tag appears only in the Billing and Cost Management console and reports, not in the Tag Editor."
      fr: "C'est l'inverse : la balise createdBy n'apparaît que dans la console et les rapports Billing and Cost Management, pas dans Tag Editor."
    d:
      en: "The tag supports many resource types, including EC2 instances created with RunInstances."
      fr: "La balise prend en charge de nombreux types de ressources, y compris les instances EC2 créées avec RunInstances."
references:
  - title: Using AWS-generated tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/aws-tags.html
