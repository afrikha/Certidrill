id: clfc02-4a-on-demand-basics
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to pay for Amazon EC2 instances by the second while they run, with no upfront payment and no long-term commitment.

    Which purchasing option meets these requirements?
  fr: |
    Une entreprise veut payer ses instances Amazon EC2 à la seconde pendant leur exécution, sans paiement initial ni engagement à long terme.

    Quelle option d'achat répond à ces exigences ?
body:
  options:
    - { id: a, text: "Reserved Instances" }
    - { id: b, text: "Savings Plans" }
    - { id: c, text: "On-Demand Instances" }
    - { id: d, text: "Dedicated Hosts" }
answer: { optionId: c }
explanation:
  correct:
    en: "With On-Demand Instances, the company pays by the second for the instances it launches, with no commitment. It can start and stop instances at any time and pays only while they run."
    fr: "Avec les On-Demand Instances, l'entreprise paie à la seconde les instances qu'elle lance, sans engagement. Elle peut démarrer et arrêter des instances à tout moment et ne paie que pendant leur exécution."
  options:
    a:
      en: "Reserved Instances require a commitment to an instance configuration for a 1-year or 3-year term."
      fr: "Les Reserved Instances exigent un engagement sur une configuration d'instance pour une durée de 1 ou 3 ans."
    b:
      en: "Savings Plans require a commitment to an amount of usage, in USD per hour, for a 1-year or 3-year term."
      fr: "Les Savings Plans exigent un engagement sur un montant d'utilisation, en USD par heure, pour une durée de 1 ou 3 ans."
    d:
      en: "With Dedicated Hosts, the company pays for a whole physical server dedicated to its instances, not only for the instances it runs."
      fr: "Avec les Dedicated Hosts, l'entreprise paie un serveur physique entier qui lui est dédié, et pas seulement les instances qu'elle exécute."
references:
  - title: Amazon EC2 billing and purchasing options
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html
