id: clfc02-4a-compute-savings-plans
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs steady workloads on Amazon EC2, AWS Fargate and AWS Lambda. During the next 3 years, it expects to change instance families and to move some workloads to another AWS Region. It can commit to a consistent hourly spend.

    Which purchasing option will reduce costs for all these workloads?
  fr: |
    Une entreprise exécute des charges de travail stables sur Amazon EC2, AWS Fargate et AWS Lambda. Au cours des 3 prochaines années, elle prévoit de changer de familles d'instances et de déplacer certaines charges de travail vers une autre Région AWS. Elle peut s'engager sur une dépense horaire constante.

    Quelle option d'achat réduira les coûts de toutes ces charges de travail ?
body:
  options:
    - { id: a, text: "EC2 Instance Savings Plans" }
    - { id: b, text: { en: "Convertible Reserved Instances", fr: "Instances réservées convertibles" } }
    - { id: c, text: "Compute Savings Plans" }
    - { id: d, text: { en: "Standard Reserved Instances", fr: "Instances réservées standard" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Compute Savings Plans apply automatically to EC2 usage regardless of instance family, size, operating system, tenancy or Region, and they also cover Fargate and Lambda usage. The company commits to a consistent amount of spend per hour for 1 or 3 years."
    fr: "Les Compute Savings Plans s'appliquent automatiquement à l'utilisation EC2 quels que soient la famille et la taille d'instance, le système d'exploitation, la location ou la Région, et ils couvrent aussi l'utilisation de Fargate et de Lambda. L'entreprise s'engage sur un montant de dépense horaire constant pendant 1 ou 3 ans."
  options:
    a:
      en: "EC2 Instance Savings Plans give a larger discount but are tied to one instance family in one Region, and they do not cover Fargate or Lambda."
      fr: "Les EC2 Instance Savings Plans offrent une remise plus élevée mais sont liés à une famille d'instances dans une Région, et ne couvrent ni Fargate ni Lambda."
    b:
      en: "Convertible Reserved Instances can be exchanged for other EC2 attributes, but they apply only to EC2, not to Fargate or Lambda."
      fr: "Les instances réservées convertibles peuvent être échangées contre d'autres attributs EC2, mais elles ne s'appliquent qu'à EC2, pas à Fargate ni à Lambda."
    d:
      en: "Standard Reserved Instances cover only a specific EC2 configuration in a Region and cannot be exchanged for another instance family."
      fr: "Les instances réservées standard ne couvrent qu'une configuration EC2 précise dans une Région et ne peuvent pas être échangées contre une autre famille d'instances."
references:
  - title: Savings Plans types
    url: https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html
