id: clfc02-4a-tags-department-costs
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Several departments of a company share the same AWS account. The finance team must see the monthly AWS costs of each department.

    What should the company use?
  fr: |
    Plusieurs départements d'une entreprise partagent le même compte AWS. L'équipe financière doit voir les coûts AWS mensuels de chaque département.

    Que doit utiliser l'entreprise ?
body:
  options:
    - { id: a, text: { en: "AWS Pricing Calculator", fr: "AWS Pricing Calculator" } }
    - { id: b, text: { en: "Consolidated billing", fr: "La facturation consolidée" } }
    - { id: c, text: { en: "Cost allocation tags", fr: "Les balises de répartition des coûts" } }
    - { id: d, text: { en: "IAM groups", fr: "Les groupes IAM" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Cost allocation tags are key-value labels on resources, such as Department, that AWS uses to organize costs. After the tag is activated, Cost Explorer and the cost allocation report can group and filter costs by department inside the shared account."
    fr: "Les balises de répartition des coûts sont des étiquettes clé-valeur posées sur les ressources, par exemple Department, qu'AWS utilise pour organiser les coûts. Une fois la balise activée, Cost Explorer et le rapport de répartition des coûts peuvent regrouper et filtrer les coûts par département au sein du compte partagé."
  options:
    a:
      en: "AWS Pricing Calculator estimates the cost of planned workloads; it does not report actual costs by department."
      fr: "AWS Pricing Calculator estime le coût de charges de travail prévues ; il ne présente pas les coûts réels par département."
    b:
      en: "Consolidated billing combines the bills of several accounts; it cannot split the costs of resources inside one shared account."
      fr: "La facturation consolidée regroupe les factures de plusieurs comptes ; elle ne peut pas répartir les coûts des ressources au sein d'un même compte partagé."
    d:
      en: "IAM groups manage the permissions of users; they do not organize resource costs."
      fr: "Les groupes IAM gèrent les autorisations des utilisateurs ; ils n'organisent pas les coûts des ressources."
references:
  - title: Organizing and tracking costs using AWS cost allocation tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html
