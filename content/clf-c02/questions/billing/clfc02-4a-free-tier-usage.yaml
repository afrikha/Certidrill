id: clfc02-4a-free-tier-usage
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer uses AWS Free Tier offers and wants to see how much of the monthly allowances has been used, with alerts when the usage approaches the limits.

    Where should the developer go?
  fr: |
    Un développeur utilise des offres de l'offre gratuite AWS (AWS Free Tier) et veut voir quelle part des allocations mensuelles a été utilisée, avec des alertes lorsque l'utilisation approche des limites.

    Où le développeur doit-il aller ?
body:
  options:
    - { id: a, text: { en: "The account events of the AWS Health Dashboard", fr: "Les événements de compte d'AWS Health Dashboard" } }
    - { id: b, text: { en: "The cost optimization checks of AWS Trusted Advisor", fr: "Les contrôles d'optimisation des coûts d'AWS Trusted Advisor" } }
    - { id: c, text: { en: "The Free Tier page of the Billing and Cost Management console", fr: "La page Free Tier de la console Billing and Cost Management" } }
    - { id: d, text: { en: "The event history of AWS CloudTrail for the account", fr: "L'historique des événements AWS CloudTrail du compte" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Free Tier page of the Billing and Cost Management console shows the usage of the Free Tier offers, and the developer can set alerts for when usage approaches the limits. Usage beyond the monthly allowances is covered by credits or charged at standard rates, depending on the plan."
    fr: "La page Free Tier de la console Billing and Cost Management présente l'utilisation des offres de l'offre gratuite, et le développeur peut définir des alertes lorsque l'utilisation approche des limites. L'utilisation au-delà des allocations mensuelles est couverte par les crédits ou facturée au tarif standard, selon le plan."
  options:
    a:
      en: "The AWS Health Dashboard reports events that affect AWS services and resources, not Free Tier usage."
      fr: "AWS Health Dashboard signale les événements qui affectent les services et ressources AWS, pas l'utilisation de l'offre gratuite."
    b:
      en: "Trusted Advisor runs best-practice checks; it does not track Free Tier allowances."
      fr: "Trusted Advisor exécute des contrôles de bonnes pratiques ; il ne suit pas les allocations de l'offre gratuite."
    d:
      en: "CloudTrail records API activity in the account, not usage against Free Tier limits."
      fr: "CloudTrail enregistre l'activité des API du compte, pas l'utilisation par rapport aux limites de l'offre gratuite."
references:
  - title: Getting help with your bills and payments
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/billing-get-answers.html
