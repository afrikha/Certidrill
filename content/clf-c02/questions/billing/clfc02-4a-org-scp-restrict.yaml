id: clfc02-4a-org-scp-restrict
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses AWS Organizations. It wants to centrally prevent every user and role in the accounts of one organizational unit (OU), including the root users, from using AWS services that are not approved.

    What should the company use?
  fr: |
    Une entreprise utilise AWS Organizations. Elle veut empêcher de manière centralisée tous les utilisateurs et rôles des comptes d'une unité d'organisation (OU), y compris les utilisateurs racine, d'utiliser des services AWS non approuvés.

    Que doit utiliser l'entreprise ?
body:
  options:
    - { id: a, text: { en: "A service control policy (SCP)", fr: "Une politique de contrôle des services (SCP)" } }
    - { id: b, text: { en: "An IAM policy in each account", fr: "Une politique IAM dans chaque compte" } }
    - { id: c, text: { en: "A cost allocation tag", fr: "Une balise de répartition des coûts" } }
    - { id: d, text: { en: "An AWS Budgets action", fr: "Une action AWS Budgets" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Service control policies set the maximum permissions available to the users and roles of the member accounts they are attached to, including the root user. An SCP attached to the OU applies to every account in it, and it can limit the services and Regions that those accounts can use."
    fr: "Les politiques de contrôle des services définissent les autorisations maximales disponibles pour les utilisateurs et les rôles des comptes membres auxquels elles sont attachées, y compris l'utilisateur racine. Une SCP attachée à l'OU s'applique à chacun de ses comptes et peut limiter les services et les Régions que ces comptes peuvent utiliser."
  options:
    b:
      en: "IAM policies must be managed account by account, and they cannot restrict the root user of an account."
      fr: "Les politiques IAM doivent être gérées compte par compte, et elles ne peuvent pas restreindre l'utilisateur racine d'un compte."
    c:
      en: "Cost allocation tags organize costs in billing reports; they do not control access to services."
      fr: "Les balises de répartition des coûts organisent les coûts dans les rapports de facturation ; elles ne contrôlent pas l'accès aux services."
    d:
      en: "A budget action reacts when a cost threshold is reached; it is not a preventive control on which services can be used."
      fr: "Une action budgétaire réagit lorsqu'un seuil de coût est atteint ; ce n'est pas un contrôle préventif des services utilisables."
references:
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
