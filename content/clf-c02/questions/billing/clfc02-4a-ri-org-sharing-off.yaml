id: clfc02-4a-ri-org-sharing-off
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses consolidated billing in AWS Organizations. Its finance team wants the Reserved Instances bought by the Production account to lower the bill of the Production account only.

    What should the company do?
  fr: |
    Une entreprise utilise la facturation consolidée d'AWS Organizations. Son équipe financière veut que les instances réservées achetées par le compte Production ne réduisent que la facture du compte Production.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Attach a service control policy (SCP) to the Production account that denies Reserved Instance sharing.", fr: "Attacher au compte Production une politique de contrôle des services (SCP) qui refuse le partage des instances réservées." } }
    - { id: b, text: { en: "Change the Reserved Instances of the Production account from regional scope to zonal scope.", fr: "Faire passer les instances réservées du compte Production de l'étendue régionale à l'étendue zonale." } }
    - { id: c, text: { en: "From the management account, deactivate discount sharing for the Production account.", fr: "Depuis le compte de gestion, désactiver le partage des remises pour le compte Production." } }
    - { id: d, text: { en: "From the Production account, apply a cost allocation tag to the Reserved Instances.", fr: "Depuis le compte Production, appliquer une balise de répartition des coûts aux instances réservées." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The management account controls Reserved Instance and Savings Plans discount sharing for every account of the organization, in the billing preferences. When sharing is deactivated for the Production account, its reservations no longer benefit other accounts, and it no longer receives discounts from other accounts, because both accounts must have sharing activated."
    fr: "Le compte de gestion contrôle le partage des remises des instances réservées et des Savings Plans pour chaque compte de l'organisation, dans les préférences de facturation. Une fois le partage désactivé pour le compte Production, ses réservations ne profitent plus aux autres comptes et il ne reçoit plus de remises d'autres comptes, car les deux comptes doivent avoir le partage activé."
  options:
    a:
      en: "SCPs limit the permissions of principals in member accounts; they do not control how billing discounts are shared."
      fr: "Les SCP limitent les autorisations des principaux dans les comptes membres ; elles ne contrôlent pas le partage des remises de facturation."
    b:
      en: "Zonal scope reserves capacity in one Availability Zone, but sharing still applies to matching usage in other accounts."
      fr: "L'étendue zonale réserve de la capacité dans une zone de disponibilité, mais le partage s'applique toujours à l'utilisation correspondante des autres comptes."
    d:
      en: "Cost allocation tags organize costs in reports; they do not change how discounts are applied, and only the management account can activate them."
      fr: "Les balises de répartition des coûts organisent les coûts dans les rapports ; elles ne changent pas l'application des remises, et seul le compte de gestion peut les activer."
references:
  - title: Reserved Instances and Savings Plans discount sharing
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ri-turn-off.html
