id: clfc02-4b-service-health-public
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consultant who does not have an AWS account wants to check whether an AWS service has an open issue in a specific Region and to review the service interruptions of the last 12 months.

    Which official AWS resource meets these requirements?
  fr: |
    Un consultant qui n'a pas de compte AWS souhaite vérifier si un service AWS rencontre un problème en cours dans une Région donnée et consulter les interruptions de service des 12 derniers mois.

    Quelle ressource officielle d'AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "The Your account health page of the AWS Health Dashboard", fr: "La page Your account health d'AWS Health Dashboard" } }
    - { id: b, text: { en: "The AWS Trusted Advisor dashboard", fr: "Le tableau de bord d'AWS Trusted Advisor" } }
    - { id: c, text: { en: "The Service health page of the AWS Health Dashboard", fr: "La page Service health d'AWS Health Dashboard" } }
    - { id: d, text: { en: "The Amazon CloudWatch console", fr: "La console Amazon CloudWatch" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Service health page of the AWS Health Dashboard shows public events for AWS services across Regions. No sign-in or AWS account is needed, and its service history covers the interruptions of the last 12 months, with filters by service, Region and date."
    fr: "La page Service health d'AWS Health Dashboard affiche les événements publics des services AWS dans toutes les Régions. Aucune connexion ni compte AWS n'est nécessaire, et son historique couvre les interruptions des 12 derniers mois, avec des filtres par service, Région et date."
  options:
    a:
      en: "Your account health shows the events that affect a specific account, so it requires signing in to that account."
      fr: "Your account health affiche les événements qui affectent un compte précis : il faut donc se connecter à ce compte."
    b:
      en: "Trusted Advisor checks the resources of a signed-in account against best practices; it does not publish AWS service events."
      fr: "Trusted Advisor compare les ressources d'un compte connecté aux bonnes pratiques ; il ne publie pas les événements des services AWS."
    d:
      en: "CloudWatch shows the metrics and logs of your own resources and requires an AWS account."
      fr: "CloudWatch affiche les métriques et journaux de vos propres ressources et nécessite un compte AWS."
references:
  - title: AWS Health Dashboard
    url: https://docs.aws.amazon.com/health/latest/ug/aws-health-dashboard-status.html
