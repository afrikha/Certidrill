id: clfc02-4b-partner-training-benefit
objective: "4.3.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An IT consulting company plans to become an AWS Partner. Its main goal is to build the AWS skills of its employees.

    Which AWS Partner benefit addresses this goal?
  fr: |
    Une société de conseil informatique prévoit de devenir partenaire AWS. Son objectif principal est de développer les compétences AWS de ses employés.

    Quel avantage des partenaires AWS répond à cet objectif ?
body:
  options:
    - { id: a, text: { en: "Listing its services in AWS Marketplace", fr: "La publication de ses services dans AWS Marketplace" } }
    - { id: b, text: { en: "Co-selling programs with AWS sales teams", fr: "Les programmes de vente conjointe avec les équipes commerciales d'AWS" } }
    - { id: c, text: { en: "Partner-exclusive training and certification resources", fr: "Les ressources de formation et de certification réservées aux partenaires" } }
    - { id: d, text: { en: "Funding and incentives for partner growth", fr: "Les financements et incitations pour la croissance des partenaires" } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Partners get partner-exclusive digital courses and learning plans on AWS Skill Builder, instructor-led classroom training, and certification readiness resources. These build the skills of partner employees and prepare them for AWS Certification exams."
    fr: "Les partenaires AWS ont accès à des cours numériques et des parcours d'apprentissage réservés aux partenaires sur AWS Skill Builder, à des formations en classe animées par un formateur et à des ressources de préparation aux certifications. Ils développent ainsi les compétences de leurs employés et les préparent aux examens AWS Certification."
  options:
    a:
      en: "Selling through AWS Marketplace helps the company reach customers; it does not train its employees."
      fr: "Vendre via AWS Marketplace aide l'entreprise à atteindre des clients ; cela ne forme pas ses employés."
    b:
      en: "Co-selling helps partners win business with AWS; it does not build employee skills."
      fr: "La vente conjointe aide les partenaires à remporter des affaires avec AWS ; elle ne développe pas les compétences des employés."
    d:
      en: "Funding and incentives support business growth, not the training of employees."
      fr: "Les financements et incitations soutiennent la croissance de l'activité, pas la formation des employés."
references:
  - title: Training and Certification for AWS Partners
    url: https://aws.amazon.com/partners/training/
