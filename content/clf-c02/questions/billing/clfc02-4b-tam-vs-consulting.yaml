id: clfc02-4b-tam-vs-consulting
objective: "4.3.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has AWS Enterprise Support. It wants a designated AWS contact who knows its environment, provides ongoing technical guidance as part of the Support plan, and leads strategic business reviews.

    Which AWS option meets these requirements?
  fr: |
    Une entreprise dispose d'AWS Enterprise Support. Elle souhaite un interlocuteur AWS désigné qui connaît son environnement, fournit des conseils techniques continus dans le cadre du plan de support et anime des revues stratégiques.

    Quelle option AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "An AWS Professional Services consultant", fr: "Un consultant AWS Professional Services" } }
    - { id: b, text: { en: "A system integrator from the AWS Partner Network", fr: "Un intégrateur système de l'AWS Partner Network" } }
    - { id: c, text: { en: "A technical account manager (TAM)", fr: "Un gestionnaire de compte technique (TAM)" } }
    - { id: d, text: { en: "An expert who answers on AWS re:Post", fr: "Un expert qui répond sur AWS re:Post" } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Enterprise Support includes a designated technical account manager (TAM), who is the customer's ongoing technical contact within AWS Support, along with strategic business reviews and TAM-led support for critical events."
    fr: "AWS Enterprise Support inclut un gestionnaire de compte technique (TAM) désigné, interlocuteur technique continu du client au sein d'AWS Support, ainsi que des revues stratégiques et un support mené par le TAM pour les événements critiques."
  options:
    a:
      en: "AWS Professional Services delivers paid consulting engagements, such as a migration project; it is not part of the Support plan."
      fr: "AWS Professional Services fournit des missions de conseil payantes, comme un projet de migration ; il ne fait pas partie du plan de support."
    b:
      en: "A system integrator is a partner company hired for projects or managed services; it is not the designated AWS contact of the Support plan."
      fr: "Un intégrateur système est une entreprise partenaire engagée pour des projets ou des services managés ; ce n'est pas l'interlocuteur AWS désigné du plan de support."
    d:
      en: "re:Post experts answer public community questions; they are not a designated contact for one company."
      fr: "Les experts de re:Post répondent aux questions publiques de la communauté ; ce ne sont pas des interlocuteurs désignés pour une entreprise."
references:
  - title: AWS Support plans
    url: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
  - title: AWS Professional Services
    url: https://aws.amazon.com/professional-services/
