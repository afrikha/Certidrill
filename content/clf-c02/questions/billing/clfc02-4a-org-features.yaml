id: clfc02-4a-org-features
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company with many AWS accounts is evaluating AWS Organizations.

    Which two capabilities does AWS Organizations provide? (Choose two.)
  fr: |
    Une entreprise qui possède de nombreux comptes AWS évalue AWS Organizations.

    Quelles sont les deux fonctions offertes par AWS Organizations ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Merge the IAM users of all accounts into the management account", fr: "Fusionner les utilisateurs IAM de tous les comptes dans le compte de gestion" } }
    - { id: b, text: { en: "Group accounts into OUs and apply policies to each OU", fr: "Regrouper les comptes en OU et appliquer des politiques à chaque OU" } }
    - { id: c, text: { en: "Add the Enterprise Support plan to every member account", fr: "Ajouter le plan Enterprise Support à chaque compte membre" } }
    - { id: d, text: { en: "Pool the service quotas of all member accounts", fr: "Regrouper les quotas de service de tous les comptes membres" } }
    - { id: e, text: { en: "Pay for all accounts with one consolidated bill", fr: "Payer tous les comptes avec une seule facture consolidée" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "AWS Organizations lets a company group accounts into organizational units (OUs) and apply governance policies, such as SCPs, to them. It also provides consolidated billing: the management account receives a single bill and pays for all the member accounts."
    fr: "AWS Organizations permet de regrouper les comptes en unités d'organisation (OU) et de leur appliquer des politiques de gouvernance, comme les SCP. Il fournit aussi la facturation consolidée : le compte de gestion reçoit une seule facture et paie pour tous les comptes membres."
  options:
    a:
      en: "Each account keeps its own IAM users and roles; Organizations does not merge identities across accounts."
      fr: "Chaque compte conserve ses propres utilisateurs et rôles IAM ; Organizations ne fusionne pas les identités des comptes."
    c:
      en: "Support plans are not included with AWS Organizations; they are chosen and paid for separately."
      fr: "Les plans de support ne sont pas inclus dans AWS Organizations ; ils sont choisis et payés séparément."
    d:
      en: "Service quotas remain per account and per Region; Organizations does not pool them."
      fr: "Les quotas de service restent définis par compte et par Région ; Organizations ne les regroupe pas."
references:
  - title: What is AWS Organizations?
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_introduction.html
