id: clfc02-4b-whitepapers-guides
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An architect wants to read AWS whitepapers, such as the AWS Well-Architected lenses, and the Overview of Amazon Web Services document.

    Where should the architect look?
  fr: |
    Un architecte souhaite lire des livres blancs AWS, comme les lentilles AWS Well-Architected, ainsi que le document Overview of Amazon Web Services.

    Où l'architecte doit-il chercher ?
body:
  options:
    - { id: a, text: "AWS Whitepapers & Guides" }
    - { id: b, text: "AWS Artifact" }
    - { id: c, text: "AWS Marketplace" }
    - { id: d, text: "AWS Knowledge Center" }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS Whitepapers & Guides page on the AWS website gathers technical content from AWS and its community: whitepapers, decision guides, technical guides, reference material and reference architecture diagrams. It includes the AWS Well-Architected lenses and the AWS Overview document."
    fr: "La page AWS Whitepapers & Guides du site AWS regroupe le contenu technique d'AWS et de sa communauté : livres blancs, guides de décision, guides techniques, documents de référence et schémas d'architecture de référence. Elle inclut les lentilles AWS Well-Architected et le document AWS Overview."
  options:
    b:
      en: "AWS Artifact provides AWS compliance reports and agreements, not technical whitepapers."
      fr: "AWS Artifact fournit les rapports de conformité et les accords d'AWS, pas des livres blancs techniques."
    c:
      en: "AWS Marketplace is a catalog of third-party software, data and services to buy, not a library of AWS whitepapers."
      fr: "AWS Marketplace est un catalogue de logiciels, de données et de services tiers à acheter, pas une bibliothèque de livres blancs AWS."
    d:
      en: "The Knowledge Center holds AWS articles and videos that answer common customer questions, not the whitepapers."
      fr: "Le Knowledge Center contient des articles et vidéos AWS qui répondent aux questions fréquentes des clients, pas les livres blancs."
references:
  - title: AWS Whitepapers & Guides
    url: https://aws.amazon.com/whitepapers/
