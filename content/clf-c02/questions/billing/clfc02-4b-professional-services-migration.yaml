id: clfc02-4b-professional-services-migration
objective: "4.3.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants a team of AWS experts to help it design, build and migrate its workloads to AWS as a consulting engagement.

    Which AWS option meets this requirement?
  fr: |
    Une entreprise souhaite qu'une équipe d'experts AWS l'aide, dans le cadre d'une mission de conseil, à concevoir, créer et migrer ses charges de travail vers AWS.

    Quelle option AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "AWS Business Support+" }
    - { id: b, text: "AWS re:Post" }
    - { id: c, text: "AWS Trusted Advisor" }
    - { id: d, text: "AWS Professional Services" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Professional Services is the consulting organization of AWS. Its experts help customers design, build, migrate and manage their AWS workloads, for example with large-scale migration and modernization engagements, often together with AWS Partners."
    fr: "AWS Professional Services est l'organisation de conseil d'AWS. Ses experts aident les clients à concevoir, créer, migrer et gérer leurs charges de travail AWS, par exemple lors de missions de migration et de modernisation à grande échelle, souvent avec des partenaires AWS."
  options:
    a:
      en: "Business Support+ answers technical support cases; it does not deliver consulting projects."
      fr: "Business Support+ répond aux cas de support technique ; il ne réalise pas de projets de conseil."
    b:
      en: "re:Post is a community question-and-answer service, not a consulting engagement."
      fr: "re:Post est un service communautaire de questions-réponses, pas une mission de conseil."
    c:
      en: "Trusted Advisor runs automated best-practice checks; it does not provide a team of experts."
      fr: "Trusted Advisor exécute des vérifications automatiques de bonnes pratiques ; il ne fournit pas d'équipe d'experts."
references:
  - title: AWS Professional Services
    url: https://aws.amazon.com/professional-services/
