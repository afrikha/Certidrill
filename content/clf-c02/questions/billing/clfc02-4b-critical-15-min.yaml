id: clfc02-4b-critical-15-min
objective: "4.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has AWS Business Support+. For business-critical system-down cases, the company now needs a first response from AWS in less than 15 minutes.

    Which change is the MOST cost-effective?
  fr: |
    Une entreprise dispose d'AWS Business Support+. Pour les cas de système critique pour l'entreprise en panne, elle a désormais besoin d'une première réponse d'AWS en moins de 15 minutes.

    Quel changement est le PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Upgrade to AWS Unified Operations.", fr: "Passer à AWS Unified Operations." } }
    - { id: b, text: { en: "Upgrade to AWS Enterprise Support.", fr: "Passer à AWS Enterprise Support." } }
    - { id: c, text: { en: "Open these cases by phone instead of the web.", fr: "Ouvrir ces cas par téléphone plutôt que sur le web." } }
    - { id: d, text: { en: "Open these cases with the Production system down severity.", fr: "Ouvrir ces cas avec la gravité Production system down." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Business Support+ answers business-critical system-down cases in less than 30 minutes. AWS Enterprise Support lowers this to less than 15 minutes, so it is the least expensive plan that meets the requirement."
    fr: "Business Support+ répond aux cas de système critique pour l'entreprise en panne en moins de 30 minutes. AWS Enterprise Support ramène ce délai à moins de 15 minutes : c'est donc le plan le moins cher qui répond à l'exigence."
  options:
    a:
      en: "Unified Operations answers in 5 minutes, which meets the requirement, but it costs more than Enterprise Support."
      fr: "Unified Operations répond en 5 minutes, ce qui répond à l'exigence, mais il coûte plus cher qu'Enterprise Support."
    c:
      en: "Response times depend on the Support plan and the case severity, not on the contact channel."
      fr: "Les délais de réponse dépendent du plan de support et de la gravité du cas, pas du canal de contact."
    d:
      en: "Production system down has a 1-hour response time in every paid plan, which is slower than required."
      fr: "La gravité Production system down a un délai de réponse d'une heure dans tous les plans payants, ce qui est plus lent que l'exigence."
references:
  - title: Case management
    url: https://docs.aws.amazon.com/awssupport/latest/user/case-management.html
  - title: AWS Support plans
    url: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
