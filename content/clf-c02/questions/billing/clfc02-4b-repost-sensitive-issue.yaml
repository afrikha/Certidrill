id: clfc02-4b-repost-sensitive-issue
objective: "4.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has AWS Business Support+. An engineer needs help with an error in a production application. The description of the problem includes account IDs and internal customer data.

    What should the engineer do?
  fr: |
    Une entreprise dispose d'AWS Business Support+. Un ingénieur a besoin d'aide pour une erreur dans une application de production. La description du problème contient des ID de compte et des données internes de clients.

    Que doit faire l'ingénieur ?
body:
  options:
    - { id: a, text: { en: "Post the question with all details on AWS re:Post.", fr: "Publier la question avec tous les détails sur AWS re:Post." } }
    - { id: b, text: { en: "Open a technical case in the AWS Support Center.", fr: "Ouvrir un cas technique dans le centre de support AWS (AWS Support Center)." } }
    - { id: c, text: { en: "Report the error to the AWS Trust & Safety team.", fr: "Signaler l'erreur à l'équipe AWS Trust & Safety." } }
    - { id: d, text: { en: "Ask for an AWS Prescriptive Guidance pattern.", fr: "Demander un modèle AWS Prescriptive Guidance." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS re:Post is a public, community-driven self-service: all questions and answers are visible to everyone. For production problems or sensitive information, AWS recommends a support case, which Business Support+ allows."
    fr: "AWS re:Post est un service communautaire en libre-service et public : toutes les questions et réponses sont visibles par tous. Pour les problèmes de production ou les informations sensibles, AWS recommande un cas de support, ce que Business Support+ permet."
  options:
    a:
      en: "Questions on re:Post are public, so account IDs and customer data must not be posted there."
      fr: "Les questions sur re:Post sont publiques : les ID de compte et les données clients ne doivent pas y être publiés."
    c:
      en: "The Trust & Safety team handles reports of abuse of AWS resources, not application errors."
      fr: "L'équipe Trust & Safety traite les signalements d'abus des ressources AWS, pas les erreurs d'application."
    d:
      en: "Prescriptive Guidance is published guidance for migration and modernization; it does not troubleshoot a specific error."
      fr: "Prescriptive Guidance est un ensemble de recommandations publiées pour la migration et la modernisation ; il ne dépanne pas une erreur précise."
references:
  - title: AWS re:Post FAQs
    url: https://repost.aws/faq
  - title: Case management
    url: https://docs.aws.amazon.com/awssupport/latest/user/case-management.html
