id: clfc02-4b-unified-ops-ime
objective: "4.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank runs mission-critical workloads on AWS. When a business-critical system is down, it requires a response from an AWS Incident Management Engineer within 5 minutes.

    Which AWS Support option meets this requirement?
  fr: |
    Une banque exécute des charges de travail stratégiques sur AWS. Quand un système critique pour l'entreprise est en panne, elle exige une réponse d'un Incident Management Engineer d'AWS en 5 minutes.

    Quelle option d'AWS Support répond à cette exigence ?
body:
  options:
    - { id: a, text: "AWS Business Support+" }
    - { id: b, text: "AWS Enterprise Support" }
    - { id: c, text: "AWS Professional Services" }
    - { id: d, text: "AWS Unified Operations" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Unified Operations is the plan for mission-critical workloads. For business-critical system-down cases, it gives a response in 5 minutes from an Incident Management Engineer, and it adds a designated TAM and Domain Specialist Engineer."
    fr: "AWS Unified Operations est le plan destiné aux charges de travail stratégiques. Pour les cas de système critique pour l'entreprise en panne, il offre une réponse en 5 minutes d'un Incident Management Engineer, et il ajoute un TAM et un Domain Specialist Engineer désignés."
  options:
    a:
      en: "Business Support+ answers business-critical system-down cases in less than 30 minutes."
      fr: "Business Support+ répond aux cas de système critique pour l'entreprise en panne en moins de 30 minutes."
    b:
      en: "Enterprise Support answers business-critical system-down cases in less than 15 minutes, not 5 minutes."
      fr: "Enterprise Support répond aux cas de système critique pour l'entreprise en panne en moins de 15 minutes, pas en 5 minutes."
    c:
      en: "AWS Professional Services delivers consulting engagements; it is not a Support plan with case response times."
      fr: "AWS Professional Services fournit des missions de conseil ; ce n'est pas un plan de support avec des délais de réponse aux cas."
references:
  - title: Case management
    url: https://docs.aws.amazon.com/awssupport/latest/user/case-management.html
