id: clfc02-4b-basic-no-technical-case
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer signs in to the AWS Support Center to open a technical case about an Amazon EC2 networking problem. The Support Center does not let the engineer create the case, although it allows an account and billing case.

    What is the MOST likely reason?
  fr: |
    Un ingénieur se connecte au centre de support AWS (AWS Support Center) pour ouvrir un cas technique sur un problème réseau Amazon EC2. Le centre de support ne lui permet pas de créer ce cas, alors qu'il autorise un cas de compte et de facturation.

    Quelle est la raison la PLUS probable ?
body:
  options:
    - { id: a, text: { en: "Technical cases can be opened only by the root user.", fr: "Seul l'utilisateur root peut ouvrir des cas techniques." } }
    - { id: b, text: { en: "Technical cases must first be posted on AWS re:Post.", fr: "Les cas techniques doivent d'abord être publiés sur AWS re:Post." } }
    - { id: c, text: { en: "Technical cases are opened from the AWS Health Dashboard.", fr: "Les cas techniques s'ouvrent depuis AWS Health Dashboard." } }
    - { id: d, text: { en: "The account has Basic Support, which excludes technical cases.", fr: "Le compte dispose de Basic Support, qui exclut les cas techniques." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With Basic Support, a customer cannot create technical support cases. Account and billing cases and service quota increase requests stay available to every customer. Technical cases require AWS Business Support+ or a higher plan."
    fr: "Avec Basic Support, un client ne peut pas créer de cas de support technique. Les cas de compte et de facturation et les demandes d'augmentation de quota de service restent accessibles à tous les clients. Les cas techniques nécessitent AWS Business Support+ ou un plan supérieur."
  options:
    a:
      en: "With a paid plan, any user who has the required permissions can open cases; the root user is not required."
      fr: "Avec un plan payant, tout utilisateur qui a les autorisations nécessaires peut ouvrir des cas ; l'utilisateur root n'est pas requis."
    b:
      en: "AWS re:Post is a community question-and-answer site; it is not a prerequisite for opening a support case."
      fr: "AWS re:Post est un site communautaire de questions-réponses ; ce n'est pas un prérequis pour ouvrir un cas de support."
    c:
      en: "Support cases are created in the AWS Support Center; the AWS Health Dashboard shows health events."
      fr: "Les cas de support se créent dans le centre de support AWS ; AWS Health Dashboard affiche les événements d'état."
references:
  - title: Case management
    url: https://docs.aws.amazon.com/awssupport/latest/user/case-management.html
