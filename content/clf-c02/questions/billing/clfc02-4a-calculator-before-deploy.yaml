id: clfc02-4a-calculator-before-deploy
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup that does not have an AWS account yet wants to estimate the monthly cost of a planned application that uses Amazon EC2, Amazon RDS and Amazon S3.

    Which AWS tool should the startup use?
  fr: |
    Une startup qui n'a pas encore de compte AWS veut estimer le coût mensuel d'une application prévue qui utilise Amazon EC2, Amazon RDS et Amazon S3.

    Quel outil AWS la startup doit-elle utiliser ?
body:
  options:
    - { id: a, text: "AWS Cost Explorer" }
    - { id: b, text: "AWS Pricing Calculator" }
    - { id: c, text: "AWS Budgets" }
    - { id: d, text: "AWS Cost and Usage Report" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Pricing Calculator estimates the cost of workloads and applications before they are deployed. Its public website version does not require an AWS account."
    fr: "AWS Pricing Calculator estime le coût de charges de travail et d'applications avant leur déploiement. Sa version publique sur le Web ne nécessite pas de compte AWS."
  options:
    a:
      en: "Cost Explorer analyzes the actual costs of an existing account; the startup has no account and no usage yet."
      fr: "Cost Explorer analyse les coûts réels d'un compte existant ; la startup n'a encore ni compte ni utilisation."
    c:
      en: "AWS Budgets alerts on the actual or forecasted spend of an account; it does not estimate a planned architecture."
      fr: "AWS Budgets alerte sur les dépenses réelles ou prévues d'un compte ; il n'estime pas une architecture prévue."
    d:
      en: "The Cost and Usage Report contains detailed data on past usage of an account, so it needs an account with usage."
      fr: "Cost and Usage Report contient des données détaillées sur l'utilisation passée d'un compte : il faut un compte avec de l'utilisation."
references:
  - title: Generating estimates with Pricing Calculator
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/pricing-calculator.html
