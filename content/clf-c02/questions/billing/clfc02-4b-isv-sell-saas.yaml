id: clfc02-4b-isv-sell-saas
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An independent software vendor (ISV) has built a SaaS application that runs on AWS. It wants access to AWS programs, funding and tools to market and sell the application to AWS customers.

    What should the ISV do?
  fr: |
    Un fournisseur indépendant de logiciels (ISV) a créé une application SaaS qui s'exécute sur AWS. Il souhaite accéder aux programmes, financements et outils d'AWS pour commercialiser et vendre l'application aux clients AWS.

    Que doit faire l'ISV ?
body:
  options:
    - { id: a, text: { en: "Join the AWS Partner Network as a Software Partner.", fr: "Rejoindre l'AWS Partner Network comme partenaire logiciel." } }
    - { id: b, text: { en: "Subscribe to the AWS Enterprise Support plan.", fr: "Souscrire au plan AWS Enterprise Support." } }
    - { id: c, text: { en: "Engage AWS Professional Services for the application.", fr: "Faire appel à AWS Professional Services pour l'application." } }
    - { id: d, text: { en: "Publish the application as an AWS Prescriptive Guidance pattern.", fr: "Publier l'application comme modèle AWS Prescriptive Guidance." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The APN gives Software Partners, such as ISVs, access to AWS programs, incentives, funding and tools. Partners can showcase and sell their solutions to AWS customers, including through AWS Marketplace, and use AWS Partner Central to reach the partner benefits."
    fr: "L'APN donne aux partenaires logiciels, comme les ISV, l'accès aux programmes, incitations, financements et outils d'AWS. Les partenaires peuvent présenter et vendre leurs solutions aux clients AWS, y compris via AWS Marketplace, et utiliser AWS Partner Central pour accéder aux avantages partenaires."
  options:
    b:
      en: "Enterprise Support provides technical support and a TAM; it is not a program to market and sell software."
      fr: "Enterprise Support fournit du support technique et un TAM ; ce n'est pas un programme pour commercialiser et vendre un logiciel."
    c:
      en: "Professional Services helps customers design, build and migrate workloads; it does not give partners go-to-market programs."
      fr: "Professional Services aide les clients à concevoir, créer et migrer des charges de travail ; il ne donne pas de programmes de commercialisation aux partenaires."
    d:
      en: "Prescriptive Guidance publishes AWS guides and patterns; it is not a sales channel for third-party software."
      fr: "Prescriptive Guidance publie des guides et modèles AWS ; ce n'est pas un canal de vente de logiciels tiers."
references:
  - title: Become an AWS Partner
    url: https://aws.amazon.com/partners/
