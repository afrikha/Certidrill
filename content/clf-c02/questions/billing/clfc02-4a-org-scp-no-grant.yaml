id: clfc02-4a-org-scp-no-grant
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In AWS Organizations, a service control policy (SCP) that allows only Amazon S3 and Amazon EC2 is attached to an OU. A new IAM user is created in a member account of the OU, with no IAM policy attached.

    What can the IAM user do?
  fr: |
    Dans AWS Organizations, une politique de contrôle des services (SCP) qui n'autorise qu'Amazon S3 et Amazon EC2 est attachée à une OU. Un nouvel utilisateur IAM est créé dans un compte membre de l'OU, sans aucune politique IAM attachée.

    Que peut faire l'utilisateur IAM ?
body:
  options:
    - { id: a, text: { en: "Use Amazon S3 and Amazon EC2 only", fr: "Utiliser uniquement Amazon S3 et Amazon EC2" } }
    - { id: b, text: { en: "Use all AWS services, because SCPs apply only to roles", fr: "Utiliser tous les services AWS, car les SCP ne s'appliquent qu'aux rôles" } }
    - { id: c, text: { en: "Use Amazon S3 and Amazon EC2 in read-only mode", fr: "Utiliser Amazon S3 et Amazon EC2 en lecture seule" } }
    - { id: d, text: { en: "Use no AWS service until IAM permissions are granted", fr: "N'utiliser aucun service AWS tant que des autorisations IAM ne sont pas accordées" } }
answer: { optionId: d }
explanation:
  correct:
    en: "SCPs never grant permissions: they only set the maximum permissions available in the account. The effective permissions are the intersection of what the SCP allows and what identity-based or resource-based policies allow, so a user with no IAM policy can do nothing until it receives IAM permissions within the S3 and EC2 limit."
    fr: "Les SCP n'accordent jamais d'autorisations : elles ne font que fixer les autorisations maximales disponibles dans le compte. Les autorisations effectives sont l'intersection de ce qu'autorise la SCP et de ce qu'autorisent les politiques basées sur l'identité ou sur les ressources : un utilisateur sans politique IAM ne peut rien faire tant qu'il ne reçoit pas d'autorisations IAM, dans la limite de S3 et d'EC2."
  options:
    a:
      en: "The SCP defines what the user could be allowed to do, but the user still needs an IAM policy that grants S3 or EC2 actions."
      fr: "La SCP définit ce que l'utilisateur pourrait être autorisé à faire, mais l'utilisateur a encore besoin d'une politique IAM qui accorde des actions S3 ou EC2."
    b:
      en: "SCPs apply to all users and roles of the attached member accounts, including the root user."
      fr: "Les SCP s'appliquent à tous les utilisateurs et rôles des comptes membres concernés, y compris l'utilisateur racine."
    c:
      en: "SCPs grant no permissions at all, read-only or otherwise; the user has no permissions without an IAM policy."
      fr: "Les SCP n'accordent aucune autorisation, ni en lecture seule ni autrement ; l'utilisateur n'a aucune autorisation sans politique IAM."
references:
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
