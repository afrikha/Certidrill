id: clfc02-4b-aws-blogs
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cloud team wants to follow posts from AWS experts about product news, customer stories and technical guidance.

    Which official AWS resource should the team use?
  fr: |
    Une équipe cloud souhaite suivre les articles des experts AWS sur les nouveautés produits, les témoignages de clients et les conseils techniques.

    Quelle ressource officielle d'AWS l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: "AWS Blogs" }
    - { id: b, text: "AWS Decision Guides" }
    - { id: c, text: "AWS Artifact" }
    - { id: d, text: "AWS Health Dashboard" }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS Blogs on the AWS website publish posts from AWS leaders and experts: product news, cloud transformation stories, strategic insights and technical guidance. Short announcements of new features are also listed on the What's New page."
    fr: "Les AWS Blogs du site AWS publient les articles des dirigeants et experts d'AWS : nouveautés produits, témoignages de transformation cloud, analyses stratégiques et conseils techniques. Les annonces courtes de nouvelles fonctionnalités figurent aussi sur la page What's New."
  options:
    c:
      en: "AWS Artifact provides compliance reports and agreements, not blog posts."
      fr: "AWS Artifact fournit des rapports de conformité et des accords, pas des articles de blog."
    b:
      en: "Decision Guides compare services to help choose one; they are not a news feed."
      fr: "Les Decision Guides comparent des services pour aider à en choisir un ; ce n'est pas un fil d'actualités."
    d:
      en: "The Health Dashboard reports service events and issues, not product news or customer stories."
      fr: "Health Dashboard signale les événements et incidents des services, pas les nouveautés produits ni les témoignages de clients."
references:
  - title: AWS Blogs
    url: https://aws.amazon.com/blogs/
