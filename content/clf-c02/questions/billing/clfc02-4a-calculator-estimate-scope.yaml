id: clfc02-4a-calculator-estimate-scope
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company created an estimate in AWS Pricing Calculator for a new application.

    Which statement about this estimate is correct?
  fr: |
    Une entreprise a créé une estimation dans AWS Pricing Calculator pour une nouvelle application.

    Quelle affirmation sur cette estimation est correcte ?
body:
  options:
    - { id: a, text: { en: "It is a price that AWS guarantees for the first 12 months of the application.", fr: "C'est un prix qu'AWS garantit pour les 12 premiers mois de l'application." } }
    - { id: b, text: { en: "It includes the taxes that will appear on the company's AWS invoice.", fr: "Elle inclut les taxes qui figureront sur la facture AWS de l'entreprise." } }
    - { id: c, text: { en: "It excludes taxes, and the actual bill can differ from it.", fr: "Elle exclut les taxes, et la facture réelle peut en différer." } }
    - { id: d, text: { en: "It can be created only after the application's resources are deployed.", fr: "Elle ne peut être créée qu'après le déploiement des ressources de l'application." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Pricing Calculator estimates reflect AWS service fees only and do not include applicable taxes. They are estimates, not quotes: the actual fees depend on many factors, including the actual usage of AWS services."
    fr: "Les estimations de Pricing Calculator ne reflètent que les frais des services AWS et n'incluent pas les taxes applicables. Ce sont des estimations, pas des devis : les frais réels dépendent de nombreux facteurs, notamment de l'utilisation réelle des services AWS."
  options:
    a:
      en: "An estimate is not a binding price; the bill depends on what the company actually uses."
      fr: "Une estimation n'est pas un prix contractuel ; la facture dépend de ce que l'entreprise utilise réellement."
    b:
      en: "Pricing Calculator estimates exclude taxes."
      fr: "Les estimations de Pricing Calculator excluent les taxes."
    d:
      en: "Pricing Calculator is designed to estimate costs before resources are deployed."
      fr: "Pricing Calculator est conçu pour estimer les coûts avant le déploiement des ressources."
references:
  - title: Generating estimates with Pricing Calculator
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/pricing-calculator.html
