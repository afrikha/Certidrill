id: clfc02-4a-s3-cost-factors
objective: "4.1.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is estimating its future Amazon S3 bill.

    Which two factors affect the amount that the company will pay for Amazon S3? (Choose two.)
  fr: |
    Une entreprise estime sa future facture Amazon S3.

    Quels sont les deux facteurs qui influent sur le montant que l'entreprise paiera pour Amazon S3 ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The amount of data stored and its storage class", fr: "La quantité de données stockées et leur classe de stockage" } }
    - { id: b, text: { en: "The amount of data uploaded from the internet", fr: "La quantité de données chargées depuis Internet" } }
    - { id: c, text: { en: "A minimum monthly charge for each bucket", fr: "Des frais mensuels minimaux pour chaque compartiment" } }
    - { id: d, text: { en: "The number of requests and data retrievals", fr: "Le nombre de requêtes et de récupérations de données" } }
    - { id: e, text: { en: "The amount of data sent from S3 to Amazon CloudFront", fr: "La quantité de données envoyées d'Amazon S3 vers Amazon CloudFront" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Amazon S3 charges for the data stored, at a price that depends on the storage class, and for requests and data retrievals, along with data transfer out and optional management features. The company pays only for what it uses, with no minimum charge."
    fr: "Amazon S3 facture les données stockées, à un prix qui dépend de la classe de stockage, ainsi que les requêtes et les récupérations de données, en plus du transfert de données sortant et des fonctions de gestion facultatives. L'entreprise ne paie que ce qu'elle utilise, sans frais minimaux."
  options:
    b:
      en: "Data transferred in to Amazon S3 from the internet is not charged."
      fr: "Les données transférées vers Amazon S3 depuis Internet ne sont pas facturées."
    c:
      en: "Amazon S3 has no minimum charge: the company pays only for what it uses."
      fr: "Amazon S3 n'a pas de frais minimaux : l'entreprise ne paie que ce qu'elle utilise."
    e:
      en: "Data transferred out of Amazon S3 to Amazon CloudFront is not charged."
      fr: "Les données transférées d'Amazon S3 vers Amazon CloudFront ne sont pas facturées."
references:
  - title: S3 Pricing
    url: https://aws.amazon.com/s3/pricing/
