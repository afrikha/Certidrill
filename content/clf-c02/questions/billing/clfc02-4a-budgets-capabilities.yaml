id: clfc02-4a-budgets-capabilities
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is comparing AWS Budgets and AWS Cost Explorer.

    Which two capabilities does AWS Budgets provide? (Choose two.)
  fr: |
    Une entreprise compare AWS Budgets et AWS Cost Explorer.

    Quelles sont les deux fonctions offertes par AWS Budgets ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Alert when Reserved Instance utilization falls below a target", fr: "Alerter lorsque l'utilisation des instances réservées passe sous un objectif" } }
    - { id: b, text: { en: "Estimate the cost of an architecture before it is deployed", fr: "Estimer le coût d'une architecture avant son déploiement" } }
    - { id: c, text: { en: "Recommend which Reserved Instances to purchase", fr: "Recommander les instances réservées à acheter" } }
    - { id: d, text: { en: "Run an action, such as applying an IAM policy, when a threshold is reached", fr: "Exécuter une action, comme l'application d'une politique IAM, lorsqu'un seuil est atteint" } }
    - { id: e, text: { en: "Recommend instance types from CPU and memory utilization", fr: "Recommander des types d'instances à partir de l'utilisation du processeur et de la mémoire" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Besides cost and usage budgets, AWS Budgets offers Reserved Instance and Savings Plans utilization and coverage budgets that alert when utilization or coverage falls below a target. Budget actions can run automatically when a threshold is reached, for example by applying an IAM policy that denies the creation of new resources."
    fr: "En plus des budgets de coûts et d'utilisation, AWS Budgets propose des budgets d'utilisation et de couverture des instances réservées et des Savings Plans, qui alertent lorsque l'utilisation ou la couverture passe sous un objectif. Les actions budgétaires peuvent s'exécuter automatiquement lorsqu'un seuil est atteint, par exemple en appliquant une politique IAM qui refuse la création de nouvelles ressources."
  options:
    b:
      en: "Estimating the cost of a planned architecture is the role of AWS Pricing Calculator."
      fr: "Estimer le coût d'une architecture prévue est le rôle d'AWS Pricing Calculator."
    c:
      en: "Reserved Instance purchase recommendations are a capability of AWS Cost Explorer."
      fr: "Les recommandations d'achat d'instances réservées sont une fonction d'AWS Cost Explorer."
    e:
      en: "Rightsizing recommendations based on utilization come from AWS Compute Optimizer, not from AWS Budgets."
      fr: "Les recommandations de dimensionnement basées sur l'utilisation viennent d'AWS Compute Optimizer, pas d'AWS Budgets."
references:
  - title: Managing your costs with AWS Budgets
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html
  - title: Analyzing your costs and usage with AWS Cost Explorer
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html
