id: clfc02-4a-tags-createdby
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants its cost reports to show which user or role created each resource. It does not want to ask its teams to add tags manually.

    Which type of cost allocation tag should the company activate?
  fr: |
    Une entreprise veut que ses rapports de coûts indiquent quel utilisateur ou quel rôle a créé chaque ressource. Elle ne veut pas demander à ses équipes d'ajouter des balises manuellement.

    Quel type de balise de répartition des coûts l'entreprise doit-elle activer ?
body:
  options:
    - { id: a, text: { en: "A user-defined tag named Owner", fr: "Une balise définie par l'utilisateur nommée Owner" } }
    - { id: b, text: { en: "The AWS-generated createdBy tag", fr: "La balise générée par AWS createdBy" } }
    - { id: c, text: { en: "A resource group based on a tag query", fr: "Un groupe de ressources basé sur une requête de balises" } }
    - { id: d, text: { en: "A tag policy in AWS Organizations", fr: "Une politique de balises dans AWS Organizations" } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS-generated tags are defined, created and applied by AWS, and they use the aws: prefix. The createdBy tag records who created a resource, and once it is activated as a cost allocation tag, it can be used to group costs without any manual tagging."
    fr: "Les balises générées par AWS sont définies, créées et appliquées par AWS, et elles utilisent le préfixe aws:. La balise createdBy enregistre qui a créé une ressource ; une fois activée comme balise de répartition des coûts, elle permet de regrouper les coûts sans aucun balisage manuel."
  options:
    a:
      en: "A user-defined tag must be created and applied by the customer's teams, which the company wants to avoid."
      fr: "Une balise définie par l'utilisateur doit être créée et appliquée par les équipes du client, ce que l'entreprise veut éviter."
    c:
      en: "A resource group only gathers resources that already carry tags; it does not record who created them and is not a cost allocation tag."
      fr: "Un groupe de ressources ne fait que rassembler des ressources déjà balisées ; il n'enregistre pas leur créateur et n'est pas une balise de répartition des coûts."
    d:
      en: "A tag policy standardizes the tags that teams apply; it does not add tags automatically or record the creator."
      fr: "Une politique de balises normalise les balises que les équipes appliquent ; elle n'ajoute pas de balises automatiquement et n'enregistre pas le créateur."
references:
  - title: Organizing and tracking costs using AWS cost allocation tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html
