id: clfc02-4a-ri-size-flexibility
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs Amazon EC2 instances of several sizes in the same instance family, spread across all Availability Zones of one Region. It wants a Reserved Instance discount that applies automatically whatever the size and the Availability Zone of the running instances.

    Which Reserved Instance meets this requirement?
  fr: |
    Une entreprise exécute des instances Amazon EC2 de plusieurs tailles d'une même famille d'instances, réparties dans toutes les zones de disponibilité d'une Région. Elle veut une remise de Reserved Instance qui s'applique automatiquement, quelles que soient la taille et la zone de disponibilité des instances en cours d'exécution.

    Quelle Reserved Instance répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "A zonal Linux/Unix Reserved Instance with default tenancy", fr: "Une Reserved Instance Linux/Unix zonale avec la location par défaut (default tenancy)" } }
    - { id: b, text: { en: "A regional Windows Reserved Instance with default tenancy", fr: "Une Reserved Instance Windows régionale avec la location par défaut (default tenancy)" } }
    - { id: c, text: { en: "A regional Linux/Unix Reserved Instance with dedicated tenancy", fr: "Une Reserved Instance Linux/Unix régionale avec la location dédiée (dedicated tenancy)" } }
    - { id: d, text: { en: "A regional Linux/Unix Reserved Instance with default tenancy", fr: "Une Reserved Instance Linux/Unix régionale avec la location par défaut (default tenancy)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A regional Reserved Instance applies its discount in any Availability Zone of the Region. Instance size flexibility, which applies the discount to any size within the instance family, is available only for regional Linux/Unix Reserved Instances with default tenancy."
    fr: "Une Reserved Instance régionale applique sa remise dans n'importe quelle zone de disponibilité de la Région. La flexibilité de taille d'instance, qui applique la remise à toute taille de la famille d'instances, n'existe que pour les Reserved Instances Linux/Unix régionales avec la location par défaut."
  options:
    a:
      en: "A zonal Reserved Instance applies only to the specified Availability Zone, instance family and size: it has neither zone nor size flexibility."
      fr: "Une Reserved Instance zonale ne s'applique qu'à la zone de disponibilité, à la famille et à la taille indiquées : elle n'a ni flexibilité de zone ni flexibilité de taille."
    b:
      en: "A regional Windows Reserved Instance has Availability Zone flexibility, but instance size flexibility does not apply to the Windows platform."
      fr: "Une Reserved Instance Windows régionale a la flexibilité de zone de disponibilité, mais la flexibilité de taille ne s'applique pas à la plateforme Windows."
    c:
      en: "Instance size flexibility requires default tenancy; a Reserved Instance with dedicated tenancy applies only to the specified size."
      fr: "La flexibilité de taille exige la location par défaut ; une Reserved Instance avec la location dédiée ne s'applique qu'à la taille indiquée."
references:
  - title: Regional and zonal Reserved Instances (scope)
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html
