id: clfc02-4a-capacity-reservation-event
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company needs guaranteed Amazon EC2 capacity in one specific Availability Zone during a two-week sales event. It does not want any commitment that lasts beyond the event.

    Which purchasing option meets these requirements?
  fr: |
    Une entreprise de distribution a besoin d'une capacité Amazon EC2 garantie dans une zone de disponibilité précise pendant un événement commercial de deux semaines. Elle ne veut aucun engagement qui dure au-delà de l'événement.

    Quelle option d'achat répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A zonal Reserved Instance", fr: "Une Reserved Instance zonale" } }
    - { id: b, text: { en: "An EC2 Instance Savings Plan", fr: "Un EC2 Instance Savings Plan" } }
    - { id: c, text: { en: "Spot Instances in the Availability Zone", fr: "Des Spot Instances dans la zone de disponibilité" } }
    - { id: d, text: { en: "An On-Demand Capacity Reservation", fr: "Une On-Demand Capacity Reservation" } }
answer: { optionId: d }
explanation:
  correct:
    en: "An On-Demand Capacity Reservation reserves EC2 capacity in a specific Availability Zone. A reservation for immediate use has no term commitment and can be canceled at any time, so the company can release it after the event and stop the charges."
    fr: "Une On-Demand Capacity Reservation réserve de la capacité EC2 dans une zone de disponibilité précise. Une réservation à usage immédiat n'a pas d'engagement de durée et peut être annulée à tout moment : l'entreprise peut la libérer après l'événement et arrêter les frais."
  options:
    a:
      en: "A zonal Reserved Instance also reserves capacity in an Availability Zone, but it requires a 1-year or 3-year commitment."
      fr: "Une Reserved Instance zonale réserve aussi de la capacité dans une zone de disponibilité, mais elle exige un engagement de 1 ou 3 ans."
    b:
      en: "Savings Plans are a 1-year or 3-year spend commitment, and they do not reserve any capacity."
      fr: "Les Savings Plans sont un engagement de dépense de 1 ou 3 ans, et ils ne réservent aucune capacité."
    c:
      en: "Spot Instances have no commitment, but EC2 can interrupt them when it needs the capacity back, so capacity is not guaranteed."
      fr: "Les Spot Instances n'ont pas d'engagement, mais EC2 peut les interrompre lorsqu'il a besoin de récupérer la capacité : la capacité n'est pas garantie."
references:
  - title: Reserve compute capacity with EC2 On-Demand Capacity Reservations
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html
