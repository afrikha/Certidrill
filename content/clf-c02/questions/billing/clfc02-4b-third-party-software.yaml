id: clfc02-4b-third-party-software
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has Basic Support. It runs a popular third-party web server on Amazon EC2 instances and wants AWS Support engineers to help with the operating system configuration and the third-party software.

    Which is the MOST cost-effective AWS Support plan that meets this requirement?
  fr: |
    Une entreprise dispose de Basic Support. Elle exécute un serveur web tiers courant sur des instances Amazon EC2 et souhaite que les ingénieurs AWS Support l'aident pour la configuration du système d'exploitation et du logiciel tiers.

    Quel est le plan AWS Support le PLUS rentable qui répond à cette exigence ?
body:
  options:
    - { id: a, text: "AWS Enterprise Support" }
    - { id: b, text: "AWS Unified Operations" }
    - { id: c, text: { en: "Basic Support, with a technical case", fr: "Basic Support, avec un cas technique" } }
    - { id: d, text: "AWS Business Support+" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Business Support+ is the least expensive plan that includes third-party software support: help with EC2 operating systems and configuration and with popular third-party components on AWS. It also gives 24/7 phone, web and chat access to Cloud Support Engineers."
    fr: "AWS Business Support+ est le plan le moins cher qui inclut le support des logiciels tiers : aide pour les systèmes d'exploitation et la configuration d'EC2 et pour les composants tiers courants sur AWS. Il offre aussi un accès 24 h/24, 7 j/7 par téléphone, web et chat aux Cloud Support Engineers."
  options:
    a:
      en: "Enterprise Support includes third-party software support, but it costs more than Business Support+."
      fr: "Enterprise Support inclut le support des logiciels tiers, mais il coûte plus cher que Business Support+."
    b:
      en: "Unified Operations includes third-party software support, but it is the most expensive plan."
      fr: "Unified Operations inclut le support des logiciels tiers, mais c'est le plan le plus cher."
    c:
      en: "Basic Support customers cannot create technical support cases; they can open only account and billing cases and service quota increase requests."
      fr: "Les clients Basic Support ne peuvent pas créer de cas de support technique ; ils ne peuvent ouvrir que des cas de compte et de facturation et des demandes d'augmentation de quota de service."
references:
  - title: AWS Support plans
    url: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
