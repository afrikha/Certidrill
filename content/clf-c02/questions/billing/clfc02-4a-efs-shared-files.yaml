id: clfc02-4a-efs-shared-files
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Many Linux-based Amazon EC2 instances must read and write the same files at the same time. The storage must grow and shrink automatically as files are added and removed.

    Which AWS storage service meets these requirements?
  fr: |
    De nombreuses instances Amazon EC2 sous Linux doivent lire et écrire les mêmes fichiers en même temps. Le stockage doit s'agrandir et se réduire automatiquement à mesure que des fichiers sont ajoutés et supprimés.

    Quel service de stockage AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Elastic Block Store (Amazon EBS)" }
    - { id: b, text: { en: "Amazon EC2 instance store", fr: "Stockage d'instance Amazon EC2 (instance store)" } }
    - { id: c, text: "Amazon S3 Glacier Flexible Retrieval" }
    - { id: d, text: "Amazon Elastic File System (Amazon EFS)" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon EFS provides serverless, fully elastic file storage that many compute instances can access in parallel over NFS. It grows and shrinks automatically as files are added and removed, so there is no capacity to provision."
    fr: "Amazon EFS fournit un stockage de fichiers sans serveur et entièrement élastique, auquel de nombreuses instances de calcul peuvent accéder en parallèle via NFS. Il s'agrandit et se réduit automatiquement à mesure que des fichiers sont ajoutés et supprimés : aucune capacité n'est à provisionner."
  options:
    a:
      en: "An EBS volume is block storage with a provisioned size, normally attached to one instance at a time; it is not a shared file system."
      fr: "Un volume EBS est un stockage en mode bloc de taille provisionnée, normalement attaché à une seule instance à la fois ; ce n'est pas un système de fichiers partagé."
    b:
      en: "Instance store is temporary block storage on the host of one instance; other instances cannot share it."
      fr: "Le stockage d'instance est un stockage en mode bloc temporaire situé sur l'hôte d'une instance ; les autres instances ne peuvent pas le partager."
    c:
      en: "S3 Glacier Flexible Retrieval is archive object storage whose objects must be restored before access; it is not a file system."
      fr: "S3 Glacier Flexible Retrieval est un stockage d'objets d'archivage dont les objets doivent être restaurés avant tout accès ; ce n'est pas un système de fichiers."
references:
  - title: What is Amazon Elastic File System?
    url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
