id: clfc02-4b-basic-support-included
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes AWS Basic Support?
  fr: |
    Quelle affirmation décrit le plan Basic Support d'AWS ?
body:
  options:
    - { id: a, text: { en: "It includes a designated technical account manager (TAM).", fr: "Il inclut un gestionnaire de compte technique (TAM) désigné." } }
    - { id: b, text: { en: "It includes 24/7 phone access to Cloud Support Engineers.", fr: "Il inclut un accès téléphonique 24 h/24, 7 j/7 aux Cloud Support Engineers." } }
    - { id: c, text: { en: "It is included for all customers and covers account and billing questions.", fr: "Il est inclus pour tous les clients et couvre les questions de compte et de facturation." } }
    - { id: d, text: { en: "It includes access to the AWS Health API for other systems.", fr: "Il inclut l'accès à l'API AWS Health pour d'autres systèmes." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Basic Support is included for every AWS customer at no additional cost. It provides 24/7 customer service with one-on-one responses to account and billing questions, the support forums, service health checks, and the documentation, technical papers and best practice guides."
    fr: "Basic Support est inclus pour tous les clients AWS, sans frais supplémentaires. Il offre un service clientèle 24 h/24, 7 j/7 avec des réponses individuelles aux questions de compte et de facturation, les forums de support, les vérifications de l'état des services, ainsi que la documentation, les livres blancs et les guides de bonnes pratiques."
  options:
    a:
      en: "A designated TAM starts with AWS Enterprise Support; Basic Support does not include one."
      fr: "Un TAM désigné commence avec AWS Enterprise Support ; Basic Support n'en inclut pas."
    b:
      en: "24/7 phone, web and chat access to Cloud Support Engineers starts with AWS Business Support+."
      fr: "L'accès 24 h/24, 7 j/7 par téléphone, web et chat aux Cloud Support Engineers commence avec AWS Business Support+."
    d:
      en: "The AWS Health API requires Business Support+, Enterprise Support or Unified Operations; Basic Support customers use the AWS Health Dashboard."
      fr: "L'API AWS Health nécessite Business Support+, Enterprise Support ou Unified Operations ; les clients Basic Support utilisent AWS Health Dashboard."
references:
  - title: AWS Support plans
    url: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
