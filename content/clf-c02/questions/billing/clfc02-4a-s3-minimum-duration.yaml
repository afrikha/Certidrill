id: clfc02-4a-s3-minimum-duration
objective: "4.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uploads backup files to the S3 Glacier Flexible Retrieval storage class and deletes each file 30 days after upload.

    How is the storage of each deleted file billed?
  fr: |
    Une entreprise charge des fichiers de sauvegarde dans la classe de stockage S3 Glacier Flexible Retrieval et supprime chaque fichier 30 jours après son chargement.

    Comment le stockage de chaque fichier supprimé est-il facturé ?
body:
  options:
    - { id: a, text: { en: "For 30 days, because storage is billed only for the time the file exists", fr: "Pour 30 jours, car le stockage n'est facturé que pendant la durée d'existence du fichier" } }
    - { id: b, text: { en: "For 30 days, plus a per-GB retrieval fee charged at deletion", fr: "Pour 30 jours, plus des frais de récupération par Go facturés à la suppression" } }
    - { id: c, text: { en: "For 180 days, because archive classes have a 180-day minimum storage duration", fr: "Pour 180 jours, car les classes d'archivage ont une durée de stockage minimale de 180 jours" } }
    - { id: d, text: { en: "For 90 days, because the class has a 90-day minimum storage duration", fr: "Pour 90 jours, car la classe a une durée de stockage minimale de 90 jours" } }
answer: { optionId: d }
explanation:
  correct:
    en: "S3 Glacier Flexible Retrieval has a 90-day minimum storage duration. An object deleted before 90 days is still billed as if it had been stored for 90 days, so the company pays for the remaining 60 days."
    fr: "S3 Glacier Flexible Retrieval a une durée de stockage minimale de 90 jours. Un objet supprimé avant 90 jours est facturé comme s'il avait été stocké 90 jours : l'entreprise paie les 60 jours restants."
  options:
    a:
      en: "Classes with a minimum storage duration bill the full minimum even when the object is deleted earlier."
      fr: "Les classes avec une durée de stockage minimale facturent la totalité de ce minimum même si l'objet est supprimé plus tôt."
    b:
      en: "Retrieval fees apply when data is restored or read, not when it is deleted, and the minimum duration charge still applies."
      fr: "Les frais de récupération s'appliquent lorsque des données sont restaurées ou lues, pas lorsqu'elles sont supprimées, et la facturation minimale s'applique quand même."
    c:
      en: "The 180-day minimum belongs to S3 Glacier Deep Archive; Glacier Flexible Retrieval has a 90-day minimum."
      fr: "Le minimum de 180 jours est celui de S3 Glacier Deep Archive ; Glacier Flexible Retrieval a un minimum de 90 jours."
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
