id: clfc02-4a-commitment-options
objective: "4.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is comparing Amazon EC2 purchasing options.

    Which two options give a discount in exchange for a 1-year or 3-year commitment? (Choose two.)
  fr: |
    Une entreprise compare les options d'achat Amazon EC2.

    Quelles sont les deux options qui accordent une remise en échange d'un engagement de 1 ou 3 ans ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Spot Instances", fr: "Instances Spot" } }
    - { id: b, text: "Savings Plans" }
    - { id: c, text: "On-Demand Instances" }
    - { id: d, text: "On-Demand Capacity Reservations" }
    - { id: e, text: { en: "Reserved Instances", fr: "Instances réservées" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Savings Plans lower EC2 costs in exchange for a commitment to a consistent amount of usage, in USD per hour, for 1 or 3 years. Reserved Instances lower EC2 costs in exchange for a commitment to an instance configuration, including instance type and Region, for 1 or 3 years."
    fr: "Les Savings Plans réduisent les coûts EC2 en échange d'un engagement sur un montant d'utilisation constant, en USD par heure, pendant 1 ou 3 ans. Les instances réservées réduisent les coûts EC2 en échange d'un engagement sur une configuration d'instance, notamment le type d'instance et la Région, pendant 1 ou 3 ans."
  options:
    a:
      en: "Spot Instances use spare EC2 capacity at a lower price with no commitment, but EC2 can interrupt them."
      fr: "Les instances Spot utilisent la capacité EC2 inutilisée à un prix réduit sans engagement, mais EC2 peut les interrompre."
    c:
      en: "On-Demand Instances are billed by the second with no commitment and no discount."
      fr: "Les On-Demand Instances sont facturées à la seconde, sans engagement et sans remise."
    d:
      en: "Capacity Reservations for immediate use have no term commitment and no billing discount of their own; they only reserve capacity."
      fr: "Les Capacity Reservations à usage immédiat n'ont pas d'engagement de durée ni de remise propre ; elles ne font que réserver de la capacité."
references:
  - title: Amazon EC2 billing and purchasing options
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html
  - title: Reserve compute capacity with EC2 On-Demand Capacity Reservations
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html
