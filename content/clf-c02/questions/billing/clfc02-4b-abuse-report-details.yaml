id: clfc02-4b-abuse-report-details
objective: "4.3.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's servers receive intrusion attempts from IP addresses that belong to AWS. The company prepares a report for the AWS Trust & Safety team.

    Which two items should the company include in the report? (Choose two.)
  fr: |
    Les serveurs d'une entreprise subissent des tentatives d'intrusion depuis des adresses IP qui appartiennent à AWS. L'entreprise prépare un signalement pour l'équipe AWS Trust & Safety.

    Quels sont les deux éléments que l'entreprise doit inclure dans le signalement ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Samples of the logs that show the activity", fr: "Des extraits des journaux qui montrent l'activité" } }
    - { id: b, text: { en: "The AWS Support plan of the company's account", fr: "Le plan AWS Support du compte de l'entreprise" } }
    - { id: c, text: { en: "A copy of the company's latest AWS bill", fr: "Une copie de la dernière facture AWS de l'entreprise" } }
    - { id: d, text: { en: "The targeted IP address and a timestamp with the time zone", fr: "L'adresse IP ciblée et un horodatage avec le fuseau horaire" } }
    - { id: e, text: { en: "A screenshot of the AWS Health Dashboard", fr: "Une capture d'écran d'AWS Health Dashboard" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "For network activity such as intrusion attempts, DDoS attacks or port scans, the report should give the targeted IP address, a timestamp that includes the time zone, and log samples. Trust & Safety uses this information to investigate the AWS resources involved."
    fr: "Pour une activité réseau comme des tentatives d'intrusion, des attaques DDoS ou des analyses de ports, le signalement doit indiquer l'adresse IP ciblée, un horodatage avec le fuseau horaire et des extraits de journaux. Trust & Safety utilise ces informations pour examiner les ressources AWS impliquées."
  options:
    b:
      en: "Abuse reports do not depend on a Support plan; anyone can report abuse of AWS resources."
      fr: "Les signalements d'abus ne dépendent pas d'un plan de support ; tout le monde peut signaler un abus des ressources AWS."
    c:
      en: "The company's bill says nothing about the abusive traffic and is not needed for the investigation."
      fr: "La facture de l'entreprise ne dit rien du trafic abusif et n'est pas nécessaire à l'enquête."
    e:
      en: "The AWS Health Dashboard shows AWS service events, not the traffic that reached the company's servers."
      fr: "AWS Health Dashboard affiche les événements des services AWS, pas le trafic reçu par les serveurs de l'entreprise."
references:
  - title: How do I report abuse of AWS resources?
    url: https://repost.aws/knowledge-center/report-aws-abuse
