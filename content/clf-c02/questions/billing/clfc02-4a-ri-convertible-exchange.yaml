id: clfc02-4a-ri-convertible-exchange
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants a 3-year Amazon EC2 Reserved Instance discount. During the term, it expects to move its workload to a different instance family and operating system.

    Which type of Reserved Instance should the company buy?
  fr: |
    Une entreprise veut la remise d'une instance réservée Amazon EC2 sur 3 ans. Pendant cette durée, elle prévoit de déplacer sa charge de travail vers une autre famille d'instances et un autre système d'exploitation.

    Quel type d'instance réservée l'entreprise doit-elle acheter ?
body:
  options:
    - { id: a, text: { en: "Standard Reserved Instance", fr: "Instance réservée standard" } }
    - { id: b, text: { en: "Standard Reserved Instance bought in the Reserved Instance Marketplace", fr: "Instance réservée standard achetée sur le Marketplace des instances réservées" } }
    - { id: c, text: { en: "Convertible Reserved Instance", fr: "Instance réservée convertible" } }
    - { id: d, text: { en: "Zonal Standard Reserved Instance", fr: "Instance réservée standard zonale" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A Convertible Reserved Instance can be exchanged during its term for another Convertible Reserved Instance with new attributes, including instance family, instance type, platform, scope and tenancy. In exchange for this flexibility, its discount is smaller than that of a Standard Reserved Instance."
    fr: "Une instance réservée convertible peut être échangée pendant sa durée contre une autre instance réservée convertible aux attributs différents : famille et type d'instance, plateforme, étendue et location (tenancy). En contrepartie de cette flexibilité, sa remise est plus faible que celle d'une instance réservée standard."
  options:
    a:
      en: "A Standard Reserved Instance gives the larger discount, but it cannot be exchanged for another instance family or platform."
      fr: "Une instance réservée standard offre la remise la plus élevée, mais elle ne peut pas être échangée contre une autre famille d'instances ou une autre plateforme."
    b:
      en: "A Standard Reserved Instance bought in the Marketplace is still a Standard Reserved Instance: it cannot be exchanged for another instance family or platform."
      fr: "Une instance réservée standard achetée sur le Marketplace reste une instance réservée standard : elle ne peut pas être échangée contre une autre famille d'instances ou une autre plateforme."
    d:
      en: "A zonal scope adds a capacity reservation in one Availability Zone; it does not make a Standard Reserved Instance exchangeable."
      fr: "Une étendue zonale ajoute une réservation de capacité dans une zone de disponibilité ; elle ne rend pas une instance réservée standard échangeable."
references:
  - title: Types of Reserved Instances (offering classes)
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-types.html
