id: clfc02-4a-ri-org-share-unused
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses AWS Organizations with consolidated billing, and discount sharing is active for all accounts. Account A owns Amazon EC2 Reserved Instances that it does not fully use. Account B runs matching instances at On-Demand rates.

    What happens to the unused Reserved Instance hours of account A?
  fr: |
    Une entreprise utilise AWS Organizations avec la facturation consolidée, et le partage des remises est activé pour tous les comptes. Le compte A possède des instances réservées Amazon EC2 qu'il n'utilise pas entièrement. Le compte B exécute des instances correspondantes au tarif On-Demand.

    Que deviennent les heures d'instance réservée inutilisées du compte A ?
body:
  options:
    - { id: a, text: { en: "They are refunded to account A at the end of the month.", fr: "Elles sont remboursées au compte A à la fin du mois." } }
    - { id: b, text: { en: "They apply to the matching usage of account B.", fr: "Elles s'appliquent à l'utilisation correspondante du compte B." } }
    - { id: c, text: { en: "They are carried over to the next month for account A.", fr: "Elles sont reportées sur le mois suivant pour le compte A." } }
    - { id: d, text: { en: "They are lost, because a reservation applies only to its own account.", fr: "Elles sont perdues, car une réservation ne s'applique qu'à son propre compte." } }
answer: { optionId: b }
explanation:
  correct:
    en: "For billing, consolidated billing treats all the accounts of the organization as one account. Any account with sharing activated can receive the hourly benefit of Reserved Instances bought by another account, so the unused hours of account A lower the On-Demand charges of account B."
    fr: "Pour la facturation, la facturation consolidée traite tous les comptes de l'organisation comme un seul compte. Tout compte dont le partage est activé peut bénéficier de l'avantage horaire des instances réservées achetées par un autre compte : les heures inutilisées du compte A réduisent les frais On-Demand du compte B."
  options:
    a:
      en: "Reserved Instances are a commitment for the whole term; unused hours are not refunded."
      fr: "Les instances réservées sont un engagement sur toute la durée ; les heures inutilisées ne sont pas remboursées."
    c:
      en: "Reserved Instance benefits apply hour by hour; unused hours are not carried over to a later period."
      fr: "L'avantage des instances réservées s'applique heure par heure ; les heures inutilisées ne sont pas reportées sur une période ultérieure."
    d:
      en: "With sharing activated, the discount is not limited to the owning account: other accounts of the organization can use it."
      fr: "Avec le partage activé, la remise n'est pas limitée au compte propriétaire : les autres comptes de l'organisation peuvent en bénéficier."
references:
  - title: Reserved Instances
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ri-behavior.html
  - title: Reserved Instances and Savings Plans discount sharing
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ri-turn-off.html
