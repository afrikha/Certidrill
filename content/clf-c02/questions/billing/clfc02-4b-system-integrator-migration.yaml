id: clfc02-4b-system-integrator-migration
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company has little cloud experience. It wants an outside company to plan and carry out the migration of its applications to AWS and then manage them.

    Which type of AWS Partner should the company choose?
  fr: |
    Une entreprise de distribution a peu d'expérience du cloud. Elle souhaite qu'une société externe planifie et réalise la migration de ses applications vers AWS, puis les gère.

    Quel type de partenaire AWS l'entreprise doit-elle choisir ?
body:
  options:
    - { id: a, text: { en: "An independent software vendor that sells an AMI", fr: "Un fournisseur indépendant de logiciels qui vend une AMI" } }
    - { id: b, text: { en: "A data provider that lists datasets", fr: "Un fournisseur de données qui publie des jeux de données" } }
    - { id: c, text: { en: "A system integrator from the services partners", fr: "Un intégrateur système parmi les partenaires de services" } }
    - { id: d, text: { en: "A seller of security software in AWS Marketplace", fr: "Un vendeur de logiciels de sécurité dans AWS Marketplace" } }
answer: { optionId: c }
explanation:
  correct:
    en: "System integrators are Services Partners of the APN: consulting companies that deliver professional services and managed services, such as migration projects and the operation of workloads on AWS."
    fr: "Les intégrateurs système sont des partenaires de services de l'APN : des sociétés de conseil qui fournissent des services professionnels et des services managés, comme des projets de migration et l'exploitation de charges de travail sur AWS."
  options:
    a:
      en: "An ISV builds and sells software products; it does not run a customer's migration project."
      fr: "Un ISV crée et vend des produits logiciels ; il ne mène pas le projet de migration d'un client."
    b:
      en: "A data provider sells data products; it does not migrate or manage applications."
      fr: "Un fournisseur de données vend des produits de données ; il ne migre ni ne gère des applications."
    d:
      en: "A software seller provides a product to deploy, not the planning, migration and management of the company's applications."
      fr: "Un vendeur de logiciels fournit un produit à déployer, pas la planification, la migration et la gestion des applications de l'entreprise."
references:
  - title: Become an AWS Partner
    url: https://aws.amazon.com/partners/
