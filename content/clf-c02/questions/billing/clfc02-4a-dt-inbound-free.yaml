id: clfc02-4a-dt-inbound-free
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is reviewing the data transfer charges of its Amazon EC2 instances.

    Which type of data transfer is free of charge?
  fr: |
    Une entreprise examine les frais de transfert de données de ses instances Amazon EC2.

    Quel type de transfert de données est gratuit ?
body:
  options:
    - { id: a, text: { en: "Data transferred from the instances to the internet", fr: "Les données transférées des instances vers Internet" } }
    - { id: b, text: { en: "Data transferred from the internet to the instances", fr: "Les données transférées d'Internet vers les instances" } }
    - { id: c, text: { en: "Data transferred from the instances to another AWS Region", fr: "Les données transférées des instances vers une autre Région AWS" } }
    - { id: d, text: { en: "Data transferred between instances in different Availability Zones", fr: "Les données transférées entre des instances de zones de disponibilité différentes" } }
answer: { optionId: b }
explanation:
  correct:
    en: "There is no charge for data transfer from the internet to AWS. Outbound data transfer is one of the main drivers of cost on AWS, together with compute and storage."
    fr: "Le transfert de données d'Internet vers AWS n'est pas facturé. Le transfert de données sortant est l'un des principaux facteurs de coût sur AWS, avec le calcul et le stockage."
  options:
    a:
      en: "Data transfer out to the internet is charged per GB, at rates that depend on the source Region."
      fr: "Le transfert de données sortant vers Internet est facturé par Go, à des tarifs qui dépendent de la Région d'origine."
    c:
      en: "Data sent to another Region is charged as data transfer out of the source Region."
      fr: "Les données envoyées vers une autre Région sont facturées comme transfert sortant de la Région d'origine."
    d:
      en: "Traffic between Availability Zones of the same Region is charged, in both directions."
      fr: "Le trafic entre zones de disponibilité d'une même Région est facturé, dans les deux sens."
references:
  - title: Understanding data transfer charges
    url: https://docs.aws.amazon.com/cur/latest/userguide/cur-data-transfers-charges.html
