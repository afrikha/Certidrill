id: clfc02-4b-tam-lowest-plan
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants a designated technical account manager (TAM) from AWS.

    Which is the MOST cost-effective AWS Support plan that meets this requirement?
  fr: |
    Une entreprise souhaite disposer d'un gestionnaire de compte technique (TAM) désigné par AWS.

    Quel est le plan AWS Support le PLUS rentable qui répond à cette exigence ?
body:
  options:
    - { id: a, text: "AWS Business Support+" }
    - { id: b, text: "AWS Enterprise Support" }
    - { id: c, text: "AWS Unified Operations" }
    - { id: d, text: "Basic Support" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Enterprise Support is the first plan that includes a designated TAM. It also adds a response in less than 15 minutes for business-critical system-down cases, strategic business reviews and access to AWS Security Incident Response."
    fr: "AWS Enterprise Support est le premier plan qui inclut un TAM désigné. Il ajoute aussi une réponse en moins de 15 minutes pour les cas de système critique pour l'entreprise en panne, des revues stratégiques et l'accès à AWS Security Incident Response."
  options:
    a:
      en: "Business Support+ gives 24/7 access to Cloud Support Engineers and the full set of Trusted Advisor checks, but no designated TAM."
      fr: "Business Support+ donne un accès 24 h/24, 7 j/7 aux Cloud Support Engineers et l'ensemble des vérifications Trusted Advisor, mais pas de TAM désigné."
    c:
      en: "Unified Operations includes a designated TAM, but it costs more than Enterprise Support, so it is not the most cost-effective choice."
      fr: "Unified Operations inclut un TAM désigné, mais il coûte plus cher qu'Enterprise Support : ce n'est donc pas le choix le plus rentable."
    d:
      en: "Basic Support covers account and billing questions and the documentation; it includes no TAM."
      fr: "Basic Support couvre les questions de compte et de facturation et la documentation ; il n'inclut aucun TAM."
references:
  - title: AWS Support plans
    url: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
