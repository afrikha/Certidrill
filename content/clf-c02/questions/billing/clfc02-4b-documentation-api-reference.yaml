id: clfc02-4b-documentation-api-reference
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer needs the developer guide, the API reference and the AWS CLI reference for Amazon DynamoDB.

    Where should the developer look?
  fr: |
    Un développeur a besoin du guide du développeur, de la référence d'API et de la référence AWS CLI d'Amazon DynamoDB.

    Où le développeur doit-il chercher ?
body:
  options:
    - { id: a, text: { en: "AWS Documentation", fr: "La documentation AWS (AWS Documentation)" } }
    - { id: b, text: "AWS Whitepapers & Guides" }
    - { id: c, text: "AWS Prescriptive Guidance" }
    - { id: d, text: "AWS Blogs" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Documentation (docs.aws.amazon.com) provides, for each service, the user guides, developer guides, API references and CLI references, along with tutorials, code samples and SDK documentation."
    fr: "La documentation AWS (docs.aws.amazon.com) fournit, pour chaque service, les guides de l'utilisateur, les guides du développeur, les références d'API et les références CLI, ainsi que des didacticiels, des exemples de code et la documentation des SDK."
  options:
    b:
      en: "Whitepapers & Guides holds whitepapers, decision guides and reference architectures, not the API and CLI references of each service."
      fr: "Whitepapers & Guides contient des livres blancs, des guides de décision et des architectures de référence, pas les références d'API et CLI de chaque service."
    c:
      en: "Prescriptive Guidance gives migration and modernization guides and patterns, not service API references."
      fr: "Prescriptive Guidance donne des guides et modèles de migration et de modernisation, pas les références d'API des services."
    d:
      en: "Blog posts give news and examples, but they are not the complete reference documentation of a service."
      fr: "Les articles de blog donnent des actualités et des exemples, mais ne constituent pas la documentation de référence complète d'un service."
references:
  - title: Welcome to AWS Documentation
    url: https://docs.aws.amazon.com/
