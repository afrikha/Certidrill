id: clfc02-4a-cb-volume-tiers
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Three AWS accounts of a company each store data in Amazon S3. Alone, no account reaches the next S3 volume pricing tier, but their combined usage would. The company moves the accounts into an organization with consolidated billing.

    How does this change the S3 storage charges?
  fr: |
    Trois comptes AWS d'une entreprise stockent chacun des données dans Amazon S3. Seul, aucun compte n'atteint le palier de tarification sur volume S3 suivant, mais leur utilisation cumulée l'atteindrait. L'entreprise déplace les comptes dans une organisation avec la facturation consolidée.

    Quel est l'effet sur les frais de stockage S3 ?
body:
  options:
    - { id: a, text: { en: "Nothing changes, because volume tiers apply to each account separately.", fr: "Rien ne change, car les paliers de volume s'appliquent à chaque compte séparément." } }
    - { id: b, text: { en: "The usage is combined, so the lower price of the next tier can apply.", fr: "L'utilisation est cumulée : le prix plus bas du palier suivant peut s'appliquer." } }
    - { id: c, text: { en: "Each account receives a fixed discount for being an organization member.", fr: "Chaque compte reçoit une remise fixe parce qu'il est membre d'une organisation." } }
    - { id: d, text: { en: "The charges increase, because consolidated billing adds a monthly fee.", fr: "Les frais augmentent, car la facturation consolidée ajoute des frais mensuels." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Consolidated billing combines the usage of all the accounts in the organization, so the organization shares volume pricing discounts as if it were one account. The combined S3 usage reaches the next tier, which lowers the charges compared with standalone accounts."
    fr: "La facturation consolidée cumule l'utilisation de tous les comptes de l'organisation, qui partage ainsi les remises sur volume comme s'il s'agissait d'un seul compte. L'utilisation S3 cumulée atteint le palier suivant, ce qui réduit les frais par rapport à des comptes autonomes."
  options:
    a:
      en: "For billing, consolidated billing treats the accounts as one account, so volume tiers apply to the combined usage."
      fr: "Pour la facturation, la facturation consolidée traite les comptes comme un seul compte : les paliers de volume s'appliquent à l'utilisation cumulée."
    c:
      en: "There is no fixed membership discount; the savings come from combined usage and shared discounts."
      fr: "Il n'existe pas de remise fixe liée à l'adhésion ; les économies viennent de l'utilisation cumulée et des remises partagées."
    d:
      en: "Consolidated billing is offered at no additional cost."
      fr: "La facturation consolidée est proposée sans frais supplémentaires."
references:
  - title: Consolidating billing for AWS Organizations
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/consolidated-billing.html
