id: clfc02-4b-partner-central
objective: "4.3.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting company wants to join the AWS Partner Network and then access its partner benefits and programs.

    Which portal should the company use?
  fr: |
    Une société de conseil souhaite rejoindre l'AWS Partner Network, puis accéder à ses avantages et programmes partenaires.

    Quel portail la société doit-elle utiliser ?
body:
  options:
    - { id: a, text: "AWS Partner Central" }
    - { id: b, text: "AWS Support Center" }
    - { id: c, text: "AWS Management Console" }
    - { id: d, text: "AWS Skill Builder" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Partner Central is the portal where an organization joins the APN and then reaches the partner benefits and programs, such as funding, incentives and co-selling support."
    fr: "AWS Partner Central est le portail où une organisation rejoint l'APN, puis accède aux avantages et programmes partenaires, comme les financements, les incitations et le soutien à la vente conjointe."
  options:
    b:
      en: "The AWS Support Center is where customers open support cases; it is not the partner portal."
      fr: "Le centre de support AWS (AWS Support Center) sert à ouvrir des cas de support ; ce n'est pas le portail des partenaires."
    c:
      en: "The AWS Management Console manages AWS resources in an account; it does not manage APN membership."
      fr: "AWS Management Console gère les ressources AWS d'un compte ; il ne gère pas l'adhésion à l'APN."
    d:
      en: "Skill Builder hosts training, including partner courses, but it is not where a company joins the APN and manages its benefits."
      fr: "Skill Builder héberge des formations, y compris des cours pour partenaires, mais ce n'est pas là qu'une entreprise rejoint l'APN et gère ses avantages."
references:
  - title: Become an AWS Partner
    url: https://aws.amazon.com/partners/
