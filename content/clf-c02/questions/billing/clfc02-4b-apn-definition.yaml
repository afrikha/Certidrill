id: clfc02-4b-apn-definition
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the AWS Partner Network (APN)?
  fr: |
    Quelle affirmation décrit l'AWS Partner Network (APN) ?
body:
  options:
    - { id: a, text: { en: "A global community of companies that build solutions and services on AWS", fr: "Une communauté mondiale d'entreprises qui créent des solutions et des services sur AWS" } }
    - { id: b, text: { en: "A private network that connects data centers to AWS", fr: "Un réseau privé qui connecte les centres de données à AWS" } }
    - { id: c, text: { en: "A team of AWS employees that answers technical support cases", fr: "Une équipe d'employés d'AWS qui répond aux cas de support technique" } }
    - { id: d, text: { en: "A public forum where customers ask and answer AWS questions", fr: "Un forum public où les clients posent des questions sur AWS et y répondent" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The APN is a global community of organizations that use AWS technologies, programs, funding and tools to build solutions and services for AWS customers. It includes Software Partners, such as independent software vendors, and Services Partners, such as system integrators."
    fr: "L'APN est une communauté mondiale d'organisations qui utilisent les technologies, programmes, financements et outils d'AWS pour créer des solutions et des services destinés aux clients AWS. Elle comprend des partenaires logiciels, comme les fournisseurs indépendants de logiciels (ISV), et des partenaires de services, comme les intégrateurs système."
  options:
    c:
      en: "Technical support cases are handled by AWS Support engineers, not by the APN."
      fr: "Les cas de support technique sont traités par les ingénieurs AWS Support, pas par l'APN."
    b:
      en: "This describes AWS Direct Connect, a networking service, not the partner program."
      fr: "Cela décrit AWS Direct Connect, un service réseau, et non le programme de partenaires."
    d:
      en: "This describes AWS re:Post, the community question-and-answer service."
      fr: "Cela décrit AWS re:Post, le service communautaire de questions-réponses."
references:
  - title: Become an AWS Partner
    url: https://aws.amazon.com/partners/
