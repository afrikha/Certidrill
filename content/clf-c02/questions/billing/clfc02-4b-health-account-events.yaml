id: clfc02-4b-health-account-events
objective: "4.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to see the AWS events that affect its own account and resources, including planned activities, without any setup and at no additional cost.

    Which AWS tool should the company use?
  fr: |
    Une entreprise souhaite voir les événements AWS qui affectent son propre compte et ses ressources, y compris les activités planifiées, sans configuration et sans frais supplémentaires.

    Quel outil AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "AWS Health Dashboard" }
    - { id: b, text: "AWS Trusted Advisor" }
    - { id: c, text: "AWS Cost Explorer" }
    - { id: d, text: "AWS Config" }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS Health Dashboard is available to all customers at no additional cost and requires no setup. Its Your account health page shows the events that affect your account and resources, and helps you prepare for planned activities."
    fr: "AWS Health Dashboard est accessible à tous les clients sans frais supplémentaires et ne nécessite aucune configuration. Sa page Your account health affiche les événements qui affectent votre compte et vos ressources, et vous aide à vous préparer aux activités planifiées."
  options:
    b:
      en: "Trusted Advisor checks resources against best practices; it does not report AWS service events or planned activities."
      fr: "Trusted Advisor compare les ressources aux bonnes pratiques ; il ne signale pas les événements des services AWS ni les activités planifiées."
    c:
      en: "Cost Explorer analyzes past costs and forecasts future costs; it does not show health events."
      fr: "Cost Explorer analyse les coûts passés et prévoit les coûts futurs ; il n'affiche pas d'événements d'état."
    d:
      en: "AWS Config records resource configurations and their changes, not AWS health events."
      fr: "AWS Config enregistre les configurations des ressources et leurs modifications, pas les événements d'état d'AWS."
references:
  - title: What is AWS Health?
    url: https://docs.aws.amazon.com/health/latest/ug/what-is-aws-health.html
  - title: AWS Health Dashboard
    url: https://docs.aws.amazon.com/health/latest/ug/aws-health-dashboard-status.html
