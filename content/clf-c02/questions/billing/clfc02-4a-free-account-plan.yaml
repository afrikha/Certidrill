id: clfc02-4a-free-account-plan
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer creates a new AWS account and chooses the Free account plan to build a proof of concept.

    Which statement about this plan is correct?
  fr: |
    Un développeur crée un nouveau compte AWS et choisit le plan de compte gratuit (Free account plan) pour construire une preuve de concept.

    Quelle affirmation sur ce plan est correcte ?
body:
  options:
    - { id: a, text: { en: "It gives 12 months of free usage of every AWS service, with no limits.", fr: "Il offre 12 mois d'utilisation gratuite de tous les services AWS, sans limite." } }
    - { id: b, text: { en: "It starts charging standard rates automatically when the credits are used up.", fr: "Il commence à facturer automatiquement les tarifs standard lorsque les crédits sont épuisés." } }
    - { id: c, text: { en: "It ends after six months or when the credits are used up, whichever comes first.", fr: "Il prend fin au bout de six mois ou lorsque les crédits sont épuisés, selon ce qui arrive en premier." } }
    - { id: d, text: { en: "It includes short-term trials of every service but no Always Free offers.", fr: "Il inclut des essais de courte durée de tous les services mais aucune offre Always Free." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Free account plan lets new customers experiment at no cost for up to six months. It ends after six months or when the credits are fully used, whichever comes first, and the account is not charged until it is upgraded to the Paid account plan."
    fr: "Le plan de compte gratuit permet aux nouveaux clients d'expérimenter sans frais pendant six mois au maximum. Il prend fin au bout de six mois ou lorsque les crédits sont entièrement utilisés, selon ce qui arrive en premier, et le compte n'est pas facturé tant qu'il n'est pas passé au plan de compte payant (Paid account plan)."
  options:
    a:
      en: "The plan lasts up to six months, covers usage with credits, and excludes some services that would quickly use up the credits."
      fr: "Le plan dure six mois au maximum, couvre l'utilisation avec des crédits et exclut certains services qui épuiseraient vite les crédits."
    b:
      en: "An account on the Free account plan is not charged until the customer upgrades to the Paid account plan."
      fr: "Un compte sur le plan de compte gratuit n'est pas facturé tant que le client ne passe pas au plan de compte payant."
    d:
      en: "Free plan accounts have only the Always Free offers; short-term trials are for Paid plan accounts."
      fr: "Les comptes du plan gratuit n'ont que les offres Always Free ; les essais de courte durée sont réservés aux comptes du plan payant."
references:
  - title: Explore AWS services with AWS Free Tier
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/free-tier.html
