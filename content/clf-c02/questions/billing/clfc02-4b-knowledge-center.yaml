id: clfc02-4b-knowledge-center
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer wants official articles and videos written by AWS that answer the questions and requests that AWS customers submit most often about services such as Amazon EC2 and Amazon S3.

    Which AWS resource meets this requirement?
  fr: |
    Un développeur souhaite des articles et vidéos officiels rédigés par AWS qui répondent aux questions et demandes les plus fréquentes des clients AWS sur des services comme Amazon EC2 et Amazon S3.

    Quelle ressource AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "AWS Knowledge Center" }
    - { id: b, text: "AWS Prescriptive Guidance" }
    - { id: c, text: { en: "The community questions of AWS re:Post", fr: "Les questions de la communauté AWS re:Post" } }
    - { id: d, text: "AWS Whitepapers & Guides" }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS Knowledge Center, hosted on AWS re:Post, is a library of official AWS articles and videos. They answer the common questions and requests that customers submit, service by service, and each one shows when it was last updated."
    fr: "Le Knowledge Center d'AWS, hébergé sur AWS re:Post, est une bibliothèque d'articles et de vidéos officiels d'AWS. Ils répondent, service par service, aux questions et demandes courantes des clients, et chacun indique sa date de dernière mise à jour."
  options:
    b:
      en: "Prescriptive Guidance provides migration and modernization guides and patterns, not answers to frequent questions about each service."
      fr: "Prescriptive Guidance fournit des guides et des modèles de migration et de modernisation, pas des réponses aux questions fréquentes sur chaque service."
    c:
      en: "Community questions on re:Post are answered by community members, not written as official AWS articles."
      fr: "Les questions de la communauté re:Post reçoivent des réponses de membres de la communauté ; ce ne sont pas des articles officiels d'AWS."
    d:
      en: "Whitepapers & Guides holds whitepapers and reference material, not short answers to frequent customer questions."
      fr: "Whitepapers & Guides contient des livres blancs et des documents de référence, pas de courtes réponses aux questions fréquentes des clients."
references:
  - title: AWS re:Post Knowledge Center
    url: https://repost.aws/knowledge-center
