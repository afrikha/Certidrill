id: clfc02-4a-cb-member-bills
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses consolidated billing in AWS Organizations. A member account owner asks how the bill shown for the member account is used.

    Which statement is correct?
  fr: |
    Une entreprise utilise la facturation consolidée d'AWS Organizations. Le responsable d'un compte membre demande à quoi sert la facture affichée pour ce compte membre.

    Quelle affirmation est correcte ?
body:
  options:
    - { id: a, text: { en: "The member account pays its own bill with its own payment method.", fr: "Le compte membre paie sa propre facture avec son propre moyen de paiement." } }
    - { id: b, text: { en: "The member account bill is split equally among all the accounts.", fr: "La facture du compte membre est répartie à parts égales entre tous les comptes." } }
    - { id: c, text: { en: "The member account bill is informational; the management account pays.", fr: "La facture du compte membre est informative ; le compte de gestion paie." } }
    - { id: d, text: { en: "The member account bill is hidden from the management account.", fr: "La facture du compte membre est masquée au compte de gestion." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With consolidated billing, the management account pays the charges of all the member accounts. Member account bills are for informational purposes only, and the management account can see a combined view of the charges and get a cost report for each member account to allocate costs."
    fr: "Avec la facturation consolidée, le compte de gestion paie les frais de tous les comptes membres. Les factures des comptes membres sont fournies à titre informatif uniquement, et le compte de gestion peut voir une vue combinée des frais et obtenir un rapport de coûts pour chaque compte membre afin de répartir les coûts."
  options:
    a:
      en: "Member accounts do not pay their charges; the management account pays for the whole organization."
      fr: "Les comptes membres ne paient pas leurs frais ; le compte de gestion paie pour toute l'organisation."
    b:
      en: "Charges are not split equally; each member account bill shows the costs of that account's own usage."
      fr: "Les frais ne sont pas répartis à parts égales ; la facture de chaque compte membre présente les coûts de sa propre utilisation."
    d:
      en: "The management account sees a combined view of the charges of all member accounts and a cost report for each of them."
      fr: "Le compte de gestion voit une vue combinée des frais de tous les comptes membres et un rapport de coûts pour chacun d'eux."
references:
  - title: Consolidating billing for AWS Organizations
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/consolidated-billing.html
