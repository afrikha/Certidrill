id: clfc02-4b-trusted-advisor-checks
objective: "4.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants an AWS service that inspects its AWS environment and recommends actions in categories such as cost optimization, security, fault tolerance and service limits.

    Which AWS service meets this requirement?
  fr: |
    Une entreprise souhaite un service AWS qui analyse son environnement AWS et recommande des actions dans des catégories comme l'optimisation des coûts, la sécurité, la tolérance aux pannes et les limites de service.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "AWS Health Dashboard" }
    - { id: b, text: "AWS CloudTrail" }
    - { id: c, text: "AWS Trusted Advisor" }
    - { id: d, text: "AWS Artifact" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Trusted Advisor runs checks across cost optimization, performance, security, fault tolerance, service limits and operational excellence. Its cost optimization checks find, for example, idle Amazon RDS DB instances or stopped EC2 instances that still cost money."
    fr: "AWS Trusted Advisor exécute des vérifications dans les catégories optimisation des coûts, performances, sécurité, tolérance aux pannes, limites de service et excellence opérationnelle. Ses vérifications d'optimisation des coûts détectent, par exemple, des instances de base de données Amazon RDS inactives ou des instances EC2 arrêtées qui coûtent encore de l'argent."
  options:
    a:
      en: "The AWS Health Dashboard reports events that affect AWS services and your account; it does not run best-practice checks on your resources."
      fr: "AWS Health Dashboard signale les événements qui affectent les services AWS et votre compte ; il n'exécute pas de vérifications de bonnes pratiques sur vos ressources."
    b:
      en: "CloudTrail records API calls made in the account; it does not recommend cost or security improvements."
      fr: "CloudTrail enregistre les appels d'API effectués dans le compte ; il ne recommande pas d'améliorations de coûts ou de sécurité."
    d:
      en: "AWS Artifact provides AWS compliance reports and agreements, not recommendations about your environment."
      fr: "AWS Artifact fournit les rapports de conformité et les accords d'AWS, pas des recommandations sur votre environnement."
references:
  - title: AWS Trusted Advisor check reference
    url: https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor-check-reference.html
  - title: Cost optimization
    url: https://docs.aws.amazon.com/awssupport/latest/user/cost-optimization-checks.html
