id: clfc02-4b-prescriptive-guidance-patterns
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is planning a large migration to AWS. Its builders want AWS guides and patterns that give steps, architectures, tools and code for common migration and modernization scenarios.

    Which AWS resource meets this requirement?
  fr: |
    Une entreprise prépare une migration de grande ampleur vers AWS. Ses équipes techniques souhaitent des guides et des modèles AWS qui fournissent les étapes, les architectures, les outils et le code des scénarios courants de migration et de modernisation.

    Quelle ressource AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "AWS Knowledge Center" }
    - { id: b, text: "AWS re:Post" }
    - { id: c, text: "AWS Marketplace" }
    - { id: d, text: "AWS Prescriptive Guidance" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Prescriptive Guidance offers guides with planning and implementation best practices, and patterns with steps, architectures, tools and code for common migration, optimization and modernization scenarios. The content comes from AWS technology experts and AWS Partners."
    fr: "AWS Prescriptive Guidance propose des guides de bonnes pratiques de planification et de mise en œuvre, ainsi que des modèles (patterns) avec les étapes, les architectures, les outils et le code des scénarios courants de migration, d'optimisation et de modernisation. Le contenu provient d'experts techniques d'AWS et de partenaires AWS."
  options:
    a:
      en: "The Knowledge Center answers frequent customer questions about individual services; it does not provide migration patterns and guides."
      fr: "Le Knowledge Center répond aux questions fréquentes des clients sur chaque service ; il ne fournit pas de modèles et de guides de migration."
    b:
      en: "re:Post is a community question-and-answer service; its answers are not structured migration patterns."
      fr: "re:Post est un service communautaire de questions-réponses ; ses réponses ne sont pas des modèles de migration structurés."
    c:
      en: "AWS Marketplace sells third-party software, data and services; it is not a library of AWS migration guidance."
      fr: "AWS Marketplace vend des logiciels, des données et des services tiers ; ce n'est pas une bibliothèque de recommandations de migration AWS."
references:
  - title: AWS Prescriptive Guidance
    url: https://aws.amazon.com/prescriptive-guidance/
