id: clfc02-4a-cb-one-bill
objective: "4.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 15 AWS accounts and receives 15 separate bills. It wants to receive one bill and pay the charges of all the accounts from a single account.

    Which AWS feature meets this requirement?
  fr: |
    Une entreprise possède 15 comptes AWS et reçoit 15 factures distinctes. Elle veut recevoir une seule facture et payer les frais de tous les comptes depuis un seul compte.

    Quelle fonctionnalité AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Consolidated billing in AWS Organizations", fr: "La facturation consolidée d'AWS Organizations" } }
    - { id: b, text: { en: "Cost allocation tags", fr: "Les balises de répartition des coûts" } }
    - { id: c, text: { en: "AWS Cost Explorer", fr: "AWS Cost Explorer" } }
    - { id: d, text: { en: "AWS Resource Access Manager (AWS RAM)", fr: "AWS Resource Access Manager (AWS RAM)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "With consolidated billing, the management account of the organization pays the charges of all the member accounts, and the company receives one bill for the accounts. Consolidated billing is offered at no additional cost."
    fr: "Avec la facturation consolidée, le compte de gestion de l'organisation paie les frais de tous les comptes membres, et l'entreprise reçoit une seule facture pour les comptes. La facturation consolidée est proposée sans frais supplémentaires."
  options:
    b:
      en: "Cost allocation tags organize costs by labels in reports; they do not merge the bills of several accounts."
      fr: "Les balises de répartition des coûts organisent les coûts par étiquettes dans les rapports ; elles ne fusionnent pas les factures de plusieurs comptes."
    c:
      en: "Cost Explorer analyzes costs and usage; it does not change how accounts are billed or who pays."
      fr: "Cost Explorer analyse les coûts et l'utilisation ; il ne change ni la facturation des comptes ni le payeur."
    d:
      en: "AWS RAM shares resources such as subnets between accounts; it does not consolidate bills."
      fr: "AWS RAM partage des ressources, comme des sous-réseaux, entre comptes ; il ne consolide pas les factures."
references:
  - title: Consolidating billing for AWS Organizations
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/consolidated-billing.html
