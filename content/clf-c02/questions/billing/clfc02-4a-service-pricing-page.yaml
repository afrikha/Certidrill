id: clfc02-4a-service-pricing-page
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before choosing an AWS Region, a company wants to look up the current On-Demand price of an Amazon EC2 instance type in several Regions.

    Where can the company find this information?
  fr: |
    Avant de choisir une Région AWS, une entreprise veut connaître le prix On-Demand actuel d'un type d'instance Amazon EC2 dans plusieurs Régions.

    Où l'entreprise peut-elle trouver cette information ?
body:
  options:
    - { id: a, text: { en: "In AWS Artifact", fr: "Dans AWS Artifact" } }
    - { id: b, text: { en: "In the AWS Cost and Usage Report", fr: "Dans AWS Cost and Usage Report" } }
    - { id: c, text: { en: "In the AWS Health Dashboard", fr: "Dans AWS Health Dashboard" } }
    - { id: d, text: { en: "On the Amazon EC2 pricing page of the AWS website", fr: "Sur la page de tarification d'Amazon EC2 du site web d'AWS" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Each AWS service has a pricing page on the AWS website that lists its prices, which can vary by Region. The prices on the service pricing page are the ones AWS charges: the AWS Price List files are for informational purposes only."
    fr: "Chaque service AWS a une page de tarification sur le site web d'AWS qui indique ses prix, lesquels peuvent varier selon la Région. Les prix de la page de tarification du service sont ceux qu'AWS facture : les fichiers AWS Price List sont fournis à titre informatif uniquement."
  options:
    a:
      en: "AWS Artifact provides AWS compliance reports and agreements, not service prices."
      fr: "AWS Artifact fournit les rapports de conformité et les accords d'AWS, pas les prix des services."
    b:
      en: "The Cost and Usage Report shows the costs of past usage in the company's accounts, not the prices of instance types the company has not used."
      fr: "Cost and Usage Report présente les coûts de l'utilisation passée des comptes de l'entreprise, pas les prix de types d'instances que l'entreprise n'a pas utilisés."
    c:
      en: "The AWS Health Dashboard reports events that affect AWS services and resources, not prices."
      fr: "AWS Health Dashboard signale les événements qui affectent les services et ressources AWS, pas les prix."
references:
  - title: Calling AWS services and prices using the AWS Price List
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/price-changes.html
