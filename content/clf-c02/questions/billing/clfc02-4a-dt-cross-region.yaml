id: clfc02-4a-dt-cross-region
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company copies 5 TB of data each month from Amazon EC2 instances in the US East (Ohio) Region to a disaster recovery site in another AWS Region.

    How is this data transfer charged?
  fr: |
    Une entreprise copie chaque mois 5 To de données depuis des instances Amazon EC2 de la Région USA Est (Ohio) vers un site de reprise après sinistre situé dans une autre Région AWS.

    Comment ce transfert de données est-il facturé ?
body:
  options:
    - { id: a, text: { en: "Only the data coming in to the destination Region is charged.", fr: "Seules les données entrant dans la Région de destination sont facturées." } }
    - { id: b, text: { en: "The data is charged twice at the same rate: out of the source and in to the destination.", fr: "Les données sont facturées deux fois au même tarif : à la sortie de la source et à l'entrée dans la destination." } }
    - { id: c, text: { en: "Only the data going out of the source Region is charged.", fr: "Seules les données sortant de la Région d'origine sont facturées." } }
    - { id: d, text: { en: "Nothing is charged, because the traffic stays on the AWS network.", fr: "Rien n'est facturé, car le trafic reste sur le réseau AWS." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A transfer between Regions produces two billing line items: data out of the source Region and data in to the destination Region. The inbound line item has no charge; the cost is the outbound transfer from the source Region, US East (Ohio) here."
    fr: "Un transfert entre Régions produit deux lignes de facturation : les données sortant de la Région d'origine et les données entrant dans la Région de destination. La ligne entrante n'est pas facturée ; le coût correspond au transfert sortant de la Région d'origine, ici USA Est (Ohio)."
  options:
    a:
      en: "Inbound data to the destination Region is the free line item; the charge is on the source side."
      fr: "Les données entrant dans la Région de destination constituent la ligne gratuite ; les frais sont du côté de la source."
    b:
      en: "Two line items appear, but only the outbound one is charged; the inbound one has no charge."
      fr: "Deux lignes apparaissent, mais seule la ligne sortante est facturée ; la ligne entrante est gratuite."
    d:
      en: "Traffic between Regions is charged even though it travels on the AWS network."
      fr: "Le trafic entre Régions est facturé même s'il circule sur le réseau AWS."
references:
  - title: Understanding data transfer charges
    url: https://docs.aws.amazon.com/cur/latest/userguide/cur-data-transfers-charges.html
