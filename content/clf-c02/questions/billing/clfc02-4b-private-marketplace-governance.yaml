id: clfc02-4b-private-marketplace-governance
objective: "4.3.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations. Its procurement team wants users in all accounts to subscribe only to AWS Marketplace products that the team has approved.

    What should the company use?
  fr: |
    Une entreprise utilise AWS Organizations. Son équipe achats souhaite que les utilisateurs de tous les comptes ne puissent s'abonner qu'aux produits AWS Marketplace qu'elle a approuvés.

    Que doit utiliser l'entreprise ?
body:
  options:
    - { id: a, text: { en: "A private offer from each seller", fr: "Une offre privée de chaque vendeur" } }
    - { id: b, text: { en: "A private marketplace", fr: "Une place de marché privée (private marketplace)" } }
    - { id: c, text: { en: "Cost allocation tags for AWS Marketplace", fr: "Des balises de répartition des coûts pour AWS Marketplace" } }
    - { id: d, text: { en: "An AWS Budgets budget for AWS Marketplace", fr: "Un budget AWS Budgets pour AWS Marketplace" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A private marketplace is a curated catalog of approved AWS Marketplace products. Once it is enabled, users can subscribe only to the products approved in their catalog, and administrators can govern it across the accounts of the organization."
    fr: "Une place de marché privée (private marketplace) est un catalogue organisé de produits AWS Marketplace approuvés. Une fois activée, les utilisateurs ne peuvent s'abonner qu'aux produits approuvés dans leur catalogue, et les administrateurs peuvent la gouverner dans tous les comptes de l'organisation."
  options:
    a:
      en: "A private offer gives custom pricing and terms for one product; it does not stop users from buying other products."
      fr: "Une offre privée donne un prix et des conditions personnalisés pour un produit ; elle n'empêche pas les utilisateurs d'acheter d'autres produits."
    c:
      en: "Cost allocation tags help report Marketplace spend; they do not control which products users can buy."
      fr: "Les balises de répartition des coûts aident à suivre les dépenses Marketplace ; elles ne contrôlent pas les produits que les utilisateurs peuvent acheter."
    d:
      en: "A budget sends alerts when spending crosses a threshold; it does not restrict purchases to approved products."
      fr: "Un budget envoie des alertes quand les dépenses dépassent un seuil ; il ne limite pas les achats aux produits approuvés."
references:
  - title: "AWS Marketplace: Private Marketplace"
    url: https://aws.amazon.com/marketplace/features/privatemarketplace
