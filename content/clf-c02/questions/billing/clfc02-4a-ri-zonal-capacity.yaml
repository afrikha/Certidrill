id: clfc02-4a-ri-zonal-capacity
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company commits to a 3-year Amazon EC2 discount for a steady workload. The commitment must also reserve capacity for the instances in one specific Availability Zone.

    Which option should the company buy?
  fr: |
    Une entreprise s'engage sur une remise Amazon EC2 de 3 ans pour une charge de travail stable. L'engagement doit aussi réserver de la capacité pour les instances dans une zone de disponibilité précise.

    Quelle option l'entreprise doit-elle acheter ?
body:
  options:
    - { id: a, text: { en: "A regional Reserved Instance", fr: "Une instance réservée régionale" } }
    - { id: b, text: { en: "A zonal Reserved Instance", fr: "Une instance réservée zonale" } }
    - { id: c, text: { en: "A Compute Savings Plan", fr: "Un Compute Savings Plan" } }
    - { id: d, text: { en: "An EC2 Instance Savings Plan", fr: "Un EC2 Instance Savings Plan" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A zonal Reserved Instance reserves capacity in the Availability Zone that is specified at purchase, and its discount applies only to usage in that zone. The scope, regional or zonal, does not change the price."
    fr: "Une instance réservée zonale réserve de la capacité dans la zone de disponibilité indiquée à l'achat, et sa remise ne s'applique qu'à l'utilisation dans cette zone. L'étendue, régionale ou zonale, ne change pas le prix."
  options:
    a:
      en: "A regional Reserved Instance applies its discount in any Availability Zone of the Region, but it does not reserve capacity."
      fr: "Une instance réservée régionale applique sa remise dans n'importe quelle zone de disponibilité de la Région, mais elle ne réserve pas de capacité."
    c:
      en: "A Compute Savings Plan is a spend commitment that applies across instance families and Regions; it does not reserve capacity."
      fr: "Un Compute Savings Plan est un engagement de dépense qui s'applique à toutes les familles d'instances et Régions ; il ne réserve pas de capacité."
    d:
      en: "An EC2 Instance Savings Plan is tied to an instance family in a Region, but it is a pricing commitment that reserves no capacity."
      fr: "Un EC2 Instance Savings Plan est lié à une famille d'instances dans une Région, mais c'est un engagement tarifaire qui ne réserve aucune capacité."
references:
  - title: Regional and zonal Reserved Instances (scope)
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html
  - title: Reserve compute capacity with EC2 On-Demand Capacity Reservations
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html
