id: clfc02-4a-price-list-api
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is building an internal cost-planning tool. The tool must programmatically retrieve the current prices of AWS services and products, by AWS Region.

    Which AWS offering should the tool use?
  fr: |
    Une entreprise développe un outil interne de planification des coûts. L'outil doit récupérer par programmation les prix actuels des services et produits AWS, par Région AWS.

    Quelle offre AWS l'outil doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "The AWS Cost Explorer API", fr: "L'API AWS Cost Explorer" } }
    - { id: b, text: { en: "The AWS Price List API", fr: "L'API AWS Price List" } }
    - { id: c, text: { en: "The AWS Cost and Usage Report", fr: "AWS Cost and Usage Report" } }
    - { id: d, text: { en: "The AWS Budgets API", fr: "L'API AWS Budgets" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The AWS Price List is a catalog of the products and prices of AWS services. Its Query API returns prices at the SKU level from product attributes, and its Bulk API provides price list files in JSON or CSV, organized by service and Region."
    fr: "AWS Price List est un catalogue des produits et des prix des services AWS. Son API Query renvoie des prix au niveau du SKU à partir des attributs des produits, et son API Bulk fournit des fichiers de liste de prix en JSON ou CSV, organisés par service et par Région."
  options:
    a:
      en: "The Cost Explorer API returns the actual cost and usage of the company's accounts, not the public price catalog, and each paginated request is charged."
      fr: "L'API Cost Explorer renvoie les coûts et l'utilisation réels des comptes de l'entreprise, pas le catalogue public des prix, et chaque requête paginée est facturée."
    c:
      en: "The Cost and Usage Report contains the detailed past usage and costs of the account, not the current prices of all products."
      fr: "Cost and Usage Report contient l'utilisation et les coûts détaillés passés du compte, pas les prix actuels de tous les produits."
    d:
      en: "The Budgets API manages budgets and alerts on the company's spend; it does not return service prices."
      fr: "L'API Budgets gère les budgets et les alertes sur les dépenses de l'entreprise ; elle ne renvoie pas les prix des services."
references:
  - title: Calling AWS services and prices using the AWS Price List
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/price-changes.html
