id: clfc02-4b-abuse-port-scan
objective: "4.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company notices port scans against its servers. The traffic comes from IP addresses that belong to AWS.

    To whom should the company report this activity?
  fr: |
    Une entreprise constate des analyses de ports contre ses serveurs. Le trafic provient d'adresses IP qui appartiennent à AWS.

    À qui l'entreprise doit-elle signaler cette activité ?
body:
  options:
    - { id: a, text: { en: "The AWS Professional Services team", fr: "L'équipe AWS Professional Services" } }
    - { id: b, text: { en: "The AWS Partner Network", fr: "L'AWS Partner Network" } }
    - { id: c, text: { en: "The AWS re:Post community", fr: "La communauté AWS re:Post" } }
    - { id: d, text: { en: "The AWS Trust & Safety team", fr: "L'équipe AWS Trust & Safety" } }
answer: { optionId: d }
explanation:
  correct:
    en: "The AWS Trust & Safety team handles reports of suspected abuse of AWS resources, such as port scanning, intrusion attempts, DDoS attacks, spam and objectionable content. It investigates the report and can ask for more information by email."
    fr: "L'équipe AWS Trust & Safety traite les signalements d'abus présumés des ressources AWS, comme les analyses de ports, les tentatives d'intrusion, les attaques DDoS, le spam et les contenus répréhensibles. Elle examine le signalement et peut demander des informations complémentaires par e-mail."
  options:
    a:
      en: "AWS Professional Services delivers consulting engagements; it does not investigate abuse reports."
      fr: "AWS Professional Services fournit des missions de conseil ; il n'examine pas les signalements d'abus."
    b:
      en: "The AWS Partner Network is a community of partner companies; it does not receive abuse reports."
      fr: "L'AWS Partner Network est une communauté d'entreprises partenaires ; il ne reçoit pas les signalements d'abus."
    c:
      en: "re:Post is a public question-and-answer community; AWS does not investigate abuse reported there."
      fr: "re:Post est une communauté publique de questions-réponses ; AWS n'y examine pas les abus signalés."
references:
  - title: How do I report abuse of AWS resources?
    url: https://repost.aws/knowledge-center/report-aws-abuse
