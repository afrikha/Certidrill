id: clfc02-4a-s3-intelligent-tiering-fees
objective: "4.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores millions of large objects in Amazon S3. It cannot predict which objects will be read and wants to avoid paying retrieval fees when an object is read again.

    Which storage class meets this requirement, and what additional charge does it have?
  fr: |
    Une entreprise stocke des millions d'objets volumineux dans Amazon S3. Elle ne peut pas prévoir quels objets seront lus et veut éviter de payer des frais de récupération lorsqu'un objet est relu.

    Quelle classe de stockage répond à cette exigence, et quels frais supplémentaires comporte-t-elle ?
body:
  options:
    - { id: a, text: { en: "S3 Standard-IA, with a per-GB retrieval fee and a 30-day minimum storage charge", fr: "S3 Standard-IA, avec des frais de récupération par Go et une facturation minimale de 30 jours" } }
    - { id: b, text: { en: "S3 Intelligent-Tiering, with a monthly per-object monitoring and automation fee", fr: "S3 Intelligent-Tiering, avec des frais mensuels de surveillance et d'automatisation par objet" } }
    - { id: c, text: { en: "S3 Glacier Instant Retrieval, with a 90-day minimum storage charge", fr: "S3 Glacier Instant Retrieval, avec une facturation minimale de 90 jours de stockage" } }
    - { id: d, text: { en: "S3 One Zone-IA, with a 30-day minimum storage charge", fr: "S3 One Zone-IA, avec une facturation minimale de 30 jours de stockage" } }
answer: { optionId: b }
explanation:
  correct:
    en: "S3 Intelligent-Tiering moves objects between access tiers automatically based on access, and it has no retrieval fees. In exchange, it charges a small monthly monitoring and automation fee for each object."
    fr: "S3 Intelligent-Tiering déplace automatiquement les objets entre niveaux d'accès selon leur utilisation, et ne comporte pas de frais de récupération. En contrepartie, elle facture de faibles frais mensuels de surveillance et d'automatisation pour chaque objet."
  options:
    a:
      en: "S3 Standard-IA charges a per-GB fee each time data is retrieved, which the company wants to avoid."
      fr: "S3 Standard-IA facture des frais par Go à chaque récupération de données, ce que l'entreprise veut éviter."
    c:
      en: "S3 Glacier Instant Retrieval also charges a per-GB retrieval fee, in addition to its 90-day minimum storage duration."
      fr: "S3 Glacier Instant Retrieval facture aussi des frais de récupération par Go, en plus de sa durée de stockage minimale de 90 jours."
    d:
      en: "S3 One Zone-IA charges a per-GB retrieval fee and stores data in a single Availability Zone."
      fr: "S3 One Zone-IA facture des frais de récupération par Go et stocke les données dans une seule zone de disponibilité."
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
