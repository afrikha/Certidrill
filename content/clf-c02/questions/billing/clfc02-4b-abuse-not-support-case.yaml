id: clfc02-4b-abuse-not-support-case
objective: "4.3.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has AWS Enterprise Support. Its website receives DDoS traffic from Amazon EC2 instances that belong to another AWS customer. The company wants AWS to investigate those instances.

    What should the company do?
  fr: |
    Une entreprise dispose d'AWS Enterprise Support. Son site web reçoit du trafic DDoS provenant d'instances Amazon EC2 qui appartiennent à un autre client AWS. L'entreprise souhaite qu'AWS examine ces instances.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Open a technical case in the AWS Support Center.", fr: "Ouvrir un cas technique dans le centre de support AWS (AWS Support Center)." } }
    - { id: b, text: { en: "Report the traffic to the AWS Trust & Safety team.", fr: "Signaler le trafic à l'équipe AWS Trust & Safety." } }
    - { id: c, text: { en: "Turn on Amazon GuardDuty to stop the other instances.", fr: "Activer Amazon GuardDuty pour arrêter les autres instances." } }
    - { id: d, text: { en: "Ask the technical account manager to stop the instances.", fr: "Demander au gestionnaire de compte technique d'arrêter les instances." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Abuse of AWS resources, including DDoS traffic from another customer's instances, is reported to the AWS Trust & Safety team, whatever the Support plan. AWS Support cannot assist with abuse reports. Trust & Safety investigates and contacts the customer that controls the resources."
    fr: "Les abus des ressources AWS, y compris le trafic DDoS issu des instances d'un autre client, se signalent à l'équipe AWS Trust & Safety, quel que soit le plan de support. AWS Support ne peut pas traiter les signalements d'abus. Trust & Safety mène l'enquête et contacte le client qui contrôle les ressources."
  options:
    a:
      en: "AWS Support cannot assist with abuse reports, even with Enterprise Support."
      fr: "AWS Support ne peut pas traiter les signalements d'abus, même avec Enterprise Support."
    c:
      en: "GuardDuty detects threats in the company's own accounts; it cannot stop resources in another customer's account."
      fr: "GuardDuty détecte les menaces dans les propres comptes de l'entreprise ; il ne peut pas arrêter les ressources du compte d'un autre client."
    d:
      en: "A TAM is part of AWS Support and cannot act on another customer's resources; abuse goes to Trust & Safety."
      fr: "Un TAM fait partie d'AWS Support et ne peut pas agir sur les ressources d'un autre client ; les abus relèvent de Trust & Safety."
references:
  - title: How do I report abuse of AWS resources?
    url: https://repost.aws/knowledge-center/report-aws-abuse
