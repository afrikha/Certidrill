id: clfc02-4b-tag-aws-generated
objective: "4.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants a cost allocation tag that AWS defines and applies automatically to record who created each resource.

    Which type of tag meets this requirement?
  fr: |
    Une entreprise souhaite une balise de répartition des coûts qu'AWS définit et applique automatiquement pour indiquer qui a créé chaque ressource.

    Quel type de balise répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "A user-defined cost allocation tag", fr: "Une balise de répartition des coûts définie par l'utilisateur" } }
    - { id: b, text: { en: "An AWS-generated cost allocation tag", fr: "Une balise de répartition des coûts générée par AWS" } }
    - { id: c, text: { en: "A tag policy in AWS Organizations", fr: "Une politique de balises dans AWS Organizations" } }
    - { id: d, text: { en: "An AWS Cost Categories rule", fr: "Une règle AWS Cost Categories" } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS-generated cost allocation tags are defined, created and applied by AWS. The createdBy tag (key aws:createdBy) records the account, user or role that created a supported resource. Like every cost allocation tag, it must be activated before it appears in billing reports."
    fr: "Les balises de répartition des coûts générées par AWS sont définies, créées et appliquées par AWS. La balise createdBy (clé aws:createdBy) indique le compte, l'utilisateur ou le rôle qui a créé une ressource prise en charge. Comme toute balise de répartition des coûts, elle doit être activée avant d'apparaître dans les rapports de facturation."
  options:
    a:
      en: "User-defined tags are created and applied by the customer, for example a cost center or a project; AWS does not apply them."
      fr: "Les balises définies par l'utilisateur sont créées et appliquées par le client, par exemple un centre de coûts ou un projet ; AWS ne les applique pas."
    c:
      en: "A tag policy standardizes the tag keys and values that accounts use; it does not create tags or record who created a resource."
      fr: "Une politique de balises normalise les clés et valeurs de balises utilisées par les comptes ; elle ne crée pas de balise et n'indique pas qui a créé une ressource."
    d:
      en: "Cost Categories group costs with rules that you write; they are not tags that AWS applies to resources."
      fr: "Les Cost Categories regroupent les coûts selon des règles que vous écrivez ; ce ne sont pas des balises qu'AWS applique aux ressources."
references:
  - title: Using AWS-generated tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/aws-tags.html
  - title: Organizing and tracking costs using AWS cost allocation tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html
