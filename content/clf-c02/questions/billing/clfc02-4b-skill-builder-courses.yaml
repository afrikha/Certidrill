id: clfc02-4b-skill-builder-courses
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new employee wants free, self-paced digital courses from AWS to learn about AWS services.

    Which AWS resource meets this requirement?
  fr: |
    Un nouvel employé souhaite suivre gratuitement, à son rythme, des cours numériques d'AWS pour découvrir les services AWS.

    Quelle ressource AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "AWS re:Post" }
    - { id: b, text: "AWS Skill Builder" }
    - { id: c, text: "AWS Marketplace" }
    - { id: d, text: "AWS Professional Services" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Skill Builder is the AWS online learning center. It offers hundreds of free self-paced digital courses, and a paid subscription adds resources such as digital classrooms and the full set of exam preparation material."
    fr: "AWS Skill Builder est le centre de formation en ligne d'AWS. Il propose des centaines de cours numériques gratuits à suivre à son rythme, et un abonnement payant ajoute des ressources comme les classes numériques et l'ensemble du matériel de préparation aux examens."
  options:
    a:
      en: "re:Post is a community question-and-answer service, not a catalog of training courses."
      fr: "re:Post est un service communautaire de questions-réponses, pas un catalogue de cours de formation."
    c:
      en: "AWS Marketplace sells third-party software, data and services; it is not the AWS training platform."
      fr: "AWS Marketplace vend des logiciels, des données et des services tiers ; ce n'est pas la plateforme de formation d'AWS."
    d:
      en: "Professional Services delivers paid consulting engagements, not free self-paced courses."
      fr: "Professional Services fournit des missions de conseil payantes, pas des cours gratuits à suivre à son rythme."
references:
  - title: Learn AWS online with AWS Skill Builder
    url: https://aws.amazon.com/training/digital/
