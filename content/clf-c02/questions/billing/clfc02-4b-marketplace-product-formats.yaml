id: clfc02-4b-marketplace-product-formats
objective: "4.3.10"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two types of products can independent software vendors offer in AWS Marketplace? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux types de produits que les fournisseurs indépendants de logiciels (ISV) peuvent proposer dans AWS Marketplace ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "AWS compliance reports", fr: "Des rapports de conformité AWS" } }
    - { id: b, text: { en: "Amazon Machine Images (AMIs)", fr: "Des Amazon Machine Images (AMI)" } }
    - { id: c, text: { en: "AWS Support plans", fr: "Des plans AWS Support" } }
    - { id: d, text: { en: "AWS Trusted Advisor checks", fr: "Des vérifications AWS Trusted Advisor" } }
    - { id: e, text: { en: "Software as a service (SaaS) subscriptions", fr: "Des abonnements de logiciel en tant que service (SaaS)" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Sellers deliver their AWS Marketplace products in several formats, including AMIs, SaaS, AWS CloudFormation templates and AWS WAF rule sets. Buyers subscribe in the catalog, and AWS bills them on their AWS bill and pays the seller."
    fr: "Les vendeurs livrent leurs produits AWS Marketplace sous plusieurs formats, dont les AMI, le SaaS, les modèles AWS CloudFormation et les ensembles de règles AWS WAF. Les acheteurs s'abonnent dans le catalogue, et AWS les facture sur leur facture AWS puis paie le vendeur."
  options:
    a:
      en: "AWS compliance reports are provided by AWS in AWS Artifact, not sold by vendors."
      fr: "Les rapports de conformité AWS sont fournis par AWS dans AWS Artifact, pas vendus par des éditeurs."
    c:
      en: "AWS Support plans are sold by AWS, not listed by independent software vendors in AWS Marketplace."
      fr: "Les plans AWS Support sont vendus par AWS, pas publiés par des ISV dans AWS Marketplace."
    d:
      en: "Trusted Advisor checks are part of an AWS service; vendors do not sell them in AWS Marketplace."
      fr: "Les vérifications Trusted Advisor font partie d'un service AWS ; les éditeurs ne les vendent pas dans AWS Marketplace."
references:
  - title: What is AWS Marketplace?
    url: https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html
