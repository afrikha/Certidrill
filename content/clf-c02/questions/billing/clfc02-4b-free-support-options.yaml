id: clfc02-4b-free-support-options
objective: "4.3.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two AWS Support options are available to all AWS customers at no additional cost? (Choose two.)
  fr: |
    Quelles sont les deux options d'AWS Support accessibles à tous les clients AWS sans frais supplémentaires ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A designated technical account manager", fr: "Un gestionnaire de compte technique désigné" } }
    - { id: b, text: { en: "One-on-one answers to account and billing questions", fr: "Des réponses individuelles aux questions de compte et de facturation" } }
    - { id: c, text: { en: "Technical cases handled by Cloud Support Engineers", fr: "Des cas techniques traités par des Cloud Support Engineers" } }
    - { id: d, text: { en: "Programmatic access to the AWS Health API", fr: "Un accès programmatique à l'API AWS Health" } }
    - { id: e, text: { en: "The AWS re:Post community questions and answers", fr: "Les questions et réponses de la communauté AWS re:Post" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Every AWS customer has Basic Support, which includes 24/7 customer service for account and billing questions and access to the communities, such as AWS re:Post. Technical support from engineers, the AWS Health API and a TAM require a paid plan."
    fr: "Tous les clients AWS disposent de Basic Support, qui inclut le service clientèle 24 h/24, 7 j/7 pour les questions de compte et de facturation et l'accès aux communautés, comme AWS re:Post. Le support technique par des ingénieurs, l'API AWS Health et un TAM nécessitent un plan payant."
  options:
    a:
      en: "A designated TAM is included only with AWS Enterprise Support and AWS Unified Operations."
      fr: "Un TAM désigné n'est inclus qu'avec AWS Enterprise Support et AWS Unified Operations."
    c:
      en: "Basic Support customers cannot open technical support cases; this starts with AWS Business Support+."
      fr: "Les clients Basic Support ne peuvent pas ouvrir de cas de support technique ; cela commence avec AWS Business Support+."
    d:
      en: "The AWS Health API requires Business Support+, Enterprise Support or Unified Operations. The AWS Health Dashboard, not the API, is free for everyone."
      fr: "L'API AWS Health nécessite Business Support+, Enterprise Support ou Unified Operations. C'est AWS Health Dashboard, et non l'API, qui est gratuit pour tous."
references:
  - title: AWS Support plans
    url: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
