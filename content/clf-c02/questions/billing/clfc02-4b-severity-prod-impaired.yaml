id: clfc02-4b-severity-prod-impaired
objective: "4.3.4"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A company has AWS Business Support+. The checkout function of its production web application is degraded: it responds slowly, but customers can still place orders. An engineer opens a technical case in the AWS Support Center.

    Which severity should the engineer choose?
  fr: |
    Une entreprise dispose d'AWS Business Support+. La fonction de paiement de son application web de production est dégradée : elle répond lentement, mais les clients peuvent toujours passer commande. Un ingénieur ouvre un cas technique dans le centre de support AWS (AWS Support Center).

    Quelle gravité l'ingénieur doit-il choisir ?
body:
  options:
    - { id: a, text: "System impaired" }
    - { id: b, text: "Production system impaired" }
    - { id: c, text: "Production system down" }
    - { id: d, text: "Business-critical system down" }
answer: { optionId: b }
explanation:
  correct:
    en: "Production system impaired applies when important functions of an application are impaired or degraded but still available; its first-response time is 4 hours. The severity should match the real impact: the two \"down\" levels are for functions that are not available."
    fr: "La gravité Production system impaired s'applique quand des fonctions importantes d'une application sont altérées ou dégradées, mais toujours disponibles ; son délai de première réponse est de 4 heures. La gravité doit correspondre à l'impact réel : les deux niveaux « down » concernent des fonctions indisponibles."
  options:
    a:
      en: "System impaired (12 hours) is for non-critical functions that behave abnormally; checkout is an important function."
      fr: "System impaired (12 heures) concerne des fonctions non critiques au comportement anormal ; le paiement est une fonction importante."
    c:
      en: "Production system down (1 hour) is for important functions that are not available; customers can still place orders."
      fr: "Production system down (1 heure) concerne des fonctions importantes indisponibles ; les clients peuvent toujours passer commande."
    d:
      en: "Business-critical system down is the highest severity, used when critical functions are not available and the business is at risk."
      fr: "Business-critical system down est la gravité la plus élevée, utilisée quand des fonctions critiques sont indisponibles et que l'activité est menacée."
references:
  - title: Case management
    url: https://docs.aws.amazon.com/awssupport/latest/user/case-management.html
