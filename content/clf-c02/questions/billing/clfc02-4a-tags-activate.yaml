id: clfc02-4a-tags-activate
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company added a user-defined tag named CostCenter to all its resources. The tag does not appear as a filter for costs in AWS Cost Explorer.

    What must the company do?
  fr: |
    Une entreprise a ajouté une balise définie par l'utilisateur nommée CostCenter à toutes ses ressources. La balise n'apparaît pas comme filtre des coûts dans AWS Cost Explorer.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Activate the tag as a cost allocation tag in the Billing console.", fr: "Activer la balise comme balise de répartition des coûts dans la console de facturation." } }
    - { id: b, text: { en: "Add the aws: prefix to the tag key so that AWS recognizes it for billing.", fr: "Ajouter le préfixe aws: à la clé de la balise pour qu'AWS la reconnaisse pour la facturation." } }
    - { id: c, text: { en: "Create an AWS Budgets budget that filters on the CostCenter tag.", fr: "Créer un budget AWS Budgets filtré sur la balise CostCenter." } }
    - { id: d, text: { en: "Attach a service control policy (SCP) that requires the CostCenter tag.", fr: "Attacher une politique de contrôle des services (SCP) qui exige la balise CostCenter." } }
answer: { optionId: a }
explanation:
  correct:
    en: "User-defined tags and AWS-generated tags must each be activated as cost allocation tags before they appear in Cost Explorer or in a cost allocation report. In an organization, only the management account can activate them, and a newly activated tag can take up to 24 hours to appear."
    fr: "Les balises définies par l'utilisateur et les balises générées par AWS doivent chacune être activées comme balises de répartition des coûts avant d'apparaître dans Cost Explorer ou dans un rapport de répartition des coûts. Dans une organisation, seul le compte de gestion peut les activer, et une balise nouvellement activée peut mettre jusqu'à 24 heures pour apparaître."
  options:
    b:
      en: "The aws: prefix is reserved for tags that AWS generates; customers cannot use it for their own tags."
      fr: "Le préfixe aws: est réservé aux balises générées par AWS ; les clients ne peuvent pas l'utiliser pour leurs propres balises."
    c:
      en: "A budget tracks spend against a threshold; creating one does not make an inactive tag available for cost reporting."
      fr: "Un budget suit les dépenses par rapport à un seuil ; en créer un ne rend pas disponible pour les rapports de coûts une balise non activée."
    d:
      en: "An SCP can enforce tagging rules on new resources, but the existing tag still has to be activated to appear in Cost Explorer."
      fr: "Une SCP peut imposer des règles de balisage sur les nouvelles ressources, mais la balise existante doit quand même être activée pour apparaître dans Cost Explorer."
references:
  - title: Organizing and tracking costs using AWS cost allocation tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html
