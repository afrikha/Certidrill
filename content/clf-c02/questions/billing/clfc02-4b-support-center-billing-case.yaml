id: clfc02-4b-support-center-billing-case
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has Basic Support. It sees an unexpected charge on its AWS bill and wants a one-on-one answer from AWS.

    What should the company do?
  fr: |
    Une entreprise dispose de Basic Support. Elle constate des frais inattendus sur sa facture AWS et souhaite une réponse individuelle d'AWS.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Download a compliance report from AWS Artifact.", fr: "Télécharger un rapport de conformité depuis AWS Artifact." } }
    - { id: b, text: { en: "Open an account and billing case in the AWS Support Center.", fr: "Ouvrir un cas de compte et de facturation dans le centre de support AWS (AWS Support Center)." } }
    - { id: c, text: { en: "Upgrade to Business Support+ and open a technical case.", fr: "Passer à Business Support+ et ouvrir un cas technique." } }
    - { id: d, text: { en: "Check the Service health page of the AWS Health Dashboard.", fr: "Consulter la page Service health d'AWS Health Dashboard." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Account and billing cases are available to all AWS customers, including those with Basic Support. The company opens the case in the AWS Support Center and receives a one-on-one answer at no additional cost."
    fr: "Les cas de compte et de facturation sont accessibles à tous les clients AWS, y compris ceux qui ont Basic Support. L'entreprise ouvre le cas dans le centre de support AWS (AWS Support Center) et reçoit une réponse individuelle sans frais supplémentaires."
  options:
    a:
      en: "AWS Artifact provides AWS compliance reports and agreements; it does not answer billing questions."
      fr: "AWS Artifact fournit les rapports de conformité et les accords d'AWS ; il ne répond pas aux questions de facturation."
    c:
      en: "No upgrade is needed: billing questions are account and billing cases, which every plan includes."
      fr: "Aucune mise à niveau n'est nécessaire : les questions de facturation sont des cas de compte et de facturation, inclus dans tous les plans."
    d:
      en: "The Service health page shows public events about AWS services; it does not explain charges on a bill."
      fr: "La page Service health affiche les événements publics des services AWS ; elle n'explique pas les frais d'une facture."
references:
  - title: Case management
    url: https://docs.aws.amazon.com/awssupport/latest/user/case-management.html
