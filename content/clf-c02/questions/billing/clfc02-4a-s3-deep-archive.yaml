id: clfc02-4a-s3-deep-archive
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company must keep financial records for 10 years. The records are read less than once a year, and a retrieval time of several hours is acceptable.

    Which Amazon S3 storage class offers the LOWEST storage cost for these records?
  fr: |
    Une entreprise doit conserver des documents financiers pendant 10 ans. Les documents sont lus moins d'une fois par an et un délai de récupération de plusieurs heures est acceptable.

    Quelle classe de stockage Amazon S3 offre le coût de stockage le PLUS BAS pour ces documents ?
body:
  options:
    - { id: a, text: "S3 Glacier Instant Retrieval" }
    - { id: b, text: "S3 Glacier Deep Archive" }
    - { id: c, text: "S3 Intelligent-Tiering" }
    - { id: d, text: "S3 Standard-IA" }
answer: { optionId: b }
explanation:
  correct:
    en: "S3 Glacier Deep Archive is the lowest-cost S3 storage class, designed for archive data accessed less than once a year. Objects must be restored before they can be read, and the restore takes hours, which the company accepts."
    fr: "S3 Glacier Deep Archive est la classe de stockage S3 la moins chère, conçue pour des archives consultées moins d'une fois par an. Les objets doivent être restaurés avant d'être lus, et la restauration prend des heures, ce que l'entreprise accepte."
  options:
    a:
      en: "S3 Glacier Instant Retrieval gives millisecond access to archives read about once a quarter; that speed is not needed and costs more than Deep Archive."
      fr: "S3 Glacier Instant Retrieval donne un accès en millisecondes à des archives lues environ une fois par trimestre ; cette rapidité est inutile et coûte plus cher que Deep Archive."
    c:
      en: "S3 Intelligent-Tiering is for unknown or changing access patterns; the access pattern here is known, and the class adds a per-object monitoring fee."
      fr: "S3 Intelligent-Tiering est destinée aux modèles d'accès inconnus ou changeants ; ici le modèle d'accès est connu, et la classe ajoute des frais de surveillance par objet."
    d:
      en: "S3 Standard-IA is for data accessed about once a month with millisecond access; its storage price is much higher than an archive class."
      fr: "S3 Standard-IA est destinée aux données consultées environ une fois par mois avec un accès en millisecondes ; son prix de stockage est bien plus élevé que celui d'une classe d'archivage."
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
