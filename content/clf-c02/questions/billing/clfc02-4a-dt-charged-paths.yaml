id: clfc02-4a-dt-charged-paths
objective: "4.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in one AWS Region.

    Which two data transfers will incur data transfer charges? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une application web sur des instances Amazon EC2 dans une Région AWS.

    Quels sont les deux transferts de données qui entraîneront des frais de transfert de données ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Uploads from customers on the internet to the instances", fr: "Les chargements des clients sur Internet vers les instances" } }
    - { id: b, text: { en: "Web pages sent from the instances to customers on the internet", fr: "Les pages web envoyées par les instances aux clients sur Internet" } }
    - { id: c, text: { en: "Traffic between instances in the same Availability Zone over private IP addresses", fr: "Le trafic entre instances d'une même zone de disponibilité via des adresses IP privées" } }
    - { id: d, text: { en: "Traffic between instances in two Availability Zones of the Region", fr: "Le trafic entre instances de deux zones de disponibilité de la Région" } }
    - { id: e, text: { en: "Files that administrators upload from the corporate network over the internet", fr: "Les fichiers que les administrateurs chargent depuis le réseau de l'entreprise via Internet" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Data transfer out of AWS to the internet is charged per GB, and traffic that crosses an Availability Zone boundary within a Region is charged in both directions. Data that comes in from the internet and traffic that stays in one Availability Zone over private IP addresses are not charged."
    fr: "Le transfert de données sortant d'AWS vers Internet est facturé par Go, et le trafic qui franchit la limite d'une zone de disponibilité au sein d'une Région est facturé dans les deux sens. Les données entrant depuis Internet et le trafic qui reste dans une zone de disponibilité via des adresses IP privées ne sont pas facturés."
  options:
    a:
      en: "Data transfer from the internet into AWS has no charge."
      fr: "Le transfert de données d'Internet vers AWS n'est pas facturé."
    c:
      en: "Data transfer within the same Availability Zone over private IP addresses is free."
      fr: "Le transfert de données au sein d'une même zone de disponibilité via des adresses IP privées est gratuit."
    e:
      en: "These uploads are inbound data transfer from the internet, which has no charge."
      fr: "Ces chargements sont un transfert de données entrant depuis Internet, qui n'est pas facturé."
references:
  - title: Understanding data transfer charges
    url: https://docs.aws.amazon.com/cur/latest/userguide/cur-data-transfers-charges.html
  - title: Key principles
    url: https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/key-principles.html
