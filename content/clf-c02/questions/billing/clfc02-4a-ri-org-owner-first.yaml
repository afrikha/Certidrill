id: clfc02-4a-ri-org-owner-first
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In an organization in AWS Organizations, account A owns one Amazon EC2 Reserved Instance. During the same hour, account A and account B each run one instance that matches the reservation. Discount sharing is active for both accounts.

    Which instance receives the Reserved Instance discount for that hour?
  fr: |
    Dans une organisation AWS Organizations, le compte A possède une instance réservée Amazon EC2. Pendant la même heure, le compte A et le compte B exécutent chacun une instance qui correspond à la réservation. Le partage des remises est activé pour les deux comptes.

    Quelle instance bénéficie de la remise de l'instance réservée pour cette heure ?
body:
  options:
    - { id: a, text: { en: "The instance in account A, because commitments apply first to the account that owns them", fr: "L'instance du compte A, car les engagements s'appliquent d'abord au compte qui les possède" } }
    - { id: b, text: { en: "The instance in account B, because shared discounts go first to the other accounts", fr: "L'instance du compte B, car les remises partagées vont d'abord aux autres comptes" } }
    - { id: c, text: { en: "The instance that was launched first, whichever account runs it", fr: "L'instance lancée en premier, quel que soit le compte qui l'exécute" } }
    - { id: d, text: { en: "Both instances, each with half of the discount", fr: "Les deux instances, chacune avec la moitié de la remise" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Reserved Instances and Savings Plans apply first to the account that owns them. Only the remaining, unused benefit is shared with the other accounts that have sharing activated, so account B pays On-Demand rates for that hour."
    fr: "Les instances réservées et les Savings Plans s'appliquent d'abord au compte qui les possède. Seul l'avantage restant, inutilisé, est partagé avec les autres comptes dont le partage est activé : le compte B paie le tarif On-Demand pour cette heure."
  options:
    b:
      en: "Sharing only distributes the benefit that the owning account does not use; the owner is served first."
      fr: "Le partage ne distribue que l'avantage que le compte propriétaire n'utilise pas ; le propriétaire est servi en premier."
    c:
      en: "The launch order of instances does not decide which account receives the discount; ownership of the reservation does."
      fr: "L'ordre de lancement des instances ne décide pas du compte qui reçoit la remise ; c'est la propriété de la réservation qui en décide."
    d:
      en: "One Reserved Instance covers one matching instance-hour; the discount is not split between the two accounts."
      fr: "Une instance réservée couvre une heure d'instance correspondante ; la remise n'est pas répartie entre les deux comptes."
references:
  - title: Reserved Instances and Savings Plans discount sharing
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ri-turn-off.html
