id: clfc02-1c-onprem-peak-idle
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company buys enough on-premises servers to handle its busiest week of the year. For the rest of the year, the servers run at about 20% of their capacity.

    Which cost does this approach create?
  fr: |
    Une entreprise de vente au détail achète suffisamment de serveurs sur site pour absorber la semaine la plus chargée de l'année. Le reste de l'année, les serveurs fonctionnent à environ 20 % de leur capacité.

    Quel coût cette approche entraîne-t-elle ?
body:
  options:
    - id: a
      text: { en: "Lost sales because the servers cannot handle the busiest week", fr: "Des ventes perdues, car les serveurs ne peuvent pas absorber la semaine la plus chargée" }
    - id: b
      text: { en: "Hourly charges that stop when the servers are turned off", fr: "Des frais horaires qui s'arrêtent lorsque les serveurs sont éteints" }
    - id: c
      text: { en: "Capacity that is paid for in advance but stays idle most of the year", fr: "Une capacité payée à l'avance, mais inutilisée la majeure partie de l'année" }
    - id: d
      text: { en: "Higher prices for each server during the busiest week", fr: "Un prix plus élevé pour chaque serveur pendant la semaine la plus chargée" }
answer: { optionId: c }
explanation:
  correct:
    en: "When a company makes its capacity decision before it knows its real usage, it often ends up paying for expensive idle resources. Sizing owned servers for a yearly peak means that most of the purchased capacity sits unused for the rest of the year."
    fr: "Lorsqu'une entreprise décide de sa capacité avant de connaître son utilisation réelle, elle finit souvent par payer des ressources coûteuses et inutilisées. Dimensionner des serveurs achetés pour un pic annuel signifie que la majeure partie de la capacité achetée reste inutilisée le reste de l'année."
  options:
    a:
      en: "The servers were sized for the busiest week, so capacity is not the problem here; the problem is the unused capacity."
      fr: "Les serveurs ont été dimensionnés pour la semaine la plus chargée : la capacité n'est pas le problème ici, c'est la capacité inutilisée qui l'est."
    b:
      en: "Hourly charges that stop when resources are turned off describe the cloud consumption model, not owned servers."
      fr: "Des frais horaires qui s'arrêtent lorsque les ressources sont éteintes décrivent le modèle de consommation du cloud, pas des serveurs achetés."
    d:
      en: "The company already owns the servers; their price does not change with the season."
      fr: "L'entreprise possède déjà les serveurs : leur prix ne varie pas selon la saison."
references:
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
