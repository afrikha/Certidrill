id: clfc02-1b-baseline-commit-spikes
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's application has a steady baseline load around the clock and unpredictable spikes a few days each month. The company wants the lowest cost without paying for spike capacity when it is not needed.

    Which approach meets these requirements?
  fr: |
    L'application d'une entreprise a une charge de base stable 24 heures sur 24 et des pics imprévisibles quelques jours par mois. L'entreprise veut le coût le plus bas sans payer la capacité des pics lorsqu'elle n'est pas nécessaire.

    Quelle approche répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Cover both the baseline and the spikes with a 3-year Savings Plans commitment.", fr: "Couvrir la charge de base et les pics avec un engagement Savings Plans sur 3 ans." }
    - id: b
      text: { en: "Run everything with On-Demand pricing so that all costs stay variable.", fr: "Tout exécuter au tarif On-Demand pour que tous les coûts restent variables." }
    - id: c
      text: { en: "Cover the baseline with a Savings Plans commitment and run the spikes On-Demand.", fr: "Couvrir la charge de base avec un engagement Savings Plans et exécuter les pics en On-Demand." }
    - id: d
      text: { en: "Buy on-premises servers for the baseline and use AWS only for the spikes.", fr: "Acheter des serveurs sur site pour la charge de base et utiliser AWS seulement pour les pics." }
answer: { optionId: c }
explanation:
  correct:
    en: "A Savings Plans commitment turns part of the spending into a fixed hourly commitment for 1 or 3 years in exchange for lower prices, which suits the predictable baseline. Keeping the unpredictable spikes On-Demand keeps that part variable, so the company pays for spike capacity only when it runs."
    fr: "Un engagement Savings Plans transforme une partie des dépenses en un engagement horaire fixe sur 1 ou 3 ans en échange de prix plus bas, ce qui convient à la charge de base prévisible. Garder les pics imprévisibles en On-Demand maintient cette part variable : l'entreprise ne paie la capacité des pics que lorsqu'elle s'exécute."
  options:
    a:
      en: "Committing for the spike capacity means paying for it every hour of the term, even when there is no spike."
      fr: "S'engager pour la capacité des pics revient à la payer chaque heure de la durée, même en l'absence de pic."
    b:
      en: "On-Demand for the steady baseline misses the lower prices available in exchange for a commitment."
      fr: "Le tarif On-Demand pour la charge de base stable renonce aux prix plus bas offerts en échange d'un engagement."
    d:
      en: "Buying servers adds fixed upfront costs and data center operations, which does not give the lowest cost."
      fr: "Acheter des serveurs ajoute des coûts fixes initiaux et l'exploitation d'un centre de données, ce qui ne donne pas le coût le plus bas."
references:
  - title: "What are Savings Plans?"
    url: https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html
  - title: "AWS Product and Service Pricing"
    url: https://aws.amazon.com/pricing/
