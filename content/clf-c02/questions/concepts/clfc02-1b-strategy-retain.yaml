id: clfc02-1b-strategy-retain
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company is planning its migration. One application controls machines on the factory floor and depends on hardware that has no cloud equivalent.

    Which migration strategy should the company apply to this application for now?
  fr: |
    Une entreprise industrielle planifie sa migration. Une application pilote les machines de l'atelier de production et dépend d'un matériel qui n'a pas d'équivalent dans le cloud.

    Quelle stratégie de migration l'entreprise doit-elle appliquer à cette application pour l'instant ?
body:
  options:
    - id: a
      text: { en: "Retire", fr: "Retirer (Retire)" }
    - id: b
      text: { en: "Retain", fr: "Conserver (Retain)" }
    - id: c
      text: { en: "Repurchase", fr: "Racheter (Repurchase)" }
    - id: d
      text: { en: "Rehost", fr: "Réhéberger (Rehost)" }
answer: { optionId: b }
explanation:
  correct:
    en: "Retain keeps an application in the source environment because it is not ready to migrate or may be migrated later. Dependence on hardware with no cloud equivalent, such as manufacturing plant machines, is one of the reasons to retain an application."
    fr: "La conservation (Retain) garde une application dans l'environnement source, parce qu'elle n'est pas prête à migrer ou qu'elle pourra l'être plus tard. La dépendance à un matériel sans équivalent dans le cloud, comme les machines d'une usine, est l'une des raisons de conserver une application."
  options:
    a:
      en: "Retire shuts down the application, but the factory still needs it to control its machines."
      fr: "Le retrait (Retire) arrête l'application, alors que l'usine en a toujours besoin pour piloter ses machines."
    c:
      en: "Repurchase replaces the application with another product, which does not remove its dependency on local hardware."
      fr: "Le rachat (Repurchase) remplace l'application par un autre produit, ce qui ne supprime pas sa dépendance au matériel local."
    d:
      en: "Rehost would move the application away from the hardware that it depends on."
      fr: "Le réhébergement (Rehost) éloignerait l'application du matériel dont elle dépend."
references:
  - title: "About the migration strategies"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
