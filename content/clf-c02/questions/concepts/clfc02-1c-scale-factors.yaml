id: clfc02-1c-scale-factors
objective: "1.4.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants to understand why AWS can offer lower prices than the company could achieve in its own data centers.

    Which factors allow AWS to achieve economies of scale? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise souhaite comprendre pourquoi AWS peut proposer des prix plus bas que ceux qu'elle obtiendrait dans ses propres centres de données.

    Quels facteurs permettent à AWS de réaliser des économies d'échelle ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "AWS aggregates the usage of hundreds of thousands of customers.", fr: "AWS regroupe l'utilisation de centaines de milliers de clients." }
    - id: b
      text: { en: "AWS builds a separate data center for each large customer.", fr: "AWS construit un centre de données distinct pour chaque grand client." }
    - id: c
      text: { en: "AWS requires every customer to sign a long-term contract.", fr: "AWS exige que chaque client signe un contrat à long terme." }
    - id: d
      text: { en: "AWS buys and operates infrastructure in very large volumes.", fr: "AWS achète et exploite son infrastructure en très grands volumes." }
    - id: e
      text: { en: "AWS keeps its prices fixed, whatever the total usage.", fr: "AWS maintient ses prix fixes, quelle que soit l'utilisation totale." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS runs infrastructure at a scale that no single company reaches, and the usage of a very large number of customers is aggregated on it. Spreading costs over this volume lowers the cost of each unit, which AWS passes on as lower pay-as-you-go prices."
    fr: "AWS exploite une infrastructure à une échelle qu'aucune entreprise n'atteint seule, et l'utilisation d'un très grand nombre de clients y est regroupée. Répartir les coûts sur ce volume réduit le coût de chaque unité, ce qu'AWS répercute sous forme de prix à l'utilisation plus bas."
  options:
    b:
      en: "A separate data center for each customer would remove the benefit of sharing infrastructure among many customers."
      fr: "Un centre de données distinct pour chaque client supprimerait l'avantage du partage de l'infrastructure entre de nombreux clients."
    c:
      en: "Most AWS services are available on demand without a long-term contract; commitments are optional."
      fr: "La plupart des services AWS sont disponibles à la demande sans contrat à long terme ; les engagements sont facultatifs."
    e:
      en: "Economies of scale mean that the unit cost falls as volume grows; fixed prices regardless of usage do not create them."
      fr: "Les économies d'échelle signifient que le coût unitaire baisse quand le volume augmente ; des prix fixes quelle que soit l'utilisation ne les créent pas."
references:
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
