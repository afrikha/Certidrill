id: clfc02-1b-cost-drivers-multi
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is learning how AWS charges for its services before it migrates.

    Which three are the fundamental drivers of cost with AWS? (Choose three.)
  fr: |
    Une entreprise apprend comment AWS facture ses services avant de migrer.

    Quels sont les trois facteurs fondamentaux de coût sur AWS ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - id: a
      text: { en: "Compute", fr: "Le calcul" }
    - id: b
      text: { en: "Inbound data transfer", fr: "Le transfert de données entrant" }
    - id: c
      text: { en: "Storage", fr: "Le stockage" }
    - id: d
      text: { en: "The number of IAM users", fr: "Le nombre d'utilisateurs IAM" }
    - id: e
      text: { en: "Outbound data transfer", fr: "Le transfert de données sortant" }
    - id: f
      text: { en: "The number of IAM Identity Center users", fr: "Le nombre d'utilisateurs IAM Identity Center" }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "AWS describes three fundamental drivers of cost: compute, storage and outbound data transfer. Data transfer is aggregated across services and charged at the outbound data transfer rate."
    fr: "AWS décrit trois facteurs fondamentaux de coût : le calcul, le stockage et le transfert de données sortant. Le transfert de données est agrégé pour l'ensemble des services et facturé au tarif du transfert sortant."
  options:
    b:
      en: "In most cases, there is no charge for inbound data transfer or for data transfer between AWS services in the same Region."
      fr: "Dans la plupart des cas, le transfert de données entrant et le transfert entre services AWS d'une même Région ne sont pas facturés."
    d:
      en: "IAM is offered at no additional charge, so the number of IAM users does not drive cost."
      fr: "IAM est proposé sans frais supplémentaires ; le nombre d'utilisateurs IAM n'est donc pas un facteur de coût."
    f:
      en: "IAM Identity Center is also offered at no additional charge; only the AWS services accessed with its identities are billed."
      fr: "IAM Identity Center est lui aussi proposé sans frais supplémentaires ; seuls les services AWS utilisés avec ses identités sont facturés."
references:
  - title: "Key principles - How AWS Pricing Works"
    url: https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/key-principles
  - title: "What is IAM?"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html
