id: clfc02-1c-license-manager-limits
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses several AWS accounts and owns software licenses from Microsoft and Oracle. The company wants to track license usage centrally and set rules that stop new deployments that would exceed the number of licenses that it owns.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise utilise plusieurs comptes AWS et possède des licences logicielles Microsoft et Oracle. L'entreprise souhaite suivre l'utilisation des licences de manière centralisée et définir des règles qui bloquent les nouveaux déploiements dépassant le nombre de licences qu'elle possède.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Config", fr: "AWS Config" }
    - id: b
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: c
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
    - id: d
      text: { en: "AWS License Manager", fr: "AWS License Manager" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS License Manager tracks licenses from vendors such as Microsoft, IBM, SAP, and Oracle across accounts and Regions. Its rules set hard or soft limits on deployments, which helps stop noncompliant usage before it happens and lowers the risk of licensing overages."
    fr: "AWS License Manager suit les licences d'éditeurs comme Microsoft, IBM, SAP et Oracle dans plusieurs comptes et Régions. Ses règles définissent des limites strictes ou souples sur les déploiements, ce qui aide à bloquer une utilisation non conforme avant qu'elle ne se produise et réduit le risque de dépassement de licences."
  options:
    a:
      en: "AWS Config records resource configurations and evaluates them against rules, but it does not count licenses or limit deployments to the licenses owned."
      fr: "AWS Config enregistre les configurations des ressources et les évalue par rapport à des règles, mais il ne compte pas les licences et ne limite pas les déploiements aux licences possédées."
    b:
      en: "AWS Artifact provides AWS compliance reports and agreements; it does not track software licenses."
      fr: "AWS Artifact fournit les rapports de conformité et les accords d'AWS ; il ne suit pas les licences logicielles."
    c:
      en: "Trusted Advisor runs best-practice checks; it does not enforce limits based on licenses owned."
      fr: "Trusted Advisor exécute des vérifications de bonnes pratiques ; il n'applique pas de limites fondées sur les licences possédées."
references:
  - title: "What is AWS License Manager? - AWS License Manager"
    url: https://docs.aws.amazon.com/license-manager/latest/userguide/license-manager.html
