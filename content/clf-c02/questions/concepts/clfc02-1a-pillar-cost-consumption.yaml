id: clfc02-1a-pillar-cost-consumption
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's development environments run 24 hours a day, but developers use them only during business hours on weekdays. The company will stop the environments outside these hours so that it pays only for the hours it needs. Which design principle of the cost optimization pillar does this apply?
  fr: |
    Les environnements de développement d'une entreprise fonctionnent 24 heures sur 24, mais les développeurs ne les utilisent que pendant les heures de bureau en semaine. L'entreprise va les arrêter en dehors de ces heures pour ne payer que les heures dont elle a besoin. Quel principe de conception du pilier optimisation des coûts applique-t-elle ?
body:
  options:
    - id: a
      text: { en: "Measure overall efficiency", fr: "Mesurer l'efficacité globale" }
    - id: b
      text: { en: "Analyze and attribute expenditure", fr: "Analyser et attribuer les dépenses" }
    - id: c
      text: { en: "Adopt a consumption model", fr: "Adopter un modèle de consommation" }
    - id: d
      text: { en: "Implement Cloud Financial Management", fr: "Mettre en œuvre la gestion financière du cloud (Cloud Financial Management)" }
answer: { optionId: c }
explanation:
  correct:
    en: "Adopting a consumption model means paying only for the resources that are needed and increasing or decreasing usage with business requirements. AWS gives this exact example: stopping environments used eight hours a day on weekdays can save about 75% (40 hours instead of 168)."
    fr: "Adopter un modèle de consommation consiste à ne payer que les ressources nécessaires et à augmenter ou réduire l'utilisation selon les besoins métier. AWS donne cet exemple : arrêter des environnements utilisés huit heures par jour en semaine peut faire économiser environ 75 % (40 heures au lieu de 168)."
  options:
    a:
      en: "Measuring overall efficiency compares the business output of a workload with its cost; it does not stop idle resources."
      fr: "Mesurer l'efficacité globale compare la production métier d'une charge de travail à son coût ; cela n'arrête pas les ressources inutilisées."
    b:
      en: "Analyzing and attributing expenditure assigns costs to workload owners; it does not change when resources run."
      fr: "Analyser et attribuer les dépenses affecte les coûts aux propriétaires des charges de travail ; cela ne change pas les heures de fonctionnement des ressources."
    d:
      en: "Cloud Financial Management builds the organization's cost capability (people, programs, processes), not a schedule for resources."
      fr: "La gestion financière du cloud développe la capacité de l'organisation en matière de coûts (connaissances, programmes, processus), pas un calendrier d'exécution des ressources."
references:
  - title: "Design principles"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/cost-dp.html
