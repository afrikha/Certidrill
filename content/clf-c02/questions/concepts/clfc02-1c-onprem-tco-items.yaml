id: clfc02-1c-onprem-tco-items
objective: "1.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is preparing a total cost of ownership (TCO) comparison between its on-premises data center and AWS. On the on-premises side, it has listed only the purchase price of its servers.

    Which additional on-premises costs should the company include? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise prépare une comparaison du coût total de possession (TCO) entre son centre de données sur site et AWS. Côté site, elle n'a indiqué que le prix d'achat de ses serveurs.

    Quels coûts supplémentaires sur site l'entreprise doit-elle inclure ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Data center facility costs such as floor space, power, and cooling", fr: "Les coûts des locaux du centre de données, comme la surface au sol, l'électricité et le refroidissement" }
    - id: b
      text: { en: "Fees for the AWS Support plan that the company plans to choose", fr: "Les frais du plan AWS Support que l'entreprise prévoit de choisir" }
    - id: c
      text: { en: "Charges for data transferred out of AWS to the company's users", fr: "Les frais de transfert des données d'AWS vers les utilisateurs de l'entreprise" }
    - id: d
      text: { en: "IT staff time spent installing, maintaining, and replacing hardware", fr: "Le temps passé par le personnel informatique à installer, maintenir et remplacer le matériel" }
    - id: e
      text: { en: "Charges for the Amazon EC2 instance hours of the migrated servers", fr: "Les frais d'heures d'instance Amazon EC2 des serveurs migrés" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Owning servers also means paying for the facility that hosts them (space, power, cooling) and for the staff who rack, stack, maintain, and replace hardware. Leaving out these costs understates the on-premises side of the comparison."
    fr: "Posséder des serveurs implique aussi de payer les locaux qui les hébergent (espace, électricité, refroidissement) et le personnel qui installe, maintient et remplace le matériel. Omettre ces coûts sous-estime le côté sur site de la comparaison."
  options:
    b:
      en: "An AWS Support plan is a cost on the AWS side of the comparison, not an on-premises cost."
      fr: "Un plan AWS Support est un coût du côté AWS de la comparaison, pas un coût sur site."
    c:
      en: "Data transfer out of AWS is a cost on the AWS side of the comparison."
      fr: "Le transfert de données sortant d'AWS est un coût du côté AWS de la comparaison."
    e:
      en: "EC2 instance hours are the AWS cost of the migrated servers, not an on-premises cost."
      fr: "Les heures d'instance EC2 sont le coût AWS des serveurs migrés, pas un coût sur site."
references:
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
  - title: "Design principles - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/cost-dp.html
