id: clfc02-1a-pillar-perf-experiment
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs comparative tests of several Amazon EC2 instance types and storage configurations to find the one that best meets the latency targets of its application. Which pillar of the AWS Well-Architected Framework includes this design principle?
  fr: |
    Une entreprise effectue des tests comparatifs de plusieurs types d'instances Amazon EC2 et configurations de stockage pour trouver celle qui atteint le mieux les objectifs de latence de son application. Quel pilier du cadre AWS Well-Architected comprend ce principe de conception ?
body:
  options:
    - id: a
      text: { en: "Reliability", fr: "Fiabilité" }
    - id: b
      text: { en: "Performance efficiency", fr: "Efficacité des performances" }
    - id: c
      text: { en: "Cost optimization", fr: "Optimisation des coûts" }
    - id: d
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
answer: { optionId: b }
explanation:
  correct:
    en: "\"Experiment more often\" is a design principle of the performance efficiency pillar: with virtual, automatable resources, a team can quickly compare instance types, storage, or configurations. The goal here is meeting latency targets, which is a performance requirement."
    fr: "« Expérimenter plus souvent » est un principe de conception du pilier efficacité des performances : avec des ressources virtuelles et automatisables, une équipe peut comparer rapidement des types d'instances, de stockage ou des configurations. L'objectif ici est d'atteindre des objectifs de latence, qui sont une exigence de performance."
  options:
    a:
      en: "Reliability is about performing the intended function correctly and consistently, including recovery from failures."
      fr: "La fiabilité concerne la capacité à remplir la fonction prévue correctement et de façon constante, y compris la récupération après une défaillance."
    c:
      en: "Cost optimization also selects resource types and sizes, but to reach the lowest price point; the stated goal is latency."
      fr: "L'optimisation des coûts choisit aussi des types et des tailles de ressources, mais pour atteindre le prix le plus bas ; l'objectif indiqué est la latence."
    d:
      en: "Operational excellence is about running and improving operations, not about choosing resources for performance."
      fr: "L'excellence opérationnelle concerne l'exécution et l'amélioration des opérations, pas le choix des ressources pour les performances."
references:
  - title: "Design principles"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/perf-dp.html
