id: clfc02-1c-onprem-hypervisor-license
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company pays yearly license and support fees for the virtualization software that runs its on-premises virtual machines. The company moves the virtual machines to Amazon EC2 instances.

    What happens to the cost of the virtualization software?
  fr: |
    Une entreprise paie chaque année des frais de licence et de support pour le logiciel de virtualisation qui exécute ses machines virtuelles sur site. L'entreprise déplace les machines virtuelles vers des instances Amazon EC2.

    Qu'advient-il du coût du logiciel de virtualisation ?
body:
  options:
    - id: a
      text: { en: "The company brings its virtualization licenses to EC2 Dedicated Hosts.", fr: "L'entreprise apporte ses licences de virtualisation sur des Dedicated Hosts EC2." }
    - id: b
      text: { en: "AWS bills the virtualization license as a separate charge for each instance.", fr: "AWS facture la licence de virtualisation comme un coût distinct pour chaque instance." }
    - id: c
      text: { en: "The company buys the virtualization software from AWS Marketplace.", fr: "L'entreprise achète le logiciel de virtualisation sur AWS Marketplace." }
    - id: d
      text: { en: "The company no longer pays it, because AWS manages the virtualization layer of EC2.", fr: "L'entreprise ne le paie plus, car AWS gère la couche de virtualisation d'EC2." }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS manages the host operating system and the virtualization layer that run EC2 instances. The company no longer needs its own virtualization licenses for these workloads; it pays only for the instances that it uses."
    fr: "AWS gère le système d'exploitation hôte et la couche de virtualisation qui exécutent les instances EC2. L'entreprise n'a plus besoin de ses propres licences de virtualisation pour ces charges de travail : elle ne paie que les instances qu'elle utilise."
  options:
    a:
      en: "Dedicated Hosts serve software licenses bound to sockets or cores, such as Windows Server or SQL Server; EC2 instances do not need the customer's virtualization licenses."
      fr: "Les Dedicated Hosts servent aux licences logicielles liées aux sockets ou aux cœurs, comme Windows Server ou SQL Server ; les instances EC2 n'ont pas besoin des licences de virtualisation du client."
    b:
      en: "There is no separate virtualization license charge on EC2 instances."
      fr: "Il n'existe pas de coût distinct de licence de virtualisation sur les instances EC2."
    c:
      en: "EC2 instances do not require the customer to buy virtualization software."
      fr: "Les instances EC2 n'exigent pas que le client achète un logiciel de virtualisation."
references:
  - title: "Shared Responsibility Model - Amazon Web Services (AWS)"
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
