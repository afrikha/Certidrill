id: clfc02-1c-compute-optimizer-service
objective: "1.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants recommendations for Amazon EC2 instance types, Amazon EBS volumes, and AWS Lambda function memory sizes. The recommendations must be based on the utilization metrics of the company's existing resources.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise souhaite des recommandations de types d'instances Amazon EC2, de volumes Amazon EBS et de tailles de mémoire de fonctions AWS Lambda. Les recommandations doivent se fonder sur les métriques d'utilisation des ressources existantes de l'entreprise.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Budgets", fr: "AWS Budgets" }
    - id: b
      text: { en: "AWS Compute Optimizer", fr: "AWS Compute Optimizer" }
    - id: c
      text: { en: "AWS Pricing Calculator", fr: "AWS Pricing Calculator" }
    - id: d
      text: { en: "AWS Config", fr: "AWS Config" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Compute Optimizer analyzes the configuration of resources and their Amazon CloudWatch utilization metrics, by default for the last 14 days. It recommends how to resize or move resources such as EC2 instances, EBS volumes, and Lambda functions, and it identifies idle resources."
    fr: "AWS Compute Optimizer analyse la configuration des ressources et leurs métriques d'utilisation Amazon CloudWatch, par défaut sur les 14 derniers jours. Il recommande comment redimensionner ou déplacer des ressources comme des instances EC2, des volumes EBS et des fonctions Lambda, et il identifie les ressources inutilisées."
  options:
    a:
      en: "AWS Budgets alerts you when costs or usage exceed thresholds; it does not recommend resource sizes."
      fr: "AWS Budgets vous alerte lorsque les coûts ou l'utilisation dépassent des seuils ; il ne recommande pas de tailles de ressources."
    c:
      en: "AWS Pricing Calculator estimates the cost of configurations that you enter; it does not analyze the utilization of existing resources."
      fr: "AWS Pricing Calculator estime le coût des configurations que vous saisissez ; il n'analyse pas l'utilisation des ressources existantes."
    d:
      en: "AWS Config records and evaluates resource configurations; it does not use utilization metrics to recommend sizes."
      fr: "AWS Config enregistre et évalue les configurations des ressources ; il n'utilise pas de métriques d'utilisation pour recommander des tailles."
references:
  - title: "What is AWS Compute Optimizer? - AWS Compute Optimizer"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html
