id: clfc02-1b-strategy-rehost
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to move an on-premises application stack to Amazon EC2 as quickly as possible, without making any changes to the application.

    Which migration strategy should the company use?
  fr: |
    Une entreprise veut déplacer une pile applicative sur site vers Amazon EC2 le plus rapidement possible, sans apporter aucune modification à l'application.

    Quelle stratégie de migration l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Replatform", fr: "Replateformer (Replatform)" }
    - id: b
      text: { en: "Rehost", fr: "Réhéberger (Rehost)" }
    - id: c
      text: { en: "Refactor", fr: "Refactoriser (Refactor)" }
    - id: d
      text: { en: "Repurchase", fr: "Racheter (Repurchase)" }
answer: { optionId: b }
explanation:
  correct:
    en: "Rehost, also called lift and shift, moves an application to AWS without making changes. It is a fast way to migrate, and the application can be modernized later."
    fr: "Le réhébergement (Rehost), aussi appelé lift and shift, déplace une application vers AWS sans la modifier. C'est une façon rapide de migrer, et l'application peut être modernisée plus tard."
  options:
    a:
      en: "Replatform makes some optimizations during the move, such as moving the database to a managed service."
      fr: "Le replateformage (Replatform) apporte quelques optimisations pendant le déplacement, comme le passage de la base de données à un service géré."
    c:
      en: "Refactor modifies the architecture to use cloud-native features, which is the opposite of no changes."
      fr: "La refactorisation (Refactor) modifie l'architecture pour utiliser des fonctionnalités cloud natives, ce qui est l'inverse de l'absence de modifications."
    d:
      en: "Repurchase replaces the application with a different product, such as a SaaS application."
      fr: "Le rachat (Repurchase) remplace l'application par un autre produit, comme une application SaaS."
references:
  - title: "About the migration strategies"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
