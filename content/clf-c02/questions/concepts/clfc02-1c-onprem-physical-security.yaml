id: clfc02-1c-onprem-physical-security
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company pays for security guards, badge readers, and video surveillance to protect its on-premises server room. The company plans to move all its servers to AWS.

    Which statement describes this cost after the move?
  fr: |
    Une entreprise paie des agents de sécurité, des lecteurs de badges et de la vidéosurveillance pour protéger sa salle des serveurs sur site. L'entreprise prévoit de déplacer tous ses serveurs vers AWS.

    Quelle affirmation décrit ce coût après la migration ?
body:
  options:
    - id: a
      text: { en: "The company hires guards for the AWS data centers that host its workloads.", fr: "L'entreprise engage des agents de sécurité pour les centres de données AWS qui hébergent ses charges de travail." }
    - id: b
      text: { en: "AWS secures its own facilities, so the company no longer pays for this physical security directly.", fr: "AWS sécurise ses propres installations : l'entreprise ne paie donc plus directement cette sécurité physique." }
    - id: c
      text: { en: "The company pays AWS a physical security fee for each Amazon EC2 instance.", fr: "L'entreprise paie à AWS des frais de sécurité physique pour chaque instance Amazon EC2." }
    - id: d
      text: { en: "The company subscribes to AWS Shield Advanced to protect the AWS data centers.", fr: "L'entreprise s'abonne à AWS Shield Advanced pour protéger les centres de données AWS." }
answer: { optionId: b }
explanation:
  correct:
    en: "Under the shared responsibility model, AWS is responsible for the security of the cloud, down to the physical security of its facilities. The company no longer pays guards or surveillance for its own server room; that protection is part of the AWS services."
    fr: "Selon le modèle de responsabilité partagée, AWS est responsable de la sécurité du cloud, jusqu'à la sécurité physique de ses installations. L'entreprise ne paie plus d'agents ni de vidéosurveillance pour sa propre salle des serveurs : cette protection fait partie des services AWS."
  options:
    a:
      en: "Customers do not provide physical security for AWS data centers; AWS is responsible for it."
      fr: "Les clients n'assurent pas la sécurité physique des centres de données AWS : AWS en est responsable."
    c:
      en: "AWS does not bill a separate physical security fee; the price of the services covers the infrastructure."
      fr: "AWS ne facture pas de frais de sécurité physique distincts : le prix des services couvre l'infrastructure."
    d:
      en: "AWS Shield Advanced protects applications against DDoS attacks; it has nothing to do with the physical security of data centers."
      fr: "AWS Shield Advanced protège les applications contre les attaques DDoS ; il n'a rien à voir avec la sécurité physique des centres de données."
references:
  - title: "Shared Responsibility Model - Amazon Web Services (AWS)"
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
