id: clfc02-1b-save-when-commit
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a steady workload that will not change for the next three years. It is willing to commit to a consistent amount of usage over that term in exchange for lower prices than On-Demand.

    Which AWS pricing principle is the company applying?
  fr: |
    Une entreprise exécute une charge de travail stable qui ne changera pas pendant les trois prochaines années. Elle est prête à s'engager sur une quantité d'utilisation constante pendant cette durée en échange de prix inférieurs à ceux de l'option On-Demand.

    Quel principe de tarification AWS l'entreprise applique-t-elle ?
body:
  options:
    - id: a
      text: { en: "Save when you commit", fr: "Économiser en s'engageant (save when you commit)" }
    - id: b
      text: { en: "Pay as you go", fr: "Paiement à l'utilisation (pay as you go)" }
    - id: c
      text: { en: "Stop guessing capacity", fr: "Ne plus deviner la capacité nécessaire" }
    - id: d
      text: { en: "Pay less by using more", fr: "Payer moins en utilisant plus (pay less by using more)" }
answer: { optionId: a }
explanation:
  correct:
    en: "Save when you commit means that customers receive lower prices in exchange for a usage commitment over a 1-year or 3-year term. Savings Plans, for example, offer savings over On-Demand pricing for a commitment to a consistent amount of usage, measured in dollars per hour."
    fr: "Le principe « économiser en s'engageant » signifie que les clients obtiennent des prix plus bas en échange d'un engagement d'utilisation sur 1 an ou 3 ans. Les Savings Plans, par exemple, offrent des économies par rapport aux tarifs On-Demand en échange d'un engagement sur une quantité d'utilisation constante, mesurée en dollars par heure."
  options:
    b:
      en: "Pay as you go has no long-term commitment; the company is making one to get lower prices."
      fr: "Le paiement à l'utilisation n'implique aucun engagement à long terme ; ici, l'entreprise en prend un pour obtenir des prix plus bas."
    c:
      en: "Stop guessing capacity is a cloud advantage about scaling with demand, not a pricing principle based on commitment."
      fr: "« Ne plus deviner la capacité nécessaire » est un avantage du cloud lié à l'adaptation à la demande, pas un principe de tarification fondé sur un engagement."
    d:
      en: "Pay less by using more refers to tiered volume discounts, which do not require a term commitment."
      fr: "Le principe « payer moins en utilisant plus » désigne les remises par paliers de volume, qui n'exigent aucun engagement de durée."
references:
  - title: "AWS Product and Service Pricing"
    url: https://aws.amazon.com/pricing/
  - title: "What are Savings Plans?"
    url: https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html
