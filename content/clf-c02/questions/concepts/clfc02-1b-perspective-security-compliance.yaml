id: clfc02-1b-perspective-security-compliance
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's chief compliance officer and internal audit leaders want assurance that its cloud workloads meet compliance requirements and protect the confidentiality, integrity and availability of data.

    Which AWS CAF perspective addresses these stakeholders' concerns?
  fr: |
    Le responsable de la conformité et les responsables de l'audit interne d'une entreprise veulent avoir l'assurance que ses charges de travail cloud respectent les exigences de conformité et protègent la confidentialité, l'intégrité et la disponibilité des données.

    Quelle perspective AWS CAF répond aux préoccupations de ces parties prenantes ?
body:
  options:
    - id: a
      text: { en: "Governance", fr: "Gouvernance (Governance)" }
    - id: b
      text: { en: "Operations", fr: "Opérations (Operations)" }
    - id: c
      text: { en: "Business", fr: "Entreprise (Business)" }
    - id: d
      text: { en: "Security", fr: "Sécurité (Security)" }
answer: { optionId: d }
explanation:
  correct:
    en: "The Security perspective (compliance and assurance) helps achieve the confidentiality, integrity and availability of data and cloud workloads. Its common stakeholders include the CISO, the chief compliance officer, internal audit leaders, and security architects and engineers."
    fr: "La perspective Sécurité (Security), axée sur la conformité et l'assurance, aide à garantir la confidentialité, l'intégrité et la disponibilité des données et des charges de travail cloud. Ses parties prenantes habituelles comprennent le CISO, le responsable de la conformité, les responsables de l'audit interne, et les architectes et ingénieurs sécurité."
  options:
    a:
      en: "Governance covers control and oversight of the transformation (programs, risks, finances, data governance); compliance assurance of workloads belongs to Security."
      fr: "La Gouvernance (Governance) couvre le contrôle et la supervision de la transformation (programmes, risques, finances, gouvernance des données) ; l'assurance de conformité des charges de travail relève de la Sécurité."
    b:
      en: "Operations covers the health and availability of services against service levels, not compliance assurance."
      fr: "Les Opérations (Operations) couvrent l'intégrité et la disponibilité des services au regard des niveaux de service, pas l'assurance de conformité."
    c:
      en: "Business covers strategy and outcomes, and its stakeholders are business executives."
      fr: "La perspective Entreprise (Business) couvre la stratégie et les résultats, et ses parties prenantes sont les dirigeants."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
