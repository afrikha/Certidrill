id: clfc02-1b-caf-phase-launch
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has a cloud adoption plan. It now wants to deliver a few high-impact pilot initiatives in production and show incremental business value before it expands.

    Which phase of the AWS CAF transformation journey is the company in?
  fr: |
    Une entreprise dispose d'un plan d'adoption du cloud. Elle veut maintenant mettre en production quelques initiatives pilotes à fort impact et démontrer une valeur métier progressive avant de s'étendre.

    Dans quelle phase du parcours de transformation AWS CAF l'entreprise se trouve-t-elle ?
body:
  options:
    - id: a
      text: { en: "Launch", fr: "Lancer (Launch)" }
    - id: b
      text: { en: "Scale", fr: "Mettre à l'échelle (Scale)" }
    - id: c
      text: { en: "Envision", fr: "Envisager (Envision)" }
    - id: d
      text: { en: "Align", fr: "Aligner (Align)" }
answer: { optionId: a }
explanation:
  correct:
    en: "The Launch phase delivers pilot initiatives in production and demonstrates incremental business value. The lessons learned from the pilots are used to adjust the approach before scaling."
    fr: "La phase Lancer (Launch) met en production des initiatives pilotes et démontre une valeur métier progressive. Les enseignements tirés des pilotes servent à ajuster l'approche avant la mise à l'échelle."
  options:
    b:
      en: "Scale comes after the pilots: it expands them to the desired scale and sustains the benefits."
      fr: "La phase Mettre à l'échelle (Scale) vient après les pilotes : elle les étend à l'échelle voulue et pérennise les bénéfices."
    c:
      en: "Envision identifies and prioritizes transformation opportunities; nothing is delivered in production yet."
      fr: "La phase Envisager (Envision) identifie et hiérarchise les opportunités de transformation ; rien n'est encore mis en production."
    d:
      en: "Align identifies capability gaps and stakeholder concerns and builds readiness strategies; it does not deliver pilots."
      fr: "La phase Aligner (Align) identifie les lacunes de capacités et les préoccupations des parties prenantes, et définit des stratégies de préparation ; elle ne livre pas de pilotes."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
