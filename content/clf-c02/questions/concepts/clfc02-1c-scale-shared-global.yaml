id: clfc02-1c-scale-shared-global
objective: "1.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A small company wants to serve users on three continents with low latency. Building its own data centers on each continent would cost far more than its budget allows.

    Which approach lets the company benefit from AWS's scale?
  fr: |
    Une petite entreprise souhaite servir des utilisateurs sur trois continents avec une faible latence. Construire ses propres centres de données sur chaque continent coûterait bien plus que son budget ne le permet.

    Quelle approche permet à l'entreprise de profiter de l'échelle d'AWS ?
body:
  options:
    - id: a
      text: { en: "Deploy in existing AWS Regions and pay only for the resources that it uses", fr: "Déployer dans des Régions AWS existantes et ne payer que les ressources qu'elle utilise" }
    - id: b
      text: { en: "Rent colocation space on each continent and run its own servers there", fr: "Louer de l'espace en colocation sur chaque continent et y exécuter ses propres serveurs" }
    - id: c
      text: { en: "Buy Dedicated Hosts on each continent for the whole expected peak load", fr: "Acheter des Dedicated Hosts sur chaque continent pour toute la charge de pointe prévue" }
    - id: d
      text: { en: "Install AWS Outposts racks in rented facilities on each continent", fr: "Installer des racks AWS Outposts dans des locaux loués sur chaque continent" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS has already built its Regions at a massive scale, and the usage of many customers is aggregated on that infrastructure. The company can deploy on several continents in minutes and pay only for what it uses, at low pay-as-you-go prices, without building any facility."
    fr: "AWS a déjà construit ses Régions à très grande échelle, et l'utilisation de nombreux clients est regroupée sur cette infrastructure. L'entreprise peut se déployer sur plusieurs continents en quelques minutes et ne payer que ce qu'elle utilise, à des prix à l'utilisation bas, sans construire aucun local."
  options:
    b:
      en: "Colocation still makes the company buy and run its own servers at a small scale, which is the cost that it cannot afford."
      fr: "La colocation oblige toujours l'entreprise à acheter et exploiter ses propres serveurs à petite échelle, ce qui est le coût qu'elle ne peut pas assumer."
    c:
      en: "Dedicated Hosts reserve whole physical servers for one customer, and sizing them for the peak keeps capacity idle most of the time."
      fr: "Les Dedicated Hosts réservent des serveurs physiques entiers à un client, et les dimensionner pour la pointe laisse de la capacité inutilisée la plupart du temps."
    d:
      en: "AWS Outposts runs AWS infrastructure in the customer's own site, so the company would still pay for facilities on each continent."
      fr: "AWS Outposts exécute une infrastructure AWS sur le site du client : l'entreprise paierait donc toujours des locaux sur chaque continent."
references:
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
