id: clfc02-1b-domain-product
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank wants its cloud adoption to reimagine its business model. It plans to create new digital services and revenue models to reach new customers and market segments.

    Which AWS CAF transformation domain matches this goal?
  fr: |
    Une banque veut que son adoption du cloud réinvente son modèle d'affaires. Elle prévoit de créer de nouveaux services numériques et modèles de revenus pour atteindre de nouveaux clients et segments de marché.

    Quel domaine de transformation AWS CAF correspond à cet objectif ?
body:
  options:
    - id: a
      text: { en: "Organization", fr: "Organisation" }
    - id: b
      text: { en: "Product", fr: "Produit" }
    - id: c
      text: { en: "Technology", fr: "Technologie" }
    - id: d
      text: { en: "Process", fr: "Processus" }
answer: { optionId: b }
explanation:
  correct:
    en: "Product transformation reimagines the business model by creating new value propositions, products, services and revenue models. It aims to reach new customers and enter new market segments, and it is the last link of the AWS CAF value chain."
    fr: "La transformation des produits réinvente le modèle d'affaires en créant de nouvelles propositions de valeur, de nouveaux produits, services et modèles de revenus. Elle vise de nouveaux clients et de nouveaux segments de marché, et constitue le dernier maillon de la chaîne de valeur AWS CAF."
  options:
    a:
      en: "Organization transformation changes how teams are organized (around products and value streams), not the products sold to customers."
      fr: "La transformation de l'organisation change la façon dont les équipes sont organisées (autour des produits et des flux de valeur), pas les produits vendus aux clients."
    c:
      en: "Technology transformation migrates and modernizes infrastructure, applications and data platforms."
      fr: "La transformation technologique migre et modernise l'infrastructure, les applications et les plateformes de données."
    d:
      en: "Process transformation optimizes internal business operations; it does not create new revenue models."
      fr: "La transformation des processus optimise les opérations métier internes ; elle ne crée pas de nouveaux modèles de revenus."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
