id: clfc02-1a-pay-as-you-go-pricing
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement describes the pay-as-you-go pricing of AWS services?
  fr: |
    Quelle affirmation décrit la tarification à l'utilisation (pay-as-you-go) des services AWS ?
body:
  options:
    - id: a
      text: { en: "Customers sign a one-year contract for each service before they can use it.", fr: "Les clients signent un contrat d'un an pour chaque service avant de pouvoir l'utiliser." }
    - id: b
      text: { en: "Customers pay a termination fee when they stop using a service.", fr: "Les clients paient des frais de résiliation lorsqu'ils cessent d'utiliser un service." }
    - id: c
      text: { en: "Customers pay for the whole month even if they delete a resource after one day.", fr: "Les clients paient le mois entier même s'ils suppriment une ressource après un jour." }
    - id: d
      text: { en: "Customers pay only for the services they use, for as long as they use them.", fr: "Les clients paient uniquement les services qu'ils utilisent, pendant la durée où ils les utilisent." }
answer: { optionId: d }
explanation:
  correct:
    en: "With pay-as-you-go pricing, customers pay only for the individual services they use, for as long as they use them. There are no long-term contracts or complex licensing, and no termination fees when they stop."
    fr: "Avec la tarification à l'utilisation, les clients ne paient que les services qu'ils utilisent, pendant la durée où ils les utilisent. Il n'y a ni contrat à long terme, ni licence complexe, ni frais de résiliation lorsqu'ils arrêtent."
  options:
    a:
      en: "Pay-as-you-go needs no long-term contract; a one- or three-year commitment applies only to optional discounts such as Savings Plans."
      fr: "La tarification à l'utilisation ne nécessite aucun contrat à long terme ; un engagement d'un ou trois ans ne s'applique qu'aux remises facultatives comme les Savings Plans."
    b:
      en: "AWS charges no termination fee when a customer stops using a service."
      fr: "AWS ne facture aucuns frais de résiliation lorsqu'un client cesse d'utiliser un service."
    c:
      en: "Charges follow actual usage; a resource deleted after one day is not billed for the rest of the month."
      fr: "La facturation suit l'utilisation réelle : une ressource supprimée après un jour n'est pas facturée pour le reste du mois."
references:
  - title: "AWS Product and Service Pricing"
    url: https://aws.amazon.com/pricing/
