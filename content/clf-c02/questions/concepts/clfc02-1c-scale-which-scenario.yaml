id: clfc02-1c-scale-which-scenario
objective: "1.4.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company reviews four ways in which it lowered its AWS costs.

    Which example shows the company benefiting from AWS economies of scale?
  fr: |
    Une entreprise examine quatre façons dont elle a réduit ses coûts AWS.

    Quel exemple montre que l'entreprise profite des économies d'échelle d'AWS ?
body:
  options:
    - id: a
      text: { en: "It stops its development instances at night and on weekends.", fr: "Elle arrête ses instances de développement la nuit et le week-end." }
    - id: b
      text: { en: "It commits to a consistent amount of compute usage for 3 years with a Savings Plan.", fr: "Elle s'engage sur une quantité constante d'utilisation du calcul pendant 3 ans avec un Savings Plan." }
    - id: c
      text: { en: "It moves underutilized instances to smaller instance types.", fr: "Elle passe des instances sous-utilisées à des types d'instances plus petits." }
    - id: d
      text: { en: "It pays less for compute than it could in its own data center, even at a small scale.", fr: "Elle paie le calcul moins cher que dans son propre centre de données, même à petite échelle." }
answer: { optionId: d }
explanation:
  correct:
    en: "Economies of scale come from AWS's size: aggregated usage lets AWS offer lower pay-as-you-go prices than a company could get on its own. The company benefits even with a small workload and without any action on its side."
    fr: "Les économies d'échelle viennent de la taille d'AWS : l'utilisation regroupée permet à AWS de proposer des prix à l'utilisation plus bas que ceux qu'une entreprise obtiendrait seule. L'entreprise en profite même avec une petite charge de travail et sans rien faire de son côté."
  options:
    a:
      en: "Stopping unused resources is the consumption model: the company saves by paying only for what it uses."
      fr: "Arrêter les ressources inutilisées relève du modèle de consommation : l'entreprise économise en ne payant que ce qu'elle utilise."
    b:
      en: "A Savings Plan saves money in exchange for a usage commitment, not because of AWS's scale."
      fr: "Un Savings Plan fait économiser en échange d'un engagement d'utilisation, pas grâce à l'échelle d'AWS."
    c:
      en: "Moving to smaller instance types is rightsizing, an action that the company performs on its own resources."
      fr: "Passer à des types d'instances plus petits relève du dimensionnement approprié, une action que l'entreprise effectue sur ses propres ressources."
references:
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
  - title: "Design principles - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/cost-dp.html
