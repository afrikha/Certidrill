id: clfc02-1c-onprem-cost-remains
objective: "1.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company migrates its on-premises virtual machines to Amazon EC2 instances. The finance team assumes that every operations cost of the data center will disappear after the migration.

    Which cost will the company continue to bear?
  fr: |
    Une entreprise migre ses machines virtuelles sur site vers des instances Amazon EC2. L'équipe financière suppose que tous les coûts d'exploitation du centre de données disparaîtront après la migration.

    Quel coût l'entreprise continuera-t-elle de supporter ?
body:
  options:
    - id: a
      text: { en: "Replacing failed disks and power supplies in the physical servers", fr: "Le remplacement des disques et des alimentations défaillants des serveurs physiques" }
    - id: b
      text: { en: "Upgrading the firmware of the physical network switches", fr: "La mise à jour du micrologiciel des commutateurs réseau physiques" }
    - id: c
      text: { en: "Maintaining the backup generators of the server room", fr: "L'entretien des groupes électrogènes de secours de la salle des serveurs" }
    - id: d
      text: { en: "Staff time to patch the guest operating systems of the instances", fr: "Le temps du personnel pour appliquer les correctifs aux systèmes d'exploitation invités des instances" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon EC2 is an infrastructure service: the customer remains responsible for managing the guest operating system, including updates and security patches. The company still needs staff time for this task, even though AWS now runs the hardware and facilities."
    fr: "Amazon EC2 est un service d'infrastructure : le client reste responsable de la gestion du système d'exploitation invité, y compris les mises à jour et les correctifs de sécurité. L'entreprise a donc toujours besoin de temps de personnel pour cette tâche, même si AWS exploite désormais le matériel et les installations."
  options:
    a:
      en: "AWS is responsible for the physical hardware, so the company no longer replaces failed server components."
      fr: "AWS est responsable du matériel physique : l'entreprise ne remplace donc plus les composants de serveur défaillants."
    b:
      en: "The physical network of AWS data centers is part of the infrastructure that AWS manages."
      fr: "Le réseau physique des centres de données AWS fait partie de l'infrastructure gérée par AWS."
    c:
      en: "Power for the facilities, including backup power, is part of the infrastructure that AWS operates."
      fr: "L'alimentation électrique des installations, y compris l'alimentation de secours, fait partie de l'infrastructure exploitée par AWS."
references:
  - title: "Shared Responsibility Model - Amazon Web Services (AWS)"
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
