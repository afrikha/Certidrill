id: clfc02-1b-caf-framework-purpose
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants AWS guidance to evaluate and improve its cloud readiness, and to build an iterative roadmap for its cloud-powered digital transformation.

    Which AWS resource is designed for this purpose?
  fr: |
    Une entreprise veut des conseils AWS pour évaluer et améliorer sa préparation au cloud, et pour établir une feuille de route itérative de sa transformation numérique fondée sur le cloud.

    Quelle ressource AWS est conçue à cet effet ?
body:
  options:
    - id: a
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
    - id: b
      text: { en: "AWS Well-Architected Framework", fr: "AWS Well-Architected Framework" }
    - id: c
      text: { en: "AWS Cloud Adoption Framework (AWS CAF)", fr: "Framework d'adoption du Cloud AWS (AWS CAF)" }
    - id: d
      text: { en: "AWS Control Tower", fr: "AWS Control Tower" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS CAF uses AWS experience and best practices to help organizations identify and prioritize transformation opportunities, evaluate and improve their cloud readiness, and iteratively evolve their transformation roadmap."
    fr: "AWS CAF s'appuie sur l'expérience et les bonnes pratiques d'AWS pour aider les organisations à identifier et hiérarchiser les opportunités de transformation, à évaluer et améliorer leur préparation au cloud, et à faire évoluer de façon itérative leur feuille de route de transformation."
  options:
    a:
      en: "Trusted Advisor inspects existing AWS resources and recommends best-practice improvements; it does not plan a transformation."
      fr: "Trusted Advisor inspecte les ressources AWS existantes et recommande des améliorations conformes aux bonnes pratiques ; il ne planifie pas une transformation."
    b:
      en: "The Well-Architected Framework helps review and improve the architecture of workloads against its pillars, not the organization's transformation roadmap."
      fr: "Le Well-Architected Framework aide à examiner et améliorer l'architecture des charges de travail selon ses piliers, pas la feuille de route de transformation de l'organisation."
    d:
      en: "Control Tower sets up and governs a multi-account AWS environment; it does not assess organizational readiness."
      fr: "Control Tower configure et gouverne un environnement AWS multicompte ; il n'évalue pas la préparation de l'organisation."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
