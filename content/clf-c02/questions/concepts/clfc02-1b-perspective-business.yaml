id: clfc02-1b-perspective-business
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's CEO and COO want to make sure that cloud investments accelerate its digital transformation. They will own strategy management, portfolio management and data monetization.

    Which AWS CAF perspective do these capabilities belong to?
  fr: |
    Le CEO et le COO d'une entreprise veulent s'assurer que les investissements cloud accélèrent sa transformation numérique. Ils porteront la gestion de la stratégie, la gestion du portefeuille et la monétisation des données.

    À quelle perspective AWS CAF ces capacités appartiennent-elles ?
body:
  options:
    - id: a
      text: { en: "Platform", fr: "Plateforme (Platform)" }
    - id: b
      text: { en: "Business", fr: "Entreprise (Business)" }
    - id: c
      text: { en: "People", fr: "Personnes (People)" }
    - id: d
      text: { en: "Governance", fr: "Gouvernance (Governance)" }
answer: { optionId: b }
explanation:
  correct:
    en: "The Business perspective (strategy and outcomes) makes sure that cloud investments accelerate digital transformation and business outcomes. Its stakeholders include the CEO, CFO, COO, CIO and CTO, and its capabilities include strategy, portfolio, innovation and product management and data monetization."
    fr: "La perspective Entreprise (Business), axée sur la stratégie et les résultats, garantit que les investissements cloud accélèrent la transformation numérique et les résultats métier. Ses parties prenantes comprennent le CEO, le CFO, le COO, le CIO et le CTO, et ses capacités comprennent la gestion de la stratégie, du portefeuille, de l'innovation et des produits, ainsi que la monétisation des données."
  options:
    a:
      en: "The Platform perspective is owned by technology leaders and engineers and covers infrastructure and applications."
      fr: "La perspective Plateforme (Platform) relève des responsables techniques et des ingénieurs, et couvre l'infrastructure et les applications."
    c:
      en: "The People perspective covers culture, leadership and skills, not strategy or data monetization."
      fr: "La perspective Personnes (People) couvre la culture, le leadership et les compétences, pas la stratégie ni la monétisation des données."
    d:
      en: "The Governance perspective covers program, risk and financial management, not business strategy or data monetization."
      fr: "La perspective Gouvernance (Governance) couvre la gestion de programmes, des risques et des finances, pas la stratégie métier ni la monétisation des données."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
