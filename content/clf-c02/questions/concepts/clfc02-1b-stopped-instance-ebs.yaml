id: clfc02-1b-stopped-instance-ebs
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stops an Amazon EC2 instance that uses an Amazon EBS root volume every evening to save money.

    Which charge continues while the instance is stopped?
  fr: |
    Une entreprise arrête chaque soir une instance Amazon EC2 qui utilise un volume racine Amazon EBS, afin de faire des économies.

    Quels frais continuent de s'appliquer pendant que l'instance est arrêtée ?
body:
  options:
    - id: a
      text: { en: "The On-Demand compute charge of the instance", fr: "Les frais de calcul On-Demand de l'instance" }
    - id: b
      text: { en: "No charge: a stopped instance and its volumes are free", fr: "Aucuns frais : une instance arrêtée et ses volumes sont gratuits" }
    - id: c
      text: { en: "The data transfer charge for its idle network interface", fr: "Les frais de transfert de données de son interface réseau inactive" }
    - id: d
      text: { en: "The storage charge of its attached EBS volumes", fr: "Les frais de stockage de ses volumes EBS attachés" }
answer: { optionId: d }
explanation:
  correct:
    en: "A stopped instance is not charged for usage, so the variable compute cost stops. The attached EBS volumes still exist and keep their data, so their storage continues to be billed."
    fr: "Une instance arrêtée n'est pas facturée pour son utilisation ; le coût variable du calcul s'arrête donc. Les volumes EBS attachés existent toujours et conservent leurs données, donc leur stockage continue d'être facturé."
  options:
    a:
      en: "Compute charges apply only while the instance is running."
      fr: "Les frais de calcul ne s'appliquent que lorsque l'instance est en cours d'exécution."
    b:
      en: "The EBS volumes are still provisioned and are billed for their storage."
      fr: "Les volumes EBS restent provisionnés et leur stockage est facturé."
    c:
      en: "Data transfer is charged for data actually transferred; a stopped instance transfers no data."
      fr: "Le transfert de données est facturé pour les données réellement transférées ; une instance arrêtée n'en transfère aucune."
references:
  - title: "Amazon EC2 instance state changes"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-lifecycle.html
