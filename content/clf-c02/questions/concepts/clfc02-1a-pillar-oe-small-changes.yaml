id: clfc02-1a-pillar-oe-small-changes
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team defines its workload and its operations procedures as code. It deploys frequent, small, reversible changes so that it can roll back quickly when a change fails. Which pillar of the AWS Well-Architected Framework describes these practices?
  fr: |
    Une équipe définit sa charge de travail et ses procédures d'exploitation sous forme de code. Elle déploie des modifications fréquentes, petites et réversibles pour pouvoir revenir rapidement en arrière lorsqu'une modification échoue. Quel pilier du cadre AWS Well-Architected décrit ces pratiques ?
body:
  options:
    - id: a
      text: { en: "Performance efficiency", fr: "Efficacité des performances" }
    - id: b
      text: { en: "Cost optimization", fr: "Optimisation des coûts" }
    - id: c
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
    - id: d
      text: { en: "Sustainability", fr: "Durabilité" }
answer: { optionId: c }
explanation:
  correct:
    en: "\"Safely automate where possible\" (operations as code) and \"Make frequent, small, reversible changes\" are design principles of the operational excellence pillar. Small automated changes reduce the blast radius and allow faster reversal when failures occur."
    fr: "« Automatiser en toute sécurité lorsque c'est possible » (les opérations sous forme de code) et « Effectuer des modifications fréquentes, petites et réversibles » sont des principes de conception du pilier excellence opérationnelle. De petites modifications automatisées réduisent le rayon d'impact et permettent un retour en arrière plus rapide en cas d'échec."
  options:
    a:
      en: "Performance efficiency is about selecting and using resources efficiently to meet requirements."
      fr: "L'efficacité des performances concerne le choix et l'utilisation efficace des ressources pour répondre aux exigences."
    b:
      en: "Cost optimization is about delivering business value at the lowest price point, not about how changes are deployed."
      fr: "L'optimisation des coûts consiste à apporter de la valeur métier au prix le plus bas, pas à définir la manière de déployer les modifications."
    d:
      en: "Sustainability is about reducing the environmental impact of workloads."
      fr: "La durabilité concerne la réduction de l'impact environnemental des charges de travail."
references:
  - title: "Design principles"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/oe-design-principles.html
