id: clfc02-1c-byol-compliance-owner
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs commercial software on Amazon EC2 instances under the Bring Your Own License (BYOL) model.

    Who is responsible for making sure that the use of the software complies with the vendor's license terms?
  fr: |
    Une entreprise exécute des logiciels commerciaux sur des instances Amazon EC2 avec le modèle BYOL (Bring Your Own License).

    Qui est responsable de la conformité de l'utilisation du logiciel aux conditions de licence de l'éditeur ?
body:
  options:
    - id: a
      text: { en: "AWS", fr: "AWS" }
    - id: b
      text: { en: "The AWS Marketplace seller", fr: "Le vendeur AWS Marketplace" }
    - id: c
      text: { en: "AWS and the software vendor, jointly", fr: "AWS et l'éditeur du logiciel, conjointement" }
    - id: d
      text: { en: "The company", fr: "L'entreprise" }
answer: { optionId: d }
explanation:
  correct:
    en: "With BYOL, the company uses licenses that it owns, so it must follow the vendor's license terms, for example Oracle's cloud licensing policies. AWS License Manager can help the company track usage and prepare for vendor audits, but the responsibility stays with the company."
    fr: "Avec le BYOL, l'entreprise utilise des licences qu'elle possède : elle doit donc respecter les conditions de licence de l'éditeur, par exemple les politiques de licence cloud d'Oracle. AWS License Manager peut aider l'entreprise à suivre l'utilisation et à préparer les audits de l'éditeur, mais la responsabilité reste celle de l'entreprise."
  options:
    a:
      en: "AWS does not hold the licenses in a BYOL model, so it is not responsible for compliance with their terms."
      fr: "AWS ne détient pas les licences dans un modèle BYOL : il n'est donc pas responsable de la conformité à leurs conditions."
    b:
      en: "The company brings its own licenses; no AWS Marketplace purchase is involved."
      fr: "L'entreprise apporte ses propres licences : aucun achat sur AWS Marketplace n'est en jeu."
    c:
      en: "The license agreement is between the company and the vendor; AWS does not share responsibility for it."
      fr: "Le contrat de licence lie l'entreprise et l'éditeur : AWS n'en partage pas la responsabilité."
references:
  - title: "RDS for Oracle licensing options - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Oracle.Concepts.Licensing.html
  - title: "What is AWS License Manager? - AWS License Manager"
    url: https://docs.aws.amazon.com/license-manager/latest/userguide/license-manager.html
