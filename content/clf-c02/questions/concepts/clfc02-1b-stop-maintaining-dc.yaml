id: clfc02-1b-stop-maintaining-dc
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's IT staff spend most of their time racking, stacking and powering servers. The company wants them to work on projects that differentiate its business instead.

    Which advantage of cloud computing matches this goal?
  fr: |
    Le personnel informatique d'une entreprise passe l'essentiel de son temps à installer, empiler et alimenter des serveurs. L'entreprise veut qu'il travaille plutôt sur des projets qui différencient son activité.

    Quel avantage du cloud computing correspond à cet objectif ?
body:
  options:
    - id: a
      text: { en: "Stop spending money running and maintaining data centers", fr: "Ne plus dépenser d'argent pour exploiter et entretenir des centres de données" }
    - id: b
      text: { en: "Go global in minutes", fr: "Se déployer dans le monde entier en quelques minutes" }
    - id: c
      text: { en: "Stop guessing capacity", fr: "Ne plus deviner la capacité nécessaire" }
    - id: d
      text: { en: "Benefit from massive economies of scale", fr: "Bénéficier d'économies d'échelle massives" }
answer: { optionId: a }
explanation:
  correct:
    en: "Stop spending money running and maintaining data centers: the company focuses on projects that differentiate its business and on its customers, instead of the heavy lifting of racking, stacking and powering servers."
    fr: "Ne plus dépenser d'argent pour exploiter et entretenir des centres de données : l'entreprise se concentre sur les projets qui différencient son activité et sur ses clients, au lieu des tâches lourdes d'installation, d'empilement et d'alimentation des serveurs."
  options:
    b:
      en: "Going global is about deploying in Regions worldwide in minutes."
      fr: "Le déploiement mondial consiste à se déployer en quelques minutes dans des Régions du monde entier."
    c:
      en: "Stop guessing capacity is about scaling to actual demand, not about freeing staff from data center work."
      fr: "« Ne plus deviner la capacité nécessaire » concerne l'adaptation à la demande réelle, pas le fait de libérer le personnel du travail sur les centres de données."
    d:
      en: "Economies of scale explain AWS's lower pay-as-you-go prices, not the removal of server maintenance work."
      fr: "Les économies d'échelle expliquent les prix plus bas d'AWS en paiement à l'utilisation, pas la suppression du travail d'entretien des serveurs."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
