id: clfc02-1c-delete-stack-cleanup
objective: "1.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team creates temporary test environments that contain many AWS resources. After the tests, some resources are forgotten and keep generating charges. The team wants to remove every resource of an environment in one operation.

    Which solution will meet these requirements?
  fr: |
    Une équipe crée des environnements de test temporaires qui contiennent de nombreuses ressources AWS. Après les tests, certaines ressources sont oubliées et continuent de générer des frais. L'équipe souhaite supprimer toutes les ressources d'un environnement en une seule opération.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS Budgets alert for the test account.", fr: "Créer une alerte AWS Budgets pour le compte de test." }
    - id: b
      text: { en: "Tag the resources and search for the tag after each test to delete them one by one.", fr: "Baliser les ressources et rechercher la balise après chaque test pour les supprimer une par une." }
    - id: c
      text: { en: "Review the AWS Trusted Advisor checks after each test.", fr: "Examiner les vérifications d'AWS Trusted Advisor après chaque test." }
    - id: d
      text: { en: "Deploy each environment as an AWS CloudFormation stack and delete the stack after the tests.", fr: "Déployer chaque environnement comme une pile AWS CloudFormation et supprimer la pile après les tests." }
answer: { optionId: d }
explanation:
  correct:
    en: "CloudFormation manages the resources of a stack as a single unit. Deleting the stack deletes all the resources in it, so no forgotten resource keeps generating charges."
    fr: "CloudFormation gère les ressources d'une pile comme une seule unité. Supprimer la pile supprime toutes les ressources qu'elle contient : aucune ressource oubliée ne continue donc de générer des frais."
  options:
    a:
      en: "A budget alert warns about spending but does not delete any resource."
      fr: "Une alerte de budget avertit des dépenses, mais ne supprime aucune ressource."
    b:
      en: "Deleting resources one by one is a manual process, which is how resources get forgotten."
      fr: "Supprimer les ressources une par une est un processus manuel, et c'est ainsi que des ressources sont oubliées."
    c:
      en: "Trusted Advisor checks can point out waste, but they do not remove the resources of an environment in one operation."
      fr: "Les vérifications de Trusted Advisor peuvent signaler du gaspillage, mais elles ne suppriment pas les ressources d'un environnement en une seule opération."
references:
  - title: "What is CloudFormation? - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html
