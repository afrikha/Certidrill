id: clfc02-1a-gi-region-selection
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is choosing an AWS Region for a new application. Which of the following should the company consider? (Choose two.)
  fr: |
    Une entreprise choisit une Région AWS pour une nouvelle application. Lesquels des éléments suivants doit-elle prendre en compte ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "The proximity of the Region to most of the application's users", fr: "La proximité de la Région avec la plupart des utilisateurs de l'application" }
    - id: b
      text: { en: "The Region in which the AWS account was created, because an account can use only one Region", fr: "La Région dans laquelle le compte AWS a été créé, car un compte ne peut utiliser qu'une seule Région" }
    - id: c
      text: { en: "Whether the Region offers the AWS services and features that the application needs", fr: "Le fait que la Région propose les services et fonctionnalités AWS dont l'application a besoin" }
    - id: d
      text: { en: "Whether the Region is enabled by default, because Regions that must be enabled cannot run production workloads", fr: "Le fait que la Région soit activée par défaut, car les Régions qu'il faut activer ne peuvent pas exécuter de charges de production" }
    - id: e
      text: { en: "The number of edge locations that the company owns in the Region", fr: "Le nombre d'emplacements périphériques dont l'entreprise est propriétaire dans la Région" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "AWS advises selecting a Region that has the services and features the workload needs, and a Region close to the majority of users to lower latency. The geography of each Region also helps meet regulatory and compliance requirements."
    fr: "AWS conseille de choisir une Région qui propose les services et fonctionnalités nécessaires à la charge de travail, et une Région proche de la majorité des utilisateurs pour réduire la latence. La géographie de chaque Région aide aussi à respecter les exigences réglementaires et de conformité."
  options:
    b:
      en: "An AWS account provides multiple Regions, so the company can create resources where its requirements are met."
      fr: "Un compte AWS donne accès à plusieurs Régions : l'entreprise peut créer ses ressources là où ses exigences sont satisfaites."
    d:
      en: "A Region introduced after March 20, 2019 must first be enabled, and then it can be used like any other Region."
      fr: "Une Région introduite après le 20 mars 2019 doit d'abord être activée, puis elle s'utilise comme n'importe quelle autre Région."
    e:
      en: "Edge locations are part of the AWS global network; customers do not own them."
      fr: "Les emplacements périphériques font partie du réseau mondial d'AWS ; les clients n'en sont pas propriétaires."
references:
  - title: "AWS Regions"
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions.html
