id: clfc02-1b-pay-as-you-go
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to pay only for the individual AWS services that it uses, for as long as it uses them, without long-term contracts or complex licensing.

    Which AWS pricing principle describes this?
  fr: |
    Une entreprise veut payer uniquement les services AWS qu'elle utilise, pendant la durée où elle les utilise, sans contrat à long terme ni licence complexe.

    Quel principe de tarification AWS cela décrit-il ?
body:
  options:
    - id: a
      text: { en: "Save when you commit", fr: "Économiser en s'engageant (save when you commit)" }
    - id: b
      text: { en: "Pay as you go", fr: "Paiement à l'utilisation (pay as you go)" }
    - id: c
      text: { en: "Pay less by using more", fr: "Payer moins en utilisant plus (pay less by using more)" }
    - id: d
      text: { en: "Bring your own license", fr: "Apporter sa propre licence (BYOL)" }
answer: { optionId: b }
explanation:
  correct:
    en: "With pay-as-you-go pricing, a company pays only for the individual services it needs, for as long as it uses them, without long-term contracts or complex licensing. It can adapt to changing business needs without overcommitting budgets."
    fr: "Avec le paiement à l'utilisation, une entreprise paie uniquement les services dont elle a besoin, pendant la durée où elle les utilise, sans contrat à long terme ni licence complexe. Elle peut s'adapter à l'évolution de ses besoins sans engager un budget excessif."
  options:
    a:
      en: "Save when you commit gives lower prices in exchange for a usage commitment over a term, which is a long-term commitment."
      fr: "Le principe « économiser en s'engageant » offre des prix plus bas en échange d'un engagement d'utilisation sur une durée, donc d'un engagement à long terme."
    c:
      en: "Pay less by using more refers to volume-based discounts, not to paying only for what is used."
      fr: "Le principe « payer moins en utilisant plus » désigne les remises sur volume, pas le fait de payer seulement ce que l'on utilise."
    d:
      en: "Bring your own license is a licensing model for existing software licenses, not an AWS pricing principle."
      fr: "Apporter sa propre licence (BYOL) est un modèle de licences pour des licences logicielles existantes, pas un principe de tarification AWS."
references:
  - title: "AWS Product and Service Pricing"
    url: https://aws.amazon.com/pricing/
