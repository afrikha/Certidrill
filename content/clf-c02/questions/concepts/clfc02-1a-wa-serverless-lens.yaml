id: clfc02-1a-wa-serverless-lens
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company reviews its workloads with the AWS Well-Architected Framework. It now wants additional best practices that are specific to its serverless applications. What should the company use?
  fr: |
    Une entreprise examine ses charges de travail avec le cadre AWS Well-Architected. Elle veut maintenant des bonnes pratiques supplémentaires propres à ses applications sans serveur. Que doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "The Serverless Applications Lens", fr: "L'objectif (lens) Serverless Applications Lens" }
    - id: b
      text: { en: "The AWS Well-Architected Framework Lens", fr: "L'objectif AWS Well-Architected Framework Lens" }
    - id: c
      text: { en: "A new milestone of the workload", fr: "Un nouveau jalon de la charge de travail" }
    - id: d
      text: { en: "The Platform perspective of the AWS Cloud Adoption Framework (AWS CAF)", fr: "La perspective Plateforme du Framework d'adoption du Cloud AWS (AWS CAF)" }
answer: { optionId: a }
explanation:
  correct:
    en: "Lenses extend the Well-Architected Framework with guidance for a technology or an industry. The Serverless Applications Lens covers common serverless scenarios and the key elements that make these workloads follow best practices."
    fr: "Les objectifs (lenses) étendent le cadre Well-Architected avec des conseils propres à une technologie ou à un secteur. Le Serverless Applications Lens couvre les scénarios sans serveur courants et les éléments clés qui permettent à ces charges de travail de suivre les bonnes pratiques."
  options:
    b:
      en: "This general lens is applied automatically to every workload and is what the company already uses; it is not specific to serverless applications."
      fr: "Cet objectif général est appliqué automatiquement à chaque charge de travail et correspond à ce que l'entreprise utilise déjà ; il n'est pas propre aux applications sans serveur."
    c:
      en: "A milestone records the state of a workload review at a point in time; it adds no best practices."
      fr: "Un jalon enregistre l'état de la revue d'une charge de travail à un moment donné ; il n'ajoute aucune bonne pratique."
    d:
      en: "AWS CAF guides cloud adoption and transformation; its perspectives are not a set of serverless architecture best practices."
      fr: "AWS CAF guide l'adoption du cloud et la transformation ; ses perspectives ne sont pas un ensemble de bonnes pratiques d'architecture sans serveur."
references:
  - title: "Serverless Applications Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/serverless-applications-lens/welcome.html
  - title: "Using lenses in AWS WA Tool"
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/lenses.html
