id: clfc02-1b-caf-outcomes-multi
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's board asks which business outcomes a cloud transformation guided by the AWS Cloud Adoption Framework (AWS CAF) can deliver.

    Which two of the following are AWS CAF business outcomes? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Le conseil d'administration d'une entreprise demande quels résultats métier une transformation vers le cloud guidée par le Framework d'adoption du Cloud AWS (AWS CAF) peut apporter.

    Quels sont les deux éléments suivants qui sont des résultats métier AWS CAF ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Platform engineering", fr: "Ingénierie de plateforme" }
    - id: b
      text: { en: "Reduced business risk", fr: "Réduction des risques métier" }
    - id: c
      text: { en: "Envision", fr: "Envisager (Envision)" }
    - id: d
      text: { en: "Organization transformation", fr: "Transformation de l'organisation" }
    - id: e
      text: { en: "Increased operational efficiency", fr: "Augmentation de l'efficacité opérationnelle" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "AWS CAF describes four business outcomes that cloud-powered transformation accelerates: reduced business risk, improved ESG performance, increased revenue and increased operational efficiency."
    fr: "AWS CAF décrit quatre résultats métier qu'une transformation fondée sur le cloud accélère : la réduction des risques métier, l'amélioration des performances ESG, l'augmentation des revenus et l'augmentation de l'efficacité opérationnelle."
  options:
    a:
      en: "Platform engineering is a foundational capability of the Platform perspective, not a business outcome."
      fr: "L'ingénierie de plateforme est une capacité fondamentale de la perspective Plateforme (Platform), pas un résultat métier."
    c:
      en: "Envision is a phase of the AWS CAF transformation journey, not a business outcome."
      fr: "Envisager (Envision) est une phase du parcours de transformation AWS CAF, pas un résultat métier."
    d:
      en: "Organization transformation is one of the four transformation domains, which produce the outcomes; it is not an outcome itself."
      fr: "La transformation de l'organisation est l'un des quatre domaines de transformation, qui produisent les résultats ; ce n'est pas un résultat en soi."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
  - title: "AWS Cloud Adoption Framework"
    url: https://aws.amazon.com/cloud-adoption-framework/
