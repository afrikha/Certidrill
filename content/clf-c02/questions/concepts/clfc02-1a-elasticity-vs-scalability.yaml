id: clfc02-1a-elasticity-vs-scalability
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Which statement describes the difference between scalability and elasticity?
  fr: |
    Quelle affirmation décrit la différence entre l'évolutivité (scalability) et l'élasticité ?
body:
  options:
    - id: a
      text: { en: "Scalability adds resources automatically, and elasticity requires manual changes.", fr: "L'évolutivité ajoute des ressources automatiquement, et l'élasticité nécessite des modifications manuelles." }
    - id: b
      text: { en: "Scalability is the ability to grow with demand, and elasticity also releases resources when they are no longer needed.", fr: "L'évolutivité est la capacité à croître avec la demande, et l'élasticité libère aussi les ressources lorsqu'elles ne sont plus nécessaires." }
    - id: c
      text: { en: "Scalability applies only to compute, and elasticity applies only to storage.", fr: "L'évolutivité s'applique uniquement au calcul, et l'élasticité uniquement au stockage." }
    - id: d
      text: { en: "Scalability means using several Availability Zones, and elasticity means using several Regions.", fr: "L'évolutivité consiste à utiliser plusieurs zones de disponibilité, et l'élasticité plusieurs Régions." }
answer: { optionId: b }
explanation:
  correct:
    en: "Scalability measures a system's ability to grow to accommodate an increase in demand. Elasticity is the ability to acquire resources as they are needed and to release them when they are no longer needed, which the cloud can do automatically."
    fr: "L'évolutivité mesure la capacité d'un système à croître pour absorber une hausse de la demande. L'élasticité est la capacité à obtenir des ressources quand elles sont nécessaires et à les libérer quand elles ne le sont plus, ce que le cloud peut faire automatiquement."
  options:
    a:
      en: "It is the reverse: in the cloud, elasticity can be automatic, and scalability says nothing about automation."
      fr: "C'est l'inverse : dans le cloud, l'élasticité peut être automatique, et l'évolutivité ne dit rien de l'automatisation."
    c:
      en: "Both concepts apply to any kind of resource, including compute and storage."
      fr: "Les deux concepts s'appliquent à tout type de ressource, y compris le calcul et le stockage."
    d:
      en: "Using several Availability Zones or Regions is about availability and fault isolation, not the definitions of these two concepts."
      fr: "Utiliser plusieurs zones de disponibilité ou Régions relève de la disponibilité et de l'isolation des pannes, pas de la définition de ces deux concepts."
references:
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
