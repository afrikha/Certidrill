id: clfc02-1c-rightsize-before-commit
objective: "1.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs 50 Amazon EC2 instances whose average CPU utilization has stayed below 10% for months. The company plans to buy a 3-year Compute Savings Plan with a commitment equal to the current hourly spend of these instances.

    Which action should the company take first to get the largest long-term savings?
  fr: |
    Une entreprise exécute 50 instances Amazon EC2 dont l'utilisation moyenne du processeur reste inférieure à 10 % depuis des mois. L'entreprise prévoit d'acheter un Compute Savings Plan sur 3 ans avec un engagement égal à la dépense horaire actuelle de ces instances.

    Quelle action l'entreprise doit-elle effectuer en premier pour obtenir les économies les plus importantes à long terme ?
body:
  options:
    - id: a
      text: { en: "Buy the Savings Plan now and rightsize the instances after the commitment starts", fr: "Acheter le Savings Plan maintenant et dimensionner correctement les instances après le début de l'engagement" }
    - id: b
      text: { en: "Buy Standard Reserved Instances for the current instance types instead of a Savings Plan", fr: "Acheter des instances réservées standard pour les types d'instances actuels au lieu d'un Savings Plan" }
    - id: c
      text: { en: "Rightsize the instances, then base the Savings Plan commitment on the new, lower usage", fr: "Dimensionner correctement les instances, puis fonder l'engagement du Savings Plan sur la nouvelle utilisation, plus faible" }
    - id: d
      text: { en: "Move the instances to Dedicated Hosts before buying the Savings Plan", fr: "Déplacer les instances vers des Dedicated Hosts avant d'acheter le Savings Plan" }
answer: { optionId: c }
explanation:
  correct:
    en: "A Savings Plan is a commitment to a consistent amount of usage, in dollars per hour, for 1 or 3 years. If the company commits to the spend of oversized instances, it keeps paying that amount for 3 years even after it reduces its usage, so it should rightsize first and commit to the lower spend."
    fr: "Un Savings Plan est un engagement sur une quantité constante d'utilisation, en dollars par heure, pendant 1 ou 3 ans. Si l'entreprise s'engage sur la dépense d'instances surdimensionnées, elle continue de payer ce montant pendant 3 ans même après avoir réduit son utilisation : elle doit donc d'abord dimensionner correctement, puis s'engager sur la dépense plus faible."
  options:
    a:
      en: "After rightsizing, the hourly commitment would stay at the old, higher spend for the whole term, so part of it would be wasted."
      fr: "Après le dimensionnement, l'engagement horaire resterait à l'ancienne dépense, plus élevée, pendant toute la durée : une partie serait donc perdue."
    b:
      en: "Standard Reserved Instances for the current types would lock in the oversized instances for the term, which is even less flexible."
      fr: "Des instances réservées standard pour les types actuels figeraient les instances surdimensionnées pendant toute la durée, ce qui est encore moins flexible."
    d:
      en: "Dedicated Hosts serve licensing or compliance needs; they do not reduce the waste of underutilized instances."
      fr: "Les Dedicated Hosts répondent à des besoins de licences ou de conformité ; ils ne réduisent pas le gaspillage d'instances sous-utilisées."
references:
  - title: "COST 6. How do you meet cost targets when you select resource type, size and number? - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/cost-06.html
  - title: "Key principles - How AWS Pricing Works"
    url: https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/key-principles.html
