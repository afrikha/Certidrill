id: clfc02-1b-map-program
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants an AWS program for its data center migration that combines an outcome-driven methodology, expertise from AWS and its partners, and financial investment that helps offset the initial migration costs.

    Which AWS program should the company use?
  fr: |
    Une entreprise veut, pour la migration de son centre de données, un programme AWS qui associe une méthodologie axée sur les résultats, l'expertise d'AWS et de ses partenaires, et un investissement financier qui aide à compenser les coûts initiaux de migration.

    Quel programme AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Migration Acceleration Program (MAP)", fr: "AWS Migration Acceleration Program (MAP)" }
    - id: b
      text: { en: "AWS Prescriptive Guidance", fr: "AWS Prescriptive Guidance" }
    - id: c
      text: { en: "AWS Free Tier", fr: "Offre gratuite AWS (AWS Free Tier)" }
    - id: d
      text: { en: "AWS Marketplace", fr: "AWS Marketplace" }
answer: { optionId: a }
explanation:
  correct:
    en: "MAP is a migration program built on experience from thousands of enterprise migrations. It provides an outcome-driven methodology in three phases, expertise from AWS Professional Services and AWS Migration Competency Partners, and financial investments that help offset initial migration costs."
    fr: "Le MAP est un programme de migration fondé sur l'expérience de milliers de migrations d'entreprises. Il fournit une méthodologie axée sur les résultats en trois phases, l'expertise d'AWS Professional Services et des partenaires AWS Migration Competency, et des investissements financiers qui aident à compenser les coûts initiaux de migration."
  options:
    b:
      en: "AWS Prescriptive Guidance publishes strategies, guides and patterns, but it offers no financial investment or partner engagement."
      fr: "AWS Prescriptive Guidance publie des stratégies, des guides et des modèles, mais n'offre ni investissement financier ni accompagnement par des partenaires."
    c:
      en: "The Free Tier lets customers try some services at no cost within limits; it is not a migration program."
      fr: "L'offre gratuite permet d'essayer certains services sans frais dans certaines limites ; ce n'est pas un programme de migration."
    d:
      en: "AWS Marketplace is a catalog to find and buy third-party software; it is not a migration methodology."
      fr: "AWS Marketplace est un catalogue pour trouver et acheter des logiciels tiers ; ce n'est pas une méthodologie de migration."
references:
  - title: "AWS Migration Acceleration Program (MAP)"
    url: https://aws.amazon.com/migration-acceleration-program/
