id: clfc02-1b-savings-ways-multi
objective: "1.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's CFO asks how moving from its data center to AWS can lower its IT costs.

    Which two answers are correct? (Choose two.)

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le CFO d'une entreprise demande comment le passage de son centre de données à AWS peut réduire ses coûts informatiques.

    Quelles sont les deux réponses correctes ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "AWS includes every third-party software license in the price at no charge.", fr: "AWS inclut gratuitement dans le prix toutes les licences de logiciels tiers." }
    - id: b
      text: { en: "Upfront hardware purchases are replaced by paying only for the resources used.", fr: "Les achats initiaux de matériel sont remplacés par le paiement des seules ressources utilisées." }
    - id: c
      text: { en: "Data transfer out of AWS to the internet is never charged.", fr: "Le transfert de données d'AWS vers internet n'est jamais facturé." }
    - id: d
      text: { en: "Capacity can follow actual demand instead of being bought for the peak.", fr: "La capacité peut suivre la demande réelle au lieu d'être achetée pour le pic." }
    - id: e
      text: { en: "AWS takes over the classification and protection of the company's data.", fr: "AWS prend en charge la classification et la protection des données de l'entreprise." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Moving to AWS trades upfront investments in data centers and servers for paying only for the resources consumed. The company also stops guessing capacity: it scales up and down with demand instead of keeping idle servers sized for the peak."
    fr: "Le passage à AWS remplace les investissements initiaux dans les centres de données et les serveurs par le paiement des seules ressources consommées. L'entreprise ne devine plus la capacité nécessaire : elle monte et descend en charge selon la demande, au lieu de garder des serveurs inactifs dimensionnés pour le pic."
  options:
    a:
      en: "Some services offer license-included pricing, but licenses are not free, and BYOL licenses are still paid to the vendor."
      fr: "Certains services proposent une tarification avec licence incluse, mais les licences ne sont pas gratuites, et les licences BYOL restent payées à l'éditeur."
    c:
      en: "Outbound data transfer to the internet is a fundamental driver of cost on AWS."
      fr: "Le transfert de données sortant vers internet est un facteur fondamental de coût sur AWS."
    e:
      en: "Data classification and protection stay the customer's responsibility under the shared responsibility model."
      fr: "La classification et la protection des données restent de la responsabilité du client selon le modèle de responsabilité partagée."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
  - title: "AWS Product and Service Pricing"
    url: https://aws.amazon.com/pricing/
