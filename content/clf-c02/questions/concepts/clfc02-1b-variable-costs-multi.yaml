id: clfc02-1b-variable-costs-multi
objective: "1.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has moved its workloads to AWS but still pays for some on-premises commitments.

    Which two of its costs are variable costs? (Choose two.)
  fr: |
    Une entreprise a déplacé ses charges de travail vers AWS, mais paie encore certains engagements sur site.

    Quels sont les deux coûts de l'entreprise qui sont variables ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Amazon EC2 On-Demand compute charges", fr: "Les frais de calcul Amazon EC2 On-Demand" }
    - id: b
      text: { en: "The monthly lease of a colocation rack", fr: "La location mensuelle d'une baie en colocation" }
    - id: c
      text: { en: "The purchase of on-premises network switches", fr: "L'achat de commutateurs réseau sur site" }
    - id: d
      text: { en: "Data transfer out from AWS to the internet", fr: "Le transfert de données d'AWS vers internet" }
    - id: e
      text: { en: "A five-year on-premises software support contract", fr: "Un contrat de support logiciel sur site de cinq ans" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "On-Demand compute and outbound data transfer are billed according to what the company consumes, so they vary with usage. A rack lease, a hardware purchase and a multi-year support contract cost the same whatever the usage."
    fr: "Le calcul On-Demand et le transfert de données sortant sont facturés selon la consommation de l'entreprise ; ils varient donc avec l'utilisation. La location d'une baie, l'achat de matériel et un contrat de support pluriannuel coûtent autant quelle que soit l'utilisation."
  options:
    b:
      en: "A monthly lease is the same amount every month: it is a fixed cost."
      fr: "Une location mensuelle représente le même montant chaque mois : c'est un coût fixe."
    c:
      en: "Buying network equipment is an upfront capital expense that does not change with usage."
      fr: "L'achat d'équipements réseau est une dépense d'investissement initiale qui ne varie pas avec l'utilisation."
    e:
      en: "A multi-year support contract is a fixed amount agreed in advance."
      fr: "Un contrat de support pluriannuel est un montant fixe convenu à l'avance."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
  - title: "Key principles - How AWS Pricing Works"
    url: https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/key-principles
