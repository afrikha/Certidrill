id: clfc02-1b-perspective-platform
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's CTO, architects and engineers want to accelerate the delivery of cloud workloads through an enterprise-grade, scalable, hybrid cloud environment. Their capabilities include platform engineering and CI/CD.

    Which AWS CAF perspective does this describe?
  fr: |
    Le CTO, les architectes et les ingénieurs d'une entreprise veulent accélérer la livraison des charges de travail cloud grâce à un environnement cloud hybride évolutif de niveau entreprise. Leurs capacités comprennent l'ingénierie de plateforme et la CI/CD.

    Quelle perspective AWS CAF cela décrit-il ?
body:
  options:
    - id: a
      text: { en: "Operations", fr: "Opérations (Operations)" }
    - id: b
      text: { en: "Platform", fr: "Plateforme (Platform)" }
    - id: c
      text: { en: "Business", fr: "Entreprise (Business)" }
    - id: d
      text: { en: "Governance", fr: "Gouvernance (Governance)" }
answer: { optionId: b }
explanation:
  correct:
    en: "The Platform perspective focuses on infrastructure and applications. It helps build an enterprise-grade, scalable, hybrid cloud environment, and its capabilities include platform architecture, platform engineering, modern application development and CI/CD."
    fr: "La perspective Plateforme (Platform) porte sur l'infrastructure et les applications. Elle aide à bâtir un environnement cloud hybride évolutif de niveau entreprise, et ses capacités comprennent l'architecture de plateforme, l'ingénierie de plateforme, le développement d'applications modernes et la CI/CD."
  options:
    a:
      en: "The Operations perspective makes sure cloud services meet agreed service levels, with capabilities such as observability and patch management."
      fr: "La perspective Opérations (Operations) garantit que les services cloud respectent les niveaux de service convenus, avec des capacités comme l'observabilité et la gestion des correctifs."
    c:
      en: "The Business perspective makes sure cloud investments accelerate business outcomes; its stakeholders are business executives."
      fr: "La perspective Entreprise (Business) garantit que les investissements cloud accélèrent les résultats métier ; ses parties prenantes sont les dirigeants."
    d:
      en: "The Governance perspective orchestrates cloud initiatives and minimizes transformation risks; it does not engineer the platform."
      fr: "La perspective Gouvernance (Governance) orchestre les initiatives cloud et réduit les risques de la transformation ; elle ne conçoit pas la plateforme."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
