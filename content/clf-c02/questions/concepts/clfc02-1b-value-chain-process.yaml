id: clfc02-1b-value-chain-process
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In the AWS CAF value chain, the four transformation domains build on each other. A company has migrated and modernized its infrastructure and applications.

    According to AWS CAF, which transformation does this technology transformation directly enable?
  fr: |
    Dans la chaîne de valeur AWS CAF, les quatre domaines de transformation s'appuient les uns sur les autres. Une entreprise a migré et modernisé son infrastructure et ses applications.

    Selon AWS CAF, quelle transformation cette transformation technologique rend-elle directement possible ?
body:
  options:
    - id: a
      text: { en: "Product transformation", fr: "La transformation des produits" }
    - id: b
      text: { en: "Organization transformation", fr: "La transformation de l'organisation" }
    - id: c
      text: { en: "Process transformation", fr: "La transformation des processus" }
    - id: d
      text: { en: "Platform transformation", fr: "La transformation de la plateforme" }
answer: { optionId: c }
explanation:
  correct:
    en: "In the AWS CAF value chain, technological transformation enables process transformation, which enables organizational transformation, which in turn enables product transformation. These transformations produce the business outcomes."
    fr: "Dans la chaîne de valeur AWS CAF, la transformation technologique rend possible la transformation des processus, qui rend possible la transformation de l'organisation, qui à son tour rend possible la transformation des produits. Ces transformations produisent les résultats métier."
  options:
    a:
      en: "Product transformation is the last link of the chain; it is enabled by organization transformation, not directly by technology."
      fr: "La transformation des produits est le dernier maillon de la chaîne ; elle est rendue possible par la transformation de l'organisation, pas directement par la technologie."
    b:
      en: "Organization transformation follows process transformation in the value chain."
      fr: "La transformation de l'organisation suit la transformation des processus dans la chaîne de valeur."
    d:
      en: "Platform is an AWS CAF perspective, not one of the four transformation domains (technology, process, organization, product)."
      fr: "Plateforme (Platform) est une perspective AWS CAF, pas l'un des quatre domaines de transformation (technologie, processus, organisation, produit)."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
