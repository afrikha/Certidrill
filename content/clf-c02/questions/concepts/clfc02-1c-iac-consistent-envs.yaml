id: clfc02-1c-iac-consistent-envs
objective: "1.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company creates its development, test, and production environments by hand in the AWS Management Console. Small configuration differences between the environments often cause failures in production.

    Which benefit of automating the environments with infrastructure as code (IaC) addresses this problem?
  fr: |
    Une entreprise crée à la main ses environnements de développement, de test et de production dans l'AWS Management Console. De petites différences de configuration entre les environnements provoquent souvent des pannes en production.

    Quel avantage de l'automatisation des environnements par l'infrastructure as code (IaC) résout ce problème ?
body:
  options:
    - id: a
      text: { en: "Lower prices for the resources that are deployed", fr: "Des prix plus bas pour les ressources déployées" }
    - id: b
      text: { en: "Environments that are created in a consistent and repeatable way", fr: "Des environnements créés de manière cohérente et reproductible" }
    - id: c
      text: { en: "Automatic transfer of security responsibilities to AWS", fr: "Le transfert automatique des responsabilités de sécurité à AWS" }
    - id: d
      text: { en: "Higher service quotas for the account", fr: "Des quotas de service plus élevés pour le compte" }
answer: { optionId: b }
explanation:
  correct:
    en: "With IaC, a template describes the resources and their settings once, and the same template creates every environment. The environments are consistent and repeatable, which removes the manual differences that caused the failures."
    fr: "Avec l'IaC, un modèle décrit une seule fois les ressources et leurs paramètres, et le même modèle crée chaque environnement. Les environnements sont cohérents et reproductibles, ce qui supprime les différences manuelles à l'origine des pannes."
  options:
    a:
      en: "Resources cost the same whether they are created by hand or from a template."
      fr: "Les ressources coûtent le même prix, qu'elles soient créées à la main ou à partir d'un modèle."
    c:
      en: "Automation does not change the shared responsibility model; the customer still secures what it deploys."
      fr: "L'automatisation ne change pas le modèle de responsabilité partagée : le client sécurise toujours ce qu'il déploie."
    d:
      en: "Service quotas are not affected by how resources are created."
      fr: "Les quotas de service ne dépendent pas de la manière dont les ressources sont créées."
references:
  - title: "What is CloudFormation? - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html
