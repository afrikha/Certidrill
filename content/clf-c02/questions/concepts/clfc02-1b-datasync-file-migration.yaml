id: clfc02-1b-datasync-file-migration
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to migrate 200 TB of files from its on-premises NFS file servers to Amazon S3 over its network connection. The transfer must be encrypted and validated automatically, without writing scripts or managing transfer infrastructure.

    Which AWS service should the company use?
  fr: |
    Une entreprise veut migrer 200 To de fichiers de ses serveurs de fichiers NFS sur site vers Amazon S3 par sa connexion réseau. Le transfert doit être chiffré et validé automatiquement, sans écrire de scripts ni gérer d'infrastructure de transfert.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Database Migration Service (AWS DMS)", fr: "AWS Database Migration Service (AWS DMS)" }
    - id: b
      text: { en: "AWS Transform MGN", fr: "AWS Transform MGN" }
    - id: c
      text: { en: "AWS DataSync", fr: "AWS DataSync" }
    - id: d
      text: { en: "Migration Evaluator", fr: "Migration Evaluator" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS DataSync is a fully managed service that moves file and object data, for example from on-premises NFS or SMB storage to Amazon S3, Amazon EFS or Amazon FSx, over the internet or AWS Direct Connect. It encrypts the data and validates its integrity automatically."
    fr: "AWS DataSync est un service entièrement géré qui déplace des données de fichiers et d'objets, par exemple d'un stockage NFS ou SMB sur site vers Amazon S3, Amazon EFS ou Amazon FSx, par internet ou AWS Direct Connect. Il chiffre les données et valide leur intégrité automatiquement."
  options:
    a:
      en: "AWS DMS migrates databases and data stores, not files from NFS file servers."
      fr: "AWS DMS migre des bases de données et des magasins de données, pas des fichiers de serveurs NFS."
    b:
      en: "AWS Transform MGN rehosts entire servers on Amazon EC2; it does not copy files into Amazon S3."
      fr: "AWS Transform MGN réhéberge des serveurs entiers sur Amazon EC2 ; il ne copie pas de fichiers dans Amazon S3."
    d:
      en: "Migration Evaluator builds a business case; it does not transfer data."
      fr: "Migration Evaluator établit une analyse de rentabilisation ; il ne transfère pas de données."
references:
  - title: "What is AWS DataSync?"
    url: https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html
