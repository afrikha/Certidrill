id: clfc02-1c-onprem-power-cooling
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company moves the workloads of its on-premises data center to Amazon EC2 instances and then closes the data center.

    Which cost does the company stop paying directly?
  fr: |
    Une entreprise déplace les charges de travail de son centre de données sur site vers des instances Amazon EC2, puis ferme le centre de données.

    Quel coût l'entreprise cesse-t-elle de payer directement ?
body:
  options:
    - id: a
      text: { en: "Storage of its Amazon EBS volumes, billed per GB-month", fr: "Le stockage de ses volumes Amazon EBS, facturé au Go-mois" }
    - id: b
      text: { en: "Electricity and cooling for its server room", fr: "L'électricité et le refroidissement de sa salle des serveurs" }
    - id: c
      text: { en: "Data transferred out from its instances to the internet", fr: "Les données transférées de ses instances vers Internet" }
    - id: d
      text: { en: "Licenses for the commercial database software that it brings to its instances", fr: "Les licences du logiciel de base de données commercial qu'elle apporte sur ses instances" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS does the heavy lifting of running data centers, including racking, stacking, and powering servers. After the move, the company no longer pays its own power and cooling bills: these costs are part of the price of the AWS services that it uses."
    fr: "AWS se charge des tâches lourdes d'exploitation des centres de données, notamment l'installation en rack et l'alimentation des serveurs. Après la migration, l'entreprise ne paie plus ses propres factures d'électricité et de refroidissement : ces coûts font partie du prix des services AWS qu'elle utilise."
  options:
    a:
      en: "Amazon EBS storage is an AWS charge that the company pays for the volumes that it provisions."
      fr: "Le stockage Amazon EBS est un coût AWS que l'entreprise paie pour les volumes qu'elle provisionne."
    c:
      en: "Data transfer out to the internet is billed by AWS, so the company still pays for it."
      fr: "Le transfert de données sortant vers Internet est facturé par AWS : l'entreprise continue donc de le payer."
    d:
      en: "With Bring Your Own License (BYOL), the company keeps paying for its licenses under the vendor's terms."
      fr: "Avec le modèle BYOL (Bring Your Own License), l'entreprise continue de payer ses licences selon les conditions de l'éditeur."
references:
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
  - title: "Design principles - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/cost-dp.html
