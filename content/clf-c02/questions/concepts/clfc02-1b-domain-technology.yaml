id: clfc02-1b-domain-technology
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company plans to use the cloud to migrate and modernize its legacy infrastructure, applications, and data and analytics platforms.

    Which AWS CAF transformation domain does this describe?
  fr: |
    Une entreprise prévoit d'utiliser le cloud pour migrer et moderniser son infrastructure, ses applications et ses plateformes de données et d'analyse héritées.

    Quel domaine de transformation AWS CAF cela décrit-il ?
body:
  options:
    - id: a
      text: { en: "Process", fr: "Processus" }
    - id: b
      text: { en: "Product", fr: "Produit" }
    - id: c
      text: { en: "Technology", fr: "Technologie" }
    - id: d
      text: { en: "Organization", fr: "Organisation" }
answer: { optionId: c }
explanation:
  correct:
    en: "The Technology transformation domain uses the cloud to migrate and modernize legacy infrastructure, applications, and data and analytics platforms. In the AWS CAF value chain, it enables the process, organization and product transformations."
    fr: "Le domaine de transformation Technologie utilise le cloud pour migrer et moderniser l'infrastructure, les applications et les plateformes de données et d'analyse héritées. Dans la chaîne de valeur AWS CAF, il rend possibles les transformations des processus, de l'organisation et des produits."
  options:
    a:
      en: "Process transformation digitizes, automates and optimizes business operations, for example with data analytics or machine learning."
      fr: "La transformation des processus numérise, automatise et optimise les opérations métier, par exemple avec l'analyse de données ou le machine learning."
    b:
      en: "Product transformation reimagines the business model with new products, services and revenue models."
      fr: "La transformation des produits réinvente le modèle d'affaires avec de nouveaux produits, services et modèles de revenus."
    d:
      en: "Organization transformation reimagines the operating model so that business and technology teams create customer value together."
      fr: "La transformation de l'organisation réinvente le modèle opérationnel pour que les équipes métier et technique créent ensemble de la valeur pour le client."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
