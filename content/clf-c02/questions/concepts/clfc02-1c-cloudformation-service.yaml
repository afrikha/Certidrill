id: clfc02-1c-cloudformation-service
objective: "1.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to describe its AWS resources in text templates and have AWS provision and configure those resources automatically.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise souhaite décrire ses ressources AWS dans des modèles au format texte et faire en sorte qu'AWS provisionne et configure automatiquement ces ressources.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" }
    - id: b
      text: { en: "Amazon CloudWatch", fr: "Amazon CloudWatch" }
    - id: c
      text: { en: "AWS Config", fr: "AWS Config" }
    - id: d
      text: { en: "AWS CloudFormation", fr: "AWS CloudFormation" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS CloudFormation uses templates that describe resources and their properties. When you create a stack from a template, CloudFormation provisions and configures the resources for you, and you manage them as a single unit."
    fr: "AWS CloudFormation utilise des modèles qui décrivent les ressources et leurs propriétés. Lorsque vous créez une pile à partir d'un modèle, CloudFormation provisionne et configure les ressources pour vous, et vous les gérez comme une seule unité."
  options:
    a:
      en: "CloudTrail records API activity in the account; it does not provision resources."
      fr: "CloudTrail enregistre l'activité des API dans le compte ; il ne provisionne pas de ressources."
    b:
      en: "CloudWatch collects metrics and logs and raises alarms; it does not create resources from templates."
      fr: "CloudWatch collecte des métriques et des journaux et déclenche des alarmes ; il ne crée pas de ressources à partir de modèles."
    c:
      en: "AWS Config records and evaluates resource configurations; it does not provision resources from templates."
      fr: "AWS Config enregistre et évalue les configurations des ressources ; il ne provisionne pas de ressources à partir de modèles."
references:
  - title: "What is CloudFormation? - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html
