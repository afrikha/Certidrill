id: clfc02-1c-patch-automation
objective: "1.4.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs 400 servers: Amazon EC2 instances and on-premises servers. Administrators install operating system patches by hand each month, and some servers are often missed. The company wants to install patches automatically on a schedule and to report which servers are missing patches.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise exécute 400 serveurs : des instances Amazon EC2 et des serveurs sur site. Les administrateurs installent à la main les correctifs du système d'exploitation chaque mois, et certains serveurs sont souvent oubliés. L'entreprise souhaite installer automatiquement les correctifs selon une planification et savoir quels serveurs ne disposent pas de tous les correctifs.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS CloudFormation", fr: "AWS CloudFormation" }
    - id: b
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: c
      text: { en: "AWS Systems Manager Patch Manager", fr: "AWS Systems Manager Patch Manager" }
    - id: d
      text: { en: "AWS Config", fr: "AWS Config" }
answer: { optionId: c }
explanation:
  correct:
    en: "Patch Manager automates patching of managed nodes, including EC2 instances and on-premises servers, with operating system and application updates. Patch policies run scans and installations on a schedule, and compliance reports show which nodes are missing patches, so no server is forgotten."
    fr: "Patch Manager automatise l'application de correctifs aux nœuds gérés, y compris les instances EC2 et les serveurs sur site, avec des mises à jour du système d'exploitation et des applications. Les politiques de correctifs exécutent des analyses et des installations selon une planification, et les rapports de conformité indiquent les nœuds auxquels il manque des correctifs : aucun serveur n'est oublié."
  options:
    a:
      en: "CloudFormation provisions and updates resources from templates; it does not install operating system patches on a schedule."
      fr: "CloudFormation provisionne et met à jour des ressources à partir de modèles ; il n'installe pas de correctifs du système d'exploitation selon une planification."
    b:
      en: "Amazon Inspector finds software vulnerabilities, but it does not install the patches."
      fr: "Amazon Inspector détecte des vulnérabilités logicielles, mais il n'installe pas les correctifs."
    d:
      en: "AWS Config records and evaluates resource configurations; it does not install patches."
      fr: "AWS Config enregistre et évalue les configurations des ressources ; il n'installe pas de correctifs."
references:
  - title: "AWS Systems Manager Patch Manager - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager.html
