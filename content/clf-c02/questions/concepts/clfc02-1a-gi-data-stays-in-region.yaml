id: clfc02-1a-gi-data-stays-in-region
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A European bank must keep its customer data stored in a specific country to meet legal requirements. The bank plans to use an AWS Region in that country. Which characteristic of the AWS global infrastructure helps the bank meet this requirement?
  fr: |
    Une banque européenne doit conserver les données de ses clients dans un pays précis pour respecter des exigences légales. La banque prévoit d'utiliser une Région AWS située dans ce pays. Quelle caractéristique de l'infrastructure mondiale AWS aide la banque à respecter cette exigence ?
body:
  options:
    - id: a
      text: { en: "AWS automatically replicates data to a second Region on another continent for durability.", fr: "AWS réplique automatiquement les données dans une deuxième Région sur un autre continent pour leur durabilité." }
    - id: b
      text: { en: "Data created in a Region does not exist in other Regions unless the customer explicitly replicates or copies it.", fr: "Les données créées dans une Région n'existent dans aucune autre Région, sauf si le client les réplique ou les copie explicitement." }
    - id: c
      text: { en: "Each Availability Zone of a Region is located in a different country.", fr: "Chaque zone de disponibilité d'une Région se trouve dans un pays différent." }
    - id: d
      text: { en: "Edge locations keep a permanent copy of all customer data in each country.", fr: "Les emplacements périphériques conservent une copie permanente de toutes les données des clients dans chaque pays." }
answer: { optionId: b }
explanation:
  correct:
    en: "The resources and data created in one Region do not exist in any other Region unless the customer uses a replication or copy feature or copies them itself. Choosing a Region in the required country therefore keeps the data there unless the bank decides to copy it elsewhere."
    fr: "Les ressources et les données créées dans une Région n'existent dans aucune autre Région, sauf si le client utilise une fonctionnalité de réplication ou de copie ou les copie lui-même. Choisir une Région dans le pays exigé permet donc d'y conserver les données, sauf si la banque décide de les copier ailleurs."
  options:
    a:
      en: "AWS does not replicate data to another Region on its own; cross-Region replication is a choice the customer makes."
      fr: "AWS ne réplique pas de lui-même les données dans une autre Région ; la réplication entre Régions est un choix du client."
    c:
      en: "The Availability Zones of a Region are close to each other: they are many kilometers apart, but all within 100 km of each other."
      fr: "Les zones de disponibilité d'une Région sont proches les unes des autres : elles sont séparées de plusieurs kilomètres, mais toutes à moins de 100 km les unes des autres."
    d:
      en: "Edge locations cache content that customers choose to deliver through services such as CloudFront; they do not store a copy of all data."
      fr: "Les emplacements périphériques mettent en cache le contenu que les clients choisissent de diffuser avec des services comme CloudFront ; ils ne stockent pas une copie de toutes les données."
references:
  - title: "Regions"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/regions.html
  - title: "Global Infrastructure Regions & AZs"
    url: https://aws.amazon.com/about-aws/global-infrastructure/regions_az/
