id: clfc02-1b-dms-ongoing-replication
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is migrating a busy on-premises MySQL database to Amazon RDS for MySQL. The database must stay available to users during the migration, and the final cutover must take only minutes.

    Which approach meets these requirements?
  fr: |
    Une entreprise migre une base de données MySQL sur site très sollicitée vers Amazon RDS for MySQL. La base de données doit rester disponible pour les utilisateurs pendant la migration, et la bascule finale ne doit durer que quelques minutes.

    Quelle approche répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use AWS DMS Schema Conversion to convert the MySQL schema for Amazon RDS for MySQL.", fr: "Utiliser AWS DMS Schema Conversion pour convertir le schéma MySQL pour Amazon RDS for MySQL." }
    - id: b
      text: { en: "Stop the database, export a backup file, and restore it into the new DB instance.", fr: "Arrêter la base de données, exporter un fichier de sauvegarde, puis le restaurer dans la nouvelle instance." }
    - id: c
      text: { en: "Use AWS Transform MGN to replicate the database server to an Amazon EC2 instance.", fr: "Utiliser AWS Transform MGN pour répliquer le serveur de base de données vers une instance Amazon EC2." }
    - id: d
      text: { en: "Use AWS DMS to perform a full load and then replicate ongoing changes until cutover.", fr: "Utiliser AWS DMS pour effectuer un chargement complet, puis répliquer les modifications en cours jusqu'à la bascule." }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS DMS can run a one-time migration and also replicate ongoing changes so that the source and target stay in sync. The source database stays in use during the migration, and the cutover only needs to switch the application to the RDS DB instance."
    fr: "AWS DMS peut effectuer une migration ponctuelle et aussi répliquer les modifications en cours pour garder la source et la cible synchronisées. La base de données source reste utilisée pendant la migration, et la bascule consiste seulement à faire pointer l'application vers l'instance RDS."
  options:
    a:
      en: "Schema conversion is needed when the target engine is different; MySQL to RDS for MySQL uses the same engine, and conversion does not move the data."
      fr: "La conversion de schéma est nécessaire quand le moteur cible est différent ; de MySQL vers RDS for MySQL, le moteur est le même, et la conversion ne déplace pas les données."
    b:
      en: "Stopping the database for an export and restore makes it unavailable for the whole copy, which can take far longer than minutes."
      fr: "Arrêter la base de données pour une exportation et une restauration la rend indisponible pendant toute la copie, ce qui peut durer bien plus que quelques minutes."
    c:
      en: "AWS Transform MGN rehosts whole servers on Amazon EC2; the target here is Amazon RDS, a managed database service."
      fr: "AWS Transform MGN réhéberge des serveurs entiers sur Amazon EC2 ; la cible est ici Amazon RDS, un service de base de données géré."
references:
  - title: "What is AWS Database Migration Service?"
    url: https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html
