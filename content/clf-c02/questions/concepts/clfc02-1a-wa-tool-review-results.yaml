id: clfc02-1a-wa-tool-review-results
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company completes a workload review in the AWS Well-Architected Tool. Which results does the tool provide? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise termine la revue d'une charge de travail dans AWS Well-Architected Tool. Quels résultats l'outil fournit-il ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Automatic remediation of the resources that have issues", fr: "La correction automatique des ressources qui présentent des problèmes" }
    - id: b
      text: { en: "High risk issues and medium risk issues identified for the workload", fr: "Les problèmes à risque élevé et à risque moyen identifiés pour la charge de travail" }
    - id: c
      text: { en: "Audit reports from third-party auditors, such as SOC reports", fr: "Des rapports d'audit de tiers, tels que les rapports SOC" }
    - id: d
      text: { en: "An improvement plan with a prioritized list of issues", fr: "Un plan d'amélioration avec une liste de problèmes classés par priorité" }
    - id: e
      text: { en: "A guaranteed reduction of the monthly AWS bill", fr: "Une réduction garantie de la facture AWS mensuelle" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The tool evaluates the answers of each pillar and identifies high risk issues (HRIs) and medium risk issues (MRIs), which come from best practices that are not followed. It then produces an improvement plan with a prioritized list of issues for the workload."
    fr: "L'outil évalue les réponses de chaque pilier et identifie les problèmes à risque élevé (HRI) et à risque moyen (MRI), qui proviennent des bonnes pratiques non suivies. Il produit ensuite un plan d'amélioration avec une liste de problèmes classés par priorité pour la charge de travail."
  options:
    a:
      en: "The tool documents and measures the workload; the team decides and makes the changes."
      fr: "L'outil documente et évalue la charge de travail ; c'est l'équipe qui décide et effectue les modifications."
    c:
      en: "Third-party audit reports about AWS, such as SOC reports, are downloaded from AWS Artifact."
      fr: "Les rapports d'audit de tiers sur AWS, comme les rapports SOC, se téléchargent dans AWS Artifact."
    e:
      en: "The review can reveal cost optimization opportunities, but it guarantees no saving."
      fr: "La revue peut révéler des possibilités d'optimisation des coûts, mais elle ne garantit aucune économie."
references:
  - title: "AWS Well-Architected Tool FAQs"
    url: https://aws.amazon.com/well-architected-tool/faqs/
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
