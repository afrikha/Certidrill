id: clfc02-1a-wa-review-timing
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    According to AWS guidance, when should a team review a workload with the AWS Well-Architected Framework?
  fr: |
    Selon les recommandations d'AWS, quand une équipe doit-elle examiner une charge de travail avec le cadre AWS Well-Architected ?
body:
  options:
    - id: a
      text: { en: "At key milestones, starting early in the design phase and again before go-live", fr: "Aux étapes clés, dès le début de la phase de conception puis de nouveau avant la mise en production" }
    - id: b
      text: { en: "Only after a production incident, to find the root cause of the incident", fr: "Seulement après un incident de production, pour trouver la cause première de l'incident" }
    - id: c
      text: { en: "Only after the workload has run in production for at least one year", fr: "Seulement après au moins un an d'exécution de la charge de travail en production" }
    - id: d
      text: { en: "Only when AWS Support opens a case that requests a review", fr: "Seulement lorsque le support AWS ouvre un dossier qui demande une revue" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS recommends reviews at key milestones of the product lifecycle: early in the design phase, to avoid one-way-door decisions that are hard to change, and then before the go-live date. After go-live, significant architecture changes should also include a review."
    fr: "AWS recommande des revues aux étapes clés du cycle de vie du produit : tôt dans la phase de conception, pour éviter des décisions irréversibles (« portes à sens unique ») difficiles à changer, puis avant la date de mise en production. Après la mise en production, les changements importants d'architecture doivent aussi faire l'objet d'une revue."
  options:
    b:
      en: "Waiting for an incident misses the main goal: finding risks early, when they are cheapest to fix."
      fr: "Attendre un incident fait manquer l'objectif principal : trouver les risques tôt, lorsqu'ils coûtent le moins cher à corriger."
    c:
      en: "Reviewing only after a year in production leaves design decisions, including one-way doors, unreviewed."
      fr: "N'examiner la charge de travail qu'après un an en production laisse les décisions de conception, y compris les décisions irréversibles, sans revue."
    d:
      en: "Reviews are run by the team, possibly with a partner; they do not depend on a request from AWS Support."
      fr: "Les revues sont menées par l'équipe, éventuellement avec un partenaire ; elles ne dépendent pas d'une demande du support AWS."
references:
  - title: "The review process"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/the-review-process.html
