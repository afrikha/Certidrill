id: clfc02-1a-diff-oe-lessons-learned
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After each operational event, a team analyzes what happened and shares the lessons learned with the other teams of the organization. Which pillar of the AWS Well-Architected Framework includes this practice?
  fr: |
    Après chaque événement opérationnel, une équipe analyse ce qui s'est passé et partage les enseignements tirés avec les autres équipes de l'organisation. Quel pilier du cadre AWS Well-Architected comprend cette pratique ?
body:
  options:
    - id: a
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
    - id: b
      text: { en: "Reliability", fr: "Fiabilité" }
    - id: c
      text: { en: "Security", fr: "Sécurité" }
    - id: d
      text: { en: "Performance efficiency", fr: "Efficacité des performances" }
answer: { optionId: a }
explanation:
  correct:
    en: "\"Learn from all operational events and metrics\" is a design principle of the operational excellence pillar: teams drive improvement from lessons learned and share them across the organization."
    fr: "« Tirer des enseignements de tous les événements et indicateurs opérationnels » est un principe de conception du pilier excellence opérationnelle : les équipes s'améliorent grâce aux enseignements tirés et les partagent dans toute l'organisation."
  options:
    b:
      en: "Reliability designs the workload to withstand and recover from failures; learning from operational events to improve operations is operational excellence."
      fr: "La fiabilité conçoit la charge de travail pour résister aux défaillances et récupérer ; tirer des enseignements des événements opérationnels pour améliorer les opérations relève de l'excellence opérationnelle."
    c:
      en: "Security prepares for security incidents; the scenario is about all operational events."
      fr: "La sécurité prépare aux incidents de sécurité ; le scénario concerne tous les événements opérationnels."
    d:
      en: "Performance efficiency is about meeting performance requirements with the right resources."
      fr: "L'efficacité des performances vise à répondre aux exigences de performance avec les bonnes ressources."
references:
  - title: "Design principles"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/oe-design-principles.html
