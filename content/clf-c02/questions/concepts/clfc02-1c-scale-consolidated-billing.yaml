id: clfc02-1c-scale-consolidated-billing
objective: "1.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 12 AWS accounts. Each account uses a small amount of Amazon S3 storage and data transfer, so no account reaches the lower-priced volume tiers on its own. The company wants the usage of all its accounts to count together toward these tiers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 12 comptes AWS. Chaque compte utilise une petite quantité de stockage Amazon S3 et de transfert de données : aucun compte n'atteint seul les paliers de volume moins chers. L'entreprise souhaite que l'utilisation de tous ses comptes soit cumulée pour atteindre ces paliers.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS Budgets budget in each account", fr: "Créer un budget AWS Budgets dans chaque compte" }
    - id: b
      text: { en: "Activate cost allocation tags in each account", fr: "Activer des balises de répartition des coûts dans chaque compte" }
    - id: c
      text: { en: "Create an AWS Cost and Usage Report in each account", fr: "Créer un AWS Cost and Usage Report dans chaque compte" }
    - id: d
      text: { en: "Group the accounts in AWS Organizations to use consolidated billing", fr: "Regrouper les comptes dans AWS Organizations pour utiliser la facturation consolidée" }
answer: { optionId: d }
explanation:
  correct:
    en: "With consolidated billing in AWS Organizations, the usage of all accounts in the organization is combined, so volume pricing discounts are shared. The accounts reach the lower-priced tiers together, and consolidated billing has no additional cost."
    fr: "Avec la facturation consolidée d'AWS Organizations, l'utilisation de tous les comptes de l'organisation est cumulée : les remises sur volume sont donc partagées. Les comptes atteignent ensemble les paliers moins chers, et la facturation consolidée n'entraîne aucun coût supplémentaire."
  options:
    a:
      en: "Budgets send alerts on cost or usage thresholds; they do not combine the usage of accounts for pricing."
      fr: "Les budgets envoient des alertes sur des seuils de coûts ou d'utilisation ; ils ne cumulent pas l'utilisation des comptes pour la tarification."
    b:
      en: "Cost allocation tags organize costs in reports; they do not change the prices that apply."
      fr: "Les balises de répartition des coûts organisent les coûts dans les rapports ; elles ne modifient pas les prix appliqués."
    c:
      en: "The Cost and Usage Report gives detailed cost and usage data; it does not combine accounts for volume pricing."
      fr: "Le Cost and Usage Report fournit des données détaillées de coûts et d'utilisation ; il ne cumule pas les comptes pour la tarification par volume."
references:
  - title: "Consolidating billing for AWS Organizations - AWS Billing"
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/consolidated-billing.html
