id: clfc02-1b-transform-agentic
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants AI agents to discover its VMware servers, plan migration waves, set up a landing zone and rehost the servers on Amazon EC2, with no additional charge for the service itself.

    Which AWS service should the company use?
  fr: |
    Une entreprise veut que des agents d'IA découvrent ses serveurs VMware, planifient les vagues de migration, configurent une zone d'atterrissage (landing zone) et réhébergent les serveurs sur Amazon EC2, sans frais supplémentaires pour le service lui-même.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Amazon SageMaker AI", fr: "Amazon SageMaker AI" }
    - id: b
      text: { en: "AWS Transform", fr: "AWS Transform" }
    - id: c
      text: { en: "AWS Database Migration Service (AWS DMS)", fr: "AWS Database Migration Service (AWS DMS)" }
    - id: d
      text: { en: "Migration Evaluator", fr: "Migration Evaluator" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Transform uses specialized AI agents to accelerate migration and modernization. For VMware and other servers, it covers discovery, migration wave planning, landing zone creation, network migration and server rehost on Amazon EC2, and there is no additional charge to use the service."
    fr: "AWS Transform utilise des agents d'IA spécialisés pour accélérer la migration et la modernisation. Pour les serveurs VMware et autres, il couvre la découverte, la planification des vagues de migration, la création de la zone d'atterrissage, la migration du réseau et le réhébergement des serveurs sur Amazon EC2, et son utilisation n'entraîne aucuns frais supplémentaires."
  options:
    a:
      en: "SageMaker AI is used to build, train and deploy machine learning models, not to migrate servers."
      fr: "SageMaker AI sert à créer, entraîner et déployer des modèles de machine learning, pas à migrer des serveurs."
    c:
      en: "AWS DMS migrates databases and data stores, not whole servers with wave planning and landing zones."
      fr: "AWS DMS migre des bases de données et des magasins de données, pas des serveurs entiers avec planification des vagues et zone d'atterrissage."
    d:
      en: "Migration Evaluator builds a business case with projected AWS costs; it does not migrate servers."
      fr: "Migration Evaluator établit une analyse de rentabilisation avec les coûts AWS projetés ; il ne migre pas de serveurs."
references:
  - title: "What is AWS Transform?"
    url: https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html
