id: clfc02-1a-wa-review-nature
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement describes a Well-Architected review as AWS recommends conducting it?
  fr: |
    Quelle affirmation décrit une revue Well-Architected telle qu'AWS recommande de la mener ?
body:
  options:
    - id: a
      text: { en: "A formal audit by AWS that ends with a compliance certificate for the workload", fr: "Un audit formel mené par AWS qui se termine par un certificat de conformité pour la charge de travail" }
    - id: b
      text: { en: "An automated scan that changes the resources that do not follow best practices", fr: "Une analyse automatique qui modifie les ressources qui ne suivent pas les bonnes pratiques" }
    - id: c
      text: { en: "A one-time assessment that is required only before a workload migrates to AWS", fr: "Une évaluation unique, exigée seulement avant la migration d'une charge de travail vers AWS" }
    - id: d
      text: { en: "A lightweight, blame-free conversation about the architecture that is not an audit", fr: "Une conversation légère et sans recherche de coupable sur l'architecture, qui n'est pas un audit" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS recommends a consistent, blame-free review that encourages diving deep: a lightweight process measured in hours, not days, and a conversation rather than an audit. Its outcome is a set of actions to improve the workload."
    fr: "AWS recommande une revue cohérente, sans recherche de coupable, qui encourage l'analyse approfondie : un processus léger qui se mesure en heures et non en jours, et une conversation plutôt qu'un audit. Elle aboutit à une liste d'actions pour améliorer la charge de travail."
  options:
    a:
      en: "A Well-Architected review is explicitly not an audit and does not certify compliance."
      fr: "Une revue Well-Architected n'est explicitement pas un audit et ne certifie pas la conformité."
    b:
      en: "The review identifies issues for the team to prioritize; it does not modify resources."
      fr: "La revue identifie des problèmes que l'équipe priorise ; elle ne modifie pas de ressources."
    c:
      en: "Reviews are repeated at key milestones throughout the lifecycle, and AWS recommends that teams review their architecture nearly continuously."
      fr: "Les revues sont répétées aux étapes clés du cycle de vie, et AWS recommande aux équipes d'examiner leur architecture de façon quasi continue."
references:
  - title: "The review process"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/the-review-process.html
