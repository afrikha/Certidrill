id: clfc02-1b-caf-phase-envision
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is starting its cloud transformation. Its leaders want to identify and prioritize transformation opportunities and link each one to a measurable business outcome.

    Which phase of the AWS Cloud Adoption Framework (AWS CAF) transformation journey does this describe?
  fr: |
    Une entreprise commence sa transformation vers le cloud. Ses dirigeants veulent identifier et hiérarchiser les opportunités de transformation, et relier chacune d'elles à un résultat métier mesurable.

    Quelle phase du parcours de transformation du Framework d'adoption du Cloud AWS (AWS CAF) cela décrit-il ?
body:
  options:
    - id: a
      text: { en: "Align", fr: "Aligner (Align)" }
    - id: b
      text: { en: "Envision", fr: "Envisager (Envision)" }
    - id: c
      text: { en: "Launch", fr: "Lancer (Launch)" }
    - id: d
      text: { en: "Scale", fr: "Mettre à l'échelle (Scale)" }
answer: { optionId: b }
explanation:
  correct:
    en: "In the Envision phase, the organization identifies and prioritizes transformation opportunities and connects them to key stakeholders and measurable business outcomes. It is the first of the four iterative phases of the AWS CAF journey."
    fr: "Pendant la phase Envisager (Envision), l'organisation identifie et hiérarchise les opportunités de transformation, puis les relie aux parties prenantes clés et à des résultats métier mesurables. C'est la première des quatre phases itératives du parcours AWS CAF."
  options:
    a:
      en: "Align identifies capability gaps and cross-organizational dependencies to improve cloud readiness; it comes after the opportunities are identified."
      fr: "La phase Aligner (Align) identifie les lacunes de capacités et les dépendances entre services pour améliorer la préparation au cloud ; elle suit l'identification des opportunités."
    c:
      en: "Launch delivers pilot initiatives in production to show incremental business value."
      fr: "La phase Lancer (Launch) met en production des initiatives pilotes pour démontrer une valeur métier progressive."
    d:
      en: "Scale expands successful pilots to the desired scale and makes sure the benefits are sustained."
      fr: "La phase Mettre à l'échelle (Scale) étend les pilotes réussis à l'échelle voulue et garantit que les bénéfices durent."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
