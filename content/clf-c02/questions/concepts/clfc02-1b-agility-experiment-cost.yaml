id: clfc02-1b-agility-experiment-cost
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's developers want to test many new product ideas. On premises, each test needs servers that take weeks to arrive, and the hardware stays when an idea fails.

    Which advantage of cloud computing lowers the cost and time of these experiments?
  fr: |
    Les développeurs d'une entreprise veulent tester de nombreuses idées de produits. Sur site, chaque test exige des serveurs qui mettent des semaines à arriver, et le matériel reste quand une idée échoue.

    Quel avantage du cloud computing réduit le coût et la durée de ces expériences ?
body:
  options:
    - id: a
      text: { en: "Increase speed and agility", fr: "Gagner en rapidité et en agilité" }
    - id: b
      text: { en: "Stop spending money running and maintaining data centers", fr: "Ne plus dépenser d'argent pour exploiter et entretenir des centres de données" }
    - id: c
      text: { en: "Go global in minutes", fr: "Se déployer dans le monde entier en quelques minutes" }
    - id: d
      text: { en: "Benefit from massive economies of scale", fr: "Bénéficier d'économies d'échelle massives" }
answer: { optionId: a }
explanation:
  correct:
    en: "Increase speed and agility: new IT resources are only a click away, so the time to make them available drops from weeks to minutes. The cost and time to experiment are much lower, because resources for a failed idea can simply be removed."
    fr: "Gagner en rapidité et en agilité : de nouvelles ressources informatiques sont disponibles en un clic, et le délai de mise à disposition passe de quelques semaines à quelques minutes. Le coût et la durée des expérimentations baissent fortement, car les ressources d'une idée abandonnée peuvent simplement être supprimées."
  options:
    b:
      en: "This advantage frees staff from data center work; it does not directly address provisioning time for experiments."
      fr: "Cet avantage libère le personnel du travail sur les centres de données ; il ne traite pas directement le délai de provisionnement des expériences."
    c:
      en: "Going global is about deploying in Regions worldwide for lower latency, not about experimenting quickly."
      fr: "Le déploiement mondial consiste à se déployer dans des Régions du monde entier pour réduire la latence, pas à expérimenter rapidement."
    d:
      en: "Economies of scale lower AWS's prices, but they do not explain the faster, disposable resources that experiments need."
      fr: "Les économies d'échelle font baisser les prix d'AWS, mais elles n'expliquent pas les ressources plus rapides et jetables dont les expériences ont besoin."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
