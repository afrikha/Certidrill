id: clfc02-1a-experiment-low-risk
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to test a new product idea quickly. If the idea fails, the company wants to stop with a minimal financial loss. Which characteristic of the AWS Cloud makes this possible?
  fr: |
    Une entreprise veut tester rapidement une nouvelle idée de produit. Si l'idée échoue, elle veut arrêter avec une perte financière minimale. Quelle caractéristique du Cloud AWS rend cela possible ?
body:
  options:
    - id: a
      text: { en: "AWS refunds the cost of the resources that failed projects used.", fr: "AWS rembourse le coût des ressources utilisées par les projets qui échouent." }
    - id: b
      text: { en: "Resources can be created in minutes and deleted after the test, and the company pays only while they run.", fr: "Les ressources peuvent être créées en quelques minutes et supprimées après le test, et l'entreprise ne paie que pendant leur fonctionnement." }
    - id: c
      text: { en: "AWS requires a one-year contract that covers several experiments at a fixed price.", fr: "AWS exige un contrat d'un an qui couvre plusieurs expérimentations à prix fixe." }
    - id: d
      text: { en: "Every AWS Support plan includes a free test environment for new projects.", fr: "Chaque plan AWS Support comprend un environnement de test gratuit pour les nouveaux projets." }
answer: { optionId: b }
explanation:
  correct:
    en: "New resources are available in minutes, which lowers the cost and time of experimenting. With pay-as-you-go pricing, the company pays only for the services it uses, for as long as it uses them, with no long-term contract or termination fee when it stops."
    fr: "De nouvelles ressources sont disponibles en quelques minutes, ce qui réduit le coût et le temps des expérimentations. Avec la tarification à l'utilisation, l'entreprise ne paie que les services qu'elle utilise, pendant la durée où elle les utilise, sans contrat à long terme ni frais de résiliation lorsqu'elle arrête."
  options:
    a:
      en: "AWS does not refund resources because a project failed; the company limits its loss by deleting resources it no longer needs."
      fr: "AWS ne rembourse pas les ressources parce qu'un projet a échoué ; l'entreprise limite sa perte en supprimant les ressources dont elle n'a plus besoin."
    c:
      en: "Pay-as-you-go pricing needs no long-term contract; commitments such as Savings Plans are optional discounts."
      fr: "La tarification à l'utilisation ne nécessite aucun contrat à long terme ; les engagements comme les Savings Plans sont des remises facultatives."
    d:
      en: "Support plans provide technical support, not free resources for testing."
      fr: "Les plans de support fournissent une assistance technique, pas des ressources gratuites pour les tests."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
  - title: "AWS Product and Service Pricing"
    url: https://aws.amazon.com/pricing/
