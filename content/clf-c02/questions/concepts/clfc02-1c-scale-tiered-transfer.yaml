id: clfc02-1c-scale-tiered-transfer
objective: "1.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A video company sends more and more data from AWS to its viewers on the internet each month.

    Which AWS pricing characteristic lowers the price per GB of this data transfer as the monthly volume grows?
  fr: |
    Une entreprise de vidéo envoie chaque mois de plus en plus de données d'AWS vers ses spectateurs sur Internet.

    Quelle caractéristique de la tarification AWS réduit le prix par Go de ce transfert de données à mesure que le volume mensuel augmente ?
body:
  options:
    - id: a
      text: { en: "Spot pricing", fr: "La tarification Spot" }
    - id: b
      text: { en: "Tiered pricing, where the price per GB decreases at higher volumes", fr: "La tarification par paliers, où le prix par Go diminue pour les volumes plus élevés" }
    - id: c
      text: { en: "The AWS Free Tier", fr: "L'offre gratuite AWS (AWS Free Tier)" }
    - id: d
      text: { en: "Compute Savings Plans", fr: "Les Compute Savings Plans" }
answer: { optionId: b }
explanation:
  correct:
    en: "For outbound data transfer, AWS uses tiered pricing: the more data you transfer, the less you pay per GB. The company gets a lower unit price as its volume grows, without any commitment."
    fr: "Pour le transfert de données sortant, AWS applique une tarification par paliers : plus vous transférez de données, moins vous payez par Go. L'entreprise obtient un prix unitaire plus bas à mesure que son volume augmente, sans aucun engagement."
  options:
    a:
      en: "Spot pricing applies to spare EC2 capacity, not to data transfer."
      fr: "La tarification Spot s'applique à la capacité EC2 inutilisée, pas au transfert de données."
    c:
      en: "The Free Tier offers limited free usage; it does not lower the price per GB as volume grows."
      fr: "L'offre gratuite propose une utilisation gratuite limitée ; elle ne réduit pas le prix par Go à mesure que le volume augmente."
    d:
      en: "Compute Savings Plans lower compute prices in exchange for a commitment; they do not apply to data transfer."
      fr: "Les Compute Savings Plans réduisent le prix du calcul en échange d'un engagement ; ils ne s'appliquent pas au transfert de données."
references:
  - title: "Key principles - How AWS Pricing Works"
    url: https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/key-principles.html
