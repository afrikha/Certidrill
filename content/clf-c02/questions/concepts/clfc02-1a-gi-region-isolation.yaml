id: clfc02-1a-gi-region-isolation
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement about AWS Regions is correct?
  fr: |
    Quelle affirmation sur les Régions AWS est correcte ?
body:
  options:
    - id: a
      text: { en: "Each Region is isolated and independent from other Regions, which limits a service failure to a single Region.", fr: "Chaque Région est isolée et indépendante des autres Régions, ce qui limite une défaillance de service à une seule Région." }
    - id: b
      text: { en: "Each Region contains exactly one Availability Zone.", fr: "Chaque Région contient exactement une zone de disponibilité." }
    - id: c
      text: { en: "A Region is a single data center in a city.", fr: "Une Région est un centre de données unique situé dans une ville." }
    - id: d
      text: { en: "Regions are connected to each other only over the public internet.", fr: "Les Régions sont reliées entre elles uniquement par l'Internet public." }
answer: { optionId: a }
explanation:
  correct:
    en: "The physical infrastructure and software services of a Region are isolated and independent from other Regions, with a few exceptions. This separation limits a service failure to one Region while other Regions operate normally."
    fr: "L'infrastructure physique et les services logiciels d'une Région sont isolés et indépendants des autres Régions, à quelques exceptions près. Cette séparation limite une défaillance de service à une seule Région, tandis que les autres Régions fonctionnent normalement."
  options:
    b:
      en: "Each Region has at least three Availability Zones."
      fr: "Chaque Région compte au moins trois zones de disponibilité."
    c:
      en: "A Region contains multiple Availability Zones, each made of one or more discrete data centers."
      fr: "Une Région contient plusieurs zones de disponibilité, chacune composée d'un ou plusieurs centres de données distincts."
    d:
      en: "Regions are interconnected through the AWS Global Network, which provides private fiber-optic connectivity."
      fr: "Les Régions sont reliées par le réseau mondial AWS (AWS Global Network), qui fournit une connectivité privée par fibre optique."
references:
  - title: "Regions"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/regions.html
