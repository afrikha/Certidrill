id: clfc02-1a-adv-stop-running-data-centers
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants its IT staff to work on projects that differentiate the business instead of racking, stacking, and powering servers. Which advantage of cloud computing does this describe?
  fr: |
    Une entreprise veut que son personnel informatique travaille sur des projets qui la différencient au lieu d'installer, d'empiler et d'alimenter des serveurs. Quel avantage du cloud computing cela décrit-il ?
body:
  options:
    - id: a
      text: { en: "Stop spending money running and maintaining data centers", fr: "Arrêter de dépenser de l'argent pour exploiter et entretenir des centres de données" }
    - id: b
      text: { en: "Benefit from massive economies of scale", fr: "Bénéficier d'économies d'échelle massives" }
    - id: c
      text: { en: "Go global in minutes", fr: "Se déployer dans le monde entier en quelques minutes" }
    - id: d
      text: { en: "Stop guessing capacity", fr: "Arrêter de deviner la capacité nécessaire" }
answer: { optionId: a }
explanation:
  correct:
    en: "Cloud computing lets a company focus on projects that differentiate its business and on its customers, rather than on the heavy lifting of racking, stacking, and powering servers, which AWS handles."
    fr: "Le cloud computing permet à une entreprise de se concentrer sur les projets qui différencient son activité et sur ses clients, plutôt que sur les tâches lourdes d'installation, d'empilage et d'alimentation des serveurs, qu'AWS prend en charge."
  options:
    b:
      en: "This advantage explains AWS's lower pay-as-you-go prices: the usage of hundreds of thousands of customers is aggregated."
      fr: "Cet avantage explique les prix à l'utilisation plus bas d'AWS : l'utilisation de centaines de milliers de clients est regroupée."
    c:
      en: "This advantage is about deploying in several Regions around the world in a few clicks to lower latency for customers."
      fr: "Cet avantage consiste à déployer dans plusieurs Régions du monde en quelques clics pour réduire la latence pour les clients."
    d:
      en: "This advantage is about scaling capacity up and down as needed instead of deciding it before deployment."
      fr: "Cet avantage consiste à augmenter et réduire la capacité selon les besoins au lieu de la fixer avant le déploiement."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
