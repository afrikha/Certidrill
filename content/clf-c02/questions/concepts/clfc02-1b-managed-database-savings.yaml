id: clfc02-1b-managed-database-savings
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs self-managed databases on its own servers. Its staff spend many hours installing patches, taking backups and maintaining the database servers.

    Which migration option will reduce these operational costs the MOST?
  fr: |
    Une entreprise exécute des bases de données autogérées sur ses propres serveurs. Son personnel passe de nombreuses heures à installer des correctifs, à effectuer des sauvegardes et à entretenir les serveurs de base de données.

    Quelle option de migration réduira le PLUS ces coûts opérationnels ?
body:
  options:
    - id: a
      text: { en: "Move the databases to Amazon EC2 instances that run the same database software.", fr: "Déplacer les bases de données vers des instances Amazon EC2 qui exécutent le même logiciel de base de données." }
    - id: b
      text: { en: "Move the databases to Amazon RDS, which automates patching and backups.", fr: "Déplacer les bases de données vers Amazon RDS, qui automatise l'application des correctifs et les sauvegardes." }
    - id: c
      text: { en: "Move the databases to larger on-premises servers to reduce the number of servers.", fr: "Déplacer les bases de données vers des serveurs sur site plus puissants pour réduire le nombre de serveurs." }
    - id: d
      text: { en: "Move the databases to Amazon EC2 Dedicated Hosts to keep the same server layout.", fr: "Déplacer les bases de données vers des Amazon EC2 Dedicated Hosts pour garder la même disposition des serveurs." }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon RDS is a managed database service: AWS handles tasks such as provisioning, operating system and database patching, and automated backups. Moving to a managed service removes much of the staff time spent on undifferentiated database administration."
    fr: "Amazon RDS est un service de base de données géré : AWS prend en charge des tâches comme le provisionnement, l'application des correctifs au système d'exploitation et à la base de données, et les sauvegardes automatisées. Passer à un service géré supprime une grande partie du temps que le personnel consacre à l'administration courante des bases de données."
  options:
    a:
      en: "On Amazon EC2, the customer still patches the operating system and the database software and manages backups."
      fr: "Sur Amazon EC2, le client applique toujours les correctifs au système d'exploitation et au logiciel de base de données, et gère les sauvegardes."
    c:
      en: "Larger on-premises servers still need the same patching, backups and maintenance work."
      fr: "Des serveurs sur site plus puissants exigent toujours le même travail de correctifs, de sauvegardes et d'entretien."
    d:
      en: "Dedicated Hosts are physical servers for the customer's instances; the customer still manages the database software on them."
      fr: "Les Dedicated Hosts sont des serveurs physiques réservés aux instances du client ; celui-ci gère toujours le logiciel de base de données."
references:
  - title: "What is Amazon Relational Database Service (Amazon RDS)?"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html
