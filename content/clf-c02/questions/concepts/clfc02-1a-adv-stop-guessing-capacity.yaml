id: clfc02-1a-adv-stop-guessing-capacity
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every year, a retailer buys enough servers for its holiday peak, and most of these servers sit idle for the rest of the year. Which advantage of cloud computing addresses this problem?
  fr: |
    Chaque année, un détaillant achète suffisamment de serveurs pour son pic des fêtes, et la plupart de ces serveurs restent inutilisés le reste de l'année. Quel avantage du cloud computing répond à ce problème ?
body:
  options:
    - id: a
      text: { en: "Increase speed and agility", fr: "Gagner en rapidité et en agilité" }
    - id: b
      text: { en: "Stop guessing capacity", fr: "Arrêter de deviner la capacité nécessaire" }
    - id: c
      text: { en: "Go global in minutes", fr: "Se déployer dans le monde entier en quelques minutes" }
    - id: d
      text: { en: "Benefit from massive economies of scale", fr: "Bénéficier d'économies d'échelle massives" }
answer: { optionId: b }
explanation:
  correct:
    en: "A capacity decision made before deployment often leaves expensive idle resources or limited capacity. In the cloud, the retailer can use as much or as little capacity as it needs and scale up and down with only a few minutes' notice."
    fr: "Une décision de capacité prise avant le déploiement laisse souvent des ressources coûteuses inutilisées ou une capacité insuffisante. Dans le cloud, le détaillant peut utiliser autant ou aussi peu de capacité que nécessaire et l'augmenter ou la réduire en quelques minutes."
  options:
    a:
      en: "This advantage is about getting new resources in minutes instead of weeks, which lowers the cost and time of experimenting."
      fr: "Cet avantage consiste à obtenir de nouvelles ressources en quelques minutes au lieu de plusieurs semaines, ce qui réduit le coût et le temps des expérimentations."
    c:
      en: "This advantage is about deploying in several Regions around the world in a few clicks to lower latency for customers."
      fr: "Cet avantage consiste à déployer dans plusieurs Régions du monde en quelques clics pour réduire la latence pour les clients."
    d:
      en: "This advantage explains AWS's lower pay-as-you-go prices: the usage of hundreds of thousands of customers is aggregated."
      fr: "Cet avantage explique les prix à l'utilisation plus bas d'AWS : l'utilisation de centaines de milliers de clients est regroupée."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
