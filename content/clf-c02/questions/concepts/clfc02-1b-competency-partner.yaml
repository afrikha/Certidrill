id: clfc02-1b-competency-partner
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company lacks in-house migration skills. It wants to hire a third-party consulting firm whose migration expertise has been validated by AWS.

    Which option meets this requirement?
  fr: |
    Une entreprise ne dispose pas de compétences internes en migration. Elle veut faire appel à un cabinet de conseil tiers dont l'expertise en migration a été validée par AWS.

    Quelle option répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "AWS Professional Services", fr: "AWS Professional Services" }
    - id: b
      text: { en: "The AWS re:Post community", fr: "La communauté AWS re:Post" }
    - id: c
      text: { en: "An AWS Migration Competency Partner", fr: "Un partenaire AWS Migration Competency" }
    - id: d
      text: { en: "AWS Prescriptive Guidance", fr: "AWS Prescriptive Guidance" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Migration Competency Partners are AWS Partners that AWS has validated for migration expertise. MAP relies on them, alongside AWS Professional Services, to execute migrations."
    fr: "Les partenaires AWS Migration Competency sont des partenaires AWS dont AWS a validé l'expertise en migration. Le MAP s'appuie sur eux, aux côtés d'AWS Professional Services, pour exécuter les migrations."
  options:
    a:
      en: "AWS Professional Services is AWS's own team, not a third-party firm."
      fr: "AWS Professional Services est l'équipe d'AWS elle-même, pas un cabinet tiers."
    b:
      en: "re:Post is a community forum where anyone can answer questions; its members are not a validated consulting firm."
      fr: "re:Post est un forum communautaire où chacun peut répondre aux questions ; ses membres ne constituent pas un cabinet de conseil validé."
    d:
      en: "Prescriptive Guidance is published content, not a consulting firm that performs the migration."
      fr: "Prescriptive Guidance est un contenu publié, pas un cabinet de conseil qui réalise la migration."
references:
  - title: "AWS Migration Acceleration Program (MAP)"
    url: https://aws.amazon.com/migration-acceleration-program/
