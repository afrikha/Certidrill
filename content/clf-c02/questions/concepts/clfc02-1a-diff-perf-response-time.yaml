id: clfc02-1a-diff-perf-response-time
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer must keep the response time of its product pages under 200 milliseconds as the number of visitors grows. Which pillar of the AWS Well-Architected Framework provides guidance for selecting and configuring resources to meet this requirement?
  fr: |
    Un détaillant en ligne doit maintenir le temps de réponse de ses pages produits sous 200 millisecondes à mesure que le nombre de visiteurs augmente. Quel pilier du cadre AWS Well-Architected fournit des conseils pour choisir et configurer les ressources afin de répondre à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Cost optimization", fr: "Optimisation des coûts" }
    - id: b
      text: { en: "Security", fr: "Sécurité" }
    - id: c
      text: { en: "Performance efficiency", fr: "Efficacité des performances" }
    - id: d
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
answer: { optionId: c }
explanation:
  correct:
    en: "Performance efficiency covers setting performance requirements and selecting and configuring compute, data, and networking resources to meet them as demand changes. A response-time target is a performance requirement."
    fr: "L'efficacité des performances couvre la définition des exigences de performance ainsi que le choix et la configuration des ressources de calcul, de données et de réseau pour les satisfaire quand la demande change. Un objectif de temps de réponse est une exigence de performance."
  options:
    a:
      en: "Cost optimization selects resources to reach the lowest price point, not a response-time target."
      fr: "L'optimisation des coûts choisit les ressources pour atteindre le prix le plus bas, pas un objectif de temps de réponse."
    b:
      en: "Security protects data, systems, and assets."
      fr: "La sécurité protège les données, les systèmes et les ressources."
    d:
      en: "Operational excellence is about running and improving operations, not choosing resources for performance."
      fr: "L'excellence opérationnelle concerne l'exécution et l'amélioration des opérations, pas le choix des ressources pour les performances."
references:
  - title: "Performance efficiency"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/performance-efficiency.html
