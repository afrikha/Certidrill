id: clfc02-1b-stop-guessing-capacity
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company sizes its on-premises servers before each project starts. It often ends up with expensive idle servers or with too little capacity when demand grows.

    Which advantage of cloud computing addresses this problem?
  fr: |
    Une entreprise dimensionne ses serveurs sur site avant le début de chaque projet. Elle se retrouve souvent avec des serveurs inactifs coûteux, ou avec trop peu de capacité quand la demande augmente.

    Quel avantage du cloud computing résout ce problème ?
body:
  options:
    - id: a
      text: { en: "Go global in minutes", fr: "Se déployer dans le monde entier en quelques minutes" }
    - id: b
      text: { en: "Benefit from massive economies of scale", fr: "Bénéficier d'économies d'échelle massives" }
    - id: c
      text: { en: "Stop guessing capacity", fr: "Ne plus deviner la capacité nécessaire" }
    - id: d
      text: { en: "Stop spending money running and maintaining data centers", fr: "Ne plus dépenser d'argent pour exploiter et entretenir des centres de données" }
answer: { optionId: c }
explanation:
  correct:
    en: "Stop guessing capacity: in the cloud, a company accesses as much or as little capacity as it needs and scales up or down with only a few minutes' notice, instead of deciding capacity before deployment."
    fr: "Ne plus deviner la capacité nécessaire : dans le cloud, une entreprise accède à autant ou aussi peu de capacité qu'elle le souhaite, et monte ou descend en charge en quelques minutes, au lieu de fixer la capacité avant le déploiement."
  options:
    a:
      en: "Go global in minutes is about deploying in multiple Regions around the world, not about sizing capacity."
      fr: "Se déployer dans le monde entier en quelques minutes concerne le déploiement dans plusieurs Régions, pas le dimensionnement de la capacité."
    b:
      en: "Economies of scale explain AWS's lower prices from aggregated usage; they do not remove idle or insufficient capacity."
      fr: "Les économies d'échelle expliquent les prix plus bas d'AWS grâce à l'agrégation de l'utilisation ; elles ne suppriment pas la capacité inactive ou insuffisante."
    d:
      en: "This advantage is about no longer racking, stacking and powering servers, not about matching capacity to demand."
      fr: "Cet avantage consiste à ne plus installer, empiler et alimenter des serveurs, pas à ajuster la capacité à la demande."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
