id: clfc02-1a-availability-definition
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which concept describes the ability of a system to provide its designed functionality at a given point in time, even when it withstands some degradation?
  fr: |
    Quel concept décrit la capacité d'un système à fournir la fonctionnalité prévue à un moment donné, même lorsqu'il subit une certaine dégradation ?
body:
  options:
    - id: a
      text: { en: "Durability", fr: "Durabilité des données (durability)" }
    - id: b
      text: { en: "High availability", fr: "Haute disponibilité" }
    - id: c
      text: { en: "Elasticity", fr: "Élasticité" }
    - id: d
      text: { en: "Scalability", fr: "Évolutivité (scalability)" }
answer: { optionId: b }
explanation:
  correct:
    en: "Availability measures a system's ability to provide its designed functionality at a given point in time. Highly available systems can withstand some measure of degradation, such as the loss of an instance or an Availability Zone, while remaining available."
    fr: "La disponibilité mesure la capacité d'un système à fournir la fonctionnalité prévue à un moment donné. Les systèmes hautement disponibles peuvent subir une certaine dégradation, comme la perte d'une instance ou d'une zone de disponibilité, tout en restant disponibles."
  options:
    a:
      en: "Durability is the ability to remain functional over time, for example storing data without loss; it is not about a given point in time."
      fr: "La durabilité des données (durability) est la capacité à rester fonctionnel dans le temps, par exemple à stocker des données sans perte ; elle ne porte pas sur un moment donné."
    c:
      en: "Elasticity is about acquiring and releasing resources as demand changes."
      fr: "L'élasticité consiste à obtenir et libérer des ressources selon l'évolution de la demande."
    d:
      en: "Scalability is a system's ability to grow to accommodate more demand."
      fr: "L'évolutivité est la capacité d'un système à croître pour absorber une demande plus forte."
references:
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
