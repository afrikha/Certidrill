id: clfc02-1a-gi-edge-locations
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company uses Amazon CloudFront to deliver images and videos to users around the world. CloudFront routes each request to the location that provides the lowest latency. Which part of the AWS global infrastructure delivers the content to users?
  fr: |
    Une entreprise de médias utilise Amazon CloudFront pour diffuser des images et des vidéos aux utilisateurs du monde entier. CloudFront achemine chaque requête vers l'emplacement qui offre la latence la plus faible. Quel élément de l'infrastructure mondiale AWS diffuse le contenu aux utilisateurs ?
body:
  options:
    - id: a
      text: { en: "Edge locations", fr: "Les emplacements périphériques (edge locations)" }
    - id: b
      text: { en: "Availability Zones", fr: "Les zones de disponibilité" }
    - id: c
      text: { en: "AWS Local Zones", fr: "AWS Local Zones" }
    - id: d
      text: { en: "AWS Outposts", fr: "AWS Outposts" }
answer: { optionId: a }
explanation:
  correct:
    en: "CloudFront delivers content through a worldwide network of data centers called edge locations. A request goes to the edge location with the lowest latency; if the content is not cached there, CloudFront retrieves it from the origin, such as an Amazon S3 bucket."
    fr: "CloudFront diffuse le contenu par l'intermédiaire d'un réseau mondial de centres de données appelés emplacements périphériques. Une requête est acheminée vers l'emplacement périphérique qui offre la latence la plus faible ; si le contenu n'y est pas en cache, CloudFront le récupère depuis l'origine, par exemple un compartiment Amazon S3."
  options:
    b:
      en: "Availability Zones are the data centers of a Region where resources such as an origin run; CloudFront serves users from edge locations."
      fr: "Les zones de disponibilité sont les centres de données d'une Région où s'exécutent des ressources comme une origine ; CloudFront sert les utilisateurs depuis les emplacements périphériques."
    c:
      en: "Local Zones extend a Region to run compute, storage, and database resources near users; they are not the CloudFront delivery network."
      fr: "Les Local Zones étendent une Région pour exécuter des ressources de calcul, de stockage et de base de données près des utilisateurs ; elles ne constituent pas le réseau de diffusion de CloudFront."
    d:
      en: "Outposts bring AWS infrastructure to a customer's own premises; they do not deliver content worldwide."
      fr: "Outposts apporte l'infrastructure AWS dans les locaux du client ; il ne diffuse pas de contenu dans le monde entier."
references:
  - title: "What is Amazon CloudFront?"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
