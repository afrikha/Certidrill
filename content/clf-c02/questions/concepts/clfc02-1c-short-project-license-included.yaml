id: clfc02-1c-short-project-license-included
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company needs a Microsoft SQL Server database on Amazon RDS for a production application that will run for only 3 months. The company does not own any SQL Server licenses and does not want to buy licenses for this short project.

    Which licensing option should the company choose?
  fr: |
    Une entreprise a besoin d'une base de données Microsoft SQL Server sur Amazon RDS pour une application de production qui ne fonctionnera que 3 mois. L'entreprise ne possède aucune licence SQL Server et ne souhaite pas en acheter pour ce projet court.

    Quelle option de licence l'entreprise doit-elle choisir ?
body:
  options:
    - id: a
      text: { en: "Bring Your Own Media (BYOM) with License Mobility through Software Assurance", fr: "BYOM (Bring Your Own Media) avec License Mobility through Software Assurance" }
    - id: b
      text: { en: "License Included, where the RDS price covers the SQL Server license", fr: "Licence incluse (License Included), où le prix d'Amazon RDS couvre la licence SQL Server" }
    - id: c
      text: { en: "Perpetual SQL Server licenses bought from Microsoft for the project", fr: "Des licences SQL Server perpétuelles achetées à Microsoft pour le projet" }
    - id: d
      text: { en: "SQL Server Developer Edition, which includes all Enterprise Edition features", fr: "SQL Server Developer Edition, qui comprend toutes les fonctionnalités d'Enterprise Edition" }
answer: { optionId: b }
explanation:
  correct:
    en: "With the License Included model, Amazon RDS pricing covers the SQL Server license, the hardware, and RDS management. The company pays only while it runs the DB instance and does not need to buy licenses for a 3-month project."
    fr: "Avec le modèle de licence incluse, la tarification d'Amazon RDS couvre la licence SQL Server, le matériel et la gestion RDS. L'entreprise ne paie que pendant l'exécution de l'instance de base de données et n'a pas besoin d'acheter de licences pour un projet de 3 mois."
  options:
    a:
      en: "BYOM requires existing SQL Server licenses with active Software Assurance, which the company does not have."
      fr: "Le BYOM exige des licences SQL Server existantes avec une Software Assurance active, que l'entreprise ne possède pas."
    c:
      en: "Buying licenses is exactly what the company wants to avoid for a short project."
      fr: "Acheter des licences est précisément ce que l'entreprise veut éviter pour un projet court."
    d:
      en: "Developer Edition is licensed for non-production use only, so it cannot run this production application."
      fr: "Developer Edition est concédée sous licence pour un usage hors production uniquement : elle ne peut donc pas exécuter cette application de production."
references:
  - title: "Licensing Microsoft SQL Server on Amazon RDS - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/SQLServer.Concepts.General.Licensing.html
