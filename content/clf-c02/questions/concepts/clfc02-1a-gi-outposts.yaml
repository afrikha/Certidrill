id: clfc02-1a-gi-outposts
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturer must process data from its factory equipment on its own premises with very low latency. It wants to use the same AWS APIs and tools that it uses in AWS Regions. Which AWS service meets these requirements?
  fr: |
    Un fabricant doit traiter les données de ses équipements d'usine dans ses propres locaux avec une latence très faible. Il veut utiliser les mêmes API et outils AWS que dans les Régions AWS. Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Local Zones", fr: "AWS Local Zones" }
    - id: b
      text: { en: "AWS Direct Connect", fr: "AWS Direct Connect" }
    - id: c
      text: { en: "AWS Outposts", fr: "AWS Outposts" }
    - id: d
      text: { en: "Amazon CloudFront", fr: "Amazon CloudFront" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Outposts is a fully managed service that extends AWS infrastructure, services, APIs, and tools to customer premises. It uses local compute and storage for low latency and local data processing, with the same programming interfaces as in AWS Regions."
    fr: "AWS Outposts est un service entièrement géré qui étend l'infrastructure, les services, les API et les outils AWS aux locaux du client. Il utilise du calcul et du stockage locaux pour une faible latence et un traitement local des données, avec les mêmes interfaces de programmation que dans les Régions AWS."
  options:
    a:
      en: "Local Zones are AWS-operated sites near population centers; they do not process data on the manufacturer's own premises."
      fr: "Les Local Zones sont des sites exploités par AWS près des centres de population ; elles ne traitent pas les données dans les propres locaux du fabricant."
    b:
      en: "Direct Connect provides a private network connection to AWS, but the processing would still happen in a Region, not on premises."
      fr: "Direct Connect fournit une connexion réseau privée vers AWS, mais le traitement aurait toujours lieu dans une Région, pas sur site."
    d:
      en: "CloudFront delivers content to users from edge locations; it does not run the manufacturer's processing on premises."
      fr: "CloudFront diffuse du contenu aux utilisateurs depuis des emplacements périphériques ; il n'exécute pas les traitements du fabricant sur site."
references:
  - title: "What is AWS Outposts?"
    url: https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html
