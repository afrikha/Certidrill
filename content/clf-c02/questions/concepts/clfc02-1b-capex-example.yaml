id: clfc02-1b-capex-example
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is classifying its IT costs as capital expenditure (CapEx) or operational expenditure (OpEx).

    Which cost is an example of CapEx?
  fr: |
    Une entreprise classe ses coûts informatiques en dépenses d'investissement (CapEx) ou en dépenses d'exploitation (OpEx).

    Quel coût est un exemple de CapEx ?
body:
  options:
    - id: a
      text: { en: "The purchase of servers for an on-premises data center", fr: "L'achat de serveurs pour un centre de données sur site" }
    - id: b
      text: { en: "The per-request charges of AWS Lambda functions", fr: "Les frais par requête des fonctions AWS Lambda" }
    - id: c
      text: { en: "The per-GB charge for data stored in Amazon S3", fr: "Les frais par Go des données stockées dans Amazon S3" }
    - id: d
      text: { en: "The monthly charge for Amazon EC2 instance usage", fr: "Les frais mensuels d'utilisation des instances Amazon EC2" }
answer: { optionId: a }
explanation:
  correct:
    en: "Buying servers for a data center is an upfront investment in physical assets, which is capital expenditure and a fixed cost. AWS charges are operational expenses that follow usage."
    fr: "L'achat de serveurs pour un centre de données est un investissement initial dans des biens physiques : c'est une dépense d'investissement et un coût fixe. Les frais AWS sont des dépenses d'exploitation qui suivent l'utilisation."
  options:
    b:
      en: "Lambda charges depend on requests and duration; they are a variable operational expense."
      fr: "Les frais Lambda dépendent des requêtes et de la durée d'exécution ; ce sont des dépenses d'exploitation variables."
    c:
      en: "S3 storage is billed per GB stored each month, an operational expense that varies with the data stored."
      fr: "Le stockage S3 est facturé par Go stocké chaque mois : c'est une dépense d'exploitation qui varie selon les données stockées."
    d:
      en: "EC2 usage is billed as it is consumed, which is an operational, variable expense."
      fr: "L'utilisation d'EC2 est facturée au fur et à mesure de la consommation : c'est une dépense d'exploitation variable."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
