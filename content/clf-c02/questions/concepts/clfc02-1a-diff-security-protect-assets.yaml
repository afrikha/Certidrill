id: clfc02-1a-diff-security-protect-assets
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which pillar of the AWS Well-Architected Framework describes how to use cloud technologies to protect data, systems, and assets?
  fr: |
    Quel pilier du cadre AWS Well-Architected décrit comment utiliser les technologies du cloud pour protéger les données, les systèmes et les ressources ?
body:
  options:
    - id: a
      text: { en: "Reliability", fr: "Fiabilité" }
    - id: b
      text: { en: "Security", fr: "Sécurité" }
    - id: c
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
    - id: d
      text: { en: "Cost optimization", fr: "Optimisation des coûts" }
answer: { optionId: b }
explanation:
  correct:
    en: "The security pillar describes how to use cloud technologies to protect data, systems, and assets and to improve security posture. Its areas include identity and access management, data protection, and infrastructure protection."
    fr: "Le pilier sécurité décrit comment utiliser les technologies du cloud pour protéger les données, les systèmes et les ressources et améliorer la posture de sécurité. Ses domaines comprennent la gestion des identités et des accès, la protection des données et la protection de l'infrastructure."
  options:
    a:
      en: "Reliability is about a workload performing its intended function correctly and consistently."
      fr: "La fiabilité concerne la capacité d'une charge de travail à remplir sa fonction prévue correctement et de façon constante."
    c:
      en: "Operational excellence is about running workloads effectively and continuously improving processes."
      fr: "L'excellence opérationnelle concerne l'exécution efficace des charges de travail et l'amélioration continue des processus."
    d:
      en: "Cost optimization is about delivering business value at the lowest price point."
      fr: "L'optimisation des coûts consiste à apporter de la valeur métier au prix le plus bas."
references:
  - title: "Security"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/security.html
