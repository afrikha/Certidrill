id: clfc02-1c-scale-advantage-name
objective: "1.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup learns that it can get a lower variable cost on AWS than it could achieve on its own, because AWS aggregates the usage of a very large number of customers.

    Which advantage of cloud computing does this describe?
  fr: |
    Une start-up apprend qu'elle peut obtenir sur AWS un coût variable plus faible que celui qu'elle obtiendrait seule, car AWS regroupe l'utilisation d'un très grand nombre de clients.

    Quel avantage du cloud computing cela décrit-il ?
body:
  options:
    - id: a
      text: { en: "Stop guessing capacity", fr: "Arrêtez de deviner la capacité" }
    - id: b
      text: { en: "Increase speed and agility", fr: "Améliorez la vitesse et l'agilité" }
    - id: c
      text: { en: "Benefit from massive economies of scale", fr: "Bénéficiez d'économies d'échelle massives" }
    - id: d
      text: { en: "Go global in minutes", fr: "Passez à l'international en quelques minutes" }
answer: { optionId: c }
explanation:
  correct:
    en: "Because usage from hundreds of thousands of customers is aggregated in the cloud, AWS achieves higher economies of scale than a single company. These economies of scale translate into lower pay-as-you-go prices for every customer."
    fr: "Comme l'utilisation de centaines de milliers de clients est regroupée dans le cloud, AWS réalise des économies d'échelle supérieures à celles d'une seule entreprise. Ces économies d'échelle se traduisent par des prix à l'utilisation plus bas pour chaque client."
  options:
    a:
      en: "Stop guessing capacity is about scaling up and down as needed instead of buying capacity in advance."
      fr: "« Arrêtez de deviner la capacité » consiste à augmenter ou réduire la capacité selon les besoins au lieu de l'acheter à l'avance."
    b:
      en: "Speed and agility is about getting new resources in minutes instead of weeks."
      fr: "« Améliorez la vitesse et l'agilité » consiste à obtenir de nouvelles ressources en quelques minutes au lieu de plusieurs semaines."
    d:
      en: "Go global in minutes is about deploying in multiple Regions to reduce latency for users around the world."
      fr: "« Passez à l'international en quelques minutes » consiste à utiliser plusieurs Régions pour réduire la latence des utilisateurs à travers le monde."
references:
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
