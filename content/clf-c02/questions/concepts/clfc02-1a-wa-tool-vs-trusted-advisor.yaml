id: clfc02-1a-wa-tool-vs-trusted-advisor
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An architecture team wants to document the design decisions of a workload by answering questions about it, such as how the team responds to incidents and how the workload recovers from failures. The team wants a prioritized list of improvements as a result. Which AWS service should the team use?
  fr: |
    Une équipe d'architecture veut documenter les décisions de conception d'une charge de travail en répondant à des questions à son sujet, par exemple sur la manière dont l'équipe répond aux incidents et dont la charge de travail récupère après une défaillance. L'équipe veut obtenir une liste d'améliorations classées par priorité. Quel service AWS l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
    - id: b
      text: { en: "AWS Well-Architected Tool", fr: "AWS Well-Architected Tool" }
    - id: c
      text: { en: "AWS Config", fr: "AWS Config" }
    - id: d
      text: { en: "AWS Health Dashboard", fr: "AWS Health Dashboard" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Well-Architected Tool guides a review of a workload against the Well-Architected Framework: the team answers the questions of each pillar and documents its decisions. The tool then evaluates the answers and produces an improvement plan with a prioritized list of issues."
    fr: "AWS Well-Architected Tool guide la revue d'une charge de travail selon le cadre Well-Architected : l'équipe répond aux questions de chaque pilier et documente ses décisions. L'outil évalue ensuite les réponses et produit un plan d'amélioration avec une liste de problèmes classés par priorité."
  options:
    a:
      en: "Trusted Advisor runs automated checks on the resources of the account; it does not collect answers about design and operating processes. Its findings can only help answer some Well-Architected questions."
      fr: "Trusted Advisor exécute des vérifications automatiques sur les ressources du compte ; il ne recueille pas de réponses sur les processus de conception et d'exploitation. Ses résultats peuvent seulement aider à répondre à certaines questions Well-Architected."
    c:
      en: "AWS Config records and evaluates the configuration of resources; it does not review design decisions with questions."
      fr: "AWS Config enregistre et évalue la configuration des ressources ; il n'examine pas les décisions de conception à l'aide de questions."
    d:
      en: "AWS Health Dashboard reports events that affect AWS services and the account's resources, not the quality of an architecture."
      fr: "AWS Health Dashboard signale les événements qui affectent les services AWS et les ressources du compte, pas la qualité d'une architecture."
references:
  - title: "What is AWS Well-Architected Tool?"
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html
  - title: "AWS Well-Architected Tool FAQs"
    url: https://aws.amazon.com/well-architected-tool/faqs/
