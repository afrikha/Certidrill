id: clfc02-1b-mgn-console-control
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants to rehost 40 Windows servers on Amazon EC2. Its migration engineers want to manage the replication and the cutover of each server themselves, rather than let an AI agent run discovery and wave planning.

    Which option should the company use?
  fr: |
    Une entreprise veut réhéberger 40 serveurs Windows sur Amazon EC2. Ses ingénieurs de migration veulent gérer eux-mêmes la réplication et la bascule de chaque serveur, plutôt que de laisser un agent d'IA mener la découverte et la planification des vagues.

    Quelle option l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "The AWS Transform agentic workflow", fr: "Le flux de travail agentique d'AWS Transform" }
    - id: b
      text: { en: "Migration Evaluator", fr: "Migration Evaluator" }
    - id: c
      text: { en: "AWS Database Migration Service (AWS DMS)", fr: "AWS Database Migration Service (AWS DMS)" }
    - id: d
      text: { en: "The AWS Transform MGN console", fr: "La console AWS Transform MGN" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Transform MGN (formerly AWS Application Migration Service) offers two rehosting experiences. Its console gives direct control over replication and cutover, while the AWS Transform agentic workflow lets an agent handle discovery, wave planning and rehosting."
    fr: "AWS Transform MGN (anciennement AWS Application Migration Service) propose deux expériences de réhébergement. Sa console donne un contrôle direct sur la réplication et la bascule, tandis que le flux de travail agentique d'AWS Transform confie à un agent la découverte, la planification des vagues et le réhébergement."
  options:
    a:
      en: "The agentic workflow delegates discovery, wave planning and rehosting to an agent, which the engineers do not want."
      fr: "Le flux de travail agentique délègue la découverte, la planification des vagues et le réhébergement à un agent, ce que les ingénieurs ne veulent pas."
    b:
      en: "Migration Evaluator produces a business case; it does not replicate or cut over servers."
      fr: "Migration Evaluator produit une analyse de rentabilisation ; il ne réplique ni ne bascule de serveurs."
    c:
      en: "AWS DMS migrates databases, not entire Windows servers."
      fr: "AWS DMS migre des bases de données, pas des serveurs Windows entiers."
references:
  - title: "AWS Application Migration Service is now AWS Transform MGN"
    url: https://aws.amazon.com/about-aws/whats-new/2026/06/aws-transform-mgn-rebrand/
  - title: "What Is AWS Transform MGN?"
    url: https://docs.aws.amazon.com/mgn/latest/ug/what-is-application-migration-service.html
