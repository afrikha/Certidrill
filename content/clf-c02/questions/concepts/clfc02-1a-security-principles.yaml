id: clfc02-1a-security-principles
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which of the following are design principles of the security pillar of the AWS Well-Architected Framework? (Choose two.)
  fr: |
    Lesquels des éléments suivants sont des principes de conception du pilier sécurité du cadre AWS Well-Architected ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Scale horizontally to increase aggregate workload availability", fr: "Mettre à l'échelle horizontalement pour augmenter la disponibilité globale de la charge de travail" }
    - id: b
      text: { en: "Apply security at all layers", fr: "Appliquer la sécurité à toutes les couches" }
    - id: c
      text: { en: "Go global in minutes", fr: "Se déployer dans le monde entier en quelques minutes" }
    - id: d
      text: { en: "Keep people away from data", fr: "Tenir les personnes éloignées des données" }
    - id: e
      text: { en: "Adopt a consumption model", fr: "Adopter un modèle de consommation" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "\"Apply security at all layers\" (defense in depth, from the network edge to the code) and \"Keep people away from data\" (reduce direct access and manual processing of data) are two of the seven security design principles."
    fr: "« Appliquer la sécurité à toutes les couches » (défense en profondeur, de la périphérie du réseau jusqu'au code) et « Tenir les personnes éloignées des données » (réduire l'accès direct et le traitement manuel des données) font partie des sept principes de conception de sécurité."
  options:
    a:
      en: "This is a design principle of the reliability pillar."
      fr: "C'est un principe de conception du pilier fiabilité."
    c:
      en: "This is a design principle of the performance efficiency pillar."
      fr: "C'est un principe de conception du pilier efficacité des performances."
    e:
      en: "This is a design principle of the cost optimization pillar."
      fr: "C'est un principe de conception du pilier optimisation des coûts."
references:
  - title: "Design principles"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/sec-design.html
