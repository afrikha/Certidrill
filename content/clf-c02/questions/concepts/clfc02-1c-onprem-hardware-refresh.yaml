id: clfc02-1c-onprem-hardware-refresh
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company replaces its on-premises servers and storage arrays every five years, when they reach the end of their supported life. The company plans to move its workloads to AWS.

    Which statement describes this replacement cost after the move?
  fr: |
    Une entreprise remplace ses serveurs et baies de stockage sur site tous les cinq ans, lorsqu'ils arrivent en fin de support. L'entreprise prévoit de déplacer ses charges de travail vers AWS.

    Quelle affirmation décrit ce coût de remplacement après la migration ?
body:
  options:
    - id: a
      text: { en: "AWS maintains and replaces the physical hardware, so the company no longer buys replacement servers.", fr: "AWS maintient et remplace le matériel physique : l'entreprise n'achète donc plus de serveurs de remplacement." }
    - id: b
      text: { en: "The company ships its replacement servers to the AWS Region that it uses.", fr: "L'entreprise expédie ses serveurs de remplacement vers la Région AWS qu'elle utilise." }
    - id: c
      text: { en: "The company pays AWS a hardware replacement fee every five years.", fr: "L'entreprise paie à AWS des frais de remplacement du matériel tous les cinq ans." }
    - id: d
      text: { en: "The company must use Dedicated Hosts to receive newer hardware.", fr: "L'entreprise doit utiliser des Dedicated Hosts pour bénéficier d'un matériel plus récent." }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS is responsible for the infrastructure that runs its services, including the hardware and facilities. The company stops buying and replacing servers, and pays only for the AWS resources that it uses."
    fr: "AWS est responsable de l'infrastructure qui exécute ses services, y compris le matériel et les installations. L'entreprise cesse d'acheter et de remplacer des serveurs, et ne paie que les ressources AWS qu'elle utilise."
  options:
    b:
      en: "Customers do not supply hardware for AWS Regions; AWS owns and operates that hardware."
      fr: "Les clients ne fournissent pas de matériel pour les Régions AWS : AWS possède et exploite ce matériel."
    c:
      en: "AWS charges for the use of its services; there is no periodic hardware replacement fee."
      fr: "AWS facture l'utilisation de ses services ; il n'existe pas de frais périodiques de remplacement du matériel."
    d:
      en: "Dedicated Hosts give a customer a physical server for its own use, mainly for licensing or compliance needs; they are not required to benefit from AWS hardware maintenance."
      fr: "Les Dedicated Hosts fournissent à un client un serveur physique dédié, surtout pour des besoins de licences ou de conformité ; ils ne sont pas nécessaires pour bénéficier de la maintenance du matériel par AWS."
references:
  - title: "Shared Responsibility Model - Amazon Web Services (AWS)"
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
