id: clfc02-1c-onprem-underprovisioned
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer sized its on-premises servers for average traffic. During a promotion, demand exceeded the capacity of the servers, the website slowed down, and many customers abandoned their orders. Ordering more servers takes several weeks.

    Which on-premises cost does this situation illustrate?
  fr: |
    Un détaillant en ligne a dimensionné ses serveurs sur site pour le trafic moyen. Pendant une promotion, la demande a dépassé la capacité des serveurs, le site web a ralenti et de nombreux clients ont abandonné leur commande. Commander d'autres serveurs prend plusieurs semaines.

    Quel coût sur site cette situation illustre-t-elle ?
body:
  options:
    - id: a
      text: { en: "Idle capacity that is paid for but not used during normal periods", fr: "Une capacité payée, mais inutilisée pendant les périodes normales" }
    - id: b
      text: { en: "Higher electricity rates during periods of high demand", fr: "Des tarifs d'électricité plus élevés pendant les périodes de forte demande" }
    - id: c
      text: { en: "Lost revenue from limited capacity when demand exceeds what was purchased", fr: "Un manque à gagner dû à une capacité limitée lorsque la demande dépasse ce qui a été acheté" }
    - id: d
      text: { en: "License fees that increase with the number of website visitors", fr: "Des frais de licence qui augmentent avec le nombre de visiteurs du site web" }
answer: { optionId: c }
explanation:
  correct:
    en: "A capacity decision made in advance can leave a company with limited capacity when demand is higher than planned. Because new servers take weeks to arrive, the company cannot react in time and loses orders, which is a real cost of fixed on-premises capacity."
    fr: "Une décision de capacité prise à l'avance peut laisser une entreprise avec une capacité limitée lorsque la demande dépasse les prévisions. Comme de nouveaux serveurs mettent des semaines à arriver, l'entreprise ne peut pas réagir à temps et perd des commandes, ce qui est un coût réel d'une capacité sur site fixe."
  options:
    a:
      en: "Idle capacity is the opposite problem: it happens when servers are sized for a peak that rarely occurs."
      fr: "La capacité inutilisée est le problème inverse : elle apparaît lorsque les serveurs sont dimensionnés pour un pic rarement atteint."
    b:
      en: "The scenario describes insufficient capacity, not a change in electricity rates."
      fr: "Le scénario décrit une capacité insuffisante, pas une variation des tarifs d'électricité."
    d:
      en: "Nothing in the scenario mentions license fees; the cost comes from orders lost when the website slowed down."
      fr: "Rien dans le scénario ne mentionne de frais de licence : le coût vient des commandes perdues lorsque le site web a ralenti."
references:
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
