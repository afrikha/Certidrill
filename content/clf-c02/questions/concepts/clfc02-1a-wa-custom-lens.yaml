id: clfc02-1a-wa-custom-lens
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses the AWS Well-Architected Tool. It wants to review its workloads against its own internal governance questions in addition to the AWS best practices. What should the company create in the tool?
  fr: |
    Une entreprise utilise AWS Well-Architected Tool. Elle veut examiner ses charges de travail selon ses propres questions de gouvernance interne, en plus des bonnes pratiques AWS. Que doit-elle créer dans l'outil ?
body:
  options:
    - id: a
      text: { en: "A milestone", fr: "Un jalon" }
    - id: b
      text: { en: "An improvement plan", fr: "Un plan d'amélioration" }
    - id: c
      text: { en: "A custom lens", fr: "Un objectif personnalisé (custom lens)" }
    - id: d
      text: { en: "A lens from the Lens Catalog", fr: "Un objectif du Lens Catalog" }
answer: { optionId: c }
explanation:
  correct:
    en: "A custom lens is a user-defined lens with its own pillars, questions, best practices, and improvement plans. It lets a company measure workloads against its own best practices, such as governance requirements, and it can be shared with other AWS accounts."
    fr: "Un objectif personnalisé (custom lens) est défini par l'utilisateur, avec ses propres piliers, questions, bonnes pratiques et plans d'amélioration. Il permet à une entreprise d'évaluer ses charges de travail selon ses propres bonnes pratiques, par exemple des exigences de gouvernance, et il peut être partagé avec d'autres comptes AWS."
  options:
    a:
      en: "A milestone records the state of a workload at a point in time; it does not add questions."
      fr: "Un jalon enregistre l'état d'une charge de travail à un moment donné ; il n'ajoute pas de questions."
    b:
      en: "The improvement plan is produced from the answers to existing questions; it cannot define new questions."
      fr: "Le plan d'amélioration est produit à partir des réponses aux questions existantes ; il ne permet pas de définir de nouvelles questions."
    d:
      en: "Lens Catalog lenses are official lenses created and maintained by AWS, so they cannot contain the company's internal questions."
      fr: "Les objectifs du Lens Catalog sont des objectifs officiels créés et tenus à jour par AWS : ils ne peuvent pas contenir les questions internes de l'entreprise."
references:
  - title: "Using lenses in AWS WA Tool"
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/lenses.html
