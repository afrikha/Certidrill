id: clfc02-1a-pillar-sus-utilization
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To reduce the energy required to power its workload, a company consolidates its applications so that one host runs at 60% utilization instead of two hosts at 30% each. Which pillar of the AWS Well-Architected Framework describes this practice?
  fr: |
    Pour réduire l'énergie nécessaire à l'alimentation de sa charge de travail, une entreprise regroupe ses applications afin qu'un seul hôte fonctionne à 60 % d'utilisation au lieu de deux hôtes à 30 % chacun. Quel pilier du cadre AWS Well-Architected décrit cette pratique ?
body:
  options:
    - id: a
      text: { en: "Cost optimization", fr: "Optimisation des coûts" }
    - id: b
      text: { en: "Reliability", fr: "Fiabilité" }
    - id: c
      text: { en: "Performance efficiency", fr: "Efficacité des performances" }
    - id: d
      text: { en: "Sustainability", fr: "Durabilité" }
answer: { optionId: d }
explanation:
  correct:
    en: "\"Maximize utilization\" is a design principle of the sustainability pillar. Because each host has a baseline power consumption, two hosts at 30% are less energy efficient than one host at 60%, so right-sizing and consolidation reduce the total energy used."
    fr: "« Maximiser l'utilisation » est un principe de conception du pilier durabilité. Comme chaque hôte a une consommation électrique de base, deux hôtes à 30 % sont moins efficaces sur le plan énergétique qu'un hôte à 60 % : le dimensionnement adapté et la consolidation réduisent l'énergie totale consommée."
  options:
    a:
      en: "Consolidation can also lower costs, but the stated goal is reducing energy, which is the focus of the sustainability pillar."
      fr: "La consolidation peut aussi réduire les coûts, mais l'objectif indiqué est de réduire l'énergie, ce qui est l'objet du pilier durabilité."
    b:
      en: "Reliability favors spreading load over several resources to limit the impact of a failure; it does not aim at reducing energy."
      fr: "La fiabilité privilégie la répartition de la charge sur plusieurs ressources pour limiter l'impact d'une défaillance ; elle ne vise pas à réduire l'énergie."
    c:
      en: "Performance efficiency is about meeting performance requirements, not about the energy consumed per host."
      fr: "L'efficacité des performances vise à répondre aux exigences de performance, pas à réduire l'énergie consommée par hôte."
references:
  - title: "Design principles"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/sus-design-principles.html
