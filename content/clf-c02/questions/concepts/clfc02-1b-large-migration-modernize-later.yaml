id: clfc02-1b-large-migration-modernize-later
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must move several hundred applications out of its data center before the lease ends next year. It also wants cloud-native architectures in the long term.

    Which approach does AWS Prescriptive Guidance recommend for this large migration?
  fr: |
    Une entreprise doit sortir plusieurs centaines d'applications de son centre de données avant la fin du bail, l'an prochain. Elle veut aussi des architectures cloud natives à long terme.

    Quelle approche AWS Prescriptive Guidance recommande-t-il pour cette migration à grande échelle ?
body:
  options:
    - id: a
      text: { en: "Refactor every application into cloud-native services before moving any of them to AWS.", fr: "Refactoriser chaque application en services cloud natifs avant d'en déplacer une seule vers AWS." }
    - id: b
      text: { en: "Retain all applications on premises until each one has been redesigned for the cloud.", fr: "Conserver toutes les applications sur site jusqu'à ce que chacune ait été repensée pour le cloud." }
    - id: c
      text: { en: "Repurchase every application as a SaaS product and decommission the existing servers.", fr: "Racheter chaque application sous forme de produit SaaS et mettre hors service les serveurs existants." }
    - id: d
      text: { en: "Migrate mainly with rehost, relocate and replatform, and modernize after the migration.", fr: "Migrer surtout par réhébergement, relocalisation et replateformage, puis moderniser après la migration." }
answer: { optionId: d }
explanation:
  correct:
    en: "For large migrations, AWS Prescriptive Guidance recommends rehost, relocate, replatform and retire, and advises against refactoring during the migration. Refactoring is the most complex and costly strategy, so the guidance suggests modernizing after the migration is complete."
    fr: "Pour les migrations à grande échelle, AWS Prescriptive Guidance recommande le réhébergement, la relocalisation, le replateformage et le retrait, et déconseille la refactorisation pendant la migration. La refactorisation étant la stratégie la plus complexe et la plus coûteuse, il conseille de moderniser une fois la migration terminée."
  options:
    a:
      en: "Refactoring hundreds of applications first is the slowest and costliest path and would miss the lease deadline."
      fr: "Refactoriser d'abord des centaines d'applications est la voie la plus lente et la plus coûteuse, et ne respecterait pas l'échéance du bail."
    b:
      en: "Retaining everything keeps the applications in the data center, which the company must leave next year."
      fr: "Tout conserver laisse les applications dans le centre de données, que l'entreprise doit quitter l'an prochain."
    c:
      en: "Repurchase suits applications that have a suitable SaaS replacement; it is not a strategy for every application."
      fr: "Le rachat convient aux applications qui ont un équivalent SaaS adapté ; ce n'est pas une stratégie pour toutes les applications."
references:
  - title: "About the migration strategies"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
