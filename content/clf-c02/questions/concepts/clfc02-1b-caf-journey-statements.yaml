id: clfc02-1b-caf-journey-statements
objective: "1.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company is planning its cloud adoption with the AWS CAF transformation journey.

    Which two statements about this journey are correct? (Choose two.)
  fr: |
    Une entreprise planifie son adoption du cloud avec le parcours de transformation AWS CAF.

    Quelles sont les deux affirmations correctes sur ce parcours ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "The four phases are iterative and incremental rather than a one-time sequence.", fr: "Les quatre phases sont itératives et incrémentielles, pas une séquence unique." }
    - id: b
      text: { en: "Every foundational capability must be fully in place before any pilot can start.", fr: "Chaque capacité fondamentale doit être entièrement en place avant le début du moindre pilote." }
    - id: c
      text: { en: "The Launch phase moves all production workloads to AWS in a single cutover.", fr: "La phase Lancer (Launch) déplace toutes les charges de travail de production vers AWS en une seule bascule." }
    - id: d
      text: { en: "Lessons learned from pilots guide adjustments before the company scales.", fr: "Les enseignements tirés des pilotes guident les ajustements avant que l'entreprise ne passe à l'échelle." }
    - id: e
      text: { en: "The Envision phase identifies capability gaps across the six perspectives.", fr: "La phase Envisager (Envision) identifie les lacunes de capacités dans les six perspectives." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS CAF recommends four iterative and incremental phases: Envision, Align, Launch and Scale. In the Launch phase, high-impact pilots are delivered in production, and the lessons learned are used to adjust the approach before scaling."
    fr: "AWS CAF recommande quatre phases itératives et incrémentielles : Envisager (Envision), Aligner (Align), Lancer (Launch) et Mettre à l'échelle (Scale). Pendant la phase Lancer, des pilotes à fort impact sont mis en production, et les enseignements tirés servent à ajuster l'approche avant la mise à l'échelle."
  options:
    b:
      en: "AWS CAF states that organizations do not need to address all foundational capabilities at once; the sequence can be tailored."
      fr: "AWS CAF indique que les organisations n'ont pas besoin de traiter toutes les capacités fondamentales à la fois ; l'ordre peut être adapté."
    c:
      en: "Launch delivers a few pilot initiatives to show incremental value, not a single cutover of all workloads."
      fr: "La phase Lancer (Launch) livre quelques initiatives pilotes pour montrer une valeur progressive, pas une bascule unique de toutes les charges de travail."
    e:
      en: "Identifying capability gaps across the perspectives is the Align phase; Envision identifies and prioritizes opportunities."
      fr: "L'identification des lacunes de capacités dans les perspectives relève de la phase Aligner (Align) ; la phase Envisager identifie et hiérarchise les opportunités."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
