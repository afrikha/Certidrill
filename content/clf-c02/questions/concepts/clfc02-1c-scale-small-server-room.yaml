id: clfc02-1c-scale-small-server-room
objective: "1.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A small company runs 10 servers in its own server room. It pays for dedicated cooling, a security system, and a part-time administrator for this room.

    Why is the company's cost for each server likely to be higher than the cost of equivalent capacity on AWS?
  fr: |
    Une petite entreprise exécute 10 serveurs dans sa propre salle des serveurs. Elle paie un système de refroidissement dédié, un système de sécurité et un administrateur à temps partiel pour cette salle.

    Pourquoi le coût de chaque serveur de l'entreprise est-il probablement plus élevé que celui d'une capacité équivalente sur AWS ?
body:
  options:
    - id: a
      text: { en: "AWS does not pay for the electricity that its data centers use.", fr: "AWS ne paie pas l'électricité consommée par ses centres de données." }
    - id: b
      text: { en: "The company spreads its facility and staff costs over only a few servers, while AWS spreads them over a very large scale.", fr: "L'entreprise répartit ses coûts de locaux et de personnel sur quelques serveurs seulement, alors qu'AWS les répartit à très grande échelle." }
    - id: c
      text: { en: "AWS never replaces the servers in its data centers.", fr: "AWS ne remplace jamais les serveurs de ses centres de données." }
    - id: d
      text: { en: "The company pays for its servers every hour, even when they are turned off.", fr: "L'entreprise paie ses serveurs chaque heure, même lorsqu'ils sont éteints." }
answer: { optionId: b }
explanation:
  correct:
    en: "Facility and staff costs do not grow in step with each server, so a small room carries a high cost for each server. AWS shares similar costs across a huge infrastructure and the aggregated usage of many customers, which gives it a much lower cost for each unit."
    fr: "Les coûts de locaux et de personnel n'augmentent pas au même rythme que le nombre de serveurs : une petite salle supporte donc un coût élevé par serveur. AWS partage des coûts similaires sur une immense infrastructure et l'utilisation regroupée de nombreux clients, ce qui lui donne un coût unitaire bien plus faible."
  options:
    a:
      en: "AWS also pays for power; it gets a lower cost for each unit because of its scale."
      fr: "AWS paie aussi l'électricité ; il obtient un coût unitaire plus faible grâce à son échelle."
    c:
      en: "AWS maintains and replaces its hardware; its lower unit cost comes from scale."
      fr: "AWS maintient et remplace son matériel ; son coût unitaire plus faible vient de son échelle."
    d:
      en: "Owned servers are not billed by the hour; the company paid for them when it bought them."
      fr: "Les serveurs achetés ne sont pas facturés à l'heure : l'entreprise les a payés lors de leur achat."
references:
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
