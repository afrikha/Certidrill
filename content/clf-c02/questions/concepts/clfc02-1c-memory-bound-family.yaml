id: clfc02-1c-memory-bound-family
objective: "1.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon EC2 instance from a general purpose family runs a caching application. Its CPU utilization averages 15%, but its memory utilization stays above 90%. The company wants to lower cost without reducing performance.

    Which rightsizing action should the company take?
  fr: |
    Une instance Amazon EC2 d'une famille à usage général exécute une application de mise en cache. Son utilisation du processeur est en moyenne de 15 %, mais son utilisation de la mémoire reste supérieure à 90 %. L'entreprise souhaite réduire les coûts sans diminuer les performances.

    Quelle action de dimensionnement l'entreprise doit-elle effectuer ?
body:
  options:
    - id: a
      text: { en: "Move to a smaller instance size in the same general purpose family", fr: "Passer à une taille d'instance plus petite dans la même famille à usage général" }
    - id: b
      text: { en: "Move to a compute optimized instance type with the same number of vCPUs", fr: "Passer à un type d'instance optimisé pour le calcul avec le même nombre de vCPU" }
    - id: c
      text: { en: "Add a second instance of the same type behind a load balancer", fr: "Ajouter une deuxième instance du même type derrière un équilibreur de charge" }
    - id: d
      text: { en: "Move to a memory optimized instance type with fewer vCPUs and at least the same memory", fr: "Passer à un type d'instance optimisé pour la mémoire avec moins de vCPU et au moins autant de mémoire" }
answer: { optionId: d }
explanation:
  correct:
    en: "Rightsizing considers every attribute of a resource, not only CPU. This workload is memory intensive, so a memory optimized instance type with fewer vCPUs and enough memory removes the unused CPU capacity without starving the application of memory."
    fr: "Le dimensionnement approprié prend en compte tous les attributs d'une ressource, pas seulement le processeur. Cette charge de travail est gourmande en mémoire : un type d'instance optimisé pour la mémoire, avec moins de vCPU et suffisamment de mémoire, supprime la capacité de processeur inutilisée sans priver l'application de mémoire."
  options:
    a:
      en: "A smaller size in the same family also has less memory, so an application that already uses 90% of its memory would lose performance."
      fr: "Une taille plus petite dans la même famille a aussi moins de mémoire : une application qui utilise déjà 90 % de sa mémoire perdrait en performances."
    b:
      en: "Compute optimized instances offer less memory for each vCPU, which is the opposite of what this workload needs."
      fr: "Les instances optimisées pour le calcul offrent moins de mémoire par vCPU, ce qui est l'inverse des besoins de cette charge de travail."
    c:
      en: "A second instance doubles the cost instead of lowering it."
      fr: "Une deuxième instance double le coût au lieu de le réduire."
references:
  - title: "COST06-BP02 Select resource type, size, and number based on data - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/cost_type_size_number_resources_data.html
  - title: "Select the correct resource type, size, and number - Cost Optimization Pillar"
    url: https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/select-the-correct-resource-type-size-and-number.html
