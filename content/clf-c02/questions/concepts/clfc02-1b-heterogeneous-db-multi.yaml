id: clfc02-1b-heterogeneous-db-multi
objective: "1.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company wants to migrate its on-premises Oracle database to Amazon Aurora PostgreSQL to stop paying for Oracle licenses.

    Which two AWS capabilities should the company use? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise veut migrer sa base de données Oracle sur site vers Amazon Aurora PostgreSQL pour ne plus payer de licences Oracle.

    Quelles sont les deux fonctionnalités AWS que l'entreprise doit utiliser ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text: { en: "AWS Transform MGN to replicate the Oracle server", fr: "AWS Transform MGN pour répliquer le serveur Oracle" }
    - id: b
      text: { en: "AWS DMS Schema Conversion to convert the database schema", fr: "AWS DMS Schema Conversion pour convertir le schéma de la base de données" }
    - id: c
      text: { en: "Migration Evaluator to transfer the database tables", fr: "Migration Evaluator pour transférer les tables de la base de données" }
    - id: d
      text: { en: "AWS Backup to copy the Oracle backups to Aurora", fr: "AWS Backup pour copier les sauvegardes Oracle vers Aurora" }
    - id: e
      text: { en: "AWS DMS to migrate the data to the target database", fr: "AWS DMS pour migrer les données vers la base de données cible" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Moving from Oracle to PostgreSQL changes the database engine. DMS Schema Conversion assesses the source schema and converts it to the target engine, and AWS DMS then migrates the data, with optional replication of ongoing changes."
    fr: "Passer d'Oracle à PostgreSQL change de moteur de base de données. DMS Schema Conversion évalue le schéma source et le convertit pour le moteur cible, puis AWS DMS migre les données, avec en option la réplication des modifications en cours."
  options:
    a:
      en: "AWS Transform MGN rehosts the server as is, so the database would still run Oracle on Amazon EC2."
      fr: "AWS Transform MGN réhéberge le serveur tel quel ; la base de données fonctionnerait donc toujours sous Oracle sur Amazon EC2."
    c:
      en: "Migration Evaluator builds a business case; it does not move any data."
      fr: "Migration Evaluator établit une analyse de rentabilisation ; il ne déplace aucune donnée."
    d:
      en: "AWS Backup protects resources with backups; it cannot convert an Oracle database to Aurora PostgreSQL."
      fr: "AWS Backup protège les ressources par des sauvegardes ; il ne peut pas convertir une base Oracle en Aurora PostgreSQL."
references:
  - title: "What is AWS Database Migration Service?"
    url: https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html
