id: clfc02-1a-cloud-benefits
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which of the following are benefits of moving workloads from an on-premises data center to the AWS Cloud? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Lesquels des éléments suivants sont des avantages du transfert de charges de travail d'un centre de données sur site vers le Cloud AWS ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "AWS becomes responsible for setting the company's IAM permissions.", fr: "AWS devient responsable de la définition des autorisations IAM de l'entreprise." }
    - id: b
      text: { en: "The company pays only for the resources that it consumes.", fr: "L'entreprise paie uniquement les ressources qu'elle consomme." }
    - id: c
      text: { en: "The company no longer has any security responsibilities.", fr: "L'entreprise n'a plus aucune responsabilité en matière de sécurité." }
    - id: d
      text: { en: "The company's bill stays the same every month, whatever its usage.", fr: "La facture de l'entreprise reste la même chaque mois, quelle que soit son utilisation." }
    - id: e
      text: { en: "The company can scale capacity up and down with only a few minutes' notice.", fr: "L'entreprise peut augmenter et réduire sa capacité en quelques minutes." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "In the AWS Cloud, the company trades fixed expense for variable expense and pays only for what it consumes. It also stops guessing capacity: it can use as much or as little capacity as it needs and scale up and down in minutes."
    fr: "Dans le Cloud AWS, l'entreprise remplace les dépenses fixes par des dépenses variables et ne paie que ce qu'elle consomme. Elle cesse aussi de deviner la capacité : elle peut utiliser autant ou aussi peu de capacité que nécessaire et l'augmenter ou la réduire en quelques minutes."
  options:
    a:
      en: "Under the shared responsibility model, the customer configures access permissions with IAM."
      fr: "Selon le modèle de responsabilité partagée, c'est le client qui configure les autorisations d'accès avec IAM."
    c:
      en: "AWS is responsible for security of the cloud, but the customer stays responsible for security in the cloud, such as its data and access permissions."
      fr: "AWS est responsable de la sécurité du cloud, mais le client reste responsable de la sécurité dans le cloud, par exemple de ses données et des autorisations d'accès."
    d:
      en: "With pay-as-you-go pricing, the bill follows usage; it is not a fixed amount."
      fr: "Avec la tarification à l'utilisation, la facture suit l'utilisation ; ce n'est pas un montant fixe."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
  - title: "Shared Responsibility Model"
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
