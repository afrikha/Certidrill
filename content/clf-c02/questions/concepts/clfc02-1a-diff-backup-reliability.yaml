id: clfc02-1a-diff-backup-reliability
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants to back up its data and regularly test restores so that it can recover the data after an accidental deletion. In the AWS Well-Architected Framework, which pillar includes the "Back up data" best practice?
  fr: |
    Une entreprise veut sauvegarder ses données et tester régulièrement leur restauration afin de pouvoir les récupérer après une suppression accidentelle. Dans le cadre AWS Well-Architected, quel pilier comprend la bonne pratique « Sauvegarder les données » ?
body:
  options:
    - id: a
      text: { en: "Security", fr: "Sécurité" }
    - id: b
      text: { en: "Cost optimization", fr: "Optimisation des coûts" }
    - id: c
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
    - id: d
      text: { en: "Reliability", fr: "Fiabilité" }
answer: { optionId: d }
explanation:
  correct:
    en: "\"Back up data\" (REL09) is a best practice of the failure management area of the reliability pillar, with fault isolation, withstanding component failures, testing reliability, and disaster recovery planning."
    fr: "« Sauvegarder les données » (REL09) est une bonne pratique du domaine de gestion des défaillances du pilier fiabilité, avec l'isolation des pannes, la résistance aux défaillances de composants, les tests de fiabilité et la planification de la reprise après sinistre."
  options:
    a:
      en: "The security pillar protects data at rest and in transit and classifies it, but backup and restore for recovery are in the reliability pillar."
      fr: "Le pilier sécurité protège les données au repos et en transit et les classifie, mais la sauvegarde et la restauration pour la récupération relèvent du pilier fiabilité."
    b:
      en: "Cost optimization manages the cost of resources, including storage, but does not own the backup best practice."
      fr: "L'optimisation des coûts gère le coût des ressources, y compris le stockage, mais la bonne pratique de sauvegarde n'en relève pas."
    c:
      en: "Operational excellence covers how teams run and improve operations, not the backup of workload data."
      fr: "L'excellence opérationnelle couvre la manière dont les équipes exploitent et améliorent les opérations, pas la sauvegarde des données de la charge de travail."
references:
  - title: "Reliability"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/reliability.html
