id: clfc02-1a-elasticity-ticket-sales
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online ticket seller automatically adds Amazon EC2 instances when ticket sales open for a popular concert and removes them when demand returns to normal. Which cloud concept does this illustrate?
  fr: |
    Un vendeur de billets en ligne ajoute automatiquement des instances Amazon EC2 à l'ouverture des ventes pour un concert populaire et les retire lorsque la demande revient à la normale. Quel concept du cloud cela illustre-t-il ?
body:
  options:
    - id: a
      text: { en: "High availability", fr: "Haute disponibilité" }
    - id: b
      text: { en: "Durability", fr: "Durabilité des données (durability)" }
    - id: c
      text: { en: "Agility", fr: "Agilité" }
    - id: d
      text: { en: "Elasticity", fr: "Élasticité" }
answer: { optionId: d }
explanation:
  correct:
    en: "Elasticity is the ability to acquire resources when they are needed and release them when they are no longer needed; in the cloud, this can happen automatically. The seller pays for the extra instances only during the peak."
    fr: "L'élasticité est la capacité à obtenir des ressources lorsqu'elles sont nécessaires et à les libérer lorsqu'elles ne le sont plus ; dans le cloud, cela peut se faire automatiquement. Le vendeur ne paie les instances supplémentaires que pendant le pic."
  options:
    a:
      en: "High availability is about continuing to provide the service despite failures, not about following demand."
      fr: "La haute disponibilité consiste à continuer à fournir le service malgré les défaillances, pas à suivre la demande."
    b:
      en: "Durability is about keeping data and functionality over time without loss."
      fr: "La durabilité des données (durability) consiste à conserver les données et le fonctionnement dans le temps, sans perte."
    c:
      en: "Agility is about setting up resources quickly to innovate faster; adding and removing capacity with demand is elasticity."
      fr: "L'agilité consiste à mettre en place rapidement des ressources pour innover plus vite ; ajouter et retirer de la capacité selon la demande relève de l'élasticité."
references:
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
