id: clfc02-1a-multi-az-benefit
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is a benefit of deploying an application across multiple Availability Zones in an AWS Region?
  fr: |
    Quel est l'avantage du déploiement d'une application dans plusieurs zones de disponibilité d'une Région AWS ?
body:
  options:
    - id: a
      text: { en: "The application can stay available if one Availability Zone fails.", fr: "L'application peut rester disponible si une zone de disponibilité tombe en panne." }
    - id: b
      text: { en: "The application gets lower latency for users on every continent.", fr: "L'application bénéficie d'une latence plus faible pour les utilisateurs de tous les continents." }
    - id: c
      text: { en: "The application automatically meets all compliance requirements.", fr: "L'application respecte automatiquement toutes les exigences de conformité." }
    - id: d
      text: { en: "The instances in the second Availability Zone are not charged.", fr: "Les instances de la deuxième zone de disponibilité ne sont pas facturées." }
answer: { optionId: a }
explanation:
  correct:
    en: "Availability Zones are physically separate, with independent power, cooling, and physical security. An application spread across several of them is isolated from failures such as a power outage in one zone, so it is more highly available and fault tolerant than in a single data center."
    fr: "Les zones de disponibilité sont physiquement séparées, avec une alimentation, un refroidissement et une sécurité physique indépendants. Une application répartie sur plusieurs zones est isolée des défaillances comme une coupure de courant dans une zone : elle est plus hautement disponible et plus tolérante aux pannes que dans un seul centre de données."
  options:
    b:
      en: "All the Availability Zones of a Region are in the same geographic area; reaching users on other continents needs other Regions or edge locations."
      fr: "Toutes les zones de disponibilité d'une Région se trouvent dans la même zone géographique ; atteindre les utilisateurs d'autres continents nécessite d'autres Régions ou des emplacements périphériques."
    c:
      en: "Compliance of the workload remains a customer responsibility; using several zones does not make it compliant."
      fr: "La conformité de la charge de travail reste de la responsabilité du client ; utiliser plusieurs zones ne la rend pas conforme."
    d:
      en: "Every instance is billed, whatever its Availability Zone."
      fr: "Chaque instance est facturée, quelle que soit sa zone de disponibilité."
references:
  - title: "Global Infrastructure Regions & AZs"
    url: https://aws.amazon.com/about-aws/global-infrastructure/regions_az/
  - title: "Global infrastructure"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/global-infrastructure.html
