id: clfc02-1a-diff-perf-vs-cost
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement describes the difference between the performance efficiency pillar and the cost optimization pillar of the AWS Well-Architected Framework?
  fr: |
    Quelle affirmation décrit la différence entre le pilier efficacité des performances et le pilier optimisation des coûts du cadre AWS Well-Architected ?
body:
  options:
    - id: a
      text: { en: "Performance efficiency covers recovery from failures, and cost optimization covers the selection of instance types.", fr: "L'efficacité des performances couvre la récupération après une défaillance, et l'optimisation des coûts couvre le choix des types d'instances." }
    - id: b
      text: { en: "Performance efficiency covers reducing energy consumption, and cost optimization covers meeting latency targets.", fr: "L'efficacité des performances couvre la réduction de la consommation d'énergie, et l'optimisation des coûts couvre l'atteinte des objectifs de latence." }
    - id: c
      text: { en: "Performance efficiency covers access control, and cost optimization covers running workloads at the lowest price point.", fr: "L'efficacité des performances couvre le contrôle d'accès, et l'optimisation des coûts couvre l'exécution des charges de travail au prix le plus bas." }
    - id: d
      text: { en: "Performance efficiency covers using resources efficiently to meet system requirements, and cost optimization covers delivering business value at the lowest price point.", fr: "L'efficacité des performances couvre l'utilisation efficace des ressources pour répondre aux exigences du système, et l'optimisation des coûts couvre la création de valeur métier au prix le plus bas." }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS defines performance efficiency as the ability to use computing resources efficiently to meet system requirements and to maintain that efficiency as demand and technologies change. Cost optimization is the ability to run systems that deliver business value at the lowest price point."
    fr: "AWS définit l'efficacité des performances comme la capacité à utiliser efficacement les ressources informatiques pour répondre aux exigences du système et à maintenir cette efficacité quand la demande et les technologies évoluent. L'optimisation des coûts est la capacité à exécuter des systèmes qui apportent de la valeur métier au prix le plus bas."
  options:
    a:
      en: "Recovery from failures belongs to the reliability pillar."
      fr: "La récupération après une défaillance relève du pilier fiabilité."
    b:
      en: "Reducing energy consumption belongs to the sustainability pillar, and latency targets are a performance requirement."
      fr: "La réduction de la consommation d'énergie relève du pilier durabilité, et les objectifs de latence sont une exigence de performance."
    c:
      en: "Access control belongs to the security pillar."
      fr: "Le contrôle d'accès relève du pilier sécurité."
references:
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
