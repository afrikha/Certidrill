id: clfc02-1c-templates-version-control
objective: "1.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores its AWS CloudFormation templates in a version control system and changes its infrastructure only by updating the templates.

    Which benefit does the company gain from this practice?
  fr: |
    Une entreprise stocke ses modèles AWS CloudFormation dans un système de gestion de versions et ne modifie son infrastructure qu'en mettant à jour les modèles.

    Quel avantage l'entreprise tire-t-elle de cette pratique ?
body:
  options:
    - id: a
      text: { en: "AWS applies a discount to resources that are deployed from versioned templates.", fr: "AWS applique une remise aux ressources déployées à partir de modèles versionnés." }
    - id: b
      text: { en: "The resources no longer need to be monitored after deployment.", fr: "Les ressources n'ont plus besoin d'être surveillées après leur déploiement." }
    - id: c
      text: { en: "The company knows what changed, who changed it, and when, and can return to a previous version.", fr: "L'entreprise sait ce qui a changé, qui l'a changé et quand, et peut revenir à une version précédente." }
    - id: d
      text: { en: "The company can skip testing changes before production.", fr: "L'entreprise peut se passer de tester les changements avant la production." }
answer: { optionId: c }
explanation:
  correct:
    en: "Templates are text files, so tracking their differences tracks the changes to the infrastructure, like source code. With version control, the company sees exactly what was changed, by whom, and when, and it can use a previous version of a template to reverse a change."
    fr: "Les modèles sont des fichiers texte : suivre leurs différences revient à suivre les changements de l'infrastructure, comme pour du code source. Avec la gestion de versions, l'entreprise voit exactement ce qui a été modifié, par qui et quand, et peut utiliser une version précédente d'un modèle pour annuler un changement."
  options:
    a:
      en: "AWS prices do not depend on how resources are deployed."
      fr: "Les prix AWS ne dépendent pas de la manière dont les ressources sont déployées."
    b:
      en: "Resources still need monitoring, whatever the way they are deployed."
      fr: "Les ressources doivent toujours être surveillées, quelle que soit la manière dont elles sont déployées."
    d:
      en: "Version control records changes, but it does not replace testing them."
      fr: "La gestion de versions enregistre les changements, mais elle ne remplace pas leurs tests."
references:
  - title: "What is CloudFormation? - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html
