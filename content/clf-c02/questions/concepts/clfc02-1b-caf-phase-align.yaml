id: clfc02-1b-caf-phase-align
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has prioritized its cloud transformation opportunities. Next, it must find capability gaps across the six AWS CAF perspectives, identify cross-organizational dependencies, and create strategies to improve its cloud readiness.

    Which AWS CAF phase includes these activities?
  fr: |
    Une entreprise a hiérarchisé ses opportunités de transformation vers le cloud. Elle doit ensuite trouver les lacunes de capacités dans les six perspectives AWS CAF, identifier les dépendances entre services et définir des stratégies pour améliorer sa préparation au cloud.

    Quelle phase AWS CAF comprend ces activités ?
body:
  options:
    - id: a
      text: { en: "Scale", fr: "Mettre à l'échelle (Scale)" }
    - id: b
      text: { en: "Launch", fr: "Lancer (Launch)" }
    - id: c
      text: { en: "Envision", fr: "Envisager (Envision)" }
    - id: d
      text: { en: "Align", fr: "Aligner (Align)" }
answer: { optionId: d }
explanation:
  correct:
    en: "The Align phase identifies capability gaps across the six perspectives, cross-organizational dependencies and stakeholder concerns. It produces strategies that improve cloud readiness and keep stakeholders aligned."
    fr: "La phase Aligner (Align) identifie les lacunes de capacités dans les six perspectives, les dépendances entre services et les préoccupations des parties prenantes. Elle produit des stratégies qui améliorent la préparation au cloud et maintiennent l'alignement des parties prenantes."
  options:
    a:
      en: "Scale expands production pilots and sustains their benefits; it does not assess capability gaps."
      fr: "La phase Mettre à l'échelle (Scale) étend les pilotes en production et pérennise leurs bénéfices ; elle n'évalue pas les lacunes de capacités."
    b:
      en: "Launch delivers pilots in production; readiness gaps should already be addressed before that."
      fr: "La phase Lancer (Launch) met des pilotes en production ; les lacunes de préparation doivent déjà être traitées."
    c:
      en: "Envision is where the opportunities are identified and prioritized, which the company has already done."
      fr: "C'est pendant la phase Envisager (Envision) que les opportunités sont identifiées et hiérarchisées, ce que l'entreprise a déjà fait."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
