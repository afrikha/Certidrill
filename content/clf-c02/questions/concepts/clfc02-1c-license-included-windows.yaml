id: clfc02-1c-license-included-windows
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company launches an Amazon EC2 instance from an AWS-provided Windows Server AMI. The company does not own any Windows Server licenses.

    How does the company pay for the Windows Server license?
  fr: |
    Une entreprise lance une instance Amazon EC2 à partir d'une AMI Windows Server fournie par AWS. L'entreprise ne possède aucune licence Windows Server.

    Comment l'entreprise paie-t-elle la licence Windows Server ?
body:
  options:
    - id: a
      text: { en: "The license cost is included in the pay-as-you-go price of the instance.", fr: "Le coût de la licence est inclus dans le prix à l'utilisation de l'instance." }
    - id: b
      text: { en: "The company buys a license from Microsoft and registers it with AWS.", fr: "L'entreprise achète une licence auprès de Microsoft et l'enregistre auprès d'AWS." }
    - id: c
      text: { en: "AWS bills a one-time license fee when the instance is first launched.", fr: "AWS facture des frais de licence uniques au premier lancement de l'instance." }
    - id: d
      text: { en: "The company must run the instance on a Dedicated Host to receive a license.", fr: "L'entreprise doit exécuter l'instance sur un Dedicated Host pour obtenir une licence." }
answer: { optionId: a }
explanation:
  correct:
    en: "Instances launched from AWS-provided Windows Server AMIs are license included: AWS handles the licensing, and the company pays the Windows price of the instance for the time that it uses it. No separate license purchase is needed."
    fr: "Les instances lancées à partir d'AMI Windows Server fournies par AWS sont en licence incluse : AWS gère les licences, et l'entreprise paie le tarif Windows de l'instance pour la durée d'utilisation. Aucun achat de licence distinct n'est nécessaire."
  options:
    b:
      en: "Buying licenses from the vendor and bringing them to AWS is the BYOL model, which the company does not use here."
      fr: "Acheter des licences auprès de l'éditeur et les apporter sur AWS correspond au modèle BYOL, que l'entreprise n'utilise pas ici."
    c:
      en: "License-included pricing is pay-as-you-go; there is no one-time license fee at launch."
      fr: "La tarification avec licence incluse est à l'utilisation : il n'y a pas de frais de licence uniques au lancement."
    d:
      en: "Dedicated Hosts are needed for some BYOL scenarios, not to receive a license-included Windows Server instance."
      fr: "Les Dedicated Hosts sont nécessaires pour certains scénarios BYOL, pas pour obtenir une instance Windows Server avec licence incluse."
references:
  - title: "Microsoft FAQ – AWS"
    url: https://aws.amazon.com/windows/faq/
