id: clfc02-1a-gi-multi-region-dr
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company must keep its application running even if an entire AWS Region becomes unavailable. Which deployment meets this requirement?
  fr: |
    Une entreprise doit maintenir son application en fonctionnement même si une Région AWS entière devient indisponible. Quel déploiement répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Deploy the application in three Availability Zones of the same Region", fr: "Déployer l'application dans trois zones de disponibilité de la même Région" }
    - id: b
      text: { en: "Deploy the application in two AWS Regions", fr: "Déployer l'application dans deux Régions AWS" }
    - id: c
      text: { en: "Deploy the application on the largest instance type in one Availability Zone", fr: "Déployer l'application sur le plus grand type d'instance dans une seule zone de disponibilité" }
    - id: d
      text: { en: "Deploy the application in one Region and cache its content in edge locations", fr: "Déployer l'application dans une Région et mettre son contenu en cache dans des emplacements périphériques" }
answer: { optionId: b }
explanation:
  correct:
    en: "Regions are isolated and independent from each other, so a failure is limited to a single Region and other Regions keep operating normally. Only a deployment in a second Region keeps the application running when a whole Region is unavailable."
    fr: "Les Régions sont isolées et indépendantes les unes des autres : une défaillance reste limitée à une seule Région et les autres Régions continuent de fonctionner normalement. Seul un déploiement dans une deuxième Région maintient l'application en fonctionnement lorsqu'une Région entière est indisponible."
  options:
    a:
      en: "Several Availability Zones protect against the failure of one zone, but all of them are in the Region that becomes unavailable."
      fr: "Plusieurs zones de disponibilité protègent contre la défaillance d'une zone, mais elles se trouvent toutes dans la Région qui devient indisponible."
    c:
      en: "A larger instance in one zone protects against neither a zone failure nor a Region failure."
      fr: "Une instance plus grande dans une seule zone ne protège ni contre la défaillance d'une zone ni contre celle d'une Région."
    d:
      en: "Edge locations can serve cached content, but the application itself still runs in a single Region."
      fr: "Les emplacements périphériques peuvent servir du contenu en cache, mais l'application elle-même s'exécute toujours dans une seule Région."
references:
  - title: "Regions"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/regions.html
