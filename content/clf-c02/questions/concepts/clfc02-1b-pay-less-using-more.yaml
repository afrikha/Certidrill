id: clfc02-1b-pay-less-using-more
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company stores more data in Amazon S3 every month. The price per GB of S3 Standard storage decreases as the total volume stored passes each pricing tier.

    Which AWS pricing principle does this illustrate?
  fr: |
    Une entreprise de médias stocke chaque mois davantage de données dans Amazon S3. Le prix par Go du stockage S3 Standard diminue à mesure que le volume total stocké franchit chaque palier tarifaire.

    Quel principe de tarification AWS cela illustre-t-il ?
body:
  options:
    - id: a
      text: { en: "Pay as you go", fr: "Paiement à l'utilisation (pay as you go)" }
    - id: b
      text: { en: "Trade fixed expense for variable expense", fr: "Remplacer les dépenses fixes par des dépenses variables" }
    - id: c
      text: { en: "Save when you commit", fr: "Économiser en s'engageant (save when you commit)" }
    - id: d
      text: { en: "Pay less by using more", fr: "Payer moins en utilisant plus (pay less by using more)" }
answer: { optionId: d }
explanation:
  correct:
    en: "Pay less by using more refers to volume-based discounts: for services such as Amazon S3, pricing is tiered, so the more you use, the less you pay per GB. The company receives the discount without any commitment."
    fr: "Le principe « payer moins en utilisant plus » désigne les remises sur volume : pour des services comme Amazon S3, la tarification est par paliers, donc plus on utilise, moins on paie par Go. L'entreprise bénéficie de la remise sans aucun engagement."
  options:
    a:
      en: "Pay as you go explains why the company pays only for what it stores, not why the unit price falls as volume grows."
      fr: "Le paiement à l'utilisation explique pourquoi l'entreprise ne paie que ce qu'elle stocke, pas pourquoi le prix unitaire baisse quand le volume augmente."
    b:
      en: "Trading fixed expense for variable expense is about replacing upfront investments with usage-based costs, not about volume discounts."
      fr: "Remplacer les dépenses fixes par des dépenses variables consiste à substituer des coûts à l'usage aux investissements initiaux ; cela ne concerne pas les remises sur volume."
    c:
      en: "Save when you commit requires a term commitment; tiered S3 pricing applies automatically."
      fr: "Le principe « économiser en s'engageant » exige un engagement de durée ; la tarification S3 par paliers s'applique automatiquement."
references:
  - title: "AWS Product and Service Pricing"
    url: https://aws.amazon.com/pricing/
