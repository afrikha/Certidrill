id: clfc02-1a-cloud-computing-definition
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes cloud computing?
  fr: |
    Quelle affirmation décrit le cloud computing ?
body:
  options:
    - id: a
      text: { en: "Getting computing resources over the internet on demand, with pay-as-you-go pricing", fr: "Obtenir des ressources informatiques à la demande via Internet, avec une tarification à l'utilisation" }
    - id: b
      text: { en: "Leasing a dedicated data center building from a provider under a multi-year contract", fr: "Louer un bâtiment de centre de données dédié auprès d'un fournisseur avec un contrat pluriannuel" }
    - id: c
      text: { en: "Buying servers from a provider and installing them in the company's own data center", fr: "Acheter des serveurs auprès d'un fournisseur et les installer dans le centre de données de l'entreprise" }
    - id: d
      text: { en: "Running virtual machines only on physical servers that the company owns", fr: "Exécuter des machines virtuelles uniquement sur des serveurs physiques dont l'entreprise est propriétaire" }
answer: { optionId: a }
explanation:
  correct:
    en: "Cloud computing is a way to get computing resources, such as processing power, storage, and databases, over the internet on demand. Customers pay as they go instead of buying and maintaining their own servers and data centers."
    fr: "Le cloud computing est un moyen d'obtenir des ressources informatiques, comme de la puissance de traitement, du stockage et des bases de données, à la demande via Internet. Les clients paient à l'utilisation au lieu d'acheter et d'entretenir leurs propres serveurs et centres de données."
  options:
    b:
      en: "A multi-year lease of a dedicated building is a fixed commitment, not on-demand resources paid as they are used."
      fr: "La location pluriannuelle d'un bâtiment dédié est un engagement fixe, pas des ressources à la demande payées à l'utilisation."
    c:
      en: "Buying and installing servers in the company's own data center is an on-premises deployment."
      fr: "Acheter et installer des serveurs dans le centre de données de l'entreprise correspond à un déploiement sur site."
    d:
      en: "Virtualization on servers the company owns is still on-premises infrastructure that the company buys and maintains."
      fr: "La virtualisation sur des serveurs dont l'entreprise est propriétaire reste une infrastructure sur site que l'entreprise achète et entretient."
references:
  - title: "What is Cloud Computing?"
    url: https://aws.amazon.com/what-is-cloud-computing/
