id: clfc02-1b-test-env-business-hours
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's test environment is used only during business hours on weekdays. On premises, its servers run and cost the same 24 hours a day.

    After moving the environment to Amazon EC2 On-Demand Instances, how can the company reduce its compute cost?
  fr: |
    L'environnement de test d'une entreprise n'est utilisé que pendant les heures ouvrées en semaine. Sur site, ses serveurs fonctionnent et coûtent autant 24 heures sur 24.

    Après avoir déplacé l'environnement vers des instances Amazon EC2 On-Demand, comment l'entreprise peut-elle réduire son coût de calcul ?
body:
  options:
    - id: a
      text: { en: "Move the instances to Dedicated Hosts, which are billed only during business hours.", fr: "Déplacer les instances vers des Dedicated Hosts, facturés uniquement pendant les heures ouvrées." }
    - id: b
      text: { en: "Buy a 3-year Reserved Instance for each server so that they can run all the time.", fr: "Acheter une instance réservée sur 3 ans pour chaque serveur afin de les faire fonctionner en permanence." }
    - id: c
      text: { en: "Stop the instances outside business hours; stopped instances are not billed for compute.", fr: "Arrêter les instances en dehors des heures ouvrées ; les instances arrêtées ne sont pas facturées pour le calcul." }
    - id: d
      text: { en: "Keep the instances running, because On-Demand compute is billed per month, not per hour.", fr: "Laisser les instances fonctionner, car le calcul On-Demand est facturé au mois et non à l'heure." }
answer: { optionId: c }
explanation:
  correct:
    en: "On-Demand Instances are billed only while they run. A stopped instance is not charged for usage, so stopping the test servers outside business hours removes most of their compute cost; their EBS volumes are still billed."
    fr: "Les instances On-Demand ne sont facturées que lorsqu'elles s'exécutent. Une instance arrêtée n'est pas facturée pour son utilisation : arrêter les serveurs de test en dehors des heures ouvrées supprime donc l'essentiel de leur coût de calcul ; leurs volumes EBS restent facturés."
  options:
    a:
      en: "An active Dedicated Host is billed for as long as it is allocated, regardless of the instances launched on it."
      fr: "Un Dedicated Host actif est facturé tant qu'il est alloué, quelles que soient les instances lancées dessus."
    b:
      en: "Reserved Instances are a 1-year or 3-year commitment paid for the whole term, the opposite of paying only for business hours."
      fr: "Les instances réservées sont un engagement d'un an ou de trois ans payé pour toute la durée, l'inverse d'un paiement limité aux heures ouvrées."
    d:
      en: "On-Demand compute is billed for the time that instances run, so keeping them running keeps the cost."
      fr: "Le calcul On-Demand est facturé pour la durée d'exécution des instances ; les laisser fonctionner maintient donc le coût."
references:
  - title: "Amazon EC2 instance state changes"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-lifecycle.html
  - title: "Amazon EC2 Dedicated Host pricing and billing"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-billing.html
