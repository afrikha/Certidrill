id: clfc02-1a-adv-economies-of-scale
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company already pays for Amazon EC2 capacity by the hour. Its finance team notices that the price of an instance is lower than the company's own cost per server-hour in its data center. Which advantage of cloud computing explains why AWS can offer this lower price?
  fr: |
    Une entreprise paie déjà la capacité Amazon EC2 à l'heure. Son équipe financière constate que le prix d'une instance est inférieur au coût horaire d'un serveur dans son propre centre de données. Quel avantage du cloud computing explique pourquoi AWS peut proposer ce prix plus bas ?
body:
  options:
    - id: a
      text: { en: "Trade fixed expense for variable expense", fr: "Remplacer les dépenses fixes par des dépenses variables" }
    - id: b
      text: { en: "Stop guessing capacity", fr: "Arrêter de deviner la capacité nécessaire" }
    - id: c
      text: { en: "Stop spending money running and maintaining data centers", fr: "Arrêter de dépenser de l'argent pour exploiter et entretenir des centres de données" }
    - id: d
      text: { en: "Benefit from massive economies of scale", fr: "Bénéficier d'économies d'échelle massives" }
answer: { optionId: d }
explanation:
  correct:
    en: "Because AWS aggregates the usage of hundreds of thousands of customers, it achieves higher economies of scale than a single company can. These economies translate into lower pay-as-you-go prices, so the variable cost is lower than what the company gets on its own."
    fr: "Comme AWS regroupe l'utilisation de centaines de milliers de clients, il réalise des économies d'échelle plus importantes qu'une seule entreprise. Ces économies se traduisent par des prix à l'utilisation plus bas : le coût variable est inférieur à celui que l'entreprise obtient seule."
  options:
    a:
      en: "The company already has a variable expense; trading fixed for variable expense explains the pricing model, not why the unit price is lower."
      fr: "L'entreprise a déjà une dépense variable ; remplacer les dépenses fixes par des dépenses variables explique le modèle de tarification, pas pourquoi le prix unitaire est plus bas."
    b:
      en: "Stopping capacity guesswork avoids idle or insufficient capacity; it does not lower the price of each instance-hour."
      fr: "Arrêter de deviner la capacité évite une capacité inutilisée ou insuffisante ; cela ne réduit pas le prix de chaque heure d'instance."
    c:
      en: "This advantage lets the company focus on its business instead of data center operations; the lower unit price comes from AWS's scale."
      fr: "Cet avantage permet à l'entreprise de se concentrer sur son métier plutôt que sur l'exploitation de centres de données ; le prix unitaire plus bas vient de l'échelle d'AWS."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
