id: clfc02-1b-lambda-short-job
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a small script for 3 minutes once a day on a dedicated on-premises server that stays powered on all day.

    Which AWS option will run this script at the LOWEST cost?
  fr: |
    Une entreprise exécute un petit script pendant 3 minutes une fois par jour sur un serveur sur site dédié qui reste allumé toute la journée.

    Quelle option AWS exécutera ce script au coût le PLUS bas ?
body:
  options:
    - id: a
      text: { en: "An AWS Lambda function that runs once a day", fr: "Une fonction AWS Lambda exécutée une fois par jour" }
    - id: b
      text: { en: "An Amazon EC2 Reserved Instance with a 1-year term", fr: "Une instance réservée Amazon EC2 sur une durée d'un an" }
    - id: c
      text: { en: "An Amazon EC2 Dedicated Host allocated for the script", fr: "Un Amazon EC2 Dedicated Host alloué au script" }
    - id: d
      text: { en: "An Amazon EC2 On-Demand Instance that runs all day", fr: "Une instance Amazon EC2 On-Demand qui s'exécute toute la journée" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Lambda charges for the number of requests and the duration of the code execution, and nothing when the code is not running. A 3-minute daily run is billed only for those minutes, not for the idle time between runs."
    fr: "AWS Lambda facture le nombre de requêtes et la durée d'exécution du code, et rien quand le code ne s'exécute pas. Une exécution quotidienne de 3 minutes n'est facturée que pour ces minutes, pas pour le temps d'inactivité entre deux exécutions."
  options:
    b:
      en: "A Reserved Instance commits to paying for the whole term, which repeats the cost of an always-on server."
      fr: "Une instance réservée engage à payer toute la durée, ce qui reproduit le coût d'un serveur toujours allumé."
    c:
      en: "A Dedicated Host is a whole physical server billed for as long as it is allocated, the most expensive option here."
      fr: "Un Dedicated Host est un serveur physique entier facturé tant qu'il est alloué ; c'est ici l'option la plus coûteuse."
    d:
      en: "An instance that runs all day is billed for every hour, although the script needs only 3 minutes."
      fr: "Une instance qui s'exécute toute la journée est facturée pour chaque heure, alors que le script n'a besoin que de 3 minutes."
references:
  - title: "AWS Lambda Pricing"
    url: https://aws.amazon.com/lambda/pricing/
  - title: "Amazon EC2 Dedicated Host pricing and billing"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-billing.html
