id: clfc02-1b-uncertain-demand-risk
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is launching a new mobile game and cannot predict how many players it will attract.

    Why does a variable cost model on AWS reduce the company's financial risk?
  fr: |
    Une entreprise lance un nouveau jeu mobile et ne peut pas prévoir combien de joueurs il attirera.

    Pourquoi un modèle de coûts variables sur AWS réduit-il le risque financier de l'entreprise ?
body:
  options:
    - id: a
      text: { en: "The company does not buy capacity upfront, and its costs grow only if usage grows.", fr: "L'entreprise n'achète pas de capacité à l'avance, et ses coûts n'augmentent que si l'utilisation augmente." }
    - id: b
      text: { en: "AWS refunds at the end of each month the cost of resources that players did not use.", fr: "AWS rembourse à la fin de chaque mois le coût des ressources que les joueurs n'ont pas utilisées." }
    - id: c
      text: { en: "The company must reserve its capacity for three years before the game is launched.", fr: "L'entreprise doit réserver sa capacité pour trois ans avant le lancement du jeu." }
    - id: d
      text: { en: "AWS guarantees the same fixed monthly price whatever the number of players it attracts.", fr: "AWS garantit le même prix mensuel fixe quel que soit le nombre de joueurs attirés." }
answer: { optionId: a }
explanation:
  correct:
    en: "With variable costs, the company does not invest in capacity for demand that may never come. It pays for the resources that it consumes, so if the game attracts few players, costs stay low, and if it succeeds, capacity and costs grow with it."
    fr: "Avec des coûts variables, l'entreprise n'investit pas dans une capacité destinée à une demande qui pourrait ne jamais venir. Elle paie les ressources qu'elle consomme : si le jeu attire peu de joueurs, les coûts restent faibles, et s'il réussit, la capacité et les coûts augmentent avec lui."
  options:
    b:
      en: "AWS bills the resources that run, whether or not players use them; the company must remove unneeded resources itself."
      fr: "AWS facture les ressources qui s'exécutent, que les joueurs les utilisent ou non ; l'entreprise doit retirer elle-même les ressources inutiles."
    c:
      en: "A three-year reservation is a commitment, the opposite of keeping costs variable under uncertain demand."
      fr: "Une réservation sur trois ans est un engagement, l'inverse d'un maintien de coûts variables face à une demande incertaine."
    d:
      en: "AWS prices are based on usage; there is no fixed monthly price independent of consumption."
      fr: "Les prix d'AWS dépendent de l'utilisation ; il n'existe pas de prix mensuel fixe indépendant de la consommation."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
