id: clfc02-1a-pillar-reliability-recovery
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants its workload to recover automatically when a failure occurs, and it wants to test its recovery procedures regularly. Which pillar of the AWS Well-Architected Framework includes these design principles?
  fr: |
    Une entreprise veut que sa charge de travail récupère automatiquement en cas de défaillance, et elle veut tester régulièrement ses procédures de récupération. Quel pilier du cadre AWS Well-Architected comprend ces principes de conception ?
body:
  options:
    - id: a
      text: { en: "Performance efficiency", fr: "Efficacité des performances" }
    - id: b
      text: { en: "Reliability", fr: "Fiabilité" }
    - id: c
      text: { en: "Security", fr: "Sécurité" }
    - id: d
      text: { en: "Sustainability", fr: "Durabilité" }
answer: { optionId: b }
explanation:
  correct:
    en: "\"Automatically recover from failure\" and \"Test recovery procedures\" are design principles of the reliability pillar. In the cloud, a team can simulate failures and validate its recovery procedures before a real failure occurs."
    fr: "« Récupérer automatiquement après une défaillance » et « Tester les procédures de récupération » sont des principes de conception du pilier fiabilité. Dans le cloud, une équipe peut simuler des défaillances et valider ses procédures de récupération avant qu'une vraie défaillance ne se produise."
  options:
    a:
      en: "Performance efficiency is about using resources efficiently to meet requirements, not about recovering from failures."
      fr: "L'efficacité des performances concerne l'utilisation efficace des ressources pour répondre aux exigences, pas la récupération après une défaillance."
    c:
      en: "Security prepares for security events, but automatic recovery from failures is a reliability principle."
      fr: "La sécurité prépare aux événements de sécurité, mais la récupération automatique après une défaillance est un principe de fiabilité."
    d:
      en: "Sustainability is about reducing the environmental impact of workloads."
      fr: "La durabilité concerne la réduction de l'impact environnemental des charges de travail."
references:
  - title: "Design principles"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/rel-dp.html
