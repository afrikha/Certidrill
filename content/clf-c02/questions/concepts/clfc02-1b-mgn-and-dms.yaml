id: clfc02-1b-mgn-and-dms
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has approved its migration business case. It must now move its on-premises Linux application servers to Amazon EC2 and its Oracle database to Amazon RDS for Oracle, with minimal downtime for both.

    Which two AWS services should the company use? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise a approuvé son analyse de rentabilisation de la migration. Elle doit maintenant déplacer ses serveurs d'applications Linux sur site vers Amazon EC2 et sa base de données Oracle vers Amazon RDS for Oracle, avec un temps d'arrêt minimal pour les deux.

    Quels sont les deux services AWS que l'entreprise doit utiliser ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Migration Evaluator", fr: "Migration Evaluator" }
    - id: b
      text: { en: "AWS Transform MGN (formerly AWS Application Migration Service)", fr: "AWS Transform MGN (anciennement AWS Application Migration Service)" }
    - id: c
      text: { en: "AWS Pricing Calculator", fr: "AWS Pricing Calculator" }
    - id: d
      text: { en: "AWS Database Migration Service (AWS DMS)", fr: "AWS Database Migration Service (AWS DMS)" }
    - id: e
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "AWS Transform MGN continuously replicates source servers at block level and launches them on AWS with a short cutover window. AWS DMS migrates the database to Amazon RDS and can replicate ongoing changes to keep the source and target in sync until cutover."
    fr: "AWS Transform MGN réplique en continu les serveurs sources au niveau bloc et les lance sur AWS avec une fenêtre de bascule courte. AWS DMS migre la base de données vers Amazon RDS et peut répliquer les modifications en cours pour garder la source et la cible synchronisées jusqu'à la bascule."
  options:
    a:
      en: "Migration Evaluator builds the business case, which the company has already approved; it does not move workloads."
      fr: "Migration Evaluator établit l'analyse de rentabilisation, que l'entreprise a déjà approuvée ; il ne déplace pas de charges de travail."
    c:
      en: "AWS Pricing Calculator estimates the cost of planned AWS resources; it does not migrate anything."
      fr: "AWS Pricing Calculator estime le coût des ressources AWS prévues ; il ne migre rien."
    e:
      en: "Trusted Advisor checks existing AWS resources against best practices; it is not a migration service."
      fr: "Trusted Advisor vérifie les ressources AWS existantes au regard des bonnes pratiques ; ce n'est pas un service de migration."
references:
  - title: "What Is AWS Transform MGN?"
    url: https://docs.aws.amazon.com/mgn/latest/ug/what-is-application-migration-service.html
  - title: "What is AWS Database Migration Service?"
    url: https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html
