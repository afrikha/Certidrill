id: clfc02-1a-adv-speed-agility
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Developers at a company wait several weeks for new servers to be bought and installed. In the AWS Cloud, they can get new resources in minutes, which lowers the cost and time of experimenting. Which advantage of cloud computing does this describe?
  fr: |
    Les développeurs d'une entreprise attendent plusieurs semaines que de nouveaux serveurs soient achetés et installés. Dans le Cloud AWS, ils peuvent obtenir de nouvelles ressources en quelques minutes, ce qui réduit le coût et le temps des expérimentations. Quel avantage du cloud computing cela décrit-il ?
body:
  options:
    - id: a
      text: { en: "Stop spending money running and maintaining data centers", fr: "Arrêter de dépenser de l'argent pour exploiter et entretenir des centres de données" }
    - id: b
      text: { en: "Trade fixed expense for variable expense", fr: "Remplacer les dépenses fixes par des dépenses variables" }
    - id: c
      text: { en: "Increase speed and agility", fr: "Gagner en rapidité et en agilité" }
    - id: d
      text: { en: "Stop guessing capacity", fr: "Arrêter de deviner la capacité nécessaire" }
answer: { optionId: c }
explanation:
  correct:
    en: "In the cloud, new IT resources are only a click away, so the time to make them available to developers drops from weeks to minutes. Because experimenting and developing costs less time and money, the organization becomes much more agile."
    fr: "Dans le cloud, de nouvelles ressources informatiques sont disponibles en un clic : le délai de mise à disposition pour les développeurs passe de plusieurs semaines à quelques minutes. Comme expérimenter et développer coûte moins de temps et d'argent, l'organisation devient beaucoup plus agile."
  options:
    a:
      en: "This advantage is about letting AWS handle racking, stacking, and powering servers so that the company can focus on its customers."
      fr: "Cet avantage consiste à laisser AWS installer, empiler et alimenter les serveurs pour que l'entreprise se concentre sur ses clients."
    b:
      en: "This advantage is about paying only when and as much as resources are consumed, instead of investing in hardware upfront."
      fr: "Cet avantage consiste à ne payer que lorsque des ressources sont consommées, et à hauteur de cette consommation, au lieu d'investir à l'avance dans du matériel."
    d:
      en: "This advantage is about scaling capacity up and down as needed instead of deciding it before deployment."
      fr: "Cet avantage consiste à augmenter et réduire la capacité selon les besoins au lieu de la fixer avant le déploiement."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
