id: clfc02-1a-gi-region-near-users
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Most of a company's customers are in Japan. The company wants to lower network latency for these customers when it deploys a new application on AWS. What should the company do?
  fr: |
    La plupart des clients d'une entreprise se trouvent au Japon. L'entreprise veut réduire la latence réseau pour ces clients lorsqu'elle déploie une nouvelle application sur AWS. Que doit-elle faire ?
body:
  options:
    - id: a
      text: { en: "Deploy the application in the AWS Region that has the most Availability Zones", fr: "Déployer l'application dans la Région AWS qui compte le plus de zones de disponibilité" }
    - id: b
      text: { en: "Deploy the application in several Availability Zones of a Region on another continent", fr: "Déployer l'application dans plusieurs zones de disponibilité d'une Région située sur un autre continent" }
    - id: c
      text: { en: "Deploy the application in an AWS Region close to the majority of its customers", fr: "Déployer l'application dans une Région AWS proche de la majorité de ses clients" }
    - id: d
      text: { en: "Deploy the application in the US East (N. Virginia) Region, which is enabled by default", fr: "Déployer l'application dans la Région USA Est (Virginie du Nord), activée par défaut" }
answer: { optionId: c }
explanation:
  correct:
    en: "Selecting a Region that is close to the majority of users lowers network latency. Because an AWS account provides multiple Regions, the company can create its resources in the location that meets this requirement."
    fr: "Choisir une Région proche de la majorité des utilisateurs réduit la latence réseau. Comme un compte AWS donne accès à plusieurs Régions, l'entreprise peut créer ses ressources à l'emplacement qui répond à cette exigence."
  options:
    a:
      en: "The number of Availability Zones does not decide latency; the distance between users and the Region does."
      fr: "Le nombre de zones de disponibilité ne détermine pas la latence ; c'est la distance entre les utilisateurs et la Région qui la détermine."
    b:
      en: "Several Availability Zones improve availability, but a Region on another continent keeps latency high for users in Japan."
      fr: "Plusieurs zones de disponibilité améliorent la disponibilité, mais une Région sur un autre continent maintient une latence élevée pour les utilisateurs au Japon."
    d:
      en: "Being enabled by default says nothing about latency, and this Region is far from Japan."
      fr: "Être activée par défaut ne dit rien de la latence, et cette Région est loin du Japon."
references:
  - title: "AWS Regions"
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions.html
