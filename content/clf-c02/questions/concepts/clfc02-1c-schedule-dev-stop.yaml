id: clfc02-1c-schedule-dev-stop
objective: "1.4.7"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    A company's development environment runs 24 hours a day, 7 days a week. Developers use it only 8 hours a day, 5 days a week. The company plans to automate stopping the environment outside working hours.

    By approximately how much will this automation reduce the running hours of the environment?
  fr: |
    L'environnement de développement d'une entreprise fonctionne 24 heures sur 24, 7 jours sur 7. Les développeurs ne l'utilisent que 8 heures par jour, 5 jours par semaine. L'entreprise prévoit d'automatiser l'arrêt de l'environnement en dehors des heures de travail.

    De combien environ cette automatisation réduira-t-elle les heures de fonctionnement de l'environnement ?
body:
  options:
    - id: a
      text: { en: "25%", fr: "25 %" }
    - id: b
      text: { en: "50%", fr: "50 %" }
    - id: c
      text: { en: "75%", fr: "75 %" }
    - id: d
      text: { en: "90%", fr: "90 %" }
answer: { optionId: c }
explanation:
  correct:
    en: "The environment is needed for 40 hours of the 168 hours in a week. Stopping it automatically for the other hours cuts its running time, and its compute cost, by about 75%, as the cost optimization design principle \"Adopt a consumption model\" explains."
    fr: "L'environnement est nécessaire 40 heures sur les 168 heures d'une semaine. L'arrêter automatiquement le reste du temps réduit sa durée de fonctionnement, et son coût de calcul, d'environ 75 %, comme l'explique le principe de conception « Adopt a consumption model » du pilier Optimisation des coûts."
  options:
    a:
      en: "A 25% reduction would mean that the environment still runs about 126 hours a week, far more than the 40 hours needed."
      fr: "Une réduction de 25 % signifierait que l'environnement fonctionne encore environ 126 heures par semaine, bien plus que les 40 heures nécessaires."
    b:
      en: "A 50% reduction would leave about 84 running hours a week, more than twice the 40 hours needed."
      fr: "Une réduction de 50 % laisserait environ 84 heures de fonctionnement par semaine, plus du double des 40 heures nécessaires."
    d:
      en: "A 90% reduction would leave about 17 hours a week, less than the 40 hours that developers use."
      fr: "Une réduction de 90 % laisserait environ 17 heures par semaine, moins que les 40 heures utilisées par les développeurs."
references:
  - title: "Design principles - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/cost-dp.html
