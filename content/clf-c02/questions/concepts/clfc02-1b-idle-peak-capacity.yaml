id: clfc02-1b-idle-peak-capacity
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company bought enough on-premises servers to handle its yearly holiday peak. For the rest of the year, most of these servers are idle.

    How can moving to AWS reduce this cost?
  fr: |
    Une entreprise de distribution a acheté assez de serveurs sur site pour absorber son pic annuel des fêtes. Le reste de l'année, la plupart de ces serveurs sont inactifs.

    Comment le passage à AWS peut-il réduire ce coût ?
body:
  options:
    - id: a
      text: { en: "Buy Reserved Instances that cover the peak capacity for the whole year.", fr: "Acheter des instances réservées qui couvrent la capacité de pointe toute l'année." }
    - id: b
      text: { en: "Pay AWS a fixed monthly fee that is based on the expected peak capacity.", fr: "Payer à AWS des frais mensuels fixes calculés sur la capacité de pointe prévue." }
    - id: c
      text: { en: "Run all the peak servers on Dedicated Hosts that stay allocated all year.", fr: "Exécuter tous les serveurs de pointe sur des Dedicated Hosts qui restent alloués toute l'année." }
    - id: d
      text: { en: "Add capacity during the peak, remove it afterward, and pay only for what runs.", fr: "Ajouter de la capacité pendant le pic, la retirer ensuite, et ne payer que ce qui s'exécute." }
answer: { optionId: d }
explanation:
  correct:
    en: "In the cloud, the company accesses as much or as little capacity as it needs and scales up or down in minutes. It runs extra capacity only during the peak and stops paying for it when it is removed."
    fr: "Dans le cloud, l'entreprise accède à autant ou aussi peu de capacité qu'elle le souhaite, et monte ou descend en charge en quelques minutes. Elle n'exécute de la capacité supplémentaire que pendant le pic et cesse de la payer une fois retirée."
  options:
    a:
      en: "Reserving the peak capacity for the whole year keeps paying for capacity that is idle most of the year."
      fr: "Réserver la capacité de pointe toute l'année revient à payer une capacité inactive la plus grande partie de l'année."
    b:
      en: "AWS does not bill a fixed fee for expected peak capacity; compute is billed for what is used."
      fr: "AWS ne facture pas de frais fixes sur la capacité de pointe prévue ; le calcul est facturé selon l'utilisation."
    c:
      en: "Dedicated Hosts allocated all year reproduce the idle hardware cost of the data center."
      fr: "Des Dedicated Hosts alloués toute l'année reproduisent le coût du matériel inactif du centre de données."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
