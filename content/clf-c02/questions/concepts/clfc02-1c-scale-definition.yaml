id: clfc02-1c-scale-definition
objective: "1.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes economies of scale?
  fr: |
    Quelle affirmation décrit les économies d'échelle ?
body:
  options:
    - id: a
      text: { en: "The cost of each unit decreases as the volume of operations increases.", fr: "Le coût de chaque unité diminue à mesure que le volume d'activité augmente." }
    - id: b
      text: { en: "The total cost stays the same, whatever the volume of operations.", fr: "Le coût total reste le même, quel que soit le volume d'activité." }
    - id: c
      text: { en: "The cost of each unit increases as more customers use the same service.", fr: "Le coût de chaque unité augmente à mesure que davantage de clients utilisent le même service." }
    - id: d
      text: { en: "Costs are paid in advance for a fixed term in exchange for a discount.", fr: "Les coûts sont payés à l'avance pour une durée fixe en échange d'une remise." }
answer: { optionId: a }
explanation:
  correct:
    en: "Economies of scale mean that the cost of each unit goes down as the scale of operations goes up. AWS operates at a very large scale for many customers, so its variable expenses are much lower than what a company would pay to do it itself."
    fr: "Les économies d'échelle signifient que le coût de chaque unité baisse à mesure que l'échelle d'activité augmente. AWS opère à très grande échelle pour de nombreux clients : ses dépenses variables sont donc bien plus faibles que ce qu'une entreprise paierait pour le faire elle-même."
  options:
    b:
      en: "A total cost that does not change with volume describes a fixed cost, not economies of scale."
      fr: "Un coût total qui ne change pas avec le volume décrit un coût fixe, pas des économies d'échelle."
    c:
      en: "A unit cost that rises with volume is the opposite of economies of scale."
      fr: "Un coût unitaire qui augmente avec le volume est l'inverse des économies d'échelle."
    d:
      en: "Paying in advance for a term in exchange for a discount describes a commitment model, such as Reserved Instances."
      fr: "Payer à l'avance pour une durée en échange d'une remise décrit un modèle d'engagement, comme les Reserved Instances."
references:
  - title: "Key principles - How AWS Pricing Works"
    url: https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/key-principles.html
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
