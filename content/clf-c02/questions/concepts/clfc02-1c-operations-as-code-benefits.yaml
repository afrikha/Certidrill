id: clfc02-1c-operations-as-code-benefits
objective: "1.4.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company performs its operations tasks by hand, such as deploying changes and restarting failed services. The company plans to define these operations as code and automate them.

    Which benefits will the company gain? (Choose two.)
  fr: |
    Une entreprise effectue ses tâches d'exploitation à la main, comme le déploiement de changements et le redémarrage des services en échec. L'entreprise prévoit de définir ces opérations sous forme de code et de les automatiser.

    Quels avantages l'entreprise obtiendra-t-elle ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Consistent responses to operational events", fr: "Des réponses cohérentes aux événements opérationnels" }
    - id: b
      text: { en: "No further need to monitor its workloads", fr: "Plus aucun besoin de surveiller ses charges de travail" }
    - id: c
      text: { en: "Fewer human errors during operations", fr: "Moins d'erreurs humaines pendant l'exploitation" }
    - id: d
      text: { en: "Transfer of guest operating system patching responsibility to AWS", fr: "Le transfert à AWS de la responsabilité des correctifs des systèmes d'exploitation invités" }
    - id: e
      text: { en: "Lower On-Demand prices for the resources that it automates", fr: "Des prix à la demande plus bas pour les ressources qu'elle automatise" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The Well-Architected design principle \"Safely automate where possible\" explains that defining operations as code and starting them in response to events gives consistent responses to events. Effective automation also limits human error and reduces repetitive manual work."
    fr: "Le principe de conception Well-Architected « Safely automate where possible » explique que définir les opérations sous forme de code et les déclencher en réponse à des événements donne des réponses cohérentes aux événements. Une automatisation efficace limite aussi les erreurs humaines et réduit le travail manuel répétitif."
  options:
    b:
      en: "Automated operations still need observability: metrics and logs show whether the workload meets its goals."
      fr: "Les opérations automatisées ont toujours besoin d'observabilité : les métriques et les journaux montrent si la charge de travail atteint ses objectifs."
    d:
      en: "Automation does not change the shared responsibility model; on Amazon EC2, patching the guest operating system stays the customer's responsibility."
      fr: "L'automatisation ne change pas le modèle de responsabilité partagée : sur Amazon EC2, les correctifs du système d'exploitation invité restent de la responsabilité du client."
    e:
      en: "AWS prices do not depend on whether resources are managed by hand or by automation."
      fr: "Les prix AWS ne dépendent pas de la gestion manuelle ou automatisée des ressources."
references:
  - title: "Design principles - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/oe-design-principles.html
  - title: "Shared Responsibility Model - Amazon Web Services (AWS)"
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
