id: clfc02-1b-outcome-esg
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to use the insights that it gains from its cloud transformation to improve sustainability and corporate transparency.

    Which AWS CAF business outcome does this goal match?
  fr: |
    Une entreprise veut utiliser les informations issues de sa transformation vers le cloud pour améliorer la durabilité et la transparence de l'entreprise.

    À quel résultat métier AWS CAF cet objectif correspond-il ?
body:
  options:
    - id: a
      text: { en: "Increased revenue", fr: "Augmentation des revenus" }
    - id: b
      text: { en: "Increased operational efficiency", fr: "Augmentation de l'efficacité opérationnelle" }
    - id: c
      text: { en: "Reduced business risk", fr: "Réduction des risques métier" }
    - id: d
      text: { en: "Improved ESG performance", fr: "Amélioration des performances ESG" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS CAF lists improved environmental, social and governance (ESG) performance as a business outcome of cloud transformation: insights are used to improve sustainability and corporate transparency."
    fr: "AWS CAF cite l'amélioration des performances environnementales, sociales et de gouvernance (ESG) parmi les résultats métier de la transformation vers le cloud : les informations obtenues servent à améliorer la durabilité et la transparence de l'entreprise."
  options:
    a:
      en: "Increased revenue comes from new products and services, new customers and new market segments."
      fr: "L'augmentation des revenus provient de nouveaux produits et services, de nouveaux clients et de nouveaux segments de marché."
    b:
      en: "Increased operational efficiency means lower operating costs, higher productivity and better employee and customer experience."
      fr: "L'augmentation de l'efficacité opérationnelle signifie des coûts d'exploitation plus faibles, une productivité accrue et une meilleure expérience des employés et des clients."
    c:
      en: "Reduced business risk comes from improved reliability, increased performance and enhanced security."
      fr: "La réduction des risques métier provient d'une fiabilité améliorée, de performances accrues et d'une sécurité renforcée."
references:
  - title: "AWS Cloud Adoption Framework"
    url: https://aws.amazon.com/cloud-adoption-framework/
