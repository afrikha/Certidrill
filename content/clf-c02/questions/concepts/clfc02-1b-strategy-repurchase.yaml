id: clfc02-1b-strategy-repurchase
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a custom-built customer relationship management (CRM) application on premises. It decides to stop maintaining this application and to subscribe to a SaaS CRM product instead.

    Which migration strategy is this?
  fr: |
    Une entreprise exécute sur site une application de gestion de la relation client (CRM) développée en interne. Elle décide de cesser de maintenir cette application et de s'abonner à un produit CRM SaaS à la place.

    De quelle stratégie de migration s'agit-il ?
body:
  options:
    - id: a
      text: { en: "Repurchase", fr: "Racheter (Repurchase)" }
    - id: b
      text: { en: "Rehost", fr: "Réhéberger (Rehost)" }
    - id: c
      text: { en: "Retain", fr: "Conserver (Retain)" }
    - id: d
      text: { en: "Relocate", fr: "Relocaliser (Relocate)" }
answer: { optionId: a }
explanation:
  correct:
    en: "Repurchase, also called drop and shop, replaces an application with a different version or product that provides more business value, for example by replacing a custom application with a vendor's SaaS application."
    fr: "Le rachat (Repurchase), aussi appelé drop and shop, remplace une application par une autre version ou un autre produit qui apporte plus de valeur métier, par exemple en remplaçant une application développée en interne par l'application SaaS d'un éditeur."
  options:
    b:
      en: "Rehost moves the existing application unchanged; the company is replacing it instead."
      fr: "Le réhébergement (Rehost) déplace l'application existante sans la modifier ; ici, l'entreprise la remplace."
    c:
      en: "Retain keeps the application in the source environment; the company is abandoning it."
      fr: "La conservation (Retain) garde l'application dans l'environnement source ; ici, l'entreprise l'abandonne."
    d:
      en: "Relocate moves servers to a cloud version of the same platform without changing the application."
      fr: "La relocalisation (Relocate) déplace des serveurs vers une version cloud de la même plateforme sans modifier l'application."
references:
  - title: "About the migration strategies"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
