id: clfc02-1a-gi-go-global
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to offer its application to customers on another continent in a few days, without building or leasing a data center there. Which advantage of cloud computing does this illustrate?
  fr: |
    Une entreprise veut proposer son application à des clients d'un autre continent en quelques jours, sans y construire ni louer de centre de données. Quel avantage du cloud computing cela illustre-t-il ?
body:
  options:
    - id: a
      text: { en: "Stop guessing capacity", fr: "Arrêter de deviner la capacité nécessaire" }
    - id: b
      text: { en: "Benefit from massive economies of scale", fr: "Bénéficier d'économies d'échelle massives" }
    - id: c
      text: { en: "Trade fixed expense for variable expense", fr: "Remplacer les dépenses fixes par des dépenses variables" }
    - id: d
      text: { en: "Go global in minutes", fr: "Se déployer dans le monde entier en quelques minutes" }
answer: { optionId: d }
explanation:
  correct:
    en: "Going global in minutes means deploying an application in multiple Regions around the world with just a few clicks. The company can serve customers on another continent with lower latency and a better experience at minimal cost."
    fr: "Se déployer dans le monde entier en quelques minutes consiste à déployer une application dans plusieurs Régions du monde en quelques clics. L'entreprise peut servir des clients d'un autre continent avec une latence plus faible et une meilleure expérience, à un coût minimal."
  options:
    a:
      en: "Stopping capacity guesswork is about scaling capacity up and down as needed, not about reaching new geographies."
      fr: "Arrêter de deviner la capacité consiste à augmenter et réduire la capacité selon les besoins, pas à atteindre de nouvelles zones géographiques."
    b:
      en: "Economies of scale explain AWS's lower prices, not the ability to deploy on another continent quickly."
      fr: "Les économies d'échelle expliquent les prix plus bas d'AWS, pas la capacité à se déployer rapidement sur un autre continent."
    c:
      en: "Trading fixed for variable expense is about paying only for what is consumed, not about global reach."
      fr: "Remplacer les dépenses fixes par des dépenses variables consiste à ne payer que ce qui est consommé, pas à atteindre une portée mondiale."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
