id: clfc02-1a-pillar-cost-attribution
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company tags its AWS resources so that it can attribute cloud costs to each workload owner and measure the return on investment of each workload. Which pillar of the AWS Well-Architected Framework describes this practice?
  fr: |
    Une entreprise ajoute des balises à ses ressources AWS afin d'attribuer les coûts du cloud à chaque propriétaire de charge de travail et de mesurer le retour sur investissement de chaque charge de travail. Quel pilier du cadre AWS Well-Architected décrit cette pratique ?
body:
  options:
    - id: a
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
    - id: b
      text: { en: "Sustainability", fr: "Durabilité" }
    - id: c
      text: { en: "Cost optimization", fr: "Optimisation des coûts" }
    - id: d
      text: { en: "Security", fr: "Sécurité" }
answer: { optionId: c }
explanation:
  correct:
    en: "\"Analyze and attribute expenditure\" is a design principle of the cost optimization pillar. Attributing costs to workload owners helps measure return on investment and gives owners the information they need to optimize their resources."
    fr: "« Analyser et attribuer les dépenses » est un principe de conception du pilier optimisation des coûts. Attribuer les coûts aux propriétaires des charges de travail aide à mesurer le retour sur investissement et leur donne les informations nécessaires pour optimiser leurs ressources."
  options:
    a:
      en: "Operational excellence is about running workloads effectively and improving procedures, not about cost attribution."
      fr: "L'excellence opérationnelle concerne l'exécution efficace des charges de travail et l'amélioration des procédures, pas l'attribution des coûts."
    b:
      en: "Sustainability measures environmental impact, not the cost of each workload owner."
      fr: "La durabilité mesure l'impact environnemental, pas le coût de chaque propriétaire de charge de travail."
    d:
      en: "Security protects data, systems, and assets."
      fr: "La sécurité protège les données, les systèmes et les ressources."
references:
  - title: "Design principles"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/cost-dp.html
