id: clfc02-1a-tco-costs-removed
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company moves the applications of its data center to Amazon EC2 instances. Which work does the company no longer need to do or pay for directly?
  fr: |
    Une entreprise transfère les applications de son centre de données vers des instances Amazon EC2. Quel travail l'entreprise n'a-t-elle plus besoin d'effectuer ou de payer directement ?
body:
  options:
    - id: a
      text: { en: "Patching the operating systems of its instances", fr: "L'application des correctifs aux systèmes d'exploitation de ses instances" }
    - id: b
      text: { en: "Designing and operating its applications", fr: "La conception et l'exploitation de ses applications" }
    - id: c
      text: { en: "Racking, stacking, and powering the physical servers", fr: "L'installation, l'empilage et l'alimentation des serveurs physiques" }
    - id: d
      text: { en: "Paying for the compute capacity that its instances use", fr: "Le paiement de la capacité de calcul utilisée par ses instances" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS takes on the heavy lifting of data center operations, such as racking, stacking, and powering servers, and it protects the physical facilities and hardware. The company stops spending money running and maintaining data centers and can focus on its business."
    fr: "AWS prend en charge les tâches lourdes de l'exploitation des centres de données, comme l'installation, l'empilage et l'alimentation des serveurs, et protège les installations et le matériel physiques. L'entreprise cesse de dépenser de l'argent pour exploiter et entretenir des centres de données et peut se concentrer sur son activité."
  options:
    a:
      en: "On Amazon EC2, the customer manages the guest operating system, including updates and security patches."
      fr: "Sur Amazon EC2, le client gère le système d'exploitation invité, y compris les mises à jour et les correctifs de sécurité."
    b:
      en: "The company still designs and runs its own applications on the instances."
      fr: "L'entreprise conçoit et exploite toujours ses propres applications sur les instances."
    d:
      en: "The company still pays for the capacity it uses, now as a variable pay-as-you-go expense."
      fr: "L'entreprise paie toujours la capacité qu'elle utilise, désormais sous forme de dépense variable à l'utilisation."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
  - title: "Shared Responsibility Model"
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
