id: clfc02-1a-pillar-security-identity
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to apply the principle of least privilege, centralize identity management, and stop relying on long-term static credentials. Which pillar of the AWS Well-Architected Framework provides guidance for these goals?
  fr: |
    Une entreprise veut appliquer le principe du moindre privilège, centraliser la gestion des identités et ne plus dépendre d'informations d'identification statiques à long terme. Quel pilier du cadre AWS Well-Architected fournit des conseils pour ces objectifs ?
body:
  options:
    - id: a
      text: { en: "Security", fr: "Sécurité" }
    - id: b
      text: { en: "Reliability", fr: "Fiabilité" }
    - id: c
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
    - id: d
      text: { en: "Cost optimization", fr: "Optimisation des coûts" }
answer: { optionId: a }
explanation:
  correct:
    en: "These goals form the security design principle \"Implement a strong identity foundation\": least privilege, separation of duties, centralized identity management, and no reliance on long-term static credentials."
    fr: "Ces objectifs constituent le principe de conception de sécurité « Mettre en place une base d'identités solide » : moindre privilège, séparation des tâches, gestion centralisée des identités et abandon des informations d'identification statiques à long terme."
  options:
    b:
      en: "Reliability is about a workload performing its function correctly and consistently, not about identities and permissions."
      fr: "La fiabilité concerne la capacité d'une charge de travail à remplir sa fonction correctement et de façon constante, pas les identités et les autorisations."
    c:
      en: "Operational excellence is about running workloads effectively and improving operations; access control is in the security pillar."
      fr: "L'excellence opérationnelle concerne l'exécution efficace des charges de travail et l'amélioration des opérations ; le contrôle d'accès relève du pilier sécurité."
    d:
      en: "Cost optimization is about delivering business value at the lowest price point."
      fr: "L'optimisation des coûts consiste à apporter de la valeur métier au prix le plus bas."
references:
  - title: "Design principles"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/sec-design.html
