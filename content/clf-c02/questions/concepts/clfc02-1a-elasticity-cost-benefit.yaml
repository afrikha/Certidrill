id: clfc02-1a-elasticity-cost-benefit
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's workload has unpredictable demand that can triple within an hour. Which benefit does the elasticity of the AWS Cloud provide for this workload?
  fr: |
    La charge de travail d'une entreprise a une demande imprévisible qui peut tripler en une heure. Quel avantage l'élasticité du Cloud AWS apporte-t-elle à cette charge de travail ?
body:
  options:
    - id: a
      text: { en: "AWS charges a fixed monthly price, whatever the demand.", fr: "AWS facture un prix mensuel fixe, quelle que soit la demande." }
    - id: b
      text: { en: "The instances never fail, because AWS replaces them before any failure.", fr: "Les instances ne tombent jamais en panne, car AWS les remplace avant toute défaillance." }
    - id: c
      text: { en: "The company adds and removes capacity as demand changes instead of paying for capacity sized for the peak.", fr: "L'entreprise ajoute et retire de la capacité selon la demande au lieu de payer une capacité dimensionnée pour le pic." }
    - id: d
      text: { en: "The workload's data is automatically stored in several Regions.", fr: "Les données de la charge de travail sont automatiquement stockées dans plusieurs Régions." }
answer: { optionId: c }
explanation:
  correct:
    en: "With elasticity, the company adds or removes capacity as its needs change instead of buying extra resources for future peaks. It can absorb the sudden increase and then release the capacity, paying only for what it uses."
    fr: "Grâce à l'élasticité, l'entreprise ajoute ou retire de la capacité selon l'évolution de ses besoins au lieu d'acheter des ressources supplémentaires pour de futurs pics. Elle peut absorber la hausse soudaine puis libérer la capacité, en ne payant que ce qu'elle utilise."
  options:
    a:
      en: "Pay-as-you-go charges follow usage; they are not a fixed price."
      fr: "La tarification à l'utilisation suit la consommation ; ce n'est pas un prix fixe."
    b:
      en: "Elasticity does not prevent failures; designs across several Availability Zones and health-based replacement address failures."
      fr: "L'élasticité n'empêche pas les défaillances ; ce sont les conceptions sur plusieurs zones de disponibilité et le remplacement selon l'état de santé qui traitent les défaillances."
    d:
      en: "Data stays in its Region unless the company replicates it; this has nothing to do with elasticity."
      fr: "Les données restent dans leur Région sauf si l'entreprise les réplique ; cela n'a rien à voir avec l'élasticité."
references:
  - title: "What is Cloud Computing?"
    url: https://aws.amazon.com/what-is-cloud-computing/
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
