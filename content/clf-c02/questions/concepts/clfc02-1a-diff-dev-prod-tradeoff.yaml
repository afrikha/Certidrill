id: clfc02-1a-diff-dev-prod-tradeoff
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    For its development environments, a company accepts lower reliability to reduce cost and environmental impact. For its mission-critical production workloads, it accepts higher costs to increase reliability. Which statement describes this approach?
  fr: |
    Pour ses environnements de développement, une entreprise accepte une fiabilité moindre pour réduire les coûts et l'impact environnemental. Pour ses charges de travail de production critiques, elle accepte des coûts plus élevés pour augmenter la fiabilité. Quelle affirmation décrit cette approche ?
body:
  options:
    - id: a
      text: { en: "It is against the framework, because every environment must have the same priorities for every pillar.", fr: "Elle est contraire au cadre, car chaque environnement doit avoir les mêmes priorités pour chaque pilier." }
    - id: b
      text: { en: "It is a trade-off between pillars based on business context, as the framework describes.", fr: "C'est un compromis entre piliers fondé sur le contexte métier, comme le décrit le cadre." }
    - id: c
      text: { en: "It is allowed only after AWS approves the trade-off during a Well-Architected review.", fr: "Elle n'est autorisée qu'après l'approbation du compromis par AWS lors d'une revue Well-Architected." }
    - id: d
      text: { en: "It applies only to the sustainability pillar, which is optional in the framework.", fr: "Elle ne s'applique qu'au pilier durabilité, qui est facultatif dans le cadre." }
answer: { optionId: b }
explanation:
  correct:
    en: "The framework expects architects to make trade-offs between pillars based on business context. AWS gives these exact examples: optimizing sustainability and cost at the expense of reliability in development environments, and optimizing reliability with increased costs for mission-critical solutions."
    fr: "Le cadre prévoit que les architectes fassent des compromis entre piliers en fonction du contexte métier. AWS donne ces exemples : optimiser la durabilité et les coûts au détriment de la fiabilité dans les environnements de développement, et optimiser la fiabilité avec des coûts plus élevés pour les solutions critiques."
  options:
    a:
      en: "The framework does not require identical priorities: business context drives the trade-offs."
      fr: "Le cadre n'exige pas des priorités identiques : c'est le contexte métier qui guide les compromis."
    c:
      en: "The company makes its own business decisions; a review is a conversation, not an approval by AWS."
      fr: "L'entreprise prend ses propres décisions métier ; une revue est une conversation, pas une approbation par AWS."
    d:
      en: "The trade-off involves reliability and cost as well, and sustainability is one of the six pillars, not an optional one."
      fr: "Le compromis porte aussi sur la fiabilité et les coûts, et la durabilité est l'un des six piliers, pas un pilier facultatif."
references:
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
