id: clfc02-1b-onprem-vs-aws-model
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's finance team compares the cost model of its data center with the cost model of AWS.

    Which statement describes the difference correctly?
  fr: |
    L'équipe financière d'une entreprise compare le modèle de coûts de son centre de données avec celui d'AWS.

    Quelle affirmation décrit correctement la différence ?
body:
  options:
    - id: a
      text: { en: "On premises, costs mostly follow usage; on AWS, they are mostly fixed and upfront.", fr: "Sur site, les coûts suivent surtout l'utilisation ; sur AWS, ils sont surtout fixes et initiaux." }
    - id: b
      text: { en: "On premises and on AWS, costs are mostly fixed and paid upfront each year.", fr: "Sur site comme sur AWS, les coûts sont surtout fixes et payés à l'avance chaque année." }
    - id: c
      text: { en: "On premises, costs are mostly fixed and upfront; on AWS, they mostly follow usage.", fr: "Sur site, les coûts sont surtout fixes et initiaux ; sur AWS, ils suivent surtout l'utilisation." }
    - id: d
      text: { en: "On premises and on AWS, costs mostly follow the amount of resources used.", fr: "Sur site comme sur AWS, les coûts suivent surtout la quantité de ressources utilisées." }
answer: { optionId: c }
explanation:
  correct:
    en: "A data center requires heavy upfront investment in facilities and servers, whose costs stay the same whether they are used or not. On AWS, a company pays only when it consumes resources and for how much it consumes, so its costs are mostly variable."
    fr: "Un centre de données exige un investissement initial important dans des locaux et des serveurs, dont les coûts restent identiques qu'ils soient utilisés ou non. Sur AWS, une entreprise ne paie que lorsqu'elle consomme des ressources, et selon la quantité consommée ; ses coûts sont donc surtout variables."
  options:
    a:
      en: "This reverses the two models."
      fr: "Cette option inverse les deux modèles."
    b:
      en: "AWS's default model is pay as you go, not fixed payments in advance."
      fr: "Le modèle par défaut d'AWS est le paiement à l'utilisation, pas des paiements fixes à l'avance."
    d:
      en: "On-premises facilities and servers cost the same whether they are used or idle."
      fr: "Les locaux et les serveurs sur site coûtent autant qu'ils soient utilisés ou inactifs."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
