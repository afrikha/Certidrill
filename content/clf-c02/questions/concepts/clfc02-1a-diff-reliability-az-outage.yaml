id: clfc02-1a-diff-reliability-az-outage
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants its order-processing workload to keep performing its intended function correctly and consistently, including during the outage of an Availability Zone. Which pillar of the AWS Well-Architected Framework addresses this requirement?
  fr: |
    Une entreprise veut que sa charge de travail de traitement des commandes continue à remplir sa fonction prévue correctement et de façon constante, y compris pendant la panne d'une zone de disponibilité. Quel pilier du cadre AWS Well-Architected répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Performance efficiency", fr: "Efficacité des performances" }
    - id: b
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
    - id: c
      text: { en: "Reliability", fr: "Fiabilité" }
    - id: d
      text: { en: "Security", fr: "Sécurité" }
answer: { optionId: c }
explanation:
  correct:
    en: "Reliability is the ability of a workload to perform its intended function correctly and consistently when it is expected to. Withstanding component failures and using fault isolation, such as several Availability Zones, are best practices of its failure management area."
    fr: "La fiabilité est la capacité d'une charge de travail à remplir sa fonction prévue correctement et de façon constante lorsqu'on l'attend. Résister aux défaillances de composants et isoler les pannes, par exemple avec plusieurs zones de disponibilité, sont des bonnes pratiques de son domaine de gestion des défaillances."
  options:
    a:
      en: "Performance efficiency is about using resources efficiently to meet performance requirements, not about withstanding failures."
      fr: "L'efficacité des performances concerne l'utilisation efficace des ressources pour répondre aux exigences de performance, pas la résistance aux défaillances."
    b:
      en: "Operational excellence prepares teams to run and respond to events, but keeping the workload functioning through an outage is reliability."
      fr: "L'excellence opérationnelle prépare les équipes à exploiter la charge de travail et à réagir aux événements, mais continuer à fonctionner pendant une panne relève de la fiabilité."
    d:
      en: "Security protects data, systems, and assets; it does not address the continuity of the workload during an outage."
      fr: "La sécurité protège les données, les systèmes et les ressources ; elle ne traite pas de la continuité de la charge de travail pendant une panne."
references:
  - title: "Reliability"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/reliability.html
