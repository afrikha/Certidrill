id: clfc02-1c-rightsizing-ongoing
objective: "1.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company rightsized all its Amazon EC2 instances during its migration to AWS one year ago. A manager says that no further rightsizing work will ever be needed.

    Which statement about rightsizing is correct?
  fr: |
    Une entreprise a dimensionné correctement toutes ses instances Amazon EC2 lors de sa migration vers AWS il y a un an. Un responsable affirme qu'aucun autre travail de dimensionnement ne sera jamais nécessaire.

    Quelle affirmation sur le dimensionnement approprié est correcte ?
body:
  options:
    - id: a
      text: { en: "Rightsizing is needed only when a Reserved Instance term ends.", fr: "Le dimensionnement n'est nécessaire qu'à la fin de la durée d'une Reserved Instance." }
    - id: b
      text: { en: "Rightsizing can be an ongoing process, triggered by changes in usage or by new resource types and lower prices.", fr: "Le dimensionnement peut être un processus continu, déclenché par l'évolution de l'utilisation ou par de nouveaux types de ressources et des baisses de prix." }
    - id: c
      text: { en: "Rightsizing is a one-time activity that is complete when the migration ends.", fr: "Le dimensionnement est une activité ponctuelle, terminée à la fin de la migration." }
    - id: d
      text: { en: "AWS rightsizes all EC2 instances automatically, so the company has no work to do.", fr: "AWS dimensionne automatiquement toutes les instances EC2 : l'entreprise n'a donc rien à faire." }
answer: { optionId: b }
explanation:
  correct:
    en: "Rightsizing can be iterative: changes in usage patterns and external factors, such as AWS price drops or new AWS resource types, are reasons to review resource sizes again. A one-time effort is enough only when the cost of the work is higher than the savings that it would bring."
    fr: "Le dimensionnement approprié peut être itératif : l'évolution des modèles d'utilisation et des facteurs externes, comme les baisses de prix AWS ou de nouveaux types de ressources AWS, sont des raisons de réexaminer la taille des ressources. Un effort ponctuel suffit seulement lorsque le coût du travail dépasse les économies qu'il apporterait."
  options:
    a:
      en: "Rightsizing is driven by usage and by new options, not by the end of a Reserved Instance term."
      fr: "Le dimensionnement dépend de l'utilisation et des nouvelles options, pas de la fin de la durée d'une Reserved Instance."
    c:
      en: "Usage changes over time, so a size that fit at migration can become oversized or undersized later."
      fr: "L'utilisation évolue avec le temps : une taille adaptée lors de la migration peut ensuite devenir surdimensionnée ou sous-dimensionnée."
    d:
      en: "AWS tools such as Compute Optimizer recommend sizes, but the customer decides and applies the changes."
      fr: "Des outils AWS comme Compute Optimizer recommandent des tailles, mais c'est le client qui décide et applique les changements."
references:
  - title: "Select the correct resource type, size, and number - Cost Optimization Pillar"
    url: https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/select-the-correct-resource-type-size-and-number.html
