id: clfc02-1a-wa-framework-purpose
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the AWS Well-Architected Framework?
  fr: |
    Qu'est-ce que le cadre AWS Well-Architected ?
body:
  options:
    - id: a
      text: { en: "A program that certifies that a workload complies with regulations such as PCI DSS", fr: "Un programme qui certifie qu'une charge de travail est conforme à des réglementations telles que PCI DSS" }
    - id: b
      text: { en: "A service that automatically reconfigures AWS resources to follow best practices", fr: "Un service qui reconfigure automatiquement les ressources AWS pour qu'elles suivent les bonnes pratiques" }
    - id: c
      text: { en: "A set of best practices and questions to evaluate how well an architecture aligns with AWS best practices", fr: "Un ensemble de bonnes pratiques et de questions pour évaluer dans quelle mesure une architecture respecte les bonnes pratiques AWS" }
    - id: d
      text: { en: "A pricing model that gives discounts to workloads built from AWS reference architectures", fr: "Un modèle de tarification qui accorde des remises aux charges de travail créées à partir des architectures de référence AWS" }
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS Well-Architected Framework is a consistent set of best practices that customers and partners use to evaluate architectures. It includes questions that measure how well an architecture is aligned with AWS best practices, organized in six pillars."
    fr: "Le cadre AWS Well-Architected est un ensemble cohérent de bonnes pratiques que les clients et les partenaires utilisent pour évaluer des architectures. Il comprend des questions qui mesurent dans quelle mesure une architecture respecte les bonnes pratiques AWS, organisées en six piliers."
  options:
    a:
      en: "The framework is guidance, not a compliance certification; AWS compliance reports are obtained from AWS Artifact."
      fr: "Le cadre est un guide, pas une certification de conformité ; les rapports de conformité d'AWS s'obtiennent dans AWS Artifact."
    b:
      en: "The framework does not change any resource: the team reviews its architecture and decides which improvements to make."
      fr: "Le cadre ne modifie aucune ressource : l'équipe examine son architecture et décide des améliorations à apporter."
    d:
      en: "The framework is not a pricing model and following it gives no discount."
      fr: "Le cadre n'est pas un modèle de tarification et le suivre n'accorde aucune remise."
references:
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
