id: clfc02-1a-gi-az-definition
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is an Availability Zone?
  fr: |
    Qu'est-ce qu'une zone de disponibilité ?
body:
  options:
    - id: a
      text: { en: "A geographic area that contains several AWS Regions", fr: "Une zone géographique qui contient plusieurs Régions AWS" }
    - id: b
      text: { en: "A site in a city that caches content for Amazon CloudFront", fr: "Un site dans une ville qui met en cache du contenu pour Amazon CloudFront" }
    - id: c
      text: { en: "A rack of AWS servers installed in a customer's data center", fr: "Un rack de serveurs AWS installé dans le centre de données d'un client" }
    - id: d
      text: { en: "One or more discrete data centers with redundant power, networking, and connectivity in a Region", fr: "Un ou plusieurs centres de données distincts, avec alimentation, réseau et connectivité redondants, dans une Région" }
answer: { optionId: d }
explanation:
  correct:
    en: "An Availability Zone consists of one or more discrete data centers, each with redundant power, networking, and connectivity, housed in separate facilities. A Region is a physical location that contains multiple Availability Zones."
    fr: "Une zone de disponibilité se compose d'un ou plusieurs centres de données distincts, chacun doté d'une alimentation, d'un réseau et d'une connectivité redondants, dans des installations séparées. Une Région est un emplacement physique qui contient plusieurs zones de disponibilité."
  options:
    a:
      en: "It is the reverse: a Region contains several Availability Zones."
      fr: "C'est l'inverse : une Région contient plusieurs zones de disponibilité."
    b:
      en: "This describes an edge location, which CloudFront uses to deliver content with low latency."
      fr: "Cela décrit un emplacement périphérique, que CloudFront utilise pour diffuser du contenu avec une faible latence."
    c:
      en: "This describes an AWS Outposts rack."
      fr: "Cela décrit un rack AWS Outposts."
references:
  - title: "Global infrastructure"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/global-infrastructure.html
