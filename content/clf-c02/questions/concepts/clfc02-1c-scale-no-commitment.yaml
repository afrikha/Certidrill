id: clfc02-1c-scale-no-commitment
objective: "1.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A small company uses AWS services with On-Demand pricing only. It has no commitments and a modest monthly bill.

    How does the company benefit from AWS economies of scale?
  fr: |
    Une petite entreprise utilise les services AWS uniquement avec une tarification à la demande (On-Demand). Elle n'a aucun engagement et une facture mensuelle modeste.

    Comment l'entreprise profite-t-elle des économies d'échelle d'AWS ?
body:
  options:
    - id: a
      text: { en: "It does not benefit until its monthly spend reaches a minimum amount.", fr: "Elle n'en profite pas tant que sa dépense mensuelle n'atteint pas un montant minimum." }
    - id: b
      text: { en: "It benefits only if it buys Reserved Instances.", fr: "Elle n'en profite que si elle achète des instances réservées." }
    - id: c
      text: { en: "It pays lower pay-as-you-go prices, without any commitment.", fr: "Elle paie des prix à l'utilisation plus bas, sans aucun engagement." }
    - id: d
      text: { en: "It benefits only if it deploys resources in several AWS Regions.", fr: "Elle n'en profite que si elle déploie des ressources dans plusieurs Régions AWS." }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS's economies of scale translate into lower pay-as-you-go prices for all customers. A small company that uses On-Demand pricing gets these prices without a commitment or a minimum spend."
    fr: "Les économies d'échelle d'AWS se traduisent par des prix à l'utilisation plus bas pour tous les clients. Une petite entreprise qui utilise la tarification à la demande obtient ces prix sans engagement ni dépense minimale."
  options:
    a:
      en: "There is no minimum spend: the lower pay-as-you-go prices apply from the first unit of usage."
      fr: "Il n'y a pas de dépense minimale : les prix à l'utilisation plus bas s'appliquent dès la première unité d'utilisation."
    b:
      en: "Reserved Instances add a discount in exchange for a commitment; the benefit of economies of scale is already in the On-Demand prices."
      fr: "Les instances réservées ajoutent une remise en échange d'un engagement ; l'avantage des économies d'échelle est déjà inclus dans les prix à la demande."
    d:
      en: "Using several Regions serves latency or resilience needs; it is not required to get the lower prices."
      fr: "Utiliser plusieurs Régions répond à des besoins de latence ou de résilience ; ce n'est pas nécessaire pour obtenir les prix plus bas."
references:
  - title: "Six advantages of cloud computing - Overview of Amazon Web Services"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
  - title: "Key principles - How AWS Pricing Works"
    url: https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/key-principles.html
