id: clfc02-1b-map-phase-mobilize
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company follows the AWS Migration Acceleration Program (MAP) methodology. Its assessment found readiness gaps. The company must now close these gaps, build its operational foundation and choose migration strategies.

    Which MAP phase is this?
  fr: |
    Une entreprise suit la méthodologie de l'AWS Migration Acceleration Program (MAP). Son évaluation a révélé des lacunes de préparation. L'entreprise doit maintenant combler ces lacunes, bâtir ses fondations opérationnelles et choisir ses stratégies de migration.

    De quelle phase du MAP s'agit-il ?
body:
  options:
    - id: a
      text: { en: "Mobilize", fr: "Mobiliser (Mobilize)" }
    - id: b
      text: { en: "Migrate and modernize", fr: "Migrer et moderniser (Migrate and modernize)" }
    - id: c
      text: { en: "Assess", fr: "Évaluer (Assess)" }
    - id: d
      text: { en: "Align", fr: "Aligner (Align)" }
answer: { optionId: a }
explanation:
  correct:
    en: "MAP has three phases: Assess, Mobilize, and Migrate and modernize. Mobilize closes the gaps found during the assessment, builds the operational foundation and provides guidance on migration strategies."
    fr: "Le MAP comprend trois phases : Évaluer (Assess), Mobiliser (Mobilize), puis Migrer et moderniser (Migrate and modernize). La phase Mobiliser comble les lacunes trouvées pendant l'évaluation, bâtit les fondations opérationnelles et guide le choix des stratégies de migration."
  options:
    b:
      en: "Migrate and modernize executes the migration plan with AWS migration services, after the foundation is ready."
      fr: "La phase Migrer et moderniser exécute le plan de migration avec les services de migration AWS, une fois les fondations prêtes."
    c:
      en: "Assess is where the gaps were found and a TCO model was built; the company has already completed it."
      fr: "C'est pendant la phase Évaluer (Assess) que les lacunes ont été trouvées et qu'un modèle de TCO a été établi ; l'entreprise l'a déjà terminée."
    d:
      en: "Align is a phase of the AWS CAF transformation journey, not one of the three MAP phases."
      fr: "Aligner (Align) est une phase du parcours de transformation AWS CAF, pas l'une des trois phases du MAP."
references:
  - title: "AWS Migration Acceleration Program (MAP)"
    url: https://aws.amazon.com/migration-acceleration-program/
