id: clfc02-1b-perspective-people
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to build a culture of continuous learning in which change is business-as-normal. It plans to work on cloud fluency, workforce transformation and change acceleration.

    Which AWS CAF perspective covers these capabilities?
  fr: |
    Une entreprise veut bâtir une culture d'apprentissage continu dans laquelle le changement fait partie du quotidien. Elle prévoit de travailler la maîtrise du cloud, la transformation des effectifs et l'accélération du changement.

    Quelle perspective AWS CAF couvre ces capacités ?
body:
  options:
    - id: a
      text: { en: "People", fr: "Personnes (People)" }
    - id: b
      text: { en: "Business", fr: "Entreprise (Business)" }
    - id: c
      text: { en: "Operations", fr: "Opérations (Operations)" }
    - id: d
      text: { en: "Governance", fr: "Gouvernance (Governance)" }
answer: { optionId: a }
explanation:
  correct:
    en: "The People perspective acts as a bridge between technology and business. It builds a culture of continuous growth and learning, with capabilities such as culture evolution, cloud fluency, workforce transformation and change acceleration."
    fr: "La perspective Personnes (People) fait le lien entre la technologie et le métier. Elle bâtit une culture de croissance et d'apprentissage continus, avec des capacités comme l'évolution de la culture, la maîtrise du cloud, la transformation des effectifs et l'accélération du changement."
  options:
    b:
      en: "The Business perspective covers strategy, portfolio and product management, not culture and skills."
      fr: "La perspective Entreprise (Business) couvre la gestion de la stratégie, du portefeuille et des produits, pas la culture et les compétences."
    c:
      en: "The Operations perspective covers service health and availability, such as observability and incident management."
      fr: "La perspective Opérations (Operations) couvre l'intégrité et la disponibilité des services, comme l'observabilité et la gestion des incidents."
    d:
      en: "The Governance perspective covers control and oversight, such as program management and risk management."
      fr: "La perspective Gouvernance (Governance) couvre le contrôle et la supervision, comme la gestion de programme et la gestion des risques."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
