id: clfc02-1c-license-included-double-pay
objective: "1.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company owns SQL Server licenses with active Software Assurance that are eligible for License Mobility. The company migrates its SQL Server databases to Amazon EC2 instances that it launches from license-included SQL Server AMIs.

    Which statement describes the licensing cost of this approach?
  fr: |
    Une entreprise possède des licences SQL Server avec une Software Assurance active, éligibles à License Mobility. L'entreprise migre ses bases de données SQL Server vers des instances Amazon EC2 qu'elle lance à partir d'AMI SQL Server avec licence incluse.

    Quelle affirmation décrit le coût de licence de cette approche ?
body:
  options:
    - id: a
      text: { en: "The company pays for SQL Server licensing twice: in the instance price and through the licenses that it already owns.", fr: "L'entreprise paie deux fois les licences SQL Server : dans le prix de l'instance et avec les licences qu'elle possède déjà." }
    - id: b
      text: { en: "AWS refunds the license part of the instance price when the company shows proof of its licenses.", fr: "AWS rembourse la part de licence du prix de l'instance lorsque l'entreprise présente une preuve de ses licences." }
    - id: c
      text: { en: "The instance price drops automatically because the company's licenses are applied to the instances.", fr: "Le prix de l'instance baisse automatiquement, car les licences de l'entreprise sont appliquées aux instances." }
    - id: d
      text: { en: "The company pays no SQL Server license cost, because Software Assurance covers license-included instances.", fr: "L'entreprise ne paie aucun coût de licence SQL Server, car la Software Assurance couvre les instances avec licence incluse." }
answer: { optionId: a }
explanation:
  correct:
    en: "The price of a license-included SQL Server instance always contains the SQL Server license, whatever licenses the customer owns. To avoid paying twice, the company could use License Mobility through Software Assurance to bring its licenses to default-tenancy instances that do not include SQL Server."
    fr: "Le prix d'une instance SQL Server avec licence incluse contient toujours la licence SQL Server, quelles que soient les licences que possède le client. Pour éviter de payer deux fois, l'entreprise pourrait utiliser License Mobility through Software Assurance afin d'apporter ses licences sur des instances en location par défaut qui n'incluent pas SQL Server."
  options:
    b:
      en: "AWS does not refund the license part of a license-included instance; the price is the same for every customer."
      fr: "AWS ne rembourse pas la part de licence d'une instance avec licence incluse : le prix est le même pour tous les clients."
    c:
      en: "Owned licenses are not applied automatically to license-included instances; the company must choose a BYOL deployment to use them."
      fr: "Les licences possédées ne sont pas appliquées automatiquement aux instances avec licence incluse : l'entreprise doit choisir un déploiement BYOL pour les utiliser."
    d:
      en: "Software Assurance enables License Mobility for BYOL; it does not remove the license cost from license-included instances."
      fr: "La Software Assurance permet License Mobility pour le BYOL ; elle ne supprime pas le coût de licence des instances avec licence incluse."
references:
  - title: "Microsoft FAQ – AWS"
    url: https://aws.amazon.com/windows/faq/
