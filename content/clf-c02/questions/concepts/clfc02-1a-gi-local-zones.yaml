id: clfc02-1a-gi-local-zones
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A game studio's players are concentrated in a large city that is far from the nearest AWS Region. The studio needs very low latency between its players and its game servers, and it does not want to install any hardware in its own facilities. Which AWS offering meets these requirements?
  fr: |
    Les joueurs d'un studio de jeux vidéo sont concentrés dans une grande ville éloignée de la Région AWS la plus proche. Le studio a besoin d'une latence très faible entre ses joueurs et ses serveurs de jeu, et il ne veut installer aucun matériel dans ses propres locaux. Quelle offre AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Outposts", fr: "AWS Outposts" }
    - id: b
      text: { en: "AWS Local Zones", fr: "AWS Local Zones" }
    - id: c
      text: { en: "Amazon CloudFront edge locations", fr: "Les emplacements périphériques Amazon CloudFront" }
    - id: d
      text: { en: "An additional Availability Zone in the nearest Region", fr: "Une zone de disponibilité supplémentaire dans la Région la plus proche" }
answer: { optionId: b }
explanation:
  correct:
    en: "Local Zones place compute, storage, database, and other select AWS resources close to large population and industry centers, as an extension of a parent Region. They are designed for low-latency applications such as real-time gaming and live streaming."
    fr: "Les Local Zones placent des ressources de calcul, de stockage, de base de données et d'autres ressources AWS choisies près des grands centres de population et d'industrie, en tant qu'extension d'une Région parente. Elles sont conçues pour les applications à faible latence comme les jeux en temps réel et la diffusion en direct."
  options:
    a:
      en: "Outposts would also give low latency, but it installs AWS hardware in the customer's own facilities, which the studio does not want."
      fr: "Outposts offrirait aussi une faible latence, mais il installe du matériel AWS dans les locaux du client, ce que le studio ne veut pas."
    c:
      en: "Edge locations cache and deliver content; they do not host the studio's game servers."
      fr: "Les emplacements périphériques mettent en cache et diffusent du contenu ; ils n'hébergent pas les serveurs de jeu du studio."
    d:
      en: "All Availability Zones of a Region are in the same geographic area, so the latency stays the same for players far from the Region."
      fr: "Toutes les zones de disponibilité d'une Région se trouvent dans la même zone géographique : la latence reste la même pour les joueurs éloignés de la Région."
references:
  - title: "What is AWS Local Zones?"
    url: https://docs.aws.amazon.com/local-zones/latest/ug/what-is-aws-local-zones.html
