id: clfc02-1b-strategy-refactor
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's monolithic application slows down the delivery of new features. The company wants to move it to AWS and modify its architecture to use cloud-native features for agility, performance and scalability.

    Which migration strategy meets this goal?
  fr: |
    L'application monolithique d'une entreprise ralentit la livraison de nouvelles fonctionnalités. L'entreprise veut la déplacer vers AWS et modifier son architecture pour utiliser des fonctionnalités cloud natives, au service de l'agilité, des performances et de l'évolutivité.

    Quelle stratégie de migration répond à cet objectif ?
body:
  options:
    - id: a
      text: { en: "Refactor", fr: "Refactoriser (Refactor)" }
    - id: b
      text: { en: "Rehost", fr: "Réhéberger (Rehost)" }
    - id: c
      text: { en: "Relocate", fr: "Relocaliser (Relocate)" }
    - id: d
      text: { en: "Replatform", fr: "Replateformer (Replatform)" }
answer: { optionId: a }
explanation:
  correct:
    en: "Refactor (or re-architect) moves an application to the cloud and modifies its architecture to take full advantage of cloud-native features. A monolith that slows product delivery is a typical candidate, although refactoring is the most complex and costly strategy."
    fr: "La refactorisation (Refactor), ou réarchitecture, déplace une application vers le cloud et modifie son architecture pour tirer pleinement parti des fonctionnalités cloud natives. Un monolithe qui ralentit la livraison des produits est un candidat typique, même si la refactorisation est la stratégie la plus complexe et la plus coûteuse."
  options:
    b:
      en: "Rehost keeps the monolith unchanged, so delivery stays slow."
      fr: "Le réhébergement (Rehost) garde le monolithe inchangé, donc la livraison reste lente."
    c:
      en: "Relocate moves servers to a cloud version of the same platform without changing the application."
      fr: "La relocalisation (Relocate) déplace des serveurs vers une version cloud de la même plateforme sans modifier l'application."
    d:
      en: "Replatform makes limited optimizations, such as a managed database, without changing the architecture."
      fr: "Le replateformage (Replatform) apporte des optimisations limitées, comme une base de données gérée, sans changer l'architecture."
references:
  - title: "About the migration strategies"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
