id: clfc02-1b-variable-with-usage
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs some workloads on premises and others on AWS.

    Which of its costs changes with the amount of resources that it uses?
  fr: |
    Une entreprise exécute certaines charges de travail sur site et d'autres sur AWS.

    Lequel de ses coûts varie selon la quantité de ressources qu'elle utilise ?
body:
  options:
    - id: a
      text: { en: "The lease of its data center building", fr: "Le bail du bâtiment de son centre de données" }
    - id: b
      text: { en: "Its yearly hardware maintenance contract", fr: "Son contrat annuel de maintenance matérielle" }
    - id: c
      text: { en: "The depreciation of its on-premises servers", fr: "L'amortissement de ses serveurs sur site" }
    - id: d
      text: { en: "Its Amazon EC2 On-Demand Instance charges", fr: "Ses frais d'instances Amazon EC2 On-Demand" }
answer: { optionId: d }
explanation:
  correct:
    en: "On-Demand Instances are billed for the compute capacity that runs, so the charge rises and falls with usage: it is a variable cost. The lease, the depreciation and the maintenance contract stay the same whether the servers are busy or idle."
    fr: "Les instances On-Demand sont facturées pour la capacité de calcul qui s'exécute ; le montant augmente et diminue donc avec l'utilisation : c'est un coût variable. Le bail, l'amortissement et le contrat de maintenance restent identiques, que les serveurs soient occupés ou inactifs."
  options:
    a:
      en: "The building lease is the same every month whatever the usage: it is a fixed cost."
      fr: "Le bail du bâtiment est identique chaque mois quelle que soit l'utilisation : c'est un coût fixe."
    b:
      en: "A yearly maintenance contract is a fixed amount agreed in advance."
      fr: "Un contrat de maintenance annuel est un montant fixe convenu à l'avance."
    c:
      en: "Depreciation spreads the purchase price of servers over time; it does not depend on how much they are used."
      fr: "L'amortissement répartit le prix d'achat des serveurs dans le temps ; il ne dépend pas de leur utilisation."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
