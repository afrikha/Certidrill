id: clfc02-1b-prescriptive-guidance
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's architects want strategies, guides and patterns written by AWS experts to plan a large migration, including how to choose a migration strategy for each application.

    Which AWS resource provides this content?
  fr: |
    Les architectes d'une entreprise veulent des stratégies, des guides et des modèles rédigés par des experts AWS pour planifier une migration à grande échelle, y compris le choix d'une stratégie de migration pour chaque application.

    Quelle ressource AWS fournit ce contenu ?
body:
  options:
    - id: a
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: b
      text: { en: "AWS Health Dashboard", fr: "AWS Health Dashboard" }
    - id: c
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
    - id: d
      text: { en: "AWS Prescriptive Guidance", fr: "AWS Prescriptive Guidance" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Prescriptive Guidance offers strategies, guides and patterns from AWS experts to help accelerate cloud migration and modernization projects. Its large migration guide, for example, describes the seven migration strategies and when to use each one."
    fr: "AWS Prescriptive Guidance propose des stratégies, des guides et des modèles rédigés par des experts AWS pour accélérer les projets de migration et de modernisation vers le cloud. Son guide des migrations à grande échelle, par exemple, décrit les sept stratégies de migration et quand utiliser chacune."
  options:
    a:
      en: "AWS Artifact provides AWS compliance reports and agreements, not migration guidance."
      fr: "AWS Artifact fournit les rapports de conformité et les accords d'AWS, pas des conseils de migration."
    b:
      en: "The AWS Health Dashboard reports events that affect AWS services and the customer's resources."
      fr: "AWS Health Dashboard signale les événements qui affectent les services AWS et les ressources du client."
    c:
      en: "Trusted Advisor checks existing AWS resources against best practices; it does not publish migration strategies."
      fr: "Trusted Advisor vérifie les ressources AWS existantes au regard des bonnes pratiques ; il ne publie pas de stratégies de migration."
references:
  - title: "About the migration strategies"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
