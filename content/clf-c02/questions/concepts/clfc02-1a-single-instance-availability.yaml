id: clfc02-1a-single-instance-availability
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs its web application on one large Amazon EC2 instance in a single Availability Zone. The company wants to improve the availability of the application. Which change will MOST improve availability?
  fr: |
    Une entreprise exécute son application web sur une seule grande instance Amazon EC2 dans une seule zone de disponibilité. L'entreprise veut améliorer la disponibilité de l'application. Quelle modification améliore le PLUS la disponibilité ?
body:
  options:
    - id: a
      text: { en: "Move the application to a larger instance type in the same Availability Zone.", fr: "Passer l'application sur un type d'instance plus grand dans la même zone de disponibilité." }
    - id: b
      text: { en: "Take daily snapshots of the instance's Amazon EBS volumes.", fr: "Prendre des instantanés quotidiens des volumes Amazon EBS de l'instance." }
    - id: c
      text: { en: "Buy a Reserved Instance for the existing instance.", fr: "Acheter une instance réservée pour l'instance existante." }
    - id: d
      text: { en: "Run several smaller instances in an Auto Scaling group across two Availability Zones behind a load balancer.", fr: "Exécuter plusieurs instances plus petites dans un groupe Auto Scaling réparti sur deux zones de disponibilité, derrière un équilibreur de charge." }
answer: { optionId: d }
explanation:
  correct:
    en: "Replacing one large resource with several smaller ones reduces the impact of a single failure, and spreading them across Availability Zones removes the zone as a single point of failure. EC2 Auto Scaling balances instances across the zones and replaces impaired instances to keep the desired capacity."
    fr: "Remplacer une grande ressource par plusieurs petites réduit l'impact d'une seule défaillance, et les répartir sur plusieurs zones de disponibilité supprime la zone comme point de défaillance unique. EC2 Auto Scaling équilibre les instances entre les zones et remplace les instances défectueuses pour maintenir la capacité souhaitée."
  options:
    a:
      en: "A larger instance is still a single instance in a single zone: one failure still stops the application."
      fr: "Une instance plus grande reste une instance unique dans une seule zone : une seule défaillance arrête toujours l'application."
    b:
      en: "Snapshots help restore data after a failure, but the application is still down until it is restored."
      fr: "Les instantanés aident à restaurer les données après une défaillance, mais l'application reste arrêtée jusqu'à la restauration."
    c:
      en: "A Reserved Instance lowers cost; it does not change the architecture or its availability."
      fr: "Une instance réservée réduit le coût ; elle ne change ni l'architecture ni sa disponibilité."
references:
  - title: "Design principles"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/rel-dp.html
  - title: "What is Amazon EC2 Auto Scaling?"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html
