id: clfc02-1a-diff-not-traded-off
objective: "1.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company makes trade-offs between the pillars of the AWS Well-Architected Framework based on its business context. According to AWS, which pillars are generally NOT traded off against the other pillars? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise fait des compromis entre les piliers du cadre AWS Well-Architected en fonction de son contexte métier. Selon AWS, quels piliers ne font généralement PAS l'objet de compromis avec les autres piliers ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Security", fr: "Sécurité" }
    - id: b
      text: { en: "Cost optimization", fr: "Optimisation des coûts" }
    - id: c
      text: { en: "Sustainability", fr: "Durabilité" }
    - id: d
      text: { en: "Performance efficiency", fr: "Efficacité des performances" }
    - id: e
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "AWS states that security and operational excellence are generally not traded off against the other pillars. Trade-offs usually happen between reliability, performance efficiency, cost optimization, and sustainability, depending on the business context."
    fr: "AWS indique que la sécurité et l'excellence opérationnelle ne font généralement pas l'objet de compromis avec les autres piliers. Les compromis portent en général sur la fiabilité, l'efficacité des performances, l'optimisation des coûts et la durabilité, selon le contexte métier."
  options:
    b:
      en: "Cost is often traded off, for example accepting higher costs for more reliability in mission-critical workloads."
      fr: "Le coût fait souvent l'objet de compromis, par exemple en acceptant des coûts plus élevés pour plus de fiabilité dans les charges de travail critiques."
    c:
      en: "Sustainability can be traded off, for example optimized in development environments at the expense of reliability."
      fr: "La durabilité peut faire l'objet de compromis, par exemple optimisée dans les environnements de développement au détriment de la fiabilité."
    d:
      en: "Performance is traded off according to the business context, for example in ecommerce where it affects revenue."
      fr: "Les performances font l'objet de compromis selon le contexte métier, par exemple dans le commerce en ligne où elles influent sur le chiffre d'affaires."
references:
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
