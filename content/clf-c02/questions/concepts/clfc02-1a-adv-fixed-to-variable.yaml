id: clfc02-1a-adv-fixed-to-variable
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup does not want to invest in data centers and servers before it knows how much its new application will be used. It wants to pay only for the computing resources it consumes. Which advantage of cloud computing does this describe?
  fr: |
    Une start-up ne veut pas investir dans des centres de données et des serveurs avant de savoir dans quelle mesure sa nouvelle application sera utilisée. Elle veut payer uniquement les ressources informatiques qu'elle consomme. Quel avantage du cloud computing cela décrit-il ?
body:
  options:
    - id: a
      text: { en: "Benefit from massive economies of scale", fr: "Bénéficier d'économies d'échelle massives" }
    - id: b
      text: { en: "Trade fixed expense for variable expense", fr: "Remplacer les dépenses fixes par des dépenses variables" }
    - id: c
      text: { en: "Go global in minutes", fr: "Se déployer dans le monde entier en quelques minutes" }
    - id: d
      text: { en: "Increase speed and agility", fr: "Gagner en rapidité et en agilité" }
answer: { optionId: b }
explanation:
  correct:
    en: "With cloud computing, a company does not invest heavily in data centers and servers before it knows how it will use them. It trades this fixed expense for a variable expense: it pays only when it consumes resources, and only for how much it consumes."
    fr: "Avec le cloud computing, une entreprise n'investit pas massivement dans des centres de données et des serveurs avant de savoir comment elle les utilisera. Elle remplace cette dépense fixe par une dépense variable : elle ne paie que lorsqu'elle consomme des ressources, et seulement pour la quantité consommée."
  options:
    a:
      en: "This advantage explains AWS's lower pay-as-you-go prices: the usage of hundreds of thousands of customers is aggregated."
      fr: "Cet avantage explique les prix à l'utilisation plus bas d'AWS : l'utilisation de centaines de milliers de clients est regroupée."
    c:
      en: "This advantage is about deploying in several Regions around the world in a few clicks to lower latency for customers."
      fr: "Cet avantage consiste à déployer dans plusieurs Régions du monde en quelques clics pour réduire la latence pour les clients."
    d:
      en: "This advantage is about getting new resources in minutes instead of weeks, which lowers the cost and time of experimenting."
      fr: "Cet avantage consiste à obtenir de nouvelles ressources en quelques minutes au lieu de plusieurs semaines, ce qui réduit le coût et le temps des expérimentations."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
