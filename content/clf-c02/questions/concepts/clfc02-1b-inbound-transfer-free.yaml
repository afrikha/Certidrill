id: clfc02-1b-inbound-transfer-free
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company will upload 50 TB of on-premises data to Amazon S3 over the internet. Users on the internet will later download part of this data.

    Which statement about the data transfer charges is correct?
  fr: |
    Une entreprise va charger 50 To de données sur site dans Amazon S3 par internet. Des utilisateurs sur internet téléchargeront ensuite une partie de ces données.

    Quelle affirmation sur les frais de transfert de données est correcte ?
body:
  options:
    - id: a
      text: { en: "Both the upload and the downloads are charged at the same per-GB rate.", fr: "Le chargement et les téléchargements sont facturés au même tarif par Go." }
    - id: b
      text: { en: "The upload is charged per GB, and the downloads to the internet are free.", fr: "Le chargement est facturé par Go, et les téléchargements vers internet sont gratuits." }
    - id: c
      text: { en: "Neither the upload nor the downloads incur any data transfer charge.", fr: "Ni le chargement ni les téléchargements n'entraînent de frais de transfert de données." }
    - id: d
      text: { en: "The upload is generally free, but the downloads to the internet are charged.", fr: "Le chargement est généralement gratuit, mais les téléchargements vers internet sont facturés." }
answer: { optionId: d }
explanation:
  correct:
    en: "In most cases, AWS does not charge for inbound data transfer. Outbound data transfer to the internet is one of the fundamental drivers of cost and is charged per GB."
    fr: "Dans la plupart des cas, AWS ne facture pas le transfert de données entrant. Le transfert de données sortant vers internet est l'un des facteurs fondamentaux de coût et il est facturé par Go."
  options:
    a:
      en: "Inbound and outbound transfers are not priced the same way: inbound is generally free."
      fr: "Les transferts entrants et sortants ne sont pas facturés de la même façon : le transfert entrant est généralement gratuit."
    b:
      en: "This reverses the rule: inbound transfer is generally free, and outbound transfer to the internet is charged."
      fr: "Cette option inverse la règle : le transfert entrant est généralement gratuit, et le transfert sortant vers internet est facturé."
    c:
      en: "Outbound data transfer to the internet is charged."
      fr: "Le transfert de données sortant vers internet est facturé."
references:
  - title: "AWS Product and Service Pricing"
    url: https://aws.amazon.com/pricing/
  - title: "Key principles - How AWS Pricing Works"
    url: https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/key-principles
