id: clfc02-1b-strategy-replatform
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is migrating an application to AWS. It will keep the application code and architecture, but it will move the Microsoft SQL Server database from a self-managed server to Amazon RDS for SQL Server to reduce administration.

    Which migration strategy is the company using?
  fr: |
    Une entreprise migre une application vers AWS. Elle conserve le code et l'architecture de l'application, mais elle déplace la base de données Microsoft SQL Server d'un serveur autogéré vers Amazon RDS for SQL Server pour réduire l'administration.

    Quelle stratégie de migration l'entreprise utilise-t-elle ?
body:
  options:
    - id: a
      text: { en: "Rehost", fr: "Réhéberger (Rehost)" }
    - id: b
      text: { en: "Refactor", fr: "Refactoriser (Refactor)" }
    - id: c
      text: { en: "Replatform", fr: "Replateformer (Replatform)" }
    - id: d
      text: { en: "Relocate", fr: "Relocaliser (Relocate)" }
answer: { optionId: c }
explanation:
  correct:
    en: "Replatform, also called lift, tinker and shift, moves an application to the cloud with some optimization, for example moving SQL Server to Amazon RDS for SQL Server. The core architecture does not change."
    fr: "Le replateformage (Replatform), aussi appelé lift, tinker and shift, déplace une application vers le cloud avec quelques optimisations, par exemple le passage de SQL Server à Amazon RDS for SQL Server. L'architecture de base ne change pas."
  options:
    a:
      en: "Rehost moves the application without any change; moving the database to a managed service is a change."
      fr: "Le réhébergement (Rehost) déplace l'application sans aucune modification ; passer la base de données à un service géré en est une."
    b:
      en: "Refactor modifies the application's architecture to use cloud-native features; here the architecture is kept."
      fr: "La refactorisation (Refactor) modifie l'architecture de l'application pour utiliser des fonctionnalités cloud natives ; ici, l'architecture est conservée."
    d:
      en: "Relocate moves servers to a cloud version of the same platform without changing them, not to a managed database service."
      fr: "La relocalisation (Relocate) déplace des serveurs vers une version cloud de la même plateforme sans les modifier, pas vers un service de base de données géré."
references:
  - title: "About the migration strategies"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
