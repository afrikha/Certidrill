id: clfc02-1b-lift-shift-overprovisioned
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company plans to rehost its on-premises servers on Amazon EC2. Most servers were sized years ago for growth that never happened and run at about 10 % CPU utilization.

    Which statement about the cost savings of this migration is correct?
  fr: |
    Une entreprise prévoit de réhéberger ses serveurs sur site sur Amazon EC2. La plupart de ces serveurs ont été dimensionnés il y a des années pour une croissance qui n'a jamais eu lieu, et fonctionnent à environ 10 % d'utilisation du processeur.

    Quelle affirmation sur les économies de cette migration est correcte ?
body:
  options:
    - id: a
      text: { en: "Moving to AWS lowers costs automatically, whatever instance sizes are chosen.", fr: "Le passage à AWS réduit les coûts automatiquement, quelles que soient les tailles d'instance choisies." }
    - id: b
      text: { en: "AWS does not bill instances whose CPU utilization stays below a minimum threshold.", fr: "AWS ne facture pas les instances dont l'utilisation du processeur reste sous un seuil minimal." }
    - id: c
      text: { en: "Keeping the current sizes pays for unused capacity, so sizing on actual usage saves more.", fr: "Garder les tailles actuelles fait payer une capacité inutilisée ; dimensionner selon l'usage réel économise plus." }
    - id: d
      text: { en: "Savings come only from Reserved Instances, so instance sizes do not matter.", fr: "Les économies proviennent uniquement des Reserved Instances ; les tailles d'instance n'ont donc pas d'importance." }
answer: { optionId: c }
explanation:
  correct:
    en: "An instance is billed for its size while it runs, whatever its utilization. Rehosting over-provisioned servers on equally large instances moves the waste to AWS; using utilization data to choose smaller instances, as a migration business case does, captures more savings."
    fr: "Une instance est facturée selon sa taille tant qu'elle s'exécute, quelle que soit son utilisation. Réhéberger des serveurs surdimensionnés sur des instances aussi grandes déplace le gaspillage vers AWS ; choisir des instances plus petites d'après les données d'utilisation, comme le fait une analyse de rentabilisation de migration, permet d'économiser davantage."
  options:
    a:
      en: "Savings are not automatic: the company pays for the capacity it provisions, even if it is unused."
      fr: "Les économies ne sont pas automatiques : l'entreprise paie la capacité qu'elle provisionne, même inutilisée."
    b:
      en: "A running instance is billed for its type and running time, regardless of CPU utilization."
      fr: "Une instance en cours d'exécution est facturée selon son type et sa durée d'exécution, quelle que soit son utilisation du processeur."
    d:
      en: "Reserved Instances reduce the rate, but an oversized instance still costs more than a right-sized one."
      fr: "Les Reserved Instances réduisent le tarif, mais une instance surdimensionnée coûte toujours plus qu'une instance bien dimensionnée."
references:
  - title: "Migration Evaluator"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/migration-tools/business-case-migration-evaluator.html
