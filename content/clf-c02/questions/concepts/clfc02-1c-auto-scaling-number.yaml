id: clfc02-1c-auto-scaling-number
objective: "1.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs its web application on a fixed fleet of 20 Amazon EC2 instances that is sized for peak traffic. Traffic is high during business hours and very low at night. The company wants the number of instances to follow demand automatically.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute son application web sur un parc fixe de 20 instances Amazon EC2 dimensionné pour le trafic de pointe. Le trafic est élevé pendant les heures de bureau et très faible la nuit. L'entreprise souhaite que le nombre d'instances suive automatiquement la demande.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Review the recommendations of AWS Compute Optimizer each month", fr: "Examiner chaque mois les recommandations d'AWS Compute Optimizer" }
    - id: b
      text: { en: "Buy Standard Reserved Instances for the 20 instances", fr: "Acheter des Standard Reserved Instances pour les 20 instances" }
    - id: c
      text: { en: "Use an Amazon EC2 Auto Scaling group with a scaling policy", fr: "Utiliser un groupe Auto Scaling Amazon EC2 avec une politique de mise à l'échelle" }
    - id: d
      text: { en: "Create an AWS Budgets alert for when EC2 costs exceed a threshold", fr: "Créer une alerte AWS Budgets lorsque les coûts EC2 dépassent un seuil" }
answer: { optionId: c }
explanation:
  correct:
    en: "Auto Scaling is a managed feedback loop that uses metrics to adjust the number of instances to demand, which right-sizes the fleet automatically. The company stops paying for 20 instances at night when far fewer are needed."
    fr: "Auto Scaling est une boucle de rétroaction gérée qui utilise des métriques pour adapter le nombre d'instances à la demande, ce qui dimensionne automatiquement le parc. L'entreprise cesse de payer 20 instances la nuit, alors que beaucoup moins sont nécessaires."
  options:
    a:
      en: "Compute Optimizer gives recommendations that someone must apply; it does not change the number of instances automatically."
      fr: "Compute Optimizer fournit des recommandations qu'il faut appliquer ; il ne modifie pas automatiquement le nombre d'instances."
    b:
      en: "Reserved Instances lower the price of the 20 instances but keep the fleet at its peak size all day."
      fr: "Les Reserved Instances réduisent le prix des 20 instances, mais maintiennent le parc à sa taille de pointe toute la journée."
    d:
      en: "A budget alert warns about spending; it does not adjust the number of instances."
      fr: "Une alerte de budget avertit des dépenses ; elle n'ajuste pas le nombre d'instances."
references:
  - title: "COST06-BP03 Select resource type, size, and number automatically based on metrics - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/cost_type_size_number_resources_metrics.html
