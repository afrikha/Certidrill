id: clfc02-1c-rightsizing-definition
objective: "1.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes rightsizing in the AWS Cloud?
  fr: |
    Quelle affirmation décrit le dimensionnement approprié (rightsizing) dans le Cloud AWS ?
body:
  options:
    - id: a
      text: { en: "Committing to a consistent amount of compute usage for 1 or 3 years to get lower prices", fr: "S'engager sur une quantité constante d'utilisation du calcul pendant 1 ou 3 ans pour obtenir des prix plus bas" }
    - id: b
      text: { en: "Deploying a workload across multiple Availability Zones to increase its availability", fr: "Déployer une charge de travail sur plusieurs zones de disponibilité pour augmenter sa disponibilité" }
    - id: c
      text: { en: "Deploying an application in more AWS Regions to reduce latency for its users", fr: "Déployer une application dans davantage de Régions AWS pour réduire la latence pour ses utilisateurs" }
    - id: d
      text: { en: "Matching the type, size, and number of resources to the actual needs of a workload at the lowest cost", fr: "Adapter le type, la taille et le nombre de ressources aux besoins réels d'une charge de travail, au coût le plus bas" }
answer: { optionId: d }
explanation:
  correct:
    en: "Rightsizing means selecting the resource type, size, and number that meet the technical requirements of a workload at the lowest cost. It reduces waste from overprovisioned resources, for example by moving to a smaller instance type or by stopping idle resources."
    fr: "Le dimensionnement approprié consiste à choisir le type, la taille et le nombre de ressources qui répondent aux exigences techniques d'une charge de travail au coût le plus bas. Il réduit le gaspillage dû aux ressources surdimensionnées, par exemple en passant à un type d'instance plus petit ou en arrêtant les ressources inutilisées."
  options:
    a:
      en: "A usage commitment for 1 or 3 years describes Savings Plans or Reserved Instances, which are pricing models, not rightsizing."
      fr: "Un engagement d'utilisation sur 1 ou 3 ans décrit les Savings Plans ou les instances réservées, qui sont des modèles de tarification, pas du dimensionnement approprié."
    b:
      en: "Using multiple Availability Zones improves availability; it does not adjust resources to the needs of the workload."
      fr: "Utiliser plusieurs zones de disponibilité améliore la disponibilité ; cela n'adapte pas les ressources aux besoins de la charge de travail."
    c:
      en: "Deploying in more Regions reduces latency for distant users; it is not about the size of resources."
      fr: "Déployer dans davantage de Régions réduit la latence pour les utilisateurs éloignés ; cela ne concerne pas la taille des ressources."
references:
  - title: "COST 6. How do you meet cost targets when you select resource type, size and number? - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/cost-06.html
  - title: "What is AWS Compute Optimizer? - AWS Compute Optimizer"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html
