id: clfc02-1a-agility-example
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which of the following is an example of agility in the AWS Cloud?
  fr: |
    Lequel des éléments suivants est un exemple d'agilité dans le Cloud AWS ?
body:
  options:
    - id: a
      text: { en: "An application keeps running when one of its Availability Zones has a power outage.", fr: "Une application continue de fonctionner lorsqu'une de ses zones de disponibilité subit une coupure de courant." }
    - id: b
      text: { en: "Stored data stays intact for years without any loss.", fr: "Des données stockées restent intactes pendant des années, sans aucune perte." }
    - id: c
      text: { en: "A team quickly sets up the services it needs, so a new idea moves to implementation much faster.", fr: "Une équipe met rapidement en place les services dont elle a besoin : une nouvelle idée passe beaucoup plus vite à la mise en œuvre." }
    - id: d
      text: { en: "A fleet of instances shrinks at night when traffic is low.", fr: "Un parc d'instances se réduit la nuit lorsque le trafic est faible." }
answer: { optionId: c }
explanation:
  correct:
    en: "Agility is the ability to quickly set up a wide range of services and move from idea to implementation much faster. Because new resources are available in minutes, experimenting costs less time and money."
    fr: "L'agilité est la capacité à mettre rapidement en place un large éventail de services et à passer beaucoup plus vite de l'idée à la mise en œuvre. Comme de nouvelles ressources sont disponibles en quelques minutes, expérimenter coûte moins de temps et d'argent."
  options:
    a:
      en: "Continuing to run during a zone failure is an example of high availability."
      fr: "Continuer à fonctionner pendant la défaillance d'une zone est un exemple de haute disponibilité."
    b:
      en: "Keeping data without loss over time is an example of durability."
      fr: "Conserver des données sans perte dans le temps est un exemple de durabilité des données (durability)."
    d:
      en: "Releasing capacity when demand drops is an example of elasticity."
      fr: "Libérer de la capacité quand la demande baisse est un exemple d'élasticité."
references:
  - title: "What is Cloud Computing?"
    url: https://aws.amazon.com/what-is-cloud-computing/
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
