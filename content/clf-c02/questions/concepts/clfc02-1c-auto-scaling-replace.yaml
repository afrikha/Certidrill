id: clfc02-1c-auto-scaling-replace
objective: "1.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application runs on Amazon EC2 instances in an Auto Scaling group. One of the instances fails its health checks.

    What does Amazon EC2 Auto Scaling do automatically?
  fr: |
    Une application s'exécute sur des instances Amazon EC2 dans un groupe Auto Scaling. L'une des instances échoue à ses vérifications de l'état.

    Que fait automatiquement Amazon EC2 Auto Scaling ?
body:
  options:
    - id: a
      text: { en: "It notifies the operations team and waits for a manual replacement.", fr: "Il avertit l'équipe d'exploitation et attend un remplacement manuel." }
    - id: b
      text: { en: "It terminates the unhealthy instance and launches a new instance to replace it.", fr: "Il résilie l'instance défaillante et lance une nouvelle instance pour la remplacer." }
    - id: c
      text: { en: "It stops every instance in the group until the failed instance is repaired.", fr: "Il arrête toutes les instances du groupe jusqu'à la réparation de l'instance défaillante." }
    - id: d
      text: { en: "It moves the unhealthy instance to a Dedicated Host.", fr: "Il déplace l'instance défaillante vers un Dedicated Host." }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EC2 Auto Scaling detects when an instance is unhealthy, terminates it, and launches a replacement instance. This automation gives better fault tolerance without manual work, and the group keeps the capacity that the application needs."
    fr: "Amazon EC2 Auto Scaling détecte lorsqu'une instance est défaillante, la résilie et lance une instance de remplacement. Cette automatisation améliore la tolérance aux pannes sans travail manuel, et le groupe conserve la capacité dont l'application a besoin."
  options:
    a:
      en: "Auto Scaling replaces unhealthy instances by itself; it does not wait for a person to act."
      fr: "Auto Scaling remplace lui-même les instances défaillantes ; il n'attend pas qu'une personne intervienne."
    c:
      en: "Stopping the whole group would cause an outage; Auto Scaling replaces only the unhealthy instance."
      fr: "Arrêter tout le groupe provoquerait une panne : Auto Scaling ne remplace que l'instance défaillante."
    d:
      en: "Auto Scaling does not move instances to Dedicated Hosts; it launches a new instance from the group's configuration."
      fr: "Auto Scaling ne déplace pas les instances vers des Dedicated Hosts : il lance une nouvelle instance à partir de la configuration du groupe."
references:
  - title: "Auto Scaling benefits for application architecture - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-benefits.html
