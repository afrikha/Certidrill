id: clfc02-1c-replicate-regions
objective: "1.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company created the resources of an application by hand in one AWS Region. The company must now deploy the same resources, with the same configuration, in three more Regions, and later keep all four Regions identical. The company wants the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a créé à la main les ressources d'une application dans une Région AWS. L'entreprise doit maintenant déployer les mêmes ressources, avec la même configuration, dans trois autres Régions, puis garder les quatre Régions identiques. L'entreprise souhaite fournir le MOINS d'efforts possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Describe the resources in an AWS CloudFormation template and create a stack in each Region.", fr: "Décrire les ressources dans un modèle AWS CloudFormation et créer une pile dans chaque Région." }
    - id: b
      text: { en: "Recreate the resources in each Region with the console, following a written runbook.", fr: "Recréer les ressources dans chaque Région avec la console, en suivant un runbook écrit." }
    - id: c
      text: { en: "Use AWS Config to copy the resource configurations to the new Regions.", fr: "Utiliser AWS Config pour copier les configurations des ressources vers les nouvelles Régions." }
    - id: d
      text: { en: "Ask AWS Support to replicate the resources to the new Regions.", fr: "Demander à AWS Support de répliquer les ressources vers les nouvelles Régions." }
answer: { optionId: a }
explanation:
  correct:
    en: "A CloudFormation template describes the resources once, and you can reuse it to provision the same resources again and again, in multiple Regions. Describing the resources in a template once and creating a stack from it in each Region gives consistent results with the least effort, and later changes go through the same template."
    fr: "Un modèle CloudFormation décrit les ressources une seule fois, et vous pouvez le réutiliser pour provisionner les mêmes ressources autant de fois que nécessaire, dans plusieurs Régions. Décrire les ressources une fois dans un modèle et créer une pile à partir de celui-ci dans chaque Région donne des résultats cohérents avec le moins d'efforts, et les changements ultérieurs passent par le même modèle."
  options:
    b:
      en: "Manual work in the console takes more effort for every Region and every later change, and it can introduce configuration differences between Regions."
      fr: "Le travail manuel dans la console demande plus d'efforts pour chaque Région et chaque changement ultérieur, et il peut introduire des différences de configuration entre les Régions."
    c:
      en: "AWS Config records and evaluates configurations; it does not create resources in other Regions."
      fr: "AWS Config enregistre et évalue les configurations ; il ne crée pas de ressources dans d'autres Régions."
    d:
      en: "AWS Support does not deploy customer resources; deploying them is the customer's task."
      fr: "AWS Support ne déploie pas les ressources des clients : leur déploiement est la tâche du client."
references:
  - title: "What is CloudFormation? - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html
