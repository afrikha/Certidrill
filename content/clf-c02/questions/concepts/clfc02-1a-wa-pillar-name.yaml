id: clfc02-1a-wa-pillar-name
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which of the following is one of the six pillars of the AWS Well-Architected Framework?
  fr: |
    Lequel des éléments suivants est l'un des six piliers du cadre AWS Well-Architected ?
body:
  options:
    - id: a
      text: { en: "Governance", fr: "Gouvernance" }
    - id: b
      text: { en: "Elasticity", fr: "Élasticité" }
    - id: c
      text: { en: "High availability", fr: "Haute disponibilité" }
    - id: d
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
answer: { optionId: d }
explanation:
  correct:
    en: "The six pillars of the framework are operational excellence, security, reliability, performance efficiency, cost optimization, and sustainability. Operational excellence is the ability to run workloads effectively, gain insight into their operations, and continuously improve processes."
    fr: "Les six piliers du cadre sont l'excellence opérationnelle, la sécurité, la fiabilité, l'efficacité des performances, l'optimisation des coûts et la durabilité. L'excellence opérationnelle est la capacité à exécuter efficacement les charges de travail, à comprendre leur fonctionnement et à améliorer en continu les processus."
  options:
    a:
      en: "Governance is a perspective of the AWS Cloud Adoption Framework (AWS CAF), not a Well-Architected pillar."
      fr: "La gouvernance est une perspective du Framework d'adoption du Cloud AWS (AWS CAF), pas un pilier Well-Architected."
    b:
      en: "Elasticity is a cloud concept defined by the framework, not one of its pillars."
      fr: "L'élasticité est un concept du cloud défini par le cadre, pas l'un de ses piliers."
    c:
      en: "Availability is addressed by the reliability pillar; it is not a pillar on its own."
      fr: "La disponibilité est traitée par le pilier fiabilité ; ce n'est pas un pilier à part entière."
references:
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
