id: clfc02-1a-diff-sus-vs-cost
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's AWS bill is within budget. The company now sets a goal to reduce the compute and storage resources required per transaction in order to lower the environmental impact of its workload. Which pillar of the AWS Well-Architected Framework focuses on this goal?
  fr: |
    La facture AWS d'une entreprise respecte son budget. L'entreprise se fixe maintenant pour objectif de réduire les ressources de calcul et de stockage nécessaires par transaction afin de diminuer l'impact environnemental de sa charge de travail. Quel pilier du cadre AWS Well-Architected porte sur cet objectif ?
body:
  options:
    - id: a
      text: { en: "Cost optimization", fr: "Optimisation des coûts" }
    - id: b
      text: { en: "Sustainability", fr: "Durabilité" }
    - id: c
      text: { en: "Performance efficiency", fr: "Efficacité des performances" }
    - id: d
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
answer: { optionId: b }
explanation:
  correct:
    en: "The sustainability pillar aims at reducing energy consumption and the environmental impact of workloads. AWS gives this goal as an example of a sustainability goal: reducing the compute and storage resources required per transaction."
    fr: "Le pilier durabilité vise à réduire la consommation d'énergie et l'impact environnemental des charges de travail. AWS cite cet objectif comme exemple d'objectif de durabilité : réduire les ressources de calcul et de stockage nécessaires par transaction."
  options:
    a:
      en: "Using fewer resources may also lower costs, but cost optimization aims at the lowest price point, and the stated goal is environmental impact."
      fr: "Utiliser moins de ressources peut aussi réduire les coûts, mais l'optimisation des coûts vise le prix le plus bas, et l'objectif indiqué est l'impact environnemental."
    c:
      en: "Performance efficiency is about meeting performance requirements as demand changes, not about environmental impact."
      fr: "L'efficacité des performances vise à répondre aux exigences de performance quand la demande change, pas à réduire l'impact environnemental."
    d:
      en: "Operational excellence is about running workloads effectively and improving operations."
      fr: "L'excellence opérationnelle concerne l'exécution efficace des charges de travail et l'amélioration des opérations."
references:
  - title: "Design principles"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/sus-design-principles.html
