id: clfc02-1a-wa-milestone
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has answered all the questions of a workload review in the AWS Well-Architected Tool. It wants to record the answers and risks at this point in time so that it can measure progress after future improvements. What should the company save?
  fr: |
    Une entreprise a répondu à toutes les questions de la revue d'une charge de travail dans AWS Well-Architected Tool. Elle veut enregistrer les réponses et les risques à ce moment précis pour mesurer les progrès après de futures améliorations. Que doit-elle enregistrer ?
body:
  options:
    - id: a
      text: { en: "A custom lens", fr: "Un objectif personnalisé (custom lens)" }
    - id: b
      text: { en: "A milestone", fr: "Un jalon" }
    - id: c
      text: { en: "An AWS Config configuration snapshot", fr: "Un instantané de configuration AWS Config" }
    - id: d
      text: { en: "A lens from the Lens Catalog", fr: "Un objectif du Lens Catalog" }
answer: { optionId: b }
explanation:
  correct:
    en: "A milestone records the state of a workload review at a particular point in time. AWS recommends saving one after first completing all the questions, then again each time the workload is improved, to measure progress."
    fr: "Un jalon enregistre l'état de la revue d'une charge de travail à un moment donné. AWS recommande d'en enregistrer un après avoir répondu une première fois à toutes les questions, puis à chaque amélioration de la charge de travail, pour mesurer les progrès."
  options:
    a:
      en: "A custom lens defines the company's own questions and best practices; it does not record the state of a review."
      fr: "Un objectif personnalisé définit les propres questions et bonnes pratiques de l'entreprise ; il n'enregistre pas l'état d'une revue."
    c:
      en: "An AWS Config snapshot captures resource configurations, not the answers and risks of a Well-Architected review."
      fr: "Un instantané AWS Config capture la configuration des ressources, pas les réponses et les risques d'une revue Well-Architected."
    d:
      en: "Lens Catalog lenses are official AWS sets of questions; applying one does not save the current answers."
      fr: "Les objectifs du Lens Catalog sont des ensembles de questions officiels d'AWS ; en appliquer un n'enregistre pas les réponses actuelles."
references:
  - title: "Milestones"
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/milestones.html
