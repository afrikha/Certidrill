id: clfc02-1c-rightsizing-tools
objective: "1.4.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants to find Amazon EC2 instances that it can downsize or terminate to reduce costs.

    Which AWS services or features provide rightsizing recommendations for EC2 instances? (Choose two.)
  fr: |
    Une entreprise souhaite trouver les instances Amazon EC2 qu'elle peut réduire ou résilier pour diminuer ses coûts.

    Quels services ou fonctionnalités AWS fournissent des recommandations de dimensionnement pour les instances EC2 ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "AWS Compute Optimizer", fr: "AWS Compute Optimizer" }
    - id: b
      text: { en: "AWS Budgets", fr: "AWS Budgets" }
    - id: c
      text: { en: "Rightsizing recommendations in AWS Cost Explorer", fr: "Les recommandations de dimensionnement d'AWS Cost Explorer" }
    - id: d
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: e
      text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "AWS Compute Optimizer recommends instance types and identifies idle instances from utilization metrics. The rightsizing recommendations of Cost Explorer show underutilized EC2 instances that you can downsize or terminate, with the estimated savings, across member accounts."
    fr: "AWS Compute Optimizer recommande des types d'instances et identifie les instances inutilisées à partir des métriques d'utilisation. Les recommandations de dimensionnement de Cost Explorer présentent les instances EC2 sous-utilisées que vous pouvez réduire ou résilier, avec les économies estimées, pour l'ensemble des comptes membres."
  options:
    b:
      en: "AWS Budgets alerts on cost and usage thresholds; it does not recommend instance sizes."
      fr: "AWS Budgets alerte sur des seuils de coûts et d'utilisation ; il ne recommande pas de tailles d'instances."
    d:
      en: "AWS Artifact provides compliance reports and agreements."
      fr: "AWS Artifact fournit des rapports de conformité et des accords."
    e:
      en: "AWS CloudTrail records API activity; it does not analyze instance utilization."
      fr: "AWS CloudTrail enregistre l'activité des API ; il n'analyse pas l'utilisation des instances."
references:
  - title: "What is AWS Compute Optimizer? - AWS Compute Optimizer"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html
  - title: "Optimizing your cost with rightsizing recommendations - AWS Cost Management"
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/ce-rightsizing.html
