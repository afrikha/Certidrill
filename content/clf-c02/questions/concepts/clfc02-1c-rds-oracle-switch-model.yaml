id: clfc02-1c-rds-oracle-switch-model
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for Oracle DB instance with the License Included model. The company then signs an agreement with Oracle and now owns Oracle Database Standard Edition 2 licenses that include Software Update License and Support. The company wants to use these licenses for the existing DB instance.

    What should the company do?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for Oracle avec le modèle de licence incluse (License Included). L'entreprise signe ensuite un accord avec Oracle et possède désormais des licences Oracle Database Standard Edition 2 qui comprennent Software Update License and Support. L'entreprise souhaite utiliser ces licences pour l'instance de base de données existante.

    Que doit faire l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Create a new DB instance with BYOL and migrate the data, because the license model cannot change.", fr: "Créer une nouvelle instance de base de données en BYOL et migrer les données, car le modèle de licence ne peut pas changer." }
    - id: b
      text: { en: "Move the database to Amazon EC2, because Amazon RDS supports only the License Included model.", fr: "Déplacer la base de données vers Amazon EC2, car Amazon RDS ne prend en charge que le modèle de licence incluse." }
    - id: c
      text: { en: "Modify the DB instance to change its license model to Bring Your Own License (BYOL).", fr: "Modifier l'instance de base de données pour changer son modèle de licence en BYOL (Bring Your Own License)." }
    - id: d
      text: { en: "Open a case with AWS Support to transfer the licenses to AWS.", fr: "Ouvrir une demande auprès d'AWS Support pour transférer les licences à AWS." }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon RDS for Oracle offers two license models, License Included and BYOL, and the license model of an existing DB instance can be changed by modifying the instance. With BYOL, the company uses its own licenses and keeps its Oracle support account for database software issues."
    fr: "Amazon RDS for Oracle propose deux modèles de licence, licence incluse (License Included) et BYOL, et le modèle de licence d'une instance de base de données existante peut être changé en modifiant l'instance. Avec le BYOL, l'entreprise utilise ses propres licences et conserve son compte de support Oracle pour les problèmes liés au logiciel de base de données."
  options:
    a:
      en: "The license model of an RDS for Oracle DB instance can be changed after creation, so a new instance and a migration are not needed."
      fr: "Le modèle de licence d'une instance RDS for Oracle peut être changé après sa création : une nouvelle instance et une migration ne sont donc pas nécessaires."
    b:
      en: "RDS for Oracle supports both License Included and BYOL, so the database can stay on Amazon RDS."
      fr: "RDS for Oracle prend en charge les modèles de licence incluse et BYOL : la base de données peut donc rester sur Amazon RDS."
    d:
      en: "Licenses are not transferred to AWS; with BYOL, the company keeps its licenses and must follow Oracle's licensing policies."
      fr: "Les licences ne sont pas transférées à AWS : avec le BYOL, l'entreprise conserve ses licences et doit respecter les politiques de licence d'Oracle."
references:
  - title: "RDS for Oracle licensing options - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Oracle.Concepts.Licensing.html
