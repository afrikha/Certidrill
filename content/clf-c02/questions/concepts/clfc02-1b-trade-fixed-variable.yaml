id: clfc02-1b-trade-fixed-variable
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup does not want to invest heavily in data centers and servers before it knows how its application will be used. It wants to pay only when it consumes computing resources, and only for how much it consumes.

    Which advantage of cloud computing does this describe?
  fr: |
    Une startup ne veut pas investir massivement dans des centres de données et des serveurs avant de savoir comment son application sera utilisée. Elle veut payer seulement quand elle consomme des ressources de calcul, et seulement pour ce qu'elle consomme.

    Quel avantage du cloud computing cela décrit-il ?
body:
  options:
    - id: a
      text: { en: "Benefit from massive economies of scale", fr: "Bénéficier d'économies d'échelle massives" }
    - id: b
      text: { en: "Trade fixed expense for variable expense", fr: "Remplacer les dépenses fixes par des dépenses variables" }
    - id: c
      text: { en: "Increase speed and agility", fr: "Gagner en rapidité et en agilité" }
    - id: d
      text: { en: "Stop spending money running and maintaining data centers", fr: "Ne plus dépenser d'argent pour exploiter et entretenir des centres de données" }
answer: { optionId: b }
explanation:
  correct:
    en: "Trade fixed expense for variable expense: instead of investing heavily in data centers and servers upfront, a company pays only when it consumes computing resources, and only for how much it consumes."
    fr: "Remplacer les dépenses fixes par des dépenses variables : au lieu d'investir massivement à l'avance dans des centres de données et des serveurs, une entreprise paie seulement quand elle consomme des ressources de calcul, et seulement pour ce qu'elle consomme."
  options:
    a:
      en: "Economies of scale explain why AWS's variable prices are low, not the shift from upfront investment to usage-based payment."
      fr: "Les économies d'échelle expliquent pourquoi les prix variables d'AWS sont bas, pas le passage d'un investissement initial à un paiement à l'usage."
    c:
      en: "Speed and agility are about making resources available in minutes and experimenting cheaply."
      fr: "La rapidité et l'agilité consistent à disposer de ressources en quelques minutes et à expérimenter à moindre coût."
    d:
      en: "This advantage is about no longer racking and powering servers, not about how the company pays."
      fr: "Cet avantage consiste à ne plus installer ni alimenter de serveurs, pas à la façon dont l'entreprise paie."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
