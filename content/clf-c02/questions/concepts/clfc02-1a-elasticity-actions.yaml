id: clfc02-1a-elasticity-actions
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which of the following actions take advantage of the elasticity of the AWS Cloud? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Lesquelles des actions suivantes tirent parti de l'élasticité du Cloud AWS ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Buy servers sized for the expected peak of the next three years.", fr: "Acheter des serveurs dimensionnés pour le pic attendu des trois prochaines années." }
    - id: b
      text: { en: "Configure an Auto Scaling group to remove instances at night when traffic is low.", fr: "Configurer un groupe Auto Scaling pour retirer des instances la nuit lorsque le trafic est faible." }
    - id: c
      text: { en: "Launch the largest instance size and keep it running all year.", fr: "Lancer la plus grande taille d'instance et la laisser fonctionner toute l'année." }
    - id: d
      text: { en: "Add instances for a marketing campaign and terminate them when the campaign ends.", fr: "Ajouter des instances pour une campagne marketing et les résilier à la fin de la campagne." }
    - id: e
      text: { en: "Copy daily backups of the application data to a second Region.", fr: "Copier des sauvegardes quotidiennes des données de l'application dans une deuxième Région." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Elasticity means acquiring resources when they are needed and releasing them when they are no longer needed. Removing instances when traffic is low and terminating campaign instances afterwards both match capacity to demand, so the company stops paying for capacity it does not use."
    fr: "L'élasticité consiste à obtenir des ressources quand elles sont nécessaires et à les libérer quand elles ne le sont plus. Retirer des instances quand le trafic est faible et résilier les instances de la campagne ensuite ajustent tous deux la capacité à la demande : l'entreprise cesse de payer une capacité qu'elle n'utilise pas."
  options:
    a:
      en: "Buying for a forecast peak is the capacity guessing that the cloud removes; the servers stay idle most of the time."
      fr: "Acheter pour un pic prévu revient à deviner la capacité, ce que le cloud évite ; les serveurs restent inutilisés la plupart du temps."
    c:
      en: "A fixed, oversized instance never releases capacity, so it does not use elasticity."
      fr: "Une instance surdimensionnée fixe ne libère jamais de capacité : elle n'utilise pas l'élasticité."
    e:
      en: "Cross-Region backup copies protect data for recovery; they do not adjust capacity to demand."
      fr: "Les copies de sauvegarde entre Régions protègent les données en vue d'une récupération ; elles n'ajustent pas la capacité à la demande."
references:
  - title: "Definitions"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/definitions.html
  - title: "What is Amazon EC2 Auto Scaling?"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html
