id: clfc02-1c-byol-definition
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has already paid for Microsoft SQL Server licenses that it uses in its data center. The company wants to use the same licenses for its workloads on AWS, as the license terms allow.

    Which licensing approach is this?
  fr: |
    Une entreprise a déjà payé des licences Microsoft SQL Server qu'elle utilise dans son centre de données. L'entreprise souhaite utiliser ces mêmes licences pour ses charges de travail sur AWS, comme le permettent les conditions de licence.

    De quelle stratégie d'octroi de licences s'agit-il ?
body:
  options:
    - id: a
      text: { en: "License Included", fr: "Licence incluse (License Included)" }
    - id: b
      text: { en: "A new software subscription from AWS Marketplace", fr: "Un nouvel abonnement logiciel sur AWS Marketplace" }
    - id: c
      text: { en: "Bring Your Own License (BYOL)", fr: "BYOL (Bring Your Own License)" }
    - id: d
      text: { en: "Savings Plans", fr: "Savings Plans" }
answer: { optionId: c }
explanation:
  correct:
    en: "Bring Your Own License (BYOL) means reusing software licenses that the company already owns for resources on AWS, subject to the vendor's license terms. The company then pays AWS for the resources without paying again for the software license."
    fr: "Le modèle BYOL (Bring Your Own License) consiste à réutiliser, pour des ressources AWS, des licences logicielles que l'entreprise possède déjà, sous réserve des conditions de licence de l'éditeur. L'entreprise paie alors à AWS les ressources, sans payer une nouvelle fois la licence du logiciel."
  options:
    a:
      en: "With License Included, the license is provided by AWS and its cost is part of the price of the resource; the company's own licenses are not used."
      fr: "Avec le modèle de licence incluse, la licence est fournie par AWS et son coût fait partie du prix de la ressource : les licences de l'entreprise ne sont pas utilisées."
    b:
      en: "A new subscription buys the software again; it does not reuse the licenses that the company already owns."
      fr: "Un nouvel abonnement achète une nouvelle fois le logiciel : il ne réutilise pas les licences que l'entreprise possède déjà."
    d:
      en: "Savings Plans are a pricing model that lowers compute prices in exchange for a usage commitment; they are not a software licensing approach."
      fr: "Les Savings Plans sont un modèle de tarification qui réduit le prix du calcul en échange d'un engagement d'utilisation ; ce n'est pas une stratégie de licences logicielles."
references:
  - title: "What is AWS License Manager? - AWS License Manager"
    url: https://docs.aws.amazon.com/license-manager/latest/userguide/license-manager.html
  - title: "Amazon EC2 Dedicated Hosts - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html
