id: clfc02-1b-hardware-maintenance-shift
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps an inventory of spare server parts and pays for hardware support contracts. It plans to move all its servers to Amazon EC2.

    Why can the company stop these expenses after the migration?
  fr: |
    Une entreprise conserve un stock de pièces de rechange pour serveurs et paie des contrats de support matériel. Elle prévoit de déplacer tous ses serveurs vers Amazon EC2.

    Pourquoi l'entreprise peut-elle cesser ces dépenses après la migration ?
body:
  options:
    - id: a
      text: { en: "AWS lets the customer ship its spare parts to the AWS data centers.", fr: "AWS permet au client d'envoyer ses pièces de rechange dans les centres de données AWS." }
    - id: b
      text: { en: "Amazon EC2 instances include a hardware support contract per instance.", fr: "Les instances Amazon EC2 comprennent un contrat de support matériel par instance." }
    - id: c
      text: { en: "The company replaces failed disks in AWS hosts by using AWS Support.", fr: "L'entreprise remplace les disques défaillants des hôtes AWS via AWS Support." }
    - id: d
      text: { en: "AWS is responsible for the physical hardware that runs Amazon EC2.", fr: "AWS est responsable du matériel physique qui exécute Amazon EC2." }
answer: { optionId: d }
explanation:
  correct:
    en: "For Amazon EC2, AWS handles server maintenance, the hardware lifecycle, and power, network and cooling, while the customer manages the operating system and software. The customer no longer buys, stocks or repairs server hardware."
    fr: "Pour Amazon EC2, AWS prend en charge la maintenance des serveurs, le cycle de vie du matériel, ainsi que l'alimentation, le réseau et le refroidissement, tandis que le client gère le système d'exploitation et les logiciels. Le client n'achète, ne stocke et ne répare plus de matériel serveur."
  options:
    a:
      en: "Customers do not supply hardware to AWS data centers."
      fr: "Les clients ne fournissent pas de matériel aux centres de données AWS."
    b:
      en: "There is no per-instance hardware support contract; hardware is AWS's responsibility for every instance."
      fr: "Il n'existe pas de contrat de support matériel par instance ; le matériel relève de la responsabilité d'AWS pour toutes les instances."
    c:
      en: "Customers have no physical access to AWS hosts; AWS replaces failed hardware itself."
      fr: "Les clients n'ont aucun accès physique aux hôtes AWS ; AWS remplace lui-même le matériel défaillant."
references:
  - title: "What is Amazon Relational Database Service (Amazon RDS)?"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html
