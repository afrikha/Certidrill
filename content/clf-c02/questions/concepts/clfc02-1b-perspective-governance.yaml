id: clfc02-1b-perspective-governance
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company needs to orchestrate its cloud initiatives while minimizing transformation risks. Its CFO and chief transformation officer will own capabilities such as cloud financial management, benefits management and risk management.

    Which AWS CAF perspective includes these capabilities?
  fr: |
    Une entreprise doit orchestrer ses initiatives cloud tout en réduisant les risques de la transformation. Son CFO et son responsable de la transformation porteront des capacités comme la gestion financière du cloud, la gestion des bénéfices et la gestion des risques.

    Quelle perspective AWS CAF comprend ces capacités ?
body:
  options:
    - id: a
      text: { en: "Business", fr: "Entreprise (Business)" }
    - id: b
      text: { en: "Security", fr: "Sécurité (Security)" }
    - id: c
      text: { en: "Governance", fr: "Gouvernance (Governance)" }
    - id: d
      text: { en: "Operations", fr: "Opérations (Operations)" }
answer: { optionId: c }
explanation:
  correct:
    en: "The Governance perspective (control and oversight) orchestrates cloud initiatives, maximizes organizational benefits and minimizes transformation risks. Its capabilities include program and project management, benefits management, risk management, cloud financial management and data governance."
    fr: "La perspective Gouvernance (Governance), axée sur le contrôle et la supervision, orchestre les initiatives cloud, maximise les bénéfices pour l'organisation et réduit les risques de la transformation. Ses capacités comprennent la gestion de programmes et de projets, la gestion des bénéfices, la gestion des risques, la gestion financière du cloud et la gouvernance des données."
  options:
    a:
      en: "The Business perspective also involves the CFO, but its capabilities are strategy, portfolio, innovation and product management, not cloud financial or risk management."
      fr: "La perspective Entreprise (Business) implique aussi le CFO, mais ses capacités sont la gestion de la stratégie, du portefeuille, de l'innovation et des produits, pas la gestion financière du cloud ni la gestion des risques."
    b:
      en: "The Security perspective covers confidentiality, integrity and availability of data and workloads, not financial management."
      fr: "La perspective Sécurité (Security) couvre la confidentialité, l'intégrité et la disponibilité des données et des charges de travail, pas la gestion financière."
    d:
      en: "The Operations perspective covers service levels and the health of workloads, not benefits or financial management."
      fr: "La perspective Opérations (Operations) couvre les niveaux de service et l'intégrité des charges de travail, pas la gestion des bénéfices ni la gestion financière."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
