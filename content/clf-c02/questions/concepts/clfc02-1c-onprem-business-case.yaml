id: clfc02-1c-onprem-business-case
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants a data-driven business case that compares the cost of its current on-premises servers with the projected cost of running them on AWS. The analysis must use inventory and utilization data collected from its on-premises environment.

    Which AWS offering will meet these requirements?
  fr: |
    Une entreprise souhaite une étude de rentabilité fondée sur des données, qui compare le coût de ses serveurs sur site actuels au coût projeté de leur exécution sur AWS. L'analyse doit utiliser des données d'inventaire et d'utilisation collectées dans son environnement sur site.

    Quelle offre AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Pricing Calculator", fr: "AWS Pricing Calculator" }
    - id: b
      text: { en: "AWS Cost Explorer", fr: "AWS Cost Explorer" }
    - id: c
      text: { en: "AWS Budgets", fr: "AWS Budgets" }
    - id: d
      text: { en: "Migration Evaluator", fr: "Migration Evaluator" }
answer: { optionId: d }
explanation:
  correct:
    en: "Migration Evaluator collects inventory and utilization data from on-premises servers, with an agentless collector or with imported files. It matches the servers to Amazon EC2 instances and produces a Business Case report that compares the current costs with projected AWS costs."
    fr: "Migration Evaluator collecte des données d'inventaire et d'utilisation des serveurs sur site, avec un collecteur sans agent ou à partir de fichiers importés. Il associe les serveurs à des instances Amazon EC2 et produit un rapport Business Case qui compare les coûts actuels aux coûts AWS projetés."
  options:
    a:
      en: "AWS Pricing Calculator estimates the cost of AWS services from configurations that you enter; it does not collect data from on-premises servers."
      fr: "AWS Pricing Calculator estime le coût des services AWS à partir des configurations que vous saisissez ; il ne collecte pas de données sur les serveurs sur site."
    b:
      en: "Cost Explorer analyzes and forecasts AWS costs and usage, not the costs of an on-premises environment."
      fr: "Cost Explorer analyse et prévoit les coûts et l'utilisation AWS, pas les coûts d'un environnement sur site."
    c:
      en: "AWS Budgets sends alerts when AWS costs or usage exceed thresholds; it does not build a migration business case."
      fr: "AWS Budgets envoie des alertes lorsque les coûts ou l'utilisation AWS dépassent des seuils ; il ne produit pas d'étude de rentabilité de migration."
references:
  - title: "Migration Evaluator FAQs - Build A Business Case For AWS - Amazon Web Services"
    url: https://aws.amazon.com/migration-evaluator/faqs/
