id: clfc02-1c-idle-instance
objective: "1.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AWS Compute Optimizer reports that an Amazon EC2 instance in a test account has been idle for several weeks. The company confirms that the instance is no longer needed.

    Which action will reduce cost?
  fr: |
    AWS Compute Optimizer signale qu'une instance Amazon EC2 d'un compte de test est inutilisée depuis plusieurs semaines. L'entreprise confirme que l'instance n'est plus nécessaire.

    Quelle action réduira les coûts ?
body:
  options:
    - id: a
      text: { en: "Terminate the instance", fr: "Résilier l'instance" }
    - id: b
      text: { en: "Change the instance to a larger instance type", fr: "Passer l'instance à un type d'instance plus grand" }
    - id: c
      text: { en: "Buy a Reserved Instance that matches the instance", fr: "Acheter une instance réservée correspondant à l'instance" }
    - id: d
      text: { en: "Move the instance to a Dedicated Host", fr: "Déplacer l'instance vers un Dedicated Host" }
answer: { optionId: a }
explanation:
  correct:
    en: "Removing idle resources is part of rightsizing: Compute Optimizer identifies idle resources that you can stop or delete to reduce costs. Because the instance is no longer needed, terminating it removes its charges."
    fr: "La suppression des ressources inutilisées fait partie du dimensionnement approprié : Compute Optimizer identifie les ressources inutilisées que vous pouvez arrêter ou supprimer pour réduire les coûts. Comme l'instance n'est plus nécessaire, la résilier supprime ses frais."
  options:
    b:
      en: "A larger instance type costs more and does not help an instance that is not used."
      fr: "Un type d'instance plus grand coûte plus cher et n'aide pas une instance qui n'est pas utilisée."
    c:
      en: "A Reserved Instance lowers the price of usage that continues; it would commit the company to pay for an instance that it does not need."
      fr: "Une instance réservée réduit le prix d'une utilisation qui se poursuit ; elle engagerait l'entreprise à payer une instance dont elle n'a pas besoin."
    d:
      en: "A Dedicated Host is a whole physical server and usually costs more than one instance with shared tenancy."
      fr: "Un Dedicated Host est un serveur physique entier et coûte généralement plus cher qu'une instance en location partagée."
references:
  - title: "What is AWS Compute Optimizer? - AWS Compute Optimizer"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html
