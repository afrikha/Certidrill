id: clfc02-1b-strategy-relocate
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants to transfer a large number of servers from its on-premises virtualization platform to a cloud version of the same platform. It wants no new hardware, no application rewrites and no change to its existing operations.

    Which migration strategy matches this requirement?
  fr: |
    Une entreprise veut transférer un grand nombre de serveurs de sa plateforme de virtualisation sur site vers une version cloud de la même plateforme. Elle ne veut ni nouveau matériel, ni réécriture d'application, ni changement de ses opérations existantes.

    Quelle stratégie de migration correspond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Rehost", fr: "Réhéberger (Rehost)" }
    - id: b
      text: { en: "Replatform", fr: "Replateformer (Replatform)" }
    - id: c
      text: { en: "Relocate", fr: "Relocaliser (Relocate)" }
    - id: d
      text: { en: "Repurchase", fr: "Racheter (Repurchase)" }
answer: { optionId: c }
explanation:
  correct:
    en: "Relocate transfers many servers, including one or more applications, from an on-premises platform to a cloud version of that platform, with no new hardware, no rewrites and no change to operations. It also covers moving instances or objects to another VPC, Region or AWS account."
    fr: "La relocalisation (Relocate) transfère de nombreux serveurs, avec une ou plusieurs applications, d'une plateforme sur site vers une version cloud de cette même plateforme, sans nouveau matériel, sans réécriture et sans changement des opérations. Elle couvre aussi le déplacement d'instances ou d'objets vers un autre VPC, une autre Région ou un autre compte AWS."
  options:
    a:
      en: "Rehost moves applications unchanged, but onto AWS services such as Amazon EC2, not onto a cloud version of the same virtualization platform."
      fr: "Le réhébergement (Rehost) déplace les applications sans les modifier, mais vers des services AWS comme Amazon EC2, pas vers une version cloud de la même plateforme de virtualisation."
    b:
      en: "Replatform introduces optimizations, such as managed services, which the company does not want."
      fr: "Le replateformage (Replatform) introduit des optimisations, comme des services gérés, ce que l'entreprise ne veut pas."
    d:
      en: "Repurchase replaces applications with different products, which changes operations."
      fr: "Le rachat (Repurchase) remplace les applications par d'autres produits, ce qui change les opérations."
references:
  - title: "About the migration strategies"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
