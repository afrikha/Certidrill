id: clfc02-1c-byol-traits
objective: "1.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is evaluating the Bring Your Own License (BYOL) model for the commercial software that it plans to move to AWS.

    Which statements about BYOL are correct? (Choose two.)
  fr: |
    Une entreprise évalue le modèle BYOL (Bring Your Own License) pour les logiciels commerciaux qu'elle prévoit de déplacer vers AWS.

    Quelles affirmations sur le modèle BYOL sont correctes ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "AWS includes the software license fee in the price of each instance.", fr: "AWS inclut les frais de licence logicielle dans le prix de chaque instance." }
    - id: b
      text: { en: "The company reuses licenses that it already owns instead of buying them again.", fr: "L'entreprise réutilise des licences qu'elle possède déjà au lieu de les racheter." }
    - id: c
      text: { en: "The company pays AWS a one-time fee to transfer each license to its account.", fr: "L'entreprise paie à AWS des frais uniques pour transférer chaque licence vers son compte." }
    - id: d
      text: { en: "BYOL removes the need to track license usage on AWS.", fr: "Le modèle BYOL supprime le besoin de suivre l'utilisation des licences sur AWS." }
    - id: e
      text: { en: "Depending on the license terms, the company might need dedicated hardware such as Dedicated Hosts.", fr: "Selon les conditions de licence, l'entreprise peut avoir besoin de matériel dédié, comme des Dedicated Hosts." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "With BYOL, the company reuses its existing license inventory on AWS, which avoids paying for the same software twice. Some license terms are bound to physical sockets or cores, so they require Dedicated Hosts, which show that information."
    fr: "Avec le modèle BYOL, l'entreprise réutilise son inventaire de licences existant sur AWS, ce qui évite de payer deux fois le même logiciel. Certaines conditions de licence sont liées aux sockets ou aux cœurs physiques : elles exigent alors des Dedicated Hosts, qui fournissent ces informations."
  options:
    a:
      en: "A license fee in the instance price describes the License Included model, not BYOL."
      fr: "Des frais de licence inclus dans le prix de l'instance décrivent le modèle de licence incluse, pas le BYOL."
    c:
      en: "AWS does not charge a fee to bring a license; the company pays for the AWS resources that it uses."
      fr: "AWS ne facture pas de frais pour apporter une licence : l'entreprise paie les ressources AWS qu'elle utilise."
    d:
      en: "The company must still track its license usage to stay compliant; AWS License Manager helps it do so across accounts and Regions."
      fr: "L'entreprise doit toujours suivre l'utilisation de ses licences pour rester conforme ; AWS License Manager l'aide à le faire dans plusieurs comptes et Régions."
references:
  - title: "What is AWS License Manager? - AWS License Manager"
    url: https://docs.aws.amazon.com/license-manager/latest/userguide/license-manager.html
  - title: "Amazon EC2 Dedicated Hosts - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html
