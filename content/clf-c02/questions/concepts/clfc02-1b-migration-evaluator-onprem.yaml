id: clfc02-1b-migration-evaluator-onprem
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs 800 VMware virtual machines on premises and has not deployed anything on AWS yet. It wants AWS to analyze the utilization of these machines, recommend right-sized Amazon EC2 instances, and compare BYOL and license-included options in a business case at no charge.

    Which AWS offering meets these requirements?
  fr: |
    Une entreprise exécute 800 machines virtuelles VMware sur site et n'a encore rien déployé sur AWS. Elle veut qu'AWS analyse l'utilisation de ces machines, recommande des instances Amazon EC2 bien dimensionnées et compare les options BYOL et licence incluse dans une analyse de rentabilisation, sans frais.

    Quelle offre AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Migration Evaluator", fr: "Migration Evaluator" }
    - id: b
      text: { en: "AWS Compute Optimizer", fr: "AWS Compute Optimizer" }
    - id: c
      text: { en: "AWS Cost Explorer", fr: "AWS Cost Explorer" }
    - id: d
      text: { en: "AWS Pricing Calculator", fr: "AWS Pricing Calculator" }
answer: { optionId: a }
explanation:
  correct:
    en: "Migration Evaluator builds a no-cost business case for migrating to AWS. It right-sizes EC2 instances from on-premises server profiles and utilization data, models BYOL and AWS license-included options, and compares on-premises and AWS costs."
    fr: "Migration Evaluator établit sans frais une analyse de rentabilisation de la migration vers AWS. Il dimensionne les instances EC2 à partir des profils et des données d'utilisation des serveurs sur site, modélise les options BYOL et licence incluse d'AWS, et compare les coûts sur site et sur AWS."
  options:
    b:
      en: "Compute Optimizer recommends sizes for resources that already run on AWS; it cannot analyze on-premises VMs."
      fr: "Compute Optimizer recommande des tailles pour des ressources qui s'exécutent déjà sur AWS ; il ne peut pas analyser des machines virtuelles sur site."
    c:
      en: "Cost Explorer analyzes and forecasts costs of an existing AWS account; the company has no AWS usage yet."
      fr: "Cost Explorer analyse et prévoit les coûts d'un compte AWS existant ; l'entreprise n'a encore aucune utilisation d'AWS."
    d:
      en: "Pricing Calculator estimates costs from configurations that the user enters; it does not analyze on-premises utilization or build a business case."
      fr: "Pricing Calculator estime les coûts à partir de configurations saisies par l'utilisateur ; il n'analyse pas l'utilisation sur site et n'établit pas d'analyse de rentabilisation."
references:
  - title: "Migration Evaluator"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/migration-tools/business-case-migration-evaluator.html
