id: clfc02-1b-no-hardware-refresh
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company replaces its on-premises servers every five years. It plans to move all its workloads to Amazon EC2 and close its data center.

    Which cost will the company no longer pay after the migration?
  fr: |
    Une entreprise remplace ses serveurs sur site tous les cinq ans. Elle prévoit de déplacer toutes ses charges de travail vers Amazon EC2 et de fermer son centre de données.

    Quel coût l'entreprise ne paiera-t-elle plus après la migration ?
body:
  options:
    - id: a
      text: { en: "The licenses of the software that it brings to AWS", fr: "Les licences des logiciels qu'elle apporte sur AWS" }
    - id: b
      text: { en: "The purchase and periodic replacement of physical servers", fr: "L'achat et le remplacement périodique de serveurs physiques" }
    - id: c
      text: { en: "The configuration of its user identities and permissions", fr: "La configuration des identités et des autorisations de ses utilisateurs" }
    - id: d
      text: { en: "The compute capacity that its workloads consume", fr: "La capacité de calcul que consomment ses charges de travail" }
answer: { optionId: b }
explanation:
  correct:
    en: "On AWS, the company no longer invests in data centers and servers or replaces hardware: AWS owns and maintains the physical infrastructure. The company pays for the compute capacity it consumes instead."
    fr: "Sur AWS, l'entreprise n'investit plus dans des centres de données et des serveurs, et ne remplace plus de matériel : AWS possède et entretient l'infrastructure physique. L'entreprise paie à la place la capacité de calcul qu'elle consomme."
  options:
    a:
      en: "Licenses that the company brings (BYOL) are still paid to the software vendor after the migration."
      fr: "Les licences que l'entreprise apporte (BYOL) restent payées à l'éditeur après la migration."
    c:
      en: "Managing identities and permissions stays the customer's responsibility on AWS."
      fr: "La gestion des identités et des autorisations reste de la responsabilité du client sur AWS."
    d:
      en: "Compute capacity is still paid on AWS, but as a variable cost based on usage."
      fr: "La capacité de calcul est toujours payée sur AWS, mais comme un coût variable fondé sur l'utilisation."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
