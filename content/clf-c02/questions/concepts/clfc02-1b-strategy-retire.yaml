id: clfc02-1b-strategy-retire
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During its migration assessment, a company finds several applications that have had no inbound connections for 90 days and no business value.

    Which migration strategy should the company apply to these applications?
  fr: |
    Pendant l'évaluation de sa migration, une entreprise découvre plusieurs applications qui n'ont reçu aucune connexion entrante depuis 90 jours et n'ont aucune valeur métier.

    Quelle stratégie de migration l'entreprise doit-elle appliquer à ces applications ?
body:
  options:
    - id: a
      text: { en: "Rehost", fr: "Réhéberger (Rehost)" }
    - id: b
      text: { en: "Retain", fr: "Conserver (Retain)" }
    - id: c
      text: { en: "Replatform", fr: "Replateformer (Replatform)" }
    - id: d
      text: { en: "Retire", fr: "Retirer (Retire)" }
answer: { optionId: d }
explanation:
  correct:
    en: "Retire decommissions or archives applications by shutting down the servers in their stack. It suits applications with no business value or no inbound connections for 90 days, and it removes their hosting costs."
    fr: "Le retrait (Retire) met hors service ou archive des applications en arrêtant les serveurs de leur pile. Il convient aux applications sans valeur métier ou sans connexion entrante depuis 90 jours, et supprime leurs coûts d'hébergement."
  options:
    a:
      en: "Rehosting unused applications would only move their hosting costs to AWS."
      fr: "Réhéberger des applications inutilisées ne ferait que déplacer leurs coûts d'hébergement vers AWS."
    b:
      en: "Retain keeps the applications running in the data center and keeps their costs."
      fr: "La conservation (Retain) maintient les applications en fonctionnement dans le centre de données, avec leurs coûts."
    c:
      en: "Replatforming spends effort optimizing applications that nobody uses."
      fr: "Le replateformage consacre des efforts à optimiser des applications que personne n'utilise."
references:
  - title: "About the migration strategies"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
