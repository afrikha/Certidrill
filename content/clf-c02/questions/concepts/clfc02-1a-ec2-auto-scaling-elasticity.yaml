id: clfc02-1a-ec2-auto-scaling-elasticity
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants the number of Amazon EC2 instances that run its application to increase automatically when demand rises and to decrease when demand falls. Which AWS service should the company use?
  fr: |
    Une entreprise veut que le nombre d'instances Amazon EC2 qui exécutent son application augmente automatiquement quand la demande croît et diminue quand elle baisse. Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Elastic Load Balancing", fr: "Elastic Load Balancing" }
    - id: b
      text: { en: "AWS CloudFormation", fr: "AWS CloudFormation" }
    - id: c
      text: { en: "Amazon EC2 Auto Scaling", fr: "Amazon EC2 Auto Scaling" }
    - id: d
      text: { en: "Amazon CloudWatch", fr: "Amazon CloudWatch" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon EC2 Auto Scaling keeps the correct number of EC2 instances available to handle the load. Its scaling policies launch instances when demand increases and terminate them when demand decreases, within the minimum and maximum size of the Auto Scaling group."
    fr: "Amazon EC2 Auto Scaling maintient le bon nombre d'instances EC2 disponibles pour absorber la charge. Ses politiques de mise à l'échelle lancent des instances quand la demande augmente et les résilient quand elle diminue, dans les limites de la taille minimale et maximale du groupe Auto Scaling."
  options:
    a:
      en: "Elastic Load Balancing distributes traffic across existing instances; it does not launch or terminate instances."
      fr: "Elastic Load Balancing répartit le trafic entre les instances existantes ; il ne lance ni ne résilie d'instances."
    b:
      en: "CloudFormation provisions resources from templates; it does not adjust the number of instances to demand."
      fr: "CloudFormation provisionne des ressources à partir de modèles ; il n'ajuste pas le nombre d'instances à la demande."
    d:
      en: "CloudWatch monitors metrics and raises alarms that scaling can use, but it does not add or remove instances itself."
      fr: "CloudWatch surveille des métriques et déclenche des alarmes que la mise à l'échelle peut utiliser, mais il n'ajoute ni ne retire lui-même d'instances."
references:
  - title: "What is Amazon EC2 Auto Scaling?"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html
