id: clfc02-1b-new-market-no-capex
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to serve customers in a new country with low latency. It does not want to spend capital on building or leasing a data center there.

    What should the company do?
  fr: |
    Une entreprise veut servir des clients d'un nouveau pays avec une faible latence. Elle ne veut pas investir de capital dans la construction ou la location d'un centre de données dans ce pays.

    Que doit faire l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Lease colocation space in the country and buy servers for it.", fr: "Louer un espace de colocation dans le pays et y acheter des serveurs." }
    - id: b
      text: { en: "Expand its existing data center to handle the new traffic.", fr: "Agrandir son centre de données existant pour absorber le nouveau trafic." }
    - id: c
      text: { en: "Deploy the application in an AWS Region close to the new customers.", fr: "Déployer l'application dans une Région AWS proche des nouveaux clients." }
    - id: d
      text: { en: "Buy additional network bandwidth from its current data center.", fr: "Acheter de la bande passante réseau supplémentaire pour son centre de données actuel." }
answer: { optionId: c }
explanation:
  correct:
    en: "With AWS, a company can deploy its application in multiple Regions around the world with a few clicks, which gives lower latency to customers at minimal cost. It pays only for the resources it uses, with no capital spent on a new facility."
    fr: "Avec AWS, une entreprise peut déployer son application dans plusieurs Régions du monde en quelques clics, ce qui réduit la latence pour les clients à un coût minimal. Elle ne paie que les ressources qu'elle utilise, sans investir de capital dans de nouveaux locaux."
  options:
    a:
      en: "Leasing colocation space and buying servers is the capital spending the company wants to avoid."
      fr: "Louer un espace de colocation et acheter des serveurs est justement la dépense d'investissement que l'entreprise veut éviter."
    b:
      en: "Expanding the existing data center costs capital and does not bring the application closer to the new customers."
      fr: "Agrandir le centre de données existant exige du capital et ne rapproche pas l'application des nouveaux clients."
    d:
      en: "More bandwidth does not reduce the latency caused by the distance to the new country."
      fr: "Plus de bande passante ne réduit pas la latence due à la distance avec le nouveau pays."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
