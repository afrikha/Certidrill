id: clfc02-1b-proserve-experts
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is enrolled in the AWS Migration Acceleration Program (MAP). It wants a team of experts employed by AWS to help it execute its migration.

    Which AWS resource should the company engage?
  fr: |
    Une entreprise participe à l'AWS Migration Acceleration Program (MAP). Elle veut qu'une équipe d'experts employés par AWS l'aide à exécuter sa migration.

    À quelle ressource AWS l'entreprise doit-elle faire appel ?
body:
  options:
    - id: a
      text: { en: "AWS re:Post", fr: "AWS re:Post" }
    - id: b
      text: { en: "AWS Professional Services", fr: "AWS Professional Services" }
    - id: c
      text: { en: "AWS Marketplace", fr: "AWS Marketplace" }
    - id: d
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Professional Services is AWS's own team of consultants. In MAP, the Migrate and modernize phase is executed with AWS migration services and with help from AWS Professional Services and AWS Migration Competency Partners."
    fr: "AWS Professional Services est l'équipe de consultants d'AWS. Dans le MAP, la phase Migrer et moderniser (Migrate and modernize) s'exécute avec les services de migration AWS et l'aide d'AWS Professional Services et des partenaires AWS Migration Competency."
  options:
    a:
      en: "AWS re:Post is a community question-and-answer service; it does not provide a team that runs a migration."
      fr: "AWS re:Post est un service communautaire de questions-réponses ; il ne fournit pas d'équipe qui mène une migration."
    c:
      en: "AWS Marketplace is a catalog of third-party software and services from sellers, not AWS's own experts."
      fr: "AWS Marketplace est un catalogue de logiciels et services tiers proposés par des vendeurs, pas les experts d'AWS."
    d:
      en: "Trusted Advisor gives automated best-practice recommendations for AWS resources; it is not a consulting team."
      fr: "Trusted Advisor donne des recommandations automatisées de bonnes pratiques pour les ressources AWS ; ce n'est pas une équipe de conseil."
references:
  - title: "AWS Migration Acceleration Program (MAP)"
    url: https://aws.amazon.com/migration-acceleration-program/
