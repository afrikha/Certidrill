id: clfc02-1c-dedicated-host-sockets
objective: "1.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company owns Windows Server licenses that are licensed per physical core. The license terms require the company to count the sockets and physical cores of the servers that run the software. The company wants to use these licenses on Amazon EC2.

    Which EC2 option will meet these requirements?
  fr: |
    Une entreprise possède des licences Windows Server octroyées par cœur physique. Les conditions de licence imposent à l'entreprise de compter les sockets et les cœurs physiques des serveurs qui exécutent le logiciel. L'entreprise souhaite utiliser ces licences sur Amazon EC2.

    Quelle option EC2 répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Dedicated Instances", fr: "Dedicated Instances" }
    - id: b
      text: { en: "Dedicated Hosts", fr: "Dedicated Hosts" }
    - id: c
      text: { en: "On-Demand Instances with default (shared) tenancy", fr: "On-Demand Instances avec la location par défaut (partagée)" }
    - id: d
      text: { en: "On-Demand Capacity Reservations", fr: "On-Demand Capacity Reservations" }
answer: { optionId: b }
explanation:
  correct:
    en: "A Dedicated Host is a physical server for the company's use that shows the number of sockets and physical cores. This visibility supports BYOL for licenses bound to sockets, cores, or VMs, such as Windows Server and SQL Server, subject to the license terms."
    fr: "Un Dedicated Host est un serveur physique réservé à l'entreprise qui indique le nombre de sockets et de cœurs physiques. Cette visibilité permet le BYOL pour des licences liées aux sockets, aux cœurs ou aux machines virtuelles, comme Windows Server et SQL Server, sous réserve des conditions de licence."
  options:
    a:
      en: "Dedicated Instances also run on hardware dedicated to one account, but they give no visibility into sockets, cores, or host ID, and support BYOL only partially."
      fr: "Les Dedicated Instances s'exécutent aussi sur du matériel dédié à un compte, mais elles n'offrent aucune visibilité sur les sockets, les cœurs ou l'ID de l'hôte, et ne prennent en charge le BYOL que partiellement."
    c:
      en: "Shared-tenancy instances give no view of the physical server, so the company cannot count sockets and cores for its licenses."
      fr: "Les instances en location partagée n'offrent aucune vue du serveur physique : l'entreprise ne peut donc pas compter les sockets et les cœurs pour ses licences."
    d:
      en: "A Capacity Reservation guarantees capacity for instances; it does not expose the sockets and cores of a physical server."
      fr: "Une Capacity Reservation garantit de la capacité pour des instances ; elle n'expose pas les sockets et les cœurs d'un serveur physique."
references:
  - title: "Amazon EC2 Dedicated Hosts - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html
