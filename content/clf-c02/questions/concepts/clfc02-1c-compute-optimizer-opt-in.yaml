id: clfc02-1c-compute-optimizer-opt-in
objective: "1.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company opens AWS Compute Optimizer for the first time. Its Amazon EC2 instances have been running for several months, but Compute Optimizer shows no recommendations.

    What must the company do first?
  fr: |
    Une entreprise ouvre AWS Compute Optimizer pour la première fois. Ses instances Amazon EC2 s'exécutent depuis plusieurs mois, mais Compute Optimizer n'affiche aucune recommandation.

    Que doit faire l'entreprise en premier ?
body:
  options:
    - id: a
      text: { en: "Opt in to Compute Optimizer for the account or the organization", fr: "S'inscrire (opt in) à Compute Optimizer pour le compte ou l'organisation" }
    - id: b
      text: { en: "Subscribe to the AWS Business Support+ plan", fr: "Souscrire au plan AWS Business Support+" }
    - id: c
      text: { en: "Turn on AWS CloudTrail in every Region", fr: "Activer AWS CloudTrail dans chaque Région" }
    - id: d
      text: { en: "Activate enhanced infrastructure metrics for each instance", fr: "Activer les métriques d'infrastructure améliorées pour chaque instance" }
answer: { optionId: a }
explanation:
  correct:
    en: "Compute Optimizer does not analyze resources or generate recommendations until you opt in. A standalone account, a member account, or the management account of an organization can opt in; recommendations based on the default metrics analysis are free."
    fr: "Compute Optimizer n'analyse pas les ressources et ne génère aucune recommandation tant que vous ne vous êtes pas inscrit (opt in). Un compte autonome, un compte membre ou le compte de gestion d'une organisation peut s'inscrire ; les recommandations fondées sur l'analyse des métriques par défaut sont gratuites."
  options:
    b:
      en: "Compute Optimizer recommendations do not depend on a Support plan; the requirement is to opt in."
      fr: "Les recommandations de Compute Optimizer ne dépendent pas d'un plan de support : l'exigence est de s'inscrire."
    c:
      en: "Compute Optimizer uses Amazon CloudWatch utilization metrics, not CloudTrail API activity."
      fr: "Compute Optimizer utilise les métriques d'utilisation Amazon CloudWatch, pas l'activité d'API de CloudTrail."
    d:
      en: "Enhanced infrastructure metrics is an optional paid feature that extends the lookback period to 93 days; it is not needed to receive recommendations."
      fr: "Les métriques d'infrastructure améliorées sont une fonctionnalité payante facultative qui étend la période d'analyse à 93 jours ; elles ne sont pas nécessaires pour recevoir des recommandations."
references:
  - title: "What is AWS Compute Optimizer? - AWS Compute Optimizer"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html
