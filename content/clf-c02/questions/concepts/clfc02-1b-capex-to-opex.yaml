id: clfc02-1b-capex-to-opex
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company moves all its workloads from its data center to AWS and pays for them with On-Demand pricing.

    How does the nature of its IT spending change?
  fr: |
    Une entreprise déplace toutes ses charges de travail de son centre de données vers AWS et les paie au tarif On-Demand.

    Comment la nature de ses dépenses informatiques change-t-elle ?
body:
  options:
    - id: a
      text: { en: "It shifts from operational expenditure to capital expenditure.", fr: "Elle passe des dépenses d'exploitation aux dépenses d'investissement." }
    - id: b
      text: { en: "It shifts from capital expenditure to operational expenditure.", fr: "Elle passe des dépenses d'investissement aux dépenses d'exploitation." }
    - id: c
      text: { en: "It becomes a single fixed fee paid to AWS at the start of each year.", fr: "Elle devient des frais fixes uniques payés à AWS au début de chaque année." }
    - id: d
      text: { en: "It stays capital expenditure, because AWS charges include the servers.", fr: "Elle reste une dépense d'investissement, car les frais AWS incluent les serveurs." }
answer: { optionId: b }
explanation:
  correct:
    en: "Buying data centers and servers is capital expenditure. With On-Demand pricing on AWS, the company pays for resources as it consumes them, which is operational expenditure: the fixed upfront expense is traded for a variable expense."
    fr: "L'achat de centres de données et de serveurs est une dépense d'investissement. Avec la tarification On-Demand sur AWS, l'entreprise paie les ressources au fur et à mesure de leur consommation, ce qui constitue une dépense d'exploitation : la dépense fixe initiale est remplacée par une dépense variable."
  options:
    a:
      en: "This reverses the change: the company stops buying hardware and starts paying for usage."
      fr: "Cette option inverse le changement : l'entreprise cesse d'acheter du matériel et commence à payer l'utilisation."
    c:
      en: "On-Demand pricing has no upfront payment or yearly fixed fee."
      fr: "La tarification On-Demand n'implique ni paiement initial ni frais fixes annuels."
    d:
      en: "The company does not buy or own AWS servers; it pays for their use as an operating expense."
      fr: "L'entreprise n'achète pas et ne possède pas les serveurs AWS ; elle paie leur utilisation comme une dépense d'exploitation."
references:
  - title: "Six advantages of cloud computing"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
