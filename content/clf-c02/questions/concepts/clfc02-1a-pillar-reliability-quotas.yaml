id: clfc02-1a-pillar-reliability-quotas
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    During a traffic peak, a company's workload could not launch additional Amazon EC2 instances because the account had reached a service quota. Which pillar of the AWS Well-Architected Framework includes best practices for managing service quotas and constraints?
  fr: |
    Pendant un pic de trafic, la charge de travail d'une entreprise n'a pas pu lancer d'instances Amazon EC2 supplémentaires parce que le compte avait atteint un quota de service. Quel pilier du cadre AWS Well-Architected comprend les bonnes pratiques de gestion des quotas et contraintes de service ?
body:
  options:
    - id: a
      text: { en: "Operational excellence", fr: "Excellence opérationnelle" }
    - id: b
      text: { en: "Cost optimization", fr: "Optimisation des coûts" }
    - id: c
      text: { en: "Performance efficiency", fr: "Efficacité des performances" }
    - id: d
      text: { en: "Reliability", fr: "Fiabilité" }
answer: { optionId: d }
explanation:
  correct:
    en: "\"Manage service quotas and constraints\" is a best practice of the Foundations area of the reliability pillar. Reaching a quota is a resource-saturation failure: the workload cannot perform its function when demand grows."
    fr: "« Gérer les quotas et contraintes de service » est une bonne pratique du domaine Fondations du pilier fiabilité. Atteindre un quota est une défaillance par saturation des ressources : la charge de travail ne peut plus remplir sa fonction quand la demande augmente."
  options:
    a:
      en: "Operational excellence covers how teams prepare, operate, and evolve operations, not service quota management."
      fr: "L'excellence opérationnelle couvre la manière dont les équipes préparent, exécutent et font évoluer les opérations, pas la gestion des quotas de service."
    b:
      en: "Quotas can limit spending, but the framework places their management in the reliability pillar."
      fr: "Les quotas peuvent limiter les dépenses, mais le cadre place leur gestion dans le pilier fiabilité."
    c:
      en: "Performance efficiency selects and scales resources to meet requirements, but quota management is a reliability foundation."
      fr: "L'efficacité des performances choisit et met à l'échelle les ressources pour répondre aux exigences, mais la gestion des quotas est une base de la fiabilité."
references:
  - title: "Reliability"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/reliability.html
