id: clfc02-1b-tco-concept
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before migrating, a company wants to compare the full cost of running its workloads on premises, including servers, facilities, power and staff, with the cost of running the same workloads on AWS.

    Which concept is the company analyzing?
  fr: |
    Avant de migrer, une entreprise veut comparer le coût complet de l'exécution de ses charges de travail sur site, y compris les serveurs, les locaux, l'électricité et le personnel, avec le coût de ces mêmes charges de travail sur AWS.

    Quel concept l'entreprise analyse-t-elle ?
body:
  options:
    - id: a
      text: { en: "Rightsizing", fr: "Dimensionnement approprié (rightsizing)" }
    - id: b
      text: { en: "Total cost of ownership (TCO)", fr: "Coût total de possession (TCO)" }
    - id: c
      text: { en: "Economies of scale", fr: "Économies d'échelle" }
    - id: d
      text: { en: "Elasticity", fr: "Élasticité" }
answer: { optionId: b }
explanation:
  correct:
    en: "Total cost of ownership (TCO) includes all the direct and indirect costs of running a workload, not only the purchase price of servers. Comparing on-premises TCO with the cost on AWS is a usual step of a migration business case, as in the MAP Assess phase."
    fr: "Le coût total de possession (TCO) inclut tous les coûts directs et indirects de l'exécution d'une charge de travail, pas seulement le prix d'achat des serveurs. Comparer le TCO sur site avec le coût sur AWS est une étape habituelle de l'analyse de rentabilisation d'une migration, comme dans la phase Évaluer (Assess) du MAP."
  options:
    a:
      en: "Rightsizing matches resource types and sizes to workload needs; it is not a full cost comparison."
      fr: "Le dimensionnement approprié adapte les types et les tailles de ressources aux besoins des charges de travail ; ce n'est pas une comparaison complète des coûts."
    c:
      en: "Economies of scale explain why AWS can offer lower prices; they are not a method to compare total costs."
      fr: "Les économies d'échelle expliquent pourquoi AWS peut proposer des prix plus bas ; ce n'est pas une méthode de comparaison des coûts totaux."
    d:
      en: "Elasticity is the ability to add and remove resources as demand changes, not a cost comparison."
      fr: "L'élasticité est la capacité d'ajouter et de retirer des ressources selon la demande, pas une comparaison de coûts."
references:
  - title: "Migration Evaluator"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/migration-tools/business-case-migration-evaluator.html
  - title: "AWS Migration Acceleration Program (MAP)"
    url: https://aws.amazon.com/migration-acceleration-program/
