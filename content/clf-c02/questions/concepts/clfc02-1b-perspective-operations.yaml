id: clfc02-1b-perspective-operations
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's site reliability engineers and IT service managers must make sure that cloud services meet business-agreed service levels. They will work on observability, patch management, and incident and problem management.

    Which AWS CAF perspective do these capabilities belong to?
  fr: |
    Les ingénieurs de fiabilité de site (SRE) et les responsables des services informatiques d'une entreprise doivent s'assurer que les services cloud respectent les niveaux de service convenus avec le métier. Ils travailleront sur l'observabilité, la gestion des correctifs et la gestion des incidents et des problèmes.

    À quelle perspective AWS CAF ces capacités appartiennent-elles ?
body:
  options:
    - id: a
      text: { en: "Operations", fr: "Opérations (Operations)" }
    - id: b
      text: { en: "Security", fr: "Sécurité (Security)" }
    - id: c
      text: { en: "Platform", fr: "Plateforme (Platform)" }
    - id: d
      text: { en: "Governance", fr: "Gouvernance (Governance)" }
answer: { optionId: a }
explanation:
  correct:
    en: "The Operations perspective (health and availability) makes sure that cloud services are delivered at the level agreed with the business. Its capabilities include observability, event management, incident and problem management, change and release management, and patch management."
    fr: "La perspective Opérations (Operations), axée sur l'intégrité et la disponibilité, garantit que les services cloud sont fournis au niveau convenu avec le métier. Ses capacités comprennent l'observabilité, la gestion des événements, la gestion des incidents et des problèmes, la gestion des changements et des mises en production, et la gestion des correctifs."
  options:
    b:
      en: "The Security perspective includes vulnerability management and incident response, but service levels, observability and patch management belong to Operations."
      fr: "La perspective Sécurité (Security) comprend la gestion des vulnérabilités et la réponse aux incidents de sécurité, mais les niveaux de service, l'observabilité et la gestion des correctifs relèvent des Opérations."
    c:
      en: "The Platform perspective builds the cloud environment (architecture, engineering, CI/CD); it does not run it against service levels."
      fr: "La perspective Plateforme (Platform) construit l'environnement cloud (architecture, ingénierie, CI/CD) ; elle ne l'exploite pas selon des niveaux de service."
    d:
      en: "The Governance perspective oversees programs, risks and finances, not the daily health of workloads."
      fr: "La perspective Gouvernance (Governance) supervise les programmes, les risques et les finances, pas l'intégrité quotidienne des charges de travail."
references:
  - title: "An Overview of the AWS Cloud Adoption Framework"
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
