id: clfc02-3c-intelligent-tiering-unknown
objective: "3.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores millions of objects in Amazon S3. It cannot predict how often each object will be accessed, and access patterns change over time. It wants S3 to optimize storage costs automatically without retrieval fees.

    Which S3 storage class will meet these requirements?
  fr: |
    Une entreprise stocke des millions d'objets dans Amazon S3. Elle ne peut pas prévoir la fréquence d'accès à chaque objet, et les modèles d'accès évoluent dans le temps. Elle souhaite que S3 optimise automatiquement les coûts de stockage, sans frais d'extraction.

    Quelle classe de stockage S3 répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "S3 Standard-IA", fr: "S3 Standard-IA" }
    - id: b
      text: { en: "S3 Glacier Deep Archive", fr: "S3 Glacier Deep Archive" }
    - id: c
      text: { en: "S3 Intelligent-Tiering", fr: "S3 Intelligent-Tiering" }
    - id: d
      text: { en: "S3 One Zone-IA", fr: "S3 One Zone-IA" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      S3 Intelligent-Tiering is designed for data with unknown or changing access patterns. It moves objects between access tiers automatically, charges no retrieval fee and has no minimum storage duration; a small monitoring and automation fee applies per object.
    fr: |-
      S3 Intelligent-Tiering est conçu pour des données aux modèles d'accès inconnus ou changeants. Il déplace automatiquement les objets entre des niveaux d'accès, ne facture pas de frais d'extraction et n'impose pas de durée de stockage minimale ; des frais modestes de surveillance et d'automatisation s'appliquent par objet.
  options:
    a:
      en: |-
        Standard-IA charges a per-GB retrieval fee and suits data known to be accessed about once a month.
      fr: |-
        Standard-IA facture des frais d'extraction par Go et convient à des données dont on sait qu'elles sont consultées environ une fois par mois.
    b:
      en: |-
        Deep Archive is for data accessed less than once a year; it requires a restore that takes hours and charges retrieval fees.
      fr: |-
        Deep Archive est destiné aux données consultées moins d'une fois par an ; il exige une restauration de plusieurs heures et facture des frais d'extraction.
    d:
      en: |-
        One Zone-IA charges retrieval fees, stores data in a single Availability Zone and does not adapt to changing access.
      fr: |-
        One Zone-IA facture des frais d'extraction, stocke les données dans une seule zone de disponibilité et ne s'adapte pas à l'évolution des accès.
references:
  - title: "Understanding and managing Amazon S3 storage classes - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
