id: clfc02-3d-translate-catalog
objective: "3.7.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An e-commerce company writes its product descriptions in English. It wants to publish them automatically in Spanish, German, and Japanese for customers in other countries.

    Which AWS service should the company use?
  fr: |
    Une entreprise de commerce électronique rédige ses descriptions de produits en anglais. Elle veut les publier automatiquement en espagnol, en allemand et en japonais pour les clients d'autres pays.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon Transcribe" }
    - { id: b, text: "Amazon Polly" }
    - { id: c, text: "Amazon Translate" }
    - { id: d, text: "Amazon Lex" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Translate is a text translation service that uses advanced machine learning to provide on-demand, high-quality translation between supported languages. The company can call it to localize product descriptions for each market without translating them manually."
    fr: "Amazon Translate est un service de traduction de texte qui utilise un machine learning avancé pour fournir à la demande des traductions de qualité entre les langues prises en charge. L'entreprise peut l'appeler pour localiser les descriptions de produits pour chaque marché sans les traduire manuellement."
  options:
    a:
      en: "Amazon Transcribe converts speech into text in the same language; it does not translate written text."
      fr: "Amazon Transcribe convertit la parole en texte dans la même langue ; il ne traduit pas de texte écrit."
    b:
      en: "Amazon Polly converts text into speech; it does not translate the text into another language."
      fr: "Amazon Polly convertit du texte en parole ; il ne traduit pas le texte dans une autre langue."
    d:
      en: "Amazon Lex builds conversational chatbots; it is not a service for translating content."
      fr: "Amazon Lex crée des chatbots conversationnels ; ce n'est pas un service de traduction de contenu."
references:
  - title: What is Amazon Translate?
    url: https://docs.aws.amazon.com/translate/latest/dg/what-is.html
