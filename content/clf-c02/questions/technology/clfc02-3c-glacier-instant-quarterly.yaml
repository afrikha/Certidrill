id: clfc02-3c-glacier-instant-quarterly
objective: "3.6.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A hospital must keep medical images for many years. Each image is accessed about once a quarter, and when a doctor requests one it must be returned in milliseconds. The hospital wants the lowest storage cost that meets these requirements.

    Which S3 storage class should the hospital use?
  fr: |
    Un hôpital doit conserver des images médicales pendant de nombreuses années. Chaque image est consultée environ une fois par trimestre et, lorsqu'un médecin en demande une, elle doit être renvoyée en quelques millisecondes. L'hôpital souhaite le coût de stockage le plus bas qui réponde à ces exigences.

    Quelle classe de stockage S3 l'hôpital doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "S3 Glacier Flexible Retrieval", fr: "S3 Glacier Flexible Retrieval" }
    - id: b
      text: { en: "S3 Glacier Deep Archive", fr: "S3 Glacier Deep Archive" }
    - id: c
      text: { en: "S3 Standard-IA", fr: "S3 Standard-IA" }
    - id: d
      text: { en: "S3 Glacier Instant Retrieval", fr: "S3 Glacier Instant Retrieval" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      S3 Glacier Instant Retrieval is designed for long-lived archive data accessed about once a quarter that still needs millisecond retrieval. It costs less to store than Standard-IA, in exchange for higher retrieval charges and a 90-day minimum storage duration.
    fr: |-
      S3 Glacier Instant Retrieval est conçu pour des données d'archive durables consultées environ une fois par trimestre qui exigent toujours une extraction en quelques millisecondes. Son stockage coûte moins cher que Standard-IA, en contrepartie de frais d'extraction plus élevés et d'une durée de stockage minimale de 90 jours.
  options:
    a:
      en: |-
        Glacier Flexible Retrieval requires a restore that takes minutes to hours, which fails the millisecond requirement.
      fr: |-
        Glacier Flexible Retrieval exige une restauration de quelques minutes à quelques heures, ce qui ne respecte pas l'exigence de quelques millisecondes.
    b:
      en: |-
        Deep Archive is the cheapest class but requires a restore that takes hours and suits data accessed less than once a year.
      fr: |-
        Deep Archive est la classe la moins chère, mais elle exige une restauration de plusieurs heures et convient à des données consultées moins d'une fois par an.
    c:
      en: |-
        Standard-IA returns objects in milliseconds but is designed for data accessed about once a month and costs more to store than Glacier Instant Retrieval.
      fr: |-
        Standard-IA renvoie les objets en quelques millisecondes, mais il est conçu pour des données consultées environ une fois par mois et son stockage coûte plus cher que Glacier Instant Retrieval.
references:
  - title: "Understanding and managing Amazon S3 storage classes - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
