id: clfc02-3a-az-definition
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes an AWS Availability Zone?
  fr: |
    Quelle affirmation décrit une zone de disponibilité AWS ?
body:
  options:
    - { id: a, text: { en: "A geographic area that groups several AWS Regions.", fr: "Une zone géographique qui regroupe plusieurs Régions AWS." } }
    - { id: b, text: { en: "A site in a major city where Amazon CloudFront caches content for nearby users.", fr: "Un site dans une grande ville où Amazon CloudFront met en cache du contenu pour les utilisateurs proches." } }
    - { id: c, text: { en: "One or more discrete data centers with redundant power, networking, and connectivity in an AWS Region.", fr: "Un ou plusieurs centres de données distincts, dotés d'une alimentation, d'un réseau et d'une connectivité redondants, dans une Région AWS." } }
    - { id: d, text: { en: "A single server rack that AWS installs in a customer's data center.", fr: "Un rack de serveurs unique qu'AWS installe dans le centre de données d'un client." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An Availability Zone consists of one or more discrete data centers, each with redundant power, networking, and connectivity, housed in separate facilities. Each Region contains multiple Availability Zones.
    fr: |
      Une zone de disponibilité se compose d'un ou plusieurs centres de données distincts, chacun doté d'une alimentation, d'un réseau et d'une connectivité redondants, et hébergés dans des installations séparées. Chaque Région contient plusieurs zones de disponibilité.
  options:
    a: { en: "The relationship is the reverse: a Region contains several Availability Zones.", fr: "La relation est inverse : une Région contient plusieurs zones de disponibilité." }
    b: { en: "This describes an edge location, which CloudFront uses to cache content close to users.", fr: "Cela décrit un emplacement périphérique, qu'utilise CloudFront pour mettre en cache le contenu près des utilisateurs." }
    d: { en: "AWS infrastructure installed on customer premises is AWS Outposts, not an Availability Zone.", fr: "L'infrastructure AWS installée chez le client est AWS Outposts, pas une zone de disponibilité." }
references:
  - title: AWS Regions and Availability Zones
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html
