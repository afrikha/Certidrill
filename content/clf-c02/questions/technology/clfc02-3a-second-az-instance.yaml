id: clfc02-3a-second-az-instance
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs its web application on one Amazon EC2 instance in a single Availability Zone. The application must keep serving users if that Availability Zone fails.

    Which change will meet this requirement?
  fr: |
    Une entreprise exécute son application web sur une instance Amazon EC2 dans une seule zone de disponibilité. L'application doit continuer à servir les utilisateurs si cette zone de disponibilité tombe en panne.

    Quelle modification répond à ce besoin ?
body:
  options:
    - { id: a, text: { en: "Add a second instance in the same Availability Zone and put both behind an Application Load Balancer.", fr: "Ajouter une deuxième instance dans la même zone de disponibilité et placer les deux derrière un Application Load Balancer." } }
    - { id: b, text: { en: "Change the instance to a larger instance type in the same Availability Zone.", fr: "Passer l'instance à un type d'instance plus grand dans la même zone de disponibilité." } }
    - { id: c, text: { en: "Add a second instance in another Availability Zone and put both behind an Application Load Balancer.", fr: "Ajouter une deuxième instance dans une autre zone de disponibilité et placer les deux derrière un Application Load Balancer." } }
    - { id: d, text: { en: "Attach a second Amazon EBS volume to the instance.", fr: "Attacher un deuxième volume Amazon EBS à l'instance." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Running instances in more than one Availability Zone removes the dependency on a single zone. The load balancer sends traffic only to healthy targets, so if one zone fails, the instance in the other zone keeps serving users.
    fr: |
      Exécuter des instances dans plusieurs zones de disponibilité supprime la dépendance à une seule zone. L'équilibreur de charge n'envoie le trafic qu'aux cibles saines : si une zone tombe en panne, l'instance de l'autre zone continue de servir les utilisateurs.
  options:
    a: { en: "Two instances in the same zone protect against an instance failure, but both stop if that zone fails.", fr: "Deux instances dans la même zone protègent contre la panne d'une instance, mais s'arrêtent toutes deux si cette zone tombe en panne." }
    b: { en: "A larger instance adds capacity but remains a single instance in a single zone.", fr: "Une instance plus grande ajoute de la capacité, mais reste une instance unique dans une seule zone." }
    d: { en: "An EBS volume is in the same zone as its instance, so it adds storage but no protection against the loss of that zone.", fr: "Un volume EBS se trouve dans la même zone que son instance : il ajoute du stockage, mais aucune protection contre la perte de cette zone." }
references:
  - title: AWS Regions and Availability Zones
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html
  - title: How Elastic Load Balancing works
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html
