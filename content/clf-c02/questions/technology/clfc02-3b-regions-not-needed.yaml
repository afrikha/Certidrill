id: clfc02-3b-regions-not-needed
objective: "3.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an internal application on a single Amazon EC2 instance in one AWS Region. All users are in the same country as the Region, and no regulation applies. The application must keep running if one data center fails. The solution must be the MOST cost-effective and least complex.

    What should the company do?
  fr: |
    Une entreprise exécute une application interne sur une seule instance Amazon EC2 dans une Région AWS. Tous les utilisateurs se trouvent dans le même pays que la Région, et aucune réglementation ne s'applique. L'application doit continuer de fonctionner si un centre de données tombe en panne. La solution doit être la PLUS rentable et la moins complexe.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Run the application in two Regions, with both Regions serving users at the same time.", fr: "Exécuter l'application dans deux Régions, les deux Régions servant les utilisateurs en même temps." } }
    - { id: b, text: { en: "Keep a scaled-down copy of the application in a second Region, ready for failover.", fr: "Conserver une copie réduite de l'application dans une deuxième Région, prête pour le basculement." } }
    - { id: c, text: { en: "Run the application on instances in two Availability Zones of the current Region.", fr: "Exécuter l'application sur des instances dans deux zones de disponibilité de la Région actuelle." } }
    - { id: d, text: { en: "Run the application on a larger instance in the current Availability Zone.", fr: "Exécuter l'application sur une instance plus grande dans la zone de disponibilité actuelle." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Availability Zones are isolated data center locations within a Region, so running instances in two zones keeps the application available if one data center fails. Additional Regions are justified by needs such as recovery from a Region-wide event, latency for distant users, or data sovereignty, none of which is stated here."
    fr: "Les zones de disponibilité sont des emplacements de centres de données isolés au sein d'une Région : exécuter des instances dans deux zones maintient l'application disponible si un centre de données tombe en panne. Des Régions supplémentaires se justifient par des besoins comme la reprise après un événement touchant toute la Région, la latence pour des utilisateurs éloignés ou la souveraineté des données, dont aucun n'est indiqué ici."
  options:
    a:
      en: "Two active Regions also survive a data center failure, but they double the infrastructure and add data replication between Regions: more cost and complexity than the requirement needs."
      fr: "Deux Régions actives survivent aussi à la panne d'un centre de données, mais elles doublent l'infrastructure et ajoutent une réplication des données entre Régions : plus de coût et de complexité que l'exigence n'en demande."
    b:
      en: "A standby copy in another Region adds cross-Region replication and failover procedures that are not required to survive a single data center failure."
      fr: "Une copie de secours dans une autre Région ajoute une réplication entre Régions et des procédures de basculement qui ne sont pas nécessaires pour survivre à la panne d'un seul centre de données."
    d:
      en: "A larger instance in the same Availability Zone is still a single point of failure if that data center fails."
      fr: "Une instance plus grande dans la même zone de disponibilité reste un point de défaillance unique si ce centre de données tombe en panne."
references:
  - title: Regions and Zones
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
