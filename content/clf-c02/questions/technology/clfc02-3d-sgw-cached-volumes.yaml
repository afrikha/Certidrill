id: clfc02-3d-sgw-cached-volumes
objective: "3.6.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's on-premises application servers use iSCSI block storage volumes. The company wants to keep its primary data in Amazon S3 to reduce on-premises storage, and to keep only the frequently accessed data on premises for low-latency access.

    Which solution meets these requirements?
  fr: |
    Les serveurs d'applications sur site d'une entreprise utilisent des volumes de stockage en bloc iSCSI. L'entreprise veut conserver ses données principales dans Amazon S3 pour réduire le stockage sur site, et ne garder sur site que les données fréquemment consultées pour un accès à faible latence.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Volume Gateway with stored volumes", fr: "Volume Gateway avec des volumes stockés" } }
    - { id: b, text: { en: "Volume Gateway with cached volumes", fr: "Volume Gateway avec des volumes mis en cache" } }
    - { id: c, text: "Amazon S3 File Gateway" }
    - { id: d, text: "Tape Gateway" }
answer: { optionId: b }
explanation:
  correct:
    en: "Volume Gateway provides cloud-backed volumes that application servers mount as iSCSI devices. With cached volumes, the data is stored in Amazon S3 and only copies of frequently accessed data are kept locally, which saves primary storage costs on premises."
    fr: "Volume Gateway fournit des volumes adossés au cloud que les serveurs d'applications montent comme des périphériques iSCSI. Avec des volumes mis en cache, les données sont stockées dans Amazon S3 et seules des copies des données fréquemment consultées sont conservées localement, ce qui réduit les coûts de stockage principal sur site."
  options:
    a:
      en: "Stored volumes keep the entire dataset on premises and back up point-in-time snapshots to Amazon S3, so they do not reduce on-premises storage."
      fr: "Les volumes stockés conservent tout le jeu de données sur site et sauvegardent des instantanés ponctuels dans Amazon S3 ; ils ne réduisent donc pas le stockage sur site."
    c:
      en: "S3 File Gateway provides NFS and SMB file shares, not iSCSI block volumes."
      fr: "S3 File Gateway fournit des partages de fichiers NFS et SMB, pas des volumes en bloc iSCSI."
    d:
      en: "Tape Gateway provides virtual tapes for backup and archiving, not block volumes for application servers."
      fr: "Tape Gateway fournit des bandes virtuelles pour la sauvegarde et l'archivage, pas des volumes en bloc pour les serveurs d'applications."
references:
  - title: What is Volume Gateway? - AWS Storage Gateway
    url: https://docs.aws.amazon.com/storagegateway/latest/vgw/WhatIsStorageGateway.html
