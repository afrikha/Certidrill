id: clfc02-3e-pipeline-build-test
objective: "3.8.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants to automate the release of its application. Each code change must automatically go through a release process in which a fully managed service compiles the code and runs unit tests, without build servers to manage.

    Which AWS services should the company use? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise souhaite automatiser la publication de son application. Chaque modification de code doit passer automatiquement par un processus de publication dans lequel un service entièrement géré compile le code et exécute les tests unitaires, sans serveur de génération à gérer.

    Quels services AWS l'entreprise doit-elle utiliser ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "AWS CodePipeline", fr: "AWS CodePipeline" } }
    - { id: b, text: { en: "AWS X-Ray", fr: "AWS X-Ray" } }
    - { id: c, text: { en: "AWS Systems Manager", fr: "AWS Systems Manager" } }
    - { id: d, text: { en: "AWS CodeBuild", fr: "AWS CodeBuild" } }
    - { id: e, text: { en: "AWS Batch", fr: "AWS Batch" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS CodePipeline is a continuous delivery service that models and automates the stages of a release process for every change. AWS CodeBuild is a fully managed build service that compiles source code, runs unit tests and produces deployable artifacts; it is added as the build or test action of the pipeline."
    fr: "AWS CodePipeline est un service de livraison continue qui modélise et automatise les étapes d'un processus de publication pour chaque modification. AWS CodeBuild est un service de génération entièrement géré qui compile le code source, exécute les tests unitaires et produit des artefacts prêts à déployer ; il est ajouté comme action de génération ou de test du pipeline."
  options:
    b:
      en: "X-Ray traces requests in a running application; it does not compile code or orchestrate releases."
      fr: "X-Ray suit les requêtes dans une application en cours d'exécution ; il ne compile pas de code et n'orchestre pas les publications."
    c:
      en: "Systems Manager operates and manages nodes and resources; it is not a build service or a release pipeline."
      fr: "Systems Manager exploite et gère des nœuds et des ressources ; ce n'est ni un service de génération ni un pipeline de publication."
    e:
      en: "AWS Batch runs batch computing jobs; it is not a managed build service for compiling and testing code."
      fr: "AWS Batch exécute des tâches de calcul par lots ; ce n'est pas un service de génération géré pour compiler et tester du code."
references:
  - title: What is AWS CodePipeline?
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/welcome.html
  - title: What is AWS CodeBuild?
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/welcome.html
