id: clfc02-3c-client-vpn-remote-users
objective: "3.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's employees work from home and travel often. They must securely reach applications in a VPC and in the on-premises network from their laptops, wherever they are, through an AWS managed service that scales with the number of users.

    Which AWS service will meet these requirements?
  fr: |
    Les employés d'une entreprise travaillent à domicile et voyagent souvent. Ils doivent accéder de façon sécurisée, depuis leurs ordinateurs portables et où qu'ils soient, à des applications d'un VPC et du réseau sur site, via un service géré par AWS qui évolue avec le nombre d'utilisateurs.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Site-to-Site VPN", fr: "AWS Site-to-Site VPN" }
    - id: b
      text: { en: "AWS Direct Connect", fr: "AWS Direct Connect" }
    - id: c
      text: { en: "AWS Client VPN", fr: "AWS Client VPN" }
    - id: d
      text: { en: "AWS Transit Gateway", fr: "AWS Transit Gateway" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS Client VPN is a managed, client-based VPN service that lets users reach AWS and on-premises resources securely from any location. Users connect with an OpenVPN-based client over TLS, and the service scales with the number of users without manual intervention.
    fr: |-
      AWS Client VPN est un service VPN géré, basé sur un client, qui permet aux utilisateurs d'accéder de façon sécurisée aux ressources AWS et sur site depuis n'importe quel emplacement. Les utilisateurs se connectent avec un client basé sur OpenVPN via TLS, et le service évolue avec le nombre d'utilisateurs sans intervention manuelle.
  options:
    a:
      en: |-
        Site-to-Site VPN connects a whole network through a customer gateway device, not individual laptops on the move.
      fr: |-
        Site-to-Site VPN connecte un réseau entier par l'intermédiaire d'un périphérique de passerelle client, et non des ordinateurs portables itinérants.
    b:
      en: |-
        Direct Connect is a fixed fiber connection from a data center or colocation site; it does not serve remote users.
      fr: |-
        Direct Connect est une connexion fixe par fibre depuis un centre de données ou un site d'hébergement ; elle ne dessert pas les utilisateurs distants.
    d:
      en: |-
        Transit Gateway is a routing hub between networks; users still need a VPN service such as Client VPN to connect.
      fr: |-
        Transit Gateway est un hub de routage entre réseaux ; les utilisateurs ont toujours besoin d'un service VPN comme Client VPN pour se connecter.
references:
  - title: "What is AWS Client VPN? - AWS Client VPN"
    url: https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/what-is.html
