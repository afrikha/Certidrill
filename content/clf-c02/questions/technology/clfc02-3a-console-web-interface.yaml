id: clfc02-3a-console-web-interface
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A business analyst has no programming or command-line experience. The analyst needs to view and manage AWS resources through a web browser by using a graphical interface.

    Which AWS option should the analyst use?
  fr: |
    Un analyste métier n'a aucune expérience de la programmation ni de la ligne de commande. Il doit consulter et gérer des ressources AWS depuis un navigateur web au moyen d'une interface graphique.

    Quelle option AWS l'analyste doit-il utiliser ?
body:
  options:
    - { id: a, text: "AWS SDKs" }
    - { id: b, text: "AWS Management Console" }
    - { id: c, text: "AWS Command Line Interface (AWS CLI)" }
    - { id: d, text: "AWS CloudFormation templates" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The AWS Management Console is a web-based application that gives centralized access to all the AWS service consoles. It requires no code and no command-line tool, which suits a user without programming experience.
    fr: |
      L'AWS Management Console est une application web qui donne un accès centralisé à toutes les consoles des services AWS. Elle ne demande ni code ni outil en ligne de commande, ce qui convient à un utilisateur sans expérience de la programmation.
  options:
    a: { en: "The SDKs are libraries that developers call from application code, which the analyst cannot write.", fr: "Les kits SDK sont des bibliothèques que les développeurs appellent depuis le code d'une application, ce que l'analyste ne sait pas écrire." }
    c: { en: "The AWS CLI is used by typing commands in a terminal, not through a graphical web interface.", fr: "L'AWS CLI s'utilise en tapant des commandes dans un terminal, pas au moyen d'une interface web graphique." }
    d: { en: "CloudFormation templates are text files that describe infrastructure; writing them is not a point-and-click task.", fr: "Les modèles CloudFormation sont des fichiers texte qui décrivent l'infrastructure ; leur écriture n'est pas une tâche « pointer-cliquer »." }
references:
  - title: What is the AWS Management Console?
    url: https://docs.aws.amazon.com/awsconsolehelpdocs/latest/gsg/what-is.html
