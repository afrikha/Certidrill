id: clfc02-3c-security-group-instance
objective: "3.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to control which inbound and outbound traffic can reach its Amazon EC2 instances.

    Which VPC feature acts as a stateful virtual firewall at the instance level and supports allow rules only?
  fr: |
    Une entreprise souhaite contrôler le trafic entrant et sortant qui peut atteindre ses instances Amazon EC2.

    Quelle fonctionnalité de VPC agit comme un pare-feu virtuel avec état au niveau de l'instance et ne prend en charge que des règles d'autorisation ?
body:
  options:
    - id: a
      text: { en: "Network ACL", fr: "ACL réseau" }
    - id: b
      text: { en: "Security group", fr: "Groupe de sécurité" }
    - id: c
      text: { en: "Route table", fr: "Table de routage" }
    - id: d
      text: { en: "Internet gateway", fr: "Passerelle Internet" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A security group operates at the instance level and contains allow rules only. It is stateful: return traffic for an allowed connection is automatically allowed, whatever the rules in the other direction.
    fr: |-
      Un groupe de sécurité fonctionne au niveau de l'instance et ne contient que des règles d'autorisation. Il est avec état : le trafic de retour d'une connexion autorisée est automatiquement autorisé, quelles que soient les règles dans l'autre sens.
  options:
    a:
      en: |-
        A network ACL works at the subnet level, is stateless and supports both allow and deny rules.
      fr: |-
        Une ACL réseau fonctionne au niveau du sous-réseau, est sans état et prend en charge des règles d'autorisation et de refus.
    c:
      en: |-
        A route table directs traffic from a subnet to a target; it does not filter traffic.
      fr: |-
        Une table de routage dirige le trafic d'un sous-réseau vers une cible ; elle ne filtre pas le trafic.
    d:
      en: |-
        An internet gateway connects the VPC to the internet; it is not a firewall.
      fr: |-
        Une passerelle Internet relie le VPC à Internet ; ce n'est pas un pare-feu.
references:
  - title: "Infrastructure security in Amazon VPC - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/infrastructure-security.html
