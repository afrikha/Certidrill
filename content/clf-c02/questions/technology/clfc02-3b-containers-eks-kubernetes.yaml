id: clfc02-3b-containers-eks-kubernetes
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs its containerized applications on a self-managed Kubernetes cluster on premises. The company wants to move to AWS, keep using its existing Kubernetes tools and manifests, and stop managing the Kubernetes control plane.

    Which AWS service should the company use?
  fr: |
    Une entreprise exécute ses applications conteneurisées sur un cluster Kubernetes autogéré sur site. L'entreprise veut migrer vers AWS, continuer à utiliser ses outils et manifestes Kubernetes existants, et ne plus gérer le plan de contrôle Kubernetes.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon Elastic Kubernetes Service (Amazon EKS)" }
    - { id: b, text: "Amazon Elastic Container Service (Amazon ECS)" }
    - { id: c, text: "AWS Elastic Beanstalk" }
    - { id: d, text: "Amazon Lightsail" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon EKS is a fully managed Kubernetes service: AWS manages the Kubernetes control plane of each cluster. EKS is certified Kubernetes-conformant, so the company can deploy its Kubernetes applications without refactoring and keep using Kubernetes community tools."
    fr: "Amazon EKS est un service Kubernetes entièrement géré : AWS gère le plan de contrôle Kubernetes de chaque cluster. EKS est certifié conforme à Kubernetes : l'entreprise peut déployer ses applications Kubernetes sans les refactoriser et continuer d'utiliser les outils de la communauté Kubernetes."
  options:
    b:
      en: "Amazon ECS is an AWS-specific orchestrator that does not use Kubernetes APIs or manifests, so the company would have to rework its deployments."
      fr: "Amazon ECS est un orchestrateur propre à AWS qui n'utilise ni les API ni les manifestes Kubernetes : l'entreprise devrait retravailler ses déploiements."
    c:
      en: "Elastic Beanstalk deploys applications from code or containers into its own environments; it does not run Kubernetes."
      fr: "Elastic Beanstalk déploie des applications à partir de code ou de conteneurs dans ses propres environnements ; il n'exécute pas Kubernetes."
    d:
      en: "Lightsail provides simple bundled servers and container services; it does not provide a managed Kubernetes control plane."
      fr: "Lightsail fournit des serveurs forfaitaires simples et des services de conteneurs ; il ne fournit pas de plan de contrôle Kubernetes géré."
references:
  - title: What is Amazon EKS?
    url: https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
