id: clfc02-3b-containers-eks-fargate-serverless
objective: "3.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company wants to run containerized applications on AWS by using Kubernetes. The company does not want to provision, patch, or scale any servers for the containers.

    Which combination of AWS services will meet these requirements? (Choose two.)
  fr: |
    Une entreprise veut exécuter des applications conteneurisées sur AWS avec Kubernetes. L'entreprise ne veut ni provisionner, ni corriger, ni mettre à l'échelle des serveurs pour les conteneurs.

    Quelle combinaison de services AWS répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "Amazon Elastic Container Service (Amazon ECS)" }
    - { id: b, text: "Amazon Elastic Kubernetes Service (Amazon EKS)" }
    - { id: c, text: { en: "Amazon EC2 instances in an Auto Scaling group", fr: "Instances Amazon EC2 dans un groupe Auto Scaling" } }
    - { id: d, text: "AWS Fargate" }
    - { id: e, text: "Amazon Lightsail" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Amazon EKS provides the managed Kubernetes control plane. AWS Fargate supplies serverless compute for the pods, so the company does not provision, patch, or scale any worker node servers."
    fr: "Amazon EKS fournit le plan de contrôle Kubernetes géré. AWS Fargate fournit le calcul sans serveur pour les pods : l'entreprise ne provisionne, ne corrige et ne met à l'échelle aucun serveur de nœud de travail."
  options:
    a:
      en: "Amazon ECS can also run containers on Fargate, but it is AWS's own orchestrator and does not use Kubernetes."
      fr: "Amazon ECS peut aussi exécuter des conteneurs sur Fargate, mais c'est l'orchestrateur propre à AWS, qui n'utilise pas Kubernetes."
    c:
      en: "EC2 worker nodes in an Auto Scaling group are servers that the company must patch and manage, which the requirements exclude."
      fr: "Des nœuds de travail EC2 dans un groupe Auto Scaling sont des serveurs que l'entreprise doit corriger et gérer, ce que les exigences excluent."
    e:
      en: "Lightsail provides simple bundled servers and container services; it is not a compute option for Kubernetes pods in Amazon EKS."
      fr: "Lightsail fournit des serveurs forfaitaires simples et des services de conteneurs ; ce n'est pas une option de calcul pour les pods Kubernetes d'Amazon EKS."
references:
  - title: Simplify compute management with AWS Fargate
    url: https://docs.aws.amazon.com/eks/latest/userguide/fargate.html
