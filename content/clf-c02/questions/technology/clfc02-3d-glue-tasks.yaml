id: clfc02-3d-glue-tasks
objective: "3.7.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two tasks can a company perform with AWS Glue? (Choose two.)
  fr: |
    Quelles sont les deux tâches qu'une entreprise peut effectuer avec AWS Glue ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Build interactive business intelligence dashboards for executives.", fr: "Créer des tableaux de bord interactifs de business intelligence pour la direction." } }
    - { id: b, text: { en: "Run crawlers that discover data in Amazon S3 and store table metadata in a central Data Catalog.", fr: "Exécuter des robots d'analyse (crawlers) qui découvrent des données dans Amazon S3 et stockent les métadonnées des tables dans un Data Catalog central." } }
    - { id: c, text: { en: "Host a petabyte-scale data warehouse with provisioned or serverless capacity.", fr: "Héberger un entrepôt de données à l'échelle du pétaoctet avec une capacité provisionnée ou sans serveur." } }
    - { id: d, text: { en: "Run serverless extract, transform, and load (ETL) jobs that clean data and load it into a data store.", fr: "Exécuter des tâches ETL (extraction, transformation et chargement) sans serveur qui nettoient des données et les chargent dans un magasin de données." } }
    - { id: e, text: { en: "Capture and store real-time data records that several consumer applications read.", fr: "Capturer et stocker des enregistrements de données en temps réel que lisent plusieurs applications consommatrices." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "AWS Glue is a serverless data integration service. Its crawlers discover data and populate the AWS Glue Data Catalog with table metadata that services such as Amazon Athena use, and its ETL jobs extract, transform, and load data between sources and targets."
    fr: "AWS Glue est un service d'intégration de données sans serveur. Ses robots d'analyse découvrent les données et alimentent l'AWS Glue Data Catalog avec des métadonnées de tables qu'utilisent des services comme Amazon Athena, et ses tâches ETL extraient, transforment et chargent des données entre des sources et des cibles."
  options:
    a:
      en: "Interactive business intelligence dashboards are built with Amazon Quick, not with AWS Glue."
      fr: "Les tableaux de bord interactifs de business intelligence se créent avec Amazon Quick, pas avec AWS Glue."
    c:
      en: "A petabyte-scale data warehouse is Amazon Redshift; AWS Glue can load data into it but does not host it."
      fr: "Un entrepôt de données à l'échelle du pétaoctet est Amazon Redshift ; AWS Glue peut y charger des données, mais ne l'héberge pas."
    e:
      en: "Capturing and storing real-time records for several consumer applications is done with Amazon Kinesis Data Streams; AWS Glue can process streaming data but does not store the stream."
      fr: "La capture et le stockage d'enregistrements en temps réel pour plusieurs applications consommatrices se font avec Amazon Kinesis Data Streams ; AWS Glue peut traiter des données en streaming, mais ne stocke pas le flux."
references:
  - title: What is AWS Glue?
    url: https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html
