id: clfc02-3b-ec2-compute-optimized
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A game studio runs dedicated multiplayer game servers and batch processing jobs. Both workloads are limited by processor speed and need high-performance processors more than extra memory or storage.

    Which Amazon EC2 instance category is the BEST fit?
  fr: |
    Un studio de jeux vidéo exécute des serveurs de jeux multijoueurs dédiés et des tâches de traitement par lots. Les deux charges de travail sont limitées par la vitesse du processeur et ont davantage besoin de processeurs hautes performances que de mémoire ou de stockage supplémentaires.

    Quelle catégorie d'instances Amazon EC2 est la PLUS adaptée ?
body:
  options:
    - { id: a, text: { en: "Memory optimized", fr: "Optimisée pour la mémoire" } }
    - { id: b, text: { en: "Compute optimized", fr: "Optimisée pour le calcul" } }
    - { id: c, text: { en: "Storage optimized", fr: "Optimisée pour le stockage" } }
    - { id: d, text: { en: "General purpose", fr: "Usage général" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Compute optimized instances, such as the C families, are designed for compute-bound applications that benefit from high-performance processors. They are ideal for batch processing, media transcoding, high-performance web servers, scientific modeling, and dedicated gaming servers."
    fr: "Les instances optimisées pour le calcul, comme les familles C, sont conçues pour les applications limitées par le calcul qui tirent parti de processeurs hautes performances. Les usages typiques sont le traitement par lots, le transcodage multimédia, les serveurs web hautes performances, la modélisation scientifique et les serveurs de jeux dédiés."
  options:
    a:
      en: "Memory optimized instances target workloads that process large data sets in memory, which is not the constraint described."
      fr: "Les instances optimisées pour la mémoire visent les charges de travail qui traitent de grands jeux de données en mémoire, ce qui n'est pas la contrainte décrite."
    c:
      en: "Storage optimized instances target high sequential read and write access to large data sets on local storage, not processor-bound work."
      fr: "Les instances optimisées pour le stockage visent les accès séquentiels intensifs en lecture et en écriture à de grands jeux de données sur stockage local, pas un travail limité par le processeur."
    d:
      en: "General purpose instances balance compute, memory, and networking; a compute-bound workload gets better performance per cost from compute optimized instances."
      fr: "Les instances à usage général équilibrent calcul, mémoire et réseau ; une charge de travail limitée par le calcul obtient un meilleur rapport performances/coût avec des instances optimisées pour le calcul."
references:
  - title: Specifications for Amazon EC2 compute optimized instances
    url: https://docs.aws.amazon.com/ec2/latest/instancetypes/co.html
