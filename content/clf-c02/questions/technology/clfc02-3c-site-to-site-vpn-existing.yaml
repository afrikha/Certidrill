id: clfc02-3c-site-to-site-vpn-existing
objective: "3.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to connect its on-premises network to a VPC this week. It wants to reuse its existing internet connection and VPN equipment, and traffic between the two networks must be encrypted.

    Which solution will meet these requirements?
  fr: |
    Une entreprise souhaite relier son réseau sur site à un VPC cette semaine. Elle veut réutiliser sa connexion Internet et son équipement VPN existants, et le trafic entre les deux réseaux doit être chiffré.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Order an AWS Direct Connect dedicated connection.", fr: "Commander une connexion dédiée AWS Direct Connect." }
    - id: b
      text: { en: "Create a VPC peering connection to the on-premises network.", fr: "Créer une connexion d'appairage de VPC vers le réseau sur site." }
    - id: c
      text: { en: "Deploy an AWS Client VPN endpoint for each server.", fr: "Déployer un point de terminaison AWS Client VPN pour chaque serveur." }
    - id: d
      text: { en: "Create an AWS Site-to-Site VPN connection.", fr: "Créer une connexion AWS Site-to-Site VPN." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS Site-to-Site VPN connects an on-premises network to a VPC through IPsec tunnels over the internet. It reuses the existing internet connection and VPN equipment as the customer gateway device, and each connection includes two tunnels for high availability.
    fr: |-
      AWS Site-to-Site VPN relie un réseau sur site à un VPC par des tunnels IPsec via Internet. Il réutilise la connexion Internet existante et l'équipement VPN comme périphérique de passerelle client, et chaque connexion comprend deux tunnels pour la haute disponibilité.
  options:
    a:
      en: |-
        Direct Connect may require new circuits and telecom relationships, which does not fit a connection this week over the existing internet link.
      fr: |-
        Direct Connect peut nécessiter de nouveaux circuits et des relations avec des opérateurs télécoms, ce qui ne convient pas à une connexion cette semaine via la liaison Internet existante.
    b:
      en: |-
        VPC peering connects two VPCs; it cannot connect to an on-premises network.
      fr: |-
        L'appairage de VPC relie deux VPC ; il ne peut pas se connecter à un réseau sur site.
    c:
      en: |-
        Client VPN is for individual user devices; it does not connect a whole network through the existing VPN equipment.
      fr: |-
        Client VPN est destiné aux appareils d'utilisateurs individuels ; il ne relie pas un réseau entier via l'équipement VPN existant.
references:
  - title: "What is AWS Site-to-Site VPN? - AWS Site-to-Site VPN"
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html
  - title: "Network-to-Amazon VPC connectivity options - Amazon Virtual Private Cloud Connectivity Options"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-vpc-connectivity-options/network-to-amazon-vpc-connectivity-options.html
