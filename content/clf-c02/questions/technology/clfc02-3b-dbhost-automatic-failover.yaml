id: clfc02-3b-dbhost-automatic-failover
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company needs a MySQL database that fails over automatically to a standby copy in another Availability Zone if the primary fails. The company wants the solution that requires the LEAST administrative effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a besoin d'une base de données MySQL qui bascule automatiquement vers une copie de secours dans une autre zone de disponibilité si la base principale tombe en panne. L'entreprise veut la solution qui exige le MOINS d'effort d'administration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Install MySQL on two EC2 instances and write scripts to replicate and fail over.", fr: "Installer MySQL sur deux instances EC2 et écrire des scripts de réplication et de basculement." } }
    - { id: b, text: { en: "Install MySQL on one EC2 instance and take hourly EBS snapshots.", fr: "Installer MySQL sur une instance EC2 et prendre des instantanés EBS toutes les heures." } }
    - { id: c, text: { en: "Use Amazon RDS for MySQL with a Multi-AZ deployment.", fr: "Utiliser Amazon RDS for MySQL avec un déploiement Multi-AZ." } }
    - { id: d, text: { en: "Use Amazon RDS for MySQL in a Single-AZ deployment with automated backups.", fr: "Utiliser Amazon RDS for MySQL dans un déploiement Single-AZ avec des sauvegardes automatisées." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In a Multi-AZ DB instance deployment, Amazon RDS keeps a synchronous standby replica in a different Availability Zone and fails over to it automatically if the primary fails. AWS manages the replication and the failover, so the company has nothing to build."
    fr: "Dans un déploiement d'instance de base de données Multi-AZ, Amazon RDS maintient un réplica de secours synchrone dans une autre zone de disponibilité et bascule automatiquement vers lui si l'instance principale tombe en panne. AWS gère la réplication et le basculement : l'entreprise n'a rien à construire."
  options:
    a:
      en: "Self-managed replication and failover scripts on EC2 can work, but the company must build, test, and maintain them: much more administrative effort."
      fr: "Une réplication et des scripts de basculement autogérés sur EC2 peuvent fonctionner, mais l'entreprise doit les construire, les tester et les maintenir : beaucoup plus d'effort d'administration."
    b:
      en: "Snapshots allow a restore, but there is no standby and no automatic failover."
      fr: "Les instantanés permettent une restauration, mais il n'y a ni copie de secours ni basculement automatique."
    d:
      en: "A Single-AZ deployment has no standby; automated backups allow a restore but not an automatic failover."
      fr: "Un déploiement Single-AZ n'a pas de copie de secours ; les sauvegardes automatisées permettent une restauration mais pas un basculement automatique."
references:
  - title: Multi-AZ DB instance deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
