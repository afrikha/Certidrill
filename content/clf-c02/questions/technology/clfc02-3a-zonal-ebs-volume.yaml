id: clfc02-3a-zonal-ebs-volume
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is creating AWS resources. For which resource must the company choose a specific Availability Zone?
  fr: |
    Une entreprise crée des ressources AWS. Pour quelle ressource doit-elle choisir une zone de disponibilité précise ?
body:
  options:
    - { id: a, text: { en: "An Amazon S3 bucket", fr: "Un compartiment Amazon S3" } }
    - { id: b, text: { en: "An Amazon VPC", fr: "Un Amazon VPC" } }
    - { id: c, text: { en: "An IAM role", fr: "Un rôle IAM" } }
    - { id: d, text: { en: "An Amazon EBS volume", fr: "Un volume Amazon EBS" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An EBS volume is a zonal resource: it is created in one Availability Zone and can be attached only to instances in that same zone. A zonal resource is specific to the Availability Zone in which it is created.
    fr: |
      Un volume EBS est une ressource zonale : il est créé dans une zone de disponibilité et ne peut être attaché qu'à des instances de cette même zone. Une ressource zonale est propre à la zone de disponibilité dans laquelle elle est créée.
  options:
    a: { en: "An S3 bucket is created in a Region, and S3 manages where the data is stored inside that Region.", fr: "Un compartiment S3 est créé dans une Région, et S3 gère l'emplacement des données à l'intérieur de cette Région." }
    b: { en: "A VPC is created in a Region and can have subnets in its Availability Zones; the subnets are the zonal part.", fr: "Un VPC est créé dans une Région et peut avoir des sous-réseaux dans ses zones de disponibilité ; ce sont les sous-réseaux qui sont zonaux." }
    c: { en: "IAM is a global service, so an IAM role is not tied to a Region or an Availability Zone.", fr: "IAM est un service global : un rôle IAM n'est lié ni à une Région ni à une zone de disponibilité." }
references:
  - title: AWS Regions and Availability Zones
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html
  - title: Amazon EBS volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes.html
