id: clfc02-3c-nosql-services
objective: "3.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is reviewing AWS database services for a new workload that does not need a relational schema or SQL joins.

    Which AWS services are NoSQL databases? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise étudie les services de bases de données AWS pour une nouvelle charge de travail qui n'a besoin ni d'un schéma relationnel ni de jointures SQL.

    Quels services AWS sont des bases de données NoSQL ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Amazon Aurora", fr: "Amazon Aurora" }
    - id: b
      text: { en: "Amazon DynamoDB", fr: "Amazon DynamoDB" }
    - id: c
      text: { en: "Amazon RDS for MySQL", fr: "Amazon RDS for MySQL" }
    - id: d
      text: { en: "Amazon Neptune", fr: "Amazon Neptune" }
    - id: e
      text: { en: "Amazon Redshift", fr: "Amazon Redshift" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Amazon DynamoDB is a NoSQL database with key-value and document data models, and Amazon Neptune is a NoSQL graph database for highly connected datasets. Neither uses relational tables joined with SQL.
    fr: |-
      Amazon DynamoDB est une base de données NoSQL aux modèles clé-valeur et document, et Amazon Neptune est une base de données NoSQL orientée graphe pour des jeux de données fortement connectés. Aucune des deux n'utilise de tables relationnelles jointes en SQL.
  options:
    a:
      en: |-
        Aurora is a relational database engine compatible with MySQL and PostgreSQL.
      fr: |-
        Aurora est un moteur de base de données relationnelle compatible avec MySQL et PostgreSQL.
    c:
      en: |-
        RDS for MySQL is a managed relational database.
      fr: |-
        RDS for MySQL est une base de données relationnelle gérée.
    e:
      en: |-
        Redshift is a relational data warehouse queried with SQL for analytics.
      fr: |-
        Redshift est un entrepôt de données relationnel interrogé en SQL à des fins d'analyse.
references:
  - title: "What is Amazon DynamoDB? - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
  - title: "What Is Amazon Neptune? - Amazon Neptune"
    url: https://docs.aws.amazon.com/neptune/latest/userguide/intro.html
