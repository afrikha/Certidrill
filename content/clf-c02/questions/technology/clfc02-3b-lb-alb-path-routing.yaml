id: clfc02-3b-lb-alb-path-routing
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company hosts a website in which requests for /api must go to one group of Amazon EC2 instances and requests for /images must go to another group. The company wants one load balancer to route the HTTP requests based on the URL path.

    Which type of load balancer should the company use?
  fr: |
    Une entreprise héberge un site web dans lequel les requêtes vers /api doivent aller à un groupe d'instances Amazon EC2 et les requêtes vers /images à un autre groupe. L'entreprise veut qu'un seul équilibreur de charge achemine les requêtes HTTP en fonction du chemin de l'URL.

    Quel type d'équilibreur de charge l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Network Load Balancer" }
    - { id: b, text: "Application Load Balancer" }
    - { id: c, text: "Gateway Load Balancer" }
    - { id: d, text: { en: "Amazon Route 53 weighted routing", fr: "Routage pondéré Amazon Route 53" } }
answer: { optionId: b }
explanation:
  correct:
    en: "An Application Load Balancer works at the application layer (layer 7) and evaluates the content of HTTP and HTTPS requests. Listener rules can forward requests to different target groups based on conditions such as the URL path or the host header."
    fr: "Un Application Load Balancer fonctionne au niveau de la couche application (couche 7) et examine le contenu des requêtes HTTP et HTTPS. Des règles d'écouteur peuvent transférer les requêtes vers des groupes cibles différents selon des conditions comme le chemin de l'URL ou l'en-tête d'hôte."
  options:
    a:
      en: "A Network Load Balancer works at the transport layer (layer 4) with TCP, UDP, and TLS connections; it does not route by URL path."
      fr: "Un Network Load Balancer fonctionne au niveau de la couche transport (couche 4) avec des connexions TCP, UDP et TLS ; il n'achemine pas selon le chemin de l'URL."
    c:
      en: "A Gateway Load Balancer distributes traffic to third-party virtual appliances such as firewalls; it does not route HTTP requests by path."
      fr: "Un Gateway Load Balancer répartit le trafic vers des appliances virtuelles tierces comme des pare-feux ; il n'achemine pas les requêtes HTTP selon leur chemin."
    d:
      en: "Route 53 answers DNS queries for a domain name; DNS never sees the URL path of a request, and Route 53 is not a load balancer."
      fr: "Route 53 répond aux requêtes DNS pour un nom de domaine ; le DNS ne voit jamais le chemin de l'URL d'une requête, et Route 53 n'est pas un équilibreur de charge."
references:
  - title: What is an Application Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
