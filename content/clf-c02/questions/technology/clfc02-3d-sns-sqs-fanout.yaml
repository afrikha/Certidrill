id: clfc02-3d-sns-sqs-fanout
objective: "3.8.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company publishes an event each time a customer places an order. Three separate applications (billing, shipping, and analytics) must each receive every order event and process it at their own pace. No events may be lost if one application is offline for several hours.

    Which solution meets these requirements?
  fr: |
    Une entreprise publie un événement chaque fois qu'un client passe une commande. Trois applications distinctes (facturation, expédition et analytique) doivent chacune recevoir chaque événement de commande et le traiter à leur propre rythme. Aucun événement ne doit être perdu si une application est hors ligne pendant plusieurs heures.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send the events to one Amazon SQS queue that all three applications poll.", fr: "Envoyer les événements à une seule file Amazon SQS qu'interrogent les trois applications." } }
    - { id: b, text: { en: "Publish the events to an Amazon SNS topic that delivers them directly to an HTTPS endpoint of each application.", fr: "Publier les événements dans une rubrique Amazon SNS qui les livre directement à un point de terminaison HTTPS de chaque application." } }
    - { id: c, text: { en: "Publish the events to an Amazon SNS topic with three subscribed Amazon SQS queues, one for each application.", fr: "Publier les événements dans une rubrique Amazon SNS à laquelle sont abonnées trois files Amazon SQS, une par application." } }
    - { id: d, text: { en: "Use an AWS Step Functions workflow that calls the three applications one after the other.", fr: "Utiliser un flux de travail AWS Step Functions qui appelle les trois applications l'une après l'autre." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In the fanout pattern, a message published to an SNS topic is copied to every SQS queue subscribed to it. Each application has its own queue, so it receives every event, and the queue keeps the messages until the application comes back online and processes them."
    fr: "Dans le modèle de diffusion (fanout), un message publié dans une rubrique SNS est copié dans chaque file SQS abonnée. Chaque application a sa propre file ; elle reçoit donc chaque événement, et la file conserve les messages jusqu'à ce que l'application revienne en ligne et les traite."
  options:
    a:
      en: "With a single queue, each message is processed by only one consumer, so each application would see only some of the events."
      fr: "Avec une seule file, chaque message n'est traité que par un consommateur ; chaque application ne verrait donc qu'une partie des événements."
    b:
      en: "SNS pushes messages to HTTPS endpoints and only retries for a limited time; it does not store messages for hours until an offline application can process them."
      fr: "SNS pousse les messages vers des points de terminaison HTTPS et ne réessaie que pendant une durée limitée ; il ne stocke pas les messages pendant des heures jusqu'à ce qu'une application hors ligne puisse les traiter."
    d:
      en: "A workflow that calls the applications one after the other couples them: if one application is offline, the calls fail instead of waiting in a queue."
      fr: "Un flux de travail qui appelle les applications l'une après l'autre les couple : si une application est hors ligne, les appels échouent au lieu d'attendre dans une file."
references:
  - title: Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
