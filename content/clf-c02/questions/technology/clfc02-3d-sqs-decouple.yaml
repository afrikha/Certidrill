id: clfc02-3d-sqs-decouple
objective: "3.8.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's web tier sends orders directly to an order-processing tier. During traffic peaks, the processing tier cannot keep up and orders are lost. The company wants to decouple the tiers so that orders are stored until a processing instance retrieves them.

    Which AWS service should the company use?
  fr: |
    Le niveau web d'une entreprise envoie les commandes directement à un niveau de traitement des commandes. Pendant les pics de trafic, le niveau de traitement n'arrive pas à suivre et des commandes sont perdues. L'entreprise veut découpler les niveaux afin que les commandes soient stockées jusqu'à ce qu'une instance de traitement les récupère.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon Simple Notification Service (Amazon SNS)" }
    - { id: b, text: "Amazon Simple Email Service (Amazon SES)" }
    - { id: c, text: "Amazon Simple Queue Service (Amazon SQS)" }
    - { id: d, text: "AWS Step Functions" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon SQS is a fully managed message queuing service that decouples application components. Producers send messages to a queue, the queue stores them durably, and consumers poll and process them at their own pace, so traffic peaks no longer cause lost orders."
    fr: "Amazon SQS est un service de file d'attente de messages entièrement géré qui découple les composants d'une application. Les producteurs envoient des messages à une file, la file les stocke durablement, et les consommateurs les interrogent et les traitent à leur propre rythme ; les pics de trafic ne font donc plus perdre de commandes."
  options:
    a:
      en: "Amazon SNS pushes each message to its subscribers when it is published; it does not keep messages in a queue until a consumer retrieves them."
      fr: "Amazon SNS pousse chaque message vers ses abonnés lors de sa publication ; il ne conserve pas les messages dans une file jusqu'à ce qu'un consommateur les récupère."
    b:
      en: "Amazon SES sends and receives email; it is not a message queue between application tiers."
      fr: "Amazon SES envoie et reçoit des e-mails ; ce n'est pas une file de messages entre niveaux d'application."
    d:
      en: "AWS Step Functions orchestrates the steps of a workflow; it is not a buffer that stores orders until a processing instance polls them."
      fr: "AWS Step Functions orchestre les étapes d'un flux de travail ; ce n'est pas une mémoire tampon qui stocke les commandes jusqu'à ce qu'une instance de traitement les interroge."
references:
  - title: What is Amazon Simple Queue Service?
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html
