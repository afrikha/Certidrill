id: clfc02-3d-sgw-tape-archive
objective: "3.6.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company backs up its data center to a physical tape library. It wants to stop buying, storing, and maintaining physical tapes, and to archive its backup data in S3 Glacier Deep Archive.

    Which AWS Storage Gateway type should the company use?
  fr: |
    Une entreprise sauvegarde son centre de données sur une bibliothèque de bandes physique. Elle veut cesser d'acheter, de stocker et d'entretenir des bandes physiques, et archiver ses données de sauvegarde dans S3 Glacier Deep Archive.

    Quel type d'AWS Storage Gateway l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon S3 File Gateway" }
    - { id: b, text: { en: "Volume Gateway with stored volumes", fr: "Volume Gateway avec des volumes stockés" } }
    - { id: c, text: "Tape Gateway" }
    - { id: d, text: "Amazon FSx File Gateway" }
answer: { optionId: c }
explanation:
  correct:
    en: "Tape Gateway provides cloud-backed virtual tape storage, which removes the burden of provisioning, scaling, and maintaining a physical tape infrastructure. Archived virtual tapes are kept in S3 Glacier Flexible Retrieval or S3 Glacier Deep Archive."
    fr: "Tape Gateway fournit un stockage sur bandes virtuelles adossé au cloud, ce qui supprime la charge de provisionner, mettre à l'échelle et entretenir une infrastructure de bandes physiques. Les bandes virtuelles archivées sont conservées dans S3 Glacier Flexible Retrieval ou S3 Glacier Deep Archive."
  options:
    a:
      en: "S3 File Gateway provides NFS and SMB file shares backed by S3 objects; it does not emulate a tape library for backup software."
      fr: "S3 File Gateway fournit des partages de fichiers NFS et SMB adossés à des objets S3 ; il n'émule pas une bibliothèque de bandes pour les logiciels de sauvegarde."
    b:
      en: "Stored volumes keep the whole dataset on premises as iSCSI volumes and back up snapshots to Amazon S3; they do not replace a tape library."
      fr: "Les volumes stockés conservent tout le jeu de données sur site sous forme de volumes iSCSI et sauvegardent des instantanés dans Amazon S3 ; ils ne remplacent pas une bibliothèque de bandes."
    d:
      en: "FSx File Gateway gives on-premises access to FSx for Windows File Server shares, and it is no longer available to new customers."
      fr: "FSx File Gateway donne un accès sur site à des partages FSx for Windows File Server, et il n'est plus disponible pour les nouveaux clients."
references:
  - title: What is Tape Gateway? - AWS Storage Gateway
    url: https://docs.aws.amazon.com/storagegateway/latest/tgw/WhatIsStorageGateway.html
