id: clfc02-3d-s3-intelligent-tiering
objective: "3.6.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores data lake objects in S3 Standard. Access patterns are unpredictable: some old objects are not read for months and then suddenly become popular again. The company wants to reduce storage costs automatically, with no retrieval fees and without analyzing access patterns.

    Which solution meets these requirements?
  fr: |
    Une entreprise stocke les objets d'un lac de données dans S3 Standard. Les modèles d'accès sont imprévisibles : certains objets anciens ne sont pas lus pendant des mois, puis redeviennent soudain très demandés. L'entreprise veut réduire automatiquement ses coûts de stockage, sans frais de récupération et sans analyser les modèles d'accès.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the objects in the S3 Intelligent-Tiering storage class.", fr: "Stocker les objets dans la classe de stockage S3 Intelligent-Tiering." } }
    - { id: b, text: { en: "Create an S3 Lifecycle rule that moves objects to S3 Standard-IA 30 days after creation.", fr: "Créer une règle S3 Lifecycle qui déplace les objets vers S3 Standard-IA 30 jours après leur création." } }
    - { id: c, text: { en: "Create an S3 Lifecycle rule that moves objects to S3 Glacier Deep Archive 90 days after creation.", fr: "Créer une règle S3 Lifecycle qui déplace les objets vers S3 Glacier Deep Archive 90 jours après leur création." } }
    - { id: d, text: { en: "Create an S3 Lifecycle rule that moves objects to S3 One Zone-IA 30 days after creation.", fr: "Créer une règle S3 Lifecycle qui déplace les objets vers S3 One Zone-IA 30 jours après leur création." } }
answer: { optionId: a }
explanation:
  correct:
    en: "S3 Intelligent-Tiering is designed for data with unknown, changing, or unpredictable access patterns. It monitors access, moves objects that are not accessed to lower-cost tiers, and moves them back to the Frequent Access tier when they are read, with a small monitoring charge and no retrieval charges."
    fr: "S3 Intelligent-Tiering est conçu pour des données aux modèles d'accès inconnus, changeants ou imprévisibles. Il surveille les accès, déplace les objets non consultés vers des niveaux moins chers et les ramène au niveau Frequent Access lorsqu'ils sont lus, moyennant de faibles frais de surveillance et sans frais de récupération."
  options:
    b:
      en: "A lifecycle rule moves objects on a fixed schedule whatever their actual use, and S3 Standard-IA charges a retrieval fee each time an object is read."
      fr: "Une règle de cycle de vie déplace les objets selon un calendrier fixe, quel que soit leur usage réel, et S3 Standard-IA facture des frais de récupération à chaque lecture d'un objet."
    c:
      en: "Objects in S3 Glacier Deep Archive must be restored before they can be read, and retrievals are charged, so objects that become popular again are not readily available."
      fr: "Les objets de S3 Glacier Deep Archive doivent être restaurés avant d'être lus, et les récupérations sont facturées ; les objets qui redeviennent demandés ne sont donc pas immédiatement disponibles."
    d:
      en: "S3 One Zone-IA also charges retrieval fees, stores data in a single Availability Zone, and is applied on a fixed schedule rather than on actual access."
      fr: "S3 One Zone-IA facture aussi des frais de récupération, stocke les données dans une seule zone de disponibilité et s'applique selon un calendrier fixe plutôt que selon les accès réels."
references:
  - title: Managing storage costs with Amazon S3 Intelligent-Tiering
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intelligent-tiering.html
  - title: Managing the lifecycle of objects
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html
