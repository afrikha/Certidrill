id: clfc02-3d-quick-dashboards
objective: "3.7.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's business users want to connect to the company's data sources, build interactive dashboards and visualizations, and embed some of these dashboards in an internal web application.

    Which AWS service should the company use?
  fr: |
    Les utilisateurs métier d'une entreprise veulent se connecter aux sources de données de l'entreprise, créer des tableaux de bord et des visualisations interactifs, et intégrer certains de ces tableaux de bord dans une application web interne.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "AWS Glue" }
    - { id: b, text: "Amazon Kinesis Data Streams" }
    - { id: c, text: "Amazon Athena" }
    - { id: d, text: "Amazon Quick" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Quick, which evolved from Amazon QuickSight, includes Quick Sight for interactive data visualization and business intelligence: users connect to data sources, build dashboards, and embed analytics in applications. The AWS documentation now titles the service AWS Quick."
    fr: "Amazon Quick, issu d'Amazon QuickSight, inclut Quick Sight pour la visualisation interactive des données et la business intelligence : les utilisateurs se connectent à des sources de données, créent des tableaux de bord et intègrent des analyses dans des applications. La documentation AWS intitule désormais le service AWS Quick."
  options:
    a:
      en: "AWS Glue discovers, catalogs, and transforms data with crawlers and ETL jobs; it does not build dashboards."
      fr: "AWS Glue découvre, catalogue et transforme des données avec des robots d'analyse et des tâches ETL ; il ne crée pas de tableaux de bord."
    b:
      en: "Kinesis Data Streams ingests real-time streaming data; it does not provide visualizations for business users."
      fr: "Kinesis Data Streams ingère des données en streaming en temps réel ; il ne fournit pas de visualisations pour les utilisateurs métier."
    c:
      en: "Amazon Athena runs SQL queries on data in Amazon S3 and returns results; it is not a dashboard and visualization service."
      fr: "Amazon Athena exécute des requêtes SQL sur des données d'Amazon S3 et renvoie des résultats ; ce n'est pas un service de tableaux de bord et de visualisation."
references:
  - title: What is AWS Quick?
    url: https://docs.aws.amazon.com/quick/latest/userguide/what-is.html
