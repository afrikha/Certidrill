id: clfc02-3e-marketplace-third-party-app
objective: "3.8.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to find, buy and deploy a third-party customer relationship management (CRM) application that runs on AWS. The charges must appear on the company's AWS bill.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise souhaite trouver, acheter et déployer une application tierce de gestion de la relation client (CRM) qui s'exécute sur AWS. Les frais doivent apparaître sur la facture AWS de l'entreprise.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "AWS Artifact", fr: "AWS Artifact" } }
    - { id: b, text: { en: "AWS License Manager", fr: "AWS License Manager" } }
    - { id: c, text: { en: "AWS Service Catalog", fr: "AWS Service Catalog" } }
    - { id: d, text: { en: "AWS Marketplace", fr: "AWS Marketplace" } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Marketplace is a curated digital catalog in which customers find, buy, deploy and manage third-party software, data and services that run on AWS. AWS handles billing and payments, so the charges appear on the customer's AWS bill."
    fr: "AWS Marketplace est un catalogue numérique organisé dans lequel les clients trouvent, achètent, déploient et gèrent des logiciels, données et services tiers qui s'exécutent sur AWS. AWS gère la facturation et les paiements : les frais apparaissent sur la facture AWS du client."
  options:
    a:
      en: "AWS Artifact provides AWS compliance reports and agreements; it does not sell third-party software."
      fr: "AWS Artifact fournit les rapports et accords de conformité d'AWS ; il ne vend pas de logiciels tiers."
    b:
      en: "License Manager tracks software licenses that the company already owns; it is not a store for buying applications."
      fr: "License Manager suit les licences logicielles que l'entreprise possède déjà ; ce n'est pas une boutique pour acheter des applications."
    c:
      en: "Service Catalog lets administrators publish a catalog of products approved for internal use; it is not where third-party software is bought."
      fr: "Service Catalog permet aux administrateurs de publier un catalogue de produits approuvés pour un usage interne ; ce n'est pas là qu'on achète des logiciels tiers."
references:
  - title: What is AWS Marketplace?
    url: https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html
