id: clfc02-3e-iot-core-protocols
objective: "3.8.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is designing sensors that will send data to AWS IoT Core.

    Which protocols can the sensors use to publish messages to AWS IoT Core? (Choose two.)
  fr: |
    Une entreprise conçoit des capteurs qui enverront des données à AWS IoT Core.

    Quels protocoles les capteurs peuvent-ils utiliser pour publier des messages dans AWS IoT Core ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "SMTP", fr: "SMTP" } }
    - { id: b, text: { en: "MQTT", fr: "MQTT" } }
    - { id: c, text: { en: "FTP", fr: "FTP" } }
    - { id: d, text: { en: "RDP", fr: "RDP" } }
    - { id: e, text: { en: "HTTPS", fr: "HTTPS" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "AWS IoT Core supports MQTT, MQTT over WebSocket Secure (WSS), HTTPS and LoRaWAN. The message broker accepts publish and subscribe from MQTT clients, and HTTPS clients can publish messages."
    fr: "AWS IoT Core prend en charge MQTT, MQTT sur WebSocket sécurisé (WSS), HTTPS et LoRaWAN. L'agent de messages accepte les publications et abonnements des clients MQTT, et les clients HTTPS peuvent publier des messages."
  options:
    a:
      en: "SMTP is an email transfer protocol; AWS IoT Core does not accept device messages over SMTP."
      fr: "SMTP est un protocole de transfert d'e-mails ; AWS IoT Core n'accepte pas de messages d'appareils via SMTP."
    c:
      en: "FTP is a file transfer protocol and is not one of the protocols supported by AWS IoT Core."
      fr: "FTP est un protocole de transfert de fichiers et ne fait pas partie des protocoles pris en charge par AWS IoT Core."
    d:
      en: "RDP is a remote desktop protocol, not a device messaging protocol supported by AWS IoT Core."
      fr: "RDP est un protocole de bureau à distance, pas un protocole de messagerie d'appareils pris en charge par AWS IoT Core."
references:
  - title: What is AWS IoT?
    url: https://docs.aws.amazon.com/iot/latest/developerguide/what-is-aws-iot.html
