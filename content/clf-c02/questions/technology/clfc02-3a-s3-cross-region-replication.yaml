id: clfc02-3a-s3-cross-region-replication
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores important files in an Amazon S3 bucket in one AWS Region. For disaster recovery, every new object must be copied automatically to a bucket in a second Region.

    Which S3 feature will meet this requirement?
  fr: |
    Une entreprise stocke des fichiers importants dans un compartiment Amazon S3 d'une Région AWS. Pour la reprise après sinistre, chaque nouvel objet doit être copié automatiquement dans un compartiment d'une deuxième Région.

    Quelle fonctionnalité S3 répond à ce besoin ?
body:
  options:
    - { id: a, text: "S3 Transfer Acceleration" }
    - { id: b, text: "S3 Lifecycle" }
    - { id: c, text: "S3 Cross-Region Replication (CRR)" }
    - { id: d, text: "S3 Versioning" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      S3 Replication copies objects automatically and asynchronously from a source bucket to a destination bucket. With Cross-Region Replication, the destination bucket is in a different Region, which keeps a copy of the data available if the first Region has a problem.
    fr: |
      La réplication S3 copie automatiquement et de façon asynchrone les objets d'un compartiment source vers un compartiment de destination. Avec la réplication entre Régions (CRR), le compartiment de destination se trouve dans une autre Région, ce qui garde une copie des données disponible si la première Région rencontre un problème.
  options:
    a: { en: "Transfer Acceleration speeds up uploads from distant clients to one bucket; it does not copy objects to another Region.", fr: "Transfer Acceleration accélère les chargements de clients éloignés vers un compartiment ; il ne copie pas les objets dans une autre Région." }
    b: { en: "S3 Lifecycle moves objects between storage classes or expires them; it does not copy them to another bucket.", fr: "S3 Lifecycle déplace les objets entre classes de stockage ou les fait expirer ; il ne les copie pas dans un autre compartiment." }
    d: { en: "Versioning keeps several versions of an object in the same bucket; it is a prerequisite for replication but does not copy data to another Region by itself.", fr: "La gestion des versions conserve plusieurs versions d'un objet dans le même compartiment ; c'est un prérequis de la réplication, mais elle ne copie pas à elle seule les données dans une autre Région." }
references:
  - title: Replicating objects within and across Regions
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html
