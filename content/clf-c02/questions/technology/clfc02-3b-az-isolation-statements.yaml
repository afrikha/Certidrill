id: clfc02-3b-az-isolation-statements
objective: "3.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which statements describe how AWS keeps the Availability Zones of a Region from failing together? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles affirmations décrivent la façon dont AWS évite que les zones de disponibilité d'une Région tombent en panne ensemble ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "AWS deploys software updates to the Availability Zones of a Region at different times.", fr: "AWS déploie les mises à jour logicielles dans les zones de disponibilité d'une Région à des moments différents." } }
    - { id: b, text: { en: "All Availability Zones of a Region use one shared network link to the internet.", fr: "Toutes les zones de disponibilité d'une Région utilisent une seule liaison réseau partagée vers Internet." } }
    - { id: c, text: { en: "Availability Zones of a Region communicate with each other only over the public internet.", fr: "Les zones de disponibilité d'une Région communiquent entre elles uniquement via l'Internet public." } }
    - { id: d, text: { en: "Generators and cooling equipment are not shared between Availability Zones.", fr: "Les groupes électrogènes et les équipements de refroidissement ne sont pas partagés entre les zones de disponibilité." } }
    - { id: e, text: { en: "Each Availability Zone is placed in a different AWS Region.", fr: "Chaque zone de disponibilité est placée dans une Région AWS différente." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Availability Zones avoid shared physical points of failure: generators and cooling are not shared, and zones are supplied by different power substations. AWS also separates the deployment of updates to the zones of a Region in time, so a faulty change cannot affect all zones at once."
    fr: "Les zones de disponibilité évitent les points de défaillance physiques partagés : les groupes électrogènes et le refroidissement ne sont pas partagés, et les zones sont alimentées par des postes électriques différents. AWS échelonne aussi dans le temps le déploiement des mises à jour dans les zones d'une Région, pour qu'une modification défectueuse ne touche pas toutes les zones en même temps."
  options:
    b:
      en: "Each Availability Zone has redundant connectivity, with its own connections to transit centers; there is no single shared internet link."
      fr: "Chaque zone de disponibilité dispose d'une connectivité redondante, avec ses propres connexions vers des centres de transit ; il n'y a pas de liaison Internet unique partagée."
    c:
      en: "The Availability Zones of a Region are interconnected by high-bandwidth, low-latency networking over redundant, dedicated metro fiber, not through the public internet."
      fr: "Les zones de disponibilité d'une Région sont interconnectées par un réseau à bande passante élevée et à faible latence, sur de la fibre métropolitaine dédiée et redondante, et non via l'Internet public."
    e:
      en: "A Region contains several Availability Zones; an Availability Zone is never placed in another Region."
      fr: "Une Région contient plusieurs zones de disponibilité ; une zone de disponibilité n'est jamais placée dans une autre Région."
references:
  - title: Availability Zones
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/availability-zones.html
