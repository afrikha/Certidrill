id: clfc02-3a-stacksets-new-accounts
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations. The same security baseline, defined in an AWS CloudFormation template, must be deployed in every account of the organization and in three Regions. Accounts that are added to the organization later must receive the baseline automatically.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations. La même base de sécurité, définie dans un modèle AWS CloudFormation, doit être déployée dans chaque compte de l'organisation et dans trois Régions. Les comptes ajoutés plus tard à l'organisation doivent recevoir cette base automatiquement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CloudFormation stack from the template in the management account in each of the three Regions.", fr: "Créer une pile CloudFormation à partir du modèle dans le compte de gestion, dans chacune des trois Régions." } }
    - { id: b, text: { en: "Ask each account owner to create a stack from the template in the console when the account is created.", fr: "Demander au propriétaire de chaque compte de créer une pile à partir du modèle dans la console lors de la création du compte." } }
    - { id: c, text: { en: "Run an AWS CLI script against each existing account and Region once to create a stack from the template.", fr: "Exécuter une fois un script AWS CLI sur chaque compte et chaque Région existants pour créer une pile à partir du modèle." } }
    - { id: d, text: { en: "Create a CloudFormation StackSet with service-managed permissions that targets the organization, with automatic deployment turned on.", fr: "Créer un StackSet CloudFormation avec des autorisations gérées par le service qui cible l'organisation, avec le déploiement automatique activé." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      StackSets create, update, or delete stacks across multiple accounts and Regions with a single operation. With service-managed permissions and automatic deployment, StackSets also deploy the stack to accounts that are added to the target organization or organizational unit later.
    fr: |
      StackSets crée, met à jour ou supprime des piles dans plusieurs comptes et Régions en une seule opération. Avec des autorisations gérées par le service et le déploiement automatique, StackSets déploie aussi la pile dans les comptes ajoutés plus tard à l'organisation ou à l'unité d'organisation ciblée.
  options:
    a: { en: "A stack is created in a single account; stacks in the management account do not deploy the baseline to the other accounts.", fr: "Une pile est créée dans un seul compte ; des piles dans le compte de gestion ne déploient pas la base dans les autres comptes." }
    b: { en: "Relying on each account owner is a manual, one-time step that can be forgotten, so new accounts are not covered automatically.", fr: "S'en remettre au propriétaire de chaque compte est une étape manuelle et ponctuelle qui peut être oubliée : les nouveaux comptes ne sont pas couverts automatiquement." }
    c: { en: "A script that runs once covers only the accounts that exist at that time; accounts added later are not covered.", fr: "Un script exécuté une fois ne couvre que les comptes existant à ce moment-là ; les comptes ajoutés plus tard ne sont pas couverts." }
references:
  - title: Managing stacks across accounts and Regions with StackSets
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/what-is-cfnstacksets.html
  - title: Enable or disable automatic deployments for StackSets in AWS Organizations
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-manage-auto-deployment.html
