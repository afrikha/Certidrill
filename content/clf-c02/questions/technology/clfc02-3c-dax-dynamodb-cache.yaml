id: clfc02-3c-dax-dynamodb-cache
objective: "3.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail application reads product data from Amazon DynamoDB tables and now needs microsecond read latency during sales events. The company wants a fully managed in-memory cache built for DynamoDB that handles cache invalidation and data population, so developers do not write their own caching logic.

    Which solution will meet these requirements?
  fr: |
    Une application de commerce lit des données de produits dans des tables Amazon DynamoDB et a désormais besoin d'une latence de lecture de l'ordre de la microseconde pendant les périodes de soldes. L'entreprise veut un cache en mémoire entièrement géré conçu pour DynamoDB, qui gère l'invalidation du cache et son alimentation en données, afin que les développeurs n'écrivent pas leur propre logique de mise en cache.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an Amazon ElastiCache for Valkey cluster in front of the tables.", fr: "Ajouter un cluster Amazon ElastiCache for Valkey devant les tables." }
    - id: b
      text: { en: "Add a DynamoDB Accelerator (DAX) cluster in front of the tables.", fr: "Ajouter un cluster DynamoDB Accelerator (DAX) devant les tables." }
    - id: c
      text: { en: "Convert the tables to DynamoDB global tables in two Regions.", fr: "Convertir les tables en tables globales DynamoDB dans deux Régions." }
    - id: d
      text: { en: "Switch the tables from provisioned to on-demand capacity mode.", fr: "Faire passer les tables du mode provisionné au mode à la demande." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      DynamoDB Accelerator (DAX) is a fully managed, highly available in-memory cache for DynamoDB that can bring read latency from milliseconds down to microseconds. DAX itself handles cache invalidation, data population and cluster management.
    fr: |-
      DynamoDB Accelerator (DAX) est un cache en mémoire entièrement géré et hautement disponible pour DynamoDB, qui peut faire passer la latence de lecture de quelques millisecondes à quelques microsecondes. DAX gère lui-même l'invalidation du cache, son alimentation en données et la gestion du cluster.
  options:
    a:
      en: |-
        ElastiCache can cache DynamoDB data with microsecond latency, but the application must implement the caching logic itself, which the company wants to avoid.
      fr: |-
        ElastiCache peut mettre en cache des données DynamoDB avec une latence de l'ordre de la microseconde, mais l'application doit implémenter elle-même la logique de mise en cache, ce que l'entreprise veut éviter.
    c:
      en: |-
        Global tables replicate data across Regions for local access; reads still run at DynamoDB's millisecond latency, not from an in-memory cache.
      fr: |-
        Les tables globales répliquent les données entre Régions pour un accès local ; les lectures conservent la latence de l'ordre de la milliseconde de DynamoDB et ne proviennent pas d'un cache en mémoire.
    d:
      en: |-
        On-demand mode changes scaling and billing, not read latency.
      fr: |-
        Le mode à la demande modifie la mise à l'échelle et la facturation, pas la latence de lecture.
references:
  - title: "What is Amazon DynamoDB? - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
