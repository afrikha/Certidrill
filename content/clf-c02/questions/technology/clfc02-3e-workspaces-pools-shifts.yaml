id: clfc02-3e-workspaces-pools-shifts
objective: "3.8.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A call center has 300 agents who work in shifts. Each agent needs a Windows desktop built from the same curated image, and no user files or settings need to be kept between sessions. The company wants AWS to deliver these desktops on non-persistent infrastructure.

    Which option will meet these requirements?
  fr: |
    Un centre d'appels compte 300 agents qui travaillent en équipes. Chaque agent a besoin d'un bureau Windows créé à partir de la même image soigneusement préparée, et aucun fichier ni paramètre utilisateur ne doit être conservé entre les sessions. L'entreprise souhaite qu'AWS fournisse ces bureaux sur une infrastructure non persistante.

    Quelle option répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon WorkSpaces Pools", fr: "Amazon WorkSpaces Pools" } }
    - { id: b, text: { en: "Amazon WorkSpaces Personal", fr: "Amazon WorkSpaces Personal" } }
    - { id: c, text: { en: "Amazon WorkSpaces Secure Browser", fr: "Amazon WorkSpaces Secure Browser" } }
    - { id: d, text: { en: "Amazon EC2 Spot Instances", fr: "Instances Spot Amazon EC2" } }
answer: { optionId: a }
explanation:
  correct:
    en: "WorkSpaces Pools provides non-persistent virtual desktops: highly curated desktop environments hosted on ephemeral infrastructure. It fits users who share the same image and do not need a personalized desktop kept between sessions."
    fr: "WorkSpaces Pools fournit des bureaux virtuels non persistants : des environnements de bureau soigneusement préparés, hébergés sur une infrastructure éphémère. Il convient aux utilisateurs qui partagent la même image et n'ont pas besoin d'un bureau personnalisé conservé entre les sessions."
  options:
    b:
      en: "WorkSpaces Personal gives each user a persistent, personalized desktop for exclusive use, which the agents do not need."
      fr: "WorkSpaces Personal donne à chaque utilisateur un bureau persistant et personnalisé à usage exclusif, ce dont les agents n'ont pas besoin."
    c:
      en: "WorkSpaces Secure Browser delivers a browser session for web applications, not a full Windows desktop."
      fr: "WorkSpaces Secure Browser fournit une session de navigateur pour des applications web, pas un bureau Windows complet."
    d:
      en: "Spot Instances are a purchasing option for EC2 capacity that can be interrupted; they are not a managed desktop service."
      fr: "Les instances Spot sont une option d'achat de capacité EC2 qui peut être interrompue ; ce n'est pas un service de bureaux géré."
references:
  - title: What is Amazon WorkSpaces?
    url: https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces.html
