id: clfc02-3a-global-infra-components
objective: "3.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which items are components of the AWS global infrastructure? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels éléments font partie de l'infrastructure mondiale AWS ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Security groups", fr: "Groupes de sécurité" } }
    - { id: b, text: { en: "Availability Zones", fr: "Zones de disponibilité" } }
    - { id: c, text: { en: "IAM users", fr: "Utilisateurs IAM" } }
    - { id: d, text: { en: "Amazon Machine Images (AMIs)", fr: "Amazon Machine Images (AMI)" } }
    - { id: e, text: { en: "Edge locations", fr: "Emplacements périphériques" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The AWS global infrastructure is made of Regions, the Availability Zones inside each Region, and edge locations. Edge locations are used by services such as Amazon CloudFront to deliver content close to users.
    fr: |
      L'infrastructure mondiale AWS se compose de Régions, des zones de disponibilité de chaque Région et d'emplacements périphériques. Les emplacements périphériques sont utilisés par des services comme Amazon CloudFront pour diffuser du contenu près des utilisateurs.
  options:
    a: { en: "Security groups are virtual firewalls that customers configure for their resources, not part of the physical infrastructure.", fr: "Les groupes de sécurité sont des pare-feux virtuels que les clients configurent pour leurs ressources, pas un élément de l'infrastructure physique." }
    c: { en: "IAM users are identities that customers create in their accounts.", fr: "Les utilisateurs IAM sont des identités que les clients créent dans leurs comptes." }
    d: { en: "AMIs are templates used to launch EC2 instances, not infrastructure locations.", fr: "Les AMI sont des modèles qui servent à lancer des instances EC2, pas des emplacements d'infrastructure." }
references:
  - title: AWS Regions and Availability Zones
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html
  - title: What is Amazon CloudFront?
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
