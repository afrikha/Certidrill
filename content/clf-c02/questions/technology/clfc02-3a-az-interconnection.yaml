id: clfc02-3a-az-interconnection
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    How are the Availability Zones within an AWS Region connected to each other?
  fr: |
    Comment les zones de disponibilité d'une Région AWS sont-elles reliées entre elles ?
body:
  options:
    - { id: a, text: { en: "Through low-latency, high-bandwidth, highly redundant networking over dedicated metro fiber.", fr: "Par un réseau à faible latence, à bande passante élevée et hautement redondant, sur de la fibre métropolitaine dédiée." } }
    - { id: b, text: { en: "Only through the public internet, with each customer providing a VPN.", fr: "Uniquement par l'Internet public, chaque client fournissant un VPN." } }
    - { id: c, text: { en: "Through the nearest edge location, which relays all traffic between zones.", fr: "Par l'emplacement périphérique le plus proche, qui relaie tout le trafic entre les zones." } }
    - { id: d, text: { en: "They are not connected, because each zone is fully isolated like a separate Region.", fr: "Elles ne sont pas reliées, car chaque zone est totalement isolée, comme une Région distincte." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Availability Zones of a Region are physically separate but are interconnected with low-latency, high-bandwidth, highly redundant networking over dedicated metro fiber. This lets applications spread across zones and replicate data between them, for example synchronously for a Multi-AZ database.
    fr: |
      Les zones de disponibilité d'une Région sont physiquement séparées, mais reliées par un réseau à faible latence, à bande passante élevée et hautement redondant, sur de la fibre métropolitaine dédiée. Les applications peuvent ainsi être réparties entre les zones et répliquer des données entre elles, par exemple de façon synchrone pour une base de données Multi-AZ.
  options:
    b: { en: "Traffic between zones travels on AWS's own redundant network; customers do not build VPNs between zones.", fr: "Le trafic entre zones circule sur le réseau redondant d'AWS ; les clients ne créent pas de VPN entre les zones." }
    c: { en: "Edge locations serve users close to them; they do not relay traffic between the zones of a Region.", fr: "Les emplacements périphériques servent les utilisateurs proches ; ils ne relaient pas le trafic entre les zones d'une Région." }
    d: { en: "Regions are isolated from each other, but the zones inside a Region are linked so that workloads can use several of them.", fr: "Les Régions sont isolées les unes des autres, mais les zones d'une Région sont reliées pour que les charges de travail puissent en utiliser plusieurs." }
references:
  - title: AWS Regions and Availability Zones
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html
