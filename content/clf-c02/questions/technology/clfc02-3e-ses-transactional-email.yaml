id: clfc02-3e-ses-transactional-email
objective: "3.8.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's web application must send order confirmations and newsletters to its customers. The emails must be sent from the company's own domain, and the company does not want to manage email servers.

    Which AWS service will meet these requirements?
  fr: |
    L'application web d'une entreprise doit envoyer des confirmations de commande et des newsletters à ses clients. Les e-mails doivent être envoyés depuis le propre domaine de l'entreprise, et l'entreprise ne veut pas gérer de serveurs de messagerie.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon Simple Notification Service (Amazon SNS)", fr: "Amazon Simple Notification Service (Amazon SNS)" } }
    - { id: b, text: { en: "Amazon Simple Email Service (Amazon SES)", fr: "Amazon Simple Email Service (Amazon SES)" } }
    - { id: c, text: { en: "Amazon Connect", fr: "Amazon Connect" } }
    - { id: d, text: { en: "Amazon EventBridge", fr: "Amazon EventBridge" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon SES is an email platform for sending and receiving email with your own email addresses and domains. It sends transactional email such as order confirmations, marketing email and newsletters, without email servers or IP address reputation to manage."
    fr: "Amazon SES est une plateforme de messagerie qui permet d'envoyer et de recevoir des e-mails avec vos propres adresses et domaines. Il envoie des e-mails transactionnels comme des confirmations de commande, des e-mails marketing et des newsletters, sans serveur de messagerie ni réputation d'adresse IP à gérer."
  options:
    a:
      en: "SNS sends notifications to the subscribers of a topic; it is not designed for composing customer emails such as newsletters from the company's own domain."
      fr: "SNS envoie des notifications aux abonnés d'une rubrique ; il n'est pas conçu pour envoyer aux clients des e-mails comme des newsletters depuis le propre domaine de l'entreprise."
    c:
      en: "Amazon Connect is a contact center service for agents and customers, not a service for sending bulk or transactional email."
      fr: "Amazon Connect est un service de centre de contact pour les agents et les clients, pas un service d'envoi d'e-mails en masse ou transactionnels."
    d:
      en: "EventBridge routes events between applications; it does not deliver email to customers."
      fr: "EventBridge achemine des événements entre applications ; il ne remet pas d'e-mails aux clients."
references:
  - title: What is Amazon SES?
    url: https://docs.aws.amazon.com/ses/latest/dg/Welcome.html
