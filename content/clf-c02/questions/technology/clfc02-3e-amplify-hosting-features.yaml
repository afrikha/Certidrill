id: clfc02-3e-amplify-hosting-features
objective: "3.8.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A frontend team plans to host its React web app on AWS Amplify Hosting.

    Which capabilities does Amplify Hosting provide? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe front-end prévoit d'héberger son application web React sur AWS Amplify Hosting.

    Quelles fonctionnalités Amplify Hosting fournit-il ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Previews of pull requests during code reviews", fr: "Des aperçus des pull requests pendant les revues de code" } }
    - { id: b, text: { en: "Automatic Multi-AZ failover of a relational database", fr: "Le basculement Multi-AZ automatique d'une base de données relationnelle" } }
    - { id: c, text: { en: "Streaming of the app to users as a remote desktop", fr: "La diffusion de l'application aux utilisateurs sous forme de bureau à distance" } }
    - { id: d, text: { en: "Connection of the app to a custom domain", fr: "La connexion de l'application à un domaine personnalisé" } }
    - { id: e, text: { en: "Deployment of the app on servers in the company's data center", fr: "Le déploiement de l'application sur des serveurs du centre de données de l'entreprise" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Amplify Hosting features include pull request previews, which let reviewers see changes before they are merged, and custom domains for the hosted app. It also offers feature branches, password-protected branches, redirects and rewrites, and atomic deployments."
    fr: "Les fonctionnalités d'Amplify Hosting incluent les aperçus de pull requests, qui permettent aux relecteurs de voir les modifications avant leur fusion, et les domaines personnalisés pour l'application hébergée. Il propose aussi des branches de fonctionnalités, des branches protégées par mot de passe, des redirections et réécritures et des déploiements atomiques."
  options:
    b:
      en: "Multi-AZ failover of a relational database is a feature of Amazon RDS, not of a web hosting service."
      fr: "Le basculement Multi-AZ d'une base de données relationnelle est une fonctionnalité d'Amazon RDS, pas d'un service d'hébergement web."
    c:
      en: "Remote desktop streaming is provided by Amazon WorkSpaces and Amazon AppStream 2.0; Amplify serves the web app to browsers."
      fr: "Le streaming de bureaux à distance est fourni par Amazon WorkSpaces et Amazon AppStream 2.0 ; Amplify sert l'application web aux navigateurs."
    e:
      en: "Amplify Hosting serves apps from AWS through its content delivery network, not from servers in the customer's data center."
      fr: "Amplify Hosting sert les applications depuis AWS au moyen de son réseau de diffusion de contenu, pas depuis des serveurs du centre de données du client."
references:
  - title: Welcome to AWS Amplify Hosting
    url: https://docs.aws.amazon.com/amplify/latest/userguide/welcome.html
