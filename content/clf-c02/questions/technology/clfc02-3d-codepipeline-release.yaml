id: clfc02-3d-codepipeline-release
objective: "3.8.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants every code change to go automatically through the same release process: retrieve the source, build it, test it, and then deploy it. The company needs a service that models and automates these stages as a continuous delivery workflow.

    Which AWS service should the company use?
  fr: |
    Une entreprise veut que chaque modification de code passe automatiquement par le même processus de publication : récupérer la source, la compiler, la tester, puis la déployer. L'entreprise a besoin d'un service qui modélise et automatise ces étapes sous forme de flux de livraison continue.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "AWS CodePipeline" }
    - { id: b, text: "AWS CodeBuild" }
    - { id: c, text: "AWS X-Ray" }
    - { id: d, text: "AWS Systems Manager" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS CodePipeline is a continuous delivery service that models, visualizes, and automates the steps required to release software. You model and configure the stages of your release process, and CodePipeline automates the steps to release each software change continuously."
    fr: "AWS CodePipeline est un service de livraison continue qui modélise, visualise et automatise les étapes nécessaires à la publication d'un logiciel. Vous modélisez et configurez les étapes de votre processus de publication, et CodePipeline automatise les opérations nécessaires pour publier chaque modification logicielle en continu."
  options:
    b:
      en: "AWS CodeBuild compiles and tests code as one action; it does not orchestrate the whole release process from source to deployment."
      fr: "AWS CodeBuild compile et teste le code en tant qu'action unique ; il n'orchestre pas tout le processus de publication, de la source au déploiement."
    c:
      en: "AWS X-Ray analyzes and debugs running applications with request traces; it does not automate releases."
      fr: "AWS X-Ray analyse et débogue des applications en cours d'exécution à l'aide de traces de requêtes ; il n'automatise pas les publications."
    d:
      en: "AWS Systems Manager helps operate and manage nodes and applications; it is not the service that models a source-build-test-deploy release workflow."
      fr: "AWS Systems Manager aide à exploiter et gérer des nœuds et des applications ; ce n'est pas le service qui modélise un flux de publication source-build-test-déploiement."
references:
  - title: What is AWS CodePipeline?
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/welcome.html
