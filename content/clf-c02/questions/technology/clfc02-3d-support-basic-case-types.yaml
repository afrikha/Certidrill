id: clfc02-3d-support-basic-case-types
objective: "3.8.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A startup uses the Basic Support plan and does not want to pay for a support plan.

    Which request can the startup submit as a support case to AWS?
  fr: |
    Une start-up utilise le plan Basic Support et ne veut pas payer de plan de support.

    Quelle requête la start-up peut-elle soumettre à AWS sous forme de demande de support ?
body:
  options:
    - { id: a, text: { en: "A technical case about an Amazon EC2 instance that fails to start", fr: "Une demande technique concernant une instance Amazon EC2 qui ne démarre pas" } }
    - { id: b, text: { en: "A request to increase a service quota", fr: "Une demande d'augmentation d'un quota de service" } }
    - { id: c, text: { en: "A technical case with the Production system down severity", fr: "Une demande technique de gravité Production system down" } }
    - { id: d, text: { en: "A technical case about a third-party application installed on an instance", fr: "Une demande technique concernant une application tierce installée sur une instance" } }
answer: { optionId: b }
explanation:
  correct:
    en: "All AWS customers, including Basic Support customers, can create account and billing cases and service limit increase cases to raise service quotas. Technical cases require a paid plan: Business Support+, Enterprise Support, or Unified Operations."
    fr: "Tous les clients AWS, y compris ceux de Basic Support, peuvent créer des demandes de compte et de facturation, ainsi que des demandes d'augmentation de limite de service pour relever les quotas. Les demandes techniques exigent un plan payant : Business Support+, Enterprise Support ou Unified Operations."
  options:
    a:
      en: "This is a technical case, and Basic Support customers cannot create technical cases."
      fr: "Il s'agit d'une demande technique, et les clients Basic Support ne peuvent pas créer de demandes techniques."
    c:
      en: "Technical cases at any severity, including Production system down, require a paid support plan."
      fr: "Les demandes techniques, quelle que soit leur gravité, y compris Production system down, exigent un plan de support payant."
    d:
      en: "Technical cases about third-party software are part of the paid plans; Basic Support customers cannot open them."
      fr: "Les demandes techniques sur des logiciels tiers font partie des plans payants ; les clients Basic Support ne peuvent pas les ouvrir."
references:
  - title: Case management
    url: https://docs.aws.amazon.com/awssupport/latest/user/case-management.html
