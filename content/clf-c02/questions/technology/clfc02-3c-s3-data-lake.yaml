id: clfc02-3c-s3-data-lake
objective: "3.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants a central, highly durable repository for structured and unstructured data collected from many sources. Analytics services will query the data later, and storage must grow without capacity planning.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise souhaite un référentiel central et hautement durable pour des données structurées et non structurées collectées depuis de nombreuses sources. Des services d'analyse interrogeront les données plus tard, et le stockage doit croître sans planification de la capacité.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Amazon EBS", fr: "Amazon EBS" }
    - id: b
      text: { en: "Amazon ElastiCache", fr: "Amazon ElastiCache" }
    - id: c
      text: { en: "Amazon S3", fr: "Amazon S3" }
    - id: d
      text: { en: "Amazon EC2 instance store", fr: "Stockage d'instance Amazon EC2" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon S3 is object storage that stores and retrieves any amount of data and is a common foundation for data lakes and big data analytics. Its storage classes are designed for 99.999999999 % durability, and capacity does not need to be provisioned.
    fr: |-
      Amazon S3 est un stockage d'objets qui stocke et récupère n'importe quelle quantité de données et constitue une base courante pour les lacs de données et l'analytique Big Data. Ses classes de stockage sont conçues pour une durabilité de 99,999999999 %, et il n'est pas nécessaire de provisionner la capacité.
  options:
    a:
      en: |-
        EBS volumes have a provisioned size and attach to instances in one Availability Zone; they are not a central repository for many sources.
      fr: |-
        Les volumes EBS ont une taille provisionnée et s'attachent à des instances d'une seule zone de disponibilité ; ce n'est pas un référentiel central pour de nombreuses sources.
    b:
      en: |-
        ElastiCache is an in-memory cache for fast reads, not durable long-term storage for a data lake.
      fr: |-
        ElastiCache est un cache en mémoire destiné aux lectures rapides, et non un stockage durable à long terme pour un lac de données.
    d:
      en: |-
        Instance store is temporary: its data is lost when the instance stops or terminates.
      fr: |-
        Le stockage d'instance est temporaire : ses données sont perdues lorsque l'instance s'arrête ou est résiliée.
references:
  - title: "What is Amazon S3? - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
  - title: "Understanding and managing Amazon S3 storage classes - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
