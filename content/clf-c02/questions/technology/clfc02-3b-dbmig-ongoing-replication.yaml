id: clfc02-3b-dbmig-ongoing-replication
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is migrating a large on-premises MySQL database to Amazon RDS for MySQL with AWS DMS. Copying the existing data will take several days, and the application will keep writing to the source database during that time. The final switch to Amazon RDS must cause only a few minutes of downtime.

    How should the company configure the migration?
  fr: |
    Une entreprise migre une grande base de données MySQL sur site vers Amazon RDS for MySQL avec AWS DMS. La copie des données existantes prendra plusieurs jours, et l'application continuera d'écrire dans la base source pendant ce temps. Le basculement final vers Amazon RDS ne doit provoquer que quelques minutes d'interruption.

    Comment l'entreprise doit-elle configurer la migration ?
body:
  options:
    - { id: a, text: { en: "Use a DMS task that performs a full load followed by ongoing replication of changes.", fr: "Utiliser une tâche DMS qui effectue un chargement complet suivi d'une réplication continue des modifications." } }
    - { id: b, text: { en: "Use a DMS task that performs a full load only, and then switch the application to Amazon RDS.", fr: "Utiliser une tâche DMS qui effectue uniquement un chargement complet, puis basculer l'application vers Amazon RDS." } }
    - { id: c, text: { en: "Stop the application, export the database to a dump file, and import the file into Amazon RDS.", fr: "Arrêter l'application, exporter la base de données dans un fichier de vidage et importer le fichier dans Amazon RDS." } }
    - { id: d, text: { en: "Back up the on-premises database server with AWS Backup and restore the backup as an Amazon RDS instance.", fr: "Sauvegarder le serveur de base de données sur site avec AWS Backup et restaurer la sauvegarde sous forme d'instance Amazon RDS." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A DMS task can migrate the existing data (full load) and then capture and apply the changes made on the source (change data capture) to keep the target synchronized. When the company is ready, it stops writes briefly and switches the application to Amazon RDS, with minimal downtime."
    fr: "Une tâche DMS peut migrer les données existantes (chargement complet), puis capturer et appliquer les modifications faites sur la source (capture des données modifiées, CDC) pour garder la cible synchronisée. Quand l'entreprise est prête, elle arrête brièvement les écritures et bascule l'application vers Amazon RDS, avec une interruption minimale."
  options:
    b:
      en: "A full load alone does not capture the writes made during the several days of copying, so the target would be missing data at the switch."
      fr: "Un chargement complet seul ne capture pas les écritures faites pendant les jours de copie : la cible manquerait de données au moment du basculement."
    c:
      en: "Stopping the application during a multi-day export and import causes days of downtime, not a few minutes."
      fr: "Arrêter l'application pendant un export et un import de plusieurs jours provoque des jours d'interruption, pas quelques minutes."
    d:
      en: "AWS Backup cannot restore a backup of an on-premises server as an Amazon RDS DB instance, and a point-in-time backup would not include the writes made afterward."
      fr: "AWS Backup ne peut pas restaurer la sauvegarde d'un serveur sur site sous forme d'instance de base de données Amazon RDS, et une sauvegarde à un instant donné n'inclurait pas les écritures faites ensuite."
references:
  - title: Creating tasks for ongoing replication using AWS DMS
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html
