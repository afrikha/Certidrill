id: clfc02-3b-dbhost-rds-customer-tasks
objective: "3.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company moves its database from Amazon EC2 to Amazon RDS.

    Which tasks remain the company's responsibility after the move? (Choose two.)
  fr: |
    Une entreprise déplace sa base de données d'Amazon EC2 vers Amazon RDS.

    Quelles tâches restent de la responsabilité de l'entreprise après le déplacement ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Installing the database engine software", fr: "Installer le logiciel du moteur de base de données" } }
    - { id: b, text: { en: "Optimizing the queries that the application sends", fr: "Optimiser les requêtes envoyées par l'application" } }
    - { id: c, text: { en: "Replacing failed storage hardware", fr: "Remplacer le matériel de stockage défaillant" } }
    - { id: d, text: { en: "Applying patches to the host operating system", fr: "Appliquer les correctifs au système d'exploitation de l'hôte" } }
    - { id: e, text: { en: "Managing database user accounts and their permissions", fr: "Gérer les comptes d'utilisateurs de la base de données et leurs autorisations" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Amazon RDS hosts the software components and infrastructure of the DB instance, including OS and database software patching and installation, hardware, and backups. The customer remains responsible for query tuning and for controlling who can log in to the databases, by using the security features of the DB engine."
    fr: "Amazon RDS héberge les composants logiciels et l'infrastructure de l'instance de base de données, y compris l'installation et les correctifs du système d'exploitation et du logiciel de base de données, le matériel et les sauvegardes. Le client reste responsable du réglage des requêtes et du contrôle des personnes qui peuvent se connecter aux bases de données, à l'aide des fonctionnalités de sécurité du moteur de base de données."
  options:
    a:
      en: "RDS provisions DB instances with the database engine already installed; the customer does not install it."
      fr: "RDS provisionne des instances de base de données dont le moteur est déjà installé ; le client ne l'installe pas."
    c:
      en: "The physical hardware, including storage, is managed and replaced by AWS."
      fr: "Le matériel physique, y compris le stockage, est géré et remplacé par AWS."
    d:
      en: "AWS manages and patches the operating system of RDS DB instances; the customer has no access to the host."
      fr: "AWS gère le système d'exploitation des instances de base de données RDS et y applique les correctifs ; le client n'a pas accès à l'hôte."
references:
  - title: What is Amazon Relational Database Service (Amazon RDS)?
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html
  - title: Security in Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.html
