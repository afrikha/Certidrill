id: clfc02-3c-ebs-st1-logs
objective: "3.6.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a log processing application on Amazon EC2 that reads large files sequentially and frequently. It needs low-cost EBS storage optimized for throughput rather than IOPS. The volume is not used as a boot volume.

    Which EBS volume type should the company choose?
  fr: |
    Une entreprise exécute sur Amazon EC2 une application de traitement de journaux qui lit fréquemment et séquentiellement de gros fichiers. Elle a besoin d'un stockage EBS à faible coût optimisé pour le débit plutôt que pour les IOPS. Le volume n'est pas utilisé comme volume de démarrage.

    Quel type de volume EBS l'entreprise doit-elle choisir ?
body:
  options:
    - id: a
      text: { en: "Provisioned IOPS SSD (io2 Block Express)", fr: "SSD à IOPS provisionnées (io2 Block Express)" }
    - id: b
      text: { en: "Throughput Optimized HDD (st1)", fr: "HDD à débit optimisé (st1)" }
    - id: c
      text: { en: "General Purpose SSD (gp3)", fr: "SSD à usage général (gp3)" }
    - id: d
      text: { en: "Cold HDD (sc1)", fr: "HDD à froid (sc1)" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Throughput Optimized HDD (st1) volumes are low-cost HDD volumes for frequently accessed, throughput-intensive workloads such as big data, data warehouses and log processing. HDD volumes cannot be boot volumes, which does not matter here.
    fr: |-
      Les volumes HDD à débit optimisé (st1) sont des volumes HDD à faible coût destinés aux charges de travail à haut débit fréquemment sollicitées, comme le Big Data, les entrepôts de données et le traitement de journaux. Les volumes HDD ne peuvent pas servir de volumes de démarrage, ce qui n'a pas d'importance ici.
  options:
    a:
      en: |-
        io2 Block Express is an SSD type for workloads that need sustained IOPS and sub-millisecond latency; it costs more than an HDD volume.
      fr: |-
        io2 Block Express est un type SSD destiné aux charges de travail qui exigent des IOPS soutenues et une latence inférieure à la milliseconde ; il coûte plus cher qu'un volume HDD.
    c:
      en: |-
        gp3 is an SSD type for transactional workloads and boot volumes; it is optimized for IOPS rather than for low-cost sequential throughput.
      fr: |-
        gp3 est un type SSD destiné aux charges de travail transactionnelles et aux volumes de démarrage ; il est optimisé pour les IOPS plutôt que pour un débit séquentiel à faible coût.
    d:
      en: |-
        sc1 offers the lowest cost for infrequently accessed data; this workload reads its files frequently.
      fr: |-
        sc1 offre le coût le plus bas pour des données rarement consultées ; cette charge de travail lit ses fichiers fréquemment.
references:
  - title: "Amazon EBS volume types - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html
