id: clfc02-3d-fsx-windows-smb
objective: "3.6.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to move its Windows file shares to a fully managed AWS service. Users must keep accessing the shares over the SMB protocol, with permissions based on Microsoft Active Directory users and Windows access control lists (ACLs).

    Which AWS service should the company use?
  fr: |
    Une entreprise veut déplacer ses partages de fichiers Windows vers un service AWS entièrement géré. Les utilisateurs doivent continuer à accéder aux partages via le protocole SMB, avec des autorisations fondées sur les utilisateurs Microsoft Active Directory et les listes de contrôle d'accès (ACL) Windows.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon Elastic File System (Amazon EFS)" }
    - { id: b, text: "Amazon Simple Storage Service (Amazon S3)" }
    - { id: c, text: "Amazon FSx for Windows File Server" }
    - { id: d, text: "Amazon Elastic Block Store (Amazon EBS)" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon FSx for Windows File Server provides fully managed Windows file servers that clients access over SMB. The file system joins an Active Directory domain to authenticate users, and file and folder permissions use Windows ACLs."
    fr: "Amazon FSx for Windows File Server fournit des serveurs de fichiers Windows entièrement gérés auxquels les clients accèdent via SMB. Le système de fichiers rejoint un domaine Active Directory pour authentifier les utilisateurs, et les autorisations sur les fichiers et dossiers utilisent les ACL Windows."
  options:
    a:
      en: "Amazon EFS is accessed over NFS, and AWS does not support using it with Windows-based EC2 instances."
      fr: "Amazon EFS est accessible via NFS, et AWS ne prend pas en charge son utilisation avec des instances EC2 Windows."
    b:
      en: "Amazon S3 is object storage accessed through APIs; it does not provide SMB file shares with Windows ACLs."
      fr: "Amazon S3 est un stockage d'objets accessible par API ; il ne fournit pas de partages de fichiers SMB avec des ACL Windows."
    d:
      en: "An EBS volume is block storage attached to an instance; using it for file shares means building and managing your own Windows file server."
      fr: "Un volume EBS est un stockage en bloc attaché à une instance ; l'utiliser pour des partages de fichiers revient à créer et gérer son propre serveur de fichiers Windows."
references:
  - title: What is FSx for Windows File Server?
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html
