id: clfc02-3b-lb-distribute-traffic
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs the same web application on several Amazon EC2 instances in two Availability Zones. The company needs one entry point that spreads incoming requests across the instances.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise exécute la même application web sur plusieurs instances Amazon EC2 dans deux zones de disponibilité. L'entreprise a besoin d'un point d'entrée unique qui répartit les requêtes entrantes entre les instances.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "Amazon EC2 Auto Scaling" }
    - { id: b, text: "AWS Direct Connect" }
    - { id: c, text: "Elastic Load Balancing" }
    - { id: d, text: "Amazon EBS" }
answer: { optionId: c }
explanation:
  correct:
    en: "Elastic Load Balancing automatically distributes incoming traffic across multiple targets, such as EC2 instances, in one or more Availability Zones. Clients connect to the load balancer, which becomes the single entry point of the application."
    fr: "Elastic Load Balancing répartit automatiquement le trafic entrant entre plusieurs cibles, comme des instances EC2, dans une ou plusieurs zones de disponibilité. Les clients se connectent à l'équilibreur de charge, qui devient le point d'entrée unique de l'application."
  options:
    a:
      en: "EC2 Auto Scaling changes the number of instances; it does not receive requests and distribute them."
      fr: "EC2 Auto Scaling modifie le nombre d'instances ; il ne reçoit pas les requêtes et ne les répartit pas."
    b:
      en: "Direct Connect is a dedicated network connection from a site to AWS; it does not distribute requests across instances."
      fr: "Direct Connect est une connexion réseau dédiée entre un site et AWS ; il ne répartit pas les requêtes entre des instances."
    d:
      en: "Amazon EBS provides block storage volumes for instances; it does not handle incoming traffic."
      fr: "Amazon EBS fournit des volumes de stockage en bloc pour les instances ; il ne traite pas le trafic entrant."
references:
  - title: What is Elastic Load Balancing?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/what-is-load-balancing.html
