id: clfc02-3e-connect-lex-selfservice
objective: "3.8.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon Connect for its contact center. It wants callers to check the status of their orders by speaking naturally to an automated conversational bot before they reach an agent.

    Which AWS service should the company integrate with Amazon Connect?
  fr: |
    Une entreprise utilise Amazon Connect pour son centre de contact. Elle veut que les appelants vérifient l'état de leurs commandes en parlant naturellement à un bot conversationnel automatisé avant de joindre un agent.

    Quel service AWS l'entreprise doit-elle intégrer à Amazon Connect ?
body:
  options:
    - { id: a, text: { en: "Amazon Polly", fr: "Amazon Polly" } }
    - { id: b, text: { en: "Amazon Transcribe", fr: "Amazon Transcribe" } }
    - { id: c, text: { en: "Amazon Lex", fr: "Amazon Lex" } }
    - { id: d, text: { en: "Amazon Comprehend", fr: "Amazon Comprehend" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Lex builds conversational interfaces for voice and text. It combines automatic speech recognition and natural language understanding to identify the caller's intent and fulfill it, for example by calling a Lambda function that looks up the order, and it integrates with the Amazon Connect contact center."
    fr: "Amazon Lex crée des interfaces conversationnelles vocales et textuelles. Il combine la reconnaissance automatique de la parole et la compréhension du langage naturel pour identifier l'intention de l'appelant et y répondre, par exemple en appelant une fonction Lambda qui recherche la commande, et il s'intègre au centre de contact Amazon Connect."
  options:
    a:
      en: "Polly turns text into lifelike speech; it does not understand what callers say or manage a conversation."
      fr: "Polly convertit du texte en parole naturelle ; il ne comprend pas ce que disent les appelants et ne gère pas de conversation."
    b:
      en: "Transcribe converts speech to text, but it does not determine intent or run a two-way conversation."
      fr: "Transcribe convertit la parole en texte, mais il ne détermine pas l'intention et ne mène pas de conversation bidirectionnelle."
    d:
      en: "Comprehend finds insights such as sentiment in text; it is not a conversational bot."
      fr: "Comprehend extrait des informations comme le sentiment d'un texte ; ce n'est pas un bot conversationnel."
references:
  - title: What is Amazon Lex V2?
    url: https://docs.aws.amazon.com/lexv2/latest/dg/what-is.html
