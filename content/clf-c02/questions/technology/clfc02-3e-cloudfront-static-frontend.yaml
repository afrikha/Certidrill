id: clfc02-3e-cloudfront-static-frontend
objective: "3.8.13"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores the static frontend of its web app (HTML, JavaScript and image files) in an Amazon S3 bucket in one AWS Region. Users around the world report slow page loads. The company wants copies of the files to be cached at edge locations close to the users.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise stocke le front-end statique de son application web (fichiers HTML, JavaScript et images) dans un compartiment Amazon S3 situé dans une Région AWS. Des utilisateurs du monde entier signalent des pages lentes à charger. L'entreprise veut que des copies des fichiers soient mises en cache dans des emplacements périphériques proches des utilisateurs.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "AWS Global Accelerator", fr: "AWS Global Accelerator" } }
    - { id: b, text: { en: "Amazon S3 Transfer Acceleration", fr: "Amazon S3 Transfer Acceleration" } }
    - { id: c, text: { en: "Amazon Route 53 latency-based routing", fr: "Le routage basé sur la latence d'Amazon Route 53" } }
    - { id: d, text: { en: "Amazon CloudFront", fr: "Amazon CloudFront" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon CloudFront speeds up distribution of static and dynamic web content such as HTML, JavaScript and image files. It caches copies of the files in edge locations and routes each request to the edge location with the lowest latency, fetching from the S3 origin only when a file is not cached."
    fr: "Amazon CloudFront accélère la distribution de contenu web statique et dynamique, comme des fichiers HTML, JavaScript et des images. Il met en cache des copies des fichiers dans des emplacements périphériques et achemine chaque requête vers l'emplacement périphérique offrant la latence la plus faible, en ne récupérant le fichier depuis l'origine S3 que s'il n'est pas en cache."
  options:
    a:
      en: "Global Accelerator routes traffic over the AWS global network to application endpoints, but it does not cache content at edge locations."
      fr: "Global Accelerator achemine le trafic via le réseau mondial d'AWS vers des points de terminaison d'application, mais il ne met pas de contenu en cache dans des emplacements périphériques."
    b:
      en: "S3 Transfer Acceleration speeds up transfers to and from a bucket over long distances, but it does not cache the files near users."
      fr: "S3 Transfer Acceleration accélère les transferts vers et depuis un compartiment sur de longues distances, mais il ne met pas les fichiers en cache près des utilisateurs."
    c:
      en: "Latency-based routing chooses among resources in several Regions; with a single bucket in one Region it does not bring content closer to users."
      fr: "Le routage basé sur la latence choisit entre des ressources situées dans plusieurs Régions ; avec un seul compartiment dans une Région, il ne rapproche pas le contenu des utilisateurs."
references:
  - title: What is Amazon CloudFront?
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
