id: clfc02-3c-route53-latency-policy
objective: "3.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs the same application in three AWS Regions. It wants Amazon Route 53 to direct each user to the Region that gives that user the lowest network latency.

    Which Route 53 routing policy will meet this requirement?
  fr: |
    Une entreprise exécute la même application dans trois Régions AWS. Elle souhaite qu'Amazon Route 53 dirige chaque utilisateur vers la Région qui lui offre la latence réseau la plus faible.

    Quelle politique de routage Route 53 répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Geolocation routing", fr: "Routage par géolocalisation" }
    - id: b
      text: { en: "Latency routing", fr: "Routage basé sur la latence" }
    - id: c
      text: { en: "Simple routing", fr: "Routage simple" }
    - id: d
      text: { en: "IP-based routing", fr: "Routage basé sur l'IP" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Latency routing is designed for resources in several AWS Regions: Route 53 answers each query with the record for the Region that has the best latency for that user.
    fr: |-
      Le routage basé sur la latence est conçu pour des ressources situées dans plusieurs Régions AWS : Route 53 répond à chaque requête avec l'enregistrement de la Région qui offre la meilleure latence à cet utilisateur.
  options:
    a:
      en: |-
        Geolocation routing chooses the answer from the user's location, such as country or continent; the closest location is not always the one with the lowest latency.
      fr: |-
        Le routage par géolocalisation choisit la réponse selon l'emplacement de l'utilisateur, comme le pays ou le continent ; l'emplacement le plus proche n'est pas toujours celui qui offre la plus faible latence.
    c:
      en: |-
        Simple routing is for a single resource and does not choose between Regions.
      fr: |-
        Le routage simple concerne une seule ressource et ne choisit pas entre des Régions.
    d:
      en: |-
        IP-based routing maps the source IP ranges that the company defines to resources; it does not measure latency.
      fr: |-
        Le routage basé sur l'IP associe des plages d'adresses IP sources définies par l'entreprise à des ressources ; il ne mesure pas la latence.
references:
  - title: "Choosing a routing policy - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html
