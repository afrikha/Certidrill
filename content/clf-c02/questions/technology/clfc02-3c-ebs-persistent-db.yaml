id: clfc02-3c-ebs-persistent-db
objective: "3.6.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a database on an Amazon EC2 instance. The database needs block storage that keeps its data when the instance is stopped and that can be backed up with point-in-time snapshots.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise exécute une base de données sur une instance Amazon EC2. La base de données a besoin d'un stockage en bloc qui conserve ses données lorsque l'instance est arrêtée et qui peut être sauvegardé par des instantanés à un moment précis.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Amazon EBS", fr: "Amazon EBS" }
    - id: b
      text: { en: "EC2 instance store", fr: "Stockage d'instance EC2" }
    - id: c
      text: { en: "Amazon S3", fr: "Amazon S3" }
    - id: d
      text: { en: "Amazon S3 Glacier Deep Archive", fr: "Amazon S3 Glacier Deep Archive" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon EBS provides durable block storage volumes that an EC2 instance uses like a local hard drive. Volumes persist independently of the running life of the instance, and EBS snapshots give point-in-time backups from which new volumes can be restored.
    fr: |-
      Amazon EBS fournit des volumes de stockage en bloc durables qu'une instance EC2 utilise comme un disque dur local. Les volumes persistent indépendamment de la durée de fonctionnement de l'instance, et les instantanés EBS fournissent des sauvegardes à un moment précis à partir desquelles de nouveaux volumes peuvent être restaurés.
  options:
    b:
      en: |-
        Instance store is block storage, but its data is lost when the instance is stopped.
      fr: |-
        Le stockage d'instance est un stockage en bloc, mais ses données sont perdues à l'arrêt de l'instance.
    c:
      en: |-
        Amazon S3 is object storage accessed through an API, not a block device for database files.
      fr: |-
        Amazon S3 est un stockage d'objets accessible par une API, et non un périphérique en bloc pour des fichiers de base de données.
    d:
      en: |-
        Deep Archive is an S3 archive storage class that requires hours to restore data; it is not block storage.
      fr: |-
        Deep Archive est une classe de stockage d'archive S3 qui exige des heures pour restaurer les données ; ce n'est pas un stockage en bloc.
references:
  - title: "Amazon EBS volumes - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes.html
  - title: "What is Amazon Elastic Block Store? - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/what-is-ebs.html
