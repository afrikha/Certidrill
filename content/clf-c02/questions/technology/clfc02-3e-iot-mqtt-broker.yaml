id: clfc02-3e-iot-mqtt-broker
objective: "3.8.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Thousands of sensors publish small temperature readings by using the MQTT protocol. Cloud applications subscribe to these readings.

    Which AWS service provides the managed message broker for this solution?
  fr: |
    Des milliers de capteurs publient de petites mesures de température au moyen du protocole MQTT. Des applications cloud s'abonnent à ces mesures.

    Quel service AWS fournit l'agent de messages géré de cette solution ?
body:
  options:
    - { id: a, text: { en: "Amazon Simple Notification Service (Amazon SNS)", fr: "Amazon Simple Notification Service (Amazon SNS)" } }
    - { id: b, text: { en: "AWS IoT Core", fr: "AWS IoT Core" } }
    - { id: c, text: { en: "Amazon Simple Queue Service (Amazon SQS)", fr: "Amazon Simple Queue Service (Amazon SQS)" } }
    - { id: d, text: { en: "Amazon EventBridge", fr: "Amazon EventBridge" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The AWS IoT Core message broker lets devices and applications publish and subscribe to messages over MQTT or MQTT over WebSocket, and devices can also publish over HTTPS. The broker distributes the data to subscribers and to services such as the rules engine."
    fr: "L'agent de messages d'AWS IoT Core permet aux appareils et aux applications de publier des messages et de s'y abonner via MQTT ou MQTT sur WebSocket, et les appareils peuvent aussi publier via HTTPS. L'agent distribue les données aux abonnés et à des services comme le moteur de règles."
  options:
    a:
      en: "SNS is a publish/subscribe service for applications and people, but it does not accept MQTT connections from devices."
      fr: "SNS est un service de publication/abonnement pour les applications et les personnes, mais il n'accepte pas de connexions MQTT depuis des appareils."
    c:
      en: "SQS is a message queue that consumers poll; it is not an MQTT broker for devices."
      fr: "SQS est une file d'attente de messages que les consommateurs interrogent ; ce n'est pas un agent MQTT pour des appareils."
    d:
      en: "EventBridge routes events between AWS services, SaaS applications and custom applications; devices do not publish to it over MQTT."
      fr: "EventBridge achemine des événements entre services AWS, applications SaaS et applications personnalisées ; les appareils n'y publient pas via MQTT."
references:
  - title: How AWS IoT works
    url: https://docs.aws.amazon.com/iot/latest/developerguide/aws-iot-how-it-works.html
