id: clfc02-3d-backup-plan
objective: "3.6.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Backup. It needs to specify that backups run every day at 05:00 UTC and are kept for 35 days.

    Which AWS Backup component should the company configure?
  fr: |
    Une entreprise utilise AWS Backup. Elle doit spécifier que les sauvegardes s'exécutent tous les jours à 05:00 UTC et sont conservées 35 jours.

    Quel composant d'AWS Backup l'entreprise doit-elle configurer ?
body:
  options:
    - { id: a, text: { en: "A backup vault", fr: "Un coffre de sauvegarde (backup vault)" } }
    - { id: b, text: { en: "A backup plan", fr: "Un plan de sauvegarde (backup plan)" } }
    - { id: c, text: { en: "A recovery point", fr: "Un point de récupération (recovery point)" } }
    - { id: d, text: { en: "An AWS Backup Audit Manager framework", fr: "Un framework AWS Backup Audit Manager" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A backup plan is a policy that defines when and how AWS resources are backed up, such as the schedule, the backup window, and how long backups are retained. Resources are assigned to the plan, and AWS Backup then creates and retains their backups automatically."
    fr: "Un plan de sauvegarde est une politique qui définit quand et comment les ressources AWS sont sauvegardées, par exemple la planification, la fenêtre de sauvegarde et la durée de conservation des sauvegardes. Des ressources sont attribuées au plan, puis AWS Backup crée et conserve automatiquement leurs sauvegardes."
  options:
    a:
      en: "A backup vault is the container that stores and organizes recovery points; the schedule and retention are set in the backup plan rules."
      fr: "Un coffre de sauvegarde est le conteneur qui stocke et organise les points de récupération ; la planification et la rétention sont définies dans les règles du plan de sauvegarde."
    c:
      en: "A recovery point is one backup of a resource at a point in time; it is the result of a backup plan, not where the schedule is defined."
      fr: "Un point de récupération est une sauvegarde d'une ressource à un instant donné ; c'est le résultat d'un plan de sauvegarde, pas l'endroit où la planification est définie."
    d:
      en: "An Audit Manager framework evaluates whether backups comply with controls; it does not schedule backups."
      fr: "Un framework Audit Manager évalue si les sauvegardes respectent des contrôles ; il ne planifie pas les sauvegardes."
references:
  - title: Backup plans
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/about-backup-plans.html
