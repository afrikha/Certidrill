id: clfc02-3d-fsx-multiprotocol
objective: "3.6.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants to replace its on-premises storage arrays with a fully managed AWS file service. The same data must be available to Linux, Windows, and macOS clients over NFS, SMB, and iSCSI.

    Which AWS service meets these requirements?
  fr: |
    Une entreprise veut remplacer ses baies de stockage sur site par un service de fichiers AWS entièrement géré. Les mêmes données doivent être accessibles aux clients Linux, Windows et macOS via NFS, SMB et iSCSI.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon FSx for OpenZFS" }
    - { id: b, text: "Amazon FSx for Windows File Server" }
    - { id: c, text: "Amazon Elastic File System (Amazon EFS)" }
    - { id: d, text: "Amazon FSx for NetApp ONTAP" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon FSx for NetApp ONTAP offers multi-protocol access to the same data over NFS, SMB, iSCSI, and NVMe from Linux, Windows, and macOS clients. It also provides ONTAP data management features such as snapshots, clones, and SnapMirror replication."
    fr: "Amazon FSx for NetApp ONTAP offre un accès multiprotocole aux mêmes données via NFS, SMB, iSCSI et NVMe depuis des clients Linux, Windows et macOS. Il fournit aussi les fonctionnalités de gestion des données d'ONTAP, comme les instantanés, les clones et la réplication SnapMirror."
  options:
    a:
      en: "FSx for OpenZFS serves data over NFS only; it does not provide SMB shares or iSCSI block access."
      fr: "FSx for OpenZFS sert les données uniquement via NFS ; il ne fournit ni partages SMB ni accès en bloc iSCSI."
    b:
      en: "FSx for Windows File Server serves file shares over SMB; it does not provide NFS exports or iSCSI block access."
      fr: "FSx for Windows File Server sert des partages de fichiers via SMB ; il ne fournit ni exports NFS ni accès en bloc iSCSI."
    c:
      en: "Amazon EFS is accessed over NFS only, and AWS does not support it on Windows-based instances."
      fr: "Amazon EFS est accessible uniquement via NFS, et AWS ne le prend pas en charge sur les instances Windows."
references:
  - title: What is Amazon FSx for NetApp ONTAP?
    url: https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/what-is-fsx-ontap.html
  - title: What is Amazon FSx for OpenZFS?
    url: https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/what-is-fsx.html
