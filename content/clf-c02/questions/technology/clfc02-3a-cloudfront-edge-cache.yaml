id: clfc02-3a-cloudfront-edge-cache
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company serves videos and images to users around the world from a single AWS Region. It wants users to receive the content with lower latency by caching copies close to them.

    Which AWS infrastructure component and service should the company use?
  fr: |
    Une entreprise de médias diffuse des vidéos et des images aux utilisateurs du monde entier depuis une seule Région AWS. Elle veut que les utilisateurs reçoivent le contenu avec une latence plus faible, grâce à des copies mises en cache près d'eux.

    Quel composant d'infrastructure AWS et quel service l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Edge locations, through Amazon CloudFront", fr: "Les emplacements périphériques, au moyen d'Amazon CloudFront" } }
    - { id: b, text: { en: "Availability Zones, through Elastic Load Balancing", fr: "Les zones de disponibilité, au moyen d'Elastic Load Balancing" } }
    - { id: c, text: { en: "Additional Regions, through Amazon EC2 Auto Scaling", fr: "Des Régions supplémentaires, au moyen d'Amazon EC2 Auto Scaling" } }
    - { id: d, text: { en: "Availability Zones, through Amazon EBS snapshots", fr: "Les zones de disponibilité, au moyen d'instantanés Amazon EBS" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CloudFront delivers content through a worldwide network of edge locations. A user's request goes to the edge location with the lowest latency, and if the content is already cached there, it is served immediately without returning to the origin in the Region.
    fr: |
      CloudFront diffuse le contenu au moyen d'un réseau mondial d'emplacements périphériques. La requête d'un utilisateur est dirigée vers l'emplacement périphérique offrant la latence la plus faible et, si le contenu y est déjà en cache, il est servi immédiatement sans revenir à l'origine dans la Région.
  options:
    b: { en: "A load balancer spreads requests across targets inside one Region; it does not cache content close to users worldwide.", fr: "Un équilibreur de charge répartit les requêtes entre des cibles d'une même Région ; il ne met pas le contenu en cache près des utilisateurs du monde entier." }
    c: { en: "Auto Scaling adjusts the number of instances; it does not cache content, and it works inside a Region.", fr: "Auto Scaling ajuste le nombre d'instances ; il ne met pas de contenu en cache et fonctionne à l'intérieur d'une Région." }
    d: { en: "EBS snapshots are backups of volumes; they do not deliver content to users.", fr: "Les instantanés EBS sont des sauvegardes de volumes ; ils ne diffusent pas de contenu aux utilisateurs." }
references:
  - title: What is Amazon CloudFront?
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
