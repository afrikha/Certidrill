id: clfc02-3c-subnet-single-az
objective: "3.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cloud practitioner is designing a VPC that will host instances in several Availability Zones.

    Which statement about subnets is correct?
  fr: |
    Un praticien du cloud conçoit un VPC qui hébergera des instances dans plusieurs zones de disponibilité.

    Quelle affirmation sur les sous-réseaux est correcte ?
body:
  options:
    - id: a
      text: { en: "A subnet can span every Availability Zone in its Region.", fr: "Un sous-réseau peut couvrir toutes les zones de disponibilité de sa Région." }
    - id: b
      text: { en: "A subnet can span two AWS Regions for disaster recovery.", fr: "Un sous-réseau peut couvrir deux Régions AWS pour la reprise après sinistre." }
    - id: c
      text: { en: "A subnet is an IP address range that resides in one Availability Zone.", fr: "Un sous-réseau est une plage d'adresses IP qui réside dans une seule zone de disponibilité." }
    - id: d
      text: { en: "A subnet is a global resource shared by all VPCs in the account.", fr: "Un sous-réseau est une ressource globale partagée par tous les VPC du compte." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A subnet is a range of IP addresses in a VPC, and it must reside in a single Availability Zone. To spread instances across several Availability Zones, the VPC needs at least one subnet in each of them.
    fr: |-
      Un sous-réseau est une plage d'adresses IP d'un VPC, et il doit résider dans une seule zone de disponibilité. Pour répartir des instances sur plusieurs zones de disponibilité, le VPC a besoin d'au moins un sous-réseau dans chacune d'elles.
  options:
    a:
      en: |-
        A subnet is tied to exactly one Availability Zone; it is the VPC that spans all the zones of its Region.
      fr: |-
        Un sous-réseau est lié à une seule zone de disponibilité ; c'est le VPC qui couvre toutes les zones de sa Région.
    b:
      en: |-
        A subnet cannot leave its VPC's Region, and it does not even span several Availability Zones.
      fr: |-
        Un sous-réseau ne peut pas sortir de la Région de son VPC, et il ne couvre même pas plusieurs zones de disponibilité.
    d:
      en: |-
        A subnet belongs to one VPC; it is not shared by every VPC in the account.
      fr: |-
        Un sous-réseau appartient à un seul VPC ; il n'est pas partagé par tous les VPC du compte.
references:
  - title: "What is Amazon VPC? - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html
