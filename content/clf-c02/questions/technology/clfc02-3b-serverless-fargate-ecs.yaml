id: clfc02-3b-serverless-fargate-ecs
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs containerized web services on Amazon ECS. Today the containers run on Amazon EC2 instances that the operations team must patch and scale. The company wants to stop managing these instances while it continues to use Amazon ECS.

    What should the company do?
  fr: |
    Une entreprise exécute des services web conteneurisés sur Amazon ECS. Aujourd'hui, les conteneurs s'exécutent sur des instances Amazon EC2 que l'équipe d'exploitation doit corriger et mettre à l'échelle. L'entreprise veut ne plus gérer ces instances tout en continuant d'utiliser Amazon ECS.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Move the containers to larger EC2 instances to reduce the number of servers.", fr: "Déplacer les conteneurs vers des instances EC2 plus grandes pour réduire le nombre de serveurs." } }
    - { id: b, text: { en: "Run the ECS tasks on AWS Fargate.", fr: "Exécuter les tâches ECS sur AWS Fargate." } }
    - { id: c, text: { en: "Store the container images in Amazon ECR.", fr: "Stocker les images de conteneurs dans Amazon ECR." } }
    - { id: d, text: { en: "Run the containers on AWS Outposts.", fr: "Exécuter les conteneurs sur AWS Outposts." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Fargate is a technology used with Amazon ECS to run containers without having to manage servers or clusters of Amazon EC2 instances. The company no longer provisions, configures, or scales the virtual machines that run its containers."
    fr: "AWS Fargate est une technologie utilisée avec Amazon ECS pour exécuter des conteneurs sans avoir à gérer de serveurs ni de clusters d'instances Amazon EC2. L'entreprise ne provisionne, ne configure et ne met plus à l'échelle les machines virtuelles qui exécutent ses conteneurs."
  options:
    a:
      en: "Fewer, larger instances are still servers that the team must patch and scale."
      fr: "Des instances moins nombreuses mais plus grandes restent des serveurs que l'équipe doit corriger et mettre à l'échelle."
    c:
      en: "Amazon ECR stores images; it does not change where the containers run or remove the instances to manage."
      fr: "Amazon ECR stocke les images ; il ne change pas l'endroit où s'exécutent les conteneurs et ne supprime pas les instances à gérer."
    d:
      en: "Outposts runs AWS infrastructure on premises; it does not remove the need to manage container hosts."
      fr: "Outposts exécute une infrastructure AWS sur site ; il ne supprime pas la gestion des hôtes de conteneurs."
references:
  - title: Architect for AWS Fargate for Amazon ECS
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html
