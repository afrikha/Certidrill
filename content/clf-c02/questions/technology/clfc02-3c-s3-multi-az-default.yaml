id: clfc02-3c-s3-multi-az-default
objective: "3.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to store data in an AWS storage service that keeps copies in at least three Availability Zones by default and can be accessed from anywhere in the Region.

    Which solution will meet these requirements?
  fr: |
    Une entreprise souhaite stocker des données dans un service de stockage AWS qui conserve par défaut des copies dans au moins trois zones de disponibilité et qui est accessible depuis n'importe quel endroit de la Région.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An Amazon EBS gp3 volume", fr: "Un volume Amazon EBS gp3" }
    - id: b
      text: { en: "An EC2 instance store volume", fr: "Un volume de stockage d'instance EC2" }
    - id: c
      text: { en: "An Amazon EFS One Zone file system", fr: "Un système de fichiers Amazon EFS One Zone" }
    - id: d
      text: { en: "An Amazon S3 bucket using S3 Standard", fr: "Un compartiment Amazon S3 utilisant S3 Standard" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      S3 Standard stores objects across at least three Availability Zones and is designed for 99.999999999 % durability. Objects in the bucket are reachable through the S3 API from any Availability Zone in the Region.
    fr: |-
      S3 Standard stocke les objets dans au moins trois zones de disponibilité et est conçu pour une durabilité de 99,999999999 %. Les objets du compartiment sont accessibles via l'API S3 depuis n'importe quelle zone de disponibilité de la Région.
  options:
    a:
      en: |-
        An EBS volume is replicated within one Availability Zone and attaches only to instances in that zone.
      fr: |-
        Un volume EBS est répliqué au sein d'une seule zone de disponibilité et ne s'attache qu'à des instances de cette zone.
    b:
      en: |-
        Instance store uses disks attached to a single host, and its data is lost when the instance stops or the disk fails.
      fr: |-
        Le stockage d'instance utilise des disques attachés à un seul hôte, et ses données sont perdues à l'arrêt de l'instance ou en cas de défaillance du disque.
    c:
      en: |-
        EFS One Zone stores data in a single Availability Zone; a Regional EFS file system would be needed for multi-AZ storage.
      fr: |-
        EFS One Zone stocke les données dans une seule zone de disponibilité ; il faudrait un système de fichiers EFS Regional pour un stockage multi-AZ.
references:
  - title: "Understanding and managing Amazon S3 storage classes - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
  - title: "Amazon EBS volumes - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes.html
