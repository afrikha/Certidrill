id: clfc02-3a-identify-hybrid-vpn
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company keeps its inventory system in its own data center. It runs a new online store on AWS, and the store reads inventory data from the data center over an AWS Site-to-Site VPN connection.

    Which deployment model does the company use?
  fr: |
    Une entreprise de distribution conserve son système de gestion des stocks dans son propre centre de données. Elle exécute une nouvelle boutique en ligne sur AWS, et la boutique lit les données de stock du centre de données par une connexion AWS Site-to-Site VPN.

    Quel modèle de déploiement l'entreprise utilise-t-elle ?
body:
  options:
    - { id: a, text: { en: "Cloud", fr: "Cloud" } }
    - { id: b, text: { en: "Hybrid", fr: "Hybride" } }
    - { id: c, text: { en: "On-premises", fr: "Sur site" } }
    - { id: d, text: { en: "Private cloud", fr: "Cloud privé" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The company connects applications running in the cloud with existing resources that stay outside the cloud, which is a hybrid deployment. A VPN or AWS Direct Connect connection commonly links the two environments.
    fr: |
      L'entreprise relie des applications exécutées dans le cloud à des ressources existantes qui restent hors du cloud : c'est un déploiement hybride. Une connexion VPN ou AWS Direct Connect relie couramment les deux environnements.
  options:
    a: { en: "In a cloud deployment all parts of the application run in the cloud, but the inventory system stays in the data center.", fr: "Dans un déploiement cloud, toutes les parties de l'application s'exécutent dans le cloud, or le système de stock reste dans le centre de données." }
    c: { en: "An on-premises deployment keeps everything in the company's facilities, but the online store runs on AWS.", fr: "Un déploiement sur site garde tout dans les locaux de l'entreprise, or la boutique en ligne s'exécute sur AWS." }
    d: { en: "Private cloud is another name for the on-premises model, which does not include the AWS-hosted store.", fr: "Le cloud privé est un autre nom du modèle sur site, qui n'inclut pas la boutique hébergée sur AWS." }
references:
  - title: Types of cloud computing
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/types-of-cloud-computing.html
