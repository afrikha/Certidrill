id: clfc02-3e-stream-desktops-apps
objective: "3.8.12"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants to stop installing software on employee laptops. The software must run on AWS, and only its display must be sent to the laptops.

    Which AWS services can meet this requirement? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise veut cesser d'installer des logiciels sur les ordinateurs portables de ses employés. Les logiciels doivent s'exécuter sur AWS, et seul leur affichage doit être envoyé aux ordinateurs portables.

    Quels services AWS peuvent répondre à cette exigence ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Amazon CloudFront", fr: "Amazon CloudFront" } }
    - { id: b, text: { en: "Amazon WorkSpaces", fr: "Amazon WorkSpaces" } }
    - { id: c, text: { en: "AWS Outposts", fr: "AWS Outposts" } }
    - { id: d, text: { en: "AWS Amplify", fr: "AWS Amplify" } }
    - { id: e, text: { en: "Amazon AppStream 2.0", fr: "Amazon AppStream 2.0" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Amazon WorkSpaces runs virtual desktops in the AWS Cloud that users reach from their devices or a web browser. Amazon AppStream 2.0, now documented as Amazon WorkSpaces Applications, streams desktop applications that run on AWS compute, and data is never stored on users' devices. In both cases the software runs on AWS and users receive only its display."
    fr: "Amazon WorkSpaces exécute des bureaux virtuels dans le Cloud AWS, auxquels les utilisateurs accèdent depuis leurs appareils ou un navigateur web. Amazon AppStream 2.0, désormais documenté sous le nom Amazon WorkSpaces Applications, diffuse en streaming des applications de bureau qui s'exécutent sur des ressources de calcul AWS, et les données ne sont jamais stockées sur les appareils des utilisateurs. Dans les deux cas, les logiciels s'exécutent sur AWS et les utilisateurs ne reçoivent que leur affichage."
  options:
    a:
      en: "CloudFront caches and delivers web content from edge locations; it does not run software for users."
      fr: "CloudFront met en cache et diffuse du contenu web depuis des emplacements périphériques ; il n'exécute pas de logiciels pour les utilisateurs."
    c:
      en: "Outposts runs AWS infrastructure in the customer's own data center; it does not stream software displays to laptops."
      fr: "Outposts exécute une infrastructure AWS dans le centre de données du client ; il ne diffuse pas l'affichage de logiciels vers des ordinateurs portables."
    d:
      en: "Amplify builds and hosts web and mobile applications; it does not stream existing software to employees."
      fr: "Amplify sert à créer et héberger des applications web et mobiles ; il ne diffuse pas de logiciels existants vers les employés."
references:
  - title: What is Amazon WorkSpaces?
    url: https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces.html
  - title: What Is Amazon WorkSpaces Applications?
    url: https://docs.aws.amazon.com/appstream2/latest/developerguide/what-is-appstream.html
