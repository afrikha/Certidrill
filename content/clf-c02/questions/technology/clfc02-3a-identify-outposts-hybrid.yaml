id: clfc02-3a-identify-outposts-hybrid
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturer installs AWS Outposts racks in its factory to process machine data locally with low latency. The Outposts racks are connected to an AWS Region and are managed with the same AWS APIs and tools as the company's workloads that run in that Region.

    Which deployment model does the company use?
  fr: |
    Un fabricant installe des racks AWS Outposts dans son usine pour traiter localement les données des machines avec une faible latence. Les racks Outposts sont reliés à une Région AWS et sont gérés avec les mêmes API et outils AWS que les charges de travail de l'entreprise qui s'exécutent dans cette Région.

    Quel modèle de déploiement l'entreprise utilise-t-elle ?
body:
  options:
    - { id: a, text: { en: "Hybrid", fr: "Hybride" } }
    - { id: b, text: { en: "Cloud", fr: "Cloud" } }
    - { id: c, text: { en: "On-premises", fr: "Sur site" } }
    - { id: d, text: { en: "Private cloud", fr: "Cloud privé" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      AWS Outposts extends AWS infrastructure, services, APIs, and tools to the customer's premises, and each Outpost is connected to an AWS Region. Combining resources on premises with resources in the Region, managed as one environment, is a hybrid deployment.
    fr: |
      AWS Outposts étend l'infrastructure, les services, les API et les outils AWS aux locaux du client, et chaque Outpost est relié à une Région AWS. Combiner des ressources sur site et des ressources dans la Région, gérées comme un seul environnement, constitue un déploiement hybride.
  options:
    b: { en: "Part of the workload runs in the factory, outside an AWS Region, so not all parts run in the cloud.", fr: "Une partie de la charge de travail s'exécute dans l'usine, hors d'une Région AWS : toutes les parties ne s'exécutent pas dans le cloud." }
    c: { en: "The racks are on site, but they are connected to and managed from an AWS Region alongside cloud workloads, which goes beyond an on-premises deployment.", fr: "Les racks sont sur site, mais ils sont reliés à une Région AWS et gérés depuis celle-ci avec des charges de travail cloud, ce qui va au-delà d'un déploiement sur site." }
    d: { en: "Private cloud is the on-premises model built with the company's own virtualization tools, not AWS infrastructure connected to a Region.", fr: "Le cloud privé est le modèle sur site construit avec les propres outils de virtualisation de l'entreprise, pas une infrastructure AWS reliée à une Région." }
references:
  - title: What is AWS Outposts?
    url: https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html
  - title: Types of cloud computing
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/types-of-cloud-computing.html
