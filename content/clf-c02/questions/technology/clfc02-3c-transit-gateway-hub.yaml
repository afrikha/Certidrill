id: clfc02-3c-transit-gateway-hub
objective: "3.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 40 VPCs in one AWS Region and several on-premises networks connected through VPN. It wants a central hub that routes traffic between all of them instead of managing many point-to-point connections.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise possède 40 VPC dans une Région AWS et plusieurs réseaux sur site connectés par VPN. Elle souhaite un hub central qui achemine le trafic entre tous ces réseaux au lieu de gérer de nombreuses connexions point à point.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "AWS Transit Gateway", fr: "AWS Transit Gateway" }
    - id: b
      text: { en: "AWS Global Accelerator", fr: "AWS Global Accelerator" }
    - id: c
      text: { en: "Amazon CloudFront", fr: "Amazon CloudFront" }
    - id: d
      text: { en: "AWS PrivateLink", fr: "AWS PrivateLink" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS Transit Gateway is a network transit hub that interconnects VPCs and on-premises networks. VPCs, VPN connections and Direct Connect gateways attach to it, and its route tables control traffic between them, which avoids a mesh of point-to-point connections.
    fr: |-
      AWS Transit Gateway est un hub de transit réseau qui interconnecte des VPC et des réseaux sur site. Les VPC, les connexions VPN et les passerelles Direct Connect s'y rattachent, et ses tables de routage contrôlent le trafic entre eux, ce qui évite un maillage de connexions point à point.
  options:
    b:
      en: |-
        Global Accelerator improves the performance of internet-facing applications with static IP addresses; it does not route traffic between VPCs and on-premises networks.
      fr: |-
        Global Accelerator améliore les performances d'applications exposées sur Internet grâce à des adresses IP statiques ; il n'achemine pas le trafic entre des VPC et des réseaux sur site.
    c:
      en: |-
        CloudFront caches and delivers web content to viewers; it is not a routing hub between networks.
      fr: |-
        CloudFront met en cache et distribue du contenu web aux utilisateurs ; ce n'est pas un hub de routage entre réseaux.
    d:
      en: |-
        PrivateLink exposes a specific service privately through endpoints; it does not route traffic between whole networks.
      fr: |-
        PrivateLink expose un service précis de façon privée via des points de terminaison ; il n'achemine pas le trafic entre des réseaux entiers.
references:
  - title: "What is AWS Transit Gateway for Amazon VPC? - Amazon VPC"
    url: https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html
