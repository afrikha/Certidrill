id: clfc02-3b-compute-beanstalk-upload-code
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A development team wants to deploy a Java web application by uploading its code. AWS must handle capacity provisioning, load balancing, scaling, and health monitoring, and the team does not want to write infrastructure templates.

    Which AWS service will meet these requirements?
  fr: |
    Une équipe de développement veut déployer une application web Java en chargeant son code. AWS doit gérer le provisionnement de la capacité, l'équilibrage de charge, la mise à l'échelle et la surveillance de l'état, et l'équipe ne veut pas écrire de modèles d'infrastructure.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Elastic Beanstalk" }
    - { id: b, text: "Amazon Lightsail" }
    - { id: c, text: "AWS CloudFormation" }
    - { id: d, text: "AWS Batch" }
answer: { optionId: a }
explanation:
  correct:
    en: "With Elastic Beanstalk, developers upload application code and the service provisions the resources, configures load balancing, sets up health monitoring, and scales the environment. The resources are created in the customer's account, and the company pays only for the resources that the application uses."
    fr: "Avec Elastic Beanstalk, les développeurs chargent le code de l'application et le service provisionne les ressources, configure l'équilibrage de charge, met en place la surveillance de l'état et met l'environnement à l'échelle. Les ressources sont créées dans le compte du client, et l'entreprise ne paie que les ressources utilisées par l'application."
  options:
    b:
      en: "Lightsail provides bundled virtual servers that the team would configure and scale itself; it does not deploy uploaded code with automatic scaling and health monitoring."
      fr: "Lightsail fournit des serveurs virtuels forfaitaires que l'équipe configurerait et mettrait à l'échelle elle-même ; il ne déploie pas du code chargé avec une mise à l'échelle et une surveillance de l'état automatiques."
    c:
      en: "CloudFormation creates resources from templates that the team must write; it does not take application code and manage the application environment for the team."
      fr: "CloudFormation crée des ressources à partir de modèles que l'équipe doit écrire ; il ne prend pas le code de l'application pour gérer l'environnement à la place de l'équipe."
    d:
      en: "AWS Batch runs batch computing jobs from a queue; it is not designed to host a web application."
      fr: "AWS Batch exécute des tâches de calcul par lots depuis une file d'attente ; il n'est pas conçu pour héberger une application web."
references:
  - title: What is AWS Elastic Beanstalk?
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html
