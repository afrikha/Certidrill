id: clfc02-3e-secure-browser-contractors
objective: "3.8.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company hires contractors who use their own laptops. The contractors need access only to internal websites and SaaS web applications. Company data must not be stored on the laptops, and the company does not want to set up VPN connections.

    Which AWS service will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise fait appel à des prestataires qui utilisent leurs propres ordinateurs portables. Les prestataires ont uniquement besoin d'accéder à des sites web internes et à des applications web SaaS. Les données de l'entreprise ne doivent pas être stockées sur les ordinateurs portables, et l'entreprise ne veut pas configurer de connexions VPN.

    Quel service AWS répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "AWS Client VPN", fr: "AWS Client VPN" } }
    - { id: b, text: { en: "Amazon WorkSpaces", fr: "Amazon WorkSpaces" } }
    - { id: c, text: { en: "Amazon CloudFront", fr: "Amazon CloudFront" } }
    - { id: d, text: { en: "Amazon WorkSpaces Secure Browser", fr: "Amazon WorkSpaces Secure Browser" } }
answer: { optionId: d }
explanation:
  correct:
    en: "WorkSpaces Secure Browser is a managed browser that runs on AWS and gives access to private websites and SaaS web applications from any modern browser, without appliances or VPN connections to manage. Web content reaches the user's browser as a visual stream, so data is not stored on the device."
    fr: "WorkSpaces Secure Browser est un navigateur géré qui s'exécute sur AWS et donne accès à des sites web privés et à des applications web SaaS depuis n'importe quel navigateur moderne, sans appliance ni connexion VPN à gérer. Le contenu web arrive dans le navigateur de l'utilisateur sous forme de flux visuel : aucune donnée n'est stockée sur l'appareil."
  options:
    a:
      en: "Client VPN is exactly the VPN connection the company wants to avoid, and data would still be downloaded to the laptops."
      fr: "Client VPN est précisément la connexion VPN que l'entreprise veut éviter, et les données seraient tout de même téléchargées sur les ordinateurs portables."
    b:
      en: "WorkSpaces would protect the data, but a full virtual desktop for each contractor adds images and desktops to manage when only web access is needed."
      fr: "WorkSpaces protégerait les données, mais un bureau virtuel complet par prestataire ajoute des images et des bureaux à gérer alors que seul un accès web est nécessaire."
    c:
      en: "CloudFront speeds up delivery of web content; it does not keep data off unmanaged devices or give access to internal websites."
      fr: "CloudFront accélère la diffusion de contenu web ; il n'empêche pas le stockage de données sur des appareils non gérés et ne donne pas accès à des sites internes."
references:
  - title: Amazon WorkSpaces Secure Browser FAQs
    url: https://aws.amazon.com/workspaces/secure-browser/faqs/
