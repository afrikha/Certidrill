id: clfc02-3a-cli-shell-scripts
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A system administrator works in a Linux terminal. The administrator wants to run AWS commands from the shell and combine them in shell scripts to automate daily administrative tasks, without writing application code.

    Which AWS option should the administrator use?
  fr: |
    Un administrateur système travaille dans un terminal Linux. Il veut exécuter des commandes AWS depuis le shell et les combiner dans des scripts shell pour automatiser des tâches d'administration quotidiennes, sans écrire de code d'application.

    Quelle option AWS l'administrateur doit-il utiliser ?
body:
  options:
    - { id: a, text: "AWS Command Line Interface (AWS CLI)" }
    - { id: b, text: "AWS Management Console" }
    - { id: c, text: "AWS SDK for Java" }
    - { id: d, text: "AWS Console Mobile Application" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The AWS CLI is a tool for running AWS commands in a command-line shell such as bash or zsh. Its commands can be combined in shell scripts to manage resources automatically, and it offers functionality equivalent to the console from the terminal.
    fr: |
      L'AWS CLI est un outil qui exécute des commandes AWS dans un shell en ligne de commande comme bash ou zsh. Ses commandes peuvent être combinées dans des scripts shell pour gérer les ressources automatiquement, et il offre depuis le terminal des fonctionnalités équivalentes à celles de la console.
  options:
    b: { en: "The console is a graphical web interface; its clicks cannot be combined in shell scripts.", fr: "La console est une interface web graphique ; ses clics ne peuvent pas être combinés dans des scripts shell." }
    c: { en: "The SDK for Java requires writing and building Java application code, which the administrator wants to avoid.", fr: "Le SDK for Java exige d'écrire et de compiler du code d'application Java, ce que l'administrateur veut éviter." }
    d: { en: "The mobile app runs on phones and does not run commands from a Linux shell.", fr: "L'application mobile fonctionne sur téléphone et n'exécute pas de commandes depuis un shell Linux." }
references:
  - title: What is the AWS Command Line Interface?
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-welcome.html
