id: clfc02-3a-identify-cloud-startup
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup has no data center and no servers of its own. It runs its whole application on AWS, with Amazon EC2 instances, an Amazon RDS database, and Amazon S3 buckets.

    Which deployment model does the startup use?
  fr: |
    Une start-up ne possède ni centre de données ni serveurs. Elle exécute toute son application sur AWS, avec des instances Amazon EC2, une base de données Amazon RDS et des compartiments Amazon S3.

    Quel modèle de déploiement la start-up utilise-t-elle ?
body:
  options:
    - { id: a, text: { en: "Hybrid", fr: "Hybride" } }
    - { id: b, text: { en: "On-premises", fr: "Sur site" } }
    - { id: c, text: { en: "Private cloud", fr: "Cloud privé" } }
    - { id: d, text: { en: "Cloud", fr: "Cloud" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      All parts of the application run in the cloud and nothing is connected to resources outside it, so the startup uses the cloud deployment model. Using both low-level services (EC2) and managed services (RDS, S3) does not change the model.
    fr: |
      Toutes les parties de l'application s'exécutent dans le cloud et rien n'est relié à des ressources extérieures : la start-up utilise le modèle de déploiement cloud. Utiliser à la fois des services de bas niveau (EC2) et des services gérés (RDS, S3) ne change pas le modèle.
  options:
    a: { en: "A hybrid deployment requires resources outside the cloud, and the startup has none.", fr: "Un déploiement hybride suppose des ressources hors du cloud, et la start-up n'en a aucune." }
    b: { en: "An on-premises deployment runs in the company's own data center, which the startup does not have.", fr: "Un déploiement sur site s'exécute dans le propre centre de données de l'entreprise, que la start-up ne possède pas." }
    c: { en: "Private cloud is another name for the on-premises model.", fr: "Le cloud privé est un autre nom du modèle sur site." }
references:
  - title: Types of cloud computing
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/types-of-cloud-computing.html
