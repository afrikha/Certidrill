id: clfc02-3c-dynamodb-serverless-kv
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building a mobile app backend. It needs a serverless, fully managed key-value database that delivers single-digit millisecond performance at any scale.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise développe le backend d'une application mobile. Elle a besoin d'une base de données clé-valeur sans serveur et entièrement gérée, qui offre des performances de l'ordre de quelques millisecondes à n'importe quelle échelle.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Amazon RDS", fr: "Amazon RDS" }
    - id: b
      text: { en: "Amazon Redshift", fr: "Amazon Redshift" }
    - id: c
      text: { en: "Amazon DynamoDB", fr: "Amazon DynamoDB" }
    - id: d
      text: { en: "Amazon Aurora", fr: "Amazon Aurora" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon DynamoDB is a serverless, fully managed NoSQL database that supports key-value and document data models. It delivers consistent single-digit millisecond performance whether an application has a hundred or a hundred million users, with no servers to provision or patch.
    fr: |-
      Amazon DynamoDB est une base de données NoSQL sans serveur et entièrement gérée qui prend en charge les modèles de données clé-valeur et document. Elle offre des performances constantes de l'ordre de quelques millisecondes, que l'application compte cent ou cent millions d'utilisateurs, sans serveur à provisionner ni à corriger.
  options:
    a:
      en: |-
        Amazon RDS is a managed relational database service based on tables and SQL, not a serverless key-value store.
      fr: |-
        Amazon RDS est un service de bases de données relationnelles gérées, fondé sur des tables et SQL, et non un magasin clé-valeur sans serveur.
    b:
      en: |-
        Amazon Redshift is a data warehouse for analytical SQL queries on large datasets, not a key-value database for an app backend.
      fr: |-
        Amazon Redshift est un entrepôt de données destiné aux requêtes SQL analytiques sur de grands jeux de données, et non une base clé-valeur pour le backend d'une application.
    d:
      en: |-
        Amazon Aurora is a relational database compatible with MySQL and PostgreSQL; it does not use a key-value data model.
      fr: |-
        Amazon Aurora est une base de données relationnelle compatible avec MySQL et PostgreSQL ; elle n'utilise pas de modèle de données clé-valeur.
references:
  - title: "What is Amazon DynamoDB? - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
