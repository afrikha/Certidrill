id: clfc02-3a-global-accelerator-udp
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A gaming company runs a multiplayer game server that uses UDP in two AWS Regions. Players worldwide must connect through a fixed set of static IP addresses, and their traffic must enter the AWS global network at the edge location nearest to them.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo exécute un serveur de jeu multijoueur qui utilise UDP dans deux Régions AWS. Les joueurs du monde entier doivent se connecter au moyen d'un ensemble fixe d'adresses IP statiques, et leur trafic doit entrer dans le réseau mondial AWS à l'emplacement périphérique le plus proche.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon CloudFront" }
    - { id: b, text: "AWS Direct Connect" }
    - { id: c, text: "Amazon Route 53" }
    - { id: d, text: "AWS Global Accelerator" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Global Accelerator provides static anycast IP addresses announced from AWS edge locations, so players' traffic enters the AWS global network close to them. It works at the network layer, supports TCP and UDP, and directs traffic to healthy endpoints in one or more Regions.
    fr: |
      Global Accelerator fournit des adresses IP anycast statiques annoncées depuis les emplacements périphériques AWS : le trafic des joueurs entre dans le réseau mondial AWS près d'eux. Il fonctionne au niveau de la couche réseau, prend en charge TCP et UDP, et dirige le trafic vers des points de terminaison sains dans une ou plusieurs Régions.
  options:
    a: { en: "CloudFront also uses edge locations, but it delivers HTTP and HTTPS content and does not carry a UDP game protocol or provide a fixed set of static IP addresses.", fr: "CloudFront utilise aussi des emplacements périphériques, mais il diffuse du contenu HTTP et HTTPS : il ne transporte pas un protocole de jeu UDP et ne fournit pas un ensemble fixe d'adresses IP statiques." }
    b: { en: "Direct Connect is a dedicated connection from a company's own network to AWS, not an entry point for players on the internet.", fr: "Direct Connect est une connexion dédiée entre le réseau d'une entreprise et AWS, pas un point d'entrée pour des joueurs sur Internet." }
    c: { en: "Route 53 answers DNS queries; it does not provide static IP addresses that carry the players' traffic over the AWS network.", fr: "Route 53 répond aux requêtes DNS ; il ne fournit pas d'adresses IP statiques qui transportent le trafic des joueurs sur le réseau AWS." }
references:
  - title: What is AWS Global Accelerator?
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html
  - title: How AWS Global Accelerator works
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction-how-it-works.html
