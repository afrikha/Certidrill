id: clfc02-3c-sg-nacl-statements
objective: "3.5.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company uses both security groups and network ACLs to protect a VPC.

    Which statements are correct? (Choose two.)
  fr: |
    Une entreprise utilise à la fois des groupes de sécurité et des ACL réseau pour protéger un VPC.

    Quelles affirmations sont correctes ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Network ACLs are stateful, so return traffic is allowed automatically.", fr: "Les ACL réseau sont avec état : le trafic de retour est autorisé automatiquement." }
    - id: b
      text: { en: "Security groups are stateful, so return traffic is allowed automatically.", fr: "Les groupes de sécurité sont avec état : le trafic de retour est autorisé automatiquement." }
    - id: c
      text: { en: "Security groups support explicit deny rules for specific IP addresses.", fr: "Les groupes de sécurité prennent en charge des règles de refus explicites pour des adresses IP précises." }
    - id: d
      text: { en: "Security groups are applied at the subnet level to all its instances.", fr: "Les groupes de sécurité s'appliquent au niveau du sous-réseau à toutes ses instances." }
    - id: e
      text: { en: "Network ACLs evaluate rules in ascending order until one matches.", fr: "Les ACL réseau évaluent les règles dans l'ordre croissant jusqu'à ce que l'une d'elles corresponde." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Security groups are stateful: return traffic for an allowed connection is allowed automatically, and all their rules are evaluated before a decision. Network ACLs are stateless and evaluate their numbered rules in ascending order, applying the first rule that matches the traffic.
    fr: |-
      Les groupes de sécurité sont avec état : le trafic de retour d'une connexion autorisée est autorisé automatiquement, et toutes leurs règles sont évaluées avant une décision. Les ACL réseau sont sans état et évaluent leurs règles numérotées dans l'ordre croissant, en appliquant la première règle qui correspond au trafic.
  options:
    a:
      en: |-
        Network ACLs are stateless: return traffic must be allowed explicitly by a rule.
      fr: |-
        Les ACL réseau sont sans état : le trafic de retour doit être autorisé explicitement par une règle.
    c:
      en: |-
        Security groups contain allow rules only; deny rules exist in network ACLs.
      fr: |-
        Les groupes de sécurité ne contiennent que des règles d'autorisation ; les règles de refus existent dans les ACL réseau.
    d:
      en: |-
        Security groups apply at the instance level, to the instances associated with them; network ACLs apply at the subnet level.
      fr: |-
        Les groupes de sécurité s'appliquent au niveau de l'instance, aux instances qui leur sont associées ; ce sont les ACL réseau qui s'appliquent au niveau du sous-réseau.
references:
  - title: "Infrastructure security in Amazon VPC - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/infrastructure-security.html
