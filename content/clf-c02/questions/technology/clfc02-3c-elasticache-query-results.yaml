id: clfc02-3c-elasticache-query-results
objective: "3.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's web application runs the same expensive queries against an Amazon RDS database many times each minute. The company wants to keep the query results in memory to reduce the load on the database and improve read latency.

    Which AWS service will meet these requirements?
  fr: |
    L'application web d'une entreprise exécute les mêmes requêtes coûteuses sur une base de données Amazon RDS de nombreuses fois par minute. L'entreprise souhaite conserver les résultats des requêtes en mémoire afin de réduire la charge de la base de données et d'améliorer la latence de lecture.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon Redshift", fr: "Amazon Redshift" }
    - id: b
      text: { en: "Amazon ElastiCache", fr: "Amazon ElastiCache" }
    - id: c
      text: { en: "Amazon DocumentDB", fr: "Amazon DocumentDB" }
    - id: d
      text: { en: "Amazon Neptune", fr: "Amazon Neptune" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon ElastiCache is a managed, distributed in-memory data store and cache. Placed in front of Amazon RDS, it serves cached query results from RAM with microsecond latency, which reduces the number of queries that reach the database.
    fr: |-
      Amazon ElastiCache est un magasin de données et un cache en mémoire distribués et gérés. Placé devant Amazon RDS, il sert depuis la RAM les résultats de requêtes mis en cache avec une latence de l'ordre de la microseconde, ce qui réduit le nombre de requêtes qui atteignent la base de données.
  options:
    a:
      en: |-
        Redshift is a disk-based data warehouse for analytics, not an in-memory cache in front of an operational database.
      fr: |-
        Redshift est un entrepôt de données sur disque destiné à l'analyse, et non un cache en mémoire placé devant une base de données opérationnelle.
    c:
      en: |-
        DocumentDB is a MongoDB-compatible document database; ElastiCache can cache in front of it, but it is not itself an in-memory cache.
      fr: |-
        DocumentDB est une base de données documentaire compatible avec MongoDB ; ElastiCache peut servir de cache devant elle, mais elle n'est pas elle-même un cache en mémoire.
    d:
      en: |-
        Neptune is a graph database for highly connected data, not a cache for query results.
      fr: |-
        Neptune est une base de données orientée graphe pour des données fortement connectées, et non un cache de résultats de requêtes.
references:
