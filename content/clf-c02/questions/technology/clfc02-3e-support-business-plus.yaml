id: clfc02-3e-support-business-plus
objective: "3.8.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is moving its first production workload to AWS. It needs 24x7 phone, web and chat access to AWS Cloud Support Engineers for technical issues, and it does not need a Technical Account Manager.

    Which AWS Support plan is the MOST cost-effective for this company?
  fr: |
    Une entreprise migre sa première charge de travail de production vers AWS. Elle a besoin d'un accès 24 h/24 et 7 j/7 par téléphone, sur le web et par chat aux ingénieurs du support cloud AWS pour des problèmes techniques, et elle n'a pas besoin de Technical Account Manager.

    Quel plan AWS Support est le PLUS rentable pour cette entreprise ?
body:
  options:
    - { id: a, text: { en: "Basic Support", fr: "Basic Support" } }
    - { id: b, text: { en: "AWS Business Support+", fr: "AWS Business Support+" } }
    - { id: c, text: { en: "AWS Enterprise Support", fr: "AWS Enterprise Support" } }
    - { id: d, text: { en: "AWS Unified Operations", fr: "AWS Unified Operations" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Business Support+ provides 24x7 phone, web and chat access to Cloud Support Engineers, unlimited technical cases and the full set of AWS Trusted Advisor checks. AWS describes it as the minimum recommended plan for production workloads, and it is the lowest-cost plan with technical support."
    fr: "Business Support+ fournit un accès 24 h/24 et 7 j/7 par téléphone, sur le web et par chat aux ingénieurs du support cloud, des cas techniques illimités et l'ensemble complet des vérifications AWS Trusted Advisor. AWS le présente comme le plan minimal recommandé pour les charges de travail de production, et c'est le plan le moins cher qui inclut le support technique."
  options:
    a:
      en: "Basic Support does not include technical support cases or access to Cloud Support Engineers."
      fr: "Basic Support n'inclut ni cas de support technique ni accès aux ingénieurs du support cloud."
    c:
      en: "Enterprise Support meets the need but adds a designated TAM and costs more, so it is not the most cost-effective."
      fr: "Enterprise Support répond au besoin mais ajoute un TAM désigné et coûte plus cher : ce n'est pas le plus rentable."
    d:
      en: "Unified Operations adds services on top of Enterprise Support, such as incident management engineers, that the company does not need."
      fr: "Unified Operations ajoute des services en plus d'Enterprise Support, comme des ingénieurs de gestion des incidents, dont l'entreprise n'a pas besoin."
references:
  - title: AWS Support Plans
    url: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
  - title: AWS Support plan comparison
    url: https://aws.amazon.com/premiumsupport/plans/
