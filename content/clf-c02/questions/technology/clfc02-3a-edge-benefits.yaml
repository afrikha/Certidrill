id: clfc02-3a-edge-benefits
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company puts Amazon CloudFront in front of a website whose origin servers run in one AWS Region.

    Which benefits does the company gain from CloudFront edge locations? (Choose two.)
  fr: |
    Une entreprise place Amazon CloudFront devant un site web dont les serveurs d'origine s'exécutent dans une Région AWS.

    Quels avantages l'entreprise tire-t-elle des emplacements périphériques CloudFront ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Users far from the Region receive cached content with lower latency.", fr: "Les utilisateurs éloignés de la Région reçoivent le contenu en cache avec une latence plus faible." } }
    - { id: b, text: { en: "The origin servers no longer need to run.", fr: "Les serveurs d'origine n'ont plus besoin de fonctionner." } }
    - { id: c, text: { en: "The website's database is replicated to every edge location.", fr: "La base de données du site est répliquée dans chaque emplacement périphérique." } }
    - { id: d, text: { en: "Fewer requests reach the origin servers because cached copies are served from the edge.", fr: "Moins de requêtes atteignent les serveurs d'origine, car les copies en cache sont servies depuis la périphérie." } }
    - { id: e, text: { en: "The company can launch Amazon EC2 instances in any edge location.", fr: "L'entreprise peut lancer des instances Amazon EC2 dans n'importe quel emplacement périphérique." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      CloudFront routes each request to the edge location with the lowest latency and serves cached content from there, so distant users get faster responses. When content is already cached at the edge, the request does not go back to the origin, which reduces the load on the origin servers.
    fr: |
      CloudFront dirige chaque requête vers l'emplacement périphérique offrant la latence la plus faible et y sert le contenu en cache : les utilisateurs éloignés obtiennent des réponses plus rapides. Quand le contenu est déjà en cache en périphérie, la requête ne retourne pas à l'origine, ce qui réduit la charge sur les serveurs d'origine.
  options:
    b: { en: "Edge locations cache copies but still fetch content that is not cached, or has expired, from the origin.", fr: "Les emplacements périphériques mettent des copies en cache, mais récupèrent toujours auprès de l'origine le contenu qui n'est pas en cache ou qui a expiré." }
    c: { en: "CloudFront caches responses; it does not replicate databases to edge locations.", fr: "CloudFront met des réponses en cache ; il ne réplique pas de bases de données dans les emplacements périphériques." }
    e: { en: "Edge locations run services such as CloudFront; customers launch EC2 instances in Availability Zones of a Region.", fr: "Les emplacements périphériques exécutent des services comme CloudFront ; les clients lancent les instances EC2 dans les zones de disponibilité d'une Région." }
references:
  - title: What is Amazon CloudFront?
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
