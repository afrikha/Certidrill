id: clfc02-3e-support-basic-billing
objective: "3.8.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A small company runs a test workload on AWS. It needs help only with account and billing questions and with service quota increases. It does not need technical support from AWS engineers.

    Which AWS Support plan is the MOST cost-effective for this company?
  fr: |
    Une petite entreprise exécute une charge de travail de test sur AWS. Elle a seulement besoin d'aide pour des questions de compte et de facturation et pour des augmentations de quotas de service. Elle n'a pas besoin du support technique d'ingénieurs AWS.

    Quel plan AWS Support est le PLUS rentable pour cette entreprise ?
body:
  options:
    - { id: a, text: { en: "AWS Business Support+", fr: "AWS Business Support+" } }
    - { id: b, text: { en: "AWS Enterprise Support", fr: "AWS Enterprise Support" } }
    - { id: c, text: { en: "Basic Support", fr: "Basic Support" } }
    - { id: d, text: { en: "AWS Unified Operations", fr: "AWS Unified Operations" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Basic Support is included for all AWS customers at no extra cost. It provides 24x7 one-on-one responses to account and billing questions, service quota increases, service health checks, forums and documentation, which covers this company's needs."
    fr: "Basic Support est inclus pour tous les clients AWS sans coût supplémentaire. Il fournit 24 h/24 et 7 j/7 des réponses individuelles aux questions de compte et de facturation, les augmentations de quotas de service, les vérifications de l'état des services, les forums et la documentation, ce qui couvre les besoins de cette entreprise."
  options:
    a:
      en: "Business Support+ adds paid technical support from Cloud Support Engineers, which the company does not need."
      fr: "Business Support+ ajoute un support technique payant par des ingénieurs du support cloud, dont l'entreprise n'a pas besoin."
    b:
      en: "Enterprise Support adds a designated Technical Account Manager and has a high monthly minimum, which is unnecessary here."
      fr: "Enterprise Support ajoute un Technical Account Manager désigné et a un minimum mensuel élevé, ce qui est inutile ici."
    d:
      en: "Unified Operations adds services on top of Enterprise Support, such as critical workload reviews, that a test workload does not need."
      fr: "Unified Operations ajoute des services en plus d'Enterprise Support, comme des revues de charges de travail critiques, dont une charge de test n'a pas besoin."
references:
  - title: AWS Support Plans
    url: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
