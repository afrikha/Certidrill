id: clfc02-3c-dms-ongoing-replication
objective: "3.4.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has converted the schema of its on-premises Oracle database to Amazon Aurora PostgreSQL-Compatible Edition and completed a full load of the data. Users keep updating the source database until the cutover weekend, and the target must stay in sync with those changes until then.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a converti le schéma de sa base de données Oracle sur site vers Amazon Aurora PostgreSQL-Compatible Edition et a terminé un chargement complet des données. Les utilisateurs continuent de modifier la base de données source jusqu'au week-end de bascule, et la cible doit rester synchronisée avec ces modifications jusque-là.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run the AWS Schema Conversion Tool (AWS SCT) again every night.", fr: "Exécuter de nouveau AWS Schema Conversion Tool (AWS SCT) chaque nuit." }
    - id: b
      text: { en: "Use AWS DMS Schema Conversion to apply the converted code again.", fr: "Utiliser AWS DMS Schema Conversion pour appliquer de nouveau le code converti." }
    - id: c
      text: { en: "Configure an AWS DMS task that replicates ongoing changes.", fr: "Configurer une tâche AWS DMS qui réplique les modifications en continu." }
    - id: d
      text: { en: "Replicate the database server with AWS Application Migration Service.", fr: "Répliquer le serveur de base de données avec AWS Application Migration Service." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS DMS can perform a one-time migration and then replicate ongoing changes, which keeps the source and the target in sync until the cutover. The target is Aurora, so the replication must also work across engines, which DMS supports.
    fr: |-
      AWS DMS peut effectuer une migration ponctuelle puis répliquer les modifications en continu, ce qui maintient la source et la cible synchronisées jusqu'à la bascule. La cible étant Aurora, la réplication doit aussi fonctionner entre moteurs différents, ce que DMS prend en charge.
  options:
    a:
      en: |-
        AWS SCT converts schemas and is mainly used for large data warehouse migrations; it does not support ongoing data replication.
      fr: |-
        AWS SCT convertit des schémas et sert surtout aux grandes migrations d'entrepôts de données ; il ne prend pas en charge la réplication continue des données.
    b:
      en: |-
        DMS Schema Conversion converts schemas and code objects; it does not copy changing data rows to the target.
      fr: |-
        DMS Schema Conversion convertit les schémas et les objets de code ; il ne copie pas vers la cible les lignes de données qui changent.
    d:
      en: |-
        Application Migration Service replicates a server to EC2 as is; it cannot keep an Oracle source in sync with an Aurora PostgreSQL target.
      fr: |-
        Application Migration Service réplique un serveur tel quel vers EC2 ; il ne peut pas synchroniser une source Oracle avec une cible Aurora PostgreSQL.
references:
  - title: "AWS Database Migration Service FAQs"
    url: https://aws.amazon.com/dms/faqs/
  - title: "What is AWS Database Migration Service? - AWS Database Migration Service"
    url: https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html
