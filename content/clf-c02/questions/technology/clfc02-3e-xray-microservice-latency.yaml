id: clfc02-3e-xray-microservice-latency
objective: "3.8.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer must find which microservice causes high latency in requests that pass through several services of a distributed application.

    Which AWS service should the developer use?
  fr: |
    Un développeur doit trouver quel microservice provoque une latence élevée dans les requêtes qui traversent plusieurs services d'une application distribuée.

    Quel service AWS le développeur doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" } }
    - { id: b, text: { en: "AWS CodeBuild", fr: "AWS CodeBuild" } }
    - { id: c, text: { en: "AWS Config", fr: "AWS Config" } }
    - { id: d, text: { en: "AWS X-Ray", fr: "AWS X-Ray" } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS X-Ray collects trace data about the requests that an application serves, including calls to downstream services, databases and APIs. Its trace map shows the front-end service and the services it calls, which helps find bottlenecks and latency spikes in distributed applications and microservices."
    fr: "AWS X-Ray collecte des données de suivi sur les requêtes traitées par une application, y compris les appels aux services, bases de données et API en aval. Sa carte de suivi (trace map) montre le service front-end et les services qu'il appelle, ce qui aide à trouver les goulets d'étranglement et les pics de latence dans les applications distribuées et les microservices."
  options:
    a:
      en: "CloudTrail records API calls made to AWS for auditing; it does not trace application requests across microservices."
      fr: "CloudTrail enregistre les appels d'API vers AWS à des fins d'audit ; il ne suit pas les requêtes applicatives entre microservices."
    b:
      en: "CodeBuild compiles code and runs tests; it does not analyze requests in a running application."
      fr: "CodeBuild compile le code et exécute des tests ; il n'analyse pas les requêtes d'une application en cours d'exécution."
    c:
      en: "AWS Config records resource configuration changes; it does not measure request latency."
      fr: "AWS Config enregistre les modifications de configuration des ressources ; il ne mesure pas la latence des requêtes."
references:
  - title: What is AWS X-Ray?
    url: https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html
