id: clfc02-3d-lex-chatbot
objective: "3.7.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank wants to add a chatbot to its website and mobile app. The chatbot must understand customers' requests in natural language, by text or voice, and help them check their account balance.

    Which AWS service should the bank use to build the chatbot?
  fr: |
    Une banque veut ajouter un chatbot à son site web et à son application mobile. Le chatbot doit comprendre les demandes des clients en langage naturel, par texte ou par voix, et les aider à consulter le solde de leur compte.

    Quel service AWS la banque doit-elle utiliser pour créer le chatbot ?
body:
  options:
    - { id: a, text: "Amazon Polly" }
    - { id: b, text: "Amazon Lex" }
    - { id: c, text: "Amazon Comprehend" }
    - { id: d, text: "Amazon Translate" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Lex is a service for building conversational interfaces that use voice and text. It recognizes the intent of what the user says or types and manages the conversation, which is how chatbots and virtual agents are built."
    fr: "Amazon Lex est un service de création d'interfaces conversationnelles utilisant la voix et le texte. Il reconnaît l'intention de ce que l'utilisateur dit ou tape et gère la conversation, ce qui permet de créer des chatbots et des agents virtuels."
  options:
    a:
      en: "Amazon Polly converts text to speech; it can give a bot a voice but does not understand requests or manage a conversation."
      fr: "Amazon Polly convertit du texte en parole ; il peut donner une voix à un bot, mais il ne comprend pas les demandes et ne gère pas de conversation."
    c:
      en: "Amazon Comprehend extracts insights such as sentiment and entities from text; it does not build conversational bots."
      fr: "Amazon Comprehend extrait d'un texte des informations comme le sentiment et les entités ; il ne crée pas de bots conversationnels."
    d:
      en: "Amazon Translate translates text between languages; it does not build conversational bots."
      fr: "Amazon Translate traduit du texte d'une langue à une autre ; il ne crée pas de bots conversationnels."
references:
  - title: What is Amazon Lex V2?
    url: https://docs.aws.amazon.com/lexv2/latest/dg/what-is.html
