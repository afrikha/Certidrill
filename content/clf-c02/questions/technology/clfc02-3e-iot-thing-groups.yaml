id: clfc02-3e-iot-thing-groups
objective: "3.8.14"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company registers its devices in AWS IoT Core. It wants to organize the devices by building and then by floor, so that permissions given to a building's group also apply to the groups of its floors and to their devices.

    What should the company use?
  fr: |
    Une entreprise enregistre ses appareils dans AWS IoT Core. Elle veut organiser les appareils par bâtiment puis par étage, de sorte que les autorisations accordées au groupe d'un bâtiment s'appliquent aussi aux groupes de ses étages et à leurs appareils.

    Que doit utiliser l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Nested organizational units (OUs) in AWS Organizations", fr: "Des unités d'organisation (OU) imbriquées dans AWS Organizations" } }
    - { id: b, text: { en: "Nested thing groups in the AWS IoT group registry", fr: "Des groupes d'objets imbriqués dans le registre de groupes AWS IoT" } }
    - { id: c, text: { en: "IAM user groups, one for each building and floor", fr: "Des groupes d'utilisateurs IAM, un par bâtiment et par étage" } }
    - { id: d, text: { en: "Tag-based groups in AWS Resource Groups", fr: "Des groupes basés sur des balises dans AWS Resource Groups" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The AWS IoT group registry organizes devices into groups that can be nested in a hierarchy. Actions taken and permissions given on a parent group apply to its child groups and to all their devices."
    fr: "Le registre de groupes AWS IoT organise les appareils en groupes qui peuvent être imbriqués dans une hiérarchie. Les actions effectuées et les autorisations accordées sur un groupe parent s'appliquent à ses groupes enfants et à tous leurs appareils."
  options:
    a:
      en: "Organizational units group AWS accounts in AWS Organizations, not IoT devices."
      fr: "Les unités d'organisation regroupent des comptes AWS dans AWS Organizations, pas des appareils IoT."
    c:
      en: "IAM user groups contain IAM users, not devices, and IAM user groups cannot be nested."
      fr: "Les groupes d'utilisateurs IAM contiennent des utilisateurs IAM, pas des appareils, et ils ne peuvent pas être imbriqués."
    d:
      en: "Resource Groups helps find and act on AWS resources that share tags; it does not give inherited permissions to IoT devices."
      fr: "Resource Groups permet de trouver des ressources AWS qui partagent des balises et d'agir sur elles ; il n'accorde pas d'autorisations héritées aux appareils IoT."
references:
  - title: How AWS IoT works
    url: https://docs.aws.amazon.com/iot/latest/developerguide/aws-iot-how-it-works.html
