id: clfc02-3a-dynamodb-global-tables
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs its application in two AWS Regions, one in Europe and one in North America. Players in each Region must read and write their data in an Amazon DynamoDB table in their own Region, and the data must be the same in both Regions.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo exécute son application dans deux Régions AWS, l'une en Europe et l'autre en Amérique du Nord. Les joueurs de chaque Région doivent lire et écrire leurs données dans une table Amazon DynamoDB de leur propre Région, et les données doivent être identiques dans les deux Régions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use a DynamoDB global table with a replica in each of the two Regions.", fr: "Utiliser une table globale DynamoDB avec un réplica dans chacune des deux Régions." } }
    - { id: b, text: { en: "Switch the table to on-demand capacity mode.", fr: "Passer la table en mode de capacité à la demande." } }
    - { id: c, text: { en: "Add DynamoDB Accelerator (DAX) in front of the table.", fr: "Ajouter DynamoDB Accelerator (DAX) devant la table." } }
    - { id: d, text: { en: "Take on-demand backups of the table every hour.", fr: "Effectuer des sauvegardes à la demande de la table toutes les heures." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A DynamoDB global table replicates a table automatically across the Regions that you choose. Every replica accepts reads and writes, so applications in each Region use a local table while DynamoDB keeps the replicas in sync.
    fr: |
      Une table globale DynamoDB réplique automatiquement une table dans les Régions choisies. Chaque réplica accepte les lectures et les écritures : les applications de chaque Région utilisent une table locale, tandis que DynamoDB synchronise les réplicas.
  options:
    b: { en: "On-demand capacity mode changes how throughput is billed and scaled; the table stays in one Region.", fr: "Le mode de capacité à la demande change la facturation et la mise à l'échelle du débit ; la table reste dans une seule Région." }
    c: { en: "DAX is an in-memory cache that speeds up reads in one Region; it does not replicate data to another Region.", fr: "DAX est un cache en mémoire qui accélère les lectures dans une Région ; il ne réplique pas les données dans une autre Région." }
    d: { en: "Backups allow a restore later; they do not give players a live, writable table in each Region.", fr: "Les sauvegardes permettent une restauration ultérieure ; elles ne donnent pas aux joueurs une table active et accessible en écriture dans chaque Région." }
references:
  - title: Global tables - multi-active, multi-Region replication
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html
