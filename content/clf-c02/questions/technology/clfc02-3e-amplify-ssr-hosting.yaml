id: clfc02-3e-amplify-ssr-hosting
objective: "3.8.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has built a Next.js web app that uses server-side rendering (SSR). It wants AWS to host the app with continuous deployment from its Git repository, without managing servers.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise a créé une application web Next.js qui utilise le rendu côté serveur (SSR). Elle veut qu'AWS héberge l'application avec un déploiement continu à partir de son dépôt Git, sans gérer de serveurs.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Amazon S3 static website hosting", fr: "L'hébergement de site web statique Amazon S3" } }
    - { id: b, text: { en: "AWS Amplify Hosting", fr: "AWS Amplify Hosting" } }
    - { id: c, text: { en: "Amazon EC2 instances behind an Application Load Balancer", fr: "Des instances Amazon EC2 derrière un Application Load Balancer" } }
    - { id: d, text: { en: "An Amazon CloudFront distribution in front of an S3 bucket", fr: "Une distribution Amazon CloudFront devant un compartiment S3" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amplify Hosting supports server-side rendered frameworks such as Next.js, deploys continuously from a connected Git repository, and serves the app through the AWS content delivery network. AWS runs the hosting infrastructure, so there are no servers to manage."
    fr: "Amplify Hosting prend en charge les frameworks à rendu côté serveur comme Next.js, déploie en continu à partir d'un dépôt Git connecté et sert l'application au moyen du réseau de diffusion de contenu d'AWS. AWS exécute l'infrastructure d'hébergement : il n'y a aucun serveur à gérer."
  options:
    a:
      en: "S3 static website hosting serves static files only; it cannot run server-side rendering, and it has no Git-based deployment."
      fr: "L'hébergement de site web statique S3 ne sert que des fichiers statiques ; il ne peut pas exécuter de rendu côté serveur et n'a pas de déploiement basé sur Git."
    c:
      en: "EC2 instances can run SSR, but the company would have to manage servers and build its own deployment process."
      fr: "Des instances EC2 peuvent exécuter le SSR, mais l'entreprise devrait gérer des serveurs et créer son propre processus de déploiement."
    d:
      en: "CloudFront with an S3 origin caches static content; it adds no server-side rendering and no continuous deployment from Git."
      fr: "CloudFront avec une origine S3 met en cache du contenu statique ; il n'apporte ni rendu côté serveur ni déploiement continu depuis Git."
references:
  - title: Welcome to AWS Amplify Hosting
    url: https://docs.aws.amazon.com/amplify/latest/userguide/welcome.html
