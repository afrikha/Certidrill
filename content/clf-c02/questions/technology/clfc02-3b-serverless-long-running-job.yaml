id: clfc02-3b-serverless-long-running-job
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has a containerized reporting job that runs once each day as a single process for about 10 hours. The process cannot be split into smaller steps. The company wants a serverless option so that it does not manage any servers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'une tâche de reporting conteneurisée qui s'exécute chaque jour en un seul processus pendant environ 10 heures. Le processus ne peut pas être découpé en étapes plus petites. L'entreprise veut une option sans serveur afin de ne gérer aucun serveur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run the job as an AWS Lambda function invoked once each day.", fr: "Exécuter la tâche sous forme de fonction AWS Lambda invoquée une fois par jour." } }
    - { id: b, text: { en: "Run the job on an Amazon EC2 instance that is started each day.", fr: "Exécuter la tâche sur une instance Amazon EC2 démarrée chaque jour." } }
    - { id: c, text: { en: "Run the job as an Amazon ECS task on AWS Fargate each day.", fr: "Exécuter la tâche sous forme de tâche Amazon ECS sur AWS Fargate chaque jour." } }
    - { id: d, text: { en: "Run the job on an Amazon Lightsail instance each day.", fr: "Exécuter la tâche sur une instance Amazon Lightsail chaque jour." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With AWS Fargate, Amazon ECS runs containers without servers or clusters of EC2 instances to provision, configure, or scale. A Fargate task runs until its process ends, so a 10-hour container job can run to completion."
    fr: "Avec AWS Fargate, Amazon ECS exécute des conteneurs sans serveur ni cluster d'instances EC2 à provisionner, configurer ou mettre à l'échelle. Une tâche Fargate s'exécute jusqu'à la fin de son processus : une tâche conteneurisée de 10 heures peut aller jusqu'au bout."
  options:
    a:
      en: "Lambda is serverless, but a 10-hour process is far longer than the maximum timeout of a Lambda function (minutes, not hours), even with Lambda's longest-running options."
      fr: "Lambda est sans serveur, mais un processus de 10 heures est bien plus long que la durée maximale d'une fonction Lambda (des minutes, pas des heures), même avec les options Lambda les plus longues."
    b:
      en: "An EC2 instance can run the job, but it is a server that the company must manage, which the requirement excludes."
      fr: "Une instance EC2 peut exécuter la tâche, mais c'est un serveur que l'entreprise doit gérer, ce que l'exigence exclut."
    d:
      en: "A Lightsail instance is a virtual server that the company manages; it is not a serverless option."
      fr: "Une instance Lightsail est un serveur virtuel que l'entreprise gère ; ce n'est pas une option sans serveur."
references:
  - title: Lambda quotas
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
  - title: Architect for AWS Fargate for Amazon ECS
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html
