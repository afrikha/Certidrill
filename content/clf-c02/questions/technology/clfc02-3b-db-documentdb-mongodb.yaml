id: clfc02-3b-db-documentdb-mongodb
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a self-managed MongoDB database that stores product catalogs as JSON documents. The company wants a fully managed AWS database service and wants to keep its existing MongoDB drivers, queries, and tools with few code changes.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise exécute une base de données MongoDB autogérée qui stocke des catalogues de produits sous forme de documents JSON. L'entreprise veut un service de base de données AWS entièrement géré et souhaite conserver ses pilotes, requêtes et outils MongoDB existants avec peu de modifications de code.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon DynamoDB" }
    - { id: b, text: "Amazon Neptune" }
    - { id: c, text: "Amazon DocumentDB (with MongoDB compatibility)" }
    - { id: d, text: "Amazon RDS for PostgreSQL" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon DocumentDB (with MongoDB compatibility) is a fully managed database service for MongoDB-compatible databases. The company can run the same application code and use the same drivers and tools that it uses with MongoDB, while AWS operates the database."
    fr: "Amazon DocumentDB (with MongoDB compatibility) est un service de base de données entièrement géré pour des bases compatibles avec MongoDB. L'entreprise peut exécuter le même code d'application et utiliser les mêmes pilotes et outils qu'avec MongoDB, tandis qu'AWS exploite la base de données."
  options:
    a:
      en: "DynamoDB is a fully managed NoSQL database that can store document data, but it has its own API, so MongoDB drivers and queries would have to be rewritten."
      fr: "DynamoDB est une base NoSQL entièrement gérée qui peut stocker des données de type document, mais elle a sa propre API : les pilotes et requêtes MongoDB devraient être réécrits."
    b:
      en: "Neptune is a graph database with graph query languages; it is not compatible with MongoDB."
      fr: "Neptune est une base orientée graphe avec des langages de requête de graphe ; il n'est pas compatible avec MongoDB."
    d:
      en: "RDS for PostgreSQL is a relational database queried with SQL; MongoDB drivers and queries would not work with it."
      fr: "RDS for PostgreSQL est une base relationnelle interrogée en SQL ; les pilotes et requêtes MongoDB ne fonctionneraient pas avec elle."
references:
  - title: What is Amazon DocumentDB (with MongoDB compatibility)
    url: https://docs.aws.amazon.com/documentdb/latest/developerguide/what-is.html
