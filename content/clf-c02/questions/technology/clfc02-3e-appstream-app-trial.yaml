id: clfc02-3e-appstream-app-trial
objective: "3.8.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software vendor wants prospects to try its Windows design application from a web browser without installing it. The application must run on AWS, and the vendor wants to maintain a single version of it.

    Which AWS service will meet these requirements?
  fr: |
    Un éditeur de logiciels souhaite que ses prospects essaient son application de conception Windows depuis un navigateur web, sans l'installer. L'application doit s'exécuter sur AWS, et l'éditeur veut n'en maintenir qu'une seule version.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon CloudFront", fr: "Amazon CloudFront" } }
    - { id: b, text: { en: "AWS Amplify", fr: "AWS Amplify" } }
    - { id: c, text: { en: "Amazon AppStream 2.0", fr: "Amazon AppStream 2.0" } }
    - { id: d, text: { en: "Amazon WorkSpaces Secure Browser", fr: "Amazon WorkSpaces Secure Browser" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon AppStream 2.0, now documented as Amazon WorkSpaces Applications, is a fully managed application streaming service. Existing desktop applications run on AWS without being rewritten, users stream them from a client or an HTML5 browser, and the vendor maintains a single version that every user gets."
    fr: "Amazon AppStream 2.0, désormais documenté sous le nom Amazon WorkSpaces Applications, est un service de streaming d'applications entièrement géré. Les applications de bureau existantes s'exécutent sur AWS sans être réécrites, les utilisateurs les diffusent depuis un client ou un navigateur HTML5, et l'éditeur maintient une seule version que reçoivent tous les utilisateurs."
  options:
    a:
      en: "CloudFront is a content delivery network that caches content at edge locations; it does not run desktop applications."
      fr: "CloudFront est un réseau de diffusion de contenu qui met en cache le contenu dans des emplacements périphériques ; il n'exécute pas d'applications de bureau."
    b:
      en: "Amplify builds and hosts web and mobile applications; it does not stream an existing Windows desktop application."
      fr: "Amplify sert à créer et héberger des applications web et mobiles ; il ne diffuse pas une application de bureau Windows existante."
    d:
      en: "WorkSpaces Secure Browser streams a web browser session for websites and web applications, not a Windows desktop application."
      fr: "WorkSpaces Secure Browser diffuse une session de navigateur pour des sites et applications web, pas une application de bureau Windows."
references:
  - title: What Is Amazon WorkSpaces Applications?
    url: https://docs.aws.amazon.com/appstream2/latest/developerguide/what-is-appstream.html
