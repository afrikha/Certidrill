id: clfc02-3c-heterogeneous-combo
objective: "3.4.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants to migrate an on-premises Microsoft SQL Server database to Amazon Aurora PostgreSQL-Compatible Edition. The database schema and code must be converted to the new engine, and the data must then be copied to Aurora.

    Which combination of AWS services will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise souhaite migrer une base de données Microsoft SQL Server sur site vers Amazon Aurora PostgreSQL-Compatible Edition. Le schéma et le code de la base de données doivent être convertis vers le nouveau moteur, puis les données doivent être copiées vers Aurora.

    Quelle combinaison de services AWS répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "AWS Application Migration Service", fr: "AWS Application Migration Service" }
    - id: b
      text: { en: "AWS Schema Conversion Tool (AWS SCT)", fr: "AWS Schema Conversion Tool (AWS SCT)" }
    - id: c
      text: { en: "AWS Backup", fr: "AWS Backup" }
    - id: d
      text: { en: "AWS Database Migration Service (AWS DMS)", fr: "AWS Database Migration Service (AWS DMS)" }
    - id: e
      text: { en: "Amazon ElastiCache", fr: "Amazon ElastiCache" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      This is a heterogeneous migration: AWS SCT converts the SQL Server schema to the PostgreSQL-compatible target engine, then AWS DMS copies the data from the source to Aurora. DMS supports migrations between different supported engines, and the source stays operational meanwhile.
    fr: |-
      Il s'agit d'une migration hétérogène : AWS SCT convertit le schéma SQL Server vers le moteur cible compatible avec PostgreSQL, puis AWS DMS copie les données de la source vers Aurora. DMS prend en charge les migrations entre différents moteurs pris en charge, et la source reste opérationnelle pendant ce temps.
  options:
    a:
      en: |-
        Application Migration Service rehosts whole servers on EC2; it converts neither the schema nor the engine.
      fr: |-
        Application Migration Service réhéberge des serveurs entiers sur EC2 ; il ne convertit ni le schéma ni le moteur.
    c:
      en: |-
        AWS Backup protects AWS resources with backup plans; it does not migrate data between engines.
      fr: |-
        AWS Backup protège des ressources AWS à l'aide de plans de sauvegarde ; il ne migre pas de données entre moteurs.
    e:
      en: |-
        ElastiCache is an in-memory cache and plays no role in converting or copying a database.
      fr: |-
        ElastiCache est un cache en mémoire et ne joue aucun rôle dans la conversion ou la copie d'une base de données.
references:
  - title: "AWS Database Migration Service FAQs"
    url: https://aws.amazon.com/dms/faqs/
  - title: "What is the AWS Schema Conversion Tool? - AWS Schema Conversion Tool"
    url: https://docs.aws.amazon.com/SchemaConversionTool/latest/userguide/CHAP_Welcome.html
