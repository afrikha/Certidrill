id: clfc02-3b-lb-nlb-tcp-static-ip
objective: "3.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A gaming company runs a multiplayer service that uses UDP and TCP traffic, must handle millions of requests per second, and needs a static IP address in each Availability Zone so that partners can allow it through their firewalls.

    Which type of load balancer should the company use?
  fr: |
    Une entreprise de jeux vidéo exécute un service multijoueur qui utilise du trafic UDP et TCP, doit traiter des millions de requêtes par seconde, et a besoin d'une adresse IP statique dans chaque zone de disponibilité pour que ses partenaires puissent l'autoriser dans leurs pare-feux.

    Quel type d'équilibreur de charge l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Application Load Balancer" }
    - { id: b, text: "Gateway Load Balancer" }
    - { id: c, text: { en: "Amazon CloudFront distribution", fr: "Distribution Amazon CloudFront" } }
    - { id: d, text: "Network Load Balancer" }
answer: { optionId: d }
explanation:
  correct:
    en: "A Network Load Balancer operates at layer 4, supports TCP and UDP, and can handle millions of requests per second. Each load balancer node gets a static IP address in its Availability Zone, and an internet-facing Network Load Balancer can use one Elastic IP address per enabled subnet."
    fr: "Un Network Load Balancer fonctionne en couche 4, prend en charge TCP et UDP et peut traiter des millions de requêtes par seconde. Chaque nœud de l'équilibreur de charge obtient une adresse IP statique dans sa zone de disponibilité, et un Network Load Balancer accessible depuis Internet peut utiliser une adresse IP Elastic par sous-réseau activé."
  options:
    a:
      en: "An Application Load Balancer routes HTTP and HTTPS requests at layer 7; it does not handle the UDP traffic of the game service."
      fr: "Un Application Load Balancer achemine les requêtes HTTP et HTTPS en couche 7 ; il ne traite pas le trafic UDP du service de jeu."
    b:
      en: "A Gateway Load Balancer sends traffic through third-party virtual appliances such as firewalls; it is not the front end of a game service."
      fr: "Un Gateway Load Balancer fait passer le trafic par des appliances virtuelles tierces comme des pare-feux ; ce n'est pas le point d'entrée d'un service de jeu."
    c:
      en: "CloudFront is a content delivery network that caches content at edge locations; it is not a load balancer for TCP and UDP game traffic."
      fr: "CloudFront est un réseau de diffusion de contenu qui met en cache le contenu dans des emplacements périphériques ; ce n'est pas un équilibreur de charge pour du trafic de jeu TCP et UDP."
references:
  - title: What is a Network Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html
