id: clfc02-3d-rekognition-images
objective: "3.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A real estate company wants to detect objects and scenes, such as kitchens, pools, and gardens, in photos that agents upload. The company does not want to build or train its own machine learning models.

    Which AWS service meets these requirements?
  fr: |
    Une agence immobilière veut détecter des objets et des scènes, comme des cuisines, des piscines et des jardins, dans les photos que téléchargent ses agents. L'entreprise ne veut pas créer ni entraîner ses propres modèles de machine learning.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Textract" }
    - { id: b, text: "Amazon Comprehend" }
    - { id: c, text: "Amazon Rekognition" }
    - { id: d, text: "Amazon Polly" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Rekognition adds image and video analysis to applications through a simple API and is built on deep learning technology. It detects objects, scenes, and concepts in images and videos, and it requires no machine learning expertise to use."
    fr: "Amazon Rekognition ajoute l'analyse d'images et de vidéos aux applications au moyen d'une API simple et repose sur une technologie de deep learning. Il détecte les objets, les scènes et les concepts dans les images et les vidéos, et son utilisation ne demande aucune expertise en machine learning."
  options:
    a:
      en: "Amazon Textract extracts printed and handwritten text and data from scanned documents; it does not label objects and scenes in photos."
      fr: "Amazon Textract extrait le texte imprimé et manuscrit et les données de documents numérisés ; il n'étiquette pas les objets et les scènes des photos."
    b:
      en: "Amazon Comprehend analyzes text with natural language processing; it does not analyze images."
      fr: "Amazon Comprehend analyse du texte par traitement du langage naturel ; il n'analyse pas les images."
    d:
      en: "Amazon Polly converts text into lifelike speech; it does not analyze images."
      fr: "Amazon Polly convertit du texte en parole réaliste ; il n'analyse pas les images."
references:
  - title: What is Amazon Rekognition?
    url: https://docs.aws.amazon.com/rekognition/latest/dg/what-is.html
