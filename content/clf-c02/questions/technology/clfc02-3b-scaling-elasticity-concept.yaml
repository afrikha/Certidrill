id: clfc02-3b-scaling-elasticity-concept
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online store uses Amazon EC2 Auto Scaling. During a sale, the number of instances grows to handle the extra traffic. After the sale, the number of instances shrinks back automatically.

    Which cloud concept does this behavior demonstrate?
  fr: |
    Une boutique en ligne utilise Amazon EC2 Auto Scaling. Pendant des soldes, le nombre d'instances augmente pour absorber le trafic supplémentaire. Après les soldes, le nombre d'instances diminue de nouveau automatiquement.

    Quel concept du cloud ce comportement illustre-t-il ?
body:
  options:
    - { id: a, text: { en: "Durability", fr: "Durabilité" } }
    - { id: b, text: { en: "Data sovereignty", fr: "Souveraineté des données" } }
    - { id: c, text: { en: "Global reach", fr: "Portée mondiale" } }
    - { id: d, text: { en: "Elasticity", fr: "Élasticité" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Elasticity is the ability to acquire resources when demand rises and release them when demand falls, automatically. Auto scaling provides elasticity: the store has enough capacity during the sale and stops paying for the extra instances afterward."
    fr: "L'élasticité est la capacité à obtenir des ressources quand la demande augmente et à les libérer quand elle baisse, automatiquement. La mise à l'échelle automatique apporte cette élasticité : la boutique a assez de capacité pendant les soldes et cesse de payer les instances supplémentaires ensuite."
  options:
    a:
      en: "Durability describes how well stored data is protected against loss, not how capacity follows demand."
      fr: "La durabilité décrit la protection des données stockées contre la perte, pas l'adaptation de la capacité à la demande."
    b:
      en: "Data sovereignty is about keeping data in a given country or jurisdiction, which has nothing to do with the number of instances."
      fr: "La souveraineté des données consiste à conserver les données dans un pays ou une juridiction donnés, sans lien avec le nombre d'instances."
    c:
      en: "Global reach is the ability to deploy in Regions around the world in minutes; the scenario changes capacity in one place."
      fr: "La portée mondiale est la capacité à déployer dans des Régions du monde entier en quelques minutes ; le scénario modifie la capacité à un seul endroit."
references:
  - title: What is Amazon EC2 Auto Scaling?
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html
