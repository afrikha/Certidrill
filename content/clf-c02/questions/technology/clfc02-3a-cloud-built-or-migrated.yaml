id: clfc02-3a-cloud-built-or-migrated
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement about applications in the cloud deployment model is correct?
  fr: |
    Quelle affirmation sur les applications du modèle de déploiement cloud est correcte ?
body:
  options:
    - { id: a, text: { en: "They must be rewritten to use only serverless services before they can run in the cloud.", fr: "Elles doivent être réécrites pour n'utiliser que des services sans serveur avant de pouvoir s'exécuter dans le cloud." } }
    - { id: b, text: { en: "They can be built in the cloud or migrated from existing infrastructure, on low-level infrastructure or on higher-level managed services.", fr: "Elles peuvent être créées dans le cloud ou migrées depuis l'infrastructure existante, sur une infrastructure de bas niveau ou sur des services gérés de plus haut niveau." } }
    - { id: c, text: { en: "They keep at least one component in the company's data center to stay connected to internal systems.", fr: "Elles conservent au moins un composant dans le centre de données de l'entreprise pour rester reliées aux systèmes internes." } }
    - { id: d, text: { en: "They run on hardware that the company buys and installs in its own facilities.", fr: "Elles s'exécutent sur du matériel que l'entreprise achète et installe dans ses propres locaux." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A cloud-based application runs entirely in the cloud. It was either created in the cloud or migrated from existing infrastructure, and it can use low-level infrastructure pieces or higher-level services that remove much of the management, architecting, and scaling of core infrastructure.
    fr: |
      Une application cloud s'exécute entièrement dans le cloud. Elle a été créée dans le cloud ou migrée depuis l'infrastructure existante, et elle peut utiliser des éléments d'infrastructure de bas niveau ou des services de plus haut niveau qui retirent une grande partie de la gestion, de l'architecture et de la mise à l'échelle de l'infrastructure de base.
  options:
    a: { en: "Applications can move to the cloud unchanged, for example onto EC2 instances; serverless services are an option, not a requirement.", fr: "Les applications peuvent passer dans le cloud sans modification, par exemple sur des instances EC2 ; les services sans serveur sont une option, pas une obligation." }
    c: { en: "Keeping components in the company's data center and connecting them to the cloud describes a hybrid deployment.", fr: "Conserver des composants dans le centre de données de l'entreprise et les relier au cloud décrit un déploiement hybride." }
    d: { en: "Hardware that the company buys and installs in its own facilities describes an on-premises deployment.", fr: "Du matériel que l'entreprise achète et installe dans ses propres locaux décrit un déploiement sur site." }
references:
  - title: Types of cloud computing
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/types-of-cloud-computing.html
