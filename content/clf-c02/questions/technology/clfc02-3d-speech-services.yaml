id: clfc02-3d-speech-services
objective: "3.7.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is building a voice application. The application must convert callers' speech into text, and it must read answers back to callers in a natural-sounding voice.

    Which two AWS services should the company use? (Choose two.)
  fr: |
    Une entreprise développe une application vocale. L'application doit convertir en texte la parole des appelants, et lire les réponses aux appelants avec une voix naturelle.

    Quels sont les deux services AWS que l'entreprise doit utiliser ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "Amazon Textract" }
    - { id: b, text: "Amazon Transcribe" }
    - { id: c, text: "Amazon Translate" }
    - { id: d, text: "Amazon Polly" }
    - { id: e, text: "Amazon Comprehend" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Amazon Transcribe uses automatic speech recognition to convert speech into text. Amazon Polly does the reverse: it turns text into lifelike speech, so the application can speak its answers."
    fr: "Amazon Transcribe utilise la reconnaissance automatique de la parole pour convertir la parole en texte. Amazon Polly fait l'inverse : il transforme du texte en parole réaliste, ce qui permet à l'application de prononcer ses réponses."
  options:
    a:
      en: "Amazon Textract extracts text from scanned documents and images, not from speech."
      fr: "Amazon Textract extrait le texte de documents numérisés et d'images, pas de la parole."
    c:
      en: "Amazon Translate translates text from one language to another; it neither recognizes nor synthesizes speech."
      fr: "Amazon Translate traduit du texte d'une langue à une autre ; il ne reconnaît ni ne synthétise la parole."
    e:
      en: "Amazon Comprehend analyzes the meaning and sentiment of text; it does not convert between speech and text."
      fr: "Amazon Comprehend analyse le sens et le sentiment d'un texte ; il ne convertit pas la parole en texte ni le texte en parole."
references:
  - title: What is Amazon Transcribe?
    url: https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html
  - title: What Is Amazon Polly?
    url: https://docs.aws.amazon.com/polly/latest/dg/what-is.html
