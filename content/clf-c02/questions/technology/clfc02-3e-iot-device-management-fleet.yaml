id: clfc02-3e-iot-device-management-fleet
objective: "3.8.14"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 50,000 connected devices in the field. It needs to track and organize the devices, monitor their health, and troubleshoot them remotely.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise possède 50 000 appareils connectés sur le terrain. Elle doit suivre et organiser ces appareils, surveiller leur état de santé et les dépanner à distance.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "AWS Config", fr: "AWS Config" } }
    - { id: b, text: { en: "AWS IoT Device Management", fr: "AWS IoT Device Management" } }
    - { id: c, text: { en: "AWS Control Tower", fr: "AWS Control Tower" } }
    - { id: d, text: { en: "Amazon Inspector", fr: "Amazon Inspector" } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS IoT Device Management tracks, monitors and manages fleets of connected devices. It provides health monitoring, secure tunneling and remote troubleshooting, and manages software and firmware updates."
    fr: "AWS IoT Device Management suit, surveille et gère des flottes d'appareils connectés. Il fournit la surveillance de l'état de santé, la tunnellisation sécurisée et le dépannage à distance, et gère les mises à jour logicielles et de microprogramme."
  options:
    a:
      en: "AWS Config records and evaluates the configuration of AWS resources; it does not manage fleets of IoT devices."
      fr: "AWS Config enregistre et évalue la configuration des ressources AWS ; il ne gère pas de flottes d'appareils IoT."
    c:
      en: "Control Tower sets up and governs a multi-account AWS environment; it does not manage devices."
      fr: "Control Tower configure et gouverne un environnement AWS multicompte ; il ne gère pas d'appareils."
    d:
      en: "Amazon Inspector scans workloads such as EC2 instances and container images for vulnerabilities; it does not manage IoT fleets."
      fr: "Amazon Inspector analyse des charges de travail comme des instances EC2 et des images de conteneur à la recherche de vulnérabilités ; il ne gère pas de flottes IoT."
references:
  - title: How AWS IoT works
    url: https://docs.aws.amazon.com/iot/latest/developerguide/aws-iot-how-it-works.html
