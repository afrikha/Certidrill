id: clfc02-3a-sdk-in-application
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer is building a Java web application. When a user uploads a profile picture, the application code itself must store the image in an Amazon S3 bucket.

    Which AWS option should the developer use?
  fr: |
    Un développeur crée une application web en Java. Quand un utilisateur charge une photo de profil, le code de l'application doit lui-même stocker l'image dans un compartiment Amazon S3.

    Quelle option AWS le développeur doit-il utiliser ?
body:
  options:
    - { id: a, text: "AWS CloudFormation" }
    - { id: b, text: "AWS Management Console" }
    - { id: c, text: "AWS Command Line Interface (AWS CLI)" }
    - { id: d, text: "AWS SDK for Java" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The AWS SDKs are language libraries that application code uses to call AWS services; the SDK for Java lets the application send the S3 request itself. The SDK handles details such as finding credentials and signing requests.
    fr: |
      Les kits SDK AWS sont des bibliothèques par langage que le code d'une application utilise pour appeler les services AWS ; le SDK for Java permet à l'application d'envoyer elle-même la requête S3. Le SDK gère des détails comme la recherche des informations d'identification et la signature des requêtes.
  options:
    a: { en: "CloudFormation provisions infrastructure such as the bucket; it does not store each uploaded image at run time.", fr: "CloudFormation met en service l'infrastructure, comme le compartiment ; il ne stocke pas chaque image chargée pendant l'exécution." }
    b: { en: "The console is used by a person in a browser; the application cannot use it to store images automatically.", fr: "La console est utilisée par une personne dans un navigateur ; l'application ne peut pas s'en servir pour stocker des images automatiquement." }
    c: { en: "The AWS CLI is designed for commands in a shell and in scripts; calling it from a Java web application is not the intended way to use AWS from application code.", fr: "L'AWS CLI est conçu pour des commandes dans un shell et dans des scripts ; l'appeler depuis une application web Java n'est pas la façon prévue d'utiliser AWS depuis le code d'une application." }
references:
  - title: What is covered in the AWS SDKs and Tools Reference Guide
    url: https://docs.aws.amazon.com/sdkref/latest/guide/overview.html
