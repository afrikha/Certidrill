id: clfc02-3c-route53-failover-policy
objective: "3.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs its website in a primary environment and keeps a standby copy in another AWS Region. Amazon Route 53 must send users to the standby copy only when the primary environment becomes unhealthy.

    Which Route 53 routing policy will meet this requirement?
  fr: |
    Une entreprise exécute son site web dans un environnement principal et conserve une copie de secours dans une autre Région AWS. Amazon Route 53 doit envoyer les utilisateurs vers la copie de secours uniquement lorsque l'environnement principal devient défaillant.

    Quelle politique de routage Route 53 répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Weighted routing", fr: "Routage pondéré" }
    - id: b
      text: { en: "Geolocation routing", fr: "Routage par géolocalisation" }
    - id: c
      text: { en: "Failover routing", fr: "Routage de basculement" }
    - id: d
      text: { en: "Multivalue answer routing", fr: "Routage de réponse multivaleur" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Failover routing configures active-passive failover. Combined with a health check on the primary resource, Route 53 answers with the primary record while it is healthy and with the secondary record when it is not.
    fr: |-
      Le routage de basculement configure un basculement actif-passif. Associé à une vérification de l'état de la ressource principale, Route 53 répond avec l'enregistrement principal tant qu'il est sain et avec l'enregistrement secondaire dans le cas contraire.
  options:
    a:
      en: |-
        Weighted routing splits traffic between resources in set proportions; it does not keep a resource idle until another one fails.
      fr: |-
        Le routage pondéré répartit le trafic entre des ressources selon des proportions définies ; il ne garde pas une ressource inactive jusqu'à la défaillance d'une autre.
    b:
      en: |-
        Geolocation routing chooses a resource based on where users are located, not on the health of a primary site.
      fr: |-
        Le routage par géolocalisation choisit une ressource selon l'emplacement des utilisateurs, et non selon l'état d'un site principal.
    d:
      en: |-
        Multivalue answer routing returns up to eight healthy records at random, so the standby would receive traffic all the time.
      fr: |-
        Le routage de réponse multivaleur renvoie au hasard jusqu'à huit enregistrements sains : le site de secours recevrait donc du trafic en permanence.
references:
  - title: "Choosing a routing policy - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html
