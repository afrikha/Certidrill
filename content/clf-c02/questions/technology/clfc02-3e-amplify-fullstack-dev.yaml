id: clfc02-3e-amplify-fullstack-dev
objective: "3.8.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A small team of frontend developers wants one AWS service to build, host and continuously deploy its web and mobile applications, with a backend for features such as authentication and data.

    Which AWS service should the team use?
  fr: |
    Une petite équipe de développeurs front-end souhaite un seul service AWS pour créer, héberger et déployer en continu ses applications web et mobiles, avec un backend pour des fonctionnalités comme l'authentification et les données.

    Quel service AWS l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "AWS CodeBuild", fr: "AWS CodeBuild" } }
    - { id: b, text: { en: "Amazon Lightsail", fr: "Amazon Lightsail" } }
    - { id: c, text: { en: "AWS Batch", fr: "AWS Batch" } }
    - { id: d, text: { en: "AWS Amplify", fr: "AWS Amplify" } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Amplify provides continuous delivery and hosting for cloud-powered web and mobile applications. Amplify Hosting deploys from a Git repository, and Amplify backends add features such as authentication and data that frontend developers connect to with the Amplify libraries."
    fr: "AWS Amplify fournit la livraison continue et l'hébergement d'applications web et mobiles basées sur le cloud. Amplify Hosting déploie à partir d'un dépôt Git, et les backends Amplify ajoutent des fonctionnalités comme l'authentification et les données, auxquelles les développeurs front-end se connectent avec les bibliothèques Amplify."
  options:
    a:
      en: "CodeBuild compiles code and runs tests as one step of a pipeline; it does not host applications or provide an app backend."
      fr: "CodeBuild compile le code et exécute des tests comme étape d'un pipeline ; il n'héberge pas d'applications et ne fournit pas de backend applicatif."
    b:
      en: "Lightsail provides virtual private servers that the team would have to configure itself; it is not a frontend and mobile development service."
      fr: "Lightsail fournit des serveurs privés virtuels que l'équipe devrait configurer elle-même ; ce n'est pas un service de développement front-end et mobile."
    c:
      en: "AWS Batch runs batch computing jobs; it does not build or host web and mobile applications."
      fr: "AWS Batch exécute des tâches de calcul par lots ; il ne crée ni n'héberge d'applications web et mobiles."
references:
  - title: Welcome to AWS Amplify Hosting
    url: https://docs.aws.amazon.com/amplify/latest/userguide/welcome.html
