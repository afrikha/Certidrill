id: clfc02-3d-support-center-cases
objective: "3.8.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator needs to create a support case about a billing question and then follow the case until it is resolved.

    Where should the administrator create and manage the case?
  fr: |
    Un administrateur doit créer une demande de support concernant une question de facturation, puis suivre la demande jusqu'à sa résolution.

    Où l'administrateur doit-il créer et gérer la demande ?
body:
  options:
    - { id: a, text: "AWS re:Post" }
    - { id: b, text: "AWS Health Dashboard" }
    - { id: c, text: { en: "AWS Support Center Console", fr: "Console AWS Support Center" } }
    - { id: d, text: "AWS Trusted Advisor" }
answer: { optionId: c }
explanation:
  correct:
    en: "Support cases are created and managed in the AWS Support Center Console, which is also reachable from the question mark icon of the AWS Management Console. Account and billing cases are available to all AWS customers, including those with Basic Support."
    fr: "Les demandes de support se créent et se gèrent dans la console AWS Support Center, également accessible depuis l'icône en forme de point d'interrogation de l'AWS Management Console. Les demandes de compte et de facturation sont accessibles à tous les clients AWS, y compris ceux qui disposent de Basic Support."
  options:
    a:
      en: "AWS re:Post is a public community question-and-answer site; it is not where private cases about your account are opened and tracked."
      fr: "AWS re:Post est un site communautaire public de questions et réponses ; ce n'est pas là que s'ouvrent et se suivent les demandes privées concernant votre compte."
    b:
      en: "The AWS Health Dashboard shows events that affect AWS services and your resources; it is not used to open support cases."
      fr: "L'AWS Health Dashboard affiche les événements qui touchent les services AWS et vos ressources ; il ne sert pas à ouvrir des demandes de support."
    d:
      en: "AWS Trusted Advisor checks your account against best practices; it does not manage support cases."
      fr: "AWS Trusted Advisor vérifie votre compte par rapport aux bonnes pratiques ; il ne gère pas les demandes de support."
references:
  - title: Case management
    url: https://docs.aws.amazon.com/awssupport/latest/user/case-management.html
