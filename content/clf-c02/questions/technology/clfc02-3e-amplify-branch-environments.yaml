id: clfc02-3e-amplify-branch-environments
objective: "3.8.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A web team keeps its app in a GitHub repository. It wants a production site deployed from the main branch and a staging site deployed from a develop branch, and every commit must be deployed automatically.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une équipe web conserve son application dans un dépôt GitHub. Elle veut un site de production déployé à partir de la branche main et un site de préproduction déployé à partir d'une branche develop, et chaque commit doit être déployé automatiquement.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Upload the build output to two Amazon S3 buckets by hand after each commit.", fr: "Charger manuellement le résultat de la génération dans deux compartiments Amazon S3 après chaque commit." } }
    - { id: b, text: { en: "Launch two Amazon EC2 instances that pull the code with a scheduled script.", fr: "Lancer deux instances Amazon EC2 qui récupèrent le code avec un script planifié." } }
    - { id: c, text: { en: "Connect the repository to AWS Amplify Hosting and deploy each branch.", fr: "Connecter le dépôt à AWS Amplify Hosting et déployer chaque branche." } }
    - { id: d, text: { en: "Create two AWS CloudFormation stacks and update them after each commit.", fr: "Créer deux piles AWS CloudFormation et les mettre à jour après chaque commit." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amplify Hosting connects to a Git repository and deploys continuously. Its feature branches map branches such as main and develop to separate production and staging environments, and each commit to a connected branch is built and deployed without servers or scripts to manage."
    fr: "Amplify Hosting se connecte à un dépôt Git et déploie en continu. Ses branches de fonctionnalités associent des branches comme main et develop à des environnements distincts de production et de préproduction, et chaque commit sur une branche connectée est généré et déployé sans serveur ni script à gérer."
  options:
    a:
      en: "Manual uploads after each commit are not automatic deployments and add work for every change."
      fr: "Des chargements manuels après chaque commit ne sont pas des déploiements automatiques et ajoutent du travail à chaque modification."
    b:
      en: "EC2 instances and custom scripts add servers to patch and code to maintain."
      fr: "Des instances EC2 et des scripts personnalisés ajoutent des serveurs à corriger et du code à maintenir."
    d:
      en: "Updating CloudFormation stacks after each commit is a manual step unless a separate pipeline is built and maintained."
      fr: "Mettre à jour des piles CloudFormation après chaque commit est une étape manuelle, sauf à créer et maintenir un pipeline distinct."
references:
  - title: Welcome to AWS Amplify Hosting
    url: https://docs.aws.amazon.com/amplify/latest/userguide/welcome.html
