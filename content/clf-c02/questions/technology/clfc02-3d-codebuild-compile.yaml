id: clfc02-3d-codebuild-compile
objective: "3.8.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A development team wants a fully managed service that compiles its source code, runs unit tests, and produces software packages ready to deploy. The team does not want to provision or manage build servers.

    Which AWS service meets these requirements?
  fr: |
    Une équipe de développement veut un service entièrement géré qui compile son code source, exécute les tests unitaires et produit des packages logiciels prêts à déployer. L'équipe ne veut pas provisionner ni gérer de serveurs de build.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS CodePipeline" }
    - { id: b, text: "AWS X-Ray" }
    - { id: c, text: "AWS CloudFormation" }
    - { id: d, text: "AWS CodeBuild" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS CodeBuild is a fully managed build service in the cloud. It compiles source code, runs unit tests, and produces artifacts that are ready to deploy, and it scales automatically, so there are no build servers to provision, manage, or scale."
    fr: "AWS CodeBuild est un service de build entièrement géré dans le cloud. Il compile le code source, exécute les tests unitaires et produit des artefacts prêts à déployer, et il se met à l'échelle automatiquement ; il n'y a donc aucun serveur de build à provisionner, gérer ou mettre à l'échelle."
  options:
    a:
      en: "AWS CodePipeline orchestrates the stages of a release process; the build itself runs in a build provider such as CodeBuild."
      fr: "AWS CodePipeline orchestre les étapes d'un processus de publication ; le build lui-même s'exécute dans un fournisseur de build comme CodeBuild."
    b:
      en: "AWS X-Ray traces requests through a running application; it does not compile code or run tests."
      fr: "AWS X-Ray trace les requêtes à travers une application en cours d'exécution ; il ne compile pas de code et n'exécute pas de tests."
    c:
      en: "AWS CloudFormation provisions infrastructure from templates; it does not compile source code."
      fr: "AWS CloudFormation provisionne l'infrastructure à partir de modèles ; il ne compile pas de code source."
references:
  - title: What is AWS CodeBuild?
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/welcome.html
