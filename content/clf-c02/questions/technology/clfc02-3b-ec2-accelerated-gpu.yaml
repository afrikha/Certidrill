id: clfc02-3b-ec2-accelerated-gpu
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company wants to train machine learning models and render 3D graphics on Amazon EC2. These tasks run much faster on GPUs than on general-purpose CPUs.

    Which Amazon EC2 instance category should the company use?
  fr: |
    Une entreprise de médias veut entraîner des modèles de machine learning et effectuer le rendu de graphiques 3D sur Amazon EC2. Ces tâches s'exécutent beaucoup plus vite sur des GPU que sur des processeurs à usage général.

    Quelle catégorie d'instances Amazon EC2 l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Compute optimized", fr: "Optimisée pour le calcul" } }
    - { id: b, text: { en: "Memory optimized", fr: "Optimisée pour la mémoire" } }
    - { id: c, text: { en: "Storage optimized", fr: "Optimisée pour le stockage" } }
    - { id: d, text: { en: "Accelerated computing", fr: "Calcul accéléré" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Accelerated computing instances use hardware accelerators, or co-processors, to perform functions such as floating point calculations and graphics processing more efficiently than software running on CPUs. The P and G families, for example, include NVIDIA GPUs."
    fr: "Les instances de calcul accéléré utilisent des accélérateurs matériels, ou coprocesseurs, pour exécuter des fonctions comme les calculs à virgule flottante et le traitement graphique plus efficacement qu'un logiciel exécuté sur des processeurs. Les familles P et G, par exemple, comprennent des GPU NVIDIA."
  options:
    a:
      en: "Compute optimized instances have fast CPUs but no GPUs; the workloads described need GPU acceleration."
      fr: "Les instances optimisées pour le calcul ont des processeurs rapides mais pas de GPU ; les charges de travail décrites ont besoin d'une accélération GPU."
    b:
      en: "Memory optimized instances provide large amounts of RAM, not GPUs for training and rendering."
      fr: "Les instances optimisées pour la mémoire fournissent beaucoup de RAM, pas de GPU pour l'entraînement et le rendu."
    c:
      en: "Storage optimized instances provide fast local storage, not GPUs."
      fr: "Les instances optimisées pour le stockage fournissent un stockage local rapide, pas de GPU."
references:
  - title: Specifications for Amazon EC2 accelerated computing instances
    url: https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html
