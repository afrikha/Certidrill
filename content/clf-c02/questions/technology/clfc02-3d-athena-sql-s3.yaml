id: clfc02-3d-athena-sql-s3
objective: "3.7.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores log files in Amazon S3. Its analysts occasionally need to run standard SQL queries directly on these files, without loading the data into a database and without managing any infrastructure.

    Which AWS service meets these requirements?
  fr: |
    Une entreprise stocke des fichiers journaux dans Amazon S3. Ses analystes doivent de temps en temps exécuter des requêtes SQL standard directement sur ces fichiers, sans charger les données dans une base de données et sans gérer d'infrastructure.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon RDS for PostgreSQL" }
    - { id: b, text: "Amazon Athena" }
    - { id: c, text: "Amazon DynamoDB" }
    - { id: d, text: "Amazon Kinesis Data Streams" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Athena is a serverless, interactive query service that analyzes data directly in Amazon S3 with standard SQL. There is no infrastructure to set up or manage, and you pay only for the queries that you run."
    fr: "Amazon Athena est un service de requêtes interactif et sans serveur qui analyse les données directement dans Amazon S3 avec du SQL standard. Il n'y a aucune infrastructure à configurer ni à gérer, et vous payez uniquement les requêtes que vous exécutez."
  options:
    a:
      en: "Amazon RDS for PostgreSQL requires a DB instance to manage and the data to be loaded into the database before it can be queried."
      fr: "Amazon RDS for PostgreSQL nécessite une instance de base de données à gérer et le chargement des données dans la base avant de pouvoir les interroger."
    c:
      en: "Amazon DynamoDB is a NoSQL database; the logs would have to be loaded into tables, and it is not designed for ad hoc SQL analytics on S3 files."
      fr: "Amazon DynamoDB est une base de données NoSQL ; les journaux devraient être chargés dans des tables, et il n'est pas conçu pour l'analytique SQL ad hoc sur des fichiers S3."
    d:
      en: "Kinesis Data Streams ingests streaming data records; it does not run SQL queries on files stored in Amazon S3."
      fr: "Kinesis Data Streams ingère des enregistrements de données en streaming ; il n'exécute pas de requêtes SQL sur des fichiers stockés dans Amazon S3."
references:
  - title: What is Amazon Athena?
    url: https://docs.aws.amazon.com/athena/latest/ug/what-is.html
