id: clfc02-3d-backup-vault-lock
objective: "3.6.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores backups of its Amazon RDS databases and Amazon EBS volumes in AWS Backup. To meet a regulation, no user, including administrators, must be able to delete the backups before the end of their retention period.

    Which solution meets this requirement?
  fr: |
    Une entreprise stocke dans AWS Backup les sauvegardes de ses bases de données Amazon RDS et de ses volumes Amazon EBS. Pour respecter une réglementation, aucun utilisateur, y compris les administrateurs, ne doit pouvoir supprimer les sauvegardes avant la fin de leur période de rétention.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Enable S3 Object Lock in compliance mode.", fr: "Activer S3 Object Lock en mode conformité." } }
    - { id: b, text: { en: "Attach an IAM policy that denies backup deletion to every IAM user.", fr: "Attacher à chaque utilisateur IAM une politique IAM qui refuse la suppression des sauvegardes." } }
    - { id: c, text: { en: "Enable AWS Backup Vault Lock in compliance mode on the backup vault.", fr: "Activer AWS Backup Vault Lock en mode conformité sur le coffre de sauvegarde." } }
    - { id: d, text: { en: "Copy the backups to a second AWS Region.", fr: "Copier les sauvegardes dans une deuxième Région AWS." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Backup Vault Lock applies a write-once-read-many (WORM) setting to a backup vault. In compliance mode, once the grace time ends, the lock cannot be removed and no user, including the root user, can delete recovery points before their retention ends."
    fr: "AWS Backup Vault Lock applique un paramètre WORM (une écriture, plusieurs lectures) à un coffre de sauvegarde. En mode conformité, une fois le délai de grâce écoulé, le verrou ne peut plus être retiré et aucun utilisateur, pas même l'utilisateur racine, ne peut supprimer les points de récupération avant la fin de leur rétention."
  options:
    a:
      en: "S3 Object Lock protects objects in S3 buckets; it does not apply to RDS and EBS recovery points stored in AWS Backup vaults."
      fr: "S3 Object Lock protège les objets des compartiments S3 ; il ne s'applique pas aux points de récupération RDS et EBS stockés dans des coffres AWS Backup."
    b:
      en: "An administrator with IAM permissions can detach or change the policy and then delete the backups, so it does not stop every user."
      fr: "Un administrateur disposant d'autorisations IAM peut détacher ou modifier la politique, puis supprimer les sauvegardes ; elle n'arrête donc pas tous les utilisateurs."
    d:
      en: "A copy in another Region adds a second copy for disaster recovery, but both copies can still be deleted by a user with the right permissions."
      fr: "Une copie dans une autre Région ajoute un second exemplaire pour la reprise après sinistre, mais les deux copies peuvent toujours être supprimées par un utilisateur disposant des autorisations nécessaires."
references:
  - title: AWS Backup Vault Lock
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html
