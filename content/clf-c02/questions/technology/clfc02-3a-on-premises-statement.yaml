id: clfc02-3a-on-premises-statement
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement about the on-premises deployment model, also called private cloud, is correct?
  fr: |
    Quelle affirmation sur le modèle de déploiement sur site, aussi appelé cloud privé, est correcte ?
body:
  options:
    - { id: a, text: { en: "It removes the need for the company to plan capacity and buy hardware in advance.", fr: "Il évite à l'entreprise de planifier la capacité et d'acheter du matériel à l'avance." } }
    - { id: b, text: { en: "It connects cloud resources to the company's internal systems that stay in its data center.", fr: "Il relie des ressources cloud aux systèmes internes de l'entreprise qui restent dans son centre de données." } }
    - { id: c, text: { en: "It provides dedicated resources but does not offer many of the benefits of cloud computing.", fr: "Il fournit des ressources dédiées, mais n'offre pas beaucoup des avantages du cloud computing." } }
    - { id: d, text: { en: "It runs all parts of the application on infrastructure that AWS owns and operates.", fr: "Il exécute toutes les parties de l'application sur une infrastructure qu'AWS possède et exploite." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An on-premises deployment uses virtualization and resource management tools in the company's own facilities. Companies choose it for its dedicated resources, but it lacks many cloud benefits, and in most cases it is the same as legacy IT infrastructure.
    fr: |
      Un déploiement sur site utilise des outils de virtualisation et de gestion des ressources dans les locaux de l'entreprise. Les entreprises le choisissent pour ses ressources dédiées, mais il ne présente pas beaucoup des avantages du cloud et, dans la plupart des cas, il équivaut à l'infrastructure informatique traditionnelle.
  options:
    a: { en: "Avoiding capacity planning and up-front hardware purchases is a benefit of the cloud; on premises, the company still buys and sizes its own hardware.", fr: "Éviter la planification de capacité et l'achat initial de matériel est un avantage du cloud ; sur site, l'entreprise achète et dimensionne toujours son propre matériel." }
    b: { en: "Connecting cloud resources to internal systems describes a hybrid deployment.", fr: "Relier des ressources cloud aux systèmes internes décrit un déploiement hybride." }
    d: { en: "Running everything on AWS infrastructure describes the cloud deployment model.", fr: "Tout exécuter sur l'infrastructure AWS décrit le modèle de déploiement cloud." }
references:
  - title: Types of cloud computing
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/types-of-cloud-computing.html
