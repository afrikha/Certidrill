id: clfc02-3c-tape-gateway-archive
objective: "3.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company backs up its on-premises servers to a physical tape library and ships tapes offsite. It wants to replace the physical tapes with a durable, cost-effective tape-based archive stored in the AWS Cloud.

    Which solution will meet these requirements?
  fr: |
    Une entreprise sauvegarde ses serveurs sur site sur une bibliothèque de bandes physique et expédie les bandes hors site. Elle souhaite remplacer les bandes physiques par une archive sur bandes durable et économique stockée dans le cloud AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy an Amazon S3 File Gateway.", fr: "Déployer une passerelle Amazon S3 File Gateway." }
    - id: b
      text: { en: "Deploy a Tape Gateway in AWS Storage Gateway.", fr: "Déployer une passerelle Tape Gateway dans AWS Storage Gateway." }
    - id: c
      text: { en: "Deploy an Amazon FSx File Gateway.", fr: "Déployer une passerelle Amazon FSx File Gateway." }
    - id: d
      text: { en: "Order AWS Direct Connect to copy the tapes to Amazon EBS.", fr: "Commander AWS Direct Connect pour copier les bandes vers Amazon EBS." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Storage Gateway connects an on-premises software appliance to AWS cloud storage. Its Tape Gateway type provides a durable, cost-effective tape-based solution for archiving data in the AWS Cloud, which replaces the physical tape library.
    fr: |-
      AWS Storage Gateway relie une appliance logicielle sur site au stockage cloud AWS. Son type Tape Gateway fournit une solution sur bandes durable et économique pour archiver les données dans le cloud AWS, ce qui remplace la bibliothèque de bandes physique.
  options:
    a:
      en: |-
        S3 File Gateway gives on-premises file shares backed by Amazon S3; it does not present virtual tapes to backup software.
      fr: |-
        S3 File Gateway fournit des partages de fichiers sur site reposant sur Amazon S3 ; il ne présente pas de bandes virtuelles au logiciel de sauvegarde.
    c:
      en: |-
        FSx File Gateway provides on-premises access to Amazon FSx for Windows File Server shares, not a tape archive.
      fr: |-
        FSx File Gateway fournit un accès sur site à des partages Amazon FSx for Windows File Server, et non une archive sur bandes.
    d:
      en: |-
        Direct Connect is a network link, and EBS volumes attach to EC2 instances; neither provides a tape archive.
      fr: |-
        Direct Connect est une liaison réseau, et les volumes EBS s'attachent à des instances EC2 ; aucun des deux ne fournit d'archive sur bandes.
references:
  - title: "AWS Storage Gateway Documentation"
    url: https://docs.aws.amazon.com/storagegateway/latest/userguide/WhatIsStorageGateway.html
