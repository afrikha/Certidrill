id: clfc02-3b-scaling-idle-capacity-cost
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs 20 Amazon EC2 instances at all times so that its application can handle the daily peak. Outside the peak hours, most of the instances are almost idle. The company wants to stop paying for idle capacity without reducing performance during the peak.

    What should the company do?
  fr: |
    Une entreprise exécute en permanence 20 instances Amazon EC2 pour que son application puisse absorber le pic quotidien. En dehors des heures de pointe, la plupart des instances sont presque inactives. L'entreprise veut cesser de payer une capacité inactive sans réduire les performances pendant le pic.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Purchase Reserved Instances for all 20 instances.", fr: "Acheter des Reserved Instances pour les 20 instances." } }
    - { id: b, text: { en: "Replace the 20 instances with 10 instances that are twice as large.", fr: "Remplacer les 20 instances par 10 instances deux fois plus grandes." } }
    - { id: c, text: { en: "Place the instances in an Auto Scaling group with a dynamic scaling policy.", fr: "Placer les instances dans un groupe Auto Scaling avec une politique de mise à l'échelle dynamique." } }
    - { id: d, text: { en: "Place an Application Load Balancer in front of the 20 instances.", fr: "Placer un Application Load Balancer devant les 20 instances." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With a dynamic scaling policy, such as target tracking on average CPU utilization, the Auto Scaling group adds instances as the load rises and removes them as it falls. The company runs enough instances for the peak and pays for fewer instances the rest of the day."
    fr: "Avec une politique de mise à l'échelle dynamique, comme le suivi de cible sur l'utilisation moyenne du processeur, le groupe Auto Scaling ajoute des instances quand la charge augmente et en retire quand elle baisse. L'entreprise exécute assez d'instances pour le pic et paie moins d'instances le reste de la journée."
  options:
    a:
      en: "Reserved Instances lower the hourly rate, but the company would still pay for 20 instances around the clock, including the idle capacity."
      fr: "Les Reserved Instances réduisent le tarif horaire, mais l'entreprise paierait toujours 20 instances en continu, y compris la capacité inactive."
    b:
      en: "Fewer, larger instances provide the same fixed capacity at all times, so the idle capacity outside the peak remains."
      fr: "Des instances moins nombreuses mais plus grandes fournissent la même capacité fixe en permanence : la capacité inactive hors pic demeure."
    d:
      en: "A load balancer spreads traffic across the instances but does not change how many instances run."
      fr: "Un équilibreur de charge répartit le trafic entre les instances mais ne modifie pas le nombre d'instances en cours d'exécution."
references:
  - title: What is Amazon EC2 Auto Scaling?
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html
