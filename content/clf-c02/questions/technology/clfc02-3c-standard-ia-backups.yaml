id: clfc02-3c-standard-ia-backups
objective: "3.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps backup files in Amazon S3 that cannot be re-created. The files are read about once a month, must be available in milliseconds when needed, and must survive the loss of an Availability Zone. The company wants a lower storage cost than S3 Standard.

    Which S3 storage class will meet these requirements?
  fr: |
    Une entreprise conserve dans Amazon S3 des fichiers de sauvegarde qui ne peuvent pas être recréés. Les fichiers sont lus environ une fois par mois, doivent être disponibles en quelques millisecondes en cas de besoin et doivent survivre à la perte d'une zone de disponibilité. L'entreprise souhaite un coût de stockage inférieur à celui de S3 Standard.

    Quelle classe de stockage S3 répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "S3 Standard-IA", fr: "S3 Standard-IA" }
    - id: b
      text: { en: "S3 One Zone-IA", fr: "S3 One Zone-IA" }
    - id: c
      text: { en: "S3 Glacier Flexible Retrieval", fr: "S3 Glacier Flexible Retrieval" }
    - id: d
      text: { en: "S3 Express One Zone", fr: "S3 Express One Zone" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      S3 Standard-IA is designed for long-lived, infrequently accessed data such as backups and primary copies that cannot be re-created. It stores data across at least three Availability Zones and returns objects in milliseconds, with a per-GB retrieval fee and a 30-day minimum storage duration.
    fr: |-
      S3 Standard-IA est conçu pour des données durables et rarement consultées, comme des sauvegardes et des copies principales qui ne peuvent pas être recréées. Il stocke les données dans au moins trois zones de disponibilité et renvoie les objets en quelques millisecondes, avec des frais d'extraction par Go et une durée de stockage minimale de 30 jours.
  options:
    b:
      en: |-
        One Zone-IA stores data in a single Availability Zone and is not resilient to the loss of that zone, so it fits only re-creatable data.
      fr: |-
        One Zone-IA stocke les données dans une seule zone de disponibilité et ne résiste pas à la perte de cette zone : il ne convient qu'à des données recréables.
    c:
      en: |-
        Glacier Flexible Retrieval requires a restore that takes minutes to hours, so objects are not available in milliseconds.
      fr: |-
        Glacier Flexible Retrieval exige une restauration qui prend de quelques minutes à quelques heures : les objets ne sont pas disponibles en quelques millisecondes.
    d:
      en: |-
        Express One Zone targets latency-sensitive applications in a single Availability Zone and does not survive the loss of that zone.
      fr: |-
        Express One Zone cible des applications sensibles à la latence dans une seule zone de disponibilité et ne survit pas à la perte de cette zone.
references:
  - title: "Understanding and managing Amazon S3 storage classes - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
