id: clfc02-3b-compute-outposts-on-premises
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company must process data in its own factory because its production systems need very low latency. The company wants to run Amazon EC2 instances in the factory and manage them with the same AWS APIs and tools that it uses in an AWS Region.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise industrielle doit traiter des données dans sa propre usine, car ses systèmes de production ont besoin d'une latence très faible. L'entreprise veut exécuter des instances Amazon EC2 dans l'usine et les gérer avec les mêmes API et outils AWS que ceux qu'elle utilise dans une Région AWS.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Direct Connect" }
    - { id: b, text: "AWS Storage Gateway" }
    - { id: c, text: "AWS Outposts" }
    - { id: d, text: "Amazon Lightsail" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Outposts is a fully managed service that extends AWS infrastructure, services, APIs, and tools to customer premises. Resources such as Amazon EC2 instances run locally on the Outpost, which supports low-latency workloads that must run close to on-premises data and applications, and local data processing."
    fr: "AWS Outposts est un service entièrement géré qui étend l'infrastructure, les services, les API et les outils AWS aux locaux du client. Des ressources comme les instances Amazon EC2 s'exécutent localement sur l'Outpost, ce qui convient aux charges de travail à faible latence qui doivent s'exécuter près des données et applications sur site, et au traitement local des données."
  options:
    a:
      en: "Direct Connect is a private network connection between a site and AWS; the compute still runs in the Region, not in the factory."
      fr: "Direct Connect est une connexion réseau privée entre un site et AWS ; le calcul s'exécute toujours dans la Région, pas dans l'usine."
    b:
      en: "Storage Gateway gives on-premises applications access to cloud storage; it does not run EC2 instances on premises."
      fr: "Storage Gateway donne aux applications sur site un accès au stockage dans le cloud ; il n'exécute pas d'instances EC2 sur site."
    d:
      en: "Lightsail servers run in AWS Regions, not in the customer's factory."
      fr: "Les serveurs Lightsail s'exécutent dans des Régions AWS, pas dans l'usine du client."
references:
  - title: What is AWS Outposts?
    url: https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html
