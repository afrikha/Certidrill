id: clfc02-3d-backup-central
objective: "3.6.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses Amazon EBS volumes, Amazon RDS databases, Amazon DynamoDB tables, and Amazon EFS file systems. It wants to define backup schedules and retention once and manage the backups of all these resources from a single place.

    Which AWS service meets these requirements?
  fr: |
    Une entreprise utilise des volumes Amazon EBS, des bases de données Amazon RDS, des tables Amazon DynamoDB et des systèmes de fichiers Amazon EFS. Elle veut définir une seule fois les planifications et la rétention des sauvegardes, et gérer les sauvegardes de toutes ces ressources depuis un emplacement unique.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Elastic Disaster Recovery" }
    - { id: b, text: "AWS DataSync" }
    - { id: c, text: "AWS Storage Gateway" }
    - { id: d, text: "AWS Backup" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Backup is a fully managed service that centralizes and automates data protection across AWS services such as Amazon EBS, Amazon RDS, Amazon DynamoDB, and Amazon EFS. A backup plan defines the schedule and retention, and resources are assigned to it, so the company does not script backups per service."
    fr: "AWS Backup est un service entièrement géré qui centralise et automatise la protection des données de services AWS comme Amazon EBS, Amazon RDS, Amazon DynamoDB et Amazon EFS. Un plan de sauvegarde définit la planification et la rétention, et des ressources lui sont attribuées ; l'entreprise n'a donc pas à scripter les sauvegardes service par service."
  options:
    a:
      en: "AWS Elastic Disaster Recovery continuously replicates servers to recover them quickly in AWS; it does not manage scheduled backups of databases, tables, and file systems."
      fr: "AWS Elastic Disaster Recovery réplique en continu des serveurs pour les récupérer rapidement dans AWS ; il ne gère pas les sauvegardes planifiées de bases de données, de tables et de systèmes de fichiers."
    b:
      en: "AWS DataSync transfers data between storage systems; it does not create scheduled backups with retention for RDS or DynamoDB."
      fr: "AWS DataSync transfère des données entre systèmes de stockage ; il ne crée pas de sauvegardes planifiées avec rétention pour RDS ou DynamoDB."
    c:
      en: "AWS Storage Gateway gives on-premises applications access to cloud storage; it does not manage backups of AWS resources."
      fr: "AWS Storage Gateway donne aux applications sur site l'accès au stockage cloud ; il ne gère pas les sauvegardes des ressources AWS."
references:
  - title: What is AWS Backup?
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html
