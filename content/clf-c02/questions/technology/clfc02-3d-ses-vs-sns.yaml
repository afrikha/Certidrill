id: clfc02-3d-ses-vs-sns
objective: "3.8.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's application must email each new customer a personalized welcome message from the company's domain. It must also receive replies sent to a support address and pass them to an AWS Lambda function that creates support tickets.

    Which AWS service meets these requirements?
  fr: |
    L'application d'une entreprise doit envoyer à chaque nouveau client un message de bienvenue personnalisé depuis le domaine de l'entreprise. Elle doit aussi recevoir les réponses envoyées à une adresse de support et les transmettre à une fonction AWS Lambda qui crée des tickets de support.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon SNS with an email subscription for each new customer", fr: "Amazon SNS avec un abonnement e-mail pour chaque nouveau client" } }
    - { id: b, text: "Amazon Simple Email Service (Amazon SES)" }
    - { id: c, text: "Amazon Connect" }
    - { id: d, text: { en: "Amazon SQS with a Lambda function that polls the queue", fr: "Amazon SQS avec une fonction Lambda qui interroge la file" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon SES sends email from your own addresses and domains and also receives email. Received messages can trigger actions, for example invoking a Lambda function or storing them in Amazon S3, which is how applications build support ticketing from incoming email."
    fr: "Amazon SES envoie des e-mails depuis vos propres adresses et domaines, et reçoit aussi des e-mails. Les messages reçus peuvent déclencher des actions, par exemple appeler une fonction Lambda ou les stocker dans Amazon S3, ce qui permet aux applications de créer des tickets de support à partir des e-mails entrants."
  options:
    a:
      en: "SNS email subscriptions deliver topic notifications to people who confirmed the subscription; SNS does not send personalized messages from your domain or receive email replies."
      fr: "Les abonnements e-mail SNS livrent des notifications de rubrique à des personnes qui ont confirmé leur abonnement ; SNS n'envoie pas de messages personnalisés depuis votre domaine et ne reçoit pas les réponses par e-mail."
    c:
      en: "Amazon Connect is a contact center for voice, chat, and tasks; it is not the service that sends application email and receives replies at an email address."
      fr: "Amazon Connect est un centre de contact pour la voix, le chat et les tâches ; ce n'est pas le service qui envoie les e-mails d'une application et reçoit les réponses à une adresse e-mail."
    d:
      en: "Amazon SQS queues messages between components; it neither sends email to customers nor receives email."
      fr: "Amazon SQS met en file d'attente des messages entre composants ; il n'envoie pas d'e-mails aux clients et n'en reçoit pas."
references:
  - title: What is Amazon SES?
    url: https://docs.aws.amazon.com/ses/latest/dg/Welcome.html
