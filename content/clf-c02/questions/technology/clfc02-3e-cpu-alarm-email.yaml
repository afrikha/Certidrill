id: clfc02-3e-cpu-alarm-email
objective: "3.8.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An operations team must receive an email when the average CPU utilization of an Amazon EC2 instance stays above 80% for 10 minutes.

    Which AWS services should the team use? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Une équipe d'exploitation doit recevoir un e-mail lorsque l'utilisation moyenne du processeur d'une instance Amazon EC2 reste supérieure à 80 % pendant 10 minutes.

    Quels services AWS l'équipe doit-elle utiliser ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" } }
    - { id: b, text: { en: "Amazon CloudWatch", fr: "Amazon CloudWatch" } }
    - { id: c, text: { en: "AWS Config", fr: "AWS Config" } }
    - { id: d, text: { en: "Amazon Simple Queue Service (Amazon SQS)", fr: "Amazon Simple Queue Service (Amazon SQS)" } }
    - { id: e, text: { en: "Amazon Simple Notification Service (Amazon SNS)", fr: "Amazon Simple Notification Service (Amazon SNS)" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Amazon CloudWatch collects the CPUUtilization metric of the instance, and a CloudWatch alarm changes state when the metric breaches the 80% threshold for the set period. The alarm publishes to an Amazon SNS topic, which delivers the alert to the team's email subscription."
    fr: "Amazon CloudWatch collecte la métrique CPUUtilization de l'instance, et une alarme CloudWatch change d'état lorsque la métrique dépasse le seuil de 80 % pendant la période définie. L'alarme publie dans une rubrique Amazon SNS, qui remet l'alerte à l'abonnement e-mail de l'équipe."
  options:
    a:
      en: "CloudTrail records API calls; it does not watch CPU metrics or send threshold alerts."
      fr: "CloudTrail enregistre les appels d'API ; il ne surveille pas les métriques de processeur et n'envoie pas d'alertes de seuil."
    c:
      en: "AWS Config evaluates resource configurations against rules; it does not monitor CPU utilization."
      fr: "AWS Config évalue la configuration des ressources par rapport à des règles ; il ne surveille pas l'utilisation du processeur."
    d:
      en: "SQS queues messages for applications to poll; it does not send email to people."
      fr: "SQS met en file d'attente des messages que des applications interrogent ; il n'envoie pas d'e-mails à des personnes."
references:
  - title: What is Amazon SNS?
    url: https://docs.aws.amazon.com/sns/latest/dg/welcome.html
