id: clfc02-3c-s3-versioning-recover
objective: "3.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores contracts as objects in an Amazon S3 bucket. Users sometimes overwrite or delete a contract by mistake, and the company must be able to retrieve and restore earlier variants of each object.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke des contrats sous forme d'objets dans un compartiment Amazon S3. Les utilisateurs écrasent ou suppriment parfois un contrat par erreur, et l'entreprise doit pouvoir récupérer et restaurer les variantes antérieures de chaque objet.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Move the objects to S3 One Zone-IA.", fr: "Déplacer les objets vers S3 One Zone-IA." }
    - id: b
      text: { en: "Put an Amazon CloudFront distribution in front of the bucket.", fr: "Placer une distribution Amazon CloudFront devant le compartiment." }
    - id: c
      text: { en: "Copy the objects to an Amazon EBS volume and take snapshots.", fr: "Copier les objets sur un volume Amazon EBS et créer des instantanés." }
    - id: d
      text: { en: "Enable S3 Versioning on the bucket.", fr: "Activer la gestion des versions S3 sur le compartiment." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      S3 Versioning keeps multiple variants of an object in the same bucket. Every version can be preserved, retrieved and restored, which helps recover from unintended overwrites and deletions.
    fr: |-
      La gestion des versions S3 conserve plusieurs variantes d'un objet dans le même compartiment. Chaque version peut être conservée, récupérée et restaurée, ce qui aide à récupérer après des écrasements et des suppressions involontaires.
  options:
    a:
      en: |-
        A storage class changes cost and resilience; it keeps only the current object and does not protect against overwrites.
      fr: |-
        Une classe de stockage modifie le coût et la résilience ; elle ne conserve que l'objet actuel et ne protège pas contre les écrasements.
    b:
      en: |-
        CloudFront caches content for viewers; cached copies expire and are not a way to restore earlier object versions.
      fr: |-
        CloudFront met du contenu en cache pour les utilisateurs ; les copies en cache expirent et ne permettent pas de restaurer des versions antérieures des objets.
    c:
      en: |-
        Moving the data to a block volume adds servers to manage and gives up the S3 object model the application uses.
      fr: |-
        Déplacer les données vers un volume en bloc ajoute des serveurs à gérer et abandonne le modèle d'objets S3 utilisé par l'application.
references:
  - title: "What is Amazon S3? - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
