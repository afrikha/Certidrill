id: clfc02-3b-relational-read-replica
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon RDS for PostgreSQL. Heavy read-only reporting queries slow down the database for the application's users. The company wants to offload these read queries without changing the database engine.

    What should the company do?
  fr: |
    Une entreprise utilise Amazon RDS for PostgreSQL. Des requêtes de reporting en lecture seule très lourdes ralentissent la base de données pour les utilisateurs de l'application. L'entreprise veut décharger ces requêtes de lecture sans changer de moteur de base de données.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Increase the backup retention period of the DB instance.", fr: "Augmenter la période de rétention des sauvegardes de l'instance de base de données." } }
    - { id: b, text: { en: "Turn on storage autoscaling for the DB instance.", fr: "Activer la mise à l'échelle automatique du stockage de l'instance de base de données." } }
    - { id: c, text: { en: "Create a read replica and send the reporting queries to it.", fr: "Créer un réplica en lecture et y envoyer les requêtes de reporting." } }
    - { id: d, text: { en: "Convert the DB instance to a Multi-AZ DB instance deployment.", fr: "Convertir l'instance en déploiement d'instance de base de données Multi-AZ." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An RDS read replica is a read-only copy of the DB instance that is kept up to date asynchronously. Directing read-heavy queries such as reports to the replica reduces the load on the primary DB instance."
    fr: "Un réplica en lecture RDS est une copie en lecture seule de l'instance de base de données, mise à jour de manière asynchrone. Diriger les requêtes de lecture intensives comme les rapports vers le réplica réduit la charge de l'instance principale."
  options:
    a:
      en: "A longer backup retention period keeps backups longer; it does not reduce the query load on the database."
      fr: "Une période de rétention plus longue conserve les sauvegardes plus longtemps ; elle ne réduit pas la charge de requêtes sur la base."
    b:
      en: "Storage autoscaling adds storage space when the database runs low; it does not offload read queries."
      fr: "La mise à l'échelle automatique du stockage ajoute de l'espace quand la base en manque ; elle ne décharge pas les requêtes de lecture."
    d:
      en: "The standby of a Multi-AZ DB instance deployment is used for failover and does not serve read traffic."
      fr: "L'instance de secours d'un déploiement d'instance de base de données Multi-AZ sert au basculement et ne traite pas le trafic de lecture."
references:
  - title: Working with DB instance read replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
