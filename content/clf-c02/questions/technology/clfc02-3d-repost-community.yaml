id: clfc02-3d-repost-community
objective: "3.8.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at a company with Basic Support has a how-to question about Amazon S3. The developer wants to search existing answers and post the question to the AWS community at no additional cost.

    Which AWS resource should the developer use?
  fr: |
    Un développeur d'une entreprise disposant de Basic Support a une question pratique sur Amazon S3. Il veut rechercher des réponses existantes et poser sa question à la communauté AWS sans coût supplémentaire.

    Quelle ressource AWS le développeur doit-il utiliser ?
body:
  options:
    - { id: a, text: "AWS re:Post" }
    - { id: b, text: { en: "A technical support case in the AWS Support Center Console", fr: "Une demande de support technique dans la console AWS Support Center" } }
    - { id: c, text: "AWS Trusted Advisor" }
    - { id: d, text: "AWS Health Dashboard" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS re:Post is the AWS community question-and-answer site. It is part of the communities, along with documentation and whitepapers, that every AWS customer can use with Basic Support at no additional charge."
    fr: "AWS re:Post est le site communautaire de questions et réponses d'AWS. Il fait partie des communautés, avec la documentation et les livres blancs, que tout client AWS peut utiliser avec Basic Support sans frais supplémentaires."
  options:
    b:
      en: "Technical support cases require a paid support plan, so a Basic Support customer cannot open one."
      fr: "Les demandes de support technique exigent un plan de support payant ; un client Basic Support ne peut donc pas en ouvrir."
    c:
      en: "AWS Trusted Advisor runs best-practice checks on an account; it does not answer how-to questions."
      fr: "AWS Trusted Advisor exécute des vérifications de bonnes pratiques sur un compte ; il ne répond pas aux questions pratiques."
    d:
      en: "The AWS Health Dashboard reports service events that affect your resources; it is not a question-and-answer site."
      fr: "L'AWS Health Dashboard signale les événements de service qui touchent vos ressources ; ce n'est pas un site de questions et réponses."
references:
  - title: AWS Support plan comparison – AWS Support features – AWS
    url: https://aws.amazon.com/premiumsupport/plans/
  - title: Case management
    url: https://docs.aws.amazon.com/awssupport/latest/user/case-management.html
