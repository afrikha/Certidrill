id: clfc02-3a-iac-identical-environments
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company must create identical development, test, and production environments in three AWS Regions. Each environment must be built from the same definition, and the company wants to avoid configuration differences between environments.

    Which approach will meet these requirements?
  fr: |
    Une entreprise doit créer des environnements de développement, de test et de production identiques dans trois Régions AWS. Chaque environnement doit être construit à partir de la même définition, et l'entreprise veut éviter les écarts de configuration entre les environnements.

    Quelle approche répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create each environment manually in the AWS Management Console by following a written checklist.", fr: "Créer chaque environnement manuellement dans l'AWS Management Console en suivant une liste de contrôle écrite." } }
    - { id: b, text: { en: "Ask an administrator to type the AWS CLI commands for each environment in a terminal session.", fr: "Demander à un administrateur de taper les commandes AWS CLI de chaque environnement dans une session de terminal." } }
    - { id: c, text: { en: "Describe the environment in an AWS CloudFormation template and create a stack from it for each environment.", fr: "Décrire l'environnement dans un modèle AWS CloudFormation et créer une pile à partir de ce modèle pour chaque environnement." } }
    - { id: d, text: { en: "Use the AWS Console Mobile Application to create the resources of each environment.", fr: "Utiliser l'AWS Console Mobile Application pour créer les ressources de chaque environnement." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Infrastructure as code describes the resources once in a template, and CloudFormation provisions the same resources repeatedly and consistently, in multiple Regions if needed. Every stack built from the template has the same configuration, which removes manual differences.
    fr: |
      L'infrastructure as code décrit les ressources une seule fois dans un modèle, et CloudFormation met en service les mêmes ressources de façon répétée et cohérente, dans plusieurs Régions si nécessaire. Chaque pile construite à partir du modèle a la même configuration, ce qui supprime les écarts manuels.
  options:
    a: { en: "Manual steps in the console are repeated by hand nine times, so differences between environments can creep in.", fr: "Les étapes manuelles dans la console sont répétées à la main neuf fois : des écarts entre les environnements peuvent apparaître." }
    b: { en: "Commands typed by hand for each environment are still manual work and do not guarantee the same configuration every time.", fr: "Des commandes tapées à la main pour chaque environnement restent un travail manuel et ne garantissent pas la même configuration à chaque fois." }
    d: { en: "The mobile app is designed to monitor resources and perform some actions; it is not a way to build complete environments from one definition.", fr: "L'application mobile est conçue pour surveiller les ressources et effectuer certaines actions ; elle ne permet pas de construire des environnements complets à partir d'une même définition." }
references:
  - title: What is CloudFormation?
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html
