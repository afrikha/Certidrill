id: clfc02-3c-shared-storage-az-loss
objective: "3.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Several Linux-based Amazon EC2 instances in different Availability Zones must read and write the same files at the same time. The files must remain available if one Availability Zone fails.

    Which solution will meet these requirements?
  fr: |
    Plusieurs instances Amazon EC2 Linux situées dans différentes zones de disponibilité doivent lire et écrire les mêmes fichiers en même temps. Les fichiers doivent rester disponibles en cas de défaillance d'une zone de disponibilité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon EFS Regional file system and mount it on the instances.", fr: "Créer un système de fichiers Amazon EFS Regional et le monter sur les instances." }
    - id: b
      text: { en: "Attach one Amazon EBS volume with Multi-Attach to all the instances.", fr: "Attacher un seul volume Amazon EBS avec Multi-Attach à toutes les instances." }
    - id: c
      text: { en: "Create an Amazon EFS One Zone file system and mount it on the instances.", fr: "Créer un système de fichiers Amazon EFS One Zone et le monter sur les instances." }
    - id: d
      text: { en: "Store the files on the instance store volume of one instance.", fr: "Stocker les fichiers sur le volume de stockage d'instance d'une instance." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon EFS lets many compute instances access the same file system in parallel. A Regional file system stores data redundantly across multiple Availability Zones, so the files stay available if one zone fails.
    fr: |-
      Amazon EFS permet à de nombreuses instances de calcul d'accéder en parallèle au même système de fichiers. Un système de fichiers Regional stocke les données de façon redondante dans plusieurs zones de disponibilité : les fichiers restent disponibles si une zone tombe en panne.
  options:
    b:
      en: |-
        An EBS volume and its instances must be in the same Availability Zone, so Multi-Attach cannot serve instances in other zones or survive the loss of that zone.
      fr: |-
        Un volume EBS et ses instances doivent se trouver dans la même zone de disponibilité : Multi-Attach ne peut pas desservir des instances d'autres zones ni survivre à la perte de cette zone.
    c:
      en: |-
        EFS One Zone stores data in a single Availability Zone, and the data may be lost if that zone is damaged.
      fr: |-
        EFS One Zone stocke les données dans une seule zone de disponibilité, et elles peuvent être perdues si cette zone est endommagée.
    d:
      en: |-
        Instance store is temporary storage on one host and cannot be attached to other instances.
      fr: |-
        Le stockage d'instance est un stockage temporaire sur un seul hôte et ne peut pas être attaché à d'autres instances.
references:
  - title: "What is Amazon Elastic File System? - Amazon Elastic File System"
    url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
  - title: "Amazon EBS volumes - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes.html
