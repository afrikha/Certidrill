id: clfc02-3c-direct-connect-plus-vpn
objective: "3.5.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial company needs more predictable network performance than the internet provides for traffic between its data center and its VPCs. A compliance rule also requires all of this traffic to be encrypted with IPsec.

    Which solution will meet these requirements?
  fr: |
    Une entreprise financière a besoin, pour le trafic entre son centre de données et ses VPC, de performances réseau plus prévisibles que celles d'Internet. Une règle de conformité exige aussi que tout ce trafic soit chiffré avec IPsec.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use AWS Direct Connect with an AWS Site-to-Site VPN connection over it.", fr: "Utiliser AWS Direct Connect avec une connexion AWS Site-to-Site VPN par-dessus." }
    - id: b
      text: { en: "Use AWS Direct Connect with a private virtual interface only.", fr: "Utiliser AWS Direct Connect avec une interface virtuelle privée uniquement." }
    - id: c
      text: { en: "Use two AWS Site-to-Site VPN tunnels over the internet.", fr: "Utiliser deux tunnels AWS Site-to-Site VPN via Internet." }
    - id: d
      text: { en: "Use AWS Client VPN from each server in the data center.", fr: "Utiliser AWS Client VPN depuis chaque serveur du centre de données." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Combining Direct Connect with Site-to-Site VPN runs an IPsec VPN over the private line. Direct Connect provides more predictable performance than the internet, and the VPN adds the required IPsec encryption.
    fr: |-
      Associer Direct Connect et Site-to-Site VPN fait passer un VPN IPsec sur la ligne privée. Direct Connect offre des performances plus prévisibles qu'Internet, et le VPN ajoute le chiffrement IPsec exigé.
  options:
    b:
      en: |-
        Direct Connect alone gives predictable performance, but the traffic is not carried in IPsec tunnels, so it fails the compliance rule.
      fr: |-
        Direct Connect seul offre des performances prévisibles, mais le trafic n'est pas transporté dans des tunnels IPsec : la règle de conformité n'est pas respectée.
    c:
      en: |-
        Site-to-Site VPN over the internet is encrypted, but its latency and availability depend on internet conditions.
      fr: |-
        Site-to-Site VPN via Internet est chiffré, mais sa latence et sa disponibilité dépendent des conditions d'Internet.
    d:
      en: |-
        Client VPN is for individual users' devices over the internet; it neither connects the network nor improves predictability.
      fr: |-
        Client VPN est destiné aux appareils d'utilisateurs individuels via Internet ; il ne relie pas le réseau et n'améliore pas la prévisibilité.
references:
  - title: "Network-to-Amazon VPC connectivity options - Amazon Virtual Private Cloud Connectivity Options"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-vpc-connectivity-options/network-to-amazon-vpc-connectivity-options.html
