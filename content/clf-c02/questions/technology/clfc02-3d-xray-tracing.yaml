id: clfc02-3d-xray-tracing
objective: "3.8.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's application is made of many microservices. Some user requests are slow, and developers need to follow each request through the services to find which one causes the latency.

    Which AWS service should the developers use?
  fr: |
    L'application d'une entreprise se compose de nombreux microservices. Certaines requêtes d'utilisateurs sont lentes, et les développeurs doivent suivre chaque requête à travers les services pour trouver celui qui provoque la latence.

    Quel service AWS les développeurs doivent-ils utiliser ?
body:
  options:
    - { id: a, text: "AWS CloudTrail" }
    - { id: b, text: "AWS X-Ray" }
    - { id: c, text: "AWS Config" }
    - { id: d, text: "AWS Trusted Advisor" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS X-Ray collects data about the requests that an application serves. Its traces and trace map show the client, the front-end service, and the backend services with latency information for each connection, so developers can identify bottlenecks and latency spikes."
    fr: "AWS X-Ray collecte des données sur les requêtes servies par une application. Ses traces et sa carte des traces (trace map) montrent le client, le service frontal et les services backend avec les informations de latence de chaque connexion, ce qui permet aux développeurs d'identifier les goulets d'étranglement et les pics de latence."
  options:
    a:
      en: "AWS CloudTrail records API calls made in an AWS account for auditing; it does not trace user requests through microservices."
      fr: "AWS CloudTrail enregistre les appels d'API effectués dans un compte AWS à des fins d'audit ; il ne trace pas les requêtes des utilisateurs à travers les microservices."
    c:
      en: "AWS Config records resource configurations and their changes; it does not measure request latency."
      fr: "AWS Config enregistre les configurations des ressources et leurs modifications ; il ne mesure pas la latence des requêtes."
    d:
      en: "AWS Trusted Advisor checks an account against best practices; it does not trace individual requests."
      fr: "AWS Trusted Advisor vérifie un compte par rapport aux bonnes pratiques ; il ne trace pas les requêtes individuelles."
references:
  - title: What is AWS X-Ray?
    url: https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html
