id: clfc02-3b-db-purpose-built
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores all its data in one large relational database: customer orders, user session data that needs very fast in-memory access, and a product recommendation graph. Each workload performs poorly.

    Which approach does AWS recommend for these workloads?
  fr: |
    Une entreprise stocke toutes ses données dans une seule grande base de données relationnelle : les commandes clients, des données de session utilisateur qui exigent un accès en mémoire très rapide et un graphe de recommandation de produits. Chaque charge de travail fonctionne mal.

    Quelle approche AWS recommande-t-il pour ces charges de travail ?
body:
  options:
    - { id: a, text: { en: "Move the database to a larger instance so that one engine can serve every workload.", fr: "Déplacer la base de données vers une instance plus grande pour qu'un seul moteur serve toutes les charges de travail." } }
    - { id: b, text: { en: "Store all the data as files in Amazon S3 and query it with Amazon Athena.", fr: "Stocker toutes les données sous forme de fichiers dans Amazon S3 et les interroger avec Amazon Athena." } }
    - { id: c, text: { en: "Install the same relational engine on Amazon EC2 to gain full control of tuning.", fr: "Installer le même moteur relationnel sur Amazon EC2 pour contrôler entièrement le réglage." } }
    - { id: d, text: { en: "Use a purpose-built database for each workload, such as RDS, ElastiCache, and Neptune.", fr: "Utiliser une base spécialisée pour chaque charge de travail, comme RDS, ElastiCache et Neptune." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS offers database services designed for specific data models (relational, in-memory, graph, document, key-value), so each workload can use the type whose strengths fit it. Orders fit a relational database such as Amazon RDS, session data that needs fast in-memory access fits an in-memory store such as ElastiCache, and relationship queries fit a graph database such as Neptune."
    fr: "AWS propose des services de base de données conçus pour des modèles de données précis (relationnel, en mémoire, graphe, document, clé-valeur) : chaque charge de travail peut utiliser le type dont les points forts lui conviennent. Les commandes conviennent à une base relationnelle comme Amazon RDS, les données de session qui exigent un accès rapide en mémoire à un magasin en mémoire comme ElastiCache, et les requêtes sur les relations à une base orientée graphe comme Neptune."
  options:
    a:
      en: "A larger instance adds resources but keeps one relational model for every workload, so in-memory and graph access patterns remain poorly served."
      fr: "Une instance plus grande ajoute des ressources mais conserve un seul modèle relationnel pour toutes les charges de travail : les accès en mémoire et en graphe restent mal servis."
    b:
      en: "Athena queries on S3 suit analytics; they do not provide fast in-memory access for session data or transactional order processing."
      fr: "Les requêtes Athena sur S3 conviennent à l'analytique ; elles ne fournissent ni accès rapide en mémoire pour les sessions ni traitement transactionnel des commandes."
    c:
      en: "Self-managing the same engine on EC2 adds administration work and still uses one data model for every workload."
      fr: "Autogérer le même moteur sur EC2 ajoute du travail d'administration et utilise toujours un seul modèle de données pour toutes les charges de travail."
references:
  - title: Choosing an AWS database service
    url: https://docs.aws.amazon.com/decision-guides/latest/databases-on-aws-how-to-choose/databases-on-aws-how-to-choose.html
