id: clfc02-3c-elasticache-memcached-clients
objective: "3.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a self-managed Memcached cluster on Amazon EC2 instances. It wants AWS to take over node provisioning, monitoring, node replacement and software patching, without changing the Memcached clients in its applications.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise exécute un cluster Memcached autogéré sur des instances Amazon EC2. Elle souhaite qu'AWS prenne en charge le provisionnement des nœuds, la surveillance, le remplacement des nœuds et l'application des correctifs logiciels, sans modifier les clients Memcached de ses applications.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "DynamoDB Accelerator (DAX)", fr: "DynamoDB Accelerator (DAX)" }
    - id: b
      text: { en: "Amazon CloudFront", fr: "Amazon CloudFront" }
    - id: c
      text: { en: "Amazon DynamoDB", fr: "Amazon DynamoDB" }
    - id: d
      text: { en: "Amazon ElastiCache", fr: "Amazon ElastiCache" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Amazon ElastiCache supports the Memcached, Valkey and Redis OSS engines. The service handles hardware provisioning, monitoring, node replacement and software patching, and existing Memcached clients connect to it without code changes.
    fr: |-
      Amazon ElastiCache prend en charge les moteurs Memcached, Valkey et Redis OSS. Le service gère le provisionnement du matériel, la surveillance, le remplacement des nœuds et l'application des correctifs logiciels, et les clients Memcached existants s'y connectent sans modification du code.
  options:
    a:
      en: |-
        DAX is an in-memory cache dedicated to DynamoDB tables; it does not run the Memcached engine.
      fr: |-
        DAX est un cache en mémoire dédié aux tables DynamoDB ; il n'exécute pas le moteur Memcached.
    b:
      en: |-
        CloudFront caches web content at edge locations for viewers; it is not an application data cache that Memcached clients use.
      fr: |-
        CloudFront met en cache du contenu web dans des emplacements périphériques pour les utilisateurs ; ce n'est pas un cache de données applicatives utilisé par des clients Memcached.
    c:
      en: |-
        DynamoDB is a NoSQL database with its own API; the Memcached clients would have to be replaced.
      fr: |-
        DynamoDB est une base de données NoSQL dotée de sa propre API ; les clients Memcached devraient être remplacés.
references:
  - title: "What is Amazon ElastiCache? - Amazon ElastiCache"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html
