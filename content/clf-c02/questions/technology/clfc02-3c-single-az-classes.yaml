id: clfc02-3c-single-az-classes
objective: "3.6.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company must document which of its Amazon S3 data is not resilient to the physical loss of an Availability Zone.

    Which S3 storage classes store data in a single Availability Zone? (Choose two.)
  fr: |
    Une entreprise doit documenter lesquelles de ses données Amazon S3 ne résistent pas à la perte physique d'une zone de disponibilité.

    Quelles classes de stockage S3 stockent les données dans une seule zone de disponibilité ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "S3 Standard-IA", fr: "S3 Standard-IA" }
    - id: b
      text: { en: "S3 One Zone-IA", fr: "S3 One Zone-IA" }
    - id: c
      text: { en: "S3 Glacier Instant Retrieval", fr: "S3 Glacier Instant Retrieval" }
    - id: d
      text: { en: "S3 Intelligent-Tiering", fr: "S3 Intelligent-Tiering" }
    - id: e
      text: { en: "S3 Express One Zone", fr: "S3 Express One Zone" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      S3 One Zone-IA and S3 Express One Zone store data in one Availability Zone, so they are the only storage classes that are not resilient to the physical loss of that zone. The other classes store data across at least three Availability Zones.
    fr: |-
      S3 One Zone-IA et S3 Express One Zone stockent les données dans une seule zone de disponibilité : ce sont les seules classes de stockage qui ne résistent pas à la perte physique de cette zone. Les autres classes stockent les données dans au moins trois zones de disponibilité.
  options:
    a:
      en: |-
        Standard-IA stores data across at least three Availability Zones.
      fr: |-
        Standard-IA stocke les données dans au moins trois zones de disponibilité.
    c:
      en: |-
        Glacier Instant Retrieval stores data across at least three Availability Zones.
      fr: |-
        Glacier Instant Retrieval stocke les données dans au moins trois zones de disponibilité.
    d:
      en: |-
        Intelligent-Tiering stores data across at least three Availability Zones in all its access tiers.
      fr: |-
        Intelligent-Tiering stocke les données dans au moins trois zones de disponibilité, quel que soit le niveau d'accès.
references:
  - title: "Understanding and managing Amazon S3 storage classes - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
