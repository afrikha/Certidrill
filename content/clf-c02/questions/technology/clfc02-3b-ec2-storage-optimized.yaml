id: clfc02-3b-ec2-storage-optimized
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a self-managed NoSQL database cluster on Amazon EC2. Each node needs very high, low-latency read and write I/O to a large data set stored on local disks attached to the instance.

    Which Amazon EC2 instance category is the BEST fit?
  fr: |
    Une entreprise exécute un cluster de bases de données NoSQL autogéré sur Amazon EC2. Chaque nœud a besoin d'E/S de lecture et d'écriture très élevées et à faible latence vers un grand jeu de données stocké sur les disques locaux attachés à l'instance.

    Quelle catégorie d'instances Amazon EC2 est la PLUS adaptée ?
body:
  options:
    - { id: a, text: { en: "Storage optimized", fr: "Optimisée pour le stockage" } }
    - { id: b, text: { en: "General purpose", fr: "Usage général" } }
    - { id: c, text: { en: "Compute optimized", fr: "Optimisée pour le calcul" } }
    - { id: d, text: { en: "Accelerated computing", fr: "Calcul accéléré" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Storage optimized instances, such as the I and D families, are designed for workloads that need high sequential read and write access to very large data sets on local storage. They deliver tens of thousands of low-latency, random I/O operations per second (IOPS), which suits high-throughput databases."
    fr: "Les instances optimisées pour le stockage, comme les familles I et D, sont conçues pour les charges de travail qui ont besoin d'accès séquentiels intensifs en lecture et en écriture à de très grands jeux de données sur stockage local. Elles fournissent des dizaines de milliers d'opérations d'E/S aléatoires par seconde (IOPS) à faible latence, ce qui convient aux bases de données à haut débit."
  options:
    b:
      en: "General purpose instances balance resources and are not designed for very high I/O to large local data sets."
      fr: "Les instances à usage général équilibrent les ressources et ne sont pas conçues pour des E/S très élevées vers de grands jeux de données locaux."
    c:
      en: "Compute optimized instances favor processor performance; the bottleneck described is local storage I/O."
      fr: "Les instances optimisées pour le calcul privilégient les performances du processeur ; le goulot d'étranglement décrit est l'E/S du stockage local."
    d:
      en: "Accelerated computing instances add GPUs or other accelerators for calculations such as machine learning, not fast local disk I/O."
      fr: "Les instances de calcul accéléré ajoutent des GPU ou d'autres accélérateurs pour des calculs comme le machine learning, pas des E/S rapides sur disques locaux."
references:
  - title: Specifications for Amazon EC2 storage optimized instances
    url: https://docs.aws.amazon.com/ec2/latest/instancetypes/so.html
