id: clfc02-3a-aurora-global-database
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon Aurora MySQL-Compatible Edition DB cluster in one AWS Region. The database must be recoverable quickly in a second Region, with little data loss, if the whole first Region becomes unavailable. Users near the second Region also need low-latency reads.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster de bases de données Amazon Aurora MySQL-Compatible Edition dans une Région AWS. La base de données doit pouvoir être rétablie rapidement dans une deuxième Région, avec peu de perte de données, si toute la première Région devient indisponible. Les utilisateurs proches de la deuxième Région ont aussi besoin de lectures à faible latence.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add Aurora Replicas in other Availability Zones of the same Region.", fr: "Ajouter des réplicas Aurora dans d'autres zones de disponibilité de la même Région." } }
    - { id: b, text: { en: "Convert the cluster into an Aurora global database with a secondary cluster in the second Region.", fr: "Convertir le cluster en base de données globale Aurora avec un cluster secondaire dans la deuxième Région." } }
    - { id: c, text: { en: "Increase the backup retention period of the cluster's automated backups.", fr: "Allonger la période de conservation des sauvegardes automatiques du cluster." } }
    - { id: d, text: { en: "Change the cluster to a larger DB instance class.", fr: "Passer le cluster à une classe d'instance de base de données plus grande." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Aurora global database replicates the cluster storage to secondary Regions with latency typically under one second. The secondary cluster serves low-latency reads in its Region, and if the primary Region becomes unavailable, it can be promoted to primary with a low RTO and little data loss.
    fr: |
      Une base de données globale Aurora réplique le stockage du cluster dans des Régions secondaires avec une latence généralement inférieure à une seconde. Le cluster secondaire sert des lectures à faible latence dans sa Région et, si la Région principale devient indisponible, il peut être promu cluster principal avec un RTO faible et peu de perte de données.
  options:
    a: { en: "Aurora Replicas in other zones protect against the loss of an Availability Zone, not of the whole Region.", fr: "Des réplicas Aurora dans d'autres zones protègent contre la perte d'une zone de disponibilité, pas de toute la Région." }
    c: { en: "Automated backups stay in the cluster's Region, so they do not provide recovery or reads in a second Region.", fr: "Les sauvegardes automatiques restent dans la Région du cluster : elles n'offrent ni reprise ni lectures dans une deuxième Région." }
    d: { en: "A larger instance class adds capacity in the same Region and does not survive the loss of that Region.", fr: "Une classe d'instance plus grande ajoute de la capacité dans la même Région et ne résiste pas à la perte de cette Région." }
references:
  - title: Using Amazon Aurora Global Database
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html
