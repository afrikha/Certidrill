id: clfc02-3e-sns-multichannel-notify
objective: "3.8.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to notify its subscribers by email, SMS text message and mobile push notification each time it publishes a product announcement.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise souhaite avertir ses abonnés par e-mail, par SMS et par notification push mobile chaque fois qu'elle publie une annonce de produit.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Amazon Simple Queue Service (Amazon SQS)", fr: "Amazon Simple Queue Service (Amazon SQS)" } }
    - { id: b, text: { en: "Amazon Simple Email Service (Amazon SES)", fr: "Amazon Simple Email Service (Amazon SES)" } }
    - { id: c, text: { en: "Amazon EventBridge", fr: "Amazon EventBridge" } }
    - { id: d, text: { en: "Amazon Simple Notification Service (Amazon SNS)", fr: "Amazon Simple Notification Service (Amazon SNS)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon SNS is a publish/subscribe service: a message published once to a topic is delivered to all its subscribers. For application-to-person messaging, SNS delivers to email addresses, mobile push notifications and SMS text messages."
    fr: "Amazon SNS est un service de publication/abonnement : un message publié une fois dans une rubrique est remis à tous ses abonnés. Pour la messagerie d'application à personne, SNS remet les messages à des adresses e-mail, sous forme de notifications push mobiles et de SMS."
  options:
    a:
      en: "SQS stores messages in a queue until an application polls and processes them; it does not deliver to people by SMS, email or push."
      fr: "SQS stocke des messages dans une file d'attente jusqu'à ce qu'une application les interroge et les traite ; il ne remet pas de messages à des personnes par SMS, e-mail ou push."
    b:
      en: "SES sends and receives email only; it does not send SMS text messages or mobile push notifications."
      fr: "SES envoie et reçoit uniquement des e-mails ; il n'envoie ni SMS ni notifications push mobiles."
    c:
      en: "EventBridge routes events between applications and services; it does not deliver SMS or push notifications to people."
      fr: "EventBridge achemine des événements entre applications et services ; il ne remet pas de SMS ni de notifications push à des personnes."
references:
  - title: What is Amazon SNS?
    url: https://docs.aws.amazon.com/sns/latest/dg/welcome.html
