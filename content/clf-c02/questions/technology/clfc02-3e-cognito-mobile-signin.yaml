id: clfc02-3e-cognito-mobile-signin
objective: "3.8.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup is building a mobile app. Users must be able to sign up and sign in to the app, including with social identity providers such as Google or Apple.

    Which AWS service should the startup use?
  fr: |
    Une start-up crée une application mobile. Les utilisateurs doivent pouvoir s'inscrire et se connecter à l'application, y compris avec des fournisseurs d'identité sociaux comme Google ou Apple.

    Quel service AWS la start-up doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "AWS Identity and Access Management (IAM)", fr: "AWS Identity and Access Management (IAM)" } }
    - { id: b, text: { en: "AWS IAM Identity Center", fr: "AWS IAM Identity Center" } }
    - { id: c, text: { en: "Amazon Cognito", fr: "Amazon Cognito" } }
    - { id: d, text: { en: "AWS Directory Service", fr: "AWS Directory Service" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Cognito is an identity platform for web and mobile apps. A Cognito user pool is a user directory that handles sign-up and sign-in for the app and supports federation with social providers such as Google, Apple, Facebook and Amazon."
    fr: "Amazon Cognito est une plateforme d'identité pour les applications web et mobiles. Un groupe d'utilisateurs Cognito est un annuaire d'utilisateurs qui gère l'inscription et la connexion à l'application et prend en charge la fédération avec des fournisseurs sociaux comme Google, Apple, Facebook et Amazon."
  options:
    a:
      en: "IAM manages access to AWS resources for the company's own users and roles, not sign-up and sign-in for app customers."
      fr: "IAM gère l'accès aux ressources AWS pour les utilisateurs et rôles de l'entreprise, pas l'inscription et la connexion des clients d'une application."
    b:
      en: "IAM Identity Center gives the workforce single sign-on to AWS accounts and business applications, not customer sign-up in a mobile app."
      fr: "IAM Identity Center donne aux employés une authentification unique pour les comptes AWS et les applications métier, pas l'inscription des clients dans une application mobile."
    d:
      en: "Directory Service provides managed Microsoft Active Directory for workloads; it is not a sign-up service for mobile app users."
      fr: "Directory Service fournit un Microsoft Active Directory géré pour les charges de travail ; ce n'est pas un service d'inscription pour les utilisateurs d'une application mobile."
references:
  - title: What is Amazon Cognito?
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html
