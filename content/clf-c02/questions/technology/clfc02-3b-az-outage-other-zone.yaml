id: clfc02-3b-az-outage-other-zone
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs identical Amazon EC2 instances in two Availability Zones of the same Region. A utility power failure affects the data centers of one of these Availability Zones.

    What is the expected effect on the instances in the other Availability Zone?
  fr: |
    Une entreprise exécute des instances Amazon EC2 identiques dans deux zones de disponibilité de la même Région. Une panne du réseau électrique public touche les centres de données de l'une de ces zones de disponibilité.

    Quel est l'effet attendu sur les instances de l'autre zone de disponibilité ?
body:
  options:
    - { id: a, text: { en: "They keep running, because each Availability Zone is supplied by separate power infrastructure.", fr: "Elles continuent de s'exécuter, car chaque zone de disponibilité est alimentée par une infrastructure électrique distincte." } }
    - { id: b, text: { en: "They stop, because all Availability Zones in a Region share the same power substation.", fr: "Elles s'arrêtent, car toutes les zones de disponibilité d'une Région partagent le même poste électrique." } }
    - { id: c, text: { en: "They are moved automatically by AWS to another Region until power is restored.", fr: "AWS les déplace automatiquement vers une autre Région jusqu'au rétablissement du courant." } }
    - { id: d, text: { en: "They restart, because AWS fails over every Availability Zone of the Region at the same time.", fr: "Elles redémarrent, car AWS bascule toutes les zones de disponibilité de la Région en même temps." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Availability Zones are designed so that events such as a utility power loss do not affect several zones at once: they are supplied by different power substations and do not share generators or cooling. The instances in the unaffected Availability Zone continue to run and can keep serving the application."
    fr: "Les zones de disponibilité sont conçues pour qu'un événement comme une perte d'alimentation électrique publique ne touche pas plusieurs zones à la fois : elles sont alimentées par des postes électriques différents et ne partagent ni groupes électrogènes ni refroidissement. Les instances de la zone de disponibilité non touchée continuent de s'exécuter et peuvent continuer à servir l'application."
  options:
    b:
      en: "Availability Zones are designed to be supplied by different power substations precisely so that one power event does not affect them all."
      fr: "Les zones de disponibilité sont justement conçues pour être alimentées par des postes électriques différents, afin qu'un seul incident électrique ne les touche pas toutes."
    c:
      en: "AWS does not move or replicate instances across Regions automatically; any multi-Region design is the customer's choice."
      fr: "AWS ne déplace pas et ne réplique pas automatiquement les instances entre Régions ; toute architecture multi-Régions est un choix du client."
    d:
      en: "A failure in one Availability Zone does not trigger a restart of the other zones; they are isolated from each other."
      fr: "Une panne dans une zone de disponibilité ne déclenche pas de redémarrage des autres zones ; elles sont isolées les unes des autres."
references:
  - title: Availability Zones
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/availability-zones.html
  - title: Regions and Zones
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html
