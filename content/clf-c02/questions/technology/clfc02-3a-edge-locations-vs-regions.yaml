id: clfc02-3a-edge-locations-vs-regions
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement about AWS edge locations is correct?
  fr: |
    Quelle affirmation sur les emplacements périphériques AWS est correcte ?
body:
  options:
    - { id: a, text: { en: "Each edge location is one of the Availability Zones of the nearest Region.", fr: "Chaque emplacement périphérique est l'une des zones de disponibilité de la Région la plus proche." } }
    - { id: b, text: { en: "Each Region has exactly one edge location, in the same city as the Region.", fr: "Chaque Région possède exactement un emplacement périphérique, dans la même ville que la Région." } }
    - { id: c, text: { en: "Edge locations are separate from Regions and far more numerous, so they are closer to many users.", fr: "Les emplacements périphériques sont distincts des Régions et bien plus nombreux : ils sont donc plus proches de nombreux utilisateurs." } }
    - { id: d, text: { en: "Customers must choose an Availability Zone in which to create each edge location.", fr: "Les clients doivent choisir une zone de disponibilité dans laquelle créer chaque emplacement périphérique." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Edge locations are AWS sites, separate from Regions and Availability Zones, spread across many more cities than there are Regions. Services such as Amazon CloudFront use them to serve users from a nearby location, while the origin content stays in a Region.
    fr: |
      Les emplacements périphériques sont des sites AWS, distincts des Régions et des zones de disponibilité, répartis dans beaucoup plus de villes qu'il n'y a de Régions. Des services comme Amazon CloudFront les utilisent pour servir les utilisateurs depuis un endroit proche, tandis que le contenu d'origine reste dans une Région.
  options:
    a: { en: "Edge locations are not Availability Zones; they are separate sites used to deliver content and network traffic close to users.", fr: "Les emplacements périphériques ne sont pas des zones de disponibilité ; ce sont des sites distincts qui servent à diffuser du contenu et du trafic réseau près des utilisateurs." }
    b: { en: "There are many more edge locations than Regions, including in cities that have no Region.", fr: "Il existe beaucoup plus d'emplacements périphériques que de Régions, y compris dans des villes sans Région." }
    d: { en: "AWS builds and operates edge locations; customers do not create them, and they are not placed in an Availability Zone.", fr: "AWS construit et exploite les emplacements périphériques ; les clients ne les créent pas, et ils ne sont pas placés dans une zone de disponibilité." }
references:
  - title: What is Amazon CloudFront?
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
