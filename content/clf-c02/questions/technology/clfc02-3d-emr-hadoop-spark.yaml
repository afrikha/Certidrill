id: clfc02-3d-emr-hadoop-spark
objective: "3.7.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company processes large datasets with Apache Hadoop and Apache Spark on an on-premises cluster. It wants to run the same frameworks on AWS on a managed cluster platform instead of maintaining its own servers.

    Which AWS service should the company use?
  fr: |
    Une entreprise traite de grands jeux de données avec Apache Hadoop et Apache Spark sur un cluster sur site. Elle veut exécuter les mêmes frameworks sur AWS sur une plateforme de clusters gérée, au lieu d'entretenir ses propres serveurs.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon EMR" }
    - { id: b, text: "Amazon Redshift" }
    - { id: c, text: "Amazon OpenSearch Service" }
    - { id: d, text: "Amazon Kinesis Data Streams" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon EMR is a managed cluster platform that simplifies running big data frameworks such as Apache Hadoop and Apache Spark on AWS to process and analyze large amounts of data. The company keeps its frameworks and no longer maintains its own cluster servers."
    fr: "Amazon EMR est une plateforme de clusters gérée qui simplifie l'exécution de frameworks big data comme Apache Hadoop et Apache Spark sur AWS pour traiter et analyser de grandes quantités de données. L'entreprise conserve ses frameworks et n'entretient plus ses propres serveurs de cluster."
  options:
    b:
      en: "Amazon Redshift is a SQL data warehouse; it does not run Hadoop and Spark jobs on a cluster that you configure."
      fr: "Amazon Redshift est un entrepôt de données SQL ; il n'exécute pas de tâches Hadoop et Spark sur un cluster que vous configurez."
    c:
      en: "Amazon OpenSearch Service provides search and log analytics with OpenSearch; it does not run Hadoop or Spark frameworks."
      fr: "Amazon OpenSearch Service fournit la recherche et l'analytique de journaux avec OpenSearch ; il n'exécute pas les frameworks Hadoop ou Spark."
    d:
      en: "Amazon Kinesis Data Streams collects and stores streaming data records; it does not run batch big data frameworks."
      fr: "Amazon Kinesis Data Streams collecte et stocke des enregistrements de données en streaming ; il n'exécute pas de frameworks big data par lots."
references:
  - title: What is Amazon EMR?
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-what-is-emr.html
