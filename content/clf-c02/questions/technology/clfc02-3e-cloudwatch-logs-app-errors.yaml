id: clfc02-3e-cloudwatch-logs-app-errors
objective: "3.8.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers need to troubleshoot errors in an application that runs on several Amazon EC2 instances. They want the application's log output collected in one place so that they can search it and count occurrences of a specific exception.

    Which AWS service will meet these requirements?
  fr: |
    Des développeurs doivent dépanner des erreurs dans une application qui s'exécute sur plusieurs instances Amazon EC2. Ils veulent que la sortie des journaux de l'application soit collectée en un seul endroit afin de pouvoir y effectuer des recherches et compter les occurrences d'une exception précise.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" } }
    - { id: b, text: { en: "Amazon CloudWatch Logs", fr: "Amazon CloudWatch Logs" } }
    - { id: c, text: { en: "AWS Config", fr: "AWS Config" } }
    - { id: d, text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon CloudWatch Logs centralizes logs from EC2 instances, applications and AWS services. Developers search and analyze them with CloudWatch Logs Insights, and metric filters count occurrences of a term such as an exception name without code changes."
    fr: "Amazon CloudWatch Logs centralise les journaux des instances EC2, des applications et des services AWS. Les développeurs y effectuent des recherches et des analyses avec CloudWatch Logs Insights, et des filtres de métriques comptent les occurrences d'un terme comme un nom d'exception sans modifier le code."
  options:
    a:
      en: "CloudTrail captures API calls made in the AWS account; it does not collect the application's own log output."
      fr: "CloudTrail capture les appels d'API effectués dans le compte AWS ; il ne collecte pas la sortie des journaux de l'application elle-même."
    c:
      en: "AWS Config records the configuration history of AWS resources, not application logs."
      fr: "AWS Config enregistre l'historique de configuration des ressources AWS, pas les journaux d'application."
    d:
      en: "Trusted Advisor checks the account against best practices; it does not store or search application logs."
      fr: "Trusted Advisor vérifie le compte par rapport aux bonnes pratiques ; il ne stocke pas les journaux d'application et ne permet pas d'y faire des recherches."
references:
  - title: What is Amazon CloudWatch Logs?
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/WhatIsCloudWatchLogs.html
