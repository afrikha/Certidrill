id: clfc02-3c-object-storage-media
objective: "3.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is choosing where to store different kinds of data for a new application.

    Which data is the BEST fit for object storage such as Amazon S3?
  fr: |
    Une entreprise choisit où stocker différents types de données pour une nouvelle application.

    Quelles données conviennent LE MIEUX à un stockage d'objets comme Amazon S3 ?
body:
  options:
    - id: a
      text: { en: "The operating system boot volume of an EC2 instance", fr: "Le volume de démarrage du système d'exploitation d'une instance EC2" }
    - id: b
      text: { en: "Photos and videos uploaded by users of a mobile app", fr: "Les photos et vidéos chargées par les utilisateurs d'une application mobile" }
    - id: c
      text: { en: "A shared POSIX file system mounted by Linux servers", fr: "Un système de fichiers POSIX partagé monté par des serveurs Linux" }
    - id: d
      text: { en: "Temporary scratch data on a disk attached to the host", fr: "Des données temporaires de travail sur un disque attaché à l'hôte" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon S3 stores any amount of data as objects in buckets, each object being a file plus its metadata, retrieved by key. Media files uploaded by mobile apps are a typical use of object storage, along with backups, archives and data lakes.
    fr: |-
      Amazon S3 stocke n'importe quelle quantité de données sous forme d'objets dans des compartiments, chaque objet étant un fichier accompagné de ses métadonnées et récupéré par sa clé. Les fichiers multimédias chargés par des applications mobiles sont une utilisation typique du stockage d'objets, au même titre que les sauvegardes, les archives et les lacs de données.
  options:
    a:
      en: |-
        A boot volume needs block storage, such as an Amazon EBS volume, that the instance uses like a hard drive.
      fr: |-
        Un volume de démarrage nécessite un stockage en bloc, comme un volume Amazon EBS, que l'instance utilise comme un disque dur.
    c:
      en: |-
        A mounted POSIX file system is file storage, such as Amazon EFS, not object storage.
      fr: |-
        Un système de fichiers POSIX monté relève du stockage de fichiers, comme Amazon EFS, et non du stockage d'objets.
    d:
      en: |-
        Scratch data on a disk attached to the host is the use case of EC2 instance store, which is block storage.
      fr: |-
        Les données de travail sur un disque attaché à l'hôte correspondent au stockage d'instance EC2, qui est un stockage en bloc.
references:
  - title: "What is Amazon S3? - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
