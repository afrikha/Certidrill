id: clfc02-3d-connect-contact-center
objective: "3.8.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company wants to set up a cloud-based customer service center. Agents must answer customer phone calls and chats, calls must be routed to the right group of agents, and the company wants to pay only for what it uses.

    Which AWS service meets these requirements?
  fr: |
    Une entreprise de distribution veut mettre en place un service client dans le cloud. Les agents doivent répondre aux appels téléphoniques et aux discussions des clients, les appels doivent être acheminés vers le bon groupe d'agents, et l'entreprise veut payer uniquement ce qu'elle utilise.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Connect" }
    - { id: b, text: "AWS Direct Connect" }
    - { id: c, text: "Amazon Simple Notification Service (Amazon SNS)" }
    - { id: d, text: "Amazon WorkSpaces" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Connect is a contact center as a service: the company claims phone numbers, creates queues and routing profiles to send voice and chat contacts to the right agents, and pays only for what it uses. The AWS documentation now names this product Amazon Connect Customer."
    fr: "Amazon Connect est un centre de contact en tant que service : l'entreprise obtient des numéros de téléphone, crée des files d'attente et des profils de routage pour acheminer les contacts vocaux et par chat vers les bons agents, et ne paie que ce qu'elle utilise. La documentation AWS nomme désormais ce produit Amazon Connect Customer."
  options:
    b:
      en: "AWS Direct Connect is a dedicated network connection between a data center and AWS; it has nothing to do with customer calls."
      fr: "AWS Direct Connect est une connexion réseau dédiée entre un centre de données et AWS ; il n'a rien à voir avec les appels des clients."
    c:
      en: "Amazon SNS pushes notifications to subscribers; it does not route customer calls and chats to agents."
      fr: "Amazon SNS pousse des notifications vers des abonnés ; il n'achemine pas les appels et les discussions des clients vers des agents."
    d:
      en: "Amazon WorkSpaces provides virtual desktops; it can host agents' desktops but does not handle or route customer contacts."
      fr: "Amazon WorkSpaces fournit des bureaux virtuels ; il peut héberger les postes des agents, mais il ne traite ni n'achemine les contacts des clients."
references:
  - title: Get started with Connect Customer
    url: https://docs.aws.amazon.com/connect/latest/adminguide/amazon-connect-get-started.html
  - title: What is Connect Customer?
    url: https://docs.aws.amazon.com/connect/latest/adminguide/what-is-amazon-connect.html
