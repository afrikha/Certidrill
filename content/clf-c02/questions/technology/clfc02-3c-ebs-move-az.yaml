id: clfc02-3c-ebs-move-az
objective: "3.6.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon EBS volume is attached to an EC2 instance in Availability Zone A. The company must make the volume's data available to a new EC2 instance in Availability Zone B of the same Region.

    What should the company do?
  fr: |
    Un volume Amazon EBS est attaché à une instance EC2 dans la zone de disponibilité A. L'entreprise doit rendre les données du volume disponibles pour une nouvelle instance EC2 dans la zone de disponibilité B de la même Région.

    Que doit faire l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Detach the volume and attach it directly to the new instance.", fr: "Détacher le volume et l'attacher directement à la nouvelle instance." }
    - id: b
      text: { en: "Enable Multi-Attach on the volume and attach it to the new instance.", fr: "Activer Multi-Attach sur le volume et l'attacher à la nouvelle instance." }
    - id: c
      text: { en: "Copy the volume's data to the new instance's instance store volume.", fr: "Copier les données du volume sur le volume de stockage d'instance de la nouvelle instance." }
    - id: d
      text: { en: "Create a snapshot, then create a volume from it in Availability Zone B.", fr: "Créer un instantané, puis créer à partir de celui-ci un volume dans la zone de disponibilité B." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An EBS volume and the instance it attaches to must be in the same Availability Zone. An EBS snapshot is a point-in-time backup from which a new volume can be restored in another Availability Zone, and that new volume is then attached to the instance in zone B.
    fr: |-
      Un volume EBS et l'instance à laquelle il est attaché doivent se trouver dans la même zone de disponibilité. Un instantané EBS est une sauvegarde à un moment précis à partir de laquelle un nouveau volume peut être restauré dans une autre zone de disponibilité, puis attaché à l'instance de la zone B.
  options:
    a:
      en: |-
        A volume can be attached only to instances in its own Availability Zone.
      fr: |-
        Un volume ne peut être attaché qu'à des instances de sa propre zone de disponibilité.
    b:
      en: |-
        Multi-Attach shares a volume between instances, but the volume still stays in its own Availability Zone.
      fr: |-
        Multi-Attach partage un volume entre des instances, mais le volume reste dans sa propre zone de disponibilité.
    c:
      en: |-
        Instance store is temporary: the copied data would be lost when the new instance stops.
      fr: |-
        Le stockage d'instance est temporaire : les données copiées seraient perdues à l'arrêt de la nouvelle instance.
references:
  - title: "Amazon EBS volumes - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes.html
  - title: "What is Amazon Elastic Block Store? - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/what-is-ebs.html
