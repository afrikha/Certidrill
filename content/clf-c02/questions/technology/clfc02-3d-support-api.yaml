id: clfc02-3d-support-api
objective: "3.8.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has the Business Support+ plan. It wants its internal ticketing system to create AWS support cases and update them programmatically, without users opening the Support Center Console.

    Which AWS Support feature should the company use?
  fr: |
    Une entreprise dispose du plan Business Support+. Elle veut que son système de tickets interne crée des demandes de support AWS et les mette à jour par programmation, sans que les utilisateurs ouvrent la console Support Center.

    Quelle fonctionnalité d'AWS Support l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "AWS re:Post" }
    - { id: b, text: "AWS Trusted Advisor Priority" }
    - { id: c, text: { en: "A designated Technical Account Manager (TAM)", fr: "Un Technical Account Manager (TAM) désigné" } }
    - { id: d, text: "AWS Support API" }
answer: { optionId: d }
explanation:
  correct:
    en: "The AWS Support API lets applications create and manage support cases programmatically. It is included in the paid plans, Business Support+, Enterprise Support, and Unified Operations, together with phone, web, chat, and email access."
    fr: "L'AWS Support API permet aux applications de créer et de gérer des demandes de support par programmation. Elle est incluse dans les plans payants, Business Support+, Enterprise Support et Unified Operations, avec l'accès par téléphone, web, chat et e-mail."
  options:
    a:
      en: "AWS re:Post is a community question-and-answer site; it does not create cases in the company's account."
      fr: "AWS re:Post est un site communautaire de questions et réponses ; il ne crée pas de demandes dans le compte de l'entreprise."
    b:
      en: "Trusted Advisor Priority highlights prioritized recommendations, and it is part of Enterprise Support and Unified Operations, not Business Support+."
      fr: "Trusted Advisor Priority met en avant des recommandations hiérarchisées, et il fait partie d'Enterprise Support et d'Unified Operations, pas de Business Support+."
    c:
      en: "A designated TAM is a person who guides the company, and it comes with Enterprise Support or Unified Operations; it is not an integration for a ticketing system."
      fr: "Un TAM désigné est une personne qui accompagne l'entreprise, et il est fourni avec Enterprise Support ou Unified Operations ; ce n'est pas une intégration pour un système de tickets."
references:
  - title: AWS Support plan comparison – AWS Support features – AWS
    url: https://aws.amazon.com/premiumsupport/plans/
