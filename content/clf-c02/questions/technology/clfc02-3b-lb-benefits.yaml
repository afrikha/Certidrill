id: clfc02-3b-lb-benefits
objective: "3.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company plans to place Elastic Load Balancing in front of its web servers.

    Which capabilities does Elastic Load Balancing provide? (Choose two.)
  fr: |
    Une entreprise prévoit de placer Elastic Load Balancing devant ses serveurs web.

    Quelles fonctionnalités Elastic Load Balancing fournit-il ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "It caches static content at edge locations close to users.", fr: "Il met en cache le contenu statique dans des emplacements périphériques proches des utilisateurs." } }
    - { id: b, text: { en: "It sends requests only to targets that pass health checks.", fr: "Il n'envoie les requêtes qu'aux cibles qui réussissent les vérifications de l'état." } }
    - { id: c, text: { en: "It launches new EC2 instances when CPU utilization is high.", fr: "Il lance de nouvelles instances EC2 quand l'utilisation du processeur est élevée." } }
    - { id: d, text: { en: "It translates domain names into IP addresses for clients.", fr: "Il traduit les noms de domaine en adresses IP pour les clients." } }
    - { id: e, text: { en: "It scales its own capacity as incoming traffic changes.", fr: "Il adapte sa propre capacité à l'évolution du trafic entrant." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Elastic Load Balancing monitors the health of its registered targets and routes traffic only to the healthy ones. The load balancer also scales automatically as incoming traffic changes over time, so the company does not size it."
    fr: "Elastic Load Balancing surveille l'état de ses cibles enregistrées et n'achemine le trafic que vers les cibles saines. L'équilibreur de charge se met aussi à l'échelle automatiquement à mesure que le trafic entrant évolue : l'entreprise n'a pas à le dimensionner."
  options:
    a:
      en: "Caching content at edge locations is what Amazon CloudFront does, not Elastic Load Balancing."
      fr: "La mise en cache du contenu dans des emplacements périphériques est le rôle d'Amazon CloudFront, pas d'Elastic Load Balancing."
    c:
      en: "Launching instances based on CPU utilization is done by Amazon EC2 Auto Scaling; the load balancer only distributes traffic to the targets."
      fr: "Le lancement d'instances selon l'utilisation du processeur est assuré par Amazon EC2 Auto Scaling ; l'équilibreur de charge se contente de répartir le trafic entre les cibles."
    d:
      en: "Translating domain names into IP addresses is the role of a DNS service such as Amazon Route 53."
      fr: "La traduction des noms de domaine en adresses IP est le rôle d'un service DNS comme Amazon Route 53."
references:
  - title: What is Elastic Load Balancing?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/what-is-load-balancing.html
