id: clfc02-3b-serverless-lambda-benefits
objective: "3.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is moving code that processes incoming events from Amazon EC2 instances to AWS Lambda Event Functions.

    Which benefits will the company gain from this change? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise migre du code qui traite des événements entrants depuis des instances Amazon EC2 vers AWS Lambda (Event Functions).

    Quels avantages l'entreprise obtiendra-t-elle grâce à ce changement ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Full administrator access to the operating system that runs the code", fr: "Un accès administrateur complet au système d'exploitation qui exécute le code" } }
    - { id: b, text: { en: "No servers to provision, patch, or manage", fr: "Aucun serveur à provisionner, corriger ou gérer" } }
    - { id: c, text: { en: "A fixed hourly charge for each function, whether or not it is invoked", fr: "Un tarif horaire fixe pour chaque fonction, qu'elle soit invoquée ou non" } }
    - { id: d, text: { en: "Automatic scaling with the number of incoming requests", fr: "Une mise à l'échelle automatique selon le nombre de requêtes entrantes" } }
    - { id: e, text: { en: "Unlimited run time for each invocation", fr: "Une durée d'exécution illimitée pour chaque invocation" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "With Lambda, the company runs code without provisioning or managing servers: Lambda manages the underlying infrastructure, including server maintenance, capacity provisioning, scaling, and patching. Lambda scales automatically as requests arrive, and Event Functions are billed per request and for execution time."
    fr: "Avec Lambda, l'entreprise exécute du code sans provisionner ni gérer de serveurs : Lambda gère l'infrastructure sous-jacente, y compris la maintenance des serveurs, le provisionnement de la capacité, la mise à l'échelle et les correctifs. Lambda se met à l'échelle automatiquement à l'arrivée des requêtes, et les Event Functions sont facturées par requête et selon le temps d'exécution."
  options:
    a:
      en: "Lambda manages and patches the underlying servers; the customer does not get administrator access to their operating system."
      fr: "Lambda gère les serveurs sous-jacents et leur applique les correctifs ; le client n'obtient pas d'accès administrateur à leur système d'exploitation."
    c:
      en: "Lambda Event Functions are billed per request and for execution time, not with a fixed hourly fee per function."
      fr: "Les Event Functions Lambda sont facturées par requête et selon le temps d'exécution, pas avec un tarif horaire fixe par fonction."
    e:
      en: "Lambda invocations always have a maximum duration; a function invocation times out after at most 15 minutes."
      fr: "Les invocations Lambda ont toujours une durée maximale ; l'invocation d'une fonction expire au bout de 15 minutes au maximum."
references:
  - title: What is AWS Lambda?
    url: https://docs.aws.amazon.com/lambda/latest/dg/welcome.html
  - title: Lambda quotas
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
