id: clfc02-3d-aws-cli-scripts
objective: "3.8.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A system administrator wants to manage AWS services by typing commands in a terminal on a laptop, and to automate routine tasks with shell scripts.

    Which AWS tool should the administrator use?
  fr: |
    Un administrateur système veut gérer des services AWS en tapant des commandes dans un terminal sur un ordinateur portable, et automatiser des tâches courantes avec des scripts shell.

    Quel outil AWS l'administrateur doit-il utiliser ?
body:
  options:
    - { id: a, text: "AWS Management Console" }
    - { id: b, text: "AWS CodePipeline" }
    - { id: c, text: "AWS Command Line Interface (AWS CLI)" }
    - { id: d, text: "AWS X-Ray" }
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS CLI is an open-source tool for interacting with AWS services through commands in a command-line shell. Its commands can be combined in scripts to automate tasks, with functionality equivalent to the browser-based console."
    fr: "L'AWS CLI est un outil open source qui permet d'interagir avec les services AWS au moyen de commandes dans un shell en ligne de commande. Ses commandes peuvent être combinées dans des scripts pour automatiser des tâches, avec des fonctionnalités équivalentes à celles de la console basée sur un navigateur."
  options:
    a:
      en: "The AWS Management Console is a web interface used through a browser; it is not driven by commands in a shell script."
      fr: "L'AWS Management Console est une interface web utilisée dans un navigateur ; elle n'est pas pilotée par des commandes dans un script shell."
    b:
      en: "AWS CodePipeline automates software release stages; it is not a command-line tool for managing AWS services."
      fr: "AWS CodePipeline automatise les étapes de publication d'un logiciel ; ce n'est pas un outil en ligne de commande pour gérer des services AWS."
    d:
      en: "AWS X-Ray traces requests in applications; it is not used to manage AWS services from a terminal."
      fr: "AWS X-Ray trace les requêtes dans les applications ; il ne sert pas à gérer des services AWS depuis un terminal."
references:
  - title: What is the AWS Command Line Interface?
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-welcome.html
