id: clfc02-3c-nacl-deny-range
objective: "3.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team detects malicious requests from a specific public IP address range. It must block all traffic from that range to every instance in a subnet, including instances launched later with the wrong security group.

    Which solution will meet these requirements?
  fr: |
    Une équipe de sécurité détecte des requêtes malveillantes provenant d'une plage d'adresses IP publiques précise. Elle doit bloquer tout le trafic provenant de cette plage vers chaque instance d'un sous-réseau, y compris les instances lancées plus tard avec un mauvais groupe de sécurité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a deny rule for the range to the instances' security group.", fr: "Ajouter une règle de refus pour la plage dans le groupe de sécurité des instances." }
    - id: b
      text: { en: "Remove the internet gateway route from the subnet's route table.", fr: "Supprimer l'itinéraire vers la passerelle Internet de la table de routage du sous-réseau." }
    - id: c
      text: { en: "Add a deny rule for the range to the subnet's network ACL.", fr: "Ajouter une règle de refus pour la plage dans l'ACL réseau du sous-réseau." }
    - id: d
      text: { en: "Activate Amazon Inspector scanning for the instances.", fr: "Activer l'analyse Amazon Inspector pour les instances." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A network ACL applies to every instance in the associated subnets and supports explicit deny rules, so it can block one address range. Because it applies at the subnet level, it protects instances even when one is launched without the correct security group.
    fr: |-
      Une ACL réseau s'applique à toutes les instances des sous-réseaux associés et prend en charge des règles de refus explicites : elle peut donc bloquer une plage d'adresses. Comme elle s'applique au niveau du sous-réseau, elle protège les instances même si l'une d'elles est lancée sans le bon groupe de sécurité.
  options:
    a:
      en: |-
        Security groups support allow rules only, and an instance launched with another security group would not be covered.
      fr: |-
        Les groupes de sécurité ne prennent en charge que des règles d'autorisation, et une instance lancée avec un autre groupe de sécurité ne serait pas couverte.
    b:
      en: |-
        Removing the route cuts all internet traffic to the subnet, not only the malicious range.
      fr: |-
        Supprimer l'itinéraire coupe tout le trafic Internet vers le sous-réseau, et pas seulement la plage malveillante.
    d:
      en: |-
        Amazon Inspector reports vulnerabilities and network exposure; it does not block traffic.
      fr: |-
        Amazon Inspector signale des vulnérabilités et une exposition réseau ; il ne bloque pas le trafic.
references:
  - title: "Infrastructure security in Amazon VPC - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/infrastructure-security.html
