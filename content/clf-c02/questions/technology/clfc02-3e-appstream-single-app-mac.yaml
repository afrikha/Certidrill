id: clfc02-3e-appstream-single-app-mac
objective: "3.8.12"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Engineers at a company use macOS laptops and need one Windows-only engineering application. The application must run on AWS, and the engineers must get access to that application only, not to a full Windows desktop.

    Which AWS service will meet these requirements?
  fr: |
    Les ingénieurs d'une entreprise utilisent des ordinateurs portables macOS et ont besoin d'une application d'ingénierie qui ne fonctionne que sous Windows. L'application doit s'exécuter sur AWS, et les ingénieurs doivent avoir accès uniquement à cette application, pas à un bureau Windows complet.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon WorkSpaces Personal", fr: "Amazon WorkSpaces Personal" } }
    - { id: b, text: { en: "Amazon WorkSpaces Secure Browser", fr: "Amazon WorkSpaces Secure Browser" } }
    - { id: c, text: { en: "AWS Amplify Hosting", fr: "AWS Amplify Hosting" } }
    - { id: d, text: { en: "Amazon AppStream 2.0", fr: "Amazon AppStream 2.0" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon AppStream 2.0, now documented as Amazon WorkSpaces Applications, streams individual desktop applications that run on AWS. Users open the application from an HTML5 browser or the client, so the Windows application is available from macOS laptops without giving them a full desktop."
    fr: "Amazon AppStream 2.0, désormais documenté sous le nom Amazon WorkSpaces Applications, diffuse en streaming des applications de bureau individuelles qui s'exécutent sur AWS. Les utilisateurs ouvrent l'application depuis un navigateur HTML5 ou le client : l'application Windows est donc disponible depuis des ordinateurs portables macOS sans leur fournir de bureau complet."
  options:
    a:
      en: "WorkSpaces Personal would run the application, but it gives each engineer a full persistent desktop, which the requirement excludes."
      fr: "WorkSpaces Personal exécuterait l'application, mais il fournit à chaque ingénieur un bureau persistant complet, ce que l'exigence exclut."
    b:
      en: "WorkSpaces Secure Browser gives access to websites and web applications only; it cannot run a Windows desktop application."
      fr: "WorkSpaces Secure Browser donne accès uniquement à des sites et applications web ; il ne peut pas exécuter une application de bureau Windows."
    c:
      en: "Amplify Hosting deploys and hosts web applications from a Git repository; it does not run Windows desktop applications."
      fr: "Amplify Hosting déploie et héberge des applications web à partir d'un dépôt Git ; il n'exécute pas d'applications de bureau Windows."
references:
  - title: What Is Amazon WorkSpaces Applications?
    url: https://docs.aws.amazon.com/appstream2/latest/developerguide/what-is-appstream.html
