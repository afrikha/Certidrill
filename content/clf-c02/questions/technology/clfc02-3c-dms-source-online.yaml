id: clfc02-3c-dms-source-online
objective: "3.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to migrate an on-premises MySQL database to Amazon RDS for MySQL. The source database must stay fully operational during the migration to minimize application downtime.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise souhaite migrer une base de données MySQL sur site vers Amazon RDS for MySQL. La base de données source doit rester pleinement opérationnelle pendant la migration afin de réduire au minimum l'indisponibilité de l'application.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Application Migration Service", fr: "AWS Application Migration Service" }
    - id: b
      text: { en: "AWS Backup", fr: "AWS Backup" }
    - id: c
      text: { en: "AWS Database Migration Service (AWS DMS)", fr: "AWS Database Migration Service (AWS DMS)" }
    - id: d
      text: { en: "Amazon ElastiCache", fr: "Amazon ElastiCache" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS DMS migrates databases to AWS while the source database remains fully operational, which limits downtime for the applications that use it. It supports one-time migrations and ongoing replication between the source and the target.
    fr: |-
      AWS DMS migre des bases de données vers AWS pendant que la base de données source reste pleinement opérationnelle, ce qui limite l'indisponibilité des applications qui l'utilisent. Il prend en charge les migrations ponctuelles et la réplication continue entre la source et la cible.
  options:
    a:
      en: |-
        Application Migration Service replicates whole servers to EC2 (lift and shift); it does not move a database into Amazon RDS.
      fr: |-
        Application Migration Service réplique des serveurs entiers vers EC2 (lift and shift) ; il ne déplace pas une base de données vers Amazon RDS.
    b:
      en: |-
        AWS Backup centralizes backups of AWS resources; it is not a database migration tool.
      fr: |-
        AWS Backup centralise les sauvegardes de ressources AWS ; ce n'est pas un outil de migration de bases de données.
    d:
      en: |-
        ElastiCache is an in-memory cache, not a migration service.
      fr: |-
        ElastiCache est un cache en mémoire, et non un service de migration.
references:
  - title: "AWS Database Migration Service FAQs"
    url: https://aws.amazon.com/dms/faqs/
  - title: "What is AWS Database Migration Service? - AWS Database Migration Service"
    url: https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html
