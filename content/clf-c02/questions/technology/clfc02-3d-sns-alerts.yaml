id: clfc02-3d-sns-alerts
objective: "3.8.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants its application to publish one message when a payment fails, and to have that message delivered at the same time to the on-call engineers by email and by SMS text message.

    Which AWS service meets these requirements?
  fr: |
    Une entreprise veut que son application publie un seul message en cas d'échec d'un paiement, et que ce message soit livré en même temps aux ingénieurs d'astreinte par e-mail et par SMS.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Simple Notification Service (Amazon SNS)" }
    - { id: b, text: "Amazon Simple Queue Service (Amazon SQS)" }
    - { id: c, text: "Amazon Simple Email Service (Amazon SES)" }
    - { id: d, text: "Amazon Connect" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon SNS is a publish/subscribe service: a publisher sends a message to a topic, and SNS delivers it to all the topic's subscribers. Subscribers can be email addresses and phone numbers for SMS, as well as applications such as SQS queues and Lambda functions."
    fr: "Amazon SNS est un service de publication/abonnement : un éditeur envoie un message à une rubrique (topic), et SNS le livre à tous les abonnés de la rubrique. Les abonnés peuvent être des adresses e-mail et des numéros de téléphone pour les SMS, ainsi que des applications comme des files SQS et des fonctions Lambda."
  options:
    b:
      en: "Amazon SQS stores messages until consumers poll them; it does not deliver messages to people by email or SMS."
      fr: "Amazon SQS stocke les messages jusqu'à ce que des consommateurs les interrogent ; il ne livre pas de messages à des personnes par e-mail ou par SMS."
    c:
      en: "Amazon SES sends email, but it does not deliver the same published message to SMS recipients."
      fr: "Amazon SES envoie des e-mails, mais il ne livre pas le même message publié à des destinataires SMS."
    d:
      en: "Amazon Connect is a cloud contact center for customer calls and chats, not a service for fanning out application alerts."
      fr: "Amazon Connect est un centre de contact cloud pour les appels et les discussions avec les clients, pas un service de diffusion d'alertes applicatives."
references:
  - title: What is Amazon SNS?
    url: https://docs.aws.amazon.com/sns/latest/dg/welcome.html
