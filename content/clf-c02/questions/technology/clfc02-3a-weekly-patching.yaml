id: clfc02-3a-weekly-patching
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must install operating system security updates on its fleet of Amazon EC2 instances every week, during the same time window and in the same way each time.

    Which solution will meet these requirements with the LEAST operational effort?
  fr: |
    Une entreprise doit installer les mises à jour de sécurité du système d'exploitation sur son parc d'instances Amazon EC2 chaque semaine, pendant la même plage horaire et de la même façon à chaque fois.

    Quelle solution répond à ces exigences avec le MOINS d'effort d'exploitation ?
body:
  options:
    - { id: a, text: { en: "Use AWS Systems Manager Patch Manager to scan and patch the instances on a defined schedule.", fr: "Utiliser AWS Systems Manager Patch Manager pour analyser les instances et leur appliquer les correctifs selon un calendrier défini." } }
    - { id: b, text: { en: "Ask an administrator to connect to each instance every week and install the updates manually.", fr: "Demander à un administrateur de se connecter à chaque instance chaque semaine et d'installer les mises à jour manuellement." } }
    - { id: c, text: { en: "Use Amazon Inspector to find missing updates and install them on the instances.", fr: "Utiliser Amazon Inspector pour trouver les mises à jour manquantes et les installer sur les instances." } }
    - { id: d, text: { en: "Use AWS Trusted Advisor to install the updates each week.", fr: "Utiliser AWS Trusted Advisor pour installer les mises à jour chaque semaine." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A task that recurs every week in the same way calls for a repeatable, automated process. Patch Manager automates scanning and installing patches on managed nodes, and a patch policy or a maintenance window runs the patching on a defined schedule without manual steps.
    fr: |
      Une tâche qui revient chaque semaine de la même façon appelle un processus reproductible et automatisé. Patch Manager automatise l'analyse et l'installation des correctifs sur les nœuds gérés, et une politique de correctifs (patch policy) ou une fenêtre de maintenance exécute l'application des correctifs selon un calendrier défini, sans étape manuelle.
  options:
    b: { en: "Manual work on each instance every week is a one-time operation repeated by hand, which is error-prone and costly in effort.", fr: "Le travail manuel sur chaque instance chaque semaine est une opération ponctuelle répétée à la main, sujette aux erreurs et coûteuse en effort." }
    c: { en: "Amazon Inspector finds software vulnerabilities; it does not install the updates.", fr: "Amazon Inspector détecte les vulnérabilités logicielles ; il n'installe pas les mises à jour." }
    d: { en: "Trusted Advisor gives best-practice recommendations; it does not patch instances.", fr: "Trusted Advisor donne des recommandations de bonnes pratiques ; il n'applique pas de correctifs aux instances." }
references:
  - title: AWS Systems Manager Patch Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager.html
