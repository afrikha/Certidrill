id: clfc02-3e-workspaces-daas
objective: "3.8.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to give each employee a persistent Windows desktop that runs in the AWS Cloud. Employees must reach their desktop from different devices, and the company does not want to buy or maintain desktop hardware.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise souhaite fournir à chaque employé un bureau Windows persistant qui s'exécute dans le Cloud AWS. Les employés doivent accéder à leur bureau depuis différents appareils, et l'entreprise ne veut ni acheter ni entretenir de matériel de poste de travail.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon AppStream 2.0", fr: "Amazon AppStream 2.0" } }
    - { id: b, text: { en: "Amazon WorkSpaces", fr: "Amazon WorkSpaces" } }
    - { id: c, text: { en: "Amazon WorkSpaces Secure Browser", fr: "Amazon WorkSpaces Secure Browser" } }
    - { id: d, text: { en: "Amazon Lightsail", fr: "Amazon Lightsail" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon WorkSpaces provisions virtual desktops that run in the AWS Cloud, so there is no desktop hardware to procure or maintain. WorkSpaces Personal gives each user a persistent desktop, similar to a physical computer assigned to that user, that is reachable from several devices or a web browser."
    fr: "Amazon WorkSpaces provisionne des bureaux virtuels qui s'exécutent dans le Cloud AWS : il n'y a aucun matériel de poste de travail à acheter ni à entretenir. WorkSpaces Personal donne à chaque utilisateur un bureau persistant, comparable à un ordinateur physique qui lui est attribué, accessible depuis plusieurs appareils ou un navigateur web."
  options:
    a:
      en: "AppStream 2.0 (now documented as Amazon WorkSpaces Applications) streams individual applications, not a persistent personal desktop."
      fr: "AppStream 2.0 (désormais documenté sous le nom Amazon WorkSpaces Applications) diffuse des applications en streaming, pas un bureau personnel persistant."
    c:
      en: "WorkSpaces Secure Browser gives access to websites and web applications through a browser that runs on AWS, not to a full Windows desktop."
      fr: "WorkSpaces Secure Browser donne accès à des sites et applications web au moyen d'un navigateur qui s'exécute sur AWS, pas à un bureau Windows complet."
    d:
      en: "Lightsail provides virtual private servers for simple workloads; it is not a managed virtual desktop service for employees."
      fr: "Lightsail fournit des serveurs privés virtuels pour des charges de travail simples ; ce n'est pas un service géré de bureaux virtuels pour les employés."
references:
  - title: What is Amazon WorkSpaces?
    url: https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces.html
