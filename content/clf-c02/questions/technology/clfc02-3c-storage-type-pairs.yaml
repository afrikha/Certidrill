id: clfc02-3c-storage-type-pairs
objective: "3.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cloud practitioner is classifying AWS storage services by the type of storage that they provide.

    Which pairing of service and storage type is correct?
  fr: |
    Un praticien du cloud classe les services de stockage AWS selon le type de stockage qu'ils fournissent.

    Quelle association entre service et type de stockage est correcte ?
body:
  options:
    - id: a
      text: { en: "Amazon S3 – block storage", fr: "Amazon S3 – stockage en bloc" }
    - id: b
      text: { en: "Amazon EBS – object storage", fr: "Amazon EBS – stockage d'objets" }
    - id: c
      text: { en: "Amazon EFS – file storage", fr: "Amazon EFS – stockage de fichiers" }
    - id: d
      text: { en: "EC2 instance store – file storage", fr: "Stockage d'instance EC2 – stockage de fichiers" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon EFS provides serverless, elastic file storage that clients mount over the NFS protocol. Amazon S3 is object storage, while Amazon EBS and EC2 instance store provide block storage to EC2 instances.
    fr: |-
      Amazon EFS fournit un stockage de fichiers sans serveur et élastique que les clients montent via le protocole NFS. Amazon S3 est un stockage d'objets, tandis qu'Amazon EBS et le stockage d'instance EC2 fournissent un stockage en bloc aux instances EC2.
  options:
    a:
      en: |-
        Amazon S3 is an object storage service: data is stored as objects in buckets, not as block volumes.
      fr: |-
        Amazon S3 est un service de stockage d'objets : les données sont stockées sous forme d'objets dans des compartiments, et non sous forme de volumes en bloc.
    b:
      en: |-
        Amazon EBS provides block storage volumes that an EC2 instance uses like a local hard drive.
      fr: |-
        Amazon EBS fournit des volumes de stockage en bloc qu'une instance EC2 utilise comme un disque dur local.
    d:
      en: |-
        Instance store is temporary block-level storage on disks attached to the host.
      fr: |-
        Le stockage d'instance est un stockage temporaire au niveau bloc, sur des disques attachés à l'hôte.
references:
  - title: "What is Amazon Elastic File System? - Amazon Elastic File System"
    url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
  - title: "What is Amazon Elastic Block Store? - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/what-is-ebs.html
