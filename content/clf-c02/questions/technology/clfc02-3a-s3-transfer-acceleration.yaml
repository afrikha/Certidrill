id: clfc02-3a-s3-transfer-acceleration
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company collects large files from customers on several continents into one Amazon S3 bucket in a single AWS Region. Uploads from distant customers are slow. The company wants faster long-distance uploads and wants to keep the existing bucket.

    Which solution will meet these requirements?
  fr: |
    Une entreprise collecte des fichiers volumineux envoyés par des clients de plusieurs continents dans un seul compartiment Amazon S3 d'une Région AWS. Les chargements des clients éloignés sont lents. L'entreprise veut des chargements longue distance plus rapides et veut conserver le compartiment existant.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure S3 Cross-Region Replication to a bucket in another Region.", fr: "Configurer la réplication entre Régions S3 vers un compartiment d'une autre Région." } }
    - { id: b, text: { en: "Change the storage class of the objects to S3 Standard-IA.", fr: "Passer la classe de stockage des objets à S3 Standard-IA." } }
    - { id: c, text: { en: "Enable S3 Transfer Acceleration on the bucket.", fr: "Activer S3 Transfer Acceleration sur le compartiment." } }
    - { id: d, text: { en: "Enable S3 Versioning on the bucket.", fr: "Activer la gestion des versions S3 sur le compartiment." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      S3 Transfer Acceleration routes the data that arrives at the nearest CloudFront edge location to the bucket over an optimized AWS network path. It is designed for uploads from around the world to a centralized bucket, and it is enabled on the existing bucket.
    fr: |
      S3 Transfer Acceleration achemine les données qui arrivent à l'emplacement périphérique CloudFront le plus proche jusqu'au compartiment par un chemin réseau AWS optimisé. Il est conçu pour des chargements du monde entier vers un compartiment centralisé, et il s'active sur le compartiment existant.
  options:
    a: { en: "Replication copies objects after they arrive in the bucket; it does not speed up the customers' uploads.", fr: "La réplication copie les objets après leur arrivée dans le compartiment ; elle n'accélère pas les chargements des clients." }
    b: { en: "A storage class changes storage price and access charges, not upload speed over long distances.", fr: "Une classe de stockage change le prix du stockage et les frais d'accès, pas la vitesse des chargements longue distance." }
    d: { en: "Versioning keeps previous versions of objects; it has no effect on transfer speed.", fr: "La gestion des versions conserve les versions précédentes des objets ; elle n'a aucun effet sur la vitesse de transfert." }
references:
  - title: Configuring fast, secure file transfers using Amazon S3 Transfer Acceleration
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html
