id: clfc02-3b-dbmig-dms-serverless
objective: "3.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company will use AWS Database Migration Service (AWS DMS) to migrate several databases to AWS. The migration team does not want to choose, size, or manage replication instances, and the replication capacity must adjust automatically to the workload.

    Which option will meet these requirements?
  fr: |
    Une entreprise va utiliser AWS Database Migration Service (AWS DMS) pour migrer plusieurs bases de données vers AWS. L'équipe de migration ne veut pas choisir, dimensionner ni gérer d'instances de réplication, et la capacité de réplication doit s'ajuster automatiquement à la charge de travail.

    Quelle option répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "AWS DMS with a replication instance sized for the largest database", fr: "AWS DMS avec une instance de réplication dimensionnée pour la plus grande base de données" } }
    - { id: b, text: "AWS DMS Serverless" }
    - { id: c, text: "DMS Schema Conversion" }
    - { id: d, text: "AWS Application Migration Service" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS DMS Serverless automatically provisions, monitors, and scales the resources of a migration, so the team does not choose or manage replication instances. It analyzes the replication workload, computes the capacity required, and bills only for the resources used."
    fr: "AWS DMS Serverless provisionne, surveille et met à l'échelle automatiquement les ressources d'une migration : l'équipe n'a pas à choisir ni à gérer d'instances de réplication. Il analyse la charge de réplication, calcule la capacité nécessaire et ne facture que les ressources utilisées."
  options:
    a:
      en: "A provisioned replication instance must be chosen and sized by the team, and its capacity does not adjust automatically."
      fr: "Une instance de réplication provisionnée doit être choisie et dimensionnée par l'équipe, et sa capacité ne s'ajuste pas automatiquement."
    c:
      en: "DMS Schema Conversion converts schemas and code between database engines; it does not provide replication capacity for moving the data."
      fr: "DMS Schema Conversion convertit les schémas et le code entre moteurs de base de données ; il ne fournit pas de capacité de réplication pour déplacer les données."
    d:
      en: "Application Migration Service rehosts servers on Amazon EC2; it is not a capacity option of AWS DMS for database replication."
      fr: "Application Migration Service réhéberge des serveurs sur Amazon EC2 ; ce n'est pas une option de capacité d'AWS DMS pour la réplication de bases de données."
references:
  - title: Working with AWS DMS Serverless
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Serverless.html
  - title: AWS Database Migration Service FAQs
    url: https://aws.amazon.com/dms/faqs/
