id: clfc02-3c-cloudfront-edge-cache
objective: "3.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company stores images and videos in an Amazon S3 bucket in one AWS Region. Viewers around the world must receive the content with lower latency by having copies cached in edge locations close to them.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise de médias stocke des images et des vidéos dans un compartiment Amazon S3 d'une seule Région AWS. Les utilisateurs du monde entier doivent recevoir le contenu avec une latence réduite grâce à des copies mises en cache dans des emplacements périphériques proches d'eux.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Amazon Route 53", fr: "Amazon Route 53" }
    - id: b
      text: { en: "AWS Direct Connect", fr: "AWS Direct Connect" }
    - id: c
      text: { en: "AWS Transit Gateway", fr: "AWS Transit Gateway" }
    - id: d
      text: { en: "Amazon CloudFront", fr: "Amazon CloudFront" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Amazon CloudFront delivers static and dynamic web content through a worldwide network of edge locations. A request goes to the edge location with the lowest latency; if the object is cached there, CloudFront returns it immediately, otherwise it fetches it from the origin, such as the S3 bucket.
    fr: |-
      Amazon CloudFront distribue du contenu web statique et dynamique via un réseau mondial d'emplacements périphériques. Une requête est dirigée vers l'emplacement périphérique ayant la latence la plus faible ; si l'objet y est en cache, CloudFront le renvoie immédiatement, sinon il le récupère auprès de l'origine, comme le compartiment S3.
  options:
    a:
      en: |-
        Route 53 answers DNS queries and routes users to endpoints; it does not cache content.
      fr: |-
        Route 53 répond aux requêtes DNS et dirige les utilisateurs vers des points de terminaison ; il ne met pas de contenu en cache.
    b:
      en: |-
        Direct Connect is a dedicated network link between a data center and AWS, not a service for public viewers.
      fr: |-
        Direct Connect est une liaison réseau dédiée entre un centre de données et AWS, et non un service pour des utilisateurs publics.
    c:
      en: |-
        Transit Gateway interconnects VPCs and on-premises networks; it does not deliver content to internet users.
      fr: |-
        Transit Gateway interconnecte des VPC et des réseaux sur site ; il ne distribue pas de contenu aux internautes.
references:
  - title: "What is Amazon CloudFront? - Amazon CloudFront"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
