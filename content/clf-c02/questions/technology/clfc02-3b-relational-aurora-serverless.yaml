id: clfc02-3b-relational-aurora-serverless
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is building a new application with a PostgreSQL-compatible relational database. Usage is unpredictable: the database is idle for hours, then has sudden spikes. The company does not want to choose or resize database instance classes as demand changes.

    Which solution will meet these requirements?
  fr: |
    Une entreprise développe une nouvelle application avec une base de données relationnelle compatible avec PostgreSQL. L'utilisation est imprévisible : la base reste inactive pendant des heures, puis connaît des pics soudains. L'entreprise ne veut pas choisir ni redimensionner de classes d'instance de base de données selon l'évolution de la demande.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon Aurora PostgreSQL with Aurora serverless", fr: "Amazon Aurora PostgreSQL avec Aurora serverless" } }
    - { id: b, text: { en: "Amazon RDS for PostgreSQL on the largest available DB instance class", fr: "Amazon RDS for PostgreSQL sur la plus grande classe d'instance de base de données disponible" } }
    - { id: c, text: { en: "PostgreSQL installed on Amazon EC2 instances in an Auto Scaling group", fr: "PostgreSQL installé sur des instances Amazon EC2 dans un groupe Auto Scaling" } }
    - { id: d, text: { en: "Amazon DynamoDB in on-demand capacity mode", fr: "Amazon DynamoDB en mode de capacité à la demande" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Aurora serverless is an on-demand, autoscaling configuration of Amazon Aurora. It adds and removes capacity in Aurora capacity units (ACUs) as the workload changes, so the company does not pick or resize instance classes, and capacity scales down when the database is not in use."
    fr: "Aurora serverless est une configuration à la demande et à mise à l'échelle automatique d'Amazon Aurora. Elle ajoute et retire de la capacité en unités de capacité Aurora (ACU) selon l'évolution de la charge de travail : l'entreprise ne choisit ni ne redimensionne de classes d'instance, et la capacité diminue quand la base n'est pas utilisée."
  options:
    b:
      en: "The largest instance class handles spikes, but the company chooses it and pays for that capacity even while the database is idle."
      fr: "La plus grande classe d'instance absorbe les pics, mais l'entreprise la choisit et paie cette capacité même quand la base est inactive."
    c:
      en: "Adding EC2 instances does not scale a single PostgreSQL database, and the company would manage the database software itself."
      fr: "Ajouter des instances EC2 ne met pas à l'échelle une base PostgreSQL unique, et l'entreprise gérerait elle-même le logiciel de base de données."
    d:
      en: "DynamoDB scales on demand, but it is a NoSQL database, not a PostgreSQL-compatible relational database."
      fr: "DynamoDB se met à l'échelle à la demande, mais c'est une base NoSQL, pas une base relationnelle compatible avec PostgreSQL."
references:
  - title: Using Aurora serverless
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html
