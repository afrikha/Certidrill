id: clfc02-3b-db-managed-services
objective: "3.4.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which AWS services are fully managed database services? (Choose two.)
  fr: |
    Quels services AWS sont des services de base de données entièrement gérés ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "Amazon Elastic File System (Amazon EFS)" }
    - { id: b, text: "Amazon DynamoDB" }
    - { id: c, text: "Amazon Athena" }
    - { id: d, text: "Amazon Aurora" }
    - { id: e, text: "Amazon Kinesis Data Streams" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Amazon DynamoDB is a serverless, fully managed NoSQL key-value and document database. Amazon Aurora is a fully managed relational database engine compatible with MySQL and PostgreSQL. In both cases, AWS handles tasks such as hardware provisioning, patching, and backups."
    fr: "Amazon DynamoDB est une base de données NoSQL clé-valeur et document sans serveur et entièrement gérée. Amazon Aurora est un moteur de base de données relationnelle entièrement géré compatible avec MySQL et PostgreSQL. Dans les deux cas, AWS se charge de tâches comme le provisionnement du matériel, l'application des correctifs et les sauvegardes."
  options:
    a:
      en: "Amazon EFS is a managed file system for shared file storage, not a database service."
      fr: "Amazon EFS est un système de fichiers géré pour le stockage de fichiers partagé, pas un service de base de données."
    c:
      en: "Athena is a serverless query service that runs SQL on data stored in Amazon S3; it does not store data as a database."
      fr: "Athena est un service de requête sans serveur qui exécute du SQL sur des données stockées dans Amazon S3 ; il ne stocke pas de données comme une base de données."
    e:
      en: "Kinesis Data Streams collects and processes streaming data in real time; it is an analytics service, not a database."
      fr: "Kinesis Data Streams collecte et traite des données en streaming en temps réel ; c'est un service d'analytique, pas une base de données."
references:
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
  - title: What is Amazon Aurora?
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html
