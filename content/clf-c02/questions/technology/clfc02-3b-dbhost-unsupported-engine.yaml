id: clfc02-3b-dbhost-unsupported-engine
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a commercial relational database engine that no AWS managed database service supports. The vendor also requires the company to install its own monitoring agent on the operating system of the database server.

    Where should the company run this database on AWS?
  fr: |
    Une entreprise utilise un moteur de base de données relationnelle commercial qu'aucun service de base de données géré par AWS ne prend en charge. L'éditeur exige aussi que l'entreprise installe son propre agent de surveillance sur le système d'exploitation du serveur de base de données.

    Où l'entreprise doit-elle exécuter cette base de données sur AWS ?
body:
  options:
    - { id: a, text: { en: "On Amazon EC2 instances that the company manages", fr: "Sur des instances Amazon EC2 gérées par l'entreprise" } }
    - { id: b, text: { en: "On Amazon RDS with a Multi-AZ deployment", fr: "Sur Amazon RDS avec un déploiement Multi-AZ" } }
    - { id: c, text: { en: "On Amazon Aurora", fr: "Sur Amazon Aurora" } }
    - { id: d, text: { en: "On Amazon DynamoDB", fr: "Sur Amazon DynamoDB" } }
answer: { optionId: a }
explanation:
  correct:
    en: "When a database engine is not offered by an AWS managed service, or when the company needs full control of the operating system, it can install and run the database itself on Amazon EC2. The company then also takes on patching, backups, and high availability of the database."
    fr: "Quand un moteur de base de données n'est proposé par aucun service géré d'AWS, ou quand l'entreprise a besoin d'un contrôle total du système d'exploitation, elle peut installer et exécuter elle-même la base de données sur Amazon EC2. L'entreprise prend alors aussi en charge les correctifs, les sauvegardes et la haute disponibilité de la base."
  options:
    b:
      en: "Amazon RDS runs only the database engines that it supports, so it cannot host this engine."
      fr: "Amazon RDS n'exécute que les moteurs de base de données qu'il prend en charge : il ne peut pas héberger ce moteur."
    c:
      en: "Aurora is a managed engine compatible only with MySQL and PostgreSQL; it cannot run another vendor's engine."
      fr: "Aurora est un moteur géré compatible uniquement avec MySQL et PostgreSQL ; il ne peut pas exécuter le moteur d'un autre éditeur."
    d:
      en: "DynamoDB is a NoSQL database with its own API; it cannot run a commercial relational engine."
      fr: "DynamoDB est une base NoSQL avec sa propre API ; il ne peut pas exécuter un moteur relationnel commercial."
references:
  - title: What is Amazon Relational Database Service (Amazon RDS)?
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html
