id: clfc02-3a-multi-az-storage
objective: "3.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company wants the data of its application to stay available if one Availability Zone fails, without managing replication itself.

    Which storage options store data redundantly across multiple Availability Zones? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise veut que les données de son application restent disponibles si une zone de disponibilité tombe en panne, sans gérer elle-même la réplication.

    Quelles options de stockage conservent les données de façon redondante dans plusieurs zones de disponibilité ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An Amazon EBS volume attached to an EC2 instance", fr: "Un volume Amazon EBS attaché à une instance EC2" } }
    - { id: b, text: { en: "An Amazon EFS Regional file system", fr: "Un système de fichiers régional Amazon EFS" } }
    - { id: c, text: { en: "The instance store of an EC2 instance", fr: "Le stockage d'instance d'une instance EC2" } }
    - { id: d, text: { en: "An Amazon EFS One Zone file system", fr: "Un système de fichiers Amazon EFS One Zone" } }
    - { id: e, text: { en: "An Amazon DynamoDB table", fr: "Une table Amazon DynamoDB" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      An EFS Regional file system stores data redundantly across multiple Availability Zones, so it stays available if one zone fails. By default, DynamoDB automatically replicates table data across three Availability Zones of a Region for high durability and availability.
    fr: |
      Un système de fichiers régional EFS stocke les données de façon redondante dans plusieurs zones de disponibilité : il reste disponible si une zone tombe en panne. Par défaut, DynamoDB réplique automatiquement les données des tables dans trois zones de disponibilité d'une Région pour une durabilité et une disponibilité élevées.
  options:
    a: { en: "EBS volume data is replicated across multiple servers within its own Availability Zone only, so the volume is not protected against the loss of that zone.", fr: "Les données d'un volume EBS sont répliquées sur plusieurs serveurs à l'intérieur de sa seule zone de disponibilité : le volume n'est pas protégé contre la perte de cette zone." }
    c: { en: "Instance store is temporary block storage on the host of the instance; its data is not replicated and does not survive the loss of the host.", fr: "Le stockage d'instance est un stockage en mode bloc temporaire sur l'hôte de l'instance ; ses données ne sont pas répliquées et ne survivent pas à la perte de l'hôte." }
    d: { en: "EFS One Zone file systems store data in a single Availability Zone, which costs less but does not survive the loss of that zone.", fr: "Les systèmes de fichiers EFS One Zone stockent les données dans une seule zone de disponibilité, ce qui coûte moins cher mais ne résiste pas à la perte de cette zone." }
references:
  - title: What is Amazon Elastic File System?
    url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
