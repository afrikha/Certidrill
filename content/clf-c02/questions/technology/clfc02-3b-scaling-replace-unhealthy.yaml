id: clfc02-3b-scaling-replace-unhealthy
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances. The company wants AWS to keep at least four healthy instances running at all times, to replace any instance that fails, and to add instances when the load increases.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise exécute une application web sur des instances Amazon EC2. L'entreprise veut qu'AWS maintienne en permanence au moins quatre instances saines, remplace toute instance défaillante et ajoute des instances quand la charge augmente.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon EC2 Auto Scaling" }
    - { id: b, text: "Elastic Load Balancing" }
    - { id: c, text: "AWS Compute Optimizer" }
    - { id: d, text: "Amazon CloudFront" }
answer: { optionId: a }
explanation:
  correct:
    en: "An Auto Scaling group keeps its number of instances between a minimum and a maximum. It checks the health of its instances and replaces unhealthy ones, and scaling policies add or remove instances as the load changes."
    fr: "Un groupe Auto Scaling maintient son nombre d'instances entre un minimum et un maximum. Il vérifie l'état de ses instances et remplace celles qui ne sont pas saines, et des politiques de mise à l'échelle ajoutent ou retirent des instances selon l'évolution de la charge."
  options:
    b:
      en: "Elastic Load Balancing distributes traffic to healthy instances, but it does not launch new instances or replace failed ones."
      fr: "Elastic Load Balancing répartit le trafic vers les instances saines, mais il ne lance pas de nouvelles instances et ne remplace pas les instances défaillantes."
    c:
      en: "Compute Optimizer recommends instance sizes from utilization data; it does not launch or replace instances."
      fr: "Compute Optimizer recommande des tailles d'instance à partir des données d'utilisation ; il ne lance ni ne remplace d'instances."
    d:
      en: "CloudFront caches content at edge locations; it does not manage the number of EC2 instances."
      fr: "CloudFront met en cache le contenu dans des emplacements périphériques ; il ne gère pas le nombre d'instances EC2."
references:
  - title: What is Amazon EC2 Auto Scaling?
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html
