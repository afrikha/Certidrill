id: clfc02-3d-firehose-delivery
objective: "3.7.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company collects clickstream events from its website. It wants to deliver the streaming data automatically to Amazon S3 and Amazon Redshift in near real time, without writing or managing consumer applications.

    Which AWS service meets these requirements?
  fr: |
    Une entreprise collecte les événements de parcours de navigation (clickstream) de son site web. Elle veut livrer automatiquement les données en streaming dans Amazon S3 et Amazon Redshift en quasi-temps réel, sans écrire ni gérer d'applications consommatrices.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Kinesis Data Streams" }
    - { id: b, text: "Amazon Simple Queue Service (Amazon SQS)" }
    - { id: c, text: "Amazon Data Firehose" }
    - { id: d, text: "Amazon Athena" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Data Firehose is a fully managed service that delivers real-time streaming data to destinations such as Amazon S3, Amazon Redshift, and Amazon OpenSearch Service. You configure the source and destination, and Firehose delivers the data without any application to write or servers to manage."
    fr: "Amazon Data Firehose est un service entièrement géré qui livre des données en streaming en temps réel vers des destinations comme Amazon S3, Amazon Redshift et Amazon OpenSearch Service. Vous configurez la source et la destination, et Firehose livre les données sans application à écrire ni serveur à gérer."
  options:
    a:
      en: "Kinesis Data Streams captures and stores streaming records, but you must build consumer applications to read the records and load them into S3 or Redshift."
      fr: "Kinesis Data Streams capture et stocke des enregistrements en streaming, mais vous devez créer des applications consommatrices pour lire les enregistrements et les charger dans S3 ou Redshift."
    b:
      en: "Amazon SQS queues messages between application components; consumers must poll the queue and write the data to S3 and Redshift themselves."
      fr: "Amazon SQS met en file d'attente des messages entre composants d'application ; les consommateurs doivent interroger la file et écrire eux-mêmes les données dans S3 et Redshift."
    d:
      en: "Amazon Athena runs SQL queries on data that is already in Amazon S3; it does not ingest or deliver streaming data."
      fr: "Amazon Athena exécute des requêtes SQL sur des données déjà présentes dans Amazon S3 ; il n'ingère ni ne livre de données en streaming."
references:
  - title: What is Amazon Data Firehose?
    url: https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html
