id: clfc02-3a-hybrid-definition
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes a hybrid cloud deployment?
  fr: |
    Quelle affirmation décrit un déploiement de cloud hybride ?
body:
  options:
    - { id: a, text: { en: "Infrastructure and applications are connected between cloud-based resources and existing resources that are not in the cloud.", fr: "L'infrastructure et les applications sont reliées entre des ressources dans le cloud et des ressources existantes situées hors du cloud." } }
    - { id: b, text: { en: "All parts of the application run in the cloud, and the company has no data center of its own.", fr: "Toutes les parties de l'application s'exécutent dans le cloud, et l'entreprise ne possède aucun centre de données." } }
    - { id: c, text: { en: "Resources run in the company's own data center by using virtualization and resource management tools.", fr: "Les ressources s'exécutent dans le propre centre de données de l'entreprise au moyen d'outils de virtualisation et de gestion des ressources." } }
    - { id: d, text: { en: "The application runs in two AWS Regions so that it stays available if one Region becomes unavailable.", fr: "L'application s'exécute dans deux Régions AWS afin de rester disponible si une Région devient indisponible." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A hybrid deployment connects infrastructure and applications between cloud resources and existing resources outside the cloud. The most common form extends an organization's on-premises infrastructure into the cloud and connects cloud resources to internal systems.
    fr: |
      Un déploiement hybride relie l'infrastructure et les applications entre des ressources cloud et des ressources existantes hors du cloud. La forme la plus courante étend l'infrastructure sur site d'une organisation dans le cloud et relie les ressources cloud aux systèmes internes.
  options:
    b: { en: "This describes the cloud deployment model, where everything runs in the cloud.", fr: "Cela décrit le modèle de déploiement cloud, où tout s'exécute dans le cloud." }
    c: { en: "This describes the on-premises (private cloud) deployment model.", fr: "Cela décrit le modèle de déploiement sur site (cloud privé)." }
    d: { en: "Running in two Regions is a multi-Region design inside the cloud model; nothing is connected to resources outside the cloud.", fr: "L'exécution dans deux Régions est une conception multirégion au sein du modèle cloud ; rien n'est relié à des ressources hors du cloud." }
references:
  - title: Types of cloud computing
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/types-of-cloud-computing.html
