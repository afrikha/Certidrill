id: clfc02-3b-regions-data-residency
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company sells to customers in two countries. A law in each country requires that the personal data of its residents be stored inside that country. Each country has an AWS Region.

    What should the company do to meet this requirement?
  fr: |
    Une entreprise de distribution vend à des clients dans deux pays. Dans chaque pays, une loi exige que les données personnelles de ses résidents soient stockées dans ce pays. Chaque pays dispose d'une Région AWS.

    Que doit faire l'entreprise pour répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Store all customer data in one Region and spread it across several Availability Zones.", fr: "Stocker toutes les données clients dans une seule Région et les répartir sur plusieurs zones de disponibilité." } }
    - { id: b, text: { en: "Store each country's customer data in the AWS Region located in that country.", fr: "Stocker les données clients de chaque pays dans la Région AWS située dans ce pays." } }
    - { id: c, text: { en: "Store all customer data in one Region and cache it at edge locations in both countries.", fr: "Stocker toutes les données clients dans une seule Région et les mettre en cache dans des emplacements périphériques des deux pays." } }
    - { id: d, text: { en: "Store all customer data in one Region and encrypt it with keys from AWS KMS.", fr: "Stocker toutes les données clients dans une seule Région et les chiffrer avec des clés AWS KMS." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The customer chooses the Region where its data is stored, and AWS does not automatically replicate resources to other Regions. Using the Region located in each country keeps each set of personal data inside its country, which is a common reason to use multiple Regions."
    fr: "Le client choisit la Région où ses données sont stockées, et AWS ne réplique pas automatiquement les ressources vers d'autres Régions. Utiliser la Région située dans chaque pays garde chaque ensemble de données personnelles dans son pays, ce qui est une raison courante d'utiliser plusieurs Régions."
  options:
    a:
      en: "All the Availability Zones of a Region are in the same geographic area, so one Region cannot keep data inside two different countries."
      fr: "Toutes les zones de disponibilité d'une Région se trouvent dans la même zone géographique : une seule Région ne peut pas garder les données dans deux pays différents."
    c:
      en: "The data would still be stored in a single Region, outside one of the two countries; caching at edge locations does not change where the data is stored."
      fr: "Les données resteraient stockées dans une seule Région, hors de l'un des deux pays ; la mise en cache dans des emplacements périphériques ne change pas le lieu de stockage."
    d:
      en: "Encryption protects the data but does not change its location; the data of one country would still be stored in the other country."
      fr: "Le chiffrement protège les données mais ne change pas leur emplacement ; les données d'un pays resteraient stockées dans l'autre pays."
references:
  - title: Regions and Zones
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html
