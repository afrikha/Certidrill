id: clfc02-3a-region-contains-azs
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement correctly describes the relationship between AWS Regions and Availability Zones?
  fr: |
    Quelle affirmation décrit correctement la relation entre les Régions AWS et les zones de disponibilité ?
body:
  options:
    - { id: a, text: { en: "Each Availability Zone contains several Regions.", fr: "Chaque zone de disponibilité contient plusieurs Régions." } }
    - { id: b, text: { en: "Each Region contains multiple, physically separate Availability Zones.", fr: "Chaque Région contient plusieurs zones de disponibilité physiquement séparées." } }
    - { id: c, text: { en: "Each Region is a single data center that hosts one Availability Zone.", fr: "Chaque Région est un centre de données unique qui héberge une zone de disponibilité." } }
    - { id: d, text: { en: "An Availability Zone can belong to two Regions at the same time.", fr: "Une zone de disponibilité peut appartenir à deux Régions à la fois." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Region is a physical location in the world that contains multiple, independent Availability Zones. Each Availability Zone is one or more data centers in separate facilities, so a local event such as a fire or a flood affects only one zone.
    fr: |
      Une Région est un emplacement physique dans le monde qui contient plusieurs zones de disponibilité indépendantes. Chaque zone de disponibilité est constituée d'un ou plusieurs centres de données dans des installations séparées : un événement local comme un incendie ou une inondation n'affecte qu'une seule zone.
  options:
    a: { en: "The relationship is the reverse: Regions contain Availability Zones.", fr: "La relation est inverse : les Régions contiennent les zones de disponibilité." }
    c: { en: "A Region has multiple Availability Zones, and each zone can itself contain several data centers.", fr: "Une Région possède plusieurs zones de disponibilité, et chaque zone peut elle-même contenir plusieurs centres de données." }
    d: { en: "Each Availability Zone belongs to exactly one Region; Regions are isolated from each other.", fr: "Chaque zone de disponibilité appartient à une seule Région ; les Régions sont isolées les unes des autres." }
references:
  - title: AWS Regions and Availability Zones
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html
