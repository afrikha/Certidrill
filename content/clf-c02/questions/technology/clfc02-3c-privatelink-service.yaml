id: clfc02-3c-privatelink-service
objective: "3.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company subscribes to an application that a partner hosts in its own AWS account. Instances in the company's private subnets must reach only that application, without an internet gateway, a NAT device or a VPN connection, and without routing between the two VPCs' networks.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise s'abonne à une application qu'un partenaire héberge dans son propre compte AWS. Les instances des sous-réseaux privés de l'entreprise ne doivent atteindre que cette application, sans passerelle Internet, sans périphérique NAT ni connexion VPN, et sans routage entre les réseaux des deux VPC.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "VPC peering", fr: "Appairage de VPC" }
    - id: b
      text: { en: "AWS Site-to-Site VPN", fr: "AWS Site-to-Site VPN" }
    - id: c
      text: { en: "AWS PrivateLink", fr: "AWS PrivateLink" }
    - id: d
      text: { en: "AWS Direct Connect", fr: "AWS Direct Connect" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS PrivateLink connects a VPC privately to a service hosted in another account through an interface VPC endpoint, as if the service were inside the VPC. Traffic does not need an internet gateway, NAT device, public IP address or VPN, and the consumer reaches only the endpoint service.
    fr: |-
      AWS PrivateLink relie de façon privée un VPC à un service hébergé dans un autre compte via un point de terminaison d'interface de VPC, comme si le service se trouvait dans le VPC. Le trafic n'a besoin ni de passerelle Internet, ni de périphérique NAT, ni d'adresse IP publique, ni de VPN, et le consommateur n'atteint que le service de point de terminaison.
  options:
    a:
      en: |-
        VPC peering routes traffic between the two VPCs' address ranges, which the company wants to avoid.
      fr: |-
        L'appairage de VPC achemine le trafic entre les plages d'adresses des deux VPC, ce que l'entreprise veut éviter.
    b:
      en: |-
        Site-to-Site VPN connects an on-premises network to a VPC, and the requirement excludes VPN connections.
      fr: |-
        Site-to-Site VPN relie un réseau sur site à un VPC, et l'exigence exclut les connexions VPN.
    d:
      en: |-
        Direct Connect is a dedicated link from a data center to AWS; it does not connect two VPCs to a single service.
      fr: |-
        Direct Connect est une liaison dédiée entre un centre de données et AWS ; il ne relie pas deux VPC pour un seul service.
references:
  - title: "What is AWS PrivateLink? - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html
