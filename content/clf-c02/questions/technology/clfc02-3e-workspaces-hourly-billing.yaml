id: clfc02-3e-workspaces-hourly-billing
objective: "3.8.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon WorkSpaces to give full Windows desktops to part-time consultants. The consultants use their desktops only a few hours each month. The company wants to reduce the cost of these desktops.

    What should the company do?
  fr: |
    Une entreprise utilise Amazon WorkSpaces pour fournir des bureaux Windows complets à des consultants à temps partiel. Les consultants n'utilisent leur bureau que quelques heures par mois. L'entreprise veut réduire le coût de ces bureaux.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Use monthly billing for the consultants' WorkSpaces.", fr: "Utiliser la facturation mensuelle pour les WorkSpaces des consultants." } }
    - { id: b, text: { en: "Use hourly billing for the consultants' WorkSpaces.", fr: "Utiliser la facturation horaire pour les WorkSpaces des consultants." } }
    - { id: c, text: { en: "Buy Amazon EC2 Reserved Instances for the consultants' WorkSpaces.", fr: "Acheter des Amazon EC2 Reserved Instances pour les WorkSpaces des consultants." } }
    - { id: d, text: { en: "Run the consultants' WorkSpaces on Amazon EC2 Dedicated Hosts.", fr: "Exécuter les WorkSpaces des consultants sur des Amazon EC2 Dedicated Hosts." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon WorkSpaces offers monthly or hourly billing. Hourly billing bases the charge on the hours that the desktop is used, which suits users who connect only a few hours a month, whereas monthly billing is a fixed price that suits full-time users."
    fr: "Amazon WorkSpaces propose une facturation mensuelle ou horaire. La facturation horaire calcule le coût en fonction des heures d'utilisation du bureau, ce qui convient aux utilisateurs qui se connectent seulement quelques heures par mois, alors que la facturation mensuelle est un prix fixe adapté aux utilisateurs à temps plein."
  options:
    a:
      en: "A fixed monthly fee costs more than hourly billing for desktops that are used only a few hours each month."
      fr: "Un montant mensuel fixe coûte plus cher que la facturation horaire pour des bureaux utilisés seulement quelques heures par mois."
    c:
      en: "Reserved Instances are a purchasing option for Amazon EC2 instances; WorkSpaces is billed monthly or hourly."
      fr: "Les Reserved Instances sont une option d'achat pour des instances Amazon EC2 ; WorkSpaces est facturé au mois ou à l'heure."
    d:
      en: "Dedicated Hosts are physical EC2 servers for a single customer; they raise cost instead of reducing it."
      fr: "Les Dedicated Hosts sont des serveurs EC2 physiques dédiés à un seul client ; ils augmentent le coût au lieu de le réduire."
references:
  - title: What is Amazon WorkSpaces?
    url: https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces.html
