id: clfc02-3b-regions-regional-disaster
objective: "3.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs a critical application in three Availability Zones of one AWS Region. A new business continuity policy requires that the application can be recovered even if the entire Region becomes unavailable.

    What should the company do to meet this requirement?
  fr: |
    Une entreprise de services financiers exécute une application critique dans trois zones de disponibilité d'une Région AWS. Une nouvelle politique de continuité d'activité exige que l'application puisse être rétablie même si la Région entière devient indisponible.

    Que doit faire l'entreprise pour répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Replicate the application's data and infrastructure to a second AWS Region.", fr: "Répliquer les données et l'infrastructure de l'application dans une deuxième Région AWS." } }
    - { id: b, text: { en: "Add a fourth Availability Zone of the same Region to the application.", fr: "Ajouter à l'application une quatrième zone de disponibilité de la même Région." } }
    - { id: c, text: { en: "Take daily snapshots of the application's volumes and keep them in the same Region.", fr: "Prendre des instantanés quotidiens des volumes de l'application et les conserver dans la même Région." } }
    - { id: d, text: { en: "Raise the maximum capacity of the application's Auto Scaling group in the Region.", fr: "Augmenter la capacité maximale du groupe Auto Scaling de l'application dans la Région." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Multiple Availability Zones protect against the failure of a data center, but all of them belong to the same Region. Disaster recovery and business continuity for a Region-wide event require a copy of the data and the means to run the workload in another Region, because AWS does not replicate resources across Regions automatically."
    fr: "Plusieurs zones de disponibilité protègent contre la panne d'un centre de données, mais elles appartiennent toutes à la même Région. La reprise après sinistre et la continuité d'activité face à un événement touchant toute la Région exigent une copie des données et les moyens d'exécuter la charge de travail dans une autre Région, car AWS ne réplique pas automatiquement les ressources entre Régions."
  options:
    b:
      en: "Another Availability Zone of the same Region does not help if the whole Region is unavailable."
      fr: "Une autre zone de disponibilité de la même Région n'aide pas si toute la Région est indisponible."
    c:
      en: "Snapshots kept only in the affected Region cannot be used to recover the application when that Region is unavailable."
      fr: "Des instantanés conservés uniquement dans la Région touchée ne permettent pas de rétablir l'application quand cette Région est indisponible."
    d:
      en: "An Auto Scaling group adds instances inside the Region; it cannot launch them when the Region itself is unavailable."
      fr: "Un groupe Auto Scaling ajoute des instances dans la Région ; il ne peut pas les lancer quand la Région elle-même est indisponible."
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
