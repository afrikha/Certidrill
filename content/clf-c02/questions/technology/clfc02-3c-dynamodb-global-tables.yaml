id: clfc02-3c-dynamodb-global-tables
objective: "3.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A gaming company stores player profiles in an Amazon DynamoDB table in one AWS Region. Players on several continents must be able to read and write their profiles in a nearby Region with low latency, and the data must replicate between Regions automatically.

    Which DynamoDB feature will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo stocke les profils des joueurs dans une table Amazon DynamoDB d'une seule Région AWS. Les joueurs de plusieurs continents doivent pouvoir lire et écrire leur profil dans une Région proche avec une faible latence, et les données doivent être répliquées automatiquement entre les Régions.

    Quelle fonctionnalité de DynamoDB répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "DynamoDB Accelerator (DAX)", fr: "DynamoDB Accelerator (DAX)" }
    - id: b
      text: { en: "On-demand capacity mode", fr: "Mode de capacité à la demande" }
    - id: c
      text: { en: "Point-in-time recovery (PITR)", fr: "Restauration à un instant dans le passé (PITR)" }
    - id: d
      text: { en: "Global tables", fr: "Tables globales" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      DynamoDB global tables provide multi-active replication across the Regions that the company chooses. Each replica accepts reads and writes, so players use the closest Region, and because there is no primary table, there is no failover delay.
    fr: |-
      Les tables globales DynamoDB fournissent une réplication multi-active entre les Régions choisies par l'entreprise. Chaque réplica accepte les lectures et les écritures : les joueurs utilisent la Région la plus proche et, comme il n'y a pas de table principale, il n'y a pas de délai de basculement.
  options:
    a:
      en: |-
        DAX is an in-memory cache that speeds up reads in front of a table; it does not replicate data or accept writes in other Regions.
      fr: |-
        DAX est un cache en mémoire qui accélère les lectures devant une table ; il ne réplique pas les données et n'accepte pas d'écritures dans d'autres Régions.
    b:
      en: |-
        On-demand capacity mode changes how the table scales and is billed; the table still exists in one Region only.
      fr: |-
        Le mode de capacité à la demande change la façon dont la table évolue et est facturée ; la table n'existe toujours que dans une seule Région.
    c:
      en: |-
        PITR provides continuous backups to restore the table to an earlier point in time; it does not serve traffic in other Regions.
      fr: |-
        La PITR fournit des sauvegardes continues pour restaurer la table à un instant antérieur ; elle ne sert pas de trafic dans d'autres Régions.
references:
  - title: "What is Amazon DynamoDB? - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
