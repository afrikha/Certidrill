id: clfc02-3d-q-developer
objective: "3.7.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's developers want a generative AI–powered assistant in their IDE that chats about their code, suggests and generates code, and scans the code for security vulnerabilities. They also want to ask it questions about AWS best practices.

    Which AWS service meets these requirements?
  fr: |
    Les développeurs d'une entreprise veulent, dans leur IDE, un assistant fondé sur l'IA générative qui discute de leur code, suggère et génère du code, et analyse le code à la recherche de vulnérabilités de sécurité. Ils veulent aussi lui poser des questions sur les bonnes pratiques AWS.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Lex" }
    - { id: b, text: "Amazon Q Developer" }
    - { id: c, text: "Amazon Comprehend" }
    - { id: d, text: "Amazon SageMaker AI" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Q Developer is a generative AI conversational assistant for understanding, building, extending, and operating AWS applications. In the IDE, it chats about code, provides inline code completions, generates new code, and scans code for security vulnerabilities, and it can answer questions about AWS architecture and best practices."
    fr: "Amazon Q Developer est un assistant conversationnel d'IA générative qui aide à comprendre, créer, étendre et exploiter des applications AWS. Dans l'IDE, il discute du code, fournit des complétions de code en ligne, génère du nouveau code et analyse le code à la recherche de vulnérabilités, et il peut répondre à des questions sur l'architecture et les bonnes pratiques AWS."
  options:
    a:
      en: "Amazon Lex is a service for building your own chatbots for customers; it is not a coding assistant in the IDE."
      fr: "Amazon Lex est un service qui permet de créer ses propres chatbots pour les clients ; ce n'est pas un assistant de codage dans l'IDE."
    c:
      en: "Amazon Comprehend analyzes natural language text for sentiment and entities; it does not generate code or scan it for vulnerabilities."
      fr: "Amazon Comprehend analyse du texte en langage naturel pour en tirer le sentiment et les entités ; il ne génère pas de code et ne l'analyse pas à la recherche de vulnérabilités."
    d:
      en: "Amazon SageMaker AI is a platform to build, train, and deploy your own ML models; it is not a ready-to-use coding assistant."
      fr: "Amazon SageMaker AI est une plateforme pour créer, entraîner et déployer ses propres modèles de ML ; ce n'est pas un assistant de codage prêt à l'emploi."
references:
  - title: What is Amazon Q Developer?
    url: https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/what-is.html
