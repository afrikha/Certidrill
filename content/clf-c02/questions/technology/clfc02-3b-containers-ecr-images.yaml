id: clfc02-3b-containers-ecr-images
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company builds container images for applications that run on Amazon ECS and Amazon EKS. The company needs a managed, private place to store, version, and share these images, with access controlled by IAM.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise crée des images de conteneurs pour des applications qui s'exécutent sur Amazon ECS et Amazon EKS. L'entreprise a besoin d'un emplacement géré et privé pour stocker, versionner et partager ces images, avec un accès contrôlé par IAM.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS CodeBuild" }
    - { id: b, text: "Amazon Elastic File System (Amazon EFS)" }
    - { id: c, text: "AWS Fargate" }
    - { id: d, text: "Amazon Elastic Container Registry (Amazon ECR)" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon ECR is an AWS managed container image registry service. It supports private repositories with resource-based permissions using IAM, so only specified users or instances can access the images, and it works as an extension of Amazon ECS and Amazon EKS."
    fr: "Amazon ECR est un service de registre d'images de conteneurs géré par AWS. Il prend en charge des référentiels privés avec des autorisations basées sur les ressources via IAM, pour que seuls les utilisateurs ou instances désignés accèdent aux images, et il fonctionne comme une extension d'Amazon ECS et d'Amazon EKS."
  options:
    a:
      en: "CodeBuild compiles code and can build container images, but it does not store and serve them as a registry."
      fr: "CodeBuild compile du code et peut créer des images de conteneurs, mais il ne les stocke pas et ne les distribue pas comme un registre."
    b:
      en: "Amazon EFS is a shared file system; it is not a container registry that ECS and EKS pull images from."
      fr: "Amazon EFS est un système de fichiers partagé ; ce n'est pas un registre de conteneurs depuis lequel ECS et EKS extraient les images."
    c:
      en: "Fargate is a serverless compute engine that runs containers; it does not store container images."
      fr: "Fargate est un moteur de calcul sans serveur qui exécute des conteneurs ; il ne stocke pas d'images de conteneurs."
references:
  - title: What is Amazon Elastic Container Registry?
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html
