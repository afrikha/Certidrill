id: clfc02-3d-sgw-s3-file-cache
objective: "3.6.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's on-premises applications save files to NFS shares. The company wants the files to be stored as objects in Amazon S3, while the applications keep low-latency access to recently used files through a local cache.

    Which AWS service or feature meets these requirements?
  fr: |
    Les applications sur site d'une entreprise enregistrent des fichiers sur des partages NFS. L'entreprise veut que les fichiers soient stockés sous forme d'objets dans Amazon S3, tandis que les applications conservent un accès à faible latence aux fichiers récemment utilisés grâce à un cache local.

    Quel service ou quelle fonctionnalité AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon S3 File Gateway" }
    - { id: b, text: "Tape Gateway" }
    - { id: c, text: "AWS DataSync" }
    - { id: d, text: "Amazon Elastic File System (Amazon EFS)" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon S3 File Gateway, a type of AWS Storage Gateway, gives on-premises applications NFS and SMB file shares whose files are stored as objects in Amazon S3. Transparent local caching provides low-latency access to frequently used data."
    fr: "Amazon S3 File Gateway, un type d'AWS Storage Gateway, fournit aux applications sur site des partages de fichiers NFS et SMB dont les fichiers sont stockés sous forme d'objets dans Amazon S3. Une mise en cache locale transparente offre un accès à faible latence aux données fréquemment utilisées."
  options:
    b:
      en: "Tape Gateway presents virtual tapes to backup applications for archiving; it does not provide NFS file shares to applications."
      fr: "Tape Gateway présente des bandes virtuelles aux applications de sauvegarde pour l'archivage ; il ne fournit pas de partages de fichiers NFS aux applications."
    c:
      en: "AWS DataSync transfers data between storage systems, for example for migration; it does not give applications an ongoing file share with a local cache."
      fr: "AWS DataSync transfère des données entre systèmes de stockage, par exemple pour une migration ; il ne fournit pas aux applications un partage de fichiers permanent avec un cache local."
    d:
      en: "Amazon EFS is a file system in AWS that stores files, not S3 objects, and it has no on-premises local cache."
      fr: "Amazon EFS est un système de fichiers dans AWS qui stocke des fichiers, pas des objets S3, et il n'a pas de cache local sur site."
references:
  - title: What is Amazon S3 File Gateway - AWS Storage Gateway
    url: https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html
  - title: What is AWS DataSync?
    url: https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html
