id: clfc02-3e-support-designated-tam
objective: "3.8.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants a designated Technical Account Manager (TAM) who knows its workloads and provides proactive guidance.

    Which is the MOST cost-effective AWS Support plan that meets this requirement?
  fr: |
    Une entreprise souhaite un Technical Account Manager (TAM) désigné qui connaît ses charges de travail et fournit des conseils proactifs.

    Quel est le plan AWS Support le PLUS rentable qui répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "AWS Enterprise Support", fr: "AWS Enterprise Support" } }
    - { id: b, text: { en: "AWS Business Support+", fr: "AWS Business Support+" } }
    - { id: c, text: { en: "AWS Unified Operations", fr: "AWS Unified Operations" } }
    - { id: d, text: { en: "Basic Support", fr: "Basic Support" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Enterprise Support includes everything in Business Support+ plus a designated Technical Account Manager, strategic business reviews and faster response for critical cases. It is the lowest-cost plan with a designated TAM."
    fr: "Enterprise Support inclut tout ce que contient Business Support+, plus un Technical Account Manager désigné, des revues stratégiques et des réponses plus rapides pour les cas critiques. C'est le plan le moins cher qui inclut un TAM désigné."
  options:
    b:
      en: "Business Support+ gives 24x7 access to Cloud Support Engineers but no designated TAM."
      fr: "Business Support+ donne un accès 24 h/24 et 7 j/7 aux ingénieurs du support cloud, mais pas de TAM désigné."
    c:
      en: "Unified Operations also includes a designated TAM, but it adds more services on top of Enterprise Support, so it is not the most cost-effective choice."
      fr: "Unified Operations inclut aussi un TAM désigné, mais il ajoute des services en plus d'Enterprise Support : ce n'est donc pas le choix le plus rentable."
    d:
      en: "Basic Support covers account and billing questions only; it has no TAM."
      fr: "Basic Support ne couvre que les questions de compte et de facturation ; il ne comprend pas de TAM."
references:
  - title: AWS Support Plans
    url: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
  - title: AWS Support plan comparison
    url: https://aws.amazon.com/premiumsupport/plans/
