id: clfc02-3d-sgw-hybrid-definition
objective: "3.6.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes AWS Storage Gateway?
  fr: |
    Quelle affirmation décrit AWS Storage Gateway ?
body:
  options:
    - { id: a, text: { en: "A hybrid cloud storage service that gives on-premises applications access to AWS storage and caches frequently used data locally.", fr: "Un service de stockage cloud hybride qui donne aux applications sur site l'accès au stockage AWS et met en cache localement les données fréquemment utilisées." } }
    - { id: b, text: { en: "A managed transfer service that copies data between on-premises storage and AWS storage services, for example to migrate datasets.", fr: "Un service de transfert géré qui copie des données entre le stockage sur site et les services de stockage AWS, par exemple pour migrer des jeux de données." } }
    - { id: c, text: { en: "A dedicated private network connection between an on-premises data center and AWS that bypasses the public internet.", fr: "Une connexion réseau privée dédiée entre un centre de données sur site et AWS qui évite l'internet public." } }
    - { id: d, text: { en: "A managed shared file system in AWS that Linux instances in multiple Availability Zones mount over NFS.", fr: "Un système de fichiers partagé géré dans AWS que des instances Linux de plusieurs zones de disponibilité montent via NFS." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Storage Gateway is a hybrid cloud storage service: on-premises applications use standard storage protocols to reach AWS storage without being rewritten. It keeps frequently accessed data in a local cache for low-latency access while the data is stored durably in AWS."
    fr: "AWS Storage Gateway est un service de stockage cloud hybride : les applications sur site utilisent des protocoles de stockage standard pour atteindre le stockage AWS sans être réécrites. Il conserve les données fréquemment consultées dans un cache local pour un accès à faible latence, tandis que les données sont stockées durablement dans AWS."
  options:
    b:
      en: "Moving data between storage systems for migration or replication describes AWS DataSync."
      fr: "Déplacer des données entre systèmes de stockage pour une migration ou une réplication décrit AWS DataSync."
    c:
      en: "A dedicated private network connection to AWS describes AWS Direct Connect."
      fr: "Une connexion réseau privée dédiée vers AWS décrit AWS Direct Connect."
    d:
      en: "A managed NFS file system for Linux instances in multiple Availability Zones describes Amazon EFS."
      fr: "Un système de fichiers NFS géré pour des instances Linux de plusieurs zones de disponibilité décrit Amazon EFS."
references:
  - title: AWS Storage Gateway FAQs | Amazon Web Services
    url: https://aws.amazon.com/storagegateway/faqs/
  - title: What is AWS DataSync?
    url: https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html
