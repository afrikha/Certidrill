id: clfc02-3d-backup-capabilities
objective: "3.6.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two capabilities does AWS Backup provide? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux capacités fournies par AWS Backup ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Copy backups to another AWS Region or to another AWS account.", fr: "Copier des sauvegardes vers une autre Région AWS ou vers un autre compte AWS." } }
    - { id: b, text: { en: "Replicate on-premises servers continuously at the block level for fast failover to AWS.", fr: "Répliquer en continu des serveurs sur site au niveau bloc pour un basculement rapide vers AWS." } }
    - { id: c, text: { en: "Move S3 objects to another storage class a set number of days after creation.", fr: "Déplacer des objets S3 vers une autre classe de stockage un nombre donné de jours après leur création." } }
    - { id: d, text: { en: "Apply backup policies to the accounts of an organization in AWS Organizations.", fr: "Appliquer des politiques de sauvegarde aux comptes d'une organisation dans AWS Organizations." } }
    - { id: e, text: { en: "Migrate on-premises NFS file shares to Amazon EFS over the network.", fr: "Migrer des partages de fichiers NFS sur site vers Amazon EFS via le réseau." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS Backup can copy recovery points to backup vaults in other Regions and other accounts, for example for disaster recovery. With AWS Organizations, a management account can apply backup policies that deploy backup plans to the member accounts."
    fr: "AWS Backup peut copier des points de récupération vers des coffres de sauvegarde d'autres Régions et d'autres comptes, par exemple pour la reprise après sinistre. Avec AWS Organizations, un compte de gestion peut appliquer des politiques de sauvegarde qui déploient des plans de sauvegarde dans les comptes membres."
  options:
    b:
      en: "Continuous block-level replication of servers for fast recovery is provided by AWS Elastic Disaster Recovery."
      fr: "La réplication continue de serveurs au niveau bloc pour une récupération rapide est fournie par AWS Elastic Disaster Recovery."
    c:
      en: "Moving S3 objects between storage classes after a set time is done with S3 Lifecycle rules."
      fr: "Le déplacement d'objets S3 entre classes de stockage après une durée donnée se fait avec des règles S3 Lifecycle."
    e:
      en: "Migrating file shares over the network to AWS storage is done with AWS DataSync."
      fr: "La migration de partages de fichiers via le réseau vers le stockage AWS se fait avec AWS DataSync."
references:
  - title: What is AWS Backup?
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html
  - title: Managing AWS Backup resources across multiple AWS accounts
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/manage-cross-account.html
