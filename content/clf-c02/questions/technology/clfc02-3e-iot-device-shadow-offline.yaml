id: clfc02-3e-iot-device-shadow-offline
objective: "3.8.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Smart lights connect to AWS IoT Core but are often offline. A mobile app must read each light's last reported state and request a new state even when the light is offline. The light must apply the change when it reconnects.

    Which AWS IoT feature will meet these requirements?
  fr: |
    Des ampoules connectées se connectent à AWS IoT Core mais sont souvent hors ligne. Une application mobile doit lire le dernier état signalé de chaque ampoule et demander un nouvel état, même lorsque l'ampoule est hors ligne. L'ampoule doit appliquer la modification lorsqu'elle se reconnecte.

    Quelle fonctionnalité AWS IoT répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Rules engine", fr: "Moteur de règles" } }
    - { id: b, text: { en: "Jobs", fr: "Tâches (jobs)" } }
    - { id: c, text: { en: "Device Shadow service", fr: "Service Device Shadow" } }
    - { id: d, text: { en: "Registry", fr: "Registre" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A device shadow is a JSON document stored in the cloud that holds a device's state. The app reads the reported state and writes a desired state at any time; when the device reconnects, it receives the difference, applies it and reports its new state."
    fr: "Un shadow d'appareil est un document JSON stocké dans le cloud qui contient l'état d'un appareil. L'application lit l'état signalé (reported) et écrit un état souhaité (desired) à tout moment ; lorsque l'appareil se reconnecte, il reçoit la différence, l'applique et signale son nouvel état."
  options:
    a:
      en: "The rules engine routes incoming messages to other services; it does not keep a device's state for later synchronization."
      fr: "Le moteur de règles achemine les messages entrants vers d'autres services ; il ne conserve pas l'état d'un appareil pour une synchronisation ultérieure."
    b:
      en: "Jobs send remote operations such as firmware updates or reboots; they do not store a readable device state."
      fr: "Les tâches (jobs) envoient des opérations à distance comme des mises à jour de microprogramme ou des redémarrages ; elles ne stockent pas d'état lisible de l'appareil."
    d:
      en: "The registry stores device identities and attributes, not the device's current and desired state."
      fr: "Le registre stocke les identités et attributs des appareils, pas leur état actuel et souhaité."
references:
  - title: AWS IoT Device Shadow service
    url: https://docs.aws.amazon.com/iot/latest/developerguide/iot-device-shadows.html
