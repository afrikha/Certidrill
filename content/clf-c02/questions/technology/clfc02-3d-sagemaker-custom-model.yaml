id: clfc02-3d-sagemaker-custom-model
objective: "3.7.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company's data scientists want to predict equipment failures from the company's own sensor data. They need a fully managed service to build, train, and deploy their own custom machine learning models.

    Which AWS service should the data scientists use?
  fr: |
    Les data scientists d'une entreprise industrielle veulent prédire les pannes d'équipement à partir des données de capteurs de l'entreprise. Ils ont besoin d'un service entièrement géré pour créer, entraîner et déployer leurs propres modèles de machine learning personnalisés.

    Quel service AWS les data scientists doivent-ils utiliser ?
body:
  options:
    - { id: a, text: "Amazon Rekognition" }
    - { id: b, text: "Amazon Comprehend" }
    - { id: c, text: "Amazon Translate" }
    - { id: d, text: "Amazon SageMaker AI" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon SageMaker AI is a fully managed machine learning service. Data scientists and developers use it to build, train, and deploy their own ML models into a production-ready hosted environment."
    fr: "Amazon SageMaker AI est un service de machine learning entièrement géré. Les data scientists et les développeurs l'utilisent pour créer, entraîner et déployer leurs propres modèles de ML dans un environnement hébergé prêt pour la production."
  options:
    a:
      en: "Amazon Rekognition is a ready-to-use service for analyzing images and videos; it is not a platform to build and train models on sensor data."
      fr: "Amazon Rekognition est un service prêt à l'emploi d'analyse d'images et de vidéos ; ce n'est pas une plateforme pour créer et entraîner des modèles sur des données de capteurs."
    b:
      en: "Amazon Comprehend is a natural language processing service for text; it does not train prediction models on sensor data."
      fr: "Amazon Comprehend est un service de traitement du langage naturel pour le texte ; il n'entraîne pas de modèles de prédiction sur des données de capteurs."
    c:
      en: "Amazon Translate is a ready-to-use translation service; it has no use for predicting equipment failures."
      fr: "Amazon Translate est un service de traduction prêt à l'emploi ; il ne sert pas à prédire les pannes d'équipement."
references:
  - title: What is Amazon SageMaker AI?
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html
