id: clfc02-3e-iot-rules-engine
objective: "3.8.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS IoT Core. It wants messages from its devices to be filtered with SQL-like statements and sent automatically to Amazon S3 and AWS Lambda, without running any servers.

    Which AWS IoT Core feature should the company use?
  fr: |
    Une entreprise utilise AWS IoT Core. Elle veut que les messages de ses appareils soient filtrés avec des instructions de type SQL et envoyés automatiquement vers Amazon S3 et AWS Lambda, sans exécuter de serveur.

    Quelle fonctionnalité d'AWS IoT Core l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Rules engine", fr: "Moteur de règles" } }
    - { id: b, text: { en: "Device Shadow service", fr: "Service Device Shadow" } }
    - { id: c, text: { en: "Registry", fr: "Registre" } }
    - { id: d, text: { en: "Jobs", fr: "Tâches (jobs)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS IoT Core rules engine uses an SQL-based language to select data from messages that reach the message broker and route it to other AWS services, such as Amazon S3, Amazon DynamoDB and AWS Lambda. Rules can also republish messages to the broker."
    fr: "Le moteur de règles d'AWS IoT Core utilise un langage basé sur SQL pour sélectionner des données dans les messages qui arrivent à l'agent de messages et les acheminer vers d'autres services AWS, comme Amazon S3, Amazon DynamoDB et AWS Lambda. Les règles peuvent aussi republier des messages vers l'agent."
  options:
    b:
      en: "The Device Shadow service stores the current state of each device; it does not route messages to other services."
      fr: "Le service Device Shadow stocke l'état actuel de chaque appareil ; il n'achemine pas de messages vers d'autres services."
    c:
      en: "The registry stores device resources and attributes; it does not process messages."
      fr: "Le registre stocke les ressources et attributs des appareils ; il ne traite pas de messages."
    d:
      en: "Jobs send remote operations, such as firmware updates, to devices; they do not route device data."
      fr: "Les tâches (jobs) envoient des opérations à distance, comme des mises à jour de microprogramme, aux appareils ; elles n'acheminent pas les données des appareils."
references:
  - title: How AWS IoT works
    url: https://docs.aws.amazon.com/iot/latest/developerguide/aws-iot-how-it-works.html
