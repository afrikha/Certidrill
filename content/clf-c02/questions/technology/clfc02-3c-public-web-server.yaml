id: clfc02-3c-public-web-server
objective: "3.5.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company launches an Amazon EC2 web server in a subnet of a new, custom VPC. The security group already allows HTTPS from the internet, but the server must be reachable from the internet over IPv4.

    Which combination of actions will meet this requirement? (Choose two.)
  fr: |
    Une entreprise lance un serveur web Amazon EC2 dans un sous-réseau d'un nouveau VPC personnalisé. Le groupe de sécurité autorise déjà HTTPS depuis Internet, mais le serveur doit être accessible depuis Internet en IPv4.

    Quelle combinaison d'actions répond à cette exigence ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Create a NAT gateway and route the subnet's traffic to it.", fr: "Créer une passerelle NAT et y acheminer le trafic du sous-réseau." }
    - id: b
      text: { en: "Attach an internet gateway and add a route to it in the subnet's route table.", fr: "Attacher une passerelle Internet et ajouter un itinéraire vers elle dans la table de routage du sous-réseau." }
    - id: c
      text: { en: "Create a VPC peering connection with the default VPC.", fr: "Créer une connexion d'appairage de VPC avec le VPC par défaut." }
    - id: d
      text: { en: "Assign a public IPv4 address or an Elastic IP address to the instance.", fr: "Attribuer une adresse IPv4 publique ou une adresse IP Elastic à l'instance." }
    - id: e
      text: { en: "Attach a virtual private gateway to the VPC.", fr: "Attacher une passerelle privée virtuelle au VPC." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      An internet gateway allows communication between a VPC and the internet, and a subnet becomes public when its route table has a route to that gateway. For IPv4, the instance also needs a public IPv4 address or an Elastic IP address, which the internet gateway maps to the instance's private address.
    fr: |-
      Une passerelle Internet permet la communication entre un VPC et Internet, et un sous-réseau devient public lorsque sa table de routage contient un itinéraire vers cette passerelle. En IPv4, l'instance a aussi besoin d'une adresse IPv4 publique ou d'une adresse IP Elastic, que la passerelle Internet associe à l'adresse privée de l'instance.
  options:
    a:
      en: |-
        A NAT gateway allows outbound connections only; clients on the internet cannot initiate connections to the web server through it.
      fr: |-
        Une passerelle NAT n'autorise que les connexions sortantes ; les clients sur Internet ne peuvent pas initier de connexions vers le serveur web par son intermédiaire.
    c:
      en: |-
        Peering routes traffic between two VPCs privately; it does not expose the server to the internet.
      fr: |-
        L'appairage achemine le trafic entre deux VPC de façon privée ; il n'expose pas le serveur sur Internet.
    e:
      en: |-
        A virtual private gateway terminates a Site-to-Site VPN from an on-premises network; it does not give internet access.
      fr: |-
        Une passerelle privée virtuelle termine un Site-to-Site VPN venant d'un réseau sur site ; elle ne donne pas accès à Internet.
references:
  - title: "Enable internet access for a VPC using an internet gateway - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html
