id: clfc02-3b-relational-rds-oracle
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application that depends on features of Oracle Database. The company wants to move the database to a managed AWS service and keep using the Oracle engine.

    Which AWS service should the company use?
  fr: |
    Une entreprise exécute une application qui dépend de fonctionnalités d'Oracle Database. L'entreprise veut déplacer la base de données vers un service AWS géré et continuer d'utiliser le moteur Oracle.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon Aurora" }
    - { id: b, text: "Amazon RDS" }
    - { id: c, text: "Amazon DynamoDB" }
    - { id: d, text: "Amazon DocumentDB" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon RDS is a managed relational database service that supports several engines, including Oracle, Microsoft SQL Server, IBM Db2, MySQL, MariaDB, and PostgreSQL. With Amazon RDS for Oracle, the application keeps the Oracle engine while AWS handles tasks such as provisioning, patching, and backups."
    fr: "Amazon RDS est un service de base de données relationnelle géré qui prend en charge plusieurs moteurs, dont Oracle, Microsoft SQL Server, IBM Db2, MySQL, MariaDB et PostgreSQL. Avec Amazon RDS for Oracle, l'application conserve le moteur Oracle tandis qu'AWS se charge de tâches comme le provisionnement, les correctifs et les sauvegardes."
  options:
    a:
      en: "Aurora is compatible with MySQL and PostgreSQL only; moving to it would mean converting the Oracle database."
      fr: "Aurora est compatible uniquement avec MySQL et PostgreSQL ; y migrer imposerait de convertir la base Oracle."
    c:
      en: "DynamoDB is a NoSQL database; it does not run the Oracle relational engine."
      fr: "DynamoDB est une base NoSQL ; il n'exécute pas le moteur relationnel Oracle."
    d:
      en: "DocumentDB is a MongoDB-compatible document database, not an Oracle-compatible relational database."
      fr: "DocumentDB est une base orientée documents compatible avec MongoDB, pas une base relationnelle compatible avec Oracle."
references:
  - title: What is Amazon Relational Database Service (Amazon RDS)?
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html
