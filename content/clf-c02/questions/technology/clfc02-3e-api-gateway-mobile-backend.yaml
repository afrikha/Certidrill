id: clfc02-3e-api-gateway-mobile-backend
objective: "3.8.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A mobile app must call business logic that runs in AWS Lambda functions through REST API endpoints. The company wants a fully managed service to create, publish and secure these APIs.

    Which AWS service will meet these requirements?
  fr: |
    Une application mobile doit appeler une logique métier qui s'exécute dans des fonctions AWS Lambda au moyen de points de terminaison d'API REST. L'entreprise veut un service entièrement géré pour créer, publier et sécuriser ces API.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon API Gateway", fr: "Amazon API Gateway" } }
    - { id: b, text: { en: "Amazon Route 53", fr: "Amazon Route 53" } }
    - { id: c, text: { en: "AWS Direct Connect", fr: "AWS Direct Connect" } }
    - { id: d, text: { en: "Amazon Simple Queue Service (Amazon SQS)", fr: "Amazon Simple Queue Service (Amazon SQS)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon API Gateway creates, publishes, maintains, monitors and secures REST, HTTP and WebSocket APIs. It acts as the front door that client applications use to reach backends such as Lambda functions, and it handles authorization, for example with Amazon Cognito user pools."
    fr: "Amazon API Gateway permet de créer, publier, maintenir, surveiller et sécuriser des API REST, HTTP et WebSocket. Il sert de porte d'entrée aux applications clientes pour atteindre des backends comme des fonctions Lambda, et il gère l'autorisation, par exemple avec des groupes d'utilisateurs Amazon Cognito."
  options:
    b:
      en: "Route 53 is a DNS service that resolves domain names; it does not create or secure APIs."
      fr: "Route 53 est un service DNS qui résout des noms de domaine ; il ne crée ni ne sécurise d'API."
    c:
      en: "Direct Connect is a dedicated network link from a data center to AWS; mobile apps do not use it to call APIs."
      fr: "Direct Connect est une liaison réseau dédiée entre un centre de données et AWS ; les applications mobiles ne l'utilisent pas pour appeler des API."
    d:
      en: "SQS queues messages between application components; it does not expose REST endpoints for mobile clients."
      fr: "SQS met en file d'attente des messages entre composants d'application ; il n'expose pas de points de terminaison REST pour les clients mobiles."
references:
  - title: What is Amazon API Gateway?
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/welcome.html
