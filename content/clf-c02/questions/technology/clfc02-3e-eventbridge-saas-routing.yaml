id: clfc02-3e-eventbridge-saas-routing
objective: "3.8.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to receive events from its AWS services and from a third-party SaaS application. Each event must be routed to different targets based on rules that the company writes.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise souhaite recevoir des événements de ses services AWS et d'une application SaaS tierce. Chaque événement doit être acheminé vers différentes cibles selon des règles que l'entreprise écrit.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" } }
    - { id: b, text: { en: "Amazon EventBridge", fr: "Amazon EventBridge" } }
    - { id: c, text: { en: "Amazon Simple Queue Service (Amazon SQS)", fr: "Amazon Simple Queue Service (Amazon SQS)" } }
    - { id: d, text: { en: "Amazon Simple Email Service (Amazon SES)", fr: "Amazon Simple Email Service (Amazon SES)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EventBridge is a serverless service that connects application components with events. Its event buses receive events from AWS services, third-party software and custom applications, and rules decide which events go to which targets."
    fr: "Amazon EventBridge est un service sans serveur qui connecte les composants d'une application au moyen d'événements. Ses bus d'événements reçoivent des événements de services AWS, de logiciels tiers et d'applications personnalisées, et des règles déterminent quels événements vont vers quelles cibles."
  options:
    a:
      en: "CloudTrail records API calls made in an AWS account for auditing; it does not route events from SaaS applications to targets."
      fr: "CloudTrail enregistre les appels d'API effectués dans un compte AWS à des fins d'audit ; il n'achemine pas d'événements d'applications SaaS vers des cibles."
    c:
      en: "SQS holds messages in a queue for one consumer application to poll; it does not apply routing rules to send events to several targets."
      fr: "SQS conserve des messages dans une file d'attente qu'une application consommatrice interroge ; il n'applique pas de règles d'acheminement pour envoyer des événements vers plusieurs cibles."
    d:
      en: "SES sends and receives email; it is not an event router."
      fr: "SES envoie et reçoit des e-mails ; ce n'est pas un routeur d'événements."
references:
  - title: What Is Amazon EventBridge?
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html
