id: clfc02-3b-az-separation-distance
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Availability Zones of an AWS Region are located a meaningful distance apart, but no more than about 100 km (60 miles) from each other.

    What is the main reason for this design?
  fr: |
    Les zones de disponibilité d'une Région AWS sont éloignées d'une distance significative les unes des autres, mais pas de plus de 100 km (60 miles) environ.

    Quelle est la principale raison de cette conception ?
body:
  options:
    - { id: a, text: { en: "To place each Availability Zone in a different country so that customers can meet data residency rules", fr: "Placer chaque zone de disponibilité dans un pays différent pour que les clients puissent respecter les règles de résidence des données" } }
    - { id: b, text: { en: "To let the Availability Zones of a Region share generators and cooling equipment at a lower cost", fr: "Permettre aux zones de disponibilité d'une Région de partager les groupes électrogènes et les équipements de refroidissement à moindre coût" } }
    - { id: c, text: { en: "To let each Availability Zone act as an edge location that serves cached content to nearby users", fr: "Permettre à chaque zone de disponibilité de servir d'emplacement périphérique qui distribue du contenu mis en cache aux utilisateurs proches" } }
    - { id: d, text: { en: "To keep one flood or fire from hitting several zones while keeping latency low for replication", fr: "Éviter qu'une même inondation ou un même incendie touche plusieurs zones tout en gardant une latence faible pour la réplication" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Availability Zones are far enough apart that events such as fires, floods, or tornadoes are unlikely to affect more than one of them. They stay close enough, with dedicated low-latency links, for applications to replicate data synchronously between zones."
    fr: "Les zones de disponibilité sont suffisamment éloignées pour qu'un incendie, une inondation ou une tornade ait peu de chances d'en toucher plusieurs. Elles restent assez proches, avec des liaisons dédiées à faible latence, pour que les applications puissent répliquer les données de manière synchrone entre zones."
  options:
    a:
      en: "All the Availability Zones of a Region are within about 100 km of each other in the same geographic area; data residency is met by choosing the Region."
      fr: "Toutes les zones de disponibilité d'une Région se trouvent dans un rayon d'environ 100 km dans la même zone géographique ; la résidence des données se règle par le choix de la Région."
    b:
      en: "Availability Zones do not share generators or cooling equipment; sharing them would create a single point of failure."
      fr: "Les zones de disponibilité ne partagent ni groupes électrogènes ni équipements de refroidissement ; les partager créerait un point de défaillance unique."
    c:
      en: "Edge locations are separate sites of the AWS network used to cache content; Availability Zones are not edge locations."
      fr: "Les emplacements périphériques sont des sites distincts du réseau AWS utilisés pour la mise en cache ; les zones de disponibilité ne sont pas des emplacements périphériques."
references:
  - title: Availability Zones
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/availability-zones.html
