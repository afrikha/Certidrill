id: clfc02-3a-iac-benefits
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company provisions its AWS resources manually in the AWS Management Console. It is considering infrastructure as code with AWS CloudFormation instead.

    Which benefits will the company gain? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise met en service ses ressources AWS manuellement dans l'AWS Management Console. Elle envisage de passer à l'infrastructure as code avec AWS CloudFormation.

    Quels avantages l'entreprise obtiendra-t-elle ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The resources that CloudFormation creates are not charged.", fr: "Les ressources créées par CloudFormation ne sont pas facturées." } }
    - { id: b, text: { en: "Infrastructure definitions can be kept in version control to track who changed what and when.", fr: "Les définitions de l'infrastructure peuvent être conservées dans un système de gestion de versions pour savoir qui a modifié quoi et quand." } }
    - { id: c, text: { en: "Users no longer need IAM permissions to create resources.", fr: "Les utilisateurs n'ont plus besoin d'autorisations IAM pour créer des ressources." } }
    - { id: d, text: { en: "The same set of resources can be provisioned repeatedly and consistently.", fr: "Le même ensemble de ressources peut être mis en service de façon répétée et cohérente." } }
    - { id: e, text: { en: "Resources created from a template never fail or become unavailable.", fr: "Les ressources créées à partir d'un modèle ne tombent jamais en panne et ne deviennent jamais indisponibles." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      CloudFormation templates are text files, so they can be stored in version control to see what changed, who changed it, and when, and to roll back to an earlier version. A template describes the resources once and can then provision the same resources again and again in a consistent way.
    fr: |
      Les modèles CloudFormation sont des fichiers texte : ils peuvent être stockés dans un système de gestion de versions pour voir ce qui a changé, qui l'a modifié et quand, et pour revenir à une version antérieure. Un modèle décrit les ressources une fois, puis peut mettre en service les mêmes ressources encore et encore de façon cohérente.
  options:
    a: { en: "The resources in a stack are billed as usual; infrastructure as code changes how they are created, not their price.", fr: "Les ressources d'une pile sont facturées normalement ; l'infrastructure as code change leur mode de création, pas leur prix." }
    c: { en: "Creating a stack still requires IAM permissions for the resources it creates (directly or through a service role).", fr: "La création d'une pile exige toujours des autorisations IAM sur les ressources créées (directement ou par un rôle de service)." }
    e: { en: "Infrastructure as code makes deployments consistent; it does not make the resources immune to failure.", fr: "L'infrastructure as code rend les déploiements cohérents ; elle ne protège pas les ressources contre les pannes." }
references:
  - title: What is CloudFormation?
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html
