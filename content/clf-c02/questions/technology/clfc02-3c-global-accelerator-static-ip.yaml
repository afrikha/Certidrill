id: clfc02-3c-global-accelerator-static-ip
objective: "3.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a multiplayer game behind Network Load Balancers in two AWS Regions. Players' clients must connect to two fixed IP addresses, and their traffic must travel over the AWS global network to the healthy Regional endpoint closest to them.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise exécute un jeu multijoueur derrière des Network Load Balancers dans deux Régions AWS. Les clients des joueurs doivent se connecter à deux adresses IP fixes, et leur trafic doit emprunter le réseau mondial AWS jusqu'au point de terminaison régional sain le plus proche d'eux.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon Route 53 with latency routing", fr: "Amazon Route 53 avec routage basé sur la latence" }
    - id: b
      text: { en: "AWS Global Accelerator", fr: "AWS Global Accelerator" }
    - id: c
      text: { en: "Elastic IP addresses on each load balancer", fr: "Adresses IP Elastic sur chaque équilibreur de charge" }
    - id: d
      text: { en: "AWS Transit Gateway inter-Region peering", fr: "Appairage inter-Région AWS Transit Gateway" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Global Accelerator gives a standard accelerator two static anycast IPv4 addresses from the AWS edge network. Traffic then travels over the AWS global network to the optimal Regional endpoint, chosen by health, client location and the configured policies.
    fr: |-
      AWS Global Accelerator attribue à un accélérateur standard deux adresses IPv4 anycast statiques issues du réseau périphérique AWS. Le trafic emprunte ensuite le réseau mondial AWS jusqu'au point de terminaison régional optimal, choisi selon l'état de santé, l'emplacement du client et les politiques configurées.
  options:
    a:
      en: |-
        Latency routing returns different DNS answers per Region, so clients do not use two fixed IP addresses, and traffic is not carried over the AWS global network from the edge.
      fr: |-
        Le routage basé sur la latence renvoie des réponses DNS différentes selon la Région : les clients n'utilisent pas deux adresses IP fixes, et le trafic n'est pas transporté par le réseau mondial AWS depuis la périphérie.
    c:
      en: |-
        Elastic IP addresses are fixed per Region, so clients would need to choose a Region themselves; nothing directs them to the closest healthy endpoint.
      fr: |-
        Les adresses IP Elastic sont fixes par Région : les clients devraient choisir eux-mêmes une Région, et rien ne les dirige vers le point de terminaison sain le plus proche.
    d:
      en: |-
        Transit gateway peering connects networks between Regions; it does not give internet clients static entry IP addresses.
      fr: |-
        L'appairage de passerelles de transit relie des réseaux entre Régions ; il ne fournit pas d'adresses IP d'entrée statiques aux clients Internet.
references:
  - title: "What is AWS Global Accelerator? - AWS Global Accelerator"
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html
