id: clfc02-3a-repeatable-indicators
objective: "3.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is deciding whether to automate several tasks with a repeatable process or to perform them once by hand.

    Which requirements indicate that a repeatable, automated process is the better choice? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise doit décider si elle automatise plusieurs tâches avec un processus reproductible ou si elle les effectue une fois à la main.

    Quels besoins indiquent qu'un processus reproductible et automatisé est le meilleur choix ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Check the encryption setting of one bucket once for an internal question.", fr: "Vérifier une fois le paramètre de chiffrement d'un compartiment pour une question interne." } }
    - { id: b, text: { en: "Create the same application environment for every new customer.", fr: "Créer le même environnement applicatif pour chaque nouveau client." } }
    - { id: c, text: { en: "Try out a service for one afternoon and delete the test resources afterward.", fr: "Essayer un service pendant un après-midi, puis supprimer les ressources de test." } }
    - { id: d, text: { en: "Download a single report file once from a bucket.", fr: "Télécharger une seule fois un fichier de rapport depuis un compartiment." } }
    - { id: e, text: { en: "Apply every infrastructure change identically in test and then in production.", fr: "Appliquer chaque modification de l'infrastructure de manière identique en test, puis en production." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Tasks that are performed many times, or that must give identical results in several environments, benefit from a repeatable process such as infrastructure as code: each run produces the same configuration, and changes can be reviewed before they are applied.
    fr: |
      Les tâches effectuées de nombreuses fois, ou qui doivent donner des résultats identiques dans plusieurs environnements, tirent parti d'un processus reproductible comme l'infrastructure as code : chaque exécution produit la même configuration, et les modifications peuvent être relues avant d'être appliquées.
  options:
    a: { en: "A single check of one setting is a one-time operation; automating it adds effort without benefit.", fr: "Une seule vérification d'un paramètre est une opération ponctuelle ; l'automatiser ajoute de l'effort sans bénéfice." }
    c: { en: "A short, exploratory test that is deleted afterward is a one-time activity, which suits the console.", fr: "Un court test exploratoire supprimé ensuite est une activité ponctuelle, adaptée à la console." }
    d: { en: "Downloading one file once is a one-time operation.", fr: "Télécharger un fichier une seule fois est une opération ponctuelle." }
references:
  - title: What is CloudFormation?
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html
