id: clfc02-3a-route53-latency-routing
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs the same web application in three AWS Regions. It wants Amazon Route 53 to send each user to the Region that gives that user the lowest network latency.

    Which Route 53 routing policy should the company use?
  fr: |
    Une entreprise exécute la même application web dans trois Régions AWS. Elle veut qu'Amazon Route 53 envoie chaque utilisateur vers la Région qui lui offre la latence réseau la plus faible.

    Quelle politique de routage Route 53 l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Simple routing", fr: "Routage simple (Simple)" } }
    - { id: b, text: { en: "Weighted routing", fr: "Routage pondéré (Weighted)" } }
    - { id: c, text: { en: "Geolocation routing", fr: "Routage par géolocalisation (Geolocation)" } }
    - { id: d, text: { en: "Latency routing", fr: "Routage basé sur la latence (Latency)" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Latency routing is used when resources run in several AWS Regions and each user should be sent to the Region with the best latency. Route 53 answers each DNS query with the record of the Region that has the lowest latency for that user.
    fr: |
      Le routage basé sur la latence s'utilise quand des ressources s'exécutent dans plusieurs Régions AWS et que chaque utilisateur doit être dirigé vers la Région offrant la meilleure latence. Route 53 répond à chaque requête DNS avec l'enregistrement de la Région qui présente la latence la plus faible pour cet utilisateur.
  options:
    a: { en: "Simple routing is meant for a single resource and does not take each user's latency into account.", fr: "Le routage simple est prévu pour une ressource unique et ne tient pas compte de la latence de chaque utilisateur." }
    b: { en: "Weighted routing splits traffic in set proportions, whatever the latency of each user.", fr: "Le routage pondéré répartit le trafic selon des proportions définies, quelle que soit la latence de chaque utilisateur." }
    c: { en: "Geolocation routing chooses the answer from the user's location (continent or country); the nearest location is not always the one with the lowest latency.", fr: "Le routage par géolocalisation choisit la réponse d'après l'emplacement de l'utilisateur (continent ou pays) ; l'emplacement le plus proche n'est pas toujours celui de plus faible latence." }
references:
  - title: Choosing a routing policy
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html
