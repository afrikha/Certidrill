id: clfc02-3d-redshift-warehouse
objective: "3.7.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants a fully managed, petabyte-scale data warehouse so that its analysts can run complex SQL queries on large volumes of historical sales data.

    Which AWS service meets these requirements?
  fr: |
    Une entreprise veut un entrepôt de données entièrement géré, à l'échelle du pétaoctet, afin que ses analystes puissent exécuter des requêtes SQL complexes sur de gros volumes de données de ventes historiques.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon DynamoDB" }
    - { id: b, text: "Amazon ElastiCache" }
    - { id: c, text: "Amazon Neptune" }
    - { id: d, text: "Amazon Redshift" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Redshift is a fully managed, petabyte-scale data warehouse service in the cloud. It is designed for analytical SQL queries over large datasets and works with business intelligence tools."
    fr: "Amazon Redshift est un service d'entrepôt de données entièrement géré dans le cloud, à l'échelle du pétaoctet. Il est conçu pour des requêtes SQL analytiques sur de grands jeux de données et fonctionne avec les outils de business intelligence."
  options:
    a:
      en: "Amazon DynamoDB is a NoSQL key-value and document database for applications that need fast access by key; it is not a SQL data warehouse."
      fr: "Amazon DynamoDB est une base de données NoSQL clé-valeur et document pour des applications qui ont besoin d'un accès rapide par clé ; ce n'est pas un entrepôt de données SQL."
    b:
      en: "Amazon ElastiCache is an in-memory cache that speeds up applications; it is not designed for analytics on historical data."
      fr: "Amazon ElastiCache est un cache en mémoire qui accélère les applications ; il n'est pas conçu pour l'analytique sur des données historiques."
    c:
      en: "Amazon Neptune is a graph database for highly connected data such as relationships; it is not a data warehouse."
      fr: "Amazon Neptune est une base de données orientée graphe pour des données fortement connectées, comme des relations ; ce n'est pas un entrepôt de données."
references:
  - title: What is Amazon Redshift?
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/welcome.html
