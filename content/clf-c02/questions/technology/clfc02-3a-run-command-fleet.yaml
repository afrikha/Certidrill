id: clfc02-3a-run-command-fleet
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team must run the same configuration script on 200 Amazon EC2 instances and on several on-premises servers. The team does not want to sign in to each server one by one.

    Which AWS service capability will meet these requirements?
  fr: |
    Une équipe d'exploitation doit exécuter le même script de configuration sur 200 instances Amazon EC2 et sur plusieurs serveurs sur site. L'équipe ne veut pas se connecter à chaque serveur l'un après l'autre.

    Quelle fonctionnalité de service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Config rules" }
    - { id: b, text: "AWS Systems Manager Run Command" }
    - { id: c, text: "AWS Trusted Advisor checks" }
    - { id: d, text: "AWS CloudFormation change sets" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Run Command remotely runs commands and scripts on many managed nodes at once, including EC2 instances and on-premises servers that are configured for Systems Manager. It automates administrative tasks and one-time configuration changes at scale without connecting to each server.
    fr: |
      Run Command exécute à distance des commandes et des scripts sur de nombreux nœuds gérés à la fois, y compris des instances EC2 et des serveurs sur site configurés pour Systems Manager. Il automatise les tâches d'administration et les modifications de configuration ponctuelles à grande échelle, sans connexion à chaque serveur.
  options:
    a: { en: "AWS Config rules evaluate whether resource configurations comply with rules; they do not run scripts on servers.", fr: "Les règles AWS Config évaluent la conformité des configurations des ressources ; elles n'exécutent pas de scripts sur les serveurs." }
    c: { en: "Trusted Advisor checks recommend best practices; they do not run anything on instances.", fr: "Les vérifications Trusted Advisor recommandent des bonnes pratiques ; elles n'exécutent rien sur les instances." }
    d: { en: "Change sets preview changes to a CloudFormation stack; they do not run scripts on existing servers, and on-premises servers are not stack resources.", fr: "Les jeux de modifications donnent un aperçu des changements d'une pile CloudFormation ; ils n'exécutent pas de scripts sur des serveurs existants, et les serveurs sur site ne sont pas des ressources de pile." }
references:
  - title: AWS Systems Manager Run Command
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/run-command.html
