id: clfc02-3d-eventbridge-rules
objective: "3.8.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to react automatically to events from AWS services, from its own applications, and from supported SaaS partner applications. Rules must match events by their content and route each matching event to targets such as AWS Lambda functions.

    Which AWS service should the company use?
  fr: |
    Une entreprise veut réagir automatiquement aux événements de services AWS, de ses propres applications et d'applications SaaS partenaires prises en charge. Des règles doivent faire correspondre les événements selon leur contenu et acheminer chaque événement correspondant vers des cibles comme des fonctions AWS Lambda.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon Simple Queue Service (Amazon SQS)" }
    - { id: b, text: "Amazon EventBridge" }
    - { id: c, text: "AWS CloudTrail" }
    - { id: d, text: "AWS Step Functions" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EventBridge is a serverless service that uses events to connect application components. An event bus receives events from AWS services, custom applications, and SaaS partners, and rules with event patterns route the matching events to targets such as Lambda functions."
    fr: "Amazon EventBridge est un service sans serveur qui utilise des événements pour connecter les composants d'une application. Un bus d'événements reçoit les événements de services AWS, d'applications personnalisées et de partenaires SaaS, et des règles dotées de modèles d'événements acheminent les événements correspondants vers des cibles comme des fonctions Lambda."
  options:
    a:
      en: "Amazon SQS queues messages for consumers to poll; it does not match events by content and route them to different targets."
      fr: "Amazon SQS met en file d'attente des messages que les consommateurs interrogent ; il ne fait pas correspondre les événements selon leur contenu pour les acheminer vers différentes cibles."
    c:
      en: "AWS CloudTrail records API activity for auditing; it does not route events from SaaS partners to targets."
      fr: "AWS CloudTrail enregistre l'activité des API à des fins d'audit ; il n'achemine pas les événements de partenaires SaaS vers des cibles."
    d:
      en: "AWS Step Functions coordinates the steps of a workflow that you define; it is not an event bus that receives and routes events."
      fr: "AWS Step Functions coordonne les étapes d'un flux de travail que vous définissez ; ce n'est pas un bus d'événements qui reçoit et achemine des événements."
references:
  - title: What Is Amazon EventBridge?
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html
