id: clfc02-3c-missing-igw-route
objective: "3.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A VPC has an internet gateway attached and two subnets, Subnet A and Subnet B. Instances in both subnets have public IPv4 addresses and use the same security group and network ACL rules. Instances in Subnet A are reachable from the internet, but instances in Subnet B are not.

    What is the MOST likely cause?
  fr: |
    Un VPC dispose d'une passerelle Internet attachée et de deux sous-réseaux, Subnet A et Subnet B. Les instances des deux sous-réseaux ont des adresses IPv4 publiques et utilisent les mêmes règles de groupe de sécurité et d'ACL réseau. Les instances de Subnet A sont accessibles depuis Internet, mais pas celles de Subnet B.

    Quelle est la cause la PLUS probable ?
body:
  options:
    - id: a
      text: { en: "Subnet B is in a different Availability Zone from Subnet A.", fr: "Subnet B se trouve dans une autre zone de disponibilité que Subnet A." }
    - id: b
      text: { en: "Subnet B does not have its own NAT gateway.", fr: "Subnet B ne dispose pas de sa propre passerelle NAT." }
    - id: c
      text: { en: "The internet gateway is attached to Subnet A instead of Subnet B.", fr: "La passerelle Internet est attachée à Subnet A au lieu de Subnet B." }
    - id: d
      text: { en: "Subnet B's route table has no route to the internet gateway.", fr: "La table de routage de Subnet B ne contient pas d'itinéraire vers la passerelle Internet." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Route tables decide where traffic from a subnet goes. A subnet is public only if its route table has a route to an internet gateway, usually 0.0.0.0/0; Subnet B's route table most likely lacks this route, so its traffic never reaches the internet gateway.
    fr: |-
      Les tables de routage déterminent où va le trafic d'un sous-réseau. Un sous-réseau n'est public que si sa table de routage contient un itinéraire vers une passerelle Internet, généralement 0.0.0.0/0 ; la table de routage de Subnet B ne contient très probablement pas cet itinéraire, donc son trafic n'atteint jamais la passerelle Internet.
  options:
    a:
      en: |-
        Public subnets can exist in any Availability Zone; the zone does not decide internet reachability.
      fr: |-
        Des sous-réseaux publics peuvent exister dans n'importe quelle zone de disponibilité ; la zone ne détermine pas l'accessibilité depuis Internet.
    b:
      en: |-
        A NAT gateway is for outbound traffic from private subnets; inbound access to instances with public addresses does not need one.
      fr: |-
        Une passerelle NAT sert au trafic sortant de sous-réseaux privés ; l'accès entrant à des instances dotées d'adresses publiques n'en a pas besoin.
    c:
      en: |-
        An internet gateway is attached to the VPC, not to a subnet; subnets use it through their route tables.
      fr: |-
        Une passerelle Internet est attachée au VPC, et non à un sous-réseau ; les sous-réseaux l'utilisent via leurs tables de routage.
references:
  - title: "Enable internet access for a VPC using an internet gateway - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html
  - title: "What is Amazon VPC? - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html
