id: clfc02-3d-connect-capabilities
objective: "3.8.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is evaluating Amazon Connect for its support team. Which two capabilities does Amazon Connect provide? (Choose two.)
  fr: |
    Une entreprise évalue Amazon Connect pour son équipe de support. Quelles sont les deux capacités fournies par Amazon Connect ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Flows that define the customer experience across voice, chat, and tasks", fr: "Des flux qui définissent l'expérience client pour la voix, le chat et les tâches" } }
    - { id: b, text: { en: "Bulk marketing email sent from the company's own domain", fr: "L'envoi d'e-mails marketing en masse depuis le domaine de l'entreprise" } }
    - { id: c, text: { en: "Queues and routing profiles that send each contact to suitable agents", fr: "Des files d'attente et des profils de routage qui envoient chaque contact aux agents adaptés" } }
    - { id: d, text: { en: "A dedicated private network link between the office and an AWS Region", fr: "Une liaison réseau privée dédiée entre le bureau et une Région AWS" } }
    - { id: e, text: { en: "Virtual Windows desktops streamed to the agents' laptops", fr: "Des bureaux Windows virtuels diffusés sur les ordinateurs portables des agents" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "In Amazon Connect, a flow defines the customer experience across voice, chat, and tasks, for example the menus a caller hears. Queues, routing profiles, and hours of operation decide which agents receive each contact on which channels."
    fr: "Dans Amazon Connect, un flux définit l'expérience client pour la voix, le chat et les tâches, par exemple les menus qu'entend un appelant. Les files d'attente, les profils de routage et les heures d'ouverture déterminent quels agents reçoivent chaque contact et sur quels canaux."
  options:
    b:
      en: "Bulk marketing email from your own domain is sent with Amazon SES."
      fr: "Les e-mails marketing en masse depuis son propre domaine s'envoient avec Amazon SES."
    d:
      en: "A dedicated private network link to an AWS Region is AWS Direct Connect, a networking service unrelated to Amazon Connect."
      fr: "Une liaison réseau privée dédiée vers une Région AWS correspond à AWS Direct Connect, un service réseau sans rapport avec Amazon Connect."
    e:
      en: "Virtual Windows desktops are provided by Amazon WorkSpaces, not by Amazon Connect."
      fr: "Les bureaux Windows virtuels sont fournis par Amazon WorkSpaces, pas par Amazon Connect."
references:
  - title: Get started with Connect Customer
    url: https://docs.aws.amazon.com/connect/latest/adminguide/amazon-connect-get-started.html
