id: clfc02-3a-region-scoped-console
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer launches an Amazon EC2 instance in the us-east-1 Region. Later, the engineer opens the Amazon EC2 console with the eu-west-1 Region selected and does not see the instance.

    What is the reason?
  fr: |
    Un ingénieur lance une instance Amazon EC2 dans la Région us-east-1. Plus tard, il ouvre la console Amazon EC2 avec la Région eu-west-1 sélectionnée et ne voit pas l'instance.

    Quelle en est la raison ?
body:
  options:
    - { id: a, text: { en: "The console lists the resources of the selected Region, and the instance exists only in the Region where it was launched.", fr: "La console affiche les ressources de la Région sélectionnée, et l'instance n'existe que dans la Région où elle a été lancée." } }
    - { id: b, text: { en: "AWS moves running instances to the edge location closest to the engineer.", fr: "AWS déplace les instances en cours d'exécution vers l'emplacement périphérique le plus proche de l'ingénieur." } }
    - { id: c, text: { en: "AWS copies instances to the other Regions only after 24 hours.", fr: "AWS copie les instances vers les autres Régions seulement après 24 heures." } }
    - { id: d, text: { en: "The console hides instances that are in a different Availability Zone from the engineer's location.", fr: "La console masque les instances situées dans une autre zone de disponibilité que celle de l'ingénieur." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Regions are isolated from each other, and resources are created in a specific Region (and, for an instance, in one Availability Zone of that Region). AWS does not replicate resources to other Regions automatically, and the console shows the resources of the Region that is currently selected.
    fr: |
      Les Régions sont isolées les unes des autres, et les ressources sont créées dans une Région précise (et, pour une instance, dans une zone de disponibilité de cette Région). AWS ne réplique pas automatiquement les ressources dans d'autres Régions, et la console affiche les ressources de la Région sélectionnée.
  options:
    b: { en: "Instances do not run in edge locations, and AWS never moves an instance to another location by itself.", fr: "Les instances ne s'exécutent pas dans des emplacements périphériques, et AWS ne déplace jamais une instance de lui-même vers un autre emplacement." }
    c: { en: "AWS never copies resources between Regions automatically; the customer must replicate or copy them.", fr: "AWS ne copie jamais automatiquement les ressources entre Régions ; c'est au client de les répliquer ou de les copier." }
    d: { en: "The console filters by Region, not by the user's position; all Availability Zones of the selected Region are shown.", fr: "La console filtre par Région, pas selon la position de l'utilisateur ; toutes les zones de disponibilité de la Région sélectionnée sont affichées." }
references:
  - title: AWS Regions and Availability Zones
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html
