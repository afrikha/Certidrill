id: clfc02-3d-efs-lifecycle-ia
objective: "3.6.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores project files in an Amazon EFS file system. Most files are rarely opened after their first month. The company wants to reduce storage costs automatically while users keep opening every file from the same path.

    Which solution meets these requirements?
  fr: |
    Une entreprise stocke des fichiers de projets dans un système de fichiers Amazon EFS. La plupart des fichiers sont rarement ouverts après leur premier mois. L'entreprise veut réduire automatiquement ses coûts de stockage, tandis que les utilisateurs continuent d'ouvrir chaque fichier depuis le même chemin.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an S3 Lifecycle rule that moves the files to S3 Standard-IA after 30 days.", fr: "Créer une règle S3 Lifecycle qui déplace les fichiers vers S3 Standard-IA après 30 jours." } }
    - { id: b, text: { en: "Use AWS Backup to copy the files to a backup vault, then delete them from the file system.", fr: "Utiliser AWS Backup pour copier les fichiers dans un coffre de sauvegarde, puis les supprimer du système de fichiers." } }
    - { id: c, text: { en: "Configure EFS lifecycle management to move files that are not accessed for 30 days to the Infrequent Access storage class.", fr: "Configurer la gestion du cycle de vie EFS pour déplacer vers la classe de stockage Infrequent Access les fichiers non consultés depuis 30 jours." } }
    - { id: d, text: { en: "Move the files to an Amazon EBS Cold HDD (sc1) volume attached to an EC2 file server.", fr: "Déplacer les fichiers vers un volume Amazon EBS Cold HDD (sc1) attaché à un serveur de fichiers EC2." } }
answer: { optionId: c }
explanation:
  correct:
    en: "EFS lifecycle management moves files that have not been accessed for a set period to a lower-cost storage class: Infrequent Access for data used a few times a quarter, or Archive for data used a few times a year or less. Metadata stays in Standard, so files remain visible and readable at the same path."
    fr: "La gestion du cycle de vie EFS déplace les fichiers non consultés depuis une durée donnée vers une classe de stockage moins chère : Infrequent Access pour des données utilisées quelques fois par trimestre, ou Archive pour des données utilisées quelques fois par an ou moins. Les métadonnées restent dans Standard ; les fichiers restent donc visibles et lisibles au même chemin."
  options:
    a:
      en: "S3 Lifecycle rules apply to objects in S3 buckets, not to files in an EFS file system."
      fr: "Les règles S3 Lifecycle s'appliquent aux objets des compartiments S3, pas aux fichiers d'un système de fichiers EFS."
    b:
      en: "Deleting the files after a backup means users must restore them before opening them; they are no longer available at the same path."
      fr: "Supprimer les fichiers après une sauvegarde oblige les utilisateurs à les restaurer avant de les ouvrir ; ils ne sont plus disponibles au même chemin."
    d:
      en: "Moving files to an EBS volume on a self-managed file server changes the access path and adds a server to manage; it is not an automatic cost optimization."
      fr: "Déplacer les fichiers vers un volume EBS sur un serveur de fichiers autogéré change le chemin d'accès et ajoute un serveur à gérer ; ce n'est pas une optimisation automatique des coûts."
references:
  - title: Managing storage lifecycle
    url: https://docs.aws.amazon.com/efs/latest/ug/lifecycle-management-efs.html
