id: clfc02-3b-dbhost-patching-shift
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a MySQL database that it installed on an Amazon EC2 instance. The company is considering moving the database to Amazon RDS for MySQL.

    Which task is the company's responsibility with the database on Amazon EC2 but is handled by AWS with Amazon RDS?
  fr: |
    Une entreprise exécute une base de données MySQL qu'elle a installée sur une instance Amazon EC2. L'entreprise envisage de déplacer la base de données vers Amazon RDS for MySQL.

    Quelle tâche relève de la responsabilité de l'entreprise avec la base de données sur Amazon EC2, mais est prise en charge par AWS avec Amazon RDS ?
body:
  options:
    - { id: a, text: { en: "Designing the tables and indexes of the database", fr: "Concevoir les tables et les index de la base de données" } }
    - { id: b, text: { en: "Patching the operating system and the database software", fr: "Appliquer les correctifs au système d'exploitation et au logiciel de base de données" } }
    - { id: c, text: { en: "Securing the physical data centers that host the servers", fr: "Sécuriser les centres de données physiques qui hébergent les serveurs" } }
    - { id: d, text: { en: "Deciding which users can read the data in the database", fr: "Décider quels utilisateurs peuvent lire les données de la base" } }
answer: { optionId: b }
explanation:
  correct:
    en: "On Amazon EC2, the customer manages the guest operating system and the database software, including patches. Amazon RDS is a managed service: AWS handles operating system and database software patching and installation, and applies maintenance during a weekly maintenance window."
    fr: "Sur Amazon EC2, le client gère le système d'exploitation invité et le logiciel de base de données, y compris les correctifs. Amazon RDS est un service géré : AWS prend en charge l'installation et les correctifs du système d'exploitation et du logiciel de base de données, et applique la maintenance pendant une fenêtre de maintenance hebdomadaire."
  options:
    a:
      en: "Schema and index design remain the customer's responsibility with both EC2 and RDS."
      fr: "La conception du schéma et des index reste de la responsabilité du client avec EC2 comme avec RDS."
    c:
      en: "Physical security of the data centers is AWS's responsibility in both cases, so nothing changes."
      fr: "La sécurité physique des centres de données est de la responsabilité d'AWS dans les deux cas : rien ne change."
    d:
      en: "Controlling access to the data stays with the customer whether the database runs on EC2 or on RDS."
      fr: "Le contrôle de l'accès aux données reste au client, que la base s'exécute sur EC2 ou sur RDS."
references:
  - title: What is Amazon Relational Database Service (Amazon RDS)?
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html
  - title: Maintaining a DB instance
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Maintenance.html
