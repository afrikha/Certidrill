id: clfc02-3e-amplify-hosting-purpose
objective: "3.8.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is AWS Amplify Hosting used for?
  fr: |
    À quoi sert AWS Amplify Hosting ?
body:
  options:
    - { id: a, text: { en: "Deploying web apps continuously from a Git repository through a CDN", fr: "Déployer en continu des applications web à partir d'un dépôt Git via un CDN" } }
    - { id: b, text: { en: "Streaming Windows desktop applications to users' devices", fr: "Diffuser des applications de bureau Windows vers les appareils des utilisateurs" } }
    - { id: c, text: { en: "Running Kubernetes containers on managed control planes", fr: "Exécuter des conteneurs Kubernetes sur des plans de contrôle gérés" } }
    - { id: d, text: { en: "Connecting IoT devices to cloud applications over MQTT", fr: "Connecter des appareils IoT à des applications cloud via MQTT" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amplify Hosting provides a Git-based workflow to host web apps with continuous deployment: you connect a repository, and each change is built and deployed, then served through the AWS global content delivery network."
    fr: "Amplify Hosting fournit un flux de travail basé sur Git pour héberger des applications web avec un déploiement continu : vous connectez un dépôt, puis chaque modification est générée et déployée, et diffusée au moyen du réseau mondial de diffusion de contenu d'AWS."
  options:
    b:
      en: "Streaming desktop applications is the role of Amazon AppStream 2.0 (Amazon WorkSpaces Applications)."
      fr: "La diffusion d'applications de bureau en streaming est le rôle d'Amazon AppStream 2.0 (Amazon WorkSpaces Applications)."
    c:
      en: "Running Kubernetes with a managed control plane is the role of Amazon EKS."
      fr: "L'exécution de Kubernetes avec un plan de contrôle géré est le rôle d'Amazon EKS."
    d:
      en: "Connecting devices over MQTT is the role of AWS IoT Core."
      fr: "La connexion d'appareils via MQTT est le rôle d'AWS IoT Core."
references:
  - title: Welcome to AWS Amplify Hosting
    url: https://docs.aws.amazon.com/amplify/latest/userguide/welcome.html
