id: clfc02-3c-nat-gateway-outbound
objective: "3.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon EC2 instances in a private subnet must download software updates from the internet. The instances must not accept connections that are initiated from the internet.

    Which VPC component will meet these requirements?
  fr: |
    Des instances Amazon EC2 d'un sous-réseau privé doivent télécharger des mises à jour logicielles depuis Internet. Les instances ne doivent pas accepter de connexions initiées depuis Internet.

    Quel composant de VPC répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "A public NAT gateway in a public subnet", fr: "Une passerelle NAT publique dans un sous-réseau public" }
    - id: b
      text: { en: "A route from the private subnet to an internet gateway", fr: "Un itinéraire du sous-réseau privé vers une passerelle Internet" }
    - id: c
      text: { en: "A virtual private gateway attached to the VPC", fr: "Une passerelle privée virtuelle attachée au VPC" }
    - id: d
      text: { en: "A VPC peering connection to another VPC", fr: "Une connexion d'appairage de VPC vers un autre VPC" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A NAT gateway lets instances in a private subnet connect to services outside the VPC, while external services cannot initiate connections to those instances. A public NAT gateway is created in a public subnet with an Elastic IP address and sends traffic to the internet through the VPC's internet gateway.
    fr: |-
      Une passerelle NAT permet aux instances d'un sous-réseau privé de se connecter à des services extérieurs au VPC, sans que ces services puissent initier de connexions vers les instances. Une passerelle NAT publique est créée dans un sous-réseau public avec une adresse IP Elastic et envoie le trafic vers Internet via la passerelle Internet du VPC.
  options:
    b:
      en: |-
        A route to an internet gateway turns the subnet into a public subnet, and instances with public addresses could then receive connections from the internet.
      fr: |-
        Un itinéraire vers une passerelle Internet fait du sous-réseau un sous-réseau public, et des instances dotées d'adresses publiques pourraient alors recevoir des connexions depuis Internet.
    c:
      en: |-
        A virtual private gateway is the AWS-side endpoint of a Site-to-Site VPN to an on-premises network, not an exit to the internet.
      fr: |-
        Une passerelle privée virtuelle est le point de terminaison côté AWS d'un Site-to-Site VPN vers un réseau sur site, et non une sortie vers Internet.
    d:
      en: |-
        A peering connection routes traffic between two VPCs privately; it does not provide internet access.
      fr: |-
        Une connexion d'appairage achemine le trafic entre deux VPC de façon privée ; elle ne fournit pas d'accès à Internet.
references:
  - title: "NAT gateways - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
