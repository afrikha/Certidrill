id: clfc02-3c-documentdb-mongodb
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application on a self-managed MongoDB cluster in its data center. It wants to move the database to a fully managed AWS service and keep the same application code, drivers and tools.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise exécute une application sur un cluster MongoDB autogéré dans son centre de données. Elle souhaite déplacer la base de données vers un service AWS entièrement géré tout en conservant le même code d'application, les mêmes pilotes et les mêmes outils.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon DocumentDB (with MongoDB compatibility)", fr: "Amazon DocumentDB (avec compatibilité MongoDB)" }
    - id: b
      text: { en: "Amazon DynamoDB", fr: "Amazon DynamoDB" }
    - id: c
      text: { en: "Amazon Neptune", fr: "Amazon Neptune" }
    - id: d
      text: { en: "Amazon RDS for PostgreSQL", fr: "Amazon RDS for PostgreSQL" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon DocumentDB is a fully managed, MongoDB-compatible NoSQL document database. Applications can keep the same code, drivers and tools they use with MongoDB, while AWS manages the cluster, replication across three Availability Zones and backups.
    fr: |-
      Amazon DocumentDB est une base de données documentaire NoSQL entièrement gérée et compatible avec MongoDB. Les applications conservent le code, les pilotes et les outils qu'elles utilisent avec MongoDB, tandis qu'AWS gère le cluster, la réplication sur trois zones de disponibilité et les sauvegardes.
  options:
    b:
      en: |-
        DynamoDB is a NoSQL key-value and document database, but it has its own API: the MongoDB code and drivers would have to be rewritten.
      fr: |-
        DynamoDB est une base NoSQL clé-valeur et document, mais elle possède sa propre API : le code et les pilotes MongoDB devraient être réécrits.
    c:
      en: |-
        Neptune is a graph database queried with Gremlin, openCypher or SPARQL, not a MongoDB-compatible document database.
      fr: |-
        Neptune est une base de données orientée graphe interrogée avec Gremlin, openCypher ou SPARQL, et non une base documentaire compatible avec MongoDB.
    d:
      en: |-
        RDS for PostgreSQL is a relational database; it is not compatible with MongoDB drivers.
      fr: |-
        RDS for PostgreSQL est une base de données relationnelle ; elle n'est pas compatible avec les pilotes MongoDB.
references:
  - title: "What is Amazon DocumentDB (with MongoDB compatibility) - Amazon DocumentDB"
    url: https://docs.aws.amazon.com/documentdb/latest/developerguide/what-is.html
