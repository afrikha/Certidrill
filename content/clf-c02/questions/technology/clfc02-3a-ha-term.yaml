id: clfc02-3a-ha-term
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants its application to keep running with minimal downtime when a server or a data center fails.

    Which cloud concept describes this requirement?
  fr: |
    Une entreprise veut que son application continue de fonctionner avec un temps d'arrêt minimal en cas de panne d'un serveur ou d'un centre de données.

    Quel concept du cloud décrit ce besoin ?
body:
  options:
    - { id: a, text: { en: "Elasticity", fr: "Élasticité" } }
    - { id: b, text: { en: "Agility", fr: "Agilité" } }
    - { id: c, text: { en: "Economies of scale", fr: "Économies d'échelle" } }
    - { id: d, text: { en: "High availability", fr: "Haute disponibilité" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      High availability means that a workload stays available and keeps serving users when one of its components fails. On AWS, it is achieved by running redundant resources in multiple Availability Zones so that a failure in one location does not stop the application.
    fr: |
      La haute disponibilité signifie qu'une charge de travail reste disponible et continue de servir les utilisateurs quand l'un de ses composants tombe en panne. Sur AWS, elle s'obtient en exécutant des ressources redondantes dans plusieurs zones de disponibilité, afin qu'une panne à un endroit n'arrête pas l'application.
  options:
    a: { en: "Elasticity is the ability to add and remove capacity automatically as demand changes, not to survive failures.", fr: "L'élasticité est la capacité à ajouter et retirer automatiquement de la capacité selon la demande, pas à résister aux pannes." }
    b: { en: "Agility is the speed at which new resources and ideas can be tried and deployed.", fr: "L'agilité est la rapidité avec laquelle de nouvelles ressources et idées peuvent être testées et déployées." }
    c: { en: "Economies of scale lower prices because AWS aggregates usage from many customers; they are not about failures.", fr: "Les économies d'échelle font baisser les prix parce qu'AWS agrège l'usage de nombreux clients ; elles ne concernent pas les pannes." }
references:
  - title: AWS Regions and Availability Zones
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html
