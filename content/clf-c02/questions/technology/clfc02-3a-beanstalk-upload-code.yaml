id: clfc02-3a-beanstalk-upload-code
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A small development team wants to deploy a web application by uploading its code. AWS must provision the capacity, load balancing, scaling, and health monitoring for the team.

    Which AWS service will meet these requirements?
  fr: |
    Une petite équipe de développement veut déployer une application web en chargeant son code. AWS doit mettre en service la capacité, l'équilibrage de charge, la mise à l'échelle et la surveillance de l'état à la place de l'équipe.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS CodeBuild" }
    - { id: b, text: "AWS Systems Manager" }
    - { id: c, text: "AWS Elastic Beanstalk" }
    - { id: d, text: "AWS CloudFormation" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With Elastic Beanstalk, you upload your application code and the service provisions the EC2 instances, configures load balancing, scales the environment, and sets up health monitoring. There is no extra charge for Elastic Beanstalk itself; you pay only for the resources that the application uses.
    fr: |
      Avec Elastic Beanstalk, vous chargez le code de l'application et le service met en service les instances EC2, configure l'équilibrage de charge, met l'environnement à l'échelle et configure la surveillance de l'état. Elastic Beanstalk n'entraîne aucun coût supplémentaire : vous payez uniquement les ressources utilisées par l'application.
  options:
    a: { en: "CodeBuild compiles source code and runs tests; it does not host the application or manage its load balancing and scaling.", fr: "CodeBuild compile le code source et exécute des tests ; il n'héberge pas l'application et ne gère ni son équilibrage de charge ni sa mise à l'échelle." }
    b: { en: "Systems Manager helps operate and configure existing servers; it does not deploy a web application from uploaded code.", fr: "Systems Manager aide à exploiter et à configurer des serveurs existants ; il ne déploie pas une application web à partir du code chargé." }
    d: { en: "CloudFormation provisions the resources described in a template that the team must write; it does not deploy the application from its code alone.", fr: "CloudFormation met en service les ressources décrites dans un modèle que l'équipe doit écrire ; il ne déploie pas l'application à partir de son seul code." }
references:
  - title: What is AWS Elastic Beanstalk?
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html
