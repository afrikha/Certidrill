id: clfc02-3b-ec2-memory-optimized
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a self-managed in-memory database on Amazon EC2. The database must hold a very large data set entirely in RAM to answer queries quickly.

    Which Amazon EC2 instance category should the company choose?
  fr: |
    Une entreprise exécute une base de données en mémoire autogérée sur Amazon EC2. La base de données doit conserver un très grand jeu de données entièrement en RAM pour répondre rapidement aux requêtes.

    Quelle catégorie d'instances Amazon EC2 l'entreprise doit-elle choisir ?
body:
  options:
    - { id: a, text: { en: "Compute optimized", fr: "Optimisée pour le calcul" } }
    - { id: b, text: { en: "Accelerated computing", fr: "Calcul accéléré" } }
    - { id: c, text: { en: "Memory optimized", fr: "Optimisée pour la mémoire" } }
    - { id: d, text: { en: "Storage optimized", fr: "Optimisée pour le stockage" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Memory optimized instances, such as the R and X families, are designed to deliver fast performance for workloads that process large data sets in memory. Typical uses include in-memory databases and data analytics."
    fr: "Les instances optimisées pour la mémoire, comme les familles R et X, sont conçues pour offrir des performances rapides aux charges de travail qui traitent de grands jeux de données en mémoire. Les usages typiques sont les bases de données en mémoire et l'analytique de données."
  options:
    a:
      en: "Compute optimized instances are designed for compute-intensive applications that need high-performance processors, not for holding large data sets in memory."
      fr: "Les instances optimisées pour le calcul sont conçues pour les applications gourmandes en calcul qui ont besoin de processeurs hautes performances, pas pour conserver de grands jeux de données en mémoire."
    b:
      en: "Accelerated computing instances add hardware accelerators such as GPUs; they do not target holding large data sets in RAM."
      fr: "Les instances de calcul accéléré ajoutent des accélérateurs matériels comme des GPU ; elles ne visent pas à conserver de grands jeux de données en RAM."
    d:
      en: "Storage optimized instances are built for fast access to large data sets on local disks, not for keeping the data set in memory."
      fr: "Les instances optimisées pour le stockage sont conçues pour un accès rapide à de grands jeux de données sur disques locaux, pas pour conserver le jeu de données en mémoire."
references:
  - title: Specifications for Amazon EC2 memory optimized instances
    url: https://docs.aws.amazon.com/ec2/latest/instancetypes/mo.html
