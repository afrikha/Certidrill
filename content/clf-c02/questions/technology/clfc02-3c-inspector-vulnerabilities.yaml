id: clfc02-3c-inspector-vulnerabilities
objective: "3.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to automatically and continuously scan its Amazon EC2 instances, container images in Amazon ECR and AWS Lambda functions for known software vulnerabilities (CVEs) and unintended network exposure.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise souhaite analyser automatiquement et en continu ses instances Amazon EC2, ses images de conteneur dans Amazon ECR et ses fonctions AWS Lambda pour détecter des vulnérabilités logicielles connues (CVE) et une exposition réseau non prévue.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
    - id: b
      text: { en: "Amazon Macie", fr: "Amazon Macie" }
    - id: c
      text: { en: "AWS Shield", fr: "AWS Shield" }
    - id: d
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Amazon Inspector is a vulnerability management service that discovers EC2 instances, ECR container images and Lambda functions and scans them continuously for CVEs and unintended network exposure. It rescans when something changes, such as a new package or a newly published CVE, and creates findings with remediation advice.
    fr: |-
      Amazon Inspector est un service de gestion des vulnérabilités qui découvre les instances EC2, les images de conteneur ECR et les fonctions Lambda, et les analyse en continu pour détecter des CVE et une exposition réseau non prévue. Il relance l'analyse en cas de changement, comme un nouveau package ou une CVE nouvellement publiée, et crée des résultats assortis de recommandations de correction.
  options:
    a:
      en: |-
        GuardDuty detects threats from activity such as logs and network traffic; it does not scan software packages for CVEs.
      fr: |-
        GuardDuty détecte des menaces à partir de l'activité, comme les journaux et le trafic réseau ; il n'analyse pas les packages logiciels pour détecter des CVE.
    b:
      en: |-
        Macie discovers sensitive data in Amazon S3; it does not scan instances or images.
      fr: |-
        Macie découvre des données sensibles dans Amazon S3 ; il n'analyse ni les instances ni les images.
    c:
      en: |-
        Shield protects applications against DDoS attacks; it does not look for software vulnerabilities.
      fr: |-
        Shield protège les applications contre les attaques DDoS ; il ne recherche pas de vulnérabilités logicielles.
references:
  - title: "What is Amazon Inspector? - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html
