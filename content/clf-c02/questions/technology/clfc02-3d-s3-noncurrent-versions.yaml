id: clfc02-3d-s3-noncurrent-versions
objective: "3.6.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company enabled S3 Versioning on a bucket to recover from accidental overwrites. Storage costs keep growing because old versions of objects accumulate. The company wants to delete object versions automatically 60 days after they become noncurrent.

    What should the company do?
  fr: |
    Une entreprise a activé S3 Versioning sur un compartiment pour récupérer les objets remplacés par erreur. Les coûts de stockage ne cessent d'augmenter, car les anciennes versions des objets s'accumulent. L'entreprise veut supprimer automatiquement les versions d'objets 60 jours après qu'elles sont devenues non actuelles.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Suspend S3 Versioning on the bucket.", fr: "Suspendre S3 Versioning sur le compartiment." } }
    - { id: b, text: { en: "Enable S3 Object Lock with a 60-day retention period.", fr: "Activer S3 Object Lock avec une période de rétention de 60 jours." } }
    - { id: c, text: { en: "Change the default storage class of new objects to S3 Intelligent-Tiering.", fr: "Remplacer la classe de stockage par défaut des nouveaux objets par S3 Intelligent-Tiering." } }
    - { id: d, text: { en: "Add an S3 Lifecycle rule that expires noncurrent versions 60 days after they become noncurrent.", fr: "Ajouter une règle S3 Lifecycle qui fait expirer les versions non actuelles 60 jours après qu'elles sont devenues non actuelles." } }
answer: { optionId: d }
explanation:
  correct:
    en: "In a versioned bucket, an S3 Lifecycle rule can include a noncurrent version expiration action that permanently deletes versions a set number of days after they become noncurrent. The current versions stay untouched, so the bucket keeps protecting recent overwrites."
    fr: "Dans un compartiment avec gestion des versions, une règle S3 Lifecycle peut contenir une action d'expiration des versions non actuelles, qui supprime définitivement les versions un nombre donné de jours après qu'elles sont devenues non actuelles. Les versions actuelles ne sont pas modifiées ; le compartiment continue donc de protéger contre les remplacements récents."
  options:
    a:
      en: "Suspending versioning stops new versions from being created but keeps every existing version, and it removes the protection the company wanted."
      fr: "Suspendre la gestion des versions empêche la création de nouvelles versions, mais conserve toutes les versions existantes et supprime la protection voulue par l'entreprise."
    b:
      en: "S3 Object Lock prevents versions from being deleted during the retention period; it never deletes them."
      fr: "S3 Object Lock empêche la suppression des versions pendant la période de rétention ; il ne les supprime jamais."
    c:
      en: "S3 Intelligent-Tiering lowers the storage price of infrequently accessed data but still keeps every noncurrent version."
      fr: "S3 Intelligent-Tiering réduit le prix de stockage des données peu consultées, mais conserve toutes les versions non actuelles."
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
