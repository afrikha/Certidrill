id: clfc02-3d-ses-transactional
objective: "3.8.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online store wants its application to send order confirmations and monthly newsletters to customers from the store's own email domain, without running its own email servers.

    Which AWS service should the store use?
  fr: |
    Une boutique en ligne veut que son application envoie des confirmations de commande et des newsletters mensuelles aux clients depuis le domaine de messagerie de la boutique, sans exploiter ses propres serveurs de messagerie.

    Quel service AWS la boutique doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon Simple Queue Service (Amazon SQS)" }
    - { id: b, text: "Amazon Connect" }
    - { id: c, text: "Amazon EventBridge" }
    - { id: d, text: "Amazon Simple Email Service (Amazon SES)" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon SES is an email platform for sending and receiving email with your own email addresses and domains. Applications use it for transactional email such as order confirmations and for marketing email such as newsletters, without managing email servers, and pay based on the volume of email."
    fr: "Amazon SES est une plateforme de messagerie qui permet d'envoyer et de recevoir des e-mails avec vos propres adresses et domaines. Les applications l'utilisent pour des e-mails transactionnels comme les confirmations de commande et pour des e-mails marketing comme les newsletters, sans gérer de serveurs de messagerie, et paient selon le volume d'e-mails."
  options:
    a:
      en: "Amazon SQS queues messages between application components; it does not deliver email to customers."
      fr: "Amazon SQS met en file d'attente des messages entre composants d'application ; il ne livre pas d'e-mails aux clients."
    b:
      en: "Amazon Connect is a cloud contact center for customer calls and chats, not a service for sending newsletters from an application."
      fr: "Amazon Connect est un centre de contact cloud pour les appels et les discussions des clients, pas un service d'envoi de newsletters depuis une application."
    c:
      en: "Amazon EventBridge routes events between applications and services; it does not send email from a company's domain."
      fr: "Amazon EventBridge achemine des événements entre applications et services ; il n'envoie pas d'e-mails depuis le domaine d'une entreprise."
references:
  - title: What is Amazon SES?
    url: https://docs.aws.amazon.com/ses/latest/dg/Welcome.html
