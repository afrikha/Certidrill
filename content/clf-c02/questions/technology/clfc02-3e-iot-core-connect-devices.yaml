id: clfc02-3e-iot-core-connect-devices
objective: "3.8.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturer wants its smart home devices to connect securely to the AWS Cloud and exchange messages with cloud applications.

    Which AWS service should the manufacturer use?
  fr: |
    Un fabricant souhaite que ses appareils domestiques connectés se connectent de manière sécurisée au Cloud AWS et échangent des messages avec des applications cloud.

    Quel service AWS le fabricant doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "Amazon Connect", fr: "Amazon Connect" } }
    - { id: b, text: { en: "AWS Direct Connect", fr: "AWS Direct Connect" } }
    - { id: c, text: { en: "Amazon Kinesis Data Streams", fr: "Amazon Kinesis Data Streams" } }
    - { id: d, text: { en: "AWS IoT Core", fr: "AWS IoT Core" } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS IoT Core is a managed service that connects IoT devices to cloud applications, other devices and AWS services. Its device gateway secures communication with X.509 certificates, and its message broker lets devices and applications publish and subscribe to messages."
    fr: "AWS IoT Core est un service géré qui connecte des appareils IoT à des applications cloud, à d'autres appareils et à des services AWS. Sa passerelle d'appareils sécurise les communications avec des certificats X.509, et son agent de messages permet aux appareils et aux applications de publier des messages et de s'y abonner."
  options:
    a:
      en: "Amazon Connect is a cloud contact center service for customer calls and chats, not for devices."
      fr: "Amazon Connect est un service de centre de contact cloud pour les appels et les discussions des clients, pas pour les appareils."
    b:
      en: "Direct Connect is a dedicated network connection from a data center to AWS; it does not connect and manage IoT devices."
      fr: "Direct Connect est une connexion réseau dédiée entre un centre de données et AWS ; il ne connecte pas et ne gère pas d'appareils IoT."
    c:
      en: "Kinesis Data Streams ingests streaming data, but it does not provide device authentication or two-way messaging with devices."
      fr: "Kinesis Data Streams ingère des données en streaming, mais il ne fournit ni authentification des appareils ni messagerie bidirectionnelle avec eux."
references:
  - title: What is AWS IoT?
    url: https://docs.aws.amazon.com/iot/latest/developerguide/what-is-aws-iot.html
