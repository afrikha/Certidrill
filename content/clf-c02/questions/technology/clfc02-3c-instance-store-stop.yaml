id: clfc02-3c-instance-store-stop
objective: "3.6.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer stores files on an EC2 instance store volume.

    Which statement about the instance store is correct?
  fr: |
    Un développeur stocke des fichiers sur un volume de stockage d'instance EC2.

    Quelle affirmation sur le stockage d'instance est correcte ?
body:
  options:
    - id: a
      text: { en: "Its data persists after the instance is stopped and started.", fr: "Ses données persistent après l'arrêt puis le démarrage de l'instance." }
    - id: b
      text: { en: "It can be detached and attached to another instance.", fr: "Il peut être détaché puis attaché à une autre instance." }
    - id: c
      text: { en: "Its data is lost when the instance is stopped or terminated.", fr: "Ses données sont perdues lorsque l'instance est arrêtée ou résiliée." }
    - id: d
      text: { en: "It is billed per GB-month in addition to the instance.", fr: "Il est facturé par Go-mois en plus de l'instance." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Instance store provides temporary block-level storage on disks physically attached to the host. Its data survives a reboot but is lost when the instance is stopped, hibernated or terminated, or when the underlying disk fails.
    fr: |-
      Le stockage d'instance fournit un stockage temporaire au niveau bloc sur des disques physiquement attachés à l'hôte. Ses données survivent à un redémarrage, mais sont perdues lorsque l'instance est arrêtée, mise en veille prolongée ou résiliée, ou lorsque le disque sous-jacent tombe en panne.
  options:
    a:
      en: |-
        Instance store data survives only a reboot; stopping the instance erases it. Persistent data belongs on Amazon EBS.
      fr: |-
        Les données du stockage d'instance ne survivent qu'à un redémarrage ; l'arrêt de l'instance les efface. Les données persistantes relèvent d'Amazon EBS.
    b:
      en: |-
        Instance store volumes are tied to the host and cannot be detached and attached to another instance.
      fr: |-
        Les volumes de stockage d'instance sont liés à l'hôte et ne peuvent pas être détachés puis attachés à une autre instance.
    d:
      en: |-
        Instance store volumes are included in the instance's usage cost.
      fr: |-
        Les volumes de stockage d'instance sont inclus dans le coût d'utilisation de l'instance.
references:
  - title: "Instance store temporary block storage for EC2 instances - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html
