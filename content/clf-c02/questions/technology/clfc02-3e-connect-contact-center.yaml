id: clfc02-3e-connect-contact-center
objective: "3.8.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company wants to set up a cloud contact center in which agents answer customer phone calls and chats. The company wants to pay only for what it uses.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise de distribution souhaite mettre en place un centre de contact cloud dans lequel des agents répondent aux appels téléphoniques et aux discussions des clients. L'entreprise veut payer uniquement ce qu'elle utilise.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon Connect", fr: "Amazon Connect" } }
    - { id: b, text: { en: "Amazon Simple Email Service (Amazon SES)", fr: "Amazon Simple Email Service (Amazon SES)" } }
    - { id: c, text: { en: "Amazon WorkSpaces", fr: "Amazon WorkSpaces" } }
    - { id: d, text: { en: "Amazon Simple Notification Service (Amazon SNS)", fr: "Amazon Simple Notification Service (Amazon SNS)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Connect, which AWS now documents as Amazon Connect Customer, is a contact center as a service solution. Agents handle customers over voice, chat, SMS and other channels, administrators provision phone numbers and define queues and routing, and the company pays only for what it uses."
    fr: "Amazon Connect, qu'AWS documente désormais sous le nom Amazon Connect Customer, est une solution de centre de contact en tant que service. Les agents traitent les clients par la voix, le chat, les SMS et d'autres canaux, les administrateurs provisionnent des numéros de téléphone et définissent des files d'attente et le routage, et l'entreprise ne paie que ce qu'elle utilise."
  options:
    b:
      en: "SES sends and receives email; it does not route phone calls and chats to agents."
      fr: "SES envoie et reçoit des e-mails ; il n'achemine pas d'appels téléphoniques ni de discussions vers des agents."
    c:
      en: "WorkSpaces could give agents virtual desktops, but it provides no telephony, queues or call routing."
      fr: "WorkSpaces pourrait fournir des bureaux virtuels aux agents, mais il ne fournit ni téléphonie, ni files d'attente, ni routage des appels."
    d:
      en: "SNS sends one-way notifications to subscribers; it is not a contact center."
      fr: "SNS envoie des notifications unidirectionnelles à des abonnés ; ce n'est pas un centre de contact."
references:
  - title: What is Connect Customer?
    url: https://docs.aws.amazon.com/connect/latest/adminguide/what-is-amazon-connect.html
