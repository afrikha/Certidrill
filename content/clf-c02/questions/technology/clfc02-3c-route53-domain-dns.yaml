id: clfc02-3c-route53-domain-dns
objective: "3.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup wants to register a domain name for its new website, route visitors' requests for that domain to its web servers, and stop sending traffic to a server that becomes unavailable.

    Which AWS service will meet these requirements?
  fr: |
    Une start-up souhaite enregistrer un nom de domaine pour son nouveau site web, acheminer les requêtes des visiteurs pour ce domaine vers ses serveurs web et cesser d'envoyer du trafic à un serveur qui devient indisponible.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon Route 53", fr: "Amazon Route 53" }
    - id: b
      text: { en: "Amazon CloudFront", fr: "Amazon CloudFront" }
    - id: c
      text: { en: "Amazon API Gateway", fr: "Amazon API Gateway" }
    - id: d
      text: { en: "AWS Global Accelerator", fr: "AWS Global Accelerator" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon Route 53 is a highly available and scalable DNS web service with three main functions: domain registration, DNS routing of internet traffic to resources, and health checking. Health checks let Route 53 route traffic away from unhealthy resources.
    fr: |-
      Amazon Route 53 est un service web DNS hautement disponible et évolutif qui assure trois fonctions principales : l'enregistrement de domaines, le routage DNS du trafic Internet vers les ressources et la vérification de l'état. Les vérifications de l'état permettent à Route 53 de détourner le trafic des ressources défaillantes.
  options:
    b:
      en: |-
        CloudFront caches and delivers content from edge locations; it does not register domain names.
      fr: |-
        CloudFront met en cache et distribue du contenu depuis des emplacements périphériques ; il n'enregistre pas de noms de domaine.
    c:
      en: |-
        API Gateway creates and manages APIs for applications; it does not register domains or act as a DNS service.
      fr: |-
        API Gateway crée et gère des API pour les applications ; il n'enregistre pas de domaines et n'est pas un service DNS.
    d:
      en: |-
        Global Accelerator provides static IP addresses that route to healthy endpoints, but it does not register domain names or host DNS records.
      fr: |-
        Global Accelerator fournit des adresses IP statiques qui acheminent vers des points de terminaison sains, mais il n'enregistre pas de noms de domaine et n'héberge pas d'enregistrements DNS.
references:
  - title: "What is Amazon Route 53? - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/Welcome.html
