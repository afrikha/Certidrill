id: clfc02-3b-regions-user-latency
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company hosts a web application in a single AWS Region in North America. The company has gained many users in Asia, who report slow response times for the application's dynamic, personalized pages.

    What should the company do to reduce latency for these users?
  fr: |
    Une entreprise héberge une application web dans une seule Région AWS en Amérique du Nord. L'entreprise a gagné de nombreux utilisateurs en Asie, qui signalent des temps de réponse lents pour les pages dynamiques et personnalisées de l'application.

    Que doit faire l'entreprise pour réduire la latence pour ces utilisateurs ?
body:
  options:
    - { id: a, text: { en: "Add an Availability Zone to the application in the current Region.", fr: "Ajouter une zone de disponibilité à l'application dans la Région actuelle." } }
    - { id: b, text: { en: "Move the application to larger Amazon EC2 instance types in the current Region.", fr: "Passer l'application à des types d'instance Amazon EC2 plus grands dans la Région actuelle." } }
    - { id: c, text: { en: "Turn on Multi-AZ for the application's Amazon RDS database.", fr: "Activer Multi-AZ pour la base de données Amazon RDS de l'application." } }
    - { id: d, text: { en: "Deploy the application in an additional Region located in Asia.", fr: "Déployer l'application dans une Région supplémentaire située en Asie." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Network latency grows with the distance between users and the Region that serves them. Running the application in a Region close to the users in Asia shortens that distance for every request, which is a typical reason to use more than one Region."
    fr: "La latence réseau augmente avec la distance entre les utilisateurs et la Région qui les sert. Exécuter l'application dans une Région proche des utilisateurs d'Asie raccourcit cette distance pour chaque requête, ce qui est une raison typique d'utiliser plusieurs Régions."
  options:
    a:
      en: "All Availability Zones of the Region are in North America, so the requests from Asia still travel the same distance."
      fr: "Toutes les zones de disponibilité de la Région se trouvent en Amérique du Nord : les requêtes venant d'Asie parcourent toujours la même distance."
    b:
      en: "Larger instances add processing capacity but do not reduce the network distance between Asia and North America."
      fr: "Des instances plus grandes ajoutent de la capacité de traitement mais ne réduisent pas la distance réseau entre l'Asie et l'Amérique du Nord."
    c:
      en: "Multi-AZ adds a standby database in another Availability Zone of the same Region for availability; it does not bring the application closer to the users."
      fr: "Multi-AZ ajoute une base de données de secours dans une autre zone de disponibilité de la même Région pour la disponibilité ; elle ne rapproche pas l'application des utilisateurs."
references:
  - title: Regions and Zones
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html
