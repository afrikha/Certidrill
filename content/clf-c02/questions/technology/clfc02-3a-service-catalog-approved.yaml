id: clfc02-3a-service-catalog-approved
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A central IT team has preconfigured several approved environments, from single servers to complete multi-tier applications. Other teams must launch only these approved environments by themselves, without direct access to the underlying AWS services.

    Which AWS service will meet these requirements?
  fr: |
    Une équipe informatique centrale a préconfiguré plusieurs environnements approuvés, du simple serveur à l'application multiniveau complète. Les autres équipes doivent lancer elles-mêmes uniquement ces environnements approuvés, sans accès direct aux services AWS sous-jacents.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Organizations" }
    - { id: b, text: "AWS Marketplace" }
    - { id: c, text: "AWS Config" }
    - { id: d, text: "AWS Service Catalog" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Service Catalog lets administrators create catalogs of approved IT services, group them in portfolios, and grant users access to them. Users browse the products they are allowed to use and launch them on their own, without direct access to the underlying AWS services, while administrators control the allowed configurations.
    fr: |
      Service Catalog permet aux administrateurs de créer des catalogues de services informatiques approuvés, de les regrouper dans des portefeuilles et d'en donner l'accès aux utilisateurs. Les utilisateurs parcourent les produits autorisés et les lancent eux-mêmes, sans accès direct aux services AWS sous-jacents, tandis que les administrateurs contrôlent les configurations autorisées.
  options:
    a: { en: "Organizations groups and governs AWS accounts; it does not offer users a set of approved environments to launch.", fr: "Organizations regroupe et gouverne des comptes AWS ; il ne propose pas aux utilisateurs un ensemble d'environnements approuvés à lancer." }
    b: { en: "AWS Marketplace sells third-party software; it is not a place for the company's own preconfigured environments.", fr: "AWS Marketplace vend des logiciels tiers ; ce n'est pas l'endroit où publier les environnements préconfigurés de l'entreprise." }
    c: { en: "AWS Config records and evaluates resource configurations after they exist; it does not launch environments for users.", fr: "AWS Config enregistre et évalue la configuration des ressources une fois créées ; il ne lance pas d'environnements pour les utilisateurs." }
references:
  - title: What Is Service Catalog?
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/introduction.html
