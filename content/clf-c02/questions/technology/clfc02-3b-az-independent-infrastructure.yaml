id: clfc02-3b-az-independent-infrastructure
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to understand why AWS recommends spreading an application across more than one Availability Zone in a Region.

    Which characteristic of Availability Zones supports this recommendation?
  fr: |
    Une entreprise veut comprendre pourquoi AWS recommande de répartir une application sur plusieurs zones de disponibilité d'une Région.

    Quelle caractéristique des zones de disponibilité justifie cette recommandation ?
body:
  options:
    - { id: a, text: { en: "All Availability Zones in a Region share one data center building with redundant power supplies.", fr: "Toutes les zones de disponibilité d'une Région partagent un même bâtiment de centre de données doté d'alimentations redondantes." } }
    - { id: b, text: { en: "Each Availability Zone is located in a different AWS Region to isolate it from the others.", fr: "Chaque zone de disponibilité est située dans une Région AWS différente pour l'isoler des autres." } }
    - { id: c, text: { en: "Each Availability Zone has its own power, cooling, and networking, not shared with other zones.", fr: "Chaque zone de disponibilité a sa propre alimentation, son refroidissement et son réseau, non partagés." } }
    - { id: d, text: { en: "Each Availability Zone is an edge location that caches content close to end users.", fr: "Chaque zone de disponibilité est un emplacement périphérique qui met en cache le contenu près des utilisateurs finaux." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An Availability Zone is one or more discrete data centers with independent and redundant power, networking, and connectivity. Common points of failure such as generators and cooling equipment are not shared between Availability Zones, so a failure in one zone does not take down the others."
    fr: "Une zone de disponibilité est constituée d'un ou plusieurs centres de données distincts dotés d'une alimentation, d'un réseau et d'une connectivité indépendants et redondants. Les points de défaillance courants comme les groupes électrogènes et les équipements de refroidissement ne sont pas partagés entre zones de disponibilité : une panne dans une zone n'arrête pas les autres."
  options:
    a:
      en: "Availability Zones are physically separate data centers, not one shared building; a shared building would be a single point of failure."
      fr: "Les zones de disponibilité sont des centres de données physiquement séparés, pas un bâtiment partagé ; un bâtiment partagé serait un point de défaillance unique."
    b:
      en: "Availability Zones are inside a Region: a Region contains several Availability Zones, not the other way around."
      fr: "Les zones de disponibilité se trouvent à l'intérieur d'une Région : une Région contient plusieurs zones de disponibilité, et non l'inverse."
    d:
      en: "Edge locations are separate sites used by services such as Amazon CloudFront to cache content; they are not Availability Zones."
      fr: "Les emplacements périphériques sont des sites distincts utilisés par des services comme Amazon CloudFront pour mettre en cache le contenu ; ce ne sont pas des zones de disponibilité."
references:
  - title: Availability Zones
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/availability-zones.html
