id: clfc02-3d-opensearch-logs
objective: "3.7.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to collect application logs from hundreds of servers, search across them, and monitor them in near real time with interactive dashboards.

    Which AWS service should the company use?
  fr: |
    Une entreprise veut collecter les journaux d'application de centaines de serveurs, y effectuer des recherches et les surveiller en quasi-temps réel avec des tableaux de bord interactifs.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon Redshift" }
    - { id: b, text: "Amazon OpenSearch Service" }
    - { id: c, text: "Amazon Neptune" }
    - { id: d, text: "AWS Glue" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon OpenSearch Service is a managed service for deploying and running OpenSearch clusters in AWS. It indexes, searches, and visualizes large collections of data; typical uses are log analytics, real-time application monitoring, and clickstream analysis, with OpenSearch Dashboards for visualization."
    fr: "Amazon OpenSearch Service est un service géré pour déployer et exécuter des clusters OpenSearch dans AWS. Il indexe, recherche et visualise de grandes collections de données ; ses usages typiques sont l'analytique de journaux, la surveillance des applications en temps réel et l'analyse des parcours de navigation, avec OpenSearch Dashboards pour la visualisation."
  options:
    a:
      en: "Amazon Redshift is a data warehouse for SQL analytics on structured data; it is not a search engine for log data with monitoring dashboards."
      fr: "Amazon Redshift est un entrepôt de données pour l'analytique SQL sur des données structurées ; ce n'est pas un moteur de recherche pour des données de journaux avec des tableaux de bord de surveillance."
    c:
      en: "Amazon Neptune is a graph database for relationships between data; it does not provide log search and dashboards."
      fr: "Amazon Neptune est une base de données orientée graphe pour les relations entre les données ; il ne fournit ni recherche dans les journaux ni tableaux de bord."
    d:
      en: "AWS Glue discovers, prepares, and transforms data with ETL jobs; it does not search logs or provide monitoring dashboards."
      fr: "AWS Glue découvre, prépare et transforme des données avec des tâches ETL ; il ne recherche pas dans les journaux et ne fournit pas de tableaux de bord de surveillance."
references:
  - title: What is Amazon OpenSearch Service?
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html
