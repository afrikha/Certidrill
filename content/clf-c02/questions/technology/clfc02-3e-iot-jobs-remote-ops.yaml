id: clfc02-3e-iot-jobs-remote-ops
objective: "3.8.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company registers its devices in AWS IoT. It needs to send a remote operation, such as a reboot or a certificate rotation, to a group of these devices.

    Which AWS IoT feature should the company use?
  fr: |
    Une entreprise enregistre ses appareils dans AWS IoT. Elle doit envoyer une opération à distance, comme un redémarrage ou une rotation de certificat, à un groupe de ces appareils.

    Quelle fonctionnalité AWS IoT l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Device Shadow service", fr: "Service Device Shadow" } }
    - { id: b, text: { en: "Rules engine", fr: "Moteur de règles" } }
    - { id: c, text: { en: "Message broker", fr: "Agent de messages" } }
    - { id: d, text: { en: "Jobs", fr: "Tâches (jobs)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "The AWS IoT jobs service sends remote operations, such as firmware updates, reboots, certificate rotation or troubleshooting actions, to one or more devices or groups of devices."
    fr: "Le service de tâches (jobs) d'AWS IoT envoie des opérations à distance, comme des mises à jour de microprogramme, des redémarrages, des rotations de certificats ou des actions de dépannage, à un ou plusieurs appareils ou groupes d'appareils."
  options:
    a:
      en: "A device shadow stores the desired and reported state of one device; it does not run operations across a group of devices."
      fr: "Un shadow d'appareil stocke l'état souhaité et signalé d'un appareil ; il n'exécute pas d'opérations sur un groupe d'appareils."
    b:
      en: "The rules engine routes device messages to AWS services; it does not send operations to devices."
      fr: "Le moteur de règles achemine les messages des appareils vers des services AWS ; il n'envoie pas d'opérations aux appareils."
    c:
      en: "The message broker carries publish/subscribe messages but does not define, track and roll out remote operations."
      fr: "L'agent de messages transporte des messages de publication/abonnement mais ne définit, ne suit et ne déploie pas d'opérations à distance."
references:
  - title: How AWS IoT works
    url: https://docs.aws.amazon.com/iot/latest/developerguide/aws-iot-how-it-works.html
