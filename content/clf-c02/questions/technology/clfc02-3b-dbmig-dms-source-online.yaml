id: clfc02-3b-dbmig-dms-source-online
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to migrate an on-premises PostgreSQL database to Amazon RDS for PostgreSQL. The source database must remain fully operational during the migration to minimize downtime for the applications that use it.

    Which AWS service should the company use?
  fr: |
    Une entreprise veut migrer une base de données PostgreSQL sur site vers Amazon RDS for PostgreSQL. La base de données source doit rester entièrement opérationnelle pendant la migration pour réduire au minimum l'interruption des applications qui l'utilisent.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "AWS Application Migration Service" }
    - { id: b, text: "AWS Backup" }
    - { id: c, text: "AWS Database Migration Service (AWS DMS)" }
    - { id: d, text: "AWS DataSync" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS DMS migrates data from a source database to a target database in AWS, such as Amazon RDS. The source database remains fully operational during the migration, which minimizes downtime, and DMS can replicate ongoing changes to keep the source and target in sync."
    fr: "AWS DMS migre les données d'une base de données source vers une base de données cible dans AWS, comme Amazon RDS. La base source reste entièrement opérationnelle pendant la migration, ce qui réduit l'interruption, et DMS peut répliquer les modifications en cours pour garder la source et la cible synchronisées."
  options:
    a:
      en: "Application Migration Service replicates whole servers to run them on Amazon EC2 (rehost); it does not load the data into an Amazon RDS database."
      fr: "Application Migration Service réplique des serveurs entiers pour les exécuter sur Amazon EC2 (réhébergement) ; il ne charge pas les données dans une base de données Amazon RDS."
    b:
      en: "AWS Backup centralizes and automates backups of AWS resources; it is not a tool to migrate an on-premises database into RDS while the source stays online."
      fr: "AWS Backup centralise et automatise les sauvegardes des ressources AWS ; ce n'est pas un outil pour migrer une base de données sur site vers RDS pendant que la source reste en ligne."
    d:
      en: "DataSync copies files and objects between storage systems; it does not migrate the contents of a running database into RDS."
      fr: "DataSync copie des fichiers et des objets entre systèmes de stockage ; il ne migre pas le contenu d'une base de données en cours d'exécution vers RDS."
references:
  - title: What is AWS Database Migration Service?
    url: https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html
  - title: AWS Database Migration Service FAQs
    url: https://aws.amazon.com/dms/faqs/
