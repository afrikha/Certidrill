id: clfc02-3b-serverless-lambda-events
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to create a thumbnail each time a user uploads a photo to an Amazon S3 bucket. Each thumbnail takes a few seconds to create. The company does not want to manage servers and wants to pay only when code runs.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise veut créer une miniature chaque fois qu'un utilisateur charge une photo dans un compartiment Amazon S3. Chaque miniature est créée en quelques secondes. L'entreprise ne veut pas gérer de serveurs et veut payer uniquement lorsque le code s'exécute.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Lambda" }
    - { id: b, text: "Amazon EC2" }
    - { id: c, text: "Amazon Lightsail" }
    - { id: d, text: "AWS Outposts" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon S3 can send an event to a Lambda function when an object is created, and Lambda runs the code without any servers to provision or manage. Lambda Event Functions are billed per request and for execution time, so the company pays only when photos are processed."
    fr: "Amazon S3 peut envoyer un événement à une fonction Lambda lorsqu'un objet est créé, et Lambda exécute le code sans serveur à provisionner ni à gérer. Les Event Functions Lambda sont facturées par requête et selon le temps d'exécution : l'entreprise ne paie que lorsque des photos sont traitées."
  options:
    b:
      en: "EC2 instances are servers that the company must manage, and running instances are billed even when no photo arrives."
      fr: "Les instances EC2 sont des serveurs que l'entreprise doit gérer, et les instances en cours d'exécution sont facturées même lorsqu'aucune photo n'arrive."
    c:
      en: "Lightsail provides servers billed at a fixed monthly price, whether or not code runs."
      fr: "Lightsail fournit des serveurs facturés à un prix mensuel fixe, que le code s'exécute ou non."
    d:
      en: "Outposts places AWS hardware in the customer's facility; the company would pay for that capacity continuously."
      fr: "Outposts place du matériel AWS dans les locaux du client ; l'entreprise paierait cette capacité en continu."
references:
  - title: Process Amazon S3 event notifications with Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-s3.html
  - title: What is AWS Lambda?
    url: https://docs.aws.amazon.com/lambda/latest/dg/welcome.html
