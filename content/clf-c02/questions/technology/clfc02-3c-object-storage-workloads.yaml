id: clfc02-3c-object-storage-workloads
objective: "3.6.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is moving several workloads to AWS and wants to use Amazon S3 wherever object storage fits.

    Which workloads are good fits for Amazon S3? (Choose two.)
  fr: |
    Une entreprise déplace plusieurs charges de travail vers AWS et souhaite utiliser Amazon S3 partout où le stockage d'objets convient.

    Quelles charges de travail conviennent bien à Amazon S3 ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Backup copies of on-premises servers kept for restores", fr: "Des copies de sauvegarde de serveurs sur site conservées pour les restaurations" }
    - id: b
      text: { en: "The data files of a database that needs block-level access", fr: "Les fichiers de données d'une base qui nécessite un accès au niveau bloc" }
    - id: c
      text: { en: "Records kept for seven years for compliance and rarely read", fr: "Des documents conservés sept ans pour la conformité et rarement lus" }
    - id: d
      text: { en: "The boot volume of an Amazon EC2 instance", fr: "Le volume de démarrage d'une instance Amazon EC2" }
    - id: e
      text: { en: "A cache that must be on disks physically attached to the host", fr: "Un cache qui doit se trouver sur des disques physiquement attachés à l'hôte" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Backup and restore and long-term archiving are typical uses of Amazon S3 object storage. S3 offers storage classes for infrequently accessed and archive data, such as S3 Glacier Deep Archive for data read less than once a year.
    fr: |-
      La sauvegarde et la restauration ainsi que l'archivage à long terme sont des utilisations typiques du stockage d'objets Amazon S3. S3 propose des classes de stockage pour les données rarement consultées et les archives, comme S3 Glacier Deep Archive pour des données lues moins d'une fois par an.
  options:
    b:
      en: |-
        Database data files that need block-level access belong on block storage such as Amazon EBS.
      fr: |-
        Les fichiers de données d'une base qui nécessitent un accès au niveau bloc relèvent d'un stockage en bloc comme Amazon EBS.
    d:
      en: |-
        An EC2 instance boots from a block device, such as an EBS volume, not from S3 objects.
      fr: |-
        Une instance EC2 démarre à partir d'un périphérique en bloc, comme un volume EBS, et non à partir d'objets S3.
    e:
      en: |-
        Disks physically attached to the host are EC2 instance store, a block storage option.
      fr: |-
        Les disques physiquement attachés à l'hôte constituent le stockage d'instance EC2, une option de stockage en bloc.
references:
  - title: "What is Amazon S3? - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
  - title: "Understanding and managing Amazon S3 storage classes - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
