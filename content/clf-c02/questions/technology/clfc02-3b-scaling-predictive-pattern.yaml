id: clfc02-3b-scaling-predictive-pattern
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's application has a traffic pattern that repeats every day: load rises sharply at the start of business hours and falls in the evening. New instances take several minutes to initialize. The company wants Amazon EC2 Auto Scaling to forecast the load from past data and launch capacity before the daily increase.

    Which feature should the company use?
  fr: |
    Le trafic de l'application d'une entreprise suit un modèle qui se répète chaque jour : la charge augmente fortement au début des heures de bureau et baisse le soir. Les nouvelles instances mettent plusieurs minutes à s'initialiser. L'entreprise veut qu'Amazon EC2 Auto Scaling prévoie la charge à partir des données passées et lance de la capacité avant l'augmentation quotidienne.

    Quelle fonctionnalité l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A target tracking scaling policy", fr: "Une politique de mise à l'échelle avec suivi de cible" } }
    - { id: b, text: { en: "A predictive scaling policy", fr: "Une politique de mise à l'échelle prédictive" } }
    - { id: c, text: { en: "Health checks from Elastic Load Balancing", fr: "Des vérifications de l'état d'Elastic Load Balancing" } }
    - { id: d, text: { en: "A larger maximum capacity for the Auto Scaling group", fr: "Une capacité maximale plus élevée pour le groupe Auto Scaling" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Predictive scaling analyzes historical load to detect daily or weekly patterns, forecasts future capacity needs, and launches instances in advance of the forecasted increase. It suits cyclical traffic and applications whose instances take a long time to initialize."
    fr: "La mise à l'échelle prédictive analyse la charge historique pour détecter des modèles quotidiens ou hebdomadaires, prévoit les besoins de capacité et lance les instances avant l'augmentation prévue. Elle convient au trafic cyclique et aux applications dont les instances mettent longtemps à s'initialiser."
  options:
    a:
      en: "Target tracking reacts to the current value of a metric; it adds instances after the load has started to rise and does not forecast from past data."
      fr: "Le suivi de cible réagit à la valeur actuelle d'une métrique ; il ajoute des instances après le début de la hausse et ne fait pas de prévision à partir des données passées."
    c:
      en: "Load balancer health checks detect unhealthy instances; they do not forecast load or launch capacity in advance."
      fr: "Les vérifications de l'état de l'équilibreur de charge détectent les instances défaillantes ; elles ne prévoient pas la charge et ne lancent pas de capacité à l'avance."
    d:
      en: "A higher maximum only allows the group to grow further; it does not make the group launch instances before the load increases."
      fr: "Un maximum plus élevé permet seulement au groupe de grandir davantage ; il ne fait pas lancer d'instances avant la hausse de la charge."
references:
  - title: Predictive scaling for Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-predictive-scaling.html
