id: clfc02-3a-tools-for-powershell
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team of Windows administrators automates its work with PowerShell. The team wants to manage AWS resources with PowerShell cmdlets and pass PowerShell objects from one command to the next through the pipeline.

    Which AWS option will meet these requirements?
  fr: |
    Une équipe d'administrateurs Windows automatise son travail avec PowerShell. Elle veut gérer les ressources AWS avec des cmdlets PowerShell et transmettre des objets PowerShell d'une commande à l'autre par le pipeline.

    Quelle option AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Console Mobile Application" }
    - { id: b, text: "AWS Command Line Interface (AWS CLI)" }
    - { id: c, text: "AWS SDK for Java" }
    - { id: d, text: "AWS Tools for PowerShell" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      AWS Tools for PowerShell are PowerShell modules that expose AWS operations as cmdlets with PowerShell parameters and results. PowerShell objects can be piped into and out of the cmdlets, and the modules run on Windows, Linux, and macOS.
    fr: |
      AWS Tools for PowerShell sont des modules PowerShell qui présentent les opérations AWS sous forme de cmdlets, avec des paramètres et des résultats PowerShell. Les objets PowerShell peuvent être transmis aux cmdlets et en sortir par le pipeline, et les modules fonctionnent sous Windows, Linux et macOS.
  options:
    a: { en: "The mobile app shows resources and alarms on a phone; it does not provide cmdlets for scripting.", fr: "L'application mobile affiche les ressources et les alarmes sur un téléphone ; elle ne fournit pas de cmdlets pour les scripts." }
    b: { en: "The AWS CLI can run in a PowerShell window, but its commands are not PowerShell cmdlets and do not exchange PowerShell objects through the pipeline.", fr: "L'AWS CLI peut s'exécuter dans une fenêtre PowerShell, mais ses commandes ne sont pas des cmdlets PowerShell et n'échangent pas d'objets PowerShell par le pipeline." }
    c: { en: "The AWS SDK for Java is a library for Java applications, not a set of PowerShell cmdlets.", fr: "L'AWS SDK for Java est une bibliothèque pour les applications Java, pas un ensemble de cmdlets PowerShell." }
references:
  - title: What are the AWS Tools for PowerShell?
    url: https://docs.aws.amazon.com/powershell/latest/userguide/pstools-welcome.html
