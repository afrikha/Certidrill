id: clfc02-3b-compute-lightsail-vps
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A small business with no cloud experience wants to host a simple website on a virtual private server. The business wants an easy setup and a low, predictable monthly price.

    Which AWS service will meet these requirements?
  fr: |
    Une petite entreprise sans expérience du cloud veut héberger un site web simple sur un serveur privé virtuel. L'entreprise veut une mise en place simple et un prix mensuel bas et prévisible.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Batch" }
    - { id: b, text: "AWS Outposts" }
    - { id: c, text: "AWS Elastic Beanstalk" }
    - { id: d, text: "Amazon Lightsail" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Lightsail offers easy-to-set-up virtual private servers (instances), along with SSD-based storage, static IP addresses, DNS management, and snapshots, for a low, predictable monthly price. It suits small websites and applications that need a quick start."
    fr: "Amazon Lightsail propose des serveurs privés virtuels (instances) faciles à configurer, avec un stockage SSD, des adresses IP statiques, la gestion DNS et des instantanés, pour un prix mensuel bas et prévisible. Il convient aux petits sites web et applications qui ont besoin d'un démarrage rapide."
  options:
    a:
      en: "AWS Batch runs large numbers of batch computing jobs; it does not provide a virtual private server for hosting a website."
      fr: "AWS Batch exécute de grands nombres de tâches de calcul par lots ; il ne fournit pas de serveur privé virtuel pour héberger un site web."
    b:
      en: "AWS Outposts extends AWS infrastructure to the customer's own premises; it is not a simple low-cost server for a small website."
      fr: "AWS Outposts étend l'infrastructure AWS aux propres locaux du client ; ce n'est pas un serveur simple et peu coûteux pour un petit site web."
    c:
      en: "Elastic Beanstalk deploys application code and bills the underlying resources that the application consumes; it does not offer a virtual private server at a predictable monthly price."
      fr: "Elastic Beanstalk déploie du code d'application et facture les ressources sous-jacentes consommées par l'application ; il ne propose pas de serveur privé virtuel à prix mensuel prévisible."
references:
  - title: What is Amazon Lightsail?
    url: https://docs.aws.amazon.com/lightsail/latest/userguide/what-is-amazon-lightsail.html
