id: clfc02-3a-subnet-per-az
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a VPC in one AWS Region. It wants to run its Amazon EC2 instances in two Availability Zones of that Region for high availability.

    What must the company create in the VPC?
  fr: |
    Une entreprise dispose d'un VPC dans une Région AWS. Elle veut exécuter ses instances Amazon EC2 dans deux zones de disponibilité de cette Région pour la haute disponibilité.

    Que doit-elle créer dans le VPC ?
body:
  options:
    - { id: a, text: { en: "One subnet that spans both Availability Zones", fr: "Un sous-réseau qui couvre les deux zones de disponibilité" } }
    - { id: b, text: { en: "At least one subnet in each of the two Availability Zones", fr: "Au moins un sous-réseau dans chacune des deux zones de disponibilité" } }
    - { id: c, text: { en: "A second VPC in each Availability Zone", fr: "Un deuxième VPC dans chaque zone de disponibilité" } }
    - { id: d, text: { en: "An edge location in each Availability Zone", fr: "Un emplacement périphérique dans chaque zone de disponibilité" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A VPC can have subnets in any Availability Zone of its Region, but each subnet must reside entirely within one Availability Zone and cannot span zones. To place instances in two zones, the company needs at least one subnet in each zone and launches instances into those subnets.
    fr: |
      Un VPC peut avoir des sous-réseaux dans n'importe quelle zone de disponibilité de sa Région, mais chaque sous-réseau doit se trouver entièrement dans une seule zone de disponibilité et ne peut pas en couvrir plusieurs. Pour placer des instances dans deux zones, l'entreprise a besoin d'au moins un sous-réseau dans chaque zone et lance les instances dans ces sous-réseaux.
  options:
    a: { en: "A subnet cannot span Availability Zones; it is always in exactly one zone.", fr: "Un sous-réseau ne peut pas couvrir plusieurs zones de disponibilité ; il se trouve toujours dans une seule zone." }
    c: { en: "One VPC can already have subnets in several Availability Zones of its Region, so a second VPC is not needed.", fr: "Un même VPC peut déjà avoir des sous-réseaux dans plusieurs zones de disponibilité de sa Région : un deuxième VPC n'est pas nécessaire." }
    d: { en: "Edge locations are AWS sites for services such as CloudFront; customers do not create them in a VPC.", fr: "Les emplacements périphériques sont des sites AWS pour des services comme CloudFront ; les clients ne les créent pas dans un VPC." }
references:
  - title: Subnets for your VPC
    url: https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
