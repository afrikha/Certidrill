id: clfc02-3d-efs-characteristics
objective: "3.6.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements describe Amazon Elastic File System (Amazon EFS)? (Choose two.)
  fr: |
    Quelles sont les deux affirmations qui décrivent Amazon Elastic File System (Amazon EFS) ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "It provides block-level volumes that are attached to a single EC2 instance.", fr: "Il fournit des volumes de niveau bloc attachés à une seule instance EC2." } }
    - { id: b, text: { en: "It grows and shrinks automatically as files are added and removed, with no capacity to provision.", fr: "Il croît et décroît automatiquement à mesure que des fichiers sont ajoutés et supprimés, sans capacité à provisionner." } }
    - { id: c, text: { en: "It is the recommended file system for Windows-based EC2 instances that use SMB.", fr: "C'est le système de fichiers recommandé pour les instances EC2 Windows qui utilisent SMB." } }
    - { id: d, text: { en: "It can be accessed at the same time by many EC2 instances, containers, and Lambda functions.", fr: "Il est accessible en même temps par de nombreuses instances EC2, de nombreux conteneurs et de nombreuses fonctions Lambda." } }
    - { id: e, text: { en: "It stores data as objects that applications reach only through HTTP API calls.", fr: "Il stocke les données sous forme d'objets que les applications atteignent uniquement par des appels d'API HTTP." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Amazon EFS is elastic: it scales to petabytes and grows and shrinks automatically, so you do not provision storage capacity. It supports massively parallel access from Amazon EC2, Amazon ECS, Amazon EKS, AWS Fargate, and AWS Lambda."
    fr: "Amazon EFS est élastique : il évolue jusqu'à plusieurs pétaoctets et croît et décroît automatiquement, sans capacité de stockage à provisionner. Il prend en charge un accès massivement parallèle depuis Amazon EC2, Amazon ECS, Amazon EKS, AWS Fargate et AWS Lambda."
  options:
    a:
      en: "Block-level volumes attached to one instance describe Amazon EBS, not Amazon EFS."
      fr: "Des volumes de niveau bloc attachés à une instance décrivent Amazon EBS, pas Amazon EFS."
    c:
      en: "Amazon EFS uses NFS and is not supported on Windows-based instances; Amazon FSx for Windows File Server provides SMB shares."
      fr: "Amazon EFS utilise NFS et n'est pas pris en charge sur les instances Windows ; Amazon FSx for Windows File Server fournit des partages SMB."
    e:
      en: "Objects reached through HTTP API calls describe Amazon S3; Amazon EFS is a file system mounted over NFS."
      fr: "Des objets atteints par des appels d'API HTTP décrivent Amazon S3 ; Amazon EFS est un système de fichiers monté via NFS."
references:
  - title: What is Amazon Elastic File System?
    url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
