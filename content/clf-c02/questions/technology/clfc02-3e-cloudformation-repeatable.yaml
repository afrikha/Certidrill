id: clfc02-3e-cloudformation-repeatable
objective: "3.8.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A development team wants to deploy the same set of AWS resources for its application in several AWS Regions. The resources must be described in a template file that the team keeps in version control.

    Which AWS service will meet these requirements?
  fr: |
    Une équipe de développement souhaite déployer le même ensemble de ressources AWS pour son application dans plusieurs Régions AWS. Les ressources doivent être décrites dans un fichier de modèle que l'équipe conserve dans un système de gestion de versions.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "AWS CloudFormation", fr: "AWS CloudFormation" } }
    - { id: b, text: { en: "AWS X-Ray", fr: "AWS X-Ray" } }
    - { id: c, text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" } }
    - { id: d, text: { en: "Amazon CloudWatch", fr: "Amazon CloudWatch" } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS CloudFormation provisions AWS resources from a template that describes them. The same template can be reused to create the same infrastructure in several Regions, and because templates are text files, they can be tracked in version control like source code."
    fr: "AWS CloudFormation provisionne des ressources AWS à partir d'un modèle qui les décrit. Le même modèle peut être réutilisé pour créer la même infrastructure dans plusieurs Régions, et comme les modèles sont des fichiers texte, ils peuvent être suivis dans un système de gestion de versions comme du code source."
  options:
    b:
      en: "X-Ray traces requests to troubleshoot applications; it does not create resources."
      fr: "X-Ray suit les requêtes pour dépanner les applications ; il ne crée pas de ressources."
    c:
      en: "Trusted Advisor inspects an account and recommends best-practice improvements; it does not deploy resources from templates."
      fr: "Trusted Advisor inspecte un compte et recommande des améliorations conformes aux bonnes pratiques ; il ne déploie pas de ressources à partir de modèles."
    d:
      en: "CloudWatch monitors metrics and logs; it does not provision infrastructure."
      fr: "CloudWatch surveille des métriques et des journaux ; il ne provisionne pas d'infrastructure."
references:
  - title: What is CloudFormation?
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html
