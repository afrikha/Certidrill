id: clfc02-3a-console-mobile-app
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An on-call engineer wants to check Amazon CloudWatch alarms and receive push notifications about AWS resources from a smartphone.

    Which AWS option will meet these requirements?
  fr: |
    Un ingénieur d'astreinte veut consulter les alarmes Amazon CloudWatch et recevoir des notifications push sur les ressources AWS depuis un smartphone.

    Quelle option AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Console Mobile Application" }
    - { id: b, text: "AWS Command Line Interface (AWS CLI)" }
    - { id: c, text: "AWS Tools for PowerShell" }
    - { id: d, text: "AWS Cloud Development Kit (AWS CDK)" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The AWS Console Mobile Application runs on iOS and Android devices. It shows resources, CloudWatch alarms and dashboards, service health, and cost information, and it can send push notifications about resources of interest.
    fr: |
      L'AWS Console Mobile Application fonctionne sur les appareils iOS et Android. Elle affiche les ressources, les alarmes et tableaux de bord CloudWatch, l'état des services et les informations de coûts, et elle peut envoyer des notifications push sur les ressources suivies.
  options:
    b: { en: "The AWS CLI is a command-line tool for a terminal; it does not send push notifications to a phone.", fr: "L'AWS CLI est un outil en ligne de commande pour un terminal ; il n'envoie pas de notifications push sur un téléphone." }
    c: { en: "AWS Tools for PowerShell provide cmdlets for scripting from PowerShell; they are not a mobile app.", fr: "AWS Tools for PowerShell fournissent des cmdlets pour écrire des scripts depuis PowerShell ; ce n'est pas une application mobile." }
    d: { en: "The AWS CDK defines infrastructure in code; it does not display alarms or send notifications.", fr: "L'AWS CDK définit l'infrastructure dans du code ; il n'affiche pas d'alarmes et n'envoie pas de notifications." }
references:
  - title: What is the AWS Console Mobile Application?
    url: https://docs.aws.amazon.com/consolemobileapp/latest/userguide/what-is-consolemobileapp.html
