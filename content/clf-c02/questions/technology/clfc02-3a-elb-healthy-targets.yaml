id: clfc02-3a-elb-healthy-targets
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which AWS service distributes incoming application traffic across multiple targets, such as Amazon EC2 instances in several Availability Zones, and sends traffic only to the targets that pass health checks?
  fr: |
    Quel service AWS répartit le trafic applicatif entrant sur plusieurs cibles, par exemple des instances Amazon EC2 dans plusieurs zones de disponibilité, et n'envoie le trafic qu'aux cibles qui réussissent les vérifications de l'état ?
body:
  options:
    - { id: a, text: "Amazon CloudFront" }
    - { id: b, text: "Elastic Load Balancing" }
    - { id: c, text: "Amazon EC2 Auto Scaling" }
    - { id: d, text: "AWS Direct Connect" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Elastic Load Balancing distributes incoming traffic across registered targets in one or more Availability Zones. It monitors the health of the targets and routes traffic only to healthy ones, so a failed instance stops receiving requests.
    fr: |
      Elastic Load Balancing répartit le trafic entrant sur les cibles enregistrées dans une ou plusieurs zones de disponibilité. Il surveille l'état des cibles et ne route le trafic que vers les cibles saines : une instance défaillante cesse de recevoir des requêtes.
  options:
    a: { en: "CloudFront caches and delivers content from edge locations; it is not the service that spreads requests across instances in Availability Zones.", fr: "CloudFront met en cache et diffuse du contenu depuis des emplacements périphériques ; ce n'est pas le service qui répartit les requêtes entre des instances de plusieurs zones de disponibilité." }
    c: { en: "EC2 Auto Scaling adds, removes, and replaces instances; it does not distribute the incoming traffic itself.", fr: "EC2 Auto Scaling ajoute, retire et remplace des instances ; il ne répartit pas lui-même le trafic entrant." }
    d: { en: "Direct Connect is a dedicated network connection between an on-premises network and AWS.", fr: "Direct Connect est une connexion réseau dédiée entre un réseau sur site et AWS." }
references:
  - title: How Elastic Load Balancing works
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html
