id: clfc02-3e-workspaces-delivery-model
objective: "3.8.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    How does Amazon WorkSpaces deliver a desktop to a user?
  fr: |
    Comment Amazon WorkSpaces fournit-il un bureau à un utilisateur ?
body:
  options:
    - { id: a, text: { en: "AWS copies a desktop image to the user's device, which then runs it locally.", fr: "AWS copie une image de bureau sur l'appareil de l'utilisateur, qui l'exécute ensuite localement." } }
    - { id: b, text: { en: "AWS installs the applications on the user's device and keeps them updated.", fr: "AWS installe les applications sur l'appareil de l'utilisateur et les maintient à jour." } }
    - { id: c, text: { en: "The desktop runs in the AWS Cloud, and the user connects to it from a client or a browser.", fr: "Le bureau s'exécute dans le Cloud AWS, et l'utilisateur s'y connecte depuis un client ou un navigateur." } }
    - { id: d, text: { en: "The desktop runs on servers in the company's data center that AWS operates remotely.", fr: "Le bureau s'exécute sur des serveurs du centre de données de l'entreprise qu'AWS exploite à distance." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon WorkSpaces provisions virtual, cloud-based desktops. The desktop runs on AWS, and the user reaches it from a supported device or a web browser, so no desktop hardware has to be procured or deployed."
    fr: "Amazon WorkSpaces provisionne des bureaux virtuels dans le cloud. Le bureau s'exécute sur AWS, et l'utilisateur y accède depuis un appareil pris en charge ou un navigateur web : aucun matériel de poste de travail n'est à acheter ni à déployer."
  options:
    a:
      en: "The desktop image stays on AWS; the user's device only connects to the desktop that runs in the cloud."
      fr: "L'image de bureau reste sur AWS ; l'appareil de l'utilisateur se connecte seulement au bureau qui s'exécute dans le cloud."
    b:
      en: "Applications are installed on the WorkSpace in the cloud, not on the user's device."
      fr: "Les applications sont installées sur le WorkSpace dans le cloud, pas sur l'appareil de l'utilisateur."
    d:
      en: "WorkSpaces desktops run in AWS Regions, not on the company's own servers."
      fr: "Les bureaux WorkSpaces s'exécutent dans des Régions AWS, pas sur les serveurs de l'entreprise."
references:
  - title: What is Amazon WorkSpaces?
    url: https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces.html
