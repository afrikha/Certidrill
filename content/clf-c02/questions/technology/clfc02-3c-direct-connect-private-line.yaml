id: clfc02-3c-direct-connect-private-line
objective: "3.5.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company needs a dedicated, private network connection from its data center to AWS. The connection must bypass internet service providers in the network path.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise a besoin d'une connexion réseau privée et dédiée entre son centre de données et AWS. La connexion doit contourner les fournisseurs d'accès à Internet sur le chemin réseau.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Site-to-Site VPN", fr: "AWS Site-to-Site VPN" }
    - id: b
      text: { en: "AWS Direct Connect", fr: "AWS Direct Connect" }
    - id: c
      text: { en: "AWS Client VPN", fr: "AWS Client VPN" }
    - id: d
      text: { en: "Amazon CloudFront", fr: "Amazon CloudFront" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Direct Connect links an internal network to a Direct Connect location over a standard Ethernet fiber-optic cable. Virtual interfaces then reach AWS services or VPCs directly, bypassing internet service providers in the network path.
    fr: |-
      AWS Direct Connect relie un réseau interne à un emplacement Direct Connect par un câble Ethernet à fibre optique standard. Des interfaces virtuelles atteignent ensuite directement les services AWS ou les VPC, en contournant les fournisseurs d'accès à Internet sur le chemin réseau.
  options:
    a:
      en: |-
        Site-to-Site VPN creates encrypted IPsec tunnels over the internet, so it does not bypass internet providers.
      fr: |-
        Site-to-Site VPN crée des tunnels IPsec chiffrés via Internet : il ne contourne pas les fournisseurs d'accès à Internet.
    c:
      en: |-
        Client VPN connects individual users' devices over the internet, not a data center through a dedicated line.
      fr: |-
        Client VPN connecte les appareils d'utilisateurs individuels via Internet, et non un centre de données par une ligne dédiée.
    d:
      en: |-
        CloudFront delivers content to viewers from edge locations; it is not a private connection to a data center.
      fr: |-
        CloudFront distribue du contenu aux utilisateurs depuis des emplacements périphériques ; ce n'est pas une connexion privée vers un centre de données.
references:
  - title: "What is AWS Direct Connect? - AWS Direct Connect"
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html
