id: clfc02-3a-programmatic-access
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A developer wants to access AWS services programmatically instead of through a graphical interface.

    Which options can the developer use? (Choose two.)
  fr: |
    Un développeur veut accéder aux services AWS par programmation plutôt qu'au moyen d'une interface graphique.

    Quelles options le développeur peut-il utiliser ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "AWS Management Console" }
    - { id: b, text: "AWS Command Line Interface (AWS CLI)" }
    - { id: c, text: "AWS Console Mobile Application" }
    - { id: d, text: "AWS SDKs" }
    - { id: e, text: "AWS Marketplace" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The AWS CLI gives direct access to the public APIs of AWS services from a command-line shell and from scripts. The AWS SDKs are language libraries (for Python, Java, JavaScript, .NET, Go, and others) that applications use to call the same services from code.
    fr: |
      L'AWS CLI donne un accès direct aux API publiques des services AWS depuis un shell en ligne de commande et depuis des scripts. Les kits SDK AWS sont des bibliothèques par langage (Python, Java, JavaScript, .NET, Go, etc.) que les applications utilisent pour appeler les mêmes services depuis le code.
  options:
    a: { en: "The Management Console is the browser-based graphical interface, which the developer wants to avoid.", fr: "L'AWS Management Console est l'interface graphique web, que le développeur veut éviter." }
    c: { en: "The mobile app is a graphical interface for phones, not a programmatic access method.", fr: "L'application mobile est une interface graphique pour téléphones, pas une méthode d'accès par programmation." }
    e: { en: "AWS Marketplace is a catalog of third-party software, not a way to call AWS services.", fr: "AWS Marketplace est un catalogue de logiciels tiers, pas un moyen d'appeler les services AWS." }
references:
  - title: What is the AWS Command Line Interface?
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-welcome.html
  - title: What is covered in the AWS SDKs and Tools Reference Guide
    url: https://docs.aws.amazon.com/sdkref/latest/guide/overview.html
