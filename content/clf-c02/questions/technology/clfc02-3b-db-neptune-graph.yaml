id: clfc02-3b-db-neptune-graph
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A social networking company needs a fully managed database to store users and the connections between them. The application must quickly answer queries such as "friends of friends who like the same groups."

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise de réseau social a besoin d'une base de données entièrement gérée pour stocker les utilisateurs et les liens qui les unissent. L'application doit répondre rapidement à des requêtes comme « les amis d'amis qui aiment les mêmes groupes ».

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Neptune" }
    - { id: b, text: "Amazon ElastiCache" }
    - { id: c, text: "Amazon Redshift" }
    - { id: d, text: "Amazon DocumentDB" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Neptune is a fully managed graph database service for applications that work with highly connected data sets, such as the relationships between users. Typical graph use cases include recommendation engines, fraud detection, and knowledge graphs."
    fr: "Amazon Neptune est un service de base de données orientée graphe entièrement géré pour les applications qui travaillent avec des jeux de données fortement connectés, comme les relations entre utilisateurs. Les cas d'usage typiques des graphes sont les moteurs de recommandation, la détection de fraude et les graphes de connaissances."
  options:
    b:
      en: "ElastiCache is an in-memory cache and data store used mainly to speed up access to data; it is not a graph database for relationship queries."
      fr: "ElastiCache est un cache et un magasin de données en mémoire utilisé surtout pour accélérer l'accès aux données ; ce n'est pas une base orientée graphe pour des requêtes sur les relations."
    c:
      en: "Redshift is a data warehouse for analytics on large structured data sets, not a graph database for an application's relationship queries."
      fr: "Redshift est un entrepôt de données pour l'analytique de grands jeux de données structurés, pas une base orientée graphe pour les requêtes relationnelles d'une application."
    d:
      en: "DocumentDB stores JSON documents; it is not optimized for traversing many levels of relationships."
      fr: "DocumentDB stocke des documents JSON ; il n'est pas optimisé pour parcourir de nombreux niveaux de relations."
references:
  - title: What Is Amazon Neptune?
    url: https://docs.aws.amazon.com/neptune/latest/userguide/intro.html
