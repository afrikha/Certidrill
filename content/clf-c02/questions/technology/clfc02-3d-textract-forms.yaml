id: clfc02-3d-textract-forms
objective: "3.7.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company receives thousands of scanned claim forms every week. It wants to extract the printed and handwritten text, the form fields with their values, and the tables from each document automatically.

    Which AWS service should the company use?
  fr: |
    Une compagnie d'assurance reçoit chaque semaine des milliers de formulaires de sinistre numérisés. Elle veut extraire automatiquement de chaque document le texte imprimé et manuscrit, les champs de formulaire avec leurs valeurs, ainsi que les tableaux.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon Textract" }
    - { id: b, text: "Amazon Comprehend" }
    - { id: c, text: "Amazon Transcribe" }
    - { id: d, text: "Amazon Rekognition" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Textract detects typed and handwritten text in image and PDF documents. Beyond simple text detection, its Document Analysis API extracts structured data from forms and tables, with no machine learning expertise required."
    fr: "Amazon Textract détecte le texte dactylographié et manuscrit dans des documents image et PDF. Au-delà de la simple détection de texte, son API Document Analysis extrait les données structurées des formulaires et des tableaux, sans expertise en machine learning."
  options:
    b:
      en: "Amazon Comprehend finds insights such as sentiment, entities, and key phrases in text; it is not the service that extracts form fields with their values and tables from scanned documents."
      fr: "Amazon Comprehend trouve dans un texte des informations comme le sentiment, les entités et les expressions clés ; ce n'est pas le service qui extrait des documents numérisés les champs de formulaire avec leurs valeurs et les tableaux."
    c:
      en: "Amazon Transcribe converts speech in audio into text; it does not process scanned documents."
      fr: "Amazon Transcribe convertit la parole d'un fichier audio en texte ; il ne traite pas les documents numérisés."
    d:
      en: "Amazon Rekognition analyzes images and videos for objects, faces, and scenes; it is not designed to extract form fields and tables from documents."
      fr: "Amazon Rekognition analyse les images et les vidéos pour y détecter des objets, des visages et des scènes ; il n'est pas conçu pour extraire les champs de formulaire et les tableaux de documents."
references:
  - title: What is Amazon Textract?
    url: https://docs.aws.amazon.com/textract/latest/dg/what-is.html
