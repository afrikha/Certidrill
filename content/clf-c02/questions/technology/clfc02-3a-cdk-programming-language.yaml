id: clfc02-3a-cdk-programming-language
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A development team writes its applications in Python. The team wants to define its AWS infrastructure in Python as well, and to provision that infrastructure through AWS CloudFormation stacks.

    Which AWS tool should the team use?
  fr: |
    Une équipe de développement écrit ses applications en Python. Elle veut aussi définir son infrastructure AWS en Python, et mettre en service cette infrastructure au moyen de piles AWS CloudFormation.

    Quel outil AWS l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: "AWS Cloud Development Kit (AWS CDK)" }
    - { id: b, text: "AWS SDK for Python (Boto3)" }
    - { id: c, text: "AWS Command Line Interface (AWS CLI)" }
    - { id: d, text: "AWS Elastic Beanstalk" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The AWS CDK is an open-source framework for defining cloud infrastructure in code with languages such as TypeScript, Python, Java, C#, and Go. It generates CloudFormation templates from that code and deploys them through CloudFormation, so the team gets CloudFormation stacks without writing templates by hand.
    fr: |
      L'AWS CDK est un framework open source qui permet de définir l'infrastructure cloud dans du code, avec des langages comme TypeScript, Python, Java, C# et Go. Il génère des modèles CloudFormation à partir de ce code et les déploie par CloudFormation : l'équipe obtient des piles CloudFormation sans écrire de modèles à la main.
  options:
    b: { en: "Boto3 lets Python code call AWS service APIs directly; it does not define infrastructure as CloudFormation stacks.", fr: "Boto3 permet à du code Python d'appeler directement les API des services AWS ; il ne définit pas l'infrastructure sous forme de piles CloudFormation." }
    c: { en: "The AWS CLI runs commands in a shell; it is not a framework for defining infrastructure in Python.", fr: "L'AWS CLI exécute des commandes dans un shell ; ce n'est pas un framework de définition de l'infrastructure en Python." }
    d: { en: "Elastic Beanstalk deploys application code into a managed environment; it does not let the team define its infrastructure in Python.", fr: "Elastic Beanstalk déploie du code d'application dans un environnement géré ; il ne permet pas à l'équipe de définir son infrastructure en Python." }
references:
  - title: What is the AWS CDK?
    url: https://docs.aws.amazon.com/cdk/v2/guide/home.html
