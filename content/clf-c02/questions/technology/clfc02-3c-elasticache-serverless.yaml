id: clfc02-3c-elasticache-serverless
objective: "3.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A startup needs an in-memory cache for a new application. Its traffic is unpredictable, and the team does not want to choose node types, size clusters or plan capacity.

    Which solution will meet these requirements?
  fr: |
    Une start-up a besoin d'un cache en mémoire pour une nouvelle application. Son trafic est imprévisible, et l'équipe ne veut ni choisir de types de nœuds, ni dimensionner des clusters, ni planifier la capacité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon ElastiCache Serverless cache.", fr: "Créer un cache Amazon ElastiCache Serverless." }
    - id: b
      text: { en: "Create a node-based ElastiCache cluster with a fixed number of nodes.", fr: "Créer un cluster ElastiCache basé sur des nœuds avec un nombre fixe de nœuds." }
    - id: c
      text: { en: "Install Memcached on an Auto Scaling group of EC2 instances.", fr: "Installer Memcached sur un groupe Auto Scaling d'instances EC2." }
    - id: d
      text: { en: "Create an Amazon DynamoDB table in provisioned capacity mode.", fr: "Créer une table Amazon DynamoDB en mode de capacité provisionnée." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      ElastiCache Serverless creates a highly available cache in under a minute without provisioning instances or configuring nodes or clusters. It monitors memory, compute and network use and scales automatically, which suits unpredictable traffic.
    fr: |-
      ElastiCache Serverless crée un cache hautement disponible en moins d'une minute, sans provisionner d'instances ni configurer de nœuds ou de clusters. Il surveille l'utilisation de la mémoire, du calcul et du réseau et évolue automatiquement, ce qui convient à un trafic imprévisible.
  options:
    b:
      en: |-
        A node-based cluster requires the team to choose node types and node counts, which it wants to avoid.
      fr: |-
        Un cluster basé sur des nœuds oblige l'équipe à choisir les types et le nombre de nœuds, ce qu'elle veut éviter.
    c:
      en: |-
        Self-managed Memcached on EC2 leaves instance sizing, patching and cluster management to the team.
      fr: |-
        Memcached autogéré sur EC2 laisse à l'équipe le dimensionnement des instances, les correctifs et la gestion du cluster.
    d:
      en: |-
        A DynamoDB table is a database, not an in-memory cache, and provisioned mode requires capacity planning.
      fr: |-
        Une table DynamoDB est une base de données, et non un cache en mémoire, et le mode provisionné exige de planifier la capacité.
references:
  - title: "What is Amazon ElastiCache? - Amazon ElastiCache"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html
