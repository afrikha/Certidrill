id: clfc02-3d-kinesis-data-streams
objective: "3.7.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company receives a continuous stream of player events from millions of devices. Several custom applications must read the same events within seconds of their arrival to update leaderboards and detect cheating.

    Which AWS service should the company use to ingest the events?
  fr: |
    Une entreprise de jeux vidéo reçoit un flux continu d'événements de joueurs provenant de millions d'appareils. Plusieurs applications personnalisées doivent lire les mêmes événements quelques secondes après leur arrivée pour mettre à jour les classements et détecter la triche.

    Quel service AWS l'entreprise doit-elle utiliser pour ingérer les événements ?
body:
  options:
    - { id: a, text: "AWS Glue" }
    - { id: b, text: "Amazon Athena" }
    - { id: c, text: "Amazon Redshift" }
    - { id: d, text: "Amazon Kinesis Data Streams" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Kinesis Data Streams collects and processes large streams of data records in real time. Records are available to consumer applications within seconds, and several applications can read the same stream independently."
    fr: "Amazon Kinesis Data Streams collecte et traite de grands flux d'enregistrements de données en temps réel. Les enregistrements sont disponibles pour les applications consommatrices en quelques secondes, et plusieurs applications peuvent lire le même flux indépendamment."
  options:
    a:
      en: "AWS Glue catalogs and transforms data with ETL jobs; it is not the ingestion point for millions of devices sending events continuously."
      fr: "AWS Glue catalogue et transforme des données avec des tâches ETL ; ce n'est pas le point d'ingestion pour des millions d'appareils qui envoient des événements en continu."
    b:
      en: "Amazon Athena queries data already stored in Amazon S3; it does not ingest a real-time stream for applications to read."
      fr: "Amazon Athena interroge des données déjà stockées dans Amazon S3 ; il n'ingère pas de flux en temps réel que des applications pourraient lire."
    c:
      en: "Amazon Redshift is a data warehouse for analytical queries; it is not a stream that several applications read within seconds."
      fr: "Amazon Redshift est un entrepôt de données pour des requêtes analytiques ; ce n'est pas un flux que plusieurs applications lisent en quelques secondes."
references:
  - title: What is Amazon Kinesis Data Streams?
    url: https://docs.aws.amazon.com/streams/latest/dev/introduction.html
