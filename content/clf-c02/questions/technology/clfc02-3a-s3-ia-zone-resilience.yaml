id: clfc02-3a-s3-ia-zone-resilience
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores signed contracts in Amazon S3. The contracts are read about once a month and must be retrieved in milliseconds when requested. The contracts cannot be re-created, so they must remain available even if an entire Availability Zone is lost.

    Which S3 storage class is the MOST cost-effective choice that meets these requirements?
  fr: |
    Une entreprise stocke des contrats signés dans Amazon S3. Les contrats sont lus environ une fois par mois et doivent être récupérés en quelques millisecondes à la demande. Ils ne peuvent pas être recréés : ils doivent rester disponibles même en cas de perte d'une zone de disponibilité entière.

    Quelle classe de stockage S3 est le choix le PLUS rentable qui répond à ces exigences ?
body:
  options:
    - { id: a, text: "S3 Standard-IA" }
    - { id: b, text: "S3 One Zone-IA" }
    - { id: c, text: "S3 Standard" }
    - { id: d, text: "S3 Express One Zone" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      S3 Standard-IA stores data redundantly across multiple Availability Zones (at least three), offers millisecond access, and costs less to store than S3 Standard for data that is accessed infrequently. It therefore keeps the contracts available if one zone is lost, at a lower price than S3 Standard.
    fr: |
      S3 Standard-IA stocke les données de façon redondante dans plusieurs zones de disponibilité (au moins trois), offre un accès en quelques millisecondes et coûte moins cher en stockage que S3 Standard pour des données rarement consultées. Il garde donc les contrats disponibles en cas de perte d'une zone, à un prix inférieur à celui de S3 Standard.
  options:
    b: { en: "S3 One Zone-IA is cheaper, but it stores data in a single Availability Zone, so the contracts would be lost with that zone.", fr: "S3 One Zone-IA est moins cher, mais il stocke les données dans une seule zone de disponibilité : les contrats seraient perdus avec cette zone." }
    c: { en: "S3 Standard meets the availability and access needs, but it costs more to store than Standard-IA for data read about once a month.", fr: "S3 Standard répond aux besoins de disponibilité et d'accès, mais son stockage coûte plus cher que Standard-IA pour des données lues environ une fois par mois." }
    d: { en: "S3 Express One Zone stores data in a single Availability Zone and is designed for frequently accessed, latency-sensitive data.", fr: "S3 Express One Zone stocke les données dans une seule zone de disponibilité et est conçu pour des données fréquemment consultées et sensibles à la latence." }
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
