id: clfc02-3d-s3-lifecycle-use-cases
objective: "3.6.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores data in Amazon S3. Which two requirements can the company meet by using S3 Lifecycle rules? (Choose two.)
  fr: |
    Une entreprise stocke des données dans Amazon S3. Quelles sont les deux exigences auxquelles l'entreprise peut répondre avec des règles S3 Lifecycle ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Delete application log files automatically 30 days after they are created.", fr: "Supprimer automatiquement les fichiers journaux d'application 30 jours après leur création." } }
    - { id: b, text: { en: "Copy every new object automatically to a bucket in another AWS Region.", fr: "Copier automatiquement chaque nouvel objet vers un compartiment d'une autre Région AWS." } }
    - { id: c, text: { en: "Prevent objects from being deleted or overwritten for 5 years.", fr: "Empêcher que des objets soient supprimés ou remplacés pendant 5 ans." } }
    - { id: d, text: { en: "Move documents to S3 Glacier Flexible Retrieval one year after they are created.", fr: "Déplacer des documents vers S3 Glacier Flexible Retrieval un an après leur création." } }
    - { id: e, text: { en: "Block all public access to the objects in a bucket.", fr: "Bloquer tout accès public aux objets d'un compartiment." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "An S3 Lifecycle configuration is a set of rules that apply actions to groups of objects. Expiration actions delete objects at a set time, such as logs kept for a month, and transition actions move objects to another storage class, such as S3 Glacier Flexible Retrieval one year after creation."
    fr: "Une configuration S3 Lifecycle est un ensemble de règles qui appliquent des actions à des groupes d'objets. Les actions d'expiration suppriment des objets à un moment donné, par exemple des journaux conservés un mois, et les actions de transition déplacent des objets vers une autre classe de stockage, par exemple S3 Glacier Flexible Retrieval un an après leur création."
  options:
    b:
      en: "Copying new objects to a bucket in another Region is done with S3 Replication, not with a lifecycle rule."
      fr: "La copie des nouveaux objets vers un compartiment d'une autre Région se fait avec S3 Replication, pas avec une règle de cycle de vie."
    c:
      en: "Preventing deletion or overwrite for a retention period is done with S3 Object Lock; lifecycle rules delete or move objects, they do not protect them."
      fr: "Empêcher la suppression ou le remplacement pendant une période de rétention se fait avec S3 Object Lock ; les règles de cycle de vie suppriment ou déplacent des objets, elles ne les protègent pas."
    e:
      en: "Blocking public access is done with S3 Block Public Access settings, not with a lifecycle rule."
      fr: "Le blocage de l'accès public se fait avec les paramètres S3 Block Public Access, pas avec une règle de cycle de vie."
references:
  - title: Managing the lifecycle of objects
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html
