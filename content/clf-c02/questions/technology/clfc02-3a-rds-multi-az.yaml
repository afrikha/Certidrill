id: clfc02-3a-rds-multi-az
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL DB instance in a single Availability Zone. If that Availability Zone fails, the database must fail over automatically to another Availability Zone.

    Which solution will meet this requirement?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for MySQL dans une seule zone de disponibilité. Si cette zone de disponibilité tombe en panne, la base de données doit basculer automatiquement vers une autre zone de disponibilité.

    Quelle solution répond à ce besoin ?
body:
  options:
    - { id: a, text: { en: "Create a read replica of the DB instance in the same Availability Zone.", fr: "Créer un réplica en lecture de l'instance de base de données dans la même zone de disponibilité." } }
    - { id: b, text: { en: "Change the DB instance to a larger instance class.", fr: "Passer l'instance de base de données à une classe d'instance plus grande." } }
    - { id: c, text: { en: "Convert the DB instance to a Multi-AZ deployment.", fr: "Convertir l'instance de base de données en déploiement Multi-AZ." } }
    - { id: d, text: { en: "Take daily manual snapshots of the DB instance.", fr: "Prendre chaque jour des instantanés manuels de l'instance de base de données." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In a Multi-AZ DB instance deployment, Amazon RDS keeps a synchronously replicated standby in a different Availability Zone. If the primary or its Availability Zone fails, RDS fails over to the standby automatically.
    fr: |
      Dans un déploiement d'instance de base de données Multi-AZ, Amazon RDS conserve une instance de secours répliquée de façon synchrone dans une autre zone de disponibilité. Si l'instance principale ou sa zone de disponibilité tombe en panne, RDS bascule automatiquement vers l'instance de secours.
  options:
    a: { en: "A read replica in the same zone is lost with that zone, and it is not an automatic failover target.", fr: "Un réplica en lecture dans la même zone disparaît avec cette zone, et ce n'est pas une cible de basculement automatique." }
    b: { en: "A larger instance class adds capacity but still runs in a single Availability Zone.", fr: "Une classe d'instance plus grande ajoute de la capacité, mais s'exécute toujours dans une seule zone de disponibilité." }
    d: { en: "Snapshots allow a manual restore, which is not an automatic failover.", fr: "Les instantanés permettent une restauration manuelle, ce qui n'est pas un basculement automatique." }
references:
  - title: Multi-AZ DB instance deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
