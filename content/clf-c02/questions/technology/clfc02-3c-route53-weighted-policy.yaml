id: clfc02-3c-route53-weighted-policy
objective: "3.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is releasing a new version of its website on a separate set of servers. It wants Amazon Route 53 to send 10 % of users to the new version and 90 % to the current version, then raise the share gradually.

    Which Route 53 routing policy will meet these requirements?
  fr: |
    Une entreprise publie une nouvelle version de son site web sur un ensemble distinct de serveurs. Elle souhaite qu'Amazon Route 53 envoie 10 % des utilisateurs vers la nouvelle version et 90 % vers la version actuelle, puis augmente progressivement cette part.

    Quelle politique de routage Route 53 répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Multivalue answer routing", fr: "Routage de réponse multivaleur" }
    - id: b
      text: { en: "Failover routing", fr: "Routage de basculement" }
    - id: c
      text: { en: "Geoproximity routing", fr: "Routage par géoproximité" }
    - id: d
      text: { en: "Weighted routing", fr: "Routage pondéré" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Weighted routing sends traffic to several resources in proportions that the company specifies. Setting weights of 10 and 90 sends about 10 % of queries to the new version, and the weights can be changed later to shift more traffic.
    fr: |-
      Le routage pondéré envoie le trafic vers plusieurs ressources selon des proportions que l'entreprise définit. Des poids de 10 et 90 envoient environ 10 % des requêtes vers la nouvelle version, et les poids peuvent être modifiés ensuite pour déplacer davantage de trafic.
  options:
    a:
      en: |-
        Multivalue answer routing returns up to eight healthy records at random; it cannot enforce a 10/90 split.
      fr: |-
        Le routage de réponse multivaleur renvoie au hasard jusqu'à huit enregistrements sains ; il ne peut pas imposer une répartition 10/90.
    b:
      en: |-
        Failover routing is active-passive: the new version would receive traffic only if the current one failed.
      fr: |-
        Le routage de basculement est actif-passif : la nouvelle version ne recevrait du trafic qu'en cas de défaillance de la version actuelle.
    c:
      en: |-
        Geoproximity routing routes users by the location of resources; it does not split traffic between two versions by percentage.
      fr: |-
        Le routage par géoproximité achemine les utilisateurs selon l'emplacement des ressources ; il ne répartit pas le trafic entre deux versions par pourcentage.
references:
  - title: "Choosing a routing policy - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html
