id: clfc02-3d-comprehend-sentiment
objective: "3.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer receives thousands of written product reviews every day. It wants to determine automatically whether each review is positive, negative, neutral, or mixed.

    Which AWS service should the retailer use?
  fr: |
    Un détaillant en ligne reçoit chaque jour des milliers d'avis écrits sur ses produits. Il veut déterminer automatiquement si chaque avis est positif, négatif, neutre ou mitigé.

    Quel service AWS le détaillant doit-il utiliser ?
body:
  options:
    - { id: a, text: "Amazon Comprehend" }
    - { id: b, text: "Amazon Translate" }
    - { id: c, text: "Amazon Lex" }
    - { id: d, text: "Amazon Transcribe" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Comprehend uses natural language processing to extract insights from text. Its sentiment analysis returns whether a text is positive, negative, neutral, or mixed, and it can also detect entities, key phrases, and the dominant language."
    fr: "Amazon Comprehend utilise le traitement du langage naturel pour extraire des informations d'un texte. Son analyse des sentiments indique si un texte est positif, négatif, neutre ou mitigé, et il peut aussi détecter des entités, des expressions clés et la langue dominante."
  options:
    b:
      en: "Amazon Translate translates text between languages; it does not classify the sentiment of the text."
      fr: "Amazon Translate traduit du texte d'une langue à une autre ; il ne classe pas le sentiment du texte."
    c:
      en: "Amazon Lex builds conversational interfaces such as chatbots; it is not used to analyze the sentiment of a batch of reviews."
      fr: "Amazon Lex crée des interfaces conversationnelles comme des chatbots ; il ne sert pas à analyser le sentiment d'un lot d'avis."
    d:
      en: "Amazon Transcribe converts speech in audio files into text; the reviews are already written text."
      fr: "Amazon Transcribe convertit la parole de fichiers audio en texte ; les avis sont déjà du texte écrit."
references:
  - title: What is Amazon Comprehend?
    url: https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html
