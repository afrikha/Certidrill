id: clfc02-3a-identify-on-premises
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank runs all its applications on virtual machines in its own data center. It uses virtualization and resource management software so that internal teams can request virtual machines through a self-service portal. The bank uses no public cloud services.

    Which deployment model does the bank use?
  fr: |
    Une banque exécute toutes ses applications sur des machines virtuelles dans son propre centre de données. Elle utilise des logiciels de virtualisation et de gestion des ressources pour que les équipes internes puissent demander des machines virtuelles au moyen d'un portail en libre-service. La banque n'utilise aucun service de cloud public.

    Quel modèle de déploiement la banque utilise-t-elle ?
body:
  options:
    - { id: a, text: { en: "Cloud", fr: "Cloud" } }
    - { id: b, text: { en: "Hybrid", fr: "Hybride" } }
    - { id: c, text: { en: "On-premises", fr: "Sur site" } }
    - { id: d, text: { en: "Multi-Region", fr: "Multirégion" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Deploying resources in the company's own facilities with virtualization and resource management tools is the on-premises model, also called private cloud. Self-service and virtualization do not make it a cloud deployment, because the resources stay in the bank's data center.
    fr: |
      Déployer des ressources dans les propres locaux de l'entreprise avec des outils de virtualisation et de gestion des ressources correspond au modèle sur site, aussi appelé cloud privé. Le libre-service et la virtualisation n'en font pas un déploiement cloud, car les ressources restent dans le centre de données de la banque.
  options:
    a: { en: "The bank's applications do not run in the cloud, so this is not the cloud model, even with a self-service portal.", fr: "Les applications de la banque ne s'exécutent pas dans le cloud : ce n'est pas le modèle cloud, même avec un portail en libre-service." }
    b: { en: "A hybrid deployment connects on-premises resources to cloud resources, and the bank uses no cloud services.", fr: "Un déploiement hybride relie des ressources sur site à des ressources cloud, or la banque n'utilise aucun service cloud." }
    d: { en: "Multi-Region describes running in several AWS Regions, not a deployment model for a single data center.", fr: "Multirégion désigne une exécution dans plusieurs Régions AWS, pas un modèle de déploiement pour un seul centre de données." }
references:
  - title: Types of cloud computing
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/types-of-cloud-computing.html
