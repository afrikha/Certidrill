id: clfc02-3a-one-time-bucket
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator needs one Amazon S3 bucket to share files with an auditor for one week. The bucket will be deleted afterward and will never be created again.

    Which approach will meet this requirement with the LEAST effort?
  fr: |
    Un administrateur a besoin d'un compartiment Amazon S3 pour partager des fichiers avec un auditeur pendant une semaine. Le compartiment sera supprimé ensuite et ne sera jamais recréé.

    Quelle approche répond à ce besoin avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Write an AWS CloudFormation template for the bucket and store it in version control.", fr: "Écrire un modèle AWS CloudFormation pour le compartiment et le stocker dans un système de gestion de versions." } }
    - { id: b, text: { en: "Build an AWS CDK application that defines the bucket and deploy it.", fr: "Créer une application AWS CDK qui définit le compartiment, puis la déployer." } }
    - { id: c, text: { en: "Create the bucket once in the AWS Management Console.", fr: "Créer le compartiment une seule fois dans l'AWS Management Console." } }
    - { id: d, text: { en: "Use AWS CloudFormation StackSets to deploy the bucket to every Region.", fr: "Utiliser AWS CloudFormation StackSets pour déployer le compartiment dans chaque Région." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A task that is done once and never repeated is a one-time operation. Creating the bucket directly in the console takes a few clicks, while infrastructure as code pays off only when the same resources must be created again, reviewed, or kept consistent.
    fr: |
      Une tâche effectuée une seule fois et jamais répétée est une opération ponctuelle. Créer le compartiment directement dans la console prend quelques clics, alors que l'infrastructure as code n'est rentable que lorsque les mêmes ressources doivent être recréées, relues ou maintenues cohérentes.
  options:
    a: { en: "A template and version control add work that brings value only if the bucket is created repeatedly.", fr: "Un modèle et la gestion de versions ajoutent du travail qui n'a de valeur que si le compartiment est créé de façon répétée." }
    b: { en: "Writing and deploying a CDK application is more effort than creating a single bucket that is never recreated.", fr: "Écrire et déployer une application CDK demande plus d'effort que créer un seul compartiment qui ne sera jamais recréé." }
    d: { en: "StackSets deploy stacks across accounts and Regions, which adds work and creates buckets the administrator does not need.", fr: "StackSets déploie des piles dans plusieurs comptes et Régions, ce qui ajoute du travail et crée des compartiments dont l'administrateur n'a pas besoin." }
references:
  - title: What is CloudFormation?
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html
