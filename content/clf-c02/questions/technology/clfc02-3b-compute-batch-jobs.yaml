id: clfc02-3b-compute-batch-jobs
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research company needs to run thousands of genome analysis jobs that each run for several hours. AWS must queue the jobs and provision the right amount and type of compute resources based on the requirements of the submitted jobs.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise de recherche doit exécuter des milliers de tâches d'analyse génomique qui durent chacune plusieurs heures. AWS doit mettre les tâches en file d'attente et provisionner la quantité et le type de ressources de calcul adaptés aux besoins des tâches soumises.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Lightsail" }
    - { id: b, text: "AWS Batch" }
    - { id: c, text: "AWS Lambda" }
    - { id: d, text: "AWS Elastic Beanstalk" }
answer: { optionId: b }
explanation:
  correct:
    en: "Jobs are submitted to AWS Batch job queues, and AWS Batch automatically provisions compute resources, such as Amazon EC2 instances or Fargate resources, and distributes the work based on the quantity and scale of the jobs. The company does not need to install or manage its own batch scheduling software."
    fr: "Les tâches sont soumises à des files d'attente de tâches AWS Batch, et AWS Batch provisionne automatiquement les ressources de calcul, comme des instances Amazon EC2 ou des ressources Fargate, et répartit le travail selon la quantité et l'ampleur des tâches. L'entreprise n'a pas à installer ni à gérer son propre logiciel d'ordonnancement."
  options:
    a:
      en: "Lightsail provides simple bundled servers; it does not queue jobs or provision compute according to job requirements."
      fr: "Lightsail fournit des serveurs forfaitaires simples ; il ne met pas de tâches en file d'attente et ne provisionne pas le calcul selon les besoins des tâches."
    c:
      en: "Lambda runs functions in response to events; it does not queue jobs and choose compute resources for each one, and jobs of several hours are far longer than the maximum timeout of a Lambda function (minutes, not hours)."
      fr: "Lambda exécute des fonctions en réponse à des événements ; il ne met pas de tâches en file d'attente pour choisir les ressources de calcul de chacune, et des tâches de plusieurs heures sont bien plus longues que la durée maximale d'une fonction Lambda (des minutes, pas des heures)."
    d:
      en: "Elastic Beanstalk deploys and scales web applications and workers from uploaded code; it does not provide job queues that size compute for each submitted job."
      fr: "Elastic Beanstalk déploie et met à l'échelle des applications web et des workers à partir du code chargé ; il ne fournit pas de files de tâches qui dimensionnent le calcul pour chaque tâche soumise."
references:
  - title: What is AWS Batch?
    url: https://docs.aws.amazon.com/batch/latest/userguide/what-is-batch.html
