id: clfc02-3a-regional-edge-cache
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company serves static images through Amazon CloudFront from an origin that runs on Amazon EC2 instances behind a load balancer. A user requests an image that is not in the cache of the edge location that receives the request.

    Where does CloudFront look for the image next, before it contacts the origin?
  fr: |
    Une entreprise diffuse des images statiques au moyen d'Amazon CloudFront depuis une origine qui s'exécute sur des instances Amazon EC2 derrière un équilibreur de charge. Un utilisateur demande une image qui n'est pas dans le cache de l'emplacement périphérique qui reçoit la requête.

    Où CloudFront cherche-t-il ensuite l'image, avant de contacter l'origine ?
body:
  options:
    - { id: a, text: { en: "In another Availability Zone of the origin's Region", fr: "Dans une autre zone de disponibilité de la Région de l'origine" } }
    - { id: b, text: { en: "In a regional edge cache, which sits between the edge locations and the origin", fr: "Dans un cache périphérique régional, situé entre les emplacements périphériques et l'origine" } }
    - { id: c, text: { en: "In every other edge location in the world, one after the other", fr: "Dans tous les autres emplacements périphériques du monde, l'un après l'autre" } }
    - { id: d, text: { en: "In an Amazon S3 bucket that CloudFront creates in each Region", fr: "Dans un compartiment Amazon S3 que CloudFront crée dans chaque Région" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Regional edge caches are CloudFront locations between the origin and the edge locations, with larger caches that keep objects longer. When an edge location does not have the object, it requests it from the regional edge cache, and only if that cache does not have it either does CloudFront fetch it from the origin.
    fr: |
      Les caches périphériques régionaux sont des emplacements CloudFront situés entre l'origine et les emplacements périphériques ; leurs caches plus grands conservent les objets plus longtemps. Quand un emplacement périphérique ne dispose pas de l'objet, il le demande au cache périphérique régional, et c'est seulement si ce cache ne l'a pas non plus que CloudFront le récupère auprès de l'origine.
  options:
    a: { en: "Availability Zones host the origin's resources; CloudFront's caching layers are its edge locations and regional edge caches.", fr: "Les zones de disponibilité hébergent les ressources de l'origine ; les niveaux de cache de CloudFront sont ses emplacements périphériques et ses caches périphériques régionaux." }
    c: { en: "CloudFront does not search all edge locations; a cache miss goes up to a regional edge cache and then to the origin.", fr: "CloudFront ne parcourt pas tous les emplacements périphériques : un défaut de cache remonte vers un cache périphérique régional, puis vers l'origine." }
    d: { en: "CloudFront does not create S3 buckets; an S3 bucket can be an origin that the customer owns.", fr: "CloudFront ne crée pas de compartiments S3 ; un compartiment S3 peut être une origine qui appartient au client." }
references:
  - title: How CloudFront delivers content
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HowCloudFrontWorks.html
