id: clfc02-3b-relational-aurora-identify
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company needs a fully managed relational database that is compatible with MySQL and PostgreSQL and that stores data in a storage layer replicated across three Availability Zones.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise a besoin d'une base de données relationnelle entièrement gérée, compatible avec MySQL et PostgreSQL, qui stocke les données dans une couche de stockage répliquée sur trois zones de disponibilité.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon DynamoDB" }
    - { id: b, text: "Amazon Neptune" }
    - { id: c, text: "Amazon ElastiCache" }
    - { id: d, text: "Amazon Aurora" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Aurora is a fully managed relational database engine compatible with MySQL and PostgreSQL. Its cluster volume stores copies of the data across three Availability Zones in a Region, and the storage grows automatically as data is added."
    fr: "Amazon Aurora est un moteur de base de données relationnelle entièrement géré compatible avec MySQL et PostgreSQL. Son volume de cluster stocke des copies des données dans trois zones de disponibilité d'une Région, et le stockage s'agrandit automatiquement à mesure que des données sont ajoutées."
  options:
    a:
      en: "DynamoDB is a NoSQL key-value and document database, not a MySQL- or PostgreSQL-compatible relational database."
      fr: "DynamoDB est une base NoSQL clé-valeur et document, pas une base relationnelle compatible avec MySQL ou PostgreSQL."
    b:
      en: "Neptune is a graph database, not a relational database compatible with MySQL and PostgreSQL."
      fr: "Neptune est une base orientée graphe, pas une base relationnelle compatible avec MySQL et PostgreSQL."
    c:
      en: "ElastiCache is an in-memory cache and data store, not a relational database."
      fr: "ElastiCache est un cache et un magasin de données en mémoire, pas une base de données relationnelle."
references:
  - title: What is Amazon Aurora?
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html
  - title: Amazon Aurora storage
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.StorageReliability.html
