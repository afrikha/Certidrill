id: clfc02-3a-cloud-model-definition
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In which cloud deployment model is an application fully deployed in the cloud, with all parts of the application running in the cloud?
  fr: |
    Dans quel modèle de déploiement de cloud une application est-elle entièrement déployée dans le cloud, toutes ses parties s'exécutant dans le cloud ?
body:
  options:
    - { id: a, text: { en: "Hybrid deployment", fr: "Déploiement hybride" } }
    - { id: b, text: { en: "On-premises deployment", fr: "Déploiement sur site" } }
    - { id: c, text: { en: "Private cloud deployment", fr: "Déploiement en cloud privé" } }
    - { id: d, text: { en: "Cloud deployment", fr: "Déploiement cloud" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In the cloud deployment model, all parts of the application run in the cloud. The application was either built in the cloud or migrated there from existing infrastructure.
    fr: |
      Dans le modèle de déploiement cloud, toutes les parties de l'application s'exécutent dans le cloud. L'application a été créée dans le cloud ou y a été migrée depuis une infrastructure existante.
  options:
    a: { en: "A hybrid deployment connects cloud resources with resources that stay outside the cloud, so not all parts run in the cloud.", fr: "Un déploiement hybride relie des ressources cloud à des ressources qui restent hors du cloud : toutes les parties ne s'exécutent pas dans le cloud." }
    b: { en: "An on-premises deployment runs resources in the company's own data center, not in the cloud.", fr: "Un déploiement sur site exécute les ressources dans le propre centre de données de l'entreprise, pas dans le cloud." }
    c: { en: "Private cloud is another name for the on-premises model, which uses virtualization in the company's own facilities.", fr: "Le cloud privé est un autre nom du modèle sur site, qui utilise la virtualisation dans les locaux de l'entreprise." }
references:
  - title: Types of cloud computing
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/types-of-cloud-computing.html
