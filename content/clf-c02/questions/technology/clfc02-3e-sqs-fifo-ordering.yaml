id: clfc02-3e-sqs-fifo-ordering
objective: "3.8.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An order-processing application sends messages to a queue. The orders must be processed in the exact order in which they are sent, and duplicate messages must not be introduced into the queue.

    Which solution will meet these requirements?
  fr: |
    Une application de traitement des commandes envoie des messages dans une file d'attente. Les commandes doivent être traitées exactement dans l'ordre de leur envoi, et aucun message en double ne doit être introduit dans la file d'attente.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "An Amazon SQS standard queue", fr: "Une file d'attente standard Amazon SQS" } }
    - { id: b, text: { en: "An Amazon SNS standard topic", fr: "Une rubrique standard Amazon SNS" } }
    - { id: c, text: { en: "An Amazon SQS FIFO queue", fr: "Une file d'attente FIFO Amazon SQS" } }
    - { id: d, text: { en: "An Amazon SQS standard queue with a dead-letter queue", fr: "Une file d'attente standard Amazon SQS avec une file d'attente de lettres mortes" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon SQS FIFO (first-in, first-out) queues strictly preserve the order in which messages are sent and received, and they provide exactly-once processing: duplicates are not introduced into the queue."
    fr: "Les files d'attente FIFO (premier entré, premier sorti) Amazon SQS préservent strictement l'ordre d'envoi et de réception des messages, et elles assurent un traitement exactement une fois : aucun doublon n'est introduit dans la file d'attente."
  options:
    a:
      en: "Standard queues provide at-least-once delivery and best-effort ordering, so messages can arrive out of order or more than once."
      fr: "Les files d'attente standard assurent une remise au moins une fois et un ordre au mieux : les messages peuvent arriver dans le désordre ou plusieurs fois."
    b:
      en: "An SNS standard topic pushes messages to subscribers without a strict order guarantee, and it is not a queue that consumers process from."
      fr: "Une rubrique standard SNS envoie les messages aux abonnés sans garantie d'ordre strict, et ce n'est pas une file d'attente que les consommateurs traitent."
    d:
      en: "A dead-letter queue only receives messages that could not be processed; the standard queue still does not guarantee order or prevent duplicates."
      fr: "Une file d'attente de lettres mortes reçoit seulement les messages qui n'ont pas pu être traités ; la file d'attente standard ne garantit toujours pas l'ordre et n'empêche pas les doublons."
references:
  - title: Amazon SQS FIFO queues
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-fifo-queues.html
