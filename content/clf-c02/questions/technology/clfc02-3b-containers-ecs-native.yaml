id: clfc02-3b-containers-ecs-native
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is packaging its applications in Docker containers. The company does not use Kubernetes and wants a fully managed AWS container orchestration service that is deeply integrated with other AWS services.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise conditionne ses applications dans des conteneurs Docker. L'entreprise n'utilise pas Kubernetes et veut un service AWS d'orchestration de conteneurs entièrement géré et étroitement intégré aux autres services AWS.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Elastic Container Registry (Amazon ECR)" }
    - { id: b, text: "Amazon Elastic Kubernetes Service (Amazon EKS)" }
    - { id: c, text: "Amazon Elastic Container Service (Amazon ECS)" }
    - { id: d, text: "AWS Batch" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon ECS is a fully managed container orchestration service that helps deploy, manage, and scale containerized applications. It runs containers on capacity such as AWS Fargate or Amazon EC2 and works with services such as Amazon ECR, Elastic Load Balancing, and Amazon CloudWatch, without requiring Kubernetes."
    fr: "Amazon ECS est un service d'orchestration de conteneurs entièrement géré qui aide à déployer, gérer et mettre à l'échelle des applications conteneurisées. Il exécute les conteneurs sur une capacité comme AWS Fargate ou Amazon EC2 et fonctionne avec des services comme Amazon ECR, Elastic Load Balancing et Amazon CloudWatch, sans nécessiter Kubernetes."
  options:
    a:
      en: "Amazon ECR stores and manages container images; it does not run or orchestrate containers."
      fr: "Amazon ECR stocke et gère des images de conteneurs ; il n'exécute ni n'orchestre de conteneurs."
    b:
      en: "Amazon EKS runs Kubernetes, which the company does not use; ECS is the AWS-native orchestrator that does not require Kubernetes."
      fr: "Amazon EKS exécute Kubernetes, que l'entreprise n'utilise pas ; ECS est l'orchestrateur natif AWS qui ne nécessite pas Kubernetes."
    d:
      en: "AWS Batch schedules batch computing jobs; it is not a general container orchestration service for applications."
      fr: "AWS Batch planifie des tâches de calcul par lots ; ce n'est pas un service général d'orchestration de conteneurs pour des applications."
references:
  - title: What is Amazon Elastic Container Service?
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html
