id: clfc02-3c-sct-data-warehouse
objective: "3.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company plans to move an on-premises Teradata data warehouse to Amazon Redshift. Before it moves the data, it must convert the source warehouse schema to Amazon Redshift and get guidance for objects that cannot be converted automatically.

    Which AWS tool is designed for this task?
  fr: |
    Une entreprise prévoit de déplacer un entrepôt de données Teradata sur site vers Amazon Redshift. Avant de déplacer les données, elle doit convertir le schéma de l'entrepôt source vers Amazon Redshift et obtenir des recommandations pour les objets qui ne peuvent pas être convertis automatiquement.

    Quel outil AWS est conçu pour cette tâche ?
body:
  options:
    - id: a
      text: { en: "AWS Glue", fr: "AWS Glue" }
    - id: b
      text: { en: "AWS Schema Conversion Tool (AWS SCT)", fr: "AWS Schema Conversion Tool (AWS SCT)" }
    - id: c
      text: { en: "Amazon Athena", fr: "Amazon Athena" }
    - id: d
      text: { en: "AWS Application Migration Service", fr: "AWS Application Migration Service" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS SCT converts an existing database schema from one engine to another, including data warehouse schemas such as Teradata, Oracle or Netezza to Amazon Redshift. When an object cannot be converted automatically, it provides guidance for creating the equivalent schema manually.
    fr: |-
      AWS SCT convertit un schéma de base de données existant d'un moteur vers un autre, y compris des schémas d'entrepôt de données comme Teradata, Oracle ou Netezza vers Amazon Redshift. Lorsqu'un objet ne peut pas être converti automatiquement, il fournit des recommandations pour créer manuellement le schéma équivalent.
  options:
    a:
      en: |-
        AWS Glue is a data integration (ETL) service; it does not convert a data warehouse schema from one engine to another.
      fr: |-
        AWS Glue est un service d'intégration de données (ETL) ; il ne convertit pas un schéma d'entrepôt de données d'un moteur vers un autre.
    c:
      en: |-
        Athena runs SQL queries on data in Amazon S3; it does not convert schemas.
      fr: |-
        Athena exécute des requêtes SQL sur des données dans Amazon S3 ; il ne convertit pas de schémas.
    d:
      en: |-
        Application Migration Service rehosts servers on EC2 without changes; it does not convert schemas to a new engine.
      fr: |-
        Application Migration Service réhéberge des serveurs sur EC2 sans modification ; il ne convertit pas de schémas vers un nouveau moteur.
references:
  - title: "What is the AWS Schema Conversion Tool? - AWS Schema Conversion Tool"
    url: https://docs.aws.amazon.com/SchemaConversionTool/latest/userguide/CHAP_Welcome.html
