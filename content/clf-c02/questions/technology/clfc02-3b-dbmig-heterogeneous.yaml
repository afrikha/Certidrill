id: clfc02-3b-dbmig-heterogeneous
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company plans several database migrations to AWS.

    Which migration is heterogeneous and therefore requires the database schema and code to be converted before the data is migrated?
  fr: |
    Une entreprise prévoit plusieurs migrations de bases de données vers AWS.

    Quelle migration est hétérogène et exige donc de convertir le schéma et le code de la base de données avant de migrer les données ?
body:
  options:
    - { id: a, text: { en: "On-premises MySQL to Amazon RDS for MySQL", fr: "MySQL sur site vers Amazon RDS for MySQL" } }
    - { id: b, text: { en: "Microsoft SQL Server on Amazon EC2 to Amazon RDS for SQL Server", fr: "Microsoft SQL Server sur Amazon EC2 vers Amazon RDS for SQL Server" } }
    - { id: c, text: { en: "On-premises PostgreSQL to Amazon RDS for PostgreSQL", fr: "PostgreSQL sur site vers Amazon RDS for PostgreSQL" } }
    - { id: d, text: { en: "On-premises Oracle Database to Amazon Aurora PostgreSQL-Compatible Edition", fr: "Oracle Database sur site vers Amazon Aurora PostgreSQL-Compatible Edition" } }
answer: { optionId: d }
explanation:
  correct:
    en: "In a heterogeneous migration, the source and target use different database engines, such as Oracle and PostgreSQL. Tables, data types, stored procedures, and other code must first be converted to the target engine, for example with DMS Schema Conversion, and then AWS DMS migrates the data."
    fr: "Dans une migration hétérogène, la source et la cible utilisent des moteurs de base de données différents, comme Oracle et PostgreSQL. Les tables, les types de données, les procédures stockées et le reste du code doivent d'abord être convertis pour le moteur cible, par exemple avec DMS Schema Conversion, puis AWS DMS migre les données."
  options:
    a:
      en: "MySQL to RDS for MySQL keeps the same engine: it is a homogeneous migration with no schema conversion."
      fr: "MySQL vers RDS for MySQL conserve le même moteur : c'est une migration homogène sans conversion de schéma."
    b:
      en: "SQL Server to RDS for SQL Server keeps the same engine: it is a homogeneous migration."
      fr: "SQL Server vers RDS for SQL Server conserve le même moteur : c'est une migration homogène."
    c:
      en: "PostgreSQL to RDS for PostgreSQL keeps the same engine: it is a homogeneous migration."
      fr: "PostgreSQL vers RDS for PostgreSQL conserve le même moteur : c'est une migration homogène."
references:
  - title: Converting database schemas using DMS Schema Conversion
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html
