id: clfc02-3a-asg-az-failure
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs Amazon EC2 instances in an Auto Scaling group that spans two Availability Zones. The group uses the default Availability Zone distribution settings. One of the Availability Zones becomes unavailable, and launches in that zone fail.

    What does Amazon EC2 Auto Scaling do?
  fr: |
    Une entreprise exécute des instances Amazon EC2 dans un groupe Auto Scaling qui couvre deux zones de disponibilité. Le groupe utilise les paramètres de répartition entre zones de disponibilité par défaut. L'une des zones de disponibilité devient indisponible, et les lancements dans cette zone échouent.

    Que fait Amazon EC2 Auto Scaling ?
body:
  options:
    - { id: a, text: { en: "It waits until the unavailable Availability Zone recovers before it launches any instance.", fr: "Il attend que la zone de disponibilité indisponible soit rétablie avant de lancer une instance." } }
    - { id: b, text: { en: "It moves the group to another AWS Region.", fr: "Il déplace le groupe vers une autre Région AWS." } }
    - { id: c, text: { en: "It reduces the desired capacity of the group by half.", fr: "Il réduit de moitié la capacité souhaitée du groupe." } }
    - { id: d, text: { en: "It launches new instances in the Availability Zone that is not affected to keep the desired capacity.", fr: "Il lance de nouvelles instances dans la zone de disponibilité non affectée pour maintenir la capacité souhaitée." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Auto Scaling tries to keep the desired capacity of the group. With the default balanced best effort distribution, when launches fail in one Availability Zone, Auto Scaling launches instances in another healthy zone of the group, so capacity shifts to the unaffected zone.
    fr: |
      Auto Scaling cherche à maintenir la capacité souhaitée du groupe. Avec la répartition par défaut (balanced best effort), quand les lancements échouent dans une zone de disponibilité, Auto Scaling lance des instances dans une autre zone saine du groupe : la capacité se déplace vers la zone non affectée.
  options:
    a: { en: "Only the non-default balanced only strategy keeps trying in the failing zone; with the default settings, Auto Scaling launches the capacity in the healthy zone.", fr: "Seule la stratégie balanced only, qui n'est pas celle par défaut, continue d'essayer dans la zone défaillante ; avec les paramètres par défaut, Auto Scaling lance la capacité dans la zone saine." }
    b: { en: "An Auto Scaling group belongs to one Region and never moves to another Region by itself.", fr: "Un groupe Auto Scaling appartient à une seule Région et ne se déplace jamais de lui-même vers une autre Région." }
    c: { en: "Auto Scaling keeps the desired capacity; it does not lower it because a zone is lost.", fr: "Auto Scaling maintient la capacité souhaitée ; il ne la réduit pas à cause de la perte d'une zone." }
references:
  - title: Auto Scaling group Availability Zone distribution
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-availability-zone-balanced.html
