id: clfc02-3d-efs-linux-shared
objective: "3.6.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application on several Linux-based Amazon EC2 instances in multiple Availability Zones. All the instances must mount the same shared storage at the same time and read and write the same files.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise exécute une application web sur plusieurs instances Amazon EC2 Linux réparties dans plusieurs zones de disponibilité. Toutes les instances doivent monter le même stockage partagé en même temps, et lire et écrire les mêmes fichiers.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "Amazon Elastic Block Store (Amazon EBS)" }
    - { id: b, text: "Amazon Elastic File System (Amazon EFS)" }
    - { id: c, text: { en: "Amazon EC2 instance store", fr: "Stockage d'instance Amazon EC2" } }
    - { id: d, text: "Amazon S3 Glacier Flexible Retrieval" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EFS is a managed file system that Linux instances mount over the NFS protocol. Many instances can access the same files at the same time, and a Regional file system stores data redundantly across multiple Availability Zones."
    fr: "Amazon EFS est un système de fichiers géré que les instances Linux montent via le protocole NFS. De nombreuses instances peuvent accéder aux mêmes fichiers en même temps, et un système de fichiers régional stocke les données de manière redondante dans plusieurs zones de disponibilité."
  options:
    a:
      en: "An EBS volume is block storage that lives in one Availability Zone and is normally attached to a single instance; it is not a shared file system for instances in several Availability Zones."
      fr: "Un volume EBS est un stockage en bloc situé dans une seule zone de disponibilité et normalement attaché à une seule instance ; ce n'est pas un système de fichiers partagé entre des instances de plusieurs zones de disponibilité."
    c:
      en: "Instance store is temporary block storage on the host of one instance; other instances cannot access it and the data does not persist when the instance stops."
      fr: "Le stockage d'instance est un stockage en bloc temporaire situé sur l'hôte d'une instance ; les autres instances ne peuvent pas y accéder et les données ne persistent pas à l'arrêt de l'instance."
    d:
      en: "S3 Glacier Flexible Retrieval is an archive storage class for objects that must be restored before they are read; it is not a mounted file system."
      fr: "S3 Glacier Flexible Retrieval est une classe de stockage d'archivage pour des objets qui doivent être restaurés avant d'être lus ; ce n'est pas un système de fichiers monté."
references:
  - title: What is Amazon Elastic File System?
    url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
