id: clfc02-3e-support-unified-ops-ime
objective: "3.8.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs mission-critical workloads on AWS. When a critical system is down, it wants an AWS Incident Management Engineer to engage within 5 minutes.

    Which AWS Support plan includes this assistance?
  fr: |
    Une société de services financiers exécute des charges de travail critiques sur AWS. Lorsqu'un système critique est en panne, elle veut qu'un ingénieur de gestion des incidents (Incident Management Engineer) AWS intervienne dans un délai de 5 minutes.

    Quel plan AWS Support inclut cette assistance ?
body:
  options:
    - { id: a, text: { en: "AWS Business Support+", fr: "AWS Business Support+" } }
    - { id: b, text: { en: "Basic Support", fr: "Basic Support" } }
    - { id: c, text: { en: "AWS Enterprise Support", fr: "AWS Enterprise Support" } }
    - { id: d, text: { en: "AWS Unified Operations", fr: "AWS Unified Operations" } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Unified Operations includes Incident Management Engineers, with a response in less than 5 minutes for mission-critical system-down cases. It also adds a designated Technical Account Manager, Domain Specialist Engineers and critical workload reviews."
    fr: "AWS Unified Operations inclut des ingénieurs de gestion des incidents (Incident Management Engineers), avec une réponse en moins de 5 minutes pour les cas de panne de système critique. Il ajoute aussi un Technical Account Manager désigné, des ingénieurs spécialistes de domaine (Domain Specialist Engineers) et des revues des charges de travail critiques."
  options:
    a:
      en: "Business Support+ answers business-critical system-down cases in less than 30 minutes and does not include Incident Management Engineers."
      fr: "Business Support+ répond aux cas de panne de système critique pour l'activité en moins de 30 minutes et n'inclut pas d'ingénieurs de gestion des incidents."
    b:
      en: "Basic Support provides no technical support cases at all."
      fr: "Basic Support ne fournit aucun cas de support technique."
    c:
      en: "Enterprise Support answers critical cases in less than 15 minutes with a designated TAM, but it does not include Incident Management Engineers."
      fr: "Enterprise Support répond aux cas critiques en moins de 15 minutes avec un TAM désigné, mais il n'inclut pas d'ingénieurs de gestion des incidents."
references:
  - title: AWS Support plan comparison
    url: https://aws.amazon.com/premiumsupport/plans/
