id: clfc02-2b-geo-outposts-own-datacenter
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank operates in a country where a law requires its customer data to stay in the bank's own data center. The bank wants to run its workloads with the same AWS services, APIs and tools that it uses in AWS Regions.

    Which AWS solution will meet these requirements?
  fr: |
    Une banque exerce dans un pays où une loi impose que les données de ses clients restent dans son propre centre de données. La banque veut exécuter ses charges de travail avec les mêmes services, API et outils AWS que ceux qu'elle utilise dans les Régions AWS.

    Quelle solution AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon CloudFront with an origin in the closest AWS Region", fr: "Amazon CloudFront avec une origine dans la Région AWS la plus proche" }
    - id: b
      text: { en: "AWS Direct Connect to the closest AWS Region", fr: "AWS Direct Connect vers la Région AWS la plus proche" }
    - id: c
      text: { en: "AWS Local Zones", fr: "AWS Local Zones" }
    - id: d
      text: { en: "AWS Outposts", fr: "AWS Outposts" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Outposts is a fully managed service that extends AWS infrastructure, services, APIs and tools to customer premises. Resources such as EC2 instances, EBS volumes and S3 buckets on the Outpost use local compute and storage at the bank's site, with the same programming interfaces as in AWS Regions."
    fr: "AWS Outposts est un service entièrement géré qui étend l'infrastructure, les services, les API et les outils AWS aux locaux du client. Les ressources comme les instances EC2, les volumes EBS et les compartiments S3 de l'Outpost utilisent le calcul et le stockage locaux sur le site de la banque, avec les mêmes interfaces de programmation que dans les Régions AWS."
  options:
    a:
      en: "CloudFront caches content at edge locations; the data would still be stored in a Region, outside the bank's data center."
      fr: "CloudFront met le contenu en cache dans des emplacements périphériques ; les données seraient toujours stockées dans une Région, hors du centre de données de la banque."
    b:
      en: "Direct Connect provides a private network connection, but the data would be stored in a Region outside the bank's data center."
      fr: "Direct Connect fournit une connexion réseau privée, mais les données seraient stockées dans une Région hors du centre de données de la banque."
    c:
      en: "Local Zones are AWS-operated infrastructure in metropolitan areas, not equipment in the bank's own data center."
      fr: "Les Local Zones sont une infrastructure exploitée par AWS dans des zones métropolitaines, pas un équipement dans le centre de données de la banque."
references:
  - title: "What is AWS Outposts?"
    url: https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html
