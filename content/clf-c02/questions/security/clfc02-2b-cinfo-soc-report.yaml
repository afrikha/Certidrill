id: clfc02-2b-cinfo-soc-report
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An external auditor asks a company for the AWS SOC 2 report that covers the AWS services the company uses.

    Where can the company get this report?
  fr: |
    Un auditeur externe demande à une entreprise le rapport SOC 2 d'AWS qui couvre les services AWS qu'elle utilise.

    Où l'entreprise peut-elle obtenir ce rapport ?
body:
  options:
    - id: a
      text: { en: "AWS Health Dashboard", fr: "AWS Health Dashboard" }
    - id: b
      text: { en: "AWS Config", fr: "AWS Config" }
    - id: c
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
    - id: d
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Artifact gives on-demand access to AWS security and compliance reports, such as SOC reports, PCI reports and ISO certifications. The company can download the report and share it with its auditor."
    fr: "AWS Artifact donne un accès à la demande aux rapports de sécurité et de conformité d'AWS, comme les rapports SOC, les rapports PCI et les certifications ISO. L'entreprise peut télécharger le rapport et le transmettre à son auditeur."
  options:
    a:
      en: "The AWS Health Dashboard shows events that affect AWS services and the account, not compliance reports."
      fr: "AWS Health Dashboard affiche les événements qui touchent les services AWS et le compte, pas les rapports de conformité."
    b:
      en: "AWS Config evaluates the configuration of the company's own resources; it does not provide AWS audit reports."
      fr: "AWS Config évalue la configuration des ressources de l'entreprise ; il ne fournit pas les rapports d'audit d'AWS."
    c:
      en: "Trusted Advisor gives best-practice recommendations for the account, not third-party audit reports of AWS."
      fr: "Trusted Advisor donne des recommandations de bonnes pratiques pour le compte, pas les rapports d'audit tiers d'AWS."
references:
  - title: "What is AWS Artifact?"
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
