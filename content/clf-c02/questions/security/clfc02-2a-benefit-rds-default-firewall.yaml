id: clfc02-2a-benefit-rds-default-firewall
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company creates a new Amazon RDS DB instance. Which statement describes network access to the databases on the DB instance before the company changes any setting?
  fr: |
    Une entreprise crée une nouvelle instance de base de données Amazon RDS. Quelle affirmation décrit l'accès réseau aux bases de données de l'instance avant que l'entreprise ne modifie un paramètre ?
body:
  options:
    - id: a
      text: { en: "Any EC2 instance in the same account can connect to the databases.", fr: "Toute instance EC2 du même compte peut se connecter aux bases de données." }
    - id: b
      text: { en: "Any IP address can connect until the company restricts access.", fr: "Toute adresse IP peut se connecter tant que l'entreprise ne restreint pas l'accès." }
    - id: c
      text: { en: "Access is blocked except through the rules of an associated security group.", fr: "L'accès est bloqué, sauf par les règles d'un groupe de sécurité associé." }
    - id: d
      text: { en: "Only connections from AWS Lambda functions are allowed.", fr: "Seules les connexions provenant de fonctions AWS Lambda sont autorisées." }
answer: { optionId: c }
explanation:
  correct:
    en: "When a DB instance is first created, its firewall prevents any database access except through rules specified by an associated security group. Access is denied by default, and the company opens only what it needs."
    fr: "À la création d'une instance de base de données, son pare-feu empêche tout accès à la base, sauf par les règles d'un groupe de sécurité associé. L'accès est refusé par défaut, et l'entreprise n'ouvre que ce dont elle a besoin."
  options:
    a:
      en: "Being in the same account does not open database access; a security group rule must allow it."
      fr: "Être dans le même compte n'ouvre pas l'accès à la base ; une règle de groupe de sécurité doit l'autoriser."
    b:
      en: "The DB instance is not open by default; its firewall blocks access that its security groups do not allow."
      fr: "L'instance n'est pas ouverte par défaut ; son pare-feu bloque les accès que ses groupes de sécurité n'autorisent pas."
    d:
      en: "RDS has no default rule for Lambda; every source must be allowed by a security group."
      fr: "RDS n'a pas de règle par défaut pour Lambda ; chaque source doit être autorisée par un groupe de sécurité."
references:
  - title: Security in Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.html
