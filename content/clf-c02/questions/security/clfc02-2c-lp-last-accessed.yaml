id: clfc02-2c-lp-last-accessed
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team wants to find the AWS services that an IAM role is allowed to use but has not used recently, so that it can remove those permissions. What should the team review?
  fr: |
    Une équipe de sécurité veut identifier les services AWS qu'un rôle IAM est autorisé à utiliser mais qu'il n'a pas utilisés récemment, afin de retirer ces autorisations. Que doit examiner l'équipe ?
body:
  options:
    - { id: a, text: { en: "The AWS Cost Explorer reports of the account", fr: "Les rapports AWS Cost Explorer du compte" } }
    - { id: b, text: { en: "The last accessed information of the role in IAM", fr: "Les informations sur le dernier accès du rôle dans IAM" } }
    - { id: c, text: { en: "The AWS Health Dashboard events of the account", fr: "Les événements AWS Health Dashboard du compte" } }
    - { id: d, text: { en: "The Amazon Macie findings of the account", fr: "Les résultats Amazon Macie du compte" } }
answer: { optionId: b }
explanation:
  correct:
    en: "IAM last accessed information shows when an identity last used each service that its permissions allow. AWS recommends using it to find and remove unused permissions, users, roles and credentials, which keeps permissions close to least privilege."
    fr: "Les informations sur le dernier accès d'IAM indiquent quand une identité a utilisé pour la dernière fois chaque service que ses autorisations permettent. AWS recommande de s'en servir pour trouver et retirer les autorisations, utilisateurs, rôles et informations d'identification inutilisés, ce qui rapproche les autorisations du moindre privilège."
  options:
    a:
      en: "Cost Explorer analyzes spending and usage costs; it does not show which permissions a role has used."
      fr: "Cost Explorer analyse les dépenses et les coûts d'utilisation ; il n'indique pas quelles autorisations un rôle a utilisées."
    c:
      en: "The AWS Health Dashboard reports events that affect AWS services and resources, not IAM permission usage."
      fr: "AWS Health Dashboard signale les événements qui touchent les services et ressources AWS, pas l'usage des autorisations IAM."
    d:
      en: "Macie discovers sensitive data in Amazon S3; it does not track the use of IAM permissions."
      fr: "Macie découvre les données sensibles dans Amazon S3 ; il ne suit pas l'utilisation des autorisations IAM."
references:
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
