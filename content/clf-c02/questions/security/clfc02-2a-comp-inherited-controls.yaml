id: clfc02-2a-comp-inherited-controls
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Under the AWS shared responsibility model, which controls does a customer fully inherit from AWS?
  fr: |
    Selon le modèle de responsabilité partagée AWS, quels contrôles un client hérite-t-il entièrement d'AWS ?
body:
  options:
    - id: a
      text: { en: "Patch management controls", fr: "Les contrôles de gestion des correctifs" }
    - id: b
      text: { en: "Configuration management controls", fr: "Les contrôles de gestion de la configuration" }
    - id: c
      text: { en: "Physical and environmental controls", fr: "Les contrôles physiques et environnementaux" }
    - id: d
      text: { en: "Zone security controls", fr: "Les contrôles de sécurité des zones" }
answer: { optionId: c }
explanation:
  correct:
    en: "Inherited controls are controls that the customer fully inherits from AWS. Physical and environmental controls, such as data center access, power, and fire protection, are the example AWS gives."
    fr: "Les contrôles hérités sont des contrôles que le client hérite entièrement d'AWS. Les contrôles physiques et environnementaux, comme l'accès aux centres de données, l'alimentation électrique et la protection contre l'incendie, sont l'exemple donné par AWS."
  options:
    a:
      en: "Patch management is a shared control: AWS patches the infrastructure, and the customer patches its guest operating systems and applications."
      fr: "La gestion des correctifs est un contrôle partagé : AWS corrige l'infrastructure, et le client corrige ses systèmes d'exploitation invités et ses applications."
    b:
      en: "Configuration management is a shared control: AWS configures its infrastructure devices, and the customer configures its own operating systems, databases, and applications."
      fr: "La gestion de la configuration est un contrôle partagé : AWS configure ses équipements d'infrastructure, et le client configure ses propres systèmes d'exploitation, bases de données et applications."
    d:
      en: "Zone security, such as routing or zoning data within specific security environments, is a customer-specific control."
      fr: "La sécurité des zones, comme le routage ou le zonage des données dans des environnements de sécurité spécifiques, est un contrôle spécifique au client."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
