id: clfc02-2b-log-event-history
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has never created a trail in AWS CloudTrail. An administrator must review the security group changes that were made in one AWS Region of the account during the last two weeks.

    What should the administrator do?
  fr: |
    Une entreprise n'a jamais créé de journal de suivi dans AWS CloudTrail. Un administrateur doit examiner les modifications de groupes de sécurité effectuées dans une Région AWS du compte au cours des deux dernières semaines.

    Que doit faire l'administrateur ?
body:
  options:
    - id: a
      text: { en: "Enable VPC Flow Logs and filter the records on the security group IDs.", fr: "Activer les journaux de flux VPC et filtrer les enregistrements sur les ID des groupes de sécurité." }
    - id: b
      text: { en: "Create a trail now so that CloudTrail delivers the events of the last two weeks to Amazon S3.", fr: "Créer maintenant un journal de suivi pour que CloudTrail livre les événements des deux dernières semaines dans Amazon S3." }
    - id: c
      text: { en: "Review the management events in the CloudTrail event history of that Region.", fr: "Examiner les événements de gestion dans l'historique des événements CloudTrail de cette Région." }
    - id: d
      text: { en: "Open a case with AWS Support to request the API logs of the account.", fr: "Ouvrir un dossier auprès d'AWS Support pour demander les journaux d'API du compte." }
answer: { optionId: c }
explanation:
  correct:
    en: "CloudTrail is active in every account when it is created. Without any trail, the event history shows the management events of the last 90 days in each Region, and it can be viewed, searched and downloaded at no cost."
    fr: "CloudTrail est actif dans chaque compte dès sa création. Sans aucun journal de suivi, l'historique des événements affiche les événements de gestion des 90 derniers jours dans chaque Région, et il peut être consulté, filtré et téléchargé sans frais."
  options:
    a:
      en: "Flow logs record network traffic from the time they are enabled, not changes made to security group rules."
      fr: "Les journaux de flux enregistrent le trafic réseau à partir de leur activation, pas les modifications des règles des groupes de sécurité."
    b:
      en: "A new trail records events from the time it is created; it does not deliver past events to Amazon S3."
      fr: "Un nouveau journal de suivi enregistre les événements à partir de sa création ; il ne livre pas les événements passés dans Amazon S3."
    d:
      en: "The customer already has the event history in the account; AWS Support is not the way to get API activity records."
      fr: "Le client dispose déjà de l'historique des événements dans le compte ; AWS Support n'est pas le moyen d'obtenir les enregistrements d'activité des API."
references:
  - title: "Working with CloudTrail event history"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
