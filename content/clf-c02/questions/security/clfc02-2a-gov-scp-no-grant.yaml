id: clfc02-2a-gov-scp-no-grant
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A member account of an organization in AWS Organizations has an SCP that allows all services and actions. A new IAM user in that account has no IAM policies attached and cannot access Amazon S3. What is the reason?
  fr: |
    Un compte membre d'une organisation AWS Organizations a une SCP qui autorise tous les services et toutes les actions. Un nouvel utilisateur IAM de ce compte n'a aucune politique IAM attachée et ne peut pas accéder à Amazon S3. Quelle en est la raison ?
body:
  options:
    - id: a
      text: { en: "SCPs do not grant permissions, so the user still needs an IAM policy that allows access.", fr: "Les SCP n'accordent pas d'autorisations : l'utilisateur a donc toujours besoin d'une politique IAM qui autorise l'accès." }
    - id: b
      text: { en: "The SCP must list Amazon S3 explicitly, because allowing all services excludes S3.", fr: "La SCP doit citer explicitement Amazon S3, car l'autorisation de tous les services exclut S3." }
    - id: c
      text: { en: "SCPs apply only to the root user, so they never give access to IAM users.", fr: "Les SCP ne s'appliquent qu'à l'utilisateur racine : elles ne donnent donc jamais accès aux utilisateurs IAM." }
    - id: d
      text: { en: "The user must be created in the management account for the SCP to grant access.", fr: "L'utilisateur doit être créé dans le compte de gestion pour que la SCP accorde l'accès." }
answer: { optionId: a }
explanation:
  correct:
    en: "No permissions are granted by an SCP: it only sets the maximum permissions. A user without any IAM permission policies has no access, even if the applicable SCPs allow all services and all actions."
    fr: "Une SCP n'accorde aucune autorisation : elle fixe seulement les autorisations maximales. Un utilisateur sans aucune politique d'autorisation IAM n'a aucun accès, même si les SCP applicables autorisent tous les services et toutes les actions."
  options:
    b:
      en: "Allowing all services includes S3; the issue is that the SCP grants nothing by itself."
      fr: "Autoriser tous les services inclut S3 ; le problème est que la SCP n'accorde rien par elle-même."
    c:
      en: "SCPs affect all users and roles in the attached accounts, including the member account's root user, but they never grant access."
      fr: "Les SCP s'appliquent à tous les utilisateurs et rôles des comptes concernés, y compris l'utilisateur racine du compte membre, mais elles n'accordent jamais d'accès."
    d:
      en: "SCPs do not affect the management account at all, and they do not grant access in any account."
      fr: "Les SCP ne s'appliquent pas du tout au compte de gestion, et elles n'accordent d'accès dans aucun compte."
references:
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
