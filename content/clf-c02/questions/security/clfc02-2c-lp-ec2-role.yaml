id: clfc02-2c-lp-ec2-role
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application on an Amazon EC2 instance must read objects from one Amazon S3 bucket. The company wants to follow the principle of least privilege and must not store long-term credentials on the instance. What should the company do?
  fr: |
    Une application sur une instance Amazon EC2 doit lire des objets dans un compartiment Amazon S3. L'entreprise veut respecter le principe du moindre privilège et ne doit pas stocker d'informations d'identification à long terme sur l'instance. Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Attach an IAM role to the instance with a policy that allows full access to Amazon S3.", fr: "Attacher à l'instance un rôle IAM avec une politique qui autorise un accès complet à Amazon S3." } }
    - { id: b, text: { en: "Create an IAM user with read access to the bucket and store its access keys on the instance.", fr: "Créer un utilisateur IAM avec un accès en lecture au compartiment et stocker ses clés d'accès sur l'instance." } }
    - { id: c, text: { en: "Attach an IAM role to the instance with a policy that allows read access to that bucket only.", fr: "Attacher à l'instance un rôle IAM avec une politique qui autorise la lecture de ce seul compartiment." } }
    - { id: d, text: { en: "Store the root user access keys on the instance and restrict SSH access to the instance.", fr: "Stocker les clés d'accès de l'utilisateur racine sur l'instance et restreindre l'accès SSH à l'instance." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An IAM role attached to the instance gives the application temporary credentials automatically, so no long-term keys are stored. Limiting the role's policy to read actions on the one bucket grants only what the application needs."
    fr: "Un rôle IAM attaché à l'instance fournit automatiquement des informations d'identification temporaires à l'application : aucune clé à long terme n'est stockée. Limiter la politique du rôle aux actions de lecture sur ce seul compartiment n'accorde que ce dont l'application a besoin."
  options:
    a:
      en: "The role avoids long-term keys, but full access to Amazon S3 grants far more than reading one bucket and breaks least privilege."
      fr: "Le rôle évite les clés à long terme, mais un accès complet à Amazon S3 accorde bien plus que la lecture d'un compartiment et enfreint le moindre privilège."
    b:
      en: "The permissions are narrow, but IAM user access keys are long-term credentials stored on the instance, which the company must avoid."
      fr: "Les autorisations sont restreintes, mais les clés d'accès d'un utilisateur IAM sont des informations d'identification à long terme stockées sur l'instance, ce que l'entreprise doit éviter."
    d:
      en: "Root access keys are long-term credentials with full access to the account; AWS recommends never creating them."
      fr: "Les clés d'accès racine sont des informations d'identification à long terme avec un accès complet au compte ; AWS recommande de ne jamais en créer."
references:
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
