id: clfc02-2d-incident-response-guide
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team wants an AWS document that explains how to prepare for and handle security events in its AWS environment, and which AWS capabilities and services help the team during that work.

    Which document meets this requirement?
  fr: |
    Une équipe de sécurité veut un document AWS qui explique comment se préparer aux événements de sécurité dans son environnement AWS et les traiter, ainsi que les fonctions et services AWS qui l'aident dans ce travail.

    Quel document répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "The AWS penetration testing policy", fr: "La politique de tests d'intrusion d'AWS" }
    - id: b
      text: { en: "An AWS SOC 2 report from AWS Artifact", fr: "Un rapport SOC 2 d'AWS issu d'AWS Artifact" }
    - id: c
      text: { en: "The AWS Security Bulletins", fr: "Les AWS Security Bulletins" }
    - id: d
      text: { en: "The AWS Security Incident Response Guide", fr: "Le guide AWS Security Incident Response Guide" }
answer: { optionId: d }
explanation:
  correct:
    en: "The AWS Security Incident Response Guide is an AWS whitepaper that presents the fundamentals of responding to security incidents in a customer's AWS environment. It identifies the cloud capabilities, services, and mechanisms that customers can use when they respond to security issues."
    fr: "L'AWS Security Incident Response Guide est un livre blanc AWS qui présente les principes de base de la réponse aux incidents de sécurité dans l'environnement AWS d'un client. Il identifie les fonctions, services et mécanismes cloud que les clients peuvent utiliser pour répondre aux problèmes de sécurité."
  options:
    a:
      en: "The penetration testing policy says what customers may test; it does not explain how to respond to incidents."
      fr: "La politique de tests d'intrusion indique ce que les clients peuvent tester ; elle n'explique pas comment répondre aux incidents."
    b:
      en: "A SOC 2 report describes the controls of AWS as audited by a third party; it is not an incident response guide for customers."
      fr: "Un rapport SOC 2 décrit les contrôles d'AWS audités par un tiers ; ce n'est pas un guide de réponse aux incidents pour les clients."
    c:
      en: "Security Bulletins announce specific vulnerabilities; they do not teach incident response."
      fr: "Les Security Bulletins annoncent des vulnérabilités précises ; ils n'enseignent pas la réponse aux incidents."
references:
  - title: "AWS Security Incident Response Guide"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-security-incident-response-guide/aws-security-incident-response-guide.html
