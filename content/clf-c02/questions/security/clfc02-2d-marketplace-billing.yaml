id: clfc02-2d-marketplace-billing
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company subscribes to a third-party intrusion detection product in AWS Marketplace with hourly pricing.

    How is the company charged for the product?
  fr: |
    Une entreprise s'abonne dans AWS Marketplace à un produit tiers de détection des intrusions avec une tarification horaire.

    Comment le produit est-il facturé à l'entreprise ?
body:
  options:
    - id: a
      text: { en: "The vendor sends the company a separate invoice that it must pay directly.", fr: "L'éditeur envoie à l'entreprise une facture distincte qu'elle doit payer directement." }
    - id: b
      text: { en: "The charges appear on the company's AWS bill, and AWS pays the vendor.", fr: "Les frais apparaissent sur la facture AWS de l'entreprise, et AWS paie l'éditeur." }
    - id: c
      text: { en: "The charges are included in the price of the company's AWS Support plan.", fr: "Les frais sont inclus dans le prix du plan AWS Support de l'entreprise." }
    - id: d
      text: { en: "The company must prepay one year of usage before it can launch the product.", fr: "L'entreprise doit prépayer un an d'utilisation avant de pouvoir lancer le produit." }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS handles billing and payments for AWS Marketplace products: whatever the pricing option, the charges appear on the customer's AWS bill. After the customer pays, AWS Marketplace pays the seller."
    fr: "AWS gère la facturation et les paiements des produits d'AWS Marketplace : quelle que soit l'option de tarification, les frais apparaissent sur la facture AWS du client. Une fois le client payé, AWS Marketplace paie le vendeur."
  options:
    a:
      en: "Marketplace purchases are billed from one source, AWS, not by separate vendor invoices."
      fr: "Les achats Marketplace sont facturés par une seule source, AWS, et non par des factures distinctes des éditeurs."
    c:
      en: "Support plans do not include third-party software; Marketplace products are charged separately on the AWS bill."
      fr: "Les plans de support n'incluent pas de logiciels tiers ; les produits Marketplace sont facturés séparément sur la facture AWS."
    d:
      en: "Hourly pricing is pay-as-you-go; annual and multi-year contracts are other options, not a requirement."
      fr: "La tarification horaire est un paiement à l'utilisation ; les contrats annuels et pluriannuels sont d'autres options, pas une obligation."
references:
  - title: "What is AWS Marketplace?"
    url: https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html
