id: clfc02-2c-root-task-email
objective: "2.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An administrator of a standalone AWS account uses an IAM role that has the AdministratorAccess policy. Which change to the account still requires the root user credentials?
  fr: |
    Un administrateur d'un compte AWS autonome utilise un rôle IAM doté de la politique AdministratorAccess. Quelle modification du compte exige tout de même les informations d'identification de l'utilisateur racine ?
body:
  options:
    - { id: a, text: { en: "Changing the account name", fr: "Changer le nom du compte" } }
    - { id: b, text: { en: "Enabling an opt-in AWS Region", fr: "Activer une Région AWS à activation manuelle (opt-in)" } }
    - { id: c, text: { en: "Changing the root user email address", fr: "Changer l'adresse e-mail de l'utilisateur racine" } }
    - { id: d, text: { en: "Updating the account contact information", fr: "Mettre à jour les coordonnées du compte" } }
answer: { optionId: c }
explanation:
  correct:
    en: "For a standalone account, updating the root user email address, the root user password or the root user access keys requires the root user credentials. Other account settings, such as the account name, contact information, alternate contacts and AWS Regions, can be changed by an authorized IAM identity."
    fr: "Pour un compte autonome, la modification de l'adresse e-mail, du mot de passe ou des clés d'accès de l'utilisateur racine exige les informations d'identification racine. Les autres paramètres du compte, comme le nom du compte, les coordonnées, les contacts alternatifs et les Régions AWS, peuvent être modifiés par une identité IAM autorisée."
  options:
    a:
      en: "The account name can be updated by an authorized IAM identity without root user credentials."
      fr: "Le nom du compte peut être modifié par une identité IAM autorisée sans les informations d'identification racine."
    b:
      en: "Enabling or disabling AWS Regions does not require root user credentials."
      fr: "Activer ou désactiver des Régions AWS n'exige pas les informations d'identification racine."
    d:
      en: "Contact information can be updated by an authorized IAM identity without root user credentials."
      fr: "Les coordonnées peuvent être mises à jour par une identité IAM autorisée sans les informations d'identification racine."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
