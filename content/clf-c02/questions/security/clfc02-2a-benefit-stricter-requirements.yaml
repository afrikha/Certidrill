id: clfc02-2a-benefit-stricter-requirements
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial company must meet security requirements that are stricter than those of most AWS customers. Which benefit of the AWS Cloud helps the company meet them?
  fr: |
    Une entreprise financière doit respecter des exigences de sécurité plus strictes que celles de la plupart des clients AWS. Quel avantage du Cloud AWS aide l'entreprise à les respecter ?
body:
  options:
    - id: a
      text: { en: "AWS takes over the company's compliance obligations when requested.", fr: "AWS reprend les obligations de conformité de l'entreprise sur demande." }
    - id: b
      text: { en: "The company can add controls such as encryption and key management.", fr: "L'entreprise peut ajouter des contrôles comme le chiffrement et la gestion des clés." }
    - id: c
      text: { en: "AWS manages the guest operating systems of the company's instances.", fr: "AWS gère les systèmes d'exploitation invités des instances de l'entreprise." }
    - id: d
      text: { en: "AWS lets the company apply its own patches to the AWS hypervisor.", fr: "AWS permet à l'entreprise d'appliquer ses propres correctifs à l'hyperviseur AWS." }
answer: { optionId: b }
explanation:
  correct:
    en: "The shared model gives customers the control they need to meet industry-specific requirements. Customers can enhance security or meet stricter compliance requirements with host-based firewalls, host-based intrusion detection and prevention, encryption, and key management."
    fr: "Le modèle partagé donne aux clients le contrôle nécessaire pour respecter des exigences propres à leur secteur. Les clients peuvent renforcer la sécurité ou respecter des exigences de conformité plus strictes avec des pare-feu sur l'hôte, de la détection et de la prévention des intrusions sur l'hôte, du chiffrement et de la gestion des clés."
  options:
    a:
      en: "AWS customers remain responsible for complying with the laws and regulations that apply to them."
      fr: "Les clients AWS restent responsables du respect des lois et réglementations qui s'appliquent à eux."
    c:
      en: "On Amazon EC2, the guest operating system stays the customer's responsibility, including for stricter requirements."
      fr: "Sur Amazon EC2, le système d'exploitation invité reste de la responsabilité du client, y compris pour des exigences plus strictes."
    d:
      en: "The hypervisor and host operating system are managed by AWS; customers do not patch them."
      fr: "L'hyperviseur et le système d'exploitation hôte sont gérés par AWS ; les clients n'y appliquent pas de correctifs."
references:
  - title: Shared responsibility model
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-risk-and-compliance/shared-responsibility-model.html
