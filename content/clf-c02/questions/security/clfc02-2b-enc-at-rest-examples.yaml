id: clfc02-2b-enc-at-rest-examples
objective: "2.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two examples are encryption at rest? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux exemples de chiffrement au repos ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Encrypting an Amazon EBS volume with an AWS KMS key", fr: "Chiffrer un volume Amazon EBS avec une clé AWS KMS" }
    - id: b
      text: { en: "Requiring TLS for client connections to an Amazon RDS DB instance", fr: "Exiger TLS pour les connexions des clients à une instance de base de données Amazon RDS" }
    - id: c
      text: { en: "Connecting an on-premises network to a VPC with AWS Site-to-Site VPN", fr: "Connecter un réseau sur site à un VPC avec AWS Site-to-Site VPN" }
    - id: d
      text: { en: "Storing Amazon S3 objects with SSE-KMS", fr: "Stocker des objets Amazon S3 avec SSE-KMS" }
    - id: e
      text: { en: "Calling an Amazon API Gateway API over HTTPS", fr: "Appeler une API Amazon API Gateway en HTTPS" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Encryption at rest protects data where it is stored. An encrypted EBS volume encrypts the data on the volume and its snapshots, and SSE-KMS encrypts S3 objects when they are written to disk."
    fr: "Le chiffrement au repos protège les données là où elles sont stockées. Un volume EBS chiffré chiffre les données du volume et de ses instantanés, et SSE-KMS chiffre les objets S3 lorsqu'ils sont écrits sur disque."
  options:
    b:
      en: "TLS protects the data exchanged between clients and the database, which is encryption in transit."
      fr: "TLS protège les données échangées entre les clients et la base de données : c'est du chiffrement en transit."
    c:
      en: "Site-to-Site VPN encrypts traffic between networks with IPsec, which is encryption in transit."
      fr: "Site-to-Site VPN chiffre le trafic entre les réseaux avec IPsec : c'est du chiffrement en transit."
    e:
      en: "HTTPS protects requests while they travel to the API, which is encryption in transit."
      fr: "HTTPS protège les requêtes pendant leur trajet vers l'API : c'est du chiffrement en transit."
references:
  - title: "Protecting data with encryption"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingEncryption.html
  - title: "AWS KMS keys"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html
