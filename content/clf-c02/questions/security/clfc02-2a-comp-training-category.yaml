id: clfc02-2a-comp-training-category
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's auditor asks how security awareness and training is classified in the AWS shared responsibility model. Which type of control is it?
  fr: |
    L'auditeur d'une entreprise demande comment la sensibilisation et la formation à la sécurité sont classées dans le modèle de responsabilité partagée AWS. De quel type de contrôle s'agit-il ?
body:
  options:
    - id: a
      text: { en: "A shared control", fr: "Un contrôle partagé" }
    - id: b
      text: { en: "An inherited control", fr: "Un contrôle hérité" }
    - id: c
      text: { en: "A customer-specific control", fr: "Un contrôle spécifique au client" }
    - id: d
      text: { en: "A compensating control", fr: "Un contrôle compensatoire" }
answer: { optionId: a }
explanation:
  correct:
    en: "Awareness and training is one of the shared controls in the model: AWS trains AWS employees, and the customer trains its own employees. Each party implements the control in its own context."
    fr: "La sensibilisation et la formation font partie des contrôles partagés du modèle : AWS forme les employés d'AWS, et le client forme ses propres employés. Chaque partie met en œuvre le contrôle dans son propre contexte."
  options:
    b:
      en: "An inherited control is fully provided by AWS, such as physical and environmental controls; the customer must still train its own staff."
      fr: "Un contrôle hérité est entièrement fourni par AWS, comme les contrôles physiques et environnementaux ; le client doit tout de même former son propre personnel."
    c:
      en: "Customer-specific controls are the customer's alone, such as zone security; AWS also trains its own employees."
      fr: "Les contrôles spécifiques au client relèvent du client seul, comme la sécurité des zones ; AWS forme aussi ses propres employés."
    d:
      en: "Compensating controls are not one of the three control types of the shared responsibility model."
      fr: "Les contrôles compensatoires ne font pas partie des trois types de contrôles du modèle de responsabilité partagée."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
