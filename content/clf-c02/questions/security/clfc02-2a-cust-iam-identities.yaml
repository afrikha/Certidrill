id: clfc02-2a-cust-iam-identities
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which task is the customer's responsibility under the AWS shared responsibility model?
  fr: |
    Quelle tâche relève de la responsabilité du client selon le modèle de responsabilité partagée AWS ?
body:
  options:
    - id: a
      text: { en: "Securing the AWS global network infrastructure", fr: "Sécuriser l'infrastructure réseau mondiale d'AWS" }
    - id: b
      text: { en: "Protecting the facilities of the AWS Regions", fr: "Protéger les installations des Régions AWS" }
    - id: c
      text: { en: "Managing the IAM users, groups, and permissions in its account", fr: "Gérer les utilisateurs, les groupes et les autorisations IAM de son compte" }
    - id: d
      text: { en: "Destroying storage media at the end of its life", fr: "Détruire les supports de stockage en fin de vie" }
answer: { optionId: c }
explanation:
  correct:
    en: "Identity and access management is part of security in the cloud. The customer decides which identities exist in its account and which permissions they have, whatever AWS services it uses."
    fr: "La gestion des identités et des accès fait partie de la sécurité dans le cloud. Le client décide des identités qui existent dans son compte et des autorisations dont elles disposent, quels que soient les services AWS utilisés."
  options:
    a:
      en: "The networking that runs AWS services is part of the infrastructure that AWS secures."
      fr: "Le réseau qui exécute les services AWS fait partie de l'infrastructure qu'AWS sécurise."
    b:
      en: "Regions and their data centers are part of the AWS global infrastructure, which AWS protects."
      fr: "Les Régions et leurs centres de données font partie de l'infrastructure mondiale d'AWS, qu'AWS protège."
    d:
      en: "AWS decommissions storage media that held customer data, using techniques detailed in NIST 800-88."
      fr: "AWS met hors service les supports de stockage qui ont contenu des données de clients, avec des techniques décrites dans la norme NIST 800-88."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
