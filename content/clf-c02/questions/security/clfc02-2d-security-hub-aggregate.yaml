id: clfc02-2d-security-hub-aggregate
objective: "2.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses Amazon GuardDuty, Amazon Inspector, and Amazon Macie in several AWS accounts. The company wants one service that collects their findings in a single view and automatically checks resources against the AWS Foundational Security Best Practices standard.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise utilise Amazon GuardDuty, Amazon Inspector et Amazon Macie dans plusieurs comptes AWS. Elle veut un seul service qui rassemble leurs résultats dans une vue unique et vérifie automatiquement les ressources par rapport à la norme AWS Foundational Security Best Practices.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
    - id: b
      text: { en: "Amazon Detective", fr: "Amazon Detective" }
    - id: c
      text: { en: "AWS Config", fr: "AWS Config" }
    - id: d
      text: { en: "AWS Security Hub", fr: "AWS Security Hub" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Security Hub collects security data from AWS services such as GuardDuty, Inspector, and Macie, and from supported third-party products, across accounts. Its cloud security posture management capability (Security Hub CSPM) runs automated checks against standards such as AWS Foundational Security Best Practices."
    fr: "AWS Security Hub collecte les données de sécurité de services AWS comme GuardDuty, Inspector et Macie, ainsi que de produits tiers pris en charge, dans plusieurs comptes. Sa fonction de gestion de la posture de sécurité cloud (Security Hub CSPM) effectue des vérifications automatisées par rapport à des normes comme AWS Foundational Security Best Practices."
  options:
    a:
      en: "Trusted Advisor runs its own best-practice checks, but it is not the service that aggregates GuardDuty, Inspector, and Macie findings or runs the Foundational Security Best Practices standard."
      fr: "Trusted Advisor effectue ses propres vérifications de bonnes pratiques, mais ce n'est pas le service qui rassemble les résultats de GuardDuty, Inspector et Macie ni qui applique la norme Foundational Security Best Practices."
    b:
      en: "Detective investigates the root cause of findings; it does not check resources against security standards."
      fr: "Detective enquête sur la cause première des résultats ; il ne vérifie pas les ressources par rapport à des normes de sécurité."
    c:
      en: "AWS Config records and evaluates resource configurations, but it does not collect GuardDuty, Inspector, and Macie findings in one view."
      fr: "AWS Config enregistre et évalue les configurations des ressources, mais il ne rassemble pas les résultats de GuardDuty, Inspector et Macie dans une vue unique."
references:
  - title: "Introduction to AWS Security Hub CSPM"
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub.html
