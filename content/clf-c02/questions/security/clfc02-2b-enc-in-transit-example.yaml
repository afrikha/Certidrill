id: clfc02-2b-enc-in-transit-example
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which example is encryption in transit?
  fr: |
    Quel exemple correspond à du chiffrement en transit ?
body:
  options:
    - id: a
      text: { en: "An Amazon EBS volume is encrypted with an AWS KMS key.", fr: "Un volume Amazon EBS est chiffré avec une clé AWS KMS." }
    - id: b
      text: { en: "Objects in an Amazon S3 bucket are encrypted with SSE-S3.", fr: "Les objets d'un compartiment Amazon S3 sont chiffrés avec SSE-S3." }
    - id: c
      text: { en: "The storage and snapshots of an Amazon RDS DB instance are encrypted.", fr: "Le stockage et les instantanés d'une instance de base de données Amazon RDS sont chiffrés." }
    - id: d
      text: { en: "Users connect to an Amazon CloudFront distribution over HTTPS.", fr: "Les utilisateurs se connectent à une distribution Amazon CloudFront en HTTPS." }
answer: { optionId: d }
explanation:
  correct:
    en: "Encryption in transit protects data while it moves across a network, for example with TLS when a browser connects to CloudFront over HTTPS. The other options encrypt data where it is stored, which is encryption at rest."
    fr: "Le chiffrement en transit protège les données pendant qu'elles circulent sur un réseau, par exemple avec TLS lorsqu'un navigateur se connecte à CloudFront en HTTPS. Les autres options chiffrent les données là où elles sont stockées : c'est du chiffrement au repos."
  options:
    a:
      en: "Encrypting an EBS volume protects stored data, which is encryption at rest."
      fr: "Chiffrer un volume EBS protège des données stockées : c'est du chiffrement au repos."
    b:
      en: "SSE-S3 encrypts objects when S3 writes them to disk, which is encryption at rest."
      fr: "SSE-S3 chiffre les objets quand S3 les écrit sur disque : c'est du chiffrement au repos."
    c:
      en: "Encrypting RDS storage and snapshots protects stored data, which is encryption at rest."
      fr: "Chiffrer le stockage et les instantanés RDS protège des données stockées : c'est du chiffrement au repos."
references:
  - title: "Protecting data with encryption"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingEncryption.html
