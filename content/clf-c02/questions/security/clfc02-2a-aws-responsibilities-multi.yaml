id: clfc02-2a-aws-responsibilities-multi
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which tasks are AWS's responsibility under the AWS shared responsibility model? (Choose two.)
  fr: |
    Quelles tâches relèvent de la responsabilité d'AWS selon le modèle de responsabilité partagée AWS ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Protecting the networking equipment that runs AWS services", fr: "Protéger les équipements réseau qui exécutent les services AWS" } }
    - { id: b, text: { en: "Classifying the data that a company stores in Amazon S3", fr: "Classer les données qu'une entreprise stocke dans Amazon S3" } }
    - { id: c, text: { en: "Setting IAM permissions on a company's DynamoDB tables", fr: "Définir les autorisations IAM sur les tables DynamoDB d'une entreprise" } }
    - { id: d, text: { en: "Operating the operating system and platform of Amazon S3", fr: "Exploiter le système d'exploitation et la plateforme d'Amazon S3" } }
    - { id: e, text: { en: "Configuring the security groups of a company's EC2 instances", fr: "Configurer les groupes de sécurité des instances EC2 d'une entreprise" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS protects the hardware, software, networking, and facilities that run AWS services. For abstracted services such as Amazon S3, AWS also operates the infrastructure layer, the operating system, and the platform."
    fr: "AWS protège le matériel, les logiciels, le réseau et les installations qui exécutent les services AWS. Pour les services abstraits comme Amazon S3, AWS exploite aussi la couche d'infrastructure, le système d'exploitation et la plateforme."
  options:
    c:
      en: "The customer uses IAM to apply the appropriate permissions to its resources, including DynamoDB tables."
      fr: "Le client utilise IAM pour appliquer les autorisations appropriées à ses ressources, y compris les tables DynamoDB."
    b:
      en: "Classifying its assets is the customer's responsibility, even on abstracted services."
      fr: "Classer ses ressources est de la responsabilité du client, même sur les services abstraits."
    e:
      en: "The customer configures the security groups of its own instances."
      fr: "Le client configure les groupes de sécurité de ses propres instances."
references:
  - title: Shared responsibility
    url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html
