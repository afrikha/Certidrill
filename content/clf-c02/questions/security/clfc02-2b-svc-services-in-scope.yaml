id: clfc02-2b-svc-services-in-scope
objective: "2.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company plans to use an AWS service that it has never used before for a workload that must meet PCI DSS.

    How can the company check whether this service is covered by the AWS PCI DSS assessment?
  fr: |
    Une entreprise prévoit d'utiliser un service AWS qu'elle n'a encore jamais utilisé pour une charge de travail qui doit respecter PCI DSS.

    Comment l'entreprise peut-elle vérifier si ce service est couvert par l'évaluation PCI DSS d'AWS ?
body:
  options:
    - id: a
      text: { en: "Consult the AWS Services in Scope by Compliance Program page.", fr: "Consulter la page AWS Services in Scope by Compliance Program." }
    - id: b
      text: { en: "Review the service's limits in Service Quotas.", fr: "Examiner les limites du service dans Service Quotas." }
    - id: c
      text: { en: "Look for the service in the AWS Health Dashboard.", fr: "Rechercher le service dans AWS Health Dashboard." }
    - id: d
      text: { en: "Run the security checks of AWS Trusted Advisor.", fr: "Exécuter les vérifications de sécurité d'AWS Trusted Advisor." }
answer: { optionId: a }
explanation:
  correct:
    en: "Each AWS compliance program covers a specific set of services. The AWS Services in Scope by Compliance Program page lists, for programs such as PCI DSS, SOC, ISO, FedRAMP and HIPAA, which services are in scope of the assessment."
    fr: "Chaque programme de conformité d'AWS couvre un ensemble précis de services. La page AWS Services in Scope by Compliance Program indique, pour des programmes comme PCI DSS, SOC, ISO, FedRAMP et HIPAA, quels services entrent dans le périmètre de l'évaluation."
  options:
    b:
      en: "Service Quotas shows usage limits of services, not their compliance status."
      fr: "Service Quotas affiche les limites d'utilisation des services, pas leur statut de conformité."
    c:
      en: "The AWS Health Dashboard shows service events and planned changes, not compliance scope."
      fr: "AWS Health Dashboard affiche les événements de service et les modifications planifiées, pas le périmètre de conformité."
    d:
      en: "Trusted Advisor checks the account against best practices; it does not say which services are in scope of a compliance program."
      fr: "Trusted Advisor vérifie le compte par rapport aux bonnes pratiques ; il n'indique pas quels services entrent dans le périmètre d'un programme de conformité."
references:
  - title: "AWS Services in Scope by Compliance Program"
    url: https://aws.amazon.com/compliance/services-in-scope/
