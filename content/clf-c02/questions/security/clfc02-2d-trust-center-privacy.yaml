id: clfc02-2d-trust-center-privacy
objective: "2.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A compliance officer wants AWS information about data privacy, digital sovereignty, and how AWS responds to law enforcement requests for customer data.

    Which resource should the compliance officer use?
  fr: |
    Un responsable de la conformité veut des informations d'AWS sur la confidentialité des données, la souveraineté numérique et la façon dont AWS répond aux demandes des forces de l'ordre portant sur les données des clients.

    Quelle ressource le responsable de la conformité doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Trust Center", fr: "AWS Trust Center" }
    - id: b
      text: { en: "AWS Security Bulletins", fr: "AWS Security Bulletins" }
    - id: c
      text: { en: "AWS Knowledge Center", fr: "AWS Knowledge Center" }
    - id: d
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Trust Center gathers AWS information about security, compliance, and privacy. It covers data protection and privacy, digital sovereignty, compliance programs, and operational visibility, including how AWS responds to requests for information such as law enforcement requests."
    fr: "AWS Trust Center rassemble les informations d'AWS sur la sécurité, la conformité et la confidentialité. Il couvre la protection et la confidentialité des données, la souveraineté numérique, les programmes de conformité et la visibilité opérationnelle, y compris la façon dont AWS répond aux demandes d'informations comme celles des forces de l'ordre."
  options:
    b:
      en: "Security Bulletins announce vulnerabilities that affect AWS services; they do not describe privacy practices or government requests."
      fr: "Les Security Bulletins annoncent les vulnérabilités qui touchent les services AWS ; ils ne décrivent ni les pratiques de confidentialité ni les demandes gouvernementales."
    c:
      en: "Knowledge Center answers frequent technical questions about AWS services, not AWS privacy and data request policies."
      fr: "Knowledge Center répond aux questions techniques fréquentes sur les services AWS, pas aux politiques d'AWS en matière de confidentialité et de demandes de données."
    d:
      en: "Trusted Advisor checks an account's resources against best practices; it does not publish AWS privacy information."
      fr: "Trusted Advisor vérifie les ressources d'un compte par rapport aux bonnes pratiques ; il ne publie pas d'informations sur la confidentialité chez AWS."
references:
  - title: "Customer Trust & Security - AWS Trust Center"
    url: https://aws.amazon.com/trust-center/
