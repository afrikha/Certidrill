id: clfc02-2d-no-cost-capabilities
objective: "2.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A startup wants to use security capabilities that AWS provides without adding charges to its AWS bill.

    Which capabilities are available to all AWS customers at no additional charge? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une start-up veut utiliser des fonctions de sécurité fournies par AWS sans ajouter de frais à sa facture AWS.

    Quelles fonctions sont disponibles pour tous les clients AWS sans frais supplémentaires ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "AWS Shield Advanced", fr: "AWS Shield Advanced" }
    - id: b
      text: { en: "AWS Shield Standard", fr: "AWS Shield Standard" }
    - id: c
      text: { en: "Amazon Macie sensitive data discovery", fr: "La découverte de données sensibles d'Amazon Macie" }
    - id: d
      text: { en: "AWS Identity and Access Management (IAM)", fr: "AWS Identity and Access Management (IAM)" }
    - id: e
      text: { en: "Amazon Inspector vulnerability scanning", fr: "L'analyse des vulnérabilités d'Amazon Inspector" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "All AWS customers automatically receive AWS Shield Standard protection against the most common network and transport layer DDoS attacks, at no additional charge. IAM, which controls who can access AWS resources, is also offered at no additional charge."
    fr: "Tous les clients AWS bénéficient automatiquement de la protection AWS Shield Standard contre les attaques DDoS les plus courantes sur les couches réseau et transport, sans frais supplémentaires. IAM, qui contrôle qui peut accéder aux ressources AWS, est également proposé sans frais supplémentaires."
  options:
    a:
      en: "Shield Advanced is a paid subscription that adds expanded DDoS protection and response support."
      fr: "Shield Advanced est un abonnement payant qui ajoute une protection DDoS étendue et une assistance en cas d'attaque."
    c:
      en: "Macie is a paid service, charged for the buckets it evaluates and the data it analyzes."
      fr: "Macie est un service payant, facturé selon les compartiments évalués et les données analysées."
    e:
      en: "Amazon Inspector is a paid service, charged for the resources it scans."
      fr: "Amazon Inspector est un service payant, facturé selon les ressources analysées."
references:
  - title: "AWS Shield Standard overview"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-standard-summary.html
  - title: "What is IAM?"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html
