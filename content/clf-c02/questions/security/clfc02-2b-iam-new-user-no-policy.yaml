id: clfc02-2b-iam-new-user-no-policy
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator creates a new IAM user. The administrator does not attach any policy to the user and does not add the user to any group. No other policy applies to the user.

    What can the user do with the AWS resources of the account?
  fr: |
    Un administrateur crée un nouvel utilisateur IAM. Il n'attache aucune politique à l'utilisateur et ne l'ajoute à aucun groupe. Aucune autre politique ne s'applique à l'utilisateur.

    Que peut faire l'utilisateur avec les ressources AWS du compte ?
body:
  options:
    - id: a
      text: { en: "Read all resources, because new IAM users get read-only access by default.", fr: "Lire toutes les ressources, car les nouveaux utilisateurs IAM obtiennent un accès en lecture seule par défaut." }
    - id: b
      text: { en: "Nothing, because all requests are denied by default until a policy allows them.", fr: "Rien, car toutes les demandes sont refusées par défaut tant qu'une politique ne les autorise pas." }
    - id: c
      text: { en: "Perform any action, because no policy denies anything to the user.", fr: "Effectuer n'importe quelle action, car aucune politique ne refuse quoi que ce soit à l'utilisateur." }
    - id: d
      text: { en: "Manage only the resources that the user creates in the account.", fr: "Gérer uniquement les ressources qu'il crée dans le compte." }
answer: { optionId: b }
explanation:
  correct:
    en: "By default, every request is implicitly denied. A request is allowed only when an applicable policy explicitly allows it and nothing denies it, so a new user without any policy cannot perform actions on the account's resources."
    fr: "Par défaut, toute demande est implicitement refusée. Une demande n'est autorisée que si une politique applicable l'autorise explicitement et que rien ne la refuse : un nouvel utilisateur sans aucune politique ne peut effectuer aucune action sur les ressources du compte."
  options:
    a:
      en: "IAM does not give new users any default permissions; read access must be granted with a policy."
      fr: "IAM ne donne aucune autorisation par défaut aux nouveaux utilisateurs ; l'accès en lecture doit être accordé par une politique."
    c:
      en: "The absence of a deny does not allow anything: without an explicit allow, the request is implicitly denied."
      fr: "L'absence de refus n'autorise rien : sans autorisation explicite, la demande est implicitement refusée."
    d:
      en: "Creating a resource already requires an allow, and IAM grants no implicit permissions on resources that a user creates."
      fr: "Créer une ressource nécessite déjà une autorisation, et IAM n'accorde aucune autorisation implicite sur les ressources créées par un utilisateur."
references:
  - title: "Policy evaluation logic"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html
