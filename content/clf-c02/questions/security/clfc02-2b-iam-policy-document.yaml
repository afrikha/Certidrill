id: clfc02-2b-iam-policy-document
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In IAM, which object is a JSON document that defines permissions and that is attached to an identity or a resource?
  fr: |
    Dans IAM, quel objet est un document JSON qui définit des autorisations et qui est attaché à une identité ou à une ressource ?
body:
  options:
    - id: a
      text: { en: "An access key", fr: "Une clé d'accès" }
    - id: b
      text: { en: "A user group", fr: "Un groupe d'utilisateurs" }
    - id: c
      text: { en: "A role", fr: "Un rôle" }
    - id: d
      text: { en: "A policy", fr: "Une politique" }
answer: { optionId: d }
explanation:
  correct:
    en: "An IAM policy is an object that defines permissions, usually stored as a JSON document. Identity-based policies are attached to users, groups or roles, and resource-based policies are attached to resources such as S3 buckets."
    fr: "Une politique IAM est un objet qui définit des autorisations, généralement stocké sous forme de document JSON. Les politiques basées sur l'identité sont attachées aux utilisateurs, groupes ou rôles, et les politiques basées sur les ressources sont attachées à des ressources comme les compartiments S3."
  options:
    a:
      en: "An access key is a long-term credential for programmatic access; it does not define permissions."
      fr: "Une clé d'accès est une information d'identification à long terme pour l'accès programmatique ; elle ne définit pas d'autorisations."
    b:
      en: "A user group is a collection of IAM users; it receives permissions through policies."
      fr: "Un groupe d'utilisateurs est un ensemble d'utilisateurs IAM ; il reçoit des autorisations par des politiques."
    c:
      en: "A role is an identity with permissions that can be assumed; its permissions come from the policies attached to it."
      fr: "Un rôle est une identité dotée d'autorisations que l'on peut assumer ; ses autorisations proviennent des politiques qui lui sont attachées."
references:
  - title: "Policies and permissions in AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html
