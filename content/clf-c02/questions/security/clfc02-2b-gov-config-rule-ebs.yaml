id: clfc02-2b-gov-config-rule-ebs
objective: "2.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must continuously check that all Amazon EBS volumes in its account are encrypted and must flag every volume that is not.

    Which solution will meet this requirement with the LEAST effort?
  fr: |
    Une entreprise doit vérifier en continu que tous les volumes Amazon EBS de son compte sont chiffrés et doit signaler chaque volume qui ne l'est pas.

    Quelle solution répond à cette exigence avec le MOINS d'effort ?
body:
  options:
    - id: a
      text: { en: "Enable AWS Config and add the AWS managed rule that checks EBS volume encryption.", fr: "Activer AWS Config et ajouter la règle gérée par AWS qui vérifie le chiffrement des volumes EBS." }
    - id: b
      text: { en: "Build an Amazon CloudWatch dashboard with the EBS metrics of each volume.", fr: "Créer un tableau de bord Amazon CloudWatch avec les métriques EBS de chaque volume." }
    - id: c
      text: { en: "Enable Amazon GuardDuty and review its findings for unencrypted volumes.", fr: "Activer Amazon GuardDuty et examiner ses résultats concernant les volumes non chiffrés." }
    - id: d
      text: { en: "Create a CloudTrail trail and review the CreateVolume events every week.", fr: "Créer un journal de suivi CloudTrail et examiner chaque semaine les événements CreateVolume." }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Config rules continuously evaluate resource configurations against desired settings and mark noncompliant resources. AWS managed rules are predefined, so checking EBS encryption only requires adding the rule."
    fr: "Les règles AWS Config évaluent en continu la configuration des ressources par rapport aux paramètres souhaités et signalent les ressources non conformes. Les règles gérées par AWS sont prédéfinies : vérifier le chiffrement EBS demande seulement d'ajouter la règle."
  options:
    b:
      en: "EBS metrics describe performance; they do not show whether a volume is encrypted."
      fr: "Les métriques EBS décrivent les performances ; elles n'indiquent pas si un volume est chiffré."
    c:
      en: "GuardDuty detects threats from activity; it does not evaluate whether volumes are encrypted."
      fr: "GuardDuty détecte les menaces à partir de l'activité ; il n'évalue pas si les volumes sont chiffrés."
    d:
      en: "A weekly manual review is not continuous and does not cover volumes created before the trail."
      fr: "Un examen manuel hebdomadaire n'est pas continu et ne couvre pas les volumes créés avant le journal de suivi."
references:
  - title: "What Is AWS Config?"
    url: https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html
