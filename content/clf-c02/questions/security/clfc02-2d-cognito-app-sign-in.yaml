id: clfc02-2d-cognito-app-sign-in
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building a mobile app for its customers. The app needs user sign-up and sign-in, including sign-in with social identity providers.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise développe une application mobile pour ses clients. L'application a besoin de l'inscription et de la connexion des utilisateurs, y compris la connexion avec des fournisseurs d'identité sociaux.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "AWS IAM Identity Center", fr: "AWS IAM Identity Center" }
    - id: b
      text: { en: "AWS Directory Service", fr: "AWS Directory Service" }
    - id: c
      text: { en: "Amazon Cognito", fr: "Amazon Cognito" }
    - id: d
      text: { en: "AWS Secrets Manager", fr: "AWS Secrets Manager" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Cognito adds authentication and authorization to web and mobile apps. Its user pools provide sign-up and sign-in for the app's users and support federation with social identity providers."
    fr: "Amazon Cognito ajoute l'authentification et l'autorisation aux applications web et mobiles. Ses groupes d'utilisateurs (user pools) fournissent l'inscription et la connexion des utilisateurs de l'application et prennent en charge la fédération avec des fournisseurs d'identité sociaux."
  options:
    a:
      en: "IAM Identity Center manages workforce access to AWS accounts and business applications, not sign-in for an app's customers."
      fr: "IAM Identity Center gère l'accès du personnel aux comptes AWS et aux applications métier, pas la connexion des clients d'une application."
    b:
      en: "Directory Service provides Microsoft Active Directory in AWS; it is not designed for customer sign-up in a mobile app."
      fr: "Directory Service fournit Microsoft Active Directory dans AWS ; il n'est pas conçu pour l'inscription des clients d'une application mobile."
    d:
      en: "Secrets Manager stores and rotates secrets; it does not sign users in."
      fr: "Secrets Manager stocke et fait la rotation de secrets ; il ne connecte pas les utilisateurs."
references:
  - title: "What is Amazon Cognito?"
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html
