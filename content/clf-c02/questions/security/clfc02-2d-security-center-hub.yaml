id: clfc02-2d-security-center-hub
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A new employee wants one AWS web page that is a starting point for AWS security information, with links to security services, compliance, learning resources, the AWS Security Blog, and vulnerability reporting.

    Which resource should the employee use?
  fr: |
    Un nouvel employé veut une page web AWS unique qui serve de point de départ pour les informations de sécurité AWS, avec des liens vers les services de sécurité, la conformité, les ressources de formation, l'AWS Security Blog et le signalement de vulnérabilités.

    Quelle ressource l'employé doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
    - id: b
      text: { en: "AWS Security Center", fr: "AWS Security Center" }
    - id: c
      text: { en: "AWS Knowledge Center", fr: "AWS Knowledge Center" }
    - id: d
      text: { en: "AWS Health Dashboard", fr: "AWS Health Dashboard" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Security Center, the AWS Cloud Security website, is the hub for AWS security information. It links to AWS security services, compliance, learning resources such as the AWS Security Reference Architecture, partner solutions, the AWS Security Blog, and the vulnerability reporting process."
    fr: "AWS Security Center, le site AWS Cloud Security, est le point central des informations de sécurité d'AWS. Il renvoie vers les services de sécurité AWS, la conformité, des ressources de formation comme l'AWS Security Reference Architecture, des solutions de partenaires, l'AWS Security Blog et la procédure de signalement de vulnérabilités."
  options:
    a:
      en: "Trusted Advisor checks an account against best practices; it is not a portal of security information."
      fr: "Trusted Advisor vérifie un compte par rapport aux bonnes pratiques ; ce n'est pas un portail d'informations de sécurité."
    c:
      en: "Knowledge Center answers frequent questions about all services; it is not the hub that links security services, compliance, and vulnerability reporting."
      fr: "Knowledge Center répond aux questions fréquentes sur tous les services ; ce n'est pas le point central qui relie services de sécurité, conformité et signalement de vulnérabilités."
    d:
      en: "AWS Health Dashboard reports events that affect AWS services and the account's resources; it is not a security information portal."
      fr: "AWS Health Dashboard signale les événements qui touchent les services AWS et les ressources du compte ; ce n'est pas un portail d'informations de sécurité."
references:
  - title: "AWS Cloud Security"
    url: https://aws.amazon.com/security/
