id: clfc02-2c-secrets-db-rotation
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application has database credentials hardcoded in its source code. The company wants to store the credentials centrally, retrieve them at runtime and rotate them automatically. Which AWS service will meet these requirements?
  fr: |
    Une application contient des informations d'identification de base de données codées en dur dans son code source. L'entreprise veut les stocker de manière centralisée, les récupérer à l'exécution et en faire la rotation automatiquement. Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Secrets Manager" }
    - { id: b, text: "AWS Systems Manager Parameter Store" }
    - { id: c, text: "AWS Key Management Service (AWS KMS)" }
    - { id: d, text: "AWS Config" }
answer: { optionId: a }
explanation:
  correct:
    en: "Secrets Manager stores secrets such as database credentials, API keys and OAuth tokens. Applications replace hardcoded credentials with a runtime call to Secrets Manager, and a rotation schedule can replace the credentials automatically without redeploying the application."
    fr: "Secrets Manager stocke des secrets comme les informations d'identification de bases de données, les clés d'API et les jetons OAuth. Les applications remplacent les identifiants codés en dur par un appel à Secrets Manager à l'exécution, et un calendrier de rotation peut remplacer les identifiants automatiquement sans redéployer l'application."
  options:
    b:
      en: "Parameter Store can store encrypted values, but it does not rotate credentials; AWS recommends Secrets Manager for credentials."
      fr: "Parameter Store peut stocker des valeurs chiffrées, mais il ne fait pas la rotation des informations d'identification ; AWS recommande Secrets Manager pour les identifiants."
    c:
      en: "AWS KMS creates and manages encryption keys; it does not store or rotate database credentials."
      fr: "AWS KMS crée et gère des clés de chiffrement ; il ne stocke pas les informations d'identification de bases de données et n'en fait pas la rotation."
    d:
      en: "AWS Config records and evaluates resource configurations; it does not store application secrets."
      fr: "AWS Config enregistre et évalue les configurations des ressources ; il ne stocke pas les secrets des applications."
references:
  - title: What is AWS Secrets Manager?
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
  - title: AWS Systems Manager Parameter Store
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html
