id: clfc02-2d-cloudhsm-single-tenant
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial company must generate and store its encryption keys in single-tenant hardware security modules (HSMs). The company must manage the HSM users itself, outside of IAM.

    Which AWS service will meet these requirements?
  fr: |
    Une société financière doit générer et stocker ses clés de chiffrement dans des modules de sécurité matériels (HSM) à locataire unique. L'entreprise doit gérer elle-même les utilisateurs du HSM, en dehors d'IAM.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Key Management Service (AWS KMS) with customer managed keys", fr: "AWS Key Management Service (AWS KMS) avec des clés gérées par le client" }
    - id: b
      text: { en: "AWS CloudHSM", fr: "AWS CloudHSM" }
    - id: c
      text: { en: "AWS Secrets Manager", fr: "AWS Secrets Manager" }
    - id: d
      text: { en: "AWS Certificate Manager (ACM)", fr: "AWS Certificate Manager (ACM)" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS CloudHSM provides standards-compliant, single-tenant HSMs in clusters that the customer uses to generate, store, and manage its keys. The data plane is encrypted end to end and not visible to AWS, so the customer controls its own HSM user management outside of IAM roles."
    fr: "AWS CloudHSM fournit des HSM conformes aux normes et à locataire unique, regroupés en clusters, que le client utilise pour générer, stocker et gérer ses clés. Le plan de données est chiffré de bout en bout et invisible pour AWS : le client contrôle lui-même la gestion des utilisateurs du HSM, en dehors des rôles IAM."
  options:
    a:
      en: "AWS KMS also protects keys in validated HSMs, but it is a managed service in which AWS operates the HSMs and access is controlled with IAM; the company does not get single-tenant HSMs or manage HSM users."
      fr: "AWS KMS protège aussi les clés dans des HSM validés, mais c'est un service géré dans lequel AWS exploite les HSM et où l'accès est contrôlé avec IAM : l'entreprise n'obtient pas de HSM à locataire unique et ne gère pas les utilisateurs du HSM."
    c:
      en: "Secrets Manager stores and rotates secrets such as passwords; it does not provide HSMs."
      fr: "Secrets Manager stocke et fait la rotation de secrets comme des mots de passe ; il ne fournit pas de HSM."
    d:
      en: "ACM manages SSL/TLS certificates; it does not give the company its own HSMs."
      fr: "ACM gère des certificats SSL/TLS ; il ne donne pas à l'entreprise ses propres HSM."
references:
  - title: "What is AWS CloudHSM?"
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html
