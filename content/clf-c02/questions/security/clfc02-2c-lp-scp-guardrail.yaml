id: clfc02-2c-lp-scp-guardrail
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations. It wants to set the maximum permissions available in every account of an organizational unit (OU), so that even account administrators cannot use unapproved services. What should the company use?
  fr: |
    Une entreprise utilise AWS Organizations. Elle veut fixer les autorisations maximales disponibles dans chaque compte d'une unité d'organisation (UO), afin que même les administrateurs des comptes ne puissent pas utiliser de services non approuvés. Que doit utiliser l'entreprise ?
body:
  options:
    - { id: a, text: { en: "A service control policy (SCP) attached to the OU", fr: "Une politique de contrôle des services (SCP) attachée à l'UO" } }
    - { id: b, text: { en: "A permissions boundary attached to each IAM role", fr: "Une limite d'autorisations attachée à chaque rôle IAM" } }
    - { id: c, text: { en: "An IAM user group with a restrictive inline policy", fr: "Un groupe d'utilisateurs IAM avec une politique en ligne restrictive" } }
    - { id: d, text: { en: "An AWS managed policy attached to each IAM user", fr: "Une politique gérée par AWS attachée à chaque utilisateur IAM" } }
answer: { optionId: a }
explanation:
  correct:
    en: "SCPs are guardrails that set the maximum permissions for the accounts of an organization, OU or account where they are attached, including for the account administrators. They do not grant permissions: identities still need identity-based or resource-based policies to perform actions."
    fr: "Les SCP sont des garde-fous qui fixent les autorisations maximales des comptes d'une organisation, d'une UO ou d'un compte auxquels elles sont attachées, y compris pour les administrateurs des comptes. Elles n'accordent pas d'autorisations : les identités ont toujours besoin de politiques basées sur l'identité ou sur les ressources pour agir."
  options:
    b:
      en: "A permissions boundary caps one IAM entity within an account; it does not apply to all accounts of an OU at once, and new identities might not have it."
      fr: "Une limite d'autorisations plafonne une entité IAM dans un compte ; elle ne s'applique pas d'un coup à tous les comptes d'une UO, et les nouvelles identités pourraient ne pas l'avoir."
    c:
      en: "A group policy grants permissions to its members only; administrators outside the group keep their own permissions."
      fr: "Une politique de groupe n'accorde des autorisations qu'à ses membres ; les administrateurs hors du groupe gardent leurs propres autorisations."
    d:
      en: "Attaching a managed policy grants permissions; it does not prevent administrators from using other services that their own policies allow."
      fr: "Attacher une politique gérée accorde des autorisations ; cela n'empêche pas les administrateurs d'utiliser d'autres services que leurs propres politiques autorisent."
references:
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
