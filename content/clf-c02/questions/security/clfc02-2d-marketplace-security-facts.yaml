id: clfc02-2d-marketplace-security-facts
objective: "2.4.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company's security team is considering third-party security products from AWS Marketplace.

    Which statements about AWS Marketplace are true? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe de sécurité d'une entreprise envisage des produits de sécurité tiers issus d'AWS Marketplace.

    Quelles affirmations sur AWS Marketplace sont vraies ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "It includes security software from independent software vendors (ISVs).", fr: "Il inclut des logiciels de sécurité d'éditeurs de logiciels indépendants (ISV)." }
    - id: b
      text: { en: "All of its products are developed and supported by AWS.", fr: "Tous ses produits sont développés et pris en charge par AWS." }
    - id: c
      text: { en: "Products can be bought only by customers with an AWS Enterprise Support plan.", fr: "Seuls les clients disposant d'un plan AWS Enterprise Support peuvent acheter des produits." }
    - id: d
      text: { en: "Some products are available with a free trial.", fr: "Certains produits sont disponibles avec un essai gratuit." }
    - id: e
      text: { en: "Products bought there are configured and secured by AWS on behalf of the customer.", fr: "Les produits qui y sont achetés sont configurés et sécurisés par AWS pour le compte du client." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS Marketplace is a curated catalog of third-party software, data, and services from sellers such as independent software vendors, with a security category among others. Pricing options include free trials, hourly, monthly, annual, multi-year, and BYOL."
    fr: "AWS Marketplace est un catalogue organisé de logiciels, de données et de services tiers proposés par des vendeurs comme des éditeurs de logiciels indépendants, avec notamment une catégorie sécurité. Les options de tarification comprennent des essais gratuits, des tarifs horaires, mensuels, annuels, pluriannuels et le modèle BYOL."
  options:
    b:
      en: "Marketplace products come from third-party sellers, such as ISVs and resellers, not only from AWS."
      fr: "Les produits Marketplace proviennent de vendeurs tiers, comme des ISV et des revendeurs, et pas seulement d'AWS."
    c:
      en: "Any AWS customer can buy in AWS Marketplace; no particular Support plan is required."
      fr: "Tout client AWS peut acheter dans AWS Marketplace ; aucun plan de support particulier n'est exigé."
    e:
      en: "Third-party software that the customer deploys in its account is the customer's to configure and operate, as with any software it runs on AWS."
      fr: "Le logiciel tiers que le client déploie dans son compte doit être configuré et exploité par le client, comme tout logiciel qu'il exécute sur AWS."
references:
  - title: "What is AWS Marketplace?"
    url: https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html
