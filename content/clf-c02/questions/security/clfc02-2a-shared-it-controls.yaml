id: clfc02-2a-shared-it-controls
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must evaluate and verify the IT controls of its AWS environment for an annual audit. How is this responsibility divided between AWS and the company?
  fr: |
    Une entreprise doit évaluer et vérifier les contrôles informatiques de son environnement AWS pour un audit annuel. Comment cette responsabilité est-elle répartie entre AWS et l'entreprise ?
body:
  options:
    - id: a
      text: { en: "AWS evaluates and verifies all the controls of the company's workloads on its behalf.", fr: "AWS évalue et vérifie tous les contrôles des charges de travail de l'entreprise pour son compte." }
    - id: b
      text: { en: "AWS manages the physical infrastructure controls, and the company uses AWS documentation for its own evaluation.", fr: "AWS gère les contrôles de l'infrastructure physique, et l'entreprise utilise la documentation AWS pour sa propre évaluation." }
    - id: c
      text: { en: "The company's auditors inspect the AWS data centers, and AWS verifies the company's controls.", fr: "Les auditeurs de l'entreprise inspectent les centres de données AWS, et AWS vérifie les contrôles de l'entreprise." }
    - id: d
      text: { en: "The company evaluates every control, including the physical controls of the AWS facilities.", fr: "L'entreprise évalue chaque contrôle, y compris les contrôles physiques des installations AWS." }
answer: { optionId: b }
explanation:
  correct:
    en: "Managing, operating, and verifying IT controls is a shared responsibility. AWS manages the controls associated with the physical infrastructure, and customers use the AWS control and compliance documentation to perform their own control evaluation and verification procedures."
    fr: "Gérer, exploiter et vérifier les contrôles informatiques est une responsabilité partagée. AWS gère les contrôles liés à l'infrastructure physique, et les clients utilisent la documentation de contrôle et de conformité d'AWS pour mener leurs propres procédures d'évaluation et de vérification des contrôles."
  options:
    a:
      en: "AWS does not verify the controls of the customer's workloads; the customer performs its own evaluation."
      fr: "AWS ne vérifie pas les contrôles des charges de travail du client ; le client mène sa propre évaluation."
    c:
      en: "AWS controls physical access to its data centers and provides third-party audit reports instead; it does not verify customer controls."
      fr: "AWS contrôle l'accès physique à ses centres de données et fournit plutôt des rapports d'audit tiers ; il ne vérifie pas les contrôles des clients."
    d:
      en: "The physical controls are managed by AWS; the company relies on AWS documentation for that part."
      fr: "Les contrôles physiques sont gérés par AWS ; l'entreprise s'appuie sur la documentation d'AWS pour cette partie."
references:
  - title: Shared responsibility model
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-risk-and-compliance/shared-responsibility-model.html
