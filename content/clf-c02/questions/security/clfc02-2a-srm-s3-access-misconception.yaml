id: clfc02-2a-srm-s3-access-misconception
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A startup stores customer files in Amazon S3. A developer says that because AWS is responsible for security of the cloud, the startup does not need to manage who can access the files.

    Which statement is correct?
  fr: |
    Une startup stocke des fichiers de clients dans Amazon S3. Un développeur affirme que, puisqu'AWS est responsable de la sécurité du cloud, la startup n'a pas besoin de gérer qui peut accéder aux fichiers.

    Quelle affirmation est correcte ?
body:
  options:
    - id: a
      text: { en: "The developer is right, because AWS manages the permissions of abstracted services such as Amazon S3.", fr: "Le développeur a raison, car AWS gère les autorisations des services abstraits comme Amazon S3." }
    - id: b
      text: { en: "The developer is wrong, because the startup must manage its data and set permissions with IAM.", fr: "Le développeur a tort, car la startup doit gérer ses données et définir les autorisations avec IAM." }
    - id: c
      text: { en: "The developer is right, because AWS restricts each object to the identity that uploaded it.", fr: "Le développeur a raison, car AWS limite chaque objet à l'identité qui l'a chargé." }
    - id: d
      text: { en: "The developer is wrong, because the startup must also secure the S3 storage infrastructure.", fr: "Le développeur a tort, car la startup doit aussi sécuriser l'infrastructure de stockage S3." }
answer: { optionId: b }
explanation:
  correct:
    en: "For abstracted services such as Amazon S3, AWS operates the infrastructure layer, the operating system and the platform. The customer remains responsible for managing its data, including encryption options, classifying its assets, and using IAM tools to apply the appropriate permissions."
    fr: "Pour les services abstraits comme Amazon S3, AWS exploite la couche d'infrastructure, le système d'exploitation et la plateforme. Le client reste responsable de la gestion de ses données, y compris les options de chiffrement, de la classification de ses ressources et de l'utilisation des outils IAM pour appliquer les autorisations appropriées."
  options:
    a:
      en: "AWS operates S3 itself, but deciding who can access the data is always the customer's job."
      fr: "AWS exploite S3 lui-même, mais décider qui peut accéder aux données est toujours le travail du client."
    c:
      en: "AWS does not decide access for the customer; the customer defines permissions for its identities and resources."
      fr: "AWS ne décide pas des accès à la place du client ; le client définit les autorisations de ses identités et de ses ressources."
    d:
      en: "The S3 infrastructure is part of security of the cloud, which AWS handles."
      fr: "L'infrastructure S3 fait partie de la sécurité du cloud, assurée par AWS."
references:
  - title: Shared responsibility
    url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html
