id: clfc02-2c-fed-iam-idp-entity
objective: "2.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company with a single standalone AWS account wants to federate its SAML 2.0 identity provider directly with IAM. What must the company create in IAM to establish trust with the identity provider?
  fr: |
    Une entreprise qui possède un seul compte AWS autonome veut fédérer son fournisseur d'identité SAML 2.0 directement avec IAM. Que doit-elle créer dans IAM pour établir la confiance avec le fournisseur d'identité ?
body:
  options:
    - { id: a, text: { en: "An IAM user for each employee of the company", fr: "Un utilisateur IAM pour chaque employé de l'entreprise" } }
    - { id: b, text: { en: "An IAM user group named after the identity provider", fr: "Un groupe d'utilisateurs IAM portant le nom du fournisseur d'identité" } }
    - { id: c, text: { en: "An IAM identity provider entity for the SAML provider", fr: "Une entité de fournisseur d'identité IAM pour le fournisseur SAML" } }
    - { id: d, text: { en: "Root user access keys shared with the identity provider", fr: "Des clés d'accès racine partagées avec le fournisseur d'identité" } }
answer: { optionId: c }
explanation:
  correct:
    en: "To link an identity provider directly to IAM, the company creates an IAM identity provider entity, which establishes trust between the AWS account and the SAML 2.0 provider. Federated users then assume IAM roles and receive temporary credentials."
    fr: "Pour relier un fournisseur d'identité directement à IAM, l'entreprise crée une entité de fournisseur d'identité IAM, qui établit la confiance entre le compte AWS et le fournisseur SAML 2.0. Les utilisateurs fédérés endossent ensuite des rôles IAM et reçoivent des informations d'identification temporaires."
  options:
    a:
      en: "Federation removes the need for an IAM user per employee; users keep their identities in the identity provider."
      fr: "La fédération supprime le besoin d'un utilisateur IAM par employé ; les utilisateurs gardent leur identité dans le fournisseur d'identité."
    b:
      en: "A user group only organizes IAM users; it does not establish trust with an external identity provider."
      fr: "Un groupe d'utilisateurs ne fait qu'organiser des utilisateurs IAM ; il n'établit pas de confiance avec un fournisseur d'identité externe."
    d:
      en: "Root access keys must never be created or shared, and federation does not use them."
      fr: "Les clés d'accès racine ne doivent jamais être créées ni partagées, et la fédération ne les utilise pas."
references:
  - title: Identity providers and federation into AWS
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html
