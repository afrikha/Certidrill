id: clfc02-2b-iam-explicit-deny
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An IAM user belongs to a group whose policy allows all Amazon S3 actions on all resources. An administrator also attaches a policy to the user that explicitly denies the s3:DeleteObject action. No other policy applies.

    What happens when the user tries to delete an object?
  fr: |
    Un utilisateur IAM appartient à un groupe dont la politique autorise toutes les actions Amazon S3 sur toutes les ressources. Un administrateur attache aussi à l'utilisateur une politique qui refuse explicitement l'action s3:DeleteObject. Aucune autre politique ne s'applique.

    Que se passe-t-il lorsque l'utilisateur tente de supprimer un objet ?
body:
  options:
    - id: a
      text: { en: "The request is allowed or denied depending on which policy was attached last.", fr: "La demande est autorisée ou refusée selon la politique attachée en dernier." }
    - id: b
      text: { en: "The request is denied, because an explicit deny overrides any allow.", fr: "La demande est refusée, car un refus explicite l'emporte sur toute autorisation." }
    - id: c
      text: { en: "The request is allowed, because the group policy allows all S3 actions.", fr: "La demande est autorisée, car la politique du groupe autorise toutes les actions S3." }
    - id: d
      text: { en: "The request is denied only if the bucket policy also denies the action.", fr: "La demande n'est refusée que si la politique de compartiment refuse aussi l'action." }
answer: { optionId: b }
explanation:
  correct:
    en: "When IAM evaluates a request, an explicit Deny statement in any applicable policy overrides any Allow. The group policy allows S3 actions, but the explicit deny of s3:DeleteObject in the user's policy wins, so the deletion fails."
    fr: "Lorsqu'IAM évalue une demande, une instruction Deny explicite dans n'importe quelle politique applicable l'emporte sur tout Allow. La politique du groupe autorise les actions S3, mais le refus explicite de s3:DeleteObject dans la politique de l'utilisateur prévaut : la suppression échoue."
  options:
    a:
      en: "The order in which policies were attached has no effect on policy evaluation."
      fr: "L'ordre dans lequel les politiques ont été attachées n'a aucun effet sur leur évaluation."
    c:
      en: "An Allow never overrides an explicit Deny, whatever policy contains it."
      fr: "Un Allow ne l'emporte jamais sur un Deny explicite, quelle que soit la politique qui le contient."
    d:
      en: "The explicit deny in the identity-based policy is enough to deny the request; no bucket policy is needed."
      fr: "Le refus explicite dans la politique basée sur l'identité suffit à refuser la demande ; aucune politique de compartiment n'est nécessaire."
references:
  - title: "Policy evaluation logic"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html
