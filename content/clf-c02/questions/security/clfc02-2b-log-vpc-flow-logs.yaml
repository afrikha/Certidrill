id: clfc02-2b-log-vpc-flow-logs
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to capture information about the IP traffic going to and from the network interfaces in its VPC, including the connections that were rejected.

    Which AWS feature should the company use?
  fr: |
    Une entreprise veut capturer des informations sur le trafic IP entrant et sortant des interfaces réseau de son VPC, y compris les connexions qui ont été rejetées.

    Quelle fonctionnalité AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Config configuration history", fr: "Historique de configuration AWS Config" }
    - id: b
      text: { en: "Amazon Route 53 Resolver query logging", fr: "Journalisation des requêtes Amazon Route 53 Resolver" }
    - id: c
      text: { en: "AWS CloudTrail management events", fr: "Événements de gestion AWS CloudTrail" }
    - id: d
      text: { en: "VPC Flow Logs", fr: "Journaux de flux VPC (VPC Flow Logs)" }
answer: { optionId: d }
explanation:
  correct:
    en: "VPC Flow Logs capture information about the IP traffic of network interfaces in a VPC, such as source and destination addresses, ports and whether the traffic was accepted or rejected. The records can be published to Amazon CloudWatch Logs, Amazon S3 or Amazon Data Firehose."
    fr: "Les journaux de flux VPC capturent des informations sur le trafic IP des interfaces réseau d'un VPC, comme les adresses source et de destination, les ports et l'acceptation ou le rejet du trafic. Les enregistrements peuvent être publiés dans Amazon CloudWatch Logs, Amazon S3 ou Amazon Data Firehose."
  options:
    a:
      en: "AWS Config records changes to resource configurations, such as security group rules, not the traffic itself."
      fr: "AWS Config enregistre les modifications de configuration des ressources, comme les règles des groupes de sécurité, pas le trafic lui-même."
    b:
      en: "Resolver query logging records the DNS queries made from the VPC, not all IP traffic and its accept or reject status."
      fr: "La journalisation des requêtes Resolver enregistre les requêtes DNS émises depuis le VPC, pas tout le trafic IP ni son statut d'acceptation ou de rejet."
    c:
      en: "Management events record API calls made on resources, not the network traffic that reaches the network interfaces."
      fr: "Les événements de gestion enregistrent les appels d'API effectués sur les ressources, pas le trafic réseau qui atteint les interfaces réseau."
references:
  - title: "Logging IP traffic using VPC Flow Logs"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html
  - title: "Flow log records"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html
