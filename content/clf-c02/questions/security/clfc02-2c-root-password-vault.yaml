id: clfc02-2c-root-password-vault
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to store the root user password of its AWS account in a secure location. The company must still be able to retrieve the password if it loses access to the account. Which storage option follows AWS best practices?
  fr: |
    Une entreprise veut stocker le mot de passe de l'utilisateur racine de son compte AWS dans un emplacement sécurisé. Elle doit pouvoir récupérer ce mot de passe même si elle perd l'accès au compte. Quelle option de stockage respecte les bonnes pratiques AWS ?
body:
  options:
    - { id: a, text: { en: "A password manager outside the AWS account that needs two approvers and logs each access.", fr: "Un gestionnaire de mots de passe hors du compte AWS qui exige deux approbateurs et journalise chaque accès." } }
    - { id: b, text: { en: "A secret in AWS Secrets Manager in the same AWS account, encrypted with an AWS KMS key.", fr: "Un secret dans AWS Secrets Manager dans le même compte AWS, chiffré avec une clé AWS KMS." } }
    - { id: c, text: { en: "A SecureString parameter in AWS Systems Manager Parameter Store in the same AWS account.", fr: "Un paramètre SecureString dans AWS Systems Manager Parameter Store dans le même compte AWS." } }
    - { id: d, text: { en: "An email sent to every administrator so that at least one of them can always find it.", fr: "Un e-mail envoyé à chaque administrateur pour qu'au moins l'un d'eux puisse toujours le retrouver." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS advises against storing the root password in a tool that depends on AWS services in the same account, because the company could not reach it after losing access. A password manager outside the account, where two or more people must authorize access and access is logged and monitored, keeps the password both safe and recoverable."
    fr: "AWS déconseille de stocker le mot de passe racine dans un outil qui dépend des services AWS du même compte, car l'entreprise ne pourrait plus l'atteindre après avoir perdu l'accès. Un gestionnaire de mots de passe hors du compte, où deux personnes ou plus doivent autoriser l'accès et où l'accès est journalisé et surveillé, garde le mot de passe à la fois protégé et récupérable."
  options:
    b:
      en: "Secrets Manager in the same account depends on that account: if the company loses access, it also loses access to the stored password."
      fr: "Secrets Manager dans le même compte dépend de ce compte : si l'entreprise perd l'accès, elle perd aussi l'accès au mot de passe stocké."
    c:
      en: "Parameter Store in the same account has the same problem: the password is unreachable when access to the account is lost."
      fr: "Parameter Store dans le même compte pose le même problème : le mot de passe est inaccessible lorsque l'accès au compte est perdu."
    d:
      en: "Emailing the password to every administrator spreads root credentials widely, against the guidance to share them only on strict business need."
      fr: "Envoyer le mot de passe à chaque administrateur diffuse largement les informations d'identification racine, contrairement à la recommandation de ne les partager qu'en cas de stricte nécessité."
references:
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
