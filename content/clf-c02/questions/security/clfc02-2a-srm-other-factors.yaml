id: clfc02-2a-srm-other-factors
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Under the AWS shared responsibility model, the customer's responsibilities depend on the AWS services it uses. Which other factors also determine the customer's responsibilities? (Choose two.)
  fr: |
    Selon le modèle de responsabilité partagée AWS, les responsabilités du client dépendent des services AWS qu'il utilise. Quels autres facteurs déterminent aussi les responsabilités du client ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The sensitivity of the customer's data", fr: "La sensibilité des données du client" } }
    - { id: b, text: { en: "The AWS Support plan of the account", fr: "Le plan AWS Support du compte" } }
    - { id: c, text: { en: "The purchasing option of its EC2 instances", fr: "L'option d'achat de ses instances EC2" } }
    - { id: d, text: { en: "The hardware generation of the AWS hosts", fr: "La génération du matériel des hôtes AWS" } }
    - { id: e, text: { en: "The applicable laws and regulations", fr: "Les lois et réglementations applicables" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "AWS documentation states that, beyond the services used, the customer is also responsible for factors such as the sensitivity of its data, its company's requirements, and applicable laws and regulations. Sensitive or regulated data calls for more controls on the customer's side."
    fr: "La documentation AWS indique qu'au-delà des services utilisés, le client est aussi responsable de facteurs comme la sensibilité de ses données, les exigences de son entreprise et les lois et réglementations applicables. Des données sensibles ou réglementées demandent davantage de contrôles du côté du client."
  options:
    b:
      en: "The Support plan changes the level of help available, not the security responsibilities of the customer."
      fr: "Le plan Support change le niveau d'aide disponible, pas les responsabilités de sécurité du client."
    c:
      en: "On-Demand, Reserved Instances, Savings Plans or Spot change the price of the capacity, not its security responsibilities."
      fr: "On-Demand, Reserved Instances, Savings Plans ou Spot changent le prix de la capacité, pas les responsabilités de sécurité."
    d:
      en: "The physical hardware is part of the infrastructure that AWS secures; its generation does not change the customer's duties."
      fr: "Le matériel physique fait partie de l'infrastructure sécurisée par AWS ; sa génération ne change pas les obligations du client."
references:
  - title: Security in AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-security.html
