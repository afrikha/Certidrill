id: clfc02-2b-svc-object-lock-worm
objective: "2.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company must keep electronic records in a write-once-read-many (WORM) format. No user, including the root user, may overwrite or delete a record before its retention period ends.

    Which AWS feature will meet this requirement?
  fr: |
    Une entreprise de services financiers doit conserver des enregistrements électroniques au format WORM (write-once-read-many). Aucun utilisateur, y compris l'utilisateur racine, ne doit pouvoir écraser ou supprimer un enregistrement avant la fin de sa période de conservation.

    Quelle fonctionnalité AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "An S3 Lifecycle expiration rule", fr: "Une règle d'expiration du cycle de vie S3" }
    - id: b
      text: { en: "S3 Object Lock in governance mode", fr: "S3 Object Lock en mode gouvernance" }
    - id: c
      text: { en: "S3 Object Lock in compliance mode", fr: "S3 Object Lock en mode conformité" }
    - id: d
      text: { en: "S3 Versioning", fr: "La gestion des versions S3 (S3 Versioning)" }
answer: { optionId: c }
explanation:
  correct:
    en: "S3 Object Lock stores objects with a WORM model. In compliance mode, no user, including the root user of the account, can overwrite or delete a protected object version or shorten its retention period until the period ends."
    fr: "S3 Object Lock stocke les objets selon un modèle WORM. En mode conformité, aucun utilisateur, y compris l'utilisateur racine du compte, ne peut écraser ou supprimer une version d'objet protégée ni raccourcir sa période de conservation avant la fin de celle-ci."
  options:
    a:
      en: "An expiration rule deletes objects after a period; it does not prevent anyone from deleting them earlier."
      fr: "Une règle d'expiration supprime les objets après une période ; elle n'empêche personne de les supprimer plus tôt."
    b:
      en: "In governance mode, users with special permissions can bypass the retention settings or delete objects."
      fr: "En mode gouvernance, des utilisateurs disposant d'autorisations spéciales peuvent contourner les paramètres de conservation ou supprimer des objets."
    d:
      en: "Versioning keeps previous versions, but users with permissions can still permanently delete them."
      fr: "La gestion des versions conserve les versions précédentes, mais des utilisateurs autorisés peuvent toujours les supprimer définitivement."
references:
  - title: "Locking objects with Object Lock"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
