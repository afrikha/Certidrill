id: clfc02-2d-trusted-advisor-security-gaps
objective: "2.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants an AWS service that inspects its AWS environment and recommends actions when it finds security gaps, such as public Amazon EBS snapshots and IAM access keys that have not been rotated.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise veut un service AWS qui inspecte son environnement AWS et recommande des actions quand il trouve des failles de sécurité, comme des instantanés Amazon EBS publics et des clés d'accès IAM qui n'ont pas fait l'objet d'une rotation.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: b
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
    - id: c
      text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" }
    - id: d
      text: { en: "AWS Cost Explorer", fr: "AWS Cost Explorer" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Trusted Advisor inspects the AWS environment and makes recommendations that follow AWS best practices. Its security checks include Amazon EBS Public Snapshots and IAM Access Key Rotation, among many others."
    fr: "AWS Trusted Advisor inspecte l'environnement AWS et formule des recommandations conformes aux bonnes pratiques AWS. Ses vérifications de sécurité comprennent notamment Amazon EBS Public Snapshots et IAM Access Key Rotation."
  options:
    a:
      en: "Amazon Inspector scans EC2 instances, container images, and Lambda functions for software vulnerabilities; it does not check snapshot permissions or key rotation."
      fr: "Amazon Inspector analyse les instances EC2, les images de conteneur et les fonctions Lambda pour y trouver des vulnérabilités logicielles ; il ne vérifie ni les autorisations des instantanés ni la rotation des clés."
    c:
      en: "CloudTrail records API activity; it does not evaluate the account against best practices."
      fr: "CloudTrail enregistre l'activité des API ; il n'évalue pas le compte par rapport aux bonnes pratiques."
    d:
      en: "Cost Explorer analyzes costs and usage; it has no security checks."
      fr: "Cost Explorer analyse les coûts et l'utilisation ; il n'a pas de vérifications de sécurité."
references:
  - title: "AWS Trusted Advisor"
    url: https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor.html
  - title: "Security"
    url: https://docs.aws.amazon.com/awssupport/latest/user/security-checks.html
