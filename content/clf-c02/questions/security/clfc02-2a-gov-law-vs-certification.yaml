id: clfc02-2a-gov-law-vs-certification
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AWS groups its compliance programs into certifications and attestations, laws and regulations, and alignments and frameworks. Which item is a law or regulation?
  fr: |
    AWS classe ses programmes de conformité en certifications et attestations, lois et réglementations, et alignements et cadres. Quel élément est une loi ou une réglementation ?
body:
  options:
    - id: a
      text: ISO 27001
    - id: b
      text: SOC 2
    - id: c
      text: PCI DSS
    - id: d
      text: HIPAA
answer: { optionId: d }
explanation:
  correct:
    en: "HIPAA is a US law, listed by AWS with other laws and regulations such as GDPR and FERPA. For many laws and regulations, no formal certification is available from a cloud provider, and customers remain responsible for complying with them."
    fr: "HIPAA est une loi américaine, qu'AWS classe avec d'autres lois et réglementations comme le RGPD (GDPR) et FERPA. Pour de nombreuses lois et réglementations, aucune certification formelle n'est disponible auprès d'un fournisseur de cloud, et les clients restent responsables de leur respect."
  options:
    a:
      en: "ISO 27001 is a certification assessed by an independent third-party auditor."
      fr: "ISO 27001 est une certification évaluée par un auditeur tiers indépendant."
    b:
      en: "SOC 2 is an attestation report produced by an independent auditor."
      fr: "SOC 2 est un rapport d'attestation produit par un auditeur indépendant."
    c:
      en: "PCI DSS is an industry standard for which AWS holds a third-party attestation."
      fr: "PCI DSS est une norme du secteur pour laquelle AWS détient une attestation tierce."
references:
  - title: Compliance Programs
    url: https://aws.amazon.com/compliance/programs/
