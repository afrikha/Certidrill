id: clfc02-2c-pw-policy-settings
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants to strengthen the console passwords of its IAM users. Which settings can the company configure in the IAM account password policy? (Choose two.)
  fr: |
    Une entreprise veut renforcer les mots de passe de console de ses utilisateurs IAM. Quels paramètres l'entreprise peut-elle configurer dans la politique de mot de passe de compte IAM ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The minimum password length", fr: "La longueur minimale du mot de passe" } }
    - { id: b, text: { en: "Automatic rotation of IAM user access keys", fr: "La rotation automatique des clés d'accès des utilisateurs IAM" } }
    - { id: c, text: { en: "Delivery of new passwords to users by SMS", fr: "L'envoi des nouveaux mots de passe aux utilisateurs par SMS" } }
    - { id: d, text: { en: "Prevention of the reuse of previous passwords", fr: "L'interdiction de réutiliser les mots de passe précédents" } }
    - { id: e, text: { en: "Application of the policy to the root user", fr: "L'application de la politique à l'utilisateur racine" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "An IAM account password policy can set a minimum length (6 to 128 characters), required character types, an expiration period, whether users can change their own password, and the prevention of reuse of 1 to 24 previous passwords."
    fr: "Une politique de mot de passe de compte IAM peut définir une longueur minimale (6 à 128 caractères), les types de caractères requis, une durée d'expiration, la possibilité pour les utilisateurs de changer leur propre mot de passe et l'interdiction de réutiliser de 1 à 24 mots de passe précédents."
  options:
    b:
      en: "The password policy does not apply to access keys and cannot rotate them."
      fr: "La politique de mot de passe ne s'applique pas aux clés d'accès et ne peut pas en faire la rotation."
    c:
      en: "The password policy has no setting to send passwords to users by SMS."
      fr: "La politique de mot de passe n'a aucun paramètre pour envoyer des mots de passe aux utilisateurs par SMS."
    e:
      en: "The IAM account password policy never applies to the root user password."
      fr: "La politique de mot de passe de compte IAM ne s'applique jamais au mot de passe de l'utilisateur racine."
references:
  - title: Set an account password policy for IAM users
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_account-policy.html
