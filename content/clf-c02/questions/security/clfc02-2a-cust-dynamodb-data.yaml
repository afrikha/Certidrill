id: clfc02-2a-cust-dynamodb-data
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores order data in Amazon DynamoDB tables. Which task is the company's responsibility under the AWS shared responsibility model?
  fr: |
    Une entreprise stocke des données de commandes dans des tables Amazon DynamoDB. Quelle tâche relève de la responsabilité de l'entreprise selon le modèle de responsabilité partagée AWS ?
body:
  options:
    - id: a
      text: { en: "Classifying its data and choosing the encryption options", fr: "Classer ses données et choisir les options de chiffrement" }
    - id: b
      text: { en: "Patching the operating system of the DynamoDB servers", fr: "Appliquer les correctifs au système d'exploitation des serveurs DynamoDB" }
    - id: c
      text: { en: "Operating the platform software that runs DynamoDB", fr: "Exploiter le logiciel de plateforme qui exécute DynamoDB" }
    - id: d
      text: { en: "Maintaining the storage hardware behind the tables", fr: "Entretenir le matériel de stockage derrière les tables" }
answer: { optionId: a }
explanation:
  correct:
    en: "DynamoDB is an abstracted service: AWS operates the infrastructure layer, the operating system, and the platform. The customer manages its data, including encryption options, classifies its assets, and uses IAM to apply the appropriate permissions."
    fr: "DynamoDB est un service abstrait : AWS exploite la couche d'infrastructure, le système d'exploitation et la plateforme. Le client gère ses données, y compris les options de chiffrement, classe ses ressources et utilise IAM pour appliquer les autorisations appropriées."
  options:
    b:
      en: "For abstracted services, AWS operates the operating system; the customer only accesses the endpoints to store and retrieve data."
      fr: "Pour les services abstraits, AWS exploite le système d'exploitation ; le client accède seulement aux points de terminaison pour stocker et récupérer les données."
    c:
      en: "AWS operates the platform of abstracted services such as DynamoDB."
      fr: "AWS exploite la plateforme des services abstraits comme DynamoDB."
    d:
      en: "Hardware is part of the infrastructure layer that AWS operates."
      fr: "Le matériel fait partie de la couche d'infrastructure exploitée par AWS."
references:
  - title: Shared responsibility
    url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html
