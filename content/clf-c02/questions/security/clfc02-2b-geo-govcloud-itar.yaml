id: clfc02-2b-geo-govcloud-itar
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A US defense contractor must host technical data that is subject to the International Traffic in Arms Regulations (ITAR) on AWS.

    Which AWS offering is designed for this kind of regulated workload?
  fr: |
    Un sous-traitant américain de la défense doit héberger sur AWS des données techniques soumises à la réglementation ITAR (International Traffic in Arms Regulations).

    Quelle offre AWS est conçue pour ce type de charge de travail réglementée ?
body:
  options:
    - id: a
      text: { en: "AWS GovCloud (US) Regions", fr: "Les Régions AWS GovCloud (US)" }
    - id: b
      text: { en: "AWS Local Zones in US cities", fr: "Les AWS Local Zones dans des villes américaines" }
    - id: c
      text: { en: "The US East (N. Virginia) Region with AWS Shield Advanced", fr: "La Région US East (N. Virginia) avec AWS Shield Advanced" }
    - id: d
      text: { en: "Dedicated Instances in the US East (N. Virginia) Region", fr: "Des instances dédiées dans la Région US East (N. Virginia)" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS GovCloud (US) Regions are isolated Regions designed for sensitive and regulated workloads, such as those subject to ITAR or FedRAMP High. They are administered exclusively by AWS personnel who are US citizens."
    fr: "Les Régions AWS GovCloud (US) sont des Régions isolées conçues pour les charges de travail sensibles et réglementées, comme celles soumises à ITAR ou à FedRAMP High. Elles sont administrées exclusivement par du personnel d'AWS de nationalité américaine."
  options:
    b:
      en: "Local Zones extend a commercial Region closer to users for low latency; they are not the isolated environment designed for ITAR workloads."
      fr: "Les Local Zones rapprochent une Région commerciale des utilisateurs pour une faible latence ; ce n'est pas l'environnement isolé conçu pour les charges de travail ITAR."
    c:
      en: "Shield Advanced adds DDoS protection; it does not turn a commercial Region into the isolated environment designed for ITAR workloads."
      fr: "Shield Advanced ajoute une protection DDoS ; il ne transforme pas une Région commerciale en environnement isolé conçu pour les charges de travail ITAR."
    d:
      en: "Dedicated Instances isolate the hardware, but a commercial Region is not the AWS offering built for ITAR requirements."
      fr: "Les instances dédiées isolent le matériel, mais une Région commerciale n'est pas l'offre AWS conçue pour les exigences ITAR."
references:
  - title: "What Is AWS GovCloud (US)?"
    url: https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/whatis.html
