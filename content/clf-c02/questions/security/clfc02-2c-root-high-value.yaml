id: clfc02-2c-root-high-value
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A security team is explaining to new staff why the root user of an AWS account needs stronger protection than other identities. Which statements are true? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe de sécurité explique aux nouveaux collaborateurs pourquoi l'utilisateur racine d'un compte AWS doit être mieux protégé que les autres identités. Quelles affirmations sont vraies ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The root user has full access to all resources in the account, including billing.", fr: "L'utilisateur racine a un accès complet à toutes les ressources du compte, y compris la facturation." } }
    - { id: b, text: { en: "Actions that the root user performs are never recorded by AWS CloudTrail.", fr: "Les actions effectuées par l'utilisateur racine ne sont jamais enregistrées par AWS CloudTrail." } }
    - { id: c, text: { en: "The root user can also access the resources in other customers' AWS accounts.", fr: "L'utilisateur racine peut aussi accéder aux ressources des comptes AWS d'autres clients." } }
    - { id: d, text: { en: "The root user can perform account-level tasks, such as closing the AWS account.", fr: "L'utilisateur racine peut effectuer des tâches au niveau du compte, comme la fermeture du compte AWS." } }
    - { id: e, text: { en: "The root user password can never be changed after the account is created.", fr: "Le mot de passe de l'utilisateur racine ne peut plus être changé après la création du compte." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The root user has full access to every service and resource in its account, including billing information. It can also perform account-level tasks that require root user credentials, such as closing a standalone account, so stolen root credentials would give an attacker complete control of the account."
    fr: "L'utilisateur racine a un accès complet à tous les services et ressources de son compte, y compris les informations de facturation. Il peut aussi effectuer des tâches au niveau du compte qui exigent ses informations d'identification, comme la fermeture d'un compte autonome : des informations d'identification racine volées donneraient donc à un attaquant le contrôle total du compte."
  options:
    b:
      en: "CloudTrail records root user sign-ins and actions; AWS recommends monitoring them."
      fr: "CloudTrail enregistre les connexions et les actions de l'utilisateur racine ; AWS recommande de les surveiller."
    c:
      en: "The root user's access is limited to its own AWS account."
      fr: "L'accès de l'utilisateur racine est limité à son propre compte AWS."
    e:
      en: "The root user password can be changed, and AWS recommends a strong, unique password."
      fr: "Le mot de passe racine peut être changé, et AWS recommande un mot de passe fort et unique."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
