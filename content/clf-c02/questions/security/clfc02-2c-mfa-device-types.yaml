id: clfc02-2c-mfa-device-types
objective: "2.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An administrator is choosing MFA devices for the IAM users of an AWS account. Which MFA types can the administrator register for an IAM user? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un administrateur choisit des appareils MFA pour les utilisateurs IAM d'un compte AWS. Quels types de MFA l'administrateur peut-il enregistrer pour un utilisateur IAM ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Passkeys and FIDO security keys", fr: "Les passkeys et les clés de sécurité FIDO" } }
    - { id: b, text: { en: "Codes sent by SMS text message", fr: "Les codes envoyés par SMS" } }
    - { id: c, text: { en: "Virtual authenticator apps", fr: "Les applications d'authentification virtuelles" } }
    - { id: d, text: { en: "One-time codes sent by email", fr: "Les codes à usage unique envoyés par e-mail" } }
    - { id: e, text: { en: "Hardware TOTP tokens", fr: "Les jetons TOTP matériels" } }
    - { id: f, text: { en: "Security questions chosen by the user", fr: "Les questions de sécurité choisies par l'utilisateur" } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "IAM supports passkeys and FIDO security keys, which AWS recommends because they resist phishing, virtual authenticator apps and hardware TOTP tokens. A root user or an IAM user can register up to eight MFA devices of any combination of these types."
    fr: "IAM prend en charge les passkeys et les clés de sécurité FIDO, recommandées par AWS car elles résistent à l'hameçonnage, les applications d'authentification virtuelles et les jetons TOTP matériels. Un utilisateur racine ou un utilisateur IAM peut enregistrer jusqu'à huit appareils MFA, dans toute combinaison de ces types."
  options:
    b:
      en: "AWS has ended support for enabling SMS text message MFA."
      fr: "AWS a mis fin à la possibilité d'activer la MFA par SMS."
    d:
      en: "Email codes are not an MFA device type that can be registered for an IAM user."
      fr: "Les codes par e-mail ne sont pas un type d'appareil MFA qu'on peut enregistrer pour un utilisateur IAM."
    f:
      en: "Security questions are something the user knows, like a password; they are not an MFA device."
      fr: "Les questions de sécurité relèvent de ce que l'utilisateur sait, comme un mot de passe ; ce ne sont pas des appareils MFA."
references:
  - title: AWS Multi-factor authentication in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html
