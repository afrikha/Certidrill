id: clfc02-2a-comp-zone-security
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's application routes and zones its data within specific security environments, as required by the bank's own design. In the AWS shared responsibility model, what type of control is this?
  fr: |
    L'application d'une banque route et zone ses données dans des environnements de sécurité spécifiques, comme l'exige la conception propre de la banque. Dans le modèle de responsabilité partagée AWS, de quel type de contrôle s'agit-il ?
body:
  options:
    - id: a
      text: { en: "An inherited control", fr: "Un contrôle hérité" }
    - id: b
      text: { en: "A shared control", fr: "Un contrôle partagé" }
    - id: c
      text: { en: "A customer-specific control", fr: "Un contrôle spécifique au client" }
    - id: d
      text: { en: "A preventive control", fr: "Un contrôle préventif" }
answer: { optionId: c }
explanation:
  correct:
    en: "Customer-specific controls are solely the customer's responsibility, based on the applications it deploys in AWS services. AWS gives service and communications protection, or zone security, as the example: routing or zoning data within specific security environments."
    fr: "Les contrôles spécifiques au client relèvent uniquement du client, en fonction des applications qu'il déploie dans les services AWS. AWS donne comme exemple la protection des services et des communications, ou sécurité des zones : router ou zoner les données dans des environnements de sécurité spécifiques."
  options:
    a:
      en: "Inherited controls are fully provided by AWS, such as physical and environmental controls; AWS does not design how a customer zones its data."
      fr: "Les contrôles hérités sont entièrement fournis par AWS, comme les contrôles physiques et environnementaux ; AWS ne conçoit pas la façon dont un client zone ses données."
    b:
      en: "Shared controls, such as patch management, have an AWS part and a customer part; zone security has only a customer part."
      fr: "Les contrôles partagés, comme la gestion des correctifs, ont une part AWS et une part client ; la sécurité des zones n'a qu'une part client."
    d:
      en: "Preventive is a way to describe what a control does, not one of the three categories of the shared responsibility model."
      fr: "Préventif décrit l'effet d'un contrôle, ce n'est pas une des trois catégories du modèle de responsabilité partagée."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
