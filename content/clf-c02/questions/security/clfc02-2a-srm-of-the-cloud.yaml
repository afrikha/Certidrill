id: clfc02-2a-srm-of-the-cloud
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the AWS shared responsibility model, what does "security of the cloud" cover?
  fr: |
    Dans le modèle de responsabilité partagée AWS, que couvre la « sécurité du cloud » ?
body:
  options:
    - id: a
      text: { en: "The protection of the data that customers store in AWS services.", fr: "La protection des données que les clients stockent dans les services AWS." }
    - id: b
      text: { en: "The configuration of the security groups that protect customer instances.", fr: "La configuration des groupes de sécurité qui protègent les instances des clients." }
    - id: c
      text: { en: "The protection of the hardware, software, networking, and facilities that run AWS services.", fr: "La protection du matériel, des logiciels, du réseau et des installations qui exécutent les services AWS." }
    - id: d
      text: { en: "The patching of the guest operating systems that customers run on AWS.", fr: "L'application des correctifs aux systèmes d'exploitation invités que les clients exécutent sur AWS." }
answer: { optionId: c }
explanation:
  correct:
    en: "Security of the cloud is the AWS part of the model: AWS protects the infrastructure that runs all AWS Cloud services, which is made up of hardware, software, networking, and facilities. This includes Regions, Availability Zones and edge locations."
    fr: "La sécurité du cloud est la part d'AWS dans le modèle : AWS protège l'infrastructure qui exécute tous les services du Cloud AWS, composée du matériel, des logiciels, du réseau et des installations. Elle comprend les Régions, les zones de disponibilité et les emplacements périphériques."
  options:
    a:
      en: "Customer data is part of security in the cloud: the customer manages and protects it."
      fr: "Les données du client relèvent de la sécurité dans le cloud : c'est le client qui les gère et les protège."
    b:
      en: "Customers configure the security groups of their own instances; this is security in the cloud."
      fr: "Les clients configurent les groupes de sécurité de leurs propres instances ; cela relève de la sécurité dans le cloud."
    d:
      en: "Guest operating system updates and patches are the customer's responsibility for services such as Amazon EC2."
      fr: "Les mises à jour et correctifs du système d'exploitation invité sont de la responsabilité du client pour des services comme Amazon EC2."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
