id: clfc02-2c-lp-definition
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the principle of least privilege in AWS?
  fr: |
    Quelle affirmation décrit le principe du moindre privilège dans AWS ?
body:
  options:
    - { id: a, text: { en: "Grant each identity only the permissions it needs to perform its tasks, and no more.", fr: "Accorder à chaque identité uniquement les autorisations nécessaires à ses tâches, et rien de plus." } }
    - { id: b, text: { en: "Grant administrator permissions to every user and review their activity every month.", fr: "Accorder des autorisations d'administrateur à chaque utilisateur et revoir leur activité chaque mois." } }
    - { id: c, text: { en: "Grant permissions only to IAM groups and never to IAM roles or individual users.", fr: "Accorder des autorisations uniquement aux groupes IAM et jamais aux rôles IAM ni aux utilisateurs." } }
    - { id: d, text: { en: "Deny every action to every identity so that no permissions are ever granted at all.", fr: "Refuser toutes les actions à toutes les identités afin qu'aucune autorisation ne soit jamais accordée." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Least privilege means granting only the permissions required to perform a task: the needed actions, on specific resources, under specific conditions. Permissions can start broader while a workload's needs are learned and then be narrowed over time."
    fr: "Le moindre privilège consiste à n'accorder que les autorisations nécessaires à une tâche : les actions requises, sur des ressources précises, dans des conditions précises. Les autorisations peuvent être plus larges au départ, le temps de connaître les besoins d'une charge de travail, puis être réduites au fil du temps."
  options:
    b:
      en: "Reviewing activity after granting administrator access to everyone is the opposite of least privilege."
      fr: "Revoir l'activité après avoir donné un accès administrateur à tous est l'inverse du moindre privilège."
    c:
      en: "Groups simplify management, but least privilege is about how many permissions are granted, not which identity type receives them."
      fr: "Les groupes simplifient la gestion, mais le moindre privilège porte sur l'étendue des autorisations accordées, pas sur le type d'identité qui les reçoit."
    d:
      en: "Identities still need the permissions required for their work; denying everything would stop all work."
      fr: "Les identités ont tout de même besoin des autorisations nécessaires à leur travail ; tout refuser bloquerait toute activité."
references:
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
