id: clfc02-2b-enc-cloudhsm-dedicated
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial company must generate and store its encryption keys in dedicated, single-tenant hardware security modules (HSMs) that only the company controls.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise financière doit générer et stocker ses clés de chiffrement dans des modules de sécurité matériels (HSM) dédiés et à locataire unique que seule l'entreprise contrôle.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "AWS Certificate Manager (ACM)", fr: "AWS Certificate Manager (ACM)" }
    - id: b
      text: { en: "AWS CloudHSM", fr: "AWS CloudHSM" }
    - id: c
      text: { en: "AWS KMS with AWS managed keys", fr: "AWS KMS avec des clés gérées par AWS" }
    - id: d
      text: { en: "AWS Secrets Manager", fr: "AWS Secrets Manager" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS CloudHSM provides single-tenant hardware security modules, FIPS validated in FIPS mode, that give the customer full control of its keys. The data plane is end-to-end encrypted and not visible to AWS, and the customer manages its own HSM users."
    fr: "AWS CloudHSM fournit des modules de sécurité matériels à locataire unique, validés FIPS en mode FIPS, qui donnent au client le contrôle total de ses clés. Le plan de données est chiffré de bout en bout et n'est pas visible par AWS, et le client gère lui-même les utilisateurs du HSM."
  options:
    a:
      en: "ACM manages SSL/TLS certificates; it does not provide dedicated HSMs."
      fr: "ACM gère des certificats SSL/TLS ; il ne fournit pas de HSM dédiés."
    c:
      en: "AWS managed keys are created, managed and used by AWS services on the customer's behalf in the shared AWS KMS service, not in HSMs dedicated to the company."
      fr: "Les clés gérées par AWS sont créées, gérées et utilisées par les services AWS pour le compte du client dans le service AWS KMS partagé, pas dans des HSM dédiés à l'entreprise."
    d:
      en: "Secrets Manager stores secrets such as passwords; it does not provide dedicated HSMs."
      fr: "Secrets Manager stocke des secrets comme des mots de passe ; il ne fournit pas de HSM dédiés."
references:
  - title: "What is AWS CloudHSM?"
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html
