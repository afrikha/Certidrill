id: clfc02-2b-svc-hipaa-actions
objective: "2.2.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A US healthcare company plans to store and process protected health information (PHI) on AWS.

    Which two actions must the company take to use AWS for this workload under HIPAA? (Choose two.)
  fr: |
    Une entreprise américaine du secteur de la santé prévoit de stocker et de traiter des informations de santé protégées (PHI) sur AWS.

    Quelles sont les deux actions que l'entreprise doit effectuer pour utiliser AWS pour cette charge de travail dans le cadre de HIPAA ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Move the workload to an AWS GovCloud (US) Region.", fr: "Déplacer la charge de travail dans une Région AWS GovCloud (US)." }
    - id: b
      text: { en: "Store and process PHI only in HIPAA eligible services.", fr: "Stocker et traiter les PHI uniquement dans des services éligibles HIPAA." }
    - id: c
      text: { en: "Accept the AWS Business Associate Addendum (BAA) in AWS Artifact.", fr: "Accepter le Business Associate Addendum (BAA) d'AWS dans AWS Artifact." }
    - id: d
      text: { en: "Subscribe to AWS Shield Advanced for every account.", fr: "Souscrire à AWS Shield Advanced pour chaque compte." }
    - id: e
      text: { en: "Ask AWS to issue a HIPAA certification for the company's account.", fr: "Demander à AWS de délivrer une certification HIPAA pour le compte de l'entreprise." }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "A company subject to HIPAA must have a BAA with AWS, which it reviews and accepts in AWS Artifact, before it uses AWS for PHI. Under the BAA, PHI may be processed, stored or transmitted only in the services that AWS lists as HIPAA eligible."
    fr: "Une entreprise soumise à HIPAA doit avoir un BAA avec AWS, qu'elle consulte et accepte dans AWS Artifact, avant d'utiliser AWS pour des PHI. Selon le BAA, les PHI ne peuvent être traitées, stockées ou transmises que dans les services qu'AWS désigne comme éligibles HIPAA."
  options:
    a:
      en: "GovCloud (US) addresses requirements such as ITAR and FedRAMP High; HIPAA requires the BAA and eligible services, not a specific Region."
      fr: "GovCloud (US) répond à des exigences comme ITAR et FedRAMP High ; HIPAA exige le BAA et des services éligibles, pas une Région particulière."
    d:
      en: "Shield Advanced adds DDoS protection; HIPAA does not require it."
      fr: "Shield Advanced ajoute une protection DDoS ; HIPAA ne l'exige pas."
    e:
      en: "There is no HIPAA certification for cloud providers or accounts; AWS offers HIPAA eligible services and the BAA."
      fr: "Il n'existe pas de certification HIPAA pour les fournisseurs de cloud ou les comptes ; AWS propose des services éligibles HIPAA et le BAA."
references:
  - title: "HIPAA Compliance"
    url: https://aws.amazon.com/compliance/hipaa-compliance/
