id: clfc02-2c-idc-external-idp
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company manages its employees in Okta. It wants employees to use their existing Okta credentials to access several AWS accounts, without creating IAM users. What should the company do?
  fr: |
    Une entreprise gère ses employés dans Okta. Elle veut que les employés utilisent leurs informations d'identification Okta existantes pour accéder à plusieurs comptes AWS, sans créer d'utilisateurs IAM. Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Create an IAM user in each account with the same user name as in Okta.", fr: "Créer un utilisateur IAM dans chaque compte avec le même nom d'utilisateur que dans Okta." } }
    - { id: b, text: { en: "Create an Amazon Cognito user pool and import the employees from Okta.", fr: "Créer un groupe d'utilisateurs (user pool) Amazon Cognito et y importer les employés depuis Okta." } }
    - { id: c, text: { en: "Share the root user credentials of each account with the Okta administrators.", fr: "Partager les informations d'identification racine de chaque compte avec les administrateurs Okta." } }
    - { id: d, text: { en: "Connect Okta to AWS IAM Identity Center as its external identity provider.", fr: "Connecter Okta à AWS IAM Identity Center comme fournisseur d'identité externe." } }
answer: { optionId: d }
explanation:
  correct:
    en: "IAM Identity Center can use an external identity provider, such as Okta or Microsoft Entra ID, as its identity source. Employees then sign in with their existing credentials and receive access to their assigned AWS accounts without any IAM users."
    fr: "IAM Identity Center peut utiliser un fournisseur d'identité externe, comme Okta ou Microsoft Entra ID, comme source d'identité. Les employés se connectent alors avec leurs informations d'identification existantes et accèdent aux comptes AWS qui leur sont attribués, sans aucun utilisateur IAM."
  options:
    a:
      en: "This creates the IAM users that the company wants to avoid, with separate passwords to manage in each account."
      fr: "Cela crée les utilisateurs IAM que l'entreprise veut éviter, avec des mots de passe distincts à gérer dans chaque compte."
    b:
      en: "Cognito user pools manage the users of customer-facing apps; they do not give employees access to AWS accounts."
      fr: "Les groupes d'utilisateurs Cognito gèrent les utilisateurs d'applications destinées aux clients ; ils ne donnent pas aux employés l'accès aux comptes AWS."
    c:
      en: "Root user credentials must never be shared, and they would not let employees use their Okta credentials."
      fr: "Les informations d'identification racine ne doivent jamais être partagées, et elles ne permettraient pas aux employés d'utiliser leurs identifiants Okta."
references:
  - title: Manage your identity source
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source.html
