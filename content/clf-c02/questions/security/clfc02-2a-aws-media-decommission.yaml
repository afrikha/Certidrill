id: clfc02-2a-aws-media-decommission
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's security team asks what happens to the AWS storage devices that held the company's data when those devices reach the end of their life. Which statement is correct?
  fr: |
    L'équipe de sécurité d'une entreprise demande ce que deviennent les périphériques de stockage AWS qui ont contenu les données de l'entreprise lorsqu'ils arrivent en fin de vie. Quelle affirmation est correcte ?
body:
  options:
    - id: a
      text: { en: "AWS ships the devices to the company, which must destroy them.", fr: "AWS expédie les périphériques à l'entreprise, qui doit les détruire." }
    - id: b
      text: { en: "AWS decommissions the devices by using techniques detailed in NIST 800-88.", fr: "AWS met les périphériques hors service avec des techniques décrites dans la norme NIST 800-88." }
    - id: c
      text: { en: "The company must hire an auditor to witness the destruction of the devices.", fr: "L'entreprise doit engager un auditeur pour assister à la destruction des périphériques." }
    - id: d
      text: { en: "AWS reuses the devices for other customers once the company deletes its data.", fr: "AWS réutilise les périphériques pour d'autres clients une fois que l'entreprise a supprimé ses données." }
answer: { optionId: b }
explanation:
  correct:
    en: "Media decommissioning is part of the infrastructure that AWS secures. Media that stored customer data stays under AWS control until it is securely decommissioned with techniques detailed in NIST 800-88."
    fr: "La mise hors service des supports fait partie de l'infrastructure sécurisée par AWS. Les supports qui ont stocké des données de clients restent sous le contrôle d'AWS jusqu'à leur mise hors service sécurisée avec des techniques décrites dans la norme NIST 800-88."
  options:
    a:
      en: "Media that held customer data does not leave AWS control before it is securely decommissioned."
      fr: "Les supports qui ont contenu des données de clients ne quittent pas le contrôle d'AWS avant leur mise hors service sécurisée."
    c:
      en: "Customers do not arrange the destruction of AWS media; independent auditors test AWS media disposal as part of AWS compliance programs."
      fr: "Les clients n'organisent pas la destruction des supports AWS ; des auditeurs indépendants testent la mise au rebut des supports dans le cadre des programmes de conformité d'AWS."
    d:
      en: "Decommissioning is handled by AWS with NIST 800-88 techniques; it does not depend on the customer deleting its data first."
      fr: "La mise hors service est assurée par AWS avec les techniques NIST 800-88 ; elle ne dépend pas d'une suppression préalable des données par le client."
references:
  - title: Data Center - Our Controls
    url: https://aws.amazon.com/compliance/data-center/controls/
