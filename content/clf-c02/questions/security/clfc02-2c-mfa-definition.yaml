id: clfc02-2c-mfa-definition
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants users to sign in to the AWS Management Console with their password and also with a code or a key from a device that they possess. What should the company enable?
  fr: |
    Une entreprise veut que les utilisateurs se connectent à l'AWS Management Console avec leur mot de passe et aussi avec un code ou une clé provenant d'un appareil qu'ils possèdent. Que doit activer l'entreprise ?
body:
  options:
    - { id: a, text: { en: "An IAM account password policy", fr: "Une politique de mot de passe de compte IAM" } }
    - { id: b, text: { en: "IAM access keys", fr: "Des clés d'accès IAM" } }
    - { id: c, text: { en: "IAM user groups", fr: "Des groupes d'utilisateurs IAM" } }
    - { id: d, text: { en: "Multi-factor authentication (MFA)", fr: "L'authentification multifacteur (MFA)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "MFA requires a second factor in addition to the password, such as a passkey or security key, a code from a virtual authenticator app or a hardware TOTP token. AWS recommends MFA for the root user and for any IAM user that the company must keep."
    fr: "La MFA exige un second facteur en plus du mot de passe, comme une passkey ou une clé de sécurité, un code d'une application d'authentification virtuelle ou un jeton TOTP matériel. AWS recommande la MFA pour l'utilisateur racine et pour tout utilisateur IAM que l'entreprise doit conserver."
  options:
    a:
      en: "A password policy sets password rules such as length and reuse; it does not add a device-based factor."
      fr: "Une politique de mot de passe fixe des règles comme la longueur et la réutilisation ; elle n'ajoute pas de facteur lié à un appareil."
    b:
      en: "Access keys are long-term credentials for programmatic access; they do not add a second sign-in factor to the console."
      fr: "Les clés d'accès sont des informations d'identification à long terme pour l'accès programmatique ; elles n'ajoutent pas de second facteur à la connexion à la console."
    c:
      en: "User groups organize permissions; they have no effect on how users authenticate."
      fr: "Les groupes d'utilisateurs organisent les autorisations ; ils n'ont aucun effet sur la manière dont les utilisateurs s'authentifient."
references:
  - title: AWS Multi-factor authentication in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html
