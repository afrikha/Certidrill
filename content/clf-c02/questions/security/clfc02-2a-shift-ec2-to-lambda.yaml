id: clfc02-2a-shift-ec2-to-lambda
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company moves an application from Amazon EC2 instances to AWS Lambda functions that use a Lambda-managed runtime. Which tasks will no longer be the company's responsibility? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise migre une application d'instances Amazon EC2 vers des fonctions AWS Lambda qui utilisent un environnement d'exécution géré par Lambda. Quelles tâches ne seront plus de la responsabilité de l'entreprise ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Writing secure application code", fr: "Écrire un code d'application sécurisé" } }
    - { id: b, text: { en: "Patching the server operating systems", fr: "Appliquer les correctifs aux systèmes d'exploitation des serveurs" } }
    - { id: c, text: { en: "Granting permissions to the functions", fr: "Accorder des autorisations aux fonctions" } }
    - { id: d, text: { en: "Provisioning and scaling server capacity", fr: "Provisionner et mettre à l'échelle la capacité des serveurs" } }
    - { id: e, text: { en: "Protecting the data that the code handles", fr: "Protéger les données traitées par le code" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Lambda runs code without provisioning or managing servers: it manages the underlying infrastructure, including server maintenance, capacity provisioning, scaling, and patching. The company can focus on its application logic."
    fr: "Lambda exécute du code sans provisionner ni gérer de serveurs : il gère l'infrastructure sous-jacente, y compris la maintenance des serveurs, le provisionnement de la capacité, la mise à l'échelle et les correctifs. L'entreprise peut se concentrer sur la logique de son application."
  options:
    a:
      en: "The function code is the customer's application; its security stays with the customer."
      fr: "Le code de la fonction est l'application du client ; sa sécurité reste de la responsabilité du client."
    c:
      en: "The customer still defines, with IAM, the permissions that its functions have."
      fr: "Le client définit toujours, avec IAM, les autorisations dont disposent ses fonctions."
    e:
      en: "The customer remains responsible for its data and its sensitivity, whatever the service."
      fr: "Le client reste responsable de ses données et de leur sensibilité, quel que soit le service."
references:
  - title: What is AWS Lambda?
    url: https://docs.aws.amazon.com/lambda/latest/dg/welcome.html
