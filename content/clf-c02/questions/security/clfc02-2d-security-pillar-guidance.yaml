id: clfc02-2d-security-pillar-guidance
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants AWS guidance on design principles for secure workloads, such as implementing a strong identity foundation and applying security at all layers.

    Which AWS resource provides this guidance?
  fr: |
    Une entreprise veut des recommandations AWS sur les principes de conception de charges de travail sécurisées, comme mettre en place une base d'identité solide et appliquer la sécurité à toutes les couches.

    Quelle ressource AWS fournit ces recommandations ?
body:
  options:
    - id: a
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: b
      text: { en: "AWS Security Bulletins", fr: "AWS Security Bulletins" }
    - id: c
      text: { en: "AWS Pricing Calculator", fr: "AWS Pricing Calculator" }
    - id: d
      text: { en: "The security pillar of the AWS Well-Architected Framework", fr: "Le pilier Sécurité du framework AWS Well-Architected" }
answer: { optionId: d }
explanation:
  correct:
    en: "The security pillar of the AWS Well-Architected Framework describes design principles such as implementing a strong identity foundation, maintaining traceability, and applying security at all layers. It also gives best practices in areas such as identity and access management, detection, data protection, and incident response."
    fr: "Le pilier Sécurité du framework AWS Well-Architected décrit des principes de conception comme mettre en place une base d'identité solide, assurer la traçabilité et appliquer la sécurité à toutes les couches. Il donne aussi des bonnes pratiques dans des domaines comme la gestion des identités et des accès, la détection, la protection des données et la réponse aux incidents."
  options:
    a:
      en: "AWS Artifact provides AWS compliance reports and agreements, not design guidance for workloads."
      fr: "AWS Artifact fournit les rapports de conformité et les accords d'AWS, pas des recommandations de conception pour les charges de travail."
    b:
      en: "Security Bulletins announce vulnerabilities that affect AWS services; they do not describe design principles."
      fr: "Les Security Bulletins annoncent les vulnérabilités qui touchent les services AWS ; ils ne décrivent pas de principes de conception."
    c:
      en: "AWS Pricing Calculator estimates costs; it contains no security guidance."
      fr: "AWS Pricing Calculator estime les coûts ; il ne contient aucune recommandation de sécurité."
references:
  - title: "Security foundations"
    url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/security.html
