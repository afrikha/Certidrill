id: clfc02-2c-root-multiple-mfa
objective: "2.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company worries that it will be locked out of the root user of its AWS account if the only registered MFA device is lost. What does AWS recommend?
  fr: |
    Une entreprise craint de perdre l'accès à l'utilisateur racine de son compte AWS si le seul appareil MFA enregistré est perdu. Que recommande AWS ?
body:
  options:
    - { id: a, text: { en: "Disable MFA for the root user and use a longer password.", fr: "Désactiver la MFA de l'utilisateur racine et utiliser un mot de passe plus long." } }
    - { id: b, text: { en: "Add SMS text messages as a backup MFA method.", fr: "Ajouter les SMS comme méthode MFA de secours." } }
    - { id: c, text: { en: "Keep a photo of the MFA setup QR code in an email.", fr: "Conserver une photo du code QR de configuration MFA dans un e-mail." } }
    - { id: d, text: { en: "Register more than one MFA device for the root user.", fr: "Enregistrer plusieurs appareils MFA pour l'utilisateur racine." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The root user can have up to eight MFA devices of any supported type, and AWS strongly recommends registering several for resiliency. Losing one device then does not lock the company out of the root user."
    fr: "L'utilisateur racine peut avoir jusqu'à huit appareils MFA de tout type pris en charge, et AWS recommande vivement d'en enregistrer plusieurs pour la résilience. La perte d'un appareil ne bloque alors pas l'accès à l'utilisateur racine."
  options:
    a:
      en: "MFA is required for root users; removing it would weaken the protection instead of adding resiliency."
      fr: "La MFA est exigée pour les utilisateurs racine ; la supprimer affaiblirait la protection au lieu d'ajouter de la résilience."
    b:
      en: "AWS has ended support for enabling SMS text message MFA."
      fr: "AWS a mis fin à la possibilité d'activer la MFA par SMS."
    c:
      en: "A copy of the MFA secret in an email exposes the second factor to anyone who reads the mailbox."
      fr: "Une copie du secret MFA dans un e-mail expose le second facteur à quiconque lit la boîte aux lettres."
references:
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
