id: clfc02-2a-cust-installed-software
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company installs third-party web server software on its Amazon EC2 instances. The software vendor publishes a security update. Under the AWS shared responsibility model, who must apply the update?
  fr: |
    Une entreprise installe un logiciel de serveur web tiers sur ses instances Amazon EC2. L'éditeur du logiciel publie une mise à jour de sécurité. Selon le modèle de responsabilité partagée AWS, qui doit appliquer la mise à jour ?
body:
  options:
    - id: a
      text: { en: "AWS, because the software runs on AWS infrastructure", fr: "AWS, car le logiciel s'exécute sur l'infrastructure AWS" }
    - id: b
      text: { en: "AWS, because EC2 patches all software along with the host", fr: "AWS, car EC2 corrige tous les logiciels en même temps que l'hôte" }
    - id: c
      text: { en: "The company, because it manages the software it installs", fr: "L'entreprise, car elle gère les logiciels qu'elle installe" }
    - id: d
      text: { en: "AWS and the company, because software is an inherited control", fr: "AWS et l'entreprise, car les logiciels sont un contrôle hérité" }
answer: { optionId: c }
explanation:
  correct:
    en: "Customers that deploy EC2 instances are responsible for the guest operating system and for any application software or utilities they install on the instances. Applying the vendor's update is the company's task."
    fr: "Les clients qui déploient des instances EC2 sont responsables du système d'exploitation invité et de tous les logiciels applicatifs ou utilitaires qu'ils installent sur les instances. Appliquer la mise à jour de l'éditeur est la tâche de l'entreprise."
  options:
    a:
      en: "Running on AWS infrastructure does not make AWS responsible for the software that a customer installs."
      fr: "S'exécuter sur l'infrastructure AWS ne rend pas AWS responsable des logiciels qu'un client installe."
    b:
      en: "AWS patches the host and virtualization layer, not the guest operating system or the software inside the instance."
      fr: "AWS corrige l'hôte et la couche de virtualisation, pas le système d'exploitation invité ni les logiciels de l'instance."
    d:
      en: "Inherited controls are fully provided by AWS; installed software is the customer's alone."
      fr: "Les contrôles hérités sont entièrement fournis par AWS ; les logiciels installés relèvent du client seul."
references:
  - title: Shared responsibility
    url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html
