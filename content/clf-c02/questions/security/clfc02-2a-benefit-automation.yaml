id: clfc02-2a-benefit-automation
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company plans to automate its security tasks on AWS instead of performing them manually. Which benefit does AWS describe for security automation?
  fr: |
    Une entreprise prévoit d'automatiser ses tâches de sécurité sur AWS au lieu de les effectuer manuellement. Quel avantage AWS décrit-il pour l'automatisation de la sécurité ?
body:
  options:
    - id: a
      text: { en: "Less time spent on routine tasks and fewer human errors", fr: "Moins de temps consacré aux tâches routinières et moins d'erreurs humaines" }
    - id: b
      text: { en: "Transfer of the company's security reviews to AWS", fr: "Transfert des revues de sécurité de l'entreprise à AWS" }
    - id: c
      text: { en: "Transfer of the company's IAM configuration to AWS", fr: "Transfert de la configuration IAM de l'entreprise à AWS" }
    - id: d
      text: { en: "Replacement of encryption for the company's sensitive data", fr: "Remplacement du chiffrement des données sensibles de l'entreprise" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS presents security automation as a driver of speed and agility: by integrating security into its processes, an organization spends less time on routine tasks and reduces human error."
    fr: "AWS présente l'automatisation de la sécurité comme un facteur de rapidité et d'agilité : en intégrant la sécurité à ses processus, une organisation consacre moins de temps aux tâches routinières et réduit les erreurs humaines."
  options:
    b:
      en: "Automation supports the company's security work; reviewing its own security posture stays with the company."
      fr: "L'automatisation soutient le travail de sécurité de l'entreprise ; la revue de sa propre posture de sécurité reste à l'entreprise."
    c:
      en: "Automating tasks does not move the customer's IAM responsibilities to AWS."
      fr: "Automatiser des tâches ne transfère pas les responsabilités IAM du client à AWS."
    d:
      en: "Automation does not replace encryption; protecting sensitive data remains a customer choice."
      fr: "L'automatisation ne remplace pas le chiffrement ; la protection des données sensibles reste un choix du client."
references:
  - title: Cloud Security
    url: https://aws.amazon.com/security/
