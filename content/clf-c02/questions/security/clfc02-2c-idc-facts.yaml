id: clfc02-2c-idc-facts
objective: "2.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company is planning to use AWS IAM Identity Center for its organization in AWS Organizations. Which statements about IAM Identity Center are true? (Choose two.)
  fr: |
    Une entreprise prévoit d'utiliser AWS IAM Identity Center pour son organisation AWS Organizations. Quelles affirmations sur IAM Identity Center sont vraies ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assigning a permission set to a user creates an IAM user for that person in each account.", fr: "Attribuer un ensemble d'autorisations à un utilisateur crée un utilisateur IAM pour cette personne dans chaque compte." } }
    - { id: b, text: { en: "The organization can use only one identity source at a time, such as Okta or Active Directory.", fr: "L'organisation ne peut utiliser qu'une seule source d'identité à la fois, comme Okta ou Active Directory." } }
    - { id: c, text: { en: "Assigning a permission set to an account creates IAM roles that IAM Identity Center manages there.", fr: "Attribuer un ensemble d'autorisations à un compte y crée des rôles IAM gérés par IAM Identity Center." } }
    - { id: d, text: { en: "Employees must create long-term access keys before they can sign in to the AWS access portal.", fr: "Les employés doivent créer des clés d'accès à long terme avant de pouvoir se connecter au portail d'accès AWS." } }
    - { id: e, text: { en: "An account instance of IAM Identity Center can manage access to every account in the organization.", fr: "Une instance de compte d'IAM Identity Center peut gérer l'accès à tous les comptes de l'organisation." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "IAM Identity Center allows one identity source per organization at a time: the Identity Center directory, Active Directory or an external identity provider. When a permission set is assigned to an account, IAM Identity Center creates IAM roles in that account, attaches the permission set's policies and manages those roles."
    fr: "IAM Identity Center autorise une seule source d'identité par organisation à la fois : le répertoire Identity Center, Active Directory ou un fournisseur d'identité externe. Lorsqu'un ensemble d'autorisations est attribué à un compte, IAM Identity Center crée des rôles IAM dans ce compte, y attache les politiques de l'ensemble d'autorisations et gère ces rôles."
  options:
    a:
      en: "Permission sets are provisioned as IAM roles, not IAM users; users assume the roles with short-term credentials."
      fr: "Les ensembles d'autorisations sont provisionnés sous forme de rôles IAM, pas d'utilisateurs IAM ; les utilisateurs endossent les rôles avec des informations d'identification de courte durée."
    d:
      en: "Users sign in to the AWS access portal with their identity source credentials; no long-term access keys are needed."
      fr: "Les utilisateurs se connectent au portail d'accès AWS avec les informations d'identification de leur source d'identité ; aucune clé d'accès à long terme n'est nécessaire."
    e:
      en: "Only an organization instance, enabled in the management account, can manage access to AWS accounts."
      fr: "Seule une instance d'organisation, activée dans le compte de gestion, peut gérer l'accès aux comptes AWS."
references:
  - title: Manage your identity source
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source.html
  - title: Manage AWS accounts with permission sets
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html
