id: clfc02-2b-iam-role-identity
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company needs an IAM identity that has specific permissions, has no long-term password or access keys, and can be assumed by users, applications or AWS services that need it.

    Which IAM identity should the company use?
  fr: |
    Une entreprise a besoin d'une identité IAM qui dispose d'autorisations précises, n'a ni mot de passe ni clés d'accès à long terme, et peut être assumée par les utilisateurs, applications ou services AWS qui en ont besoin.

    Quelle identité IAM l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "An IAM role", fr: "Un rôle IAM" }
    - id: b
      text: { en: "The root user", fr: "L'utilisateur racine" }
    - id: c
      text: { en: "An IAM user", fr: "Un utilisateur IAM" }
    - id: d
      text: { en: "An IAM user group", fr: "Un groupe d'utilisateurs IAM" }
answer: { optionId: a }
explanation:
  correct:
    en: "An IAM role is an identity with permission policies that is not uniquely associated with one person and is intended to be assumed by anyone who needs it. It has no long-term credentials: assuming the role provides temporary security credentials for the session."
    fr: "Un rôle IAM est une identité dotée de politiques d'autorisation qui n'est pas associée de manière unique à une personne et qui est destinée à être assumée par quiconque en a besoin. Il n'a pas d'informations d'identification à long terme : assumer le rôle fournit des informations d'identification de sécurité temporaires pour la session."
  options:
    b:
      en: "The root user has long-term credentials and complete access to the account; it is not assumed by applications or services."
      fr: "L'utilisateur racine a des informations d'identification à long terme et un accès complet au compte ; il n'est pas assumé par des applications ou des services."
    c:
      en: "An IAM user is associated with one person or application and can have long-term credentials such as a password and access keys."
      fr: "Un utilisateur IAM est associé à une personne ou à une application et peut avoir des informations d'identification à long terme comme un mot de passe et des clés d'accès."
    d:
      en: "A user group is a collection of IAM users; it cannot be assumed and has no credentials of its own."
      fr: "Un groupe d'utilisateurs est un ensemble d'utilisateurs IAM ; il ne peut pas être assumé et n'a pas d'informations d'identification propres."
references:
  - title: "IAM roles"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html
