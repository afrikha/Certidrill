id: clfc02-2c-inline-one-identity
objective: "2.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company needs a policy for one IAM role. The policy must never be attached to any other identity, and it must be deleted automatically when the role is deleted. Which type of policy should the company use?
  fr: |
    Une entreprise a besoin d'une politique pour un rôle IAM. La politique ne doit jamais être attachée à une autre identité et doit être supprimée automatiquement lorsque le rôle est supprimé. Quel type de politique l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A customer managed policy", fr: "Une politique gérée par le client" } }
    - { id: b, text: { en: "An inline policy", fr: "Une politique en ligne" } }
    - { id: c, text: { en: "An AWS managed policy", fr: "Une politique gérée par AWS" } }
    - { id: d, text: { en: "A service control policy (SCP)", fr: "Une politique de contrôle des services (SCP)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "An inline policy has a strict one-to-one relationship with the user, group or role that it is embedded in. It cannot be attached to another identity, and it is deleted when that identity is deleted."
    fr: "Une politique en ligne a une relation stricte un-à-un avec l'utilisateur, le groupe ou le rôle dans lequel elle est intégrée. Elle ne peut pas être attachée à une autre identité et elle est supprimée lorsque cette identité est supprimée."
  options:
    a:
      en: "A customer managed policy is a standalone policy that can be attached to many identities and remains when a role is deleted."
      fr: "Une politique gérée par le client est une politique autonome qui peut être attachée à de nombreuses identités et subsiste quand un rôle est supprimé."
    c:
      en: "AWS managed policies are created by AWS, shared by all customers and attachable to any identity."
      fr: "Les politiques gérées par AWS sont créées par AWS, communes à tous les clients et attachables à n'importe quelle identité."
    d:
      en: "An SCP is attached to accounts or OUs in AWS Organizations, not to one IAM role, and it does not grant permissions."
      fr: "Une SCP est attachée à des comptes ou à des UO dans AWS Organizations, pas à un rôle IAM, et elle n'accorde pas d'autorisations."
references:
  - title: Managed policies and inline policies
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vs-inline.html
