id: clfc02-2c-ak-lost-secret
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer lost the secret access key of an IAM user's access key. The access key ID is still known. What should the developer do?
  fr: |
    Un développeur a perdu la clé d'accès secrète d'une clé d'accès d'un utilisateur IAM. L'ID de clé d'accès est toujours connu. Que doit faire le développeur ?
body:
  options:
    - { id: a, text: { en: "Retrieve the secret access key again from the IAM console.", fr: "Récupérer à nouveau la clé d'accès secrète depuis la console IAM." } }
    - { id: b, text: { en: "Open an AWS Support case to recover the secret access key.", fr: "Ouvrir une demande AWS Support pour récupérer la clé d'accès secrète." } }
    - { id: c, text: { en: "Use the access key ID alone, because it is enough to sign requests.", fr: "Utiliser seulement l'ID de clé d'accès, qui suffit pour signer les requêtes." } }
    - { id: d, text: { en: "Create a new access key and delete the one whose secret was lost.", fr: "Créer une nouvelle clé d'accès et supprimer celle dont le secret a été perdu." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The secret access key can be viewed or downloaded only when the access key is created. If it is lost, the developer must delete that access key and create a new one, then store both parts securely."
    fr: "La clé d'accès secrète ne peut être affichée ou téléchargée qu'à la création de la clé d'accès. Si elle est perdue, le développeur doit supprimer cette clé d'accès, en créer une nouvelle et en conserver les deux parties en lieu sûr."
  options:
    a:
      en: "IAM shows the secret access key only once, at creation; it cannot be retrieved later."
      fr: "IAM n'affiche la clé d'accès secrète qu'une fois, à la création ; elle ne peut pas être récupérée ensuite."
    b:
      en: "AWS Support cannot recover a secret access key; the only option is to replace the access key."
      fr: "AWS Support ne peut pas récupérer une clé d'accès secrète ; la seule solution est de remplacer la clé d'accès."
    c:
      en: "The access key ID and the secret access key must be used together to sign requests."
      fr: "L'ID de clé d'accès et la clé d'accès secrète doivent être utilisés ensemble pour signer les requêtes."
references:
  - title: Manage access keys for IAM users
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
