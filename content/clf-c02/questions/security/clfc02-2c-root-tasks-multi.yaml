id: clfc02-2c-root-tasks-multi
objective: "2.3.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which tasks require the credentials of the AWS account root user? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles tâches exigent les informations d'identification de l'utilisateur racine du compte AWS ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an IAM role for an application on an Amazon EC2 instance", fr: "Créer un rôle IAM pour une application sur une instance Amazon EC2" } }
    - { id: b, text: { en: "Attach a customer managed policy to a user group", fr: "Attacher une politique gérée par le client à un groupe d'utilisateurs" } }
    - { id: c, text: { en: "Restore IAM user permissions that were removed by mistake", fr: "Restaurer des autorisations d'utilisateur IAM supprimées par erreur" } }
    - { id: d, text: { en: "Create an AWS Budgets alert for the monthly costs", fr: "Créer une alerte AWS Budgets pour les coûts mensuels" } }
    - { id: e, text: { en: "Configure an Amazon S3 bucket to enable MFA delete", fr: "Configurer un compartiment Amazon S3 pour activer MFA delete" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Restoring IAM user permissions, for example after the only administrator removed their own access, and configuring an Amazon S3 bucket to enable MFA are both on the list of tasks that require the root user credentials."
    fr: "Restaurer des autorisations d'utilisateur IAM, par exemple après que le seul administrateur a supprimé son propre accès, et configurer un compartiment Amazon S3 pour activer la MFA figurent tous deux dans la liste des tâches qui exigent les informations d'identification racine."
  options:
    a:
      en: "Creating IAM roles needs only IAM permissions."
      fr: "La création de rôles IAM ne nécessite que des autorisations IAM."
    b:
      en: "Attaching policies to groups needs only IAM permissions."
      fr: "Attacher des politiques à des groupes ne nécessite que des autorisations IAM."
    d:
      en: "Budgets alerts can be created by IAM identities with AWS Budgets permissions."
      fr: "Les alertes AWS Budgets peuvent être créées par des identités IAM disposant d'autorisations AWS Budgets."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
