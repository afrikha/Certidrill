id: clfc02-2a-gov-hipaa-baa
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company wants to process protected health information that is subject to HIPAA on AWS. What does AWS provide to support the company's compliance?
  fr: |
    Une entreprise de santé veut traiter sur AWS des informations de santé protégées soumises à HIPAA. Que fournit AWS pour soutenir la conformité de l'entreprise ?
body:
  options:
    - id: a
      text: { en: "A HIPAA certification of the company's workloads, issued by AWS", fr: "Une certification HIPAA des charges de travail de l'entreprise, délivrée par AWS" }
    - id: b
      text: { en: "A Business Associate Addendum (BAA) and guidance such as mapping documents", fr: "Un Business Associate Addendum (BAA) et des conseils comme des documents de correspondance" }
    - id: c
      text: { en: "Automatic HIPAA compliance for all workloads in a US Region", fr: "Une conformité HIPAA automatique pour toutes les charges de travail d'une Région des États-Unis" }
    - id: d
      text: { en: "Physical access to the data centers for the company's auditors", fr: "Un accès physique aux centres de données pour les auditeurs de l'entreprise" }
answer: { optionId: b }
explanation:
  correct:
    en: "To help customers operate within a compliant control environment, AWS provides security features, compliance playbooks, mapping documents, whitepapers, and legal agreements such as a Business Associate Addendum. The customer remains responsible for complying with HIPAA."
    fr: "Pour aider les clients à opérer dans un environnement de contrôle conforme, AWS fournit des fonctionnalités de sécurité, des guides de conformité, des documents de correspondance, des livres blancs et des accords juridiques comme le Business Associate Addendum. Le client reste responsable du respect de HIPAA."
  options:
    a:
      en: "For many laws such as HIPAA, no formal certification is available from a cloud provider."
      fr: "Pour de nombreuses lois comme HIPAA, aucune certification formelle n'est disponible auprès d'un fournisseur de cloud."
    c:
      en: "Compliance is never automatic: the customer must configure and operate its workloads according to the law."
      fr: "La conformité n'est jamais automatique : le client doit configurer et exploiter ses charges de travail conformément à la loi."
    d:
      en: "AWS gives data center access only to approved employees and escorted third parties; customers rely on third-party audit reports."
      fr: "AWS ne donne accès aux centres de données qu'aux employés approuvés et à des tiers accompagnés ; les clients s'appuient sur des rapports d'audit tiers."
references:
  - title: Compliance Programs
    url: https://aws.amazon.com/compliance/programs/
