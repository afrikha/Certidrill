id: clfc02-2b-log-cloudwatch-logs
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs applications on Amazon EC2 instances. The security team wants to send the operating system and application log files of all instances to one AWS service where the team can search them and set how long they are kept.

    Which AWS service should the team use?
  fr: |
    Une entreprise exécute des applications sur des instances Amazon EC2. L'équipe de sécurité veut envoyer les fichiers journaux du système d'exploitation et des applications de toutes les instances vers un seul service AWS dans lequel elle pourra les rechercher et définir leur durée de conservation.

    Quel service AWS l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Amazon CloudWatch Logs", fr: "Amazon CloudWatch Logs" }
    - id: b
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: c
      text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" }
    - id: d
      text: { en: "Amazon Macie", fr: "Amazon Macie" }
answer: { optionId: a }
explanation:
  correct:
    en: "CloudWatch Logs centralizes log files from EC2 instances (through the CloudWatch agent), AWS services and applications. The team can search and analyze them, for example with CloudWatch Logs Insights, and set a retention period for each log group."
    fr: "CloudWatch Logs centralise les fichiers journaux des instances EC2 (grâce à l'agent CloudWatch), des services AWS et des applications. L'équipe peut les rechercher et les analyser, par exemple avec CloudWatch Logs Insights, et définir une période de conservation pour chaque groupe de journaux."
  options:
    b:
      en: "AWS Artifact provides AWS compliance reports and agreements; it does not store customer logs."
      fr: "AWS Artifact fournit les rapports de conformité et les accords d'AWS ; il ne stocke pas les journaux des clients."
    c:
      en: "CloudTrail records API activity in the account; it does not collect operating system or application log files from instances."
      fr: "CloudTrail enregistre l'activité des API du compte ; il ne collecte pas les fichiers journaux du système d'exploitation ou des applications des instances."
    d:
      en: "Macie discovers sensitive data in Amazon S3; it is not a log collection and search service."
      fr: "Macie découvre des données sensibles dans Amazon S3 ; ce n'est pas un service de collecte et de recherche de journaux."
references:
  - title: "What is Amazon CloudWatch Logs?"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/WhatIsCloudWatchLogs.html
