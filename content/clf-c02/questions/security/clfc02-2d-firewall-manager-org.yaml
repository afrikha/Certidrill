id: clfc02-2d-firewall-manager-org
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations with 40 accounts. The security team wants to define AWS WAF rules once and have them applied automatically to resources in every account, including accounts that are added later.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations avec 40 comptes. L'équipe de sécurité veut définir des règles AWS WAF une seule fois et les faire appliquer automatiquement aux ressources de chaque compte, y compris les comptes ajoutés plus tard.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Shield Advanced", fr: "AWS Shield Advanced" }
    - id: b
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
    - id: c
      text: { en: "AWS Firewall Manager", fr: "AWS Firewall Manager" }
    - id: d
      text: { en: "AWS WAF in each account", fr: "AWS WAF dans chaque compte" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Firewall Manager centrally manages protections such as AWS WAF rules, Shield Advanced protections, and VPC security groups across the accounts of an organization. The team sets up a policy once, and Firewall Manager applies it to existing and new accounts and resources."
    fr: "AWS Firewall Manager gère de façon centralisée des protections comme les règles AWS WAF, les protections Shield Advanced et les groupes de sécurité VPC dans les comptes d'une organisation. L'équipe configure une politique une seule fois et Firewall Manager l'applique aux comptes et ressources existants et nouveaux."
  options:
    a:
      en: "Shield Advanced adds DDoS protection; it does not distribute WAF rules across accounts."
      fr: "Shield Advanced ajoute une protection DDoS ; il ne distribue pas de règles WAF dans plusieurs comptes."
    b:
      en: "GuardDuty detects threats; it does not deploy firewall rules."
      fr: "GuardDuty détecte les menaces ; il ne déploie pas de règles de pare-feu."
    d:
      en: "Configuring AWS WAF in each account works, but the team would have to repeat it for every account, including new ones, instead of defining the rules once."
      fr: "Configurer AWS WAF dans chaque compte fonctionne, mais l'équipe devrait le répéter pour chaque compte, y compris les nouveaux, au lieu de définir les règles une seule fois."
references:
  - title: "AWS Firewall Manager"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html
