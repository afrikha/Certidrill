id: clfc02-2c-fed-deprovision
objective: "2.3.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company creates a separate IAM user for each employee in each of its AWS accounts. When employees leave the company, some of their IAM users stay active. Which approach reduces this risk?
  fr: |
    Une entreprise crée un utilisateur IAM distinct pour chaque employé dans chacun de ses comptes AWS. Quand des employés quittent l'entreprise, certains de leurs utilisateurs IAM restent actifs. Quelle approche réduit ce risque ?
body:
  options:
    - { id: a, text: { en: "Set an IAM password policy that makes passwords expire after one year.", fr: "Définir une politique de mot de passe IAM qui fait expirer les mots de passe au bout d'un an." } }
    - { id: b, text: { en: "Create a second IAM user for each employee to use as a backup identity.", fr: "Créer un second utilisateur IAM pour chaque employé, comme identité de secours." } }
    - { id: c, text: { en: "Ask each employee to delete their own IAM users before they leave.", fr: "Demander à chaque employé de supprimer ses propres utilisateurs IAM avant son départ." } }
    - { id: d, text: { en: "Federate AWS access with the corporate identity provider of the employees.", fr: "Fédérer l'accès à AWS avec le fournisseur d'identité d'entreprise des employés." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With federation, employees are managed in one corporate identity provider and access AWS with temporary credentials, without IAM users in each account. Disabling an employee in the identity provider removes that person's access to every AWS account."
    fr: "Avec la fédération, les employés sont gérés dans un seul fournisseur d'identité d'entreprise et accèdent à AWS avec des informations d'identification temporaires, sans utilisateurs IAM dans chaque compte. Désactiver un employé dans le fournisseur d'identité supprime son accès à tous les comptes AWS."
  options:
    a:
      en: "Password expiration leaves access active for up to a year and does not affect access keys."
      fr: "L'expiration des mots de passe laisse l'accès actif jusqu'à un an et n'a pas d'effet sur les clés d'accès."
    b:
      en: "A second IAM user doubles the identities that can stay active after an employee leaves."
      fr: "Un second utilisateur IAM double le nombre d'identités qui peuvent rester actives après un départ."
    c:
      en: "Relying on departing employees is not a control; IAM users would still remain in many accounts."
      fr: "Compter sur les employés qui partent n'est pas un contrôle ; des utilisateurs IAM resteraient dans de nombreux comptes."
references:
  - title: Identity providers and federation into AWS
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
