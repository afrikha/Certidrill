id: clfc02-2c-human-federation
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which authentication method does AWS recommend for human users who need access to AWS accounts?
  fr: |
    Quelle méthode d'authentification AWS recommande-t-il pour les utilisateurs humains qui ont besoin d'accéder à des comptes AWS ?
body:
  options:
    - { id: a, text: { en: "An IAM user with long-term access keys for each person", fr: "Un utilisateur IAM avec des clés d'accès à long terme pour chaque personne" } }
    - { id: b, text: { en: "Federation through an identity provider, with temporary credentials", fr: "La fédération via un fournisseur d'identité, avec des informations d'identification temporaires" } }
    - { id: c, text: { en: "A single shared IAM user whose password the team rotates monthly", fr: "Un seul utilisateur IAM partagé dont l'équipe change le mot de passe chaque mois" } }
    - { id: d, text: { en: "The root user, protected by a strong password and an MFA device", fr: "L'utilisateur racine, protégé par un mot de passe fort et un appareil MFA" } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS recommends that human users federate with an identity provider and access AWS by assuming roles with temporary credentials. For multiple accounts, AWS recommends IAM Identity Center to manage this access centrally."
    fr: "AWS recommande que les utilisateurs humains passent par la fédération avec un fournisseur d'identité et accèdent à AWS en endossant des rôles avec des informations d'identification temporaires. Pour plusieurs comptes, AWS recommande IAM Identity Center pour gérer cet accès de manière centralisée."
  options:
    a:
      en: "Long-term access keys for each person are what AWS recommends avoiding for human users."
      fr: "Des clés d'accès à long terme pour chaque personne sont justement ce qu'AWS recommande d'éviter pour les utilisateurs humains."
    c:
      en: "A shared IAM user uses long-term credentials and makes it impossible to know who did what."
      fr: "Un utilisateur IAM partagé utilise des informations d'identification à long terme et empêche de savoir qui a fait quoi."
    d:
      en: "The root user must be kept for the tasks that require it, not used for everyday access."
      fr: "L'utilisateur racine doit être réservé aux tâches qui l'exigent, et non utilisé pour l'accès courant."
references:
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
