id: clfc02-2b-gov-config-aggregator
objective: "2.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Config rules in 30 accounts across three AWS Regions. The compliance team wants to view the compliance status of the rules for all these accounts and Regions from a single account.

    What should the team set up?
  fr: |
    Une entreprise utilise des règles AWS Config dans 30 comptes répartis sur trois Régions AWS. L'équipe de conformité veut consulter le statut de conformité des règles de tous ces comptes et Régions depuis un seul compte.

    Que doit configurer l'équipe ?
body:
  options:
    - id: a
      text: { en: "An organization trail in AWS CloudTrail", fr: "Un journal de suivi d'organisation dans AWS CloudTrail" }
    - id: b
      text: { en: "AWS Artifact organization agreements", fr: "Des accords d'organisation AWS Artifact" }
    - id: c
      text: { en: "An AWS Config aggregator", fr: "Un agrégateur AWS Config" }
    - id: d
      text: { en: "Amazon CloudWatch cross-account observability", fr: "L'observabilité intercompte d'Amazon CloudWatch" }
answer: { optionId: c }
explanation:
  correct:
    en: "An AWS Config aggregator collects AWS Config configuration and compliance data from multiple accounts and Regions, or from a whole organization, into one aggregator account. The team can then see the compliance of the rules across accounts in one view."
    fr: "Un agrégateur AWS Config rassemble les données de configuration et de conformité AWS Config de plusieurs comptes et Régions, ou de toute une organisation, dans un compte agrégateur. L'équipe peut alors voir la conformité des règles de tous les comptes dans une seule vue."
  options:
    a:
      en: "An organization trail centralizes API activity logs, not the compliance status of AWS Config rules."
      fr: "Un journal de suivi d'organisation centralise les journaux d'activité des API, pas le statut de conformité des règles AWS Config."
    b:
      en: "Organization agreements accept agreements with AWS for all accounts; they do not report on resource compliance."
      fr: "Les accords d'organisation acceptent des accords avec AWS pour tous les comptes ; ils ne rendent pas compte de la conformité des ressources."
    d:
      en: "Cross-account observability shares metrics, logs and traces with a monitoring account; it does not aggregate AWS Config compliance."
      fr: "L'observabilité intercompte partage des métriques, des journaux et des traces avec un compte de surveillance ; elle n'agrège pas la conformité AWS Config."
references:
  - title: "Multi-Account Multi-Region Data Aggregation for AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html
