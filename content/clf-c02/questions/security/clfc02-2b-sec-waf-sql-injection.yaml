id: clfc02-2b-sec-waf-sql-injection
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's public web application runs behind an Application Load Balancer. The application receives SQL injection and cross-site scripting attempts.

    Which AWS service can block these malicious web requests before they reach the application?
  fr: |
    L'application web publique d'une entreprise s'exécute derrière un Application Load Balancer. L'application reçoit des tentatives d'injection SQL et de cross-site scripting.

    Quel service AWS peut bloquer ces requêtes web malveillantes avant qu'elles n'atteignent l'application ?
body:
  options:
    - id: a
      text: { en: "AWS Shield Standard", fr: "AWS Shield Standard" }
    - id: b
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: c
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
    - id: d
      text: { en: "AWS WAF", fr: "AWS WAF" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS WAF is a web application firewall that inspects the HTTP and HTTPS requests sent to protected resources such as an Application Load Balancer, an Amazon CloudFront distribution or an Amazon API Gateway API. Its rules, including managed rule groups, can block common attacks such as SQL injection and cross-site scripting."
    fr: "AWS WAF est un pare-feu d'applications web qui inspecte les requêtes HTTP et HTTPS envoyées aux ressources protégées, comme un Application Load Balancer, une distribution Amazon CloudFront ou une API Amazon API Gateway. Ses règles, dont les groupes de règles gérés, peuvent bloquer des attaques courantes comme l'injection SQL et le cross-site scripting."
  options:
    a:
      en: "Shield Standard protects against common network and transport layer DDoS attacks, not against application-layer attacks such as SQL injection."
      fr: "Shield Standard protège contre les attaques DDoS courantes des couches réseau et transport, pas contre les attaques de la couche application comme l'injection SQL."
    b:
      en: "Inspector finds vulnerabilities in workloads; it does not filter incoming requests."
      fr: "Inspector trouve des vulnérabilités dans les charges de travail ; il ne filtre pas les requêtes entrantes."
    c:
      en: "GuardDuty detects threats and generates findings; it does not block web requests."
      fr: "GuardDuty détecte les menaces et génère des résultats ; il ne bloque pas les requêtes web."
references:
  - title: "What are AWS WAF, AWS Shield Advanced, AWS Shield network security director and AWS Firewall Manager?"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html
