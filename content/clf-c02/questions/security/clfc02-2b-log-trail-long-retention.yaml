id: clfc02-2b-log-trail-long-retention
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An auditor requires a company to keep a record of all API activity in its AWS account for 7 years.

    Which solution will meet this requirement?
  fr: |
    Un auditeur exige qu'une entreprise conserve un enregistrement de toute l'activité des API de son compte AWS pendant 7 ans.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Turn on AWS Config recording for all resource types in the account.", fr: "Activer l'enregistrement AWS Config pour tous les types de ressources du compte." }
    - id: b
      text: { en: "Rely on the CloudTrail event history that every account has by default.", fr: "S'appuyer sur l'historique des événements CloudTrail dont chaque compte dispose par défaut." }
    - id: c
      text: { en: "Create a CloudTrail trail that delivers log files to an Amazon S3 bucket.", fr: "Créer un journal de suivi CloudTrail qui livre les fichiers journaux dans un compartiment Amazon S3." }
    - id: d
      text: { en: "Turn on VPC Flow Logs for every VPC and keep the records in Amazon S3.", fr: "Activer les journaux de flux VPC pour chaque VPC et conserver les enregistrements dans Amazon S3." }
answer: { optionId: c }
explanation:
  correct:
    en: "A trail delivers CloudTrail events as log files to an Amazon S3 bucket, where they are kept for as long as the company needs, for example with an S3 Lifecycle configuration. This is the way to keep a record of API activity beyond the 90 days of the event history."
    fr: "Un journal de suivi livre les événements CloudTrail sous forme de fichiers journaux dans un compartiment Amazon S3, où ils sont conservés aussi longtemps que nécessaire, par exemple avec une configuration de cycle de vie S3. C'est ainsi que l'on conserve un enregistrement de l'activité des API au-delà des 90 jours de l'historique des événements."
  options:
    a:
      en: "AWS Config records resource configuration changes, not every API call made in the account."
      fr: "AWS Config enregistre les modifications de configuration des ressources, pas chaque appel d'API effectué dans le compte."
    b:
      en: "The event history keeps only the last 90 days of management events."
      fr: "L'historique des événements ne conserve que les 90 derniers jours d'événements de gestion."
    d:
      en: "Flow logs record IP traffic in VPCs, not API activity."
      fr: "Les journaux de flux enregistrent le trafic IP des VPC, pas l'activité des API."
references:
  - title: "What Is AWS CloudTrail?"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html
  - title: "Working with CloudTrail event history"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
