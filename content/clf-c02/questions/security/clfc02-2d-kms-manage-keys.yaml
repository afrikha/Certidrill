id: clfc02-2d-kms-manage-keys
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to create and control the encryption keys that protect its data in Amazon S3 and Amazon EBS. The keys must work with the encryption features of these services.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise veut créer et contrôler les clés de chiffrement qui protègent ses données dans Amazon S3 et Amazon EBS. Les clés doivent fonctionner avec les fonctions de chiffrement de ces services.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Certificate Manager (ACM)", fr: "AWS Certificate Manager (ACM)" }
    - id: b
      text: { en: "AWS Secrets Manager", fr: "AWS Secrets Manager" }
    - id: c
      text: { en: "AWS Key Management Service (AWS KMS)", fr: "AWS Key Management Service (AWS KMS)" }
    - id: d
      text: { en: "Amazon Macie", fr: "Amazon Macie" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS KMS is the managed service for creating and controlling the cryptographic keys that protect data. AWS services such as Amazon S3 and Amazon EBS use KMS keys to encrypt data at rest, and the keys are protected by FIPS validated hardware security modules that they never leave unencrypted."
    fr: "AWS KMS est le service géré qui permet de créer et de contrôler les clés de chiffrement qui protègent les données. Des services AWS comme Amazon S3 et Amazon EBS utilisent des clés KMS pour chiffrer les données au repos, et les clés sont protégées par des modules de sécurité matériels validés FIPS qu'elles ne quittent jamais en clair."
  options:
    a:
      en: "ACM provisions SSL/TLS certificates that encrypt data in transit; it does not manage the keys that encrypt S3 objects or EBS volumes."
      fr: "ACM fournit des certificats SSL/TLS qui chiffrent les données en transit ; il ne gère pas les clés qui chiffrent les objets S3 ou les volumes EBS."
    b:
      en: "Secrets Manager stores and rotates secrets such as database credentials and API keys, not the encryption keys used by S3 and EBS."
      fr: "Secrets Manager stocke et fait la rotation de secrets comme des informations d'identification de base de données et des clés d'API, pas des clés de chiffrement utilisées par S3 et EBS."
    d:
      en: "Macie discovers sensitive data in Amazon S3; it does not create or control encryption keys."
      fr: "Macie découvre les données sensibles dans Amazon S3 ; il ne crée ni ne contrôle de clés de chiffrement."
references:
  - title: "AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/overview.html
