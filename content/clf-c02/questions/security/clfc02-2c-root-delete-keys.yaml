id: clfc02-2c-root-delete-keys
objective: "2.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security review finds that the root user of an AWS account has an active access key. No application needs this access key. What should the company do?
  fr: |
    Un audit de sécurité révèle que l'utilisateur racine d'un compte AWS possède une clé d'accès active. Aucune application n'a besoin de cette clé d'accès. Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Delete the access key of the root user.", fr: "Supprimer la clé d'accès de l'utilisateur racine." } }
    - { id: b, text: { en: "Rotate the root access key every 90 days.", fr: "Faire la rotation de la clé d'accès racine tous les 90 jours." } }
    - { id: c, text: { en: "Store the root access key in Parameter Store.", fr: "Stocker la clé d'accès racine dans Parameter Store." } }
    - { id: d, text: { en: "Attach an IAM policy that limits the access key.", fr: "Attacher une politique IAM qui limite la clé d'accès." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS recommends not having root user access keys, because they give programmatic access with full permissions on the account. An unused root access key should simply be deleted; workloads should use IAM roles with temporary credentials instead."
    fr: "AWS recommande de ne pas avoir de clés d'accès pour l'utilisateur racine, car elles donnent un accès programmatique avec toutes les autorisations sur le compte. Une clé d'accès racine inutilisée doit simplement être supprimée ; les charges de travail doivent utiliser des rôles IAM avec des informations d'identification temporaires."
  options:
    b:
      en: "Rotation keeps a root access key in place; the recommended action is to remove it."
      fr: "La rotation conserve une clé d'accès racine ; l'action recommandée est de la supprimer."
    c:
      en: "Storing the key elsewhere does not remove the risk of a full-access long-term credential."
      fr: "Stocker la clé ailleurs ne supprime pas le risque d'une information d'identification à long terme à accès complet."
    d:
      en: "IAM policies cannot be attached to the root user, so they cannot limit root access keys."
      fr: "Les politiques IAM ne peuvent pas être attachées à l'utilisateur racine : elles ne peuvent donc pas limiter ses clés d'accès."
references:
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
