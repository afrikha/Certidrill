id: clfc02-2a-aws-virtualization-layer
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs workloads on Amazon EC2. Which task related to these workloads is AWS's responsibility?
  fr: |
    Une entreprise exécute des charges de travail sur Amazon EC2. Quelle tâche liée à ces charges de travail relève de la responsabilité d'AWS ?
body:
  options:
    - id: a
      text: { en: "Patching the host operating system and the virtualization layer", fr: "Appliquer les correctifs au système d'exploitation hôte et à la couche de virtualisation" }
    - id: b
      text: { en: "Patching the guest operating system of the instances", fr: "Appliquer les correctifs au système d'exploitation invité des instances" }
    - id: c
      text: { en: "Managing the key pairs used to connect to the instances", fr: "Gérer les paires de clés utilisées pour se connecter aux instances" }
    - id: d
      text: { en: "Setting the permissions of the instances' IAM roles", fr: "Définir les autorisations des rôles IAM des instances" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS operates, manages, and controls the components from the host operating system and virtualization layer down to the physical security of the facilities. Patching these layers is AWS's job."
    fr: "AWS exploite, gère et contrôle les composants depuis le système d'exploitation hôte et la couche de virtualisation jusqu'à la sécurité physique des installations. Appliquer les correctifs à ces couches est le travail d'AWS."
  options:
    b:
      en: "The guest operating system, including updates and security patches, is managed by the customer on EC2."
      fr: "Sur EC2, le système d'exploitation invité, y compris les mises à jour et les correctifs de sécurité, est géré par le client."
    c:
      en: "Managing the credentials used to connect to the instances is the customer's responsibility."
      fr: "La gestion des informations d'identification utilisées pour se connecter aux instances est de la responsabilité du client."
    d:
      en: "The customer configures the IAM roles attached to its instances and their permissions."
      fr: "Le client configure les rôles IAM attachés à ses instances et leurs autorisations."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
  - title: Security in Amazon EC2
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security.html
