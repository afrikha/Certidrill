id: clfc02-2b-svc-not-in-scope-service
objective: "2.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must meet a compliance program for one of its workloads. It wants to use an AWS service that is not listed as in scope for that program on the AWS Services in Scope by Compliance Program page.

    Which statement is correct?
  fr: |
    Une entreprise doit respecter un programme de conformité pour l'une de ses charges de travail. Elle veut utiliser un service AWS qui n'est pas indiqué comme couvert par ce programme sur la page AWS Services in Scope by Compliance Program.

    Quelle affirmation est correcte ?
body:
  options:
    - id: a
      text: { en: "The service becomes covered by the program as soon as the company uses it for the workload.", fr: "Le service devient couvert par le programme dès que l'entreprise l'utilise pour la charge de travail." }
    - id: b
      text: { en: "AWS blocks the service in accounts whose workloads are subject to that program.", fr: "AWS bloque le service dans les comptes dont les charges de travail sont soumises à ce programme." }
    - id: c
      text: { en: "The company must ask AWS Support to add the service to the program for its account.", fr: "L'entreprise doit demander à AWS Support d'ajouter le service au programme pour son compte." }
    - id: d
      text: { en: "The company can use the service, but it must determine whether that use affects its compliance.", fr: "L'entreprise peut utiliser le service, mais elle doit déterminer si cette utilisation affecte sa conformité." }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS lists the services that are in scope of each compliance program, and a service that is not listed can still be used. Customers remain responsible for determining what data they process with the service and whether using it affects their compliance."
    fr: "AWS indique les services couverts par chaque programme de conformité, et un service non répertorié peut tout de même être utilisé. Les clients restent responsables de déterminer quelles données ils traitent avec le service et si son utilisation affecte leur conformité."
  options:
    a:
      en: "A service is in scope only when it has been assessed and appears in the current reports; customer use does not change that."
      fr: "Un service n'est couvert que lorsqu'il a été évalué et figure dans les rapports actuels ; l'utilisation par un client n'y change rien."
    b:
      en: "AWS does not block services based on compliance programs; the page itself says that a service not listed can still be used."
      fr: "AWS ne bloque pas de services en fonction des programmes de conformité ; la page indique elle-même qu'un service non répertorié peut être utilisé."
    c:
      en: "The scope of an AWS program is set by AWS's assessments, not added per account on request."
      fr: "Le périmètre d'un programme AWS est fixé par les évaluations d'AWS, pas ajouté par compte sur demande."
references:
  - title: "AWS Services in Scope by Compliance Program"
    url: https://aws.amazon.com/compliance/services-in-scope/
