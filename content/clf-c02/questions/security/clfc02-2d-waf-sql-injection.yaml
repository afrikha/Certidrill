id: clfc02-2d-waf-sql-injection
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application behind an Application Load Balancer. The company wants to block common web exploits, such as SQL injection and cross-site scripting (XSS).

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise exécute une application web derrière un Application Load Balancer. Elle veut bloquer les attaques web courantes, comme l'injection SQL et le cross-site scripting (XSS).

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "AWS Shield Standard", fr: "AWS Shield Standard" }
    - id: b
      text: { en: "AWS WAF", fr: "AWS WAF" }
    - id: c
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
    - id: d
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS WAF is a web application firewall that inspects the HTTP(S) requests sent to protected resources such as an Application Load Balancer. Its managed rule groups include the SQL database rule group, which blocks SQL injection patterns, and the core rule set, which includes cross-site scripting rules."
    fr: "AWS WAF est un pare-feu d'applications web qui inspecte les requêtes HTTP(S) envoyées aux ressources protégées, comme un Application Load Balancer. Ses groupes de règles gérés comprennent le groupe de règles SQL database, qui bloque les modèles d'injection SQL, et le core rule set, qui contient des règles contre le cross-site scripting."
  options:
    a:
      en: "Shield Standard protects against common network and transport layer DDoS attacks; it does not inspect requests for SQL injection or XSS."
      fr: "Shield Standard protège contre les attaques DDoS courantes sur les couches réseau et transport ; il n'inspecte pas les requêtes pour y chercher de l'injection SQL ou du XSS."
    c:
      en: "GuardDuty detects threats by analyzing logs; it does not block web requests."
      fr: "GuardDuty détecte les menaces en analysant des journaux ; il ne bloque pas les requêtes web."
    d:
      en: "Amazon Inspector scans workloads for software vulnerabilities; it does not filter incoming requests."
      fr: "Amazon Inspector analyse les charges de travail pour y trouver des vulnérabilités logicielles ; il ne filtre pas les requêtes entrantes."
references:
  - title: "AWS WAF"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html
  - title: "Use-case specific rule groups"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/aws-managed-rule-groups-use-case.html
