id: clfc02-2c-root-task-close
objective: "2.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has a standalone AWS account that is not part of an organization in AWS Organizations. Which task requires the root user credentials of this account?
  fr: |
    Une entreprise dispose d'un compte AWS autonome qui ne fait pas partie d'une organisation AWS Organizations. Quelle tâche exige les informations d'identification de l'utilisateur racine de ce compte ?
body:
  options:
    - { id: a, text: { en: "Closing the AWS account", fr: "Fermer le compte AWS" } }
    - { id: b, text: { en: "Creating an IAM user", fr: "Créer un utilisateur IAM" } }
    - { id: c, text: { en: "Updating the alternate contacts", fr: "Mettre à jour les contacts alternatifs" } }
    - { id: d, text: { en: "Creating an Amazon S3 bucket", fr: "Créer un compartiment Amazon S3" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Closing a standalone AWS account requires the root user credentials. In AWS Organizations, the management account or a delegated administrator can close member accounts without them, but this account is not in an organization."
    fr: "La fermeture d'un compte AWS autonome exige les informations d'identification de l'utilisateur racine. Dans AWS Organizations, le compte de gestion ou un administrateur délégué peut fermer des comptes membres sans elles, mais ce compte ne fait pas partie d'une organisation."
  options:
    b:
      en: "An IAM identity with IAM permissions can create IAM users; root is not needed."
      fr: "Une identité IAM disposant d'autorisations IAM peut créer des utilisateurs IAM ; la racine n'est pas nécessaire."
    c:
      en: "Alternate contacts are account settings that do not require root user credentials."
      fr: "Les contacts alternatifs sont des paramètres de compte qui n'exigent pas les informations d'identification racine."
    d:
      en: "Any identity with the right Amazon S3 permissions can create a bucket."
      fr: "Toute identité disposant des bonnes autorisations Amazon S3 peut créer un compartiment."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
