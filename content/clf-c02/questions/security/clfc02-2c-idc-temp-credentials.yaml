id: clfc02-2c-idc-temp-credentials
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An employee signs in to the AWS access portal of AWS IAM Identity Center and opens an assigned AWS account. Which type of credentials does the employee use in that account?
  fr: |
    Un employé se connecte au portail d'accès AWS d'AWS IAM Identity Center et ouvre un compte AWS qui lui est attribué. Quel type d'informations d'identification l'employé utilise-t-il dans ce compte ?
body:
  options:
    - { id: a, text: { en: "Short-term credentials of a role managed by IAM Identity Center", fr: "Des informations d'identification de courte durée d'un rôle IAM géré par IAM Identity Center" } }
    - { id: b, text: { en: "Long-term access keys of an IAM user created in that account", fr: "Des clés d'accès à long terme d'un utilisateur IAM créé dans ce compte" } }
    - { id: c, text: { en: "The root user credentials of the account, protected by an MFA device", fr: "Les informations d'identification racine du compte, protégées par un appareil MFA" } }
    - { id: d, text: { en: "A password for that account that never expires or rotates", fr: "Un mot de passe propre à ce compte qui n'expire jamais et n'est jamais renouvelé" } }
answer: { optionId: a }
explanation:
  correct:
    en: "When a permission set is assigned, IAM Identity Center creates an IAM role in the account, and authorized users assume that role. Users therefore work with short-term credentials instead of long-term IAM user credentials."
    fr: "Lorsqu'un ensemble d'autorisations est attribué, IAM Identity Center crée un rôle IAM dans le compte, et les utilisateurs autorisés endossent ce rôle. Les utilisateurs travaillent donc avec des informations d'identification de courte durée plutôt qu'avec des identifiants à long terme d'utilisateur IAM."
  options:
    b:
      en: "IAM Identity Center does not create IAM users or access keys in the accounts; it provisions IAM roles."
      fr: "IAM Identity Center ne crée ni utilisateurs IAM ni clés d'accès dans les comptes ; il provisionne des rôles IAM."
    c:
      en: "IAM Identity Center never uses the root user; the root user is kept for root-only tasks."
      fr: "IAM Identity Center n'utilise jamais l'utilisateur racine ; celui-ci est réservé aux tâches qui l'exigent."
    d:
      en: "Users sign in once with their identity source credentials; they do not get a separate password for each account."
      fr: "Les utilisateurs se connectent une fois avec les identifiants de leur source d'identité ; ils n'ont pas de mot de passe distinct par compte."
references:
  - title: Manage AWS accounts with permission sets
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html
  - title: Identity providers and federation into AWS
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html
