id: clfc02-2c-root-task-deny-all
objective: "2.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer applied an Amazon S3 bucket policy that denies all principals every action on the bucket. Administrators can no longer change the policy. Which identity can edit or delete this bucket policy?
  fr: |
    Un ingénieur a appliqué une politique de compartiment Amazon S3 qui refuse toutes les actions sur le compartiment à tous les principaux. Les administrateurs ne peuvent plus modifier la politique. Quelle identité peut modifier ou supprimer cette politique de compartiment ?
body:
  options:
    - { id: a, text: { en: "An IAM user that has the AdministratorAccess policy", fr: "Un utilisateur IAM doté de la politique AdministratorAccess" } }
    - { id: b, text: { en: "An IAM role that has the AmazonS3FullAccess policy", fr: "Un rôle IAM doté de la politique AmazonS3FullAccess" } }
    - { id: c, text: { en: "An AWS Support engineer, after a case is opened", fr: "Un ingénieur AWS Support, après l'ouverture d'une demande" } }
    - { id: d, text: { en: "The root user of the account that owns the bucket", fr: "L'utilisateur racine du compte propriétaire du compartiment" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Editing or deleting an Amazon S3 bucket policy that denies all principals is a task that requires the root user credentials of the account. In AWS Organizations, it can also be run as a privileged root task from the management account."
    fr: "Modifier ou supprimer une politique de compartiment Amazon S3 qui refuse tous les principaux est une tâche qui exige les informations d'identification de l'utilisateur racine du compte. Dans AWS Organizations, elle peut aussi être exécutée comme tâche racine privilégiée depuis le compte de gestion."
  options:
    a:
      en: "The policy denies all principals, including IAM users with AdministratorAccess."
      fr: "La politique refuse tous les principaux, y compris les utilisateurs IAM dotés d'AdministratorAccess."
    b:
      en: "An explicit deny for all principals also applies to IAM roles, whatever their Amazon S3 permissions."
      fr: "Un refus explicite pour tous les principaux s'applique aussi aux rôles IAM, quelles que soient leurs autorisations Amazon S3."
    c:
      en: "AWS Support does not change resource policies in customer accounts; the customer's root user must do it."
      fr: "AWS Support ne modifie pas les politiques de ressources dans les comptes des clients ; c'est à l'utilisateur racine du client de le faire."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
