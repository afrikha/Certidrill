id: clfc02-2c-fed-identity-pools
objective: "2.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A web app uses an Amazon Cognito user pool for sign-up and sign-in. Signed-in users now need temporary AWS credentials to read their own files in Amazon S3. Which feature provides these credentials?
  fr: |
    Une application web utilise un groupe d'utilisateurs (user pool) Amazon Cognito pour l'inscription et la connexion. Les utilisateurs connectés ont maintenant besoin d'informations d'identification AWS temporaires pour lire leurs propres fichiers dans Amazon S3. Quelle fonctionnalité fournit ces informations d'identification ?
body:
  options:
    - { id: a, text: { en: "Amazon Cognito user pools", fr: "Les groupes d'utilisateurs (user pools) Amazon Cognito" } }
    - { id: b, text: { en: "Amazon Cognito identity pools", fr: "Les groupes d'identités (identity pools) Amazon Cognito" } }
    - { id: c, text: { en: "IAM Identity Center permission sets", fr: "Les ensembles d'autorisations IAM Identity Center" } }
    - { id: d, text: { en: "IAM user groups", fr: "Les groupes d'utilisateurs IAM" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Cognito user pools handle sign-up and sign-in, and Cognito identity pools grant those users temporary IAM credentials to access protected AWS resources. Identity pools obtain the credentials through the AssumeRoleWithWebIdentity operation."
    fr: "Les groupes d'utilisateurs Cognito gèrent l'inscription et la connexion, et les groupes d'identités Cognito accordent à ces utilisateurs des informations d'identification IAM temporaires pour accéder aux ressources AWS protégées. Les groupes d'identités obtiennent ces informations via l'opération AssumeRoleWithWebIdentity."
  options:
    a:
      en: "User pools authenticate the app users; issuing temporary AWS credentials is the role of identity pools."
      fr: "Les groupes d'utilisateurs authentifient les utilisateurs de l'application ; la délivrance d'informations d'identification AWS temporaires est le rôle des groupes d'identités."
    c:
      en: "Permission sets give workforce users access to AWS accounts, not app customers access to their files."
      fr: "Les ensembles d'autorisations donnent au personnel l'accès aux comptes AWS, pas aux clients d'une application l'accès à leurs fichiers."
    d:
      en: "IAM user groups contain IAM users; the app users are not IAM users."
      fr: "Les groupes d'utilisateurs IAM contiennent des utilisateurs IAM ; les utilisateurs de l'application ne sont pas des utilisateurs IAM."
references:
  - title: Identity providers and federation into AWS
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html
