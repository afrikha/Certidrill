id: clfc02-2a-shift-ec2-to-rds
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a MySQL database on an Amazon EC2 instance. The company plans to migrate the database to Amazon RDS for MySQL. Which responsibility will shift from the company to AWS?
  fr: |
    Une entreprise exécute une base de données MySQL sur une instance Amazon EC2. L'entreprise prévoit de migrer la base de données vers Amazon RDS for MySQL. Quelle responsabilité passera de l'entreprise à AWS ?
body:
  options:
    - id: a
      text: { en: "Controlling which database users can log in", fr: "Contrôler quels utilisateurs de base de données peuvent se connecter" }
    - id: b
      text: { en: "Configuring the security groups that allow access", fr: "Configurer les groupes de sécurité qui autorisent l'accès" }
    - id: c
      text: { en: "Patching the operating system of the database host", fr: "Appliquer les correctifs au système d'exploitation de l'hôte de base de données" }
    - id: d
      text: { en: "Defining who can modify or delete the database", fr: "Définir qui peut modifier ou supprimer la base de données" }
answer: { optionId: c }
explanation:
  correct:
    en: "On EC2, the customer manages the guest operating system, including security patches. With Amazon RDS, AWS provides and applies the operating system updates of the DB instance, and the customer only chooses the maintenance window."
    fr: "Sur EC2, le client gère le système d'exploitation invité, y compris les correctifs de sécurité. Avec Amazon RDS, AWS fournit et applique les mises à jour du système d'exploitation de l'instance de base de données, et le client choisit seulement la fenêtre de maintenance."
  options:
    a:
      en: "With RDS, the customer still uses the security features of the DB engine to control who can log in."
      fr: "Avec RDS, le client utilise toujours les fonctionnalités de sécurité du moteur de base de données pour contrôler qui peut se connecter."
    b:
      en: "The customer still uses security groups to control which IP addresses or instances can connect to the DB instance."
      fr: "Le client utilise toujours des groupes de sécurité pour contrôler quelles adresses IP ou instances peuvent se connecter à l'instance de base de données."
    d:
      en: "The customer still uses IAM policies to decide who can create, modify, or delete DB instances."
      fr: "Le client utilise toujours des politiques IAM pour décider qui peut créer, modifier ou supprimer des instances de base de données."
references:
  - title: Security in Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.html
  - title: Maintaining a DB instance
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Maintenance.html
