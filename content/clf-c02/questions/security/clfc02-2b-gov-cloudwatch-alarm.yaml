id: clfc02-2b-gov-cloudwatch-alarm
objective: "2.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to receive a notification when the CPU utilization of an Amazon EC2 instance stays above 80% for 10 minutes.

    Which AWS service should the company use?
  fr: |
    Une entreprise veut recevoir une notification lorsque l'utilisation du processeur d'une instance Amazon EC2 reste au-dessus de 80 % pendant 10 minutes.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: b
      text: { en: "Amazon CloudWatch", fr: "Amazon CloudWatch" }
    - id: c
      text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" }
    - id: d
      text: { en: "AWS Config", fr: "AWS Config" }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudWatch collects metrics such as EC2 CPUUtilization. A CloudWatch alarm watches a metric over a number of periods and can send a notification, for example through Amazon SNS, when the metric crosses a threshold."
    fr: "CloudWatch collecte des métriques comme CPUUtilization pour EC2. Une alarme CloudWatch surveille une métrique sur un certain nombre de périodes et peut envoyer une notification, par exemple par Amazon SNS, lorsque la métrique franchit un seuil."
  options:
    a:
      en: "Inspector scans for vulnerabilities; it does not watch metrics or send threshold alarms."
      fr: "Inspector recherche des vulnérabilités ; il ne surveille pas de métriques et n'envoie pas d'alarmes de seuil."
    c:
      en: "CloudTrail records API calls; it does not monitor performance metrics."
      fr: "CloudTrail enregistre les appels d'API ; il ne surveille pas les métriques de performances."
    d:
      en: "AWS Config tracks configuration changes, not CPU utilization."
      fr: "AWS Config suit les modifications de configuration, pas l'utilisation du processeur."
references:
  - title: "Using Amazon CloudWatch alarms"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html
