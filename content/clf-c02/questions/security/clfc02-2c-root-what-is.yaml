id: clfc02-2c-root-what-is
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup has just created its first AWS account with a company email address and a password. Which statement describes the identity that signs in with these credentials?
  fr: |
    Une start-up vient de créer son premier compte AWS avec une adresse e-mail de l'entreprise et un mot de passe. Quelle affirmation décrit l'identité qui se connecte avec ces informations d'identification ?
body:
  options:
    - { id: a, text: { en: "An IAM user with read-only permissions that an administrator must extend before use.", fr: "Un utilisateur IAM avec des autorisations en lecture seule qu'un administrateur doit étendre avant usage." } }
    - { id: b, text: { en: "The root user, which has complete access to all AWS services and resources in the account.", fr: "L'utilisateur racine, qui a un accès complet à tous les services et ressources AWS du compte." } }
    - { id: c, text: { en: "An IAM role that AWS Support assumes to troubleshoot the resources in the account.", fr: "Un rôle IAM qu'AWS Support endosse pour dépanner les ressources du compte." } }
    - { id: d, text: { en: "A temporary IAM Identity Center user that expires 30 days after the account is created.", fr: "Un utilisateur IAM Identity Center temporaire qui expire 30 jours après la création du compte." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The email address and password used to create an AWS account sign in as the AWS account root user. This identity has complete access to all AWS services and resources in the account, including billing, which is why AWS recommends protecting it and not using it for everyday tasks."
    fr: "L'adresse e-mail et le mot de passe utilisés pour créer un compte AWS permettent de se connecter en tant qu'utilisateur racine du compte AWS. Cette identité a un accès complet à tous les services et ressources AWS du compte, y compris la facturation : c'est pourquoi AWS recommande de la protéger et de ne pas l'utiliser pour les tâches quotidiennes."
  options:
    a:
      en: "AWS does not create an IAM user when an account is created; the sign-up credentials belong to the root user, which has full access."
      fr: "AWS ne crée pas d'utilisateur IAM à la création d'un compte ; les informations d'identification d'inscription appartiennent à l'utilisateur racine, qui a un accès complet."
    c:
      en: "The sign-up credentials are not a role for AWS Support; they are the credentials of the account's root user."
      fr: "Les informations d'identification d'inscription ne correspondent pas à un rôle pour AWS Support ; ce sont celles de l'utilisateur racine du compte."
    d:
      en: "IAM Identity Center users are created by the customer, and the root user does not expire after a set period."
      fr: "Les utilisateurs IAM Identity Center sont créés par le client, et l'utilisateur racine n'expire pas au bout d'une durée donnée."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
