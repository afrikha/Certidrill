id: clfc02-2a-srm-definition
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the AWS shared responsibility model?
  fr: |
    Quelle affirmation décrit le modèle de responsabilité partagée AWS ?
body:
  options:
    - id: a
      text: { en: "AWS is responsible for all security of the workloads that customers run in the AWS Cloud.", fr: "AWS est responsable de toute la sécurité des charges de travail que les clients exécutent dans le Cloud AWS." }
    - id: b
      text: { en: "AWS is responsible for security of the cloud, and the customer is responsible for security in the cloud.", fr: "AWS est responsable de la sécurité du cloud, et le client est responsable de la sécurité dans le cloud." }
    - id: c
      text: { en: "The customer is responsible for the physical security of the AWS Regions that it uses.", fr: "Le client est responsable de la sécurité physique des Régions AWS qu'il utilise." }
    - id: d
      text: { en: "AWS and the customer share each security task equally, whatever services are used.", fr: "AWS et le client se partagent à parts égales chaque tâche de sécurité, quels que soient les services utilisés." }
answer: { optionId: b }
explanation:
  correct:
    en: "Security and compliance are shared between AWS and the customer. AWS protects the infrastructure that runs AWS Cloud services (security of the cloud), and the customer secures what it builds and configures on that infrastructure (security in the cloud)."
    fr: "La sécurité et la conformité sont partagées entre AWS et le client. AWS protège l'infrastructure qui exécute les services du Cloud AWS (sécurité du cloud), et le client sécurise ce qu'il construit et configure sur cette infrastructure (sécurité dans le cloud)."
  options:
    a:
      en: "Customers keep responsibility for their data, access permissions and configurations; AWS does not secure the whole workload."
      fr: "Les clients restent responsables de leurs données, de leurs autorisations d'accès et de leurs configurations ; AWS ne sécurise pas toute la charge de travail."
    c:
      en: "Physical security of Regions, Availability Zones and data centers is part of security of the cloud, which AWS handles."
      fr: "La sécurité physique des Régions, des zones de disponibilité et des centres de données fait partie de la sécurité du cloud, assurée par AWS."
    d:
      en: "Responsibilities are not split equally: they depend on the services the customer chooses, and many tasks belong to only one party."
      fr: "Les responsabilités ne sont pas partagées à parts égales : elles dépendent des services choisis par le client, et de nombreuses tâches relèvent d'une seule partie."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
