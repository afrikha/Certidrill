id: clfc02-2b-sec-macie-pii
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores millions of documents in Amazon S3. To meet a privacy requirement, it must find which objects contain personally identifiable information (PII), such as passport numbers.

    Which AWS service should the company use?
  fr: |
    Une entreprise stocke des millions de documents dans Amazon S3. Pour respecter une exigence de confidentialité, elle doit trouver quels objets contiennent des informations d'identification personnelle (PII), comme des numéros de passeport.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
    - id: b
      text: { en: "Amazon Macie", fr: "Amazon Macie" }
    - id: c
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: d
      text: { en: "Amazon Detective", fr: "Amazon Detective" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Macie uses machine learning and pattern matching to discover sensitive data, such as PII, in Amazon S3. It also evaluates and monitors the S3 buckets for security and access control and creates findings when it detects an issue."
    fr: "Amazon Macie utilise l'apprentissage automatique et la correspondance de modèles pour découvrir des données sensibles, comme les PII, dans Amazon S3. Il évalue et surveille aussi la sécurité et le contrôle d'accès des compartiments S3, et crée des résultats lorsqu'il détecte un problème."
  options:
    a:
      en: "GuardDuty can detect suspicious access to S3, but it does not classify the content of objects."
      fr: "GuardDuty peut détecter des accès suspects à S3, mais il ne classe pas le contenu des objets."
    c:
      en: "Inspector scans EC2 instances, container images and Lambda functions for vulnerabilities, not S3 objects for PII."
      fr: "Inspector analyse les instances EC2, les images de conteneur et les fonctions Lambda à la recherche de vulnérabilités, pas les objets S3 à la recherche de PII."
    d:
      en: "Detective helps investigate security findings; it does not scan data for PII."
      fr: "Detective aide à enquêter sur les résultats de sécurité ; il n'analyse pas les données à la recherche de PII."
references:
  - title: "What is Amazon Macie?"
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
