id: clfc02-2a-gov-scp-management-account
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company attaches an SCP that denies a specific AWS service to the root of its organization in AWS Organizations. Users in the member accounts can no longer use the service, but users in the management account still can. Why?
  fr: |
    Une entreprise attache à la racine de son organisation AWS Organizations une SCP qui refuse un service AWS précis. Les utilisateurs des comptes membres ne peuvent plus utiliser le service, mais les utilisateurs du compte de gestion le peuvent toujours. Pourquoi ?
body:
  options:
    - id: a
      text: { en: "The organization has only the consolidated billing features enabled.", fr: "Seules les fonctionnalités de facturation consolidée sont activées dans l'organisation." }
    - id: b
      text: { en: "SCPs restrict only the root user of each account, not IAM users.", fr: "Les SCP restreignent seulement l'utilisateur racine de chaque compte, pas les utilisateurs IAM." }
    - id: c
      text: { en: "SCPs do not affect the users or roles in the management account.", fr: "Les SCP n'affectent pas les utilisateurs ni les rôles du compte de gestion." }
    - id: d
      text: { en: "An IAM allow in the management account overrides the SCP deny.", fr: "Une autorisation IAM dans le compte de gestion l'emporte sur le refus de la SCP." }
answer: { optionId: c }
explanation:
  correct:
    en: "SCPs affect only the member accounts of the organization; they do not affect users or roles in the management account."
    fr: "Les SCP n'affectent que les comptes membres de l'organisation ; elles n'affectent pas les utilisateurs ni les rôles du compte de gestion."
  options:
    a:
      en: "SCPs are not available with consolidated billing only; the company could not have attached the SCP, and member accounts would not be restricted."
      fr: "Les SCP ne sont pas disponibles avec la seule facturation consolidée ; l'entreprise n'aurait pas pu attacher la SCP, et les comptes membres ne seraient pas restreints."
    b:
      en: "SCPs affect all users and roles in member accounts, including the root user."
      fr: "Les SCP affectent tous les utilisateurs et rôles des comptes membres, y compris l'utilisateur racine."
    d:
      en: "An allow in an IAM policy cannot override an SCP deny where SCPs apply; effective permissions are the intersection of both."
      fr: "Une autorisation dans une politique IAM ne peut pas l'emporter sur un refus de SCP là où les SCP s'appliquent ; les autorisations effectives sont l'intersection des deux."
references:
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
