id: clfc02-2c-root-daily-admin
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The administrator of a company's AWS account signs in as the root user every day to create resources and manage users. The company wants to follow AWS best practices. What should the administrator do?
  fr: |
    L'administrateur du compte AWS d'une entreprise se connecte chaque jour en tant qu'utilisateur racine pour créer des ressources et gérer les utilisateurs. L'entreprise veut suivre les bonnes pratiques AWS. Que doit faire l'administrateur ?
body:
  options:
    - { id: a, text: { en: "Create access keys for the root user and use them from the AWS CLI for all daily work.", fr: "Créer des clés d'accès pour l'utilisateur racine et les utiliser depuis l'AWS CLI pour tout le travail quotidien." } }
    - { id: b, text: { en: "Keep using the root user every day, but change its password every week to reduce risk.", fr: "Continuer à utiliser l'utilisateur racine chaque jour, mais changer son mot de passe chaque semaine pour réduire le risque." } }
    - { id: c, text: { en: "Do daily work as an IAM Identity Center admin user and keep root for root-only tasks.", fr: "Travailler au quotidien avec un utilisateur administrateur IAM Identity Center et réserver la racine à ses tâches propres." } }
    - { id: d, text: { en: "Share the root user password with a second administrator so that the daily work is split.", fr: "Partager le mot de passe de l'utilisateur racine avec un second administrateur pour répartir le travail quotidien." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS recommends not using the root user for everyday tasks. The administrator should do daily work with an administrative user, for example in IAM Identity Center, and sign in as the root user only for the tasks that require root user credentials."
    fr: "AWS recommande de ne pas utiliser l'utilisateur racine pour les tâches quotidiennes. L'administrateur doit effectuer le travail courant avec un utilisateur administratif, par exemple dans IAM Identity Center, et se connecter en tant qu'utilisateur racine uniquement pour les tâches qui exigent ses informations d'identification."
  options:
    a:
      en: "Root user access keys give programmatic access with full permissions; AWS recommends not creating them at all."
      fr: "Les clés d'accès de l'utilisateur racine donnent un accès programmatique avec toutes les autorisations ; AWS recommande de ne pas en créer."
    b:
      en: "Changing the password does not remove the risk of using an identity with unrestricted access for routine work."
      fr: "Changer le mot de passe ne supprime pas le risque d'utiliser une identité à l'accès illimité pour le travail courant."
    d:
      en: "AWS recommends not sharing root user credentials except with people who have a strict business need, and sharing does not stop daily root use."
      fr: "AWS recommande de ne partager les informations d'identification racine qu'avec des personnes qui en ont strictement besoin, et le partage ne met pas fin à l'usage quotidien de la racine."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
