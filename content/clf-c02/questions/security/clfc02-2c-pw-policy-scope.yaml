id: clfc02-2c-pw-policy-scope
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company sets an IAM account password policy that makes passwords expire after 90 days. Which statement about this policy is true?
  fr: |
    Une entreprise définit une politique de mot de passe de compte IAM qui fait expirer les mots de passe au bout de 90 jours. Quelle affirmation sur cette politique est vraie ?
body:
  options:
    - { id: a, text: { en: "It also rotates the access keys of IAM users every 90 days.", fr: "Elle fait aussi la rotation des clés d'accès des utilisateurs IAM tous les 90 jours." } }
    - { id: b, text: { en: "It does not apply to the root user password or to access keys.", fr: "Elle ne s'applique ni au mot de passe racine ni aux clés d'accès." } }
    - { id: c, text: { en: "An IAM user whose password expires can no longer use access keys.", fr: "Un utilisateur IAM dont le mot de passe expire ne peut plus utiliser ses clés d'accès." } }
    - { id: d, text: { en: "It also makes the root user password expire after 90 days.", fr: "Elle fait aussi expirer le mot de passe racine au bout de 90 jours." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The IAM account password policy applies to the console passwords of IAM users only. It does not apply to the root user password or to IAM user access keys: a user whose password expires cannot sign in to the console but can still use active access keys."
    fr: "La politique de mot de passe de compte IAM s'applique uniquement aux mots de passe de console des utilisateurs IAM. Elle ne s'applique ni au mot de passe de l'utilisateur racine ni aux clés d'accès des utilisateurs IAM : un utilisateur dont le mot de passe expire ne peut plus se connecter à la console mais peut encore utiliser ses clés d'accès actives."
  options:
    a:
      en: "The password policy has no effect on access keys, which must be rotated separately."
      fr: "La politique de mot de passe n'a aucun effet sur les clés d'accès, dont la rotation se fait séparément."
    c:
      en: "Password expiration blocks console sign-in only; the user's access keys keep working."
      fr: "L'expiration du mot de passe ne bloque que la connexion à la console ; les clés d'accès de l'utilisateur continuent de fonctionner."
    d:
      en: "The root user password is outside the scope of the IAM account password policy."
      fr: "Le mot de passe de l'utilisateur racine est hors du périmètre de la politique de mot de passe de compte IAM."
references:
  - title: Set an account password policy for IAM users
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_account-policy.html
