id: clfc02-2d-guardduty-threat-detection
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants a managed service that continuously monitors its AWS accounts for malicious activity, such as Amazon EC2 instances that communicate with known malicious IP addresses. The company does not want to deploy agents for this.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise veut un service géré qui surveille en continu ses comptes AWS pour détecter des activités malveillantes, comme des instances Amazon EC2 qui communiquent avec des adresses IP malveillantes connues. Elle ne veut pas déployer d'agents pour cela.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: b
      text: { en: "Amazon Macie", fr: "Amazon Macie" }
    - id: c
      text: { en: "AWS Firewall Manager", fr: "AWS Firewall Manager" }
    - id: d
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon GuardDuty is a threat detection service that uses threat intelligence, such as lists of malicious IP addresses and domains, and machine learning to find suspicious activity. Once enabled, it analyzes foundational data sources (CloudTrail management events, VPC flow logs, and DNS logs) without any other setup."
    fr: "Amazon GuardDuty est un service de détection des menaces qui utilise des renseignements sur les menaces, comme des listes d'adresses IP et de domaines malveillants, et l'apprentissage automatique pour trouver des activités suspectes. Une fois activé, il analyse les sources de données de base (événements de gestion CloudTrail, journaux de flux VPC et journaux DNS) sans autre configuration."
  options:
    a:
      en: "Amazon Inspector looks for software vulnerabilities and unintended network exposure, not for active malicious communication."
      fr: "Amazon Inspector cherche les vulnérabilités logicielles et l'exposition réseau involontaire, pas les communications malveillantes en cours."
    b:
      en: "Macie discovers sensitive data in Amazon S3; it does not monitor EC2 network activity."
      fr: "Macie découvre les données sensibles dans Amazon S3 ; il ne surveille pas l'activité réseau d'EC2."
    c:
      en: "Firewall Manager centrally manages firewall rules across accounts; it does not detect threats."
      fr: "Firewall Manager gère de façon centralisée les règles de pare-feu de plusieurs comptes ; il ne détecte pas les menaces."
references:
  - title: "What is Amazon GuardDuty?"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html
