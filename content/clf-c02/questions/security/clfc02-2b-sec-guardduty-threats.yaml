id: clfc02-2b-sec-guardduty-threats
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants a managed service that continuously analyzes AWS CloudTrail events, VPC Flow Logs and DNS logs to detect threats such as compromised credentials or communication with known malicious IP addresses.

    Which AWS service should the company use?
  fr: |
    Une entreprise veut un service géré qui analyse en continu les événements AWS CloudTrail, les journaux de flux VPC et les journaux DNS pour détecter des menaces comme des informations d'identification compromises ou des communications avec des adresses IP malveillantes connues.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: b
      text: { en: "Amazon Macie", fr: "Amazon Macie" }
    - id: c
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
    - id: d
      text: { en: "AWS WAF", fr: "AWS WAF" }
answer: { optionId: c }
explanation:
  correct:
    en: "GuardDuty is a threat detection service that analyzes foundational data sources, including CloudTrail management events, VPC Flow Logs and DNS logs, with threat intelligence and machine learning. It generates findings for suspicious activity such as compromised credentials or calls to malicious IP addresses."
    fr: "GuardDuty est un service de détection des menaces qui analyse des sources de données fondamentales, dont les événements de gestion CloudTrail, les journaux de flux VPC et les journaux DNS, à l'aide de renseignements sur les menaces et de l'apprentissage automatique. Il génère des résultats pour les activités suspectes comme des informations d'identification compromises ou des appels vers des adresses IP malveillantes."
  options:
    a:
      en: "Inspector scans workloads for vulnerabilities; it does not analyze logs to detect active threats."
      fr: "Inspector analyse les charges de travail à la recherche de vulnérabilités ; il n'analyse pas les journaux pour détecter des menaces actives."
    b:
      en: "Macie finds sensitive data in Amazon S3; it does not analyze CloudTrail, flow logs and DNS logs for threats."
      fr: "Macie trouve des données sensibles dans Amazon S3 ; il n'analyse pas CloudTrail, les journaux de flux et les journaux DNS pour détecter des menaces."
    d:
      en: "AWS WAF filters web requests based on rules; it does not analyze account logs."
      fr: "AWS WAF filtre les requêtes web selon des règles ; il n'analyse pas les journaux du compte."
references:
  - title: "What is Amazon GuardDuty?"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html
