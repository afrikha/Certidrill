id: clfc02-2a-shared-rds-required-update
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Amazon RDS shows a required operating system update with an apply date for a company's DB instance. The company keeps changing its maintenance window to postpone the update. What will happen after the apply date?
  fr: |
    Amazon RDS affiche une mise à jour obligatoire du système d'exploitation, avec une date d'application, pour l'instance de base de données d'une entreprise. L'entreprise modifie sans cesse sa fenêtre de maintenance pour reporter la mise à jour. Que se passera-t-il après la date d'application ?
body:
  options:
    - id: a
      text: { en: "Amazon RDS applies the update automatically, even outside the preferred window.", fr: "Amazon RDS applique automatiquement la mise à jour, même hors de la fenêtre préférée." }
    - id: b
      text: { en: "The update is cancelled, and the company must patch the operating system itself.", fr: "La mise à jour est annulée, et l'entreprise doit corriger elle-même le système d'exploitation." }
    - id: c
      text: { en: "The update stays pending until the company chooses to apply it.", fr: "La mise à jour reste en attente jusqu'à ce que l'entreprise choisisse de l'appliquer." }
    - id: d
      text: { en: "Amazon RDS stops the DB instance until the company applies the update.", fr: "Amazon RDS arrête l'instance de base de données jusqu'à ce que l'entreprise applique la mise à jour." }
answer: { optionId: a }
explanation:
  correct:
    en: "OS patching on RDS is shared: AWS provides the updates, and the customer chooses when to apply them. A required update has an apply date; after it, RDS upgrades the operating system automatically, and if the customer keeps moving the window, RDS can apply it outside the preferred maintenance window."
    fr: "Les correctifs du système d'exploitation sur RDS sont partagés : AWS fournit les mises à jour, et le client choisit le moment de leur application. Une mise à jour obligatoire a une date d'application ; après celle-ci, RDS met à niveau le système automatiquement, et si le client déplace sans cesse la fenêtre, RDS peut l'appliquer hors de la fenêtre de maintenance préférée."
  options:
    b:
      en: "Operating system patches for the DB instance are delivered as RDS updates; a required update is not cancelled after its apply date."
      fr: "Les correctifs du système d'exploitation de l'instance sont fournis sous forme de mises à jour RDS ; une mise à jour obligatoire n'est pas annulée après sa date d'application."
    c:
      en: "Only optional updates wait for the customer; required updates are related to security and reliability and cannot be deferred indefinitely."
      fr: "Seules les mises à jour facultatives attendent le client ; les mises à jour obligatoires concernent la sécurité et la fiabilité et ne peuvent pas être reportées indéfiniment."
    d:
      en: "RDS does not stop the DB instance; it applies the required update automatically."
      fr: "RDS n'arrête pas l'instance de base de données ; il applique automatiquement la mise à jour obligatoire."
references:
  - title: Maintaining a DB instance
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Maintenance.html
