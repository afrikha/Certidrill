id: clfc02-2a-srm-depends-on-services
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is planning its first workloads on AWS. Under the AWS shared responsibility model, what mainly determines how much security configuration work the company must do?
  fr: |
    Une entreprise prépare ses premières charges de travail sur AWS. Selon le modèle de responsabilité partagée AWS, qu'est-ce qui détermine principalement la quantité de travail de configuration de sécurité que l'entreprise doit effectuer ?
body:
  options:
    - id: a
      text: { en: "The AWS services that the company chooses to use.", fr: "Les services AWS que l'entreprise choisit d'utiliser." }
    - id: b
      text: { en: "The AWS Support plan that the company subscribes to.", fr: "Le plan AWS Support auquel l'entreprise souscrit." }
    - id: c
      text: { en: "The pricing model that the company chooses for its instances.", fr: "Le modèle de tarification que l'entreprise choisit pour ses instances." }
    - id: d
      text: { en: "The number of employees in the company's IT department.", fr: "Le nombre d'employés du service informatique de l'entreprise." }
answer: { optionId: a }
explanation:
  correct:
    en: "The customer's responsibilities vary with the AWS services it selects. An infrastructure service such as Amazon EC2 requires the customer to perform all the necessary security configuration, while abstracted services such as Amazon S3 leave the operating system and platform to AWS."
    fr: "Les responsabilités du client varient selon les services AWS qu'il choisit. Un service d'infrastructure comme Amazon EC2 impose au client d'effectuer toute la configuration de sécurité nécessaire, alors que des services abstraits comme Amazon S3 laissent le système d'exploitation et la plateforme à AWS."
  options:
    b:
      en: "A Support plan gives access to help and guidance; it does not move security tasks from the customer to AWS."
      fr: "Un plan Support donne accès à de l'aide et à des conseils ; il ne transfère pas de tâches de sécurité du client vers AWS."
    c:
      en: "On-Demand, Reserved or Spot pricing changes the cost of an instance, not who secures it."
      fr: "La tarification On-Demand, Reserved Instances ou Spot change le coût d'une instance, pas la partie qui la sécurise."
    d:
      en: "The size of the company's team does not change the split of responsibilities between AWS and the customer."
      fr: "La taille de l'équipe de l'entreprise ne change pas la répartition des responsabilités entre AWS et le client."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
