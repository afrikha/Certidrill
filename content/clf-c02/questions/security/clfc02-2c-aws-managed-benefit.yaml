id: clfc02-2c-aws-managed-benefit
objective: "2.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes an advantage of AWS managed policies?
  fr: |
    Quelle affirmation décrit un avantage des politiques gérées par AWS ?
body:
  options:
    - { id: a, text: { en: "Customers can edit them to match the exact needs of each team.", fr: "Les clients peuvent les modifier pour répondre aux besoins exacts de chaque équipe." } }
    - { id: b, text: { en: "They always grant the least privilege needed for every workload.", fr: "Elles accordent toujours le moindre privilège nécessaire à chaque charge de travail." } }
    - { id: c, text: { en: "They are deleted automatically when the attached user is deleted.", fr: "Elles sont supprimées automatiquement quand l'utilisateur attaché est supprimé." } }
    - { id: d, text: { en: "AWS maintains them and updates them, for example for new services.", fr: "AWS les maintient et les met à jour, par exemple pour de nouveaux services." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS managed policies are created and administered by AWS, which updates them when needed, for example when a new service launches. They are a quick starting point for common use cases and job functions."
    fr: "Les politiques gérées par AWS sont créées et administrées par AWS, qui les met à jour si nécessaire, par exemple lors du lancement d'un nouveau service. Elles constituent un point de départ rapide pour les cas d'usage et fonctions courants."
  options:
    a:
      en: "Customers cannot change AWS managed policies; they must create customer managed policies for custom needs."
      fr: "Les clients ne peuvent pas modifier les politiques gérées par AWS ; ils doivent créer des politiques gérées par le client pour des besoins spécifiques."
    b:
      en: "AWS managed policies are written for all customers and often grant more than a given workload needs."
      fr: "Les politiques gérées par AWS sont écrites pour tous les clients et accordent souvent plus que ce dont une charge de travail a besoin."
    c:
      en: "Deletion with the identity is a property of inline policies; AWS managed policies are standalone."
      fr: "La suppression avec l'identité est une propriété des politiques en ligne ; les politiques gérées par AWS sont autonomes."
references:
  - title: Managed policies and inline policies
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vs-inline.html
