id: clfc02-2a-gov-pci-customer-scope
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer processes card payments on AWS. AWS has a PCI DSS attestation of compliance. Which statement is correct?
  fr: |
    Un détaillant en ligne traite des paiements par carte sur AWS. AWS dispose d'une attestation de conformité PCI DSS. Quelle affirmation est correcte ?
body:
  options:
    - id: a
      text: { en: "The retailer's workloads are compliant because they run on a PCI DSS attested platform.", fr: "Les charges de travail du détaillant sont conformes, car elles s'exécutent sur une plateforme attestée PCI DSS." }
    - id: b
      text: { en: "The retailer must still make its own payment environment meet PCI DSS.", fr: "Le détaillant doit tout de même rendre son propre environnement de paiement conforme à PCI DSS." }
    - id: c
      text: { en: "AWS takes over the retailer's PCI DSS obligations after the attestation.", fr: "AWS reprend les obligations PCI DSS du détaillant après l'attestation." }
    - id: d
      text: { en: "The retailer must get its own attestation for the AWS data centers.", fr: "Le détaillant doit obtenir sa propre attestation pour les centres de données AWS." }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS attestations cover the controls of the AWS environment. AWS customers remain responsible for complying with the laws, regulations, and standards that apply to them, so the retailer must secure and assess its own cardholder data environment."
    fr: "Les attestations d'AWS couvrent les contrôles de l'environnement AWS. Les clients AWS restent responsables du respect des lois, réglementations et normes qui s'appliquent à eux : le détaillant doit donc sécuriser et évaluer son propre environnement de données de cartes."
  options:
    a:
      en: "Running on an attested platform does not make the customer's own configuration and processes compliant."
      fr: "S'exécuter sur une plateforme attestée ne rend pas conformes la configuration et les processus propres au client."
    c:
      en: "Compliance is shared; AWS does not take over the obligations of its customers."
      fr: "La conformité est partagée ; AWS ne reprend pas les obligations de ses clients."
    d:
      en: "The AWS data centers are covered by the AWS attestation itself; the retailer covers its own environment."
      fr: "Les centres de données AWS sont couverts par l'attestation d'AWS elle-même ; le détaillant couvre son propre environnement."
references:
  - title: Compliance Programs
    url: https://aws.amazon.com/compliance/programs/
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
