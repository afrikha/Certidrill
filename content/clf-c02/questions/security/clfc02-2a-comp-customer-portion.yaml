id: clfc02-2a-comp-customer-portion
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which items are part of the customer portion ("security in the cloud") of the AWS shared responsibility model? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels éléments font partie de la part du client (« sécurité dans le cloud ») dans le modèle de responsabilité partagée AWS ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Edge locations", fr: "Les emplacements périphériques" } }
    - { id: b, text: { en: "Customer data", fr: "Les données du client" } }
    - { id: c, text: { en: "Regions", fr: "Les Régions" } }
    - { id: d, text: { en: "Network traffic protection", fr: "La protection du trafic réseau" } }
    - { id: e, text: { en: "Networking hardware", fr: "Le matériel réseau" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The customer portion includes customer data, platform and applications, identity and access management, operating system, network and firewall configuration, encryption, and network traffic protection. The customer decides how its data and traffic are protected."
    fr: "La part du client comprend les données du client, la plateforme et les applications, la gestion des identités et des accès, la configuration du système d'exploitation, du réseau et du pare-feu, le chiffrement et la protection du trafic réseau. Le client décide de la façon dont ses données et son trafic sont protégés."
  options:
    a:
      en: "Edge locations are part of the AWS global infrastructure, which AWS secures."
      fr: "Les emplacements périphériques font partie de l'infrastructure mondiale d'AWS, qu'AWS sécurise."
    c:
      en: "Regions are part of the AWS global infrastructure, which AWS secures."
      fr: "Les Régions font partie de l'infrastructure mondiale d'AWS, qu'AWS sécurise."
    e:
      en: "The hardware that runs AWS services, including networking, is part of security of the cloud."
      fr: "Le matériel qui exécute les services AWS, y compris le réseau, fait partie de la sécurité du cloud."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
