id: clfc02-2b-svc-fips-endpoints
objective: "2.2.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company that works for a US federal agency must use FIPS 140 validated cryptographic modules whenever its applications send requests to AWS service APIs in US Regions.

    What should the company do?
  fr: |
    Une entreprise qui travaille pour une agence fédérale américaine doit utiliser des modules cryptographiques validés FIPS 140 chaque fois que ses applications envoient des requêtes aux API des services AWS dans des Régions américaines.

    Que doit faire l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Configure the applications to call the FIPS endpoints of the AWS services.", fr: "Configurer les applications pour qu'elles appellent les points de terminaison FIPS des services AWS." }
    - id: b
      text: { en: "Install certificates from AWS Certificate Manager (ACM) on the applications' servers.", fr: "Installer des certificats d'AWS Certificate Manager (ACM) sur les serveurs des applications." }
    - id: c
      text: { en: "Download the FIPS 140 certificates of AWS from AWS Artifact.", fr: "Télécharger les certificats FIPS 140 d'AWS depuis AWS Artifact." }
    - id: d
      text: { en: "Store the applications' encryption keys in AWS CloudHSM.", fr: "Stocker les clés de chiffrement des applications dans AWS CloudHSM." }
answer: { optionId: a }
explanation:
  correct:
    en: "Many AWS services offer FIPS endpoints in some Regions, such as the US, AWS GovCloud (US) and Canada Regions. These endpoints encrypt data in transit with FIPS-validated cryptographic libraries, so the applications must send their API requests to them instead of the standard endpoints."
    fr: "De nombreux services AWS proposent des points de terminaison FIPS dans certaines Régions, comme les Régions américaines, AWS GovCloud (US) et canadiennes. Ces points de terminaison chiffrent les données en transit avec des bibliothèques cryptographiques validées FIPS : les applications doivent leur envoyer leurs requêtes d'API au lieu des points de terminaison standard."
  options:
    b:
      en: "ACM certificates secure the company's own endpoints; they do not make calls to AWS APIs use FIPS validated modules."
      fr: "Les certificats ACM sécurisent les points de terminaison de l'entreprise ; ils ne font pas utiliser de modules validés FIPS aux appels vers les API AWS."
    c:
      en: "Downloading compliance documents does not change the cryptographic modules used for API connections."
      fr: "Télécharger des documents de conformité ne change pas les modules cryptographiques utilisés pour les connexions d'API."
    d:
      en: "CloudHSM stores keys in validated HSMs, but it does not change how applications connect to AWS service APIs."
      fr: "CloudHSM stocke les clés dans des HSM validés, mais il ne change pas la façon dont les applications se connectent aux API des services AWS."
references:
  - title: "Federal Information Processing Standard (FIPS) 140-3"
    url: https://aws.amazon.com/compliance/fips/
