id: clfc02-2b-gov-access-analyzer-external
objective: "2.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team must produce a report of the resources in its AWS accounts, such as Amazon S3 buckets and IAM roles, whose resource-based policies grant access to principals outside the company's organization.

    What should the team use?
  fr: |
    Une équipe de sécurité doit produire un rapport des ressources de ses comptes AWS, comme des compartiments Amazon S3 et des rôles IAM, dont les politiques basées sur les ressources accordent l'accès à des principaux extérieurs à l'organisation de l'entreprise.

    Que doit utiliser l'équipe ?
body:
  options:
    - id: a
      text: { en: "The IAM credential report", fr: "Le rapport d'informations d'identification IAM" }
    - id: b
      text: { en: "An AWS Artifact report", fr: "Un rapport AWS Artifact" }
    - id: c
      text: { en: "IAM Access Analyzer with an external access analyzer", fr: "IAM Access Analyzer avec un analyseur d'accès externe" }
    - id: d
      text: { en: "The CloudTrail event history", fr: "L'historique des événements CloudTrail" }
answer: { optionId: c }
explanation:
  correct:
    en: "IAM Access Analyzer analyzes the resource-based policies of resources such as S3 buckets, IAM roles, KMS keys and SQS queues with logic-based reasoning. An external access analyzer generates a finding for each resource that is shared with a principal outside the zone of trust, such as the organization."
    fr: "IAM Access Analyzer analyse les politiques basées sur les ressources de ressources comme les compartiments S3, les rôles IAM, les clés KMS et les files d'attente SQS par un raisonnement logique. Un analyseur d'accès externe génère un résultat pour chaque ressource partagée avec un principal extérieur à la zone de confiance, comme l'organisation."
  options:
    a:
      en: "The credential report lists the IAM users and the status of their credentials; it does not analyze resource-based policies."
      fr: "Le rapport d'informations d'identification répertorie les utilisateurs IAM et le statut de leurs informations d'identification ; il n'analyse pas les politiques basées sur les ressources."
    b:
      en: "AWS Artifact reports describe AWS's own compliance, not the access to the company's resources."
      fr: "Les rapports AWS Artifact décrivent la conformité d'AWS, pas l'accès aux ressources de l'entreprise."
    d:
      en: "The event history shows API calls of the last 90 days; it does not report which resources are shared outside the organization."
      fr: "L'historique des événements affiche les appels d'API des 90 derniers jours ; il n'indique pas quelles ressources sont partagées hors de l'organisation."
references:
  - title: "Using AWS Identity and Access Management Access Analyzer"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
