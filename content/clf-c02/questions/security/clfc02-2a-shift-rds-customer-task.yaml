id: clfc02-2a-shift-rds-customer-task
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses Amazon RDS for PostgreSQL for a new application. Which task remains the company's responsibility?
  fr: |
    Une entreprise utilise Amazon RDS for PostgreSQL pour une nouvelle application. Quelle tâche reste de la responsabilité de l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Running the processes that create the automated backups", fr: "Exécuter les processus qui créent les sauvegardes automatisées" }
    - id: b
      text: { en: "Configuring the security groups that control database access", fr: "Configurer les groupes de sécurité qui contrôlent l'accès à la base de données" }
    - id: c
      text: { en: "Installing operating system patches on the database host", fr: "Installer les correctifs du système d'exploitation sur l'hôte de base de données" }
    - id: d
      text: { en: "Maintaining the hardware of the database servers", fr: "Entretenir le matériel des serveurs de base de données" }
answer: { optionId: b }
explanation:
  correct:
    en: "With RDS, the customer controls network access: security groups determine which IP addresses or EC2 instances can connect to the databases. When a DB instance is created, its firewall blocks database access except through the rules of an associated security group."
    fr: "Avec RDS, le client contrôle l'accès réseau : les groupes de sécurité déterminent quelles adresses IP ou instances EC2 peuvent se connecter aux bases de données. À la création d'une instance de base de données, son pare-feu bloque tout accès à la base, sauf par les règles d'un groupe de sécurité associé."
  options:
    a:
      en: "Creating backups is one of the processes that Amazon RDS manages."
      fr: "La création des sauvegardes fait partie des processus gérés par Amazon RDS."
    c:
      en: "Amazon RDS upgrades the operating system of the DB instance; the customer only schedules when updates happen."
      fr: "Amazon RDS met à niveau le système d'exploitation de l'instance de base de données ; le client planifie seulement le moment des mises à jour."
    d:
      en: "Hardware is part of the infrastructure that AWS protects and maintains."
      fr: "Le matériel fait partie de l'infrastructure qu'AWS protège et entretient."
references:
  - title: Security in Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.html
