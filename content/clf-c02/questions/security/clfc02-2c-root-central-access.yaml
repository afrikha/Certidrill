id: clfc02-2c-root-central-access
objective: "2.3.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 80 member accounts in AWS Organizations. It wants to remove the root user credentials of the member accounts but still be able to perform root-only tasks on them when needed. What should the company use?
  fr: |
    Une entreprise dispose de 80 comptes membres dans AWS Organizations. Elle veut supprimer les informations d'identification racine des comptes membres tout en pouvant y effectuer, si nécessaire, les tâches réservées à l'utilisateur racine. Que doit utiliser l'entreprise ?
body:
  options:
    - { id: a, text: { en: "A service control policy (SCP) that denies all actions of member root users", fr: "Une politique de contrôle des services (SCP) qui refuse toutes les actions des utilisateurs racine membres" } }
    - { id: b, text: { en: "An MFA device registered for the root user of each member account", fr: "Un appareil MFA enregistré pour l'utilisateur racine de chaque compte membre" } }
    - { id: c, text: { en: "An IAM Identity Center permission set with the AdministratorAccess policy", fr: "Un ensemble d'autorisations IAM Identity Center doté de la politique AdministratorAccess" } }
    - { id: d, text: { en: "Centralized root access management run from the management account", fr: "La gestion centralisée de l'accès racine, pilotée depuis le compte de gestion" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Centralized root access management lets the management account, or a delegated administrator for IAM, remove the root password, access keys, signing certificates and MFA of member accounts. Root-only tasks, such as deleting a bucket policy that denies all principals, are then performed centrally as privileged tasks."
    fr: "La gestion centralisée de l'accès racine permet au compte de gestion, ou à un administrateur délégué pour IAM, de supprimer le mot de passe, les clés d'accès, les certificats de signature et la MFA racine des comptes membres. Les tâches réservées à la racine, comme la suppression d'une politique de compartiment qui refuse tous les principaux, sont ensuite effectuées de manière centralisée comme tâches privilégiées."
  options:
    a:
      en: "An SCP restricts what member root users can do, but their credentials still exist and must be protected."
      fr: "Une SCP restreint ce que peuvent faire les utilisateurs racine membres, mais leurs informations d'identification existent toujours et doivent être protégées."
    b:
      en: "MFA protects the root credentials of each account but keeps 80 sets of credentials instead of removing them."
      fr: "La MFA protège les informations d'identification racine de chaque compte, mais conserve 80 jeux d'identifiants au lieu de les supprimer."
    c:
      en: "A permission set provides IAM roles, which cannot perform the tasks that require root user credentials."
      fr: "Un ensemble d'autorisations fournit des rôles IAM, qui ne peuvent pas effectuer les tâches exigeant les informations d'identification racine."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
