id: clfc02-2b-geo-scp-approved-regions
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 12 member accounts in AWS Organizations. Because of a European data protection requirement, no one in these member accounts may create resources outside two approved EU Regions.

    Which feature should the company use to enforce this restriction?
  fr: |
    Une entreprise possède 12 comptes membres dans AWS Organizations. En raison d'une exigence européenne de protection des données, personne dans ces comptes membres ne doit pouvoir créer de ressources en dehors de deux Régions de l'UE approuvées.

    Quelle fonctionnalité l'entreprise doit-elle utiliser pour imposer cette restriction ?
body:
  options:
    - id: a
      text: { en: "A network ACL that blocks traffic to other Regions in every VPC", fr: "Une liste ACL réseau qui bloque le trafic vers les autres Régions dans chaque VPC" }
    - id: b
      text: { en: "A service control policy (SCP) that denies requests to other Regions", fr: "Une politique de contrôle des services (SCP) qui refuse les demandes vers les autres Régions" }
    - id: c
      text: { en: "An AWS Config rule in each account that reports resources in other Regions", fr: "Une règle AWS Config dans chaque compte qui signale les ressources des autres Régions" }
    - id: d
      text: { en: "An IAM password policy applied to every account", fr: "Une politique de mots de passe IAM appliquée à chaque compte" }
answer: { optionId: b }
explanation:
  correct:
    en: "SCPs set the maximum permissions available to the IAM users and roles of the member accounts in an organization; they do not grant permissions. An SCP that denies actions when the requested Region is not one of the approved Regions prevents anyone in those accounts from creating resources elsewhere."
    fr: "Les SCP définissent les autorisations maximales disponibles pour les utilisateurs et rôles IAM des comptes membres d'une organisation ; elles n'accordent pas d'autorisations. Une SCP qui refuse les actions lorsque la Région demandée ne fait pas partie des Régions approuvées empêche quiconque dans ces comptes de créer des ressources ailleurs."
  options:
    a:
      en: "Network ACLs filter IP traffic in subnets; they cannot stop API calls that create resources in other Regions."
      fr: "Les listes ACL réseau filtrent le trafic IP des sous-réseaux ; elles ne peuvent pas bloquer les appels d'API qui créent des ressources dans d'autres Régions."
    c:
      en: "An AWS Config rule detects noncompliant resources after they are created; it does not prevent their creation."
      fr: "Une règle AWS Config détecte les ressources non conformes après leur création ; elle n'empêche pas leur création."
    d:
      en: "A password policy sets password requirements for IAM users; it does not restrict Regions."
      fr: "Une politique de mots de passe définit les exigences de mots de passe des utilisateurs IAM ; elle ne restreint pas les Régions."
references:
  - title: "Service control policies (SCPs)"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
