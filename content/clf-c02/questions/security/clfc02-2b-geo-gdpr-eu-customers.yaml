id: clfc02-2b-geo-gdpr-eu-customers
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company based in Brazil starts to sell online to customers in the European Union and will process their personal data on AWS.

    Which regulation must the company take into account for this personal data?
  fr: |
    Une entreprise basée au Brésil commence à vendre en ligne à des clients de l'Union européenne et traitera leurs données personnelles sur AWS.

    Quelle réglementation l'entreprise doit-elle prendre en compte pour ces données personnelles ?
body:
  options:
    - id: a
      text: { en: "FedRAMP", fr: "FedRAMP" }
    - id: b
      text: { en: "ITAR", fr: "ITAR" }
    - id: c
      text: { en: "GDPR", fr: "RGPD (GDPR)" }
    - id: d
      text: { en: "HIPAA", fr: "HIPAA" }
answer: { optionId: c }
explanation:
  correct:
    en: "The General Data Protection Regulation (GDPR) protects the personal data of individuals in the European Union and also applies to companies outside the EU that offer goods or services to them. AWS provides GDPR resources, and the company remains responsible for how it processes the data."
    fr: "Le règlement général sur la protection des données (RGPD) protège les données personnelles des personnes situées dans l'Union européenne et s'applique aussi aux entreprises hors de l'UE qui leur proposent des biens ou des services. AWS fournit des ressources sur le RGPD, et l'entreprise reste responsable de la manière dont elle traite les données."
  options:
    a:
      en: "FedRAMP concerns cloud services used by US federal agencies."
      fr: "FedRAMP concerne les services cloud utilisés par les agences fédérales américaines."
    b:
      en: "ITAR controls US defense-related technical data."
      fr: "ITAR contrôle les données techniques liées à la défense américaine."
    d:
      en: "HIPAA applies to health information in the United States, not to the personal data of EU customers."
      fr: "HIPAA s'applique aux informations de santé aux États-Unis, pas aux données personnelles des clients de l'UE."
references:
  - title: "GDPR"
    url: https://aws.amazon.com/compliance/gdpr-center/
