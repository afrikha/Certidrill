id: clfc02-2b-enc-kms-keys
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to create and control the cryptographic keys that encrypt its data at rest in Amazon S3, Amazon EBS and Amazon RDS.

    Which AWS service should the company use?
  fr: |
    Une entreprise veut créer et contrôler les clés cryptographiques qui chiffrent ses données au repos dans Amazon S3, Amazon EBS et Amazon RDS.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Certificate Manager (ACM)", fr: "AWS Certificate Manager (ACM)" }
    - id: b
      text: { en: "AWS Key Management Service (AWS KMS)", fr: "AWS Key Management Service (AWS KMS)" }
    - id: c
      text: { en: "AWS Identity and Access Management (IAM)", fr: "AWS Identity and Access Management (IAM)" }
    - id: d
      text: { en: "Amazon Macie", fr: "Amazon Macie" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS KMS lets customers create and manage KMS keys and control their use. It is integrated with most AWS services that encrypt data, including Amazon S3, Amazon EBS and Amazon RDS."
    fr: "AWS KMS permet aux clients de créer et de gérer des clés KMS et de contrôler leur utilisation. Il est intégré à la plupart des services AWS qui chiffrent des données, dont Amazon S3, Amazon EBS et Amazon RDS."
  options:
    a:
      en: "ACM manages SSL/TLS certificates for encryption in transit, not the keys that encrypt stored data."
      fr: "ACM gère des certificats SSL/TLS pour le chiffrement en transit, pas les clés qui chiffrent les données stockées."
    c:
      en: "IAM controls who can access AWS resources, including KMS keys, but it does not create encryption keys."
      fr: "IAM contrôle qui peut accéder aux ressources AWS, y compris aux clés KMS, mais il ne crée pas de clés de chiffrement."
    d:
      en: "Macie discovers sensitive data in Amazon S3; it does not manage encryption keys."
      fr: "Macie découvre des données sensibles dans Amazon S3 ; il ne gère pas de clés de chiffrement."
references:
  - title: "AWS KMS keys"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html
