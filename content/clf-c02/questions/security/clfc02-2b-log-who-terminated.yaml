id: clfc02-2b-log-who-terminated
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company finds that one of its Amazon EC2 instances was terminated yesterday. The security team must find out which IAM identity made the request and at what time.

    Which AWS service provides this information?
  fr: |
    Une entreprise constate qu'une de ses instances Amazon EC2 a été résiliée hier. L'équipe de sécurité doit savoir quelle identité IAM a effectué la demande et à quelle heure.

    Quel service AWS fournit cette information ?
body:
  options:
    - id: a
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: b
      text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" }
    - id: c
      text: { en: "Amazon CloudWatch", fr: "Amazon CloudWatch" }
    - id: d
      text: { en: "AWS Config", fr: "AWS Config" }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudTrail records the actions taken by users, roles and AWS services as events, including API calls made from the console, the AWS CLI and the SDKs. Each event shows who made the request, when, from which IP address and on which resource."
    fr: "CloudTrail enregistre comme événements les actions effectuées par les utilisateurs, les rôles et les services AWS, y compris les appels d'API faits depuis la console, l'AWS CLI et les SDK. Chaque événement indique qui a fait la demande, quand, depuis quelle adresse IP et sur quelle ressource."
  options:
    a:
      en: "Amazon Inspector scans workloads for software vulnerabilities; it does not log API activity."
      fr: "Amazon Inspector analyse les charges de travail à la recherche de vulnérabilités logicielles ; il ne journalise pas l'activité des API."
    c:
      en: "CloudWatch collects metrics and logs and triggers alarms; it does not record which identity called the TerminateInstances API."
      fr: "CloudWatch collecte des métriques et des journaux et déclenche des alarmes ; il n'enregistre pas l'identité qui a appelé l'API TerminateInstances."
    d:
      en: "AWS Config records how resource configurations change over time; the identity behind each API call is recorded by CloudTrail."
      fr: "AWS Config enregistre l'évolution de la configuration des ressources ; l'identité à l'origine de chaque appel d'API est enregistrée par CloudTrail."
references:
  - title: "What Is AWS CloudTrail?"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html
