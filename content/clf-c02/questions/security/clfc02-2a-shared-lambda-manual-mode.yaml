id: clfc02-2a-shared-lambda-manual-mode
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Lambda functions with a Lambda-managed runtime. The company sets the runtime update mode of the functions to Manual and specifies a runtime version. What is the result?
  fr: |
    Une entreprise utilise des fonctions AWS Lambda avec un environnement d'exécution géré par Lambda. L'entreprise définit le mode de mise à jour de l'environnement d'exécution des fonctions sur Manual et indique une version d'environnement d'exécution. Quel est le résultat ?
body:
  options:
    - id: a
      text: { en: "Lambda updates the functions to each new runtime version as soon as it is released.", fr: "Lambda met à jour les fonctions vers chaque nouvelle version d'environnement d'exécution dès sa publication." }
    - id: b
      text: { en: "Lambda updates the functions to the latest runtime version the next time they are changed.", fr: "Lambda met à jour les fonctions vers la dernière version d'environnement d'exécution lors de leur prochaine modification." }
    - id: c
      text: { en: "The company must patch the operating system of the servers that run the functions.", fr: "L'entreprise doit appliquer les correctifs au système d'exploitation des serveurs qui exécutent les fonctions." }
    - id: d
      text: { en: "The functions keep the specified version, so the company must update the runtime version itself.", fr: "Les fonctions conservent la version indiquée : l'entreprise doit donc mettre à jour elle-même la version de l'environnement d'exécution." }
answer: { optionId: d }
explanation:
  correct:
    en: "Responsibility for applying runtime updates depends on the runtime update mode. In Manual mode, the function uses the specified runtime version indefinitely, so the company takes on keeping it up to date. With the default Auto mode, Lambda applies runtime updates and takes on the operational burden of patching."
    fr: "La responsabilité de l'application des mises à jour de l'environnement d'exécution dépend du mode de mise à jour. En mode Manual, la fonction utilise indéfiniment la version indiquée : l'entreprise doit donc la maintenir à jour. Avec le mode Auto, par défaut, Lambda applique les mises à jour et prend en charge la charge opérationnelle des correctifs."
  options:
    a:
      en: "Automatic updates are the behavior of the Auto mode, not of the Manual mode."
      fr: "Les mises à jour automatiques correspondent au mode Auto, pas au mode Manual."
    b:
      en: "Updating when the function changes is the behavior of the Function update mode."
      fr: "La mise à jour lors de la modification de la fonction correspond au mode Function update."
    c:
      en: "Lambda manages the underlying infrastructure, including server maintenance and patching, whatever the runtime update mode."
      fr: "Lambda gère l'infrastructure sous-jacente, y compris la maintenance et les correctifs des serveurs, quel que soit le mode de mise à jour."
references:
  - title: Understanding how Lambda manages runtime updates
    url: https://docs.aws.amazon.com/lambda/latest/dg/runtimes-update.html
