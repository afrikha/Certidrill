id: clfc02-2a-benefit-rds-encryption
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company turns on Amazon RDS encryption for a DB instance that stores customer records. Which benefit does the company get?
  fr: |
    Une entreprise active le chiffrement Amazon RDS pour une instance de base de données qui stocke des dossiers de clients. Quel avantage l'entreprise obtient-elle ?
body:
  options:
    - id: a
      text: { en: "The application is protected against SQL injection attacks.", fr: "L'application est protégée contre les attaques par injection SQL." }
    - id: b
      text: { en: "IAM permissions are no longer needed to manage the database.", fr: "Les autorisations IAM ne sont plus nécessaires pour gérer la base de données." }
    - id: c
      text: { en: "The data and snapshots are encrypted at rest with AES-256.", fr: "Les données et les instantanés sont chiffrés au repos avec AES-256." }
    - id: d
      text: { en: "Connections from the application to the database are encrypted.", fr: "Les connexions de l'application à la base de données sont chiffrées." }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon RDS encryption secures DB instances and snapshots at rest. It uses the industry-standard AES-256 algorithm to encrypt the data on the server that hosts the DB instance, which protects the records if the underlying storage is accessed."
    fr: "Le chiffrement Amazon RDS sécurise les instances de base de données et les instantanés au repos. Il utilise l'algorithme standard AES-256 pour chiffrer les données sur le serveur qui héberge l'instance, ce qui protège les dossiers si le stockage sous-jacent est consulté."
  options:
    a:
      en: "Encryption at rest protects stored data; it does not filter malicious queries sent by the application."
      fr: "Le chiffrement au repos protège les données stockées ; il ne filtre pas les requêtes malveillantes envoyées par l'application."
    b:
      en: "IAM policies still control who can create, modify, or delete DB instances."
      fr: "Les politiques IAM contrôlent toujours qui peut créer, modifier ou supprimer des instances de base de données."
    d:
      en: "RDS encryption protects data at rest; protecting connections in transit uses SSL/TLS connections to the DB instance, which is a separate setting."
      fr: "Le chiffrement RDS protège les données au repos ; la protection des connexions en transit utilise des connexions SSL/TLS à l'instance de base de données, un réglage distinct."
references:
  - title: Security in Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.html
