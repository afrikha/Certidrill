id: clfc02-2a-aws-opensearch-patches
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses Amazon OpenSearch Service, a managed service that runs on single-tenant infrastructure. Which patching task is AWS's responsibility?
  fr: |
    Une entreprise utilise Amazon OpenSearch Service, un service géré qui s'exécute sur une infrastructure à locataire unique. Quelle tâche liée aux correctifs relève de la responsabilité d'AWS ?
body:
  options:
    - id: a
      text: { en: "Reviewing the available updates and applying the service updates", fr: "Examiner les mises à jour disponibles et appliquer les mises à jour du service" }
    - id: b
      text: { en: "Selecting the maintenance windows in which updates can run", fr: "Sélectionner les fenêtres de maintenance pendant lesquelles les mises à jour peuvent s'exécuter" }
    - id: c
      text: { en: "Scheduling the required restarts within the communicated timeframes", fr: "Planifier les redémarrages requis dans les délais communiqués" }
    - id: d
      text: { en: "Developing and validating patches and notifying customers of updates", fr: "Développer et valider les correctifs et informer les clients des mises à jour" }
answer: { optionId: d }
explanation:
  correct:
    en: "For managed services on single-tenant architectures, such as Amazon OpenSearch Service, Amazon RDS, and Amazon ElastiCache, AWS identifies vulnerabilities, develops and validates patches, releases them within the service's patching SLA, and notifies customers of available updates."
    fr: "Pour les services gérés sur des architectures à locataire unique, comme Amazon OpenSearch Service, Amazon RDS et Amazon ElastiCache, AWS identifie les vulnérabilités, développe et valide les correctifs, les publie dans le respect du SLA de correctifs du service et informe les clients des mises à jour disponibles."
  options:
    a:
      en: "Reviewing available updates and applying service updates is the customer's part for single-tenant managed services."
      fr: "Examiner les mises à jour disponibles et appliquer les mises à jour du service est la part du client pour les services gérés à locataire unique."
    b:
      en: "The customer facilitates patching by selecting maintenance windows."
      fr: "Le client facilite l'application des correctifs en sélectionnant les fenêtres de maintenance."
    c:
      en: "Scheduling required restarts within the timeframes communicated by AWS is the customer's part."
      fr: "Planifier les redémarrages requis dans les délais communiqués par AWS est la part du client."
references:
  - title: Shared responsibility
    url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html
