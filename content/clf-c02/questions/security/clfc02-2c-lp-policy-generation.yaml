id: clfc02-2c-lp-policy-generation
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has an IAM role with broad permissions. It wants to replace them with a policy that allows only the actions that the role has actually used, based on the role's AWS CloudTrail activity. Which AWS service should the company use?
  fr: |
    Une entreprise dispose d'un rôle IAM aux autorisations étendues. Elle veut les remplacer par une politique qui n'autorise que les actions réellement utilisées par le rôle, d'après son activité AWS CloudTrail. Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "AWS Trusted Advisor" }
    - { id: b, text: "Amazon Inspector" }
    - { id: c, text: "AWS Artifact" }
    - { id: d, text: "IAM Access Analyzer" }
answer: { optionId: d }
explanation:
  correct:
    en: "IAM Access Analyzer can review the CloudTrail activity of a role and generate a fine-grained policy that contains only the actions used. AWS recommends testing the generated policy before using it in production."
    fr: "IAM Access Analyzer peut analyser l'activité CloudTrail d'un rôle et générer une politique détaillée qui ne contient que les actions utilisées. AWS recommande de tester la politique générée avant de l'utiliser en production."
  options:
    a:
      en: "Trusted Advisor runs best-practice checks on the account; it does not generate IAM policies from CloudTrail activity."
      fr: "Trusted Advisor exécute des vérifications de bonnes pratiques sur le compte ; il ne génère pas de politiques IAM à partir de l'activité CloudTrail."
    b:
      en: "Amazon Inspector scans workloads for software vulnerabilities; it does not create IAM policies."
      fr: "Amazon Inspector analyse les charges de travail à la recherche de vulnérabilités logicielles ; il ne crée pas de politiques IAM."
    c:
      en: "AWS Artifact provides AWS compliance reports and agreements; it does not analyze role activity."
      fr: "AWS Artifact fournit les rapports et accords de conformité d'AWS ; il n'analyse pas l'activité des rôles."
references:
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
