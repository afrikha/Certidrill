id: clfc02-2b-cinfo-artifact-notifications
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A compliance team downloads AWS reports from AWS Artifact every quarter. The team wants to be alerted when new reports or new versions of reports become available, instead of checking manually.

    What should the team use?
  fr: |
    Une équipe de conformité télécharge chaque trimestre des rapports AWS depuis AWS Artifact. Elle veut être avertie quand de nouveaux rapports ou de nouvelles versions de rapports sont disponibles, au lieu de vérifier manuellement.

    Que doit utiliser l'équipe ?
body:
  options:
    - id: a
      text: { en: "An AWS Config rule", fr: "Une règle AWS Config" }
    - id: b
      text: { en: "AWS Health Dashboard events", fr: "Les événements d'AWS Health Dashboard" }
    - id: c
      text: { en: "AWS Artifact notifications", fr: "Les notifications AWS Artifact" }
    - id: d
      text: { en: "An AWS Budgets alert", fr: "Une alerte AWS Budgets" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Artifact can send email notifications about updates to reports and agreements. The team creates a notification configuration in the AWS Artifact console that sets the recipients and the notifications they receive; the emails are sent through AWS User Notifications."
    fr: "AWS Artifact peut envoyer des notifications par e-mail sur les mises à jour des rapports et des accords. L'équipe crée dans la console AWS Artifact une configuration de notification qui définit les destinataires et les notifications qu'ils reçoivent ; les e-mails sont envoyés par AWS User Notifications."
  options:
    a:
      en: "AWS Config rules evaluate the configuration of the company's resources; they do not track AWS Artifact reports."
      fr: "Les règles AWS Config évaluent la configuration des ressources de l'entreprise ; elles ne suivent pas les rapports d'AWS Artifact."
    b:
      en: "The AWS Health Dashboard reports service events and scheduled changes that affect the account, not new compliance reports."
      fr: "AWS Health Dashboard signale les événements de service et les modifications planifiées qui touchent le compte, pas les nouveaux rapports de conformité."
    d:
      en: "AWS Budgets alerts are about costs and usage, not about compliance documents."
      fr: "Les alertes AWS Budgets portent sur les coûts et l'utilisation, pas sur les documents de conformité."
references:
  - title: "Configuring email notifications in AWS Artifact"
    url: https://docs.aws.amazon.com/artifact/latest/ug/managing-notifications.html
