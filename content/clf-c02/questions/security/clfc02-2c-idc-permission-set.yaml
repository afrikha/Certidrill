id: clfc02-2c-idc-permission-set
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS IAM Identity Center with AWS Organizations. An administrator wants to define database administrator permissions once and assign them to a group of users in 10 AWS accounts. What should the administrator create?
  fr: |
    Une entreprise utilise AWS IAM Identity Center avec AWS Organizations. Un administrateur veut définir une seule fois des autorisations d'administrateur de bases de données et les attribuer à un groupe d'utilisateurs dans 10 comptes AWS. Que doit créer l'administrateur ?
body:
  options:
    - { id: a, text: { en: "A permission set", fr: "Un ensemble d'autorisations" } }
    - { id: b, text: { en: "An IAM user group in each account", fr: "Un groupe d'utilisateurs IAM dans chaque compte" } }
    - { id: c, text: { en: "A service control policy (SCP)", fr: "Une politique de contrôle des services (SCP)" } }
    - { id: d, text: { en: "An inline policy for each user", fr: "Une politique en ligne pour chaque utilisateur" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A permission set is a template of one or more IAM policies that IAM Identity Center assigns to users and groups in AWS accounts. When it is assigned, IAM Identity Center creates a matching IAM role in each account and keeps it updated when the permission set changes."
    fr: "Un ensemble d'autorisations est un modèle d'une ou plusieurs politiques IAM qu'IAM Identity Center attribue à des utilisateurs et groupes dans des comptes AWS. Lors de l'attribution, IAM Identity Center crée un rôle IAM correspondant dans chaque compte et le met à jour quand l'ensemble d'autorisations change."
  options:
    b:
      en: "An IAM user group exists in one account only, so the administrator would have to create and maintain 10 groups and IAM users."
      fr: "Un groupe d'utilisateurs IAM n'existe que dans un compte : l'administrateur devrait créer et maintenir 10 groupes et des utilisateurs IAM."
    c:
      en: "An SCP limits the maximum permissions of accounts but never grants permissions to users."
      fr: "Une SCP limite les autorisations maximales des comptes mais n'accorde jamais d'autorisations aux utilisateurs."
    d:
      en: "Inline policies belong to a single identity and must be repeated for every user, which is the opposite of defining permissions once."
      fr: "Les politiques en ligne appartiennent à une seule identité et doivent être répétées pour chaque utilisateur, l'inverse d'une définition unique."
references:
  - title: Manage AWS accounts with permission sets
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html
