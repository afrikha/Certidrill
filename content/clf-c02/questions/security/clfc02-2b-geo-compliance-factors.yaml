id: clfc02-2b-geo-compliance-factors
objective: "2.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two factors determine which compliance requirements apply to a company's workloads on AWS? (Choose two.)
  fr: |
    Quels sont les deux facteurs qui déterminent les exigences de conformité applicables aux charges de travail d'une entreprise sur AWS ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "The Amazon EC2 instance families that the company uses", fr: "Les familles d'instances Amazon EC2 utilisées par l'entreprise" }
    - id: b
      text: { en: "The number of Availability Zones that the company's workloads use", fr: "Le nombre de zones de disponibilité utilisées par les charges de travail de l'entreprise" }
    - id: c
      text: { en: "The countries where the company's customers and data are located", fr: "Les pays où se trouvent les clients et les données de l'entreprise" }
    - id: d
      text: { en: "The AWS Support plan that the company subscribes to", fr: "Le plan AWS Support souscrit par l'entreprise" }
    - id: e
      text: { en: "The industry in which the company operates, such as healthcare or finance", fr: "Le secteur d'activité de l'entreprise, comme la santé ou la finance" }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Compliance requirements come from the laws, regulations and standards that apply to the company: some depend on the industry (HIPAA for US healthcare, PCI DSS for card payments) and others on geography (GDPR in the EU, national data residency laws). AWS publishes compliance programs organized by country and by industry to help customers."
    fr: "Les exigences de conformité découlent des lois, réglementations et normes applicables à l'entreprise : certaines dépendent du secteur d'activité (HIPAA pour la santé aux États-Unis, PCI DSS pour les paiements par carte) et d'autres de la géographie (RGPD dans l'UE, lois nationales sur la résidence des données). AWS publie des programmes de conformité classés par pays et par secteur pour aider les clients."
  options:
    a:
      en: "The instance family affects performance and cost, not which regulations apply to the company."
      fr: "La famille d'instances influe sur les performances et le coût, pas sur les réglementations applicables à l'entreprise."
    b:
      en: "The number of Availability Zones affects availability, not which compliance requirements apply."
      fr: "Le nombre de zones de disponibilité influe sur la disponibilité, pas sur les exigences de conformité applicables."
    d:
      en: "The Support plan defines the support the company receives; it does not change its legal obligations."
      fr: "Le plan de support définit l'assistance reçue par l'entreprise ; il ne change pas ses obligations légales."
references:
  - title: "AWS Services in Scope by Compliance Program"
    url: https://aws.amazon.com/compliance/services-in-scope/
  - title: "GDPR"
    url: https://aws.amazon.com/compliance/gdpr-center/
