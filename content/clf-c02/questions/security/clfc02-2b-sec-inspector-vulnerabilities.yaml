id: clfc02-2b-sec-inspector-vulnerabilities
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to automatically and continuously scan its Amazon EC2 instances and its container images in Amazon ECR for software vulnerabilities.

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise veut analyser automatiquement et en continu ses instances Amazon EC2 et ses images de conteneur dans Amazon ECR à la recherche de vulnérabilités logicielles.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: b
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
    - id: c
      text: { en: "AWS Shield", fr: "AWS Shield" }
    - id: d
      text: { en: "Amazon Macie", fr: "Amazon Macie" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Inspector automatically discovers EC2 instances, container images in Amazon ECR and Lambda functions, and continuously scans them for known software vulnerabilities and unintended network exposure."
    fr: "Amazon Inspector découvre automatiquement les instances EC2, les images de conteneur dans Amazon ECR et les fonctions Lambda, et les analyse en continu à la recherche de vulnérabilités logicielles connues et d'expositions réseau involontaires."
  options:
    b:
      en: "GuardDuty detects threats from activity such as API calls and network traffic; it does not scan software packages for vulnerabilities."
      fr: "GuardDuty détecte les menaces à partir de l'activité, comme les appels d'API et le trafic réseau ; il n'analyse pas les paquets logiciels à la recherche de vulnérabilités."
    c:
      en: "Shield protects against DDoS attacks; it does not scan workloads."
      fr: "Shield protège contre les attaques DDoS ; il n'analyse pas les charges de travail."
    d:
      en: "Macie discovers sensitive data in Amazon S3, not vulnerabilities in instances or images."
      fr: "Macie découvre les données sensibles dans Amazon S3, pas les vulnérabilités des instances ou des images."
references:
  - title: "What is Amazon Inspector?"
    url: https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html
