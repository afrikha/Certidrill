id: clfc02-2b-geo-pci-card-payments
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retail company stores, processes and transmits credit card data in its AWS environment.

    Which compliance standard applies to this workload?
  fr: |
    Une entreprise de vente en ligne stocke, traite et transmet des données de cartes de crédit dans son environnement AWS.

    Quelle norme de conformité s'applique à cette charge de travail ?
body:
  options:
    - id: a
      text: { en: "HIPAA", fr: "HIPAA" }
    - id: b
      text: { en: "PCI DSS", fr: "PCI DSS" }
    - id: c
      text: { en: "FedRAMP", fr: "FedRAMP" }
    - id: d
      text: { en: "ITAR", fr: "ITAR" }
answer: { optionId: b }
explanation:
  correct:
    en: "The Payment Card Industry Data Security Standard (PCI DSS) applies to every entity that stores, processes or transmits cardholder data. AWS is assessed as a PCI DSS Level 1 service provider, and the company remains responsible for the compliance of its own cardholder data environment."
    fr: "La norme PCI DSS (Payment Card Industry Data Security Standard) s'applique à toute entité qui stocke, traite ou transmet des données de titulaires de carte. AWS est évalué comme prestataire de services PCI DSS de niveau 1, et l'entreprise reste responsable de la conformité de son propre environnement de données de titulaires de carte."
  options:
    a:
      en: "HIPAA is a US law that protects health information, not card data."
      fr: "HIPAA est une loi américaine qui protège les informations de santé, pas les données de cartes."
    c:
      en: "FedRAMP is the US government program for authorizing cloud services used by federal agencies."
      fr: "FedRAMP est le programme du gouvernement américain qui autorise les services cloud utilisés par les agences fédérales."
    d:
      en: "ITAR regulates US defense-related technical data, not payment data."
      fr: "ITAR réglemente les données techniques liées à la défense américaine, pas les données de paiement."
references:
  - title: "PCI (Payment Card Industry Standards)"
    url: https://aws.amazon.com/compliance/pci-dss-level-1-faqs/
