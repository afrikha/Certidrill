id: clfc02-2a-gov-third-party-audits
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    How does AWS demonstrate that its environment meets standards such as ISO 27001 and SOC 2?
  fr: |
    Comment AWS démontre-t-il que son environnement respecte des normes comme ISO 27001 et SOC 2 ?
body:
  options:
    - id: a
      text: { en: "AWS asks each customer to audit the AWS data centers once a year.", fr: "AWS demande à chaque client d'auditer les centres de données AWS une fois par an." }
    - id: b
      text: { en: "AWS publishes its own internal assessment without any outside review.", fr: "AWS publie sa propre évaluation interne sans aucun examen externe." }
    - id: c
      text: { en: "Independent third-party auditors assess AWS and issue certifications or reports.", fr: "Des auditeurs tiers indépendants évaluent AWS et délivrent des certifications ou des rapports." }
    - id: d
      text: { en: "AWS certifies the workloads of each customer that requests compliance.", fr: "AWS certifie les charges de travail de chaque client qui demande la conformité." }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS compliance programs such as ISO 27001, SOC 1/2/3, PCI DSS, and FedRAMP are certifications and attestations assessed by a third-party, independent auditor. Each results in a certification, an audit report, or an attestation of compliance."
    fr: "Les programmes de conformité AWS comme ISO 27001, SOC 1/2/3, PCI DSS et FedRAMP sont des certifications et des attestations évaluées par un auditeur tiers indépendant. Chacune aboutit à une certification, à un rapport d'audit ou à une attestation de conformité."
  options:
    a:
      en: "Customers do not audit AWS data centers; AWS gives physical access only to approved employees and escorted third parties."
      fr: "Les clients n'auditent pas les centres de données AWS ; AWS ne donne l'accès physique qu'aux employés approuvés et à des tiers accompagnés."
    b:
      en: "Certifications and attestations rely on an independent auditor, not only on AWS's own assessment."
      fr: "Les certifications et attestations reposent sur un auditeur indépendant, pas seulement sur l'évaluation d'AWS."
    d:
      en: "AWS programs cover the AWS environment; customers remain responsible for the compliance of their own workloads."
      fr: "Les programmes d'AWS couvrent l'environnement AWS ; les clients restent responsables de la conformité de leurs propres charges de travail."
references:
  - title: Compliance Programs
    url: https://aws.amazon.com/compliance/programs/
