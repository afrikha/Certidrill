id: clfc02-2a-shared-patch-split
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Patch management is a shared control in the AWS shared responsibility model. How is it divided for a company that runs applications on Amazon EC2?
  fr: |
    La gestion des correctifs est un contrôle partagé dans le modèle de responsabilité partagée AWS. Comment est-elle répartie pour une entreprise qui exécute des applications sur Amazon EC2 ?
body:
  options:
    - id: a
      text: { en: "AWS patches the infrastructure, and the company patches its guest operating systems and applications.", fr: "AWS corrige l'infrastructure, et l'entreprise corrige ses systèmes d'exploitation invités et ses applications." }
    - id: b
      text: { en: "AWS patches the guest operating systems, and the company patches its applications.", fr: "AWS corrige les systèmes d'exploitation invités, et l'entreprise corrige ses applications." }
    - id: c
      text: { en: "The company patches the infrastructure, and AWS patches the guest operating systems and applications.", fr: "L'entreprise corrige l'infrastructure, et AWS corrige les systèmes d'exploitation invités et les applications." }
    - id: d
      text: { en: "AWS patches the infrastructure, the guest operating systems, and the applications for the company.", fr: "AWS corrige l'infrastructure, les systèmes d'exploitation invités et les applications pour l'entreprise." }
answer: { optionId: a }
explanation:
  correct:
    en: "In patch management, AWS is responsible for patching and fixing flaws within the infrastructure, and customers are responsible for patching their guest operating systems and applications."
    fr: "Pour la gestion des correctifs, AWS est responsable de la correction des failles de l'infrastructure, et les clients sont responsables de l'application des correctifs à leurs systèmes d'exploitation invités et à leurs applications."
  options:
    b:
      en: "On EC2, the guest operating system is managed by the customer, not by AWS."
      fr: "Sur EC2, le système d'exploitation invité est géré par le client, pas par AWS."
    c:
      en: "This reverses the split: the infrastructure is AWS's part of the control."
      fr: "Cela inverse la répartition : l'infrastructure est la part d'AWS dans ce contrôle."
    d:
      en: "AWS does not patch customer applications or the guest operating system of EC2 instances."
      fr: "AWS ne corrige ni les applications des clients ni le système d'exploitation invité des instances EC2."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
