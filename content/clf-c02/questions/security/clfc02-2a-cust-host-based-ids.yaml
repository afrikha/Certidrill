id: clfc02-2a-cust-host-based-ids
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs regulated workloads on Amazon EC2 instances. Its compliance requirements are stricter than the AWS baseline and require host-based intrusion detection. How can the company meet this requirement under the AWS shared responsibility model?
  fr: |
    Une entreprise exécute des charges de travail réglementées sur des instances Amazon EC2. Ses exigences de conformité sont plus strictes que le niveau de base d'AWS et imposent une détection des intrusions sur l'hôte. Comment l'entreprise peut-elle respecter cette exigence selon le modèle de responsabilité partagée AWS ?
body:
  options:
    - id: a
      text: { en: "The company installs and manages host-based intrusion detection software on its instances.", fr: "L'entreprise installe et gère un logiciel de détection des intrusions sur l'hôte dans ses instances." }
    - id: b
      text: { en: "AWS installs intrusion detection software in the guest operating system when the company requests it.", fr: "AWS installe un logiciel de détection des intrusions dans le système d'exploitation invité à la demande de l'entreprise." }
    - id: c
      text: { en: "The company relies on its security groups, which also detect intrusions inside the operating system.", fr: "L'entreprise s'appuie sur ses groupes de sécurité, qui détectent aussi les intrusions dans le système d'exploitation." }
    - id: d
      text: { en: "AWS raises the security of the physical hosts used by the company's account to match its requirements.", fr: "AWS renforce la sécurité des hôtes physiques utilisés par le compte de l'entreprise pour atteindre ses exigences." }
answer: { optionId: a }
explanation:
  correct:
    en: "The guest operating system and the software on the instances are the customer's responsibility. To meet stricter compliance requirements, customers can enhance security with host-based firewalls, host-based intrusion detection and prevention, encryption, and key management."
    fr: "Le système d'exploitation invité et les logiciels des instances sont de la responsabilité du client. Pour respecter des exigences de conformité plus strictes, les clients peuvent renforcer la sécurité avec des pare-feu sur l'hôte, de la détection et de la prévention des intrusions sur l'hôte, du chiffrement et de la gestion des clés."
  options:
    b:
      en: "AWS does not manage software inside customer instances; the guest operating system belongs to the customer."
      fr: "AWS ne gère pas les logiciels des instances des clients ; le système d'exploitation invité appartient au client."
    c:
      en: "Security groups filter network traffic to and from instances; they do not inspect activity inside the operating system."
      fr: "Les groupes de sécurité filtrent le trafic réseau à destination et en provenance des instances ; ils n'inspectent pas l'activité du système d'exploitation."
    d:
      en: "The physical hosts are already secured by AWS; to go beyond the baseline, the customer adds controls such as intrusion detection in its own layer."
      fr: "Les hôtes physiques sont déjà sécurisés par AWS ; pour aller au-delà du niveau de base, le client ajoute des contrôles comme la détection des intrusions dans sa propre couche."
references:
  - title: Shared responsibility model
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-risk-and-compliance/shared-responsibility-model.html
