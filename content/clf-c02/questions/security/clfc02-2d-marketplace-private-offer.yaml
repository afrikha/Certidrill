id: clfc02-2d-marketplace-private-offer
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to buy a third-party security information and event management (SIEM) product in AWS Marketplace. The company wants to negotiate custom pricing and license terms with the seller.

    What should the company use?
  fr: |
    Une entreprise veut acheter dans AWS Marketplace un produit tiers de gestion des informations et des événements de sécurité (SIEM). Elle veut négocier un prix et des conditions de licence personnalisés avec le vendeur.

    Que doit utiliser l'entreprise ?
body:
  options:
    - id: a
      text: { en: "A private offer from the seller in AWS Marketplace", fr: "Une offre privée du vendeur dans AWS Marketplace" }
    - id: b
      text: { en: "A free trial of the product", fr: "Un essai gratuit du produit" }
    - id: c
      text: { en: "An estimate in AWS Pricing Calculator", fr: "Une estimation dans AWS Pricing Calculator" }
    - id: d
      text: { en: "A Savings Plan for the product", fr: "Un Savings Plan pour le produit" }
answer: { optionId: a }
explanation:
  correct:
    en: "In AWS Marketplace, a buyer can accept the public listing price under the seller's standard end user license agreement (EULA), or accept a private offer with custom pricing and a custom EULA. A private offer is the way to buy with negotiated terms."
    fr: "Dans AWS Marketplace, un acheteur peut accepter le prix public de l'offre selon le contrat de licence utilisateur final (CLUF) standard du vendeur, ou accepter une offre privée avec un prix et un CLUF personnalisés. L'offre privée permet d'acheter selon des conditions négociées."
  options:
    b:
      en: "A free trial lets the company test the product; it does not set custom pricing or license terms."
      fr: "Un essai gratuit permet de tester le produit ; il ne fixe ni prix ni conditions de licence personnalisés."
    c:
      en: "AWS Pricing Calculator estimates the cost of AWS services; it cannot negotiate with a seller."
      fr: "AWS Pricing Calculator estime le coût des services AWS ; il ne permet pas de négocier avec un vendeur."
    d:
      en: "Savings Plans discount AWS compute usage in exchange for a commitment; they do not apply custom terms to third-party software."
      fr: "Les Savings Plans réduisent le coût de l'utilisation du calcul AWS en échange d'un engagement ; ils n'appliquent pas de conditions personnalisées à un logiciel tiers."
references:
  - title: "What is AWS Marketplace?"
    url: https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html
