id: clfc02-2a-shift-constant-iam
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon EC2 for some workloads, Amazon RDS for others, and AWS Lambda for the rest. Which responsibility stays with the company for all three services?
  fr: |
    Une entreprise utilise Amazon EC2 pour certaines charges de travail, Amazon RDS pour d'autres et AWS Lambda pour les autres. Quelle responsabilité reste à l'entreprise pour les trois services ?
body:
  options:
    - id: a
      text: { en: "Managing the IAM permissions that control access to its resources", fr: "Gérer les autorisations IAM qui contrôlent l'accès à ses ressources" }
    - id: b
      text: { en: "Patching the operating system that runs each workload", fr: "Appliquer les correctifs au système d'exploitation qui exécute chaque charge de travail" }
    - id: c
      text: { en: "Provisioning the server capacity for each workload", fr: "Provisionner la capacité des serveurs pour chaque charge de travail" }
    - id: d
      text: { en: "Running the backup processes of each database", fr: "Exécuter les processus de sauvegarde de chaque base de données" }
answer: { optionId: a }
explanation:
  correct:
    en: "Whatever the service, the customer decides who can access and manage its resources and data, for example with IAM policies and roles. The operating system, capacity, and backup tasks shift to AWS on RDS or Lambda."
    fr: "Quel que soit le service, le client décide qui peut accéder à ses ressources et à ses données et les gérer, par exemple avec des politiques et des rôles IAM. Les tâches liées au système d'exploitation, à la capacité et aux sauvegardes passent à AWS avec RDS ou Lambda."
  options:
    b:
      en: "The customer patches the guest operating system on EC2 only; RDS and Lambda handle operating system updates."
      fr: "Le client corrige le système d'exploitation invité sur EC2 uniquement ; RDS et Lambda gèrent les mises à jour du système d'exploitation."
    c:
      en: "Lambda provisions and scales capacity automatically, so capacity provisioning is not a company task for all three services."
      fr: "Lambda provisionne et met à l'échelle la capacité automatiquement : le provisionnement de la capacité n'est donc pas une tâche de l'entreprise pour les trois services."
    d:
      en: "Creating backups is one of the processes that Amazon RDS manages."
      fr: "La création des sauvegardes fait partie des processus gérés par Amazon RDS."
references:
  - title: Security in Amazon EC2
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security.html
  - title: Security in AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-security.html
