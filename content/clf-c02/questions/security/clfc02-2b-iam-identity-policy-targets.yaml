id: clfc02-2b-iam-identity-policy-targets
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    To which three can a company attach identity-based policies? (Choose three.)
  fr: |
    Quels sont les trois éléments auxquels une entreprise peut attacher des politiques basées sur l'identité ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - id: a
      text: { en: "AWS KMS keys", fr: "Les clés AWS KMS" }
    - id: b
      text: { en: "IAM users", fr: "Les utilisateurs IAM" }
    - id: c
      text: { en: "Amazon S3 buckets", fr: "Les compartiments Amazon S3" }
    - id: d
      text: { en: "IAM user groups", fr: "Les groupes d'utilisateurs IAM" }
    - id: e
      text: { en: "IAM roles", fr: "Les rôles IAM" }
    - id: f
      text: { en: "Amazon SQS queues", fr: "Les files d'attente Amazon SQS" }
answer: { optionIds: [ b, d, e ] }
explanation:
  correct:
    en: "Identity-based policies are attached to IAM identities: users, groups of users and roles. They define what actions the identity can perform, on which resources and under which conditions."
    fr: "Les politiques basées sur l'identité sont attachées aux identités IAM : les utilisateurs, les groupes d'utilisateurs et les rôles. Elles définissent les actions que l'identité peut effectuer, sur quelles ressources et sous quelles conditions."
  options:
    a:
      en: "A KMS key is a resource: its key policy is a resource-based policy, not an identity-based policy."
      fr: "Une clé KMS est une ressource : sa politique de clé est une politique basée sur les ressources, pas une politique basée sur l'identité."
    c:
      en: "An S3 bucket is a resource: it can have a resource-based policy (bucket policy), not an identity-based policy."
      fr: "Un compartiment S3 est une ressource : il peut avoir une politique basée sur les ressources (politique de compartiment), pas une politique basée sur l'identité."
    f:
      en: "An SQS queue is a resource: its access policy is a resource-based policy, not an identity-based policy."
      fr: "Une file d'attente SQS est une ressource : sa politique d'accès est une politique basée sur les ressources, pas une politique basée sur l'identité."
references:
  - title: "Policies and permissions in AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html
