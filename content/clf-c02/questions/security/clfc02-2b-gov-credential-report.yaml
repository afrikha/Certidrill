id: clfc02-2b-gov-credential-report
objective: "2.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An auditor needs a downloadable list of all IAM users in an AWS account that shows the status of each user's password, access keys and MFA device.

    What should the auditor use?
  fr: |
    Un auditeur a besoin d'une liste téléchargeable de tous les utilisateurs IAM d'un compte AWS, qui indique le statut du mot de passe, des clés d'accès et du dispositif MFA de chaque utilisateur.

    Que doit utiliser l'auditeur ?
body:
  options:
    - id: a
      text: { en: "An AWS Artifact report", fr: "Un rapport AWS Artifact" }
    - id: b
      text: { en: "The CloudTrail event history", fr: "L'historique des événements CloudTrail" }
    - id: c
      text: { en: "An Amazon Inspector findings report", fr: "Un rapport de résultats Amazon Inspector" }
    - id: d
      text: { en: "The IAM credential report", fr: "Le rapport d'informations d'identification IAM" }
answer: { optionId: d }
explanation:
  correct:
    en: "The IAM credential report lists all users in the account and the status of their credentials, such as passwords, access keys and MFA devices, with dates of last use and rotation. It can be downloaded as a CSV file and used for audits and compliance."
    fr: "Le rapport d'informations d'identification IAM répertorie tous les utilisateurs du compte et le statut de leurs informations d'identification, comme les mots de passe, les clés d'accès et les dispositifs MFA, avec les dates de dernière utilisation et de rotation. Il se télécharge au format CSV et sert aux audits et à la conformité."
  options:
    a:
      en: "AWS Artifact reports describe AWS's own compliance, not the IAM users of the company's account."
      fr: "Les rapports AWS Artifact décrivent la conformité d'AWS, pas les utilisateurs IAM du compte de l'entreprise."
    b:
      en: "The event history lists API activity of the last 90 days, not the credential status of every user."
      fr: "L'historique des événements répertorie l'activité des API des 90 derniers jours, pas le statut des informations d'identification de chaque utilisateur."
    c:
      en: "Inspector findings are about software vulnerabilities and network exposure, not IAM credentials."
      fr: "Les résultats d'Inspector portent sur les vulnérabilités logicielles et l'exposition réseau, pas sur les informations d'identification IAM."
references:
  - title: "Generate credential reports for your AWS account"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_getting-report.html
