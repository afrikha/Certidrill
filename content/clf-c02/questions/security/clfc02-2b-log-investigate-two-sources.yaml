id: clfc02-2b-log-investigate-two-sources
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A security team investigates an incident. It must find which IAM user opened a port in a security group rule, and which IP addresses then connected to an Amazon EC2 instance through that port.

    Which two AWS sources provide this information? (Choose two.)
  fr: |
    Une équipe de sécurité enquête sur un incident. Elle doit trouver quel utilisateur IAM a ouvert un port dans une règle de groupe de sécurité, et quelles adresses IP se sont ensuite connectées à une instance Amazon EC2 par ce port.

    Quelles sont les deux sources AWS qui fournissent ces informations ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "VPC Flow Logs", fr: "Journaux de flux VPC (VPC Flow Logs)" }
    - id: b
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: c
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: d
      text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" }
    - id: e
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "CloudTrail records the AuthorizeSecurityGroupIngress API call with the identity of the IAM user who made it. VPC Flow Logs record the IP traffic of the instance's network interface, including the source addresses that connected on the port."
    fr: "CloudTrail enregistre l'appel d'API AuthorizeSecurityGroupIngress avec l'identité de l'utilisateur IAM qui l'a effectué. Les journaux de flux VPC enregistrent le trafic IP de l'interface réseau de l'instance, y compris les adresses source qui se sont connectées sur le port."
  options:
    b:
      en: "Amazon Inspector finds vulnerabilities and network exposure; it does not log API calls or connections."
      fr: "Amazon Inspector détecte les vulnérabilités et l'exposition réseau ; il ne journalise ni les appels d'API ni les connexions."
    c:
      en: "AWS Artifact provides AWS compliance reports, not logs of the company's own resources."
      fr: "AWS Artifact fournit les rapports de conformité d'AWS, pas les journaux des ressources de l'entreprise."
    e:
      en: "Trusted Advisor can flag security groups with unrestricted ports, but it does not record who changed them or which addresses connected."
      fr: "Trusted Advisor peut signaler des groupes de sécurité aux ports ouverts sans restriction, mais il n'enregistre pas qui les a modifiés ni quelles adresses se sont connectées."
references:
  - title: "What Is AWS CloudTrail?"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html
  - title: "Logging IP traffic using VPC Flow Logs"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html
