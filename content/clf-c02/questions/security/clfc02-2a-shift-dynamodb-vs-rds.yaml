id: clfc02-2a-shift-dynamodb-vs-rds
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses Amazon DynamoDB and Amazon RDS. Which statement describes the company's role in patching these two services?
  fr: |
    Une entreprise utilise Amazon DynamoDB et Amazon RDS. Quelle affirmation décrit le rôle de l'entreprise dans l'application des correctifs à ces deux services ?
body:
  options:
    - id: a
      text: { en: "The company selects maintenance windows for both the DynamoDB tables and the RDS DB instances.", fr: "L'entreprise sélectionne des fenêtres de maintenance pour les tables DynamoDB et pour les instances de base de données RDS." }
    - id: b
      text: { en: "No action is needed for DynamoDB, and for RDS the company selects maintenance windows for AWS updates.", fr: "Aucune action n'est nécessaire pour DynamoDB, et pour RDS l'entreprise sélectionne des fenêtres de maintenance pour les mises à jour d'AWS." }
    - id: c
      text: { en: "No action is needed for either service, because AWS applies all patches without any scheduling.", fr: "Aucune action n'est nécessaire pour l'un ou l'autre service, car AWS applique tous les correctifs sans aucune planification." }
    - id: d
      text: { en: "The company installs the RDS operating system patches itself, and AWS patches DynamoDB.", fr: "L'entreprise installe elle-même les correctifs du système d'exploitation RDS, et AWS corrige DynamoDB." }
answer: { optionId: b }
explanation:
  correct:
    en: "DynamoDB runs on a multi-tenant architecture, where AWS applies patches without customer action. RDS runs on a single-tenant architecture: AWS develops and releases the patches, and the customer facilitates patching by selecting maintenance windows and applying updates within the timeframes AWS communicates."
    fr: "DynamoDB s'exécute sur une architecture multilocataire, où AWS applique les correctifs sans action du client. RDS s'exécute sur une architecture à locataire unique : AWS développe et publie les correctifs, et le client facilite leur application en sélectionnant des fenêtres de maintenance et en appliquant les mises à jour dans les délais communiqués par AWS."
  options:
    a:
      en: "DynamoDB has no maintenance window to select; AWS patches it without customer action."
      fr: "DynamoDB n'a pas de fenêtre de maintenance à sélectionner ; AWS le corrige sans action du client."
    c:
      en: "For RDS, the customer has a part: it selects the maintenance window and schedules the updates."
      fr: "Pour RDS, le client a un rôle : il sélectionne la fenêtre de maintenance et planifie les mises à jour."
    d:
      en: "RDS operating system updates are provided and applied by Amazon RDS; the customer chooses when, not how."
      fr: "Les mises à jour du système d'exploitation RDS sont fournies et appliquées par Amazon RDS ; le client choisit le moment, pas la méthode."
references:
  - title: Shared responsibility
    url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html
