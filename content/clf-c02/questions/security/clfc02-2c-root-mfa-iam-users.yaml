id: clfc02-2c-root-mfa-iam-users
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has enabled MFA for the root user of its AWS account. The account also has 30 IAM users. Which statement about MFA for these IAM users is true?
  fr: |
    Une entreprise a activé la MFA pour l'utilisateur racine de son compte AWS. Le compte comporte aussi 30 utilisateurs IAM. Quelle affirmation sur la MFA de ces utilisateurs IAM est vraie ?
body:
  options:
    - { id: a, text: { en: "The IAM users now must use the root user's MFA device to sign in.", fr: "Les utilisateurs IAM doivent désormais utiliser l'appareil MFA de l'utilisateur racine pour se connecter." } }
    - { id: b, text: { en: "The IAM users are now protected by MFA without any further action.", fr: "Les utilisateurs IAM sont désormais protégés par la MFA sans autre action." } }
    - { id: c, text: { en: "Each IAM user needs its own MFA configuration to be protected by MFA.", fr: "Chaque utilisateur IAM a besoin de sa propre configuration MFA pour être protégé par la MFA." } }
    - { id: d, text: { en: "IAM users cannot use MFA, because MFA is available only for the root user.", fr: "Les utilisateurs IAM ne peuvent pas utiliser la MFA, car elle n'est disponible que pour l'utilisateur racine." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Enabling MFA for the root user affects only the root user credentials. IAM users are separate identities, and each one has its own MFA configuration, with up to eight MFA devices per user."
    fr: "Activer la MFA pour l'utilisateur racine ne concerne que les informations d'identification racine. Les utilisateurs IAM sont des identités distinctes, et chacun a sa propre configuration MFA, avec jusqu'à huit appareils MFA par utilisateur."
  options:
    a:
      en: "The root user's MFA device is tied to the root user; IAM users register their own devices."
      fr: "L'appareil MFA de l'utilisateur racine est lié à celui-ci ; les utilisateurs IAM enregistrent leurs propres appareils."
    b:
      en: "Root user MFA does not extend to IAM users; each IAM user must be configured separately."
      fr: "La MFA racine ne s'étend pas aux utilisateurs IAM ; chaque utilisateur IAM doit être configuré séparément."
    d:
      en: "MFA is available for IAM users as well as for the root user."
      fr: "La MFA est disponible pour les utilisateurs IAM comme pour l'utilisateur racine."
references:
  - title: AWS Multi-factor authentication in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html
