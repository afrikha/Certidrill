id: clfc02-2c-lp-auditor-readonly
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An external auditor needs to review the configuration of resources in a company's AWS account. The auditor must not be able to change anything. Which permissions should the company grant to the auditor?
  fr: |
    Un auditeur externe doit examiner la configuration des ressources du compte AWS d'une entreprise. L'auditeur ne doit rien pouvoir modifier. Quelles autorisations l'entreprise doit-elle accorder à l'auditeur ?
body:
  options:
    - { id: a, text: { en: "The root user credentials, protected with an MFA device that the company keeps", fr: "Les informations d'identification racine, protégées par un appareil MFA que l'entreprise conserve" } }
    - { id: b, text: { en: "The AdministratorAccess policy, with written instructions not to change resources", fr: "La politique AdministratorAccess, avec la consigne écrite de ne rien modifier" } }
    - { id: c, text: { en: "The PowerUserAccess policy, which excludes most IAM and AWS Organizations actions", fr: "La politique PowerUserAccess, qui exclut la plupart des actions IAM et AWS Organizations" } }
    - { id: d, text: { en: "A policy that allows only the read and list actions on the resources to review", fr: "Une politique qui n'autorise que les actions de lecture et de listage sur les ressources à examiner" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Least privilege means granting only what the task requires. Reviewing configurations needs read and list actions on the resources concerned, so a policy limited to those actions lets the auditor work without being able to change anything."
    fr: "Le moindre privilège consiste à n'accorder que ce que la tâche exige. Examiner des configurations nécessite des actions de lecture et de listage sur les ressources concernées : une politique limitée à ces actions permet à l'auditeur de travailler sans rien pouvoir modifier."
  options:
    a:
      en: "The root user has full access to the account and must not be shared for audits."
      fr: "L'utilisateur racine a un accès complet au compte et ne doit pas être partagé pour un audit."
    b:
      en: "AdministratorAccess allows every change; written instructions do not technically prevent modifications."
      fr: "AdministratorAccess permet toutes les modifications ; une consigne écrite n'empêche pas techniquement les changements."
    c:
      en: "PowerUserAccess still allows full access to most services, so the auditor could change resources."
      fr: "PowerUserAccess autorise toujours un accès complet à la plupart des services : l'auditeur pourrait modifier des ressources."
references:
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - title: Managed policies and inline policies
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vs-inline.html
