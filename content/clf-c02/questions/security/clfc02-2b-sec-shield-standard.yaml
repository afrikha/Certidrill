id: clfc02-2b-sec-shield-standard
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which AWS service automatically protects all AWS customers against the most common network and transport layer DDoS attacks at no additional charge?
  fr: |
    Quel service AWS protège automatiquement tous les clients AWS contre les attaques DDoS les plus courantes des couches réseau et transport, sans frais supplémentaires ?
body:
  options:
    - id: a
      text: { en: "AWS Shield Advanced", fr: "AWS Shield Advanced" }
    - id: b
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
    - id: c
      text: { en: "AWS Shield Standard", fr: "AWS Shield Standard" }
    - id: d
      text: { en: "AWS WAF", fr: "AWS WAF" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Shield Standard is enabled automatically for all AWS customers at no additional cost. It defends against the most common, frequently occurring network and transport layer DDoS attacks on websites and applications."
    fr: "AWS Shield Standard est activé automatiquement pour tous les clients AWS, sans coût supplémentaire. Il protège contre les attaques DDoS les plus courantes et les plus fréquentes des couches réseau et transport visant les sites web et les applications."
  options:
    a:
      en: "Shield Advanced is a paid subscription that adds protections; it is not automatic and free."
      fr: "Shield Advanced est un abonnement payant qui ajoute des protections ; il n'est ni automatique ni gratuit."
    b:
      en: "GuardDuty is a paid threat detection service that must be enabled; it is not the free DDoS protection."
      fr: "GuardDuty est un service payant de détection des menaces qui doit être activé ; ce n'est pas la protection DDoS gratuite."
    d:
      en: "AWS WAF filters web requests with rules that the customer configures and pays for."
      fr: "AWS WAF filtre les requêtes web avec des règles que le client configure et paie."
references:
  - title: "AWS Shield Standard overview"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-standard-summary.html
