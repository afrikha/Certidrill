id: clfc02-2a-shift-lambda-container-image
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys its AWS Lambda functions as container images built from an AWS base image. AWS publishes an updated base image that contains runtime security patches. What must happen for the functions to use the patched runtime?
  fr: |
    Une entreprise déploie ses fonctions AWS Lambda sous forme d'images de conteneur créées à partir d'une image de base AWS. AWS publie une image de base mise à jour qui contient des correctifs de sécurité de l'environnement d'exécution. Que faut-il faire pour que les fonctions utilisent l'environnement d'exécution corrigé ?
body:
  options:
    - id: a
      text: { en: "Nothing, because Lambda updates container images automatically in the default Auto mode.", fr: "Rien, car Lambda met à jour automatiquement les images de conteneur dans le mode Auto par défaut." }
    - id: b
      text: { en: "The company patches the operating system of the hosts that run the containers.", fr: "L'entreprise applique les correctifs au système d'exploitation des hôtes qui exécutent les conteneurs." }
    - id: c
      text: { en: "The company builds a new image from the updated base image and redeploys the functions.", fr: "L'entreprise crée une nouvelle image à partir de l'image de base mise à jour et redéploie les fonctions." }
    - id: d
      text: { en: "Nothing, because Lambda rebuilds each image from its base image every time the function runs.", fr: "Rien, car Lambda recrée chaque image à partir de son image de base à chaque exécution de la fonction." }
answer: { optionId: c }
explanation:
  correct:
    en: "Automatic runtime updates apply to functions that use Lambda-managed runtimes. For container-based functions, the runtime is part of the image that the customer builds, so the company must create a new container image from the updated base image and redeploy the function."
    fr: "Les mises à jour automatiques de l'environnement d'exécution s'appliquent aux fonctions qui utilisent des environnements d'exécution gérés par Lambda. Pour les fonctions basées sur des conteneurs, l'environnement d'exécution fait partie de l'image créée par le client : l'entreprise doit donc créer une nouvelle image de conteneur à partir de l'image de base mise à jour et redéployer la fonction."
  options:
    a:
      en: "Runtime update modes apply to Lambda-managed runtimes; Lambda does not rebuild a customer's container images."
      fr: "Les modes de mise à jour de l'environnement d'exécution s'appliquent aux environnements gérés par Lambda ; Lambda ne recrée pas les images de conteneur d'un client."
    b:
      en: "Lambda manages the underlying infrastructure, including server maintenance and patching."
      fr: "Lambda gère l'infrastructure sous-jacente, y compris la maintenance et les correctifs des serveurs."
    d:
      en: "Lambda runs the image that the customer deployed; it does not rebuild it from a newer base image."
      fr: "Lambda exécute l'image déployée par le client ; il ne la recrée pas à partir d'une image de base plus récente."
references:
  - title: Understanding how Lambda manages runtime updates
    url: https://docs.aws.amazon.com/lambda/latest/dg/runtimes-update.html
