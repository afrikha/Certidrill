id: clfc02-2d-service-security-chapter
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer wants to learn how to configure data protection, access control, and infrastructure security specifically for Amazon DynamoDB.

    Where will the developer find this information?
  fr: |
    Un développeur veut apprendre à configurer la protection des données, le contrôle d'accès et la sécurité de l'infrastructure spécifiquement pour Amazon DynamoDB.

    Où le développeur trouvera-t-il ces informations ?
body:
  options:
    - id: a
      text: { en: "In the AWS Security Bulletins", fr: "Dans les AWS Security Bulletins" }
    - id: b
      text: { en: "In the security chapter of the Amazon DynamoDB documentation", fr: "Dans le chapitre Sécurité de la documentation d'Amazon DynamoDB" }
    - id: c
      text: { en: "In the AWS Artifact reports that list Amazon DynamoDB as an in-scope service", fr: "Dans les rapports AWS Artifact qui listent Amazon DynamoDB comme service couvert" }
    - id: d
      text: { en: "In the AWS Trusted Advisor console", fr: "Dans la console AWS Trusted Advisor" }
answer: { optionId: b }
explanation:
  correct:
    en: "The documentation of AWS services includes a security chapter that explains how to apply the shared responsibility model to that service and how to configure it to meet security and compliance objectives, with topics such as data protection, IAM, and infrastructure security. The AWS Security Documentation page links to these chapters by product category."
    fr: "La documentation des services AWS comprend un chapitre Sécurité qui explique comment appliquer le modèle de responsabilité partagée à ce service et comment le configurer pour atteindre les objectifs de sécurité et de conformité, avec des rubriques comme la protection des données, IAM et la sécurité de l'infrastructure. La page AWS Security Documentation renvoie vers ces chapitres par catégorie de produits."
  options:
    a:
      en: "Security Bulletins announce vulnerabilities and the actions customers should take; they do not explain how to configure a service."
      fr: "Les Security Bulletins annoncent des vulnérabilités et les actions à entreprendre ; ils n'expliquent pas comment configurer un service."
    c:
      en: "AWS Artifact provides audit reports on AWS's own controls, not configuration guidance for customers."
      fr: "AWS Artifact fournit des rapports d'audit sur les contrôles d'AWS, pas des instructions de configuration pour les clients."
    d:
      en: "Trusted Advisor checks an account against best practices; it is not the documentation of how to configure DynamoDB security."
      fr: "Trusted Advisor vérifie un compte par rapport aux bonnes pratiques ; ce n'est pas la documentation de configuration de la sécurité de DynamoDB."
references:
  - title: "AWS Security Documentation"
    url: https://docs.aws.amazon.com/security/
  - title: "Security and compliance in Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/security.html
