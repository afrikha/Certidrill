id: clfc02-2d-access-analyzer-external
objective: "2.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to identify which of its Amazon S3 buckets and IAM roles are shared with principals outside its AWS account.

    Which AWS feature should the company use?
  fr: |
    Une entreprise veut identifier lesquels de ses compartiments S3 et de ses rôles IAM sont partagés avec des principaux extérieurs à son compte AWS.

    Quelle fonctionnalité AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
    - id: b
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: c
      text: { en: "Amazon Detective", fr: "Amazon Detective" }
    - id: d
      text: { en: "IAM Access Analyzer", fr: "IAM Access Analyzer" }
answer: { optionId: d }
explanation:
  correct:
    en: "IAM Access Analyzer analyzes resource-based policies and generates external access findings for resources, such as S3 buckets and IAM roles, that are shared with principals outside the zone of trust (the account or the organization). The company can then review and remove unintended access."
    fr: "IAM Access Analyzer analyse les politiques basées sur les ressources et génère des résultats d'accès externe pour les ressources, comme les compartiments S3 et les rôles IAM, qui sont partagées avec des principaux hors de la zone de confiance (le compte ou l'organisation). L'entreprise peut ensuite examiner et supprimer les accès non souhaités."
  options:
    a:
      en: "GuardDuty detects malicious activity; it does not list resources whose policies grant access to external principals."
      fr: "GuardDuty détecte les activités malveillantes ; il ne liste pas les ressources dont les politiques accordent l'accès à des principaux externes."
    b:
      en: "Amazon Inspector scans for software vulnerabilities and network exposure, not for resource sharing through policies."
      fr: "Amazon Inspector recherche des vulnérabilités logicielles et une exposition réseau, pas le partage de ressources par des politiques."
    c:
      en: "Detective investigates the root cause of findings; it does not analyze resource policies for external access."
      fr: "Detective enquête sur la cause première des résultats ; il n'analyse pas les politiques des ressources pour y trouver des accès externes."
references:
  - title: "Using AWS Identity and Access Management Access Analyzer"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
