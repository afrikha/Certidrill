id: clfc02-2c-root-task-billing-iam
objective: "2.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants some IAM users to view billing data in the Billing and Cost Management console. IAM access to this console has never been activated for the account. Who can activate it?
  fr: |
    Une entreprise veut que certains utilisateurs IAM consultent les données de facturation dans la console Billing and Cost Management. L'accès IAM à cette console n'a jamais été activé pour le compte. Qui peut l'activer ?
body:
  options:
    - { id: a, text: { en: "The root user of the AWS account", fr: "L'utilisateur racine du compte AWS" } }
    - { id: b, text: { en: "An IAM user with the AdministratorAccess policy", fr: "Un utilisateur IAM doté de la politique AdministratorAccess" } }
    - { id: c, text: { en: "AWS Support, at the company's request", fr: "AWS Support, à la demande de l'entreprise" } }
    - { id: d, text: { en: "An IAM user with the Billing job function policy", fr: "Un utilisateur IAM doté de la politique de fonction Billing" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Activating IAM access to the Billing and Cost Management console is a root user task. Until it is activated, IAM users and roles cannot reach the billing pages, even if their policies allow billing actions."
    fr: "L'activation de l'accès IAM à la console Billing and Cost Management est une tâche de l'utilisateur racine. Tant qu'il n'est pas activé, les utilisateurs et rôles IAM ne peuvent pas accéder aux pages de facturation, même si leurs politiques autorisent les actions de facturation."
  options:
    b:
      en: "AdministratorAccess does not replace the root user for this task; IAM access to billing must first be activated by the root user."
      fr: "AdministratorAccess ne remplace pas l'utilisateur racine pour cette tâche ; l'accès IAM à la facturation doit d'abord être activé par l'utilisateur racine."
    c:
      en: "AWS Support does not change this setting for customers; the account's root user must activate it."
      fr: "AWS Support ne modifie pas ce paramètre pour les clients ; l'utilisateur racine du compte doit l'activer."
    d:
      en: "A billing policy grants billing permissions, but they take effect only after the root user activates IAM access."
      fr: "Une politique de facturation accorde des autorisations de facturation, mais elles ne s'appliquent qu'une fois l'accès IAM activé par l'utilisateur racine."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
