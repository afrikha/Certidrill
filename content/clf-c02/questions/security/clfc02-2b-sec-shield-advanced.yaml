id: clfc02-2b-sec-shield-advanced
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a business-critical application behind Amazon CloudFront and an Application Load Balancer. AWS Shield Standard already protects it. The company now wants additional detection and mitigation for large DDoS attacks and protection against extra charges when its resources scale out during an attack.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application critique derrière Amazon CloudFront et un Application Load Balancer. AWS Shield Standard la protège déjà. L'entreprise veut maintenant une détection et une atténuation supplémentaires pour les attaques DDoS de grande ampleur, ainsi qu'une protection contre les frais supplémentaires lorsque ses ressources montent en charge pendant une attaque.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Subscribe to AWS Shield Advanced and protect the CloudFront distribution and the load balancer.", fr: "Souscrire à AWS Shield Advanced et protéger la distribution CloudFront et l'équilibreur de charge." }
    - id: b
      text: { en: "Enable Amazon GuardDuty in the account and send its findings to the security team.", fr: "Activer Amazon GuardDuty dans le compte et envoyer ses résultats à l'équipe de sécurité." }
    - id: c
      text: { en: "Keep AWS Shield Standard and set AWS Budgets alerts on CloudFront and load balancer costs.", fr: "Conserver AWS Shield Standard et définir des alertes AWS Budgets sur les coûts de CloudFront et de l'équilibreur de charge." }
    - id: d
      text: { en: "Add AWS WAF rate-based rules to the CloudFront distribution and the load balancer.", fr: "Ajouter des règles AWS WAF basées sur le débit à la distribution CloudFront et à l'équilibreur de charge." }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Shield Advanced is a paid subscription that expands DDoS protection for the resources added to it, such as CloudFront distributions and load balancers, for example with automatic application layer DDoS mitigation. It also offers DDoS cost protection: spikes in the bill caused by an attack on protected resources can be covered with Shield Advanced service credits."
    fr: "AWS Shield Advanced est un abonnement payant qui étend la protection DDoS des ressources qui lui sont ajoutées, comme les distributions CloudFront et les équilibreurs de charge, par exemple avec l'atténuation automatique des attaques DDoS de la couche application. Il offre aussi la protection des coûts DDoS : les pics de facturation dus à une attaque contre des ressources protégées peuvent être couverts par des crédits de service Shield Advanced."
  options:
    b:
      en: "GuardDuty detects threats in account activity; it does not mitigate DDoS attacks or cover scaling charges."
      fr: "GuardDuty détecte les menaces dans l'activité du compte ; il n'atténue pas les attaques DDoS et ne couvre pas les frais de montée en charge."
    c:
      en: "Budgets alerts only notify about costs; Shield Standard offers neither the enhanced protections nor cost protection."
      fr: "Les alertes Budgets ne font que signaler les coûts ; Shield Standard n'offre ni les protections renforcées ni la protection des coûts."
    d:
      en: "Rate-based rules can limit request floods, but AWS WAF does not provide DDoS cost protection."
      fr: "Les règles basées sur le débit peuvent limiter les afflux de requêtes, mais AWS WAF n'offre pas de protection des coûts DDoS."
references:
  - title: "AWS Shield Advanced overview"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-advanced-summary.html
  - title: "AWS Shield Advanced capabilities and options"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-advanced-summary-capabilities.html
