id: clfc02-2c-xacct-role
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers in AWS account A need to manage resources in AWS account B. The company does not want to create IAM users for them in account B. What should the company do?
  fr: |
    Des développeurs du compte AWS A doivent gérer des ressources dans le compte AWS B. L'entreprise ne veut pas leur créer d'utilisateurs IAM dans le compte B. Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Create an IAM user group that contains users from both accounts and attach a policy to it.", fr: "Créer un groupe d'utilisateurs IAM qui contient des utilisateurs des deux comptes et lui attacher une politique." } }
    - { id: b, text: { en: "Create an IAM role in account B that trusts account A, and let the developers assume it.", fr: "Créer dans le compte B un rôle IAM qui approuve le compte A, et laisser les développeurs l'endosser." } }
    - { id: c, text: { en: "Share the access keys of an administrator IAM user of account B with the developers.", fr: "Partager avec les développeurs les clés d'accès d'un utilisateur IAM administrateur du compte B." } }
    - { id: d, text: { en: "Give the developers the root user credentials of account B, protected with MFA.", fr: "Donner aux développeurs les informations d'identification racine du compte B, protégées par la MFA." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A cross-account IAM role in account B has a trust policy that names account A and a permissions policy for the needed resources. Developers in account A who are allowed sts:AssumeRole switch to the role and receive temporary credentials, so no IAM users are created in account B."
    fr: "Un rôle IAM inter-comptes dans le compte B possède une politique d'approbation qui désigne le compte A et une politique d'autorisations pour les ressources nécessaires. Les développeurs du compte A autorisés à effectuer sts:AssumeRole basculent vers le rôle et reçoivent des informations d'identification temporaires : aucun utilisateur IAM n'est créé dans le compte B."
  options:
    a:
      en: "An IAM user group exists in one account and can contain only users of that account."
      fr: "Un groupe d'utilisateurs IAM existe dans un seul compte et ne peut contenir que des utilisateurs de ce compte."
    c:
      en: "Sharing long-term access keys breaks accountability and least privilege, and it still relies on an IAM user in account B."
      fr: "Partager des clés d'accès à long terme nuit à la traçabilité et au moindre privilège, et repose toujours sur un utilisateur IAM du compte B."
    d:
      en: "Root user credentials give full access to account B and must never be shared for routine work."
      fr: "Les informations d'identification racine donnent un accès complet au compte B et ne doivent jamais être partagées pour le travail courant."
references:
  - title: "IAM tutorial: Delegate access across AWS accounts using IAM roles"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html
