id: clfc02-2b-cinfo-artifact-definition
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes AWS Artifact?
  fr: |
    Quelle affirmation décrit AWS Artifact ?
body:
  options:
    - id: a
      text: { en: "A service that collects security findings from several AWS services in one place.", fr: "Un service qui rassemble à un seul endroit les résultats de sécurité de plusieurs services AWS." }
    - id: b
      text: { en: "A portal that gives on-demand access to AWS security and compliance reports and to select online agreements.", fr: "Un portail qui donne un accès à la demande aux rapports de sécurité et de conformité d'AWS et à certains accords en ligne." }
    - id: c
      text: { en: "A service that records the configuration of AWS resources and evaluates it against rules.", fr: "Un service qui enregistre la configuration des ressources AWS et l'évalue par rapport à des règles." }
    - id: d
      text: { en: "A service that scans workloads for software vulnerabilities and unintended network exposure.", fr: "Un service qui analyse les charges de travail à la recherche de vulnérabilités logicielles et d'expositions réseau involontaires." }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Artifact is the central resource for AWS compliance information: it provides AWS security and compliance reports, such as ISO certifications and SOC reports, and lets customers review and accept agreements with AWS."
    fr: "AWS Artifact est la ressource centrale pour les informations de conformité d'AWS : il fournit les rapports de sécurité et de conformité d'AWS, comme les certifications ISO et les rapports SOC, et permet aux clients de consulter et d'accepter des accords avec AWS."
  options:
    a:
      en: "This describes AWS Security Hub CSPM."
      fr: "Cette description correspond à AWS Security Hub CSPM."
    c:
      en: "This describes AWS Config."
      fr: "Cette description correspond à AWS Config."
    d:
      en: "This describes Amazon Inspector."
      fr: "Cette description correspond à Amazon Inspector."
references:
  - title: "What is AWS Artifact?"
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
