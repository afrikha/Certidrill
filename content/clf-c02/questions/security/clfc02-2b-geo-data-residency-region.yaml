id: clfc02-2b-geo-data-residency-region
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Canadian company must keep its customer data in Canada to comply with a data residency law.

    How can the company meet this requirement on AWS?
  fr: |
    Une entreprise canadienne doit conserver les données de ses clients au Canada pour respecter une loi sur la résidence des données.

    Comment l'entreprise peut-elle répondre à cette exigence sur AWS ?
body:
  options:
    - id: a
      text: { en: "Serve the data through Amazon CloudFront edge locations in Canada.", fr: "Distribuer les données par des emplacements périphériques Amazon CloudFront situés au Canada." }
    - id: b
      text: { en: "Enable AWS Shield Advanced on the resources that store the data.", fr: "Activer AWS Shield Advanced sur les ressources qui stockent les données." }
    - id: c
      text: { en: "Spread the data across several Availability Zones of the closest US Region.", fr: "Répartir les données entre plusieurs zones de disponibilité de la Région américaine la plus proche." }
    - id: d
      text: { en: "Store the data only in AWS Regions that are located in Canada.", fr: "Stocker les données uniquement dans des Régions AWS situées au Canada." }
answer: { optionId: d }
explanation:
  correct:
    en: "Customers choose the AWS Regions where their content is stored, and AWS does not move or replicate customer content outside the chosen Regions without the customer's agreement. Using only Regions in Canada keeps the data in the country."
    fr: "Les clients choisissent les Régions AWS dans lesquelles leur contenu est stocké, et AWS ne déplace ni ne réplique le contenu des clients en dehors des Régions choisies sans leur accord. N'utiliser que des Régions situées au Canada maintient les données dans le pays."
  options:
    a:
      en: "Edge locations cache content close to users; the data itself still comes from an origin that could be outside Canada."
      fr: "Les emplacements périphériques mettent le contenu en cache près des utilisateurs ; les données proviennent toujours d'une origine qui pourrait être hors du Canada."
    b:
      en: "Shield Advanced protects against DDoS attacks; it does not control where the data is stored."
      fr: "Shield Advanced protège contre les attaques DDoS ; il ne contrôle pas l'emplacement de stockage des données."
    c:
      en: "Availability Zones belong to a Region; all Availability Zones of a US Region are in the United States."
      fr: "Les zones de disponibilité appartiennent à une Région ; toutes les zones de disponibilité d'une Région américaine sont aux États-Unis."
references:
  - title: "Data Privacy"
    url: https://aws.amazon.com/compliance/data-privacy-faq/
