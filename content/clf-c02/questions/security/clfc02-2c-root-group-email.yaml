id: clfc02-2c-root-group-email
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An employee created a company's AWS account with a personal mailbox as the root user email address. The employee is leaving the company. What is the main risk of keeping this email address for the root user?
  fr: |
    Un employé a créé le compte AWS d'une entreprise avec une boîte aux lettres personnelle comme adresse e-mail de l'utilisateur racine. L'employé quitte l'entreprise. Quel est le principal risque à conserver cette adresse e-mail pour l'utilisateur racine ?
body:
  options:
    - { id: a, text: { en: "AWS charges an additional fee for accounts whose root email address is a personal mailbox.", fr: "AWS facture des frais supplémentaires pour les comptes dont l'adresse e-mail racine est une boîte personnelle." } }
    - { id: b, text: { en: "The root user cannot enable MFA while its email address belongs to a personal mailbox.", fr: "L'utilisateur racine ne peut pas activer la MFA tant que son adresse e-mail est une boîte personnelle." } }
    - { id: c, text: { en: "IAM users cannot sign in to the account while the root email address is a personal mailbox.", fr: "Les utilisateurs IAM ne peuvent pas se connecter au compte tant que l'adresse e-mail racine est une boîte personnelle." } }
    - { id: d, text: { en: "The company might be unable to receive AWS notifications or to reset the root user password.", fr: "L'entreprise risque de ne plus recevoir les notifications AWS ni de pouvoir réinitialiser le mot de passe racine." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS uses the root user email address to reach the account owner, and access to that inbox is needed to reset a lost root password. AWS recommends a business-managed email address that forwards to a group, so that the company keeps control even when individuals leave."
    fr: "AWS utilise l'adresse e-mail de l'utilisateur racine pour joindre le propriétaire du compte, et l'accès à cette boîte est nécessaire pour réinitialiser un mot de passe racine perdu. AWS recommande une adresse e-mail gérée par l'entreprise et redirigée vers un groupe, afin que l'entreprise garde le contrôle même quand des personnes partent."
  options:
    a:
      en: "AWS pricing does not depend on the type of email address used for the root user."
      fr: "La tarification AWS ne dépend pas du type d'adresse e-mail utilisée pour l'utilisateur racine."
    b:
      en: "MFA can be registered for the root user whatever its email address; the risk is losing account recovery and contact."
      fr: "La MFA peut être enregistrée pour l'utilisateur racine quelle que soit son adresse e-mail ; le risque est de perdre la récupération et le contact du compte."
    c:
      en: "IAM users sign in with their own credentials; the root email address does not affect their sign-in."
      fr: "Les utilisateurs IAM se connectent avec leurs propres informations d'identification ; l'adresse e-mail racine n'a pas d'effet sur leur connexion."
references:
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
