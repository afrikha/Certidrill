id: clfc02-2a-comp-shared-control-definition
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The AWS shared responsibility model describes inherited, shared, and customer-specific controls. What is a shared control?
  fr: |
    Le modèle de responsabilité partagée AWS décrit des contrôles hérités, partagés et spécifiques au client. Qu'est-ce qu'un contrôle partagé ?
body:
  options:
    - id: a
      text: { en: "A control that the customer fully inherits from AWS without any action on its part.", fr: "Un contrôle que le client hérite entièrement d'AWS sans aucune action de sa part." }
    - id: b
      text: { en: "A control that the customer alone implements, based on the applications it deploys.", fr: "Un contrôle que le client met en œuvre seul, en fonction des applications qu'il déploie." }
    - id: c
      text: { en: "A control that AWS implements for the customer inside the customer's guest operating system.", fr: "Un contrôle qu'AWS met en œuvre pour le client dans le système d'exploitation invité du client." }
    - id: d
      text: { en: "A control that AWS applies to its infrastructure and that the customer applies to its own use of AWS.", fr: "Un contrôle qu'AWS applique à son infrastructure et que le client applique à sa propre utilisation d'AWS." }
answer: { optionId: d }
explanation:
  correct:
    en: "For a shared control, AWS provides the requirements for the infrastructure and the customer provides its own control implementation within its use of AWS services. Patch management, configuration management, and awareness and training are the examples AWS gives."
    fr: "Pour un contrôle partagé, AWS fournit les exigences pour l'infrastructure et le client fournit sa propre mise en œuvre du contrôle dans son utilisation des services AWS. La gestion des correctifs, la gestion de la configuration ainsi que la sensibilisation et la formation sont les exemples donnés par AWS."
  options:
    a:
      en: "This describes an inherited control, such as physical and environmental controls."
      fr: "Cela décrit un contrôle hérité, comme les contrôles physiques et environnementaux."
    b:
      en: "This describes a customer-specific control, such as zone security."
      fr: "Cela décrit un contrôle spécifique au client, comme la sécurité des zones."
    c:
      en: "AWS does not manage the customer's guest operating system; that is the customer's part of shared controls such as patching."
      fr: "AWS ne gère pas le système d'exploitation invité du client ; c'est la part du client dans des contrôles partagés comme les correctifs."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
