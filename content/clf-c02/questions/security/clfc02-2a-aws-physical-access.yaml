id: clfc02-2a-aws-physical-access
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which task is AWS's responsibility under the AWS shared responsibility model?
  fr: |
    Quelle tâche relève de la responsabilité d'AWS selon le modèle de responsabilité partagée AWS ?
body:
  options:
    - id: a
      text: { en: "Configuring the security groups of customer instances", fr: "Configurer les groupes de sécurité des instances des clients" }
    - id: b
      text: { en: "Managing the IAM users of customer accounts", fr: "Gérer les utilisateurs IAM des comptes des clients" }
    - id: c
      text: { en: "Patching the guest operating system of EC2 instances", fr: "Appliquer les correctifs au système d'exploitation invité des instances EC2" }
    - id: d
      text: { en: "Controlling physical access to AWS data centers", fr: "Contrôler l'accès physique aux centres de données AWS" }
answer: { optionId: d }
explanation:
  correct:
    en: "Physical security of the facilities is part of security of the cloud. AWS gives data center access only to approved employees, and physical access is logged, monitored, and retained."
    fr: "La sécurité physique des installations fait partie de la sécurité du cloud. AWS ne donne accès aux centres de données qu'aux employés approuvés, et l'accès physique est journalisé, surveillé et conservé."
  options:
    a:
      en: "AWS provides security groups, but the customer configures their rules."
      fr: "AWS fournit les groupes de sécurité, mais c'est le client qui configure leurs règles."
    b:
      en: "Identity and access management inside an account is the customer's responsibility."
      fr: "La gestion des identités et des accès dans un compte est de la responsabilité du client."
    c:
      en: "On Amazon EC2, the customer manages the guest operating system, including security patches."
      fr: "Sur Amazon EC2, le client gère le système d'exploitation invité, y compris les correctifs de sécurité."
references:
  - title: Data Center - Our Controls
    url: https://aws.amazon.com/compliance/data-center/controls/
