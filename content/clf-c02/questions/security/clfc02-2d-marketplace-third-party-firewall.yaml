id: clfc02-2d-marketplace-third-party-firewall
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses a next-generation firewall from a third-party security vendor in its on-premises data center. The company wants to find, buy, and deploy the same vendor's firewall on AWS.

    Where can the company do this?
  fr: |
    Une entreprise utilise dans son centre de données sur site un pare-feu de nouvelle génération d'un éditeur de sécurité tiers. Elle veut trouver, acheter et déployer le pare-feu du même éditeur sur AWS.

    Où l'entreprise peut-elle le faire ?
body:
  options:
    - id: a
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: b
      text: { en: "AWS Firewall Manager", fr: "AWS Firewall Manager" }
    - id: c
      text: { en: "AWS Security Hub", fr: "AWS Security Hub" }
    - id: d
      text: { en: "AWS Marketplace", fr: "AWS Marketplace" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Marketplace is a curated digital catalog where customers find, buy, deploy, and manage third-party software, including security products such as firewalls, endpoint protection, and SIEM tools. Products can be delivered as Amazon Machine Images (AMIs), SaaS offerings, and other formats."
    fr: "AWS Marketplace est un catalogue numérique organisé où les clients trouvent, achètent, déploient et gèrent des logiciels tiers, y compris des produits de sécurité comme des pare-feu, des solutions de protection des points de terminaison et des outils SIEM. Les produits peuvent être fournis sous forme d'Amazon Machine Images (AMI), d'offres SaaS et d'autres formats."
  options:
    a:
      en: "AWS Artifact provides AWS compliance reports and agreements; it does not sell software."
      fr: "AWS Artifact fournit les rapports de conformité et les accords d'AWS ; il ne vend pas de logiciels."
    b:
      en: "Firewall Manager centrally manages firewall policies across accounts; it is not where customers buy vendor products."
      fr: "Firewall Manager gère de façon centralisée les politiques de pare-feu de plusieurs comptes ; ce n'est pas l'endroit où les clients achètent des produits d'éditeurs."
    c:
      en: "Security Hub collects security findings and checks security posture; it does not sell third-party software."
      fr: "Security Hub collecte les résultats de sécurité et vérifie la posture de sécurité ; il ne vend pas de logiciels tiers."
references:
  - title: "What is AWS Marketplace?"
    url: https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html
  - title: "Cloud Security Software | AWS Marketplace"
    url: https://aws.amazon.com/marketplace/solutions/security
