id: clfc02-2c-root-srm-customer
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Under the AWS shared responsibility model, who is responsible for protecting the credentials of the AWS account root user?
  fr: |
    Selon le modèle de responsabilité partagée AWS, qui est responsable de la protection des informations d'identification de l'utilisateur racine du compte AWS ?
body:
  options:
    - { id: a, text: { en: "AWS, because AWS creates the root user when the account is opened.", fr: "AWS, car AWS crée l'utilisateur racine à l'ouverture du compte." } }
    - { id: b, text: { en: "AWS Support, which keeps a copy of the root password for recovery.", fr: "AWS Support, qui conserve une copie du mot de passe racine pour la récupération." } }
    - { id: c, text: { en: "The customer, who owns the account and controls its credentials.", fr: "Le client, qui possède le compte et contrôle ses informations d'identification." } }
    - { id: d, text: { en: "AWS and the customer equally, by sharing the root password.", fr: "AWS et le client à parts égales, en partageant le mot de passe racine." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Identity and access management, including the root user credentials, is part of security in the cloud, which is the customer's responsibility. The customer must choose a strong password, enable MFA, avoid root access keys and control who can reach the credentials."
    fr: "La gestion des identités et des accès, y compris les informations d'identification de l'utilisateur racine, relève de la sécurité dans le cloud, qui est de la responsabilité du client. Le client doit choisir un mot de passe fort, activer la MFA, éviter les clés d'accès racine et contrôler qui peut accéder aux informations d'identification."
  options:
    a:
      en: "AWS secures the infrastructure of the cloud; the credentials that the customer sets and uses are the customer's responsibility."
      fr: "AWS sécurise l'infrastructure du cloud ; les informations d'identification que le client définit et utilise relèvent de sa responsabilité."
    b:
      en: "AWS Support does not keep root passwords; recovery relies on the root email inbox and the registered phone number."
      fr: "AWS Support ne conserve pas les mots de passe racine ; la récupération repose sur la boîte e-mail racine et le numéro de téléphone enregistré."
    d:
      en: "AWS never shares or needs the root password; protecting it is entirely the customer's job."
      fr: "AWS ne partage jamais le mot de passe racine et n'en a pas besoin ; sa protection incombe entièrement au client."
references:
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
