id: clfc02-2b-cinfo-third-party-reports
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company buys a software product from an independent software vendor (ISV) in AWS Marketplace. The company's compliance team needs the security and compliance reports that the ISV has published for this product.

    Where can the team find these reports?
  fr: |
    Une entreprise achète un produit logiciel à un éditeur de logiciels indépendant (ISV) dans AWS Marketplace. L'équipe de conformité de l'entreprise a besoin des rapports de sécurité et de conformité que l'ISV a publiés pour ce produit.

    Où l'équipe peut-elle trouver ces rapports ?
body:
  options:
    - id: a
      text: { en: "In the third-party reports of AWS Artifact", fr: "Dans les rapports tiers d'AWS Artifact" }
    - id: b
      text: { en: "On the AWS Services in Scope by Compliance Program page", fr: "Sur la page AWS Services in Scope by Compliance Program" }
    - id: c
      text: { en: "In the security checks of AWS Trusted Advisor", fr: "Dans les vérifications de sécurité d'AWS Trusted Advisor" }
    - id: d
      text: { en: "In the compliance standards of AWS Security Hub CSPM", fr: "Dans les normes de conformité d'AWS Security Hub CSPM" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Artifact also provides third-party reports: compliance reports that independent software vendors who sell in AWS Marketplace publish for their products. Customers download them from AWS Artifact like the AWS reports."
    fr: "AWS Artifact fournit aussi des rapports tiers : des rapports de conformité que les éditeurs de logiciels indépendants qui vendent dans AWS Marketplace publient pour leurs produits. Les clients les téléchargent depuis AWS Artifact comme les rapports d'AWS."
  options:
    b:
      en: "This page lists which AWS services are covered by each AWS compliance program; it does not contain ISV reports."
      fr: "Cette page indique quels services AWS sont couverts par chaque programme de conformité d'AWS ; elle ne contient pas de rapports d'ISV."
    c:
      en: "Trusted Advisor checks the company's account for best practices; it does not provide vendor compliance reports."
      fr: "Trusted Advisor vérifie les bonnes pratiques du compte de l'entreprise ; il ne fournit pas de rapports de conformité d'éditeurs."
    d:
      en: "Security Hub CSPM checks the company's own resources against standards; it does not publish vendor reports."
      fr: "Security Hub CSPM vérifie les ressources de l'entreprise par rapport à des normes ; il ne publie pas de rapports d'éditeurs."
references:
  - title: "What is AWS Artifact?"
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
