id: clfc02-2d-s3-default-encryption
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uploads new objects to an Amazon S3 general purpose bucket. The company did not change any encryption setting on the bucket.

    Which statement describes how the new objects are protected at rest?
  fr: |
    Une entreprise charge de nouveaux objets dans un compartiment S3 à usage général. Elle n'a modifié aucun paramètre de chiffrement du compartiment.

    Quelle affirmation décrit la protection des nouveaux objets au repos ?
body:
  options:
    - id: a
      text: { en: "The objects are stored unencrypted until the company enables default encryption on the bucket.", fr: "Les objets sont stockés sans chiffrement tant que l'entreprise n'active pas le chiffrement par défaut du compartiment." }
    - id: b
      text: { en: "The objects are encrypted only if the company enables Amazon Macie for the bucket.", fr: "Les objets sont chiffrés uniquement si l'entreprise active Amazon Macie pour le compartiment." }
    - id: c
      text: { en: "The objects are encrypted only if the company provides its own keys with each request.", fr: "Les objets sont chiffrés uniquement si l'entreprise fournit ses propres clés avec chaque requête." }
    - id: d
      text: { en: "Amazon S3 automatically encrypts the objects with server-side encryption using S3 managed keys (SSE-S3).", fr: "Amazon S3 chiffre automatiquement les objets par chiffrement côté serveur avec des clés gérées par S3 (SSE-S3)." }
answer: { optionId: d }
explanation:
  correct:
    en: "All S3 buckets have encryption configured by default, and Amazon S3 applies server-side encryption with Amazon S3 managed keys (SSE-S3) to every new object that has no other encryption setting. The encryption is automatic and at no additional cost."
    fr: "Tous les compartiments S3 ont un chiffrement configuré par défaut : Amazon S3 applique le chiffrement côté serveur avec des clés gérées par Amazon S3 (SSE-S3) à chaque nouvel objet qui n'a pas d'autre paramètre de chiffrement. Ce chiffrement est automatique et sans coût supplémentaire."
  options:
    a:
      en: "Default encryption with SSE-S3 is already applied to all buckets; the company can change the default type, but objects are not stored unencrypted."
      fr: "Le chiffrement par défaut avec SSE-S3 est déjà appliqué à tous les compartiments ; l'entreprise peut changer le type par défaut, mais les objets ne sont pas stockés sans chiffrement."
    b:
      en: "Macie discovers sensitive data and evaluates bucket security; it does not encrypt objects."
      fr: "Macie découvre les données sensibles et évalue la sécurité des compartiments ; il ne chiffre pas les objets."
    c:
      en: "Customer-provided keys (SSE-C) are one option, but they are not required: S3 encrypts new objects with SSE-S3 by default."
      fr: "Les clés fournies par le client (SSE-C) sont une option, mais elles ne sont pas obligatoires : S3 chiffre les nouveaux objets avec SSE-S3 par défaut."
references:
  - title: "Setting default server-side encryption behavior for Amazon S3 buckets"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-encryption.html
