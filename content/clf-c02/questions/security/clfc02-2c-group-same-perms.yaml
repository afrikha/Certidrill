id: clfc02-2c-group-same-perms
objective: "2.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Twenty developers need the same permissions in an AWS account. The administrator wants the simplest way to manage these permissions as developers join and leave the team. What should the administrator do?
  fr: |
    Vingt développeurs ont besoin des mêmes autorisations dans un compte AWS. L'administrateur veut la manière la plus simple de gérer ces autorisations au gré des arrivées et des départs. Que doit faire l'administrateur ?
body:
  options:
    - { id: a, text: { en: "Attach an inline policy with the permissions to each developer's IAM user.", fr: "Attacher une politique en ligne avec les autorisations à l'utilisateur IAM de chaque développeur." } }
    - { id: b, text: { en: "Create one IAM user for the team and share its password with all developers.", fr: "Créer un seul utilisateur IAM pour l'équipe et partager son mot de passe avec tous les développeurs." } }
    - { id: c, text: { en: "Give the developers the root user credentials and enable MFA for the root user.", fr: "Donner aux développeurs les informations d'identification racine et activer la MFA pour l'utilisateur racine." } }
    - { id: d, text: { en: "Create an IAM user group, attach a policy to it, and add the developers to it.", fr: "Créer un groupe d'utilisateurs IAM, lui attacher une politique et y ajouter les développeurs." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Permissions attached to an IAM user group apply to every member. New developers are simply added to the group, and developers who leave or change roles are removed, without editing individual permissions."
    fr: "Les autorisations attachées à un groupe d'utilisateurs IAM s'appliquent à chaque membre. Il suffit d'ajouter les nouveaux développeurs au groupe et d'en retirer ceux qui partent ou changent de fonction, sans modifier d'autorisations individuelles."
  options:
    a:
      en: "Inline policies are copied for each user, so every change must be repeated 20 times."
      fr: "Les politiques en ligne sont dupliquées pour chaque utilisateur : chaque modification doit être répétée 20 fois."
    b:
      en: "A shared IAM user removes individual accountability and forces a password change each time someone leaves."
      fr: "Un utilisateur IAM partagé supprime la traçabilité individuelle et oblige à changer le mot de passe à chaque départ."
    c:
      en: "The root user has full access to the account and must not be used or shared for daily work."
      fr: "L'utilisateur racine a un accès complet au compte et ne doit être ni utilisé ni partagé pour le travail quotidien."
references:
  - title: IAM user groups
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_groups.html
