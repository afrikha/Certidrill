id: clfc02-2a-benefit-inherit-physical
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup does not want to build and staff its own secure data center. Which security benefit does the startup get by running its workloads on AWS?
  fr: |
    Une startup ne veut pas construire ni doter en personnel son propre centre de données sécurisé. Quel avantage de sécurité la startup obtient-elle en exécutant ses charges de travail sur AWS ?
body:
  options:
    - id: a
      text: { en: "AWS removes any need for the startup to manage access to its data.", fr: "AWS supprime tout besoin pour la startup de gérer l'accès à ses données." }
    - id: b
      text: { en: "The startup gets dedicated AWS guards for its own servers.", fr: "La startup obtient des gardes AWS dédiés pour ses propres serveurs." }
    - id: c
      text: { en: "AWS guarantees that the startup's code has no vulnerabilities.", fr: "AWS garantit que le code de la startup ne présente aucune vulnérabilité." }
    - id: d
      text: { en: "The startup inherits the physical security controls of AWS data centers.", fr: "La startup hérite des contrôles de sécurité physique des centres de données AWS." }
answer: { optionId: d }
explanation:
  correct:
    en: "Physical and environmental controls are inherited from AWS. AWS limits data center access to approved employees on a least-privilege, time-bound basis, and Security Operations Centers monitor access 24/7, so the startup does not build these controls itself."
    fr: "Les contrôles physiques et environnementaux sont hérités d'AWS. AWS limite l'accès aux centres de données aux employés approuvés, selon le moindre privilège et pour une durée limitée, et des centres d'opérations de sécurité surveillent l'accès 24 h/24 et 7 j/7 : la startup n'a donc pas à construire ces contrôles elle-même."
  options:
    a:
      en: "Managing who can access its data stays the customer's responsibility in every service."
      fr: "Gérer qui peut accéder à ses données reste de la responsabilité du client dans chaque service."
    b:
      en: "Customers do not get dedicated guards; they benefit from the same data center controls that AWS applies to its facilities."
      fr: "Les clients n'obtiennent pas de gardes dédiés ; ils profitent des mêmes contrôles qu'AWS applique à ses installations."
    c:
      en: "Application code is the customer's responsibility; AWS secures the infrastructure, not the customer's code."
      fr: "Le code des applications est de la responsabilité du client ; AWS sécurise l'infrastructure, pas le code du client."
references:
  - title: Data Center - Our Controls
    url: https://aws.amazon.com/compliance/data-center/controls/
