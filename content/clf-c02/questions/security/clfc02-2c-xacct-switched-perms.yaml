id: clfc02-2c-xacct-switched-perms
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An IAM user in one AWS account switches to an IAM role in another AWS account by using the AWS Management Console. Which statement is true while the user works in the role?
  fr: |
    Un utilisateur IAM d'un compte AWS bascule vers un rôle IAM d'un autre compte AWS à l'aide de l'AWS Management Console. Quelle affirmation est vraie pendant que l'utilisateur travaille avec le rôle ?
body:
  options:
    - { id: a, text: { en: "The user has only the permissions of the role until the user switches back.", fr: "L'utilisateur n'a que les autorisations du rôle jusqu'à ce qu'il revienne à son identité." } }
    - { id: b, text: { en: "The user has the combined permissions of the IAM user and of the role.", fr: "L'utilisateur dispose des autorisations cumulées de l'utilisateur IAM et du rôle." } }
    - { id: c, text: { en: "The user receives long-term access keys of the role that never expire.", fr: "L'utilisateur reçoit des clés d'accès à long terme du rôle qui n'expirent jamais." } }
    - { id: d, text: { en: "The root user of the first account could switch to the role in the same way.", fr: "L'utilisateur racine du premier compte pourrait basculer vers le rôle de la même façon." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Only one set of permissions is active at a time: after switching, the user has the role's permissions and not those of the IAM user, until the user switches back. The role provides temporary credentials that expire."
    fr: "Un seul ensemble d'autorisations est actif à la fois : après le basculement, l'utilisateur a les autorisations du rôle et non celles de l'utilisateur IAM, jusqu'à son retour. Le rôle fournit des informations d'identification temporaires qui expirent."
  options:
    b:
      en: "Permissions are not combined; the original IAM user permissions are not in effect while the role is used."
      fr: "Les autorisations ne se cumulent pas ; celles de l'utilisateur IAM d'origine ne s'appliquent pas pendant l'utilisation du rôle."
    c:
      en: "Assuming a role returns temporary credentials with an expiration time, not long-term access keys."
      fr: "Endosser un rôle renvoie des informations d'identification temporaires avec une date d'expiration, pas des clés d'accès à long terme."
    d:
      en: "The root user cannot switch roles."
      fr: "L'utilisateur racine ne peut pas basculer vers un rôle."
references:
  - title: "IAM tutorial: Delegate access across AWS accounts using IAM roles"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html
