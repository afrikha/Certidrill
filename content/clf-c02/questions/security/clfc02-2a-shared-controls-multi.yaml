id: clfc02-2a-shared-controls-multi
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which controls are shared between AWS and the customer in the AWS shared responsibility model? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels contrôles sont partagés entre AWS et le client dans le modèle de responsabilité partagée AWS ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Physical and environmental protection", fr: "La protection physique et environnementale" } }
    - { id: b, text: { en: "Patch management", fr: "La gestion des correctifs" } }
    - { id: c, text: { en: "Zone security of the customer's data", fr: "La sécurité des zones des données du client" } }
    - { id: d, text: { en: "Decommissioning of storage media", fr: "La mise hors service des supports de stockage" } }
    - { id: e, text: { en: "Configuration management", fr: "La gestion de la configuration" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Shared controls apply to both the infrastructure layer and the customer layers, in separate contexts. Patch management and configuration management are shared: AWS patches and configures its infrastructure, and the customer patches and configures its guest operating systems, databases, and applications."
    fr: "Les contrôles partagés s'appliquent à la fois à la couche d'infrastructure et aux couches du client, dans des contextes distincts. La gestion des correctifs et la gestion de la configuration sont partagées : AWS corrige et configure son infrastructure, et le client corrige et configure ses systèmes d'exploitation invités, ses bases de données et ses applications."
  options:
    a:
      en: "Physical and environmental controls are inherited controls, fully provided by AWS."
      fr: "Les contrôles physiques et environnementaux sont des contrôles hérités, entièrement fournis par AWS."
    c:
      en: "Zone security is a customer-specific control, based on the applications the customer deploys."
      fr: "La sécurité des zones est un contrôle spécifique au client, en fonction des applications qu'il déploie."
    d:
      en: "Media decommissioning is part of the infrastructure that AWS secures; the customer does not handle AWS storage media."
      fr: "La mise hors service des supports fait partie de l'infrastructure sécurisée par AWS ; le client ne manipule pas les supports de stockage AWS."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
