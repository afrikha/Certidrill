id: clfc02-2c-idc-purpose
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 15 AWS accounts in AWS Organizations. It wants its employees to sign in once and then access the AWS accounts and applications assigned to them. Which AWS service will meet this requirement?
  fr: |
    Une entreprise dispose de 15 comptes AWS dans AWS Organizations. Elle veut que ses employés se connectent une seule fois, puis accèdent aux comptes AWS et aux applications qui leur sont attribués. Quel service AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "Amazon Cognito" }
    - { id: b, text: "AWS IAM Identity Center" }
    - { id: c, text: "AWS Secrets Manager" }
    - { id: d, text: "AWS Directory Service" }
answer: { optionId: b }
explanation:
  correct:
    en: "IAM Identity Center gives workforce users single sign-on to the AWS accounts of an organization and to assigned applications. Users sign in once and see their assignments in the AWS access portal."
    fr: "IAM Identity Center offre aux utilisateurs du personnel une authentification unique vers les comptes AWS d'une organisation et vers les applications attribuées. Les utilisateurs se connectent une fois et retrouvent leurs attributions dans le portail d'accès AWS."
  options:
    a:
      en: "Amazon Cognito manages sign-up and sign-in for the users of web and mobile apps, not workforce access to AWS accounts."
      fr: "Amazon Cognito gère l'inscription et la connexion des utilisateurs d'applications web et mobiles, pas l'accès du personnel aux comptes AWS."
    c:
      en: "Secrets Manager stores and rotates secrets such as database credentials; it does not provide single sign-on."
      fr: "Secrets Manager stocke et fait la rotation de secrets comme les informations d'identification de bases de données ; il ne fournit pas d'authentification unique."
    d:
      en: "Directory Service provides managed Microsoft Active Directory directories; on its own it does not assign access to AWS accounts."
      fr: "Directory Service fournit des annuaires Microsoft Active Directory gérés ; à lui seul, il n'attribue pas d'accès aux comptes AWS."
references:
  - title: What is IAM Identity Center?
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
