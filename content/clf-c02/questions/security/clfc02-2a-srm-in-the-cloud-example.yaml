id: clfc02-2a-srm-in-the-cloud-example
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which task is an example of "security in the cloud" in the AWS shared responsibility model?
  fr: |
    Quelle tâche est un exemple de « sécurité dans le cloud » dans le modèle de responsabilité partagée AWS ?
body:
  options:
    - id: a
      text: { en: "Replacing failed storage devices in AWS data centers.", fr: "Remplacer les périphériques de stockage défaillants dans les centres de données AWS." }
    - id: b
      text: { en: "Monitoring physical access to AWS facilities.", fr: "Surveiller l'accès physique aux installations AWS." }
    - id: c
      text: { en: "Patching the virtualization layer of the EC2 hosts.", fr: "Appliquer les correctifs à la couche de virtualisation des hôtes EC2." }
    - id: d
      text: { en: "Granting IAM permissions to the employees who need the data.", fr: "Accorder des autorisations IAM aux employés qui ont besoin des données." }
answer: { optionId: d }
explanation:
  correct:
    en: "Security in the cloud is the customer's part of the model. Deciding who can access the company's resources and data, for example with IAM permissions, is always the customer's responsibility."
    fr: "La sécurité dans le cloud est la part du client dans le modèle. Décider qui peut accéder aux ressources et aux données de l'entreprise, par exemple avec des autorisations IAM, est toujours de la responsabilité du client."
  options:
    a:
      en: "Hardware in AWS data centers is part of the infrastructure that AWS protects and maintains."
      fr: "Le matériel des centres de données AWS fait partie de l'infrastructure qu'AWS protège et entretient."
    b:
      en: "Physical access to AWS facilities is controlled and monitored by AWS, as part of security of the cloud."
      fr: "L'accès physique aux installations AWS est contrôlé et surveillé par AWS, au titre de la sécurité du cloud."
    c:
      en: "AWS manages the stack from the host operating system and virtualization layer down to the facilities."
      fr: "AWS gère la pile depuis le système d'exploitation hôte et la couche de virtualisation jusqu'aux installations."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
