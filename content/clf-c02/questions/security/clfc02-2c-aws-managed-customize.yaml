id: clfc02-2c-aws-managed-customize
objective: "2.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS managed policy grants a team more actions than it needs. The company wants a policy with only the needed actions that it can attach to several IAM roles. What should the company do?
  fr: |
    Une politique gérée par AWS accorde à une équipe plus d'actions que nécessaire. L'entreprise veut une politique limitée aux actions nécessaires qu'elle peut attacher à plusieurs rôles IAM. Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Edit the AWS managed policy and remove the actions that the team does not need.", fr: "Modifier la politique gérée par AWS et retirer les actions dont l'équipe n'a pas besoin." } }
    - { id: b, text: { en: "Ask AWS Support to create a reduced copy of the AWS managed policy for the account.", fr: "Demander à AWS Support de créer une copie réduite de la politique gérée par AWS pour le compte." } }
    - { id: c, text: { en: "Copy the AWS managed policy into a customer managed policy and remove the extra actions.", fr: "Copier la politique gérée par AWS dans une politique gérée par le client et retirer les actions en trop." } }
    - { id: d, text: { en: "Attach an inline policy that allows fewer actions next to the AWS managed policy.", fr: "Attacher, à côté de la politique gérée par AWS, une politique en ligne qui autorise moins d'actions." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS managed policies cannot be changed by customers and often grant more than a given use case needs. A customer managed policy, created by copying the AWS managed policy and removing actions, can be edited at will and attached to many roles."
    fr: "Les clients ne peuvent pas modifier les politiques gérées par AWS, qui accordent souvent plus que ce qu'exige un cas d'usage donné. Une politique gérée par le client, créée en copiant la politique gérée par AWS puis en retirant des actions, peut être modifiée librement et attachée à de nombreux rôles."
  options:
    a:
      en: "Customers cannot change the permissions of an AWS managed policy; only AWS updates it."
      fr: "Les clients ne peuvent pas modifier les autorisations d'une politique gérée par AWS ; seul AWS la met à jour."
    b:
      en: "Customers create their own policies; AWS Support does not write custom policies for an account."
      fr: "Les clients créent leurs propres politiques ; AWS Support ne rédige pas de politiques personnalisées pour un compte."
    d:
      en: "Allow statements add up, so an extra inline policy does not remove the actions that the AWS managed policy grants."
      fr: "Les instructions Allow s'additionnent : une politique en ligne supplémentaire ne retire pas les actions accordées par la politique gérée par AWS."
references:
  - title: Managed policies and inline policies
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vs-inline.html
