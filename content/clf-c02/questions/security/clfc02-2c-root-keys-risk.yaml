id: clfc02-2c-root-keys-risk
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer asks to create access keys for the AWS account root user to run a deployment script. Why does AWS recommend against creating root user access keys?
  fr: |
    Un développeur demande à créer des clés d'accès pour l'utilisateur racine du compte AWS afin d'exécuter un script de déploiement. Pourquoi AWS déconseille-t-il de créer des clés d'accès pour l'utilisateur racine ?
body:
  options:
    - { id: a, text: { en: "Root user access keys cannot be deleted after they are created, so they stay valid forever.", fr: "Les clés d'accès racine ne peuvent pas être supprimées après leur création et restent donc valides indéfiniment." } }
    - { id: b, text: { en: "Leaked root user access keys give programmatic access to every resource, including billing.", fr: "Des clés d'accès racine divulguées donnent un accès programmatique à toutes les ressources, y compris la facturation." } }
    - { id: c, text: { en: "Root user access keys stop working as soon as MFA is enabled for the root user.", fr: "Les clés d'accès racine cessent de fonctionner dès que la MFA est activée pour l'utilisateur racine." } }
    - { id: d, text: { en: "Root user access keys work only in the us-east-1 Region, which limits deployments.", fr: "Les clés d'accès racine ne fonctionnent que dans la Région us-east-1, ce qui limite les déploiements." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The root user has full access to all services and resources, including billing, so root access keys create a significant risk if they are exposed. AWS recommends not creating root access keys and using IAM roles or other temporary credentials with only the permissions the script needs."
    fr: "L'utilisateur racine a un accès complet à tous les services et ressources, y compris la facturation : des clés d'accès racine exposées représentent donc un risque important. AWS recommande de ne pas créer de clés d'accès racine et d'utiliser des rôles IAM ou d'autres informations d'identification temporaires avec uniquement les autorisations dont le script a besoin."
  options:
    a:
      en: "Root access keys can be deleted; AWS recommends deleting them when they exist and are not needed."
      fr: "Les clés d'accès racine peuvent être supprimées ; AWS recommande de les supprimer lorsqu'elles existent sans être nécessaires."
    c:
      en: "MFA protects sign-in; enabling it does not disable existing access keys, which is part of why keys are risky."
      fr: "La MFA protège la connexion ; son activation ne désactive pas les clés d'accès existantes, ce qui explique en partie leur risque."
    d:
      en: "Access keys are not limited to one Region; root keys could be used against resources in every Region."
      fr: "Les clés d'accès ne sont pas limitées à une Région ; des clés racine pourraient être utilisées contre les ressources de toutes les Régions."
references:
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
  - title: Manage access keys for IAM users
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
