id: clfc02-2d-marketplace-waf-rule-groups
objective: "2.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company protects its web application with AWS WAF. It wants to add rule groups that a third-party security vendor writes and keeps up to date.

    How can the company get these rule groups?
  fr: |
    Une entreprise protège son application web avec AWS WAF. Elle veut ajouter des groupes de règles qu'un éditeur de sécurité tiers rédige et tient à jour.

    Comment l'entreprise peut-elle obtenir ces groupes de règles ?
body:
  options:
    - id: a
      text: { en: "Add the AWS Managed Rules rule groups to the web ACL.", fr: "Ajouter les groupes de règles AWS Managed Rules à l'ACL web." }
    - id: b
      text: { en: "Subscribe to a seller's managed rule group in AWS Marketplace.", fr: "S'abonner au groupe de règles géré d'un vendeur dans AWS Marketplace." }
    - id: c
      text: { en: "Subscribe to AWS Shield Advanced for the application.", fr: "Souscrire à AWS Shield Advanced pour l'application." }
    - id: d
      text: { en: "Turn on Amazon GuardDuty in the account.", fr: "Activer Amazon GuardDuty dans le compte." }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS WAF managed rule groups are written and maintained either by AWS or by AWS Marketplace sellers. Seller rule groups are available by subscription through AWS Marketplace and are owned and managed by the seller, who keeps the rules up to date."
    fr: "Les groupes de règles gérés d'AWS WAF sont rédigés et maintenus soit par AWS, soit par des vendeurs d'AWS Marketplace. Les groupes de règles des vendeurs sont disponibles par abonnement dans AWS Marketplace ; ils appartiennent au vendeur, qui les gère et tient les règles à jour."
  options:
    a:
      en: "AWS Managed Rules are written and maintained by AWS, not by a third-party vendor."
      fr: "Les AWS Managed Rules sont rédigées et maintenues par AWS, pas par un éditeur tiers."
    c:
      en: "Shield Advanced adds DDoS protection and includes an AWS rule group for Layer 7 DDoS, not third-party vendor rules."
      fr: "Shield Advanced ajoute une protection DDoS et inclut un groupe de règles AWS contre les attaques DDoS de couche 7, pas des règles d'éditeurs tiers."
    d:
      en: "GuardDuty detects threats in the account; it does not provide AWS WAF rules."
      fr: "GuardDuty détecte les menaces dans le compte ; il ne fournit pas de règles AWS WAF."
references:
  - title: "Using managed rule groups in AWS WAF"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-managed-rule-groups.html
  - title: "What is AWS Marketplace?"
    url: https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html
