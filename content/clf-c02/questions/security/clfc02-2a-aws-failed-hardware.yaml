id: clfc02-2a-aws-failed-hardware
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A storage device fails in a physical server that hosts a company's Amazon RDS DB instance. Under the AWS shared responsibility model, who is responsible for replacing the device?
  fr: |
    Un périphérique de stockage tombe en panne dans un serveur physique qui héberge l'instance de base de données Amazon RDS d'une entreprise. Selon le modèle de responsabilité partagée AWS, qui est responsable du remplacement du périphérique ?
body:
  options:
    - id: a
      text: { en: "The company, after it opens a case with AWS Support", fr: "L'entreprise, après avoir ouvert un dossier auprès d'AWS Support" }
    - id: b
      text: { en: "AWS, because the hardware is part of the AWS infrastructure", fr: "AWS, car le matériel fait partie de l'infrastructure AWS" }
    - id: c
      text: { en: "The company, because the device stores the company's data", fr: "L'entreprise, car le périphérique stocke les données de l'entreprise" }
    - id: d
      text: { en: "The company, if it chose a Single-AZ deployment", fr: "L'entreprise, si elle a choisi un déploiement Single-AZ" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS protects the infrastructure that runs AWS Cloud services, which is made up of hardware, software, networking, and facilities. Physical hardware is always AWS's responsibility, whatever the service or deployment option."
    fr: "AWS protège l'infrastructure qui exécute les services du Cloud AWS, composée du matériel, des logiciels, du réseau et des installations. Le matériel physique est toujours de la responsabilité d'AWS, quels que soient le service ou l'option de déploiement."
  options:
    a:
      en: "Customers have no access to AWS hardware; opening a Support case does not move hardware tasks to the customer."
      fr: "Les clients n'ont pas accès au matériel AWS ; ouvrir un dossier Support ne transfère pas les tâches matérielles au client."
    c:
      en: "The customer is responsible for its data, not for the physical devices that store it."
      fr: "Le client est responsable de ses données, pas des périphériques physiques qui les stockent."
    d:
      en: "Multi-AZ or Single-AZ changes availability, not who maintains the hardware."
      fr: "Multi-AZ ou Single-AZ change la disponibilité, pas la partie qui entretient le matériel."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
