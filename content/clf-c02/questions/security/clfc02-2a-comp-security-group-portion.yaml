id: clfc02-2a-comp-security-group-portion
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company configures the rules of the security groups for its Amazon EC2 instances. In the AWS shared responsibility model, which part does this task belong to?
  fr: |
    Une entreprise configure les règles des groupes de sécurité de ses instances Amazon EC2. Dans le modèle de responsabilité partagée AWS, à quelle part cette tâche appartient-elle ?
body:
  options:
    - id: a
      text: { en: "Security of the cloud, managed by AWS", fr: "La sécurité du cloud, gérée par AWS" }
    - id: b
      text: { en: "Security of the cloud, managed by the customer", fr: "La sécurité du cloud, gérée par le client" }
    - id: c
      text: { en: "An inherited control, managed by AWS", fr: "Un contrôle hérité, géré par AWS" }
    - id: d
      text: { en: "Security in the cloud, managed by the customer", fr: "La sécurité dans le cloud, gérée par le client" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS provides the security group firewall, but configuring it is the customer's responsibility. This is part of security in the cloud, together with the guest operating system and the applications."
    fr: "AWS fournit le pare-feu que constitue le groupe de sécurité, mais sa configuration est de la responsabilité du client. Cela fait partie de la sécurité dans le cloud, avec le système d'exploitation invité et les applications."
  options:
    a:
      en: "AWS does not write the rules of customer security groups; it only provides the feature."
      fr: "AWS n'écrit pas les règles des groupes de sécurité des clients ; il fournit seulement la fonctionnalité."
    b:
      en: "Security of the cloud is the AWS part of the model, not a customer task."
      fr: "La sécurité du cloud est la part d'AWS dans le modèle, pas une tâche du client."
    c:
      en: "Inherited controls need no customer action, such as physical controls; security group rules must be configured by the customer."
      fr: "Les contrôles hérités ne demandent aucune action du client, comme les contrôles physiques ; les règles des groupes de sécurité doivent être configurées par le client."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
