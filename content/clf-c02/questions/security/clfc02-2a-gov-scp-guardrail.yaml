id: clfc02-2a-gov-scp-guardrail
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations. As a governance guardrail, it wants to centrally set the maximum permissions that IAM users and roles can have in its member accounts. What should the company use?
  fr: |
    Une entreprise utilise AWS Organizations. Comme garde-fou de gouvernance, elle veut définir de façon centralisée les autorisations maximales dont les utilisateurs et rôles IAM peuvent disposer dans ses comptes membres. Que doit utiliser l'entreprise ?
body:
  options:
    - id: a
      text: { en: "AWS Config rules", fr: "Des règles AWS Config" }
    - id: b
      text: { en: "Network ACLs", fr: "Des listes ACL réseau" }
    - id: c
      text: { en: "IAM Identity Center permission sets", fr: "Des jeux d'autorisations IAM Identity Center" }
    - id: d
      text: { en: "Service control policies (SCPs)", fr: "Des politiques de contrôle des services (SCP)" }
answer: { optionId: d }
explanation:
  correct:
    en: "SCPs are an AWS Organizations policy type that offers central control over the maximum available permissions for the IAM users and roles in the organization. They define a permission guardrail on the actions that those identities can perform."
    fr: "Les SCP sont un type de politique AWS Organizations qui offre un contrôle central des autorisations maximales disponibles pour les utilisateurs et rôles IAM de l'organisation. Elles définissent un garde-fou d'autorisations sur les actions que ces identités peuvent effectuer."
  options:
    a:
      en: "AWS Config rules evaluate resource configurations; they do not limit the permissions of identities."
      fr: "Les règles AWS Config évaluent les configurations des ressources ; elles ne limitent pas les autorisations des identités."
    b:
      en: "Network ACLs filter traffic at the subnet level; they have nothing to do with IAM permissions."
      fr: "Les listes ACL réseau filtrent le trafic au niveau des sous-réseaux ; elles n'ont aucun rapport avec les autorisations IAM."
    c:
      en: "Permission sets grant access to users of IAM Identity Center; they do not set an upper limit for every identity in the accounts."
      fr: "Les jeux d'autorisations accordent des accès aux utilisateurs d'IAM Identity Center ; ils ne fixent pas de limite supérieure pour toutes les identités des comptes."
references:
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
