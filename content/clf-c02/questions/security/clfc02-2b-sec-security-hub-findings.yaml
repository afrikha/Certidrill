id: clfc02-2b-sec-security-hub-findings
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon GuardDuty, Amazon Inspector and Amazon Macie in several accounts. The security team wants one service that gathers the findings of these services in one place and also runs automated checks of the accounts against security best practices.

    Which AWS service should the team use?
  fr: |
    Une entreprise utilise Amazon GuardDuty, Amazon Inspector et Amazon Macie dans plusieurs comptes. L'équipe de sécurité veut un service unique qui regroupe les résultats de ces services à un seul endroit et qui exécute aussi des vérifications automatisées des comptes par rapport aux bonnes pratiques de sécurité.

    Quel service AWS l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Security Hub CSPM", fr: "AWS Security Hub CSPM" }
    - id: b
      text: { en: "Amazon Detective", fr: "Amazon Detective" }
    - id: c
      text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" }
    - id: d
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Security Hub CSPM collects security findings from AWS services such as GuardDuty, Inspector and Macie across accounts, and runs automated security checks against standards such as AWS Foundational Security Best Practices. The CLF-C02 exam guide names this service AWS Security Hub."
    fr: "AWS Security Hub CSPM collecte les résultats de sécurité de services AWS comme GuardDuty, Inspector et Macie pour plusieurs comptes, et exécute des vérifications de sécurité automatisées par rapport à des normes comme AWS Foundational Security Best Practices. Le guide de l'examen CLF-C02 nomme ce service AWS Security Hub."
  options:
    b:
      en: "Detective helps investigate the root cause of findings; it does not run best-practice checks."
      fr: "Detective aide à rechercher la cause première des résultats ; il n'exécute pas de vérifications de bonnes pratiques."
    c:
      en: "CloudTrail records API activity; it does not gather findings from other security services."
      fr: "CloudTrail enregistre l'activité des API ; il ne regroupe pas les résultats des autres services de sécurité."
    d:
      en: "AWS Artifact provides AWS compliance reports; it does not check the company's accounts."
      fr: "AWS Artifact fournit les rapports de conformité d'AWS ; il ne vérifie pas les comptes de l'entreprise."
references:
  - title: "Introduction to AWS Security Hub CSPM"
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub.html
