id: clfc02-2d-trusted-advisor-all-checks
objective: "2.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has the AWS Basic Support plan. In AWS Trusted Advisor, the company sees all service limits checks but only some of the security checks.

    What must the company do to access all Trusted Advisor checks?
  fr: |
    Une entreprise dispose du plan AWS Basic Support. Dans AWS Trusted Advisor, elle voit toutes les vérifications des limites de service mais seulement une partie des vérifications de sécurité.

    Que doit faire l'entreprise pour accéder à toutes les vérifications de Trusted Advisor ?
body:
  options:
    - id: a
      text: { en: "Enable Amazon Inspector in every Region.", fr: "Activer Amazon Inspector dans chaque Région." }
    - id: b
      text: { en: "Sign in to Trusted Advisor as the account root user.", fr: "Se connecter à Trusted Advisor avec l'utilisateur racine du compte." }
    - id: c
      text: { en: "Upgrade to a plan such as AWS Business Support+.", fr: "Passer à un plan comme AWS Business Support+." }
    - id: d
      text: { en: "Turn on AWS Config recording in the account.", fr: "Activer l'enregistrement AWS Config dans le compte." }
answer: { optionId: c }
explanation:
  correct:
    en: "With Basic Support, Trusted Advisor gives access to all service limits checks and selected security and fault tolerance checks, which the customer must refresh manually. All Trusted Advisor checks are available to customers with AWS Business Support+, AWS Enterprise Support, or AWS Unified Operations."
    fr: "Avec Basic Support, Trusted Advisor donne accès à toutes les vérifications des limites de service et à une sélection de vérifications de sécurité et de tolérance aux pannes, que le client doit actualiser manuellement. Toutes les vérifications de Trusted Advisor sont disponibles pour les clients d'AWS Business Support+, d'AWS Enterprise Support ou d'AWS Unified Operations."
  options:
    a:
      en: "Amazon Inspector is a separate vulnerability scanning service; enabling it does not unlock Trusted Advisor checks."
      fr: "Amazon Inspector est un service distinct d'analyse des vulnérabilités ; l'activer ne débloque pas les vérifications de Trusted Advisor."
    b:
      en: "Access to the checks depends on the Support plan, not on the identity used to sign in; daily tasks should not use the root user."
      fr: "L'accès aux vérifications dépend du plan de support, pas de l'identité de connexion ; l'utilisateur racine ne doit pas servir aux tâches courantes."
    d:
      en: "AWS Config records resource configurations; it does not change which Trusted Advisor checks are available."
      fr: "AWS Config enregistre les configurations des ressources ; il ne change pas les vérifications de Trusted Advisor disponibles."
references:
  - title: "AWS Trusted Advisor"
    url: https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor.html
