id: clfc02-2d-macie-pii-buckets
objective: "2.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores customer documents in many Amazon S3 buckets. It wants to find out which buckets contain personally identifiable information (PII).

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise stocke des documents clients dans de nombreux compartiments S3. Elle veut savoir quels compartiments contiennent des informations d'identification personnelle (PII).

    Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Amazon Macie", fr: "Amazon Macie" }
    - id: b
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
    - id: c
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: d
      text: { en: "AWS Shield", fr: "AWS Shield" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Macie discovers sensitive data in Amazon S3 by using machine learning and pattern matching. Its managed data identifiers detect many types of PII, financial information, and credentials, and Macie generates a finding when it finds sensitive data."
    fr: "Amazon Macie découvre les données sensibles dans Amazon S3 grâce à l'apprentissage automatique et à la correspondance de modèles. Ses identifiants de données gérés détectent de nombreux types de PII, d'informations financières et d'informations d'identification, et Macie génère un résultat lorsqu'il trouve des données sensibles."
  options:
    b:
      en: "GuardDuty detects threats and malicious activity; it does not classify the content of S3 objects."
      fr: "GuardDuty détecte les menaces et les activités malveillantes ; il ne classe pas le contenu des objets S3."
    c:
      en: "Amazon Inspector scans compute workloads for software vulnerabilities, not stored data for PII."
      fr: "Amazon Inspector analyse les charges de calcul pour y trouver des vulnérabilités logicielles, pas les données stockées pour y trouver des PII."
    d:
      en: "AWS Shield protects against DDoS attacks; it does not inspect stored data."
      fr: "AWS Shield protège contre les attaques DDoS ; il n'inspecte pas les données stockées."
references:
  - title: "What is Amazon Macie?"
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
