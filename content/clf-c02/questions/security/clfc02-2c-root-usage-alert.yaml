id: clfc02-2c-root-usage-alert
objective: "2.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team wants to receive a notification each time the root user credentials of an AWS account are used. Which solution will meet this requirement?
  fr: |
    Une équipe de sécurité veut recevoir une notification chaque fois que les informations d'identification de l'utilisateur racine d'un compte AWS sont utilisées. Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Enable the AWS Trusted Advisor check that verifies MFA on the root account.", fr: "Activer la vérification AWS Trusted Advisor qui contrôle la MFA du compte racine." } }
    - { id: b, text: { en: "Download the AWS Artifact reports that cover AWS identity controls.", fr: "Télécharger les rapports AWS Artifact qui couvrent les contrôles d'identité d'AWS." } }
    - { id: c, text: { en: "Use an Amazon EventBridge rule on root activity to send Amazon SNS alerts.", fr: "Utiliser une règle Amazon EventBridge sur l'activité racine pour envoyer des alertes Amazon SNS." } }
    - { id: d, text: { en: "Create an AWS Budgets alert that tracks the usage of the root user.", fr: "Créer une alerte AWS Budgets qui suit l'utilisation de l'utilisateur racine." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS CloudTrail records root user sign-ins and actions. An Amazon EventBridge rule that matches this root activity can send an Amazon SNS notification to the security team each time the root credentials are used."
    fr: "AWS CloudTrail enregistre les connexions et les actions de l'utilisateur racine. Une règle Amazon EventBridge qui correspond à cette activité racine peut envoyer une notification Amazon SNS à l'équipe de sécurité chaque fois que les informations d'identification racine sont utilisées."
  options:
    a:
      en: "The Trusted Advisor check reports whether MFA is enabled on the root user; it does not notify when the root user is used."
      fr: "La vérification Trusted Advisor indique si la MFA est activée pour l'utilisateur racine ; elle ne notifie pas l'utilisation de l'utilisateur racine."
    b:
      en: "AWS Artifact provides AWS compliance reports; it does not monitor activity in the customer's account."
      fr: "AWS Artifact fournit les rapports de conformité d'AWS ; il ne surveille pas l'activité dans le compte du client."
    d:
      en: "AWS Budgets tracks costs and usage of services, not sign-ins or actions of the root user."
      fr: "AWS Budgets suit les coûts et l'utilisation des services, pas les connexions ni les actions de l'utilisateur racine."
references:
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
