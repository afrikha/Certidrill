id: clfc02-2c-group-facts
objective: "2.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator is organizing the IAM users of an AWS account into IAM user groups. Which statement about IAM user groups is true?
  fr: |
    Un administrateur organise les utilisateurs IAM d'un compte AWS en groupes d'utilisateurs IAM. Quelle affirmation sur les groupes d'utilisateurs IAM est vraie ?
body:
  options:
    - { id: a, text: { en: "An IAM user can belong to more than one user group.", fr: "Un utilisateur IAM peut appartenir à plusieurs groupes d'utilisateurs." } }
    - { id: b, text: { en: "A user group can contain other user groups.", fr: "Un groupe d'utilisateurs peut contenir d'autres groupes d'utilisateurs." } }
    - { id: c, text: { en: "A user group can be the principal in a bucket policy.", fr: "Un groupe d'utilisateurs peut être le principal d'une politique de compartiment." } }
    - { id: d, text: { en: "Every account has a default group with all its users.", fr: "Chaque compte possède un groupe par défaut qui contient tous ses utilisateurs." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An IAM user can be a member of several user groups and receives the permissions of each of them. This lets an administrator combine job-based groups, for example Developers and Testers, to give each user only what they need."
    fr: "Un utilisateur IAM peut être membre de plusieurs groupes d'utilisateurs et reçoit les autorisations de chacun d'eux. L'administrateur peut ainsi combiner des groupes par fonction, par exemple Developers et Testers, pour donner à chaque utilisateur uniquement ce dont il a besoin."
  options:
    b:
      en: "User groups can contain only IAM users; groups cannot be nested."
      fr: "Les groupes d'utilisateurs ne peuvent contenir que des utilisateurs IAM ; ils ne peuvent pas être imbriqués."
    c:
      en: "A group is not an authenticated identity, so it cannot be specified as a principal in a resource-based policy."
      fr: "Un groupe n'est pas une identité authentifiée : il ne peut pas être indiqué comme principal dans une politique basée sur les ressources."
    d:
      en: "AWS creates no default group; the administrator must create one and add each new user to it."
      fr: "AWS ne crée aucun groupe par défaut ; l'administrateur doit en créer un et y ajouter chaque nouvel utilisateur."
references:
  - title: IAM user groups
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_groups.html
