id: clfc02-2a-srm-operational-burden
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company plans to move its applications from its own data center to AWS. Management wants to know how the AWS shared responsibility model reduces the company's security workload.

    Which statement is correct?
  fr: |
    Une entreprise prévoit de migrer ses applications de son propre centre de données vers AWS. La direction veut savoir comment le modèle de responsabilité partagée AWS réduit la charge de travail de sécurité de l'entreprise.

    Quelle affirmation est correcte ?
body:
  options:
    - id: a
      text: { en: "AWS manages the guest operating system and the applications on every EC2 instance.", fr: "AWS gère le système d'exploitation invité et les applications de chaque instance EC2." }
    - id: b
      text: { en: "AWS classifies and protects the company's data on behalf of the company.", fr: "AWS classe et protège les données de l'entreprise pour le compte de celle-ci." }
    - id: c
      text: { en: "AWS configures the company's security groups to block unwanted traffic.", fr: "AWS configure les groupes de sécurité de l'entreprise pour bloquer le trafic indésirable." }
    - id: d
      text: { en: "AWS manages the components from the host operating system down to the physical facilities.", fr: "AWS gère les composants depuis le système d'exploitation hôte jusqu'aux installations physiques." }
answer: { optionId: d }
explanation:
  correct:
    en: "The model can reduce the customer's operational burden because AWS operates, manages, and controls the components from the host operating system and virtualization layer down to the physical security of the facilities. The company no longer builds or secures that part itself."
    fr: "Le modèle peut réduire la charge opérationnelle du client, car AWS exploite, gère et contrôle les composants depuis le système d'exploitation hôte et la couche de virtualisation jusqu'à la sécurité physique des installations. L'entreprise n'a plus à construire ni à sécuriser cette partie elle-même."
  options:
    a:
      en: "On Amazon EC2, the customer manages the guest operating system, including updates and security patches, and the software it installs."
      fr: "Sur Amazon EC2, le client gère le système d'exploitation invité, y compris les mises à jour et les correctifs de sécurité, ainsi que les logiciels qu'il installe."
    b:
      en: "Classifying and protecting its data remains the customer's responsibility, whatever service is used."
      fr: "Classer et protéger ses données reste de la responsabilité du client, quel que soit le service utilisé."
    c:
      en: "Security groups are provided by AWS, but the customer configures their rules."
      fr: "Les groupes de sécurité sont fournis par AWS, mais c'est le client qui configure leurs règles."
references:
  - title: Shared responsibility model
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-risk-and-compliance/shared-responsibility-model.html
