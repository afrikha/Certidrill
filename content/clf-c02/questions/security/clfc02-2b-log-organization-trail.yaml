id: clfc02-2b-log-organization-trail
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations with 40 member accounts. The security team wants the API activity of every account to be logged to one central Amazon S3 bucket. Administrators of member accounts must not be able to stop or delete this logging.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations avec 40 comptes membres. L'équipe de sécurité veut que l'activité des API de chaque compte soit journalisée dans un seul compartiment Amazon S3 central. Les administrateurs des comptes membres ne doivent pas pouvoir arrêter ni supprimer cette journalisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an organization trail in AWS CloudTrail from the management account.", fr: "Créer un journal de suivi d'organisation dans AWS CloudTrail depuis le compte de gestion." }
    - id: b
      text: { en: "Download the CloudTrail event history of each account to the central bucket every week.", fr: "Télécharger chaque semaine l'historique des événements CloudTrail de chaque compte dans le compartiment central." }
    - id: c
      text: { en: "Ask the administrators of each account to create a trail that delivers to the central bucket.", fr: "Demander aux administrateurs de chaque compte de créer un journal de suivi qui livre dans le compartiment central." }
    - id: d
      text: { en: "Create an AWS Config aggregator in the management account for all member accounts.", fr: "Créer un agrégateur AWS Config dans le compte de gestion pour tous les comptes membres." }
answer: { optionId: a }
explanation:
  correct:
    en: "An organization trail logs the events of the management account and of all member accounts, including accounts that join later, to the bucket that the management account chooses. Member accounts can see the trail but cannot stop, change or delete it."
    fr: "Un journal de suivi d'organisation enregistre les événements du compte de gestion et de tous les comptes membres, y compris ceux qui rejoignent l'organisation plus tard, dans le compartiment choisi par le compte de gestion. Les comptes membres voient le journal de suivi mais ne peuvent ni l'arrêter, ni le modifier, ni le supprimer."
  options:
    b:
      en: "A manual weekly export can be skipped by member administrators and does not prevent them from interfering with it."
      fr: "Un export manuel hebdomadaire peut être omis par les administrateurs des comptes membres et ne les empêche pas d'interférer."
    c:
      en: "A trail created in a member account belongs to that account, so its administrators could stop or delete it."
      fr: "Un journal de suivi créé dans un compte membre appartient à ce compte : ses administrateurs pourraient l'arrêter ou le supprimer."
    d:
      en: "An aggregator collects AWS Config data from several accounts; it does not log all API activity."
      fr: "Un agrégateur collecte les données AWS Config de plusieurs comptes ; il ne journalise pas toute l'activité des API."
references:
  - title: "Creating a trail for an organization"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html
