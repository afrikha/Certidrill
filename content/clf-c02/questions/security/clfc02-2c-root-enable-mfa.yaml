id: clfc02-2c-root-enable-mfa
objective: "2.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to add a second layer of protection to the root user sign-in of its AWS account, in addition to a strong password. What should the company do?
  fr: |
    Une entreprise veut ajouter une seconde couche de protection à la connexion de l'utilisateur racine de son compte AWS, en plus d'un mot de passe fort. Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Create access keys for the root user.", fr: "Créer des clés d'accès pour l'utilisateur racine." } }
    - { id: b, text: { en: "Attach a deny policy to the root user.", fr: "Attacher une politique de refus à l'utilisateur racine." } }
    - { id: c, text: { en: "Register an MFA device for the root user.", fr: "Enregistrer un appareil MFA pour l'utilisateur racine." } }
    - { id: d, text: { en: "Add the root user to an IAM user group.", fr: "Ajouter l'utilisateur racine à un groupe d'utilisateurs IAM." } }
answer: { optionId: c }
explanation:
  correct:
    en: "MFA adds a second factor to the root user sign-in, such as a passkey, a security key or a code from an authenticator. AWS requires MFA for root users of all account types and recommends registering more than one device."
    fr: "La MFA ajoute un second facteur à la connexion de l'utilisateur racine, comme une passkey, une clé de sécurité ou un code d'application d'authentification. AWS exige la MFA pour les utilisateurs racine de tous les types de comptes et recommande d'enregistrer plusieurs appareils."
  options:
    a:
      en: "Root access keys add a risky long-term credential; they do not protect the sign-in."
      fr: "Les clés d'accès racine ajoutent une information d'identification à long terme risquée ; elles ne protègent pas la connexion."
    b:
      en: "IAM policies are attached to IAM users, groups and roles, not to the root user, and they do not add a sign-in factor."
      fr: "Les politiques IAM s'attachent aux utilisateurs, groupes et rôles IAM, pas à l'utilisateur racine, et elles n'ajoutent pas de facteur de connexion."
    d:
      en: "IAM user groups contain only IAM users; the root user cannot be added to one."
      fr: "Les groupes d'utilisateurs IAM ne contiennent que des utilisateurs IAM ; l'utilisateur racine ne peut pas y être ajouté."
references:
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
  - title: AWS Multi-factor authentication in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html
