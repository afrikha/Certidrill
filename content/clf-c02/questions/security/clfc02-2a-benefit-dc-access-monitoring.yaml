id: clfc02-2a-benefit-dc-access-monitoring
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's risk team asks how physical access to the AWS data centers that host its workloads is controlled. Which statement is correct?
  fr: |
    L'équipe des risques d'une entreprise demande comment l'accès physique aux centres de données AWS qui hébergent ses charges de travail est contrôlé. Quelle affirmation est correcte ?
body:
  options:
    - id: a
      text: { en: "Access is given to approved employees only, and it is logged and monitored.", fr: "L'accès est donné aux seuls employés approuvés, et il est journalisé et surveillé." }
    - id: b
      text: { en: "Access is given to any customer employee who has an IAM user.", fr: "L'accès est donné à tout employé d'un client qui dispose d'un utilisateur IAM." }
    - id: c
      text: { en: "Access is controlled by the security groups that customers configure.", fr: "L'accès est contrôlé par les groupes de sécurité que les clients configurent." }
    - id: d
      text: { en: "Access is open to visitors during business hours without an escort.", fr: "L'accès est ouvert aux visiteurs pendant les heures ouvrées sans accompagnement." }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS gives physical data center access only to approved employees, on a time-bound, least-privilege basis. Physical access is logged, monitored, and retained, and Security Operations Centers monitor it 24/7. Third-party visitors must sign in and be escorted."
    fr: "AWS ne donne l'accès physique aux centres de données qu'aux employés approuvés, pour une durée limitée et selon le moindre privilège. L'accès physique est journalisé, surveillé et conservé, et des centres d'opérations de sécurité le surveillent 24 h/24 et 7 j/7. Les visiteurs tiers doivent s'enregistrer et être accompagnés."
  options:
    b:
      en: "IAM users control access to AWS resources through APIs and the console, not physical entry to facilities."
      fr: "Les utilisateurs IAM contrôlent l'accès aux ressources AWS via les API et la console, pas l'entrée physique dans les installations."
    c:
      en: "Security groups filter network traffic to instances; they have no role in physical security."
      fr: "Les groupes de sécurité filtrent le trafic réseau vers les instances ; ils ne jouent aucun rôle dans la sécurité physique."
    d:
      en: "Third-party visitors must be signed in and escorted by authorized staff."
      fr: "Les visiteurs tiers doivent être enregistrés et accompagnés par du personnel autorisé."
references:
  - title: Data Center - Our Controls
    url: https://aws.amazon.com/compliance/data-center/controls/
