id: clfc02-2b-iam-no-additional-charge
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement about AWS Identity and Access Management (IAM) is correct?
  fr: |
    Quelle affirmation sur AWS Identity and Access Management (IAM) est correcte ?
body:
  options:
    - id: a
      text: { en: "IAM is billed per IAM user per month, so companies should share users.", fr: "IAM est facturé par utilisateur IAM et par mois : les entreprises devraient partager les utilisateurs." }
    - id: b
      text: { en: "IAM policies can be attached only to IAM users, not to groups or roles.", fr: "Les politiques IAM ne peuvent être attachées qu'aux utilisateurs IAM, pas aux groupes ni aux rôles." }
    - id: c
      text: { en: "IAM is available only to accounts that have a paid AWS Support plan.", fr: "IAM n'est disponible que pour les comptes disposant d'un plan AWS Support payant." }
    - id: d
      text: { en: "IAM is a feature of the AWS account that is offered at no additional charge.", fr: "IAM est une fonctionnalité du compte AWS proposée sans frais supplémentaires." }
answer: { optionId: d }
explanation:
  correct:
    en: "IAM, like IAM Identity Center and AWS STS, is a feature of the AWS account offered at no additional charge. Customers are charged only when their IAM users or temporary credentials access other AWS services."
    fr: "IAM, comme IAM Identity Center et AWS STS, est une fonctionnalité du compte AWS proposée sans frais supplémentaires. Les clients ne sont facturés que lorsque leurs utilisateurs IAM ou leurs informations d'identification temporaires accèdent à d'autres services AWS."
  options:
    a:
      en: "IAM has no per-user charge, and sharing users breaks security best practices."
      fr: "IAM n'est pas facturé par utilisateur, et partager des utilisateurs enfreint les bonnes pratiques de sécurité."
    b:
      en: "Identity-based policies can be attached to users, groups and roles."
      fr: "Les politiques basées sur l'identité peuvent être attachées aux utilisateurs, aux groupes et aux rôles."
    c:
      en: "IAM is part of every AWS account, whatever the Support plan, including Basic Support."
      fr: "IAM fait partie de chaque compte AWS, quel que soit le plan de support, y compris Basic Support."
references:
  - title: "What is IAM?"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html
