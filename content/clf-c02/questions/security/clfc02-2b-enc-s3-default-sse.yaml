id: clfc02-2b-enc-s3-default-sse
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer uploads an object to an Amazon S3 bucket without specifying any encryption setting. Nobody has changed the default encryption configuration of the bucket.

    What happens to the object?
  fr: |
    Un développeur charge un objet dans un compartiment Amazon S3 sans indiquer de paramètre de chiffrement. Personne n'a modifié la configuration de chiffrement par défaut du compartiment.

    Que devient l'objet ?
body:
  options:
    - id: a
      text: { en: "Amazon S3 rejects the upload because no encryption setting was specified.", fr: "Amazon S3 rejette le chargement parce qu'aucun paramètre de chiffrement n'a été indiqué." }
    - id: b
      text: { en: "Amazon S3 stores it unencrypted until a bucket policy requires encryption.", fr: "Amazon S3 le stocke sans chiffrement jusqu'à ce qu'une politique de compartiment exige le chiffrement." }
    - id: c
      text: { en: "Amazon S3 encrypts it with a customer managed key that it creates in AWS KMS.", fr: "Amazon S3 le chiffre avec une clé gérée par le client qu'il crée dans AWS KMS." }
    - id: d
      text: { en: "Amazon S3 encrypts it at rest with SSE-S3.", fr: "Amazon S3 le chiffre au repos avec SSE-S3." }
answer: { optionId: d }
explanation:
  correct:
    en: "All S3 buckets have encryption configured by default with server-side encryption with Amazon S3 managed keys (SSE-S3). Since January 5, 2023, every new object upload is automatically encrypted at no additional cost, so an object uploaded without other settings is encrypted at rest with SSE-S3."
    fr: "Tous les compartiments S3 ont le chiffrement configuré par défaut avec le chiffrement côté serveur avec des clés gérées par Amazon S3 (SSE-S3). Depuis le 5 janvier 2023, chaque nouveau chargement d'objet est automatiquement chiffré sans coût supplémentaire : un objet chargé sans autre paramètre est chiffré au repos avec SSE-S3."
  options:
    a:
      en: "S3 accepts the upload and applies the bucket's default encryption."
      fr: "S3 accepte le chargement et applique le chiffrement par défaut du compartiment."
    b:
      en: "New objects are never stored unencrypted in S3; SSE-S3 is applied by default."
      fr: "Les nouveaux objets ne sont jamais stockés sans chiffrement dans S3 ; SSE-S3 est appliqué par défaut."
    c:
      en: "S3 does not create customer managed keys; SSE-KMS is used only if the bucket or the request specifies it."
      fr: "S3 ne crée pas de clés gérées par le client ; SSE-KMS n'est utilisé que si le compartiment ou la demande l'indique."
references:
  - title: "Setting default server-side encryption behavior for Amazon S3 buckets"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-encryption.html
