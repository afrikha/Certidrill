id: clfc02-2d-trusted-advisor-issues
objective: "2.4.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants to review the security checks that AWS Trusted Advisor runs in its account.

    Which security issues can Trusted Advisor identify? (Choose two.)
  fr: |
    Une entreprise veut examiner les vérifications de sécurité qu'AWS Trusted Advisor effectue dans son compte.

    Quels problèmes de sécurité Trusted Advisor peut-il identifier ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "The root user does not have MFA enabled.", fr: "L'utilisateur racine n'a pas de MFA activée." }
    - id: b
      text: { en: "Objects in Amazon S3 contain credit card numbers.", fr: "Des objets Amazon S3 contiennent des numéros de carte bancaire." }
    - id: c
      text: { en: "Container images in Amazon ECR have known CVEs.", fr: "Des images de conteneur dans Amazon ECR présentent des CVE connues." }
    - id: d
      text: { en: "Security groups allow unrestricted access to specific ports.", fr: "Des groupes de sécurité autorisent un accès illimité à des ports spécifiques." }
    - id: e
      text: { en: "An EC2 instance is communicating with a known malicious IP address.", fr: "Une instance EC2 communique avec une adresse IP malveillante connue." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Trusted Advisor security checks include MFA on root account and Security Groups – Specific Ports Unrestricted. They compare the account's configuration with AWS best practices and recommend how to close the gaps."
    fr: "Les vérifications de sécurité de Trusted Advisor comprennent MFA on root account et Security Groups – Specific Ports Unrestricted. Elles comparent la configuration du compte aux bonnes pratiques AWS et recommandent comment combler les écarts."
  options:
    b:
      en: "Finding sensitive data such as card numbers inside S3 objects is the job of Amazon Macie."
      fr: "Trouver des données sensibles comme des numéros de carte dans des objets S3 est le rôle d'Amazon Macie."
    c:
      en: "Scanning container images for CVEs is the job of Amazon Inspector."
      fr: "Analyser des images de conteneur pour y trouver des CVE est le rôle d'Amazon Inspector."
    e:
      en: "Detecting communication with malicious IP addresses is the job of Amazon GuardDuty."
      fr: "Détecter les communications avec des adresses IP malveillantes est le rôle d'Amazon GuardDuty."
references:
  - title: "Security"
    url: https://docs.aws.amazon.com/awssupport/latest/user/security-checks.html
