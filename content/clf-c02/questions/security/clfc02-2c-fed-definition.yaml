id: clfc02-2c-fed-definition
objective: "2.3.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes identity federation in AWS?
  fr: |
    Quelle affirmation décrit la fédération d'identités dans AWS ?
body:
  options:
    - { id: a, text: { en: "Copying the user names and passwords of a corporate directory into new IAM users.", fr: "Copier les noms d'utilisateur et mots de passe d'un annuaire d'entreprise dans de nouveaux utilisateurs IAM." } }
    - { id: b, text: { en: "Letting users of an external identity provider access AWS with temporary credentials.", fr: "Permettre aux utilisateurs d'un fournisseur d'identité externe d'accéder à AWS avec des identifiants temporaires." } }
    - { id: c, text: { en: "Sharing one IAM user and its password between several AWS accounts of an organization.", fr: "Partager un seul utilisateur IAM et son mot de passe entre plusieurs comptes AWS d'une organisation." } }
    - { id: d, text: { en: "Grouping the IAM users of different AWS accounts into one IAM user group.", fr: "Regrouper les utilisateurs IAM de différents comptes AWS dans un seul groupe d'utilisateurs IAM." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With federation, an identity provider outside AWS manages and authenticates the users, and AWS trusts it. The users then access AWS with temporary credentials, so the company does not create IAM users or distribute long-term credentials."
    fr: "Avec la fédération, un fournisseur d'identité externe à AWS gère et authentifie les utilisateurs, et AWS lui fait confiance. Les utilisateurs accèdent ensuite à AWS avec des informations d'identification temporaires : l'entreprise ne crée pas d'utilisateurs IAM et ne distribue pas d'identifiants à long terme."
  options:
    a:
      en: "Copying users into IAM creates separate IAM identities with long-term passwords, which federation avoids."
      fr: "Copier les utilisateurs dans IAM crée des identités IAM distinctes avec des mots de passe à long terme, ce que la fédération évite."
    c:
      en: "An IAM user exists in one account; cross-account access uses roles, and sharing users is not federation."
      fr: "Un utilisateur IAM n'existe que dans un compte ; l'accès inter-comptes passe par des rôles, et partager des utilisateurs n'est pas de la fédération."
    d:
      en: "An IAM user group belongs to one account and contains only that account's users."
      fr: "Un groupe d'utilisateurs IAM appartient à un compte et ne contient que les utilisateurs de ce compte."
references:
  - title: Identity providers and federation into AWS
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html
