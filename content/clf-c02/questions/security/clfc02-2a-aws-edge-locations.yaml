id: clfc02-2a-aws-edge-locations
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company delivers its website through Amazon CloudFront. Under the AWS shared responsibility model, who is responsible for the security of the edge locations that serve the content?
  fr: |
    Une entreprise diffuse son site web via Amazon CloudFront. Selon le modèle de responsabilité partagée AWS, qui est responsable de la sécurité des emplacements périphériques qui diffusent le contenu ?
body:
  options:
    - id: a
      text: { en: "The company, because CloudFront caches the company's content", fr: "L'entreprise, car CloudFront met en cache le contenu de l'entreprise" }
    - id: b
      text: { en: "The company, because it created the CloudFront distribution", fr: "L'entreprise, car elle a créé la distribution CloudFront" }
    - id: c
      text: { en: "AWS, because edge locations are part of the AWS global infrastructure", fr: "AWS, car les emplacements périphériques font partie de l'infrastructure mondiale d'AWS" }
    - id: d
      text: { en: "AWS and the company jointly, because edge locations are a shared control", fr: "AWS et l'entreprise conjointement, car les emplacements périphériques sont un contrôle partagé" }
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS global infrastructure, made up of Regions, Availability Zones, and edge locations, is part of security of the cloud. AWS protects the edge locations; the company remains responsible for its content and the configuration of its distribution."
    fr: "L'infrastructure mondiale d'AWS, composée des Régions, des zones de disponibilité et des emplacements périphériques, fait partie de la sécurité du cloud. AWS protège les emplacements périphériques ; l'entreprise reste responsable de son contenu et de la configuration de sa distribution."
  options:
    a:
      en: "The company owns and protects its content, but not the infrastructure of the edge locations."
      fr: "L'entreprise possède et protège son contenu, mais pas l'infrastructure des emplacements périphériques."
    b:
      en: "Creating a distribution makes the company responsible for its configuration, not for the edge locations themselves."
      fr: "Créer une distribution rend l'entreprise responsable de sa configuration, pas des emplacements périphériques eux-mêmes."
    d:
      en: "The shared controls are patch management, configuration management, and awareness and training; edge locations belong to AWS."
      fr: "Les contrôles partagés sont la gestion des correctifs, la gestion de la configuration ainsi que la sensibilisation et la formation ; les emplacements périphériques relèvent d'AWS."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
