id: clfc02-2a-cust-ec2-credentials-roles
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company launches Amazon EC2 instances for a new application. Which tasks are the company's responsibility under the AWS shared responsibility model? (Choose two.)
  fr: |
    Une entreprise lance des instances Amazon EC2 pour une nouvelle application. Quelles tâches relèvent de la responsabilité de l'entreprise selon le modèle de responsabilité partagée AWS ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Maintaining the physical servers that host the instances", fr: "Entretenir les serveurs physiques qui hébergent les instances" } }
    - { id: b, text: { en: "Patching the virtualization layer of the hosts", fr: "Appliquer les correctifs à la couche de virtualisation des hôtes" } }
    - { id: c, text: { en: "Managing the credentials used to connect to the instances", fr: "Gérer les informations d'identification utilisées pour se connecter aux instances" } }
    - { id: d, text: { en: "Decommissioning the storage media used by the hosts", fr: "Mettre hors service les supports de stockage utilisés par les hôtes" } }
    - { id: e, text: { en: "Configuring the IAM roles attached to the instances", fr: "Configurer les rôles IAM attachés aux instances" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "For Amazon EC2, the customer controls network access to its instances, manages the credentials used to connect to them, manages the guest operating system and software, and configures the IAM roles attached to the instances and their permissions."
    fr: "Pour Amazon EC2, le client contrôle l'accès réseau à ses instances, gère les informations d'identification utilisées pour s'y connecter, gère le système d'exploitation invité et les logiciels, et configure les rôles IAM attachés aux instances ainsi que leurs autorisations."
  options:
    a:
      en: "Physical servers are part of the infrastructure that AWS protects and maintains."
      fr: "Les serveurs physiques font partie de l'infrastructure qu'AWS protège et entretient."
    b:
      en: "AWS manages the host operating system and the virtualization layer."
      fr: "AWS gère le système d'exploitation hôte et la couche de virtualisation."
    d:
      en: "AWS decommissions storage media using techniques detailed in NIST 800-88."
      fr: "AWS met hors service les supports de stockage avec des techniques décrites dans la norme NIST 800-88."
references:
  - title: Security in Amazon EC2
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security.html
