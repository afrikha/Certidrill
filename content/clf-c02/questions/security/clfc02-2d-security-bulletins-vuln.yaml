id: clfc02-2d-security-bulletins-vuln
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's security team wants to know when AWS publishes information about a newly reported vulnerability that affects AWS services, together with any action that customers should take. The team wants to subscribe to an RSS feed.

    Which resource should the team use?
  fr: |
    L'équipe de sécurité d'une entreprise veut savoir quand AWS publie des informations sur une vulnérabilité nouvellement signalée qui touche des services AWS, avec les éventuelles actions que les clients doivent entreprendre. L'équipe veut s'abonner à un flux RSS.

    Quelle ressource l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Knowledge Center", fr: "AWS Knowledge Center" }
    - id: b
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: c
      text: { en: "AWS Marketplace", fr: "AWS Marketplace" }
    - id: d
      text: { en: "AWS Security Bulletins", fr: "AWS Security Bulletins" }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS investigates reported vulnerabilities that affect its services and publishes Security Bulletins to help customers prioritize and fix known issues. Bulletins are marked Important when customers need to act, or Informational, and they are available through an RSS feed."
    fr: "AWS enquête sur les vulnérabilités signalées qui touchent ses services et publie des Security Bulletins pour aider les clients à hiérarchiser et corriger les problèmes connus. Les bulletins sont marqués Important quand les clients doivent agir, ou Informational, et ils sont disponibles par un flux RSS."
  options:
    a:
      en: "Knowledge Center answers frequent how-to questions; it is not the official channel for vulnerability notices."
      fr: "Knowledge Center répond aux questions pratiques fréquentes ; ce n'est pas le canal officiel des avis de vulnérabilité."
    b:
      en: "AWS Artifact provides compliance reports; it does not announce vulnerabilities."
      fr: "AWS Artifact fournit des rapports de conformité ; il n'annonce pas de vulnérabilités."
    c:
      en: "AWS Marketplace sells third-party products; it does not publish AWS vulnerability notices."
      fr: "AWS Marketplace vend des produits tiers ; il ne publie pas les avis de vulnérabilité d'AWS."
references:
  - title: "Security Bulletins"
    url: https://aws.amazon.com/security/security-bulletins/
