id: clfc02-2a-shift-most-customer-work
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which AWS service requires the customer to perform all the necessary security configuration and management tasks, including patching the guest operating system?
  fr: |
    Quel service AWS impose au client d'effectuer toutes les tâches de configuration et de gestion de la sécurité nécessaires, y compris l'application des correctifs au système d'exploitation invité ?
body:
  options:
    - id: a
      text: Amazon DynamoDB
    - id: b
      text: Amazon S3
    - id: c
      text: AWS Lambda
    - id: d
      text: Amazon EC2
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon EC2 is an infrastructure as a service (IaaS) offering: customers manage the guest operating system, including updates and security patches, the software they install, and the security groups of their instances."
    fr: "Amazon EC2 est une offre d'infrastructure en tant que service (IaaS) : les clients gèrent le système d'exploitation invité, y compris les mises à jour et les correctifs de sécurité, les logiciels qu'ils installent et les groupes de sécurité de leurs instances."
  options:
    a:
      en: "DynamoDB is an abstracted service: AWS operates the infrastructure, the operating system, and the platform."
      fr: "DynamoDB est un service abstrait : AWS exploite l'infrastructure, le système d'exploitation et la plateforme."
    b:
      en: "Amazon S3 is an abstracted service: customers only access endpoints to store and retrieve data."
      fr: "Amazon S3 est un service abstrait : les clients accèdent seulement à des points de terminaison pour stocker et récupérer les données."
    c:
      en: "Lambda manages the underlying infrastructure, including server maintenance and patching."
      fr: "Lambda gère l'infrastructure sous-jacente, y compris la maintenance et les correctifs des serveurs."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
