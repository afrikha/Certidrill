id: clfc02-2d-security-blog-posts
objective: "2.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security engineer wants to read articles by AWS experts about new security features, security announcements, and technical how-to walkthroughs.

    Which resource meets this need?
  fr: |
    Un ingénieur sécurité veut lire des articles d'experts AWS sur les nouvelles fonctions de sécurité, les annonces de sécurité et des procédures techniques détaillées.

    Quelle ressource répond à ce besoin ?
body:
  options:
    - id: a
      text: { en: "AWS Security Blog", fr: "AWS Security Blog" }
    - id: b
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: c
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
    - id: d
      text: { en: "AWS penetration testing policy", fr: "Politique de tests d'intrusion d'AWS" }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS Security Blog publishes posts by AWS experts about security, identity, and compliance, including announcements of new features and technical how-to posts at several levels, from foundational to expert."
    fr: "L'AWS Security Blog publie des articles d'experts AWS sur la sécurité, l'identité et la conformité, y compris des annonces de nouvelles fonctions et des articles techniques pratiques de plusieurs niveaux, du niveau fondamental au niveau expert."
  options:
    b:
      en: "AWS Artifact provides compliance reports and agreements, not articles about new features."
      fr: "AWS Artifact fournit des rapports de conformité et des accords, pas des articles sur les nouvelles fonctions."
    c:
      en: "Trusted Advisor checks an account against best practices; it does not publish articles."
      fr: "Trusted Advisor vérifie un compte par rapport aux bonnes pratiques ; il ne publie pas d'articles."
    d:
      en: "The penetration testing policy states what customers may test; it is not a source of feature announcements."
      fr: "La politique de tests d'intrusion indique ce que les clients peuvent tester ; ce n'est pas une source d'annonces de fonctions."
references:
  - title: "AWS Security Blog"
    url: https://aws.amazon.com/blogs/security/
