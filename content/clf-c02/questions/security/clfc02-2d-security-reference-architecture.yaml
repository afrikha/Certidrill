id: clfc02-2d-security-reference-architecture
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is deploying AWS security services across many accounts in AWS Organizations. The security team wants AWS guidance, with example code, that shows how to deploy these services in a multi-account environment.

    Which resource should the team use?
  fr: |
    Une entreprise déploie des services de sécurité AWS dans de nombreux comptes d'AWS Organizations. L'équipe de sécurité veut des recommandations AWS, avec des exemples de code, qui montrent comment déployer ces services dans un environnement multicompte.

    Quelle ressource l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "The AWS Security Reference Architecture (AWS SRA)", fr: "L'architecture de référence de sécurité AWS (AWS SRA)" }
    - id: b
      text: { en: "The security pillar of the AWS Well-Architected Framework", fr: "Le pilier Sécurité du framework AWS Well-Architected" }
    - id: c
      text: { en: "The AWS Security Incident Response Guide", fr: "Le guide AWS Security Incident Response Guide" }
    - id: d
      text: { en: "The compliance reports in AWS Artifact", fr: "Les rapports de conformité d'AWS Artifact" }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS SRA, published in AWS Prescriptive Guidance, provides an architecture, example code, and best practices for deploying AWS security services in a multi-account environment. It is written for organizations that deploy security services across many accounts."
    fr: "L'AWS SRA, publiée dans AWS Prescriptive Guidance, fournit une architecture, des exemples de code et des bonnes pratiques pour déployer les services de sécurité AWS dans un environnement multicompte. Elle s'adresse aux organisations qui déploient des services de sécurité dans de nombreux comptes."
  options:
    b:
      en: "The security pillar gives design principles and best practices, but it states that it does not provide implementation details or architectural patterns such as a multi-account deployment with example code."
      fr: "Le pilier Sécurité donne des principes de conception et des bonnes pratiques, mais il indique ne pas fournir de détails de mise en œuvre ni de modèles d'architecture comme un déploiement multicompte avec des exemples de code."
    c:
      en: "The incident response guide covers how to respond to security incidents, not how to deploy security services across accounts."
      fr: "Le guide de réponse aux incidents explique comment répondre aux incidents de sécurité, pas comment déployer les services de sécurité dans plusieurs comptes."
    d:
      en: "AWS Artifact reports show how AWS meets compliance standards; they are not deployment guidance."
      fr: "Les rapports d'AWS Artifact montrent comment AWS respecte les normes de conformité ; ce ne sont pas des recommandations de déploiement."
references:
  - title: "AWS Security Reference Architecture (AWS SRA) – core architecture"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/security-reference-architecture/welcome.html
  - title: "Security foundations"
    url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/security.html
