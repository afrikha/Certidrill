id: clfc02-2a-benefit-environmental
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's on-premises server room has had outages caused by power failures, and it has no automatic fire protection. Which benefit would the company get from AWS data centers?
  fr: |
    La salle de serveurs sur site d'une entreprise a subi des pannes causées par des coupures de courant, et elle n'a pas de protection automatique contre l'incendie. Quel avantage l'entreprise obtiendrait-elle des centres de données AWS ?
body:
  options:
    - id: a
      text: { en: "The company would install its own fire suppression system in the AWS facilities.", fr: "L'entreprise installerait son propre système d'extinction d'incendie dans les installations AWS." }
    - id: b
      text: { en: "AWS would supply backup generators to the company's server room.", fr: "AWS fournirait des générateurs de secours à la salle de serveurs de l'entreprise." }
    - id: c
      text: { en: "Power and fire protection would become a shared control to configure.", fr: "L'alimentation et la protection contre l'incendie deviendraient un contrôle partagé à configurer." }
    - id: d
      text: { en: "Redundant power and automatic fire suppression are built into AWS facilities.", fr: "Une alimentation redondante et une extinction automatique des incendies sont intégrées aux installations AWS." }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS data center power systems are fully redundant and maintainable without impact to operations, and the data centers have automatic fire detection and suppression equipment. Customers inherit these environmental controls."
    fr: "Les systèmes électriques des centres de données AWS sont entièrement redondants et peuvent être entretenus sans impact sur les opérations, et les centres de données disposent d'équipements automatiques de détection et d'extinction des incendies. Les clients héritent de ces contrôles environnementaux."
  options:
    a:
      en: "Customers do not install equipment in AWS facilities; environmental controls are provided by AWS."
      fr: "Les clients n'installent pas d'équipements dans les installations AWS ; les contrôles environnementaux sont fournis par AWS."
    b:
      en: "AWS secures its own facilities; it does not provide equipment to on-premises server rooms."
      fr: "AWS sécurise ses propres installations ; il ne fournit pas d'équipements aux salles de serveurs sur site."
    c:
      en: "Physical and environmental controls are inherited controls; the customer configures nothing for them."
      fr: "Les contrôles physiques et environnementaux sont des contrôles hérités ; le client n'a rien à configurer pour eux."
references:
  - title: Data Center - Our Controls
    url: https://aws.amazon.com/compliance/data-center/controls/
