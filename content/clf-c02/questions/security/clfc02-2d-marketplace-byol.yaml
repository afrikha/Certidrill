id: clfc02-2d-marketplace-byol
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company already owns licenses for a third-party endpoint protection product. It wants to run the vendor's product from AWS Marketplace on Amazon EC2 instances without buying new licenses.

    Which AWS Marketplace pricing model should the company look for?
  fr: |
    Une entreprise possède déjà des licences d'un produit tiers de protection des points de terminaison. Elle veut exécuter le produit de l'éditeur issu d'AWS Marketplace sur des instances Amazon EC2 sans acheter de nouvelles licences.

    Quel modèle de tarification d'AWS Marketplace l'entreprise doit-elle rechercher ?
body:
  options:
    - id: a
      text: { en: "Hourly pricing", fr: "Tarification horaire" }
    - id: b
      text: { en: "Free trial", fr: "Essai gratuit" }
    - id: c
      text: { en: "Bring Your Own License (BYOL)", fr: "Bring Your Own License (BYOL)" }
    - id: d
      text: { en: "Multi-year contract", fr: "Contrat pluriannuel" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Marketplace offers several pricing options, including a Bring Your Own License (BYOL) model. With a BYOL listing, the company uses the licenses that it already bought from the vendor instead of paying for the software again."
    fr: "AWS Marketplace propose plusieurs options de tarification, dont un modèle Bring Your Own License (BYOL). Avec une offre BYOL, l'entreprise utilise les licences qu'elle a déjà achetées à l'éditeur au lieu de payer à nouveau le logiciel."
  options:
    a:
      en: "Hourly pricing charges for the software by usage, so the company would pay again for licenses it already owns."
      fr: "La tarification horaire facture le logiciel à l'utilisation : l'entreprise paierait à nouveau des licences qu'elle possède déjà."
    b:
      en: "A free trial is temporary; it does not let the company keep using its existing licenses."
      fr: "Un essai gratuit est temporaire ; il ne permet pas à l'entreprise de continuer à utiliser ses licences existantes."
    d:
      en: "A multi-year contract is a new purchase from the vendor, not the use of existing licenses."
      fr: "Un contrat pluriannuel est un nouvel achat auprès de l'éditeur, pas l'utilisation de licences existantes."
references:
  - title: "What is AWS Marketplace?"
    url: https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html
