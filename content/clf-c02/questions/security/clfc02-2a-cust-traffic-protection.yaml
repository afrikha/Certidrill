id: clfc02-2a-cust-traffic-protection
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's web application runs on Amazon EC2 instances and receives personal data from users over the internet. Under the AWS shared responsibility model, who is responsible for encrypting this traffic, for example with TLS?
  fr: |
    L'application web d'une entreprise s'exécute sur des instances Amazon EC2 et reçoit des données personnelles d'utilisateurs via Internet. Selon le modèle de responsabilité partagée AWS, qui est responsable du chiffrement de ce trafic, par exemple avec TLS ?
body:
  options:
    - id: a
      text: { en: "AWS, because the traffic travels over the AWS global network", fr: "AWS, car le trafic transite par le réseau mondial d'AWS" }
    - id: b
      text: { en: "AWS, because the instances run in a VPC that AWS operates", fr: "AWS, car les instances s'exécutent dans un VPC exploité par AWS" }
    - id: c
      text: { en: "AWS and the company jointly, because encryption is an inherited control", fr: "AWS et l'entreprise conjointement, car le chiffrement est un contrôle hérité" }
    - id: d
      text: { en: "The company, because protecting its network traffic is its responsibility", fr: "L'entreprise, car la protection de son trafic réseau est de sa responsabilité" }
answer: { optionId: d }
explanation:
  correct:
    en: "Network traffic protection (encryption, integrity, identity) is in the customer portion of the model. The company chooses and configures encryption in transit for its application, using the features that AWS provides."
    fr: "La protection du trafic réseau (chiffrement, intégrité, identité) fait partie de la part du client dans le modèle. L'entreprise choisit et configure le chiffrement en transit de son application, avec les fonctionnalités fournies par AWS."
  options:
    a:
      en: "AWS secures its network infrastructure, but the protection of the customer's application traffic is the customer's choice."
      fr: "AWS sécurise son infrastructure réseau, mais la protection du trafic applicatif du client relève du choix du client."
    b:
      en: "The customer configures its VPC and decides how its application traffic is protected."
      fr: "Le client configure son VPC et décide de la façon dont son trafic applicatif est protégé."
    c:
      en: "Inherited controls are fully provided by AWS, such as physical controls; traffic encryption is configured by the customer."
      fr: "Les contrôles hérités sont entièrement fournis par AWS, comme les contrôles physiques ; le chiffrement du trafic est configuré par le client."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
