id: clfc02-2c-idc-access-portal
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's employees use AWS IAM Identity Center. Which IAM Identity Center component gives each employee one web page that lists all the AWS accounts and applications assigned to them?
  fr: |
    Les employés d'une entreprise utilisent AWS IAM Identity Center. Quel composant d'IAM Identity Center offre à chaque employé une page web unique qui liste tous les comptes AWS et toutes les applications qui lui sont attribués ?
body:
  options:
    - { id: a, text: { en: "Permission sets", fr: "Les ensembles d'autorisations" } }
    - { id: b, text: { en: "The identity source", fr: "La source d'identité" } }
    - { id: c, text: { en: "The AWS access portal", fr: "Le portail d'accès AWS" } }
    - { id: d, text: { en: "Trusted identity propagation", fr: "La propagation d'identité approuvée" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS access portal is a web portal where IAM Identity Center users find all the AWS accounts and applications assigned to them. From there they open an account or an application without signing in again."
    fr: "Le portail d'accès AWS est un portail web où les utilisateurs d'IAM Identity Center trouvent tous les comptes AWS et toutes les applications qui leur sont attribués. Ils y ouvrent un compte ou une application sans se reconnecter."
  options:
    a:
      en: "Permission sets define the permissions that users receive in AWS accounts; they are not the page where users see their assignments."
      fr: "Les ensembles d'autorisations définissent les autorisations que les utilisateurs reçoivent dans les comptes AWS ; ce n'est pas la page où ils voient leurs attributions."
    b:
      en: "The identity source is where users and groups are managed, such as the Identity Center directory or an external identity provider."
      fr: "La source d'identité est l'endroit où les utilisateurs et groupes sont gérés, comme le répertoire Identity Center ou un fournisseur d'identité externe."
    d:
      en: "Trusted identity propagation lets applications share a user's identity with other applications; it is not a user portal."
      fr: "La propagation d'identité approuvée permet aux applications de partager l'identité d'un utilisateur avec d'autres applications ; ce n'est pas un portail utilisateur."
references:
  - title: What is IAM Identity Center?
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
