id: clfc02-2c-idc-org-instance
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to use AWS IAM Identity Center to manage employee access to all the AWS accounts in its organization in AWS Organizations. How should the company enable IAM Identity Center?
  fr: |
    Une entreprise veut utiliser AWS IAM Identity Center pour gérer l'accès des employés à tous les comptes AWS de son organisation AWS Organizations. Comment l'entreprise doit-elle activer IAM Identity Center ?
body:
  options:
    - { id: a, text: { en: "As an account instance in each member account of the organization", fr: "Comme instance de compte dans chaque compte membre de l'organisation" } }
    - { id: b, text: { en: "As an organization instance in the management account of the organization", fr: "Comme instance d'organisation dans le compte de gestion de l'organisation" } }
    - { id: c, text: { en: "As an account instance in a dedicated security member account", fr: "Comme instance de compte dans un compte membre dédié à la sécurité" } }
    - { id: d, text: { en: "As an organization instance in each member account of the organization", fr: "Comme instance d'organisation dans chaque compte membre de l'organisation" } }
answer: { optionId: b }
explanation:
  correct:
    en: "An organization instance of IAM Identity Center is deployed in the AWS Organizations management account and is the only instance type that can manage access to AWS accounts. AWS recommends it for all production use."
    fr: "Une instance d'organisation d'IAM Identity Center est déployée dans le compte de gestion AWS Organizations ; c'est le seul type d'instance qui peut gérer l'accès aux comptes AWS. AWS la recommande pour toute utilisation en production."
  options:
    a:
      en: "An account instance is bound to the account where it is enabled and cannot manage access to AWS accounts; it is meant for isolated application deployments."
      fr: "Une instance de compte est liée au compte où elle est activée et ne peut pas gérer l'accès aux comptes AWS ; elle sert à des déploiements d'applications isolés."
    c:
      en: "An account instance cannot manage access to AWS accounts, wherever it is enabled."
      fr: "Une instance de compte ne peut pas gérer l'accès aux comptes AWS, quel que soit le compte où elle est activée."
    d:
      en: "An organization has a single organization instance, deployed in the management account, not one per member account."
      fr: "Une organisation a une seule instance d'organisation, déployée dans le compte de gestion, et non une par compte membre."
references:
  - title: What is IAM Identity Center?
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
