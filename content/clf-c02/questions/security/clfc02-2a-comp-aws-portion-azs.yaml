id: clfc02-2a-comp-aws-portion-azs
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which item is part of the AWS portion of the AWS shared responsibility model?
  fr: |
    Quel élément fait partie de la part d'AWS dans le modèle de responsabilité partagée AWS ?
body:
  options:
    - id: a
      text: { en: "Customer data", fr: "Les données du client" }
    - id: b
      text: { en: "Availability Zones", fr: "Les zones de disponibilité" }
    - id: c
      text: { en: "Firewall configuration", fr: "La configuration du pare-feu" }
    - id: d
      text: { en: "Identity and access management", fr: "La gestion des identités et des accès" }
answer: { optionId: b }
explanation:
  correct:
    en: "The AWS portion, security of the cloud, covers the global infrastructure (Regions, Availability Zones, and edge locations) and the hardware and software of the compute, storage, database, and networking services."
    fr: "La part d'AWS, la sécurité du cloud, couvre l'infrastructure mondiale (Régions, zones de disponibilité et emplacements périphériques) ainsi que le matériel et les logiciels des services de calcul, de stockage, de base de données et de réseau."
  options:
    a:
      en: "Customer data is at the top of the customer portion of the model."
      fr: "Les données du client sont en haut de la part du client dans le modèle."
    c:
      en: "Operating system, network, and firewall configuration is part of security in the cloud, which the customer handles."
      fr: "La configuration du système d'exploitation, du réseau et du pare-feu fait partie de la sécurité dans le cloud, assurée par le client."
    d:
      en: "Identity and access management of the customer's resources is the customer's responsibility."
      fr: "La gestion des identités et des accès aux ressources du client est de la responsabilité du client."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
