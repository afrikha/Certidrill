id: clfc02-2c-root-task-ri-seller
objective: "2.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to sell its unused Amazon EC2 Reserved Instances to other AWS customers. Which related task can only the root user perform?
  fr: |
    Une entreprise veut vendre ses instances réservées Amazon EC2 inutilisées à d'autres clients AWS. Quelle tâche associée seul l'utilisateur racine peut-il effectuer ?
body:
  options:
    - { id: a, text: { en: "Buy Reserved Instances in the Reserved Instance Marketplace", fr: "Acheter des instances réservées dans le Marketplace des instances réservées" } }
    - { id: b, text: { en: "Register as a seller in the Reserved Instance Marketplace", fr: "S'inscrire comme vendeur dans le Marketplace des instances réservées" } }
    - { id: c, text: { en: "Purchase a Compute Savings Plan for the AWS account", fr: "Acheter un Compute Savings Plan pour le compte AWS" } }
    - { id: d, text: { en: "Create a budget that tracks Reserved Instance usage", fr: "Créer un budget qui suit l'utilisation des instances réservées" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Registering as a seller in the Reserved Instance Marketplace is one of the tasks that require the root user credentials. After registration, the company can list its unused Reserved Instances for sale."
    fr: "L'inscription comme vendeur dans le Marketplace des instances réservées fait partie des tâches qui exigent les informations d'identification de l'utilisateur racine. Après l'inscription, l'entreprise peut mettre en vente ses instances réservées inutilisées."
  options:
    a:
      en: "Buying Reserved Instances needs only the right Amazon EC2 permissions, not the root user."
      fr: "Acheter des instances réservées ne nécessite que les bonnes autorisations Amazon EC2, pas l'utilisateur racine."
    c:
      en: "Savings Plans can be purchased by an IAM identity with the right permissions."
      fr: "Les Savings Plans peuvent être achetés par une identité IAM disposant des bonnes autorisations."
    d:
      en: "Budgets are created by IAM identities with AWS Budgets permissions; root is not needed."
      fr: "Les budgets sont créés par des identités IAM disposant d'autorisations AWS Budgets ; la racine n'est pas nécessaire."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
