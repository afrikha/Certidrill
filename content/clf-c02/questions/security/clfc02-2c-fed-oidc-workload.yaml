id: clfc02-2c-fed-oidc-workload
objective: "2.3.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs deployment workflows in GitHub Actions. The workflows need temporary AWS credentials, and the company does not want to store long-term access keys in GitHub. What should the company configure in IAM?
  fr: |
    Une entreprise exécute des workflows de déploiement dans GitHub Actions. Les workflows ont besoin d'informations d'identification AWS temporaires, et l'entreprise ne veut pas stocker de clés d'accès à long terme dans GitHub. Que doit configurer l'entreprise dans IAM ?
body:
  options:
    - { id: a, text: { en: "An OIDC identity provider and an IAM role that the workflows can assume", fr: "Un fournisseur d'identité OIDC et un rôle IAM que les workflows peuvent endosser" } }
    - { id: b, text: { en: "An IAM user whose access keys are stored as an encrypted GitHub secret", fr: "Un utilisateur IAM dont les clés d'accès sont stockées comme secret GitHub chiffré" } }
    - { id: c, text: { en: "An Amazon Cognito user pool with a user account for each workflow", fr: "Un groupe d'utilisateurs (user pool) Amazon Cognito avec un compte par workflow" } }
    - { id: d, text: { en: "An IAM Identity Center permission set assigned to the GitHub organization", fr: "Un ensemble d'autorisations IAM Identity Center attribué à l'organisation GitHub" } }
answer: { optionId: a }
explanation:
  correct:
    en: "IAM federation with OpenID Connect (OIDC) suits workloads outside AWS, such as GitHub Actions. The company creates an IAM OIDC identity provider that establishes trust with GitHub and a role that the workflows assume to receive temporary credentials."
    fr: "La fédération IAM avec OpenID Connect (OIDC) convient aux charges de travail hors d'AWS, comme GitHub Actions. L'entreprise crée un fournisseur d'identité OIDC IAM qui établit la confiance avec GitHub et un rôle que les workflows endossent pour recevoir des informations d'identification temporaires."
  options:
    b:
      en: "IAM user access keys are long-term credentials, which the company does not want to store, even encrypted."
      fr: "Les clés d'accès d'un utilisateur IAM sont des informations d'identification à long terme, que l'entreprise ne veut pas stocker, même chiffrées."
    c:
      en: "Cognito user pools sign in the users of web and mobile apps, not automated deployment workflows."
      fr: "Les groupes d'utilisateurs Cognito gèrent la connexion des utilisateurs d'applications web et mobiles, pas des workflows de déploiement automatisés."
    d:
      en: "Permission sets are assigned to workforce users and groups of IAM Identity Center, not to external CI/CD systems."
      fr: "Les ensembles d'autorisations sont attribués aux utilisateurs et groupes du personnel dans IAM Identity Center, pas à des systèmes CI/CD externes."
references:
  - title: Identity providers and federation into AWS
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html
