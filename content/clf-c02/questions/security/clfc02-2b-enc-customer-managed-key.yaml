id: clfc02-2b-enc-customer-managed-key
objective: "2.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company encrypts data with AWS KMS. Its security policy requires the company to define in the key policy who can use each key, and to be able to disable any key at any time.

    Which type of key should the company use?
  fr: |
    Une entreprise chiffre ses données avec AWS KMS. Sa politique de sécurité exige qu'elle définisse dans la politique de clé qui peut utiliser chaque clé, et qu'elle puisse désactiver n'importe quelle clé à tout moment.

    Quel type de clé l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Amazon S3 managed keys (SSE-S3)", fr: "Des clés gérées par Amazon S3 (SSE-S3)" }
    - id: b
      text: { en: "AWS owned keys", fr: "Des clés détenues par AWS" }
    - id: c
      text: { en: "Customer managed keys", fr: "Des clés gérées par le client" }
    - id: d
      text: { en: "AWS managed keys", fr: "Des clés gérées par AWS" }
answer: { optionId: c }
explanation:
  correct:
    en: "Customer managed keys are KMS keys that the customer creates, owns and manages. The customer has full control over them: it sets their key policies, enables or disables them, configures rotation and can schedule their deletion."
    fr: "Les clés gérées par le client sont des clés KMS que le client crée, possède et gère. Le client en a le contrôle total : il définit leurs politiques de clé, les active ou les désactive, configure leur rotation et peut planifier leur suppression."
  options:
    a:
      en: "With SSE-S3, Amazon S3 manages the keys entirely; the customer cannot set key policies or disable them."
      fr: "Avec SSE-S3, Amazon S3 gère entièrement les clés ; le client ne peut ni définir de politiques de clé ni les désactiver."
    b:
      en: "AWS owned keys are owned and managed by AWS services and are not visible in the customer's account."
      fr: "Les clés détenues par AWS sont possédées et gérées par les services AWS et ne sont pas visibles dans le compte du client."
    d:
      en: "AWS managed keys are in the customer's account, but the customer can only view their key policies; it cannot change them or disable the keys."
      fr: "Les clés gérées par AWS se trouvent dans le compte du client, mais celui-ci peut seulement consulter leurs politiques de clé ; il ne peut ni les modifier ni désactiver les clés."
references:
  - title: "AWS KMS keys"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html
