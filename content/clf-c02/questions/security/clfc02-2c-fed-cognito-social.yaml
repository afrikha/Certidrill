id: clfc02-2c-fed-cognito-social
objective: "2.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is building a mobile app. Customers must be able to sign in with their existing Google or Facebook accounts and then upload photos to Amazon S3. Which AWS service should the company use?
  fr: |
    Une entreprise développe une application mobile. Les clients doivent pouvoir se connecter avec leurs comptes Google ou Facebook existants, puis charger des photos dans Amazon S3. Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "AWS IAM Identity Center" }
    - { id: b, text: "AWS Directory Service" }
    - { id: c, text: "Amazon Cognito" }
    - { id: d, text: "AWS Secrets Manager" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Cognito adds sign-up and sign-in to web and mobile apps and supports federation with social identity providers such as Google, Facebook and Amazon. Cognito identity pools then give the signed-in users temporary AWS credentials to reach resources such as Amazon S3."
    fr: "Amazon Cognito ajoute l'inscription et la connexion aux applications web et mobiles et prend en charge la fédération avec des fournisseurs d'identité sociaux comme Google, Facebook et Amazon. Les groupes d'identités (identity pools) Cognito donnent ensuite aux utilisateurs connectés des informations d'identification AWS temporaires pour accéder à des ressources comme Amazon S3."
  options:
    a:
      en: "IAM Identity Center is designed for a company's workforce users, not for the customers of a mobile app."
      fr: "IAM Identity Center est conçu pour le personnel d'une entreprise, pas pour les clients d'une application mobile."
    b:
      en: "Directory Service provides managed Active Directory directories for corporate users; it does not federate social accounts for app customers."
      fr: "Directory Service fournit des annuaires Active Directory gérés pour les utilisateurs d'entreprise ; il ne fédère pas les comptes sociaux des clients d'une application."
    d:
      en: "Secrets Manager stores secrets for applications; it does not sign users in."
      fr: "Secrets Manager stocke des secrets pour les applications ; il ne gère pas la connexion des utilisateurs."
references:
  - title: Identity providers and federation into AWS
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html
