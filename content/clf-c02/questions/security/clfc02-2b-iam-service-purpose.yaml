id: clfc02-2b-iam-service-purpose
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which AWS service lets a company control who can sign in to its AWS account (authentication) and what they are allowed to do with its resources (authorization)?
  fr: |
    Quel service AWS permet à une entreprise de contrôler qui peut se connecter à son compte AWS (authentification) et ce que ces personnes sont autorisées à faire avec ses ressources (autorisation) ?
body:
  options:
    - id: a
      text: { en: "AWS Config", fr: "AWS Config" }
    - id: b
      text: { en: "AWS Identity and Access Management (IAM)", fr: "AWS Identity and Access Management (IAM)" }
    - id: c
      text: { en: "AWS Shield", fr: "AWS Shield" }
    - id: d
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
answer: { optionId: b }
explanation:
  correct:
    en: "IAM is the web service that securely controls access to AWS resources. It manages who is authenticated (signed in) and authorized (has permissions) to use resources in the account."
    fr: "IAM est le service web qui contrôle de manière sécurisée l'accès aux ressources AWS. Il gère qui est authentifié (connecté) et autorisé (dispose d'autorisations) à utiliser les ressources du compte."
  options:
    a:
      en: "AWS Config records and evaluates resource configurations; it does not authenticate users."
      fr: "AWS Config enregistre et évalue la configuration des ressources ; il n'authentifie pas les utilisateurs."
    c:
      en: "Shield protects against DDoS attacks; it does not manage identities or permissions."
      fr: "Shield protège contre les attaques DDoS ; il ne gère pas les identités ni les autorisations."
    d:
      en: "AWS Artifact provides compliance reports and agreements; it does not control access to resources."
      fr: "AWS Artifact fournit des rapports de conformité et des accords ; il ne contrôle pas l'accès aux ressources."
references:
  - title: "What is IAM?"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html
