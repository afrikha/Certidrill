id: clfc02-2d-detective-root-cause
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security analyst receives an Amazon GuardDuty finding about unusual API calls made by an IAM role. The analyst needs to investigate the root cause by viewing the related activity and the interactions between resources over time.

    Which AWS service should the analyst use?
  fr: |
    Un analyste de sécurité reçoit un résultat Amazon GuardDuty sur des appels d'API inhabituels effectués par un rôle IAM. L'analyste doit enquêter sur la cause première en consultant l'activité associée et les interactions entre les ressources au fil du temps.

    Quel service AWS l'analyste doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" }
    - id: b
      text: { en: "Amazon Detective", fr: "Amazon Detective" }
    - id: c
      text: { en: "Amazon Inspector", fr: "Amazon Inspector" }
    - id: d
      text: { en: "Amazon Macie", fr: "Amazon Macie" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Detective helps identify the root cause of security findings. It automatically extracts events from CloudTrail and VPC flow logs, ingests GuardDuty findings, and uses machine learning and visualization to build a behavior graph of resource activity over time. The analyst can pivot directly from the GuardDuty finding into Detective."
    fr: "Amazon Detective aide à identifier la cause première des résultats de sécurité. Il extrait automatiquement les événements de CloudTrail et des journaux de flux VPC, ingère les résultats GuardDuty et utilise l'apprentissage automatique et la visualisation pour construire un graphe de comportement de l'activité des ressources au fil du temps. L'analyste peut passer directement du résultat GuardDuty à Detective."
  options:
    a:
      en: "CloudTrail records the API calls, but it does not correlate them with findings or visualize resource interactions; the analyst would have to analyze the raw events manually."
      fr: "CloudTrail enregistre les appels d'API, mais il ne les met pas en corrélation avec les résultats et ne visualise pas les interactions entre ressources : l'analyste devrait analyser manuellement les événements bruts."
    c:
      en: "Amazon Inspector scans for software vulnerabilities; it does not investigate API activity."
      fr: "Amazon Inspector recherche des vulnérabilités logicielles ; il n'enquête pas sur l'activité des API."
    d:
      en: "Macie discovers sensitive data in Amazon S3; it does not investigate GuardDuty findings."
      fr: "Macie découvre les données sensibles dans Amazon S3 ; il n'enquête pas sur les résultats GuardDuty."
references:
  - title: "What is Amazon Detective?"
    url: https://docs.aws.amazon.com/detective/latest/userguide/what-is-detective.html
