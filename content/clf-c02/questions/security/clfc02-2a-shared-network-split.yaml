id: clfc02-2a-shared-network-split
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company must protect its Amazon EC2 instances from unwanted network traffic. How is network security divided between AWS and the company?
  fr: |
    Une entreprise doit protéger ses instances Amazon EC2 contre le trafic réseau indésirable. Comment la sécurité du réseau est-elle répartie entre AWS et l'entreprise ?
body:
  options:
    - id: a
      text: { en: "AWS configures the security groups of the instances, and the company protects the AWS network.", fr: "AWS configure les groupes de sécurité des instances, et l'entreprise protège le réseau AWS." }
    - id: b
      text: { en: "AWS protects its network and configures the instance security groups for the company.", fr: "AWS protège son réseau et configure les groupes de sécurité des instances pour l'entreprise." }
    - id: c
      text: { en: "AWS protects the network infrastructure, and the company configures its VPC and security groups.", fr: "AWS protège l'infrastructure réseau, et l'entreprise configure son VPC et ses groupes de sécurité." }
    - id: d
      text: { en: "The company protects the network infrastructure and also configures its security groups.", fr: "L'entreprise protège l'infrastructure réseau et configure aussi ses groupes de sécurité." }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS protects the networking that runs AWS Cloud services. The customer controls network access to its instances, for example by configuring its VPC and the security groups of the instances."
    fr: "AWS protège le réseau qui exécute les services du Cloud AWS. Le client contrôle l'accès réseau à ses instances, par exemple en configurant son VPC et les groupes de sécurité des instances."
  options:
    a:
      en: "This reverses the split: AWS protects its network, and the customer configures its security groups."
      fr: "Cela inverse la répartition : AWS protège son réseau, et le client configure ses groupes de sécurité."
    b:
      en: "AWS provides security groups, but their rules are configured by the customer."
      fr: "AWS fournit les groupes de sécurité, mais leurs règles sont configurées par le client."
    d:
      en: "The network infrastructure that runs AWS services is protected by AWS, not by the customer."
      fr: "L'infrastructure réseau qui exécute les services AWS est protégée par AWS, pas par le client."
references:
  - title: Security in Amazon EC2
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security.html
