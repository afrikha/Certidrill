id: clfc02-2b-gov-config-history
objective: "2.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company must be able to see what the configuration of a security group was at a specific point in the past, and keep a history of the changes to its AWS resources.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise doit pouvoir consulter la configuration qu'avait un groupe de sécurité à un moment précis du passé, et conserver l'historique des modifications de ses ressources AWS.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Config", fr: "AWS Config" }
    - id: b
      text: { en: "Amazon CloudWatch", fr: "Amazon CloudWatch" }
    - id: c
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: d
      text: { en: "AWS CloudTrail", fr: "AWS CloudTrail" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Config records the configuration of supported AWS resources as configuration items and keeps their configuration history. The company can view what a resource's configuration was at any point in time and how it changed."
    fr: "AWS Config enregistre la configuration des ressources AWS prises en charge sous forme d'éléments de configuration et conserve leur historique de configuration. L'entreprise peut voir la configuration d'une ressource à tout moment et comment elle a évolué."
  options:
    b:
      en: "CloudWatch monitors metrics and logs; it does not keep the configuration history of resources."
      fr: "CloudWatch surveille des métriques et des journaux ; il ne conserve pas l'historique de configuration des ressources."
    c:
      en: "AWS Artifact provides AWS compliance reports, not the configuration of the company's resources."
      fr: "AWS Artifact fournit les rapports de conformité d'AWS, pas la configuration des ressources de l'entreprise."
    d:
      en: "CloudTrail records the API calls that changed a resource and who made them, but not the resulting configuration of the resource at a point in time."
      fr: "CloudTrail enregistre les appels d'API qui ont modifié une ressource et leurs auteurs, mais pas la configuration résultante de la ressource à un moment donné."
references:
  - title: "What Is AWS Config?"
    url: https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html
