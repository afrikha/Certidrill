id: clfc02-2b-cinfo-artifact-documents
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two types of documents can a company obtain from AWS Artifact? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux types de documents qu'une entreprise peut obtenir depuis AWS Artifact ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The results of the AWS Trusted Advisor checks of the account", fr: "Les résultats des vérifications AWS Trusted Advisor du compte" }
    - id: b
      text: { en: "The compliance timeline of the company's resources in AWS Config", fr: "La chronologie de conformité des ressources de l'entreprise dans AWS Config" }
    - id: c
      text: { en: "The CloudTrail log files of the company's account", fr: "Les fichiers journaux CloudTrail du compte de l'entreprise" }
    - id: d
      text: { en: "AWS audit reports and certifications, such as SOC reports and ISO certificates", fr: "Les rapports d'audit et certifications d'AWS, comme les rapports SOC et les certificats ISO" }
    - id: e
      text: { en: "Agreements with AWS, such as the Business Associate Addendum (BAA)", fr: "Les accords avec AWS, comme le Business Associate Addendum (BAA)" }
answer: { optionIds: [ d, e ] }
explanation:
  correct:
    en: "AWS Artifact has two main parts: Artifact Reports, with the reports and certifications from third-party auditors of AWS, and Artifact Agreements, where customers review, accept and manage agreements with AWS such as the BAA."
    fr: "AWS Artifact comprend deux parties principales : Artifact Reports, avec les rapports et certifications des auditeurs tiers d'AWS, et Artifact Agreements, où les clients consultent, acceptent et gèrent des accords avec AWS comme le BAA."
  options:
    a:
      en: "Trusted Advisor results are viewed in Trusted Advisor; they are recommendations, not compliance documents."
      fr: "Les résultats de Trusted Advisor se consultent dans Trusted Advisor ; ce sont des recommandations, pas des documents de conformité."
    b:
      en: "The compliance timeline is viewed in the AWS Config console; it concerns the company's resources, not AWS's compliance."
      fr: "La chronologie de conformité se consulte dans la console AWS Config ; elle concerne les ressources de l'entreprise, pas la conformité d'AWS."
    c:
      en: "CloudTrail log files are delivered by a trail to the company's Amazon S3 bucket, not through AWS Artifact."
      fr: "Les fichiers journaux CloudTrail sont livrés par un journal de suivi dans le compartiment Amazon S3 de l'entreprise, pas par AWS Artifact."
references:
  - title: "What is AWS Artifact?"
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
