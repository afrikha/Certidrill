id: clfc02-2b-gov-control-tower
objective: "2.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is planning a new multi-account AWS environment. It wants to set up the environment according to AWS best practices and apply preventive and detective controls across all accounts with as little manual work as possible.

    Which AWS service should the company use?
  fr: |
    Une entreprise prévoit un nouvel environnement AWS multicompte. Elle veut le configurer selon les bonnes pratiques AWS et appliquer des contrôles préventifs et de détection à tous les comptes avec le moins de travail manuel possible.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Trusted Advisor", fr: "AWS Trusted Advisor" }
    - id: b
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: c
      text: { en: "AWS Control Tower", fr: "AWS Control Tower" }
    - id: d
      text: { en: "Amazon CloudWatch", fr: "Amazon CloudWatch" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Control Tower sets up and governs a multi-account environment, called a landing zone, by following prescriptive best practices. It applies controls to the organizational units: preventive controls (for example SCPs) and detective controls (for example AWS Config rules)."
    fr: "AWS Control Tower configure et gouverne un environnement multicompte, appelé zone d'atterrissage, selon des bonnes pratiques prescriptives. Il applique des contrôles aux unités d'organisation : des contrôles préventifs (par exemple des SCP) et des contrôles de détection (par exemple des règles AWS Config)."
  options:
    a:
      en: "Trusted Advisor gives recommendations for existing accounts; it does not set up accounts or apply controls."
      fr: "Trusted Advisor donne des recommandations pour les comptes existants ; il ne configure pas de comptes et n'applique pas de contrôles."
    b:
      en: "AWS Artifact provides compliance reports and agreements; it does not govern accounts."
      fr: "AWS Artifact fournit des rapports de conformité et des accords ; il ne gouverne pas les comptes."
    d:
      en: "CloudWatch monitors metrics and logs; it does not set up a governed multi-account environment."
      fr: "CloudWatch surveille des métriques et des journaux ; il ne configure pas d'environnement multicompte gouverné."
references:
  - title: "What Is AWS Control Tower?"
    url: https://docs.aws.amazon.com/controltower/latest/userguide/what-is-control-tower.html
