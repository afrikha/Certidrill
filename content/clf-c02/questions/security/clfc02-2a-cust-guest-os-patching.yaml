id: clfc02-2a-cust-guest-os-patching
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs its applications on Amazon EC2 instances. Which task is the company's responsibility under the AWS shared responsibility model?
  fr: |
    Une entreprise exécute ses applications sur des instances Amazon EC2. Quelle tâche relève de la responsabilité de l'entreprise selon le modèle de responsabilité partagée AWS ?
body:
  options:
    - id: a
      text: { en: "Patching the host operating system of the physical servers", fr: "Appliquer les correctifs au système d'exploitation hôte des serveurs physiques" }
    - id: b
      text: { en: "Applying security patches to the guest operating system", fr: "Appliquer les correctifs de sécurité au système d'exploitation invité" }
    - id: c
      text: { en: "Replacing failed hardware in the AWS data centers", fr: "Remplacer le matériel défaillant dans les centres de données AWS" }
    - id: d
      text: { en: "Maintaining the virtualization layer of the EC2 hosts", fr: "Maintenir la couche de virtualisation des hôtes EC2" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EC2 is an infrastructure service: the customer manages the guest operating system, including updates and security patches, and the software it installs on the instances."
    fr: "Amazon EC2 est un service d'infrastructure : le client gère le système d'exploitation invité, y compris les mises à jour et les correctifs de sécurité, ainsi que les logiciels qu'il installe sur les instances."
  options:
    a:
      en: "AWS manages the stack from the host operating system and virtualization layer down to the facilities."
      fr: "AWS gère la pile depuis le système d'exploitation hôte et la couche de virtualisation jusqu'aux installations."
    c:
      en: "The hardware that runs AWS services is part of the infrastructure that AWS protects and maintains."
      fr: "Le matériel qui exécute les services AWS fait partie de l'infrastructure qu'AWS protège et entretient."
    d:
      en: "The virtualization layer is managed by AWS, below the guest operating system."
      fr: "La couche de virtualisation est gérée par AWS, sous le système d'exploitation invité."
references:
  - title: Security in Amazon EC2
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security.html
