id: clfc02-2c-ak-components
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer creates an access key for an IAM user to make AWS CLI calls. Which values make up the access key?
  fr: |
    Un développeur crée une clé d'accès pour un utilisateur IAM afin d'effectuer des appels avec l'AWS CLI. Quelles valeurs composent la clé d'accès ?
body:
  options:
    - { id: a, text: { en: "A user name and a console password", fr: "Un nom d'utilisateur et un mot de passe de console" } }
    - { id: b, text: { en: "An MFA device serial number and a code", fr: "Un numéro de série d'appareil MFA et un code" } }
    - { id: c, text: { en: "An access key ID and a secret access key", fr: "Un ID de clé d'accès et une clé d'accès secrète" } }
    - { id: d, text: { en: "A key pair name and a private key file", fr: "Un nom de paire de clés et un fichier de clé privée" } }
answer: { optionId: c }
explanation:
  correct:
    en: "An access key is a long-term credential made of an access key ID and a secret access key, which must be used together to sign programmatic requests through the AWS CLI, SDKs or API. AWS recommends temporary credentials, such as IAM roles, where possible."
    fr: "Une clé d'accès est une information d'identification à long terme composée d'un ID de clé d'accès et d'une clé d'accès secrète, utilisés ensemble pour signer les requêtes programmatiques via l'AWS CLI, les SDK ou l'API. AWS recommande des informations d'identification temporaires, comme les rôles IAM, lorsque c'est possible."
  options:
    a:
      en: "A user name and password are used to sign in to the AWS Management Console, not to sign CLI requests."
      fr: "Un nom d'utilisateur et un mot de passe servent à se connecter à l'AWS Management Console, pas à signer les requêtes de la CLI."
    b:
      en: "An MFA device adds a sign-in factor; it is not part of an access key."
      fr: "Un appareil MFA ajoute un facteur de connexion ; il ne fait pas partie d'une clé d'accès."
    d:
      en: "A key pair is used to connect to Amazon EC2 instances, not to authenticate AWS CLI calls."
      fr: "Une paire de clés sert à se connecter aux instances Amazon EC2, pas à authentifier les appels de l'AWS CLI."
references:
  - title: Manage access keys for IAM users
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
