id: clfc02-2a-shared-rds-configuration
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Configuration management is a shared control in the AWS shared responsibility model. A company uses Amazon RDS. Which configuration task is the company's part of this control?
  fr: |
    La gestion de la configuration est un contrôle partagé dans le modèle de responsabilité partagée AWS. Une entreprise utilise Amazon RDS. Quelle tâche de configuration constitue la part de l'entreprise dans ce contrôle ?
body:
  options:
    - id: a
      text: { en: "Configuring the host operating system of the database servers", fr: "Configurer le système d'exploitation hôte des serveurs de base de données" }
    - id: b
      text: { en: "Configuring the AWS network devices that connect the servers", fr: "Configurer les équipements réseau AWS qui relient les serveurs" }
    - id: c
      text: { en: "Using the engine's security features to control database logins", fr: "Utiliser les fonctionnalités de sécurité du moteur pour contrôler les connexions aux bases de données" }
    - id: d
      text: { en: "Configuring security access for the backup processes of RDS", fr: "Configurer l'accès de sécurité des processus de sauvegarde de RDS" }
answer: { optionId: c }
explanation:
  correct:
    en: "In configuration management, AWS configures its infrastructure devices and customers configure their own guest operating systems, databases, and applications. With RDS, the company uses the security features of its DB engine to control who can log in to the databases."
    fr: "Pour la gestion de la configuration, AWS configure ses équipements d'infrastructure et les clients configurent leurs propres systèmes d'exploitation invités, bases de données et applications. Avec RDS, l'entreprise utilise les fonctionnalités de sécurité de son moteur de base de données pour contrôler qui peut se connecter aux bases de données."
  options:
    a:
      en: "RDS is a managed service: AWS manages the operating system of the database hosts."
      fr: "RDS est un service géré : AWS gère le système d'exploitation des hôtes de base de données."
    b:
      en: "Infrastructure devices are configured by AWS."
      fr: "Les équipements d'infrastructure sont configurés par AWS."
    d:
      en: "Customers do not configure security access for processes that RDS manages, such as creating backups."
      fr: "Les clients ne configurent pas l'accès de sécurité des processus gérés par RDS, comme la création des sauvegardes."
references:
  - title: Security in Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.html
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
