id: clfc02-2d-knowledge-center-faq
objective: "2.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer wants official AWS articles and videos that answer common customer questions, such as how to troubleshoot an Access Denied error in Amazon S3.

    Which resource should the developer use?
  fr: |
    Un développeur veut des articles et vidéos AWS officiels qui répondent aux questions fréquentes des clients, comme la façon de résoudre une erreur Access Denied dans Amazon S3.

    Quelle ressource le développeur doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Security Bulletins", fr: "AWS Security Bulletins" }
    - id: b
      text: { en: "AWS Artifact", fr: "AWS Artifact" }
    - id: c
      text: { en: "AWS Knowledge Center", fr: "AWS Knowledge Center" }
    - id: d
      text: { en: "AWS Marketplace", fr: "AWS Marketplace" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Knowledge Center, part of AWS re:Post, contains official AWS articles and videos that cover the most frequent questions and requests that AWS receives from customers. It is the place for how-to and troubleshooting answers about specific services."
    fr: "AWS Knowledge Center, qui fait partie d'AWS re:Post, contient des articles et vidéos AWS officiels qui couvrent les questions et demandes les plus fréquentes qu'AWS reçoit de ses clients. C'est l'endroit où trouver des réponses pratiques et de dépannage sur des services précis."
  options:
    a:
      en: "Security Bulletins announce vulnerabilities that affect AWS services; they do not answer troubleshooting questions."
      fr: "Les Security Bulletins annoncent les vulnérabilités qui touchent les services AWS ; ils ne répondent pas aux questions de dépannage."
    b:
      en: "AWS Artifact provides compliance reports and agreements, not how-to articles."
      fr: "AWS Artifact fournit des rapports de conformité et des accords, pas des articles pratiques."
    d:
      en: "AWS Marketplace sells third-party software; it is not a troubleshooting resource."
      fr: "AWS Marketplace vend des logiciels tiers ; ce n'est pas une ressource de dépannage."
references:
  - title: "Knowledge Center"
    url: https://repost.aws/knowledge-center
