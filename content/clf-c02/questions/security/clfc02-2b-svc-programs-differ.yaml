id: clfc02-2b-svc-programs-differ
objective: "2.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement about AWS compliance programs is correct?
  fr: |
    Quelle affirmation sur les programmes de conformité d'AWS est correcte ?
body:
  options:
    - id: a
      text: { en: "AWS compliance programs apply only to the AWS Regions located in the United States.", fr: "Les programmes de conformité d'AWS ne s'appliquent qu'aux Régions AWS situées aux États-Unis." }
    - id: b
      text: { en: "Every AWS service is covered by every compliance program as soon as the service is released.", fr: "Chaque service AWS est couvert par tous les programmes de conformité dès sa mise à disposition." }
    - id: c
      text: { en: "AWS compliance reports are available only to customers with an Enterprise Support plan.", fr: "Les rapports de conformité d'AWS ne sont disponibles que pour les clients ayant un plan Enterprise Support." }
    - id: d
      text: { en: "Each program covers a specific list of AWS services, and the list can differ from one program to another.", fr: "Chaque programme couvre une liste précise de services AWS, et cette liste peut varier d'un programme à l'autre." }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS assesses services program by program, so a service can be in scope for one program, such as SOC, and not yet for another, such as FedRAMP. Customers check the services in scope of each program they need before using a service for a regulated workload."
    fr: "AWS évalue les services programme par programme : un service peut entrer dans le périmètre d'un programme, comme SOC, sans être encore couvert par un autre, comme FedRAMP. Les clients vérifient les services couverts par chaque programme dont ils ont besoin avant d'utiliser un service pour une charge de travail réglementée."
  options:
    a:
      en: "AWS has global, regional and country-specific programs, such as ISO certifications, GDPR resources and C5 in Germany."
      fr: "AWS dispose de programmes mondiaux, régionaux et nationaux, comme les certifications ISO, les ressources RGPD et C5 en Allemagne."
    b:
      en: "New services are added to the scope of programs over time; they are not covered by every program at release."
      fr: "Les nouveaux services sont ajoutés au périmètre des programmes au fil du temps ; ils ne sont pas couverts par tous les programmes dès leur sortie."
    c:
      en: "AWS Artifact provides compliance reports to all customers at no cost, whatever their Support plan."
      fr: "AWS Artifact fournit les rapports de conformité à tous les clients sans frais, quel que soit leur plan de support."
references:
  - title: "AWS Services in Scope by Compliance Program"
    url: https://aws.amazon.com/compliance/services-in-scope/
