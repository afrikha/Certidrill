id: clfc02-2c-root-two-person
objective: "2.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to make sure that no single employee can sign in as the root user of its AWS account. Which approach follows AWS recommendations?
  fr: |
    Une entreprise veut s'assurer qu'aucun employé ne puisse se connecter seul en tant qu'utilisateur racine de son compte AWS. Quelle approche suit les recommandations AWS ?
body:
  options:
    - { id: a, text: { en: "Give the password and the MFA device to the same trusted administrator.", fr: "Confier le mot de passe et l'appareil MFA au même administrateur de confiance." } }
    - { id: b, text: { en: "Have one group keep the password and another group keep the MFA device.", fr: "Faire conserver le mot de passe par un groupe et l'appareil MFA par un autre groupe." } }
    - { id: c, text: { en: "Attach a policy to the root user that requires approval for each sign-in.", fr: "Attacher à l'utilisateur racine une politique qui exige une approbation à chaque connexion." } }
    - { id: d, text: { en: "Change the root password after every sign-in and email it to the team.", fr: "Changer le mot de passe racine après chaque connexion et l'envoyer par e-mail à l'équipe." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS recommends multi-person approval for the root user: one group holds the password and another holds the MFA device. A member of each group must work together to sign in, so no single person can use the root user alone."
    fr: "AWS recommande une approbation multipersonne pour l'utilisateur racine : un groupe détient le mot de passe et un autre l'appareil MFA. Un membre de chaque groupe doit coopérer pour se connecter : personne ne peut utiliser seul l'utilisateur racine."
  options:
    a:
      en: "One person holding both the password and the MFA device can sign in alone, which is what the company wants to prevent."
      fr: "Une personne qui détient à la fois le mot de passe et l'appareil MFA peut se connecter seule, ce que l'entreprise veut empêcher."
    c:
      en: "IAM policies cannot be attached to the root user, and no policy adds a sign-in approval step."
      fr: "Les politiques IAM ne peuvent pas être attachées à l'utilisateur racine, et aucune politique n'ajoute d'étape d'approbation à la connexion."
    d:
      en: "Emailing the password to the team lets any team member who also has the MFA device sign in alone."
      fr: "Envoyer le mot de passe à l'équipe permet à tout membre qui a aussi l'appareil MFA de se connecter seul."
references:
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
