id: clfc02-2b-svc-ebs-encryption-default
objective: "2.2.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's compliance policy requires that all stored data be encrypted at rest. The company has not changed any encryption setting in its AWS account or Regions.

    For which new data must the company take action to meet this policy?
  fr: |
    La politique de conformité d'une entreprise exige que toutes les données stockées soient chiffrées au repos. L'entreprise n'a modifié aucun paramètre de chiffrement dans son compte AWS ni dans ses Régions.

    Pour quelles nouvelles données l'entreprise doit-elle agir pour respecter cette politique ?
body:
  options:
    - id: a
      text: { en: "New objects uploaded to Amazon S3 buckets", fr: "Les nouveaux objets chargés dans des compartiments Amazon S3" }
    - id: b
      text: { en: "Data written to new Amazon EBS volumes", fr: "Les données écrites sur de nouveaux volumes Amazon EBS" }
    - id: c
      text: { en: "Log files that a CloudTrail trail delivers to Amazon S3", fr: "Les fichiers journaux qu'un journal de suivi CloudTrail livre dans Amazon S3" }
    - id: d
      text: { en: "Items written to new Amazon DynamoDB tables", fr: "Les éléments écrits dans de nouvelles tables Amazon DynamoDB" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EBS encrypts new volumes automatically only when encryption by default is enabled, and this is a Region-specific setting that the customer turns on. Otherwise, encryption must be specified when each volume is created, so the company must act for EBS."
    fr: "Amazon EBS ne chiffre automatiquement les nouveaux volumes que lorsque le chiffrement par défaut est activé, et il s'agit d'un paramètre propre à chaque Région que le client active. Sinon, le chiffrement doit être indiqué à la création de chaque volume : l'entreprise doit agir pour EBS."
  options:
    a:
      en: "Amazon S3 encrypts every new object at rest with SSE-S3 by default."
      fr: "Amazon S3 chiffre par défaut chaque nouvel objet au repos avec SSE-S3."
    c:
      en: "The trail stores its log files as objects in an S3 bucket, and S3 encrypts new objects with SSE-S3 by default."
      fr: "Le journal de suivi stocke ses fichiers journaux comme objets dans un compartiment S3, et S3 chiffre par défaut les nouveaux objets avec SSE-S3."
    d:
      en: "All user data stored in DynamoDB is fully encrypted at rest by default, with an AWS owned key unless another key type is chosen."
      fr: "Toutes les données utilisateur stockées dans DynamoDB sont entièrement chiffrées au repos par défaut, avec une clé détenue par AWS sauf si un autre type de clé est choisi."
references:
  - title: "Enable Amazon EBS encryption by default"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/encryption-by-default.html
  - title: "Setting default server-side encryption behavior for Amazon S3 buckets"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-encryption.html
