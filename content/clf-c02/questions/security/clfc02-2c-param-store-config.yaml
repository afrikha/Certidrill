id: clfc02-2c-param-store-config
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to store application configuration values, such as endpoint URLs and AMI IDs, in one central place. The values are not credentials and do not need rotation. Which AWS service is the MOST cost-effective choice?
  fr: |
    Une entreprise veut stocker des valeurs de configuration d'application, comme des URL de points de terminaison et des ID d'AMI, dans un emplacement central. Ces valeurs ne sont pas des informations d'identification et ne nécessitent pas de rotation. Quel service AWS est le choix le PLUS rentable ?
body:
  options:
    - { id: a, text: "AWS Secrets Manager" }
    - { id: b, text: "AWS Config" }
    - { id: c, text: "AWS Systems Manager Parameter Store" }
    - { id: d, text: "AWS Key Management Service (AWS KMS)" }
answer: { optionId: c }
explanation:
  correct:
    en: "Parameter Store is a central store for configuration data such as endpoint URLs, resource identifiers and approved AMI IDs. Standard parameters have no additional charge, which makes it the most cost-effective choice for values that need no rotation."
    fr: "Parameter Store est un magasin central pour les données de configuration comme les URL de points de terminaison, les identifiants de ressources et les ID d'AMI approuvés. Les paramètres standard n'entraînent aucun coût supplémentaire, ce qui en fait le choix le plus rentable pour des valeurs sans rotation."
  options:
    a:
      en: "Secrets Manager is designed for credentials and is billed per secret per month and per API call, so it costs more for plain configuration values."
      fr: "Secrets Manager est conçu pour les informations d'identification et est facturé par secret et par mois ainsi que par appel d'API : il coûte plus cher pour de simples valeurs de configuration."
    b:
      en: "AWS Config records the configuration history of AWS resources; it is not a store for application settings."
      fr: "AWS Config enregistre l'historique de configuration des ressources AWS ; ce n'est pas un magasin de paramètres d'application."
    d:
      en: "AWS KMS manages encryption keys; it does not store application configuration values."
      fr: "AWS KMS gère des clés de chiffrement ; il ne stocke pas de valeurs de configuration d'application."
references:
  - title: AWS Systems Manager Parameter Store
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html
