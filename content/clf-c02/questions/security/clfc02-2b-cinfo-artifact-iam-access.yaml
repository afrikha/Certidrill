id: clfc02-2b-cinfo-artifact-iam-access
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants only the members of its compliance team to be able to download reports from AWS Artifact. Each team member has an IAM user in a group named Compliance.

    What should the company do?
  fr: |
    Une entreprise veut que seuls les membres de son équipe de conformité puissent télécharger des rapports depuis AWS Artifact. Chaque membre de l'équipe dispose d'un utilisateur IAM dans un groupe nommé Compliance.

    Que doit faire l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Share the root user credentials with the compliance team to download the reports.", fr: "Partager les informations d'identification de l'utilisateur racine avec l'équipe de conformité pour télécharger les rapports." }
    - id: b
      text: { en: "Attach an IAM policy that allows the AWS Artifact report actions to the Compliance group.", fr: "Attacher au groupe Compliance une politique IAM qui autorise les actions AWS Artifact sur les rapports." }
    - id: c
      text: { en: "Upgrade the account to the AWS Enterprise Support plan, which includes access to AWS Artifact.", fr: "Faire passer le compte au plan AWS Enterprise Support, qui inclut l'accès à AWS Artifact." }
    - id: d
      text: { en: "Ask AWS Support to enable AWS Artifact for the users of the Compliance group.", fr: "Demander à AWS Support d'activer AWS Artifact pour les utilisateurs du groupe Compliance." }
answer: { optionId: b }
explanation:
  correct:
    en: "Access to AWS Artifact documents is granted with IAM permissions, and AWS recommends giving each user only the permissions needed for specific documents. Granting the permissions to an IAM group lets all its members download reports, while users outside the group cannot."
    fr: "L'accès aux documents d'AWS Artifact est accordé par des autorisations IAM, et AWS recommande de ne donner à chaque utilisateur que les autorisations nécessaires pour des documents précis. Accorder les autorisations à un groupe IAM permet à tous ses membres de télécharger les rapports, tandis que les utilisateurs hors du groupe ne le peuvent pas."
  options:
    a:
      en: "Sharing root user credentials breaks security best practices and gives far more access than needed."
      fr: "Partager les informations d'identification de l'utilisateur racine enfreint les bonnes pratiques de sécurité et donne bien plus d'accès que nécessaire."
    c:
      en: "AWS Artifact is available at no cost to all AWS customers; it does not depend on the Support plan."
      fr: "AWS Artifact est disponible sans frais pour tous les clients AWS ; il ne dépend pas du plan de support."
    d:
      en: "AWS Artifact does not need to be enabled by AWS Support; access depends on the IAM permissions in the account."
      fr: "AWS Artifact n'a pas besoin d'être activé par AWS Support ; l'accès dépend des autorisations IAM du compte."
references:
  - title: "Identity and access management in AWS Artifact"
    url: https://docs.aws.amazon.com/artifact/latest/ug/security-iam.html
  - title: "What is AWS Artifact?"
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
