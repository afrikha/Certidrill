id: clfc02-2c-lp-new-team
objective: "2.3.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An administrator is creating IAM identities and permissions for a new team of data analysts. Which actions follow the principle of least privilege? (Choose two.)
  fr: |
    Un administrateur crée des identités et des autorisations IAM pour une nouvelle équipe d'analystes de données. Quelles actions respectent le principe du moindre privilège ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the analysts to a user group that has the PowerUserAccess policy.", fr: "Ajouter les analystes à un groupe d'utilisateurs doté de la politique PowerUserAccess." } }
    - { id: b, text: { en: "Add the analysts to a user group that has only the permissions they need.", fr: "Ajouter les analystes à un groupe d'utilisateurs doté uniquement des autorisations nécessaires." } }
    - { id: c, text: { en: "Write customer managed policies that allow only the required actions and resources.", fr: "Rédiger des politiques gérées par le client qui n'autorisent que les actions et ressources requises." } }
    - { id: d, text: { en: "Attach the AdministratorAccess policy to each analyst and remove it later.", fr: "Attacher la politique AdministratorAccess à chaque analyste et la retirer plus tard." } }
    - { id: e, text: { en: "Give each analyst inline policies with full access so they are removed with the user.", fr: "Donner à chaque analyste des politiques en ligne à accès complet pour qu'elles disparaissent avec l'utilisateur." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "A user group whose policies grant only the permissions the analysts need applies least privilege to every member. Customer managed policies let the administrator allow only the required actions on specific resources, instead of the broad permissions of generic policies."
    fr: "Un groupe d'utilisateurs dont les politiques n'accordent que les autorisations nécessaires aux analystes applique le moindre privilège à chaque membre. Les politiques gérées par le client permettent de n'autoriser que les actions requises sur des ressources précises, au lieu des autorisations larges des politiques génériques."
  options:
    a:
      en: "PowerUserAccess gives full access to most services, far more than data analysts need."
      fr: "PowerUserAccess donne un accès complet à la plupart des services, bien plus que ce dont des analystes de données ont besoin."
    d:
      en: "AdministratorAccess grants every action, and planning to remove it later still leaves excessive access in place."
      fr: "AdministratorAccess accorde toutes les actions, et prévoir de la retirer plus tard laisse quand même un accès excessif en place."
    e:
      en: "Being deleted with the user does not limit permissions; full-access policies break least privilege."
      fr: "Être supprimée avec l'utilisateur ne limite pas les autorisations ; des politiques à accès complet enfreignent le moindre privilège."
references:
  - title: Managed policies and inline policies
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vs-inline.html
  - title: IAM user groups
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_groups.html
