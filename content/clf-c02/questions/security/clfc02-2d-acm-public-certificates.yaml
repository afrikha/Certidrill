id: clfc02-2d-acm-public-certificates
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants its website, which runs behind an Application Load Balancer, to use HTTPS. The company needs public SSL/TLS certificates that can be renewed automatically.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise veut que son site web, exécuté derrière un Application Load Balancer, utilise HTTPS. Elle a besoin de certificats SSL/TLS publics qui peuvent être renouvelés automatiquement.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Certificate Manager (ACM)", fr: "AWS Certificate Manager (ACM)" }
    - id: b
      text: { en: "AWS Key Management Service (AWS KMS)", fr: "AWS Key Management Service (AWS KMS)" }
    - id: c
      text: { en: "AWS CloudHSM", fr: "AWS CloudHSM" }
    - id: d
      text: { en: "AWS WAF", fr: "AWS WAF" }
answer: { optionId: a }
explanation:
  correct:
    en: "ACM provides public SSL/TLS certificates for integrated AWS services such as Elastic Load Balancing, Amazon CloudFront, and Amazon API Gateway. With DNS validation, ACM renews the certificates automatically, so the company does not have to track expiration dates to keep encrypting traffic in transit."
    fr: "ACM fournit des certificats SSL/TLS publics pour des services AWS intégrés comme Elastic Load Balancing, Amazon CloudFront et Amazon API Gateway. Avec la validation DNS, ACM renouvelle automatiquement les certificats : l'entreprise n'a pas à suivre leurs dates d'expiration pour continuer à chiffrer le trafic en transit."
  options:
    b:
      en: "AWS KMS creates and controls encryption keys; it does not issue public SSL/TLS certificates for a website."
      fr: "AWS KMS crée et contrôle des clés de chiffrement ; il n'émet pas de certificats SSL/TLS publics pour un site web."
    c:
      en: "CloudHSM provides single-tenant hardware security modules for keys that the customer manages; it does not issue or renew public certificates."
      fr: "CloudHSM fournit des modules de sécurité matériels à locataire unique pour des clés gérées par le client ; il n'émet ni ne renouvelle de certificats publics."
    d:
      en: "AWS WAF filters web requests; it does not provide the certificates that HTTPS requires."
      fr: "AWS WAF filtre les requêtes web ; il ne fournit pas les certificats nécessaires à HTTPS."
references:
  - title: "Request a public certificate in AWS Certificate Manager"
    url: https://docs.aws.amazon.com/acm/latest/userguide/acm-public-certificates.html
