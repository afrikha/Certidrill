id: clfc02-2c-lp-practices
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is reviewing the IAM permissions in its AWS account. Which actions follow the principle of least privilege? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise revoit les autorisations IAM de son compte AWS. Quelles actions respectent le principe du moindre privilège ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach the AdministratorAccess policy to all developers so they never receive access errors.", fr: "Attacher la politique AdministratorAccess à tous les développeurs pour qu'ils n'aient jamais d'erreur d'accès." } }
    - { id: b, text: { en: "Add conditions to policies so that statements apply only in the required circumstances.", fr: "Ajouter des conditions aux politiques pour que les instructions ne s'appliquent que dans les circonstances requises." } }
    - { id: c, text: { en: "Share one IAM user between team members so that fewer identities hold permissions.", fr: "Partager un seul utilisateur IAM entre les membres de l'équipe pour que moins d'identités détiennent des autorisations." } }
    - { id: d, text: { en: "Keep unused IAM roles and their permissions in case a future project needs them.", fr: "Conserver les rôles IAM inutilisés et leurs autorisations au cas où un futur projet en aurait besoin." } }
    - { id: e, text: { en: "Regularly remove the users, roles and permissions that are no longer used.", fr: "Supprimer régulièrement les utilisateurs, rôles et autorisations qui ne sont plus utilisés." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Conditions in IAM policies restrict when a statement applies, for example only over TLS, which narrows the permissions granted. Regularly removing unused users, roles, permissions and credentials keeps each identity limited to what it really needs."
    fr: "Les conditions des politiques IAM limitent les cas où une instruction s'applique, par exemple uniquement via TLS, ce qui réduit les autorisations accordées. Supprimer régulièrement les utilisateurs, rôles, autorisations et informations d'identification inutilisés limite chaque identité à ce dont elle a réellement besoin."
  options:
    a:
      en: "AdministratorAccess grants every action on every resource, far more than developers need."
      fr: "AdministratorAccess accorde toutes les actions sur toutes les ressources, bien plus que ce dont les développeurs ont besoin."
    c:
      en: "A shared user gives every member the combined permissions of the team and removes individual accountability."
      fr: "Un utilisateur partagé donne à chaque membre l'ensemble des autorisations de l'équipe et supprime la traçabilité individuelle."
    d:
      en: "Unused roles and permissions are unnecessary access; AWS recommends removing them."
      fr: "Les rôles et autorisations inutilisés constituent des accès superflus ; AWS recommande de les supprimer."
references:
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
