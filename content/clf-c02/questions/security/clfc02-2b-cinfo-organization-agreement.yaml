id: clfc02-2b-cinfo-organization-agreement
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company uses AWS Organizations with all features enabled and 25 accounts. It must accept the AWS Business Associate Addendum (BAA) once so that it covers all current and future accounts in the organization.

    What should the company do?
  fr: |
    Une entreprise du secteur de la santé utilise AWS Organizations avec toutes les fonctionnalités activées et 25 comptes. Elle doit accepter une seule fois le Business Associate Addendum (BAA) d'AWS pour qu'il couvre tous les comptes actuels et futurs de l'organisation.

    Que doit faire l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Attach a service control policy (SCP) that requires the BAA to the root of the organization.", fr: "Attacher à la racine de l'organisation une politique de contrôle des services (SCP) qui exige le BAA." }
    - id: b
      text: { en: "Accept the account BAA in AWS Artifact from the management account.", fr: "Accepter le BAA de compte dans AWS Artifact depuis le compte de gestion." }
    - id: c
      text: { en: "Accept the account BAA in AWS Artifact from each member account.", fr: "Accepter le BAA de compte dans AWS Artifact depuis chaque compte membre." }
    - id: d
      text: { en: "Accept the organization BAA in AWS Artifact from the management account.", fr: "Accepter le BAA d'organisation dans AWS Artifact depuis le compte de gestion." }
answer: { optionId: d }
explanation:
  correct:
    en: "In AWS Artifact, an organization agreement accepted from the management account of AWS Organizations, with the required AWS Artifact permissions, applies to the management account and to all member accounts, including accounts that join later. An account agreement covers only the account that accepts it."
    fr: "Dans AWS Artifact, un accord d'organisation accepté depuis le compte de gestion d'AWS Organizations, avec les autorisations AWS Artifact requises, s'applique au compte de gestion et à tous les comptes membres, y compris ceux qui rejoignent l'organisation plus tard. Un accord de compte ne couvre que le compte qui l'accepte."
  options:
    a:
      en: "SCPs limit the permissions available in accounts; they cannot accept an agreement with AWS."
      fr: "Les SCP limitent les autorisations disponibles dans les comptes ; elles ne peuvent pas accepter un accord avec AWS."
    b:
      en: "An account agreement accepted in the management account covers only that account, not the member accounts."
      fr: "Un accord de compte accepté dans le compte de gestion ne couvre que ce compte, pas les comptes membres."
    c:
      en: "Account agreements must be accepted in every account, and new accounts would not be covered automatically."
      fr: "Les accords de compte doivent être acceptés dans chaque compte, et les nouveaux comptes ne seraient pas couverts automatiquement."
references:
  - title: "Accepting agreements for your organization in AWS Artifact"
    url: https://docs.aws.amazon.com/artifact/latest/ug/accept-org-agreement.html
