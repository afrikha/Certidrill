id: clfc02-2d-shield-advanced-ddos
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online gaming company guarantees high availability to its customers. It wants DDoS protection beyond the automatic protection that all AWS customers receive, and it wants help from AWS DDoS response experts during attacks.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise de jeux en ligne garantit une haute disponibilité à ses clients. Elle veut une protection DDoS au-delà de la protection automatique dont bénéficient tous les clients AWS, ainsi que l'aide d'experts AWS de la réponse aux attaques DDoS pendant les attaques.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Shield Advanced", fr: "AWS Shield Advanced" }
    - id: b
      text: { en: "AWS Shield Standard", fr: "AWS Shield Standard" }
    - id: c
      text: { en: "Amazon GuardDuty", fr: "Amazon GuardDuty" }
    - id: d
      text: { en: "AWS Firewall Manager", fr: "AWS Firewall Manager" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Shield Advanced is a paid managed service that adds expanded DDoS detection, mitigation, and response capabilities to the resources that it protects. It is designed for applications with availability commitments, and its customers can work with the Shield Response Team (SRT), security engineers who specialize in DDoS event response."
    fr: "AWS Shield Advanced est un service géré payant qui ajoute des fonctions étendues de détection, d'atténuation et de réponse DDoS aux ressources qu'il protège. Il est conçu pour les applications avec des engagements de disponibilité, et ses clients peuvent travailler avec la Shield Response Team (SRT), des ingénieurs en sécurité spécialisés dans la réponse aux attaques DDoS."
  options:
    b:
      en: "Shield Standard is the automatic protection that all customers already receive; it does not add expanded protection or access to the SRT."
      fr: "Shield Standard est la protection automatique dont tous les clients bénéficient déjà ; il n'ajoute ni protection étendue ni accès à la SRT."
    c:
      en: "GuardDuty detects threats in accounts and workloads; it does not mitigate DDoS attacks."
      fr: "GuardDuty détecte les menaces dans les comptes et les charges de travail ; il n'atténue pas les attaques DDoS."
    d:
      en: "Firewall Manager centrally manages protections such as Shield Advanced across accounts, but by itself it adds no DDoS protection or response experts."
      fr: "Firewall Manager gère de façon centralisée des protections comme Shield Advanced dans plusieurs comptes, mais à lui seul il n'ajoute ni protection DDoS ni experts de la réponse aux attaques."
references:
  - title: "AWS Shield Advanced overview"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-advanced-summary.html
  - title: "Managed DDoS event response with Shield Response Team (SRT) support"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-srt-support.html
