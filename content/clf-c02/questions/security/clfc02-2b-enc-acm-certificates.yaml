id: clfc02-2b-enc-acm-certificates
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to serve its website over HTTPS through an Application Load Balancer. It needs an AWS service that provisions a public SSL/TLS certificate with DNS validation and renews it automatically.

    Which AWS service should the company use?
  fr: |
    Une entreprise veut servir son site web en HTTPS par un Application Load Balancer. Elle a besoin d'un service AWS qui fournit un certificat SSL/TLS public avec validation DNS et le renouvelle automatiquement.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS Secrets Manager", fr: "AWS Secrets Manager" }
    - id: b
      text: { en: "AWS CloudHSM", fr: "AWS CloudHSM" }
    - id: c
      text: { en: "AWS Certificate Manager (ACM)", fr: "AWS Certificate Manager (ACM)" }
    - id: d
      text: { en: "AWS Key Management Service (AWS KMS)", fr: "AWS Key Management Service (AWS KMS)" }
answer: { optionId: c }
explanation:
  correct:
    en: "ACM provisions and manages public SSL/TLS certificates for use with integrated AWS services such as Elastic Load Balancing and Amazon CloudFront. With managed renewal, ACM automatically renews the DNS-validated certificates it issues, so the site keeps encrypting traffic in transit."
    fr: "ACM fournit et gère des certificats SSL/TLS publics utilisables avec des services AWS intégrés comme Elastic Load Balancing et Amazon CloudFront. Grâce au renouvellement géré, ACM renouvelle automatiquement les certificats validés par DNS qu'il émet : le site continue de chiffrer le trafic en transit."
  options:
    a:
      en: "Secrets Manager stores and rotates secrets such as database passwords; it does not issue certificates."
      fr: "Secrets Manager stocke des secrets comme les mots de passe de bases de données et en assure la rotation ; il n'émet pas de certificats."
    b:
      en: "CloudHSM provides dedicated hardware security modules for the customer's keys; it does not issue and renew public certificates."
      fr: "CloudHSM fournit des modules de sécurité matériels dédiés aux clés du client ; il n'émet pas et ne renouvelle pas de certificats publics."
    d:
      en: "AWS KMS creates and manages encryption keys for data at rest; it does not issue SSL/TLS certificates."
      fr: "AWS KMS crée et gère des clés de chiffrement pour les données au repos ; il n'émet pas de certificats SSL/TLS."
references:
  - title: "What is AWS Certificate Manager?"
    url: https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html
  - title: "Managed certificate renewal in AWS Certificate Manager"
    url: https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html
