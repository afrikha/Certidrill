# SCS-C03 objectives — AWS Certified Security - Specialty (SCS-C03) Exam Guide, version 1.0
# (published March 26, 2026, Revisions page), English Markdown domain pages
# security-specialty-03-domain1..6.md, checked on 2026-11-19 (domain 5 also read on the HTML page:
# same bullets, same wording).
# One group per task statement (title without the "Task n.n:" prefix and final period).
# The SCS-C03 guide has a single "Skills in:" list per task (no "Knowledge of" / "Skills in"
# split): objectives = every skill bullet, in the guide's order, codes <domain>.<task>.<n> = the
# guide's skill numbers. `code` is the stable key referenced by question files and course sections.
# English: verbatim, "Skill n.n.n:" prefix and final periods removed (guide wording kept even where
# it is faulty: 4.1.3 "Troubleshooting authentication issues", 5.1.1 "when connecting to connect to
# resources", 3.2.6 names Amazon CodeGuru Security, discontinued on November 20, 2025, and
# Amazon Q Developer, closed to new sign-ups on May 15, 2026).
# French: NO French guide exists (the fr_fr URLs serve the English text, the fr_fr PDF does not
# open), so ALL French group titles and objectives are our translation, following BRIEF-AWS §6 and
# AWS fr_fr documentation terminology: AWS service and feature names in English (Security Hub,
# State Manager, Patch Manager, Session Manager, OpsCenter, Object Lock, Vault Lock, S3 Lifecycle,
# StackSets, CloudFormation Guard, cfn-lint...); policy = « politique »; findings = « résultats »;
# health checks = « vérifications de l'état »; conformance packs = « packs de conformité »;
# permission boundaries = « limites d'autorisations »; trust policies = « politiques
# d'approbation »; permission sets = « ensembles d'autorisations »; imported key material =
# « éléments de clé importés »; external key stores = « magasins de clés externes »; Region =
# « Région »; English term in brackets where the French is not settled (blast radius, edge, rate
# limiting, client fingerprinting, guardrails, north/south and east/west, isolated subnets,
# break-glass, AI service opt-out policies, declarative policies, delegated administrator,
# stack sets, ransomware, runbooks kept in English).
detection:
- group:
    en: Design and implement monitoring and alerting solutions for an AWS account or organization
    fr: Concevoir et mettre en œuvre des solutions de surveillance et d'alerte pour un compte AWS ou une organisation
  objectives:
  - code: '1.1.1'
    en: Analyze workloads to determine monitoring requirements
    fr: Analyser les charges de travail pour déterminer les exigences de surveillance
  - code: '1.1.2'
    en: Design and implement workload monitoring strategies (for example, by configuring resource health checks)
    fr: Concevoir et mettre en œuvre des stratégies de surveillance des charges de travail (par exemple, en configurant des vérifications de l'état des ressources)
  - code: '1.1.3'
    en: Aggregate security and monitoring events
    fr: Agréger les événements de sécurité et de surveillance
  - code: '1.1.4'
    en: Create metrics, alerts, and dashboards to detect anomalous data and events (for example, Amazon GuardDuty, Amazon Security Lake, AWS Security Hub, Amazon Macie)
    fr: Créer des métriques, des alertes et des tableaux de bord pour détecter les données et les événements anormaux (par exemple, Amazon GuardDuty, Amazon Security Lake, AWS Security Hub, Amazon Macie)
  - code: '1.1.5'
    en: Create and manage automations to perform regular assessments and investigations (for example, by deploying AWS Config conformance packs, Security Hub, AWS Systems Manager State Manager)
    fr: Créer et gérer des automatisations pour effectuer des évaluations et des investigations régulières (par exemple, en déployant des packs de conformité AWS Config, Security Hub, AWS Systems Manager State Manager)
- group:
    en: Design and implement logging solutions
    fr: Concevoir et mettre en œuvre des solutions de journalisation
  objectives:
  - code: '1.2.1'
    en: Identify sources for log ingestion and storage based on requirements
    fr: Identifier les sources d'ingestion et de stockage des journaux en fonction des exigences
  - code: '1.2.2'
    en: Configure logging for AWS services and applications (for example, by configuring an AWS CloudTrail trail for an organization, by creating a dedicated Amazon CloudWatch logging account, by configuring the Amazon CloudWatch Logs agent)
    fr: Configurer la journalisation des services AWS et des applications (par exemple, en configurant un journal de suivi AWS CloudTrail pour une organisation, en créant un compte de journalisation Amazon CloudWatch dédié, en configurant l'agent Amazon CloudWatch Logs)
  - code: '1.2.3'
    en: Implement log storage and log data lakes (for example, Security Lake) and integrate with third-party security tools
    fr: Mettre en œuvre le stockage des journaux et des lacs de données de journaux (par exemple, Security Lake) et les intégrer à des outils de sécurité tiers
  - code: '1.2.4'
    en: Use AWS services to analyze logs (for example, CloudWatch Logs Insights, Amazon Athena, Security Hub findings)
    fr: Utiliser les services AWS pour analyser les journaux (par exemple, CloudWatch Logs Insights, Amazon Athena, résultats Security Hub)
  - code: '1.2.5'
    en: Use AWS services to normalize, parse, and correlate logs (for example, Amazon OpenSearch Service, AWS Lambda, Amazon Managed Grafana)
    fr: Utiliser les services AWS pour normaliser, analyser syntaxiquement et corréler les journaux (par exemple, Amazon OpenSearch Service, AWS Lambda, Amazon Managed Grafana)
  - code: '1.2.6'
    en: Determine and configure appropriate log sources based on network design, threats, and attacks (for example, VPC Flow Logs, transit gateway flow logs, Amazon Route 53 Resolver logs)
    fr: Déterminer et configurer les sources de journaux appropriées en fonction de la conception du réseau, des menaces et des attaques (par exemple, VPC Flow Logs, journaux de flux de passerelle de transit, journaux Amazon Route 53 Resolver)
- group:
    en: Troubleshoot security monitoring, logging, and alerting solutions
    fr: Dépanner les solutions de surveillance de la sécurité, de journalisation et d'alerte
  objectives:
  - code: '1.3.1'
    en: Analyze the functionality, permissions, and configuration of resources (for example, Lambda function logging, Amazon API Gateway logging, health checks, Amazon CloudFront logging)
    fr: Analyser le fonctionnement, les autorisations et la configuration des ressources (par exemple, journalisation des fonctions Lambda, journalisation d'Amazon API Gateway, vérifications de l'état, journalisation d'Amazon CloudFront)
  - code: '1.3.2'
    en: Remediate misconfiguration of resources (for example, by troubleshooting CloudWatch Agent configurations, troubleshooting missing logs)
    fr: Corriger les erreurs de configuration des ressources (par exemple, en dépannant les configurations de l'agent CloudWatch, en dépannant des journaux manquants)
incident:
- group:
    en: Design and test an incident response plan
    fr: Concevoir et tester un plan de réponse aux incidents
  objectives:
  - code: '2.1.1'
    en: Design and implement response plans and runbooks to respond to security incidents (for example, Systems Manager OpsCenter, Amazon SageMaker AI notebooks)
    fr: Concevoir et mettre en œuvre des plans de réponse et des runbooks pour répondre aux incidents de sécurité (par exemple, Systems Manager OpsCenter, blocs-notes Amazon SageMaker AI)
  - code: '2.1.2'
    en: Use AWS service features and capabilities to configure services to be prepared for incidents (for example, by provisioning access, deploying security tools, minimizing the blast radius, configuring AWS Shield Advanced protections)
    fr: Utiliser les fonctionnalités et capacités des services AWS pour configurer les services afin d'être préparé aux incidents (par exemple, en provisionnant les accès, en déployant des outils de sécurité, en réduisant le rayon d'impact [blast radius], en configurant les protections AWS Shield Advanced)
  - code: '2.1.3'
    en: Recommend procedures to test and validate the effectiveness of an incident response plan (for example, AWS Fault Injection Service, AWS Resilience Hub)
    fr: Recommander des procédures pour tester et valider l'efficacité d'un plan de réponse aux incidents (par exemple, AWS Fault Injection Service, AWS Resilience Hub)
  - code: '2.1.4'
    en: Use AWS services to automatically remediate incidents (for example, Systems Manager, Automated Forensics Orchestrator for Amazon EC2, AWS Step Functions, Amazon Application Recovery Controller, Lambda functions)
    fr: Utiliser les services AWS pour corriger automatiquement les incidents (par exemple, Systems Manager, Automated Forensics Orchestrator for Amazon EC2, AWS Step Functions, Amazon Application Recovery Controller, fonctions Lambda)
- group:
    en: Respond to security events
    fr: Répondre aux événements de sécurité
  objectives:
  - code: '2.2.1'
    en: Capture and store relevant system and application logs as forensic artifacts
    fr: Capturer et stocker les journaux système et applicatifs pertinents en tant qu'artefacts d'investigation numérique (forensic)
  - code: '2.2.2'
    en: Search and correlate logs for security events across applications and AWS services
    fr: Rechercher et corréler les journaux d'événements de sécurité entre les applications et les services AWS
  - code: '2.2.3'
    en: Validate findings from AWS security services to assess the scope and impact of an event
    fr: Valider les résultats des services de sécurité AWS pour évaluer la portée et l'impact d'un événement
  - code: '2.2.4'
    en: Respond to affected resources by containing and eradicating threats, and recover resources (for example, by implementing network containment controls, restoring backups)
    fr: Intervenir sur les ressources affectées en confinant et en éradiquant les menaces, puis restaurer les ressources (par exemple, en mettant en œuvre des contrôles de confinement réseau, en restaurant des sauvegardes)
  - code: '2.2.5'
    en: Describe methods to conduct root cause analysis (for example, Amazon Detective)
    fr: Décrire les méthodes d'analyse des causes racines (par exemple, Amazon Detective)
infrastructure:
- group:
    en: Design, implement, and troubleshoot security controls for network edge services
    fr: Concevoir, mettre en œuvre et dépanner les contrôles de sécurité des services en périphérie du réseau
  objectives:
  - code: '3.1.1'
    en: Define and select edge security strategies based on anticipated threats and attacks
    fr: Définir et sélectionner des stratégies de sécurité en périphérie (edge) en fonction des menaces et des attaques anticipées
  - code: '3.1.2'
    en: Implement appropriate network edge protection (for example, CloudFront headers, AWS WAF, AWS IoT policies, protecting against OWASP Top 10 threats, Amazon S3 cross-origin resource sharing [CORS], Shield Advanced)
    fr: Mettre en œuvre une protection appropriée en périphérie du réseau (par exemple, en-têtes CloudFront, AWS WAF, politiques AWS IoT, protection contre les menaces du Top 10 de l'OWASP, partage des ressources entre origines multiples [CORS] Amazon S3, Shield Advanced)
  - code: '3.1.3'
    en: Design and implement AWS edge controls and rules based on requirements (for example, geography, geolocation, rate limiting, client fingerprinting)
    fr: Concevoir et mettre en œuvre des contrôles et des règles AWS en périphérie en fonction des exigences (par exemple, géographie, géolocalisation, limitation du débit [rate limiting], empreinte du client [client fingerprinting])
  - code: '3.1.4'
    en: Configure integrations with AWS edge services and third-party services (for example, by ingesting data in Open Cybersecurity Schema Framework [OCSF] format, by using third-party WAF rules)
    fr: Configurer des intégrations avec les services AWS en périphérie et des services tiers (par exemple, en ingérant des données au format Open Cybersecurity Schema Framework [OCSF], en utilisant des règles WAF tierces)
- group:
    en: Design, implement, and troubleshoot security controls for compute workloads
    fr: Concevoir, mettre en œuvre et dépanner les contrôles de sécurité des charges de travail de calcul
  objectives:
  - code: '3.2.1'
    en: Design and implement hardened Amazon EC2 AMIs and container images to secure compute workloads and embed security controls (for example, Systems Manager, EC2 Image Builder)
    fr: Concevoir et mettre en œuvre des AMI Amazon EC2 et des images de conteneur renforcées pour sécuriser les charges de travail de calcul et y intégrer des contrôles de sécurité (par exemple, Systems Manager, EC2 Image Builder)
  - code: '3.2.2'
    en: Apply instance profiles, service roles, and execution roles appropriately to authorize compute workloads
    fr: Appliquer de manière appropriée les profils d'instance, les rôles de service et les rôles d'exécution pour autoriser les charges de travail de calcul
  - code: '3.2.3'
    en: Scan compute resources for known vulnerabilities (for example, scan container images and Lambda functions by using Amazon Inspector, monitor compute runtimes by using GuardDuty)
    fr: Analyser les ressources de calcul à la recherche de vulnérabilités connues (par exemple, analyser les images de conteneur et les fonctions Lambda à l'aide d'Amazon Inspector, surveiller les environnements d'exécution de calcul à l'aide de GuardDuty)
  - code: '3.2.4'
    en: Deploy patches across compute resources to maintain secure and compliant environments by automating update processes and by integrating continuous validation (for example, Systems Manager Patch Manager, Amazon Inspector)
    fr: Déployer des correctifs sur les ressources de calcul pour maintenir des environnements sécurisés et conformes, en automatisant les processus de mise à jour et en intégrant une validation continue (par exemple, Systems Manager Patch Manager, Amazon Inspector)
  - code: '3.2.5'
    en: Configure secure administrative access to compute resources (for example, Systems Manager Session Manager, EC2 Instance Connect)
    fr: Configurer un accès d'administration sécurisé aux ressources de calcul (par exemple, Systems Manager Session Manager, EC2 Instance Connect)
  - code: '3.2.6'
    en: Configure security tools to discover and remediate vulnerabilities within a pipeline (for example, Amazon Q Developer, Amazon CodeGuru Security)
    fr: Configurer des outils de sécurité pour découvrir et corriger les vulnérabilités dans un pipeline (par exemple, Amazon Q Developer, Amazon CodeGuru Security)
  - code: '3.2.7'
    en: Implement protections and guardrails for generative AI applications (for example, by applying GenAI OWASP Top 10 for LLM Applications protections)
    fr: Mettre en œuvre des protections et des garde-fous (guardrails) pour les applications d'IA générative (par exemple, en appliquant les protections du Top 10 de l'OWASP pour les applications LLM [GenAI OWASP Top 10 for LLM Applications])
- group:
    en: Design and troubleshoot network security controls
    fr: Concevoir et dépanner les contrôles de sécurité réseau
  objectives:
  - code: '3.3.1'
    en: Design and troubleshoot appropriate network controls to permit or prevent network traffic as required (for example, security groups, network ACLs, AWS Network Firewall)
    fr: Concevoir et dépanner les contrôles réseau appropriés pour autoriser ou empêcher le trafic réseau selon les besoins (par exemple, groupes de sécurité, listes ACL réseau, AWS Network Firewall)
  - code: '3.3.2'
    en: Design secure connectivity between hybrid and multi-cloud networks (for example, AWS Site-to-Site VPN, AWS Direct Connect, MAC Security [MACsec])
    fr: Concevoir une connectivité sécurisée entre réseaux hybrides et multicloud (par exemple, AWS Site-to-Site VPN, AWS Direct Connect, MAC Security [MACsec])
  - code: '3.3.3'
    en: Determine and configure security workload requirements for communication between hybrid environments and AWS (for example, by using AWS Verified Access)
    fr: Déterminer et configurer les exigences de sécurité des charges de travail pour la communication entre les environnements hybrides et AWS (par exemple, à l'aide d'AWS Verified Access)
  - code: '3.3.4'
    en: Design network segmentation based on security requirements (for example, north/south and east/west traffic protections, isolated subnets)
    fr: Concevoir la segmentation du réseau en fonction des exigences de sécurité (par exemple, protections du trafic nord-sud et est-ouest [north/south, east/west], sous-réseaux isolés)
  - code: '3.3.5'
    en: Identify unnecessary network access (for example, AWS Verified Access, Network Access Analyzer, Amazon Inspector network reachability findings)
    fr: Identifier les accès réseau inutiles (par exemple, AWS Verified Access, Network Access Analyzer, résultats d'accessibilité réseau [network reachability] d'Amazon Inspector)
identity:
- group:
    en: Design, implement, and troubleshoot authentication strategies
    fr: Concevoir, mettre en œuvre et dépanner des stratégies d'authentification
  objectives:
  - code: '4.1.1'
    en: Design and establish identity solutions for human, application, and system authentication (for example, AWS IAM Identity Center, Amazon Cognito, multi-factor authentication [MFA], identity provider [IdP] integration)
    fr: Concevoir et établir des solutions d'identité pour l'authentification des humains, des applications et des systèmes (par exemple, AWS IAM Identity Center, Amazon Cognito, authentification multifacteur [MFA], intégration d'un fournisseur d'identité [IdP])
  - code: '4.1.2'
    en: Configure mechanisms to issue temporary credentials (for example, AWS STS, Amazon S3 presigned URLs)
    fr: Configurer des mécanismes d'émission d'informations d'identification temporaires (par exemple, AWS STS, URL présignées Amazon S3)
  - code: '4.1.3'
    en: Troubleshooting authentication issues (for example, CloudTrail, Amazon Cognito, IAM Identity Center permission sets, AWS Directory Service)
    fr: Dépanner les problèmes d'authentification (par exemple, CloudTrail, Amazon Cognito, ensembles d'autorisations IAM Identity Center, AWS Directory Service)
- group:
    en: Design, implement, and troubleshoot authorization strategies
    fr: Concevoir, mettre en œuvre et dépanner des stratégies d'autorisation
  objectives:
  - code: '4.2.1'
    en: Design and evaluate authorization controls for human, application, and system access (for example, Amazon Verified Permissions, IAM paths, IAM Roles Anywhere, resource policies for cross-account access, IAM role trust policies)
    fr: Concevoir et évaluer les contrôles d'autorisation pour l'accès des humains, des applications et des systèmes (par exemple, Amazon Verified Permissions, chemins IAM, IAM Roles Anywhere, politiques basées sur les ressources pour l'accès entre comptes, politiques d'approbation des rôles IAM)
  - code: '4.2.2'
    en: Design attribute-based access control (ABAC) and role-based access control (RBAC) strategies (for example, by configuring resource access based on tags or attributes)
    fr: Concevoir des stratégies de contrôle d'accès basé sur les attributs (ABAC) et de contrôle d'accès basé sur les rôles (RBAC) (par exemple, en configurant l'accès aux ressources en fonction de balises ou d'attributs)
  - code: '4.2.3'
    en: Design, interpret, and implement IAM policies by following the principle of least privilege (for example, permission boundaries, session policies)
    fr: Concevoir, interpréter et mettre en œuvre des politiques IAM en suivant le principe du moindre privilège (par exemple, limites d'autorisations, politiques de session)
  - code: '4.2.4'
    en: Analyze authorization failures to determine causes or effects (for example, IAM Policy Simulator, IAM Access Analyzer)
    fr: Analyser les échecs d'autorisation pour en déterminer les causes ou les effets (par exemple, IAM Policy Simulator, IAM Access Analyzer)
  - code: '4.2.5'
    en: Investigate and correct unintended permissions, authorizations, or privileges granted to a resource, service, or entity (for example, IAM Access Analyzer)
    fr: Examiner et corriger les autorisations, accès ou privilèges non souhaités accordés à une ressource, un service ou une entité (par exemple, IAM Access Analyzer)
data:
- group:
    en: Design and implement controls for data in transit
    fr: Concevoir et mettre en œuvre des contrôles pour les données en transit
  objectives:
  - code: '5.1.1'
    en: Design and configure mechanisms to require encryption when connecting to connect to resources (for example, by configuring Elastic Load Balancing [ELB] security policies, by enforcing TLS configurations)
    fr: Concevoir et configurer des mécanismes pour exiger le chiffrement lors de la connexion aux ressources (par exemple, en configurant les politiques de sécurité Elastic Load Balancing [ELB], en imposant des configurations TLS)
  - code: '5.1.2'
    en: Design and configure mechanisms for secure and private access to resources (for example, AWS PrivateLink, VPC endpoints, AWS Client VPN, AWS Verified Access)
    fr: Concevoir et configurer des mécanismes d'accès sécurisé et privé aux ressources (par exemple, AWS PrivateLink, points de terminaison de VPC, AWS Client VPN, AWS Verified Access)
  - code: '5.1.3'
    en: Design and configure inter-resource encryption in transit (for example, inter-node encryption configurations for Amazon EMR, Amazon EKS, SageMaker AI, Nitro encryption)
    fr: Concevoir et configurer le chiffrement en transit entre ressources (par exemple, configurations de chiffrement entre nœuds pour Amazon EMR, Amazon EKS, SageMaker AI, chiffrement Nitro)
- group:
    en: Design and implement controls for data at rest
    fr: Concevoir et mettre en œuvre des contrôles pour les données au repos
  objectives:
  - code: '5.2.1'
    en: Design, implement, and configure data encryption at rest based on specific requirements (for example, by selecting the appropriate encryption key service such as AWS CloudHSM or AWS KMS or by selecting the appropriate encryption type such as client-side encryption or server-side encryption)
    fr: Concevoir, mettre en œuvre et configurer le chiffrement des données au repos en fonction d'exigences spécifiques (par exemple, en sélectionnant le service de clés de chiffrement approprié, comme AWS CloudHSM ou AWS KMS, ou en sélectionnant le type de chiffrement approprié, comme le chiffrement côté client ou le chiffrement côté serveur)
  - code: '5.2.2'
    en: Design and configure mechanisms to protect data integrity (for example, S3 Object Lock, S3 Glacier Vault Lock, versioning, digital code signing, file validation)
    fr: Concevoir et configurer des mécanismes de protection de l'intégrité des données (par exemple, S3 Object Lock, S3 Glacier Vault Lock, gestion des versions, signature numérique du code, validation des fichiers)
  - code: '5.2.3'
    en: Design automatic lifecycle management and retention solutions for data (for example, S3 Lifecycle policies, S3 Object Lock, Amazon EFS Lifecycle policies, Amazon FSx for Lustre backup policies)
    fr: Concevoir des solutions de gestion automatique du cycle de vie et de conservation des données (par exemple, politiques S3 Lifecycle, S3 Object Lock, politiques de cycle de vie Amazon EFS, politiques de sauvegarde Amazon FSx for Lustre)
  - code: '5.2.4'
    en: Design and configure secure data replication and backup solutions (for example, Amazon Data Lifecycle Manager, AWS Backup, ransomware protection, AWS DataSync)
    fr: Concevoir et configurer des solutions sécurisées de réplication et de sauvegarde des données (par exemple, Amazon Data Lifecycle Manager, AWS Backup, protection contre les rançongiciels [ransomware], AWS DataSync)
- group:
    en: Design and implement controls to protect confidential data, credentials, secrets, and cryptographic key materials
    fr: Concevoir et mettre en œuvre des contrôles pour protéger les données confidentielles, les informations d'identification, les secrets et les éléments de clé cryptographique
  objectives:
  - code: '5.3.1'
    en: Design management and rotation of credentials and secrets (for example, AWS Secrets Manager)
    fr: Concevoir la gestion et la rotation des informations d'identification et des secrets (par exemple, AWS Secrets Manager)
  - code: '5.3.2'
    en: Manage and use imported key material (for example, by managing and rotating imported key material, by managing and configuring external key stores)
    fr: Gérer et utiliser des éléments de clé importés (par exemple, en gérant et en effectuant la rotation des éléments de clé importés, en gérant et en configurant des magasins de clés externes)
  - code: '5.3.3'
    en: Describe the differences between imported key material and AWS generated key material
    fr: Décrire les différences entre les éléments de clé importés et les éléments de clé générés par AWS
  - code: '5.3.4'
    en: Mask sensitive data (for example, CloudWatch Logs data protection policies, Amazon SNS message data protection)
    fr: Masquer les données sensibles (par exemple, politiques de protection des données CloudWatch Logs, protection des données des messages Amazon SNS)
  - code: '5.3.5'
    en: Create and manage encryption keys and certificates across a single AWS Region or multiple Regions (for example, AWS KMS customer managed AWS KMS keys, AWS Private Certificate Authority)
    fr: Créer et gérer des clés de chiffrement et des certificats dans une seule Région AWS ou dans plusieurs Régions (par exemple, clés AWS KMS gérées par le client, AWS Private Certificate Authority)
governance:
- group:
    en: Develop a strategy to centrally deploy and manage AWS accounts
    fr: Élaborer une stratégie de déploiement et de gestion centralisés des comptes AWS
  objectives:
  - code: '6.1.1'
    en: Deploy and configure organizations by using AWS Organizations
    fr: Déployer et configurer des organisations à l'aide d'AWS Organizations
  - code: '6.1.2'
    en: Implement and manage AWS Control Tower in new and existing environments, and deploy optional and custom controls
    fr: Mettre en œuvre et gérer AWS Control Tower dans des environnements nouveaux et existants, et déployer des contrôles facultatifs et personnalisés
  - code: '6.1.3'
    en: Implement organization policies to manage permissions (for example, SCPs, RCPs, AI service opt-out policies, declarative policies)
    fr: Mettre en œuvre des politiques d'organisation pour gérer les autorisations (par exemple, SCP, RCP, politiques de désactivation des services d'IA [AI service opt-out policies], politiques déclaratives [declarative policies])
  - code: '6.1.4'
    en: Centrally manage security services (for example, delegated administrator accounts)
    fr: Gérer de manière centralisée les services de sécurité (par exemple, comptes d'administrateur délégué [delegated administrator])
  - code: '6.1.5'
    en: Manage AWS account root user credentials (for example, by centralizing root access for member accounts, managing MFA, designing break-glass procedures)
    fr: Gérer les informations d'identification de l'utilisateur racine des comptes AWS (par exemple, en centralisant l'accès racine pour les comptes membres, en gérant la MFA, en concevant des procédures d'accès d'urgence [break-glass])
- group:
    en: Implement a secure and consistent deployment strategy for cloud resources
    fr: Mettre en œuvre une stratégie de déploiement sécurisée et cohérente pour les ressources cloud
  objectives:
  - code: '6.2.1'
    en: Use infrastructure as code (IaC) to deploy cloud resources consistently and securely across accounts (for example, CloudFormation stack sets, third-party IaC tools, CloudFormation Guard, cfn-lint)
    fr: Utiliser l'infrastructure en tant que code (IaC) pour déployer des ressources cloud de manière cohérente et sécurisée sur plusieurs comptes (par exemple, StackSets CloudFormation [stack sets], outils IaC tiers, CloudFormation Guard, cfn-lint)
  - code: '6.2.2'
    en: Use tags to organize AWS resources into groups for management (for example, by grouping by department, cost center, environment)
    fr: Utiliser des balises pour organiser les ressources AWS en groupes à des fins de gestion (par exemple, en les regroupant par département, centre de coûts, environnement)
  - code: '6.2.3'
    en: Deploy and enforce policies and configurations from a central source (for example, AWS Firewall Manager)
    fr: Déployer et appliquer des politiques et des configurations à partir d'une source centrale (par exemple, AWS Firewall Manager)
  - code: '6.2.4'
    en: Securely share resources across AWS accounts (for example, AWS Service Catalog, AWS Resource Access Manager [AWS RAM])
    fr: Partager des ressources entre comptes AWS de manière sécurisée (par exemple, AWS Service Catalog, AWS Resource Access Manager [AWS RAM])
- group:
    en: Evaluate the compliance of AWS resources
    fr: Évaluer la conformité des ressources AWS
  objectives:
  - code: '6.3.1'
    en: Create or enable rules to detect and remediate noncompliant AWS resources and to send notifications (for example, by using AWS Config to aggregate alerts and remediate non-compliant resources, Security Hub)
    fr: Créer ou activer des règles pour détecter et corriger les ressources AWS non conformes et envoyer des notifications (par exemple, en utilisant AWS Config pour agréger les alertes et corriger les ressources non conformes, Security Hub)
  - code: '6.3.2'
    en: Use AWS audit services to collect and organize evidence (for example, AWS Audit Manager, AWS Artifact)
    fr: Utiliser les services d'audit AWS pour collecter et organiser les preuves (par exemple, AWS Audit Manager, AWS Artifact)
  - code: '6.3.3'
    en: Use AWS services to evaluate architecture for compliance with AWS security best practices (for example, AWS Well-Architected Framework tool)
    fr: Utiliser les services AWS pour évaluer la conformité de l'architecture aux bonnes pratiques de sécurité AWS (par exemple, outil AWS Well-Architected Framework)
