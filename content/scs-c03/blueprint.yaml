# SCS-C03 — AWS Certified Security – Specialty
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-19):
#   - AWS Certified Security - Specialty (SCS-C03) Exam Guide, HTML pages and Markdown copies under
#     https://docs.aws.amazon.com/aws-certification/latest/security-specialty-03/security-specialty-03.html
#     (domain pages security-specialty-03-domain1..6, scs-02-in-scope-services,
#     scs-02-out-of-scope-services, scs-technologies-concepts, security-specialty-03-appendix-b
#     (comparison), scs03-revisions).
#     The fr_fr path serves the English text (meta locale en_us) and the fr_fr PDF does not open:
#     no French guide exists.
#   - Certification page: https://aws.amazon.com/certification/certified-security-specialty/
#     (links to the SCS-C03 guide only, SCS-C02 not mentioned; 170 minutes, 65 questions, multiple
#     choice or multiple response, 300 USD; English, Japanese, Korean, Portuguese (Brazil),
#     Simplified Chinese, Spanish (Latin America) — the Simplified Chinese, Spanish (Latin America)
#     and Portuguese (Brazil) versions retire after December 31, 2026; Pearson VUE test center or
#     online proctored).
# Guide version: 1.0, published March 26, 2026 (Revisions page, single entry) → blueprint.version
# '2026-03-26'. Comparison page: SCS-C02 in use until December 1, 2025; SCS-C03 in use beginning
# December 2, 2025.
# Exam facts: 65 questions = 50 scored + 15 unscored (not identified); scaled score 100–1,000,
# pass at 750, compensatory scoring. Response types listed by the guide: multiple choice (1 correct
# of 4), multiple response (2 or more correct of 5 or more), ordering (3–5 responses to order) and
# matching (3–7 prompts); all-or-nothing credit on ordering and matching. The certification page
# announces only multiple choice and multiple response; following the guide, a few ordering and
# matching items are modelled as in AIF-C01 (ordering → `ordering`, matching → `dragdrop`). The guide does not state the duration (170 min from
# the certification page).
# Unscored questions are not modelled: the mock exam scores all 65 questions.
# Domain weights: share of scored content as published (16 / 14 / 18 / 20 / 18 / 14 %).
# difficultyMix: specialty level, middle of the target ranges (easy 0.10–0.20,
# medium 0.45–0.55, hard 0.30–0.40); the schema takes one share per level.
certification:
  code: scs-c03
  title: AWS Certified Security – Specialty
  vendor: AWS
  active: false

blueprint:
  version: '2026-03-26'
  durationMin: 170
  questionCount: { min: 65, max: 65 }
  passScore: 750
  maxScore: 1000
  # AWS gives no partial credit on multiple-response questions (see docs/SPECS-AWS.md §3.3);
  # ignored by the loader until that rule is implemented.
  scoring:
    multi: all_or_nothing
    dragdrop: all_or_nothing

  # Target share of each question type in an exam (0..1): mostly multiple choice (single) and
  # multiple response (multi), plus a few ordering and matching (dragdrop) items listed by the guide.
  typeMix:
    single: { min: 0.74, max: 0.84 }
    multi: { min: 0.12, max: 0.18 }
    ordering: { min: 0.02, max: 0.05 }
    dragdrop: { min: 0.02, max: 0.05 }

  difficultyMix: { easy: 0.15, medium: 0.50, hard: 0.35 }

  structure:
    caseStudies:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
      placement: end
    series:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
    maxPerObjective: 2
    warningsMin: [10, 5]
    # Readiness index (0–100), the central indicator of the dashboard.
    # index = weighted sum of four criteria, each worth 0–100 points:
    #   level       — weighted average of the last `window` exams, weights 1, 2, …, n
    #                 from the oldest to the latest
    #   consistency — lowest of the last `recent` exams
    #   domains     — weakest domain, averaged over the last `recent` exams
    #   freshness   — share of never-seen questions, and date of the last exam
    # Scores map to points linearly: `scale.from` or less → 0, `scale.to` or more → 100.
    # "Ready" = index at `bands.ready` or more AND five rules (minAttempts,
    # consecutive × minScore, domainFloor, freshness.minNewShare: at least that
    # share of never-seen questions in the `recent` exams, freshness.zeroDays: a
    # last exam at most that old); while a rule fails, the index stays
    # under `bands.ready`.
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale: { from: 600, to: 850 }
      weights: { level: 0.5, consistency: 0.2, domains: 0.2, freshness: 0.1 }
      bands: { progressing: 50, almost: 70, ready: 85 }
      # Recency: full up to staleDays after the last exam, then down to 0 at zeroDays;
      # past zeroDays, no "ready" until a new exam.
      freshness: { staleDays: 30, zeroDays: 90, minNewShare: 0.5 }
    # XP, levels, domain mastery and badges: the "gaming" side. They reward
    # effort and progress; only the readiness index says "ready".
    progression:
      xp:
        base: 50            # any finished exam
        scoreFrom: 400      # score XP = (score - 400) × 0.5: 0 at 400, 300 at 1000
        perPoint: 0.5
        knownShare: 0.5     # only half the score XP on questions already seen
        passBonus: 100      # at 750 or more
        bestBonus: 75       # best score so far
        domainBonus: 50     # per domain at least 50 points above the previous exam
        domainGain: 50
      levels:
        - { xp: 0, title: { en: Shared-responsibility learner, fr: Apprenti de la responsabilité partagée } }
        - { xp: 150, title: { en: Finding triager, fr: Trieur de résultats } }
        - { xp: 400, title: { en: Log trail keeper, fr: Gardien des journaux } }
        - { xp: 750, title: { en: Least-privilege enforcer, fr: Garant du moindre privilège } }
        - { xp: 1200, title: { en: Edge defender, fr: Défenseur de la périphérie } }
        - { xp: 1750, title: { en: Key custodian, fr: Dépositaire des clés } }
        - { xp: 2400, title: { en: Incident responder, fr: Intervenant en réponse aux incidents } }
        - { xp: 3150, title: { en: Guardrail architect, fr: Architecte des garde-fous } }
        - { xp: 4000, title: { en: Security specialist, fr: Spécialiste de la sécurité } }
        - { xp: 5000, title: { en: Cloud security legend, fr: Légende de la sécurité cloud } }
      mastery: { bronze: 650, silver: 700, gold: 850 }
      badges:
        hatTrick: { count: 3, min: 800 }
        regular: { weeks: 4 }
        comeback: { gain: 150 }


domains:
  - code: detection
    order: 1
    weight: { min: 0.16, max: 0.16 }
    title:
      en: Detection
      fr: Détection
  - code: incident
    order: 2
    weight: { min: 0.14, max: 0.14 }
    title:
      en: Incident Response
      fr: Réponse aux incidents
  - code: infrastructure
    order: 3
    weight: { min: 0.18, max: 0.18 }
    title:
      en: Infrastructure Security
      fr: Sécurité de l'infrastructure
  - code: identity
    order: 4
    weight: { min: 0.20, max: 0.20 }
    title:
      en: Identity and Access Management
      fr: Gestion des identités et des accès
  - code: data
    order: 5
    weight: { min: 0.18, max: 0.18 }
    title:
      en: Data Protection
      fr: Protection des données
  - code: governance
    order: 6
    weight: { min: 0.14, max: 0.14 }
    title:
      en: Security Foundations and Governance
      fr: Fondamentaux de la sécurité et gouvernance
