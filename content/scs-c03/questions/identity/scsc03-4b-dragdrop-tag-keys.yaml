id: scsc03-4b-dragdrop-tag-keys
objective: "4.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A security engineer is writing ABAC policies for AWS Secrets Manager. Developers assume roles through a SAML identity provider that passes session tags.

    Match each requirement with the condition key that the engineer should use. Each condition key can be used once or not at all.
  fr: |
    Un ingénieur sécurité écrit des politiques ABAC pour AWS Secrets Manager. Les développeurs endossent des rôles par un fournisseur d'identité SAML qui transmet des balises de session.

    Associez chaque exigence à la clé de condition que l'ingénieur doit utiliser. Chaque clé de condition peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: principal, text: "aws:PrincipalTag/project" }
    - { id: resource, text: "aws:ResourceTag/project" }
    - { id: request, text: "aws:RequestTag/project" }
    - { id: keys, text: "aws:TagKeys" }
    - { id: transitive, text: "sts:TransitiveTagKeys" }
    - { id: sourceid, text: "aws:SourceIdentity" }
  targets:
    - id: t1
      text: { en: "Check the project tag already attached to the secret that is being read.", fr: "Vérifier la balise project déjà attachée au secret en cours de lecture." }
    - id: t2
      text: { en: "Require a CreateSecret request to set the project tag to a specific value.", fr: "Exiger qu'une demande CreateSecret définisse la balise project sur une valeur précise." }
    - id: t3
      text: { en: "Limit the set of tag keys that a tagging request may add or remove.", fr: "Limiter l'ensemble des clés de balise qu'une demande de balisage peut ajouter ou supprimer." }
    - id: t4
      text: { en: "Read the project session tag of the role session that makes the request.", fr: "Lire la balise de session project de la session de rôle qui effectue la demande." }
    - id: t5
      text: { en: "Limit which session tags a caller may mark as persisting through role chaining.", fr: "Limiter les balises de session qu'un appelant peut marquer comme persistantes lors du chaînage de rôles." }
answer:
  mapping: { t1: resource, t2: request, t3: keys, t4: principal, t5: transitive }
explanation:
  correct:
    en: "aws:ResourceTag compares the tags attached to the target resource, aws:RequestTag the key-value pairs passed in the request, and aws:TagKeys (multivalued) the set of tag keys in the request. aws:PrincipalTag holds the tags of the caller, including session tags, and sts:TransitiveTagKeys, used with sts:TagSession, limits which keys may be marked transitive."
    fr: "aws:ResourceTag compare les balises attachées à la ressource cible, aws:RequestTag les paires clé-valeur transmises dans la demande, et aws:TagKeys (à valeurs multiples) l'ensemble des clés de balise de la demande. aws:PrincipalTag contient les balises de l'appelant, y compris les balises de session, et sts:TransitiveTagKeys, utilisé avec sts:TagSession, limite les clés qui peuvent être marquées comme transitives."
  options:
    sourceid:
      en: "aws:SourceIdentity holds the source identity set when a role is assumed; it is not a tag and does not match any of the tagging requirements."
      fr: "aws:SourceIdentity contient l'identité source définie lors de l'endossement d'un rôle ; ce n'est pas une balise et elle ne répond à aucune des exigences de balisage."
references:
  - title: Pass session tags in AWS STS - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_session-tags.html
  - title: AWS global condition context keys - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
