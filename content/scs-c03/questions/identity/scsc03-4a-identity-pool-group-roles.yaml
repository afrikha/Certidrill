id: scsc03-4a-identity-pool-group-roles
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's field technicians and supervisors sign in to a mobile app through an Amazon Cognito user pool, and an Amazon Cognito identity pool gives them temporary AWS credentials. Supervisors must receive an IAM role with more permissions than technicians. Users can edit some of their own profile attributes in the app, including custom:job_title. The choice of role must not depend on any value that users can change, and a request that does not resolve to a single role must be denied.

    Which solution will meet these requirements?
  fr: |
    Les techniciens de terrain et les superviseurs d'AnyCompany se connectent à une application mobile par un groupe d'utilisateurs Amazon Cognito, et un groupe d'identités Amazon Cognito leur fournit des informations d'identification AWS temporaires. Les superviseurs doivent recevoir un rôle IAM doté de plus d'autorisations que celui des techniciens. Les utilisateurs peuvent modifier certains attributs de leur propre profil dans l'application, dont custom:job_title. Le choix du rôle ne doit dépendre d'aucune valeur que les utilisateurs peuvent changer, et une requête qui ne se résout pas en un rôle unique doit être refusée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a rule-based role mapping that assigns the supervisor role when custom:job_title equals Supervisor, and set role resolution to Use default authenticated role."
        fr: "Ajouter un mappage de rôles par règles qui attribue le rôle superviseur lorsque custom:job_title est égal à Supervisor, et définir la résolution des rôles sur Use default authenticated role."
    - id: b
      text:
        en: "Create user pool groups that are associated with each IAM role, configure the identity pool to choose the role from the token, and set role resolution to Deny request."
        fr: "Créer des groupes du groupe d'utilisateurs associés à chaque rôle IAM, configurer le groupe d'identités pour choisir le rôle à partir du jeton, et définir la résolution des rôles sur Deny request."
    - id: c
      text:
        en: "Add a rule-based role mapping that assigns the supervisor role when custom:job_title equals Supervisor, and set role resolution to Deny request."
        fr: "Ajouter un mappage de rôles par règles qui attribue le rôle superviseur lorsque custom:job_title est égal à Supervisor, et définir la résolution des rôles sur Deny request."
    - id: d
      text:
        en: "Create user pool groups that are associated with each IAM role, and set the identity pool's default authenticated role to the supervisor role."
        fr: "Créer des groupes du groupe d'utilisateurs associés à chaque rôle IAM, et définir le rôle authentifié par défaut du groupe d'identités sur le rôle superviseur."
answer: { optionId: b }
explanation:
  correct:
    en: "A user pool group can carry an IAM role and a precedence; the ID token then contains cognito:roles and cognito:preferred_role, and the identity pool can choose the role from the token. Administrators manage group membership, so users cannot raise their own role, and the Deny request resolution rejects requests that do not resolve to one role."
    fr: "Un groupe du groupe d'utilisateurs peut porter un rôle IAM et une priorité ; le jeton d'identification contient alors cognito:roles et cognito:preferred_role, et le groupe d'identités peut choisir le rôle à partir du jeton. Ce sont les administrateurs qui gèrent l'appartenance aux groupes : les utilisateurs ne peuvent pas élever leur propre rôle, et la résolution Deny request refuse les requêtes qui ne se résolvent pas en un seul rôle."
  options:
    a:
      en: "custom:job_title can be changed by users, so any user could set it to Supervisor and receive the supervisor role; mapping a modifiable claim to an elevated role is the risk AWS warns about."
      fr: "custom:job_title peut être modifié par les utilisateurs : n'importe qui pourrait le définir sur Supervisor et obtenir le rôle superviseur ; associer une revendication modifiable à un rôle élevé est le risque contre lequel AWS met en garde."
    c:
      en: "The Deny request resolution does not help, because the rule still trusts custom:job_title, which users can change."
      fr: "La résolution Deny request n'y change rien, car la règle se fie toujours à custom:job_title, que les utilisateurs peuvent modifier."
    d:
      en: "The default authenticated role would give the supervisor permissions to every authenticated user, including technicians."
      fr: "Le rôle authentifié par défaut donnerait les autorisations de superviseur à tous les utilisateurs authentifiés, techniciens compris."
references:
  - title: Using role-based access control
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/role-based-access-control.html
