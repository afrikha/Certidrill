id: scsc03-4b-principalarn-path-bucket
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data lake bucket named lake-curated is in account 444455556666. Analytics jobs in account 111122223333 run under IAM roles that a pipeline creates under the path /analytics/ and deletes when each job ends, many times each day. The identity-based policies of these roles already allow s3:GetObject on the bucket. The bucket policy must allow s3:GetObject only to the roles under /analytics/ in account 111122223333, including roles created later, without any update of the bucket policy when roles are created or deleted.

    Which bucket policy statement will meet these requirements?
  fr: |
    Un compartiment de lac de données nommé lake-curated se trouve dans le compte 444455556666. Des tâches d'analytique du compte 111122223333 s'exécutent sous des rôles IAM qu'un pipeline crée sous le chemin /analytics/ et supprime à la fin de chaque tâche, plusieurs fois par jour. Les politiques basées sur l'identité de ces rôles autorisent déjà s3:GetObject sur le compartiment. La politique de compartiment doit autoriser s3:GetObject uniquement aux rôles situés sous /analytics/ dans le compte 111122223333, y compris les rôles créés plus tard, sans aucune mise à jour de la politique de compartiment lors de la création ou de la suppression des rôles.

    Quelle instruction de politique de compartiment permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow s3:GetObject on lake-curated/* with the Principal element set to `{"AWS": "arn:aws:iam::111122223333:role/analytics/*"}`, which covers every role under the path.
        fr: |-
          Autoriser s3:GetObject sur lake-curated/* avec l'élément Principal défini sur `{"AWS": "arn:aws:iam::111122223333:role/analytics/*"}`, qui couvre chaque rôle du chemin.
    - id: b
      text:
        en: |-
          Allow s3:GetObject on lake-curated/* with the Principal element set to `{"AWS": "111122223333"}` and no condition, so that the account decides which roles can read.
        fr: |-
          Autoriser s3:GetObject sur lake-curated/* avec l'élément Principal défini sur `{"AWS": "111122223333"}` et sans condition, pour que le compte décide quels rôles peuvent lire.
    - id: c
      text:
        en: |-
          Allow s3:GetObject on lake-curated/* with a Principal element that lists the ARN of each role, which the pipeline adds when it creates a role.
        fr: |-
          Autoriser s3:GetObject sur lake-curated/* avec un élément Principal qui liste l'ARN de chaque rôle, ajouté par le pipeline lorsqu'il crée un rôle.
    - id: d
      text:
        en: |-
          Allow s3:GetObject on lake-curated/* with the Principal element set to "*" and an ArnLike condition on aws:PrincipalArn for arn:aws:iam::111122223333:role/analytics/*.
        fr: |-
          Autoriser s3:GetObject sur lake-curated/* avec l'élément Principal défini sur "*" et une condition ArnLike sur aws:PrincipalArn pour arn:aws:iam::111122223333:role/analytics/*.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Principal element cannot use a wildcard to match part of an ARN, but condition keys that support principals can. aws:PrincipalArn contains the role ARN (with its path) for role sessions, so an ArnLike match on role/analytics/* admits every current and future role under the path, and anonymous requests, which carry no aws:PrincipalArn, do not match.
    fr: |-
      L'élément Principal ne peut pas utiliser de caractère générique pour correspondre à une partie d'un ARN, mais les clés de condition qui prennent en charge les principaux le peuvent. aws:PrincipalArn contient l'ARN du rôle (avec son chemin) pour les sessions de rôle : une correspondance ArnLike sur role/analytics/* admet tous les rôles actuels et futurs du chemin, et les demandes anonymes, qui ne portent pas aws:PrincipalArn, ne correspondent pas.
  options:
    a:
      en: |-
        A wildcard cannot match part of a principal name or ARN in the Principal element, so this statement is not valid.
      fr: |-
        Un caractère générique ne peut pas correspondre à une partie d'un nom ou d'un ARN de principal dans l'élément Principal : cette instruction n'est pas valide.
    b:
      en: |-
        The account principal trusts the whole account: any user or role that an administrator of 111122223333 allows could read the bucket, not only the roles under /analytics/.
      fr: |-
        Le principal de compte fait confiance à tout le compte : tout utilisateur ou rôle autorisé par un administrateur de 111122223333 pourrait lire le compartiment, pas seulement les rôles situés sous /analytics/.
    c:
      en: |-
        The bucket policy would change every time the pipeline creates or deletes a role, which violates the no-update requirement, and the list would also grow toward the bucket policy size limit.
      fr: |-
        La politique de compartiment changerait chaque fois que le pipeline crée ou supprime un rôle, ce qui enfreint l'exigence d'absence de mise à jour, et la liste grossirait aussi vers la taille maximale de la politique de compartiment.
references:
  - title: "AWS JSON policy elements: Principal - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html
  - title: AWS global condition context keys - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
