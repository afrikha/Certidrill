id: scsc03-4a-imds-hop-limit
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany now requires IMDSv2 on all Amazon EC2 instances. Since the change, Docker containers in bridge network mode on an instance can no longer obtain the instance role credentials: their AWS SDK calls get no response from the instance metadata service and time out, while processes on the host itself work.

    Which solution will resolve the issue?
  fr: |
    AnyCompany exige désormais IMDSv2 sur toutes les instances Amazon EC2. Depuis ce changement, les conteneurs Docker en mode réseau bridge d'une instance ne parviennent plus à obtenir les informations d'identification du rôle de l'instance : leurs appels du SDK AWS ne reçoivent aucune réponse du service de métadonnées d'instance et expirent, alors que les processus de l'hôte lui-même fonctionnent.

    Quelle solution résoudra le problème ?
body:
  options:
    - id: a
      text:
        en: "Set HttpTokens back to optional on the instance so that the containers can keep using IMDSv1."
        fr: "Redéfinir HttpTokens sur optional sur l'instance pour que les conteneurs puissent continuer à utiliser IMDSv1."
    - id: b
      text:
        en: "Add an inbound security group rule that allows TCP 80 from the Docker bridge network to 169.254.169.254."
        fr: "Ajouter une règle entrante de groupe de sécurité qui autorise TCP 80 depuis le réseau bridge Docker vers 169.254.169.254."
    - id: c
      text:
        en: "Add a second IAM role for the containers to the instance profile of the instance."
        fr: "Ajouter un second rôle IAM pour les conteneurs au profil d'instance de l'instance."
    - id: d
      text:
        en: "Increase the PUT response hop limit of the instance metadata options to 2."
        fr: "Porter à 2 la limite de sauts de la réponse PUT dans les options de métadonnées de l'instance."
answer: { optionId: d }
explanation:
  correct:
    en: "The response to the IMDSv2 PUT token request has a hop limit of 1 by default, and reaching a container counts as an additional network hop. SDKs that require IMDSv2 then get no response, so AWS recommends a hop limit of 2 in container environments."
    fr: "La réponse à la requête PUT de jeton IMDSv2 a par défaut une limite de sauts de 1, et atteindre un conteneur compte comme un saut réseau supplémentaire. Les SDK qui exigent IMDSv2 ne reçoivent alors aucune réponse : AWS recommande une limite de sauts de 2 dans les environnements de conteneurs."
  options:
    a:
      en: "Allowing IMDSv1 again removes the protection that the company now requires."
      fr: "Réautoriser IMDSv1 supprime la protection que l'entreprise exige désormais."
    b:
      en: "The problem is the hop limit of the token response, not a security group rule."
      fr: "Le problème vient de la limite de sauts de la réponse du jeton, pas d'une règle de groupe de sécurité."
    c:
      en: "An instance profile can contain only one IAM role."
      fr: "Un profil d'instance ne peut contenir qu'un seul rôle IAM."
references:
  - title: Access instance metadata for an EC2 instance
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html
  - title: Use the Instance Metadata Service to access instance metadata
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html
