id: scsc03-4c-identity-center-unused
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS IAM Identity Center. The permission set DataEngineers includes the AWS managed policies AmazonS3FullAccess and AmazonAthenaFullAccess and is assigned in 12 accounts. An organization unused access analyzer reports unused permissions for the IAM roles that Identity Center created for this permission set, but the findings offer no recommended policy. The security team must remove the unused permissions in all 12 accounts with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS IAM Identity Center. Le jeu d'autorisations DataEngineers inclut les politiques gérées par AWS AmazonS3FullAccess et AmazonAthenaFullAccess et est attribué dans 12 comptes. Un analyseur d'accès inutilisé d'organisation signale des autorisations inutilisées pour les rôles IAM qu'Identity Center a créés pour ce jeu d'autorisations, mais les résultats ne proposent aucune politique recommandée. L'équipe de sécurité doit retirer les autorisations inutilisées dans les 12 comptes avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          In each account, attach a customer managed policy with only the used actions to the Identity Center role, and detach the two AWS managed policies in IAM.
        fr: |-
          Dans chaque compte, attacher au rôle Identity Center une politique gérée par le client contenant uniquement les actions utilisées, puis détacher dans IAM les deux politiques gérées par AWS.
    - id: b
      text:
        en: |-
          In each account, attach a permissions boundary in IAM to the Identity Center role that allows only the used actions.
        fr: |-
          Dans chaque compte, attacher dans IAM au rôle Identity Center une limite d'autorisations qui n'autorise que les actions utilisées.
    - id: c
      text:
        en: |-
          Edit the DataEngineers permission set to replace the two AWS managed policies with an inline policy that contains only the used actions.
        fr: |-
          Modifier le jeu d'autorisations DataEngineers pour remplacer les deux politiques gérées par AWS par une politique en ligne qui ne contient que les actions utilisées.
    - id: d
      text:
        en: |-
          Attach a service control policy (SCP) to the 12 accounts that denies the unused actions to every principal.
        fr: |-
          Attacher aux 12 comptes une politique de contrôle des services (SCP) qui refuse les actions inutilisées à tous les principaux.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Identity Center creates and manages the IAM roles of a permission set in each assigned account and updates them when the permission set changes. Unused access findings do not offer recommendations for Identity Center roles, so the team changes the permission set once, and Identity Center updates the roles in all 12 accounts.
    fr: |-
      Identity Center crée et gère les rôles IAM d'un jeu d'autorisations dans chaque compte attribué, et les met à jour quand le jeu d'autorisations change. Les résultats d'accès inutilisé ne proposent pas de recommandations pour les rôles Identity Center : l'équipe modifie donc une seule fois le jeu d'autorisations, et Identity Center met à jour les rôles dans les 12 comptes.
  options:
    a:
      en: |-
        Roles created from permission sets cannot be edited in IAM; Identity Center manages them, and the work would be repeated in 12 accounts.
      fr: |-
        Les rôles créés à partir de jeux d'autorisations ne sont pas modifiables dans IAM ; Identity Center les gère, et le travail serait répété dans 12 comptes.
    b:
      en: |-
        A boundary added in IAM is an edit of a role managed by Identity Center, which is not allowed; boundaries for these roles are set in the permission set.
      fr: |-
        Une limite ajoutée dans IAM est une modification d'un rôle géré par Identity Center, ce qui n'est pas autorisé ; les limites de ces rôles se définissent dans le jeu d'autorisations.
    d:
      en: |-
        An SCP would deny those actions to every principal in the accounts, including roles that need them, and the broad policies would stay attached.
      fr: |-
        Une SCP refuserait ces actions à tous les principaux des comptes, y compris les rôles qui en ont besoin, et les politiques étendues resteraient attachées.
references:
  - title: Manage AWS accounts with permission sets - AWS IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html
  - title: Resolve IAM Access Analyzer findings - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-findings-remediate.html
