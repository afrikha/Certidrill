id: scsc03-4b-kms-viaservice
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In account 111122223333, objects in the bucket app-data in eu-west-1 are encrypted with SSE-KMS and the customer managed key AppKey. The key policy is the only policy that grants the role AppRole access to AppKey; it allows kms:Decrypt and kms:GenerateDataKey to AppRole. The security team requires that AppRole can use AppKey only through Amazon S3 in eu-west-1. Direct calls to kms:Decrypt that the application makes with AppRole credentials must fail.

    Which change to the key policy statement will meet these requirements?
  fr: |
    Dans le compte 111122223333, les objets du compartiment app-data dans eu-west-1 sont chiffrés avec SSE-KMS et la clé gérée par le client AppKey. La politique de clé est la seule politique qui accorde au rôle AppRole l'accès à AppKey ; elle autorise kms:Decrypt et kms:GenerateDataKey à AppRole. L'équipe de sécurité exige qu'AppRole ne puisse utiliser AppKey que par Amazon S3 dans eu-west-1. Les appels directs à kms:Decrypt que l'application effectue avec les informations d'identification d'AppRole doivent échouer.

    Quelle modification de l'instruction de politique de clé permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a Bool condition on aws:ViaAWSService with the value true to the statement that allows AppRole.
        fr: |-
          Ajouter à l'instruction qui autorise AppRole une condition Bool sur aws:ViaAWSService avec la valeur true.
    - id: b
      text:
        en: |-
          Add a Bool condition on aws:PrincipalIsAWSService with the value true to the statement that allows AppRole.
        fr: |-
          Ajouter à l'instruction qui autorise AppRole une condition Bool sur aws:PrincipalIsAWSService avec la valeur true.
    - id: c
      text:
        en: |-
          Add a StringEquals condition on kms:ViaService with the value s3.eu-west-1.amazonaws.com to the statement that allows AppRole.
        fr: |-
          Ajouter à l'instruction qui autorise AppRole une condition StringEquals sur kms:ViaService avec la valeur s3.eu-west-1.amazonaws.com.
    - id: d
      text:
        en: |-
          Add a StringEquals condition on aws:SourceVpce with the ID of the S3 gateway endpoint to the statement that allows AppRole.
        fr: |-
          Ajouter à l'instruction qui autorise AppRole une condition StringEquals sur aws:SourceVpce avec l'ID du point de terminaison de passerelle S3.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      kms:ViaService limits the use of a KMS key to requests that a named AWS service makes on behalf of the principal through forward access sessions. With the value s3.eu-west-1.amazonaws.com, S3 can decrypt and generate data keys for AppRole, while direct KMS calls from the application, which do not come through S3, no longer match the statement.
    fr: |-
      kms:ViaService limite l'utilisation d'une clé KMS aux demandes qu'un service AWS désigné effectue pour le compte du principal au moyen de sessions d'accès transférées. Avec la valeur s3.eu-west-1.amazonaws.com, S3 peut déchiffrer et générer des clés de données pour AppRole, tandis que les appels KMS directs de l'application, qui ne passent pas par S3, ne correspondent plus à l'instruction.
  options:
    a:
      en: |-
        aws:ViaAWSService is true for requests from any service that uses forward access sessions, so AppRole could still use the key through services other than S3.
      fr: |-
        aws:ViaAWSService vaut true pour les demandes de tout service qui utilise des sessions d'accès transférées : AppRole pourrait encore utiliser la clé par d'autres services que S3.
    b:
      en: |-
        When S3 calls KMS with AppRole's credentials, the principal is AppRole, so aws:PrincipalIsAWSService is false and the S3 requests would fail too.
      fr: |-
        Lorsque S3 appelle KMS avec les informations d'identification d'AppRole, le principal est AppRole : aws:PrincipalIsAWSService vaut false et les demandes de S3 échoueraient aussi.
    d:
      en: |-
        The calls from S3 to AWS KMS do not travel through the company's S3 gateway endpoint, so the condition would block S3 and still say nothing about the calling service.
      fr: |-
        Les appels de S3 vers AWS KMS ne passent pas par le point de terminaison de passerelle S3 de l'entreprise : la condition bloquerait S3 sans rien indiquer sur le service appelant.
references:
  - title: AWS KMS condition keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/conditions-kms.html
