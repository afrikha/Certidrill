id: scsc03-4a-consolelogin-region
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's security team investigates repeated failed console sign-ins by IAM users in a member account. The account has a single-Region AWS CloudTrail trail in eu-west-1 that records all management events, but the trail contains no ConsoleLogin events. The IAM users sign in through the global sign-in URL, and they must keep using it. The team must record every ConsoleLogin event of the account in the trail.

    Which solution will meet these requirements?
  fr: |
    L'équipe de sécurité d'AnyCompany enquête sur des échecs répétés de connexion à la console d'utilisateurs IAM dans un compte membre. Le compte possède un journal de suivi (trail) AWS CloudTrail à Région unique dans eu-west-1 qui enregistre tous les événements de gestion, mais ce journal ne contient aucun événement ConsoleLogin. Les utilisateurs IAM se connectent par l'URL de connexion globale et doivent continuer à l'utiliser. L'équipe doit enregistrer dans le journal de suivi chaque événement ConsoleLogin du compte.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Have the IAM users sign in through the eu-west-1 Regional sign-in endpoint so that their events are recorded in eu-west-1."
        fr: "Faire connecter les utilisateurs IAM par le point de terminaison de connexion régional d'eu-west-1 pour que leurs événements soient enregistrés dans eu-west-1."
    - id: b
      text:
        en: "Re-create the trail as a single-Region trail in us-east-1, the Region that hosts the global sign-in endpoint."
        fr: "Recréer le journal de suivi comme journal à Région unique dans us-east-1, la Région qui héberge le point de terminaison de connexion global."
    - id: c
      text:
        en: "Convert the trail to a multi-Region trail that records management events in all Regions."
        fr: "Convertir le journal de suivi en journal multirégion qui enregistre les événements de gestion dans toutes les Régions."
    - id: d
      text:
        en: "Enable CloudTrail Insights events for error rates on the existing trail in eu-west-1."
        fr: "Activer les événements CloudTrail Insights sur les taux d'erreur dans le journal de suivi existant d'eu-west-1."
answer: { optionId: c }
explanation:
  correct:
    en: "ConsoleLogin events for IAM users who use the global sign-in endpoint are recorded in us-east-1, or, when the browser holds an account alias cookie, in us-east-2, eu-north-1 or ap-southeast-2 depending on latency. A single-Region trail in eu-west-1 never receives them; a multi-Region trail records them whichever Region handles the sign-in."
    fr: "Les événements ConsoleLogin des utilisateurs IAM qui utilisent le point de terminaison de connexion global sont enregistrés dans us-east-1, ou, lorsque le navigateur détient un cookie d'alias de compte, dans us-east-2, eu-north-1 ou ap-southeast-2 selon la latence. Un journal de suivi à Région unique dans eu-west-1 ne les reçoit jamais ; un journal multirégion les enregistre quelle que soit la Région qui traite la connexion."
  options:
    a:
      en: "Regional sign-in would record the events in eu-west-1, but the users must keep using the global sign-in URL."
      fr: "La connexion régionale enregistrerait les événements dans eu-west-1, mais les utilisateurs doivent continuer à utiliser l'URL de connexion globale."
    b:
      en: "Users whose browser has an account alias cookie are recorded in us-east-2, eu-north-1 or ap-southeast-2, so a trail in us-east-1 alone misses events."
      fr: "Les utilisateurs dont le navigateur a un cookie d'alias de compte sont enregistrés dans us-east-2, eu-north-1 ou ap-southeast-2 : un journal dans la seule Région us-east-1 manque des événements."
    d:
      en: "Insights events analyze the events that the trail already receives; they do not add events from other Regions."
      fr: "Les événements Insights analysent les événements que le journal reçoit déjà ; ils n'ajoutent pas d'événements d'autres Régions."
references:
  - title: AWS Management Console sign-in events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
