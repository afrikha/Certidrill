id: scsc03-4b-ra-profile-session-policy
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two on-premises workloads at AnyCompany obtain credentials through IAM Roles Anywhere with the role OnPremAgent. The role allows read and write access to several Amazon S3 buckets and to Amazon SQS queues. A new reporting workload on another on-premises server will use OnPremAgent too, but it needs only s3:GetObject on the bucket reports. The platform team manages the credential helper configuration of every server. The security team does not want to create a role or change OnPremAgent, and the reporting workload's credentials must follow the principle of least privilege.

    Which solution will meet these requirements?
  fr: |
    Deux charges de travail sur site d'AnyCompany obtiennent des informations d'identification par IAM Roles Anywhere avec le rôle OnPremAgent. Le rôle autorise l'accès en lecture et en écriture à plusieurs compartiments Amazon S3 et à des files d'attente Amazon SQS. Une nouvelle charge de travail de reporting, sur un autre serveur sur site, utilisera aussi OnPremAgent, mais elle n'a besoin que de s3:GetObject sur le compartiment reports. L'équipe plateforme gère la configuration de l'assistant d'informations d'identification de chaque serveur. L'équipe de sécurité ne veut ni créer de rôle ni modifier OnPremAgent, et les informations d'identification de la charge de travail de reporting doivent respecter le principe du moindre privilège.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a permissions boundary to OnPremAgent that allows only s3:GetObject on the reports bucket, so that its sessions cannot do more.
        fr: |-
          Attacher à OnPremAgent une limite d'autorisations qui autorise uniquement s3:GetObject sur le compartiment reports, pour que ses sessions ne puissent pas faire plus.
    - id: b
      text:
        en: |-
          Configure the credential helper on the reporting server with --session-duration 900 so that its credentials expire after 15 minutes.
        fr: |-
          Configurer l'assistant d'informations d'identification du serveur de reporting avec --session-duration 900 pour que ses informations d'identification expirent au bout de 15 minutes.
    - id: c
      text:
        en: |-
          Create a second trust anchor for the reporting server's certificate, and configure the reporting server to use the second trust anchor.
        fr: |-
          Créer une seconde ancre de confiance pour le certificat du serveur de reporting, et configurer le serveur de reporting pour qu'il utilise cette seconde ancre.
    - id: d
      text:
        en: |-
          Create a profile for OnPremAgent with a session policy that allows only s3:GetObject on reports, and use it on the reporting server.
        fr: |-
          Créer un profil pour OnPremAgent avec une politique de session qui autorise uniquement s3:GetObject sur reports, et l'utiliser sur le serveur de reporting.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An IAM Roles Anywhere profile specifies the roles that can be assumed and can carry session policies that limit the permissions of the resulting sessions. The reporting server's sessions get the intersection of OnPremAgent's policy and the session policy, which is s3:GetObject on reports, and the role and the other workloads are unchanged.
    fr: |-
      Un profil IAM Roles Anywhere précise les rôles qui peuvent être endossés et peut porter des politiques de session qui limitent les autorisations des sessions obtenues. Les sessions du serveur de reporting reçoivent l'intersection de la politique d'OnPremAgent et de la politique de session, soit s3:GetObject sur reports, et le rôle comme les autres charges de travail restent inchangés.
  options:
    a:
      en: |-
        A boundary changes the role itself and caps every session of OnPremAgent, which breaks the two existing workloads.
      fr: |-
        Une limite d'autorisations modifie le rôle lui-même et plafonne toutes les sessions d'OnPremAgent, ce qui bloque les deux charges de travail existantes.
    b:
      en: |-
        A shorter session reduces how long the credentials are valid but leaves all of the role's permissions available to the reporting workload.
      fr: |-
        Une session plus courte réduit la durée de validité des informations d'identification, mais laisse toutes les autorisations du rôle à la charge de travail de reporting.
    c:
      en: |-
        A trust anchor establishes trust in a CA; it does not limit the permissions of the sessions created for a role.
      fr: |-
        Une ancre de confiance établit la confiance envers une CA ; elle ne limite pas les autorisations des sessions créées pour un rôle.
references:
  - title: Getting started with IAM Roles Anywhere - IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/getting-started.html
  - title: What is AWS Identity and Access Management Roles Anywhere? - IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
