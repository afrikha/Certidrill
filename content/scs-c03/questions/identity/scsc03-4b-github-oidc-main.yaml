id: scsc03-4b-github-oidc-main
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys to its production account from GitHub Actions. The account has an IAM OIDC identity provider for token.actions.githubusercontent.com. The trust policy of the role ProdDeploy allows sts:AssumeRoleWithWebIdentity for that provider. Only workflows that run on the main branch of the repository payments-api in the GitHub organization AnyCompanyOrg must be able to assume ProdDeploy.

    Which condition block should the trust policy contain?
  fr: |
    AnyCompany déploie dans son compte de production depuis GitHub Actions. Le compte dispose d'un fournisseur d'identité OIDC IAM pour `token.actions.githubusercontent.com`. La politique d'approbation du rôle ProdDeploy autorise sts:AssumeRoleWithWebIdentity pour ce fournisseur. Seuls les workflows exécutés sur la branche main du dépôt payments-api de l'organisation GitHub AnyCompanyOrg doivent pouvoir endosser ProdDeploy.

    Quel bloc de condition la politique d'approbation doit-elle contenir ?
body:
  options:
    - id: a
      text:
        en: |-
          StringEquals on token.actions.githubusercontent.com:aud for sts.amazonaws.com, and StringLike on token.actions.githubusercontent.com:sub for repo:AnyCompanyOrg/*.
        fr: |-
          StringEquals sur `token.actions.githubusercontent.com:aud` pour sts.amazonaws.com, et StringLike sur `token.actions.githubusercontent.com:sub` pour repo:AnyCompanyOrg/*.
    - id: b
      text:
        en: |-
          StringEquals on token.actions.githubusercontent.com:aud for sts.amazonaws.com and on token.actions.githubusercontent.com:sub for repo:AnyCompanyOrg/payments-api:ref:refs/heads/main.
        fr: |-
          StringEquals sur `token.actions.githubusercontent.com:aud` pour sts.amazonaws.com et sur `token.actions.githubusercontent.com:sub` pour repo:AnyCompanyOrg/payments-api:ref:refs/heads/main.
    - id: c
      text:
        en: |-
          StringEquals on token.actions.githubusercontent.com:aud for sts.amazonaws.com only, because the OIDC provider already limits tokens to the company's GitHub organization.
        fr: |-
          StringEquals sur `token.actions.githubusercontent.com:aud` pour sts.amazonaws.com uniquement, car le fournisseur OIDC limite déjà les jetons à l'organisation GitHub de l'entreprise.
    - id: d
      text:
        en: |-
          StringEquals on token.actions.githubusercontent.com:aud for sts.amazonaws.com, and StringLike on token.actions.githubusercontent.com:sub for repo:*/payments-api:ref:refs/heads/main.
        fr: |-
          StringEquals sur `token.actions.githubusercontent.com:aud` pour sts.amazonaws.com, et StringLike sur `token.actions.githubusercontent.com:sub` pour repo:*/payments-api:ref:refs/heads/main.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The sub claim of a GitHub token identifies the organization, repository, and ref of the workflow, so an exact match on repo:AnyCompanyOrg/payments-api:ref:refs/heads/main admits only the main branch of that repository. The aud condition checks that the token was issued for AWS STS.
    fr: |-
      La revendication sub d'un jeton GitHub identifie l'organisation, le dépôt et la référence du workflow : une correspondance exacte sur repo:AnyCompanyOrg/payments-api:ref:refs/heads/main n'admet que la branche main de ce dépôt. La condition aud vérifie que le jeton a été émis pour AWS STS.
  options:
    a:
      en: |-
        The wildcard admits every repository and branch of the organization, which is broader than the main branch of payments-api.
      fr: |-
        Le caractère générique admet tous les dépôts et toutes les branches de l'organisation, ce qui est plus large que la branche main de payments-api.
    c:
      en: |-
        The GitHub provider issues tokens for all GitHub workflows, so without a sub condition any organization could assume the role; IAM also rejects a trust policy for this provider that has no sub condition.
      fr: |-
        Le fournisseur GitHub émet des jetons pour tous les workflows GitHub : sans condition sub, n'importe quelle organisation pourrait endosser le rôle ; IAM rejette d'ailleurs une politique d'approbation pour ce fournisseur sans condition sub.
    d:
      en: |-
        The wildcard in place of the organization admits a repository named payments-api in any GitHub organization, including organizations that the company does not control.
      fr: |-
        Le caractère générique à la place de l'organisation admet un dépôt nommé payments-api dans n'importe quelle organisation GitHub, y compris des organisations que l'entreprise ne contrôle pas.
references:
  - title: Create a role for OpenID Connect federation (console) - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
