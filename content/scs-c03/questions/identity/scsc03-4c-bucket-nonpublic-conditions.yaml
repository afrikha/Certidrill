id: scsc03-4c-bucket-nonpublic-conditions
objective: "4.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    IAM Access Analyzer reports that an Amazon S3 bucket of AnyCompany is public because of the following bucket policy statement:

    ```json
    {
      "Effect": "Allow",
      "Principal": "*",
      "Action": "s3:GetObject",
      "Resource": "arn:aws:s3:::example-catalog/*",
      "Condition": {"StringLike": {"aws:SourceVpc": "vpc-*"}}
    }
    ```

    All legitimate readers are IAM roles of the company's organization o-a1b2c3d4e5, and they reach Amazon S3 only through the gateway endpoint vpce-0a1b2c3d4e5f60718.

    Which changes to the condition would each make the policy non-public while keeping access for the legitimate readers? (Choose two.)

    Each correct answer presents a complete solution.
  fr: |
    IAM Access Analyzer signale qu'un compartiment Amazon S3 d'AnyCompany est public à cause de l'instruction de politique de compartiment suivante :

    ```json
    {
      "Effect": "Allow",
      "Principal": "*",
      "Action": "s3:GetObject",
      "Resource": "arn:aws:s3:::example-catalog/*",
      "Condition": {"StringLike": {"aws:SourceVpc": "vpc-*"}}
    }
    ```

    Tous les lecteurs légitimes sont des rôles IAM de l'organisation o-a1b2c3d4e5 de l'entreprise, et ils n'atteignent Amazon S3 que par le point de terminaison de passerelle vpce-0a1b2c3d4e5f60718.

    Quelles modifications de la condition rendraient chacune la politique non publique tout en conservant l'accès des lecteurs légitimes ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replace the condition with StringLike on aws:SourceVpce and the value vpce-*.", fr: "Remplacer la condition par StringLike sur aws:SourceVpce avec la valeur vpce-*." } }
    - { id: b, text: { en: "Replace the condition with StringEquals on aws:SourceVpce and the value vpce-0a1b2c3d4e5f60718.", fr: "Remplacer la condition par StringEquals sur aws:SourceVpce avec la valeur vpce-0a1b2c3d4e5f60718." } }
    - { id: c, text: { en: "Replace the condition with IpAddress on aws:SourceIp and the value 10.0.0.0/8, the address range of the company's VPCs.", fr: "Remplacer la condition par IpAddress sur aws:SourceIp avec la valeur 10.0.0.0/8, la plage d'adresses des VPC de l'entreprise." } }
    - { id: d, text: { en: "Replace the condition with StringEquals on aws:PrincipalOrgID and the value o-a1b2c3d4e5.", fr: "Remplacer la condition par StringEquals sur aws:PrincipalOrgID avec la valeur o-a1b2c3d4e5." } }
    - { id: e, text: { en: "Keep the condition, and add a second condition with Bool on aws:SecureTransport and the value true.", fr: "Conserver la condition et ajouter une seconde condition Bool sur aws:SecureTransport avec la valeur true." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Amazon S3 treats a bucket policy as public unless it grants access only to fixed values, without wildcards or policy variables, of keys such as a principal or aws:PrincipalOrgID, aws:SourceVpce, aws:SourceVpc, aws:SourceIp, aws:SourceArn or aws:SourceAccount. A fixed VPC endpoint ID or a fixed organization ID each makes the statement non-public, and both match the legitimate readers.
    fr: |-
      Amazon S3 considère une politique de compartiment comme publique sauf si elle n'accorde l'accès qu'à des valeurs fixes, sans caractère générique ni variable de politique, de clés comme un principal ou aws:PrincipalOrgID, aws:SourceVpce, aws:SourceVpc, aws:SourceIp, aws:SourceArn ou aws:SourceAccount. Un ID de point de terminaison d'un VPC fixe ou un ID d'organisation fixe rend chacun l'instruction non publique, et les deux correspondent aux lecteurs légitimes.
  options:
    a:
      en: |-
        A wildcard value matches any VPC endpoint, including endpoints of other accounts, so the policy stays public.
      fr: |-
        Une valeur générique correspond à n'importe quel point de terminaison d'un VPC, y compris ceux d'autres comptes : la politique reste publique.
    c:
      en: |-
        aws:SourceIp is not in the request context when the request comes through a VPC endpoint, so the readers would lose access; aws:VpcSourceIp is the key for private addresses.
      fr: |-
        aws:SourceIp n'est pas présente dans le contexte de la requête quand celle-ci passe par un point de terminaison d'un VPC : les lecteurs perdraient l'accès ; aws:VpcSourceIp est la clé des adresses privées.
    e:
      en: |-
        Requiring TLS does not restrict who can read; the wildcard aws:SourceVpc condition still makes the policy public.
      fr: |-
        Exiger TLS ne restreint pas qui peut lire ; la condition générique sur aws:SourceVpc rend toujours la politique publique.
references:
  - title: Blocking public access to your Amazon S3 storage - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
  - title: AWS global condition context keys - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
