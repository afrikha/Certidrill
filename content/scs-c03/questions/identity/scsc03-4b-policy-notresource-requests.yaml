id: scsc03-4b-policy-notresource-requests
objective: "4.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    The role Reporting in account 111122223333 has only the following identity-based policy. The bucket reports-bucket is in the same account and has no bucket policy.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject"],
          "Resource": "arn:aws:s3:::reports-bucket/*"
        },
        {
          "Effect": "Allow",
          "Action": "s3:ListBucket",
          "Resource": "arn:aws:s3:::reports-bucket",
          "Condition": { "StringLike": { "s3:prefix": ["finance/*"] } }
        },
        {
          "Effect": "Deny",
          "Action": "s3:PutObject",
          "NotResource": "arn:aws:s3:::reports-bucket/finance/*"
        }
      ]
    }
    ```

    Which two requests from Reporting will succeed? (Choose two.)
  fr: |
    Le rôle Reporting du compte 111122223333 possède uniquement la politique basée sur l'identité suivante. Le compartiment reports-bucket se trouve dans le même compte et n'a pas de politique de compartiment.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject"],
          "Resource": "arn:aws:s3:::reports-bucket/*"
        },
        {
          "Effect": "Allow",
          "Action": "s3:ListBucket",
          "Resource": "arn:aws:s3:::reports-bucket",
          "Condition": { "StringLike": { "s3:prefix": ["finance/*"] } }
        },
        {
          "Effect": "Deny",
          "Action": "s3:PutObject",
          "NotResource": "arn:aws:s3:::reports-bucket/finance/*"
        }
      ]
    }
    ```

    Quelles sont les deux demandes de Reporting qui réussiront ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          s3:GetObject on the object hr/q3.csv.
        fr: |-
          s3:GetObject sur l'objet hr/q3.csv.
    - id: b
      text:
        en: |-
          s3:PutObject on the object hr/q3.csv.
        fr: |-
          s3:PutObject sur l'objet hr/q3.csv.
    - id: c
      text:
        en: |-
          s3:PutObject on the object finance/q3.csv.
        fr: |-
          s3:PutObject sur l'objet finance/q3.csv.
    - id: d
      text:
        en: |-
          s3:ListBucket on reports-bucket with the prefix hr/.
        fr: |-
          s3:ListBucket sur reports-bucket avec le préfixe hr/.
    - id: e
      text:
        en: |-
          s3:DeleteObject on the object finance/q3.csv.
        fr: |-
          s3:DeleteObject sur l'objet finance/q3.csv.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The first statement allows reads and writes on every object, and the Deny with NotResource blocks s3:PutObject on every resource except objects under finance/. Reading hr/q3.csv is therefore allowed, and writing finance/q3.csv is allowed because that object is excluded from the Deny.
    fr: |-
      La première instruction autorise les lectures et écritures sur tous les objets, et le Deny avec NotResource bloque s3:PutObject sur toutes les ressources sauf les objets situés sous finance/. Lire hr/q3.csv est donc autorisé, et écrire finance/q3.csv est autorisé, car cet objet est exclu du Deny.
  options:
    b:
      en: |-
        hr/q3.csv is not under finance/, so the Deny with NotResource applies and overrides the Allow.
      fr: |-
        hr/q3.csv n'est pas sous finance/ : le Deny avec NotResource s'applique et l'emporte sur l'Allow.
    d:
      en: |-
        Listing is allowed only when the prefix matches finance/*, so a listing of hr/ is implicitly denied.
      fr: |-
        La liste n'est autorisée que si le préfixe correspond à finance/* : une liste de hr/ est implicitement refusée.
    e:
      en: |-
        No statement allows s3:DeleteObject, so the request is implicitly denied.
      fr: |-
        Aucune instruction n'autorise s3:DeleteObject : la demande est implicitement refusée.
references:
  - title: Policy evaluation logic - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html
