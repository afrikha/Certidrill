id: scsc03-4c-lambda-url-public
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    IAM Access Analyzer reports that the AWS Lambda function OrdersApi in a member account of AnyCompany's organization is publicly accessible. A developer created its function URL with the auth type NONE through the AWS CLI and added resource-based policy statements with the principal `"*"`. The function URL must accept only requests from IAM principals of the company's organization. No developer in any member account must be able to create or update a function URL that skips IAM authentication.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    IAM Access Analyzer signale que la fonction AWS Lambda OrdersApi, dans un compte membre de l'organisation d'AnyCompany, est accessible publiquement. Un développeur a créé son URL de fonction avec le type d'authentification NONE au moyen de l'AWS CLI et a ajouté des instructions de politique basée sur les ressources avec le principal `"*"`. L'URL de fonction ne doit accepter que les requêtes de principaux IAM de l'organisation de l'entreprise. Aucun développeur d'aucun compte membre ne doit pouvoir créer ou mettre à jour une URL de fonction qui se passe de l'authentification IAM.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Delete the function URL, because Lambda then removes the public statements from the function's resource-based policy automatically.", fr: "Supprimer l'URL de fonction, car Lambda retire alors automatiquement les instructions publiques de la politique basée sur les ressources de la fonction." } }
    - { id: b, text: { en: "Attach a service control policy (SCP) that denies lambda:InvokeFunctionUrl to principals outside the organization.", fr: "Attacher une politique de contrôle des services (SCP) qui refuse lambda:InvokeFunctionUrl aux principaux extérieurs à l'organisation." } }
    - { id: c, text: { en: "Attach an SCP that denies lambda:CreateFunctionUrlConfig and lambda:UpdateFunctionUrlConfig when lambda:FunctionUrlAuthType is not AWS_IAM.", fr: "Attacher une SCP qui refuse lambda:CreateFunctionUrlConfig et lambda:UpdateFunctionUrlConfig quand lambda:FunctionUrlAuthType n'est pas AWS_IAM." } }
    - { id: d, text: { en: "Archive the finding, and create an archive rule for Lambda function findings that do not report public access.", fr: "Archiver le résultat, puis créer une règle d'archivage pour les résultats de fonctions Lambda qui ne signalent pas d'accès public." } }
    - { id: e, text: { en: "Change the auth type of the function URL to AWS_IAM, and replace the public statements with statements that allow the organization through aws:PrincipalOrgID.", fr: "Passer le type d'authentification de l'URL de fonction à AWS_IAM, et remplacer les instructions publiques par des instructions qui autorisent l'organisation au moyen d'aws:PrincipalOrgID." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      With the AWS_IAM auth type, Lambda authenticates every request and evaluates the caller's identity-based policy and the function's resource-based policy, which can be limited to the organization with aws:PrincipalOrgID. An SCP with the lambda:FunctionUrlAuthType condition key prevents developers in member accounts from creating or updating function URLs with the NONE auth type.
    fr: |-
      Avec le type d'authentification AWS_IAM, Lambda authentifie chaque requête et évalue la politique basée sur l'identité de l'appelant et la politique basée sur les ressources de la fonction, que l'on peut limiter à l'organisation avec aws:PrincipalOrgID. Une SCP avec la clé de condition lambda:FunctionUrlAuthType empêche les développeurs des comptes membres de créer ou de mettre à jour des URL de fonction avec le type d'authentification NONE.
  options:
    a:
      en: |-
        Deleting a function URL with the NONE auth type does not delete the related resource-based policy statements, and the function URL is still needed.
      fr: |-
        Supprimer une URL de fonction de type NONE ne supprime pas les instructions de politique basée sur les ressources associées, et l'URL de fonction reste nécessaire.
    b:
      en: |-
        SCPs apply only to principals of the organization's member accounts; they cannot restrict anonymous callers or principals outside the organization.
      fr: |-
        Les SCP ne s'appliquent qu'aux principaux des comptes membres de l'organisation ; elles ne peuvent pas restreindre les appelants anonymes ni les principaux extérieurs à l'organisation.
    d:
      en: |-
        Archiving records that access is intended; it leaves the function public and prevents nothing.
      fr: |-
        L'archivage indique qu'un accès est voulu ; il laisse la fonction publique et n'empêche rien.
references:
  - title: Control access to Lambda function URLs - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/urls-auth.html
  - title: Service control policies (SCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
