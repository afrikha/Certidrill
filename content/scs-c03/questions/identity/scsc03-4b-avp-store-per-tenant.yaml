id: scsc03-4b-avp-store-per-tenant
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company runs a multi-tenant SaaS application on Amazon API Gateway and AWS Lambda. The application uses Amazon Verified Permissions for authorization. Each tenant's administrators write their own Cedar policies through a self-service portal, and some tenants customize the schema with their own entity attributes. A policy written by one tenant must never be considered in another tenant's authorization decisions, even if the policy contains a mistake. When a tenant leaves, all of its policies must be removed in a single operation.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels exploite une application SaaS multilocataire sur Amazon API Gateway et AWS Lambda. L'application utilise Amazon Verified Permissions pour l'autorisation. Les administrateurs de chaque locataire écrivent leurs propres politiques Cedar dans un portail en libre-service, et certains locataires personnalisent le schéma avec leurs propres attributs d'entité. Une politique écrite par un locataire ne doit jamais être prise en compte dans les décisions d'autorisation d'un autre locataire, même si elle contient une erreur. Lorsqu'un locataire part, toutes ses politiques doivent être supprimées en une seule opération.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create one policy store for each tenant, and have the application pass the tenant's policy store ID in each authorization request.
        fr: |-
          Créer un magasin de politiques par locataire, et faire transmettre par l'application l'ID du magasin de politiques du locataire dans chaque demande d'autorisation.
    - id: b
      text:
        en: |-
          Use one shared policy store, and require a `when { principal.tenant == resource.tenant }` condition in every policy that a tenant writes.
        fr: |-
          Utiliser un seul magasin de politiques partagé, et exiger une condition `when { principal.tenant == resource.tenant }` dans chaque politique écrite par un locataire.
    - id: c
      text:
        en: |-
          Use one shared policy store with a separate namespace for each tenant, and prefix every tenant's entity types with its namespace.
        fr: |-
          Utiliser un seul magasin de politiques partagé avec un espace de noms distinct par locataire, et préfixer les types d'entités de chaque locataire par son espace de noms.
    - id: d
      text:
        en: |-
          Create one Amazon Cognito user pool for each tenant, and configure each user pool as an identity source of one shared policy store.
        fr: |-
          Créer un groupe d'utilisateurs Amazon Cognito par locataire, et configurer chaque groupe d'utilisateurs comme source d'identité d'un seul magasin de politiques partagé.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS recommends one policy store per tenant for multi-tenant applications. An authorization request evaluates only the policies of the store it names, so a faulty tenant policy cannot affect other tenants, each store has its own schema, and deleting the tenant's store removes all of its policies at once.
    fr: |-
      AWS recommande un magasin de politiques par locataire pour les applications multilocataires. Une demande d'autorisation n'évalue que les politiques du magasin qu'elle désigne : une politique erronée d'un locataire ne peut pas affecter les autres, chaque magasin a son propre schéma, et supprimer le magasin du locataire retire toutes ses politiques d'un coup.
  options:
    b:
      en: |-
        Isolation depends on every tenant writing the condition correctly, so one mistake can grant access across tenants; offboarding also means deleting policies one by one, and the schema is shared.
      fr: |-
        L'isolation dépend de chaque locataire qui doit écrire la condition correctement : une seule erreur peut accorder un accès entre locataires ; le départ d'un locataire exige aussi de supprimer les politiques une par une, et le schéma est partagé.
    c:
      en: |-
        Namespaces make entity types distinct, but all tenants still share one store and one schema, and removing a tenant still means deleting its policies one by one.
      fr: |-
        Les espaces de noms rendent les types d'entités distincts, mais tous les locataires partagent toujours un magasin et un schéma, et retirer un locataire exige encore de supprimer ses politiques une par une.
    d:
      en: |-
        Identity sources only map token claims to principals; they do not separate the policies, which all remain in the shared store.
      fr: |-
        Les sources d'identité associent seulement les revendications des jetons aux principaux ; elles ne séparent pas les politiques, qui restent toutes dans le magasin partagé.
references:
  - title: Amazon Verified Permissions policy stores - Amazon Verified Permissions
    url: https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/policy-stores.html
