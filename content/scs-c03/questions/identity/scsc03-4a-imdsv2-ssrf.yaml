id: scsc03-4a-imdsv2-ssrf
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a web application directly on Amazon EC2 instances that have an IAM role attached; no containers run on the instances. A penetration test showed that a server-side request forgery (SSRF) flaw lets an attacker make the application send HTTP GET requests to any URL, including the instance metadata service, and return the responses. The application must keep using its role credentials through an AWS SDK that supports IMDSv2. The company needs a protection at the instance level while the code is being fixed.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application web directement sur des instances Amazon EC2 auxquelles un rôle IAM est attaché ; aucun conteneur ne s'exécute sur les instances. Un test d'intrusion a montré qu'une faille de falsification de requête côté serveur (SSRF) permet à un attaquant de faire envoyer par l'application des requêtes HTTP GET vers n'importe quelle URL, y compris le service de métadonnées d'instance, et d'en obtenir les réponses. L'application doit continuer à utiliser les informations d'identification de son rôle par un SDK AWS qui prend en charge IMDSv2. L'entreprise a besoin d'une protection au niveau de l'instance pendant la correction du code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn off the instance metadata service endpoint on the instances so that no request can reach the metadata service."
        fr: "Désactiver le point de terminaison du service de métadonnées d'instance sur les instances pour qu'aucune requête ne puisse l'atteindre."
    - id: b
      text:
        en: "Set HttpTokens to required so that the instance metadata service accepts only IMDSv2 requests that carry a session token."
        fr: "Définir HttpTokens sur required pour que le service de métadonnées d'instance n'accepte que les requêtes IMDSv2 qui portent un jeton de session."
    - id: c
      text:
        en: "Set the PUT response hop limit to 2 so that metadata requests from the application are always answered."
        fr: "Définir la limite de sauts de la réponse PUT sur 2 pour que les requêtes de métadonnées de l'application reçoivent toujours une réponse."
    - id: d
      text:
        en: "Set the maximum session duration of the instance role to 1 hour so that stolen credentials expire sooner."
        fr: "Définir la durée de session maximale du rôle d'instance sur 1 heure pour que les informations d'identification volées expirent plus tôt."
answer: { optionId: b }
explanation:
  correct:
    en: "With HttpTokens set to required, every metadata request must carry a session token that is obtained with a PUT request, and PUT requests that contain an X-Forwarded-For header are rejected. A flaw that can only make the application send GET requests cannot obtain a token, while the SDK keeps retrieving the role credentials with IMDSv2."
    fr: "Avec HttpTokens défini sur required, chaque requête de métadonnées doit porter un jeton de session obtenu par une requête PUT, et les requêtes PUT qui contiennent un en-tête X-Forwarded-For sont refusées. Une faille qui ne peut faire envoyer que des requêtes GET ne peut pas obtenir de jeton, tandis que le SDK continue de récupérer les informations d'identification du rôle avec IMDSv2."
  options:
    a:
      en: "Without the metadata endpoint, the application could no longer obtain its role credentials."
      fr: "Sans le point de terminaison des métadonnées, l'application ne pourrait plus obtenir les informations d'identification de son rôle."
    c:
      en: "A larger hop limit is needed only for containers, and it lets the token response travel farther instead of protecting the credentials."
      fr: "Une limite de sauts plus élevée n'est utile que pour les conteneurs, et elle laisse la réponse du jeton aller plus loin au lieu de protéger les informations d'identification."
    d:
      en: "Shorter-lived credentials could still be stolen through the flaw and used until they expire."
      fr: "Des informations d'identification de plus courte durée pourraient toujours être volées par la faille et utilisées jusqu'à leur expiration."
references:
  - title: Use the Instance Metadata Service to access instance metadata
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html
