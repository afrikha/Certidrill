id: scsc03-4b-lambda-table-scope
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function reads items from the Amazon DynamoDB table Orders in account 111122223333 by using the GetItem and Query operations. The account contains 40 other DynamoDB tables. The security team requires the function's execution role to follow the principle of least privilege.

    Which policy should be attached to the execution role?
  fr: |
    Une fonction AWS Lambda lit des éléments de la table Amazon DynamoDB Orders du compte 111122223333 au moyen des opérations GetItem et Query. Le compte contient 40 autres tables DynamoDB. L'équipe de sécurité exige que le rôle d'exécution de la fonction respecte le principe du moindre privilège.

    Quelle politique faut-il attacher au rôle d'exécution ?
body:
  options:
    - id: a
      text:
        en: |-
          The AWS managed policy AmazonDynamoDBReadOnlyAccess, which AWS maintains for read-only access to DynamoDB.
        fr: |-
          La politique gérée par AWS AmazonDynamoDBReadOnlyAccess, qu'AWS maintient pour l'accès en lecture seule à DynamoDB.
    - id: b
      text:
        en: |-
          A customer managed policy that allows dynamodb:* on the ARN of the Orders table.
        fr: |-
          Une politique gérée par le client qui autorise dynamodb:* sur l'ARN de la table Orders.
    - id: c
      text:
        en: |-
          A customer managed policy that allows dynamodb:GetItem and dynamodb:Query on all resources.
        fr: |-
          Une politique gérée par le client qui autorise dynamodb:GetItem et dynamodb:Query sur toutes les ressources.
    - id: d
      text:
        en: |-
          A customer managed policy that allows dynamodb:GetItem and dynamodb:Query on the ARN of the Orders table.
        fr: |-
          Une politique gérée par le client qui autorise dynamodb:GetItem et dynamodb:Query sur l'ARN de la table Orders.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Least privilege means granting only the actions needed on the specific resources needed. A customer managed policy that lists the two read operations on the Orders table ARN gives the function exactly what it uses and nothing on the other tables.
    fr: |-
      Le moindre privilège consiste à n'accorder que les actions nécessaires sur les ressources précises nécessaires. Une politique gérée par le client qui liste les deux opérations de lecture sur l'ARN de la table Orders donne à la fonction exactement ce qu'elle utilise, et rien sur les autres tables.
  options:
    a:
      en: |-
        AWS managed policies are written for all customers and might not be least privilege; this one grants read access to every table in the account and to related services.
      fr: |-
        Les politiques gérées par AWS sont écrites pour tous les clients et peuvent ne pas respecter le moindre privilège ; celle-ci accorde la lecture de toutes les tables du compte et de services associés.
    b:
      en: |-
        dynamodb:* includes write and delete actions and table management, which the function does not need.
      fr: |-
        dynamodb:* inclut des actions d'écriture et de suppression ainsi que la gestion des tables, dont la fonction n'a pas besoin.
    c:
      en: |-
        The right actions on all resources let the function read the 40 other tables.
      fr: |-
        Les bonnes actions sur toutes les ressources permettent à la fonction de lire les 40 autres tables.
references:
  - title: Security best practices in IAM - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
