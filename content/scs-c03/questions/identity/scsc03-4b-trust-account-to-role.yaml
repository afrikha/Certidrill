id: scsc03-4b-trust-account-to-role
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The role ProdDeployer in account 444455556666 has the following trust policy statement:

    ```json
    {
      "Effect": "Allow",
      "Principal": { "AWS": "arn:aws:iam::111122223333:root" },
      "Action": "sts:AssumeRole"
    }
    ```

    Only the role CIRunner in account 111122223333 must be able to assume ProdDeployer, even if administrators of account 111122223333 grant sts:AssumeRole on ProdDeployer to other principals.

    Which solution will meet these requirements?
  fr: |
    Le rôle ProdDeployer du compte 444455556666 possède l'instruction de politique d'approbation suivante :

    ```json
    {
      "Effect": "Allow",
      "Principal": { "AWS": "arn:aws:iam::111122223333:root" },
      "Action": "sts:AssumeRole"
    }
    ```

    Seul le rôle CIRunner du compte 111122223333 doit pouvoir endosser ProdDeployer, même si les administrateurs du compte 111122223333 accordent sts:AssumeRole sur ProdDeployer à d'autres principaux.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP to account 444455556666 that denies sts:AssumeRole on ProdDeployer unless aws:PrincipalArn is the CIRunner role ARN.
        fr: |-
          Attacher au compte 444455556666 une SCP qui refuse sts:AssumeRole sur ProdDeployer sauf si aws:PrincipalArn est l'ARN du rôle CIRunner.
    - id: b
      text:
        en: |-
          Add a StringEquals condition on aws:SourceAccount for 111122223333 to the trust policy statement of ProdDeployer.
        fr: |-
          Ajouter une condition StringEquals sur aws:SourceAccount pour 111122223333 à l'instruction de politique d'approbation de ProdDeployer.
    - id: c
      text:
        en: |-
          Attach a permissions boundary to CIRunner that allows sts:AssumeRole only on the ProdDeployer role ARN.
        fr: |-
          Attacher à CIRunner une limite d'autorisations qui autorise sts:AssumeRole uniquement sur l'ARN du rôle ProdDeployer.
    - id: d
      text:
        en: |-
          Replace the Principal element of the trust policy statement with `{"AWS": "arn:aws:iam::111122223333:role/CIRunner"}`.
        fr: |-
          Remplacer l'élément Principal de l'instruction de politique d'approbation par `{"AWS": "arn:aws:iam::111122223333:role/CIRunner"}`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An account principal in a trust policy delegates the decision to the trusted account: any user or role that its administrators allow can assume the role. Naming the CIRunner role ARN as the principal limits the trust to that role, whatever identity-based policies account 111122223333 creates.
    fr: |-
      Un principal de compte dans une politique d'approbation délègue la décision au compte approuvé : tout utilisateur ou rôle autorisé par ses administrateurs peut endosser le rôle. Nommer l'ARN du rôle CIRunner comme principal limite la confiance à ce rôle, quelles que soient les politiques basées sur l'identité créées dans le compte 111122223333.
  options:
    a:
      en: |-
        An SCP limits the principals of the accounts it is attached to; the callers are in account 111122223333, so an SCP on account 444455556666 does not restrict them.
      fr: |-
        Une SCP limite les principaux des comptes auxquels elle est attachée ; les appelants sont dans le compte 111122223333, donc une SCP sur le compte 444455556666 ne les restreint pas.
    b:
      en: |-
        aws:SourceAccount is set when an AWS service acts for a resource; for direct AssumeRole calls it adds nothing, and the account principal already limits callers to account 111122223333.
      fr: |-
        aws:SourceAccount est défini lorsqu'un service AWS agit pour une ressource ; pour des appels AssumeRole directs il n'apporte rien, et le principal de compte limite déjà les appelants au compte 111122223333.
    c:
      en: |-
        A boundary restricts only CIRunner; other principals in account 111122223333 that receive sts:AssumeRole could still assume ProdDeployer.
      fr: |-
        Une limite d'autorisations ne restreint que CIRunner ; d'autres principaux du compte 111122223333 qui reçoivent sts:AssumeRole pourraient toujours endosser ProdDeployer.
references:
  - title: "AWS JSON policy elements: Principal - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html
