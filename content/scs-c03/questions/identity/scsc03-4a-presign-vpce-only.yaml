id: scsc03-4a-presign-vpce-only
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's internal reporting application generates Amazon S3 presigned URLs so that employees can download reports from a bucket. A security assessment found that a presigned URL copied to a personal device worked from the internet. Employee devices reach Amazon S3 only through the interface VPC endpoint vpce-0a1b2c3d in the corporate VPC. The company requires that presigned URLs for this bucket work only through that endpoint.

    Which solution will meet these requirements?
  fr: |
    L'application interne de rapports d'AnyCompany génère des URL présignées Amazon S3 pour que les employés téléchargent des rapports depuis un compartiment. Une évaluation de sécurité a montré qu'une URL présignée copiée sur un appareil personnel fonctionnait depuis Internet. Les appareils des employés n'atteignent Amazon S3 que par le point de terminaison de VPC d'interface vpce-0a1b2c3d du VPC de l'entreprise. L'entreprise exige que les URL présignées de ce compartiment ne fonctionnent que par ce point de terminaison.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Shorten the expiration of the presigned URLs to 5 minutes so that a copied URL expires before it can be used elsewhere."
        fr: "Réduire à 5 minutes l'expiration des URL présignées pour qu'une URL copiée expire avant de pouvoir être utilisée ailleurs."
    - id: b
      text:
        en: "Add an aws:SourceIp condition with the corporate public IP ranges to the identity-based policy of the role that signs the URLs."
        fr: "Ajouter une condition aws:SourceIp avec les plages d'adresses IP publiques de l'entreprise à la politique basée sur l'identité du rôle qui signe les URL."
    - id: c
      text:
        en: "Turn on all four S3 Block Public Access settings for the bucket and for the account that owns it."
        fr: "Activer les quatre paramètres S3 Block Public Access pour le compartiment et pour le compte qui le possède."
    - id: d
      text:
        en: "Add a bucket policy statement that denies s3:GetObject to all principals when aws:SourceVpce is not vpce-0a1b2c3d."
        fr: "Ajouter une instruction de politique de compartiment qui refuse s3:GetObject à tous les principaux lorsque aws:SourceVpce n'est pas vpce-0a1b2c3d."
answer: { optionId: d }
explanation:
  correct:
    en: "Presigned URLs are bearer tokens, so restricting where they can be used requires a network condition. A bucket policy that denies requests whose aws:SourceVpce is not the corporate endpoint applies to every request to the bucket, including requests made with presigned URLs."
    fr: "Les URL présignées sont des jetons au porteur : limiter l'endroit où elles peuvent être utilisées exige une condition réseau. Une politique de compartiment qui refuse les requêtes dont aws:SourceVpce n'est pas le point de terminaison de l'entreprise s'applique à toutes les requêtes adressées au compartiment, y compris celles faites avec des URL présignées."
  options:
    a:
      en: "A short expiration reduces the time window, but a copied URL still works from any network until it expires."
      fr: "Une expiration courte réduit la fenêtre de temps, mais une URL copiée fonctionne toujours depuis n'importe quel réseau jusqu'à son expiration."
    b:
      en: "Requests through a VPC endpoint carry private source addresses, so a condition on public ranges would block employees and would not tie access to the endpoint."
      fr: "Les requêtes qui passent par un point de terminaison de VPC portent des adresses source privées : une condition sur des plages publiques bloquerait les employés et ne lierait pas l'accès au point de terminaison."
    c:
      en: "Block Public Access stops public grants in bucket policies and ACLs; it does not affect requests that a presigned URL authenticates."
      fr: "Block Public Access empêche les accès publics accordés par les politiques de compartiment et les ACL ; il n'affecte pas les requêtes authentifiées par une URL présignée."
references:
  - title: Download and upload objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html
