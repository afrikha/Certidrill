id: scsc03-4a-multi-presign-age-audit
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's document service runs on AWS Lambda and generates Amazon S3 presigned GET URLs for authenticated users of its web application. The security team has two requirements. A presigned URL must be usable for no more than 15 minutes after it is signed, whatever expiration the code sets. Investigators must be able to link each URL that is issued to the application user who requested it.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Le service documentaire d'AnyCompany s'exécute sur AWS Lambda et génère des URL GET présignées Amazon S3 pour les utilisateurs authentifiés de son application web. L'équipe de sécurité a deux exigences. Une URL présignée ne doit pas être utilisable plus de 15 minutes après sa signature, quelle que soit l'expiration définie par le code. Les enquêteurs doivent pouvoir relier chaque URL émise à l'utilisateur de l'application qui l'a demandée.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Add a bucket policy statement that denies object requests when s3:signatureAge is greater than 900000."
        fr: "Ajouter une instruction de politique de compartiment qui refuse les requêtes sur les objets lorsque s3:signatureAge est supérieur à 900000."
    - id: b
      text:
        en: "Enable S3 server access logging, and identify the application user from the requester field of each GET request."
        fr: "Activer la journalisation des accès au serveur S3, et identifier l'utilisateur de l'application à partir du champ du demandeur de chaque requête GET."
    - id: c
      text:
        en: "Set the maximum session duration of the IAM role that signs the URLs to 15 minutes."
        fr: "Définir sur 15 minutes la durée de session maximale du rôle IAM qui signe les URL."
    - id: d
      text:
        en: "Sign each URL in a role session whose session name identifies the application user, and record each issuance in the application logs."
        fr: "Signer chaque URL dans une session de rôle dont le nom de session identifie l'utilisateur de l'application, et consigner chaque émission dans les journaux de l'application."
    - id: e
      text:
        en: "Enable S3 Object Lock in governance mode on the bucket so that each presigned URL can be used only once."
        fr: "Activer S3 Object Lock en mode gouvernance sur le compartiment pour que chaque URL présignée ne puisse être utilisée qu'une fois."
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: "s3:signatureAge is the age of the request signature in milliseconds, so a bucket policy that denies requests above 900,000 limits every presigned URL to 15 minutes after signing. Logs identify the principal that signed a URL, not the person who uses it, so AWS recommends signing with a unique STS role session for each application user and recording the issuance in the application."
    fr: "s3:signatureAge est l'âge de la signature de la requête en millisecondes : une politique de compartiment qui refuse les requêtes au-delà de 900 000 limite chaque URL présignée à 15 minutes après sa signature. Les journaux identifient le principal qui a signé l'URL, pas la personne qui l'utilise : AWS recommande donc de signer avec une session de rôle STS unique par utilisateur de l'application et de consigner l'émission dans l'application."
  options:
    b:
      en: "Access logs show the principal that signed the URL, not the application user who requested it or used it."
      fr: "Les journaux d'accès indiquent le principal qui a signé l'URL, pas l'utilisateur de l'application qui l'a demandée ou utilisée."
    c:
      en: "The maximum session duration of a role can be set only between 1 and 12 hours."
      fr: "La durée de session maximale d'un rôle ne peut être définie qu'entre 1 et 12 heures."
    e:
      en: "Object Lock prevents objects from being deleted or overwritten; it does not limit how many times a URL is used."
      fr: "Object Lock empêche la suppression ou l'écrasement des objets ; il ne limite pas le nombre d'utilisations d'une URL."
references:
  - title: Download and upload objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html
