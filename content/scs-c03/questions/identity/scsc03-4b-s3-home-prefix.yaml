id: scsc03-4b-s3-home-prefix
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Employees of AnyCompany federate through AWS IAM Identity Center into one permission set. Each session carries an employeeId session tag from attributes for access control. In the shared bucket corp-home, each employee must be able to list, read, and write only the objects under the prefix home/<employeeId>/. The policy must follow the principle of least privilege.

    Which two statements should the permission set policy contain? (Choose two.)
  fr: |
    Les employés d'AnyCompany se fédèrent par AWS IAM Identity Center dans un seul ensemble d'autorisations. Chaque session porte une balise de session employeeId issue des attributs pour le contrôle d'accès. Dans le compartiment partagé corp-home, chaque employé doit pouvoir lister, lire et écrire uniquement les objets situés sous le préfixe home/<employeeId>/. La politique doit respecter le principe du moindre privilège.

    Quelles sont les deux instructions que la politique de l'ensemble d'autorisations doit contenir ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Allow s3:ListBucket on arn:aws:s3:::corp-home/home/${aws:PrincipalTag/employeeId}/*.
        fr: |-
          Autoriser s3:ListBucket sur arn:aws:s3:::corp-home/home/${aws:PrincipalTag/employeeId}/*.
    - id: b
      text:
        en: |-
          Allow s3:ListBucket on arn:aws:s3:::corp-home when s3:prefix matches home/${aws:PrincipalTag/employeeId}/* with StringLike.
        fr: |-
          Autoriser s3:ListBucket sur arn:aws:s3:::corp-home lorsque s3:prefix correspond à home/${aws:PrincipalTag/employeeId}/* avec StringLike.
    - id: c
      text:
        en: |-
          Allow s3:GetObject and s3:PutObject on arn:aws:s3:::corp-home when s3:prefix matches home/${aws:PrincipalTag/employeeId}/* with StringLike.
        fr: |-
          Autoriser s3:GetObject et s3:PutObject sur arn:aws:s3:::corp-home lorsque s3:prefix correspond à home/${aws:PrincipalTag/employeeId}/* avec StringLike.
    - id: d
      text:
        en: |-
          Allow s3:GetObject and s3:PutObject on arn:aws:s3:::corp-home/home/${aws:PrincipalTag/employeeId}/*.
        fr: |-
          Autoriser s3:GetObject et s3:PutObject sur arn:aws:s3:::corp-home/home/${aws:PrincipalTag/employeeId}/*.
    - id: e
      text:
        en: |-
          Allow s3:* on arn:aws:s3:::corp-home/* when aws:PrincipalTag/employeeId is present.
        fr: |-
          Autoriser s3:* sur arn:aws:s3:::corp-home/* lorsque aws:PrincipalTag/employeeId est présent.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      s3:ListBucket is a bucket-level action, so its resource is the bucket ARN, and the s3:prefix condition limits listing to the employee's folder. Object actions use object ARNs, so a resource ARN with the ${aws:PrincipalTag/employeeId} variable limits reads and writes to the employee's prefix. The username variable would not work here because roles have no aws:username.
    fr: |-
      s3:ListBucket est une action au niveau du compartiment : sa ressource est l'ARN du compartiment, et la condition s3:prefix limite la liste au dossier de l'employé. Les actions sur les objets utilisent des ARN d'objet : un ARN de ressource avec la variable ${aws:PrincipalTag/employeeId} limite les lectures et écritures au préfixe de l'employé. La variable de nom d'utilisateur ne fonctionnerait pas ici, car les rôles n'ont pas d'aws:username.
  options:
    a:
      en: |-
        ListBucket applies to the bucket resource, not to object ARNs, so this statement never allows listing.
      fr: |-
        ListBucket s'applique à la ressource compartiment, pas aux ARN d'objet : cette instruction n'autorise jamais la liste.
    c:
      en: |-
        Object actions apply to object ARNs, and s3:prefix is a condition of listing requests, so this statement does not allow reads or writes.
      fr: |-
        Les actions sur les objets s'appliquent aux ARN d'objet, et s3:prefix est une condition des demandes de liste : cette instruction n'autorise ni lecture ni écriture.
    e:
      en: |-
        Every federated employee has the tag, so this grants all object actions on every employee's folder, which is not least privilege.
      fr: |-
        Chaque employé fédéré porte la balise : cette instruction accorde toutes les actions sur les objets de tous les dossiers d'employés, ce qui ne respecte pas le moindre privilège.
references:
  - title: "Amazon S3: Allows IAM users access to their S3 home directory, programmatically and in the console - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_examples_s3_home-directory-console.html
  - title: Attributes for access control - AWS IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/attributesforaccesscontrol.html
