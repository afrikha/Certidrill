id: scsc03-4b-avp-template-share
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is building a notebook application that uses Amazon Verified Permissions. A user can share one notebook with another user, and each share grants the Read and Comment actions on that notebook only. The company expects millions of shares. The product team plans to add an Export action to every existing share next year and does not want to update each share individually.

    Which solution will meet these requirements?
  fr: |
    Une entreprise développe une application de blocs-notes qui utilise Amazon Verified Permissions. Un utilisateur peut partager un bloc-notes avec un autre utilisateur, et chaque partage accorde les actions Read et Comment sur ce seul bloc-notes. L'entreprise prévoit des millions de partages. L'équipe produit prévoit d'ajouter une action Export à tous les partages existants l'année prochaine et ne veut pas mettre à jour chaque partage individuellement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a static permit policy for each share that names the user and the notebook, and update the actions in every static policy when the Export action is added.
        fr: |-
          Créer une politique permit statique pour chaque partage qui nomme l'utilisateur et le bloc-notes, et mettre à jour les actions de chaque politique statique lors de l'ajout de l'action Export.
    - id: b
      text:
        en: |-
          Create an Amazon Cognito user pool group for each notebook, add each user who receives a share to the group, and write one permit policy for each group.
        fr: |-
          Créer, dans un groupe d'utilisateurs Amazon Cognito, un groupe pour chaque bloc-notes, ajouter au groupe chaque utilisateur qui reçoit un partage, et écrire une politique permit pour chaque groupe.
    - id: c
      text:
        en: |-
          Create an IAM role for each notebook whose trust policy lists the users who received a share, and have the application check the role before each request.
        fr: |-
          Créer un rôle IAM pour chaque bloc-notes dont la politique d'approbation liste les utilisateurs qui ont reçu un partage, et faire vérifier ce rôle par l'application avant chaque demande.
    - id: d
      text:
        en: |-
          Create a policy template with ?principal and ?resource placeholders for the share actions, and create a template-linked policy for each share.
        fr: |-
          Créer un modèle de politique avec les espaces réservés ?principal et ?resource pour les actions de partage, et créer une politique liée au modèle pour chaque partage.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A policy template defines the actions once and leaves the principal and resource as placeholders; each share becomes a template-linked policy that fills them in. Template-linked policies are dynamic, so adding Export to the template applies it to every linked share at once.
    fr: |-
      Un modèle de politique définit les actions une seule fois et laisse le principal et la ressource en espaces réservés ; chaque partage devient une politique liée au modèle qui les renseigne. Les politiques liées au modèle sont dynamiques : ajouter Export au modèle l'applique d'un coup à tous les partages liés.
  options:
    a:
      en: |-
        Static policies do not inherit changes, so adding Export would require updating millions of policies one by one.
      fr: |-
        Les politiques statiques n'héritent d'aucune modification : ajouter Export exigerait de mettre à jour des millions de politiques une par une.
    b:
      en: |-
        A group and a policy for every notebook creates millions of groups and policies to manage, and changing the actions still means editing every policy.
      fr: |-
        Un groupe et une politique par bloc-notes créent des millions de groupes et de politiques à gérer, et changer les actions exige toujours de modifier chaque politique.
    c:
      en: |-
        IAM roles authorize AWS API calls, not application actions on notebooks, and a role per notebook would exceed IAM quotas and add heavy management.
      fr: |-
        Les rôles IAM autorisent des appels d'API AWS, pas des actions applicatives sur des blocs-notes, et un rôle par bloc-notes dépasserait les quotas IAM et alourdirait fortement la gestion.
references:
  - title: Amazon Verified Permissions policy templates and template-linked policies - Amazon Verified Permissions
    url: https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/policy-templates.html
