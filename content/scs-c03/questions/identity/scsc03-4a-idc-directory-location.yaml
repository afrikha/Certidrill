id: scsc03-4a-idc-directory-location
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany created an AD Connector in a shared-services member account to connect its on-premises Active Directory. The organization instance of IAM Identity Center is enabled in the management account, in the same Region, and no delegated administrator is registered. When an administrator tries to change the identity source to Active Directory, the AD Connector does not appear in the list of directories.

    Which solution will resolve the issue?
  fr: |
    AnyCompany a créé un AD Connector dans un compte membre de services partagés pour connecter son Active Directory sur site. L'instance d'organisation d'IAM Identity Center est activée dans le compte de gestion, dans la même Région, et aucun administrateur délégué n'est enregistré. Lorsqu'un administrateur tente de remplacer la source d'identité par Active Directory, l'AD Connector n'apparaît pas dans la liste des répertoires.

    Quelle solution résoudra le problème ?
body:
  options:
    - id: a
      text:
        en: "Share the AD Connector with the management account by using AWS Directory Service directory sharing, and select the shared directory."
        fr: "Partager l'AD Connector avec le compte de gestion à l'aide du partage de répertoire d'AWS Directory Service, et sélectionner le répertoire partagé."
    - id: b
      text:
        en: "Register the shared-services account as the delegated administrator for IAM Identity Center, or create the AD Connector in the management account."
        fr: "Enregistrer le compte de services partagés comme administrateur délégué d'IAM Identity Center, ou créer l'AD Connector dans le compte de gestion."
    - id: c
      text:
        en: "Create a VPC peering connection between a VPC of the management account and the VPC of the AD Connector, and update the route tables."
        fr: "Créer une connexion d'appairage de VPC (peering) entre un VPC du compte de gestion et le VPC de l'AD Connector, et mettre à jour les tables de routage."
    - id: d
      text:
        en: "Enable an account instance of IAM Identity Center in the shared-services account, and select the AD Connector as its identity source."
        fr: "Activer une instance de compte d'IAM Identity Center dans le compte de services partagés, et sélectionner l'AD Connector comme sa source d'identité."
answer: { optionId: b }
explanation:
  correct:
    en: "An Active Directory identity source must be a directory in the AWS Organizations management account or, when a delegated administrator is registered, in the delegated administrator account. Registering the shared-services account as delegated administrator, or creating the connector in the management account, makes the directory selectable."
    fr: "Une source d'identité Active Directory doit être un répertoire du compte de gestion AWS Organizations ou, lorsqu'un administrateur délégué est enregistré, du compte administrateur délégué. Enregistrer le compte de services partagés comme administrateur délégué, ou créer le connecteur dans le compte de gestion, rend le répertoire sélectionnable."
  options:
    a:
      en: "Directory sharing applies to AWS Managed Microsoft AD, not to AD Connector, and IAM Identity Center still requires a directory in the management or delegated administrator account."
      fr: "Le partage de répertoire s'applique à AWS Managed Microsoft AD, pas à AD Connector, et IAM Identity Center exige toujours un répertoire du compte de gestion ou du compte administrateur délégué."
    c:
      en: "Network connectivity does not change which account's directories IAM Identity Center can use."
      fr: "La connectivité réseau ne change pas les comptes dont IAM Identity Center peut utiliser les répertoires."
    d:
      en: "An account instance cannot give access to the AWS accounts of the organization."
      fr: "Une instance de compte ne peut pas donner accès aux comptes AWS de l'organisation."
references:
  - title: Microsoft AD directory
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-ad.html
