id: scsc03-4c-kms-no-iam-delegation
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CloudFormation stack created a customer managed AWS KMS key for AnyCompany's billing application. The key policy contains a single statement that allows the role KeyAdmins to perform kms:* and does not include the account root principal. The billing role, in the same account, has an identity-based policy that allows kms:Decrypt on the key ARN, but its Decrypt calls fail with AccessDenied. The security team does not want IAM policies to be able to grant other principals access to this key.

    Which solution will meet these requirements?
  fr: |
    Une pile AWS CloudFormation a créé une clé AWS KMS gérée par le client pour l'application de facturation d'AnyCompany. La politique de clé contient une seule instruction qui autorise kms:* pour le rôle KeyAdmins et n'inclut pas le principal racine du compte. Le rôle de facturation, dans le même compte, a une politique basée sur l'identité qui autorise kms:Decrypt sur l'ARN de la clé, mais ses appels Decrypt échouent avec AccessDenied. L'équipe de sécurité ne veut pas que des politiques IAM puissent accorder à d'autres principaux l'accès à cette clé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a key policy statement that allows the account root principal kms:*, so that the identity-based policy of the billing role takes effect.
        fr: |-
          Ajouter à la politique de clé une instruction qui autorise kms:* pour le principal racine du compte, afin que la politique basée sur l'identité du rôle de facturation prenne effet.
    - id: b
      text:
        en: |-
          Add a key policy statement that allows the billing role ARN to call kms:Decrypt on the key.
        fr: |-
          Ajouter à la politique de clé une instruction qui autorise l'ARN du rôle de facturation à appeler kms:Decrypt sur la clé.
    - id: c
      text:
        en: |-
          Add a kms:ViaService condition to the billing role's identity-based policy for the AWS service that calls AWS KMS on its behalf.
        fr: |-
          Ajouter à la politique basée sur l'identité du rôle de facturation une condition kms:ViaService pour le service AWS qui appelle AWS KMS en son nom.
    - id: d
      text:
        en: |-
          Attach the AWS managed policy AWSKeyManagementServicePowerUser to the billing role, so that it has full permissions on the key.
        fr: |-
          Attacher la politique gérée par AWS AWSKeyManagementServicePowerUser au rôle de facturation, afin qu'il dispose de toutes les autorisations sur la clé.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      IAM policies take effect for a KMS key only when the key policy allows the account to delegate through IAM, typically with a statement for the account root principal. This key policy has no such statement, so the billing role's IAM permission is ignored. Granting kms:Decrypt to the role directly in the key policy fixes the failure without letting IAM policies grant access to anyone else.
    fr: |-
      Les politiques IAM ne prennent effet pour une clé KMS que si la politique de clé permet au compte de déléguer par IAM, en général par une instruction pour le principal racine du compte. Cette politique de clé n'a pas une telle instruction : l'autorisation IAM du rôle de facturation est ignorée. Accorder kms:Decrypt au rôle directement dans la politique de clé corrige l'échec sans permettre aux politiques IAM d'accorder l'accès à quiconque.
  options:
    a:
      en: |-
        Delegating to the account root principal would let any IAM policy in the account grant access to the key, which the security team forbids.
      fr: |-
        Déléguer au principal racine du compte permettrait à n'importe quelle politique IAM du compte d'accorder l'accès à la clé, ce que l'équipe de sécurité interdit.
    c:
      en: |-
        A kms:ViaService condition only narrows the IAM permission; IAM permissions have no effect while the key policy does not delegate to IAM.
      fr: |-
        Une condition kms:ViaService ne fait que restreindre l'autorisation IAM ; les autorisations IAM restent sans effet tant que la politique de clé ne délègue pas à IAM.
    d:
      en: |-
        Any IAM policy, broad or narrow, is ignored for this key, and a broad managed policy would also violate least privilege.
      fr: |-
        Toute politique IAM, large ou étroite, est ignorée pour cette clé, et une politique gérée étendue irait en outre contre le moindre privilège.
references:
  - title: Troubleshooting AWS KMS permissions - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/policy-evaluation.html
