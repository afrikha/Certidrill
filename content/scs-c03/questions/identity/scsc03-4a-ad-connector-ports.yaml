id: scsc03-4a-ad-connector-ports
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is creating an AD Connector in two private subnets of a VPC (10.20.1.0/24 and 10.20.2.0/24) that is connected to the data center through AWS Site-to-Site VPN. The creation fails because AD Connector cannot reach the on-premises DNS servers and domain controllers. The VPN tunnels are up, and the routes are correct. The on-premises firewall allows only TCP 443 and TCP 636 from the VPC.

    Which change will resolve the issue?
  fr: |
    AnyCompany crée un AD Connector dans deux sous-réseaux privés d'un VPC (10.20.1.0/24 et 10.20.2.0/24) relié au centre de données par AWS Site-to-Site VPN. La création échoue car AD Connector ne peut pas atteindre les serveurs DNS et les contrôleurs de domaine sur site. Les tunnels VPN sont actifs et les itinéraires sont corrects. Le pare-feu sur site n'autorise que TCP 443 et TCP 636 depuis le VPC.

    Quelle modification résoudra le problème ?
body:
  options:
    - id: a
      text:
        en: "Allow TCP 3389 and TCP 5985 from both VPC subnets to the DNS servers and domain controllers."
        fr: "Autoriser TCP 3389 et TCP 5985 depuis les deux sous-réseaux du VPC vers les serveurs DNS et les contrôleurs de domaine."
    - id: b
      text:
        en: "Allow TCP and UDP 53, 88 and 389 from both VPC subnets to the DNS servers and domain controllers."
        fr: "Autoriser TCP et UDP 53, 88 et 389 depuis les deux sous-réseaux du VPC vers les serveurs DNS et les contrôleurs de domaine."
    - id: c
      text:
        en: "Allow UDP 1812 from the DNS servers and domain controllers to both VPC subnets."
        fr: "Autoriser UDP 1812 depuis les serveurs DNS et les contrôleurs de domaine vers les deux sous-réseaux du VPC."
    - id: d
      text:
        en: "Allow TCP 445 and TCP 3268 from one of the VPC subnets to the DNS servers and domain controllers."
        fr: "Autoriser TCP 445 et TCP 3268 depuis l'un des sous-réseaux du VPC vers les serveurs DNS et les contrôleurs de domaine."
answer: { optionId: b }
explanation:
  correct:
    en: "AD Connector requires at least TCP and UDP 53 (DNS), 88 (Kerberos) and 389 (LDAP) to be allowed from the CIDR ranges of both of its subnets to the existing network. TCP 443 and 636 alone allow neither DNS lookups, Kerberos authentication nor LDAP queries."
    fr: "AD Connector exige au minimum que TCP et UDP 53 (DNS), 88 (Kerberos) et 389 (LDAP) soient autorisés depuis les plages CIDR de ses deux sous-réseaux vers le réseau existant. TCP 443 et 636 seuls ne permettent ni les recherches DNS, ni l'authentification Kerberos, ni les requêtes LDAP."
  options:
    a:
      en: "RDP and WinRM ports are used to administer servers, not by AD Connector."
      fr: "Les ports RDP et WinRM servent à administrer des serveurs, pas à AD Connector."
    c:
      en: "UDP 1812 is used for RADIUS MFA, from the directory servers to the RADIUS server."
      fr: "UDP 1812 sert à la MFA RADIUS, depuis les serveurs de répertoire vers le serveur RADIUS."
    d:
      en: "These are not the ports AD Connector requires, and traffic must be allowed from both subnets."
      fr: "Ce ne sont pas les ports exigés par AD Connector, et le trafic doit être autorisé depuis les deux sous-réseaux."
references:
  - title: Getting started with AD Connector
    url: https://docs.aws.amazon.com/directoryservice/latest/admin-guide/prereq_connector.html
