id: scsc03-4c-mfa-allow-access-keys
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany grants its administrators access through an IAM group whose only policy allows all actions with the condition `"Bool": {"aws:MultiFactorAuthPresent": "true"}`. The administrators have MFA devices and use the AWS Management Console without problems. When they run AWS CLI commands with their IAM user access keys, every command fails with AccessDenied. The company requires that every administrative request be authenticated with MFA.

    Which solution will meet these requirements?
  fr: |
    AnyCompany donne accès à ses administrateurs par un groupe IAM dont la seule politique autorise toutes les actions avec la condition `"Bool": {"aws:MultiFactorAuthPresent": "true"}`. Les administrateurs ont des dispositifs MFA et utilisent la AWS Management Console sans problème. Quand ils exécutent des commandes AWS CLI avec les clés d'accès de leurs utilisateurs IAM, chaque commande échoue avec AccessDenied. L'entreprise exige que chaque requête d'administration soit authentifiée par MFA.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Have the administrators call aws sts get-session-token with their MFA device serial number and code, and run the CLI with the temporary credentials.
        fr: |-
          Demander aux administrateurs d'appeler aws sts get-session-token avec le numéro de série et le code de leur dispositif MFA, puis d'utiliser l'AWS CLI avec les informations d'identification temporaires.
    - id: b
      text:
        en: |-
          Replace the Bool operator with BoolIfExists, so that the condition matches requests that are signed with the access keys.
        fr: |-
          Remplacer l'opérateur Bool par BoolIfExists, afin que la condition corresponde aux requêtes signées avec les clés d'accès.
    - id: c
      text:
        en: |-
          Add an aws:MultiFactorAuthAge condition with NumericLessThan 3600, so that the CLI reuses the MFA of the last console sign-in.
        fr: |-
          Ajouter une condition aws:MultiFactorAuthAge avec NumericLessThan 3600, afin que l'AWS CLI réutilise la MFA de la dernière connexion à la console.
    - id: d
      text:
        en: |-
          Assign the administrators' MFA devices to their access keys in the IAM console, so that the CLI requests carry the MFA context.
        fr: |-
          Associer dans la console IAM les dispositifs MFA des administrateurs à leurs clés d'accès, afin que les requêtes de l'AWS CLI portent le contexte MFA.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The aws:MultiFactorAuthPresent key is in the request context only for temporary credentials, so requests signed with long-term access keys do not match the Bool condition and get an implicit deny. Temporary credentials from GetSessionToken called with an MFA code carry aws:MultiFactorAuthPresent = true and satisfy the policy.
    fr: |-
      La clé aws:MultiFactorAuthPresent n'est présente dans le contexte de la requête que pour des informations d'identification temporaires : les requêtes signées avec des clés d'accès à long terme ne satisfont pas la condition Bool et reçoivent un refus implicite. Les informations d'identification temporaires obtenues par GetSessionToken avec un code MFA portent aws:MultiFactorAuthPresent = true et satisfont la politique.
  options:
    b:
      en: |-
        With BoolIfExists, a missing key makes the condition true, so requests signed with access keys would be allowed without any MFA.
      fr: |-
        Avec BoolIfExists, une clé absente rend la condition vraie : les requêtes signées avec des clés d'accès seraient autorisées sans aucune MFA.
    c:
      en: |-
        aws:MultiFactorAuthAge is also absent from requests signed with long-term access keys, and the CLI does not reuse a console MFA sign-in.
      fr: |-
        aws:MultiFactorAuthAge est également absente des requêtes signées avec des clés d'accès à long terme, et l'AWS CLI ne réutilise pas une connexion MFA à la console.
    d:
      en: |-
        IAM has no setting that binds an MFA device to an access key; MFA context comes only from temporary credentials obtained with an MFA code.
      fr: |-
        IAM n'a aucun paramètre qui lie un dispositif MFA à une clé d'accès ; le contexte MFA ne vient que d'informations d'identification temporaires obtenues avec un code MFA.
references:
  - title: AWS global condition context keys - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
