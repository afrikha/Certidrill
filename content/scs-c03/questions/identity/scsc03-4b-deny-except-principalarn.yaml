id: scsc03-4b-deny-except-principalarn
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In account 111122223333, the bucket payroll-exports must be accessible only to the role PayrollApp. PayrollApp has a permissions boundary and an identity-based policy that both allow access to the bucket. Several administrators in the account have identity-based policies that allow s3:* on all resources. The security team wants a bucket policy statement that blocks every principal except PayrollApp, without blocking PayrollApp itself.

    Which bucket policy statement will meet these requirements?
  fr: |
    Dans le compte 111122223333, le compartiment payroll-exports ne doit être accessible qu'au rôle PayrollApp. PayrollApp possède une limite d'autorisations et une politique basée sur l'identité qui autorisent toutes deux l'accès au compartiment. Plusieurs administrateurs du compte ont des politiques basées sur l'identité qui autorisent s3:* sur toutes les ressources. L'équipe de sécurité veut une instruction de politique de compartiment qui bloque tous les principaux sauf PayrollApp, sans bloquer PayrollApp lui-même.

    Quelle instruction de politique de compartiment permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Deny s3:* on the bucket and its objects with a NotPrincipal element that contains the PayrollApp role ARN.
        fr: |-
          Refuser s3:* sur le compartiment et ses objets avec un élément NotPrincipal qui contient l'ARN du rôle PayrollApp.
    - id: b
      text:
        en: |-
          Allow s3:* on the bucket and its objects to the PayrollApp role ARN, with no Deny statement in the bucket policy.
        fr: |-
          Autoriser s3:* sur le compartiment et ses objets au rôle PayrollApp (par son ARN), sans instruction Deny dans la politique de compartiment.
    - id: c
      text:
        en: |-
          Deny s3:* on the bucket and its objects to Principal "*" with an ArnNotEquals condition on aws:PrincipalArn for the PayrollApp role ARN.
        fr: |-
          Refuser s3:* sur le compartiment et ses objets au Principal "*" avec une condition ArnNotEquals sur aws:PrincipalArn pour l'ARN du rôle PayrollApp.
    - id: d
      text:
        en: |-
          Deny s3:* on the bucket and its objects to Principal "*" with a StringNotEquals condition on aws:userid for the value PayrollApp.
        fr: |-
          Refuser s3:* sur le compartiment et ses objets au Principal "*" avec une condition StringNotEquals sur aws:userid pour la valeur PayrollApp.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Deny for all principals with an ArnNotEquals condition on aws:PrincipalArn blocks everyone whose role or user ARN is not PayrollApp, so the administrators' s3:* permissions no longer reach the bucket. For a role session, aws:PrincipalArn contains the role ARN, so PayrollApp itself is not denied.
    fr: |-
      Un Deny pour tous les principaux avec une condition ArnNotEquals sur aws:PrincipalArn bloque toute personne dont l'ARN de rôle ou d'utilisateur n'est pas PayrollApp : les autorisations s3:* des administrateurs n'atteignent plus le compartiment. Pour une session de rôle, aws:PrincipalArn contient l'ARN du rôle, donc PayrollApp lui-même n'est pas refusé.
  options:
    a:
      en: |-
        AWS warns that NotPrincipal with Deny always denies users or roles that have a permissions boundary, so PayrollApp would be blocked too.
      fr: |-
        AWS avertit que NotPrincipal avec Deny refuse toujours les utilisateurs ou les rôles dotés d'une limite d'autorisations : PayrollApp serait bloqué lui aussi.
    b:
      en: |-
        Within one account, access is the union of identity-based and resource-based policies, so the administrators' s3:* policies still allow access without a Deny.
      fr: |-
        Dans un même compte, l'accès est l'union des politiques basées sur l'identité et sur les ressources : sans Deny, les politiques s3:* des administrateurs autorisent toujours l'accès.
    d:
      en: |-
        For a role session, aws:userid is the role's unique ID followed by the session name, not the role name, so the condition would also deny PayrollApp.
      fr: |-
        Pour une session de rôle, aws:userid est l'ID unique du rôle suivi du nom de session, et non le nom du rôle : la condition refuserait aussi PayrollApp.
references:
  - title: Permissions boundaries for IAM entities - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  - title: "AWS JSON policy elements: Principal - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html
