id: scsc03-4a-cf-signed-cookies-hls
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany streams training videos in HLS format from a private Amazon S3 bucket through an Amazon CloudFront distribution with origin access control. Each video consists of a playlist and hundreds of segment files. Only paying subscribers may play the videos, for 24 hours after they sign in, and the company does not want to change the URLs that the video player requests.

    Which solution will meet these requirements?
  fr: |
    AnyCompany diffuse des vidéos de formation au format HLS depuis un compartiment Amazon S3 privé par une distribution Amazon CloudFront avec contrôle d'accès à l'origine (OAC). Chaque vidéo se compose d'une liste de lecture et de centaines de fichiers de segments. Seuls les abonnés payants peuvent lire les vidéos, pendant 24 heures après leur connexion, et l'entreprise ne veut pas modifier les URL demandées par le lecteur vidéo.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Have the application generate an Amazon S3 presigned URL for every segment file of the video each time a subscriber starts playing it."
        fr: "Faire générer par l'application une URL présignée Amazon S3 pour chaque fichier de segment de la vidéo chaque fois qu'un abonné en lance la lecture."
    - id: b
      text:
        en: "Add a trusted key group to the cache behavior, and have the application set CloudFront signed cookies that expire after 24 hours when a subscriber signs in."
        fr: "Ajouter un groupe de clés approuvé au comportement de cache, et faire définir par l'application, à la connexion d'un abonné, des cookies signés CloudFront qui expirent après 24 heures."
    - id: c
      text:
        en: "Add a trusted key group to the cache behavior, and have the application generate a CloudFront signed URL for the playlist file only."
        fr: "Ajouter un groupe de clés approuvé au comportement de cache, et faire générer par l'application une URL signée CloudFront pour le seul fichier de liste de lecture."
    - id: d
      text:
        en: "Associate an AWS WAF web ACL with the distribution that allows requests only when the Referer header contains the company's domain."
        fr: "Associer à la distribution une liste ACL web AWS WAF qui n'autorise les requêtes que lorsque l'en-tête Referer contient le domaine de l'entreprise."
answer: { optionId: b }
explanation:
  correct:
    en: "Signed cookies give access to multiple restricted files, such as all the files of an HLS video, without changing the URLs. CloudFront verifies them with the public keys of the trusted key group of the cache behavior and enforces their expiration."
    fr: "Les cookies signés donnent accès à plusieurs fichiers protégés, comme tous les fichiers d'une vidéo HLS, sans modifier les URL. CloudFront les vérifie avec les clés publiques du groupe de clés approuvé du comportement de cache et applique leur expiration."
  options:
    a:
      en: "Presigned URLs change every segment URL and send the requests directly to Amazon S3 instead of through CloudFront."
      fr: "Les URL présignées changent l'URL de chaque segment et envoient les requêtes directement à Amazon S3 au lieu de passer par CloudFront."
    c:
      en: "A signed URL protects only the file it signs; the segment files would then be rejected by the cache behavior or left unprotected."
      fr: "Une URL signée ne protège que le fichier qu'elle signe ; les fichiers de segments seraient alors refusés par le comportement de cache ou laissés sans protection."
    d:
      en: "The Referer header is set by the client and can be forged, so it does not restrict access to subscribers."
      fr: "L'en-tête Referer est défini par le client et peut être falsifié : il ne restreint pas l'accès aux abonnés."
references:
  - title: Decide to use signed URLs or signed cookies
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-choosing-signed-urls-cookies.html
  - title: Specify signers that can create signed URLs and signed cookies
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-trusted-signers.html
