id: scsc03-4a-ec2-instance-profile
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application on Amazon EC2 instances reads objects from an Amazon S3 bucket. The application uses the access key ID and secret access key of an IAM user, which are stored in a configuration file on each instance. A security review requires the company to remove long-term credentials from the instances and to use credentials that AWS rotates automatically.

    Which solution will meet these requirements?
  fr: |
    Une application sur des instances Amazon EC2 lit des objets dans un compartiment (bucket) Amazon S3. L'application utilise l'ID de clé d'accès et la clé d'accès secrète d'un utilisateur IAM, stockés dans un fichier de configuration sur chaque instance. Un audit de sécurité exige que l'entreprise supprime les informations d'identification à long terme des instances et utilise des informations d'identification qu'AWS fait tourner automatiquement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Store the access keys in AWS Secrets Manager with automatic rotation, and have the application retrieve the current keys when it starts."
        fr: "Stocker les clés d'accès dans AWS Secrets Manager avec rotation automatique, et faire récupérer les clés en vigueur par l'application à son démarrage."
    - id: b
      text:
        en: "Create an IAM role with read access to the bucket, attach it to the instances through an instance profile, and remove the keys from the file."
        fr: "Créer un rôle IAM avec un accès en lecture au compartiment S3, l'attacher aux instances par un profil d'instance, et supprimer les clés du fichier."
    - id: c
      text:
        en: "Store the access keys as a SecureString parameter in AWS Systems Manager Parameter Store, encrypted with an AWS KMS key."
        fr: "Stocker les clés d'accès sous forme de paramètre SecureString dans AWS Systems Manager Parameter Store, chiffré avec une clé AWS KMS."
    - id: d
      text:
        en: "Enable MFA for the IAM user, and have the application call GetSessionToken with the user's access keys when it starts."
        fr: "Activer la MFA pour l'utilisateur IAM, et faire appeler GetSessionToken par l'application avec les clés d'accès de l'utilisateur à son démarrage."
answer: { optionId: b }
explanation:
  correct:
    en: "An instance profile is the container that attaches an IAM role to an instance. The application then uses temporary role credentials that the AWS SDK retrieves from the instance metadata and refreshes automatically, so no long-term key remains on the instances."
    fr: "Un profil d'instance est le conteneur qui attache un rôle IAM à une instance. L'application utilise alors des informations d'identification temporaires du rôle, que le SDK AWS récupère dans les métadonnées de l'instance et renouvelle automatiquement : aucune clé à long terme ne reste sur les instances."
  options:
    a:
      en: "The application would still use long-term IAM user keys; Secrets Manager only changes where they are stored."
      fr: "L'application utiliserait toujours des clés d'utilisateur IAM à long terme ; Secrets Manager ne change que leur lieu de stockage."
    c:
      en: "Encrypting the keys in Parameter Store still leaves long-term IAM user credentials in use."
      fr: "Chiffrer les clés dans Parameter Store laisse toujours en usage des informations d'identification d'utilisateur IAM à long terme."
    d:
      en: "GetSessionToken still needs the IAM user's long-term keys on the instances, and an unattended application cannot provide an MFA code."
      fr: "GetSessionToken exige toujours les clés à long terme de l'utilisateur IAM sur les instances, et une application sans surveillance ne peut pas fournir de code MFA."
references:
  - title: IAM roles for Amazon EC2
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html
