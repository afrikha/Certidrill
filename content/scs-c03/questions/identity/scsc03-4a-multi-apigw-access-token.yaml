id: scsc03-4a-multi-apigw-access-token
objective: "4.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany protects a REST API in Amazon API Gateway with a COGNITO_USER_POOLS authorizer whose token source is the Authorization header. The POST /orders method is configured with the authorization scope orders/write, which is defined on a resource server of the user pool. The web application signs users in with managed login, requests only the openid and email scopes, and sends the ID token in the Authorization header. Every call to POST /orders returns 401 Unauthorized.

    Which combination of changes will resolve the issue? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany protège une API REST d'Amazon API Gateway avec un mécanisme d'autorisation COGNITO_USER_POOLS dont la source de jeton est l'en-tête Authorization. La méthode POST /orders est configurée avec la portée d'autorisation orders/write, définie sur un serveur de ressources du groupe d'utilisateurs. L'application web connecte les utilisateurs avec la connexion gérée, ne demande que les portées openid et email, et envoie le jeton d'identification dans l'en-tête Authorization. Chaque appel à POST /orders renvoie 401 Unauthorized.

    Quelle combinaison de modifications résoudra le problème ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Send the access token instead of the ID token in the Authorization header."
        fr: "Envoyer le jeton d'accès au lieu du jeton d'identification dans l'en-tête Authorization."
    - id: b
      text:
        en: "Change the authorizer's token source to a query string parameter named access_token, and send the ID token there."
        fr: "Remplacer la source de jeton du mécanisme d'autorisation par un paramètre de chaîne de requête nommé access_token, et y envoyer le jeton d'identification."
    - id: c
      text:
        en: "Allow the orders/write custom scope on the app client, and include it in the scopes that the application requests."
        fr: "Autoriser la portée personnalisée orders/write sur le client d'application, et l'inclure dans les portées demandées par l'application."
    - id: d
      text:
        en: "Obtain credentials from an Amazon Cognito identity pool, and sign the API requests with Signature Version 4."
        fr: "Obtenir des informations d'identification d'un groupe d'identités Amazon Cognito, et signer les requêtes à l'API avec Signature Version 4."
    - id: e
      text:
        en: "Change the method's authorization type to AWS_IAM, and keep sending the ID token in the Authorization header."
        fr: "Remplacer le type d'autorisation de la méthode par AWS_IAM, et continuer à envoyer le jeton d'identification dans l'en-tête Authorization."
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "When authorization scopes are configured on a method, API Gateway treats the token as an access token and checks its scopes against the method's scopes; it treats a token as an identity token only when no scopes are configured. The access token contains orders/write only if the app client allows that custom scope and the application requests it."
    fr: "Lorsque des portées d'autorisation sont configurées sur une méthode, API Gateway traite le jeton comme un jeton d'accès et compare ses portées à celles de la méthode ; il ne traite un jeton comme jeton d'identification que si aucune portée n'est configurée. Le jeton d'accès ne contient orders/write que si le client d'application autorise cette portée personnalisée et que l'application la demande."
  options:
    b:
      en: "Moving the token to another location does not change its type or its scopes."
      fr: "Déplacer le jeton ailleurs ne change ni son type ni ses portées."
    d:
      en: "Requests signed with Signature Version 4 are evaluated by IAM authorization, not by the Cognito authorizer configured on the method."
      fr: "Les requêtes signées avec Signature Version 4 sont évaluées par l'autorisation IAM, pas par le mécanisme d'autorisation Cognito configuré sur la méthode."
    e:
      en: "AWS_IAM authorization requires requests signed with AWS credentials; it does not accept Cognito tokens."
      fr: "L'autorisation AWS_IAM exige des requêtes signées avec des informations d'identification AWS ; elle n'accepte pas les jetons Cognito."
references:
  - title: Integrate a REST API with an Amazon Cognito user pool
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-enable-cognito-user-pool.html
  - title: Application-specific settings with app clients
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-client-apps.html
