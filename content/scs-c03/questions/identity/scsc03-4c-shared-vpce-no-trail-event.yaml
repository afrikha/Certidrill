id: scsc03-4c-shared-vpce-no-trail-event
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    At AnyCompany, a networking account owns a VPC whose private subnets are shared with a workload account through AWS Resource Access Manager (AWS RAM). The networking account created an interface VPC endpoint for AWS Secrets Manager in that VPC, with private DNS enabled. An application in the workload account runs in the shared subnets and receives AccessDenied when it reads a secret of the workload account. Its role's identity-based policy and the secret's resource-based policy both allow secretsmanager:GetSecretValue. A security engineer searches the AWS CloudTrail events of the workload account and finds no AccessDenied event for these calls.

    What should the engineer investigate next?
  fr: |
    Chez AnyCompany, un compte réseau possède un VPC dont les sous-réseaux privés sont partagés avec un compte de charge de travail au moyen d'AWS Resource Access Manager (AWS RAM). Le compte réseau a créé dans ce VPC un point de terminaison d'interface pour AWS Secrets Manager, avec le DNS privé activé. Une application du compte de charge de travail s'exécute dans les sous-réseaux partagés et reçoit AccessDenied lorsqu'elle lit un secret du compte de charge de travail. La politique basée sur l'identité de son rôle et la politique basée sur les ressources du secret autorisent toutes deux secretsmanager:GetSecretValue. Un ingénieur sécurité recherche les événements AWS CloudTrail du compte de charge de travail et ne trouve aucun événement AccessDenied pour ces appels.

    Qu'est-ce que l'ingénieur doit examiner ensuite ?
body:
  options:
    - id: a
      text:
        en: |-
          The security group of the interface endpoint, because blocked HTTPS traffic to the endpoint is returned to the caller as AccessDenied.
        fr: |-
          Le groupe de sécurité du point de terminaison d'interface, car le trafic HTTPS bloqué vers le point de terminaison est renvoyé à l'appelant sous la forme d'AccessDenied.
    - id: b
      text:
        en: |-
          The endpoint policy of the interface endpoint and the CloudTrail events of the networking account, which owns the endpoint.
        fr: |-
          La politique du point de terminaison d'interface et les événements CloudTrail du compte réseau, propriétaire du point de terminaison.
    - id: c
      text:
        en: |-
          The route tables of the shared subnets, because Secrets Manager traffic needs a route to a gateway endpoint in the networking account.
        fr: |-
          Les tables de routage des sous-réseaux partagés, car le trafic Secrets Manager a besoin d'un itinéraire vers un point de terminaison de passerelle du compte réseau.
    - id: d
      text:
        en: |-
          The permissions boundary of the application role, because boundary denies are logged only in the account that manages the organization.
        fr: |-
          La limite d'autorisations du rôle de l'application, car les refus de limite ne sont journalisés que dans le compte qui gère l'organisation.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A VPC endpoint policy can deny a request even when the identity-based and resource-based policies allow it. When an access denied error made through a VPC endpoint is not logged in CloudTrail of the calling account, the endpoint can belong to another account, here the networking account, so the engineer must review that endpoint's policy and that account's events.
    fr: |-
      Une politique de point de terminaison d'un VPC peut refuser une requête même quand les politiques basées sur l'identité et sur les ressources l'autorisent. Quand une erreur d'accès refusé passée par un point de terminaison d'un VPC n'est pas journalisée dans CloudTrail du compte appelant, le point de terminaison peut appartenir à un autre compte, ici le compte réseau : l'ingénieur doit examiner la politique de ce point de terminaison et les événements de ce compte.
  options:
    a:
      en: |-
        A security group that blocks traffic makes the connection time out; it does not produce an authorization error.
      fr: |-
        Un groupe de sécurité qui bloque le trafic fait expirer la connexion ; il ne produit pas d'erreur d'autorisation.
    c:
      en: |-
        Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB; Secrets Manager uses interface endpoints, which do not need routes in the route tables.
      fr: |-
        Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB ; Secrets Manager utilise des points de terminaison d'interface, qui n'ont pas besoin d'itinéraires dans les tables de routage.
    d:
      en: |-
        A permissions boundary belongs to the role in the workload account; nothing sends its denies only to the management account, and the denied call would appear in the workload account.
      fr: |-
        Une limite d'autorisations appartient au rôle du compte de charge de travail ; rien n'envoie ses refus uniquement au compte de gestion, et l'appel refusé apparaîtrait dans le compte de charge de travail.
references:
  - title: Troubleshoot access denied error messages - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied.html
