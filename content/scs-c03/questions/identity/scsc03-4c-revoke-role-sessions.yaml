id: scsc03-4c-revoke-role-sessions
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon GuardDuty finding shows that temporary credentials of the IAM role BuildRole, which AnyCompany's CI pipeline assumes for each job, are being used from an unknown IP address. The security team must immediately make every credential already issued for BuildRole unusable. New pipeline jobs must keep working by assuming the role again, and the role's ARN must not change.

    Which solution will meet these requirements?
  fr: |
    Un résultat Amazon GuardDuty montre que des informations d'identification temporaires du rôle IAM BuildRole, que le pipeline CI d'AnyCompany assume pour chaque tâche, sont utilisées depuis une adresse IP inconnue. L'équipe de sécurité doit rendre immédiatement inutilisables toutes les informations d'identification déjà émises pour BuildRole. Les nouvelles tâches du pipeline doivent continuer de fonctionner en assumant à nouveau le rôle, et l'ARN du rôle ne doit pas changer.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Remove the CI principal from the trust policy of BuildRole, and add it back after the current sessions have expired.
        fr: |-
          Retirer le principal CI de la politique d'approbation de BuildRole, puis le rajouter après l'expiration des sessions en cours.
    - id: b
      text:
        en: |-
          Delete BuildRole and create a new role with the same name, trust policy and permissions policies.
        fr: |-
          Supprimer BuildRole et créer un nouveau rôle avec le même nom, la même politique d'approbation et les mêmes politiques d'autorisations.
    - id: c
      text:
        en: |-
          Use Revoke active sessions on BuildRole, which adds a policy that denies all actions to credentials issued before the current time.
        fr: |-
          Utiliser Revoke active sessions sur BuildRole, qui ajoute une politique refusant toutes les actions aux informations d'identification émises avant l'heure actuelle.
    - id: d
      text:
        en: |-
          Deactivate the access keys of BuildRole in the IAM console, and create new access keys for the CI pipeline to use.
        fr: |-
          Désactiver les clés d'accès de BuildRole dans la console IAM, puis créer de nouvelles clés d'accès pour le pipeline CI.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Revoking active sessions attaches the inline policy AWSRevokeOlderSessions, which denies all actions when aws:TokenIssueTime is earlier than the revocation time. Credentials issued before that time, including the stolen ones, stop working at once, while sessions created by new AssumeRole calls are not affected.
    fr: |-
      La révocation des sessions actives attache la politique en ligne AWSRevokeOlderSessions, qui refuse toutes les actions quand aws:TokenIssueTime est antérieure à l'heure de révocation. Les informations d'identification émises avant cette heure, y compris celles volées, cessent aussitôt de fonctionner, tandis que les sessions créées par de nouveaux appels AssumeRole ne sont pas affectées.
  options:
    a:
      en: |-
        The trust policy is evaluated only when the role is assumed; credentials that were already issued stay valid until they expire.
      fr: |-
        La politique d'approbation n'est évaluée qu'au moment où le rôle est assumé ; les informations d'identification déjà émises restent valides jusqu'à leur expiration.
    b:
      en: |-
        A recreated role gets a new principal ID that breaks every trust and resource-based policy that referenced the old role, which disrupts the pipeline.
      fr: |-
        Un rôle recréé reçoit un nouvel ID de principal qui casse toutes les politiques d'approbation et basées sur les ressources qui faisaient référence à l'ancien rôle, ce qui perturbe le pipeline.
    d:
      en: |-
        IAM roles have no long-term access keys; their sessions use temporary credentials issued by AWS STS.
      fr: |-
        Les rôles IAM n'ont pas de clés d'accès à long terme ; leurs sessions utilisent des informations d'identification temporaires émises par AWS STS.
references:
  - title: Revoke IAM role temporary security credentials - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_revoke-sessions.html
