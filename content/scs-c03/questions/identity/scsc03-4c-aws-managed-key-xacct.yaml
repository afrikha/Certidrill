id: scsc03-4c-aws-managed-key-xacct
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany stores reports in an Amazon S3 bucket in account A. Default encryption of the bucket is SSE-KMS with the AWS managed key aws/s3, and all existing objects are encrypted with that key. An analytics role in account B must download the reports. The bucket policy allows the role s3:GetObject, and the role's identity-based policy allows s3:GetObject on the bucket and kms:Decrypt on all resources. Every download fails with AccessDenied. The objects must remain encrypted with SSE-KMS.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke des rapports dans un compartiment Amazon S3 du compte A. Le chiffrement par défaut du compartiment est SSE-KMS avec la clé gérée par AWS aws/s3, et tous les objets existants sont chiffrés avec cette clé. Un rôle d'analyse du compte B doit télécharger les rapports. La politique du compartiment autorise s3:GetObject pour le rôle, et la politique basée sur l'identité du rôle autorise s3:GetObject sur le compartiment et kms:Decrypt sur toutes les ressources. Chaque téléchargement échoue avec AccessDenied. Les objets doivent rester chiffrés avec SSE-KMS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Edit the key policy of the aws/s3 key in account A to allow the analytics role in account B to call kms:Decrypt on the reports.
        fr: |-
          Modifier la politique de clé de la clé aws/s3 du compte A pour autoriser le rôle d'analyse du compte B à appeler kms:Decrypt sur les rapports.
    - id: b
      text:
        en: |-
          Add a statement to the bucket policy that allows the analytics role kms:Decrypt with a kms:ViaService condition for Amazon S3.
        fr: |-
          Ajouter à la politique du compartiment une instruction qui autorise kms:Decrypt pour le rôle d'analyse avec une condition kms:ViaService pour Amazon S3.
    - id: c
      text:
        en: |-
          Change the default encryption of the bucket to a customer managed key that allows the analytics role, and keep the existing objects as they are.
        fr: |-
          Remplacer le chiffrement par défaut du compartiment par une clé gérée par le client qui autorise le rôle d'analyse, et laisser les objets existants tels quels.
    - id: d
      text:
        en: |-
          Create a customer managed key that allows the analytics role kms:Decrypt, make it the default encryption key, and copy the existing objects in place with it.
        fr: |-
          Créer une clé gérée par le client qui autorise kms:Decrypt pour le rôle d'analyse, en faire la clé de chiffrement par défaut et copier les objets existants sur eux-mêmes avec cette clé.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With the AWS managed key aws/s3, the requester must be in the account that owns the key, and the policy of an AWS managed key cannot be changed, so cross-account downloads always fail. A customer managed key lets account A grant kms:Decrypt to the role in account B, which already has kms:Decrypt in its identity-based policy; copying the objects in place re-encrypts the existing reports with the new key.
    fr: |-
      Avec la clé gérée par AWS aws/s3, le demandeur doit appartenir au compte propriétaire de la clé, et la politique d'une clé gérée par AWS ne peut pas être modifiée : les téléchargements entre comptes échouent donc toujours. Une clé gérée par le client permet au compte A d'accorder kms:Decrypt au rôle du compte B, qui possède déjà kms:Decrypt dans sa politique basée sur l'identité ; la copie des objets sur eux-mêmes rechiffre les rapports existants avec la nouvelle clé.
  options:
    a:
      en: |-
        The key policy of an AWS managed key is managed by AWS and cannot be edited, and such a key can be used only by principals of its own account.
      fr: |-
        La politique d'une clé gérée par AWS est gérée par AWS et ne peut pas être modifiée, et une telle clé n'est utilisable que par les principaux de son propre compte.
    b:
      en: |-
        A bucket policy controls access to the bucket and its objects; it cannot grant permissions on an AWS KMS key.
      fr: |-
        Une politique de compartiment contrôle l'accès au compartiment et à ses objets ; elle ne peut pas accorder d'autorisations sur une clé AWS KMS.
    c:
      en: |-
        Default encryption applies only to new objects, so the existing reports stay encrypted with aws/s3 and remain unreadable from account B.
      fr: |-
        Le chiffrement par défaut ne s'applique qu'aux nouveaux objets : les rapports existants restent chiffrés avec aws/s3 et toujours illisibles depuis le compte B.
references:
  - title: Troubleshoot access denied (403 Forbidden) errors in Amazon S3 - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/troubleshoot-403-errors.html
