id: scsc03-4c-object-writer-ownership
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany receives files from a partner in an Amazon S3 bucket in account A. The bucket's Object Ownership setting is Object writer, and the partner's role in account B uploads objects without specifying an ACL. An analytics role in account A has an identity-based policy that allows s3:GetObject on the bucket, and the bucket policy also allows it. The role reads the objects that account A uploads, but it receives AccessDenied for every object uploaded by the partner. The company must be able to read the existing and future partner objects with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany reçoit les fichiers d'un partenaire dans un compartiment Amazon S3 du compte A. Le paramètre Object Ownership du compartiment est Object writer, et le rôle du partenaire dans le compte B charge les objets sans spécifier d'ACL. Un rôle d'analyse du compte A a une politique basée sur l'identité qui autorise s3:GetObject sur le compartiment, et la politique du compartiment l'autorise aussi. Le rôle lit les objets chargés par le compte A, mais il reçoit AccessDenied pour chaque objet chargé par le partenaire. L'entreprise doit pouvoir lire les objets existants et futurs du partenaire avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Change the Object Ownership setting of the bucket to Bucket owner enforced, which disables ACLs.
        fr: |-
          Passer le paramètre Object Ownership du compartiment à Bucket owner enforced, ce qui désactive les ACL.
    - id: b
      text:
        en: |-
          Ask the partner to add the bucket-owner-full-control canned ACL to every upload from now on.
        fr: |-
          Demander au partenaire d'ajouter l'ACL prédéfinie bucket-owner-full-control à chaque chargement à partir de maintenant.
    - id: c
      text:
        en: |-
          Add a second bucket policy statement that allows the analytics role s3:* on all the objects of the bucket.
        fr: |-
          Ajouter à la politique du compartiment une seconde instruction qui autorise s3:* pour le rôle d'analyse sur tous les objets du compartiment.
    - id: d
      text:
        en: |-
          Turn on all four S3 Block Public Access settings on the bucket, so that the partner's object ACLs are ignored.
        fr: |-
          Activer les quatre paramètres S3 Block Public Access sur le compartiment, afin que les ACL d'objet du partenaire soient ignorées.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With Object writer, the uploading account owns each object, and the Allow statements of a bucket policy apply only to objects that the bucket owner owns, so access to partner objects is governed by their ACLs. Bucket owner enforced disables ACLs and makes the bucket owner own every object in the bucket, existing and future, so the bucket policy and IAM policies of account A apply.
    fr: |-
      Avec Object writer, le compte qui charge possède chaque objet, et les instructions Allow d'une politique de compartiment ne s'appliquent qu'aux objets dont le propriétaire du compartiment est propriétaire : l'accès aux objets du partenaire est donc régi par leurs ACL. Bucket owner enforced désactive les ACL et fait du propriétaire du compartiment le propriétaire de chaque objet, existant ou futur : la politique du compartiment et les politiques IAM du compte A s'appliquent.
  options:
    b:
      en: |-
        The canned ACL helps only for new uploads; the objects already uploaded stay owned by the partner and remain unreadable.
      fr: |-
        L'ACL prédéfinie n'aide que pour les nouveaux chargements ; les objets déjà chargés restent la propriété du partenaire et toujours illisibles.
    c:
      en: |-
        Allow statements in a bucket policy never apply to objects owned by another account, whatever the Resource element says.
      fr: |-
        Les instructions Allow d'une politique de compartiment ne s'appliquent jamais aux objets appartenant à un autre compte, quel que soit l'élément Resource.
    d:
      en: |-
        Block Public Access only acts on public ACLs and policies; the partner's private object ACLs still control access to its objects.
      fr: |-
        Block Public Access n'agit que sur les ACL et politiques publiques ; les ACL d'objet privées du partenaire contrôlent toujours l'accès à ses objets.
references:
  - title: Troubleshoot access denied (403 Forbidden) errors in Amazon S3 - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/troubleshoot-403-errors.html
