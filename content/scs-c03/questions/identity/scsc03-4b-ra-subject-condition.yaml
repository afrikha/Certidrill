id: scsc03-4b-ra-subject-condition
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses IAM Roles Anywhere in account 111122223333. One trust anchor references the company's AWS Private CA, which issues certificates to the on-premises servers of every business unit. The subject of each certificate contains one OU value that equals the server's business unit. The role PaymentsBatch must be usable only with certificates whose subject OU is Payments. Other roles in the account will continue to use the same trust anchor for other business units.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise IAM Roles Anywhere dans le compte 111122223333. Une ancre de confiance (trust anchor) référence l'AWS Private CA de l'entreprise, qui émet des certificats pour les serveurs sur site de toutes les unités commerciales. Le sujet de chaque certificat contient une seule valeur OU égale à l'unité commerciale du serveur. Le rôle PaymentsBatch doit pouvoir être utilisé uniquement avec des certificats dont l'OU du sujet est Payments. Les autres rôles du compte continueront d'utiliser la même ancre de confiance pour les autres unités commerciales.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          In the trust policy of PaymentsBatch, add an ArnEquals condition on aws:SourceArn for the trust anchor ARN and a StringEquals condition on aws:PrincipalTag/x509Subject/OU for Payments.
        fr: |-
          Dans la politique d'approbation de PaymentsBatch, ajouter une condition ArnEquals sur aws:SourceArn pour l'ARN de l'ancre de confiance et une condition StringEquals sur aws:PrincipalTag/x509Subject/OU pour Payments.
    - id: b
      text:
        en: |-
          Create a profile for PaymentsBatch with a session policy that allows actions only when aws:PrincipalTag/x509Subject/OU is Payments, and keep the trust policy unchanged.
        fr: |-
          Créer un profil pour PaymentsBatch avec une politique de session qui autorise des actions uniquement lorsque aws:PrincipalTag/x509Subject/OU vaut Payments, et laisser la politique d'approbation inchangée.
    - id: c
      text:
        en: |-
          Create a second trust anchor that references the same AWS Private CA, and configure the Payments servers to use only the second trust anchor for PaymentsBatch.
        fr: |-
          Créer une seconde ancre de confiance qui référence la même AWS Private CA, et configurer les serveurs Payments pour qu'ils utilisent uniquement cette seconde ancre pour PaymentsBatch.
    - id: d
      text:
        en: |-
          Import into IAM Roles Anywhere a certificate revocation list (CRL) from the CA that lists the certificates of all servers outside the Payments business unit.
        fr: |-
          Importer dans IAM Roles Anywhere une liste de révocation de certificats (CRL) de la CA qui liste les certificats de tous les serveurs extérieurs à l'unité commerciale Payments.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      IAM Roles Anywhere maps the relative distinguished names of the certificate subject to principal tags such as aws:PrincipalTag/x509Subject/OU, which the role trust policy can test. Without trust policy conditions, any valid certificate from the trust anchor's CA can assume any role in the account, so the OU condition, together with aws:SourceArn for the trust anchor, restricts PaymentsBatch to Payments certificates.
    fr: |-
      IAM Roles Anywhere associe les noms distinctifs relatifs du sujet du certificat à des balises de principal comme aws:PrincipalTag/x509Subject/OU, que la politique d'approbation du rôle peut tester. Sans conditions dans la politique d'approbation, tout certificat valide de la CA de l'ancre peut endosser n'importe quel rôle du compte : la condition sur l'OU, associée à aws:SourceArn pour l'ancre de confiance, réserve PaymentsBatch aux certificats Payments.
  options:
    b:
      en: |-
        A session policy only limits the permissions of the sessions created through that profile; any other profile that lists the role still lets other certificates assume PaymentsBatch.
      fr: |-
        Une politique de session limite seulement les autorisations des sessions créées par ce profil ; tout autre profil qui liste le rôle permet encore à d'autres certificats d'endosser PaymentsBatch.
    c:
      en: |-
        Trust is established at the account level: certificates accepted by any trust anchor in the account can assume any role whose trust policy has no conditions, so a second anchor isolates nothing.
      fr: |-
        La confiance est établie au niveau du compte : les certificats acceptés par n'importe quelle ancre du compte peuvent endosser tout rôle dont la politique d'approbation n'a pas de conditions, donc une seconde ancre n'isole rien.
    d:
      en: |-
        Revoking the other certificates would stop those servers from using every role in the account, which breaks the other business units.
      fr: |-
        Révoquer les autres certificats empêcherait ces serveurs d'utiliser tous les rôles du compte, ce qui bloque les autres unités commerciales.
references:
  - title: The IAM Roles Anywhere trust model - IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html
  - title: What is AWS Identity and Access Management Roles Anywhere? - IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
