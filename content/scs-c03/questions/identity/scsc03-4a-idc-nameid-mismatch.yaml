id: scsc03-4a-idc-nameid-mismatch
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany connected IAM Identity Center to its external IdP and enabled SCIM provisioning. The SCIM mapping sets each user's Identity Center username to the employee number, and the provisioned users have been assigned to accounts. When users choose the AWS application in the IdP portal, IAM Identity Center displays the message An unexpected error has occurred. The IdP sends each user's email address as the SAML NameID.

    What should the company do to resolve the issue?
  fr: |
    AnyCompany a connecté IAM Identity Center à son IdP externe et activé le provisionnement SCIM. Le mappage SCIM définit le nom d'utilisateur Identity Center de chaque utilisateur sur son matricule, et les utilisateurs provisionnés ont été attribués à des comptes. Lorsque les utilisateurs choisissent l'application AWS dans le portail de l'IdP, IAM Identity Center affiche le message An unexpected error has occurred. L'IdP envoie l'adresse e-mail de chaque utilisateur comme NameID SAML.

    Que doit faire l'entreprise pour résoudre le problème ?
body:
  options:
    - id: a
      text:
        en: "Delete the provisioned users, and re-create them in the IAM Identity Center console with their email addresses as usernames."
        fr: "Supprimer les utilisateurs provisionnés, et les recréer dans la console IAM Identity Center avec leur adresse e-mail comme nom d'utilisateur."
    - id: b
      text:
        en: "Generate a new SCIM access token in IAM Identity Center, and run a full synchronization of users and groups from the IdP."
        fr: "Générer un nouveau jeton d'accès SCIM dans IAM Identity Center, et lancer une synchronisation complète des utilisateurs et des groupes depuis l'IdP."
    - id: c
      text:
        en: "Change the IdP configuration so that the SAML NameID contains the same attribute that SCIM maps to the Identity Center username."
        fr: "Modifier la configuration de l'IdP pour que le NameID SAML contienne le même attribut que celui que SCIM associe au nom d'utilisateur Identity Center."
    - id: d
      text:
        en: "Change the assertion consumer service URL in the IdP to the AWS sign-in endpoint https://signin.aws.amazon.com/saml."
        fr: "Remplacer l'URL du service consommateur d'assertions dans l'IdP par le point de terminaison de connexion AWS https://signin.aws.amazon.com/saml."
answer: { optionId: c }
explanation:
  correct:
    en: "IAM Identity Center matches the SAML NameID with the username of an existing user and does not create users just in time. For SCIM-provisioned users, the attribute sent as NameID must be the one mapped to Username in the SCIM configuration; otherwise sign-in fails."
    fr: "IAM Identity Center fait correspondre le NameID SAML au nom d'utilisateur d'un utilisateur existant et ne crée pas d'utilisateurs à la volée (just in time). Pour les utilisateurs provisionnés par SCIM, l'attribut envoyé comme NameID doit être celui associé à Username dans la configuration SCIM ; sinon, la connexion échoue."
  options:
    a:
      en: "With automatic provisioning enabled, users can no longer be added or edited in the Identity Center console."
      fr: "Avec le provisionnement automatique activé, les utilisateurs ne peuvent plus être ajoutés ni modifiés dans la console Identity Center."
    b:
      en: "Provisioning already works; a new token and a full sync keep the same usernames, which still do not match the NameID."
      fr: "Le provisionnement fonctionne déjà ; un nouveau jeton et une synchronisation complète conservent les mêmes noms d'utilisateur, qui ne correspondent toujours pas au NameID."
    d:
      en: "That URL is the endpoint for direct IAM SAML federation; IAM Identity Center requires the ACS URL of its own instance."
      fr: "Cette URL est le point de terminaison de la fédération SAML IAM directe ; IAM Identity Center exige l'URL ACS de sa propre instance."
references:
  - title: Troubleshooting IAM Identity Center issues
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/troubleshooting.html
  - title: Provision users and groups from an external identity provider using SCIM
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/provision-automatically.html
