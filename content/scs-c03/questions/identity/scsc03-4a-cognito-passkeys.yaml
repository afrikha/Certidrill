id: scsc03-4a-cognito-passkeys
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany wants customers of its retail website to sign in without passwords by using passkeys on their phones and laptops. Customers who have not registered a passkey yet must be able to sign in with a one-time code sent by email. The website uses an Amazon Cognito user pool on the Essentials feature plan with managed login and a custom domain, and the user pool sends email through Amazon SES.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    AnyCompany veut que les clients de son site de vente en ligne se connectent sans mot de passe grâce à des clés d'accès (passkeys) sur leurs téléphones et ordinateurs portables. Les clients qui n'ont pas encore enregistré de passkey doivent pouvoir se connecter avec un code à usage unique envoyé par e-mail. Le site utilise un groupe d'utilisateurs Amazon Cognito au niveau Essentials avec la connexion gérée et un domaine personnalisé, et le groupe d'utilisateurs envoie ses e-mails par Amazon SES.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - id: a
      text:
        en: "Keep password sign-in, set MFA enforcement to Required, and allow passkeys as the second factor that customers use after their password."
        fr: "Conserver la connexion par mot de passe, définir l'application de la MFA sur Required, et autoriser les passkeys comme second facteur utilisé après le mot de passe."
    - id: b
      text:
        en: "Implement WebAuthn registration and verification in custom authentication challenge Lambda triggers, and switch the app client to the CUSTOM_AUTH flow."
        fr: "Mettre en œuvre l'enregistrement et la vérification WebAuthn dans des déclencheurs Lambda de défi d'authentification personnalisé, et passer le client d'application au flux CUSTOM_AUTH."
    - id: c
      text:
        en: "Enable the USER_SRP_AUTH flow on the app client, and configure TOTP MFA so that customers' phones act as the second factor at sign-in."
        fr: "Activer le flux USER_SRP_AUTH sur le client d'application, et configurer la MFA TOTP pour que les téléphones des clients servent de second facteur à la connexion."
    - id: d
      text:
        en: "Enable choice-based sign-in on the app client, and set the user pool's allowed first factors to passkeys (WEB_AUTHN) and email one-time passwords (EMAIL_OTP)."
        fr: "Activer la connexion basée sur le choix (choice-based) sur le client d'application, et définir comme premiers facteurs autorisés du groupe d'utilisateurs les passkeys (WEB_AUTHN) et les mots de passe à usage unique par e-mail (EMAIL_OTP)."
answer: { optionId: d }
explanation:
  correct:
    en: "Passkeys are offered only in choice-based sign-in (the USER_AUTH flow, enabled with ALLOW_USER_AUTH), which is available on every feature plan except Lite. The user pool's sign-in policy lists the allowed first factors; the passkey factor must be accompanied by at least one other option, and EMAIL_OTP gives customers without a passkey a passwordless fallback."
    fr: "Les passkeys ne sont proposées qu'avec la connexion basée sur le choix (flux USER_AUTH, activé par ALLOW_USER_AUTH), disponible à tous les niveaux sauf Lite. La politique de connexion du groupe d'utilisateurs liste les premiers facteurs autorisés ; le facteur passkey doit être accompagné d'au moins une autre option, et EMAIL_OTP offre aux clients sans passkey une solution de repli sans mot de passe."
  options:
    a:
      en: "Passkeys cannot be used as a second factor after a password sign-in, and the requirement is to sign in without a password."
      fr: "Les passkeys ne peuvent pas servir de second facteur après une connexion par mot de passe, et l'exigence est de se connecter sans mot de passe."
    b:
      en: "Custom challenges could implement WebAuthn, but only with custom code that the built-in passkey support makes unnecessary."
      fr: "Des défis personnalisés pourraient mettre en œuvre WebAuthn, mais uniquement avec du code personnalisé que la prise en charge native des passkeys rend inutile."
    c:
      en: "SRP is a password-based flow and TOTP is a second factor, so customers would still need a password."
      fr: "SRP est un flux fondé sur un mot de passe et TOTP est un second facteur : les clients auraient toujours besoin d'un mot de passe."
references:
  - title: Authentication flows
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-authentication-flow-methods.html
