id: scsc03-4a-match-identity-solutions
objective: "4.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is choosing how each of its users and workloads will authenticate to AWS or to its applications.

    Match each requirement with the AWS identity solution that meets it. Each solution can be used once or not at all.
  fr: |
    AnyCompany choisit comment chacun de ses utilisateurs et chacune de ses charges de travail s'authentifiera auprès d'AWS ou de ses applications.

    Associez chaque exigence à la solution d'identité AWS qui y répond. Chaque solution peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: idc, text: "AWS IAM Identity Center" }
    - { id: userpool, text: { en: "Amazon Cognito user pool", fr: "Groupe d'utilisateurs Amazon Cognito" } }
    - { id: idpool, text: { en: "Amazon Cognito identity pool", fr: "Groupe d'identités Amazon Cognito" } }
    - { id: rolesanywhere, text: "IAM Roles Anywhere" }
    - { id: oidc, text: { en: "IAM OIDC identity provider", fr: "Fournisseur d'identité OIDC IAM" } }
    - { id: mad, text: "AWS Managed Microsoft AD" }
  targets:
    - id: t1
      text: { en: "Employees sign in once and get access to many accounts of the organization, with permissions defined centrally for each group.", fr: "Les employés se connectent une seule fois et obtiennent l'accès à de nombreux comptes de l'organisation, avec des autorisations définies de façon centralisée pour chaque groupe." }
    - id: t2
      text: { en: "Customers sign up and sign in to a web application with an email address and MFA, and the application receives JSON Web Tokens.", fr: "Les clients s'inscrivent et se connectent à une application web avec une adresse e-mail et la MFA, et l'application reçoit des jetons web JSON (JWT)." }
    - id: t3
      text: { en: "Signed-in users of a mobile app receive temporary AWS credentials to upload photos directly to Amazon S3.", fr: "Les utilisateurs connectés d'une application mobile reçoivent des informations d'identification AWS temporaires pour charger des photos directement dans Amazon S3." }
    - id: t4
      text: { en: "On-premises servers that hold X.509 certificates issued by the company's private CA obtain temporary AWS credentials.", fr: "Des serveurs sur site qui détiennent des certificats X.509 émis par l'autorité de certification privée de l'entreprise obtiennent des informations d'identification AWS temporaires." }
    - id: t5
      text: { en: "A pipeline in a third-party CI/CD service exchanges the JWT that the service issues for the credentials of a deployment role.", fr: "Un pipeline d'un service CI/CD tiers échange le JWT émis par ce service contre les informations d'identification d'un rôle de déploiement." }
answer:
  mapping: { t1: idc, t2: userpool, t3: idpool, t4: rolesanywhere, t5: oidc }
explanation:
  correct:
    en: "IAM Identity Center gives the workforce single sign-on to many accounts with permission sets. A Cognito user pool is a customer directory that handles sign-up, sign-in and MFA and issues JWTs, and a Cognito identity pool exchanges those tokens for temporary AWS credentials. IAM Roles Anywhere issues temporary credentials to workloads outside AWS that authenticate with certificates from a trusted CA, and an IAM OIDC identity provider lets AWS STS accept JWTs from an external issuer in AssumeRoleWithWebIdentity."
    fr: "IAM Identity Center fournit au personnel l'authentification unique vers de nombreux comptes avec des ensembles d'autorisations. Un groupe d'utilisateurs Cognito est un annuaire de clients qui gère l'inscription, la connexion et la MFA et émet des JWT, et un groupe d'identités Cognito échange ces jetons contre des informations d'identification AWS temporaires. IAM Roles Anywhere émet des informations d'identification temporaires pour des charges de travail hors d'AWS qui s'authentifient avec des certificats d'une autorité de certification approuvée, et un fournisseur d'identité OIDC IAM permet à AWS STS d'accepter dans AssumeRoleWithWebIdentity les JWT d'un émetteur externe."
  options:
    mad:
      en: "AWS Managed Microsoft AD is a managed Active Directory that can serve as an identity source, but by itself it issues neither JWTs nor AWS credentials for these requirements."
      fr: "AWS Managed Microsoft AD est un Active Directory géré qui peut servir de source d'identité, mais à lui seul il n'émet ni JWT ni informations d'identification AWS pour ces exigences."
references:
  - title: Identity pools authentication flow
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html
  - title: Getting started with IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/getting-started.html
