id: scsc03-4c-unused-tag-exclusion
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 150 accounts in AWS Organizations and a delegated administrator account for IAM Access Analyzer. The security team wants continuous findings for IAM roles and users that have not been used for 90 days, and for unused permissions, across the organization. Every account has break-glass roles tagged access-type=breakglass that must never generate findings, and the accounts of the Sandbox OU must not be analyzed. The company does not want to pay to analyze the roles and accounts that it ignores.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 150 comptes dans AWS Organizations et un compte administrateur délégué pour IAM Access Analyzer. L'équipe de sécurité veut des résultats continus, sur toute l'organisation, pour les rôles et utilisateurs IAM inutilisés depuis 90 jours et pour les autorisations inutilisées. Chaque compte possède des rôles d'urgence balisés access-type=breakglass qui ne doivent jamais générer de résultats, et les comptes de l'unité d'organisation Sandbox ne doivent pas être analysés. L'entreprise ne veut pas payer l'analyse des rôles et comptes qu'elle ignore.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an organization unused access analyzer with a 90-day tracking period, and add archive rules for the Sandbox accounts and the break-glass role ARNs.
        fr: |-
          Créer un analyseur d'accès inutilisé d'organisation avec une période de suivi de 90 jours, puis ajouter des règles d'archivage pour les comptes Sandbox et les ARN des rôles d'urgence.
    - id: b
      text:
        en: |-
          Create an organization unused access analyzer with a 90-day tracking period that excludes the Sandbox OU accounts and the principals tagged access-type=breakglass.
        fr: |-
          Créer un analyseur d'accès inutilisé d'organisation avec une période de suivi de 90 jours qui exclut les comptes de l'unité d'organisation Sandbox et les principaux balisés access-type=breakglass.
    - id: c
      text:
        en: |-
          Create an external access analyzer for the organization in every Region, and add an archive rule for the principals tagged access-type=breakglass.
        fr: |-
          Créer un analyseur d'accès externe pour l'organisation dans chaque Région, puis ajouter une règle d'archivage pour les principaux balisés access-type=breakglass.
    - id: d
      text:
        en: |-
          Generate the IAM credential report in every account outside the Sandbox OU every day, and filter out the break-glass roles with a script.
        fr: |-
          Générer chaque jour le rapport d'informations d'identification IAM dans chaque compte hors de l'unité d'organisation Sandbox, puis exclure les rôles d'urgence avec un script.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An unused access analyzer with the organization as its scope reports unused roles, access keys, passwords and permissions over a tracking period of 1 to 365 days. Its exclusions remove accounts or whole OUs and IAM users and roles that carry given tags from the analysis, and the analyzer is billed per role and user analyzed, so excluded principals are not charged.
    fr: |-
      Un analyseur d'accès inutilisé dont la portée est l'organisation signale les rôles, clés d'accès, mots de passe et autorisations inutilisés sur une période de suivi de 1 à 365 jours. Ses exclusions retirent de l'analyse des comptes ou des unités d'organisation entières ainsi que les utilisateurs et rôles IAM qui portent certaines balises, et l'analyseur est facturé par rôle et utilisateur analysé : les principaux exclus ne sont pas facturés.
  options:
    a:
      en: |-
        Archive rules hide findings after the analysis; the Sandbox accounts and break-glass roles would still be analyzed and billed.
      fr: |-
        Les règles d'archivage masquent les résultats après l'analyse ; les comptes Sandbox et les rôles d'urgence seraient toujours analysés et facturés.
    c:
      en: |-
        An external access analyzer reports resources shared outside the zone of trust; it does not find unused roles or permissions.
      fr: |-
        Un analyseur d'accès externe signale les ressources partagées en dehors de la zone de confiance ; il ne trouve ni rôles ni autorisations inutilisés.
    d:
      en: |-
        The credential report covers only IAM users and the root user, not roles or unused permissions, and it needs custom scripting.
      fr: |-
        Le rapport d'informations d'identification ne couvre que les utilisateurs IAM et l'utilisateur racine, pas les rôles ni les autorisations inutilisées, et il exige des scripts personnalisés.
references:
  - title: Create an IAM Access Analyzer unused access analyzer - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-create-unused.html
