id: scsc03-4a-cf-signed-url-5-days
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's support portal lets agents send customers download links for diagnostic bundles that are stored in a private Amazon S3 bucket. Each link must stay valid for 5 days. An AWS Lambda function currently generates Amazon S3 presigned URLs with an expiration of 5 days, but customers report that the links stop working after a few hours. Company policy prohibits IAM users and long-term access keys.

    Which solution will meet these requirements?
  fr: |
    Le portail d'assistance d'AnyCompany permet aux agents d'envoyer aux clients des liens de téléchargement vers des archives de diagnostic stockées dans un compartiment Amazon S3 privé. Chaque lien doit rester valide pendant 5 jours. Une fonction AWS Lambda génère actuellement des URL présignées Amazon S3 avec une expiration de 5 jours, mais les clients signalent que les liens cessent de fonctionner au bout de quelques heures. La politique de l'entreprise interdit les utilisateurs IAM et les clés d'accès à long terme.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Raise the maximum session duration of the function's execution role to 12 hours, and keep generating S3 presigned URLs with a 5-day expiration from the function."
        fr: "Porter à 12 heures la durée de session maximale du rôle d'exécution de la fonction, et continuer à générer depuis la fonction des URL présignées S3 avec une expiration de 5 jours."
    - id: b
      text:
        en: "Have the function call GetSessionToken with a duration of 36 hours, and sign the presigned URLs with the temporary credentials that it returns."
        fr: "Faire appeler GetSessionToken par la fonction avec une durée de 36 heures, et signer les URL présignées avec les informations d'identification temporaires renvoyées."
    - id: c
      text:
        en: "Serve the bucket through CloudFront with origin access control and a trusted key group, and have the function create CloudFront signed URLs that expire after 5 days."
        fr: "Servir le compartiment par CloudFront avec contrôle d'accès à l'origine (OAC) et un groupe de clés approuvé, et faire créer par la fonction des URL signées CloudFront qui expirent après 5 jours."
    - id: d
      text:
        en: "Create an IAM user dedicated to URL signing, store its access keys in AWS Secrets Manager, and sign 5-day presigned URLs with those keys."
        fr: "Créer un utilisateur IAM dédié à la signature des URL, stocker ses clés d'accès dans AWS Secrets Manager, et signer des URL présignées de 5 jours avec ces clés."
answer: { optionId: c }
explanation:
  correct:
    en: "An S3 presigned URL stops working when the credentials that signed it expire, so URLs signed with role credentials last only as long as the role session, whatever expiration they carry. CloudFront signed URLs are verified with a public key of the trusted key group and carry their own expiration, so they can stay valid for 5 days without IAM user credentials, while origin access control keeps the bucket private."
    fr: "Une URL présignée S3 cesse de fonctionner lorsque les informations d'identification qui l'ont signée expirent : des URL signées avec des informations d'identification de rôle ne durent que le temps de la session de rôle, quelle que soit leur expiration. Les URL signées CloudFront sont vérifiées avec une clé publique du groupe de clés approuvé et portent leur propre expiration : elles peuvent rester valides 5 jours sans informations d'identification d'utilisateur IAM, tandis que le contrôle d'accès à l'origine garde le compartiment privé."
  options:
    a:
      en: "Role sessions last at most 12 hours, so URLs signed with role credentials can never stay valid for 5 days."
      fr: "Les sessions de rôle durent au plus 12 heures : des URL signées avec des informations d'identification de rôle ne peuvent jamais rester valides 5 jours."
    b:
      en: "GetSessionToken can be called only with the credentials of an IAM user or the root user, and its credentials last at most 36 hours."
      fr: "GetSessionToken ne peut être appelé qu'avec les informations d'identification d'un utilisateur IAM ou de l'utilisateur racine, et ses informations d'identification durent au plus 36 heures."
    d:
      en: "An IAM user with long-term access keys violates the company's policy."
      fr: "Un utilisateur IAM avec des clés d'accès à long terme enfreint la politique de l'entreprise."
references:
  - title: Download and upload objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html
  - title: Specify signers that can create signed URLs and signed cookies
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-trusted-signers.html
