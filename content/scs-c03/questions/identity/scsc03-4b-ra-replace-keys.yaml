id: scsc03-4b-ra-replace-keys
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company runs inventory software on on-premises servers. The software calls Amazon S3 with IAM user access keys that are stored in configuration files. Each server already has an X.509 certificate issued by the company's AWS Private CA. The security team requires that no long-term AWS credentials remain on the servers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise industrielle exécute un logiciel d'inventaire sur des serveurs sur site. Le logiciel appelle Amazon S3 avec des clés d'accès d'utilisateurs IAM stockées dans des fichiers de configuration. Chaque serveur dispose déjà d'un certificat X.509 émis par l'AWS Private CA de l'entreprise. L'équipe de sécurité exige qu'il ne reste plus aucune information d'identification AWS à long terme sur les serveurs.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Configure AWS IAM Identity Center with a permission set for Amazon S3, and have an operator sign in to the AWS access portal on each server.
        fr: |-
          Configurer AWS IAM Identity Center avec un ensemble d'autorisations pour Amazon S3, et faire se connecter un opérateur au portail d'accès AWS sur chaque serveur.
    - id: b
      text:
        en: |-
          Create an Amazon Cognito identity pool that allows unauthenticated identities, and have the software request credentials for an unauthenticated role.
        fr: |-
          Créer un groupe d'identités Amazon Cognito qui autorise les identités non authentifiées, et faire demander par le logiciel des informations d'identification pour un rôle non authentifié.
    - id: c
      text:
        en: |-
          Configure IAM Roles Anywhere with a trust anchor for the AWS Private CA, a role, and a profile, and run the credential helper on each server.
        fr: |-
          Configurer IAM Roles Anywhere avec une ancre de confiance pour l'AWS Private CA, un rôle et un profil, et exécuter l'assistant d'informations d'identification sur chaque serveur.
    - id: d
      text:
        en: |-
          Store the access keys in AWS Secrets Manager with automatic rotation, and have the software retrieve the current keys at startup.
        fr: |-
          Stocker les clés d'accès dans AWS Secrets Manager avec une rotation automatique, et faire récupérer les clés actuelles par le logiciel au démarrage.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      IAM Roles Anywhere lets workloads outside AWS obtain temporary IAM credentials by authenticating with X.509 certificates, so the servers no longer need long-term keys. A trust anchor that references the existing AWS Private CA, a role, and a profile are all that is needed, and the credential helper uses each server's certificate and private key.
    fr: |-
      IAM Roles Anywhere permet aux charges de travail situées hors d'AWS d'obtenir des informations d'identification IAM temporaires en s'authentifiant avec des certificats X.509 : les serveurs n'ont plus besoin de clés à long terme. Il suffit d'une ancre de confiance qui référence l'AWS Private CA existante, d'un rôle et d'un profil, et l'assistant utilise le certificat et la clé privée de chaque serveur.
  options:
    a:
      en: |-
        IAM Identity Center provides workforce sign-in for people; unattended software on servers cannot rely on an operator signing in.
      fr: |-
        IAM Identity Center fournit la connexion des personnes de l'entreprise ; un logiciel sans surveillance sur des serveurs ne peut pas dépendre de la connexion d'un opérateur.
    b:
      en: |-
        Unauthenticated identities give credentials to anyone who calls the identity pool, which does not prove that the caller is one of the company's servers.
      fr: |-
        Les identités non authentifiées fournissent des informations d'identification à quiconque appelle le groupe d'identités, ce qui ne prouve pas que l'appelant est l'un des serveurs de l'entreprise.
    d:
      en: |-
        The access keys remain long-term credentials, and the servers would still need AWS credentials to call Secrets Manager in the first place.
      fr: |-
        Les clés d'accès restent des informations d'identification à long terme, et les serveurs auraient quand même besoin d'informations d'identification AWS pour appeler Secrets Manager.
references:
  - title: What is AWS Identity and Access Management Roles Anywhere? - IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
