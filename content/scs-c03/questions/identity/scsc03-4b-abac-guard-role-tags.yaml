id: scsc03-4b-abac-guard-role-tags
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses ABAC across the member accounts of its organization in AWS Organizations. Access to resources depends on the access-project tag of the IAM roles that workloads use. Some developers have iam:TagRole and iam:UntagRole permissions for their own automation. The security team must ensure that no principal in any member account, except the role IdentityAdmin, can add, change, or remove the access-project tag on IAM roles. The control must also apply to principals created in the future.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise ABAC dans les comptes membres de son organisation AWS Organizations. L'accès aux ressources dépend de la balise access-project des rôles IAM utilisés par les charges de travail. Certains développeurs disposent des autorisations iam:TagRole et iam:UntagRole pour leur propre automatisation. L'équipe de sécurité doit garantir qu'aucun principal d'un compte membre, à l'exception du rôle IdentityAdmin, ne puisse ajouter, modifier ou supprimer la balise access-project des rôles IAM. Le contrôle doit aussi s'appliquer aux principaux créés à l'avenir.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP that denies iam:TagRole and iam:UntagRole when ForAnyValue:StringEquals on aws:TagKeys matches access-project, except for the IdentityAdmin role ARN.
        fr: |-
          Attacher une SCP qui refuse iam:TagRole et iam:UntagRole lorsque ForAnyValue:StringEquals sur aws:TagKeys correspond à access-project, sauf pour l'ARN du rôle IdentityAdmin.
    - id: b
      text:
        en: |-
          Attach to each existing developer role a permissions boundary that denies iam:TagRole and iam:UntagRole for the access-project tag key in all accounts.
        fr: |-
          Attacher à chaque rôle de développeur existant une limite d'autorisations qui refuse iam:TagRole et iam:UntagRole pour la clé de balise access-project dans tous les comptes.
    - id: c
      text:
        en: |-
          Attach an SCP that denies iam:TagRole when the request contains aws:RequestTag/access-project, unless aws:PrincipalArn matches the IdentityAdmin role ARN.
        fr: |-
          Attacher une SCP qui refuse iam:TagRole lorsque la demande contient aws:RequestTag/access-project, sauf si aws:PrincipalArn correspond à l'ARN du rôle IdentityAdmin.
    - id: d
      text:
        en: |-
          Attach an SCP that denies sts:TagSession for all principals except IdentityAdmin so that no session can carry an access-project tag.
        fr: |-
          Attacher une SCP qui refuse sts:TagSession à tous les principaux sauf IdentityAdmin pour qu'aucune session ne puisse porter de balise access-project.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      ABAC policies make the principal tags themselves an access control, so changing them must be restricted. An SCP applies to every current and future principal in the member accounts; denying both TagRole and UntagRole when any key in aws:TagKeys is access-project covers adding, changing, and removing the tag, and the aws:PrincipalArn condition exempts IdentityAdmin.
    fr: |-
      Avec ABAC, les balises de principal deviennent elles-mêmes un contrôle d'accès : leur modification doit être restreinte. Une SCP s'applique à tous les principaux actuels et futurs des comptes membres ; refuser TagRole et UntagRole lorsqu'une clé d'aws:TagKeys est access-project couvre l'ajout, la modification et la suppression de la balise, et la condition aws:PrincipalArn exempte IdentityAdmin.
  options:
    b:
      en: |-
        A boundary on existing developer roles does not cover principals created later or other principals with tagging permissions.
      fr: |-
        Une limite d'autorisations sur les rôles de développeur existants ne couvre ni les principaux créés plus tard ni les autres principaux disposant d'autorisations de balisage.
    c:
      en: |-
        Denying only TagRole leaves UntagRole allowed, so principals could still remove the access-project tag.
      fr: |-
        Refuser seulement TagRole laisse UntagRole autorisé : les principaux pourraient toujours supprimer la balise access-project.
    d:
      en: |-
        sts:TagSession controls session tags passed when a role is assumed; it does not protect the tags attached to IAM roles, and it would break federation that passes session tags.
      fr: |-
        sts:TagSession contrôle les balises de session transmises lors de l'endossement d'un rôle ; il ne protège pas les balises attachées aux rôles IAM, et il bloquerait la fédération qui transmet des balises de session.
references:
  - title: Define permissions based on attributes with ABAC authorization - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html
  - title: Single-valued vs. multivalued context keys - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-single-vs-multi-valued-context-keys.html
