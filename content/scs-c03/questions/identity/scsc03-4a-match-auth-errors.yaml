id: scsc03-4a-match-auth-errors
objective: "4.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's engineers collected five authentication errors from different applications.

    Match each error with the action that resolves it. Each action can be used once or not at all.
  fr: |
    Les ingénieurs d'AnyCompany ont relevé cinq erreurs d'authentification dans différentes applications.

    Associez chaque erreur à l'action qui la résout. Chaque action peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: hash, text: { en: "Compute SECRET_HASH from the username, the client ID and the client secret, and send it with the request.", fr: "Calculer SECRET_HASH à partir du nom d'utilisateur, de l'ID client et du secret client, et l'envoyer avec la requête." } }
    - { id: newpw, text: { en: "Call RespondToAuthChallenge with a new password for the user.", fr: "Appeler RespondToAuthChallenge avec un nouveau mot de passe pour l'utilisateur." } }
    - { id: metadata, text: { en: "Update the IAM SAML provider with the IdP's new metadata by running aws iam update-saml-provider.", fr: "Mettre à jour le fournisseur SAML IAM avec les nouvelles métadonnées de l'IdP en exécutant aws iam update-saml-provider." } }
    - { id: maxdur, text: { en: "Raise the role's maximum session duration, or request a shorter duration.", fr: "Augmenter la durée de session maximale du rôle, ou demander une durée plus courte." } }
    - { id: region, text: { en: "Activate AWS STS in that Region in the IAM account settings.", fr: "Activer AWS STS dans cette Région dans les paramètres de compte IAM." } }
    - { id: tag, text: { en: "Add sts:TagSession to the role's trust policy.", fr: "Ajouter sts:TagSession à la politique d'approbation du rôle." } }
    - { id: existence, text: { en: "Set PreventUserExistenceErrors to ENABLED on the app client.", fr: "Définir PreventUserExistenceErrors sur ENABLED sur le client d'application." } }
  targets:
    - id: t1
      text: { en: "A server-side app calls InitiateAuth on an Amazon Cognito app client that has a client secret and receives Unable to verify secret hash for client.", fr: "Une application côté serveur appelle InitiateAuth sur un client d'application Amazon Cognito doté d'un secret client et reçoit Unable to verify secret hash for client." }
    - id: t2
      text: { en: "A user created by an administrator in an Amazon Cognito user pool signs in for the first time and receives a NEW_PASSWORD_REQUIRED challenge.", fr: "Un utilisateur créé par un administrateur dans un groupe d'utilisateurs Amazon Cognito se connecte pour la première fois et reçoit un défi NEW_PASSWORD_REQUIRED." }
    - id: t3
      text: { en: "AssumeRoleWithSAML fails with Response signature invalid after the IdP renewed its signing certificate.", fr: "AssumeRoleWithSAML échoue avec Response signature invalid après le renouvellement du certificat de signature de l'IdP." }
    - id: t4
      text: { en: "AssumeRoleWithSAML fails with Requested DurationSeconds exceeds MaxSessionDuration set for this role.", fr: "AssumeRoleWithSAML échoue avec Requested DurationSeconds exceeds MaxSessionDuration set for this role." }
    - id: t5
      text: { en: "AssumeRoleWithWebIdentity fails with the RegionDisabled error at a Regional AWS STS endpoint.", fr: "AssumeRoleWithWebIdentity échoue avec l'erreur RegionDisabled sur un point de terminaison régional d'AWS STS." }
answer:
  mapping: { t1: hash, t2: newpw, t3: metadata, t4: maxdur, t5: region }
explanation:
  correct:
    en: "When an app client has a secret, Cognito API requests must include a SECRET_HASH, a Base64 HMAC-SHA256 of the username and client ID keyed with the client secret. A user created with a temporary password must answer NEW_PASSWORD_REQUIRED with RespondToAuthChallenge. After an IdP certificate change, the IAM SAML provider needs the updated metadata; a DurationSeconds above the role's maximum fails until either value changes; and RegionDisabled means that AWS STS is not activated in that Region for the account."
    fr: "Lorsqu'un client d'application a un secret, les requêtes d'API Cognito doivent inclure un SECRET_HASH, un HMAC-SHA256 encodé en Base64 du nom d'utilisateur et de l'ID client, avec le secret client comme clé. Un utilisateur créé avec un mot de passe temporaire doit répondre au défi NEW_PASSWORD_REQUIRED avec RespondToAuthChallenge. Après un changement de certificat de l'IdP, le fournisseur SAML IAM a besoin des métadonnées à jour ; une valeur DurationSeconds supérieure au maximum du rôle échoue tant que l'une des deux valeurs ne change pas ; et RegionDisabled signifie qu'AWS STS n'est pas activé dans cette Région pour le compte."
  options:
    tag:
      en: "sts:TagSession is needed when a request passes session tags; none of these errors comes from missing tag permissions."
      fr: "sts:TagSession est nécessaire lorsqu'une requête transmet des balises de session ; aucune de ces erreurs ne provient d'une autorisation de balisage manquante."
    existence:
      en: "This setting changes the error responses for unknown users; it does not resolve any of these errors."
      fr: "Ce paramètre change les réponses d'erreur pour les utilisateurs inconnus ; il ne résout aucune de ces erreurs."
references:
  - title: Troubleshoot SAML federation with IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_saml.html
  - title: Signing up and confirming user accounts
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/signing-up-users-in-your-app.html
