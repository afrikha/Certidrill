id: scsc03-4b-saml-tagsession-trust
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany federates its workforce directly into IAM roles through an IAM SAML 2.0 identity provider. To introduce ABAC, administrators configured the IdP to send the attribute https://aws.amazon.com/SAML/Attributes/PrincipalTag:project, and the role policies now use aws:PrincipalTag/project. Since this change, every federated sign-in fails with an AccessDenied error on AssumeRoleWithSAML. The trust policies allow sts:AssumeRoleWithSAML for the SAML provider and have not been modified.

    What should the security engineer change?
  fr: |
    AnyCompany fédère son personnel directement dans des rôles IAM au moyen d'un fournisseur d'identité SAML 2.0 IAM. Pour introduire ABAC, les administrateurs ont configuré l'IdP pour qu'il envoie l'attribut https://aws.amazon.com/SAML/Attributes/PrincipalTag:project, et les politiques des rôles utilisent maintenant aws:PrincipalTag/project. Depuis ce changement, chaque connexion fédérée échoue avec une erreur AccessDenied sur AssumeRoleWithSAML. Les politiques d'approbation autorisent sts:AssumeRoleWithSAML pour le fournisseur SAML et n'ont pas été modifiées.

    Que doit modifier l'ingénieur sécurité ?
body:
  options:
    - id: a
      text:
        en: |-
          Add sts:TagSession to the actions that the trust policy of each role allows for the SAML provider principal.
        fr: |-
          Ajouter sts:TagSession aux actions que la politique d'approbation de chaque rôle autorise pour le principal du fournisseur SAML.
    - id: b
      text:
        en: |-
          Add iam:TagRole to the permissions policy of each role so that the session can apply the project tag to the role.
        fr: |-
          Ajouter iam:TagRole à la politique d'autorisations de chaque rôle pour que la session puisse appliquer la balise project au rôle.
    - id: c
      text:
        en: |-
          Add a project tag to the IAM SAML identity provider resource so that STS accepts project session tags from it.
        fr: |-
          Ajouter une balise project à la ressource fournisseur d'identité SAML IAM pour que STS accepte les balises de session project qui en proviennent.
    - id: d
      text:
        en: |-
          Add a ForAllValues:StringEquals condition on aws:TagKeys for project to the permissions policy of each role.
        fr: |-
          Ajouter une condition ForAllValues:StringEquals sur aws:TagKeys pour project à la politique d'autorisations de chaque rôle.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Passing session tags requires the sts:TagSession permission in the role trust policy, in addition to the assume-role action. Without it, the role assumption fails as soon as the IdP sends a PrincipalTag attribute, which matches the symptom.
    fr: |-
      Transmettre des balises de session exige l'autorisation sts:TagSession dans la politique d'approbation du rôle, en plus de l'action d'endossement du rôle. Sans elle, l'endossement échoue dès que l'IdP envoie un attribut PrincipalTag, ce qui correspond au symptôme.
  options:
    b:
      en: |-
        Session tags apply to the session, not to the role resource, and the failure happens in the trust policy evaluation before any permissions policy applies.
      fr: |-
        Les balises de session s'appliquent à la session, pas à la ressource rôle, et l'échec se produit lors de l'évaluation de la politique d'approbation, avant toute politique d'autorisations.
    c:
      en: |-
        Tags on the identity provider resource do not authorize STS to accept session tags; that permission comes from sts:TagSession in the trust policy.
      fr: |-
        Les balises de la ressource fournisseur d'identité n'autorisent pas STS à accepter des balises de session ; cette autorisation vient de sts:TagSession dans la politique d'approbation.
    d:
      en: |-
        A permissions policy condition cannot fix a failure of AssumeRoleWithSAML, which is authorized by the trust policy.
      fr: |-
        Une condition dans une politique d'autorisations ne peut pas corriger un échec d'AssumeRoleWithSAML, qui est autorisé par la politique d'approbation.
references:
  - title: Pass session tags in AWS STS - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_session-tags.html
