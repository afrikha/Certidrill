id: scsc03-4b-session-arn-resource-policy
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In account 111122223333, the identity-based policy of the role BatchRole allows s3:GetObject and s3:PutObject on ingest/*, where ingest is a bucket in the same account. A nightly job calls AssumeRole for BatchRole with the role session name nightly and passes an inline session policy that allows only s3:GetObject on ingest/*. The bucket policy of ingest contains one statement that allows s3:PutObject on ingest/archive/* to the principal arn:aws:sts::111122223333:assumed-role/BatchRole/nightly. No other policy applies.

    Which statement describes the access of the job's session?
  fr: |
    Dans le compte 111122223333, la politique basée sur l'identité du rôle BatchRole autorise s3:GetObject et s3:PutObject sur ingest/*, ingest étant un compartiment du même compte. Une tâche nocturne appelle AssumeRole pour BatchRole avec le nom de session de rôle nightly et transmet une politique de session en ligne qui n'autorise que s3:GetObject sur ingest/*. La politique du compartiment ingest contient une instruction qui autorise s3:PutObject sur ingest/archive/* au principal arn:aws:sts::111122223333:assumed-role/BatchRole/nightly. Aucune autre politique ne s'applique.

    Quelle affirmation décrit l'accès de la session de la tâche ?
body:
  options:
    - id: a
      text:
        en: |-
          The session can read objects anywhere in ingest and can write objects only under archive/.
        fr: |-
          La session peut lire des objets partout dans ingest et ne peut écrire des objets que sous archive/.
    - id: b
      text:
        en: |-
          The session can only read objects in ingest, because the session policy does not allow s3:PutObject.
        fr: |-
          La session peut seulement lire des objets dans ingest, car la politique de session n'autorise pas s3:PutObject.
    - id: c
      text:
        en: |-
          The session can read and write objects anywhere in ingest, because the role's policy allows both actions.
        fr: |-
          La session peut lire et écrire des objets partout dans ingest, car la politique du rôle autorise les deux actions.
    - id: d
      text:
        en: |-
          The session can only write objects under archive/, because the bucket policy names the session directly.
        fr: |-
          La session peut seulement écrire des objets sous archive/, car la politique de compartiment nomme directement la session.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The session's identity-based access is the intersection of the role policy and the session policy, which leaves s3:GetObject on ingest/*. A resource-based policy that names the session ARN adds its permissions after the session is created, and they are not limited by the session policy, so the session can also write under archive/.
    fr: |-
      L'accès de la session fondé sur l'identité est l'intersection de la politique du rôle et de la politique de session, ce qui laisse s3:GetObject sur ingest/*. Une politique basée sur les ressources qui nomme l'ARN de la session ajoute ses autorisations après la création de la session, et elles ne sont pas limitées par la politique de session : la session peut donc aussi écrire sous archive/.
  options:
    b:
      en: |-
        This would be true if the bucket policy named the role ARN; permissions granted to the session ARN are not limited by the session policy.
      fr: |-
        Ce serait vrai si la politique de compartiment nommait l'ARN du rôle ; les autorisations accordées à l'ARN de la session ne sont pas limitées par la politique de session.
    c:
      en: |-
        The session policy limits the role's own permissions, so s3:PutObject from the role policy is not available outside archive/.
      fr: |-
        La politique de session limite les autorisations propres du rôle : s3:PutObject issu de la politique du rôle n'est pas disponible hors d'archive/.
    d:
      en: |-
        The bucket policy adds permissions to the session; it does not replace the s3:GetObject permission that remains after the session policy is applied.
      fr: |-
        La politique de compartiment ajoute des autorisations à la session ; elle ne remplace pas l'autorisation s3:GetObject qui subsiste après application de la politique de session.
references:
  - title: Policies and permissions in AWS Identity and Access Management - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html
