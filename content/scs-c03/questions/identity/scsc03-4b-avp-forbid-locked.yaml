id: scsc03-4b-avp-forbid-locked
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a document management application that uses Amazon Verified Permissions for authorization. The policy store contains several permit policies, written by different teams, that grant the UpdateDocument action to editors, owners, and administrators. The legal team now requires that no principal can update a document while the document's locked attribute is true. The rule must also apply to permit policies that teams add in the future. The security team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exploite une application de gestion documentaire qui utilise Amazon Verified Permissions pour l'autorisation. Le magasin de politiques (policy store) contient plusieurs politiques permit, écrites par différentes équipes, qui accordent l'action UpdateDocument aux éditeurs, aux propriétaires et aux administrateurs. L'équipe juridique exige désormais qu'aucun principal ne puisse mettre à jour un document tant que l'attribut locked du document vaut true. La règle doit aussi s'appliquer aux politiques permit que les équipes ajouteront à l'avenir. L'équipe de sécurité veut la charge opérationnelle la PLUS FAIBLE.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add an `unless { resource.locked == true }` clause to every existing permit policy that grants UpdateDocument, and require teams to add the clause to new policies.
        fr: |-
          Ajouter une clause `unless { resource.locked == true }` à chaque politique permit existante qui accorde UpdateDocument, et exiger que les équipes ajoutent cette clause aux nouvelles politiques.
    - id: b
      text:
        en: |-
          Add one forbid policy for the UpdateDocument action with a `when { resource.locked == true }` clause that applies to all principals and resources.
        fr: |-
          Ajouter une seule politique forbid pour l'action UpdateDocument avec une clause `when { resource.locked == true }` qui s'applique à tous les principaux et à toutes les ressources.
    - id: c
      text:
        en: |-
          Turn on policy validation against the policy store schema so that permit policies that grant UpdateDocument cannot match locked documents.
        fr: |-
          Activer la validation des politiques par rapport au schéma du magasin de politiques afin que les politiques permit qui accordent UpdateDocument ne puissent pas correspondre aux documents verrouillés.
    - id: d
      text:
        en: |-
          Create a forbid policy template with a ?resource placeholder, and create a template-linked policy for each document when it is locked.
        fr: |-
          Créer un modèle de politique forbid avec un espace réservé ?resource, et créer une politique liée au modèle pour chaque document au moment où il est verrouillé.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Cedar denies a request unless a permit policy is satisfied, and any satisfied forbid policy overrides every satisfied permit policy. A single forbid policy with a condition on the locked attribute therefore blocks updates to locked documents whatever permit policies exist now or are added later, and it is one policy to maintain.
    fr: |-
      Cedar refuse une demande sauf si une politique permit est satisfaite, et toute politique forbid satisfaite l'emporte sur toutes les politiques permit satisfaites. Une seule politique forbid avec une condition sur l'attribut locked bloque donc les mises à jour des documents verrouillés, quelles que soient les politiques permit existantes ou ajoutées plus tard, et il n'y a qu'une politique à maintenir.
  options:
    a:
      en: |-
        The clause works only in the policies that contain it, so a future permit policy written without it would allow updates to locked documents, and every policy must be edited.
      fr: |-
        La clause ne fonctionne que dans les politiques qui la contiennent : une future politique permit écrite sans elle autoriserait la mise à jour des documents verrouillés, et chaque politique doit être modifiée.
    c:
      en: |-
        Schema validation only rejects policies that do not match the entity types, attributes, and actions of the schema; it does not change authorization decisions.
      fr: |-
        La validation par le schéma rejette seulement les politiques qui ne correspondent pas aux types d'entités, attributs et actions du schéma ; elle ne modifie pas les décisions d'autorisation.
    d:
      en: |-
        Linked policies would block updates, but the application would have to create and delete a linked policy each time a document is locked or unlocked, which is more overhead than one conditional forbid policy.
      fr: |-
        Les politiques liées bloqueraient les mises à jour, mais l'application devrait créer et supprimer une politique liée à chaque verrouillage ou déverrouillage, ce qui demande plus d'effort qu'une seule politique forbid conditionnelle.
references:
