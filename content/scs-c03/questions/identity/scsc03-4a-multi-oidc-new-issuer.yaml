id: scsc03-4a-multi-oidc-new-issuer
objective: "4.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's deployment pipelines run in a self-hosted CI service that issues OIDC tokens, and they assume the IAM role Deployer with AssumeRoleWithWebIdentity. The account has an IAM OIDC identity provider for https://ci-old.example.com. The Deployer trust policy uses that provider as its federated principal and has conditions on ci-old.example.com:aud and ci-old.example.com:sub. The CI service was migrated, and its tokens are now issued by https://ci.example.com with the same audience and subject values. Since the migration, every AssumeRoleWithWebIdentity call fails with InvalidIdentityToken.

    Which combination of actions will resolve the issue? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Les pipelines de déploiement d'AnyCompany s'exécutent dans un service CI autohébergé qui émet des jetons OIDC, et ils endossent le rôle IAM Deployer avec AssumeRoleWithWebIdentity. Le compte possède un fournisseur d'identité OIDC IAM pour https://ci-old.example.com. La politique d'approbation de Deployer utilise ce fournisseur comme principal fédéré et a des conditions sur ci-old.example.com:aud et ci-old.example.com:sub. Le service CI a été migré, et ses jetons sont désormais émis par https://ci.example.com avec les mêmes valeurs d'audience et de sujet. Depuis la migration, chaque appel AssumeRoleWithWebIdentity échoue avec InvalidIdentityToken.

    Quelle combinaison d'actions résoudra le problème ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text:
        en: "Create an IAM OIDC identity provider for https://ci.example.com with the pipelines' audience as a client ID."
        fr: "Créer un fournisseur d'identité OIDC IAM pour https://ci.example.com avec l'audience des pipelines comme ID client."
    - id: b
      text:
        en: "Add the thumbprint of the new CI server's TLS certificate to the existing provider for https://ci-old.example.com."
        fr: "Ajouter l'empreinte du certificat TLS du nouveau serveur CI au fournisseur existant de https://ci-old.example.com."
    - id: c
      text:
        en: "Change the federated principal of the Deployer trust policy to the ARN of the provider for ci.example.com."
        fr: "Remplacer le principal fédéré de la politique d'approbation de Deployer par l'ARN du fournisseur de ci.example.com."
    - id: d
      text:
        en: "Rename the condition keys of the Deployer trust policy to ci.example.com:aud and ci.example.com:sub."
        fr: "Renommer les clés de condition de la politique d'approbation de Deployer en ci.example.com:aud et ci.example.com:sub."
    - id: e
      text:
        en: "Raise the maximum session duration of the Deployer role, and set DurationSeconds in the pipelines' requests."
        fr: "Augmenter la durée de session maximale du rôle Deployer, et définir DurationSeconds dans les requêtes des pipelines."
    - id: f
      text:
        en: "Add sts:TagSession to the Deployer trust policy so that the claims of the new issuer can be passed."
        fr: "Ajouter sts:TagSession à la politique d'approbation de Deployer pour que les revendications du nouvel émetteur puissent être transmises."
answer: { optionIds: [a, c, d] }
explanation:
  correct:
    en: "AWS STS validates a web identity token against the IAM OIDC provider whose URL matches the token's issuer, so the new issuer needs its own provider with the audience in its client ID list. The trust policy must then name that provider as the federated principal, and its condition keys are prefixed with the provider URL, so they must use ci.example.com instead of ci-old.example.com."
    fr: "AWS STS valide un jeton d'identité web auprès du fournisseur OIDC IAM dont l'URL correspond à l'émetteur du jeton : le nouvel émetteur a donc besoin de son propre fournisseur, avec l'audience dans sa liste d'ID clients. La politique d'approbation doit ensuite désigner ce fournisseur comme principal fédéré, et ses clés de condition sont préfixées par l'URL du fournisseur : elles doivent utiliser ci.example.com au lieu de ci-old.example.com."
  options:
    b:
      en: "A provider is tied to its issuer URL; a thumbprint on the old provider does not let it accept tokens from a different issuer."
      fr: "Un fournisseur est lié à l'URL de son émetteur ; une empreinte sur l'ancien fournisseur ne lui fait pas accepter les jetons d'un autre émetteur."
    e:
      en: "Session duration has nothing to do with token validation; a duration error reports that DurationSeconds exceeds the role's maximum."
      fr: "La durée de session n'a rien à voir avec la validation du jeton ; une erreur de durée indique que DurationSeconds dépasse le maximum du rôle."
    f:
      en: "sts:TagSession is needed only when the token passes session tags, and the pipelines' tokens did not change their claims."
      fr: "sts:TagSession n'est nécessaire que lorsque le jeton transmet des balises de session, et les revendications des jetons des pipelines n'ont pas changé."
references:
  - title: Create an OpenID Connect (OIDC) identity provider in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html
  - title: AssumeRoleWithWebIdentity
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRoleWithWebIdentity.html
