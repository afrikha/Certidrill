id: scsc03-4a-assume-root-endpoint
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany enabled centralized root access for the member accounts of its organization. A security engineer in the management account uses an IAM role that is allowed to call sts:AssumeRoot. The engineer runs a script to delete a misconfigured bucket policy that denies all principals in a member account. The script calls AssumeRoot through https://sts.amazonaws.com with the S3UnlockBucketPolicy task policy, and the call fails.

    What should the engineer do to resolve the issue?
  fr: |
    AnyCompany a activé l'accès racine centralisé pour les comptes membres de son organisation. Un ingénieur sécurité du compte de gestion utilise un rôle IAM autorisé à appeler sts:AssumeRoot. L'ingénieur exécute un script pour supprimer, dans un compte membre, une politique de compartiment mal configurée qui refuse tous les principaux. Le script appelle AssumeRoot par https://sts.amazonaws.com avec la politique de tâche S3UnlockBucketPolicy, et l'appel échoue.

    Que doit faire l'ingénieur pour résoudre le problème ?
body:
  options:
    - id: a
      text:
        en: "Sign in with the root user of the management account, and run the script with root user access keys."
        fr: "Se connecter avec l'utilisateur racine du compte de gestion, et exécuter le script avec des clés d'accès de l'utilisateur racine."
    - id: b
      text:
        en: "Use the IAMDeleteRootUserCredentials task policy instead, because it includes permission to delete bucket policies."
        fr: "Utiliser plutôt la politique de tâche IAMDeleteRootUserCredentials, car elle inclut l'autorisation de supprimer des politiques de compartiment."
    - id: c
      text:
        en: "Send the AssumeRoot request to a Regional AWS STS endpoint, such as https://sts.us-east-1.amazonaws.com."
        fr: "Envoyer la requête AssumeRoot à un point de terminaison régional d'AWS STS, comme https://sts.us-east-1.amazonaws.com."
    - id: d
      text:
        en: "Add the member account's root user ARN to the bucket policy before the script calls AssumeRoot."
        fr: "Ajouter l'ARN de l'utilisateur racine du compte membre à la politique de compartiment avant que le script appelle AssumeRoot."
answer: { optionId: c }
explanation:
  correct:
    en: "AssumeRoot requests must be sent to a Regional AWS STS endpoint; the global endpoint is not supported. The short-term root credentials that the call returns are scoped by the S3UnlockBucketPolicy task policy, which allows deleting the bucket policy in the member account."
    fr: "Les requêtes AssumeRoot doivent être envoyées à un point de terminaison régional d'AWS STS ; le point de terminaison global n'est pas pris en charge. Les informations d'identification racine de courte durée renvoyées sont limitées par la politique de tâche S3UnlockBucketPolicy, qui permet de supprimer la politique de compartiment dans le compte membre."
  options:
    a:
      en: "Root user credentials cannot be used to call sts:AssumeRoot."
      fr: "Les informations d'identification de l'utilisateur racine ne peuvent pas servir à appeler sts:AssumeRoot."
    b:
      en: "IAMDeleteRootUserCredentials deletes root user credentials; deleting a bucket policy that denies all principals uses S3UnlockBucketPolicy."
      fr: "IAMDeleteRootUserCredentials supprime les informations d'identification racine ; la suppression d'une politique de compartiment qui refuse tous les principaux utilise S3UnlockBucketPolicy."
    d:
      en: "The bucket policy denies every principal and cannot be edited until a privileged root session deletes it."
      fr: "La politique de compartiment refuse tous les principaux et ne peut pas être modifiée tant qu'une session racine privilégiée ne l'a pas supprimée."
references:
  - title: Perform a privileged task on an AWS Organizations member account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user-privileged-task.html
