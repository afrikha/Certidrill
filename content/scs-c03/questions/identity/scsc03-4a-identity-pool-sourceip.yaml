id: scsc03-4a-identity-pool-sourceip
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's mobile app obtains AWS credentials from an Amazon Cognito identity pool that uses the enhanced authentication flow. To limit risk during a pilot, an engineer added a condition to the trust policy of the authenticated role that requires aws:SourceIp to be in the corporate network ranges, where employees test the app. Since the change, GetCredentialsForIdentity fails for every user, including employees on the corporate network. The company wants to keep the enhanced flow and keep the role limited to the identity pool's authenticated users.

    Which solution will meet these requirements?
  fr: |
    L'application mobile d'AnyCompany obtient des informations d'identification AWS d'un groupe d'identités Amazon Cognito qui utilise le flux d'authentification amélioré. Pour limiter les risques pendant un pilote, un ingénieur a ajouté à la politique d'approbation du rôle authentifié une condition qui exige que aws:SourceIp appartienne aux plages du réseau de l'entreprise, où les employés testent l'application. Depuis, GetCredentialsForIdentity échoue pour tous les utilisateurs, y compris les employés sur le réseau de l'entreprise. L'entreprise veut conserver le flux amélioré et garder le rôle limité aux utilisateurs authentifiés du groupe d'identités.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Switch the app to the basic (classic) flow, and keep the aws:SourceIp condition in the trust policy of the authenticated role."
        fr: "Passer l'application au flux de base (classique), et conserver la condition aws:SourceIp dans la politique d'approbation du rôle authentifié."
    - id: b
      text:
        en: "Remove the aws:SourceIp condition, and keep the cognito-identity.amazonaws.com:aud and amr conditions in the trust policy."
        fr: "Supprimer la condition aws:SourceIp, et conserver les conditions cognito-identity.amazonaws.com:aud et amr dans la politique d'approbation."
    - id: c
      text:
        en: "Replace the aws:SourceIp condition with an aws:SourceVpc condition set to the VPC that hosts the app's back end."
        fr: "Remplacer la condition aws:SourceIp par une condition aws:SourceVpc définie sur le VPC qui héberge le backend de l'application."
    - id: d
      text:
        en: "Add the published IP address ranges of Amazon Cognito to the aws:SourceIp condition of the trust policy."
        fr: "Ajouter les plages d'adresses IP publiées d'Amazon Cognito à la condition aws:SourceIp de la politique d'approbation."
answer: { optionId: b }
explanation:
  correct:
    en: "In the enhanced flow, Amazon Cognito requests the credentials from AWS STS on the app's behalf, so the source IP of the request never matches the user's device and an aws:SourceIp condition is never met. The aud condition (the identity pool ID) and the amr condition (authenticated) keep the role limited to the pool's signed-in users."
    fr: "Dans le flux amélioré, Amazon Cognito demande les informations d'identification à AWS STS pour le compte de l'application : l'adresse IP source de la requête ne correspond jamais à l'appareil de l'utilisateur et une condition aws:SourceIp n'est jamais satisfaite. La condition aud (ID du groupe d'identités) et la condition amr (authenticated) maintiennent le rôle limité aux utilisateurs connectés du groupe."
  options:
    a:
      en: "The company wants to keep the enhanced flow, and AWS recommends not activating the basic flow for new identity pools."
      fr: "L'entreprise veut conserver le flux amélioré, et AWS recommande de ne pas activer le flux de base pour les nouveaux groupes d'identités."
    c:
      en: "Requests that Amazon Cognito makes on the app's behalf do not come from the company's VPC, so the condition would still never be met."
      fr: "Les requêtes qu'Amazon Cognito fait pour le compte de l'application ne proviennent pas du VPC de l'entreprise : la condition ne serait toujours jamais satisfaite."
    d:
      en: "Allowing the addresses of the service would match every caller of Amazon Cognito, so the condition would add no protection."
      fr: "Autoriser les adresses du service correspondrait à tous les appelants d'Amazon Cognito : la condition n'apporterait aucune protection."
references:
  - title: IAM roles
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/iam-roles.html
  - title: Identity pools authentication flow
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html
