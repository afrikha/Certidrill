id: scsc03-4b-s3-bucket-abac-steps
objective: "4.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has hundreds of Amazon S3 general purpose buckets. A tagging automation applies a team tag to each bucket with the PutBucketTagging API. The security team wrote role policies that allow access to buckets and their objects when aws:ResourceTag/team equals ${aws:PrincipalTag/team}. In testing, the condition never matches, although the buckets have the expected tags. The tagging automation must keep working.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany possède des centaines de compartiments Amazon S3 à usage général. Une automatisation de balisage applique une balise team à chaque compartiment avec l'API PutBucketTagging. L'équipe de sécurité a écrit des politiques de rôle qui autorisent l'accès aux compartiments et à leurs objets lorsque aws:ResourceTag/team est égal à ${aws:PrincipalTag/team}. Lors des tests, la condition ne correspond jamais, bien que les compartiments portent les balises attendues. L'automatisation de balisage doit continuer de fonctionner.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Replace aws:ResourceTag/team with s3:ExistingObjectTag/team in the role policies.
        fr: |-
          Remplacer aws:ResourceTag/team par s3:ExistingObjectTag/team dans les politiques de rôle.
    - id: b
      text:
        en: |-
          Enable ABAC on each bucket with the PutBucketAbac API.
        fr: |-
          Activer ABAC sur chaque compartiment avec l'API PutBucketAbac.
    - id: c
      text:
        en: |-
          Set S3 Object Ownership to Bucket owner enforced on each bucket.
        fr: |-
          Définir S3 Object Ownership sur Bucket owner enforced pour chaque compartiment.
    - id: d
      text:
        en: |-
          Grant the tagging automation s3:PutBucketTagging on all buckets so that it can retag them after the change.
        fr: |-
          Accorder à l'automatisation de balisage s3:PutBucketTagging sur tous les compartiments pour qu'elle puisse les rebaliser après le changement.
    - id: e
      text:
        en: |-
          Change the tagging automation to use the TagResource and UntagResource APIs.
        fr: |-
          Modifier l'automatisation de balisage pour qu'elle utilise les API TagResource et UntagResource.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      ABAC is disabled by default on general purpose buckets, and S3 evaluates aws:ResourceTag on a bucket only after ABAC is enabled with PutBucketAbac. Once ABAC is enabled, PutBucketTagging and DeleteBucketTagging stop working for the bucket, so the automation must switch to TagResource and UntagResource.
    fr: |-
      ABAC est désactivé par défaut sur les compartiments à usage général, et S3 n'évalue aws:ResourceTag sur un compartiment qu'une fois ABAC activé avec PutBucketAbac. Une fois ABAC activé, PutBucketTagging et DeleteBucketTagging ne fonctionnent plus pour le compartiment : l'automatisation doit passer à TagResource et UntagResource.
  options:
    a:
      en: |-
        s3:ExistingObjectTag reads tags on objects, not the team tag applied to buckets.
      fr: |-
        s3:ExistingObjectTag lit les balises des objets, pas la balise team appliquée aux compartiments.
    c:
      en: |-
        Object Ownership controls ACLs and object ownership; it has no effect on the evaluation of tag-based conditions.
      fr: |-
        Object Ownership contrôle les ACL et la propriété des objets ; il n'a aucun effet sur l'évaluation des conditions fondées sur les balises.
    d:
      en: |-
        After ABAC is enabled, PutBucketTagging no longer works on the bucket, so the permission would not keep the automation working.
      fr: |-
        Une fois ABAC activé, PutBucketTagging ne fonctionne plus sur le compartiment : cette autorisation ne maintiendrait pas le fonctionnement de l'automatisation.
references:
  - title: Enabling ABAC in general purpose buckets - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/buckets-tagging-enable-abac.html
  - title: Using tags with S3 general purpose buckets - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/buckets-tagging.html
