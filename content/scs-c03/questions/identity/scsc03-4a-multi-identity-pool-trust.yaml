id: scsc03-4a-multi-identity-pool-trust
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is creating the authenticated IAM role of an Amazon Cognito identity pool whose ID is us-east-1:1a2b3c4d-5678-90ab-cdef-EXAMPLE11111. The identity pool uses the enhanced authentication flow. The role's trust policy allows sts:AssumeRoleWithWebIdentity for the federated principal cognito-identity.amazonaws.com. The role must be usable only through this identity pool and only by users who have signed in.

    Which conditions should the company add to the trust policy? (Choose two.)
  fr: |
    AnyCompany crée le rôle IAM authentifié d'un groupe d'identités Amazon Cognito dont l'ID est us-east-1:1a2b3c4d-5678-90ab-cdef-EXAMPLE11111. Le groupe d'identités utilise le flux d'authentification amélioré. La politique d'approbation du rôle autorise sts:AssumeRoleWithWebIdentity pour le principal fédéré cognito-identity.amazonaws.com. Le rôle ne doit être utilisable que par ce groupe d'identités et uniquement par des utilisateurs connectés.

    Quelles conditions l'entreprise doit-elle ajouter à la politique d'approbation ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "StringEquals on cognito-identity.amazonaws.com:aud with the identity pool ID."
        fr: "StringEquals sur cognito-identity.amazonaws.com:aud avec l'ID du groupe d'identités."
    - id: b
      text:
        en: "IpAddress on aws:SourceIp with the public IP ranges of the mobile carriers that customers use."
        fr: "IpAddress sur aws:SourceIp avec les plages d'adresses IP publiques des opérateurs mobiles des clients."
    - id: c
      text:
        en: "StringEquals on cognito-identity.amazonaws.com:sub with the sub claim of each user in the user pool."
        fr: "StringEquals sur cognito-identity.amazonaws.com:sub avec la revendication sub de chaque utilisateur du groupe d'utilisateurs."
    - id: d
      text:
        en: "ForAnyValue:StringLike on cognito-identity.amazonaws.com:amr with the value authenticated."
        fr: "ForAnyValue:StringLike sur cognito-identity.amazonaws.com:amr avec la valeur authenticated."
    - id: e
      text:
        en: "StringEquals on aws:PrincipalOrgID with the ID of the company's organization in AWS Organizations."
        fr: "StringEquals sur aws:PrincipalOrgID avec l'ID de l'organisation de l'entreprise dans AWS Organizations."
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: "The aud condition restricts the role to the identity pool whose ID it lists; IAM requires an aud condition when the principal is cognito-identity.amazonaws.com. The amr condition requires the multivalued amr claim to contain authenticated, which excludes guest identities."
    fr: "La condition aud limite le rôle au groupe d'identités dont elle indique l'ID ; IAM exige une condition aud lorsque le principal est cognito-identity.amazonaws.com. La condition amr exige que la revendication multivaluée amr contienne authenticated, ce qui exclut les identités invitées."
  options:
    b:
      en: "In the enhanced flow, Amazon Cognito calls AWS STS on the app's behalf, so the source IP never matches the device and the condition would block every user."
      fr: "Dans le flux amélioré, Amazon Cognito appelle AWS STS pour le compte de l'application : l'adresse IP source ne correspond jamais à l'appareil et la condition bloquerait tous les utilisateurs."
    c:
      en: "cognito-identity.amazonaws.com:sub holds the identity ID from the identity pool, not the user pool's sub, and listing every user would not scale."
      fr: "cognito-identity.amazonaws.com:sub contient l'ID d'identité du groupe d'identités, pas le sub du groupe d'utilisateurs, et lister chaque utilisateur ne passerait pas à l'échelle."
    e:
      en: "App users are not principals of an AWS account in the organization, so this condition would never match."
      fr: "Les utilisateurs de l'application ne sont pas des principaux d'un compte AWS de l'organisation : cette condition ne serait jamais satisfaite."
references:
  - title: Using role-based access control
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/role-based-access-control.html
  - title: IAM roles
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/iam-roles.html
