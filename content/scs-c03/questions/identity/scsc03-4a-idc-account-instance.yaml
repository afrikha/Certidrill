id: scsc03-4a-idc-account-instance
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A platform team at AnyCompany enabled an account instance of IAM Identity Center in a member account of the company's organization, connected it to the company's IdP, and assigned an OIDC customer managed application to users. The team now needs to give 300 engineers single sign-on access to 25 accounts of the organization, with permission sets that define what each group can do in each account. The security team wants to minimize the number of Identity Center deployments to manage.

    Which solution will meet these requirements?
  fr: |
    Une équipe plateforme d'AnyCompany a activé une instance de compte d'IAM Identity Center dans un compte membre de l'organisation, l'a connectée à l'IdP de l'entreprise et a attribué une application OIDC gérée par le client à des utilisateurs. L'équipe doit maintenant donner à 300 ingénieurs un accès par authentification unique à 25 comptes de l'organisation, avec des ensembles d'autorisations qui définissent ce que chaque groupe peut faire dans chaque compte. L'équipe de sécurité veut réduire au minimum le nombre de déploiements d'Identity Center à gérer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Register the member account as the delegated administrator for IAM Identity Center, and create the permission sets in its existing account instance."
        fr: "Enregistrer le compte membre comme administrateur délégué d'IAM Identity Center, et créer les ensembles d'autorisations dans son instance de compte existante."
    - id: b
      text:
        en: "Enable an account instance in each of the 25 accounts, connect each instance to the IdP, and create the required permission sets in each instance."
        fr: "Activer une instance de compte dans chacun des 25 comptes, connecter chaque instance à l'IdP, et créer les ensembles d'autorisations nécessaires dans chaque instance."
    - id: c
      text:
        en: "In the existing account instance, create a SAML 2.0 customer managed application for each of the 25 accounts, and assign the engineers' groups to them."
        fr: "Dans l'instance de compte existante, créer une application SAML 2.0 gérée par le client pour chacun des 25 comptes, et y attribuer les groupes des ingénieurs."
    - id: d
      text:
        en: "Enable an organization instance of IAM Identity Center from the management account, connect it to the IdP, and assign groups to the 25 accounts with permission sets."
        fr: "Activer une instance d'organisation d'IAM Identity Center depuis le compte de gestion, la connecter à l'IdP, et attribuer des groupes aux 25 comptes avec des ensembles d'autorisations."
answer: { optionId: d }
explanation:
  correct:
    en: "Only an organization instance, enabled from the management account, supports multi-account permissions and single sign-on to AWS accounts through the access portal. Account instances are bound to one account and Region and cannot assign access to AWS accounts. AWS recommends an organization instance to minimize management points; a delegated administrator can then manage it from a member account."
    fr: "Seule une instance d'organisation, activée depuis le compte de gestion, prend en charge les autorisations multicomptes et l'authentification unique vers les comptes AWS par le portail d'accès. Les instances de compte sont liées à un compte et une Région et ne peuvent pas attribuer d'accès aux comptes AWS. AWS recommande une instance d'organisation pour réduire le nombre de points de gestion ; un administrateur délégué peut ensuite la gérer depuis un compte membre."
  options:
    a:
      en: "Delegated administration applies to the organization instance; it does not turn an account instance into a multi-account instance."
      fr: "L'administration déléguée s'applique à l'instance d'organisation ; elle ne transforme pas une instance de compte en instance multicompte."
    b:
      en: "Account instances do not support access to AWS accounts at all, and 25 instances would maximize the deployments to manage."
      fr: "Les instances de compte ne prennent pas du tout en charge l'accès aux comptes AWS, et 25 instances maximiseraient le nombre de déploiements à gérer."
    c:
      en: "Account instances do not support SAML 2.0 customer managed applications, and applications do not give permission-set-based access to AWS accounts."
      fr: "Les instances de compte ne prennent pas en charge les applications SAML 2.0 gérées par le client, et les applications ne donnent pas d'accès aux comptes AWS fondé sur des ensembles d'autorisations."
references:
  - title: Organization and account instances of IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/identity-center-instances.html
