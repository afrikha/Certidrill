id: scsc03-4a-root-central-access
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 120 member accounts in AWS Organizations with all features enabled. Each member account still has a root user password, and some accounts also have root user access keys. The security team wants member accounts to have no root user credentials, including accounts that will be created in the future. The team must keep the ability to perform the few tasks that require root access in a member account, such as deleting a bucket policy that denies all principals.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany possède 120 comptes membres dans AWS Organizations avec toutes les fonctionnalités activées. Chaque compte membre a encore un mot de passe d'utilisateur racine, et certains comptes ont aussi des clés d'accès d'utilisateur racine. L'équipe de sécurité veut que les comptes membres n'aient aucune information d'identification d'utilisateur racine, y compris les comptes qui seront créés à l'avenir. L'équipe doit conserver la possibilité d'effectuer les quelques tâches qui exigent l'accès racine dans un compte membre, comme supprimer une politique de compartiment qui refuse tous les principaux.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Store each root user password in AWS Secrets Manager, register a hardware MFA device for each root user, and rotate the passwords every 90 days."
        fr: "Stocker chaque mot de passe d'utilisateur racine dans AWS Secrets Manager, enregistrer un dispositif MFA matériel pour chaque utilisateur racine, et changer les mots de passe tous les 90 jours."
    - id: b
      text:
        en: "Attach an SCP to the organization root that denies all actions when aws:PrincipalArn matches the root user ARN of any member account in the organization."
        fr: "Attacher à la racine de l'organisation une SCP qui refuse toutes les actions lorsque aws:PrincipalArn correspond à l'ARN de l'utilisateur racine de n'importe quel compte membre de l'organisation."
    - id: c
      text:
        en: "Deploy an AWS Config rule that detects root user access keys, and run an SSM Automation runbook that emails the account owners to delete them."
        fr: "Déployer une règle AWS Config qui détecte les clés d'accès d'utilisateur racine, et exécuter un runbook SSM Automation qui demande par e-mail aux propriétaires des comptes de les supprimer."
    - id: d
      text:
        en: "Enable centralized root access for member accounts in IAM, delete the existing root credentials, and run privileged root tasks from the management account when needed."
        fr: "Activer l'accès racine centralisé pour les comptes membres dans IAM, supprimer les informations d'identification racine existantes, et exécuter les tâches racine privilégiées depuis le compte de gestion si nécessaire."
answer: { optionId: d }
explanation:
  correct:
    en: "With centralized root access, the management account or a delegated administrator for IAM can delete the root password, access keys, signing certificates and MFA devices of member accounts, and new accounts created in Organizations have no root credentials by default. Root-only tasks, such as deleting a bucket policy that denies all principals, are run as privileged tasks with short-term root sessions."
    fr: "Avec l'accès racine centralisé, le compte de gestion ou un administrateur délégué pour IAM peut supprimer le mot de passe, les clés d'accès, les certificats de signature et les dispositifs MFA racine des comptes membres, et les nouveaux comptes créés dans Organizations n'ont par défaut aucune information d'identification racine. Les tâches réservées à la racine, comme supprimer une politique de compartiment qui refuse tous les principaux, s'exécutent comme tâches privilégiées avec des sessions racine de courte durée."
  options:
    a:
      en: "The root credentials would still exist, and storing and rotating 120 passwords adds operational overhead."
      fr: "Les informations d'identification racine existeraient toujours, et stocker et changer 120 mots de passe ajoute de la charge opérationnelle."
    b:
      en: "An SCP limits what the root user can do but does not remove its credentials, and it would also block the root-only tasks that the team must keep."
      fr: "Une SCP limite ce que l'utilisateur racine peut faire mais ne supprime pas ses informations d'identification, et elle bloquerait aussi les tâches réservées à la racine que l'équipe doit conserver."
    c:
      en: "Detection and email notifications leave the credentials in place and rely on manual cleanup in each account."
      fr: "La détection et les notifications par e-mail laissent les informations d'identification en place et reposent sur un nettoyage manuel dans chaque compte."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
  - title: Perform a privileged task on an AWS Organizations member account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user-privileged-task.html
