id: scsc03-4a-identity-pool-guest
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's public website must send anonymous usage events from visitors' browsers directly to an Amazon Data Firehose stream. Visitors do not sign in. The security team prohibits AWS credentials in the website code and requires least-privilege access.

    Which solution will meet these requirements?
  fr: |
    Le site web public d'AnyCompany doit envoyer des événements d'utilisation anonymes directement depuis les navigateurs des visiteurs vers un flux Amazon Data Firehose. Les visiteurs ne se connectent pas. L'équipe de sécurité interdit toute information d'identification AWS dans le code du site et exige un accès selon le moindre privilège.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon Cognito identity pool with guest access, and allow its unauthenticated role to call firehose:PutRecord on the stream only."
        fr: "Créer un groupe d'identités Amazon Cognito avec accès invité, et autoriser son rôle non authentifié à appeler firehose:PutRecord uniquement sur le flux."
    - id: b
      text:
        en: "Create an IAM user that can call firehose:PutRecord on the stream, and embed its access keys in the website's JavaScript code."
        fr: "Créer un utilisateur IAM autorisé à appeler firehose:PutRecord sur le flux, et intégrer ses clés d'accès dans le code JavaScript du site."
    - id: c
      text:
        en: "Enable IAM Identity Center, and create a shared user for visitors with a permission set that allows firehose:PutRecord on the stream."
        fr: "Activer IAM Identity Center, et créer pour les visiteurs un utilisateur partagé avec un ensemble d'autorisations qui autorise firehose:PutRecord sur le flux."
    - id: d
      text:
        en: "Create an Amazon Cognito identity pool with guest access, and allow its unauthenticated role to perform all firehose actions on all resources."
        fr: "Créer un groupe d'identités Amazon Cognito avec accès invité, et autoriser son rôle non authentifié à effectuer toutes les actions firehose sur toutes les ressources."
answer: { optionId: a }
explanation:
  correct:
    en: "An identity pool with guest access issues temporary credentials for its unauthenticated role to visitors who do not sign in, so no credentials are embedded in the website. Granting only firehose:PutRecord on the one stream follows least privilege, as AWS recommends keeping unauthenticated permissions more restrictive than authenticated ones."
    fr: "Un groupe d'identités avec accès invité émet, pour son rôle non authentifié, des informations d'identification temporaires aux visiteurs qui ne se connectent pas : aucune information d'identification n'est intégrée au site. N'accorder que firehose:PutRecord sur le seul flux respecte le moindre privilège, AWS recommandant des autorisations non authentifiées plus restrictives que les autorisations authentifiées."
  options:
    b:
      en: "Embedding access keys in browser code exposes long-term credentials to every visitor."
      fr: "Intégrer des clés d'accès dans le code du navigateur expose des informations d'identification à long terme à chaque visiteur."
    c:
      en: "IAM Identity Center is for workforce sign-in; a shared user would need credentials in the website and does not fit anonymous visitors."
      fr: "IAM Identity Center sert à la connexion du personnel ; un utilisateur partagé exigerait des informations d'identification dans le site et ne convient pas à des visiteurs anonymes."
    d:
      en: "Allowing every Firehose action on every resource gives guests far more than the single write they need."
      fr: "Autoriser toutes les actions Firehose sur toutes les ressources donne aux invités bien plus que la seule écriture dont ils ont besoin."
references:
  - title: IAM roles
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/iam-roles.html
