id: scsc03-4b-xacct-copy-resource-policy
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function in account 111122223333 runs under the execution role CopyFn. In each invocation, the function must read objects from the bucket source-b in account 444455556666 and write them to the bucket archive-a in account 111122223333, using one set of credentials for both calls. A security rule in account 111122223333 forbids bucket policies on its buckets that grant access to principals in other accounts. The solution must follow the principle of least privilege.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda du compte 111122223333 s'exécute sous le rôle d'exécution CopyFn. À chaque appel, la fonction doit lire des objets du compartiment source-b du compte 444455556666 et les écrire dans le compartiment archive-a du compte 111122223333, avec un seul jeu d'informations d'identification pour les deux appels. Une règle de sécurité du compte 111122223333 interdit, sur ses compartiments, les politiques de compartiment qui accordent l'accès à des principaux d'autres comptes. La solution doit respecter le principe du moindre privilège.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a role in account 444455556666 that can read source-b and that trusts CopyFn, and have the function assume this role for both the read and the write.
        fr: |-
          Créer dans le compte 444455556666 un rôle qui peut lire source-b et qui approuve CopyFn, et faire endosser ce rôle par la fonction pour la lecture et pour l'écriture.
    - id: b
      text:
        en: |-
          Add a statement to the bucket policy of source-b that allows s3:GetObject to the CopyFn role ARN, and allow s3:GetObject on source-b and s3:PutObject on archive-a in the policy of CopyFn.
        fr: |-
          Ajouter à la politique de compartiment de source-b une instruction qui autorise s3:GetObject au rôle CopyFn (par son ARN), et autoriser s3:GetObject sur source-b et s3:PutObject sur archive-a dans la politique de CopyFn.
    - id: c
      text:
        en: |-
          Add a statement to the bucket policy of source-b that allows s3:GetObject to the principal 111122223333, and allow only s3:PutObject on archive-a in the policy of CopyFn.
        fr: |-
          Ajouter à la politique de compartiment de source-b une instruction qui autorise s3:GetObject au principal 111122223333, et autoriser uniquement s3:PutObject sur archive-a dans la politique de CopyFn.
    - id: d
      text:
        en: |-
          Configure S3 Replication on source-b with a replication role in account 444455556666 that writes to archive-a, and remove the copy logic from the function.
        fr: |-
          Configurer S3 Replication sur source-b avec un rôle de réplication du compte 444455556666 qui écrit dans archive-a, et supprimer la logique de copie de la fonction.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A resource-based policy lets CopyFn access source-b while keeping its own permissions, so the same credentials can then write to archive-a. Cross-account access is allowed only when both accounts allow it: the bucket policy of source-b names the role, and the role's identity-based policy allows the read in account 444455556666 and the write in its own account.
    fr: |-
      Une politique basée sur les ressources permet à CopyFn d'accéder à source-b tout en conservant ses propres autorisations : les mêmes informations d'identification peuvent ensuite écrire dans archive-a. L'accès entre comptes n'est accordé que si les deux comptes l'autorisent : la politique de source-b nomme le rôle, et la politique basée sur l'identité du rôle autorise la lecture dans le compte 444455556666 et l'écriture dans son propre compte.
  options:
    a:
      en: |-
        A principal that assumes a role gives up its own permissions, so the write to archive-a would use the other account's role and need a bucket policy on archive-a that grants another account, which the rule forbids.
      fr: |-
        Un principal qui endosse un rôle renonce à ses propres autorisations : l'écriture dans archive-a utiliserait le rôle de l'autre compte et exigerait sur archive-a une politique accordant l'accès à un autre compte, ce que la règle interdit.
    c:
      en: |-
        The account principal trusts every principal that account 111122223333 allows, which is broader than needed, and CopyFn's own policy must also allow s3:GetObject on source-b for a cross-account read.
      fr: |-
        Le principal de compte fait confiance à tout principal autorisé par le compte 111122223333, ce qui est plus large que nécessaire, et la politique de CopyFn doit aussi autoriser s3:GetObject sur source-b pour une lecture entre comptes.
    d:
      en: |-
        Replication to a bucket in another account requires the destination bucket policy to grant the source account's replication role, which the rule forbids.
      fr: |-
        La réplication vers un compartiment d'un autre compte exige que la politique du compartiment de destination accorde l'accès au rôle de réplication du compte source, ce que la règle interdit.
references:
  - title: Cross-account policy evaluation logic - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html
  - title: IAM roles - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_terms-and-concepts.html
