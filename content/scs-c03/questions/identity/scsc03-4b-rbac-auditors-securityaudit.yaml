id: scsc03-4b-rbac-auditors-securityaudit
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany uses AWS IAM Identity Center for 25 AWS accounts. An external audit firm needs access for three months to review the security configuration of the accounts and to read logs and events. The auditors must not be able to change any resource. The security team wants a role-based solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS IAM Identity Center pour 25 comptes AWS. Un cabinet d'audit externe a besoin d'un accès pendant trois mois pour examiner la configuration de sécurité des comptes et lire les journaux et les événements. Les auditeurs ne doivent pouvoir modifier aucune ressource. L'équipe de sécurité veut une solution basée sur les rôles avec la charge opérationnelle la PLUS FAIBLE.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a permission set with the AdministratorAccess policy, and attach an SCP to the 25 accounts that denies all write actions.
        fr: |-
          Créer un ensemble d'autorisations avec la politique AdministratorAccess, et attacher aux 25 comptes une SCP qui refuse toutes les actions d'écriture.
    - id: b
      text:
        en: |-
          Create a permission set with the PowerUserAccess AWS managed policy, and assign it to the auditors' group in the 25 accounts.
        fr: |-
          Créer un ensemble d'autorisations avec la politique gérée par AWS PowerUserAccess, et l'attribuer au groupe des auditeurs dans les 25 comptes.
    - id: c
      text:
        en: |-
          Tag every resource in the 25 accounts with an audit tag, and create a permission set whose custom policy allows read actions on resources with that tag.
        fr: |-
          Baliser chaque ressource des 25 comptes avec une balise audit, et créer un ensemble d'autorisations dont la politique personnalisée autorise les actions de lecture sur les ressources qui portent cette balise.
    - id: d
      text:
        en: |-
          Create a permission set with the SecurityAudit AWS managed policy for job functions, and assign it to the auditors' group in the 25 accounts.
        fr: |-
          Créer un ensemble d'autorisations avec la politique gérée par AWS pour fonctions professionnelles SecurityAudit, et l'attribuer au groupe des auditeurs dans les 25 comptes.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      SecurityAudit is the AWS managed job function policy for security auditors: it lets them check accounts for compliance with security requirements and access logs and events. A predefined permission set based on it, assigned to a group, is the quickest least-privilege RBAC setup across accounts.
    fr: |-
      SecurityAudit est la politique gérée par AWS pour la fonction d'auditeur de sécurité : elle permet de vérifier la conformité des comptes aux exigences de sécurité et d'accéder aux journaux et aux événements. Un ensemble d'autorisations prédéfini fondé sur elle, attribué à un groupe, est la configuration RBAC de moindre privilège la plus rapide sur plusieurs comptes.
  options:
    a:
      en: |-
        Granting full administrator access and then denying writes is the opposite of least privilege, and an SCP applies to every principal in the accounts, not only the auditors.
      fr: |-
        Accorder un accès administrateur complet puis refuser les écritures est l'inverse du moindre privilège, et une SCP s'applique à tous les principaux des comptes, pas seulement aux auditeurs.
    b:
      en: |-
        PowerUserAccess is the developer job function policy and allows changes to most resources.
      fr: |-
        PowerUserAccess est la politique de la fonction de développeur et permet de modifier la plupart des ressources.
    c:
      en: |-
        Tagging every resource in 25 accounts and writing a custom policy is far more effort than an AWS managed job function policy for a temporary audit.
      fr: |-
        Baliser chaque ressource de 25 comptes et écrire une politique personnalisée demande bien plus d'effort qu'une politique gérée par AWS pour fonctions professionnelles, pour un audit temporaire.
references:
  - title: AWS managed policies for job functions - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_job-functions.html
  - title: Manage AWS accounts with permission sets - AWS IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html
