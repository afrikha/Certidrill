id: scsc03-4a-cognito-spa-pkce
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is building a single-page web application that runs entirely in the browser and signs users in through an Amazon Cognito user pool with managed login. A developer created the app client with a client secret and plans to embed the secret in the JavaScript bundle. The security team requires that no secret be shipped to browsers, that tokens never appear in the browser's address bar, and that the application receive refresh tokens.

    Which solution will meet these requirements?
  fr: |
    AnyCompany développe une application web monopage qui s'exécute entièrement dans le navigateur et connecte les utilisateurs par un groupe d'utilisateurs Amazon Cognito avec la connexion gérée (managed login). Un développeur a créé le client d'application avec un secret client et prévoit d'intégrer ce secret dans le code JavaScript. L'équipe de sécurité exige qu'aucun secret ne soit livré aux navigateurs, que les jetons n'apparaissent jamais dans la barre d'adresse du navigateur, et que l'application reçoive des jetons d'actualisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Keep the existing app client, delete its client secret, and enable the implicit grant so that the browser receives tokens directly from the authorize endpoint."
        fr: "Conserver le client d'application existant, supprimer son secret client, et activer l'octroi implicite pour que le navigateur reçoive les jetons directement du point de terminaison d'autorisation."
    - id: b
      text:
        en: "Create a new app client without a client secret, enable only the authorization code grant, and implement Proof Key for Code Exchange (PKCE) in the application."
        fr: "Créer un nouveau client d'application sans secret client, activer uniquement l'octroi de code d'autorisation, et mettre en œuvre PKCE (Proof Key for Code Exchange) dans l'application."
    - id: c
      text:
        en: "Keep the existing app client and its secret, store the secret in AWS Secrets Manager, and have the browser retrieve it at runtime with guest identity pool credentials."
        fr: "Conserver le client d'application existant et son secret, stocker le secret dans AWS Secrets Manager, et faire récupérer le secret par le navigateur à l'exécution avec des informations d'identification invité d'un groupe d'identités."
    - id: d
      text:
        en: "Create a new app client without a client secret, enable the client credentials grant, and request custom scopes from the token endpoint at sign-in."
        fr: "Créer un nouveau client d'application sans secret client, activer l'octroi d'informations d'identification client, et demander des portées personnalisées au point de terminaison de jeton à la connexion."
answer: { optionId: b }
explanation:
  correct:
    en: "A browser application is a public client and must not hold a client secret. Whether an app client has a secret cannot be changed after the client is created, so a new app client is needed. AWS recommends that public clients use only the authorization code grant with PKCE, which returns refresh tokens and keeps tokens out of the browser session."
    fr: "Une application de navigateur est un client public et ne doit pas détenir de secret client. La présence d'un secret ne peut pas être modifiée après la création d'un client d'application : il faut donc un nouveau client. AWS recommande que les clients publics n'utilisent que l'octroi de code d'autorisation avec PKCE, qui renvoie des jetons d'actualisation et tient les jetons hors de la session du navigateur."
  options:
    a:
      en: "The secret cannot be removed from an existing app client, and the implicit grant delivers tokens to the browser session, does not support PKCE and returns no refresh token."
      fr: "Le secret ne peut pas être retiré d'un client d'application existant, et l'octroi implicite livre les jetons dans la session du navigateur, ne prend pas en charge PKCE et ne renvoie pas de jeton d'actualisation."
    c:
      en: "Delivering the secret to the browser at runtime still exposes it to every user of the application."
      fr: "Livrer le secret au navigateur à l'exécution l'expose toujours à chaque utilisateur de l'application."
    d:
      en: "The client credentials grant is for machine-to-machine access, requires a client secret and issues no tokens for users."
      fr: "L'octroi d'informations d'identification client est destiné aux échanges de machine à machine, exige un secret client et n'émet aucun jeton pour les utilisateurs."
references:
  - title: Application-specific settings with app clients
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-client-apps.html
