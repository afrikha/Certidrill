id: scsc03-4c-rcp-s3-org-perimeter
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    IAM Access Analyzer external access findings show that bucket policies in many of AnyCompany's 200 member accounts grant access to AWS accounts outside the organization. The security team must make sure, centrally and immediately, that no principal outside the organization can access any Amazon S3 bucket in a member account, whatever the bucket policies say. AWS services such as AWS CloudTrail must still be able to write to the buckets, and application teams must keep managing their own bucket policies.

    Which solution will meet these requirements?
  fr: |
    Les résultats d'accès externe d'IAM Access Analyzer montrent que des politiques de compartiment de nombreux comptes parmi les 200 comptes membres d'AnyCompany accordent l'accès à des comptes AWS extérieurs à l'organisation. L'équipe de sécurité doit garantir, de manière centralisée et immédiate, qu'aucun principal extérieur à l'organisation ne puisse accéder à un compartiment Amazon S3 d'un compte membre, quoi que disent les politiques de compartiment. Les services AWS comme AWS CloudTrail doivent toujours pouvoir écrire dans les compartiments, et les équipes applicatives doivent continuer de gérer leurs propres politiques de compartiment.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a resource control policy (RCP) that denies s3:* when aws:PrincipalOrgID is not the organization ID and aws:PrincipalIsAWSService is false.
        fr: |-
          Attacher une politique de contrôle des ressources (RCP) qui refuse s3:* quand aws:PrincipalOrgID n'est pas l'ID de l'organisation et qu'aws:PrincipalIsAWSService est false.
    - id: b
      text:
        en: |-
          Attach a service control policy (SCP) that denies s3:* when aws:PrincipalOrgID is not the organization ID and aws:PrincipalIsAWSService is false.
        fr: |-
          Attacher une politique de contrôle des services (SCP) qui refuse s3:* quand aws:PrincipalOrgID n'est pas l'ID de l'organisation et qu'aws:PrincipalIsAWSService est false.
    - id: c
      text:
        en: |-
          Turn on all four S3 Block Public Access settings at the account level in every member account through the organization.
        fr: |-
          Activer les quatre paramètres S3 Block Public Access au niveau du compte dans chaque compte membre via l'organisation.
    - id: d
      text:
        en: |-
          Deploy an AWS Config rule with an AWS Lambda remediation that removes external principals from every bucket policy that changes.
        fr: |-
          Déployer une règle AWS Config avec une correction AWS Lambda qui retire les principaux externes de chaque politique de compartiment modifiée.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An RCP sets the maximum permissions for resources in member accounts and applies to every request to those resources, whether the principal belongs to the organization or not. A Deny on s3:* for principals outside the organization overrides any bucket policy Allow, and the aws:PrincipalIsAWSService exception keeps service principal access such as CloudTrail log delivery; with IfExists operators, requests that lack a key are handled safely. Teams still write their bucket policies, but external grants no longer take effect.
    fr: |-
      Une RCP fixe les autorisations maximales des ressources des comptes membres et s'applique à toute requête vers ces ressources, que le principal appartienne ou non à l'organisation. Un Deny sur s3:* pour les principaux extérieurs à l'organisation l'emporte sur toute autorisation d'une politique de compartiment, et l'exception aws:PrincipalIsAWSService préserve l'accès des principaux de service comme la livraison des journaux CloudTrail ; avec les opérateurs IfExists, les requêtes sans la clé sont traitées sans risque. Les équipes rédigent toujours leurs politiques de compartiment, mais les autorisations externes ne prennent plus effet.
  options:
    b:
      en: |-
        SCPs restrict only the principals of the organization's accounts; they do not affect users or roles from accounts outside the organization.
      fr: |-
        Les SCP ne restreignent que les principaux des comptes de l'organisation ; elles n'affectent pas les utilisateurs ou rôles de comptes extérieurs à l'organisation.
    c:
      en: |-
        Block Public Access blocks public access, but a bucket policy that names a specific external account is not public and keeps working.
      fr: |-
        Block Public Access bloque l'accès public, mais une politique de compartiment qui désigne un compte externe précis n'est pas publique et continue de fonctionner.
    d:
      en: |-
        A detective rule acts only after a change and rewrites team policies; external access stays possible until each remediation runs.
      fr: |-
        Une règle de détection n'agit qu'après une modification et réécrit les politiques des équipes ; l'accès externe reste possible jusqu'à l'exécution de chaque correction.
references:
  - title: Resource control policies (RCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
  - title: Service control policies (SCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
