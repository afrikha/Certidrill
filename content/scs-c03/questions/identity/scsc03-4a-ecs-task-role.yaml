id: scsc03-4a-ecs-task-role
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs several Amazon ECS services on a cluster of EC2 container instances, and the tasks use the awsvpc network mode. Each service must authenticate to AWS with its own permissions. A compromised container must not be able to obtain the permissions of the container instance's IAM role.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute plusieurs services Amazon ECS sur un cluster d'instances de conteneur EC2, et les tâches utilisent le mode réseau awsvpc. Chaque service doit s'authentifier auprès d'AWS avec ses propres autorisations. Un conteneur compromis ne doit pas pouvoir obtenir les autorisations du rôle IAM de l'instance de conteneur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add the permissions of all services to the container instance role, and use security groups to restrict which tasks can reach AWS service endpoints."
        fr: "Ajouter les autorisations de tous les services au rôle de l'instance de conteneur, et utiliser des groupes de sécurité pour limiter les tâches qui peuvent atteindre les points de terminaison des services AWS."
    - id: b
      text:
        en: "Give each service a task execution role with the permissions it needs, and require IMDSv2 on the container instances."
        fr: "Donner à chaque service un rôle d'exécution de tâche avec les autorisations dont il a besoin, et exiger IMDSv2 sur les instances de conteneur."
    - id: c
      text:
        en: "Give each service its own task role, and set ECS_AWSVPC_BLOCK_IMDS to true in the ECS agent configuration of the container instances."
        fr: "Donner à chaque service son propre rôle de tâche, et définir ECS_AWSVPC_BLOCK_IMDS sur true dans la configuration de l'agent ECS des instances de conteneur."
    - id: d
      text:
        en: "Store an IAM user access key for each service in AWS Secrets Manager, and inject the key into each container as a secret."
        fr: "Stocker une clé d'accès d'utilisateur IAM pour chaque service dans AWS Secrets Manager, et injecter la clé dans chaque conteneur sous forme de secret."
answer: { optionId: c }
explanation:
  correct:
    en: "A task role gives the application in each task temporary credentials through the ECS credential endpoint, so each service gets its own permissions. In awsvpc mode, setting ECS_AWSVPC_BLOCK_IMDS to true blocks containers from the instance metadata and therefore from the container instance role credentials, while tasks still receive their task role credentials."
    fr: "Un rôle de tâche fournit à l'application de chaque tâche des informations d'identification temporaires par le point de terminaison d'informations d'identification ECS : chaque service obtient ses propres autorisations. En mode awsvpc, définir ECS_AWSVPC_BLOCK_IMDS sur true empêche les conteneurs d'accéder aux métadonnées de l'instance, donc aux informations d'identification du rôle de l'instance de conteneur, tandis que les tâches reçoivent toujours celles de leur rôle de tâche."
  options:
    a:
      en: "All tasks would share the instance role's permissions, and security groups cannot separate IAM permissions between tasks."
      fr: "Toutes les tâches partageraient les autorisations du rôle de l'instance, et les groupes de sécurité ne peuvent pas séparer les autorisations IAM entre tâches."
    b:
      en: "The task execution role is used by the ECS agent to pull images and run the task, not by application code, and IMDSv2 is not the documented control that blocks tasks from the instance role."
      fr: "Le rôle d'exécution de tâche est utilisé par l'agent ECS pour récupérer les images et exécuter la tâche, pas par le code de l'application, et IMDSv2 n'est pas le contrôle documenté qui bloque l'accès des tâches au rôle de l'instance."
    d:
      en: "IAM user access keys are long-term credentials that must be rotated and remain usable if a container is compromised."
      fr: "Les clés d'accès d'utilisateur IAM sont des informations d'identification à long terme qu'il faut faire tourner et qui restent utilisables si un conteneur est compromis."
references:
  - title: Amazon ECS task IAM role
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html
