id: scsc03-4b-abac-tag-on-create
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Developers at AnyCompany use a role whose sessions carry the principal tag project. The role's policy already allows ec2:RunInstances on the subnets, security groups, images, network interfaces, and volumes that launches use. A security engineer must add statements so that developers can launch instances only when the launch request tags the instance with project set to their own project. Developers must not be able to add or change tags on existing resources.

    Which statements should the engineer add?
  fr: |
    Les développeurs d'AnyCompany utilisent un rôle dont les sessions portent la balise de principal project. La politique du rôle autorise déjà ec2:RunInstances sur les sous-réseaux, groupes de sécurité, images, interfaces réseau et volumes utilisés par les lancements. Un ingénieur sécurité doit ajouter des instructions pour que les développeurs ne puissent lancer des instances que si la demande de lancement balise l'instance avec project défini sur leur propre projet. Les développeurs ne doivent pas pouvoir ajouter ni modifier de balises sur des ressources existantes.

    Quelles instructions l'ingénieur doit-il ajouter ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow ec2:RunInstances on instance/* when aws:RequestTag/project equals ${aws:PrincipalTag/project}. Allow ec2:CreateTags on instance/* when ec2:CreateAction equals RunInstances.
        fr: |-
          Autoriser ec2:RunInstances sur instance/* lorsque aws:RequestTag/project est égal à ${aws:PrincipalTag/project}. Autoriser ec2:CreateTags sur instance/* lorsque ec2:CreateAction est égal à RunInstances.
    - id: b
      text:
        en: |-
          Allow ec2:RunInstances on instance/* when aws:RequestTag/project equals ${aws:PrincipalTag/project}. Allow ec2:CreateTags on instance/* with no condition.
        fr: |-
          Autoriser ec2:RunInstances sur instance/* lorsque aws:RequestTag/project est égal à ${aws:PrincipalTag/project}. Autoriser ec2:CreateTags sur instance/* sans condition.
    - id: c
      text:
        en: |-
          Allow ec2:RunInstances on instance/* when aws:RequestTag/project equals ${aws:PrincipalTag/project}. Do not allow ec2:CreateTags on any resource.
        fr: |-
          Autoriser ec2:RunInstances sur instance/* lorsque aws:RequestTag/project est égal à ${aws:PrincipalTag/project}. N'autoriser ec2:CreateTags sur aucune ressource.
    - id: d
      text:
        en: |-
          Allow ec2:RunInstances on instance/* with no condition. Allow ec2:CreateTags on instance/* when ec2:CreateAction equals RunInstances and aws:RequestTag/project equals ${aws:PrincipalTag/project}.
        fr: |-
          Autoriser ec2:RunInstances sur instance/* sans condition. Autoriser ec2:CreateTags sur instance/* lorsque ec2:CreateAction est égal à RunInstances et aws:RequestTag/project est égal à ${aws:PrincipalTag/project}.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The aws:RequestTag condition on ec2:RunInstances makes the launch fail unless the request sets project to the caller's value. When a request includes tags, EC2 also authorizes ec2:CreateTags, and the ec2:CreateAction condition limits that permission to tagging during RunInstances, so existing resources cannot be retagged.
    fr: |-
      La condition aws:RequestTag sur ec2:RunInstances fait échouer le lancement si la demande ne définit pas project sur la valeur de l'appelant. Lorsqu'une demande contient des balises, EC2 autorise aussi ec2:CreateTags, et la condition ec2:CreateAction limite cette autorisation au balisage pendant RunInstances : les ressources existantes ne peuvent pas être rebalisées.
  options:
    b:
      en: |-
        Without the ec2:CreateAction condition, developers can call CreateTags on any existing instance and change its project tag.
      fr: |-
        Sans la condition ec2:CreateAction, les développeurs peuvent appeler CreateTags sur n'importe quelle instance existante et modifier sa balise project.
    c:
      en: |-
        A launch request that specifies tags also needs permission for ec2:CreateTags, so every compliant launch would fail.
      fr: |-
        Une demande de lancement qui précise des balises exige aussi l'autorisation ec2:CreateTags : tous les lancements conformes échoueraient.
    d:
      en: |-
        ec2:CreateTags is evaluated only when the request contains tags, so developers could launch untagged instances, which the unconditional RunInstances statement allows.
      fr: |-
        ec2:CreateTags n'est évalué que si la demande contient des balises : les développeurs pourraient lancer des instances non balisées, ce que permet l'instruction RunInstances sans condition.
references:
  - title: Grant permission to tag Amazon EC2 resources during creation - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/supported-iam-actions-tagging.html
