id: scsc03-4a-idc-failed-mfa-events
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses the Identity Center directory as the identity source of IAM Identity Center, and MFA is required for every user. A user reports that someone tried to sign in to the user's account several times during the night. The security team must determine from AWS CloudTrail whether the attacker supplied the correct password and then failed the MFA challenge.

    Which approach will meet these requirements?
  fr: |
    AnyCompany utilise le répertoire Identity Center comme source d'identité d'IAM Identity Center, et la MFA est exigée pour chaque utilisateur. Un utilisateur signale que quelqu'un a tenté plusieurs fois de se connecter à son compte pendant la nuit. L'équipe de sécurité doit déterminer à partir d'AWS CloudTrail si l'attaquant a fourni le bon mot de passe puis échoué au défi MFA.

    Quelle approche répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Correlate the user's CredentialVerification events by AuthWorkflowID, and look for a passed PASSWORD check, a failed TOTP or WEBAUTHN check and no UserAuthentication event."
        fr: "Corréler les événements CredentialVerification de l'utilisateur par AuthWorkflowID, et rechercher une vérification PASSWORD réussie, une vérification TOTP ou WEBAUTHN échouée et aucun événement UserAuthentication."
    - id: b
      text:
        en: "Search the user's ConsoleLogin events that have an errorMessage of Failed authentication, and check whether additionalEventData shows MFAUsed set to Yes."
        fr: "Rechercher les événements ConsoleLogin de l'utilisateur qui ont un errorMessage Failed authentication, et vérifier si additionalEventData indique MFAUsed à Yes."
    - id: c
      text:
        en: "Search the user's CheckMfa events, and check whether responseElements shows a failure and additionalEventData shows the MfaType of the user's device."
        fr: "Rechercher les événements CheckMfa de l'utilisateur, et vérifier si responseElements indique un échec et si additionalEventData indique le MfaType du dispositif de l'utilisateur."
    - id: d
      text:
        en: "Search the AssumeRoleWithSAML events of the user's permission set roles, and check whether each event has an AccessDenied errorCode."
        fr: "Rechercher les événements AssumeRoleWithSAML des rôles d'ensembles d'autorisations de l'utilisateur, et vérifier si chaque événement a un errorCode AccessDenied."
answer: { optionId: a }
explanation:
  correct:
    en: "IAM Identity Center records a CredentialChallenge event for each credential it requests and a CredentialVerification event that says whether the user solved it, with the CredentialType (PASSWORD, TOTP, WEBAUTHN...). AuthWorkflowID correlates all events of one sign-in, and a sign-in that does not satisfy every challenge produces no UserAuthentication event."
    fr: "IAM Identity Center enregistre un événement CredentialChallenge pour chaque information d'identification demandée et un événement CredentialVerification qui indique si l'utilisateur l'a fournie correctement, avec le CredentialType (PASSWORD, TOTP, WEBAUTHN...). AuthWorkflowID relie tous les événements d'une connexion, et une connexion qui ne satisfait pas tous les défis ne produit aucun événement UserAuthentication."
  options:
    b:
      en: "ConsoleLogin events with Failed authentication describe sign-ins of IAM users and the root user on the AWS sign-in page, not Identity Center sign-ins."
      fr: "Les événements ConsoleLogin avec Failed authentication décrivent les connexions des utilisateurs IAM et de l'utilisateur racine sur la page de connexion AWS, pas les connexions à Identity Center."
    c:
      en: "CheckMfa is recorded when AWS sign-in checks whether an IAM user needs MFA; it is not an Identity Center sign-in event."
      fr: "CheckMfa est enregistré lorsque la connexion AWS vérifie si un utilisateur IAM a besoin de la MFA ; ce n'est pas un événement de connexion à Identity Center."
    d:
      en: "A user who fails MFA never reaches the AWS access portal, so no role session is requested for the permission sets."
      fr: "Un utilisateur qui échoue à la MFA n'atteint jamais le portail d'accès AWS : aucune session de rôle n'est demandée pour les ensembles d'autorisations."
references:
  - title: Understanding IAM Identity Center sign-in events
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/understanding-sign-in-events.html
  - title: AWS Management Console sign-in events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
