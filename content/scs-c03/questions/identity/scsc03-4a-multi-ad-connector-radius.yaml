id: scsc03-4a-multi-ad-connector-radius
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses an AD Connector as the identity source of IAM Identity Center and is enabling MFA through its on-premises RADIUS server. After the company enters the RADIUS server address and shared secret in AWS Directory Service, the RADIUS status of the directory shows Failed. The RADIUS server has a single client entry, for the IP address of the company's VPN gateway, and the on-premises firewall allows only TCP traffic from the VPC.

    Which combination of actions will resolve the issue? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany utilise un AD Connector comme source d'identité d'IAM Identity Center et active la MFA par son serveur RADIUS sur site. Après la saisie de l'adresse du serveur RADIUS et du secret partagé dans AWS Directory Service, l'état RADIUS du répertoire indique Failed. Le serveur RADIUS n'a qu'une seule entrée de client, pour l'adresse IP de la passerelle VPN de l'entreprise, et le pare-feu sur site n'autorise que le trafic TCP depuis le VPC.

    Quelle combinaison d'actions résoudra le problème ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Enable Kerberos preauthentication for all user accounts in the on-premises domain that sign in through AD Connector."
        fr: "Activer la préauthentification Kerberos pour tous les comptes d'utilisateur du domaine sur site qui se connectent par AD Connector."
    - id: b
      text:
        en: "Create two RADIUS client entries with the IP addresses from the directory's Directory IP Address field, and use the same shared secret for both."
        fr: "Créer deux entrées de client RADIUS avec les adresses IP du champ Directory IP Address du répertoire, et utiliser le même secret partagé pour les deux."
    - id: c
      text:
        en: "Allow inbound TCP 389 on the RADIUS server from the on-premises domain controllers and from the VPC subnets."
        fr: "Autoriser le trafic entrant TCP 389 sur le serveur RADIUS depuis les contrôleurs de domaine sur site et depuis les sous-réseaux du VPC."
    - id: d
      text:
        en: "Configure MFA in IAM Identity Center with the Always-on method and authenticator apps."
        fr: "Configurer la MFA dans IAM Identity Center avec la méthode Always-on et les applications d'authentification."
    - id: e
      text:
        en: "Allow inbound UDP 1812 to the RADIUS server from the AD Connector directory servers."
        fr: "Autoriser le trafic entrant UDP 1812 vers le serveur RADIUS depuis les serveurs de répertoire d'AD Connector."
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: "AD Connector sends RADIUS requests from its directory servers, so the RADIUS server needs two client endpoints created with the addresses shown in the Directory IP Address field, both with the same shared secret. The RADIUS server must also accept inbound UDP 1812 from those servers."
    fr: "AD Connector envoie les requêtes RADIUS depuis ses serveurs de répertoire : le serveur RADIUS a donc besoin de deux points de terminaison clients créés avec les adresses du champ Directory IP Address, tous deux avec le même secret partagé. Le serveur RADIUS doit aussi accepter le trafic entrant UDP 1812 depuis ces serveurs."
  options:
    a:
      en: "Kerberos preauthentication is a general AD Connector prerequisite; it does not explain a RADIUS connection failure."
      fr: "La préauthentification Kerberos est un prérequis général d'AD Connector ; elle n'explique pas un échec de connexion RADIUS."
    c:
      en: "LDAP traffic flows between AD Connector and the domain controllers; the RADIUS server does not need it."
      fr: "Le trafic LDAP circule entre AD Connector et les contrôleurs de domaine ; le serveur RADIUS n'en a pas besoin."
    d:
      en: "RADIUS MFA through Directory Service is an alternative to IAM Identity Center MFA; Identity Center settings do not fix the RADIUS connection."
      fr: "La MFA RADIUS par Directory Service est une alternative à la MFA d'IAM Identity Center ; les paramètres d'Identity Center ne réparent pas la connexion RADIUS."
references:
  - title: Getting started with AD Connector
    url: https://docs.aws.amazon.com/directoryservice/latest/admin-guide/prereq_connector.html
  - title: Configure MFA in IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/mfa-configure.html
