id: scsc03-4b-forallvalues-null
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security engineer reviews the following policy, which is meant to let operators delete only the environment and cost-center tags from Amazon EC2 instances:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": "ec2:DeleteTags",
          "Resource": "arn:aws:ec2:eu-west-1:111122223333:instance/*",
          "Condition": {
            "ForAllValues:StringEquals": {
              "aws:TagKeys": ["environment", "cost-center"]
            }
          }
        }
      ]
    }
    ```

    The engineer finds that the statement also allows a DeleteTags request that contains no tag keys.

    Which change will make the policy grant only the intended permissions?
  fr: |
    Un ingénieur sécurité examine la politique suivante, censée permettre aux opérateurs de supprimer uniquement les balises environment et cost-center des instances Amazon EC2 :

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": "ec2:DeleteTags",
          "Resource": "arn:aws:ec2:eu-west-1:111122223333:instance/*",
          "Condition": {
            "ForAllValues:StringEquals": {
              "aws:TagKeys": ["environment", "cost-center"]
            }
          }
        }
      ]
    }
    ```

    L'ingénieur constate que l'instruction autorise aussi une demande DeleteTags qui ne contient aucune clé de balise.

    Quelle modification fera que la politique n'accorde que les autorisations prévues ?
body:
  options:
    - id: a
      text:
        en: |-
          Replace ForAllValues:StringEquals with ForAnyValue:StringEquals in the condition.
        fr: |-
          Remplacer ForAllValues:StringEquals par ForAnyValue:StringEquals dans la condition.
    - id: b
      text:
        en: |-
          Add a Null condition on aws:TagKeys with the value false to the same statement.
        fr: |-
          Ajouter à la même instruction une condition Null sur aws:TagKeys avec la valeur false.
    - id: c
      text:
        en: |-
          Replace ForAllValues:StringEquals with ForAllValues:StringEqualsIfExists in the condition.
        fr: |-
          Remplacer ForAllValues:StringEquals par ForAllValues:StringEqualsIfExists dans la condition.
    - id: d
      text:
        en: |-
          Add a statement that denies ec2:DeleteTags when aws:TagKeys contains another key, by using ForAnyValue:StringNotEquals with the two allowed keys.
        fr: |-
          Ajouter une instruction qui refuse ec2:DeleteTags lorsque aws:TagKeys contient une autre clé, en utilisant ForAnyValue:StringNotEquals avec les deux clés autorisées.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      ForAllValues returns true when every key in the request is in the list, and also when the request contains no keys at all. AWS recommends adding a Null condition with false so that the key must be present; the statement then matches only requests whose tag keys are all environment or cost-center.
    fr: |-
      ForAllValues renvoie true lorsque chaque clé de la demande figure dans la liste, mais aussi lorsque la demande ne contient aucune clé. AWS recommande d'ajouter une condition Null avec false pour que la clé soit obligatoire ; l'instruction ne correspond alors qu'aux demandes dont toutes les clés de balise sont environment ou cost-center.
  options:
    a:
      en: |-
        ForAnyValue matches when at least one key is in the list, so a request that deletes environment together with another tag would be allowed.
      fr: |-
        ForAnyValue correspond dès qu'une clé figure dans la liste : une demande qui supprime environment avec une autre balise serait autorisée.
    c:
      en: |-
        IfExists makes the condition true when the key is missing, which keeps the same gap.
      fr: |-
        IfExists rend la condition vraie lorsque la clé est absente, ce qui conserve la même faille.
    d:
      en: |-
        ForAnyValue returns false when the key is absent, so the Deny does not match a request with no tag keys and the gap remains.
      fr: |-
        ForAnyValue renvoie false lorsque la clé est absente : le Deny ne correspond pas à une demande sans clé de balise, et la faille demeure.
references:
  - title: Single-valued vs. multivalued context keys - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-single-vs-multi-valued-context-keys.html
