id: scsc03-4a-lambda-execution-role
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at AnyCompany is writing an AWS Lambda function that reads items from an Amazon DynamoDB table. The developer plans to put an IAM user's access keys in the function's environment variables. The security team requires that the function use temporary credentials that AWS issues and renews, with no credentials stored in the function's configuration or code.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany écrit une fonction AWS Lambda qui lit des éléments dans une table Amazon DynamoDB. Le développeur prévoit de placer les clés d'accès d'un utilisateur IAM dans les variables d'environnement de la fonction. L'équipe de sécurité exige que la fonction utilise des informations d'identification temporaires émises et renouvelées par AWS, sans aucune information d'identification stockée dans la configuration ou le code de la fonction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Store the IAM user's access keys in AWS Secrets Manager, and have the function read them at each invocation."
        fr: "Stocker les clés d'accès de l'utilisateur IAM dans AWS Secrets Manager, et faire lire les clés par la fonction à chaque appel."
    - id: b
      text:
        en: "Have the function call sts:AssumeRole on its execution role at each invocation, with keys stored in an encrypted environment variable."
        fr: "Faire appeler sts:AssumeRole par la fonction sur son rôle d'exécution à chaque appel, avec des clés stockées dans une variable d'environnement chiffrée."
    - id: c
      text:
        en: "Grant the DynamoDB permissions to the function's execution role, and let the AWS SDK use the credentials that Lambda provides."
        fr: "Accorder les autorisations DynamoDB au rôle d'exécution de la fonction, et laisser le SDK AWS utiliser les informations d'identification fournies par Lambda."
    - id: d
      text:
        en: "Create an Amazon Cognito identity pool with guest access, and have the function obtain guest credentials at each invocation."
        fr: "Créer un groupe d'identités Amazon Cognito avec accès invité, et faire obtenir des informations d'identification invité par la fonction à chaque appel."
answer: { optionId: c }
explanation:
  correct:
    en: "Lambda assumes the function's execution role when the function is invoked, and the AWS SDK in the function uses the resulting temporary credentials automatically. Granting the DynamoDB permissions to that role removes the need for any stored keys."
    fr: "Lambda endosse le rôle d'exécution de la fonction lorsque celle-ci est appelée, et le SDK AWS de la fonction utilise automatiquement les informations d'identification temporaires obtenues. Accorder les autorisations DynamoDB à ce rôle supprime tout besoin de clés stockées."
  options:
    a:
      en: "The keys would still be long-term IAM user credentials."
      fr: "Les clés resteraient des informations d'identification d'utilisateur IAM à long terme."
    b:
      en: "Lambda already assumes the execution role, AWS advises against assuming it again in function code, and the stored keys are long-term credentials."
      fr: "Lambda endosse déjà le rôle d'exécution, AWS déconseille de l'endosser de nouveau dans le code de la fonction, et les clés stockées sont des informations d'identification à long terme."
    d:
      en: "Guest identity pool credentials are meant for unauthenticated app users, not for a back-end function, and they add an unneeded dependency."
      fr: "Les informations d'identification invité d'un groupe d'identités sont destinées aux utilisateurs non authentifiés d'une application, pas à une fonction backend, et elles ajoutent une dépendance inutile."
references:
  - title: Defining Lambda Event Function permissions with an execution role
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
