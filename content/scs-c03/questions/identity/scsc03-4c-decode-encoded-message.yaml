id: scsc03-4c-decode-encoded-message
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at AnyCompany runs aws ec2 run-instances and receives an UnauthorizedOperation error that contains an encoded authorization failure message. A security engineer must find out whether the request was denied by an explicit deny and which condition key values the request carried.

    Which solution will meet these requirements?
  fr: |
    Un développeur d'AnyCompany exécute aws ec2 run-instances et reçoit une erreur UnauthorizedOperation qui contient un message d'échec d'autorisation encodé. Un ingénieur sécurité doit déterminer si la requête a été refusée par un refus explicite et quelles valeurs de clés de condition la requête contenait.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Paste the encoded message into the IAM policy simulator in principal mode for the developer's role, and read the matched statements.
        fr: |-
          Coller le message encodé dans le simulateur de politiques IAM en mode principal pour le rôle du développeur, puis lire les instructions correspondantes.
    - id: b
      text:
        en: |-
          Run aws accessanalyzer validate-policy on the developer's identity-based policy, and read the security warnings it returns.
        fr: |-
          Exécuter aws accessanalyzer validate-policy sur la politique basée sur l'identité du développeur, puis lire les avertissements de sécurité renvoyés.
    - id: c
      text:
        en: |-
          Decode the message with a Base64 utility on the developer's workstation, and read the JSON document it produces.
        fr: |-
          Décoder le message avec un utilitaire Base64 sur le poste du développeur, puis lire le document JSON produit.
    - id: d
      text:
        en: |-
          Allow the engineer sts:DecodeAuthorizationMessage, and run aws sts decode-authorization-message with the encoded message.
        fr: |-
          Autoriser sts:DecodeAuthorizationMessage pour l'ingénieur, puis exécuter aws sts decode-authorization-message avec le message encodé.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Some operations, such as EC2 operations, encode the details of an authorization failure because they can contain privileged information. AWS STS DecodeAuthorizationMessage, which requires the sts:DecodeAuthorizationMessage permission, returns whether the deny was explicit, the principal, the action, the resource and the condition key values of the request.
    fr: |-
      Certaines opérations, comme celles d'EC2, encodent les détails d'un échec d'autorisation parce qu'ils peuvent contenir des informations privilégiées. L'API AWS STS DecodeAuthorizationMessage, qui exige l'autorisation sts:DecodeAuthorizationMessage, renvoie si le refus était explicite, le principal, l'action, la ressource et les valeurs des clés de condition de la requête.
  options:
    a:
      en: |-
        The policy simulator evaluates policies against actions and resources that you supply; it does not accept or decode an encoded authorization message.
      fr: |-
        Le simulateur de politiques évalue des politiques pour les actions et ressources que vous fournissez ; il n'accepte ni ne décode un message d'autorisation encodé.
    b:
      en: |-
        Policy validation checks grammar and best practices of a policy document; it says nothing about the context of the failed request.
      fr: |-
        La validation de politique vérifie la grammaire et les bonnes pratiques d'un document de politique ; elle ne dit rien du contexte de la requête en échec.
    c:
      en: |-
        The message is protected by AWS so that only a principal allowed to call DecodeAuthorizationMessage can read it; a local decoder does not reveal the details.
      fr: |-
        Le message est protégé par AWS pour que seul un principal autorisé à appeler DecodeAuthorizationMessage puisse le lire ; un décodeur local ne révèle pas les détails.
references:
  - title: DecodeAuthorizationMessage - AWS Security Token Service
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_DecodeAuthorizationMessage.html
