id: scsc03-4b-oidc-session-tags
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's workloads authenticate to an external OpenID Connect (OIDC) identity provider and then call AssumeRoleWithWebIdentity for the IAM role AppData. The AppData policy grants access to Amazon DynamoDB items based on aws:PrincipalTag/tenant. The IdP can add custom claims to its tokens but cannot emit nested JSON objects in claims. The tenant value must come from the IdP.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Les charges de travail d'AnyCompany s'authentifient auprès d'un fournisseur d'identité OpenID Connect (OIDC) externe, puis appellent AssumeRoleWithWebIdentity pour le rôle IAM AppData. La politique d'AppData accorde l'accès à des éléments Amazon DynamoDB en fonction d'aws:PrincipalTag/tenant. L'IdP peut ajouter des revendications personnalisées à ses jetons, mais ne peut pas émettre d'objets JSON imbriqués dans les revendications. La valeur tenant doit provenir de l'IdP.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure the IdP to add a claim named https://aws.amazon.com/tags/principal_tags/tenant that contains the tenant value.
        fr: |-
          Configurer l'IdP pour qu'il ajoute une revendication nommée https://aws.amazon.com/tags/principal_tags/tenant qui contient la valeur tenant.
    - id: b
      text:
        en: |-
          Configure the IdP to send a SAML attribute named https://aws.amazon.com/SAML/Attributes/PrincipalTag:tenant.
        fr: |-
          Configurer l'IdP pour qu'il envoie un attribut SAML nommé https://aws.amazon.com/SAML/Attributes/PrincipalTag:tenant.
    - id: c
      text:
        en: |-
          Add a tenant tag to the IAM OIDC identity provider resource so that STS copies it to each session.
        fr: |-
          Ajouter une balise tenant à la ressource fournisseur d'identité OIDC IAM pour que STS la copie dans chaque session.
    - id: d
      text:
        en: |-
          Add sts:TagSession to the actions that the AppData trust policy allows for the OIDC provider principal.
        fr: |-
          Ajouter sts:TagSession aux actions que la politique d'approbation d'AppData autorise pour le principal du fournisseur OIDC.
    - id: e
      text:
        en: |-
          Configure the IdP to add a claim named https://aws.amazon.com/tags that contains a principal_tags object with the tenant value.
        fr: |-
          Configurer l'IdP pour qu'il ajoute une revendication nommée https://aws.amazon.com/tags qui contient un objet principal_tags avec la valeur tenant.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      For IdPs that do not support nested claims, STS accepts the flattened format, with one https://aws.amazon.com/tags/principal_tags/{key} claim per session tag. The role trust policy must also allow sts:TagSession for the provider, or the role assumption fails when the token carries tags.
    fr: |-
      Pour les IdP qui ne prennent pas en charge les revendications imbriquées, STS accepte le format aplati, avec une revendication https://aws.amazon.com/tags/principal_tags/{clé} par balise de session. La politique d'approbation du rôle doit aussi autoriser sts:TagSession pour le fournisseur, sinon l'endossement échoue lorsque le jeton porte des balises.
  options:
    b:
      en: |-
        SAML attributes apply to AssumeRoleWithSAML; an OIDC token passes session tags in its claims.
      fr: |-
        Les attributs SAML concernent AssumeRoleWithSAML ; un jeton OIDC transmet les balises de session dans ses revendications.
    c:
      en: |-
        Tags on the identity provider resource are not copied to sessions, and one fixed tag could not carry a different tenant for each workload.
      fr: |-
        Les balises de la ressource fournisseur d'identité ne sont pas copiées dans les sessions, et une balise fixe ne pourrait pas porter un locataire différent pour chaque charge de travail.
    e:
      en: |-
        This is the nested claim format, which the IdP cannot emit.
      fr: |-
        Il s'agit du format de revendication imbriqué, que l'IdP ne peut pas émettre.
references:
  - title: Pass session tags in AWS STS - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_session-tags.html
