id: scsc03-4a-presign-kms-decrypt
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IAM role of AnyCompany's reporting application generates Amazon S3 presigned GET URLs for reports in a bucket. The bucket's default encryption was recently changed from SSE-S3 to SSE-KMS with a customer managed key. URLs for reports uploaded before the change still work, but URLs for new reports return AccessDenied. The role's identity-based policy allows s3:GetObject on the bucket, and the key policy lets IAM policies in the account grant access to the key.

    What should the company do to resolve the issue?
  fr: |
    Un rôle IAM de l'application de rapports d'AnyCompany génère des URL GET présignées Amazon S3 pour des rapports stockés dans un compartiment. Le chiffrement par défaut du compartiment est récemment passé de SSE-S3 à SSE-KMS avec une clé gérée par le client. Les URL des rapports chargés avant le changement fonctionnent toujours, mais celles des nouveaux rapports renvoient AccessDenied. La politique basée sur l'identité du rôle autorise s3:GetObject sur le compartiment, et la politique de clé permet aux politiques IAM du compte d'accorder l'accès à la clé.

    Que doit faire l'entreprise pour résoudre le problème ?
body:
  options:
    - id: a
      text:
        en: "Add kms:Decrypt on the customer managed key to the identity-based policy of the role that signs the URLs."
        fr: "Ajouter kms:Decrypt sur la clé gérée par le client à la politique basée sur l'identité du rôle qui signe les URL."
    - id: b
      text:
        en: "Add kms:Decrypt on the customer managed key to the bucket policy for Principal \"*\" so that URL users can decrypt the objects."
        fr: "Ajouter kms:Decrypt sur la clé gérée par le client à la politique de compartiment pour Principal \"*\" afin que les utilisateurs des URL puissent déchiffrer les objets."
    - id: c
      text:
        en: "Add the x-amz-server-side-encryption header with the value aws:kms to the signed headers of each presigned GET URL."
        fr: "Ajouter l'en-tête x-amz-server-side-encryption avec la valeur aws:kms aux en-têtes signés de chaque URL GET présignée."
    - id: d
      text:
        en: "Generate the presigned URLs with Signature Version 2 instead of Signature Version 4 for objects that are encrypted with SSE-KMS."
        fr: "Générer les URL présignées avec Signature Version 2 au lieu de Signature Version 4 pour les objets chiffrés avec SSE-KMS."
answer: { optionId: a }
explanation:
  correct:
    en: "A presigned URL acts with the permissions of the principal that signed it. Downloading an SSE-KMS object requires kms:Decrypt on the key in addition to s3:GetObject, so the signing role needs kms:Decrypt; the key policy already lets an IAM policy grant it."
    fr: "Une URL présignée agit avec les autorisations du principal qui l'a signée. Télécharger un objet SSE-KMS exige kms:Decrypt sur la clé en plus de s3:GetObject : le rôle signataire a donc besoin de kms:Decrypt, que la politique de clé permet déjà d'accorder par une politique IAM."
  options:
    b:
      en: "A bucket policy cannot grant AWS KMS permissions, and requests made with a presigned URL use the signer's permissions."
      fr: "Une politique de compartiment ne peut pas accorder d'autorisations AWS KMS, et les requêtes faites avec une URL présignée utilisent les autorisations du signataire."
    c:
      en: "Encryption headers must not be sent on GET requests for SSE-KMS objects; Amazon S3 returns an HTTP 400 error."
      fr: "Les en-têtes de chiffrement ne doivent pas être envoyés dans les requêtes GET d'objets SSE-KMS ; Amazon S3 renvoie une erreur HTTP 400."
    d:
      en: "The signature version does not change the AWS KMS permissions that the signer needs."
      fr: "La version de signature ne change pas les autorisations AWS KMS dont le signataire a besoin."
references:
  - title: Using server-side encryption with AWS KMS keys (SSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html
  - title: Download and upload objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html
