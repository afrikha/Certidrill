id: scsc03-4a-order-idc-revoke-user
objective: "4.1.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses the Identity Center directory as the identity source of IAM Identity Center. An employee's credentials were compromised, and the attacker may hold an active AWS access portal session and active role sessions created from permission sets in several accounts. An SCP attached to the organization denies all actions to the IAM Identity Center user IDs that it lists. The security team must stop the attacker's access as quickly as possible, including the role sessions that are already active.

    Which four actions should the security team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany utilise le répertoire Identity Center comme source d'identité d'IAM Identity Center. Les informations d'identification d'un employé ont été compromises, et l'attaquant détient peut-être une session active du portail d'accès AWS et des sessions de rôle actives créées à partir d'ensembles d'autorisations dans plusieurs comptes. Une SCP attachée à l'organisation refuse toutes les actions aux ID d'utilisateur IAM Identity Center qu'elle liste. L'équipe de sécurité doit arrêter l'accès de l'attaquant le plus vite possible, y compris les sessions de rôle déjà actives.

    Quelles sont les quatre actions que l'équipe de sécurité doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: sessions
      text: { en: "Delete the user's active sessions in the IAM Identity Center console.", fr: "Supprimer les sessions actives de l'utilisateur dans la console IAM Identity Center." }
    - id: revoke
      text: { en: "Choose Revoke active sessions on each AWSReservedSSO_ role in the IAM console of each account.", fr: "Choisir Revoke active sessions sur chaque rôle AWSReservedSSO_ dans la console IAM de chaque compte." }
    - id: deny
      text: { en: "Add the user's ID to the deny statement of the SCP.", fr: "Ajouter l'ID de l'utilisateur à l'instruction de refus de la SCP." }
    - id: disable
      text: { en: "Disable the user's access in the IAM Identity Center console.", fr: "Désactiver l'accès de l'utilisateur dans la console IAM Identity Center." }
    - id: remove
      text: { en: "Remove the user's ID from the SCP once the user is disabled.", fr: "Retirer l'ID de l'utilisateur de la SCP une fois l'utilisateur désactivé." }
    - id: assign
      text: { en: "Remove all of the user's permission set assignments.", fr: "Supprimer toutes les attributions d'ensembles d'autorisations de l'utilisateur." }
answer:
  sequence: [deny, assign, sessions, disable]
explanation:
  correct:
    en: "The SCP deny stops actions from role sessions that already exist, so it comes first. Removing the permission set assignments then prevents the user from assuming more roles, deleting the sessions immediately ends access to the AWS access portal, and only then is the user disabled, because once a user is disabled the console can no longer stop that user's session. The deny must stay in place for at least 12 hours so that the existing role sessions expire."
    fr: "Le refus de la SCP arrête les actions des sessions de rôle déjà ouvertes : il vient donc en premier. La suppression des attributions d'ensembles d'autorisations empêche ensuite l'utilisateur d'endosser d'autres rôles, la suppression des sessions met immédiatement fin à l'accès au portail d'accès AWS, et l'utilisateur n'est désactivé qu'ensuite, car une fois l'utilisateur désactivé la console ne peut plus arrêter sa session. Le refus doit rester en place au moins 12 heures pour que les sessions de rôle existantes expirent."
  options:
    revoke:
      en: "Roles created from permission sets cannot be edited in IAM, so their sessions cannot be revoked from the IAM console."
      fr: "Les rôles créés à partir d'ensembles d'autorisations ne peuvent pas être modifiés dans IAM : leurs sessions ne peuvent pas être révoquées depuis la console IAM."
    remove:
      en: "Removing the deny before the role sessions expire would restore the attacker's actions in those sessions."
      fr: "Retirer le refus avant l'expiration des sessions de rôle rétablirait les actions de l'attaquant dans ces sessions."
references:
  - title: Revoke user access
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/revoke-user-permissions.html
  - title: Revoke IAM role temporary security credentials
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_revoke-sessions.html
