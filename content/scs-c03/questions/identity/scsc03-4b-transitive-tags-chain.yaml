id: scsc03-4b-transitive-tags-chain
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Employees federate through a SAML identity provider into the IAM role Jump, and the IdP passes a team session tag for each employee. From Jump, employees assume the role DataOps in the same account. The DataOps policy allows actions when aws:ResourceTag/team equals ${aws:PrincipalTag/team}, and the DataOps trust policy allows sts:AssumeRole and sts:TagSession from Jump. DataOps sessions receive AccessDenied because they have no team tag. Each employee's team value must reach the DataOps session without the employee being able to choose the value.

    Which solution will meet these requirements?
  fr: |
    Les employés se fédèrent par un fournisseur d'identité SAML dans le rôle IAM Jump, et l'IdP transmet une balise de session team pour chaque employé. Depuis Jump, les employés endossent le rôle DataOps du même compte. La politique de DataOps autorise des actions lorsque aws:ResourceTag/team est égal à ${aws:PrincipalTag/team}, et la politique d'approbation de DataOps autorise sts:AssumeRole et sts:TagSession depuis Jump. Les sessions DataOps reçoivent AccessDenied, car elles n'ont pas de balise team. La valeur team de chaque employé doit parvenir à la session DataOps sans que l'employé puisse en choisir la valeur.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a team tag to the DataOps role so that the role tag is evaluated as aws:PrincipalTag/team in DataOps sessions.
        fr: |-
          Ajouter une balise team au rôle DataOps pour que la balise de rôle soit évaluée comme aws:PrincipalTag/team dans les sessions DataOps.
    - id: b
      text:
        en: |-
          Configure the IdP to also send the TransitiveTagKeys SAML attribute with the value team, so that the team tag persists through role chaining.
        fr: |-
          Configurer l'IdP pour qu'il envoie aussi l'attribut SAML TransitiveTagKeys avec la valeur team, afin que la balise team persiste lors du chaînage de rôles.
    - id: c
      text:
        en: |-
          Instruct employees to pass --tags Key=team,Value=their-team when they call aws sts assume-role for DataOps from the Jump session.
        fr: |-
          Demander aux employés de transmettre --tags Key=team,Value=leur-equipe lorsqu'ils appellent aws sts assume-role pour DataOps depuis la session Jump.
    - id: d
      text:
        en: |-
          Add a team tag to the Jump role and mark that role tag as transitive so that it is passed to the DataOps session.
        fr: |-
          Ajouter une balise team au rôle Jump et marquer cette balise de rôle comme transitive pour qu'elle soit transmise à la session DataOps.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Session tags are not passed to later sessions by default. Tags that the IdP marks as transitive persist through role chaining, so the DataOps session inherits the team value set by the IdP, and the trust policy already allows sts:TagSession.
    fr: |-
      Par défaut, les balises de session ne sont pas transmises aux sessions suivantes. Les balises que l'IdP marque comme transitives persistent lors du chaînage de rôles : la session DataOps hérite de la valeur team définie par l'IdP, et la politique d'approbation autorise déjà sts:TagSession.
  options:
    a:
      en: |-
        A role tag has one value for every session of the role, so it cannot carry each employee's team.
      fr: |-
        Une balise de rôle a une seule valeur pour toutes les sessions du rôle : elle ne peut pas porter l'équipe de chaque employé.
    c:
      en: |-
        Employees would choose their own team value, which the requirements forbid.
      fr: |-
        Les employés choisiraient eux-mêmes la valeur de leur équipe, ce que les exigences interdisent.
    d:
      en: |-
        Role tags cannot be made transitive, and a role tag would have the same value for every employee.
      fr: |-
        Les balises de rôle ne peuvent pas être rendues transitives, et une balise de rôle aurait la même valeur pour tous les employés.
references:
  - title: Pass session tags in AWS STS - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_session-tags.html
