id: scsc03-4c-boundary-implicit-deny
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At AnyCompany, developers create IAM roles that must have the DevBoundary managed policy as their permissions boundary. A developer created the role AppWriter with an identity-based policy that allows dynamodb:* on the Orders table. When the application writes to the table, it receives the following error:

    ```text
    User: arn:aws:sts::111122223333:assumed-role/AppWriter/app is not authorized to perform: dynamodb:PutItem on resource: arn:aws:dynamodb:us-east-1:111122223333:table/Orders because no permissions boundary allows the dynamodb:PutItem action
    ```

    Which change will allow the write while keeping the permissions boundary in place?
  fr: |
    Chez AnyCompany, les développeurs créent des rôles IAM qui doivent avoir la politique gérée DevBoundary comme limite d'autorisations. Un développeur a créé le rôle AppWriter avec une politique basée sur l'identité qui autorise dynamodb:* sur la table Orders. Quand l'application écrit dans la table, elle reçoit l'erreur suivante :

    ```text
    User: arn:aws:sts::111122223333:assumed-role/AppWriter/app is not authorized to perform: dynamodb:PutItem on resource: arn:aws:dynamodb:us-east-1:111122223333:table/Orders because no permissions boundary allows the dynamodb:PutItem action
    ```

    Quelle modification permet l'écriture tout en conservant la limite d'autorisations ?
body:
  options:
    - id: a
      text:
        en: |-
          Update the DevBoundary policy so that it allows dynamodb:PutItem on the Orders table.
        fr: |-
          Mettre à jour la politique DevBoundary pour qu'elle autorise dynamodb:PutItem sur la table Orders.
    - id: b
      text:
        en: |-
          Attach a resource-based policy to the Orders table that allows the AppWriter role ARN to call dynamodb:PutItem.
        fr: |-
          Attacher à la table Orders une politique basée sur les ressources qui autorise l'ARN du rôle AppWriter à appeler dynamodb:PutItem.
    - id: c
      text:
        en: |-
          Add a second identity-based policy to the AppWriter role that explicitly allows dynamodb:PutItem on the Orders table.
        fr: |-
          Ajouter au rôle AppWriter une seconde politique basée sur l'identité qui autorise explicitement dynamodb:PutItem sur la table Orders.
    - id: d
      text:
        en: |-
          Remove the Deny statement for dynamodb:PutItem from the DevBoundary policy.
        fr: |-
          Supprimer de la politique DevBoundary l'instruction Deny pour dynamodb:PutItem.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The message reports an implicit deny: the permissions boundary contains no Allow for the action. The effective permissions of a role are the intersection of its identity-based policies and its boundary, so the boundary itself must allow dynamodb:PutItem on the table.
    fr: |-
      Le message signale un refus implicite : la limite d'autorisations ne contient aucune autorisation pour l'action. Les autorisations effectives d'un rôle sont l'intersection de ses politiques basées sur l'identité et de sa limite : c'est donc la limite qui doit autoriser dynamodb:PutItem sur la table.
  options:
    b:
      en: |-
        A resource-based policy that names a role ARN is limited by an implicit deny in the role's permissions boundary, so the request would still be denied.
      fr: |-
        Une politique basée sur les ressources qui désigne l'ARN d'un rôle est limitée par un refus implicite de la limite d'autorisations du rôle : la requête serait toujours refusée.
    c:
      en: |-
        The identity-based policy already allows the action; another Allow does not widen the intersection with the boundary.
      fr: |-
        La politique basée sur l'identité autorise déjà l'action ; une autorisation de plus n'élargit pas l'intersection avec la limite.
    d:
      en: |-
        The message says that no boundary allows the action, which is an implicit deny; an explicit deny would read "with an explicit deny in a permissions boundary".
      fr: |-
        Le message indique qu'aucune limite n'autorise l'action, ce qui est un refus implicite ; un refus explicite serait signalé par « with an explicit deny in a permissions boundary ».
references:
  - title: Troubleshoot access denied error messages - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied.html
  - title: Permissions boundaries for IAM entities - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
