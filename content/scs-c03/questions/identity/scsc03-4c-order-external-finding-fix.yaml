id: scsc03-4c-order-external-finding-fix
objective: "4.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's external access analyzer reports that an Amazon S3 bucket is shared with the account of a former partner whose contract has ended. The bucket policy also grants access to a current partner, which must be kept. The security team must remove the unintended access, check the proposed policy before it is deployed, and confirm the result.

    Which four actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    L'analyseur d'accès externe d'AnyCompany signale qu'un compartiment Amazon S3 est partagé avec le compte d'un ancien partenaire dont le contrat a pris fin. La politique du compartiment accorde aussi l'accès à un partenaire actuel, qui doit être conservé. L'équipe de sécurité doit retirer l'accès non souhaité, vérifier la politique proposée avant son déploiement et confirmer le résultat.

    Quelles sont les quatre actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: apply, text: { en: "Save the updated bucket policy on the bucket.", fr: "Enregistrer la politique de compartiment mise à jour sur le compartiment." } }
    - { id: review, text: { en: "Review the finding to identify the external principal and the policy that grants the access.", fr: "Examiner le résultat pour identifier le principal externe et la politique qui accorde l'accès." } }
    - { id: archive, text: { en: "Archive the finding to record the decision about the access.", fr: "Archiver le résultat pour consigner la décision concernant l'accès." } }
    - { id: rescan, text: { en: "Rescan the bucket from the finding, and confirm that the finding status is Resolved.", fr: "Relancer l'analyse du compartiment depuis le résultat, puis vérifier que l'état du résultat est Resolved." } }
    - { id: preview, text: { en: "Create an access preview with the proposed bucket policy, and confirm that only the current partner keeps access.", fr: "Créer un aperçu d'accès avec la politique de compartiment proposée, puis vérifier que seul le partenaire actuel conserve l'accès." } }
    - { id: rule, text: { en: "Create an archive rule for findings that name the former partner's account.", fr: "Créer une règle d'archivage pour les résultats qui désignent le compte de l'ancien partenaire." } }
answer:
  sequence: [ review, preview, apply, rescan ]
explanation:
  correct:
    en: |-
      The finding shows the external principal and how access is granted, for example through the bucket policy. An access preview shows the public and cross-account access that a proposed policy would grant before it is deployed. After the policy is saved, a rescan updates the finding, which moves to Resolved when the access is removed.
    fr: |-
      Le résultat indique le principal externe et la manière dont l'accès est accordé, par exemple par la politique du compartiment. Un aperçu d'accès montre l'accès public et entre comptes qu'accorderait une politique proposée avant son déploiement. Une fois la politique enregistrée, une nouvelle analyse met à jour le résultat, qui passe à Resolved quand l'accès est retiré.
  options:
    archive:
      en: "Archiving is for access that is intended; this access must be removed, and archiving would hide the finding without removing it."
      fr: "L'archivage concerne les accès voulus ; cet accès doit être retiré, et l'archivage masquerait le résultat sans le supprimer."
    rule:
      en: "An archive rule would hide future findings for the former partner, so an unintended grant could go unnoticed."
      fr: "Une règle d'archivage masquerait les futurs résultats concernant l'ancien partenaire : une autorisation non souhaitée pourrait passer inaperçue."
references:
  - title: Preview access - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-access-preview.html
  - title: Resolve IAM Access Analyzer findings - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-findings-remediate.html
