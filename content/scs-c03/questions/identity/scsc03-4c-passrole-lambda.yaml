id: scsc03-4c-passrole-lambda
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at AnyCompany creates an AWS Lambda function with the execution role OrdersFnRole. The developer's role allows lambda:CreateFunction, and the trust policy of OrdersFnRole allows lambda.amazonaws.com to assume it. The call fails with the following error:

    ```text
    User: arn:aws:sts::111122223333:assumed-role/Developer/kim is not authorized to perform: iam:PassRole on resource: arn:aws:iam::111122223333:role/OrdersFnRole because no identity-based policy allows the iam:PassRole action
    ```

    The fix must follow the principle of least privilege.

    Which change should the security engineer make?
  fr: |
    Un développeur d'AnyCompany crée une fonction AWS Lambda avec le rôle d'exécution OrdersFnRole. Le rôle du développeur autorise lambda:CreateFunction, et la politique d'approbation d'OrdersFnRole autorise lambda.amazonaws.com à l'assumer. L'appel échoue avec l'erreur suivante :

    ```text
    User: arn:aws:sts::111122223333:assumed-role/Developer/kim is not authorized to perform: iam:PassRole on resource: arn:aws:iam::111122223333:role/OrdersFnRole because no identity-based policy allows the iam:PassRole action
    ```

    La correction doit respecter le principe du moindre privilège.

    Quelle modification l'ingénieur sécurité doit-il effectuer ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow iam:PassRole on all resources in the Developer role's policy, with an iam:PassedToService condition for lambda.amazonaws.com.
        fr: |-
          Autoriser iam:PassRole sur toutes les ressources dans la politique du rôle Developer, avec une condition iam:PassedToService pour lambda.amazonaws.com.
    - id: b
      text:
        en: |-
          Allow sts:AssumeRole on OrdersFnRole in the Developer role's policy, and add the Developer role to the trust policy of OrdersFnRole.
        fr: |-
          Autoriser sts:AssumeRole sur OrdersFnRole dans la politique du rôle Developer, et ajouter le rôle Developer à la politique d'approbation d'OrdersFnRole.
    - id: c
      text:
        en: |-
          Allow iam:PassRole on the OrdersFnRole ARN in the Developer role's policy, with an iam:PassedToService condition for lambda.amazonaws.com.
        fr: |-
          Autoriser iam:PassRole sur l'ARN d'OrdersFnRole dans la politique du rôle Developer, avec une condition iam:PassedToService pour lambda.amazonaws.com.
    - id: d
      text:
        en: |-
          Allow iam:PassRole for the Developer role in the trust policy of OrdersFnRole, next to the lambda.amazonaws.com statement.
        fr: |-
          Autoriser iam:PassRole pour le rôle Developer dans la politique d'approbation d'OrdersFnRole, à côté de l'instruction lambda.amazonaws.com.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      To attach a role to a service resource, the caller needs the iam:PassRole permission in its own identity-based policy. Scoping the Resource element to the OrdersFnRole ARN limits which role can be passed, and the iam:PassedToService condition limits the service that can receive it.
    fr: |-
      Pour attacher un rôle à une ressource de service, l'appelant a besoin de l'autorisation iam:PassRole dans sa propre politique basée sur l'identité. Limiter l'élément Resource à l'ARN d'OrdersFnRole restreint le rôle qui peut être transmis, et la condition iam:PassedToService restreint le service qui peut le recevoir.
  options:
    a:
      en: |-
        Passing any role in the account to Lambda is broader than needed; the Resource element should name only OrdersFnRole.
      fr: |-
        Pouvoir transmettre n'importe quel rôle du compte à Lambda est plus large que nécessaire ; l'élément Resource doit désigner uniquement OrdersFnRole.
    b:
      en: |-
        Passing a role does not require the caller to assume it; this grants the developer the function's permissions without fixing the missing iam:PassRole.
      fr: |-
        Transmettre un rôle n'exige pas que l'appelant l'assume ; cela donne au développeur les autorisations de la fonction sans corriger l'absence d'iam:PassRole.
    d:
      en: |-
        A trust policy controls who can assume the role; iam:PassRole is evaluated in the identity-based policy of the caller, as the message says.
      fr: |-
        Une politique d'approbation contrôle qui peut assumer le rôle ; iam:PassRole est évalué dans la politique basée sur l'identité de l'appelant, comme l'indique le message.
references:
  - title: Grant a user permissions to pass a role to an AWS service - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_passrole.html
