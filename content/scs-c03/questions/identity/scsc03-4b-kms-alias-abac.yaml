id: scsc03-4b-kms-alias-abac
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In account 111122223333, the payments developers' role must be able to call kms:Encrypt, kms:Decrypt, and kms:GenerateDataKey with any customer managed key that has an alias starting with alias/payments-, including keys created later. The key policies contain the default statement that lets IAM policies in the account grant access. Applications sometimes identify the key by its key ARN and sometimes by its alias.

    Which statement should the security engineer add to the role's identity-based policy?
  fr: |
    Dans le compte 111122223333, le rôle des développeurs paiements doit pouvoir appeler kms:Encrypt, kms:Decrypt et kms:GenerateDataKey avec toute clé gérée par le client dont un alias commence par alias/payments-, y compris les clés créées plus tard. Les politiques de clé contiennent l'instruction par défaut qui permet aux politiques IAM du compte d'accorder l'accès. Les applications identifient la clé tantôt par l'ARN de la clé, tantôt par son alias.

    Quelle instruction l'ingénieur sécurité doit-il ajouter à la politique basée sur l'identité du rôle ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow the three actions on the resource arn:aws:kms:*:111122223333:alias/payments-* with no condition.
        fr: |-
          Autoriser les trois actions sur la ressource arn:aws:kms:*:111122223333:alias/payments-* sans condition.
    - id: b
      text:
        en: |-
          Allow the three actions on arn:aws:kms:*:111122223333:key/* when kms:RequestAlias matches alias/payments-* with StringLike.
        fr: |-
          Autoriser les trois actions sur arn:aws:kms:*:111122223333:key/* lorsque kms:RequestAlias correspond à alias/payments-* avec StringLike.
    - id: c
      text:
        en: |-
          Allow the three actions on arn:aws:kms:*:111122223333:key/* when kms:ResourceAliases matches alias/payments-* with ForAnyValue:StringLike.
        fr: |-
          Autoriser les trois actions sur arn:aws:kms:*:111122223333:key/* lorsque kms:ResourceAliases correspond à alias/payments-* avec ForAnyValue:StringLike.
    - id: d
      text:
        en: |-
          Allow the three actions on arn:aws:kms:*:111122223333:key/* when kms:ResourceAliases matches alias/payments-* with ForAllValues:StringLike.
        fr: |-
          Autoriser les trois actions sur arn:aws:kms:*:111122223333:key/* lorsque kms:ResourceAliases correspond à alias/payments-* avec ForAllValues:StringLike.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      kms:ResourceAliases is a multivalued key that holds the aliases associated with the KMS key, whatever identifier the request uses. ForAnyValue is satisfied when at least one alias of the key matches alias/payments-*, and a key without aliases does not match, so every current and future payments key is usable.
    fr: |-
      kms:ResourceAliases est une clé à valeurs multiples qui contient les alias associés à la clé KMS, quel que soit l'identifiant utilisé par la demande. ForAnyValue est satisfait lorsqu'au moins un alias de la clé correspond à alias/payments-*, et une clé sans alias ne correspond pas : toutes les clés paiements actuelles et futures sont utilisables.
  options:
    a:
      en: |-
        An alias cannot represent a KMS key in the Resource element; access by alias must be controlled with a condition key.
      fr: |-
        Un alias ne peut pas représenter une clé KMS dans l'élément Resource ; l'accès par alias doit être contrôlé par une clé de condition.
    b:
      en: |-
        kms:RequestAlias checks the alias used in the request, so calls that identify the key by its key ARN would be denied.
      fr: |-
        kms:RequestAlias vérifie l'alias utilisé dans la demande : les appels qui identifient la clé par son ARN seraient refusés.
    d:
      en: |-
        ForAllValues also matches keys that have no alias, and it fails for a payments key that has an additional alias outside the pattern, so it grants both too much and too little.
      fr: |-
        ForAllValues correspond aussi aux clés sans alias, et échoue pour une clé paiements qui possède un alias supplémentaire hors du modèle : il accorde à la fois trop et trop peu.
references:
  - title: AWS KMS condition keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/conditions-kms.html
  - title: ABAC for AWS KMS - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/abac.html
