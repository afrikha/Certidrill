id: scsc03-4c-recreated-role-trust
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The trust policy of the role Release in AnyCompany's production account allows sts:AssumeRole for the principal arn:aws:iam::111122223333:role/Deployer, which is in the tooling account. Last week, an infrastructure as code update in the tooling account deleted the Deployer role and created it again with the same name and the same identity-based policy, which allows sts:AssumeRole on the Release role. Since then, every AssumeRole call from Deployer fails with AccessDenied. In the production account, the Principal element of the trust policy now shows an identifier that starts with AROA instead of the role ARN.

    Which action will restore the access?
  fr: |
    La politique d'approbation du rôle Release, dans le compte de production d'AnyCompany, autorise sts:AssumeRole pour le principal arn:aws:iam::111122223333:role/Deployer, situé dans le compte d'outillage. La semaine dernière, une mise à jour d'infrastructure en tant que code dans le compte d'outillage a supprimé le rôle Deployer et l'a recréé avec le même nom et la même politique basée sur l'identité, qui autorise sts:AssumeRole sur le rôle Release. Depuis, chaque appel AssumeRole de Deployer échoue avec AccessDenied. Dans le compte de production, l'élément Principal de la politique d'approbation affiche maintenant un identifiant qui commence par AROA au lieu de l'ARN du rôle.

    Quelle action rétablit l'accès ?
body:
  options:
    - id: a
      text:
        en: |-
          Wait for IAM to propagate the principal ID of the recreated Deployer role to the trust policy of the Release role.
        fr: |-
          Attendre qu'IAM propage l'ID de principal du rôle Deployer recréé dans la politique d'approbation du rôle Release.
    - id: b
      text:
        en: |-
          Edit the trust policy of the Release role and replace the identifier in the Principal element with the ARN of the Deployer role.
        fr: |-
          Modifier la politique d'approbation du rôle Release et remplacer l'identifiant de l'élément Principal par l'ARN du rôle Deployer.
    - id: c
      text:
        en: |-
          Add an sts:TagSession statement to the identity-based policy of the recreated Deployer role in the tooling account.
        fr: |-
          Ajouter une instruction sts:TagSession à la politique basée sur l'identité du rôle Deployer recréé dans le compte d'outillage.
    - id: d
      text:
        en: |-
          Delete and recreate the Release role in the production account so that its trust policy is evaluated again.
        fr: |-
          Supprimer et recréer le rôle Release dans le compte de production pour que sa politique d'approbation soit à nouveau évaluée.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When a trust policy names a specific role, IAM stores the role's unique principal ID. A recreated role gets a new principal ID that does not match, and the old ID appears in the policy because AWS can no longer map it to an ARN. Entering the role ARN again makes IAM store the new principal ID.
    fr: |-
      Quand une politique d'approbation désigne un rôle précis, IAM enregistre l'ID de principal unique de ce rôle. Un rôle recréé reçoit un nouvel ID de principal qui ne correspond pas, et l'ancien ID apparaît dans la politique parce qu'AWS ne peut plus le relier à un ARN. Saisir à nouveau l'ARN du rôle fait enregistrer à IAM le nouvel ID de principal.
  options:
    a:
      en: |-
        The stored principal ID never changes by itself; the relationship stays broken until someone edits the trust policy.
      fr: |-
        L'ID de principal enregistré ne change jamais de lui-même ; la relation reste rompue tant que personne ne modifie la politique d'approbation.
    c:
      en: |-
        sts:TagSession is needed only to pass session tags; the call fails because the trust policy no longer trusts the new role.
      fr: |-
        sts:TagSession n'est nécessaire que pour transmettre des balises de session ; l'appel échoue parce que la politique d'approbation n'approuve plus le nouveau rôle.
    d:
      en: |-
        Recreating the Release role would produce a role with a new ID but the same kind of trust policy, and it would also break everything that trusts Release.
      fr: |-
        Recréer le rôle Release produirait un rôle avec un nouvel ID mais le même type de politique d'approbation, et casserait aussi tout ce qui approuve Release.
references:
  - title: "AWS JSON policy elements: Principal - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html
