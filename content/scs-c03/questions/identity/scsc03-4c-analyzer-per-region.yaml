id: scsc03-4c-analyzer-per-region
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany created an external access analyzer with the organization as the zone of trust in the us-east-1 Region. The analyzer reports an IAM role whose trust policy trusts an account outside the organization. However, an Amazon S3 bucket in eu-central-1 whose bucket policy has allowed public reads for three weeks has no finding.

    What should the security team do to get findings for the bucket?
  fr: |
    AnyCompany a créé un analyseur d'accès externe avec l'organisation comme zone de confiance dans la Région us-east-1. L'analyseur signale un rôle IAM dont la politique d'approbation approuve un compte extérieur à l'organisation. Pourtant, un compartiment Amazon S3 d'eu-central-1 dont la politique autorise les lectures publiques depuis trois semaines n'a aucun résultat.

    Que doit faire l'équipe de sécurité pour obtenir des résultats pour ce compartiment ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an external access analyzer with the organization as the zone of trust in eu-central-1.
        fr: |-
          Créer un analyseur d'accès externe avec l'organisation comme zone de confiance dans eu-central-1.
    - id: b
      text:
        en: |-
          Start a resource scan of the bucket from the us-east-1 analyzer to force the analysis of the bucket policy.
        fr: |-
          Lancer une analyse de ressource du compartiment depuis l'analyseur d'us-east-1 pour forcer l'analyse de la politique du compartiment.
    - id: c
      text:
        en: |-
          Replace the analyzer with one whose zone of trust is the account, because organization analyzers do not report public buckets.
        fr: |-
          Remplacer l'analyseur par un analyseur dont la zone de confiance est le compte, car les analyseurs d'organisation ne signalent pas les compartiments publics.
    - id: d
      text:
        en: |-
          Wait for the next account-level Block Public Access evaluation, which IAM Access Analyzer performs about every 6 hours.
        fr: |-
          Attendre la prochaine évaluation de Block Public Access au niveau du compte, qu'IAM Access Analyzer effectue environ toutes les 6 heures.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An external access analyzer analyzes only the resources in the Region where it is created, so it needs to exist in every Region that has supported resources. IAM roles are global, which is why the role finding appears in us-east-1 while the bucket in eu-central-1 is never analyzed.
    fr: |-
      Un analyseur d'accès externe n'analyse que les ressources de la Région où il est créé : il doit donc exister dans chaque Région qui contient des ressources prises en charge. Les rôles IAM sont globaux, ce qui explique que le résultat du rôle apparaisse dans us-east-1 alors que le compartiment d'eu-central-1 n'est jamais analysé.
  options:
    b:
      en: |-
        A rescan applies to resources in the analyzer's Region; the us-east-1 analyzer does not cover a bucket in eu-central-1.
      fr: |-
        Une nouvelle analyse s'applique aux ressources de la Région de l'analyseur ; l'analyseur d'us-east-1 ne couvre pas un compartiment d'eu-central-1.
    c:
      en: |-
        Analyzers with the organization as the zone of trust report public resources; the missing finding comes from the Region, not the zone of trust.
      fr: |-
        Les analyseurs dont la zone de confiance est l'organisation signalent les ressources publiques ; le résultat manquant vient de la Région, pas de la zone de confiance.
    d:
      en: |-
        The bucket has been public for three weeks, far longer than any analysis delay; no analyzer exists in its Region.
      fr: |-
        Le compartiment est public depuis trois semaines, bien plus longtemps que tout délai d'analyse ; aucun analyseur n'existe dans sa Région.
references:
  - title: IAM Access Analyzer supported resource types for external and internal access - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-resources.html
  - title: Using AWS Identity and Access Management Access Analyzer - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
