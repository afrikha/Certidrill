id: scsc03-4a-managed-ad-trust-outbound
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany deployed AWS Managed Microsoft AD in a VPC and is creating a forest trust with its self-managed domain in the data center, which is reachable through AWS Direct Connect. The on-premises firewall allows all required ports from the VPC, DNS forwarding is configured in both directions, and Kerberos preauthentication is enabled. The network ACLs of the directory subnets allow all traffic. Trust verification fails because the directory's domain controllers cannot reach the on-premises domain controllers.

    Which solution will resolve the issue?
  fr: |
    AnyCompany a déployé AWS Managed Microsoft AD dans un VPC et crée une approbation de forêt avec son domaine autogéré du centre de données, accessible par AWS Direct Connect. Le pare-feu sur site autorise tous les ports nécessaires depuis le VPC, le transfert DNS est configuré dans les deux sens, et la préauthentification Kerberos est activée. Les ACL réseau des sous-réseaux du répertoire autorisent tout le trafic. La vérification de l'approbation échoue car les contrôleurs de domaine du répertoire ne peuvent pas atteindre les contrôleurs de domaine sur site.

    Quelle solution résoudra le problème ?
body:
  options:
    - id: a
      text:
        en: "Add inbound rules for TCP and UDP 53, 88 and 389 from the on-premises CIDR range to the default security group of the VPC."
        fr: "Ajouter au groupe de sécurité par défaut du VPC des règles entrantes pour TCP et UDP 53, 88 et 389 depuis la plage CIDR sur site."
    - id: b
      text:
        en: "Disable Kerberos preauthentication for the user accounts in AWS Managed Microsoft AD that the forest trust uses during verification."
        fr: "Désactiver la préauthentification Kerberos pour les comptes d'utilisateur d'AWS Managed Microsoft AD utilisés par l'approbation de forêt lors de la vérification."
    - id: c
      text:
        en: "Add an outbound rule that allows all traffic to the on-premises CIDR range to the security group that AWS created for the directory controllers."
        fr: "Ajouter au groupe de sécurité créé par AWS pour les contrôleurs du répertoire une règle sortante qui autorise tout le trafic vers la plage CIDR sur site."
    - id: d
      text:
        en: "Create an AD Connector in the same VPC, and point the forest trust at the AD Connector instead of at the directory."
        fr: "Créer un AD Connector dans le même VPC, et faire pointer l'approbation de forêt vers l'AD Connector plutôt que vers le répertoire."
answer: { optionId: c }
explanation:
  correct:
    en: "When AWS Managed Microsoft AD is prepared for a trust, the security group that AWS created for the directory's domain controllers must allow outbound traffic to the self-managed network. Without that outbound rule, the controllers cannot reach the on-premises domain to verify the trust, whatever the firewall and network ACLs allow."
    fr: "Lors de la préparation d'AWS Managed Microsoft AD à une approbation, le groupe de sécurité créé par AWS pour les contrôleurs de domaine du répertoire doit autoriser le trafic sortant vers le réseau autogéré. Sans cette règle sortante, les contrôleurs ne peuvent pas atteindre le domaine sur site pour vérifier l'approbation, quoi qu'autorisent le pare-feu et les ACL réseau."
  options:
    a:
      en: "Inbound rules on another security group do not let the directory controllers send traffic out."
      fr: "Des règles entrantes sur un autre groupe de sécurité ne permettent pas aux contrôleurs du répertoire d'émettre du trafic."
    b:
      en: "Kerberos preauthentication must stay enabled for the trust, and it is not the cause of a connectivity failure."
      fr: "La préauthentification Kerberos doit rester activée pour l'approbation, et elle n'est pas la cause d'un échec de connectivité."
    d:
      en: "AD Connector is a proxy for authentication requests; it cannot be a party to a forest trust."
      fr: "AD Connector est un proxy pour les demandes d'authentification ; il ne peut pas être partie à une approbation de forêt."
references:
  - title: "Step 2: Prepare your AWS Managed Microsoft AD"
    url: https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_tutorial_setup_trust_prepare_mad.html
