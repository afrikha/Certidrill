id: scsc03-4b-idc-abac-precedence
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany connects AWS IAM Identity Center to an external SAML identity provider that does not support SCIM, so administrators maintain user attributes manually in the Identity Center directory. Attributes for access control are enabled, with a Department key mapped to the department attribute of the Identity Center directory. The IdP also sends the SAML attribute https://aws.amazon.com/SAML/Attributes/AccessControl:Department with the current value from the HR system. Users who changed departments still receive access based on their old department. The security team wants access to follow the value that the IdP sends, with the least administrative effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany connecte AWS IAM Identity Center à un fournisseur d'identité SAML externe qui ne prend pas en charge SCIM : les administrateurs gèrent manuellement les attributs des utilisateurs dans l'annuaire Identity Center. Les attributs pour le contrôle d'accès sont activés, avec une clé Department associée à l'attribut department de l'annuaire Identity Center. L'IdP envoie aussi l'attribut SAML https://aws.amazon.com/SAML/Attributes/AccessControl:Department avec la valeur actuelle issue du système RH. Les utilisateurs qui ont changé de service reçoivent toujours un accès fondé sur leur ancien service. L'équipe de sécurité veut que l'accès suive la valeur envoyée par l'IdP, avec le moins d'effort d'administration possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the IdP to also send the SAML attribute https://aws.amazon.com/SAML/Attributes/TransitiveTagKeys with the value Department.
        fr: |-
          Configurer l'IdP pour qu'il envoie aussi l'attribut SAML https://aws.amazon.com/SAML/Attributes/TransitiveTagKeys avec la valeur Department.
    - id: b
      text:
        en: |-
          Reduce the session duration of the permission sets to one hour so that users receive the new Department value sooner.
        fr: |-
          Réduire la durée de session des ensembles d'autorisations à une heure pour que les utilisateurs reçoivent plus tôt la nouvelle valeur de Department.
    - id: c
      text:
        en: |-
          Keep attributes for access control enabled, and remove the Department mapping from the Attributes for access control page.
        fr: |-
          Laisser les attributs pour le contrôle d'accès activés, et supprimer l'association Department de la page Attributes for access control.
    - id: d
      text:
        en: |-
          Change the permission set policies to compare resource tags with ${aws:PrincipalTag/AccessControl:Department} instead of ${aws:PrincipalTag/Department}.
        fr: |-
          Modifier les politiques des ensembles d'autorisations pour comparer les balises de ressource à ${aws:PrincipalTag/AccessControl:Department} au lieu de ${aws:PrincipalTag/Department}.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When an Identity Center mapping exists for the same key that the IdP sends in the SAML assertion, the Identity Center directory value takes precedence and replaces the IdP value. Removing the mapping lets Identity Center pass the AccessControl:Department attribute from the assertion as the Department session tag.
    fr: |-
      Lorsqu'une association Identity Center existe pour la même clé que celle envoyée par l'IdP dans l'assertion SAML, la valeur de l'annuaire Identity Center est prioritaire et remplace celle de l'IdP. Supprimer l'association permet à Identity Center de transmettre l'attribut AccessControl:Department de l'assertion comme balise de session Department.
  options:
    a:
      en: |-
        Transitive tags keep session tags through role chaining; they do not change which source provides the Department value.
      fr: |-
        Les balises transitives conservent les balises de session lors du chaînage de rôles ; elles ne changent pas la source qui fournit la valeur de Department.
    b:
      en: |-
        The stale value comes from the directory mapping, which still takes precedence at every new sign-in, so shorter sessions do not fix it.
      fr: |-
        La valeur obsolète provient de l'association de l'annuaire, qui reste prioritaire à chaque nouvelle connexion : des sessions plus courtes ne corrigent rien.
    d:
      en: |-
        The session tag key is the part after AccessControl: in the attribute name, so the tag is Department and the changed variable would never resolve.
      fr: |-
        La clé de la balise de session est la partie qui suit AccessControl: dans le nom de l'attribut : la balise est Department, et la variable modifiée ne serait jamais résolue.
references:
  - title: Attributes for access control - AWS IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/attributesforaccesscontrol.html
