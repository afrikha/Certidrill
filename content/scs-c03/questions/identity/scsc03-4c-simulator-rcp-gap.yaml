id: scsc03-4c-simulator-rcp-gap
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has accounts A and B in the same organization in AWS Organizations. An application on an Amazon EC2 instance in account A uses its instance profile role to read a secret in account B. The application calls the public AWS Secrets Manager endpoint through a NAT gateway and does not chain roles. A security engineer runs the IAM policy simulator through the AWS CLI in principal mode for the role, supplies the secret's resource-based policy, and gets the result allowed. In production, the GetSecretValue call is denied.

    Which policy could deny the request without the simulation showing the deny?
  fr: |
    AnyCompany possède les comptes A et B dans la même organisation AWS Organizations. Une application sur une instance Amazon EC2 du compte A utilise le rôle de son profil d'instance pour lire un secret du compte B. L'application appelle le point de terminaison public d'AWS Secrets Manager via une passerelle NAT et n'enchaîne pas de rôles. Un ingénieur sécurité exécute le simulateur de politiques IAM avec l'AWS CLI en mode principal pour le rôle, fournit la politique basée sur les ressources du secret et obtient le résultat allowed. En production, l'appel GetSecretValue est refusé.

    Quelle politique pourrait refuser la requête sans que la simulation affiche ce refus ?
body:
  options:
    - id: a
      text:
        en: |-
          A service control policy (SCP) attached to the OU of account A that denies secretsmanager:GetSecretValue on secrets outside the account.
        fr: |-
          Une politique de contrôle des services (SCP) attachée à l'unité d'organisation du compte A, qui refuse secretsmanager:GetSecretValue sur les secrets extérieurs au compte.
    - id: b
      text:
        en: |-
          A permissions boundary attached to the instance profile role that allows only Amazon S3 and Amazon CloudWatch actions.
        fr: |-
          Une limite d'autorisations attachée au rôle du profil d'instance, qui n'autorise que des actions Amazon S3 et Amazon CloudWatch.
    - id: c
      text:
        en: |-
          A resource control policy (RCP) attached to the OU of account B that denies access to secrets when a condition on the request is not met.
        fr: |-
          Une politique de contrôle des ressources (RCP) attachée à l'unité d'organisation du compte B, qui refuse l'accès aux secrets quand une condition sur la requête n'est pas remplie.
    - id: d
      text:
        en: |-
          A Deny statement in the secret's resource-based policy that applies to principals from account A.
        fr: |-
          Une instruction Deny dans la politique basée sur les ressources du secret, qui s'applique aux principaux du compte A.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The IAM policy simulator evaluates identity-based policies, a permissions boundary, SCPs for accounts in an organization, and resource-based policies that you supply, but it does not support resource control policies. An RCP on the account that owns the secret can therefore deny the live request while the simulation returns allowed.
    fr: |-
      Le simulateur de politiques IAM évalue les politiques basées sur l'identité, une limite d'autorisations, les SCP des comptes d'une organisation et les politiques basées sur les ressources que vous fournissez, mais il ne prend pas en charge les politiques de contrôle des ressources. Une RCP sur le compte propriétaire du secret peut donc refuser la requête réelle alors que la simulation renvoie allowed.
  options:
    a:
      en: |-
        The simulator evaluates SCPs when the account belongs to an organization, so an SCP deny would appear in the result.
      fr: |-
        Le simulateur évalue les SCP quand le compte appartient à une organisation : un refus de SCP apparaîtrait dans le résultat.
    b:
      en: |-
        In principal mode, the simulator includes the permissions boundary attached to the role, so this implicit deny would appear in the result.
      fr: |-
        En mode principal, le simulateur inclut la limite d'autorisations attachée au rôle : ce refus implicite apparaîtrait dans le résultat.
    d:
      en: |-
        The engineer supplied the secret's resource-based policy, so its Deny statement would be part of the simulation.
      fr: |-
        L'ingénieur a fourni la politique basée sur les ressources du secret : son instruction Deny ferait partie de la simulation.
references:
  - title: IAM policy testing with the IAM policy simulator - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_testing-policies.html
  - title: Resource control policies (RCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
