id: scsc03-4b-rbac-idc-groups
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 300 engineers and uses AWS IAM Identity Center with an external identity provider that synchronizes users and groups through SCIM. Engineers in the IdP group NetOps need network administrator permissions in 12 networking accounts. Joiners and leavers are managed only in the IdP. The security team wants the LEAST administrative effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany compte 300 ingénieurs et utilise AWS IAM Identity Center avec un fournisseur d'identité externe qui synchronise les utilisateurs et les groupes par SCIM. Les ingénieurs du groupe NetOps de l'IdP ont besoin d'autorisations d'administrateur réseau dans 12 comptes réseau. Les arrivées et les départs sont gérés uniquement dans l'IdP. L'équipe de sécurité veut l'effort d'administration le PLUS FAIBLE.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a permission set with the NetworkAdministrator job function policy, and assign it to each NetOps engineer individually in the 12 accounts.
        fr: |-
          Créer un ensemble d'autorisations avec la politique de fonction professionnelle NetworkAdministrator, et l'attribuer individuellement à chaque ingénieur NetOps dans les 12 comptes.
    - id: b
      text:
        en: |-
          Create IAM users for the NetOps engineers in each of the 12 accounts, and add them to an IAM group that has the NetworkAdministrator policy.
        fr: |-
          Créer des utilisateurs IAM pour les ingénieurs NetOps dans chacun des 12 comptes, et les ajouter à un groupe IAM qui dispose de la politique NetworkAdministrator.
    - id: c
      text:
        en: |-
          Create a permission set with the NetworkAdministrator job function policy, and assign it to the synchronized NetOps group in the 12 accounts.
        fr: |-
          Créer un ensemble d'autorisations avec la politique de fonction professionnelle NetworkAdministrator, et l'attribuer au groupe NetOps synchronisé dans les 12 comptes.
    - id: d
      text:
        en: |-
          Create an IAM SAML identity provider and a NetworkAdministrator role in each of the 12 accounts, and configure the IdP to map NetOps to the roles.
        fr: |-
          Créer un fournisseur d'identité SAML IAM et un rôle NetworkAdministrator dans chacun des 12 comptes, et configurer l'IdP pour associer NetOps à ces rôles.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A permission set is a reusable role template: when it is assigned to a group in several accounts, IAM Identity Center creates and maintains the roles. Because SCIM keeps group membership in sync with the IdP, joiners and leavers gain or lose access without any change in AWS.
    fr: |-
      Un ensemble d'autorisations est un modèle de rôle réutilisable : lorsqu'il est attribué à un groupe dans plusieurs comptes, IAM Identity Center crée et maintient les rôles. Comme SCIM synchronise l'appartenance aux groupes avec l'IdP, les arrivants et les partants obtiennent ou perdent l'accès sans aucune modification dans AWS.
  options:
    a:
      en: |-
        Individual assignments must be updated for every joiner and leaver, which adds effort that a group assignment avoids.
      fr: |-
        Les attributions individuelles doivent être mises à jour à chaque arrivée et départ, ce qui ajoute un effort qu'une attribution de groupe évite.
    b:
      en: |-
        IAM users in 12 accounts create long-term credentials and duplicate the user lifecycle outside the IdP.
      fr: |-
        Des utilisateurs IAM dans 12 comptes créent des informations d'identification à long terme et dupliquent le cycle de vie des utilisateurs hors de l'IdP.
    d:
      en: |-
        A separate SAML federation in each account works but needs more configuration and maintenance than one permission set assigned through Identity Center.
      fr: |-
        Une fédération SAML distincte dans chaque compte fonctionne, mais demande plus de configuration et de maintenance qu'un seul ensemble d'autorisations attribué par Identity Center.
references:
  - title: Manage AWS accounts with permission sets - AWS IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html
