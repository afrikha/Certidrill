id: scsc03-4b-path-set-cli
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security engineer must create an IAM role named AuditCollector under the path /security/automation/ so that existing policies that reference arn:aws:iam::111122223333:role/security/* apply to it. In the IAM console, the engineer cannot find any field to set a path.

    How should the engineer create the role?
  fr: |
    Un ingénieur sécurité doit créer un rôle IAM nommé AuditCollector sous le chemin /security/automation/ afin que les politiques existantes qui référencent arn:aws:iam::111122223333:role/security/* s'appliquent à ce rôle. Dans la console IAM, l'ingénieur ne trouve aucun champ pour définir un chemin.

    Comment l'ingénieur doit-il créer le rôle ?
body:
  options:
    - id: a
      text:
        en: |-
          Create the role in the IAM console, and then edit the role's settings to add the path /security/automation/.
        fr: |-
          Créer le rôle dans la console IAM, puis modifier les paramètres du rôle pour ajouter le chemin /security/automation/.
    - id: b
      text:
        en: |-
          Create the role with the AWS CLI by running the aws iam create-role command with the --path /security/automation/ parameter.
        fr: |-
          Créer le rôle avec l'AWS CLI en exécutant la commande aws iam create-role avec le paramètre --path /security/automation/.
    - id: c
      text:
        en: |-
          Create the role in the IAM console with the role name security/automation/AuditCollector.
        fr: |-
          Créer le rôle dans la console IAM avec le nom de rôle security/automation/AuditCollector.
    - id: d
      text:
        en: |-
          Create the role in the IAM console, and then add a tag with the key path and the value /security/automation/.
        fr: |-
          Créer le rôle dans la console IAM, puis ajouter une balise avec la clé path et la valeur /security/automation/.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Paths cannot be created or changed in the AWS Management Console; they are set with the IAM API, the AWS CLI, Tools for Windows PowerShell, or AWS CloudFormation. Creating the role with create-role and --path puts the path in the role ARN, so policies that use role/security/* match it.
    fr: |-
      Les chemins ne peuvent pas être créés ni modifiés dans l'AWS Management Console ; ils sont définis avec l'API IAM, l'AWS CLI, Tools for Windows PowerShell ou AWS CloudFormation. Créer le rôle avec create-role et --path place le chemin dans l'ARN du rôle : les politiques qui utilisent role/security/* lui correspondent.
  options:
    a:
      en: |-
        The console has no setting to add or change a path, before or after the role is created.
      fr: |-
        La console ne propose aucun paramètre pour ajouter ou modifier un chemin, ni avant ni après la création du rôle.
    c:
      en: |-
        A role name cannot contain slashes; the path is a separate attribute of the role, not part of its name.
      fr: |-
        Un nom de rôle ne peut pas contenir de barres obliques ; le chemin est un attribut distinct du rôle, pas une partie de son nom.
    d:
      en: |-
        A tag is metadata on the role; it does not change the role ARN, so path-based resource ARNs do not match the role.
      fr: |-
        Une balise est une métadonnée du rôle ; elle ne modifie pas l'ARN du rôle, donc les ARN de ressource fondés sur le chemin ne lui correspondent pas.
references:
  - title: IAM identifiers - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
