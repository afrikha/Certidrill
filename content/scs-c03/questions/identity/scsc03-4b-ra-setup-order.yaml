id: scsc03-4b-ra-setup-order
objective: "4.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's on-premises Linux servers have X.509 certificates issued by the company's own enterprise certificate authority (CA), which is not in AWS. The servers call AWS APIs with IAM user access keys. The security team wants the servers to obtain temporary credentials from IAM Roles Anywhere instead. The role trust policy must reference the trust anchor in an aws:SourceArn condition.

    Which four actions should the security engineer perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Les serveurs Linux sur site d'AnyCompany disposent de certificats X.509 émis par l'autorité de certification (CA) d'entreprise de la société, qui n'est pas dans AWS. Les serveurs appellent les API AWS avec des clés d'accès d'utilisateurs IAM. L'équipe de sécurité veut que les serveurs obtiennent plutôt des informations d'identification temporaires auprès d'IAM Roles Anywhere. La politique d'approbation du rôle doit référencer l'ancre de confiance (trust anchor) dans une condition aws:SourceArn.

    Quelles sont les quatre actions que l'ingénieur sécurité doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: helper
      text:
        en: "Configure credential_process in the AWS config file of each server to run aws_signing_helper with the certificate, private key, trust anchor ARN, profile ARN, and role ARN."
        fr: "Configurer credential_process dans le fichier de configuration AWS de chaque serveur pour exécuter aws_signing_helper avec le certificat, la clé privée, l'ARN de l'ancre de confiance, l'ARN du profil et l'ARN du rôle."
    - id: oidc
      text:
        en: "Create an IAM OIDC identity provider that points to the enterprise CA."
        fr: "Créer un fournisseur d'identité OIDC IAM qui pointe vers la CA d'entreprise."
    - id: anchor
      text:
        en: "Create a trust anchor with an external certificate bundle that contains the enterprise CA certificate."
        fr: "Créer une ancre de confiance avec un bundle de certificats externe qui contient le certificat de la CA d'entreprise."
    - id: profile
      text:
        en: "Create an IAM Roles Anywhere profile that lists the role."
        fr: "Créer un profil IAM Roles Anywhere qui liste le rôle."
    - id: keys
      text:
        en: "Store the IAM user access keys in AWS Secrets Manager with automatic rotation."
        fr: "Stocker les clés d'accès des utilisateurs IAM dans AWS Secrets Manager avec une rotation automatique."
    - id: role
      text:
        en: "Create an IAM role whose trust policy allows rolesanywhere.amazonaws.com to call sts:AssumeRole, sts:TagSession, and sts:SetSourceIdentity when aws:SourceArn equals the trust anchor ARN."
        fr: "Créer un rôle IAM dont la politique d'approbation autorise rolesanywhere.amazonaws.com à appeler sts:AssumeRole, sts:TagSession et sts:SetSourceIdentity lorsque aws:SourceArn est égal à l'ARN de l'ancre de confiance."
answer:
  sequence: [ anchor, role, profile, helper ]
explanation:
  correct:
    en: "The trust anchor comes first because it establishes trust with the CA and its ARN is needed in the role's aws:SourceArn condition. The role is then created with a trust policy for the rolesanywhere.amazonaws.com service principal, the profile that lists the role is created next, and finally each server runs the credential helper with its certificate and key and the three ARNs to obtain temporary credentials."
    fr: "L'ancre de confiance vient en premier, car elle établit la confiance avec la CA et son ARN est nécessaire dans la condition aws:SourceArn du rôle. Le rôle est ensuite créé avec une politique d'approbation pour le principal de service rolesanywhere.amazonaws.com, puis le profil qui liste le rôle, et enfin chaque serveur exécute l'assistant d'informations d'identification avec son certificat, sa clé et les trois ARN pour obtenir des informations d'identification temporaires."
  options:
    oidc:
      en: "IAM Roles Anywhere authenticates workloads with X.509 certificates against a trust anchor; an OIDC identity provider is used for web identity federation and is not involved."
      fr: "IAM Roles Anywhere authentifie les charges de travail avec des certificats X.509 par rapport à une ancre de confiance ; un fournisseur d'identité OIDC sert à la fédération d'identité web et n'intervient pas."
    keys:
      en: "The goal is to remove the long-term access keys; rotating them in Secrets Manager keeps long-term credentials on the servers' path to AWS."
      fr: "L'objectif est de supprimer les clés d'accès à long terme ; les faire tourner dans Secrets Manager conserve des informations d'identification à long terme dans l'accès des serveurs à AWS."
references:
  - title: Getting started with IAM Roles Anywhere - IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/getting-started.html
  - title: Get temporary security credentials from IAM Roles Anywhere - IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/credential-helper.html
