id: scsc03-4b-external-id-vendor
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is onboarding a third-party cost monitoring service. The vendor's software runs in the vendor's account 999988887777 and assumes a role in each customer account. The vendor serves thousands of customers from the same software and the same IAM role. The security team must prevent another customer of the vendor from making the vendor's software access AnyCompany's account by supplying the ARN of AnyCompany's role.

    Which solution will meet these requirements?
  fr: |
    AnyCompany intègre un service tiers de suivi des coûts. Le logiciel du fournisseur s'exécute dans le compte 999988887777 du fournisseur et endosse un rôle dans chaque compte client. Le fournisseur sert des milliers de clients avec le même logiciel et le même rôle IAM. L'équipe de sécurité doit empêcher un autre client du fournisseur d'amener le logiciel du fournisseur à accéder au compte d'AnyCompany en fournissant l'ARN du rôle d'AnyCompany.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a StringEquals condition on sts:ExternalId to the role trust policy, with the unique external ID that the vendor generated for AnyCompany.
        fr: |-
          Ajouter à la politique d'approbation du rôle une condition StringEquals sur sts:ExternalId, avec l'ID externe unique que le fournisseur a généré pour AnyCompany.
    - id: b
      text:
        en: |-
          Add an IpAddress condition on aws:SourceIp to the role trust policy, with the IP address ranges that the vendor publishes for its service.
        fr: |-
          Ajouter à la politique d'approbation du rôle une condition IpAddress sur aws:SourceIp, avec les plages d'adresses IP que le fournisseur publie pour son service.
    - id: c
      text:
        en: |-
          Generate a random external ID in AnyCompany, store it in AWS Secrets Manager, give it to the vendor, and require it in the role trust policy.
        fr: |-
          Générer un ID externe aléatoire chez AnyCompany, le stocker dans AWS Secrets Manager, le transmettre au fournisseur et l'exiger dans la politique d'approbation du rôle.
    - id: d
      text:
        en: |-
          Replace the vendor's account principal in the role trust policy with the ARN of the specific IAM role that the vendor's software uses.
        fr: |-
          Remplacer, dans la politique d'approbation du rôle, le principal de compte du fournisseur par l'ARN du rôle IAM précis qu'utilise le logiciel du fournisseur.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      This is the cross-account confused deputy problem. The vendor generates and controls a unique external ID for each customer and sends it in every AssumeRole call made for that customer. A request made on behalf of another customer carries that customer's external ID, so the condition in AnyCompany's trust policy fails.
    fr: |-
      Il s'agit du problème du député confus entre comptes. Le fournisseur génère et contrôle un ID externe unique pour chaque client et l'envoie dans chaque appel AssumeRole effectué pour ce client. Une demande faite pour le compte d'un autre client porte l'ID externe de cet autre client : la condition de la politique d'approbation d'AnyCompany échoue.
  options:
    b:
      en: |-
        Requests made for every customer come from the same vendor infrastructure and IP ranges, so the condition does not distinguish AnyCompany from other customers.
      fr: |-
        Les demandes faites pour tous les clients proviennent de la même infrastructure et des mêmes plages IP du fournisseur : la condition ne distingue pas AnyCompany des autres clients.
    c:
      en: |-
        The external ID must be generated and controlled by the vendor so that it is unique per customer and cannot be chosen by a customer; customers should not create it themselves.
      fr: |-
        L'ID externe doit être généré et contrôlé par le fournisseur afin d'être unique par client et de ne pas pouvoir être choisi par un client ; les clients ne doivent pas le créer eux-mêmes.
    d:
      en: |-
        The vendor uses the same role for all customers, so restricting the principal to that role does not stop it from acting for another customer.
      fr: |-
        Le fournisseur utilise le même rôle pour tous les clients : restreindre le principal à ce rôle ne l'empêche pas d'agir pour un autre client.
references:
  - title: The confused deputy problem - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/confused-deputy.html
