id: scsc03-4c-role-used-services
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The IAM role BatchWorker in an AnyCompany account has the AWS managed policy PowerUserAccess attached. Before the security team reduces the role's permissions, it must find out which AWS services the role has used during the past 90 days. The account has an AWS CloudTrail trail that delivers management events to an Amazon S3 bucket in the same account.

    Which solutions will provide this information? (Choose two.)

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le rôle IAM BatchWorker d'un compte d'AnyCompany a la politique gérée par AWS PowerUserAccess attachée. Avant de réduire les autorisations du rôle, l'équipe de sécurité doit savoir quels services AWS le rôle a utilisés au cours des 90 derniers jours. Le compte possède un journal de suivi AWS CloudTrail qui livre les événements de gestion dans un compartiment Amazon S3 du même compte.

    Quelles solutions fournissent cette information ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Generate the IAM credential report, and read the last-used service columns for the role.", fr: "Générer le rapport d'informations d'identification IAM, puis lire les colonnes de dernier service utilisé pour le rôle." } }
    - { id: b, text: { en: "Review the last accessed information of the role in the IAM console.", fr: "Examiner les informations de dernier accès du rôle dans la console IAM." } }
    - { id: c, text: { en: "Run the IAM policy simulator in principal mode for the role on all the actions of PowerUserAccess.", fr: "Exécuter le simulateur de politiques IAM en mode principal pour le rôle sur toutes les actions de PowerUserAccess." } }
    - { id: d, text: { en: "Generate a policy for the role with IAM Access Analyzer from the trail for the past 90 days.", fr: "Générer une politique pour le rôle avec IAM Access Analyzer à partir du journal de suivi sur les 90 derniers jours." } }
    - { id: e, text: { en: "Create an external access analyzer for the account, and review the findings for the role.", fr: "Créer un analyseur d'accès externe pour le compte, puis examiner les résultats pour le rôle." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Last accessed information shows, for a role, the services allowed by its identity-based policies and when each was last accessed, kept for at least 400 days. IAM Access Analyzer policy generation analyzes up to 90 days of the CloudTrail trail and builds a policy that contains the services, and for many services the actions, that the role used.
    fr: |-
      Les informations de dernier accès montrent, pour un rôle, les services autorisés par ses politiques basées sur l'identité et la date de leur dernier accès, conservées au moins 400 jours. La génération de politiques d'IAM Access Analyzer analyse jusqu'à 90 jours du journal de suivi CloudTrail et construit une politique qui contient les services, et pour de nombreux services les actions, utilisés par le rôle.
  options:
    a:
      en: |-
        The credential report lists only IAM users and the root user, with their passwords, access keys and MFA devices; roles are not in it.
      fr: |-
        Le rapport d'informations d'identification ne liste que les utilisateurs IAM et l'utilisateur racine, avec leurs mots de passe, clés d'accès et dispositifs MFA ; les rôles n'y figurent pas.
    c:
      en: |-
        The simulator shows which actions the policies allow, not which actions the role actually used.
      fr: |-
        Le simulateur montre quelles actions les politiques autorisent, et non celles que le rôle a réellement utilisées.
    e:
      en: |-
        An external access analyzer reports who outside the zone of trust can assume the role; it does not track the role's activity.
      fr: |-
        Un analyseur d'accès externe signale qui, hors de la zone de confiance, peut assumer le rôle ; il ne suit pas l'activité du rôle.
references:
  - title: Refine permissions in AWS using last accessed information - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_last-accessed.html
  - title: IAM Access Analyzer policy generation - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-policy-generation.html
