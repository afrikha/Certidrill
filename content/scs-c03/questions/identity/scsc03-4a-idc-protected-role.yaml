id: scsc03-4a-idc-protected-role
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator in a member account of AnyCompany's organization tries to attach a policy to the IAM role AWSReservedSSO_Developer_0123456789abcdef in the IAM console, to give developers access to a new Amazon SQS queue. The request fails with the error Cannot perform the operation on the protected role.

    What should the administrator do to give developers the access?
  fr: |
    Un administrateur d'un compte membre de l'organisation d'AnyCompany tente d'attacher une politique au rôle IAM AWSReservedSSO_Developer_0123456789abcdef dans la console IAM, pour donner aux développeurs l'accès à une nouvelle file d'attente Amazon SQS. La requête échoue avec l'erreur Cannot perform the operation on the protected role.

    Que doit faire l'administrateur pour donner cet accès aux développeurs ?
body:
  options:
    - id: a
      text:
        en: "Have the Developer permission set updated in IAM Identity Center from the management account, and provision it to the member account."
        fr: "Faire mettre à jour l'ensemble d'autorisations Developer dans IAM Identity Center depuis le compte de gestion, et le provisionner dans le compte membre."
    - id: b
      text:
        en: "Remove the permissions boundary of the role in the member account, and then attach the policy to the role again."
        fr: "Retirer la limite d'autorisations du rôle dans le compte membre, puis attacher de nouveau la politique au rôle."
    - id: c
      text:
        en: "Remove the permission set assignment from the member account so that the role becomes editable, and then attach the policy."
        fr: "Supprimer l'attribution de l'ensemble d'autorisations dans le compte membre pour que le rôle devienne modifiable, puis attacher la politique."
    - id: d
      text:
        en: "Add sqs:* to the SCP that is attached to the member account's OU so that the role receives the permission to use the queue."
        fr: "Ajouter sqs:* à la SCP attachée à l'unité d'organisation du compte membre pour que le rôle reçoive l'autorisation d'utiliser la file d'attente."
answer: { optionId: a }
explanation:
  correct:
    en: "Roles whose names start with AWSReservedSSO_ are created and managed by IAM Identity Center. They can be modified only through the permission set in the IAM Identity Center console of the management account, which then pushes the change to the accounts."
    fr: "Les rôles dont le nom commence par AWSReservedSSO_ sont créés et gérés par IAM Identity Center. Ils ne peuvent être modifiés que par l'ensemble d'autorisations dans la console IAM Identity Center du compte de gestion, qui pousse ensuite la modification dans les comptes."
  options:
    b:
      en: "The error comes from the role's protection, not from a permissions boundary."
      fr: "L'erreur provient de la protection du rôle, pas d'une limite d'autorisations."
    c:
      en: "Removing the assignment removes the developers' access through the role instead of making the role editable."
      fr: "Supprimer l'attribution retire l'accès des développeurs par ce rôle au lieu de rendre le rôle modifiable."
    d:
      en: "SCPs only limit the maximum permissions; they never grant access."
      fr: "Les SCP ne font que limiter les autorisations maximales ; elles n'accordent jamais d'accès."
references:
  - title: Troubleshooting IAM Identity Center issues
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/troubleshooting.html
