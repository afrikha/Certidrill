id: scsc03-4c-ebs-ami-public-sharing
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An investigation at AnyCompany found Amazon EBS snapshots that are publicly shared in several member accounts and Regions of its organization. No AMI is public. The security team requires that the existing public snapshots stop being publicly accessible immediately, and that no account can publicly share snapshots or AMIs in the future. Administrators of member accounts must not be able to change these settings. The solution must have the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une enquête chez AnyCompany a trouvé des instantanés Amazon EBS partagés publiquement dans plusieurs comptes membres et Régions de son organisation. Aucune AMI n'est publique. L'équipe de sécurité exige que les instantanés publics existants cessent immédiatement d'être accessibles publiquement, et qu'aucun compte ne puisse à l'avenir partager publiquement des instantanés ou des AMI. Les administrateurs des comptes membres ne doivent pas pouvoir modifier ces paramètres. La solution doit avoir le MOINS de charge opérationnelle.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach an EC2 declarative policy that sets snapshot_block_public_access to block_new_sharing.", fr: "Attacher une politique déclarative EC2 qui définit snapshot_block_public_access sur block_new_sharing." } }
    - { id: b, text: { en: "Attach an EC2 declarative policy that sets snapshot_block_public_access to block_all_sharing.", fr: "Attacher une politique déclarative EC2 qui définit snapshot_block_public_access sur block_all_sharing." } }
    - { id: c, text: { en: "Attach an EC2 declarative policy that sets image_block_public_access to block_new_sharing.", fr: "Attacher une politique déclarative EC2 qui définit image_block_public_access sur block_new_sharing." } }
    - { id: d, text: { en: "Attach a service control policy (SCP) that denies ec2:ModifySnapshotAttribute and ec2:ModifyImageAttribute to all principals.", fr: "Attacher une politique de contrôle des services (SCP) qui refuse ec2:ModifySnapshotAttribute et ec2:ModifyImageAttribute à tous les principaux." } }
    - { id: e, text: { en: "Deploy the AWS Config managed rule ebs-snapshot-public-restorable-check with an AWS Systems Manager Automation remediation in every account and Region.", fr: "Déployer la règle gérée AWS Config ebs-snapshot-public-restorable-check avec une correction AWS Systems Manager Automation dans chaque compte et chaque Région." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      In block_all_sharing mode, block public access for EBS snapshots blocks new public sharing and treats snapshots that are already public as private. Block public access for AMIs blocks new public sharing of AMIs, which is enough because no AMI is public. An EC2 declarative policy applies both settings across accounts and Regions, and member accounts cannot change them while the policy is in use.
    fr: |-
      En mode block_all_sharing, le blocage de l'accès public aux instantanés EBS bloque les nouveaux partages publics et traite comme privés les instantanés déjà publics. Le blocage de l'accès public aux AMI bloque les nouveaux partages publics d'AMI, ce qui suffit puisqu'aucune AMI n'est publique. Une politique déclarative EC2 applique les deux paramètres dans les comptes et les Régions, et les comptes membres ne peuvent pas les modifier tant que la politique est en vigueur.
  options:
    a:
      en: |-
        block_new_sharing prevents only new public sharing; the snapshots that are already public stay publicly available.
      fr: |-
        block_new_sharing n'empêche que les nouveaux partages publics ; les instantanés déjà publics restent accessibles publiquement.
    d:
      en: |-
        An SCP prevents new sharing changes but does nothing to the snapshots that are already public, and it also blocks legitimate private sharing.
      fr: |-
        Une SCP empêche de nouvelles modifications de partage mais ne fait rien aux instantanés déjà publics, et elle bloque aussi le partage privé légitime.
    e:
      en: |-
        A detective rule with remediation in every account and Region adds much more operational overhead, and it does not prevent public sharing of AMIs.
      fr: |-
        Une règle de détection avec correction dans chaque compte et chaque Région ajoute bien plus de charge opérationnelle, et elle n'empêche pas le partage public d'AMI.
references:
  - title: Block public access for Amazon EBS snapshots - Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/block-public-access-snapshots.html
  - title: EC2 policy syntax and examples - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_declarative_syntax.html
