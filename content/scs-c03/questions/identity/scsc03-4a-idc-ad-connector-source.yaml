id: scsc03-4a-idc-ad-connector-source
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has a self-managed Active Directory domain in its data center, connected to AWS through AWS Direct Connect. The company is enabling IAM Identity Center in the management account of its organization. Employees must sign in to the AWS access portal with their existing domain credentials, and authentication requests must be forwarded to the on-premises domain controllers. The company does not want to deploy or operate another directory in AWS and does not want passwords to be synchronized to AWS.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany possède un domaine Active Directory autogéré dans son centre de données, relié à AWS par AWS Direct Connect. L'entreprise active IAM Identity Center dans le compte de gestion de son organisation. Les employés doivent se connecter au portail d'accès AWS avec leurs informations d'identification de domaine existantes, et les demandes d'authentification doivent être transmises aux contrôleurs de domaine sur site. L'entreprise ne veut ni déployer ni exploiter un autre répertoire dans AWS, et ne veut pas que les mots de passe soient synchronisés vers AWS.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Create an AD Connector in a management account VPC that reaches the on-premises domain controllers, and select it as the Active Directory identity source."
        fr: "Créer un AD Connector dans un VPC du compte de gestion qui atteint les contrôleurs de domaine sur site, et le sélectionner comme source d'identité Active Directory."
    - id: b
      text:
        en: "Deploy AWS Managed Microsoft AD in the management account, create a forest trust with the on-premises domain, and select the managed directory as the identity source."
        fr: "Déployer AWS Managed Microsoft AD dans le compte de gestion, créer une approbation de forêt avec le domaine sur site, et sélectionner le répertoire géré comme source d'identité."
    - id: c
      text:
        en: "Create a Simple AD directory in the management account, import the on-premises users into it, and select the Simple AD directory as the identity source."
        fr: "Créer un répertoire Simple AD dans le compte de gestion, y importer les utilisateurs sur site, et sélectionner le répertoire Simple AD comme source d'identité."
    - id: d
      text:
        en: "Deploy an AD FS farm on premises, create an IAM SAML identity provider in every member account, and create IAM roles for each team in every account."
        fr: "Déployer une batterie AD FS sur site, créer un fournisseur d'identité SAML IAM dans chaque compte membre, et créer des rôles IAM pour chaque équipe dans chaque compte."
answer: { optionId: a }
explanation:
  correct:
    en: "AD Connector is a directory gateway that forwards authentication requests to the self-managed domain controllers without storing passwords in AWS. IAM Identity Center can use it as its Active Directory identity source when it is in the management account; Identity Center synchronizes users, groups and memberships, but no password information."
    fr: "AD Connector est une passerelle de répertoire qui transmet les demandes d'authentification aux contrôleurs de domaine autogérés sans stocker de mots de passe dans AWS. IAM Identity Center peut l'utiliser comme source d'identité Active Directory lorsqu'il se trouve dans le compte de gestion ; Identity Center synchronise les utilisateurs, les groupes et les appartenances, mais aucune information de mot de passe."
  options:
    b:
      en: "A trust with AWS Managed Microsoft AD works, but it adds a directory with its own domain controllers that the company would have to deploy and maintain."
      fr: "Une approbation avec AWS Managed Microsoft AD fonctionne, mais elle ajoute un répertoire avec ses propres contrôleurs de domaine que l'entreprise devrait déployer et maintenir."
    c:
      en: "IAM Identity Center does not support Simple AD as a connected directory, and Simple AD is closed to new customers."
      fr: "IAM Identity Center ne prend pas en charge Simple AD comme répertoire connecté, et Simple AD est fermé aux nouveaux clients."
    d:
      en: "An AD FS farm and per-account SAML providers and roles add infrastructure and bypass IAM Identity Center, multiplying the configuration to maintain."
      fr: "Une batterie AD FS et des fournisseurs SAML et rôles par compte ajoutent de l'infrastructure et contournent IAM Identity Center, ce qui multiplie la configuration à maintenir."
references:
  - title: Microsoft AD directory
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-ad.html
  - title: Getting started with AD Connector
    url: https://docs.aws.amazon.com/directoryservice/latest/admin-guide/prereq_connector.html
