id: scsc03-4c-kms-analyzer-error-finding
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's external access analyzer shows an error finding with the error ACCESS_DENIED for a customer managed AWS KMS key. The key policy was written by the application team: it allows only the application role to use the key and the KeyAdmins role to manage it, and it does not delegate to IAM. The security team must be able to see whether this key is shared outside the zone of trust, without giving any human principal new access to the key.

    Which solution will meet these requirements?
  fr: |
    L'analyseur d'accès externe d'AnyCompany affiche un résultat d'erreur avec l'erreur ACCESS_DENIED pour une clé AWS KMS gérée par le client. La politique de clé a été rédigée par l'équipe applicative : elle autorise seulement le rôle de l'application à utiliser la clé et le rôle KeyAdmins à la gérer, et elle ne délègue pas à IAM. L'équipe de sécurité doit pouvoir savoir si cette clé est partagée en dehors de la zone de confiance, sans donner à aucun principal humain de nouvel accès à la clé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a policy that allows kms:DescribeKey, kms:GetKeyPolicy and kms:List* to the AWSServiceRoleForAccessAnalyzer service-linked role in IAM.
        fr: |-
          Attacher dans IAM au rôle lié à un service AWSServiceRoleForAccessAnalyzer une politique qui autorise kms:DescribeKey, kms:GetKeyPolicy et kms:List*.
    - id: b
      text:
        en: |-
          Create a KMS grant for the access-analyzer.amazonaws.com service principal that allows the Decrypt and DescribeKey operations.
        fr: |-
          Créer un octroi KMS pour le principal de service access-analyzer.amazonaws.com qui autorise les opérations Decrypt et DescribeKey.
    - id: c
      text:
        en: |-
          Archive the error finding, and create an archive rule so that future error findings for KMS keys are archived automatically.
        fr: |-
          Archiver le résultat d'erreur, puis créer une règle d'archivage pour que les futurs résultats d'erreur des clés KMS soient archivés automatiquement.
    - id: d
      text:
        en: |-
          Add a key policy statement that allows the AWSServiceRoleForAccessAnalyzer service-linked role kms:DescribeKey, kms:GetKeyPolicy and kms:List*.
        fr: |-
          Ajouter à la politique de clé une instruction qui autorise le rôle lié à un service AWSServiceRoleForAccessAnalyzer à effectuer kms:DescribeKey, kms:GetKeyPolicy et kms:List*.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      IAM Access Analyzer reads the key policy, the AWS_RAM key policy and the grants of each KMS key through its service-linked role. When the key policy does not allow that role to read the key metadata, the analyzer reports an ACCESS_DENIED error finding; allowing kms:DescribeKey, kms:GetKeyPolicy and kms:List* for the role in the key policy fixes the analysis, and the error finding is then removed.
    fr: |-
      IAM Access Analyzer lit la politique de clé, la politique de clé AWS_RAM et les octrois de chaque clé KMS au moyen de son rôle lié à un service. Quand la politique de clé ne permet pas à ce rôle de lire les métadonnées de la clé, l'analyseur signale un résultat d'erreur ACCESS_DENIED ; autoriser kms:DescribeKey, kms:GetKeyPolicy et kms:List* pour ce rôle dans la politique de clé rétablit l'analyse, et le résultat d'erreur est alors supprimé.
  options:
    a:
      en: |-
        The key policy does not delegate to IAM, so an IAM policy has no effect on this key; service-linked role policies also cannot be edited.
      fr: |-
        La politique de clé ne délègue pas à IAM : une politique IAM n'a aucun effet sur cette clé ; les politiques des rôles liés à un service ne sont en outre pas modifiables.
    b:
      en: |-
        The analyzer needs to read the key policy and grants, not to decrypt data; Decrypt would add unneeded cryptographic access.
      fr: |-
        L'analyseur doit lire la politique de clé et les octrois, pas déchiffrer des données ; Decrypt ajouterait un accès cryptographique inutile.
    c:
      en: |-
        Archiving hides the error but the key would still not be analyzed, so external sharing of the key would stay unknown.
      fr: |-
        L'archivage masque l'erreur, mais la clé ne serait toujours pas analysée : un partage externe de la clé resterait inconnu.
references:
  - title: IAM Access Analyzer supported resource types for external and internal access - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-resources.html
  - title: Resolve IAM Access Analyzer findings - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-findings-remediate.html
