id: scsc03-4c-archive-rule-auditor
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's external access analyzer shows 60 active findings for Amazon S3 buckets and AWS KMS keys that are shared with account 444455556666, which belongs to the company's external audit firm. This access is intended. The security team wants the current and future findings for that account to be archived automatically. Any finding that reports public access must stay active.

    Which solution will meet these requirements?
  fr: |
    L'analyseur d'accès externe d'AnyCompany affiche 60 résultats actifs pour des compartiments Amazon S3 et des clés AWS KMS partagés avec le compte 444455556666, qui appartient au cabinet d'audit externe de l'entreprise. Cet accès est voulu. L'équipe de sécurité veut que les résultats actuels et futurs pour ce compte soient archivés automatiquement. Tout résultat qui signale un accès public doit rester actif.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an archive rule for the external principal 444455556666 with the public access criterion set to false, and choose Create rule.
        fr: |-
          Créer une règle d'archivage pour le principal externe 444455556666 avec le critère d'accès public défini sur false, et choisir Create rule.
    - id: b
      text:
        en: |-
          Create an archive rule for the external principal 444455556666 with the public access criterion set to false, and choose Create and archive active findings.
        fr: |-
          Créer une règle d'archivage pour le principal externe 444455556666 avec le critère d'accès public défini sur false, et choisir Create and archive active findings.
    - id: c
      text:
        en: |-
          Add account 444455556666 to the zone of trust of the analyzer, so that access from the audit firm is treated as trusted.
        fr: |-
          Ajouter le compte 444455556666 à la zone de confiance de l'analyseur, afin que l'accès du cabinet d'audit soit considéré comme approuvé.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule that discards Access Analyzer Finding events whose principal is account 444455556666.
        fr: |-
          Créer une règle Amazon EventBridge qui ignore les événements Access Analyzer Finding dont le principal est le compte 444455556666.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An archive rule automatically archives new findings that match its criteria, and the Create and archive active findings choice also archives the existing matching findings. Setting the public access criterion to false keeps any finding for public access out of the rule, so it stays active.
    fr: |-
      Une règle d'archivage archive automatiquement les nouveaux résultats qui correspondent à ses critères, et le choix Create and archive active findings archive aussi les résultats existants correspondants. Définir le critère d'accès public sur false exclut de la règle tout résultat d'accès public, qui reste donc actif.
  options:
    a:
      en: |-
        Create rule applies the rule to new findings only, so the 60 existing findings would stay active.
      fr: |-
        Create rule n'applique la règle qu'aux nouveaux résultats : les 60 résultats existants resteraient actifs.
    c:
      en: |-
        The zone of trust is either the account or the organization; an external account cannot be added to it.
      fr: |-
        La zone de confiance est soit le compte, soit l'organisation ; un compte externe ne peut pas y être ajouté.
    d:
      en: |-
        Filtering events only stops notifications; the findings stay active in IAM Access Analyzer.
      fr: |-
        Filtrer les événements ne fait que supprimer des notifications ; les résultats restent actifs dans IAM Access Analyzer.
references:
  - title: Archive rules - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-archive-rules.html
