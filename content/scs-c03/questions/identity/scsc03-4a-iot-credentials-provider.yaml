id: scsc03-4a-iot-credentials-provider
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 20,000 sensors registered as AWS IoT Core things. Each sensor authenticates to AWS IoT Core with its own X.509 certificate. The sensors must now upload log files directly to an Amazon S3 bucket, each under a prefix named after the thing, without storing AWS access keys on the devices.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany possède 20 000 capteurs enregistrés comme objets (things) AWS IoT Core. Chaque capteur s'authentifie auprès d'AWS IoT Core avec son propre certificat X.509. Les capteurs doivent désormais charger des fichiers journaux directement dans un compartiment Amazon S3, chacun sous un préfixe portant le nom de l'objet, sans stocker de clés d'accès AWS sur les appareils.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Create an IAM user for each sensor, and deliver the user's access keys to the device in an MQTT message after the device connects."
        fr: "Créer un utilisateur IAM pour chaque capteur, et envoyer les clés d'accès de l'utilisateur à l'appareil dans un message MQTT après sa connexion."
    - id: b
      text:
        en: "Create an IAM Roles Anywhere trust anchor from the CA that issued the certificates, and install the Roles Anywhere credential helper on every sensor."
        fr: "Créer une ancre d'approbation IAM Roles Anywhere à partir de l'autorité de certification qui a émis les certificats, et installer l'assistant d'informations d'identification Roles Anywhere sur chaque capteur."
    - id: c
      text:
        en: "Create an Amazon Cognito identity pool with guest access, and have each sensor request unauthenticated credentials for the guest role before each upload."
        fr: "Créer un groupe d'identités Amazon Cognito avec accès invité, et faire demander par chaque capteur des informations d'identification non authentifiées du rôle invité avant chaque chargement."
    - id: d
      text:
        en: "Create a role alias for a role that trusts credentials.iot.amazonaws.com, allow iot:AssumeRoleWithCertificate on it, and scope S3 access with credentials-iot:ThingName."
        fr: "Créer un alias de rôle pour un rôle qui approuve credentials.iot.amazonaws.com, autoriser iot:AssumeRoleWithCertificate sur cet alias, et délimiter l'accès S3 avec credentials-iot:ThingName."
answer: { optionId: d }
explanation:
  correct:
    en: "The AWS IoT Core credentials provider authenticates a device with its existing X.509 certificate and calls AWS STS to return temporary credentials for the role behind the role alias. The IoT policy on the certificate allows iot:AssumeRoleWithCertificate, and the role's IAM policy can use credentials-iot:ThingName to limit each sensor to its own prefix."
    fr: "Le fournisseur d'informations d'identification d'AWS IoT Core authentifie un appareil avec son certificat X.509 existant et appelle AWS STS pour renvoyer des informations d'identification temporaires du rôle associé à l'alias de rôle. La politique IoT du certificat autorise iot:AssumeRoleWithCertificate, et la politique IAM du rôle peut utiliser credentials-iot:ThingName pour limiter chaque capteur à son propre préfixe."
  options:
    a:
      en: "Long-term access keys would be sent to and stored on every device."
      fr: "Des clés d'accès à long terme seraient envoyées et stockées sur chaque appareil."
    b:
      en: "Roles Anywhere would add a second certificate-based mechanism and a client to deploy on every device, while the IoT credentials provider already works with the certificates registered in AWS IoT Core."
      fr: "Roles Anywhere ajouterait un second mécanisme à base de certificats et un client à déployer sur chaque appareil, alors que le fournisseur d'informations d'identification IoT fonctionne déjà avec les certificats enregistrés dans AWS IoT Core."
    c:
      en: "Guest credentials go to anyone who can call the identity pool, and they cannot be tied to an individual thing."
      fr: "Les informations d'identification invité sont fournies à quiconque peut appeler le groupe d'identités, et elles ne peuvent pas être liées à un objet précis."
references:
  - title: Authorizing direct calls to AWS services using AWS IoT Core credential provider
    url: https://docs.aws.amazon.com/iot/latest/developerguide/authorizing-direct-aws.html
