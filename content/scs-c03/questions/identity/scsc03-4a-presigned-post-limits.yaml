id: scsc03-4a-presigned-post-limits
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's web application lets signed-in users upload documents directly from the browser to an Amazon S3 bucket, without sending the files through the application servers. The back end issues upload authorizations with the credentials of its IAM role. Each upload must be smaller than 10 MB, and each user must be able to write only to keys that start with uploads/<user-id>/. Amazon S3 must reject uploads that do not meet these conditions.

    Which solution will meet these requirements?
  fr: |
    L'application web d'AnyCompany permet aux utilisateurs connectés de charger des documents directement depuis le navigateur dans un compartiment Amazon S3, sans faire transiter les fichiers par les serveurs d'application. Le backend émet les autorisations de chargement avec les informations d'identification de son rôle IAM. Chaque chargement doit faire moins de 10 Mo, et chaque utilisateur ne doit pouvoir écrire que dans des clés qui commencent par uploads/<user-id>/. Amazon S3 doit refuser les chargements qui ne respectent pas ces conditions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Sign a POST policy for each user with a content-length-range condition from 1 to 10485760 bytes and a starts-with condition on $key for the user's prefix."
        fr: "Signer pour chaque utilisateur une politique POST avec une condition content-length-range de 1 à 10485760 octets et une condition starts-with sur $key pour le préfixe de l'utilisateur."
    - id: b
      text:
        en: "Generate a presigned PUT URL for each upload, and add an S3 Lifecycle rule that deletes objects larger than 10 MB under the uploads/ prefix."
        fr: "Générer une URL PUT présignée pour chaque chargement, et ajouter une règle S3 Lifecycle qui supprime les objets de plus de 10 Mo sous le préfixe uploads/."
    - id: c
      text:
        en: "Give the browser temporary credentials from an Amazon Cognito identity pool whose role allows s3:PutObject on uploads/${cognito-identity.amazonaws.com:sub}/*."
        fr: "Fournir au navigateur des informations d'identification temporaires d'un groupe d'identités Amazon Cognito dont le rôle autorise s3:PutObject sur uploads/${cognito-identity.amazonaws.com:sub}/*."
    - id: d
      text:
        en: "Generate a presigned PUT URL that expires after 60 seconds for each upload so that a large file cannot finish uploading in time."
        fr: "Générer pour chaque chargement une URL PUT présignée qui expire après 60 secondes, pour qu'un fichier volumineux ne puisse pas finir d'être chargé à temps."
answer: { optionId: a }
explanation:
  correct:
    en: "A browser-based POST upload is authorized by a signed POST policy whose conditions Amazon S3 enforces. The content-length-range condition sets the minimum and maximum object size in bytes, and a starts-with condition on $key limits the key prefix, so non-matching uploads are rejected."
    fr: "Un chargement POST depuis le navigateur est autorisé par une politique POST signée dont Amazon S3 applique les conditions. La condition content-length-range fixe la taille minimale et maximale de l'objet en octets, et une condition starts-with sur $key limite le préfixe de clé : les chargements non conformes sont refusés."
  options:
    b:
      en: "A lifecycle rule acts after the object is stored; it does not make Amazon S3 reject the upload."
      fr: "Une règle de cycle de vie agit après le stockage de l'objet ; elle ne fait pas refuser le chargement par Amazon S3."
    c:
      en: "The role policy limits the key prefix, but nothing limits the size of the uploaded objects."
      fr: "La politique du rôle limite le préfixe de clé, mais rien ne limite la taille des objets chargés."
    d:
      en: "Amazon S3 checks the expiration when the request starts, so an upload that begins in time can finish whatever its size."
      fr: "Amazon S3 vérifie l'expiration au début de la requête : un chargement commencé à temps peut se terminer quelle que soit sa taille."
references:
  - title: Creating a POST policy
    url: https://docs.aws.amazon.com/AmazonS3/latest/API/sigv4-HTTPPOSTConstructPolicy.html
  - title: Download and upload objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html
