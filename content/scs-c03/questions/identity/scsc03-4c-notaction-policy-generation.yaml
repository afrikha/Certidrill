id: scsc03-4c-notaction-policy-generation
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An unused access analyzer at AnyCompany reports unused permissions for the role LegacyOps, but the finding offers no recommended policy. The role's only policy allows everything except IAM through the NotAction element. The account has an AWS CloudTrail trail that delivers management events to an Amazon S3 bucket in the same account. The role launches Amazon EC2 instances with an instance profile. The security team must replace the policy with a least-privilege policy based on the role's activity over the last 90 days, without breaking the role's work.

    Which solution will meet these requirements?
  fr: |
    Un analyseur d'accès inutilisé d'AnyCompany signale des autorisations inutilisées pour le rôle LegacyOps, mais le résultat ne propose aucune politique recommandée. La seule politique du rôle autorise tout sauf IAM au moyen de l'élément NotAction. Le compte possède un journal de suivi AWS CloudTrail qui livre les événements de gestion dans un compartiment Amazon S3 du même compte. Le rôle lance des instances Amazon EC2 avec un profil d'instance. L'équipe de sécurité doit remplacer la politique par une politique de moindre privilège fondée sur l'activité du rôle au cours des 90 derniers jours, sans perturber le travail du rôle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Wait for the next scan of the unused access analyzer, and attach the recommended policy that the updated finding provides for the role.
        fr: |-
          Attendre la prochaine analyse de l'analyseur d'accès inutilisé, puis attacher la politique recommandée que le résultat mis à jour fournit pour le rôle.
    - id: b
      text:
        en: |-
          Generate a 90-day policy from the trail with IAM Access Analyzer, and attach the generated policy exactly as it is in place of the NotAction policy.
        fr: |-
          Générer une politique sur 90 jours à partir du journal de suivi avec IAM Access Analyzer, puis attacher la politique générée telle quelle à la place de la politique NotAction.
    - id: c
      text:
        en: |-
          Generate a 90-day policy from the trail with IAM Access Analyzer, replace its resource placeholders, add iam:PassRole, and attach it in place of the NotAction policy.
        fr: |-
          Générer une politique sur 90 jours à partir du journal de suivi avec IAM Access Analyzer, remplacer ses espaces réservés de ressources, ajouter iam:PassRole, puis l'attacher à la place de la politique NotAction.
    - id: d
      text:
        en: |-
          Run the IAM policy simulator on the NotAction policy to list the actions that it allows, and write a policy that contains those actions.
        fr: |-
          Exécuter le simulateur de politiques IAM sur la politique NotAction pour lister les actions qu'elle autorise, puis rédiger une politique qui contient ces actions.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Unused access findings do not offer policy recommendations when the existing policy uses NotAction. IAM Access Analyzer policy generation reads up to 90 days of the trail and builds a policy from the actions used, with ARN placeholders to replace. iam:PassRole is not logged by CloudTrail and is never included, so it must be added for the role passed to EC2.
    fr: |-
      Les résultats d'accès inutilisé ne proposent pas de politique recommandée quand la politique existante utilise NotAction. La génération de politiques d'IAM Access Analyzer lit jusqu'à 90 jours du journal de suivi et construit une politique à partir des actions utilisées, avec des espaces réservés d'ARN à remplacer. iam:PassRole n'est pas journalisée par CloudTrail et n'est jamais incluse : il faut l'ajouter pour le rôle transmis à EC2.
  options:
    a:
      en: |-
        Recommendations are not supported for policies that use NotAction, so a new scan will not add one.
      fr: |-
        Les recommandations ne sont pas prises en charge pour les politiques qui utilisent NotAction : une nouvelle analyse n'en ajoutera pas.
    b:
      en: |-
        The generated policy contains resource placeholders and omits iam:PassRole, so attaching it unchanged would break the instance launches.
      fr: |-
        La politique générée contient des espaces réservés de ressources et omet iam:PassRole : l'attacher sans modification ferait échouer les lancements d'instances.
    d:
      en: |-
        The simulator shows what a policy allows, not what the role actually used, so the result would keep the unused permissions.
      fr: |-
        Le simulateur montre ce qu'une politique autorise, pas ce que le rôle a réellement utilisé : le résultat conserverait les autorisations inutilisées.
references:
  - title: IAM Access Analyzer policy generation - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-policy-generation.html
  - title: Resolve IAM Access Analyzer findings - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-findings-remediate.html
