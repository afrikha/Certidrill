id: scsc03-4a-idc-domain-users-group
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Managed Microsoft AD as the identity source of IAM Identity Center. To give every employee read-only access to a sandbox account, an administrator assigned the Domain Users group to the account with a ReadOnly permission set. Employees can sign in to the AWS access portal, but the sandbox account does not appear for them. Other assignments that use custom security groups work as expected.

    What should the administrator do to resolve the issue?
  fr: |
    AnyCompany utilise AWS Managed Microsoft AD comme source d'identité d'IAM Identity Center. Pour donner à chaque employé un accès en lecture seule à un compte de bac à sable, un administrateur a attribué le groupe Domain Users au compte avec un ensemble d'autorisations ReadOnly. Les employés peuvent se connecter au portail d'accès AWS, mais le compte de bac à sable n'apparaît pas pour eux. Les autres attributions qui utilisent des groupes de sécurité personnalisés fonctionnent comme prévu.

    Que doit faire l'administrateur pour résoudre le problème ?
body:
  options:
    - id: a
      text:
        en: "Enable attributes for access control in IAM Identity Center, and map the memberOf attribute to a session tag for the permission set."
        fr: "Activer les attributs pour le contrôle d'accès dans IAM Identity Center, et associer l'attribut memberOf à une balise de session pour l'ensemble d'autorisations."
    - id: b
      text:
        en: "Create a security group that contains all employees, sync it to IAM Identity Center, and assign it to the sandbox account instead of Domain Users."
        fr: "Créer un groupe de sécurité qui contient tous les employés, le synchroniser dans IAM Identity Center, et l'attribuer au compte de bac à sable à la place de Domain Users."
    - id: c
      text:
        en: "Provision the ReadOnly permission set to the sandbox account again so that IAM Identity Center re-creates the role in the account."
        fr: "Provisionner de nouveau l'ensemble d'autorisations ReadOnly dans le compte de bac à sable pour qu'IAM Identity Center recrée le rôle dans le compte."
    - id: d
      text:
        en: "Create a two-way forest trust between AWS Managed Microsoft AD and the on-premises domain so that IAM Identity Center can read Domain Users."
        fr: "Créer une approbation de forêt bidirectionnelle entre AWS Managed Microsoft AD et le domaine sur site pour qu'IAM Identity Center puisse lire Domain Users."
answer: { optionId: b }
explanation:
  correct:
    en: "IAM Identity Center cannot read Active Directory primary groups and their memberships, such as Domain Users, so an assignment to that group gives nobody access. Assigning another group that contains the employees gives them the permission set in the sandbox account."
    fr: "IAM Identity Center ne peut pas lire les groupes principaux Active Directory ni leurs appartenances, comme Domain Users : une attribution à ce groupe ne donne accès à personne. Attribuer un autre groupe qui contient les employés leur donne l'ensemble d'autorisations dans le compte de bac à sable."
  options:
    a:
      en: "Attributes for access control pass user attributes as session tags; they do not change which group memberships Identity Center can read."
      fr: "Les attributs pour le contrôle d'accès transmettent des attributs d'utilisateur sous forme de balises de session ; ils ne changent pas les appartenances aux groupes qu'Identity Center peut lire."
    c:
      en: "The role is not the problem; Identity Center sees no member in the assigned group, so nobody receives the assignment."
      fr: "Le rôle n'est pas en cause ; Identity Center ne voit aucun membre dans le groupe attribué, donc personne ne reçoit l'attribution."
    d:
      en: "The employees are already in AWS Managed Microsoft AD, and a trust does not make primary group memberships readable."
      fr: "Les employés sont déjà dans AWS Managed Microsoft AD, et une approbation ne rend pas lisibles les appartenances aux groupes principaux."
references:
  - title: Troubleshooting IAM Identity Center issues
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/troubleshooting.html
