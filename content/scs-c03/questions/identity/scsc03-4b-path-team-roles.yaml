id: scsc03-4b-path-team-roles
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Account 111122223333 hosts IAM roles for several application teams. A platform team creates the roles of the Orion team with infrastructure as code, always under the IAM path /orion/, and does not tag the roles. The role OrionLead must be able to attach and detach managed policies and update the trust policy of every role under /orion/, including roles created later. OrionLead must not be able to modify any other role in the account.

    Which statement should the security engineer add to the identity-based policy of OrionLead?
  fr: |
    Le compte 111122223333 héberge des rôles IAM pour plusieurs équipes applicatives. Une équipe plateforme crée les rôles de l'équipe Orion par infrastructure en tant que code, toujours sous le chemin IAM /orion/, et n'applique aucune balise aux rôles. Le rôle OrionLead doit pouvoir attacher et détacher des politiques gérées et mettre à jour la politique d'approbation de chaque rôle situé sous /orion/, y compris les rôles créés plus tard. OrionLead ne doit pouvoir modifier aucun autre rôle du compte.

    Quelle instruction l'ingénieur sécurité doit-il ajouter à la politique basée sur l'identité d'OrionLead ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow iam:AttachRolePolicy, iam:DetachRolePolicy, and iam:UpdateAssumeRolePolicy on all roles when the iam:ResourceTag/team condition key equals orion.
        fr: |-
          Autoriser iam:AttachRolePolicy, iam:DetachRolePolicy et iam:UpdateAssumeRolePolicy sur tous les rôles lorsque la clé de condition iam:ResourceTag/team est égale à orion.
    - id: b
      text:
        en: |-
          Allow iam:AttachRolePolicy, iam:DetachRolePolicy, and iam:UpdateAssumeRolePolicy on the IAM group arn:aws:iam::111122223333:group/orion/OrionRoles.
        fr: |-
          Autoriser iam:AttachRolePolicy, iam:DetachRolePolicy et iam:UpdateAssumeRolePolicy sur le groupe IAM arn:aws:iam::111122223333:group/orion/OrionRoles.
    - id: c
      text:
        en: |-
          Allow iam:AttachRolePolicy, iam:DetachRolePolicy, and iam:UpdateAssumeRolePolicy on the resource arn:aws:iam::111122223333:role/orion/*.
        fr: |-
          Autoriser iam:AttachRolePolicy, iam:DetachRolePolicy et iam:UpdateAssumeRolePolicy sur la ressource arn:aws:iam::111122223333:role/orion/*.
    - id: d
      text:
        en: |-
          Allow iam:AttachRolePolicy, iam:DetachRolePolicy, and iam:UpdateAssumeRolePolicy on the resource arn:aws:iam::111122223333:role/orion*.
        fr: |-
          Autoriser iam:AttachRolePolicy, iam:DetachRolePolicy et iam:UpdateAssumeRolePolicy sur la ressource arn:aws:iam::111122223333:role/orion*.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The path is part of the resource portion of the role ARN, so a wildcard after the path (role/orion/*) matches every role under /orion/, including roles created later, and nothing else. No tags or other mechanism are needed.
    fr: |-
      Le chemin fait partie de la portion ressource de l'ARN du rôle : un caractère générique après le chemin (role/orion/*) correspond à chaque rôle situé sous /orion/, y compris ceux créés plus tard, et à rien d'autre. Aucune balise ni autre mécanisme n'est nécessaire.
  options:
    a:
      en: |-
        The roles are not tagged, so the condition never matches and OrionLead cannot modify any role.
      fr: |-
        Les rôles ne sont pas balisés : la condition ne correspond jamais et OrionLead ne peut modifier aucun rôle.
    b:
      en: |-
        Roles cannot be members of IAM groups, and a path does not create group membership; the role actions apply to role resources, not to a group.
      fr: |-
        Les rôles ne peuvent pas être membres de groupes IAM, et un chemin ne crée aucune appartenance à un groupe ; les actions sur les rôles s'appliquent à des ressources de type rôle, pas à un groupe.
    d:
      en: |-
        Without the slash, the wildcard also matches roles at the root path whose names start with orion, such as role/orion-billing, so OrionLead could modify roles of other teams.
      fr: |-
        Sans la barre oblique, le caractère générique correspond aussi aux rôles du chemin racine dont le nom commence par orion, comme role/orion-billing : OrionLead pourrait modifier des rôles d'autres équipes.
references:
  - title: IAM identifiers - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
