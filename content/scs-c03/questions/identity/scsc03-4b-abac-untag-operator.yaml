id: scsc03-4b-abac-untag-operator
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses ABAC for AWS Secrets Manager. Access is granted when the access-project and access-team tags of a secret match the principal tags of the caller. A penetration test shows that developers can remove these tags from secrets. The security engineer must add a statement to the developers' policy that denies the removal of any tag whose key starts with access-, even when the same request also removes other tags.

    Which statement will meet these requirements?
  fr: |
    AnyCompany utilise ABAC pour AWS Secrets Manager. L'accès est accordé lorsque les balises access-project et access-team d'un secret correspondent aux balises de principal de l'appelant. Un test d'intrusion montre que les développeurs peuvent supprimer ces balises des secrets. L'ingénieur sécurité doit ajouter à la politique des développeurs une instruction qui refuse la suppression de toute balise dont la clé commence par access-, même lorsque la même demande supprime aussi d'autres balises.

    Quelle instruction permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Deny secretsmanager:UntagResource on all secrets with a ForAllValues:StringLike condition on aws:TagKeys for access-*.
        fr: |-
          Refuser secretsmanager:UntagResource sur tous les secrets avec une condition ForAllValues:StringLike sur aws:TagKeys pour access-*.
    - id: b
      text:
        en: |-
          Deny secretsmanager:UntagResource on all secrets with a StringLike condition on aws:RequestTag/access-project for *.
        fr: |-
          Refuser secretsmanager:UntagResource sur tous les secrets avec une condition StringLike sur aws:RequestTag/access-project pour *.
    - id: c
      text:
        en: |-
          Deny secretsmanager:TagResource on all secrets with a ForAnyValue:StringLike condition on aws:TagKeys for access-*.
        fr: |-
          Refuser secretsmanager:TagResource sur tous les secrets avec une condition ForAnyValue:StringLike sur aws:TagKeys pour access-*.
    - id: d
      text:
        en: |-
          Deny secretsmanager:UntagResource on all secrets with a ForAnyValue:StringLike condition on aws:TagKeys for access-*.
        fr: |-
          Refuser secretsmanager:UntagResource sur tous les secrets avec une condition ForAnyValue:StringLike sur aws:TagKeys pour access-*.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      aws:TagKeys is a multivalued key that lists the tag keys in the request. ForAnyValue matches when at least one key in the request matches access-*, so any UntagResource call that removes an access- tag is denied, whatever other keys it contains.
    fr: |-
      aws:TagKeys est une clé à valeurs multiples qui liste les clés de balise de la demande. ForAnyValue correspond dès qu'au moins une clé de la demande correspond à access-* : tout appel UntagResource qui supprime une balise access- est refusé, quelles que soient les autres clés qu'il contient.
  options:
    a:
      en: |-
        ForAllValues matches only when every key in the request matches access-*, so a request that also removes a tag such as Name escapes the deny.
      fr: |-
        ForAllValues ne correspond que si toutes les clés de la demande correspondent à access-* : une demande qui supprime aussi une balise comme Name échappe au refus.
    b:
      en: |-
        UntagResource passes only tag keys, not key-value pairs, so aws:RequestTag is absent and the condition never matches.
      fr: |-
        UntagResource ne transmet que des clés de balise, pas des paires clé-valeur : aws:RequestTag est absent et la condition ne correspond jamais.
    c:
      en: |-
        TagResource adds or overwrites tags; denying it does not stop developers from removing tags with UntagResource.
      fr: |-
        TagResource ajoute ou remplace des balises ; le refuser n'empêche pas les développeurs de supprimer des balises avec UntagResource.
references:
  - title: "IAM tutorial: Define permissions to access AWS resources based on tags - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_attribute-based-access-control.html
  - title: Single-valued vs. multivalued context keys - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-single-vs-multi-valued-context-keys.html
