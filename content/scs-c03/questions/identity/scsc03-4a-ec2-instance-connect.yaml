id: scsc03-4a-ec2-instance-connect
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's administrators connect to Amazon Linux 2023 instances over SSH with a shared private key that has not changed in two years. The instances have public IP addresses, include the EC2 Instance Connect package, and are not managed by AWS Systems Manager, which the company does not plan to change. The security team wants each SSH login to use a short-lived key, authorized per administrator with IAM policies and recorded in AWS CloudTrail. The administrators must keep using a standard SSH client.

    Which solution will meet these requirements?
  fr: |
    Les administrateurs d'AnyCompany se connectent en SSH à des instances Amazon Linux 2023 avec une clé privée partagée qui n'a pas changé depuis deux ans. Les instances ont des adresses IP publiques, contiennent le paquet EC2 Instance Connect et ne sont pas gérées par AWS Systems Manager, ce que l'entreprise ne prévoit pas de changer. L'équipe de sécurité veut que chaque connexion SSH utilise une clé de courte durée, autorisée par administrateur avec des politiques IAM et enregistrée dans AWS CloudTrail. Les administrateurs doivent continuer à utiliser un client SSH standard.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Rotate the shared key pair every 30 days with an AWS Lambda function, and store the new private key in AWS Secrets Manager for the administrators."
        fr: "Faire tourner la paire de clés partagée tous les 30 jours avec une fonction AWS Lambda, et stocker la nouvelle clé privée dans AWS Secrets Manager pour les administrateurs."
    - id: b
      text:
        en: "Allow each administrator to push a public key with EC2 Instance Connect, which keeps the key in the instance metadata for 60 seconds, and then connect with SSH."
        fr: "Autoriser chaque administrateur à envoyer une clé publique avec EC2 Instance Connect, qui conserve la clé dans les métadonnées de l'instance pendant 60 secondes, puis se connecter en SSH."
    - id: c
      text:
        en: "Create an IAM user for each administrator, and upload each administrator's SSH public key to IAM as an SSH public key for the instances."
        fr: "Créer un utilisateur IAM pour chaque administrateur, et charger dans IAM la clé publique SSH de chaque administrateur comme clé publique SSH pour les instances."
    - id: d
      text:
        en: "Start Session Manager sessions from the AWS CLI with the AWS-StartSSHSession document, and tunnel the administrators' SSH connections through them."
        fr: "Démarrer des sessions Session Manager depuis l'AWS CLI avec le document AWS-StartSSHSession, et faire passer les connexions SSH des administrateurs dans ces sessions."
answer: { optionId: b }
explanation:
  correct:
    en: "With EC2 Instance Connect, an IAM policy authorizes each user to push an SSH public key to the instance metadata, where it remains for 60 seconds; the SSH daemon looks the key up there to authenticate the connection. Access is controlled with IAM principals and policies instead of shared keys, and every connection request is logged in CloudTrail."
    fr: "Avec EC2 Instance Connect, une politique IAM autorise chaque utilisateur à envoyer une clé publique SSH dans les métadonnées de l'instance, où elle reste 60 secondes ; le démon SSH y recherche la clé pour authentifier la connexion. L'accès est contrôlé par des principaux et des politiques IAM au lieu de clés partagées, et chaque demande de connexion est journalisée dans CloudTrail."
  options:
    a:
      en: "The key would still be shared and valid for 30 days, and its use would not be authorized per administrator."
      fr: "La clé resterait partagée et valide pendant 30 jours, et son utilisation ne serait pas autorisée par administrateur."
    c:
      en: "SSH public keys stored on IAM users are used for AWS CodeCommit, not for SSH logins to EC2 instances, and IAM users add long-term identities."
      fr: "Les clés publiques SSH stockées sur des utilisateurs IAM servent à AWS CodeCommit, pas aux connexions SSH aux instances EC2, et les utilisateurs IAM ajoutent des identités à long terme."
    d:
      en: "Session Manager requires the instances to be managed by Systems Manager, which they are not, and an SSH tunnel would still need a key on the instance."
      fr: "Session Manager exige que les instances soient gérées par Systems Manager, ce qui n'est pas le cas, et un tunnel SSH aurait toujours besoin d'une clé sur l'instance."
references:
  - title: Connect to your Linux instance using a public IP address and EC2 Instance Connect
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/connect-linux-inst-eic.html
