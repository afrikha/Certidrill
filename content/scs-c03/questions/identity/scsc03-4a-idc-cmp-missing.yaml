id: scsc03-4a-idc-cmp-missing
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's IAM Identity Center permission set DataEngineer attaches a customer managed policy named DataEngineerAccess with the path /teams/. The permission set works in 12 accounts. When an administrator assigns a group to a new account with this permission set, provisioning fails for that account only. The new account was created last week through AWS Organizations.

    What should the administrator do to resolve the issue?
  fr: |
    L'ensemble d'autorisations DataEngineer d'IAM Identity Center d'AnyCompany attache une politique gérée par le client nommée DataEngineerAccess avec le chemin /teams/. L'ensemble d'autorisations fonctionne dans 12 comptes. Lorsqu'un administrateur attribue un groupe à un nouveau compte avec cet ensemble d'autorisations, le provisionnement échoue pour ce seul compte. Le nouveau compte a été créé la semaine dernière par AWS Organizations.

    Que doit faire l'administrateur pour résoudre le problème ?
body:
  options:
    - id: a
      text:
        en: "Replace the customer managed policy in the permission set with the AWS managed policy PowerUserAccess so that the permission set no longer depends on it."
        fr: "Remplacer dans l'ensemble d'autorisations la politique gérée par le client par la politique gérée par AWS PowerUserAccess, pour que l'ensemble n'en dépende plus."
    - id: b
      text:
        en: "Create the DataEngineerAccess policy with the path /teams/ in the management account so that IAM Identity Center copies it to the new account."
        fr: "Créer la politique DataEngineerAccess avec le chemin /teams/ dans le compte de gestion pour qu'IAM Identity Center la copie dans le nouveau compte."
    - id: c
      text:
        en: "Edit the AWSReservedSSO_DataEngineer role in the new account in the IAM console, and attach an inline policy with the same permissions."
        fr: "Modifier le rôle AWSReservedSSO_DataEngineer du nouveau compte dans la console IAM, et lui attacher une politique en ligne avec les mêmes autorisations."
    - id: d
      text:
        en: "Create an IAM policy named DataEngineerAccess with the path /teams/ in the new account, and then retry the assignment."
        fr: "Créer une politique IAM nommée DataEngineerAccess avec le chemin /teams/ dans le nouveau compte, puis relancer l'attribution."
answer: { optionId: d }
explanation:
  correct:
    en: "IAM Identity Center attaches a customer managed policy by name and path to the role that it creates in each account, but it does not create the policy. The policy must already exist with the same name and path in every account where the permission set is assigned, so the new account needs its own DataEngineerAccess policy before the assignment succeeds."
    fr: "IAM Identity Center attache une politique gérée par le client, par son nom et son chemin, au rôle qu'il crée dans chaque compte, mais il ne crée pas la politique. Celle-ci doit déjà exister avec le même nom et le même chemin dans chaque compte où l'ensemble d'autorisations est attribué : le nouveau compte a donc besoin de sa propre politique DataEngineerAccess pour que l'attribution réussisse."
  options:
    a:
      en: "PowerUserAccess grants far more than the team needs, and the change would apply to all 12 accounts."
      fr: "PowerUserAccess accorde bien plus que ce dont l'équipe a besoin, et le changement s'appliquerait aux 12 comptes."
    b:
      en: "IAM Identity Center does not copy policies from the management account; each account needs its own policy."
      fr: "IAM Identity Center ne copie pas de politiques depuis le compte de gestion ; chaque compte a besoin de sa propre politique."
    c:
      en: "AWSReservedSSO_ roles are protected and can be changed only through IAM Identity Center, and the role is not created while provisioning fails."
      fr: "Les rôles AWSReservedSSO_ sont protégés et ne peuvent être modifiés que par IAM Identity Center, et le rôle n'est pas créé tant que le provisionnement échoue."
references:
  - title: Custom permissions for AWS managed and customer managed policies
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetcustom.html
