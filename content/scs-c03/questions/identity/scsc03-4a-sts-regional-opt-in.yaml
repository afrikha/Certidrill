id: scsc03-4a-sts-regional-opt-in
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany enabled the opt-in Region Asia Pacific (Hong Kong) for a new workload. Applications in us-east-1 obtain role credentials from the AWS STS global endpoint and then call services in the Hong Kong Region, but those calls are rejected because the security token is not valid. The applications store session tokens in a database column with a fixed maximum length, so the company does not want longer session tokens. The company also wants to reduce latency and avoid depending on a single Region for STS calls.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a activé la Région à adhésion Asie-Pacifique (Hong Kong) pour une nouvelle charge de travail. Des applications de us-east-1 obtiennent des informations d'identification de rôle au point de terminaison global d'AWS STS, puis appellent des services dans la Région de Hong Kong, mais ces appels sont refusés parce que le jeton de sécurité n'est pas valide. Les applications stockent les jetons de session dans une colonne de base de données de longueur maximale fixe : l'entreprise ne veut donc pas de jetons de session plus longs. L'entreprise veut aussi réduire la latence et ne pas dépendre d'une seule Région pour les appels STS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Configure the AWS SDKs of the applications to call the AWS STS Regional endpoint of the Region where each application runs."
        fr: "Configurer les SDK AWS des applications pour appeler le point de terminaison régional d'AWS STS de la Région où chaque application s'exécute."
    - id: b
      text:
        en: "In the IAM account settings, change the Region compatibility of session tokens from the global endpoint to All AWS Regions."
        fr: "Dans les paramètres de compte IAM, changer la compatibilité régionale des jetons de session du point de terminaison global en All AWS Regions."
    - id: c
      text:
        en: "Deactivate the AWS STS Regional endpoint in us-east-1 so that the SDKs fall back to the endpoint of the Hong Kong Region."
        fr: "Désactiver le point de terminaison régional d'AWS STS dans us-east-1 pour que les SDK se rabattent sur le point de terminaison de la Région de Hong Kong."
    - id: d
      text:
        en: "Increase the maximum session duration of the roles to 12 hours so that the applications request new session tokens less often."
        fr: "Porter à 12 heures la durée de session maximale des rôles pour que les applications demandent moins souvent de nouveaux jetons de session."
answer: { optionId: a }
explanation:
  correct:
    en: "Session tokens from Regional AWS STS endpoints are valid in all Regions, including opt-in Regions, while tokens from the global endpoint are by default valid only in Regions that are enabled by default. AWS recommends Regional endpoints to reduce latency, build in redundancy and increase session token validity."
    fr: "Les jetons de session émis par les points de terminaison régionaux d'AWS STS sont valides dans toutes les Régions, y compris les Régions à adhésion, alors que ceux du point de terminaison global ne sont valides par défaut que dans les Régions activées par défaut. AWS recommande les points de terminaison régionaux pour réduire la latence, ajouter de la redondance et étendre la validité des jetons de session."
  options:
    b:
      en: "Version 2 tokens from the global endpoint are valid in all Regions, but they are longer, which the database column cannot store, and the applications would still depend on the global endpoint."
      fr: "Les jetons de version 2 du point de terminaison global sont valides dans toutes les Régions, mais ils sont plus longs, ce que la colonne de base de données ne peut pas stocker, et les applications dépendraient toujours du point de terminaison global."
    c:
      en: "Deactivating a Regional endpoint makes the calls sent to it fail; the SDKs do not switch to the endpoint of another Region."
      fr: "Désactiver un point de terminaison régional fait échouer les appels qui lui sont envoyés ; les SDK ne basculent pas vers le point de terminaison d'une autre Région."
    d:
      en: "The session duration does not change the Regions in which a session token is valid."
      fr: "La durée de session ne change pas les Régions dans lesquelles un jeton de session est valide."
references:
  - title: Manage AWS STS in an AWS Region
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp_enable-regions.html
