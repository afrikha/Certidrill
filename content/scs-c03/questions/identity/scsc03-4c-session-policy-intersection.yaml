id: scsc03-4c-session-policy-intersection
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AnyCompany application assumes the role DataLoader, whose identity-based policy allows s3:GetObject and s3:PutObject on the bucket example-staging. In the AssumeRole call, the application passes an inline session policy that allows s3:GetObject on example-staging and dynamodb:Query on the table Inventory. No other policy applies to the session.

    Which actions can the role session perform?
  fr: |
    Une application d'AnyCompany assume le rôle DataLoader, dont la politique basée sur l'identité autorise s3:GetObject et s3:PutObject sur le compartiment example-staging. Dans l'appel AssumeRole, l'application transmet une politique de session en ligne qui autorise s3:GetObject sur example-staging et dynamodb:Query sur la table Inventory. Aucune autre politique ne s'applique à la session.

    Quelles actions la session de rôle peut-elle effectuer ?
body:
  options:
    - id: a
      text:
        en: |-
          s3:GetObject and s3:PutObject on example-staging, because a session policy cannot remove permissions from the role.
        fr: |-
          s3:GetObject et s3:PutObject sur example-staging, car une politique de session ne peut pas retirer d'autorisations au rôle.
    - id: b
      text:
        en: |-
          s3:GetObject on example-staging only, because the effective permissions are allowed by both the role's policy and the session policy.
        fr: |-
          Uniquement s3:GetObject sur example-staging, car les autorisations effectives sont celles qu'autorisent à la fois la politique du rôle et la politique de session.
    - id: c
      text:
        en: |-
          s3:GetObject on example-staging and dynamodb:Query on Inventory, because the session policy replaces the role's policy.
        fr: |-
          s3:GetObject sur example-staging et dynamodb:Query sur Inventory, car la politique de session remplace la politique du rôle.
    - id: d
      text:
        en: |-
          s3:GetObject and s3:PutObject on example-staging and dynamodb:Query on Inventory, because the two policies are combined.
        fr: |-
          s3:GetObject et s3:PutObject sur example-staging, ainsi que dynamodb:Query sur Inventory, car les deux politiques se cumulent.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The permissions of a role session are the intersection of the role's identity-based policies and the session policies. A session policy can only narrow the role's permissions: s3:PutObject is missing from the session policy, and dynamodb:Query is missing from the role's policy.
    fr: |-
      Les autorisations d'une session de rôle sont l'intersection des politiques basées sur l'identité du rôle et des politiques de session. Une politique de session ne peut que restreindre les autorisations du rôle : s3:PutObject manque dans la politique de session, et dynamodb:Query manque dans la politique du rôle.
  options:
    a:
      en: |-
        Restricting a session below the role's permissions is exactly what a session policy does; s3:PutObject is not allowed by it.
      fr: |-
        Restreindre une session en deçà des autorisations du rôle est précisément le rôle d'une politique de session ; elle n'autorise pas s3:PutObject.
    c:
      en: |-
        A session policy cannot grant more than the role's identity-based policies, so dynamodb:Query stays denied.
      fr: |-
        Une politique de session ne peut pas accorder plus que les politiques basées sur l'identité du rôle : dynamodb:Query reste refusé.
    d:
      en: |-
        The policies are intersected, not combined; the result never exceeds either policy.
      fr: |-
        Les politiques sont croisées, pas cumulées ; le résultat ne dépasse jamais l'une ou l'autre politique.
references:
  - title: Troubleshoot access denied error messages - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied.html
