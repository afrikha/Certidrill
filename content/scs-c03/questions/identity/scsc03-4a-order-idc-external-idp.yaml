id: scsc03-4a-order-idc-external-idp
objective: "4.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has enabled an organization instance of IAM Identity Center with the Identity Center directory as its identity source, and it has created the permission sets it needs. The company now wants employees to sign in with its external SAML 2.0 IdP. Users and groups must be created and updated in Identity Center automatically from the IdP before access to accounts is assigned.

    Which four steps should the company perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany a activé une instance d'organisation d'IAM Identity Center avec le répertoire Identity Center comme source d'identité, et elle a créé les ensembles d'autorisations dont elle a besoin. L'entreprise veut maintenant que les employés se connectent avec son IdP SAML 2.0 externe. Les utilisateurs et les groupes doivent être créés et mis à jour automatiquement dans Identity Center depuis l'IdP avant l'attribution de l'accès aux comptes.

    Quelles sont les quatre étapes que l'entreprise doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: source
      text: { en: "In IAM Identity Center, change the identity source to an external identity provider, and exchange SAML metadata with the IdP.", fr: "Dans IAM Identity Center, remplacer la source d'identité par un fournisseur d'identité externe, et échanger les métadonnées SAML avec l'IdP." }
    - id: samliam
      text: { en: "Create an IAM SAML identity provider with the IdP metadata in each member account.", fr: "Créer dans chaque compte membre un fournisseur d'identité SAML IAM avec les métadonnées de l'IdP." }
    - id: enable
      text: { en: "In IAM Identity Center, enable automatic provisioning, and copy the SCIM endpoint and the access token.", fr: "Dans IAM Identity Center, activer le provisionnement automatique, et copier le point de terminaison SCIM et le jeton d'accès." }
    - id: manual
      text: { en: "Create the users in the IAM Identity Center console after automatic provisioning is enabled.", fr: "Créer les utilisateurs dans la console IAM Identity Center une fois le provisionnement automatique activé." }
    - id: idp
      text: { en: "In the IdP, configure provisioning with the SCIM endpoint and access token, and assign the employee groups to the AWS application.", fr: "Dans l'IdP, configurer le provisionnement avec le point de terminaison SCIM et le jeton d'accès, et attribuer les groupes d'employés à l'application AWS." }
    - id: assign
      text: { en: "In IAM Identity Center, assign the provisioned groups to the AWS accounts with the permission sets.", fr: "Dans IAM Identity Center, attribuer les groupes provisionnés aux comptes AWS avec les ensembles d'autorisations." }
answer:
  sequence: [source, enable, idp, assign]
explanation:
  correct:
    en: "Automatic provisioning is configured for an external IdP identity source, so the identity source is changed first, with SAML metadata exchanged in both directions. Enabling automatic provisioning in Identity Center then produces the SCIM endpoint and access token that the IdP uses to push users and groups. Because SAML cannot be used to query the IdP for users, users and groups must be provisioned before they can be assigned to accounts."
    fr: "Le provisionnement automatique se configure pour une source d'identité IdP externe : la source d'identité est donc changée en premier, avec un échange des métadonnées SAML dans les deux sens. L'activation du provisionnement automatique dans Identity Center fournit ensuite le point de terminaison SCIM et le jeton d'accès que l'IdP utilise pour envoyer les utilisateurs et les groupes. Comme SAML ne permet pas d'interroger l'IdP sur ses utilisateurs, les utilisateurs et les groupes doivent être provisionnés avant de pouvoir être attribués aux comptes."
  options:
    samliam:
      en: "IAM SAML providers in member accounts are used for direct IAM federation, not for sign-in through IAM Identity Center."
      fr: "Les fournisseurs SAML IAM des comptes membres servent à la fédération IAM directe, pas à la connexion par IAM Identity Center."
    manual:
      en: "After automatic provisioning is set up, users can no longer be added or edited in the IAM Identity Center console."
      fr: "Une fois le provisionnement automatique configuré, les utilisateurs ne peuvent plus être ajoutés ni modifiés dans la console IAM Identity Center."
references:
  - title: External identity providers
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-idp.html
  - title: Provision users and groups from an external identity provider using SCIM
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/provision-automatically.html
