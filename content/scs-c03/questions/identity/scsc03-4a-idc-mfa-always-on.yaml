id: scsc03-4a-idc-mfa-always-on
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses the Identity Center directory as the identity source of IAM Identity Center. MFA uses the Context-aware authentication method, authenticator apps and security keys are allowed, and users who have no registered MFA device are blocked from signing in. An audit finds that users who selected This is a trusted device on the sign-in page are not prompted for MFA when they sign in again from that device. The auditors require an MFA challenge at every sign-in.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise le répertoire Identity Center comme source d'identité d'IAM Identity Center. La MFA utilise la méthode d'authentification Context-aware, les applications d'authentification et les clés de sécurité sont autorisées, et les utilisateurs sans dispositif MFA enregistré ne peuvent pas se connecter. Un audit constate que les utilisateurs qui ont sélectionné This is a trusted device sur la page de connexion ne sont pas invités à effectuer la MFA lorsqu'ils se reconnectent depuis cet appareil. Les auditeurs exigent un défi MFA à chaque connexion.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Change the MFA authentication method from Context-aware to Always-on."
        fr: "Remplacer la méthode d'authentification MFA Context-aware par Always-on."
    - id: b
      text:
        en: "Change the setting for users without a registered MFA device to Require them to register an MFA device at sign in."
        fr: "Remplacer le paramètre des utilisateurs sans dispositif MFA enregistré par Require them to register an MFA device at sign in."
    - id: c
      text:
        en: "Remove authenticator apps so that users can authenticate only with security keys and built-in authenticators."
        fr: "Retirer les applications d'authentification pour que les utilisateurs ne puissent s'authentifier qu'avec des clés de sécurité et des authentificateurs intégrés."
    - id: d
      text:
        en: "Shorten the session duration of every permission set to 1 hour so that users must sign in again more often."
        fr: "Réduire à 1 heure la durée de session de chaque ensemble d'autorisations pour que les utilisateurs doivent se reconnecter plus souvent."
answer: { optionId: a }
explanation:
  correct:
    en: "With the Context-aware method, a user who marks the device as trusted is not prompted for MFA on later sign-ins from that device, even when users without a device are blocked. The Always-on method prompts for MFA at every sign-in."
    fr: "Avec la méthode Context-aware, un utilisateur qui marque l'appareil comme approuvé n'est plus invité à effectuer la MFA lors des connexions suivantes depuis cet appareil, même lorsque les utilisateurs sans dispositif sont bloqués. La méthode Always-on demande la MFA à chaque connexion."
  options:
    b:
      en: "This setting only changes what happens to users who have no MFA device; it does not affect sign-ins from trusted devices."
      fr: "Ce paramètre ne change que le sort des utilisateurs sans dispositif MFA ; il n'affecte pas les connexions depuis des appareils approuvés."
    c:
      en: "Limiting the MFA types does not change when IAM Identity Center prompts for MFA."
      fr: "Limiter les types de MFA ne change pas le moment où IAM Identity Center demande la MFA."
    d:
      en: "The permission set session duration applies to role sessions in the accounts; sign-ins from a trusted device would still skip MFA."
      fr: "La durée de session d'un ensemble d'autorisations s'applique aux sessions de rôle dans les comptes ; les connexions depuis un appareil approuvé continueraient d'ignorer la MFA."
references:
  - title: Configure MFA device enforcement
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/how-to-configure-mfa-device-enforcement.html
