id: scsc03-4a-console-identity-broker
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's intranet authenticates employees against an on-premises LDAP directory that supports neither SAML nor OIDC. Some employees need AWS Management Console access to one account, started from a link in the intranet. A broker application on Amazon EC2 already validates employees against LDAP, and it runs with the instance role BrokerRole. The company does not allow IAM users.

    Which solution will meet these requirements?
  fr: |
    L'intranet d'AnyCompany authentifie les employés auprès d'un annuaire LDAP sur site qui ne prend en charge ni SAML ni OIDC. Certains employés ont besoin d'accéder à l'AWS Management Console d'un compte, depuis un lien de l'intranet. Une application de courtier (broker) sur Amazon EC2 valide déjà les employés auprès du LDAP, et elle s'exécute avec le rôle d'instance BrokerRole. L'entreprise n'autorise pas les utilisateurs IAM.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Have the broker call GetFederationToken with the BrokerRole credentials and a session policy, then exchange the credentials at the federation endpoint for a console sign-in URL."
        fr: "Faire appeler GetFederationToken par le courtier avec les informations d'identification de BrokerRole et une politique de session, puis échanger ces informations au point de terminaison de fédération contre une URL de connexion à la console."
    - id: b
      text:
        en: "Have the broker call GetSessionToken with the BrokerRole credentials, then exchange the credentials at the federation endpoint for a console sign-in URL."
        fr: "Faire appeler GetSessionToken par le courtier avec les informations d'identification de BrokerRole, puis échanger ces informations au point de terminaison de fédération contre une URL de connexion à la console."
    - id: c
      text:
        en: "Have the broker call AssumeRole on a console role that trusts BrokerRole, then exchange the credentials at the federation endpoint for a console sign-in URL."
        fr: "Faire appeler AssumeRole par le courtier sur un rôle de console qui approuve BrokerRole, puis échanger ces informations au point de terminaison de fédération contre une URL de connexion à la console."
    - id: d
      text:
        en: "Create an IAM SAML identity provider from the LDAP directory's configuration, and have employees sign in through https://signin.aws.amazon.com/saml."
        fr: "Créer un fournisseur d'identité SAML IAM à partir de la configuration de l'annuaire LDAP, et faire connecter les employés par https://signin.aws.amazon.com/saml."
answer: { optionId: c }
explanation:
  correct:
    en: "A custom identity broker can call AssumeRole with its own role credentials to obtain temporary credentials for a role that trusts it. It then passes those credentials to the federation endpoint (https://signin.aws.amazon.com/federation) to get a sign-in token and redirects the employee to a console URL built with that token, without any password or IAM user."
    fr: "Un courtier d'identité personnalisé peut appeler AssumeRole avec les informations d'identification de son propre rôle pour obtenir des informations d'identification temporaires d'un rôle qui l'approuve. Il transmet ensuite ces informations au point de terminaison de fédération (https://signin.aws.amazon.com/federation) pour obtenir un jeton de connexion et redirige l'employé vers une URL de console construite avec ce jeton, sans mot de passe ni utilisateur IAM."
  options:
    a:
      en: "Only an IAM user or the root user can call GetFederationToken, so BrokerRole credentials cannot be used and an IAM user would be required."
      fr: "Seul un utilisateur IAM ou l'utilisateur racine peut appeler GetFederationToken : les informations d'identification de BrokerRole ne conviennent pas et un utilisateur IAM serait nécessaire."
    b:
      en: "Only an IAM user or the root user can call GetSessionToken, and its credentials cannot be used with the federation endpoint to open the console."
      fr: "Seul un utilisateur IAM ou l'utilisateur racine peut appeler GetSessionToken, et ses informations d'identification ne peuvent pas être utilisées avec le point de terminaison de fédération pour ouvrir la console."
    d:
      en: "An IAM SAML provider requires a SAML 2.0 identity provider that issues signed assertions, which an LDAP directory alone does not provide."
      fr: "Un fournisseur SAML IAM exige un fournisseur d'identité SAML 2.0 qui émet des assertions signées, ce qu'un annuaire LDAP seul ne fournit pas."
references:
  - title: Compare AWS STS credentials
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_sts-comparison.html
