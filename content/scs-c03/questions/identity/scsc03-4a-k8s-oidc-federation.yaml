id: scsc03-4a-k8s-oidc-federation
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a self-managed Kubernetes cluster in its data center. The cluster's service account token issuer publishes an OpenID Connect (OIDC) discovery document and JSON Web Key Set at a public HTTPS URL. A workload that runs as the service account reporting in the namespace analytics must write to an Amazon S3 bucket. The company forbids long-term AWS access keys and does not want to operate a certificate authority for the workload.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite un cluster Kubernetes autogéré dans son centre de données. L'émetteur des jetons de comptes de service du cluster publie un document de découverte OpenID Connect (OIDC) et un jeu de clés web JSON (JWKS) à une URL HTTPS publique. Une charge de travail qui s'exécute sous le compte de service reporting de l'espace de noms analytics doit écrire dans un compartiment Amazon S3. L'entreprise interdit les clés d'accès AWS à long terme et ne veut pas exploiter d'autorité de certification pour cette charge de travail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an IAM user for the workload, store its access keys in a Kubernetes secret, and rotate the keys every 30 days with a scheduled job."
        fr: "Créer un utilisateur IAM pour la charge de travail, stocker ses clés d'accès dans un secret Kubernetes, et faire tourner les clés tous les 30 jours avec une tâche planifiée."
    - id: b
      text:
        en: "Create an IAM Roles Anywhere trust anchor and profile, issue an X.509 certificate to the workload, and obtain credentials with the credential helper."
        fr: "Créer une ancre d'approbation et un profil IAM Roles Anywhere, émettre un certificat X.509 pour la charge de travail, et obtenir les informations d'identification avec l'assistant d'informations d'identification."
    - id: c
      text:
        en: "Create an IAM OIDC identity provider for the issuer URL, and a role whose trust policy allows sts:AssumeRoleWithWebIdentity with conditions on the aud and sub claims."
        fr: "Créer un fournisseur d'identité OIDC IAM pour l'URL de l'émetteur, et un rôle dont la politique d'approbation autorise sts:AssumeRoleWithWebIdentity avec des conditions sur les revendications aud et sub."
    - id: d
      text:
        en: "Create an Amazon EKS Pod Identity association for the service account in the namespace, and run the EKS Pod Identity Agent on the cluster nodes."
        fr: "Créer une association EKS Pod Identity pour le compte de service de l'espace de noms, et exécuter l'agent EKS Pod Identity sur les nœuds du cluster."
answer: { optionId: c }
explanation:
  correct:
    en: "An IAM OIDC identity provider lets AWS STS validate tokens signed by the cluster's issuer, and AssumeRoleWithWebIdentity exchanges a projected service account token for temporary credentials. Conditions on the audience and on the sub claim (system:serviceaccount:analytics:reporting) limit the role to that service account."
    fr: "Un fournisseur d'identité OIDC IAM permet à AWS STS de valider les jetons signés par l'émetteur du cluster, et AssumeRoleWithWebIdentity échange un jeton de compte de service projeté contre des informations d'identification temporaires. Des conditions sur l'audience et sur la revendication sub (system:serviceaccount:analytics:reporting) limitent le rôle à ce compte de service."
  options:
    a:
      en: "IAM user access keys are long-term credentials, which the company forbids, even when they are rotated."
      fr: "Les clés d'accès d'un utilisateur IAM sont des informations d'identification à long terme, interdites par l'entreprise, même avec une rotation."
    b:
      en: "Roles Anywhere authenticates with X.509 certificates, which require the certificate authority that the company does not want to operate."
      fr: "Roles Anywhere authentifie avec des certificats X.509, qui exigent l'autorité de certification que l'entreprise ne veut pas exploiter."
    d:
      en: "EKS Pod Identity works only for Amazon EKS clusters, not for a self-managed cluster in a data center."
      fr: "EKS Pod Identity ne fonctionne que pour les clusters Amazon EKS, pas pour un cluster autogéré dans un centre de données."
references:
  - title: Create an OpenID Connect (OIDC) identity provider in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html
  - title: AssumeRoleWithWebIdentity
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRoleWithWebIdentity.html
