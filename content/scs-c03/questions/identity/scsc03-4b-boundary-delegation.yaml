id: scsc03-4b-boundary-delegation
objective: "4.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    In account 111122223333, developers must be able to create IAM roles for their AWS Lambda functions. Every role that a developer creates or modifies must have the customer managed policy DevBoundary as its permissions boundary. Developers must not be able to remove the boundary from a role, replace it with another policy, or change the permissions that DevBoundary allows. The developers' policy currently allows iam:CreateRole, iam:AttachRolePolicy, iam:PutRolePolicy, and iam:PutRolePermissionsBoundary with no conditions.

    Which combination of changes to the developers' policy will meet these requirements? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans le compte 111122223333, les développeurs doivent pouvoir créer des rôles IAM pour leurs fonctions AWS Lambda. Chaque rôle qu'un développeur crée ou modifie doit avoir la politique gérée par le client DevBoundary comme limite d'autorisations. Les développeurs ne doivent pas pouvoir retirer la limite d'un rôle, la remplacer par une autre politique ni modifier les autorisations que DevBoundary permet. La politique des développeurs autorise actuellement iam:CreateRole, iam:AttachRolePolicy, iam:PutRolePolicy et iam:PutRolePermissionsBoundary sans condition.

    Quelle combinaison de modifications de la politique des développeurs permet de répondre à ces exigences ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Add a StringEquals condition on iam:PermissionsBoundary for the DevBoundary policy ARN to the statement that allows the four role actions.
        fr: |-
          Ajouter une condition StringEquals sur iam:PermissionsBoundary pour l'ARN de la politique DevBoundary à l'instruction qui autorise les quatre actions sur les rôles.
    - id: b
      text:
        en: |-
          Add a statement that allows iam:PassRole on all roles so that developers can assign the roles they create to their functions.
        fr: |-
          Ajouter une instruction qui autorise iam:PassRole sur tous les rôles pour que les développeurs puissent affecter les rôles qu'ils créent à leurs fonctions.
    - id: c
      text:
        en: |-
          Add a statement that denies iam:DeleteRolePermissionsBoundary on all roles.
        fr: |-
          Ajouter une instruction qui refuse iam:DeleteRolePermissionsBoundary sur tous les rôles.
    - id: d
      text:
        en: |-
          Add a statement that denies iam:CreatePolicy so that developers cannot create managed policies.
        fr: |-
          Ajouter une instruction qui refuse iam:CreatePolicy pour que les développeurs ne puissent pas créer de politiques gérées.
    - id: e
      text:
        en: |-
          Add a StringEquals condition on iam:PolicyARN for the DevBoundary policy ARN to the statement that allows iam:CreateRole.
        fr: |-
          Ajouter une condition StringEquals sur iam:PolicyARN pour l'ARN de la politique DevBoundary à l'instruction qui autorise iam:CreateRole.
    - id: f
      text:
        en: |-
          Add a statement that denies iam:CreatePolicyVersion, iam:DeletePolicyVersion, iam:SetDefaultPolicyVersion, and iam:DeletePolicy on the DevBoundary policy ARN.
        fr: |-
          Ajouter une instruction qui refuse iam:CreatePolicyVersion, iam:DeletePolicyVersion, iam:SetDefaultPolicyVersion et iam:DeletePolicy sur l'ARN de la politique DevBoundary.
answer: { optionIds: [ a, c, f ] }
explanation:
  correct:
    en: |-
      The iam:PermissionsBoundary condition lets developers create or change roles only when DevBoundary is the boundary, which also prevents PutRolePermissionsBoundary from swapping in another policy. Denying iam:DeleteRolePermissionsBoundary stops the removal of the boundary, and denying new versions, version changes, and deletion of DevBoundary stops developers from loosening the boundary itself.
    fr: |-
      La condition iam:PermissionsBoundary ne permet aux développeurs de créer ou de modifier des rôles que si DevBoundary est la limite, ce qui empêche aussi PutRolePermissionsBoundary de lui substituer une autre politique. Refuser iam:DeleteRolePermissionsBoundary empêche le retrait de la limite, et refuser les nouvelles versions, les changements de version et la suppression de DevBoundary empêche les développeurs d'assouplir la limite elle-même.
  options:
    b:
      en: |-
        PassRole on all roles would let developers pass privileged roles to services, and it does nothing to enforce or protect the boundary.
      fr: |-
        PassRole sur tous les rôles permettrait aux développeurs de transmettre des rôles privilégiés à des services, et ne contribue en rien à imposer ou protéger la limite.
    d:
      en: |-
        Creating other managed policies does not weaken the boundary, because any role they create must still have DevBoundary, which caps what those policies grant.
      fr: |-
        Créer d'autres politiques gérées n'affaiblit pas la limite, car tout rôle créé doit toujours avoir DevBoundary, qui plafonne ce que ces politiques accordent.
    e:
      en: |-
        iam:PolicyARN checks the managed policy that is attached or detached; it does not check the permissions boundary of the role being created.
      fr: |-
        iam:PolicyARN vérifie la politique gérée attachée ou détachée ; elle ne vérifie pas la limite d'autorisations du rôle en cours de création.
references:
  - title: Permissions boundaries for IAM entities - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
