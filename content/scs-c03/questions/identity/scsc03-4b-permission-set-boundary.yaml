id: scsc03-4b-permission-set-boundary
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS IAM Identity Center. The DevOps permission set contains broad custom policies and is assigned in 40 member accounts, some of which were created recently. The security team must cap the permissions of DevOps sessions with a customer managed policy named DevOpsCap. Other principals in the accounts must not be affected.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS IAM Identity Center. L'ensemble d'autorisations DevOps contient des politiques personnalisées larges et est attribué dans 40 comptes membres, dont certains ont été créés récemment. L'équipe de sécurité doit plafonner les autorisations des sessions DevOps avec une politique gérée par le client nommée DevOpsCap. Les autres principaux des comptes ne doivent pas être affectés.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create DevOpsCap with the same name and path in all 40 accounts, and set it as the customer managed permissions boundary of the permission set.
        fr: |-
          Créer DevOpsCap avec le même nom et le même chemin dans les 40 comptes, et la définir comme limite d'autorisations gérée par le client de l'ensemble d'autorisations.
    - id: b
      text:
        en: |-
          Attach an SCP with the same statements as DevOpsCap to the OU that contains the 40 accounts, so that new accounts are covered too.
        fr: |-
          Attacher à l'UO qui contient les 40 comptes une SCP avec les mêmes instructions que DevOpsCap, pour couvrir aussi les nouveaux comptes.
    - id: c
      text:
        en: |-
          Add the statements of DevOpsCap to the inline policy of the DevOps permission set, next to its existing custom policies.
        fr: |-
          Ajouter les instructions de DevOpsCap à la politique en ligne de l'ensemble d'autorisations DevOps, à côté de ses politiques personnalisées existantes.
    - id: d
      text:
        en: |-
          Create the DevOpsCap policy only in the management account, and set it as the customer managed permissions boundary of the DevOps permission set.
        fr: |-
          Créer la politique DevOpsCap uniquement dans le compte de gestion, et la définir comme limite d'autorisations gérée par le client de l'ensemble d'autorisations DevOps.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A permission set can use a customer managed policy as a permissions boundary; Identity Center attaches the policy as the boundary of the role it creates in each account. The policy must exist with the same name in every account where the permission set is assigned, so it is deployed to all 40 accounts first, and only DevOps sessions are capped.
    fr: |-
      Un ensemble d'autorisations peut utiliser une politique gérée par le client comme limite d'autorisations ; Identity Center attache la politique comme limite du rôle qu'il crée dans chaque compte. La politique doit exister avec le même nom dans chaque compte où l'ensemble d'autorisations est attribué : elle est donc d'abord déployée dans les 40 comptes, et seules les sessions DevOps sont plafonnées.
  options:
    b:
      en: |-
        An SCP caps every principal in the accounts of the OU, which affects principals other than DevOps.
      fr: |-
        Une SCP plafonne tous les principaux des comptes de l'UO, ce qui affecte d'autres principaux que DevOps.
    c:
      en: |-
        An inline policy adds permissions to the union of the permission set's policies; it does not cap the broad custom policies.
      fr: |-
        Une politique en ligne ajoute des autorisations à l'union des politiques de l'ensemble d'autorisations ; elle ne plafonne pas les politiques personnalisées larges.
    d:
      en: |-
        Identity Center references the customer managed policy by name in each target account, so the policy must exist in every account where the permission set is assigned.
      fr: |-
        Identity Center référence la politique gérée par le client par son nom dans chaque compte cible : la politique doit exister dans chaque compte où l'ensemble d'autorisations est attribué.
references:
  - title: Custom permissions for AWS managed and customer managed policies - AWS IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetcustom.html
  - title: Manage AWS accounts with permission sets - AWS IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html
