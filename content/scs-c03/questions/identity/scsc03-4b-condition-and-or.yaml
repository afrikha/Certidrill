id: scsc03-4b-condition-and-or
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A role policy in account 111122223333 contains the following statement:

    ```json
    {
      "Effect": "Allow",
      "Action": "secretsmanager:GetSecretValue",
      "Resource": "*",
      "Condition": {
        "StringEquals": {
          "aws:PrincipalTag/dept": ["finance", "audit"],
          "aws:RequestedRegion": "eu-west-1"
        }
      }
    }
    ```

    No other statement allows secretsmanager:GetSecretValue.

    Which request does this statement allow?
  fr: |
    Une politique de rôle du compte 111122223333 contient l'instruction suivante :

    ```json
    {
      "Effect": "Allow",
      "Action": "secretsmanager:GetSecretValue",
      "Resource": "*",
      "Condition": {
        "StringEquals": {
          "aws:PrincipalTag/dept": ["finance", "audit"],
          "aws:RequestedRegion": "eu-west-1"
        }
      }
    }
    ```

    Aucune autre instruction n'autorise secretsmanager:GetSecretValue.

    Quelle demande cette instruction autorise-t-elle ?
body:
  options:
    - id: a
      text:
        en: |-
          A session with the principal tag dept=finance that retrieves a secret in eu-central-1.
        fr: |-
          Une session avec la balise de principal dept=finance qui récupère un secret dans eu-central-1.
    - id: b
      text:
        en: |-
          A session with no dept principal tag that retrieves a secret in eu-west-1.
        fr: |-
          Une session sans balise de principal dept qui récupère un secret dans eu-west-1.
    - id: c
      text:
        en: |-
          A session with the principal tag dept=hr that retrieves a secret in eu-west-1.
        fr: |-
          Une session avec la balise de principal dept=hr qui récupère un secret dans eu-west-1.
    - id: d
      text:
        en: |-
          A session with the principal tag dept=audit that retrieves a secret in eu-west-1.
        fr: |-
          Une session avec la balise de principal dept=audit qui récupère un secret dans eu-west-1.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Several context keys under one condition operator are evaluated with a logical AND, and several values for one key with a logical OR. The request must therefore come from a principal whose dept tag is finance or audit and target eu-west-1, which only the audit session in eu-west-1 satisfies.
    fr: |-
      Plusieurs clés de contexte sous un même opérateur de condition sont évaluées avec un ET logique, et plusieurs valeurs d'une même clé avec un OU logique. La demande doit donc provenir d'un principal dont la balise dept est finance ou audit et cibler eu-west-1, ce que seule la session audit dans eu-west-1 satisfait.
  options:
    a:
      en: |-
        The dept value matches, but the keys are combined with AND, so the eu-central-1 Region fails the aws:RequestedRegion test.
      fr: |-
        La valeur dept correspond, mais les clés sont combinées avec un ET : la Région eu-central-1 échoue au test aws:RequestedRegion.
    b:
      en: |-
        A missing aws:PrincipalTag/dept key does not match StringEquals, so the condition is false.
      fr: |-
        Une clé aws:PrincipalTag/dept absente ne correspond pas à StringEquals : la condition est fausse.
    c:
      en: |-
        hr is not one of the values listed for aws:PrincipalTag/dept, so the condition is false even though the Region matches.
      fr: |-
        hr ne fait pas partie des valeurs listées pour aws:PrincipalTag/dept : la condition est fausse, même si la Région correspond.
references:
  - title: Conditions with multiple context keys or values - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-logic-multiple-context-keys-or-values.html
