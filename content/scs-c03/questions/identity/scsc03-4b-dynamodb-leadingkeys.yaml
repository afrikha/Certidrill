id: scsc03-4b-dynamodb-leadingkeys
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Users of a mobile app authenticate through an Amazon Cognito identity pool and receive credentials for the IAM role AppUser. The Amazon DynamoDB table UserProfiles uses each user's Cognito identity ID as its partition key. Each user must be able to read and write only the items that belong to that user, and the policy must follow the principle of least privilege.

    Which policy statement should be attached to AppUser?
  fr: |
    Les utilisateurs d'une application mobile s'authentifient par un groupe d'identités Amazon Cognito et reçoivent des informations d'identification pour le rôle IAM AppUser. La table Amazon DynamoDB UserProfiles utilise l'ID d'identité Cognito de chaque utilisateur comme clé de partition. Chaque utilisateur doit pouvoir lire et écrire uniquement les éléments qui lui appartiennent, et la politique doit respecter le principe du moindre privilège.

    Quelle instruction de politique faut-il attacher à AppUser ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow item actions on the table ARN with a ForAllValues:StringEquals condition on dynamodb:Attributes for ${cognito-identity.amazonaws.com:sub} and a Null condition on dynamodb:Attributes set to false.
        fr: |-
          Autoriser les actions sur les éléments sur l'ARN de la table avec une condition ForAllValues:StringEquals sur dynamodb:Attributes pour ${cognito-identity.amazonaws.com:sub} et une condition Null sur dynamodb:Attributes définie sur false.
    - id: b
      text:
        en: |-
          Allow item actions on the resource arn:aws:dynamodb:eu-west-1:111122223333:table/UserProfiles/${cognito-identity.amazonaws.com:sub}, which names each user's partition.
        fr: |-
          Autoriser les actions sur les éléments sur la ressource arn:aws:dynamodb:eu-west-1:111122223333:table/UserProfiles/${cognito-identity.amazonaws.com:sub}, qui désigne la partition de chaque utilisateur.
    - id: c
      text:
        en: |-
          Allow item actions on the table ARN with a ForAllValues:StringEquals condition on dynamodb:LeadingKeys for ${cognito-identity.amazonaws.com:sub} and a Null condition on dynamodb:LeadingKeys set to false.
        fr: |-
          Autoriser les actions sur les éléments sur l'ARN de la table avec une condition ForAllValues:StringEquals sur dynamodb:LeadingKeys pour ${cognito-identity.amazonaws.com:sub} et une condition Null sur dynamodb:LeadingKeys définie sur false.
    - id: d
      text:
        en: |-
          Allow dynamodb:Scan on the table ARN, and have the app filter the scan results by the user's Cognito identity ID before it displays or updates any item.
        fr: |-
          Autoriser dynamodb:Scan sur l'ARN de la table, et faire filtrer les résultats de l'analyse par l'application selon l'ID d'identité Cognito de l'utilisateur avant d'afficher ou de modifier un élément.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      dynamodb:LeadingKeys holds the partition key values that a request accesses, so comparing it with the caller's Cognito identity ID limits each user to the items whose partition key is that ID. ForAllValues is required for this key, and the Null condition denies requests that carry no partition key value.
    fr: |-
      dynamodb:LeadingKeys contient les valeurs de clé de partition auxquelles accède une demande : la comparer à l'ID d'identité Cognito de l'appelant limite chaque utilisateur aux éléments dont la clé de partition est cet ID. ForAllValues est obligatoire pour cette clé, et la condition Null refuse les demandes qui ne portent aucune valeur de clé de partition.
  options:
    a:
      en: |-
        dynamodb:Attributes lists attribute names in the request, so it limits which attributes are returned, not which items the user can access.
      fr: |-
        dynamodb:Attributes liste des noms d'attributs de la demande : il limite les attributs renvoyés, et non les éléments auxquels l'utilisateur peut accéder.
    b:
      en: |-
        Items are not resources with their own ARNs, so a partition key value in the resource ARN does not match item requests.
      fr: |-
        Les éléments ne sont pas des ressources dotées de leur propre ARN : une valeur de clé de partition dans l'ARN de ressource ne correspond pas aux demandes sur les éléments.
    d:
      en: |-
        Scan returns all items regardless of the leading keys, so every user could read every profile; filtering in the app is not an access control.
      fr: |-
        Scan renvoie tous les éléments quelles que soient les clés de tête : chaque utilisateur pourrait lire tous les profils ; filtrer dans l'application n'est pas un contrôle d'accès.
references:
  - title: Using IAM policy conditions for fine-grained access control - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/specifying-conditions.html
