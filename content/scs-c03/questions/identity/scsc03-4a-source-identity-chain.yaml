id: scsc03-4a-source-identity-chain
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's employees federate from the company's SAML 2.0 IdP into an IAM role in a hub account, and from there they assume roles in several workload accounts (role chaining). Auditors require that every action that AWS CloudTrail records in the workload accounts identify the employee who started the session. Employees must not be able to change or remove this value when they assume the next role.

    Which solution will meet these requirements?
  fr: |
    Les employés d'AnyCompany se fédèrent depuis l'IdP SAML 2.0 de l'entreprise vers un rôle IAM d'un compte pivot (hub), puis endossent des rôles dans plusieurs comptes de charge de travail (chaînage de rôles). Les auditeurs exigent que chaque action enregistrée par AWS CloudTrail dans les comptes de charge de travail identifie l'employé qui a ouvert la session. Les employés ne doivent pas pouvoir modifier ni supprimer cette valeur lorsqu'ils endossent le rôle suivant.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Configure the IdP to send the RoleSessionName attribute with the employee's username, and require employees to reuse that session name when they assume the workload roles."
        fr: "Configurer l'IdP pour envoyer l'attribut RoleSessionName avec le nom d'utilisateur de l'employé, et exiger que les employés réutilisent ce nom de session lorsqu'ils endossent les rôles de charge de travail."
    - id: b
      text:
        en: "Configure the IdP to send the SourceIdentity attribute with the employee's username, and allow sts:SetSourceIdentity wherever the hub role and the workload roles are assumed."
        fr: "Configurer l'IdP pour envoyer l'attribut SourceIdentity avec le nom d'utilisateur de l'employé, et autoriser sts:SetSourceIdentity partout où le rôle pivot et les rôles de charge de travail sont endossés."
    - id: c
      text:
        en: "Configure the IdP to send a PrincipalTag attribute with the employee's username without listing it in TransitiveTagKeys, and allow sts:TagSession in the hub role's trust policy."
        fr: "Configurer l'IdP pour envoyer un attribut PrincipalTag avec le nom d'utilisateur de l'employé sans l'inclure dans TransitiveTagKeys, et autoriser sts:TagSession dans la politique d'approbation du rôle pivot."
    - id: d
      text:
        en: "Tag each workload role with the names of the employees who are allowed to use it, and search CloudTrail events for the tags of the roles."
        fr: "Baliser chaque rôle de charge de travail avec le nom des employés autorisés à l'utiliser, et rechercher les balises des rôles dans les événements CloudTrail."
answer: { optionId: b }
explanation:
  correct:
    en: "A source identity set from the SAML SourceIdentity attribute persists for the session and through role chaining, and it cannot be changed: a chained request with a different value is denied. CloudTrail records it in userIdentity.sessionContext.sourceIdentity for later actions. Cross-account chaining requires sts:SetSourceIdentity in the calling role's permissions and in each target role's trust policy."
    fr: "Une identité source définie à partir de l'attribut SAML SourceIdentity persiste pendant la session et à travers le chaînage de rôles, et elle ne peut pas être modifiée : une requête chaînée avec une valeur différente est refusée. CloudTrail l'enregistre dans userIdentity.sessionContext.sourceIdentity pour les actions suivantes. Le chaînage entre comptes exige sts:SetSourceIdentity dans les autorisations du rôle appelant et dans la politique d'approbation de chaque rôle cible."
  options:
    a:
      en: "Each AssumeRole call sets its own session name, so employees can choose a different value at every hop."
      fr: "Chaque appel AssumeRole définit son propre nom de session : les employés peuvent choisir une valeur différente à chaque étape."
    c:
      en: "Session tags that are not transitive do not persist when the employee assumes the next role."
      fr: "Les balises de session non transitives ne persistent pas lorsque l'employé endosse le rôle suivant."
    d:
      en: "Role tags describe the role, not the person who uses a given session, and several employees can share each role."
      fr: "Les balises de rôle décrivent le rôle, pas la personne qui utilise une session donnée, et plusieurs employés peuvent partager chaque rôle."
references:
  - title: Monitor and control actions taken with assumed roles
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp_control-access_monitor.html
  - title: Configure SAML assertions for the authentication response
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_saml_assertions.html
