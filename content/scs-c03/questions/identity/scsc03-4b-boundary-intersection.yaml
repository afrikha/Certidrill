id: scsc03-4b-boundary-intersection
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The IAM role AppWorker in account 111122223333 has the following identity-based policy:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "dynamodb:*"],
          "Resource": "*"
        }
      ]
    }
    ```

    The role has the following permissions boundary:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": "s3:*",
          "Resource": ["arn:aws:s3:::app-data", "arn:aws:s3:::app-data/*"]
        },
        {
          "Effect": "Allow",
          "Action": "sqs:SendMessage",
          "Resource": "*"
        }
      ]
    }
    ```

    No other policies apply to the role, and no resource-based policy grants it access.

    Which actions can AppWorker perform?
  fr: |
    Le rôle IAM AppWorker du compte 111122223333 possède la politique basée sur l'identité suivante :

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "dynamodb:*"],
          "Resource": "*"
        }
      ]
    }
    ```

    Le rôle possède la limite d'autorisations suivante :

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": "s3:*",
          "Resource": ["arn:aws:s3:::app-data", "arn:aws:s3:::app-data/*"]
        },
        {
          "Effect": "Allow",
          "Action": "sqs:SendMessage",
          "Resource": "*"
        }
      ]
    }
    ```

    Aucune autre politique ne s'applique au rôle, et aucune politique basée sur les ressources ne lui accorde d'accès.

    Quelles actions AppWorker peut-il effectuer ?
body:
  options:
    - id: a
      text:
        en: |-
          s3:GetObject and s3:PutObject on all buckets, and all DynamoDB actions.
        fr: |-
          s3:GetObject et s3:PutObject sur tous les compartiments, et toutes les actions DynamoDB.
    - id: b
      text:
        en: |-
          All S3 actions on app-data, sqs:SendMessage, and all DynamoDB actions.
        fr: |-
          Toutes les actions S3 sur app-data, sqs:SendMessage et toutes les actions DynamoDB.
    - id: c
      text:
        en: |-
          s3:GetObject and s3:PutObject on objects in app-data only.
        fr: |-
          s3:GetObject et s3:PutObject sur les objets d'app-data uniquement.
    - id: d
      text:
        en: |-
          s3:GetObject and s3:PutObject on objects in app-data, and sqs:SendMessage.
        fr: |-
          s3:GetObject et s3:PutObject sur les objets d'app-data, et sqs:SendMessage.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The effective permissions of a role with a permissions boundary are the intersection of its identity-based policies and the boundary. Only s3:GetObject and s3:PutObject on app-data objects are allowed by both; DynamoDB is outside the boundary, and the boundary's SQS permission is not granted by any identity-based policy.
    fr: |-
      Les autorisations effectives d'un rôle doté d'une limite d'autorisations sont l'intersection de ses politiques basées sur l'identité et de la limite. Seuls s3:GetObject et s3:PutObject sur les objets d'app-data sont autorisés par les deux ; DynamoDB est hors de la limite, et l'autorisation SQS de la limite n'est accordée par aucune politique basée sur l'identité.
  options:
    a:
      en: |-
        This ignores the boundary, which caps the identity-based policy to app-data and excludes DynamoDB.
      fr: |-
        Cette réponse ignore la limite, qui plafonne la politique basée sur l'identité à app-data et exclut DynamoDB.
    b:
      en: |-
        This is the union of the two policies; a boundary never grants permissions, so its broader S3 and SQS statements add nothing.
      fr: |-
        Il s'agit de l'union des deux politiques ; une limite n'accorde jamais d'autorisations : ses instructions S3 et SQS plus larges n'ajoutent rien.
    d:
      en: |-
        sqs:SendMessage appears only in the boundary, and a boundary grants no permissions on its own.
      fr: |-
        sqs:SendMessage n'apparaît que dans la limite, et une limite n'accorde aucune autorisation à elle seule.
references:
  - title: Permissions boundaries for IAM entities - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
