id: scsc03-4c-analyzer-org-zone
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 40 accounts in AWS Organizations, all of them in the us-east-1 Region, and a security account that is the delegated administrator for IAM Access Analyzer. Teams share Amazon S3 buckets, AWS KMS keys and IAM roles between member accounts, which is intended. The security team wants findings only for resources that grant access to principals outside the organization.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 40 comptes dans AWS Organizations, tous dans la Région us-east-1, et un compte de sécurité qui est l'administrateur délégué d'IAM Access Analyzer. Les équipes partagent des compartiments Amazon S3, des clés AWS KMS et des rôles IAM entre comptes membres, ce qui est voulu. L'équipe de sécurité veut des résultats uniquement pour les ressources qui accordent l'accès à des principaux extérieurs à l'organisation.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an external access analyzer in each member account with the account as the zone of trust.
        fr: |-
          Créer dans chaque compte membre un analyseur d'accès externe avec le compte comme zone de confiance.
    - id: b
      text:
        en: |-
          Create an internal access analyzer in the security account with the organization as the zone of trust.
        fr: |-
          Créer dans le compte de sécurité un analyseur d'accès interne avec l'organisation comme zone de confiance.
    - id: c
      text:
        en: |-
          Create an unused access analyzer in the security account with the organization as the zone of trust.
        fr: |-
          Créer dans le compte de sécurité un analyseur d'accès inutilisé avec l'organisation comme zone de confiance.
    - id: d
      text:
        en: |-
          Create an external access analyzer in the security account with the organization as the zone of trust.
        fr: |-
          Créer dans le compte de sécurité un analyseur d'accès externe avec l'organisation comme zone de confiance.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An external access analyzer generates a finding when a resource-based policy grants access to a principal outside its zone of trust. With the organization as the zone of trust, created from the delegated administrator account, sharing between member accounts is trusted and only access from outside the organization produces findings.
    fr: |-
      Un analyseur d'accès externe génère un résultat quand une politique basée sur les ressources accorde l'accès à un principal extérieur à sa zone de confiance. Avec l'organisation comme zone de confiance, créé depuis le compte administrateur délégué, le partage entre comptes membres est approuvé et seul l'accès depuis l'extérieur de l'organisation produit des résultats.
  options:
    a:
      en: |-
        With an account as the zone of trust, sharing with the other member accounts would also produce findings, which the team does not want.
      fr: |-
        Avec un compte comme zone de confiance, le partage avec les autres comptes membres produirait aussi des résultats, ce que l'équipe ne veut pas.
    b:
      en: |-
        An internal access analyzer shows which principals inside the organization can access selected resources; it does not report access from outside.
      fr: |-
        Un analyseur d'accès interne montre quels principaux de l'organisation peuvent accéder à des ressources choisies ; il ne signale pas l'accès depuis l'extérieur.
    c:
      en: |-
        An unused access analyzer reports unused roles, keys, passwords and permissions; it does not analyze resource-based policies for external access.
      fr: |-
        Un analyseur d'accès inutilisé signale les rôles, clés, mots de passe et autorisations inutilisés ; il n'analyse pas les politiques basées sur les ressources pour l'accès externe.
references:
  - title: Using AWS Identity and Access Management Access Analyzer - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
