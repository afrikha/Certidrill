id: scsc03-4c-partner-trust-root
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    IAM Access Analyzer reports external access for the role VendorMonitoring in AnyCompany's account. Its trust policy allows sts:AssumeRole for the principal arn:aws:iam::999988887777:root with no condition. Account 999988887777 belongs to a SaaS monitoring provider that serves many customers and assumes customer roles only from its role arn:aws:iam::999988887777:role/Collector. The provider issued AnyCompany a unique external ID. The security team must limit the trust to the provider's collector role and protect the company against the confused deputy problem.

    Which trust policy change will meet these requirements?
  fr: |
    IAM Access Analyzer signale un accès externe pour le rôle VendorMonitoring du compte d'AnyCompany. Sa politique d'approbation autorise sts:AssumeRole pour le principal arn:aws:iam::999988887777:root sans aucune condition. Le compte 999988887777 appartient à un fournisseur SaaS de supervision qui sert de nombreux clients et n'assume les rôles de ses clients que depuis son rôle arn:aws:iam::999988887777:role/Collector. Le fournisseur a remis à AnyCompany un ID externe unique. L'équipe de sécurité doit limiter l'approbation au rôle collecteur du fournisseur et protéger l'entreprise contre le problème de l'adjoint confus.

    Quelle modification de la politique d'approbation permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the principal with the Collector role ARN, and add no condition, because naming a single role prevents the confused deputy problem.
        fr: |-
          Remplacer le principal par l'ARN du rôle Collector, sans ajouter de condition, car désigner un seul rôle empêche le problème de l'adjoint confus.
    - id: b
      text:
        en: |-
          Keep the account principal, and add an aws:PrincipalOrgID condition with the ID of AnyCompany's organization.
        fr: |-
          Conserver le principal du compte, et ajouter une condition aws:PrincipalOrgID avec l'ID de l'organisation d'AnyCompany.
    - id: c
      text:
        en: |-
          Replace the principal with the Collector role ARN, and add a StringEquals condition on sts:ExternalId with the ID that the provider issued.
        fr: |-
          Remplacer le principal par l'ARN du rôle Collector, et ajouter une condition StringEquals sur sts:ExternalId avec l'ID remis par le fournisseur.
    - id: d
      text:
        en: |-
          Keep the account principal, and attach a service control policy (SCP) to AnyCompany's account that denies sts:AssumeRole to every role except Collector.
        fr: |-
          Conserver le principal du compte, et attacher au compte d'AnyCompany une politique de contrôle des services (SCP) qui refuse sts:AssumeRole à tous les rôles sauf Collector.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Trusting the account root delegates the decision to any administrator of the provider's account, so naming the Collector role narrows the trust. Because the provider assumes roles for many customers, another customer could give it the ARN of AnyCompany's role; the external ID, which the provider controls per customer, makes such confused deputy requests fail. Access Analyzer then resolves the old finding and creates a new one for the narrowed access, which the team can archive as intended.
    fr: |-
      Approuver la racine du compte délègue la décision à n'importe quel administrateur du compte du fournisseur : désigner le rôle Collector restreint l'approbation. Comme le fournisseur assume des rôles pour de nombreux clients, un autre client pourrait lui donner l'ARN du rôle d'AnyCompany ; l'ID externe, que le fournisseur contrôle pour chaque client, fait échouer ces requêtes d'adjoint confus. Access Analyzer résout alors l'ancien résultat et en crée un nouveau pour l'accès restreint, que l'équipe peut archiver comme voulu.
  options:
    a:
      en: |-
        The Collector role acts for every customer of the provider, so without an external ID another customer could make it assume AnyCompany's role.
      fr: |-
        Le rôle Collector agit pour tous les clients du fournisseur : sans ID externe, un autre client pourrait l'amener à assumer le rôle d'AnyCompany.
    b:
      en: |-
        The provider's account is not in AnyCompany's organization, so this condition would block the provider entirely.
      fr: |-
        Le compte du fournisseur n'appartient pas à l'organisation d'AnyCompany : cette condition bloquerait entièrement le fournisseur.
    d:
      en: |-
        SCPs do not affect principals from accounts outside the organization, so the trust would remain open to the whole provider account.
      fr: |-
        Les SCP n'affectent pas les principaux de comptes extérieurs à l'organisation : l'approbation resterait ouverte à tout le compte du fournisseur.
references:
  - title: The confused deputy problem - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/confused-deputy.html
  - title: Resolve IAM Access Analyzer findings - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-findings-remediate.html
