id: scsc03-4b-session-policy-tenant
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company stores the data of 2,000 tenants in the bucket tenant-data, with each tenant's objects under the prefix <tenant-id>/. A token vending service assumes the shared role TenantData, whose policy allows s3:GetObject and s3:PutObject on tenant-data/*, and hands the temporary credentials to a tenant's workload. Each set of credentials must allow access only to that tenant's prefix. The company does not want to create IAM resources for each tenant and wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise SaaS stocke les données de 2 000 locataires dans le compartiment tenant-data, les objets de chaque locataire étant sous le préfixe <tenant-id>/. Un service de distribution de jetons endosse le rôle partagé TenantData, dont la politique autorise s3:GetObject et s3:PutObject sur tenant-data/*, et remet les informations d'identification temporaires à la charge de travail d'un locataire. Chaque jeu d'informations d'identification ne doit permettre l'accès qu'au préfixe de ce locataire. L'entreprise ne veut pas créer de ressources IAM par locataire et veut la charge opérationnelle la PLUS FAIBLE.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create one IAM role for each tenant with a policy for the tenant's prefix, and have the service assume the tenant's role.
        fr: |-
          Créer un rôle IAM par locataire avec une politique pour le préfixe du locataire, et faire endosser le rôle du locataire par le service.
    - id: b
      text:
        en: |-
          Attach a permissions boundary to TenantData that allows s3:GetObject and s3:PutObject only on the prefix of the requesting tenant.
        fr: |-
          Attacher à TenantData une limite d'autorisations qui autorise s3:GetObject et s3:PutObject uniquement sur le préfixe du locataire demandeur.
    - id: c
      text:
        en: |-
          Tag the TenantData role with the tenant ID before each AssumeRole call, and use the role tag in the role's policy.
        fr: |-
          Baliser le rôle TenantData avec l'ID du locataire avant chaque appel AssumeRole, et utiliser la balise de rôle dans la politique du rôle.
    - id: d
      text:
        en: |-
          Pass an inline session policy in the Policy parameter of AssumeRole that allows the two actions only on tenant-data/<tenant-id>/*.
        fr: |-
          Transmettre une politique de session en ligne dans le paramètre Policy d'AssumeRole qui autorise les deux actions uniquement sur tenant-data/<tenant-id>/*.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A session policy passed at AssumeRole limits the session to the intersection of the role's policies and the session policy. The service generates one policy per request for the tenant's prefix, so each set of credentials is scoped to one tenant without any per-tenant role or policy in IAM.
    fr: |-
      Une politique de session transmise lors d'AssumeRole limite la session à l'intersection des politiques du rôle et de la politique de session. Le service génère une politique par demande pour le préfixe du locataire : chaque jeu d'informations d'identification est limité à un locataire, sans rôle ni politique IAM par locataire.
  options:
    a:
      en: |-
        A role for each of 2,000 tenants creates the per-tenant IAM resources that the company wants to avoid.
      fr: |-
        Un rôle pour chacun des 2 000 locataires crée les ressources IAM par locataire que l'entreprise veut éviter.
    b:
      en: |-
        A permissions boundary is a static managed policy on the role and applies the same way to every session, so it cannot follow the requesting tenant.
      fr: |-
        Une limite d'autorisations est une politique gérée statique attachée au rôle et s'applique de la même façon à toutes les sessions : elle ne peut pas suivre le locataire demandeur.
    c:
      en: |-
        Changing a shared role tag before each call creates race conditions between concurrent requests and affects every session of the role.
      fr: |-
        Modifier une balise de rôle partagé avant chaque appel crée des conflits entre demandes simultanées et affecte toutes les sessions du rôle.
references:
  - title: Policies and permissions in AWS Identity and Access Management - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html
  - title: IAM and AWS STS quotas - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_iam-quotas.html
