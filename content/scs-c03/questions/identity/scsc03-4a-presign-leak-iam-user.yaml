id: scsc03-4a-presign-leak-iam-user
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legacy batch application at AnyCompany signs Amazon S3 presigned URLs with the access key of a dedicated IAM user, with an expiration of 7 days. Several URLs that grant access to confidential objects were posted on a public forum. The security team must invalidate all URLs signed by the application as soon as possible, without blocking the other principals that use the bucket. The application can be restarted with new credentials.

    Which solution will meet these requirements?
  fr: |
    Une application de traitement par lots héritée d'AnyCompany signe des URL présignées Amazon S3 avec la clé d'accès d'un utilisateur IAM dédié, avec une expiration de 7 jours. Plusieurs URL qui donnent accès à des objets confidentiels ont été publiées sur un forum public. L'équipe de sécurité doit invalider au plus vite toutes les URL signées par l'application, sans bloquer les autres principaux qui utilisent le compartiment. L'application peut être redémarrée avec de nouvelles informations d'identification.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach an inline policy to the IAM user that denies all actions when aws:TokenIssueTime is earlier than the current date and time."
        fr: "Attacher à l'utilisateur IAM une politique en ligne qui refuse toutes les actions lorsque aws:TokenIssueTime est antérieur à la date et à l'heure actuelles."
    - id: b
      text:
        en: "Deactivate the IAM user's access key that signed the URLs, and give the application a new access key for the user."
        fr: "Désactiver la clé d'accès de l'utilisateur IAM qui a signé les URL, et donner à l'application une nouvelle clé d'accès pour cet utilisateur."
    - id: c
      text:
        en: "Add a bucket policy statement that denies s3:GetObject to all principals until the published URLs expire in 7 days."
        fr: "Ajouter une instruction de politique de compartiment qui refuse s3:GetObject à tous les principaux jusqu'à l'expiration des URL publiées dans 7 jours."
    - id: d
      text:
        en: "Rotate the AWS KMS key that encrypts the objects so that requests with the published URLs can no longer decrypt them."
        fr: "Effectuer la rotation de la clé AWS KMS qui chiffre les objets pour que les requêtes faites avec les URL publiées ne puissent plus les déchiffrer."
answer: { optionId: b }
explanation:
  correct:
    en: "A presigned URL stops working when the credential that signed it is revoked, deleted or deactivated, even if its expiration time has not been reached. Deactivating the access key invalidates every URL it signed, and the application continues with a new key."
    fr: "Une URL présignée cesse de fonctionner lorsque l'information d'identification qui l'a signée est révoquée, supprimée ou désactivée, même si son heure d'expiration n'est pas atteinte. Désactiver la clé d'accès invalide toutes les URL qu'elle a signées, et l'application continue avec une nouvelle clé."
  options:
    a:
      en: "aws:TokenIssueTime is present only in requests signed with temporary credentials, so the deny would not match requests signed with the user's access key."
      fr: "aws:TokenIssueTime n'est présent que dans les requêtes signées avec des informations d'identification temporaires : le refus ne correspondrait pas aux requêtes signées avec la clé d'accès de l'utilisateur."
    c:
      en: "A deny for all principals would also block everyone else who reads from the bucket."
      fr: "Un refus pour tous les principaux bloquerait aussi tous ceux qui lisent dans le compartiment."
    d:
      en: "Rotation keeps the earlier key material for decryption, so the existing objects remain readable."
      fr: "La rotation conserve les éléments de clé précédents pour le déchiffrement : les objets existants restent lisibles."
references:
  - title: Download and upload objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html
  - title: Revoke IAM role temporary security credentials
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_revoke-sessions.html
