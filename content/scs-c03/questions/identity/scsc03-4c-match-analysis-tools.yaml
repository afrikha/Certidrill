id: scsc03-4c-match-analysis-tools
objective: "4.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    The security team at AnyCompany is building a runbook for authorization failures.

    Match each task with the tool that the team should use. Each tool can be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe de sécurité d'AnyCompany rédige un guide d'intervention pour les échecs d'autorisation.

    Associez chaque tâche à l'outil que l'équipe doit utiliser. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: decode, text: { en: "AWS STS DecodeAuthorizationMessage", fr: "AWS STS DecodeAuthorizationMessage" } }
    - { id: sim, text: { en: "IAM policy simulator", fr: "Simulateur de politiques IAM" } }
    - { id: trail, text: { en: "AWS CloudTrail events", fr: "Événements AWS CloudTrail" } }
    - { id: validate, text: { en: "IAM Access Analyzer policy validation", fr: "Validation de politiques IAM Access Analyzer" } }
    - { id: preview, text: { en: "IAM Access Analyzer access preview", fr: "Aperçu d'accès IAM Access Analyzer" } }
    - { id: credreport, text: { en: "IAM credential report", fr: "Rapport d'informations d'identification IAM" } }
  targets:
    - id: t1
      text: { en: "Read the condition key values of an Amazon EC2 request that returned an encoded authorization failure message.", fr: "Lire les valeurs des clés de condition d'une requête Amazon EC2 qui a renvoyé un message d'échec d'autorisation encodé." }
    - id: t2
      text: { en: "Test whether a draft identity-based policy, combined with a permissions boundary, allows s3:PutObject on a bucket before either policy is attached.", fr: "Tester si une politique basée sur l'identité en projet, combinée à une limite d'autorisations, autorise s3:PutObject sur un compartiment avant d'attacher l'une ou l'autre." }
    - id: t3
      text: { en: "Find which principal received AccessDenied errors for kms:Decrypt yesterday, and from which source IP address.", fr: "Trouver quel principal a reçu hier des erreurs AccessDenied pour kms:Decrypt, et depuis quelle adresse IP source." }
    - id: t4
      text: { en: "Find grammar errors and security warnings in an identity-based policy that a developer submits.", fr: "Trouver les erreurs de grammaire et les avertissements de sécurité d'une politique basée sur l'identité soumise par un développeur." }
answer:
  mapping: { t1: decode, t2: sim, t3: trail, t4: validate }
explanation:
  correct:
    en: |-
      DecodeAuthorizationMessage reveals the principal, action, resource, explicit or implicit deny and condition key values hidden in an encoded message. The policy simulator evaluates identity-based policies and a permissions boundary without making real requests, including policies not yet attached. CloudTrail records failed calls with the principal, error code and source IP address. Policy validation returns errors, security warnings, warnings and suggestions for a policy document.
    fr: |-
      DecodeAuthorizationMessage révèle le principal, l'action, la ressource, le refus explicite ou implicite et les valeurs des clés de condition cachés dans un message encodé. Le simulateur de politiques évalue des politiques basées sur l'identité et une limite d'autorisations sans envoyer de vraies requêtes, y compris des politiques pas encore attachées. CloudTrail enregistre les appels en échec avec le principal, le code d'erreur et l'adresse IP source. La validation de politique renvoie les erreurs, avertissements de sécurité, avertissements et suggestions d'un document de politique.
  options:
    preview:
      en: "An access preview shows the public and cross-account access that a proposed resource policy would grant; it does not analyze identity-based policies or failed requests."
      fr: "Un aperçu d'accès montre l'accès public et entre comptes qu'accorderait une politique de ressource proposée ; il n'analyse ni les politiques basées sur l'identité ni les requêtes en échec."
    credreport:
      en: "The credential report lists the status of IAM user passwords, access keys and MFA devices; it contains no authorization results."
      fr: "Le rapport d'informations d'identification liste l'état des mots de passe, clés d'accès et dispositifs MFA des utilisateurs IAM ; il ne contient aucun résultat d'autorisation."
references:
  - title: IAM policy testing with the IAM policy simulator - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_testing-policies.html
  - title: DecodeAuthorizationMessage - AWS Security Token Service
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_DecodeAuthorizationMessage.html
