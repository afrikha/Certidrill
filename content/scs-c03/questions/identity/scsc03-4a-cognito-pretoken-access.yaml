id: scsc03-4a-cognito-pretoken-access
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's multi-tenant SaaS API runs behind Amazon API Gateway. Users sign in through an Amazon Cognito user pool on the Essentials feature plan, and each user has a tenant identifier stored in a custom attribute that users cannot write. The API's backend services accept only access tokens, and they must read a tenant_id claim from each access token to scope every request.

    Which solution will meet these requirements?
  fr: |
    L'API SaaS multilocataire d'AnyCompany s'exécute derrière Amazon API Gateway. Les utilisateurs se connectent par un groupe d'utilisateurs Amazon Cognito au niveau Essentials, et chaque utilisateur possède un identifiant de locataire stocké dans un attribut personnalisé que les utilisateurs ne peuvent pas modifier. Les services backend de l'API n'acceptent que des jetons d'accès, et ils doivent lire une revendication tenant_id dans chaque jeton d'accès pour délimiter chaque requête.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Configure a pre token generation Lambda trigger with event version V2_0 that adds a tenant_id claim to the access token from the custom attribute."
        fr: "Configurer un déclencheur Lambda de prégénération de jeton avec la version d'événement V2_0 qui ajoute au jeton d'accès une revendication tenant_id issue de l'attribut personnalisé."
    - id: b
      text:
        en: "Configure a pre token generation Lambda trigger with event version V1_0 that adds a tenant_id claim from the custom attribute to the issued tokens."
        fr: "Configurer un déclencheur Lambda de prégénération de jeton avec la version d'événement V1_0 qui ajoute aux jetons émis une revendication tenant_id issue de l'attribut personnalisé."
    - id: c
      text:
        en: "Grant the app client read permission on the custom attribute so that Amazon Cognito includes the attribute in the access token."
        fr: "Accorder au client d'application l'autorisation de lecture sur l'attribut personnalisé pour qu'Amazon Cognito inclue l'attribut dans le jeton d'accès."
    - id: d
      text:
        en: "Configure a pre authentication Lambda trigger that adds the tenant identifier to the access token as a claim before sign-in completes."
        fr: "Configurer un déclencheur Lambda de pré-authentification qui ajoute l'identifiant de locataire au jeton d'accès sous forme de revendication avant la fin de la connexion."
answer: { optionId: a }
explanation:
  correct:
    en: "Access token customization requires the pre token generation trigger with event version V2_0 (or V3_0), which is available on the Essentials and Plus feature plans. The function adds the claim to the access token with claimsToAddOrOverride under accessTokenGeneration. Event version V1_0 customizes only the ID token."
    fr: "La personnalisation du jeton d'accès exige le déclencheur de prégénération de jeton avec la version d'événement V2_0 (ou V3_0), disponible aux niveaux Essentials et Plus. La fonction ajoute la revendication au jeton d'accès avec claimsToAddOrOverride sous accessTokenGeneration. La version d'événement V1_0 ne personnalise que le jeton d'identification (ID)."
  options:
    b:
      en: "Event version V1_0 customizes only the ID token, so the access token would still lack the claim."
      fr: "La version d'événement V1_0 ne personnalise que le jeton d'identification : le jeton d'accès n'aurait toujours pas la revendication."
    c:
      en: "Attribute read permissions control which attributes an app client can read and receive in the ID token; they do not add custom attributes to access tokens."
      fr: "Les autorisations de lecture d'attributs déterminent les attributs qu'un client d'application peut lire et recevoir dans le jeton d'identification ; elles n'ajoutent pas d'attributs personnalisés aux jetons d'accès."
    d:
      en: "The pre authentication trigger can accept or reject a sign-in attempt, but it cannot change the contents of tokens."
      fr: "Le déclencheur de pré-authentification peut accepter ou refuser une tentative de connexion, mais il ne peut pas modifier le contenu des jetons."
references:
  - title: Pre token generation Lambda trigger
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-lambda-pre-token-generation.html
