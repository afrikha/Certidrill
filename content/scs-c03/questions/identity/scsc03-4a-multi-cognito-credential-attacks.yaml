id: scsc03-4a-multi-cognito-credential-attacks
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's customer portal authenticates users through an Amazon Cognito user pool on the Plus feature plan. The portal's back end signs users in with the ADMIN_USER_PASSWORD_AUTH flow. A penetration test found two issues: sign-in and forgot-password responses reveal whether a username exists, and users can sign up with, sign in with and change to passwords that appear in public lists of leaked credentials. The company must fix both issues with Amazon Cognito features.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Le portail client d'AnyCompany authentifie les utilisateurs par un groupe d'utilisateurs Amazon Cognito au niveau Plus. Le backend du portail connecte les utilisateurs avec le flux ADMIN_USER_PASSWORD_AUTH. Un test d'intrusion a relevé deux problèmes : les réponses de connexion et de mot de passe oublié révèlent si un nom d'utilisateur existe, et les utilisateurs peuvent s'inscrire, se connecter et changer de mot de passe avec des mots de passe qui figurent dans des listes publiques d'informations d'identification divulguées. L'entreprise doit corriger les deux problèmes avec des fonctionnalités d'Amazon Cognito.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Set PreventUserExistenceErrors to ENABLED on the portal's app client."
        fr: "Définir PreventUserExistenceErrors sur ENABLED sur le client d'application du portail."
    - id: b
      text:
        en: "Switch the back end to the USER_SRP_AUTH flow so that passwords are never sent to Amazon Cognito."
        fr: "Passer le backend au flux USER_SRP_AUTH pour que les mots de passe ne soient jamais envoyés à Amazon Cognito."
    - id: c
      text:
        en: "Set MFA enforcement to Required with SMS messages so that a leaked password alone is not enough to sign in."
        fr: "Définir l'application de la MFA sur Required avec des SMS pour qu'un mot de passe divulgué ne suffise pas à lui seul pour se connecter."
    - id: d
      text:
        en: "Activate threat protection in full-function mode, and set compromised credentials detection to Block sign-in for sign-in, sign-up and password-change events."
        fr: "Activer la protection contre les menaces en mode complet (full function), et configurer la détection des informations d'identification compromises sur Block sign-in pour les événements de connexion, d'inscription et de changement de mot de passe."
    - id: e
      text:
        en: "Add a pre sign-up Lambda trigger that rejects sign-up requests for usernames that already exist in the user pool."
        fr: "Ajouter un déclencheur Lambda de pré-inscription qui refuse les demandes d'inscription pour les noms d'utilisateur qui existent déjà dans le groupe d'utilisateurs."
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: "With PreventUserExistenceErrors set to ENABLED, password sign-in flows return a generic NotAuthorizedException for unknown users, and ForgotPassword simulates code delivery instead of reporting that the user does not exist. Threat protection, available on the Plus plan, compares credentials with lists of leaked credentials and can block sign-in, sign-up and password changes; it supports ADMIN_USER_PASSWORD_AUTH but not SRP."
    fr: "Avec PreventUserExistenceErrors défini sur ENABLED, les flux de connexion par mot de passe renvoient une NotAuthorizedException générique pour les utilisateurs inconnus, et ForgotPassword simule l'envoi d'un code au lieu d'indiquer que l'utilisateur n'existe pas. La protection contre les menaces, disponible au niveau Plus, compare les informations d'identification à des listes d'informations divulguées et peut bloquer la connexion, l'inscription et le changement de mot de passe ; elle prend en charge ADMIN_USER_PASSWORD_AUTH, mais pas SRP."
  options:
    b:
      en: "Compromised credentials detection does not support SRP, so switching to SRP would remove the check that the company needs."
      fr: "La détection des informations d'identification compromises ne prend pas en charge SRP : passer à SRP supprimerait le contrôle dont l'entreprise a besoin."
    c:
      en: "MFA adds a factor at sign-in, but it does not stop users from signing up with or changing to leaked passwords."
      fr: "La MFA ajoute un facteur à la connexion, mais elle n'empêche pas les utilisateurs de s'inscrire avec un mot de passe divulgué ni d'en choisir un."
    e:
      en: "Rejecting duplicate usernames at sign-up does not change the error responses of the sign-in and forgot-password requests."
      fr: "Refuser les noms d'utilisateur en double à l'inscription ne modifie pas les réponses d'erreur des requêtes de connexion et de mot de passe oublié."
references:
  - title: Managing user existence error responses
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pool-managing-errors.html
  - title: Advanced security with threat protection
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pool-settings-threat-protection.html
