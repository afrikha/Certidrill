id: scsc03-4a-cognito-email-mfa
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a customer portal that authenticates users with an Amazon Cognito user pool on the Lite feature plan. The user pool sends messages with the default Amazon Cognito email configuration, and MFA is set to Off. A new requirement states that customers must be able to receive a one-time MFA code by email as an alternative to an authenticator app. The development team wants to avoid writing custom authentication code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite un portail client qui authentifie les utilisateurs avec un groupe d'utilisateurs Amazon Cognito au niveau de fonctionnalités (feature plan) Lite. Le groupe d'utilisateurs envoie ses messages avec la configuration d'e-mail par défaut d'Amazon Cognito, et la MFA est définie sur Off. Une nouvelle exigence impose que les clients puissent recevoir un code MFA à usage unique par e-mail, en alternative à une application d'authentification. L'équipe de développement veut éviter d'écrire du code d'authentification personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set MFA enforcement to Optional, keep the default Amazon Cognito email configuration, and enable email message and TOTP as MFA methods."
        fr: "Définir l'application de la MFA sur Optional, conserver la configuration d'e-mail par défaut d'Amazon Cognito, et activer l'e-mail et TOTP comme méthodes MFA."
    - id: b
      text:
        en: "Add define, create and verify auth challenge Lambda triggers that send a code through Amazon SES, and switch the app to the CUSTOM_AUTH flow."
        fr: "Ajouter des déclencheurs Lambda de définition, de création et de vérification de défi qui envoient un code par Amazon SES, et passer l'application au flux CUSTOM_AUTH."
    - id: c
      text:
        en: "Change the user pool to the Essentials feature plan, configure email sending with a verified Amazon SES identity, and enable email message and TOTP as MFA methods."
        fr: "Passer le groupe d'utilisateurs au niveau Essentials, configurer l'envoi d'e-mails avec une identité Amazon SES vérifiée, et activer l'e-mail et TOTP comme méthodes MFA."
    - id: d
      text:
        en: "Change the user pool to the Plus feature plan, activate threat protection in full-function mode, and configure adaptive authentication to require MFA at every risk level."
        fr: "Passer le groupe d'utilisateurs au niveau Plus, activer la protection contre les menaces en mode complet (full function), et configurer l'authentification adaptative pour exiger la MFA à tous les niveaux de risque."
answer: { optionId: c }
explanation:
  correct:
    en: "Email MFA becomes available only when the user pool has an active email configuration that uses the company's own Amazon SES resources and is on the Essentials or Plus feature plan. With those prerequisites, email and TOTP can both be offered as second factors without custom code, with MFA set to Optional or Required."
    fr: "La MFA par e-mail n'est disponible que lorsque le groupe d'utilisateurs possède une configuration d'e-mail active qui utilise les ressources Amazon SES de l'entreprise et qu'il est au niveau Essentials ou Plus. Avec ces prérequis, l'e-mail et TOTP peuvent tous deux être proposés comme second facteur sans code personnalisé, la MFA étant définie sur Optional ou Required."
  options:
    a:
      en: "Email MFA is not available with the default Amazon Cognito email configuration or on the Lite plan."
      fr: "La MFA par e-mail n'est pas disponible avec la configuration d'e-mail par défaut d'Amazon Cognito ni au niveau Lite."
    b:
      en: "Custom authentication challenges can send codes, but only with custom Lambda code, which the team wants to avoid."
      fr: "Les défis d'authentification personnalisés peuvent envoyer des codes, mais uniquement avec du code Lambda personnalisé, ce que l'équipe veut éviter."
    d:
      en: "Adaptive authentication decides when to require MFA, but it still needs an available factor; without an Amazon SES email configuration, no email code can be sent."
      fr: "L'authentification adaptative décide quand exiger la MFA, mais elle a besoin d'un facteur disponible ; sans configuration d'e-mail Amazon SES, aucun code ne peut être envoyé par e-mail."
references:
  - title: Adding MFA to a user pool
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-mfa.html
