id: scsc03-4a-idc-external-idp-mfa
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Organizations with 40 accounts. Workforce access to the accounts goes through IAM Identity Center, which uses the company's external SAML 2.0 identity provider (IdP) as its identity source, with automatic provisioning through SCIM. A new security standard requires every employee to complete multi-factor authentication (MFA) before receiving access to any account through the AWS access portal, the AWS CLI or the AWS Management Console. The security team wants to enforce the requirement in one place.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS Organizations avec 40 comptes. L'accès du personnel aux comptes passe par IAM Identity Center, qui utilise comme source d'identité le fournisseur d'identité (IdP) SAML 2.0 externe de l'entreprise, avec un provisionnement automatique par SCIM. Une nouvelle norme de sécurité exige que chaque employé effectue une authentification multifacteur (MFA) avant d'obtenir l'accès à un compte par le portail d'accès AWS, l'AWS CLI ou l'AWS Management Console. L'équipe de sécurité veut appliquer cette exigence à un seul endroit.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "In IAM Identity Center, set the MFA authentication method to Always-on, allow security keys and built-in authenticators, and require users to register an MFA device at sign-in."
        fr: "Dans IAM Identity Center, définir la méthode d'authentification MFA sur Always-on, autoriser les clés de sécurité et les authentificateurs intégrés, et exiger que les utilisateurs enregistrent un dispositif MFA à la connexion."
    - id: b
      text:
        en: "Add an inline policy to every permission set that denies all actions when aws:MultiFactorAuthPresent is false, by using the BoolIfExists condition operator."
        fr: "Ajouter à chaque ensemble d'autorisations une politique en ligne qui refuse toutes les actions lorsque aws:MultiFactorAuthPresent vaut false, avec l'opérateur de condition BoolIfExists."
    - id: c
      text:
        en: "Configure the IdP's sign-on policy for the IAM Identity Center application to require MFA from every user before the IdP issues the SAML assertion."
        fr: "Configurer la politique de connexion de l'IdP pour l'application IAM Identity Center afin d'exiger la MFA de chaque utilisateur avant que l'IdP émette l'assertion SAML."
    - id: d
      text:
        en: "Create IAM users with virtual MFA devices in a central identity account, and have employees switch roles from that account into the other accounts."
        fr: "Créer des utilisateurs IAM avec des dispositifs MFA virtuels dans un compte d'identité central, et faire changer de rôle les employés depuis ce compte vers les autres comptes."
answer: { optionId: c }
explanation:
  correct:
    en: "When IAM Identity Center uses an external IdP, users authenticate at the IdP, and the MFA settings of Identity Center apply only to the Identity Center directory, AWS Managed Microsoft AD and AD Connector. Requiring MFA in the IdP's sign-on policy for the Identity Center application covers the access portal, the CLI and the console in one place, because Identity Center redirects all of them to the IdP for authentication."
    fr: "Lorsqu'IAM Identity Center utilise un IdP externe, les utilisateurs s'authentifient auprès de l'IdP, et les paramètres MFA d'Identity Center ne s'appliquent qu'au répertoire Identity Center, à AWS Managed Microsoft AD et à AD Connector. Exiger la MFA dans la politique de connexion de l'IdP pour l'application Identity Center couvre en un seul endroit le portail d'accès, la CLI et la console, car Identity Center redirige toutes ces authentifications vers l'IdP."
  options:
    a:
      en: "The MFA settings of IAM Identity Center are not supported for external identity providers, so they would not challenge users who authenticate at the IdP."
      fr: "Les paramètres MFA d'IAM Identity Center ne sont pas pris en charge pour les fournisseurs d'identité externes : ils ne soumettraient à aucun défi les utilisateurs qui s'authentifient auprès de l'IdP."
    b:
      en: "A permission set policy cannot make the IdP challenge users, and MFA performed at the external IdP is not passed to AWS as MFA context, so this deny would block every user instead of enforcing MFA."
      fr: "Une politique d'ensemble d'autorisations ne peut pas faire exiger un défi par l'IdP, et la MFA effectuée auprès de l'IdP externe n'est pas transmise à AWS comme contexte MFA : ce refus bloquerait tous les utilisateurs au lieu d'imposer la MFA."
    d:
      en: "IAM users with passwords bypass IAM Identity Center and the IdP, which adds a second identity store instead of enforcing MFA in one place."
      fr: "Des utilisateurs IAM avec mot de passe contournent IAM Identity Center et l'IdP, ce qui ajoute un second magasin d'identités au lieu d'imposer la MFA à un seul endroit."
references:
  - title: Configure MFA in IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/mfa-configure.html
  - title: External identity providers
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-idp.html
