id: scsc03-4b-idc-abac-order
objective: "4.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS IAM Identity Center with an external identity provider (IdP) that supports SCIM. All AWS resources are already tagged with a CostCenter tag. The security team wants to implement ABAC so that users can access only resources whose CostCenter tag matches the cost center stored for them in the IdP.

    Which four actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany utilise AWS IAM Identity Center avec un fournisseur d'identité (IdP) externe qui prend en charge SCIM. Toutes les ressources AWS portent déjà une balise CostCenter. L'équipe de sécurité veut mettre en œuvre ABAC pour que les utilisateurs n'accèdent qu'aux ressources dont la balise CostCenter correspond au centre de coûts enregistré pour eux dans l'IdP.

    Quelles sont les quatre actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: pset
      text:
        en: "Create a permission set whose custom policy allows actions when aws:ResourceTag/CostCenter equals ${aws:PrincipalTag/CostCenter}."
        fr: "Créer un ensemble d'autorisations dont la politique personnalisée autorise des actions lorsque aws:ResourceTag/CostCenter est égal à ${aws:PrincipalTag/CostCenter}."
    - id: trust
      text:
        en: "Add sts:TagSession to the trust policy of each AWSReservedSSO role in the member accounts."
        fr: "Ajouter sts:TagSession à la politique d'approbation de chaque rôle AWSReservedSSO dans les comptes membres."
    - id: scim
      text:
        en: "Configure SCIM provisioning so that the IdP sends each user's cost center attribute to IAM Identity Center."
        fr: "Configurer le provisionnement SCIM pour que l'IdP envoie l'attribut de centre de coûts de chaque utilisateur à IAM Identity Center."
    - id: assign
      text:
        en: "Assign the permission set to the user groups in the target AWS accounts."
        fr: "Attribuer l'ensemble d'autorisations aux groupes d'utilisateurs dans les comptes AWS cibles."
    - id: saml
      text:
        en: "Create an IAM SAML identity provider for the IdP in each member account."
        fr: "Créer un fournisseur d'identité SAML IAM pour l'IdP dans chaque compte membre."
    - id: attrs
      text:
        en: "On the Attributes for access control page, select the cost center attribute and map it to the CostCenter key."
        fr: "Dans la page Attributes for access control, sélectionner l'attribut de centre de coûts et l'associer à la clé CostCenter."
answer:
  sequence: [ scim, attrs, pset, assign ]
explanation:
  correct:
    en: "The identity source must first deliver the attribute to IAM Identity Center, here through SCIM. The attribute is then selected and mapped to a key on the Attributes for access control page, a permission set policy refers to it with aws:PrincipalTag, and finally the permission set is assigned so that users get access based on matching tags when they federate."
    fr: "La source d'identité doit d'abord fournir l'attribut à IAM Identity Center, ici par SCIM. L'attribut est ensuite sélectionné et associé à une clé dans la page Attributes for access control, une politique d'ensemble d'autorisations y fait référence avec aws:PrincipalTag, et enfin l'ensemble d'autorisations est attribué pour que les utilisateurs obtiennent un accès fondé sur les balises correspondantes lors de la fédération."
  options:
    trust:
      en: "IAM Identity Center creates and manages the roles of permission sets; administrators do not edit their trust policies to pass the attributes."
      fr: "IAM Identity Center crée et gère les rôles des ensembles d'autorisations ; les administrateurs ne modifient pas leurs politiques d'approbation pour transmettre les attributs."
    saml:
      en: "Users federate into the accounts through IAM Identity Center, so no IAM SAML identity provider is needed in the member accounts."
      fr: "Les utilisateurs se fédèrent dans les comptes par IAM Identity Center : aucun fournisseur d'identité SAML IAM n'est nécessaire dans les comptes membres."
references:
  - title: "Checklist: Configuring ABAC in AWS using IAM Identity Center - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/abac-checklist.html
