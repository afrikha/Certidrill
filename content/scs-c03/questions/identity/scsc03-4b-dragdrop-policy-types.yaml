id: scsc03-4b-dragdrop-policy-types
objective: "4.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team is designing least-privilege controls for an organization in AWS Organizations with all features enabled.

    Match each requirement with the policy type that meets it. Each policy type can be used once or not at all.
  fr: |
    L'équipe de sécurité d'AnyCompany conçoit des contrôles de moindre privilège pour une organisation AWS Organizations dont toutes les fonctionnalités sont activées.

    Associez chaque exigence au type de politique qui y répond. Chaque type de politique peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: boundary, text: { en: "Permissions boundary", fr: "Limite d'autorisations" } }
    - { id: session, text: { en: "Session policy", fr: "Politique de session" } }
    - { id: scp, text: { en: "Service control policy (SCP)", fr: "Politique de contrôle des services (SCP)" } }
    - { id: rcp, text: { en: "Resource control policy (RCP)", fr: "Politique de contrôle des ressources (RCP)" } }
    - { id: resource, text: { en: "Resource-based policy", fr: "Politique basée sur les ressources" } }
    - { id: vpce, text: { en: "VPC endpoint policy", fr: "Politique de point de terminaison de VPC" } }
  targets:
    - id: t1
      text: { en: "Set the maximum permissions of the IAM roles that developers create in one account.", fr: "Définir les autorisations maximales des rôles IAM que les développeurs créent dans un compte." }
    - id: t2
      text: { en: "Reduce the permissions of one temporary session when it is created with AssumeRole.", fr: "Réduire les autorisations d'une session temporaire lors de sa création avec AssumeRole." }
    - id: t3
      text: { en: "Set the maximum permissions of all IAM users and roles in the member accounts of an OU.", fr: "Définir les autorisations maximales de tous les utilisateurs et rôles IAM des comptes membres d'une UO." }
    - id: t4
      text: { en: "Set the maximum permissions on S3 buckets and KMS keys in member accounts, whatever the account of the caller.", fr: "Définir les autorisations maximales sur les compartiments S3 et les clés KMS des comptes membres, quel que soit le compte de l'appelant." }
    - id: t5
      text: { en: "Grant a role in another account permission to read the objects of one bucket.", fr: "Accorder à un rôle d'un autre compte l'autorisation de lire les objets d'un compartiment." }
answer:
  mapping: { t1: boundary, t2: session, t3: scp, t4: rcp, t5: resource }
explanation:
  correct:
    en: "A permissions boundary caps the identity-based permissions of a user or role, which is the usual way to delegate role creation. A session policy limits one role or federated session when it is created. SCPs cap the principals of member accounts, and RCPs cap the resources of member accounts for any caller. Of these, only the resource-based policy grants permissions, so it is the one that gives another account access to a bucket."
    fr: "Une limite d'autorisations plafonne les autorisations basées sur l'identité d'un utilisateur ou d'un rôle : c'est la méthode habituelle pour déléguer la création de rôles. Une politique de session limite une session de rôle ou fédérée lors de sa création. Les SCP plafonnent les principaux des comptes membres, et les RCP plafonnent les ressources des comptes membres pour tout appelant. Parmi ces types, seule la politique basée sur les ressources accorde des autorisations : c'est elle qui donne à un autre compte l'accès à un compartiment."
  options:
    vpce:
      en: "A VPC endpoint policy limits what can be done through one endpoint; it does not match any of these requirements."
      fr: "Une politique de point de terminaison de VPC limite ce qui peut être fait par un point de terminaison ; elle ne répond à aucune de ces exigences."
references:
  - title: Policies and permissions in AWS Identity and Access Management - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html
  - title: Resource control policies (RCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
