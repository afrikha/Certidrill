id: scsc03-4b-ra-abac-ou
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On-premises servers of several business units obtain credentials through IAM Roles Anywhere with one role, ServerSecrets, and one profile. The subject of each server certificate contains exactly one OU value, which is the server's business unit. Each AWS Secrets Manager secret has a bu tag. Each server must be able to read only the secrets whose bu tag equals the OU in its certificate. The company wants one role and one policy, with no policy change when a business unit is added.

    Which solution will meet these requirements?
  fr: |
    Les serveurs sur site de plusieurs unités commerciales obtiennent des informations d'identification par IAM Roles Anywhere avec un seul rôle, ServerSecrets, et un seul profil. Le sujet de chaque certificat de serveur contient exactement une valeur OU, qui est l'unité commerciale du serveur. Chaque secret AWS Secrets Manager possède une balise bu. Chaque serveur doit pouvoir lire uniquement les secrets dont la balise bu est égale à l'OU de son certificat. L'entreprise veut un seul rôle et une seule politique, sans modification de politique lors de l'ajout d'une unité commerciale.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create one role for each business unit with a trust policy condition on aws:PrincipalTag/x509Subject/OU, and a policy that names the unit's secrets.
        fr: |-
          Créer un rôle par unité commerciale avec une condition de politique d'approbation sur aws:PrincipalTag/x509Subject/OU, et une politique qui nomme les secrets de l'unité.
    - id: b
      text:
        en: |-
          In the ServerSecrets policy, allow secretsmanager:GetSecretValue when aws:ResourceTag/bu equals ${aws:PrincipalTag/x509Subject/OU}.
        fr: |-
          Dans la politique de ServerSecrets, autoriser secretsmanager:GetSecretValue lorsque aws:ResourceTag/bu est égal à ${aws:PrincipalTag/x509Subject/OU}.
    - id: c
      text:
        en: |-
          In the ServerSecrets policy, allow secretsmanager:GetSecretValue when aws:ResourceTag/bu equals ${aws:SourceIdentity}.
        fr: |-
          Dans la politique de ServerSecrets, autoriser secretsmanager:GetSecretValue lorsque aws:ResourceTag/bu est égal à ${aws:SourceIdentity}.
    - id: d
      text:
        en: |-
          Create one profile for each business unit with a session policy that names the unit's secrets, and configure each server with its unit's profile.
        fr: |-
          Créer un profil par unité commerciale avec une politique de session qui nomme les secrets de l'unité, et configurer chaque serveur avec le profil de son unité.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      IAM Roles Anywhere maps the subject RDNs of the authenticating certificate to principal tags, which are also available in the identity-based policy of the role. Comparing the secret's bu tag with ${aws:PrincipalTag/x509Subject/OU} gives each server access to its unit's secrets with one role and one policy, and a new unit only needs tagged secrets and certificates.
    fr: |-
      IAM Roles Anywhere associe les RDN du sujet du certificat d'authentification à des balises de principal, également disponibles dans la politique basée sur l'identité du rôle. Comparer la balise bu du secret à ${aws:PrincipalTag/x509Subject/OU} donne à chaque serveur l'accès aux secrets de son unité avec un seul rôle et une seule politique, et une nouvelle unité n'a besoin que de secrets et de certificats balisés.
  options:
    a:
      en: |-
        A role and a policy for each business unit violate the one-role, one-policy requirement and need changes for every new unit.
      fr: |-
        Un rôle et une politique par unité commerciale enfreignent l'exigence d'un seul rôle et d'une seule politique, et demandent des modifications pour chaque nouvelle unité.
    c:
      en: |-
        IAM Roles Anywhere sets the source identity to the common name (CN) of the certificate subject, not to its OU.
      fr: |-
        IAM Roles Anywhere définit l'identité source sur le nom commun (CN) du sujet du certificat, et non sur son OU.
    d:
      en: |-
        The profile is chosen by the client configuration, not enforced by the certificate, and each new unit needs a new profile and session policy.
      fr: |-
        Le profil est choisi par la configuration du client, et non imposé par le certificat, et chaque nouvelle unité exige un nouveau profil et une nouvelle politique de session.
references:
  - title: The IAM Roles Anywhere trust model - IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html
