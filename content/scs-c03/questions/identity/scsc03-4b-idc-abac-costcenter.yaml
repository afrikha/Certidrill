id: scsc03-4b-idc-abac-costcenter
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS IAM Identity Center with an external identity provider. SCIM provisioning synchronizes users, including a costCenter attribute, into Identity Center. One permission set named ProjectDeveloper is assigned to all developers. Each developer must be able to manage only the AWS Secrets Manager secrets whose CostCenter tag matches the developer's cost center. Developers change cost centers often, and the security team does not want to create or edit permission sets when this happens.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS IAM Identity Center avec un fournisseur d'identité externe. Le provisionnement SCIM synchronise les utilisateurs, y compris un attribut costCenter, dans Identity Center. Un seul ensemble d'autorisations nommé ProjectDeveloper est attribué à tous les développeurs. Chaque développeur doit pouvoir gérer uniquement les secrets AWS Secrets Manager dont la balise CostCenter correspond à son centre de coûts. Les développeurs changent souvent de centre de coûts, et l'équipe de sécurité ne veut pas créer ni modifier d'ensembles d'autorisations à chaque changement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create one permission set for each cost center with a policy that matches the CostCenter resource tag to a fixed value, and reassign users when they move.
        fr: |-
          Créer un ensemble d'autorisations par centre de coûts avec une politique qui compare la balise de ressource CostCenter à une valeur fixe, et réattribuer les utilisateurs lorsqu'ils changent.
    - id: b
      text:
        en: |-
          Map a CostCenter key to the costCenter attribute on the Attributes for access control page, and compare aws:ResourceTag/CostCenter with ${aws:PrincipalTag/CostCenter} in the permission set.
        fr: |-
          Associer une clé CostCenter à l'attribut costCenter dans la page Attributes for access control, et comparer aws:ResourceTag/CostCenter à ${aws:PrincipalTag/CostCenter} dans l'ensemble d'autorisations.
    - id: c
      text:
        en: |-
          Tag the IAM roles that Identity Center creates in each account with CostCenter, and compare aws:ResourceTag/CostCenter with the role tag in the permission set.
        fr: |-
          Baliser avec CostCenter les rôles IAM qu'Identity Center crée dans chaque compte, et comparer aws:ResourceTag/CostCenter à la balise du rôle dans l'ensemble d'autorisations.
    - id: d
      text:
        en: |-
          Map a CostCenter key to the costCenter attribute on the Attributes for access control page, and compare aws:ResourceTag/CostCenter with ${aws:RequestTag/CostCenter} in the permission set.
        fr: |-
          Associer une clé CostCenter à l'attribut costCenter dans la page Attributes for access control, et comparer aws:ResourceTag/CostCenter à ${aws:RequestTag/CostCenter} dans l'ensemble d'autorisations.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Attributes selected for access control are passed to the accounts as session tags when users federate, and policies read them with aws:PrincipalTag. One permission set then gives each user access to the secrets that match the user's current attribute, and a change in the directory takes effect at the next sign-in.
    fr: |-
      Les attributs sélectionnés pour le contrôle d'accès sont transmis aux comptes sous forme de balises de session lors de la fédération, et les politiques les lisent avec aws:PrincipalTag. Un seul ensemble d'autorisations donne alors à chaque utilisateur l'accès aux secrets qui correspondent à son attribut actuel, et un changement dans l'annuaire s'applique à la connexion suivante.
  options:
    a:
      en: |-
        This RBAC design needs a permission set for each cost center and a reassignment each time a developer moves, which the team wants to avoid.
      fr: |-
        Cette conception RBAC exige un ensemble d'autorisations par centre de coûts et une réattribution à chaque changement, ce que l'équipe veut éviter.
    c:
      en: |-
        All users of a permission set share the same role in an account, so a role tag cannot carry each user's cost center; Identity Center also manages these roles.
      fr: |-
        Tous les utilisateurs d'un ensemble d'autorisations partagent le même rôle dans un compte : une balise de rôle ne peut pas porter le centre de coûts de chaque utilisateur ; Identity Center gère d'ailleurs ces rôles.
    d:
      en: |-
        aws:RequestTag holds the tags passed in a request, such as a tagging call, not the attributes of the signed-in user.
      fr: |-
        aws:RequestTag contient les balises transmises dans une demande, comme un appel de balisage, et non les attributs de l'utilisateur connecté.
references:
  - title: Attributes for access control - AWS IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/attributesforaccesscontrol.html
  - title: Attribute-based access control - AWS IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/abac.html
