id: scsc03-4a-multi-assume-role-mfa
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany keeps its remaining IAM users in an identity account (111122223333). Administrators use the AWS CLI to assume the Admin role in a production account (444455556666). The Admin role must be assumable only by callers who authenticated with MFA, and the AWS CLI must prompt administrators for their MFA code when they run commands with the Admin role.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany conserve ses derniers utilisateurs IAM dans un compte d'identité (111122223333). Les administrateurs utilisent l'AWS CLI pour endosser le rôle Admin d'un compte de production (444455556666). Le rôle Admin ne doit pouvoir être endossé que par des appelants authentifiés avec la MFA, et l'AWS CLI doit demander leur code MFA aux administrateurs lorsqu'ils exécutent des commandes avec le rôle Admin.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "In the identity account, attach a policy to the administrators that denies sts:AssumeRole when aws:MultiFactorAuthPresent is false, with the Bool operator."
        fr: "Dans le compte d'identité, attacher aux administrateurs une politique qui refuse sts:AssumeRole lorsque aws:MultiFactorAuthPresent vaut false, avec l'opérateur Bool."
    - id: b
      text:
        en: "In the production account, have the Admin role's trust policy allow sts:AssumeRole from account 111122223333 only when aws:MultiFactorAuthPresent is true."
        fr: "Dans le compte de production, faire en sorte que la politique d'approbation du rôle Admin n'autorise sts:AssumeRole depuis le compte 111122223333 que lorsque aws:MultiFactorAuthPresent vaut true."
    - id: c
      text:
        en: "Have administrators call aws sts get-federation-token with their MFA code, and use the returned credentials to assume the Admin role."
        fr: "Faire appeler aws sts get-federation-token par les administrateurs avec leur code MFA, et utiliser les informations d'identification renvoyées pour endosser le rôle Admin."
    - id: d
      text:
        en: "In the production account, attach a permissions boundary to the Admin role that allows actions only when aws:MultiFactorAuthAge is less than 3600."
        fr: "Dans le compte de production, attacher au rôle Admin une limite d'autorisations qui n'autorise les actions que lorsque aws:MultiFactorAuthAge est inférieur à 3600."
    - id: e
      text:
        en: "Configure a CLI profile with role_arn set to the Admin role, source_profile set to the administrator's profile, and mfa_serial set to the administrator's MFA device ARN."
        fr: "Configurer un profil CLI avec role_arn défini sur le rôle Admin, source_profile défini sur le profil de l'administrateur, et mfa_serial défini sur l'ARN du dispositif MFA de l'administrateur."
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: "A trust policy condition that requires aws:MultiFactorAuthPresent to be true with the Bool operator lets only MFA-authenticated callers assume the role. A CLI role profile with mfa_serial makes the CLI prompt for the code and send the MFA device and code in the AssumeRole request."
    fr: "Une condition de politique d'approbation qui exige aws:MultiFactorAuthPresent à true avec l'opérateur Bool ne laisse endosser le rôle qu'aux appelants authentifiés par MFA. Un profil de rôle CLI avec mfa_serial fait demander le code par la CLI et envoie le dispositif MFA et le code dans la requête AssumeRole."
  options:
    a:
      en: "A deny with Bool and false does not match requests signed with long-term access keys, which do not contain the key, so it is not a reliable MFA check."
      fr: "Un refus avec Bool et false ne correspond pas aux requêtes signées avec des clés d'accès à long terme, qui ne contiennent pas la clé : ce n'est pas un contrôle MFA fiable."
    c:
      en: "GetFederationToken does not support MFA, and its credentials cannot call AWS STS operations such as AssumeRole."
      fr: "GetFederationToken ne prend pas en charge la MFA, et ses informations d'identification ne peuvent pas appeler d'opérations AWS STS comme AssumeRole."
    d:
      en: "A permissions boundary only caps the role's permissions; it does not control who can assume the role or make the CLI prompt for an MFA code."
      fr: "Une limite d'autorisations ne fait que plafonner les autorisations du rôle ; elle ne contrôle pas qui peut endosser le rôle et ne fait pas demander de code MFA par la CLI."
references:
  - title: Secure API access with MFA
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa_configure-api-require.html
  - title: Compare AWS STS credentials
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_sts-comparison.html
