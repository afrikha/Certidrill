id: scsc03-4b-explicit-deny-policies
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The IAM role BuildRunner in account 111122223333 has two managed policies attached. The first policy allows s3:* on the bucket build-artifacts and its objects. The second policy denies s3:DeleteObject on all resources. The bucket build-artifacts is in the same account and has no bucket policy.

    What happens when BuildRunner calls s3:DeleteObject on an object in build-artifacts?
  fr: |
    Le rôle IAM BuildRunner du compte 111122223333 a deux politiques gérées attachées. La première autorise s3:* sur le compartiment build-artifacts et ses objets. La seconde refuse s3:DeleteObject sur toutes les ressources. Le compartiment build-artifacts se trouve dans le même compte et n'a pas de politique de compartiment.

    Que se passe-t-il lorsque BuildRunner appelle s3:DeleteObject sur un objet de build-artifacts ?
body:
  options:
    - id: a
      text:
        en: |-
          The request is denied, because an explicit Deny in any applicable policy overrides every Allow.
        fr: |-
          La demande est refusée, car un Deny explicite dans n'importe quelle politique applicable l'emporte sur tout Allow.
    - id: b
      text:
        en: |-
          The request is allowed, because the Allow names a specific bucket while the Deny applies to all resources.
        fr: |-
          La demande est autorisée, car l'Allow nomme un compartiment précis alors que le Deny s'applique à toutes les ressources.
    - id: c
      text:
        en: |-
          The request is allowed, because the first attached policy is evaluated first and its Allow ends the evaluation.
        fr: |-
          La demande est autorisée, car la première politique attachée est évaluée en premier et son Allow met fin à l'évaluation.
    - id: d
      text:
        en: |-
          The request is allowed only if a bucket policy is added that allows s3:DeleteObject to BuildRunner.
        fr: |-
          La demande n'est autorisée que si une politique de compartiment autorisant s3:DeleteObject à BuildRunner est ajoutée.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In IAM policy evaluation, an explicit Deny in any policy that applies to the request overrides any Allow, whatever its order or how specific its resource is. BuildRunner can use the other S3 actions on the bucket but cannot delete objects.
    fr: |-
      Dans l'évaluation des politiques IAM, un Deny explicite dans n'importe quelle politique qui s'applique à la demande l'emporte sur tout Allow, quel que soit son ordre ou la précision de sa ressource. BuildRunner peut utiliser les autres actions S3 sur le compartiment, mais ne peut pas supprimer d'objets.
  options:
    b:
      en: |-
        IAM has no rule that a more specific resource wins; an explicit Deny always overrides an Allow.
      fr: |-
        IAM n'a aucune règle selon laquelle la ressource la plus précise l'emporte ; un Deny explicite l'emporte toujours sur un Allow.
    c:
      en: |-
        All applicable policies are evaluated together, and their order of attachment has no effect on the decision.
      fr: |-
        Toutes les politiques applicables sont évaluées ensemble, et leur ordre d'attachement n'a aucun effet sur la décision.
    d:
      en: |-
        An explicit Deny in the identity-based policy also overrides an Allow in a resource-based policy.
      fr: |-
        Un Deny explicite dans la politique basée sur l'identité l'emporte aussi sur un Allow dans une politique basée sur les ressources.
references:
  - title: Policy evaluation logic - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html
