id: scsc03-4b-ra-revoke-cert
objective: "4.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's on-premises servers obtain credentials through IAM Roles Anywhere. The trust anchor uses an external certificate bundle from the company's enterprise CA. The CA publishes its certificate revocation list (CRL) at an HTTP distribution point that is included in every certificate, and administrators can also export the CRL as a file. One server was compromised. Within one hour, its certificate must no longer be able to obtain new credentials, and all other servers must keep working.

    Which solutions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Les serveurs sur site d'AnyCompany obtiennent des informations d'identification par IAM Roles Anywhere. L'ancre de confiance (trust anchor) utilise un bundle de certificats externe issu de la CA d'entreprise de la société. La CA publie sa liste de révocation de certificats (CRL) sur un point de distribution HTTP inclus dans chaque certificat, et les administrateurs peuvent aussi exporter la CRL sous forme de fichier. Un serveur a été compromis. Dans un délai d'une heure, son certificat ne doit plus permettre d'obtenir de nouvelles informations d'identification, et tous les autres serveurs doivent continuer de fonctionner.

    Quelles solutions permettent de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Revoke the certificate on the CA, and configure the URL of the CA's OCSP responder on the trust anchor.
        fr: |-
          Révoquer le certificat sur la CA, et configurer l'URL du répondeur OCSP de la CA sur l'ancre de confiance.
    - id: b
      text:
        en: |-
          Revoke the certificate on the CA, and import the CA's updated CRL into IAM Roles Anywhere with the ImportCrl API.
        fr: |-
          Révoquer le certificat sur la CA, et importer la CRL mise à jour de la CA dans IAM Roles Anywhere avec l'API ImportCrl.
    - id: c
      text:
        en: |-
          Reduce the session duration of the profile to 900 seconds so that the server's existing credentials expire quickly.
        fr: |-
          Réduire la durée de session du profil à 900 secondes pour que les informations d'identification existantes du serveur expirent rapidement.
    - id: d
      text:
        en: |-
          Replace the CA certificate in the trust anchor with the certificate of a new CA that has not issued a certificate to the compromised server.
        fr: |-
          Remplacer le certificat de CA de l'ancre de confiance par le certificat d'une nouvelle CA qui n'a pas émis de certificat pour le serveur compromis.
    - id: e
      text:
        en: |-
          Revoke the certificate on the CA, and turn on CRL distribution point checking (crlDpRevocationEnabled) on the trust anchor.
        fr: |-
          Révoquer le certificat sur la CA, et activer la vérification des points de distribution de CRL (crlDpRevocationEnabled) sur l'ancre de confiance.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      IAM Roles Anywhere checks revocation only through CRLs. An imported CRL applies to certificates issued by the CA that signed it, and automatic checking of the distribution points in the certificates is off by default but can be turned on for the trust anchor; IAM Roles Anywhere can take up to 30 minutes to use an updated published CRL. Either way, the revoked certificate is refused in CreateSession while other certificates keep working.
    fr: |-
      IAM Roles Anywhere vérifie la révocation uniquement au moyen de CRL. Une CRL importée s'applique aux certificats émis par la CA qui l'a signée, et la vérification automatique des points de distribution des certificats est désactivée par défaut mais peut être activée sur l'ancre de confiance ; IAM Roles Anywhere peut mettre jusqu'à 30 minutes à utiliser une CRL publiée mise à jour. Dans les deux cas, le certificat révoqué est refusé par CreateSession, tandis que les autres certificats continuent de fonctionner.
  options:
    a:
      en: |-
        IAM Roles Anywhere does not support the Online Certificate Status Protocol (OCSP) for revocation checks.
      fr: |-
        IAM Roles Anywhere ne prend pas en charge le protocole OCSP (Online Certificate Status Protocol) pour la vérification de la révocation.
    c:
      en: |-
        A shorter session duration does not stop the certificate from creating new sessions, so the compromised server could keep obtaining credentials.
      fr: |-
        Une durée de session plus courte n'empêche pas le certificat de créer de nouvelles sessions : le serveur compromis pourrait continuer d'obtenir des informations d'identification.
    d:
      en: |-
        Replacing the CA in the trust anchor invalidates the certificates of every server, so all other servers would stop working.
      fr: |-
        Remplacer la CA de l'ancre de confiance invalide les certificats de tous les serveurs : tous les autres serveurs cesseraient de fonctionner.
references:
  - title: The IAM Roles Anywhere trust model - IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html
