id: scsc03-4b-abac-ec2-project
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An engineering department has 30 project teams that share one AWS account. Developers federate into a single IAM role, and each session carries a project session tag. Every Amazon EC2 instance has a project tag. Developers must be able to start and stop only the instances of their own project. New projects start every week, and the security team does not want to update policies for each new project.

    Which solution will meet these requirements?
  fr: |
    Un service d'ingénierie compte 30 équipes projet qui partagent un même compte AWS. Les développeurs se fédèrent dans un seul rôle IAM, et chaque session porte une balise de session project. Chaque instance Amazon EC2 possède une balise project. Les développeurs doivent pouvoir démarrer et arrêter uniquement les instances de leur propre projet. De nouveaux projets démarrent chaque semaine, et l'équipe de sécurité ne veut pas mettre à jour les politiques pour chaque nouveau projet.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create one IAM role and policy for each project that lists the ARNs of the project's instances, and map each developer group to its project role.
        fr: |-
          Créer pour chaque projet un rôle IAM et une politique qui listent les ARN des instances du projet, et associer chaque groupe de développeurs au rôle de son projet.
    - id: b
      text:
        en: |-
          Attach a resource-based policy to each instance that allows ec2:StartInstances and ec2:StopInstances to the developers of the instance's project.
        fr: |-
          Attacher à chaque instance une politique basée sur les ressources qui autorise ec2:StartInstances et ec2:StopInstances aux développeurs du projet de l'instance.
    - id: c
      text:
        en: |-
          Allow ec2:StartInstances and ec2:StopInstances in the role's policy when aws:ResourceTag/project equals ${aws:PrincipalTag/project}.
        fr: |-
          Autoriser ec2:StartInstances et ec2:StopInstances dans la politique du rôle lorsque aws:ResourceTag/project est égal à ${aws:PrincipalTag/project}.
    - id: d
      text:
        en: |-
          Create one SCP for each project that denies ec2:StartInstances and ec2:StopInstances on the instances of all other projects.
        fr: |-
          Créer une SCP par projet qui refuse ec2:StartInstances et ec2:StopInstances sur les instances de tous les autres projets.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Attribute-based access control compares the principal's tag with the resource's tag, so one policy covers every current and future project: a new project needs only tagged sessions and instances, not a policy change. This is the main scaling advantage of ABAC over RBAC.
    fr: |-
      Le contrôle d'accès basé sur les attributs compare la balise du principal à celle de la ressource : une seule politique couvre tous les projets actuels et futurs, et un nouveau projet n'a besoin que de sessions et d'instances balisées, pas d'une modification de politique. C'est le principal avantage d'ABAC sur RBAC pour le passage à l'échelle.
  options:
    a:
      en: |-
        This RBAC design needs a new role and policy for each project and a policy update each time instances are added, which the team wants to avoid.
      fr: |-
        Cette conception RBAC exige un nouveau rôle et une nouvelle politique par projet, et une mise à jour à chaque ajout d'instances, ce que l'équipe veut éviter.
    b:
      en: |-
        Amazon EC2 instances do not support resource-based policies; access to instances is controlled by identity-based policies.
      fr: |-
        Les instances Amazon EC2 ne prennent pas en charge les politiques basées sur les ressources ; l'accès aux instances est contrôlé par des politiques basées sur l'identité.
    d:
      en: |-
        SCPs apply to every principal of an account and cannot distinguish developers who share one role; each new project would also need a new SCP.
      fr: |-
        Les SCP s'appliquent à tous les principaux d'un compte et ne peuvent pas distinguer des développeurs qui partagent un même rôle ; chaque nouveau projet exigerait aussi une nouvelle SCP.
references:
  - title: Define permissions based on attributes with ABAC authorization - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html
