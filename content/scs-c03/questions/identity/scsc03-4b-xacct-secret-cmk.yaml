id: scsc03-4b-xacct-secret-cmk
objective: "4.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS Secrets Manager secret named prod/db-credentials is in account 444455556666 and is encrypted with the AWS managed key aws/secretsmanager. A reporting application in account 111122223333 runs under the IAM role ReportApp and must read the secret value. No other principal in account 111122223333 may read the secret. The secret must stay in account 444455556666.

    Which combination of steps will meet these requirements? (Choose three.)
  fr: |
    Un secret AWS Secrets Manager nommé prod/db-credentials se trouve dans le compte 444455556666 et est chiffré avec la clé gérée par AWS aws/secretsmanager. Une application de reporting du compte 111122223333 s'exécute sous le rôle IAM ReportApp et doit lire la valeur du secret. Aucun autre principal du compte 111122223333 ne doit pouvoir lire le secret. Le secret doit rester dans le compte 444455556666.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Edit the key policy of aws/secretsmanager to allow kms:Decrypt to the ReportApp role ARN.
        fr: |-
          Modifier la politique de clé d'aws/secretsmanager pour autoriser kms:Decrypt au rôle ReportApp (par son ARN).
    - id: b
      text:
        en: |-
          Re-encrypt the secret with a customer managed key whose key policy allows kms:Decrypt to the ReportApp role ARN.
        fr: |-
          Rechiffrer le secret avec une clé gérée par le client dont la politique de clé autorise kms:Decrypt au rôle ReportApp (par son ARN).
    - id: c
      text:
        en: |-
          Attach an SCP to account 444455556666 that allows secretsmanager:GetSecretValue for the ReportApp role ARN.
        fr: |-
          Attacher au compte 444455556666 une SCP qui autorise secretsmanager:GetSecretValue pour l'ARN du rôle ReportApp.
    - id: d
      text:
        en: |-
          Attach a resource policy to the secret that allows secretsmanager:GetSecretValue to the ReportApp role ARN.
        fr: |-
          Attacher au secret une politique de ressource qui autorise secretsmanager:GetSecretValue au rôle ReportApp (par son ARN).
    - id: e
      text:
        en: |-
          Configure Secrets Manager replication of the secret to account 111122223333 so that ReportApp reads a local copy.
        fr: |-
          Configurer la réplication Secrets Manager du secret vers le compte 111122223333 pour que ReportApp lise une copie locale.
    - id: f
      text:
        en: |-
          Attach an identity-based policy to ReportApp that allows secretsmanager:GetSecretValue on the secret ARN and kms:Decrypt on the key ARN.
        fr: |-
          Attacher à ReportApp une politique basée sur l'identité qui autorise secretsmanager:GetSecretValue sur l'ARN du secret et kms:Decrypt sur l'ARN de la clé.
answer: { optionIds: [ b, d, f ] }
explanation:
  correct:
    en: |-
      Cross-account access to a secret needs permissions on both sides: a resource policy on the secret and a key policy that let the external role decrypt, plus an identity-based policy in the role's account. The AWS managed key aws/secretsmanager cannot be used for cross-account access, so the secret must be encrypted with a customer managed key. Naming the role ARN in both resource-side policies keeps other principals of account 111122223333 out.
    fr: |-
      L'accès entre comptes à un secret exige des autorisations des deux côtés : une politique de ressource sur le secret et une politique de clé qui permettent au rôle externe de déchiffrer, plus une politique basée sur l'identité dans le compte du rôle. La clé gérée par AWS aws/secretsmanager ne peut pas servir à l'accès entre comptes : le secret doit être chiffré avec une clé gérée par le client. Nommer l'ARN du rôle dans les deux politiques côté ressource exclut les autres principaux du compte 111122223333.
  options:
    a:
      en: |-
        Key policies of AWS managed keys cannot be changed, and Secrets Manager does not support cross-account access with aws/secretsmanager.
      fr: |-
        Les politiques de clé des clés gérées par AWS ne peuvent pas être modifiées, et Secrets Manager ne prend pas en charge l'accès entre comptes avec aws/secretsmanager.
    c:
      en: |-
        SCPs never grant permissions, and an SCP attached to account 444455556666 applies to that account's principals, not to a role in account 111122223333.
      fr: |-
        Les SCP n'accordent jamais d'autorisations, et une SCP attachée au compte 444455556666 s'applique aux principaux de ce compte, pas à un rôle du compte 111122223333.
    e:
      en: |-
        Secrets Manager replicates secrets to other AWS Regions, not to other accounts, and the secret must stay in account 444455556666.
      fr: |-
        Secrets Manager réplique les secrets vers d'autres Régions AWS, pas vers d'autres comptes, et le secret doit rester dans le compte 444455556666.
references:
  - title: Access AWS Secrets Manager secrets from a different account - AWS Secrets Manager
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access_examples_cross.html
  - title: Cross-account policy evaluation logic - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html
