id: scsc03-4b-orgid-central-bucket
objective: "4.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 200 accounts in AWS Organizations. A central logging account owns the bucket app-logs-central. Application roles in every member account, including accounts that will be created later, must be able to write objects to the bucket. Principals outside the organization must not be able to write to the bucket. The bucket policy must not change when accounts are added.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany dispose de 200 comptes dans AWS Organizations. Un compte central de journalisation possède le compartiment app-logs-central. Les rôles applicatifs de chaque compte membre, y compris des comptes qui seront créés plus tard, doivent pouvoir écrire des objets dans le compartiment. Les principaux extérieurs à l'organisation ne doivent pas pouvoir écrire dans le compartiment. La politique de compartiment ne doit pas changer lors de l'ajout de comptes.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a bucket policy statement that allows s3:PutObject on app-logs-central/* to Principal "*" when aws:PrincipalOrgID equals the organization ID.
        fr: |-
          Ajouter une instruction de politique de compartiment qui autorise s3:PutObject sur app-logs-central/* au Principal "*" lorsque aws:PrincipalOrgID est égal à l'ID de l'organisation.
    - id: b
      text:
        en: |-
          Add a bucket policy statement that lists the root ARN of each member account, and update it from the account creation pipeline.
        fr: |-
          Ajouter une instruction de politique de compartiment qui liste l'ARN racine de chaque compte membre, et la mettre à jour depuis le pipeline de création de comptes.
    - id: c
      text:
        en: |-
          Attach an RCP to the organization root that allows s3:PutObject on app-logs-central/* for principals in the organization.
        fr: |-
          Attacher à la racine de l'organisation une RCP qui autorise s3:PutObject sur app-logs-central/* pour les principaux de l'organisation.
    - id: d
      text:
        en: |-
          Attach an identity-based policy to the application roles in each member account that allows s3:PutObject on app-logs-central/*.
        fr: |-
          Attacher aux rôles applicatifs de chaque compte membre une politique basée sur l'identité qui autorise s3:PutObject sur app-logs-central/*.
    - id: e
      text:
        en: |-
          Add a bucket policy statement that allows s3:PutObject on app-logs-central/* to Principal "*" when aws:SourceOrgID equals the organization ID.
        fr: |-
          Ajouter une instruction de politique de compartiment qui autorise s3:PutObject sur app-logs-central/* au Principal "*" lorsque aws:SourceOrgID est égal à l'ID de l'organisation.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      aws:PrincipalOrgID contains the organization ID of the requesting principal, so one bucket policy statement admits principals from every current and future member account and nobody else. Because the access is cross-account, each application role also needs an identity-based policy that allows the write.
    fr: |-
      aws:PrincipalOrgID contient l'ID d'organisation du principal demandeur : une seule instruction de politique de compartiment admet les principaux de tous les comptes membres actuels et futurs, et personne d'autre. L'accès étant entre comptes, chaque rôle applicatif a aussi besoin d'une politique basée sur l'identité qui autorise l'écriture.
  options:
    b:
      en: |-
        The bucket policy would change every time an account is created, which the requirements forbid.
      fr: |-
        La politique de compartiment changerait à chaque création de compte, ce que les exigences interdisent.
    c:
      en: |-
        RCPs never grant permissions; they only set the maximum permissions available on resources in member accounts.
      fr: |-
        Les RCP n'accordent jamais d'autorisations ; elles définissent seulement les autorisations maximales disponibles sur les ressources des comptes membres.
    e:
      en: |-
        aws:SourceOrgID describes the organization for which an AWS service principal acts; requests from IAM roles are matched with aws:PrincipalOrgID.
      fr: |-
        aws:SourceOrgID décrit l'organisation pour laquelle agit un principal de service AWS ; les demandes de rôles IAM se vérifient avec aws:PrincipalOrgID.
references:
  - title: AWS global condition context keys - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
  - title: Resource control policies (RCPs) - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
