id: scsc03-4b-avp-rbac-groups
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is building an internal claims application. Users sign in through an Amazon Cognito user pool that has the groups Adjusters and Supervisors. Authorization is externalized to an Amazon Verified Permissions policy store that has the user pool as its identity source, and the application sends the users' ID tokens with each authorization request. Only members of Supervisors may perform the ApproveClaim action. Adding a user to the Supervisors group in Cognito must grant the permission without any policy change.

    Which solution will meet these requirements?
  fr: |
    AnyCompany développe une application interne de gestion des sinistres. Les utilisateurs se connectent par un groupe d'utilisateurs Amazon Cognito qui possède les groupes Adjusters et Supervisors. L'autorisation est externalisée vers un magasin de politiques Amazon Verified Permissions dont la source d'identité est le groupe d'utilisateurs, et l'application envoie les jetons d'identification (ID tokens) des utilisateurs avec chaque demande d'autorisation. Seuls les membres de Supervisors peuvent effectuer l'action ApproveClaim. Ajouter un utilisateur au groupe Supervisors dans Cognito doit accorder l'autorisation sans aucune modification de politique.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Map the groups claim of the tokens to a principal group entity type, and write one permit policy for ApproveClaim whose principal scope is the Supervisors group.
        fr: |-
          Associer la revendication de groupes des jetons à un type d'entité de groupe de principaux, et écrire une politique permit pour ApproveClaim dont la portée principal est le groupe Supervisors.
    - id: b
      text:
        en: |-
          Write one permit policy for ApproveClaim for each supervisor that names the user's principal ID, and add a policy when a supervisor joins.
        fr: |-
          Écrire une politique permit pour ApproveClaim par superviseur, qui nomme l'ID de principal de l'utilisateur, et ajouter une politique à l'arrivée de chaque superviseur.
    - id: c
      text:
        en: |-
          Map the Supervisors group to an IAM role through an Amazon Cognito identity pool, and allow ApproveClaim in the role's identity-based policy.
        fr: |-
          Associer le groupe Supervisors à un rôle IAM par un groupe d'identités Amazon Cognito, et autoriser ApproveClaim dans la politique basée sur l'identité du rôle.
    - id: d
      text:
        en: |-
          Check the groups claim in the application code before ApproveClaim, and call Verified Permissions only for the other actions.
        fr: |-
          Vérifier la revendication de groupes dans le code de l'application avant ApproveClaim, et n'appeler Verified Permissions que pour les autres actions.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With a Cognito or OIDC identity source, a claim such as the groups claim can be mapped to a principal group, so policies can implement RBAC. One permit policy scoped to the Supervisors group covers every member, and group membership changes in Cognito take effect through the tokens without policy edits.
    fr: |-
      Avec une source d'identité Cognito ou OIDC, une revendication comme celle des groupes peut être associée à un groupe de principaux, ce qui permet aux politiques de mettre en œuvre RBAC. Une seule politique permit limitée au groupe Supervisors couvre tous ses membres, et les changements d'appartenance dans Cognito s'appliquent par les jetons, sans modifier les politiques.
  options:
    b:
      en: |-
        Per-user policies require a policy change every time a supervisor joins or leaves, which the requirements forbid.
      fr: |-
        Des politiques par utilisateur exigent une modification à chaque arrivée ou départ d'un superviseur, ce que les exigences interdisent.
    c:
      en: |-
        IAM policies authorize AWS API actions; ApproveClaim is an application action, which IAM cannot evaluate.
      fr: |-
        Les politiques IAM autorisent des actions d'API AWS ; ApproveClaim est une action applicative, qu'IAM ne peut pas évaluer.
    d:
      en: |-
        Putting the check in application code defeats the goal of externalizing authorization and leaves the rule outside the policy store.
      fr: |-
        Placer la vérification dans le code de l'application va à l'encontre de l'externalisation de l'autorisation et laisse la règle hors du magasin de politiques.
references:
  - title: Secure your applications with identity sources and tokens - Amazon Verified Permissions
    url: https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/identity-sources.html
