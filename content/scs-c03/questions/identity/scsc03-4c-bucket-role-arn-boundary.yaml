id: scsc03-4c-bucket-role-arn-boundary
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In an AnyCompany account, the role ReportGen has a permissions boundary that allows only Amazon CloudWatch and CloudWatch Logs actions, and its identity-based policies grant no Amazon S3 permissions. A bucket in the same account has a bucket policy that allows the principal arn:aws:iam::111122223333:role/ReportGen to call s3:GetObject. The bucket policy is not public, and no policy contains a Deny statement. ReportGen receives AccessDenied when it reads objects from the bucket. The team expected the bucket policy alone to be enough, because the role and the bucket are in the same account.

    What explains the failure?
  fr: |
    Dans un compte d'AnyCompany, le rôle ReportGen a une limite d'autorisations qui n'autorise que des actions Amazon CloudWatch et CloudWatch Logs, et ses politiques basées sur l'identité n'accordent aucune autorisation Amazon S3. Un compartiment du même compte a une politique de compartiment qui autorise le principal arn:aws:iam::111122223333:role/ReportGen à appeler s3:GetObject. La politique du compartiment n'est pas publique, et aucune politique ne contient d'instruction Deny. ReportGen reçoit AccessDenied lorsqu'il lit des objets du compartiment. L'équipe pensait que la politique du compartiment suffirait seule, car le rôle et le compartiment sont dans le même compte.

    Qu'est-ce qui explique l'échec ?
body:
  options:
    - id: a
      text:
        en: |-
          Within one account, a request is allowed only when both the identity-based policy and the bucket policy allow it.
        fr: |-
          Dans un même compte, une requête n'est autorisée que si la politique basée sur l'identité et la politique du compartiment l'autorisent toutes les deux.
    - id: b
      text:
        en: |-
          A bucket policy in the same account can grant permissions only to the account root principal, which then delegates them through IAM policies.
        fr: |-
          Une politique de compartiment du même compte ne peut accorder d'autorisations qu'au principal racine du compte, qui les délègue ensuite par des politiques IAM.
    - id: c
      text:
        en: |-
          The RestrictPublicBuckets setting of S3 Block Public Access ignores bucket policy grants to roles that do not have S3 permissions in IAM.
        fr: |-
          Le paramètre RestrictPublicBuckets de S3 Block Public Access ignore les autorisations de politique de compartiment accordées à des rôles qui n'ont pas d'autorisations S3 dans IAM.
    - id: d
      text:
        en: |-
          A resource-based policy that grants permissions to a role ARN is limited by an implicit deny in the role's permissions boundary.
        fr: |-
          Une politique basée sur les ressources qui accorde des autorisations à l'ARN d'un rôle est limitée par un refus implicite de la limite d'autorisations du rôle.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      In the same account, identity-based and resource-based permissions are normally combined as a union, but a resource-based policy that names a role ARN is limited by an implicit deny in the role's permissions boundary or session policy. The boundary allows no S3 action, so the request is denied; adding s3:GetObject on the bucket to the boundary resolves it.
    fr: |-
      Dans un même compte, les autorisations basées sur l'identité et sur les ressources se combinent normalement par union, mais une politique basée sur les ressources qui désigne l'ARN d'un rôle est limitée par un refus implicite de la limite d'autorisations ou de la politique de session du rôle. La limite n'autorise aucune action S3 : la requête est refusée ; ajouter s3:GetObject sur le compartiment à la limite résout le problème.
  options:
    a:
      en: |-
        Both policies are required only for cross-account requests; in the same account, an Allow in either policy type is normally enough.
      fr: |-
        Les deux politiques ne sont exigées que pour les requêtes entre comptes ; dans un même compte, une autorisation dans l'un ou l'autre type de politique suffit normalement.
    b:
      en: |-
        A bucket policy can name IAM users, roles, role sessions or accounts as principals, in the same account as in other accounts.
      fr: |-
        Une politique de compartiment peut désigner comme principaux des utilisateurs IAM, des rôles, des sessions de rôle ou des comptes, dans le même compte comme dans d'autres comptes.
    c:
      en: |-
        RestrictPublicBuckets acts only on buckets with a public policy, and this bucket policy is not public.
      fr: |-
        RestrictPublicBuckets n'agit que sur les compartiments dotés d'une politique publique, et cette politique de compartiment n'est pas publique.
references:
  - title: Permissions boundaries for IAM entities - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
