id: scsc03-4c-xacct-cmk-both-sides
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A role in AnyCompany's account 111122223333 downloads objects from an Amazon S3 bucket in account 444455556666. The objects are encrypted with SSE-KMS and a customer managed key in account 444455556666 whose key policy contains only a statement that allows the account's own root principal kms:*. The bucket policy allows the role s3:GetObject, and the role's identity-based policy allows s3:GetObject on the bucket. ListBucket calls succeed, but every GetObject call fails with AccessDenied.

    Which combination of steps will resolve the failure? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Un rôle du compte 111122223333 d'AnyCompany télécharge des objets depuis un compartiment Amazon S3 du compte 444455556666. Les objets sont chiffrés avec SSE-KMS et une clé gérée par le client du compte 444455556666 dont la politique de clé ne contient qu'une instruction qui autorise kms:* pour le principal racine de ce compte. La politique du compartiment autorise s3:GetObject pour le rôle, et la politique basée sur l'identité du rôle autorise s3:GetObject sur le compartiment. Les appels ListBucket réussissent, mais chaque appel GetObject échoue avec AccessDenied.

    Quelle combinaison d'étapes résout l'échec ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add kms:Decrypt to the bucket policy statement that allows the role to call s3:GetObject.", fr: "Ajouter kms:Decrypt à l'instruction de la politique du compartiment qui autorise le rôle à appeler s3:GetObject." } }
    - { id: b, text: { en: "Add a statement to the key policy in account 444455556666 that allows the role to call kms:Decrypt.", fr: "Ajouter à la politique de clé du compte 444455556666 une instruction qui autorise le rôle à appeler kms:Decrypt." } }
    - { id: c, text: { en: "Attach a service control policy (SCP) to account 111122223333 that allows kms:Decrypt on the key.", fr: "Attacher au compte 111122223333 une politique de contrôle des services (SCP) qui autorise kms:Decrypt sur la clé." } }
    - { id: d, text: { en: "Enable S3 Bucket Keys on the bucket so that Amazon S3 decrypts the objects without calling AWS KMS for each request.", fr: "Activer les clés de compartiment S3 (S3 Bucket Keys) pour que Amazon S3 déchiffre les objets sans appeler AWS KMS à chaque requête." } }
    - { id: e, text: { en: "Add kms:Decrypt on the key ARN to the identity-based policy of the role in account 111122223333.", fr: "Ajouter kms:Decrypt sur l'ARN de la clé à la politique basée sur l'identité du rôle du compte 111122223333." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Reading an SSE-KMS object requires kms:Decrypt on the key in addition to s3:GetObject. For a key in another account, both the key policy in the key's account and an IAM policy in the caller's account must allow the action; today the key policy delegates only to principals of its own account, and the role has no KMS permission.
    fr: |-
      La lecture d'un objet SSE-KMS exige kms:Decrypt sur la clé en plus de s3:GetObject. Pour une clé d'un autre compte, la politique de clé du compte de la clé et une politique IAM du compte appelant doivent toutes deux autoriser l'action ; aujourd'hui, la politique de clé ne délègue qu'aux principaux de son propre compte, et le rôle n'a aucune autorisation KMS.
  options:
    a:
      en: |-
        A bucket policy can grant only Amazon S3 actions on the bucket and its objects; KMS permissions come from the key policy, IAM policies or grants.
      fr: |-
        Une politique de compartiment ne peut accorder que des actions Amazon S3 sur le compartiment et ses objets ; les autorisations KMS viennent de la politique de clé, des politiques IAM ou des octrois.
    c:
      en: |-
        An SCP never grants permissions; it only sets the maximum permissions of the principals in the account.
      fr: |-
        Une SCP n'accorde jamais d'autorisations ; elle fixe seulement les autorisations maximales des principaux du compte.
    d:
      en: |-
        S3 Bucket Keys reduce the number of requests to AWS KMS, but the requester still needs permission to use the KMS key.
      fr: |-
        Les clés de compartiment S3 réduisent le nombre de requêtes vers AWS KMS, mais le demandeur doit toujours être autorisé à utiliser la clé KMS.
references:
  - title: Troubleshooting AWS KMS permissions - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/policy-evaluation.html
  - title: Troubleshoot access denied (403 Forbidden) errors in Amazon S3 - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/troubleshoot-403-errors.html
