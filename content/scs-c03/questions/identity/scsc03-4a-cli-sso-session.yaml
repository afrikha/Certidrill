id: scsc03-4a-cli-sso-session
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's developers use the AWS CLI with IAM user access keys. The company has moved workforce access to IAM Identity Center and wants developers to use short-term credentials with the CLI. The CLI must renew the developers' role credentials automatically for as long as their Identity Center sign-in remains valid.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Les développeurs d'AnyCompany utilisent l'AWS CLI avec des clés d'accès d'utilisateur IAM. L'entreprise a migré l'accès du personnel vers IAM Identity Center et veut que les développeurs utilisent des informations d'identification de courte durée avec la CLI. La CLI doit renouveler automatiquement les informations d'identification de rôle des développeurs tant que leur connexion à Identity Center reste valide.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Run aws configure sso to create profiles that reference an sso-session section, and have developers run aws sso login."
        fr: "Exécuter aws configure sso pour créer des profils qui référencent une section sso-session, et faire exécuter aws sso login par les développeurs."
    - id: b
      text:
        en: "Have developers copy the temporary credentials from the AWS access portal into the ~/.aws/credentials file every morning."
        fr: "Faire copier chaque matin par les développeurs les informations d'identification temporaires du portail d'accès AWS dans le fichier ~/.aws/credentials."
    - id: c
      text:
        en: "Create profiles that set sso_start_url, sso_region, sso_account_id and sso_role_name directly, without an sso-session section."
        fr: "Créer des profils qui définissent directement sso_start_url, sso_region, sso_account_id et sso_role_name, sans section sso-session."
    - id: d
      text:
        en: "Keep the IAM users, and run a scheduled AWS Lambda function that rotates the developers' access keys every 24 hours."
        fr: "Conserver les utilisateurs IAM, et exécuter une fonction AWS Lambda planifiée qui fait tourner les clés d'accès des développeurs toutes les 24 heures."
answer: { optionId: a }
explanation:
  correct:
    en: "The recommended SSO token provider configuration, which aws configure sso creates, keeps the start URL and Region in an sso-session section shared by profiles. After aws sso login, the CLI caches the Identity Center session and automatically renews the role credentials while the sign-in is valid."
    fr: "La configuration recommandée du fournisseur de jetons SSO, créée par aws configure sso, place l'URL de démarrage et la Région dans une section sso-session partagée par les profils. Après aws sso login, la CLI met en cache la session Identity Center et renouvelle automatiquement les informations d'identification du rôle tant que la connexion est valide."
  options:
    b:
      en: "Copied credentials expire and must be copied again by hand, which adds overhead and does not renew automatically."
      fr: "Les informations d'identification copiées expirent et doivent être recopiées à la main, ce qui ajoute de la charge et n'offre aucun renouvellement automatique."
    c:
      en: "This legacy non-refreshable configuration does not support automatic token refresh."
      fr: "Cette configuration héritée non actualisable ne prend pas en charge l'actualisation automatique des jetons."
    d:
      en: "Rotated access keys are still long-term IAM user credentials."
      fr: "Des clés d'accès que l'on fait tourner restent des informations d'identification d'utilisateur IAM à long terme."
references:
  - title: Configuring IAM Identity Center authentication with the AWS CLI
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sso.html
