id: scsc03-4a-multi-mobile-upload
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is building a mobile app for its customers. Customers must create an account with an email address and a password, and they must complete MFA with an authenticator app at every sign-in. After sign-in, the app must upload each customer's photos directly to an Amazon S3 bucket, and each customer must be able to write only to objects under a prefix reserved for that customer.

    Which combination of solutions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany développe une application mobile pour ses clients. Les clients doivent créer un compte avec une adresse e-mail et un mot de passe, et ils doivent effectuer la MFA avec une application d'authentification à chaque connexion. Après la connexion, l'application doit charger les photos de chaque client directement dans un compartiment Amazon S3, et chaque client ne doit pouvoir écrire que dans les objets d'un préfixe qui lui est réservé.

    Quelle combinaison de solutions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create an IAM user with a virtual MFA device for each customer, and send the user's access keys to the app after sign-in."
        fr: "Créer pour chaque client un utilisateur IAM avec un dispositif MFA virtuel, et envoyer les clés d'accès de l'utilisateur à l'application après la connexion."
    - id: b
      text:
        en: "Create an Amazon Cognito user pool with MFA set to Required and TOTP enabled, and use it to sign customers in."
        fr: "Créer un groupe d'utilisateurs Amazon Cognito avec la MFA définie sur Required et TOTP activé, et l'utiliser pour connecter les clients."
    - id: c
      text:
        en: "Enable IAM Identity Center, create a user for each customer in the Identity Center directory, and have the app obtain credentials through the AWS access portal."
        fr: "Activer IAM Identity Center, créer un utilisateur pour chaque client dans le répertoire Identity Center, et faire obtenir les informations d'identification par l'application via le portail d'accès AWS."
    - id: d
      text:
        en: "Add a bucket policy that allows s3:PutObject for Principal \"*\" when the request includes the customer's email address in an x-amz-meta-owner header."
        fr: "Ajouter une politique de compartiment qui autorise s3:PutObject pour Principal \"*\" lorsque la requête contient l'adresse e-mail du client dans un en-tête x-amz-meta-owner."
    - id: e
      text:
        en: "Create an Amazon Cognito identity pool that trusts the user pool, with an authenticated role that allows s3:PutObject only under the ${cognito-identity.amazonaws.com:sub}/ prefix."
        fr: "Créer un groupe d'identités Amazon Cognito qui approuve le groupe d'utilisateurs, avec un rôle authentifié qui n'autorise s3:PutObject que sous le préfixe ${cognito-identity.amazonaws.com:sub}/."
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: "The user pool handles sign-up, sign-in and TOTP MFA for customers. The identity pool exchanges the user pool tokens for temporary credentials of the authenticated role, and the ${cognito-identity.amazonaws.com:sub} policy variable resolves to each identity's ID, so a customer can write only under that customer's own prefix."
    fr: "Le groupe d'utilisateurs gère l'inscription, la connexion et la MFA TOTP des clients. Le groupe d'identités échange les jetons du groupe d'utilisateurs contre des informations d'identification temporaires du rôle authentifié, et la variable de politique ${cognito-identity.amazonaws.com:sub} prend la valeur de l'ID de chaque identité : un client ne peut écrire que sous son propre préfixe."
  options:
    a:
      en: "IAM users are not a customer directory, and sending long-term access keys to a mobile app exposes them."
      fr: "Les utilisateurs IAM ne constituent pas un annuaire de clients, et envoyer des clés d'accès à long terme à une application mobile les expose."
    c:
      en: "IAM Identity Center is designed for workforce access to AWS accounts and applications, not for the customers of a mobile app."
      fr: "IAM Identity Center est conçu pour l'accès du personnel aux comptes et applications AWS, pas pour les clients d'une application mobile."
    d:
      en: "A header supplied by the client is not authentication; anyone could send it, which would open the bucket to public writes."
      fr: "Un en-tête fourni par le client n'est pas une authentification ; n'importe qui pourrait l'envoyer, ce qui ouvrirait le compartiment à des écritures publiques."
references:
  - title: IAM roles
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/iam-roles.html
  - title: Adding MFA to a user pool
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-mfa.html
