id: scsc03-4c-sqs-sns-confused-deputy
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security review at AnyCompany found that the policy of an Amazon SQS queue allows the service principal sns.amazonaws.com to call sqs:SendMessage with no condition. Only the Amazon SNS topic arn:aws:sns:us-east-1:111122223333:orders must be able to deliver messages to the queue.

    Which change to the queue policy will meet this requirement?
  fr: |
    Un examen de sécurité chez AnyCompany a montré que la politique d'une file d'attente Amazon SQS autorise le principal de service sns.amazonaws.com à appeler sqs:SendMessage sans aucune condition. Seule la rubrique Amazon SNS arn:aws:sns:us-east-1:111122223333:orders doit pouvoir livrer des messages dans la file d'attente.

    Quelle modification de la politique de la file d'attente permet de répondre à cette exigence ?
body:
  options:
    - id: a
      text:
        en: |-
          Add an aws:PrincipalOrgID condition with the company's organization ID to the statement that allows sns.amazonaws.com.
        fr: |-
          Ajouter une condition aws:PrincipalOrgID avec l'ID de l'organisation de l'entreprise à l'instruction qui autorise sns.amazonaws.com.
    - id: b
      text:
        en: |-
          Add an aws:SourceVpce condition with the ID of the company's SNS interface endpoint to the statement that allows sns.amazonaws.com.
        fr: |-
          Ajouter une condition aws:SourceVpce avec l'ID du point de terminaison d'interface SNS de l'entreprise à l'instruction qui autorise sns.amazonaws.com.
    - id: c
      text:
        en: |-
          Replace the service principal with the principal arn:aws:iam::111122223333:root, so that only the topic owner's account can send messages.
        fr: |-
          Remplacer le principal de service par le principal arn:aws:iam::111122223333:root, afin que seul le compte propriétaire de la rubrique puisse envoyer des messages.
    - id: d
      text:
        en: |-
          Add an ArnEquals condition on aws:SourceArn with the ARN of the orders topic to the statement that allows sns.amazonaws.com.
        fr: |-
          Ajouter une condition ArnEquals sur aws:SourceArn avec l'ARN de la rubrique orders à l'instruction qui autorise sns.amazonaws.com.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A service principal can act on behalf of any customer, so a grant to sns.amazonaws.com without a condition lets any SNS topic in any account send to the queue, which is a cross-service confused deputy risk. The aws:SourceArn condition limits the grant to requests that SNS makes on behalf of the orders topic.
    fr: |-
      Un principal de service peut agir pour le compte de n'importe quel client : une autorisation accordée à sns.amazonaws.com sans condition permet à n'importe quelle rubrique SNS de n'importe quel compte d'envoyer dans la file d'attente, ce qui constitue un risque d'adjoint confus entre services. La condition aws:SourceArn limite l'autorisation aux requêtes que SNS effectue pour le compte de la rubrique orders.
  options:
    a:
      en: |-
        aws:PrincipalOrgID describes IAM principals of an organization; the SNS service principal is not one, so the condition would block the delivery. aws:SourceOrgID is the key for service requests.
      fr: |-
        aws:PrincipalOrgID décrit les principaux IAM d'une organisation ; le principal de service SNS n'en est pas un : la condition bloquerait la livraison. aws:SourceOrgID est la clé pour les requêtes de service.
    b:
      en: |-
        SNS delivers to SQS from the AWS service itself, not through the company's VPC endpoints, so the condition would never match.
      fr: |-
        SNS livre vers SQS depuis le service AWS lui-même, et non par les points de terminaison d'un VPC de l'entreprise : la condition ne correspondrait jamais.
    c:
      en: |-
        SNS delivers messages as the sns.amazonaws.com service principal, so a grant to the account root would not allow the delivery.
      fr: |-
        SNS livre les messages en tant que principal de service sns.amazonaws.com : une autorisation accordée à la racine du compte ne permettrait pas la livraison.
references:
  - title: The confused deputy problem - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/confused-deputy.html
