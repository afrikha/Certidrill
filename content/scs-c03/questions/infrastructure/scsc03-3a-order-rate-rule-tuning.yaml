id: scsc03-3a-order-rate-rule-tuning
objective: "3.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an AWS WAF web ACL associated with an Application Load Balancer. Logging, Amazon CloudWatch metrics, and sampled requests are already enabled for the web ACL. The security team wants to add a rate-based rule that blocks abusive clients. A partner runs a nightly batch integration against the same application, and its request rate is unknown. The team must not block the partner and must validate the rule against production traffic before it enforces the rule.

    Which four steps should the team perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany dispose d'une liste ACL web AWS WAF associée à un Application Load Balancer. La journalisation, les métriques Amazon CloudWatch et les requêtes échantillonnées sont déjà activées pour la liste ACL web. L'équipe de sécurité veut ajouter une règle basée sur le débit qui bloque les clients abusifs. Un partenaire exécute chaque nuit une intégration par lots sur la même application, et son débit de requêtes est inconnu. L'équipe ne doit pas bloquer le partenaire et doit valider la règle sur le trafic de production avant de l'appliquer.

    Quelles sont les quatre étapes que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: review
      text:
        en: "Review the web ACL logs and metrics to identify which clients the rule matches and at what request rates."
        fr: "Examiner les journaux et les métriques de la liste ACL web pour identifier les clients auxquels la règle correspond et leurs débits de requêtes."
    - id: blockfirst
      text:
        en: "Add the rate-based rule with the Block action and the lowest allowed limit of 10 requests."
        fr: "Ajouter la règle basée sur le débit avec l'action Block et la limite autorisée la plus basse de 10 requêtes."
    - id: block
      text:
        en: "Change the action of the rate-based rule to Block."
        fr: "Modifier l'action de la règle basée sur le débit en Block."
    - id: count
      text:
        en: "Add the rate-based rule to the web ACL with the Count action."
        fr: "Ajouter la règle basée sur le débit à la liste ACL web avec l'action Count."
    - id: shield
      text:
        en: "Subscribe to AWS Shield Advanced so that it creates the rate-based rule automatically."
        fr: "Souscrire à AWS Shield Advanced afin qu'il crée automatiquement la règle basée sur le débit."
    - id: tune
      text:
        en: "Adjust the rate limit, and add a scope-down statement that excludes an IP set that contains the partner's addresses."
        fr: "Ajuster la limite de débit, et ajouter une instruction de réduction de portée qui exclut un ensemble d'adresses IP contenant les adresses du partenaire."
answer:
  sequence: [count, review, tune, block]
explanation:
  correct:
    en: "AWS recommends testing and tuning new rules in Count mode with production traffic before enabling them, so the rule is first added with the Count action. The logs and metrics then show which clients would have been rate limited, including the partner. The team adjusts the limit and scopes the rule down to exclude the partner's IP set, and only then changes the action to Block."
    fr: "AWS recommande de tester et d'ajuster les nouvelles règles en mode Count avec le trafic de production avant de les activer ; la règle est donc d'abord ajoutée avec l'action Count. Les journaux et les métriques montrent ensuite quels clients auraient été limités, y compris le partenaire. L'équipe ajuste la limite et réduit la portée de la règle pour exclure l'ensemble d'adresses IP du partenaire, puis seulement change l'action en Block."
  options:
    blockfirst:
      en: "Blocking immediately at the minimum limit enforces the rule without validation and would block the partner and many legitimate users."
      fr: "Bloquer immédiatement avec la limite minimale applique la règle sans validation et bloquerait le partenaire et de nombreux utilisateurs légitimes."
    shield:
      en: "Shield Advanced does not create the company's own rate-based rule, and subscribing is not needed to test and tune one."
      fr: "Shield Advanced ne crée pas la règle basée sur le débit propre à l'entreprise, et il n'est pas nécessaire d'y souscrire pour en tester et en ajuster une."
references:
  - title: Testing and tuning your AWS WAF protections - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-testing.html
  - title: Rate-based rule high-level settings in AWS WAF - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based-high-level-settings.html
