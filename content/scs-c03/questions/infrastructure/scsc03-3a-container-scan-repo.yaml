id: scsc03-3a-container-scan-repo
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team uses an EC2 Image Builder container recipe to build a hardened base container image that is pushed to the Amazon ECR repository base/hardened. The security team wants Amazon Inspector findings to be saved with each image build. The team enables image scanning in the pipeline with base/hardened as the scanning repository, but the UpdateImagePipeline request fails with a ResourceDependencyException. Amazon Inspector has never been activated in the account, and the repository uses basic scanning with a manual scan frequency.

    What should the team do so that the pipeline saves Inspector findings for each container image?
  fr: |
    Une équipe plateforme utilise une recette de conteneur EC2 Image Builder pour construire une image de conteneur de base renforcée, envoyée dans le référentiel Amazon ECR base/hardened. L'équipe de sécurité veut que les résultats d'Amazon Inspector soient enregistrés avec chaque build d'image. L'équipe active l'analyse d'image dans le pipeline avec base/hardened comme référentiel d'analyse, mais la requête UpdateImagePipeline échoue avec une ResourceDependencyException. Amazon Inspector n'a jamais été activé dans le compte, et le référentiel utilise l'analyse de base avec une fréquence d'analyse manuelle.

    Que doit faire l'équipe pour que le pipeline enregistre les résultats Inspector de chaque image de conteneur ?
body:
  options:
    - id: a
      text:
        en: |-
          Activate Amazon Inspector for Amazon ECR scanning in the build Region, and set the repository to scan on push or continuous scanning.
        fr: |-
          Activer Amazon Inspector pour l'analyse Amazon ECR dans la Région de build, et configurer le référentiel en analyse à l'envoi (scan on push) ou en analyse continue.
    - id: b
      text:
        en: |-
          Activate Amazon Inspector for Amazon EC2 scanning in the build Region, and keep the repository's current scan settings.
        fr: |-
          Activer Amazon Inspector pour l'analyse Amazon EC2 dans la Région de build, et conserver les paramètres d'analyse actuels du référentiel.
    - id: c
      text:
        en: |-
          Set the pipeline's image scanning type to ON_DEMAND_AMI_CVE so that no Inspector activation check is performed.
        fr: |-
          Définir le type d'analyse d'image du pipeline sur ON_DEMAND_AMI_CVE afin qu'aucune vérification d'activation d'Inspector ne soit effectuée.
    - id: d
      text:
        en: |-
          Remove the repository name from the scanning configuration so that Image Builder uses its default scanning repository without Inspector.
        fr: |-
          Supprimer le nom du référentiel de la configuration d'analyse afin qu'Image Builder utilise son référentiel d'analyse par défaut sans Inspector.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      For container images, Amazon Inspector scans a copy of the image that Image Builder pushes to Amazon ECR, so Inspector must be activated for ECR scanning in the build Region; otherwise the request fails with a ResourceDependencyException. A repository named in the scanning configuration must exist in the same account and Region and must not use the MANUAL scan frequency. Image Builder then saves an encrypted snapshot of the findings with each image.
    fr: |-
      Pour les images de conteneur, Amazon Inspector analyse une copie de l'image qu'Image Builder envoie dans Amazon ECR ; Inspector doit donc être activé pour l'analyse ECR dans la Région de build, sinon la requête échoue avec une ResourceDependencyException. Un référentiel indiqué dans la configuration d'analyse doit exister dans le même compte et la même Région et ne doit pas utiliser la fréquence d'analyse MANUAL. Image Builder enregistre ensuite un instantané chiffré des résultats avec chaque image.
  options:
    b:
      en: |-
        EC2 scanning covers test instances for AMI images; container image scans need Inspector activated for ECR, and a manual scan frequency is not allowed.
      fr: |-
        L'analyse EC2 couvre les instances de test des images AMI ; les analyses d'images de conteneur exigent l'activation d'Inspector pour ECR, et une fréquence d'analyse manuelle n'est pas autorisée.
    c:
      en: |-
        ON_DEMAND_AMI_CVE is a scan type for AMI images, not for container images.
      fr: |-
        ON_DEMAND_AMI_CVE est un type d'analyse pour les images AMI, pas pour les images de conteneur.
    d:
      en: |-
        Without a repository name Image Builder uses image-builder-image-scanning-repository, but the scan still requires Inspector activation for ECR.
      fr: |-
        Sans nom de référentiel, Image Builder utilise image-builder-image-scanning-repository, mais l'analyse exige toujours l'activation d'Inspector pour ECR.
references:
  - title: Amazon Inspector integration in Image Builder - EC2 Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/integ-inspector.html
