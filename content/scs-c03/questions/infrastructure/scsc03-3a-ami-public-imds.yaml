id: scsc03-3a-ami-public-imds
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's image account builds a golden AMI and shares it with 30 accounts that other teams administer. The security team has two requirements. First, no one in the image account can make any AMI public in us-east-1 or eu-west-1. Second, every instance launched from the golden AMI in any account must require IMDSv2, even if the launching team does not set any metadata options.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Le compte d'images d'AnyCompany construit une AMI de référence et la partage avec 30 comptes administrés par d'autres équipes. L'équipe de sécurité a deux exigences. D'abord, personne dans le compte d'images ne doit pouvoir rendre une AMI publique dans us-east-1 ou eu-west-1. Ensuite, chaque instance lancée à partir de l'AMI de référence, dans n'importe quel compte, doit exiger IMDSv2, même si l'équipe qui la lance ne définit aucune option de métadonnées.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Enable block public access for AMIs in us-east-1 and eu-west-1 in the image account.
        fr: |-
          Activer le blocage de l'accès public pour les AMI dans us-east-1 et eu-west-1 dans le compte d'images.
    - id: b
      text:
        en: |-
          Run aws ec2 modify-instance-metadata-defaults with --http-tokens required in the image account in both Regions.
        fr: |-
          Exécuter aws ec2 modify-instance-metadata-defaults avec --http-tokens required dans le compte d'images dans les deux Régions.
    - id: c
      text:
        en: |-
          Run aws ec2 reset-image-attribute --attribute launchPermission on every AMI in the image account.
        fr: |-
          Exécuter aws ec2 reset-image-attribute --attribute launchPermission sur chaque AMI du compte d'images.
    - id: d
      text:
        en: |-
          Register the golden AMI with the --imds-support v2.0 parameter.
        fr: |-
          Enregistrer l'AMI de référence avec le paramètre --imds-support v2.0.
    - id: e
      text:
        en: |-
          Attach an IAM policy that denies ec2:ModifyImageAttribute to the developers' IAM role in the image account.
        fr: |-
          Attacher une politique IAM qui refuse ec2:ModifyImageAttribute au rôle IAM des développeurs dans le compte d'images.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Block public access for AMIs is an account-level setting, configured per Region, that blocks every attempt to make an AMI public. An AMI registered with imds-support set to v2.0 makes every instance launched from it require IMDSv2, with a hop limit of 2, in whichever account launches it; this attribute cannot be reverted on that AMI.
    fr: |-
      Le blocage de l'accès public pour les AMI est un paramètre au niveau du compte, configuré par Région, qui bloque toute tentative de rendre une AMI publique. Une AMI enregistrée avec imds-support à v2.0 fait exiger IMDSv2, avec une limite de sauts de 2, à chaque instance lancée à partir d'elle, quel que soit le compte qui la lance ; cet attribut ne peut pas être annulé sur cette AMI.
  options:
    b:
      en: |-
        Instance metadata defaults apply only to new instances in the account and Region where they are set, not to launches in the 30 other accounts.
      fr: |-
        Les valeurs par défaut des métadonnées d'instance ne s'appliquent qu'aux nouvelles instances du compte et de la Région où elles sont définies, pas aux lancements dans les 30 autres comptes.
    c:
      en: |-
        Resetting launch permissions removes the current sharing, including with the 30 accounts, and does not prevent anyone from making an AMI public later.
      fr: |-
        Réinitialiser les autorisations de lancement supprime le partage actuel, y compris avec les 30 comptes, et n'empêche personne de rendre une AMI publique plus tard.
    e:
      en: |-
        The deny covers only the developers' role, so other principals in the account could still make an AMI public, and it would also block legitimate sharing changes.
      fr: |-
        Le refus ne couvre que le rôle des développeurs ; d'autres principaux du compte pourraient donc toujours rendre une AMI publique, et il bloquerait aussi les modifications de partage légitimes.
references:
  - title: Understand block public access for AMIs - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/block-public-access-to-amis.html
  - title: Configure instance metadata options for new instances - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-IMDS-new-instances.html
