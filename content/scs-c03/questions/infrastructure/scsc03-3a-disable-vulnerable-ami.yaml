id: scsc03-3a-disable-vulnerable-ami
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's image account owns golden AMI version 12, which is shared with 15 accounts. A critical vulnerability is found in version 12, and version 13 is already published. The security team requires that no new instance be launched from version 12 in any account, including the image account. Instances already running from version 12 must keep running until they are replaced, and the forensics team must be able to restore version 12 later for analysis.

    Which solution will meet these requirements?
  fr: |
    Le compte d'images d'AnyCompany possède la version 12 de l'AMI de référence, partagée avec 15 comptes. Une vulnérabilité critique est découverte dans la version 12, et la version 13 est déjà publiée. L'équipe de sécurité exige qu'aucune nouvelle instance ne soit lancée à partir de la version 12 dans aucun compte, y compris le compte d'images. Les instances déjà en cours d'exécution à partir de la version 12 doivent continuer à fonctionner jusqu'à leur remplacement, et l'équipe d'investigation doit pouvoir restaurer la version 12 plus tard pour l'analyser.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Deprecate version 12 of the AMI with an immediate deprecation time.
        fr: |-
          Rendre obsolète la version 12 de l'AMI avec une date d'obsolescence immédiate.
    - id: b
      text:
        en: |-
          Deregister version 12 of the AMI and delete its EBS snapshots.
        fr: |-
          Désenregistrer la version 12 de l'AMI et supprimer ses instantanés EBS.
    - id: c
      text:
        en: |-
          Disable version 12 of the AMI with the aws ec2 disable-image command.
        fr: |-
          Désactiver la version 12 de l'AMI avec la commande aws ec2 disable-image.
    - id: d
      text:
        en: |-
          Remove the launch permissions of the 15 accounts from version 12 of the AMI.
        fr: |-
          Retirer les autorisations de lancement des 15 comptes de la version 12 de l'AMI.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A disabled AMI cannot be used to launch new instances, and disabling it removes all launch permissions, so no account can launch it. Instances already launched from it keep running and can still be stopped and started. The AMI and its snapshots are kept, so the owner can re-enable it later.
    fr: |-
      Une AMI désactivée ne peut pas servir à lancer de nouvelles instances, et sa désactivation supprime toutes les autorisations de lancement ; aucun compte ne peut donc la lancer. Les instances déjà lancées à partir d'elle continuent de fonctionner et peuvent toujours être arrêtées et démarrées. L'AMI et ses instantanés sont conservés ; le propriétaire peut donc la réactiver plus tard.
  options:
    a:
      en: |-
        Deprecation hides the AMI from default listings, but users who know its ID can still launch instances from it.
      fr: |-
        L'obsolescence masque l'AMI des listes par défaut, mais les utilisateurs qui connaissent son ID peuvent toujours lancer des instances à partir d'elle.
    b:
      en: |-
        Deregistering and deleting the snapshots is permanent, so the forensics team could not restore version 12.
      fr: |-
        Le désenregistrement et la suppression des instantanés sont définitifs ; l'équipe d'investigation ne pourrait donc pas restaurer la version 12.
    d:
      en: |-
        Removing the shares stops the other accounts, but the image account itself could still launch version 12.
      fr: |-
        Retirer les partages arrête les autres comptes, mais le compte d'images lui-même pourrait toujours lancer la version 12.
references:
  - title: Disable an Amazon EC2 AMI - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/disable-an-ami.html
