id: scsc03-3a-waf-logs-firehose-splunk
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany protects an Amazon CloudFront distribution with an AWS WAF web ACL. The application runs in eu-central-1. The security operations team uses Splunk and requires the full AWS WAF logs to arrive in its Splunk HTTP Event Collector within seconds. The company wants a managed delivery path with no custom code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany protège une distribution Amazon CloudFront avec une liste ACL web AWS WAF. L'application s'exécute dans eu-central-1. L'équipe des opérations de sécurité utilise Splunk et exige que les journaux AWS WAF complets arrivent dans son Splunk HTTP Event Collector en quelques secondes. L'entreprise veut un chemin de livraison géré, sans code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon Data Firehose stream named waf-splunk in eu-central-1 with an Amazon Kinesis Data Streams source and a Splunk destination, and select it as the logging destination.
        fr: |-
          Créer un flux Amazon Data Firehose nommé waf-splunk dans eu-central-1 avec une source Amazon Kinesis Data Streams et une destination Splunk, et le choisir comme destination de journalisation.
    - id: b
      text:
        en: |-
          Send the logs to an Amazon CloudWatch Logs log group named /security/waf, and add a subscription filter that invokes an AWS Lambda function that posts each record to Splunk.
        fr: |-
          Envoyer les journaux vers un groupe de journaux Amazon CloudWatch Logs nommé /security/waf, et ajouter un filtre d'abonnement qui invoque une fonction AWS Lambda qui publie chaque enregistrement vers Splunk.
    - id: c
      text:
        en: |-
          Create an Amazon Data Firehose stream named aws-waf-logs-splunk in us-east-1 with a Direct PUT source and a Splunk destination, and select it as the logging destination.
        fr: |-
          Créer un flux Amazon Data Firehose nommé aws-waf-logs-splunk dans us-east-1 avec une source Direct PUT et une destination Splunk, et le choisir comme destination de journalisation.
    - id: d
      text:
        en: |-
          Send the logs to an Amazon S3 bucket named aws-waf-logs-splunk, and configure the Splunk add-on to poll the bucket for new objects.
        fr: |-
          Envoyer les journaux vers un compartiment Amazon S3 nommé aws-waf-logs-splunk, et configurer le module complémentaire Splunk pour qu'il interroge le compartiment à la recherche de nouveaux objets.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS WAF can stream logs to an Amazon Data Firehose delivery stream, and Firehose delivers to Splunk as a managed destination. The stream must be in the same account and Region as the web ACL, which is us-east-1 for CloudFront, its name must start with aws-waf-logs-, and its source must be Direct PUT.
    fr: |-
      AWS WAF peut diffuser ses journaux vers un flux de livraison Amazon Data Firehose, et Firehose livre vers Splunk comme destination gérée. Le flux doit se trouver dans le même compte et la même Région que la liste ACL web, c'est-à-dire us-east-1 pour CloudFront, son nom doit commencer par aws-waf-logs-, et sa source doit être Direct PUT.
  options:
    a:
      en: |-
        The stream is in the wrong Region for a CloudFront web ACL, its name lacks the aws-waf-logs- prefix, and a Kinesis data stream cannot be the source.
      fr: |-
        Le flux n'est pas dans la bonne Région pour une liste ACL web CloudFront, son nom ne commence pas par aws-waf-logs-, et un flux de données Kinesis ne peut pas en être la source.
    b:
      en: |-
        The log group name must start with aws-waf-logs-, and the Lambda forwarder is custom code that the company wants to avoid.
      fr: |-
        Le nom du groupe de journaux doit commencer par aws-waf-logs-, et la fonction Lambda de transfert est du code personnalisé que l'entreprise veut éviter.
    d:
      en: |-
        AWS WAF delivers log files to S3 in batches and Splunk then has to poll, so the logs do not arrive within seconds.
      fr: |-
        AWS WAF livre les fichiers de journaux dans S3 par lots et Splunk doit ensuite les interroger ; les journaux n'arrivent donc pas en quelques secondes.
references:
  - title: Sending protection pack (web ACL) traffic logs to an Amazon Data Firehose delivery stream - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/logging-kinesis.html
