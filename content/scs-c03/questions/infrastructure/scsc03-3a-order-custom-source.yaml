id: scsc03-3a-order-custom-source
objective: "3.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses Amazon Security Lake and wants to add the access logs of its third-party CDN as a custom source. A log shipper that runs in account 444455556666 will deliver the data. The security team uses the AWS CLI, not the console, and the data lake bucket uses SSE-S3 encryption.

    Which four steps should the team perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany utilise Amazon Security Lake et veut ajouter les journaux d'accès de son CDN tiers comme source personnalisée. Un expéditeur de journaux qui s'exécute dans le compte 444455556666 livrera les données. L'équipe de sécurité utilise l'AWS CLI, pas la console, et le compartiment du lac de données utilise le chiffrement SSE-S3.

    Quelles sont les quatre étapes que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: create
      text:
        en: "Run aws securitylake create-custom-log-source with the OCSF event class, the shipper's account ID and external ID, and the ARN of the AWS Glue role."
        fr: "Exécuter aws securitylake create-custom-log-source avec la classe d'événements OCSF, l'ID de compte et l'ID externe de l'expéditeur, et l'ARN du rôle AWS Glue."
    - id: raw
      text:
        en: "Write the raw CDN log files to the data lake bucket so that the AWS Glue crawler converts them to OCSF."
        fr: "Écrire les fichiers de journaux bruts du CDN dans le compartiment du lac de données afin que le robot d'analyse AWS Glue les convertisse en OCSF."
    - id: glue
      text:
        en: "Create an IAM role that AWS Glue can assume, with the AWSGlueServiceRole managed policy and write access to the data lake bucket."
        fr: "Créer un rôle IAM qu'AWS Glue peut endosser, avec la politique gérée AWSGlueServiceRole et un accès en écriture au compartiment du lac de données."
    - id: write
      text:
        en: "Write OCSF-formatted Apache Parquet objects under the source's prefix, partitioned by region, accountId, and eventDay."
        fr: "Écrire des objets Apache Parquet au format OCSF sous le préfixe de la source, partitionnés par region, accountId et eventDay."
    - id: native
      text:
        en: "Enable the CDN logs as an AWS log source for all accounts in the delegated administrator account."
        fr: "Activer les journaux du CDN comme source de journaux AWS pour tous les comptes dans le compte administrateur délégué."
    - id: assume
      text:
        en: "Configure the shipper to assume the provider role that Security Lake created for the custom source."
        fr: "Configurer l'expéditeur pour qu'il endosse le rôle de fournisseur que Security Lake a créé pour la source personnalisée."
answer:
  sequence: [glue, create, assume, write]
explanation:
  correct:
    en: "With the API or AWS CLI, the team first creates the AWS Glue role, because create-custom-log-source needs its ARN together with the OCSF event class and the provider's account ID and external ID. Security Lake then creates the source's S3 prefix, an IAM role named AmazonSecurityLake-Provider-<source>-<region> for the provider, a Lake Formation table, and a Glue crawler. The shipper assumes that role and writes Parquet objects in OCSF format under the prefix, partitioned by region, accountId, and eventDay."
    fr: "Avec l'API ou l'AWS CLI, l'équipe crée d'abord le rôle AWS Glue, car create-custom-log-source exige son ARN ainsi que la classe d'événements OCSF, l'ID de compte et l'ID externe du fournisseur. Security Lake crée alors le préfixe S3 de la source, un rôle IAM nommé AmazonSecurityLake-Provider-<source>-<région> pour le fournisseur, une table Lake Formation et un robot d'analyse Glue. L'expéditeur endosse ce rôle et écrit des objets Parquet au format OCSF sous le préfixe, partitionnés par region, accountId et eventDay."
  options:
    raw:
      en: "The Glue crawler discovers schemas and partitions; it does not convert raw logs, and custom sources must deliver OCSF Parquet objects."
      fr: "Le robot d'analyse Glue découvre les schémas et les partitions ; il ne convertit pas les journaux bruts, et les sources personnalisées doivent livrer des objets Parquet OCSF."
    native:
      en: "A third-party CDN is not one of the AWS services that Security Lake collects natively, so it must be a custom source."
      fr: "Un CDN tiers ne fait pas partie des services AWS que Security Lake collecte nativement ; il doit donc être une source personnalisée."
references:
  - title: Collecting data from custom sources in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/custom-sources.html
  - title: Adding a custom source in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/adding-custom-sources.html
