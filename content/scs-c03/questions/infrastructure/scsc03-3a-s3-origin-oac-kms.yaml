id: scsc03-3a-s3-origin-oac-kms
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company distributes software downloads through an Amazon CloudFront distribution that has an AWS WAF web ACL and geographic restrictions. The origin is an Amazon S3 bucket whose objects are encrypted with SSE-KMS by using a customer managed key. A penetration test shows that the objects can also be downloaded directly from the S3 endpoint because of a public bucket policy statement, which bypasses AWS WAF and the geographic restrictions. The company must make the objects reachable only through this distribution and must keep SSE-KMS encryption.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias distribue des téléchargements de logiciels par une distribution Amazon CloudFront dotée d'une liste ACL web AWS WAF et de restrictions géographiques. L'origine est un compartiment Amazon S3 dont les objets sont chiffrés avec SSE-KMS au moyen d'une clé gérée par le client. Un test d'intrusion montre que les objets peuvent aussi être téléchargés directement depuis le point de terminaison S3 à cause d'une instruction publique de la politique de compartiment, ce qui contourne AWS WAF et les restrictions géographiques. L'entreprise doit rendre les objets accessibles uniquement par cette distribution et doit conserver le chiffrement SSE-KMS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an origin access identity (OAI) for the origin, replace the public statement with one that allows the OAI to call s3:GetObject, and keep the key policy unchanged.
        fr: |-
          Créer une identité d'accès d'origine (OAI) pour l'origine, remplacer l'instruction publique par une instruction qui autorise l'OAI à appeler s3:GetObject, et ne pas modifier la politique de clé.
    - id: b
      text:
        en: |-
          Enable S3 Block Public Access on the bucket, remove the public statement, and keep the origin configured without any origin access control or identity.
        fr: |-
          Activer S3 Block Public Access sur le compartiment, supprimer l'instruction publique, et conserver l'origine configurée sans contrôle ni identité d'accès d'origine.
    - id: c
      text:
        en: |-
          Replace the public statement with one that allows s3:GetObject only when the aws:Referer condition key equals the distribution's domain name.
        fr: |-
          Remplacer l'instruction publique par une instruction qui n'autorise s3:GetObject que si la clé de condition aws:Referer est égale au nom de domaine de la distribution.
    - id: d
      text:
        en: |-
          Attach an origin access control (OAC) to the origin, allow cloudfront.amazonaws.com to call s3:GetObject and kms:Decrypt with an AWS:SourceArn condition for the distribution, and remove the public statement.
        fr: |-
          Attacher un contrôle d'accès d'origine (OAC) à l'origine, autoriser cloudfront.amazonaws.com à appeler s3:GetObject et kms:Decrypt avec une condition AWS:SourceArn sur la distribution, et supprimer l'instruction publique.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Origin access control signs CloudFront's requests to S3 and supports SSE-KMS. The bucket policy grants s3:GetObject to the cloudfront.amazonaws.com service principal, and the key policy grants it kms:Decrypt, both with an AWS:SourceArn condition that limits access to this distribution. With the public statement removed, direct requests to S3 are denied, so every download passes through AWS WAF and the geographic restrictions.
    fr: |-
      Le contrôle d'accès d'origine signe les requêtes de CloudFront vers S3 et prend en charge SSE-KMS. La politique de compartiment accorde s3:GetObject au principal de service cloudfront.amazonaws.com, et la politique de clé lui accorde kms:Decrypt, toutes deux avec une condition AWS:SourceArn qui limite l'accès à cette distribution. Une fois l'instruction publique supprimée, les requêtes directes vers S3 sont refusées ; chaque téléchargement passe donc par AWS WAF et les restrictions géographiques.
  options:
    a:
      en: |-
        An OAI is the legacy mechanism and does not support objects encrypted with SSE-KMS, so CloudFront could no longer serve the downloads.
      fr: |-
        L'OAI est le mécanisme hérité et ne prend pas en charge les objets chiffrés avec SSE-KMS ; CloudFront ne pourrait donc plus servir les téléchargements.
    b:
      en: |-
        Without OAC, CloudFront sends unsigned requests, which S3 denies once public access is removed, so the distribution stops working.
      fr: |-
        Sans OAC, CloudFront envoie des requêtes non signées, que S3 refuse une fois l'accès public supprimé ; la distribution cesse donc de fonctionner.
    c:
      en: |-
        Any client can set the Referer header, so this condition does not prevent direct access, and anonymous requests still cannot use the KMS key.
      fr: |-
        N'importe quel client peut définir l'en-tête Referer ; cette condition n'empêche donc pas l'accès direct, et les requêtes anonymes ne peuvent toujours pas utiliser la clé KMS.
references:
  - title: Restrict access to an Amazon S3 origin - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html
