id: scsc03-3a-lambda-vpc-execution-role
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security policy requires every AWS Lambda function that processes customer data to be attached to a VPC. A developer updates an existing function to attach it to two private subnets and a security group. The update fails with an error stating that the function's execution role does not have permission to call CreateNetworkInterface on Amazon EC2. The company wants to use an AWS managed policy and least privilege.

    What should the developer do?
  fr: |
    Une politique de sécurité exige que chaque fonction AWS Lambda qui traite des données clients soit attachée à un VPC. Un développeur modifie une fonction existante pour l'attacher à deux sous-réseaux privés et à un groupe de sécurité. La mise à jour échoue avec une erreur indiquant que le rôle d'exécution de la fonction n'a pas l'autorisation d'appeler CreateNetworkInterface sur Amazon EC2. L'entreprise veut utiliser une politique gérée par AWS et le moindre privilège.

    Que doit faire le développeur ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach the AmazonEC2FullAccess managed policy to the function's execution role.
        fr: |-
          Attacher la politique gérée AmazonEC2FullAccess au rôle d'exécution de la fonction.
    - id: b
      text:
        en: |-
          Attach the AWSLambdaVPCAccessExecutionRole managed policy to the developer's own IAM role.
        fr: |-
          Attacher la politique gérée AWSLambdaVPCAccessExecutionRole au propre rôle IAM du développeur.
    - id: c
      text:
        en: |-
          Add a statement to the function's resource-based policy that allows ec2.amazonaws.com to call lambda:InvokeFunction.
        fr: |-
          Ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise ec2.amazonaws.com à appeler lambda:InvokeFunction.
    - id: d
      text:
        en: |-
          Attach the AWSLambdaVPCAccessExecutionRole managed policy to the function's execution role.
        fr: |-
          Attacher la politique gérée AWSLambdaVPCAccessExecutionRole au rôle d'exécution de la fonction.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Lambda uses the function's execution role to create and manage the network interfaces in the VPC, which needs ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces, ec2:DescribeSubnets, ec2:DeleteNetworkInterface, ec2:AssignPrivateIpAddresses, and ec2:UnassignPrivateIpAddresses. The AWSLambdaVPCAccessExecutionRole managed policy grants these permissions. The lambda:VpcIds condition key can then enforce the VPC requirement on CreateFunction and UpdateFunctionConfiguration.
    fr: |-
      Lambda utilise le rôle d'exécution de la fonction pour créer et gérer les interfaces réseau dans le VPC, ce qui exige ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces, ec2:DescribeSubnets, ec2:DeleteNetworkInterface, ec2:AssignPrivateIpAddresses et ec2:UnassignPrivateIpAddresses. La politique gérée AWSLambdaVPCAccessExecutionRole accorde ces autorisations. La clé de condition lambda:VpcIds peut ensuite imposer l'exigence de VPC sur CreateFunction et UpdateFunctionConfiguration.
  options:
    a:
      en: |-
        AmazonEC2FullAccess grants far more than the network interface permissions that Lambda needs, which violates least privilege.
      fr: |-
        AmazonEC2FullAccess accorde bien plus que les autorisations d'interface réseau dont Lambda a besoin, ce qui enfreint le moindre privilège.
    b:
      en: |-
        Lambda creates the network interfaces with the execution role, so permissions on the developer's role do not fix the error.
      fr: |-
        Lambda crée les interfaces réseau avec le rôle d'exécution ; des autorisations sur le rôle du développeur ne corrigent donc pas l'erreur.
    c:
      en: |-
        A resource-based policy controls who can invoke the function; it gives Lambda no permission to create network interfaces.
      fr: |-
        Une politique basée sur les ressources contrôle qui peut invoquer la fonction ; elle ne donne à Lambda aucune autorisation pour créer des interfaces réseau.
references:
  - title: Giving Lambda Event Functions access to resources in an Amazon VPC - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
