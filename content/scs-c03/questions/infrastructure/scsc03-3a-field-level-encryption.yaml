id: scsc03-3a-field-level-encryption
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company collects claims through an HTML form served by Amazon CloudFront. The form posts URL-encoded data over HTTPS to an origin, and the request then passes through several internal microservices that log request bodies. The national ID number and the bank account fields must be encrypted at the edge so that only the claims settlement service, which holds a private key, can read them. The company does not want to write or operate custom edge code.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance collecte des déclarations de sinistre au moyen d'un formulaire HTML servi par Amazon CloudFront. Le formulaire envoie des données encodées en URL par HTTPS à une origine, puis la requête traverse plusieurs microservices internes qui journalisent le corps des requêtes. Le numéro d'identification national et les champs du compte bancaire doivent être chiffrés en périphérie afin que seul le service de règlement des sinistres, qui détient une clé privée, puisse les lire. L'entreprise ne veut pas écrire ni exploiter de code personnalisé en périphérie.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Set the origin protocol policy to HTTPS Only with TLSv1.2, and require HTTPS between all microservices with certificates from AWS Private CA.
        fr: |-
          Définir la politique de protocole d'origine sur HTTPS Only avec TLSv1.2, et exiger HTTPS entre tous les microservices avec des certificats d'AWS Private CA.
    - id: b
      text:
        en: |-
          Configure CloudFront field-level encryption with an uploaded RSA public key and a profile for the two fields, and decrypt the fields in the settlement service with the private key.
        fr: |-
          Configurer le chiffrement au niveau des champs de CloudFront avec une clé publique RSA chargée et un profil pour les deux champs, et déchiffrer les champs dans le service de règlement avec la clé privée.
    - id: c
      text:
        en: |-
          Configure AWS WAF web ACL data protection with hashing for the two form fields so that their values are replaced before the request reaches the origin.
        fr: |-
          Configurer la protection des données de la liste ACL web AWS WAF avec hachage pour les deux champs du formulaire afin que leurs valeurs soient remplacées avant que la requête n'atteigne l'origine.
    - id: d
      text:
        en: |-
          Enable SSE-KMS on the buckets that store the microservice logs, and allow only the settlement service's role to use the KMS key.
        fr: |-
          Activer SSE-KMS sur les compartiments qui stockent les journaux des microservices, et n'autoriser que le rôle du service de règlement à utiliser la clé KMS.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Field-level encryption encrypts up to 10 named fields of URL-encoded POST data at the edge with a public key that you upload to CloudFront. The fields stay encrypted through the origin and every intermediate service, and only the component that holds the private key can decrypt them. It is configured with a profile and a configuration attached to the cache behavior, without custom code.
    fr: |-
      Le chiffrement au niveau des champs chiffre en périphérie jusqu'à 10 champs nommés de données POST encodées en URL, avec une clé publique que vous chargez dans CloudFront. Les champs restent chiffrés jusqu'à l'origine et à travers chaque service intermédiaire, et seul le composant qui détient la clé privée peut les déchiffrer. Il se configure avec un profil et une configuration attachée au comportement de cache, sans code personnalisé.
  options:
    a:
      en: |-
        TLS protects data in transit between hops, but each microservice decrypts the connection and can read and log the field values.
      fr: |-
        TLS protège les données en transit entre les sauts, mais chaque microservice déchiffre la connexion et peut lire et journaliser les valeurs des champs.
    c:
      en: |-
        Web ACL data protection changes what AWS WAF writes to logs, sampled requests and collected data; it does not alter the request forwarded to the origin.
      fr: |-
        La protection des données de la liste ACL web modifie ce qu'AWS WAF écrit dans les journaux, les requêtes échantillonnées et les données collectées ; elle ne change pas la requête transmise à l'origine.
    d:
      en: |-
        Encrypting the log buckets protects stored logs only; the microservices still receive and process the plaintext values.
      fr: |-
        Chiffrer les compartiments de journaux ne protège que les journaux stockés ; les microservices reçoivent et traitent toujours les valeurs en clair.
references:
  - title: Use field-level encryption to help protect sensitive data - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/field-level-encryption.html
