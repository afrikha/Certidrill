id: scsc03-3a-ja4-fingerprint-block
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A ticketing company sells tickets through an Amazon CloudFront distribution that has an AWS WAF web ACL with logging enabled. A scalping tool sends requests from thousands of residential proxy IP addresses in many countries and changes its User-Agent header on every request. Analysis of the web ACL logs shows that all of the tool's requests share the same JA4 fingerprint, which no legitimate browser in the logs produces. The company must block every request from the tool with the least impact on legitimate customers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de billetterie vend des billets par une distribution Amazon CloudFront dotée d'une liste ACL web AWS WAF dont la journalisation est activée. Un outil de revente spéculative envoie des requêtes depuis des milliers d'adresses IP de proxys résidentiels dans de nombreux pays et change son en-tête User-Agent à chaque requête. L'analyse des journaux de la liste ACL web montre que toutes les requêtes de l'outil partagent la même empreinte JA4, qu'aucun navigateur légitime présent dans les journaux ne produit. L'entreprise doit bloquer toutes les requêtes de l'outil avec le moins d'impact possible sur les clients légitimes.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a rule with a Block action and a string match statement that exactly matches the observed value in the JA4 fingerprint request component, with a fallback of no match.
        fr: |-
          Ajouter une règle avec une action Block et une instruction de correspondance de chaîne qui correspond exactement à la valeur observée dans le composant de requête JA4 fingerprint, avec un comportement de repli « aucune correspondance ».
    - id: b
      text:
        en: |-
          Add a rule with a Block action and a regex pattern set that matches the User-Agent values seen in the tool's requests over the last week.
        fr: |-
          Ajouter une règle avec une action Block et un ensemble de modèles regex qui correspond aux valeurs User-Agent observées dans les requêtes de l'outil la semaine passée.
    - id: c
      text:
        en: |-
          Add a rule with a Block action for an IP set, and update the IP set every hour with the source addresses of the tool's requests found in the logs.
        fr: |-
          Ajouter une règle avec une action Block pour un ensemble d'adresses IP, et mettre à jour cet ensemble toutes les heures avec les adresses sources des requêtes de l'outil trouvées dans les journaux.
    - id: d
      text:
        en: |-
          Add a rule with a Block action and a geo match statement for the countries that send the largest share of the tool's requests.
        fr: |-
          Ajouter une règle avec une action Block et une instruction de correspondance géographique pour les pays qui envoient la plus grande part des requêtes de l'outil.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The JA4 fingerprint is a hash derived from the TLS Client Hello, so it identifies the client's TLS stack even when the IP address and User-Agent change. AWS WAF exposes it as a request component for CloudFront distributions and Application Load Balancers, and an exact string match on the logged value blocks only that client. A fallback behavior is required for requests whose fingerprint cannot be calculated; no match keeps those requests from being blocked.
    fr: |-
      L'empreinte JA4 est un hachage dérivé du Client Hello TLS ; elle identifie donc la pile TLS du client même lorsque l'adresse IP et le User-Agent changent. AWS WAF l'expose comme composant de requête pour les distributions CloudFront et les Application Load Balancers, et une correspondance exacte de chaîne sur la valeur journalisée ne bloque que ce client. Un comportement de repli est obligatoire pour les requêtes dont l'empreinte ne peut pas être calculée ; « aucune correspondance » évite de bloquer ces requêtes.
  options:
    b:
      en: |-
        The tool changes its User-Agent on every request, so a list of past values does not catch new requests.
      fr: |-
        L'outil change de User-Agent à chaque requête ; une liste de valeurs passées ne détecte donc pas les nouvelles requêtes.
    c:
      en: |-
        Residential proxy addresses rotate constantly, so an hourly IP set always lags behind and can block real customers who later use the same addresses.
      fr: |-
        Les adresses de proxys résidentiels changent sans cesse ; un ensemble d'adresses IP mis à jour toutes les heures est donc toujours en retard et peut bloquer de vrais clients qui utilisent ensuite les mêmes adresses.
    d:
      en: |-
        Blocking whole countries would block legitimate customers there and still miss the tool's requests from other countries.
      fr: |-
        Bloquer des pays entiers bloquerait les clients légitimes de ces pays et laisserait passer les requêtes de l'outil venant d'autres pays.
references:
  - title: Request components in AWS WAF - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-fields-list.html
