id: scsc03-3b-lambda-runtime-update-mode
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 150 AWS Lambda functions on managed Python runtimes. Every function is redeployed at least once a week through a pipeline that runs integration tests before production. The change management policy states that runtime security updates must reach a function only through a pipeline deployment, so that the tests validate each update, and never between deployments. Functions must still receive runtime security updates regularly, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 150 fonctions AWS Lambda sur des environnements d'exécution Python gérés. Chaque fonction est redéployée au moins une fois par semaine par un pipeline qui exécute des tests d'intégration avant la production. La politique de gestion des changements impose que les mises à jour de sécurité de l'environnement d'exécution n'atteignent une fonction que par un déploiement du pipeline, afin que les tests valident chaque mise à jour, et jamais entre deux déploiements. Les fonctions doivent tout de même recevoir régulièrement les mises à jour de sécurité de l'environnement d'exécution, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Keep the runtime update mode set to Auto, which applies new runtime versions to functions in two phases."
        fr: "Conserver le mode de mise à jour de l'environnement d'exécution sur Auto, qui applique les nouvelles versions de l'environnement d'exécution aux fonctions en deux phases."
    - id: b
      text:
        en: "Set the runtime update mode to Manual, and have the pipeline look up and set the latest runtime version ARN at each deployment."
        fr: "Définir le mode de mise à jour sur Manual, et faire rechercher et définir par le pipeline l'ARN de la dernière version de l'environnement d'exécution à chaque déploiement."
    - id: c
      text:
        en: "Set the runtime update mode to Function update for every function by using PutRuntimeManagementConfig in the pipeline."
        fr: "Définir le mode de mise à jour sur Function update pour chaque fonction à l'aide de PutRuntimeManagementConfig dans le pipeline."
    - id: d
      text:
        en: "Convert the functions to a custom runtime packaged in a Lambda layer that the platform team patches and publishes."
        fr: "Convertir les fonctions vers un environnement d'exécution personnalisé empaqueté dans une couche Lambda que l'équipe plateforme corrige et publie."
answer: { optionId: c }
explanation:
  correct:
    en: "In Function update mode, Lambda moves a function to the most recent and secure runtime version only when the function code or configuration is updated. Weekly pipeline deployments therefore deliver runtime patches that the integration tests validate, and no update lands between deployments."
    fr: "En mode Function update, Lambda fait passer une fonction à la version la plus récente et la plus sûre de l'environnement d'exécution uniquement lorsque le code ou la configuration de la fonction est mis à jour. Les déploiements hebdomadaires du pipeline livrent donc des correctifs que les tests d'intégration valident, et aucune mise à jour n'arrive entre deux déploiements."
  options:
    a:
      en: "In the second phase of an Auto rollout, Lambda updates functions that have not been redeployed, so an update can reach a function between deployments."
      fr: "Dans la seconde phase d'un déploiement Auto, Lambda met à jour les fonctions qui n'ont pas été redéployées : une mise à jour peut donc atteindre une fonction entre deux déploiements."
    b:
      en: "Manual mode is meant as a temporary rollback mechanism, and resolving runtime version ARNs in the pipeline adds custom work that Function update mode avoids."
      fr: "Le mode Manual est prévu comme mécanisme temporaire de restauration, et résoudre les ARN de versions dans le pipeline ajoute un travail personnalisé que le mode Function update évite."
    d:
      en: "A custom runtime moves runtime patching entirely to the company, which is the opposite of the least operational overhead."
      fr: "Un environnement d'exécution personnalisé transfère entièrement les correctifs de l'environnement d'exécution à l'entreprise, ce qui est l'inverse du moins de charge opérationnelle."
references:
  - title: "Understanding how Lambda manages runtime updates - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/runtimes-update.html
