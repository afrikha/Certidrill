id: scsc03-3b-ssm-endpoints-kms-logs
objective: "3.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's Amazon EC2 instances run in private subnets that have no route to the internet. Interface VPC endpoints for ssm, ssmmessages and ec2messages exist, and AWS Systems Manager Session Manager works. The security team then turned on AWS KMS encryption of session data and streaming of session data to Amazon CloudWatch Logs in the session preferences. Since this change, sessions fail. The instance profile already grants kms:Decrypt on the key and the CloudWatch Logs permissions that Session Manager requires.

    Which combination of steps will resolve the issue? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Les instances Amazon EC2 d'AnyCompany s'exécutent dans des sous-réseaux privés qui n'ont aucun itinéraire vers Internet. Des points de terminaison de VPC d'interface pour ssm, ssmmessages et ec2messages existent, et AWS Systems Manager Session Manager fonctionne. L'équipe de sécurité a ensuite activé, dans les préférences de session, le chiffrement AWS KMS des données de session et la diffusion des données de session vers Amazon CloudWatch Logs. Depuis ce changement, les sessions échouent. Le profil d'instance accorde déjà kms:Decrypt sur la clé et les autorisations CloudWatch Logs dont Session Manager a besoin.

    Quelle combinaison d'étapes résout le problème ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create an interface VPC endpoint for com.amazonaws.region.kms in the VPC."
        fr: "Créer un point de terminaison de VPC d'interface pour com.amazonaws.region.kms dans le VPC."
    - id: b
      text:
        en: "Create an interface VPC endpoint for com.amazonaws.region.ec2 in the VPC."
        fr: "Créer un point de terminaison de VPC d'interface pour com.amazonaws.region.ec2 dans le VPC."
    - id: c
      text:
        en: "Add an inbound rule to the instances' security group that allows TCP 443 from the VPC endpoints."
        fr: "Ajouter au groupe de sécurité des instances une règle entrante qui autorise le TCP 443 depuis les points de terminaison de VPC."
    - id: d
      text:
        en: "Create an interface VPC endpoint for com.amazonaws.region.logs in the VPC."
        fr: "Créer un point de terminaison de VPC d'interface pour com.amazonaws.region.logs dans le VPC."
    - id: e
      text:
        en: "Create a gateway VPC endpoint for Amazon S3 and add it to the route tables of the private subnets."
        fr: "Créer un point de terminaison de VPC de passerelle pour Amazon S3 et l'ajouter aux tables de routage des sous-réseaux privés."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Without internet access, the instances reach AWS services only through VPC endpoints. AWS KMS encryption for Session Manager needs the kms endpoint so that the SSM Agent can call AWS KMS, and streaming session data to CloudWatch Logs needs the logs endpoint."
    fr: "Sans accès Internet, les instances n'atteignent les services AWS que par des points de terminaison de VPC. Le chiffrement AWS KMS de Session Manager nécessite le point de terminaison kms pour que l'agent SSM puisse appeler AWS KMS, et la diffusion des données de session vers CloudWatch Logs nécessite le point de terminaison logs."
  options:
    b:
      en: "The ec2 endpoint is needed for operations such as VSS-enabled snapshots, not for session encryption or logging."
      fr: "Le point de terminaison ec2 sert à des opérations comme les instantanés compatibles VSS, et non au chiffrement ou à la journalisation des sessions."
    c:
      en: "The instances open outbound connections to the endpoints; it is the endpoint security group that must allow inbound 443 from the instances, and responses are allowed because security groups are stateful."
      fr: "Les instances ouvrent des connexions sortantes vers les points de terminaison ; c'est le groupe de sécurité des points de terminaison qui doit autoriser le 443 entrant depuis les instances, et les réponses sont autorisées car les groupes de sécurité sont avec état."
    e:
      en: "Amazon S3 is used for session logs written to S3 and for agent updates; the new settings use AWS KMS and CloudWatch Logs."
      fr: "Amazon S3 sert aux journaux de session écrits dans S3 et aux mises à jour de l'agent ; les nouveaux paramètres utilisent AWS KMS et CloudWatch Logs."
references:
  - title: "Improve the security of EC2 instances by using VPC endpoints for Systems Manager - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/setup-create-vpc.html
