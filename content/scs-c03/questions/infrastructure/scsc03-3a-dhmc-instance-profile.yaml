id: scsc03-3a-dhmc-instance-profile
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany activated Default Host Management Configuration in AWS Systems Manager in us-east-1 so that the permissions Systems Manager uses on Amazon EC2 instances are controlled centrally in the AWSSystemsManagerDefaultEC2InstanceManagementRole role. All instances use IMDSv2 and SSM Agent 3.2.582.0 or later. An audit shows that 40 instances still use Systems Manager permissions from their own instance profile, app-role, which also grants the application access to Amazon S3. The AmazonSSMManagedInstanceCore managed policy is attached to app-role for historical reasons.

    What should the security team do so that these instances use the Default Host Management Configuration role for Systems Manager?
  fr: |
    AnyCompany a activé Default Host Management Configuration dans AWS Systems Manager dans us-east-1 afin que les autorisations qu'utilise Systems Manager sur les instances Amazon EC2 soient contrôlées de manière centralisée dans le rôle AWSSystemsManagerDefaultEC2InstanceManagementRole. Toutes les instances utilisent IMDSv2 et SSM Agent 3.2.582.0 ou une version ultérieure. Un audit montre que 40 instances utilisent toujours les autorisations Systems Manager de leur propre profil d'instance, app-role, qui accorde aussi à l'application l'accès à Amazon S3. La politique gérée AmazonSSMManagedInstanceCore est attachée à app-role pour des raisons historiques.

    Que doit faire l'équipe de sécurité pour que ces instances utilisent le rôle de Default Host Management Configuration pour Systems Manager ?
body:
  options:
    - id: a
      text:
        en: |-
          Detach the instance profile from the 40 instances, and grant the application's Amazon S3 permissions to the Default Host Management Configuration role.
        fr: |-
          Détacher le profil d'instance des 40 instances, et accorder les autorisations Amazon S3 de l'application au rôle de Default Host Management Configuration.
    - id: b
      text:
        en: |-
          Detach the AmazonSSMManagedInstanceCore policy from app-role, and keep the Amazon S3 permissions that the application needs.
        fr: |-
          Détacher la politique AmazonSSMManagedInstanceCore d'app-role, et conserver les autorisations Amazon S3 dont l'application a besoin.
    - id: c
      text:
        en: |-
          Attach the AmazonSSMManagedEC2InstanceDefaultPolicy managed policy to app-role, and remove the AmazonSSMManagedInstanceCore policy later.
        fr: |-
          Attacher la politique gérée AmazonSSMManagedEC2InstanceDefaultPolicy à app-role, et retirer la politique AmazonSSMManagedInstanceCore plus tard.
    - id: d
      text:
        en: |-
          Run aws ssm update-service-setting again to point the Default Host Management Configuration setting to the role, and reboot the 40 instances.
        fr: |-
          Exécuter de nouveau aws ssm update-service-setting pour faire pointer le paramètre de Default Host Management Configuration vers le rôle, et redémarrer les 40 instances.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      If an instance profile allows ssm:UpdateInstanceInformation, SSM Agent uses those permissions first and the instance does not use the Default Host Management Configuration permissions. Removing the Systems Manager policy from app-role makes the agent fall back to the default role, while the application keeps its Amazon S3 access through the same profile.
    fr: |-
      Si un profil d'instance autorise ssm:UpdateInstanceInformation, SSM Agent utilise d'abord ces autorisations et l'instance n'utilise pas celles de Default Host Management Configuration. Retirer la politique Systems Manager d'app-role fait revenir l'agent au rôle par défaut, tandis que l'application conserve son accès à Amazon S3 par le même profil.
  options:
    a:
      en: |-
        The Default Host Management Configuration credentials are used by SSM Agent, not by the application, so the application would lose its Amazon S3 access.
      fr: |-
        Les informations d'identification de Default Host Management Configuration sont utilisées par SSM Agent, pas par l'application ; l'application perdrait donc son accès à Amazon S3.
    c:
      en: |-
        Any Systems Manager permissions in the instance profile keep the agent on the profile, so adding another Systems Manager policy changes nothing.
      fr: |-
        Toute autorisation Systems Manager dans le profil d'instance maintient l'agent sur le profil ; ajouter une autre politique Systems Manager ne change donc rien.
    d:
      en: |-
        The setting is already active; the instance profile's permissions still take precedence after a reboot.
      fr: |-
        Le paramètre est déjà actif ; les autorisations du profil d'instance restent prioritaires après un redémarrage.
references:
  - title: Managing EC2 instances automatically with Default Host Management Configuration - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/fleet-manager-default-host-management-configuration.html
