id: scsc03-3a-s3-cors-put-origin
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A single-page application served from https://app.example.com uploads images directly to an Amazon S3 bucket with presigned PUT URLs. Each upload request sends a Content-Type header. The browser blocks the uploads because the preflight request fails a cross-origin resource sharing (CORS) check. The security team requires that only the application's origin be allowed to make cross-origin requests to the bucket and that only uploads be allowed cross-origin.

    Which CORS configuration should the company apply to the bucket?
  fr: |
    Une application monopage servie depuis https://app.example.com charge des images directement dans un compartiment Amazon S3 au moyen d'URL PUT présignées. Chaque requête de chargement envoie un en-tête Content-Type. Le navigateur bloque les chargements, car la requête de contrôle préalable (preflight) échoue à une vérification du partage des ressources entre origines multiples (CORS). L'équipe de sécurité exige que seule l'origine de l'application puisse envoyer des requêtes entre origines au compartiment et que seuls les chargements soient autorisés entre origines.

    Quelle configuration CORS l'entreprise doit-elle appliquer au compartiment ?
body:
  options:
    - id: a
      text: |-
        `[{"AllowedOrigins": ["*"], "AllowedMethods": ["PUT"], "AllowedHeaders": ["Content-Type"]}]`
    - id: b
      text: |-
        `[{"AllowedOrigins": ["https://app.example.com"], "AllowedMethods": ["PUT"], "AllowedHeaders": ["Content-Type"]}]`
    - id: c
      text: |-
        `[{"AllowedOrigins": ["https://app.example.com"], "AllowedMethods": ["GET", "HEAD"], "AllowedHeaders": ["*"]}]`
    - id: d
      text: |-
        `[{"AllowedOrigins": ["https://*.example.com"], "AllowedMethods": ["PUT", "POST", "DELETE"], "AllowedHeaders": ["*"]}]`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon S3 uses the first CORS rule whose AllowedOrigins matches the Origin header, whose AllowedMethods matches the method in Access-Control-Request-Method, and whose AllowedHeaders covers every header in Access-Control-Request-Headers. A rule with the exact origin, the PUT method and the Content-Type header lets the preflight succeed and allows nothing else. CORS only governs browsers; the presigned URL still authorizes each upload.
    fr: |-
      Amazon S3 utilise la première règle CORS dont AllowedOrigins correspond à l'en-tête Origin, dont AllowedMethods correspond à la méthode indiquée dans Access-Control-Request-Method et dont AllowedHeaders couvre chaque en-tête d'Access-Control-Request-Headers. Une règle avec l'origine exacte, la méthode PUT et l'en-tête Content-Type permet au contrôle préalable de réussir et n'autorise rien d'autre. CORS ne régit que les navigateurs ; l'URL présignée continue d'autoriser chaque chargement.
  options:
    a:
      en: |-
        The * origin allows cross-origin requests from every website, which violates the single-origin requirement.
      fr: |-
        L'origine * autorise les requêtes entre origines depuis n'importe quel site web, ce qui enfreint l'exigence d'une origine unique.
    c:
      en: |-
        The rule does not list PUT, so the preflight for the upload still fails.
      fr: |-
        La règle ne contient pas PUT ; le contrôle préalable du chargement échoue donc toujours.
    d:
      en: |-
        The wildcard origin admits every subdomain of example.com, and POST and DELETE allow more than uploads.
      fr: |-
        L'origine avec caractère générique admet tous les sous-domaines d'example.com, et POST et DELETE autorisent plus que des chargements.
references:
  - title: Elements of a CORS configuration - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/ManageCorsUsing.html
  - title: Using cross-origin resource sharing (CORS) - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/cors.html
