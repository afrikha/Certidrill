id: scsc03-3c-isolated-subnet-endpoints
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a card payment service on EC2 instances in a dedicated VPC. The security team requires that the subnets of these instances have no route to any destination outside the VPC, so that the instances can be reached only by other resources in the same VPC. The instances must still retrieve secrets from AWS Secrets Manager and call AWS KMS.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un service de paiement par carte sur des instances EC2 dans un VPC dédié. L'équipe de sécurité exige que les sous-réseaux de ces instances n'aient aucune route vers une destination hors du VPC, afin que les instances ne soient joignables que par d'autres ressources du même VPC. Les instances doivent toujours récupérer des secrets dans AWS Secrets Manager et appeler AWS KMS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Place the instances in private subnets whose default route points to a NAT gateway, and allow only outbound HTTPS in their security group.
        fr: |-
          Placer les instances dans des sous-réseaux privés dont la route par défaut pointe vers une passerelle NAT, et n'autoriser que le trafic HTTPS sortant dans leur groupe de sécurité.
    - id: b
      text:
        en: |-
          Place the instances in isolated subnets that have only the local route, and create interface VPC endpoints for Secrets Manager and AWS KMS with private DNS enabled.
        fr: |-
          Placer les instances dans des sous-réseaux isolés qui n'ont que la route locale, et créer des points de terminaison de VPC d'interface pour Secrets Manager et AWS KMS avec le DNS privé activé.
    - id: c
      text:
        en: |-
          Place the instances in public subnets without public IP addresses, and allow only traffic from the VPC CIDR in their security group.
        fr: |-
          Placer les instances dans des sous-réseaux publics sans adresse IP publique, et n'autoriser que le trafic provenant du CIDR du VPC dans leur groupe de sécurité.
    - id: d
      text:
        en: |-
          Place the instances in private subnets whose default route points to a transit gateway that sends traffic to a central egress VPC.
        fr: |-
          Placer les instances dans des sous-réseaux privés dont la route par défaut pointe vers une passerelle de transit qui envoie le trafic vers un VPC de sortie central.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An isolated subnet has no routes to destinations outside its VPC, so its resources can only reach, or be reached by, resources in the same VPC. Interface VPC endpoints are network interfaces inside the VPC, so with private DNS the instances reach Secrets Manager and AWS KMS without any route leaving the VPC.
    fr: |-
      Un sous-réseau isolé n'a aucune route vers des destinations hors de son VPC : ses ressources ne peuvent joindre que des ressources du même VPC, ou être jointes par elles. Les points de terminaison de VPC d'interface sont des interfaces réseau à l'intérieur du VPC ; avec le DNS privé, les instances joignent donc Secrets Manager et AWS KMS sans aucune route qui quitte le VPC.
  options:
    a:
      en: |-
        A default route to a NAT gateway gives the subnet a path to the internet, which is a route to destinations outside the VPC.
      fr: |-
        Une route par défaut vers une passerelle NAT donne au sous-réseau un chemin vers Internet, c'est-à-dire une route vers des destinations hors du VPC.
    c:
      en: |-
        A public subnet has a direct route to an internet gateway; security group rules do not remove that route.
      fr: |-
        Un sous-réseau public a une route directe vers une passerelle Internet ; les règles de groupe de sécurité ne suppriment pas cette route.
    d:
      en: |-
        A default route to a transit gateway sends traffic to other networks, so the subnets would have routes outside the VPC.
      fr: |-
        Une route par défaut vers une passerelle de transit envoie le trafic vers d'autres réseaux : les sous-réseaux auraient donc des routes hors du VPC.
references:
  - title: Subnets for your VPC - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
