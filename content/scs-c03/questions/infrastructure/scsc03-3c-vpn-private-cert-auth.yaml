id: scsc03-3c-vpn-private-cert-auth
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's 40 branch offices connect to a transit gateway with AWS Site-to-Site VPN. Each branch router receives a dynamic public IP address from its internet provider. The security team wants to stop using pre-shared keys for tunnel authentication. The AWS side of each tunnel must authenticate the branch routers with X.509 certificates issued from the company's private PKI, which the company wants to run in AWS. The routers must keep working when their public IP address changes.

    Which solution will meet these requirements?
  fr: |
    Les 40 agences d'AnyCompany se connectent à une passerelle de transit par AWS Site-to-Site VPN. Chaque routeur d'agence reçoit une adresse IP publique dynamique de son fournisseur d'accès Internet. L'équipe de sécurité veut cesser d'utiliser des clés pré-partagées pour l'authentification des tunnels. Le côté AWS de chaque tunnel doit authentifier les routeurs d'agence avec des certificats X.509 émis par l'infrastructure à clés publiques (PKI) privée de l'entreprise, que l'entreprise veut exécuter dans AWS. Les routeurs doivent continuer à fonctionner lorsque leur adresse IP publique change.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Change the pre-shared key storage of each tunnel to Secrets Manager, and replace the pre-shared keys every 30 days.
        fr: |-
          Passer le stockage de la clé pré-partagée de chaque tunnel à Secrets Manager, et remplacer les clés pré-partagées tous les 30 jours.
    - id: b
      text:
        en: |-
          Request a public certificate from AWS Certificate Manager for each router, and create each customer gateway with the certificate ARN and the router's current IP address.
        fr: |-
          Demander un certificat public à AWS Certificate Manager pour chaque routeur, et créer chaque passerelle client avec l'ARN du certificat et l'adresse IP actuelle du routeur.
    - id: c
      text:
        en: |-
          Issue a private certificate for each router from a subordinate CA in AWS Private CA, and create each customer gateway with the certificate ARN and no IP address.
        fr: |-
          Émettre un certificat privé pour chaque routeur à partir d'une autorité de certification (CA) subordonnée d'AWS Private CA, et créer chaque passerelle client avec l'ARN du certificat et sans adresse IP.
    - id: d
      text:
        en: |-
          Issue a private certificate for each router directly from a root CA in AWS Private CA, and create each customer gateway with the certificate ARN and the router's current IP address.
        fr: |-
          Émettre un certificat privé pour chaque routeur directement à partir d'une autorité de certification (CA) racine d'AWS Private CA, et créer chaque passerelle client avec l'ARN du certificat et l'adresse IP actuelle du routeur.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Site-to-Site VPN supports certificate-based authentication as an alternative to pre-shared keys, with a private certificate issued from a subordinate CA in AWS Private CA (the subordinate CA can be signed by an AWS Private CA root or an external CA). A service-linked role lets the service use the certificate for the AWS side. When the customer gateway is created without an IP address, AWS does not check the address, so the router can change its public IP address without reconfiguration.
    fr: |-
      Site-to-Site VPN prend en charge l'authentification par certificat comme alternative aux clés pré-partagées, avec un certificat privé émis par une CA subordonnée d'AWS Private CA (la CA subordonnée peut être signée par une CA racine d'AWS Private CA ou par une CA externe). Un rôle lié à un service permet au service d'utiliser le certificat pour le côté AWS. Lorsque la passerelle client est créée sans adresse IP, AWS ne vérifie pas l'adresse ; le routeur peut donc changer d'adresse IP publique sans reconfiguration.
  options:
    a:
      en: |-
        Secrets Manager storage and regular replacement improve the handling of pre-shared keys, but the tunnels still authenticate with pre-shared keys, which the security team wants to stop using.
      fr: |-
        Le stockage dans Secrets Manager et le remplacement régulier améliorent la gestion des clés pré-partagées, mais les tunnels s'authentifient toujours avec des clés pré-partagées, que l'équipe de sécurité veut abandonner.
    b:
      en: |-
        Certificate authentication for Site-to-Site VPN uses a private certificate from AWS Private CA, not a public ACM certificate, and pinning the current IP address breaks when the dynamic address changes.
      fr: |-
        L'authentification par certificat de Site-to-Site VPN utilise un certificat privé d'AWS Private CA, pas un certificat public ACM, et fixer l'adresse IP actuelle ne fonctionne plus lorsque l'adresse dynamique change.
    d:
      en: |-
        The certificate must come from a subordinate CA, not directly from a root CA, and pinning the current IP address breaks when the dynamic address changes.
      fr: |-
        Le certificat doit provenir d'une CA subordonnée, pas directement d'une CA racine, et fixer l'adresse IP actuelle ne fonctionne plus lorsque l'adresse dynamique change.
references:
  - title: AWS Site-to-Site VPN tunnel authentication options - AWS Site-to-Site VPN
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/vpn-tunnel-authentication-options.html
