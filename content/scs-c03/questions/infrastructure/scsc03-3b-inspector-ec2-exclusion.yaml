id: scsc03-3b-inspector-ec2-exclusion
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses Amazon Inspector in hybrid scan mode in all its accounts. A performance team launches about 300 Amazon EC2 Linux instances every night for load tests and terminates them in the morning. The instances are managed by AWS Systems Manager. The security team decides that these instances must not be scanned by Amazon Inspector and must not generate Inspector charges. All other instances in the same accounts must still be scanned.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise Amazon Inspector en mode d'analyse hybride dans tous ses comptes. Une équipe de performance lance chaque nuit environ 300 instances Amazon EC2 Linux pour des tests de charge et les résilie le matin. Les instances sont gérées par AWS Systems Manager. L'équipe de sécurité décide que ces instances ne doivent pas être analysées par Amazon Inspector et ne doivent générer aucun frais Inspector. Toutes les autres instances des mêmes comptes doivent toujours être analysées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Inspector suppression rule that matches the load-test instances by their resource tag."
        fr: "Créer une règle de suppression Inspector qui cible les instances de test de charge par leur balise de ressource."
    - id: b
      text:
        en: "Remove the instance profile from the launch template so that the instances are no longer managed by Systems Manager."
        fr: "Retirer le profil d'instance du modèle de lancement afin que les instances ne soient plus gérées par Systems Manager."
    - id: c
      text:
        en: "Add the InspectorEc2Exclusion tag key to the load-test instances in the launch template."
        fr: "Ajouter la clé de balise InspectorEc2Exclusion aux instances de test de charge dans le modèle de lancement."
    - id: d
      text:
        en: "Change the EC2 scan mode of the accounts to agent-based scanning only."
        fr: "Passer le mode d'analyse EC2 des comptes en analyse basée sur un agent uniquement."
answer: { optionId: c }
explanation:
  correct:
    en: "Instances tagged with the InspectorEc2Exclusion key are marked as excluded, receive no findings and are not charged. Putting the tag in the launch template applies it to every load-test instance at launch, while all other instances keep being scanned."
    fr: "Les instances qui portent la clé de balise InspectorEc2Exclusion sont marquées comme exclues, ne reçoivent aucun résultat et ne sont pas facturées. Placer la balise dans le modèle de lancement l'applique à chaque instance de test de charge dès son lancement, tandis que toutes les autres instances continuent d'être analysées."
  options:
    a:
      en: "Suppression rules only hide matching findings; the instances are still scanned and billed."
      fr: "Les règles de suppression ne font que masquer les résultats correspondants ; les instances sont toujours analysées et facturées."
    b:
      en: "In hybrid mode, eligible instances that are not managed by Systems Manager are scanned agentlessly from EBS snapshots, so they would still be scanned and billed."
      fr: "En mode hybride, les instances éligibles qui ne sont pas gérées par Systems Manager sont analysées sans agent à partir d'instantanés EBS : elles seraient toujours analysées et facturées."
    d:
      en: "The load-test instances are managed by Systems Manager, so agent-based scanning still scans them; the change also stops agentless coverage of unmanaged instances that must be scanned."
      fr: "Les instances de test de charge sont gérées par Systems Manager : l'analyse basée sur un agent les analyse toujours ; ce changement arrête aussi la couverture sans agent des instances non gérées qui doivent être analysées."
references:
  - title: "Scanning Amazon EC2 instances with Amazon Inspector - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-ec2.html
