id: scsc03-3b-nacl-ephemeral-return
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's Amazon EC2 Linux instances in a private subnet download updates over HTTPS from internet repositories through a NAT gateway in a public subnet. The security team associated a custom network ACL with the private subnet. Its inbound rules are 100: allow TCP 443 from 10.0.0.0/16 and *: deny all. Its outbound rules are 100: allow TCP 443 to 0.0.0.0/0 and *: deny all. Since the change, all downloads time out. The instances' security group allows all outbound traffic.

    Which change will restore the downloads with the fewest additional open ports?
  fr: |
    Les instances Amazon EC2 Linux d'AnyCompany situées dans un sous-réseau privé téléchargent des mises à jour en HTTPS depuis des référentiels Internet via une passerelle NAT dans un sous-réseau public. L'équipe de sécurité a associé une liste ACL réseau (network ACL) personnalisée au sous-réseau privé. Ses règles entrantes sont 100 : autoriser TCP 443 depuis 10.0.0.0/16 et * : tout refuser. Ses règles sortantes sont 100 : autoriser TCP 443 vers 0.0.0.0/0 et * : tout refuser. Depuis ce changement, tous les téléchargements expirent. Le groupe de sécurité des instances autorise tout le trafic sortant.

    Quelle modification rétablit les téléchargements en ouvrant le moins de ports supplémentaires ?
body:
  options:
    - id: a
      text:
        en: "Add an outbound rule 110 that allows TCP 1024-65535 to 0.0.0.0/0."
        fr: "Ajouter une règle sortante 110 qui autorise TCP 1024-65535 vers 0.0.0.0/0."
    - id: b
      text:
        en: "Add an inbound rule 110 that allows TCP 443 from 0.0.0.0/0."
        fr: "Ajouter une règle entrante 110 qui autorise TCP 443 depuis 0.0.0.0/0."
    - id: c
      text:
        en: "Add an inbound rule 110 that allows TCP 1024-65535 from 0.0.0.0/0."
        fr: "Ajouter une règle entrante 110 qui autorise TCP 1024-65535 depuis 0.0.0.0/0."
    - id: d
      text:
        en: "Add an inbound rule to the instances' security group that allows TCP 1024-65535 from 0.0.0.0/0."
        fr: "Ajouter au groupe de sécurité des instances une règle entrante qui autorise TCP 1024-65535 depuis 0.0.0.0/0."
answer: { optionId: c }
explanation:
  correct:
    en: "Network ACLs are stateless, so the responses to the outbound HTTPS requests must be allowed explicitly. The responses come from the internet servers' addresses on port 443 to the instances' ephemeral ports, so an inbound rule for TCP 1024-65535 from 0.0.0.0/0 is required; the default deny rule currently drops them."
    fr: "Les ACL réseau sont sans état : les réponses aux requêtes HTTPS sortantes doivent être autorisées explicitement. Les réponses proviennent des adresses des serveurs Internet, depuis le port 443, vers les ports éphémères des instances : une règle entrante TCP 1024-65535 depuis 0.0.0.0/0 est nécessaire ; la règle de refus par défaut les abandonne actuellement."
  options:
    a:
      en: "The requests already leave on port 443; the missing traffic is the inbound response to the ephemeral ports."
      fr: "Les requêtes sortent déjà sur le port 443 ; le trafic manquant est la réponse entrante vers les ports éphémères."
    b:
      en: "Return traffic arrives on the client's ephemeral port, not on port 443, so this rule does not match it."
      fr: "Le trafic de retour arrive sur le port éphémère du client, et non sur le port 443 : cette règle ne lui correspond pas."
    d:
      en: "Security groups are stateful and already allow the responses to outbound connections; the network ACL is what drops them."
      fr: "Les groupes de sécurité sont avec état et autorisent déjà les réponses aux connexions sortantes ; c'est l'ACL réseau qui les abandonne."
references:
  - title: "Control subnet traffic with network access control lists - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nacl-basics.html
