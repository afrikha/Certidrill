id: scsc03-3a-credential-stuffing-atp
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel booking company serves its website and its /api/login endpoint through an Amazon CloudFront distribution that has an AWS WAF web ACL. Threat intelligence warns of credential stuffing campaigns that replay leaked user name and password lists from thousands of IP addresses, each sending only a few login attempts. The security team wants a managed protection that checks login attempts against known stolen credentials and blocks clients that accumulate failed logins, without writing custom detection logic.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de réservation de voyages sert son site web et son point de terminaison /api/login par une distribution Amazon CloudFront dotée d'une liste ACL web AWS WAF. Le renseignement sur les menaces signale des campagnes de bourrage d'identifiants (credential stuffing) qui rejouent des listes de noms d'utilisateur et de mots de passe divulgués depuis des milliers d'adresses IP, chacune n'envoyant que quelques tentatives de connexion. L'équipe de sécurité veut une protection gérée qui compare les tentatives de connexion aux identifiants volés connus et bloque les clients qui accumulent les échecs de connexion, sans écrire de logique de détection personnalisée.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a rate-based rule with a scope-down statement for the /api/login path that blocks any IP address that sends more than 10 requests in 5 minutes.
        fr: |-
          Ajouter une règle basée sur le débit avec une instruction de réduction de portée (scope-down) pour le chemin /api/login, qui bloque toute adresse IP envoyant plus de 10 requêtes en 5 minutes.
    - id: b
      text:
        en: |-
          Add the account takeover prevention (ATP) managed rule group, AWSManagedRulesATPRuleSet, configured with the login path and the user name and password fields.
        fr: |-
          Ajouter le groupe de règles géré de prévention des prises de contrôle de compte (ATP), AWSManagedRulesATPRuleSet, configuré avec le chemin de connexion et les champs du nom d'utilisateur et du mot de passe.
    - id: c
      text:
        en: |-
          Add the core rule set managed rule group, AWSManagedRulesCommonRuleSet, with a scope-down statement for the /api/login path.
        fr: |-
          Ajouter le groupe de règles géré du jeu de règles de base, AWSManagedRulesCommonRuleSet, avec une instruction de réduction de portée pour le chemin /api/login.
    - id: d
      text:
        en: |-
          Add the account creation fraud prevention (ACFP) managed rule group, AWSManagedRulesACFPRuleSet, configured with the registration page and the account creation path.
        fr: |-
          Ajouter le groupe de règles géré de prévention des fraudes à la création de compte (ACFP), AWSManagedRulesACFPRuleSet, configuré avec la page d'inscription et le chemin de création de compte.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The ATP rule group inspects login attempts sent to the configured login endpoint and checks the credentials against a stolen credential database that AWS updates regularly. For CloudFront distributions it also inspects the login responses, so it can block IP addresses and client sessions that accumulate failed logins.
    fr: |-
      Le groupe de règles ATP inspecte les tentatives de connexion envoyées au point de terminaison de connexion configuré et compare les identifiants à une base d'identifiants volés qu'AWS met à jour régulièrement. Pour les distributions CloudFront, il inspecte aussi les réponses de connexion ; il peut donc bloquer les adresses IP et les sessions clientes qui accumulent les échecs de connexion.
  options:
    a:
      en: |-
        Each attacking address sends only a few attempts, so a per-IP rate limit does not trigger, and it never checks for stolen credentials.
      fr: |-
        Chaque adresse attaquante n'envoie que quelques tentatives ; une limite de débit par adresse IP ne se déclenche donc pas, et elle ne vérifie jamais les identifiants volés.
    c:
      en: |-
        The core rule set blocks generic exploit patterns such as XSS and path traversal; replaying valid-looking credentials matches none of them.
      fr: |-
        Le jeu de règles de base bloque des motifs d'exploitation génériques comme le XSS et la traversée de répertoires ; rejouer des identifiants d'apparence valide ne correspond à aucun d'eux.
    d:
      en: |-
        The ACFP rule group protects the account sign-up page against fake account creation, not the login endpoint against stolen credentials.
      fr: |-
        Le groupe de règles ACFP protège la page d'inscription contre la création de faux comptes, et non le point de terminaison de connexion contre des identifiants volés.
references:
  - title: AWS WAF Fraud Control account takeover prevention (ATP) rule group - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/aws-managed-rule-groups-atp.html
