id: scsc03-3c-inspector-reachability
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany wants to be informed automatically about EC2 instances that have TCP or UDP ports reachable from an internet gateway, from a VPC peering connection, or from a VPN through a virtual private gateway. The findings must be refreshed regularly without any action from the security team, which does not want to write analysis definitions or start analyses.

    Which solution will meet these requirements?
  fr: |
    AnyCompany veut être informée automatiquement des instances EC2 dont des ports TCP ou UDP sont accessibles depuis une passerelle Internet, depuis une connexion d'appairage de VPC (VPC peering) ou depuis un VPN par une passerelle réseau privé virtuel. Les résultats doivent être actualisés régulièrement sans aucune action de l'équipe de sécurité, qui ne veut ni écrire de définitions d'analyse ni lancer d'analyses.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Activate Amazon Inspector EC2 scanning, and use its network reachability findings.
        fr: |-
          Activer l'analyse EC2 d'Amazon Inspector, et utiliser ses résultats d'accessibilité réseau.
    - id: b
      text:
        en: |-
          Enable Amazon GuardDuty, and use its findings about port probes to EC2 instances.
        fr: |-
          Activer Amazon GuardDuty, et utiliser ses résultats sur les sondages de ports vers les instances EC2.
    - id: c
      text:
        en: |-
          Create a Network Access Analyzer scope for each type of VPC edge, and review its findings.
        fr: |-
          Créer une étendue Network Access Analyzer pour chaque type de périphérie de VPC, et examiner ses résultats.
    - id: d
      text:
        en: |-
          Enable Amazon Macie, and use its findings about EC2 instances that expose data publicly.
        fr: |-
          Activer Amazon Macie, et utiliser ses résultats sur les instances EC2 qui exposent des données publiquement.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon Inspector network reachability findings report TCP and UDP ports of EC2 instances that are reachable from VPC edges such as an internet gateway, a VPC peering connection or a VPN through a virtual private gateway. Inspector runs these scans automatically every 12 hours once it is enabled, so no analysis has to be defined or started.
    fr: |-
      Les résultats d'accessibilité réseau d'Amazon Inspector signalent les ports TCP et UDP des instances EC2 accessibles depuis les périphéries du VPC, comme une passerelle Internet, une connexion d'appairage de VPC ou un VPN par une passerelle réseau privé virtuel. Inspector exécute ces analyses automatiquement toutes les 12 heures une fois activé : aucune analyse n'a donc à être définie ni lancée.
  options:
    b:
      en: |-
        GuardDuty detects threats from activity such as port probes that actually happened; it does not evaluate which ports the network configuration leaves reachable.
      fr: |-
        GuardDuty détecte des menaces à partir d'activités qui ont réellement eu lieu, comme des sondages de ports ; il n'évalue pas quels ports la configuration réseau laisse accessibles.
    c:
      en: |-
        Network Access Analyzer needs scopes and analyses that the team defines and starts, which the team does not want to do.
      fr: |-
        Network Access Analyzer nécessite des étendues et des analyses que l'équipe définit et lance, ce que l'équipe ne veut pas faire.
    d:
      en: |-
        Macie discovers sensitive data and evaluates the security of Amazon S3 buckets; it does not analyze network reachability of EC2 instances.
      fr: |-
        Macie découvre des données sensibles et évalue la sécurité des compartiments Amazon S3 ; il n'analyse pas l'accessibilité réseau des instances EC2.
references:
  - title: Amazon Inspector finding types - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/findings-types.html
