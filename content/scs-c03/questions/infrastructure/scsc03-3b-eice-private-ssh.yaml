id: scsc03-3b-eice-private-ssh
objective: "3.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a vendor appliance on Amazon EC2 Linux instances in private subnets. The vendor forbids installing any agent on the appliance, and administrators must use their own SSH clients. The instances must not have public IP addresses, and the company does not want to run bastion hosts. Administrators must be able to connect only from the corporate public IP range 203.0.113.0/24 over the internet, and only to TCP port 22 of the appliance instances.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    AnyCompany exécute une appliance d'un éditeur sur des instances Amazon EC2 Linux dans des sous-réseaux privés. L'éditeur interdit d'installer un agent sur l'appliance, et les administrateurs doivent utiliser leurs propres clients SSH. Les instances ne doivent pas avoir d'adresse IP publique, et l'entreprise ne veut pas exploiter d'hôtes bastions. Les administrateurs doivent pouvoir se connecter uniquement depuis la plage IP publique de l'entreprise 203.0.113.0/24 via Internet, et uniquement sur le port TCP 22 des instances de l'appliance.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create an EC2 Instance Connect Endpoint in a private subnet, allow outbound TCP 22 from its security group to the appliance security group, and allow inbound TCP 22 on the appliance security group from the endpoint security group."
        fr: "Créer un point de terminaison EC2 Instance Connect (EC2 Instance Connect Endpoint) dans un sous-réseau privé, autoriser le TCP 22 sortant de son groupe de sécurité vers le groupe de sécurité de l'appliance, et autoriser le TCP 22 entrant sur le groupe de sécurité de l'appliance depuis le groupe de sécurité du point de terminaison."
    - id: b
      text:
        en: "Add an inbound rule to the security group of the EC2 Instance Connect Endpoint that allows TCP 22 from 203.0.113.0/24 only."
        fr: "Ajouter au groupe de sécurité du point de terminaison EC2 Instance Connect une règle entrante qui autorise le TCP 22 depuis 203.0.113.0/24 uniquement."
    - id: c
      text:
        en: "Grant the administrators ec2-instance-connect:OpenTunnel on the endpoint with an aws:SourceIp condition for 203.0.113.0/24 and an ec2-instance-connect:remotePort condition for 22."
        fr: "Accorder aux administrateurs ec2-instance-connect:OpenTunnel sur le point de terminaison avec une condition aws:SourceIp pour 203.0.113.0/24 et une condition ec2-instance-connect:remotePort pour 22."
    - id: d
      text:
        en: "Create interface VPC endpoints for ssm and ssmmessages in the private subnets, and grant the administrators ssm:StartSession with the AWS-StartSSHSession document."
        fr: "Créer des points de terminaison de VPC d'interface pour ssm et ssmmessages dans les sous-réseaux privés, et accorder aux administrateurs ssm:StartSession avec le document AWS-StartSSHSession."
    - id: e
      text:
        en: "Assign Elastic IP addresses to the instances, and allow inbound TCP 22 from 203.0.113.0/24 so that administrators can use EC2 Instance Connect."
        fr: "Attribuer des adresses IP Elastic aux instances, et autoriser le TCP 22 entrant depuis 203.0.113.0/24 afin que les administrateurs puissent utiliser EC2 Instance Connect."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "An EC2 Instance Connect Endpoint gives private connectivity to instances without public IP addresses, agents or bastions; the endpoint security group needs outbound SSH to the targets, and the instance security group allows SSH from the endpoint security group. Who can connect, from where and to which port is controlled in IAM on ec2-instance-connect:OpenTunnel with aws:SourceIp and ec2-instance-connect:remotePort."
    fr: "Un point de terminaison EC2 Instance Connect fournit une connectivité privée vers des instances sans adresse IP publique, sans agent ni bastion ; le groupe de sécurité du point de terminaison a besoin du SSH sortant vers les cibles, et le groupe de sécurité de l'instance autorise le SSH depuis le groupe de sécurité du point de terminaison. Qui peut se connecter, depuis où et vers quel port se contrôle dans IAM sur ec2-instance-connect:OpenTunnel avec aws:SourceIp et ec2-instance-connect:remotePort."
  options:
    b:
      en: "Inbound rules of the endpoint security group do not affect connections through the endpoint; access must be restricted with an IAM policy."
      fr: "Les règles entrantes du groupe de sécurité du point de terminaison n'ont pas d'effet sur les connexions via le point de terminaison ; l'accès doit être restreint par une politique IAM."
    d:
      en: "Session Manager requires the SSM Agent on the instances, which the vendor forbids."
      fr: "Session Manager nécessite l'agent SSM sur les instances, ce que l'éditeur interdit."
    e:
      en: "Elastic IP addresses are public IP addresses, which the instances must not have."
      fr: "Les adresses IP Elastic sont des adresses IP publiques, que les instances ne doivent pas avoir."
references:
  - title: "Security groups for EC2 Instance Connect Endpoint - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/eice-security-groups.html
  - title: "Grant permissions to use EC2 Instance Connect Endpoint - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/permissions-for-ec2-instance-connect-endpoint.html
