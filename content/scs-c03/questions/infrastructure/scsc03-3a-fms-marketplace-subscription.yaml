id: scsc03-3a-fms-marketplace-subscription
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses AWS Firewall Manager across 40 accounts in AWS Organizations. AWS Config is enabled in every account and Region. The Firewall Manager administrator creates an AWS WAF policy whose first rule group is a third-party managed rule group from an AWS Marketplace seller, which the administrator account has subscribed to. The policy uses automatic remediation for Application Load Balancers. In 12 accounts, the policy reports the load balancers as noncompliant and no web ACL is created, while the other 28 accounts are protected.

    What should the security team do to resolve the issue?
  fr: |
    AnyCompany utilise AWS Firewall Manager sur 40 comptes d'AWS Organizations. AWS Config est activé dans chaque compte et chaque Région. L'administrateur Firewall Manager crée une politique AWS WAF dont le premier groupe de règles est un groupe de règles géré tiers d'un vendeur AWS Marketplace, auquel le compte administrateur est abonné. La politique utilise la correction automatique pour les Application Load Balancers. Dans 12 comptes, la politique signale les équilibreurs de charge comme non conformes et aucune liste ACL web n'est créée, alors que les 28 autres comptes sont protégés.

    Que doit faire l'équipe de sécurité pour résoudre le problème ?
body:
  options:
    - id: a
      text:
        en: |-
          Move the third-party rule group from the first rule groups to the last rule groups of the Firewall Manager policy.
        fr: |-
          Déplacer le groupe de règles tiers des groupes de règles de début vers les groupes de règles de fin de la politique Firewall Manager.
    - id: b
      text:
        en: |-
          Subscribe each of the 12 accounts to the seller's managed rule group in AWS Marketplace.
        fr: |-
          Abonner chacun des 12 comptes au groupe de règles géré du vendeur dans AWS Marketplace.
    - id: c
      text:
        en: |-
          Attach the AWSWAFFullAccess managed policy to the Firewall Manager service-linked role in the administrator account.
        fr: |-
          Attacher la politique gérée AWSWAFFullAccess au rôle lié au service de Firewall Manager dans le compte administrateur.
    - id: d
      text:
        en: |-
          Re-create the policy in the 12 accounts as an AWS WAF Classic policy that contains the seller's rule group.
        fr: |-
          Recréer la politique dans les 12 comptes sous la forme d'une politique AWS WAF Classic qui contient le groupe de règles du vendeur.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Marketplace rule groups are subscription products, and for Firewall Manager policies each account in the organization must subscribe to the rule group before the policy can use it there. The 28 protected accounts are subscribed; once the 12 remaining accounts subscribe, automatic remediation creates and associates their web ACLs.
    fr: |-
      Les groupes de règles AWS Marketplace sont des produits par abonnement, et pour les politiques Firewall Manager, chaque compte de l'organisation doit s'abonner au groupe de règles avant que la politique puisse l'y utiliser. Les 28 comptes protégés sont abonnés ; dès que les 12 comptes restants s'abonnent, la correction automatique crée et associe leurs listes ACL web.
  options:
    a:
      en: |-
        The position of the rule group in the web ACL does not change the subscription requirement in the accounts that are missing it.
      fr: |-
        La position du groupe de règles dans la liste ACL web ne change pas l'exigence d'abonnement dans les comptes qui ne l'ont pas.
    c:
      en: |-
        The policy already works in 28 accounts, so the administrator's permissions are not the cause; the missing piece is the per-account subscription.
      fr: |-
        La politique fonctionne déjà dans 28 comptes ; les autorisations de l'administrateur ne sont donc pas en cause, ce qui manque est l'abonnement par compte.
    d:
      en: |-
        AWS WAF Classic is the legacy version, a Firewall Manager policy is created in the administrator account, and the subscription would still be missing.
      fr: |-
        AWS WAF Classic est la version héritée, une politique Firewall Manager se crée dans le compte administrateur, et l'abonnement manquerait toujours.
references:
  - title: AWS Marketplace managed rule groups - AWS WAF, AWS Firewall Manager, and AWS Shield Advanced
    url: https://docs.aws.amazon.com/waf/latest/developerguide/marketplace-managed-rule-groups.html
