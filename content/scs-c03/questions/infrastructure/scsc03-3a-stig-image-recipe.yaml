id: scsc03-3a-stig-image-recipe
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A government contractor builds its golden Amazon Linux 2023 AMI with EC2 Image Builder. A new contract requires every AMI to apply all DISA STIG settings of categories I, II, and III before any instance is launched from it, and each build must produce a compliance report and score. The company wants to use AWS-provided components and the LEAST custom work.

    Which solution will meet these requirements?
  fr: |
    Un sous-traitant gouvernemental construit son AMI de référence Amazon Linux 2023 avec EC2 Image Builder. Un nouveau contrat exige que chaque AMI applique tous les paramètres DISA STIG des catégories I, II et III avant le lancement de toute instance à partir de celle-ci, et que chaque build produise un rapport et un score de conformité. L'entreprise veut utiliser des composants fournis par AWS et le MOINS de travail personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the Amazon managed STIG-Build-Linux-Low component to the image recipe, and run the scap-compliance-checker-linux component as the final build step.
        fr: |-
          Ajouter le composant géré par Amazon STIG-Build-Linux-Low à la recette d'image, et exécuter le composant scap-compliance-checker-linux comme dernière étape du build.
    - id: b
      text:
        en: |-
          Create an AWS Systems Manager State Manager association that runs STIG hardening scripts on each instance after launch, and report compliance in Systems Manager.
        fr: |-
          Créer une association AWS Systems Manager State Manager qui exécute des scripts de renforcement STIG sur chaque instance après son lancement, et signaler la conformité dans Systems Manager.
    - id: c
      text:
        en: |-
          Add the Amazon managed STIG-Build-Linux-High component to the image recipe, and run the scap-compliance-checker-linux component as the final build step.
        fr: |-
          Ajouter le composant géré par Amazon STIG-Build-Linux-High à la recette d'image, et exécuter le composant scap-compliance-checker-linux comme dernière étape du build.
    - id: d
      text:
        en: |-
          Enable Amazon Inspector CIS scans for the instances launched from the AMI, and remediate the failed checks in the next image version.
        fr: |-
          Activer les analyses CIS d'Amazon Inspector pour les instances lancées à partir de l'AMI, et corriger les contrôles en échec dans la version d'image suivante.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Amazon managed STIG hardening components apply STIG settings during the build; the High level covers category I and also includes all medium and low settings, which are categories II and III. The SCAP compliance checker component, run as the final build step, produces the compliance report and score for each image. STIG components have no additional charge.
    fr: |-
      Les composants de renforcement STIG gérés par Amazon appliquent les paramètres STIG pendant le build ; le niveau High couvre la catégorie I et inclut aussi tous les paramètres des niveaux Medium et Low, c'est-à-dire les catégories II et III. Le composant SCAP compliance checker, exécuté comme dernière étape du build, produit le rapport et le score de conformité de chaque image. Les composants STIG n'entraînent aucun coût supplémentaire.
  options:
    a:
      en: |-
        The Low level applies only category III settings, so categories I and II would be missing.
      fr: |-
        Le niveau Low n'applique que les paramètres de catégorie III ; les catégories I et II manqueraient donc.
    b:
      en: |-
        Hardening after launch leaves each instance unhardened until the association runs and does not make the AMI itself compliant.
      fr: |-
        Un renforcement après le lancement laisse chaque instance non renforcée jusqu'à l'exécution de l'association et ne rend pas l'AMI elle-même conforme.
    d:
      en: |-
        CIS scans assess instances against CIS benchmarks after launch; they do not apply DISA STIG settings to the AMI.
      fr: |-
        Les analyses CIS évaluent les instances par rapport aux benchmarks CIS après leur lancement ; elles n'appliquent pas les paramètres DISA STIG à l'AMI.
references:
  - title: Amazon managed STIG hardening components for Image Builder - EC2 Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/ib-stig.html
