id: scsc03-3c-vpc-bpa-ingress-exclusion
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 40 VPCs in one AWS account in the eu-west-1 Region. Workloads in private subnets reach the internet through NAT gateways. Only the public subnets of one VPC, named web-vpc, host internet-facing load balancers. The security team wants an account-level control in the Region that blocks inbound internet traffic to all other VPCs, including VPCs created later, while outbound access through NAT gateways keeps working in every VPC.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 40 VPC dans un compte AWS de la Région eu-west-1. Les charges de travail des sous-réseaux privés accèdent à Internet par des passerelles NAT. Seuls les sous-réseaux publics d'un VPC nommé web-vpc hébergent des équilibreurs de charge accessibles depuis Internet. L'équipe de sécurité veut un contrôle au niveau du compte dans la Région qui bloque le trafic Internet entrant vers tous les autres VPC, y compris les VPC créés plus tard, tandis que l'accès sortant par les passerelles NAT continue de fonctionner dans chaque VPC.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on VPC Block Public Access in bidirectional mode, and create an allow-egress exclusion for web-vpc.
        fr: |-
          Activer VPC Block Public Access en mode bidirectionnel, et créer une exclusion allow-egress pour web-vpc.
    - id: b
      text:
        en: |-
          Turn on VPC Block Public Access in ingress-only mode, and create allow-bidirectional exclusions for the public subnets of web-vpc.
        fr: |-
          Activer VPC Block Public Access en mode entrée uniquement (ingress-only), et créer des exclusions allow-bidirectional pour les sous-réseaux publics de web-vpc.
    - id: c
      text:
        en: |-
          Turn on VPC Block Public Access in ingress-only mode, and create allow-egress exclusions for the public subnets of web-vpc.
        fr: |-
          Activer VPC Block Public Access en mode entrée uniquement (ingress-only), et créer des exclusions allow-egress pour les sous-réseaux publics de web-vpc.
    - id: d
      text:
        en: |-
          Create an AWS Config rule that detects routes to internet gateways in every VPC except web-vpc, and remediate them with a Systems Manager Automation runbook.
        fr: |-
          Créer une règle AWS Config qui détecte les routes vers des passerelles Internet dans chaque VPC sauf web-vpc, et les corriger avec un runbook Systems Manager Automation.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      VPC Block Public Access is set per account and Region and applies to every VPC, including new ones. Ingress-only mode blocks internet traffic into the VPCs but still allows traffic through NAT gateways and egress-only internet gateways, and an allow-bidirectional exclusion keeps all internet traffic to and from the excluded subnets.
    fr: |-
      VPC Block Public Access se définit par compte et par Région et s'applique à chaque VPC, y compris aux nouveaux. Le mode entrée uniquement bloque le trafic Internet vers les VPC mais autorise toujours le trafic par les passerelles NAT et les passerelles Internet de sortie uniquement, et une exclusion allow-bidirectional conserve tout le trafic Internet vers et depuis les sous-réseaux exclus.
  options:
    a:
      en: |-
        Bidirectional mode also blocks outbound traffic through the NAT gateways of the other VPCs, and an allow-egress exclusion still blocks inbound traffic to the load balancers of web-vpc.
      fr: |-
        Le mode bidirectionnel bloque aussi le trafic sortant par les passerelles NAT des autres VPC, et une exclusion allow-egress bloque toujours le trafic entrant vers les équilibreurs de charge de web-vpc.
    c:
      en: |-
        An allow-egress exclusion applies only when the account uses bidirectional mode and does not allow inbound traffic, so the load balancers of web-vpc would be unreachable.
      fr: |-
        Une exclusion allow-egress ne s'applique que lorsque le compte utilise le mode bidirectionnel et n'autorise pas le trafic entrant : les équilibreurs de charge de web-vpc seraient donc injoignables.
    d:
      en: |-
        NAT gateways need a route to an internet gateway, so removing these routes breaks outbound access, and a detect-and-remediate rule acts only after the exposure exists.
      fr: |-
        Les passerelles NAT ont besoin d'une route vers une passerelle Internet : supprimer ces routes casse l'accès sortant, et une règle de détection et de correction n'agit qu'une fois l'exposition apparue.
references:
  - title: Block public access to VPCs and subnets - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-vpc-bpa.html
  - title: VPC BPA basics - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-vpc-bpa-basics.html
