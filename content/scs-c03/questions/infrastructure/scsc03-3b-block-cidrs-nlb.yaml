id: scsc03-3b-block-cidrs-nlb
objective: "3.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany exposes a TCP 443 service through an internet-facing Network Load Balancer (NLB) in public subnets; TLS terminates on Amazon EC2 instances in private subnets. Internet ingress traffic to the VPC is already routed through AWS Network Firewall endpoints by an internet gateway route table. The security team must block six specific CIDR ranges from reaching the service while all other internet clients keep access.

    Which solutions will meet these requirements? (Choose two.)

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany expose un service TCP 443 via un Network Load Balancer (NLB) accessible sur Internet dans des sous-réseaux publics ; le TLS se termine sur des instances Amazon EC2 dans des sous-réseaux privés. Le trafic Internet entrant dans le VPC passe déjà par des points de terminaison AWS Network Firewall grâce à une table de routage de passerelle Internet. L'équipe de sécurité doit empêcher six plages CIDR précises d'atteindre le service, tandis que tous les autres clients Internet conservent l'accès.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Add a rule group to the firewall policy that drops traffic from the six CIDR ranges."
        fr: "Ajouter à la politique de pare-feu un groupe de règles qui abandonne le trafic provenant des six plages CIDR."
    - id: b
      text:
        en: "Add deny rules for the six CIDR ranges to the security group of the NLB."
        fr: "Ajouter des règles de refus pour les six plages CIDR au groupe de sécurité du NLB."
    - id: c
      text:
        en: "Associate with the NLB an AWS WAF web ACL that has an IP set rule that blocks the six CIDR ranges."
        fr: "Associer au NLB une ACL web AWS WAF dotée d'une règle de jeu d'adresses IP qui bloque les six plages CIDR."
    - id: d
      text:
        en: "Add inbound deny rules for the six CIDR ranges to the network ACL of the NLB subnets, numbered lower than the rule that allows TCP 443."
        fr: "Ajouter des règles de refus entrantes pour les six plages CIDR à l'ACL réseau des sous-réseaux du NLB, avec des numéros inférieurs à celui de la règle qui autorise TCP 443."
    - id: e
      text:
        en: "Create a Route 53 Resolver DNS Firewall rule group that blocks the six CIDR ranges, and associate it with the VPC."
        fr: "Créer un groupe de règles Route 53 Resolver DNS Firewall qui bloque les six plages CIDR, et l'associer au VPC."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Because ingress traffic already passes through the firewall endpoints, a rule group that drops the six source ranges stops them before they reach the NLB. Alternatively, a network ACL on the NLB subnets can deny the ranges, as long as the deny rules have lower numbers than the allow rule, because the first matching rule applies."
    fr: "Comme le trafic entrant passe déjà par les points de terminaison de pare-feu, un groupe de règles qui abandonne les six plages sources les arrête avant qu'elles n'atteignent le NLB. Une ACL réseau sur les sous-réseaux du NLB peut aussi refuser ces plages, à condition que les règles de refus aient des numéros inférieurs à celui de la règle d'autorisation, car la première règle correspondante s'applique."
  options:
    b:
      en: "Security groups support only allow rules, so they cannot deny specific ranges while allowing everyone else."
      fr: "Les groupes de sécurité ne prennent en charge que des règles d'autorisation : ils ne peuvent pas refuser des plages précises tout en autorisant tous les autres."
    c:
      en: "AWS WAF protects resources such as Application Load Balancers, API Gateway REST APIs and CloudFront; a Network Load Balancer is not a supported resource."
      fr: "AWS WAF protège des ressources comme les Application Load Balancer, les API REST API Gateway et CloudFront ; un Network Load Balancer n'est pas une ressource prise en charge."
    e:
      en: "DNS Firewall filters DNS queries that resources in the VPC send through Route 53 Resolver; it does not filter inbound connections by source address."
      fr: "DNS Firewall filtre les requêtes DNS que les ressources du VPC envoient via Route 53 Resolver ; il ne filtre pas les connexions entrantes par adresse source."
references:
  - title: "Control subnet traffic with network access control lists - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nacl-basics.html
  - title: "Resources that you can protect with AWS WAF"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works-resources.html
