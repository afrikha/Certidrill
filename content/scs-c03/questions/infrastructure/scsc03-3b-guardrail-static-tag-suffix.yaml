id: scsc03-3b-guardrail-static-tag-suffix
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's chatbot calls the Amazon Bedrock InvokeModel API with a guardrail. The developers wrap each user message in input tags, and they hardcoded the tag suffix user01 in the application. A penetration tester typed a message that closes the tag with the same suffix and then adds instructions that the guardrail did not evaluate. The security team must stop this bypass while the system instructions stay outside the evaluated content.

    Which solution will meet these requirements?
  fr: |
    Le chatbot d'AnyCompany appelle l'API Amazon Bedrock InvokeModel avec une barrière de protection (guardrail). Les développeurs encadrent chaque message utilisateur par des balises d'entrée, et ils ont codé en dur le suffixe de balise user01 dans l'application. Un testeur d'intrusion a saisi un message qui ferme la balise avec le même suffixe puis ajoute des instructions que la barrière de protection n'a pas évaluées. L'équipe de sécurité doit empêcher ce contournement tout en laissant les instructions système hors du contenu évalué.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Nest a second pair of input tags inside the first pair so that closing one tag leaves the message guarded."
        fr: "Imbriquer une seconde paire de balises d'entrée dans la première afin que fermer une balise laisse le message protégé."
    - id: b
      text:
        en: "Remove the input tags so that the guardrail evaluates the whole prompt, including the system instructions."
        fr: "Supprimer les balises d'entrée afin que la barrière de protection évalue le prompt entier, y compris les instructions système."
    - id: c
      text:
        en: "Add a word filter that blocks the string amazon-bedrock-guardrails-guardContent_user01 in user messages."
        fr: "Ajouter un filtre de mots qui bloque la chaîne amazon-bedrock-guardrails-guardContent_user01 dans les messages utilisateur."
    - id: d
      text:
        en: "Generate a new random alphanumeric tagSuffix for every request, and pass it in amazon-bedrock-guardrailConfig."
        fr: "Générer un nouveau tagSuffix alphanumérique aléatoire pour chaque requête, et le transmettre dans amazon-bedrock-guardrailConfig."
answer: { optionId: d }
explanation:
  correct:
    en: "The tag suffix must be a new random string of 1 to 20 alphanumeric characters for every request. A static suffix lets a malicious user close the tag early and append content outside the guarded region; a suffix that changes per request cannot be predicted."
    fr: "Le suffixe de balise doit être une nouvelle chaîne aléatoire de 1 à 20 caractères alphanumériques à chaque requête. Un suffixe statique permet à un utilisateur malveillant de fermer la balise plus tôt et d'ajouter du contenu hors de la zone protégée ; un suffixe qui change à chaque requête ne peut pas être deviné."
  options:
    a:
      en: "Nested input tags are not allowed."
      fr: "Les balises d'entrée imbriquées ne sont pas autorisées."
    b:
      en: "Without tags the system instructions are evaluated too, which the requirement forbids, and the prompt attack filter needs tags with InvokeModel."
      fr: "Sans balises, les instructions système sont aussi évaluées, ce que l'exigence interdit, et le filtre d'attaques par prompt a besoin de balises avec InvokeModel."
    c:
      en: "A word filter relies on exact matches inside the evaluated content, while the documented protection against this injection is a suffix that the user cannot predict."
      fr: "Un filtre de mots repose sur des correspondances exactes dans le contenu évalué, alors que la protection documentée contre cette injection est un suffixe que l'utilisateur ne peut pas deviner."
references:
  - title: "Apply tags to user input to filter content - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tagging.html
