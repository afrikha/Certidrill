id: scsc03-3c-macsec-cipher-mode
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has a 100 Gbps AWS Direct Connect dedicated connection that was created with MACsec enabled. The network team is preparing the MACsec configuration of the on-premises router and the encryption mode of the connection. The security policy states that the link must never carry unencrypted frames, even when the MACsec session cannot be established.

    Which configuration will meet these requirements?
  fr: |
    AnyCompany dispose d'une connexion dédiée AWS Direct Connect de 100 Gbit/s créée avec MACsec activé. L'équipe réseau prépare la configuration MACsec du routeur sur site et le mode de chiffrement de la connexion. La politique de sécurité indique que la liaison ne doit jamais transporter de trames non chiffrées, même lorsque la session MACsec ne peut pas être établie.

    Quelle configuration permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Configure the GCM-AES-256 cipher suite on the router, and set the encryption mode of the connection to must_encrypt."
        fr: "Configurer la suite de chiffrement GCM-AES-256 sur le routeur, et définir le mode de chiffrement de la connexion sur must_encrypt."
    - id: b
      text:
        en: "Configure the GCM-AES-XPN-256 cipher suite on the router, and set the encryption mode of the connection to must_encrypt."
        fr: "Configurer la suite de chiffrement GCM-AES-XPN-256 sur le routeur, et définir le mode de chiffrement de la connexion sur must_encrypt."
    - id: c
      text:
        en: "Configure the GCM-AES-XPN-256 cipher suite on the router, and set the encryption mode of the connection to should_encrypt."
        fr: "Configurer la suite de chiffrement GCM-AES-XPN-256 sur le routeur, et définir le mode de chiffrement de la connexion sur should_encrypt."
    - id: d
      text:
        en: "Configure the GCM-AES-128 cipher suite on the router, and set the encryption mode of the connection to must_encrypt."
        fr: "Configurer la suite de chiffrement GCM-AES-128 sur le routeur, et définir le mode de chiffrement de la connexion sur must_encrypt."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      On 100 Gbps and 400 Gbps connections, Direct Connect supports only the GCM-AES-XPN-256 cipher suite, because extended packet numbering is required at these speeds. The must_encrypt mode sends no traffic when MACsec cannot be established, which is the only mode that guarantees that no unencrypted frame crosses the link.
    fr: |-
      Sur les connexions de 100 Gbit/s et de 400 Gbit/s, Direct Connect ne prend en charge que la suite de chiffrement GCM-AES-XPN-256, car la numérotation étendue des paquets (XPN) est obligatoire à ces débits. Le mode must_encrypt n'envoie aucun trafic lorsque MACsec ne peut pas être établi : c'est le seul mode qui garantit qu'aucune trame non chiffrée ne traverse la liaison.
  options:
    a:
      en: |-
        GCM-AES-256 without XPN is supported only on 10 Gbps connections, so the MACsec session cannot be established on a 100 Gbps connection.
      fr: |-
        GCM-AES-256 sans XPN n'est pris en charge que sur les connexions de 10 Gbit/s ; la session MACsec ne peut donc pas être établie sur une connexion de 100 Gbit/s.
    c:
      en: |-
        should_encrypt, the default mode, falls back to unencrypted traffic when the MACsec negotiation fails, which the policy forbids.
      fr: |-
        should_encrypt, le mode par défaut, revient à un trafic non chiffré lorsque la négociation MACsec échoue, ce que la politique interdit.
    d:
      en: |-
        Direct Connect MACsec supports only 256-bit keys, so a 128-bit cipher suite cannot be used.
      fr: |-
        MACsec sur Direct Connect ne prend en charge que des clés de 256 bits ; une suite de chiffrement de 128 bits ne peut donc pas être utilisée.
references:
  - title: MAC Security in Direct Connect - AWS Direct Connect
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/MACsec.html
