id: scsc03-3c-fms-sg-audit
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 300 accounts in AWS Organizations and uses AWS Firewall Manager with a delegated administrator account. The security team must identify unnecessary network access in all accounts. Security groups that are not associated with any resource, or that duplicate other security groups, must be found and cleaned up. Security group rules that allow resources to communicate with public IP addresses must be flagged. The team wants a managed solution with the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany compte 300 comptes dans AWS Organizations et utilise AWS Firewall Manager avec un compte administrateur délégué. L'équipe de sécurité doit identifier les accès réseau inutiles dans tous les comptes. Les groupes de sécurité qui ne sont associés à aucune ressource, ou qui font double emploi avec d'autres groupes de sécurité, doivent être trouvés et nettoyés. Les règles de groupe de sécurité qui permettent à des ressources de communiquer avec des adresses IP publiques doivent être signalées. L'équipe veut une solution gérée avec le MOINS de charge opérationnelle.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Run Network Access Analyzer with the All-IGW-Ingress scope in each account, and delete the security groups that do not appear in any finding."
        fr: "Exécuter Network Access Analyzer avec l'étendue All-IGW-Ingress dans chaque compte, et supprimer les groupes de sécurité qui n'apparaissent dans aucun résultat."
    - id: b
      text:
        en: "Create a Firewall Manager usage audit security group policy that finds unused and redundant security groups, and turn on automatic remediation after reviewing its findings."
        fr: "Créer une politique de groupe de sécurité Firewall Manager d'audit d'utilisation qui trouve les groupes de sécurité inutilisés et redondants, et activer la correction automatique après avoir examiné ses résultats."
    - id: c
      text:
        en: "Create an IAM Access Analyzer unused access analyzer for the organization to find security groups that have not carried traffic for 90 days."
        fr: "Créer un analyseur d'accès inutilisés IAM Access Analyzer pour l'organisation afin de trouver les groupes de sécurité qui n'ont transporté aucun trafic depuis 90 jours."
    - id: d
      text:
        en: "Create a Firewall Manager common security group policy that associates a baseline security group with every in-scope resource in place of its current groups."
        fr: "Créer une politique de groupe de sécurité Firewall Manager commune qui associe un groupe de sécurité de référence à chaque ressource concernée à la place de ses groupes actuels."
    - id: e
      text:
        en: "Create a Firewall Manager content audit security group policy whose rules flag security group rules that allow communication with public IP addresses."
        fr: "Créer une politique de groupe de sécurité Firewall Manager d'audit de contenu dont les règles signalent les règles de groupe de sécurité qui autorisent la communication avec des adresses IP publiques."
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      Firewall Manager security group policies apply across the accounts of the organization. A usage audit policy finds unused and redundant security groups and can remediate them automatically, and a content audit policy audits security group rules to locate noncompliant ones, such as rules that let resources communicate with public IP addresses. AWS recommends starting with automatic remediation turned off and reviewing the findings first.
    fr: |-
      Les politiques de groupe de sécurité de Firewall Manager s'appliquent à l'ensemble des comptes de l'organisation. Une politique d'audit d'utilisation trouve les groupes de sécurité inutilisés et redondants et peut les corriger automatiquement, et une politique d'audit de contenu audite les règles de groupe de sécurité pour localiser celles qui ne sont pas conformes, comme les règles qui permettent à des ressources de communiquer avec des adresses IP publiques. AWS recommande de commencer avec la correction automatique désactivée et d'examiner d'abord les résultats.
  options:
    a:
      en: "Network Access Analyzer runs per account and Region and reports network paths; a security group that is absent from internet ingress findings is not necessarily unused."
      fr: "Network Access Analyzer s'exécute par compte et par Région et signale des chemins réseau ; un groupe de sécurité absent des résultats d'entrée Internet n'est pas forcément inutilisé."
    c:
      en: "IAM Access Analyzer unused access analyzers report unused IAM roles, users, access keys and permissions, not security groups."
      fr: "Les analyseurs d'accès inutilisés d'IAM Access Analyzer signalent les rôles IAM, utilisateurs, clés d'accès et autorisations inutilisés, pas les groupes de sécurité."
    d:
      en: "A common security group policy applies a set of rules to resources; it does not find unused or redundant groups, and replacing every group could break applications."
      fr: "Une politique de groupe de sécurité commune applique un ensemble de règles aux ressources ; elle ne trouve pas les groupes inutilisés ou redondants, et remplacer chaque groupe pourrait casser des applications."
references:
  - title: Using security group policies in Firewall Manager to manage Amazon VPC security groups - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/security-group-policies.html
