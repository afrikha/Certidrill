id: scsc03-3b-nf-stateless-default
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany deployed AWS Network Firewall in the inspection path of a VPC. The firewall policy has no stateless rule groups and two stateful rule groups: one drops traffic to known malicious domains, and one drops outbound SMB traffic. The stateless default actions for full packets and for fragmented packets are both set to Pass. Test connections to a malicious domain succeed, and the alert logs contain no entries for the stateful rule groups. Routing through the firewall endpoints is correct.

    Which change will make the firewall enforce the stateful rules?
  fr: |
    AnyCompany a déployé AWS Network Firewall sur le chemin d'inspection d'un VPC. La politique de pare-feu n'a aucun groupe de règles sans état et deux groupes de règles avec état : l'un abandonne le trafic vers des domaines malveillants connus, l'autre abandonne le trafic SMB sortant. Les actions sans état par défaut pour les paquets complets et pour les paquets fragmentés sont toutes deux définies sur Pass. Les connexions de test vers un domaine malveillant réussissent, et les journaux d'alertes ne contiennent aucune entrée pour les groupes de règles avec état. Le routage par les points de terminaison de pare-feu est correct.

    Quelle modification fait appliquer les règles avec état par le pare-feu ?
body:
  options:
    - id: a
      text:
        en: "Change the stateful rule evaluation order of the firewall policy to strict order."
        fr: "Passer l'ordre d'évaluation des règles avec état de la politique de pare-feu à l'ordre strict."
    - id: b
      text:
        en: "Add an alert logging destination in Amazon CloudWatch Logs so that the stateful engine starts evaluating the rules."
        fr: "Ajouter une destination de journalisation des alertes dans Amazon CloudWatch Logs afin que le moteur avec état commence à évaluer les règles."
    - id: c
      text:
        en: "Change both stateless default actions to forward the packets to the stateful rule groups."
        fr: "Modifier les deux actions sans état par défaut pour transférer les paquets aux groupes de règles avec état."
    - id: d
      text:
        en: "Move the firewall endpoints into the workload subnets so that traffic is inspected closer to the instances."
        fr: "Déplacer les points de terminaison de pare-feu dans les sous-réseaux de charges de travail afin d'inspecter le trafic plus près des instances."
answer: { optionId: c }
explanation:
  correct:
    en: "Network Firewall evaluates the stateless engine first. A packet that matches no stateless rule gets the stateless default action, and Pass sends it on without stateful inspection, so the stateful rule groups never see the traffic. Forwarding to the stateful rule groups for full and fragmented packets makes the stateful rules apply."
    fr: "Network Firewall évalue d'abord le moteur sans état. Un paquet qui ne correspond à aucune règle sans état reçoit l'action sans état par défaut, et Pass le laisse passer sans inspection avec état : les groupes de règles avec état ne voient jamais le trafic. Le transfert vers les groupes de règles avec état pour les paquets complets et fragmentés fait appliquer les règles avec état."
  options:
    a:
      en: "The evaluation order matters only for packets that reach the stateful engine, and these packets never reach it."
      fr: "L'ordre d'évaluation ne compte que pour les paquets qui atteignent le moteur avec état, et ces paquets ne l'atteignent jamais."
    b:
      en: "Logging records what the engines do; it does not change which packets are inspected."
      fr: "La journalisation enregistre ce que font les moteurs ; elle ne change pas les paquets inspectés."
    d:
      en: "Firewall endpoints belong in dedicated firewall subnets, and the location of the endpoints does not change the default action that skips stateful inspection."
      fr: "Les points de terminaison de pare-feu se placent dans des sous-réseaux de pare-feu dédiés, et leur emplacement ne change pas l'action par défaut qui contourne l'inspection avec état."
references:
  - title: "Firewall policy settings in AWS Network Firewall - AWS Network Firewall"
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/stateless-default-actions.html
