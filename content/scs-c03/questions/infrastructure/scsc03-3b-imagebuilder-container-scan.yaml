id: scsc03-3b-imagebuilder-container-scan
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses an EC2 Image Builder container recipe to build hardened base images. The security team enables image scanning in the pipeline and sets repositoryName to base-images, an Amazon ECR repository in the same account and Region. The registry uses basic scanning with scan on push for all repositories. The CreateImagePipeline request fails with a ResourceDependencyException. The security team wants Image Builder to save vulnerability findings with each image.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise une recette de conteneur EC2 Image Builder pour construire des images de base renforcées. L'équipe de sécurité active l'analyse des images dans le pipeline et définit repositoryName sur base-images, un référentiel Amazon ECR du même compte et de la même Région. Le registre utilise l'analyse de base avec l'analyse à l'envoi pour tous les référentiels. La requête CreateImagePipeline échoue avec une exception ResourceDependencyException. L'équipe de sécurité veut qu'Image Builder enregistre les résultats de vulnérabilité avec chaque image.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Change the scan frequency of the base-images repository to MANUAL so that Image Builder controls when the images are scanned."
        fr: "Passer la fréquence d'analyse du référentiel base-images à MANUAL afin qu'Image Builder contrôle le moment de l'analyse des images."
    - id: b
      text:
        en: "Remove repositoryName so that Image Builder creates and uses the image-builder-image-scanning-repository repository with basic scanning."
        fr: "Supprimer repositoryName afin qu'Image Builder crée et utilise le référentiel image-builder-image-scanning-repository avec l'analyse de base."
    - id: c
      text:
        en: "Activate Amazon Inspector scanning for Amazon ECR in the account and Region, and create the pipeline again."
        fr: "Activer l'analyse Amazon Inspector pour Amazon ECR dans le compte et la Région, puis créer de nouveau le pipeline."
    - id: d
      text:
        en: "Attach the AmazonInspector2ReadOnlyAccess managed policy to the instance profile of the Image Builder infrastructure configuration."
        fr: "Attacher la politique gérée AmazonInspector2ReadOnlyAccess au profil d'instance de la configuration d'infrastructure Image Builder."
answer: { optionId: c }
explanation:
  correct:
    en: "Container image scans in Image Builder require Amazon Inspector to be activated for Amazon ECR in the Region. Image Builder checks this when a request enables scanning and returns ResourceDependencyException if it is missing; once Inspector is active, Image Builder saves a copy of the findings with the image."
    fr: "Les analyses d'images de conteneur dans Image Builder exigent l'activation d'Amazon Inspector pour Amazon ECR dans la Région. Image Builder le vérifie lorsqu'une requête active l'analyse et renvoie ResourceDependencyException s'il manque ; une fois Inspector actif, Image Builder enregistre une copie des résultats avec l'image."
  options:
    a:
      en: "A repository used for Image Builder scanning must not use the MANUAL scan frequency, and the frequency does not cause the missing dependency."
      fr: "Un référentiel utilisé pour l'analyse Image Builder ne doit pas utiliser la fréquence MANUAL, et la fréquence n'est pas la dépendance manquante."
    b:
      en: "The default repository changes where the copy is pushed, but Amazon Inspector activation for Amazon ECR is still required."
      fr: "Le référentiel par défaut change l'emplacement où la copie est envoyée, mais l'activation d'Amazon Inspector pour Amazon ECR reste nécessaire."
    d:
      en: "The error comes from a missing service activation, not from the permissions of the build instance."
      fr: "L'erreur provient d'une activation de service manquante, et non des autorisations de l'instance de build."
references:
  - title: "Amazon Inspector integration in Image Builder - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/integ-inspector.html
