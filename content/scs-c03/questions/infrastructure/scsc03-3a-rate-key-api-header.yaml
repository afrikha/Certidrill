id: scsc03-3a-rate-key-api-header
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany exposes a public API through an Amazon CloudFront distribution that has an AWS WAF web ACL. Its enterprise customers call the API from corporate networks, so many customers share the same egress IP addresses. Every request carries an x-api-key header, and an existing rule already blocks requests without it. The company must limit each API key to 1,000 requests in any 5-minute period, regardless of the IP addresses that the key's requests come from.

    Which rule will meet these requirements?
  fr: |
    AnyCompany expose une API publique par une distribution Amazon CloudFront dotée d'une liste ACL web AWS WAF. Ses clients grands comptes appellent l'API depuis des réseaux d'entreprise ; de nombreux clients partagent donc les mêmes adresses IP de sortie. Chaque requête porte un en-tête x-api-key, et une règle existante bloque déjà les requêtes qui en sont dépourvues. L'entreprise doit limiter chaque clé d'API à 1 000 requêtes sur toute période de 5 minutes, quelles que soient les adresses IP d'où proviennent les requêtes de la clé.

    Quelle règle permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          A rate-based rule that aggregates on the source IP address, with a limit of 1,000 and an evaluation window of 300 seconds.
        fr: |-
          Une règle basée sur le débit qui agrège selon l'adresse IP source, avec une limite de 1 000 et une fenêtre d'évaluation de 300 secondes.
    - id: b
      text:
        en: |-
          A rate-based rule that aggregates on the IP address in the X-Forwarded-For header, with a limit of 1,000 and an evaluation window of 300 seconds.
        fr: |-
          Une règle basée sur le débit qui agrège selon l'adresse IP de l'en-tête X-Forwarded-For, avec une limite de 1 000 et une fenêtre d'évaluation de 300 secondes.
    - id: c
      text:
        en: |-
          A rate-based rule that uses Count all aggregation with a scope-down statement that matches requests that contain the x-api-key header, with a limit of 1,000.
        fr: |-
          Une règle basée sur le débit qui utilise l'agrégation Count all avec une instruction de réduction de portée qui correspond aux requêtes contenant l'en-tête x-api-key, avec une limite de 1 000.
    - id: d
      text:
        en: |-
          A rate-based rule that aggregates on a custom key for the x-api-key header, with a limit of 1,000 and an evaluation window of 300 seconds.
        fr: |-
          Une règle basée sur le débit qui agrège selon une clé personnalisée pour l'en-tête x-api-key, avec une limite de 1 000 et une fenêtre d'évaluation de 300 secondes.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Custom aggregation keys make a rate-based rule count requests separately for each distinct value of the selected components. With the x-api-key header as the key, each API key is its own aggregation instance and is limited to 1,000 requests over the 300-second window, whatever IP addresses it uses.
    fr: |-
      Les clés d'agrégation personnalisées font compter par une règle basée sur le débit les requêtes séparément pour chaque valeur distincte des composants choisis. Avec l'en-tête x-api-key comme clé, chaque clé d'API constitue sa propre instance d'agrégation et est limitée à 1 000 requêtes sur la fenêtre de 300 secondes, quelles que soient les adresses IP qu'elle utilise.
  options:
    a:
      en: |-
        Customers that share an egress address would share one counter, and a key used from several addresses would get several allowances.
      fr: |-
        Les clients qui partagent une adresse de sortie partageraient un même compteur, et une clé utilisée depuis plusieurs adresses obtiendrait plusieurs quotas.
    b:
      en: |-
        The forwarded address is still a corporate egress IP shared by many customers, so the counter is per address, not per API key.
      fr: |-
        L'adresse transmise reste une adresse IP de sortie d'entreprise partagée par de nombreux clients ; le compteur est donc par adresse, pas par clé d'API.
    c:
      en: |-
        Count all puts every matching request in a single counter, so all API keys together would be limited to 1,000 requests.
      fr: |-
        Count all place toutes les requêtes correspondantes dans un compteur unique ; l'ensemble des clés d'API serait donc limité à 1 000 requêtes au total.
references:
  - title: Aggregating rate-based rules in AWS WAF - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based-aggregation-options.html
