id: scsc03-3a-cross-account-distribution-role
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's tooling account 444455556666 runs an EC2 Image Builder pipeline that builds an unencrypted hardened AMI. The distribution configuration lists three workload accounts as target accounts so that each account receives its own copy of the AMI. The build and test stages succeed, but the distribution stage fails with an access denied error for each workload account.

    What should the company do to fix the distribution?
  fr: |
    Le compte d'outillage 444455556666 d'AnyCompany exécute un pipeline EC2 Image Builder qui construit une AMI renforcée non chiffrée. La configuration de distribution indique trois comptes de charge de travail comme comptes cibles afin que chaque compte reçoive sa propre copie de l'AMI. Les étapes de build et de test réussissent, mais l'étape de distribution échoue avec une erreur d'accès refusé pour chaque compte de charge de travail.

    Que doit faire l'entreprise pour corriger la distribution ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach the Ec2ImageBuilderCrossAccountDistributionAccess policy to the instance profile that the build and test instances use in the tooling account.
        fr: |-
          Attacher la politique Ec2ImageBuilderCrossAccountDistributionAccess au profil d'instance qu'utilisent les instances de build et de test dans le compte d'outillage.
    - id: b
      text:
        en: |-
          Replace the target accounts with launch permissions for the three account IDs in the distribution configuration.
        fr: |-
          Remplacer les comptes cibles par des autorisations de lancement pour les trois ID de compte dans la configuration de distribution.
    - id: c
      text:
        en: |-
          In the tooling account, create a role that trusts the three workload accounts and has the Ec2ImageBuilderCrossAccountDistributionAccess policy.
        fr: |-
          Dans le compte d'outillage, créer un rôle qui approuve les trois comptes de charge de travail et possède la politique Ec2ImageBuilderCrossAccountDistributionAccess.
    - id: d
      text:
        en: |-
          In each workload account, create the EC2ImageBuilderDistributionCrossAccountRole role with the Ec2ImageBuilderCrossAccountDistributionAccess policy and a trust policy for account 444455556666.
        fr: |-
          Dans chaque compte de charge de travail, créer le rôle EC2ImageBuilderDistributionCrossAccountRole avec la politique Ec2ImageBuilderCrossAccountDistributionAccess et une politique d'approbation pour le compte 444455556666.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      To copy AMIs into target accounts, Image Builder assumes a role named EC2ImageBuilderDistributionCrossAccountRole in each destination account. The destination owner creates it with the Ec2ImageBuilderCrossAccountDistributionAccess managed policy and a trust policy that includes the source account. After the fix, retrying the image reruns only the distribution phase.
    fr: |-
      Pour copier des AMI dans des comptes cibles, Image Builder endosse un rôle nommé EC2ImageBuilderDistributionCrossAccountRole dans chaque compte de destination. Le propriétaire de la destination le crée avec la politique gérée Ec2ImageBuilderCrossAccountDistributionAccess et une politique d'approbation qui inclut le compte source. Après la correction, relancer l'image ne réexécute que la phase de distribution.
  options:
    a:
      en: |-
        The build instance profile is used during build and test; distribution into other accounts relies on a role in each destination account.
      fr: |-
        Le profil d'instance de build sert pendant le build et le test ; la distribution dans d'autres comptes repose sur un rôle dans chaque compte de destination.
    b:
      en: |-
        Launch permissions share the AMI that stays in the tooling account instead of giving each workload account its own copy.
      fr: |-
        Les autorisations de lancement partagent l'AMI qui reste dans le compte d'outillage, au lieu de donner à chaque compte de charge de travail sa propre copie.
    c:
      en: |-
        The trust is in the wrong direction: the role must exist in each destination account and trust the source account.
      fr: |-
        L'approbation est dans le mauvais sens : le rôle doit exister dans chaque compte de destination et approuver le compte source.
references:
  - title: Set up cross-account AMI distribution with Image Builder - EC2 Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/cross-account-dist.html
