id: scsc03-3a-global-accelerator-shield
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a real-time voice application over UDP on Amazon EC2 instances behind Network Load Balancers in two AWS Regions. Clients worldwide must connect to two static anycast IP addresses that never change, and traffic must move to the other Region if one Region becomes unhealthy. The threat model requires the entry point of the application to be an AWS Shield Advanced protected resource so that it receives Shield Advanced detection and Shield Response Team support.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application vocale en temps réel sur UDP, sur des instances Amazon EC2 derrière des Network Load Balancers dans deux Régions AWS. Les clients du monde entier doivent se connecter à deux adresses IP anycast statiques qui ne changent jamais, et le trafic doit basculer vers l'autre Région si une Région devient défaillante. Le modèle de menaces exige que le point d'entrée de l'application soit une ressource protégée par AWS Shield Advanced afin de bénéficier de la détection de Shield Advanced et du support de la Shield Response Team.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon CloudFront distribution with the two Network Load Balancers in an origin group, and add the distribution to Shield Advanced as a protected resource.
        fr: |-
          Créer une distribution Amazon CloudFront avec les deux Network Load Balancers dans un groupe d'origines, et ajouter la distribution à Shield Advanced comme ressource protégée.
    - id: b
      text:
        en: |-
          Create a custom routing accelerator in AWS Global Accelerator that maps to the instances' subnets, and add the accelerator to Shield Advanced as a protected resource.
        fr: |-
          Créer un accélérateur de routage personnalisé (custom routing) dans AWS Global Accelerator qui pointe vers les sous-réseaux des instances, et ajouter l'accélérateur à Shield Advanced comme ressource protégée.
    - id: c
      text:
        en: |-
          Create a standard accelerator in AWS Global Accelerator with an endpoint group in each Region for the Network Load Balancers, and add the accelerator to Shield Advanced as a protected resource.
        fr: |-
          Créer un accélérateur standard dans AWS Global Accelerator avec un groupe de points de terminaison par Région pour les Network Load Balancers, et ajouter l'accélérateur à Shield Advanced comme ressource protégée.
    - id: d
      text:
        en: |-
          Create Amazon Route 53 latency records that point to the load balancers, and add the hosted zone to Shield Advanced as a protected resource.
        fr: |-
          Créer des enregistrements Amazon Route 53 de latence qui pointent vers les équilibreurs de charge, et ajouter la zone hébergée à Shield Advanced comme ressource protégée.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Global Accelerator standard accelerator provides two static anycast IP addresses, supports TCP and UDP listeners, and routes traffic to healthy endpoint groups across Regions. Standard accelerators are a Shield Advanced protected resource type, so the accelerator becomes the protected entry point at the edge of the AWS network.
    fr: |-
      Un accélérateur standard Global Accelerator fournit deux adresses IP anycast statiques, prend en charge des écouteurs TCP et UDP, et achemine le trafic vers les groupes de points de terminaison sains dans les différentes Régions. Les accélérateurs standard sont un type de ressource protégée par Shield Advanced ; l'accélérateur devient donc le point d'entrée protégé en bordure du réseau AWS.
  options:
    a:
      en: |-
        CloudFront delivers HTTP and HTTPS content; it cannot carry the application's UDP voice traffic and does not provide static anycast IP addresses.
      fr: |-
        CloudFront diffuse du contenu HTTP et HTTPS ; il ne peut pas acheminer le trafic vocal UDP de l'application et ne fournit pas d'adresses IP anycast statiques.
    b:
      en: |-
        Shield Advanced protects only standard accelerators, and a custom routing accelerator maps users to specific instances without health-based failover between Regions.
      fr: |-
        Shield Advanced ne protège que les accélérateurs standard, et un accélérateur de routage personnalisé dirige les utilisateurs vers des instances précises sans basculement entre Régions fondé sur l'état de santé.
    d:
      en: |-
        DNS records do not provide static anycast IP addresses, and protecting the hosted zone protects DNS resolution, not the endpoints that carry the voice traffic.
      fr: |-
        Des enregistrements DNS ne fournissent pas d'adresses IP anycast statiques, et protéger la zone hébergée protège la résolution DNS, pas les points de terminaison qui acheminent le trafic vocal.
references:
  - title: List of AWS resources that AWS Shield Advanced protects - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-advanced-summary-protected-resources.html
