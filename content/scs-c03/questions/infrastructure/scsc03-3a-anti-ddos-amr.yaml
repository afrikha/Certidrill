id: scsc03-3a-anti-ddos-amr
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany publishes a news website through an Amazon CloudFront distribution that has an AWS WAF web ACL. The threat model anticipates application layer DDoS floods of GET requests from large botnets whose IP addresses change constantly, often during breaking news when legitimate traffic also spikes. Static rate limits have either blocked real readers or been set too high to help. The security team wants AWS WAF to detect an event from a significant deviation from the site's traffic baseline, to send silent browser challenges to challengeable requests during the event, and to block high-suspicion requests, without manually tuning request thresholds.

    Which solution will meet these requirements?
  fr: |
    AnyCompany publie un site d'actualités par une distribution Amazon CloudFront dotée d'une liste ACL web AWS WAF. Le modèle de menaces anticipe des inondations DDoS de requêtes GET au niveau de la couche application, provenant de grands botnets dont les adresses IP changent constamment, souvent pendant des événements d'actualité où le trafic légitime augmente aussi. Des limites de débit statiques ont soit bloqué de vrais lecteurs, soit été fixées trop haut pour être utiles. L'équipe de sécurité veut qu'AWS WAF détecte un événement à partir d'un écart important par rapport à la référence de trafic du site, envoie des défis de navigateur silencieux aux requêtes qui peuvent les recevoir pendant l'événement, et bloque les requêtes très suspectes, sans réglage manuel des seuils de requêtes.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the AWS managed DDoS prevention rule group, AWSManagedRulesAntiDDoSRuleSet, to the web ACL and set its challenge and block sensitivity levels.
        fr: |-
          Ajouter à la liste ACL web le groupe de règles géré AWS de prévention des attaques DDoS, AWSManagedRulesAntiDDoSRuleSet, et définir ses niveaux de sensibilité de défi et de blocage.
    - id: b
      text:
        en: |-
          Add a rate-based rule that aggregates requests by source IP address over a 60-second window, with the CAPTCHA action for clients that exceed the limit.
        fr: |-
          Ajouter une règle basée sur le débit qui agrège les requêtes par adresse IP source sur une fenêtre de 60 secondes, avec l'action CAPTCHA pour les clients qui dépassent la limite.
    - id: c
      text:
        en: |-
          Add the AWS WAF Bot Control rule group at the Common inspection level, and block every request labeled as coming from a bot.
        fr: |-
          Ajouter le groupe de règles AWS WAF Bot Control au niveau d'inspection Common, et bloquer toute requête étiquetée comme provenant d'un bot.
    - id: d
      text:
        en: |-
          Add the Amazon IP reputation list managed rule group, AWSManagedRulesAmazonIpReputationList, and block every request that it matches.
        fr: |-
          Ajouter le groupe de règles géré Amazon IP reputation list, AWSManagedRulesAmazonIpReputationList, et bloquer toutes les requêtes qu'il détecte.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The DDoS prevention rule group labels requests when a resource deviates significantly from its traffic baseline and when a source is suspected of participating in the event. Its ChallengeAllDuringEvent and ChallengeDDoSRequests rules apply silent browser challenges to challengeable requests, and its DDoSRequests rule blocks requests that meet the block sensitivity, so no static threshold has to be tuned.
    fr: |-
      Le groupe de règles de prévention des attaques DDoS étiquette les requêtes lorsqu'une ressource s'écarte nettement de sa référence de trafic et lorsqu'une source est soupçonnée de participer à l'événement. Ses règles ChallengeAllDuringEvent et ChallengeDDoSRequests appliquent des défis de navigateur silencieux aux requêtes qui peuvent les recevoir, et sa règle DDoSRequests bloque les requêtes qui atteignent la sensibilité de blocage ; aucun seuil statique n'est donc à régler.
  options:
    b:
      en: |-
        A rate-based rule uses a fixed threshold that must be tuned, is evaded by botnets that rotate addresses, and CAPTCHA is an interactive puzzle, not a silent challenge.
      fr: |-
        Une règle basée sur le débit utilise un seuil fixe qu'il faut régler, est contournée par les botnets qui changent d'adresses, et CAPTCHA est un puzzle interactif, pas un défi silencieux.
    c:
      en: |-
        The Common level labels self-identifying bots and known bot signatures; it has no traffic-baseline event detection and does not challenge requests.
      fr: |-
        Le niveau Common étiquette les bots qui s'identifient et les signatures de bots connues ; il ne détecte pas d'événement par rapport à une référence de trafic et ne lance pas de défis.
    d:
      en: |-
        An IP reputation list matches addresses already known to be malicious, so it cannot follow a botnet whose addresses keep changing or detect an event.
      fr: |-
        Une liste de réputation IP détecte des adresses déjà connues comme malveillantes ; elle ne peut donc pas suivre un botnet dont les adresses changent sans cesse ni détecter un événement.
