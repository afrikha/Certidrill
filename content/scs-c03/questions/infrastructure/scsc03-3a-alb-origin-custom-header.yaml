id: scsc03-3a-alb-origin-custom-header
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany serves an application through an Amazon CloudFront distribution that has an AWS WAF web ACL. The origin is an internet-facing Application Load Balancer, which must remain internet-facing until a network redesign next year. Attackers send requests directly to the load balancer and bypass AWS WAF. The security team requires that the load balancer reject, at the network layer, all traffic that does not come from CloudFront, and that it also reject requests that are sent through CloudFront distributions owned by other AWS accounts.

    Which solution will meet these requirements?
  fr: |
    AnyCompany sert une application par une distribution Amazon CloudFront dotée d'une liste ACL web AWS WAF. L'origine est un Application Load Balancer exposé à Internet, qui doit le rester jusqu'à une refonte du réseau l'an prochain. Des attaquants envoient des requêtes directement à l'équilibreur de charge et contournent AWS WAF. L'équipe de sécurité exige que l'équilibreur de charge rejette, au niveau de la couche réseau, tout trafic qui ne provient pas de CloudFront, et qu'il rejette aussi les requêtes envoyées par des distributions CloudFront appartenant à d'autres comptes AWS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow inbound HTTPS in the load balancer's security group only from the AWS managed prefix list for CloudFront origin-facing addresses, and remove all other inbound rules.
        fr: |-
          N'autoriser le HTTPS entrant dans le groupe de sécurité de l'équilibreur de charge que depuis la liste de préfixes gérée par AWS des adresses CloudFront côté origine, et supprimer toutes les autres règles entrantes.
    - id: b
      text:
        en: |-
          Associate a second web ACL with the load balancer that allows only requests whose Via header contains the string cloudfront, and blocks all other requests.
        fr: |-
          Associer à l'équilibreur de charge une seconde liste ACL web qui n'autorise que les requêtes dont l'en-tête Via contient la chaîne cloudfront, et bloque toutes les autres requêtes.
    - id: c
      text:
        en: |-
          Allow inbound HTTPS in the load balancer's security group only from the CloudFront origin-facing prefix list, add a secret custom origin header in CloudFront, and forward only requests with that header in the listener rules.
        fr: |-
          N'autoriser le HTTPS entrant dans le groupe de sécurité de l'équilibreur de charge que depuis la liste de préfixes CloudFront côté origine, ajouter un en-tête d'origine personnalisé secret dans CloudFront, et ne transférer dans les règles de l'écouteur que les requêtes qui portent cet en-tête.
    - id: d
      text:
        en: |-
          Run an AWS Lambda function that downloads the published AWS IP address ranges each day and rewrites the network ACLs of the load balancer subnets to allow only CloudFront ranges.
        fr: |-
          Exécuter une fonction AWS Lambda qui télécharge chaque jour les plages d'adresses IP AWS publiées et réécrit les listes ACL réseau des sous-réseaux de l'équilibreur de charge pour n'autoriser que les plages CloudFront.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The AWS managed prefix list for CloudFront origin-facing servers lets the security group drop non-CloudFront traffic at layers 3 and 4. Because every CloudFront distribution uses the same origin-facing addresses, the distribution also adds a secret custom header, and a listener rule forwards only requests that carry it while the default action returns a 403 fixed response. The header value should be random and rotated periodically.
    fr: |-
      La liste de préfixes gérée par AWS des serveurs CloudFront côté origine permet au groupe de sécurité d'écarter le trafic qui ne provient pas de CloudFront aux couches 3 et 4. Comme toutes les distributions CloudFront utilisent les mêmes adresses côté origine, la distribution ajoute aussi un en-tête personnalisé secret, et une règle d'écouteur ne transfère que les requêtes qui le portent, l'action par défaut renvoyant une réponse fixe 403. La valeur de l'en-tête doit être aléatoire et changée périodiquement.
  options:
    a:
      en: |-
        The prefix list contains the addresses used by all CloudFront distributions, so requests relayed by another account's distribution would still be accepted.
      fr: |-
        La liste de préfixes contient les adresses utilisées par toutes les distributions CloudFront ; les requêtes relayées par la distribution d'un autre compte seraient donc toujours acceptées.
    b:
      en: |-
        Any client can send a Via header, and every CloudFront distribution adds one, so the rule neither blocks direct attackers reliably nor works at the network layer.
      fr: |-
        N'importe quel client peut envoyer un en-tête Via, et toutes les distributions CloudFront en ajoutent un ; la règle ne bloque donc pas de manière fiable les attaquants directs et n'agit pas au niveau de la couche réseau.
    d:
      en: |-
        Custom code adds overhead, network ACLs have a small rule quota, and allowing CloudFront ranges still accepts other accounts' distributions.
      fr: |-
        Le code personnalisé ajoute de la charge, les listes ACL réseau ont un petit quota de règles, et autoriser les plages CloudFront accepte toujours les distributions des autres comptes.
references:
  - title: Restrict access to Application Load Balancers - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/restrict-access-to-load-balancer.html
