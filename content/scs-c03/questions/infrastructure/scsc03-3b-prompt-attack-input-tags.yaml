id: scsc03-3b-prompt-attack-input-tags
objective: "3.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's support assistant calls the Amazon Bedrock InvokeModel API with a guardrail identifier and version. The application builds one prompt string that contains the developer's system instructions, retrieved support articles and the customer's question. The guardrail has content filters for hate and violence and a prompt attack filter set to HIGH. A red team shows that the content filters work, but jailbreak and prompt injection attempts in the customer's question are never blocked. The developer's instructions must not be evaluated as prompt attacks.

    Which solution will meet these requirements?
  fr: |
    L'assistant de support d'AnyCompany appelle l'API Amazon Bedrock InvokeModel avec un identifiant et une version de barrière de protection (guardrail). L'application construit une seule chaîne de prompt qui contient les instructions système du développeur, des articles de support récupérés et la question du client. La barrière de protection a des filtres de contenu pour la haine et la violence et un filtre d'attaques par prompt défini sur HIGH. Une équipe rouge montre que les filtres de contenu fonctionnent, mais que les tentatives de jailbreak et d'injection de prompt dans la question du client ne sont jamais bloquées. Les instructions du développeur ne doivent pas être évaluées comme des attaques par prompt.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a denied topic named Jailbreak with sample phrases of known attacks, and set its input action to BLOCK."
        fr: "Ajouter un sujet refusé nommé Jailbreak avec des exemples de phrases d'attaques connues, et définir son action d'entrée sur BLOCK."
    - id: b
      text:
        en: "Wrap the customer's question in amazon-bedrock-guardrails-guardContent tags with a random tagSuffix that is passed in amazon-bedrock-guardrailConfig for each request."
        fr: "Encadrer la question du client par des balises amazon-bedrock-guardrails-guardContent avec un tagSuffix aléatoire transmis dans amazon-bedrock-guardrailConfig pour chaque requête."
    - id: c
      text:
        en: "Add a contextual grounding check with a relevance threshold of 0.9 so that answers that follow injected instructions are blocked."
        fr: "Ajouter une vérification d'ancrage contextuel avec un seuil de pertinence de 0,9 afin de bloquer les réponses qui suivent des instructions injectées."
    - id: d
      text:
        en: "Call the ApplyGuardrail API on each model response with the source set to OUTPUT before the response is returned."
        fr: "Appeler l'API ApplyGuardrail sur chaque réponse du modèle avec la source définie sur OUTPUT avant de renvoyer la réponse."
answer: { optionId: b }
explanation:
  correct:
    en: "With InvokeModel and InvokeModelWithResponseStream, the prompt attack filter needs input tags that mark the user input; without tags, prompt attacks are not filtered. Content inside the amazon-bedrock-guardrails-guardContent tags is evaluated while the developer's instructions outside the tags are not, and a new random tagSuffix for each request stops users from closing the tag themselves."
    fr: "Avec InvokeModel et InvokeModelWithResponseStream, le filtre d'attaques par prompt a besoin de balises d'entrée qui délimitent la saisie de l'utilisateur ; sans balises, les attaques par prompt ne sont pas filtrées. Le contenu placé dans les balises amazon-bedrock-guardrails-guardContent est évalué, mais pas les instructions du développeur situées en dehors, et un nouveau tagSuffix aléatoire à chaque requête empêche les utilisateurs de fermer eux-mêmes la balise."
  options:
    a:
      en: "Denied topics detect subjects to avoid, not adversarial instructions, and the prompt attack filter would still not run without input tags."
      fr: "Les sujets refusés détectent des sujets à éviter, et non des instructions malveillantes, et le filtre d'attaques par prompt ne s'exécuterait toujours pas sans balises d'entrée."
    c:
      en: "Contextual grounding checks run on model responses to detect ungrounded or irrelevant answers; they do not detect prompt attacks in the input."
      fr: "Les vérifications d'ancrage contextuel s'exécutent sur les réponses du modèle pour détecter les réponses non ancrées ou non pertinentes ; elles ne détectent pas les attaques par prompt dans l'entrée."
    d:
      en: "The prompt attack filter evaluates user prompts, so checking only the output does not block jailbreak and injection attempts."
      fr: "Le filtre d'attaques par prompt évalue les prompts des utilisateurs : contrôler uniquement la sortie ne bloque pas les tentatives de jailbreak et d'injection."
references:
  - title: "Detect prompt attacks with Amazon Bedrock Guardrails - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
  - title: "Apply tags to user input to filter content - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tagging.html
