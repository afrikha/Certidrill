id: scsc03-3b-sg-reference-alb
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs an application on Amazon EC2 instances in an Auto Scaling group behind an internet-facing Application Load Balancer (ALB). The instances listen on TCP 8080 in private subnets that also host other workloads. The security team requires that the instances accept traffic on TCP 8080 only from the ALB. The IP addresses of the ALB nodes change over time, and the rule must not need updates.

    Which configuration is the MOST secure?
  fr: |
    AnyCompany exécute une application sur des instances Amazon EC2 d'un groupe Auto Scaling derrière un Application Load Balancer (ALB) accessible sur Internet. Les instances écoutent sur TCP 8080 dans des sous-réseaux privés qui hébergent aussi d'autres charges de travail. L'équipe de sécurité exige que les instances n'acceptent le trafic TCP 8080 que depuis l'ALB. Les adresses IP des nœuds de l'ALB changent au fil du temps, et la règle ne doit pas nécessiter de mises à jour.

    Quelle configuration est la PLUS sécurisée ?
body:
  options:
    - id: a
      text:
        en: "In the instances' security group, allow inbound TCP 8080 from the CIDR blocks of the ALB subnets."
        fr: "Dans le groupe de sécurité des instances, autoriser le TCP 8080 entrant depuis les blocs CIDR des sous-réseaux de l'ALB."
    - id: b
      text:
        en: "In the instances' security group, allow inbound TCP 8080 from the VPC CIDR block."
        fr: "Dans le groupe de sécurité des instances, autoriser le TCP 8080 entrant depuis le bloc CIDR du VPC."
    - id: c
      text:
        en: "In the network ACL of the private subnets, allow inbound TCP 8080 from the ALB subnets and deny all other inbound traffic."
        fr: "Dans l'ACL réseau des sous-réseaux privés, autoriser le TCP 8080 entrant depuis les sous-réseaux de l'ALB et refuser tout autre trafic entrant."
    - id: d
      text:
        en: "In the instances' security group, allow inbound TCP 8080 with the ALB's security group as the source."
        fr: "Dans le groupe de sécurité des instances, autoriser le TCP 8080 entrant avec le groupe de sécurité de l'ALB comme source."
answer: { optionId: d }
explanation:
  correct:
    en: "When a security group is the source of a rule, the rule applies to traffic from every network interface associated with that group, whatever its IP address. Referencing the ALB's security group admits only the load balancer and needs no update when its node addresses change."
    fr: "Lorsqu'un groupe de sécurité est la source d'une règle, celle-ci s'applique au trafic de chaque interface réseau associée à ce groupe, quelle que soit son adresse IP. Référencer le groupe de sécurité de l'ALB n'admet que l'équilibreur de charge et ne nécessite aucune mise à jour quand les adresses de ses nœuds changent."
  options:
    a:
      en: "Subnet CIDR blocks admit any other resource placed in the ALB subnets, so the rule is broader than the ALB."
      fr: "Les blocs CIDR de sous-réseau admettent toute autre ressource placée dans les sous-réseaux de l'ALB : la règle est plus large que l'ALB."
    b:
      en: "The VPC CIDR block admits every workload in the VPC, including the other workloads of the private subnets."
      fr: "Le bloc CIDR du VPC admet toutes les charges de travail du VPC, y compris les autres charges de travail des sous-réseaux privés."
    c:
      en: "A network ACL filters by CIDR at the subnet boundary, so it cannot identify the ALB itself, and it would also block the other workloads' traffic."
      fr: "Une ACL réseau filtre par CIDR à la limite du sous-réseau : elle ne peut pas identifier l'ALB lui-même, et elle bloquerait aussi le trafic des autres charges de travail."
references:
  - title: "Security group rules - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html
