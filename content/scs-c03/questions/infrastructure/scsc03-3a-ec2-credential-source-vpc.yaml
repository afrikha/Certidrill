id: scsc03-3a-ec2-credential-source-vpc
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's Amazon EC2 instances run in private subnets without internet access, and they reach AWS services only through interface VPC endpoints and an Amazon S3 gateway endpoint. Each instance uses an instance profile. The threat model warns that instance role credentials stolen from an instance could be used from another network. The security team wants an organization-wide preventive guardrail that denies any request signed with EC2 instance role credentials unless the request comes through the same VPC that the credentials were delivered to. The guardrail must not require editing each role and must not break calls that AWS services make on the instances' behalf.

    Which solution will meet these requirements?
  fr: |
    Les instances Amazon EC2 d'AnyCompany s'exécutent dans des sous-réseaux privés sans accès à Internet et n'atteignent les services AWS que par des points de terminaison de VPC d'interface et un point de terminaison de passerelle Amazon S3. Chaque instance utilise un profil d'instance. Le modèle de menaces avertit que des informations d'identification de rôle d'instance volées sur une instance pourraient être utilisées depuis un autre réseau. L'équipe de sécurité veut un garde-fou préventif à l'échelle de l'organisation qui refuse toute requête signée avec des informations d'identification de rôle d'instance EC2, sauf si la requête passe par le VPC auquel ces informations ont été remises. Le garde-fou ne doit pas exiger de modifier chaque rôle et ne doit pas casser les appels que les services AWS effectuent pour le compte des instances.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP that denies all actions when aws:SourceIp is not in the VPC CIDR ranges, with a Null condition that ec2:SourceInstanceARN is false and BoolIfExists aws:ViaAWSService false.
        fr: |-
          Attacher une SCP qui refuse toutes les actions lorsque aws:SourceIp n'est pas dans les plages CIDR des VPC, avec une condition Null indiquant que ec2:SourceInstanceARN vaut false et BoolIfExists aws:ViaAWSService à false.
    - id: b
      text:
        en: |-
          Add an aws:SourceVpc condition to the trust policy of every instance role so that only Amazon EC2 in the expected VPC can assume the role.
        fr: |-
          Ajouter une condition aws:SourceVpc à la politique d'approbation de chaque rôle d'instance afin que seul Amazon EC2 dans le VPC attendu puisse endosser le rôle.
    - id: c
      text:
        en: |-
          Attach an SCP that denies all actions when aws:Ec2InstanceSourceVpc does not equal ${aws:SourceVpc}, with a Null condition that ec2:SourceInstanceARN is false and BoolIfExists aws:ViaAWSService false.
        fr: |-
          Attacher une SCP qui refuse toutes les actions lorsque aws:Ec2InstanceSourceVpc n'est pas égal à ${aws:SourceVpc}, avec une condition Null indiquant que ec2:SourceInstanceARN vaut false et BoolIfExists aws:ViaAWSService à false.
    - id: d
      text:
        en: |-
          Enable Amazon GuardDuty in every account, and create an Amazon EventBridge rule that revokes the role's sessions when an instance credential exfiltration finding appears.
        fr: |-
          Activer Amazon GuardDuty dans chaque compte, et créer une règle Amazon EventBridge qui révoque les sessions du rôle lorsqu'un résultat d'exfiltration d'informations d'identification d'instance apparaît.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      aws:Ec2InstanceSourceVpc contains the VPC to which the EC2 role credentials were delivered, and aws:SourceVpc is present when a request comes through a VPC endpoint, so comparing them denies credentials used from any other network path. The Null check on ec2:SourceInstanceARN limits the statement to instance role credentials, and BoolIfExists on aws:ViaAWSService exempts calls that AWS services make on the principal's behalf. As an SCP, it applies to every role without editing them.
    fr: |-
      aws:Ec2InstanceSourceVpc contient le VPC auquel les informations d'identification du rôle EC2 ont été remises, et aws:SourceVpc est présent lorsqu'une requête passe par un point de terminaison de VPC ; les comparer refuse donc les informations d'identification utilisées depuis tout autre chemin réseau. La vérification Null sur ec2:SourceInstanceARN limite l'instruction aux informations d'identification de rôle d'instance, et BoolIfExists sur aws:ViaAWSService exempte les appels que les services AWS effectuent pour le compte du principal. En tant que SCP, elle s'applique à tous les rôles sans les modifier.
  options:
    a:
      en: |-
        Requests through VPC endpoints carry private addresses that aws:SourceIp does not evaluate, so this SCP would deny the instances' legitimate calls.
      fr: |-
        Les requêtes qui passent par des points de terminaison de VPC portent des adresses privées qu'aws:SourceIp n'évalue pas ; cette SCP refuserait donc les appels légitimes des instances.
    b:
      en: |-
        The trust policy controls who can assume the role, not where the issued credentials are later used, and it requires editing every role.
      fr: |-
        La politique d'approbation contrôle qui peut endosser le rôle, pas l'endroit où les informations d'identification émises sont utilisées ensuite, et elle exige de modifier chaque rôle.
    d:
      en: |-
        GuardDuty detects the use of exfiltrated credentials after it happens; it is a detective response, not a preventive guardrail.
      fr: |-
        GuardDuty détecte l'utilisation d'informations d'identification exfiltrées après coup ; c'est une réponse de détection, pas un garde-fou préventif.
references:
  - title: AWS global condition context keys - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
