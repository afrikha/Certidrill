id: scsc03-3c-macsec-order-setup
objective: "3.3.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany will connect its data center to AWS through a new 10 Gbps AWS Direct Connect dedicated connection at a location that supports MACsec. The connection must be protected with MACsec from the start. The network team will change the encryption mode to must_encrypt only after it confirms that the MACsec session is established.

    Which four actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany va connecter son centre de données à AWS par une nouvelle connexion dédiée AWS Direct Connect de 10 Gbit/s, dans un emplacement qui prend en charge MACsec. La connexion doit être protégée par MACsec dès le départ. L'équipe réseau ne passera le mode de chiffrement à must_encrypt qu'après avoir confirmé que la session MACsec est établie.

    Quelles sont les quatre actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: assoc, text: { en: "Associate a CKN/CAK pair with the connection.", fr: "Associer une paire CKN/CAK à la connexion." } }
    - { id: hosted, text: { en: "Request a hosted connection from a Direct Connect Partner.", fr: "Demander une connexion hébergée à un partenaire Direct Connect." } }
    - { id: mode, text: { en: "Confirm that the MACsec session is established, then set the encryption mode to must_encrypt.", fr: "Confirmer que la session MACsec est établie, puis définir le mode de chiffrement sur must_encrypt." } }
    - { id: create, text: { en: "Request the dedicated connection with MACsec enabled.", fr: "Demander la connexion dédiée avec MACsec activé." } }
    - { id: kms, text: { en: "Import the CAK as key material into a customer managed AWS KMS key.", fr: "Importer la CAK comme élément de clé dans une clé AWS KMS gérée par le client." } }
    - { id: router, text: { en: "Configure the same CKN/CAK pair on the on-premises router.", fr: "Configurer la même paire CKN/CAK sur le routeur sur site." } }
answer:
  sequence: [ create, assoc, router, mode ]
explanation:
  correct:
    en: "MACsec is turned on when the dedicated connection is created. You then associate a CKN/CAK pair with the connection (or LAG), which Direct Connect stores as a secret in AWS Secrets Manager, and you configure the matching pair on the on-premises router. New MACsec connections use should_encrypt by default; switching to must_encrypt after the session is up avoids an outage during setup."
    fr: "MACsec est activé à la création de la connexion dédiée. Vous associez ensuite une paire CKN/CAK à la connexion (ou au LAG), que Direct Connect stocke sous forme de secret dans AWS Secrets Manager, puis vous configurez la paire correspondante sur le routeur sur site. Les nouvelles connexions MACsec utilisent should_encrypt par défaut ; passer à must_encrypt une fois la session établie évite une interruption pendant la mise en place."
  options:
    hosted:
      en: "Hosted connections do not support MACsec; only dedicated connections, their LAGs and partner interconnects do."
      fr: "Les connexions hébergées ne prennent pas en charge MACsec ; seules les connexions dédiées, leurs LAG et les interconnexions de partenaires le prennent en charge."
    kms:
      en: "The CKN/CAK pair is associated with the connection and stored by Direct Connect in Secrets Manager; it is not imported into a KMS key."
      fr: "La paire CKN/CAK est associée à la connexion et stockée par Direct Connect dans Secrets Manager ; elle n'est pas importée dans une clé KMS."
references:
  - title: Get started using MACsec on a dedicated Direct Connect connection - AWS Direct Connect
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/create-macsec-dedicated.html
  - title: MAC Security in Direct Connect - AWS Direct Connect
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/MACsec.html
