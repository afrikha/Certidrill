id: scsc03-3b-inspectorscan-permissions
objective: "3.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany added an InspectorScan action in ECRImageScan mode to a V2 AWS CodePipeline pipeline, after the stage that pushes the image to an Amazon ECR repository in the same account. The action fails with an access denied error before any vulnerability is reported. The pipeline service role allows ecr:BatchGetImage, ecr:GetDownloadUrlForLayer and ecr:BatchCheckLayerAvailability on the repository, and the CloudWatch Logs actions that the pipeline needs. The ECR repository has no repository policy.

    Which change will resolve the error?
  fr: |
    AnyCompany a ajouté une action InspectorScan en mode ECRImageScan à un pipeline AWS CodePipeline V2, après l'étape qui envoie l'image vers un référentiel Amazon ECR du même compte. L'action échoue avec une erreur d'accès refusé avant de signaler la moindre vulnérabilité. Le rôle de service du pipeline autorise ecr:BatchGetImage, ecr:GetDownloadUrlForLayer et ecr:BatchCheckLayerAvailability sur le référentiel, ainsi que les actions CloudWatch Logs dont le pipeline a besoin. Le référentiel ECR n'a pas de politique de référentiel.

    Quelle modification résout l'erreur ?
body:
  options:
    - id: a
      text:
        en: "Add a repository policy that allows the codepipeline.amazonaws.com service principal to pull images from the repository."
        fr: "Ajouter une politique de référentiel qui autorise le principal de service codepipeline.amazonaws.com à récupérer des images du référentiel."
    - id: b
      text:
        en: "Allow inspector2:ListFindings and inspector2:ListCoverage in the pipeline service role."
        fr: "Autoriser inspector2:ListFindings et inspector2:ListCoverage dans le rôle de service du pipeline."
    - id: c
      text:
        en: "Allow inspector2:Enable for the ECR resource type in the pipeline service role."
        fr: "Autoriser inspector2:Enable pour le type de ressource ECR dans le rôle de service du pipeline."
    - id: d
      text:
        en: "Allow inspector-scan:ScanSbom on all resources in the pipeline service role."
        fr: "Autoriser inspector-scan:ScanSbom sur toutes les ressources dans le rôle de service du pipeline."
answer: { optionId: d }
explanation:
  correct:
    en: "The InspectorScan action generates an SBOM of the image and assesses it with the Amazon Inspector Scan API. Besides the three ECR read actions, the pipeline service role needs inspector-scan:ScanSbom on all resources; without it, the action is denied before any result is returned."
    fr: "L'action InspectorScan génère une SBOM de l'image et l'évalue avec l'API Amazon Inspector Scan. En plus des trois actions de lecture ECR, le rôle de service du pipeline a besoin de inspector-scan:ScanSbom sur toutes les ressources ; sans elle, l'action est refusée avant tout résultat."
  options:
    a:
      en: "In the same account, the service role's identity policy is enough to pull the image, and the role already has the ECR actions that the action needs."
      fr: "Dans le même compte, la politique d'identité du rôle de service suffit pour récupérer l'image, et le rôle dispose déjà des actions ECR nécessaires."
    b:
      en: "The action does not read Amazon Inspector findings or coverage; it calls the Scan API."
      fr: "L'action ne lit ni les résultats ni la couverture d'Amazon Inspector ; elle appelle l'API Scan."
    c:
      en: "inspector2:Enable activates Inspector scanning for an account; it is not the permission that the InspectorScan action uses."
      fr: "inspector2:Enable active l'analyse Inspector pour un compte ; ce n'est pas l'autorisation qu'utilise l'action InspectorScan."
references:
  - title: "Amazon Inspector InspectorScan invoke action reference - AWS CodePipeline"
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-InspectorScan.html
