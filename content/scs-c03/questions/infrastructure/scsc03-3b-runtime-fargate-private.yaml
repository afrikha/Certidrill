id: scsc03-3b-runtime-fargate-private
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs Amazon ECS services on AWS Fargate (Linux, platform version LATEST) in private subnets that have no route to the internet. The security team enabled Amazon GuardDuty Runtime Monitoring with automated agent configuration for AWS Fargate (Amazon ECS only). The GuardDuty coverage page now reports the tasks as unhealthy because the security agent is not running. The tasks use a custom task execution role that grants only CloudWatch Logs permissions, and the application images come from a public registry through a proxy that the company manages. The security team must make Runtime Monitoring work for these tasks without adding a path to the internet.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des services Amazon ECS sur AWS Fargate (Linux, version de plateforme LATEST) dans des sous-réseaux privés qui n'ont aucun itinéraire vers Internet. L'équipe de sécurité a activé Amazon GuardDuty Runtime Monitoring avec la configuration automatisée de l'agent pour AWS Fargate (Amazon ECS uniquement). La page de couverture de GuardDuty indique désormais que les tâches ne sont pas saines, car l'agent de sécurité ne s'exécute pas. Les tâches utilisent un rôle d'exécution de tâche personnalisé qui n'accorde que des autorisations CloudWatch Logs, et les images de l'application proviennent d'un registre public via un proxy géré par l'entreprise. L'équipe de sécurité doit faire fonctionner Runtime Monitoring pour ces tâches sans ajouter de chemin vers Internet.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add Amazon ECR pull permissions to the task role, and create a NAT gateway so that the tasks can reach the GuardDuty agent image."
        fr: "Ajouter des autorisations de récupération Amazon ECR au rôle de tâche, et créer une passerelle NAT afin que les tâches puissent atteindre l'image de l'agent GuardDuty."
    - id: b
      text:
        en: "Switch Fargate to manual agent management, and add the GuardDuty security agent as a sidecar container in each task definition."
        fr: "Passer Fargate en gestion manuelle de l'agent, et ajouter l'agent de sécurité GuardDuty comme conteneur sidecar dans chaque définition de tâche."
    - id: c
      text:
        en: "Create an Amazon ECR pull through cache rule for the GuardDuty agent image, and allow the task role to pull from the cache repository."
        fr: "Créer une règle de cache d'extraction (pull through cache) Amazon ECR pour l'image de l'agent GuardDuty, et autoriser le rôle de tâche à récupérer depuis le référentiel de cache."
    - id: d
      text:
        en: "Add Amazon ECR pull permissions to the task execution role, and create VPC endpoints for Amazon ECR and Amazon S3 in the VPC of the tasks."
        fr: "Ajouter des autorisations de récupération Amazon ECR au rôle d'exécution de tâche, et créer des points de terminaison de VPC pour Amazon ECR et Amazon S3 dans le VPC des tâches."
answer: { optionId: d }
explanation:
  correct:
    en: "On Fargate, GuardDuty adds its security agent container to the tasks and uses the task execution role to download the agent image from Amazon ECR, so that role needs ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer and ecr:BatchGetImage (or AmazonECSTaskExecutionRolePolicy). Tasks in private subnets without internet access also need VPC endpoints for Amazon ECR, and image layers are served from Amazon S3."
    fr: "Sur Fargate, GuardDuty ajoute son conteneur d'agent de sécurité aux tâches et utilise le rôle d'exécution de tâche pour télécharger l'image de l'agent depuis Amazon ECR : ce rôle a besoin de ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer et ecr:BatchGetImage (ou de AmazonECSTaskExecutionRolePolicy). Les tâches de sous-réseaux privés sans accès Internet ont aussi besoin de points de terminaison de VPC pour Amazon ECR, et les couches d'image sont servies depuis Amazon S3."
  options:
    a:
      en: "The agent image is pulled with the task execution role, not the task role, and a NAT gateway adds an internet path that the network design does not allow."
      fr: "L'image de l'agent est récupérée avec le rôle d'exécution de tâche, et non le rôle de tâche, et une passerelle NAT ajoute un chemin Internet que la conception réseau n'autorise pas."
    b:
      en: "Manual agent management is not available for AWS Fargate (Amazon ECS only); GuardDuty must manage the agent automatically."
      fr: "La gestion manuelle de l'agent n'est pas disponible pour AWS Fargate (Amazon ECS uniquement) ; GuardDuty doit gérer l'agent automatiquement."
    c:
      en: "GuardDuty injects its own agent image, which is not pulled through the company's cache, and the task role is not the role that downloads it."
      fr: "GuardDuty injecte sa propre image d'agent, qui ne passe pas par le cache de l'entreprise, et le rôle de tâche n'est pas celui qui la télécharge."
references:
  - title: "Prerequisites for AWS Fargate (Amazon ECS only) support - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/prereq-runtime-monitoring-ecs-support.html
  - title: "GuardDuty Runtime Monitoring - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/runtime-monitoring.html
