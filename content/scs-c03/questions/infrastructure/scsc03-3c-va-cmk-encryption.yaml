id: scsc03-3c-va-cmk-encryption
objective: "3.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's AWS Verified Access group and endpoint policies contain user email addresses, and its OIDC trust provider stores a client ID and a client secret. A compliance rule requires this data to be encrypted at rest with a key that the company controls, can disable at any time, and can audit in AWS CloudTrail. The key must be usable only through Verified Access in the company's account.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Les politiques de groupe et de point de terminaison AWS Verified Access d'AnyCompany contiennent des adresses e-mail d'utilisateurs, et son fournisseur de confiance OIDC stocke un ID client et un secret client. Une règle de conformité exige que ces données soient chiffrées au repos avec une clé que l'entreprise contrôle, peut désactiver à tout moment et peut auditer dans AWS CloudTrail. La clé ne doit être utilisable que par Verified Access dans le compte de l'entreprise.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create a symmetric customer managed key in AWS KMS, and specify it in the additional encryption settings of the trust provider, the Verified Access groups and the Verified Access endpoints."
        fr: "Créer une clé symétrique gérée par le client dans AWS KMS, et la spécifier dans les paramètres de chiffrement supplémentaires du fournisseur de confiance, des groupes Verified Access et des points de terminaison Verified Access."
    - id: b
      text:
        en: "Create an asymmetric customer managed key in AWS KMS, and specify it in the additional encryption settings of the Verified Access instance."
        fr: "Créer une clé asymétrique gérée par le client dans AWS KMS, et la spécifier dans les paramètres de chiffrement supplémentaires de l'instance Verified Access."
    - id: c
      text:
        en: "Turn off the default encryption with AWS owned keys so that only the customer managed key protects the data."
        fr: "Désactiver le chiffrement par défaut avec des clés détenues par AWS afin que seule la clé gérée par le client protège les données."
    - id: d
      text:
        en: "In the key policy, allow kms:CreateGrant, kms:DescribeKey, kms:GenerateDataKey and kms:Decrypt with kms:ViaService set to the Verified Access service in the Region and kms:CallerAccount set to the account ID."
        fr: "Dans la politique de clé, autoriser kms:CreateGrant, kms:DescribeKey, kms:GenerateDataKey et kms:Decrypt avec kms:ViaService défini sur le service Verified Access de la Région et kms:CallerAccount défini sur l'ID du compte."
    - id: e
      text:
        en: "In the key policy, allow kms:Encrypt and kms:ReEncrypt* for the Verified Access service principal without any condition."
        fr: "Dans la politique de clé, autoriser kms:Encrypt et kms:ReEncrypt* pour le principal de service Verified Access sans aucune condition."
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Verified Access always encrypts this PII with AWS owned keys and lets you add a second layer with a symmetric customer managed key on trust providers, groups and endpoints. The key policy must allow kms:CreateGrant, kms:DescribeKey, kms:GenerateDataKey and kms:Decrypt; the kms:ViaService and kms:CallerAccount conditions limit their use to Verified Access in the account, and CloudTrail records the KMS calls that Verified Access makes.
    fr: |-
      Verified Access chiffre toujours ces informations personnelles avec des clés détenues par AWS et vous permet d'ajouter une seconde couche avec une clé symétrique gérée par le client sur les fournisseurs de confiance, les groupes et les points de terminaison. La politique de clé doit autoriser kms:CreateGrant, kms:DescribeKey, kms:GenerateDataKey et kms:Decrypt ; les conditions kms:ViaService et kms:CallerAccount limitent leur usage à Verified Access dans le compte, et CloudTrail enregistre les appels KMS que Verified Access effectue.
  options:
    b:
      en: "Only symmetric customer managed keys are supported, and the key is specified on trust providers, groups and endpoints, not on the instance."
      fr: "Seules les clés symétriques gérées par le client sont prises en charge, et la clé se spécifie sur les fournisseurs de confiance, les groupes et les points de terminaison, pas sur l'instance."
    c:
      en: "Encryption with AWS owned keys cannot be turned off; a customer managed key adds a second layer on top of it."
      fr: "Le chiffrement avec des clés détenues par AWS ne peut pas être désactivé ; une clé gérée par le client ajoute une seconde couche par-dessus."
    e:
      en: "Verified Access needs CreateGrant, DescribeKey, GenerateDataKey and Decrypt, and a statement without conditions does not limit the key to Verified Access in the company's account."
      fr: "Verified Access a besoin de CreateGrant, DescribeKey, GenerateDataKey et Decrypt, et une déclaration sans condition ne limite pas la clé à Verified Access dans le compte de l'entreprise."
references:
  - title: Data encryption at rest for AWS Verified Access - AWS Verified Access
    url: https://docs.aws.amazon.com/verified-access/latest/ug/encryption-at-rest.html
