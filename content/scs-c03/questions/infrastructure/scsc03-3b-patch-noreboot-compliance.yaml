id: scsc03-3b-patch-noreboot-compliance
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany patches its Amazon Linux 2023 application servers with AWS Systems Manager Patch Manager. A maintenance window runs AWS-RunPatchBaseline with Operation set to Install and RebootOption set to NoReboot every Saturday, because the application team must control when the servers restart and reboots them on Sunday morning. On Monday, the compliance dashboard still shows the servers as Non-Compliant, although all approved patches were installed. The security team needs the dashboard to show the real state after the Sunday reboots, without changing who controls the reboots.

    Which solution will meet these requirements?
  fr: |
    AnyCompany applique les correctifs de ses serveurs d'application Amazon Linux 2023 avec AWS Systems Manager Patch Manager. Une fenêtre de maintenance exécute AWS-RunPatchBaseline avec Operation défini sur Install et RebootOption défini sur NoReboot chaque samedi, car l'équipe applicative doit contrôler le moment où les serveurs redémarrent et les redémarre le dimanche matin. Le lundi, le tableau de bord de conformité affiche toujours les serveurs comme Non-Compliant, bien que tous les correctifs approuvés aient été installés. L'équipe de sécurité a besoin que le tableau de bord montre l'état réel après les redémarrages du dimanche, sans changer qui contrôle les redémarrages.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Change RebootOption to RebootIfNeeded in the Saturday task so that the servers restart at the end of the installation."
        fr: "Remplacer RebootOption par RebootIfNeeded dans la tâche du samedi afin que les serveurs redémarrent à la fin de l'installation."
    - id: b
      text:
        en: "Copy the baseline to a custom baseline that assigns the Informational compliance level to all approved patches."
        fr: "Copier le référentiel de correctifs (patch baseline) dans un référentiel personnalisé qui attribue le niveau de conformité Informational à tous les correctifs approuvés."
    - id: c
      text:
        en: "Export the compliance data with a resource data sync, and exclude the patches in the InstalledPendingReboot state from the reports."
        fr: "Exporter les données de conformité avec une synchronisation des données de ressources, et exclure des rapports les correctifs à l'état InstalledPendingReboot."
    - id: d
      text:
        en: "Register a second maintenance window task that runs AWS-RunPatchBaseline with Operation set to Scan after the Sunday reboots."
        fr: "Enregistrer une seconde tâche de fenêtre de maintenance qui exécute AWS-RunPatchBaseline avec Operation défini sur Scan après les redémarrages du dimanche."
answer: { optionId: d }
explanation:
  correct:
    en: "With NoReboot, every installed patch that waits for a restart gets the InstalledPendingReboot state and the node is reported as Non-Compliant. The status returns to Compliant only after a reboot followed by a Scan operation, so a scheduled scan after the Sunday reboots refreshes the compliance data while the application team keeps control of the restarts."
    fr: "Avec NoReboot, chaque correctif installé qui attend un redémarrage prend l'état InstalledPendingReboot et le nœud est signalé comme Non-Compliant. L'état ne redevient Compliant qu'après un redémarrage suivi d'une opération Scan : une analyse planifiée après les redémarrages du dimanche actualise les données de conformité, et l'équipe applicative garde le contrôle des redémarrages."
  options:
    a:
      en: "RebootIfNeeded makes Patch Manager restart the servers on Saturday, which removes the control that the application team must keep."
      fr: "RebootIfNeeded fait redémarrer les serveurs par Patch Manager le samedi, ce qui retire le contrôle que l'équipe applicative doit conserver."
    b:
      en: "The compliance level only sets the severity reported for missing patches; it does not change the pending reboot state of the nodes."
      fr: "Le niveau de conformité ne définit que la sévérité signalée pour les correctifs manquants ; il ne change pas l'état d'attente de redémarrage des nœuds."
    c:
      en: "Filtering exported reports hides data instead of refreshing it, so the Patch Manager dashboard would still show the nodes as Non-Compliant."
      fr: "Filtrer les rapports exportés masque des données au lieu de les actualiser : le tableau de bord de Patch Manager afficherait toujours les nœuds comme Non-Compliant."
references:
  - title: "SSM Command document for patching: AWS-RunPatchBaseline - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-aws-runpatchbaseline.html
