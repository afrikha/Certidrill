id: scsc03-3a-viewer-country-cache-key
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A streaming company serves its catalog pages through an Amazon CloudFront distribution with an Application Load Balancer origin. Licensing rules differ by title: a page can be available in one country and unavailable in another. The application must decide, for each title, whether to show the page or a "not available in your country" message, and must record the viewer's country for license audits. The company does not want to license or maintain an IP geolocation database. CloudFront must keep caching the pages, and a viewer must never receive a cached page that was generated for another country.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de streaming sert les pages de son catalogue par une distribution Amazon CloudFront dont l'origine est un Application Load Balancer. Les règles de licence diffèrent selon les titres : une page peut être disponible dans un pays et indisponible dans un autre. L'application doit décider, pour chaque titre, d'afficher la page ou un message « non disponible dans votre pays », et doit enregistrer le pays de l'utilisateur pour les audits de licence. L'entreprise ne veut ni acquérir ni maintenir de base de données de géolocalisation IP. CloudFront doit continuer à mettre les pages en cache, et un utilisateur ne doit jamais recevoir une page en cache générée pour un autre pays.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the CloudFront-Viewer-Country header to the cache policy of the cache behavior so that it is part of the cache key and is sent to the origin.
        fr: |-
          Ajouter l'en-tête CloudFront-Viewer-Country à la politique de cache du comportement de cache afin qu'il fasse partie de la clé de cache et soit envoyé à l'origine.
    - id: b
      text:
        en: |-
          Add the CloudFront-Viewer-Country header to an origin request policy for the cache behavior, and keep the existing cache policy.
        fr: |-
          Ajouter l'en-tête CloudFront-Viewer-Country à une politique de requête d'origine du comportement de cache, et conserver la politique de cache existante.
    - id: c
      text:
        en: |-
          Configure a CloudFront geographic restrictions block list with every country where at least one title is not licensed.
        fr: |-
          Configurer une liste de blocage des restrictions géographiques de CloudFront avec tous les pays où au moins un titre n'est pas sous licence.
    - id: d
      text:
        en: |-
          Have the application read the first address of the X-Forwarded-For header and look up its country in a database that the application team maintains.
        fr: |-
          Faire lire par l'application la première adresse de l'en-tête X-Forwarded-For et rechercher son pays dans une base de données maintenue par l'équipe applicative.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CloudFront can add the CloudFront-Viewer-Country header, which contains the viewer's two-letter ISO country code, so the application can decide per title and log the country. Adding the header to the cache policy includes it in the cache key and forwards it to the origin, so CloudFront caches a separate copy of each page for each country.
    fr: |-
      CloudFront peut ajouter l'en-tête CloudFront-Viewer-Country, qui contient le code de pays ISO à deux lettres de l'utilisateur ; l'application peut donc décider titre par titre et journaliser le pays. Ajouter l'en-tête à la politique de cache l'inclut dans la clé de cache et le transmet à l'origine ; CloudFront met donc en cache une copie distincte de chaque page pour chaque pays.
  options:
    b:
      en: |-
        An origin request policy forwards the header without adding it to the cache key, so a page cached for one country could be served to viewers in another.
      fr: |-
        Une politique de requête d'origine transmet l'en-tête sans l'ajouter à la clé de cache ; une page mise en cache pour un pays pourrait donc être servie à des utilisateurs d'un autre pays.
    c:
      en: |-
        Geographic restrictions apply to the whole distribution at country level, so they would block every title in those countries instead of deciding per title.
      fr: |-
        Les restrictions géographiques s'appliquent à toute la distribution au niveau du pays ; elles bloqueraient donc tous les titres dans ces pays au lieu de décider titre par titre.
    d:
      en: |-
        The company does not want to maintain an IP geolocation database, and this approach does not change the cache key either.
      fr: |-
        L'entreprise ne veut pas maintenir de base de données de géolocalisation IP, et cette approche ne modifie pas non plus la clé de cache.
references:
  - title: Add CloudFront request headers - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
  - title: Restrict the geographic distribution of your content - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html
