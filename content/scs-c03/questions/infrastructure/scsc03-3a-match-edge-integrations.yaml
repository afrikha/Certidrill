id: scsc03-3a-match-edge-integrations
objective: "3.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is integrating its edge protections with AWS and third-party services. The company uses AWS WAF web ACLs on Amazon CloudFront and Application Load Balancers, and Amazon Security Lake for its organization.

    Match each requirement to the component that meets it.

    To answer, drag the appropriate component to each requirement. Each component may be used once or not at all.
  fr: |
    AnyCompany intègre ses protections en périphérie à des services AWS et tiers. L'entreprise utilise des listes ACL web AWS WAF sur Amazon CloudFront et sur des Application Load Balancers, ainsi qu'Amazon Security Lake pour son organisation.

    Associez chaque exigence au composant qui y répond.

    Pour répondre, faites glisser le composant approprié vers chaque exigence. Chaque composant peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - id: mkt
      text:
        en: "AWS Marketplace managed rule group"
        fr: "Groupe de règles géré AWS Marketplace"
    - id: custom
      text:
        en: "Security Lake custom source"
        fr: "Source personnalisée Security Lake"
    - id: s3dest
      text:
        en: "AWS WAF logging to an S3 bucket named aws-waf-logs-archive"
        fr: "Journalisation AWS WAF vers un compartiment S3 nommé aws-waf-logs-archive"
    - id: dataaccess
      text:
        en: "Security Lake subscriber with data access"
        fr: "Abonné Security Lake avec accès aux données"
    - id: queryaccess
      text:
        en: "Security Lake subscriber with query access"
        fr: "Abonné Security Lake avec accès aux requêtes"
    - id: fmsngfw
      text:
        en: "Firewall Manager third-party firewall policy"
        fr: "Politique de pare-feu tiers de Firewall Manager"
  targets:
    - id: t1
      text:
        en: "Apply a security vendor's continuously updated web exploit signatures in the web ACLs"
        fr: "Appliquer dans les listes ACL web les signatures d'exploitation web d'un éditeur de sécurité, mises à jour en continu"
    - id: t2
      text:
        en: "Store the authentication events of an on-premises identity provider in the data lake, normalized to OCSF"
        fr: "Stocker dans le lac de données les événements d'authentification d'un fournisseur d'identité sur site, normalisés en OCSF"
    - id: t3
      text:
        en: "Keep the complete AWS WAF logs of one web ACL for seven years at low cost"
        fr: "Conserver pendant sept ans et à faible coût les journaux AWS WAF complets d'une liste ACL web"
    - id: t4
      text:
        en: "Notify a third-party SIEM of each new object in the data lake so that the SIEM can ingest it"
        fr: "Notifier un SIEM tiers de chaque nouvel objet du lac de données afin que le SIEM puisse l'ingérer"
answer:
  mapping: { t1: mkt, t2: custom, t3: s3dest, t4: dataaccess }
explanation:
  correct:
    en: "Sellers on AWS Marketplace publish managed rule groups that they keep updated and that are added to web ACLs like any rule group. Non-AWS data enters Security Lake as a custom source that delivers OCSF Parquet objects. An S3 bucket whose name starts with aws-waf-logs- is a low-cost AWS WAF logging destination that lifecycle rules can retain for years. A subscriber with data access is notified of new objects, through an HTTPS endpoint or an Amazon SQS queue, and reads them for ingestion."
    fr: "Les vendeurs d'AWS Marketplace publient des groupes de règles gérés qu'ils maintiennent à jour et que l'on ajoute aux listes ACL web comme tout groupe de règles. Les données non AWS entrent dans Security Lake par une source personnalisée qui livre des objets Parquet OCSF. Un compartiment S3 dont le nom commence par aws-waf-logs- est une destination de journalisation AWS WAF peu coûteuse que des règles de cycle de vie peuvent conserver pendant des années. Un abonné avec accès aux données est notifié des nouveaux objets, par un point de terminaison HTTPS ou une file d'attente Amazon SQS, et les lit pour les ingérer."
  options:
    queryaccess:
      en: "Query access lets a subscriber run queries on the Lake Formation tables in place; it sends no notification for new objects."
      fr: "L'accès aux requêtes permet à un abonné d'interroger sur place les tables Lake Formation ; il n'envoie aucune notification pour les nouveaux objets."
    fmsngfw:
      en: "Third-party firewall policies apply network firewalls such as Cloud NGFW to VPCs; they do not add web exploit signatures to web ACLs."
      fr: "Les politiques de pare-feu tiers appliquent des pare-feu réseau comme Cloud NGFW aux VPC ; elles n'ajoutent pas de signatures d'exploitation web aux listes ACL web."
references:
  - title: Subscriber management in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-management.html
  - title: AWS Marketplace managed rule groups - AWS WAF, AWS Firewall Manager, and AWS Shield Advanced
    url: https://docs.aws.amazon.com/waf/latest/developerguide/marketplace-managed-rule-groups.html
