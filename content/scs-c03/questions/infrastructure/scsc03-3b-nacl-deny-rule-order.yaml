id: scsc03-3b-nacl-deny-rule-order
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The network ACL of AnyCompany's public web subnet has inbound rule 100 that allows TCP 443 from 0.0.0.0/0. The security team added inbound rule 200 that denies all traffic from 198.51.100.0/24 to stop an ongoing attack, but requests from that range still reach the web servers.

    What should the security team do?
  fr: |
    L'ACL réseau du sous-réseau web public d'AnyCompany a une règle entrante 100 qui autorise TCP 443 depuis 0.0.0.0/0. L'équipe de sécurité a ajouté une règle entrante 200 qui refuse tout le trafic depuis 198.51.100.0/24 pour arrêter une attaque en cours, mais les requêtes de cette plage atteignent toujours les serveurs web.

    Que doit faire l'équipe de sécurité ?
body:
  options:
    - id: a
      text:
        en: "Add a deny rule for 198.51.100.0/24 to the security group of the web servers."
        fr: "Ajouter une règle de refus pour 198.51.100.0/24 au groupe de sécurité des serveurs web."
    - id: b
      text:
        en: "Replace rule 200 with a deny rule for 198.51.100.0/24 numbered 90."
        fr: "Remplacer la règle 200 par une règle de refus pour 198.51.100.0/24 numérotée 90."
    - id: c
      text:
        en: "Add an outbound deny rule numbered 200 for 198.51.100.0/24."
        fr: "Ajouter une règle sortante de refus numérotée 200 pour 198.51.100.0/24."
    - id: d
      text:
        en: "Associate a second network ACL that contains the deny rule with the same subnet."
        fr: "Associer au même sous-réseau une seconde ACL réseau qui contient la règle de refus."
answer: { optionId: b }
explanation:
  correct:
    en: "Network ACL rules are evaluated in order, starting with the lowest number, and the first rule that matches is applied. Rule 100 allows the attack traffic before rule 200 is reached, so the deny rule needs a lower number than the allow rule."
    fr: "Les règles d'une ACL réseau sont évaluées dans l'ordre, en commençant par le numéro le plus bas, et la première règle correspondante s'applique. La règle 100 autorise le trafic d'attaque avant que la règle 200 ne soit atteinte : la règle de refus doit avoir un numéro inférieur à celui de la règle d'autorisation."
  options:
    a:
      en: "Security groups support allow rules only; they cannot deny a specific range."
      fr: "Les groupes de sécurité ne prennent en charge que des règles d'autorisation ; ils ne peuvent pas refuser une plage précise."
    c:
      en: "The inbound requests are still allowed by rule 100; dropping only the responses would leave the requests reaching the servers."
      fr: "Les requêtes entrantes restent autorisées par la règle 100 ; abandonner seulement les réponses laisserait les requêtes atteindre les serveurs."
    d:
      en: "A subnet can be associated with only one network ACL at a time; a new association replaces the previous one."
      fr: "Un sous-réseau ne peut être associé qu'à une seule ACL réseau à la fois ; une nouvelle association remplace la précédente."
references:
  - title: "Control subnet traffic with network access control lists - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nacl-basics.html
