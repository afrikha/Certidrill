id: scsc03-3b-codesec-default-config
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's Amazon Inspector delegated administrator created a general scan configuration for Amazon Inspector Code Security and applied it to all repositories of the company's GitLab Self-Managed instance. Development teams create about 20 new repositories every month. The security team discovered that repositories created after the configuration was applied are never scanned. Every new repository must be scanned automatically, with no manual step and no custom code.

    Which solution will meet these requirements?
  fr: |
    L'administrateur délégué Amazon Inspector d'AnyCompany a créé une configuration d'analyse générale pour Amazon Inspector Code Security et l'a appliquée à tous les référentiels de l'instance GitLab Self-Managed de l'entreprise. Les équipes de développement créent environ 20 nouveaux référentiels chaque mois. L'équipe de sécurité a découvert que les référentiels créés après l'application de la configuration ne sont jamais analysés. Chaque nouveau référentiel doit être analysé automatiquement, sans étape manuelle ni code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a default scan configuration in the delegated administrator account so that it attaches automatically to new projects."
        fr: "Créer une configuration d'analyse par défaut dans le compte administrateur délégué afin qu'elle s'attache automatiquement aux nouveaux projets."
    - id: b
      text:
        en: "Reapply the general scan configuration to all repositories at the end of every month."
        fr: "Réappliquer la configuration d'analyse générale à tous les référentiels à la fin de chaque mois."
    - id: c
      text:
        en: "Create an Amazon EventBridge rule that invokes an AWS Lambda function to add each new repository to the general scan configuration."
        fr: "Créer une règle Amazon EventBridge qui appelle une fonction AWS Lambda pour ajouter chaque nouveau référentiel à la configuration d'analyse générale."
    - id: d
      text:
        en: "Enable periodic scanning in the general scan configuration so that new repositories are discovered every week."
        fr: "Activer l'analyse périodique dans la configuration d'analyse générale afin que les nouveaux référentiels soient découverts chaque semaine."
answer: { optionId: a }
explanation:
  correct:
    en: "General scan configurations apply only to the repositories that exist when they are applied. Each account and organization can have one default scan configuration, which attaches automatically to new projects, and a default configuration created by the delegated administrator applies at the organization level."
    fr: "Les configurations d'analyse générales ne s'appliquent qu'aux référentiels qui existent au moment de leur application. Chaque compte et chaque organisation peut avoir une configuration d'analyse par défaut, qui s'attache automatiquement aux nouveaux projets, et une configuration par défaut créée par l'administrateur délégué s'applique au niveau de l'organisation."
  options:
    b:
      en: "Reapplying the configuration every month is a manual step and leaves new repositories unscanned for up to a month."
      fr: "Réappliquer la configuration chaque mois est une étape manuelle et laisse les nouveaux référentiels sans analyse pendant jusqu'à un mois."
    c:
      en: "An EventBridge rule with a Lambda function is custom code, which the requirements exclude."
      fr: "Une règle EventBridge avec une fonction Lambda est du code personnalisé, ce que les exigences excluent."
    d:
      en: "Periodic scanning changes when attached repositories are scanned; it does not attach the configuration to repositories created later."
      fr: "L'analyse périodique change le moment où les référentiels rattachés sont analysés ; elle n'attache pas la configuration aux référentiels créés ensuite."
references:
  - title: "Creating a scan configuration - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments-create-configuration.html
