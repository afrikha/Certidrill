id: scsc03-3b-ssm-shell-only-logging
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's session preferences for AWS Systems Manager Session Manager stream session data to Amazon CloudWatch Logs. The database administrators have a policy that allows ssm:StartSession on the database instances and on all Session Manager documents. An audit found that the administrators often connect through Session Manager port forwarding and SSH sessions, and that the commands they run in those sessions do not appear in CloudWatch Logs. The security team requires the commands of every administrative session on these instances to be logged.

    Which solution will meet these requirements?
  fr: |
    Les préférences de session d'AWS Systems Manager Session Manager d'AnyCompany diffusent les données de session vers Amazon CloudWatch Logs. Les administrateurs de bases de données ont une politique qui autorise ssm:StartSession sur les instances de base de données et sur tous les documents Session Manager. Un audit a révélé que les administrateurs se connectent souvent par réacheminement de port (port forwarding) et par sessions SSH via Session Manager, et que les commandes exécutées dans ces sessions n'apparaissent pas dans CloudWatch Logs. L'équipe de sécurité exige que les commandes de chaque session d'administration sur ces instances soient journalisées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn on session logging to Amazon S3 in addition to CloudWatch Logs so that port forwarding and SSH sessions are uploaded when they end."
        fr: "Activer la journalisation des sessions vers Amazon S3 en plus de CloudWatch Logs afin que les sessions de réacheminement de port et SSH soient chargées à leur fin."
    - id: b
      text:
        en: "Turn on AWS KMS encryption of session data in the session preferences so that every session type uses the logged data channel."
        fr: "Activer le chiffrement AWS KMS des données de session dans les préférences de session afin que chaque type de session utilise le canal de données journalisé."
    - id: c
      text:
        en: "Limit the ssm:StartSession resources to the database instances and the SSM-SessionManagerRunShell document so that only shell sessions can start."
        fr: "Limiter les ressources de ssm:StartSession aux instances de base de données et au document SSM-SessionManagerRunShell afin que seules des sessions shell puissent démarrer."
    - id: d
      text:
        en: "Create an AWS CloudTrail trail with data events for Systems Manager so that the commands of every session are recorded."
        fr: "Créer un journal de suivi AWS CloudTrail avec des événements de données pour Systems Manager afin que les commandes de chaque session soient enregistrées."
answer: { optionId: c }
explanation:
  correct:
    en: "Session logging is not available for sessions that connect through port forwarding or SSH, because Session Manager only tunnels that encrypted traffic. Granting ssm:StartSession only on the shell document stops the administrators from starting port forwarding and SSH sessions, which use other documents, so every session runs as a logged shell session."
    fr: "La journalisation des sessions n'est pas disponible pour les sessions qui passent par le réacheminement de port ou SSH, car Session Manager ne fait que tunneliser ce trafic chiffré. N'accorder ssm:StartSession que sur le document shell empêche les administrateurs de démarrer des sessions de réacheminement de port et SSH, qui utilisent d'autres documents : chaque session s'exécute donc comme une session shell journalisée."
  options:
    a:
      en: "The limitation applies to every logging destination: port forwarding and SSH sessions are not logged in Amazon S3 either."
      fr: "La limitation s'applique à toutes les destinations de journalisation : les sessions de réacheminement de port et SSH ne sont pas non plus journalisées dans Amazon S3."
    b:
      en: "KMS encryption protects session data in transit; it does not make port forwarding or SSH sessions loggable."
      fr: "Le chiffrement KMS protège les données de session en transit ; il ne rend pas journalisables les sessions de réacheminement de port ou SSH."
    d:
      en: "CloudTrail records the Session Manager API calls, such as StartSession, not the commands typed inside a session."
      fr: "CloudTrail enregistre les appels d'API de Session Manager, comme StartSession, et non les commandes saisies dans une session."
references:
  - title: "Enabling and disabling session logging - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-logging.html
  - title: "Sample IAM policies for Session Manager - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/getting-started-restrict-access-quickstart.html
