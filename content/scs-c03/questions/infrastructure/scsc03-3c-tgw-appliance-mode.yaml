id: scsc03-3c-tgw-appliance-mode
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany routes all east-west traffic between its 20 spoke VPCs through an inspection VPC that is attached to a transit gateway. The inspection VPC contains AWS Network Firewall endpoints in two Availability Zones, and the firewall policy uses stateful rule groups. Connections between spoke workloads in different Availability Zones are intermittently dropped because the request and the response cross firewall endpoints in different Availability Zones. Stateful inspection must be kept.

    Which change will fix the issue with the LEAST operational overhead?
  fr: |
    AnyCompany achemine tout le trafic est-ouest entre ses 20 VPC en étoile (spoke) par un VPC d'inspection attaché à une passerelle de transit. Le VPC d'inspection contient des points de terminaison AWS Network Firewall dans deux zones de disponibilité, et la politique de pare-feu utilise des groupes de règles avec état. Des connexions entre des charges de travail de VPC en étoile situées dans des zones de disponibilité différentes sont abandonnées par intermittence, car la requête et la réponse traversent des points de terminaison de pare-feu situés dans des zones de disponibilité différentes. L'inspection avec état doit être conservée.

    Quelle modification résout le problème avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable appliance mode on the transit gateway attachment of the inspection VPC.
        fr: |-
          Activer le mode appliance sur l'attachement de passerelle de transit du VPC d'inspection.
    - id: b
      text:
        en: |-
          Enable appliance mode on the transit gateway attachments of the 20 spoke VPCs.
        fr: |-
          Activer le mode appliance sur les attachements de passerelle de transit des 20 VPC en étoile.
    - id: c
      text:
        en: |-
          Enable security group referencing on the transit gateway and on all its VPC attachments.
        fr: |-
          Activer le référencement de groupes de sécurité sur la passerelle de transit et sur tous ses attachements de VPC.
    - id: d
      text:
        en: |-
          Replace the stateful rule groups with stateless rule groups that evaluate each direction separately.
        fr: |-
          Remplacer les groupes de règles avec état par des groupes de règles sans état qui évaluent chaque sens séparément.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Appliance mode is designed for stateful appliances in a VPC attached to a transit gateway. When it is enabled on the attachment of the appliance VPC, the transit gateway keeps using the same Availability Zone of that attachment for the lifetime of a flow, so the request and the response cross the same firewall endpoint.
    fr: |-
      Le mode appliance est conçu pour les appliances avec état d'un VPC attaché à une passerelle de transit. Lorsqu'il est activé sur l'attachement du VPC des appliances, la passerelle de transit continue d'utiliser la même zone de disponibilité de cet attachement pendant toute la durée d'un flux : la requête et la réponse traversent donc le même point de terminaison de pare-feu.
  options:
    b:
      en: |-
        Appliance mode controls the Availability Zone that the transit gateway selects in the attachment where it is enabled; the flows lose symmetry on the inspection VPC attachment, so enabling it on the spokes does not fix the issue.
      fr: |-
        Le mode appliance contrôle la zone de disponibilité que la passerelle de transit choisit dans l'attachement où il est activé ; les flux perdent leur symétrie sur l'attachement du VPC d'inspection, donc l'activer sur les VPC en étoile ne résout pas le problème.
    c:
      en: |-
        Security group referencing lets inbound rules reference security groups in other attached VPCs; it does not influence the Availability Zone that a flow uses.
      fr: |-
        Le référencement de groupes de sécurité permet aux règles entrantes de référencer des groupes de sécurité d'autres VPC attachés ; il n'influence pas la zone de disponibilité qu'utilise un flux.
    d:
      en: |-
        Stateless rules would remove the stateful inspection that must be kept.
      fr: |-
        Des règles sans état supprimeraient l'inspection avec état qui doit être conservée.
references:
  - title: Amazon VPC attachments in AWS Transit Gateway - Amazon VPC
    url: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-vpc-attachments.html
