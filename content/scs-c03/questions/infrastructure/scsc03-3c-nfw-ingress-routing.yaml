id: scsc03-3c-nfw-ingress-routing
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has a VPC (10.0.0.0/16) in one Availability Zone with an internet gateway. Web servers with public IP addresses run in a workload subnet (10.0.2.0/24). The team has created a firewall subnet that contains an AWS Network Firewall endpoint. The security team requires that all traffic between the internet and the web servers be inspected by the firewall in both directions.

    Which routing configuration will meet these requirements?
  fr: |
    AnyCompany dispose d'un VPC (10.0.0.0/16) dans une seule zone de disponibilité avec une passerelle Internet. Des serveurs web dotés d'adresses IP publiques s'exécutent dans un sous-réseau de charge de travail (10.0.2.0/24). L'équipe a créé un sous-réseau de pare-feu qui contient un point de terminaison AWS Network Firewall. L'équipe de sécurité exige que tout le trafic entre Internet et les serveurs web soit inspecté par le pare-feu dans les deux sens.

    Quelle configuration de routage permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Workload subnet route table: 0.0.0.0/0 to the firewall endpoint. Firewall subnet route table: 0.0.0.0/0 to the internet gateway. No route table associated with the internet gateway.
        fr: |-
          Table de routage du sous-réseau de charge de travail : 0.0.0.0/0 vers le point de terminaison du pare-feu. Table de routage du sous-réseau de pare-feu : 0.0.0.0/0 vers la passerelle Internet. Aucune table de routage associée à la passerelle Internet.
    - id: b
      text:
        en: |-
          Route table associated with the internet gateway: 10.0.2.0/24 to the firewall endpoint. Workload subnet route table: 0.0.0.0/0 to the internet gateway. Firewall subnet route table: 0.0.0.0/0 to the internet gateway.
        fr: |-
          Table de routage associée à la passerelle Internet : 10.0.2.0/24 vers le point de terminaison du pare-feu. Table de routage du sous-réseau de charge de travail : 0.0.0.0/0 vers la passerelle Internet. Table de routage du sous-réseau de pare-feu : 0.0.0.0/0 vers la passerelle Internet.
    - id: c
      text:
        en: |-
          Route table associated with the internet gateway: 10.0.2.0/24 to the firewall endpoint. Workload subnet route table: 0.0.0.0/0 to the firewall endpoint. Firewall subnet route table: 0.0.0.0/0 to the internet gateway.
        fr: |-
          Table de routage associée à la passerelle Internet : 10.0.2.0/24 vers le point de terminaison du pare-feu. Table de routage du sous-réseau de charge de travail : 0.0.0.0/0 vers le point de terminaison du pare-feu. Table de routage du sous-réseau de pare-feu : 0.0.0.0/0 vers la passerelle Internet.
    - id: d
      text:
        en: |-
          Route table associated with the internet gateway: 10.0.2.0/24 to the firewall endpoint. Workload subnet route table: 0.0.0.0/0 to the firewall endpoint. Firewall subnet route table: 0.0.0.0/0 to the firewall endpoint.
        fr: |-
          Table de routage associée à la passerelle Internet : 10.0.2.0/24 vers le point de terminaison du pare-feu. Table de routage du sous-réseau de charge de travail : 0.0.0.0/0 vers le point de terminaison du pare-feu. Table de routage du sous-réseau de pare-feu : 0.0.0.0/0 vers le point de terminaison du pare-feu.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      For north-south inspection, a route table with an edge association to the internet gateway sends inbound traffic for the workload subnet to the firewall endpoint. The workload subnet sends its default route to the firewall endpoint, and the firewall subnet sends its default route to the internet gateway, so traffic crosses the firewall symmetrically in both directions.
    fr: |-
      Pour l'inspection nord-sud, une table de routage associée à la passerelle Internet (association de périphérie) envoie le trafic entrant destiné au sous-réseau de charge de travail vers le point de terminaison du pare-feu. Le sous-réseau de charge de travail envoie sa route par défaut vers le point de terminaison du pare-feu, et le sous-réseau de pare-feu envoie sa route par défaut vers la passerelle Internet : le trafic traverse donc le pare-feu de façon symétrique dans les deux sens.
  options:
    a:
      en: |-
        Without an edge association, the internet gateway delivers inbound traffic directly to the workload subnet through the local route, so inbound traffic bypasses the firewall.
      fr: |-
        Sans association de périphérie, la passerelle Internet livre le trafic entrant directement au sous-réseau de charge de travail par la route locale : le trafic entrant contourne donc le pare-feu.
    b:
      en: |-
        Return and outbound traffic from the web servers goes straight to the internet gateway, so it is not inspected and the flows are asymmetric.
      fr: |-
        Le trafic de retour et le trafic sortant des serveurs web vont directement à la passerelle Internet : ils ne sont donc pas inspectés et les flux sont asymétriques.
    d:
      en: |-
        A default route from the firewall subnet back to the firewall endpoint creates a loop, so inspected traffic never reaches the internet gateway.
      fr: |-
        Une route par défaut du sous-réseau de pare-feu vers le point de terminaison du pare-feu crée une boucle : le trafic inspecté n'atteint jamais la passerelle Internet.
references:
  - title: Simple single zone architecture with an internet gateway using AWS Network Firewall - AWS Network Firewall
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/arch-single-zone-igw.html
