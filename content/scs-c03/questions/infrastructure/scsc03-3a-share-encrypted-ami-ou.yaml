id: scsc03-3a-share-encrypted-ami-ou
objective: "3.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's image account owns a hardened golden AMI whose EBS snapshots are encrypted with the AWS managed key aws/ebs. The security team must share the AMI with every account in the Workloads organizational unit (OU) through launch permissions, without copying the AMI into each account. Accounts that are added to the OU later must be able to launch instances from the AMI without further changes.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Le compte d'images d'AnyCompany possède une AMI de référence renforcée dont les instantanés EBS sont chiffrés avec la clé gérée par AWS aws/ebs. L'équipe de sécurité doit partager l'AMI avec tous les comptes de l'unité d'organisation (UO) Workloads au moyen d'autorisations de lancement, sans copier l'AMI dans chaque compte. Les comptes ajoutés ultérieurement à l'UO doivent pouvoir lancer des instances à partir de l'AMI sans autre modification.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Edit the key policy of the aws/ebs key to allow principals in the Workloads OU to use the key.
        fr: |-
          Modifier la politique de la clé aws/ebs pour autoriser les principaux de l'UO Workloads à utiliser la clé.
    - id: b
      text:
        en: |-
          Copy the AMI with its snapshots re-encrypted under a customer managed KMS key, and add the OU's ARN to the launch permissions of the new AMI.
        fr: |-
          Copier l'AMI en rechiffrant ses instantanés avec une clé KMS gérée par le client, et ajouter l'ARN de l'UO aux autorisations de lancement de la nouvelle AMI.
    - id: c
      text:
        en: |-
          Share the AMI's EBS snapshots with each account in the OU, and keep the existing AMI and its launch permissions.
        fr: |-
          Partager les instantanés EBS de l'AMI avec chaque compte de l'UO, et conserver l'AMI existante et ses autorisations de lancement.
    - id: d
      text:
        en: |-
          Enable EBS encryption by default with the aws/ebs key in every account of the OU.
        fr: |-
          Activer le chiffrement EBS par défaut avec la clé aws/ebs dans chaque compte de l'UO.
    - id: e
      text:
        en: |-
          Add a key policy statement to the customer managed key that allows kms:DescribeKey, kms:CreateGrant, kms:Decrypt, kms:ReEncrypt*, and kms:GenerateDataKey* when aws:PrincipalOrgPaths matches the OU's path.
        fr: |-
          Ajouter à la politique de la clé gérée par le client une instruction qui autorise kms:DescribeKey, kms:CreateGrant, kms:Decrypt, kms:ReEncrypt* et kms:GenerateDataKey* lorsque aws:PrincipalOrgPaths correspond au chemin de l'UO.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      AMIs backed by snapshots encrypted with the default AWS managed key cannot be shared, so the AMI must first be copied with its snapshots encrypted under a customer managed key, and the copy is then shared with the OU. The target accounts must also be allowed to use that key; a key policy condition on aws:PrincipalOrgPaths covers every current and future account of the OU without listing account IDs. The snapshots themselves do not need to be shared.
    fr: |-
      Les AMI reposant sur des instantanés chiffrés avec la clé gérée par AWS par défaut ne peuvent pas être partagées ; l'AMI doit donc d'abord être copiée avec ses instantanés chiffrés sous une clé gérée par le client, puis la copie est partagée avec l'UO. Les comptes cibles doivent aussi être autorisés à utiliser cette clé ; une condition de politique de clé sur aws:PrincipalOrgPaths couvre chaque compte actuel et futur de l'UO sans lister d'ID de compte. Les instantanés eux-mêmes n'ont pas besoin d'être partagés.
  options:
    a:
      en: |-
        The key policies of AWS managed keys cannot be edited, which is why AMIs encrypted with aws/ebs cannot be shared.
      fr: |-
        Les politiques des clés gérées par AWS ne peuvent pas être modifiées, et c'est pourquoi les AMI chiffrées avec aws/ebs ne peuvent pas être partagées.
    c:
      en: |-
        Sharing the snapshots is not required for a shared AMI, and the snapshots would still be encrypted with a key that other accounts cannot use.
      fr: |-
        Le partage des instantanés n'est pas nécessaire pour une AMI partagée, et les instantanés resteraient chiffrés avec une clé que les autres comptes ne peuvent pas utiliser.
    d:
      en: |-
        Default encryption in the target accounts uses each account's own aws/ebs key and gives them no access to the image account's key.
      fr: |-
        Le chiffrement par défaut dans les comptes cibles utilise la propre clé aws/ebs de chaque compte et ne leur donne aucun accès à la clé du compte d'images.
references:
  - title: Share an AMI with specific AWS accounts - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/sharingamis-explicit.html
