id: scsc03-3a-cloudfront-webacl-region
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security engineer must protect an Amazon CloudFront distribution whose origin is an Application Load Balancer in eu-west-1. The engineer creates an AWS WAF web ACL with the AWS CLI by using the --scope REGIONAL and --region eu-west-1 parameters. The web ACL does not appear in the list of web ACLs that can be selected for the distribution.

    What should the engineer do to protect the distribution?
  fr: |
    Un ingénieur sécurité doit protéger une distribution Amazon CloudFront dont l'origine est un Application Load Balancer dans eu-west-1. L'ingénieur crée une liste ACL web AWS WAF avec l'AWS CLI en utilisant les paramètres --scope REGIONAL et --region eu-west-1. La liste ACL web n'apparaît pas dans la liste des listes ACL web que l'on peut choisir pour la distribution.

    Que doit faire l'ingénieur pour protéger la distribution ?
body:
  options:
    - id: a
      text:
        en: |-
          Re-create the web ACL in us-east-1 with the --scope CLOUDFRONT parameter, and set its ARN on the distribution.
        fr: |-
          Recréer la liste ACL web dans us-east-1 avec le paramètre --scope CLOUDFRONT, et définir son ARN sur la distribution.
    - id: b
      text:
        en: |-
          Re-create the web ACL in eu-west-1 with the --scope CLOUDFRONT parameter, and set its ARN on the distribution.
        fr: |-
          Recréer la liste ACL web dans eu-west-1 avec le paramètre --scope CLOUDFRONT, et définir son ARN sur la distribution.
    - id: c
      text:
        en: |-
          Run aws wafv2 associate-web-acl in eu-west-1 with the ARN of the distribution as the resource ARN.
        fr: |-
          Exécuter aws wafv2 associate-web-acl dans eu-west-1 avec l'ARN de la distribution comme ARN de ressource.
    - id: d
      text:
        en: |-
          Keep the Regional web ACL, and associate it with the Application Load Balancer origin instead of the distribution.
        fr: |-
          Conserver la liste ACL web régionale, et l'associer à l'Application Load Balancer d'origine plutôt qu'à la distribution.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Web ACLs for CloudFront distributions are global resources whose Region is fixed to US East (N. Virginia), us-east-1, with the CLOUDFRONT scope. The engineer creates the web ACL there and sets its ARN as the distribution's web ACL, so requests are inspected at the edge before they reach the origin.
    fr: |-
      Les listes ACL web des distributions CloudFront sont des ressources globales dont la Région est fixée à USA Est (Virginie du Nord), us-east-1, avec la portée CLOUDFRONT. L'ingénieur crée la liste ACL web dans cette Région et définit son ARN comme liste ACL web de la distribution ; les requêtes sont ainsi inspectées en périphérie avant d'atteindre l'origine.
  options:
    b:
      en: |-
        The CLOUDFRONT scope is available only in us-east-1, so the web ACL cannot be created with that scope in eu-west-1.
      fr: |-
        La portée CLOUDFRONT n'est disponible que dans us-east-1 ; la liste ACL web ne peut donc pas être créée avec cette portée dans eu-west-1.
    c:
      en: |-
        A Regional web ACL can be associated only with Regional resources in its own Region, never with a CloudFront distribution.
      fr: |-
        Une liste ACL web régionale ne peut être associée qu'à des ressources régionales de sa propre Région, jamais à une distribution CloudFront.
    d:
      en: |-
        Inspecting at the load balancer leaves the distribution itself unprotected and lets malicious requests consume edge and origin capacity first.
      fr: |-
        Inspecter au niveau de l'équilibreur de charge laisse la distribution elle-même sans protection et laisse les requêtes malveillantes consommer d'abord la capacité de la périphérie et de l'origine.
references:
  - title: Creating a protection pack (web ACL) in AWS WAF - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-creating.html
