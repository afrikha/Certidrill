id: scsc03-3c-va-share-group-ram
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security account owns an AWS Verified Access instance, its trust providers, and a Verified Access group whose policy the security team maintains. Application teams in 15 other accounts of the same organization in AWS Organizations run internal web applications behind internal load balancers in their own VPCs. Each team must publish its applications through the security team's group from its own account, and the teams must not be able to change the group policy. The security team wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Le compte de sécurité d'AnyCompany possède une instance AWS Verified Access, ses fournisseurs de confiance et un groupe Verified Access dont l'équipe de sécurité gère la politique. Des équipes applicatives de 15 autres comptes de la même organisation AWS Organizations exécutent des applications web internes derrière des équilibreurs de charge internes dans leurs propres VPC. Chaque équipe doit publier ses applications par le groupe de l'équipe de sécurité depuis son propre compte, et les équipes ne doivent pas pouvoir modifier la politique du groupe. L'équipe de sécurité veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Verified Access instance, trust providers and a group in each application account, and copy the security team's group policy to each new group.
        fr: |-
          Créer une instance Verified Access, des fournisseurs de confiance et un groupe dans chaque compte applicatif, et copier la politique du groupe de l'équipe de sécurité dans chaque nouveau groupe.
    - id: b
      text:
        en: |-
          Share the Verified Access group with the organization through AWS RAM, and let each application team create Verified Access endpoints in the shared group from its own account.
        fr: |-
          Partager le groupe Verified Access avec l'organisation par AWS RAM, et laisser chaque équipe applicative créer des points de terminaison Verified Access dans le groupe partagé depuis son propre compte.
    - id: c
      text:
        en: |-
          Share the subnets of the application VPCs with the security account through AWS RAM, and have the security team create and update every endpoint on request.
        fr: |-
          Partager les sous-réseaux des VPC applicatifs avec le compte de sécurité par AWS RAM, et faire créer et mettre à jour chaque point de terminaison par l'équipe de sécurité sur demande.
    - id: d
      text:
        en: |-
          Create an IAM role in the security account that the application teams assume to create endpoints in the group that target the load balancers in their accounts.
        fr: |-
          Créer dans le compte de sécurité un rôle IAM que les équipes applicatives assument pour créer dans le groupe des points de terminaison qui ciblent les équilibreurs de charge de leurs comptes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Verified Access group can be shared through AWS RAM with the organization, OUs or specific accounts. Consumer accounts can then create endpoints in the shared group for their own resources, while access decisions keep using the policies that the owner account maintains; consumers cannot share the group again and cannot see the endpoints of other accounts.
    fr: |-
      Un groupe Verified Access peut être partagé par AWS RAM avec l'organisation, des unités d'organisation ou des comptes précis. Les comptes consommateurs peuvent alors créer dans le groupe partagé des points de terminaison pour leurs propres ressources, tandis que les décisions d'accès continuent d'utiliser les politiques gérées par le compte propriétaire ; les consommateurs ne peuvent pas repartager le groupe ni voir les points de terminaison des autres comptes.
  options:
    a:
      en: |-
        Fifteen instances and copied policies multiply the resources to operate, and the application teams would own the copies and could change them.
      fr: |-
        Quinze instances et des politiques copiées multiplient les ressources à exploiter, et les équipes applicatives posséderaient les copies et pourraient les modifier.
    c:
      en: |-
        Endpoints can be created in shared subnets, but the security team would have to create and maintain every endpoint, which adds operational overhead and removes self-service from the teams.
      fr: |-
        Des points de terminaison peuvent être créés dans des sous-réseaux partagés, mais l'équipe de sécurité devrait créer et maintenir chaque point de terminaison, ce qui ajoute de la charge opérationnelle et retire l'autonomie des équipes.
    d:
      en: |-
        An endpoint created in the security account must target a load balancer in a VPC available to that account; assuming a role does not let it target load balancers in other accounts' VPCs.
      fr: |-
        Un point de terminaison créé dans le compte de sécurité doit cibler un équilibreur de charge d'un VPC disponible pour ce compte ; assumer un rôle ne lui permet pas de cibler les équilibreurs de charge des VPC d'autres comptes.
