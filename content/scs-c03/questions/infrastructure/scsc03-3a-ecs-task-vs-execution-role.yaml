id: scsc03-3a-ecs-task-vs-execution-role
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Amazon ECS service runs on AWS Fargate. Its task definition pulls an image from a private Amazon ECR repository, sends logs with the awslogs driver, and injects a database password from AWS Secrets Manager into an environment variable through the secrets parameter. The secret is encrypted with a customer managed AWS KMS key. The application code writes items to one Amazon DynamoDB table. The security team requires least privilege, and the application containers must not receive permissions that only the ECS agent needs.

    Which combination of role configurations will meet these requirements? (Choose two.)
  fr: |
    Un service Amazon ECS s'exécute sur AWS Fargate. Sa définition de tâche extrait une image d'un référentiel Amazon ECR privé, envoie ses journaux avec le pilote awslogs et injecte un mot de passe de base de données d'AWS Secrets Manager dans une variable d'environnement au moyen du paramètre secrets. Le secret est chiffré avec une clé AWS KMS gérée par le client. Le code de l'application écrit des éléments dans une table Amazon DynamoDB. L'équipe de sécurité exige le moindre privilège, et les conteneurs de l'application ne doivent pas recevoir d'autorisations dont seul l'agent ECS a besoin.

    Quelle combinaison de configurations de rôles permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Task role: dynamodb:PutItem on the table.
        fr: |-
          Rôle de tâche : dynamodb:PutItem sur la table.
    - id: b
      text:
        en: |-
          Task role: secretsmanager:GetSecretValue on the secret and kms:Decrypt on the key.
        fr: |-
          Rôle de tâche : secretsmanager:GetSecretValue sur le secret et kms:Decrypt sur la clé.
    - id: c
      text:
        en: |-
          Task execution role: AmazonECSTaskExecutionRolePolicy, plus secretsmanager:GetSecretValue on the secret and kms:Decrypt on the key.
        fr: |-
          Rôle d'exécution de tâche : AmazonECSTaskExecutionRolePolicy, plus secretsmanager:GetSecretValue sur le secret et kms:Decrypt sur la clé.
    - id: d
      text:
        en: |-
          Task execution role: dynamodb:PutItem on the table, in addition to AmazonECSTaskExecutionRolePolicy.
        fr: |-
          Rôle d'exécution de tâche : dynamodb:PutItem sur la table, en plus d'AmazonECSTaskExecutionRolePolicy.
    - id: e
      text:
        en: |-
          Container instance role: AmazonEC2ContainerServiceforEC2Role, plus dynamodb:PutItem on the table.
        fr: |-
          Rôle d'instance de conteneur : AmazonEC2ContainerServiceforEC2Role, plus dynamodb:PutItem sur la table.
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      The task execution role is used by the ECS and Fargate agents, not by the containers: AmazonECSTaskExecutionRolePolicy covers the ECR pull and CloudWatch Logs, and secrets injected through the task definition need secretsmanager:GetSecretValue and kms:Decrypt for a customer managed key. The task role provides the credentials that the application code uses, so it gets only the DynamoDB write permission.
    fr: |-
      Le rôle d'exécution de tâche est utilisé par les agents ECS et Fargate, pas par les conteneurs : AmazonECSTaskExecutionRolePolicy couvre l'extraction ECR et CloudWatch Logs, et les secrets injectés par la définition de tâche exigent secretsmanager:GetSecretValue et kms:Decrypt pour une clé gérée par le client. Le rôle de tâche fournit les informations d'identification qu'utilise le code de l'application ; il ne reçoit donc que l'autorisation d'écriture DynamoDB.
  options:
    b:
      en: |-
        The agent injects the secret with the task execution role, so these permissions in the task role give the containers access they do not need.
      fr: |-
        L'agent injecte le secret avec le rôle d'exécution de tâche ; ces autorisations dans le rôle de tâche donnent donc aux conteneurs un accès dont ils n'ont pas besoin.
    d:
      en: |-
        The application code cannot use the task execution role's credentials, so its DynamoDB writes would fail.
      fr: |-
        Le code de l'application ne peut pas utiliser les informations d'identification du rôle d'exécution de tâche ; ses écritures DynamoDB échoueraient donc.
    e:
      en: |-
        Fargate tasks do not run on container instances that you manage, so there is no container instance role to configure.
      fr: |-
        Les tâches Fargate ne s'exécutent pas sur des instances de conteneur que vous gérez ; il n'y a donc pas de rôle d'instance de conteneur à configurer.
references:
  - title: Amazon ECS task execution IAM role - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html
