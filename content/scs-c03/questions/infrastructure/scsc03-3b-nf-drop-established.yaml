id: scsc03-3b-nf-drop-established
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany inspects all egress traffic from its workload VPC with AWS Network Firewall. The firewall policy uses strict rule order, the stateless default action forwards packets to the stateful rule groups, and a stateful domain list rule group allows HTTP and HTTPS traffic only to .example.com and .amazonaws.com. The stateful default action is set to Drop all. Since deployment, every HTTPS connection fails, including connections to the allowed domains. All other domains must stay blocked.

    Which change will meet these requirements?
  fr: |
    AnyCompany inspecte tout le trafic sortant de son VPC de charges de travail avec AWS Network Firewall. La politique de pare-feu utilise l'ordre strict des règles, l'action sans état par défaut transfère les paquets aux groupes de règles avec état, et un groupe de règles avec état de liste de domaines n'autorise le trafic HTTP et HTTPS que vers .example.com et .amazonaws.com. L'action avec état par défaut est définie sur Drop all. Depuis le déploiement, chaque connexion HTTPS échoue, y compris vers les domaines autorisés. Tous les autres domaines doivent rester bloqués.

    Quelle modification répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Change the stateful default action from Drop all to Drop established."
        fr: "Remplacer l'action avec état par défaut Drop all par Drop established."
    - id: b
      text:
        en: "Change the stateful default action from Drop all to Alert all."
        fr: "Remplacer l'action avec état par défaut Drop all par Alert all."
    - id: c
      text:
        en: "Add a stateless rule with priority 1 that passes all TCP 443 traffic."
        fr: "Ajouter une règle sans état de priorité 1 qui laisse passer tout le trafic TCP 443."
    - id: d
      text:
        en: "Add a TLS inspection configuration to the firewall so that the domain list can read the SNI."
        fr: "Ajouter une configuration d'inspection TLS au pare-feu afin que la liste de domaines puisse lire le SNI."
answer: { optionId: a }
explanation:
  correct:
    en: "With strict order, Network Firewall needs an established connection to decide whether domain list rules pass or drop the packets. Drop all drops the TCP handshake before the TLS SNI or HTTP Host can be evaluated; Drop established lets the handshake complete and drops only established traffic that no pass rule matched, so other domains stay blocked."
    fr: "Avec l'ordre strict, Network Firewall a besoin d'une connexion établie pour décider si les règles de liste de domaines laissent passer ou abandonnent les paquets. Drop all abandonne l'établissement de la connexion TCP avant que le SNI TLS ou l'en-tête HTTP Host puissent être évalués ; Drop established laisse l'établissement aboutir et n'abandonne que le trafic établi qu'aucune règle de passage n'a accepté : les autres domaines restent bloqués."
  options:
    b:
      en: "Alert all only logs packets and drops nothing, so traffic to every domain would be allowed."
      fr: "Alert all ne fait que journaliser les paquets et n'abandonne rien : le trafic vers tous les domaines serait autorisé."
    c:
      en: "A stateless pass action sends the packets straight through without stateful inspection, so HTTPS to every domain would be allowed."
      fr: "Une action de passage sans état laisse passer les paquets directement sans inspection avec état : le HTTPS vers tous les domaines serait autorisé."
    d:
      en: "Domain list rules match the unencrypted SNI of the TLS client hello without TLS inspection; the failures come from the default drop action."
      fr: "Les règles de liste de domaines correspondent au SNI non chiffré du message TLS client hello sans inspection TLS ; les échecs proviennent de l'action d'abandon par défaut."
references:
  - title: "Managing evaluation order for Suricata compatible rules in AWS Network Firewall - AWS Network Firewall"
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/suricata-rule-evaluation-order.html
