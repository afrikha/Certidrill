id: scsc03-3b-match-owasp-llm-controls
objective: "3.2.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is reviewing a generative AI customer service application on Amazon Bedrock against the OWASP Top 10 for LLM Applications. The application uses a Bedrock agent with action groups, a knowledge base, and a public API.

    Match each risk to the control that mitigates it.

    To answer, drag the appropriate control to each risk. Each control may be used once or not at all.
  fr: |
    AnyCompany évalue une application de service client d'IA générative sur Amazon Bedrock par rapport au Top 10 de l'OWASP pour les applications LLM. L'application utilise un agent Bedrock avec des groupes d'actions, une base de connaissances et une API publique.

    Associez chaque risque au contrôle qui l'atténue.

    Pour répondre, faites glisser le contrôle approprié vers chaque risque. Chaque contrôle peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: attack, text: { en: "Guardrail prompt attack filter on tagged user input", fr: "Filtre d'attaques par invite d'une barrière de protection sur la saisie utilisateur balisée" } }
    - { id: pii, text: { en: "Guardrail sensitive information filter that masks PII in responses", fr: "Filtre d'informations sensibles d'une barrière de protection qui masque les PII dans les réponses" } }
    - { id: confirm, text: { en: "User confirmation on action group functions and least-privilege action roles", fr: "Confirmation de l'utilisateur sur les fonctions des groupes d'actions et rôles d'action à privilège minimal" } }
    - { id: rate, text: { en: "AWS WAF rate-based rule on the API and a maxTokens limit on model requests", fr: "Règle AWS WAF basée sur le débit sur l'API et limite maxTokens sur les requêtes au modèle" } }
    - { id: ground, text: { en: "Guardrail contextual grounding check", fr: "Vérification d'ancrage contextuel d'une barrière de protection" } }
    - { id: sign, text: { en: "Lambda code signing with AWS Signer", fr: "Signature de code Lambda avec AWS Signer" } }
  targets:
    - id: t1
      text: { en: "Prompt injection", fr: "Injection d'invite (prompt injection)" }
    - id: t2
      text: { en: "Sensitive information disclosure", fr: "Divulgation d'informations sensibles (sensitive information disclosure)" }
    - id: t3
      text: { en: "Excessive agency", fr: "Autonomie excessive (excessive agency)" }
    - id: t4
      text: { en: "Unbounded consumption", fr: "Consommation non bornée (unbounded consumption)" }
    - id: t5
      text: { en: "Misinformation", fr: "Désinformation (misinformation)" }
answer:
  mapping: { t1: attack, t2: pii, t3: confirm, t4: rate, t5: ground }
explanation:
  correct:
    en: "The prompt attack filter detects jailbreaks and injections in tagged user input. The sensitive information filter blocks or masks PII in prompts and responses. User confirmation and narrowly scoped roles keep an agent from taking sensitive actions on its own. Rate limits and output token caps bound resource use, and contextual grounding checks block answers that the source documents do not support."
    fr: "Le filtre d'attaques par invite détecte les jailbreaks et les injections dans la saisie utilisateur balisée. Le filtre d'informations sensibles bloque ou masque les PII dans les invites et les réponses. La confirmation de l'utilisateur et des rôles strictement limités empêchent un agent d'effectuer seul des actions sensibles. Les limites de débit et les plafonds de jetons de sortie bornent l'utilisation des ressources, et les vérifications d'ancrage contextuel bloquent les réponses que les documents sources n'étayent pas."
  options:
    sign:
      en: "Code signing protects the integrity of deployed function code, a supply chain control that does not mitigate any of the listed risks."
      fr: "La signature de code protège l'intégrité du code des fonctions déployées, un contrôle de chaîne d'approvisionnement qui n'atténue aucun des risques listés."
references:
  - title: "Create your guardrail - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-components.html
  - title: "Get user confirmation before invoking action group function - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-userconfirmation.html
