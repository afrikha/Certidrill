id: scsc03-3c-va-endpoint-sg-reference
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany publishes an internal web application through an AWS Verified Access load balancer endpoint that targets an internal Application Load Balancer. The security group of the load balancer still allows inbound HTTPS from the whole VPC CIDR and from the on-premises network ranges. The security team requires that the application accept connections only from Verified Access.

    Which solution will meet these requirements?
  fr: |
    AnyCompany publie une application web interne par un point de terminaison d'équilibreur de charge AWS Verified Access qui cible un Application Load Balancer interne. Le groupe de sécurité de l'équilibreur de charge autorise toujours le trafic HTTPS entrant depuis tout le CIDR du VPC et depuis les plages réseau du site. L'équipe de sécurité exige que l'application n'accepte de connexions qu'en provenance de Verified Access.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Associate with the Verified Access instance an AWS WAF web ACL that blocks requests from the VPC CIDR and from the on-premises ranges.
        fr: |-
          Associer à l'instance Verified Access une liste ACL web AWS WAF qui bloque les requêtes provenant du CIDR du VPC et des plages du site.
    - id: b
      text:
        en: |-
          Add network ACL rules that deny the on-premises ranges to the subnets of the load balancer, and keep the security group rule for the VPC CIDR.
        fr: |-
          Ajouter aux sous-réseaux de l'équilibreur de charge des règles de liste ACL réseau qui refusent les plages du site, et conserver la règle de groupe de sécurité pour le CIDR du VPC.
    - id: c
      text:
        en: |-
          Replace the inbound rules of the load balancer's security group with one HTTPS rule whose source is the security group of the Verified Access endpoint.
        fr: |-
          Remplacer les règles entrantes du groupe de sécurité de l'équilibreur de charge par une seule règle HTTPS dont la source est le groupe de sécurité du point de terminaison Verified Access.
    - id: d
      text:
        en: |-
          Attach to the Verified Access endpoint a policy that forbids requests from the VPC CIDR and from the on-premises ranges.
        fr: |-
          Attacher au point de terminaison Verified Access une politique qui interdit les requêtes provenant du CIDR du VPC et des plages du site.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Verified Access endpoint has its own security groups. To make the target accept traffic only from the endpoint, add an inbound rule to the target's security group that references the endpoint's security group, and remove the other inbound rules.
    fr: |-
      Un point de terminaison Verified Access a ses propres groupes de sécurité. Pour que la cible n'accepte que le trafic du point de terminaison, ajoutez au groupe de sécurité de la cible une règle entrante qui référence le groupe de sécurité du point de terminaison, et supprimez les autres règles entrantes.
  options:
    a:
      en: |-
        A web ACL associated with the Verified Access instance inspects only the requests that pass through Verified Access; direct connections to the load balancer bypass it.
      fr: |-
        Une liste ACL web associée à l'instance Verified Access n'inspecte que les requêtes qui passent par Verified Access ; les connexions directes à l'équilibreur de charge la contournent.
    b:
      en: |-
        The rule for the VPC CIDR still lets any resource in the VPC connect to the load balancer directly.
      fr: |-
        La règle pour le CIDR du VPC permet toujours à n'importe quelle ressource du VPC de se connecter directement à l'équilibreur de charge.
    d:
      en: |-
        An endpoint policy evaluates only requests that reach Verified Access; it does not stop clients that connect to the load balancer without going through Verified Access.
      fr: |-
        Une politique de point de terminaison n'évalue que les requêtes qui atteignent Verified Access ; elle n'empêche pas les clients de se connecter à l'équilibreur de charge sans passer par Verified Access.
references:
  - title: Allow traffic that originates from your Verified Access endpoint - AWS Verified Access
    url: https://docs.aws.amazon.com/verified-access/latest/ug/configure-endpoint-security-group.html
