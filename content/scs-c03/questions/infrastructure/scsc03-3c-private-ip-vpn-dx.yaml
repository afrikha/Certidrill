id: scsc03-3c-private-ip-vpn-dx
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany connects its data center to 30 VPCs through an AWS Direct Connect dedicated connection, a transit virtual interface, a Direct Connect gateway and a transit gateway. An auditor requires that all traffic over the Direct Connect link be encrypted with IPsec. The security team does not want any public IP address on the tunnels, does not want a public virtual interface, and does not want to operate third-party VPN appliances in AWS.

    Which solution will meet these requirements?
  fr: |
    AnyCompany connecte son centre de données à 30 VPC par une connexion dédiée AWS Direct Connect, une interface virtuelle de transit, une passerelle Direct Connect et une passerelle de transit. Un auditeur exige que tout le trafic sur la liaison Direct Connect soit chiffré avec IPsec. L'équipe de sécurité ne veut aucune adresse IP publique sur les tunnels, ne veut pas d'interface virtuelle publique et ne veut pas exploiter d'appliances VPN tierces dans AWS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a public virtual interface on the connection, and create Site-to-Site VPN connections from the customer gateway to the transit gateway over that interface.
        fr: |-
          Créer une interface virtuelle publique sur la connexion, et créer des connexions Site-to-Site VPN de la passerelle client vers la passerelle de transit sur cette interface.
    - id: b
      text:
        en: |-
          Turn on MACsec for the existing Direct Connect connection, and set the encryption mode of the connection to must_encrypt.
        fr: |-
          Activer MACsec sur la connexion Direct Connect existante, et définir le mode de chiffrement de la connexion sur must_encrypt.
    - id: c
      text:
        en: |-
          Deploy VPN appliances from AWS Marketplace in a central VPC, and route the on-premises traffic through IPsec tunnels that end on them.
        fr: |-
          Déployer des appliances VPN d'AWS Marketplace dans un VPC central, et acheminer le trafic sur site par des tunnels IPsec qui se terminent sur ces appliances.
    - id: d
      text:
        en: |-
          Add a private CIDR block to the transit gateway and to the allowed prefixes of the gateway association, and create a private IP Site-to-Site VPN over the Direct Connect attachment.
        fr: |-
          Ajouter un bloc CIDR privé à la passerelle de transit et aux préfixes autorisés de l'association de passerelles, et créer un Site-to-Site VPN à adresses IP privées sur l'attachement Direct Connect.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A private IP VPN runs IPsec over a Direct Connect transit virtual interface and uses private (RFC 1918 or RFC 6598) addresses on both ends of the tunnels. It requires a private IP CIDR on the transit gateway, a Direct Connect gateway associated with the transit gateway whose allowed prefixes include that CIDR, and no public virtual interface or third-party VPN equipment.
    fr: |-
      Un VPN à adresses IP privées fait passer IPsec sur une interface virtuelle de transit Direct Connect et utilise des adresses privées (RFC 1918 ou RFC 6598) aux deux extrémités des tunnels. Il exige un CIDR d'adresses IP privées sur la passerelle de transit, une passerelle Direct Connect associée à la passerelle de transit dont les préfixes autorisés incluent ce CIDR, et ni interface virtuelle publique ni équipement VPN tiers.
  options:
    a:
      en: |-
        A Site-to-Site VPN over a public virtual interface uses public tunnel endpoints and a public virtual interface, which the security team rejects.
      fr: |-
        Un Site-to-Site VPN sur une interface virtuelle publique utilise des points de terminaison de tunnel publics et une interface virtuelle publique, ce que l'équipe de sécurité refuse.
    b:
      en: |-
        MACsec is point-to-point layer 2 encryption between the router and the Direct Connect device, not the IPsec encryption that the auditor requires.
      fr: |-
        MACsec est un chiffrement de couche 2 de point à point entre le routeur et l'équipement Direct Connect, pas le chiffrement IPsec qu'exige l'auditeur.
    c:
      en: |-
        Third-party VPN appliances would encrypt the traffic, but the security team does not want to deploy or operate them.
      fr: |-
        Des appliances VPN tierces chiffreraient le trafic, mais l'équipe de sécurité ne veut ni les déployer ni les exploiter.
references:
  - title: Private IP AWS Site-to-Site VPN with Direct Connect - AWS Site-to-Site VPN
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/private-ip-dx.html
