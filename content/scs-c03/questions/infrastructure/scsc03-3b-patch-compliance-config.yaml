id: scsc03-3b-patch-compliance-config
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 40 accounts in AWS Organizations and patches its Amazon EC2 instances with AWS Systems Manager Patch Manager patch policies. AWS Config records all resource types in every account and Region, and the security tooling account is the AWS Config delegated administrator. The security team needs a continuously updated AWS Config view, in the security tooling account, of the managed instances that are not compliant with their patch baseline in every account and Region. The team wants the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany possède 40 comptes dans AWS Organizations et applique les correctifs de ses instances Amazon EC2 avec des politiques de correctifs AWS Systems Manager Patch Manager. AWS Config enregistre tous les types de ressources dans chaque compte et chaque Région, et le compte d'outils de sécurité est l'administrateur délégué d'AWS Config. L'équipe de sécurité a besoin, dans le compte d'outils de sécurité, d'une vue AWS Config mise à jour en continu des instances gérées qui ne sont pas conformes à leur référentiel de correctifs, dans chaque compte et chaque Région. L'équipe veut le MOINS de charge opérationnelle.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Deploy the ec2-managedinstance-patch-compliance-status-check managed rule to all member accounts as an organization Config rule from the delegated administrator account."
        fr: "Déployer la règle gérée ec2-managedinstance-patch-compliance-status-check dans tous les comptes membres en tant que règle Config d'organisation depuis le compte administrateur délégué."
    - id: b
      text:
        en: "Create a custom Config rule backed by an AWS Lambda function that calls DescribeInstancePatchStates in each account."
        fr: "Créer une règle Config personnalisée reposant sur une fonction AWS Lambda qui appelle DescribeInstancePatchStates dans chaque compte."
    - id: c
      text:
        en: "Create an organization-wide AWS Config aggregator in the security tooling account for all Regions."
        fr: "Créer un agrégateur AWS Config à l'échelle de l'organisation dans le compte d'outils de sécurité pour toutes les Régions."
    - id: d
      text:
        en: "Configure a resource data sync in each account that sends the Systems Manager inventory to an Amazon S3 bucket in the security tooling account."
        fr: "Configurer dans chaque compte une synchronisation des données de ressources qui envoie l'inventaire Systems Manager vers un compartiment Amazon S3 du compte d'outils de sécurité."
    - id: e
      text:
        en: "Change the Amazon Inspector scan mode to hybrid so that unpatched instances generate package vulnerability findings."
        fr: "Passer le mode d'analyse Amazon Inspector en hybride afin que les instances sans correctifs génèrent des résultats de vulnérabilité de paquets."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The ec2-managedinstance-patch-compliance-status-check managed rule evaluates the AWS::SSM::PatchCompliance resource that Systems Manager reports after patching and is triggered by configuration changes, so it stays current without code. An organization Config rule deploys it everywhere from the delegated administrator, and an organization aggregator collects the evaluations of all accounts and Regions into the security tooling account."
    fr: "La règle gérée ec2-managedinstance-patch-compliance-status-check évalue la ressource AWS::SSM::PatchCompliance que Systems Manager signale après l'application des correctifs et se déclenche sur les modifications de configuration : elle reste à jour sans code. Une règle Config d'organisation la déploie partout depuis l'administrateur délégué, et un agrégateur d'organisation rassemble les évaluations de tous les comptes et de toutes les Régions dans le compte d'outils de sécurité."
  options:
    b:
      en: "A custom Lambda rule duplicates what the managed rule already checks and adds code to write and maintain."
      fr: "Une règle Lambda personnalisée reproduit ce que la règle gérée vérifie déjà et ajoute du code à écrire et à maintenir."
    d:
      en: "A resource data sync produces files in Amazon S3, not an AWS Config view of compliance."
      fr: "Une synchronisation des données de ressources produit des fichiers dans Amazon S3, et non une vue de conformité AWS Config."
    e:
      en: "Inspector findings report vulnerabilities, not compliance with the patch baseline, and they are not AWS Config evaluations."
      fr: "Les résultats Inspector signalent des vulnérabilités, et non la conformité au référentiel de correctifs, et ce ne sont pas des évaluations AWS Config."
references:
  - title: "ec2-managedinstance-patch-compliance-status-check - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/ec2-managedinstance-patch-compliance-status-check.html
