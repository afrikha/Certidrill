id: scsc03-3b-agent-excessive-agency
objective: "3.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's customer service agent on Amazon Bedrock has an action group whose AWS Lambda function can read orders and issue refunds. The function's execution role allows all DynamoDB actions on all tables and can call the refund API for any amount. During a red team exercise, instructions hidden in a product review that the agent retrieved from its knowledge base made the agent issue a refund. The security team requires that a refund runs only after the customer explicitly approves it in the chat interface, and that the function can only read the Orders table and call the refund API.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    L'agent de service client d'AnyCompany sur Amazon Bedrock a un groupe d'actions dont la fonction AWS Lambda peut lire des commandes et émettre des remboursements. Le rôle d'exécution de la fonction autorise toutes les actions DynamoDB sur toutes les tables et peut appeler l'API de remboursement pour n'importe quel montant. Lors d'un exercice d'équipe rouge, des instructions cachées dans un avis produit que l'agent a récupéré de sa base de connaissances ont fait émettre un remboursement par l'agent. L'équipe de sécurité exige qu'un remboursement ne s'exécute qu'après l'approbation explicite du client dans l'interface de chat, et que la fonction puisse seulement lire la table Orders et appeler l'API de remboursement.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Add a denied topic for refund requests to the agent's guardrail."
        fr: "Ajouter un sujet refusé pour les demandes de remboursement à la barrière de protection de l'agent."
    - id: b
      text:
        en: "Enable user confirmation for the refund function in the action group, and return the customer's CONFIRM or DENY answer in the next InvokeAgent request."
        fr: "Activer la confirmation de l'utilisateur pour la fonction de remboursement dans le groupe d'actions, et renvoyer la réponse CONFIRM ou DENY du client dans la requête InvokeAgent suivante."
    - id: c
      text:
        en: "Enable model invocation logging to Amazon S3 so that every refund decision of the agent is recorded."
        fr: "Activer la journalisation des appels de modèle vers Amazon S3 afin que chaque décision de remboursement de l'agent soit enregistrée."
    - id: d
      text:
        en: "Replace the execution role policy with one that allows only dynamodb:GetItem and dynamodb:Query on the Orders table and the call to the refund API."
        fr: "Remplacer la politique du rôle d'exécution par une politique qui n'autorise que dynamodb:GetItem et dynamodb:Query sur la table Orders et l'appel à l'API de remboursement."
    - id: e
      text:
        en: "Raise the contextual grounding threshold of the guardrail to 0.99 so that injected instructions are not grounded."
        fr: "Relever à 0,99 le seuil d'ancrage contextuel de la barrière de protection afin que les instructions injectées ne soient pas ancrées."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "User confirmation makes the agent return the function details to the application, which asks the customer to confirm or deny; the function runs only with a CONFIRM state, so instructions embedded in retrieved data cannot trigger a refund alone. Scoping the execution role to read the Orders table and call the refund API limits what the function can do if it is misused."
    fr: "La confirmation de l'utilisateur fait renvoyer par l'agent les détails de la fonction à l'application, qui demande au client de confirmer ou de refuser ; la fonction ne s'exécute qu'avec l'état CONFIRM : des instructions intégrées aux données récupérées ne peuvent donc pas déclencher seules un remboursement. Limiter le rôle d'exécution à la lecture de la table Orders et à l'appel de l'API de remboursement restreint ce que la fonction peut faire si elle est détournée."
  options:
    a:
      en: "A denied topic for refunds would block legitimate refund conversations and does not require the customer's approval."
      fr: "Un sujet refusé pour les remboursements bloquerait les conversations de remboursement légitimes et n'exige pas l'approbation du client."
    c:
      en: "Logging records what happened after the fact; it neither requires approval nor reduces the permissions."
      fr: "La journalisation enregistre ce qui s'est passé après coup ; elle n'exige pas d'approbation et ne réduit pas les autorisations."
    e:
      en: "Contextual grounding checks evaluate model responses against a source; they do not stop the agent from invoking an action, and a threshold of 0.99 would block most answers."
      fr: "Les vérifications d'ancrage contextuel évaluent les réponses du modèle par rapport à une source ; elles n'empêchent pas l'agent d'appeler une action, et un seuil de 0,99 bloquerait la plupart des réponses."
references:
  - title: "Get user confirmation before invoking action group function - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-userconfirmation.html
