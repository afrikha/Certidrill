id: scsc03-3a-allowed-amis-declarative
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's central image account 111122223333 shares hardened AMIs named golden-* with the Workloads organizational unit (OU). An SCP already denies ec2:CreateImage and ec2:RegisterImage in the workload accounts. The security team requires that users in the workload accounts be able to discover and launch only the golden AMIs and the Amazon-published AMIs that Amazon EKS managed node groups need, in every AWS Region. Administrators of the workload accounts must not be able to change this control, and the company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Le compte d'images central 111122223333 d'AnyCompany partage des AMI renforcées nommées golden-* avec l'unité d'organisation (UO) Workloads. Une SCP refuse déjà ec2:CreateImage et ec2:RegisterImage dans les comptes de charge de travail. L'équipe de sécurité exige que les utilisateurs des comptes de charge de travail ne puissent découvrir et lancer que les AMI de référence et les AMI publiées par Amazon dont ont besoin les groupes de nœuds gérés Amazon EKS, dans chaque Région AWS. Les administrateurs des comptes de charge de travail ne doivent pas pouvoir modifier ce contrôle, et l'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach to the Workloads OU a declarative policy that sets Allowed AMIs to enabled, with one criterion for provider 111122223333 and names golden-*, and one criterion for the amazon provider.
        fr: |-
          Attacher à l'UO Workloads une politique déclarative qui définit Allowed AMIs sur enabled, avec un critère pour le fournisseur 111122223333 et les noms golden-*, et un critère pour le fournisseur amazon.
    - id: b
      text:
        en: |-
          Attach to the Workloads OU a declarative policy that sets Allowed AMIs to audit-mode, with one criterion for provider 111122223333 and names golden-*, and one criterion for the amazon provider.
        fr: |-
          Attacher à l'UO Workloads une politique déclarative qui définit Allowed AMIs sur audit-mode, avec un critère pour le fournisseur 111122223333 et les noms golden-*, et un critère pour le fournisseur amazon.
    - id: c
      text:
        en: |-
          Use CloudFormation StackSets to enable Allowed AMIs with the same two criteria in every workload account and Region, and add drift detection on the stack instances.
        fr: |-
          Utiliser CloudFormation StackSets pour activer Allowed AMIs avec les deux mêmes critères dans chaque compte de charge de travail et chaque Région, et ajouter une détection de dérive sur les instances de pile.
    - id: d
      text:
        en: |-
          Attach to the Workloads OU an SCP that denies ec2:RunInstances on images whose ec2:Owner condition key is not 111122223333 or amazon.
        fr: |-
          Attacher à l'UO Workloads une SCP qui refuse ec2:RunInstances sur les images dont la clé de condition ec2:Owner n'est pas 111122223333 ou amazon.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Allowed AMIs restricts the public and shared AMIs that users can discover and launch to those that match its criteria; criteria are combined with OR, and parameters inside a criterion with AND. A declarative policy applies the setting across accounts and Regions at once, and while it is in use the setting cannot be changed in the accounts. Including the amazon provider keeps the Amazon-published AMIs that managed services such as Amazon EKS rely on.
    fr: |-
      Allowed AMIs limite les AMI publiques et partagées que les utilisateurs peuvent découvrir et lancer à celles qui correspondent à ses critères ; les critères se combinent par OU, et les paramètres d'un critère par ET. Une politique déclarative applique le paramètre à plusieurs comptes et Régions à la fois, et tant qu'elle est en vigueur le paramètre ne peut pas être modifié dans les comptes. Inclure le fournisseur amazon conserve les AMI publiées par Amazon dont dépendent les services gérés comme Amazon EKS.
  options:
    b:
      en: |-
        Audit mode only reports which AMIs would be allowed; it does not restrict discovery or launches.
      fr: |-
        Le mode audit se contente de signaler les AMI qui seraient autorisées ; il ne restreint ni la découverte ni les lancements.
    c:
      en: |-
        Settings deployed into each account can still be changed by the account administrators, and maintaining stacks in every Region adds overhead.
      fr: |-
        Des paramètres déployés dans chaque compte peuvent toujours être modifiés par les administrateurs des comptes, et maintenir des piles dans chaque Région ajoute de la charge.
    d:
      en: |-
        The SCP restricts launches by owner only: users can still discover every other public and shared AMI, and any AMI from the image account, golden-* or not, can be launched.
      fr: |-
        La SCP ne restreint les lancements que par propriétaire : les utilisateurs peuvent toujours découvrir toutes les autres AMI publiques et partagées, et n'importe quelle AMI du compte d'images, golden-* ou non, peut être lancée.
references:
  - title: Control the discovery and use of AMIs in Amazon EC2 with Allowed AMIs - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-allowed-amis.html
