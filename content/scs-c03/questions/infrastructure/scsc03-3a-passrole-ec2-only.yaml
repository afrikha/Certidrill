id: scsc03-3a-passrole-ec2-only
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In account 111122223333, developers launch Amazon EC2 instances with instance profiles. The security team creates approved instance roles under the IAM path /app-ec2/. Developers must be able to pass only these roles, and only to Amazon EC2, so that they cannot attach an approved role to an AWS Lambda function or pass any other role, such as an administrator role, to an instance.

    Which statement should the developers' IAM policy contain?
  fr: |
    Dans le compte 111122223333, les développeurs lancent des instances Amazon EC2 avec des profils d'instance. L'équipe de sécurité crée les rôles d'instance approuvés sous le chemin IAM /app-ec2/. Les développeurs ne doivent pouvoir transmettre que ces rôles, et uniquement à Amazon EC2, afin de ne pas pouvoir attacher un rôle approuvé à une fonction AWS Lambda ni transmettre un autre rôle, comme un rôle d'administrateur, à une instance.

    Quelle instruction la politique IAM des développeurs doit-elle contenir ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow iam:PassRole on arn:aws:iam::111122223333:role/app-ec2/* when the iam:PassedToService condition key equals ec2.amazonaws.com.
        fr: |-
          Autoriser iam:PassRole sur arn:aws:iam::111122223333:role/app-ec2/* lorsque la clé de condition iam:PassedToService est égale à ec2.amazonaws.com.
    - id: b
      text:
        en: |-
          Allow iam:PassRole on all resources when the iam:PassedToService condition key equals ec2.amazonaws.com.
        fr: |-
          Autoriser iam:PassRole sur toutes les ressources lorsque la clé de condition iam:PassedToService est égale à ec2.amazonaws.com.
    - id: c
      text:
        en: |-
          Allow sts:AssumeRole on arn:aws:iam::111122223333:role/app-ec2/* when the aws:CalledVia condition key contains ec2.amazonaws.com.
        fr: |-
          Autoriser sts:AssumeRole sur arn:aws:iam::111122223333:role/app-ec2/* lorsque la clé de condition aws:CalledVia contient ec2.amazonaws.com.
    - id: d
      text:
        en: |-
          Allow iam:PassRole on arn:aws:iam::111122223333:role/app-ec2/* when the aws:ResourceTag/purpose condition key equals ec2.
        fr: |-
          Autoriser iam:PassRole sur arn:aws:iam::111122223333:role/app-ec2/* lorsque la clé de condition aws:ResourceTag/purpose est égale à ec2.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Passing a role to a service requires the iam:PassRole permission on that role. Limiting the Resource element to the /app-ec2/ path restricts which roles can be passed, and the iam:PassedToService condition key restricts the service principal that can receive them to ec2.amazonaws.com.
    fr: |-
      Transmettre un rôle à un service exige l'autorisation iam:PassRole sur ce rôle. Limiter l'élément Resource au chemin /app-ec2/ restreint les rôles qui peuvent être transmis, et la clé de condition iam:PassedToService restreint le principal de service qui peut les recevoir à ec2.amazonaws.com.
  options:
    b:
      en: |-
        Any role in the account, including an administrator role, could be passed to an instance.
      fr: |-
        N'importe quel rôle du compte, y compris un rôle d'administrateur, pourrait être transmis à une instance.
    c:
      en: |-
        sts:AssumeRole lets the developers use the roles themselves; it is not the permission that passes a role to a service.
      fr: |-
        sts:AssumeRole permet aux développeurs d'utiliser eux-mêmes les rôles ; ce n'est pas l'autorisation qui transmet un rôle à un service.
    d:
      en: |-
        A tag condition does not limit the target service, and AWS advises against controlling iam:PassRole with resource tag conditions because the results are not reliable.
      fr: |-
        Une condition de balise ne limite pas le service cible, et AWS déconseille de contrôler iam:PassRole avec des conditions de balise de ressource, car les résultats ne sont pas fiables.
references:
  - title: Grant a user permissions to pass a role to an AWS service - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_passrole.html
