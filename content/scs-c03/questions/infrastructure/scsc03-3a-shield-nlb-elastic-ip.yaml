id: scsc03-3a-shield-nlb-elastic-ip
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a multiplayer game backend on Amazon EC2 instances behind an internet-facing Network Load Balancer (NLB) in a single AWS Region. Players connect over TCP and UDP. The company's threat model rates large layer 3 and layer 4 DDoS attacks against the game endpoint as the main availability risk. The company has subscribed to AWS Shield Advanced and has a Business Support plan. The security team requires Shield Advanced detection and mitigation for the game endpoint, access to the Shield Response Team (SRT), and cost protection for scaling charges caused by an attack.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute le backend d'un jeu multijoueur sur des instances Amazon EC2 derrière un Network Load Balancer (NLB) exposé à Internet, dans une seule Région AWS. Les joueurs se connectent en TCP et en UDP. Le modèle de menaces de l'entreprise classe les attaques DDoS de grande ampleur des couches 3 et 4 contre le point de terminaison du jeu comme le principal risque de disponibilité. L'entreprise a souscrit à AWS Shield Advanced et dispose d'un plan Business Support. L'équipe de sécurité exige la détection et l'atténuation de Shield Advanced pour le point de terminaison du jeu, l'accès à la Shield Response Team (SRT) et la protection des coûts de mise à l'échelle causés par une attaque.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the ARN of the existing NLB to Shield Advanced as a protected resource and configure SRT access for the account.
        fr: |-
          Ajouter l'ARN du NLB existant à Shield Advanced comme ressource protégée et configurer l'accès de la SRT pour le compte.
    - id: b
      text:
        en: |-
          Recreate the NLB with an Elastic IP address in each subnet mapping, and add those Elastic IP addresses to Shield Advanced as protected resources.
        fr: |-
          Recréer le NLB avec une adresse IP Elastic dans chaque mappage de sous-réseau, et ajouter ces adresses IP Elastic à Shield Advanced comme ressources protégées.
    - id: c
      text:
        en: |-
          Associate an AWS WAF web ACL that contains a rate-based rule with the NLB, and add the web ACL to Shield Advanced as a protected resource.
        fr: |-
          Associer au NLB une liste ACL web AWS WAF qui contient une règle basée sur le débit (rate-based), et ajouter la liste ACL web à Shield Advanced comme ressource protégée.
    - id: d
      text:
        en: |-
          Replace the NLB with an Application Load Balancer, and add the Application Load Balancer to Shield Advanced as a protected resource.
        fr: |-
          Remplacer le NLB par un Application Load Balancer, et ajouter l'Application Load Balancer à Shield Advanced comme ressource protégée.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Shield Advanced protects Network Load Balancers through their association with Amazon EC2 Elastic IP addresses, not as a resource type of their own. Giving the internet-facing NLB an Elastic IP address in each subnet mapping and protecting those addresses brings the NLB under Shield Advanced detection, SRT support and cost protection.
    fr: |-
      Shield Advanced protège les Network Load Balancers par leur association à des adresses IP Elastic Amazon EC2, et non comme un type de ressource à part entière. Attribuer au NLB exposé à Internet une adresse IP Elastic dans chaque mappage de sous-réseau et protéger ces adresses place le NLB sous la détection de Shield Advanced, le support de la SRT et la protection des coûts.
  options:
    a:
      en: |-
        A Network Load Balancer is not a protected resource type by itself; Shield Advanced covers it only through associated Elastic IP addresses.
      fr: |-
        Un Network Load Balancer n'est pas un type de ressource protégée en soi ; Shield Advanced ne le couvre qu'au travers des adresses IP Elastic associées.
    c:
      en: |-
        AWS WAF cannot be associated with a Network Load Balancer, a web ACL is not a Shield Advanced protected resource, and a rate-based rule addresses web request floods rather than layer 3 and layer 4 attacks.
      fr: |-
        AWS WAF ne peut pas être associé à un Network Load Balancer, une liste ACL web n'est pas une ressource protégée par Shield Advanced, et une règle basée sur le débit traite les inondations de requêtes web, pas les attaques des couches 3 et 4.
    d:
      en: |-
        An Application Load Balancer handles HTTP and HTTPS only, so it cannot carry the game's UDP traffic.
      fr: |-
        Un Application Load Balancer ne traite que HTTP et HTTPS ; il ne peut donc pas acheminer le trafic UDP du jeu.
references:
  - title: List of AWS resources that AWS Shield Advanced protects - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-advanced-summary-protected-resources.html
