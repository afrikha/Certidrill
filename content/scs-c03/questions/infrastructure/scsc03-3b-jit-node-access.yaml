id: scsc03-3b-jit-node-access
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's engineers have standing IAM permissions to start AWS Systems Manager Session Manager sessions on all production Amazon EC2 instances. The security team wants to remove standing access. Sessions to database nodes must require two levels of manual approval, while sessions to stateless web nodes can be approved automatically. Every request must record a reason, and access must be limited to an approved time window. The team wants a managed solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Les ingénieurs d'AnyCompany disposent d'autorisations IAM permanentes pour démarrer des sessions AWS Systems Manager Session Manager sur toutes les instances Amazon EC2 de production. L'équipe de sécurité veut supprimer cet accès permanent. Les sessions vers les nœuds de base de données doivent exiger deux niveaux d'approbation manuelle, tandis que les sessions vers les nœuds web sans état peuvent être approuvées automatiquement. Chaque demande doit enregistrer un motif, et l'accès doit être limité à une fenêtre de temps approuvée. L'équipe veut une solution gérée avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Build an AWS Step Functions approval workflow that attaches a temporary IAM policy for ssm:StartSession to the engineer's role and removes it when the window ends."
        fr: "Créer un flux d'approbation AWS Step Functions qui attache au rôle de l'ingénieur une politique IAM temporaire pour ssm:StartSession et la retire à la fin de la fenêtre."
    - id: b
      text:
        en: "Use Systems Manager just-in-time node access with a manual approval policy for the database nodes and an auto-approval policy for the web nodes."
        fr: "Utiliser l'accès juste-à-temps aux nœuds (just-in-time node access) de Systems Manager avec une politique d'approbation manuelle pour les nœuds de base de données et une politique d'approbation automatique pour les nœuds web."
    - id: c
      text:
        en: "Replace Session Manager with an EC2 Instance Connect Endpoint, and set ec2-instance-connect:maxTunnelDuration to the length of the approved window."
        fr: "Remplacer Session Manager par un point de terminaison EC2 Instance Connect, et définir ec2-instance-connect:maxTunnelDuration sur la durée de la fenêtre approuvée."
    - id: d
      text:
        en: "Set the maximum session duration and idle timeout in the Session Manager preferences, and require MFA in the engineers' IAM policies."
        fr: "Définir la durée maximale de session et le délai d'inactivité dans les préférences de Session Manager, et exiger la MFA dans les politiques IAM des ingénieurs."
answer: { optionId: b }
explanation:
  correct:
    en: "Just-in-time node access replaces standing access with time-bound access requests. Users give a reason when they request access, manual approval policies define the number and levels of approvals for nodes such as databases, and auto-approval policies let users connect automatically to nodes such as presentation tier servers."
    fr: "L'accès juste-à-temps aux nœuds remplace l'accès permanent par des demandes d'accès limitées dans le temps. Les utilisateurs indiquent un motif lors de leur demande, les politiques d'approbation manuelle définissent le nombre et les niveaux d'approbation pour des nœuds comme les bases de données, et les politiques d'approbation automatique permettent de se connecter automatiquement à des nœuds comme les serveurs de présentation."
  options:
    a:
      en: "A custom approval workflow can work, but it is code to build and maintain, which is not the least operational overhead."
      fr: "Un flux d'approbation personnalisé peut fonctionner, mais c'est du code à créer et à maintenir, ce qui n'est pas le moins de charge opérationnelle."
    c:
      en: "A tunnel duration limit does not provide approvals, request reasons or automatic approval rules."
      fr: "Une limite de durée de tunnel ne fournit ni approbations, ni motifs de demande, ni règles d'approbation automatique."
    d:
      en: "Session preferences limit the length of sessions, but the engineers keep standing access and no approval is required."
      fr: "Les préférences de session limitent la durée des sessions, mais les ingénieurs conservent un accès permanent et aucune approbation n'est requise."
references:
  - title: "Just-in-time node access using Systems Manager - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-just-in-time-node-access.html
