id: scsc03-3b-eice-tunnel-conditions
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses an EC2 Instance Connect Endpoint to give administrators SSH access to Amazon EC2 instances in a VPC. A new rule states that administrators can open tunnels only to TCP port 22 of instances in the 10.20.8.0/24 subnet, and that no tunnel can stay open for more than 30 minutes. The security team is writing the statement that allows ec2-instance-connect:OpenTunnel on the endpoint ARN.

    Which condition block meets these requirements?
  fr: |
    AnyCompany utilise un point de terminaison EC2 Instance Connect (EC2 Instance Connect Endpoint) pour donner aux administrateurs un accès SSH aux instances Amazon EC2 d'un VPC. Une nouvelle règle impose que les administrateurs ne puissent ouvrir des tunnels que vers le port TCP 22 des instances du sous-réseau 10.20.8.0/24, et qu'aucun tunnel ne reste ouvert plus de 30 minutes. L'équipe de sécurité rédige la déclaration qui autorise ec2-instance-connect:OpenTunnel sur l'ARN du point de terminaison.

    Quel bloc de conditions répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "NumericEquals ec2-instance-connect:remotePort 22, IpAddress ec2-instance-connect:privateIpAddress 10.20.8.0/24, and NumericLessThanEquals ec2-instance-connect:maxTunnelDuration 1800."
        fr: "NumericEquals ec2-instance-connect:remotePort 22, IpAddress ec2-instance-connect:privateIpAddress 10.20.8.0/24 et NumericLessThanEquals ec2-instance-connect:maxTunnelDuration 1800."
    - id: b
      text:
        en: "NumericEquals ec2-instance-connect:remotePort 22, IpAddress ec2-instance-connect:privateIpAddress 10.20.8.0/24, and NumericGreaterThanEquals ec2-instance-connect:maxTunnelDuration 1800."
        fr: "NumericEquals ec2-instance-connect:remotePort 22, IpAddress ec2-instance-connect:privateIpAddress 10.20.8.0/24 et NumericGreaterThanEquals ec2-instance-connect:maxTunnelDuration 1800."
    - id: c
      text:
        en: "NumericEquals ec2-instance-connect:remotePort 22, IpAddress aws:SourceIp 10.20.8.0/24, and NumericLessThanEquals aws:MultiFactorAuthAge 1800."
        fr: "NumericEquals ec2-instance-connect:remotePort 22, IpAddress aws:SourceIp 10.20.8.0/24 et NumericLessThanEquals aws:MultiFactorAuthAge 1800."
    - id: d
      text:
        en: "NumericEquals ec2-instance-connect:remotePort 22, IpAddress ec2-instance-connect:privateIpAddress 10.20.8.0/24, and NumericLessThanEquals aws:TokenIssueTime 1800."
        fr: "NumericEquals ec2-instance-connect:remotePort 22, IpAddress ec2-instance-connect:privateIpAddress 10.20.8.0/24 et NumericLessThanEquals aws:TokenIssueTime 1800."
answer: { optionId: a }
explanation:
  correct:
    en: "ec2-instance-connect:remotePort restricts the destination port, ec2-instance-connect:privateIpAddress accepts a single IP address or a CIDR range of target instances, and ec2-instance-connect:maxTunnelDuration sets the maximum duration of an established connection in seconds, from 1 to 3,600. NumericLessThanEquals 1800 caps tunnels at 30 minutes; with a value below 3,600, administrators pass --max-tunnel-duration when they connect."
    fr: "ec2-instance-connect:remotePort restreint le port de destination, ec2-instance-connect:privateIpAddress accepte une adresse IP ou une plage CIDR d'instances cibles, et ec2-instance-connect:maxTunnelDuration fixe la durée maximale d'une connexion établie en secondes, de 1 à 3 600. NumericLessThanEquals 1800 limite les tunnels à 30 minutes ; avec une valeur inférieure à 3 600, les administrateurs transmettent --max-tunnel-duration à la connexion."
  options:
    b:
      en: "NumericGreaterThanEquals allows only tunnels of 30 minutes or more, which is the opposite of the requirement."
      fr: "NumericGreaterThanEquals n'autorise que des tunnels de 30 minutes ou plus, ce qui est l'inverse de l'exigence."
    c:
      en: "aws:SourceIp is the address of the caller, not of the target instance, and the MFA age does not limit how long a tunnel stays open."
      fr: "aws:SourceIp est l'adresse de l'appelant, et non celle de l'instance cible, et l'ancienneté de la MFA ne limite pas la durée d'ouverture d'un tunnel."
    d:
      en: "aws:TokenIssueTime is a date of the credentials, not a duration in seconds, and it does not limit the duration of the tunnel."
      fr: "aws:TokenIssueTime est une date des informations d'identification, et non une durée en secondes, et elle ne limite pas la durée du tunnel."
references:
  - title: "Grant permissions to use EC2 Instance Connect Endpoint - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/permissions-for-ec2-instance-connect-endpoint.html
