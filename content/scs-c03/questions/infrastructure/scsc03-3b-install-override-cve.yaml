id: scsc03-3b-install-override-cve
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany patches its Amazon Linux 2023 fleet with AWS Systems Manager Patch Manager. The default custom patch baseline auto-approves security patches 7 days after release, and the weekly maintenance window installs all approved patches. A fix for a critical OpenSSL vulnerability was released today. The security team must install only the updated OpenSSL packages on the production instances today. Other pending patches must wait for the weekly window, and the patch baseline must not be modified.

    Which solution will meet these requirements?
  fr: |
    AnyCompany applique les correctifs de son parc Amazon Linux 2023 avec AWS Systems Manager Patch Manager. Le référentiel de correctifs (patch baseline) personnalisé par défaut approuve automatiquement les correctifs de sécurité 7 jours après leur publication, et la fenêtre de maintenance hebdomadaire installe tous les correctifs approuvés. Un correctif pour une vulnérabilité critique d'OpenSSL a été publié aujourd'hui. L'équipe de sécurité doit installer aujourd'hui uniquement les paquets OpenSSL mis à jour sur les instances de production. Les autres correctifs en attente doivent attendre la fenêtre hebdomadaire, et le référentiel de correctifs ne doit pas être modifié.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add the OpenSSL packages to the approved patches list of the baseline, and run Patch now on the production instances."
        fr: "Ajouter les paquets OpenSSL à la liste des correctifs approuvés du référentiel, et exécuter Patch now sur les instances de production."
    - id: b
      text:
        en: "Run Patch now on the production instances with the default baseline and the RebootIfNeeded option."
        fr: "Exécuter Patch now sur les instances de production avec le référentiel par défaut et l'option RebootIfNeeded."
    - id: c
      text:
        en: "Run AWS-RunPatchBaseline with Operation set to Install and an InstallOverrideList parameter that points to a YAML file in Amazon S3 that lists the OpenSSL packages."
        fr: "Exécuter AWS-RunPatchBaseline avec Operation défini sur Install et un paramètre InstallOverrideList qui pointe vers un fichier YAML dans Amazon S3 listant les paquets OpenSSL."
    - id: d
      text:
        en: "Set the auto-approval delay of the baseline to 0 days, and run AWS-RunPatchBaseline with Operation set to Install on the production instances."
        fr: "Définir le délai d'approbation automatique du référentiel sur 0 jour, et exécuter AWS-RunPatchBaseline avec Operation défini sur Install sur les instances de production."
answer: { optionId: c }
explanation:
  correct:
    en: "The InstallOverrideList parameter of AWS-RunPatchBaseline points to a YAML patch list in an https or S3 location, and that list overrides the patches specified by the default patch baseline for the operation. Only the listed OpenSSL packages are installed, and the baseline stays unchanged for the weekly window."
    fr: "Le paramètre InstallOverrideList d'AWS-RunPatchBaseline pointe vers une liste de correctifs YAML stockée à une adresse https ou S3, et cette liste remplace pour l'opération les correctifs spécifiés par le référentiel par défaut. Seuls les paquets OpenSSL listés sont installés, et le référentiel reste inchangé pour la fenêtre hebdomadaire."
  options:
    a:
      en: "Editing the approved patches list modifies the baseline, and Patch now would also install every other patch that the baseline already approves."
      fr: "Modifier la liste des correctifs approuvés modifie le référentiel, et Patch now installerait aussi tous les autres correctifs déjà approuvés par le référentiel."
    b:
      en: "The OpenSSL fix is not approved yet because of the 7-day delay, so Patch now with the default baseline would not install it and would install other approved patches instead."
      fr: "Le correctif OpenSSL n'est pas encore approuvé à cause du délai de 7 jours : Patch now avec le référentiel par défaut ne l'installerait pas et installerait à la place d'autres correctifs approuvés."
    d:
      en: "Changing the delay modifies the baseline and approves every pending security patch, which would all be installed today."
      fr: "Modifier le délai modifie le référentiel et approuve tous les correctifs de sécurité en attente, qui seraient tous installés aujourd'hui."
references:
  - title: "SSM Command document for patching: AWS-RunPatchBaseline - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-aws-runpatchbaseline.html
  - title: "Predefined and custom patch baselines - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-predefined-and-custom-patch-baselines.html
