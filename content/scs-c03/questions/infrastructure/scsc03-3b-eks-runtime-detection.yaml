id: scsc03-3b-eks-runtime-detection
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs Amazon EKS clusters with managed node groups on Amazon EC2. Amazon GuardDuty is already enabled in the account. The security team must be alerted when a process inside a running container starts a cryptocurrency miner, opens a reverse shell, or tries to escalate privileges. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des clusters Amazon EKS avec des groupes de nœuds gérés sur Amazon EC2. Amazon GuardDuty est déjà activé dans le compte. L'équipe de sécurité doit être alertée lorsqu'un processus d'un conteneur en cours d'exécution démarre un mineur de cryptomonnaie, ouvre un shell inversé (reverse shell) ou tente une élévation de privilèges. L'équipe veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable EKS Protection in GuardDuty so that GuardDuty analyzes the Kubernetes audit logs of the clusters."
        fr: "Activer EKS Protection dans GuardDuty afin que GuardDuty analyse les journaux d'audit Kubernetes des clusters."
    - id: b
      text:
        en: "Enable Amazon Inspector continuous scanning for the Amazon ECR repositories that store the container images."
        fr: "Activer l'analyse continue Amazon Inspector pour les référentiels Amazon ECR qui stockent les images de conteneur."
    - id: c
      text:
        en: "Enable GuardDuty Runtime Monitoring for Amazon EKS with automated agent configuration for the clusters."
        fr: "Activer GuardDuty Runtime Monitoring pour Amazon EKS avec la configuration automatisée de l'agent pour les clusters."
    - id: d
      text:
        en: "Enable Amazon Detective for the account so that it builds behavior graphs from the cluster activity."
        fr: "Activer Amazon Detective pour le compte afin qu'il construise des graphes de comportement à partir de l'activité des clusters."
answer: { optionId: c }
explanation:
  correct:
    en: "Runtime Monitoring uses a GuardDuty security agent that observes process execution, file access, command line arguments and network connections inside the workloads. With automated agent configuration, GuardDuty installs and updates the agent on the EKS clusters itself, which keeps operational overhead low."
    fr: "Runtime Monitoring utilise un agent de sécurité GuardDuty qui observe l'exécution des processus, l'accès aux fichiers, les arguments de ligne de commande et les connexions réseau dans les charges de travail. Avec la configuration automatisée de l'agent, GuardDuty installe et met à jour lui-même l'agent sur les clusters EKS, ce qui limite la charge opérationnelle."
  options:
    a:
      en: "Kubernetes audit logs record control plane API activity; they do not show processes that start inside a running container."
      fr: "Les journaux d'audit Kubernetes enregistrent l'activité d'API du plan de contrôle ; ils ne montrent pas les processus qui démarrent dans un conteneur en cours d'exécution."
    b:
      en: "Inspector finds known vulnerabilities in images; it does not detect malicious behavior at runtime."
      fr: "Inspector détecte les vulnérabilités connues dans les images ; il ne détecte pas les comportements malveillants à l'exécution."
    d:
      en: "Detective helps investigate findings that other services produce; it does not detect runtime threats by itself."
      fr: "Detective aide à investiguer les résultats produits par d'autres services ; il ne détecte pas lui-même les menaces à l'exécution."
references:
  - title: "GuardDuty Runtime Monitoring - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/runtime-monitoring.html
