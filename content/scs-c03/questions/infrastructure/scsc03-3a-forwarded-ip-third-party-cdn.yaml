id: scsc03-3a-forwarded-ip-third-party-cdn
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany places a third-party CDN in front of an internet-facing Application Load Balancer that is associated with an AWS WAF web ACL. The load balancer's security group accepts traffic only from the CDN's published address ranges. The CDN writes the original client IP address as the first address of the X-Forwarded-For header. A geo match rule that blocks one country and a rate-based rule that limits each client to 500 requests in 5 minutes have no effect, because AWS WAF evaluates the CDN's addresses.

    Which solution will make both rules evaluate the original client IP address?
  fr: |
    AnyCompany place un CDN tiers devant un Application Load Balancer exposé à Internet, associé à une liste ACL web AWS WAF. Le groupe de sécurité de l'équilibreur de charge n'accepte que le trafic provenant des plages d'adresses publiées par le CDN. Le CDN écrit l'adresse IP d'origine du client comme première adresse de l'en-tête X-Forwarded-For. Une règle de correspondance géographique qui bloque un pays et une règle basée sur le débit qui limite chaque client à 500 requêtes en 5 minutes sont sans effet, car AWS WAF évalue les adresses du CDN.

    Quelle solution permet aux deux règles d'évaluer l'adresse IP d'origine du client ?
body:
  options:
    - id: a
      text:
        en: |-
          Change the X-Forwarded-For processing mode of the load balancer to preserve, and keep both rules on their default source IP address settings.
        fr: |-
          Passer le mode de traitement X-Forwarded-For de l'équilibreur de charge à preserve, et conserver les paramètres par défaut d'adresse IP source des deux règles.
    - id: b
      text:
        en: |-
          Change the rate-based rule to aggregate on ASN, and add the CDN's address ranges to an IP set that the geo match rule excludes.
        fr: |-
          Modifier la règle basée sur le débit pour qu'elle agrège selon l'ASN, et ajouter les plages d'adresses du CDN à un ensemble d'adresses IP que la règle de correspondance géographique exclut.
    - id: c
      text:
        en: |-
          Add a forwarded IP configuration for the X-Forwarded-For header to the geo match statement, and set the rate-based rule to aggregate on the IP address in that header.
        fr: |-
          Ajouter une configuration d'adresse IP transmise (forwarded IP) pour l'en-tête X-Forwarded-For à l'instruction de correspondance géographique, et faire agréger la règle basée sur le débit selon l'adresse IP de cet en-tête.
    - id: d
      text:
        en: |-
          Enable access logs on the load balancer, and run an AWS Lambda function that adds the client addresses of blocked countries to an IP set every minute.
        fr: |-
          Activer les journaux d'accès de l'équilibreur de charge, et exécuter une fonction AWS Lambda qui ajoute chaque minute à un ensemble d'adresses IP les adresses clientes des pays bloqués.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      By default, AWS WAF uses the IP address of the request origin, which is the last proxy, here the CDN. A forwarded IP configuration on the geo match statement and the IP address in header aggregation option on the rate-based rule make AWS WAF use the first address in X-Forwarded-For, with a fallback behavior for malformed values. Because headers can be forged, the security group that admits only the CDN keeps clients from supplying their own header directly.
    fr: |-
      Par défaut, AWS WAF utilise l'adresse IP de l'origine de la requête, c'est-à-dire le dernier proxy, ici le CDN. Une configuration d'adresse IP transmise sur l'instruction de correspondance géographique et l'option d'agrégation « adresse IP dans l'en-tête » sur la règle basée sur le débit font utiliser par AWS WAF la première adresse de X-Forwarded-For, avec un comportement de repli pour les valeurs mal formées. Comme les en-têtes peuvent être falsifiés, le groupe de sécurité qui n'admet que le CDN empêche les clients de fournir directement leur propre en-tête.
  options:
    a:
      en: |-
        The processing mode changes the header that the load balancer sends to its targets; AWS WAF still evaluates the connection's source address, which is the CDN.
      fr: |-
        Le mode de traitement modifie l'en-tête que l'équilibreur de charge envoie à ses cibles ; AWS WAF évalue toujours l'adresse source de la connexion, qui est celle du CDN.
    b:
      en: |-
        The ASN option derives the ASN from the source IP address, which is the CDN's, and excluding the CDN ranges makes the geo rule match nothing.
      fr: |-
        L'option ASN déduit l'ASN de l'adresse IP source, qui est celle du CDN, et exclure les plages du CDN fait que la règle géographique ne correspond plus à rien.
    d:
      en: |-
        A log-driven IP set adds custom code, lags behind the traffic, and an IP set match without a forwarded IP configuration still compares the CDN's addresses.
      fr: |-
        Un ensemble d'adresses IP alimenté par les journaux ajoute du code personnalisé, est en retard sur le trafic, et une correspondance d'ensemble d'adresses IP sans configuration d'adresse IP transmise compare toujours les adresses du CDN.
references:
  - title: Geographic match rule statement - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-geo-match.html
  - title: Aggregating rate-based rules in AWS WAF - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based-aggregation-options.html
