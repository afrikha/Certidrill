id: scsc03-3b-mw-rate-controls
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany uses an AWS Systems Manager maintenance window to patch 200 web servers with AWS-RunPatchBaseline. To protect availability, no more than 10 percent of the servers can be patched at the same time. If more than 2 servers fail to patch, the rollout must stop so that the operations team can investigate.

    How should the security engineer configure the maintenance window task?
  fr: |
    AnyCompany utilise une fenêtre de maintenance AWS Systems Manager pour appliquer les correctifs de 200 serveurs web avec AWS-RunPatchBaseline. Pour protéger la disponibilité, pas plus de 10 % des serveurs ne peuvent recevoir les correctifs en même temps. Si plus de 2 serveurs échouent, le déploiement doit s'arrêter afin que l'équipe des opérations puisse enquêter.

    Comment l'ingénieur sécurité doit-il configurer la tâche de la fenêtre de maintenance ?
body:
  options:
    - id: a
      text:
        en: "Set the task priority to 10 and the maintenance window cutoff to 2 hours."
        fr: "Définir la priorité de la tâche sur 10 et le délai de coupure (cutoff) de la fenêtre de maintenance sur 2 heures."
    - id: b
      text:
        en: "Set the maximum concurrency to 10% and the maximum errors to 2."
        fr: "Définir la simultanéité maximale sur 10 % et le nombre maximal d'erreurs sur 2."
    - id: c
      text:
        en: "Set the maximum concurrency to 2 and the maximum errors to 10%."
        fr: "Définir la simultanéité maximale sur 2 et le nombre maximal d'erreurs sur 10 %."
    - id: d
      text:
        en: "Set the maintenance window duration to 10 hours and the task priority to 2."
        fr: "Définir la durée de la fenêtre de maintenance sur 10 heures et la priorité de la tâche sur 2."
answer: { optionId: b }
explanation:
  correct:
    en: "Maximum concurrency limits how many targets run the task at the same time and accepts a number or a percentage, so 10% patches at most 20 servers at once. Maximum errors sets how many failures are allowed before Systems Manager stops sending the task to the remaining targets."
    fr: "La simultanéité maximale limite le nombre de cibles qui exécutent la tâche en même temps et accepte un nombre ou un pourcentage : 10 % applique les correctifs à 20 serveurs au plus à la fois. Le nombre maximal d'erreurs fixe le nombre d'échecs autorisés avant que Systems Manager arrête d'envoyer la tâche aux cibles restantes."
  options:
    a:
      en: "Priority orders the tasks of a window, and the cutoff stops new tasks before the window ends; neither limits parallel servers or failures."
      fr: "La priorité ordonne les tâches d'une fenêtre, et le délai de coupure arrête les nouvelles tâches avant la fin de la fenêtre ; aucun des deux ne limite les serveurs en parallèle ni les échecs."
    c:
      en: "The values are inverted: only 2 servers would be patched at a time, and the rollout would tolerate up to 20 failures."
      fr: "Les valeurs sont inversées : seuls 2 serveurs recevraient les correctifs à la fois, et le déploiement tolérerait jusqu'à 20 échecs."
    d:
      en: "The duration only sets how long the window stays open, and priority orders tasks; neither controls concurrency or stops on errors."
      fr: "La durée fixe seulement le temps d'ouverture de la fenêtre, et la priorité ordonne les tâches ; aucune ne contrôle la simultanéité ni l'arrêt sur erreurs."
references:
  - title: "Examples: Register tasks with a maintenance window - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/mw-cli-register-tasks-examples.html
