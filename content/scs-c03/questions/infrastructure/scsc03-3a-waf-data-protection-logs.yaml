id: scsc03-3a-waf-data-protection-logs
objective: "3.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's AWS WAF web ACL for an Amazon CloudFront distribution logs to an Amazon S3 bucket, and Amazon Security Lake collects the web ACL's logs as an AWS WAFv2 source. External contractors review sampled requests in the console. The company has two requirements. First, the value of the x-session-token request header must never appear in clear text in the logs, in sampled requests, or in Security Lake, but analysts must still be able to correlate requests that carry the same token. Second, to reduce storage costs, the S3 logs must keep only the requests that the web ACL blocked.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    La liste ACL web AWS WAF d'AnyCompany pour une distribution Amazon CloudFront journalise vers un compartiment Amazon S3, et Amazon Security Lake collecte les journaux de la liste ACL web comme source AWS WAFv2. Des prestataires externes examinent les requêtes échantillonnées dans la console. L'entreprise a deux exigences. D'abord, la valeur de l'en-tête de requête x-session-token ne doit jamais apparaître en clair dans les journaux, dans les requêtes échantillonnées ni dans Security Lake, mais les analystes doivent toujours pouvoir corréler les requêtes qui portent le même jeton. Ensuite, pour réduire les coûts de stockage, les journaux S3 ne doivent conserver que les requêtes que la liste ACL web a bloquées.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add the x-session-token header as a redacted field in the logging configuration of the web ACL.
        fr: |-
          Ajouter l'en-tête x-session-token comme champ masqué (redacted) dans la configuration de journalisation de la liste ACL web.
    - id: b
      text:
        en: |-
          Configure web ACL data protection for the x-session-token header with the substitution method.
        fr: |-
          Configurer la protection des données de la liste ACL web pour l'en-tête x-session-token avec la méthode de substitution.
    - id: c
      text:
        en: |-
          Configure web ACL data protection for the x-session-token header with the hashing method.
        fr: |-
          Configurer la protection des données de la liste ACL web pour l'en-tête x-session-token avec la méthode de hachage.
    - id: d
      text:
        en: |-
          Add a logging filter that keeps the records whose action is BLOCK, with a default behavior that drops all other records.
        fr: |-
          Ajouter un filtre de journalisation qui conserve les enregistrements dont l'action est BLOCK, avec un comportement par défaut qui supprime tous les autres enregistrements.
    - id: e
      text:
        en: |-
          Turn off sampled requests for the web ACL, and add an S3 Lifecycle rule that deletes log objects after 30 days.
        fr: |-
          Désactiver les requêtes échantillonnées de la liste ACL web, et ajouter une règle S3 Lifecycle qui supprime les objets de journaux après 30 jours.
answer: { optionIds: [c, d] }
explanation:
  correct:
    en: |-
      Data protection configured at the web ACL level applies across all logging and data collection options, including logging, sampled requests, and Security Lake collection. The hashing method replaces the value with a Base64-encoded SHA-256 hash of the account number and the content, so equal tokens produce equal hashes and stay correlatable. A logging filter keeps or drops records based on the rule action or labels, so keeping BLOCK records and dropping the rest stores only blocked requests.
    fr: |-
      La protection des données configurée au niveau de la liste ACL web s'applique à toutes les options de journalisation et de collecte de données, y compris la journalisation, les requêtes échantillonnées et la collecte par Security Lake. La méthode de hachage remplace la valeur par un hachage SHA-256 encodé en Base64 du numéro de compte et du contenu ; des jetons identiques donnent donc des hachages identiques et restent corrélables. Un filtre de journalisation conserve ou supprime des enregistrements selon l'action de la règle ou les étiquettes ; conserver les enregistrements BLOCK et supprimer les autres ne stocke donc que les requêtes bloquées.
  options:
    a:
      en: |-
        Logging redaction affects only the data sent to the logging destination, so sampled requests and Security Lake would still show the token, and REDACTED values cannot be correlated.
      fr: |-
        Le masquage de journalisation n'affecte que les données envoyées à la destination de journalisation ; les requêtes échantillonnées et Security Lake montreraient donc toujours le jeton, et des valeurs REDACTED ne peuvent pas être corrélées.
    b:
      en: |-
        Substitution replaces every value with the word REDACTED, so analysts could no longer tell whether two requests carried the same token.
      fr: |-
        La substitution remplace chaque valeur par le mot REDACTED ; les analystes ne pourraient donc plus savoir si deux requêtes portaient le même jeton.
    e:
      en: |-
        This leaves the token in clear text in the logs and in Security Lake, and an expiration rule still stores every request until it expires.
      fr: |-
        Cela laisse le jeton en clair dans les journaux et dans Security Lake, et une règle d'expiration stocke toujours chaque requête jusqu'à son expiration.
references:
  - title: Data protection and logging for AWS WAF protection pack (web ACL) traffic - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-data-protection-and-logging.html
  - title: Data protection - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/data-protection-masking.html
