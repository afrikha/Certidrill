id: scsc03-3b-order-inspector-patch-flow
objective: "3.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany wants continuous validation of its patching. Its Amazon EC2 Linux instances are managed by AWS Systems Manager and scanned by Amazon Inspector with agent-based scanning. The security team creates an Amazon EventBridge rule that matches Inspector findings of critical severity that have a fix available, and the rule starts an AWS Systems Manager Automation runbook. The runbook runs AWS-RunPatchBaseline on the affected instance with a baseline that approves the fix.

    Which four events occur, in sequence, after a new critical vulnerability affects an instance? To answer, move the appropriate events from the list to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany veut une validation continue de ses correctifs. Ses instances Amazon EC2 Linux sont gérées par AWS Systems Manager et analysées par Amazon Inspector avec l'analyse basée sur un agent. L'équipe de sécurité crée une règle Amazon EventBridge qui correspond aux résultats Inspector de sévérité critique pour lesquels un correctif est disponible, et la règle démarre un runbook AWS Systems Manager Automation. Le runbook exécute AWS-RunPatchBaseline sur l'instance concernée avec un référentiel de correctifs qui approuve le correctif.

    Quels sont les quatre événements qui se produisent, dans l'ordre, après qu'une nouvelle vulnérabilité critique a touché une instance ? Pour répondre, déplacez les événements appropriés de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: close
      text: { en: "Amazon Inspector rescans the instance after its software inventory changes and closes the finding.", fr: "Amazon Inspector réanalyse l'instance après la modification de son inventaire logiciel et ferme le résultat." }
    - id: finding
      text: { en: "Amazon Inspector generates a critical finding with a fix available for the instance.", fr: "Amazon Inspector génère un résultat critique avec un correctif disponible pour l'instance." }
    - id: hub
      text: { en: "Security Hub CSPM suppresses the finding because a remediation runbook exists.", fr: "Security Hub CSPM supprime le résultat parce qu'un runbook de correction existe." }
    - id: rule
      text: { en: "The EventBridge rule matches the finding event and starts the Automation runbook.", fr: "La règle EventBridge correspond à l'événement du résultat et démarre le runbook Automation." }
    - id: install
      text: { en: "The runbook runs AWS-RunPatchBaseline with Operation set to Install on the instance.", fr: "Le runbook exécute AWS-RunPatchBaseline avec Operation défini sur Install sur l'instance." }
    - id: report
      text: { en: "Patch Manager sends the patch compliance data to Amazon Inspector, which deletes the finding.", fr: "Patch Manager envoie les données de conformité des correctifs à Amazon Inspector, qui supprime le résultat." }
answer:
  sequence: [finding, rule, install, close]
explanation:
  correct:
    en: "Inspector first generates the finding and publishes it as an EventBridge event. The rule matches the event and starts the runbook, which installs the approved fix with AWS-RunPatchBaseline. With agent-based scanning, a software change triggers a new evaluation, and Inspector closes the finding once the vulnerable package is no longer present."
    fr: "Inspector génère d'abord le résultat et le publie sous forme d'événement EventBridge. La règle correspond à l'événement et démarre le runbook, qui installe le correctif approuvé avec AWS-RunPatchBaseline. Avec l'analyse basée sur un agent, une modification logicielle déclenche une nouvelle évaluation, et Inspector ferme le résultat dès que le paquet vulnérable n'est plus présent."
  options:
    hub:
      en: "Security Hub CSPM does not suppress findings because a runbook exists; suppression would hide the risk instead of validating the fix."
      fr: "Security Hub CSPM ne supprime pas les résultats parce qu'un runbook existe ; une suppression masquerait le risque au lieu de valider la correction."
    report:
      en: "Patch Manager does not send compliance data to Inspector; Inspector closes findings from its own rescan of the instance."
      fr: "Patch Manager n'envoie pas de données de conformité à Inspector ; Inspector ferme les résultats à partir de sa propre réanalyse de l'instance."
references:
  - title: "Scanning Amazon EC2 instances with Amazon Inspector - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-ec2.html
  - title: "SSM Command document for patching: AWS-RunPatchBaseline - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-aws-runpatchbaseline.html
