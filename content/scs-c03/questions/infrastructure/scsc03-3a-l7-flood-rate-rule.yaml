id: scsc03-3a-l7-flood-rate-rule
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company hosts its website on Amazon EC2 instances behind an internet-facing Application Load Balancer. During promotions, the site receives HTTP GET floods from a few thousand IP addresses, each of which sends several hundred requests per minute. The company relies on the automatic protection of AWS Shield Standard today. The company needs to automatically block any client IP address that exceeds a defined request rate, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution héberge son site web sur des instances Amazon EC2 derrière un Application Load Balancer exposé à Internet. Pendant les promotions, le site reçoit des inondations de requêtes HTTP GET provenant de quelques milliers d'adresses IP, qui envoient chacune plusieurs centaines de requêtes par minute. L'entreprise s'appuie aujourd'hui sur la protection automatique d'AWS Shield Standard. Elle doit bloquer automatiquement toute adresse IP cliente qui dépasse un débit de requêtes défini, avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Run an AWS Lambda function every minute that parses the load balancer access logs and adds deny entries for the noisiest IP addresses to the subnets' network ACLs.
        fr: |-
          Exécuter chaque minute une fonction AWS Lambda qui analyse les journaux d'accès de l'équilibreur de charge et ajoute aux listes ACL réseau des sous-réseaux des entrées de refus pour les adresses IP les plus actives.
    - id: b
      text:
        en: |-
          Keep AWS Shield Standard as the only protection, because it automatically mitigates request floods that target Application Load Balancers.
        fr: |-
          Conserver AWS Shield Standard comme seule protection, car il atténue automatiquement les inondations de requêtes qui ciblent les Application Load Balancers.
    - id: c
      text:
        en: |-
          Associate an AWS WAF web ACL with the load balancer, and add a rate-based rule that aggregates requests by source IP address with a Block action.
        fr: |-
          Associer une liste ACL web AWS WAF à l'équilibreur de charge, et y ajouter une règle basée sur le débit (rate-based) qui agrège les requêtes par adresse IP source avec une action Block.
    - id: d
      text:
        en: |-
          Add inbound deny rules for the attacking IP addresses to the load balancer's security group as soon as the flood is detected.
        fr: |-
          Ajouter au groupe de sécurité de l'équilibreur de charge des règles entrantes de refus pour les adresses IP attaquantes dès que l'inondation est détectée.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An AWS WAF rate-based rule counts requests for each aggregation instance, here each source IP address, over its evaluation window and applies its action to instances that exceed the limit. It blocks the flooding addresses automatically and stops blocking them when their rate drops, with no code to maintain.
    fr: |-
      Une règle AWS WAF basée sur le débit compte les requêtes de chaque instance d'agrégation, ici chaque adresse IP source, sur sa fenêtre d'évaluation et applique son action aux instances qui dépassent la limite. Elle bloque automatiquement les adresses qui inondent le site et cesse de les bloquer quand leur débit baisse, sans code à maintenir.
  options:
    a:
      en: |-
        A custom log-parsing function adds operational overhead, reacts with a delay, and network ACLs hold a limited number of rules.
      fr: |-
        Une fonction personnalisée d'analyse des journaux ajoute de la charge opérationnelle, réagit avec retard, et les listes ACL réseau contiennent un nombre limité de règles.
    b:
      en: |-
        Shield Standard defends against common network and transport layer attacks; it does not rate-limit HTTP requests from individual clients.
      fr: |-
        Shield Standard protège contre les attaques courantes des couches réseau et transport ; il ne limite pas le débit des requêtes HTTP de chaque client.
    d:
      en: |-
        Security groups support allow rules only, so they cannot deny specific IP addresses.
      fr: |-
        Les groupes de sécurité ne prennent en charge que des règles d'autorisation ; ils ne peuvent donc pas refuser des adresses IP précises.
