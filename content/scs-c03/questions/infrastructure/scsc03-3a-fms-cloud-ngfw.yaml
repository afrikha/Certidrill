id: scsc03-3a-fms-cloud-ngfw
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has standardized on Palo Alto Networks next-generation firewall policies in its data centers. It now runs workloads in 40 accounts in AWS Organizations and has subscribed to Palo Alto Networks Cloud NGFW in AWS Marketplace. The security team must apply the same centrally managed Cloud NGFW rulestacks to the VPCs of every account, including accounts created later, from a single administrator account.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a standardisé ses politiques de pare-feu de nouvelle génération Palo Alto Networks dans ses centres de données. Elle exécute maintenant ses charges de travail dans 40 comptes d'AWS Organizations et s'est abonnée à Palo Alto Networks Cloud NGFW dans AWS Marketplace. L'équipe de sécurité doit appliquer les mêmes rulestacks Cloud NGFW gérés de manière centralisée aux VPC de chaque compte, y compris les comptes créés ultérieurement, depuis un seul compte administrateur.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Firewall Manager Palo Alto Networks Cloud NGFW policy that references the rulestack, scoped to all accounts in the organization.
        fr: |-
          Créer une politique Palo Alto Networks Cloud NGFW d'AWS Firewall Manager qui référence le rulestack, appliquée à tous les comptes de l'organisation.
    - id: b
      text:
        en: |-
          Create an AWS Firewall Manager AWS WAF policy that contains a Palo Alto Networks managed rule group from AWS Marketplace, scoped to all accounts.
        fr: |-
          Créer une politique AWS WAF d'AWS Firewall Manager qui contient un groupe de règles géré Palo Alto Networks d'AWS Marketplace, appliquée à tous les comptes.
    - id: c
      text:
        en: |-
          Convert the Palo Alto Networks rules to Suricata rules, and deploy an AWS Network Firewall firewall with these rules in every VPC.
        fr: |-
          Convertir les règles Palo Alto Networks en règles Suricata, et déployer dans chaque VPC un pare-feu AWS Network Firewall avec ces règles.
    - id: d
      text:
        en: |-
          Deploy Palo Alto Networks virtual appliances behind a Gateway Load Balancer in each account with CloudFormation StackSets, and update their rules from each account.
        fr: |-
          Déployer des appliances virtuelles Palo Alto Networks derrière un Gateway Load Balancer dans chaque compte avec CloudFormation StackSets, et mettre à jour leurs règles depuis chaque compte.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS Firewall Manager supports third-party firewall policies, including the Palo Alto Networks Cloud NGFW policy, which applies Cloud NGFW protections and rulestacks to the VPCs in scope. Like every Firewall Manager policy, it is managed from the administrator account and is applied automatically to in-scope resources in accounts that join the organization.
    fr: |-
      AWS Firewall Manager prend en charge des politiques de pare-feu tiers, dont la politique Palo Alto Networks Cloud NGFW, qui applique les protections et les rulestacks Cloud NGFW aux VPC de sa portée. Comme toute politique Firewall Manager, elle se gère depuis le compte administrateur et s'applique automatiquement aux ressources de la portée dans les comptes qui rejoignent l'organisation.
  options:
    b:
      en: |-
        An AWS WAF policy deploys web ACLs that inspect HTTP requests to resources such as load balancers; it does not apply network firewall rulestacks to VPCs.
      fr: |-
        Une politique AWS WAF déploie des listes ACL web qui inspectent les requêtes HTTP vers des ressources comme les équilibreurs de charge ; elle n'applique pas de rulestacks de pare-feu réseau aux VPC.
    c:
      en: |-
        Converting rules abandons the standardized Cloud NGFW rulestacks, and deploying firewalls VPC by VPC is not centrally enforced for new accounts.
      fr: |-
        Convertir les règles abandonne les rulestacks Cloud NGFW standardisés, et déployer des pare-feu VPC par VPC n'est pas appliqué de manière centralisée aux nouveaux comptes.
    d:
      en: |-
        Self-managed appliances with per-account rule updates are neither centrally managed nor applied automatically to new accounts.
      fr: |-
        Des appliances autogérées avec des mises à jour de règles par compte ne sont ni gérées de manière centralisée ni appliquées automatiquement aux nouveaux comptes.
references:
  - title: Using AWS Firewall Manager policies - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/working-with-policies.html
