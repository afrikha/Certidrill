id: scsc03-3b-ssm-own-sessions
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's support engineers sign in through IAM Identity Center and use AWS Systems Manager Session Manager to administer Amazon EC2 instances. Their permission set already allows ssm:StartSession on the approved instances and the SSM-SessionManagerRunShell document. The security team requires that each engineer can resume and terminate only the sessions that the engineer started, never the sessions of other engineers.

    Which policy statement should the security team add to the permission set?
  fr: |
    Les ingénieurs du support d'AnyCompany se connectent via IAM Identity Center et utilisent AWS Systems Manager Session Manager pour administrer des instances Amazon EC2. Leur ensemble d'autorisations autorise déjà ssm:StartSession sur les instances approuvées et sur le document SSM-SessionManagerRunShell. L'équipe de sécurité exige que chaque ingénieur ne puisse reprendre et terminer que les sessions qu'il a lui-même démarrées, jamais celles des autres ingénieurs.

    Quelle déclaration de politique l'équipe de sécurité doit-elle ajouter à l'ensemble d'autorisations ?
body:
  options:
    - id: a
      text:
        en: "Allow ssm:ResumeSession and ssm:TerminateSession on arn:aws:ssm:*:*:session/* with a StringEquals condition on aws:RequestTag/aws:ssmmessages:session-id set to ${aws:userid}."
        fr: "Autoriser ssm:ResumeSession et ssm:TerminateSession sur arn:aws:ssm:*:*:session/* avec une condition StringEquals sur aws:RequestTag/aws:ssmmessages:session-id définie sur ${aws:userid}."
    - id: b
      text:
        en: "Allow ssm:ResumeSession and ssm:TerminateSession on the approved instances with a StringEquals condition on ssm:resourceTag/Owner set to ${aws:userid}."
        fr: "Autoriser ssm:ResumeSession et ssm:TerminateSession sur les instances approuvées avec une condition StringEquals sur ssm:resourceTag/Owner définie sur ${aws:userid}."
    - id: c
      text:
        en: "Allow ssm:ResumeSession and ssm:TerminateSession on arn:aws:ssm:*:*:session/* with a StringEquals condition on ssm:resourceTag/aws:ssmmessages:session-id set to ${aws:userid}."
        fr: "Autoriser ssm:ResumeSession et ssm:TerminateSession sur arn:aws:ssm:*:*:session/* avec une condition StringEquals sur ssm:resourceTag/aws:ssmmessages:session-id définie sur ${aws:userid}."
    - id: d
      text:
        en: "Allow ssm:ResumeSession and ssm:TerminateSession on the SSM-SessionManagerRunShell document ARN for the permission set's role only."
        fr: "Autoriser ssm:ResumeSession et ssm:TerminateSession sur l'ARN du document SSM-SessionManagerRunShell, uniquement pour le rôle de l'ensemble d'autorisations."
answer: { optionId: c }
explanation:
  correct:
    en: "Session Manager adds the aws:ssmmessages:session-id resource tag to every session, with the user ID of the principal that started it. A condition on ssm:resourceTag/aws:ssmmessages:session-id that equals ${aws:userid} lets each engineer resume and end only the engineer's own sessions, which is the pattern in the AWS sample policies."
    fr: "Session Manager ajoute la balise de ressource aws:ssmmessages:session-id à chaque session, avec l'identifiant utilisateur du principal qui l'a démarrée. Une condition sur ssm:resourceTag/aws:ssmmessages:session-id égale à ${aws:userid} permet à chaque ingénieur de reprendre et de terminer uniquement ses propres sessions, ce qui correspond au modèle des exemples de politiques AWS."
  options:
    a:
      en: "aws:RequestTag checks tags passed in the request, but resuming or terminating a session passes no tags; the session tag must be read as a resource tag."
      fr: "aws:RequestTag vérifie les balises transmises dans la requête, mais reprendre ou terminer une session ne transmet aucune balise ; la balise de session doit être lue comme balise de ressource."
    b:
      en: "ResumeSession and TerminateSession act on session resources, not instances, and an instance Owner tag does not identify who started a session."
      fr: "ResumeSession et TerminateSession agissent sur des ressources de session, et non sur des instances, et une balise Owner d'instance n'identifie pas qui a démarré une session."
    d:
      en: "Session operations are authorized on session ARNs; granting them on a document does not limit engineers to their own sessions."
      fr: "Les opérations de session sont autorisées sur des ARN de session ; les accorder sur un document ne limite pas les ingénieurs à leurs propres sessions."
references:
  - title: "Sample IAM policies for Session Manager - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/getting-started-restrict-access-quickstart.html
