id: scsc03-3a-bot-control-targeted
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An ecommerce company serves its catalog through an Amazon CloudFront distribution that has an AWS WAF web ACL. The web ACL already includes the AWS WAF Bot Control rule group at the Common inspection level. Competitors scrape prices with headless browsers that do not identify themselves as bots and that imitate real browsers, and Bot Control reports almost none of this traffic. The security team wants a managed control that detects these bots with browser interrogation, fingerprinting, and behavior heuristics, and that challenges them.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de commerce en ligne sert son catalogue par une distribution Amazon CloudFront dotée d'une liste ACL web AWS WAF. La liste ACL web inclut déjà le groupe de règles AWS WAF Bot Control au niveau d'inspection Common. Des concurrents collectent les prix au moyen de navigateurs sans interface (headless) qui ne s'identifient pas comme des bots et imitent de vrais navigateurs, et Bot Control ne signale presque rien de ce trafic. L'équipe de sécurité veut un contrôle géré qui détecte ces bots par interrogation du navigateur, prise d'empreinte et heuristiques comportementales, et qui leur envoie des défis.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the Amazon IP reputation list managed rule group, and block the requests that it labels.
        fr: |-
          Ajouter le groupe de règles géré Amazon IP reputation list, et bloquer les requêtes qu'il étiquette.
    - id: b
      text:
        en: |-
          Add a rate-based rule that aggregates on the source IP address with the CAPTCHA action for clients that exceed the limit.
        fr: |-
          Ajouter une règle basée sur le débit qui agrège selon l'adresse IP source, avec l'action CAPTCHA pour les clients qui dépassent la limite.
    - id: c
      text:
        en: |-
          Add the known bad inputs managed rule group, and block the requests that it labels.
        fr: |-
          Ajouter le groupe de règles géré Known bad inputs, et bloquer les requêtes qu'il étiquette.
    - id: d
      text:
        en: |-
          Change the inspection level of the Bot Control rule group to Targeted.
        fr: |-
          Passer le niveau d'inspection du groupe de règles Bot Control à Targeted.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Targeted protection level of Bot Control adds detection of sophisticated bots that do not self-identify. It uses browser interrogation, fingerprinting, and behavior heuristics, can add machine learning analysis of traffic statistics, and can challenge these bots. The Common level only labels self-identifying bots, verifies desirable bots, and detects high-confidence bot signatures.
    fr: |-
      Le niveau de protection Targeted de Bot Control ajoute la détection des bots sophistiqués qui ne s'identifient pas. Il utilise l'interrogation du navigateur, la prise d'empreinte et des heuristiques comportementales, peut ajouter une analyse par apprentissage automatique des statistiques de trafic, et peut envoyer des défis à ces bots. Le niveau Common se contente d'étiqueter les bots qui s'identifient, de vérifier les bots souhaitables et de détecter les signatures de bots à forte confiance.
  options:
    a:
      en: |-
        An IP reputation list matches known malicious addresses; scrapers on ordinary addresses are not detected, and no browser interrogation takes place.
      fr: |-
        Une liste de réputation IP détecte des adresses malveillantes connues ; les robots de collecte sur des adresses ordinaires ne sont pas détectés, et aucune interrogation du navigateur n'a lieu.
    b:
      en: |-
        A rate limit detects volume, not bot behavior; slow scrapers stay under it, and CAPTCHA puzzles also burden real shoppers who browse quickly.
      fr: |-
        Une limite de débit détecte un volume, pas un comportement de bot ; les robots de collecte lents restent en dessous, et les puzzles CAPTCHA gênent aussi les vrais clients qui naviguent rapidement.
    c:
      en: |-
        Known bad inputs blocks exploit payloads such as Log4j patterns; price scraping sends normal-looking requests.
      fr: |-
        Known bad inputs bloque des charges utiles d'exploitation comme les motifs Log4j ; la collecte de prix envoie des requêtes d'apparence normale.
references:
  - title: AWS WAF Bot Control - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-bot-control.html
