id: scsc03-3c-naa-firewall-bypass
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security standard requires that every inbound path from an internet gateway to the workload subnets of a VPC pass through AWS Network Firewall. After several route table changes made by different teams, the security team must find every possible network path from the internet gateway to the workload subnets that bypasses the firewall, including paths that no traffic has used yet.

    Which solution will meet these requirements?
  fr: |
    La norme de sécurité d'AnyCompany exige que chaque chemin entrant d'une passerelle Internet vers les sous-réseaux de charge de travail d'un VPC passe par AWS Network Firewall. Après plusieurs modifications de tables de routage faites par différentes équipes, l'équipe de sécurité doit trouver chaque chemin réseau possible de la passerelle Internet vers les sous-réseaux de charge de travail qui contourne le pare-feu, y compris les chemins qu'aucun trafic n'a encore empruntés.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable VPC Flow Logs on the workload subnets, and use Amazon Athena to find flows from public IP addresses that do not appear in the firewall flow logs.
        fr: |-
          Activer les journaux de flux VPC sur les sous-réseaux de charge de travail, et utiliser Amazon Athena pour trouver les flux provenant d'adresses IP publiques qui n'apparaissent pas dans les journaux de flux du pare-feu.
    - id: b
      text:
        en: |-
          Run Reachability Analyzer once for a path from the internet gateway to one instance in each workload subnet, and review the hops that each analysis reports.
        fr: |-
          Exécuter Reachability Analyzer une fois pour un chemin de la passerelle Internet vers une instance de chaque sous-réseau de charge de travail, et examiner les sauts que signale chaque analyse.
    - id: c
      text:
        en: |-
          Turn on alert logging for the firewall, and create an alarm when traffic to the workload subnets is missing from the alert logs.
        fr: |-
          Activer la journalisation des alertes du pare-feu, et créer une alarme lorsque du trafic vers les sous-réseaux de charge de travail est absent des journaux d'alertes.
    - id: d
      text:
        en: |-
          Create a Network Access Analyzer scope that matches paths from internet gateways to the workload subnets and excludes paths through AWS::NetworkFirewall::Firewall resources, and analyze it.
        fr: |-
          Créer une étendue Network Access Analyzer qui correspond aux chemins des passerelles Internet vers les sous-réseaux de charge de travail et exclut les chemins qui traversent des ressources AWS::NetworkFirewall::Firewall, puis l'analyser.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Network Access Analyzer analyzes the network configuration to find every path that matches the MatchPaths of a Network Access Scope and none of its ExcludePaths. Matching internet gateway sources and workload subnet destinations, and excluding paths through resources of type AWS::NetworkFirewall::Firewall, reports exactly the paths that bypass the firewall, whether or not traffic has used them.
    fr: |-
      Network Access Analyzer analyse la configuration réseau pour trouver chaque chemin qui correspond aux MatchPaths d'une étendue d'accès réseau (Network Access Scope) et à aucun de ses ExcludePaths. Faire correspondre les passerelles Internet comme sources et les sous-réseaux de charge de travail comme destinations, et exclure les chemins qui traversent des ressources de type AWS::NetworkFirewall::Firewall, signale exactement les chemins qui contournent le pare-feu, qu'un trafic les ait empruntés ou non.
  options:
    a:
      en: |-
        Flow logs record only traffic that actually occurred, so they cannot reveal paths that no traffic has used yet.
      fr: |-
        Les journaux de flux n'enregistrent que le trafic qui a réellement eu lieu ; ils ne peuvent donc pas révéler les chemins qu'aucun trafic n'a encore empruntés.
    b:
      en: |-
        Reachability Analyzer tests one source and destination pair per analysis, so a single instance per subnet does not cover every possible path to the subnets.
      fr: |-
        Reachability Analyzer teste une paire source-destination par analyse : une seule instance par sous-réseau ne couvre donc pas chaque chemin possible vers les sous-réseaux.
    c:
      en: |-
        The firewall logs only traffic that crosses it; traffic that bypasses the firewall never appears in its logs, and unused paths produce no traffic at all.
      fr: |-
        Le pare-feu ne journalise que le trafic qui le traverse ; le trafic qui le contourne n'apparaît jamais dans ses journaux, et les chemins inutilisés ne produisent aucun trafic.
references:
  - title: Example Network Access Scopes in Network Access Analyzer - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/network-access-analyzer/example-scopes.html
  - title: What is Network Access Analyzer? - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/network-access-analyzer/what-is-network-access-analyzer.html
