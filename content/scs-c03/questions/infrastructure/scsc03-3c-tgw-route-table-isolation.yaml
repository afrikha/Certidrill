id: scsc03-3c-tgw-route-table-isolation
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany attaches a production VPC, a development VPC, a shared services VPC and an AWS Site-to-Site VPN connection to one transit gateway. The transit gateway must not provide any route between the production VPC and the development VPC. Both VPCs must reach the shared services VPC and the on-premises network, and the on-premises network must reach all three VPCs.

    Which transit gateway configuration will meet these requirements?
  fr: |
    AnyCompany attache un VPC de production, un VPC de développement, un VPC de services partagés et une connexion AWS Site-to-Site VPN à une même passerelle de transit. La passerelle de transit ne doit fournir aucune route entre le VPC de production et le VPC de développement. Les deux VPC doivent joindre le VPC de services partagés et le réseau sur site, et le réseau sur site doit joindre les trois VPC.

    Quelle configuration de la passerelle de transit permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Associate all attachments with the default route table, propagate all attachments to it, and add network ACL rules in the production VPC that deny the development CIDR.
        fr: |-
          Associer tous les attachements à la table de routage par défaut, y propager tous les attachements, et ajouter dans le VPC de production des règles de liste ACL réseau qui refusent le CIDR de développement.
    - id: b
      text:
        en: |-
          Associate all attachments with the default route table, propagate all attachments to it, and add a blackhole route for the development CIDR to that route table.
        fr: |-
          Associer tous les attachements à la table de routage par défaut, y propager tous les attachements, et ajouter à cette table de routage une route blackhole pour le CIDR de développement.
    - id: c
      text:
        en: |-
          Associate the production and development attachments with a route table that receives propagations only from the shared services and VPN attachments, and associate the shared services and VPN attachments with a route table that receives propagations from all three VPCs.
        fr: |-
          Associer les attachements de production et de développement à une table de routage qui ne reçoit que les propagations des attachements de services partagés et VPN, et associer les attachements de services partagés et VPN à une table de routage qui reçoit les propagations des trois VPC.
    - id: d
      text:
        en: |-
          Create one route table for each attachment, associate each attachment with its own route table, and propagate every attachment to every route table.
        fr: |-
          Créer une table de routage pour chaque attachement, associer chaque attachement à sa propre table de routage, et propager chaque attachement vers chaque table de routage.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Each attachment is associated with exactly one transit gateway route table, which is used to route its traffic, and an attachment's CIDR appears only in the route tables it propagates to. The production and development VPCs look up routes in a table that contains only the shared services and VPN routes, so they have no route to each other, while the table used by shared services and the VPN contains the routes to all three VPCs.
    fr: |-
      Chaque attachement est associé à exactement une table de routage de passerelle de transit, utilisée pour router son trafic, et le CIDR d'un attachement n'apparaît que dans les tables de routage vers lesquelles il est propagé. Les VPC de production et de développement consultent une table qui ne contient que les routes des services partagés et du VPN : ils n'ont donc aucune route l'un vers l'autre, tandis que la table utilisée par les services partagés et le VPN contient les routes vers les trois VPC.
  options:
    a:
      en: |-
        The default route table still contains routes between the production and development VPCs; network ACLs filter traffic but do not remove the transit gateway routes.
      fr: |-
        La table de routage par défaut contient toujours des routes entre les VPC de production et de développement ; les listes ACL réseau filtrent le trafic mais ne suppriment pas les routes de la passerelle de transit.
    b:
      en: |-
        A blackhole route in the shared table also drops traffic from the shared services VPC and the VPN to the development VPC, which must stay reachable.
      fr: |-
        Une route blackhole dans la table commune abandonne aussi le trafic du VPC de services partagés et du VPN vers le VPC de développement, qui doit rester joignable.
    d:
      en: |-
        Propagating every attachment to every route table gives production and development routes to each other.
      fr: |-
        Propager chaque attachement vers chaque table de routage donne à la production et au développement des routes l'un vers l'autre.
references:
  - title: How AWS Transit Gateway works - Amazon VPC
    url: https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-isolated-shared.html
