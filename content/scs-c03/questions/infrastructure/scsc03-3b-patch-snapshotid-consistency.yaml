id: scsc03-3b-patch-snapshotid-consistency
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany patches 900 Amazon EC2 instances outside maintenance windows. A script starts several AWS Systems Manager Run Command invocations of AWS-RunPatchBaseline with Operation set to Install, one for each group of instances, over a period of about 3 hours. The patch baseline uses auto-approval rules. An audit found that some instances in the same patching run received a patch that was approved while the run was in progress, and others did not. The auditors require every instance in a run to receive the same set of approved patches. The baseline's approval rules must not be edited for each run.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany applique les correctifs de 900 instances Amazon EC2 en dehors des fenêtres de maintenance. Un script démarre plusieurs appels AWS Systems Manager Run Command d'AWS-RunPatchBaseline avec Operation défini sur Install, un par groupe d'instances, sur une période d'environ 3 heures. Le référentiel de correctifs (patch baseline) utilise des règles d'approbation automatique. Un audit a révélé que certaines instances d'une même campagne de correctifs ont reçu un correctif approuvé pendant la campagne, et d'autres non. Les auditeurs exigent que chaque instance d'une campagne reçoive le même ensemble de correctifs approuvés. Les règles d'approbation du référentiel ne doivent pas être modifiées à chaque campagne.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Generate one GUID at the start of each run, and pass it as the SnapshotId parameter of every Run Command invocation of that run."
        fr: "Générer un GUID au début de chaque campagne, et le transmettre comme paramètre SnapshotId de chaque appel Run Command de cette campagne."
    - id: b
      text:
        en: "Set an approval cutoff date in the baseline at the start of each run, and remove the auto-approval delay."
        fr: "Définir une date limite d'approbation dans le référentiel au début de chaque campagne, et supprimer le délai d'approbation automatique."
    - id: c
      text:
        en: "Build a YAML list of the approved patches for each operating system at the start of each run, and pass it in the InstallOverrideList parameter."
        fr: "Construire au début de chaque campagne une liste YAML des correctifs approuvés pour chaque système d'exploitation, et la transmettre dans le paramètre InstallOverrideList."
    - id: d
      text:
        en: "Run a single Run Command invocation for all 900 instances with a maximum concurrency of 10 percent instead of one invocation per group."
        fr: "Exécuter un seul appel Run Command pour les 900 instances avec une simultanéité maximale de 10 % au lieu d'un appel par groupe."
answer: { optionId: a }
explanation:
  correct:
    en: "AWS-RunPatchBaseline uses the SnapshotId parameter to identify the patch baseline snapshot of an operation. AWS recommends setting your own SnapshotId when the document runs outside a maintenance window so that all targeted nodes get the same approved patch set, even across several invocations."
    fr: "AWS-RunPatchBaseline utilise le paramètre SnapshotId pour identifier l'instantané du référentiel de correctifs d'une opération. AWS recommande de définir son propre SnapshotId lorsque le document s'exécute en dehors d'une fenêtre de maintenance afin que tous les nœuds ciblés reçoivent le même ensemble de correctifs approuvés, même sur plusieurs appels."
  options:
    b:
      en: "Changing the cutoff date and the delay edits the approval rules for each run, which the requirements forbid."
      fr: "Modifier la date limite et le délai revient à éditer les règles d'approbation à chaque campagne, ce que les exigences interdisent."
    c:
      en: "An override list can fix the installed patches, but building and maintaining a list for each operating system at every run is far more effort than passing one GUID."
      fr: "Une liste de remplacement peut figer les correctifs installés, mais construire et maintenir une liste par système d'exploitation à chaque campagne demande bien plus d'efforts que transmettre un GUID."
    d:
      en: "Rate controls only limit how many instances run the command at the same time; without a shared SnapshotId, instances that start hours apart can still evaluate the baseline at different times."
      fr: "Les contrôles de débit limitent seulement le nombre d'instances qui exécutent la commande en même temps ; sans SnapshotId commun, des instances qui démarrent à plusieurs heures d'intervalle peuvent toujours évaluer le référentiel à des moments différents."
references:
  - title: "SSM Command document for patching: AWS-RunPatchBaseline - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-aws-runpatchbaseline.html
