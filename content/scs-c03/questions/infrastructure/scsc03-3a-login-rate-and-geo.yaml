id: scsc03-3a-login-rate-and-geo
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company hosts a web application behind an internet-facing Application Load Balancer that is associated with an AWS WAF web ACL. The application is not behind Amazon CloudFront. The security team has two requirements. First, each client IP address can send at most 20 POST requests to the /login path in any 1-minute period, and other paths must not be rate limited. Second, the application must accept requests only from the United States and Canada.

    Which combination of rules will meet these requirements? (Choose two.)
  fr: |
    Une entreprise héberge une application web derrière un Application Load Balancer exposé à Internet, associé à une liste ACL web AWS WAF. L'application n'est pas derrière Amazon CloudFront. L'équipe de sécurité a deux exigences. D'abord, chaque adresse IP cliente peut envoyer au maximum 20 requêtes POST vers le chemin /login sur toute période de 1 minute, et les autres chemins ne doivent pas être limités. Ensuite, l'application ne doit accepter que les requêtes provenant des États-Unis et du Canada.

    Quelle combinaison de règles permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          A rate-based rule that aggregates on the source IP address, with a 60-second window, a limit of 20, and a scope-down statement that matches the /login path and the POST method.
        fr: |-
          Une règle basée sur le débit qui agrège selon l'adresse IP source, avec une fenêtre de 60 secondes, une limite de 20 et une instruction de réduction de portée qui correspond au chemin /login et à la méthode POST.
    - id: b
      text:
        en: |-
          A rate-based rule that aggregates on the source IP address, with a 300-second window, a limit of 100, and no scope-down statement.
        fr: |-
          Une règle basée sur le débit qui agrège selon l'adresse IP source, avec une fenêtre de 300 secondes, une limite de 100 et aucune instruction de réduction de portée.
    - id: c
      text:
        en: |-
          A rate-based rule that uses Count all aggregation, with a 60-second window, a limit of 20, and a scope-down statement that matches the /login path and the POST method.
        fr: |-
          Une règle basée sur le débit qui utilise l'agrégation Count all, avec une fenêtre de 60 secondes, une limite de 20 et une instruction de réduction de portée qui correspond au chemin /login et à la méthode POST.
    - id: d
      text:
        en: |-
          A rule with a Block action whose statement is a NOT statement around a geo match statement for the country codes US and CA.
        fr: |-
          Une règle avec une action Block dont l'instruction est une instruction NOT autour d'une instruction de correspondance géographique pour les codes de pays US et CA.
    - id: e
      text:
        en: |-
          A geographic restrictions allow list for the country codes US and CA, configured on the load balancer's listener.
        fr: |-
          Une liste d'autorisation de restrictions géographiques pour les codes de pays US et CA, configurée sur l'écouteur de l'équilibreur de charge.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      A rate-based rule with a scope-down statement counts and rate limits only the requests that match it, here POST requests to /login, and the 60-second evaluation window with a limit of 20 matches the per-minute requirement for each source IP address. A geo match statement wrapped in a NOT statement matches every request that does not come from the listed ISO country codes, so the Block action admits only the United States and Canada.
    fr: |-
      Une règle basée sur le débit dotée d'une instruction de réduction de portée ne compte et ne limite que les requêtes qui y correspondent, ici les requêtes POST vers /login, et la fenêtre d'évaluation de 60 secondes avec une limite de 20 correspond à l'exigence par minute pour chaque adresse IP source. Une instruction de correspondance géographique encapsulée dans une instruction NOT correspond à toute requête qui ne provient pas des codes de pays ISO indiqués ; l'action Block n'admet donc que les États-Unis et le Canada.
  options:
    b:
      en: |-
        Without a scope-down statement the rule limits every path, and 100 requests in 5 minutes allows bursts far above 20 per minute.
      fr: |-
        Sans instruction de réduction de portée, la règle limite tous les chemins, et 100 requêtes en 5 minutes autorisent des pics bien supérieurs à 20 par minute.
    c:
      en: |-
        Count all uses one counter for all clients, so the first 20 login requests of all users combined would trigger the rule.
      fr: |-
        Count all utilise un seul compteur pour tous les clients ; les 20 premières requêtes de connexion de l'ensemble des utilisateurs déclencheraient donc la règle.
    e:
      en: |-
        Geographic restrictions are a CloudFront distribution feature; Application Load Balancer listeners have no such setting.
      fr: |-
        Les restrictions géographiques sont une fonctionnalité des distributions CloudFront ; les écouteurs d'Application Load Balancer n'ont pas ce paramètre.
references:
