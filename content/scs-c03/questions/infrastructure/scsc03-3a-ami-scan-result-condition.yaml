id: scsc03-3a-ami-scan-result-condition
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's EC2 Image Builder pipeline builds a golden AMI every week and distributes it to three AWS Regions. A new security requirement states that a build must fail before distribution if the AMI has any vulnerability finding more severe than MEDIUM for which a fix is available. Findings of MEDIUM severity or lower are acceptable. Amazon Inspector is not activated for Amazon EC2 scanning in the build account, and the company does not want to activate it there.

    Which solution will meet these requirements?
  fr: |
    Le pipeline EC2 Image Builder d'AnyCompany construit une AMI de référence chaque semaine et la distribue dans trois Régions AWS. Une nouvelle exigence de sécurité impose qu'un build échoue avant la distribution si l'AMI présente un résultat de vulnérabilité plus grave que MEDIUM pour lequel un correctif est disponible. Les résultats de gravité MEDIUM ou inférieure sont acceptables. Amazon Inspector n'est pas activé pour l'analyse Amazon EC2 dans le compte de build, et l'entreprise ne veut pas l'y activer.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Set the pipeline's image scanning type to TEST_INSTANCE_CVE, and review the findings that Image Builder saves with each image before approving the distribution.
        fr: |-
          Définir le type d'analyse d'image du pipeline sur TEST_INSTANCE_CVE, et examiner les résultats qu'Image Builder enregistre avec chaque image avant d'approuver la distribution.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule for Amazon Inspector findings that invokes an AWS Lambda function to deregister the AMI in each Region when a HIGH or CRITICAL finding appears.
        fr: |-
          Créer une règle Amazon EventBridge sur les résultats d'Amazon Inspector qui invoque une fonction AWS Lambda pour désenregistrer l'AMI dans chaque Région lorsqu'un résultat HIGH ou CRITICAL apparaît.
    - id: c
      text:
        en: |-
          Enable Allowed AMIs in the build account with a ScanResultCondition whose MaximumSeverityLabel is MEDIUM.
        fr: |-
          Activer Allowed AMIs dans le compte de build avec une ScanResultCondition dont MaximumSeverityLabel vaut MEDIUM.
    - id: d
      text:
        en: |-
          Set the pipeline's image scanning type to ON_DEMAND_AMI_CVE with a scanResultCondition whose maximumSeverityLabel is MEDIUM and fixAvailable is true.
        fr: |-
          Définir le type d'analyse d'image du pipeline sur ON_DEMAND_AMI_CVE avec une scanResultCondition dont maximumSeverityLabel vaut MEDIUM et fixAvailable vaut true.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An on-demand AMI scan has Amazon Inspector scan the output AMI and does not require Inspector activation. With a scanResultCondition, Image Builder waits for the scan and fails the image in the test stage, before distribution, when a finding is more severe than maximumSeverityLabel; fixAvailable true counts only findings that have a fix.
    fr: |-
      Une analyse d'AMI à la demande fait analyser l'AMI produite par Amazon Inspector et ne nécessite pas l'activation d'Inspector. Avec une scanResultCondition, Image Builder attend l'analyse et fait échouer l'image à l'étape de test, avant la distribution, lorsqu'un résultat est plus grave que maximumSeverityLabel ; fixAvailable à true ne compte que les résultats qui ont un correctif.
  options:
    a:
      en: |-
        Test instance scans require Inspector to be activated for EC2 in the build Region, and the saved findings are for review; they do not fail the build automatically.
      fr: |-
        Les analyses d'instance de test exigent qu'Inspector soit activé pour EC2 dans la Région de build, et les résultats enregistrés servent à l'examen ; ils ne font pas échouer le build automatiquement.
    b:
      en: |-
        This reacts after the AMI has been distributed, needs Inspector findings that the account does not produce, and adds custom code.
      fr: |-
        Cette solution réagit après la distribution de l'AMI, a besoin de résultats Inspector que le compte ne produit pas, et ajoute du code personnalisé.
    c:
      en: |-
        Allowed AMIs controls which AMIs users can discover and launch; it does not stop Image Builder from distributing an image, and the account's own AMIs are always allowed.
      fr: |-
        Allowed AMIs contrôle les AMI que les utilisateurs peuvent découvrir et lancer ; il n'empêche pas Image Builder de distribuer une image, et les AMI du compte lui-même sont toujours autorisées.
references:
  - title: Amazon Inspector integration in Image Builder - EC2 Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/integ-inspector.html
