id: scsc03-3b-contextual-grounding-rag
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's warranty assistant uses retrieval augmented generation (RAG) on Amazon Bedrock. The application passes the retrieved warranty documents and the customer's question to the model. Some answers invent warranty terms that are not in the documents, and others do not answer the customer's question. The security team must block answers that are not supported by the retrieved documents or that are irrelevant to the question.

    Which Amazon Bedrock Guardrails feature should the team configure?
  fr: |
    L'assistant de garantie d'AnyCompany utilise la génération à enrichissement contextuel (RAG) sur Amazon Bedrock. L'application transmet au modèle les documents de garantie récupérés et la question du client. Certaines réponses inventent des conditions de garantie absentes des documents, et d'autres ne répondent pas à la question du client. L'équipe de sécurité doit bloquer les réponses qui ne sont pas étayées par les documents récupérés ou qui ne sont pas pertinentes pour la question.

    Quelle fonctionnalité d'Amazon Bedrock Guardrails l'équipe doit-elle configurer ?
body:
  options:
    - id: a
      text:
        en: "A contextual grounding check with grounding and relevance thresholds."
        fr: "Une vérification d'ancrage contextuel avec des seuils d'ancrage et de pertinence."
    - id: b
      text:
        en: "A content filter for the Misconduct category at HIGH strength."
        fr: "Un filtre de contenu pour la catégorie Misconduct avec une intensité HIGH."
    - id: c
      text:
        en: "A denied topic that describes warranty terms that the company does not offer."
        fr: "Un sujet refusé qui décrit les conditions de garantie que l'entreprise ne propose pas."
    - id: d
      text:
        en: "A sensitive information filter that masks warranty numbers in the responses."
        fr: "Un filtre d'informations sensibles qui masque les numéros de garantie dans les réponses."
answer: { optionId: a }
explanation:
  correct:
    en: "Contextual grounding checks compare the response with a grounding source and the user query. The grounding score detects information that is not in the source, and the relevance score detects answers that do not address the query; responses below the thresholds are blocked."
    fr: "Les vérifications d'ancrage contextuel comparent la réponse à une source d'ancrage et à la requête de l'utilisateur. Le score d'ancrage détecte les informations absentes de la source, et le score de pertinence détecte les réponses qui ne traitent pas la requête ; les réponses sous les seuils sont bloquées."
  options:
    b:
      en: "Content filters detect harmful categories such as misconduct, not answers that contradict the retrieved documents."
      fr: "Les filtres de contenu détectent des catégories nuisibles comme les comportements répréhensibles, et non les réponses qui contredisent les documents récupérés."
    c:
      en: "A denied topic blocks a subject; it cannot list every invented term, and it would also block legitimate warranty answers."
      fr: "Un sujet refusé bloque un sujet ; il ne peut pas lister chaque condition inventée, et il bloquerait aussi des réponses de garantie légitimes."
    d:
      en: "Masking identifiers protects sensitive data but does not detect ungrounded or irrelevant answers."
      fr: "Masquer des identifiants protège les données sensibles mais ne détecte pas les réponses non ancrées ou non pertinentes."
references:
  - title: "Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
