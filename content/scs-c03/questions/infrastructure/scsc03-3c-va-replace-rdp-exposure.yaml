id: scsc03-3c-va-replace-rdp-exposure
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Amazon Inspector reports network reachability findings for 30 Windows EC2 instances in one subnet: TCP port 3389 is reachable from an internet gateway. The instances' security group allows RDP from 0.0.0.0/0 for administrators who work from home with dynamic IP addresses. The administrators use the native Remote Desktop client on managed Windows laptops and sign in with the corporate OpenID Connect (OIDC) identity provider. The security team must remove the internet exposure, authorize each connection against the identity provider, reevaluate access continuously while connections are open, and log every access attempt.

    Which solution will meet these requirements?
  fr: |
    Amazon Inspector signale des résultats d'accessibilité réseau pour 30 instances EC2 Windows d'un même sous-réseau : le port TCP 3389 est accessible depuis une passerelle Internet. Le groupe de sécurité des instances autorise RDP depuis 0.0.0.0/0 pour des administrateurs qui travaillent depuis leur domicile avec des adresses IP dynamiques. Les administrateurs utilisent le client Bureau à distance natif sur des ordinateurs portables Windows gérés et se connectent avec le fournisseur d'identité OpenID Connect (OIDC) de l'entreprise. L'équipe de sécurité doit supprimer l'exposition à Internet, autoriser chaque connexion auprès du fournisseur d'identité, réévaluer l'accès en continu tant que les connexions sont ouvertes, et journaliser chaque tentative d'accès.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Restrict the RDP rule to the administrators' current home IP addresses, and update the rule with a Lambda function whenever an address changes.
        fr: |-
          Restreindre la règle RDP aux adresses IP actuelles du domicile des administrateurs, et mettre à jour la règle avec une fonction Lambda chaque fois qu'une adresse change.
    - id: b
      text:
        en: |-
          Deploy AWS Client VPN with an authorization rule for the VPC CIDR, and replace the 0.0.0.0/0 rule with a rule for the Client VPN client CIDR.
        fr: |-
          Déployer AWS Client VPN avec une règle d'autorisation pour le CIDR du VPC, et remplacer la règle 0.0.0.0/0 par une règle pour le CIDR des clients Client VPN.
    - id: c
      text:
        en: |-
          Create a Verified Access network CIDR endpoint for the subnet on TCP port 3389 with an OIDC trust provider, deploy the Connectivity Client, and allow RDP only from the endpoint's security group.
        fr: |-
          Créer un point de terminaison CIDR réseau Verified Access pour le sous-réseau sur le port TCP 3389 avec un fournisseur de confiance OIDC, déployer le Connectivity Client, et n'autoriser RDP que depuis le groupe de sécurité du point de terminaison.
    - id: d
      text:
        en: |-
          Place the instances behind an internet-facing Application Load Balancer with an authenticate-oidc listener rule, and allow RDP only from the load balancer's security group.
        fr: |-
          Placer les instances derrière un Application Load Balancer accessible depuis Internet avec une règle d'écouteur authenticate-oidc, et n'autoriser RDP que depuis le groupe de sécurité de l'équilibreur de charge.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Verified Access supports non-HTTP applications through TCP endpoints, such as network CIDR endpoints, that users reach with the Connectivity Client. The client sends identity and device context to Verified Access, which evaluates the policy for each connection, reevaluates access continuously while the client is connected, and logs every access attempt; referencing the endpoint security group removes the 0.0.0.0/0 exposure.
    fr: |-
      Verified Access prend en charge les applications non HTTP par des points de terminaison TCP, comme les points de terminaison CIDR réseau, que les utilisateurs joignent avec le Connectivity Client. Le client envoie le contexte d'identité et d'appareil à Verified Access, qui évalue la politique pour chaque connexion, réévalue l'accès en continu tant que le client est connecté et journalise chaque tentative d'accès ; référencer le groupe de sécurité du point de terminaison supprime l'exposition 0.0.0.0/0.
  options:
    a:
      en: |-
        The instances stay reachable from the internet on port 3389, and an IP-based rule neither authorizes connections against the identity provider nor reevaluates them.
      fr: |-
        Les instances restent accessibles depuis Internet sur le port 3389, et une règle basée sur les adresses IP n'autorise pas les connexions auprès du fournisseur d'identité et ne les réévalue pas.
    b:
      en: |-
        Client VPN grants network-level access to the whole VPC CIDR once the tunnel is up, instead of a policy decision for each application connection that is reevaluated continuously.
      fr: |-
        Client VPN accorde un accès de niveau réseau à tout le CIDR du VPC une fois le tunnel établi, au lieu d'une décision de politique pour chaque connexion à l'application réévaluée en continu.
    d:
      en: |-
        An Application Load Balancer handles HTTP and HTTPS requests only, so it cannot carry native RDP sessions.
      fr: |-
        Un Application Load Balancer ne traite que les requêtes HTTP et HTTPS ; il ne peut donc pas transporter des sessions RDP natives.
references:
  - title: Connectivity Client for AWS Verified Access - AWS Verified Access
    url: https://docs.aws.amazon.com/verified-access/latest/ug/connectivity-client.html
  - title: Verified Access endpoints - AWS Verified Access
    url: https://docs.aws.amazon.com/verified-access/latest/ug/verified-access-endpoints.html
