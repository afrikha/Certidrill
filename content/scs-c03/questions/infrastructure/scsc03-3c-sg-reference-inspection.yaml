id: scsc03-3c-sg-reference-inspection
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany attaches an application VPC and a database VPC to the same transit gateway in one Region. Security group referencing is enabled on the transit gateway and on both VPC attachments. The transit gateway route tables send all traffic between the two VPCs through an inspection VPC that contains AWS Network Firewall. The database security group has an inbound rule on port 5432 whose source is the application security group, but connections from the application instances fail. The firewall logs show that the traffic is allowed. Inspection must stay in the path.

    Which solution will meet these requirements?
  fr: |
    AnyCompany attache un VPC applicatif et un VPC de base de données à la même passerelle de transit dans une Région. Le référencement de groupes de sécurité est activé sur la passerelle de transit et sur les deux attachements de VPC. Les tables de routage de la passerelle de transit envoient tout le trafic entre les deux VPC par un VPC d'inspection qui contient AWS Network Firewall. Le groupe de sécurité de la base de données a une règle entrante sur le port 5432 dont la source est le groupe de sécurité applicatif, mais les connexions des instances applicatives échouent. Les journaux du pare-feu montrent que le trafic est autorisé. L'inspection doit rester dans le chemin.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable security group referencing on the transit gateway attachment of the inspection VPC so that the reference is preserved through the firewall.
        fr: |-
          Activer le référencement de groupes de sécurité sur l'attachement de passerelle de transit du VPC d'inspection afin que la référence soit conservée à travers le pare-feu.
    - id: b
      text:
        en: |-
          Enable appliance mode on the transit gateway attachment of the inspection VPC so that the source security group is kept on the return path.
        fr: |-
          Activer le mode appliance sur l'attachement de passerelle de transit du VPC d'inspection afin que le groupe de sécurité source soit conservé sur le chemin de retour.
    - id: c
      text:
        en: |-
          Create a VPC peering connection between the application VPC and the database VPC, and keep the rule that references the application security group.
        fr: |-
          Créer une connexion d'appairage de VPC (VPC peering) entre le VPC applicatif et le VPC de base de données, et conserver la règle qui référence le groupe de sécurité applicatif.
    - id: d
      text:
        en: |-
          Replace the source of the database rule with a customer-managed prefix list that contains the CIDR blocks of the application subnets.
        fr: |-
          Remplacer la source de la règle de base de données par une liste de préfixes gérée par le client qui contient les blocs CIDR des sous-réseaux applicatifs.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Security group referencing over a transit gateway works for inbound rules between VPCs attached to the same transit gateway, but it does not work when traffic passes through an inspection VPC with AWS Network Firewall or a Gateway Load Balancer. A rule based on the application CIDR blocks, here grouped in a managed prefix list, allows the traffic while it keeps flowing through the firewall.
    fr: |-
      Le référencement de groupes de sécurité par une passerelle de transit fonctionne pour les règles entrantes entre des VPC attachés à la même passerelle de transit, mais il ne fonctionne pas lorsque le trafic traverse un VPC d'inspection doté d'AWS Network Firewall ou d'un Gateway Load Balancer. Une règle basée sur les blocs CIDR applicatifs, regroupés ici dans une liste de préfixes gérée, autorise le trafic tout en le laissant passer par le pare-feu.
  options:
    a:
      en: |-
        Security group referencing is not supported for traffic that goes through Network Firewall in an inspection VPC, whatever the attachment settings.
      fr: |-
        Le référencement de groupes de sécurité n'est pas pris en charge pour le trafic qui passe par Network Firewall dans un VPC d'inspection, quels que soient les paramètres des attachements.
    b:
      en: |-
        Appliance mode keeps a flow in one Availability Zone of the inspection VPC; it does not make security group references work through the firewall.
      fr: |-
        Le mode appliance maintient un flux dans une seule zone de disponibilité du VPC d'inspection ; il ne fait pas fonctionner les références de groupes de sécurité à travers le pare-feu.
    c:
      en: |-
        Traffic over the peering connection would no longer pass through the inspection VPC, which breaks the inspection requirement.
      fr: |-
        Le trafic de la connexion d'appairage ne passerait plus par le VPC d'inspection, ce qui enfreint l'exigence d'inspection.
references:
  - title: Amazon VPC attachments in AWS Transit Gateway - Amazon VPC
    url: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-vpc-attachments.html
