id: scsc03-3b-lambda-coverage-gaps
objective: "3.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's security tooling account is the Amazon Inspector delegated administrator for its organization in AWS Organizations. The security team activated Lambda standard scanning and Lambda code scanning for all member accounts. One week later, the Inspector coverage page shows that several AWS Lambda functions in a production account have never been scanned. The functions use a supported Python runtime, and none of them has an Inspector exclusion tag.

    Which two reasons could explain why Amazon Inspector does not scan these functions? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Le compte d'outils de sécurité d'AnyCompany est l'administrateur délégué Amazon Inspector de son organisation AWS Organizations. L'équipe de sécurité a activé l'analyse standard Lambda et l'analyse du code Lambda pour tous les comptes membres. Une semaine plus tard, la page de couverture d'Inspector montre que plusieurs fonctions AWS Lambda d'un compte de production n'ont jamais été analysées. Les fonctions utilisent un environnement d'exécution Python pris en charge, et aucune ne porte de balise d'exclusion Inspector.

    Quelles sont les deux raisons qui pourraient expliquer pourquoi Amazon Inspector n'analyse pas ces fonctions ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "The functions are connected to private subnets of a VPC that has no NAT gateway."
        fr: "Les fonctions sont connectées à des sous-réseaux privés d'un VPC qui n'a pas de passerelle NAT."
    - id: b
      text:
        en: "The functions have not been invoked or updated during the last 90 days."
        fr: "Les fonctions n'ont pas été appelées ni mises à jour au cours des 90 derniers jours."
    - id: c
      text:
        en: "The execution roles of the functions do not include the AmazonInspector2ReadOnlyAccess managed policy."
        fr: "Les rôles d'exécution des fonctions n'incluent pas la politique gérée AmazonInspector2ReadOnlyAccess."
    - id: d
      text:
        en: "The functions are encrypted with a customer managed AWS KMS key."
        fr: "Les fonctions sont chiffrées avec une clé AWS KMS gérée par le client."
    - id: e
      text:
        en: "No CloudTrail trail in the production account records Lambda data events."
        fr: "Aucun journal de suivi CloudTrail du compte de production n'enregistre les événements de données Lambda."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Amazon Inspector scans only functions that were invoked or updated during the last 90 days; inactive functions are excluded automatically until they are invoked or changed again. Functions encrypted with customer managed keys are not supported by Lambda standard scanning or Lambda code scanning, so they never appear as scanned."
    fr: "Amazon Inspector n'analyse que les fonctions appelées ou mises à jour au cours des 90 derniers jours ; les fonctions inactives sont exclues automatiquement jusqu'à ce qu'elles soient de nouveau appelées ou modifiées. Les fonctions chiffrées avec des clés gérées par le client ne sont prises en charge ni par l'analyse standard Lambda ni par l'analyse du code Lambda : elles n'apparaissent donc jamais comme analysées."
  options:
    a:
      en: "Inspector reads the function code and dependencies through the Lambda service, not from the function's network, so VPC connectivity does not affect scanning."
      fr: "Inspector lit le code et les dépendances de la fonction via le service Lambda, et non depuis le réseau de la fonction : la connectivité du VPC n'a pas d'effet sur l'analyse."
    c:
      en: "Inspector does not run as the function's execution role; the execution role controls what the function code can call, not whether the function is scanned."
      fr: "Inspector ne s'exécute pas avec le rôle d'exécution de la fonction ; ce rôle contrôle ce que le code de la fonction peut appeler, et non le fait que la fonction soit analysée."
    e:
      en: "When Lambda scanning is activated, Inspector creates its own service-linked CloudTrail channels to track changes; it does not depend on a customer trail with data events."
      fr: "Lorsque l'analyse Lambda est activée, Inspector crée ses propres canaux CloudTrail liés au service pour suivre les modifications ; il ne dépend pas d'un journal de suivi client avec des événements de données."
references:
  - title: "Scanning AWS Lambda functions with Amazon Inspector - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-lambda.html
