id: scsc03-3b-container-image-patching
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 60 Amazon ECS services on AWS Fargate. The images are stored in Amazon ECR, and Amazon Inspector enhanced scanning reports critical operating system package vulnerabilities in the base layer of 12 images that are currently used by running tasks. The security team must remove the vulnerabilities from the running services, prioritize the images that are actually in use, and keep the services consistent with their images in source control.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 60 services Amazon ECS sur AWS Fargate. Les images sont stockées dans Amazon ECR, et l'analyse améliorée d'Amazon Inspector signale des vulnérabilités critiques de paquets du système d'exploitation dans la couche de base de 12 images actuellement utilisées par des tâches en cours d'exécution. L'équipe de sécurité doit éliminer les vulnérabilités des services en cours d'exécution, traiter en priorité les images réellement utilisées, et garder les services cohérents avec leurs images du contrôle de source.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use ECS Exec to run the package manager in each running task, and install the fixed packages in place."
        fr: "Utiliser ECS Exec pour exécuter le gestionnaire de paquets dans chaque tâche en cours d'exécution, et installer sur place les paquets corrigés."
    - id: b
      text:
        en: "Register the Fargate tasks as managed nodes, and apply a Patch Manager patch policy with the RebootIfNeeded option."
        fr: "Enregistrer les tâches Fargate comme nœuds gérés, et appliquer une politique de correctifs Patch Manager avec l'option RebootIfNeeded."
    - id: c
      text:
        en: "Update the services to platform version LATEST and force a new deployment so that Fargate patches the image packages."
        fr: "Mettre à jour les services vers la version de plateforme LATEST et forcer un nouveau déploiement afin que Fargate corrige les paquets des images."
    - id: d
      text:
        en: "Rebuild the images in use from an updated base image in the pipeline, push them to Amazon ECR, and redeploy the services."
        fr: "Reconstruire les images utilisées à partir d'une image de base mise à jour dans le pipeline, les envoyer dans Amazon ECR, puis redéployer les services."
answer: { optionId: d }
explanation:
  correct:
    en: "Container images are patched by rebuilding them: the pipeline rebuilds from a fixed base image, pushes the new image, and the services are redeployed, which keeps the running tasks consistent with source control. Inspector maps ECR images to running ECS and EKS containers, including Fargate, and its in-use filter criteria identify which images to fix first."
    fr: "Les images de conteneur se corrigent en les reconstruisant : le pipeline reconstruit à partir d'une image de base corrigée, envoie la nouvelle image, puis les services sont redéployés, ce qui garde les tâches cohérentes avec le contrôle de source. Inspector associe les images ECR aux conteneurs ECS et EKS en cours d'exécution, y compris sur Fargate, et ses critères de filtre d'utilisation indiquent les images à corriger en premier."
  options:
    a:
      en: "Changes made inside running tasks are lost when the tasks are replaced and create drift from the images in source control."
      fr: "Les modifications faites dans les tâches en cours d'exécution sont perdues au remplacement des tâches et créent un écart avec les images du contrôle de source."
    b:
      en: "Patch Manager patches managed nodes such as EC2 instances; Fargate tasks are not managed nodes, and the packages come from the image."
      fr: "Patch Manager corrige des nœuds gérés comme les instances EC2 ; les tâches Fargate ne sont pas des nœuds gérés, et les paquets proviennent de l'image."
    c:
      en: "The platform version covers the Fargate infrastructure, not the operating system packages inside the customer's image."
      fr: "La version de plateforme concerne l'infrastructure Fargate, et non les paquets du système d'exploitation contenus dans l'image du client."
references:
  - title: "Scanning Amazon Elastic Container Registry container images with Amazon Inspector - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-ecr.html
