id: scsc03-3b-runtime-scp-telemetry
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's GuardDuty delegated administrator enabled Runtime Monitoring for Amazon EC2 with automated agent configuration for every member account. All Amazon EC2 instances are managed by AWS Systems Manager and run the same supported Amazon Linux 2023 AMI. In accounts of the Workloads OU, the SSM association that installs the GuardDuty security agent succeeds, but the coverage status of the instances stays unhealthy and no runtime findings are produced. Instances in other OUs are healthy. The Workloads OU has an allow-list service control policy (SCP) that permits only the actions that the security team has approved. The security team must restore runtime monitoring in the Workloads OU.

    Which solution will meet these requirements?
  fr: |
    L'administrateur délégué GuardDuty d'AnyCompany a activé Runtime Monitoring pour Amazon EC2 avec la configuration automatisée de l'agent pour chaque compte membre. Toutes les instances Amazon EC2 sont gérées par AWS Systems Manager et exécutent la même AMI Amazon Linux 2023 prise en charge. Dans les comptes de l'OU Workloads, l'association SSM qui installe l'agent de sécurité GuardDuty réussit, mais l'état de couverture des instances reste non sain et aucun résultat d'exécution n'est produit. Les instances des autres OU sont saines. L'OU Workloads a une politique de contrôle des services (SCP) de type liste d'autorisation qui ne permet que les actions approuvées par l'équipe de sécurité. L'équipe de sécurité doit rétablir la surveillance de l'exécution dans l'OU Workloads.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add an IAM policy that allows guardduty:SendSecurityTelemetry to the instance profile role of each instance in the Workloads OU."
        fr: "Ajouter une politique IAM qui autorise guardduty:SendSecurityTelemetry au rôle du profil d'instance de chaque instance de l'OU Workloads."
    - id: b
      text:
        en: "Add the guardduty:SendSecurityTelemetry action to the allow-list SCP that is attached to the Workloads OU."
        fr: "Ajouter l'action guardduty:SendSecurityTelemetry à la SCP de liste d'autorisation attachée à l'OU Workloads."
    - id: c
      text:
        en: "Add the GuardDutyManaged tag with the value true to the instances, and turn on access to tags in the instance metadata."
        fr: "Ajouter la balise GuardDutyManaged avec la valeur true aux instances, et activer l'accès aux balises dans les métadonnées d'instance."
    - id: d
      text:
        en: "Enable Runtime Monitoring again from each member account of the Workloads OU so that the member setting overrides the delegated administrator."
        fr: "Réactiver Runtime Monitoring depuis chaque compte membre de l'OU Workloads afin que le paramètre du membre remplace celui de l'administrateur délégué."
answer: { optionId: b }
explanation:
  correct:
    en: "The security agent sends its runtime events with the guardduty:SendSecurityTelemetry action, and GuardDuty requires the SCPs of multi-account environments to allow it. An allow-list SCP that omits this action blocks the telemetry in every account of the OU, even though the agent is installed, so the action must be added to the SCP."
    fr: "L'agent de sécurité envoie ses événements d'exécution avec l'action guardduty:SendSecurityTelemetry, et GuardDuty exige que les SCP des environnements multicomptes l'autorisent. Une SCP de liste d'autorisation qui omet cette action bloque la télémétrie dans tous les comptes de l'OU, même si l'agent est installé : l'action doit donc être ajoutée à la SCP."
  options:
    a:
      en: "The agent authenticates with the instance identity role, not the instance profile role, and an SCP limits every principal in the account, so an identity policy cannot grant what the SCP does not allow."
      fr: "L'agent s'authentifie avec le rôle d'identité de l'instance, et non le rôle du profil d'instance, et une SCP limite tous les principaux du compte : une politique d'identité ne peut pas accorder ce que la SCP n'autorise pas."
    c:
      en: "Inclusion and exclusion tags only decide whether GuardDuty installs the agent; the agent is already installed and is blocked when it sends telemetry."
      fr: "Les balises d'inclusion et d'exclusion décident seulement si GuardDuty installe l'agent ; l'agent est déjà installé et il est bloqué lorsqu'il envoie sa télémétrie."
    d:
      en: "Member accounts cannot override the configuration that the delegated administrator manages, and the SCP would still block the telemetry."
      fr: "Les comptes membres ne peuvent pas remplacer la configuration gérée par l'administrateur délégué, et la SCP bloquerait toujours la télémétrie."
references:
  - title: "Prerequisites for Amazon EC2 instance support - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/prereq-runtime-monitoring-ec2-support.html
