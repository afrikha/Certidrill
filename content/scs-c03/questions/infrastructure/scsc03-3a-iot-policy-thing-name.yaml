id: scsc03-3a-iot-policy-thing-name
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany operates 50,000 sensors that connect to AWS IoT Core over MQTT. Each sensor is registered as a thing, and its X.509 certificate is attached exclusively to that thing. The security team requires one AWS IoT policy, attached to every certificate, that enforces the following: a device can connect only with a client ID equal to its thing name, only devices attached to a registered thing can connect, and a device can publish only to the topic telemetry/ followed by its own thing name.

    Which policy statements will meet these requirements?
  fr: |
    AnyCompany exploite 50 000 capteurs qui se connectent à AWS IoT Core en MQTT. Chaque capteur est enregistré comme objet (thing), et son certificat X.509 est attaché exclusivement à cet objet. L'équipe de sécurité exige une seule politique AWS IoT, attachée à chaque certificat, qui impose ce qui suit : un appareil ne peut se connecter qu'avec un ID client égal à son nom d'objet, seuls les appareils attachés à un objet enregistré peuvent se connecter, et un appareil ne peut publier que sur la rubrique telemetry/ suivie de son propre nom d'objet.

    Quelles instructions de politique permettent de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow iot:Connect on `client/*` for any client ID, and allow iot:Publish on `topicfilter/telemetry/${iot:ClientId}`.
        fr: |-
          Autoriser iot:Connect sur `client/*` pour tout ID client, et autoriser iot:Publish sur `topicfilter/telemetry/${iot:ClientId}`.
    - id: b
      text:
        en: |-
          Allow iot:Connect on `client/${iot:Connection.Thing.ThingName}` when `iot:Connection.Thing.IsAttached` is true, and allow iot:Publish on `topic/telemetry/#`.
        fr: |-
          Autoriser iot:Connect sur `client/${iot:Connection.Thing.ThingName}` lorsque `iot:Connection.Thing.IsAttached` vaut true, et autoriser iot:Publish sur `topic/telemetry/#`.
    - id: c
      text:
        en: |-
          Allow iot:Connect on `client/${iot:Connection.Thing.ThingName}` when `iot:Connection.Thing.IsAttached` is true, and allow iot:Publish on `topic/telemetry/${iot:Connection.Thing.ThingName}`.
        fr: |-
          Autoriser iot:Connect sur `client/${iot:Connection.Thing.ThingName}` lorsque `iot:Connection.Thing.IsAttached` vaut true, et autoriser iot:Publish sur `topic/telemetry/${iot:Connection.Thing.ThingName}`.
    - id: d
      text:
        en: |-
          Allow iot:Connect on `client/*` when `iot:Connection.Thing.IsAttached` is true, and allow iot:Publish on `topic/telemetry/*`.
        fr: |-
          Autoriser iot:Connect sur `client/*` lorsque `iot:Connection.Thing.IsAttached` vaut true, et autoriser iot:Publish sur `topic/telemetry/*`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The thing policy variable iot:Connection.Thing.ThingName resolves to the thing attached to the certificate that the device presents, so one policy can restrict the client resource and the topic resource to each device's own name. The iot:Connection.Thing.IsAttached condition allows only devices attached to a registered thing, and iot:Publish is authorized on topic resources.
    fr: |-
      La variable de politique d'objet iot:Connection.Thing.ThingName se résout en l'objet attaché au certificat que présente l'appareil ; une seule politique peut donc limiter la ressource client et la ressource rubrique au propre nom de chaque appareil. La condition iot:Connection.Thing.IsAttached n'autorise que les appareils attachés à un objet enregistré, et iot:Publish est autorisé sur des ressources de type topic.
  options:
    a:
      en: |-
        client/* accepts any client ID, there is no attachment check, and iot:Publish is authorized on topic resources, not topicfilter resources.
      fr: |-
        client/* accepte n'importe quel ID client, il n'y a aucune vérification d'attachement, et iot:Publish s'autorise sur des ressources topic, pas topicfilter.
    b:
      en: |-
        In policies # is a literal character, not an MQTT wildcard, so devices could publish only to the literal topic telemetry/# and never to their own topic.
      fr: |-
        Dans les politiques, # est un caractère littéral et non un caractère générique MQTT ; les appareils ne pourraient donc publier que sur la rubrique littérale telemetry/# et jamais sur leur propre rubrique.
    d:
      en: |-
        Any client ID is accepted, and * matches every topic under telemetry/, so a device could publish as another device.
      fr: |-
        N'importe quel ID client est accepté, et * correspond à toutes les rubriques sous telemetry/ ; un appareil pourrait donc publier en se faisant passer pour un autre.
references:
  - title: Thing policy variables - AWS IoT Core
    url: https://docs.aws.amazon.com/iot/latest/developerguide/thing-policy-variables.html
  - title: Publish/Subscribe policy examples - AWS IoT Core
    url: https://docs.aws.amazon.com/iot/latest/developerguide/pub-sub-policy.html
