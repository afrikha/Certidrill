id: scsc03-3a-geo-block-partner-exception
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany serves a B2B portal through an Amazon CloudFront distribution that has an AWS WAF web ACL. A compliance requirement states that requests from two countries where the company does not operate must be blocked at the edge and must never reach the origin. One logistics partner is located in one of those countries and must keep access from its fixed address range, 203.0.113.0/24. The partner's requests must still be evaluated by the other rules in the web ACL.

    Which solution will meet these requirements?
  fr: |
    AnyCompany sert un portail B2B par une distribution Amazon CloudFront dotée d'une liste ACL web AWS WAF. Une exigence de conformité impose que les requêtes provenant de deux pays où l'entreprise n'exerce pas d'activité soient bloquées en périphérie et n'atteignent jamais l'origine. Un partenaire logistique se trouve dans l'un de ces pays et doit conserver l'accès depuis sa plage d'adresses fixe, 203.0.113.0/24. Les requêtes du partenaire doivent tout de même être évaluées par les autres règles de la liste ACL web.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the two countries to a CloudFront geographic restrictions block list, and add a web ACL rule with an Allow action for an IP set that contains the partner's range.
        fr: |-
          Ajouter les deux pays à une liste de blocage des restrictions géographiques de CloudFront, et ajouter une règle de liste ACL web avec une action Allow pour un ensemble d'adresses IP qui contient la plage du partenaire.
    - id: b
      text:
        en: |-
          Add a rule that blocks requests that match a geo match statement for the two countries and that do not match an IP set that contains the partner's range.
        fr: |-
          Ajouter une règle qui bloque les requêtes qui correspondent à une instruction de correspondance géographique pour les deux pays et qui ne correspondent pas à un ensemble d'adresses IP contenant la plage du partenaire.
    - id: c
      text:
        en: |-
          Add a geo match rule with a Block action for the two countries at priority 0, and a rule with an Allow action for an IP set that contains the partner's range at priority 1.
        fr: |-
          Ajouter une règle de correspondance géographique avec une action Block pour les deux pays en priorité 0, et une règle avec une action Allow pour un ensemble d'adresses IP contenant la plage du partenaire en priorité 1.
    - id: d
      text:
        en: |-
          Forward the CloudFront-Viewer-Country header to the origin with an origin request policy, and return HTTP 403 from the application for the two countries unless the client is the partner.
        fr: |-
          Transmettre l'en-tête CloudFront-Viewer-Country à l'origine avec une politique de requête d'origine, et renvoyer HTTP 403 depuis l'application pour les deux pays, sauf si le client est le partenaire.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An AND statement that combines the geo match statement with a NOT statement around an IP set match blocks the two countries at the edge while letting the partner's range through. Because the rule does not match the partner, its requests continue to the remaining rules of the web ACL, which an Allow rule would have ended.
    fr: |-
      Une instruction AND qui combine l'instruction de correspondance géographique avec une instruction NOT autour d'une correspondance d'ensemble d'adresses IP bloque les deux pays en périphérie tout en laissant passer la plage du partenaire. Comme la règle ne correspond pas au partenaire, ses requêtes continuent vers les autres règles de la liste ACL web, ce qu'une règle Allow aurait interrompu.
  options:
    a:
      en: |-
        CloudFront geographic restrictions do not forward blocked requests to AWS WAF, so the partner is blocked before any Allow rule runs, and an Allow rule would skip the other rules.
      fr: |-
        Les restrictions géographiques de CloudFront ne transmettent pas les requêtes bloquées à AWS WAF ; le partenaire est donc bloqué avant l'exécution de toute règle Allow, et une règle Allow ignorerait les autres règles.
    c:
      en: |-
        Block is a terminating action, so the geo match rule at priority 0 blocks the partner before the Allow rule is evaluated.
      fr: |-
        Block est une action finale ; la règle de correspondance géographique en priorité 0 bloque donc le partenaire avant que la règle Allow ne soit évaluée.
    d:
      en: |-
        Requests from the two countries would still reach the origin, which the compliance requirement forbids.
      fr: |-
        Les requêtes des deux pays atteindraient toujours l'origine, ce que l'exigence de conformité interdit.
references:
  - title: Geographic match rule statement - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-geo-match.html
  - title: Restrict the geographic distribution of your content - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html
