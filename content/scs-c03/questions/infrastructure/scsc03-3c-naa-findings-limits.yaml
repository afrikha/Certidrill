id: scsc03-3c-naa-findings-limits
objective: "3.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's security team plans to use Network Access Analyzer findings as audit evidence that no unnecessary network paths lead to its cardholder data environment. The environment uses IPv4 and IPv6, AWS Network Firewall stateful rule groups, and transit gateway connections to VPCs in other accounts. Before relying on the findings, the team reviews how Network Access Analyzer works.

    Which two statements about Network Access Analyzer are correct? (Choose two.)
  fr: |
    L'équipe de sécurité d'AnyCompany prévoit d'utiliser les résultats de Network Access Analyzer comme preuve d'audit qu'aucun chemin réseau inutile ne mène à son environnement de données de titulaires de cartes. L'environnement utilise IPv4 et IPv6, des groupes de règles avec état d'AWS Network Firewall, et des connexions de passerelle de transit vers des VPC d'autres comptes. Avant de s'appuyer sur les résultats, l'équipe examine le fonctionnement de Network Access Analyzer.

    Quelles sont les deux affirmations correctes sur Network Access Analyzer ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "It performs a static analysis of the network configuration and sends no packets."
        fr: "Il effectue une analyse statique de la configuration réseau et n'envoie aucun paquet."
    - id: b
      text:
        en: "It evaluates the stateful rule groups of AWS Network Firewall on each path that it reports."
        fr: "Il évalue les groupes de règles avec état d'AWS Network Firewall sur chaque chemin qu'il signale."
    - id: c
      text:
        en: "It reports IPv6 paths, including outbound paths through egress-only internet gateways."
        fr: "Il signale les chemins IPv6, y compris les chemins sortants par des passerelles Internet de sortie uniquement."
    - id: d
      text:
        en: "It evaluates network paths only within the account and Region from which the analysis runs."
        fr: "Il évalue les chemins réseau uniquement dans le compte et la Région depuis lesquels l'analyse s'exécute."
    - id: e
      text:
        en: "It reports only the paths that carried traffic during the 24 hours before the analysis."
        fr: "Il ne signale que les chemins qui ont transporté du trafic pendant les 24 heures précédant l'analyse."
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Network Access Analyzer uses automated reasoning on the configuration: it is a static analysis that sends no packets and reports paths that a packet can take, whether or not traffic used them. It evaluates paths only within the account and Region where the analysis runs, so paths through resources in other accounts or Regions are not reported.
    fr: |-
      Network Access Analyzer applique un raisonnement automatisé à la configuration : c'est une analyse statique qui n'envoie aucun paquet et signale les chemins qu'un paquet peut emprunter, qu'un trafic les ait utilisés ou non. Il n'évalue les chemins que dans le compte et la Région où l'analyse s'exécute ; les chemins qui traversent des ressources d'autres comptes ou d'autres Régions ne sont donc pas signalés.
  options:
    b:
      en: "Network Firewall rules are not analyzed, so a reported path that contains a firewall may in fact be blocked by its rules."
      fr: "Les règles de Network Firewall ne sont pas analysées : un chemin signalé qui contient un pare-feu peut donc en réalité être bloqué par ses règles."
    c:
      en: "IPv6 is not supported; the analysis covers IPv4 over TCP and UDP only."
      fr: "IPv6 n'est pas pris en charge ; l'analyse ne couvre qu'IPv4 sur TCP et UDP."
    e:
      en: "The analysis is based on configuration, not on traffic records, so it reports paths whether or not traffic used them."
      fr: "L'analyse repose sur la configuration, pas sur des enregistrements de trafic ; elle signale donc les chemins qu'un trafic les ait utilisés ou non."
references:
  - title: How Network Access Analyzer works - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/network-access-analyzer/how-network-access-analyzer-works.html
  - title: Getting started with Network Access Analyzer - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/network-access-analyzer/getting-started.html
