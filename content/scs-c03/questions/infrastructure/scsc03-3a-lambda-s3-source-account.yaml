id: scsc03-3a-lambda-s3-source-account
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In account 111122223333, an Amazon S3 event notification on the bucket amzn-s3-demo-uploads invokes an AWS Lambda function in the same account. A security review flags a confused deputy risk: if the bucket is deleted, another AWS account could create a bucket with the same name and invoke the function through Amazon S3. The function must remain invocable by the current bucket's notifications.

    Which statement should the function's resource-based policy contain?
  fr: |
    Dans le compte 111122223333, une notification d'événement Amazon S3 sur le compartiment amzn-s3-demo-uploads invoque une fonction AWS Lambda du même compte. Une revue de sécurité signale un risque de « confused deputy » : si le compartiment est supprimé, un autre compte AWS pourrait créer un compartiment du même nom et invoquer la fonction par Amazon S3. La fonction doit rester invocable par les notifications du compartiment actuel.

    Quelle instruction la politique basée sur les ressources de la fonction doit-elle contenir ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow lambda:InvokeFunction for the service principal s3.amazonaws.com with an aws:SourceArn condition for the bucket ARN and an aws:SourceAccount condition for 111122223333.
        fr: |-
          Autoriser lambda:InvokeFunction pour le principal de service s3.amazonaws.com avec une condition aws:SourceArn sur l'ARN du compartiment et une condition aws:SourceAccount sur 111122223333.
    - id: b
      text:
        en: |-
          Allow lambda:InvokeFunction for the service principal s3.amazonaws.com with an aws:SourceArn condition for the bucket ARN only.
        fr: |-
          Autoriser lambda:InvokeFunction pour le principal de service s3.amazonaws.com avec uniquement une condition aws:SourceArn sur l'ARN du compartiment.
    - id: c
      text:
        en: |-
          Allow lambda:InvokeFunction for the principal arn:aws:iam::111122223333:root with an aws:SourceArn condition for the bucket ARN.
        fr: |-
          Autoriser lambda:InvokeFunction pour le principal arn:aws:iam::111122223333:root avec une condition aws:SourceArn sur l'ARN du compartiment.
    - id: d
      text:
        en: |-
          Allow lambda:InvokeFunction for the service principal s3.amazonaws.com with an aws:SourceAccount condition for 111122223333 and no aws:SourceArn condition.
        fr: |-
          Autoriser lambda:InvokeFunction pour le principal de service s3.amazonaws.com avec une condition aws:SourceAccount sur 111122223333 et sans condition aws:SourceArn.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon S3 invokes the function as the s3.amazonaws.com service principal, so the resource-based policy must grant that principal access. aws:SourceArn limits invocations to the bucket, but an S3 bucket ARN contains no account ID, so aws:SourceAccount is also needed to ensure that only a bucket in account 111122223333 can invoke the function.
    fr: |-
      Amazon S3 invoque la fonction en tant que principal de service s3.amazonaws.com ; la politique basée sur les ressources doit donc accorder l'accès à ce principal. aws:SourceArn limite les invocations au compartiment, mais l'ARN d'un compartiment S3 ne contient pas d'ID de compte ; aws:SourceAccount est donc aussi nécessaire pour garantir que seul un compartiment du compte 111122223333 peut invoquer la fonction.
  options:
    b:
      en: |-
        The bucket ARN has no account ID, so a same-name bucket created in another account would still match the condition.
      fr: |-
        L'ARN du compartiment ne contient pas d'ID de compte ; un compartiment de même nom créé dans un autre compte correspondrait donc toujours à la condition.
    c:
      en: |-
        Event notifications come from the S3 service principal, not from an IAM principal of the account, so this statement would not allow the notifications.
      fr: |-
        Les notifications d'événements proviennent du principal de service S3, pas d'un principal IAM du compte ; cette instruction n'autoriserait donc pas les notifications.
    d:
      en: |-
        Without aws:SourceArn, any bucket in the account could invoke the function, which is broader than the single notification it needs.
      fr: |-
        Sans aws:SourceArn, n'importe quel compartiment du compte pourrait invoquer la fonction, ce qui est plus large que l'unique notification nécessaire.
references:
  - title: Granting Event Function access to AWS services - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/permissions-function-services.html
  - title: The confused deputy problem - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/confused-deputy.html
