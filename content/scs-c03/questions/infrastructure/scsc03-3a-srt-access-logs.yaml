id: scsc03-3a-srt-access-logs
objective: "3.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany protects an Amazon CloudFront distribution and an Application Load Balancer with AWS Shield Advanced and has an Enterprise Support plan. AWS WAF web ACLs protect both resources and log their traffic. The load balancer writes its access logs to an Amazon S3 bucket in the same account, encrypted with SSE-S3. The DDoS response plan states that, during an attack, the Shield Response Team (SRT) must be able to analyze the AWS WAF logs and the load balancer access logs, and to create or update AWS WAF rules on the company's behalf.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany protège une distribution Amazon CloudFront et un Application Load Balancer avec AWS Shield Advanced et dispose d'un plan Enterprise Support. Des listes ACL web AWS WAF protègent les deux ressources et journalisent leur trafic. L'équilibreur de charge écrit ses journaux d'accès dans un compartiment Amazon S3 du même compte, chiffré avec SSE-S3. Le plan de réponse aux attaques DDoS indique que, pendant une attaque, la Shield Response Team (SRT) doit pouvoir analyser les journaux AWS WAF et les journaux d'accès de l'équilibreur de charge, et créer ou modifier des règles AWS WAF pour le compte de l'entreprise.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Re-encrypt the access log bucket with a customer managed AWS KMS key, and allow the SRT to use the key in its key policy.
        fr: |-
          Rechiffrer le compartiment des journaux d'accès avec une clé AWS KMS gérée par le client, et autoriser la SRT à utiliser la clé dans sa politique de clé.
    - id: b
      text:
        en: |-
          In the SRT access settings, grant the SRT access to the access log bucket so that Shield adds a bucket policy statement for drt.shield.amazonaws.com.
        fr: |-
          Dans les paramètres d'accès de la SRT, accorder à la SRT l'accès au compartiment des journaux d'accès afin que Shield ajoute une instruction de politique de compartiment pour drt.shield.amazonaws.com.
    - id: c
      text:
        en: |-
          Enable proactive engagement and add the on-call engineers as emergency contacts in Shield Advanced.
        fr: |-
          Activer l'engagement proactif et ajouter les ingénieurs d'astreinte comme contacts d'urgence dans Shield Advanced.
    - id: d
      text:
        en: |-
          Create an IAM user for the SRT, attach the AWSWAFFullAccess managed policy, and send its access keys through a support case.
        fr: |-
          Créer un utilisateur IAM pour la SRT, lui attacher la politique gérée AWSWAFFullAccess, et transmettre ses clés d'accès dans un dossier de support.
    - id: e
      text:
        en: |-
          Grant SRT access with an IAM role that trusts drt.shield.amazonaws.com and has the AWSShieldDRTAccessPolicy managed policy attached.
        fr: |-
          Accorder l'accès de la SRT au moyen d'un rôle IAM qui approuve drt.shield.amazonaws.com et auquel la politique gérée AWSShieldDRTAccessPolicy est attachée.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      The SRT acts through an IAM role that trusts the drt.shield.amazonaws.com service principal and has the AWSShieldDRTAccessPolicy managed policy, which lets it call the Shield Advanced and AWS WAF APIs and read the AWS WAF logs. Logs outside the web ACL logs, such as load balancer access logs, need explicit bucket access: Shield adds a statement that grants s3:GetBucketLocation, s3:GetObject and s3:ListBucket to the SRT on each selected bucket in the same account.
    fr: |-
      La SRT agit au moyen d'un rôle IAM qui approuve le principal de service drt.shield.amazonaws.com et possède la politique gérée AWSShieldDRTAccessPolicy, qui lui permet d'appeler les API Shield Advanced et AWS WAF et de lire les journaux AWS WAF. Les journaux autres que ceux des listes ACL web, comme les journaux d'accès d'un équilibreur de charge, exigent un accès explicite au compartiment : Shield ajoute une instruction qui accorde s3:GetBucketLocation, s3:GetObject et s3:ListBucket à la SRT sur chaque compartiment choisi du même compte.
  options:
    a:
      en: |-
        The SRT cannot view logs stored in buckets encrypted with AWS KMS keys; it supports plaintext and SSE-S3 buckets only.
      fr: |-
        La SRT ne peut pas consulter des journaux stockés dans des compartiments chiffrés avec des clés AWS KMS ; elle ne prend en charge que les compartiments en clair ou chiffrés avec SSE-S3.
    c:
      en: |-
        Proactive engagement lets the SRT contact the company during an event, but it grants no access to logs or to AWS WAF.
      fr: |-
        L'engagement proactif permet à la SRT de contacter l'entreprise pendant un événement, mais il n'accorde aucun accès aux journaux ni à AWS WAF.
    d:
      en: |-
        SRT access is granted only through a role associated with Shield; long-term IAM user keys are not the mechanism and add credential risk.
      fr: |-
        L'accès de la SRT s'accorde uniquement par un rôle associé à Shield ; des clés à long terme d'utilisateur IAM ne sont pas le mécanisme prévu et ajoutent un risque lié aux informations d'identification.
references:
  - title: Granting access for the SRT - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-srt-access.html
