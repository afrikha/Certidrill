id: scsc03-3c-va-logs-trust-context
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Verified Access with an AWS IAM Identity Center trust provider and a Jamf device trust provider. For audits, the security team must keep in an Amazon S3 bucket a record of every access attempt, including denied attempts, together with the user and device claims that were evaluated. The records must use the Open Cybersecurity Schema Framework (OCSF) so that they can be queried with the company's other security logs.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS Verified Access avec un fournisseur de confiance AWS IAM Identity Center et un fournisseur de confiance d'appareils Jamf. Pour les audits, l'équipe de sécurité doit conserver dans un compartiment Amazon S3 un enregistrement de chaque tentative d'accès, y compris les tentatives refusées, avec les revendications d'utilisateur et d'appareil qui ont été évaluées. Les enregistrements doivent utiliser l'Open Cybersecurity Schema Framework (OCSF) afin de pouvoir être interrogés avec les autres journaux de sécurité de l'entreprise.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on Verified Access logging to the S3 bucket with the ocsf-1.0.0-rc.2 log version, and turn on the inclusion of trust context in the logs.
        fr: |-
          Activer la journalisation Verified Access vers le compartiment S3 avec la version de journal ocsf-1.0.0-rc.2, et activer l'inclusion du contexte de confiance dans les journaux.
    - id: b
      text:
        en: |-
          Turn on Verified Access logging to the S3 bucket with the ocsf-0.1 log version, and turn on the inclusion of trust context in the logs.
        fr: |-
          Activer la journalisation Verified Access vers le compartiment S3 avec la version de journal ocsf-0.1, et activer l'inclusion du contexte de confiance dans les journaux.
    - id: c
      text:
        en: |-
          Create an AWS CloudTrail trail that delivers the management events of Verified Access to the S3 bucket, and query the events with Amazon Athena.
        fr: |-
          Créer un journal de suivi AWS CloudTrail qui livre les événements de gestion de Verified Access dans le compartiment S3, et interroger les événements avec Amazon Athena.
    - id: d
      text:
        en: |-
          Turn on access logs for the internal Application Load Balancers behind the endpoints, and deliver the access logs to the S3 bucket.
        fr: |-
          Activer les journaux d'accès des Application Load Balancer internes derrière les points de terminaison, et livrer les journaux d'accès dans le compartiment S3.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Verified Access logs every access attempt after policy evaluation, in OCSF format, to CloudWatch Logs, Amazon S3 or Amazon Data Firehose. The trust context (the user and device claims sent by the trust providers) is included only when you turn it on, and including it requires the ocsf-1.0.0-rc.2 log version.
    fr: |-
      Verified Access journalise chaque tentative d'accès après l'évaluation des politiques, au format OCSF, dans CloudWatch Logs, Amazon S3 ou Amazon Data Firehose. Le contexte de confiance (les revendications d'utilisateur et d'appareil envoyées par les fournisseurs de confiance) n'est inclus que si vous l'activez, et son inclusion exige la version de journal ocsf-1.0.0-rc.2.
  options:
    b:
      en: |-
        Trust context can be included only with the ocsf-1.0.0-rc.2 log version, not with ocsf-0.1.
      fr: |-
        Le contexte de confiance ne peut être inclus qu'avec la version de journal ocsf-1.0.0-rc.2, pas avec ocsf-0.1.
    c:
      en: |-
        CloudTrail records API calls that create or change Verified Access resources, not each user's access attempts with the evaluated claims.
      fr: |-
        CloudTrail enregistre les appels d'API qui créent ou modifient des ressources Verified Access, pas chaque tentative d'accès des utilisateurs avec les revendications évaluées.
    d:
      en: |-
        Denied requests never reach the load balancers, and their access logs contain neither the user and device claims nor the OCSF format.
      fr: |-
        Les requêtes refusées n'atteignent jamais les équilibreurs de charge, et leurs journaux d'accès ne contiennent ni les revendications d'utilisateur et d'appareil ni le format OCSF.
references:
  - title: Verified Access logs - AWS Verified Access
    url: https://docs.aws.amazon.com/verified-access/latest/ug/access-logs.html
  - title: Enable or disable Verified Access trust context - AWS Verified Access
    url: https://docs.aws.amazon.com/verified-access/latest/ug/include-trust-context.html
