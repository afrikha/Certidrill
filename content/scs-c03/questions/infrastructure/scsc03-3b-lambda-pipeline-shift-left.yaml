id: scsc03-3b-lambda-pipeline-shift-left
objective: "3.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys Python AWS Lambda functions as .zip archives from GitHub through a V2 AWS CodePipeline pipeline. The security team has two requirements. The pipeline must stop before the deploy stage when the third-party dependencies in the source code have any critical vulnerability. After deployment, the functions must be reassessed automatically whenever a new vulnerability that affects their dependencies is published. The team wants managed AWS capabilities with the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    AnyCompany déploie des fonctions AWS Lambda Python sous forme d'archives .zip depuis GitHub via un pipeline AWS CodePipeline V2. L'équipe de sécurité a deux exigences. Le pipeline doit s'arrêter avant l'étape de déploiement lorsque les dépendances tierces du code source présentent une vulnérabilité critique. Après le déploiement, les fonctions doivent être réévaluées automatiquement chaque fois qu'une nouvelle vulnérabilité qui touche leurs dépendances est publiée. L'équipe veut des capacités AWS gérées avec le MOINS de charge opérationnelle.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Add an InspectorScan action in SourceCodeScan mode with CriticalThreshold set to 0 before the deploy stage."
        fr: "Ajouter une action InspectorScan en mode SourceCodeScan avec CriticalThreshold défini sur 0 avant l'étape de déploiement."
    - id: b
      text:
        en: "Configure Lambda code signing with an AWS Signer signing profile so that only signed archives can be deployed."
        fr: "Configurer la signature de code Lambda avec un profil de signature AWS Signer afin que seules les archives signées puissent être déployées."
    - id: c
      text:
        en: "Activate Amazon Inspector Lambda standard scanning for the account."
        fr: "Activer l'analyse standard Lambda d'Amazon Inspector pour le compte."
    - id: d
      text:
        en: "Turn on Amazon ECR enhanced scanning with continuous scanning for the repositories of the pipeline."
        fr: "Activer l'analyse améliorée d'Amazon ECR avec l'analyse continue pour les référentiels du pipeline."
    - id: e
      text:
        en: "Activate Amazon Inspector Lambda code scanning for the account without Lambda standard scanning."
        fr: "Activer l'analyse du code Lambda d'Amazon Inspector pour le compte sans l'analyse standard Lambda."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The InspectorScan action in SourceCodeScan mode scans the source artifact and fails the action when the number of critical vulnerabilities exceeds the threshold, which stops the pipeline before deployment. Lambda standard scanning then monitors the dependencies of deployed functions and rescans them when Inspector adds a relevant CVE."
    fr: "L'action InspectorScan en mode SourceCodeScan analyse l'artefact source et fait échouer l'action lorsque le nombre de vulnérabilités critiques dépasse le seuil, ce qui arrête le pipeline avant le déploiement. L'analyse standard Lambda surveille ensuite les dépendances des fonctions déployées et les réanalyse quand Inspector ajoute une CVE pertinente."
  options:
    b:
      en: "Code signing proves that the archive was not altered after signing; it does not detect vulnerable dependencies."
      fr: "La signature de code prouve que l'archive n'a pas été modifiée après la signature ; elle ne détecte pas les dépendances vulnérables."
    d:
      en: "The functions are deployed as .zip archives, not container images, so ECR scanning does not cover them."
      fr: "Les fonctions sont déployées sous forme d'archives .zip, et non d'images de conteneur : l'analyse ECR ne les couvre pas."
    e:
      en: "Code scanning requires standard scanning to be activated first, and it looks for flaws in custom code rather than vulnerable dependencies."
      fr: "L'analyse du code exige l'activation préalable de l'analyse standard, et elle recherche des failles dans le code personnalisé plutôt que des dépendances vulnérables."
references:
  - title: "Amazon Inspector InspectorScan invoke action reference - AWS CodePipeline"
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-InspectorScan.html
  - title: "Scanning AWS Lambda functions with Amazon Inspector - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-lambda.html
