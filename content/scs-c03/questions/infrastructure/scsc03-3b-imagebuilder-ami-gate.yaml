id: scsc03-3b-imagebuilder-ami-gate
objective: "3.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's EC2 Image Builder pipeline builds a golden AMI every week and distributes it to 30 accounts. The security team requires that no AMI is distributed if Amazon Inspector finds a vulnerability with a fix available whose severity is higher than MEDIUM. Amazon Inspector EC2 scanning is not activated in the image tooling account, and the team does not want to activate it there.

    Which solution will meet these requirements?
  fr: |
    Le pipeline EC2 Image Builder d'AnyCompany construit chaque semaine une AMI de référence et la distribue à 30 comptes. L'équipe de sécurité exige qu'aucune AMI ne soit distribuée si Amazon Inspector trouve une vulnérabilité avec un correctif disponible dont la sévérité est supérieure à MEDIUM. L'analyse EC2 d'Amazon Inspector n'est pas activée dans le compte d'outils d'images, et l'équipe ne veut pas l'y activer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Configure the pipeline with the TEST_INSTANCE_CVE scan type, and review the Security findings page before each distribution."
        fr: "Configurer le pipeline avec le type d'analyse TEST_INSTANCE_CVE, et consulter la page Security findings avant chaque distribution."
    - id: b
      text:
        en: "Configure the pipeline with the ON_DEMAND_AMI_CVE scan type and a scanResultCondition with maximumSeverityLabel set to MEDIUM and fixAvailable set to true."
        fr: "Configurer le pipeline avec le type d'analyse ON_DEMAND_AMI_CVE et une condition scanResultCondition avec maximumSeverityLabel défini sur MEDIUM et fixAvailable défini sur true."
    - id: c
      text:
        en: "Configure the pipeline with the ON_DEMAND_AMI_CVE scan type without a scan result condition, and deregister the AMI if Inspector reports a HIGH finding."
        fr: "Configurer le pipeline avec le type d'analyse ON_DEMAND_AMI_CVE sans condition de résultat d'analyse, et désinscrire l'AMI si Inspector signale un résultat HIGH."
    - id: d
      text:
        en: "Create an Amazon EventBridge rule on Amazon Inspector findings that invokes an AWS Lambda function to cancel the distribution of AMIs with HIGH or CRITICAL findings."
        fr: "Créer une règle Amazon EventBridge sur les résultats Amazon Inspector qui appelle une fonction AWS Lambda pour annuler la distribution des AMI avec des résultats HIGH ou CRITICAL."
answer: { optionId: b }
explanation:
  correct:
    en: "An on-demand AMI scan does not require Amazon Inspector activation. With a scanResultCondition, Image Builder waits for the scan and fails the image in the test stage when a finding is more severe than maximumSeverityLabel, so the AMI is not distributed; fixAvailable set to true counts only findings that have a fix, and a CRITICAL finding always fails the image."
    fr: "Une analyse d'AMI à la demande ne nécessite pas l'activation d'Amazon Inspector. Avec une condition scanResultCondition, Image Builder attend l'analyse et fait échouer l'image à l'étape de test lorsqu'un résultat est plus grave que maximumSeverityLabel : l'AMI n'est donc pas distribuée ; fixAvailable défini sur true ne compte que les résultats qui ont un correctif, et un résultat CRITICAL fait toujours échouer l'image."
  options:
    a:
      en: "Test instance scans require Amazon Inspector to be activated for EC2 in the Region, and a manual review does not block the distribution automatically."
      fr: "Les analyses d'instance de test exigent l'activation d'Amazon Inspector pour EC2 dans la Région, et une revue manuelle ne bloque pas automatiquement la distribution."
    c:
      en: "Without a scan result condition, the scan starts but the build does not wait for it, so the AMI can be distributed before the findings arrive."
      fr: "Sans condition de résultat d'analyse, l'analyse démarre mais le build ne l'attend pas : l'AMI peut être distribuée avant l'arrivée des résultats."
    d:
      en: "Reacting to findings after the fact is custom code and cannot reliably stop a distribution that may already be complete."
      fr: "Réagir aux résultats après coup est du code personnalisé et ne peut pas arrêter de manière fiable une distribution peut-être déjà terminée."
references:
  - title: "Amazon Inspector integration in Image Builder - EC2 Image Builder"
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/integ-inspector.html
