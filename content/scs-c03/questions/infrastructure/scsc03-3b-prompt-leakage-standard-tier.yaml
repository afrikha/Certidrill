id: scsc03-3b-prompt-leakage-standard-tier
objective: "3.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a multilingual travel assistant on Amazon Bedrock in eu-west-1 for customers who write in German, Japanese and English. The assistant uses an Amazon Bedrock guardrail on the Classic tier with a prompt attack filter, and user input is correctly tagged. Security testing shows that users can make the assistant reveal its system prompt and developer instructions. The security team must detect and block these attempts in all three languages by using Amazon Bedrock Guardrails.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute sur Amazon Bedrock, dans eu-west-1, un assistant de voyage multilingue pour des clients qui écrivent en allemand, en japonais et en anglais. L'assistant utilise une barrière de protection (guardrail) Amazon Bedrock de niveau Classic avec un filtre d'attaques par invite, et la saisie des utilisateurs est correctement balisée. Les tests de sécurité montrent que les utilisateurs peuvent faire révéler à l'assistant son invite système et les instructions du développeur. L'équipe de sécurité doit détecter et bloquer ces tentatives dans les trois langues à l'aide d'Amazon Bedrock Guardrails.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a word filter with phrases such as system prompt and developer instructions in the three languages, and keep the Classic tier."
        fr: "Ajouter un filtre de mots avec des expressions comme invite système et instructions du développeur dans les trois langues, et conserver le niveau Classic."
    - id: b
      text:
        en: "Add a denied topic that describes requests to reveal internal instructions, and keep the Classic tier."
        fr: "Ajouter un sujet refusé qui décrit les demandes de révélation des instructions internes, et conserver le niveau Classic."
    - id: c
      text:
        en: "Add a sensitive information filter with a regex that matches the first sentence of the system prompt, and set the output action to BLOCK."
        fr: "Ajouter un filtre d'informations sensibles avec une expression régulière qui correspond à la première phrase de l'invite système, et définir l'action de sortie sur BLOCK."
    - id: d
      text:
        en: "Move the guardrail to the Standard tier with cross-Region inference enabled, and keep the prompt attack filter on the tagged user input."
        fr: "Passer la barrière de protection au niveau Standard avec l'inférence entre Régions activée, et conserver le filtre d'attaques par invite sur la saisie utilisateur balisée."
answer: { optionId: d }
explanation:
  correct:
    en: "Prompt leakage detection, which finds user prompts that try to extract the system prompt or developer instructions, is part of the prompt attack filter on the Standard tier only. The Standard tier also adds extensive language support beyond the English, French and Spanish of the Classic tier, and it requires cross-Region inference."
    fr: "La détection des fuites d'invite (prompt leakage), qui repère les invites tentant d'extraire l'invite système ou les instructions du développeur, fait partie du filtre d'attaques par invite uniquement au niveau Standard. Le niveau Standard ajoute aussi une prise en charge linguistique étendue au-delà de l'anglais, du français et de l'espagnol du niveau Classic, et il nécessite l'inférence entre Régions."
  options:
    a:
      en: "Word filters match exact words or phrases, so rephrased extraction attempts pass through them."
      fr: "Les filtres de mots correspondent à des mots ou expressions exacts : les tentatives d'extraction reformulées passent au travers."
    b:
      en: "On the Classic tier, denied topics support only English, French and Spanish, so German and Japanese attempts would not be handled reliably."
      fr: "Au niveau Classic, les sujets refusés ne prennent en charge que l'anglais, le français et l'espagnol : les tentatives en allemand et en japonais ne seraient pas traitées de façon fiable."
    c:
      en: "A regex on one sentence misses paraphrased or partial disclosures, and it does not detect the extraction attempts in the input."
      fr: "Une expression régulière sur une phrase manque les divulgations paraphrasées ou partielles, et elle ne détecte pas les tentatives d'extraction dans l'entrée."
references:
  - title: "Safeguard tiers for guardrails policies - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tiers.html
  - title: "Detect prompt attacks with Amazon Bedrock Guardrails - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
