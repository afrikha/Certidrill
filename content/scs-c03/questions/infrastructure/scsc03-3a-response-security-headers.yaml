id: scsc03-3a-response-security-headers
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company hosts a static website in an Amazon S3 bucket and serves it through an Amazon CloudFront distribution. A security scan reports that responses do not include the Strict-Transport-Security, X-Frame-Options and X-Content-Type-Options headers. The company must add these headers to every response without changing the website content and with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise héberge un site web statique dans un compartiment Amazon S3 et le sert par une distribution Amazon CloudFront. Une analyse de sécurité signale que les réponses ne contiennent pas les en-têtes Strict-Transport-Security, X-Frame-Options et X-Content-Type-Options. L'entreprise doit ajouter ces en-têtes à chaque réponse sans modifier le contenu du site et avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach the AllViewer managed origin request policy to the default cache behavior of the distribution.
        fr: |-
          Attacher la politique de requête d'origine gérée AllViewer au comportement de cache par défaut de la distribution.
    - id: b
      text:
        en: |-
          Add the three headers as custom origin headers in the origin settings of the distribution.
        fr: |-
          Ajouter les trois en-têtes comme en-têtes d'origine personnalisés dans les paramètres d'origine de la distribution.
    - id: c
      text:
        en: |-
          Write a Lambda@Edge function that adds the three headers, and associate it with the origin response event of the default cache behavior.
        fr: |-
          Écrire une fonction Lambda@Edge qui ajoute les trois en-têtes, et l'associer à l'événement de réponse d'origine du comportement de cache par défaut.
    - id: d
      text:
        en: |-
          Attach the SecurityHeadersPolicy managed response headers policy to the default cache behavior of the distribution.
        fr: |-
          Attacher la politique d'en-têtes de réponse gérée SecurityHeadersPolicy au comportement de cache par défaut de la distribution.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A response headers policy makes CloudFront add headers to the responses it sends to viewers. The SecurityHeadersPolicy managed policy adds Strict-Transport-Security, X-Frame-Options, X-Content-Type-Options, Referrer-Policy and X-XSS-Protection, so attaching it to the cache behavior needs no code and no origin change.
    fr: |-
      Une politique d'en-têtes de réponse fait ajouter par CloudFront des en-têtes aux réponses qu'il envoie aux utilisateurs. La politique gérée SecurityHeadersPolicy ajoute Strict-Transport-Security, X-Frame-Options, X-Content-Type-Options, Referrer-Policy et X-XSS-Protection ; l'attacher au comportement de cache ne demande donc ni code ni modification de l'origine.
  options:
    a:
      en: |-
        An origin request policy controls which viewer values CloudFront forwards to the origin; it adds nothing to viewer responses.
      fr: |-
        Une politique de requête d'origine contrôle les valeurs de l'utilisateur que CloudFront transmet à l'origine ; elle n'ajoute rien aux réponses envoyées aux utilisateurs.
    b:
      en: |-
        Custom origin headers are added to the requests that CloudFront sends to the origin, not to the responses that viewers receive.
      fr: |-
        Les en-têtes d'origine personnalisés sont ajoutés aux requêtes que CloudFront envoie à l'origine, pas aux réponses que reçoivent les utilisateurs.
    c:
      en: |-
        A Lambda@Edge function works but adds code to write, deploy and maintain, which a managed policy avoids.
      fr: |-
        Une fonction Lambda@Edge fonctionne mais ajoute du code à écrire, déployer et maintenir, ce qu'une politique gérée évite.
references:
  - title: Use managed response headers policies - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-response-headers-policies.html
