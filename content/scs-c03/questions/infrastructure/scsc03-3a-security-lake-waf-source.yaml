id: scsc03-3a-security-lake-waf-source
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany uses Amazon Security Lake with a delegated administrator account for its organization in AWS Organizations. Security Lake already collects AWS CloudTrail management events and Amazon VPC Flow Logs from every account. The security team now wants the traffic logs of all AWS WAF web ACLs in the organization to be stored in the same data lake in the Open Cybersecurity Schema Framework (OCSF) format, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise Amazon Security Lake avec un compte administrateur délégué pour son organisation AWS Organizations. Security Lake collecte déjà les événements de gestion AWS CloudTrail et les journaux de flux Amazon VPC de tous les comptes. L'équipe de sécurité veut maintenant que les journaux de trafic de toutes les listes ACL web AWS WAF de l'organisation soient stockés dans le même lac de données au format Open Cybersecurity Schema Framework (OCSF), avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Configure AWS WAF logging to an S3 bucket in each account, and register each bucket as a custom source in Security Lake.
        fr: |-
          Configurer la journalisation AWS WAF vers un compartiment S3 dans chaque compte, et enregistrer chaque compartiment comme source personnalisée dans Security Lake.
    - id: b
      text:
        en: |-
          Stream the AWS WAF logs through Amazon Data Firehose with an AWS Lambda transformation to OCSF, and deliver them to the Security Lake bucket.
        fr: |-
          Diffuser les journaux AWS WAF par Amazon Data Firehose avec une transformation AWS Lambda vers OCSF, et les livrer dans le compartiment Security Lake.
    - id: c
      text:
        en: |-
          Add AWS WAFv2 logs as an AWS log source in the delegated administrator account for all member accounts and Regions.
        fr: |-
          Ajouter les journaux AWS WAFv2 comme source de journaux AWS dans le compte administrateur délégué pour tous les comptes membres et toutes les Régions.
    - id: d
      text:
        en: |-
          Enable the AWS WAF integration in AWS Security Hub CSPM, and add Security Hub CSPM findings as a source in Security Lake.
        fr: |-
          Activer l'intégration AWS WAF dans AWS Security Hub CSPM, et ajouter les résultats de Security Hub CSPM comme source dans Security Lake.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS WAFv2 logs are one of the AWS services that Security Lake collects natively, and the delegated administrator can enable the source for member accounts and Regions. Security Lake pulls the data through its own stream of events, so no separate logging configuration is needed, and it transforms the records into OCSF and Apache Parquet.
    fr: |-
      Les journaux AWS WAFv2 font partie des services AWS que Security Lake collecte nativement, et l'administrateur délégué peut activer cette source pour les comptes membres et les Régions. Security Lake récupère les données par son propre flux d'événements ; aucune configuration de journalisation distincte n'est donc nécessaire, et il transforme les enregistrements en OCSF et en Apache Parquet.
  options:
    a:
      en: |-
        Custom sources must write OCSF-formatted Parquet objects, so raw AWS WAF logs would need a conversion pipeline, and native collection already exists.
      fr: |-
        Les sources personnalisées doivent écrire des objets Parquet au format OCSF ; les journaux AWS WAF bruts nécessiteraient donc un pipeline de conversion, alors que la collecte native existe déjà.
    b:
      en: |-
        A custom transformation pipeline duplicates the native source and adds code and infrastructure to maintain.
      fr: |-
        Un pipeline de transformation personnalisé duplique la source native et ajoute du code et de l'infrastructure à maintenir.
    d:
      en: |-
        Security Hub CSPM findings are security check results, not the request-level traffic logs that the web ACLs produce.
      fr: |-
        Les résultats de Security Hub CSPM sont des résultats de contrôles de sécurité, pas les journaux de trafic au niveau des requêtes que produisent les listes ACL web.
references:
  - title: Collecting data from AWS services in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/internal-sources.html
