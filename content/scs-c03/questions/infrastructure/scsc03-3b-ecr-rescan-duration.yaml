id: scsc03-3b-ecr-rescan-duration
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses Amazon ECR enhanced scanning with a continuous scanning filter for all repositories. A platform team maintains golden base images that are pushed a few times a year and are used only as build sources, so they rarely run as containers. When a critical vulnerability was published last month, Amazon Inspector generated new findings for recent application images but not for the older golden base images. The security team requires the golden base images to be reassessed whenever relevant vulnerabilities are published, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise l'analyse améliorée d'Amazon ECR avec un filtre d'analyse continue pour tous les référentiels. Une équipe plateforme maintient des images de base de référence (golden images) qui sont envoyées quelques fois par an et ne servent que de sources de build : elles s'exécutent donc rarement comme conteneurs. Lors de la publication d'une vulnérabilité critique le mois dernier, Amazon Inspector a généré de nouveaux résultats pour les images d'application récentes, mais pas pour les anciennes images de base. L'équipe de sécurité exige que les images de base soient réévaluées chaque fois que des vulnérabilités pertinentes sont publiées, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Increase the Amazon ECR re-scan duration settings in Amazon Inspector so that images stay monitored long after their push date and last use."
        fr: "Augmenter les paramètres de durée de réanalyse Amazon ECR dans Amazon Inspector afin que les images restent surveillées longtemps après leur date d'envoi et leur dernière utilisation."
    - id: b
      text:
        en: "Create a scheduled pipeline that pulls and pushes every golden base image again with a new tag each week."
        fr: "Créer un pipeline planifié qui récupère et renvoie chaque image de base avec une nouvelle balise chaque semaine."
    - id: c
      text:
        en: "Change the repository filter of the golden base images to scan on push so that every image version is scanned."
        fr: "Remplacer le filtre de référentiel des images de base par l'analyse à l'envoi afin que chaque version d'image soit analysée."
    - id: d
      text:
        en: "Schedule an AWS Lambda function that calls the StartImageScan API for every golden base image each day."
        fr: "Planifier une fonction AWS Lambda qui appelle l'API StartImageScan pour chaque image de base chaque jour."
answer: { optionId: a }
explanation:
  correct:
    en: "Continuous scanning monitors an image only while it was pushed within the push date duration, used within the re-scan duration, or scanned within the re-scan duration. Old, rarely used images fall outside these windows and stop being reassessed. Raising the re-scan duration settings is a single configuration change that keeps them monitored for new vulnerabilities."
    fr: "L'analyse continue ne surveille une image que si elle a été envoyée pendant la durée de date d'envoi, utilisée pendant la durée de réanalyse ou analysée pendant cette durée. Les images anciennes et rarement utilisées sortent de ces fenêtres et ne sont plus réévaluées. Augmenter les durées de réanalyse est un seul changement de configuration qui les maintient sous surveillance pour les nouvelles vulnérabilités."
  options:
    b:
      en: "A weekly re-push resets the push date but adds a pipeline, extra image versions and tags to maintain, which is more overhead than a setting."
      fr: "Un renvoi hebdomadaire réinitialise la date d'envoi, mais ajoute un pipeline, des versions d'image et des balises à maintenir, soit plus de charge qu'un simple paramètre."
    c:
      en: "Scan on push scans an image only once, when it is pushed, so the images would never be reassessed when new vulnerabilities are published."
      fr: "L'analyse à l'envoi n'analyse une image qu'une fois, lors de son envoi : les images ne seraient jamais réévaluées lors de la publication de nouvelles vulnérabilités."
    d:
      en: "Manual scans with StartImageScan apply to basic scanning; with enhanced scanning, Amazon Inspector decides when images are scanned, and a scheduled function would be custom code."
      fr: "Les analyses manuelles avec StartImageScan concernent l'analyse de base ; avec l'analyse améliorée, Amazon Inspector décide quand les images sont analysées, et une fonction planifiée serait du code personnalisé."
references:
  - title: "Scanning Amazon Elastic Container Registry container images with Amazon Inspector - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-ecr.html
