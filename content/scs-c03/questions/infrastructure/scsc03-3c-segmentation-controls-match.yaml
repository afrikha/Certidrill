id: scsc03-3c-segmentation-controls-match
objective: "3.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team is choosing a network control for each segmentation requirement of its AWS environment.

    Match each requirement with the correct control. Each control can be used once or not at all.
  fr: |
    L'équipe de sécurité d'AnyCompany choisit un contrôle réseau pour chaque exigence de segmentation de son environnement AWS.

    Associez chaque exigence au contrôle correct. Chaque contrôle peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: gwlb, text: { en: "Gateway Load Balancer with Gateway Load Balancer endpoints", fr: "Gateway Load Balancer avec des points de terminaison Gateway Load Balancer" } }
    - { id: nfw, text: "AWS Network Firewall" }
    - { id: bpa, text: { en: "VPC Block Public Access", fr: "VPC Block Public Access (blocage de l'accès public aux VPC)" } }
    - { id: sg, text: { en: "Security group", fr: "Groupe de sécurité" } }
    - { id: nacl, text: { en: "Network ACL", fr: "Liste ACL réseau" } }
    - { id: tgwrt, text: { en: "Transit gateway route tables", fr: "Tables de routage de passerelle de transit" } }
  targets:
    - id: t1
      text: { en: "Send traffic transparently through a fleet of third-party intrusion prevention appliances that exchange packets with the load balancer by using GENEVE.", fr: "Faire passer le trafic de façon transparente par une flotte d'appliances tierces de prévention des intrusions qui échangent les paquets avec l'équilibreur de charge en GENEVE." }
    - id: t2
      text: { en: "Apply managed stateful inspection with Suricata-compatible rules to traffic between the internet gateway and workload subnets, without operating appliances.", fr: "Appliquer une inspection avec état gérée, avec des règles compatibles Suricata, au trafic entre la passerelle Internet et les sous-réseaux de charge de travail, sans exploiter d'appliances." }
    - id: t3
      text: { en: "Block traffic to and from internet gateways for all VPCs of an account in a Region, with exclusions for specific VPCs or subnets.", fr: "Bloquer le trafic vers et depuis les passerelles Internet pour tous les VPC d'un compte dans une Région, avec des exclusions pour certains VPC ou sous-réseaux." }
    - id: t4
      text: { en: "Deny traffic from one specific CIDR range at the subnet boundary with a stateless rule.", fr: "Refuser le trafic d'une plage CIDR précise à la limite du sous-réseau avec une règle sans état." }
    - id: t5
      text: { en: "Allow database connections only from instances that use the application tier's security group in the same VPC.", fr: "N'autoriser les connexions à la base de données que depuis les instances qui utilisent le groupe de sécurité du niveau applicatif dans le même VPC." }
answer:
  mapping: { t1: gwlb, t2: nfw, t3: bpa, t4: nacl, t5: sg }
explanation:
  correct:
    en: "A Gateway Load Balancer inserts virtual appliances transparently and exchanges traffic with them by using GENEVE on port 6081. AWS Network Firewall is a managed stateful firewall with Suricata-compatible rules. VPC Block Public Access blocks internet gateway traffic for an account in a Region, with VPC or subnet exclusions. Network ACLs are stateless and support deny rules at the subnet level, and security groups are stateful and can reference another security group as a source."
    fr: "Un Gateway Load Balancer insère des appliances virtuelles de façon transparente et échange le trafic avec elles en GENEVE sur le port 6081. AWS Network Firewall est un pare-feu avec état géré, avec des règles compatibles Suricata. VPC Block Public Access bloque le trafic des passerelles Internet pour un compte dans une Région, avec des exclusions de VPC ou de sous-réseaux. Les listes ACL réseau sont sans état et prennent en charge des règles de refus au niveau du sous-réseau, et les groupes de sécurité sont avec état et peuvent référencer un autre groupe de sécurité comme source."
  options:
    tgwrt:
      en: "Transit gateway route tables segment routing between attachments; none of the requirements concerns routing between VPCs attached to a transit gateway."
      fr: "Les tables de routage de passerelle de transit segmentent le routage entre les attachements ; aucune des exigences ne concerne le routage entre des VPC attachés à une passerelle de transit."
references:
  - title: What is a Gateway Load Balancer? - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/introduction.html
  - title: Block public access to VPCs and subnets - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-vpc-bpa.html
