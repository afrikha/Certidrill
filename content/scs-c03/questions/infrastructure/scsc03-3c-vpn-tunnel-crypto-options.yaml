id: scsc03-3c-vpn-tunnel-crypto-options
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany connects a transit gateway to a workload in another cloud provider with an AWS Site-to-Site VPN connection. A partner team manages the VPN gateway on the other provider's side. A security review requires the AWS side of both tunnels to accept only IKEv2, AES256 encryption, SHA2-384 integrity and Diffie-Hellman group 20 in phase 1 and phase 2. The AWS side must refuse any weaker proposal, even if the remote gateway offers one.

    Which solution will meet these requirements?
  fr: |
    AnyCompany connecte une passerelle de transit à une charge de travail d'un autre fournisseur de cloud par une connexion AWS Site-to-Site VPN. Une équipe partenaire gère la passerelle VPN du côté de l'autre fournisseur. Une revue de sécurité exige que le côté AWS des deux tunnels n'accepte que IKEv2, le chiffrement AES256, l'intégrité SHA2-384 et le groupe Diffie-Hellman 20 en phase 1 et en phase 2. Le côté AWS doit refuser toute proposition plus faible, même si la passerelle distante en propose une.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Modify the VPN tunnel options of both tunnels so that only ikev2, AES256, SHA2-384 and DH group 20 are allowed for phase 1 and phase 2.
        fr: |-
          Modifier les options de tunnel VPN des deux tunnels afin que seuls ikev2, AES256, SHA2-384 et le groupe DH 20 soient autorisés en phase 1 et en phase 2.
    - id: b
      text:
        en: |-
          Ask the partner team to propose only these algorithms from the remote gateway, and keep the default tunnel options on the AWS side.
        fr: |-
          Demander à l'équipe partenaire de ne proposer que ces algorithmes depuis la passerelle distante, et conserver les options de tunnel par défaut du côté AWS.
    - id: c
      text:
        en: |-
          Add network ACL rules to the subnets of the transit gateway attachment that block UDP port 500 so that only IKEv2 can negotiate.
        fr: |-
          Ajouter aux sous-réseaux de l'attachement de passerelle de transit des règles de liste ACL réseau qui bloquent le port UDP 500 afin que seul IKEv2 puisse négocier.
    - id: d
      text:
        en: |-
          Publish the Site-to-Site VPN logs to CloudWatch Logs, and create a metric filter that alarms when a tunnel negotiates a weaker algorithm.
        fr: |-
          Publier les journaux Site-to-Site VPN dans CloudWatch Logs, et créer un filtre de métrique qui déclenche une alarme lorsqu'un tunnel négocie un algorithme plus faible.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The tunnel options of a Site-to-Site VPN connection define the IKE versions, phase 1 and phase 2 encryption and integrity algorithms, and Diffie-Hellman groups that the AWS endpoint accepts. By default, several values are allowed and the AWS endpoint evaluates the proposals starting with the lowest configured value, so you restrict the accepted values with modify-vpn-tunnel-options.
    fr: |-
      Les options de tunnel d'une connexion Site-to-Site VPN définissent les versions IKE, les algorithmes de chiffrement et d'intégrité de phase 1 et de phase 2 et les groupes Diffie-Hellman que le point de terminaison AWS accepte. Par défaut, plusieurs valeurs sont autorisées et le point de terminaison AWS évalue les propositions en commençant par la valeur configurée la plus basse ; vous restreignez donc les valeurs acceptées avec modify-vpn-tunnel-options.
  options:
    b:
      en: |-
        The AWS side would still accept weaker proposals with the default options, so a change on the remote gateway does not make the AWS side refuse them.
      fr: |-
        Avec les options par défaut, le côté AWS accepterait toujours des propositions plus faibles ; une modification de la passerelle distante ne fait donc pas refuser ces propositions par le côté AWS.
    c:
      en: |-
        IKEv1 and IKEv2 both use UDP port 500, and network ACLs cannot select encryption algorithms or Diffie-Hellman groups.
      fr: |-
        IKEv1 et IKEv2 utilisent tous deux le port UDP 500, et les listes ACL réseau ne peuvent pas choisir les algorithmes de chiffrement ni les groupes Diffie-Hellman.
    d:
      en: |-
        Logs and alarms detect a weak negotiation after it happens; they do not make the AWS endpoint refuse the proposal.
      fr: |-
        Les journaux et les alarmes détectent une négociation faible après coup ; ils ne font pas refuser la proposition par le point de terminaison AWS.
references:
  - title: Tunnel options for your AWS Site-to-Site VPN connection - AWS Site-to-Site VPN
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/VPNTunnels.html
  - title: VpnTunnelOptionsSpecification - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_VpnTunnelOptionsSpecification.html
