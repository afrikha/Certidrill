id: scsc03-3c-naa-scope-bastions
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's security team wants to find unnecessary network access to its bastion hosts. The bastion hosts are EC2 instances in a resource group named bastions. The team runs a Network Access Analyzer analysis with the following Network Access Scope.

    ```json
    {
      "MatchPaths": [
        {
          "Destination": {
            "ResourceStatement": {
              "Resources": [
                "arn:aws:resource-groups:us-east-1:111122223333:group/bastions"
              ]
            }
          }
        }
      ],
      "ExcludePaths": [
        {
          "Destination": {
            "PacketHeaderStatement": {
              "DestinationPorts": [ "22" ]
            }
          }
        }
      ]
    }
    ```

    Which network paths will the analysis report as findings?
  fr: |
    L'équipe de sécurité d'AnyCompany veut trouver les accès réseau inutiles à ses hôtes bastions. Les hôtes bastions sont des instances EC2 d'un groupe de ressources nommé bastions. L'équipe exécute une analyse Network Access Analyzer avec l'étendue d'accès réseau (Network Access Scope) suivante.

    ```json
    {
      "MatchPaths": [
        {
          "Destination": {
            "ResourceStatement": {
              "Resources": [
                "arn:aws:resource-groups:us-east-1:111122223333:group/bastions"
              ]
            }
          }
        }
      ],
      "ExcludePaths": [
        {
          "Destination": {
            "PacketHeaderStatement": {
              "DestinationPorts": [ "22" ]
            }
          }
        }
      ]
    }
    ```

    Quels chemins réseau l'analyse signalera-t-elle comme résultats ?
body:
  options:
    - id: a
      text:
        en: |-
          Paths from any supported source, such as internet gateways, peering connections or network interfaces in the account, to the bastion hosts on any destination port other than 22.
        fr: |-
          Les chemins de toute source prise en charge, comme les passerelles Internet, les connexions d'appairage ou les interfaces réseau du compte, vers les hôtes bastions sur tout port de destination autre que 22.
    - id: b
      text:
        en: |-
          Only paths from internet gateways to the bastion hosts on any destination port other than 22, because a scope without a source matches internet sources only.
        fr: |-
          Uniquement les chemins des passerelles Internet vers les hôtes bastions sur tout port de destination autre que 22, car une étendue sans source ne correspond qu'aux sources Internet.
    - id: c
      text:
        en: |-
          Paths from any supported source to the bastion hosts on destination port 22 only, because the exclusion lists the ports that the analysis reports.
        fr: |-
          Les chemins de toute source prise en charge vers les hôtes bastions sur le port de destination 22 uniquement, car l'exclusion liste les ports que l'analyse signale.
    - id: d
      text:
        en: |-
          Paths from the bastion hosts to any destination on any port other than 22, because the resource statement identifies the hosts that start the paths.
        fr: |-
          Les chemins des hôtes bastions vers toute destination sur tout port autre que 22, car la déclaration de ressource identifie les hôtes qui initient les chemins.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A finding is a path that matches at least one MatchPaths entry and no ExcludePaths entry. The match condition sets only a destination (the bastions resource group), so paths from every supported source type are matched, and the exclusion removes the paths whose destination port is 22, leaving the paths on all other ports.
    fr: |-
      Un résultat est un chemin qui correspond à au moins une entrée MatchPaths et à aucune entrée ExcludePaths. La condition de correspondance ne définit qu'une destination (le groupe de ressources bastions) : les chemins de tous les types de sources pris en charge correspondent donc, et l'exclusion retire les chemins dont le port de destination est 22, ce qui laisse les chemins sur tous les autres ports.
  options:
    b:
      en: |-
        Without a Source statement, the match condition is not limited to internet gateways; it matches paths from every supported source type.
      fr: |-
        Sans déclaration Source, la condition de correspondance n'est pas limitée aux passerelles Internet ; elle correspond aux chemins de tous les types de sources pris en charge.
    c:
      en: |-
        ExcludePaths removes matching paths from the findings, so the paths on port 22 are the ones that are not reported.
      fr: |-
        ExcludePaths retire des résultats les chemins correspondants : ce sont donc les chemins sur le port 22 qui ne sont pas signalés.
    d:
      en: |-
        The resource group is in the Destination statement, so the bastion hosts are the end of the paths, not their start.
      fr: |-
        Le groupe de ressources figure dans la déclaration Destination : les hôtes bastions sont donc la fin des chemins, pas leur début.
references:
  - title: Example Network Access Scopes in Network Access Analyzer - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/network-access-analyzer/example-scopes.html
