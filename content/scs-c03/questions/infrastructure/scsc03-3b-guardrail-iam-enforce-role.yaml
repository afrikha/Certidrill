id: scsc03-3b-guardrail-iam-enforce-role
objective: "3.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Two applications in the same AnyCompany account call Amazon Bedrock models with the InvokeModel API in us-east-1. The HR assistant runs with the IAM role HrAssistantRole and must always use version 2 of the guardrail hr-guardrail. HrAssistantRole already allows bedrock:ApplyGuardrail on hr-guardrail. The marketing assistant runs with a different role and uses its own guardrail. The security team requires that any InvokeModel call from HrAssistantRole without hr-guardrail version 2 fails, and the marketing assistant must not be affected.

    Which solution will meet these requirements?
  fr: |
    Deux applications du même compte AnyCompany appellent des modèles Amazon Bedrock avec l'API InvokeModel dans us-east-1. L'assistant RH s'exécute avec le rôle IAM HrAssistantRole et doit toujours utiliser la version 2 de la barrière de protection (guardrail) hr-guardrail. HrAssistantRole autorise déjà bedrock:ApplyGuardrail sur hr-guardrail. L'assistant marketing s'exécute avec un autre rôle et utilise sa propre barrière de protection. L'équipe de sécurité exige que tout appel InvokeModel de HrAssistantRole sans la version 2 de hr-guardrail échoue, et l'assistant marketing ne doit pas être affecté.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Configure account-level guardrail enforcement in us-east-1 with version 2 of hr-guardrail by using PutEnforcedGuardrailConfiguration."
        fr: "Configurer l'application de barrière de protection au niveau du compte dans us-east-1 avec la version 2 de hr-guardrail à l'aide de PutEnforcedGuardrailConfiguration."
    - id: b
      text:
        en: "In the HrAssistantRole policy, allow bedrock:InvokeModel only when bedrock:GuardrailIdentifier equals the hr-guardrail version 2 ARN, and deny it otherwise."
        fr: "Dans la politique de HrAssistantRole, autoriser bedrock:InvokeModel uniquement lorsque bedrock:GuardrailIdentifier est égal à l'ARN de la version 2 de hr-guardrail, et le refuser dans les autres cas."
    - id: c
      text:
        en: "Attach an SCP to the account that denies bedrock:InvokeModel when bedrock:GuardrailIdentifier does not equal the ARN of hr-guardrail version 2."
        fr: "Attacher au compte une SCP qui refuse bedrock:InvokeModel lorsque bedrock:GuardrailIdentifier n'est pas égal à l'ARN de la version 2 de hr-guardrail."
    - id: d
      text:
        en: "Attach an Amazon Bedrock policy in AWS Organizations to the account that assigns version 2 of hr-guardrail to all models in us-east-1."
        fr: "Attacher au compte une politique Amazon Bedrock dans AWS Organizations qui attribue la version 2 de hr-guardrail à tous les modèles dans us-east-1."
answer: { optionId: b }
explanation:
  correct:
    en: "The bedrock:GuardrailIdentifier condition key enforces a specific guardrail and numeric version for model inference. An allow with StringEquals and an explicit deny with StringNotEquals on the HR role reject any HR call that omits or changes the guardrail, and the role keeps its bedrock:ApplyGuardrail permission on the guardrail. Other roles in the account are unaffected."
    fr: "La clé de condition bedrock:GuardrailIdentifier impose une barrière de protection et une version numérique précises pour l'inférence. Une autorisation avec StringEquals et un refus explicite avec StringNotEquals sur le rôle RH rejettent tout appel RH qui omet ou change la barrière de protection, et le rôle conserve son autorisation bedrock:ApplyGuardrail sur celle-ci. Les autres rôles du compte ne sont pas affectés."
  options:
    a:
      en: "Account-level enforcement applies the guardrail to every Amazon Bedrock invocation in the account and Region, so the marketing assistant would also be filtered by hr-guardrail."
      fr: "L'application au niveau du compte impose la barrière de protection à tous les appels Amazon Bedrock du compte et de la Région : l'assistant marketing serait aussi filtré par hr-guardrail."
    c:
      en: "Without a condition on the principal, the SCP denies the marketing assistant's calls too, because they use a different guardrail."
      fr: "Sans condition sur le principal, la SCP refuse aussi les appels de l'assistant marketing, car ils utilisent une autre barrière de protection."
    d:
      en: "An Amazon Bedrock policy enforces the guardrail on all model invocations of the account, including the marketing assistant's calls."
      fr: "Une politique Amazon Bedrock impose la barrière de protection à tous les appels de modèle du compte, y compris ceux de l'assistant marketing."
references:
  - title: "Enforce the use of specific guardrails in model inference requests - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-permissions-id.html
  - title: "Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
