id: scsc03-3a-instance-profile-s3
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application on an Amazon EC2 instance reads objects from one Amazon S3 bucket by using the AWS SDK. Today, the access key and secret key of an IAM user are stored in the application's configuration file. A security audit requires the company to remove all long-term credentials from the instance and to use credentials that are rotated automatically, with least privilege.

    Which solution will meet these requirements?
  fr: |
    Une application sur une instance Amazon EC2 lit des objets d'un compartiment Amazon S3 au moyen du kit SDK AWS. Aujourd'hui, la clé d'accès et la clé secrète d'un utilisateur IAM sont stockées dans le fichier de configuration de l'application. Un audit de sécurité exige que l'entreprise supprime toutes les informations d'identification à long terme de l'instance et utilise des informations d'identification renouvelées automatiquement, avec le moindre privilège.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Store the IAM user's access keys in AWS Secrets Manager with automatic rotation, and have the application read them at startup.
        fr: |-
          Stocker les clés d'accès de l'utilisateur IAM dans AWS Secrets Manager avec rotation automatique, et faire lire ces clés par l'application au démarrage.
    - id: b
      text:
        en: |-
          Create an IAM role that trusts ec2.amazonaws.com and allows s3:GetObject on the bucket, and attach it to the instance through an instance profile.
        fr: |-
          Créer un rôle IAM qui approuve ec2.amazonaws.com et autorise s3:GetObject sur le compartiment, et l'attacher à l'instance par un profil d'instance.
    - id: c
      text:
        en: |-
          Add a bucket policy statement that allows s3:GetObject for requests whose aws:SourceIp is the private IP address of the instance.
        fr: |-
          Ajouter une instruction de politique de compartiment qui autorise s3:GetObject pour les requêtes dont aws:SourceIp est l'adresse IP privée de l'instance.
    - id: d
      text:
        en: |-
          Pass a new IAM user's access keys to the instance in its user data, and replace the user every 90 days.
        fr: |-
          Transmettre à l'instance les clés d'accès d'un nouvel utilisateur IAM dans ses données utilisateur, et remplacer cet utilisateur tous les 90 jours.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An instance profile passes an IAM role to the instance, and applications get temporary credentials for that role from the instance metadata service. The AWS SDK retrieves and refreshes these credentials automatically, so no access keys are stored on the instance, and the role's policy grants only s3:GetObject on the bucket.
    fr: |-
      Un profil d'instance transmet un rôle IAM à l'instance, et les applications obtiennent des informations d'identification temporaires pour ce rôle auprès du service de métadonnées d'instance. Le kit SDK AWS récupère et renouvelle automatiquement ces informations ; aucune clé d'accès n'est donc stockée sur l'instance, et la politique du rôle n'accorde que s3:GetObject sur le compartiment.
  options:
    a:
      en: |-
        The IAM user's access keys remain long-term credentials that the application loads onto the instance, even if a rotation process replaces them.
      fr: |-
        Les clés d'accès de l'utilisateur IAM restent des informations d'identification à long terme que l'application charge sur l'instance, même si un processus de rotation les remplace.
    c:
      en: |-
        A source IP condition is not authentication, and S3 sees either a public address or, through a VPC endpoint, no aws:SourceIp value, so the private address never matches.
      fr: |-
        Une condition d'IP source n'est pas une authentification, et S3 voit soit une adresse publique, soit, par un point de terminaison de VPC, aucune valeur aws:SourceIp ; l'adresse privée ne correspond donc jamais.
    d:
      en: |-
        User data is readable from the instance and the console, and the keys are still long-term credentials.
      fr: |-
        Les données utilisateur sont lisibles depuis l'instance et la console, et les clés restent des informations d'identification à long terme.
references:
  - title: IAM roles for Amazon EC2 - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html
