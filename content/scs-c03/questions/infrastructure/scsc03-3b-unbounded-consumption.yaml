id: scsc03-3b-unbounded-consumption
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany exposes a public chatbot through an Amazon API Gateway REST API that invokes an AWS Lambda function, which calls Amazon Bedrock. Each partner application sends its partner ID in an X-Partner-Id header. Scripted clients recently sent thousands of very long prompts per minute, and the Amazon Bedrock bill increased sharply. The security team must limit the request rate of each partner, reject oversized prompts before they reach the function, and cap the length of each model response.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose un chatbot public via une API REST Amazon API Gateway qui appelle une fonction AWS Lambda, laquelle appelle Amazon Bedrock. Chaque application partenaire envoie son identifiant de partenaire dans un en-tête X-Partner-Id. Des clients automatisés ont récemment envoyé des milliers d'invites très longues par minute, et la facture Amazon Bedrock a fortement augmenté. L'équipe de sécurité doit limiter le débit de requêtes de chaque partenaire, rejeter les invites trop volumineuses avant qu'elles n'atteignent la fonction, et plafonner la longueur de chaque réponse du modèle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an API Gateway usage plan with an API key for each partner, and rely on its quota to cap the Amazon Bedrock costs."
        fr: "Créer un plan d'utilisation API Gateway avec une clé d'API par partenaire, et s'appuyer sur son quota pour plafonner les coûts Amazon Bedrock."
    - id: b
      text:
        en: "Purchase Provisioned Throughput for the model so that bursts of requests are served from dedicated capacity at a fixed price."
        fr: "Acheter du débit provisionné (Provisioned Throughput) pour le modèle afin que les pics de requêtes soient servis par une capacité dédiée à prix fixe."
    - id: c
      text:
        en: "Add an AWS WAF web ACL to the API stage with a rate-based rule keyed on X-Partner-Id and a body size constraint rule, and set maxTokens."
        fr: "Associer à l'étape de l'API une ACL web AWS WAF avec une règle basée sur le débit agrégée sur X-Partner-Id et une règle de contrainte de taille du corps, et définir maxTokens."
    - id: d
      text:
        en: "Add a guardrail with a content filter for the Prompt Attack category at HIGH strength to block the scripted prompts of the clients."
        fr: "Ajouter une barrière de protection avec un filtre de contenu pour la catégorie Prompt Attack avec une intensité HIGH afin de bloquer les invites automatisées."
answer: { optionId: c }
explanation:
  correct:
    en: "Unbounded consumption is mitigated by limiting request rates, input size and output length. An AWS WAF rate-based rule can aggregate requests on a header such as the partner ID, a size constraint rule rejects large bodies at the edge of the API, and maxTokens caps the tokens that the model generates for each request."
    fr: "La consommation non bornée (unbounded consumption) s'atténue en limitant le débit des requêtes, la taille des entrées et la longueur des sorties. Une règle AWS WAF basée sur le débit peut agréger les requêtes sur un en-tête comme l'identifiant de partenaire, une règle de contrainte de taille rejette les corps volumineux à l'entrée de l'API, et maxTokens plafonne les jetons générés par le modèle pour chaque requête."
  options:
    a:
      en: "Usage plan throttling and quotas are applied on a best-effort basis and must not be relied on to control costs; they also do not limit prompt or response size."
      fr: "La limitation et les quotas des plans d'utilisation sont appliqués au mieux et ne doivent pas servir à maîtriser les coûts ; ils ne limitent pas non plus la taille des invites ni des réponses."
    b:
      en: "Provisioned Throughput adds dedicated capacity at a committed cost; it does not limit what abusive clients can send."
      fr: "Le débit provisionné ajoute une capacité dédiée à un coût engagé ; il ne limite pas ce que des clients abusifs peuvent envoyer."
    d:
      en: "The prompt attack filter detects jailbreaks and injections, not high volumes of long but benign prompts, and each evaluation still runs."
      fr: "Le filtre d'attaques par invite détecte les jailbreaks et les injections, et non de gros volumes d'invites longues mais anodines, et chaque évaluation s'exécute quand même."
references:
  - title: "Usage plans and API keys for REST APIs in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html
  - title: "Aggregating rate-based rules in AWS WAF"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based-aggregation-options.html
