id: scsc03-3a-security-lake-query-subscriber
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany collects AWS WAF logs and Amazon VPC Flow Logs in Amazon Security Lake in eu-west-1. A managed security service provider (MSSP) works from its own AWS account and must run SQL queries with Amazon Athena directly on these two sources, in place, without copying the objects to its account. The MSSP must not have access to any other source in the data lake.

    Which solution will meet these requirements?
  fr: |
    AnyCompany collecte les journaux AWS WAF et les journaux de flux Amazon VPC dans Amazon Security Lake dans eu-west-1. Un fournisseur de services de sécurité gérés (MSSP) travaille depuis son propre compte AWS et doit exécuter des requêtes SQL avec Amazon Athena directement sur ces deux sources, sur place, sans copier les objets dans son compte. Le MSSP ne doit avoir accès à aucune autre source du lac de données.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a subscriber with data access for the two sources, with the MSSP's account ID and external ID and an Amazon SQS queue for new-object notifications.
        fr: |-
          Créer un abonné avec accès aux données pour les deux sources, avec l'ID de compte et l'ID externe du MSSP et une file d'attente Amazon SQS pour les notifications de nouveaux objets.
    - id: b
      text:
        en: |-
          Configure S3 Replication from the Security Lake bucket to a bucket in the MSSP's account, filtered on the prefixes of the two sources.
        fr: |-
          Configurer S3 Replication du compartiment Security Lake vers un compartiment du compte du MSSP, filtrée sur les préfixes des deux sources.
    - id: c
      text:
        en: |-
          Add a statement to the Security Lake bucket policy that allows the MSSP's account to call s3:GetObject on the prefixes of the two sources.
        fr: |-
          Ajouter à la politique du compartiment Security Lake une instruction qui autorise le compte du MSSP à appeler s3:GetObject sur les préfixes des deux sources.
    - id: d
      text:
        en: |-
          Create a subscriber with query access for the two sources, with the MSSP's account ID and external ID, and have the MSSP query the shared tables with Athena.
        fr: |-
          Créer un abonné avec accès aux requêtes pour les deux sources, avec l'ID de compte et l'ID externe du MSSP, et faire interroger les tables partagées par le MSSP avec Athena.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A subscriber with query access, the LAKEFORMATION access type, queries the AWS Lake Formation tables over the data in the Security Lake bucket directly with services such as Amazon Athena, without copying objects. Access is granted per source, so the MSSP sees only the AWS WAF and VPC Flow Logs tables of the Region in which the subscriber is created.
    fr: |-
      Un abonné avec accès aux requêtes, de type d'accès LAKEFORMATION, interroge directement les tables AWS Lake Formation qui portent sur les données du compartiment Security Lake au moyen de services comme Amazon Athena, sans copier d'objets. L'accès est accordé par source ; le MSSP ne voit donc que les tables AWS WAF et VPC Flow Logs de la Région dans laquelle l'abonné est créé.
  options:
    a:
      en: |-
        Data access notifies the subscriber of new objects so that it can read and ingest them into its own tools; it does not share queryable tables for Athena.
      fr: |-
        L'accès aux données notifie l'abonné des nouveaux objets pour qu'il puisse les lire et les ingérer dans ses propres outils ; il ne partage pas de tables interrogeables avec Athena.
    b:
      en: |-
        Replication copies the objects to the MSSP's account, which the requirements forbid.
      fr: |-
        La réplication copie les objets dans le compte du MSSP, ce que les exigences interdisent.
    c:
      en: |-
        Direct bucket access bypasses the Lake Formation permissions that Security Lake manages and gives the MSSP no catalog tables to query.
      fr: |-
        Un accès direct au compartiment contourne les autorisations Lake Formation que gère Security Lake et ne donne au MSSP aucune table de catalogue à interroger.
references:
  - title: Managing query access for Security Lake subscribers - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-query-access.html
  - title: Subscriber management in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-management.html
