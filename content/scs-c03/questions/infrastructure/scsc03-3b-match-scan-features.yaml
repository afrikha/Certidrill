id: scsc03-3b-match-scan-features
objective: "3.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team is assigning detection requirements for its compute workloads to AWS features.

    Match each requirement to the feature that meets it.

    To answer, drag the appropriate feature to each requirement. Each feature may be used once or not at all.
  fr: |
    L'équipe de sécurité d'AnyCompany attribue à des fonctionnalités AWS les exigences de détection de ses charges de travail de calcul.

    Associez chaque exigence à la fonctionnalité qui y répond.

    Pour répondre, faites glisser la fonctionnalité appropriée vers chaque exigence. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: hybrid, text: { en: "Amazon Inspector hybrid scan mode for Amazon EC2", fr: "Mode d'analyse hybride Amazon Inspector pour Amazon EC2" } }
    - { id: lcode, text: { en: "Amazon Inspector Lambda code scanning", fr: "Analyse du code Lambda d'Amazon Inspector" } }
    - { id: lstd, text: { en: "Amazon Inspector Lambda standard scanning", fr: "Analyse standard Lambda d'Amazon Inspector" } }
    - { id: ecrcont, text: { en: "Amazon ECR enhanced scanning with continuous scanning", fr: "Analyse améliorée Amazon ECR avec analyse continue" } }
    - { id: runtime, text: { en: "GuardDuty Runtime Monitoring", fr: "GuardDuty Runtime Monitoring" } }
    - { id: malware, text: { en: "GuardDuty Malware Protection for EC2 on-demand scan", fr: "Analyse à la demande de GuardDuty Malware Protection for EC2" } }
  targets:
    - id: t1
      text: { en: "Find known vulnerabilities on EC2 instances that have no SSM Agent, without installing any software on them", fr: "Trouver les vulnérabilités connues des instances EC2 qui n'ont pas d'agent SSM, sans y installer de logiciel" }
    - id: t2
      text: { en: "Detect injection flaws and weak cryptography in the custom code of Lambda functions", fr: "Détecter les failles d'injection et la cryptographie faible dans le code personnalisé des fonctions Lambda" }
    - id: t3
      text: { en: "Reassess stored container images automatically when a relevant CVE is published", fr: "Réévaluer automatiquement les images de conteneur stockées lorsqu'une CVE pertinente est publiée" }
    - id: t4
      text: { en: "Detect a process that opens a reverse shell inside a running container on an EC2 instance", fr: "Détecter un processus qui ouvre un shell inversé dans un conteneur en cours d'exécution sur une instance EC2" }
    - id: t5
      text: { en: "Scan the EBS volumes of one suspicious instance for malware although no finding exists for it", fr: "Analyser à la recherche de logiciels malveillants les volumes EBS d'une instance suspecte, bien qu'aucun résultat n'existe pour elle" }
answer:
  mapping: { t1: hybrid, t2: lcode, t3: ecrcont, t4: runtime, t5: malware }
explanation:
  correct:
    en: "Hybrid scan mode scans instances that are not managed by Systems Manager agentlessly from EBS snapshots. Lambda code scanning analyzes custom function code for flaws such as injection, data leaks and weak cryptography. Continuous ECR scanning rescans images when Inspector adds a relevant CVE. Runtime Monitoring observes processes and connections through its security agent, and an on-demand Malware Protection for EC2 scan starts from the instance ARN without a finding."
    fr: "Le mode d'analyse hybride analyse sans agent, à partir d'instantanés EBS, les instances qui ne sont pas gérées par Systems Manager. L'analyse du code Lambda examine le code personnalisé des fonctions à la recherche de failles comme l'injection, les fuites de données et la cryptographie faible. L'analyse ECR continue réanalyse les images quand Inspector ajoute une CVE pertinente. Runtime Monitoring observe les processus et les connexions grâce à son agent de sécurité, et une analyse à la demande de Malware Protection for EC2 démarre à partir de l'ARN de l'instance, sans résultat préalable."
  options:
    lstd:
      en: "Lambda standard scanning finds vulnerable packages in function dependencies and layers, not flaws in the custom code."
      fr: "L'analyse standard Lambda trouve les paquets vulnérables dans les dépendances et les couches des fonctions, et non les failles du code personnalisé."
references:
  - title: "Amazon Inspector Lambda code scanning - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning_resources_lambda_code.html
  - title: "GuardDuty Malware Protection for EC2 - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/malware-protection.html
