id: scsc03-3a-managed-rules-sqli-xss
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany exposes a Regional Amazon API Gateway REST API whose AWS Lambda functions run on Linux and query an Amazon Aurora PostgreSQL database. A browser application renders the API responses. A security review that follows the OWASP Top 10 requires protection against SQL injection in request parameters and against cross-site scripting payloads in query strings and request bodies. The company will use AWS managed rule groups in an AWS WAF web ACL associated with the API stage.

    Which AWS managed rule groups should the company add to meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany expose une API REST Amazon API Gateway régionale dont les fonctions AWS Lambda s'exécutent sous Linux et interrogent une base de données Amazon Aurora PostgreSQL. Une application de navigateur affiche les réponses de l'API. Une revue de sécurité qui suit le Top 10 de l'OWASP exige une protection contre l'injection SQL dans les paramètres des requêtes et contre les charges utiles de cross-site scripting dans les chaînes de requête et les corps des requêtes. L'entreprise utilisera des groupes de règles gérés par AWS dans une liste ACL web AWS WAF associée à l'étape de l'API.

    Quels groupes de règles gérés par AWS l'entreprise doit-elle ajouter pour répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: AWSManagedRulesAmazonIpReputationList
    - id: b
      text: AWSManagedRulesSQLiRuleSet
    - id: c
      text: AWSManagedRulesWindowsRuleSet
    - id: d
      text: AWSManagedRulesCommonRuleSet
    - id: e
      text: AWSManagedRulesAnonymousIpList
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      The SQL database rule group, AWSManagedRulesSQLiRuleSet, blocks request patterns that exploit SQL databases, such as SQL injection. The core rule set, AWSManagedRulesCommonRuleSet, covers common OWASP Top 10 risks and includes cross-site scripting rules for cookies, query arguments, the body and the URI path.
    fr: |-
      Le groupe de règles SQL database, AWSManagedRulesSQLiRuleSet, bloque les motifs de requêtes qui exploitent les bases de données SQL, comme l'injection SQL. Le jeu de règles de base, AWSManagedRulesCommonRuleSet, couvre les risques courants du Top 10 de l'OWASP et inclut des règles de cross-site scripting pour les cookies, les arguments de requête, le corps et le chemin d'URI.
  options:
    a:
      en: |-
        The Amazon IP reputation list blocks addresses known for malicious activity; it does not inspect request content for injection payloads.
      fr: |-
        La liste Amazon IP reputation bloque des adresses connues pour leur activité malveillante ; elle n'inspecte pas le contenu des requêtes à la recherche de charges utiles d'injection.
    c:
      en: |-
        The Windows rule group blocks Windows command injection such as PowerShell commands, and the functions run on Linux.
      fr: |-
        Le groupe de règles Windows bloque l'injection de commandes Windows comme les commandes PowerShell, et les fonctions s'exécutent sous Linux.
    e:
      en: |-
        The anonymous IP list blocks requests from anonymizing services and hosting providers; it does not detect SQL injection or XSS.
      fr: |-
        La liste Anonymous IP bloque les requêtes provenant de services d'anonymisation et d'hébergeurs ; elle ne détecte ni l'injection SQL ni le XSS.
