id: scsc03-3c-vpn-psk-storage-logs
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 12 AWS Site-to-Site VPN connections that end on transit gateways and authenticate with pre-shared keys. An audit found that the pre-shared keys are stored directly in the VPN service configuration. The security team requires that the keys be kept in a dedicated secrets store whose access is controlled with IAM policies and audited. The team also requires that the IKE and IPsec negotiation messages, dead peer detection events and BGP session changes of every tunnel be recorded centrally for investigations.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany dispose de 12 connexions AWS Site-to-Site VPN qui se terminent sur des passerelles de transit et s'authentifient avec des clés pré-partagées. Un audit a constaté que les clés pré-partagées sont stockées directement dans la configuration du service VPN. L'équipe de sécurité exige que les clés soient conservées dans un magasin de secrets dédié dont l'accès est contrôlé par des politiques IAM et audité. L'équipe exige aussi que les messages de négociation IKE et IPsec, les événements de détection d'homologue mort (DPD) et les changements de session BGP de chaque tunnel soient enregistrés de façon centralisée pour les investigations.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Store each pre-shared key as a SecureString parameter in AWS Systems Manager Parameter Store, and reference the parameter in the tunnel options."
        fr: "Stocker chaque clé pré-partagée en tant que paramètre SecureString dans AWS Systems Manager Parameter Store, et référencer le paramètre dans les options de tunnel."
    - id: b
      text:
        en: "Change the pre-shared key storage of each tunnel from Standard to Secrets Manager in the VPN tunnel options."
        fr: "Passer le stockage de la clé pré-partagée de chaque tunnel de Standard à Secrets Manager dans les options de tunnel VPN."
    - id: c
      text:
        en: "Create flow logs on the transit gateway VPN attachments to capture the IKE and IPsec negotiation messages of each tunnel."
        fr: "Créer des journaux de flux sur les attachements VPN de la passerelle de transit pour capturer les messages de négociation IKE et IPsec de chaque tunnel."
    - id: d
      text:
        en: "Create an AWS CloudTrail trail that records the events of the VPN connections, including each IKE negotiation."
        fr: "Créer un journal de suivi AWS CloudTrail qui enregistre les événements des connexions VPN, y compris chaque négociation IKE."
    - id: e
      text:
        en: "Turn on Site-to-Site VPN logs for each tunnel, and publish them to a log group in Amazon CloudWatch Logs."
        fr: "Activer les journaux Site-to-Site VPN pour chaque tunnel, et les publier dans un groupe de journaux Amazon CloudWatch Logs."
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      Site-to-Site VPN can store a tunnel's pre-shared key in AWS Secrets Manager instead of in the service (Standard storage); access to the secret is then governed by IAM and Secrets Manager and logged in CloudTrail, and switching the storage mode interrupts the tunnel for up to several minutes. Site-to-Site VPN logs, published to CloudWatch Logs, contain tunnel activity logs (IKE, IPsec and DPD messages) and tunnel BGP logs (session status and route changes).
    fr: |-
      Site-to-Site VPN peut stocker la clé pré-partagée d'un tunnel dans AWS Secrets Manager au lieu de la stocker dans le service (stockage Standard) ; l'accès au secret est alors régi par IAM et Secrets Manager et journalisé dans CloudTrail, et le changement de mode de stockage interrompt le tunnel pendant quelques minutes au plus. Les journaux Site-to-Site VPN, publiés dans CloudWatch Logs, contiennent les journaux d'activité des tunnels (messages IKE, IPsec et DPD) et les journaux BGP des tunnels (état de session et modifications de routes).
  options:
    a:
      en: "The tunnel options offer only Standard and Secrets Manager storage for pre-shared keys; a Parameter Store parameter cannot be referenced."
      fr: "Les options de tunnel n'offrent que les stockages Standard et Secrets Manager pour les clés pré-partagées ; un paramètre de Parameter Store ne peut pas être référencé."
    c:
      en: "Flow logs record IP traffic metadata such as addresses, ports and byte counts, not the content of IKE and IPsec negotiations or BGP session changes."
      fr: "Les journaux de flux enregistrent des métadonnées de trafic IP comme les adresses, les ports et le nombre d'octets, pas le contenu des négociations IKE et IPsec ni les changements de session BGP."
    d:
      en: "CloudTrail records API activity, such as changes to the VPN connection configuration, not the negotiation messages exchanged between the tunnel endpoints."
      fr: "CloudTrail enregistre l'activité des API, comme les modifications de la configuration de la connexion VPN, pas les messages de négociation échangés entre les points de terminaison des tunnels."
references:
  - title: Change the pre-shared key storage mode in AWS Site-to-Site VPN - AWS Site-to-Site VPN
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/enhanced-security-storage.html
  - title: AWS Site-to-Site VPN logs - AWS Site-to-Site VPN
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/monitoring-logs.html
