id: scsc03-3c-naa-bpa-impact
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany plans to turn on VPC Block Public Access in bidirectional mode in an account that has 25 VPCs. Before the change, the security team must list every VPC and subnet that has a network path to or from an internet gateway, so that it can decide which internet access is unnecessary and which subnets need an exclusion. No traffic may be disrupted during the assessment.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany prévoit d'activer VPC Block Public Access en mode bidirectionnel dans un compte qui compte 25 VPC. Avant la modification, l'équipe de sécurité doit lister chaque VPC et chaque sous-réseau qui a un chemin réseau vers ou depuis une passerelle Internet, afin de décider quels accès Internet sont inutiles et quels sous-réseaux ont besoin d'une exclusion. Aucun trafic ne doit être perturbé pendant l'évaluation.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Activate Amazon Inspector EC2 scanning, and export the network reachability findings of all EC2 instances in the account.
        fr: |-
          Activer l'analyse EC2 d'Amazon Inspector, et exporter les résultats d'accessibilité réseau de toutes les instances EC2 du compte.
    - id: b
      text:
        en: |-
          Turn on VPC Block Public Access in bidirectional mode for one day, and review the VPC Flow Logs records whose reject-reason field is BPA.
        fr: |-
          Activer VPC Block Public Access en mode bidirectionnel pendant une journée, et examiner les enregistrements des journaux de flux VPC dont le champ reject-reason vaut BPA.
    - id: c
      text:
        en: |-
          In Network Access Analyzer, create a scope from the Assess impact of VPC Block Public Access template, analyze it, and review the VPCs and subnets in the findings.
        fr: |-
          Dans Network Access Analyzer, créer une étendue à partir du modèle Assess impact of VPC Block Public Access, l'analyser, et examiner les VPC et les sous-réseaux des résultats.
    - id: d
      text:
        en: |-
          Write a script that lists the route tables with a route to an internet gateway in each VPC, and run it in the account before the change.
        fr: |-
          Écrire un script qui liste les tables de routage ayant une route vers une passerelle Internet dans chaque VPC, et l'exécuter dans le compte avant la modification.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Network Access Analyzer has a prebuilt template, Assess impact of VPC Block Public Access, whose sources and destinations are the internet gateways of the account. Each finding is a path to or from an internet gateway, and every VPC or subnet in the findings that is not excluded would have its traffic restricted by VPC BPA. The analysis is a static analysis of the configuration, so it disrupts no traffic.
    fr: |-
      Network Access Analyzer propose un modèle prédéfini, Assess impact of VPC Block Public Access, dont les sources et les destinations sont les passerelles Internet du compte. Chaque résultat est un chemin vers ou depuis une passerelle Internet, et chaque VPC ou sous-réseau des résultats qui n'est pas exclu verrait son trafic restreint par VPC BPA. L'analyse est une analyse statique de la configuration : elle ne perturbe donc aucun trafic.
  options:
    a:
      en: |-
        Inspector reports open ports on EC2 instances only, and only for inbound paths, so it misses other resources and outbound paths to internet gateways.
      fr: |-
        Inspector ne signale les ports ouverts que pour les instances EC2 et uniquement pour les chemins entrants : il omet donc les autres ressources et les chemins sortants vers les passerelles Internet.
    b:
      en: |-
        Flow logs with the BPA reject reason confirm blocked traffic only after the change, which disrupts traffic during the assessment.
      fr: |-
        Les journaux de flux avec le motif de rejet BPA ne confirment le trafic bloqué qu'après la modification, ce qui perturbe le trafic pendant l'évaluation.
    d:
      en: |-
        A custom script must be written and maintained, and a route alone does not show whether security groups and network ACLs leave a path open.
      fr: |-
        Un script personnalisé doit être écrit et maintenu, et une route seule ne montre pas si les groupes de sécurité et les listes ACL réseau laissent un chemin ouvert.
references:
  - title: Assess impact of VPC BPA and monitor VPC BPA - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-vpc-bpa-assess-impact-main.html
