id: scsc03-3b-jenkins-inspector-plugin
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany builds container images with a self-managed Jenkins server in its data center and pushes them to a third-party container registry. The company does not use Amazon ECR or AWS CodePipeline. The security team wants every Jenkins build to fail before the push when the image contains any critical vulnerability or more than three high vulnerabilities, and it wants to use Amazon Inspector for the assessment.

    Which solution will meet these requirements?
  fr: |
    AnyCompany construit des images de conteneur avec un serveur Jenkins autogéré dans son centre de données et les envoie vers un registre de conteneurs tiers. L'entreprise n'utilise ni Amazon ECR ni AWS CodePipeline. L'équipe de sécurité veut que chaque build Jenkins échoue avant l'envoi lorsque l'image contient une vulnérabilité critique ou plus de trois vulnérabilités élevées, et elle veut utiliser Amazon Inspector pour l'évaluation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Activate Amazon Inspector EC2 scanning, install the SSM Agent on the Jenkins server as a hybrid managed node, and fail the build when the server has critical findings."
        fr: "Activer l'analyse EC2 d'Amazon Inspector, installer l'agent SSM sur le serveur Jenkins en tant que nœud géré hybride, et faire échouer le build lorsque le serveur a des résultats critiques."
    - id: b
      text:
        en: "Install the Amazon Inspector Jenkins plugin, give it an IAM role that allows inspector-scan:ScanSbom, and enable vulnerability thresholds with 0 critical and 3 high."
        fr: "Installer le plugin Jenkins Amazon Inspector, lui donner un rôle IAM qui autorise inspector-scan:ScanSbom, et activer les seuils de vulnérabilité avec 0 critique et 3 élevées."
    - id: c
      text:
        en: "Add an InspectorScan action in ECRImageScan mode with CriticalThreshold set to 0 and HighThreshold set to 3 after the Jenkins build."
        fr: "Ajouter une action InspectorScan en mode ECRImageScan avec CriticalThreshold défini sur 0 et HighThreshold défini sur 3 après le build Jenkins."
    - id: d
      text:
        en: "Turn on Amazon ECR enhanced scanning with scan on push, and replicate the third-party registry to Amazon ECR after each push."
        fr: "Activer l'analyse améliorée d'Amazon ECR avec l'analyse à l'envoi, et répliquer le registre tiers vers Amazon ECR après chaque envoi."
answer: { optionId: b }
explanation:
  correct:
    en: "The Amazon Inspector Jenkins plugin runs the Amazon Inspector SBOM Generator on the image and sends the SBOM to the Amazon Inspector Scan API, which needs the inspector-scan:ScanSbom permission. With vulnerability thresholds enabled, the build fails when the counts of critical or high vulnerabilities exceed the values that are set, before the image is pushed."
    fr: "Le plugin Jenkins Amazon Inspector exécute l'Amazon Inspector SBOM Generator sur l'image et envoie la SBOM à l'API Amazon Inspector Scan, qui nécessite l'autorisation inspector-scan:ScanSbom. Avec les seuils de vulnérabilité activés, le build échoue lorsque le nombre de vulnérabilités critiques ou élevées dépasse les valeurs définies, avant l'envoi de l'image."
  options:
    a:
      en: "EC2 or hybrid node scanning assesses the packages of the Jenkins server, not the container images that it builds."
      fr: "L'analyse EC2 ou des nœuds hybrides évalue les paquets du serveur Jenkins, et non les images de conteneur qu'il construit."
    c:
      en: "InspectorScan is an AWS CodePipeline action, and ECRImageScan mode reads images from Amazon ECR; the company uses neither service."
      fr: "InspectorScan est une action AWS CodePipeline, et le mode ECRImageScan lit les images dans Amazon ECR ; l'entreprise n'utilise aucun de ces services."
    d:
      en: "ECR scanning would run only after the image was already pushed to the third-party registry, so it cannot fail the build before the push."
      fr: "L'analyse ECR ne s'exécuterait qu'après l'envoi de l'image vers le registre tiers : elle ne peut pas faire échouer le build avant l'envoi."
references:
  - title: "Using the Amazon Inspector Jenkins plugin - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/cicd-jenkins.html
  - title: "Setting up an AWS account to use the Amazon Inspector CI/CD integration - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/configure-cicd-account.html
