id: scsc03-3b-ssm-tag-startsession
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's developers use AWS Systems Manager Session Manager to connect to Amazon EC2 instances. The instances have no inbound security group rules. Instances are tagged Environment=Dev or Environment=Prod. The security team requires that developers can start sessions only on instances tagged Environment=Dev.

    Which solution will meet these requirements?
  fr: |
    Les développeurs d'AnyCompany utilisent AWS Systems Manager Session Manager pour se connecter à des instances Amazon EC2. Les instances n'ont aucune règle entrante de groupe de sécurité. Les instances portent la balise Environment=Dev ou Environment=Prod. L'équipe de sécurité exige que les développeurs ne puissent démarrer des sessions que sur les instances balisées Environment=Dev.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Allow ssm:StartSession on arn:aws:ec2:*:*:instance/* with a condition on ssm:resourceTag/Environment set to Dev, and on the SSM-SessionManagerRunShell document."
        fr: "Autoriser ssm:StartSession sur arn:aws:ec2:*:*:instance/* avec une condition sur ssm:resourceTag/Environment définie sur Dev, ainsi que sur le document SSM-SessionManagerRunShell."
    - id: b
      text:
        en: "Add an inbound security group rule that allows port 443 from the developers' IP range only to the instances tagged Environment=Dev."
        fr: "Ajouter une règle entrante de groupe de sécurité qui autorise le port 443 depuis la plage IP des développeurs uniquement vers les instances balisées Environment=Dev."
    - id: c
      text:
        en: "Remove the instance profile from the instances tagged Environment=Prod so that they are not managed by Systems Manager."
        fr: "Retirer le profil d'instance des instances balisées Environment=Prod afin qu'elles ne soient pas gérées par Systems Manager."
    - id: d
      text:
        en: "Allow ec2-instance-connect:SendSSHPublicKey with a condition on aws:ResourceTag/Environment set to Dev."
        fr: "Autoriser ec2-instance-connect:SendSSHPublicKey avec une condition sur aws:ResourceTag/Environment définie sur Dev."
answer: { optionId: a }
explanation:
  correct:
    en: "Session Manager is authorized with IAM: ssm:StartSession is granted on instance ARNs and on the session document, and the ssm:resourceTag condition key limits the instances to those that carry Environment=Dev. No inbound network rule is involved."
    fr: "Session Manager est autorisé par IAM : ssm:StartSession est accordé sur les ARN d'instance et sur le document de session, et la clé de condition ssm:resourceTag limite les instances à celles qui portent Environment=Dev. Aucune règle réseau entrante n'intervient."
  options:
    b:
      en: "Session Manager uses outbound connections from the SSM Agent, so inbound rules neither enable nor restrict sessions."
      fr: "Session Manager utilise des connexions sortantes de l'agent SSM : les règles entrantes ne permettent ni ne restreignent les sessions."
    c:
      en: "Removing Systems Manager management from production instances breaks patching and other operations, and it does not express the access rule in IAM."
      fr: "Retirer la gestion Systems Manager des instances de production casse l'application des correctifs et d'autres opérations, et n'exprime pas la règle d'accès dans IAM."
    d:
      en: "SendSSHPublicKey controls EC2 Instance Connect, not Session Manager sessions."
      fr: "SendSSHPublicKey contrôle EC2 Instance Connect, et non les sessions Session Manager."
references:
  - title: "Sample IAM policies for Session Manager - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/getting-started-restrict-access-quickstart.html
