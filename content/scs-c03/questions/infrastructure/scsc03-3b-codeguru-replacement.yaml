id: scsc03-3b-codeguru-replacement
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany used Amazon CodeGuru Security in its AWS CodeBuild projects to find flaws in the source code of its applications. The code is stored in GitHub. AWS discontinued CodeGuru Security, so the security team needs a managed AWS replacement. The replacement must scan the first-party code, the open source dependencies and the infrastructure as code files of each repository when pull requests are opened against the default branch.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilisait Amazon CodeGuru Security dans ses projets AWS CodeBuild pour trouver des failles dans le code source de ses applications. Le code est stocké dans GitHub. AWS a abandonné CodeGuru Security : l'équipe de sécurité a donc besoin d'un remplaçant AWS géré. Le remplaçant doit analyser le code propriétaire, les dépendances open source et les fichiers d'infrastructure en tant que code (IaC) de chaque référentiel lorsque des pull requests sont ouvertes sur la branche par défaut.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Activate Amazon Inspector Lambda code scanning so that the code of the applications is scanned after each deployment."
        fr: "Activer l'analyse du code Lambda d'Amazon Inspector afin que le code des applications soit analysé après chaque déploiement."
    - id: b
      text:
        en: "Turn on Amazon ECR enhanced scanning so that the images built from the repositories are scanned when they are pushed."
        fr: "Activer l'analyse améliorée d'Amazon ECR afin que les images construites à partir des référentiels soient analysées lors de leur envoi."
    - id: c
      text:
        en: "Subscribe the developers to Amazon Q Developer, and run its security scans from their IDEs before they open pull requests."
        fr: "Abonner les développeurs à Amazon Q Developer, et exécuter ses analyses de sécurité depuis leurs IDE avant l'ouverture des pull requests."
    - id: d
      text:
        en: "Activate Amazon Inspector Code Security, integrate it with GitHub, and apply a scan configuration with SAST, SCA and IaC analysis and a pull request trigger."
        fr: "Activer Amazon Inspector Code Security, l'intégrer à GitHub, et appliquer une configuration d'analyse avec l'analyse SAST, SCA et IaC et un déclencheur sur pull request."
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Inspector Code Security scans first-party source code (SAST), third-party dependencies (SCA) and infrastructure as code. A scan configuration applied to the repositories can trigger scans when a pull request is opened against the default branch, which replaces the discontinued CodeGuru Security scans."
    fr: "Amazon Inspector Code Security analyse le code source propriétaire (SAST), les dépendances tierces (SCA) et l'infrastructure en tant que code. Une configuration d'analyse appliquée aux référentiels peut déclencher une analyse à l'ouverture d'une pull request sur la branche par défaut, ce qui remplace les analyses de CodeGuru Security abandonné."
  options:
    a:
      en: "Lambda code scanning scans deployed Lambda functions, not repositories, and it does not analyze infrastructure as code or run on pull requests."
      fr: "L'analyse du code Lambda analyse les fonctions Lambda déployées, et non les référentiels, et elle n'examine pas l'IaC et ne s'exécute pas sur les pull requests."
    b:
      en: "ECR enhanced scanning finds vulnerable packages in images, not flaws in first-party code or infrastructure as code, and it runs after the build."
      fr: "L'analyse améliorée d'ECR détecte les paquets vulnérables des images, et non les failles du code propriétaire ou de l'IaC, et elle s'exécute après le build."
    c:
      en: "Amazon Q Developer no longer accepts new sign-ups, and IDE scans run by each developer are not managed scans of every pull request."
      fr: "Amazon Q Developer n'accepte plus de nouvelles inscriptions, et des analyses lancées par chaque développeur dans son IDE ne sont pas des analyses gérées de chaque pull request."
references:
  - title: "Amazon Inspector Code Security - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments.html
  - title: "Creating a scan configuration - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments-create-configuration.html
