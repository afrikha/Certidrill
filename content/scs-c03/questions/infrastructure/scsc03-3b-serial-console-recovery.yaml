id: scsc03-3b-serial-console-recovery
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator at AnyCompany applied an operating system network configuration change that disabled the network interface of an Amazon EC2 Linux instance built on the Nitro System. SSH and AWS Systems Manager Session Manager no longer connect, and the instance is still running. The company's hardened AMI creates a local break-glass user with a password. The security team must give the administrator interactive access to repair the configuration without detaching the root volume, and access must be controlled with IAM.

    Which solution will meet these requirements?
  fr: |
    Un administrateur d'AnyCompany a appliqué une modification de la configuration réseau du système d'exploitation qui a désactivé l'interface réseau d'une instance Amazon EC2 Linux reposant sur le système Nitro. Ni SSH ni AWS Systems Manager Session Manager ne se connectent plus, et l'instance est toujours en cours d'exécution. L'AMI renforcée de l'entreprise crée un utilisateur local d'accès d'urgence (break-glass) avec un mot de passe. L'équipe de sécurité doit donner à l'administrateur un accès interactif pour réparer la configuration sans détacher le volume racine, et l'accès doit être contrôlé par IAM.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an EC2 Instance Connect Endpoint in the subnet of the instance, and connect through it with the break-glass user."
        fr: "Créer un point de terminaison EC2 Instance Connect dans le sous-réseau de l'instance, et s'y connecter avec l'utilisateur d'accès d'urgence."
    - id: b
      text:
        en: "Stop the instance, attach its root volume to a recovery instance, and fix the network configuration from there."
        fr: "Arrêter l'instance, attacher son volume racine à une instance de récupération, et corriger la configuration réseau depuis celle-ci."
    - id: c
      text:
        en: "Start a Session Manager port forwarding session to port 22, and log in with the break-glass user."
        fr: "Démarrer une session Session Manager de réacheminement de port vers le port 22, et se connecter avec l'utilisateur d'accès d'urgence."
    - id: d
      text:
        en: "Turn on EC2 Serial Console access for the account, allow ec2-instance-connect:SendSerialConsoleSSHPublicKey for the administrator, and log in with the break-glass user."
        fr: "Activer l'accès à la console série EC2 pour le compte, autoriser ec2-instance-connect:SendSerialConsoleSSHPublicKey pour l'administrateur, et se connecter avec l'utilisateur d'accès d'urgence."
answer: { optionId: d }
explanation:
  correct:
    en: "The EC2 Serial Console gives text access to a running Nitro instance through its serial port, independently of the instance's network configuration. Access is turned on at the account level and authorized in IAM, and on Linux the administrator logs in with a password-based user, such as the break-glass user of the AMI."
    fr: "La console série EC2 donne un accès texte à une instance Nitro en cours d'exécution par son port série, indépendamment de la configuration réseau de l'instance. L'accès s'active au niveau du compte et s'autorise dans IAM, et sous Linux l'administrateur se connecte avec un utilisateur à mot de passe, comme l'utilisateur d'accès d'urgence de l'AMI."
  options:
    a:
      en: "An EC2 Instance Connect Endpoint still reaches the instance over its network, which the configuration change disabled."
      fr: "Un point de terminaison EC2 Instance Connect atteint toujours l'instance par son réseau, que la modification de configuration a désactivé."
    b:
      en: "Moving the root volume to a recovery instance works, but the requirement is to repair the instance without detaching the root volume."
      fr: "Déplacer le volume racine vers une instance de récupération fonctionne, mais l'exigence est de réparer l'instance sans détacher le volume racine."
    c:
      en: "Session Manager depends on the SSM Agent reaching the Systems Manager endpoints over the network, which no longer works."
      fr: "Session Manager dépend de l'agent SSM qui atteint les points de terminaison Systems Manager par le réseau, ce qui ne fonctionne plus."
references:
  - title: "Prerequisites for the EC2 Serial Console - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-serial-console-prerequisites.html
