id: scsc03-3b-codesec-pr-visibility
objective: "3.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany integrated Amazon Inspector Code Security with its GitHub organization. The scan configuration uses customized scanning triggers: scanning when code is changed is enabled with the trigger for new pull requests opened against the default branch, and periodic scanning is disabled. Developers see some critical and high findings in their pull requests, but the security team finds no findings for these repositories in the Amazon Inspector console. The security team must see the findings of every repository in Amazon Inspector while pull requests continue to be scanned.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a intégré Amazon Inspector Code Security à son organisation GitHub. La configuration d'analyse utilise des déclencheurs personnalisés : l'analyse lors des modifications du code est activée avec le déclencheur sur les nouvelles pull requests ouvertes sur la branche par défaut, et l'analyse périodique est désactivée. Les développeurs voient certains résultats critiques et élevés dans leurs pull requests, mais l'équipe de sécurité ne trouve aucun résultat pour ces référentiels dans la console Amazon Inspector. L'équipe de sécurité doit voir les résultats de chaque référentiel dans Amazon Inspector, tout en continuant d'analyser les pull requests.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Lower the minimum severity threshold for automatic fix pull requests so that more findings are reported."
        fr: "Abaisser le seuil de sévérité minimal des pull requests de correction automatique afin que davantage de résultats soient signalés."
    - id: b
      text:
        en: "Ask developers to close and reopen each pull request after every new commit so that a new scan runs."
        fr: "Demander aux développeurs de fermer et rouvrir chaque pull request après chaque nouveau commit afin qu'une nouvelle analyse s'exécute."
    - id: c
      text:
        en: "Enable periodic scanning in the scan configuration in addition to the pull request trigger."
        fr: "Activer l'analyse périodique dans la configuration d'analyse en plus du déclencheur sur pull request."
    - id: d
      text:
        en: "Create a second GitHub integration in the delegated administrator account for the same organization."
        fr: "Créer une seconde intégration GitHub dans le compte administrateur délégué pour la même organisation."
answer: { optionId: c }
explanation:
  correct:
    en: "When a scan configuration has only merge and pull request triggers, only the top 25 critical or high findings are shown, and only in the source code management platform, not in Amazon Inspector. Adding periodic scanning makes Inspector scan the repositories on a schedule and record their findings, while the pull request trigger stays in place."
    fr: "Lorsqu'une configuration d'analyse n'a que des déclencheurs de fusion et de pull request, seuls les 25 principaux résultats critiques ou élevés sont affichés, et uniquement dans la plateforme de gestion du code source, pas dans Amazon Inspector. Ajouter l'analyse périodique fait analyser les référentiels selon une planification et enregistrer leurs résultats dans Inspector, tandis que le déclencheur sur pull request reste en place."
  options:
    a:
      en: "The threshold controls which SAST findings get automatic fix pull requests; it does not make findings appear in Amazon Inspector."
      fr: "Le seuil détermine quels résultats SAST reçoivent des pull requests de correction automatique ; il ne fait pas apparaître les résultats dans Amazon Inspector."
    b:
      en: "Reopening a pull request starts another pull request scan, whose findings still appear only in GitHub, and the manual work does not scale."
      fr: "Rouvrir une pull request démarre une autre analyse de pull request, dont les résultats n'apparaissent toujours que dans GitHub, et ce travail manuel ne passe pas à l'échelle."
    d:
      en: "The visibility comes from the scan triggers, not from the number of integrations, so a second integration changes nothing."
      fr: "La visibilité dépend des déclencheurs d'analyse, et non du nombre d'intégrations : une seconde intégration ne change rien."
references:
  - title: "Creating a scan configuration - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments-create-configuration.html
