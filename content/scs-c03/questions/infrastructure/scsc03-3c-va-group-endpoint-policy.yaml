id: scsc03-3c-va-group-endpoint-policy
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Verified Access to give employees access to eight internal web applications. All the applications are endpoints in one Verified Access group. The Verified Access instance has two trust providers: the organization instance of AWS IAM Identity Center and CrowdStrike. Every application must be limited to members of the Employees group. The payroll application must also require a CrowdStrike overall assessment score greater than 80. The other applications must not require any device check.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS Verified Access pour donner aux employés l'accès à huit applications web internes. Toutes les applications sont des points de terminaison d'un même groupe Verified Access. L'instance Verified Access a deux fournisseurs de confiance : l'instance d'organisation d'AWS IAM Identity Center et CrowdStrike. Chaque application doit être réservée aux membres du groupe Employees. L'application de paie doit en plus exiger un score d'évaluation global CrowdStrike supérieur à 80. Les autres applications ne doivent exiger aucune vérification de l'appareil.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the CrowdStrike score condition to the group policy, and attach an endpoint policy that permits all requests to each application except the payroll application.
        fr: |-
          Ajouter la condition de score CrowdStrike à la politique du groupe, et attacher à chaque application sauf l'application de paie une politique de point de terminaison qui autorise toutes les requêtes.
    - id: b
      text:
        en: |-
          Remove the group policy, and attach to each endpoint a policy that checks the Employees group, with the CrowdStrike score condition added only for the payroll endpoint.
        fr: |-
          Supprimer la politique du groupe, et attacher à chaque point de terminaison une politique qui vérifie le groupe Employees, en ajoutant la condition de score CrowdStrike uniquement pour le point de terminaison de paie.
    - id: c
      text:
        en: |-
          Move the payroll application to a second Verified Access instance that has only the CrowdStrike trust provider, and give its group a policy that checks the score.
        fr: |-
          Déplacer l'application de paie vers une deuxième instance Verified Access qui n'a que le fournisseur de confiance CrowdStrike, et donner à son groupe une politique qui vérifie le score.
    - id: d
      text:
        en: |-
          Keep the group policy that checks the Employees group, and attach to the payroll endpoint a policy that permits requests only when the CrowdStrike overall score is greater than 80.
        fr: |-
          Conserver la politique du groupe qui vérifie le groupe Employees, et attacher au point de terminaison de paie une politique qui n'autorise les requêtes que lorsque le score global CrowdStrike est supérieur à 80.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Every endpoint inherits the policy of its Verified Access group, and an endpoint can also have its own policy. When both the group and the endpoint have a policy, both must allow the request, so the group policy enforces the Employees check for all applications and the payroll endpoint policy adds the device condition only for that application.
    fr: |-
      Chaque point de terminaison hérite de la politique de son groupe Verified Access, et un point de terminaison peut aussi avoir sa propre politique. Lorsque le groupe et le point de terminaison ont tous deux une politique, les deux doivent autoriser la requête : la politique du groupe applique la vérification Employees à toutes les applications et la politique du point de terminaison de paie ajoute la condition d'appareil pour cette seule application.
  options:
    a:
      en: |-
        The group policy applies to every endpoint of the group, and an endpoint policy cannot override it because both must allow the request, so every application would require the device check.
      fr: |-
        La politique du groupe s'applique à chaque point de terminaison du groupe, et une politique de point de terminaison ne peut pas la contourner puisque les deux doivent autoriser la requête : chaque application exigerait donc la vérification de l'appareil.
    b:
      en: |-
        A Verified Access group without a policy blocks all access requests until a policy is defined, so removing the group policy denies access to every application.
      fr: |-
        Un groupe Verified Access sans politique bloque toutes les demandes d'accès jusqu'à ce qu'une politique soit définie : supprimer la politique du groupe refuse donc l'accès à toutes les applications.
    c:
      en: |-
        Without the IAM Identity Center trust provider, the second instance cannot check membership of the Employees group, and it adds an instance to operate.
      fr: |-
        Sans le fournisseur de confiance IAM Identity Center, la deuxième instance ne peut pas vérifier l'appartenance au groupe Employees, et elle ajoute une instance à exploiter.
references:
