id: scsc03-3c-macsec-dedicated-100g
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany, a trading firm, connects its data center to AWS through a 1 Gbps hosted connection from an AWS Direct Connect Partner. The firm is moving to a 100 Gbps link at a Direct Connect location that supports MAC Security (MACsec). A new compliance rule requires that all traffic between the firm's edge router and the Direct Connect device be encrypted at layer 2 at line rate. The security team does not want IPsec overhead and does not want to deploy third-party encryption appliances.

    Which solution will meet these requirements?
  fr: |
    AnyCompany, une société de trading, connecte son centre de données à AWS par une connexion hébergée de 1 Gbit/s fournie par un partenaire AWS Direct Connect. La société passe à une liaison de 100 Gbit/s dans un emplacement Direct Connect qui prend en charge MAC Security (MACsec). Une nouvelle règle de conformité exige que tout le trafic entre le routeur de périphérie de la société et l'équipement Direct Connect soit chiffré au niveau de la couche 2, au débit de la ligne. L'équipe de sécurité ne veut pas de la surcharge d'IPsec et ne veut pas déployer d'appliances de chiffrement tierces.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Order a hosted connection of the new capacity from the Partner, enable MACsec on it, and associate a CKN/CAK pair with the hosted connection.
        fr: |-
          Commander auprès du partenaire une connexion hébergée de la nouvelle capacité, y activer MACsec et associer une paire CKN/CAK à la connexion hébergée.
    - id: b
      text:
        en: |-
          Order a 100 Gbps dedicated connection, create a public virtual interface on it, and run AWS Site-to-Site VPN tunnels to a transit gateway over that interface.
        fr: |-
          Commander une connexion dédiée de 100 Gbit/s, y créer une interface virtuelle publique et faire passer des tunnels AWS Site-to-Site VPN vers une passerelle de transit sur cette interface.
    - id: c
      text:
        en: |-
          Order a 100 Gbps dedicated connection with MACsec enabled, associate a CKN/CAK pair with it, and configure the same pair on the edge router.
        fr: |-
          Commander une connexion dédiée de 100 Gbit/s avec MACsec activé, lui associer une paire CKN/CAK et configurer la même paire sur le routeur de périphérie.
    - id: d
      text:
        en: |-
          Order a 100 Gbps dedicated connection and create a private IP Site-to-Site VPN over a transit virtual interface to a transit gateway.
        fr: |-
          Commander une connexion dédiée de 100 Gbit/s et créer un Site-to-Site VPN à adresses IP privées sur une interface virtuelle de transit vers une passerelle de transit.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      MACsec (IEEE 802.1AE) encrypts traffic at layer 2, point to point, between the customer router and the Direct Connect device, and it is supported on 10, 100 and 400 Gbps dedicated connections at selected locations. MACsec must be turned on when the dedicated connection is created; you then associate a CKN/CAK pair with the connection and configure the matching pair on your router.
    fr: |-
      MACsec (IEEE 802.1AE) chiffre le trafic au niveau de la couche 2, de point à point, entre le routeur du client et l'équipement Direct Connect, et il est pris en charge sur les connexions dédiées de 10, 100 et 400 Gbit/s dans certains emplacements. MACsec doit être activé à la création de la connexion dédiée ; vous associez ensuite une paire CKN/CAK à la connexion et configurez la paire correspondante sur votre routeur.
  options:
    a:
      en: |-
        MACsec is supported on dedicated connections, LAGs of dedicated connections and partner interconnects, but not on hosted connections.
      fr: |-
        MACsec est pris en charge sur les connexions dédiées, les LAG de connexions dédiées et les interconnexions de partenaires, mais pas sur les connexions hébergées.
    b:
      en: |-
        Site-to-Site VPN is IPsec encryption at layer 3, which the team wants to avoid, and each tunnel has a bandwidth limit far below 100 Gbps.
      fr: |-
        Site-to-Site VPN est un chiffrement IPsec au niveau de la couche 3, que l'équipe veut éviter, et chaque tunnel a une limite de bande passante très inférieure à 100 Gbit/s.
    d:
      en: |-
        A private IP VPN avoids public addresses, but it is still IPsec at layer 3 with per-tunnel bandwidth limits, so it does not give layer 2 encryption at line rate.
      fr: |-
        Un VPN à adresses IP privées évite les adresses publiques, mais il reste un chiffrement IPsec de couche 3 avec des limites de bande passante par tunnel ; il n'offre donc pas un chiffrement de couche 2 au débit de la ligne.
references:
  - title: MAC Security in Direct Connect - AWS Direct Connect
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/MACsec.html
  - title: Get started using MACsec on a dedicated Direct Connect connection - AWS Direct Connect
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/create-macsec-dedicated.html
