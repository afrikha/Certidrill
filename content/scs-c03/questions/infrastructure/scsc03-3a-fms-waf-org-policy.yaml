id: scsc03-3a-fms-waf-org-policy
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 120 accounts in AWS Organizations with all features enabled, and new accounts are created every month. AWS Config is enabled in every account and Region. Every internet-facing Application Load Balancer is tagged exposure=public. The security team requires that each of these load balancers be protected by a web ACL that evaluates a central rule group first and the AWS managed core rule set last, while account teams can add their own rules between them. New accounts and new load balancers must be protected automatically, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 120 comptes dans AWS Organizations avec toutes les fonctionnalités activées, et de nouveaux comptes sont créés chaque mois. AWS Config est activé dans chaque compte et chaque Région. Chaque Application Load Balancer exposé à Internet porte la balise exposure=public. L'équipe de sécurité exige que chacun de ces équilibreurs de charge soit protégé par une liste ACL web qui évalue un groupe de règles central en premier et le jeu de règles de base géré par AWS en dernier, tandis que les équipes des comptes peuvent ajouter leurs propres règles entre les deux. Les nouveaux comptes et les nouveaux équilibreurs de charge doivent être protégés automatiquement, avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy a web ACL with the two rule groups to every account with CloudFormation StackSets, and ask account teams to associate it with their tagged load balancers.
        fr: |-
          Déployer dans chaque compte une liste ACL web contenant les deux groupes de règles avec CloudFormation StackSets, et demander aux équipes des comptes de l'associer à leurs équilibreurs de charge balisés.
    - id: b
      text:
        en: |-
          Deploy the alb-waf-enabled AWS Config rule in every account with an AWS Systems Manager Automation remediation that creates and associates a web ACL.
        fr: |-
          Déployer la règle AWS Config alb-waf-enabled dans chaque compte avec une correction AWS Systems Manager Automation qui crée et associe une liste ACL web.
    - id: c
      text:
        en: |-
          Attach an SCP that denies elasticloadbalancing:CreateLoadBalancer for load balancers tagged exposure=public that are not associated with a web ACL.
        fr: |-
          Attacher une SCP qui refuse elasticloadbalancing:CreateLoadBalancer pour les équilibreurs de charge balisés exposure=public qui ne sont pas associés à une liste ACL web.
    - id: d
      text:
        en: |-
          Designate a Firewall Manager administrator account and create an AWS WAF policy with the first and last rule groups, scoped to load balancers tagged exposure=public, with automatic remediation.
        fr: |-
          Désigner un compte administrateur Firewall Manager et créer une politique AWS WAF avec les groupes de règles de début et de fin, limitée aux équilibreurs de charge balisés exposure=public, avec correction automatique.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An AWS Firewall Manager AWS WAF policy defines rule groups that run first and last in the web ACL, and account owners can add rules between them. With automatic remediation and a tag-based scope, Firewall Manager creates and associates the web ACL for every in-scope load balancer and applies the policy to accounts as they join the organization.
    fr: |-
      Une politique AWS WAF d'AWS Firewall Manager définit des groupes de règles exécutés en premier et en dernier dans la liste ACL web, et les propriétaires des comptes peuvent ajouter des règles entre eux. Avec la correction automatique et une portée fondée sur les balises, Firewall Manager crée et associe la liste ACL web pour chaque équilibreur de charge dans la portée et applique la politique aux comptes dès qu'ils rejoignent l'organisation.
  options:
    a:
      en: |-
        StackSets can deploy the web ACL, but association depends on each team, nothing protects new load balancers automatically, and teams can change the rule order.
      fr: |-
        StackSets peut déployer la liste ACL web, mais l'association dépend de chaque équipe, rien ne protège automatiquement les nouveaux équilibreurs de charge, et les équipes peuvent modifier l'ordre des règles.
    b:
      en: |-
        A custom remediation runbook adds overhead to build and maintain, and it does not enforce a first and last rule group structure.
      fr: |-
        Un runbook de correction personnalisé ajoute de la charge de construction et de maintenance, et il n'impose pas une structure de groupes de règles de début et de fin.
    c:
      en: |-
        SCP conditions cannot evaluate whether a load balancer is associated with a web ACL, and an SCP never creates the missing protection.
      fr: |-
        Les conditions d'une SCP ne peuvent pas évaluer si un équilibreur de charge est associé à une liste ACL web, et une SCP ne crée jamais la protection manquante.
references:
  - title: Using AWS Firewall Manager policies - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/working-with-policies.html
  - title: AWS Firewall Manager prerequisites - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/fms-prereq.html
