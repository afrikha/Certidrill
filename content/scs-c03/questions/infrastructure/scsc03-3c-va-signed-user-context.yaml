id: scsc03-3c-va-signed-user-context
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany exposes an internal expense application through an AWS Verified Access endpoint. The Verified Access instance uses an OpenID Connect (OIDC) trust provider. The application must display the signed-in user's email address and must make its own authorization decisions from the user's groups. The security team requires the application to trust these claims only if they were issued by the company's Verified Access instance, and users must not sign in a second time.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose une application interne de notes de frais par un point de terminaison AWS Verified Access. L'instance Verified Access utilise un fournisseur de confiance OpenID Connect (OIDC). L'application doit afficher l'adresse e-mail de l'utilisateur connecté et doit prendre ses propres décisions d'autorisation à partir des groupes de l'utilisateur. L'équipe de sécurité exige que l'application ne fasse confiance à ces revendications que si elles ont été émises par l'instance Verified Access de l'entreprise, et les utilisateurs ne doivent pas se connecter une seconde fois.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Read the user's email address and groups from the X-Forwarded-For and X-Amzn-Trace-Id headers that the load balancer adds to each request.
        fr: |-
          Lire l'adresse e-mail et les groupes de l'utilisateur dans les en-têtes X-Forwarded-For et X-Amzn-Trace-Id que l'équilibreur de charge ajoute à chaque requête.
    - id: b
      text:
        en: |-
          Read the x-amzn-ava-user-context header, check that the signer field of the JWT is the instance ARN, get the public key for its kid from the Regional endpoint, and verify the ES384 signature.
        fr: |-
          Lire l'en-tête x-amzn-ava-user-context, vérifier que le champ signer du JWT est l'ARN de l'instance, obtenir la clé publique correspondant à son kid auprès du point de terminaison régional, et vérifier la signature ES384.
    - id: c
      text:
        en: |-
          Add an authenticate-oidc action with the same identity provider to the listener of the internal Application Load Balancer, and read the claims from the x-amzn-oidc-data header.
        fr: |-
          Ajouter une action authenticate-oidc avec le même fournisseur d'identité à l'écouteur de l'Application Load Balancer interne, et lire les revendications dans l'en-tête x-amzn-oidc-data.
    - id: d
      text:
        en: |-
          Decode the payload of the x-amzn-ava-user-context header without verifying its signature, and accept the claims when the email_verified claim is true.
        fr: |-
          Décoder la charge utile de l'en-tête x-amzn-ava-user-context sans vérifier sa signature, et accepter les revendications lorsque la revendication email_verified est vraie.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      After authentication, Verified Access passes the user claims to the application in the x-amzn-ava-user-context header as a JWT signed with ES384. The application first checks that the signer field in the JWT header matches its Verified Access instance ARN, then gets the public key identified by kid from the Regional Verified Access public key endpoint and verifies the signature before using claims such as email and groups.
    fr: |-
      Après l'authentification, Verified Access transmet les revendications de l'utilisateur à l'application dans l'en-tête x-amzn-ava-user-context sous la forme d'un JWT signé en ES384. L'application vérifie d'abord que le champ signer de l'en-tête du JWT correspond à l'ARN de son instance Verified Access, puis obtient la clé publique identifiée par kid auprès du point de terminaison régional des clés publiques Verified Access et vérifie la signature avant d'utiliser des revendications comme email et groups.
  options:
    a:
      en: |-
        X-Forwarded-For carries the client IP address and X-Amzn-Trace-Id carries a tracing identifier; neither header contains user claims.
      fr: |-
        X-Forwarded-For contient l'adresse IP du client et X-Amzn-Trace-Id un identifiant de traçage ; aucun de ces en-têtes ne contient de revendications d'utilisateur.
    c:
      en: |-
        Authentication on the load balancer adds a second sign-in flow, and its claims come from the load balancer, not from the Verified Access instance.
      fr: |-
        L'authentification sur l'équilibreur de charge ajoute un second flux de connexion, et ses revendications proviennent de l'équilibreur de charge, pas de l'instance Verified Access.
    d:
      en: |-
        Without signature and signer verification, the application cannot prove that the claims were issued by its Verified Access instance.
      fr: |-
        Sans vérification de la signature et du signataire, l'application ne peut pas prouver que les revendications ont été émises par son instance Verified Access.
references:
  - title: User claims passing and signature verification in Verified Access - AWS Verified Access
    url: https://docs.aws.amazon.com/verified-access/latest/ug/user-claims-passing.html
