id: scsc03-3b-order-network-firewall
objective: "3.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany wants to inspect the internet traffic of a VPC with AWS Network Firewall. The VPC already has a dedicated firewall subnet in each Availability Zone, workload subnets, and an internet gateway. The security team has written the Suricata rules that the firewall must enforce.

    Which four actions should the security team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany veut inspecter le trafic Internet d'un VPC avec AWS Network Firewall. Le VPC dispose déjà d'un sous-réseau de pare-feu dédié dans chaque zone de disponibilité, de sous-réseaux de charges de travail et d'une passerelle Internet. L'équipe de sécurité a rédigé les règles Suricata que le pare-feu doit appliquer.

    Quelles sont les quatre actions que l'équipe de sécurité doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: routes
      text: { en: "Update the workload subnet route tables and the internet gateway route table to send traffic through the firewall endpoints.", fr: "Mettre à jour les tables de routage des sous-réseaux de charges de travail et la table de routage de la passerelle Internet pour faire passer le trafic par les points de terminaison de pare-feu." }
    - id: gwlb
      text: { en: "Create a Gateway Load Balancer and register the firewall subnets as its targets.", fr: "Créer un Gateway Load Balancer et enregistrer les sous-réseaux de pare-feu comme cibles." }
    - id: policy
      text: { en: "Create a firewall policy that references the rule group and sets the default actions.", fr: "Créer une politique de pare-feu qui référence le groupe de règles et définit les actions par défaut." }
    - id: igw
      text: { en: "Associate the firewall policy directly with the internet gateway.", fr: "Associer directement la politique de pare-feu à la passerelle Internet." }
    - id: firewall
      text: { en: "Create the firewall with the firewall policy, and map it to the firewall subnets.", fr: "Créer le pare-feu avec la politique de pare-feu, et l'associer aux sous-réseaux de pare-feu." }
    - id: rules
      text: { en: "Create a stateful rule group from the Suricata rules.", fr: "Créer un groupe de règles avec état à partir des règles Suricata." }
answer:
  sequence: [rules, policy, firewall, routes]
explanation:
  correct:
    en: "A firewall policy references rule groups, so the rule group comes first. Creating a firewall requires the ARN of its firewall policy, and Network Firewall creates a firewall endpoint in each mapped subnet. The routes can point to the firewall endpoints only after they exist, so the route tables are updated last."
    fr: "Une politique de pare-feu référence des groupes de règles : le groupe de règles vient donc en premier. La création d'un pare-feu exige l'ARN de sa politique de pare-feu, et Network Firewall crée un point de terminaison de pare-feu dans chaque sous-réseau associé. Les itinéraires ne peuvent pointer vers les points de terminaison de pare-feu qu'une fois ceux-ci créés : les tables de routage sont donc mises à jour en dernier."
  options:
    gwlb:
      en: "Network Firewall provisions its own firewall endpoints; the company does not create a Gateway Load Balancer for it."
      fr: "Network Firewall provisionne ses propres points de terminaison de pare-feu ; l'entreprise ne crée pas de Gateway Load Balancer pour lui."
    igw:
      en: "A firewall policy is attached to a firewall, not to an internet gateway; traffic reaches the firewall through routing."
      fr: "Une politique de pare-feu s'attache à un pare-feu, et non à une passerelle Internet ; le trafic atteint le pare-feu par le routage."
references:
  - title: "CreateFirewall - AWS Network Firewall"
    url: https://docs.aws.amazon.com/network-firewall/latest/APIReference/API_CreateFirewall.html
  - title: "Firewall policy settings in AWS Network Firewall - AWS Network Firewall"
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/stateless-default-actions.html
