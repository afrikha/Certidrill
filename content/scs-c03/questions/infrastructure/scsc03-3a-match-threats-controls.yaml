id: scsc03-3a-match-threats-controls
objective: "3.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is writing the edge and perimeter section of its threat model for a web application that runs behind Amazon CloudFront and an Application Load Balancer, with workloads in several VPCs. For each anticipated threat, the security team must select the AWS service that mitigates it.

    Match each threat to the AWS service that mitigates it.

    To answer, drag the appropriate service to each threat. Each service may be used once or not at all.
  fr: |
    AnyCompany rédige la section périphérie et périmètre de son modèle de menaces pour une application web qui s'exécute derrière Amazon CloudFront et un Application Load Balancer, avec des charges de travail dans plusieurs VPC. Pour chaque menace anticipée, l'équipe de sécurité doit choisir le service AWS qui l'atténue.

    Associez chaque menace au service AWS qui l'atténue.

    Pour répondre, faites glisser le service approprié vers chaque menace. Chaque service peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - id: shield
      text: AWS Shield Standard
    - id: waf
      text:
        en: "AWS WAF with AWS managed rule groups"
        fr: "AWS WAF avec des groupes de règles gérés par AWS"
    - id: dnsfw
      text: Amazon Route 53 Resolver DNS Firewall
    - id: nfw
      text: AWS Network Firewall
    - id: gd
      text: Amazon GuardDuty
  targets:
    - id: t1
      text:
        en: "SYN floods and UDP reflection attacks against the CloudFront distribution, with no configuration and no additional charge"
        fr: "Des inondations SYN et des attaques par réflexion UDP contre la distribution CloudFront, sans configuration ni frais supplémentaires"
    - id: t2
      text:
        en: "SQL injection and cross-site scripting payloads in the query strings of requests sent to the distribution"
        fr: "Des charges utiles d'injection SQL et de cross-site scripting dans les chaînes de requête envoyées à la distribution"
    - id: t3
      text:
        en: "Compromised instances that resolve the domain names of known command-and-control servers through the VPC resolver"
        fr: "Des instances compromises qui résolvent les noms de domaine de serveurs de commande et de contrôle connus au moyen du résolveur du VPC"
    - id: t4
      text:
        en: "Outbound HTTPS connections from VPC subnets to unapproved domains, which must be blocked by TLS SNI in a central inspection VPC"
        fr: "Des connexions HTTPS sortantes depuis des sous-réseaux de VPC vers des domaines non approuvés, qui doivent être bloquées selon le SNI TLS dans un VPC d'inspection central"
answer:
  mapping: { t1: shield, t2: waf, t3: dnsfw, t4: nfw }
explanation:
  correct:
    en: |-
      Shield Standard automatically protects every AWS customer against common network and transport layer DDoS attacks at no extra charge, with the strongest protection for CloudFront, Route 53 and Global Accelerator. AWS WAF managed rule groups such as the core rule set and the SQL database rule group inspect web requests for injection and XSS patterns. Route 53 Resolver DNS Firewall filters DNS queries that leave the VPC resolver, and AWS Network Firewall inspects and filters outbound traffic, including by TLS server name indication, in an inspection VPC.
    fr: |-
      Shield Standard protège automatiquement tous les clients AWS contre les attaques DDoS courantes des couches réseau et transport, sans frais supplémentaires, avec la protection la plus complète pour CloudFront, Route 53 et Global Accelerator. Les groupes de règles gérés AWS WAF, comme le jeu de règles de base (core rule set) et le groupe de règles SQL database, inspectent les requêtes web à la recherche de motifs d'injection et de XSS. Route 53 Resolver DNS Firewall filtre les requêtes DNS qui passent par le résolveur du VPC, et AWS Network Firewall inspecte et filtre le trafic sortant, y compris selon l'indication du nom de serveur TLS, dans un VPC d'inspection.
  options:
    gd:
      en: |-
        GuardDuty detects threats such as communication with known malicious domains and produces findings, but it does not block the traffic.
      fr: |-
        GuardDuty détecte des menaces, comme la communication avec des domaines malveillants connus, et produit des résultats, mais il ne bloque pas le trafic.
references:
  - title: AWS Shield Standard overview - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-standard-summary.html
  - title: Using AWS Firewall Manager policies - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/working-with-policies.html
