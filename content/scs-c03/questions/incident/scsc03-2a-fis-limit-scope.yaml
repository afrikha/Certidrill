id: scsc03-2a-fis-limit-scope
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany will run an AWS FIS experiment in a production account to validate that its incident recovery automation replaces a terminated instance of an Auto Scaling group. The security team requires that the experiment affects as few resources as possible and can never act outside its intended scope.

    Which combination of steps will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |-
    AnyCompany va exécuter une expérience AWS FIS dans un compte de production pour valider que son automatisation de rétablissement après incident remplace une instance terminée d'un groupe Auto Scaling. L'équipe de sécurité exige que l'expérience affecte le moins de ressources possible et ne puisse jamais agir en dehors de son étendue prévue.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Select the targets by a tag that only the instances of that group carry, with the COUNT(1) selection mode.
        fr: |-
          Sélectionner les cibles par une étiquette que seules les instances de ce groupe portent, avec le mode de sélection COUNT(1).
    - id: b
      text:
        en: |-
          Attach the AdministratorAccess policy to the experiment role so that the actions never fail with permission errors.
        fr: |-
          Attacher la politique AdministratorAccess au rôle d'expérience afin que les actions n'échouent jamais avec des erreurs d'autorisation.
    - id: c
      text:
        en: |-
          Set the actions mode of the experiment to skip-all so that FIS runs the actions only on healthy resources.
        fr: |-
          Définir le mode d'actions de l'expérience sur skip-all afin que FIS n'exécute les actions que sur des ressources saines.
    - id: d
      text:
        en: |-
          Target the instances of all the Auto Scaling groups of the account with the ALL selection mode.
        fr: |-
          Cibler les instances de tous les groupes Auto Scaling du compte avec le mode de sélection ALL.
    - id: e
      text:
        en: |-
          Grant the experiment role only the permissions of the template's actions, limited by conditions to the tagged instances.
        fr: |-
          Accorder au rôle d'expérience uniquement les autorisations des actions du modèle, limitées par des conditions aux instances étiquetées.
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      Resource tags narrow the candidate targets, and the COUNT(1) selection mode makes the action run on only one of them. A least-privilege experiment role that is limited to the tagged instances means that even a wrong target definition cannot let FIS act on other resources.
    fr: |-
      Les étiquettes de ressources réduisent les cibles candidates, et le mode de sélection COUNT(1) fait exécuter l'action sur une seule d'entre elles. Un rôle d'expérience au moindre privilège limité aux instances étiquetées garantit que même une définition de cible erronée ne permet pas à FIS d'agir sur d'autres ressources.
  options:
    b:
      en: |-
        AdministratorAccess lets the experiment act on any resource, the opposite of a guaranteed scope.
      fr: |-
        AdministratorAccess permet à l'expérience d'agir sur n'importe quelle ressource, l'inverse d'une étendue garantie.
    c:
      en: |-
        The skip-all mode is a target preview that runs no action, so the automation is not tested.
      fr: |-
        Le mode skip-all est un aperçu des cibles qui n'exécute aucune action : l'automatisation n'est pas testée.
    d:
      en: |-
        ALL across every group affects the most resources possible.
      fr: |-
        ALL sur tous les groupes affecte le plus de ressources possible.
references:
  - title: "Targets for AWS FIS - AWS Fault Injection Service"
    url: https://docs.aws.amazon.com/fis/latest/userguide/targets.html
