id: scsc03-2a-notebook-playbooks
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    The incident response analysts at AnyCompany follow written playbooks for credential compromise. They copy Amazon Athena queries from a wiki and run them against AWS CloudTrail and VPC Flow Logs tables, and errors in copied queries have delayed investigations. The team wants playbooks that combine explanatory text with executable queries, that show results inline so that an analyst can adjust the next query, that can be kept under version control, and that run with temporary credentials.

    Which solution will meet these requirements?
  fr: |-
    Les analystes de réponse aux incidents d'AnyCompany suivent des playbooks écrits pour la compromission d'informations d'identification. Ils copient des requêtes Amazon Athena depuis un wiki et les exécutent sur des tables AWS CloudTrail et VPC Flow Logs, et des erreurs dans les requêtes copiées ont retardé des investigations. L'équipe veut des playbooks qui combinent un texte explicatif et des requêtes exécutables, qui affichent les résultats en ligne afin qu'un analyste puisse ajuster la requête suivante, qui peuvent être gérés en contrôle de version, et qui s'exécutent avec des informations d'identification temporaires.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Convert each playbook into an AWS Systems Manager Automation runbook with aws:executeScript steps that run the Athena queries and write the results to Amazon S3.
        fr: |-
          Convertir chaque playbook en runbook AWS Systems Manager Automation avec des étapes aws:executeScript qui exécutent les requêtes Athena et écrivent les résultats dans Amazon S3.
    - id: b
      text:
        en: |-
          Store the queries as Amazon CloudWatch Logs Insights saved queries, and give the analysts one CloudWatch dashboard for each playbook.
        fr: |-
          Enregistrer les requêtes comme requêtes enregistrées Amazon CloudWatch Logs Insights, et donner aux analystes un tableau de bord CloudWatch par playbook.
    - id: c
      text:
        en: |-
          Attach the queries to Systems Manager OpsCenter OpsItems as operational data, and let the analysts paste them into the Athena console.
        fr: |-
          Joindre les requêtes aux OpsItems Systems Manager OpsCenter en tant que données opérationnelles, et laisser les analystes les coller dans la console Athena.
    - id: d
      text:
        en: |-
          Write the playbooks as Jupyter notebooks on an Amazon SageMaker AI notebook instance whose IAM role allows the Athena queries, and keep them in a Git repository.
        fr: |-
          Écrire les playbooks sous forme de blocs-notes Jupyter sur une instance de bloc-notes Amazon SageMaker AI dont le rôle IAM autorise les requêtes Athena, et les conserver dans un dépôt Git.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Jupyter notebooks combine Markdown text with code cells that analysts can run one by one, see the results inline, and adapt, which makes the response repeatable and documented. The notebook instance calls Athena with the temporary credentials of its IAM role, and notebooks can be kept under source control so that changes are reviewed.
    fr: |-
      Les blocs-notes Jupyter combinent du texte Markdown et des cellules de code que les analystes exécutent une à une, dont ils voient les résultats en ligne et qu'ils peuvent adapter, ce qui rend la réponse reproductible et documentée. L'instance de bloc-notes appelle Athena avec les informations d'identification temporaires de son rôle IAM, et les blocs-notes peuvent être gérés en contrôle de source afin que les modifications soient revues.
  options:
    a:
      en: |-
        A runbook runs its steps without stopping, so an analyst cannot look at a result and adjust the next query.
      fr: |-
        Un runbook exécute ses étapes sans s'arrêter : un analyste ne peut pas examiner un résultat et ajuster la requête suivante.
    b:
      en: |-
        Logs Insights queries CloudWatch Logs log groups, not the Athena tables over data in Amazon S3, and dashboards carry no playbook steps.
      fr: |-
        Logs Insights interroge des groupes de journaux CloudWatch Logs, pas les tables Athena sur des données dans Amazon S3, et les tableaux de bord ne portent aucune étape de playbook.
    c:
      en: |-
        Analysts would still copy and paste the queries, which is the source of the errors.
      fr: |-
        Les analystes copieraient et colleraient toujours les requêtes, ce qui est la source des erreurs.
references:
  - title: "How to improve your security incident response processes with Jupyter notebooks | AWS Security Blog"
    url: https://aws.amazon.com/blogs/security/how-to-improve-your-security-incident-response-processes-with-jupyter-notebooks/
  - title: "SEC10-BP04 Develop and test security incident response playbooks - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/sec_incident_response_playbooks.html
