id: scsc03-2a-runbook-default-version
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    At AnyCompany, an Amazon EventBridge rule starts a custom AWS Systems Manager Automation runbook named IR-Isolate for each high severity Amazon GuardDuty finding. The rule target does not specify a document version. Engineers often improve the runbook. The security lead requires that a changed runbook never runs from the rule before the lead has reviewed it, and that a reviewed version takes effect without any change to the rule.

    Which solution will meet these requirements?
  fr: |-
    Chez AnyCompany, une règle Amazon EventBridge démarre un runbook AWS Systems Manager Automation personnalisé nommé IR-Isolate pour chaque résultat Amazon GuardDuty de gravité élevée. La cible de la règle ne spécifie pas de version de document. Les ingénieurs améliorent souvent le runbook. Le responsable de la sécurité exige qu'un runbook modifié ne s'exécute jamais depuis la règle avant qu'il l'ait revu, et qu'une version revue prenne effet sans aucune modification de la règle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the rule target to run the $LATEST version, and ask the engineers to save their changes only after the lead's review.
        fr: |-
          Configurer la cible de la règle pour exécuter la version $LATEST, et demander aux ingénieurs de n'enregistrer leurs modifications qu'après la revue du responsable.
    - id: b
      text:
        en: |-
          Add an aws:approve step to the runbook so that the lead approves each run before the isolation steps start.
        fr: |-
          Ajouter une étape aws:approve au runbook afin que le responsable approuve chaque exécution avant le début des étapes d'isolation.
    - id: c
      text:
        en: |-
          Have the engineers save each change as a new version of IR-Isolate, and have the lead set each reviewed version as the default version.
        fr: |-
          Faire enregistrer chaque modification par les ingénieurs comme nouvelle version d'IR-Isolate, et faire définir par le responsable chaque version revue comme version par défaut.
    - id: d
      text:
        en: |-
          Create a new runbook for each change, and have the lead update the target of the rule to the new runbook after the review.
        fr: |-
          Créer un nouveau runbook pour chaque modification, et faire mettre à jour par le responsable la cible de la règle vers le nouveau runbook après la revue.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Updating a Systems Manager document creates a new latest version but leaves the default version unchanged, and a run that does not name a version uses the default version. The lead promotes a reviewed version with UpdateDocumentDefaultVersion, so the rule picks it up without being edited.
    fr: |-
      La mise à jour d'un document Systems Manager crée une nouvelle dernière version mais laisse la version par défaut inchangée, et une exécution qui ne nomme pas de version utilise la version par défaut. Le responsable promeut une version revue avec UpdateDocumentDefaultVersion : la règle l'utilise sans être modifiée.
  options:
    a:
      en: |-
        $LATEST runs a change as soon as it is saved, so the control depends only on engineers following a process.
      fr: |-
        $LATEST exécute une modification dès son enregistrement : le contrôle ne dépend que du respect d'un processus par les ingénieurs.
    b:
      en: |-
        An approval step approves each run, not the content of the runbook, and it delays every automatic isolation.
      fr: |-
        Une étape d'approbation approuve chaque exécution, pas le contenu du runbook, et elle retarde chaque isolation automatique.
    d:
      en: |-
        Each reviewed change requires editing the rule, which the lead wants to avoid.
      fr: |-
        Chaque modification revue exige de modifier la règle, ce que le responsable veut éviter.
references:
  - title: "UpdateDocument - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_UpdateDocument.html
