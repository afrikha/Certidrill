id: scsc03-2a-match-ir-test-tools
objective: "2.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany's security team is planning how to test and validate its incident response plan.

    Match each testing requirement to the tool that meets it.

    To answer, drag the appropriate tool to each requirement. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |-
    L'équipe de sécurité d'AnyCompany planifie la manière de tester et de valider son plan de réponse aux incidents.

    Associez chaque exigence de test à l'outil qui y répond.

    Pour répondre, faites glisser l'outil approprié vers chaque exigence. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: gdsample
      text:
        en: |-
          GuardDuty sample findings
        fr: |-
          Exemples de résultats GuardDuty
    - id: gdtester
      text:
        en: |-
          GuardDuty tester
        fr: |-
          Testeur GuardDuty
    - id: fis
      text:
        en: |-
          AWS FIS experiment with a stop condition
        fr: |-
          Expérience AWS FIS avec une condition d'arrêt
    - id: lever
      text:
        en: |-
          AWS FIS safety lever
        fr: |-
          Levier de sécurité AWS FIS
    - id: rh
      text:
        en: |-
          AWS Resilience Hub
        fr: |-
          AWS Resilience Hub
    - id: det
      text:
        en: |-
          Amazon Detective
        fr: |-
          Amazon Detective
  targets:
    - id: t1
      text:
        en: |-
          Produce one finding of a chosen type to check an EventBridge rule, without activity on any resource
        fr: |-
          Produire un résultat d'un type choisi pour vérifier une règle EventBridge, sans activité sur aucune ressource
    - id: t2
      text:
        en: |-
          Generate real findings from simulated attack activity against test resources in a dedicated account
        fr: |-
          Générer de vrais résultats à partir d'une activité d'attaque simulée contre des ressources de test dans un compte dédié
    - id: t3
      text:
        en: |-
          Inject a failure into tagged resources and end the test automatically when a CloudWatch alarm fires
        fr: |-
          Injecter une défaillance dans des ressources étiquetées et terminer le test automatiquement lorsqu'une alarme CloudWatch se déclenche
    - id: t4
      text:
        en: |-
          Stop all running experiments in an account and Region and block new ones
        fr: |-
          Arrêter toutes les expériences en cours dans un compte et une Région et bloquer les nouvelles
    - id: t5
      text:
        en: |-
          Estimate whether an application meets its RTO and RPO targets and recommend SOPs
        fr: |-
          Estimer si une application atteint ses objectifs de RTO et de RPO et recommander des SOP
answer:
  mapping: { t1: gdsample, t2: gdtester, t3: fis, t4: lever, t5: rh }
explanation:
  correct:
    en: |-
      Sample findings test rules and automation without real activity, whereas the GuardDuty tester creates real findings from simulated activity on resources that it deploys in a dedicated account. An FIS experiment injects faults and stops when its stop condition alarm fires, the safety lever stops and blocks all experiments of an account in a Region, and Resilience Hub assesses RTO and RPO targets and recommends SOPs.
    fr: |-
      Les exemples de résultats testent les règles et l'automatisation sans activité réelle, alors que le testeur GuardDuty crée de vrais résultats à partir d'une activité simulée sur des ressources qu'il déploie dans un compte dédié. Une expérience FIS injecte des défaillances et s'arrête lorsque l'alarme de sa condition d'arrêt se déclenche, le levier de sécurité arrête et bloque toutes les expériences d'un compte dans une Région, et Resilience Hub évalue les objectifs de RTO et de RPO et recommande des SOP.
  options:
    det:
      en: |-
        Detective helps investigate the root cause of findings; it does not generate findings, inject faults, or assess recovery targets.
      fr: |-
        Detective aide à rechercher la cause racine des résultats ; il ne génère pas de résultats, n'injecte pas de défaillances et n'évalue pas les objectifs de rétablissement.
references:
  - title: "Test GuardDuty findings in dedicated accounts - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings-scripts.html
  - title: "Safety Levers for AWS FIS - AWS Fault Injection Service"
    url: https://docs.aws.amazon.com/fis/latest/userguide/safety-lever.html
