id: scsc03-2a-fis-vpce-alarm
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's incident response plan states that if the application instances lose access to AWS Secrets Manager through their interface VPC endpoint, an Amazon CloudWatch alarm enters the ALARM state and starts an automated runbook. The team wants an AWS FIS experiment in a staging account that creates this exact condition and then verifies automatically that the alarm entered the ALARM state.

    Which AWS FIS actions should the experiment template include? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |-
    Le plan de réponse aux incidents d'AnyCompany stipule que si les instances de l'application perdent l'accès à AWS Secrets Manager au moyen de leur point de terminaison d'interface VPC, une alarme Amazon CloudWatch passe à l'état ALARM et démarre un runbook automatisé. L'équipe veut une expérience AWS FIS dans un compte de préproduction qui crée exactement cette condition, puis vérifie automatiquement que l'alarme est passée à l'état ALARM.

    Quelles actions AWS FIS le modèle d'expérience doit-il inclure ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          aws:fis:inject-api-throttle-error on the IAM role of the application instances.
        fr: |-
          aws:fis:inject-api-throttle-error sur le rôle IAM des instances de l'application.
    - id: b
      text:
        en: |-
          aws:network:disrupt-vpc-endpoint on the Secrets Manager interface endpoint.
        fr: |-
          aws:network:disrupt-vpc-endpoint sur le point de terminaison d'interface Secrets Manager.
    - id: c
      text:
        en: |-
          aws:ec2:stop-instances on the application instances that use the endpoint.
        fr: |-
          aws:ec2:stop-instances sur les instances de l'application qui utilisent le point de terminaison.
    - id: d
      text:
        en: |-
          aws:cloudwatch:assert-alarm-state, started after the disruption, that expects the ALARM state.
        fr: |-
          aws:cloudwatch:assert-alarm-state, démarrée après la perturbation, qui attend l'état ALARM.
    - id: e
      text:
        en: |-
          aws:ssm:start-automation-execution that runs the response runbook directly from the experiment.
        fr: |-
          aws:ssm:start-automation-execution qui exécute directement le runbook de réponse depuis l'expérience.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      The aws:network:disrupt-vpc-endpoint action swaps an empty security group onto the endpoint, which cuts the instances' access to Secrets Manager through it, the condition of the plan. An aws:cloudwatch:assert-alarm-state action that starts after the disruption then verifies that the alarm is in the expected ALARM state.
    fr: |-
      L'action aws:network:disrupt-vpc-endpoint remplace le groupe de sécurité du point de terminaison par un groupe vide, ce qui coupe l'accès des instances à Secrets Manager par ce point de terminaison, soit la condition du plan. Une action aws:cloudwatch:assert-alarm-state qui démarre après la perturbation vérifie ensuite que l'alarme est dans l'état ALARM attendu.
  options:
    a:
      en: |-
        This injects errors into the API requests that the role makes; it does not remove the network path through the endpoint that the plan describes.
      fr: |-
        Cette action injecte des erreurs dans les requêtes d'API du rôle ; elle ne supprime pas le chemin réseau par le point de terminaison que décrit le plan.
    c:
      en: |-
        Stopped instances do not reproduce a loss of access to the endpoint by running instances.
      fr: |-
        Des instances arrêtées ne reproduisent pas une perte d'accès au point de terminaison par des instances en cours d'exécution.
    e:
      en: |-
        Starting the runbook directly bypasses the alarm that the experiment must validate.
      fr: |-
        Démarrer directement le runbook contourne l'alarme que l'expérience doit valider.
references:
  - title: "AWS FIS Actions reference - AWS Fault Injection Service"
    url: https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html
