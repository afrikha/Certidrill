id: scsc03-2a-srt-access-role
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany protects an Application Load Balancer and an Amazon CloudFront distribution with AWS Shield Advanced and has the Business Support plan. To prepare for DDoS events, the security team wants the Shield Response Team (SRT) to be able to review the AWS WAF logs and manage web ACL rules during an attack. The SRT must also be able to read the Application Load Balancer access logs, which are stored in an S3 bucket with SSE-S3 encryption in the same account. The team wants the LEAST operational overhead and no long-term credentials.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany protège un Application Load Balancer et une distribution Amazon CloudFront avec AWS Shield Advanced et dispose du plan Business Support. Pour se préparer aux événements DDoS, l'équipe de sécurité veut que la Shield Response Team (SRT) puisse examiner les journaux AWS WAF et gérer les règles des listes ACL web pendant une attaque. La SRT doit aussi pouvoir lire les journaux d'accès de l'Application Load Balancer, stockés dans un compartiment S3 chiffré avec SSE-S3 dans le même compte. L'équipe veut le MOINS de frais opérationnels et aucune information d'identification à long terme.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM user for the SRT with the AWSShieldDRTAccessPolicy managed policy, and give the SRT its access keys through AWS Secrets Manager.
        fr: |-
          Créer un utilisateur IAM pour la SRT avec la politique gérée AWSShieldDRTAccessPolicy, et transmettre ses clés d'accès à la SRT au moyen d'AWS Secrets Manager.
    - id: b
      text:
        en: |-
          Create an IAM role that trusts the AWS Support service principal with the AdministratorAccess policy, and send the role ARN to AWS Support in a case.
        fr: |-
          Créer un rôle IAM qui approuve le principal de service AWS Support avec la politique AdministratorAccess, et envoyer l'ARN du rôle à AWS Support dans un dossier.
    - id: c
      text:
        en: |-
          Add a bucket policy that allows drt.shield.amazonaws.com to read the log bucket, and open a support case to request web ACL changes during an attack.
        fr: |-
          Ajouter une politique de compartiment qui autorise drt.shield.amazonaws.com à lire le compartiment de journaux, et ouvrir un dossier de support pour demander des modifications d'ACL web pendant une attaque.
    - id: d
      text:
        en: |-
          In the Shield console, edit the SRT access to create a new role with the AWSShieldDRTAccessPolicy managed policy, and add the log bucket to the settings.
        fr: |-
          Dans la console Shield, modifier l'accès SRT pour créer un nouveau rôle doté de la politique gérée AWSShieldDRTAccessPolicy, et ajouter le compartiment de journaux aux paramètres.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When you choose to create a new role for the SRT, Shield creates a role that trusts the drt.shield.amazonaws.com service principal and attaches AWSShieldDRTAccessPolicy, which lets the SRT call Shield Advanced and AWS WAF APIs and read the AWS WAF logs. Other logs are shared by adding up to 10 buckets in the same account, which can be unencrypted or use SSE-S3.
    fr: |-
      Lorsque vous choisissez de créer un nouveau rôle pour la SRT, Shield crée un rôle qui approuve le principal de service drt.shield.amazonaws.com et attache AWSShieldDRTAccessPolicy, qui permet à la SRT d'appeler les API Shield Advanced et AWS WAF et de lire les journaux AWS WAF. Les autres journaux sont partagés en ajoutant jusqu'à 10 compartiments du même compte, non chiffrés ou chiffrés avec SSE-S3.
  options:
    a:
      en: |-
        Access keys are long-term credentials, and the SRT is given access through a role that trusts its service principal, not through an IAM user.
      fr: |-
        Des clés d'accès sont des informations d'identification à long terme, et la SRT reçoit l'accès au moyen d'un rôle qui approuve son principal de service, pas d'un utilisateur IAM.
    b:
      en: |-
        The SRT is represented by drt.shield.amazonaws.com, and AdministratorAccess is far broader than the SRT needs.
      fr: |-
        La SRT est représentée par drt.shield.amazonaws.com, et AdministratorAccess est bien plus large que ce dont la SRT a besoin.
    c:
      en: |-
        Bucket access alone does not let the SRT read the AWS WAF logs or change web ACLs, and requesting each change through a case slows mitigation.
      fr: |-
        L'accès au compartiment ne permet pas à lui seul à la SRT de lire les journaux AWS WAF ni de modifier les ACL web, et demander chaque modification par un dossier ralentit l'atténuation.
references:
  - title: "Granting access for the SRT - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-srt-access.html
