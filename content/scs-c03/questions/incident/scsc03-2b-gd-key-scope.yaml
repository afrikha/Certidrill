id: scsc03-2b-gd-key-scope
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Amazon GuardDuty reports an UnauthorizedAccess:IAMUser/MaliciousIPCaller finding for an access key that starts with AKIA and belongs to the IAM user svc-reporting in a member account. AnyCompany has an organization trail that logs management events and S3 data events for all accounts and Regions to an Amazon S3 bucket with an Amazon Athena table. The owner of svc-reporting cannot confirm the activity. Before containment, the security team must assess the scope of the event: what the key was used for and which resources it could reach.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Amazon GuardDuty signale un résultat UnauthorizedAccess:IAMUser/MaliciousIPCaller pour une clé d'accès qui commence par AKIA et appartient à l'utilisateur IAM svc-reporting d'un compte membre. AnyCompany dispose d'un journal de suivi d'organisation qui journalise les événements de gestion et les événements de données S3 de tous les comptes et de toutes les Régions dans un compartiment Amazon S3 doté d'une table Amazon Athena. Le propriétaire de svc-reporting ne peut pas confirmer l'activité. Avant le confinement, l'équipe de sécurité doit évaluer la portée de l'événement : à quoi la clé a servi et quelles ressources elle pouvait atteindre.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Query the organization trail table in Athena for every event whose userIdentity.accessKeyId is the key, in all Regions, since the key was created.", fr: "Interroger dans Athena la table du journal de suivi d'organisation pour tous les événements dont userIdentity.accessKeyId est la clé, dans toutes les Régions, depuis la création de la clé." }
    - id: b
      text: { en: "Search the CloudTrail Event history of the member account in us-east-1 with the access key ID as the lookup attribute.", fr: "Rechercher dans l'historique des événements CloudTrail du compte membre dans us-east-1 avec l'ID de clé d'accès comme attribut de recherche." }
    - id: c
      text: { en: "Review the permissions of svc-reporting and its Access Advisor last-accessed data to determine the services and resources the key could reach.", fr: "Examiner les autorisations de svc-reporting et les données de dernier accès d'Access Advisor pour déterminer les services et les ressources que la clé pouvait atteindre." }
    - id: d
      text: { en: "Run an Amazon Inspector scan on the IAM user to list the resources that the access key accessed.", fr: "Exécuter une analyse Amazon Inspector sur l'utilisateur IAM pour lister les ressources auxquelles la clé d'accès a accédé." }
    - id: e
      text: { en: "Generate an IAM credential report, and use the last-used Region and service of the key as the scope of the event.", fr: "Générer un rapport d'informations d'identification IAM, et utiliser la dernière Région et le dernier service utilisés par la clé comme portée de l'événement." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The organization trail holds every management event and S3 data event signed with the key, in all accounts and Regions, so an Athena query on userIdentity.accessKeyId shows what the key did. GuardDuty's remediation guidance then has you review the entity's permissions and Access Advisor data, which shows what else the key could have reached."
    fr: "Le journal de suivi d'organisation contient tous les événements de gestion et de données S3 signés avec la clé, dans tous les comptes et toutes les Régions : une requête Athena sur userIdentity.accessKeyId montre ce que la clé a fait. Les recommandations de correction de GuardDuty demandent ensuite d'examiner les autorisations de l'entité et les données d'Access Advisor, qui montrent ce que la clé aurait pu atteindre d'autre."
  options:
    b:
      en: "Event history covers a single Region, only management events, and only 90 days, so activity in other Regions and S3 data access would be missed."
      fr: "L'historique des événements ne couvre qu'une Région, que les événements de gestion et que 90 jours : l'activité des autres Régions et les accès aux données S3 seraient manqués."
    d:
      en: "Inspector scans workloads for vulnerabilities; it does not analyze the activity of IAM users."
      fr: "Inspector analyse les charges de travail à la recherche de vulnérabilités ; il n'analyse pas l'activité des utilisateurs IAM."
    e:
      en: "The credential report shows only the last Region and service used, not the full list of actions taken with the key."
      fr: "Le rapport d'informations d'identification ne montre que la dernière Région et le dernier service utilisés, et non la liste complète des actions effectuées avec la clé."
references:
  - title: "Remediating potentially compromised AWS credentials - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/compromised-creds.html
  - title: "Working with CloudTrail event history - AWS CloudTrail"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
