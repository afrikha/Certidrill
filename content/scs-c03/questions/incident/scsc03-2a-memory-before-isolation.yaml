id: scsc03-2a-memory-before-isolation
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    Amazon GuardDuty reports that an Amazon EC2 instance at AnyCompany communicates with a known command-and-control server. The responders suspect memory-resident malware that leaves no files on disk. The instance is managed by AWS Systems Manager and reaches it through VPC endpoints. The incident response plan requires that the most volatile evidence be preserved before containment.

    What should the responders do first?
  fr: |-
    Amazon GuardDuty signale qu'une instance Amazon EC2 d'AnyCompany communique avec un serveur de commande et de contrôle connu. Les intervenants soupçonnent un logiciel malveillant résidant en mémoire qui ne laisse aucun fichier sur le disque. L'instance est gérée par AWS Systems Manager et l'atteint au moyen de points de terminaison VPC. Le plan de réponse aux incidents exige que les preuves les plus volatiles soient préservées avant le confinement.

    Que doivent faire les intervenants en premier ?
body:
  options:
    - id: a
      text:
        en: |-
          Stop the instance to freeze its state, and then create snapshots of its EBS volumes for analysis.
        fr: |-
          Arrêter l'instance pour figer son état, puis créer des instantanés de ses volumes EBS pour analyse.
    - id: b
      text:
        en: |-
          Run a memory acquisition tool with Systems Manager Run Command, and write the image to an S3 bucket in the forensics account.
        fr: |-
          Exécuter un outil d'acquisition de la mémoire avec Systems Manager Run Command, et écrire l'image dans un compartiment S3 du compte d'investigation.
    - id: c
      text:
        en: |-
          Attach an isolation security group that has no rules, and then capture the memory with Systems Manager Run Command.
        fr: |-
          Attacher un groupe de sécurité d'isolation sans aucune règle, puis capturer la mémoire avec Systems Manager Run Command.
    - id: d
      text:
        en: |-
          Start a GuardDuty on-demand malware scan of the instance, and retain the EBS snapshots that GuardDuty creates.
        fr: |-
          Démarrer une analyse de logiciels malveillants à la demande GuardDuty de l'instance, et conserver les instantanés EBS que GuardDuty crée.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      EBS snapshots capture only data written to the volumes, so data held in memory requires a memory image taken with an acquisition tool. AWS guidance is to capture memory before live response, isolation, or shutdown, and Run Command can run the tool while the instance still reaches Systems Manager.
    fr: |-
      Les instantanés EBS ne capturent que les données écrites sur les volumes : les données en mémoire exigent une image mémoire prise avec un outil d'acquisition. Les recommandations d'AWS sont de capturer la mémoire avant toute réponse en direct, isolation ou arrêt, et Run Command peut exécuter l'outil tant que l'instance atteint encore Systems Manager.
  options:
    a:
      en: |-
        Stopping the instance erases its memory, which is where the malware lives.
      fr: |-
        Arrêter l'instance efface sa mémoire, là où réside le logiciel malveillant.
    c:
      en: |-
        Isolation comes after memory capture, and a group without outbound rules also blocks new connections from the instance to the Systems Manager endpoints.
      fr: |-
        L'isolation vient après la capture de la mémoire, et un groupe sans règle sortante bloque aussi les nouvelles connexions de l'instance vers les points de terminaison Systems Manager.
    d:
      en: |-
        The malware scan works from EBS snapshots, which do not contain the memory.
      fr: |-
        L'analyse de logiciels malveillants s'appuie sur des instantanés EBS, qui ne contiennent pas la mémoire.
references:
  - title: "Collect relevant artifacts - AWS Security Incident Response User Guide"
    url: https://docs.aws.amazon.com/security-ir/latest/userguide/collect-relevant-artifacts.html
