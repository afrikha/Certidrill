id: scsc03-2a-approve-multi-account
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's security tooling account is the delegated administrator for AWS Systems Manager. The incident response team runs a custom Automation runbook from this account that replaces the security groups of tagged Amazon EC2 instances in 30 member accounts and three AWS Regions by using target locations. A new requirement states that one security manager must approve each run before any change is made. The team added an aws:approve step at the start of the runbook, and the multi-account runs now fail. The team wants to use managed Systems Manager features and no custom code.

    Which solution will meet these requirements?
  fr: |-
    Le compte d'outillage de sécurité d'AnyCompany est l'administrateur délégué d'AWS Systems Manager. L'équipe de réponse aux incidents exécute depuis ce compte un runbook Automation personnalisé qui remplace les groupes de sécurité des instances Amazon EC2 étiquetées dans 30 comptes membres et trois Régions AWS au moyen d'emplacements cibles (target locations). Une nouvelle exigence impose qu'un responsable de la sécurité approuve chaque exécution avant toute modification. L'équipe a ajouté une étape aws:approve au début du runbook, et les exécutions multicomptes échouent désormais. L'équipe veut utiliser des fonctionnalités gérées de Systems Manager et aucun code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Set MinRequiredApprovals to 1, and add the AWS-SystemsManager-AutomationExecutionRole of each member account to the Approvers list of the step.
        fr: |-
          Définir MinRequiredApprovals sur 1, et ajouter le rôle AWS-SystemsManager-AutomationExecutionRole de chaque compte membre à la liste Approvers de l'étape.
    - id: b
      text:
        en: |-
          Remove the target locations, and run the runbook with its aws:approve step separately in each member account and Region.
        fr: |-
          Supprimer les emplacements cibles, et exécuter le runbook avec son étape aws:approve séparément dans chaque compte membre et chaque Région.
    - id: c
      text:
        en: |-
          Create a parent runbook in the tooling account with an aws:approve step, then an aws:executeAutomation step that passes TargetLocations to the containment runbook.
        fr: |-
          Créer dans le compte d'outillage un runbook parent avec une étape aws:approve, puis une étape aws:executeAutomation qui transmet TargetLocations au runbook de confinement.
    - id: d
      text:
        en: |-
          Create an AWS Step Functions workflow that waits for a task token from an approval Lambda function and then calls StartAutomationExecution with the target locations.
        fr: |-
          Créer un flux de travail AWS Step Functions qui attend un jeton de tâche d'une fonction Lambda d'approbation, puis appelle StartAutomationExecution avec les emplacements cibles.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The aws:approve action does not support multi-account and Region automations. A parent runbook that runs only in the tooling account can pause for the approval, and its aws:executeAutomation step accepts TargetLocations, so the containment runbook then runs in every account and Region after a single approval.
    fr: |-
      L'action aws:approve ne prend pas en charge les automatisations multicomptes et multi-Régions. Un runbook parent exécuté uniquement dans le compte d'outillage peut se mettre en pause pour l'approbation, et son étape aws:executeAutomation accepte TargetLocations : le runbook de confinement s'exécute ensuite dans chaque compte et chaque Région après une seule approbation.
  options:
    a:
      en: |-
        The approvers do not matter: aws:approve is not supported in a multi-account and Region automation, and one approval is already the default.
      fr: |-
        Les approbateurs n'y changent rien : aws:approve n'est pas pris en charge dans une automatisation multicomptes et multi-Régions, et une seule approbation est déjà la valeur par défaut.
    b:
      en: |-
        Separate runs need 90 approvals instead of one and lose the central rate control of target locations.
      fr: |-
        Des exécutions séparées exigent 90 approbations au lieu d'une et perdent le contrôle centralisé du débit des emplacements cibles.
    d:
      en: |-
        The approval Lambda function and the call to StartAutomationExecution are custom code.
      fr: |-
        La fonction Lambda d'approbation et l'appel à StartAutomationExecution sont du code personnalisé.
references:
  - title: "aws:approve – Pause an automation for manual approval - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-approve.html
  - title: "aws:executeAutomation – Run another automation - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-executeAutomation.html
