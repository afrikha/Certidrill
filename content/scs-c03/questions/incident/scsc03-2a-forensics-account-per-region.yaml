id: scsc03-2a-forensics-account-per-region
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany runs workloads in the eu-west-1 and eu-central-1 Regions. Data sovereignty rules require that evidence collected in a Region is never copied to another Region. The incident response plan requires that responders can copy Amazon EBS snapshots and logs to an isolated forensics environment as soon as an incident starts.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany exécute des charges de travail dans les Régions eu-west-1 et eu-central-1. Des règles de souveraineté des données imposent que les preuves collectées dans une Région ne soient jamais copiées dans une autre Région. Le plan de réponse aux incidents exige que les intervenants puissent copier des instantanés Amazon EBS et des journaux vers un environnement d'investigation isolé dès le début d'un incident.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Use the existing log archive account as the forensics environment, and copy the evidence to a dedicated prefix of its central S3 bucket.
        fr: |-
          Utiliser le compte d'archivage des journaux existant comme environnement d'investigation, et copier les preuves dans un préfixe dédié de son compartiment S3 central.
    - id: b
      text:
        en: |-
          Create one forensics account, and configure S3 Cross-Region Replication so that its evidence bucket is available in both Regions.
        fr: |-
          Créer un compte d'investigation unique, et configurer la réplication S3 entre Régions afin que son compartiment de preuves soit disponible dans les deux Régions.
    - id: c
      text:
        en: |-
          Request a forensics account through AWS Control Tower Account Factory when an incident is declared, and close it after the investigation.
        fr: |-
          Demander un compte d'investigation au moyen d'AWS Control Tower Account Factory lorsqu'un incident est déclaré, et le fermer après l'investigation.
    - id: d
      text:
        en: |-
          Create a forensics OU with one forensics account per Region in advance, and attach an SCP that denies actions outside the Region of each account.
        fr: |-
          Créer à l'avance une UO d'investigation avec un compte d'investigation par Région, et attacher une SCP qui refuse les actions en dehors de la Région de chaque compte.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The AWS Well-Architected Framework recommends a forensics OU that can contain one forensics account per Region, so that resource creation outside that Region can be blocked and evidence is not copied to an unintended Region. Because provisioning accounts takes time, the accounts must be created and instrumented well before an incident.
    fr: |-
      L'AWS Well-Architected Framework recommande une UO d'investigation qui peut contenir un compte d'investigation par Région, afin de pouvoir bloquer la création de ressources hors de cette Région et d'éviter que des preuves soient copiées dans une Région non prévue. Comme le provisionnement des comptes prend du temps, les comptes doivent être créés et instrumentés bien avant un incident.
  options:
    a:
      en: |-
        The log archive account is not an isolated forensics environment, and a single central bucket mixes evidence from both Regions.
      fr: |-
        Le compte d'archivage des journaux n'est pas un environnement d'investigation isolé, et un compartiment central unique mélange les preuves des deux Régions.
    b:
      en: |-
        Cross-Region Replication copies evidence to the other Region, which the rules forbid.
      fr: |-
        La réplication entre Régions copie les preuves dans l'autre Région, ce que les règles interdisent.
    c:
      en: |-
        Provisioning an account during the incident delays the response that the plan requires.
      fr: |-
        Provisionner un compte pendant l'incident retarde la réponse exigée par le plan.
references:
  - title: "SEC10-BP03 Prepare forensic capabilities - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/sec_incident_response_prepare_forensic.html
