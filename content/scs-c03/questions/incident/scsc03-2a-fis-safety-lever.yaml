id: scsc03-2a-fis-safety-lever
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    Several teams at AnyCompany run AWS FIS experiments in a shared account in the us-east-1 Region. The incident response plan states that when a real security incident is declared, the incident commander must be able to stop every running experiment in that account and Region at once, and must prevent any new experiment from starting until the incident is closed.

    Which solution will meet these requirements?
  fr: |-
    Plusieurs équipes d'AnyCompany exécutent des expériences AWS FIS dans un compte partagé de la Région us-east-1. Le plan de réponse aux incidents stipule que lorsqu'un véritable incident de sécurité est déclaré, le responsable de l'incident doit pouvoir arrêter en une fois toutes les expériences en cours dans ce compte et cette Région, et doit empêcher le démarrage de toute nouvelle expérience jusqu'à la clôture de l'incident.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP to the account that denies fis:StartExperiment, and detach the SCP when the incident is closed.
        fr: |-
          Attacher au compte une SCP qui refuse fis:StartExperiment, et détacher la SCP à la clôture de l'incident.
    - id: b
      text:
        en: |-
          Delete the experiment templates of all teams, and recreate them from source control after the incident is closed.
        fr: |-
          Supprimer les modèles d'expérience de toutes les équipes, et les recréer à partir du contrôle de source après la clôture de l'incident.
    - id: c
      text:
        en: |-
          Engage the FIS safety lever of the account in us-east-1, and disengage it when the incident is closed.
        fr: |-
          Enclencher le levier de sécurité FIS du compte dans us-east-1, et le désenclencher à la clôture de l'incident.
    - id: d
      text:
        en: |-
          Call StopExperiment for each running experiment, and add a stop condition to the template of each team.
        fr: |-
          Appeler StopExperiment pour chaque expérience en cours, et ajouter une condition d'arrêt au modèle de chaque équipe.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Every account has one FIS safety lever per Region. When it is engaged, in-progress experiments are stopped and any experiment that tries to start is cancelled, until the lever is disengaged and new experiments can start from the same templates.
    fr: |-
      Chaque compte dispose d'un levier de sécurité FIS par Région. Lorsqu'il est enclenché, les expériences en cours sont arrêtées et toute expérience qui tente de démarrer est annulée, jusqu'à ce que le levier soit désenclenché et que de nouvelles expériences puissent démarrer à partir des mêmes modèles.
  options:
    a:
      en: |-
        The SCP blocks new experiments but does not stop the experiments that are already running.
      fr: |-
        La SCP bloque les nouvelles expériences mais n'arrête pas celles qui sont déjà en cours.
    b:
      en: |-
        Deleting templates does not stop running experiments and destroys the teams' work.
      fr: |-
        Supprimer les modèles n'arrête pas les expériences en cours et détruit le travail des équipes.
    d:
      en: |-
        Stopping experiments one by one is slow, and stop conditions do not prevent new experiments from starting.
      fr: |-
        Arrêter les expériences une par une est lent, et les conditions d'arrêt n'empêchent pas le démarrage de nouvelles expériences.
references:
  - title: "Safety Levers for AWS FIS - AWS Fault Injection Service"
    url: https://docs.aws.amazon.com/fis/latest/userguide/safety-lever.html
