id: scsc03-2b-det-pivot-guardduty
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany uses Amazon GuardDuty and Amazon Detective with the same administrator account. GuardDuty reports a high-severity finding for an EC2 instance. To start a root cause analysis, an analyst wants to see the entities that are related to the finding, such as the IP addresses and AWS accounts involved, and the instance's past activity in visualizations, without writing queries.

    What should the analyst do?
  fr: |
    AnyCompany utilise Amazon GuardDuty et Amazon Detective avec le même compte administrateur. GuardDuty signale un résultat de gravité élevée pour une instance EC2. Pour commencer une analyse des causes racines, un analyste veut voir les entités liées au résultat, comme les adresses IP et les comptes AWS concernés, ainsi que l'activité passée de l'instance sous forme de visualisations, sans écrire de requêtes.

    Que doit faire l'analyste ?
body:
  options:
    - id: a
      text: { en: "Run Amazon Athena queries on the VPC flow logs and CloudTrail logs of the instance's account.", fr: "Exécuter des requêtes Amazon Athena sur les journaux de flux VPC et les journaux CloudTrail du compte de l'instance." }
    - id: b
      text: { en: "Start an Amazon Inspector scan of the instance and review its findings.", fr: "Lancer une analyse Amazon Inspector de l'instance et examiner ses résultats." }
    - id: c
      text: { en: "Open the instance in the AWS Config resource inventory and review its relationships.", fr: "Ouvrir l'instance dans l'inventaire des ressources AWS Config et examiner ses relations." }
    - id: d
      text: { en: "Pivot from the GuardDuty finding to its Detective finding profile, and then to the instance's entity profile.", fr: "Passer du résultat GuardDuty à son profil de résultat dans Detective, puis au profil d'entité de l'instance." }
answer: { optionId: d }
explanation:
  correct:
    en: "Detective builds a behavior graph from CloudTrail logs, VPC flow logs, and GuardDuty findings. From a GuardDuty finding, the analyst pivots to the Detective finding profile, which shows connected entities such as IP addresses and AWS accounts, and then to entity profiles whose visualizations show past activity with guidance on next steps."
    fr: "Detective construit un graphe de comportement à partir des journaux CloudTrail, des journaux de flux VPC et des résultats GuardDuty. Depuis un résultat GuardDuty, l'analyste passe au profil de résultat Detective, qui montre les entités liées comme les adresses IP et les comptes AWS, puis aux profils d'entité dont les visualisations montrent l'activité passée avec des conseils sur les étapes suivantes."
  options:
    a:
      en: "Athena can answer these questions, but only with queries that the analyst writes, which the requirement excludes."
      fr: "Athena peut répondre à ces questions, mais seulement avec des requêtes que l'analyste écrit, ce que l'exigence exclut."
    b:
      en: "Inspector reports vulnerabilities of the instance; it does not show the activity and entities behind a GuardDuty finding."
      fr: "Inspector signale les vulnérabilités de l'instance ; il ne montre pas l'activité ni les entités à l'origine d'un résultat GuardDuty."
    c:
      en: "Config shows configuration changes and resource relationships, not network or API activity with external IP addresses."
      fr: "Config montre les modifications de configuration et les relations entre ressources, et non l'activité réseau ou d'API avec des adresses IP externes."
references:
  - title: "How Detective is used for investigation - Amazon Detective"
    url: https://docs.aws.amazon.com/detective/latest/userguide/detective-investigation-about.html
