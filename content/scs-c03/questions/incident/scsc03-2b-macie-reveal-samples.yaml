id: scsc03-2b-macie-reveal-samples
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon Macie reports a SensitiveData:S3Object/Personal finding for objects in an Amazon S3 bucket that uses SSE-KMS encryption. Before the incident response team notifies anyone, a security analyst must validate the finding by viewing examples of the values that Macie detected. Only the security analysts may view those values, the values must be encrypted, and the analysts must not be given access to the full objects.

    Which solution will meet these requirements?
  fr: |
    Amazon Macie signale un résultat SensitiveData:S3Object/Personal pour des objets d'un compartiment Amazon S3 chiffré avec SSE-KMS. Avant que l'équipe de réponse aux incidents ne prévienne qui que ce soit, un analyste de sécurité doit valider le résultat en consultant des exemples des valeurs détectées par Macie. Seuls les analystes de sécurité peuvent consulter ces valeurs, les valeurs doivent être chiffrées, et les analystes ne doivent pas recevoir l'accès aux objets complets.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Grant the Macie service-linked role permission to decrypt with the bucket's KMS key, and turn on the retrieval of sensitive data samples.", fr: "Accorder au rôle lié au service Macie l'autorisation de déchiffrer avec la clé KMS du compartiment, et activer la récupération d'échantillons de données sensibles." }
    - id: b
      text: { en: "Configure Macie to retrieve sensitive data samples with a dedicated customer managed KMS key, and allow only the analysts' IAM role to retrieve samples and to use that key.", fr: "Configurer Macie pour récupérer des échantillons de données sensibles avec une clé KMS gérée par le client dédiée, et n'autoriser que le rôle IAM des analystes à récupérer des échantillons et à utiliser cette clé." }
    - id: c
      text: { en: "Create an Amazon Athena table over the affected objects, and have the analysts query the rows at the locations that the finding reports.", fr: "Créer une table Amazon Athena sur les objets concernés, et faire interroger par les analystes les lignes aux emplacements indiqués par le résultat." }
    - id: d
      text: { en: "Configure a repository for sensitive data discovery results, and have the analysts read the detected values from the result files.", fr: "Configurer un référentiel pour les résultats de la découverte de données sensibles, et faire lire par les analystes les valeurs détectées dans les fichiers de résultats." }
answer: { optionId: b }
explanation:
  correct:
    en: "When sample retrieval is configured, Macie locates up to 10 occurrences of the sensitive data that a finding reports, extracts up to 128 characters of each, and encrypts them with a KMS key that you specify. AWS recommends a dedicated key whose use is restricted to the principals that may reveal samples, together with IAM policies that limit who can retrieve them. Analysts see only the samples, not the objects."
    fr: "Quand la récupération d'échantillons est configurée, Macie localise jusqu'à 10 occurrences des données sensibles signalées par un résultat, extrait jusqu'à 128 caractères de chacune et les chiffre avec une clé KMS que vous indiquez. AWS recommande une clé dédiée dont l'utilisation est réservée aux principaux autorisés à révéler les échantillons, avec des politiques IAM qui limitent qui peut les récupérer. Les analystes ne voient que les échantillons, pas les objets."
  options:
    a:
      en: "Macie does not use its service-linked role to retrieve samples; it uses the analyst's IAM identity or an IAM role that you allow it to assume."
      fr: "Macie n'utilise pas son rôle lié au service pour récupérer des échantillons ; il utilise l'identité IAM de l'analyste ou un rôle IAM que vous l'autorisez à assumer."
    c:
      en: "Querying the objects with Athena requires read access to the full objects and their KMS key, which the analysts must not have."
      fr: "Interroger les objets avec Athena exige un accès en lecture aux objets complets et à leur clé KMS, que les analystes ne doivent pas avoir."
    d:
      en: "Discovery results describe where Macie found sensitive data, not the values themselves, so they cannot show samples."
      fr: "Les résultats de découverte décrivent où Macie a trouvé des données sensibles, et non les valeurs elles-mêmes : ils ne peuvent pas montrer d'échantillons."
references:
  - title: "Retrieving sensitive data samples with Macie findings - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/findings-retrieve-sd.html
