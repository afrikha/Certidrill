id: scsc03-2b-backup-airgap-restore
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    After a ransomware incident in which an attacker deleted backups, AnyCompany is redesigning recovery for the EC2 instances and Amazon EBS volumes of its production account. The backups must always be locked so that no one, including the production account's administrators, can delete them before their retention ends. A separate recovery account, which is a member of the organization, must be able to restore the backups directly, without first copying them into its own vault. Recovery must remain possible even if the production account becomes inaccessible.

    Which solution will meet these requirements?
  fr: |
    Après un incident de rançongiciel au cours duquel un attaquant a supprimé des sauvegardes, AnyCompany repense la restauration des instances EC2 et des volumes Amazon EBS de son compte de production. Les sauvegardes doivent toujours être verrouillées pour que personne, y compris les administrateurs du compte de production, ne puisse les supprimer avant la fin de leur rétention. Un compte de restauration distinct, membre de l'organisation, doit pouvoir restaurer les sauvegardes directement, sans les copier d'abord dans son propre coffre-fort. La restauration doit rester possible même si le compte de production devient inaccessible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the backups in an AWS Backup logically air-gapped vault, and share the vault through AWS RAM with the OU that contains the recovery account.", fr: "Stocker les sauvegardes dans un coffre-fort logiquement isolé (logically air-gapped vault) AWS Backup, et partager le coffre-fort via AWS RAM avec l'unité d'organisation qui contient le compte de restauration." }
    - id: b
      text: { en: "Store the backups in a standard backup vault that uses AWS Backup Vault Lock in compliance mode, and share the vault through AWS RAM with the recovery account.", fr: "Stocker les sauvegardes dans un coffre-fort de sauvegarde standard qui utilise AWS Backup Vault Lock en mode conformité, et partager le coffre-fort via AWS RAM avec le compte de restauration." }
    - id: c
      text: { en: "Store the backups in a standard backup vault that uses Vault Lock in governance mode, and copy each recovery point to a vault in the recovery account every day.", fr: "Stocker les sauvegardes dans un coffre-fort de sauvegarde standard qui utilise Vault Lock en mode gouvernance, et copier chaque jour chaque point de récupération dans un coffre-fort du compte de restauration." }
    - id: d
      text: { en: "Store the backups in an AWS Backup logically air-gapped vault, share it through AWS RAM with the recovery account ID, and integrate the vault with multi-party approval.", fr: "Stocker les sauvegardes dans un coffre-fort logiquement isolé (logically air-gapped vault) AWS Backup, le partager via AWS RAM avec l'ID du compte de restauration, et intégrer le coffre-fort à l'approbation multipartite." }
answer: { optionId: d }
explanation:
  correct:
    en: "A logically air-gapped vault is always locked with Vault Lock in compliance mode. It can be shared through AWS RAM with individual account IDs, and an account that it is shared with can restore its backups directly. Integrating the vault with multi-party approval keeps the backups recoverable even when the vault-owning account is inaccessible."
    fr: "Un coffre-fort logiquement isolé est toujours verrouillé par Vault Lock en mode conformité. Il peut être partagé via AWS RAM avec des ID de compte individuels, et un compte avec lequel il est partagé peut restaurer directement ses sauvegardes. Intégrer le coffre-fort à l'approbation multipartite permet de récupérer les sauvegardes même quand le compte propriétaire du coffre-fort est inaccessible."
  options:
    a:
      en: "A logically air-gapped vault cannot be shared with an entire organization or an OU; it is shared with individual account IDs, and nothing here covers an inaccessible owning account."
      fr: "Un coffre-fort logiquement isolé ne peut être partagé ni avec une organisation entière ni avec une unité d'organisation ; il se partage avec des ID de compte individuels, et rien ici ne couvre un compte propriétaire inaccessible."
    b:
      en: "Only the owning account can restore from a standard backup vault, so the recovery account cannot restore directly from it."
      fr: "Seul le compte propriétaire peut restaurer depuis un coffre-fort de sauvegarde standard : le compte de restauration ne peut pas restaurer directement à partir de celui-ci."
    c:
      en: "Governance mode can be removed by sufficiently privileged users, and the daily copy is the extra step that the company wants to avoid."
      fr: "Le mode gouvernance peut être levé par des utilisateurs disposant de privilèges suffisants, et la copie quotidienne est l'étape supplémentaire que l'entreprise veut éviter."
references:
  - title: "Logically air-gapped vault - AWS Backup"
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html
