id: scsc03-2a-sfn-owner-approval
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany wants an automated response to compromised IAM access keys. The workflow must deactivate the key, collect the AWS CloudTrail activity of the key, and then wait for the account owner to approve the deletion of the IAM user. Owners sometimes take up to three days to respond. The workflow must resume as soon as the owner approves on an internal web page, and it must not pay for idle compute while it waits.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany veut une réponse automatisée aux clés d'accès IAM compromises. Le flux de travail doit désactiver la clé, collecter l'activité AWS CloudTrail de la clé, puis attendre que le propriétaire du compte approuve la suppression de l'utilisateur IAM. Les propriétaires mettent parfois jusqu'à trois jours à répondre. Le flux de travail doit reprendre dès que le propriétaire approuve sur une page web interne, et il ne doit pas payer de calcul inactif pendant l'attente.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          An AWS Step Functions Express workflow with a task that publishes the approval request to an Amazon SNS topic and a Wait state of three days.
        fr: |-
          Un flux de travail AWS Step Functions Express avec une tâche qui publie la demande d'approbation dans une rubrique Amazon SNS et un état Wait de trois jours.
    - id: b
      text:
        en: |-
          An AWS Step Functions Standard workflow with a .waitForTaskToken task that sends the task token to the approval page, which calls SendTaskSuccess.
        fr: |-
          Un flux de travail AWS Step Functions Standard avec une tâche .waitForTaskToken qui envoie le jeton de tâche à la page d'approbation, qui appelle SendTaskSuccess.
    - id: c
      text:
        en: |-
          An AWS Lambda function that performs all the steps and polls an Amazon DynamoDB table until the owner's approval is recorded.
        fr: |-
          Une fonction AWS Lambda qui effectue toutes les étapes et interroge une table Amazon DynamoDB jusqu'à ce que l'approbation du propriétaire soit enregistrée.
    - id: d
      text:
        en: |-
          An Amazon SQS delay queue that holds the approval request for three days before an AWS Lambda function deletes the IAM user.
        fr: |-
          Une file d'attente à délai Amazon SQS qui conserve la demande d'approbation pendant trois jours avant qu'une fonction AWS Lambda supprime l'utilisateur IAM.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With the callback pattern, a task pauses until an external process returns its task token with SendTaskSuccess or SendTaskFailure, which suits a human approval. A Standard workflow can wait up to its one-year execution quota and consumes no compute while paused, and a heartbeat or timeout can end the wait if nobody answers.
    fr: |-
      Avec le modèle de rappel, une tâche se met en pause jusqu'à ce qu'un processus externe renvoie son jeton de tâche avec SendTaskSuccess ou SendTaskFailure, ce qui convient à une approbation humaine. Un flux de travail Standard peut attendre jusqu'à son quota d'exécution d'un an sans consommer de calcul pendant la pause, et un délai de pulsation ou d'expiration peut mettre fin à l'attente si personne ne répond.
  options:
    a:
      en: |-
        Express workflows run for at most five minutes and do not support the callback pattern, and a fixed Wait does not resume on approval.
      fr: |-
        Les flux de travail Express s'exécutent au plus cinq minutes et ne prennent pas en charge le modèle de rappel, et un état Wait fixe ne reprend pas lors de l'approbation.
    c:
      en: |-
        A Lambda function runs for at most 15 minutes, and polling consumes compute while it waits.
      fr: |-
        Une fonction Lambda s'exécute au plus 15 minutes, et l'interrogation consomme du calcul pendant l'attente.
    d:
      en: |-
        An SQS delay is at most 15 minutes, and the user would be deleted without waiting for the approval.
      fr: |-
        Un délai SQS est d'au plus 15 minutes, et l'utilisateur serait supprimé sans attendre l'approbation.
references:
  - title: "Discover service integration patterns in Step Functions - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
