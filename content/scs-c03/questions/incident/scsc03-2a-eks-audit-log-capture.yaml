id: scsc03-2a-eks-audit-log-capture
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany runs workloads on an Amazon EKS cluster named prod-cluster. During a recent investigation, responders could not determine which Kubernetes user had created a privileged pod, because no record of the requests to the Kubernetes API existed. The security team wants a record of the users and components that affect the cluster to be captured from now on and kept for 1 year as forensic evidence.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany exécute des charges de travail sur un cluster Amazon EKS nommé prod-cluster. Lors d'une investigation récente, les intervenants n'ont pas pu déterminer quel utilisateur Kubernetes avait créé un pod privilégié, car aucun enregistrement des requêtes à l'API Kubernetes n'existait. L'équipe de sécurité veut que les utilisateurs et composants qui agissent sur le cluster soient désormais enregistrés et que cet enregistrement soit conservé 1 an comme preuve d'investigation.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Rely on the organization trail of AWS CloudTrail, which records the requests that users send to the Kubernetes API server of the cluster.
        fr: |-
          S'appuyer sur le journal de suivi d'organisation d'AWS CloudTrail, qui enregistre les requêtes que les utilisateurs envoient au serveur d'API Kubernetes du cluster.
    - id: b
      text:
        en: |-
          Enable GuardDuty EKS Protection, and keep its findings for 1 year as the record of the requests made to the Kubernetes API of the cluster.
        fr: |-
          Activer GuardDuty EKS Protection, et conserver ses résultats pendant 1 an comme enregistrement des requêtes adressées à l'API Kubernetes du cluster.
    - id: c
      text:
        en: |-
          Enable CloudWatch Container Insights on the cluster, and set the retention of its performance log group to 1 year.
        fr: |-
          Activer CloudWatch Container Insights sur le cluster, et définir à 1 an la conservation de son groupe de journaux de performances.
    - id: d
      text:
        en: |-
          Enable the audit control plane log type of the cluster, and set the retention of the /aws/eks/prod-cluster/cluster log group to 1 year.
        fr: |-
          Activer le type de journal du plan de contrôle audit du cluster, et définir à 1 an la conservation du groupe de journaux /aws/eks/prod-cluster/cluster.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      EKS control plane logs are not sent to CloudWatch Logs by default; each log type must be enabled. Kubernetes audit logs record the individual users, administrators, and system components that affected the cluster, and they are delivered to the cluster's log group, whose retention setting keeps them for the required year.
    fr: |-
      Les journaux du plan de contrôle EKS ne sont pas envoyés par défaut vers CloudWatch Logs ; chaque type de journal doit être activé. Les journaux d'audit Kubernetes enregistrent les utilisateurs, administrateurs et composants système qui ont agi sur le cluster, et ils sont livrés dans le groupe de journaux du cluster, dont le paramètre de conservation les garde pendant l'année exigée.
  options:
    a:
      en: |-
        CloudTrail records calls to the Amazon EKS API, such as cluster management operations, not the requests sent to the Kubernetes API server.
      fr: |-
        CloudTrail enregistre les appels à l'API Amazon EKS, comme les opérations de gestion du cluster, pas les requêtes envoyées au serveur d'API Kubernetes.
    b:
      en: |-
        GuardDuty analyzes audit logs to produce findings about suspicious activity; its findings are not a complete record of the requests.
      fr: |-
        GuardDuty analyse les journaux d'audit pour produire des résultats sur les activités suspectes ; ses résultats ne constituent pas un enregistrement complet des requêtes.
    c:
      en: |-
        Container Insights collects performance metrics and logs, not the Kubernetes audit records.
      fr: |-
        Container Insights collecte des métriques et des journaux de performances, pas les enregistrements d'audit Kubernetes.
references:
  - title: "Send control plane logs to CloudWatch Logs - Amazon EKS"
    url: https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html
