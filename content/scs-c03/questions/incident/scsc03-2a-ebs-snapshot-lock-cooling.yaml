id: scsc03-2a-ebs-snapshot-lock-cooling
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    Responders at AnyCompany create Amazon EBS snapshots of compromised instances in the forensics account. Each evidence snapshot must be impossible to delete for 90 days by any user, regardless of IAM permissions. Because responders sometimes lock the wrong snapshot, the lead investigator wants a window of a few hours during which a lock can still be corrected. After that window, the lock must be immutable.

    Which solution will meet these requirements?
  fr: |-
    Les intervenants d'AnyCompany créent des instantanés Amazon EBS des instances compromises dans le compte d'investigation. Chaque instantané de preuve doit être impossible à supprimer pendant 90 jours par tout utilisateur, quelles que soient ses autorisations IAM. Comme les intervenants verrouillent parfois le mauvais instantané, l'enquêteur principal veut une fenêtre de quelques heures pendant laquelle un verrou peut encore être corrigé. Après cette fenêtre, le verrou doit être immuable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Lock the snapshots in governance mode for 90 days, and allow only the lead investigator to unlock them.
        fr: |-
          Verrouiller les instantanés en mode gouvernance pendant 90 jours, et n'autoriser que l'enquêteur principal à les déverrouiller.
    - id: b
      text:
        en: |-
          Create a Recycle Bin retention rule for EBS snapshots with a retention period of 90 days.
        fr: |-
          Créer une règle de conservation de la Corbeille (Recycle Bin) pour les instantanés EBS avec une période de conservation de 90 jours.
    - id: c
      text:
        en: |-
          Lock the snapshots in compliance mode for 90 days with a cooling-off period of a few hours.
        fr: |-
          Verrouiller les instantanés en mode conformité pendant 90 jours avec une période de refroidissement (cooling-off) de quelques heures.
    - id: d
      text:
        en: |-
          Lock the snapshots in compliance mode for 90 days without a cooling-off period, and unlock any snapshot locked by mistake.
        fr: |-
          Verrouiller les instantanés en mode conformité pendant 90 jours sans période de refroidissement, et déverrouiller tout instantané verrouillé par erreur.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      While a snapshot is locked, no user can delete it, regardless of IAM permissions. In compliance mode, an optional cooling-off period of 1 to 72 hours lets authorized users unlock the snapshot or change the lock, and once it ends, the lock can no longer be removed or shortened, only extended.
    fr: |-
      Tant qu'un instantané est verrouillé, aucun utilisateur ne peut le supprimer, quelles que soient ses autorisations IAM. En mode conformité, une période de refroidissement facultative de 1 à 72 heures permet aux utilisateurs autorisés de déverrouiller l'instantané ou de modifier le verrou, et une fois qu'elle est terminée, le verrou ne peut plus être levé ni raccourci, seulement prolongé.
  options:
    a:
      en: |-
        In governance mode, users with the right IAM permissions can unlock the snapshot at any time, so the lock is never immutable.
      fr: |-
        En mode gouvernance, les utilisateurs disposant des autorisations IAM adéquates peuvent déverrouiller l'instantané à tout moment : le verrou n'est jamais immuable.
    b:
      en: |-
        Recycle Bin does not prevent deletion; it only keeps deleted snapshots recoverable during the retention period.
      fr: |-
        La Corbeille n'empêche pas la suppression ; elle ne fait que conserver les instantanés supprimés récupérables pendant la période de conservation.
    d:
      en: |-
        Without a cooling-off period, a compliance-mode lock takes effect immediately and cannot be removed, so mistakes cannot be corrected.
      fr: |-
        Sans période de refroidissement, un verrou en mode conformité prend effet immédiatement et ne peut pas être levé : les erreurs ne peuvent pas être corrigées.
references:
  - title: "Amazon EBS snapshot lock concepts - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-lock-concepts.html
