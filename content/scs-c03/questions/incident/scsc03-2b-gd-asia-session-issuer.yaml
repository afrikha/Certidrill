id: scsc03-2b-gd-asia-session-issuer
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon GuardDuty reports an UnauthorizedAccess:IAMUser/TorIPCaller finding. The access key ID in the finding starts with ASIA, and the user name is DeployRole. DeployRole can be assumed by a CI/CD system, by two SAML-federated operator groups, and by an EC2 instance profile. To assess the scope of the event, the security team must determine which principal obtained the temporary credentials that were used from the Tor exit node.

    What should the team do?
  fr: |
    Amazon GuardDuty signale un résultat UnauthorizedAccess:IAMUser/TorIPCaller. L'ID de clé d'accès du résultat commence par ASIA, et le nom d'utilisateur est DeployRole. DeployRole peut être assumé par un système CI/CD, par deux groupes d'opérateurs fédérés par SAML et par un profil d'instance EC2. Pour évaluer la portée de l'événement, l'équipe de sécurité doit déterminer quel principal a obtenu les informations d'identification temporaires utilisées depuis le nœud de sortie Tor.

    Que doit faire l'équipe ?
body:
  options:
    - id: a
      text: { en: "In AWS CloudTrail, review the sessionIssuer and role session name of the events signed with the access key ID, and find the AssumeRole* event whose response returned that access key ID.", fr: "Dans AWS CloudTrail, examiner le sessionIssuer et le nom de session de rôle des événements signés avec l'ID de clé d'accès, et trouver l'événement AssumeRole* dont la réponse a renvoyé cet ID de clé d'accès." }
    - id: b
      text: { en: "In the IAM console, search the Security credentials tab of each IAM user for the access key ID to find which user owns the key.", fr: "Dans la console IAM, rechercher l'ID de clé d'accès dans l'onglet Security credentials de chaque utilisateur IAM pour trouver l'utilisateur propriétaire de la clé." }
    - id: c
      text: { en: "Generate an IAM credential report, and find the row whose access key matches the access key ID of the finding.", fr: "Générer un rapport d'informations d'identification IAM, et trouver la ligne dont la clé d'accès correspond à l'ID de clé d'accès du résultat." }
    - id: d
      text: { en: "Open the Access Advisor tab of DeployRole, and identify the principal from the services that the role accessed most recently.", fr: "Ouvrir l'onglet Access Advisor de DeployRole, et identifier le principal à partir des services auxquels le rôle a accédé le plus récemment." }
answer: { optionId: a }
explanation:
  correct:
    en: "Keys that start with ASIA are temporary AWS STS credentials, and when a role is used the finding shows the role name. CloudTrail events signed with the key show the sessionIssuer and the role session, and the AssumeRole, AssumeRoleWithSAML, or AssumeRoleWithWebIdentity event that returned the key identifies who requested the session. That tells the team whether the CI/CD system, a federated operator, or the instance was the source."
    fr: "Les clés qui commencent par ASIA sont des informations d'identification temporaires AWS STS, et quand un rôle est utilisé, le résultat indique le nom du rôle. Les événements CloudTrail signés avec la clé montrent le sessionIssuer et la session de rôle, et l'événement AssumeRole, AssumeRoleWithSAML ou AssumeRoleWithWebIdentity qui a renvoyé la clé identifie qui a demandé la session. L'équipe sait alors si la source est le système CI/CD, un opérateur fédéré ou l'instance."
  options:
    b:
      en: "Temporary STS credentials are not attached to an IAM user and cannot be viewed or managed in the console."
      fr: "Les informations d'identification STS temporaires ne sont pas rattachées à un utilisateur IAM et ne peuvent être ni consultées ni gérées dans la console."
    c:
      en: "The credential report lists the long-term credentials of IAM users, not temporary role credentials."
      fr: "Le rapport d'informations d'identification liste les informations d'identification à long terme des utilisateurs IAM, et non les informations d'identification temporaires des rôles."
    d:
      en: "Access Advisor shows when the role last accessed each service, not which principal assumed a given session."
      fr: "Access Advisor indique quand le rôle a accédé pour la dernière fois à chaque service, et non quel principal a assumé une session donnée."
references:
  - title: "Remediating potentially compromised AWS credentials - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/compromised-creds.html
