id: scsc03-2a-guardduty-org-all-regions
objective: "2.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany has 120 accounts in AWS Organizations and operates in four AWS Regions. The security team wants Amazon GuardDuty to be enabled and centrally managed from a security tooling account for all existing and future member accounts in every Region in use, before any incident occurs.

    Which combination of steps will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |-
    AnyCompany dispose de 120 comptes dans AWS Organizations et opère dans quatre Régions AWS. L'équipe de sécurité veut qu'Amazon GuardDuty soit activé et géré de manière centralisée depuis un compte d'outillage de sécurité pour tous les comptes membres existants et futurs dans chaque Région utilisée, avant tout incident.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Designate the management account of the organization as the delegated GuardDuty administrator account so that it can enable GuardDuty everywhere.
        fr: |-
          Désigner le compte de gestion de l'organisation comme compte d'administrateur GuardDuty délégué afin qu'il puisse activer GuardDuty partout.
    - id: b
      text:
        en: |-
          Send GuardDuty invitations from the security tooling account to each member account, and accept them in every member account and Region.
        fr: |-
          Envoyer des invitations GuardDuty depuis le compte d'outillage de sécurité à chaque compte membre, et les accepter dans chaque compte membre et chaque Région.
    - id: c
      text:
        en: |-
          Designate the security tooling account as the delegated GuardDuty administrator account in each of the four Regions.
        fr: |-
          Désigner le compte d'outillage de sécurité comme compte d'administrateur GuardDuty délégué dans chacune des quatre Régions.
    - id: d
      text:
        en: |-
          Set the auto-enable configuration of the organization to NEW in each Region so that GuardDuty is enabled for the member accounts.
        fr: |-
          Définir la configuration d'activation automatique de l'organisation sur NEW dans chaque Région afin que GuardDuty soit activé pour les comptes membres.
    - id: e
      text:
        en: |-
          Set the auto-enable configuration of the organization to ALL in each Region so that existing and new member accounts are covered.
        fr: |-
          Définir la configuration d'activation automatique de l'organisation sur ALL dans chaque Région afin que les comptes membres existants et nouveaux soient couverts.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      GuardDuty is a Regional service: a delegated administrator designated in one Region manages member accounts only in that Region, and the same account must be designated in every Region where GuardDuty is used. The ALL auto-enable setting covers existing and new member accounts, whereas NEW applies only to accounts that join after the setting is configured.
    fr: |-
      GuardDuty est un service régional : un administrateur délégué désigné dans une Région ne gère les comptes membres que dans cette Région, et le même compte doit être désigné dans chaque Région où GuardDuty est utilisé. Le paramètre d'activation automatique ALL couvre les comptes membres existants et nouveaux, alors que NEW ne s'applique qu'aux comptes qui rejoignent l'organisation après sa configuration.
  options:
    a:
      en: |-
        AWS does not recommend making the management account the delegated GuardDuty administrator, and the requirement names the security tooling account.
      fr: |-
        AWS ne recommande pas de faire du compte de gestion l'administrateur GuardDuty délégué, et l'exigence désigne le compte d'outillage de sécurité.
    b:
      en: |-
        Invitations must be accepted account by account and do not cover future accounts automatically.
      fr: |-
        Les invitations doivent être acceptées compte par compte et ne couvrent pas automatiquement les futurs comptes.
    d:
      en: |-
        NEW leaves the existing member accounts without GuardDuty.
      fr: |-
        NEW laisse les comptes membres existants sans GuardDuty.
references:
  - title: "Managing GuardDuty accounts with AWS Organizations - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_organizations.html
