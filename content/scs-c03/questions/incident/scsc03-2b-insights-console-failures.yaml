id: scsc03-2b-insights-console-failures
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's organization trail also sends AWS CloudTrail events to an Amazon CloudWatch Logs log group. During a suspected password-spraying attack, the security team must identify the 10 source IP addresses that produced the most failed AWS Management Console sign-in attempts in the last 24 hours.

    Which CloudWatch Logs Insights query should the team run on the log group?
  fr: |
    Le journal de suivi d'organisation d'AnyCompany envoie aussi les événements AWS CloudTrail dans un groupe de journaux Amazon CloudWatch Logs. Pendant une attaque par pulvérisation de mots de passe (password spraying) présumée, l'équipe de sécurité doit identifier les 10 adresses IP sources qui ont produit le plus de tentatives de connexion à l'AWS Management Console échouées au cours des dernières 24 heures.

    Quelle requête CloudWatch Logs Insights l'équipe doit-elle exécuter sur le groupe de journaux ?
body:
  options:
    - id: a
      text: |-
        filter eventName = "ConsoleLogin"
        | stats count(*) as attempts by sourceIPAddress
        | sort attempts desc
        | limit 10
    - id: b
      text: |-
        filter eventName = "ConsoleLogin" and responseElements.ConsoleLogin = "Failure"
        | stats count(*) as attempts by sourceIPAddress
        | sort attempts desc
        | limit 10
    - id: c
      text: |-
        filter eventName = "ConsoleLogin" and responseElements.ConsoleLogin = "Failure"
        | fields @timestamp, sourceIPAddress
        | sort @timestamp desc
        | limit 10
    - id: d
      text: |-
        stats count(*) as attempts by sourceIPAddress
        | filter eventName = "ConsoleLogin" and responseElements.ConsoleLogin = "Failure"
        | sort attempts desc
        | limit 10
answer: { optionId: b }
explanation:
  correct:
    en: "ConsoleLogin events record the outcome of the sign-in in responseElements.ConsoleLogin, with the value Failure for a failed attempt. The query first keeps only failed sign-ins, then counts them per sourceIPAddress, sorts the counts in descending order, and keeps the top 10. The 24-hour window is the time range selected for the query."
    fr: "Les événements ConsoleLogin enregistrent le résultat de la connexion dans responseElements.ConsoleLogin, avec la valeur Failure pour une tentative échouée. La requête ne garde d'abord que les connexions échouées, puis les compte par sourceIPAddress, trie les totaux par ordre décroissant et garde les 10 premiers. La fenêtre de 24 heures est la plage de temps choisie pour la requête."
  options:
    a:
      en: "Without the filter on responseElements.ConsoleLogin, the counts mix successful and failed sign-ins."
      fr: "Sans le filtre sur responseElements.ConsoleLogin, les totaux mélangent connexions réussies et échouées."
    c:
      en: "This query returns the 10 most recent failed events, not a count per IP address, so it does not rank the sources."
      fr: "Cette requête renvoie les 10 événements échoués les plus récents, et non un total par adresse IP : elle ne classe pas les sources."
    d:
      en: "After stats, only the aggregated fields exist, so the later filter on eventName and responseElements cannot select the failed sign-ins."
      fr: "Après stats, seuls les champs agrégés existent : le filtre placé ensuite sur eventName et responseElements ne peut pas sélectionner les connexions échouées."
references:
  - title: "CloudWatch Logs Insights language query syntax - Amazon CloudWatch Logs"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax.html
