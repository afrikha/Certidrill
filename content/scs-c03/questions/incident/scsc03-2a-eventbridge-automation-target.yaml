id: scsc03-2a-eventbridge-automation-target
objective: "2.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany wants an Amazon EventBridge rule that starts a custom AWS Systems Manager Automation runbook named IR-Isolate directly as the rule target, without an AWS Lambda function, for each Amazon GuardDuty finding of the type CryptoCurrency:EC2/BitcoinTool.B!DNS. IR-Isolate has an InstanceId parameter and an AutomationAssumeRole parameter, and it changes the security groups of the instance through EC2 API calls. The runbook must receive the ID of the affected instance from the finding.

    Which configurations are required? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |-
    AnyCompany veut une règle Amazon EventBridge qui démarre directement comme cible un runbook AWS Systems Manager Automation personnalisé nommé IR-Isolate, sans fonction AWS Lambda, pour chaque résultat Amazon GuardDuty du type CryptoCurrency:EC2/BitcoinTool.B!DNS. IR-Isolate possède un paramètre InstanceId et un paramètre AutomationAssumeRole, et il modifie les groupes de sécurité de l'instance au moyen d'appels d'API EC2. Le runbook doit recevoir l'ID de l'instance concernée à partir du résultat.

    Quelles configurations sont nécessaires ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          An input transformer that maps $.detail.resource.instanceDetails.instanceId to the InstanceId parameter of the runbook.
        fr: |-
          Un transformateur d'entrée qui mappe $.detail.resource.instanceDetails.instanceId vers le paramètre InstanceId du runbook.
    - id: b
      text:
        en: |-
          A resource-based policy on the runbook that allows events.amazonaws.com to call ssm:StartAutomationExecution.
        fr: |-
          Une politique basée sur les ressources sur le runbook qui autorise events.amazonaws.com à appeler ssm:StartAutomationExecution.
    - id: c
      text:
        en: |-
          An IAM role for the rule target that allows ssm:StartAutomationExecution on the runbook and iam:PassRole for the AutomationAssumeRole.
        fr: |-
          Un rôle IAM pour la cible de la règle qui autorise ssm:StartAutomationExecution sur le runbook et iam:PassRole pour l'AutomationAssumeRole.
    - id: d
      text:
        en: |-
          The SSM Agent installed and running on the affected instance so that the runbook can change its security groups.
        fr: |-
          L'agent SSM installé et en cours d'exécution sur l'instance concernée afin que le runbook puisse modifier ses groupes de sécurité.
    - id: e
      text:
        en: |-
          A Security Hub CSPM custom action that forwards the GuardDuty finding to EventBridge so that the rule can match it.
        fr: |-
          Une action personnalisée Security Hub CSPM qui transmet le résultat GuardDuty à EventBridge afin que la règle puisse y correspondre.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The GuardDuty event carries the finding in its detail field, so an input transformer can extract the instance ID and pass it as the InstanceId parameter. EventBridge starts an Automation target with the IAM role of the target, which must allow starting the runbook and passing the runbook's AutomationAssumeRole.
    fr: |-
      L'événement GuardDuty transporte le résultat dans son champ detail : un transformateur d'entrée peut en extraire l'ID d'instance et le transmettre comme paramètre InstanceId. EventBridge démarre une cible Automation avec le rôle IAM de la cible, qui doit autoriser le démarrage du runbook et la transmission de l'AutomationAssumeRole du runbook.
  options:
    b:
      en: |-
        EventBridge uses the IAM role of the target to start Automation; the runbook needs no resource-based policy.
      fr: |-
        EventBridge utilise le rôle IAM de la cible pour démarrer Automation ; le runbook n'a besoin d'aucune politique basée sur les ressources.
    d:
      en: |-
        The runbook changes security groups through EC2 API calls, which do not use the agent on the instance.
      fr: |-
        Le runbook modifie les groupes de sécurité au moyen d'appels d'API EC2, qui n'utilisent pas l'agent de l'instance.
    e:
      en: |-
        GuardDuty publishes its findings to EventBridge automatically, so no forwarding is needed.
      fr: |-
        GuardDuty publie automatiquement ses résultats dans EventBridge : aucune transmission n'est nécessaire.
references:
  - title: "Processing GuardDuty findings with Amazon EventBridge - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_eventbridge.html
