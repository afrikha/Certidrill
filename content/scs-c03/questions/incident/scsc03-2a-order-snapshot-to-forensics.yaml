id: scsc03-2a-order-snapshot-to-forensics
objective: "2.2.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |-
    An Amazon EC2 instance in a workload account of AnyCompany is compromised. Its Amazon EBS volume is encrypted with the AWS managed key aws/ebs. Responders must get a copy of the data of the volume into the forensics account, encrypted with a customer managed key that the forensics account owns.

    Which four steps should the responders perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |-
    Une instance Amazon EC2 d'un compte de charge de travail d'AnyCompany est compromise. Son volume Amazon EBS est chiffré avec la clé gérée par AWS aws/ebs. Les intervenants doivent obtenir dans le compte d'investigation une copie des données du volume, chiffrée avec une clé gérée par le client qui appartient au compte d'investigation.

    Quelles sont les quatre étapes que les intervenants doivent effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: share
      text:
        en: |-
          In the workload account, modify the create volume permissions of the copied snapshot to share it with the forensics account.
        fr: |-
          Dans le compte de charge de travail, modifier les autorisations de création de volume de l'instantané copié pour le partager avec le compte d'investigation.
    - id: awskey
      text:
        en: |-
          Edit the key policy of aws/ebs so that the forensics account can use the key to decrypt the snapshot.
        fr: |-
          Modifier la politique de clé d'aws/ebs afin que le compte d'investigation puisse utiliser la clé pour déchiffrer l'instantané.
    - id: snap
      text:
        en: |-
          In the workload account, create a snapshot of the volume.
        fr: |-
          Dans le compte de charge de travail, créer un instantané du volume.
    - id: recopy
      text:
        en: |-
          In the forensics account, copy the shared snapshot and encrypt the copy with the customer managed key of the forensics account.
        fr: |-
          Dans le compte d'investigation, copier l'instantané partagé et chiffrer la copie avec la clé gérée par le client du compte d'investigation.
    - id: public
      text:
        en: |-
          Share the original snapshot publicly for a short time so that the forensics account can copy it.
        fr: |-
          Partager publiquement l'instantané d'origine pendant une courte durée afin que le compte d'investigation puisse le copier.
    - id: copycmk
      text:
        en: |-
          In the workload account, copy the snapshot and encrypt the copy with a customer managed key whose key policy allows the forensics account to use it.
        fr: |-
          Dans le compte de charge de travail, copier l'instantané et chiffrer la copie avec une clé gérée par le client dont la politique de clé autorise le compte d'investigation à l'utiliser.
answer:
  sequence: [snap, copycmk, share, recopy]
explanation:
  correct:
    en: |-
      Only snapshots encrypted with a customer managed key can be shared, and the key must be shared too, so the aws/ebs snapshot is first copied under a customer managed key whose key policy allows the forensics account. The copy is then shared through its create volume permissions, and the forensics account copies it again under its own key so that the evidence no longer depends on the workload account's key.
    fr: |-
      Seuls les instantanés chiffrés avec une clé gérée par le client peuvent être partagés, et la clé doit l'être aussi : l'instantané aws/ebs est d'abord copié sous une clé gérée par le client dont la politique de clé autorise le compte d'investigation. La copie est ensuite partagée au moyen de ses autorisations de création de volume, puis le compte d'investigation la copie de nouveau sous sa propre clé afin que les preuves ne dépendent plus de la clé du compte de charge de travail.
  options:
    awskey:
      en: |-
        The key policy of an AWS managed key cannot be edited, which is why a snapshot under aws/ebs cannot be shared directly.
      fr: |-
        La politique de clé d'une clé gérée par AWS ne peut pas être modifiée : c'est pourquoi un instantané sous aws/ebs ne peut pas être partagé directement.
    public:
      en: |-
        Only unencrypted snapshots can be shared publicly, and public sharing would expose the evidence to everyone.
      fr: |-
        Seuls les instantanés non chiffrés peuvent être partagés publiquement, et un partage public exposerait les preuves à tout le monde.
references:
  - title: "Share an Amazon EBS snapshot with other AWS accounts - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modifying-snapshot-permissions.html
  - title: "Share the KMS key used to encrypt a shared Amazon EBS snapshot - Amazon EBS"
    url: https://docs.aws.amazon.com/ebs/latest/userguide/share-kms-key.html
