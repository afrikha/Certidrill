id: scsc03-2b-rds-pitr-tampered
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An attacker modified rows in an Amazon RDS for MySQL DB instance at 14:05 today. Automated backups are enabled with a 7-day retention period. The security team must recover the data as it was at 14:00 and must keep the tampered DB instance unchanged for the forensic analysis.

    Which solution will meet these requirements?
  fr: |
    Un attaquant a modifié des lignes d'une instance de base de données Amazon RDS for MySQL aujourd'hui à 14 h 05. Les sauvegardes automatisées sont activées avec une période de rétention de 7 jours. L'équipe de sécurité doit récupérer les données telles qu'elles étaient à 14 h 00 et doit conserver inchangée l'instance de base de données altérée pour l'analyse forensique.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Restore the most recent automated snapshot onto the existing DB instance, and then replay the binary logs up to 14:00.", fr: "Restaurer l'instantané automatisé le plus récent sur l'instance de base de données existante, puis rejouer les journaux binaires jusqu'à 14 h 00." }
    - id: b
      text: { en: "Restore the DB instance to a point in time of 14:00, which creates a new DB instance, and point the application to the new instance.", fr: "Restaurer l'instance de base de données à un point dans le temps de 14 h 00, ce qui crée une nouvelle instance, et faire pointer l'application vers la nouvelle instance." }
    - id: c
      text: { en: "Promote the DB instance's read replica to a standalone DB instance, and point the application to it.", fr: "Promouvoir le réplica en lecture de l'instance en instance de base de données autonome, et y faire pointer l'application." }
    - id: d
      text: { en: "Reboot the Multi-AZ DB instance with failover so that the standby becomes the primary.", fr: "Redémarrer l'instance de base de données Multi-AZ avec basculement pour que l'instance de secours devienne l'instance principale." }
answer: { optionId: b }
explanation:
  correct:
    en: "Point-in-time restore uses the automated backups and transaction logs to create a new DB instance at any time within the retention period, without modifying the source DB instance. The tampered instance therefore stays available for analysis while the application moves to the restored copy."
    fr: "La restauration à un point dans le temps utilise les sauvegardes automatisées et les journaux de transactions pour créer une nouvelle instance de base de données à n'importe quel moment de la période de rétention, sans modifier l'instance source. L'instance altérée reste donc disponible pour l'analyse pendant que l'application passe sur la copie restaurée."
  options:
    a:
      en: "RDS restores always create a new DB instance; a snapshot cannot be restored onto the existing instance, and doing so would destroy the evidence."
      fr: "Les restaurations RDS créent toujours une nouvelle instance de base de données ; un instantané ne peut pas être restauré sur l'instance existante, et le faire détruirait les preuves."
    c:
      en: "The read replica received the attacker's changes through replication, so it contains the tampered rows."
      fr: "Le réplica en lecture a reçu les modifications de l'attaquant par réplication : il contient les lignes altérées."
    d:
      en: "The standby is synchronously replicated, so it holds the same tampered data as the primary."
      fr: "L'instance de secours est répliquée de manière synchrone : elle contient les mêmes données altérées que l'instance principale."
references:
  - title: "Restoring a DB instance to a specified time for Amazon RDS - Amazon Relational Database Service"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html
