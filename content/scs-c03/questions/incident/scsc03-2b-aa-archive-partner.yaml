id: scsc03-2b-aa-archive-partner
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an IAM Access Analyzer external access analyzer with the organization as its zone of trust. The analyzer reports active findings for Amazon S3 buckets and AWS KMS keys whose policies grant access to the partner account 444455556666. The security team validated with the data owners that this access is part of an approved data exchange, and more resources will be shared with the partner later. The team wants the existing and future findings for this partner to be archived automatically, while findings that report public access must stay active.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'un analyseur d'accès externe IAM Access Analyzer dont la zone de confiance est l'organisation. L'analyseur signale des résultats actifs pour des compartiments Amazon S3 et des clés AWS KMS dont les politiques accordent l'accès au compte partenaire 444455556666. L'équipe de sécurité a validé avec les propriétaires des données que cet accès fait partie d'un échange de données approuvé, et d'autres ressources seront partagées avec le partenaire plus tard. L'équipe veut que les résultats existants et futurs pour ce partenaire soient archivés automatiquement, tandis que les résultats qui signalent un accès public doivent rester actifs.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Invite the partner account into the organization so that it becomes part of the analyzer's zone of trust.", fr: "Inviter le compte partenaire dans l'organisation pour qu'il fasse partie de la zone de confiance de l'analyseur." }
    - id: b
      text: { en: "Create a second external access analyzer with the partner account as its zone of trust, and delete the organization analyzer.", fr: "Créer un second analyseur d'accès externe dont la zone de confiance est le compte partenaire, et supprimer l'analyseur d'organisation." }
    - id: c
      text: { en: "Archive each active finding for the partner in the IAM Access Analyzer console, and repeat this when new resources are shared.", fr: "Archiver chaque résultat actif du partenaire dans la console IAM Access Analyzer, et recommencer quand de nouvelles ressources sont partagées." }
    - id: d
      text: { en: "Create an archive rule that matches the partner's AWS account ID with Public access set to false, and choose Create and archive active findings.", fr: "Créer une règle d'archivage qui correspond à l'ID de compte AWS du partenaire avec Public access à false, et choisir Create and archive active findings." }
answer: { optionId: d }
explanation:
  correct:
    en: "An archive rule automatically archives new findings that match its criteria, and the Create and archive active findings choice also applies it to the existing findings. Adding the Public access criterion set to false keeps any new public access finding active, even for a resource that is also shared with the partner."
    fr: "Une règle d'archivage archive automatiquement les nouveaux résultats qui correspondent à ses critères, et le choix Create and archive active findings l'applique aussi aux résultats existants. Ajouter le critère Public access à false laisse actif tout nouveau résultat d'accès public, même pour une ressource également partagée avec le partenaire."
  options:
    a:
      en: "Making an external partner a member of the organization to silence findings grants it organization-wide trust, such as aws:PrincipalOrgID access, which the approval does not cover."
      fr: "Faire entrer un partenaire externe dans l'organisation pour faire taire des résultats lui accorde la confiance de toute l'organisation, par exemple les accès fondés sur aws:PrincipalOrgID, ce que l'approbation ne couvre pas."
    b:
      en: "A zone of trust is an account or an organization that you own; an analyzer for one account would report access from all other organization accounts as external."
      fr: "Une zone de confiance est un compte ou une organisation qui vous appartient ; un analyseur limité à un compte signalerait comme externe l'accès de tous les autres comptes de l'organisation."
    c:
      en: "Manual archiving handles only the current findings; each newly shared resource creates a new active finding."
      fr: "L'archivage manuel ne traite que les résultats actuels ; chaque ressource nouvellement partagée crée un nouveau résultat actif."
references:
  - title: "Archive rules - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-archive-rules.html
