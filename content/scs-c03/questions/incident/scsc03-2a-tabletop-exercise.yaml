id: scsc03-2a-tabletop-exercise
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany has written a new incident response plan for ransomware. Before running any technical test, the security team wants to validate the communication paths, the escalation steps, and the decisions of each stakeholder, including the legal and public relations teams. The validation must not use tools or touch any environment.

    Which type of exercise should the team run?
  fr: |-
    AnyCompany a rédigé un nouveau plan de réponse aux incidents pour les rançongiciels. Avant d'exécuter tout test technique, l'équipe de sécurité veut valider les circuits de communication, les étapes d'escalade et les décisions de chaque partie prenante, y compris les équipes juridique et relations publiques. La validation ne doit utiliser aucun outil ni toucher aucun environnement.

    Quel type d'exercice l'équipe doit-elle mener ?
body:
  options:
    - id: a
      text:
        en: |-
          A red team exercise in which penetration testers pursue defined objectives without informing the defenders of the scope.
        fr: |-
          Un exercice red team dans lequel des testeurs d'intrusion poursuivent des objectifs définis sans informer les défenseurs de l'étendue.
    - id: b
      text:
        en: |-
          A purple team exercise in which the SOC works with penetration testers to test the detection tools and SOPs.
        fr: |-
          Un exercice purple team dans lequel le SOC travaille avec des testeurs d'intrusion pour tester les outils de détection et les SOP.
    - id: c
      text:
        en: |-
          A tabletop exercise in which the stakeholders discuss a realistic ransomware scenario step by step.
        fr: |-
          Un exercice sur table (tabletop) dans lequel les parties prenantes discutent pas à pas d'un scénario réaliste de rançongiciel.
    - id: d
      text:
        en: |-
          An AWS FIS experiment that stops the instances of a staging environment to simulate the impact of the attack.
        fr: |-
          Une expérience AWS FIS qui arrête les instances d'un environnement de préproduction pour simuler l'impact de l'attaque.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A tabletop exercise is a discussion-based session with the incident response stakeholders that generally uses no tools or scripts. It focuses on processes, people, and collaboration, which is what the team wants to validate before technical tests.
    fr: |-
      Un exercice sur table est une séance de discussion avec les parties prenantes de la réponse aux incidents qui n'utilise généralement ni outils ni scripts. Il porte sur les processus, les personnes et la collaboration, ce que l'équipe veut valider avant les tests techniques.
  options:
    a:
      en: |-
        A red team exercise is an invasive technical test of the environment, not a discussion of communication and decisions.
      fr: |-
        Un exercice red team est un test technique invasif de l'environnement, pas une discussion des communications et des décisions.
    b:
      en: |-
        A purple team exercise tests detection mechanisms, tools, and SOPs with offensive activity in the environment.
      fr: |-
        Un exercice purple team teste les mécanismes de détection, les outils et les SOP avec une activité offensive dans l'environnement.
    d:
      en: |-
        An FIS experiment acts on resources, which the validation must not do.
      fr: |-
        Une expérience FIS agit sur des ressources, ce que la validation ne doit pas faire.
references:
  - title: "SEC10-BP07 Run simulations - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/sec_incident_response_run_game_days.html
