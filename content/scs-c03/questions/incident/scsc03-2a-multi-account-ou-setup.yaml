id: scsc03-2a-multi-account-ou-setup
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany uses AWS Organizations. The incident response team wants to run AWS Systems Manager Automation runbooks from a security tooling account against resources in every account of two organizational units (OUs), in several AWS Regions, by specifying the OUs as targets. The team has already created the AWS-SystemsManager-AutomationAdministrationRole in the security tooling account.

    Which additional steps must the team perform? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |-
    AnyCompany utilise AWS Organizations. L'équipe de réponse aux incidents veut exécuter des runbooks AWS Systems Manager Automation depuis un compte d'outillage de sécurité sur les ressources de tous les comptes de deux unités d'organisation (UO), dans plusieurs Régions AWS, en spécifiant les UO comme cibles. L'équipe a déjà créé le rôle AWS-SystemsManager-AutomationAdministrationRole dans le compte d'outillage de sécurité.

    Quelles étapes supplémentaires l'équipe doit-elle effectuer ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create the AWS-SystemsManager-AutomationAdministrationRole in every member account of the two OUs.
        fr: |-
          Créer le rôle AWS-SystemsManager-AutomationAdministrationRole dans chaque compte membre des deux UO.
    - id: b
      text:
        en: |-
          From the management account, register the security tooling account as a delegated administrator for ssm.amazonaws.com.
        fr: |-
          Depuis le compte de gestion, enregistrer le compte d'outillage de sécurité comme administrateur délégué pour ssm.amazonaws.com.
    - id: c
      text:
        en: |-
          Attach a service control policy (SCP) to the two OUs that allows ssm:StartAutomationExecution from the security tooling account.
        fr: |-
          Attacher aux deux UO une politique de contrôle des services (SCP) qui autorise ssm:StartAutomationExecution depuis le compte d'outillage de sécurité.
    - id: d
      text:
        en: |-
          Enable AWS Config in every target account and Region so that Automation can resolve the tagged target resources.
        fr: |-
          Activer AWS Config dans chaque compte et chaque Région cibles afin qu'Automation puisse résoudre les ressources cibles étiquetées.
    - id: e
      text:
        en: |-
          Deploy the AWS-SystemsManager-AutomationExecutionRole to every account of the two OUs, for example with AWS CloudFormation StackSets.
        fr: |-
          Déployer le rôle AWS-SystemsManager-AutomationExecutionRole dans chaque compte des deux UO, par exemple avec AWS CloudFormation StackSets.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      To target OUs, the central account must be able to list the accounts of the OUs, which only the management account or a delegated administrator for Systems Manager can do; AWS recommends a delegated administrator. Each target account also needs the AWS-SystemsManager-AutomationExecutionRole, which StackSets can deploy across the OUs.
    fr: |-
      Pour cibler des UO, le compte central doit pouvoir lister les comptes des UO, ce que seuls le compte de gestion ou un administrateur délégué de Systems Manager peuvent faire ; AWS recommande un administrateur délégué. Chaque compte cible a aussi besoin du rôle AWS-SystemsManager-AutomationExecutionRole, que StackSets peut déployer dans les UO.
  options:
    a:
      en: |-
        The administration role exists only in the central account; target accounts need the execution role.
      fr: |-
        Le rôle d'administration n'existe que dans le compte central ; les comptes cibles ont besoin du rôle d'exécution.
    c:
      en: |-
        SCPs only limit the maximum permissions of accounts; they never grant a permission.
      fr: |-
        Les SCP ne font que limiter les autorisations maximales des comptes ; elles n'accordent jamais d'autorisation.
    d:
      en: |-
        Automation resolves targets by tag, resource group or parameter values without AWS Config.
      fr: |-
        Automation résout les cibles par étiquette, groupe de ressources ou valeurs de paramètres sans AWS Config.
references:
  - title: "Running automations in multiple AWS Regions and accounts - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-automations-multiple-accounts-regions.html
