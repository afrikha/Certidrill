id: scsc03-2a-config-service-linked-rule
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany enabled AWS Security Hub CSPM, which created service-linked AWS Config rules for its security controls. The security team wants to configure automatic remediation with an Automation runbook on one of these rules, but AWS Config does not allow a remediation action on it. The team still wants AWS Config to remediate the noncompliant resources of that control automatically.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany a activé AWS Security Hub CSPM, qui a créé des règles AWS Config liées au service pour ses contrôles de sécurité. L'équipe de sécurité veut configurer une correction automatique avec un runbook Automation sur l'une de ces règles, mais AWS Config n'autorise pas d'action de correction sur celle-ci. L'équipe veut tout de même qu'AWS Config corrige automatiquement les ressources non conformes de ce contrôle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Update the service-linked rule with the PutConfigRule API, and add the Automation runbook as its remediation action.
        fr: |-
          Mettre à jour la règle liée au service avec l'API PutConfigRule, et ajouter le runbook Automation comme action de correction.
    - id: b
      text:
        en: |-
          Create a Config rule in the account that checks the same condition, such as the matching managed rule, and configure automatic remediation on it.
        fr: |-
          Créer dans le compte une règle Config qui vérifie la même condition, par exemple la règle gérée correspondante, et y configurer la correction automatique.
    - id: c
      text:
        en: |-
          Disable the control in Security Hub CSPM so that its service-linked rule becomes a rule of the account that accepts a remediation action.
        fr: |-
          Désactiver le contrôle dans Security Hub CSPM afin que sa règle liée au service devienne une règle du compte qui accepte une action de correction.
    - id: d
      text:
        en: |-
          Configure the remediation on the service-linked rule from the AWS Config delegated administrator account instead of the member account.
        fr: |-
          Configurer la correction sur la règle liée au service depuis le compte d'administrateur délégué AWS Config plutôt que depuis le compte membre.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Config manages remediations only for rules that are not service-linked. A rule that the account creates, such as the AWS managed rule that checks the same setting, can have an automatic remediation with an Automation runbook, while the Security Hub CSPM control keeps its own service-linked rule.
    fr: |-
      AWS Config ne gère les corrections que pour les règles qui ne sont pas liées à un service. Une règle créée par le compte, par exemple la règle gérée par AWS qui vérifie le même paramètre, peut avoir une correction automatique avec un runbook Automation, tandis que le contrôle Security Hub CSPM conserve sa propre règle liée au service.
  options:
    a:
      en: |-
        Service-linked rules are managed by the service that created them and cannot be given a remediation configuration.
      fr: |-
        Les règles liées à un service sont gérées par le service qui les a créées et ne peuvent pas recevoir de configuration de correction.
    c:
      en: |-
        Disabling the control stops its evaluation; it does not convert the service-linked rule into a rule that accepts remediation.
      fr: |-
        Désactiver le contrôle arrête son évaluation ; cela ne convertit pas la règle liée au service en règle qui accepte une correction.
    d:
      en: |-
        The limitation applies to the rule type, whatever account configures the remediation.
      fr: |-
        La limitation s'applique au type de règle, quel que soit le compte qui configure la correction.
references:
  - title: "Setting Up Auto Remediation for AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
  - title: "Remediating Noncompliant Resources with AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/remediation.html
