id: scsc03-2b-match-log-sources
objective: "2.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's security team investigates an incident and has five questions to answer.

    Match each question with the log source that answers it.

    To answer, drag the appropriate log source to each question. Each log source may be used once or not at all.
  fr: |
    L'équipe de sécurité d'AnyCompany enquête sur un incident et doit répondre à cinq questions.

    Associez chaque question à la source de journaux qui y répond.

    Pour répondre, faites glisser la source de journaux appropriée vers chaque question. Chaque source de journaux peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: r53, text: { en: "Route 53 Resolver query logs", fr: "Journaux de requêtes du résolveur Route 53" } }
    - { id: waf, text: { en: "AWS WAF logs", fr: "Journaux AWS WAF" } }
    - { id: ct, text: { en: "AWS CloudTrail management events", fr: "Événements de gestion AWS CloudTrail" } }
    - { id: vpc, text: { en: "Amazon VPC Flow Logs", fr: "Journaux de flux Amazon VPC" } }
    - { id: eks, text: { en: "Amazon EKS audit logs", fr: "Journaux d'audit Amazon EKS" } }
    - { id: alb, text: { en: "Application Load Balancer access logs", fr: "Journaux d'accès de l'Application Load Balancer" } }
    - { id: sal, text: { en: "Amazon S3 server access logs", fr: "Journaux d'accès au serveur Amazon S3" } }
  targets:
    - id: t1
      text: { en: "Which domain names did an EC2 instance resolve through the Amazon-provided DNS?", fr: "Quels noms de domaine une instance EC2 a-t-elle résolus par le DNS fourni par Amazon ?" }
    - id: t2
      text: { en: "Which web ACL rule terminated a blocked HTTP request?", fr: "Quelle règle de la liste ACL web a mis fin à une requête HTTP bloquée ?" }
    - id: t3
      text: { en: "Which IAM role called TerminateInstances on a production instance?", fr: "Quel rôle IAM a appelé TerminateInstances sur une instance de production ?" }
    - id: t4
      text: { en: "Which remote IP addresses and ports exchanged traffic with a network interface, and was the traffic accepted or rejected?", fr: "Quelles adresses IP et quels ports distants ont échangé du trafic avec une interface réseau, et ce trafic a-t-il été accepté ou rejeté ?" }
    - id: t5
      text: { en: "Which user deleted a Kubernetes Deployment in a cluster?", fr: "Quel utilisateur a supprimé un Deployment Kubernetes dans un cluster ?" }
answer:
  mapping: { t1: r53, t2: waf, t3: ct, t4: vpc, t5: eks }
explanation:
  correct:
    en: "Resolver query logs record each DNS query with its name and the instance that sent it. AWS WAF logs record the terminating rule of each request. CloudTrail management events record control plane API calls such as TerminateInstances with the calling identity. VPC flow logs record addresses, ports, and the ACCEPT or REJECT action of traffic on an interface. EKS audit logs record which user performed each Kubernetes API action."
    fr: "Les journaux de requêtes du résolveur enregistrent chaque requête DNS avec son nom et l'instance qui l'a envoyée. Les journaux AWS WAF enregistrent la règle qui a mis fin à chaque requête. Les événements de gestion CloudTrail enregistrent les appels d'API du plan de contrôle, comme TerminateInstances, avec l'identité appelante. Les journaux de flux VPC enregistrent les adresses, les ports et l'action ACCEPT ou REJECT du trafic d'une interface. Les journaux d'audit EKS enregistrent l'utilisateur qui a effectué chaque action de l'API Kubernetes."
  options:
    alb:
      en: "ALB access logs show that AWS WAF acted on a request (the waf action) but not which rule terminated it."
      fr: "Les journaux d'accès de l'ALB montrent qu'AWS WAF a traité une requête (action waf), mais pas quelle règle y a mis fin."
    sal:
      en: "S3 server access logs record requests to S3 buckets, which none of the questions is about."
      fr: "Les journaux d'accès au serveur S3 enregistrent les requêtes adressées aux compartiments S3, ce qui ne concerne aucune des questions."
references:
  - title: "Values that appear in VPC Resolver query logs - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs-format.html
  - title: "Log fields for protection pack (web ACL) traffic - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/logging-fields.html
