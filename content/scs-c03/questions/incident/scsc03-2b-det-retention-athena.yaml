id: scsc03-2b-det-retention-athena
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    During a root cause analysis, the security team learns that the attacker first used the IAM role ReportsRole 15 months ago. Amazon Detective has been enabled for 2 years. Amazon GuardDuty has been enabled for the same period. An organization trail has delivered AWS CloudTrail logs for all accounts to an Amazon S3 bucket with a 7-year retention, and an Amazon Athena table exists for those logs. The team must review every API call that ReportsRole made during that month.

    Which solution will meet these requirements?
  fr: |
    Pendant une analyse des causes racines, l'équipe de sécurité apprend que l'attaquant a utilisé pour la première fois le rôle IAM ReportsRole il y a 15 mois. Amazon Detective est activé depuis 2 ans. Amazon GuardDuty est activé depuis la même durée. Un journal de suivi d'organisation livre les journaux AWS CloudTrail de tous les comptes dans un compartiment Amazon S3 avec une rétention de 7 ans, et une table Amazon Athena existe pour ces journaux. L'équipe doit examiner tous les appels d'API effectués par ReportsRole pendant ce mois.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the scope time of the role's profile in Detective to that month, and review the API call volume panels.", fr: "Régler la période d'analyse (scope time) du profil du rôle dans Detective sur ce mois, et examiner les panneaux de volume d'appels d'API." }
    - id: b
      text: { en: "Search the CloudTrail Event history of each account for that month, with the role name as the user name attribute.", fr: "Rechercher dans l'historique des événements CloudTrail de chaque compte pour ce mois, avec le nom du rôle comme attribut de nom d'utilisateur." }
    - id: c
      text: { en: "Filter the GuardDuty findings of that month on the role name, and review the API calls listed in the findings.", fr: "Filtrer sur le nom du rôle les résultats GuardDuty de ce mois, et examiner les appels d'API listés dans les résultats." }
    - id: d
      text: { en: "Query the Athena table of the organization trail for the events of that month whose session issuer is ReportsRole.", fr: "Interroger la table Athena du journal de suivi d'organisation pour les événements de ce mois dont l'émetteur de session est ReportsRole." }
answer: { optionId: d }
explanation:
  correct:
    en: "The organization trail keeps the CloudTrail log files in Amazon S3 for 7 years, so an Athena query on the events whose userIdentity.sessionContext.sessionIssuer is ReportsRole returns every API call that the role made 15 months ago, in every account and Region."
    fr: "Le journal de suivi d'organisation conserve les fichiers journaux CloudTrail dans Amazon S3 pendant 7 ans : une requête Athena sur les événements dont userIdentity.sessionContext.sessionIssuer est ReportsRole renvoie tous les appels d'API effectués par le rôle il y a 15 mois, dans tous les comptes et toutes les Régions."
  options:
    a:
      en: "Detective retains data for up to 1 year, so its profiles no longer contain activity from 15 months ago."
      fr: "Detective conserve les données jusqu'à 1 an : ses profils ne contiennent plus l'activité d'il y a 15 mois."
    b:
      en: "Event history covers only the last 90 days, one Region at a time."
      fr: "L'historique des événements ne couvre que les 90 derniers jours, une Région à la fois."
    c:
      en: "GuardDuty keeps findings for 90 days, and findings describe suspicious activity, not every API call of the role."
      fr: "GuardDuty conserve les résultats pendant 90 jours, et les résultats décrivent une activité suspecte, et non tous les appels d'API du rôle."
references:
  - title: "Source data used in a Detective behavior graph - Amazon Detective"
    url: https://docs.aws.amazon.com/detective/latest/userguide/detective-source-data-about.html
  - title: "Working with CloudTrail event history - AWS CloudTrail"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
