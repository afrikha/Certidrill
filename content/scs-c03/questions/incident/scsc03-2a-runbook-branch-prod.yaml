id: scsc03-2a-runbook-branch-prod
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany's custom AWS Systems Manager Automation runbook isolates an Amazon EC2 instance. An aws:executeAwsApi step reads the value of the instance's Environment tag. If the value is prod, the runbook must wait for a security manager's approval before it isolates the instance. For any other value, the runbook must isolate the instance immediately, and the run must succeed.

    Which step should the team add after the aws:executeAwsApi step?
  fr: |-
    Le runbook AWS Systems Manager Automation personnalisé d'AnyCompany isole une instance Amazon EC2. Une étape aws:executeAwsApi lit la valeur de l'étiquette Environment de l'instance. Si la valeur est prod, le runbook doit attendre l'approbation d'un responsable de la sécurité avant d'isoler l'instance. Pour toute autre valeur, le runbook doit isoler l'instance immédiatement, et l'exécution doit réussir.

    Quelle étape l'équipe doit-elle ajouter après l'étape aws:executeAwsApi ?
body:
  options:
    - id: a
      text:
        en: |-
          An aws:assertAwsResourceProperty step that checks that the Environment tag equals prod, followed by an aws:approve step and the isolation step.
        fr: |-
          Une étape aws:assertAwsResourceProperty qui vérifie que l'étiquette Environment est égale à prod, suivie d'une étape aws:approve et de l'étape d'isolation.
    - id: b
      text:
        en: |-
          An aws:branch step with a choice that sends the value prod to an aws:approve step and a default that goes directly to the isolation step.
        fr: |-
          Une étape aws:branch avec un choix qui envoie la valeur prod vers une étape aws:approve et une valeur par défaut qui mène directement à l'étape d'isolation.
    - id: c
      text:
        en: |-
          An aws:waitForAwsResourceProperty step that waits until the Environment tag equals prod, followed by an aws:approve step and the isolation step.
        fr: |-
          Une étape aws:waitForAwsResourceProperty qui attend que l'étiquette Environment soit égale à prod, suivie d'une étape aws:approve et de l'étape d'isolation.
    - id: d
      text:
        en: |-
          An aws:sleep step that gives the security manager time to cancel the run of a prod instance before the isolation step starts.
        fr: |-
          Une étape aws:sleep qui laisse au responsable de la sécurité le temps d'annuler l'exécution pour une instance prod avant le début de l'étape d'isolation.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The aws:branch action evaluates its choices against a parameter or a previous step's output, such as the tag value, and jumps to the NextStep of the first true choice, or to the Default step when none is true. Prod instances therefore go through aws:approve, and the others go straight to isolation.
    fr: |-
      L'action aws:branch évalue ses choix sur un paramètre ou sur la sortie d'une étape précédente, comme la valeur de l'étiquette, et passe à l'étape NextStep du premier choix vrai, ou à l'étape Default si aucun n'est vrai. Les instances prod passent donc par aws:approve, et les autres vont directement à l'isolation.
  options:
    a:
      en: |-
        An assertion does not choose a path: the automation continues past it only when the value matches, so non-prod instances are not isolated by a successful run.
      fr: |-
        Une assertion ne choisit pas de chemin : l'automatisation ne la dépasse que lorsque la valeur correspond, si bien que les instances non prod ne sont pas isolées par une exécution réussie.
    c:
      en: |-
        For a non-prod instance the tag never becomes prod, so the step waits until it times out instead of isolating the instance.
      fr: |-
        Pour une instance non prod, l'étiquette ne devient jamais prod : l'étape attend jusqu'à expiration au lieu d'isoler l'instance.
    d:
      en: |-
        A delay is not an approval: the instance is isolated after the delay even if nobody approves.
      fr: |-
        Un délai n'est pas une approbation : l'instance est isolée après le délai même si personne n'approuve.
references:
  - title: "aws:branch – Run conditional automation steps - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-branch.html
  - title: "aws:approve – Pause an automation for manual approval - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-approve.html
