id: scsc03-2a-ops-shub-opsitems
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany uses AWS Security Hub CSPM with a delegated administrator account that aggregates findings from 40 member accounts. The incident response team wants every critical and high severity finding to become a work item that responders can track, that shows the related resources, and from which they can run AWS Systems Manager Automation runbooks. When a responder changes the status of a work item, the change must be reflected on the finding in Security Hub CSPM. The team wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany utilise AWS Security Hub CSPM avec un compte d'administrateur délégué qui agrège les résultats (findings) de 40 comptes membres. L'équipe de réponse aux incidents veut que chaque résultat de gravité critique ou élevée devienne un élément de travail que les intervenants peuvent suivre, qui affiche les ressources associées et à partir duquel ils peuvent exécuter des runbooks AWS Systems Manager Automation. Lorsqu'un intervenant modifie le statut d'un élément de travail, la modification doit être répercutée sur le résultat dans Security Hub CSPM. L'équipe veut la solution qui implique le MOINS de frais opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule in the administrator account that sends critical and high findings to an AWS Lambda function that opens a ticket with links to the runbooks.
        fr: |-
          Créer dans le compte d'administrateur une règle Amazon EventBridge qui envoie les résultats critiques et élevés à une fonction AWS Lambda qui ouvre un ticket contenant des liens vers les runbooks.
    - id: b
      text:
        en: |-
          In the administrator account, enable the Security Hub CSPM findings integration in the OpsCenter settings so that OpsItems are created for critical and high severity findings.
        fr: |-
          Dans le compte d'administrateur, activer l'intégration des résultats Security Hub CSPM dans les paramètres d'OpsCenter afin que des OpsItems soient créés pour les résultats de gravité critique et élevée.
    - id: c
      text:
        en: |-
          Create a Security Hub CSPM automation rule that sets the workflow status of critical and high findings to NOTIFIED and adds a note that lists the runbook names.
        fr: |-
          Créer une règle d'automatisation Security Hub CSPM qui définit le statut de flux de travail des résultats critiques et élevés sur NOTIFIED et ajoute une note qui liste les noms des runbooks.
    - id: d
      text:
        en: |-
          Configure Systems Manager Explorer to display Security Hub CSPM findings in a widget, and give the responders access to the Explorer dashboard.
        fr: |-
          Configurer Systems Manager Explorer pour afficher les résultats Security Hub CSPM dans un widget, et donner aux intervenants l'accès au tableau de bord Explorer.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When the Security Hub CSPM integration is enabled in the OpsCenter settings, Systems Manager creates an OpsItem for each critical and high severity finding by default, and enabling it from the Security Hub CSPM administrator account covers the administrator and all member accounts. Each OpsItem lists related resources and runbooks that responders can run, and changes to the Status or Severity of the OpsItem are synchronized with the finding.
    fr: |-
      Lorsque l'intégration Security Hub CSPM est activée dans les paramètres d'OpsCenter, Systems Manager crée par défaut un OpsItem pour chaque résultat de gravité critique ou élevée, et l'activation depuis le compte d'administrateur Security Hub CSPM couvre ce compte et tous les comptes membres. Chaque OpsItem liste les ressources associées et des runbooks que les intervenants peuvent exécuter, et les modifications du champ Status ou Severity de l'OpsItem sont synchronisées avec le résultat.
  options:
    a:
      en: |-
        The Lambda function is custom code to write and maintain, and the ticket neither runs runbooks nor updates the finding without more code.
      fr: |-
        La fonction Lambda est du code personnalisé à écrire et à maintenir, et le ticket n'exécute pas de runbooks et ne met pas à jour le résultat sans code supplémentaire.
    c:
      en: |-
        Automation rules only update fields of the findings; they do not create a work item with related resources from which runbooks can be run.
      fr: |-
        Les règles d'automatisation ne font que mettre à jour des champs des résultats ; elles ne créent pas d'élément de travail avec les ressources associées à partir duquel exécuter des runbooks.
    d:
      en: |-
        Explorer shows aggregated operational data in dashboards; it does not create a trackable item for each finding.
      fr: |-
        Explorer affiche des données opérationnelles agrégées dans des tableaux de bord ; il ne crée pas d'élément suivi pour chaque résultat.
references:
  - title: "Integrate OpsCenter with other AWS services - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-applications-that-integrate.html
  - title: "Remediate OpsItem issues - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-remediating.html
