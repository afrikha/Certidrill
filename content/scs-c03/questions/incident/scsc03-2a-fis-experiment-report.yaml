id: scsc03-2a-fis-experiment-report
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    Auditors ask AnyCompany for evidence of each resilience test that validates its incident response plan. For every AWS FIS experiment, the evidence must summarize the actions that ran and include graphs of the application's metrics before, during, and after the experiment. The evidence must be stored in Amazon S3 and must not be deleted or overwritten.

    Which solution will meet these requirements?
  fr: |-
    Des auditeurs demandent à AnyCompany une preuve de chaque test de résilience qui valide son plan de réponse aux incidents. Pour chaque expérience AWS FIS, la preuve doit résumer les actions exécutées et inclure des graphiques des métriques de l'application avant, pendant et après l'expérience. La preuve doit être stockée dans Amazon S3 et ne doit être ni supprimée ni écrasée.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Export the AWS CloudTrail events of the FIS API calls of each experiment to Amazon S3, and store screenshots of the CloudWatch dashboard with them.
        fr: |-
          Exporter vers Amazon S3 les événements AWS CloudTrail des appels d'API FIS de chaque expérience, et stocker avec eux des captures d'écran du tableau de bord CloudWatch.
    - id: b
      text:
        en: |-
          Enable FIS experiment logging to Amazon CloudWatch Logs, and create a subscription filter that copies the log events to an S3 bucket.
        fr: |-
          Activer la journalisation des expériences FIS vers Amazon CloudWatch Logs, et créer un filtre d'abonnement qui copie les événements de journal dans un compartiment S3.
    - id: c
      text:
        en: |-
          Run an AWS Resilience Hub assessment of the application after each experiment, and store the assessment results in an S3 bucket.
        fr: |-
          Exécuter une évaluation AWS Resilience Hub de l'application après chaque expérience, et stocker les résultats de l'évaluation dans un compartiment S3.
    - id: d
      text:
        en: |-
          Add an experiment report configuration with a CloudWatch dashboard and an S3 bucket to the template, and enable S3 Object Lock on the bucket.
        fr: |-
          Ajouter au modèle une configuration de rapport d'expérience avec un tableau de bord CloudWatch et un compartiment S3, et activer S3 Object Lock sur le compartiment.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An FIS experiment report is a PDF that summarizes the actions of the experiment and includes snapshot graphs of the widgets of a CloudWatch dashboard, annotated with the start and end of the experiment over configurable pre-experiment and post-experiment periods. The report is stored in an S3 bucket, and FIS recommends S3 Object Lock to prevent reports from being deleted or overwritten.
    fr: |-
      Un rapport d'expérience FIS est un PDF qui résume les actions de l'expérience et inclut des graphiques instantanés des widgets d'un tableau de bord CloudWatch, annotés avec le début et la fin de l'expérience sur des périodes configurables avant et après l'expérience. Le rapport est stocké dans un compartiment S3, et FIS recommande S3 Object Lock pour empêcher la suppression ou l'écrasement des rapports.
  options:
    a:
      en: |-
        API events and manual screenshots are not a summary of the experiment, and the screenshots depend on someone taking them.
      fr: |-
        Des événements d'API et des captures manuelles ne constituent pas un résumé de l'expérience, et les captures dépendent de quelqu'un qui les prend.
    b:
      en: |-
        Experiment logs record events for troubleshooting; they do not include metric graphs, and nothing protects the copies from deletion.
      fr: |-
        Les journaux d'expérience enregistrent des événements pour le dépannage ; ils n'incluent pas de graphiques de métriques, et rien ne protège les copies contre la suppression.
    c:
      en: |-
        An assessment evaluates the resilience posture against a policy; it does not report what an experiment did or how the metrics behaved.
      fr: |-
        Une évaluation mesure la posture de résilience par rapport à une politique ; elle ne rend pas compte de ce qu'a fait une expérience ni du comportement des métriques.
references:
  - title: "Experiment report configurations for AWS FIS - AWS Fault Injection Service"
    url: https://docs.aws.amazon.com/fis/latest/userguide/experiment-report-configuration.html
