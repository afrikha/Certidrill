id: scsc03-2b-ath-org-trail-projection
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 60 AWS accounts in AWS Organizations. An organization trail delivers AWS CloudTrail log files for all accounts and Regions to an Amazon S3 bucket in a log archive account, where the files are retained for 7 years. During investigations, security analysts must run SQL queries that span all accounts and Regions and cover the last 18 months of events. Log files must be queryable as soon as CloudTrail delivers them, without anyone running jobs or commands to load new partitions. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 60 comptes AWS dans AWS Organizations. Un journal de suivi d'organisation livre les fichiers journaux AWS CloudTrail de tous les comptes et de toutes les Régions dans un compartiment Amazon S3 d'un compte d'archivage des journaux, où ils sont conservés 7 ans. Pendant les enquêtes, les analystes de sécurité doivent exécuter des requêtes SQL qui couvrent tous les comptes et toutes les Régions sur les 18 derniers mois d'événements. Les fichiers journaux doivent pouvoir être interrogés dès que CloudTrail les livre, sans que personne n'exécute de tâche ni de commande pour charger de nouvelles partitions. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Have analysts search the CloudTrail Event history of each account and Region, and download the matching events to an S3 bucket for analysis.", fr: "Faire rechercher par les analystes dans l'historique des événements CloudTrail de chaque compte et de chaque Région, puis télécharger les événements correspondants dans un compartiment S3 pour les analyser." }
    - id: b
      text: { en: "Create an Amazon Athena table on the log bucket, and schedule an AWS Lambda function that runs ALTER TABLE ADD PARTITION every day for the new account, Region, and date prefixes.", fr: "Créer une table Amazon Athena sur le compartiment des journaux, et planifier une fonction AWS Lambda qui exécute chaque jour ALTER TABLE ADD PARTITION pour les nouveaux préfixes de compte, de Région et de date." }
    - id: c
      text: { en: "Create an Amazon Athena table on the log bucket with partition projection enabled for the account, Region, and date partition keys, and a storage location template that matches the trail's prefix layout.", fr: "Créer une table Amazon Athena sur le compartiment des journaux avec la projection de partitions activée pour les clés de partition de compte, de Région et de date, et un modèle d'emplacement de stockage qui correspond à l'organisation des préfixes du journal de suivi." }
    - id: d
      text: { en: "Create an AWS CloudTrail Lake event data store in the log archive account, import the existing trail logs into it, and run SQL queries in CloudTrail Lake.", fr: "Créer un magasin de données d'événements AWS CloudTrail Lake dans le compte d'archivage des journaux, y importer les journaux existants du journal de suivi, et exécuter les requêtes SQL dans CloudTrail Lake." }
answer: { optionId: c }
explanation:
  correct:
    en: "With partition projection, Athena calculates the partitions from the table properties instead of reading them from the catalog, so new CloudTrail prefixes are queryable as soon as files arrive and no ALTER TABLE ADD PARTITION is needed. Restricting queries to projected date ranges also keeps the amount of data scanned low. The table reads the logs where the organization trail already writes them, so there is nothing else to operate."
    fr: "Avec la projection de partitions, Athena calcule les partitions à partir des propriétés de la table au lieu de les lire dans le catalogue : les nouveaux préfixes CloudTrail sont interrogeables dès l'arrivée des fichiers et aucun ALTER TABLE ADD PARTITION n'est nécessaire. Limiter les requêtes aux plages de dates projetées réduit aussi le volume de données analysé. La table lit les journaux là où le journal de suivi d'organisation les écrit déjà : il n'y a rien d'autre à exploiter."
  options:
    a:
      en: "Event history keeps only 90 days of management events, and each search covers one account and one Region with a single attribute filter, so it cannot cover 18 months across 60 accounts."
      fr: "L'historique des événements ne conserve que 90 jours d'événements de gestion, et chaque recherche porte sur un seul compte et une seule Région avec un seul filtre d'attribut : il ne peut pas couvrir 18 mois sur 60 comptes."
    b:
      en: "A scheduled function that adds partitions is the manual partition management the company wants to avoid, and data delivered since the last run stays invisible until the next run."
      fr: "Une fonction planifiée qui ajoute des partitions est exactement la gestion manuelle des partitions que l'entreprise veut éviter, et les données livrées depuis la dernière exécution restent invisibles jusqu'à l'exécution suivante."
    d:
      en: "AWS CloudTrail Lake is closed to new customers since May 31, 2026, so it cannot be adopted for a new query solution."
      fr: "AWS CloudTrail Lake est fermé aux nouveaux clients depuis le 31 mai 2026 : il ne peut pas être adopté pour une nouvelle solution de requêtes."
references:
