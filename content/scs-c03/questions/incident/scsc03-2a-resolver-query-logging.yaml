id: scsc03-2a-resolver-query-logging
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany's responders are investigating an Amazon EC2 instance that might have contacted malicious domains. They need a record of the DNS queries that resources in the VPC send to the Route 53 Resolver, including the domain names and the responses, stored in Amazon S3 for later analysis.

    Which solution will meet these requirements?
  fr: |-
    Les intervenants d'AnyCompany enquêtent sur une instance Amazon EC2 qui pourrait avoir contacté des domaines malveillants. Ils ont besoin d'un enregistrement des requêtes DNS que les ressources du VPC envoient au résolveur Route 53, y compris les noms de domaine et les réponses, stocké dans Amazon S3 pour une analyse ultérieure.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Configure Route 53 Resolver query logging for the VPC with an S3 bucket as the destination.
        fr: |-
          Configurer la journalisation des requêtes du résolveur Route 53 pour le VPC avec un compartiment S3 comme destination.
    - id: b
      text:
        en: |-
          Create a VPC flow log for the VPC in the default format with an S3 bucket as the destination.
        fr: |-
          Créer un journal de flux VPC pour le VPC au format par défaut avec un compartiment S3 comme destination.
    - id: c
      text:
        en: |-
          Enable AWS CloudTrail data events for Route 53 in the organization trail of the company.
        fr: |-
          Activer les événements de données AWS CloudTrail pour Route 53 dans le journal de suivi d'organisation de l'entreprise.
    - id: d
      text:
        en: |-
          Enable query logging on the public hosted zones of the company's domain names.
        fr: |-
          Activer la journalisation des requêtes sur les zones hébergées publiques des noms de domaine de l'entreprise.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Resolver query logging records the DNS queries that originate in the specified VPCs and their responses, as well as queries through Resolver endpoints and DNS Firewall, and delivers them to CloudWatch Logs, Amazon S3, or Firehose. It logs unique queries, not those answered from the Resolver cache.
    fr: |-
      La journalisation des requêtes du résolveur enregistre les requêtes DNS émises dans les VPC spécifiés et leurs réponses, ainsi que les requêtes passant par les points de terminaison du résolveur et DNS Firewall, et les livre dans CloudWatch Logs, Amazon S3 ou Firehose. Elle journalise les requêtes uniques, pas celles auxquelles le cache du résolveur répond.
  options:
    b:
      en: |-
        Flow logs record IP traffic metadata; they contain no domain names or DNS responses.
      fr: |-
        Les journaux de flux enregistrent des métadonnées de trafic IP ; ils ne contiennent ni noms de domaine ni réponses DNS.
    c:
      en: |-
        CloudTrail records Route 53 API calls, not the DNS queries of resources.
      fr: |-
        CloudTrail enregistre les appels d'API Route 53, pas les requêtes DNS des ressources.
    d:
      en: |-
        Public DNS query logging records queries that resolvers on the internet send for the company's public zones, not the queries from the VPC.
      fr: |-
        La journalisation des requêtes DNS publiques enregistre les requêtes que les résolveurs d'Internet envoient pour les zones publiques de l'entreprise, pas les requêtes du VPC.
references:
  - title: "Resolver query logging - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs.html
