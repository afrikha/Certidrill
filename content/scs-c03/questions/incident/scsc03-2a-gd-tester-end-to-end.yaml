id: scsc03-2a-gd-tester-end-to-end
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany's automation isolates an Amazon EC2 instance when Amazon GuardDuty reports a finding about that instance. Tests with sample findings confirmed the notification, but the isolation step failed because the findings did not refer to an existing instance. The security team must test the full chain, including the isolation of a real instance, with realistic findings and without affecting production.

    Which solution will meet these requirements?
  fr: |-
    L'automatisation d'AnyCompany isole une instance Amazon EC2 lorsqu'Amazon GuardDuty signale un résultat concernant cette instance. Des tests avec des exemples de résultats ont confirmé la notification, mais l'étape d'isolation a échoué parce que les résultats ne faisaient pas référence à une instance existante. L'équipe de sécurité doit tester toute la chaîne, y compris l'isolation d'une instance réelle, avec des résultats réalistes et sans affecter la production.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Generate the sample findings again with the CreateSampleFindings API, and replace the instance ID in the input transformer of the EventBridge rule.
        fr: |-
          Générer de nouveau les exemples de résultats avec l'API CreateSampleFindings, et remplacer l'ID d'instance dans le transformateur d'entrée de la règle EventBridge.
    - id: b
      text:
        en: |-
          Run the tests in the production account during a maintenance window so that the findings refer to real production instances.
        fr: |-
          Exécuter les tests dans le compte de production pendant une fenêtre de maintenance afin que les résultats fassent référence à de vraies instances de production.
    - id: c
      text:
        en: |-
          Create a Security Hub CSPM custom action, and use it to send the existing sample findings to EventBridge again.
        fr: |-
          Créer une action personnalisée Security Hub CSPM, et l'utiliser pour envoyer de nouveau les exemples de résultats existants à EventBridge.
    - id: d
      text:
        en: |-
          Deploy the GuardDuty tester in a dedicated non-production account, and run its scripts against the test resources that it deploys.
        fr: |-
          Déployer le testeur GuardDuty dans un compte hors production dédié, et exécuter ses scripts contre les ressources de test qu'il déploie.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The GuardDuty tester deploys test resources and runs scripts that create real GuardDuty findings from simulated activity against them, unlike sample findings, which are not produced by activity on your resources. GuardDuty recommends deploying it in a dedicated non-production account, so the automation can isolate real test instances without touching production.
    fr: |-
      Le testeur GuardDuty déploie des ressources de test et exécute des scripts qui créent de vrais résultats GuardDuty à partir d'une activité simulée contre elles, contrairement aux exemples de résultats, qui ne sont pas produits par une activité sur vos ressources. GuardDuty recommande de le déployer dans un compte hors production dédié : l'automatisation peut isoler de vraies instances de test sans toucher la production.
  options:
    a:
      en: |-
        Editing the input transformer changes the automation under test, and the findings remain samples rather than realistic findings.
      fr: |-
        Modifier le transformateur d'entrée change l'automatisation testée, et les résultats restent des exemples plutôt que des résultats réalistes.
    b:
      en: |-
        Isolating production instances during a test affects production, which the team must avoid.
      fr: |-
        Isoler des instances de production pendant un test affecte la production, ce que l'équipe doit éviter.
    c:
      en: |-
        A custom action sends the same sample findings, which still do not refer to an existing instance.
      fr: |-
        Une action personnalisée envoie les mêmes exemples de résultats, qui ne font toujours pas référence à une instance existante.
references:
  - title: "Test GuardDuty findings in dedicated accounts - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings-scripts.html
  - title: "Generating sample findings in GuardDuty - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/sample_findings.html
