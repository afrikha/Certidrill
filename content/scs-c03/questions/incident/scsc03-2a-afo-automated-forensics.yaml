id: scsc03-2a-afo-automated-forensics
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany's security account aggregates Amazon GuardDuty findings in AWS Security Hub CSPM for 200 accounts. For confirmed compromises of Amazon EC2 instances, the incident response plan requires the automatic acquisition of memory and EBS disk evidence into a forensics account, the isolation of the instance after the memory acquisition, and the launch of an investigation instance from a forensic AMI. The team wants to minimize custom development.

    Which solution will meet these requirements?
  fr: |-
    Le compte de sécurité d'AnyCompany agrège dans AWS Security Hub CSPM les résultats Amazon GuardDuty de 200 comptes. Pour les compromissions confirmées d'instances Amazon EC2, le plan de réponse aux incidents exige l'acquisition automatique de preuves de mémoire et de disque EBS dans un compte d'investigation, l'isolation de l'instance après l'acquisition de la mémoire, et le lancement d'une instance d'investigation à partir d'une AMI d'investigation. L'équipe veut réduire au minimum le développement personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable GuardDuty Malware Protection for EC2 with snapshot retention, and review the retained snapshots from the forensics account.
        fr: |-
          Activer GuardDuty Malware Protection for EC2 avec la conservation des instantanés, et examiner les instantanés conservés depuis le compte d'investigation.
    - id: b
      text:
        en: |-
          Run the AWSSupport-ContainEC2Instance runbook from an Amazon EventBridge rule for each finding, with CreateAMIBackup set to true.
        fr: |-
          Exécuter le runbook AWSSupport-ContainEC2Instance depuis une règle Amazon EventBridge pour chaque résultat, avec CreateAMIBackup défini sur true.
    - id: c
      text:
        en: |-
          Deploy the Automated Forensics Orchestrator for Amazon EC2 and EKS, triggered by the Security Hub CSPM findings through Amazon EventBridge.
        fr: |-
          Déployer Automated Forensics Orchestrator for Amazon EC2 and EKS, déclenché par les résultats Security Hub CSPM au moyen d'Amazon EventBridge.
    - id: d
      text:
        en: |-
          Enable Amazon Detective for the organization, and use its behavior graph to collect the evidence of each affected instance.
        fr: |-
          Activer Amazon Detective pour l'organisation, et utiliser son graphe de comportement pour collecter les preuves de chaque instance concernée.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In the Automated Forensics Orchestrator for Amazon EC2 and EKS, Security Hub findings sent to EventBridge start AWS Step Functions workflows that triage the instance, capture memory to Amazon S3, and share EBS snapshots with the forensics account. The instance is isolated with security groups after memory acquisition, and an investigation workflow launches an instance from a forensic AMI and runs Systems Manager documents against the evidence.
    fr: |-
      Dans Automated Forensics Orchestrator for Amazon EC2 and EKS, les résultats Security Hub envoyés à EventBridge démarrent des flux de travail AWS Step Functions qui trient l'instance, capturent la mémoire dans Amazon S3 et partagent les instantanés EBS avec le compte d'investigation. L'instance est isolée avec des groupes de sécurité après l'acquisition de la mémoire, et un flux d'investigation lance une instance à partir d'une AMI d'investigation et exécute des documents Systems Manager sur les preuves.
  options:
    a:
      en: |-
        Malware Protection scans EBS data for malware and retains snapshots in the account when malware is found; it acquires no memory and neither isolates nor investigates.
      fr: |-
        Malware Protection analyse les données EBS à la recherche de logiciels malveillants et conserve les instantanés dans le compte lorsqu'il en trouve ; il n'acquiert pas la mémoire et n'isole ni n'investigue.
    b:
      en: |-
        The runbook isolates the instance and can create an AMI, but it does not capture memory or launch an investigation in a forensics account.
      fr: |-
        Le runbook isole l'instance et peut créer une AMI, mais il ne capture pas la mémoire et ne lance pas d'investigation dans un compte d'investigation.
    d:
      en: |-
        Detective analyzes logs and findings for investigation; it does not acquire memory or disk evidence from instances.
      fr: |-
        Detective analyse des journaux et des résultats pour l'investigation ; il n'acquiert pas de preuves de mémoire ou de disque des instances.
references:
