id: scsc03-2a-order-shield-engagement
objective: "2.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany has the Enterprise Support plan and has not yet subscribed to AWS Shield Advanced. The security team must prepare an internet-facing Application Load Balancer so that, during a DDoS event that affects the health of the application, the Shield Response Team (SRT) contacts the on-call team proactively.

    Which four steps should the team perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |-
    AnyCompany dispose du plan Enterprise Support et n'est pas encore abonnée à AWS Shield Advanced. L'équipe de sécurité doit préparer un Application Load Balancer exposé à Internet afin que, lors d'un événement DDoS qui affecte l'état de santé de l'application, la Shield Response Team (SRT) contacte l'équipe d'astreinte de manière proactive.

    Quelles sont les quatre étapes que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: pe
      text:
        en: |-
          Enable proactive engagement, and add the contacts of the on-call team.
        fr: |-
          Activer l'engagement proactif, et ajouter les contacts de l'équipe d'astreinte.
    - id: fms
      text:
        en: |-
          Create an AWS Firewall Manager Shield Advanced policy in the organization's management account.
        fr: |-
          Créer une politique Shield Advanced AWS Firewall Manager dans le compte de gestion de l'organisation.
    - id: sub
      text:
        en: |-
          Subscribe the account to AWS Shield Advanced.
        fr: |-
          Abonner le compte à AWS Shield Advanced.
    - id: hc
      text:
        en: |-
          Create an Amazon Route 53 health check that reflects the health of the application, and associate it with the protection.
        fr: |-
          Créer une vérification de l'état Amazon Route 53 qui reflète l'état de santé de l'application, et l'associer à la protection.
    - id: waf
      text:
        en: |-
          Associate an AWS WAF web ACL that contains only a rate-based rule with the load balancer.
        fr: |-
          Associer à l'équilibreur de charge une ACL web AWS WAF qui ne contient qu'une règle basée sur le débit.
    - id: prot
      text:
        en: |-
          Add a Shield Advanced protection for the Application Load Balancer.
        fr: |-
          Ajouter une protection Shield Advanced pour l'Application Load Balancer.
answer:
  sequence: [sub, prot, hc, pe]
explanation:
  correct:
    en: |-
      Protections can be added only after the subscription, and a health check is associated with an existing protection. Proactive engagement covers resources that have an associated Route 53 health check, whose status the SRT uses to decide whether to contact you, so it is enabled last with the contacts.
    fr: |-
      Les protections ne peuvent être ajoutées qu'après l'abonnement, et une vérification de l'état s'associe à une protection existante. L'engagement proactif couvre les ressources associées à une vérification de l'état Route 53, dont la SRT utilise l'état pour décider de vous contacter : il est donc activé en dernier avec les contacts.
  options:
    fms:
      en: |-
        Firewall Manager applies protections across accounts of an organization; it is not needed to protect one load balancer in one account.
      fr: |-
        Firewall Manager applique des protections dans les comptes d'une organisation ; il n'est pas nécessaire pour protéger un équilibreur de charge dans un seul compte.
    waf:
      en: |-
        A web ACL can help mitigation, but proactive engagement does not require one.
      fr: |-
        Une ACL web peut aider l'atténuation, mais l'engagement proactif n'en exige pas.
references:
  - title: "Setting up proactive engagement for the SRT to contact you directly - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-srt-proactive-engagement.html
  - title: "Health-based detection using health checks with Shield Advanced and Route 53 - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-advanced-health-checks.html
