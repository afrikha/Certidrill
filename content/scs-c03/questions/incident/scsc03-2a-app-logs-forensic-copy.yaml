id: scsc03-2a-app-logs-forensic-copy
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany's application writes security-relevant logs to local files on Amazon EC2 instances that an Auto Scaling group replaces frequently. During past incidents, the logs of terminated instances were lost. The security team wants these logs captured continuously, kept in Amazon CloudWatch Logs for 30 days for searches, and copied in near real time to an S3 bucket in the log archive account as forensic artifacts.

    Which combination of steps will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |-
    L'application d'AnyCompany écrit des journaux importants pour la sécurité dans des fichiers locaux d'instances Amazon EC2 qu'un groupe Auto Scaling remplace fréquemment. Lors d'incidents passés, les journaux des instances terminées ont été perdus. L'équipe de sécurité veut que ces journaux soient capturés en continu, conservés 30 jours dans Amazon CloudWatch Logs pour les recherches, et copiés quasiment en temps réel dans un compartiment S3 du compte d'archivage des journaux en tant qu'artefacts d'investigation.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch Logs export task every hour that exports the log group to the S3 bucket in the log archive account.
        fr: |-
          Créer toutes les heures une tâche d'exportation CloudWatch Logs qui exporte le groupe de journaux vers le compartiment S3 du compte d'archivage des journaux.
    - id: b
      text:
        en: |-
          Install and configure the CloudWatch agent on the instances to send the application log files to a log group with a 30-day retention.
        fr: |-
          Installer et configurer l'agent CloudWatch sur les instances pour envoyer les fichiers journaux de l'application vers un groupe de journaux avec une conservation de 30 jours.
    - id: c
      text:
        en: |-
          Enable Systems Manager Session Manager logging to the S3 bucket so that the application logs are copied during sessions.
        fr: |-
          Activer la journalisation de Systems Manager Session Manager vers le compartiment S3 afin que les journaux de l'application soient copiés pendant les sessions.
    - id: d
      text:
        en: |-
          Create a subscription filter on the log group that sends the log events to an Amazon Data Firehose stream that delivers them to the bucket.
        fr: |-
          Créer sur le groupe de journaux un filtre d'abonnement qui envoie les événements de journal à un flux Amazon Data Firehose qui les livre dans le compartiment.
    - id: e
      text:
        en: |-
          Enable AWS CloudTrail data events for the instances so that the application log files are recorded in the organization trail.
        fr: |-
          Activer les événements de données AWS CloudTrail pour les instances afin que les fichiers journaux de l'application soient enregistrés dans le journal de suivi d'organisation.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      The CloudWatch agent ships the log files from each instance to CloudWatch Logs as they are written, so they survive instance termination, and the log group's retention keeps them 30 days. A subscription filter streams the events in near real time to Firehose for delivery to the bucket, which AWS recommends over repeated exports for continuous archiving.
    fr: |-
      L'agent CloudWatch envoie les fichiers journaux de chaque instance vers CloudWatch Logs au fur et à mesure de leur écriture : ils survivent à la terminaison des instances, et la conservation du groupe de journaux les garde 30 jours. Un filtre d'abonnement diffuse les événements quasiment en temps réel vers Firehose pour leur livraison dans le compartiment, ce qu'AWS recommande plutôt que des exportations répétées pour un archivage continu.
  options:
    a:
      en: |-
        AWS recommends subscriptions rather than regular exports for continuous archiving, and log data can take up to 12 hours to become available for export.
      fr: |-
        AWS recommande des abonnements plutôt que des exportations régulières pour l'archivage continu, et les données de journal peuvent mettre jusqu'à 12 heures à être disponibles pour l'exportation.
    c:
      en: |-
        Session logging records interactive sessions, not the files that the application writes.
      fr: |-
        La journalisation des sessions enregistre les sessions interactives, pas les fichiers que l'application écrit.
    e:
      en: |-
        CloudTrail data events record API operations on supported resources; they do not collect application log files from instances.
      fr: |-
        Les événements de données CloudTrail enregistrent les opérations d'API sur les ressources prises en charge ; ils ne collectent pas les fichiers journaux applicatifs des instances.
references:
  - title: "Exporting log data to Amazon S3 - Amazon CloudWatch Logs"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/S3Export.html
