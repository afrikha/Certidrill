id: scsc03-2b-s3-failed-auth-access-logs
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany stores customer exports in an Amazon S3 bucket. An AWS CloudTrail trail records data events for the bucket. During an investigation, the security team suspects that an attacker sent many requests to the bucket with forged signatures and invalid access keys, but the trail shows none of these attempts. For future investigations, the team must record requests to the bucket that fail authentication, in addition to the successful requests. The solution must not change how clients access the bucket.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke des exports de clients dans un compartiment Amazon S3. Un journal de suivi AWS CloudTrail enregistre les événements de données du compartiment. Pendant une enquête, l'équipe de sécurité soupçonne un attaquant d'avoir envoyé de nombreuses requêtes au compartiment avec des signatures falsifiées et des clés d'accès non valides, mais le journal de suivi ne montre aucune de ces tentatives. Pour les enquêtes futures, l'équipe doit enregistrer les requêtes adressées au compartiment qui échouent à l'authentification, en plus des requêtes réussies. La solution ne doit pas modifier la façon dont les clients accèdent au compartiment.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a second trail that records all read and write S3 data events for the bucket and sends them to an Amazon CloudWatch Logs log group.", fr: "Créer un second journal de suivi qui enregistre tous les événements de données S3 en lecture et en écriture du compartiment et les envoie dans un groupe de journaux Amazon CloudWatch Logs." }
    - id: b
      text: { en: "Enable Amazon GuardDuty S3 Protection for the account, and review the findings that it generates for the bucket.", fr: "Activer Amazon GuardDuty S3 Protection pour le compte, et examiner les résultats qu'il génère pour le compartiment." }
    - id: c
      text: { en: "Create an Amazon EventBridge rule that matches AWS API Call via CloudTrail events for the bucket with an AccessDenied error code, and send them to a log group.", fr: "Créer une règle Amazon EventBridge qui correspond aux événements AWS API Call via CloudTrail du compartiment avec un code d'erreur AccessDenied, et les envoyer dans un groupe de journaux." }
    - id: d
      text: { en: "Enable S3 server access logging for the bucket, with a separate bucket in the same account and Region as the destination.", fr: "Activer la journalisation des accès au serveur S3 pour le compartiment, avec comme destination un compartiment distinct dans le même compte et la même Région." }
answer: { optionId: d }
explanation:
  correct:
    en: "CloudTrail does not deliver logs for requests that fail authentication, whereas S3 server access logs record them. Server access logging is configured on the bucket and has no effect on how clients send requests; delivery to an S3 bucket has no logging charge beyond storage. It complements the CloudTrail data events that the trail already records."
    fr: "CloudTrail ne livre pas de journaux pour les requêtes qui échouent à l'authentification, alors que les journaux d'accès au serveur S3 les enregistrent. La journalisation des accès au serveur se configure sur le compartiment et n'a aucun effet sur la façon dont les clients envoient leurs requêtes ; la livraison dans un compartiment S3 n'entraîne aucun coût de journalisation en dehors du stockage. Elle complète les événements de données CloudTrail que le journal de suivi enregistre déjà."
  options:
    a:
      en: "A second trail records the same kind of data events as the first one; no trail configuration makes CloudTrail deliver requests that fail authentication."
      fr: "Un second journal de suivi enregistre le même type d'événements de données que le premier ; aucune configuration de journal de suivi ne fait livrer par CloudTrail les requêtes qui échouent à l'authentification."
    b:
      en: "S3 Protection analyzes CloudTrail S3 data events, so it does not see requests that CloudTrail does not record, and it produces findings rather than a record of every request."
      fr: "S3 Protection analyse les événements de données S3 de CloudTrail : il ne voit pas les requêtes que CloudTrail n'enregistre pas, et il produit des résultats plutôt qu'un enregistrement de chaque requête."
    c:
      en: "EventBridge receives only the events that CloudTrail records, and authorization errors are different from authentication failures, which are never recorded."
      fr: "EventBridge ne reçoit que les événements enregistrés par CloudTrail, et les erreurs d'autorisation diffèrent des échecs d'authentification, qui ne sont jamais enregistrés."
references:
  - title: "Logging options for Amazon S3 - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/logging-with-S3.html
