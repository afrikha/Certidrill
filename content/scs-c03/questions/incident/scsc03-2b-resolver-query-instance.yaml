id: scsc03-2b-resolver-query-instance
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has three VPCs that use the Amazon-provided DNS resolver. Route 53 Resolver query logging is configured for the three VPCs and sends the logs to an Amazon CloudWatch Logs log group that is retained for 1 year. A partner warns that the domain update.example.net hosts command-and-control servers. The domain is not in any threat intelligence feed that Amazon GuardDuty uses. The security team must list every EC2 instance that resolved the domain during the last 30 days.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède trois VPC qui utilisent le résolveur DNS fourni par Amazon. La journalisation des requêtes du résolveur Route 53 est configurée pour les trois VPC et envoie les journaux dans un groupe de journaux Amazon CloudWatch Logs conservé 1 an. Un partenaire signale que le domaine update.example.net héberge des serveurs de commande et de contrôle. Le domaine ne figure dans aucun flux de renseignement sur les menaces utilisé par Amazon GuardDuty. L'équipe de sécurité doit lister toutes les instances EC2 qui ont résolu ce domaine au cours des 30 derniers jours.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Query the VPC flow logs of the three VPCs for UDP and TCP traffic on port 53 that contains the domain name, and group the results by interface-id.", fr: "Interroger les journaux de flux des trois VPC pour le trafic UDP et TCP sur le port 53 qui contient le nom de domaine, et regrouper les résultats par interface-id." }
    - id: b
      text: { en: "Query the AWS CloudTrail management events of the accounts for requests that contain the domain name, and group the results by the EC2 instance in the user identity.", fr: "Interroger les événements de gestion AWS CloudTrail des comptes pour les requêtes qui contiennent le nom de domaine, et regrouper les résultats par instance EC2 de l'identité de l'utilisateur." }
    - id: c
      text: { en: "Run a CloudWatch Logs Insights query on the query log group that filters query_name on the domain for the last 30 days, and group the results by srcids.instance.", fr: "Exécuter sur le groupe de journaux des requêtes une requête CloudWatch Logs Insights qui filtre query_name sur le domaine pour les 30 derniers jours, et regrouper les résultats par srcids.instance." }
    - id: d
      text: { en: "Add the domain to a GuardDuty threat entity list, and list the EC2 instances that appear in the findings that GuardDuty generates for the domain.", fr: "Ajouter le domaine à une liste d'entités de menace GuardDuty, et lister les instances EC2 qui apparaissent dans les résultats que GuardDuty génère pour ce domaine." }
answer: { optionId: c }
explanation:
  correct:
    en: "Resolver query logs record each DNS query with its query_name, the source address, and the srcids object, which contains the ID of the instance that sent the query. Filtering the log group on the domain and grouping by srcids.instance lists every instance that resolved it during the retained period."
    fr: "Les journaux de requêtes du résolveur enregistrent chaque requête DNS avec son query_name, l'adresse source et l'objet srcids, qui contient l'ID de l'instance qui a envoyé la requête. Filtrer le groupe de journaux sur le domaine et regrouper par srcids.instance liste toutes les instances qui l'ont résolu pendant la période conservée."
  options:
    a:
      en: "Flow logs record addresses, ports, and byte counts, not the payload, so no record contains a queried domain name."
      fr: "Les journaux de flux enregistrent des adresses, des ports et des volumes d'octets, pas le contenu : aucun enregistrement ne contient de nom de domaine demandé."
    b:
      en: "CloudTrail records AWS API calls; DNS resolution by an instance is not an API call and does not appear in CloudTrail."
      fr: "CloudTrail enregistre les appels d'API AWS ; la résolution DNS par une instance n'est pas un appel d'API et n'apparaît pas dans CloudTrail."
    d:
      en: "A threat list only makes GuardDuty generate findings for activity after the list is active, so the last 30 days are not covered."
      fr: "Une liste de menaces ne fait générer par GuardDuty que des résultats pour l'activité postérieure à son activation : les 30 derniers jours ne sont pas couverts."
references:
  - title: "Values that appear in VPC Resolver query logs - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs-format.html
