id: scsc03-2b-cognito-global-signout
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A mobile application authenticates users with an Amazon Cognito user pool. Malware on a user's devices stole the refresh tokens of all of the user's sessions. The security team must invalidate all of that user's refresh tokens on every device from a backend process that uses IAM credentials, without any action from the user.

    Which solution will meet these requirements?
  fr: |
    Une application mobile authentifie ses utilisateurs avec un groupe d'utilisateurs Amazon Cognito. Un logiciel malveillant présent sur les appareils d'un utilisateur a volé les jetons d'actualisation de toutes ses sessions. L'équipe de sécurité doit invalider tous les jetons d'actualisation de cet utilisateur sur tous ses appareils depuis un processus backend qui utilise des informations d'identification IAM, sans aucune action de l'utilisateur.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Call RevokeToken with the refresh token of the user's most recent session and the app client ID.", fr: "Appeler RevokeToken avec le jeton d'actualisation de la session la plus récente de l'utilisateur et l'ID du client d'application." }
    - id: b
      text: { en: "Call GlobalSignOut from the backend process for the user.", fr: "Appeler GlobalSignOut depuis le processus backend pour l'utilisateur." }
    - id: c
      text: { en: "Call AdminUserGlobalSignOut for the user.", fr: "Appeler AdminUserGlobalSignOut pour l'utilisateur." }
    - id: d
      text: { en: "Reduce the refresh token expiration of the app client to 1 hour.", fr: "Réduire à 1 heure l'expiration des jetons d'actualisation du client d'application." }
answer: { optionId: c }
explanation:
  correct:
    en: "AdminUserGlobalSignOut is authorized with IAM credentials and revokes all of the target user's refresh tokens, with the ID and access tokens that they issued. Revoked tokens can no longer be used with Cognito APIs, but an access token checked only by a JWT library stays valid until it expires, so short access token lifetimes limit the remaining exposure."
    fr: "AdminUserGlobalSignOut est autorisé par des informations d'identification IAM et révoque tous les jetons d'actualisation de l'utilisateur ciblé, avec les jetons d'ID et d'accès qu'ils ont émis. Les jetons révoqués ne peuvent plus être utilisés avec les API Cognito, mais un jeton d'accès vérifié uniquement par une bibliothèque JWT reste valide jusqu'à son expiration : des durées de vie courtes limitent l'exposition restante."
  options:
    a:
      en: "RevokeToken revokes only the given refresh token and the tokens issued from it; the user's other refresh tokens stay valid."
      fr: "RevokeToken ne révoque que le jeton d'actualisation fourni et les jetons qu'il a émis ; les autres jetons d'actualisation de l'utilisateur restent valides."
    b:
      en: "GlobalSignOut is a self-service call authorized by the user's own access token, so a backend with IAM credentials cannot use it without the user."
      fr: "GlobalSignOut est un appel en libre-service autorisé par le propre jeton d'accès de l'utilisateur : un backend doté d'informations d'identification IAM ne peut pas l'utiliser sans l'utilisateur."
    d:
      en: "A new expiration applies to tokens issued later; the stolen refresh tokens keep their original lifetime."
      fr: "Une nouvelle expiration s'applique aux jetons émis ensuite ; les jetons d'actualisation volés gardent leur durée de vie d'origine."
references:
  - title: "Ending user sessions with token revocation - Amazon Cognito"
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/token-revocation.html
