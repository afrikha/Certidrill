id: scsc03-2a-match-remediation-services
objective: "2.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany's security team is designing automatic remediation for several incident types.

    Match each requirement to the AWS service or feature that meets it.

    To answer, drag the appropriate service or feature to each requirement. Each service or feature may be used once or not at all.
  fr: |-
    L'équipe de sécurité d'AnyCompany conçoit la correction automatique de plusieurs types d'incidents.

    Associez chaque exigence au service ou à la fonctionnalité AWS qui y répond.

    Pour répondre, faites glisser le service ou la fonctionnalité appropriés vers chaque exigence. Chaque service ou fonctionnalité peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - id: config
      text:
        en: |-
          AWS Config automatic remediation
        fr: |-
          Correction automatique AWS Config
    - id: sfn
      text:
        en: |-
          AWS Step Functions
        fr: |-
          AWS Step Functions
    - id: arc
      text:
        en: |-
          ARC routing control
        fr: |-
          Contrôle de routage ARC
    - id: afo
      text:
        en: |-
          Automated Forensics Orchestrator for Amazon EC2 and EKS
        fr: |-
          Automated Forensics Orchestrator for Amazon EC2 and EKS
    - id: lambda
      text:
        en: |-
          AWS Lambda
        fr: |-
          AWS Lambda
    - id: rh
      text:
        en: |-
          AWS Resilience Hub
        fr: |-
          AWS Resilience Hub
  targets:
    - id: t1
      text:
        en: |-
          Correct a resource that a rule evaluates as noncompliant by running a runbook, with retries
        fr: |-
          Corriger une ressource qu'une règle évalue comme non conforme en exécutant un runbook, avec de nouvelles tentatives
    - id: t2
      text:
        en: |-
          Coordinate a multi-step response that waits days for a human approval before it continues
        fr: |-
          Coordonner une réponse en plusieurs étapes qui attend pendant des jours une approbation humaine avant de continuer
    - id: t3
      text:
        en: |-
          Switch DNS traffic from a compromised Region to a standby Region with safety rules
        fr: |-
          Basculer le trafic DNS d'une Région compromise vers une Région de secours avec des règles de sécurité
    - id: t4
      text:
        en: |-
          Acquire memory and disk evidence of an instance automatically and start an investigation from a forensic AMI
        fr: |-
          Acquérir automatiquement des preuves de mémoire et de disque d'une instance et démarrer une investigation à partir d'une AMI d'investigation
    - id: t5
      text:
        en: |-
          Run a short piece of custom code, such as attaching a policy that revokes older role sessions
        fr: |-
          Exécuter un court code personnalisé, comme attacher une politique qui révoque les anciennes sessions d'un rôle
answer:
  mapping: { t1: config, t2: sfn, t3: arc, t4: afo, t5: lambda }
explanation:
  correct:
    en: |-
      AWS Config remediation runs Systems Manager Automation documents on noncompliant resources with retries, and Step Functions Standard workflows pause on a task token until an approval arrives. ARC routing controls switch DNS traffic between Regional replicas under safety rules, the Automated Forensics Orchestrator acquires memory and disk evidence and launches investigations, and Lambda runs short custom code such as a session revocation.
    fr: |-
      La correction AWS Config exécute des documents Systems Manager Automation sur les ressources non conformes avec de nouvelles tentatives, et les flux de travail Step Functions Standard se mettent en pause sur un jeton de tâche jusqu'à l'arrivée d'une approbation. Les contrôles de routage ARC basculent le trafic DNS entre répliques régionales sous des règles de sécurité, Automated Forensics Orchestrator acquiert des preuves de mémoire et de disque et lance des investigations, et Lambda exécute un court code personnalisé comme une révocation de sessions.
  options:
    rh:
      en: |-
        Resilience Hub assesses resilience against RTO and RPO targets; it does not remediate incidents.
      fr: |-
        Resilience Hub évalue la résilience par rapport à des objectifs de RTO et de RPO ; il ne corrige pas d'incidents.
references:
  - title: "Remediating Noncompliant Resources with AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/remediation.html
  - title: "Architecture overview - Automated Forensics Orchestrator for Amazon EC2 and EKS"
    url: https://docs.aws.amazon.com/solutions/latest/automated-forensics-orchestrator-for-amazon-ec2/architecture-overview.html
