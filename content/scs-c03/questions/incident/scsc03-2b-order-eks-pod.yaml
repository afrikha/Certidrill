id: scsc03-2b-order-eks-pod
objective: "2.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Amazon GuardDuty reports that a pod in an Amazon EKS cluster that runs on EC2 worker nodes is communicating with a known malicious IP address. The incident response team must first stop the attack in progress, then remove the attacker's access to AWS resources, then keep the evidence on the node from being lost, and finally collect that evidence before the workload is redeployed.

    Which five actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Amazon GuardDuty signale qu'un pod d'un cluster Amazon EKS exécuté sur des nœuds de travail EC2 communique avec une adresse IP malveillante connue. L'équipe de réponse aux incidents doit d'abord arrêter l'attaque en cours, puis retirer à l'attaquant l'accès aux ressources AWS, puis éviter la perte des preuves présentes sur le nœud, et enfin collecter ces preuves avant le redéploiement de la charge de travail.

    Quelles sont les cinq actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - id: iso
      text: { en: "Apply a deny-all NetworkPolicy that selects the compromised pod's labels for ingress and egress.", fr: "Appliquer une NetworkPolicy qui refuse tout le trafic entrant et sortant pour les étiquettes du pod compromis." }
    - id: drain
      text: { en: "Drain the worker node so that all of its pods, including the compromised pod, are evicted and rescheduled.", fr: "Vider (drain) le nœud de travail pour que tous ses pods, y compris le pod compromis, soient expulsés et replanifiés." }
    - id: cred
      text: { en: "Revoke the temporary credentials that the pod can use, for example by removing the node's IAM role from the instance.", fr: "Révoquer les informations d'identification temporaires que le pod peut utiliser, par exemple en retirant de l'instance le rôle IAM du nœud." }
    - id: cordon
      text: { en: "Cordon the worker node so that the scheduler places no new pods on it.", fr: "Isoler (cordon) le nœud de travail pour que le planificateur n'y place plus de nouveaux pods." }
    - id: del
      text: { en: "Delete the compromised pod so that its Deployment replaces it with a clean pod.", fr: "Supprimer le pod compromis pour que son Deployment le remplace par un pod sain." }
    - id: term
      text: { en: "Enable termination protection on the worker node's EC2 instance.", fr: "Activer la protection contre la résiliation de l'instance EC2 du nœud de travail." }
    - id: vol
      text: { en: "Capture the node's memory and container state, and then create snapshots of its EBS volumes.", fr: "Capturer la mémoire du nœud et l'état des conteneurs, puis créer des instantanés de ses volumes EBS." }
answer:
  sequence: [iso, cred, cordon, term, vol]
explanation:
  correct:
    en: "The Amazon EKS incident response guidance first isolates the pod with a deny-all network policy to sever its connections, then revokes the temporary credentials it can use. Cordoning the node keeps new workloads off it so that it can be studied, and termination protection prevents an attacker from erasing evidence by terminating the instance. Volatile artifacts such as memory and container state are captured before the EBS snapshots, and only then is the workload redeployed."
    fr: "Les recommandations de réponse aux incidents d'Amazon EKS isolent d'abord le pod avec une politique réseau qui refuse tout, pour couper ses connexions, puis révoquent les informations d'identification temporaires qu'il peut utiliser. Isoler (cordon) le nœud tient les nouvelles charges de travail à l'écart pour pouvoir l'étudier, et la protection contre la résiliation empêche un attaquant d'effacer les preuves en résiliant l'instance. Les artefacts volatils comme la mémoire et l'état des conteneurs sont capturés avant les instantanés EBS, et ce n'est qu'ensuite que la charge de travail est redéployée."
  options:
    drain:
      en: "Draining evicts the compromised pod, which destroys its runtime state before it is captured."
      fr: "Vider le nœud expulse le pod compromis, ce qui détruit son état d'exécution avant sa capture."
    del:
      en: "Deleting the pod destroys the evidence; the guidance redeploys a fixed workload only after the evidence is collected."
      fr: "Supprimer le pod détruit les preuves ; les recommandations ne redéploient une charge de travail corrigée qu'après la collecte des preuves."
references:
  - title: "Incident response and forensics - Amazon EKS"
    url: https://docs.aws.amazon.com/eks/latest/best-practices/incident-response-and-forensics.html
