id: scsc03-2a-shub-custom-action-isolate
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany aggregates findings in AWS Security Hub CSPM. Analysts review each finding about an exposed Amazon EC2 instance and decide whether to isolate the instance. When an analyst decides to isolate an instance, the isolation must start from the Security Hub CSPM console with one action, and the analyst must not need any EC2 permissions.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany agrège des résultats dans AWS Security Hub CSPM. Les analystes examinent chaque résultat concernant une instance Amazon EC2 exposée et décident s'il faut isoler l'instance. Lorsqu'un analyste décide d'isoler une instance, l'isolation doit démarrer depuis la console Security Hub CSPM avec une seule action, et l'analyste ne doit avoir besoin d'aucune autorisation EC2.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Security Hub CSPM automation rule that sets the workflow status of the finding to NOTIFIED and isolates the instance of the finding.
        fr: |-
          Créer une règle d'automatisation Security Hub CSPM qui définit le statut de flux de travail du résultat sur NOTIFIED et isole l'instance du résultat.
    - id: b
      text:
        en: |-
          Create an EventBridge rule for the Security Hub Findings - Imported event type that runs the isolation runbook for every finding about EC2 instances.
        fr: |-
          Créer une règle EventBridge pour le type d'événement Security Hub Findings - Imported qui exécute le runbook d'isolation pour chaque résultat concernant des instances EC2.
    - id: c
      text:
        en: |-
          Allow the analysts to run the AWSSupport-ContainEC2Instance runbook with their own credentials from the Systems Manager console.
        fr: |-
          Autoriser les analystes à exécuter le runbook AWSSupport-ContainEC2Instance avec leurs propres informations d'identification depuis la console Systems Manager.
    - id: d
      text:
        en: |-
          Create a Security Hub CSPM custom action and an EventBridge rule that matches its ARN and starts the isolation runbook with its own role.
        fr: |-
          Créer une action personnalisée Security Hub CSPM et une règle EventBridge qui correspond à son ARN et démarre le runbook d'isolation avec son propre rôle.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A custom action sends the findings that an analyst selects in Security Hub CSPM to EventBridge, and a rule that uses the ARN of the custom action starts the response. The rule target and the runbook act with their own IAM roles, so the analyst only needs permission to use the custom action.
    fr: |-
      Une action personnalisée envoie à EventBridge les résultats qu'un analyste sélectionne dans Security Hub CSPM, et une règle qui utilise l'ARN de l'action personnalisée démarre la réponse. La cible de la règle et le runbook agissent avec leurs propres rôles IAM : l'analyste n'a besoin que de l'autorisation d'utiliser l'action personnalisée.
  options:
    a:
      en: |-
        Automation rules only update fields of findings; they cannot isolate an instance, and they run without an analyst's decision.
      fr: |-
        Les règles d'automatisation ne font que mettre à jour des champs des résultats ; elles ne peuvent pas isoler une instance et s'exécutent sans la décision d'un analyste.
    b:
      en: |-
        Imported events are sent automatically for every finding, so instances would be isolated without an analyst's decision.
      fr: |-
        Les événements Imported sont envoyés automatiquement pour chaque résultat : des instances seraient isolées sans la décision d'un analyste.
    c:
      en: |-
        The runbook would run with the analysts' permissions, which would need EC2 permissions, and it would not start from Security Hub CSPM.
      fr: |-
        Le runbook s'exécuterait avec les autorisations des analystes, qui auraient besoin d'autorisations EC2, et il ne démarrerait pas depuis Security Hub CSPM.
references:
  - title: "Using custom actions to send findings and insight results to EventBridge - AWS Security Hub"
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-cwe-custom-actions.html
