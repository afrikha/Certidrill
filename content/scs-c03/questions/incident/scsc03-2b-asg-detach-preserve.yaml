id: scsc03-2b-asg-detach-preserve
objective: "2.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A compromised EC2 instance belongs to an Auto Scaling group that registers instances with an Application Load Balancer target group and uses ELB health checks. The incident response team must remove the instance from production traffic and keep it running so that its memory can be captured. The instance must not be terminated by the Auto Scaling group, and an attacker with stolen credentials must not be able to terminate it through the EC2 API. The Auto Scaling group must keep its current capacity.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une instance EC2 compromise appartient à un groupe Auto Scaling qui enregistre les instances dans un groupe cible d'Application Load Balancer et utilise les vérifications de l'état ELB. L'équipe de réponse aux incidents doit retirer l'instance du trafic de production et la laisser en fonctionnement pour capturer sa mémoire. L'instance ne doit pas être résiliée par le groupe Auto Scaling, et un attaquant disposant d'informations d'identification volées ne doit pas pouvoir la résilier par l'API EC2. Le groupe Auto Scaling doit conserver sa capacité actuelle.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Set the desired capacity of the Auto Scaling group to 0 until the investigation ends.", fr: "Définir à 0 la capacité souhaitée du groupe Auto Scaling jusqu'à la fin de l'enquête." }
    - id: b
      text: { en: "Enable instance scale-in protection for the instance in the Auto Scaling group.", fr: "Activer la protection contre la diminution en charge (scale-in protection) de l'instance dans le groupe Auto Scaling." }
    - id: c
      text: { en: "Detach the instance from the Auto Scaling group without decrementing the desired capacity.", fr: "Détacher l'instance du groupe Auto Scaling sans diminuer la capacité souhaitée." }
    - id: d
      text: { en: "Stop the instance, and enable stop protection on it.", fr: "Arrêter l'instance, puis activer sa protection contre l'arrêt." }
    - id: e
      text: { en: "Enable termination protection on the instance.", fr: "Activer la protection contre la résiliation de l'instance." }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Detaching the instance deregisters it from the load balancer target group and leaves it running outside the group; because the desired capacity is not decremented, Auto Scaling launches a replacement. Termination protection then blocks termination through the console, CLI, or API, so the attacker cannot destroy the evidence."
    fr: "Détacher l'instance la désinscrit du groupe cible de l'équilibreur de charge et la laisse fonctionner hors du groupe ; comme la capacité souhaitée n'est pas diminuée, Auto Scaling lance une instance de remplacement. La protection contre la résiliation bloque ensuite la résiliation par la console, la CLI ou l'API : l'attaquant ne peut pas détruire les preuves."
  options:
    a:
      en: "A desired capacity of 0 makes the group terminate all of its instances, including the compromised one, and removes production capacity."
      fr: "Une capacité souhaitée de 0 fait résilier par le groupe toutes ses instances, y compris l'instance compromise, et supprime la capacité de production."
    b:
      en: "Scale-in protection does not stop health check replacement, and the instance would stay registered with the target group and keep serving traffic."
      fr: "La protection contre la diminution en charge n'empêche pas le remplacement après un échec de vérification de l'état, et l'instance resterait inscrite dans le groupe cible et continuerait à recevoir du trafic."
    d:
      en: "Stopping the instance clears its memory, which destroys the volatile evidence."
      fr: "Arrêter l'instance efface sa mémoire, ce qui détruit les preuves volatiles."
references:
  - title: "Detach or attach instances from your Auto Scaling group - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-detach-attach-instances.html
  - title: "Incident response and forensics - Amazon EKS"
    url: https://docs.aws.amazon.com/eks/latest/best-practices/incident-response-and-forensics.html
