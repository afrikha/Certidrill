id: scsc03-2a-emergency-direct-federation
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's responders access AWS accounts only through IAM Identity Center, which is federated with an external SAML 2.0 identity provider (IdP). The incident response plan must allow responders to sign in to the AWS Management Console of critical accounts even if IAM Identity Center is disrupted while the IdP and IAM remain available. Responders must keep using their existing corporate credentials.

    Which solution will meet these requirements?
  fr: |-
    Les intervenants d'AnyCompany n'accèdent aux comptes AWS qu'au moyen d'IAM Identity Center, fédéré avec un fournisseur d'identité (IdP) SAML 2.0 externe. Le plan de réponse aux incidents doit permettre aux intervenants de se connecter à l'AWS Management Console des comptes critiques même si IAM Identity Center est perturbé alors que l'IdP et IAM restent disponibles. Les intervenants doivent continuer d'utiliser leurs informations d'identification d'entreprise existantes.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the session duration of the incident response permission set to 12 hours so that responders keep their sessions during a disruption.
        fr: |-
          Porter à 12 heures la durée de session de l'ensemble d'autorisations de réponse aux incidents afin que les intervenants conservent leurs sessions pendant une perturbation.
    - id: b
      text:
        en: |-
          Create IAM users with hardware MFA devices in each critical account, and keep their passwords in a sealed envelope held by the security lead.
        fr: |-
          Créer des utilisateurs IAM avec des dispositifs MFA matériels dans chaque compte critique, et conserver leurs mots de passe dans une enveloppe scellée détenue par le responsable de la sécurité.
    - id: c
      text:
        en: |-
          Before any disruption, configure direct SAML 2.0 federation from the IdP to emergency IAM roles in the critical accounts, and test it periodically.
        fr: |-
          Avant toute perturbation, configurer une fédération SAML 2.0 directe de l'IdP vers des rôles IAM d'urgence dans les comptes critiques, et la tester périodiquement.
    - id: d
      text:
        en: |-
          Create an Amazon Cognito user pool federated with the IdP, and give its users console access through a role of a Cognito identity pool.
        fr: |-
          Créer un groupe d'utilisateurs Amazon Cognito fédéré avec l'IdP, et donner à ses utilisateurs l'accès à la console au moyen d'un rôle d'un groupe d'identités Cognito.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      IAM Identity Center recommends an emergency configuration in which the external IdP federates directly with IAM roles in individual accounts through SAML 2.0. Responders sign in with the same corporate credentials, the configuration works while IAM Identity Center is unavailable, and it must be deployed and tested before a disruption because the roles cannot be created during one.
    fr: |-
      IAM Identity Center recommande une configuration d'urgence dans laquelle l'IdP externe se fédère directement avec des rôles IAM de comptes individuels au moyen de SAML 2.0. Les intervenants se connectent avec les mêmes informations d'identification d'entreprise, la configuration fonctionne lorsqu'IAM Identity Center est indisponible, et elle doit être déployée et testée avant une perturbation, car les rôles ne peuvent pas être créés pendant celle-ci.
  options:
    a:
      en: |-
        New sign-ins still go through IAM Identity Center, and existing sessions expire.
      fr: |-
        Les nouvelles connexions passent toujours par IAM Identity Center, et les sessions existantes expirent.
    b:
      en: |-
        Break-glass IAM users avoid the dependency on the IdP, but responders would not use their corporate credentials.
      fr: |-
        Des utilisateurs IAM d'accès d'urgence évitent la dépendance à l'IdP, mais les intervenants n'utiliseraient pas leurs informations d'identification d'entreprise.
    d:
      en: |-
        Cognito provides identities for application users; it is not a workforce sign-in path to the AWS Management Console.
      fr: |-
        Cognito fournit des identités aux utilisateurs d'applications ; ce n'est pas un chemin de connexion du personnel à l'AWS Management Console.
references:
  - title: "Set up emergency access to the AWS Management Console - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/emergency-access.html
