id: scsc03-2b-inspector-score-priority
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon Inspector reports the same CVE on 300 EC2 instances across several accounts. The NVD CVSS base score of the CVE is 9.8 on every finding. Some instances are reachable from the internet and others are in isolated subnets. The security team must determine which instances face the highest risk from the CVE in their own environment before it schedules patching, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Amazon Inspector signale la même CVE sur 300 instances EC2 de plusieurs comptes. Le score de base CVSS NVD de la CVE est 9,8 sur chaque résultat. Certaines instances sont accessibles depuis Internet et d'autres se trouvent dans des sous-réseaux isolés. L'équipe de sécurité doit déterminer quelles instances courent le plus grand risque face à cette CVE dans leur propre environnement avant de planifier les correctifs, avec le MOINS d'effort.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Sort the findings by their NVD CVSS 3.1 base score, and patch the instances in that order.", fr: "Trier les résultats selon leur score de base CVSS 3.1 NVD, et corriger les instances dans cet ordre." }
    - id: b
      text: { en: "Filter the findings on Fix available set to YES, and patch those instances first.", fr: "Filtrer les résultats sur Fix available à YES, et corriger ces instances en premier." }
    - id: c
      text: { en: "Run Network Access Analyzer for each instance, and combine its results with the findings in a spreadsheet.", fr: "Exécuter Network Access Analyzer pour chaque instance, et combiner ses résultats avec les résultats Inspector dans un tableur." }
    - id: d
      text: { en: "Sort the findings by their Inspector score, and review the Inspector score and vulnerability intelligence tab of the top findings.", fr: "Trier les résultats selon leur score Inspector, et examiner l'onglet Inspector score and vulnerability intelligence des premiers résultats." }
answer: { optionId: d }
explanation:
  correct:
    en: "For EC2 findings, Amazon Inspector correlates the CVSS base score with information from the compute environment, such as network reachability and exploitability data, to produce the Inspector score. The Inspector score and vulnerability intelligence tab explains why the Inspector score differs from the base score. Sorting by this score ranks the 300 instances by their contextual risk with no extra tooling."
    fr: "Pour les résultats EC2, Amazon Inspector corrèle le score de base CVSS avec des informations de l'environnement de calcul, comme l'accessibilité réseau et les données d'exploitabilité, pour produire le score Inspector. L'onglet Inspector score and vulnerability intelligence explique pourquoi le score Inspector diffère du score de base. Trier selon ce score classe les 300 instances selon leur risque en contexte, sans outil supplémentaire."
  options:
    a:
      en: "The base score is 9.8 on all 300 findings, so it does not distinguish exposed instances from isolated ones."
      fr: "Le score de base vaut 9,8 sur les 300 résultats : il ne distingue pas les instances exposées des instances isolées."
    b:
      en: "Fix availability shows whether a patched package exists, not how exposed each instance is."
      fr: "La disponibilité d'un correctif indique si un paquet corrigé existe, et non le degré d'exposition de chaque instance."
    c:
      en: "Analyzing network paths instance by instance and merging the results by hand is far more effort than using the score that Inspector already computes."
      fr: "Analyser les chemins réseau instance par instance et fusionner les résultats à la main demande bien plus d'effort que d'utiliser le score qu'Inspector calcule déjà."
references:
  - title: "Viewing the Amazon Inspector score and understanding vulnerability intelligence details - Amazon Inspector"
    url: https://docs.aws.amazon.com/inspector/latest/user/findings-understanding-score.html
