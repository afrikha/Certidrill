id: scsc03-2b-cw-cross-account-insights
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs workloads in 40 AWS accounts in AWS Organizations, all in the same AWS Region. Each account sends application logs and Amazon VPC flow logs to Amazon CloudWatch Logs log groups in that account. The security team works from a security tooling account and must run CloudWatch Logs Insights queries that search the log groups of all 40 accounts at once. Accounts that are added to the organization later must be included automatically. The logs must not be copied to another storage location.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des charges de travail dans 40 comptes AWS d'AWS Organizations, tous dans la même Région AWS. Chaque compte envoie les journaux applicatifs et les journaux de flux Amazon VPC dans des groupes de journaux Amazon CloudWatch Logs de ce compte. L'équipe de sécurité travaille depuis un compte d'outillage de sécurité et doit exécuter des requêtes CloudWatch Logs Insights qui interrogent en une seule fois les groupes de journaux des 40 comptes. Les comptes ajoutés plus tard à l'organisation doivent être inclus automatiquement. Les journaux ne doivent pas être copiés vers un autre emplacement de stockage.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure CloudWatch cross-account observability with the security tooling account as the monitoring account, and link the organization's accounts as source accounts that share their log groups.", fr: "Configurer l'observabilité entre comptes CloudWatch avec le compte d'outillage de sécurité comme compte de surveillance, et lier les comptes de l'organisation comme comptes sources qui partagent leurs groupes de journaux." }
    - id: b
      text: { en: "Create subscription filters in every account that stream the log groups to an Amazon Data Firehose stream that writes to an S3 bucket in the security tooling account, and query the bucket with Amazon Athena.", fr: "Créer dans chaque compte des filtres d'abonnement qui diffusent les groupes de journaux vers un flux Amazon Data Firehose qui écrit dans un compartiment S3 du compte d'outillage de sécurité, puis interroger le compartiment avec Amazon Athena." }
    - id: c
      text: { en: "Deploy an IAM role to every account with a StackSet, and have analysts assume each role and run the Logs Insights query in each account in turn.", fr: "Déployer un rôle IAM dans chaque compte avec un StackSet, et faire assumer chaque rôle par les analystes pour exécuter la requête Logs Insights dans chaque compte à tour de rôle." }
    - id: d
      text: { en: "Run a daily CreateExportTask call in every account that exports the log groups to an S3 bucket in the security tooling account, and run Logs Insights on the exported data.", fr: "Exécuter chaque jour dans chaque compte un appel CreateExportTask qui exporte les groupes de journaux vers un compartiment S3 du compte d'outillage de sécurité, puis exécuter Logs Insights sur les données exportées." }
answer: { optionId: a }
explanation:
  correct:
    en: "Cross-account observability lets a monitoring account search and analyze the log groups that linked source accounts share, without copying them. The monitoring account owns a sink, and the source accounts create links to it; linking the whole organization or an OU onboards new accounts automatically. The feature works within a Region, which matches this environment, and has no extra charge for logs."
    fr: "L'observabilité entre comptes permet à un compte de surveillance de rechercher et d'analyser les groupes de journaux que les comptes sources liés partagent, sans les copier. Le compte de surveillance possède un récepteur (sink) auquel les comptes sources se lient ; lier toute l'organisation ou une unité d'organisation intègre automatiquement les nouveaux comptes. La fonctionnalité fonctionne au sein d'une Région, ce qui correspond à cet environnement, et n'entraîne aucun coût supplémentaire pour les journaux."
  options:
    b:
      en: "Streaming every log group to Amazon S3 creates a second copy of the logs, which the company forbids, and replaces Logs Insights with Athena."
      fr: "Diffuser chaque groupe de journaux vers Amazon S3 crée une seconde copie des journaux, ce que l'entreprise interdit, et remplace Logs Insights par Athena."
    c:
      en: "Assuming a role per account gives access but produces 40 separate queries; no single query spans all accounts, and new accounts need the role first."
      fr: "Assumer un rôle par compte donne l'accès mais produit 40 requêtes distinctes ; aucune requête ne couvre tous les comptes, et les nouveaux comptes doivent d'abord recevoir le rôle."
    d:
      en: "Export tasks copy the logs to Amazon S3, which is forbidden, add up to a day of delay, and Logs Insights does not query objects in S3."
      fr: "Les tâches d'exportation copient les journaux dans Amazon S3, ce qui est interdit, ajoutent jusqu'à un jour de retard, et Logs Insights n'interroge pas des objets S3."
references:
  - title: "CloudWatch cross-account observability - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Unified-Cross-Account.html
