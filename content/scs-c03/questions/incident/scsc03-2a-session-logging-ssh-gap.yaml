id: scsc03-2a-session-logging-ssh-gap
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's administrators access Amazon EC2 instances only through AWS Systems Manager Session Manager. Session logging to an S3 bucket in the log archive account is enabled so that the commands run on instances during an incident are kept as evidence. An investigation found no logs for several sessions that administrators had opened with SSH through Session Manager.

    Which solution will make sure that all future sessions are logged?
  fr: |-
    Les administrateurs d'AnyCompany n'accèdent aux instances Amazon EC2 qu'au moyen d'AWS Systems Manager Session Manager. La journalisation des sessions vers un compartiment S3 du compte d'archivage des journaux est activée afin que les commandes exécutées sur les instances pendant un incident soient conservées comme preuves. Une investigation n'a trouvé aucun journal pour plusieurs sessions que des administrateurs avaient ouvertes avec SSH au moyen de Session Manager.

    Quelle solution permet de garantir que toutes les sessions futures sont journalisées ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable the streaming of session data to Amazon CloudWatch Logs in addition to the delivery to the S3 bucket.
        fr: |-
          Activer la diffusion en continu des données de session vers Amazon CloudWatch Logs en plus de la livraison dans le compartiment S3.
    - id: b
      text:
        en: |-
          Install the screen utility on the Linux instances so that the output of the sessions is no longer truncated.
        fr: |-
          Installer l'utilitaire screen sur les instances Linux afin que la sortie des sessions ne soit plus tronquée.
    - id: c
      text:
        en: |-
          Deny the administrators ssm:StartSession on the AWS-StartSSHSession and AWS-StartPortForwardingSession documents.
        fr: |-
          Refuser aux administrateurs ssm:StartSession sur les documents AWS-StartSSHSession et AWS-StartPortForwardingSession.
    - id: d
      text:
        en: |-
          Encrypt the session data with an AWS KMS key so that Session Manager can record the content of SSH sessions.
        fr: |-
          Chiffrer les données de session avec une clé AWS KMS afin que Session Manager puisse enregistrer le contenu des sessions SSH.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Session Manager cannot log sessions that connect through port forwarding or SSH, because SSH encrypts the session data inside the TLS connection and Session Manager only tunnels it. Denying the documents that start SSH and port forwarding sessions leaves standard shell sessions, whose commands and output are logged.
    fr: |-
      Session Manager ne peut pas journaliser les sessions qui se connectent par redirection de port ou par SSH, car SSH chiffre les données de session à l'intérieur de la connexion TLS et Session Manager ne fait que les acheminer en tunnel. Refuser les documents qui démarrent les sessions SSH et de redirection de port ne laisse que des sessions shell standard, dont les commandes et la sortie sont journalisées.
  options:
    a:
      en: |-
        Streaming has the same limitation: the content of SSH sessions is not visible to Session Manager.
      fr: |-
        La diffusion en continu a la même limitation : le contenu des sessions SSH n'est pas visible pour Session Manager.
    b:
      en: |-
        The screen utility prevents truncated logs of shell sessions; it does not make SSH sessions loggable.
      fr: |-
        L'utilitaire screen évite les journaux tronqués des sessions shell ; il ne rend pas les sessions SSH journalisables.
    d:
      en: |-
        Encrypting session data does not give Session Manager access to the content that SSH encrypts.
      fr: |-
        Chiffrer les données de session ne donne pas à Session Manager l'accès au contenu chiffré par SSH.
references:
  - title: "Enabling and disabling session logging - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-logging.html
