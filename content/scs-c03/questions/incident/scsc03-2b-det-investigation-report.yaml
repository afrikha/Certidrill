id: scsc03-2b-det-investigation-report
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team suspects that the IAM role DataPipelineRole was misused last week. Amazon Detective has been enabled for a year. The team needs an automatically generated report for that role over a time window that it chooses. The report must list indicators of compromise, including tactics, techniques, and procedures mapped to MITRE ATT&CK, IP addresses flagged by threat intelligence, impossible travel, and newly used geolocations and user agents, together with mitigation recommendations.

    Which solution will meet these requirements?
  fr: |
    L'équipe de sécurité soupçonne que le rôle IAM DataPipelineRole a été utilisé de manière abusive la semaine dernière. Amazon Detective est activé depuis un an. L'équipe a besoin d'un rapport généré automatiquement pour ce rôle sur une fenêtre de temps qu'elle choisit. Le rapport doit lister des indicateurs de compromission, notamment les tactiques, techniques et procédures associées à MITRE ATT&CK, les adresses IP signalées par le renseignement sur les menaces, les déplacements impossibles et les nouvelles géolocalisations et agents utilisateurs utilisés, ainsi que des recommandations d'atténuation.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Wait for Amazon GuardDuty Extended Threat Detection to generate an attack sequence finding for the role, and export the finding to Amazon S3.", fr: "Attendre qu'Amazon GuardDuty Extended Threat Detection génère un résultat de séquence d'attaque pour le rôle, puis exporter le résultat vers Amazon S3." }
    - id: b
      text: { en: "Run a Detective Investigation on the role with the chosen scope time, and review the indicators of compromise and recommendations in the report.", fr: "Exécuter une Detective Investigation sur le rôle avec la période d'analyse (scope time) choisie, et examiner les indicateurs de compromission et les recommandations du rapport." }
    - id: c
      text: { en: "Generate IAM Access Analyzer unused access findings for the role, and review the permissions that the role did not use.", fr: "Générer des résultats d'accès inutilisés IAM Access Analyzer pour le rôle, et examiner les autorisations que le rôle n'a pas utilisées." }
    - id: d
      text: { en: "Create an AWS Security Hub CSPM custom insight that groups the findings for the role by severity, and export it.", fr: "Créer un aperçu personnalisé AWS Security Hub CSPM qui regroupe par gravité les résultats du rôle, puis l'exporter." }
answer: { optionId: b }
explanation:
  correct:
    en: "Detective Investigation analyzes an IAM user or role for a chosen scope time with machine learning and threat intelligence, and produces a report of indicators of compromise. The report covers TTPs mapped to the MITRE ATT&CK matrix for Enterprise, threat-intelligence flagged IP addresses, impossible travel, related findings and finding groups, and new geolocations, user agents, and ASOs, with recommendations. It can be started from the console or with the StartInvestigation API."
    fr: "Detective Investigation analyse un utilisateur ou un rôle IAM sur une période choisie avec l'apprentissage automatique et le renseignement sur les menaces, et produit un rapport d'indicateurs de compromission. Le rapport couvre les TTP associées à la matrice MITRE ATT&CK for Enterprise, les adresses IP signalées par le renseignement sur les menaces, les déplacements impossibles, les résultats et groupes de résultats liés, ainsi que les nouvelles géolocalisations, nouveaux agents utilisateurs et nouvelles ASO, avec des recommandations. Elle se lance depuis la console ou avec l'API StartInvestigation."
  options:
    a:
      en: "Attack sequence findings appear only when GuardDuty correlates a multi-stage attack within its rolling window; they cannot be requested for a chosen role and time window."
      fr: "Les résultats de séquence d'attaque n'apparaissent que lorsque GuardDuty corrèle une attaque en plusieurs étapes dans sa fenêtre glissante ; ils ne peuvent pas être demandés pour un rôle et une fenêtre de temps choisis."
    c:
      en: "Unused access findings support least privilege by showing unused permissions; they do not analyze activity for indicators of compromise."
      fr: "Les résultats d'accès inutilisés servent le moindre privilège en montrant les autorisations inutilisées ; ils n'analysent pas l'activité à la recherche d'indicateurs de compromission."
    d:
      en: "An insight groups existing findings; it does not analyze the role's activity for impossible travel, new geolocations, or TTPs."
      fr: "Un aperçu regroupe des résultats existants ; il n'analyse pas l'activité du rôle à la recherche de déplacements impossibles, de nouvelles géolocalisations ou de TTP."
references:
  - title: "Detective Investigation - Amazon Detective"
    url: https://docs.aws.amazon.com/detective/latest/userguide/investigations-about.html
  - title: "Understanding a Detective Investigations report - Amazon Detective"
    url: https://docs.aws.amazon.com/detective/latest/userguide/investigations-report-understand.html
