id: scsc03-2b-det-admin-alignment
objective: "2.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses AWS Organizations. A security tooling account is the delegated administrator for Amazon GuardDuty and AWS Security Hub CSPM. The company will now enable Amazon Detective for root cause analysis. Analysts must be able to pivot from GuardDuty findings in the GuardDuty and Security Hub CSPM consoles to the Detective finding profiles, and to archive false-positive GuardDuty findings from Detective. Recurring findings must appear in Detective within about 15 minutes instead of up to 6 hours.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany utilise AWS Organizations. Un compte d'outillage de sécurité est l'administrateur délégué d'Amazon GuardDuty et d'AWS Security Hub CSPM. L'entreprise va maintenant activer Amazon Detective pour l'analyse des causes racines. Les analystes doivent pouvoir passer des résultats GuardDuty des consoles GuardDuty et Security Hub CSPM aux profils de résultat Detective, et archiver depuis Detective les résultats GuardDuty qui sont des faux positifs. Les résultats récurrents doivent apparaître dans Detective en 15 minutes environ, au lieu de jusqu'à 6 heures.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Designate the security tooling account as the Detective administrator account for the organization.", fr: "Désigner le compte d'outillage de sécurité comme compte administrateur Detective de l'organisation." }
    - id: b
      text: { en: "Enable Detective separately in each member account so that every account has its own behavior graph.", fr: "Activer Detective séparément dans chaque compte membre pour que chaque compte ait son propre graphe de comportement." }
    - id: c
      text: { en: "Enable the optional EKS audit logs source package in the Detective behavior graph.", fr: "Activer le package de sources facultatif EKS audit logs dans le graphe de comportement Detective." }
    - id: d
      text: { en: "In the GuardDuty administrator account, change the frequency of notifications for updated findings to 15 minutes.", fr: "Dans le compte administrateur GuardDuty, passer à 15 minutes la fréquence des notifications des résultats mis à jour." }
    - id: e
      text: { en: "Create an Amazon EventBridge rule that sends every GuardDuty finding to the Detective API as soon as it is generated.", fr: "Créer une règle Amazon EventBridge qui envoie chaque résultat GuardDuty à l'API Detective dès sa génération." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Detective recommends using the same administrator account as GuardDuty and Security Hub CSPM: the integrations then let analysts pivot from a GuardDuty finding to its Detective profile and archive the finding from Detective. GuardDuty sends updates of recurring findings every 6 hours by default, so the GuardDuty administrator should set the frequency to 15 minutes; this has no effect on GuardDuty cost."
    fr: "Detective recommande d'utiliser le même compte administrateur que GuardDuty et Security Hub CSPM : les intégrations permettent alors aux analystes de passer d'un résultat GuardDuty à son profil Detective et d'archiver le résultat depuis Detective. GuardDuty envoie par défaut les mises à jour des résultats récurrents toutes les 6 heures : l'administrateur GuardDuty doit régler la fréquence sur 15 minutes, ce qui n'a aucun effet sur le coût de GuardDuty."
  options:
    b:
      en: "Separate behavior graphs per account break the alignment with the GuardDuty administrator and split the data that analysts need to correlate."
      fr: "Des graphes de comportement distincts par compte rompent l'alignement avec l'administrateur GuardDuty et dispersent les données que les analystes doivent corréler."
    c:
      en: "EKS audit logs add Kubernetes data to the graph but do not enable the pivots or speed up the arrival of findings."
      fr: "Les journaux d'audit EKS ajoutent des données Kubernetes au graphe, mais n'activent pas les passages entre consoles et n'accélèrent pas l'arrivée des résultats."
    e:
      en: "Detective ingests GuardDuty findings itself; no EventBridge rule or API call feeds findings into a behavior graph."
      fr: "Detective ingère lui-même les résultats GuardDuty ; aucune règle EventBridge ni appel d'API n'alimente un graphe de comportement en résultats."
references:
  - title: "Recommendations to enable Detective - Amazon Detective"
    url: https://docs.aws.amazon.com/detective/latest/userguide/detective-recommendations.html
