id: scsc03-2a-security-lake-evidence
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany has 50 accounts in AWS Organizations. The security team wants to collect AWS CloudTrail management events, VPC Flow Logs, Route 53 Resolver query logs, and Amazon EKS audit logs from all accounts in two AWS Regions into one location, in a normalized open format and with centrally managed retention, so that responders can query evidence across sources. An organization trail already records management events. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany dispose de 50 comptes dans AWS Organizations. L'équipe de sécurité veut collecter les événements de gestion AWS CloudTrail, les journaux de flux VPC, les journaux de requêtes du résolveur Route 53 et les journaux d'audit Amazon EKS de tous les comptes dans deux Régions AWS en un seul emplacement, dans un format ouvert normalisé et avec une conservation gérée de manière centralisée, afin que les intervenants puissent interroger les preuves de toutes les sources. Un journal de suivi d'organisation enregistre déjà les événements de gestion. L'équipe veut le MOINS de frais opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS CloudTrail Lake event data store for the organization, and import the other logs into it with a scheduled job.
        fr: |-
          Créer un magasin de données d'événements AWS CloudTrail Lake pour l'organisation, et y importer les autres journaux avec une tâche planifiée.
    - id: b
      text:
        en: |-
          Enable Amazon Security Lake from a delegated administrator account, add these log sources in both Regions, and set a rollup Region and retention.
        fr: |-
          Activer Amazon Security Lake depuis un compte d'administrateur délégué, ajouter ces sources de journaux dans les deux Régions, et définir une Région de regroupement (rollup) et la conservation.
    - id: c
      text:
        en: |-
          Create a subscription filter and an Amazon Data Firehose stream in every account to send each log type to a central Amazon OpenSearch Service domain.
        fr: |-
          Créer dans chaque compte un filtre d'abonnement et un flux Amazon Data Firehose pour envoyer chaque type de journal à un domaine Amazon OpenSearch Service central.
    - id: d
      text:
        en: |-
          Configure each service to deliver its logs to a central S3 bucket, and write AWS Glue ETL jobs that convert the logs into a common schema.
        fr: |-
          Configurer chaque service pour livrer ses journaux dans un compartiment S3 central, et écrire des tâches ETL AWS Glue qui convertissent les journaux dans un schéma commun.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Security Lake natively collects CloudTrail management and data events, EKS audit logs, Route 53 Resolver query logs, Security Hub CSPM findings, VPC Flow Logs, and AWS WAF logs, and stores them in the OCSF open format in S3. These sources need no separate logging configuration, except CloudTrail management events, which the organization trail already records.
    fr: |-
      Security Lake collecte nativement les événements de gestion et de données CloudTrail, les journaux d'audit EKS, les journaux de requêtes du résolveur Route 53, les résultats Security Hub CSPM, les journaux de flux VPC et les journaux AWS WAF, et les stocke au format ouvert OCSF dans S3. Ces sources n'exigent pas de configuration de journalisation distincte, sauf les événements de gestion CloudTrail, que le journal de suivi d'organisation enregistre déjà.
  options:
    a:
      en: |-
        CloudTrail Lake has been closed to new customers since May 31, 2026, so it cannot be part of a new design.
      fr: |-
        CloudTrail Lake est fermé aux nouveaux clients depuis le 31 mai 2026 : il ne peut pas faire partie d'une nouvelle conception.
    c:
      en: |-
        Building and operating pipelines in every account is far more overhead, and the logs are not normalized to an open schema.
      fr: |-
        Construire et exploiter des pipelines dans chaque compte représente bien plus de frais, et les journaux ne sont pas normalisés selon un schéma ouvert.
    d:
      en: |-
        Custom ETL jobs and their schema must be written and maintained by the team.
      fr: |-
        Les tâches ETL personnalisées et leur schéma doivent être écrits et maintenus par l'équipe.
references:
  - title: "Collecting data from AWS services in Security Lake - Amazon Security Lake"
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/internal-sources.html
