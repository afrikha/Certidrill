id: scsc03-2b-dnsfw-fms-c2
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon GuardDuty reports Backdoor:EC2/C&CActivity.B!DNS findings in several accounts for instances that query c2.example.org. AnyCompany has 200 VPCs across 50 accounts in AWS Organizations, all of which use the Amazon-provided DNS resolver, and new VPCs are created every week. The security team must prevent resolution of the domain in every current and future VPC, with central management and the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Amazon GuardDuty signale dans plusieurs comptes des résultats Backdoor:EC2/C&CActivity.B!DNS pour des instances qui interrogent c2.example.org. AnyCompany possède 200 VPC répartis dans 50 comptes d'AWS Organizations, qui utilisent tous le résolveur DNS fourni par Amazon, et de nouveaux VPC sont créés chaque semaine. L'équipe de sécurité doit empêcher la résolution du domaine dans tous les VPC actuels et futurs, avec une gestion centralisée et le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a DNS Firewall rule group with a domain list that contains the domain and a BLOCK action, and apply it as a first rule group with an AWS Firewall Manager DNS Firewall policy scoped to the organization.", fr: "Créer un groupe de règles DNS Firewall avec une liste de domaines qui contient le domaine et une action BLOCK, puis l'appliquer comme premier groupe de règles avec une politique DNS Firewall AWS Firewall Manager dont l'étendue est l'organisation." }
    - id: b
      text: { en: "Add the domain to a GuardDuty threat entity list in the GuardDuty administrator account so that it applies to all member accounts.", fr: "Ajouter le domaine à une liste d'entités de menace GuardDuty dans le compte administrateur GuardDuty pour qu'elle s'applique à tous les comptes membres." }
    - id: c
      text: { en: "Deploy AWS Network Firewall in every VPC with a stateful domain list rule group that denies the domain, and update the route tables to send traffic through the firewall endpoints.", fr: "Déployer AWS Network Firewall dans chaque VPC avec un groupe de règles à état de type liste de domaines qui refuse le domaine, puis mettre à jour les tables de routage pour faire passer le trafic par les points de terminaison du pare-feu." }
    - id: d
      text: { en: "Attach an SCP to the organization root that denies all route53resolver actions in the member accounts.", fr: "Attacher à la racine de l'organisation une SCP qui refuse toutes les actions route53resolver dans les comptes membres." }
answer: { optionId: a }
explanation:
  correct:
    en: "Route 53 Resolver DNS Firewall blocks matching queries and can answer them with NXDOMAIN, NODATA, or an override. A Firewall Manager DNS Firewall policy associates centrally defined rule groups with every in-scope VPC across the organization, including VPCs created later, and first rule groups take priority over rule groups that account owners add."
    fr: "Route 53 Resolver DNS Firewall bloque les requêtes correspondantes et peut y répondre par NXDOMAIN, NODATA ou un remplacement. Une politique DNS Firewall de Firewall Manager associe des groupes de règles définis centralement à chaque VPC concerné de l'organisation, y compris les VPC créés plus tard, et les premiers groupes de règles sont prioritaires sur ceux que les propriétaires de comptes ajoutent."
  options:
    b:
      en: "A threat list makes GuardDuty generate findings for the domain; it detects the queries but does not block them."
      fr: "Une liste de menaces fait générer par GuardDuty des résultats pour le domaine ; elle détecte les requêtes sans les bloquer."
    c:
      en: "A firewall in each of 200 VPCs with route table changes, repeated for every new VPC, is far more operational overhead than a DNS Firewall policy."
      fr: "Un pare-feu dans chacun des 200 VPC avec des modifications des tables de routage, à répéter pour chaque nouveau VPC, représente bien plus de charge opérationnelle qu'une politique DNS Firewall."
    d:
      en: "SCPs control AWS API calls made by principals; DNS queries from instances are not API calls and are not affected."
      fr: "Les SCP contrôlent les appels d'API AWS effectués par des principaux ; les requêtes DNS des instances ne sont pas des appels d'API et ne sont pas concernées."
references:
  - title: "Using Amazon Route 53 Resolver DNS Firewall policies in Firewall Manager - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/dns-firewall-policies.html
  - title: "Rule actions in DNS Firewall - Amazon Route 53"
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-dns-firewall-rule-actions.html
