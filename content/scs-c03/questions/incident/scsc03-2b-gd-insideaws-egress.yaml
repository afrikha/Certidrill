id: scsc03-2b-gd-insideaws-egress
objective: "2.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany sends internet-bound and AWS API traffic from its workload VPCs through AWS Transit Gateway to a central egress VPC in the network account 111122223333, which belongs to the organization. GuardDuty is not enabled in the network account. GuardDuty now reports UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS findings for instance credentials of several workload accounts. The security team must validate whether this activity is the expected egress pattern and, if it is, stop alerts for this pattern only, while still detecting the use of instance credentials from any other AWS account.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany fait passer le trafic à destination d'Internet et des API AWS de ses VPC de charge de travail par AWS Transit Gateway vers un VPC de sortie central du compte réseau 111122223333, qui appartient à l'organisation. GuardDuty n'est pas activé dans le compte réseau. GuardDuty signale désormais des résultats UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS pour des informations d'identification d'instance de plusieurs comptes de charge de travail. L'équipe de sécurité doit valider s'il s'agit du schéma de sortie attendu et, si c'est le cas, arrêter les alertes pour ce seul schéma, tout en continuant à détecter l'utilisation d'informations d'identification d'instance depuis tout autre compte AWS.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Add the account ID 111122223333 to a trusted entity list in the GuardDuty administrator account.", fr: "Ajouter l'ID de compte 111122223333 à une liste d'entités de confiance dans le compte administrateur GuardDuty." }
    - id: b
      text: { en: "Confirm that remoteAccountDetails.accountId in each finding is 111122223333 and that this account is the network account of the organization.", fr: "Vérifier que remoteAccountDetails.accountId vaut 111122223333 dans chaque résultat et que ce compte est le compte réseau de l'organisation." }
    - id: c
      text: { en: "Disable the InstanceCredentialExfiltration.InsideAWS finding type in the detector settings of each workload account.", fr: "Désactiver le type de résultat InstanceCredentialExfiltration.InsideAWS dans les paramètres du détecteur de chaque compte de charge de travail." }
    - id: d
      text: { en: "Archive the current InstanceCredentialExfiltration.InsideAWS findings in the GuardDuty administrator account.", fr: "Archiver les résultats InstanceCredentialExfiltration.InsideAWS actuels dans le compte administrateur GuardDuty." }
    - id: e
      text: { en: "Create a suppression rule that matches the InstanceCredentialExfiltration.InsideAWS finding type and the remote account ID 111122223333.", fr: "Créer une règle de suppression qui correspond au type de résultat InstanceCredentialExfiltration.InsideAWS et à l'ID de compte distant 111122223333." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "The finding identifies the remote account in service.action.awsApiCallAction.remoteAccountDetails.accountId; hub-and-spoke designs with a central egress VPC are a known legitimate cause. Because the network account is not in the GuardDuty multi-account setup, the finding is not marked as affiliated, so the team confirms the account itself. GuardDuty's guidance for expected behavior is a suppression rule on the finding type and the remote account ID, which leaves findings for any other remote account active."
    fr: "Le résultat identifie le compte distant dans service.action.awsApiCallAction.remoteAccountDetails.accountId ; les architectures en étoile avec un VPC de sortie central sont une cause légitime connue. Comme le compte réseau ne fait pas partie de la configuration multicompte GuardDuty, le résultat n'est pas marqué comme affilié : l'équipe vérifie donc le compte elle-même. Pour un comportement attendu, GuardDuty recommande une règle de suppression sur le type de résultat et l'ID de compte distant, ce qui laisse actifs les résultats de tout autre compte distant."
  options:
    a:
      en: "Entity lists accept IP addresses, CIDR ranges, and domains, not AWS account IDs."
      fr: "Les listes d'entités acceptent des adresses IP, des plages CIDR et des domaines, et non des ID de compte AWS."
    c:
      en: "GuardDuty has no setting that disables a single finding type, and disabling it would also hide use from other accounts."
      fr: "GuardDuty n'offre aucun paramètre qui désactive un type de résultat donné, et le désactiver masquerait aussi l'utilisation depuis d'autres comptes."
    d:
      en: "Archiving handles only the existing findings; the expected traffic keeps generating new ones."
      fr: "L'archivage ne traite que les résultats existants ; le trafic attendu continue d'en générer de nouveaux."
references:
  - title: "GuardDuty IAM finding types - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-iam.html
  - title: "Suppression rules in GuardDuty - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/findings_suppression-rule.html
