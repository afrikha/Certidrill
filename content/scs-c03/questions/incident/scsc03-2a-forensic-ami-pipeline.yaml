id: scsc03-2a-forensic-ami-pipeline
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany's incident response plan requires that responders can launch a forensic workstation in each forensics account within minutes of an incident. The workstation needs a set of forensic tools that must be patched every month. The team does not want to install tools during an incident.

    Which solution will meet these requirements?
  fr: |-
    Le plan de réponse aux incidents d'AnyCompany exige que les intervenants puissent lancer un poste d'investigation dans chaque compte d'investigation quelques minutes après un incident. Le poste a besoin d'un ensemble d'outils d'investigation qui doivent être corrigés chaque mois. L'équipe ne veut pas installer d'outils pendant un incident.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Systems Manager Distributor package with the tools, and install it on a new instance when an incident starts.
        fr: |-
          Créer un package AWS Systems Manager Distributor avec les outils, et l'installer sur une nouvelle instance au début d'un incident.
    - id: b
      text:
        en: |-
          Launch a current Amazon Linux AMI during each incident, and run a user data script that downloads and installs the tools.
        fr: |-
          Lancer une AMI Amazon Linux à jour lors de chaque incident, et exécuter un script de données utilisateur qui télécharge et installe les outils.
    - id: c
      text:
        en: |-
          Create an EC2 Image Builder pipeline that builds a forensic AMI with the tools every month and distributes it to the forensics accounts.
        fr: |-
          Créer un pipeline EC2 Image Builder qui construit chaque mois une AMI d'investigation avec les outils et la distribue aux comptes d'investigation.
    - id: d
      text:
        en: |-
          Create an Amazon EBS snapshot of a configured workstation once, and create volumes from it in the forensics accounts when an incident starts.
        fr: |-
          Créer une fois un instantané Amazon EBS d'un poste configuré, et créer des volumes à partir de celui-ci dans les comptes d'investigation au début d'un incident.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An EC2 Image Builder pipeline rebuilds the forensic AMI on a schedule with the latest patches and tools and distributes it to the target accounts and Regions, so responders launch a ready workstation from an existing forensic AMI, as the Automated Forensics Orchestrator for Amazon EC2 and EKS architecture expects.
    fr: |-
      Un pipeline EC2 Image Builder reconstruit l'AMI d'investigation selon une planification avec les derniers correctifs et outils et la distribue aux comptes et Régions cibles : les intervenants lancent un poste prêt à partir d'une AMI d'investigation existante, comme le prévoit l'architecture Automated Forensics Orchestrator for Amazon EC2 and EKS.
  options:
    a:
      en: |-
        The tools are still installed during the incident, which takes time and needs access to the package.
      fr: |-
        Les outils sont toujours installés pendant l'incident, ce qui prend du temps et exige l'accès au package.
    b:
      en: |-
        Downloading and installing tools at launch is the delay that the team wants to avoid, and it needs internet access.
      fr: |-
        Télécharger et installer les outils au lancement est le délai que l'équipe veut éviter, et cela exige un accès à Internet.
    d:
      en: |-
        A one-time snapshot is never patched, so the tools become outdated.
      fr: |-
        Un instantané pris une seule fois n'est jamais corrigé : les outils deviennent obsolètes.
references:
  - title: "Architecture overview - Automated Forensics Orchestrator for Amazon EC2 and EKS"
    url: https://docs.aws.amazon.com/solutions/latest/automated-forensics-orchestrator-for-amazon-ec2/architecture-overview.html
