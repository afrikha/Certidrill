id: scsc03-2a-ops-run-related
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A responder at AnyCompany is working on an AWS Systems Manager OpsCenter OpsItem that was created for a suspicious Amazon EC2 instance. The responder must run an AWS-owned Automation runbook against that instance from the OpsItem, and the run must stay visible in the OpsItem for later review.

    What should the responder do?
  fr: |-
    Un intervenant d'AnyCompany travaille sur un OpsItem AWS Systems Manager OpsCenter créé pour une instance Amazon EC2 suspecte. L'intervenant doit exécuter un runbook Automation détenu par AWS sur cette instance à partir de l'OpsItem, et l'exécution doit rester visible dans l'OpsItem pour un examen ultérieur.

    Que doit faire l'intervenant ?
body:
  options:
    - id: a
      text:
        en: |-
          Open the instance under Related resources in the OpsItem, choose Run automation, and select the runbook.
        fr: |-
          Ouvrir l'instance sous Related resources dans l'OpsItem, choisir Run automation, puis sélectionner le runbook.
    - id: b
      text:
        en: |-
          Start the runbook from the Automation console, and paste the execution ID into the description of the OpsItem.
        fr: |-
          Démarrer le runbook depuis la console Automation, puis coller l'ID d'exécution dans la description de l'OpsItem.
    - id: c
      text:
        en: |-
          Create a State Manager association that applies the runbook to the instance, and add the association ID to the OpsItem.
        fr: |-
          Créer une association State Manager qui applique le runbook à l'instance, puis ajouter l'ID de l'association à l'OpsItem.
    - id: d
      text:
        en: |-
          Start a Session Manager session on the instance, and run the commands of the runbook steps from the shell.
        fr: |-
          Démarrer une session Session Manager sur l'instance, puis exécuter depuis le shell les commandes des étapes du runbook.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      From the related resource of an OpsItem, Run automation lets the responder choose and execute a runbook against that resource. The system associates the runbook with the related resource, and OpsCenter keeps a 30-day record of the Automation executions of the OpsItem, with their status and failure details.
    fr: |-
      À partir de la ressource associée d'un OpsItem, Run automation permet à l'intervenant de choisir et d'exécuter un runbook sur cette ressource. Le système associe le runbook à la ressource associée, et OpsCenter conserve un historique de 30 jours des exécutions Automation de l'OpsItem, avec leur statut et le détail des échecs.
  options:
    b:
      en: |-
        A pasted ID is a manual note; the execution is not associated with the OpsItem or its related resource.
      fr: |-
        Un ID collé est une note manuelle ; l'exécution n'est pas associée à l'OpsItem ni à sa ressource associée.
    c:
      en: |-
        State Manager applies a configuration on a schedule or continuously; it is not a one-time response tracked in the OpsItem.
      fr: |-
        State Manager applique une configuration selon une planification ou en continu ; ce n'est pas une réponse ponctuelle suivie dans l'OpsItem.
    d:
      en: |-
        Typing the commands by hand does not run the runbook, and nothing is recorded in the OpsItem.
      fr: |-
        Saisir les commandes à la main n'exécute pas le runbook, et rien n'est enregistré dans l'OpsItem.
references:
  - title: "Remediate OpsItem issues - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-remediating.html
