id: scsc03-2a-ops-dedup-finding
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany has a custom Amazon EventBridge rule that creates an AWS Systems Manager OpsCenter OpsItem for each high severity Amazon GuardDuty finding. GuardDuty publishes updates for an active finding every 15 minutes, and each update now creates another OpsItem for the same finding. The incident response team wants only one open OpsItem for each finding. If a responder resolves the OpsItem and the same finding is updated again later, a new OpsItem must be created.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany dispose d'une règle Amazon EventBridge personnalisée qui crée un OpsItem AWS Systems Manager OpsCenter pour chaque résultat Amazon GuardDuty de gravité élevée. GuardDuty publie les mises à jour d'un résultat actif toutes les 15 minutes, et chaque mise à jour crée désormais un autre OpsItem pour le même résultat. L'équipe de réponse aux incidents ne veut qu'un seul OpsItem ouvert pour chaque résultat. Si un intervenant résout l'OpsItem et que le même résultat est de nouveau mis à jour plus tard, un nouvel OpsItem doit être créé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Change the GuardDuty frequency for updated findings to 6 hours so that fewer update events reach the EventBridge rule.
        fr: |-
          Passer à 6 heures la fréquence de GuardDuty pour les résultats mis à jour afin que moins d'événements de mise à jour atteignent la règle EventBridge.
    - id: b
      text:
        en: |-
          Add a condition to the event pattern of the rule so that it matches only the events in which detail.service.count equals 1.
        fr: |-
          Ajouter une condition au modèle d'événement de la règle afin qu'elle ne corresponde qu'aux événements dans lesquels detail.service.count est égal à 1.
    - id: c
      text:
        en: |-
          Send the events to an Amazon SQS FIFO queue with content-based deduplication, and create the OpsItems from the messages of the queue.
        fr: |-
          Envoyer les événements à une file d'attente Amazon SQS FIFO avec déduplication basée sur le contenu, et créer les OpsItems à partir des messages de la file d'attente.
    - id: d
      text:
        en: |-
          In the input transformer of the rule, set the /aws/dedup operational data to a dedupString value that contains the GuardDuty finding ID.
        fr: |-
          Dans le transformateur d'entrée de la règle, définir la donnée opérationnelle /aws/dedup sur une valeur dedupString qui contient l'ID du résultat GuardDuty.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      OpsCenter stores a hash of the deduplication string and the resource for each OpsItem. When another OpsItem is requested with the same string, none is created while the existing OpsItem is open or in progress, and a new one is created if the existing OpsItem is resolved. A dedupString built from the finding ID gives exactly one open OpsItem per finding.
    fr: |-
      OpsCenter enregistre pour chaque OpsItem un hachage de la chaîne de déduplication et de la ressource. Lorsqu'un autre OpsItem est demandé avec la même chaîne, aucun n'est créé tant que l'OpsItem existant est ouvert ou en cours, et un nouveau est créé si l'OpsItem existant est résolu. Une valeur dedupString construite à partir de l'ID du résultat donne exactement un OpsItem ouvert par résultat.
  options:
    a:
      en: |-
        Fewer updates still create a duplicate OpsItem for every update that is published, only less often.
      fr: |-
        Moins de mises à jour créent toujours un OpsItem en double pour chaque mise à jour publiée, simplement moins souvent.
    b:
      en: |-
        Only the first occurrence would match, so a later update of a finding whose OpsItem was resolved would never create the required new OpsItem.
      fr: |-
        Seule la première occurrence correspondrait : une mise à jour ultérieure d'un résultat dont l'OpsItem a été résolu ne créerait jamais le nouvel OpsItem exigé.
    c:
      en: |-
        SQS deduplication applies only to identical messages within a five-minute interval, and creating OpsItems from the queue requires custom code.
      fr: |-
        La déduplication SQS ne s'applique qu'aux messages identiques dans un intervalle de cinq minutes, et la création d'OpsItems à partir de la file d'attente exige du code personnalisé.
references:
  - title: "Managing duplicate OpsItems - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-working-deduplication.html
