id: scsc03-2a-protect-detection-evidence
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany uses AWS Organizations, an organization trail, and Amazon GuardDuty with a delegated administrator. A threat model shows that an attacker who obtains administrator access in a workload account could try to disable detection and delete evidence before responders act. The security team wants to reduce this blast radius in all workload accounts.

    Which combination of steps will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |-
    AnyCompany utilise AWS Organizations, un journal de suivi (trail) d'organisation et Amazon GuardDuty avec un administrateur délégué. Un modèle de menace montre qu'un attaquant qui obtient un accès administrateur dans un compte de charge de travail pourrait tenter de désactiver la détection et de supprimer des preuves avant que les intervenants agissent. L'équipe de sécurité veut réduire ce rayon d'impact dans tous les comptes de charge de travail.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Attach an SCP to the workload OUs that denies deleting or disassociating GuardDuty detectors and stopping or deleting trails, except for a security role.
        fr: |-
          Attacher aux UO de charge de travail une SCP qui refuse la suppression ou la dissociation des détecteurs GuardDuty et l'arrêt ou la suppression des journaux de suivi, sauf pour un rôle de sécurité.
    - id: b
      text:
        en: |-
          Attach an IAM policy to every administrator role in the workload accounts that denies the GuardDuty and CloudTrail actions that disable logging.
        fr: |-
          Attacher à chaque rôle administrateur des comptes de charge de travail une politique IAM qui refuse les actions GuardDuty et CloudTrail qui désactivent la journalisation.
    - id: c
      text:
        en: |-
          Deploy the AWS Config managed rule cloudtrail-enabled to every workload account, and notify the security team when it becomes noncompliant.
        fr: |-
          Déployer la règle gérée AWS Config cloudtrail-enabled dans chaque compte de charge de travail, et notifier l'équipe de sécurité lorsqu'elle devient non conforme.
    - id: d
      text:
        en: |-
          Deliver the organization trail to an S3 bucket in a separate log archive account that has S3 Object Lock in compliance mode.
        fr: |-
          Livrer le journal de suivi d'organisation dans un compartiment S3 d'un compte d'archivage des journaux distinct qui utilise S3 Object Lock en mode conformité.
    - id: e
      text:
        en: |-
          Enable S3 Versioning on a bucket in each workload account, and deliver a copy of the CloudTrail logs of the account to that bucket.
        fr: |-
          Activer S3 Versioning sur un compartiment de chaque compte de charge de travail, et y livrer une copie des journaux CloudTrail du compte.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      SCPs apply to every user and role of member accounts, including the root user, and cannot be changed from those accounts, so a compromised administrator cannot disable the detectors or trails. Logs delivered to another account under Object Lock compliance mode cannot be overwritten or deleted by any user, so the evidence survives the compromise.
    fr: |-
      Les SCP s'appliquent à tous les utilisateurs et rôles des comptes membres, y compris l'utilisateur root, et ne peuvent pas être modifiées depuis ces comptes : un administrateur compromis ne peut pas désactiver les détecteurs ni les journaux de suivi. Les journaux livrés dans un autre compte sous Object Lock en mode conformité ne peuvent être ni écrasés ni supprimés par aucun utilisateur : les preuves survivent à la compromission.
  options:
    b:
      en: |-
        An administrator of the account can detach or edit the IAM policy before disabling detection.
      fr: |-
        Un administrateur du compte peut détacher ou modifier la politique IAM avant de désactiver la détection.
    c:
      en: |-
        A Config rule detects a stopped trail after the fact; it does not prevent the action or protect the evidence.
      fr: |-
        Une règle Config détecte un journal de suivi arrêté après coup ; elle n'empêche pas l'action et ne protège pas les preuves.
    e:
      en: |-
        A bucket in the compromised account can be emptied, including its versions, by its administrator.
      fr: |-
        Un compartiment du compte compromis peut être vidé, versions comprises, par son administrateur.
references:
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
  - title: "Locking objects with Object Lock - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
