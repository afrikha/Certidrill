id: scsc03-2a-fis-stop-condition
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany uses AWS FIS in a staging account to test an incident runbook. The experiment runs the aws:network:disrupt-connectivity action on an application subnet for 30 minutes while responders practice. The experiment must end automatically if, at any time during the experiment, the error rate of a dependent payment API becomes unacceptable. An existing Amazon CloudWatch alarm already measures that error rate.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany utilise AWS FIS dans un compte de préproduction pour tester un runbook d'incident. L'expérience exécute l'action aws:network:disrupt-connectivity sur un sous-réseau applicatif pendant 30 minutes pendant que les intervenants s'entraînent. L'expérience doit se terminer automatiquement si, à tout moment pendant l'expérience, le taux d'erreurs d'une API de paiement dépendante devient inacceptable. Une alarme Amazon CloudWatch existante mesure déjà ce taux d'erreurs.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the CloudWatch alarm to the experiment template as a stop condition.
        fr: |-
          Ajouter l'alarme CloudWatch au modèle d'expérience comme condition d'arrêt.
    - id: b
      text:
        en: |-
          Add an aws:cloudwatch:assert-alarm-state action at the start of the experiment that checks that the alarm is in the OK state.
        fr: |-
          Ajouter au début de l'expérience une action aws:cloudwatch:assert-alarm-state qui vérifie que l'alarme est dans l'état OK.
    - id: c
      text:
        en: |-
          Configure the alarm to notify an Amazon SNS topic that the responders monitor, and have them stop the experiment from the console.
        fr: |-
          Configurer l'alarme pour notifier une rubrique Amazon SNS que les intervenants surveillent, et leur faire arrêter l'expérience depuis la console.
    - id: d
      text:
        en: |-
          Reduce the duration of the disrupt-connectivity action to 5 minutes so that any impact on the payment API is limited.
        fr: |-
          Réduire à 5 minutes la durée de l'action disrupt-connectivity afin de limiter tout impact sur l'API de paiement.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A stop condition is a CloudWatch alarm referenced in the experiment template. If the stop condition is triggered while the experiment runs, AWS FIS stops the experiment, which cannot be resumed, so the guardrail applies for the whole 30 minutes without anyone watching.
    fr: |-
      Une condition d'arrêt est une alarme CloudWatch référencée dans le modèle d'expérience. Si la condition d'arrêt est déclenchée pendant l'expérience, AWS FIS arrête l'expérience, qui ne peut pas être reprise : le garde-fou s'applique pendant les 30 minutes sans que personne ait à surveiller.
  options:
    b:
      en: |-
        This action checks the alarm state when it runs; it does not stop the experiment if the alarm fires later.
      fr: |-
        Cette action vérifie l'état de l'alarme au moment où elle s'exécute ; elle n'arrête pas l'expérience si l'alarme se déclenche plus tard.
    c:
      en: |-
        Stopping the experiment depends on people reacting, so it does not end automatically.
      fr: |-
        L'arrêt de l'expérience dépend de la réaction de personnes : il ne se produit pas automatiquement.
    d:
      en: |-
        A shorter action limits exposure but still runs to its end even when the error rate is unacceptable.
      fr: |-
        Une action plus courte limite l'exposition mais s'exécute jusqu'au bout même lorsque le taux d'erreurs est inacceptable.
references:
  - title: "Stop conditions for AWS FIS - AWS Fault Injection Service"
    url: https://docs.aws.amazon.com/fis/latest/userguide/stop-conditions.html
  - title: "AWS FIS Actions reference - AWS Fault Injection Service"
    url: https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html
