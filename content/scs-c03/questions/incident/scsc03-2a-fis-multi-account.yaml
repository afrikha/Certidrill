id: scsc03-2a-fis-multi-account
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's application spans three accounts in one AWS Region: a web account, an API account, and a database account. To validate its incident response plan, the resilience team wants a single AWS FIS experiment that disrupts tagged resources in all three accounts at the same time. The experiment must be owned and logged centrally in a testing account.

    Which solution will meet these requirements?
  fr: |-
    L'application d'AnyCompany s'étend sur trois comptes dans une même Région AWS : un compte web, un compte d'API et un compte de base de données. Pour valider son plan de réponse aux incidents, l'équipe de résilience veut une seule expérience AWS FIS qui perturbe en même temps des ressources étiquetées dans les trois comptes. L'expérience doit être détenue et journalisée de manière centralisée dans un compte de test.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an experiment template in each of the three accounts, and start the three experiments at the same time from an AWS Step Functions workflow.
        fr: |-
          Créer un modèle d'expérience dans chacun des trois comptes, et démarrer les trois expériences en même temps depuis un flux de travail AWS Step Functions.
    - id: b
      text:
        en: |-
          Create a multi-account experiment template in the testing account with a target account configuration for each account that specifies an IAM role in that account.
        fr: |-
          Créer dans le compte de test un modèle d'expérience multicomptes avec une configuration de compte cible pour chaque compte qui spécifie un rôle IAM de ce compte.
    - id: c
      text:
        en: |-
          Create an experiment template in the testing account that lists the ARNs of the resources of the three accounts as targets, with no other configuration.
        fr: |-
          Créer dans le compte de test un modèle d'expérience qui liste comme cibles les ARN des ressources des trois comptes, sans autre configuration.
    - id: d
      text:
        en: |-
          Deploy the experiment template to the three accounts with AWS CloudFormation StackSets, and send the experiment logs to the testing account.
        fr: |-
          Déployer le modèle d'expérience dans les trois comptes avec AWS CloudFormation StackSets, et envoyer les journaux des expériences au compte de test.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A multi-account experiment runs from an orchestrator account that owns the template and the experiment and centralizes logging. Each target account is defined by a target account configuration with the account ID and an IAM role, and consistent tags across the accounts let one experiment resolve targets in all of them.
    fr: |-
      Une expérience multicomptes s'exécute depuis un compte orchestrateur qui détient le modèle et l'expérience et centralise la journalisation. Chaque compte cible est défini par une configuration de compte cible avec l'ID du compte et un rôle IAM, et des étiquettes cohérentes entre les comptes permettent à une seule expérience de résoudre des cibles dans chacun d'eux.
  options:
    a:
      en: |-
        This creates three separate experiments owned by the three accounts, not one experiment owned centrally.
      fr: |-
        Cela crée trois expériences distinctes détenues par les trois comptes, pas une seule expérience détenue de manière centralisée.
    c:
      en: |-
        FIS acts on resources of other accounts only through target account configurations and their IAM roles.
      fr: |-
        FIS n'agit sur les ressources d'autres comptes qu'au moyen de configurations de compte cible et de leurs rôles IAM.
    d:
      en: |-
        StackSets deploy a separate template and experiment in each account, so there is still no single central experiment.
      fr: |-
        StackSets déploie un modèle et une expérience distincts dans chaque compte : il n'y a toujours pas d'expérience centrale unique.
references:
  - title: "Working with multi-account experiments for AWS FIS - AWS Fault Injection Service"
    url: https://docs.aws.amazon.com/fis/latest/userguide/multi-account.html
