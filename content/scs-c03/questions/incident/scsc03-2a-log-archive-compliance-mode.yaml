id: scsc03-2a-log-archive-compliance-mode
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany's log archive account has an existing S3 bucket with S3 Versioning enabled that receives the organization trail and VPC Flow Logs. A regulator requires that every new log object be kept in WORM storage for 7 years, and that nobody, including the root user, can delete or overwrite a log object version or shorten its retention period.

    Which solution will meet these requirements?
  fr: |-
    Le compte d'archivage des journaux d'AnyCompany dispose d'un compartiment S3 existant sur lequel S3 Versioning est activé et qui reçoit le journal de suivi d'organisation et les journaux de flux VPC. Un régulateur exige que chaque nouvel objet journal soit conservé en stockage WORM pendant 7 ans, et que personne, y compris l'utilisateur root, ne puisse supprimer ou écraser une version d'objet journal ni raccourcir sa période de conservation.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable S3 Object Lock on the existing bucket with a default retention period of 7 years in compliance mode.
        fr: |-
          Activer S3 Object Lock sur le compartiment existant avec une période de conservation par défaut de 7 ans en mode conformité.
    - id: b
      text:
        en: |-
          Enable S3 Object Lock on the existing bucket with a default retention period of 7 years in governance mode.
        fr: |-
          Activer S3 Object Lock sur le compartiment existant avec une période de conservation par défaut de 7 ans en mode gouvernance.
    - id: c
      text:
        en: |-
          Enable MFA delete on the bucket, and add a bucket policy that denies s3:DeleteObject and s3:DeleteObjectVersion to every principal.
        fr: |-
          Activer la suppression MFA sur le compartiment, et ajouter une politique de compartiment qui refuse s3:DeleteObject et s3:DeleteObjectVersion à tous les principaux.
    - id: d
      text:
        en: |-
          Create a new bucket with S3 Object Lock, place a legal hold on every log object version, and deliver the logs to that bucket.
        fr: |-
          Créer un nouveau compartiment avec S3 Object Lock, placer une conservation légale sur chaque version d'objet journal, et livrer les journaux dans ce compartiment.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Object Lock can be enabled on an existing versioned bucket, and a default retention period protects every object version placed in the bucket afterward. In compliance mode, no user, including the root user, can overwrite or delete a protected version, change its mode, or shorten its retention period.
    fr: |-
      Object Lock peut être activé sur un compartiment versionné existant, et une période de conservation par défaut protège chaque version d'objet placée ensuite dans le compartiment. En mode conformité, aucun utilisateur, y compris l'utilisateur root, ne peut écraser ni supprimer une version protégée, changer son mode ou raccourcir sa période de conservation.
  options:
    b:
      en: |-
        In governance mode, principals with s3:BypassGovernanceRetention can delete versions or change the retention settings.
      fr: |-
        En mode gouvernance, les principaux qui disposent de s3:BypassGovernanceRetention peuvent supprimer des versions ou modifier les paramètres de conservation.
    c:
      en: |-
        A bucket policy can be changed by an administrator of the account, so it is not WORM storage, and it sets no retention period.
      fr: |-
        Une politique de compartiment peut être modifiée par un administrateur du compte : ce n'est pas un stockage WORM, et elle ne fixe aucune période de conservation.
    d:
      en: |-
        Legal holds have no duration and can be removed by any principal with s3:PutObjectLegalHold, and a new bucket is not needed.
      fr: |-
        Les conservations légales n'ont pas de durée et peuvent être levées par tout principal qui dispose de s3:PutObjectLegalHold, et un nouveau compartiment n'est pas nécessaire.
references:
  - title: "Locking objects with Object Lock - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
  - title: "Configuring S3 Object Lock - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-configure.html
