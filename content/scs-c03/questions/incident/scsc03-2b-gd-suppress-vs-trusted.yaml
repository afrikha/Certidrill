id: scsc03-2b-gd-suppress-vs-trusted
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany routes all internet-bound traffic from its VPCs through an on-premises proxy over AWS Site-to-Site VPN. The proxy egresses from the 203.0.113.0/28 range. Amazon GuardDuty, managed from a delegated administrator account, generates UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS findings every day. The security team validated that the API caller address of every finding is in the proxy range and that the calls match the normal behavior of the instance roles. The team must stop these findings from reaching AWS Security Hub CSPM and Amazon EventBridge, keep the matching findings available for review, and continue to receive every other finding type that involves the proxy range.

    Which solution will meet these requirements?
  fr: |
    AnyCompany fait passer tout le trafic de ses VPC à destination d'Internet par un proxy sur site via AWS Site-to-Site VPN. Le proxy sort depuis la plage 203.0.113.0/28. Amazon GuardDuty, géré depuis un compte administrateur délégué, génère chaque jour des résultats UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS. L'équipe de sécurité a validé que l'adresse de l'appelant d'API de chaque résultat se trouve dans la plage du proxy et que les appels correspondent au comportement normal des rôles d'instance. L'équipe doit empêcher ces résultats d'atteindre AWS Security Hub CSPM et Amazon EventBridge, garder les résultats correspondants consultables, et continuer à recevoir tous les autres types de résultats qui concernent la plage du proxy.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Upload a trusted IP address list that contains 203.0.113.0/28 from the GuardDuty administrator account.", fr: "Charger depuis le compte administrateur GuardDuty une liste d'adresses IP de confiance qui contient 203.0.113.0/28." }
    - id: b
      text: { en: "Create a suppression rule in the GuardDuty administrator account that matches the finding type and an API caller IPv4 address of 203.0.113.0/28.", fr: "Créer dans le compte administrateur GuardDuty une règle de suppression qui correspond au type de résultat et à une adresse IPv4 d'appelant d'API 203.0.113.0/28." }
    - id: c
      text: { en: "Have an analyst archive the matching findings in the GuardDuty console at the end of every day.", fr: "Faire archiver chaque soir par un analyste les résultats correspondants dans la console GuardDuty." }
    - id: d
      text: { en: "Change the EventBridge rule that forwards GuardDuty findings so that its event pattern excludes the InstanceCredentialExfiltration.OutsideAWS finding type.", fr: "Modifier la règle EventBridge qui transfère les résultats GuardDuty pour que son modèle d'événement exclue le type de résultat InstanceCredentialExfiltration.OutsideAWS." }
answer: { optionId: b }
explanation:
  correct:
    en: "A suppression rule archives new findings that match its criteria as soon as GuardDuty generates them, and suppressed findings are not sent to Security Hub CSPM, Amazon S3, Detective, or EventBridge. The findings are still stored as archived findings for 90 days, so they remain available for review. Combining the finding type with the API caller address limits the rule to the validated behavior, and only the administrator account can create it."
    fr: "Une règle de suppression archive dès leur génération les nouveaux résultats qui correspondent à ses critères, et les résultats supprimés ne sont envoyés ni à Security Hub CSPM, ni à Amazon S3, ni à Detective, ni à EventBridge. Les résultats sont tout de même conservés 90 jours comme résultats archivés : ils restent consultables. Combiner le type de résultat avec l'adresse de l'appelant d'API limite la règle au comportement validé, et seul le compte administrateur peut la créer."
  options:
    a:
      en: "GuardDuty generates no CloudTrail or VPC flow log findings at all for addresses in a trusted list, so every other finding type for the range is lost and nothing remains to review."
      fr: "GuardDuty ne génère plus aucun résultat CloudTrail ni VPC Flow Logs pour les adresses d'une liste de confiance : tous les autres types de résultats de la plage sont perdus et rien ne reste à consulter."
    c:
      en: "Findings are sent to Security Hub CSPM and EventBridge when they are generated, so archiving them later does not stop the alerts, and the daily work never ends."
      fr: "Les résultats sont envoyés à Security Hub CSPM et à EventBridge dès leur génération : les archiver ensuite n'arrête pas les alertes, et le travail quotidien ne s'arrête jamais."
    d:
      en: "Excluding the finding type drops it for every source address, including real exfiltration from other IPs, and Security Hub CSPM still receives the findings."
      fr: "Exclure le type de résultat l'écarte pour toutes les adresses sources, y compris une véritable exfiltration depuis d'autres IP, et Security Hub CSPM reçoit toujours les résultats."
references:
  - title: "Suppression rules in GuardDuty - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/findings_suppression-rule.html
  - title: "Customizing threat detection with entity lists and IP address lists - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_upload-lists.html
