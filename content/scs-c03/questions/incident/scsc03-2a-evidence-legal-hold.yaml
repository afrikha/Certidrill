id: scsc03-2a-evidence-legal-hold
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany stores forensic disk images and memory captures in an S3 bucket of its forensics account that has S3 Versioning and S3 Object Lock enabled. The evidence of each case must be protected from deletion and overwrite until the legal team closes the case, which can take an unknown amount of time. Only the legal team's IAM role may remove this protection.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany stocke des images disque et des captures mémoire d'investigation dans un compartiment S3 de son compte d'investigation sur lequel S3 Versioning et S3 Object Lock sont activés. Les preuves de chaque dossier doivent être protégées contre la suppression et l'écrasement jusqu'à ce que l'équipe juridique clôture le dossier, ce qui peut prendre une durée inconnue. Seul le rôle IAM de l'équipe juridique peut lever cette protection.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Apply a compliance-mode retention period of 10 years to each evidence object version so that nobody can delete the evidence.
        fr: |-
          Appliquer à chaque version d'objet de preuve une période de conservation de 10 ans en mode conformité afin que personne ne puisse supprimer les preuves.
    - id: b
      text:
        en: |-
          Place a legal hold on each evidence version, and deny s3:PutObjectLegalHold in the bucket policy to all principals except the legal role.
        fr: |-
          Placer une conservation légale sur chaque version de preuve, et refuser s3:PutObjectLegalHold dans la politique de compartiment à tous les principaux sauf au rôle juridique.
    - id: c
      text:
        en: |-
          Enable MFA delete on the bucket, and give the MFA device of the root user of the forensics account to the legal team.
        fr: |-
          Activer la suppression MFA sur le compartiment, et confier le dispositif MFA de l'utilisateur root du compte d'investigation à l'équipe juridique.
    - id: d
      text:
        en: |-
          Create a lifecycle rule that transitions the evidence to S3 Glacier Deep Archive, and delete the evidence when the case is closed.
        fr: |-
          Créer une règle de cycle de vie qui fait passer les preuves vers S3 Glacier Deep Archive, et supprimer les preuves à la clôture du dossier.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A legal hold has no fixed duration and protects an object version from deletion and overwrite until it is removed, independently of any retention period. Any principal with s3:PutObjectLegalHold can place or remove a hold, so a policy that denies this permission to everyone except the legal team's role makes that role the only one that can end the protection.
    fr: |-
      Une conservation légale n'a pas de durée fixe et protège une version d'objet contre la suppression et l'écrasement jusqu'à sa levée, indépendamment de toute période de conservation. Tout principal qui dispose de s3:PutObjectLegalHold peut placer ou lever une conservation : une politique qui refuse cette autorisation à tous sauf au rôle de l'équipe juridique fait de ce rôle le seul à pouvoir mettre fin à la protection.
  options:
    a:
      en: |-
        A compliance-mode period cannot be shortened by anyone, so the legal team could not release the evidence when the case closes.
      fr: |-
        Une période en mode conformité ne peut être raccourcie par personne : l'équipe juridique ne pourrait pas libérer les preuves à la clôture du dossier.
    c:
      en: |-
        MFA delete protects against deleting versions and changing versioning; it does not prevent overwrites and depends on the root user.
      fr: |-
        La suppression MFA protège contre la suppression de versions et la modification du versionnage ; elle n'empêche pas les écrasements et dépend de l'utilisateur root.
    d:
      en: |-
        A storage class transition does not protect the evidence from deletion or overwrite.
      fr: |-
        Un passage de classe de stockage ne protège pas les preuves contre la suppression ou l'écrasement.
references:
  - title: "Locking objects with Object Lock - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
