id: scsc03-2a-rds-login-rotate-secret
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany stores the master credentials of an Amazon Aurora cluster in AWS Secrets Manager with rotation configured every 30 days. Amazon GuardDuty RDS Protection is enabled. The security team wants the secret to be rotated immediately and automatically whenever GuardDuty reports an anomalous successful login to the cluster, so that the credentials that the attacker used stop working.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany stocke les informations d'identification principales d'un cluster Amazon Aurora dans AWS Secrets Manager avec une rotation configurée tous les 30 jours. La protection RDS d'Amazon GuardDuty est activée. L'équipe de sécurité veut que le secret fasse l'objet d'une rotation immédiate et automatique chaque fois que GuardDuty signale une connexion réussie anormale au cluster, afin que les informations d'identification utilisées par l'attaquant cessent de fonctionner.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule for the GuardDuty finding that invokes a Lambda function that calls RotateSecret on the cluster's secret.
        fr: |-
          Créer une règle Amazon EventBridge pour le résultat GuardDuty qui invoque une fonction AWS Lambda qui appelle RotateSecret sur le secret du cluster.
    - id: b
      text:
        en: |-
          Change the rotation schedule of the secret to every day so that compromised credentials are replaced sooner.
        fr: |-
          Modifier la planification de rotation du secret pour une rotation quotidienne afin que des informations d'identification compromises soient remplacées plus tôt.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule for the GuardDuty finding that notifies the database team to reset the master password of the cluster.
        fr: |-
          Créer une règle Amazon EventBridge pour le résultat GuardDuty qui notifie l'équipe de bases de données de réinitialiser le mot de passe principal du cluster.
    - id: d
      text:
        en: |-
          Move the credentials to a Systems Manager Parameter Store SecureString parameter with a policy that expires the parameter after one day.
        fr: |-
          Déplacer les informations d'identification vers un paramètre SecureString de Systems Manager Parameter Store avec une politique qui fait expirer le paramètre après un jour.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      GuardDuty publishes each finding to EventBridge in near real time, and a rule can invoke a function for the RDS login finding. Calling RotateSecret on a secret that has rotation configured starts an immediate rotation, so the password that the attacker used is replaced without waiting for the schedule.
    fr: |-
      GuardDuty publie chaque résultat dans EventBridge quasiment en temps réel, et une règle peut invoquer une fonction pour le résultat de connexion RDS. Appeler RotateSecret sur un secret dont la rotation est configurée démarre une rotation immédiate : le mot de passe utilisé par l'attaquant est remplacé sans attendre la planification.
  options:
    b:
      en: |-
        A schedule rotates at fixed times, so the credentials keep working until the next rotation after the login.
      fr: |-
        Une planification effectue la rotation à heures fixes : les informations d'identification restent valides jusqu'à la rotation suivante après la connexion.
    c:
      en: |-
        A notification relies on people acting, so the rotation is neither immediate nor automatic.
      fr: |-
        Une notification repose sur l'intervention de personnes : la rotation n'est ni immédiate ni automatique.
    d:
      en: |-
        Parameter Store does not rotate database credentials, and an expiration policy does not change the password in the database.
      fr: |-
        Parameter Store n'effectue pas la rotation des informations d'identification de bases de données, et une politique d'expiration ne modifie pas le mot de passe dans la base.
references:
  - title: "Rotate an AWS Secrets Manager secret immediately - AWS Secrets Manager"
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_now.html
  - title: "Processing GuardDuty findings with Amazon EventBridge - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_eventbridge.html
