id: scsc03-2a-resilience-hub-policy
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany has an application that is defined in AWS CloudFormation stacks. Its incident response plan states that after an Availability Zone disruption, the application must recover within 1 hour (RTO) with at most 15 minutes of data loss (RPO). The team wants to know whether the current architecture can meet these targets, and wants recommended alarms, standard operating procedures (SOPs), and AWS FIS experiments to test them.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany dispose d'une application définie dans des piles AWS CloudFormation. Son plan de réponse aux incidents stipule qu'après une perturbation d'une zone de disponibilité, l'application doit être rétablie en 1 heure (RTO) avec au plus 15 minutes de perte de données (RPO). L'équipe veut savoir si l'architecture actuelle peut atteindre ces objectifs, et veut des recommandations d'alarmes, de procédures opérationnelles standard (SOP) et d'expériences AWS FIS pour les tester.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the application to AWS Resilience Hub, attach a resiliency policy with these RTO and RPO targets, and run an assessment.
        fr: |-
          Ajouter l'application à AWS Resilience Hub, lui attacher une politique de résilience avec ces objectifs de RTO et de RPO, et exécuter une évaluation.
    - id: b
      text:
        en: |-
          Run the AWS Trusted Advisor fault tolerance checks, and create an AWS FIS experiment for each check that shows a warning.
        fr: |-
          Exécuter les vérifications de tolérance aux pannes d'AWS Trusted Advisor, et créer une expérience AWS FIS pour chaque vérification qui affiche un avertissement.
    - id: c
      text:
        en: |-
          Define a workload in the AWS Well-Architected Tool, answer the questions of the reliability pillar, and review the high-risk issues.
        fr: |-
          Définir une charge de travail dans l'AWS Well-Architected Tool, répondre aux questions du pilier fiabilité, et examiner les problèmes à risque élevé.
    - id: d
      text:
        en: |-
          Create AWS FIS experiments that stop the instances of one Availability Zone, and measure the recovery time during a game day.
        fr: |-
          Créer des expériences AWS FIS qui arrêtent les instances d'une zone de disponibilité, et mesurer le temps de rétablissement lors d'une journée de simulation.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Resilience Hub assesses an application against a resiliency policy that sets RTO and RPO targets per disruption type, including Availability Zone disruptions, and reports whether the policy is met or breached. It also recommends alarms, SOPs, and FIS experiments and gives a resiliency score based on them.
    fr: |-
      Resilience Hub évalue une application par rapport à une politique de résilience qui fixe des objectifs de RTO et de RPO par type de perturbation, y compris les perturbations d'une zone de disponibilité, et indique si la politique est respectée ou non. Il recommande aussi des alarmes, des SOP et des expériences FIS, et attribue un score de résilience fondé sur celles-ci.
  options:
    b:
      en: |-
        Trusted Advisor checks highlight configuration risks; they do not estimate RTO and RPO or recommend SOPs.
      fr: |-
        Les vérifications Trusted Advisor signalent des risques de configuration ; elles n'estiment pas le RTO et le RPO et ne recommandent pas de SOP.
    c:
      en: |-
        A Well-Architected review is a questionnaire; it does not estimate the application against the targets or generate alarms, SOPs, and experiments.
      fr: |-
        Une revue Well-Architected est un questionnaire ; elle n'évalue pas l'application par rapport aux objectifs et ne génère ni alarmes, ni SOP, ni expériences.
    d:
      en: |-
        One experiment measures one recovery; it does not evaluate the RPO or recommend alarms and SOPs.
      fr: |-
        Une expérience mesure un rétablissement ; elle n'évalue pas le RPO et ne recommande ni alarmes ni SOP.
references:
  - title: "AWS Resilience Hub concepts - AWS Resilience Hub"
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/concepts-terms.html
  - title: "What is AWS Resilience Hub? - AWS Resilience Hub"
    url: https://docs.aws.amazon.com/resilience-hub/latest/userguide/what-is.html
