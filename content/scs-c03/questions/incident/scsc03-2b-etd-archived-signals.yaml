id: scsc03-2b-etd-archived-signals
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses Amazon GuardDuty with S3 Protection in all accounts. To reduce noise, the security team created suppression rules that archive every finding with a Low severity and every Discovery finding type. During a post-incident review, the team found that compromised credentials ran discovery API calls, made a bucket policy permissive, and copied data out of Amazon S3 within 6 hours, but GuardDuty generated no attack sequence finding. The team wants GuardDuty to correlate this kind of multi-stage activity into an attack sequence in the future.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise Amazon GuardDuty avec S3 Protection dans tous ses comptes. Pour réduire le bruit, l'équipe de sécurité a créé des règles de suppression qui archivent tous les résultats de gravité faible (Low) et tous les types de résultats Discovery. Lors d'une revue post-incident, l'équipe a constaté que des informations d'identification compromises ont lancé des appels d'API de découverte, rendu une politique de compartiment permissive et copié des données hors d'Amazon S3 en 6 heures, sans que GuardDuty ne génère de résultat de séquence d'attaque. L'équipe veut que GuardDuty corrèle à l'avenir ce type d'activité en plusieurs étapes en une séquence d'attaque.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on Extended Threat Detection in the GuardDuty console of every account.", fr: "Activer Extended Threat Detection dans la console GuardDuty de chaque compte." }
    - id: b
      text: { en: "Change the frequency at which GuardDuty publishes updated findings to 15 minutes.", fr: "Passer à 15 minutes la fréquence de publication des résultats mis à jour par GuardDuty." }
    - id: c
      text: { en: "Replace the broad suppression rules with narrow rules that match only behaviors that the team has repeatedly validated as false positives.", fr: "Remplacer les règles de suppression larges par des règles étroites qui ne correspondent qu'aux comportements que l'équipe a validés à plusieurs reprises comme des faux positifs." }
    - id: d
      text: { en: "Enable GuardDuty Malware Protection for S3 on the buckets that hold sensitive data.", fr: "Activer GuardDuty Malware Protection for S3 sur les compartiments qui contiennent des données sensibles." }
answer: { optionId: c }
explanation:
  correct:
    en: "Extended Threat Detection correlates signals, which include API activity and GuardDuty findings, over a 24-hour rolling window to generate attack sequence findings. Archived findings, including those archived by suppression rules, are not used as signals, so suppressing whole categories such as Discovery removed the early stages of the attack. GuardDuty recommends suppression rules that target specific, repeatedly confirmed false positives."
    fr: "Extended Threat Detection corrèle des signaux, qui comprennent l'activité d'API et les résultats GuardDuty, sur une fenêtre glissante de 24 heures pour générer des résultats de séquence d'attaque. Les résultats archivés, y compris ceux archivés par des règles de suppression, ne servent pas de signaux : supprimer des catégories entières comme Discovery a retiré les premières étapes de l'attaque. GuardDuty recommande des règles de suppression ciblées sur des faux positifs précis et confirmés à plusieurs reprises."
  options:
    a:
      en: "Extended Threat Detection is turned on automatically when GuardDuty is enabled, so it was already active during the incident."
      fr: "Extended Threat Detection est activé automatiquement avec GuardDuty : il était donc déjà actif pendant l'incident."
    b:
      en: "The publishing frequency controls how often updates of existing findings are exported, not which signals are correlated."
      fr: "La fréquence de publication règle la fréquence d'exportation des mises à jour des résultats existants, et non les signaux corrélés."
    d:
      en: "Malware Protection for S3 scans uploaded objects for malware; S3 Protection, which supplies the S3 signals for attack sequences, is already enabled."
      fr: "Malware Protection for S3 analyse les objets chargés à la recherche de logiciels malveillants ; S3 Protection, qui fournit les signaux S3 des séquences d'attaque, est déjà activé."
references:
  - title: "GuardDuty Extended Threat Detection - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty-extended-threat-detection.html
  - title: "Suppression rules in GuardDuty - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/findings_suppression-rule.html
