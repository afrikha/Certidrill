id: scsc03-2a-arc-routing-control-failover
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany runs an active-standby application in two AWS Regions behind Amazon Route 53 DNS failover records. During a security incident in the active Region, responders might need to move all traffic to the standby Region even though the active endpoints still pass their health checks. The failover must not depend on the control plane of a single Region, and a safeguard must prevent responders from accidentally leaving no Region serving traffic.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany exécute une application active-passive dans deux Régions AWS derrière des enregistrements de basculement DNS Amazon Route 53. Lors d'un incident de sécurité dans la Région active, les intervenants peuvent avoir besoin de déplacer tout le trafic vers la Région de secours alors que les points de terminaison actifs réussissent toujours leurs vérifications de l'état. Le basculement ne doit pas dépendre du plan de contrôle d'une seule Région, et une protection doit empêcher les intervenants de laisser par erreur aucune Région servir le trafic.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach ARC routing control health checks to the failover records, change routing control states through the cluster endpoints, and add a safety rule.
        fr: |-
          Attacher des vérifications de l'état de contrôle de routage ARC aux enregistrements de basculement, modifier les états au moyen des points de terminaison du cluster, et ajouter une règle de sécurité.
    - id: b
      text:
        en: |-
          Lower the TTL of the failover records, and edit the primary record in the Route 53 console to point to the standby Region during the incident.
        fr: |-
          Réduire la durée de vie (TTL) des enregistrements de basculement, et modifier l'enregistrement principal dans la console Route 53 pour qu'il pointe vers la Région de secours pendant l'incident.
    - id: c
      text:
        en: |-
          Start an ARC zonal shift for the load balancer of the active Region so that the traffic moves away from that Region.
        fr: |-
          Démarrer un décalage de zone (zonal shift) ARC pour l'équilibreur de charge de la Région active afin que le trafic s'éloigne de cette Région.
    - id: d
      text:
        en: |-
          Create an ARC readiness check for the two Regions, and use its status to fail over the traffic when the incident is declared.
        fr: |-
          Créer une vérification de disponibilité (readiness check) ARC pour les deux Régions, et utiliser son statut pour basculer le trafic lorsque l'incident est déclaré.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Routing controls are on-off switches that drive routing control health checks attached to DNS failover records, so responders can move traffic regardless of the endpoints' own health. Each ARC cluster is a data plane with endpoints in five Regions, which AWS recommends using through the API or CLI, and safety rules prevent unintended states such as all replicas being off.
    fr: |-
      Les contrôles de routage sont des interrupteurs marche/arrêt qui pilotent des vérifications de l'état de contrôle de routage attachées aux enregistrements de basculement DNS : les intervenants peuvent déplacer le trafic indépendamment de l'état des points de terminaison. Chaque cluster ARC est un plan de données doté de points de terminaison dans cinq Régions, qu'AWS recommande d'utiliser au moyen de l'API ou de la CLI, et des règles de sécurité empêchent des états non souhaités, comme toutes les répliques arrêtées.
  options:
    b:
      en: |-
        Editing records is a change through the Route 53 control plane, and nothing prevents a responder from leaving no Region serving traffic.
      fr: |-
        Modifier des enregistrements est une modification par le plan de contrôle de Route 53, et rien n'empêche un intervenant de ne laisser aucune Région servir le trafic.
    c:
      en: |-
        A zonal shift moves traffic away from an Availability Zone to the other zones of the same Region, not to another Region.
      fr: |-
        Un décalage de zone déplace le trafic d'une zone de disponibilité vers les autres zones de la même Région, pas vers une autre Région.
    d:
      en: |-
        A readiness check monitors quotas, capacity, and routing policies; it does not move traffic and is not meant for the critical failover path.
      fr: |-
        Une vérification de disponibilité surveille les quotas, la capacité et les politiques de routage ; elle ne déplace pas le trafic et n'est pas prévue pour le chemin critique de basculement.
references:
  - title: "Routing control in ARC - Amazon Application Recovery Controller (ARC)"
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/routing-control.html
  - title: "What is ARC? - Amazon Application Recovery Controller (ARC)"
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/what-is-route53-recovery.html
