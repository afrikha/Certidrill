id: scsc03-2b-nacl-tracked-connections
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An EC2 instance is compromised. An attacker has an active SSH session from 203.0.113.50 and a reverse shell that the instance opened to 198.51.100.7 on TCP port 443. The instance's original security group allowed SSH only from 203.0.113.0/24 and HTTPS outbound only to a list of partner ranges that included 198.51.100.0/24. The incident responders replaced all the instance's security groups with an isolation security group that has no rules, but both sessions are still active. The instance is the only instance in its subnet, and it must keep running so that memory can be captured later.

    Which solution will stop the existing sessions immediately?
  fr: |
    Une instance EC2 est compromise. Un attaquant a une session SSH active depuis 203.0.113.50 et un shell inversé que l'instance a ouvert vers 198.51.100.7 sur le port TCP 443. Le groupe de sécurité d'origine de l'instance n'autorisait SSH que depuis 203.0.113.0/24 et HTTPS sortant que vers une liste de plages de partenaires qui incluait 198.51.100.0/24. Les intervenants ont remplacé tous les groupes de sécurité de l'instance par un groupe de sécurité d'isolement sans aucune règle, mais les deux sessions sont toujours actives. L'instance est la seule de son sous-réseau, et elle doit continuer à fonctionner pour que sa mémoire soit capturée plus tard.

    Quelle solution arrête immédiatement les sessions existantes ?
body:
  options:
    - id: a
      text: { en: "Reboot the instance so that the operating system closes all established connections.", fr: "Redémarrer l'instance pour que le système d'exploitation ferme toutes les connexions établies." }
    - id: b
      text: { en: "Add rules to the isolation security group that deny traffic to and from 203.0.113.50 and 198.51.100.7.", fr: "Ajouter au groupe de sécurité d'isolement des règles qui refusent le trafic vers et depuis 203.0.113.50 et 198.51.100.7." }
    - id: c
      text: { en: "Associate the subnet with a network ACL whose inbound and outbound rules deny all traffic.", fr: "Associer au sous-réseau une ACL réseau dont les règles entrantes et sortantes refusent tout le trafic." }
    - id: d
      text: { en: "Remove the IAM instance profile from the instance so that its role credentials can no longer be refreshed.", fr: "Retirer le profil d'instance IAM de l'instance pour que les informations d'identification de son rôle ne puissent plus être actualisées." }
answer: { optionId: c }
explanation:
  correct:
    en: "Both sessions were permitted by rules that were not open to all addresses, so they are tracked connections, and changing or removing security group rules does not interrupt tracked connections until they time out. Network ACLs are stateless and are evaluated on every packet, so a deny-all network ACL on the subnet breaks the existing connections at once. Because the instance is alone in its subnet, no other workload is affected."
    fr: "Les deux sessions ont été autorisées par des règles qui n'étaient pas ouvertes à toutes les adresses : ce sont des connexions suivies, et modifier ou supprimer des règles de groupe de sécurité n'interrompt pas les connexions suivies avant leur expiration. Les ACL réseau sont sans état et évaluées à chaque paquet : une ACL réseau qui refuse tout sur le sous-réseau coupe immédiatement les connexions existantes. Comme l'instance est seule dans son sous-réseau, aucune autre charge de travail n'est touchée."
  options:
    a:
      en: "A reboot clears the instance's memory, which destroys the volatile evidence that the team must capture."
      fr: "Un redémarrage efface la mémoire de l'instance, ce qui détruit les preuves volatiles que l'équipe doit capturer."
    b:
      en: "Security groups support only allow rules; there is no deny rule to add."
      fr: "Les groupes de sécurité ne prennent en charge que des règles d'autorisation ; il n'existe pas de règle de refus à ajouter."
    d:
      en: "Removing the instance profile affects AWS API access, not the network sessions that are already established."
      fr: "Retirer le profil d'instance agit sur l'accès aux API AWS, et non sur les sessions réseau déjà établies."
references:
  - title: "Amazon EC2 security group connection tracking - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/security-group-connection-tracking.html
  - title: "Remediating a potentially compromised Amazon EC2 instance - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/compromised-ec2.html
