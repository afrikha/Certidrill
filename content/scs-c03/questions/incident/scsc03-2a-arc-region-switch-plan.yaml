id: scsc03-2a-arc-region-switch-plan
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany's recovery from a Region-level security incident requires several ordered steps across three accounts: scale out the compute in the standby Region, then switch the database, and then redirect the traffic. The team wants a fully managed and observable recovery plan that can start automatically from an Amazon CloudWatch alarm or manually, and that does not depend on the Region that is being deactivated.

    Which solution will meet these requirements?
  fr: |-
    Le rétablissement d'AnyCompany après un incident de sécurité à l'échelle d'une Région exige plusieurs étapes ordonnées dans trois comptes : augmenter la capacité de calcul dans la Région de secours, puis basculer la base de données, puis rediriger le trafic. L'équipe veut un plan de rétablissement entièrement géré et observable qui peut démarrer automatiquement à partir d'une alarme Amazon CloudWatch ou manuellement, et qui ne dépend pas de la Région en cours de désactivation.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable ARC zonal autoshift for each resource so that AWS shifts the traffic automatically when its telemetry shows an impairment.
        fr: |-
          Activer le décalage automatique de zone (zonal autoshift) ARC pour chaque ressource afin qu'AWS déplace le trafic automatiquement lorsque sa télémétrie indique une dégradation.
    - id: b
      text:
        en: |-
          Create ARC routing controls that redirect the DNS traffic, and add a safety rule that enforces the order of the recovery steps.
        fr: |-
          Créer des contrôles de routage ARC qui redirigent le trafic DNS, et ajouter une règle de sécurité qui impose l'ordre des étapes de rétablissement.
    - id: c
      text:
        en: |-
          Create an ARC readiness check that monitors the quotas and capacity of the standby Region before the team performs the steps.
        fr: |-
          Créer une vérification de disponibilité ARC qui surveille les quotas et la capacité de la Région de secours avant que l'équipe effectue les étapes.
    - id: d
      text:
        en: |-
          Create an ARC Region switch plan whose workflow steps run in sequence across the accounts, started by the alarm or manually.
        fr: |-
          Créer un plan Region switch ARC dont les étapes de flux de travail s'exécutent en séquence dans les comptes, démarré par l'alarme ou manuellement.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Region switch is a fully managed ARC capability built around plans whose workflows contain steps that run execution blocks in parallel or in sequence. Plans support resources in other accounts, can be executed automatically from CloudWatch alarms or manually, and run from a data plane in each Region, so they do not depend on the Region being deactivated.
    fr: |-
      Region switch est une capacité ARC entièrement gérée, fondée sur des plans dont les flux de travail contiennent des étapes qui exécutent des blocs d'exécution en parallèle ou en séquence. Les plans prennent en charge des ressources d'autres comptes, peuvent être exécutés automatiquement à partir d'alarmes CloudWatch ou manuellement, et s'exécutent depuis un plan de données dans chaque Région : ils ne dépendent pas de la Région en cours de désactivation.
  options:
    a:
      en: |-
        Zonal autoshift moves traffic between Availability Zones of one Region, based on AWS telemetry, not a security decision.
      fr: |-
        Le décalage automatique de zone déplace le trafic entre les zones de disponibilité d'une Région, sur la base de la télémétrie d'AWS, et non d'une décision de sécurité.
    b:
      en: |-
        Routing controls only switch DNS traffic; safety rules constrain routing control states and do not orchestrate compute or database steps.
      fr: |-
        Les contrôles de routage ne font que basculer le trafic DNS ; les règles de sécurité contraignent les états des contrôles de routage et n'orchestrent pas d'étapes de calcul ou de base de données.
    c:
      en: |-
        A readiness check only monitors; it does not perform any recovery step.
      fr: |-
        Une vérification de disponibilité ne fait que surveiller ; elle n'effectue aucune étape de rétablissement.
references:
