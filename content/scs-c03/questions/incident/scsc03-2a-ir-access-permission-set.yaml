id: scsc03-2a-ir-access-permission-set
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany has 80 accounts in AWS Organizations and uses IAM Identity Center connected to its corporate identity provider (IdP). The incident response team needs access to all accounts to be ready before any incident. Responders must sign in with their corporate credentials and MFA and must not use long-term AWS credentials. Access must be managed centrally with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany dispose de 80 comptes dans AWS Organizations et utilise IAM Identity Center connecté à son fournisseur d'identité (IdP) d'entreprise. L'équipe de réponse aux incidents a besoin que son accès à tous les comptes soit prêt avant tout incident. Les intervenants doivent se connecter avec leurs informations d'identification d'entreprise et la MFA, et ne doivent pas utiliser d'informations d'identification AWS à long terme. L'accès doit être géré de manière centralisée avec le MOINS de frais opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM user with an MFA device for each responder in every account, and store the access keys of the users in a password vault.
        fr: |-
          Créer dans chaque compte un utilisateur IAM avec un dispositif MFA pour chaque intervenant, et stocker les clés d'accès des utilisateurs dans un coffre de mots de passe.
    - id: b
      text:
        en: |-
          Create an incident response permission set in IAM Identity Center, and assign the responders' IdP group to it for all accounts.
        fr: |-
          Créer un ensemble d'autorisations de réponse aux incidents dans IAM Identity Center, et lui affecter le groupe IdP des intervenants pour tous les comptes.
    - id: c
      text:
        en: |-
          Deploy with StackSets an IAM role in every account that trusts IAM users created for the responders in the security account.
        fr: |-
          Déployer avec StackSets dans chaque compte un rôle IAM qui approuve des utilisateurs IAM créés pour les intervenants dans le compte de sécurité.
    - id: d
      text:
        en: |-
          Share an IAM role of the management account with all accounts through AWS RAM, and let the responders assume it.
        fr: |-
          Partager un rôle IAM du compte de gestion avec tous les comptes au moyen d'AWS RAM, et laisser les intervenants l'endosser.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When a permission set is assigned to a group for accounts, IAM Identity Center creates and maintains the corresponding IAM roles in each account. Responders sign in through the IdP with MFA and get time-limited sessions, and changes to the permission set are propagated to every account from one place.
    fr: |-
      Lorsqu'un ensemble d'autorisations est affecté à un groupe pour des comptes, IAM Identity Center crée et maintient les rôles IAM correspondants dans chaque compte. Les intervenants se connectent via l'IdP avec la MFA et obtiennent des sessions limitées dans le temps, et les modifications de l'ensemble d'autorisations sont propagées à tous les comptes depuis un seul endroit.
  options:
    a:
      en: |-
        Access keys are long-term credentials, and 80 sets of users are not centrally managed.
      fr: |-
        Les clés d'accès sont des informations d'identification à long terme, et 80 jeux d'utilisateurs ne sont pas gérés de manière centralisée.
    c:
      en: |-
        The IAM users in the security account are separate identities with their own passwords, not the corporate credentials.
      fr: |-
        Les utilisateurs IAM du compte de sécurité sont des identités distinctes avec leurs propres mots de passe, pas les informations d'identification d'entreprise.
    d:
      en: |-
        AWS RAM does not share IAM roles, and a role exists only in the account that contains it.
      fr: |-
        AWS RAM ne partage pas de rôles IAM, et un rôle n'existe que dans le compte qui le contient.
references:
  - title: "Manage AWS accounts with permission sets - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html
