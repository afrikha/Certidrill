id: scsc03-2a-runbook-assume-role
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's responders sign in through an IAM Identity Center permission set that allows only read-only access to Amazon EC2. The responders must be able to run a custom AWS Systems Manager Automation runbook named IR-Quarantine that changes security groups and creates Amazon EBS snapshots. The responders must not be able to make those changes outside the runbook. The solution must follow the principle of least privilege.

    Which solution will meet these requirements?
  fr: |-
    Les intervenants d'AnyCompany se connectent au moyen d'un ensemble d'autorisations IAM Identity Center qui n'autorise qu'un accès en lecture seule à Amazon EC2. Les intervenants doivent pouvoir exécuter un runbook AWS Systems Manager Automation personnalisé nommé IR-Quarantine qui modifie des groupes de sécurité et crée des instantanés Amazon EBS. Les intervenants ne doivent pas pouvoir effectuer ces modifications en dehors du runbook. La solution doit respecter le principe du moindre privilège.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Pass a service role with the EC2 permissions as AutomationAssumeRole, and allow responders only ssm:StartAutomationExecution on IR-Quarantine and iam:PassRole on that role.
        fr: |-
          Transmettre comme AutomationAssumeRole un rôle de service doté des autorisations EC2, et n'autoriser pour les intervenants que ssm:StartAutomationExecution sur IR-Quarantine et iam:PassRole sur ce rôle.
    - id: b
      text:
        en: |-
          Add the EC2 permissions that the runbook needs to the permission set, and allow responders ssm:StartAutomationExecution on the IR-Quarantine runbook.
        fr: |-
          Ajouter à l'ensemble d'autorisations les autorisations EC2 dont le runbook a besoin, et autoriser pour les intervenants ssm:StartAutomationExecution sur le runbook IR-Quarantine.
    - id: c
      text:
        en: |-
          Create an IAM role with the EC2 permissions that trusts the role of the permission set, and have responders assume that role before they run the runbook.
        fr: |-
          Créer un rôle IAM avec les autorisations EC2 qui approuve le rôle de l'ensemble d'autorisations, et demander aux intervenants d'endosser ce rôle avant d'exécuter le runbook.
    - id: d
      text:
        en: |-
          Allow responders ssm:StartAutomationExecution on IR-Quarantine, and run it without an AutomationAssumeRole value so that Automation acts with its service-linked role.
        fr: |-
          Autoriser pour les intervenants ssm:StartAutomationExecution sur IR-Quarantine, et l'exécuter sans valeur AutomationAssumeRole afin qu'Automation agisse avec son rôle lié au service.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When a runbook receives an AutomationAssumeRole, Automation performs its actions with the permissions of that service role. The responders then need only permission to start this runbook and iam:PassRole for this role, so they can quarantine instances through the runbook but cannot call the EC2 APIs directly.
    fr: |-
      Lorsqu'un runbook reçoit un AutomationAssumeRole, Automation effectue ses actions avec les autorisations de ce rôle de service. Les intervenants n'ont alors besoin que de l'autorisation de démarrer ce runbook et de iam:PassRole pour ce rôle : ils peuvent mettre des instances en quarantaine au moyen du runbook, mais ne peuvent pas appeler directement les API EC2.
  options:
    b:
      en: |-
        The responders would hold the EC2 permissions themselves and could change security groups and create snapshots outside the runbook.
      fr: |-
        Les intervenants détiendraient eux-mêmes les autorisations EC2 et pourraient modifier des groupes de sécurité et créer des instantanés en dehors du runbook.
    c:
      en: |-
        A responder who can assume the role can call the EC2 APIs directly with it.
      fr: |-
        Un intervenant qui peut endosser le rôle peut appeler directement les API EC2 avec celui-ci.
    d:
      en: |-
        Without AutomationAssumeRole, Automation uses the permissions of the user who starts the runbook, so the read-only responders' runs fail.
      fr: |-
        Sans AutomationAssumeRole, Automation utilise les autorisations de l'utilisateur qui démarre le runbook : les exécutions des intervenants en lecture seule échouent.
references:
  - title: "AWSSupport-ContainEC2Instance - AWS Systems Manager Automation Runbook Reference"
    url: https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-awssupport-containec2instance.html
