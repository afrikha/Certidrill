id: scsc03-2a-contain-dryrun
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A responder at AnyCompany runs the AWSSupport-ContainEC2Instance runbook with the Action parameter set to Contain, an AutomationAssumeRole that has all the required permissions, and the ID of a suspicious Amazon EC2 instance. The execution status is Success, but the instance still has its original security groups and its network connections are still open.

    What should the responder do to isolate the instance?
  fr: |-
    Un intervenant d'AnyCompany exécute le runbook AWSSupport-ContainEC2Instance avec le paramètre Action défini sur Contain, un AutomationAssumeRole qui dispose de toutes les autorisations requises et l'ID d'une instance Amazon EC2 suspecte. Le statut de l'exécution est Success, mais l'instance a toujours ses groupes de sécurité d'origine et ses connexions réseau sont toujours ouvertes.

    Que doit faire l'intervenant pour isoler l'instance ?
body:
  options:
    - id: a
      text:
        en: |-
          Run the runbook again with the CreateAMIBackup parameter set to true so that the containment steps can start.
        fr: |-
          Exécuter de nouveau le runbook avec le paramètre CreateAMIBackup défini sur true afin que les étapes de confinement puissent démarrer.
    - id: b
      text:
        en: |-
          Run the runbook again with the DryRun parameter set to false so that the runbook applies its changes.
        fr: |-
          Exécuter de nouveau le runbook avec le paramètre DryRun défini sur false afin que le runbook applique ses modifications.
    - id: c
      text:
        en: |-
          Run the runbook first with the Action parameter set to Restore so that the original configuration is saved.
        fr: |-
          Exécuter d'abord le runbook avec le paramètre Action défini sur Restore afin que la configuration d'origine soit sauvegardée.
    - id: d
      text:
        en: |-
          Run the runbook again with EgressTrafficRules that allow outbound traffic only to the Systems Manager endpoints.
        fr: |-
          Exécuter de nouveau le runbook avec des EgressTrafficRules qui n'autorisent le trafic sortant que vers les points de terminaison Systems Manager.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The DryRun parameter of AWSSupport-ContainEC2Instance defaults to true, and in that mode the runbook only reports the actions that it would take. With DryRun set to false, it backs up the security group configuration to Amazon S3 and attaches the containment security group.
    fr: |-
      Le paramètre DryRun d'AWSSupport-ContainEC2Instance vaut true par défaut, et dans ce mode le runbook ne fait que signaler les actions qu'il effectuerait. Avec DryRun défini sur false, il sauvegarde la configuration des groupes de sécurité dans Amazon S3 et attache le groupe de sécurité de confinement.
  options:
    a:
      en: |-
        The AMI backup is optional and does not control whether the runbook makes changes.
      fr: |-
        La sauvegarde AMI est facultative et ne détermine pas si le runbook effectue des modifications.
    c:
      en: |-
        Restore reverts a previous containment from its Amazon S3 backup; it does not save the configuration or isolate the instance.
      fr: |-
        Restore annule un confinement précédent à partir de sa sauvegarde Amazon S3 ; il ne sauvegarde pas la configuration et n'isole pas l'instance.
    d:
      en: |-
        Traffic rules only shape the containment security group, which is not applied while DryRun is true.
      fr: |-
        Les règles de trafic ne font que définir le groupe de sécurité de confinement, qui n'est pas appliqué tant que DryRun vaut true.
references:
  - title: "AWSSupport-ContainEC2Instance - AWS Systems Manager Automation Runbook Reference"
    url: https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-awssupport-containec2instance.html
