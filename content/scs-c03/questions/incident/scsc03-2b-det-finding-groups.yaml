id: scsc03-2b-det-finding-groups
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Over two days, Amazon GuardDuty reported high-severity findings for three EC2 instances, one IAM role, and one Amazon S3 bucket in the same account. Several findings involve the same external IP address. Amazon Detective is enabled with the GuardDuty administrator account. The security team must determine whether the findings belong to a single incident and must see how the findings and entities relate to each other, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    En deux jours, Amazon GuardDuty a signalé des résultats de gravité élevée pour trois instances EC2, un rôle IAM et un compartiment Amazon S3 du même compte. Plusieurs résultats concernent la même adresse IP externe. Amazon Detective est activé avec le compte administrateur GuardDuty. L'équipe de sécurité doit déterminer si les résultats appartiennent à un même incident et doit voir comment les résultats et les entités sont liés entre eux, avec le MOINS d'effort.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Open the Detective finding group that contains the findings, and review its visualization of the related findings and entities.", fr: "Ouvrir le groupe de résultats Detective qui contient les résultats, et examiner sa visualisation des résultats et des entités liés." }
    - id: b
      text: { en: "Create an Amazon EventBridge rule that collects the findings into an Amazon SQS queue, and review the messages in order.", fr: "Créer une règle Amazon EventBridge qui collecte les résultats dans une file d'attente Amazon SQS, et examiner les messages dans l'ordre." }
    - id: c
      text: { en: "Export the findings to Amazon S3, and correlate them by IP address, role, and resource with Amazon Athena queries.", fr: "Exporter les résultats vers Amazon S3, puis les corréler par adresse IP, rôle et ressource avec des requêtes Amazon Athena." }
    - id: d
      text: { en: "Create an AWS Security Hub CSPM custom insight that groups the findings by remote IP address.", fr: "Créer un aperçu personnalisé AWS Security Hub CSPM qui regroupe les résultats par adresse IP distante." }
answer: { optionId: a }
explanation:
  correct:
    en: "Detective creates a finding group when graph analysis shows that findings are related, for example by close timing, common entities such as the same IP address or role session, similar behaviors, or similar TTPs. The group lists the related findings and entities and includes a visualization, so the analyst sees the incident as a whole without building the correlation."
    fr: "Detective crée un groupe de résultats quand l'analyse de graphe montre que des résultats sont liés, par exemple par leur proximité dans le temps, des entités communes comme la même adresse IP ou la même session de rôle, des comportements semblables ou des TTP semblables. Le groupe liste les résultats et entités liés et comprend une visualisation : l'analyste voit l'incident dans son ensemble sans construire la corrélation."
  options:
    b:
      en: "Queuing the findings only orders them; the team would still have to correlate them by hand."
      fr: "Mettre les résultats en file d'attente ne fait que les ordonner ; l'équipe devrait toujours les corréler à la main."
    c:
      en: "Athena queries can correlate the findings, but writing and maintaining them is more effort than the finding group that Detective already builds."
      fr: "Des requêtes Athena peuvent corréler les résultats, mais les écrire et les maintenir demande plus d'effort que le groupe de résultats que Detective construit déjà."
    d:
      en: "Grouping by one IP address misses findings related through other entities, and an insight shows counts, not relationships."
      fr: "Regrouper selon une adresse IP manque les résultats liés par d'autres entités, et un aperçu montre des totaux, pas des relations."
references:
  - title: "Analyzing finding groups - Amazon Detective"
    url: https://docs.aws.amazon.com/detective/latest/userguide/groups-about.html
