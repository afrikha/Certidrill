id: scsc03-2b-waf-alb-trace-join
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany protects an Application Load Balancer (ALB) with an AWS WAF web ACL. AWS WAF logs and ALB access logs are delivered to Amazon S3, and both have Amazon Athena tables. A rule in Count mode adds a label to requests that match a suspected exploit pattern. For every labeled request, the security team must find the target that processed the request and the status code that the target returned. Many requests arrive in the same second from the same client IP address, because the clients are behind a shared proxy.

    Which fields should the team use to join the two tables?
  fr: |
    AnyCompany protège un Application Load Balancer (ALB) avec une liste ACL web AWS WAF. Les journaux AWS WAF et les journaux d'accès de l'ALB sont livrés dans Amazon S3, et chacun possède une table Amazon Athena. Une règle en mode Count ajoute une étiquette aux requêtes qui correspondent à un modèle d'exploitation suspect. Pour chaque requête étiquetée, l'équipe de sécurité doit trouver la cible qui a traité la requête et le code d'état que la cible a renvoyé. De nombreuses requêtes arrivent dans la même seconde depuis la même adresse IP cliente, car les clients sont derrière un proxy partagé.

    Quels champs l'équipe doit-elle utiliser pour joindre les deux tables ?
body:
  options:
    - id: a
      text: { en: "The httpRequest.clientIp field of the AWS WAF log and the client:port field of the ALB access log, together with the timestamps rounded to the second.", fr: "Le champ httpRequest.clientIp du journal AWS WAF et le champ client:port du journal d'accès de l'ALB, avec les horodatages arrondis à la seconde." }
    - id: b
      text: { en: "The httpRequest.requestId field of the AWS WAF log and the trace_id field of the ALB access log.", fr: "Le champ httpRequest.requestId du journal AWS WAF et le champ trace_id du journal d'accès de l'ALB." }
    - id: c
      text: { en: "The webaclId field of the AWS WAF log and the matched_rule_priority field of the ALB access log.", fr: "Le champ webaclId du journal AWS WAF et le champ matched_rule_priority du journal d'accès de l'ALB." }
    - id: d
      text: { en: "The httpSourceId field of the AWS WAF log and the elb field of the ALB access log.", fr: "Le champ httpSourceId du journal AWS WAF et le champ elb du journal d'accès de l'ALB." }
answer: { optionId: b }
explanation:
  correct:
    en: "For an Application Load Balancer, the requestId that AWS WAF logs is the trace ID generated by the load balancer. The ALB access log records the same value in its trace_id field (the X-Amzn-Trace-Id header), so the pair identifies one request in both logs. The access log row then gives the target:port and target_status_code of that request."
    fr: "Pour un Application Load Balancer, le requestId journalisé par AWS WAF est l'ID de suivi généré par l'équilibreur de charge. Le journal d'accès de l'ALB enregistre la même valeur dans son champ trace_id (l'en-tête X-Amzn-Trace-Id) : la paire identifie une même requête dans les deux journaux. La ligne du journal d'accès donne ensuite le target:port et le target_status_code de cette requête."
  options:
    a:
      en: "The clients share a proxy address and send many requests per second, so IP address and second do not identify a single request; client:port also records the proxy port."
      fr: "Les clients partagent une adresse de proxy et envoient de nombreuses requêtes par seconde : l'adresse IP et la seconde n'identifient pas une requête unique ; client:port enregistre en outre le port du proxy."
    c:
      en: "webaclId identifies the web ACL and matched_rule_priority identifies the ALB listener rule; neither identifies a request, and they are unrelated values."
      fr: "webaclId identifie la liste ACL web et matched_rule_priority la règle d'écouteur de l'ALB ; aucun n'identifie une requête, et ces valeurs n'ont aucun lien entre elles."
    d:
      en: "Both fields identify the load balancer, so every request of that ALB would match every labeled request."
      fr: "Les deux champs identifient l'équilibreur de charge : chaque requête de cet ALB correspondrait à chaque requête étiquetée."
references:
  - title: "Log fields for protection pack (web ACL) traffic - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/logging-fields.html
  - title: "Access logs for your Application Load Balancer - Elastic Load Balancing"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-access-logs.html
