id: scsc03-2b-lambda-concurrency-zero
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function behind Amazon API Gateway uses a third-party library that was compromised. Each time the function runs, it sends request data to an external server over the internet. The security team must stop the function from running immediately and must keep its code, configuration, and versions unchanged for the forensic analysis.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda placée derrière Amazon API Gateway utilise une bibliothèque tierce compromise. À chaque exécution, la fonction envoie les données de la requête à un serveur externe par Internet. L'équipe de sécurité doit empêcher immédiatement la fonction de s'exécuter et doit conserver inchangés son code, sa configuration et ses versions pour l'analyse forensique.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Delete the function and export its deployment package to an Amazon S3 bucket for the analysis.", fr: "Supprimer la fonction et exporter son package de déploiement dans un compartiment Amazon S3 pour l'analyse." }
    - id: b
      text: { en: "Set the reserved concurrency of the function to 0.", fr: "Définir la concurrence réservée de la fonction à 0." }
    - id: c
      text: { en: "Remove every policy from the function's execution role.", fr: "Retirer toutes les politiques du rôle d'exécution de la fonction." }
    - id: d
      text: { en: "Set the provisioned concurrency of the function's alias to 0.", fr: "Définir à 0 la concurrence provisionnée de l'alias de la fonction." }
answer: { optionId: b }
explanation:
  correct:
    en: "Setting reserved concurrency to 0 is the documented way to throttle a function intentionally: it stops the function from processing any events until the limit is removed. The code, configuration, and versions stay as they are, so they remain available as evidence."
    fr: "Définir la concurrence réservée à 0 est la méthode documentée pour limiter volontairement une fonction : elle cesse de traiter tout événement tant que la limite n'est pas supprimée. Le code, la configuration et les versions restent tels quels et restent disponibles comme preuves."
  options:
    a:
      en: "Deleting the function destroys its configuration and versions, which the team must preserve."
      fr: "Supprimer la fonction détruit sa configuration et ses versions, que l'équipe doit conserver."
    c:
      en: "The function still runs and can still send data to the internet, because that traffic needs no IAM permission."
      fr: "La fonction s'exécute toujours et peut toujours envoyer des données sur Internet, car ce trafic ne nécessite aucune autorisation IAM."
    d:
      en: "Provisioned concurrency only keeps environments initialized; with none, invocations still run on demand."
      fr: "La concurrence provisionnée ne fait que garder des environnements initialisés ; sans elle, les appels s'exécutent toujours à la demande."
references:
  - title: "Configuring reserved concurrency for an Event Function - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-concurrency.html
