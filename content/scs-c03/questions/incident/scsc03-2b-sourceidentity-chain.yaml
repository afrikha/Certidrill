id: scsc03-2b-sourceidentity-chain
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's engineers federate through a SAML 2.0 identity provider into the JumpRole role in a hub account, and then chain into OpsRole in 20 workload accounts. Engineers choose any role session name when they assume OpsRole. During the root cause analysis of a recent incident, CloudTrail showed actions by an OpsRole session, but the team could not prove which engineer performed them. For future incidents, every action in the workload accounts must be attributable to the corporate user name, even after role chaining, and engineers must not be able to change that value during the session.

    Which solution will meet these requirements?
  fr: |
    Les ingénieurs d'AnyCompany se fédèrent par un fournisseur d'identité SAML 2.0 dans le rôle JumpRole d'un compte central, puis enchaînent sur OpsRole dans 20 comptes de charge de travail. Les ingénieurs choisissent librement le nom de session de rôle lorsqu'ils assument OpsRole. Pendant l'analyse des causes racines d'un incident récent, CloudTrail a montré des actions d'une session OpsRole, mais l'équipe n'a pas pu prouver quel ingénieur les avait effectuées. Pour les incidents futurs, chaque action dans les comptes de charge de travail doit pouvoir être attribuée au nom d'utilisateur de l'entreprise, même après un enchaînement de rôles, et les ingénieurs ne doivent pas pouvoir modifier cette valeur pendant la session.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Send the SourceIdentity SAML attribute with the user name from the identity provider, allow sts:SetSourceIdentity in the trust policies of both roles and in the permissions policy of JumpRole, and search userIdentity.sessionContext.sourceIdentity in CloudTrail.", fr: "Envoyer depuis le fournisseur d'identité l'attribut SAML SourceIdentity avec le nom d'utilisateur, autoriser sts:SetSourceIdentity dans les politiques d'approbation des deux rôles et dans la politique d'autorisations de JumpRole, et rechercher userIdentity.sessionContext.sourceIdentity dans CloudTrail." }
    - id: b
      text: { en: "Add a condition on sts:RoleSessionName to the trust policy of OpsRole that requires a session name in the format of a corporate user name, and search the session name in CloudTrail.", fr: "Ajouter à la politique d'approbation d'OpsRole une condition sur sts:RoleSessionName qui exige un nom de session au format d'un nom d'utilisateur de l'entreprise, et rechercher le nom de session dans CloudTrail." }
    - id: c
      text: { en: "Pass the user name as a non-transitive session tag from the identity provider, allow sts:TagSession in the trust policy of JumpRole, and search the tag in CloudTrail.", fr: "Transmettre depuis le fournisseur d'identité le nom d'utilisateur comme balise de session non transitive, autoriser sts:TagSession dans la politique d'approbation de JumpRole, et rechercher la balise dans CloudTrail." }
    - id: d
      text: { en: "Enable CloudTrail Insights on the organization trail, and review the Insights events of OpsRole after each incident.", fr: "Activer CloudTrail Insights sur le journal de suivi d'organisation, et examiner les événements Insights d'OpsRole après chaque incident." }
answer: { optionId: a }
explanation:
  correct:
    en: "A source identity is set once when the first role is assumed, cannot be changed for the rest of the session, and persists through role chaining; a chained AssumeRole call that tries to set another value is denied. It is included in every request of the session and appears in userIdentity.sessionContext.sourceIdentity in CloudTrail. For the chained call, sts:SetSourceIdentity must be allowed both in the permissions policy of JumpRole and in the trust policy of OpsRole."
    fr: "Une identité source est définie une seule fois lorsque le premier rôle est assumé, ne peut plus être modifiée pendant le reste de la session et persiste lors de l'enchaînement de rôles ; un appel AssumeRole enchaîné qui tente de définir une autre valeur est refusé. Elle est incluse dans chaque requête de la session et apparaît dans userIdentity.sessionContext.sourceIdentity dans CloudTrail. Pour l'appel enchaîné, sts:SetSourceIdentity doit être autorisé à la fois dans la politique d'autorisations de JumpRole et dans la politique d'approbation d'OpsRole."
  options:
    b:
      en: "A format check does not bind the session name to the engineer who signs in, so an engineer can still use another person's name at each hop."
      fr: "Un contrôle de format ne lie pas le nom de session à l'ingénieur qui se connecte : un ingénieur peut toujours utiliser le nom d'une autre personne à chaque saut."
    c:
      en: "A non-transitive session tag does not carry over when the engineer chains into OpsRole, so actions in the workload accounts lose it."
      fr: "Une balise de session non transitive n'est pas reportée lorsque l'ingénieur enchaîne sur OpsRole : les actions des comptes de charge de travail la perdent."
    d:
      en: "Insights events flag unusual API call or error rates; they do not identify the person behind a role session."
      fr: "Les événements Insights signalent des taux inhabituels d'appels d'API ou d'erreurs ; ils n'identifient pas la personne derrière une session de rôle."
references:
  - title: "Monitor and control actions taken with assumed roles - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp_control-access_monitor.html
