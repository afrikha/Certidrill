id: scsc03-2b-det-vpc-volume
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon GuardDuty reports that an EC2 instance communicated with an IP address on a threat list. Amazon Detective is enabled for the account. For the root cause analysis, an analyst must determine how much outbound traffic the instance sent to that IP address, on which ports, and whether any other EC2 instance in the account also exchanged traffic with the same IP address.

    What should the analyst do?
  fr: |
    Amazon GuardDuty signale qu'une instance EC2 a communiqué avec une adresse IP d'une liste de menaces. Amazon Detective est activé pour le compte. Pour l'analyse des causes racines, un analyste doit déterminer quel volume de trafic sortant l'instance a envoyé à cette adresse IP, sur quels ports, et si une autre instance EC2 du compte a aussi échangé du trafic avec la même adresse IP.

    Que doit faire l'analyste ?
body:
  options:
    - id: a
      text: { en: "Query the organization trail's Athena table for the events in which the instance called the IP address, grouped by event name.", fr: "Interroger la table Athena du journal de suivi d'organisation pour les événements dans lesquels l'instance a appelé l'adresse IP, regroupés par nom d'événement." }
    - id: b
      text: { en: "In Detective, use the overall VPC flow volume panel of the finding filtered on the annotated IP address, and then drill down on that IP address to list the EC2 instances that interacted with it.", fr: "Dans Detective, utiliser le panneau du volume global des flux VPC du résultat filtré sur l'adresse IP annotée, puis explorer cette adresse IP pour lister les instances EC2 qui ont interagi avec elle." }
    - id: c
      text: { en: "Review the count field of the GuardDuty finding, which shows how many times the instance contacted the IP address.", fr: "Examiner le champ count du résultat GuardDuty, qui indique combien de fois l'instance a contacté l'adresse IP." }
    - id: d
      text: { en: "Review the NetworkOut metric of the instance in Amazon CloudWatch for the period of the finding.", fr: "Examiner la métrique NetworkOut de l'instance dans Amazon CloudWatch pour la période du résultat." }
answer: { optionId: b }
explanation:
  correct:
    en: "The overall VPC flow volume panel shows, for each combination of IP address, local port, remote port, protocol, and direction, the inbound and outbound traffic volume and whether it was accepted or rejected. The Annotations column marks the IP address related to the finding. Drilling down on the IP address lists every EC2 instance that interacted with it during the scope time."
    fr: "Le panneau du volume global des flux VPC montre, pour chaque combinaison d'adresse IP, de port local, de port distant, de protocole et de direction, le volume de trafic entrant et sortant et s'il a été accepté ou rejeté. La colonne Annotations signale l'adresse IP liée au résultat. Explorer l'adresse IP liste toutes les instances EC2 qui ont interagi avec elle pendant la période d'analyse."
  options:
    a:
      en: "CloudTrail records AWS API calls, not network connections from an instance to an IP address."
      fr: "CloudTrail enregistre les appels d'API AWS, et non les connexions réseau d'une instance vers une adresse IP."
    c:
      en: "The count tells how often GuardDuty observed the activity, not the traffic volume, the ports, or other instances."
      fr: "Le compteur indique combien de fois GuardDuty a observé l'activité, et non le volume de trafic, les ports ou les autres instances."
    d:
      en: "NetworkOut is the instance's total outbound traffic, with no breakdown by destination or port, and it says nothing about other instances."
      fr: "NetworkOut est le trafic sortant total de l'instance, sans ventilation par destination ni par port, et il n'indique rien sur les autres instances."
references:
  - title: "Activity details for overall VPC flow volume - Amazon Detective"
    url: https://docs.aws.amazon.com/detective/latest/userguide/profile-panel-drilldown-overall-vpc-volume.html
