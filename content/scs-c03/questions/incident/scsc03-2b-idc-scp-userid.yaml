id: scsc03-2b-idc-scp-userid
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses AWS IAM Identity Center with an external identity provider. Permission sets have a session duration of 8 hours and are assigned to groups in 30 member accounts. An engineer's laptop is compromised, and the attacker might hold IAM role credentials that the engineer obtained through several permission sets. The security team must block every action of those existing role sessions in all member accounts as fast as possible, without affecting the other users of the same permission sets.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS IAM Identity Center avec un fournisseur d'identité externe. Les ensembles d'autorisations ont une durée de session de 8 heures et sont attribués à des groupes dans 30 comptes membres. L'ordinateur portable d'un ingénieur est compromis, et l'attaquant pourrait détenir des informations d'identification de rôle IAM que l'ingénieur a obtenues par plusieurs ensembles d'autorisations. L'équipe de sécurité doit bloquer le plus vite possible toutes les actions de ces sessions de rôle existantes dans tous les comptes membres, sans affecter les autres utilisateurs des mêmes ensembles d'autorisations.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Disable the engineer in the identity provider, and delete the engineer's active sessions in the IAM Identity Center console.", fr: "Désactiver l'ingénieur dans le fournisseur d'identité, et supprimer les sessions actives de l'ingénieur dans la console IAM Identity Center." }
    - id: b
      text: { en: "In each member account, choose Revoke active sessions on every IAM role that IAM Identity Center created for the engineer's permission sets.", fr: "Dans chaque compte membre, choisir Revoke active sessions sur chaque rôle IAM qu'IAM Identity Center a créé pour les ensembles d'autorisations de l'ingénieur." }
    - id: c
      text: { en: "Add to each of the engineer's permission sets an inline policy that denies all actions when aws:TokenIssueTime is earlier than the current time.", fr: "Ajouter à chaque ensemble d'autorisations de l'ingénieur une politique en ligne qui refuse toutes les actions quand aws:TokenIssueTime est antérieur à l'heure actuelle." }
    - id: d
      text: { en: "Attach to the member accounts an SCP that denies all actions when identitystore:userId equals the engineer's user ID, and keep it until the existing sessions have expired.", fr: "Attacher aux comptes membres une SCP qui refuse toutes les actions quand identitystore:userId est égal à l'ID utilisateur de l'ingénieur, et la conserver jusqu'à l'expiration des sessions existantes." }
answer: { optionId: d }
explanation:
  correct:
    en: "IAM role sessions that a permission set created keep working until they expire, regardless of the sign-in session. IAM Identity Center recommends a Deny statement on identitystore:userId in an SCP: it blocks only that user in every account and role where the SCP applies, and takes effect quickly. The guidance is to keep the user ID in the policy for at least 12 hours while the other steps, such as removing assignments and disabling the user, are completed."
    fr: "Les sessions de rôle IAM créées par un ensemble d'autorisations continuent de fonctionner jusqu'à leur expiration, indépendamment de la session de connexion. IAM Identity Center recommande une instruction Deny sur identitystore:userId dans une SCP : elle ne bloque que cet utilisateur dans tous les comptes et rôles où la SCP s'applique, et prend effet rapidement. La recommandation est de garder l'ID utilisateur dans la politique au moins 12 heures pendant que les autres étapes, comme le retrait des attributions et la désactivation de l'utilisateur, sont réalisées."
  options:
    a:
      en: "Disabling the user and ending the sign-in session prevent new role sessions, but existing role sessions continue until the end of their session duration."
      fr: "Désactiver l'utilisateur et mettre fin à la session de connexion empêchent les nouvelles sessions de rôle, mais les sessions de rôle existantes continuent jusqu'à la fin de leur durée."
    b:
      en: "Roles that IAM Identity Center creates from permission sets cannot be edited in IAM, and revoking them would also cut off every other user of those roles."
      fr: "Les rôles qu'IAM Identity Center crée à partir des ensembles d'autorisations ne peuvent pas être modifiés dans IAM, et les révoquer couperait aussi tous les autres utilisateurs de ces rôles."
    c:
      en: "A deny on aws:TokenIssueTime in the permission set applies to every user of the permission set, not only to the engineer."
      fr: "Un refus sur aws:TokenIssueTime dans l'ensemble d'autorisations s'applique à tous les utilisateurs de cet ensemble, et pas seulement à l'ingénieur."
references:
  - title: "Use a Deny policy to revoke active user permissions - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/prereqs-revoking-user-permissions.html
  - title: "Understanding authentication sessions in IAM Identity Center - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/authconcept.html
