id: scsc03-2a-srt-kms-logs
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany has granted the Shield Response Team (SRT) access to its account through a role with the AWSShieldDRTAccessPolicy managed policy. The company has also added to the SRT access settings an S3 bucket that receives web server logs from an Amazon Data Firehose stream. The bucket uses default encryption with an AWS KMS customer managed key. During a test with AWS Support, the SRT can read the AWS WAF logs but cannot process the web server logs. The security team wants the SRT to be able to analyze the web server logs during future events.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany a accordé à la Shield Response Team (SRT) l'accès à son compte au moyen d'un rôle doté de la politique gérée AWSShieldDRTAccessPolicy. L'entreprise a aussi ajouté aux paramètres d'accès SRT un compartiment S3 qui reçoit les journaux des serveurs web depuis un flux Amazon Data Firehose. Le compartiment utilise le chiffrement par défaut avec une clé gérée par le client AWS KMS. Lors d'un test avec AWS Support, la SRT peut lire les journaux AWS WAF mais ne peut pas traiter les journaux des serveurs web. L'équipe de sécurité veut que la SRT puisse analyser les journaux des serveurs web lors des prochains événements.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Deliver the web server logs to another S3 bucket in the same account that uses SSE-S3 encryption, and add that bucket to the SRT access settings.
        fr: |-
          Livrer les journaux des serveurs web dans un autre compartiment S3 du même compte qui utilise le chiffrement SSE-S3, et ajouter ce compartiment aux paramètres d'accès SRT.
    - id: b
      text:
        en: |-
          Add a statement to the key policy of the KMS key that allows the drt.shield.amazonaws.com service principal to call kms:Decrypt.
        fr: |-
          Ajouter à la politique de clé de la clé KMS une déclaration qui autorise le principal de service drt.shield.amazonaws.com à appeler kms:Decrypt.
    - id: c
      text:
        en: |-
          Replicate the web server logs to an S3 bucket with SSE-S3 encryption in a dedicated log account, and add that bucket to the SRT access settings.
        fr: |-
          Répliquer les journaux des serveurs web dans un compartiment S3 chiffré avec SSE-S3 dans un compte de journalisation dédié, et ajouter ce compartiment aux paramètres d'accès SRT.
    - id: d
      text:
        en: |-
          Attach the AWSKeyManagementServicePowerUser managed policy to the SRT role so that the SRT can decrypt the log objects with the key.
        fr: |-
          Attacher la politique gérée AWSKeyManagementServicePowerUser au rôle SRT afin que la SRT puisse déchiffrer les objets de journaux avec la clé.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The SRT cannot view or process logs that are stored in buckets encrypted with AWS KMS keys; shared buckets must be unencrypted or use SSE-S3. The buckets must also be in the same account as the one that granted the SRT access, so a second bucket with SSE-S3 in this account meets the requirement.
    fr: |-
      La SRT ne peut ni consulter ni traiter les journaux stockés dans des compartiments chiffrés avec des clés AWS KMS ; les compartiments partagés doivent être non chiffrés ou utiliser SSE-S3. Les compartiments doivent aussi se trouver dans le compte qui a accordé l'accès à la SRT : un second compartiment SSE-S3 dans ce compte répond à l'exigence.
  options:
    b:
      en: |-
        Key permissions do not help: the SRT does not process logs in buckets encrypted with KMS keys.
      fr: |-
        Des autorisations sur la clé n'y changent rien : la SRT ne traite pas les journaux des compartiments chiffrés avec des clés KMS.
    c:
      en: |-
        Log buckets shared with the SRT must be in the same account as the one that granted the SRT access.
      fr: |-
        Les compartiments de journaux partagés avec la SRT doivent se trouver dans le même compte que celui qui a accordé l'accès à la SRT.
    d:
      en: |-
        This policy is for managing keys, which the SRT does not need, and it does not remove the KMS limitation of the SRT.
      fr: |-
        Cette politique sert à gérer des clés, ce dont la SRT n'a pas besoin, et elle ne lève pas la limitation KMS de la SRT.
references:
  - title: "Granting access for the SRT - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-srt-access.html
