id: scsc03-2a-config-sg-auto-remediation
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    Developers at AnyCompany sometimes add inbound rules that allow SSH from 0.0.0.0/0 to security groups. These security groups belong to internal instances and must never allow inbound traffic from all addresses. The security team evaluates them with the AWS Config managed rule restricted-ssh. Noncompliant security groups must be corrected automatically within minutes, with retries if a remediation attempt fails, and without custom code.

    Which solution will meet these requirements?
  fr: |-
    Les développeurs d'AnyCompany ajoutent parfois à des groupes de sécurité des règles entrantes qui autorisent SSH depuis 0.0.0.0/0. Ces groupes de sécurité appartiennent à des instances internes et ne doivent jamais autoriser le trafic entrant depuis toutes les adresses. L'équipe de sécurité les évalue avec la règle gérée AWS Config restricted-ssh. Les groupes de sécurité non conformes doivent être corrigés automatiquement en quelques minutes, avec de nouvelles tentatives si une correction échoue, et sans code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule for AuthorizeSecurityGroupIngress API calls that invokes an AWS Lambda function that revokes the new rule.
        fr: |-
          Créer une règle Amazon EventBridge pour les appels d'API AuthorizeSecurityGroupIngress qui invoque une fonction AWS Lambda qui révoque la nouvelle règle.
    - id: b
      text:
        en: |-
          Configure manual remediation on the restricted-ssh rule with the AWSConfigRemediation-RemoveUnrestrictedSourceIngressRules runbook for responders to run.
        fr: |-
          Configurer une correction manuelle sur la règle restricted-ssh avec le runbook AWSConfigRemediation-RemoveUnrestrictedSourceIngressRules, à exécuter par les intervenants.
    - id: c
      text:
        en: |-
          Configure automatic remediation with retries on the restricted-ssh rule that runs AWSConfigRemediation-RemoveUnrestrictedSourceIngressRules for the resource ID.
        fr: |-
          Configurer sur la règle restricted-ssh une correction automatique avec nouvelles tentatives qui exécute AWSConfigRemediation-RemoveUnrestrictedSourceIngressRules pour l'ID de ressource.
    - id: d
      text:
        en: |-
          Configure the restricted-ssh rule to also run every hour, and send its noncompliant results to an Amazon SNS topic for the network team.
        fr: |-
          Configurer la règle restricted-ssh pour s'exécuter aussi toutes les heures, et envoyer ses résultats non conformes à une rubrique Amazon SNS destinée à l'équipe réseau.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS Config remediates noncompliant resources with Systems Manager Automation documents. With automatic remediation, the resource ID parameter, here SecurityGroupId, is replaced at runtime by the ID of the noncompliant security group, and retries can be set, such as 5 attempts in 300 seconds. The AWSConfigRemediation-RemoveUnrestrictedSourceIngressRules runbook removes the ingress rules of the group that allow traffic from all source addresses.
    fr: |-
      AWS Config corrige les ressources non conformes avec des documents Systems Manager Automation. Avec la correction automatique, le paramètre d'ID de ressource, ici SecurityGroupId, est remplacé à l'exécution par l'ID du groupe de sécurité non conforme, et de nouvelles tentatives peuvent être définies, par exemple 5 tentatives en 300 secondes. Le runbook AWSConfigRemediation-RemoveUnrestrictedSourceIngressRules supprime les règles entrantes du groupe qui autorisent le trafic depuis toutes les adresses sources.
  options:
    a:
      en: |-
        The Lambda function is custom code to write and maintain.
      fr: |-
        La fonction Lambda est du code personnalisé à écrire et à maintenir.
    b:
      en: |-
        Manual remediation waits for a person, so the correction is not automatic.
      fr: |-
        La correction manuelle attend une personne : la correction n'est pas automatique.
    d:
      en: |-
        Notifications report the problem but do not correct the security groups.
      fr: |-
        Les notifications signalent le problème mais ne corrigent pas les groupes de sécurité.
references:
  - title: "Setting Up Auto Remediation for AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
  - title: "AWSConfigRemediation-RemoveUnrestrictedSourceIngressRules - AWS Systems Manager Automation Runbook Reference"
    url: https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-aws-remove-unrestricted-source-ingress.html
