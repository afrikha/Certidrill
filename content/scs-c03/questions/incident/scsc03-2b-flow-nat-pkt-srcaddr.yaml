id: scsc03-2b-flow-nat-pkt-srcaddr
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs EC2 instances in private subnets that reach the internet through a NAT gateway. To control cost, the security team logs only the NAT gateway's network interface, with a VPC flow log in the default format. A threat intelligence report lists a malicious IP address. In the flow log, the records that contain that address show the NAT gateway's private IP address on the VPC side, and the team cannot tell which instance opened the connections. The team must be able to identify the originating instances from this single flow log for future connections.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des instances EC2 dans des sous-réseaux privés qui accèdent à Internet par une passerelle NAT. Pour maîtriser les coûts, l'équipe de sécurité ne journalise que l'interface réseau de la passerelle NAT, avec un journal de flux VPC au format par défaut. Un rapport de renseignement sur les menaces cite une adresse IP malveillante. Dans le journal de flux, les enregistrements qui contiennent cette adresse montrent l'adresse IP privée de la passerelle NAT côté VPC, et l'équipe ne peut pas savoir quelle instance a ouvert les connexions. L'équipe doit pouvoir identifier les instances d'origine à partir de ce seul journal de flux pour les connexions futures.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Replace the flow log of the NAT gateway's network interface with one that uses a custom format that includes the pkt-srcaddr and pkt-dstaddr fields.", fr: "Remplacer le journal de flux de l'interface réseau de la passerelle NAT par un journal au format personnalisé qui inclut les champs pkt-srcaddr et pkt-dstaddr." }
    - id: b
      text: { en: "Replace the flow log of the NAT gateway's network interface with one that uses a custom format that includes the instance-id field.", fr: "Remplacer le journal de flux de l'interface réseau de la passerelle NAT par un journal au format personnalisé qui inclut le champ instance-id." }
    - id: c
      text: { en: "Replace the flow log of the NAT gateway's network interface with one that uses a custom format that includes the traffic-path field.", fr: "Remplacer le journal de flux de l'interface réseau de la passerelle NAT par un journal au format personnalisé qui inclut le champ traffic-path." }
    - id: d
      text: { en: "Replace the flow log of the NAT gateway's network interface with one that uses a custom format that includes the tcp-flags and flow-direction fields.", fr: "Remplacer le journal de flux de l'interface réseau de la passerelle NAT par un journal au format personnalisé qui inclut les champs tcp-flags et flow-direction." }
answer: { optionId: a }
explanation:
  correct:
    en: "srcaddr and dstaddr record the addresses of the network interface hop, so traffic through a NAT gateway shows the gateway as one end. pkt-srcaddr and pkt-dstaddr record the original packet-level addresses: on the NAT gateway's interface they show the instance's private IP address together with the remote IP address, which links each connection to the instance that opened it. A flow log format cannot be changed, so the log is replaced by one with a custom format."
    fr: "srcaddr et dstaddr enregistrent les adresses du saut au niveau de l'interface réseau : le trafic qui passe par une passerelle NAT montre la passerelle à l'une des extrémités. pkt-srcaddr et pkt-dstaddr enregistrent les adresses d'origine au niveau du paquet : sur l'interface de la passerelle NAT, elles montrent l'adresse IP privée de l'instance avec l'adresse IP distante, ce qui relie chaque connexion à l'instance qui l'a ouverte. Le format d'un journal de flux ne peut pas être modifié : le journal est donc remplacé par un journal au format personnalisé."
  options:
    b:
      en: "instance-id returns a hyphen for requester-managed interfaces such as the NAT gateway's, so it never names the instances behind the gateway."
      fr: "instance-id renvoie un tiret pour les interfaces gérées par le demandeur, comme celle de la passerelle NAT : il ne nomme jamais les instances situées derrière la passerelle."
    c:
      en: "traffic-path tells which path egress traffic takes, such as an internet gateway, not which instance originated it."
      fr: "traffic-path indique le chemin emprunté par le trafic sortant, par exemple une passerelle Internet, et non l'instance qui l'a émis."
    d:
      en: "TCP flags and direction describe the flow but not its original source address, so the instance stays unknown."
      fr: "Les indicateurs TCP et la direction décrivent le flux mais pas son adresse source d'origine : l'instance reste inconnue."
references:
  - title: "Flow log records - Amazon Virtual Private Cloud"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html
