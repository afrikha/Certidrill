id: scsc03-2b-sl-custom-source-ocsf
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses Amazon Security Lake to collect AWS CloudTrail management events and Amazon VPC Flow Logs. An on-premises firewall appliance exports its connection logs in a proprietary JSON format. Analysts must correlate the firewall logs with the native sources by using Amazon Athena queries on the same schema. Security Lake must manage the table and the discovery of new partitions for the firewall data.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany utilise Amazon Security Lake pour collecter les événements de gestion AWS CloudTrail et les journaux de flux Amazon VPC. Un pare-feu sur site exporte ses journaux de connexion dans un format JSON propriétaire. Les analystes doivent corréler les journaux du pare-feu avec les sources natives au moyen de requêtes Amazon Athena sur le même schéma. Security Lake doit gérer la table et la découverte des nouvelles partitions pour les données du pare-feu.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Add the firewall as a custom source in Security Lake so that it creates the provider IAM role, the AWS Glue crawler, and the AWS Lake Formation table for the source.", fr: "Ajouter le pare-feu comme source personnalisée dans Security Lake pour qu'il crée le rôle IAM du fournisseur, le robot d'analyse AWS Glue et la table AWS Lake Formation de la source." }
    - id: b
      text: { en: "Write the raw JSON files to the ext/ prefix of the Security Lake bucket, and let Security Lake convert them to OCSF during ingestion.", fr: "Écrire les fichiers JSON bruts sous le préfixe ext/ du compartiment Security Lake, et laisser Security Lake les convertir en OCSF lors de l'ingestion." }
    - id: c
      text: { en: "Send the firewall logs to an Amazon CloudWatch Logs log group, and add CloudWatch Logs to Security Lake as a natively supported AWS source.", fr: "Envoyer les journaux du pare-feu dans un groupe de journaux Amazon CloudWatch Logs, et ajouter CloudWatch Logs à Security Lake comme source AWS prise en charge nativement." }
    - id: d
      text: { en: "Create a data access subscriber for the firewall's log forwarder so that it can write the firewall logs to the Security Lake bucket.", fr: "Créer un abonné avec accès aux données pour le redirecteur de journaux du pare-feu afin qu'il puisse écrire les journaux du pare-feu dans le compartiment Security Lake." }
    - id: e
      text: { en: "Convert the records to a single OCSF event class per object, and write Apache Parquet objects partitioned by region, accountId, and eventDay with the provider role.", fr: "Convertir les enregistrements en une seule classe d'événements OCSF par objet, et écrire avec le rôle du fournisseur des objets Apache Parquet partitionnés par region, accountId et eventDay." }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "Adding a custom source makes Security Lake create a provider role that can write to the source's S3 location, plus a Lake Formation table and a Glue crawler that discovers new partitions. The third party must deliver its data already converted to OCSF, as Apache Parquet objects that contain one OCSF event class each and that follow the region, accountId, and eventDay partition layout."
    fr: "Ajouter une source personnalisée fait créer par Security Lake un rôle de fournisseur qui peut écrire dans l'emplacement S3 de la source, ainsi qu'une table Lake Formation et un robot d'analyse Glue qui découvre les nouvelles partitions. Le tiers doit livrer ses données déjà converties en OCSF, sous forme d'objets Apache Parquet qui contiennent chacun une seule classe d'événements OCSF et qui suivent l'organisation de partitions region, accountId et eventDay."
  options:
    b:
      en: "Security Lake converts only its natively supported AWS sources to OCSF; a custom source must deliver data that is already in OCSF and Parquet."
      fr: "Security Lake ne convertit en OCSF que ses sources AWS prises en charge nativement ; une source personnalisée doit livrer des données déjà au format OCSF et Parquet."
    c:
      en: "CloudWatch Logs is not one of the natively supported Security Lake sources, so the logs would not reach the lake this way."
      fr: "CloudWatch Logs ne fait pas partie des sources prises en charge nativement par Security Lake : les journaux n'atteindraient pas le lac de cette façon."
    d:
      en: "Subscribers consume data from Security Lake; they do not write data into it."
      fr: "Les abonnés consomment les données de Security Lake ; ils n'y écrivent pas de données."
references:
  - title: "Collecting data from custom sources in Security Lake - Amazon Security Lake"
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/custom-sources.html
  - title: "Collecting data from AWS services in Security Lake - Amazon Security Lake"
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/internal-sources.html
