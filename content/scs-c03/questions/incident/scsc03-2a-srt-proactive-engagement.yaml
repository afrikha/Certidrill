id: scsc03-2a-srt-proactive-engagement
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany protects an Amazon CloudFront distribution and an Application Load Balancer with AWS Shield Advanced and has the Enterprise Support plan. The company does not have a 24/7 operations center. During a DDoS event that affects the availability of the application, the security team wants the Shield Response Team (SRT) to contact the on-call engineers directly instead of waiting for the company to open a support case.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany protège une distribution Amazon CloudFront et un Application Load Balancer avec AWS Shield Advanced et dispose du plan Enterprise Support. L'entreprise n'a pas de centre d'opérations 24 h/24 et 7 j/7. Lors d'un événement DDoS qui affecte la disponibilité de l'application, l'équipe de sécurité veut que la Shield Response Team (SRT) contacte directement les ingénieurs d'astreinte au lieu d'attendre que l'entreprise ouvre un dossier de support.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon CloudWatch alarm on the DDoSDetected metric of each protected resource that notifies an Amazon SNS topic for the on-call pagers.
        fr: |-
          Créer une alarme Amazon CloudWatch sur la métrique DDoSDetected de chaque ressource protégée qui notifie une rubrique Amazon SNS destinée aux bipeurs d'astreinte.
    - id: b
      text:
        en: |-
          Enable proactive engagement with the pager contact of the on-call engineers in the contact notes, without associating health checks with the protections.
        fr: |-
          Activer l'engagement proactif avec le contact de bipeur des ingénieurs d'astreinte dans les notes de contact, sans associer de vérifications de l'état aux protections.
    - id: c
      text:
        en: |-
          Associate a Route 53 health check that reflects application health with each protection, and enable proactive engagement with the pager contact.
        fr: |-
          Associer à chaque protection une vérification de l'état Route 53 qui reflète l'état de l'application, et activer l'engagement proactif avec le contact de bipeur.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule that opens an AWS Support case from a template when Shield Advanced detects an event on a protected resource.
        fr: |-
          Créer une règle Amazon EventBridge qui ouvre un dossier AWS Support à partir d'un modèle lorsque Shield Advanced détecte un événement sur une ressource protégée.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Proactive engagement requires the Business or Enterprise Support plan, a Route 53 health check associated with each covered resource, and at least one contact. During an event detected by Shield Advanced, the SRT uses the health check status to decide whether to engage and contacts you as described in the contact notes, such as a pager when there is no 24/7 operations center.
    fr: |-
      L'engagement proactif exige le plan Business ou Enterprise Support, une vérification de l'état Route 53 associée à chaque ressource couverte et au moins un contact. Lors d'un événement détecté par Shield Advanced, la SRT utilise l'état de la vérification pour décider d'intervenir et vous contacte comme l'indiquent les notes de contact, par exemple un bipeur en l'absence de centre d'opérations 24 h/24 et 7 j/7.
  options:
    a:
      en: |-
        The alarm alerts the company's own team; the SRT is not engaged and still waits for a case.
      fr: |-
        L'alarme alerte l'équipe de l'entreprise ; la SRT n'est pas engagée et attend toujours un dossier.
    b:
      en: |-
        Proactive engagement covers only resources with an associated Route 53 health check, which the SRT uses to decide whether to engage.
      fr: |-
        L'engagement proactif ne couvre que les ressources associées à une vérification de l'état Route 53, que la SRT utilise pour décider d'intervenir.
    d:
      en: |-
        The company would still open the case, through custom automation, and the SRT would not contact the on-call engineers on its own initiative.
      fr: |-
        L'entreprise ouvrirait toujours le dossier, au moyen d'une automatisation personnalisée, et la SRT ne contacterait pas les ingénieurs d'astreinte de sa propre initiative.
references:
  - title: "Setting up proactive engagement for the SRT to contact you directly - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-srt-proactive-engagement.html
  - title: "Health-based detection using health checks with Shield Advanced and Route 53 - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-advanced-health-checks.html
