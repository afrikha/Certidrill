id: scsc03-2b-eks-audit-insights
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an Amazon EKS cluster named prod-cluster with all control plane logging disabled. Someone deleted a Kubernetes Secret and created a privileged pod, and the security team could not determine who did it. For future events, the team must be able to search which Kubernetes user or IAM principal performed each action on the cluster's resources, by using Amazon CloudWatch Logs Insights.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany exécute un cluster Amazon EKS nommé prod-cluster dont toute la journalisation du plan de contrôle est désactivée. Quelqu'un a supprimé un Secret Kubernetes et créé un pod privilégié, et l'équipe de sécurité n'a pas pu déterminer qui l'a fait. Pour les événements futurs, l'équipe doit pouvoir rechercher quel utilisateur Kubernetes ou quel principal IAM a effectué chaque action sur les ressources du cluster, avec Amazon CloudWatch Logs Insights.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Enable the api control plane log type for the cluster.", fr: "Activer le type de journal api du plan de contrôle pour le cluster." }
    - id: b
      text: { en: "Enable the audit control plane log type for the cluster.", fr: "Activer le type de journal audit du plan de contrôle pour le cluster." }
    - id: c
      text: { en: "Enable CloudWatch Container Insights for the cluster.", fr: "Activer CloudWatch Container Insights pour le cluster." }
    - id: d
      text: { en: "Query the /aws/eks/prod-cluster/cluster log group, filtering on verb and objectRef.resource and displaying user.username.", fr: "Interroger le groupe de journaux /aws/eks/prod-cluster/cluster en filtrant sur verb et objectRef.resource et en affichant user.username." }
    - id: e
      text: { en: "Query the AWS CloudTrail management events for DeleteSecret calls, and display userIdentity.arn.", fr: "Interroger les événements de gestion AWS CloudTrail pour les appels DeleteSecret, et afficher userIdentity.arn." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Control plane logs are not sent to CloudWatch Logs by default, and each log type is enabled separately. The audit log type records which users, administrators, or system components affected the cluster, and EKS writes it to the /aws/eks/prod-cluster/cluster log group. Kubernetes audit events carry the verb, the object reference, and the authenticated user, so a Logs Insights query on those fields answers who did what."
    fr: "Les journaux du plan de contrôle ne sont pas envoyés par défaut à CloudWatch Logs, et chaque type de journal s'active séparément. Le type de journal audit enregistre les utilisateurs, administrateurs ou composants système qui ont agi sur le cluster, et EKS l'écrit dans le groupe de journaux /aws/eks/prod-cluster/cluster. Les événements d'audit Kubernetes contiennent le verbe, la référence de l'objet et l'utilisateur authentifié : une requête Logs Insights sur ces champs indique qui a fait quoi."
  options:
    a:
      en: "The api log type contains the API server's own logs, not the audit record of who changed which resource."
      fr: "Le type de journal api contient les journaux propres au serveur d'API, et non l'enregistrement d'audit de qui a modifié quelle ressource."
    c:
      en: "Container Insights collects performance metrics and logs of containers, not the Kubernetes API audit trail."
      fr: "Container Insights collecte des métriques de performance et des journaux de conteneurs, et non la piste d'audit de l'API Kubernetes."
    e:
      en: "Kubernetes API requests are not AWS API calls, so CloudTrail does not record them; DeleteSecret in CloudTrail is an AWS Secrets Manager action."
      fr: "Les requêtes à l'API Kubernetes ne sont pas des appels d'API AWS : CloudTrail ne les enregistre pas, et DeleteSecret dans CloudTrail est une action AWS Secrets Manager."
references:
  - title: "Send control plane logs to CloudWatch Logs - Amazon EKS"
    url: https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html
