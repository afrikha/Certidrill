id: scsc03-2b-sl-query-subscriber
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses Amazon Security Lake from a delegated administrator account. Security Lake collects AWS CloudTrail management events, Amazon VPC Flow Logs, and Amazon Route 53 resolver query logs, and rolls up all Regions to us-east-1. A managed security service provider (MSSP) that works from its own AWS account must correlate the CloudTrail and VPC flow data by running SQL queries with Amazon Athena on the data where it is stored. The MSSP must not receive notifications or copies of new objects, and it must not be able to read the Route 53 data.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise Amazon Security Lake depuis un compte administrateur délégué. Security Lake collecte les événements de gestion AWS CloudTrail, les journaux de flux Amazon VPC (VPC Flow Logs) et les journaux de requêtes du résolveur Amazon Route 53, et regroupe toutes les Régions dans us-east-1. Un fournisseur de services de sécurité managés (MSSP) qui travaille depuis son propre compte AWS doit corréler les données CloudTrail et de flux VPC en exécutant des requêtes SQL avec Amazon Athena sur les données là où elles sont stockées. Le MSSP ne doit recevoir ni notifications ni copies des nouveaux objets, et il ne doit pas pouvoir lire les données Route 53.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a data access subscriber for the MSSP account with the CloudTrail and VPC Flow Logs sources, and have the MSSP poll the Amazon SQS queue for new objects.", fr: "Créer un abonné avec accès aux données pour le compte du MSSP avec les sources CloudTrail et VPC Flow Logs, et faire interroger la file d'attente Amazon SQS des nouveaux objets par le MSSP." }
    - id: b
      text: { en: "Create a query access subscriber for the MSSP account with all three sources, and ask the MSSP to exclude the Route 53 tables from its Athena queries.", fr: "Créer un abonné avec accès aux requêtes pour le compte du MSSP avec les trois sources, et demander au MSSP d'exclure les tables Route 53 de ses requêtes Athena." }
    - id: c
      text: { en: "Register the MSSP account as a custom source in Security Lake, and grant it Lake Formation permissions on the CloudTrail and VPC Flow Logs tables.", fr: "Enregistrer le compte du MSSP comme source personnalisée dans Security Lake, et lui accorder des autorisations Lake Formation sur les tables CloudTrail et VPC Flow Logs." }
    - id: d
      text: { en: "Create a query access subscriber for the MSSP account with only the CloudTrail and VPC Flow Logs sources, and have the MSSP accept the AWS Lake Formation resource share and query the tables with Athena.", fr: "Créer un abonné avec accès aux requêtes pour le compte du MSSP avec uniquement les sources CloudTrail et VPC Flow Logs, puis faire accepter au MSSP le partage de ressources AWS Lake Formation et interroger les tables avec Athena." }
answer: { optionId: d }
explanation:
  correct:
    en: "A query access subscriber queries the AWS Lake Formation tables that Security Lake maintains over its S3 bucket, with services such as Athena, so the data is analyzed in place. Access is granted per source, so choosing only the CloudTrail and VPC Flow Logs sources keeps the Route 53 data out of reach. The subscriber is created in the Region where the data is rolled up."
    fr: "Un abonné avec accès aux requêtes interroge les tables AWS Lake Formation que Security Lake maintient sur son compartiment S3, avec des services comme Athena : les données sont analysées sur place. L'accès est accordé par source : ne choisir que les sources CloudTrail et VPC Flow Logs laisse les données Route 53 hors de portée. L'abonné est créé dans la Région où les données sont regroupées."
  options:
    a:
      en: "A data access subscriber is notified of each new object and reads the objects themselves, which is the notification and object flow the MSSP must not receive."
      fr: "Un abonné avec accès aux données est notifié de chaque nouvel objet et lit les objets eux-mêmes : c'est précisément le flux de notifications et d'objets que le MSSP ne doit pas recevoir."
    b:
      en: "Subscribing to all three sources grants access to the Route 53 tables; asking the MSSP not to query them is not an access control."
      fr: "S'abonner aux trois sources accorde l'accès aux tables Route 53 ; demander au MSSP de ne pas les interroger n'est pas un contrôle d'accès."
    c:
      en: "A custom source is a producer that writes OCSF data into the lake; it does not give an external account read access to existing sources."
      fr: "Une source personnalisée est un producteur qui écrit des données OCSF dans le lac ; elle ne donne pas à un compte externe un accès en lecture aux sources existantes."
references:
  - title: "Subscriber management in Security Lake - Amazon Security Lake"
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-management.html
