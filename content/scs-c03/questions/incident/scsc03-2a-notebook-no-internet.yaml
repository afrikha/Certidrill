id: scsc03-2a-notebook-no-internet
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's incident response team uses an Amazon SageMaker AI notebook instance to run Amazon Athena queries against AWS CloudTrail logs that are stored in Amazon S3 and catalogued in the AWS Glue Data Catalog. A new security policy states that the notebook instance must have no path to the internet. The Athena queries must keep working.

    Which combination of steps will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |-
    L'équipe de réponse aux incidents d'AnyCompany utilise une instance de bloc-notes Amazon SageMaker AI pour exécuter des requêtes Amazon Athena sur des journaux AWS CloudTrail stockés dans Amazon S3 et catalogués dans AWS Glue Data Catalog. Une nouvelle politique de sécurité impose que l'instance de bloc-notes n'ait aucun chemin vers Internet. Les requêtes Athena doivent continuer de fonctionner.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create the notebook instance in a private subnet of a VPC with direct internet access disabled.
        fr: |-
          Créer l'instance de bloc-notes dans un sous-réseau privé d'un VPC avec l'accès direct à Internet désactivé.
    - id: b
      text:
        en: |-
          Keep direct internet access enabled, and attach a security group that allows outbound HTTPS only to the AWS IP address ranges.
        fr: |-
          Conserver l'accès direct à Internet activé, et attacher un groupe de sécurité qui n'autorise le HTTPS sortant que vers les plages d'adresses IP d'AWS.
    - id: c
      text:
        en: |-
          Disable root access on the notebook instance so that users cannot install packages from the internet.
        fr: |-
          Désactiver l'accès root sur l'instance de bloc-notes afin que les utilisateurs ne puissent pas installer de paquets depuis Internet.
    - id: d
      text:
        en: |-
          Create interface VPC endpoints for Athena and AWS Glue and a gateway VPC endpoint for Amazon S3 in that VPC.
        fr: |-
          Créer dans ce VPC des points de terminaison d'interface VPC pour Athena et AWS Glue et un point de terminaison de passerelle VPC pour Amazon S3.
    - id: e
      text:
        en: |-
          Add a NAT gateway to the subnet, and add a network ACL that denies inbound traffic from the internet.
        fr: |-
          Ajouter une passerelle NAT au sous-réseau, et ajouter une liste ACL réseau qui refuse le trafic entrant depuis Internet.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      By default, SageMaker AI gives a notebook instance internet access through a network interface in a VPC that it manages; specifying your VPC with direct internet access disabled removes that path. The instance can then reach AWS services only through VPC endpoints or a NAT gateway, so endpoints for Athena, AWS Glue and Amazon S3 keep the queries working without any internet path.
    fr: |-
      Par défaut, SageMaker AI donne à une instance de bloc-notes un accès à Internet au moyen d'une interface réseau dans un VPC qu'il gère ; spécifier votre VPC avec l'accès direct à Internet désactivé supprime ce chemin. L'instance ne peut alors atteindre les services AWS qu'au moyen de points de terminaison VPC ou d'une passerelle NAT : des points de terminaison pour Athena, AWS Glue et Amazon S3 maintiennent les requêtes sans aucun chemin vers Internet.
  options:
    b:
      en: |-
        With direct internet access enabled, traffic outside the VPC goes through the SageMaker AI managed network interface to the internet.
      fr: |-
        Avec l'accès direct à Internet activé, le trafic hors du VPC passe par l'interface réseau gérée par SageMaker AI vers Internet.
    c:
      en: |-
        Root access controls what users can do on the instance, not its network paths.
      fr: |-
        L'accès root contrôle ce que les utilisateurs peuvent faire sur l'instance, pas ses chemins réseau.
    e:
      en: |-
        A NAT gateway is an outbound path to the internet, which the policy forbids.
      fr: |-
        Une passerelle NAT est un chemin sortant vers Internet, ce que la politique interdit.
references:
  - title: "Connect a Notebook Instance in a VPC to External Resources - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/appendix-notebook-and-internet-access.html
