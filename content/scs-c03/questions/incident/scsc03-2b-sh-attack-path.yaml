id: scsc03-2b-sh-attack-path
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany enabled AWS Security Hub for its organization, with Security Hub CSPM, Amazon Inspector, Amazon GuardDuty, and Amazon Macie sending findings to it. Security Hub reports an exposure finding for an EC2 instance. To assess the potential impact, an analyst must see how an attacker could reach the instance and take control of the resources associated with the exposure.

    What should the analyst use?
  fr: |
    AnyCompany a activé AWS Security Hub pour son organisation, avec Security Hub CSPM, Amazon Inspector, Amazon GuardDuty et Amazon Macie qui lui envoient leurs résultats. Security Hub signale un résultat d'exposition pour une instance EC2. Pour évaluer l'impact potentiel, un analyste doit voir comment un attaquant pourrait atteindre l'instance et prendre le contrôle des ressources associées à l'exposition.

    Qu'est-ce que l'analyste doit utiliser ?
body:
  options:
    - id: a
      text: { en: "The attack path graph of the exposure finding in Security Hub", fr: "Le graphe de chemin d'attaque du résultat d'exposition dans Security Hub" }
    - id: b
      text: { en: "A Security Hub CSPM custom insight grouped by resource ID", fr: "Un aperçu personnalisé Security Hub CSPM regroupé par ID de ressource" }
    - id: c
      text: { en: "A Network Access Analyzer scope that targets the instance", fr: "Une étendue Network Access Analyzer qui cible l'instance" }
    - id: d
      text: { en: "The security checks of AWS Trusted Advisor", fr: "Les vérifications de sécurité d'AWS Trusted Advisor" }
answer: { optionId: a }
explanation:
  correct:
    en: "Security Hub correlates signals from Security Hub CSPM, Inspector, Macie, GuardDuty, and other services into exposure findings. For each exposure finding, it provides an interactive attack path graph that shows how potential attackers can access and take control of the resources associated with the exposure."
    fr: "Security Hub corrèle les signaux de Security Hub CSPM, d'Inspector, de Macie, de GuardDuty et d'autres services en résultats d'exposition. Pour chaque résultat d'exposition, il fournit un graphe interactif de chemin d'attaque qui montre comment des attaquants potentiels peuvent accéder aux ressources associées à l'exposition et en prendre le contrôle."
  options:
    b:
      en: "An insight groups and counts findings; it does not show how the issues combine into a path to the resource."
      fr: "Un aperçu regroupe et compte les résultats ; il ne montre pas comment les problèmes se combinent en un chemin vers la ressource."
    c:
      en: "Network Access Analyzer finds network paths only, without the vulnerabilities and permissions that let an attacker take control."
      fr: "Network Access Analyzer ne trouve que des chemins réseau, sans les vulnérabilités ni les autorisations qui permettent à un attaquant de prendre le contrôle."
    d:
      en: "Trusted Advisor checks report account-level best practices, not the exposure of a specific finding."
      fr: "Les vérifications de Trusted Advisor signalent des bonnes pratiques au niveau du compte, et non l'exposition d'un résultat précis."
references:
  - title: "Introduction to AWS Security Hub - AWS Security Hub"
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub-v2.html
