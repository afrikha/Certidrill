id: scsc03-2b-det-eks-gap
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany enabled Amazon Detective a year ago with the optional EKS audit logs source package. To reduce cost, the security team stopped the EKS audit logs package on March 1 and started it again on May 1. The team now investigates suspicious Kubernetes API activity in an Amazon EKS cluster on April 12. The audit control plane log type of the cluster has been sent to Amazon CloudWatch Logs since the cluster was created, with a 2-year retention.

    How should the team analyze the April 12 activity?
  fr: |
    AnyCompany a activé Amazon Detective il y a un an avec le package de sources facultatif EKS audit logs. Pour réduire les coûts, l'équipe de sécurité a arrêté ce package le 1er mars et l'a redémarré le 1er mai. L'équipe enquête maintenant sur une activité suspecte de l'API Kubernetes dans un cluster Amazon EKS le 12 avril. Le type de journal audit du plan de contrôle du cluster est envoyé à Amazon CloudWatch Logs depuis la création du cluster, avec une rétention de 2 ans.

    Comment l'équipe doit-elle analyser l'activité du 12 avril ?
body:
  options:
    - id: a
      text: { en: "Stop and restart the EKS audit logs package in Detective so that Detective ingests the missing period again, and then review the cluster's profile.", fr: "Arrêter puis redémarrer le package EKS audit logs dans Detective pour que Detective ingère à nouveau la période manquante, puis examiner le profil du cluster." }
    - id: b
      text: { en: "Change the scope time of the cluster's profile in Detective to April 12, because Detective keeps up to 1 year of data for each package.", fr: "Régler sur le 12 avril la période d'analyse (scope time) du profil du cluster dans Detective, car Detective conserve jusqu'à 1 an de données pour chaque package." }
    - id: c
      text: { en: "Run CloudWatch Logs Insights queries on the audit log streams of the cluster's log group for April 12.", fr: "Exécuter des requêtes CloudWatch Logs Insights sur les flux de journaux d'audit du groupe de journaux du cluster pour le 12 avril." }
    - id: d
      text: { en: "Query the organization's AWS CloudTrail logs for the Kubernetes API calls that were made on the cluster on April 12.", fr: "Interroger les journaux AWS CloudTrail de l'organisation pour les appels à l'API Kubernetes effectués sur le cluster le 12 avril." }
answer: { optionId: c }
explanation:
  correct:
    en: "When an optional source package is stopped and restarted, Detective profiles show a gap for the stopped period, and Detective does not ingest that period retroactively. The audit records still exist in the cluster's CloudWatch Logs log group, so a Logs Insights query for April 12 provides the users, verbs, and objects of the suspicious requests."
    fr: "Quand un package de sources facultatif est arrêté puis redémarré, les profils Detective montrent un trou pour la période d'arrêt, et Detective n'ingère pas cette période rétroactivement. Les enregistrements d'audit existent toujours dans le groupe de journaux CloudWatch Logs du cluster : une requête Logs Insights pour le 12 avril fournit les utilisateurs, les verbes et les objets des requêtes suspectes."
  options:
    a:
      en: "Restarting a package resumes ingestion from that moment; Detective never ingests data for the period when the package was stopped."
      fr: "Redémarrer un package reprend l'ingestion à partir de ce moment ; Detective n'ingère jamais les données de la période pendant laquelle le package était arrêté."
    b:
      en: "The 1-year retention applies to data that Detective ingested, and nothing was ingested from the EKS audit logs package in April."
      fr: "La rétention d'un an s'applique aux données que Detective a ingérées, et rien n'a été ingéré par le package EKS audit logs en avril."
    d:
      en: "Kubernetes API requests are not AWS API calls, so CloudTrail does not record them."
      fr: "Les requêtes à l'API Kubernetes ne sont pas des appels d'API AWS : CloudTrail ne les enregistre pas."
references:
  - title: "Source data used in a Detective behavior graph - Amazon Detective"
    url: https://docs.aws.amazon.com/detective/latest/userguide/detective-source-data-about.html
  - title: "Send control plane logs to CloudWatch Logs - Amazon EKS"
    url: https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html
