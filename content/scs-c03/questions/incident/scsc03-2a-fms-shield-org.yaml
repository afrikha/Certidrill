id: scsc03-2a-fms-shield-org
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany has 60 accounts in AWS Organizations and subscribes to AWS Shield Advanced. Application teams create new Amazon CloudFront distributions and Application Load Balancers every week. The security team must make sure that every current and future distribution and load balancer in the production OU is protected by Shield Advanced. The AWS Firewall Manager prerequisites are complete. The team wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany dispose de 60 comptes dans AWS Organizations et est abonnée à AWS Shield Advanced. Les équipes applicatives créent chaque semaine de nouvelles distributions Amazon CloudFront et de nouveaux Application Load Balancers. L'équipe de sécurité doit s'assurer que chaque distribution et chaque équilibreur de charge, actuels et futurs, de l'UO de production sont protégés par Shield Advanced. Les prérequis d'AWS Firewall Manager sont remplis. L'équipe veut la solution qui implique le MOINS de frais opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          In the Firewall Manager administrator account, create a Shield Advanced policy scoped to the production OU with automatic remediation.
        fr: |-
          Dans le compte d'administrateur Firewall Manager, créer une politique Shield Advanced dont l'étendue est l'UO de production, avec correction automatique.
    - id: b
      text:
        en: |-
          Deploy an AWS CloudFormation StackSet with AWS::Shield::Protection resources to the production OU, and update the StackSet when teams create resources.
        fr: |-
          Déployer dans l'UO de production un StackSet AWS CloudFormation avec des ressources AWS::Shield::Protection, et mettre à jour le StackSet lorsque les équipes créent des ressources.
    - id: c
      text:
        en: |-
          Deploy the AWS Config managed rule shield-advanced-enabled-autorenew to the production OU, and review its noncompliant results every week.
        fr: |-
          Déployer dans l'UO de production la règle gérée AWS Config shield-advanced-enabled-autorenew, et examiner ses résultats non conformes chaque semaine.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule in each account that invokes an AWS Lambda function that calls CreateProtection when a resource is created.
        fr: |-
          Créer dans chaque compte une règle Amazon EventBridge qui invoque une fonction AWS Lambda qui appelle CreateProtection lorsqu'une ressource est créée.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A Firewall Manager Shield Advanced policy selects the resource types to protect in the accounts of its scope. With automatic remediation, Firewall Manager applies the protection to every in-scope resource, including resources created later, and associates an empty AWS WAF web ACL for Shield monitoring when a resource has none.
    fr: |-
      Une politique Shield Advanced Firewall Manager sélectionne les types de ressources à protéger dans les comptes de son étendue. Avec la correction automatique, Firewall Manager applique la protection à chaque ressource de l'étendue, y compris aux ressources créées plus tard, et associe une ACL web AWS WAF vide pour la surveillance Shield lorsqu'une ressource n'en a pas.
  options:
    b:
      en: |-
        The StackSet must be updated by hand for every new resource, so new resources stay unprotected until someone does it.
      fr: |-
        Le StackSet doit être mis à jour à la main pour chaque nouvelle ressource : les nouvelles ressources restent sans protection jusqu'à ce que quelqu'un le fasse.
    c:
      en: |-
        This rule checks the Shield Advanced subscription and its renewal; it does not protect any resource.
      fr: |-
        Cette règle vérifie l'abonnement Shield Advanced et son renouvellement ; elle ne protège aucune ressource.
    d:
      en: |-
        Custom code in every account is more overhead than a managed organization-wide policy.
      fr: |-
        Du code personnalisé dans chaque compte représente plus de frais qu'une politique gérée à l'échelle de l'organisation.
references:
  - title: "Using AWS Shield Advanced policies in Firewall Manager - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/shield-policies.html
  - title: "AWS Firewall Manager prerequisites - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director"
    url: https://docs.aws.amazon.com/waf/latest/developerguide/fms-prereq.html
