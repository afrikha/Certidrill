id: scsc03-2b-config-timeline-sg
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Last month, a security group in a production account allowed inbound TCP port 3389 from 0.0.0.0/0 for 3 days, and an attacker used the opening. AWS Config records all resource types in the account, and an AWS CloudTrail trail is active. For the root cause analysis, the security team must establish when the rule was added and removed, what the security group's configuration was before and after each change, and which API call made each change.

    Which solution will meet these requirements?
  fr: |
    Le mois dernier, un groupe de sécurité d'un compte de production a autorisé le port TCP 3389 en entrée depuis 0.0.0.0/0 pendant 3 jours, et un attaquant a utilisé cette ouverture. AWS Config enregistre tous les types de ressources du compte, et un journal de suivi AWS CloudTrail est actif. Pour l'analyse des causes racines, l'équipe de sécurité doit établir quand la règle a été ajoutée et supprimée, quelle était la configuration du groupe de sécurité avant et après chaque modification, et quel appel d'API a effectué chaque modification.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Query the VPC flow logs of the affected subnet for accepted traffic on port 3389 during the period.", fr: "Interroger les journaux de flux VPC du sous-réseau concerné pour le trafic accepté sur le port 3389 pendant la période." }
    - id: b
      text: { en: "Review the Amazon Inspector network reachability findings for the instances that use the security group.", fr: "Examiner les résultats d'accessibilité réseau Amazon Inspector des instances qui utilisent le groupe de sécurité." }
    - id: c
      text: { en: "Open the AWS Config resource timeline of the security group, and review its configuration events together with the related CloudTrail events.", fr: "Ouvrir la chronologie de la ressource AWS Config du groupe de sécurité, et examiner ses événements de configuration avec les événements CloudTrail associés." }
    - id: d
      text: { en: "Review the AWS Trusted Advisor check for security groups with unrestricted access.", fr: "Examiner la vérification AWS Trusted Advisor des groupes de sécurité avec un accès non restreint." }
answer: { optionId: c }
explanation:
  correct:
    en: "The resource timeline shows the configuration items that AWS Config captured for the security group over time, so the team sees the configuration before and after each change. The timeline can be filtered by configuration events and CloudTrail events, which link each change to the API call that made it."
    fr: "La chronologie de la ressource montre les éléments de configuration qu'AWS Config a capturés pour le groupe de sécurité au fil du temps : l'équipe voit la configuration avant et après chaque modification. La chronologie peut être filtrée par événements de configuration et par événements CloudTrail, qui relient chaque modification à l'appel d'API qui l'a effectuée."
  options:
    a:
      en: "Flow logs show traffic that the rule allowed, not when the rule changed or who changed it."
      fr: "Les journaux de flux montrent le trafic autorisé par la règle, et non le moment où la règle a changé ni qui l'a modifiée."
    b:
      en: "Network reachability findings describe the current exposure, not the history of changes from last month."
      fr: "Les résultats d'accessibilité réseau décrivent l'exposition actuelle, et non l'historique des modifications du mois dernier."
    d:
      en: "Trusted Advisor reports the current state of security groups, not past configurations or the API calls that changed them."
      fr: "Trusted Advisor signale l'état actuel des groupes de sécurité, et non leurs configurations passées ni les appels d'API qui les ont modifiés."
references:
  - title: "Viewing Compliance History for your AWS Resources with AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/view-manage-resource-console.html
