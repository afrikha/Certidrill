id: scsc03-2b-det-securitylake-raw
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses Amazon Detective and Amazon Security Lake in the same delegated administrator account and Region. Security Lake collects AWS CloudTrail management events and Amazon VPC Flow Logs for all accounts. During root cause analysis, analysts who review Detective profiles must also inspect the raw CloudTrail and VPC flow log records behind the aggregated activity, from the Detective console, without building a separate query pipeline.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise Amazon Detective et Amazon Security Lake dans le même compte administrateur délégué et la même Région. Security Lake collecte les événements de gestion AWS CloudTrail et les journaux de flux Amazon VPC de tous les comptes. Pendant l'analyse des causes racines, les analystes qui examinent les profils Detective doivent aussi inspecter les enregistrements bruts CloudTrail et de flux VPC à l'origine de l'activité agrégée, depuis la console Detective, sans construire de chaîne de requêtes distincte.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable the optional AWS security findings source package in Detective.", fr: "Activer dans Detective le package de sources facultatif AWS security findings." }
    - id: b
      text: { en: "Create a Security Lake data access subscriber for the Detective account, and process the new objects with an AWS Lambda function.", fr: "Créer un abonné avec accès aux données Security Lake pour le compte Detective, et traiter les nouveaux objets avec une fonction AWS Lambda." }
    - id: c
      text: { en: "Add Detective to Security Lake as a custom source so that the behavior graph receives the raw logs.", fr: "Ajouter Detective à Security Lake comme source personnalisée pour que le graphe de comportement reçoive les journaux bruts." }
    - id: d
      text: { en: "Enable the Detective integration with Security Lake, and query the raw logs from the Detective profiles.", fr: "Activer l'intégration de Detective avec Security Lake, et interroger les journaux bruts depuis les profils Detective." }
answer: { optionId: d }
explanation:
  correct:
    en: "After the integration with Security Lake is enabled, Detective can query and retrieve the raw log data that Security Lake stores for CloudTrail management events and VPC Flow Logs, and also EKS audit logs. Analysts see the raw records from the Detective console while they investigate a profile, with no pipeline to build."
    fr: "Une fois l'intégration avec Security Lake activée, Detective peut interroger et récupérer les données brutes de journaux que Security Lake stocke pour les événements de gestion CloudTrail et les journaux de flux VPC, ainsi que pour les journaux d'audit EKS. Les analystes voient les enregistrements bruts depuis la console Detective pendant qu'ils examinent un profil, sans chaîne à construire."
  options:
    a:
      en: "The AWS security findings package ingests Security Hub CSPM findings, not raw CloudTrail or VPC flow log records."
      fr: "Le package AWS security findings ingère les résultats Security Hub CSPM, et non les enregistrements bruts CloudTrail ou de flux VPC."
    b:
      en: "A data access subscriber with a Lambda function is exactly the separate pipeline the analysts want to avoid, and its output is not visible in Detective."
      fr: "Un abonné avec accès aux données et une fonction Lambda constituent précisément la chaîne distincte que les analystes veulent éviter, et leur résultat n'est pas visible dans Detective."
    c:
      en: "A custom source writes third-party OCSF data into Security Lake; it does not make Detective read the lake."
      fr: "Une source personnalisée écrit des données OCSF de tiers dans Security Lake ; elle ne fait pas lire le lac par Detective."
references:
  - title: "Amazon Detective Integration with Amazon Security Lake - Amazon Detective"
    url: https://docs.aws.amazon.com/detective/latest/userguide/securitylake-integration.html
