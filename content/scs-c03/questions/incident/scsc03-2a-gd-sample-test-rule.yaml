id: scsc03-2a-gd-sample-test-rule
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany created an Amazon EventBridge rule that sends Amazon GuardDuty findings of the type UnauthorizedAccess:EC2/SSHBruteForce to an Amazon SNS topic for the on-call team. The security team must confirm that the event pattern of the rule and the notification work. The team must not generate any attack traffic and wants the LEAST effort.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany a créé une règle Amazon EventBridge qui envoie les résultats Amazon GuardDuty du type UnauthorizedAccess:EC2/SSHBruteForce à une rubrique Amazon SNS destinée à l'équipe d'astreinte. L'équipe de sécurité doit confirmer que le modèle d'événement de la règle et la notification fonctionnent. L'équipe ne doit générer aucun trafic d'attaque et veut le MOINS d'efforts.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Run an SSH brute force tool from an external host against a test instance until GuardDuty reports the finding.
        fr: |-
          Exécuter un outil de force brute SSH depuis un hôte externe contre une instance de test jusqu'à ce que GuardDuty signale le résultat.
    - id: b
      text:
        en: |-
          Call the GuardDuty CreateSampleFindings API for the UnauthorizedAccess:EC2/SSHBruteForce finding type.
        fr: |-
          Appeler l'API GuardDuty CreateSampleFindings pour le type de résultat UnauthorizedAccess:EC2/SSHBruteForce.
    - id: c
      text:
        en: |-
          Create an AWS FIS experiment that runs the aws:ec2:reboot-instances action on a test instance to simulate the attack.
        fr: |-
          Créer une expérience AWS FIS qui exécute l'action aws:ec2:reboot-instances sur une instance de test pour simuler l'attaque.
    - id: d
      text:
        en: |-
          Archive the existing findings of that type, and use Amazon Detective to replay them to the EventBridge rule.
        fr: |-
          Archiver les résultats existants de ce type, et utiliser Amazon Detective pour les rejouer vers la règle EventBridge.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CreateSampleFindings generates a sample finding of any supported type that you specify. Sample findings are marked with [SAMPLE] in the console and "sample": true in their details, and GuardDuty presents them as a way to test EventBridge rules and automation based on findings without real activity.
    fr: |-
      CreateSampleFindings génère un exemple de résultat de n'importe quel type pris en charge que vous spécifiez. Les exemples de résultats sont marqués [SAMPLE] dans la console et "sample": true dans leurs détails, et GuardDuty les présente comme un moyen de tester les règles EventBridge et l'automatisation fondée sur les résultats sans activité réelle.
  options:
    a:
      en: |-
        This generates real attack traffic, which the team must avoid, and takes far more effort.
      fr: |-
        Cela génère un vrai trafic d'attaque, ce que l'équipe doit éviter, et demande bien plus d'efforts.
    c:
      en: |-
        Rebooting an instance does not cause GuardDuty to report an SSH brute force finding.
      fr: |-
        Redémarrer une instance ne conduit pas GuardDuty à signaler un résultat de force brute SSH.
    d:
      en: |-
        Detective is an investigation service; it does not send findings to EventBridge rules.
      fr: |-
        Detective est un service d'investigation ; il n'envoie pas de résultats aux règles EventBridge.
references:
  - title: "Generating sample findings in GuardDuty - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/sample_findings.html
