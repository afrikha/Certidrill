id: scsc03-2b-revoke-role-sessions
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon GuardDuty reports an UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS finding for the IAM role WebAppRole, which the instances of an Auto Scaling group use. The stolen temporary credentials remain valid for several more hours. The security team must immediately make every credential that was issued for WebAppRole before now unusable. Credentials that the role issues after the action must keep working, and a short disruption of the web tier is acceptable.

    Which solution will meet these requirements?
  fr: |
    Amazon GuardDuty signale un résultat UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS pour le rôle IAM WebAppRole, qu'utilisent les instances d'un groupe Auto Scaling. Les informations d'identification temporaires volées restent valides plusieurs heures. L'équipe de sécurité doit rendre immédiatement inutilisables toutes les informations d'identification émises pour WebAppRole jusqu'à maintenant. Les informations d'identification que le rôle émet après l'action doivent continuer à fonctionner, et une courte interruption de la couche web est acceptable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Choose Revoke active sessions for WebAppRole in the IAM console, which attaches a policy that denies all actions to credentials issued before the revocation time.", fr: "Choisir Revoke active sessions pour WebAppRole dans la console IAM, ce qui attache une politique qui refuse toutes les actions aux informations d'identification émises avant l'heure de révocation." }
    - id: b
      text: { en: "Delete the instance profile that contains WebAppRole, create a new instance profile, and associate it with the instances.", fr: "Supprimer le profil d'instance qui contient WebAppRole, créer un nouveau profil d'instance et l'associer aux instances." }
    - id: c
      text: { en: "Set the status of the access key ID from the finding to Inactive on the Security credentials tab of WebAppRole.", fr: "Passer à Inactive l'état de l'ID de clé d'accès du résultat dans l'onglet Security credentials de WebAppRole." }
    - id: d
      text: { en: "Attach a service control policy to the account that denies all actions when aws:PrincipalArn is the ARN of WebAppRole.", fr: "Attacher au compte une politique de contrôle des services qui refuse toutes les actions quand aws:PrincipalArn est l'ARN de WebAppRole." }
answer: { optionId: a }
explanation:
  correct:
    en: "Revoking active sessions attaches the AWSRevokeOlderSessions inline policy to the role. It denies every action when aws:TokenIssueTime is earlier than the revocation time, so all existing temporary credentials of the role fail, while credentials issued afterward are not affected. The instances recover when they obtain new role credentials."
    fr: "Révoquer les sessions actives attache au rôle la politique en ligne AWSRevokeOlderSessions. Elle refuse toutes les actions quand aws:TokenIssueTime est antérieur à l'heure de révocation : toutes les informations d'identification temporaires existantes du rôle échouent, tandis que celles émises ensuite ne sont pas touchées. Les instances se rétablissent lorsqu'elles obtiennent de nouvelles informations d'identification du rôle."
  options:
    b:
      en: "Replacing the instance profile does not invalidate credentials that were already issued; they stay valid until they expire."
      fr: "Remplacer le profil d'instance n'invalide pas les informations d'identification déjà émises ; elles restent valides jusqu'à leur expiration."
    c:
      en: "Temporary credentials that start with ASIA are not access keys of an IAM user and cannot be deactivated; roles have no access keys to manage."
      fr: "Les informations d'identification temporaires qui commencent par ASIA ne sont pas des clés d'accès d'un utilisateur IAM et ne peuvent pas être désactivées ; les rôles n'ont pas de clés d'accès à gérer."
    d:
      en: "Denying the role ARN blocks every session of the role, including new ones, so the web tier would stay broken."
      fr: "Refuser l'ARN du rôle bloque toutes les sessions du rôle, y compris les nouvelles : la couche web resterait en panne."
references:
  - title: "Revoke IAM role temporary security credentials - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_revoke-sessions.html
