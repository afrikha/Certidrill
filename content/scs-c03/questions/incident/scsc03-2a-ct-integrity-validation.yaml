id: scsc03-2a-ct-integrity-validation
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany's legal team might need to prove that the AWS CloudTrail log files used as evidence in an investigation were not modified or deleted after CloudTrail delivered them to Amazon S3. The security team wants to use a native CloudTrail capability.

    Which solution will meet these requirements?
  fr: |-
    L'équipe juridique d'AnyCompany pourrait devoir prouver que les fichiers journaux AWS CloudTrail utilisés comme preuves dans une investigation n'ont été ni modifiés ni supprimés après leur livraison par CloudTrail dans Amazon S3. L'équipe de sécurité veut utiliser une capacité native de CloudTrail.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable S3 Versioning on the log bucket so that earlier versions of modified log files can be retrieved.
        fr: |-
          Activer S3 Versioning sur le compartiment de journaux afin de pouvoir récupérer les versions antérieures des fichiers journaux modifiés.
    - id: b
      text:
        en: |-
          Enable Amazon Macie on the log bucket so that changes to the content of the log files are detected.
        fr: |-
          Activer Amazon Macie sur le compartiment de journaux afin que les modifications du contenu des fichiers journaux soient détectées.
    - id: c
      text:
        en: |-
          Encrypt the trail's log files with SSE-KMS and a customer managed key so that only authorized principals can read them.
        fr: |-
          Chiffrer les fichiers journaux du journal de suivi (trail) avec SSE-KMS et une clé gérée par le client afin que seuls les principaux autorisés puissent les lire.
    - id: d
      text:
        en: |-
          Enable log file integrity validation on the trail, and validate the log files with the AWS CLI when the evidence is needed.
        fr: |-
          Activer la validation de l'intégrité des fichiers journaux sur le journal de suivi, et valider les fichiers journaux avec l'AWS CLI lorsque les preuves sont nécessaires.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With log file integrity validation, CloudTrail delivers every hour a digest file that contains a SHA-256 hash of each log file of the previous hour and is signed with SHA-256 with RSA, and each digest file is chained to the previous one. Validating with the AWS CLI shows whether each log file was modified, deleted, or unchanged after delivery.
    fr: |-
      Avec la validation de l'intégrité des fichiers journaux, CloudTrail livre toutes les heures un fichier de synthèse (digest) qui contient un hachage SHA-256 de chaque fichier journal de l'heure précédente et qui est signé avec SHA-256 avec RSA, et chaque fichier de synthèse est chaîné au précédent. La validation avec l'AWS CLI indique si chaque fichier journal a été modifié, supprimé ou laissé inchangé après sa livraison.
  options:
    a:
      en: |-
        Versioning keeps earlier versions but does not prove which version CloudTrail delivered or that no file was deleted.
      fr: |-
        La gestion des versions conserve les versions antérieures mais ne prouve pas quelle version CloudTrail a livrée ni qu'aucun fichier n'a été supprimé.
    b:
      en: |-
        Macie discovers sensitive data in objects; it does not verify the integrity of log files.
      fr: |-
        Macie découvre des données sensibles dans les objets ; il ne vérifie pas l'intégrité des fichiers journaux.
    c:
      en: |-
        Encryption controls who can read the files; it does not prove that they were not changed or deleted.
      fr: |-
        Le chiffrement contrôle qui peut lire les fichiers ; il ne prouve pas qu'ils n'ont été ni modifiés ni supprimés.
references:
  - title: "Validating CloudTrail log file integrity - AWS CloudTrail"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
