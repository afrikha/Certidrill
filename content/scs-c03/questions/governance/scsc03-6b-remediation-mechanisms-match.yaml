id: scsc03-6b-remediation-mechanisms-match
objective: "6.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team uses AWS Config and AWS Security Hub CSPM across its organization in AWS Organizations, and it has several compliance requirements.

    Match each requirement to the mechanism that meets it.

    To answer, drag the appropriate mechanism to each requirement. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe de sécurité d'AnyCompany utilise AWS Config et AWS Security Hub CSPM dans son organisation AWS Organizations, et elle a plusieurs exigences de conformité.

    Associez chaque exigence au mécanisme qui y répond.

    Pour répondre, faites glisser le mécanisme approprié vers chaque exigence. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: autorule, text: { en: "Security Hub CSPM automation rule", fr: "Règle d'automatisation Security Hub CSPM" } }
    - { id: customaction, text: { en: "Security Hub CSPM custom action with an EventBridge rule", fr: "Action personnalisée Security Hub CSPM avec une règle EventBridge" } }
    - { id: remediation, text: { en: "AWS Config automatic remediation with an Automation runbook", fr: "Correction automatique AWS Config avec un runbook Automation" } }
    - { id: orgpack, text: { en: "Organization conformance pack", fr: "Pack de conformité d'organisation" } }
    - { id: aggregator, text: { en: "Organization aggregator", fr: "Agrégateur d'organisation" } }
    - { id: proactive, text: { en: "Proactive evaluation of an AWS Config rule", fr: "Évaluation proactive d'une règle AWS Config" } }
  targets:
    - id: t1
      text: { en: "Raise the severity of findings from production accounts automatically when they are generated", fr: "Augmenter automatiquement la gravité des résultats des comptes de production lors de leur génération" }
    - id: t2
      text: { en: "Let an analyst select findings in the console and start an isolation workflow for those findings", fr: "Permettre à un analyste de sélectionner des résultats dans la console et de lancer un flux d'isolement pour ces résultats" }
    - id: t3
      text: { en: "Reconfigure a resource that your own Config rule marks NON_COMPLIANT, with retries", fr: "Reconfigurer une ressource que votre propre règle Config marque NON_COMPLIANT, avec de nouvelles tentatives" }
    - id: t4
      text: { en: "Deploy the same rules and remediations to every member account so that member accounts cannot change them", fr: "Déployer les mêmes règles et corrections dans chaque compte membre sans que les comptes membres puissent les modifier" }
    - id: t5
      text: { en: "Give the security account a read-only view of compliance in every account and Region", fr: "Donner au compte de sécurité une vue en lecture seule de la conformité dans chaque compte et chaque Région" }
answer:
  mapping: { t1: autorule, t2: customaction, t3: remediation, t4: orgpack, t5: aggregator }
explanation:
  correct:
    en: "Automation rules update finding fields such as severity when findings match their criteria. A custom action sends the findings that an analyst selects to EventBridge, where a rule matching the action's ARN starts the workflow. Config remediation runs an Automation runbook on noncompliant resources, with configurable retries. Organization conformance packs deploy rules and remediations that member accounts cannot modify, and an organization aggregator collects compliance data from every account and Region without granting write access."
    fr: "Les règles d'automatisation mettent à jour des champs des résultats, comme la gravité, lorsque les résultats correspondent à leurs critères. Une action personnalisée envoie à EventBridge les résultats qu'un analyste sélectionne, et une règle qui correspond à l'ARN de l'action lance le flux. La correction Config exécute un runbook Automation sur les ressources non conformes, avec des nouvelles tentatives configurables. Les packs de conformité d'organisation déploient des règles et des corrections que les comptes membres ne peuvent pas modifier, et un agrégateur d'organisation collecte les données de conformité de chaque compte et de chaque Région sans accorder d'accès en écriture."
  options:
    proactive:
      en: "Proactive evaluation checks resource properties before deployment; it neither remediates nor gives a view of deployed resources."
      fr: "L'évaluation proactive vérifie les propriétés des ressources avant le déploiement ; elle ne corrige rien et ne donne pas de vue des ressources déployées."
references:
  - title: Using custom actions to send findings and insight results to EventBridge - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-cwe-custom-actions.html
  - title: Multi-Account Multi-Region Data Aggregation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html
