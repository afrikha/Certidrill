id: scsc03-6b-tag-config-rule-scope
objective: "6.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs development and production Amazon EC2 instances in the same accounts. All instances carry an Environment tag with the value dev or prod, and AWS Config records all resource types. The security team wants the AWS managed rule ec2-instance-no-public-ip to evaluate only the instances tagged Environment=prod, and to evaluate each of them again whenever its configuration changes.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des instances Amazon EC2 de développement et de production dans les mêmes comptes. Toutes les instances portent une balise Environment avec la valeur dev ou prod, et AWS Config enregistre tous les types de ressources. L'équipe de sécurité veut que la règle gérée AWS ec2-instance-no-public-ip n'évalue que les instances balisées Environment=prod, et qu'elle évalue de nouveau chacune d'elles à chaque modification de sa configuration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Change the rule to a periodic trigger that runs every 24 hours, and pass Environment=prod as an input parameter of the rule."
        fr: "Passer la règle à un déclencheur périodique toutes les 24 heures et transmettre Environment=prod comme paramètre d'entrée de la règle."
    - id: b
      text:
        en: "Create a tag-based resource group for Environment=prod and add it as the source of an AWS Config aggregator that runs the rule."
        fr: "Créer un groupe de ressources basé sur les balises pour Environment=prod et l'ajouter comme source d'un agrégateur AWS Config qui exécute la règle."
    - id: c
      text:
        en: "Turn on the proactive evaluation mode of the rule and submit only the production instances with StartResourceEvaluation."
        fr: "Activer le mode d'évaluation proactive de la règle et ne soumettre que les instances de production avec StartResourceEvaluation."
    - id: d
      text:
        en: "Keep the configuration change trigger and set the rule scope to the tag key Environment with the value prod."
        fr: "Conserver le déclencheur sur modification de configuration et définir l'étendue de la règle sur la clé de balise Environment avec la valeur prod."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The scope of a change-triggered Config rule can be one or more resource types, a resource type and ID, or a combination of a tag key and value. With the scope Environment=prod, only production instances are evaluated, each time Config records a change to one of them.
    fr: |-
      L'étendue d'une règle Config déclenchée par les modifications peut être un ou plusieurs types de ressources, un type et un ID de ressource, ou une combinaison de clé et de valeur de balise. Avec l'étendue Environment=prod, seules les instances de production sont évaluées, chaque fois que Config enregistre une modification de l'une d'elles.
  options:
    a:
      en: |-
        A periodic trigger does not evaluate when a configuration changes, and this managed rule has no parameter that filters resources by tag.
      fr: |-
        Un déclencheur périodique n'évalue pas lors d'une modification de configuration, et cette règle gérée n'a aucun paramètre qui filtre les ressources par balise.
    b:
      en: |-
        An aggregator only collects configuration and compliance data from source accounts and Regions; it does not run rules, and its sources are accounts or an organization, not resource groups.
      fr: |-
        Un agrégateur collecte seulement les données de configuration et de conformité des comptes et Régions sources ; il n'exécute pas de règles, et ses sources sont des comptes ou une organisation, pas des groupes de ressources.
    c:
      en: |-
        Proactive evaluation checks resource properties before deployment; it does not evaluate deployed instances when they change.
      fr: |-
        L'évaluation proactive vérifie les propriétés des ressources avant le déploiement ; elle n'évalue pas les instances déployées lorsqu'elles changent.
references:
  - title: Components of an AWS Config Rule - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config_components.html
