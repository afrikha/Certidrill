id: scsc03-6b-artifact-config-pci-evidence
objective: "6.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany processes cardholder data in four accounts of its organization in AWS Organizations and has never used AWS Audit Manager. AWS Security Hub CSPM is enabled in those accounts, and the security operations team already works from its findings. For the annual PCI DSS assessment, the auditor requests two items: the PCI DSS Attestation of Compliance that covers the AWS services in use, and evidence of the current compliance status of the company's own resources against PCI DSS technical requirements.

    Which combination of steps will provide this evidence? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    AnyCompany traite des données de titulaires de cartes dans quatre comptes de son organisation AWS Organizations et n'a jamais utilisé AWS Audit Manager. AWS Security Hub CSPM est activé dans ces comptes, et l'équipe des opérations de sécurité travaille déjà à partir de ses résultats. Pour l'évaluation PCI DSS annuelle, l'auditeur demande deux éléments : l'attestation de conformité (AOC) PCI DSS qui couvre les services AWS utilisés, et une preuve de l'état de conformité actuel des ressources de l'entreprise par rapport aux exigences techniques de PCI DSS.

    Quelle combinaison d'étapes fournit ces preuves ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Download the AWS PCI DSS Attestation of Compliance from AWS Artifact."
        fr: "Télécharger l'attestation de conformité PCI DSS d'AWS depuis AWS Artifact."
    - id: b
      text:
        en: "Set up AWS Audit Manager in the four accounts and create an assessment from the PCI DSS standard framework."
        fr: "Configurer AWS Audit Manager dans les quatre comptes et créer une évaluation à partir du cadre standard PCI DSS."
    - id: c
      text:
        en: "Open an AWS Support case to ask AWS to send its PCI DSS Attestation of Compliance to the auditor."
        fr: "Ouvrir un dossier AWS Support pour demander à AWS d'envoyer son attestation de conformité PCI DSS à l'auditeur."
    - id: d
      text:
        en: "Enable the PCI DSS standard in Security Hub CSPM in the four accounts, and provide its control findings and compliance status."
        fr: "Activer la norme PCI DSS dans Security Hub CSPM dans les quatre comptes, et fournir les résultats de ses contrôles et son état de conformité."
    - id: e
      text:
        en: "Download from AWS Artifact a PCI DSS report that lists the compliance status of the company's resources."
        fr: "Télécharger depuis AWS Artifact un rapport PCI DSS qui liste l'état de conformité des ressources de l'entreprise."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Under the shared responsibility model, AWS Artifact provides AWS's own compliance documents, such as PCI DSS reports, on demand at no cost, and they can be given to auditors. The company proves its own side with checks of its resources: the PCI DSS standard in Security Hub CSPM evaluates the resources of the four accounts and reports the status of each control.
    fr: |-
      Selon le modèle de responsabilité partagée, AWS Artifact fournit à la demande et gratuitement les documents de conformité d'AWS lui-même, comme les rapports PCI DSS, qui peuvent être remis aux auditeurs. L'entreprise prouve sa propre part par des vérifications de ses ressources : la norme PCI DSS de Security Hub CSPM évalue les ressources des quatre comptes et indique l'état de chaque contrôle.
  options:
    b:
      en: |-
        Audit Manager has been closed to new customers since April 30, 2026, and the company has never used it.
      fr: |-
        Audit Manager est fermé aux nouveaux clients depuis le 30 avril 2026, et l'entreprise ne l'a jamais utilisé.
    c:
      en: |-
        AWS compliance reports are self-service in AWS Artifact; no support case is needed.
      fr: |-
        Les rapports de conformité AWS sont en libre-service dans AWS Artifact ; aucun dossier de support n'est nécessaire.
    e:
      en: |-
        AWS Artifact documents describe AWS's infrastructure and services; the customer is responsible for evidence about its own resources.
      fr: |-
        Les documents AWS Artifact décrivent l'infrastructure et les services d'AWS ; le client est responsable des preuves portant sur ses propres ressources.
references:
  - title: What is AWS Artifact? - AWS Artifact
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
  - title: AWS Audit Manager availability change - AWS Audit Manager
    url: https://docs.aws.amazon.com/audit-manager/latest/userguide/audit-manager-availability-change.html
