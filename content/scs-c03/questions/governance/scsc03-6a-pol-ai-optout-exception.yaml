id: scsc03-6a-pol-ai-optout-exception
objective: "6.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany must opt out of content use by all AWS AI services in every account, including for AI services that AWS adds later. Accounts in the ContactCenter OU are the only exception: they must opt in to Amazon Lex only. The security team will attach one AI services opt-out policy to the organization root and one to the ContactCenter OU.

    Which pair of policies will meet these requirements?
  fr: |-
    AnyCompany doit désactiver l'utilisation du contenu par tous les services d'IA AWS dans chaque compte, y compris pour les services d'IA qu'AWS ajoutera ultérieurement. Les comptes de l'OU ContactCenter sont la seule exception : ils doivent activer uniquement Amazon Lex. L'équipe de sécurité attachera une politique de désactivation des services d'IA (AI services opt-out policy) à la racine de l'organisation et une à l'OU ContactCenter.

    Quelle paire de politiques répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Root: `default` with `@@assign: optOut`, locked with `@@none` on `default` and on `opt_out_policy`, and no operator under `services`. OU: `lex` with `@@assign: optIn`.
        fr: |-
          Racine : `default` avec `@@assign: optOut`, verrouillé avec `@@none` sur `default` et sur `opt_out_policy`, sans opérateur sous `services`. OU : `lex` avec `@@assign: optIn`.
    - id: b
      text:
        en: |-
          Root: `default` with `@@assign: optOut`, locked with `@@none` on `services`, on `default`, and on `opt_out_policy`. OU: `lex` with `@@assign: optIn`.
        fr: |-
          Racine : `default` avec `@@assign: optOut`, verrouillé avec `@@none` sur `services`, sur `default` et sur `opt_out_policy`. OU : `lex` avec `@@assign: optIn`.
    - id: c
      text:
        en: |-
          Root: a `services` entry with `@@assign: optOut` for each AI service available today, by name. OU: `lex` with `@@assign: optIn`.
        fr: |-
          Racine : une entrée `services` avec `@@assign: optOut` pour chaque service d'IA disponible aujourd'hui, par son nom. OU : `lex` avec `@@assign: optIn`.
    - id: d
      text:
        en: |-
          Root: `default` with `@@assign: optIn`. OU: `default` with `@@assign: optOut` and `lex` with `@@assign: optIn`.
        fr: |-
          Racine : `default` avec `@@assign: optIn`. OU : `default` avec `@@assign: optOut` et `lex` avec `@@assign: optIn`.
answer:
  optionId: a
explanation:
  correct:
    en: |-
      `default` covers every current and future AI service, and locking it with `@@none` keeps the organization-wide opt-out in place. Leaving `services` without an operator still lets a child policy add a section for a named service, so the ContactCenter OU policy can opt in to Amazon Lex while every other service stays opted out through the inherited `default`.
    fr: |-
      `default` couvre tous les services d'IA actuels et futurs, et le verrouiller avec `@@none` maintient la désactivation à l'échelle de l'organisation. Laisser `services` sans opérateur permet encore à une politique enfant d'ajouter une section pour un service nommé : la politique de l'OU ContactCenter peut ainsi activer Amazon Lex, tandis que tous les autres services restent désactivés par le `default` hérité.
  options:
    b:
      en: |-
        `@@none` under `services` prevents child policies from adding service entries, so the OU's Lex opt-in has no effect.
      fr: |-
        `@@none` sous `services` empêche les politiques enfants d'ajouter des entrées de service : l'activation de Lex par l'OU n'a aucun effet.
    c:
      en: |-
        Naming today's services does not cover AI services that AWS adds later; only `default` includes future services.
      fr: |-
        Nommer les services actuels ne couvre pas les services d'IA qu'AWS ajoutera plus tard ; seul `default` inclut les services futurs.
    d:
      en: |-
        The root opts every other OU in to all AI services, which breaks the organization-wide opt-out.
      fr: |-
        La racine active tous les services d'IA pour toutes les autres OU, ce qui rompt la désactivation à l'échelle de l'organisation.
references:
  - title: "AI services opt-out policy syntax and examples - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_ai-opt-out_syntax.html
