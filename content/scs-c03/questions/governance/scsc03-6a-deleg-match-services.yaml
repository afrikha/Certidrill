id: scsc03-6a-deleg-match-services
objective: "6.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany's security tooling account will be the delegated administrator for the services that meet each requirement of its security program.

    Match each requirement to the AWS service whose delegated administrator meets it.

    To answer, drag the appropriate service to each requirement. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |-
    Le compte d'outillage de sécurité d'AnyCompany sera l'administrateur délégué des services qui répondent à chaque exigence de son programme de sécurité.

    Associez chaque exigence au service AWS dont l'administrateur délégué y répond.

    Pour répondre, faites glisser le service approprié vers chaque exigence. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: gd
      text:
        en: |-
          Amazon GuardDuty
        fr: |-
          Amazon GuardDuty
    - id: macie
      text:
        en: |-
          Amazon Macie
        fr: |-
          Amazon Macie
    - id: insp
      text:
        en: |-
          Amazon Inspector
        fr: |-
          Amazon Inspector
    - id: aa
      text:
        en: |-
          IAM Access Analyzer
        fr: |-
          IAM Access Analyzer
    - id: det
      text:
        en: |-
          Amazon Detective
        fr: |-
          Amazon Detective
    - id: cfg
      text:
        en: |-
          AWS Config
        fr: |-
          AWS Config
  targets:
    - id: t1
      text:
        en: |-
          Detect malicious or unauthorized activity from AWS CloudTrail events, VPC Flow Logs, and DNS logs
        fr: |-
          Détecter une activité malveillante ou non autorisée à partir des événements AWS CloudTrail, des journaux de flux VPC et des journaux DNS
    - id: t2
      text:
        en: |-
          Discover personal data and other sensitive data in Amazon S3 buckets
        fr: |-
          Découvrir des données personnelles et d'autres données sensibles dans des compartiments Amazon S3
    - id: t3
      text:
        en: |-
          Scan EC2 instances, container images, and Lambda functions for software vulnerabilities
        fr: |-
          Analyser les instances EC2, les images de conteneurs et les fonctions Lambda à la recherche de vulnérabilités logicielles
    - id: t4
      text:
        en: |-
          Identify resources that are shared with principals outside the organization
        fr: |-
          Identifier les ressources partagées avec des principaux extérieurs à l'organisation
    - id: t5
      text:
        en: |-
          Investigate the root cause of a finding with behavior graphs
        fr: |-
          Rechercher la cause racine d'un résultat au moyen de graphes de comportement
answer:
  mapping:
    t1: gd
    t2: macie
    t3: insp
    t4: aa
    t5: det
explanation:
  correct:
    en: |-
      GuardDuty analyzes CloudTrail, VPC flow and DNS data for threats; Macie discovers sensitive data in S3; Inspector scans compute resources for vulnerabilities. IAM Access Analyzer with the organization as the zone of trust reports external access, and Detective builds behavior graphs for investigations.
    fr: |-
      GuardDuty analyse les données CloudTrail, de flux VPC et DNS à la recherche de menaces ; Macie découvre les données sensibles dans S3 ; Inspector analyse les ressources de calcul à la recherche de vulnérabilités. IAM Access Analyzer, avec l'organisation comme zone de confiance, signale les accès externes, et Detective construit des graphes de comportement pour les investigations.
  options:
    cfg:
      en: |-
        AWS Config records resource configurations and evaluates rules; it does not detect threats, sensitive data, vulnerabilities, or external access by itself.
      fr: |-
        AWS Config enregistre les configurations des ressources et évalue des règles ; il ne détecte pas à lui seul les menaces, les données sensibles, les vulnérabilités ni les accès externes.
references:
  - title: "Managing GuardDuty accounts with AWS Organizations - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_organizations.html
  - title: "Delegated administrator for IAM Access Analyzer - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-settings.html
