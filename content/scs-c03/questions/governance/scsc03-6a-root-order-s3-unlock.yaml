id: scsc03-6a-root-order-s3-unlock
objective: "6.1.5"
type: ordering
difficulty: 3
status: draft
stem:
  en: |-
    An administrator in AnyCompany's member account 444455556666 applied an S3 bucket policy that denies all actions to all principals. No one in the account can now read the bucket or change its policy. Trusted access for IAM is not yet enabled in the organization in AWS Organizations, and the member account has no root credentials. The security team must restore access from the management account without signing in as a root user.

    Which five actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |-
    Un administrateur du compte membre 444455556666 d'AnyCompany a appliqué une politique de compartiment S3 qui refuse toutes les actions à tous les principaux. Plus personne dans le compte ne peut lire le compartiment ni modifier sa politique. L'accès approuvé pour IAM n'est pas encore activé dans l'organisation AWS Organizations, et le compte membre n'a aucune information d'identification racine. L'équipe de sécurité doit rétablir l'accès depuis le compte de gestion sans se connecter en tant qu'utilisateur racine.

    Quelles sont les cinq actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - id: trust
      text:
        en: |-
          Enable trusted access for IAM in AWS Organizations.
        fr: |-
          Activer l'accès approuvé pour IAM dans AWS Organizations.
    - id: recover
      text:
        en: |-
          Call sts:AssumeRoot with the IAMCreateRootUserPassword task policy, and sign in to the account as its root user.
        fr: |-
          Appeler sts:AssumeRoot avec la politique de tâche IAMCreateRootUserPassword, et se connecter au compte en tant qu'utilisateur racine.
    - id: enable
      text:
        en: |-
          In the IAM console, enable privileged root actions in member accounts.
        fr: |-
          Dans la console IAM, activer les actions racine privilégiées dans les comptes membres.
    - id: assume
      text:
        en: |-
          Call sts:AssumeRoot on a Regional STS endpoint for account 444455556666 with the S3UnlockBucketPolicy task policy.
        fr: |-
          Appeler sts:AssumeRoot sur un point de terminaison STS régional pour le compte 444455556666 avec la politique de tâche S3UnlockBucketPolicy.
    - id: scp
      text:
        en: |-
          Detach every SCP from account 444455556666 so that its administrators can bypass the bucket policy.
        fr: |-
          Détacher toutes les SCP du compte 444455556666 afin que ses administrateurs puissent contourner la politique de compartiment.
    - id: delete
      text:
        en: |-
          Use the temporary root session credentials to delete the bucket policy.
        fr: |-
          Utiliser les informations d'identification temporaires de la session racine pour supprimer la politique de compartiment.
    - id: put
      text:
        en: |-
          As an administrator of the member account, apply a corrected bucket policy.
        fr: |-
          En tant qu'administrateur du compte membre, appliquer une politique de compartiment corrigée.
answer:
  sequence: [trust, enable, assume, delete, put]
explanation:
  correct:
    en: |-
      Centralized root access needs trusted access for IAM before its capabilities can be enabled, and privileged root actions must be enabled before AssumeRoot can be used. The management account then calls AssumeRoot on a Regional STS endpoint with the S3UnlockBucketPolicy task policy, deletes the deny-all bucket policy with the session, and an account administrator applies a corrected policy.
    fr: |-
      L'accès racine centralisé exige l'accès approuvé pour IAM avant que ses fonctionnalités puissent être activées, et les actions racine privilégiées doivent être activées avant de pouvoir utiliser AssumeRoot. Le compte de gestion appelle ensuite AssumeRoot sur un point de terminaison STS régional avec la politique de tâche S3UnlockBucketPolicy, supprime avec cette session la politique de compartiment qui refuse tout, puis un administrateur du compte applique une politique corrigée.
  options:
    recover:
      en: |-
        Recovering a root password signs someone in as root, which the requirement forbids and which the unlock task makes unnecessary.
      fr: |-
        Récupérer un mot de passe racine connecte quelqu'un en tant qu'utilisateur racine, ce que l'exigence interdit et que la tâche de déverrouillage rend inutile.
    scp:
      en: |-
        A bucket policy deny applies regardless of SCPs, and removing SCPs only weakens the account's guardrails.
      fr: |-
        Un refus dans une politique de compartiment s'applique indépendamment des SCP, et retirer les SCP ne fait qu'affaiblir les protections du compte.
references:
  - title: "Centralize root access for member accounts - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-enable-root-access.html
  - title: "Perform a privileged task on an AWS Organizations member account - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user-privileged-task.html
