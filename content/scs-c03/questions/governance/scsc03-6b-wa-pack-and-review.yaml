id: scsc03-6b-wa-pack-and-review
objective: "6.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's CISO sets two goals for the 30 accounts of the organization in AWS Organizations. First, the configuration of deployed resources must be evaluated continuously against rules that AWS maps to the best practices of the Well-Architected Framework Security pillar. Second, each critical workload must go through a quarterly design review against the Security pillar, with recorded risks and a way to show progress from one quarter to the next. AWS Config records all resource types, and the security account is the delegated administrator for AWS Config.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le RSSI d'AnyCompany fixe deux objectifs pour les 30 comptes de l'organisation AWS Organizations. D'abord, la configuration des ressources déployées doit être évaluée en continu par rapport à des règles qu'AWS associe aux bonnes pratiques du pilier Sécurité du Well-Architected Framework. Ensuite, chaque charge de travail critique doit faire l'objet d'une revue de conception trimestrielle par rapport au pilier Sécurité, avec des risques consignés et un moyen de montrer les progrès d'un trimestre à l'autre. AWS Config enregistre tous les types de ressources, et le compte de sécurité est l'administrateur délégué d'AWS Config.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Turn on the AWS Trusted Advisor security checks in every account, and review their results with the workload owners every quarter."
        fr: "Activer les vérifications de sécurité AWS Trusted Advisor dans chaque compte, et examiner leurs résultats avec les propriétaires des charges de travail chaque trimestre."
    - id: b
      text:
        en: "Deploy the Operational Best Practices for AWS Well-Architected Framework Security Pillar template as an organization conformance pack in each Region."
        fr: "Déployer le modèle Operational Best Practices for AWS Well-Architected Framework Security Pillar comme pack de conformité d'organisation dans chaque Région."
    - id: c
      text:
        en: "Create a custom lens that repeats the Security pillar questions, and apply it to each critical workload every quarter."
        fr: "Créer un objectif (lens) personnalisé qui reprend les questions du pilier Sécurité, et l'appliquer chaque trimestre à chaque charge de travail critique."
    - id: d
      text:
        en: "Define each critical workload in the Well-Architected Tool, review it against the Security pillar every quarter, and save a milestone each time."
        fr: "Définir chaque charge de travail critique dans le Well-Architected Tool, la passer en revue chaque trimestre par rapport au pilier Sécurité, et enregistrer un jalon à chaque fois."
    - id: e
      text:
        en: "Attach a Well-Architected Tool profile to each critical workload so that the tool evaluates the workload's deployed resources continuously."
        fr: "Attacher un profil du Well-Architected Tool à chaque charge de travail critique pour que l'outil évalue en continu les ressources déployées de la charge de travail."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      AWS Config provides a sample conformance pack template mapped to the Security pillar of the Well-Architected Framework; deployed as an organization conformance pack, its rules evaluate deployed resources in every member account. The Well-Architected Tool covers the design review: answers produce risks, and a milestone saved after each review records the workload's state so that progress can be measured.
    fr: |-
      AWS Config fournit un exemple de modèle de pack de conformité associé au pilier Sécurité du Well-Architected Framework ; déployé comme pack de conformité d'organisation, ses règles évaluent les ressources déployées dans chaque compte membre. Le Well-Architected Tool couvre la revue de conception : les réponses produisent des risques, et un jalon enregistré après chaque revue consigne l'état de la charge de travail pour mesurer les progrès.
  options:
    a:
      en: |-
        Trusted Advisor checks are a fixed set of account checks, reviewed here only quarterly; they are neither continuous Config rules mapped to the pillar nor a design review.
      fr: |-
        Les vérifications Trusted Advisor sont un ensemble fixe de vérifications de compte, consultées ici seulement chaque trimestre ; ce ne sont ni des règles Config continues associées au pilier, ni une revue de conception.
    c:
      en: |-
        The Framework lens already contains the Security pillar questions, and a lens, custom or not, is a questionnaire that does not evaluate deployed resources.
      fr: |-
        L'objectif Framework contient déjà les questions du pilier Sécurité, et un objectif, personnalisé ou non, est un questionnaire qui n'évalue pas les ressources déployées.
    e:
      en: |-
        A profile gives business context that prioritizes questions; the Well-Architected Tool is a questionnaire and does not scan resources.
      fr: |-
        Un profil fournit un contexte métier qui priorise les questions ; le Well-Architected Tool est un questionnaire et n'analyse pas les ressources.
references:
  - title: Conformance Pack Sample Templates for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformancepack-sample-templates.html
  - title: Milestones - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/milestones.html
