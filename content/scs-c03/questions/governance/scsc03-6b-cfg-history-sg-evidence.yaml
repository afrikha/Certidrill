id: scsc03-6b-cfg-history-sg-evidence
objective: "6.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Five months ago, AnyCompany had a security incident involving the security group sg-0f1e2d3c4b5a69788. An auditor now asks for the exact inbound rules of this security group on March 3 between 09:00 and 12:00 UTC, and for every configuration change made to it during that week. AWS Config has recorded all resource types in the account since its creation, with a retention period of seven years. The account has no CloudTrail trail; only the CloudTrail event history is available.

    Which solution will provide this evidence?
  fr: |
    Il y a cinq mois, AnyCompany a subi un incident de sécurité impliquant le groupe de sécurité sg-0f1e2d3c4b5a69788. Un auditeur demande maintenant les règles entrantes exactes de ce groupe de sécurité le 3 mars entre 09:00 et 12:00 UTC, ainsi que chaque modification de configuration qui lui a été apportée pendant cette semaine. AWS Config enregistre tous les types de ressources du compte depuis sa création, avec une période de conservation de sept ans. Le compte n'a aucun journal de suivi CloudTrail ; seul l'historique des événements CloudTrail est disponible.

    Quelle solution fournit ces preuves ?
body:
  options:
    - id: a
      text:
        en: "Run an AWS Config advanced query that selects the configuration and relationships of sg-0f1e2d3c4b5a69788 for that week."
        fr: "Exécuter une requête avancée AWS Config qui sélectionne la configuration et les relations de sg-0f1e2d3c4b5a69788 pour cette semaine."
    - id: b
      text:
        en: "Look up the AuthorizeSecurityGroupIngress and RevokeSecurityGroupIngress events for the group in the CloudTrail event history."
        fr: "Rechercher les événements AuthorizeSecurityGroupIngress et RevokeSecurityGroupIngress du groupe dans l'historique des événements CloudTrail."
    - id: c
      text:
        en: "Run describe-security-group-rules for the group with a filter on the date of March 3 and the time window of the incident."
        fr: "Exécuter describe-security-group-rules pour le groupe avec un filtre sur la date du 3 mars et la plage horaire de l'incident."
    - id: d
      text:
        en: "Call get-resource-config-history for sg-0f1e2d3c4b5a69788 with an earlier time and a later time that cover that week."
        fr: "Appeler get-resource-config-history pour sg-0f1e2d3c4b5a69788 avec une heure de début et une heure de fin qui couvrent cette semaine."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      GetResourceConfigHistory returns the configuration items of a resource for a time interval, each describing one state of the resource, within the configured retention period. The items of that week show the exact rules in force on March 3 and every recorded change; one call can span up to seven days.
    fr: |-
      GetResourceConfigHistory renvoie les éléments de configuration d'une ressource pour un intervalle de temps, chacun décrivant un état de la ressource, dans la limite de la période de conservation configurée. Les éléments de cette semaine montrent les règles exactes en vigueur le 3 mars et chaque modification enregistrée ; un appel peut couvrir jusqu'à sept jours.
  options:
    a:
      en: |-
        Advanced queries run on the current configuration state of resources, not on their past states.
      fr: |-
        Les requêtes avancées portent sur l'état de configuration actuel des ressources, pas sur leurs états passés.
    b:
      en: |-
        The CloudTrail event history keeps only the last 90 days of management events, so events from five months ago are no longer available.
      fr: |-
        L'historique des événements CloudTrail ne conserve que les 90 derniers jours d'événements de gestion : les événements d'il y a cinq mois ne sont plus disponibles.
    c:
      en: |-
        EC2 describe calls return the current rules of the group; they have no historical view.
      fr: |-
        Les appels describe d'EC2 renvoient les règles actuelles du groupe ; ils n'offrent aucune vue historique.
references:
  - title: GetResourceConfigHistory - AWS Config
    url: https://docs.aws.amazon.com/config/latest/APIReference/API_GetResourceConfigHistory.html
