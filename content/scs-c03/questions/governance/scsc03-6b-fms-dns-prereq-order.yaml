id: scsc03-6b-fms-dns-prereq-order
objective: "6.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany created its organization in AWS Organizations years ago with only the consolidated billing feature set. It now has 140 member accounts. A Route 53 Resolver DNS Firewall rule group that blocks known malicious domains already exists in the security account. The security team wants AWS Firewall Manager, administered from the security account, to associate this rule group with every VPC in every account, including accounts and VPCs created later. Firewall Manager has never been used in the organization.

    Which five steps should the security team perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany a créé son organisation AWS Organizations il y a des années avec uniquement l'ensemble de fonctionnalités de facturation consolidée. Elle compte maintenant 140 comptes membres. Un groupe de règles Route 53 Resolver DNS Firewall qui bloque des domaines malveillants connus existe déjà dans le compte de sécurité. L'équipe de sécurité veut qu'AWS Firewall Manager, administré depuis le compte de sécurité, associe ce groupe de règles à chaque VPC de chaque compte, y compris les comptes et les VPC créés plus tard. Firewall Manager n'a jamais été utilisé dans l'organisation.

    Quelles sont les cinq étapes que l'équipe de sécurité doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - id: config
      text: { en: "Enable AWS Config recording in every member account and in every Region where the policy will apply.", fr: "Activer l'enregistrement AWS Config dans chaque compte membre et dans chaque Région où la politique s'appliquera." }
    - id: policy
      text: { en: "In the security account, create a Firewall Manager DNS Firewall policy that adds the rule group as a first rule group, scoped to all accounts, with auto remediation.", fr: "Dans le compte de sécurité, créer une politique Firewall Manager DNS Firewall qui ajoute le groupe de règles comme premier groupe de règles, avec une étendue couvrant tous les comptes et la correction automatique." }
    - id: org
      text: { en: "Enable all features in AWS Organizations.", fr: "Activer toutes les fonctionnalités dans AWS Organizations." }
    - id: assoc
      text: { en: "In each member account, associate the rule group with every VPC of the account.", fr: "Dans chaque compte membre, associer le groupe de règles à chaque VPC du compte." }
    - id: ram
      text: { en: "Enable resource sharing with AWS Organizations in AWS RAM.", fr: "Activer le partage de ressources avec AWS Organizations dans AWS RAM." }
    - id: shield
      text: { en: "Subscribe every member account to AWS Shield Advanced.", fr: "Abonner chaque compte membre à AWS Shield Advanced." }
    - id: admin
      text: { en: "From the management account, set the security account as the Firewall Manager default administrator.", fr: "Depuis le compte de gestion, désigner le compte de sécurité comme administrateur par défaut de Firewall Manager." }
answer:
  sequence: [org, admin, config, ram, policy]
explanation:
  correct:
    en: "Firewall Manager requires an organization with all features enabled, then a default administrator account designated by the management account, then AWS Config enabled in the accounts and Regions to protect. DNS Firewall and Network Firewall policies share rule groups across accounts, so resource sharing with AWS Organizations must be enabled in AWS RAM before the policy is created. The policy then creates the rule group associations in every in-scope VPC, including new ones."
    fr: "Firewall Manager exige une organisation dont toutes les fonctionnalités sont activées, puis un compte d'administrateur par défaut désigné par le compte de gestion, puis AWS Config activé dans les comptes et les Régions à protéger. Les politiques DNS Firewall et Network Firewall partagent les groupes de règles entre comptes : le partage de ressources avec AWS Organizations doit donc être activé dans AWS RAM avant la création de la politique. La politique crée ensuite les associations de groupes de règles dans chaque VPC concerné, y compris les nouveaux."
  options:
    assoc:
      en: "Firewall Manager creates the associations itself for every in-scope VPC; manual associations would not cover future VPCs."
      fr: "Firewall Manager crée lui-même les associations pour chaque VPC concerné ; des associations manuelles ne couvriraient pas les futurs VPC."
    shield:
      en: "Shield Advanced is needed only for Firewall Manager Shield Advanced policies, not for DNS Firewall policies."
      fr: "Shield Advanced n'est nécessaire que pour les politiques Firewall Manager Shield Advanced, pas pour les politiques DNS Firewall."
references:
  - title: AWS Firewall Manager prerequisites - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/fms-prereq.html
  - title: Creating an AWS Firewall Manager policy - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/create-policy.html
