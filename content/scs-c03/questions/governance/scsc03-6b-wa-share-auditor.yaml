id: scsc03-6b-wa-share-auditor
objective: "6.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany reviewed its trading workload in the AWS Well-Architected Tool. The workload is defined in the eu-west-1 Region in account 111122223333. An external audit firm uses its own AWS account 999988887777, which is outside AnyCompany's organization, and usually works in the us-east-1 Region. The auditors must view the workload's answers, risks, improvement plan, and milestones in the tool, but they must not be able to change any answer.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a passé en revue sa charge de travail de trading dans l'AWS Well-Architected Tool. La charge de travail est définie dans la Région eu-west-1 dans le compte 111122223333. Un cabinet d'audit externe utilise son propre compte AWS 999988887777, qui est hors de l'organisation d'AnyCompany, et travaille habituellement dans la Région us-east-1. Les auditeurs doivent consulter dans l'outil les réponses, les risques, le plan d'amélioration et les jalons de la charge de travail, mais ils ne doivent pouvoir modifier aucune réponse.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Share the workload with account 999988887777 with the Contributor permission, and ask the auditors to accept the invitation in eu-west-1."
        fr: "Partager la charge de travail avec le compte 999988887777 avec l'autorisation Contributor, et demander aux auditeurs d'accepter l'invitation dans eu-west-1."
    - id: b
      text:
        en: "Share the workload with account 999988887777 with the Read-Only permission from us-east-1, so that the auditors can accept it in their usual Region."
        fr: "Partager la charge de travail avec le compte 999988887777 avec l'autorisation Read-Only depuis us-east-1, pour que les auditeurs puissent l'accepter dans leur Région habituelle."
    - id: c
      text:
        en: "Share the workload in eu-west-1 with account 999988887777 with the Read-Only permission, and ask the auditors to accept the invitation in eu-west-1 within seven days."
        fr: "Partager la charge de travail dans eu-west-1 avec le compte 999988887777 avec l'autorisation Read-Only, et demander aux auditeurs d'accepter l'invitation dans eu-west-1 sous sept jours."
    - id: d
      text:
        en: "Create an AWS RAM resource share of the workload with account 999988887777 that allows external principals."
        fr: "Créer un partage de ressources AWS RAM de la charge de travail avec le compte 999988887777 qui autorise les principaux externes."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Well-Architected Tool shares a workload with accounts, users, an organization, or OUs, only within the Region where the workload exists. Read-Only gives read access to the whole workload, while Contributor also lets the recipient update answers and notes. An invitation that is not accepted within seven days expires, and the recipient needs the wellarchitected:UpdateShareInvitation permission to accept it.
    fr: |-
      Le Well-Architected Tool partage une charge de travail avec des comptes, des utilisateurs, une organisation ou des unités d'organisation, uniquement dans la Région où la charge de travail existe. Read-Only donne un accès en lecture à toute la charge de travail, tandis que Contributor permet aussi au destinataire de mettre à jour les réponses et les notes. Une invitation non acceptée sous sept jours expire, et le destinataire a besoin de l'autorisation wellarchitected:UpdateShareInvitation pour l'accepter.
  options:
    a:
      en: |-
        Contributor gives update access to answers and their notes, which the auditors must not have.
      fr: |-
        Contributor donne un accès en mise à jour aux réponses et à leurs notes, ce que les auditeurs ne doivent pas avoir.
    b:
      en: |-
        Workloads can be shared only within their own Region, and this workload exists only in eu-west-1.
      fr: |-
        Les charges de travail ne peuvent être partagées que dans leur propre Région, et celle-ci n'existe que dans eu-west-1.
    d:
      en: |-
        Workloads are shared by the Well-Architected Tool itself, not through AWS RAM.
      fr: |-
        Les charges de travail se partagent par le Well-Architected Tool lui-même, pas via AWS RAM.
references:
  - title: Share a workload in AWS Well-Architected Tool - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/workloads-sharing.html
