id: scsc03-6b-cfg-aggregator-org-pack
objective: "6.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 150 accounts in AWS Organizations and operates in three Regions. AWS Config records all resource types in every account and Region. The security account is registered as delegated administrator for both config.amazonaws.com and config-multiaccountsetup.amazonaws.com. An IAM role named ConfigS3Remediation, with the permissions to block public access on buckets, exists in every account.

    The security team requires a single view, in the security account, of the compliance of every account and Region. The s3-bucket-public-read-prohibited rule must run in every account with automatic remediation that runs in that account, and member accounts must not be able to modify or delete the rule or its remediation.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany compte 150 comptes dans AWS Organizations et opère dans trois Régions. AWS Config enregistre tous les types de ressources dans chaque compte et chaque Région. Le compte de sécurité est enregistré comme administrateur délégué pour config.amazonaws.com et pour config-multiaccountsetup.amazonaws.com. Un rôle IAM nommé ConfigS3Remediation, doté des autorisations de blocage de l'accès public des compartiments, existe dans chaque compte.

    L'équipe de sécurité exige une vue unique, dans le compte de sécurité, de la conformité de chaque compte et de chaque Région. La règle s3-bucket-public-read-prohibited doit s'exécuter dans chaque compte avec une correction automatique exécutée dans ce compte, et les comptes membres ne doivent pas pouvoir modifier ni supprimer la règle ou sa correction.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Configure automatic remediation with the ConfigS3Remediation role on the aggregated s3-bucket-public-read-prohibited rule from the aggregator in the security account."
        fr: "Configurer la correction automatique avec le rôle ConfigS3Remediation sur la règle agrégée s3-bucket-public-read-prohibited depuis l'agrégateur du compte de sécurité."
    - id: b
      text:
        en: "Create an AWS Config aggregator in the security account whose source is the organization, with a role that has the AWSConfigRoleForOrganizations policy."
        fr: "Créer dans le compte de sécurité un agrégateur AWS Config dont la source est l'organisation, avec un rôle doté de la politique AWSConfigRoleForOrganizations."
    - id: c
      text:
        en: "Create the rule once in the security account, and add the member accounts and Regions as evaluation sources of the rule."
        fr: "Créer la règle une seule fois dans le compte de sécurité, et ajouter les comptes membres et les Régions comme sources d'évaluation de la règle."
    - id: d
      text:
        en: "From the security account, deploy in each Region an organization conformance pack that contains the rule and its automatic remediation with the ConfigS3Remediation role."
        fr: "Depuis le compte de sécurité, déployer dans chaque Région un pack de conformité d'organisation qui contient la règle et sa correction automatique avec le rôle ConfigS3Remediation."
    - id: e
      text:
        en: "Use CloudFormation StackSets to deploy the rule and its remediation configuration as regular stacks in every account and Region."
        fr: "Utiliser CloudFormation StackSets pour déployer la règle et sa configuration de correction sous forme de piles ordinaires dans chaque compte et chaque Région."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      An organization aggregator replicates configuration and compliance data from every account and Region into the security account without per-account authorization. An organization conformance pack, deployed by the delegated administrator in each Region, creates the rule and its remediation in every member account, where they run, and member accounts cannot change or delete them.
    fr: |-
      Un agrégateur d'organisation réplique les données de configuration et de conformité de chaque compte et de chaque Région dans le compte de sécurité, sans autorisation compte par compte. Un pack de conformité d'organisation, déployé par l'administrateur délégué dans chaque Région, crée la règle et sa correction dans chaque compte membre, où elles s'exécutent, et les comptes membres ne peuvent ni les modifier ni les supprimer.
  options:
    a:
      en: |-
        Aggregators are read-only: they cannot deploy rules or run remediation in source accounts.
      fr: |-
        Les agrégateurs sont en lecture seule : ils ne peuvent ni déployer de règles ni exécuter de correction dans les comptes sources.
    c:
      en: |-
        A Config rule evaluates resources only in its own account and Region; rules have no cross-account evaluation sources.
      fr: |-
        Une règle Config n'évalue que les ressources de son propre compte et de sa propre Région ; les règles n'ont pas de sources d'évaluation inter-comptes.
    e:
      en: |-
        Rules created by ordinary stacks are regular rules of the member account, so the account's administrators could modify or delete them.
      fr: |-
        Les règles créées par des piles ordinaires sont des règles normales du compte membre : ses administrateurs pourraient les modifier ou les supprimer.
references:
  - title: Multi-Account Multi-Region Data Aggregation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html
  - title: Conformance Pack Sample Templates for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformancepack-sample-templates.html
