id: scsc03-6b-artifact-standalone-baa
objective: "6.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A health technology startup uses a single AWS account that is not part of any organization and will remain standalone. The startup will soon store protected health information (PHI) in the account. Its legal team requires a Business Associate Addendum (BAA) with AWS to be in place for the account before any PHI is uploaded.

    Which solution will meet these requirements?
  fr: |
    Une jeune entreprise de technologies de santé utilise un seul compte AWS qui ne fait partie d'aucune organisation et restera autonome. L'entreprise stockera bientôt des informations de santé protégées (PHI) dans le compte. Son équipe juridique exige qu'un Business Associate Addendum (BAA) avec AWS soit en place pour le compte avant tout chargement de PHI.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an organization in AWS Organizations with all features, and accept the BAA as an organization agreement from the management account."
        fr: "Créer une organisation AWS Organizations avec toutes les fonctionnalités, et accepter le BAA comme accord d'organisation depuis le compte de gestion."
    - id: b
      text:
        en: "Deploy the Operational Best Practices for HIPAA Security conformance pack in the account and keep its compliance results as evidence."
        fr: "Déployer le pack de conformité Operational Best Practices for HIPAA Security dans le compte et conserver ses résultats de conformité comme preuves."
    - id: c
      text:
        en: "In AWS Artifact, review and accept the BAA as an account agreement for the account."
        fr: "Dans AWS Artifact, examiner et accepter le BAA comme accord de compte pour le compte."
    - id: d
      text:
        en: "Download the AWS SOC 2 report from AWS Artifact and archive it with the startup's legal documents."
        fr: "Télécharger le rapport SOC 2 d'AWS depuis AWS Artifact et l'archiver avec les documents juridiques de l'entreprise."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS Artifact lets customers review, accept, and track agreements with AWS for their account. Accepting the BAA as an account agreement allows that account to process PHI, which is all a standalone account needs.
    fr: |-
      AWS Artifact permet aux clients d'examiner, d'accepter et de suivre les accords avec AWS pour leur compte. Accepter le BAA comme accord de compte permet à ce compte de traiter des PHI, ce qui suffit pour un compte autonome.
  options:
    a:
      en: |-
        Organization agreements cover every account of an organization, but the account must stay standalone, and creating an organization is not needed for one account.
      fr: |-
        Les accords d'organisation couvrent tous les comptes d'une organisation, mais le compte doit rester autonome, et créer une organisation n'est pas nécessaire pour un seul compte.
    b:
      en: |-
        A conformance pack checks resource configurations; it is not a legal agreement with AWS.
      fr: |-
        Un pack de conformité vérifie des configurations de ressources ; ce n'est pas un accord juridique avec AWS.
    d:
      en: |-
        Downloading a report documents AWS's controls but does not put an agreement in place.
      fr: |-
        Télécharger un rapport documente les contrôles d'AWS mais ne met en place aucun accord.
references:
  - title: Managing agreements in AWS Artifact - AWS Artifact
    url: https://docs.aws.amazon.com/artifact/latest/ug/managing-agreements.html
