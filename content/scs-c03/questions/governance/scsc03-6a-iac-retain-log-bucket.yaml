id: scsc03-6a-iac-retain-log-bucket
objective: "6.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    An AWS CloudFormation stack in AnyCompany's log archive account creates the S3 bucket that receives the organization's AWS CloudTrail logs. The bucket and its objects must survive if the stack is deleted. They must also survive if a future template change requires CloudFormation to replace the bucket, and such changes must still be able to complete. The stack itself must remain deletable.

    Which combination of template settings will meet these requirements? (Choose two.)
  fr: |-
    Une pile AWS CloudFormation du compte d'archivage des journaux d'AnyCompany crée le compartiment S3 qui reçoit les journaux AWS CloudTrail de l'organisation. Le compartiment et ses objets doivent subsister si la pile est supprimée. Ils doivent aussi subsister si une future modification du modèle oblige CloudFormation à remplacer le compartiment, et ces modifications doivent toujours pouvoir aboutir. La pile elle-même doit rester supprimable.

    Quelle combinaison de paramètres de modèle répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          DeletionPolicy: Snapshot on the bucket
        fr: |-
          DeletionPolicy: Snapshot sur le compartiment
    - id: b
      text:
        en: |-
          DeletionPolicy: Retain on the bucket
        fr: |-
          DeletionPolicy: Retain sur le compartiment
    - id: c
      text:
        en: |-
          A stack policy that denies Update:Replace on the bucket
        fr: |-
          Une politique de pile qui refuse Update:Replace sur le compartiment
    - id: d
      text:
        en: |-
          UpdateReplacePolicy: Retain on the bucket
        fr: |-
          UpdateReplacePolicy: Retain sur le compartiment
    - id: e
      text:
        en: |-
          Termination protection enabled on the stack
        fr: |-
          La protection contre la résiliation activée sur la pile
answer:
  optionIds: [b, d]
explanation:
  correct:
    en: |-
      DeletionPolicy: Retain keeps the bucket and its contents when the stack is deleted or the resource is removed from the template, but it does not apply when an update replaces the resource. UpdateReplacePolicy: Retain keeps the old bucket when a replacement happens, so the two attributes together protect the bucket in both cases.
    fr: |-
      DeletionPolicy: Retain conserve le compartiment et son contenu lorsque la pile est supprimée ou que la ressource est retirée du modèle, mais il ne s'applique pas lorsqu'une mise à jour remplace la ressource. UpdateReplacePolicy: Retain conserve l'ancien compartiment lors d'un remplacement : les deux attributs ensemble protègent donc le compartiment dans les deux cas.
  options:
    a:
      en: |-
        Snapshot is supported only for resource types such as EBS volumes and RDS databases, not for S3 buckets.
      fr: |-
        Snapshot n'est pris en charge que pour certains types de ressources, comme les volumes EBS et les bases de données RDS, et non pour les compartiments S3.
    c:
      en: |-
        A stack policy would block the replacement, but the requirement says that such changes must still complete.
      fr: |-
        Une politique de pile bloquerait le remplacement, alors que l'exigence indique que ces modifications doivent toujours aboutir.
    e:
      en: |-
        Termination protection prevents deleting the stack, but the stack must remain deletable.
      fr: |-
        La protection contre la résiliation empêche la suppression de la pile, alors que la pile doit rester supprimable.
references:
  - title: "DeletionPolicy attribute - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-deletionpolicy.html
  - title: "UpdateReplacePolicy attribute - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatereplacepolicy.html
