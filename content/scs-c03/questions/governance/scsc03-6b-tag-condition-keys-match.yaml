id: scsc03-6b-tag-condition-keys-match
objective: "6.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team is writing IAM policies that use tags to group and control resources by department and environment.

    Match each requirement to the condition key that the policy statement must evaluate.

    To answer, drag the appropriate condition key to each requirement. Each condition key may be used once or not at all.
  fr: |
    L'équipe de sécurité d'AnyCompany rédige des politiques IAM qui utilisent des balises pour regrouper et contrôler les ressources par département et par environnement.

    Associez chaque exigence à la clé de condition que l'instruction de politique doit évaluer.

    Pour répondre, faites glisser la clé de condition appropriée vers chaque exigence. Chaque clé de condition peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: reqtag, text: "aws:RequestTag/Environment" }
    - { id: restag, text: "aws:ResourceTag/Environment" }
    - { id: princtag, text: "aws:PrincipalTag/Department" }
    - { id: tagkeys, text: "aws:TagKeys" }
    - { id: createaction, text: "ec2:CreateAction" }
    - { id: sourcevpce, text: "aws:SourceVpce" }
  targets:
    - id: t1
      text: { en: "Allow a volume to be created only if the creation request applies Environment=dev to it", fr: "Autoriser la création d'un volume uniquement si la requête de création lui applique Environment=dev" }
    - id: t2
      text: { en: "Allow instances to be stopped only if they already carry Environment=dev", fr: "Autoriser l'arrêt d'instances uniquement si elles portent déjà Environment=dev" }
    - id: t3
      text: { en: "Allow the action only for callers whose federated session carries Department=finance", fr: "Autoriser l'action uniquement pour les appelants dont la session fédérée porte Department=finance" }
    - id: t4
      text: { en: "Reject any tagging request that contains a key other than Name, Owner, and Environment", fr: "Rejeter toute requête de balisage qui contient une clé autre que Name, Owner et Environment" }
    - id: t5
      text: { en: "Allow tags to be applied only as part of launching an instance", fr: "Autoriser l'application de balises uniquement lors du lancement d'une instance" }
answer:
  mapping: { t1: reqtag, t2: restag, t3: princtag, t4: tagkeys, t5: createaction }
explanation:
  correct:
    en: "aws:RequestTag checks the tags passed in a create or tag request, while aws:ResourceTag checks the tags already attached to the resource being acted on. aws:PrincipalTag checks the tags of the calling principal, including session tags passed by an identity provider. aws:TagKeys lists the keys in the request, so ForAllValues:StringEquals with an approved list rejects other keys. ec2:CreateAction restricts ec2:CreateTags to tagging during a creation call such as RunInstances."
    fr: "aws:RequestTag vérifie les balises transmises dans une requête de création ou de balisage, tandis qu'aws:ResourceTag vérifie les balises déjà attachées à la ressource visée. aws:PrincipalTag vérifie les balises du principal appelant, y compris les balises de session transmises par un fournisseur d'identité. aws:TagKeys liste les clés de la requête : ForAllValues:StringEquals avec une liste approuvée rejette les autres clés. ec2:CreateAction restreint ec2:CreateTags au balisage effectué lors d'un appel de création comme RunInstances."
  options:
    sourcevpce:
      en: "aws:SourceVpce identifies the VPC endpoint through which a request arrives; it has nothing to do with tags."
      fr: "aws:SourceVpce identifie le point de terminaison de VPC par lequel arrive une requête ; elle n'a aucun rapport avec les balises."
references:
  - title: Grant permission to tag Amazon EC2 resources during creation - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/supported-iam-actions-tagging.html
  - title: "IAM tutorial: Define permissions to access AWS resources based on tags - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_attribute-based-access-control.html
