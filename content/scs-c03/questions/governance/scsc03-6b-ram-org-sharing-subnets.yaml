id: scsc03-6b-ram-org-sharing-subnets
objective: "6.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's network account owns a VPC with private subnets. Application teams in the accounts of the Workloads OU must launch Amazon EC2 instances directly into these subnets, while the network team keeps sole control of the route tables and network ACLs. Access must be granted without invitations to accept, must cover accounts added to the OU later, and must never extend to accounts outside the organization. In the AWS RAM console of the network account, the organizational structure cannot be displayed when the team selects principals.

    Which solution will meet these requirements?
  fr: |
    Le compte réseau d'AnyCompany possède un VPC avec des sous-réseaux privés. Les équipes applicatives des comptes de l'unité d'organisation Workloads doivent lancer des instances Amazon EC2 directement dans ces sous-réseaux, tandis que l'équipe réseau garde seule le contrôle des tables de routage et des listes ACL réseau. L'accès doit être accordé sans invitation à accepter, doit couvrir les comptes ajoutés plus tard à l'unité d'organisation, et ne doit jamais s'étendre à des comptes hors de l'organisation. Dans la console AWS RAM du compte réseau, la structure de l'organisation ne peut pas être affichée lorsque l'équipe sélectionne les principaux.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a VPC peering connection between each workload account's VPC and the network account's VPC, and update the route tables and network ACLs on both sides."
        fr: "Créer une connexion d'appairage de VPC entre le VPC de chaque compte de charge de travail et celui du compte réseau, puis mettre à jour les tables de routage et les listes ACL réseau des deux côtés."
    - id: b
      text:
        en: "Create a resource share of the subnets that allows sharing with anyone, add each workload account ID as a principal, and have each account accept the invitation."
        fr: "Créer un partage de ressources des sous-réseaux qui autorise le partage avec n'importe qui, ajouter l'ID de chaque compte de charge de travail comme principal, et faire accepter l'invitation par chaque compte."
    - id: c
      text:
        en: "Enable sharing with AWS Organizations in AWS RAM from the management account, then share the subnets with the Workloads OU, allowing sharing only within the organization."
        fr: "Activer le partage avec AWS Organizations dans AWS RAM depuis le compte de gestion, puis partager les sous-réseaux avec l'unité d'organisation Workloads, en n'autorisant le partage qu'au sein de l'organisation."
    - id: d
      text:
        en: "Enable sharing with AWS Organizations in AWS RAM from the management account, then create a resource share of the whole VPC with the Workloads OU as principal."
        fr: "Activer le partage avec AWS Organizations dans AWS RAM depuis le compte de gestion, puis créer un partage de ressources de tout le VPC avec l'unité d'organisation Workloads comme principal."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Sharing with OUs requires sharing with AWS Organizations to be enabled, which is done from the management account. Principals in the organization then get access without invitations, an OU principal covers its current and future accounts, and the share setting that allows sharing only within the organization blocks external principals. Participants launch instances in the shared subnets, while the owner keeps control of the route tables and network ACLs.
    fr: |-
      Le partage avec des unités d'organisation exige que le partage avec AWS Organizations soit activé, ce qui se fait depuis le compte de gestion. Les principaux de l'organisation obtiennent alors l'accès sans invitation, un principal de type unité d'organisation couvre ses comptes actuels et futurs, et le paramètre du partage qui n'autorise le partage qu'au sein de l'organisation bloque les principaux externes. Les participants lancent des instances dans les sous-réseaux partagés, tandis que le propriétaire garde le contrôle des tables de routage et des listes ACL réseau.
  options:
    a:
      en: |-
        Peering keeps the instances in the workload accounts' own VPCs and subnets, so the network team would not control their route tables and network ACLs.
      fr: |-
        L'appairage maintient les instances dans les VPC et sous-réseaux propres aux comptes de charges de travail : l'équipe réseau ne contrôlerait pas leurs tables de routage et leurs listes ACL réseau.
    b:
      en: |-
        This share needs invitations, must be updated for every new account, and its setting allows principals outside the organization.
      fr: |-
        Ce partage exige des invitations, doit être mis à jour pour chaque nouveau compte, et son paramètre autorise des principaux hors de l'organisation.
    d:
      en: |-
        A VPC is not a shareable resource type in AWS RAM; VPC sharing works by sharing subnets.
      fr: |-
        Un VPC n'est pas un type de ressource partageable dans AWS RAM ; le partage de VPC fonctionne en partageant des sous-réseaux.
references:
  - title: Creating a resource share in AWS RAM - AWS Resource Access Manager
    url: https://docs.aws.amazon.com/ram/latest/userguide/working-with-sharing-create.html
