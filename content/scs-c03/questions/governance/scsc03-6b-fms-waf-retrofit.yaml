id: scsc03-6b-fms-waf-retrofit
objective: "6.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany serves its applications through Amazon CloudFront distributions in 25 accounts of its organization in AWS Organizations. AWS Firewall Manager is set up with the security account as the default administrator. Most distributions already have an AWS WAF web ACL that the application team built with application-specific rules; some distributions have no web ACL.

    The security team must add the AWS managed Known bad inputs rule group so that it is evaluated before all other rules on every distribution. The application teams' existing web ACLs and rules must be kept, and new web ACLs must be created only for distributions that have none.

    Which solution will meet these requirements?
  fr: |
    AnyCompany sert ses applications via des distributions Amazon CloudFront dans 25 comptes de son organisation AWS Organizations. AWS Firewall Manager est configuré avec le compte de sécurité comme administrateur par défaut. La plupart des distributions ont déjà une liste ACL web AWS WAF que l'équipe applicative a construite avec des règles propres à l'application ; certaines distributions n'ont aucune liste ACL web.

    L'équipe de sécurité doit ajouter le groupe de règles géré AWS Known bad inputs pour qu'il soit évalué avant toutes les autres règles sur chaque distribution. Les listes ACL web et les règles existantes des équipes applicatives doivent être conservées, et de nouvelles listes ACL web ne doivent être créées que pour les distributions qui n'en ont pas.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a Firewall Manager AWS WAF policy in the Global Region with the rule group as a first rule group, choose to create all new web ACLs, and auto remediate while removing existing web ACL associations."
        fr: "Créer dans la Région Global une politique Firewall Manager AWS WAF avec le groupe de règles comme premier groupe de règles, choisir de créer toutes les listes ACL web, et corriger automatiquement en supprimant les associations de listes ACL web existantes."
    - id: b
      text:
        en: "Create a Firewall Manager AWS WAF policy in the Global Region with the rule group as a first rule group, choose to retrofit existing web ACLs where possible, and auto remediate noncompliant resources."
        fr: "Créer dans la Région Global une politique Firewall Manager AWS WAF avec le groupe de règles comme premier groupe de règles, choisir de réutiliser (retrofit) les listes ACL web existantes lorsque c'est possible, et corriger automatiquement les ressources non conformes."
    - id: c
      text:
        en: "Create a Firewall Manager AWS WAF policy in the Global Region with the rule group as a first rule group, choose to retrofit existing web ACLs where possible, and identify noncompliant resources without auto remediation."
        fr: "Créer dans la Région Global une politique Firewall Manager AWS WAF avec le groupe de règles comme premier groupe de règles, choisir de réutiliser (retrofit) les listes ACL web existantes lorsque c'est possible, et identifier les ressources non conformes sans correction automatique."
    - id: d
      text:
        en: "Create a Firewall Manager AWS WAF policy in the eu-west-1 Region with the rule group as a first rule group, choose to retrofit existing web ACLs where possible, and auto remediate noncompliant resources."
        fr: "Créer dans la Région eu-west-1 une politique Firewall Manager AWS WAF avec le groupe de règles comme premier groupe de règles, choisir de réutiliser (retrofit) les listes ACL web existantes lorsque c'est possible, et corriger automatiquement les ressources non conformes."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudFront distributions are protected by policies created in the Global Region. With the retrofit option, Firewall Manager keeps web ACLs already associated with in-scope resources, adds the policy's rule groups to them, and creates new web ACLs only for resources without one. Auto remediation is what actually applies the policy to the distributions.
    fr: |-
      Les distributions CloudFront sont protégées par des politiques créées dans la Région Global. Avec l'option de réutilisation (retrofit), Firewall Manager conserve les listes ACL web déjà associées aux ressources concernées, y ajoute les groupes de règles de la politique et ne crée de nouvelles listes ACL web que pour les ressources qui n'en ont pas. C'est la correction automatique qui applique effectivement la politique aux distributions.
  options:
    a:
      en: |-
        Creating all new web ACLs and removing the existing associations replaces the application teams' web ACLs, so their application-specific rules would no longer protect the distributions.
      fr: |-
        Créer toutes les listes ACL web et supprimer les associations existantes remplace les listes ACL web des équipes applicatives : leurs règles propres à l'application ne protégeraient plus les distributions.
    c:
      en: |-
        Without auto remediation, Firewall Manager only reports noncompliant resources and does not add the rule group to any distribution.
      fr: |-
        Sans correction automatique, Firewall Manager signale seulement les ressources non conformes et n'ajoute le groupe de règles à aucune distribution.
    d:
      en: |-
        A policy created in a Region such as eu-west-1 protects Regional resources; CloudFront distributions require a policy in the Global Region.
      fr: |-
        Une politique dans une Région comme eu-west-1 protège des ressources régionales ; les distributions CloudFront exigent une politique dans la Région Global.
references:
