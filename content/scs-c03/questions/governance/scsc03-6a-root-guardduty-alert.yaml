id: scsc03-6a-root-guardduty-alert
objective: "6.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany has 300 member accounts. Amazon GuardDuty is enabled for every account in every Region that the company uses, with the security tooling account as the delegated administrator. The security team must be notified within minutes when root user credentials are used in any member account, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany dispose de 300 comptes membres. Amazon GuardDuty est activé pour chaque compte dans chaque Région utilisée par l'entreprise, avec le compte d'outillage de sécurité comme administrateur délégué. L'équipe de sécurité doit être notifiée en quelques minutes lorsque les informations d'identification de l'utilisateur racine sont utilisées dans un compte membre, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          In each member account, create a CloudWatch Logs metric filter and a CloudWatch alarm for root activity recorded by a local trail.
        fr: |-
          Dans chaque compte membre, créer un filtre de métriques CloudWatch Logs et une alarme CloudWatch pour l'activité racine enregistrée par un journal de suivi local.
    - id: b
      text:
        en: |-
          Enable the AWS Trusted Advisor check for MFA on the root account, and send its weekly results to the security team by email.
        fr: |-
          Activer la vérification AWS Trusted Advisor de la MFA du compte racine, et envoyer ses résultats hebdomadaires par e-mail à l'équipe de sécurité.
    - id: c
      text:
        en: |-
          Deploy the AWS Config managed rule that checks root MFA to every account, and notify an SNS topic when an account is noncompliant.
        fr: |-
          Déployer dans chaque compte la règle gérée AWS Config qui vérifie la MFA racine, et notifier une rubrique SNS lorsqu'un compte n'est pas conforme.
    - id: d
      text:
        en: |-
          In the security tooling account, create EventBridge rules in each Region that match RootCredentialUsage findings and notify SNS.
        fr: |-
          Dans le compte d'outillage de sécurité, créer dans chaque Région des règles EventBridge qui correspondent aux résultats RootCredentialUsage et notifient SNS.
answer:
  optionId: d
explanation:
  correct:
    en: |-
      GuardDuty generates Policy:IAMUser/RootCredentialUsage when root user credentials are used to call AWS services. EventBridge rules in the GuardDuty administrator account also match findings from member accounts, so one rule per Region in the security tooling account covers all 300 accounts.
    fr: |-
      GuardDuty génère Policy:IAMUser/RootCredentialUsage lorsque les informations d'identification de l'utilisateur racine sont utilisées pour appeler des services AWS. Les règles EventBridge du compte administrateur GuardDuty correspondent aussi aux résultats des comptes membres : une règle par Région dans le compte d'outillage de sécurité couvre donc les 300 comptes.
  options:
    a:
      en: |-
        Metric filters and alarms in 300 accounts work but add far more setup and maintenance than rules in one account.
      fr: |-
        Des filtres de métriques et des alarmes dans 300 comptes fonctionnent, mais ajoutent bien plus de configuration et de maintenance que des règles dans un seul compte.
    b:
      en: |-
        The check reports whether root MFA is enabled; it does not detect root usage, and a weekly result is not within minutes.
      fr: |-
        La vérification indique si la MFA racine est activée ; elle ne détecte pas l'utilisation de la racine, et un résultat hebdomadaire n'arrive pas en quelques minutes.
    c:
      en: |-
        The rule evaluates the MFA configuration of the root user, not the use of its credentials.
      fr: |-
        La règle évalue la configuration MFA de l'utilisateur racine, et non l'utilisation de ses informations d'identification.
references:
  - title: "GuardDuty IAM finding types - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-iam.html
  - title: "Processing GuardDuty findings with Amazon EventBridge - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_eventbridge.html
