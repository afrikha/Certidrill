id: scsc03-6a-iac-service-role-passrole
objective: "6.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    Developers in AnyCompany's workload accounts deploy AWS CloudFormation stacks that create IAM roles and security groups. The security team requires that developers cannot create or change IAM roles or security groups directly through the console, CLI, or SDKs. Stacks must still be able to create these resources, but only within permissions that the security team defines. The design must follow least privilege.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |-
    Les développeurs des comptes de charges de travail d'AnyCompany déploient des piles AWS CloudFormation qui créent des rôles IAM et des groupes de sécurité. L'équipe de sécurité exige que les développeurs ne puissent pas créer ni modifier directement des rôles IAM ou des groupes de sécurité via la console, la CLI ou les SDK. Les piles doivent toujours pouvoir créer ces ressources, mais uniquement dans les limites d'autorisations définies par l'équipe de sécurité. La conception doit respecter le moindre privilège.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a CloudFormation service role that trusts cloudformation.amazonaws.com and has only the permissions that the security team approves.
        fr: |-
          Créer un rôle de service CloudFormation qui approuve cloudformation.amazonaws.com et ne possède que les autorisations approuvées par l'équipe de sécurité.
    - id: b
      text:
        en: |-
          Give developers iam:* and ec2:* permissions, and attach a permissions boundary that the security team maintains to each developer.
        fr: |-
          Donner aux développeurs des autorisations iam:* et ec2:*, et attacher à chaque développeur une limite d'autorisations maintenue par l'équipe de sécurité.
    - id: c
      text:
        en: |-
          Give developers CloudFormation stack permissions and iam:PassRole only on the approved service role, with no IAM or EC2 write access.
        fr: |-
          Donner aux développeurs des autorisations de pile CloudFormation et iam:PassRole uniquement sur le rôle de service approuvé, sans accès en écriture IAM ou EC2.
    - id: d
      text:
        en: |-
          Set a stack policy on every stack that denies Update:* on the IAM role and security group resources it contains.
        fr: |-
          Définir sur chaque pile une politique de pile qui refuse Update:* sur les ressources de rôle IAM et de groupe de sécurité qu'elle contient.
    - id: e
      text:
        en: |-
          Enable termination protection on every stack that creates IAM roles or security groups in the workload accounts.
        fr: |-
          Activer la protection contre la résiliation sur chaque pile qui crée des rôles IAM ou des groupes de sécurité dans les comptes de charges de travail.
answer:
  optionIds: [a, c]
explanation:
  correct:
    en: |-
      With a service role, CloudFormation uses the role's permissions for every operation on the stack instead of the caller's credentials, so the security team controls what stacks can create. Developers then need only the CloudFormation actions and iam:PassRole on that role, which keeps IAM and EC2 write actions out of their own policies.
    fr: |-
      Avec un rôle de service, CloudFormation utilise les autorisations du rôle pour chaque opération sur la pile au lieu des informations d'identification de l'appelant : l'équipe de sécurité contrôle donc ce que les piles peuvent créer. Les développeurs n'ont alors besoin que des actions CloudFormation et d'iam:PassRole sur ce rôle, ce qui exclut les actions d'écriture IAM et EC2 de leurs propres politiques.
  options:
    b:
      en: |-
        Developers would still be able to create and change roles and security groups directly, within the boundary.
      fr: |-
        Les développeurs pourraient toujours créer et modifier directement des rôles et des groupes de sécurité, dans la limite.
    d:
      en: |-
        A stack policy is a fail-safe for stack updates, not an access control, and it does not stop direct API calls.
      fr: |-
        Une politique de pile est une sécurité pour les mises à jour de pile, et non un contrôle d'accès, et elle n'empêche pas les appels d'API directs.
    e:
      en: |-
        Termination protection only prevents stack deletion and does not limit what developers can do directly.
      fr: |-
        La protection contre la résiliation empêche seulement la suppression des piles et ne limite pas ce que les développeurs peuvent faire directement.
references:
  - title: "CloudFormation service role - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-iam-servicerole.html
