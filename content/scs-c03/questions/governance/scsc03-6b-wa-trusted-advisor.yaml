id: scsc03-6b-wa-trusted-advisor
objective: "6.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has AWS Enterprise Support. Its customer portal workload is defined in the AWS Well-Architected Tool in the shared services account 111122223333, and the workload definition lists the account IDs 111122223333, 222233334444, and 555566667777, where the portal's resources run. During reviews of the AWS Well-Architected Framework lens, the security architect wants to see the AWS Trusted Advisor check results of all three accounts next to the related best practices.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany dispose d'AWS Enterprise Support. Sa charge de travail de portail client est définie dans l'AWS Well-Architected Tool dans le compte de services partagés 111122223333, et la définition de la charge de travail liste les ID de comptes 111122223333, 222233334444 et 555566667777, où s'exécutent les ressources du portail. Pendant les revues de l'objectif (lens) AWS Well-Architected Framework, l'architecte sécurité veut voir les résultats des vérifications AWS Trusted Advisor des trois comptes à côté des bonnes pratiques correspondantes.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Enable the Trusted Advisor organizational view from the management account so that the tool can read the checks of all member accounts."
        fr: "Activer la vue organisationnelle de Trusted Advisor depuis le compte de gestion pour que l'outil puisse lire les vérifications de tous les comptes membres."
    - id: b
      text:
        en: "Activate Trusted Advisor for the workload in its properties in the Well-Architected Tool in account 111122223333."
        fr: "Activer Trusted Advisor pour la charge de travail dans ses propriétés dans le Well-Architected Tool du compte 111122223333."
    - id: c
      text:
        en: "Create a custom lens that maps each Trusted Advisor check to a best practice, and apply it to the workload."
        fr: "Créer un objectif (lens) personnalisé qui associe chaque vérification Trusted Advisor à une bonne pratique, et l'appliquer à la charge de travail."
    - id: d
      text:
        en: "Share the workload with accounts 222233334444 and 555566667777 with the Contributor permission so that they can add their check results."
        fr: "Partager la charge de travail avec les comptes 222233334444 et 555566667777 avec l'autorisation Contributor pour qu'ils puissent y ajouter leurs résultats de vérification."
    - id: e
      text:
        en: "In accounts 222233334444 and 555566667777, create the IAM role that lets the Well-Architected Tool obtain Trusted Advisor information for the account."
        fr: "Dans les comptes 222233334444 et 555566667777, créer le rôle IAM qui permet au Well-Architected Tool d'obtenir les informations Trusted Advisor du compte."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      For Business and Enterprise Support customers, the Trusted Advisor integration is activated per workload by the workload owner. To read Trusted Advisor information for the other accounts associated with the workload, the owners of those accounts must create an IAM role for the Well-Architected Tool; otherwise the tool shows an error for them. The checks are linked only to the Framework lens best practices.
    fr: |-
      Pour les clients Business et Enterprise Support, l'intégration Trusted Advisor s'active charge de travail par charge de travail par le propriétaire de la charge de travail. Pour lire les informations Trusted Advisor des autres comptes associés à la charge de travail, les propriétaires de ces comptes doivent créer un rôle IAM pour le Well-Architected Tool ; sinon l'outil affiche une erreur pour eux. Les vérifications ne sont liées qu'aux bonnes pratiques de l'objectif Framework.
  options:
    a:
      en: |-
        The organizational view produces Trusted Advisor reports for the organization; it does not give the Well-Architected Tool access to the accounts of a workload.
      fr: |-
        La vue organisationnelle produit des rapports Trusted Advisor pour l'organisation ; elle ne donne pas au Well-Architected Tool l'accès aux comptes d'une charge de travail.
    c:
      en: |-
        Trusted Advisor checks are linked only to the AWS Well-Architected Framework lens, not to other lenses.
      fr: |-
        Les vérifications Trusted Advisor ne sont liées qu'à l'objectif AWS Well-Architected Framework, pas aux autres objectifs.
    d:
      en: |-
        Sharing gives other accounts access to the workload review; it does not let the tool read Trusted Advisor data from those accounts.
      fr: |-
        Le partage donne à d'autres comptes l'accès à la revue de la charge de travail ; il ne permet pas à l'outil de lire les données Trusted Advisor de ces comptes.
references:
  - title: Activating AWS Trusted Advisor for a workload - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/activate-ta-for-workload.html
