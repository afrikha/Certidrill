id: scsc03-6a-pol-scp-protect-guardduty
objective: "6.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany's security tooling account is the delegated administrator for Amazon GuardDuty, which is enabled in every account of the Workloads OU. Administrators in the workload accounts have the AdministratorAccess policy. The security team must prevent any principal in the current and future workload accounts from deleting the GuardDuty detector or disassociating the account from the GuardDuty administrator account.

    Which solution will meet these requirements?
  fr: |-
    Le compte d'outillage de sécurité d'AnyCompany est l'administrateur délégué d'Amazon GuardDuty, activé dans chaque compte de l'OU Workloads. Les administrateurs des comptes de charges de travail disposent de la politique AdministratorAccess. L'équipe de sécurité doit empêcher tout principal des comptes de charges de travail actuels et futurs de supprimer le détecteur GuardDuty ou de dissocier le compte du compte administrateur GuardDuty.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the AWS Config managed rule that checks that GuardDuty is enabled, with an automatic remediation that enables it again.
        fr: |-
          Déployer la règle gérée AWS Config qui vérifie que GuardDuty est activé, avec une correction automatique qui le réactive.
    - id: b
      text:
        en: |-
          Attach an SCP to the Workloads OU that denies guardduty:DeleteDetector and guardduty:DisassociateFromAdministratorAccount.
        fr: |-
          Attacher à l'OU Workloads une SCP qui refuse guardduty:DeleteDetector et guardduty:DisassociateFromAdministratorAccount.
    - id: c
      text:
        en: |-
          Replace the AdministratorAccess policy of the administrators with the PowerUserAccess AWS managed policy.
        fr: |-
          Remplacer la politique AdministratorAccess des administrateurs par la politique gérée par AWS PowerUserAccess.
    - id: d
      text:
        en: |-
          Attach an IAM permissions boundary that denies the two GuardDuty actions to the administrator roles in each account.
        fr: |-
          Attacher aux rôles d'administrateur de chaque compte une limite d'autorisations IAM qui refuse les deux actions GuardDuty.
answer:
  optionId: b
explanation:
  correct:
    en: |-
      An SCP sets the maximum permissions of every IAM user and role, including the root user, in the accounts of the OU it is attached to, and an explicit deny in it cannot be overridden by an identity-based policy. Attached to the Workloads OU, it also applies to accounts that join the OU later.
    fr: |-
      Une SCP fixe les autorisations maximales de chaque utilisateur et rôle IAM, y compris l'utilisateur racine, dans les comptes de l'OU à laquelle elle est attachée, et un refus explicite qu'elle contient ne peut pas être contourné par une politique basée sur l'identité. Attachée à l'OU Workloads, elle s'applique aussi aux comptes qui rejoignent l'OU plus tard.
  options:
    a:
      en: |-
        A Config rule detects and reverts the change after it happens; it does not prevent the deletion or the disassociation.
      fr: |-
        Une règle Config détecte et annule la modification après coup ; elle n'empêche pas la suppression ni la dissociation.
    c:
      en: |-
        PowerUserAccess allows all actions except most IAM and Organizations actions, so it still allows the GuardDuty actions.
      fr: |-
        PowerUserAccess autorise toutes les actions sauf la plupart des actions IAM et Organizations : il autorise donc toujours les actions GuardDuty.
    d:
      en: |-
        Administrators can remove the boundary or create principals without it, and it must be applied role by role in every account.
      fr: |-
        Les administrateurs peuvent retirer la limite ou créer des principaux sans elle, et elle doit être appliquée rôle par rôle dans chaque compte.
references:
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
