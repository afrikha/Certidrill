id: scsc03-6b-fms-nacl-first-rules
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's threat intelligence team has identified the range 203.0.113.0/24 as a source of attacks. AWS Firewall Manager is administered from the security account. In every subnet of the accounts in the Prod OU, inbound traffic from this range must be denied at the subnet level before any network ACL rule that account teams add. Account teams must keep the ability to add their own network ACL rules, and new subnets must be covered automatically.

    Which solution will meet these requirements?
  fr: |
    L'équipe de renseignement sur les menaces d'AnyCompany a identifié la plage 203.0.113.0/24 comme source d'attaques. AWS Firewall Manager est administré depuis le compte de sécurité. Dans chaque sous-réseau des comptes de l'unité d'organisation Prod, le trafic entrant provenant de cette plage doit être refusé au niveau du sous-réseau avant toute règle de liste ACL réseau ajoutée par les équipes des comptes. Les équipes des comptes doivent garder la possibilité d'ajouter leurs propres règles de liste ACL réseau, et les nouveaux sous-réseaux doivent être couverts automatiquement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a Firewall Manager network ACL policy scoped to the Prod OU with an inbound last rule that denies 203.0.113.0/24, with auto remediation."
        fr: "Créer une politique Firewall Manager de liste ACL réseau pour l'unité d'organisation Prod avec une dernière règle entrante qui refuse 203.0.113.0/24, avec la correction automatique."
    - id: b
      text:
        en: "Create a Firewall Manager content audit security group policy scoped to the Prod OU that denies inbound traffic from 203.0.113.0/24, with auto remediation."
        fr: "Créer une politique Firewall Manager d'audit de contenu des groupes de sécurité pour l'unité d'organisation Prod qui refuse le trafic entrant provenant de 203.0.113.0/24, avec la correction automatique."
    - id: c
      text:
        en: "Create a Firewall Manager network ACL policy scoped to the Prod OU with an inbound first rule that denies 203.0.113.0/24, with auto remediation."
        fr: "Créer une politique Firewall Manager de liste ACL réseau pour l'unité d'organisation Prod avec une première règle entrante qui refuse 203.0.113.0/24, avec la correction automatique."
    - id: d
      text:
        en: "Use CloudFormation StackSets to create, in each Prod account, a network ACL with rule 100 that denies 203.0.113.0/24, and associate it with every existing subnet."
        fr: "Utiliser CloudFormation StackSets pour créer, dans chaque compte Prod, une liste ACL réseau avec une règle 100 qui refuse 203.0.113.0/24, puis l'associer à chaque sous-réseau existant."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Firewall Manager network ACL policy defines inbound and outbound rules that always run first and rules that always run last, and account owners add custom rules between them. A deny placed in the first rules is evaluated before any account rule, and the policy applies continuously to subnets that are added in the scope.
    fr: |-
      Une politique Firewall Manager de liste ACL réseau définit des règles entrantes et sortantes qui s'exécutent toujours en premier et des règles qui s'exécutent toujours en dernier, et les propriétaires de comptes ajoutent des règles personnalisées entre les deux. Un refus placé dans les premières règles est évalué avant toute règle des comptes, et la politique s'applique en continu aux sous-réseaux ajoutés dans l'étendue.
  options:
    a:
      en: |-
        Network ACL rules are evaluated in order and the first match applies, so an allow rule that an account team adds would match before a deny placed in the last rules.
      fr: |-
        Les règles de liste ACL réseau sont évaluées dans l'ordre et la première correspondance s'applique : une règle d'autorisation ajoutée par une équipe correspondrait avant un refus placé dans les dernières règles.
    b:
      en: |-
        Security groups contain only allow rules and work at the instance level, so a security group policy cannot deny a CIDR range at the subnet level.
      fr: |-
        Les groupes de sécurité ne contiennent que des règles d'autorisation et agissent au niveau des instances : une politique de groupe de sécurité ne peut pas refuser une plage CIDR au niveau du sous-réseau.
    d:
      en: |-
        Subnets created later are not associated with the new network ACL, and account teams could change the association or the rule order.
      fr: |-
        Les sous-réseaux créés plus tard ne sont pas associés à la nouvelle liste ACL réseau, et les équipes pourraient modifier l'association ou l'ordre des règles.
references:
  - title: Using Amazon VPC network access control list (ACL) policies with Firewall Manager - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/network-acl-policies.html
  - title: Creating an AWS Firewall Manager policy - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/create-policy.html
