id: scsc03-6a-ct-lz4-config-baseline
objective: "6.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany launched a new AWS Control Tower landing zone at version 4.0 with the AWS Config service integration enabled. The security team registered the Workloads OU and enabled detective controls on it. The team then found that only the service integration accounts have an AWS Config configuration recorder; the member accounts of the Workloads OU have none. Every account of the OU must record its configuration.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany a lancé une nouvelle zone d'atterrissage AWS Control Tower en version 4.0 avec l'intégration de service AWS Config activée. L'équipe de sécurité a enregistré l'OU Workloads et y a activé des contrôles détectifs. L'équipe a ensuite constaté que seuls les comptes d'intégration de service possèdent un enregistreur de configuration AWS Config ; les comptes membres de l'OU Workloads n'en ont aucun. Chaque compte de l'OU doit enregistrer sa configuration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Disable and then enable the AWS Config service integration again in the landing zone settings.
        fr: |-
          Désactiver puis réactiver l'intégration de service AWS Config dans les paramètres de la zone d'atterrissage.
    - id: b
      text:
        en: |-
          Enable the AWS Config baseline on the Workloads OU.
        fr: |-
          Activer la référence de base (baseline) AWS Config sur l'OU Workloads.
    - id: c
      text:
        en: |-
          Create a configuration recorder and a delivery channel in each member account with a StackSet.
        fr: |-
          Créer un enregistreur de configuration et un canal de diffusion dans chaque compte membre avec un StackSet.
    - id: d
      text:
        en: |-
          Deploy an organization conformance pack from the audit account to the Workloads OU.
        fr: |-
          Déployer un pack de conformité d'organisation depuis le compte d'audit vers l'OU Workloads.
answer:
  optionId: b
explanation:
  correct:
    en: |-
      In landing zone 4.0, the AWS Config integration at the landing zone level deploys recording resources only to the service integration accounts. It is a prerequisite, but the recorder and delivery channel are deployed to member accounts only when the AWS Config baseline is enabled on each managed OU.
    fr: |-
      Dans la zone d'atterrissage 4.0, l'intégration AWS Config au niveau de la zone d'atterrissage ne déploie les ressources d'enregistrement que dans les comptes d'intégration de service. C'est un prérequis, mais l'enregistreur et le canal de diffusion ne sont déployés dans les comptes membres que lorsque la référence de base AWS Config est activée sur chaque OU gérée.
  options:
    a:
      en: |-
        The landing zone setting is already enabled and, by design, does not deploy recorders to member accounts.
      fr: |-
        Le paramètre de la zone d'atterrissage est déjà activé et, par conception, ne déploie pas d'enregistreur dans les comptes membres.
    c:
      en: |-
        Self-created Config resources are not managed by Control Tower and make later enrollment of the accounts require the existing-resources procedure.
      fr: |-
        Des ressources Config créées soi-même ne sont pas gérées par Control Tower et imposent ensuite la procédure des ressources existantes pour inscrire les comptes.
    d:
      en: |-
        A conformance pack deploys Config rules and needs an existing recorder; it does not create one.
      fr: |-
        Un pack de conformité déploie des règles Config et a besoin d'un enregistreur existant ; il n'en crée pas.
references:
  - title: "Key changes - AWS Control Tower"
    url: https://docs.aws.amazon.com/controltower/latest/userguide/key-changes-lz-v4.html
