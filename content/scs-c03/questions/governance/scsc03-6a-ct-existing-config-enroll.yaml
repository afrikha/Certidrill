id: scsc03-6a-ct-existing-config-enroll
objective: "6.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany uses AWS Control Tower. A business unit has 15 accounts in an unregistered OU of the same organization. Each account already has an AWS Config configuration recorder and delivery channel in the governed Regions. The security team must bring the accounts under Control Tower governance. The existing configuration recorders must be kept and reconfigured, not deleted.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany utilise AWS Control Tower. Une unité commerciale dispose de 15 comptes dans une OU non enregistrée de la même organisation. Chaque compte possède déjà un enregistreur de configuration AWS Config et un canal de diffusion dans les Régions gouvernées. L'équipe de sécurité doit placer les comptes sous la gouvernance de Control Tower. Les enregistreurs de configuration existants doivent être conservés et reconfigurés, et non supprimés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Run the Enroll account workflow in the Control Tower console for each of the 15 accounts, one account at a time.
        fr: |-
          Exécuter le flux Enroll account dans la console Control Tower pour chacun des 15 comptes, un compte à la fois.
    - id: b
      text:
        en: |-
          Stop and delete the configuration recorders and delivery channels in each account, and then enroll each account.
        fr: |-
          Arrêter et supprimer les enregistreurs de configuration et les canaux de diffusion de chaque compte, puis inscrire chaque compte.
    - id: c
      text:
        en: |-
          Turn on auto-enrollment, and then move the 15 accounts into an OU that Control Tower already governs.
        fr: |-
          Activer l'inscription automatique, puis déplacer les 15 comptes dans une OU que Control Tower gouverne déjà.
    - id: d
      text:
        en: |-
          Request allow-listing through AWS Support, update the existing Config resources as documented, and then register the OU.
        fr: |-
          Demander l'ajout à la liste d'autorisation via AWS Support, mettre à jour les ressources Config existantes selon la documentation, puis enregistrer l'OU.
answer:
  optionId: d
explanation:
  correct:
    en: |-
      Accounts with existing AWS Config resources can be governed only after AWS Support adds them to the Control Tower allow list. The team then creates the documented recorder role, points the existing recorders and delivery channels at the Control Tower settings, and uses Register OU or Re-register OU, because the Enroll account workflow does not work for these accounts.
    fr: |-
      Les comptes qui ont des ressources AWS Config existantes ne peuvent être gouvernés qu'après leur ajout à la liste d'autorisation de Control Tower par AWS Support. L'équipe crée ensuite le rôle d'enregistreur documenté, aligne les enregistreurs et les canaux de diffusion existants sur les paramètres de Control Tower, puis utilise Register OU ou Re-register OU, car le flux Enroll account ne fonctionne pas pour ces comptes.
  options:
    a:
      en: |-
        Enrollment of an account that has a configuration recorder or delivery channel fails unless the account was allow-listed and the OU workflow is used.
      fr: |-
        L'inscription d'un compte qui possède un enregistreur de configuration ou un canal de diffusion échoue tant que le compte n'est pas sur la liste d'autorisation et que le flux de l'OU n'est pas utilisé.
    b:
      en: |-
        Deleting the recorders would allow standard enrollment, but the requirement is to keep and reconfigure them.
      fr: |-
        Supprimer les enregistreurs permettrait l'inscription standard, mais l'exigence est de les conserver et de les reconfigurer.
    c:
      en: |-
        The documented procedure for existing Config resources is not supported with auto-enrollment, and moving the accounts creates drift that blocks allow-listing.
      fr: |-
        La procédure documentée pour les ressources Config existantes n'est pas prise en charge avec l'inscription automatique, et déplacer les comptes crée une dérive qui bloque l'ajout à la liste d'autorisation.
references:
  - title: "Enroll accounts that have existing AWS Config resources - AWS Control Tower"
    url: https://docs.aws.amazon.com/controltower/latest/userguide/existing-config-resources.html
