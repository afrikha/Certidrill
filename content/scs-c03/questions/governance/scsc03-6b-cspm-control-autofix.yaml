id: scsc03-6b-cspm-control-autofix
objective: "6.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany enables the AWS Foundational Security Best Practices standard in AWS Security Hub CSPM in all accounts. The security team wants every new FAILED finding for control EC2.7, which checks that EBS default encryption is enabled, to be fixed automatically by turning on EBS encryption by default in the affected account and Region. An engineer tried to attach a remediation action, in the AWS Config console, to the rule whose name starts with securityhub-ec2-ebs-encryption-by-default, but the option is not available.

    Which solution will meet these requirements?
  fr: |
    AnyCompany active la norme AWS Foundational Security Best Practices dans AWS Security Hub CSPM dans tous ses comptes. L'équipe de sécurité veut que chaque nouveau résultat FAILED du contrôle EC2.7, qui vérifie que le chiffrement EBS par défaut est activé, soit corrigé automatiquement en activant le chiffrement EBS par défaut dans le compte et la Région concernés. Un ingénieur a tenté d'attacher, dans la console AWS Config, une action de correction à la règle dont le nom commence par securityhub-ec2-ebs-encryption-by-default, mais l'option n'est pas disponible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Call PutRemediationConfigurations with the AWS CLI to add an automatic remediation runbook to that securityhub- rule in each account."
        fr: "Appeler PutRemediationConfigurations avec l'AWS CLI pour ajouter un runbook de correction automatique à cette règle securityhub- dans chaque compte."
    - id: b
      text:
        en: "Create a Security Hub CSPM automation rule that matches FAILED findings of control EC2.7 and runs a Systems Manager Automation runbook that enables EBS encryption by default."
        fr: "Créer une règle d'automatisation Security Hub CSPM qui correspond aux résultats FAILED du contrôle EC2.7 et exécute un runbook Systems Manager Automation qui active le chiffrement EBS par défaut."
    - id: c
      text:
        en: "Create a Security Hub CSPM custom action and an EventBridge rule that matches the action's ARN and starts a runbook that enables EBS encryption by default in the account."
        fr: "Créer une action personnalisée Security Hub CSPM et une règle EventBridge qui correspond à l'ARN de l'action et lance un runbook qui active le chiffrement EBS par défaut dans le compte."
    - id: d
      text:
        en: "Create an EventBridge rule on Security Hub Findings - Imported events for FAILED findings of control EC2.7, with a runbook that enables EBS encryption by default as target."
        fr: "Créer une règle EventBridge sur les événements Security Hub Findings - Imported pour les résultats FAILED du contrôle EC2.7, avec comme cible un runbook qui active le chiffrement EBS par défaut."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Security Hub CSPM sends every new or updated finding to EventBridge as a Security Hub Findings - Imported event. A rule that filters on the control and the FAILED status starts the fix each time without human action. The securityhub- rules are service-linked rules, and AWS Config only manages remediation for rules that are not service-linked.
    fr: |-
      Security Hub CSPM envoie chaque résultat nouveau ou mis à jour à EventBridge sous forme d'événement Security Hub Findings - Imported. Une règle qui filtre sur le contrôle et l'état FAILED lance la correction à chaque fois, sans action humaine. Les règles securityhub- sont des règles liées à un service, et AWS Config ne gère la correction que des règles qui ne sont pas liées à un service.
  options:
    a:
      en: |-
        The API enforces the same limit as the console: remediation can be managed only for rules that are not service-linked.
      fr: |-
        L'API applique la même limite que la console : la correction ne peut être gérée que pour les règles qui ne sont pas liées à un service.
    b:
      en: |-
        Automation rules only update finding fields such as severity or workflow status; they cannot run a runbook.
      fr: |-
        Les règles d'automatisation mettent seulement à jour des champs des résultats, comme la gravité ou l'état du flux de travail ; elles ne peuvent pas exécuter de runbook.
    c:
      en: |-
        A custom action sends findings to EventBridge only when an analyst selects them in the console, so the fix would not be automatic.
      fr: |-
        Une action personnalisée n'envoie des résultats à EventBridge que lorsqu'un analyste les sélectionne dans la console : la correction ne serait pas automatique.
references:
  - title: Security Hub CSPM event types in EventBridge - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-cwe-integration-types.html
  - title: Setting Up Auto Remediation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
