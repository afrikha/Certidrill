id: scsc03-6a-iac-stackset-autodeploy-role
objective: "6.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany's incident response team needs an IAM role with the same name and permissions in every member account of its organization in AWS Organizations, including accounts that are created later. The role is defined in one AWS CloudFormation template. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |-
    L'équipe de réponse aux incidents d'AnyCompany a besoin d'un rôle IAM portant le même nom et les mêmes autorisations dans chaque compte membre de son organisation AWS Organizations, y compris dans les comptes créés ultérieurement. Le rôle est défini dans un seul modèle AWS CloudFormation. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a service-managed StackSet that targets the organization root with automatic deployment enabled.
        fr: |-
          Créer un StackSet géré par le service qui cible la racine de l'organisation avec le déploiement automatique activé.
    - id: b
      text:
        en: |-
          Create a self-managed StackSet, and add each new account to it after the account is created.
        fr: |-
          Créer un StackSet autogéré, et y ajouter chaque nouveau compte après sa création.
    - id: c
      text:
        en: |-
          Send the template to each account owner, and ask the owner to deploy it as a stack.
        fr: |-
          Envoyer le modèle à chaque propriétaire de compte, et lui demander de le déployer sous forme de pile.
    - id: d
      text:
        en: |-
          Attach an SCP to the root that allows the incident response team to assume any role in member accounts.
        fr: |-
          Attacher à la racine une SCP qui autorise l'équipe de réponse aux incidents à assumer n'importe quel rôle dans les comptes membres.
answer:
  optionId: a
explanation:
  correct:
    en: |-
      With automatic deployment, a service-managed StackSet deploys its stacks to every account that is added to a target OU or to the organization. Targeting the root therefore creates the role in all current member accounts and in every account created later, with no manual step.
    fr: |-
      Avec le déploiement automatique, un StackSet géré par le service déploie ses piles dans chaque compte ajouté à une OU cible ou à l'organisation. Cibler la racine crée donc le rôle dans tous les comptes membres actuels et dans chaque compte créé ultérieurement, sans étape manuelle.
  options:
    b:
      en: |-
        Self-managed StackSets have no automatic deployment, so every new account needs a manual step.
      fr: |-
        Les StackSets autogérés n'ont pas de déploiement automatique : chaque nouveau compte exige une étape manuelle.
    c:
      en: |-
        Manual deployment by each owner is slow, inconsistent, and does not cover new accounts automatically.
      fr: |-
        Un déploiement manuel par chaque propriétaire est lent, incohérent et ne couvre pas automatiquement les nouveaux comptes.
    d:
      en: |-
        SCPs never grant permissions and do not create roles in accounts.
      fr: |-
        Les SCP n'accordent jamais d'autorisations et ne créent pas de rôles dans les comptes.
references:
  - title: "Enable or disable automatic deployments for StackSets in AWS Organizations - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-manage-auto-deployment.html
