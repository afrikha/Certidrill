id: scsc03-6a-org-divest-remove-access
objective: "6.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany is selling a business unit. The unit's three member accounts were created with AWS Organizations and will leave the organization to become standalone accounts that the buyer owns. The accounts already have payment information and a support plan. The sale contract requires that, after the accounts leave, no principal in AnyCompany's management account can access them. The buyer's workloads must keep running.

    What must the security team do to meet the contract requirement?
  fr: |-
    AnyCompany vend une unité commerciale. Les trois comptes membres de l'unité ont été créés avec AWS Organizations et vont quitter l'organisation pour devenir des comptes autonomes appartenant à l'acheteur. Les comptes disposent déjà d'informations de paiement et d'un plan de support. Le contrat de cession exige qu'après le départ des comptes, aucun principal du compte de gestion d'AnyCompany ne puisse y accéder. Les charges de travail de l'acheteur doivent continuer de s'exécuter.

    Que doit faire l'équipe de sécurité pour respecter l'exigence du contrat ?
body:
  options:
    - id: a
      text:
        en: |-
          Nothing more, because Organizations deletes OrganizationAccountAccessRole from an account automatically when the account leaves.
        fr: |-
          Rien de plus, car Organizations supprime automatiquement OrganizationAccountAccessRole d'un compte lorsque celui-ci quitte l'organisation.
    - id: b
      text:
        en: |-
          Before the accounts leave, attach an SCP to them that denies sts:AssumeRole for principals of the management account.
        fr: |-
          Avant le départ des comptes, leur attacher une SCP qui refuse sts:AssumeRole pour les principaux du compte de gestion.
    - id: c
      text:
        en: |-
          Delete OrganizationAccountAccessRole, and any other role that trusts the management account, in each account that leaves.
        fr: |-
          Supprimer OrganizationAccountAccessRole, et tout autre rôle qui approuve le compte de gestion, dans chaque compte qui part.
    - id: d
      text:
        en: |-
          Disable trusted access for every AWS service so that Organizations removes its roles from the departing accounts.
        fr: |-
          Désactiver l'accès approuvé pour chaque service AWS afin qu'Organizations retire ses rôles des comptes qui partent.
answer:
  optionId: c
explanation:
  correct:
    en: |-
      Accounts created with Organizations contain a role that gives the management account administrative access, and that role is not deleted when the account leaves the organization. To end the former management account's access, the role, and any other role whose trust policy names the management account, must be deleted manually in IAM.
    fr: |-
      Les comptes créés avec Organizations contiennent un rôle qui donne au compte de gestion un accès administratif, et ce rôle n'est pas supprimé lorsque le compte quitte l'organisation. Pour mettre fin à l'accès de l'ancien compte de gestion, ce rôle, ainsi que tout autre rôle dont la politique d'approbation nomme le compte de gestion, doit être supprimé manuellement dans IAM.
  options:
    a:
      en: |-
        Organizations does not remove the role when an account leaves, so the management account keeps administrative access.
      fr: |-
        Organizations ne supprime pas le rôle lorsqu'un compte quitte l'organisation : le compte de gestion conserve un accès administratif.
    b:
      en: |-
        SCPs stop applying as soon as the account is no longer a member, so the deny disappears when the account leaves.
      fr: |-
        Les SCP cessent de s'appliquer dès que le compte n'est plus membre : le refus disparaît au départ du compte.
    d:
      en: |-
        Disabling trusted access affects service-linked roles and service integrations; OrganizationAccountAccessRole is an ordinary IAM role that stays in place.
      fr: |-
        Désactiver l'accès approuvé concerne les rôles liés à un service et les intégrations de services ; OrganizationAccountAccessRole est un rôle IAM ordinaire qui reste en place.
references:
  - title: "Leaving an organization from a member account with AWS Organizations - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_accounts_leave-as-member.html
  - title: "Accessing a member account that has OrganizationAccountAccessRole with AWS Organizations - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_accounts_access-cross-account-role.html
