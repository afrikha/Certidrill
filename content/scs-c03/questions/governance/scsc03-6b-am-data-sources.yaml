id: scsc03-6b-am-data-sources
objective: "6.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is an existing AWS Audit Manager customer. The compliance team is creating a custom control named Privileged IAM changes are reviewed. The control needs two kinds of automatically collected evidence: a record of every AttachRolePolicy and PutRolePolicy call as the activity happens, and a weekly snapshot of the account password policy.

    How should the team configure the data sources of the custom control?
  fr: |
    AnyCompany est déjà cliente d'AWS Audit Manager. L'équipe de conformité crée un contrôle personnalisé nommé Privileged IAM changes are reviewed. Le contrôle a besoin de deux types de preuves collectées automatiquement : un enregistrement de chaque appel AttachRolePolicy et PutRolePolicy au fil de l'activité, et un instantané hebdomadaire de la politique de mots de passe du compte.

    Comment l'équipe doit-elle configurer les sources de données du contrôle personnalisé ?
body:
  options:
    - id: a
      text:
        en: "Map the CloudTrail keywords iam_AttachRolePolicy and iam_PutRolePolicy as user activity, and map the AWS API call iam_GetAccountPasswordPolicy with a weekly frequency as configuration data."
        fr: "Mapper les mots-clés CloudTrail iam_AttachRolePolicy et iam_PutRolePolicy comme activité utilisateur, et mapper l'appel d'API AWS iam_GetAccountPasswordPolicy avec une fréquence hebdomadaire comme données de configuration."
    - id: b
      text:
        en: "Map the AWS API calls iam_AttachRolePolicy and iam_PutRolePolicy with a weekly frequency, and map the CloudTrail keyword iam_GetAccountPasswordPolicy as user activity."
        fr: "Mapper les appels d'API AWS iam_AttachRolePolicy et iam_PutRolePolicy avec une fréquence hebdomadaire, et mapper le mot-clé CloudTrail iam_GetAccountPasswordPolicy comme activité utilisateur."
    - id: c
      text:
        en: "Map the AWS Config rule iam-password-policy as a compliance check, and upload the CloudTrail logs of the two IAM calls as manual evidence every week."
        fr: "Mapper la règle AWS Config iam-password-policy comme vérification de conformité, et charger chaque semaine les journaux CloudTrail des deux appels IAM comme preuves manuelles."
    - id: d
      text:
        en: "Map the Security Hub CSPM IAM controls as compliance checks for both kinds of evidence, and collect them on the schedule of each control."
        fr: "Mapper les contrôles IAM de Security Hub CSPM comme vérifications de conformité pour les deux types de preuves, et les collecter selon la planification de chaque contrôle."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CloudTrail keywords, written as service_EventName, turn matching management events into user activity evidence as they occur. The AWS API call data source runs a supported read call, such as iam_GetAccountPasswordPolicy, on a daily, weekly, or monthly frequency and stores the result as a configuration snapshot.
    fr: |-
      Les mots-clés CloudTrail, écrits sous la forme service_EventName, transforment les événements de gestion correspondants en preuves d'activité utilisateur au fur et à mesure. La source de données d'appel d'API AWS exécute un appel de lecture pris en charge, comme iam_GetAccountPasswordPolicy, selon une fréquence quotidienne, hebdomadaire ou mensuelle et stocke le résultat comme instantané de configuration.
  options:
    b:
      en: |-
        The sources are swapped: API call sources take read-only snapshots and do not record changes, and read-only events such as Get calls are no longer supported as CloudTrail keywords.
      fr: |-
        Les sources sont inversées : les sources d'appel d'API prennent des instantanés en lecture seule et n'enregistrent pas les modifications, et les événements en lecture seule comme les appels Get ne sont plus pris en charge comme mots-clés CloudTrail.
    c:
      en: |-
        A Config rule gives a compliance check rather than a snapshot of the policy, and weekly manual uploads are not automatic collection.
      fr: |-
        Une règle Config fournit une vérification de conformité plutôt qu'un instantané de la politique, et des chargements manuels hebdomadaires ne sont pas une collecte automatique.
    d:
      en: |-
        Security Hub CSPM controls produce compliance check results; they do not record who called AttachRolePolicy or PutRolePolicy.
      fr: |-
        Les contrôles Security Hub CSPM produisent des résultats de vérification de conformité ; ils n'enregistrent pas qui a appelé AttachRolePolicy ou PutRolePolicy.
references:
