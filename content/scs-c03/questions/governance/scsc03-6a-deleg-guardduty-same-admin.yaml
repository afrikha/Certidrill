id: scsc03-6a-deleg-guardduty-same-admin
objective: "6.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany's security tooling account, 111122223333, is the delegated GuardDuty administrator in eu-west-1 and us-east-1. The company is expanding into ap-southeast-2. The regional security operations team wants its own account, 444455556666, to be the GuardDuty delegated administrator in ap-southeast-2, but the designation fails. Every account must be protected in ap-southeast-2, and the regional team must be able to review the findings of that Region.

    Which solution will meet these requirements?
  fr: |-
    Le compte d'outillage de sécurité d'AnyCompany, 111122223333, est l'administrateur délégué GuardDuty dans eu-west-1 et us-east-1. L'entreprise s'étend à ap-southeast-2. L'équipe régionale des opérations de sécurité veut que son propre compte, 444455556666, soit l'administrateur délégué GuardDuty dans ap-southeast-2, mais la désignation échoue. Chaque compte doit être protégé dans ap-southeast-2, et l'équipe régionale doit pouvoir examiner les résultats de cette Région.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Register 444455556666 with register-delegated-administrator for the GuardDuty service principal instead of using the GuardDuty console.
        fr: |-
          Enregistrer 444455556666 avec register-delegated-administrator pour le principal de service GuardDuty au lieu d'utiliser la console GuardDuty.
    - id: b
      text:
        en: |-
          Enable GuardDuty in each account in ap-southeast-2 with a StackSet, and forward the findings of that Region to 444455556666 with EventBridge.
        fr: |-
          Activer GuardDuty dans chaque compte dans ap-southeast-2 avec un StackSet, et transférer les résultats de cette Région vers 444455556666 avec EventBridge.
    - id: c
      text:
        en: |-
          Create a second organization for the accounts that run in ap-southeast-2, with 444455556666 as its GuardDuty administrator.
        fr: |-
          Créer une seconde organisation pour les comptes qui s'exécutent dans ap-southeast-2, avec 444455556666 comme administrateur GuardDuty.
    - id: d
      text:
        en: |-
          Designate 111122223333 as the delegated administrator in ap-southeast-2, and give the regional team a role in it that is limited to that Region.
        fr: |-
          Désigner 111122223333 comme administrateur délégué dans ap-southeast-2, et donner à l'équipe régionale un rôle dans ce compte limité à cette Région.
answer:
  optionId: d
explanation:
  correct:
    en: |-
      GuardDuty is Regional and its delegated administrator is designated in each Region, but the same member account must be the delegated administrator in every Region where GuardDuty is enabled. Designating 111122223333 in ap-southeast-2 protects the accounts there, and an IAM role in that account scoped to the Region gives the regional team access to the findings.
    fr: |-
      GuardDuty est un service régional et son administrateur délégué est désigné dans chaque Région, mais le même compte membre doit être l'administrateur délégué dans toutes les Régions où GuardDuty est activé. Désigner 111122223333 dans ap-southeast-2 protège les comptes de cette Région, et un rôle IAM limité à la Région dans ce compte donne à l'équipe régionale l'accès aux résultats.
  options:
    a:
      en: |-
        The rule of one delegated administrator for all Regions applies whatever tool is used to designate it.
      fr: |-
        La règle d'un seul administrateur délégué pour toutes les Régions s'applique quel que soit l'outil utilisé pour le désigner.
    b:
      en: |-
        Standalone detectors are not managed centrally, new accounts are not covered automatically, and the forwarding is custom work.
      fr: |-
        Des détecteurs autonomes ne sont pas gérés de manière centralisée, les nouveaux comptes ne sont pas couverts automatiquement, et le transfert est un travail sur mesure.
    c:
      en: |-
        A second organization splits every governance control, which is far more disruptive than a Region-scoped role.
      fr: |-
        Une seconde organisation divise tous les contrôles de gouvernance, ce qui est bien plus perturbant qu'un rôle limité à une Région.
references:
  - title: "Managing GuardDuty accounts with AWS Organizations - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_organizations.html
