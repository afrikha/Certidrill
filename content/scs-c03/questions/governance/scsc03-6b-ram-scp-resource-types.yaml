id: scsc03-6b-ram-scp-resource-types
objective: "6.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 200 accounts in AWS Organizations, and sharing with AWS Organizations is enabled in AWS RAM. Many teams share resources such as Systems Manager documents and EC2 Image Builder components. The security team requires that only the NetworkShareAdmin role in the network account 444455556666 can share Route 53 Resolver rules and transit gateways. All other teams must keep sharing the other resource types without change. The control must be preventive and cover every account.

    Which solution will meet these requirements?
  fr: |
    AnyCompany compte 200 comptes dans AWS Organizations, et le partage avec AWS Organizations est activé dans AWS RAM. De nombreuses équipes partagent des ressources comme des documents Systems Manager et des composants EC2 Image Builder. L'équipe de sécurité exige que seul le rôle NetworkShareAdmin du compte réseau 444455556666 puisse partager des règles Route 53 Resolver et des passerelles de transit. Toutes les autres équipes doivent continuer à partager les autres types de ressources sans changement. Le contrôle doit être préventif et couvrir tous les comptes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach an SCP that denies ram:CreateResourceShare and ram:AssociateResourceShare when ram:RequestedAllowsExternalPrincipals is true, unless aws:PrincipalARN is the NetworkShareAdmin role."
        fr: "Attacher une SCP qui refuse ram:CreateResourceShare et ram:AssociateResourceShare lorsque ram:RequestedAllowsExternalPrincipals est true, sauf si aws:PrincipalARN est le rôle NetworkShareAdmin."
    - id: b
      text:
        en: "Attach an SCP that denies ram:CreateResourceShare and ram:AssociateResourceShare when ram:ShareOwnerAccountId is not 444455556666, unless aws:PrincipalARN is the NetworkShareAdmin role."
        fr: "Attacher une SCP qui refuse ram:CreateResourceShare et ram:AssociateResourceShare lorsque ram:ShareOwnerAccountId n'est pas 444455556666, sauf si aws:PrincipalARN est le rôle NetworkShareAdmin."
    - id: c
      text:
        en: "Attach a permissions boundary to every existing role except NetworkShareAdmin that denies all AWS RAM actions on route53resolver:ResolverRule and ec2:TransitGateway resources."
        fr: "Attacher à chaque rôle existant, sauf NetworkShareAdmin, une limite d'autorisations qui refuse toutes les actions AWS RAM sur les ressources route53resolver:ResolverRule et ec2:TransitGateway."
    - id: d
      text:
        en: "Attach an SCP that denies ram:CreateResourceShare and ram:AssociateResourceShare when ram:RequestedResourceTypes includes either type, unless aws:PrincipalARN is the NetworkShareAdmin role."
        fr: "Attacher une SCP qui refuse ram:CreateResourceShare et ram:AssociateResourceShare lorsque ram:RequestedResourceTypes inclut l'un des deux types, sauf si aws:PrincipalARN est le rôle NetworkShareAdmin."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      ram:RequestedResourceTypes holds the resource types of the resources that a CreateResourceShare or AssociateResourceShare request adds to a share. A Deny with ForAnyValue:StringEquals on the two types, combined with an ArnNotLike exception on aws:PrincipalARN, blocks those two types for everyone except the network role and leaves every other type untouched in all member accounts.
    fr: |-
      ram:RequestedResourceTypes contient les types des ressources qu'une requête CreateResourceShare ou AssociateResourceShare ajoute à un partage. Un refus avec ForAnyValue:StringEquals sur les deux types, combiné à une exception ArnNotLike sur aws:PrincipalARN, bloque ces deux types pour tous sauf le rôle réseau et laisse tous les autres types intacts dans tous les comptes membres.
  options:
    a:
      en: |-
        This key controls whether a share allows principals outside the organization; it does not restrict which resource types can be shared or by whom.
      fr: |-
        Cette clé contrôle si un partage autorise des principaux hors de l'organisation ; elle ne restreint ni les types de ressources partageables ni qui peut les partager.
    b:
      en: |-
        This SCP would stop every other account from sharing any resource type, which breaks the teams that share documents and components.
      fr: |-
        Cette SCP empêcherait tous les autres comptes de partager le moindre type de ressource, ce qui bloque les équipes qui partagent des documents et des composants.
    c:
      en: |-
        Boundaries must be attached role by role in every account, roles created later escape the control, and administrators could remove the boundaries.
      fr: |-
        Les limites doivent être attachées rôle par rôle dans chaque compte, les rôles créés plus tard échappent au contrôle, et les administrateurs pourraient retirer les limites.
references:
  - title: Actions, resources, and condition keys for AWS Resource Access Manager (RAM) - Service Authorization Reference
    url: https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsresourceaccessmanagerram.html
