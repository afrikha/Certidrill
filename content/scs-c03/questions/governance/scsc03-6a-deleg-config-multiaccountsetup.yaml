id: scsc03-6a-deleg-config-multiaccountsetup
objective: "6.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's management account enabled trusted access for config.amazonaws.com and registered the security tooling account as a delegated administrator for that service principal. From the security tooling account, engineers created an organization aggregator successfully. When they call PutOrganizationConformancePack from the same account, the call fails because the account is not a delegated administrator. The engineers have the required IAM permissions. The conformance packs must be deployed to the organization from the security tooling account.

    Which solution will meet these requirements?
  fr: |-
    Le compte de gestion d'AnyCompany a activé l'accès approuvé pour config.amazonaws.com et a enregistré le compte d'outillage de sécurité comme administrateur délégué pour ce principal de service. Depuis le compte d'outillage de sécurité, les ingénieurs ont créé avec succès un agrégateur d'organisation. Lorsqu'ils appellent PutOrganizationConformancePack depuis ce même compte, l'appel échoue, car le compte n'est pas administrateur délégué. Les ingénieurs disposent des autorisations IAM requises. Les packs de conformité doivent être déployés dans l'organisation depuis le compte d'outillage de sécurité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          From the management account, enable trusted access for config-multiaccountsetup.amazonaws.com and register the account for it.
        fr: |-
          Depuis le compte de gestion, activer l'accès approuvé pour config-multiaccountsetup.amazonaws.com et y enregistrer le compte.
    - id: b
      text:
        en: |-
          Create an aggregation authorization for the security tooling account in each member account and Region.
        fr: |-
          Créer une autorisation d'agrégation pour le compte d'outillage de sécurité dans chaque compte membre et chaque Région.
    - id: c
      text:
        en: |-
          Register the security tooling account as a delegated administrator for StackSets, and deploy the conformance packs as a StackSet.
        fr: |-
          Enregistrer le compte d'outillage de sécurité comme administrateur délégué pour StackSets, et déployer les packs de conformité sous forme de StackSet.
    - id: d
      text:
        en: |-
          Deregister the account for config.amazonaws.com, and register it again after deleting the organization aggregator.
        fr: |-
          Annuler l'enregistrement du compte pour config.amazonaws.com, puis l'enregistrer de nouveau après avoir supprimé l'agrégateur d'organisation.
answer:
  optionId: a
explanation:
  correct:
    en: |-
      AWS Config uses two service principals for delegated administration: config.amazonaws.com for organization aggregators, and config-multiaccountsetup.amazonaws.com for deploying organization rules and conformance packs. The management account must enable trusted access for the second principal and register the security tooling account for it.
    fr: |-
      AWS Config utilise deux principaux de service pour l'administration déléguée : config.amazonaws.com pour les agrégateurs d'organisation, et config-multiaccountsetup.amazonaws.com pour le déploiement des règles et des packs de conformité d'organisation. Le compte de gestion doit activer l'accès approuvé pour le second principal et y enregistrer le compte d'outillage de sécurité.
  options:
    b:
      en: |-
        Aggregation authorizations let an aggregator collect data from accounts outside an organization aggregator; they do not grant conformance pack deployment.
      fr: |-
        Les autorisations d'agrégation permettent à un agrégateur de collecter les données de comptes hors agrégateur d'organisation ; elles ne permettent pas de déployer des packs de conformité.
    c:
      en: |-
        StackSets would create account-level conformance packs, not the organization conformance packs that the requirement asks for.
      fr: |-
        StackSets créerait des packs de conformité au niveau des comptes, et non les packs de conformité d'organisation que demande l'exigence.
    d:
      en: |-
        Registering again for the same principal changes nothing, because conformance packs use a different service principal.
      fr: |-
        S'enregistrer de nouveau pour le même principal ne change rien, car les packs de conformité utilisent un autre principal de service.
references:
  - title: "Registering a Delegated Administrator for AWS Config - AWS Config"
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregated-register-delegated-administrator.html
