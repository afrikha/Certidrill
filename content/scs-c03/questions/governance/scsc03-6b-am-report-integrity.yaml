id: scsc03-6b-am-report-integrity
objective: "6.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has used AWS Audit Manager in its management account for three years and runs a PCI DSS assessment there. The audit owner generated an assessment report and delivered it to the external auditor through an Amazon S3 bucket. The auditor requires proof that neither the report nor the evidence it contains has been modified since Audit Manager generated it.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS Audit Manager dans son compte de gestion depuis trois ans et y mène une évaluation PCI DSS. Le responsable de l'audit a généré un rapport d'évaluation et l'a remis à l'auditeur externe via un compartiment Amazon S3. L'auditeur exige la preuve que ni le rapport ni les preuves qu'il contient n'ont été modifiés depuis sa génération par Audit Manager.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable S3 Object Lock in compliance mode on the bucket, and apply a retention period to the report objects before the auditor downloads them."
        fr: "Activer S3 Object Lock en mode conformité sur le compartiment, et appliquer une période de conservation aux objets du rapport avant que l'auditeur ne les télécharge."
    - id: b
      text:
        en: "Provide the digest.txt file that Audit Manager produced with the report, and validate the report with the ValidateAssessmentReportIntegrity API."
        fr: "Fournir le fichier digest.txt produit par Audit Manager avec le rapport, et valider le rapport avec l'API ValidateAssessmentReportIntegrity."
    - id: c
      text:
        en: "Turn on CloudTrail log file integrity validation for the organization trail and give the auditor the digest files."
        fr: "Activer la validation de l'intégrité des fichiers journaux sur le journal de suivi de l'organisation et remettre les fichiers de résumé à l'auditeur."
    - id: d
      text:
        en: "Generate the assessment report again from the same assessment, and let the auditor compare the two report archives."
        fr: "Générer de nouveau le rapport d'évaluation à partir de la même évaluation, et laisser l'auditeur comparer les deux archives de rapport."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When Audit Manager generates an assessment report, it produces a digest.txt checksum file with signatures and hashes that are invalidated if any part of the report archive changes. The ValidateAssessmentReportIntegrity API checks the report against this file, which proves that no evidence was modified after the report was created.
    fr: |-
      Lorsqu'Audit Manager génère un rapport d'évaluation, il produit un fichier de somme de contrôle digest.txt contenant des signatures et des hachages qui sont invalidés si une partie de l'archive du rapport change. L'API ValidateAssessmentReportIntegrity vérifie le rapport par rapport à ce fichier, ce qui prouve qu'aucune preuve n'a été modifiée après la création du rapport.
  options:
    a:
      en: |-
        Object Lock prevents future changes but cannot prove that the objects were not changed before the lock was applied.
      fr: |-
        Object Lock empêche les modifications futures mais ne peut pas prouver que les objets n'ont pas été modifiés avant l'application du verrou.
    c:
      en: |-
        CloudTrail integrity validation covers CloudTrail log files, not Audit Manager assessment reports.
      fr: |-
        La validation de l'intégrité CloudTrail couvre les fichiers journaux CloudTrail, pas les rapports d'évaluation d'Audit Manager.
    d:
      en: |-
        A new report reflects the evidence selected at that time, so a comparison proves nothing about the integrity of the first report.
      fr: |-
        Un nouveau rapport reflète les preuves sélectionnées à ce moment-là : une comparaison ne prouve rien sur l'intégrité du premier rapport.
references:
  - title: Assessment reports - AWS Audit Manager
    url: https://docs.aws.amazon.com/audit-manager/latest/userguide/assessment-reports.html
