id: scsc03-6b-fms-waf-first-last
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 60 accounts in AWS Organizations. Its workloads expose Application Load Balancers and Amazon API Gateway REST APIs in the eu-west-1 Region. AWS Firewall Manager is set up with the security account as the default administrator.

    The security team requires that the AWS managed Core rule set and Known bad inputs rule groups are evaluated before any application rule, and that a rate-based rule group is evaluated after all application rules. The protection must apply automatically to new accounts and new resources. Application teams must keep the ability to add and change their own rules.

    Which solution will meet these requirements?
  fr: |
    AnyCompany compte 60 comptes dans AWS Organizations. Ses charges de travail exposent des Application Load Balancers et des API REST Amazon API Gateway dans la Région eu-west-1. AWS Firewall Manager est configuré avec le compte de sécurité comme administrateur par défaut.

    L'équipe de sécurité exige que les groupes de règles gérés AWS Core rule set et Known bad inputs soient évalués avant toute règle applicative, et qu'un groupe de règles basées sur le débit soit évalué après toutes les règles applicatives. La protection doit s'appliquer automatiquement aux nouveaux comptes et aux nouvelles ressources. Les équipes applicatives doivent garder la possibilité d'ajouter et de modifier leurs propres règles.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use CloudFormation StackSets to deploy a web ACL with the three rule groups to every account, and let application teams associate it with their resources and add their rules."
        fr: "Utiliser CloudFormation StackSets pour déployer dans chaque compte une liste ACL web avec les trois groupes de règles, et laisser les équipes applicatives l'associer à leurs ressources et y ajouter leurs règles."
    - id: b
      text:
        en: "Create a Firewall Manager Shield Advanced policy in eu-west-1 for Application Load Balancers and API Gateway stages, scoped to all accounts, with auto remediation."
        fr: "Créer dans eu-west-1 une politique Firewall Manager Shield Advanced pour les Application Load Balancers et les étapes API Gateway, avec une étendue couvrant tous les comptes et la correction automatique."
    - id: c
      text:
        en: "Create a Firewall Manager AWS WAF policy in eu-west-1 with the managed rule groups as first rule groups and the rate-based rule group as a last rule group, with auto remediation."
        fr: "Créer dans eu-west-1 une politique Firewall Manager AWS WAF avec les groupes de règles gérés comme premiers groupes de règles et le groupe de règles basées sur le débit comme dernier groupe de règles, avec la correction automatique."
    - id: d
      text:
        en: "Create a Firewall Manager AWS WAF policy in eu-west-1 with all three rule groups as first rule groups, scoped to all accounts, with auto remediation."
        fr: "Créer dans eu-west-1 une politique Firewall Manager AWS WAF avec les trois groupes de règles comme premiers groupes de règles, avec une étendue couvrant tous les comptes et la correction automatique."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In a Firewall Manager AWS WAF policy, the administrator chooses rule groups that AWS WAF evaluates first and last in each managed web ACL, and account owners add their own rules and rule groups between them. With auto remediation and an organization-wide scope, Firewall Manager associates the web ACL with in-scope resources, including resources and accounts that appear later.
    fr: |-
      Dans une politique Firewall Manager AWS WAF, l'administrateur choisit les groupes de règles qu'AWS WAF évalue en premier et en dernier dans chaque liste ACL web gérée, et les propriétaires de comptes ajoutent leurs propres règles et groupes de règles entre les deux. Avec la correction automatique et une étendue couvrant l'organisation, Firewall Manager associe la liste ACL web aux ressources concernées, y compris les ressources et les comptes qui apparaissent plus tard.
  options:
    a:
      en: |-
        A web ACL deployed by stack sets is not enforced: teams could reorder or remove the baseline rule groups, and new resources are not associated automatically.
      fr: |-
        Une liste ACL web déployée par des StackSets n'est pas imposée : les équipes pourraient réordonner ou retirer les groupes de règles de base, et les nouvelles ressources ne sont pas associées automatiquement.
    b:
      en: |-
        A Shield Advanced policy manages Shield Advanced protections and associates an empty web ACL for monitoring; it does not deploy the AWS WAF rule groups.
      fr: |-
        Une politique Shield Advanced gère les protections Shield Advanced et associe une liste ACL web vide pour la surveillance ; elle ne déploie pas les groupes de règles AWS WAF.
    d:
      en: |-
        Rules that account owners add run after the first rule groups, so the rate-based rule group would be evaluated before the application rules instead of after them.
      fr: |-
        Les règles ajoutées par les propriétaires de comptes s'exécutent après les premiers groupes de règles : le groupe de règles basées sur le débit serait évalué avant les règles applicatives au lieu de l'être après.
references:
