id: scsc03-6a-pol-declarative-images-audit
objective: "6.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany wants EC2 instances in all accounts to use only AMIs owned by its golden image account 111122223333 or provided by Amazon. Before it blocks anything, the security team must find out which accounts discover or launch other AMIs. The team wants a single organization policy that it can later switch from evaluation to enforcement.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany veut que les instances EC2 de tous ses comptes n'utilisent que des AMI appartenant à son compte d'images de référence 111122223333 ou fournies par Amazon. Avant de bloquer quoi que ce soit, l'équipe de sécurité doit découvrir quels comptes recherchent ou lancent d'autres AMI. L'équipe veut une seule politique d'organisation qu'elle pourra ensuite faire passer de l'évaluation à l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP to the root that denies ec2:RunInstances unless the AMI owner is 111122223333 or amazon.
        fr: |-
          Attacher à la racine une SCP qui refuse ec2:RunInstances sauf si le propriétaire de l'AMI est 111122223333 ou amazon.
    - id: b
      text:
        en: |-
          Attach an EC2 declarative policy with `allowed_images_settings` state `enabled`, image providers 111122223333 and amazon, and an `exception_message`.
        fr: |-
          Attacher une politique déclarative EC2 avec `allowed_images_settings` à l'état `enabled`, les fournisseurs d'images 111122223333 et amazon, et un `exception_message`.
    - id: c
      text:
        en: |-
          Attach an EC2 declarative policy with `allowed_images_settings` state `audit_mode` and image providers 111122223333 and amazon.
        fr: |-
          Attacher une politique déclarative EC2 avec `allowed_images_settings` à l'état `audit_mode` et les fournisseurs d'images 111122223333 et amazon.
    - id: d
      text:
        en: |-
          Deploy an organization AWS Config rule that reports running instances that were launched from AMIs that are not on an approved list.
        fr: |-
          Déployer une règle AWS Config d'organisation qui signale les instances en cours d'exécution lancées à partir d'AMI absentes d'une liste approuvée.
answer:
  optionId: c
explanation:
  correct:
    en: |-
      Allowed AMIs is an attribute of EC2 declarative policies, with image criteria such as `allowed_image_providers` that accept account IDs and `amazon`. Its state `audit_mode` evaluates the criteria without blocking, and the same policy is later switched to `enabled` to enforce them.
    fr: |-
      Les AMI autorisées sont un attribut des politiques déclaratives EC2, avec des critères d'image comme `allowed_image_providers`, qui accepte des ID de compte et `amazon`. L'état `audit_mode` évalue les critères sans bloquer, et la même politique passe ensuite à `enabled` pour les appliquer.
  options:
    a:
      en: |-
        An SCP blocks launches immediately and has no evaluation mode, so the team could not observe usage first.
      fr: |-
        Une SCP bloque les lancements immédiatement et n'a pas de mode d'évaluation : l'équipe ne pourrait pas observer l'utilisation d'abord.
    b:
      en: |-
        State `enabled` enforces the criteria at once, which blocks other AMIs before the team has assessed their use.
      fr: |-
        L'état `enabled` applique immédiatement les critères, ce qui bloque les autres AMI avant que l'équipe n'ait évalué leur utilisation.
    d:
      en: |-
        A Config rule is not an organization policy and cannot later be switched to enforcement.
      fr: |-
        Une règle Config n'est pas une politique d'organisation et ne peut pas ensuite passer en mode d'application.
references:
  - title: "EC2 policy syntax and examples - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_declarative_syntax.html
