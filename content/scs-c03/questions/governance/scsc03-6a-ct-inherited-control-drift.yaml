id: scsc03-6a-ct-inherited-control-drift
objective: "6.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    In AnyCompany's AWS Control Tower landing zone, the Sandbox OU has a detective control that the Workloads OU does not use. An enrolled account was moved from the Sandbox OU to the Workloads OU. The account now shows inheritance drift because it still has the Sandbox detective control. The security team must remove the leftover control from this account without changing the controls of any other account.

    Which solution will meet these requirements?
  fr: |-
    Dans la zone d'atterrissage AWS Control Tower d'AnyCompany, l'OU Sandbox possède un contrôle détectif que l'OU Workloads n'utilise pas. Un compte inscrit a été déplacé de l'OU Sandbox vers l'OU Workloads. Le compte présente maintenant une dérive d'héritage, car il possède toujours le contrôle détectif de l'OU Sandbox. L'équipe de sécurité doit retirer ce contrôle résiduel de ce compte sans modifier les contrôles d'aucun autre compte.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          List the account's enabled controls, and call DisableControl with the EnabledControlIdentifier of the leftover control.
        fr: |-
          Lister les contrôles activés du compte, et appeler DisableControl avec l'EnabledControlIdentifier du contrôle résiduel.
    - id: b
      text:
        en: |-
          Re-register the Workloads OU so that Control Tower realigns the enabled controls of every account in the OU.
        fr: |-
          Réenregistrer l'OU Workloads afin que Control Tower réaligne les contrôles activés de chaque compte de l'OU.
    - id: c
      text:
        en: |-
          Call ResetEnabledControl for each control that is enabled on the Workloads OU to reapply the OU's control set.
        fr: |-
          Appeler ResetEnabledControl pour chaque contrôle activé sur l'OU Workloads afin de réappliquer l'ensemble de contrôles de l'OU.
    - id: d
      text:
        en: |-
          Disable the detective control on the Sandbox OU, and then enable it on the Sandbox OU again.
        fr: |-
          Désactiver le contrôle détectif sur l'OU Sandbox, puis l'activer de nouveau sur l'OU Sandbox.
answer:
  optionId: a
explanation:
  correct:
    en: |-
      When an account moves to another OU, it can keep detective or proactive controls of its previous OU. Updating the account, re-registering the OU or calling ResetEnabledControl does not fix this inheritance drift; the leftover control must be found for the account and disabled with DisableControl.
    fr: |-
      Lorsqu'un compte change d'OU, il peut conserver les contrôles détectifs ou proactifs de son ancienne OU. Mettre à jour le compte, réenregistrer l'OU ou appeler ResetEnabledControl ne corrige pas cette dérive d'héritage : il faut trouver le contrôle résiduel du compte et le désactiver avec DisableControl.
  options:
    b:
      en: |-
        AWS documents that re-registering the OU does not remove a detective control inherited from the previous OU.
      fr: |-
        AWS documente que réenregistrer l'OU ne retire pas un contrôle détectif hérité de l'ancienne OU.
    c:
      en: |-
        ResetEnabledControl repairs controls enabled on the target; it does not remove a control left over from another OU.
      fr: |-
        ResetEnabledControl répare les contrôles activés sur la cible ; il ne retire pas un contrôle résiduel provenant d'une autre OU.
    d:
      en: |-
        Toggling the control on the Sandbox OU affects every account in that OU and does not target the moved account.
      fr: |-
        Basculer le contrôle sur l'OU Sandbox affecte tous les comptes de cette OU et ne cible pas le compte déplacé.
references:
  - title: "Types of governance drift - AWS Control Tower"
    url: https://docs.aws.amazon.com/controltower/latest/userguide/governance-drift.html
