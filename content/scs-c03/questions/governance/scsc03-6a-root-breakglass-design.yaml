id: scsc03-6a-root-breakglass-design
objective: "6.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany has removed the root credentials of all member accounts. Only the management account root user remains, for break-glass use. The security team must ensure that break-glass sign-in still works if one MFA device is lost or destroyed, and that every use of the root user alerts the team within minutes.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |-
    AnyCompany a supprimé les informations racine de tous ses comptes membres. Seul l'utilisateur racine du compte de gestion subsiste, pour un usage d'urgence (break-glass). L'équipe de sécurité doit garantir que la connexion d'urgence fonctionne encore si un dispositif MFA est perdu ou détruit, et que chaque utilisation de l'utilisateur racine l'alerte en quelques minutes.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Register two or more FIDO security keys as MFA devices for the root user, and store them in separate secure locations.
        fr: |-
          Enregistrer deux clés de sécurité FIDO ou plus comme dispositifs MFA de l'utilisateur racine, et les conserver dans des emplacements sécurisés distincts.
    - id: b
      text:
        en: |-
          Create access keys for the root user, and store them in an offline safe for scripted break-glass procedures.
        fr: |-
          Créer des clés d'accès pour l'utilisateur racine, et les conserver dans un coffre hors ligne pour des procédures d'urgence scriptées.
    - id: c
      text:
        en: |-
          Create Amazon EventBridge rules that match AWS CloudTrail events whose userIdentity type is Root and that notify an Amazon SNS topic.
        fr: |-
          Créer des règles Amazon EventBridge qui correspondent aux événements AWS CloudTrail dont le type userIdentity est Root et qui notifient une rubrique Amazon SNS.
    - id: d
      text:
        en: |-
          Remove MFA from the root user so that losing a device can never prevent break-glass sign-in.
        fr: |-
          Retirer la MFA de l'utilisateur racine afin que la perte d'un dispositif ne puisse jamais empêcher une connexion d'urgence.
    - id: e
      text:
        en: |-
          Set the root email address to the personal mailbox of the security lead so that recovery messages reach a known person.
        fr: |-
          Définir l'adresse e-mail racine sur la boîte personnelle du responsable sécurité afin que les messages de récupération parviennent à une personne connue.
answer:
  optionIds: [a, c]
explanation:
  correct:
    en: |-
      The root user can have up to eight MFA devices, and AWS recommends registering several, preferably phishing-resistant FIDO keys, so that losing one does not lock the account. AWS also recommends alerting on all root sign-in and usage, for example with an EventBridge rule on root activity in CloudTrail that notifies an SNS topic.
    fr: |-
      L'utilisateur racine peut avoir jusqu'à huit dispositifs MFA, et AWS recommande d'en enregistrer plusieurs, de préférence des clés FIDO résistantes à l'hameçonnage, pour que la perte de l'un d'eux ne verrouille pas le compte. AWS recommande aussi d'alerter sur toute connexion et toute utilisation racine, par exemple avec une règle EventBridge sur l'activité racine dans CloudTrail qui notifie une rubrique SNS.
  options:
    b:
      en: |-
        AWS recommends never creating root access keys; long-term root keys increase the risk of the most privileged credentials.
      fr: |-
        AWS recommande de ne jamais créer de clés d'accès racine ; des clés racine à long terme augmentent le risque lié aux informations d'identification les plus privilégiées.
    d:
      en: |-
        MFA is required for the root user of every account type, including the management account.
      fr: |-
        La MFA est obligatoire pour l'utilisateur racine de tous les types de comptes, y compris le compte de gestion.
    e:
      en: |-
        AWS recommends a group email address managed by the business and forwarded to several people, not a personal mailbox.
      fr: |-
        AWS recommande une adresse e-mail de groupe gérée par l'entreprise et transférée à plusieurs personnes, et non une boîte personnelle.
references:
  - title: "Root user best practices for your AWS account - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
  - title: "Multi-factor authentication for AWS account root user - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/enable-mfa-for-root.html
