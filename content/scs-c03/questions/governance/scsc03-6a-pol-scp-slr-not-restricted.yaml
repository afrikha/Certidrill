id: scsc03-6a-pol-scp-slr-not-restricted
objective: "6.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany attached an SCP to its organization root that denies all actions outside eu-west-1 and eu-central-1, except for actions of global services. During a review, the security team finds AWS CloudTrail events in member accounts that show an AWS service calling APIs in us-east-1 through its service-linked role. No other principal could call APIs in that Region. The team lead asks whether the SCP is misconfigured.

    Which explanation is correct?
  fr: |-
    AnyCompany a attaché à la racine de son organisation une SCP qui refuse toutes les actions en dehors d'eu-west-1 et d'eu-central-1, à l'exception des actions des services mondiaux. Lors d'une revue, l'équipe de sécurité trouve dans les comptes membres des événements AWS CloudTrail qui montrent un service AWS appelant des API dans us-east-1 au moyen de son rôle lié à un service. Aucun autre principal n'a pu appeler d'API dans cette Région. Le responsable de l'équipe demande si la SCP est mal configurée.

    Quelle explication est correcte ?
body:
  options:
    - id: a
      text:
        en: |-
          The SCP is attached to the root, and policies that are attached to the root apply only to the management account.
        fr: |-
          La SCP est attachée à la racine, et les politiques attachées à la racine ne s'appliquent qu'au compte de gestion.
    - id: b
      text:
        en: |-
          The RCPFullAWSAccess policy allows AWS services to act in every Region, which overrides the SCP's deny.
        fr: |-
          La politique RCPFullAWSAccess autorise les services AWS à agir dans toutes les Régions, ce qui l'emporte sur le refus de la SCP.
    - id: c
      text:
        en: |-
          SCPs do not affect service-linked roles, so actions that use a service-linked role's permissions are not restricted by the SCP.
        fr: |-
          Les SCP n'affectent pas les rôles liés à un service : les actions qui utilisent les autorisations d'un rôle lié à un service ne sont pas limitées par la SCP.
    - id: d
      text:
        en: |-
          The service-linked roles belong to the management account, so the SCP does not evaluate their calls.
        fr: |-
          Les rôles liés à un service appartiennent au compte de gestion : la SCP n'évalue donc pas leurs appels.
answer:
  optionId: c
explanation:
  correct:
    en: |-
      SCPs never restrict service-linked roles: actions performed with the permissions of a service-linked role are outside their scope. The SCP is working as designed for the other principals, which is why no other principal could call APIs in us-east-1.
    fr: |-
      Les SCP ne limitent jamais les rôles liés à un service : les actions effectuées avec les autorisations d'un rôle lié à un service sont hors de leur portée. La SCP fonctionne comme prévu pour les autres principaux, ce qui explique qu'aucun autre principal n'ait pu appeler d'API dans us-east-1.
  options:
    a:
      en: |-
        A root attachment applies to every member account; it is the management account that SCPs never affect.
      fr: |-
        Un attachement à la racine s'applique à tous les comptes membres ; c'est le compte de gestion que les SCP n'affectent jamais.
    b:
      en: |-
        RCPs never grant permissions and cannot override an SCP deny; effective permissions are the intersection of all the policies.
      fr: |-
        Les RCP n'accordent jamais d'autorisations et ne peuvent pas l'emporter sur un refus de SCP ; les autorisations effectives sont l'intersection de toutes les politiques.
    d:
      en: |-
        The events are in member accounts, and each service-linked role exists in the account where the service acts.
      fr: |-
        Les événements se trouvent dans les comptes membres, et chaque rôle lié à un service existe dans le compte où le service agit.
references:
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
