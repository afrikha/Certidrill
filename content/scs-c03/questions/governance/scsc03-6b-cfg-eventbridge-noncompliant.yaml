id: scsc03-6b-cfg-eventbridge-noncompliant
objective: "6.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's on-call security engineers are subscribed to the Amazon SNS topic of the AWS Config delivery channel in a production account. They receive thousands of messages a day about configuration item changes and snapshots, and they missed an alert about a disabled CloudTrail trail. The team wants to be notified only when a resource becomes NON_COMPLIANT with the cloudtrail-enabled or iam-root-access-key-check rules.

    Which solution will meet these requirements?
  fr: |
    Les ingénieurs de sécurité d'astreinte d'AnyCompany sont abonnés à la rubrique Amazon SNS du canal de diffusion AWS Config d'un compte de production. Ils reçoivent des milliers de messages par jour sur les modifications d'éléments de configuration et les instantanés, et ils ont manqué une alerte sur un journal de suivi CloudTrail désactivé. L'équipe veut être notifiée uniquement lorsqu'une ressource devient NON_COMPLIANT avec les règles cloudtrail-enabled ou iam-root-access-key-check.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an EventBridge rule that matches Config Rules Compliance Change events for the two rules with a new compliance type of NON_COMPLIANT, and target an SNS topic."
        fr: "Créer une règle EventBridge qui correspond aux événements Config Rules Compliance Change des deux règles avec un nouveau type de conformité NON_COMPLIANT, et cibler une rubrique SNS."
    - id: b
      text:
        en: "Change the delivery frequency of configuration snapshots to 24 hours so that the delivery channel's SNS topic sends fewer messages to the engineers."
        fr: "Passer la fréquence de diffusion des instantanés de configuration à 24 heures pour que la rubrique SNS du canal de diffusion envoie moins de messages aux ingénieurs."
    - id: c
      text:
        en: "Create a CloudWatch alarm on the AWS Config ConfigurationItemsRecorded metric of the account, and notify the SNS topic when the metric rises above its baseline."
        fr: "Créer une alarme CloudWatch sur la métrique AWS Config ConfigurationItemsRecorded du compte, et notifier la rubrique SNS lorsque la métrique dépasse sa valeur de référence."
    - id: d
      text:
        en: "Create an AWS Config aggregator in the security account, and configure it to publish compliance changes of the two rules to a new SNS topic for the engineers."
        fr: "Créer un agrégateur AWS Config dans le compte de sécurité, et le configurer pour publier les changements de conformité des deux règles sur une nouvelle rubrique SNS destinée aux ingénieurs."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS Config sends compliance changes to Amazon EventBridge as Config Rules Compliance Change events, with a ComplianceChangeNotification message type. An event pattern that matches the rule names and newEvaluationResult.complianceType NON_COMPLIANT forwards only those events to the SNS topic.
    fr: |-
      AWS Config envoie les changements de conformité à Amazon EventBridge sous forme d'événements Config Rules Compliance Change, avec le type de message ComplianceChangeNotification. Un modèle d'événement qui correspond aux noms des règles et à newEvaluationResult.complianceType NON_COMPLIANT ne transmet que ces événements à la rubrique SNS.
  options:
    b:
      en: |-
        The delivery channel topic would still carry every configuration item change and other message types; snapshot frequency does not filter compliance alerts.
      fr: |-
        La rubrique du canal de diffusion transporterait toujours chaque modification d'élément de configuration et les autres types de messages ; la fréquence des instantanés ne filtre pas les alertes de conformité.
    c:
      en: |-
        This metric counts recorded configuration items; it says nothing about which resources became noncompliant with which rule.
      fr: |-
        Cette métrique compte les éléments de configuration enregistrés ; elle n'indique pas quelles ressources sont devenues non conformes à quelle règle.
    d:
      en: |-
        Aggregators provide a read-only, consolidated view; they do not send notifications.
      fr: |-
        Les agrégateurs fournissent une vue consolidée en lecture seule ; ils n'envoient pas de notifications.
references:
  - title: Monitoring AWS Config with Amazon EventBridge - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/monitor-config-with-cloudwatchevents.html
