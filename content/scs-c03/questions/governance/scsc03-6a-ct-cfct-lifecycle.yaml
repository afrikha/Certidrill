id: scsc03-6a-ct-cfct-lifecycle
objective: "6.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany uses AWS Control Tower. Every account in the Workloads OU, including accounts that Account Factory creates later, must receive a custom RCP that restricts Amazon S3 access to principals of the organization. Each account must also receive an AWS CloudFormation stack that creates an IAM role for incident responders. The company wants an AWS solution that is integrated with Control Tower lifecycle events.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany utilise AWS Control Tower. Chaque compte de l'OU Workloads, y compris les comptes qu'Account Factory créera ultérieurement, doit recevoir une RCP personnalisée qui limite l'accès à Amazon S3 aux principaux de l'organisation. Chaque compte doit aussi recevoir une pile AWS CloudFormation qui crée un rôle IAM pour les intervenants en cas d'incident. L'entreprise veut une solution AWS intégrée aux événements du cycle de vie de Control Tower.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy Customizations for AWS Control Tower (CfCT), and declare the RCP and the role template with the Workloads OU as their target.
        fr: |-
          Déployer Customizations for AWS Control Tower (CfCT), et déclarer la RCP et le modèle du rôle avec l'OU Workloads comme cible.
    - id: b
      text:
        en: |-
          Create an Account Factory customization blueprint that contains the RCP and the role template, and apply it to new accounts.
        fr: |-
          Créer un blueprint de personnalisation Account Factory qui contient la RCP et le modèle du rôle, et l'appliquer aux nouveaux comptes.
    - id: c
      text:
        en: |-
          Create a service-managed StackSet with automatic deployment whose template contains the RCP as an AWS::Organizations::Policy resource and the role.
        fr: |-
          Créer un StackSet géré par le service avec déploiement automatique dont le modèle contient la RCP sous forme de ressource AWS::Organizations::Policy et le rôle.
    - id: d
      text:
        en: |-
          Create an EventBridge rule for account creation events that invokes a custom AWS Lambda function that attaches the RCP and creates the stack.
        fr: |-
          Créer une règle EventBridge pour les événements de création de compte qui appelle une fonction AWS Lambda personnalisée qui attache la RCP et crée la pile.
answer:
  optionId: a
explanation:
  correct:
    en: |-
      CfCT customizes a Control Tower landing zone with CloudFormation templates, SCPs and RCPs, deployed to OUs or accounts. It is integrated with Control Tower lifecycle events, so the resources are deployed automatically to accounts that Account Factory creates, and existing accounts of the targeted OU receive them too.
    fr: |-
      CfCT personnalise une zone d'atterrissage Control Tower avec des modèles CloudFormation, des SCP et des RCP, déployés sur des OU ou des comptes. Il est intégré aux événements du cycle de vie de Control Tower : les ressources sont déployées automatiquement dans les comptes qu'Account Factory crée, et les comptes existants de l'OU ciblée les reçoivent aussi.
  options:
    b:
      en: |-
        An Account Factory blueprint deploys a CloudFormation template into the account at provisioning; an RCP is an organization policy that a member account template cannot attach.
      fr: |-
        Un blueprint Account Factory déploie un modèle CloudFormation dans le compte au provisionnement ; une RCP est une politique d'organisation qu'un modèle de compte membre ne peut pas attacher.
    c:
      en: |-
        StackSet instances run in member accounts, where organization policies cannot be created or attached.
      fr: |-
        Les instances d'un StackSet s'exécutent dans les comptes membres, où les politiques d'organisation ne peuvent être ni créées ni attachées.
    d:
      en: |-
        A custom Lambda function can work but is code the company must build and maintain, and it does not use the AWS solution that the company asks for.
      fr: |-
        Une fonction Lambda personnalisée peut fonctionner, mais c'est du code que l'entreprise doit développer et maintenir, et elle n'utilise pas la solution AWS demandée.
references:
  - title: "Customizations for AWS Control Tower (CfCT) overview - AWS Control Tower"
    url: https://docs.aws.amazon.com/controltower/latest/userguide/cfct-overview.html
