id: scsc03-6b-cspm-disable-control
objective: "6.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany manages AWS Security Hub CSPM from a delegated administrator account with a configuration policy that is associated with the organization's root and enables the AWS Foundational Security Best Practices standard. The company uses a third-party data loss prevention product and has an approved exception to the control that checks whether Amazon Macie is enabled. The security team wants this control to stop running checks and producing findings in every account and Region, without affecting the other controls of the standard.

    Which solution will meet these requirements?
  fr: |
    AnyCompany gère AWS Security Hub CSPM depuis un compte d'administrateur délégué avec une politique de configuration associée à la racine de l'organisation, qui active la norme AWS Foundational Security Best Practices. L'entreprise utilise un produit tiers de prévention des pertes de données et dispose d'une exception approuvée pour le contrôle qui vérifie si Amazon Macie est activé. L'équipe de sécurité veut que ce contrôle cesse d'effectuer des vérifications et de produire des résultats dans chaque compte et chaque Région, sans affecter les autres contrôles de la norme.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a Security Hub CSPM automation rule that sets the workflow status of the control's findings to SUPPRESSED."
        fr: "Créer une règle d'automatisation Security Hub CSPM qui définit l'état du flux de travail des résultats du contrôle sur SUPPRESSED."
    - id: b
      text:
        en: "Disable the AWS Foundational Security Best Practices standard in the configuration policy."
        fr: "Désactiver la norme AWS Foundational Security Best Practices dans la politique de configuration."
    - id: c
      text:
        en: "Disable the control in the configuration policy that is associated with the organization's root."
        fr: "Désactiver le contrôle dans la politique de configuration associée à la racine de l'organisation."
    - id: d
      text:
        en: "Delete the AWS Config rule that Security Hub CSPM created for the control in each account and Region."
        fr: "Supprimer dans chaque compte et chaque Région la règle AWS Config créée par Security Hub CSPM pour le contrôle."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Disabling a control stops its security checks and the generation of new findings, archives its existing findings, and removes the Config rules that Security Hub CSPM created for it. Doing it in the configuration policy applies the change to every account and Region that the policy governs, and the other controls keep running.
    fr: |-
      Désactiver un contrôle arrête ses vérifications de sécurité et la génération de nouveaux résultats, archive ses résultats existants et supprime les règles Config que Security Hub CSPM avait créées pour lui. Le faire dans la politique de configuration applique la modification à chaque compte et chaque Région régis par la politique, et les autres contrôles continuent de s'exécuter.
  options:
    a:
      en: |-
        Suppressing findings hides them from the default views, but the control keeps running checks and producing findings.
      fr: |-
        Supprimer (suppress) les résultats les masque des vues par défaut, mais le contrôle continue d'effectuer des vérifications et de produire des résultats.
    b:
      en: |-
        Disabling the standard stops all of its controls, not only the excepted one.
      fr: |-
        Désactiver la norme arrête tous ses contrôles, pas seulement celui qui fait l'objet de l'exception.
    d:
      en: |-
        These are service-linked rules managed by Security Hub CSPM; account users cannot delete them, and the control would remain enabled.
      fr: |-
        Ce sont des règles liées à un service gérées par Security Hub CSPM ; les utilisateurs des comptes ne peuvent pas les supprimer, et le contrôle resterait activé.
references:
  - title: Disabling controls in Security Hub CSPM - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/disable-controls-overview.html
