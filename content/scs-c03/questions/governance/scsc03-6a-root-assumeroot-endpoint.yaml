id: scsc03-6a-root-assumeroot-endpoint
objective: "6.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany has centralized root access, and the security tooling account is the IAM delegated administrator. An Amazon SQS queue policy in member account 444455556666 denies all principals. An engineer in the security tooling account uses an IAM role whose policy explicitly allows sts:AssumeRole and sts:AssumeRoot, and runs the following command, which fails.

    ```bash
    aws sts assume-root \
      --endpoint-url https://sts.amazonaws.com \
      --target-principal 444455556666 \
      --task-policy-arn arn=arn:aws:iam::aws:policy/root-task/SQSUnlockQueuePolicy \
      --duration-seconds 900
    ```

    What should the engineer change so that the command succeeds?
  fr: |-
    AnyCompany a centralisé l'accès racine, et le compte d'outillage de sécurité est l'administrateur délégué IAM. Une politique de file d'attente Amazon SQS du compte membre 444455556666 refuse tous les principaux. Un ingénieur du compte d'outillage de sécurité utilise un rôle IAM dont la politique autorise explicitement sts:AssumeRole et sts:AssumeRoot, et exécute la commande suivante, qui échoue.

    ```bash
    aws sts assume-root \
      --endpoint-url https://sts.amazonaws.com \
      --target-principal 444455556666 \
      --task-policy-arn arn=arn:aws:iam::aws:policy/root-task/SQSUnlockQueuePolicy \
      --duration-seconds 900
    ```

    Que doit modifier l'ingénieur pour que la commande réussisse ?
body:
  options:
    - id: a
      text:
        en: |-
          Send the request to a Regional AWS STS endpoint, such as https://sts.eu-west-1.amazonaws.com.
        fr: |-
          Envoyer la requête à un point de terminaison AWS STS régional, par exemple https://sts.eu-west-1.amazonaws.com.
    - id: b
      text:
        en: |-
          Run the command with credentials of the root user of the management account.
        fr: |-
          Exécuter la commande avec les informations d'identification de l'utilisateur racine du compte de gestion.
    - id: c
      text:
        en: |-
          Run the command from an IAM role in member account 444455556666.
        fr: |-
          Exécuter la commande depuis un rôle IAM du compte membre 444455556666.
    - id: d
      text:
        en: |-
          Replace the task policy with IAMCreateRootUserPassword, and sign in as the root user to edit the queue policy.
        fr: |-
          Remplacer la politique de tâche par IAMCreateRootUserPassword, et se connecter en tant qu'utilisateur racine pour modifier la politique de file d'attente.
answer:
  optionId: a
explanation:
  correct:
    en: |-
      AssumeRoot is not supported on the global STS endpoint, so the request must go to a Regional STS endpoint. The rest of the command is valid: it targets the member account, uses the SQSUnlockQueuePolicy task policy, and runs from the delegated administrator with sts:AssumeRoot explicitly allowed.
    fr: |-
      AssumeRoot n'est pas pris en charge sur le point de terminaison STS mondial : la requête doit être envoyée à un point de terminaison STS régional. Le reste de la commande est valide : elle cible le compte membre, utilise la politique de tâche SQSUnlockQueuePolicy et s'exécute depuis l'administrateur délégué avec sts:AssumeRoot explicitement autorisé.
  options:
    b:
      en: |-
        Root user credentials cannot be used to call sts:AssumeRoot; the call must come from an IAM user or role.
      fr: |-
        Les informations d'identification de l'utilisateur racine ne peuvent pas servir à appeler sts:AssumeRoot ; l'appel doit provenir d'un utilisateur ou d'un rôle IAM.
    c:
      en: |-
        Privileged root sessions are started from the management account or the IAM delegated administrator, not from the target account.
      fr: |-
        Les sessions racine privilégiées sont démarrées depuis le compte de gestion ou l'administrateur délégué IAM, et non depuis le compte cible.
    d:
      en: |-
        Recreating a root password adds root exposure that the SQSUnlockQueuePolicy task avoids, and it does not fix the failing request.
      fr: |-
        Recréer un mot de passe racine ajoute une exposition racine que la tâche SQSUnlockQueuePolicy évite, et cela ne corrige pas la requête qui échoue.
references:
  - title: "Perform a privileged task on an AWS Organizations member account - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user-privileged-task.html
