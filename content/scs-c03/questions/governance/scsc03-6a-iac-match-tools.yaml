id: scsc03-6a-iac-match-tools
objective: "6.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany's platform team is defining where each AWS CloudFormation safeguard runs in its deployment process.

    Match each requirement to the tool or feature that meets it.

    To answer, drag the appropriate tool or feature to each requirement. Each tool or feature may be used once or not at all.
  fr: |-
    L'équipe plateforme d'AnyCompany définit à quel endroit de son processus de déploiement s'exécute chaque protection AWS CloudFormation.

    Associez chaque exigence à l'outil ou à la fonctionnalité qui y répond.

    Pour répondre, faites glisser l'outil ou la fonctionnalité approprié vers chaque exigence. Chaque outil ou fonctionnalité peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - id: lint
      text:
        en: |-
          cfn-lint
        fr: |-
          cfn-lint
    - id: guard
      text:
        en: |-
          cfn-guard validate
        fr: |-
          cfn-guard validate
    - id: hook
      text:
        en: |-
          Guard Hook with FailureMode FAIL
        fr: |-
          Guard Hook avec FailureMode FAIL
    - id: drift
      text:
        en: |-
          StackSet drift detection
        fr: |-
          Détection de dérive des StackSets
    - id: policy
      text:
        en: |-
          Stack policy
        fr: |-
          Politique de pile (stack policy)
    - id: cs
      text:
        en: |-
          Change set
        fr: |-
          Jeu de modifications (change set)
  targets:
    - id: t1
      text:
        en: |-
          Flag, in the developer's editor, property values that the resource provider schema does not allow
        fr: |-
          Signaler, dans l'éditeur du développeur, les valeurs de propriétés que le schéma du fournisseur de ressources n'autorise pas
    - id: t2
      text:
        en: |-
          Check templates in CI against company rules written in a policy-as-code DSL before deployment
        fr: |-
          Vérifier les modèles en CI par rapport à des règles de l'entreprise écrites dans un DSL de politique en tant que code, avant le déploiement
    - id: t3
      text:
        en: |-
          Block, on the service side, a stack operation that would create a noncompliant resource
        fr: |-
          Bloquer, côté service, une opération de pile qui créerait une ressource non conforme
    - id: t4
      text:
        en: |-
          Find security group rules that were changed manually in any account after deployment
        fr: |-
          Trouver les règles de groupe de sécurité modifiées manuellement dans un compte après le déploiement
    - id: t5
      text:
        en: |-
          Prevent a stack update from replacing the production database
        fr: |-
          Empêcher une mise à jour de pile de remplacer la base de données de production
answer:
  mapping:
    t1: lint
    t2: guard
    t3: hook
    t4: drift
    t5: policy
explanation:
  correct:
    en: |-
      cfn-lint validates templates against the resource provider schemas, while Guard evaluates JSON or YAML data against policy-as-code rules but has no server-side enforcement. A Guard Hook in FAIL mode enforces Guard rules before provisioning, StackSet drift detection reports unmanaged changes in stack instances, and a stack policy can deny Update:Replace on a resource.
    fr: |-
      cfn-lint valide les modèles par rapport aux schémas des fournisseurs de ressources, tandis que Guard évalue des données JSON ou YAML par rapport à des règles de politique en tant que code, sans application côté serveur. Un Guard Hook en mode FAIL applique les règles Guard avant le provisionnement, la détection de dérive des StackSets signale les modifications non gérées des instances de pile, et une politique de pile peut refuser Update:Replace sur une ressource.
  options:
    cs:
      en: |-
        A change set previews the changes of an update, including replacements, but it does not prevent them or check company rules by itself.
      fr: |-
        Un jeu de modifications prévisualise les changements d'une mise à jour, y compris les remplacements, mais il ne les empêche pas et ne vérifie pas à lui seul les règles de l'entreprise.
references:
  - title: "What is AWS CloudFormation Guard? - AWS CloudFormation Guard"
    url: https://docs.aws.amazon.com/cfn-guard/latest/ug/what-is-guard.html
  - title: "Prevent updates to stack resources - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/protect-stack-resources.html
