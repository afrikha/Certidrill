id: scsc03-6a-org-ou-attach-scp
objective: "6.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany has 60 member accounts in AWS Organizations with all features enabled. Forty of the accounts run production workloads, and the company creates new production accounts every month. The security team wrote an SCP that denies ec2:DeleteFlowLogs. The SCP must apply to every current and future production account and to no other account, with the LEAST ongoing effort.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany dispose de 60 comptes membres dans AWS Organizations, avec toutes les fonctionnalités activées. Quarante de ces comptes exécutent des charges de travail de production, et l'entreprise crée de nouveaux comptes de production chaque mois. L'équipe de sécurité a rédigé une SCP qui refuse ec2:DeleteFlowLogs. La SCP doit s'appliquer à tous les comptes de production actuels et futurs, et à aucun autre compte, avec le MOINS d'effort récurrent.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach the SCP directly to each production account, and add a step to the account creation runbook that attaches the SCP to every new production account.
        fr: |-
          Attacher la SCP directement à chaque compte de production, et ajouter au runbook de création de comptes une étape qui attache la SCP à chaque nouveau compte de production.
    - id: b
      text:
        en: |-
          Attach the SCP to the organization root so that it applies to every account in the organization, including accounts that are created later.
        fr: |-
          Attacher la SCP à la racine de l'organisation afin qu'elle s'applique à tous les comptes de l'organisation, y compris les comptes créés ultérieurement.
    - id: c
      text:
        en: |-
          Create a Production OU, move the production accounts into it, attach the SCP to the OU, and create new production accounts in that OU.
        fr: |-
          Créer une OU Production, y déplacer les comptes de production, attacher la SCP à l'OU, et créer les nouveaux comptes de production dans cette OU.
    - id: d
      text:
        en: |-
          Add the deny statement to an IAM permissions boundary, and require that every IAM role in the production accounts uses the boundary.
        fr: |-
          Ajouter l'instruction de refus à une limite d'autorisations IAM, et exiger que chaque rôle IAM des comptes de production utilise cette limite.
answer:
  optionId: c
explanation:
  correct:
    en: |-
      An SCP attached to an OU applies to every account in the OU, including accounts that are created in it or moved into it later. Grouping the production accounts in one OU therefore applies the guardrail once, to exactly the accounts that need it, with no per-account step.
    fr: |-
      Une SCP attachée à une OU s'applique à tous les comptes de l'OU, y compris les comptes qui y sont créés ou déplacés ultérieurement. Regrouper les comptes de production dans une OU applique donc la protection une seule fois, exactement aux comptes concernés, sans étape par compte.
  options:
    a:
      en: |-
        Direct attachments work, but every new account needs a manual step that can be forgotten, which is more ongoing effort than an OU attachment.
      fr: |-
        Les attachements directs fonctionnent, mais chaque nouveau compte exige une étape manuelle qui peut être oubliée, ce qui représente plus d'effort récurrent qu'un attachement à une OU.
    b:
      en: |-
        A root attachment also applies the SCP to the non-production accounts, which the requirement excludes.
      fr: |-
        Un attachement à la racine applique aussi la SCP aux comptes hors production, ce que l'exigence exclut.
    d:
      en: |-
        Account administrators can create roles without the boundary or change it, and the boundary must be enforced role by role in every account.
      fr: |-
        Les administrateurs des comptes peuvent créer des rôles sans la limite ou la modifier, et la limite doit être imposée rôle par rôle dans chaque compte.
references:
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
