id: scsc03-6a-root-mgmt-multi-person
objective: "6.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany keeps the root user credentials of its management account for break-glass use only. Security policy states that no single employee may be able to sign in as that root user alone.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany conserve les informations d'identification de l'utilisateur racine de son compte de gestion uniquement pour un usage d'urgence (break-glass). La politique de sécurité stipule qu'aucun employé ne doit pouvoir se connecter seul en tant que cet utilisateur racine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Give the root password and the MFA security key to the chief information security officer, who must approve every use.
        fr: |-
          Confier le mot de passe racine et la clé de sécurité MFA au responsable de la sécurité des systèmes d'information, qui doit approuver chaque usage.
    - id: b
      text:
        en: |-
          Give one group access to the root password and a separate group access to the MFA device, so that one member of each is needed to sign in.
        fr: |-
          Donner à un groupe l'accès au mot de passe racine et à un groupe distinct l'accès au dispositif MFA, de sorte qu'un membre de chaque groupe soit nécessaire pour se connecter.
    - id: c
      text:
        en: |-
          Store the root password and the virtual MFA seed in AWS Secrets Manager in the management account, encrypted with a customer managed key.
        fr: |-
          Stocker le mot de passe racine et la graine MFA virtuelle dans AWS Secrets Manager dans le compte de gestion, chiffrés avec une clé gérée par le client.
    - id: d
      text:
        en: |-
          Create root access keys, split the secret access key into two halves, and give each half to a different employee.
        fr: |-
          Créer des clés d'accès racine, diviser la clé d'accès secrète en deux moitiés, et confier chaque moitié à un employé différent.
answer:
  optionId: b
explanation:
  correct:
    en: |-
      AWS recommends multi-person approval for root sign-in: one group holds the root password, a different group holds the MFA device, and a member of each must come together to sign in. No single person can then use the root user alone.
    fr: |-
      AWS recommande une approbation par plusieurs personnes pour la connexion racine : un groupe détient le mot de passe racine, un autre groupe détient le dispositif MFA, et un membre de chacun doit être présent pour se connecter. Aucune personne seule ne peut alors utiliser l'utilisateur racine.
  options:
    a:
      en: |-
        One person holding both the password and the MFA device can sign in alone, whatever approval process exists.
      fr: |-
        Une personne qui détient à la fois le mot de passe et le dispositif MFA peut se connecter seule, quel que soit le processus d'approbation.
    c:
      en: |-
        AWS advises against storing root credentials in a tool that depends on the same account, and one principal with access could read both.
      fr: |-
        AWS déconseille de stocker les informations racine dans un outil qui dépend du même compte, et un seul principal autorisé pourrait lire les deux.
    d:
      en: |-
        AWS recommends not creating root access keys at all, and access keys do not provide console sign-in.
      fr: |-
        AWS recommande de ne pas créer du tout de clés d'accès racine, et des clés d'accès ne permettent pas la connexion à la console.
references:
  - title: "Root user best practices for your AWS account - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
