id: scsc03-6b-cfg-remediation-trust
objective: "6.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany configured automatic remediation on the s3-bucket-public-read-prohibited rule in account 111122223333. The remediation runs the AWS-DisableS3BucketPublicReadWrite runbook and passes the AutomationAssumeRole parameter arn:aws:iam::111122223333:role/ConfigS3Remediation. The rule marks public buckets as NON_COMPLIANT, but they stay public. DescribeRemediationExecutionStatus shows FAILED executions with an error stating that the role cannot be assumed.

    The role's permissions policy allows the S3 actions that the runbook calls. Its trust policy allows the service principal config.amazonaws.com to call sts:AssumeRole.

    Which change will fix the remediation?
  fr: |
    AnyCompany a configuré une correction automatique sur la règle s3-bucket-public-read-prohibited dans le compte 111122223333. La correction exécute le runbook AWS-DisableS3BucketPublicReadWrite et transmet le paramètre AutomationAssumeRole arn:aws:iam::111122223333:role/ConfigS3Remediation. La règle marque les compartiments publics comme NON_COMPLIANT, mais ils restent publics. DescribeRemediationExecutionStatus affiche des exécutions FAILED avec une erreur indiquant que le rôle ne peut pas être assumé.

    La politique d'autorisations du rôle autorise les actions S3 appelées par le runbook. Sa politique d'approbation autorise le principal de service config.amazonaws.com à appeler sts:AssumeRole.

    Quelle modification corrige la correction automatique ?
body:
  options:
    - id: a
      text:
        en: "Raise MaximumAutomaticAttempts to 25 and RetryAttemptSeconds to 600 so that the remediation retries until the role can be assumed."
        fr: "Porter MaximumAutomaticAttempts à 25 et RetryAttemptSeconds à 600 pour que la correction réessaie jusqu'à ce que le rôle puisse être assumé."
    - id: b
      text:
        en: "Change the trust policy of ConfigS3Remediation to allow ssm.amazonaws.com, with aws:SourceAccount and aws:SourceArn conditions."
        fr: "Modifier la politique d'approbation de ConfigS3Remediation pour autoriser ssm.amazonaws.com, avec des conditions aws:SourceAccount et aws:SourceArn."
    - id: c
      text:
        en: "Add s3:PutBucketAcl and s3:PutBucketPolicy on all buckets to the permissions policy of ConfigS3Remediation."
        fr: "Ajouter s3:PutBucketAcl et s3:PutBucketPolicy sur tous les compartiments à la politique d'autorisations de ConfigS3Remediation."
    - id: d
      text:
        en: "Switch the remediation to manual, and have an operator run it from the AWS Config console for each noncompliant bucket."
        fr: "Passer la correction en mode manuel, et la faire exécuter par un opérateur depuis la console AWS Config pour chaque compartiment non conforme."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Config remediation starts a Systems Manager Automation execution, and Automation assumes the role passed in AutomationAssumeRole to run the runbook steps. The role must therefore trust ssm.amazonaws.com; the aws:SourceAccount and aws:SourceArn conditions on automation executions protect it from the confused deputy problem.
    fr: |-
      La correction Config lance une exécution Systems Manager Automation, et Automation assume le rôle transmis dans AutomationAssumeRole pour exécuter les étapes du runbook. Le rôle doit donc approuver ssm.amazonaws.com ; les conditions aws:SourceAccount et aws:SourceArn sur les exécutions Automation le protègent contre le problème de l'adjoint confus.
  options:
    a:
      en: |-
        Retries repeat the same failing call; the trust policy still does not let Automation assume the role, and each retry is a billed execution.
      fr: |-
        Les nouvelles tentatives répètent le même appel en échec ; la politique d'approbation ne permet toujours pas à Automation d'assumer le rôle, et chaque tentative est une exécution facturée.
    c:
      en: |-
        The error happens before any S3 call: the role cannot be assumed, so extra S3 permissions do not help.
      fr: |-
        L'erreur survient avant tout appel S3 : le rôle ne peut pas être assumé, donc des autorisations S3 supplémentaires n'aident pas.
    d:
      en: |-
        Manual remediation runs the same runbook with the same role, so it would fail in the same way and would no longer be automatic.
      fr: |-
        La correction manuelle exécute le même runbook avec le même rôle : elle échouerait de la même façon et ne serait plus automatique.
references:
  - title: Create the service roles for Automation using the console - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-setup-iam.html
  - title: Setting Up Auto Remediation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
