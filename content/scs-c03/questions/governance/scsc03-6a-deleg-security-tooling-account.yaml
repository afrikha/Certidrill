id: scsc03-6a-deleg-security-tooling-account
objective: "6.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany has 80 accounts in AWS Organizations. The security team will manage Amazon GuardDuty, Amazon Macie, and Amazon Inspector centrally for all accounts. The design must follow the principle of least privilege and AWS recommendations for multi-account security.

    Which account should the team designate as the delegated administrator for these services?
  fr: |-
    AnyCompany dispose de 80 comptes dans AWS Organizations. L'équipe de sécurité va gérer Amazon GuardDuty, Amazon Macie et Amazon Inspector de manière centralisée pour tous les comptes. La conception doit respecter le principe du moindre privilège et les recommandations d'AWS pour la sécurité multicompte.

    Quel compte l'équipe doit-elle désigner comme administrateur délégué de ces services ?
body:
  options:
    - id: a
      text:
        en: |-
          The organization's management account, because it already has trusted access with every service
        fr: |-
          Le compte de gestion de l'organisation, car il dispose déjà de l'accès approuvé avec chaque service
    - id: b
      text:
        en: |-
          A different workload account for each service, so that no single account holds all security findings
        fr: |-
          Un compte de charges de travail différent pour chaque service, afin qu'aucun compte ne détienne tous les résultats de sécurité
    - id: c
      text:
        en: |-
          A dedicated security tooling member account that only the security team can access
        fr: |-
          Un compte membre d'outillage de sécurité dédié, accessible uniquement à l'équipe de sécurité
    - id: d
      text:
        en: |-
          The account that hosts the shared network infrastructure, because it already connects to every VPC
        fr: |-
          Le compte qui héberge l'infrastructure réseau partagée, car il est déjà relié à chaque VPC
answer:
  optionId: c
explanation:
  correct:
    en: |-
      GuardDuty and Macie allow the management account to be the administrator, but AWS does not recommend it because it does not follow least privilege. A dedicated security tooling member account limits who can manage the services and keeps the management account for the tasks that must run there.
    fr: |-
      GuardDuty et Macie permettent au compte de gestion d'être l'administrateur, mais AWS ne le recommande pas, car cela ne respecte pas le moindre privilège. Un compte membre d'outillage de sécurité dédié limite qui peut gérer les services et réserve le compte de gestion aux tâches qui doivent s'y exécuter.
  options:
    a:
      en: |-
        Using the management account as the administrator is possible but not recommended, and SCPs cannot limit its principals.
      fr: |-
        Utiliser le compte de gestion comme administrateur est possible mais déconseillé, et les SCP ne peuvent pas limiter ses principaux.
    b:
      en: |-
        Workload teams would administer security services, and findings would be split across accounts that are not owned by the security team.
      fr: |-
        Des équipes de charges de travail administreraient des services de sécurité, et les résultats seraient répartis entre des comptes que l'équipe de sécurité ne possède pas.
    d:
      en: |-
        Network connectivity is not needed to administer these services, and the network account would gain security administration rights it does not need.
      fr: |-
        La connectivité réseau n'est pas nécessaire pour administrer ces services, et le compte réseau obtiendrait des droits d'administration de la sécurité dont il n'a pas besoin.
references:
  - title: "Managing GuardDuty accounts with AWS Organizations - Amazon GuardDuty"
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_organizations.html
  - title: "Integrating and configuring an organization in Macie - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/accounts-mgmt-ao-integrate.html
