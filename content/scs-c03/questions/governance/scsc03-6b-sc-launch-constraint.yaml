id: scsc03-6b-sc-launch-constraint
objective: "6.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's cloud team publishes an AWS Service Catalog product that deploys an Amazon RDS for PostgreSQL DB instance with encryption, private subnets, and approved parameter groups. Developers in a workload account must provision and terminate this product themselves. Following least privilege, developers must not have IAM permissions to create RDS DB instances, KMS keys, or security groups directly, and must not be able to deploy arbitrary CloudFormation templates.

    Which solution will meet these requirements?
  fr: |
    L'équipe cloud d'AnyCompany publie un produit AWS Service Catalog qui déploie une instance de base de données Amazon RDS for PostgreSQL avec chiffrement, sous-réseaux privés et groupes de paramètres approuvés. Les développeurs d'un compte de charge de travail doivent provisionner et résilier ce produit eux-mêmes. Selon le principe du moindre privilège, les développeurs ne doivent pas avoir d'autorisations IAM pour créer directement des instances de base de données RDS, des clés KMS ou des groupes de sécurité, et ne doivent pas pouvoir déployer des modèles CloudFormation arbitraires.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Give the developers the PowerUserAccess policy with a permissions boundary that allows only RDS, AWS KMS, and Amazon EC2 actions, and share the product's template with them."
        fr: "Donner aux développeurs la politique PowerUserAccess avec une limite d'autorisations qui n'autorise que les actions RDS, AWS KMS et Amazon EC2, puis partager avec eux le modèle du produit."
    - id: b
      text:
        en: "Add a launch constraint with an IAM role that Service Catalog assumes and that has the permissions the product needs, and grant the developers end-user access to the portfolio."
        fr: "Ajouter une contrainte de lancement avec un rôle IAM qu'assume Service Catalog et qui dispose des autorisations nécessaires au produit, puis accorder aux développeurs un accès utilisateur final au portefeuille."
    - id: c
      text:
        en: "Add a template constraint that restricts the DB instance class and engine parameters, and grant the developers the RDS, AWS KMS, and EC2 permissions that the template uses."
        fr: "Ajouter une contrainte de modèle qui restreint les paramètres de classe d'instance et de moteur, puis accorder aux développeurs les autorisations RDS, AWS KMS et EC2 utilisées par le modèle."
    - id: d
      text:
        en: "Add a notification constraint that sends stack events to an Amazon SNS topic that the security team reviews after each provisioning by the developers."
        fr: "Ajouter une contrainte de notification qui envoie les événements de pile à une rubrique Amazon SNS que l'équipe de sécurité examine après chaque provisionnement par les développeurs."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A launch constraint names the IAM role that Service Catalog assumes when an end user launches, updates, or terminates the product. Developers then need only end-user permissions on the portfolio, because the resources are created with the launch role's permissions instead of their own.
    fr: |-
      Une contrainte de lancement désigne le rôle IAM qu'assume Service Catalog lorsqu'un utilisateur final lance, met à jour ou résilie le produit. Les développeurs n'ont alors besoin que d'autorisations d'utilisateur final sur le portefeuille, car les ressources sont créées avec les autorisations du rôle de lancement plutôt qu'avec les leurs.
  options:
    a:
      en: |-
        Developers would hold direct permissions to create DB instances, keys, and security groups, and could deploy any template, which the requirement forbids.
      fr: |-
        Les développeurs détiendraient des autorisations directes pour créer des instances de base de données, des clés et des groupes de sécurité, et pourraient déployer n'importe quel modèle, ce que l'exigence interdit.
    c:
      en: |-
        Without a launch constraint, end users provision with their own credentials, so they would still need the direct service permissions.
      fr: |-
        Sans contrainte de lancement, les utilisateurs finaux provisionnent avec leurs propres informations d'identification : ils auraient toujours besoin des autorisations directes sur les services.
    d:
      en: |-
        A notification constraint only publishes stack events; it does not change the permissions used to provision the product.
      fr: |-
        Une contrainte de notification publie seulement les événements de pile ; elle ne modifie pas les autorisations utilisées pour provisionner le produit.
references:
  - title: AWS Service Catalog Launch Constraints - AWS Service Catalog
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/constraints-launch.html
