id: scsc03-6a-org-transitional-suspended
objective: "6.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany is restructuring its organization in AWS Organizations according to AWS multi-account guidance. Over the next six months, 25 accounts of an acquired company will join the organization. Each account must stay outside the production policy inheritance, under basic guardrails, until it passes a security review. Separately, accounts that are flagged for security concerns or for closure must be isolated under a restrictive SCP until the investigation or closure is complete.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |-
    AnyCompany restructure son organisation AWS Organizations selon les recommandations multicomptes d'AWS. Au cours des six prochains mois, 25 comptes d'une entreprise rachetée vont rejoindre l'organisation. Chaque compte doit rester en dehors de l'héritage des politiques de production, sous des protections de base, jusqu'à ce qu'il réussisse une revue de sécurité. Par ailleurs, les comptes signalés pour des problèmes de sécurité ou en vue de leur fermeture doivent être isolés sous une SCP restrictive jusqu'à la fin de l'enquête ou de la fermeture.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a Transitional OU with baseline guardrail SCPs, and place each acquired account in it until its review is complete.
        fr: |-
          Créer une OU Transitional avec des SCP de protection de base, et y placer chaque compte racheté jusqu'à la fin de sa revue.
    - id: b
      text:
        en: |-
          Leave the acquired accounts directly under the organization root until their reviews are complete.
        fr: |-
          Laisser les comptes rachetés directement sous la racine de l'organisation jusqu'à la fin de leurs revues.
    - id: c
      text:
        en: |-
          Create a Suspended OU with a restrictive SCP, and move flagged accounts into it until they are cleared or closed.
        fr: |-
          Créer une OU Suspended avec une SCP restrictive, et y déplacer les comptes signalés jusqu'à leur levée de doute ou leur fermeture.
    - id: d
      text:
        en: |-
          Move flagged accounts into the Policy Staging OU so that restrictive policies can be tested on them.
        fr: |-
          Déplacer les comptes signalés dans l'OU Policy Staging afin d'y tester des politiques restrictives.
    - id: e
      text:
        en: |-
          Place the acquired accounts in an Exceptions OU, and keep them there after their reviews are complete.
        fr: |-
          Placer les comptes rachetés dans une OU Exceptions, et les y conserver après la fin de leurs revues.
answer:
  optionIds: [a, c]
explanation:
  correct:
    en: |-
      AWS guidance describes a Transitional OU as a temporary home for accounts during a migration, so that they are integrated gradually into the standard governance structure. It describes a Suspended OU for accounts that are suspended or deactivated for security or administrative reasons, which is where a restrictive SCP isolates them.
    fr: |-
      Les recommandations d'AWS décrivent une OU Transitional comme un emplacement temporaire pour les comptes pendant une migration, afin de les intégrer progressivement à la structure de gouvernance standard. Elles décrivent une OU Suspended pour les comptes suspendus ou désactivés pour des raisons de sécurité ou administratives : c'est là qu'une SCP restrictive les isole.
  options:
    b:
      en: |-
        Accounts under the root receive only root-level policies, without a dedicated set of baseline guardrails that can be managed separately.
      fr: |-
        Les comptes sous la racine ne reçoivent que les politiques de la racine, sans ensemble dédié de protections de base gérable séparément.
    d:
      en: |-
        The Policy Staging OU holds test accounts used to validate new policies before production; it is not an isolation area for flagged accounts.
      fr: |-
        L'OU Policy Staging contient des comptes de test servant à valider de nouvelles politiques avant la production ; ce n'est pas une zone d'isolement pour les comptes signalés.
    e:
      en: |-
        The Exceptions OU is for workloads that permanently need a deviating governance model, not for a temporary integration period.
      fr: |-
        L'OU Exceptions sert aux charges de travail qui ont durablement besoin d'un modèle de gouvernance dérogatoire, pas à une période d'intégration temporaire.
references:
  - title: "Recommended OUs and accounts - Organizing Your AWS Environment Using Multiple Accounts"
    url: https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/recommended-ous-and-accounts.html
