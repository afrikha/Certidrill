id: scsc03-6b-wa-review-template
objective: "6.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany reviews 45 workloads in the AWS Well-Architected Tool. All workloads run in accounts of the same organization in AWS Organizations, in the same Region, on a landing zone that the platform team operates. About 20 Security pillar questions, such as those about account structure, root user protection, and centralized logging, have the same answers for every workload, but each team answers them again, and the answers are inconsistent. The security team wants these answers and their notes to be provided once and reused by every team.

    Which solution will meet these requirements?
  fr: |
    AnyCompany passe en revue 45 charges de travail dans l'AWS Well-Architected Tool. Toutes les charges de travail s'exécutent dans des comptes de la même organisation AWS Organizations, dans la même Région, sur une zone d'atterrissage (landing zone) exploitée par l'équipe plateforme. Environ 20 questions du pilier Sécurité, comme celles sur la structure des comptes, la protection de l'utilisateur racine et la journalisation centralisée, ont les mêmes réponses pour toutes les charges de travail, mais chaque équipe y répond de nouveau, et les réponses sont incohérentes. L'équipe de sécurité veut que ces réponses et leurs notes soient fournies une fois et réutilisées par toutes les équipes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a custom lens that leaves out the 20 landing zone questions, and apply it instead of the AWS Well-Architected Framework lens."
        fr: "Créer un objectif (lens) personnalisé qui omet les 20 questions de la zone d'atterrissage, et l'appliquer à la place de l'objectif AWS Well-Architected Framework."
    - id: b
      text:
        en: "Create a profile that describes the landing zone and its controls, and attach it to each of the 45 workloads."
        fr: "Créer un profil qui décrit la zone d'atterrissage et ses contrôles, et l'attacher à chacune des 45 charges de travail."
    - id: c
      text:
        en: "Save a milestone on one fully reviewed workload, and ask each team to copy the 20 answers and notes from that milestone."
        fr: "Enregistrer un jalon sur une charge de travail entièrement revue, et demander à chaque équipe d'y copier les 20 réponses et notes."
    - id: d
      text:
        en: "Create a review template with pre-filled answers and notes for the 20 questions, share it with the organization, and define the workloads from it."
        fr: "Créer un modèle de revue avec des réponses et des notes préremplies pour les 20 questions, le partager avec l'organisation, et définir les charges de travail à partir de ce modèle."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Review templates contain pre-filled answers and notes for Framework and custom lens questions that are common to many workloads. They can be shared with an organization or OUs in the same Region, and workloads defined from a template start with those answers, which removes repeated work and drives consistency.
    fr: |-
      Les modèles de revue contiennent des réponses et des notes préremplies pour les questions de l'objectif Framework et des objectifs personnalisés communes à de nombreuses charges de travail. Ils peuvent être partagés avec une organisation ou des unités d'organisation dans la même Région, et les charges de travail définies à partir d'un modèle démarrent avec ces réponses, ce qui supprime le travail répété et favorise la cohérence.
  options:
    a:
      en: |-
        A custom lens adds its own questions; it does not remove questions from the Framework lens, which is applied automatically, and the landing zone practices would no longer be reviewed.
      fr: |-
        Un objectif personnalisé ajoute ses propres questions ; il ne retire pas de questions de l'objectif Framework, appliqué automatiquement, et les pratiques de la zone d'atterrissage ne seraient plus revues.
    b:
      en: |-
        A profile gives business context to prioritize questions and risks; it does not pre-fill answers.
      fr: |-
        Un profil fournit un contexte métier pour prioriser les questions et les risques ; il ne préremplit pas les réponses.
    c:
      en: |-
        A milestone is a snapshot of one workload's state to measure its progress; it does not provide answers to other workloads.
      fr: |-
        Un jalon est un instantané de l'état d'une charge de travail pour mesurer ses progrès ; il ne fournit pas de réponses aux autres charges de travail.
references:
  - title: Review templates in AWS WA Tool - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/review-templates.html
