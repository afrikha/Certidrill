id: scsc03-6b-tag-sc-tagoption-enforce
objective: "6.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's platform team publishes approved Amazon S3 and Amazon RDS products through an AWS Service Catalog portfolio that is shared with all workload accounts. The security team needs to group every provisioned product for data protection reviews. Every product provisioned from the portfolio must carry the tag DataClassification=confidential and an Owner tag whose value end users choose from an approved list of team names. End users must not be able to type free values, and the product templates must not be changed.

    Which solution will meet these requirements?
  fr: |
    L'équipe plateforme d'AnyCompany publie des produits Amazon S3 et Amazon RDS approuvés via un portefeuille AWS Service Catalog partagé avec tous les comptes de charges de travail. L'équipe de sécurité doit regrouper chaque produit provisionné pour les revues de protection des données. Chaque produit provisionné à partir du portefeuille doit porter la balise DataClassification=confidential et une balise Owner dont les utilisateurs finaux choisissent la valeur dans une liste approuvée de noms d'équipes. Les utilisateurs finaux ne doivent pas pouvoir saisir de valeurs libres, et les modèles des produits ne doivent pas être modifiés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create TagOptions for DataClassification with the single value confidential and for Owner with each approved team name, and associate them with the portfolio."
        fr: "Créer des TagOptions pour DataClassification avec la seule valeur confidential et pour Owner avec chaque nom d'équipe approuvé, puis les associer au portefeuille."
    - id: b
      text:
        en: "Add a template constraint to each product with rules that assert the DataClassification and Owner values that end users enter."
        fr: "Ajouter à chaque produit une contrainte de modèle dont les règles vérifient les valeurs DataClassification et Owner saisies par les utilisateurs finaux."
    - id: c
      text:
        en: "Add a tag update constraint to each product that prevents end users from updating the tags of provisioned products."
        fr: "Ajouter à chaque produit une contrainte de mise à jour des balises qui empêche les utilisateurs finaux de modifier les balises des produits provisionnés."
    - id: d
      text:
        en: "Attach a tag policy to the workload OU that defines DataClassification and Owner with their allowed values and enforces them for S3 buckets and RDS DB instances."
        fr: "Attacher à l'unité d'organisation des charges de travail une politique de balises qui définit DataClassification et Owner avec leurs valeurs autorisées et les applique aux compartiments S3 et aux instances de base de données RDS."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      TagOptions are key-value pairs that a Service Catalog administrator associates with a portfolio or product to enforce a tag taxonomy at provisioning. A TagOption key with a single value is applied automatically, and a key with several values makes end users pick one of them; the templates stay unchanged, and changes in the sharing account appear in recipient accounts.
    fr: |-
      Les TagOptions sont des paires clé-valeur qu'un administrateur Service Catalog associe à un portefeuille ou à un produit pour imposer une taxonomie de balises au provisionnement. Une clé TagOption avec une seule valeur est appliquée automatiquement, et une clé avec plusieurs valeurs oblige les utilisateurs finaux à en choisir une ; les modèles restent inchangés, et les modifications du compte qui partage apparaissent dans les comptes destinataires.
  options:
    b:
      en: |-
        Template constraints narrow the values of parameters defined in the CloudFormation template; the templates have no tag parameters and must not be changed.
      fr: |-
        Les contraintes de modèle restreignent les valeurs des paramètres définis dans le modèle CloudFormation ; les modèles n'ont pas de paramètres de balise et ne doivent pas être modifiés.
    c:
      en: |-
        A tag update constraint only controls whether tags can be updated after provisioning; it does not apply any tag.
      fr: |-
        Une contrainte de mise à jour des balises contrôle seulement si les balises peuvent être modifiées après le provisionnement ; elle n'applique aucune balise.
    d:
      en: |-
        Tag policies reject noncompliant values but do not add missing tags, and resources without the tags are not evaluated, so products could still be provisioned untagged.
      fr: |-
        Les politiques de balises rejettent les valeurs non conformes mais n'ajoutent pas les balises manquantes, et les ressources sans ces balises ne sont pas évaluées : des produits pourraient encore être provisionnés sans balises.
references:
  - title: Sharing a Portfolio - AWS Service Catalog
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/catalogs_portfolios_sharing_how-to-share.html
