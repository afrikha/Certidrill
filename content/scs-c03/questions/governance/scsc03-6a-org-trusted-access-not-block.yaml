id: scsc03-6a-org-trusted-access-not-block
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany has trusted access enabled between AWS Organizations and AWS Systems Manager. The security team decides that developers in the Workloads OU must no longer start Session Manager sessions. An engineer proposes to disable trusted access for Systems Manager in Organizations. The security team must block the sessions in all current and future accounts of the OU.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany a activé l'accès approuvé entre AWS Organizations et AWS Systems Manager. L'équipe de sécurité décide que les développeurs de l'OU Workloads ne doivent plus démarrer de sessions Session Manager. Un ingénieur propose de désactiver l'accès approuvé pour Systems Manager dans Organizations. L'équipe de sécurité doit bloquer les sessions dans tous les comptes actuels et futurs de l'OU.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Disable trusted access for Systems Manager in Organizations, as the engineer proposes.
        fr: |-
          Désactiver l'accès approuvé pour Systems Manager dans Organizations, comme l'ingénieur le propose.
    - id: b
      text:
        en: |-
          Attach an SCP to the Workloads OU that denies the ssm:StartSession action.
        fr: |-
          Attacher à l'OU Workloads une SCP qui refuse l'action ssm:StartSession.
    - id: c
      text:
        en: |-
          Deregister the delegated administrator account for Systems Manager in Organizations.
        fr: |-
          Annuler l'enregistrement du compte d'administrateur délégué pour Systems Manager dans Organizations.
    - id: d
      text:
        en: |-
          Delete the Systems Manager service-linked role in every account of the Workloads OU.
        fr: |-
          Supprimer le rôle lié au service Systems Manager dans chaque compte de l'OU Workloads.
answer:
  optionId: b
explanation:
  correct:
    en: |-
      Trusted access only controls whether a service can act across the organization; disabling it does not stop users or roles from calling the service. To block an action for principals of member accounts, the documented approach is to remove IAM permissions or use an SCP, which covers every current and future account of the OU.
    fr: |-
      L'accès approuvé détermine seulement si un service peut agir dans l'organisation ; le désactiver n'empêche pas les utilisateurs ou les rôles d'appeler le service. Pour bloquer une action des principaux des comptes membres, l'approche documentée consiste à retirer des autorisations IAM ou à utiliser une SCP, qui couvre tous les comptes actuels et futurs de l'OU.
  options:
    a:
      en: |-
        Disabling trusted access stops the service's organization-wide management, but users with IAM permissions can still start sessions.
      fr: |-
        Désactiver l'accès approuvé arrête la gestion du service à l'échelle de l'organisation, mais les utilisateurs disposant d'autorisations IAM peuvent toujours démarrer des sessions.
    c:
      en: |-
        A delegated administrator only centralizes management of the service; removing it does not change what developers can call in their accounts.
      fr: |-
        Un administrateur délégué ne fait que centraliser la gestion du service ; le retirer ne change pas ce que les développeurs peuvent appeler dans leurs comptes.
    d:
      en: |-
        A service-linked role holds the service's own permissions; deleting it can break the service but does not remove the developers' permissions.
      fr: |-
        Un rôle lié à un service porte les autorisations du service lui-même ; le supprimer peut casser le service mais ne retire pas les autorisations des développeurs.
references:
  - title: "Using AWS Organizations with other AWS services - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_integrate_services.html
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
