id: scsc03-6a-pol-rcp-coverage-gaps
objective: "6.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany attached the following RCP to the root of its organization, o-a1b2c3d4e5. All accounts keep the RCPFullAWSAccess policy. The security tooling account is a member account and the delegated administrator for several security services.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "EnforceOrgIdentities",
          "Effect": "Deny",
          "Principal": "*",
          "Action": ["s3:*", "kms:*"],
          "Resource": "*",
          "Condition": {
            "StringNotEqualsIfExists": { "aws:PrincipalOrgID": "o-a1b2c3d4e5" },
            "BoolIfExists": { "aws:PrincipalIsAWSService": "false" }
          }
        }
      ]
    }
    ```

    An auditor checks which resources could still be accessed by a principal of an external AWS account if a resource-based policy grants that account access.

    Which resources could the external principal still access? (Choose two.)
  fr: |-
    AnyCompany a attaché la RCP suivante à la racine de son organisation o-a1b2c3d4e5. Tous les comptes conservent la politique RCPFullAWSAccess. Le compte d'outillage de sécurité est un compte membre et l'administrateur délégué de plusieurs services de sécurité.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "EnforceOrgIdentities",
          "Effect": "Deny",
          "Principal": "*",
          "Action": ["s3:*", "kms:*"],
          "Resource": "*",
          "Condition": {
            "StringNotEqualsIfExists": { "aws:PrincipalOrgID": "o-a1b2c3d4e5" },
            "BoolIfExists": { "aws:PrincipalIsAWSService": "false" }
          }
        }
      ]
    }
    ```

    Un auditeur vérifie quelles ressources pourraient encore être accessibles à un principal d'un compte AWS externe si une politique basée sur les ressources accorde l'accès à ce compte.

    À quelles ressources le principal externe pourrait-il encore accéder ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          An S3 bucket in the organization's management account
        fr: |-
          Un compartiment S3 du compte de gestion de l'organisation
    - id: b
      text:
        en: |-
          An S3 bucket in the security tooling account
        fr: |-
          Un compartiment S3 du compte d'outillage de sécurité
    - id: c
      text:
        en: |-
          A customer managed KMS key in a workload account
        fr: |-
          Une clé KMS gérée par le client dans un compte de charges de travail
    - id: d
      text:
        en: |-
          An Amazon SNS topic in a workload account
        fr: |-
          Une rubrique Amazon SNS dans un compte de charges de travail
    - id: e
      text:
        en: |-
          An S3 bucket in an account of an OU nested three levels below the root
        fr: |-
          Un compartiment S3 d'un compte situé dans une OU imbriquée trois niveaux sous la racine
answer:
  optionIds: [a, d]
explanation:
  correct:
    en: |-
      RCPs apply only to resources in member accounts, so resources in the management account are never restricted by them. This RCP also lists only s3:* and kms:* actions, so an SNS topic policy that grants an external account access is not limited by it.
    fr: |-
      Les RCP ne s'appliquent qu'aux ressources des comptes membres : les ressources du compte de gestion ne sont donc jamais limitées par elles. Cette RCP ne liste par ailleurs que les actions s3:* et kms:* : une politique de rubrique SNS qui accorde l'accès à un compte externe n'est pas limitée par elle.
  options:
    b:
      en: |-
        Delegated administrator accounts are member accounts, so the RCP applies to their resources.
      fr: |-
        Les comptes d'administrateur délégué sont des comptes membres : la RCP s'applique donc à leurs ressources.
    c:
      en: |-
        kms:* is in the RCP, and customer managed keys in member accounts are covered; only AWS managed keys are outside the scope of RCPs.
      fr: |-
        kms:* figure dans la RCP, et les clés gérées par le client des comptes membres sont couvertes ; seules les clés gérées par AWS échappent aux RCP.
    e:
      en: |-
        A policy attached to the root is inherited by every OU and account below it, whatever the nesting depth.
      fr: |-
        Une politique attachée à la racine est héritée par toutes les OU et tous les comptes situés en dessous, quelle que soit la profondeur d'imbrication.
references:
  - title: "Resource control policies (RCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
