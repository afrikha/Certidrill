id: scsc03-6a-pol-scp-allowlist-intersection
objective: "6.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany uses an allow-list strategy for its Sandbox OU. The organization root has the FullAWSAccess policy attached. FullAWSAccess is detached from the Sandbox OU, and an SCP attached to the OU allows only ec2:*, s3:*, cloudwatch:*, and logs:*. A developer in a sandbox account has an IAM policy that allows dynamodb:* and ec2:*, but every Amazon DynamoDB call fails with an access denied error. Developers in the sandbox accounts must be able to use DynamoDB, and nothing else must change.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany utilise une stratégie de liste d'autorisation pour son OU Sandbox. La politique FullAWSAccess est attachée à la racine de l'organisation. FullAWSAccess est détachée de l'OU Sandbox, et une SCP attachée à l'OU n'autorise que ec2:*, s3:*, cloudwatch:* et logs:*. Un développeur d'un compte sandbox dispose d'une politique IAM qui autorise dynamodb:* et ec2:*, mais chaque appel à Amazon DynamoDB échoue avec une erreur d'accès refusé. Les développeurs des comptes sandbox doivent pouvoir utiliser DynamoDB, et rien d'autre ne doit changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach the FullAWSAccess policy directly to each account in the Sandbox OU.
        fr: |-
          Attacher la politique FullAWSAccess directement à chaque compte de l'OU Sandbox.
    - id: b
      text:
        en: |-
          Attach a new SCP that allows dynamodb:* directly to each account in the Sandbox OU.
        fr: |-
          Attacher directement à chaque compte de l'OU Sandbox une nouvelle SCP qui autorise dynamodb:*.
    - id: c
      text:
        en: |-
          Add a resource-based policy to each DynamoDB table that allows the developers' IAM roles.
        fr: |-
          Ajouter à chaque table DynamoDB une politique basée sur les ressources qui autorise les rôles IAM des développeurs.
    - id: d
      text:
        en: |-
          Add dynamodb:* to the Allow statement of the SCP that is attached to the Sandbox OU.
        fr: |-
          Ajouter dynamodb:* à l'instruction Allow de la SCP attachée à l'OU Sandbox.
answer:
  optionId: d
explanation:
  correct:
    en: |-
      With an allow-list strategy, an action is available only if an SCP allows it at every level from the root down to the account. The root and the accounts still have FullAWSAccess, so the Sandbox OU's SCP is the level that filters out DynamoDB; adding dynamodb:* there makes the developers' IAM permission effective without widening anything else.
    fr: |-
      Avec une stratégie de liste d'autorisation, une action n'est disponible que si une SCP l'autorise à chaque niveau, de la racine jusqu'au compte. La racine et les comptes ont toujours FullAWSAccess : c'est donc la SCP de l'OU Sandbox qui filtre DynamoDB, et y ajouter dynamodb:* rend effective l'autorisation IAM des développeurs sans rien élargir d'autre.
  options:
    a:
      en: |-
        The accounts already have FullAWSAccess; the OU-level SCP still caps them because a permission must be allowed at every level.
      fr: |-
        Les comptes ont déjà FullAWSAccess ; la SCP de l'OU les plafonne toujours, car une autorisation doit être accordée à chaque niveau.
    b:
      en: |-
        An account-level allow cannot add an action that the parent OU's SCPs do not allow.
      fr: |-
        Une autorisation au niveau du compte ne peut pas ajouter une action que les SCP de l'OU parente n'autorisent pas.
    c:
      en: |-
        SCPs limit principals of member accounts even when a resource-based policy in the same organization grants access.
      fr: |-
        Les SCP limitent les principaux des comptes membres même lorsqu'une politique basée sur les ressources de la même organisation accorde l'accès.
references:
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
