id: scsc03-6b-tag-scp-protect-security
objective: "6.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's security team deploys AWS Lambda functions for automated incident response into every member account of its organization in AWS Organizations. Each of these functions carries the tag owner=security. Workload teams have the AdministratorAccess policy in their own accounts. A role named SecurityAutomationAdmin exists in every account and is used only by the security pipeline.

    The security team requires that no principal other than SecurityAutomationAdmin can update the code or configuration of these functions, delete them, or change or remove their tags, in any member account. Workload teams must keep full control of their own Lambda functions.

    Which solution will meet these requirements?
  fr: |
    L'équipe de sécurité d'AnyCompany déploie des fonctions AWS Lambda de réponse automatisée aux incidents dans chaque compte membre de son organisation AWS Organizations. Chacune de ces fonctions porte la balise owner=security. Les équipes de charges de travail disposent de la politique AdministratorAccess dans leurs propres comptes. Un rôle nommé SecurityAutomationAdmin existe dans chaque compte et n'est utilisé que par le pipeline de sécurité.

    L'équipe de sécurité exige qu'aucun principal autre que SecurityAutomationAdmin ne puisse mettre à jour le code ou la configuration de ces fonctions, les supprimer, ou modifier ou retirer leurs balises, dans aucun compte membre. Les équipes de charges de travail doivent garder le contrôle total de leurs propres fonctions Lambda.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach an SCP that denies the Lambda update, delete, tag, and untag actions when aws:RequestTag/owner equals security, unless aws:PrincipalARN matches the SecurityAutomationAdmin role."
        fr: "Attacher une SCP qui refuse les actions Lambda de mise à jour, de suppression, de balisage et de retrait de balise lorsque aws:RequestTag/owner est égal à security, sauf si aws:PrincipalARN correspond au rôle SecurityAutomationAdmin."
    - id: b
      text:
        en: "Attach an SCP that allows the Lambda update, delete, tag, and untag actions on functions tagged owner=security only when aws:PrincipalARN matches the SecurityAutomationAdmin role."
        fr: "Attacher une SCP qui autorise les actions Lambda de mise à jour, de suppression, de balisage et de retrait de balise sur les fonctions balisées owner=security uniquement lorsque aws:PrincipalARN correspond au rôle SecurityAutomationAdmin."
    - id: c
      text:
        en: "Attach a tag policy that enforces the value security for the owner tag key on Lambda functions in all member accounts."
        fr: "Attacher une politique de balises qui impose la valeur security pour la clé de balise owner sur les fonctions Lambda de tous les comptes membres."
    - id: d
      text:
        en: "Attach an SCP that denies the Lambda update, delete, tag, and untag actions when aws:ResourceTag/owner equals security, unless aws:PrincipalARN matches the SecurityAutomationAdmin role."
        fr: "Attacher une SCP qui refuse les actions Lambda de mise à jour, de suppression, de balisage et de retrait de balise lorsque aws:ResourceTag/owner est égal à security, sauf si aws:PrincipalARN correspond au rôle SecurityAutomationAdmin."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An SCP with an explicit Deny caps every principal in the member accounts, including administrators. aws:ResourceTag/owner selects only the functions that already carry owner=security, so workload functions are unaffected, and the ArnNotLike condition on aws:PrincipalARN exempts the security role. Because tag and untag actions are denied on the tagged functions too, nobody else can remove the tag to escape the control.
    fr: |-
      Une SCP avec un refus explicite plafonne tous les principaux des comptes membres, administrateurs compris. aws:ResourceTag/owner ne sélectionne que les fonctions qui portent déjà owner=security, donc les fonctions des charges de travail ne sont pas concernées, et la condition ArnNotLike sur aws:PrincipalARN exempte le rôle de sécurité. Comme le balisage et le retrait de balise sont aussi refusés sur les fonctions balisées, personne d'autre ne peut retirer la balise pour échapper au contrôle.
  options:
    a:
      en: |-
        aws:RequestTag only contains tags passed in the request; an UpdateFunctionCode or DeleteFunction call passes no tags, so the Deny never applies to those calls.
      fr: |-
        aws:RequestTag ne contient que les balises transmises dans la requête ; un appel UpdateFunctionCode ou DeleteFunction n'en transmet aucune, donc le refus ne s'applique jamais à ces appels.
    b:
      en: |-
        SCPs never grant permissions, and with FullAWSAccess still attached an Allow statement does not restrict anyone; only a Deny can block the workload administrators.
      fr: |-
        Les SCP n'accordent jamais d'autorisations, et avec FullAWSAccess toujours attachée, une instruction Allow ne restreint personne ; seul un refus peut bloquer les administrateurs des charges de travail.
    c:
      en: |-
        A tag policy standardizes tag values but does not control who can update or delete a function, and it does not stop a tag from being removed.
      fr: |-
        Une politique de balises normalise les valeurs de balises mais ne contrôle pas qui peut mettre à jour ou supprimer une fonction, et elle n'empêche pas le retrait d'une balise.
references:
  - title: Service control policy examples - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples.html
  - title: Define permissions based on attributes with ABAC authorization - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html
