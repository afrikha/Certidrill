id: scsc03-6b-artifact-assurance-questionnaire
objective: "6.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany sells a SaaS product hosted on AWS. A banking customer sends a Standardized Information Gathering (SIG) questionnaire in XLSX format with 300 questions about the physical security, personnel controls, and infrastructure operations of the AWS data centers that host the product. The compliance team wants draft answers with citations to AWS compliance documentation that reviewers can verify, at no additional cost and with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany vend un produit SaaS hébergé sur AWS. Un client bancaire envoie un questionnaire Standardized Information Gathering (SIG) au format XLSX avec 300 questions sur la sécurité physique, les contrôles du personnel et l'exploitation de l'infrastructure des centres de données AWS qui hébergent le produit. L'équipe de conformité veut des projets de réponses avec des citations de la documentation de conformité AWS que les relecteurs peuvent vérifier, sans coût supplémentaire et avec le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an AWS Audit Manager assessment from the SOC 2 framework and export its evidence to answer the questionnaire."
        fr: "Créer une évaluation AWS Audit Manager à partir du cadre SOC 2 et exporter ses preuves pour répondre au questionnaire."
    - id: b
      text:
        en: "Upload the questionnaire to Assurance Assistant in AWS Artifact, review the generated answers and their citations, and export the responses."
        fr: "Charger le questionnaire dans Assurance Assistant dans AWS Artifact, examiner les réponses générées et leurs citations, puis exporter les réponses."
    - id: c
      text:
        en: "Enable the AWS Foundational Security Best Practices standard in Security Hub CSPM and answer the questionnaire from the control findings."
        fr: "Activer la norme AWS Foundational Security Best Practices dans Security Hub CSPM et répondre au questionnaire à partir des résultats des contrôles."
    - id: d
      text:
        en: "Download every SOC and ISO report from AWS Artifact and have the team search the reports manually to answer each question."
        fr: "Télécharger tous les rapports SOC et ISO depuis AWS Artifact et faire rechercher manuellement par l'équipe la réponse à chaque question dans les rapports."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Assurance Assistant in AWS Artifact accepts questions and industry questionnaires such as SIG and CAIQ in CSV, XLSX, Word, or PDF format. It maps each question to AWS security controls, searches verified AWS compliance documentation, and returns answers with citations, at no additional charge. It covers AWS's controls, which is what these questions ask about.
    fr: |-
      Assurance Assistant dans AWS Artifact accepte des questions et des questionnaires sectoriels comme SIG et CAIQ au format CSV, XLSX, Word ou PDF. Il associe chaque question aux contrôles de sécurité d'AWS, recherche dans la documentation de conformité AWS vérifiée et renvoie des réponses avec citations, sans frais supplémentaires. Il couvre les contrôles d'AWS, ce qui est précisément l'objet de ces questions.
  options:
    a:
      en: |-
        Audit Manager collects evidence about the company's own resources, not about AWS data centers, and it is closed to new customers.
      fr: |-
        Audit Manager collecte des preuves sur les ressources de l'entreprise elle-même, pas sur les centres de données AWS, et il est fermé aux nouveaux clients.
    c:
      en: |-
        Security Hub CSPM checks the configuration of the company's resources; it says nothing about physical or personnel controls at AWS.
      fr: |-
        Security Hub CSPM vérifie la configuration des ressources de l'entreprise ; il ne dit rien des contrôles physiques ou du personnel chez AWS.
    d:
      en: |-
        The reports contain the information, but searching them manually for 300 questions is far more effort than letting Assurance Assistant draft cited answers.
      fr: |-
        Les rapports contiennent l'information, mais y rechercher manuellement 300 réponses demande bien plus d'efforts que de laisser Assurance Assistant rédiger des réponses citées.
references:
  - title: Using Assurance Assistant in AWS Artifact - AWS Artifact
    url: https://docs.aws.amazon.com/artifact/latest/ug/managing-compliance-inquiries.html
