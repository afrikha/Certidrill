id: scsc03-6b-sc-template-constraint
objective: "6.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's AWS Service Catalog product for Amazon S3 buckets has the template parameters EncryptionType, with the allowed values SSE-S3 and SSE-KMS, and VersioningEnabled, with the values true and false. The same product is in two portfolios: Regulated, shared with the accounts that process cardholder data, and Sandbox. In the Regulated portfolio, end users must be able to choose only SSE-KMS and versioning enabled. The Sandbox portfolio must keep all choices, and the template must not be duplicated.

    Which solution will meet these requirements?
  fr: |
    Le produit AWS Service Catalog d'AnyCompany pour les compartiments Amazon S3 a les paramètres de modèle EncryptionType, avec les valeurs autorisées SSE-S3 et SSE-KMS, et VersioningEnabled, avec les valeurs true et false. Le même produit figure dans deux portefeuilles : Regulated, partagé avec les comptes qui traitent des données de titulaires de cartes, et Sandbox. Dans le portefeuille Regulated, les utilisateurs finaux ne doivent pouvoir choisir que SSE-KMS et la gestion des versions activée. Le portefeuille Sandbox doit conserver tous les choix, et le modèle ne doit pas être dupliqué.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a launch constraint in the Regulated portfolio whose role has no permission to configure SSE-S3 encryption or to suspend versioning."
        fr: "Ajouter dans le portefeuille Regulated une contrainte de lancement dont le rôle n'a pas l'autorisation de configurer le chiffrement SSE-S3 ni de suspendre la gestion des versions."
    - id: b
      text:
        en: "Publish a new version of the product with EncryptionType fixed to SSE-KMS and VersioningEnabled fixed to true."
        fr: "Publier une nouvelle version du produit avec EncryptionType fixé à SSE-KMS et VersioningEnabled fixé à true."
    - id: c
      text:
        en: "Attach an SCP to the cardholder data accounts that denies bucket creation unless the request specifies SSE-KMS and versioning."
        fr: "Attacher aux comptes de données de titulaires de cartes une SCP qui refuse la création de compartiments sauf si la requête indique SSE-KMS et la gestion des versions."
    - id: d
      text:
        en: "Add a template constraint to the product in the Regulated portfolio with rules that assert EncryptionType equals SSE-KMS and VersioningEnabled equals true."
        fr: "Ajouter au produit, dans le portefeuille Regulated, une contrainte de modèle dont les règles vérifient que EncryptionType est égal à SSE-KMS et VersioningEnabled à true."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A template constraint contains rules that narrow the allowed values of the template's parameters when end users launch the product. Template constraints are bound to the portfolio where they are applied, so the Sandbox portfolio keeps every choice and the template is not changed.
    fr: |-
      Une contrainte de modèle contient des règles qui restreignent les valeurs autorisées des paramètres du modèle lorsque les utilisateurs finaux lancent le produit. Les contraintes de modèle sont liées au portefeuille où elles sont appliquées : le portefeuille Sandbox conserve tous les choix et le modèle n'est pas modifié.
  options:
    a:
      en: |-
        Users could still choose the forbidden values, and provisioning would fail or produce partial stacks instead of restricting the choices.
      fr: |-
        Les utilisateurs pourraient toujours choisir les valeurs interdites, et le provisionnement échouerait ou produirait des piles partielles au lieu de restreindre les choix.
    b:
      en: |-
        A new product version applies to both portfolios and changes the template, so Sandbox would lose its choices.
      fr: |-
        Une nouvelle version du produit s'applique aux deux portefeuilles et modifie le modèle : Sandbox perdrait ses choix.
    c:
      en: |-
        Bucket encryption and versioning are configured by separate calls after creation, so this condition cannot be evaluated on the creation request, and an SCP does not narrow the choices shown in Service Catalog.
      fr: |-
        Le chiffrement et la gestion des versions d'un compartiment sont configurés par des appels distincts après la création : cette condition ne peut pas être évaluée sur la requête de création, et une SCP ne restreint pas les choix proposés dans Service Catalog.
references:
  - title: AWS Service Catalog Template Constraints - AWS Service Catalog
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/catalogs_constraints_template-constraints.html
