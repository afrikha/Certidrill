id: scsc03-6b-cfg-nist-pack-evidence
objective: "6.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany created its organization in AWS Organizations in June 2026 and has never used AWS Audit Manager. A regulator requires continuous evidence that resources in all accounts and Regions follow NIST SP 800-53 Rev. 5 technical controls, plus one company-specific check that no security group allows inbound traffic from 198.51.100.0/24, the range of a decommissioned data center. Compliance results must be consolidated in the security account, which is the delegated administrator for AWS Config. AWS Config records all resource types everywhere.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a créé son organisation AWS Organizations en juin 2026 et n'a jamais utilisé AWS Audit Manager. Un régulateur exige des preuves continues que les ressources de tous les comptes et de toutes les Régions respectent les contrôles techniques NIST SP 800-53 Rev. 5, ainsi qu'une vérification propre à l'entreprise : aucun groupe de sécurité ne doit autoriser le trafic entrant provenant de 198.51.100.0/24, la plage d'un centre de données désaffecté. Les résultats de conformité doivent être consolidés dans le compte de sécurité, qui est l'administrateur délégué d'AWS Config. AWS Config enregistre tous les types de ressources partout.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set up AWS Audit Manager in the security account as delegated administrator, create an assessment from the NIST SP 800-53 Rev. 5 standard framework, and add all accounts to its scope."
        fr: "Configurer AWS Audit Manager dans le compte de sécurité comme administrateur délégué, créer une évaluation à partir du cadre standard NIST SP 800-53 Rev. 5, et ajouter tous les comptes à son étendue."
    - id: b
      text:
        en: "Download the AWS compliance reports that cover NIST SP 800-53 from AWS Artifact, and send them to the regulator with the list of accounts every quarter."
        fr: "Télécharger depuis AWS Artifact les rapports de conformité AWS qui couvrent NIST SP 800-53, et les envoyer chaque trimestre au régulateur avec la liste des comptes."
    - id: c
      text:
        en: "In each Region, deploy an organization conformance pack from the NIST 800-53 rev 5 sample template with an added custom policy rule for the security group check, and use an organization aggregator."
        fr: "Dans chaque Région, déployer un pack de conformité d'organisation issu de l'exemple de modèle NIST 800-53 rev 5, complété d'une règle de politique personnalisée pour la vérification des groupes de sécurité, et utiliser un agrégateur d'organisation."
    - id: d
      text:
        en: "Define each workload in the AWS Well-Architected Tool, answer the Security pillar questions every quarter, and share a milestone of each workload with the regulator."
        fr: "Définir chaque charge de travail dans l'AWS Well-Architected Tool, répondre chaque trimestre aux questions du pilier Sécurité, et partager un jalon de chaque charge de travail avec le régulateur."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS points customers without Audit Manager to AWS Config conformance packs, which provide sample templates for frameworks such as NIST SP 800-53 Rev. 5. A custom pack can add the company's own rule, an organization conformance pack deploys it in every member account of a Region, and the organization aggregator consolidates compliance data in the security account.
    fr: |-
      AWS oriente les clients qui n'ont pas Audit Manager vers les packs de conformité AWS Config, qui proposent des exemples de modèles pour des cadres comme NIST SP 800-53 Rev. 5. Un pack personnalisé peut ajouter la règle propre à l'entreprise, un pack de conformité d'organisation le déploie dans chaque compte membre d'une Région, et l'agrégateur d'organisation consolide les données de conformité dans le compte de sécurité.
  options:
    a:
      en: |-
        Since April 30, 2026, Audit Manager can no longer be set up in new accounts or for new organizations.
      fr: |-
        Depuis le 30 avril 2026, Audit Manager ne peut plus être configuré dans de nouveaux comptes ni pour de nouvelles organisations.
    b:
      en: |-
        AWS Artifact documents cover AWS's own controls; they do not show how the company's resources are configured.
      fr: |-
        Les documents AWS Artifact couvrent les contrôles d'AWS lui-même ; ils ne montrent pas comment les ressources de l'entreprise sont configurées.
    d:
      en: |-
        A Well-Architected review is a design questionnaire; it does not evaluate deployed resources continuously against NIST controls.
      fr: |-
        Une revue Well-Architected est un questionnaire de conception ; elle n'évalue pas en continu les ressources déployées par rapport aux contrôles NIST.
references:
  - title: AWS Audit Manager availability change - AWS Audit Manager
    url: https://docs.aws.amazon.com/audit-manager/latest/userguide/audit-manager-availability-change.html
  - title: Conformance Pack Sample Templates for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformancepack-sample-templates.html
