id: scsc03-6b-cfg-guard-custom-policy
objective: "6.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's encryption standard requires every Amazon EBS volume in its workload accounts to be encrypted with an AWS KMS key that belongs to the security account 111122223333. The security team creates new keys in that account regularly, so the rule must accept any key whose ARN is in account 111122223333. AWS Config records all resource types. The team wants each volume to be evaluated whenever it is created or changed, and it does not want to write or maintain Lambda code.

    Which solution will meet these requirements?
  fr: |
    La norme de chiffrement d'AnyCompany exige que chaque volume Amazon EBS de ses comptes de charges de travail soit chiffré avec une clé AWS KMS appartenant au compte de sécurité 111122223333. L'équipe de sécurité crée régulièrement de nouvelles clés dans ce compte : la règle doit donc accepter toute clé dont l'ARN se trouve dans le compte 111122223333. AWS Config enregistre tous les types de ressources. L'équipe veut que chaque volume soit évalué à chaque création ou modification, et elle ne veut ni écrire ni maintenir de code Lambda.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a custom Lambda rule whose function reads the volume's configuration item and calls PutEvaluations with the result of the key ARN check."
        fr: "Créer une règle Lambda personnalisée dont la fonction lit l'élément de configuration du volume et appelle PutEvaluations avec le résultat de la vérification de l'ARN de la clé."
    - id: b
      text:
        en: "Create a custom policy rule in CloudFormation Guard, scoped to AWS::EC2::Volume, that checks that each volume is encrypted with a key ARN in account 111122223333."
        fr: "Créer une règle de politique personnalisée en CloudFormation Guard, dont l'étendue est AWS::EC2::Volume, qui vérifie que chaque volume est chiffré avec un ARN de clé du compte 111122223333."
    - id: c
      text:
        en: "Run the encrypted-volumes managed rule in proactive mode from the deployment pipelines, and submit each volume's properties with StartResourceEvaluation."
        fr: "Exécuter la règle gérée encrypted-volumes en mode proactif depuis les pipelines de déploiement, et soumettre les propriétés de chaque volume avec StartResourceEvaluation."
    - id: d
      text:
        en: "Schedule a daily AWS Config advanced query that lists the volumes whose KMS key ARN is not in account 111122223333, and send the list to the team."
        fr: "Planifier une requête avancée AWS Config quotidienne qui liste les volumes dont l'ARN de clé KMS n'est pas dans le compte 111122223333, et envoyer la liste à l'équipe."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Config custom policy rules evaluate the configuration item with a policy written in the CloudFormation Guard language, so no Lambda function is needed. In detective mode, the rule is triggered by configuration changes of the resources in its scope and reports NON_COMPLIANT volumes like any other rule.
    fr: |-
      Les règles de politique personnalisées AWS Config évaluent l'élément de configuration avec une politique écrite dans le langage CloudFormation Guard : aucune fonction Lambda n'est nécessaire. En mode détectif, la règle est déclenchée par les modifications de configuration des ressources de son étendue et signale les volumes NON_COMPLIANT comme toute autre règle.
  options:
    a:
      en: |-
        A custom Lambda rule meets the logic, but it is Lambda code that the team must write and maintain.
      fr: |-
        Une règle Lambda personnalisée réalise la logique, mais c'est du code Lambda que l'équipe doit écrire et maintenir.
    c:
      en: |-
        Proactive evaluation checks properties before deployment and does not evaluate deployed volumes when they change.
      fr: |-
        L'évaluation proactive vérifie les propriétés avant le déploiement et n'évalue pas les volumes déployés lorsqu'ils changent.
    d:
      en: |-
        An advanced query returns a list on demand; it does not evaluate each change or record compliance results that other services can use.
      fr: |-
        Une requête avancée renvoie une liste à la demande ; elle n'évalue pas chaque modification et n'enregistre pas de résultats de conformité exploitables par d'autres services.
references:
  - title: Creating AWS Config Custom Policy Rules - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config_develop-rules_cfn-guard.html
