id: scsc03-6b-sc-launch-role-name
objective: "6.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's catalog account 111122223333 shares an AWS Service Catalog portfolio through AWS Organizations with the 80 accounts of the Workloads OU. Each product has a launch constraint with the role ARN arn:aws:iam::111122223333:role/SCLaunchRole. Provisioning works in the catalog account but fails in the workload accounts.

    The security team requires that resources in each workload account are created by a least-privilege role that exists in that account, and the catalog team wants to maintain as few constraints and portfolios as possible.

    Which solution will meet these requirements?
  fr: |
    Le compte de catalogue 111122223333 d'AnyCompany partage un portefeuille AWS Service Catalog via AWS Organizations avec les 80 comptes de l'unité d'organisation Workloads. Chaque produit a une contrainte de lancement avec l'ARN de rôle arn:aws:iam::111122223333:role/SCLaunchRole. Le provisionnement fonctionne dans le compte de catalogue mais échoue dans les comptes de charges de travail.

    L'équipe de sécurité exige que les ressources de chaque compte de charge de travail soient créées par un rôle à moindre privilège qui existe dans ce compte, et l'équipe catalogue veut maintenir le moins de contraintes et de portefeuilles possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Keep the launch constraints, and add the workload accounts as principals in the trust policy of SCLaunchRole so that Service Catalog in each account can assume it."
        fr: "Conserver les contraintes de lancement, et ajouter les comptes de charges de travail comme principaux dans la politique d'approbation de SCLaunchRole pour que Service Catalog puisse l'assumer depuis chaque compte."
    - id: b
      text:
        en: "Create one portfolio per workload account, each with launch constraints that use the role ARN of that account, and share each portfolio with its account only."
        fr: "Créer un portefeuille par compte de charge de travail, chacun avec des contraintes de lancement qui utilisent l'ARN de rôle de ce compte, et partager chaque portefeuille avec son seul compte."
    - id: c
      text:
        en: "Change the launch constraints to use the role name SCLaunchRole instead of its ARN, and deploy a role with that name to the catalog account and every Workloads account with StackSets."
        fr: "Modifier les contraintes de lancement pour qu'elles utilisent le nom de rôle SCLaunchRole au lieu de son ARN, et déployer un rôle portant ce nom dans le compte de catalogue et chaque compte Workloads avec StackSets."
    - id: d
      text:
        en: "Ask the administrator of each workload account to replace the launch constraints of the imported portfolio with launch constraints that use a local least-privilege role."
        fr: "Demander à l'administrateur de chaque compte de charge de travail de remplacer les contraintes de lancement du portefeuille importé par des contraintes qui utilisent un rôle local à moindre privilège."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A launch constraint can name a role instead of giving its ARN; each account that uses the constraint then uses the role with that name, which makes the constraint account-agnostic. The role must exist in the account that created the constraint and in the account of the user who launches the product, so a stack set targeting the OU creates it everywhere, including in new accounts.
    fr: |-
      Une contrainte de lancement peut indiquer le nom d'un rôle au lieu de son ARN ; chaque compte qui utilise la contrainte utilise alors le rôle portant ce nom, ce qui rend la contrainte indépendante du compte. Le rôle doit exister dans le compte qui a créé la contrainte et dans le compte de l'utilisateur qui lance le produit : un StackSet ciblant l'unité d'organisation le crée partout, y compris dans les nouveaux comptes.
  options:
    a:
      en: |-
        The resources would be created by a role of the catalog account, not by a role in each workload account, which the security team forbids.
      fr: |-
        Les ressources seraient créées par un rôle du compte de catalogue et non par un rôle de chaque compte de charge de travail, ce que l'équipe de sécurité interdit.
    b:
      en: |-
        Eighty portfolios with their own constraints is the opposite of the requirement to maintain as few constraints and portfolios as possible.
      fr: |-
        Quatre-vingts portefeuilles avec leurs propres contraintes vont à l'encontre de l'exigence de maintenir le moins de contraintes et de portefeuilles possible.
    d:
      en: |-
        Recipients of a shared portfolio cannot change its products or constraints; they can only grant their end users access.
      fr: |-
        Les destinataires d'un portefeuille partagé ne peuvent pas modifier ses produits ni ses contraintes ; ils peuvent seulement donner accès à leurs utilisateurs finaux.
references:
  - title: AWS Service Catalog Launch Constraints - AWS Service Catalog
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/constraints-launch.html
  - title: Sharing a Portfolio - AWS Service Catalog
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/catalogs_portfolios_sharing_how-to-share.html
