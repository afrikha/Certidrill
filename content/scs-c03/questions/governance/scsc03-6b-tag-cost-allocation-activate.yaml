id: scsc03-6b-tag-cost-allocation-activate
objective: "6.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's security team tags all of its resources in the member accounts of its organization in AWS Organizations with CostCenter=SEC-100, including log archive buckets, Amazon OpenSearch Service domains, and forensic instances. The finance team wants to group these costs by CostCenter in AWS Cost Explorer and in the cost and usage reports. An administrator who signs in to a member account cannot find the CostCenter key on any cost allocation tags page.

    Which solution will meet these requirements?
  fr: |
    L'équipe de sécurité d'AnyCompany balise toutes ses ressources des comptes membres de son organisation AWS Organizations avec CostCenter=SEC-100, notamment les compartiments d'archive de journaux, les domaines Amazon OpenSearch Service et les instances de forensique. L'équipe financière veut regrouper ces coûts par CostCenter dans AWS Cost Explorer et dans les rapports de coûts et d'utilisation. Un administrateur qui se connecte à un compte membre ne trouve la clé CostCenter sur aucune page de balises de répartition des coûts.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Sign in to the management account and activate CostCenter as a user-defined cost allocation tag in the Billing and Cost Management console."
        fr: "Se connecter au compte de gestion et activer CostCenter comme balise de répartition des coûts définie par l'utilisateur dans la console Billing and Cost Management."
    - id: b
      text:
        en: "Sign in to each member account and activate CostCenter as a user-defined cost allocation tag in that account's billing console."
        fr: "Se connecter à chaque compte membre et activer CostCenter comme balise de répartition des coûts définie par l'utilisateur dans la console de facturation de ce compte."
    - id: c
      text:
        en: "Attach a tag policy that defines the CostCenter key with its approved values and enforces it for the security team's resource types."
        fr: "Attacher une politique de balises qui définit la clé CostCenter avec ses valeurs approuvées et l'applique aux types de ressources de l'équipe de sécurité."
    - id: d
      text:
        en: "Create a tag-based resource group for CostCenter=SEC-100 in each account and Region, and select the group in Cost Explorer."
        fr: "Créer un groupe de ressources basé sur les balises pour CostCenter=SEC-100 dans chaque compte et chaque Région, puis sélectionner le groupe dans Cost Explorer."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In an organization, only the management account has access to the cost allocation tags manager. Once CostCenter is activated there, it appears with the user: prefix in billing reports and can group costs in Cost Explorer; keys can take up to 24 hours to appear and to activate, and costs incurred before the tags existed are not tagged.
    fr: |-
      Dans une organisation, seul le compte de gestion a accès au gestionnaire de balises de répartition des coûts. Une fois CostCenter activée à cet endroit, elle apparaît avec le préfixe user: dans les rapports de facturation et permet de regrouper les coûts dans Cost Explorer ; les clés peuvent mettre jusqu'à 24 heures à apparaître puis à s'activer, et les coûts antérieurs à la création des balises ne sont pas balisés.
  options:
    b:
      en: |-
        Member accounts of an organization do not have access to the cost allocation tags manager, which is why the administrator cannot find the key.
      fr: |-
        Les comptes membres d'une organisation n'ont pas accès au gestionnaire de balises de répartition des coûts, ce qui explique que l'administrateur ne trouve pas la clé.
    c:
      en: |-
        A tag policy standardizes tag keys and values, but it does not activate a tag for cost allocation.
      fr: |-
        Une politique de balises normalise les clés et les valeurs de balises, mais elle n'active pas une balise pour la répartition des coûts.
    d:
      en: |-
        Resource groups are Regional collections used to manage resources; they do not make a tag available for grouping costs in billing reports.
      fr: |-
        Les groupes de ressources sont des collections régionales servant à gérer les ressources ; ils ne rendent pas une balise disponible pour regrouper les coûts dans les rapports de facturation.
references:
  - title: Using user-defined cost allocation tags - AWS Billing
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/custom-tags.html
  - title: Activating user-defined cost allocation tags - AWS Billing
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/activating-tags.html
