id: scsc03-6b-tag-abac-secrets-untag
objective: "6.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany stores application secrets for many projects in AWS Secrets Manager in a shared account. Each secret carries an access-project tag. Developers federate through a SAML identity provider that passes the session tag access-project, for example access-project=orion, when they assume the Developer role.

    The security team requires that developers read and update only the secrets whose access-project tag matches their own session tag. Developers must not be able to remove the access-project tag from any secret, because backup and monitoring jobs also select secrets by this tag. New projects must not require any change to the policies.

    Which combination of policy statements should the security team add to the Developer role? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    AnyCompany stocke dans AWS Secrets Manager, dans un compte partagé, les secrets d'application de nombreux projets. Chaque secret porte une balise access-project. Les développeurs se fédèrent via un fournisseur d'identité SAML qui transmet la balise de session access-project, par exemple access-project=orion, lorsqu'ils assument le rôle Developer.

    L'équipe de sécurité exige que les développeurs ne lisent et ne mettent à jour que les secrets dont la balise access-project correspond à leur propre balise de session. Les développeurs ne doivent pas pouvoir retirer la balise access-project d'un secret, car les tâches de sauvegarde et de surveillance sélectionnent aussi les secrets selon cette balise. Les nouveaux projets ne doivent exiger aucune modification des politiques.

    Quelle combinaison d'instructions de politique l'équipe de sécurité doit-elle ajouter au rôle Developer ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Allow secretsmanager:GetSecretValue, secretsmanager:DescribeSecret, and secretsmanager:PutSecretValue on all secrets when aws:RequestTag/access-project equals ${aws:PrincipalTag/access-project}."
        fr: "Autoriser secretsmanager:GetSecretValue, secretsmanager:DescribeSecret et secretsmanager:PutSecretValue sur tous les secrets lorsque aws:RequestTag/access-project est égal à ${aws:PrincipalTag/access-project}."
    - id: b
      text:
        en: "Allow secretsmanager:GetSecretValue, secretsmanager:DescribeSecret, and secretsmanager:PutSecretValue on all secrets when aws:ResourceTag/access-project equals ${aws:PrincipalTag/access-project}."
        fr: "Autoriser secretsmanager:GetSecretValue, secretsmanager:DescribeSecret et secretsmanager:PutSecretValue sur tous les secrets lorsque aws:ResourceTag/access-project est égal à ${aws:PrincipalTag/access-project}."
    - id: c
      text:
        en: "Add one Allow statement for each project that lists the ARNs of the project's secrets and requires the matching access-project session tag."
        fr: "Ajouter pour chaque projet une instruction Allow qui liste les ARN des secrets du projet et exige la balise de session access-project correspondante."
    - id: d
      text:
        en: "Deny secretsmanager:UntagResource on all secrets when ForAnyValue:StringEquals matches aws:TagKeys to access-project."
        fr: "Refuser secretsmanager:UntagResource sur tous les secrets lorsque ForAnyValue:StringEquals fait correspondre aws:TagKeys à access-project."
    - id: e
      text:
        en: "Deny secretsmanager:UntagResource on all secrets when ForAllValues:StringNotEquals matches aws:TagKeys to access-project."
        fr: "Refuser secretsmanager:UntagResource sur tous les secrets lorsque ForAllValues:StringNotEquals fait correspondre aws:TagKeys à access-project."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Comparing the secret's tag (aws:ResourceTag) with the caller's session tag (${aws:PrincipalTag/...}) is attribute-based access control: one statement covers every current and future project. Because the tag grants access and drives other jobs, a Deny on secretsmanager:UntagResource whose request contains the access-project key (ForAnyValue on aws:TagKeys) stops developers from removing it.
    fr: |-
      Comparer la balise du secret (aws:ResourceTag) avec la balise de session de l'appelant (${aws:PrincipalTag/...}) constitue un contrôle d'accès basé sur les attributs : une seule instruction couvre tous les projets actuels et futurs. Comme la balise accorde l'accès et pilote d'autres tâches, un refus de secretsmanager:UntagResource dont la requête contient la clé access-project (ForAnyValue sur aws:TagKeys) empêche les développeurs de la retirer.
  options:
    a:
      en: |-
        aws:RequestTag holds the tags passed in a request that creates or tags a resource; reading or updating a secret passes no tags, so the condition never matches.
      fr: |-
        aws:RequestTag contient les balises transmises dans une requête qui crée ou balise une ressource ; la lecture ou la mise à jour d'un secret ne transmet aucune balise, donc la condition ne correspond jamais.
    c:
      en: |-
        Statements per project with secret ARNs must be edited for every new project or secret, which the requirement forbids.
      fr: |-
        Des instructions par projet avec les ARN des secrets doivent être modifiées pour chaque nouveau projet ou secret, ce que l'exigence interdit.
    e:
      en: |-
        ForAllValues:StringNotEquals is true only when none of the keys being removed is access-project, so it blocks the removal of other tags and still allows the removal of access-project.
      fr: |-
        ForAllValues:StringNotEquals n'est vrai que si aucune des clés retirées n'est access-project : la condition bloque le retrait des autres balises et autorise toujours celui d'access-project.
references:
  - title: "IAM tutorial: Define permissions to access AWS resources based on tags - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_attribute-based-access-control.html
  - title: Define permissions based on attributes with ABAC authorization - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html
