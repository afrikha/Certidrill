id: scsc03-6b-wa-milestone-order
objective: "6.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team must show its board that the security posture of an existing workload improves over the next two quarters. The team will use the AWS Well-Architected Tool and wants to compare the number of high-risk issues before and after the improvements.

    Which five steps should the team perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    L'équipe de sécurité d'AnyCompany doit montrer à son conseil d'administration que la posture de sécurité d'une charge de travail existante s'améliore au cours des deux prochains trimestres. L'équipe utilisera l'AWS Well-Architected Tool et veut comparer le nombre de problèmes à risque élevé avant et après les améliorations.

    Quelles sont les cinq étapes que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - id: fix
      text: { en: "Implement the prioritized best practices of the improvement plan and update the answers to reflect them.", fr: "Mettre en œuvre les bonnes pratiques priorisées du plan d'amélioration et mettre à jour les réponses en conséquence." }
    - id: define
      text: { en: "Define the workload in the tool so that the AWS Well-Architected Framework lens is applied.", fr: "Définir la charge de travail dans l'outil pour que l'objectif (lens) AWS Well-Architected Framework soit appliqué." }
    - id: m2
      text: { en: "Save a second milestone and compare its risk counts with the first milestone.", fr: "Enregistrer un deuxième jalon et comparer ses nombres de risques avec ceux du premier jalon." }
    - id: lens
      text: { en: "Create a custom lens and publish it to the organization.", fr: "Créer un objectif (lens) personnalisé et le publier dans l'organisation." }
    - id: answer
      text: { en: "Answer the Security pillar questions and review the high and medium risk issues.", fr: "Répondre aux questions du pilier Sécurité et examiner les problèmes à risque élevé et moyen." }
    - id: m1
      text: { en: "Save a milestone to record the baseline state of the workload.", fr: "Enregistrer un jalon pour consigner l'état de référence de la charge de travail." }
    - id: cspm
      text: { en: "Enable the AWS Foundational Security Best Practices standard in Security Hub CSPM.", fr: "Activer la norme AWS Foundational Security Best Practices dans Security Hub CSPM." }
answer:
  sequence: [define, answer, m1, fix, m2]
explanation:
  correct:
    en: "Defining the workload applies the Framework lens automatically. Answering the Security pillar questions produces the risk issues and the improvement plan. A milestone records the state of the workload at a point in time, so one is saved after the initial review as a baseline, and another after the improvements to measure progress."
    fr: "Définir la charge de travail applique automatiquement l'objectif Framework. Répondre aux questions du pilier Sécurité produit les problèmes à risque et le plan d'amélioration. Un jalon enregistre l'état de la charge de travail à un instant donné : on en enregistre un après la revue initiale comme référence, puis un autre après les améliorations pour mesurer les progrès."
  options:
    lens:
      en: "The requirement is measured against AWS best practices with the Framework lens; a custom lens is not needed."
      fr: "L'exigence se mesure par rapport aux bonnes pratiques AWS avec l'objectif Framework ; un objectif personnalisé n'est pas nécessaire."
    cspm:
      en: "Security Hub CSPM findings are not part of the milestones of a Well-Architected review."
      fr: "Les résultats de Security Hub CSPM ne font pas partie des jalons d'une revue Well-Architected."
references:
  - title: Milestones - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/milestones.html
  - title: Using lenses in AWS WA Tool - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/lenses.html
