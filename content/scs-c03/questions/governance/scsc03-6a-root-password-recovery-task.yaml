id: scsc03-6a-root-password-recovery-task
objective: "6.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany has centralized root access for its member accounts, with the security tooling account as the IAM delegated administrator, and has deleted all member root credentials. A business team must register one member account as a seller in the Amazon EC2 Reserved Instance Marketplace, a task that requires signing in as the root user. The security team wants the least root exposure, and no root credentials may remain in the account afterward.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany a centralisé l'accès racine de ses comptes membres, avec le compte d'outillage de sécurité comme administrateur délégué IAM, et a supprimé toutes les informations racine des comptes membres. Une équipe métier doit inscrire un compte membre comme vendeur sur l'Amazon EC2 Reserved Instance Marketplace, une tâche qui exige une connexion en tant qu'utilisateur racine. L'équipe de sécurité veut la plus faible exposition racine possible, et aucune information racine ne doit rester dans le compte ensuite.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Perform Allow password recovery for the account, let the root email owner reset the password and do the task, and then delete the root credentials again.
        fr: |-
          Effectuer Allow password recovery pour le compte, laisser le titulaire de l'e-mail racine réinitialiser le mot de passe et effectuer la tâche, puis supprimer de nouveau les informations racine.
    - id: b
      text:
        en: |-
          Call sts:AssumeRoot for the account with the S3UnlockBucketPolicy task policy, and register the account as a seller with that session.
        fr: |-
          Appeler sts:AssumeRoot pour le compte avec la politique de tâche S3UnlockBucketPolicy, et inscrire le compte comme vendeur avec cette session.
    - id: c
      text:
        en: |-
          Switch to OrganizationAccountAccessRole in the account from the management account, and register the account as a seller with that role.
        fr: |-
          Basculer vers OrganizationAccountAccessRole dans le compte depuis le compte de gestion, et inscrire le compte comme vendeur avec ce rôle.
    - id: d
      text:
        en: |-
          Disable centralized root access for the organization, recover the root password of the account, and keep it in a vault for future tasks.
        fr: |-
          Désactiver l'accès racine centralisé pour l'organisation, récupérer le mot de passe racine du compte et le conserver dans un coffre pour les tâches futures.
answer:
  optionId: a
explanation:
  correct:
    en: |-
      Registering as a Reserved Instance Marketplace seller requires root sign-in. The management account or the IAM delegated administrator can perform the Allow password recovery task (IAMCreateRootUserPassword), after which the owner of the root email inbox resets the password; AWS recommends deleting the root credentials again when the task is done.
    fr: |-
      L'inscription comme vendeur sur la Reserved Instance Marketplace exige une connexion racine. Le compte de gestion ou l'administrateur délégué IAM peut effectuer la tâche Allow password recovery (IAMCreateRootUserPassword), après quoi le titulaire de la boîte e-mail racine réinitialise le mot de passe ; AWS recommande de supprimer de nouveau les informations racine une fois la tâche terminée.
  options:
    b:
      en: |-
        A root session is limited to its task policy, and S3UnlockBucketPolicy only allows deleting a bucket policy.
      fr: |-
        Une session racine est limitée à sa politique de tâche, et S3UnlockBucketPolicy permet seulement de supprimer une politique de compartiment.
    c:
      en: |-
        The task requires the root user; an IAM role, even with administrator permissions, cannot perform it.
      fr: |-
        La tâche exige l'utilisateur racine ; un rôle IAM, même avec des autorisations d'administrateur, ne peut pas l'effectuer.
    d:
      en: |-
        Disabling the feature affects the whole organization, and keeping the password leaves root credentials in the account.
      fr: |-
        Désactiver la fonctionnalité affecte toute l'organisation, et conserver le mot de passe laisse des informations racine dans le compte.
references:
  - title: "Perform a privileged task on an AWS Organizations member account - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user-privileged-task.html
  - title: "AWS account root user - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
