id: scsc03-6a-iac-stackset-drift
objective: "6.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany deployed a security baseline, including security groups, to 50 accounts with one AWS CloudFormation StackSet. The security team suspects that some account administrators changed security group rules manually. The team must identify which stack instances have resources that differ from the StackSet template, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany a déployé une référence de sécurité, qui comprend des groupes de sécurité, dans 50 comptes avec un seul StackSet AWS CloudFormation. L'équipe de sécurité soupçonne certains administrateurs de comptes d'avoir modifié manuellement des règles de groupe de sécurité. L'équipe doit identifier les instances de pile dont les ressources diffèrent du modèle du StackSet, avec le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Update the StackSet with the same template so that CloudFormation reports the accounts it changes.
        fr: |-
          Mettre à jour le StackSet avec le même modèle afin que CloudFormation signale les comptes qu'il modifie.
    - id: b
      text:
        en: |-
          Search the AWS CloudTrail event history of each account for security group API calls.
        fr: |-
          Rechercher dans l'historique des événements AWS CloudTrail de chaque compte les appels d'API sur les groupes de sécurité.
    - id: c
      text:
        en: |-
          Delete the stack instances, and create them again from the StackSet template.
        fr: |-
          Supprimer les instances de pile, puis les recréer à partir du modèle du StackSet.
    - id: d
      text:
        en: |-
          Run drift detection on the StackSet, and list the stack instances whose drift status is DRIFTED.
        fr: |-
          Exécuter la détection de dérive sur le StackSet, et lister les instances de pile dont le statut de dérive est DRIFTED.
answer:
  optionId: d
explanation:
  correct:
    en: |-
      StackSet drift detection compares the current state of each resource in every stack instance with its expected state from the template and parameters. Stack instances with a drifted resource get the DRIFTED status, and the per-instance resource drifts show what was modified or deleted.
    fr: |-
      La détection de dérive des StackSets compare l'état actuel de chaque ressource de chaque instance de pile à son état attendu d'après le modèle et les paramètres. Les instances de pile qui ont une ressource en dérive reçoivent le statut DRIFTED, et les dérives de ressources par instance montrent ce qui a été modifié ou supprimé.
  options:
    a:
      en: |-
        An update with an unchanged template does not report which resources were changed outside CloudFormation.
      fr: |-
        Une mise à jour avec un modèle inchangé ne signale pas quelles ressources ont été modifiées en dehors de CloudFormation.
    b:
      en: |-
        Reviewing CloudTrail in 50 accounts is manual work and does not compare resources with the template.
      fr: |-
        Examiner CloudTrail dans 50 comptes est un travail manuel et ne compare pas les ressources au modèle.
    c:
      en: |-
        Recreating the instances overwrites the evidence and does not identify the drifted accounts.
      fr: |-
        Recréer les instances écrase les preuves et n'identifie pas les comptes en dérive.
references:
  - title: "Performing drift detection on CloudFormation StackSets - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-drift.html
