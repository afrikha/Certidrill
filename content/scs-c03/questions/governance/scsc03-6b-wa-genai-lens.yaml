id: scsc03-6b-wa-genai-lens
objective: "6.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is building a customer support assistant on Amazon Bedrock. The workload is already reviewed in the AWS Well-Architected Tool with the AWS Well-Architected Framework lens. The security architect must also review the design against official AWS best practices that are specific to generative AI workloads, such as prompt and data protection and responsible use, with the same answers, risks, and improvement plan workflow in the tool. The architect wants the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany construit un assistant de support client sur Amazon Bedrock. La charge de travail est déjà passée en revue dans l'AWS Well-Architected Tool avec l'objectif (lens) AWS Well-Architected Framework. L'architecte sécurité doit aussi passer en revue la conception par rapport aux bonnes pratiques AWS officielles propres aux charges de travail d'IA générative, comme la protection des invites et des données et l'utilisation responsable, avec le même flux de réponses, de risques et de plan d'amélioration dans l'outil. L'architecte veut le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Write a custom lens from the OWASP Top 10 for LLM Applications, and share it with the workload's account."
        fr: "Rédiger un objectif (lens) personnalisé à partir de l'OWASP Top 10 for LLM Applications, et le partager avec le compte de la charge de travail."
    - id: b
      text:
        en: "Add the Generative AI lens from the Lens Catalog to the workload, and answer its questions."
        fr: "Ajouter l'objectif (lens) Generative AI du Lens Catalog à la charge de travail, et répondre à ses questions."
    - id: c
      text:
        en: "Enable the AI Security Best Practices standard in Security Hub CSPM in the workload account."
        fr: "Activer la norme AI Security Best Practices dans Security Hub CSPM dans le compte de la charge de travail."
    - id: d
      text:
        en: "Add the Machine Learning lens from the Lens Catalog to the workload, and answer its questions."
        fr: "Ajouter l'objectif (lens) Machine Learning du Lens Catalog à la charge de travail, et répondre à ses questions."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Lens Catalog contains official lenses created and maintained by AWS, available without installation, including a Generative AI lens. Adding it to the workload gives its own questions, best practices, notes, and improvement plan next to the Framework lens.
    fr: |-
      Le Lens Catalog contient des objectifs officiels créés et maintenus par AWS, disponibles sans installation, dont un objectif Generative AI. L'ajouter à la charge de travail apporte ses propres questions, bonnes pratiques, notes et plan d'amélioration à côté de l'objectif Framework.
  options:
    a:
      en: |-
        A custom lens is user-defined content, not official AWS guidance, and writing it takes far more effort than applying a catalog lens.
      fr: |-
        Un objectif personnalisé est un contenu défini par l'utilisateur, pas une recommandation officielle d'AWS, et le rédiger demande bien plus d'efforts qu'appliquer un objectif du catalogue.
    c:
      en: |-
        A Security Hub CSPM standard runs automated checks on deployed resources; it is not a design review with answers and an improvement plan in the Well-Architected Tool.
      fr: |-
        Une norme Security Hub CSPM exécute des vérifications automatisées sur les ressources déployées ; ce n'est pas une revue de conception avec réponses et plan d'amélioration dans le Well-Architected Tool.
    d:
      en: |-
        The Machine Learning lens covers the machine learning lifecycle in general; the Generative AI lens is the one that targets generative AI workloads.
      fr: |-
        L'objectif Machine Learning couvre le cycle de vie du machine learning en général ; c'est l'objectif Generative AI qui cible les charges de travail d'IA générative.
references:
  - title: Lens Catalog for AWS WA Tool - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/lens-catalog.html
  - title: Using lenses in AWS WA Tool - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/lenses.html
