id: scsc03-6a-deleg-scp-applies-admin
objective: "6.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany attached an SCP to its organization root that denies guardduty:UpdateOrganizationConfiguration and guardduty:UpdateDetector to every principal. The security tooling account is the GuardDuty delegated administrator. Engineers who use the GuardDutyOps role in that account now receive access denied errors when they change the auto-enable settings. The GuardDutyOps role must be able to manage the GuardDuty configuration, and every other principal in the member accounts must stay blocked, following least privilege.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany a attaché à la racine de son organisation une SCP qui refuse guardduty:UpdateOrganizationConfiguration et guardduty:UpdateDetector à tous les principaux. Le compte d'outillage de sécurité est l'administrateur délégué GuardDuty. Les ingénieurs qui utilisent le rôle GuardDutyOps de ce compte reçoivent maintenant des erreurs d'accès refusé lorsqu'ils modifient les paramètres d'activation automatique. Le rôle GuardDutyOps doit pouvoir gérer la configuration de GuardDuty, et tous les autres principaux des comptes membres doivent rester bloqués, dans le respect du moindre privilège.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP to the security tooling account that allows the two GuardDuty actions for the GuardDutyOps role.
        fr: |-
          Attacher au compte d'outillage de sécurité une SCP qui autorise les deux actions GuardDuty pour le rôle GuardDutyOps.
    - id: b
      text:
        en: |-
          Add a condition to the deny statement that excludes the GuardDutyOps role ARN with ArnNotLike on aws:PrincipalArn.
        fr: |-
          Ajouter à l'instruction de refus une condition qui exclut l'ARN du rôle GuardDutyOps avec ArnNotLike sur aws:PrincipalArn.
    - id: c
      text:
        en: |-
          Make the management account the GuardDuty delegated administrator, because SCPs do not affect the management account.
        fr: |-
          Faire du compte de gestion l'administrateur délégué GuardDuty, car les SCP n'affectent pas le compte de gestion.
    - id: d
      text:
        en: |-
          Move the security tooling account directly under the organization root so that OU-level policies no longer apply.
        fr: |-
          Déplacer le compte d'outillage de sécurité directement sous la racine de l'organisation afin que les politiques des OU ne s'appliquent plus.
answer:
  optionId: b
explanation:
  correct:
    en: |-
      A delegated administrator account is a member account, so SCPs apply to it like any other member account. Excluding only the GuardDutyOps role from the deny statement with an aws:PrincipalArn condition lets that role manage GuardDuty while the deny still applies to every other principal.
    fr: |-
      Un compte d'administrateur délégué est un compte membre : les SCP s'y appliquent comme à tout autre compte membre. Exclure uniquement le rôle GuardDutyOps de l'instruction de refus avec une condition aws:PrincipalArn permet à ce rôle de gérer GuardDuty, tandis que le refus s'applique toujours à tous les autres principaux.
  options:
    a:
      en: |-
        An explicit deny in the root SCP wins over any allow, so another SCP cannot restore the actions.
      fr: |-
        Un refus explicite dans la SCP de la racine l'emporte sur toute autorisation : une autre SCP ne peut pas rétablir les actions.
    c:
      en: |-
        Administering security services from the management account is not recommended, and it would place the work outside any SCP guardrail.
      fr: |-
        Administrer les services de sécurité depuis le compte de gestion est déconseillé, et cela placerait le travail hors de toute protection par SCP.
    d:
      en: |-
        The SCP is attached to the root, so it still applies to an account placed directly under the root.
      fr: |-
        La SCP est attachée à la racine : elle s'applique donc toujours à un compte placé directement sous la racine.
references:
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
