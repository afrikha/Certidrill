id: scsc03-6a-org-order-all-features
objective: "6.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany created its organization in AWS Organizations years ago with only consolidated billing features. The organization has 12 accounts that were created with Organizations and 8 accounts that were invited. The security team must attach a new SCP to the Workloads OU.

    Which five actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |-
    AnyCompany a créé son organisation AWS Organizations il y a plusieurs années avec uniquement les fonctionnalités de facturation consolidée. L'organisation compte 12 comptes créés avec Organizations et 8 comptes invités. L'équipe de sécurité doit attacher une nouvelle SCP à l'OU Workloads.

    Quelles sont les cinq actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - id: accept
      text:
        en: |-
          In each invited account, accept the request to enable all features.
        fr: |-
          Dans chaque compte invité, accepter la demande d'activation de toutes les fonctionnalités.
    - id: attach
      text:
        en: |-
          Attach the new SCP to the Workloads OU.
        fr: |-
          Attacher la nouvelle SCP à l'OU Workloads.
    - id: begin
      text:
        en: |-
          In the management account, begin the process to enable all features.
        fr: |-
          Dans le compte de gestion, démarrer le processus d'activation de toutes les fonctionnalités.
    - id: created
      text:
        en: |-
          In each account that was created with Organizations, accept the request to enable all features.
        fr: |-
          Dans chaque compte créé avec Organizations, accepter la demande d'activation de toutes les fonctionnalités.
    - id: finalize
      text:
        en: |-
          In the management account, finalize the process to enable all features.
        fr: |-
          Dans le compte de gestion, finaliser le processus d'activation de toutes les fonctionnalités.
    - id: type
      text:
        en: |-
          Enable the service control policy type on the organization root.
        fr: |-
          Activer le type de politique SCP (service control policy) sur la racine de l'organisation.
    - id: detach
      text:
        en: |-
          Detach the FullAWSAccess policy from the organization root.
        fr: |-
          Détacher la politique FullAWSAccess de la racine de l'organisation.
answer:
  sequence: [begin, accept, finalize, type, attach]
explanation:
  correct:
    en: |-
      SCPs require all features. The standard migration starts with a request from the management account, then every invited account must accept it, and the management account finalizes the change once all invited accounts have accepted. The SCP policy type must then be enabled on the root before any SCP can be attached to an OU.
    fr: |-
      Les SCP exigent toutes les fonctionnalités. La migration standard commence par une demande du compte de gestion, puis chaque compte invité doit l'accepter, et le compte de gestion finalise le changement une fois que tous les comptes invités ont accepté. Le type de politique SCP doit ensuite être activé sur la racine avant de pouvoir attacher une SCP à une OU.
  options:
    created:
      en: |-
        Accounts created with Organizations do not need to approve the request, because the management account already controls them.
      fr: |-
        Les comptes créés avec Organizations n'ont pas besoin d'approuver la demande, car le compte de gestion les contrôle déjà.
    detach:
      en: |-
        Removing FullAWSAccess without another allow policy makes every action in member accounts fail.
      fr: |-
        Retirer FullAWSAccess sans autre politique d'autorisation fait échouer toutes les actions dans les comptes membres.
references:
  - title: "Standard migration process to enable all features with Organizations - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/manage-begin-all-features-standard-migration.html
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
