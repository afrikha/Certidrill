id: scsc03-6b-ram-ssm-securestring
objective: "6.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's platform account stores the parameter /shared/proxy/credentials in AWS Systems Manager Parameter Store. It is a SecureString parameter in the standard tier, encrypted with the AWS managed key aws/ssm. Applications in every account of the Workloads OU, including future accounts, must read this parameter. The platform team must keep a single copy, and consumers must not be able to modify it. The consumers' IAM roles already allow ssm:GetParameter and kms:Decrypt, and sharing with AWS Organizations is enabled in AWS RAM.

    Which combination of steps will meet these requirements? (Choose three.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le compte plateforme d'AnyCompany stocke le paramètre /shared/proxy/credentials dans AWS Systems Manager Parameter Store. C'est un paramètre SecureString du niveau standard, chiffré avec la clé gérée par AWS aws/ssm. Les applications de chaque compte de l'unité d'organisation Workloads, y compris les futurs comptes, doivent lire ce paramètre. L'équipe plateforme doit conserver une seule copie, et les consommateurs ne doivent pas pouvoir le modifier. Les rôles IAM des consommateurs autorisent déjà ssm:GetParameter et kms:Decrypt, et le partage avec AWS Organizations est activé dans AWS RAM.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez trois réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text:
        en: "Change the parameter to the advanced tier."
        fr: "Passer le paramètre au niveau avancé."
    - id: b
      text:
        en: "Create a grant on the aws/ssm key that allows the consumer roles to call kms:Decrypt."
        fr: "Créer sur la clé aws/ssm un octroi qui autorise les rôles consommateurs à appeler kms:Decrypt."
    - id: c
      text:
        en: "Encrypt the parameter with a customer managed key whose key policy allows the consumer accounts' roles to call kms:Decrypt."
        fr: "Chiffrer le paramètre avec une clé gérée par le client dont la politique de clé autorise les rôles des comptes consommateurs à appeler kms:Decrypt."
    - id: d
      text:
        en: "Configure the applications to call GetParameter with the name /shared/proxy/credentials."
        fr: "Configurer les applications pour qu'elles appellent GetParameter avec le nom /shared/proxy/credentials."
    - id: e
      text:
        en: "Create an AWS RAM resource share of the parameter with the Workloads OU as principal and the AWSRAMDefaultPermissionSSMParameterReadOnly managed permission."
        fr: "Créer un partage de ressources AWS RAM du paramètre avec l'unité d'organisation Workloads comme principal et l'autorisation gérée AWSRAMDefaultPermissionSSMParameterReadOnly."
    - id: f
      text:
        en: "Use the AWSRAMPermissionSSMParameterReadOnlyWithHistory managed permission so that consumers can decrypt earlier versions of the parameter."
        fr: "Utiliser l'autorisation gérée AWSRAMPermissionSSMParameterReadOnlyWithHistory pour que les consommateurs puissent déchiffrer les versions antérieures du paramètre."
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      Only advanced-tier parameters can be shared. A shared SecureString parameter must be encrypted with a customer managed key that is shared separately through its key policy, because AWS managed keys cannot be shared. The AWS RAM share with the OU gives every current and future account read-only access: consumers cannot update, delete, or reshare the parameter.
    fr: |-
      Seuls les paramètres du niveau avancé peuvent être partagés. Un paramètre SecureString partagé doit être chiffré avec une clé gérée par le client, partagée séparément via sa politique de clé, car les clés gérées par AWS ne peuvent pas être partagées. Le partage AWS RAM avec l'unité d'organisation donne à chaque compte actuel et futur un accès en lecture seule : les consommateurs ne peuvent ni mettre à jour, ni supprimer, ni repartager le paramètre.
  options:
    b:
      en: |-
        The key policy of an AWS managed key cannot be changed and these keys cannot be shared with other accounts.
      fr: |-
        La politique d'une clé gérée par AWS ne peut pas être modifiée, et ces clés ne peuvent pas être partagées avec d'autres comptes.
    d:
      en: |-
        Retrieving a parameter shared from another account requires its full ARN; the name alone resolves to a parameter in the caller's own account.
      fr: |-
        Récupérer un paramètre partagé depuis un autre compte exige son ARN complet ; le nom seul désigne un paramètre du compte de l'appelant.
    f:
      en: |-
        This permission only adds GetParameterHistory to the read-only actions; decryption still depends on the KMS key, and the history is not required.
      fr: |-
        Cette autorisation ajoute seulement GetParameterHistory aux actions en lecture seule ; le déchiffrement dépend toujours de la clé KMS, et l'historique n'est pas demandé.
references:
  - title: Working with shared parameters in Parameter Store - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-shared-parameters.html
  - title: Managing permissions in AWS RAM - AWS Resource Access Manager
    url: https://docs.aws.amazon.com/ram/latest/userguide/security-ram-permissions.html
