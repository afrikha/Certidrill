id: scsc03-6b-am-delegation
objective: "6.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is an existing AWS Audit Manager customer and runs an assessment based on a PCI DSS framework. The network controls in one control set must be reviewed by the network team lead, who is not an audit owner of the assessment. She must review those controls and their evidence, add comments, and then return the work to the audit owner. She must not receive ownership of the whole assessment.

    Which solution will meet these requirements?
  fr: |
    AnyCompany est déjà cliente d'AWS Audit Manager et mène une évaluation fondée sur un cadre PCI DSS. Les contrôles réseau d'un ensemble de contrôles doivent être revus par la responsable de l'équipe réseau, qui n'est pas responsable de l'audit de l'évaluation. Elle doit examiner ces contrôles et leurs preuves, ajouter des commentaires, puis renvoyer le travail au responsable de l'audit. Elle ne doit pas recevoir la propriété de toute l'évaluation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add the network team lead as an additional audit owner of the assessment."
        fr: "Ajouter la responsable de l'équipe réseau comme responsable de l'audit supplémentaire de l'évaluation."
    - id: b
      text:
        en: "Generate an assessment report with the network control set's evidence and send it to the network team lead."
        fr: "Générer un rapport d'évaluation avec les preuves de l'ensemble de contrôles réseau et l'envoyer à la responsable de l'équipe réseau."
    - id: c
      text:
        en: "Export the evidence of the network control set to an S3 bucket and give the network team lead read access to the bucket."
        fr: "Exporter les preuves de l'ensemble de contrôles réseau vers un compartiment S3 et donner à la responsable de l'équipe réseau un accès en lecture au compartiment."
    - id: d
      text:
        en: "Delegate the network control set to the network team lead for review."
        fr: "Déléguer l'ensemble de contrôles réseau à la responsable de l'équipe réseau pour revue."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Delegations let an audit owner assign a control set of an assessment to a delegate with the right expertise. The delegate reviews the controls and their evidence, adds comments, marks controls as reviewed, and submits the control set back to the audit owner, without owning the assessment.
    fr: |-
      Les délégations permettent à un responsable de l'audit d'attribuer un ensemble de contrôles d'une évaluation à un délégué qui a l'expertise requise. Le délégué examine les contrôles et leurs preuves, ajoute des commentaires, marque les contrôles comme revus et renvoie l'ensemble de contrôles au responsable de l'audit, sans posséder l'évaluation.
  options:
    a:
      en: |-
        An audit owner manages the whole assessment, which gives more access than the review of one control set requires.
      fr: |-
        Un responsable de l'audit gère toute l'évaluation, ce qui donne plus d'accès que n'en exige la revue d'un seul ensemble de contrôles.
    b:
      en: |-
        An assessment report is a deliverable for auditors; the reviewer could not comment on the controls or return them to the audit owner in Audit Manager.
      fr: |-
        Un rapport d'évaluation est un livrable destiné aux auditeurs ; la relectrice ne pourrait ni commenter les contrôles ni les renvoyer au responsable de l'audit dans Audit Manager.
    c:
      en: |-
        Exported files leave the review workflow, so comments and the return to the audit owner would not be tracked in the assessment.
      fr: |-
        Les fichiers exportés sortent du flux de revue : les commentaires et le renvoi au responsable de l'audit ne seraient pas suivis dans l'évaluation.
references:
  - title: Delegations in AWS Audit Manager - AWS Audit Manager
    url: https://docs.aws.amazon.com/audit-manager/latest/userguide/delegate.html
