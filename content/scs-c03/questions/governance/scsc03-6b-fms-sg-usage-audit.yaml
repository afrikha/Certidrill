id: scsc03-6b-fms-sg-usage-audit
objective: "6.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    After years of growth, the accounts of AnyCompany's organization in AWS Organizations contain thousands of VPC security groups. Many are not attached to any elastic network interface, and many others duplicate the rules of another group. AWS Firewall Manager is set up, and AWS Config records all resource types, including indirect relationships, in every account and Region.

    The security team wants to remove security groups that stay unused for more than 30 days and to consolidate redundant security groups, in all accounts, managed centrally from Firewall Manager.

    Which solution will meet these requirements?
  fr: |
    Après des années de croissance, les comptes de l'organisation AWS Organizations d'AnyCompany contiennent des milliers de groupes de sécurité VPC. Beaucoup ne sont attachés à aucune interface réseau Elastic, et beaucoup d'autres reprennent les règles d'un autre groupe. AWS Firewall Manager est configuré, et AWS Config enregistre tous les types de ressources, y compris les relations indirectes, dans chaque compte et chaque Région.

    L'équipe de sécurité veut supprimer les groupes de sécurité qui restent inutilisés plus de 30 jours et regrouper les groupes de sécurité redondants, dans tous les comptes, avec une gestion centralisée depuis Firewall Manager.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a common security group policy with a primary security group, and remediate all in-scope EC2 instances so that they use the replicated group."
        fr: "Créer une politique de groupe de sécurité commun avec un groupe de sécurité principal, et corriger toutes les instances EC2 concernées pour qu'elles utilisent le groupe répliqué."
    - id: b
      text:
        en: "Create a content audit security group policy with managed audit policy rules that audit overly permissive security group rules, with auto remediation."
        fr: "Créer une politique d'audit de contenu des groupes de sécurité avec des règles de politique d'audit gérées qui auditent les règles trop permissives, avec la correction automatique."
    - id: c
      text:
        en: "Create a network ACL policy whose first and last rules reproduce the rules of the most common security groups, with auto remediation."
        fr: "Créer une politique de liste ACL réseau dont les premières et dernières règles reproduisent les règles des groupes de sécurité les plus courants, avec la correction automatique."
    - id: d
      text:
        en: "Create a usage audit security group policy that requires groups to be used by at least one resource after 43,200 minutes and to be unique, with auto remediation."
        fr: "Créer une politique d'audit d'utilisation des groupes de sécurité qui exige que les groupes soient utilisés par au moins une ressource après 43 200 minutes et qu'ils soient uniques, avec la correction automatique."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Usage audit security group policies clean up unused and redundant security groups. The rule that groups must be used by at least one resource removes unused groups, optionally after a delay in minutes (43,200 minutes is 30 days, which requires indirect relationships in AWS Config), and the uniqueness rule consolidates redundant groups so that only one is associated with the resources.
    fr: |-
      Les politiques d'audit d'utilisation des groupes de sécurité nettoient les groupes de sécurité inutilisés et redondants. La règle qui exige l'utilisation par au moins une ressource supprime les groupes inutilisés, éventuellement après un délai en minutes (43 200 minutes correspondent à 30 jours, ce qui exige les relations indirectes dans AWS Config), et la règle d'unicité regroupe les groupes redondants pour qu'un seul soit associé aux ressources.
  options:
    a:
      en: |-
        A common security group policy replicates a primary group to in-scope resources; it adds groups but does not remove unused or redundant ones.
      fr: |-
        Une politique de groupe de sécurité commun réplique un groupe principal vers les ressources concernées ; elle ajoute des groupes mais ne supprime pas les groupes inutilisés ou redondants.
    b:
      en: |-
        A content audit policy checks the rules inside security groups, for example overly permissive rules; it does not look at whether groups are used or duplicated.
      fr: |-
        Une politique d'audit de contenu vérifie les règles des groupes de sécurité, par exemple les règles trop permissives ; elle ne regarde pas si les groupes sont utilisés ou dupliqués.
    c:
      en: |-
        A network ACL policy manages subnet-level rules and leaves the security groups untouched.
      fr: |-
        Une politique de liste ACL réseau gère des règles au niveau du sous-réseau et ne touche pas aux groupes de sécurité.
references:
  - title: Using security group policies in Firewall Manager to manage Amazon VPC security groups - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/security-group-policies.html
  - title: Creating an AWS Firewall Manager policy - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/create-policy.html
