id: scsc03-6a-org-delegate-policy-mgmt
objective: "6.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's security engineers create, update, attach, and detach SCPs by signing in to the management account of the organization in AWS Organizations. The company wants the engineers to manage SCPs from the security tooling account instead, and it wants to remove all of their access to the management account. The solution must use a native AWS Organizations capability.

    Which solution will meet these requirements?
  fr: |-
    Les ingénieurs sécurité d'AnyCompany créent, mettent à jour, attachent et détachent des SCP en se connectant au compte de gestion de l'organisation AWS Organizations. L'entreprise veut que les ingénieurs gèrent plutôt les SCP depuis le compte d'outillage de sécurité, et elle veut supprimer tous leurs accès au compte de gestion. La solution doit utiliser une fonctionnalité native d'AWS Organizations.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM role in the management account that trusts the security tooling account and allows the SCP actions, and let the engineers assume it.
        fr: |-
          Créer dans le compte de gestion un rôle IAM qui approuve le compte d'outillage de sécurité et autorise les actions sur les SCP, et permettre aux ingénieurs de l'assumer.
    - id: b
      text:
        en: |-
          Attach an SCP to the Security OU that allows the Organizations policy management actions for principals of the security tooling account.
        fr: |-
          Attacher à l'OU Security une SCP qui autorise les actions de gestion des politiques Organizations pour les principaux du compte d'outillage de sécurité.
    - id: c
      text:
        en: |-
          Register the security tooling account as a delegated administrator for CloudFormation StackSets, and deploy the SCPs as stack instances.
        fr: |-
          Enregistrer le compte d'outillage de sécurité comme administrateur délégué pour CloudFormation StackSets, et déployer les SCP sous forme d'instances de pile.
    - id: d
      text:
        en: |-
          From the management account, create a resource-based delegation policy that allows the security tooling account to perform the SCP management actions.
        fr: |-
          Depuis le compte de gestion, créer une politique de délégation basée sur les ressources qui autorise le compte d'outillage de sécurité à effectuer les actions de gestion des SCP.
answer:
  optionId: d
explanation:
  correct:
    en: |-
      AWS Organizations can delegate policy management to member accounts through a resource-based delegation policy created in the management account. The security tooling account then manages SCPs with its own principals, which follows the best practice of using the management account only for tasks that must run there.
    fr: |-
      AWS Organizations peut déléguer la gestion des politiques à des comptes membres au moyen d'une politique de délégation basée sur les ressources créée dans le compte de gestion. Le compte d'outillage de sécurité gère alors les SCP avec ses propres principaux, ce qui respecte la bonne pratique consistant à n'utiliser le compte de gestion que pour les tâches qui doivent s'y exécuter.
  options:
    a:
      en: |-
        Assuming a role in the management account is still access to the management account, which the company wants to remove.
      fr: |-
        Assumer un rôle dans le compte de gestion reste un accès au compte de gestion, que l'entreprise veut supprimer.
    b:
      en: |-
        SCPs never grant permissions, and organization policy actions are reserved to the management account unless they are delegated.
      fr: |-
        Les SCP n'accordent jamais d'autorisations, et les actions sur les politiques d'organisation sont réservées au compte de gestion tant qu'elles ne sont pas déléguées.
    c:
      en: |-
        StackSets deploy stacks into member accounts; SCPs are organization resources that a member account cannot manage without Organizations delegation.
      fr: |-
        StackSets déploie des piles dans les comptes membres ; les SCP sont des ressources d'organisation qu'un compte membre ne peut pas gérer sans délégation Organizations.
references:
  - title: "Delegated administrator for AWS Organizations - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_delegate_policies.html
