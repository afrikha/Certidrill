id: scsc03-6a-deleg-macie-prior-admin
objective: "6.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's security tooling account is the Macie delegated administrator, with automatic enablement turned on for new accounts. AnyCompany acquired a company, and six of its accounts joined the organization. Before they joined, those accounts were Macie member accounts of the acquired company's own Macie administrator account, through invitations. After they joined, the six accounts did not become members of the security tooling account. The security team must manage Macie for these accounts from the security tooling account.

    Which solution will meet these requirements?
  fr: |-
    Le compte d'outillage de sécurité d'AnyCompany est l'administrateur délégué Macie, avec l'activation automatique activée pour les nouveaux comptes. AnyCompany a racheté une entreprise, et six de ses comptes ont rejoint l'organisation. Avant de la rejoindre, ces comptes étaient des comptes membres Macie du compte administrateur Macie de l'entreprise rachetée, par invitation. Après avoir rejoint l'organisation, les six comptes ne sont pas devenus membres du compte d'outillage de sécurité. L'équipe de sécurité doit gérer Macie pour ces comptes depuis le compte d'outillage de sécurité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn automatic enablement off and then on again in the security tooling account so that it evaluates the six accounts again.
        fr: |-
          Désactiver puis réactiver l'activation automatique dans le compte d'outillage de sécurité afin qu'il évalue de nouveau les six comptes.
    - id: b
      text:
        en: |-
          Suspend Macie in the six accounts so that automatic enablement adds them to the security tooling account.
        fr: |-
          Suspendre Macie dans les six comptes afin que l'activation automatique les ajoute au compte d'outillage de sécurité.
    - id: c
      text:
        en: |-
          Designate the acquired company's Macie administrator account as a second Macie delegated administrator for the six accounts.
        fr: |-
          Désigner le compte administrateur Macie de l'entreprise rachetée comme second administrateur délégué Macie pour les six comptes.
    - id: d
      text:
        en: |-
          Have each of the six accounts disassociate from its current Macie administrator, and then add them as members.
        fr: |-
          Faire dissocier chacun des six comptes de son administrateur Macie actuel, puis les ajouter comme membres.
answer:
  optionId: d
explanation:
  correct:
    en: |-
      Macie does not automatically add a new organization account that is already associated with another Macie administrator. The account must disassociate from that administrator first; the delegated administrator can then add it as a member manually.
    fr: |-
      Macie n'ajoute pas automatiquement un nouveau compte de l'organisation déjà associé à un autre administrateur Macie. Le compte doit d'abord se dissocier de cet administrateur ; l'administrateur délégué peut ensuite l'ajouter manuellement comme membre.
  options:
    a:
      en: |-
        Automatic enablement still skips accounts that are associated with another administrator, and it never applies to accounts that already joined.
      fr: |-
        L'activation automatique ignore toujours les comptes associés à un autre administrateur, et elle ne s'applique jamais aux comptes déjà présents.
    b:
      en: |-
        The administrator cannot add an account in which Macie is suspended; its owner must enable Macie again first.
      fr: |-
        L'administrateur ne peut pas ajouter un compte dans lequel Macie est suspendu ; son propriétaire doit d'abord réactiver Macie.
    c:
      en: |-
        An organization has one Macie delegated administrator, and it must be the same account in every Region.
      fr: |-
        Une organisation a un seul administrateur délégué Macie, et ce doit être le même compte dans toutes les Régions.
references:
  - title: "Integrating and configuring an organization in Macie - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/accounts-mgmt-ao-integrate.html
