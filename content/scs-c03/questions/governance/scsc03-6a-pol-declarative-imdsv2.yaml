id: scsc03-6a-pol-declarative-imdsv2
objective: "6.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany requires IMDSv2 on every EC2 instance in its member accounts, including instances that AWS services launch on the company's behalf through service-linked roles, such as EC2 Auto Scaling. The configuration must stay in force when EC2 adds new APIs, and users whose launch requests are refused must see a message that links to the internal security wiki.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany exige IMDSv2 sur chaque instance EC2 de ses comptes membres, y compris les instances que des services AWS lancent pour le compte de l'entreprise au moyen de rôles liés à un service, comme EC2 Auto Scaling. La configuration doit rester en vigueur lorsqu'EC2 ajoute de nouvelles API, et les utilisateurs dont les demandes de lancement sont refusées doivent voir un message contenant un lien vers le wiki de sécurité interne.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an EC2 declarative policy that sets `http_tokens` to `required` and `http_tokens_enforced` to `enabled`, with an `exception_message`.
        fr: |-
          Attacher une politique déclarative EC2 qui définit `http_tokens` sur `required` et `http_tokens_enforced` sur `enabled`, avec un `exception_message`.
    - id: b
      text:
        en: |-
          Attach an SCP to the organization root that denies ec2:RunInstances when ec2:MetadataHttpTokens is not `required`.
        fr: |-
          Attacher à la racine de l'organisation une SCP qui refuse ec2:RunInstances lorsque ec2:MetadataHttpTokens n'est pas `required`.
    - id: c
      text:
        en: |-
          Deploy the AWS Config rule that checks IMDSv2 with an automatic remediation that modifies the instance metadata options.
        fr: |-
          Déployer la règle AWS Config qui vérifie IMDSv2 avec une correction automatique qui modifie les options de métadonnées de l'instance.
    - id: d
      text:
        en: |-
          Run a script in every account and Region that calls ModifyInstanceMetadataDefaults to make IMDSv2 tokens `required`.
        fr: |-
          Exécuter dans chaque compte et chaque Région un script qui appelle ModifyInstanceMetadataDefaults pour rendre les jetons IMDSv2 `required`.
answer:
  optionId: a
explanation:
  correct:
    en: |-
      EC2 declarative policies enforce a configuration in the service's control plane, so the baseline holds when EC2 adds APIs and it also governs service-linked roles. The instance metadata attribute sets IMDSv2 as required and enforced, and `exception_message` shows the custom text to users whose requests are refused.
    fr: |-
      Les politiques déclaratives EC2 imposent une configuration dans le plan de contrôle du service : la référence est maintenue lorsqu'EC2 ajoute des API et elle s'applique aussi aux rôles liés à un service. L'attribut des métadonnées d'instance rend IMDSv2 obligatoire et imposé, et `exception_message` affiche le texte personnalisé aux utilisateurs dont les demandes sont refusées.
  options:
    b:
      en: |-
        SCPs do not affect service-linked roles, cannot show a custom message, and cover only the API actions they name.
      fr: |-
        Les SCP n'affectent pas les rôles liés à un service, ne peuvent pas afficher de message personnalisé et ne couvrent que les actions d'API qu'elles nomment.
    c:
      en: |-
        The rule corrects instances after they launch without IMDSv2; it does not prevent the launch or show a message.
      fr: |-
        La règle corrige les instances après leur lancement sans IMDSv2 ; elle n'empêche pas le lancement et n'affiche aucun message.
    d:
      en: |-
        Account-level defaults can be changed again by account administrators, and new accounts and Regions are not covered.
      fr: |-
        Les valeurs par défaut au niveau du compte peuvent être modifiées par les administrateurs des comptes, et les nouveaux comptes et Régions ne sont pas couverts.
references:
  - title: "Declarative policies in AWS Organizations - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_declarative.html
  - title: "EC2 policy syntax and examples - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_declarative_syntax.html
