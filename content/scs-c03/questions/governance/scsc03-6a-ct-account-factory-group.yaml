id: scsc03-6a-ct-account-factory-group
objective: "6.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    AnyCompany governs its accounts with AWS Control Tower, and workforce users sign in through AWS IAM Identity Center with the configuration that Control Tower set up. A platform lead must be able to provision new accounts into registered OUs with Account Factory. The lead must not receive administrative access to the management account.

    What should the administrator do?
  fr: |-
    AnyCompany gouverne ses comptes avec AWS Control Tower, et les utilisateurs du personnel se connectent via AWS IAM Identity Center avec la configuration mise en place par Control Tower. Un responsable plateforme doit pouvoir provisionner de nouveaux comptes dans des OU enregistrées avec Account Factory. Le responsable ne doit pas recevoir d'accès administratif au compte de gestion.

    Que doit faire l'administrateur ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the platform lead's IAM Identity Center user to the AWSControlTowerAdmins group.
        fr: |-
          Ajouter l'utilisateur IAM Identity Center du responsable plateforme au groupe AWSControlTowerAdmins.
    - id: b
      text:
        en: |-
          Add the platform lead's IAM Identity Center user to the AWSAccountFactory group.
        fr: |-
          Ajouter l'utilisateur IAM Identity Center du responsable plateforme au groupe AWSAccountFactory.
    - id: c
      text:
        en: |-
          Give the platform lead a permission set in the management account that allows organizations:CreateAccount.
        fr: |-
          Donner au responsable plateforme un ensemble d'autorisations dans le compte de gestion qui autorise organizations:CreateAccount.
    - id: d
      text:
        en: |-
          Create an IAM user for the platform lead in the management account with the AdministratorAccess policy.
        fr: |-
          Créer pour le responsable plateforme un utilisateur IAM dans le compte de gestion avec la politique AdministratorAccess.
answer:
  optionId: b
explanation:
  correct:
    en: |-
      By default, IAM Identity Center users can provision accounts with Account Factory when they belong to the AWSAccountFactory group. Membership in that group gives access to Account Factory without making the user a Control Tower administrator.
    fr: |-
      Par défaut, les utilisateurs IAM Identity Center peuvent provisionner des comptes avec Account Factory lorsqu'ils appartiennent au groupe AWSAccountFactory. L'appartenance à ce groupe donne accès à Account Factory sans faire de l'utilisateur un administrateur de Control Tower.
  options:
    a:
      en: |-
        The AWSControlTowerAdmins group gives administrative access to the management account, which the requirement forbids.
      fr: |-
        Le groupe AWSControlTowerAdmins donne un accès administratif au compte de gestion, ce que l'exigence interdit.
    c:
      en: |-
        CreateAccount creates an account directly in Organizations, outside Account Factory, so the account is not provisioned with the landing zone baselines.
      fr: |-
        CreateAccount crée un compte directement dans Organizations, en dehors d'Account Factory : le compte n'est pas provisionné avec les références de base de la zone d'atterrissage.
    d:
      en: |-
        AdministratorAccess in the management account is full administrative access, and an IAM user adds long-term credentials.
      fr: |-
        AdministratorAccess dans le compte de gestion est un accès administratif complet, et un utilisateur IAM ajoute des informations d'identification à long terme.
references:
  - title: "Provision and manage accounts with Account Factory - AWS Control Tower"
    url: https://docs.aws.amazon.com/controltower/latest/userguide/account-factory.html
