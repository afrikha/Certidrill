id: scsc03-6b-fms-admin-scope
objective: "6.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's security account is the AWS Firewall Manager default administrator for its organization in AWS Organizations. The network team works from its own Network account. The network team must create and manage Firewall Manager Network Firewall and DNS Firewall policies, but only for the accounts in the Workloads OU and only in the eu-west-1 and eu-central-1 Regions. The network team must not be able to manage AWS WAF or security group policies. The security team must keep full control of all policies.

    Which solution will meet these requirements?
  fr: |
    Le compte de sécurité d'AnyCompany est l'administrateur par défaut d'AWS Firewall Manager pour son organisation AWS Organizations. L'équipe réseau travaille depuis son propre compte Network. L'équipe réseau doit créer et gérer des politiques Firewall Manager Network Firewall et DNS Firewall, mais uniquement pour les comptes de l'unité d'organisation Workloads et uniquement dans les Régions eu-west-1 et eu-central-1. L'équipe réseau ne doit pas pouvoir gérer les politiques AWS WAF ni les politiques de groupes de sécurité. L'équipe de sécurité doit garder le contrôle total de toutes les politiques.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "From the security account, add the Network account as a Firewall Manager administrator whose scope is the Workloads OU, the two Regions, and the Network Firewall and DNS Firewall policy types."
        fr: "Depuis le compte de sécurité, ajouter le compte Network comme administrateur Firewall Manager dont l'étendue est l'unité d'organisation Workloads, les deux Régions et les types de politiques Network Firewall et DNS Firewall."
    - id: b
      text:
        en: "From the management account, make the Network account the Firewall Manager default administrator, and add the security account as an administrator with full scope."
        fr: "Depuis le compte de gestion, faire du compte Network l'administrateur par défaut de Firewall Manager, et ajouter le compte de sécurité comme administrateur avec une étendue complète."
    - id: c
      text:
        en: "From the security account, share its Network Firewall and DNS Firewall policies with the Network account through AWS RAM with a customer managed permission."
        fr: "Depuis le compte de sécurité, partager ses politiques Network Firewall et DNS Firewall avec le compte Network via AWS RAM avec une autorisation gérée par le client."
    - id: d
      text:
        en: "From the management account, add the Network account as a Firewall Manager administrator whose scope is the Workloads OU, the two Regions, and the Network Firewall and DNS Firewall policy types."
        fr: "Depuis le compte de gestion, ajouter le compte Network comme administrateur Firewall Manager dont l'étendue est l'unité d'organisation Workloads, les deux Régions et les types de politiques Network Firewall et DNS Firewall."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Firewall Manager supports several administrators, each with an administrative scope that can combine accounts or OUs, Regions, and policy types. Only the management account creates the default administrator and the additional administrators with their scopes; the security account keeps its full scope as default administrator.
    fr: |-
      Firewall Manager prend en charge plusieurs administrateurs, chacun avec une étendue administrative qui peut combiner des comptes ou des unités d'organisation, des Régions et des types de politiques. Seul le compte de gestion crée l'administrateur par défaut et les administrateurs supplémentaires avec leurs étendues ; le compte de sécurité conserve son étendue complète en tant qu'administrateur par défaut.
  options:
    a:
      en: |-
        The scope is right, but the default administrator cannot create other administrators; only the management account can.
      fr: |-
        L'étendue est correcte, mais l'administrateur par défaut ne peut pas créer d'autres administrateurs ; seul le compte de gestion le peut.
    b:
      en: |-
        The default administrator has full administrative scope, so the Network account would be able to manage every policy type in every account and Region.
      fr: |-
        L'administrateur par défaut a une étendue administrative complète : le compte Network pourrait gérer tous les types de politiques dans tous les comptes et toutes les Régions.
    c:
      en: |-
        Firewall Manager policies are not resources that AWS RAM can share; administration is delegated through administrator accounts and their scopes.
      fr: |-
        Les politiques Firewall Manager ne sont pas des ressources qu'AWS RAM peut partager ; l'administration se délègue par des comptes d'administrateur et leurs étendues.
references:
  - title: Using AWS Firewall Manager administrators - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/fms-administrators.html
