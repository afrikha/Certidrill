id: scsc03-6a-root-scp-deny-member-root
objective: "6.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A regulated subsidiary of AnyCompany has 12 member accounts in the Subsidiary OU. A local regulation requires the subsidiary to keep the root user credentials of these accounts, protected with MFA, under the custody of a local officer. The security team must prevent the root users of these accounts from performing actions on AWS resources.

    Which solution will meet these requirements?
  fr: |-
    Une filiale réglementée d'AnyCompany dispose de 12 comptes membres dans l'OU Subsidiary. Une réglementation locale impose à la filiale de conserver les informations d'identification de l'utilisateur racine de ces comptes, protégées par MFA, sous la garde d'un responsable local. L'équipe de sécurité doit empêcher les utilisateurs racine de ces comptes d'effectuer des actions sur les ressources AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an IAM policy that denies all actions to the root user of each account in the Subsidiary OU.
        fr: |-
          Attacher à l'utilisateur racine de chaque compte de l'OU Subsidiary une politique IAM qui refuse toutes les actions.
    - id: b
      text:
        en: |-
          Enable root credentials management, and delete the root credentials of the accounts in the Subsidiary OU.
        fr: |-
          Activer la gestion des informations racine, et supprimer les informations racine des comptes de l'OU Subsidiary.
    - id: c
      text:
        en: |-
          Attach a permissions boundary that denies all actions to the root user of each account in the Subsidiary OU.
        fr: |-
          Attacher à l'utilisateur racine de chaque compte de l'OU Subsidiary une limite d'autorisations qui refuse toutes les actions.
    - id: d
      text:
        en: |-
          Attach an SCP to the Subsidiary OU that denies all actions when aws:PrincipalArn matches arn:aws:iam::*:root.
        fr: |-
          Attacher à l'OU Subsidiary une SCP qui refuse toutes les actions lorsque aws:PrincipalArn correspond à arn:aws:iam::*:root.
answer:
  optionId: d
explanation:
  correct:
    en: |-
      SCPs apply to all users and roles of member accounts, including the root user. When member accounts keep root credentials, AWS recommends an SCP that restricts root actions; matching aws:PrincipalArn against the root ARN pattern applies the deny to the root user of every account in the OU.
    fr: |-
      Les SCP s'appliquent à tous les utilisateurs et rôles des comptes membres, y compris l'utilisateur racine. Lorsque des comptes membres conservent des informations racine, AWS recommande une SCP qui limite les actions racine ; comparer aws:PrincipalArn au modèle d'ARN racine applique le refus à l'utilisateur racine de chaque compte de l'OU.
  options:
    a:
      en: |-
        IAM policies cannot be attached to the root user, which has full access unless an SCP restricts it.
      fr: |-
        Les politiques IAM ne peuvent pas être attachées à l'utilisateur racine, qui dispose d'un accès complet tant qu'une SCP ne le limite pas.
    b:
      en: |-
        Deleting the root credentials contradicts the regulation that requires the subsidiary to keep them.
      fr: |-
        Supprimer les informations racine contredit la réglementation qui impose à la filiale de les conserver.
    c:
      en: |-
        Permissions boundaries apply to IAM users and roles; they cannot be set on the root user.
      fr: |-
        Les limites d'autorisations s'appliquent aux utilisateurs et aux rôles IAM ; elles ne peuvent pas être définies sur l'utilisateur racine.
references:
  - title: "Root user best practices for your AWS account - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
  - title: "Service control policies (SCPs) - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
