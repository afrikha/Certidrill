id: scsc03-6b-wa-profile-priority
objective: "6.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany, a startup with a small engineering team, must pass its first SOC 2 audit in six months. It is reviewing its main workload in the AWS Well-Architected Tool. The CTO wants the tool to focus the review on the questions that are most relevant to the company's business goals and to highlight which risks the improvement plan should address first.

    Which solution will meet these requirements?
  fr: |
    AnyCompany, une jeune entreprise dotée d'une petite équipe d'ingénierie, doit réussir son premier audit SOC 2 dans six mois. Elle passe en revue sa charge de travail principale dans l'AWS Well-Architected Tool. Le directeur technique veut que l'outil concentre la revue sur les questions les plus pertinentes pour les objectifs métier de l'entreprise et mette en évidence les risques que le plan d'amélioration doit traiter en premier.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a review template that pre-fills the answers of the questions that the team considers less relevant."
        fr: "Créer un modèle de revue qui préremplit les réponses des questions que l'équipe juge moins pertinentes."
    - id: b
      text:
        en: "Create a custom lens that contains only the questions related to SOC 2, and apply it instead of the Framework lens."
        fr: "Créer un objectif (lens) personnalisé qui ne contient que les questions liées à SOC 2, et l'appliquer à la place de l'objectif Framework."
    - id: c
      text:
        en: "Create a profile that describes the business context and goals, and attach it to the workload."
        fr: "Créer un profil qui décrit le contexte métier et les objectifs, et l'attacher à la charge de travail."
    - id: d
      text:
        en: "Save a milestone now and compare it with a milestone saved after the audit."
        fr: "Enregistrer un jalon maintenant et le comparer à un jalon enregistré après l'audit."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A profile captures the business context and the goals of a Well-Architected review. The tool uses it to present a prioritized list of the questions that are relevant to the business, and attaching it to the workload shows which risks to address first in the improvement plan.
    fr: |-
      Un profil consigne le contexte métier et les objectifs d'une revue Well-Architected. L'outil s'en sert pour présenter une liste priorisée des questions pertinentes pour l'entreprise, et l'attacher à la charge de travail montre quels risques traiter en premier dans le plan d'amélioration.
  options:
    a:
      en: |-
        Review templates pre-fill answers shared by many workloads; pre-filling answers without reviewing them hides risks instead of prioritizing them.
      fr: |-
        Les modèles de revue préremplissent des réponses communes à de nombreuses charges de travail ; préremplir des réponses sans les examiner masque les risques au lieu de les prioriser.
    b:
      en: |-
        The Framework lens is applied automatically to every workload, and a custom lens would require authoring questions instead of prioritizing the existing ones.
      fr: |-
        L'objectif Framework est appliqué automatiquement à chaque charge de travail, et un objectif personnalisé obligerait à rédiger des questions au lieu de prioriser celles qui existent.
    d:
      en: |-
        Milestones measure progress over time; they do not decide which questions or risks matter most.
      fr: |-
        Les jalons mesurent les progrès dans le temps ; ils ne déterminent pas quelles questions ou quels risques comptent le plus.
references:
  - title: Tool profiles - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/profiles.html
