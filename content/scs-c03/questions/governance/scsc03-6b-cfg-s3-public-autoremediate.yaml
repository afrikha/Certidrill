id: scsc03-6b-cfg-s3-public-autoremediate
objective: "6.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany records all resource types with AWS Config in its production account. The security team requires that any Amazon S3 bucket whose settings allow public read or public write access is detected and corrected automatically within minutes of the change. Each correction must appear as a remediation execution in AWS Config, and the team does not want to write or maintain code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany enregistre tous les types de ressources avec AWS Config dans son compte de production. L'équipe de sécurité exige que tout compartiment Amazon S3 dont les paramètres autorisent l'accès public en lecture ou en écriture soit détecté et corrigé automatiquement dans les minutes qui suivent la modification. Chaque correction doit apparaître comme une exécution de correction dans AWS Config, et l'équipe ne veut ni écrire ni maintenir de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Run the s3-bucket-public-read-prohibited and s3-bucket-public-write-prohibited rules in proactive mode from the deployment pipeline with StartResourceEvaluation."
        fr: "Exécuter les règles s3-bucket-public-read-prohibited et s3-bucket-public-write-prohibited en mode proactif depuis le pipeline de déploiement avec StartResourceEvaluation."
    - id: b
      text:
        en: "Create an AWS Config aggregator in the security account and configure automatic remediation on the aggregated S3 rules."
        fr: "Créer un agrégateur AWS Config dans le compte de sécurité et configurer la correction automatique sur les règles S3 agrégées."
    - id: c
      text:
        en: "Add the s3-bucket-public-read-prohibited and s3-bucket-public-write-prohibited rules with automatic remediation that runs the AWS-DisableS3BucketPublicReadWrite runbook."
        fr: "Ajouter les règles s3-bucket-public-read-prohibited et s3-bucket-public-write-prohibited avec une correction automatique qui exécute le runbook AWS-DisableS3BucketPublicReadWrite."
    - id: d
      text:
        en: "Subscribe the security team's email address to the SNS topic of the AWS Config delivery channel, and have the team disable public access on each reported bucket within minutes."
        fr: "Abonner l'adresse e-mail de l'équipe de sécurité à la rubrique SNS du canal de diffusion AWS Config, et faire désactiver par l'équipe l'accès public de chaque compartiment signalé dans les minutes qui suivent."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS Config remediates noncompliant resources with Systems Manager Automation runbooks, and AWS provides managed runbooks such as AWS-DisableS3BucketPublicReadWrite. With automatic remediation, each NON_COMPLIANT evaluation starts the runbook with the bucket name passed from the resource ID, and the execution status is tracked in AWS Config.
    fr: |-
      AWS Config corrige les ressources non conformes avec des runbooks Systems Manager Automation, et AWS fournit des runbooks gérés comme AWS-DisableS3BucketPublicReadWrite. Avec la correction automatique, chaque évaluation NON_COMPLIANT lance le runbook avec le nom du compartiment transmis depuis l'ID de ressource, et l'état d'exécution est suivi dans AWS Config.
  options:
    a:
      en: |-
        Proactive evaluation checks resource properties before deployment; it neither evaluates later changes to deployed buckets nor remediates anything.
      fr: |-
        L'évaluation proactive vérifie les propriétés des ressources avant le déploiement ; elle n'évalue pas les modifications ultérieures des compartiments déployés et ne corrige rien.
    b:
      en: |-
        An aggregator is a read-only view of configuration and compliance data; it cannot run remediation in the source accounts.
      fr: |-
        Un agrégateur est une vue en lecture seule des données de configuration et de conformité ; il ne peut pas exécuter de correction dans les comptes sources.
    d:
      en: |-
        This is manual remediation driven by a very noisy topic, so the minutes-level, automatic correction is not met.
      fr: |-
        Il s'agit d'une correction manuelle pilotée par une rubrique très bruyante : la correction automatique en quelques minutes n'est pas assurée.
references:
  - title: Remediating Noncompliant Resources with AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/remediation.html
  - title: Setting Up Auto Remediation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
