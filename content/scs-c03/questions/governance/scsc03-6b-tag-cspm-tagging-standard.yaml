id: scsc03-6b-tag-cspm-tagging-standard
objective: "6.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Security Hub CSPM in every account of its organization in AWS Organizations, with a delegated administrator account. AWS Config records all resource types in every account and Region. The data protection policy requires every Amazon DynamoDB table, Amazon RDS DB instance, and AWS Secrets Manager secret to carry a DataClassification tag, because backup plans and Amazon Macie jobs select resources by this tag. Many resources already carry other tags, such as Owner and Project.

    The security team wants a continuous, organization-wide list of the resources that lack the DataClassification tag, without writing or maintaining code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS Security Hub CSPM dans tous les comptes de son organisation AWS Organizations, avec un compte d'administrateur délégué. AWS Config enregistre tous les types de ressources dans chaque compte et chaque Région. La politique de protection des données exige que chaque table Amazon DynamoDB, chaque instance de base de données Amazon RDS et chaque secret AWS Secrets Manager porte une balise DataClassification, car les plans de sauvegarde et les tâches Amazon Macie sélectionnent les ressources selon cette balise. De nombreuses ressources portent déjà d'autres balises, comme Owner et Project.

    L'équipe de sécurité veut une liste continue, à l'échelle de l'organisation, des ressources auxquelles il manque la balise DataClassification, sans écrire ni maintenir de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable the AWS Resource Tagging standard in Security Hub CSPM for all accounts and keep the default parameters of its controls."
        fr: "Activer la norme AWS Resource Tagging dans Security Hub CSPM pour tous les comptes et conserver les paramètres par défaut de ses contrôles."
    - id: b
      text:
        en: "Enable the AWS Resource Tagging standard in Security Hub CSPM for all accounts and set the tag key parameter of its controls to DataClassification."
        fr: "Activer la norme AWS Resource Tagging dans Security Hub CSPM pour tous les comptes et définir le paramètre de clé de balise de ses contrôles sur DataClassification."
    - id: c
      text:
        en: "Attach a tag policy that defines the DataClassification key and enforces it for the three resource types, then read the organization-wide tag compliance report."
        fr: "Attacher une politique de balises qui définit la clé DataClassification et l'applique aux trois types de ressources, puis consulter le rapport de conformité des balises de l'organisation."
    - id: d
      text:
        en: "Deploy a custom Lambda AWS Config rule in each account that lists the tags of each resource and reports resources without DataClassification as NON_COMPLIANT."
        fr: "Déployer dans chaque compte une règle AWS Config Lambda personnalisée qui liste les balises de chaque ressource et signale comme NON_COMPLIANT les ressources sans DataClassification."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The AWS Resource Tagging standard has tagging controls for resource types such as DynamoDB tables, RDS DB instances and Secrets Manager secrets. Each control accepts an optional list of required tag keys; set to DataClassification, a resource fails as soon as this key is missing, and the findings are aggregated in the delegated administrator account without any code.
    fr: |-
      La norme AWS Resource Tagging comporte des contrôles de balisage pour des types de ressources comme les tables DynamoDB, les instances de base de données RDS et les secrets Secrets Manager. Chaque contrôle accepte une liste facultative de clés de balise requises ; avec DataClassification, une ressource échoue dès que cette clé manque, et les résultats sont agrégés dans le compte d'administrateur délégué sans aucun code.
  options:
    a:
      en: |-
        Without a tag key parameter, the controls only check that a resource has at least one tag, so resources tagged only with Owner or Project would pass.
      fr: |-
        Sans paramètre de clé de balise, les contrôles vérifient seulement qu'une ressource porte au moins une balise : les ressources qui n'ont que Owner ou Project réussiraient.
    c:
      en: |-
        Tag policies standardize keys and values of tags that are present; untagged resources and missing keys are not evaluated, so the report would not list resources without DataClassification.
      fr: |-
        Les politiques de balises normalisent les clés et les valeurs des balises présentes ; les ressources sans balise et les clés absentes ne sont pas évaluées, donc le rapport ne listerait pas les ressources sans DataClassification.
    d:
      en: |-
        A custom Lambda rule works, but it is code that the team must write, deploy in every account and Region, and maintain.
      fr: |-
        Une règle Lambda personnalisée fonctionne, mais c'est du code que l'équipe doit écrire, déployer dans chaque compte et chaque Région, puis maintenir.
references:
  - title: AWS Resource Tagging standard in Security Hub CSPM - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/standards-tagging.html
  - title: Tag policies - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_tag-policies.html
