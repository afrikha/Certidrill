id: scsc03-6a-ct-enroll-prereqs
objective: "6.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany acquired a startup that runs its workloads in one standalone AWS account. The account has no AWS Config configuration recorder or delivery channel. The security team must enroll the account in AWS Control Tower in the registered Workloads OU. The account's existing VPCs must be kept.

    Which combination of actions must be part of the process? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |-
    AnyCompany a racheté une start-up qui exécute ses charges de travail dans un compte AWS autonome. Le compte n'a ni enregistreur de configuration AWS Config ni canal de diffusion. L'équipe de sécurité doit inscrire le compte dans AWS Control Tower, dans l'OU Workloads enregistrée. Les VPC existants du compte doivent être conservés.

    Quelle combinaison d'actions doit faire partie du processus ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Invite the account to the organization that hosts the landing zone, and accept the invitation from the account.
        fr: |-
          Inviter le compte dans l'organisation qui héberge la zone d'atterrissage, et accepter l'invitation depuis le compte.
    - id: b
      text:
        en: |-
          Delete the default VPC and the existing VPCs so that Control Tower can create the Account Factory VPC.
        fr: |-
          Supprimer le VPC par défaut et les VPC existants afin que Control Tower puisse créer le VPC d'Account Factory.
    - id: c
      text:
        en: |-
          Create a configuration recorder in every governed Region so that the detective controls can evaluate resources at once.
        fr: |-
          Créer un enregistreur de configuration dans chaque Région gouvernée afin que les contrôles détectifs puissent évaluer les ressources immédiatement.
    - id: d
      text:
        en: |-
          Create the AWSControlTowerExecution role in the account with administrator permissions and a trust policy for the management account.
        fr: |-
          Créer dans le compte le rôle AWSControlTowerExecution avec des autorisations d'administrateur et une politique d'approbation pour le compte de gestion.
    - id: e
      text:
        en: |-
          Create an IAM Identity Center user for the account owner in the AWSAccountFactory group before the enrollment starts.
        fr: |-
          Créer un utilisateur IAM Identity Center pour le propriétaire du compte dans le groupe AWSAccountFactory avant le début de l'inscription.
answer:
  optionIds: [a, d]
explanation:
  correct:
    en: |-
      Only accounts of the organization that hosts the landing zone can be enrolled, so the standalone account must first join it. Control Tower also needs the AWSControlTowerExecution role in the account to enroll it and to deploy its baseline StackSets there.
    fr: |-
      Seuls les comptes de l'organisation qui héberge la zone d'atterrissage peuvent être inscrits : le compte autonome doit donc d'abord la rejoindre. Control Tower a aussi besoin du rôle AWSControlTowerExecution dans le compte pour l'inscrire et y déployer ses StackSets de référence.
  options:
    b:
      en: |-
        Enrollment keeps existing VPCs and the default VPC; Control Tower creates or removes no VPC for an enrolled account.
      fr: |-
        L'inscription conserve les VPC existants et le VPC par défaut ; Control Tower ne crée ni ne supprime de VPC pour un compte inscrit.
    c:
      en: |-
        The account must not have a configuration recorder before standard enrollment; Control Tower configures AWS Config itself.
      fr: |-
        Le compte ne doit pas avoir d'enregistreur de configuration avant une inscription standard ; Control Tower configure lui-même AWS Config.
    e:
      en: |-
        Group membership controls who can use Account Factory; it is not a prerequisite for enrolling an existing account.
      fr: |-
        L'appartenance au groupe détermine qui peut utiliser Account Factory ; ce n'est pas un prérequis à l'inscription d'un compte existant.
references:
  - title: "About enrolling existing accounts - AWS Control Tower"
    url: https://docs.aws.amazon.com/controltower/latest/userguide/enroll-account.html
