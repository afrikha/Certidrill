id: scsc03-6a-org-deny-leave
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An audit at AnyCompany found that an administrator removed a member account from the organization in AWS Organizations by calling LeaveOrganization. The account was then no longer subject to the organization's SCPs or to the organization trail. The security team must ensure that no IAM principal in any member account, including future accounts, can remove its account from the organization. The management account must still be able to remove accounts.

    Which solution will meet these requirements?
  fr: |-
    Un audit d'AnyCompany a révélé qu'un administrateur a retiré un compte membre de l'organisation AWS Organizations en appelant LeaveOrganization. Le compte n'était alors plus soumis aux SCP de l'organisation ni au journal de suivi de l'organisation. L'équipe de sécurité doit garantir qu'aucun principal IAM d'un compte membre, y compris des comptes futurs, ne puisse retirer son compte de l'organisation. Le compte de gestion doit toujours pouvoir retirer des comptes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP to the organization root that denies the organizations:LeaveOrganization action.
        fr: |-
          Attacher à la racine de l'organisation une SCP qui refuse l'action organizations:LeaveOrganization.
    - id: b
      text:
        en: |-
          Deploy an IAM policy that denies organizations:LeaveOrganization to every role in the member accounts with a StackSet.
        fr: |-
          Déployer avec un StackSet une politique IAM qui refuse organizations:LeaveOrganization à chaque rôle des comptes membres.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule for LeaveOrganization events that invokes an AWS Lambda function to invite the account again.
        fr: |-
          Créer une règle Amazon EventBridge pour les événements LeaveOrganization qui appelle une fonction AWS Lambda pour inviter de nouveau le compte.
    - id: d
      text:
        en: |-
          Delete the root user credentials of the member accounts so that no one can complete the standalone account information.
        fr: |-
          Supprimer les informations d'identification de l'utilisateur racine des comptes membres afin que personne ne puisse compléter les informations du compte autonome.
answer:
  optionId: a
explanation:
  correct:
    en: |-
      AWS documents an SCP that denies organizations:LeaveOrganization as the way to stop member accounts from leaving. Attached to the root, it applies to every principal in every current and future member account, including their root users, while the management account, which SCPs do not affect, can still call RemoveAccountFromOrganization.
    fr: |-
      AWS documente une SCP qui refuse organizations:LeaveOrganization comme moyen d'empêcher les comptes membres de quitter l'organisation. Attachée à la racine, elle s'applique à tous les principaux de tous les comptes membres actuels et futurs, y compris leurs utilisateurs racine, tandis que le compte de gestion, que les SCP n'affectent pas, peut toujours appeler RemoveAccountFromOrganization.
  options:
    b:
      en: |-
        Local administrators can detach or edit the IAM policy and create new principals without it, so the control is not enforced.
      fr: |-
        Les administrateurs locaux peuvent détacher ou modifier la politique IAM et créer de nouveaux principaux sans elle : le contrôle n'est pas imposé.
    c:
      en: |-
        The rule reacts after the account has left, and the account must accept the new invitation, so it does not prevent the action.
      fr: |-
        La règle réagit après le départ du compte, et le compte doit accepter la nouvelle invitation : elle n'empêche pas l'action.
    d:
      en: |-
        IAM principals with billing permissions can add the missing payment information, so removing root credentials does not block LeaveOrganization.
      fr: |-
        Des principaux IAM disposant d'autorisations de facturation peuvent ajouter les informations de paiement manquantes : supprimer les informations racine ne bloque pas LeaveOrganization.
references:
  - title: "Leaving an organization from a member account with AWS Organizations - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_accounts_leave-as-member.html
