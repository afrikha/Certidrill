id: scsc03-6a-iac-stack-policy-replace
objective: "6.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An AWS CloudFormation stack contains an Amazon RDS DB instance with the logical ID AuditDb, which stores audit records, and several application resources. No stack update may replace or delete AuditDb, but every other resource in the stack must remain updatable. A deliberate change to AuditDb must still be possible through a reviewed, temporary override.

    Which solution will meet these requirements?
  fr: |-
    Une pile AWS CloudFormation contient une instance de base de données Amazon RDS dont l'ID logique est AuditDb, qui stocke des enregistrements d'audit, ainsi que plusieurs ressources applicatives. Aucune mise à jour de pile ne doit remplacer ni supprimer AuditDb, mais toutes les autres ressources de la pile doivent rester modifiables. Une modification volontaire d'AuditDb doit rester possible au moyen d'un remplacement temporaire de politique, après revue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable termination protection on the stack so that no stack operation can delete or replace AuditDb.
        fr: |-
          Activer la protection contre la résiliation (termination protection) sur la pile afin qu'aucune opération de pile ne puisse supprimer ou remplacer AuditDb.
    - id: b
      text:
        en: |-
          Set DeletionPolicy: Retain on AuditDb in the template so that CloudFormation never deletes the DB instance.
        fr: |-
          Définir DeletionPolicy: Retain sur AuditDb dans le modèle afin que CloudFormation ne supprime jamais l'instance de base de données.
    - id: c
      text:
        en: |-
          Set a stack policy that denies Update:Replace and Update:Delete on LogicalResourceId/AuditDb and allows Update:* on all resources.
        fr: |-
          Définir une politique de pile qui refuse Update:Replace et Update:Delete sur LogicalResourceId/AuditDb et autorise Update:* sur toutes les ressources.
    - id: d
      text:
        en: |-
          Set a stack policy whose only statement denies Update:Replace and Update:Delete on LogicalResourceId/AuditDb.
        fr: |-
          Définir une politique de pile dont la seule instruction refuse Update:Replace et Update:Delete sur LogicalResourceId/AuditDb.
answer:
  optionId: c
explanation:
  correct:
    en: |-
      A stack policy protects resources during stack updates: the Deny statement blocks replacement and deletion of AuditDb, and the Allow statement keeps every other update possible, because a stack policy denies everything that it does not explicitly allow. A reviewed change can supply a temporary override policy for that update only.
    fr: |-
      Une politique de pile protège les ressources lors des mises à jour de pile : l'instruction Deny bloque le remplacement et la suppression d'AuditDb, et l'instruction Allow maintient possibles toutes les autres mises à jour, car une politique de pile refuse tout ce qu'elle n'autorise pas explicitement. Une modification revue peut fournir une politique de remplacement temporaire pour cette seule mise à jour.
  options:
    a:
      en: |-
        Termination protection prevents deleting the whole stack; it does not stop an update from replacing a resource.
      fr: |-
        La protection contre la résiliation empêche la suppression de toute la pile ; elle n'empêche pas une mise à jour de remplacer une ressource.
    b:
      en: |-
        DeletionPolicy does not apply when an update replaces the resource, so the old instance would still be deleted.
      fr: |-
        DeletionPolicy ne s'applique pas lorsqu'une mise à jour remplace la ressource : l'ancienne instance serait donc tout de même supprimée.
    d:
      en: |-
        Without an Allow statement, the stack policy also denies updates to every other resource.
      fr: |-
        Sans instruction Allow, la politique de pile refuse aussi les mises à jour de toutes les autres ressources.
references:
  - title: "Prevent updates to stack resources - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/protect-stack-resources.html
  - title: "DeletionPolicy attribute - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-deletionpolicy.html
