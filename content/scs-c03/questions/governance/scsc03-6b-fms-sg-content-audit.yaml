id: scsc03-6b-fms-sg-content-audit
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team uses AWS Firewall Manager from its security account. It needs a continuously updated view, across all accounts of the organization including future accounts, of the VPC security groups whose rules allow all traffic, or allow high-risk applications such as SSH and RDP from public CIDR ranges. Account owners will decide how to fix each group, so no rule may be changed automatically for now.

    Which solution will meet these requirements?
  fr: |
    L'équipe de sécurité d'AnyCompany utilise AWS Firewall Manager depuis son compte de sécurité. Elle a besoin d'une vue mise à jour en continu, sur tous les comptes de l'organisation y compris les futurs comptes, des groupes de sécurité VPC dont les règles autorisent tout le trafic, ou autorisent des applications à haut risque comme SSH et RDP depuis des plages CIDR publiques. Les propriétaires de comptes décideront comment corriger chaque groupe : aucune règle ne doit donc être modifiée automatiquement pour l'instant.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a content audit security group policy with managed audit rules for overly permissive rules and high-risk applications, without auto remediation."
        fr: "Créer une politique d'audit de contenu des groupes de sécurité avec des règles d'audit gérées pour les règles trop permissives et les applications à haut risque, sans correction automatique."
    - id: b
      text:
        en: "Create a usage audit security group policy that requires security groups to be unique, and identify noncompliant resources without auto remediation."
        fr: "Créer une politique d'audit d'utilisation des groupes de sécurité qui exige l'unicité des groupes de sécurité, et identifier les ressources non conformes sans correction automatique."
    - id: c
      text:
        en: "Create a common security group policy whose primary security group allows only approved traffic, and identify noncompliant resources without auto remediation."
        fr: "Créer une politique de groupe de sécurité commun dont le groupe de sécurité principal n'autorise que le trafic approuvé, et identifier les ressources non conformes sans correction automatique."
    - id: d
      text:
        en: "Create a Network Firewall policy with a stateful rule group that drops SSH and RDP traffic from public CIDR ranges in every VPC, without auto remediation."
        fr: "Créer une politique Network Firewall avec un groupe de règles avec état qui rejette le trafic SSH et RDP provenant de plages CIDR publiques dans chaque VPC, sans correction automatique."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Content audit security group policies check the rules of security groups in the policy scope. Managed audit policy rules can flag overly permissive rules, such as rules that allow all traffic, and high-risk applications by the CIDR ranges they can reach. Creating the policy without auto remediation reports noncompliant groups in Firewall Manager without changing them.
    fr: |-
      Les politiques d'audit de contenu des groupes de sécurité vérifient les règles des groupes de sécurité de l'étendue de la politique. Les règles de politique d'audit gérées peuvent signaler les règles trop permissives, comme celles qui autorisent tout le trafic, et les applications à haut risque selon les plages CIDR qu'elles peuvent atteindre. Créer la politique sans correction automatique signale les groupes non conformes dans Firewall Manager sans les modifier.
  options:
    b:
      en: |-
        Usage audit policies look at whether groups are used or redundant; they do not inspect the traffic that rules allow.
      fr: |-
        Les politiques d'audit d'utilisation regardent si les groupes sont utilisés ou redondants ; elles n'examinent pas le trafic que les règles autorisent.
    c:
      en: |-
        A common policy checks that the primary group is applied to in-scope resources; it does not audit the rules of the other groups that accounts create.
      fr: |-
        Une politique commune vérifie que le groupe principal est appliqué aux ressources concernées ; elle n'audite pas les règles des autres groupes créés par les comptes.
    d:
      en: |-
        A Network Firewall policy deploys firewalls that filter VPC traffic; it does not report which security group rules are too permissive.
      fr: |-
        Une politique Network Firewall déploie des pare-feu qui filtrent le trafic des VPC ; elle ne signale pas quelles règles de groupe de sécurité sont trop permissives.
references:
