id: scsc03-6a-deleg-access-analyzer-change
objective: "6.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany's former audit account is the delegated administrator for IAM Access Analyzer and owns the organization analyzers. The company is replacing it with a new security tooling account as the delegated administrator. After the change, the security team must keep getting findings for resources that are shared outside the organization.

    What must the team do?
  fr: |-
    L'ancien compte d'audit d'AnyCompany est l'administrateur délégué d'IAM Access Analyzer et possède les analyseurs d'organisation. L'entreprise le remplace par un nouveau compte d'outillage de sécurité comme administrateur délégué. Après le changement, l'équipe de sécurité doit continuer d'obtenir des résultats pour les ressources partagées en dehors de l'organisation.

    Que doit faire l'équipe ?
body:
  options:
    - id: a
      text:
        en: |-
          Nothing more, because the organization analyzers and their findings move to the new delegated administrator automatically.
        fr: |-
          Rien de plus, car les analyseurs d'organisation et leurs résultats passent automatiquement au nouvel administrateur délégué.
    - id: b
      text:
        en: |-
          Share the existing organization analyzers from the former audit account with the new account through AWS RAM.
        fr: |-
          Partager les analyseurs d'organisation existants du compte d'audit avec le nouveau compte au moyen d'AWS RAM.
    - id: c
      text:
        en: |-
          Create new analyzers with the organization as the zone of trust in the new security tooling account after the change.
        fr: |-
          Créer de nouveaux analyseurs avec l'organisation comme zone de confiance dans le nouveau compte d'outillage de sécurité après le changement.
    - id: d
      text:
        en: |-
          Keep the analyzers in the former audit account, and give the new account a cross-account role to read their findings.
        fr: |-
          Conserver les analyseurs dans l'ancien compte d'audit, et donner au nouveau compte un rôle intercompte pour lire leurs résultats.
answer:
  optionId: c
explanation:
  correct:
    en: |-
      When the delegated administrator changes, the organization analyzers of the former administrator become disabled and stop generating findings. The new delegated administrator must create its own analyzers with the organization as the zone of trust, which then generate new instances of the findings.
    fr: |-
      Lorsque l'administrateur délégué change, les analyseurs d'organisation de l'ancien administrateur sont désactivés et cessent de générer des résultats. Le nouvel administrateur délégué doit créer ses propres analyseurs avec l'organisation comme zone de confiance, qui génèrent alors de nouvelles instances des résultats.
  options:
    a:
      en: |-
        Analyzers are not transferred; they stay in the former account in a disabled state.
      fr: |-
        Les analyseurs ne sont pas transférés ; ils restent dans l'ancien compte à l'état désactivé.
    b:
      en: |-
        Access Analyzer analyzers are not shareable through AWS RAM, and the former account's analyzers are disabled after the change.
      fr: |-
        Les analyseurs Access Analyzer ne sont pas partageables au moyen d'AWS RAM, et ceux de l'ancien compte sont désactivés après le changement.
    d:
      en: |-
        The former account loses permission to its organization analyzers, so there are no current findings to read.
      fr: |-
        L'ancien compte perd l'autorisation sur ses analyseurs d'organisation : il n'y a donc plus de résultats à jour à lire.
references:
  - title: "Delegated administrator for IAM Access Analyzer - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-settings.html
