id: scsc03-6a-ct-lz4-drift-events
objective: "6.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's security team received AWS Control Tower drift notifications through an email subscription to the aggregate security notifications SNS topic in the audit account. After the company updated its landing zone to version 4.0, the console still shows new drift, but no drift email arrives. The team must receive an email for every new drift.

    Which solution will meet these requirements?
  fr: |-
    L'équipe de sécurité d'AnyCompany recevait les notifications de dérive d'AWS Control Tower via un abonnement par e-mail à la rubrique SNS agrégée des notifications de sécurité du compte d'audit. Depuis la mise à jour de la zone d'atterrissage vers la version 4.0, la console affiche toujours les nouvelles dérives, mais aucun e-mail de dérive n'arrive. L'équipe doit recevoir un e-mail pour chaque nouvelle dérive.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Subscribe the team's email address again to the aggregate security notifications SNS topic in the audit account.
        fr: |-
          Abonner de nouveau l'adresse e-mail de l'équipe à la rubrique SNS agrégée des notifications de sécurité du compte d'audit.
    - id: b
      text:
        en: |-
          Turn on auto-enrollment in the Control Tower settings so that Control Tower publishes drift notifications again.
        fr: |-
          Activer l'inscription automatique dans les paramètres de Control Tower afin que Control Tower publie de nouveau les notifications de dérive.
    - id: c
      text:
        en: |-
          In the management account, create an EventBridge rule for aws.controltower Drift Detected events that targets an SNS topic.
        fr: |-
          Dans le compte de gestion, créer une règle EventBridge pour les événements aws.controltower Drift Detected qui cible une rubrique SNS.
    - id: d
      text:
        en: |-
          Deploy an AWS Config rule to every enrolled account that evaluates Control Tower drift and notifies an SNS topic.
        fr: |-
          Déployer dans chaque compte inscrit une règle AWS Config qui évalue la dérive de Control Tower et notifie une rubrique SNS.
answer:
  optionId: c
explanation:
  correct:
    en: |-
      Starting with landing zone 4.0, Control Tower no longer sends drift notifications to the SNS topic; it sends them to Amazon EventBridge in the management account. An EventBridge rule that matches source aws.controltower and detail type Drift Detected, with an SNS topic as target, restores the email notifications.
    fr: |-
      À partir de la zone d'atterrissage 4.0, Control Tower n'envoie plus les notifications de dérive à la rubrique SNS ; il les envoie à Amazon EventBridge dans le compte de gestion. Une règle EventBridge qui correspond à la source aws.controltower et au type de détail Drift Detected, avec une rubrique SNS comme cible, rétablit les notifications par e-mail.
  options:
    a:
      en: |-
        The subscription is not the problem: landing zone 4.0 and later stop publishing drift notifications to that topic.
      fr: |-
        L'abonnement n'est pas en cause : les zones d'atterrissage 4.0 et ultérieures ne publient plus les notifications de dérive dans cette rubrique.
    b:
      en: |-
        Auto-enrollment prevents drift when accounts move between OUs; it does not deliver drift notifications.
      fr: |-
        L'inscription automatique évite la dérive lors des déplacements de comptes entre OU ; elle ne livre pas de notifications de dérive.
    d:
      en: |-
        Control Tower governance drift is detected by Control Tower itself; a Config rule in each account adds custom work and does not see that drift.
      fr: |-
        La dérive de gouvernance est détectée par Control Tower lui-même ; une règle Config dans chaque compte ajoute du travail sur mesure et ne voit pas cette dérive.
references:
  - title: "Key changes - AWS Control Tower"
    url: https://docs.aws.amazon.com/controltower/latest/userguide/key-changes-lz-v4.html
  - title: "Types of governance drift - AWS Control Tower"
    url: https://docs.aws.amazon.com/controltower/latest/userguide/governance-drift.html
