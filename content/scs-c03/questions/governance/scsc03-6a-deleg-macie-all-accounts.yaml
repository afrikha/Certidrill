id: scsc03-6a-deleg-macie-all-accounts
objective: "6.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany has 120 accounts in AWS Organizations and stores data in Amazon S3 in eu-west-1 and eu-west-3. Amazon Macie is not enabled in any account. The security tooling account must manage Macie for every existing and future account in both Regions.

    Which combination of actions will meet these requirements? (Choose three.)
  fr: |-
    AnyCompany dispose de 120 comptes dans AWS Organizations et stocke des données dans Amazon S3 dans eu-west-1 et eu-west-3. Amazon Macie n'est activé dans aucun compte. Le compte d'outillage de sécurité doit gérer Macie pour chaque compte existant et futur dans les deux Régions.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          From the management account, designate the security tooling account as the Macie delegated administrator in eu-west-1 and in eu-west-3.
        fr: |-
          Depuis le compte de gestion, désigner le compte d'outillage de sécurité comme administrateur délégué Macie dans eu-west-1 et dans eu-west-3.
    - id: b
      text:
        en: |-
          From the management account, designate the security tooling account in eu-west-1 and the log archive account in eu-west-3.
        fr: |-
          Depuis le compte de gestion, désigner le compte d'outillage de sécurité dans eu-west-1 et le compte d'archivage des journaux dans eu-west-3.
    - id: c
      text:
        en: |-
          In the security tooling account, turn on automatic enablement of Macie for new accounts in each of the two Regions.
        fr: |-
          Dans le compte d'outillage de sécurité, activer l'activation automatique de Macie pour les nouveaux comptes dans chacune des deux Régions.
    - id: d
      text:
        en: |-
          From each member account, send a Macie membership invitation to the security tooling account in both Regions.
        fr: |-
          Depuis chaque compte membre, envoyer une invitation d'adhésion Macie au compte d'outillage de sécurité dans les deux Régions.
    - id: e
      text:
        en: |-
          In the security tooling account, add the existing organization accounts as Macie member accounts in each of the two Regions.
        fr: |-
          Dans le compte d'outillage de sécurité, ajouter les comptes existants de l'organisation comme comptes membres Macie dans chacune des deux Régions.
    - id: f
      text:
        en: |-
          Attach an SCP to the organization root that allows macie2:EnableMacie for the security tooling account.
        fr: |-
          Attacher à la racine de l'organisation une SCP qui autorise macie2:EnableMacie pour le compte d'outillage de sécurité.
answer:
  optionIds: [a, c, e]
explanation:
  correct:
    en: |-
      The Macie delegated administrator is designated in each Region, and it must be the same account in every Region. Automatic enablement in each Region covers accounts that join later but does not affect existing accounts, so the administrator must also add the existing accounts as members.
    fr: |-
      L'administrateur délégué Macie est désigné dans chaque Région, et ce doit être le même compte dans toutes les Régions. L'activation automatique dans chaque Région couvre les comptes qui rejoignent l'organisation plus tard mais n'affecte pas les comptes existants : l'administrateur doit donc aussi ajouter les comptes existants comme membres.
  options:
    b:
      en: |-
        Macie requires the same administrator account in each Region, so designating different accounts per Region is not possible.
      fr: |-
        Macie exige le même compte administrateur dans chaque Région : désigner des comptes différents selon la Région n'est pas possible.
    d:
      en: |-
        Invitations are for accounts that are managed outside an organization, and the administrator, not the member, starts the process.
      fr: |-
        Les invitations servent aux comptes gérés en dehors d'une organisation, et c'est l'administrateur, et non le membre, qui lance le processus.
    f:
      en: |-
        An SCP never grants permissions and does not enable Macie in any account.
      fr: |-
        Une SCP n'accorde jamais d'autorisations et n'active Macie dans aucun compte.
references:
  - title: "Integrating and configuring an organization in Macie - Amazon Macie"
    url: https://docs.aws.amazon.com/macie/latest/user/accounts-mgmt-ao-integrate.html
