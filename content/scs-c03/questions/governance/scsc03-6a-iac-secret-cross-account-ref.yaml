id: scsc03-6a-iac-secret-cross-account-ref
objective: "6.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's security account, 111122223333, stores a partner API key in an AWS Secrets Manager secret that is encrypted with the AWS managed key aws/secretsmanager. Stacks in workload account 444455556666 are deployed with the CloudFormation service role CfnDeployRole and must pass the key to a resource property. The secret must stay only in the security account, and its value must never appear in templates, stack parameters, or pipeline logs.

    Which solution will meet these requirements?
  fr: |-
    Le compte de sécurité d'AnyCompany, 111122223333, stocke une clé d'API d'un partenaire dans un secret AWS Secrets Manager chiffré avec la clé gérée par AWS aws/secretsmanager. Les piles du compte de charges de travail 444455556666 sont déployées avec le rôle de service CloudFormation CfnDeployRole et doivent transmettre la clé à une propriété de ressource. Le secret doit rester uniquement dans le compte de sécurité, et sa valeur ne doit jamais apparaître dans les modèles, les paramètres de pile ou les journaux du pipeline.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow CfnDeployRole in a resource policy on the secret, keep the AWS managed key, and reference the secret by its name in a dynamic reference.
        fr: |-
          Autoriser CfnDeployRole dans une politique de ressource du secret, conserver la clé gérée par AWS, et référencer le secret par son nom dans une référence dynamique.
    - id: b
      text:
        en: |-
          Replicate the secret to account 444455556666, and reference the replica in the stacks with a Secrets Manager dynamic reference.
        fr: |-
          Répliquer le secret dans le compte 444455556666, et référencer la réplique dans les piles avec une référence dynamique Secrets Manager.
    - id: c
      text:
        en: |-
          Re-encrypt the secret with a customer managed key that CfnDeployRole can use, allow the role in the secret policy, and reference the full secret ARN.
        fr: |-
          Rechiffrer le secret avec une clé gérée par le client que CfnDeployRole peut utiliser, autoriser le rôle dans la politique du secret, et référencer l'ARN complet du secret.
    - id: d
      text:
        en: |-
          Have the pipeline read the secret value at deployment time and pass it to the stack as a parameter with NoEcho set to true.
        fr: |-
          Faire lire la valeur du secret par le pipeline au moment du déploiement et la transmettre à la pile sous forme de paramètre avec NoEcho défini sur true.
answer:
  optionId: c
explanation:
  correct:
    en: |-
      Cross-account access to a secret needs a customer managed KMS key whose key policy lets the other account's role decrypt, plus a secret resource policy and an identity policy for that role. A Secrets Manager dynamic reference to another account must use the full secret ARN, and CloudFormation resolves it at deployment without persisting the value in its logs.
    fr: |-
      L'accès intercompte à un secret exige une clé KMS gérée par le client dont la politique de clé autorise le rôle de l'autre compte à déchiffrer, ainsi qu'une politique de ressource sur le secret et une politique d'identité pour ce rôle. Une référence dynamique Secrets Manager vers un autre compte doit utiliser l'ARN complet du secret, et CloudFormation la résout au déploiement sans conserver la valeur dans ses journaux.
  options:
    a:
      en: |-
        The AWS managed key aws/secretsmanager cannot be used for cross-account access, and a cross-account reference needs the full ARN.
      fr: |-
        La clé gérée par AWS aws/secretsmanager ne peut pas être utilisée pour un accès intercompte, et une référence intercompte exige l'ARN complet.
    b:
      en: |-
        Secrets Manager replication copies a secret to other Regions of the same account, and a copy would violate the requirement to keep the secret in one account.
      fr: |-
        La réplication Secrets Manager copie un secret dans d'autres Régions du même compte, et une copie violerait l'exigence de garder le secret dans un seul compte.
    d:
      en: |-
        The value passes through the pipeline, which the requirement forbids, even if NoEcho masks it in CloudFormation output.
      fr: |-
        La valeur transite par le pipeline, ce que l'exigence interdit, même si NoEcho la masque dans les sorties de CloudFormation.
references:
  - title: "Get a secret or secret value from Secrets Manager - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-secretsmanager.html
  - title: "Access AWS Secrets Manager secrets from a different account - AWS Secrets Manager"
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access_examples_cross.html
