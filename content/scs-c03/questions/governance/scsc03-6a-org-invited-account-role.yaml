id: scsc03-6a-org-invited-account-role
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany invited five existing standalone AWS accounts into its organization in AWS Organizations, and the accounts accepted the invitations. Administrators in the management account can switch to the OrganizationAccountAccessRole role in accounts that were created with Organizations, but the role switch fails for the five invited accounts. The administrators need the same administrative access to the invited accounts.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany a invité cinq comptes AWS autonomes existants dans son organisation AWS Organizations, et les comptes ont accepté les invitations. Les administrateurs du compte de gestion peuvent basculer vers le rôle OrganizationAccountAccessRole dans les comptes créés avec Organizations, mais le changement de rôle échoue pour les cinq comptes invités. Les administrateurs ont besoin du même accès administratif aux comptes invités.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable trusted access for AWS Account Management in Organizations so that Organizations creates the role in the invited accounts.
        fr: |-
          Activer l'accès approuvé pour AWS Account Management dans Organizations afin qu'Organizations crée le rôle dans les comptes invités.
    - id: b
      text:
        en: |-
          Attach an SCP to the invited accounts that allows sts:AssumeRole for principals of the management account.
        fr: |-
          Attacher aux comptes invités une SCP qui autorise sts:AssumeRole pour les principaux du compte de gestion.
    - id: c
      text:
        en: |-
          Remove the invited accounts from the organization, and invite them again after all features are enabled so that the role is created.
        fr: |-
          Retirer les comptes invités de l'organisation, puis les inviter de nouveau une fois toutes les fonctionnalités activées afin que le rôle soit créé.
    - id: d
      text:
        en: |-
          In each invited account, create an OrganizationAccountAccessRole role with administrator permissions that trusts the management account.
        fr: |-
          Dans chaque compte invité, créer un rôle OrganizationAccountAccessRole avec des autorisations d'administrateur qui approuve le compte de gestion.
answer:
  optionId: d
explanation:
  correct:
    en: |-
      Organizations creates OrganizationAccountAccessRole automatically only in accounts created with the console, the CLI or the CreateAccount API. Invited accounts never get it, so an administrator of each invited account must create an identical role that grants full administrative permissions and trusts the management account.
    fr: |-
      Organizations crée automatiquement OrganizationAccountAccessRole uniquement dans les comptes créés avec la console, la CLI ou l'API CreateAccount. Les comptes invités ne le reçoivent jamais : un administrateur de chaque compte invité doit donc créer un rôle identique qui accorde des autorisations d'administration complètes et approuve le compte de gestion.
  options:
    a:
      en: |-
        Trusted access lets a service act across the organization with service-linked roles; it does not create an administrative role for the management account.
      fr: |-
        L'accès approuvé permet à un service d'agir dans l'organisation avec des rôles liés à un service ; il ne crée pas de rôle administratif pour le compte de gestion.
    b:
      en: |-
        An SCP never grants permissions, and no role exists in the invited accounts for the principals to assume.
      fr: |-
        Une SCP n'accorde jamais d'autorisations, et aucun rôle n'existe dans les comptes invités que les principaux pourraient assumer.
    c:
      en: |-
        Inviting an account again never creates the role; only account creation through Organizations does.
      fr: |-
        Inviter de nouveau un compte ne crée jamais le rôle ; seule la création de compte par Organizations le fait.
references:
  - title: "Accessing a member account that has OrganizationAccountAccessRole with AWS Organizations - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_accounts_access-cross-account-role.html
