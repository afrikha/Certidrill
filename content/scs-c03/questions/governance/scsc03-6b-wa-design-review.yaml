id: scsc03-6b-wa-design-review
objective: "6.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is designing a new payments workload that will be deployed next quarter. Before deployment, the security architect must assess the design decisions for identity, detection, infrastructure protection, data protection, and incident response against AWS security best practices. The architect must record the risks with the business owner and obtain a prioritized plan of improvements. No resources have been deployed yet.

    Which solution will meet these requirements?
  fr: |
    AnyCompany conçoit une nouvelle charge de travail de paiement qui sera déployée au prochain trimestre. Avant le déploiement, l'architecte sécurité doit évaluer les choix de conception en matière d'identité, de détection, de protection de l'infrastructure, de protection des données et de réponse aux incidents par rapport aux bonnes pratiques de sécurité AWS. L'architecte doit consigner les risques avec le responsable métier et obtenir un plan d'améliorations priorisé. Aucune ressource n'a encore été déployée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Define the workload in the AWS Well-Architected Tool, answer the Security pillar questions of the Framework lens, and use the improvement plan."
        fr: "Définir la charge de travail dans l'AWS Well-Architected Tool, répondre aux questions du pilier Sécurité de l'objectif (lens) Framework, et utiliser le plan d'amélioration."
    - id: b
      text:
        en: "Enable the AWS Foundational Security Best Practices standard in Security Hub CSPM in the workload account and review the failed controls."
        fr: "Activer la norme AWS Foundational Security Best Practices dans Security Hub CSPM dans le compte de la charge de travail et examiner les contrôles en échec."
    - id: c
      text:
        en: "Run the AWS Trusted Advisor security checks in the workload account, and export the recommendations to the business owner."
        fr: "Exécuter les vérifications de sécurité AWS Trusted Advisor dans le compte de la charge de travail, et exporter les recommandations pour le responsable métier."
    - id: d
      text:
        en: "Deploy the Operational Best Practices for AWS Well-Architected Framework Security Pillar conformance pack in the workload account, and review its results."
        fr: "Déployer le pack de conformité Operational Best Practices for AWS Well-Architected Framework Security Pillar dans le compte de la charge de travail, et examiner ses résultats."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The AWS Well-Architected Tool records a review of a workload against the pillars of the Framework, including the Security pillar, from the answers of the team, so it works before anything is deployed. The answers produce high and medium risk issues, and the improvement plan lists prioritized best practices to implement.
    fr: |-
      L'AWS Well-Architected Tool enregistre une revue d'une charge de travail par rapport aux piliers du Framework, dont le pilier Sécurité, à partir des réponses de l'équipe : il fonctionne donc avant tout déploiement. Les réponses produisent des problèmes à risque élevé et moyen, et le plan d'amélioration liste les bonnes pratiques priorisées à mettre en œuvre.
  options:
    b:
      en: |-
        Security Hub CSPM evaluates deployed resources; with nothing deployed it has nothing to check, and it does not assess design decisions such as incident response readiness.
      fr: |-
        Security Hub CSPM évalue des ressources déployées ; sans déploiement, il n'a rien à vérifier, et il n'évalue pas des choix de conception comme la préparation à la réponse aux incidents.
    c:
      en: |-
        Trusted Advisor checks existing account settings and resources; it does not review a design or track risks with a business owner.
      fr: |-
        Trusted Advisor vérifie les paramètres et ressources existants du compte ; il ne passe pas en revue une conception et ne suit pas de risques avec un responsable métier.
    d:
      en: |-
        A conformance pack evaluates the configuration of deployed resources with Config rules; it is not a design review.
      fr: |-
        Un pack de conformité évalue la configuration des ressources déployées avec des règles Config ; ce n'est pas une revue de conception.
references:
  - title: Using lenses in AWS WA Tool - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/lenses.html
