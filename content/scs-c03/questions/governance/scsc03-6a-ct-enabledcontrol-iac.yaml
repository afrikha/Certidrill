id: scsc03-6a-ct-enabledcontrol-iac
objective: "6.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany uses AWS Control Tower with 12 registered OUs. The security team wants the elective and strongly recommended controls of each OU to be defined as code, reviewed in pull requests, and deployed by an AWS CloudFormation pipeline in the management account. The controls must appear as enabled controls in the Control Tower console.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany utilise AWS Control Tower avec 12 OU enregistrées. L'équipe de sécurité veut que les contrôles facultatifs et fortement recommandés de chaque OU soient définis sous forme de code, revus dans des pull requests et déployés par un pipeline AWS CloudFormation dans le compte de gestion. Les contrôles doivent apparaître comme des contrôles activés dans la console Control Tower.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Write SCPs equivalent to the controls as AWS::Organizations::Policy resources, and attach them to the registered OUs.
        fr: |-
          Écrire des SCP équivalentes aux contrôles sous forme de ressources AWS::Organizations::Policy, et les attacher aux OU enregistrées.
    - id: b
      text:
        en: |-
          Deploy an organization conformance pack that contains AWS Config rules equivalent to the controls.
        fr: |-
          Déployer un pack de conformité d'organisation contenant des règles AWS Config équivalentes aux contrôles.
    - id: c
      text:
        en: |-
          Use a service-managed StackSet to deploy the controls as stack instances into each account of the OUs.
        fr: |-
          Utiliser un StackSet géré par le service pour déployer les contrôles sous forme d'instances de pile dans chaque compte des OU.
    - id: d
      text:
        en: |-
          Declare AWS::ControlTower::EnabledControl resources with the control ARN and the OU ARN in the pipeline's templates.
        fr: |-
          Déclarer dans les modèles du pipeline des ressources AWS::ControlTower::EnabledControl avec l'ARN du contrôle et l'ARN de l'OU.
answer:
  optionId: d
explanation:
  correct:
    en: |-
      AWS::ControlTower::EnabledControl enables a Control Tower control on an OU from CloudFormation, with the control ARN as ControlIdentifier and the OU ARN as TargetIdentifier, and optional parameters. It accepts strongly recommended and elective controls, so the controls are managed as code and appear as enabled controls in Control Tower.
    fr: |-
      AWS::ControlTower::EnabledControl active un contrôle Control Tower sur une OU depuis CloudFormation, avec l'ARN du contrôle comme ControlIdentifier, l'ARN de l'OU comme TargetIdentifier et des paramètres facultatifs. Il accepte les contrôles fortement recommandés et facultatifs : les contrôles sont gérés sous forme de code et apparaissent comme activés dans Control Tower.
  options:
    a:
      en: |-
        Self-managed SCPs are not Control Tower controls, so they do not appear as enabled controls and do not cover detective or proactive behaviors.
      fr: |-
        Des SCP gérées soi-même ne sont pas des contrôles Control Tower : elles n'apparaissent pas comme contrôles activés et ne couvrent pas les comportements détectifs ou proactifs.
    b:
      en: |-
        Config rules in a conformance pack are not Control Tower controls and are not shown as enabled controls on the OUs.
      fr: |-
        Les règles Config d'un pack de conformité ne sont pas des contrôles Control Tower et n'apparaissent pas comme contrôles activés sur les OU.
    c:
      en: |-
        Controls are enabled on an OU through the Control Tower API; they are not resources that a stack instance deploys into each account.
      fr: |-
        Les contrôles s'activent sur une OU via l'API Control Tower ; ce ne sont pas des ressources qu'une instance de pile déploie dans chaque compte.
references:
  - title: "AWS::ControlTower::EnabledControl - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-controltower-enabledcontrol.html
  - title: "Control behavior and guidance - AWS Control Tower"
    url: https://docs.aws.amazon.com/controltower/latest/controlreference/control-behavior.html
