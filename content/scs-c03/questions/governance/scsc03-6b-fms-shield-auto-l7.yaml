id: scsc03-6b-fms-shield-auto-l7
objective: "6.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's workloads use Amazon CloudFront distributions and Application Load Balancers in the us-east-1, eu-west-1, and ap-southeast-2 Regions, in 40 accounts of its organization in AWS Organizations. AWS Shield Advanced is active for all accounts, and AWS Firewall Manager is administered from the security account. All web ACLs use the current version of AWS WAF.

    The security team requires that every distribution and every Application Load Balancer, including new ones, is protected by Shield Advanced with automatic application layer DDoS mitigation that blocks matching requests. The settings must be enforced centrally.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Les charges de travail d'AnyCompany utilisent des distributions Amazon CloudFront et des Application Load Balancers dans les Régions us-east-1, eu-west-1 et ap-southeast-2, dans 40 comptes de son organisation AWS Organizations. AWS Shield Advanced est actif pour tous les comptes, et AWS Firewall Manager est administré depuis le compte de sécurité. Toutes les listes ACL web utilisent la version actuelle d'AWS WAF.

    L'équipe de sécurité exige que chaque distribution et chaque Application Load Balancer, y compris les nouveaux, soit protégé par Shield Advanced avec une atténuation DDoS automatique de la couche application qui bloque les requêtes correspondantes. Les paramètres doivent être imposés de manière centralisée.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create one Shield Advanced policy in us-east-1 for Application Load Balancers that covers the load balancers of all three Regions, with automatic mitigation enabled in Block mode."
        fr: "Créer dans us-east-1 une seule politique Shield Advanced pour les Application Load Balancers qui couvre les équilibreurs de charge des trois Régions, avec l'atténuation automatique activée en mode Block."
    - id: b
      text:
        en: "Create a Shield Advanced policy in the Global Region for CloudFront distributions, with automatic application layer DDoS mitigation enabled in Block mode and auto remediation."
        fr: "Créer dans la Région Global une politique Shield Advanced pour les distributions CloudFront, avec l'atténuation DDoS automatique de la couche application activée en mode Block et la correction automatique."
    - id: c
      text:
        en: "Recreate the web ACLs in AWS WAF Classic so that Shield Advanced can add its automatic mitigation rules to them in every Region."
        fr: "Recréer les listes ACL web dans AWS WAF Classic pour que Shield Advanced puisse y ajouter ses règles d'atténuation automatique dans chaque Région."
    - id: d
      text:
        en: "Add the Elastic IP addresses of the workloads' EC2 instances to a Shield Advanced policy with automatic application layer DDoS mitigation enabled."
        fr: "Ajouter les adresses IP Elastic des instances EC2 des charges de travail à une politique Shield Advanced avec l'atténuation DDoS automatique de la couche application activée."
    - id: e
      text:
        en: "Create a Shield Advanced policy for Application Load Balancers in each of the three Regions, with automatic application layer DDoS mitigation enabled in Block mode and auto remediation."
        fr: "Créer une politique Shield Advanced pour les Application Load Balancers dans chacune des trois Régions, avec l'atténuation DDoS automatique de la couche application activée en mode Block et la correction automatique."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Automatic application layer DDoS mitigation works only for CloudFront distributions and Application Load Balancers. CloudFront is covered by a Shield Advanced policy in the Global Region, while Regional resources need a separate Firewall Manager policy in each Region. With the option enabled and Block chosen, Firewall Manager marks resources without matching settings as noncompliant and remediates them.
    fr: |-
      L'atténuation DDoS automatique de la couche application ne fonctionne que pour les distributions CloudFront et les Application Load Balancers. CloudFront est couvert par une politique Shield Advanced dans la Région Global, tandis que les ressources régionales exigent une politique Firewall Manager distincte dans chaque Région. Avec l'option activée et Block choisi, Firewall Manager marque comme non conformes les ressources dont les paramètres ne correspondent pas et les corrige.
  options:
    a:
      en: |-
        Except for CloudFront, protecting resources in several Regions requires a separate Firewall Manager policy in each Region.
      fr: |-
        Hors CloudFront, protéger des ressources dans plusieurs Régions exige une politique Firewall Manager distincte dans chaque Région.
    c:
      en: |-
        Automatic mitigation works only with web ACLs of the current version of AWS WAF; Classic web ACLs must be migrated, not created.
      fr: |-
        L'atténuation automatique ne fonctionne qu'avec des listes ACL web de la version actuelle d'AWS WAF ; les listes ACL web Classic doivent être migrées, pas créées.
    d:
      en: |-
        Shield Advanced does not support automatic application layer mitigation for Elastic IP addresses.
      fr: |-
        Shield Advanced ne prend pas en charge l'atténuation automatique de la couche application pour les adresses IP Elastic.
references:
  - title: Using Automatic application layer DDoS mitigation with Firewall Manager Shield Advanced policies - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/shield-policies-auto-app-layer-mitigation.html
  - title: Creating an AWS Firewall Manager policy - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/create-policy.html
