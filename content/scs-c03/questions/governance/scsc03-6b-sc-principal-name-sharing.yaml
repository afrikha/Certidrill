id: scsc03-6b-sc-principal-name-sharing
objective: "6.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany shares an AWS Service Catalog portfolio through AWS Organizations with the Workloads OU. Today, the administrator of each workload account must associate IAM principals with the imported portfolio by hand, and new accounts have no access until someone does it. A role named ProvisioningEngineer is deployed in every account by the platform team.

    The security team wants this exact role, and no other role that an account administrator might create, to get access to the portfolio in every current and future account, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany partage un portefeuille AWS Service Catalog via AWS Organizations avec l'unité d'organisation Workloads. Aujourd'hui, l'administrateur de chaque compte de charge de travail doit associer à la main des principaux IAM au portefeuille importé, et les nouveaux comptes n'ont aucun accès tant que personne ne le fait. Un rôle nommé ProvisioningEngineer est déployé dans chaque compte par l'équipe plateforme.

    L'équipe de sécurité veut que ce rôle précis, et aucun autre rôle qu'un administrateur de compte pourrait créer, obtienne l'accès au portefeuille dans chaque compte actuel et futur, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "In the catalog account, associate the exact principal name arn:aws:iam:::role/ProvisioningEngineer (IAM_PATTERN type, no wildcard) with the portfolio, and enable principal sharing on the organization share."
        fr: "Dans le compte de catalogue, associer au portefeuille le nom de principal exact arn:aws:iam:::role/ProvisioningEngineer (type IAM_PATTERN, sans caractère générique), puis activer le partage des principaux sur le partage avec l'organisation."
    - id: b
      text:
        en: "In the catalog account, associate the principal name arn:aws:iam:::role/Provisioning* (IAM_PATTERN type, with a wildcard) with the portfolio, and enable principal sharing on the organization share."
        fr: "Dans le compte de catalogue, associer au portefeuille le nom de principal arn:aws:iam:::role/Provisioning* (type IAM_PATTERN, avec un caractère générique), puis activer le partage des principaux sur le partage avec l'organisation."
    - id: c
      text:
        en: "Replace the organization share with account-to-account shares to each workload account, and enable principal sharing on each share."
        fr: "Remplacer le partage avec l'organisation par des partages de compte à compte vers chaque compte de charge de travail, puis activer le partage des principaux sur chaque partage."
    - id: d
      text:
        en: "Deploy a CloudFormation stack set to every workload account that associates the local ProvisioningEngineer role with the imported portfolio, and update it whenever an account joins the OU."
        fr: "Déployer dans chaque compte de charge de travail un StackSet CloudFormation qui associe le rôle local ProvisioningEngineer au portefeuille importé, et le mettre à jour chaque fois qu'un compte rejoint l'unité d'organisation."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Principal name sharing lets the catalog administrator specify role, group, or user names in the portfolio; Service Catalog associates the matching IAM principals in recipient accounts automatically and applies later changes. A principal name is an IAM ARN without an account ID; without a wildcard, it matches only roles named exactly ProvisioningEngineer, which avoids the escalation path of broad patterns.
    fr: |-
      Le partage des noms de principaux permet à l'administrateur du catalogue d'indiquer des noms de rôles, de groupes ou d'utilisateurs dans le portefeuille ; Service Catalog associe automatiquement les principaux IAM correspondants dans les comptes destinataires et applique les modifications ultérieures. Un nom de principal est un ARN IAM sans ID de compte ; sans caractère générique, il ne correspond qu'aux rôles nommés exactement ProvisioningEngineer, ce qui évite le risque d'élévation des modèles larges.
  options:
    b:
      en: |-
        The wildcard also matches roles such as ProvisioningAdmin that an account administrator could create to gain access to the portfolio.
      fr: |-
        Le caractère générique correspond aussi à des rôles comme ProvisioningAdmin qu'un administrateur de compte pourrait créer pour obtenir l'accès au portefeuille.
    c:
      en: |-
        Principal name sharing is available only for AWS Organizations shares, and account-to-account shares must be maintained for each new account.
      fr: |-
        Le partage des noms de principaux n'est disponible que pour les partages AWS Organizations, et les partages de compte à compte doivent être gérés pour chaque nouveau compte.
    d:
      en: |-
        This works but must be maintained for each new account, which is more effort than letting principal name sharing apply the association automatically.
      fr: |-
        Cela fonctionne mais doit être maintenu pour chaque nouveau compte, ce qui demande plus d'efforts que de laisser le partage des noms de principaux appliquer l'association automatiquement.
references:
