id: scsc03-6a-root-remove-member-creds
objective: "6.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    AnyCompany has 150 member accounts in AWS Organizations. Many accounts were created years ago, and a former team set their root user passwords and MFA devices. The security team must remove the root passwords, access keys, and MFA devices from every member account, and accounts that are created later must have no root credentials. The work must be done from the security tooling account, and no one must sign in as a root user.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany dispose de 150 comptes membres dans AWS Organizations. De nombreux comptes ont été créés il y a plusieurs années, et une ancienne équipe a défini les mots de passe et les dispositifs MFA de leurs utilisateurs racine. L'équipe de sécurité doit supprimer les mots de passe racine, les clés d'accès et les dispositifs MFA de chaque compte membre, et les comptes créés ultérieurement ne doivent avoir aucune information d'identification racine. Le travail doit être effectué depuis le compte d'outillage de sécurité, et personne ne doit se connecter en tant qu'utilisateur racine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an SCP to the organization root that denies all actions when aws:PrincipalArn matches arn:aws:iam::*:root in member accounts.
        fr: |-
          Attacher à la racine de l'organisation une SCP qui refuse toutes les actions lorsque aws:PrincipalArn correspond à arn:aws:iam::*:root dans les comptes membres.
    - id: b
      text:
        en: |-
          Reset each root password through password recovery, and store the new passwords in a vault that only the security team can open.
        fr: |-
          Réinitialiser chaque mot de passe racine par la récupération de mot de passe, et stocker les nouveaux mots de passe dans un coffre que seule l'équipe de sécurité peut ouvrir.
    - id: c
      text:
        en: |-
          Enable centralized root access, make the security tooling account the IAM delegated administrator, and delete each account's root credentials.
        fr: |-
          Activer l'accès racine centralisé, faire du compte d'outillage de sécurité l'administrateur délégué IAM, et supprimer les informations racine de chaque compte.
    - id: d
      text:
        en: |-
          Deploy the AWS Config managed rule that checks root MFA, with an automatic remediation that deactivates noncompliant root users.
        fr: |-
          Déployer la règle gérée AWS Config qui vérifie la MFA racine, avec une correction automatique qui désactive les utilisateurs racine non conformes.
answer:
  optionId: c
explanation:
  correct:
    en: |-
      Centralized root access lets the management account or an IAM delegated administrator delete the root password, access keys, signing certificates, and MFA devices of member accounts, without anyone signing in as root. Once root credentials management is enabled, new accounts created in Organizations have no root credentials by default.
    fr: |-
      L'accès racine centralisé permet au compte de gestion ou à un administrateur délégué IAM de supprimer le mot de passe racine, les clés d'accès, les certificats de signature et les dispositifs MFA des comptes membres, sans que personne ne se connecte en tant qu'utilisateur racine. Une fois la gestion des informations racine activée, les nouveaux comptes créés dans Organizations n'ont par défaut aucune information racine.
  options:
    a:
      en: |-
        The SCP limits what the root users can do, but their credentials remain in place and can still be recovered.
      fr: |-
        La SCP limite ce que peuvent faire les utilisateurs racine, mais leurs informations d'identification restent en place et peuvent toujours être récupérées.
    b:
      en: |-
        This keeps root credentials in every account and requires root sign-in, which the requirement forbids.
      fr: |-
        Cela conserve des informations racine dans chaque compte et exige une connexion racine, ce que l'exigence interdit.
    d:
      en: |-
        A Config rule evaluates MFA configuration; there is no remediation that deactivates a root user or removes its credentials.
      fr: |-
        Une règle Config évalue la configuration MFA ; aucune correction ne désactive un utilisateur racine ni ne supprime ses informations d'identification.
references:
  - title: "AWS account root user - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
  - title: "Centralize root access for member accounts - AWS Identity and Access Management"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-enable-root-access.html
