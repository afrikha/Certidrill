id: scsc03-6a-pol-scp-attachment-quota
objective: "6.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany's Workloads OU uses a deny-list strategy. The root and the OU both have FullAWSAccess attached, and the OU has 10 SCPs attached directly, including FullAWSAccess. When the security team tries to attach an 11th SCP with two new deny statements to the OU, the request fails with a constraint violation. The new statements must apply to every current and future account of the Workloads OU and to no other OU. The OU structure must not change, and no existing deny statement can be removed.

    Which solution will meet these requirements?
  fr: |-
    L'OU Workloads d'AnyCompany utilise une stratégie de liste de refus. La racine et l'OU ont toutes deux FullAWSAccess attachée, et l'OU a 10 SCP attachées directement, dont FullAWSAccess. Lorsque l'équipe de sécurité tente d'attacher à l'OU une 11e SCP contenant deux nouvelles instructions de refus, la demande échoue avec une violation de contrainte. Les nouvelles instructions doivent s'appliquer à tous les comptes actuels et futurs de l'OU Workloads et à aucune autre OU. La structure des OU ne doit pas changer, et aucune instruction de refus existante ne peut être supprimée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Detach FullAWSAccess from the Workloads OU to free a slot, and attach the new SCP in its place.
        fr: |-
          Détacher FullAWSAccess de l'OU Workloads pour libérer un emplacement, et attacher la nouvelle SCP à sa place.
    - id: b
      text:
        en: |-
          Attach the new SCP to the organization root instead, because the root still has free SCP attachment slots.
        fr: |-
          Attacher plutôt la nouvelle SCP à la racine de l'organisation, car la racine dispose encore d'emplacements d'attachement de SCP libres.
    - id: c
      text:
        en: |-
          Merge the two statements into one of the deny SCPs already attached to the Workloads OU, within the SCP size limit.
        fr: |-
          Fusionner les deux instructions dans l'une des SCP de refus déjà attachées à l'OU Workloads, dans la limite de taille des SCP.
    - id: d
      text:
        en: |-
          Attach the new SCP directly to each account that is currently in the Workloads OU.
        fr: |-
          Attacher la nouvelle SCP directement à chaque compte qui se trouve actuellement dans l'OU Workloads.
answer:
  optionId: c
explanation:
  correct:
    en: |-
      An OU can have at most 10 SCPs attached directly, and the limit cannot be bypassed by attaching more. Adding the statements to an SCP that is already attached to the OU keeps them scoped to the Workloads OU and its future accounts, as long as the policy stays under the 10,240-character SCP size limit.
    fr: |-
      Une OU peut avoir au maximum 10 SCP attachées directement, et cette limite ne peut pas être contournée en en attachant davantage. Ajouter les instructions à une SCP déjà attachée à l'OU les limite à l'OU Workloads et à ses futurs comptes, tant que la politique reste sous la limite de 10 240 caractères des SCP.
  options:
    a:
      en: |-
        In a deny-list strategy, the OU needs an allow policy; without FullAWSAccess at the OU level, every action in its accounts would fail.
      fr: |-
        Dans une stratégie de liste de refus, l'OU a besoin d'une politique d'autorisation ; sans FullAWSAccess au niveau de l'OU, toutes les actions de ses comptes échoueraient.
    b:
      en: |-
        A root attachment applies the new denies to every OU, which the requirement excludes.
      fr: |-
        Un attachement à la racine applique les nouveaux refus à toutes les OU, ce que l'exigence exclut.
    d:
      en: |-
        Accounts that join the OU later would not receive the new SCP, and each account would need its own attachment.
      fr: |-
        Les comptes qui rejoignent l'OU plus tard ne recevraient pas la nouvelle SCP, et chaque compte aurait besoin de son propre attachement.
references:
  - title: "Quotas and service limits for AWS Organizations - AWS Organizations"
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html
