id: scsc03-6b-tag-createaction-runinstances
objective: "6.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In AnyCompany's sandbox account 111122223333, developers launch Amazon EC2 instances and must apply the Owner and CostCenter tags in the RunInstances request; another statement already requires both tags at launch. The tags also control who can start AWS Systems Manager Session Manager sessions on each instance.

    The security team requires that developers cannot add, change, or remove tags on instances that already exist. The Developer role allows ec2:RunInstances and has no other EC2 tagging permission. Developers currently receive an UnauthorizedOperation error when they launch tagged instances.

    Which additional policy statement will meet these requirements?
  fr: |
    Dans le compte sandbox 111122223333 d'AnyCompany, les développeurs lancent des instances Amazon EC2 et doivent appliquer les balises Owner et CostCenter dans la requête RunInstances ; une autre instruction exige déjà les deux balises au lancement. Les balises déterminent aussi qui peut ouvrir des sessions AWS Systems Manager Session Manager sur chaque instance.

    L'équipe de sécurité exige que les développeurs ne puissent pas ajouter, modifier ni retirer des balises sur des instances qui existent déjà. Le rôle Developer autorise ec2:RunInstances et ne dispose d'aucune autre autorisation de balisage EC2. Actuellement, les développeurs reçoivent une erreur UnauthorizedOperation lorsqu'ils lancent des instances balisées.

    Quelle instruction de politique supplémentaire répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Allow ec2:CreateTags on arn:aws:ec2:*:111122223333:*/* when aws:RequestTag/Owner equals ${aws:username}."
        fr: "Autoriser ec2:CreateTags sur arn:aws:ec2:*:111122223333:*/* lorsque aws:RequestTag/Owner est égal à ${aws:username}."
    - id: b
      text:
        en: "No statement is needed; remove the tag requirement, because RunInstances already includes the permission to apply tags."
        fr: "Aucune instruction n'est nécessaire ; supprimer l'exigence de balises, car RunInstances inclut déjà l'autorisation d'appliquer des balises."
    - id: c
      text:
        en: "Allow ec2:CreateTags on arn:aws:ec2:*:111122223333:*/* when ec2:CreateAction equals RunInstances."
        fr: "Autoriser ec2:CreateTags sur arn:aws:ec2:*:111122223333:*/* lorsque ec2:CreateAction est égal à RunInstances."
    - id: d
      text:
        en: "Allow ec2:CreateTags on arn:aws:ec2:*:111122223333:*/* when a Null condition shows that aws:ResourceTag/Owner does not exist."
        fr: "Autoriser ec2:CreateTags sur arn:aws:ec2:*:111122223333:*/* lorsqu'une condition Null indique que aws:ResourceTag/Owner n'existe pas."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When a creation request such as RunInstances contains tags, Amazon EC2 also authorizes ec2:CreateTags. Restricting that permission with ec2:CreateAction = RunInstances allows tags only as part of the launch, so a direct CreateTags call on an existing instance stays implicitly denied, and DeleteTags is not granted at all.
    fr: |-
      Lorsqu'une requête de création comme RunInstances contient des balises, Amazon EC2 autorise aussi ec2:CreateTags. Restreindre cette autorisation avec ec2:CreateAction = RunInstances n'autorise les balises que dans le cadre du lancement : un appel CreateTags direct sur une instance existante reste refusé implicitement, et DeleteTags n'est pas accordé du tout.
  options:
    a:
      en: |-
        This condition also matches a direct CreateTags call on an existing instance, so developers could retag any instance with their own name as Owner.
      fr: |-
        Cette condition correspond aussi à un appel CreateTags direct sur une instance existante : les développeurs pourraient rebaliser n'importe quelle instance avec leur propre nom comme Owner.
    b:
      en: |-
        RunInstances with tags fails without ec2:CreateTags permission, and removing the tag requirement would break the Session Manager access model.
      fr: |-
        RunInstances avec des balises échoue sans autorisation ec2:CreateTags, et supprimer l'exigence de balises casserait le modèle d'accès Session Manager.
    d:
      en: |-
        Any existing instance without an Owner tag could then be tagged directly, which lets developers take over untagged instances.
      fr: |-
        Toute instance existante sans balise Owner pourrait alors être balisée directement, ce qui permet aux développeurs de s'approprier des instances non balisées.
references:
  - title: Grant permission to tag Amazon EC2 resources during creation - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/supported-iam-actions-tagging.html
