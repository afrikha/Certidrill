id: scsc03-6a-iac-guard-hook-stackset
objective: "6.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    AnyCompany has 90 accounts in its Workloads OU, and new accounts join every month. Application teams deploy AWS CloudFormation stacks from pipelines that they own. The security team keeps its rules in one AWS CloudFormation Guard rules file in an S3 bucket in the security tooling account. Any stack operation in any workload account that would create a noncompliant resource must be blocked before the resource is provisioned, even if a team skips steps in its pipeline.

    Which solution will meet these requirements?
  fr: |-
    AnyCompany dispose de 90 comptes dans son OU Workloads, et de nouveaux comptes la rejoignent chaque mois. Les équipes applicatives déploient des piles AWS CloudFormation depuis des pipelines qu'elles possèdent. L'équipe de sécurité conserve ses règles dans un fichier de règles AWS CloudFormation Guard unique, dans un compartiment S3 du compte d'outillage de sécurité. Toute opération de pile, dans n'importe quel compte de charges de travail, qui créerait une ressource non conforme doit être bloquée avant le provisionnement de la ressource, même si une équipe saute des étapes de son pipeline.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy an AWS::CloudFormation::GuardHook with FailureMode WARN that reads the central rules file to the OU with a service-managed StackSet with automatic deployment.
        fr: |-
          Déployer sur l'OU, avec un StackSet géré par le service et le déploiement automatique, un AWS::CloudFormation::GuardHook avec FailureMode WARN qui lit le fichier de règles central.
    - id: b
      text:
        en: |-
          Deploy an AWS::CloudFormation::GuardHook with FailureMode FAIL that reads the central rules file to the OU with a service-managed StackSet with automatic deployment.
        fr: |-
          Déployer sur l'OU, avec un StackSet géré par le service et le déploiement automatique, un AWS::CloudFormation::GuardHook avec FailureMode FAIL qui lit le fichier de règles central.
    - id: c
      text:
        en: |-
          Publish a shared pipeline template that runs cfn-guard validate against the central rules file, and require every team to use it.
        fr: |-
          Publier un modèle de pipeline partagé qui exécute cfn-guard validate avec le fichier de règles central, et exiger que chaque équipe l'utilise.
    - id: d
      text:
        en: |-
          Distribute cfn-lint custom rules that encode the security rules, and run them in a pre-commit hook on every developer workstation.
        fr: |-
          Distribuer des règles personnalisées cfn-lint qui codent les règles de sécurité, et les exécuter dans un hook pre-commit sur chaque poste de développeur.
answer:
  optionId: b
explanation:
  correct:
    en: |-
      A Guard Hook evaluates Guard rules from an S3 location before CloudFormation provisions resources, and FailureMode FAIL blocks the operation when a rule fails. Hooks must be activated in each account and Region, so a service-managed StackSet with automatic deployment installs the hook in every current and future account; the hook's execution role must be allowed to read the central rules bucket.
    fr: |-
      Un Guard Hook évalue des règles Guard stockées dans un emplacement S3 avant que CloudFormation ne provisionne les ressources, et FailureMode FAIL bloque l'opération lorsqu'une règle échoue. Les hooks doivent être activés dans chaque compte et chaque Région : un StackSet géré par le service avec déploiement automatique installe donc le hook dans chaque compte actuel et futur ; le rôle d'exécution du hook doit être autorisé à lire le compartiment central des règles.
  options:
    a:
      en: |-
        FailureMode WARN reports rule violations but lets the stack operation continue, so noncompliant resources are still created.
      fr: |-
        FailureMode WARN signale les violations de règles mais laisse l'opération de pile se poursuivre : des ressources non conformes sont donc toujours créées.
    c:
      en: |-
        Guard alone provides no server-side enforcement; a team that removes the step from its pipeline bypasses the check.
      fr: |-
        Guard seul ne fournit aucune application côté serveur ; une équipe qui retire l'étape de son pipeline contourne la vérification.
    d:
      en: |-
        cfn-lint validates templates against resource schemas and runs on the client, so it can be skipped and does not block a deployment.
      fr: |-
        cfn-lint valide les modèles par rapport aux schémas des ressources et s'exécute côté client : il peut être ignoré et ne bloque pas un déploiement.
references:
  - title: "AWS::CloudFormation::GuardHook - AWS CloudFormation"
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-cloudformation-guardhook.html
  - title: "Guard Hooks - CloudFormation"
    url: https://docs.aws.amazon.com/cloudformation-cli/latest/hooks-userguide/guard-hooks.html
