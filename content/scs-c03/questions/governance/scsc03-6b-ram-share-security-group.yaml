id: scsc03-6b-ram-share-security-group
objective: "6.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's network account owns a VPC (not a default VPC) and shares its subnets through AWS RAM with three application accounts in the same organization. The network team created the security group sg-0a1b2c3d4e5f60718 in this VPC with the approved egress rules for proxies and logging endpoints.

    The instances that the application accounts launch in the shared subnets must use this security group. Only the network team may change its rules, and every rule change must apply immediately to the application accounts' network interfaces. No copy of the group may exist in the application accounts.

    Which solution will meet these requirements?
  fr: |
    Le compte réseau d'AnyCompany possède un VPC (qui n'est pas un VPC par défaut) et partage ses sous-réseaux via AWS RAM avec trois comptes applicatifs de la même organisation. L'équipe réseau a créé dans ce VPC le groupe de sécurité sg-0a1b2c3d4e5f60718 avec les règles sortantes approuvées vers les proxys et les points de terminaison de journalisation.

    Les instances que les comptes applicatifs lancent dans les sous-réseaux partagés doivent utiliser ce groupe de sécurité. Seule l'équipe réseau peut modifier ses règles, et chaque modification de règle doit s'appliquer immédiatement aux interfaces réseau des comptes applicatifs. Aucune copie du groupe ne doit exister dans les comptes applicatifs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Share sg-0a1b2c3d4e5f60718 with the three application accounts through AWS RAM, and have the application teams associate it with the network interfaces of their instances."
        fr: "Partager sg-0a1b2c3d4e5f60718 avec les trois comptes applicatifs via AWS RAM, et faire associer ce groupe par les équipes applicatives aux interfaces réseau de leurs instances."
    - id: b
      text:
        en: "Create an AWS Firewall Manager common security group policy with sg-0a1b2c3d4e5f60718 as the primary security group, scoped to the three application accounts."
        fr: "Créer une politique AWS Firewall Manager de groupe de sécurité commun avec sg-0a1b2c3d4e5f60718 comme groupe de sécurité principal, pour les trois comptes applicatifs."
    - id: c
      text:
        en: "Move the approved rules to the VPC's default security group and share the default security group with the three application accounts through AWS RAM."
        fr: "Déplacer les règles approuvées dans le groupe de sécurité par défaut du VPC et partager ce groupe de sécurité par défaut avec les trois comptes applicatifs via AWS RAM."
    - id: d
      text:
        en: "Have each application account create its own security group in the shared VPC whose rules reference sg-0a1b2c3d4e5f60718 as the destination."
        fr: "Faire créer par chaque compte applicatif son propre groupe de sécurité dans le VPC partagé, dont les règles référencent sg-0a1b2c3d4e5f60718 comme destination."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A VPC owner can share a security group that it owns in that VPC with accounts of the same organization through AWS RAM. Participants associate the shared group with their network interfaces, the owner manages its rules, and every update applies to the participants' resources in the shared subnets.
    fr: |-
      Un propriétaire de VPC peut partager via AWS RAM un groupe de sécurité qu'il possède dans ce VPC avec des comptes de la même organisation. Les participants associent le groupe partagé à leurs interfaces réseau, le propriétaire gère ses règles, et chaque mise à jour s'applique aux ressources des participants dans les sous-réseaux partagés.
  options:
    b:
      en: |-
        A common security group policy replicates the primary group into each in-scope account, which creates the copies that the requirement forbids.
      fr: |-
        Une politique de groupe de sécurité commun réplique le groupe principal dans chaque compte concerné, ce qui crée les copies que l'exigence interdit.
    c:
      en: |-
        Default security groups cannot be shared.
      fr: |-
        Les groupes de sécurité par défaut ne peuvent pas être partagés.
    d:
      en: |-
        The application teams would own and control these groups, and referencing the network team's group does not apply its rules to the participants' interfaces.
      fr: |-
        Les équipes applicatives posséderaient et contrôleraient ces groupes, et référencer le groupe de l'équipe réseau n'applique pas ses règles aux interfaces des participants.
references:
  - title: Share security groups with AWS Organizations - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-group-sharing.html
