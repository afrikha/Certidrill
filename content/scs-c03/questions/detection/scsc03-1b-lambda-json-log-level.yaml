id: scsc03-1b-lambda-json-log-level
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 15 AWS Lambda functions on a Python managed runtime that log with the standard logging library in plain-text format. The security team wants all application logs of these functions in one shared log group named /security/payments, as structured records that can be searched by key, and only at the WARN level and above. The function code must not change.

    Which configuration will meet these requirements?
  fr: |
    AnyCompany exécute 15 fonctions AWS Lambda sur un environnement d'exécution géré Python, qui journalisent avec la bibliothèque logging standard au format texte brut. L'équipe de sécurité veut tous les journaux applicatifs de ces fonctions dans un seul groupe de journaux partagé nommé /security/payments, sous forme d'enregistrements structurés interrogeables par clé, et uniquement au niveau WARN et au-dessus. Le code des fonctions ne doit pas changer.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the text log format, set the application log level to WARN, and set the log group of each function to /security/payments.
        fr: |-
          Conserver le format de journal texte, définir le niveau de journalisation applicatif sur WARN et définir le groupe de journaux de chaque fonction sur /security/payments.
    - id: b
      text:
        en: |-
          Set the log format to JSON and the application log level to WARN, and set the log group of each function to aws/lambda/security-payments.
        fr: |-
          Définir le format de journal sur JSON et le niveau de journalisation applicatif sur WARN, et définir le groupe de journaux de chaque fonction sur aws/lambda/security-payments.
    - id: c
      text:
        en: |-
          Keep the default log groups and create a subscription filter on each one that forwards events that contain WARN or ERROR to /security/payments.
        fr: |-
          Conserver les groupes de journaux par défaut et créer sur chacun un filtre d'abonnement qui transfère vers /security/payments les événements contenant WARN ou ERROR.
    - id: d
      text:
        en: |-
          Set the log format to JSON, the application log level to WARN, and the log group to /security/payments, and allow logs:PutLogEvents on it in the roles.
        fr: |-
          Définir le format de journal sur JSON, le niveau applicatif sur WARN et le groupe de journaux sur /security/payments, et autoriser logs:PutLogEvents sur ce groupe dans les rôles.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Lambda advanced logging controls let several functions share a custom log group, and stream names keep each message mapped to its function. Log-level filtering requires the JSON log format, which also turns the logs of supported runtimes into key-value records; the execution role needs logs:PutLogEvents on the group.
    fr: |-
      Les contrôles de journalisation avancés de Lambda permettent à plusieurs fonctions de partager un groupe de journaux personnalisé, et les noms de flux associent chaque message à sa fonction. Le filtrage par niveau exige le format de journal JSON, qui transforme aussi les journaux des environnements pris en charge en enregistrements clé-valeur ; le rôle d'exécution a besoin de logs:PutLogEvents sur le groupe.
  options:
    a:
      en: |-
        Application log-level filtering works only with the JSON log format, and text logs are not structured records.
      fr: |-
        Le filtrage par niveau des journaux applicatifs ne fonctionne qu'avec le format de journal JSON, et des journaux texte ne sont pas des enregistrements structurés.
    b:
      en: |-
        Custom log group names cannot begin with aws/; Lambda cannot create such a group, and the logs would not be sent.
      fr: |-
        Les noms de groupes de journaux personnalisés ne peuvent pas commencer par aws/ ; Lambda ne peut pas créer un tel groupe, et les journaux ne seraient pas envoyés.
    c:
      en: |-
        The logs stay unstructured, all levels are still stored in the default groups, and 15 filters must be maintained.
      fr: |-
        Les journaux restent non structurés, tous les niveaux restent stockés dans les groupes par défaut, et 15 filtres doivent être maintenus.
references:
  - title: Log-level filtering - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-log-level.html
  - title: Configuring CloudWatch log groups - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-loggroups.html
