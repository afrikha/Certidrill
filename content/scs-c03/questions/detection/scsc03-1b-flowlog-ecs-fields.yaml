id: scsc03-1b-flowlog-ecs-fields
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs 12 Amazon ECS services on a shared cluster of EC2 container instances. All tasks use the awsvpc network mode and run in one account. A VPC flow log in the default format is enabled on the VPC. During an investigation, analysts can see the network interface and the instance of each rejected flow but cannot tell which ECS service and task generated it. The team wants the ECS context in each flow record with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 12 services Amazon ECS sur un cluster partagé d'instances de conteneur EC2. Toutes les tâches utilisent le mode réseau awsvpc et s'exécutent dans un même compte. Un journal de flux VPC au format par défaut est activé sur le VPC. Au cours d'une investigation, les analystes voient l'interface réseau et l'instance de chaque flux rejeté, mais ne peuvent pas savoir quel service et quelle tâche ECS l'ont généré. L'équipe veut le contexte ECS dans chaque enregistrement de flux avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a new VPC flow log with a custom format that adds the instance-id and subnet-id fields, and map each instance to the tasks that it hosts.
        fr: |-
          Créer un nouveau journal de flux VPC avec un format personnalisé qui ajoute les champs instance-id et subnet-id, et associer chaque instance aux tâches qu'elle héberge.
    - id: b
      text:
        en: |-
          Switch the tasks to the bridge network mode so that each container's traffic appears with the container instance's network interface.
        fr: |-
          Passer les tâches au mode réseau bridge pour que le trafic de chaque conteneur apparaisse avec l'interface réseau de l'instance de conteneur.
    - id: c
      text:
        en: |-
          Create a new VPC flow log with a custom format that adds the ecs-cluster-name, ecs-service-name, and ecs-task-id fields.
        fr: |-
          Créer un nouveau journal de flux VPC avec un format personnalisé qui ajoute les champs ecs-cluster-name, ecs-service-name et ecs-task-id.
    - id: d
      text:
        en: |-
          Enable CloudWatch Container Insights on the cluster and join its task metrics with the flow log records by timestamp.
        fr: |-
          Activer CloudWatch Container Insights sur le cluster et joindre ses métriques de tâches aux enregistrements de flux par horodatage.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Flow log records can include ECS fields (version 7) such as ecs-cluster-name, ecs-service-name, and ecs-task-id. They are computed for tasks in the awsvpc network mode that the account owns, so each record carries its ECS context without any mapping work; a new flow log is needed because the format of an existing one cannot change.
    fr: |-
      Les enregistrements de flux peuvent inclure des champs ECS (version 7) comme ecs-cluster-name, ecs-service-name et ecs-task-id. Ils sont calculés pour les tâches en mode réseau awsvpc qui appartiennent au compte : chaque enregistrement porte son contexte ECS sans travail d'association ; un nouveau journal de flux est nécessaire, car le format d'un journal existant ne peut pas changer.
  options:
    a:
      en: |-
        Several tasks share each instance, so instance-id does not identify the service, and the manual mapping adds work.
      fr: |-
        Plusieurs tâches partagent chaque instance : instance-id n'identifie pas le service, et l'association manuelle ajoute du travail.
    b:
      en: |-
        In bridge mode, tasks share the instance's interface, which removes the per-task detail; the ECS fields support only the awsvpc mode.
      fr: |-
        En mode bridge, les tâches partagent l'interface de l'instance, ce qui supprime le détail par tâche ; les champs ECS ne prennent en charge que le mode awsvpc.
    d:
      en: |-
        Container Insights provides performance metrics, not network flow attribution, and a join by timestamp cannot tie a flow to a task.
      fr: |-
        Container Insights fournit des métriques de performance, et non l'attribution des flux réseau, et une jointure par horodatage ne peut pas relier un flux à une tâche.
references:
  - title: Flow log records - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html
  - title: Flow log limitations - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-limitations.html
