id: scsc03-1a-gd-findings-export-retention
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany manages Amazon GuardDuty from a delegated administrator account for all member accounts in us-east-1 and eu-west-1. The audit team requires all GuardDuty findings of all accounts to be kept for 3 years in one Amazon S3 bucket in us-east-1, encrypted with a customer managed key. GuardDuty currently keeps findings for 90 days.

    Which solution will meet these requirements?
  fr: |
    AnyCompany gère Amazon GuardDuty à partir d'un compte administrateur délégué pour tous les comptes membres dans us-east-1 et eu-west-1. L'équipe d'audit exige que tous les résultats GuardDuty de tous les comptes soient conservés pendant 3 ans dans un seul compartiment Amazon S3 de us-east-1, chiffrés avec une clé gérée par le client. GuardDuty conserve actuellement les résultats pendant 90 jours.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          In the delegated administrator account, configure the findings export in us-east-1 only with a KMS key in us-east-1, because the export includes the findings of all Regions.
        fr: |-
          Dans le compte administrateur délégué, configurer l'exportation des résultats dans us-east-1 uniquement avec une clé KMS de us-east-1, car l'exportation inclut les résultats de toutes les Régions.
    - id: b
      text:
        en: |-
          In the GuardDuty settings of the delegated administrator account, increase the retention period of findings to 3 years in both Regions for all member accounts.
        fr: |-
          Dans les paramètres GuardDuty du compte administrateur délégué, porter à 3 ans la période de rétention des résultats dans les deux Régions pour tous les comptes membres.
    - id: c
      text:
        en: |-
          In the delegated administrator account, configure the findings export in both Regions to the bucket with a KMS key in us-east-1, and allow GuardDuty in the bucket policy and the key policy.
        fr: |-
          Dans le compte administrateur délégué, configurer l'exportation des résultats dans les deux Régions vers le compartiment avec une clé KMS de us-east-1, et autoriser GuardDuty dans la politique de compartiment et la politique de clé.
    - id: d
      text:
        en: |-
          In each member account, configure the findings export in both Regions to the bucket with SSE-S3 encryption, and allow GuardDuty in the bucket policy.
        fr: |-
          Dans chaque compte membre, configurer l'exportation des résultats dans les deux Régions vers le compartiment avec le chiffrement SSE-S3, et autoriser GuardDuty dans la politique de compartiment.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Findings export is configured separately in each Region, and an administrator account's export also includes the findings of its member accounts in that Region. GuardDuty encrypts the exported findings with a KMS key that must be in the same Region as the bucket, and findings from a commercial Region can be exported to a bucket in any commercial Region. The bucket policy must allow guardduty.amazonaws.com to write, and the key policy must allow it to generate data keys.
    fr: |-
      L'exportation des résultats se configure séparément dans chaque Région, et l'exportation d'un compte administrateur inclut aussi les résultats de ses comptes membres dans cette Région. GuardDuty chiffre les résultats exportés avec une clé KMS qui doit se trouver dans la même Région que le compartiment, et les résultats d'une Région commerciale peuvent être exportés vers un compartiment de n'importe quelle Région commerciale. La politique de compartiment doit autoriser guardduty.amazonaws.com à écrire, et la politique de clé doit l'autoriser à générer des clés de données.
  options:
    a:
      en: |-
        Export settings are Regional, so the findings of eu-west-1 would not be exported without a destination configured in eu-west-1.
      fr: |-
        Les paramètres d'exportation sont régionaux : les résultats d'eu-west-1 ne seraient pas exportés sans destination configurée dans eu-west-1.
    b:
      en: |-
        GuardDuty keeps findings for 90 days; the retention period cannot be extended, which is why findings are exported.
      fr: |-
        GuardDuty conserve les résultats 90 jours ; la période de rétention ne peut pas être prolongée, d'où l'exportation des résultats.
    d:
      en: |-
        Export requires a KMS key, and the administrator account already exports the findings of its member accounts.
      fr: |-
        L'exportation exige une clé KMS, et le compte administrateur exporte déjà les résultats de ses comptes membres.
references:
  - title: Exporting generated GuardDuty findings to Amazon S3 buckets - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_exportfindings.html
