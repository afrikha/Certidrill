id: scsc03-1b-cwli-top-rejects
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany publishes the VPC Flow Logs of a production VPC to an Amazon CloudWatch Logs log group in the default format. During an investigation, a security engineer must list the 10 source IP addresses that generated the most rejected connections in the last 24 hours. The engineer runs the query in CloudWatch Logs Insights over that time range.

    Which query should the engineer run?
  fr: |
    AnyCompany publie les VPC Flow Logs d'un VPC de production dans un groupe de journaux Amazon CloudWatch Logs au format par défaut. Au cours d'une investigation, un ingénieur sécurité doit lister les 10 adresses IP source qui ont généré le plus de connexions rejetées au cours des dernières 24 heures. L'ingénieur exécute la requête dans CloudWatch Logs Insights sur cette plage de temps.

    Quelle requête l'ingénieur doit-il exécuter ?
body:
  options:
    - id: a
      text: |-
        stats count(*) as rejects by srcAddr | filter action = "REJECT" | sort rejects desc | limit 10
    - id: b
      text: |-
        filter action = "REJECT" | sort srcAddr desc | limit 10
    - id: c
      text: |-
        filter action = "REJECT" | stats count(*) as rejects by dstAddr | sort rejects desc | limit 10
    - id: d
      text: |-
        filter action = "REJECT" | stats count(*) as rejects by srcAddr | sort rejects desc | limit 10
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Logs Insights discovers the flow log fields (srcAddr, action...) automatically. The query must first keep only REJECT records with filter, then count them per source address with stats, and finally sort the counts in descending order and keep 10 rows with limit.
    fr: |-
      Logs Insights découvre automatiquement les champs des journaux de flux (srcAddr, action...). La requête doit d'abord ne garder que les enregistrements REJECT avec filter, puis les compter par adresse source avec stats, et enfin trier les comptages par ordre décroissant et garder 10 lignes avec limit.
  options:
    a:
      en: |-
        After stats, only the grouping field and the aggregate remain, so the later filter on action matches nothing and the count includes accepted traffic.
      fr: |-
        Après stats, il ne reste que le champ de regroupement et l'agrégat : le filtre suivant sur action ne correspond à rien, et le comptage inclut le trafic accepté.
    b:
      en: |-
        Without stats, the query returns 10 individual records sorted by IP address, not the addresses with the most rejections.
      fr: |-
        Sans stats, la requête renvoie 10 enregistrements individuels triés par adresse IP, et non les adresses qui ont le plus de rejets.
    c:
      en: |-
        Grouping by dstAddr counts rejections per destination, not per source address.
      fr: |-
        Le regroupement par dstAddr compte les rejets par destination, et non par adresse source.
references:
  - title: Sample queries - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-examples.html
  - title: CloudWatch Logs Insights language query syntax - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax.html
