id: scsc03-1a-macie-asdd-estate
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has about 400 Amazon S3 general purpose buckets across 30 member accounts in AWS Organizations. Amazon Macie is enabled for all accounts from a delegated Macie administrator account. The security team must keep a continuously updated view of which buckets are likely to contain sensitive data, so that it can decide where to run deeper analysis. The team does not want to create or maintain jobs for each bucket, and the solution must be cost-effective for this volume of data.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'environ 400 compartiments Amazon S3 à usage général répartis sur 30 comptes membres dans AWS Organizations. Amazon Macie est activé pour tous les comptes à partir d'un compte administrateur Macie délégué. L'équipe de sécurité doit disposer d'une vue continuellement mise à jour des compartiments susceptibles de contenir des données sensibles, afin de décider où lancer une analyse plus approfondie. L'équipe ne veut ni créer ni maintenir de tâches pour chaque compartiment, et la solution doit être rentable pour ce volume de données.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a one-time sensitive data discovery job that analyzes every object in all 400 buckets each month.
        fr: |-
          Créer chaque mois une tâche ponctuelle de découverte de données sensibles qui analyse tous les objets des 400 compartiments.
    - id: b
      text:
        en: |-
          Enable automated sensitive data discovery from the delegated Macie administrator account for the organization.
        fr: |-
          Activer la découverte automatisée des données sensibles à partir du compte administrateur Macie délégué pour l'organisation.
    - id: c
      text:
        en: |-
          Turn on Amazon S3 Storage Lens advanced metrics for the organization, and review the buckets with the most objects.
        fr: |-
          Activer les métriques avancées d'Amazon S3 Storage Lens pour l'organisation, et examiner les compartiments qui comptent le plus d'objets.
    - id: d
      text:
        en: |-
          Deploy an AWS Config conformance pack with S3 managed rules to all accounts, and review the noncompliant buckets.
        fr: |-
          Déployer dans tous les comptes un pack de conformité AWS Config avec des règles gérées S3, et examiner les compartiments non conformes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Automated sensitive data discovery continually evaluates the bucket inventory and uses sampling to select and analyze representative objects, updating statistics and sensitivity scores each day. For a Macie administrator, it covers the buckets of the member accounts by default, without any job to manage. Sensitive data discovery jobs are then used for deeper analysis of the buckets it highlights.
    fr: |-
      La découverte automatisée des données sensibles évalue en continu l'inventaire des compartiments et utilise l'échantillonnage pour sélectionner et analyser des objets représentatifs, en mettant à jour chaque jour les statistiques et les scores de sensibilité. Pour un administrateur Macie, elle couvre par défaut les compartiments des comptes membres, sans aucune tâche à gérer. Les tâches de découverte de données sensibles servent ensuite à analyser plus en profondeur les compartiments qu'elle met en évidence.
  options:
    a:
      en: |-
        Analyzing every object of 400 buckets each month is far more expensive than sampling, and the view is not continuously updated.
      fr: |-
        Analyser chaque mois tous les objets de 400 compartiments coûte bien plus cher que l'échantillonnage, et la vue n'est pas mise à jour en continu.
    c:
      en: |-
        Storage Lens reports storage usage and activity metrics; it does not inspect object content for sensitive data.
      fr: |-
        Storage Lens fournit des métriques d'utilisation et d'activité du stockage ; il n'inspecte pas le contenu des objets à la recherche de données sensibles.
    d:
      en: |-
        Config rules evaluate bucket configuration, such as encryption or public access, not whether the objects contain sensitive data.
      fr: |-
        Les règles Config évaluent la configuration des compartiments, comme le chiffrement ou l'accès public, et non la présence de données sensibles dans les objets.
references:
  - title: Performing automated sensitive data discovery - Amazon Macie
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-asdd.html
