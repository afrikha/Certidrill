id: scsc03-1b-resolver-query-logs
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's EC2 instances use the Amazon Route 53 Resolver of their VPC for DNS. After a threat intelligence report, the security team must find which instances looked up a list of known malicious domain names during the next 30 days, with the instance ID, the domain name, and the response for each lookup.

    Which log source should the team enable?
  fr: |
    Les instances EC2 d'AnyCompany utilisent l'Amazon Route 53 Resolver de leur VPC pour le DNS. À la suite d'un rapport de renseignement sur les menaces, l'équipe de sécurité doit trouver quelles instances ont résolu une liste de noms de domaine malveillants connus au cours des 30 prochains jours, avec l'ID d'instance, le nom de domaine et la réponse de chaque résolution.

    Quelle source de journaux l'équipe doit-elle activer ?
body:
  options:
    - id: a
      text:
        en: |-
          VPC Flow Logs on the VPCs, with a custom format that includes the instance-id field.
        fr: |-
          VPC Flow Logs sur les VPC, avec un format personnalisé qui inclut le champ instance-id.
    - id: b
      text:
        en: |-
          Route 53 Resolver query logging for the VPCs, delivered to a CloudWatch Logs log group.
        fr: |-
          La journalisation des requêtes Route 53 Resolver pour les VPC, livrée dans un groupe de journaux CloudWatch Logs.
    - id: c
      text:
        en: |-
          Query logging on the company's Route 53 public hosted zones.
        fr: |-
          La journalisation des requêtes sur les zones hébergées publiques Route 53 de l'entreprise.
    - id: d
      text:
        en: |-
          CloudTrail data events for Route 53 on the organization trail.
        fr: |-
          Les événements de données CloudTrail pour Route 53 sur le journal de suivi d'organisation.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Resolver query logging records the DNS queries that originate in the associated VPCs, with fields such as the source instance ID, the query name and type, the response code, and the response data. It can deliver to CloudWatch Logs, Amazon S3, or Firehose.
    fr: |-
      La journalisation des requêtes Resolver enregistre les requêtes DNS émises dans les VPC associés, avec des champs comme l'ID de l'instance source, le nom et le type de la requête, le code de réponse et les données de réponse. Elle peut livrer dans CloudWatch Logs, Amazon S3 ou Firehose.
  options:
    a:
      en: |-
        Flow logs do not capture traffic to the Amazon DNS server, and they never contain domain names.
      fr: |-
        Les journaux de flux ne capturent pas le trafic vers le serveur DNS Amazon, et ils ne contiennent jamais de noms de domaine.
    c:
      en: |-
        Public hosted zone query logging records queries that resolvers on the internet send for the company's own domains, not lookups made by the instances.
      fr: |-
        La journalisation des zones hébergées publiques enregistre les requêtes que les résolveurs d'internet envoient pour les domaines de l'entreprise, et non les résolutions faites par les instances.
    d:
      en: |-
        CloudTrail records API calls; DNS lookups by instances are not API calls and do not appear in CloudTrail.
      fr: |-
        CloudTrail enregistre des appels d'API ; les résolutions DNS des instances ne sont pas des appels d'API et n'apparaissent pas dans CloudTrail.
references:
  - title: Resolver query logging - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs.html
  - title: Flow log limitations - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-limitations.html
