id: scsc03-1b-cwagent-ssm-order
objective: "1.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An audit found that AnyCompany's 200 Linux EC2 instances do not send /var/log/secure to Amazon CloudWatch Logs because the CloudWatch agent was never deployed. The instances are already managed by AWS Systems Manager. The security team will deploy and configure the agent with Systems Manager by using one shared configuration, following least privilege.

    Which four actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un audit a révélé que les 200 instances EC2 Linux d'AnyCompany n'envoient pas /var/log/secure à Amazon CloudWatch Logs, car l'agent CloudWatch n'a jamais été déployé. Les instances sont déjà gérées par AWS Systems Manager. L'équipe de sécurité va déployer et configurer l'agent avec Systems Manager en utilisant une configuration partagée unique, selon le moindre privilège.

    Quelles sont les quatre actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: manage
      text:
        en: "Run the AmazonCloudWatch-ManageAgent document with the configure action and the Parameter Store configuration as the source."
        fr: "Exécuter le document AmazonCloudWatch-ManageAgent avec l'action configure et la configuration de Parameter Store comme source."
    - id: admin
      text:
        en: "Attach CloudWatchAgentAdminPolicy to the instance roles of all 200 instances."
        fr: "Attacher CloudWatchAgentAdminPolicy aux rôles d'instance des 200 instances."
    - id: role
      text:
        en: "Attach CloudWatchAgentServerPolicy to the instance role used by the fleet."
        fr: "Attacher CloudWatchAgentServerPolicy au rôle d'instance utilisé par le parc."
    - id: wizard
      text:
        en: "On one instance where the agent is now installed, run the configuration wizard with a temporary admin role and save the file in Parameter Store as AmazonCloudWatch-linux."
        fr: "Sur une instance où l'agent est désormais installé, exécuter l'assistant de configuration avec un rôle d'administration temporaire et enregistrer le fichier dans Parameter Store sous le nom AmazonCloudWatch-linux."
    - id: install
      text:
        en: "Run the AWS-ConfigureAWSPackage document to install the AmazonCloudWatchAgent package on the instances."
        fr: "Exécuter le document AWS-ConfigureAWSPackage pour installer le package AmazonCloudWatchAgent sur les instances."
    - id: onprem
      text:
        en: "Run amazon-cloudwatch-agent-ctl with the -m onPremise option on each instance."
        fr: "Exécuter amazon-cloudwatch-agent-ctl avec l'option -m onPremise sur chaque instance."
answer:
  sequence: [ role, install, wizard, manage ]
explanation:
  correct:
    en: "The fleet first needs CloudWatchAgentServerPolicy so that the agent can write logs. AWS-ConfigureAWSPackage then installs the agent, the wizard runs on one instance where the agent is installed, and the configuration is stored in Parameter Store under a name that starts with AmazonCloudWatch-, which the managed policies require. Finally, AmazonCloudWatch-ManageAgent with the configure action loads that configuration on every instance and starts the agent."
    fr: "Le parc a d'abord besoin de CloudWatchAgentServerPolicy pour que l'agent puisse écrire des journaux. AWS-ConfigureAWSPackage installe ensuite l'agent, l'assistant s'exécute sur une instance où l'agent est installé, et la configuration est stockée dans Parameter Store sous un nom qui commence par AmazonCloudWatch-, comme l'exigent les politiques gérées. Enfin, AmazonCloudWatch-ManageAgent avec l'action configure charge cette configuration sur chaque instance et démarre l'agent."
  options:
    admin:
      en: "The admin policy grants broad Parameter Store write access and belongs only on the single instance or user that saves the configuration."
      fr: "La politique d'administration accorde un large accès en écriture à Parameter Store et ne doit figurer que sur l'instance ou l'utilisateur unique qui enregistre la configuration."
    onprem:
      en: "The onPremise mode is for servers outside AWS, and running a command on each instance by hand bypasses Systems Manager."
      fr: "Le mode onPremise est destiné aux serveurs hors d'AWS, et exécuter une commande à la main sur chaque instance contourne Systems Manager."
references:
  - title: Create IAM roles and users for use with the CloudWatch agent - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/create-iam-roles-for-cloudwatch-agent.html
  - title: Starting the CloudWatch agent - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/start-CloudWatch-Agent-on-premise-SSM-onprem.html
