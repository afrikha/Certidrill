id: scsc03-1b-cwl-kms-key-policy
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security engineer at AnyCompany must encrypt the existing log group /prod/payments in eu-west-1 with a customer managed AWS KMS key. The key is a symmetric key in the same account and Region, and its key policy contains only the default statement that gives the account full access through IAM policies. The engineer's IAM role allows kms:DescribeKey on the key and logs:AssociateKmsKey. The following command fails with an error stating that the key is not allowed to be used with the log group's ARN:

    ```bash
    aws logs associate-kms-key --log-group-name /prod/payments --kms-key-id arn:aws:kms:eu-west-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab
    ```

    What should the engineer do to encrypt the log group?
  fr: |
    Un ingénieur sécurité d'AnyCompany doit chiffrer le groupe de journaux existant /prod/payments dans eu-west-1 avec une clé AWS KMS gérée par le client. La clé est une clé symétrique du même compte et de la même Région, et sa politique de clé ne contient que l'instruction par défaut, qui donne au compte un accès complet au moyen des politiques IAM. Le rôle IAM de l'ingénieur autorise kms:DescribeKey sur la clé et logs:AssociateKmsKey. La commande suivante échoue avec une erreur indiquant que la clé n'est pas autorisée à être utilisée avec l'ARN du groupe de journaux :

    ```bash
    aws logs associate-kms-key --log-group-name /prod/payments --kms-key-id arn:aws:kms:eu-west-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab
    ```

    Que doit faire l'ingénieur pour chiffrer le groupe de journaux ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a key policy statement that allows the logs.eu-west-1.amazonaws.com service principal to use the key, with a condition on kms:EncryptionContext:aws:logs:arn that matches the log group ARN.
        fr: |-
          Ajouter une instruction de politique de clé qui autorise le principal de service logs.eu-west-1.amazonaws.com à utiliser la clé, avec une condition sur kms:EncryptionContext:aws:logs:arn qui correspond à l'ARN du groupe de journaux.
    - id: b
      text:
        en: |-
          Add kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, and kms:GenerateDataKey* on the key to the engineer's IAM role, and run the associate-kms-key command again.
        fr: |-
          Ajouter kms:Encrypt, kms:Decrypt, kms:ReEncrypt* et kms:GenerateDataKey* sur la clé au rôle IAM de l'ingénieur, et exécuter de nouveau la commande associate-kms-key.
    - id: c
      text:
        en: |-
          Create a KMS grant on the key for the engineer's IAM role with the Encrypt, Decrypt, and GenerateDataKey operations, and run the command again.
        fr: |-
          Créer sur la clé un octroi (grant) KMS pour le rôle IAM de l'ingénieur avec les opérations Encrypt, Decrypt et GenerateDataKey, et exécuter de nouveau la commande.
    - id: d
      text:
        en: |-
          Create an asymmetric RSA KMS key with the same key policy in eu-west-1, and associate this new key with the log group instead.
        fr: |-
          Créer dans eu-west-1 une clé KMS asymétrique RSA avec la même politique de clé, et associer cette nouvelle clé au groupe de journaux à la place.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CloudWatch Logs uses the key itself, so the key policy must allow the Regional service principal logs.<region>.amazonaws.com to perform kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, and kms:Describe*. The kms:EncryptionContext:aws:logs:arn condition limits the key to the log group, and the caller needs only kms:DescribeKey to run associate-kms-key.
    fr: |-
      CloudWatch Logs utilise lui-même la clé : la politique de clé doit donc autoriser le principal de service régional logs.<region>.amazonaws.com à effectuer kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey* et kms:Describe*. La condition kms:EncryptionContext:aws:logs:arn limite la clé au groupe de journaux, et l'appelant n'a besoin que de kms:DescribeKey pour exécuter associate-kms-key.
  options:
    b:
      en: |-
        The engineer's permissions are not the issue: the service principal of CloudWatch Logs must be allowed in the key policy.
      fr: |-
        Les autorisations de l'ingénieur ne sont pas en cause : le principal de service de CloudWatch Logs doit être autorisé dans la politique de clé.
    c:
      en: |-
        A grant for the engineer's role does not give CloudWatch Logs the right to use the key for the log group.
      fr: |-
        Un octroi au rôle de l'ingénieur ne donne pas à CloudWatch Logs le droit d'utiliser la clé pour le groupe de journaux.
    d:
      en: |-
        CloudWatch Logs supports only symmetric KMS keys, and the new key would have the same missing permission.
      fr: |-
        CloudWatch Logs ne prend en charge que les clés KMS symétriques, et la nouvelle clé aurait la même autorisation manquante.
references:
  - title: Encrypt log data in CloudWatch Logs using AWS Key Management Service - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/encrypt-log-data-kms.html
