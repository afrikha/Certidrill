id: scsc03-1a-eks-audit-exec
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a regulated workload on an Amazon EKS cluster. Auditors require a record of every user or component that runs commands in pods through kubectl exec, changes role bindings, or reads Kubernetes secrets, with the identity used. The cluster has no control plane logging enabled. AWS CloudTrail and Amazon GuardDuty with EKS Protection are enabled in the account.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une charge de travail réglementée sur un cluster Amazon EKS. Les auditeurs exigent un enregistrement de chaque utilisateur ou composant qui exécute des commandes dans des pods avec kubectl exec, modifie des liaisons de rôles ou lit des secrets Kubernetes, avec l'identité utilisée. Aucune journalisation du plan de contrôle n'est activée sur le cluster. AWS CloudTrail et Amazon GuardDuty avec EKS Protection sont activés dans le compte.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable the audit log type of the EKS control plane logs for the cluster, so that the Kubernetes audit logs are sent to CloudWatch Logs.
        fr: |-
          Activer le type de journal audit des journaux du plan de contrôle EKS pour le cluster, afin que les journaux d'audit Kubernetes soient envoyés dans CloudWatch Logs.
    - id: b
      text:
        en: |-
          Use the CloudTrail management events of the eks.amazonaws.com event source, which record the calls made to the Kubernetes API.
        fr: |-
          Utiliser les événements de gestion CloudTrail de la source d'événements eks.amazonaws.com, qui enregistrent les appels adressés à l'API Kubernetes.
    - id: c
      text:
        en: |-
          Export the Kubernetes audit logs that GuardDuty EKS Protection collects from the cluster to an S3 bucket.
        fr: |-
          Exporter vers un compartiment S3 les journaux d'audit Kubernetes que GuardDuty EKS Protection collecte sur le cluster.
    - id: d
      text:
        en: |-
          Enable VPC Flow Logs on the subnets of the worker nodes, and identify the users from the source IP addresses.
        fr: |-
          Activer VPC Flow Logs sur les sous-réseaux des nœuds de travail, et identifier les utilisateurs à partir des adresses IP sources.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Kubernetes audit logs record the individual users, administrators, and system components that affected the cluster, including exec requests, role binding changes, and secret reads. EKS control plane logging is disabled by default; enabling the audit log type sends these logs to the /aws/eks/cluster-name/cluster log group in CloudWatch Logs.
    fr: |-
      Les journaux d'audit Kubernetes enregistrent les utilisateurs, administrateurs et composants système individuels qui ont agi sur le cluster, y compris les requêtes exec, les modifications de liaisons de rôles et les lectures de secrets. La journalisation du plan de contrôle EKS est désactivée par défaut ; activer le type de journal audit envoie ces journaux dans le groupe de journaux /aws/eks/cluster-name/cluster de CloudWatch Logs.
  options:
    b:
      en: |-
        CloudTrail records calls to the Amazon EKS API, such as cluster configuration changes, not the requests that users send to the Kubernetes API server.
      fr: |-
        CloudTrail enregistre les appels à l'API Amazon EKS, comme les modifications de configuration du cluster, et non les requêtes que les utilisateurs envoient au serveur d'API Kubernetes.
    c:
      en: |-
        GuardDuty analyzes the audit log stream for threats, but it does not deliver the audit logs to the customer or export them.
      fr: |-
        GuardDuty analyse le flux des journaux d'audit pour détecter les menaces, mais il ne livre pas les journaux d'audit au client et ne les exporte pas.
    d:
      en: |-
        Flow logs record IP traffic of the nodes; they contain no Kubernetes operations or user identities.
      fr: |-
        Les journaux de flux enregistrent le trafic IP des nœuds ; ils ne contiennent ni opérations Kubernetes ni identités d'utilisateurs.
references:
  - title: Send control plane logs to CloudWatch Logs - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html
