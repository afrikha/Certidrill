id: scsc03-1a-multi-alb-host-logs
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is launching an internet-facing application on Amazon EC2 Linux instances behind an Application Load Balancer with an HTTPS listener. For incident investigations, the security team needs two log sources. The first must record, for every request that reaches the load balancer, the client IP address, the request line, the user agent, and the TLS cipher and protocol. The second must record the operating system authentication events of the instances, such as failed SSH logins.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany lance une application exposée à Internet sur des instances Amazon EC2 Linux derrière un Application Load Balancer doté d'un écouteur HTTPS. Pour ses investigations d'incidents, l'équipe de sécurité a besoin de deux sources de journaux. La première doit enregistrer, pour chaque requête qui atteint l'équilibreur de charge, l'adresse IP du client, la ligne de requête, l'agent utilisateur ainsi que le chiffrement et le protocole TLS. La seconde doit enregistrer les événements d'authentification du système d'exploitation des instances, comme les connexions SSH échouées.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Enable access logs on the Application Load Balancer with an S3 bucket in the same Region as the destination.
        fr: |-
          Activer les journaux d'accès de l'Application Load Balancer avec comme destination un compartiment S3 de la même Région.
    - id: b
      text:
        en: |-
          Enable VPC Flow Logs on the load balancer subnets with a custom format that includes all the available fields.
        fr: |-
          Activer VPC Flow Logs sur les sous-réseaux de l'équilibreur de charge avec un format personnalisé qui inclut tous les champs disponibles.
    - id: c
      text:
        en: |-
          Create CloudWatch alarms on the RequestCount and ClientTLSNegotiationErrorCount metrics of the load balancer for each listener.
        fr: |-
          Créer des alarmes CloudWatch sur les métriques RequestCount et ClientTLSNegotiationErrorCount de l'équilibreur de charge pour chaque écouteur.
    - id: d
      text:
        en: |-
          Install the CloudWatch agent on the instances, and add the system authentication log file to the files collect_list of its configuration.
        fr: |-
          Installer l'agent CloudWatch sur les instances, et ajouter le fichier journal d'authentification du système à la section files collect_list de sa configuration.
    - id: e
      text:
        en: |-
          Add the read and write management events for Amazon EC2 to the account's CloudTrail trail.
        fr: |-
          Ajouter au journal de suivi CloudTrail du compte les événements de gestion en lecture et en écriture d'Amazon EC2.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      ALB access logs are disabled by default and are delivered every 5 minutes to an S3 bucket in the same Region; each entry includes client:port, the request line, the user agent, and, for HTTPS listeners, the ssl_cipher and ssl_protocol fields. Operating system authentication events exist only in files on the instances, which the CloudWatch agent collects into CloudWatch Logs from its files collect_list.
    fr: |-
      Les journaux d'accès ALB sont désactivés par défaut et sont livrés toutes les 5 minutes dans un compartiment S3 de la même Région ; chaque entrée comprend client:port, la ligne de requête, l'agent utilisateur et, pour les écouteurs HTTPS, les champs ssl_cipher et ssl_protocol. Les événements d'authentification du système d'exploitation n'existent que dans des fichiers sur les instances, que l'agent CloudWatch collecte dans CloudWatch Logs à partir de sa section files collect_list.
  options:
    b:
      en: |-
        Flow logs record IP addresses, ports, and bytes, but no HTTP request line, user agent, or TLS details.
      fr: |-
        Les journaux de flux enregistrent les adresses IP, les ports et les octets, mais ni la ligne de requête HTTP, ni l'agent utilisateur, ni les détails TLS.
    c:
      en: |-
        Load balancer metrics are aggregated counts; they do not record the details of each request.
      fr: |-
        Les métriques de l'équilibreur de charge sont des décomptes agrégés ; elles n'enregistrent pas le détail de chaque requête.
    e:
      en: |-
        CloudTrail records calls to the Amazon EC2 API, not SSH logins or other events inside the operating system.
      fr: |-
        CloudTrail enregistre les appels à l'API Amazon EC2, et non les connexions SSH ou les autres événements du système d'exploitation.
references:
  - title: Access logs for your Application Load Balancer - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-access-logs.html
  - title: Manually create or edit the CloudWatch agent configuration file - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
