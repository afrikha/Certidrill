id: scsc03-1a-org-pack-recorder-window
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany deploys an organization conformance pack from its delegated AWS Config administrator account to all accounts in AWS Organizations. New accounts are created by an automated account vending process. A baseline pipeline then enables the AWS Config configuration recorder in each new account about 12 hours after the account is created. The deployment status shows that the conformance pack fails in every new account and is not deployed until an engineer redeploys it manually.

    What should the company do so that new accounts receive the conformance pack automatically?
  fr: |
    AnyCompany déploie un pack de conformité d'organisation à partir de son compte administrateur AWS Config délégué dans tous les comptes d'AWS Organizations. Les nouveaux comptes sont créés par un processus automatisé de distribution de comptes. Un pipeline de référence active ensuite l'enregistreur de configuration AWS Config dans chaque nouveau compte environ 12 heures après la création du compte. L'état du déploiement montre que le pack de conformité échoue dans chaque nouveau compte et n'est déployé que lorsqu'un ingénieur le redéploie manuellement.

    Que doit faire l'entreprise pour que les nouveaux comptes reçoivent automatiquement le pack de conformité ?
body:
  options:
    - id: a
      text:
        en: |-
          Change the account vending process so that the configuration recorder is enabled within 7 hours of the account joining the organization.
        fr: |-
          Modifier le processus de distribution de comptes afin que l'enregistreur de configuration soit activé dans les 7 heures suivant l'arrivée du compte dans l'organisation.
    - id: b
      text:
        en: |-
          Deploy the conformance pack from the management account instead of the delegated administrator account.
        fr: |-
          Déployer le pack de conformité à partir du compte de gestion plutôt que du compte administrateur délégué.
    - id: c
      text:
        en: |-
          Add the new accounts to the organization aggregator of the delegated administrator account as soon as they are created.
        fr: |-
          Ajouter les nouveaux comptes à l'agrégateur d'organisation du compte administrateur délégué dès leur création.
    - id: d
      text:
        en: |-
          Create the AWS Config service-linked role manually in each new account before the conformance pack is deployed.
        fr: |-
          Créer manuellement le rôle lié au service AWS Config dans chaque nouveau compte avant le déploiement du pack de conformité.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Organization conformance packs and rules are deployed automatically to accounts that join the organization, but AWS Config recording must be on in the account. When no recorder is available, AWS Config retries the deployment for 7 hours after the account joins, so the recorder must be created within that window. Enabling the recorder 12 hours later is outside the retry window.
    fr: |-
      Les packs de conformité et les règles d'organisation sont déployés automatiquement dans les comptes qui rejoignent l'organisation, mais l'enregistrement AWS Config doit être actif dans le compte. Lorsqu'aucun enregistreur n'est disponible, AWS Config réessaie le déploiement pendant 7 heures après l'arrivée du compte : l'enregistreur doit être créé dans cet intervalle. Activer l'enregistreur 12 heures plus tard sort de l'intervalle de nouvelles tentatives.
  options:
    b:
      en: |-
        The deployment account does not change the requirement for a configuration recorder in the member account within the retry window.
      fr: |-
        Le compte qui déploie ne change pas l'exigence d'un enregistreur de configuration dans le compte membre pendant l'intervalle de nouvelles tentatives.
    c:
      en: |-
        Aggregators provide a read-only view; they cannot deploy rules or conformance packs to source accounts.
      fr: |-
        Les agrégateurs offrent une vue en lecture seule ; ils ne peuvent pas déployer de règles ni de packs de conformité dans les comptes sources.
    d:
      en: |-
        The manual service-linked role step applies to the management account when a delegated administrator deploys to it; the failure here is the missing recorder.
      fr: |-
        L'étape manuelle de rôle lié au service concerne le compte de gestion lorsqu'un administrateur délégué y déploie ; l'échec vient ici de l'absence d'enregistreur.
references:
  - title: Managing Conformance Packs for AWS Config Across all Accounts in Your Organization - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformance-pack-organization-apis.html
