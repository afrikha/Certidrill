id: scsc03-1a-multi-org-trail-alarms
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an organization trail that the management account created for all accounts in AWS Organizations. The security team must receive an email within minutes whenever an IAM policy is changed or a console sign-in fails in any account of the organization. The alarms must be managed in one place.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany dispose d'un journal de suivi d'organisation créé par le compte de gestion pour tous les comptes d'AWS Organizations. L'équipe de sécurité doit recevoir un e-mail en quelques minutes chaque fois qu'une politique IAM est modifiée ou qu'une connexion à la console échoue dans n'importe quel compte de l'organisation. Les alarmes doivent être gérées en un seul endroit.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure the organization trail to send its events to a CloudWatch Logs log group in the management account.
        fr: |-
          Configurer le journal de suivi d'organisation pour qu'il envoie ses événements dans un groupe de journaux CloudWatch Logs du compte de gestion.
    - id: b
      text:
        en: |-
          Create metric filters in the CloudTrail Event history of each member account, with an alarm for each filter.
        fr: |-
          Créer des filtres de métriques dans l'historique des événements CloudTrail de chaque compte membre, avec une alarme pour chaque filtre.
    - id: c
      text:
        en: |-
          Enable CloudTrail Insights on the organization trail so that IAM policy changes and failed sign-ins generate Insights events.
        fr: |-
          Activer CloudTrail Insights sur le journal de suivi d'organisation afin que les modifications de politiques IAM et les connexions échouées génèrent des événements Insights.
    - id: d
      text:
        en: |-
          Create metric filters for the IAM policy change and failed sign-in patterns on the trail's log group, with alarms that notify an Amazon SNS topic.
        fr: |-
          Créer sur le groupe de journaux du journal de suivi des filtres de métriques pour les modèles de modification de politique IAM et de connexion échouée, avec des alarmes qui avertissent une rubrique Amazon SNS.
    - id: e
      text:
        en: |-
          Deploy the AWS Config managed rule iam-policy-no-statements-with-admin-access to all accounts with an organization rule.
        fr: |-
          Déployer dans tous les comptes la règle gérée AWS Config iam-policy-no-statements-with-admin-access au moyen d'une règle d'organisation.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      An organization trail can deliver the events of all accounts to a CloudWatch Logs log group in the management account, with log streams for the member accounts. Metric filters on that log group, such as the ones that match IAM policy actions and ConsoleLogin events with Failed authentication, feed metrics on which alarms send notifications to an SNS topic, all managed in one account.
    fr: |-
      Un journal de suivi d'organisation peut livrer les événements de tous les comptes dans un groupe de journaux CloudWatch Logs du compte de gestion, avec des flux de journaux pour les comptes membres. Des filtres de métriques sur ce groupe, comme ceux qui correspondent aux actions sur les politiques IAM et aux événements ConsoleLogin en Failed authentication, alimentent des métriques sur lesquelles des alarmes envoient des notifications à une rubrique SNS, le tout géré dans un seul compte.
  options:
    b:
      en: |-
        Event history is not a log group, so metric filters cannot be created on it, and per-account alarms are not managed in one place.
      fr: |-
        L'historique des événements n'est pas un groupe de journaux : on ne peut pas y créer de filtres de métriques, et des alarmes par compte ne sont pas gérées en un seul endroit.
    c:
      en: |-
        Insights flags unusual rates of API calls or errors compared with a baseline; it does not alert on each individual policy change or failed sign-in.
      fr: |-
        Insights signale des taux inhabituels d'appels d'API ou d'erreurs par rapport à une référence ; il n'alerte pas sur chaque modification de politique ou connexion échouée.
    e:
      en: |-
        The rule evaluates whether policies grant full administrative access; it does not alert on every policy change or on failed sign-ins.
      fr: |-
        La règle évalue si des politiques accordent un accès administrateur complet ; elle n'alerte ni sur chaque modification de politique ni sur les connexions échouées.
references:
  - title: "Creating CloudWatch alarms for CloudTrail events: examples - AWS CloudTrail"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudwatch-alarms-for-cloudtrail.html
  - title: Prepare for creating a trail for your organization - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-an-organizational-trail-prepare.html
