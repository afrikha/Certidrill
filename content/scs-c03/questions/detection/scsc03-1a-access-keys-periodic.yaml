id: scsc03-1a-access-keys-periodic
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security policy requires IAM user access keys to be rotated at least every 90 days. The security team wants AWS Config to assess the IAM users of the account on a regular schedule and to report as noncompliant every user that has an active access key older than 90 days. The team wants to avoid writing code.

    Which solution will meet these requirements?
  fr: |
    La politique de sécurité d'AnyCompany exige que les clés d'accès des utilisateurs IAM soient renouvelées au moins tous les 90 jours. L'équipe de sécurité veut qu'AWS Config évalue régulièrement les utilisateurs IAM du compte et signale comme non conforme chaque utilisateur qui possède une clé d'accès active de plus de 90 jours. L'équipe veut éviter d'écrire du code.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a custom AWS Config rule backed by AWS Lambda with a configuration change trigger on the AWS::IAM::User resource type.
        fr: |-
          Créer une règle AWS Config personnalisée reposant sur AWS Lambda avec un déclencheur de modification de configuration sur le type de ressource AWS::IAM::User.
    - id: b
      text:
        en: |-
          Generate the IAM credential report each month, and review the access key age column for each user.
        fr: |-
          Générer chaque mois le rapport sur les informations d'identification IAM, et examiner la colonne d'âge des clés d'accès de chaque utilisateur.
    - id: c
      text:
        en: |-
          Deploy the AWS Config managed rule iam-user-unused-credentials-check with its default parameters.
        fr: |-
          Déployer la règle gérée AWS Config iam-user-unused-credentials-check avec ses paramètres par défaut.
    - id: d
      text:
        en: |-
          Deploy the AWS Config managed rule access-keys-rotated with the maxAccessKeyAge parameter set to 90.
        fr: |-
          Déployer la règle gérée AWS Config access-keys-rotated avec le paramètre maxAccessKeyAge défini à 90.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The access-keys-rotated managed rule has a periodic trigger and reports IAM users as NON_COMPLIANT when an active access key has not been rotated within maxAccessKeyAge days, which defaults to 90. A periodic rule is needed because a key becomes older without any configuration change to the user.
    fr: |-
      La règle gérée access-keys-rotated a un déclencheur périodique et signale les utilisateurs IAM comme NON_COMPLIANT lorsqu'une clé d'accès active n'a pas été renouvelée depuis maxAccessKeyAge jours, 90 par défaut. Une règle périodique est nécessaire, car une clé vieillit sans aucune modification de configuration de l'utilisateur.
  options:
    a:
      en: |-
        A key that ages causes no configuration change, so a change-triggered rule would not be evaluated, and the solution requires code.
      fr: |-
        Une clé qui vieillit ne provoque aucune modification de configuration : une règle déclenchée par les modifications ne serait pas évaluée, et la solution exige du code.
    b:
      en: |-
        A manual monthly review is not an AWS Config assessment and does not report compliance automatically.
      fr: |-
        Une revue mensuelle manuelle n'est pas une évaluation AWS Config et ne signale pas la conformité automatiquement.
    c:
      en: |-
        This rule checks for credentials that have not been used within a period, not for keys that have not been rotated.
      fr: |-
        Cette règle vérifie les informations d'identification inutilisées pendant une période, et non les clés qui n'ont pas été renouvelées.
references:
  - title: access-keys-rotated - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/access-keys-rotated.html
