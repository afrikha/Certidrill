id: scsc03-1a-dynamodb-item-reads
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores cardholder data in an Amazon DynamoDB table named Cards. The account has 40 other DynamoDB tables with high request rates. An auditor requires a record of every IAM principal that reads items from the Cards table, including the operation and the time. A multi-Region CloudTrail trail that logs management events already delivers logs to Amazon S3. The company wants to minimize logging costs.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke des données de titulaires de carte dans une table Amazon DynamoDB nommée Cards. Le compte compte 40 autres tables DynamoDB avec des taux de requêtes élevés. Un auditeur exige un enregistrement de chaque principal IAM qui lit des éléments de la table Cards, avec l'opération et l'heure. Un journal de suivi CloudTrail multi-Région qui journalise les événements de gestion livre déjà les journaux dans Amazon S3. L'entreprise veut réduire au minimum les coûts de journalisation.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on DynamoDB Streams for the Cards table, and use an AWS Lambda function to write every stream record of the table to an S3 bucket for the auditor.
        fr: |-
          Activer DynamoDB Streams sur la table Cards, et utiliser une fonction AWS Lambda pour écrire chaque enregistrement du flux de la table dans un compartiment S3 destiné à l'auditeur.
    - id: b
      text:
        en: |-
          Enable CloudWatch Contributor Insights for the Cards table to identify the most frequently accessed keys, and keep the reports for the auditor.
        fr: |-
          Activer CloudWatch Contributor Insights pour la table Cards afin d'identifier les clés les plus souvent consultées, et conserver les rapports pour l'auditeur.
    - id: c
      text:
        en: |-
          Add an advanced event selector to the trail for AWS::DynamoDB::Table data events, with resources.ARN equal to the ARN of the Cards table and readOnly equal to true.
        fr: |-
          Ajouter au journal de suivi un sélecteur d'événements avancé pour les événements de données AWS::DynamoDB::Table, avec resources.ARN égal à l'ARN de la table Cards et readOnly égal à true.
    - id: d
      text:
        en: |-
          Add read management events for Amazon DynamoDB to the trail, and filter the GetItem and Query events of the Cards table in Amazon Athena.
        fr: |-
          Ajouter au journal de suivi les événements de gestion en lecture pour Amazon DynamoDB, et filtrer les événements GetItem et Query de la table Cards dans Amazon Athena.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Item-level operations on a DynamoDB table are CloudTrail data events, which are not logged by default and are charged separately. An advanced event selector can restrict them to one table with resources.ARN and to read operations with readOnly, so the trail records the principal, operation, and time for the Cards table only, without paying for the traffic of the other 40 tables.
    fr: |-
      Les opérations au niveau des éléments d'une table DynamoDB sont des événements de données CloudTrail, qui ne sont pas journalisés par défaut et sont facturés séparément. Un sélecteur d'événements avancé peut les limiter à une table avec resources.ARN et aux opérations de lecture avec readOnly : le journal de suivi enregistre le principal, l'opération et l'heure pour la seule table Cards, sans payer le trafic des 40 autres tables.
  options:
    a:
      en: |-
        DynamoDB Streams captures item modifications only; reads do not appear in the stream, and the records do not identify the IAM principal.
      fr: |-
        DynamoDB Streams capture uniquement les modifications d'éléments ; les lectures n'apparaissent pas dans le flux, et les enregistrements n'identifient pas le principal IAM.
    b:
      en: |-
        Contributor Insights shows the most accessed or throttled keys as aggregated metrics; it does not record who performed each read.
      fr: |-
        Contributor Insights affiche sous forme de métriques agrégées les clés les plus consultées ou limitées ; il n'enregistre pas qui a effectué chaque lecture.
    d:
      en: |-
        GetItem and Query are data plane operations; they are not management events, so the trail would not record them.
      fr: |-
        GetItem et Query sont des opérations du plan de données ; ce ne sont pas des événements de gestion, et le journal de suivi ne les enregistrerait pas.
references:
  - title: Logging data events - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
