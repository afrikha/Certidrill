id: scsc03-1b-firehose-parquet
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A network appliance sends its firewall logs as CSV lines to an Amazon Data Firehose stream that delivers to Amazon S3. The security team wants the logs stored as Apache Parquet files with typed columns so that Amazon Athena queries scan less data. The column names and types are already defined in an AWS Glue Data Catalog table. The appliance cannot change its output format.

    Which solution will meet these requirements?
  fr: |
    Un équipement réseau envoie ses journaux de pare-feu sous forme de lignes CSV à un flux Amazon Data Firehose qui livre dans Amazon S3. L'équipe de sécurité veut que les journaux soient stockés sous forme de fichiers Apache Parquet aux colonnes typées, afin que les requêtes Amazon Athena analysent moins de données. Les noms et types de colonnes sont déjà définis dans une table du catalogue de données AWS Glue. L'équipement ne peut pas changer son format de sortie.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable record format conversion on the stream with the Glue table as the schema, the OpenX JSON SerDe as the deserializer, and the Parquet SerDe as the serializer.
        fr: |-
          Activer la conversion du format des enregistrements sur le flux, avec la table Glue comme schéma, OpenX JSON SerDe comme désérialiseur et Parquet SerDe comme sérialiseur.
    - id: b
      text:
        en: |-
          Add a Lambda transformation that converts each CSV line to a JSON object, and enable record format conversion to Parquet with the Glue table as the schema.
        fr: |-
          Ajouter une transformation Lambda qui convertit chaque ligne CSV en objet JSON, et activer la conversion du format des enregistrements en Parquet avec la table Glue comme schéma.
    - id: c
      text:
        en: |-
          Enable dynamic partitioning on the stream with the Glue table columns as partition keys.
        fr: |-
          Activer le partitionnement dynamique sur le flux avec les colonnes de la table Glue comme clés de partition.
    - id: d
      text:
        en: |-
          Enable GZIP compression on the S3 destination and create the Athena table with the CSV SerDe.
        fr: |-
          Activer la compression GZIP sur la destination S3 et créer la table Athena avec le SerDe CSV.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Firehose converts only JSON input to Parquet or ORC, by using a schema from a Glue Data Catalog table. For CSV or other text formats, the documented approach is a Lambda transformation that turns each record into JSON before the format conversion runs.
    fr: |-
      Firehose ne convertit en Parquet ou ORC que des entrées JSON, au moyen d'un schéma issu d'une table du catalogue de données Glue. Pour du CSV ou d'autres formats texte, la méthode documentée est une transformation Lambda qui transforme chaque enregistrement en JSON avant la conversion de format.
  options:
    a:
      en: |-
        The JSON deserializers cannot read CSV lines, so format conversion fails for records that are not JSON.
      fr: |-
        Les désérialiseurs JSON ne savent pas lire des lignes CSV : la conversion de format échoue pour les enregistrements qui ne sont pas en JSON.
    c:
      en: |-
        Dynamic partitioning organizes objects into prefixes; it does not convert the records to Parquet.
      fr: |-
        Le partitionnement dynamique organise les objets en préfixes ; il ne convertit pas les enregistrements en Parquet.
    d:
      en: |-
        Compressed CSV is still a row format without typed columns, so it does not meet the Parquet requirement.
      fr: |-
        Du CSV compressé reste un format en lignes sans colonnes typées : il ne répond pas à l'exigence Parquet.
references:
  - title: Convert input data format in Amazon Data Firehose - Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/record-format-conversion.html
