id: scsc03-1a-macie-findings-alert
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany uses Amazon Macie in one account. The data protection team wants an email in near real time whenever Macie creates a sensitive data finding or a policy finding, for example when a bucket becomes publicly accessible. The team already has an Amazon SNS topic with the email subscriptions.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise Amazon Macie dans un compte. L'équipe de protection des données veut recevoir un e-mail quasiment en temps réel chaque fois que Macie crée un résultat de données sensibles ou un résultat de politique, par exemple lorsqu'un compartiment devient accessible publiquement. L'équipe dispose déjà d'une rubrique Amazon SNS avec les abonnements par e-mail.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Configure S3 Event Notifications on every bucket to publish object-created events to the SNS topic.
        fr: |-
          Configurer des notifications d'événements S3 sur chaque compartiment pour publier les événements de création d'objet dans la rubrique SNS.
    - id: b
      text:
        en: |-
          Configure Macie to store sensitive data discovery results in an S3 bucket, and send the bucket's new-object events to the SNS topic.
        fr: |-
          Configurer Macie pour stocker les résultats de découverte de données sensibles dans un compartiment S3, et envoyer à la rubrique SNS les événements de nouvel objet de ce compartiment.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule that matches events with the source aws.macie, and set the SNS topic as the target.
        fr: |-
          Créer une règle Amazon EventBridge qui correspond aux événements dont la source est aws.macie, et définir la rubrique SNS comme cible.
    - id: d
      text:
        en: |-
          Create a CloudWatch Logs metric filter on the CloudTrail log group for Macie API calls, and create an alarm that notifies the SNS topic.
        fr: |-
          Créer sur le groupe de journaux CloudTrail un filtre de métriques pour les appels d'API Macie, et créer une alarme qui avertit la rubrique SNS.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Macie automatically publishes EventBridge events for new sensitive data findings, new policy findings, and subsequent occurrences of existing policy findings. A rule that matches the aws.macie source, optionally narrowed to specific finding fields, can send them to the SNS topic in near real time.
    fr: |-
      Macie publie automatiquement des événements EventBridge pour les nouveaux résultats de données sensibles, les nouveaux résultats de politique et les occurrences ultérieures des résultats de politique existants. Une règle qui correspond à la source aws.macie, éventuellement restreinte à certains champs des résultats, peut les envoyer à la rubrique SNS quasiment en temps réel.
  options:
    a:
      en: |-
        S3 Event Notifications report object operations in the buckets; they do not report Macie findings.
      fr: |-
        Les notifications d'événements S3 signalent les opérations sur les objets des compartiments ; elles ne signalent pas les résultats Macie.
    b:
      en: |-
        Discovery results record the analysis of every object, including objects without findings, so this would notify far more than the findings, and policy findings are not discovery results.
      fr: |-
        Les résultats de découverte enregistrent l'analyse de chaque objet, y compris ceux sans résultat : on serait averti bien au-delà des résultats, et les résultats de politique ne sont pas des résultats de découverte.
    d:
      en: |-
        CloudTrail records calls made to the Macie API, such as configuration changes; the findings that Macie generates are delivered through EventBridge, not as API calls in the trail.
      fr: |-
        CloudTrail enregistre les appels adressés à l'API Macie, comme les modifications de configuration ; les résultats générés par Macie sont livrés par EventBridge, et non sous forme d'appels d'API dans le journal de suivi.
references:
  - title: Processing Macie findings with Amazon EventBridge - Amazon Macie
    url: https://docs.aws.amazon.com/macie/latest/user/findings-monitor-events-eventbridge.html
