id: scsc03-1a-trail-long-retention
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany must keep the CloudTrail management and data events of all accounts in its organization for 7 years. During that period, nobody, including administrators, may delete or overwrite the logs. Auditors query a few days of logs from past years several times each year. The log volume is several terabytes per month, and the company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    AnyCompany doit conserver pendant 7 ans les événements de gestion et de données CloudTrail de tous les comptes de son organisation. Pendant cette période, personne, administrateurs compris, ne doit pouvoir supprimer ou écraser les journaux. Les auditeurs interrogent plusieurs fois par an quelques jours de journaux des années passées. Le volume de journaux atteint plusieurs téraoctets par mois, et l'entreprise veut la solution la PLUS rentable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the events in CloudTrail Event history in each account, and download the events that the auditors request for the periods that they investigate.
        fr: |-
          Conserver les événements dans l'historique des événements CloudTrail de chaque compte, et télécharger les événements que les auditeurs demandent pour les périodes examinées.
    - id: b
      text:
        en: |-
          Deliver an organization trail to an S3 bucket that uses Object Lock in compliance mode for 7 years and Lifecycle rules to lower-cost storage classes, and query it with Athena.
        fr: |-
          Livrer un journal de suivi d'organisation dans un compartiment S3 qui utilise Object Lock en mode conformité pendant 7 ans et des règles Lifecycle vers des classes de stockage moins coûteuses, et l'interroger avec Athena.
    - id: c
      text:
        en: |-
          Send the organization trail to a CloudWatch Logs log group with a 7-year retention setting, and query the logs with CloudWatch Logs Insights when auditors ask.
        fr: |-
          Envoyer le journal de suivi d'organisation dans un groupe de journaux CloudWatch Logs avec une rétention de 7 ans, et interroger les journaux avec CloudWatch Logs Insights à la demande des auditeurs.
    - id: d
      text:
        en: |-
          Create a CloudTrail Lake event data store for the organization with a 7-year retention period and termination protection, and query it with SQL.
        fr: |-
          Créer pour l'organisation un magasin de données d'événements CloudTrail Lake avec une période de rétention de 7 ans et une protection contre la résiliation, et l'interroger en SQL.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An organization trail delivers the logs of all accounts to one S3 bucket. Object Lock in compliance mode prevents any user, including the root user, from deleting or overwriting the objects during the retention period, and Lifecycle rules move old logs to cheaper storage classes. Athena queries the logs in place when auditors need them, with no infrastructure to keep running.
    fr: |-
      Un journal de suivi d'organisation livre les journaux de tous les comptes dans un seul compartiment S3. Object Lock en mode conformité empêche tout utilisateur, y compris l'utilisateur racine, de supprimer ou d'écraser les objets pendant la période de rétention, et les règles Lifecycle déplacent les anciens journaux vers des classes de stockage moins coûteuses. Athena interroge les journaux sur place lorsque les auditeurs en ont besoin, sans infrastructure à maintenir en fonctionnement.
  options:
    a:
      en: |-
        Event history covers only management events of the last 90 days in each account, so it cannot retain 7 years of logs.
      fr: |-
        L'historique des événements ne couvre que les événements de gestion des 90 derniers jours de chaque compte : il ne peut pas conserver 7 ans de journaux.
    c:
      en: |-
        CloudWatch Logs storage for terabytes per month over 7 years costs much more than S3, and retention settings do not prevent an administrator from deleting a log group.
      fr: |-
        Le stockage CloudWatch Logs de plusieurs téraoctets par mois pendant 7 ans coûte bien plus cher que S3, et les paramètres de rétention n'empêchent pas un administrateur de supprimer un groupe de journaux.
    d:
      en: |-
        CloudTrail Lake is no longer open to new customers, so it is not an option for a new deployment.
      fr: |-
        CloudTrail Lake n'est plus ouvert aux nouveaux clients : ce n'est pas une option pour un nouveau déploiement.
references:
  - title: Creating a trail for an organization - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html
  - title: Locking objects with Object Lock - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
