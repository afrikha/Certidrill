id: scsc03-1a-root-usage-filter
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses AWS Security Hub CSPM with the CIS AWS Foundations Benchmark standard enabled. The control CloudWatch.1 fails in an account. The account has a multi-Region CloudTrail trail that sends events to a CloudWatch Logs log group, and an Amazon SNS topic for security alarms. The security team must alert on every use of the root user, without alerting on actions that AWS services perform on the user's behalf, and the control must pass.

    Which metric filter pattern should the team create on the log group, with an alarm that has a threshold of 1?
  fr: |
    AnyCompany utilise AWS Security Hub CSPM avec la norme CIS AWS Foundations Benchmark activée. Le contrôle CloudWatch.1 échoue dans un compte. Le compte dispose d'un journal de suivi CloudTrail multi-Région qui envoie les événements dans un groupe de journaux CloudWatch Logs, et d'une rubrique Amazon SNS pour les alarmes de sécurité. L'équipe de sécurité doit alerter à chaque utilisation de l'utilisateur racine, sans alerter sur les actions que des services AWS effectuent pour son compte, et le contrôle doit réussir.

    Quel modèle de filtre de métriques l'équipe doit-elle créer sur le groupe de journaux, avec une alarme dont le seuil est 1 ?
body:
  options:
    - id: a
      text: '`{$.userIdentity.type="Root"}`'
    - id: b
      text: '`{$.userIdentity.type="Root" && $.userIdentity.invokedBy NOT EXISTS && $.eventType !="AwsServiceEvent"}`'
    - id: c
      text: '`{$.userIdentity.type="Root" && $.eventName="ConsoleLogin" && $.eventType !="AwsServiceEvent"}`'
    - id: d
      text: '`{$.userIdentity.type="Root" && $.userIdentity.invokedBy EXISTS && $.eventType ="AwsServiceEvent"}`'
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The CIS pattern matches events whose identity type is Root, excludes calls that an AWS service made on the root user's behalf (invokedBy is present), and excludes AWS service events. Security Hub CSPM checks for this exact pattern on the log group of a multi-Region trail, with a metric filter, an alarm with a threshold of 1, and an SNS subscription; the control fails if fields or terms are added.
    fr: |-
      Le modèle CIS correspond aux événements dont le type d'identité est Root, exclut les appels qu'un service AWS a effectués pour le compte de l'utilisateur racine (invokedBy présent) et exclut les événements de service AWS. Security Hub CSPM vérifie la présence de ce modèle exact sur le groupe de journaux d'un journal de suivi multi-Région, avec un filtre de métriques, une alarme de seuil 1 et un abonnement SNS ; le contrôle échoue si des champs ou des termes sont ajoutés.
  options:
    a:
      en: |-
        This pattern also matches actions that AWS services perform on the root user's behalf, which creates false alerts, and it is not the pattern that the control checks.
      fr: |-
        Ce modèle correspond aussi aux actions que des services AWS effectuent pour le compte de l'utilisateur racine, ce qui crée de fausses alertes, et ce n'est pas le modèle vérifié par le contrôle.
    c:
      en: |-
        Restricting the pattern to ConsoleLogin misses root API calls made with access keys or after sign-in.
      fr: |-
        Limiter le modèle à ConsoleLogin manque les appels d'API de l'utilisateur racine effectués avec des clés d'accès ou après la connexion.
    d:
      en: |-
        This pattern matches only the service-invoked events that must be excluded, and none of the actions that a person performs as root.
      fr: |-
        Ce modèle ne correspond qu'aux événements invoqués par des services, qui doivent être exclus, et à aucune des actions qu'une personne effectue en tant qu'utilisateur racine.
references:
  - title: Security Hub CSPM controls for Amazon CloudWatch - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html
