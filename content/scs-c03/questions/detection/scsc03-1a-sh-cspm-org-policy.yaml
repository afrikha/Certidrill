id: scsc03-1a-sh-cspm-org-policy
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is setting up AWS Security Hub CSPM for an organization in AWS Organizations that has never used it. Security Hub CSPM must run continuous assessments against the AWS Foundational Security Best Practices standard and the CIS AWS Foundations Benchmark standard in every account and in all current and future supported AWS Regions, with three controls disabled. New accounts must be covered automatically, and changes made locally in an account must be corrected without manual work. The delegated administrator has a delegation policy for the required policy type.

    Which solution will meet these requirements?
  fr: |
    AnyCompany met en place AWS Security Hub CSPM pour une organisation AWS Organizations qui ne l'a jamais utilisé. Security Hub CSPM doit effectuer des évaluations continues par rapport à la norme AWS Foundational Security Best Practices et à la norme CIS AWS Foundations Benchmark dans chaque compte et dans toutes les Régions AWS prises en charge actuelles et futures, avec trois contrôles désactivés. Les nouveaux comptes doivent être couverts automatiquement, et les modifications effectuées localement dans un compte doivent être corrigées sans travail manuel. L'administrateur délégué dispose d'une politique de délégation pour le type de politique requis.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Security Hub CSPM policy in AWS Organizations that enables Security Hub CSPM in ALL_SUPPORTED Regions with the two standards and the three disabled controls, and attach it to the organization root.
        fr: |-
          Créer dans AWS Organizations une politique Security Hub CSPM qui active Security Hub CSPM dans les Régions ALL_SUPPORTED avec les deux normes et les trois contrôles désactivés, et l'attacher à la racine de l'organisation.
    - id: b
      text:
        en: |-
          Use a service-managed AWS CloudFormation StackSet with automatic deployment to create the Security Hub CSPM hub and standards resources in every account and in each current Region.
        fr: |-
          Utiliser un StackSet AWS CloudFormation géré par le service avec déploiement automatique pour créer les ressources hub et normes de Security Hub CSPM dans chaque compte et dans chaque Région actuelle.
    - id: c
      text:
        en: |-
          Attach a service control policy (SCP) to the root that denies the actions that disable Security Hub CSPM, its standards, and its controls.
        fr: |-
          Attacher à la racine une politique de contrôle des services (SCP) qui refuse les actions qui désactivent Security Hub CSPM, ses normes et ses contrôles.
    - id: d
      text:
        en: |-
          Deploy an organization conformance pack that contains the securityhub-enabled managed rule, and review the noncompliant accounts each week.
        fr: |-
          Déployer un pack de conformité d'organisation contenant la règle gérée securityhub-enabled, et examiner chaque semaine les comptes non conformes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Security Hub CSPM policies are AWS Organizations declarative policies that define the complete desired state of Security Hub CSPM: the Regions where it is enabled (ALL_SUPPORTED includes future Regions), the enabled standards, and the enabled or disabled controls. Accounts inherit the policy from the root or their OU, including new accounts, and Security Hub CSPM periodically corrects drift in governed accounts.
    fr: |-
      Les politiques Security Hub CSPM sont des politiques déclaratives d'AWS Organizations qui définissent l'état souhaité complet de Security Hub CSPM : les Régions où il est activé (ALL_SUPPORTED inclut les Régions futures), les normes activées et les contrôles activés ou désactivés. Les comptes héritent de la politique depuis la racine ou leur unité d'organisation, y compris les nouveaux comptes, et Security Hub CSPM corrige périodiquement la dérive dans les comptes gouvernés.
  options:
    b:
      en: |-
        A StackSet deploys to the Regions that it lists, so future Regions are not covered, and local changes made outside CloudFormation are not corrected automatically.
      fr: |-
        Un StackSet déploie dans les Régions qu'il liste : les Régions futures ne sont pas couvertes, et les modifications locales effectuées hors de CloudFormation ne sont pas corrigées automatiquement.
    c:
      en: |-
        SCPs only restrict permissions; they cannot enable Security Hub CSPM or its standards in any account.
      fr: |-
        Les SCP ne font que restreindre les autorisations ; elles ne peuvent activer ni Security Hub CSPM ni ses normes dans aucun compte.
    d:
      en: |-
        The rule detects accounts where Security Hub CSPM is not enabled, but it does not enable the standards or correct drift.
      fr: |-
        La règle détecte les comptes où Security Hub CSPM n'est pas activé, mais elle n'active pas les normes et ne corrige pas la dérive.
references:
  - title: Security Hub CSPM policies - AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_security_hub_cspm.html
