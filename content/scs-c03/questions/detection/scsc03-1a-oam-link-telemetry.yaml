id: scsc03-1a-oam-link-telemetry
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses CloudWatch cross-account observability in eu-west-1. A central security monitoring account has a sink that is configured to accept metrics and log groups only. A workload account already shares its data with two other monitoring accounts in eu-west-1. An engineer in the workload account tries to create a link to the security monitoring account that shares metrics, log groups, and AWS X-Ray traces, but the link creation fails. The security team needs only the metrics and log groups.

    What should the engineer do?
  fr: |
    AnyCompany utilise l'observabilité inter-comptes CloudWatch dans eu-west-1. Un compte central de surveillance de la sécurité dispose d'un sink configuré pour n'accepter que les métriques et les groupes de journaux. Un compte de charge de travail partage déjà ses données avec deux autres comptes de surveillance dans eu-west-1. Un ingénieur du compte de charge de travail tente de créer un lien vers le compte de surveillance de la sécurité qui partage les métriques, les groupes de journaux et les traces AWS X-Ray, mais la création du lien échoue. L'équipe de sécurité n'a besoin que des métriques et des groupes de journaux.

    Que doit faire l'ingénieur ?
body:
  options:
    - id: a
      text:
        en: |-
          Create the link from the workload account with only metrics and log groups selected as the shared data types.
        fr: |-
          Créer le lien depuis le compte de charge de travail avec seulement les métriques et les groupes de journaux sélectionnés comme types de données partagés.
    - id: b
      text:
        en: |-
          Create a second sink in the security monitoring account in eu-west-1 that accepts traces, and link the workload account to both sinks.
        fr: |-
          Créer dans le compte de surveillance de la sécurité un second sink dans eu-west-1 qui accepte les traces, et lier le compte de charge de travail aux deux sinks.
    - id: c
      text:
        en: |-
          Remove one of the existing links, because a source account can share data with only two monitoring accounts.
        fr: |-
          Supprimer l'un des liens existants, car un compte source ne peut partager ses données qu'avec deux comptes de surveillance.
    - id: d
      text:
        en: |-
          Create the sink in us-east-1 instead, because cross-account observability links are created in a single global Region.
        fr: |-
          Créer plutôt le sink dans us-east-1, car les liens d'observabilité inter-comptes sont créés dans une seule Région globale.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The monitoring account and the source account each select the telemetry types to accept or share. If the source account selects more types than the monitoring account accepts, link creation fails and nothing is shared. Selecting only metrics and log groups in the link matches the sink configuration and meets the requirement.
    fr: |-
      Le compte de surveillance et le compte source sélectionnent chacun les types de télémétrie à accepter ou à partager. Si le compte source sélectionne plus de types que le compte de surveillance n'en accepte, la création du lien échoue et rien n'est partagé. Sélectionner uniquement les métriques et les groupes de journaux dans le lien correspond à la configuration du sink et répond à l'exigence.
  options:
    b:
      en: |-
        Each account can have only one sink per Region, and the security team does not need traces.
      fr: |-
        Chaque compte ne peut avoir qu'un seul sink par Région, et l'équipe de sécurité n'a pas besoin des traces.
    c:
      en: |-
        A source account can share data with up to five monitoring accounts, so the two existing links are not the cause.
      fr: |-
        Un compte source peut partager ses données avec jusqu'à cinq comptes de surveillance : les deux liens existants ne sont pas la cause.
    d:
      en: |-
        Cross-account observability is scoped to a Region; the sink and the link must be in the same Region as the data, here eu-west-1.
      fr: |-
        L'observabilité inter-comptes est limitée à une Région ; le sink et le lien doivent se trouver dans la même Région que les données, ici eu-west-1.
references:
  - title: CloudWatch cross-account observability - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Unified-Cross-Account.html
