id: scsc03-1b-log-source-match
objective: "1.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team is choosing the log sources for its detection use cases. Its workloads run behind Application Load Balancers protected by AWS WAF, in VPCs connected by a transit gateway.

    Match each use case with the log source that provides the required data. Each log source can be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe de sécurité d'AnyCompany choisit les sources de journaux de ses cas d'usage de détection. Ses charges de travail s'exécutent derrière des Application Load Balancers protégés par AWS WAF, dans des VPC reliés par une passerelle de transit.

    Associez chaque cas d'usage à la source de journaux qui fournit les données requises. Chaque source de journaux peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: resolver, text: { en: "Route 53 Resolver query logs", fr: "Journaux de requêtes Route 53 Resolver" } }
    - { id: waf, text: { en: "AWS WAF logs", fr: "Journaux AWS WAF" } }
    - { id: tgw, text: { en: "Transit gateway flow logs", fr: "Journaux de flux de passerelle de transit" } }
    - { id: cloudtrail, text: { en: "CloudTrail management events", fr: "Événements de gestion CloudTrail" } }
    - { id: vpcflow, text: { en: "VPC Flow Logs", fr: "VPC Flow Logs" } }
    - { id: nfwtls, text: { en: "Network Firewall TLS logs", fr: "Journaux TLS de Network Firewall" } }
  targets:
    - id: t1
      text:
        en: "Identify the instance that looked up a command-and-control domain name."
        fr: "Identifier l'instance qui a résolu un nom de domaine de commande et de contrôle."
    - id: t2
      text:
        en: "See which web requests to the load balancers matched a SQL injection rule, with the rule that terminated them."
        fr: "Voir quelles requêtes web vers les équilibreurs de charge ont correspondu à une règle d'injection SQL, avec la règle qui les a arrêtées."
    - id: t3
      text:
        en: "Record traffic between VPCs with the attachment that carried each flow."
        fr: "Enregistrer le trafic entre VPC avec la pièce jointe qui a transporté chaque flux."
    - id: t4
      text:
        en: "Find who added an inbound rule that opens port 22 to 0.0.0.0/0 in a security group."
        fr: "Trouver qui a ajouté une règle entrante qui ouvre le port 22 à 0.0.0.0/0 dans un groupe de sécurité."
    - id: t5
      text:
        en: "List the rejected SSH connection attempts to a network interface of an instance."
        fr: "Lister les tentatives de connexion SSH rejetées vers une interface réseau d'une instance."
answer:
  mapping: { t1: resolver, t2: waf, t3: tgw, t4: cloudtrail, t5: vpcflow }
explanation:
  correct:
    en: "Resolver query logs record each DNS query with the source instance and the domain name. WAF logs record the inspected web requests and the rule that terminated each one. Transit gateway flow logs record flows per attachment with the source and destination VPC IDs. CloudTrail management events record the AuthorizeSecurityGroupIngress call and its caller. VPC Flow Logs record accepted and rejected flows on network interfaces."
    fr: "Les journaux de requêtes Resolver enregistrent chaque requête DNS avec l'instance source et le nom de domaine. Les journaux WAF enregistrent les requêtes web inspectées et la règle qui a arrêté chacune d'elles. Les journaux de flux de passerelle de transit enregistrent les flux par pièce jointe avec les ID des VPC source et de destination. Les événements de gestion CloudTrail enregistrent l'appel AuthorizeSecurityGroupIngress et son auteur. VPC Flow Logs enregistre les flux acceptés et rejetés sur les interfaces réseau."
  options:
    nfwtls:
      en: "Network Firewall TLS logs record TLS inspection events of a firewall; none of the use cases needs them, and this design has no TLS inspection."
      fr: "Les journaux TLS de Network Firewall enregistrent les événements d'inspection TLS d'un pare-feu ; aucun cas d'usage n'en a besoin, et cette architecture n'utilise pas l'inspection TLS."
references:
  - title: AWS Transit Gateway Flow Logs - Amazon VPC
    url: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-flow-logs.html
  - title: Resolver query logging - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs.html
