id: scsc03-1a-inspector-continuous
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs workloads on Amazon EC2 instances and stores container images in Amazon ECR private repositories. The security team currently runs a weekly vulnerability scan from a self-managed scanner, which misses vulnerabilities published between runs and images pushed during the week. The team wants instances and images to be assessed automatically when they are deployed or pushed and reassessed as new vulnerabilities are published, without scheduling or operating scans.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des charges de travail sur des instances Amazon EC2 et stocke des images de conteneur dans des référentiels privés Amazon ECR. L'équipe de sécurité exécute actuellement une analyse de vulnérabilités hebdomadaire à partir d'un scanner autogéré, qui manque les vulnérabilités publiées entre deux exécutions et les images envoyées pendant la semaine. L'équipe veut que les instances et les images soient évaluées automatiquement lors de leur déploiement ou de leur envoi, puis réévaluées à mesure que de nouvelles vulnérabilités sont publiées, sans planifier ni exploiter d'analyses.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on Amazon ECR basic scanning with scan on push for all repositories, and keep the weekly scanner for the instances.
        fr: |-
          Activer l'analyse de base d'Amazon ECR avec analyse lors de l'envoi pour tous les référentiels, et conserver le scanner hebdomadaire pour les instances.
    - id: b
      text:
        en: |-
          Activate Amazon Inspector with EC2 scanning and Amazon ECR enhanced scanning for the account.
        fr: |-
          Activer Amazon Inspector avec l'analyse EC2 et l'analyse améliorée d'Amazon ECR pour le compte.
    - id: c
      text:
        en: |-
          Create a daily State Manager association that runs the self-managed scanner on every instance and on a build host that pulls the images.
        fr: |-
          Créer une association State Manager quotidienne qui exécute le scanner autogéré sur chaque instance et sur un hôte de build qui récupère les images.
    - id: d
      text:
        en: |-
          Enable GuardDuty Runtime Monitoring for Amazon EC2 and Amazon ECS so that vulnerable images and instances are reported.
        fr: |-
          Activer GuardDuty Runtime Monitoring pour Amazon EC2 et Amazon ECS afin que les images et les instances vulnérables soient signalées.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon Inspector scans automatically: EC2 scanning uses the SSM agent or EBS snapshots (hybrid mode by default) to find CVEs, package vulnerabilities, and network exposure, and ECR enhanced scanning scans images that are pushed, activated, or pulled within the rescan duration. No scan has to be scheduled or operated.
    fr: |-
      Amazon Inspector analyse automatiquement : l'analyse EC2 utilise l'agent SSM ou des instantanés EBS (mode hybride par défaut) pour trouver les CVE, les vulnérabilités des packages et l'exposition réseau, et l'analyse améliorée d'ECR analyse les images envoyées, activées ou récupérées pendant la durée de nouvelle analyse. Aucune analyse ne doit être planifiée ni exploitée.
  options:
    a:
      en: |-
        Basic scanning checks images at push time only, and the weekly scanner still misses vulnerabilities published between runs on the instances.
      fr: |-
        L'analyse de base ne vérifie les images qu'au moment de l'envoi, et le scanner hebdomadaire manque toujours, sur les instances, les vulnérabilités publiées entre deux exécutions.
    c:
      en: |-
        A daily scan still runs on a schedule, misses images between runs, and keeps the scanner and the build host to operate.
      fr: |-
        Une analyse quotidienne s'exécute toujours selon une planification, manque les images entre deux exécutions et laisse le scanner et l'hôte de build à exploiter.
    d:
      en: |-
        Runtime Monitoring detects threats from runtime activity; it does not assess software for known vulnerabilities.
      fr: |-
        Runtime Monitoring détecte les menaces à partir de l'activité à l'exécution ; il n'évalue pas les logiciels à la recherche de vulnérabilités connues.
references:
  - title: Automated scan types in Amazon Inspector - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-resources.html
