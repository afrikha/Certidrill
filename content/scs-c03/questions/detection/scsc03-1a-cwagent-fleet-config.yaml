id: scsc03-1a-cwagent-fleet-config
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 600 Amazon EC2 Linux instances that are managed nodes in AWS Systems Manager, and Auto Scaling launches new instances every day. The CloudWatch agent is installed on all instances. The security team must apply one central agent configuration that sends security logs to CloudWatch Logs, keep it applied to new instances automatically, and be able to update it in one place. The instance role must follow least privilege.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 600 instances Amazon EC2 Linux qui sont des nœuds gérés dans AWS Systems Manager, et Auto Scaling lance de nouvelles instances chaque jour. L'agent CloudWatch est installé sur toutes les instances. L'équipe de sécurité doit appliquer une configuration d'agent centrale qui envoie les journaux de sécurité dans CloudWatch Logs, la maintenir appliquée automatiquement aux nouvelles instances, et pouvoir la mettre à jour en un seul endroit. Le rôle des instances doit respecter le moindre privilège.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Store the configuration in an AmazonCloudWatch- parameter, run AmazonCloudWatch-ManageAgent once with Run Command on all instances, and give the instance role CloudWatchAgentServerPolicy and AmazonSSMManagedInstanceCore.
        fr: |-
          Stocker la configuration dans un paramètre AmazonCloudWatch-, exécuter une fois AmazonCloudWatch-ManageAgent avec Run Command sur toutes les instances, et donner au rôle des instances CloudWatchAgentServerPolicy et AmazonSSMManagedInstanceCore.
    - id: b
      text:
        en: |-
          Store the configuration in an AmazonCloudWatch- parameter, run AmazonCloudWatch-ManageAgent through a State Manager association, and give the instance role CloudWatchAgentAdminPolicy and AmazonSSMManagedInstanceCore.
        fr: |-
          Stocker la configuration dans un paramètre AmazonCloudWatch-, exécuter AmazonCloudWatch-ManageAgent par une association State Manager, et donner au rôle des instances CloudWatchAgentAdminPolicy et AmazonSSMManagedInstanceCore.
    - id: c
      text:
        en: |-
          Store the configuration in an AmazonCloudWatch- parameter, run AmazonCloudWatch-ManageAgent through a State Manager association, and give the instance role CloudWatchAgentServerPolicy and AmazonSSMManagedInstanceCore.
        fr: |-
          Stocker la configuration dans un paramètre AmazonCloudWatch-, exécuter AmazonCloudWatch-ManageAgent par une association State Manager, et donner au rôle des instances CloudWatchAgentServerPolicy et AmazonSSMManagedInstanceCore.
    - id: d
      text:
        en: |-
          Write the configuration file in the launch template user data, start the agent from the user data script, and give the instance role CloudWatchAgentServerPolicy and AmazonSSMManagedInstanceCore.
        fr: |-
          Écrire le fichier de configuration dans les données utilisateur du modèle de lancement, démarrer l'agent depuis ce script, et donner au rôle des instances CloudWatchAgentServerPolicy et AmazonSSMManagedInstanceCore.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The AmazonCloudWatch-ManageAgent document configures and restarts the agent from a configuration stored in Parameter Store. Running it through a State Manager association keeps the configuration applied on a schedule to all targeted nodes, including new instances, and an update of the parameter is picked up at the next run. The instance role needs CloudWatchAgentServerPolicy to publish logs and read the AmazonCloudWatch- parameters, and AmazonSSMManagedInstanceCore for Systems Manager.
    fr: |-
      Le document AmazonCloudWatch-ManageAgent configure et redémarre l'agent à partir d'une configuration stockée dans Parameter Store. L'exécuter par une association State Manager maintient la configuration appliquée selon une planification sur tous les nœuds ciblés, y compris les nouvelles instances, et une mise à jour du paramètre est prise en compte à l'exécution suivante. Le rôle des instances a besoin de CloudWatchAgentServerPolicy pour publier les journaux et lire les paramètres AmazonCloudWatch-, et d'AmazonSSMManagedInstanceCore pour Systems Manager.
  options:
    a:
      en: |-
        A single Run Command execution configures only the instances that exist at that time; instances launched later keep no central configuration.
      fr: |-
        Une seule exécution de Run Command ne configure que les instances existantes à ce moment-là ; les instances lancées ensuite n'ont pas la configuration centrale.
    b:
      en: |-
        CloudWatchAgentAdminPolicy also allows writing the configuration to Parameter Store and is meant for the administrators who create the configuration; giving it to every instance breaks least privilege.
      fr: |-
        CloudWatchAgentAdminPolicy permet aussi d'écrire la configuration dans Parameter Store et est destinée aux administrateurs qui créent la configuration ; la donner à chaque instance enfreint le moindre privilège.
    d:
      en: |-
        User data runs at launch only, so existing instances are not updated and every change requires a new launch template version and new instances.
      fr: |-
        Les données utilisateur ne s'exécutent qu'au lancement : les instances existantes ne sont pas mises à jour, et chaque modification exige une nouvelle version du modèle de lancement et de nouvelles instances.
references:
  - title: Install the CloudWatch agent using AWS Systems Manager - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/installing-cloudwatch-agent-ssm.html
