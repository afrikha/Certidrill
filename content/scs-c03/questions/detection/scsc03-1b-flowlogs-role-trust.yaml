id: scsc03-1b-flowlogs-role-trust
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer at AnyCompany created a VPC flow log that publishes to an Amazon CloudWatch Logs log group, and selected an existing IAM role. The role's permissions policy allows logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogGroups, and logs:DescribeLogStreams. Its trust policy allows ec2.amazonaws.com to assume the role. The flow log shows an access error, and no log streams appear. The logs must stay in CloudWatch Logs.

    What should the engineer do?
  fr: |
    Un ingénieur d'AnyCompany a créé un journal de flux VPC qui publie dans un groupe de journaux Amazon CloudWatch Logs, et a sélectionné un rôle IAM existant. La politique d'autorisations du rôle autorise logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogGroups et logs:DescribeLogStreams. Sa politique d'approbation autorise ec2.amazonaws.com à endosser le rôle. Le journal de flux affiche une erreur d'accès, et aucun flux de journaux n'apparaît. Les journaux doivent rester dans CloudWatch Logs.

    Que doit faire l'ingénieur ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch Logs resource policy that allows vpc-flow-logs.amazonaws.com to call logs:PutLogEvents on the log group.
        fr: |-
          Créer une politique de ressource CloudWatch Logs qui autorise vpc-flow-logs.amazonaws.com à appeler logs:PutLogEvents sur le groupe de journaux.
    - id: b
      text:
        en: |-
          Change the role's trust policy to allow vpc-flow-logs.amazonaws.com to assume it, with aws:SourceAccount and aws:SourceArn conditions.
        fr: |-
          Modifier la politique d'approbation du rôle pour autoriser vpc-flow-logs.amazonaws.com à l'endosser, avec des conditions aws:SourceAccount et aws:SourceArn.
    - id: c
      text:
        en: |-
          Attach the CloudWatchAgentServerPolicy managed policy to the role so that it can write to CloudWatch Logs.
        fr: |-
          Attacher la politique gérée CloudWatchAgentServerPolicy au rôle pour qu'il puisse écrire dans CloudWatch Logs.
    - id: d
      text:
        en: |-
          Add logs:PutRetentionPolicy and logs:AssociateKmsKey to the role's permissions policy.
        fr: |-
          Ajouter logs:PutRetentionPolicy et logs:AssociateKmsKey à la politique d'autorisations du rôle.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The flow logs service publishes to CloudWatch Logs by assuming the role, so the trust policy must name the vpc-flow-logs.amazonaws.com service principal. The permissions policy already has the five required actions, and AWS recommends aws:SourceAccount and aws:SourceArn conditions against the confused deputy problem.
    fr: |-
      Le service des journaux de flux publie dans CloudWatch Logs en endossant le rôle : la politique d'approbation doit donc nommer le principal de service vpc-flow-logs.amazonaws.com. La politique d'autorisations contient déjà les cinq actions requises, et AWS recommande les conditions aws:SourceAccount et aws:SourceArn contre le problème du député confus (confused deputy).
  options:
    a:
      en: |-
        Flow logs to CloudWatch Logs are published through the IAM role; a resource policy does not fix a role that the service cannot assume.
      fr: |-
        Les journaux de flux vers CloudWatch Logs sont publiés au moyen du rôle IAM ; une politique de ressource ne corrige pas un rôle que le service ne peut pas endosser.
    c:
      en: |-
        The role already has the required logs permissions; the problem is that the flow logs service is not trusted to assume it.
      fr: |-
        Le rôle dispose déjà des autorisations logs requises ; le problème est que le service des journaux de flux n'est pas approuvé pour l'endosser.
    d:
      en: |-
        These actions are not needed to publish flow logs, and the service still cannot assume the role.
      fr: |-
        Ces actions ne sont pas nécessaires pour publier des journaux de flux, et le service ne peut toujours pas endosser le rôle.
references:
  - title: IAM role for publishing flow logs to CloudWatch Logs - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-iam-role.html
