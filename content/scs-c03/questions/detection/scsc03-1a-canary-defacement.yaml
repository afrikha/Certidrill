id: scsc03-1a-canary-defacement
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's marketing website is served through Amazon CloudFront. After a competitor's site was defaced, the security team wants to detect unauthorized changes to the rendered home page, such as injected scripts or replaced content, within 5 minutes, and to receive an alert. The check must exercise the page as a browser does, including content loaded by JavaScript, and must not require changes to the website.

    Which solution will meet these requirements?
  fr: |
    Le site web marketing d'AnyCompany est servi par Amazon CloudFront. Après la défiguration du site d'un concurrent, l'équipe de sécurité veut détecter dans un délai de 5 minutes les modifications non autorisées de la page d'accueil rendue, comme des scripts injectés ou un contenu remplacé, et recevoir une alerte. La vérification doit charger la page comme le fait un navigateur, y compris le contenu chargé par JavaScript, et ne doit exiger aucune modification du site.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Route 53 HTTPS health check with string matching on the home page title every 30 seconds, and create a CloudWatch alarm on the status of the health check.
        fr: |-
          Créer une vérification de l'état HTTPS Route 53 avec correspondance de chaîne sur le titre de la page d'accueil toutes les 30 secondes, et créer une alarme CloudWatch sur l'état de la vérification.
    - id: b
      text:
        en: |-
          Associate an AWS WAF web ACL with the distribution, and create a CloudWatch alarm on the BlockedRequests metric of the managed rules that detect cross-site scripting.
        fr: |-
          Associer une liste ACL web AWS WAF à la distribution, et créer une alarme CloudWatch sur la métrique BlockedRequests des règles gérées qui détectent le cross-site scripting.
    - id: c
      text:
        en: |-
          Create a CloudWatch Synthetics canary that loads the home page in a headless browser every 5 minutes and compares screenshots with a baseline, with an alarm on canary failures.
        fr: |-
          Créer un canary CloudWatch Synthetics qui charge la page d'accueil dans un navigateur sans interface toutes les 5 minutes et compare les captures d'écran avec une référence, avec une alarme sur les échecs du canary.
    - id: d
      text:
        en: |-
          Enable CloudFront standard logs to Amazon S3, and run an Amazon Athena query every 5 minutes that alerts on home page responses with HTTP status codes other than 200.
        fr: |-
          Activer les journaux standard CloudFront vers Amazon S3, et exécuter toutes les 5 minutes une requête Amazon Athena qui alerte sur les réponses de la page d'accueil dont le code d'état HTTP n'est pas 200.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Synthetics canaries are scripts that run on a schedule as often as once per minute and follow the same routes as a customer, with headless browser support for content loaded by JavaScript. They can capture screenshots and detect unauthorized changes such as code injection and cross-site scripting, and they publish metrics in the CloudWatchSynthetics namespace on which an alarm can notify the team.
    fr: |-
      Les canaries Synthetics sont des scripts qui s'exécutent selon une planification jusqu'à une fois par minute et suivent les mêmes parcours qu'un client, avec la prise en charge de navigateurs sans interface pour le contenu chargé par JavaScript. Ils peuvent prendre des captures d'écran et détecter des modifications non autorisées comme l'injection de code et le cross-site scripting, et publient dans l'espace de noms CloudWatchSynthetics des métriques sur lesquelles une alarme peut avertir l'équipe.
  options:
    a:
      en: |-
        A health check fetches the raw response without running JavaScript and checks only that one string is present, so injected content elsewhere on the page goes unnoticed.
      fr: |-
        Une vérification de l'état récupère la réponse brute sans exécuter JavaScript et vérifie seulement la présence d'une chaîne : un contenu injecté ailleurs dans la page passe inaperçu.
    b:
      en: |-
        AWS WAF blocks malicious requests, but it does not verify what the published page actually contains, so a defacement made through another path is not detected.
      fr: |-
        AWS WAF bloque les requêtes malveillantes, mais ne vérifie pas ce que contient réellement la page publiée : une défiguration effectuée par un autre chemin n'est pas détectée.
    d:
      en: |-
        A defaced page is usually still served with a 200 status code, so status codes in the access logs do not reveal content changes.
      fr: |-
        Une page défigurée est généralement toujours servie avec un code d'état 200 : les codes d'état des journaux d'accès ne révèlent pas les modifications de contenu.
references:
  - title: Synthetic monitoring (canaries) - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries.html
