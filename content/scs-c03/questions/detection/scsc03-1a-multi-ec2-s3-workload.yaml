id: scsc03-1a-multi-ec2-s3-workload
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is onboarding a workload that consists of Amazon EC2 web servers in public subnets and an Amazon S3 bucket that stores customer documents. Amazon GuardDuty is enabled in the account with its foundational data sources only. The workload review produced two monitoring requirements. First, the instances must be continuously assessed for software vulnerabilities and unintended network exposure. Second, the team must detect anomalous object-level API activity on the bucket, such as unusual GetObject or DeleteObject calls made with compromised credentials.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    AnyCompany intègre une charge de travail composée de serveurs web Amazon EC2 dans des sous-réseaux publics et d'un compartiment Amazon S3 qui stocke des documents clients. Amazon GuardDuty est activé dans le compte avec ses seules sources de données fondamentales. La revue de la charge de travail a produit deux exigences de surveillance. D'abord, les instances doivent être évaluées en continu pour les vulnérabilités logicielles et l'exposition réseau non souhaitée. Ensuite, l'équipe doit détecter une activité d'API anormale au niveau des objets du compartiment, comme des appels GetObject ou DeleteObject inhabituels effectués avec des informations d'identification compromises.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Activate Amazon Inspector EC2 scanning for the account.
        fr: |-
          Activer l'analyse EC2 d'Amazon Inspector pour le compte.
    - id: b
      text:
        en: |-
          Enable GuardDuty Runtime Monitoring for Amazon EC2.
        fr: |-
          Activer GuardDuty Runtime Monitoring pour Amazon EC2.
    - id: c
      text:
        en: |-
          Enable Amazon Macie automated sensitive data discovery for the bucket.
        fr: |-
          Activer la découverte automatisée des données sensibles Amazon Macie pour le compartiment.
    - id: d
      text:
        en: |-
          Enable the GuardDuty S3 Protection plan in the account.
        fr: |-
          Activer le plan GuardDuty S3 Protection dans le compte.
    - id: e
      text:
        en: |-
          Deploy the AWS Config managed rule restricted-ssh for the security groups.
        fr: |-
          Déployer la règle gérée AWS Config restricted-ssh pour les groupes de sécurité.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Amazon Inspector EC2 scanning finds CVEs in operating system and language packages and reports network reachability issues, and it rescans as the environment changes. GuardDuty S3 Protection analyzes CloudTrail S3 data events such as GetObject and DeleteObject for all buckets in the Region to detect exfiltration and destruction attempts, and it does not require S3 data event logging to be configured in a trail.
    fr: |-
      L'analyse EC2 d'Amazon Inspector trouve les CVE dans les packages du système d'exploitation et des langages et signale les problèmes d'accessibilité réseau, en analysant à nouveau lorsque l'environnement change. GuardDuty S3 Protection analyse les événements de données S3 de CloudTrail, comme GetObject et DeleteObject, pour tous les compartiments de la Région afin de détecter les tentatives d'exfiltration et de destruction, sans exiger la configuration de la journalisation des événements de données S3 dans un journal de suivi.
  options:
    b:
      en: |-
        Runtime Monitoring detects threats from operating system events at runtime; it does not assess installed software for vulnerabilities or report network exposure.
      fr: |-
        Runtime Monitoring détecte les menaces à partir des événements du système d'exploitation à l'exécution ; il n'évalue pas les vulnérabilités des logiciels installés et ne signale pas l'exposition réseau.
    c:
      en: |-
        Macie identifies sensitive data in the objects; it does not detect anomalous API activity on the bucket.
      fr: |-
        Macie identifie les données sensibles dans les objets ; il ne détecte pas l'activité d'API anormale sur le compartiment.
    e:
      en: |-
        The rule flags security groups that allow unrestricted SSH, which is one configuration check; it does not assess software vulnerabilities or overall network reachability.
      fr: |-
        La règle signale les groupes de sécurité qui autorisent SSH sans restriction, ce qui n'est qu'un contrôle de configuration ; elle n'évalue ni les vulnérabilités logicielles ni l'accessibilité réseau globale.
references:
  - title: Automated scan types in Amazon Inspector - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-resources.html
  - title: GuardDuty S3 Protection - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/s3-protection.html
