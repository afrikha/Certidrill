id: scsc03-1a-multi-sh-org-setup
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 50 accounts in AWS Organizations and operates in four AWS Regions. Amazon GuardDuty, Amazon Inspector, and Amazon Macie are already enabled in every account and Region. The security team wants one prioritized view, in us-east-1, of the findings and the exposure findings that AWS Security Hub correlates across all accounts and Regions. The team works from a security tooling account and must not use the management account for daily operations.

    Which combination of steps will meet these requirements? (Choose three.)

    Each correct answer presents part of the solution.
  fr: |
    AnyCompany dispose de 50 comptes dans AWS Organizations et opère dans quatre Régions AWS. Amazon GuardDuty, Amazon Inspector et Amazon Macie sont déjà activés dans chaque compte et chaque Région. L'équipe de sécurité veut, dans us-east-1, une vue unique et priorisée des résultats et des résultats d'exposition qu'AWS Security Hub corrèle sur l'ensemble des comptes et des Régions. L'équipe travaille depuis un compte d'outils de sécurité et ne doit pas utiliser le compte de gestion pour les opérations quotidiennes.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez trois réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          From the management account, designate the security tooling account as the delegated administrator for Security Hub.
        fr: |-
          À partir du compte de gestion, désigner le compte d'outils de sécurité comme administrateur délégué de Security Hub.
    - id: b
      text:
        en: |-
          From the security tooling account, send Security Hub membership invitations to each of the 50 accounts.
        fr: |-
          À partir du compte d'outils de sécurité, envoyer des invitations de membre Security Hub à chacun des 50 comptes.
    - id: c
      text:
        en: |-
          From the delegated administrator account, enable Security Hub for all the member accounts in the four Regions.
        fr: |-
          À partir du compte administrateur délégué, activer Security Hub pour tous les comptes membres dans les quatre Régions.
    - id: d
      text:
        en: |-
          From the delegated administrator account in us-east-1, configure cross-Region aggregation with the three other Regions as linked Regions.
        fr: |-
          À partir du compte administrateur délégué dans us-east-1, configurer l'agrégation entre Régions avec les trois autres Régions comme Régions liées.
    - id: e
      text:
        en: |-
          Create an Amazon Security Lake subscriber with query access so that Security Hub can read the findings of the other Regions.
        fr: |-
          Créer un abonné Amazon Security Lake avec un accès en requête afin que Security Hub puisse lire les résultats des autres Régions.
    - id: f
      text:
        en: |-
          Create an AWS Config organization aggregator in the security tooling account so that Security Hub can correlate the findings.
        fr: |-
          Créer un agrégateur d'organisation AWS Config dans le compte d'outils de sécurité afin que Security Hub puisse corréler les résultats.
answer: { optionIds: [ a, c, d ] }
explanation:
  correct:
    en: |-
      Security Hub correlates the OCSF findings of GuardDuty, Inspector, Macie, and Security Hub CSPM into exposure findings. A delegated administrator designated from the management account manages the member accounts, and Security Hub must be enabled for each account in each Region because aggregation does not enable it. Cross-Region aggregation then replicates the findings and resources of the linked Regions to the home Region, where the administrator sees the data of all member accounts.
    fr: |-
      Security Hub corrèle les résultats OCSF de GuardDuty, d'Inspector, de Macie et de Security Hub CSPM en résultats d'exposition. Un administrateur délégué désigné à partir du compte de gestion gère les comptes membres, et Security Hub doit être activé pour chaque compte dans chaque Région, car l'agrégation ne l'active pas. L'agrégation entre Régions réplique ensuite les résultats et les ressources des Régions liées vers la Région d'origine, où l'administrateur voit les données de tous les comptes membres.
  options:
    b:
      en: |-
        With AWS Organizations, the delegated administrator manages the member accounts directly; invitations are not needed.
      fr: |-
        Avec AWS Organizations, l'administrateur délégué gère directement les comptes membres ; les invitations ne sont pas nécessaires.
    e:
      en: |-
        Security Hub receives findings directly from the integrated services and replicates them through cross-Region aggregation; it does not read them from Security Lake.
      fr: |-
        Security Hub reçoit les résultats directement des services intégrés et les réplique par l'agrégation entre Régions ; il ne les lit pas dans Security Lake.
    f:
      en: |-
        A Config aggregator collects configuration and compliance data; Security Hub does not need it to correlate findings from the other services.
      fr: |-
        Un agrégateur Config collecte des données de configuration et de conformité ; Security Hub n'en a pas besoin pour corréler les résultats des autres services.
references:
  - title: Introduction to AWS Security Hub - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub-v2.html
  - title: Understanding cross-Region aggregation in Security Hub - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/security-hub-region-aggregation.html
