id: scsc03-1b-cloudtrail-insights
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has a multi-Region AWS CloudTrail trail that logs read and write management events. After an incident in which a compromised credential deleted many resources in a few minutes, the security team wants to be told when the rate of write management API calls in an account deviates from its normal pattern. The team does not want to define or tune thresholds for each API.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany dispose d'un journal de suivi AWS CloudTrail multi-Régions qui journalise les événements de gestion en lecture et en écriture. Après un incident au cours duquel des identifiants compromis ont supprimé de nombreuses ressources en quelques minutes, l'équipe de sécurité veut être prévenue lorsque le débit des appels d'API de gestion en écriture d'un compte s'écarte de son modèle habituel. L'équipe ne veut pas définir ni ajuster de seuils pour chaque API.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch Logs metric filter for each write API and an alarm on each metric with a static threshold.
        fr: |-
          Créer un filtre de métriques CloudWatch Logs pour chaque API en écriture et une alarme sur chaque métrique avec un seuil statique.
    - id: b
      text:
        en: |-
          Enable CloudTrail Insights for the API call rate on the existing trail, and create an Amazon EventBridge rule that notifies the team about Insights events.
        fr: |-
          Activer CloudTrail Insights pour le débit des appels d'API sur le journal de suivi existant, et créer une règle Amazon EventBridge qui notifie l'équipe des événements Insights.
    - id: c
      text:
        en: |-
          Schedule a daily Amazon Athena query that counts write events per API and account and compares the counts with the previous week.
        fr: |-
          Planifier une requête Amazon Athena quotidienne qui compte les événements en écriture par API et par compte et compare les comptages à ceux de la semaine précédente.
    - id: d
      text:
        en: |-
          Deploy the AWS Config managed rule cloudtrail-enabled to every account and send its compliance changes to the team.
        fr: |-
          Déployer la règle gérée AWS Config cloudtrail-enabled dans chaque compte et envoyer ses changements de conformité à l'équipe.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudTrail Insights learns a baseline of write management API calls per minute and generates an Insights event when the current rate deviates from it, with no thresholds to set. Insights events can be matched by an EventBridge rule to notify the team.
    fr: |-
      CloudTrail Insights apprend une base de référence des appels d'API de gestion en écriture par minute et génère un événement Insights lorsque le débit courant s'en écarte, sans seuil à définir. Une règle EventBridge peut faire correspondre les événements Insights pour notifier l'équipe.
  options:
    a:
      en: |-
        Static thresholds per API are exactly the definition and tuning work that the team wants to avoid.
      fr: |-
        Des seuils statiques par API sont précisément le travail de définition et de réglage que l'équipe veut éviter.
    c:
      en: |-
        A daily custom query detects changes a day late and must be written and maintained by the team.
      fr: |-
        Une requête personnalisée quotidienne détecte les écarts avec un jour de retard, et l'équipe doit l'écrire et la maintenir.
    d:
      en: |-
        This rule checks that CloudTrail is enabled; it does not analyze the rate of API calls.
      fr: |-
        Cette règle vérifie que CloudTrail est activé ; elle n'analyse pas le débit des appels d'API.
references:
  - title: Working with CloudTrail Insights - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-insights-events-with-cloudtrail.html
