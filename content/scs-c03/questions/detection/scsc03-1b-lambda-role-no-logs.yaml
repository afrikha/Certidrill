id: scsc03-1b-lambda-role-no-logs
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at AnyCompany created an AWS Lambda function with the AWS CLI and a new execution role whose only policy allows dynamodb:PutItem on one table. The function runs successfully, but the security team finds no log group and no log events for it in Amazon CloudWatch Logs. The function uses the default logging configuration.

    What should the security team do so that the function sends its logs to CloudWatch Logs?
  fr: |
    Un développeur d'AnyCompany a créé une fonction AWS Lambda avec l'AWS CLI et un nouveau rôle d'exécution dont la seule politique autorise dynamodb:PutItem sur une table. La fonction s'exécute correctement, mais l'équipe de sécurité ne trouve pour elle ni groupe de journaux ni événement dans Amazon CloudWatch Logs. La fonction utilise la configuration de journalisation par défaut.

    Que doit faire l'équipe de sécurité pour que la fonction envoie ses journaux à CloudWatch Logs ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a statement to the function's resource-based policy that allows logs.amazonaws.com to invoke the function.
        fr: |-
          Ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise logs.amazonaws.com à appeler la fonction.
    - id: b
      text:
        en: |-
          Create a CloudWatch Logs resource policy that allows lambda.amazonaws.com to call logs:PutLogEvents.
        fr: |-
          Créer une politique de ressource CloudWatch Logs qui autorise lambda.amazonaws.com à appeler logs:PutLogEvents.
    - id: c
      text:
        en: |-
          Enable active tracing with AWS X-Ray on the function.
        fr: |-
          Activer le suivi actif avec AWS X-Ray sur la fonction.
    - id: d
      text:
        en: |-
          Attach the AWSLambdaBasicExecutionRole managed policy to the function's execution role.
        fr: |-
          Attacher la politique gérée AWSLambdaBasicExecutionRole au rôle d'exécution de la fonction.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Lambda sends logs with the function's execution role, which needs logs:CreateLogGroup, logs:CreateLogStream, and logs:PutLogEvents. The console adds these permissions automatically, but the AWS CLI does not; the AWSLambdaBasicExecutionRole managed policy grants them.
    fr: |-
      Lambda envoie les journaux avec le rôle d'exécution de la fonction, qui a besoin de logs:CreateLogGroup, logs:CreateLogStream et logs:PutLogEvents. La console ajoute automatiquement ces autorisations, mais pas l'AWS CLI ; la politique gérée AWSLambdaBasicExecutionRole les accorde.
  options:
    a:
      en: |-
        A resource-based policy controls who can invoke the function; it does not let the function write to CloudWatch Logs.
      fr: |-
        Une politique basée sur les ressources contrôle qui peut appeler la fonction ; elle ne permet pas à la fonction d'écrire dans CloudWatch Logs.
    b:
      en: |-
        Function logs are written with the execution role's credentials, so the permissions must be in that role, not in a CloudWatch Logs resource policy for a service principal.
      fr: |-
        Les journaux de la fonction sont écrits avec les informations d'identification du rôle d'exécution : les autorisations doivent figurer dans ce rôle, et non dans une politique de ressource CloudWatch Logs destinée à un principal de service.
    c:
      en: |-
        X-Ray records traces; it does not create log groups or send log events, and it needs its own permissions.
      fr: |-
        X-Ray enregistre des traces ; il ne crée pas de groupes de journaux, n'envoie pas d'événements de journaux et nécessite ses propres autorisations.
references:
  - title: Sending Lambda Event Function logs to CloudWatch Logs - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs.html
