id: scsc03-1a-ec2-system-check-recover
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a licensed security appliance on a single Amazon EC2 instance with EBS volumes only. The license is bound to the instance ID and private IP address. If the underlying host fails, the instance must be recovered automatically with the same instance ID and IP addresses, and the security team must receive a notification through an existing Amazon SNS topic.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une appliance de sécurité sous licence sur une seule instance Amazon EC2 qui utilise uniquement des volumes EBS. La licence est liée à l'ID de l'instance et à son adresse IP privée. Si l'hôte sous-jacent tombe en panne, l'instance doit être récupérée automatiquement avec le même ID d'instance et les mêmes adresses IP, et l'équipe de sécurité doit recevoir une notification au moyen d'une rubrique Amazon SNS existante.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the StatusCheckFailed_Instance metric with a recover action and a notification to the SNS topic.
        fr: |-
          Créer une alarme CloudWatch sur la métrique StatusCheckFailed_Instance avec une action de récupération et une notification vers la rubrique SNS.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on the StatusCheckFailed_System metric with a recover action and a notification to the SNS topic.
        fr: |-
          Créer une alarme CloudWatch sur la métrique StatusCheckFailed_System avec une action de récupération et une notification vers la rubrique SNS.
    - id: c
      text:
        en: |-
          Place the instance in an Auto Scaling group with a minimum and maximum of one, and send the Auto Scaling launch notifications to the SNS topic.
        fr: |-
          Placer l'instance dans un groupe Auto Scaling avec un minimum et un maximum de un, et envoyer les notifications de lancement Auto Scaling vers la rubrique SNS.
    - id: d
      text:
        en: |-
          Create an EventBridge rule on EC2 instance state-change events that reboots the instance with AWS Systems Manager and publishes to the SNS topic.
        fr: |-
          Créer une règle EventBridge sur les événements de changement d'état des instances EC2 qui redémarre l'instance avec AWS Systems Manager et publie dans la rubrique SNS.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A failed system status check indicates a problem with the underlying host. A CloudWatch alarm on StatusCheckFailed_System with the recover action moves the instance to another host and keeps its instance ID, private, public, and Elastic IP addresses, metadata, and attached EBS volumes, and the same alarm can notify the SNS topic.
    fr: |-
      Une vérification du statut système en échec indique un problème sur l'hôte sous-jacent. Une alarme CloudWatch sur StatusCheckFailed_System avec l'action de récupération déplace l'instance vers un autre hôte en conservant son ID d'instance, ses adresses IP privées, publiques et Elastic IP, ses métadonnées et ses volumes EBS attachés, et la même alarme peut avertir la rubrique SNS.
  options:
    a:
      en: |-
        An instance status check failure indicates a problem inside the instance, and automatic recovery does not act on it.
      fr: |-
        Un échec de la vérification du statut de l'instance indique un problème à l'intérieur de l'instance, et la récupération automatique n'agit pas dans ce cas.
    c:
      en: |-
        An Auto Scaling group replaces a failed instance with a new instance, which has a new instance ID and a new private IP address.
      fr: |-
        Un groupe Auto Scaling remplace une instance défaillante par une nouvelle instance, qui a un nouvel ID d'instance et une nouvelle adresse IP privée.
    d:
      en: |-
        A reboot on the same failed host does not move the instance, and state-change events are not raised by a failed status check.
      fr: |-
        Un redémarrage sur le même hôte défaillant ne déplace pas l'instance, et un échec de vérification du statut ne déclenche pas d'événement de changement d'état.
references:
  - title: Automatic instance recovery - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-recover.html
