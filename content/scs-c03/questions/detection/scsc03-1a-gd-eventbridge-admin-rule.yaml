id: scsc03-1a-gd-eventbridge-admin-rule
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany manages Amazon GuardDuty from a delegated administrator account for 60 member accounts in AWS Organizations. GuardDuty is enabled in us-east-1 and eu-west-1. The security operations center (SOC) wants all GuardDuty findings from all accounts and both Regions to be sent to an Amazon SNS topic that it owns in each Region. The SOC wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany gère Amazon GuardDuty à partir d'un compte administrateur délégué pour 60 comptes membres dans AWS Organizations. GuardDuty est activé dans us-east-1 et eu-west-1. Le centre des opérations de sécurité (SOC) veut que tous les résultats GuardDuty de tous les comptes et des deux Régions soient envoyés à une rubrique Amazon SNS qu'il possède dans chaque Région. Le SOC veut le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy an EventBridge rule for GuardDuty findings to every member account in both Regions with AWS CloudFormation StackSets, and target the SOC topics.
        fr: |-
          Déployer une règle EventBridge pour les résultats GuardDuty dans chaque compte membre et dans les deux Régions avec AWS CloudFormation StackSets, et cibler les rubriques du SOC.
    - id: b
      text:
        en: |-
          Create an EventBridge rule for GuardDuty findings in the delegated administrator account in each of the two Regions, and target the SOC topic of that Region.
        fr: |-
          Créer une règle EventBridge pour les résultats GuardDuty dans le compte administrateur délégué dans chacune des deux Régions, et cibler la rubrique du SOC de cette Région.
    - id: c
      text:
        en: |-
          Create one EventBridge rule for GuardDuty findings in the delegated administrator account in us-east-1, because the administrator receives the findings of all Regions there.
        fr: |-
          Créer une seule règle EventBridge pour les résultats GuardDuty dans le compte administrateur délégué dans us-east-1, car l'administrateur y reçoit les résultats de toutes les Régions.
    - id: d
      text:
        en: |-
          Export the findings of the delegated administrator account to an S3 bucket, and configure S3 Event Notifications on the bucket to publish to the SOC topics.
        fr: |-
          Exporter les résultats du compte administrateur délégué vers un compartiment S3, et configurer des notifications d'événements S3 sur le compartiment pour publier dans les rubriques du SOC.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With a delegated GuardDuty administrator, EventBridge rules in the administrator account are triggered by the findings of the member accounts as well as its own, and the accountId field can be used to filter. GuardDuty findings and events are Regional, so one rule in the administrator account in each Region covers all 60 accounts with only two rules.
    fr: |-
      Avec un administrateur GuardDuty délégué, les règles EventBridge du compte administrateur sont déclenchées par les résultats des comptes membres ainsi que par les siens, et le champ accountId peut servir de filtre. Les résultats et les événements GuardDuty sont régionaux : une règle dans le compte administrateur dans chaque Région couvre les 60 comptes avec seulement deux règles.
  options:
    a:
      en: |-
        This works but deploys and maintains 120 rules, although the administrator account already receives the member findings in EventBridge.
      fr: |-
        Cette solution fonctionne, mais déploie et maintient 120 règles, alors que le compte administrateur reçoit déjà les résultats des membres dans EventBridge.
    c:
      en: |-
        GuardDuty is Regional, so the findings of eu-west-1 are published to EventBridge in eu-west-1 and would not reach a rule in us-east-1.
      fr: |-
        GuardDuty est régional : les résultats d'eu-west-1 sont publiés dans EventBridge en eu-west-1 et n'atteindraient pas une règle de us-east-1.
    d:
      en: |-
        Exported findings are written as batch objects with a delay, and parsing the objects to notify the SOC adds components compared with an EventBridge rule.
      fr: |-
        Les résultats exportés sont écrits sous forme d'objets par lots avec un délai, et analyser ces objets pour avertir le SOC ajoute des composants par rapport à une règle EventBridge.
references:
  - title: Processing GuardDuty findings with Amazon EventBridge - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_eventbridge.html
