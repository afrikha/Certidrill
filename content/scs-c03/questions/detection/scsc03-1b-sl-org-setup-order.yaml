id: scsc03-1b-sl-org-setup-order
objective: "1.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Organizations and has not used Amazon Security Lake yet. The security team wants Security Lake to collect CloudTrail management events and VPC Flow Logs from all member accounts into the Log Archive account. A third-party SIEM in a vendor account must then receive notifications of the new objects and read them.

    Which three actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany utilise AWS Organizations et n'a encore jamais utilisé Amazon Security Lake. L'équipe de sécurité veut que Security Lake collecte les événements de gestion CloudTrail et VPC Flow Logs de tous les comptes membres dans le compte Log Archive. Un SIEM tiers d'un compte de l'éditeur doit ensuite recevoir les notifications des nouveaux objets et les lire.

    Quelles sont les trois actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: subscriber
      text:
        en: "In the Log Archive account, create a subscriber with data access for the vendor account."
        fr: "Dans le compte Log Archive, créer un abonné avec accès aux données pour le compte de l'éditeur."
    - id: trail
      text:
        en: "Create a CloudTrail organization trail that delivers to the Security Lake bucket."
        fr: "Créer un journal de suivi d'organisation CloudTrail qui livre dans le compartiment Security Lake."
    - id: delegate
      text:
        en: "From the management account, designate the Log Archive account as the Security Lake delegated administrator."
        fr: "Depuis le compte de gestion, désigner le compte Log Archive comme administrateur délégué de Security Lake."
    - id: crawler
      text:
        en: "Run an AWS Glue crawler on the Security Lake bucket to create the tables for the subscriber."
        fr: "Exécuter un robot d'analyse AWS Glue sur le compartiment Security Lake pour créer les tables de l'abonné."
    - id: enable
      text:
        en: "In the Log Archive account, enable Security Lake for the member accounts with the two AWS log sources."
        fr: "Dans le compte Log Archive, activer Security Lake pour les comptes membres avec les deux sources de journaux AWS."
answer:
  sequence: [ delegate, enable, subscriber ]
explanation:
  correct:
    en: "Only the management account can designate the delegated administrator, and AWS recommends the Log Archive account for this role. The delegated administrator then enables Security Lake for the member accounts and configures the sources. Once data is collected, it creates a data access subscriber, which is notified of new objects and reads them from S3."
    fr: "Seul le compte de gestion peut désigner l'administrateur délégué, et AWS recommande le compte Log Archive pour ce rôle. L'administrateur délégué active ensuite Security Lake pour les comptes membres et configure les sources. Une fois les données collectées, il crée un abonné avec accès aux données, qui reçoit les notifications des nouveaux objets et les lit depuis S3."
  options:
    trail:
      en: "Security Lake collects CloudTrail management events natively as an AWS source; no trail delivering to its bucket is needed."
      fr: "Security Lake collecte nativement les événements de gestion CloudTrail comme source AWS ; aucun journal de suivi livrant dans son compartiment n'est nécessaire."
    crawler:
      en: "Security Lake creates and maintains the AWS Glue Data Catalog tables of its sources itself."
      fr: "Security Lake crée et tient à jour lui-même les tables du catalogue de données AWS Glue de ses sources."
references:
  - title: Managing multiple accounts with AWS Organizations in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/multi-account-management.html
  - title: Managing data access for Security Lake subscribers - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-data-access.html
