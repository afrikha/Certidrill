id: scsc03-1b-splunk-firehose
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany sends its CloudTrail events and application security logs to several Amazon CloudWatch Logs log groups in one account. The security team uses Splunk as its SIEM and has created a Splunk HTTP Event Collector (HEC) endpoint and token. The log events must reach Splunk in near real time, and events that Splunk does not acknowledge must be kept in Amazon S3. The team does not want to run servers.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    AnyCompany envoie ses événements CloudTrail et ses journaux de sécurité applicatifs vers plusieurs groupes de journaux Amazon CloudWatch Logs d'un même compte. L'équipe de sécurité utilise Splunk comme SIEM et a créé un point de terminaison et un jeton Splunk HTTP Event Collector (HEC). Les événements de journaux doivent atteindre Splunk en quasi temps réel, et les événements dont Splunk n'accuse pas réception doivent être conservés dans Amazon S3. L'équipe ne veut pas exploiter de serveurs.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a daily CloudWatch Logs export task for each log group to an S3 bucket that Splunk reads.
        fr: |-
          Créer une tâche d'exportation CloudWatch Logs quotidienne pour chaque groupe de journaux vers un compartiment S3 que Splunk lit.
    - id: b
      text:
        en: |-
          Create an Amazon Data Firehose stream with a Splunk destination that uses the HEC endpoint and token, and back up failed events to an S3 bucket.
        fr: |-
          Créer un flux Amazon Data Firehose avec une destination Splunk qui utilise le point de terminaison et le jeton HEC, et sauvegarder les événements en échec dans un compartiment S3.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule for each log group with an API destination that posts the log events to the HEC endpoint.
        fr: |-
          Créer une règle Amazon EventBridge pour chaque groupe de journaux avec une destination d'API qui publie les événements de journaux sur le point de terminaison HEC.
    - id: d
      text:
        en: |-
          Create a CloudWatch Logs metric filter on each log group that publishes a metric, and an alarm that notifies Splunk through Amazon SNS.
        fr: |-
          Créer un filtre de métriques CloudWatch Logs sur chaque groupe de journaux qui publie une métrique, et une alarme qui notifie Splunk par Amazon SNS.
    - id: e
      text:
        en: |-
          Create a subscription filter on each log group that sends the log events to the Firehose stream, with an IAM role that allows CloudWatch Logs to put records into the stream.
        fr: |-
          Créer un filtre d'abonnement sur chaque groupe de journaux qui envoie les événements de journaux vers le flux Firehose, avec un rôle IAM qui autorise CloudWatch Logs à écrire des enregistrements dans le flux.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Firehose supports Splunk as a destination with the HEC token (entered directly or stored in Secrets Manager), and it retries or backs up events to S3 when the HEC acknowledgement does not arrive in time. A CloudWatch Logs subscription filter streams the log events of each log group to the Firehose stream in near real time, with no servers to run.
    fr: |-
      Firehose prend en charge Splunk comme destination avec le jeton HEC (saisi directement ou stocké dans Secrets Manager), et il réessaie ou sauvegarde les événements dans S3 lorsque l'accusé de réception HEC n'arrive pas à temps. Un filtre d'abonnement CloudWatch Logs diffuse les événements de chaque groupe de journaux vers le flux Firehose en quasi temps réel, sans serveur à exploiter.
  options:
    a:
      en: |-
        Export tasks are batch copies; a daily export does not deliver events in near real time.
      fr: |-
        Les tâches d'exportation sont des copies par lots ; une exportation quotidienne ne livre pas les événements en quasi temps réel.
    c:
      en: |-
        Log events written to CloudWatch Logs are not EventBridge events, so an EventBridge rule cannot match and forward them.
      fr: |-
        Les événements écrits dans CloudWatch Logs ne sont pas des événements EventBridge : une règle EventBridge ne peut pas les faire correspondre ni les transmettre.
    d:
      en: |-
        A metric filter produces counts, not the log events themselves, so Splunk would never receive the logs.
      fr: |-
        Un filtre de métriques produit des comptages, et non les événements de journaux eux-mêmes : Splunk ne recevrait jamais les journaux.
references:
  - title: Configure destination settings - Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/create-destination.html
