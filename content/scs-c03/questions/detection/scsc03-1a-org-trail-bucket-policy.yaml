id: scsc03-1a-org-trail-bucket-policy
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's management account (111111111111) created an organization trail named org-trail in us-east-1 for the organization o-a1b2c3d4e5. The trail delivers to the bucket amzn-s3-demo-trail. Log files of the management account arrive, but no log files of the member accounts are delivered. The bucket has the following policy:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "AclCheck",
          "Effect": "Allow",
          "Principal": { "Service": "cloudtrail.amazonaws.com" },
          "Action": "s3:GetBucketAcl",
          "Resource": "arn:aws:s3:::amzn-s3-demo-trail",
          "Condition": { "StringEquals": { "aws:SourceArn": "arn:aws:cloudtrail:us-east-1:111111111111:trail/org-trail" } }
        },
        {
          "Sid": "Write",
          "Effect": "Allow",
          "Principal": { "Service": "cloudtrail.amazonaws.com" },
          "Action": "s3:PutObject",
          "Resource": "arn:aws:s3:::amzn-s3-demo-trail/AWSLogs/111111111111/*",
          "Condition": { "StringEquals": {
            "s3:x-amz-acl": "bucket-owner-full-control",
            "aws:SourceArn": "arn:aws:cloudtrail:us-east-1:111111111111:trail/org-trail" } }
        }
      ]
    }
    ```

    Which change will allow the log files of the member accounts to be delivered?
  fr: |
    Le compte de gestion d'AnyCompany (111111111111) a créé dans us-east-1 un journal de suivi d'organisation nommé org-trail pour l'organisation o-a1b2c3d4e5. Le journal livre dans le compartiment amzn-s3-demo-trail. Les fichiers journaux du compte de gestion arrivent, mais aucun fichier journal des comptes membres n'est livré. Le compartiment a la politique suivante :

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "AclCheck",
          "Effect": "Allow",
          "Principal": { "Service": "cloudtrail.amazonaws.com" },
          "Action": "s3:GetBucketAcl",
          "Resource": "arn:aws:s3:::amzn-s3-demo-trail",
          "Condition": { "StringEquals": { "aws:SourceArn": "arn:aws:cloudtrail:us-east-1:111111111111:trail/org-trail" } }
        },
        {
          "Sid": "Write",
          "Effect": "Allow",
          "Principal": { "Service": "cloudtrail.amazonaws.com" },
          "Action": "s3:PutObject",
          "Resource": "arn:aws:s3:::amzn-s3-demo-trail/AWSLogs/111111111111/*",
          "Condition": { "StringEquals": {
            "s3:x-amz-acl": "bucket-owner-full-control",
            "aws:SourceArn": "arn:aws:cloudtrail:us-east-1:111111111111:trail/org-trail" } }
        }
      ]
    }
    ```

    Quelle modification permettra de livrer les fichiers journaux des comptes membres ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a statement that allows cloudtrail.amazonaws.com to call s3:PutObject on AWSLogs/o-a1b2c3d4e5/*, with the same s3:x-amz-acl and aws:SourceArn conditions.
        fr: |-
          Ajouter une instruction qui autorise cloudtrail.amazonaws.com à appeler s3:PutObject sur AWSLogs/o-a1b2c3d4e5/*, avec les mêmes conditions s3:x-amz-acl et aws:SourceArn.
    - id: b
      text:
        en: |-
          Add one statement for each member account that allows cloudtrail.amazonaws.com to call s3:PutObject on AWSLogs/member-account-ID/*.
        fr: |-
          Ajouter pour chaque compte membre une instruction qui autorise cloudtrail.amazonaws.com à appeler s3:PutObject sur AWSLogs/ID-du-compte-membre/*.
    - id: c
      text:
        en: |-
          Change the aws:SourceArn conditions to list the ARNs of the copies of org-trail that exist in each member account.
        fr: |-
          Modifier les conditions aws:SourceArn pour lister les ARN des copies d'org-trail présentes dans chaque compte membre.
    - id: d
      text:
        en: |-
          Add a statement that allows the root principal of each member account to call s3:PutObject on the whole bucket.
        fr: |-
          Ajouter une instruction qui autorise le principal racine de chaque compte membre à appeler s3:PutObject sur tout le compartiment.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The bucket policy of an organization trail needs three statements: the GetBucketAcl check, a write statement for the management account's own path, AWSLogs/management-account-ID/*, and a write statement for the organization path, AWSLogs/organization-ID/*, where the member accounts' logs are stored. All of them use an aws:SourceArn value that is the ARN of the trail owned by the management account.
    fr: |-
      La politique de compartiment d'un journal de suivi d'organisation exige trois instructions : la vérification GetBucketAcl, une instruction d'écriture pour le chemin propre au compte de gestion, AWSLogs/ID-du-compte-de-gestion/*, et une instruction d'écriture pour le chemin de l'organisation, AWSLogs/ID-de-l-organisation/*, où sont stockés les journaux des comptes membres. Toutes utilisent comme valeur d'aws:SourceArn l'ARN du journal de suivi détenu par le compte de gestion.
  options:
    b:
      en: |-
        Member account logs are written under the organization ID prefix, not directly under AWSLogs/member-account-ID/, so these statements do not match the object keys.
      fr: |-
        Les journaux des comptes membres sont écrits sous le préfixe de l'ID de l'organisation, et non directement sous AWSLogs/ID-du-compte-membre/ : ces instructions ne correspondent pas aux clés des objets.
    c:
      en: |-
        For an organization trail, aws:SourceArn must be the trail ARN owned by the management account and using its account ID.
      fr: |-
        Pour un journal de suivi d'organisation, aws:SourceArn doit être l'ARN du journal détenu par le compte de gestion, avec l'ID de ce compte.
    d:
      en: |-
        The CloudTrail service principal writes the log files, so permissions for member account principals are not used and would grant unnecessary write access.
      fr: |-
        C'est le principal de service CloudTrail qui écrit les fichiers journaux : des autorisations pour les principaux des comptes membres ne servent pas et accorderaient un accès en écriture inutile.
references:
  - title: Amazon S3 bucket policy for CloudTrail - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/create-s3-bucket-policy-for-cloudtrail.html
