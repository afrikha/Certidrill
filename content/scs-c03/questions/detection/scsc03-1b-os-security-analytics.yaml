id: scsc03-1b-os-security-analytics
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany indexes CloudTrail events, VPC Flow Logs, and Windows authentication logs into an Amazon OpenSearch Service domain that runs OpenSearch 2.13. The security team wants to run prepackaged detection rules that are mapped to MITRE ATT&CK techniques against these indexes at a regular interval, generate findings when events match, and send alerts to the on-call channel.

    Which OpenSearch Service feature should the team use?
  fr: |
    AnyCompany indexe des événements CloudTrail, des VPC Flow Logs et des journaux d'authentification Windows dans un domaine Amazon OpenSearch Service qui exécute OpenSearch 2.13. L'équipe de sécurité veut exécuter à intervalle régulier sur ces index des règles de détection prêtes à l'emploi associées aux techniques MITRE ATT&CK, générer des résultats lorsque des événements correspondent et envoyer des alertes au canal d'astreinte.

    Quelle fonctionnalité d'OpenSearch Service l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text:
        en: |-
          Security Analytics detectors that use the prepackaged Sigma rules for each log type, with alerts configured on the detectors.
        fr: |-
          Des détecteurs Security Analytics qui utilisent les règles Sigma prêtes à l'emploi pour chaque type de journal, avec des alertes configurées sur les détecteurs.
    - id: b
      text:
        en: |-
          Anomaly detection detectors that learn the normal volume of each index and alert on outliers.
        fr: |-
          Des détecteurs de détection d'anomalies (anomaly detection) qui apprennent le volume normal de chaque index et alertent sur les valeurs aberrantes.
    - id: c
      text:
        en: |-
          Index State Management policies that move matching documents to a separate alert index.
        fr: |-
          Des politiques Index State Management qui déplacent les documents correspondants vers un index d'alertes distinct.
    - id: d
      text:
        en: |-
          Fine-grained access control with a role mapping that gives the on-call team read access to the indexes.
        fr: |-
          Le contrôle d'accès précis (fine-grained access control) avec un mappage de rôle qui donne à l'équipe d'astreinte un accès en lecture aux index.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Security Analytics, available on domains that run OpenSearch 2.5 or later, uses detectors that evaluate prepackaged Sigma rules and custom rules against a log type at a set interval. Many rules map to MITRE ATT&CK, matches produce findings, and detectors can trigger alerts with a custom message.
    fr: |-
      Security Analytics, disponible sur les domaines qui exécutent OpenSearch 2.5 ou version ultérieure, utilise des détecteurs qui évaluent des règles Sigma prêtes à l'emploi et des règles personnalisées sur un type de journal à intervalle défini. De nombreuses règles sont associées à MITRE ATT&CK, les correspondances produisent des résultats, et les détecteurs peuvent déclencher des alertes avec un message personnalisé.
  options:
    b:
      en: |-
        Anomaly detection finds statistical outliers in numeric data; it does not evaluate rule logic mapped to attack techniques.
      fr: |-
        La détection d'anomalies repère des valeurs statistiques aberrantes dans des données numériques ; elle n'évalue pas de logique de règles associée à des techniques d'attaque.
    c:
      en: |-
        Index State Management automates index lifecycle actions such as rollover and deletion; it does not run detection rules.
      fr: |-
        Index State Management automatise des actions de cycle de vie des index comme le basculement (rollover) et la suppression ; il n'exécute pas de règles de détection.
    d:
      en: |-
        Fine-grained access control decides who can read data; it does not detect threats or send alerts.
      fr: |-
        Le contrôle d'accès précis détermine qui peut lire les données ; il ne détecte pas les menaces et n'envoie pas d'alertes.
references:
  - title: Security Analytics for Amazon OpenSearch Service - Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/security-analytics.html
