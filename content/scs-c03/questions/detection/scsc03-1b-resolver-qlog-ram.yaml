id: scsc03-1b-resolver-qlog-ram
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 60 accounts in AWS Organizations, each with its own VPCs in eu-west-1. The security team wants the DNS queries of all these VPCs to be logged to a single S3 bucket in the Security Tooling account. Workload teams must not be able to change or delete the logging configuration. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 60 comptes dans AWS Organizations, chacun avec ses propres VPC dans eu-west-1. L'équipe de sécurité veut que les requêtes DNS de tous ces VPC soient journalisées dans un seul compartiment S3 du compte Security Tooling. Les équipes de charge de travail ne doivent pas pouvoir modifier ni supprimer la configuration de journalisation. La solution doit entraîner le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          In each account, create a Resolver query logging configuration that delivers to a local log group, and add a subscription filter that forwards the events to the Security Tooling account.
        fr: |-
          Dans chaque compte, créer une configuration de journalisation des requêtes Resolver qui livre dans un groupe de journaux local, et ajouter un filtre d'abonnement qui transfère les événements vers le compte Security Tooling.
    - id: b
      text:
        en: |-
          Create VPC flow logs on every VPC that capture UDP and TCP port 53 traffic, delivered to the S3 bucket in the Security Tooling account.
        fr: |-
          Créer sur chaque VPC des journaux de flux qui capturent le trafic UDP et TCP sur le port 53, livrés dans le compartiment S3 du compte Security Tooling.
    - id: c
      text:
        en: |-
          Enable query logging on a Route 53 public hosted zone in the Security Tooling account, and point the VPCs' DHCP options sets to it.
        fr: |-
          Activer la journalisation des requêtes sur une zone hébergée publique Route 53 du compte Security Tooling, et y faire pointer les jeux d'options DHCP des VPC.
    - id: d
      text:
        en: |-
          In the Security Tooling account, create one Resolver query logging configuration that delivers to the bucket, share it with the organization through AWS RAM, and associate the VPCs of each account with it.
        fr: |-
          Dans le compte Security Tooling, créer une configuration de journalisation des requêtes Resolver qui livre dans le compartiment, la partager avec l'organisation par AWS RAM, et y associer les VPC de chaque compte.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A Resolver query logging configuration can be shared through AWS RAM. Accounts it is shared with can associate their own VPCs with it, but they cannot change or delete it; only the owner manages the configuration and its destination.
    fr: |-
      Une configuration de journalisation des requêtes Resolver peut être partagée par AWS RAM. Les comptes avec lesquels elle est partagée peuvent y associer leurs propres VPC, mais ils ne peuvent ni la modifier ni la supprimer ; seul le propriétaire gère la configuration et sa destination.
  options:
    a:
      en: |-
        Each account would own a configuration that its teams can change or delete, and 60 configurations and filters add overhead.
      fr: |-
        Chaque compte posséderait une configuration que ses équipes peuvent modifier ou supprimer, et 60 configurations et filtres ajoutent de la charge.
    b:
      en: |-
        Flow logs do not capture traffic to the Amazon DNS server and never contain the queried domain names.
      fr: |-
        Les journaux de flux ne capturent pas le trafic vers le serveur DNS Amazon et ne contiennent jamais les noms de domaine interrogés.
    c:
      en: |-
        A hosted zone is not a resolver; its query logs show only queries for that zone's domain, not all the lookups of the VPCs.
      fr: |-
        Une zone hébergée n'est pas un résolveur ; ses journaux de requêtes ne montrent que les requêtes pour le domaine de cette zone, et non toutes les résolutions des VPC.
references:
  - title: Sharing Resolver query logging configurations with other AWS accounts - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/query-logging-configurations-managing-sharing.html
  - title: Resolver query logging - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs.html
