id: scsc03-1b-sh-automation-suppress
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses Security Hub CSPM with an administrator account in us-east-1, its only Region. Three sandbox accounts generate many failed findings for a control that matters only in production. Auditors require that Security Hub CSPM keep evaluating the control in all accounts, but analysts must stop seeing the sandbox findings for that control in their default views of new findings. The change must apply automatically to new findings.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany utilise Security Hub CSPM avec un compte administrateur dans us-east-1, sa seule Région. Trois comptes sandbox génèrent de nombreux résultats en échec pour un contrôle qui ne compte qu'en production. Les auditeurs exigent que Security Hub CSPM continue d'évaluer le contrôle dans tous les comptes, mais les analystes ne doivent plus voir les résultats sandbox de ce contrôle dans leurs vues par défaut des nouveaux résultats. La modification doit s'appliquer automatiquement aux nouveaux résultats.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Use a central configuration policy to disable the control in the three sandbox accounts.
        fr: |-
          Utiliser une politique de configuration centrale pour désactiver le contrôle dans les trois comptes sandbox.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule for imported findings that invokes an AWS Lambda function, which calls BatchUpdateFindings to suppress the sandbox findings.
        fr: |-
          Créer une règle Amazon EventBridge pour les résultats importés qui appelle une fonction AWS Lambda, laquelle appelle BatchUpdateFindings pour passer les résultats sandbox à l'état SUPPRESSED.
    - id: c
      text:
        en: |-
          In the administrator account, create an automation rule that matches the three account IDs and the control's findings, with an action that sets the workflow status to SUPPRESSED.
        fr: |-
          Dans le compte administrateur, créer une règle d'automatisation qui correspond aux trois ID de compte et aux résultats du contrôle, avec une action qui définit l'état du flux de travail sur SUPPRESSED.
    - id: d
      text:
        en: |-
          Create a custom insight that excludes the three account IDs, and ask the analysts to use it instead of the findings page.
        fr: |-
          Créer un aperçu personnalisé qui exclut les trois ID de compte, et demander aux analystes de l'utiliser à la place de la page des résultats.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Automation rules are created in the administrator account, apply to matching findings of the administrator and member accounts in their Region, and update fields such as Workflow as findings are ingested. The control keeps running and producing findings, while SUPPRESSED removes them from the default views of new findings.
    fr: |-
      Les règles d'automatisation se créent dans le compte administrateur, s'appliquent aux résultats correspondants du compte administrateur et des comptes membres de leur Région, et mettent à jour des champs comme Workflow lors de l'ingestion des résultats. Le contrôle continue de s'exécuter et de produire des résultats, tandis que SUPPRESSED les retire des vues par défaut des nouveaux résultats.
  options:
    a:
      en: |-
        Disabling the control stops its checks in those accounts, but the auditors require that the control keep being evaluated.
      fr: |-
        Désactiver le contrôle arrête ses vérifications dans ces comptes, alors que les auditeurs exigent que le contrôle continue d'être évalué.
    b:
      en: |-
        This works, but a rule, a function, and its code must be built and maintained, while an automation rule does the same update natively.
      fr: |-
        Cela fonctionne, mais il faut créer et maintenir une règle, une fonction et son code, alors qu'une règle d'automatisation fait la même mise à jour nativement.
    d:
      en: |-
        An insight only filters a view; the findings stay NEW in every other view, and analysts must remember to use the insight.
      fr: |-
        Un aperçu ne fait que filtrer une vue ; les résultats restent NEW dans toutes les autres vues, et les analystes doivent penser à utiliser l'aperçu.
references:
  - title: Understanding automation rules in Security Hub CSPM - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/automation-rules.html
