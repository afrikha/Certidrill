id: scsc03-1b-tgw-flow-logs
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's Network account owns a transit gateway that is shared through AWS RAM and has 30 VPC attachments from 25 workload accounts. The network security team must record every flow that crosses the transit gateway, with the source and destination VPC IDs and the attachment IDs, to detect unexpected east-west traffic. The team cannot change the configuration of the workload accounts.

    Which solution will meet these requirements?
  fr: |
    Le compte Network d'AnyCompany possède une passerelle de transit partagée par AWS RAM, qui compte 30 pièces jointes de VPC provenant de 25 comptes de charge de travail. L'équipe de sécurité réseau doit enregistrer chaque flux qui traverse la passerelle de transit, avec les ID des VPC source et de destination et les ID des pièces jointes, pour détecter un trafic est-ouest (east-west) inattendu. L'équipe ne peut pas modifier la configuration des comptes de charge de travail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create VPC flow logs on each attached VPC with a custom format that includes the vpc-id and interface-id fields.
        fr: |-
          Créer des journaux de flux VPC sur chaque VPC attaché avec un format personnalisé qui inclut les champs vpc-id et interface-id.
    - id: b
      text:
        en: |-
          Configure VPC Traffic Mirroring on the transit gateway attachments, with a monitoring appliance in the Network account as the target.
        fr: |-
          Configurer la mise en miroir du trafic VPC (Traffic Mirroring) sur les pièces jointes de la passerelle de transit, avec un équipement de surveillance du compte Network comme cible.
    - id: c
      text:
        en: |-
          Enable CloudTrail Insights on the organization trail to detect unusual API activity on the transit gateway.
        fr: |-
          Activer CloudTrail Insights sur le journal de suivi d'organisation pour détecter une activité d'API inhabituelle sur la passerelle de transit.
    - id: d
      text:
        en: |-
          In the Network account, create a transit gateway flow log with the tgw-attachment-id, tgw-src-vpc-id, and tgw-dst-vpc-id fields.
        fr: |-
          Dans le compte Network, créer un journal de flux de passerelle de transit avec les champs tgw-attachment-id, tgw-src-vpc-id et tgw-dst-vpc-id.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Transit gateway flow logs capture the traffic that goes through the transit gateway, per attachment, and only the transit gateway owner can create them. Their fields include tgw-attachment-id, tgw-src-vpc-id, and tgw-dst-vpc-id, plus the account IDs of the source and destination VPCs, so no change is needed in the workload accounts.
    fr: |-
      Les journaux de flux de passerelle de transit capturent le trafic qui traverse la passerelle, par pièce jointe, et seul le propriétaire de la passerelle peut les créer. Leurs champs incluent tgw-attachment-id, tgw-src-vpc-id et tgw-dst-vpc-id, ainsi que les ID de compte des VPC source et de destination : aucune modification n'est nécessaire dans les comptes de charge de travail.
  options:
    a:
      en: |-
        VPC flow logs must be created by each VPC owner, which requires changes in the 25 workload accounts, and they do not show transit gateway attachment IDs.
      fr: |-
        Les journaux de flux VPC doivent être créés par chaque propriétaire de VPC, ce qui exige des modifications dans les 25 comptes de charge de travail, et ils n'affichent pas les ID de pièces jointes de la passerelle de transit.
    b:
      en: |-
        Traffic Mirroring copies packets from network interfaces of instances, not from transit gateway attachments, and it is a packet capture tool rather than a flow log.
      fr: |-
        La mise en miroir du trafic copie les paquets des interfaces réseau des instances, et non des pièces jointes de passerelle de transit, et c'est un outil de capture de paquets plutôt qu'un journal de flux.
    c:
      en: |-
        CloudTrail and its Insights events cover API calls on the transit gateway, not the network flows that cross it.
      fr: |-
        CloudTrail et ses événements Insights portent sur les appels d'API sur la passerelle de transit, et non sur les flux réseau qui la traversent.
references:
  - title: AWS Transit Gateway Flow Logs - Amazon VPC
    url: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-flow-logs.html
