id: scsc03-1a-r53-metric-region
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a public HTTPS application in the eu-west-1 Region. The operations team created an Amazon Route 53 health check of the endpoint type that monitors the application's public domain name. The security team wants an email through Amazon SNS when the health check becomes unhealthy, because a failure can indicate a denial of service attack. An engineer signed in to the CloudWatch console in eu-west-1 to create the alarm but cannot find any Route 53 health check metric.

    What should the engineer do to receive the notifications?
  fr: |
    AnyCompany exécute une application HTTPS publique dans la Région eu-west-1. L'équipe d'exploitation a créé une vérification de l'état Amazon Route 53 de type point de terminaison qui surveille le nom de domaine public de l'application. L'équipe de sécurité veut recevoir un e-mail au moyen d'Amazon SNS lorsque la vérification de l'état devient défaillante, car une panne peut indiquer une attaque par déni de service. Un ingénieur s'est connecté à la console CloudWatch dans eu-west-1 pour créer l'alarme, mais il ne trouve aucune métrique de vérification de l'état Route 53.

    Que doit faire l'ingénieur pour recevoir les notifications ?
body:
  options:
    - id: a
      text:
        en: |-
          Edit the health check to enable latency measurements so that Route 53 publishes its metrics to the Region of the endpoint.
        fr: |-
          Modifier la vérification de l'état pour activer les mesures de latence afin que Route 53 publie ses métriques dans la Région du point de terminaison.
    - id: b
      text:
        en: |-
          Create a calculated health check in eu-west-1 that monitors the endpoint health check, and create the alarm on the calculated health check.
        fr: |-
          Créer dans eu-west-1 une vérification de l'état calculée qui surveille la vérification de l'état du point de terminaison, et créer l'alarme sur la vérification calculée.
    - id: c
      text:
        en: |-
          Configure CloudWatch cross-account cross-Region dashboards so that the eu-west-1 console can read the health check metrics.
        fr: |-
          Configurer les tableaux de bord CloudWatch inter-comptes et inter-Régions afin que la console d'eu-west-1 puisse lire les métriques de la vérification de l'état.
    - id: d
      text:
        en: |-
          Create the alarm on the health check status metric in the US East (N. Virginia) Region, with an SNS topic in that Region as the alarm action.
        fr: |-
          Créer l'alarme sur la métrique d'état de la vérification dans la Région USA Est (Virginie du Nord), avec comme action d'alarme une rubrique SNS de cette Région.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Route 53 publishes the metrics of its public health checks to CloudWatch only in US East (N. Virginia), whatever the Region of the monitored endpoint. The alarm must therefore be created in us-east-1, for example with a condition of Minimum less than 1 on the health check status, and its SNS action must use a topic in the same Region as the alarm.
    fr: |-
      Route 53 publie les métriques de ses vérifications de l'état publiques dans CloudWatch uniquement dans USA Est (Virginie du Nord), quelle que soit la Région du point de terminaison surveillé. L'alarme doit donc être créée dans us-east-1, par exemple avec une condition Minimum inférieur à 1 sur l'état de la vérification, et son action SNS doit utiliser une rubrique de la même Région que l'alarme.
  options:
    a:
      en: |-
        Latency measurements add latency graphs to the health check; they do not change the Region where Route 53 metrics are published.
      fr: |-
        Les mesures de latence ajoutent des graphiques de latence à la vérification de l'état ; elles ne changent pas la Région de publication des métriques Route 53.
    b:
      en: |-
        Health checks are global resources whose metrics are also published only in us-east-1, so a calculated health check does not make metrics appear in eu-west-1.
      fr: |-
        Les vérifications de l'état sont des ressources globales dont les métriques sont aussi publiées uniquement dans us-east-1 : une vérification calculée ne fait pas apparaître de métriques dans eu-west-1.
    c:
      en: |-
        A cross-Region dashboard can display metrics, but the alarm itself must be created in the Region where the metric exists.
      fr: |-
        Un tableau de bord inter-Régions peut afficher des métriques, mais l'alarme elle-même doit être créée dans la Région où la métrique existe.
references:
  - title: Monitoring health checks using CloudWatch - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/monitoring-health-checks.html
