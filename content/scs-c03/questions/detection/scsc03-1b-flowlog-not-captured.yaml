id: scsc03-1b-flowlog-not-captured
objective: "1.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany suspects that a compromised EC2 instance is stealing its role credentials and tunneling data out through DNS. The instance uses the Amazon-provided DNS server of its VPC. A flow log that captures all traffic is already enabled on the VPC, and the security team wants to know which traffic of the instance it will not see so that it can add other log sources.

    Which two types of traffic are NOT captured by VPC Flow Logs? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany soupçonne qu'une instance EC2 compromise vole les informations d'identification de son rôle et exfiltre des données par des tunnels DNS. L'instance utilise le serveur DNS fourni par Amazon de son VPC. Un journal de flux qui capture tout le trafic est déjà activé sur le VPC, et l'équipe de sécurité veut savoir quel trafic de l'instance il ne verra pas, afin d'ajouter d'autres sources de journaux.

    Quels sont les deux types de trafic qui ne sont PAS capturés par VPC Flow Logs ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Traffic between the instance and the instance metadata service at 169.254.169.254"
        fr: "Le trafic entre l'instance et le service de métadonnées d'instance à 169.254.169.254"
    - id: b
      text:
        en: "Connections from the instance that a security group rejects"
        fr: "Les connexions de l'instance qu'un groupe de sécurité rejette"
    - id: c
      text:
        en: "DNS queries from the instance to the Amazon-provided DNS server"
        fr: "Les requêtes DNS de l'instance vers le serveur DNS fourni par Amazon"
    - id: d
      text:
        en: "Traffic from the instance to the internet through a NAT gateway"
        fr: "Le trafic de l'instance vers internet par une passerelle NAT"
    - id: e
      text:
        en: "DNS queries from the instance to a self-managed DNS server on another EC2 instance"
        fr: "Les requêtes DNS de l'instance vers un serveur DNS autogéré sur une autre instance EC2"
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      VPC Flow Logs do not capture traffic to and from 169.254.169.254 (instance metadata) or traffic to the Amazon DNS server. To investigate these paths, the team needs other sources, such as Route 53 Resolver query logs for the DNS lookups and CloudTrail for the use of the role credentials.
    fr: |-
      VPC Flow Logs ne capture pas le trafic vers et depuis 169.254.169.254 (métadonnées d'instance) ni le trafic vers le serveur DNS Amazon. Pour investiguer ces chemins, l'équipe a besoin d'autres sources, comme les journaux de requêtes Route 53 Resolver pour les résolutions DNS et CloudTrail pour l'utilisation des informations d'identification du rôle.
  options:
    b:
      en: |-
        Flow logs record rejected traffic with the REJECT action when they capture all traffic or rejected traffic.
      fr: |-
        Les journaux de flux enregistrent le trafic rejeté avec l'action REJECT lorsqu'ils capturent tout le trafic ou le trafic rejeté.
    d:
      en: |-
        Traffic through a NAT gateway is captured, on the instance's interface and on the NAT gateway's interface.
      fr: |-
        Le trafic qui traverse une passerelle NAT est capturé, sur l'interface de l'instance et sur celle de la passerelle NAT.
    e:
      en: |-
        Traffic to your own DNS server is logged; only traffic to the Amazon DNS server is excluded.
      fr: |-
        Le trafic vers votre propre serveur DNS est journalisé ; seul le trafic vers le serveur DNS Amazon est exclu.
references:
  - title: Flow log limitations - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-limitations.html
