id: scsc03-1b-nfw-flow-alert-logs
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany inspects all egress traffic of its workload VPCs with AWS Network Firewall in a central inspection VPC. The firewall policy forwards all traffic to the stateful engine, and stateful rules with the ALERT action flag suspicious egress destinations. The security team needs two records in Amazon S3: a record of every network flow that the stateful engine processes, including allowed traffic, and a separate record of every packet that matches one of these ALERT rules. The firewall does not use TLS inspection.

    Which solution will meet these requirements?
  fr: |
    AnyCompany inspecte tout le trafic sortant de ses VPC de charge de travail avec AWS Network Firewall dans un VPC d'inspection central. La politique de pare-feu transfère tout le trafic au moteur avec état, et des règles avec état dotées de l'action ALERT signalent les destinations sortantes suspectes. L'équipe de sécurité a besoin de deux enregistrements dans Amazon S3 : un enregistrement de chaque flux réseau traité par le moteur avec état, y compris le trafic autorisé, et un enregistrement distinct de chaque paquet qui correspond à l'une de ces règles ALERT. Le pare-feu n'utilise pas l'inspection TLS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable the alert log type in the firewall's logging configuration with an S3 destination.
        fr: |-
          Activer le type de journal d'alerte dans la configuration de journalisation du pare-feu avec une destination S3.
    - id: b
      text:
        en: |-
          Enable the TLS log type in the firewall's logging configuration, and create VPC flow logs on the firewall endpoints' network interfaces.
        fr: |-
          Activer le type de journal TLS dans la configuration de journalisation du pare-feu, et créer des journaux de flux VPC sur les interfaces réseau des points de terminaison du pare-feu.
    - id: c
      text:
        en: |-
          Enable the flow log type and the alert log type in the firewall's logging configuration, each with an S3 destination.
        fr: |-
          Activer le type de journal de flux et le type de journal d'alerte dans la configuration de journalisation du pare-feu, chacun avec une destination S3.
    - id: d
      text:
        en: |-
          Enable the flow log type in the firewall's logging configuration, and publish the firewall's CloudWatch metrics to S3.
        fr: |-
          Activer le type de journal de flux dans la configuration de journalisation du pare-feu, et publier les métriques CloudWatch du pare-feu dans S3.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Network Firewall logs the stateful engine with three log types: flow logs for standard network traffic flows, alert logs for traffic that matches stateful rules whose action sends an alert, such as ALERT, and TLS logs for TLS inspection events. Each log type can use the same or a different destination, so enabling flow and alert logs gives both records.
    fr: |-
      Network Firewall journalise le moteur avec état avec trois types de journaux : les journaux de flux pour les flux réseau standard, les journaux d'alerte pour le trafic qui correspond à des règles avec état dont l'action envoie une alerte, comme ALERT, et les journaux TLS pour les événements d'inspection TLS. Chaque type peut utiliser la même destination ou une destination différente : activer les journaux de flux et d'alerte fournit les deux enregistrements.
  options:
    a:
      en: |-
        Alert logs contain only the traffic that matches alerting rules, not every flow, so the first record is missing.
      fr: |-
        Les journaux d'alerte ne contiennent que le trafic qui correspond aux règles d'alerte, et non chaque flux : le premier enregistrement manque.
    b:
      en: |-
        TLS logs require TLS inspection, which the firewall does not use, and VPC flow logs do not record which rules matched.
      fr: |-
        Les journaux TLS exigent l'inspection TLS, que le pare-feu n'utilise pas, et les journaux de flux VPC n'indiquent pas quelles règles ont correspondu.
    d:
      en: |-
        Metrics are aggregated counts; they do not record each packet that matched an ALERT rule.
      fr: |-
        Les métriques sont des comptages agrégés ; elles n'enregistrent pas chaque paquet qui a correspondu à une règle ALERT.
references:
  - title: Logging network traffic from AWS Network Firewall - AWS Network Firewall
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/firewall-logging.html
