id: scsc03-1a-config-org-aggregator
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 120 accounts in AWS Organizations, and AWS Config recording is enabled in every account and Region. The compliance team needs a single read-only view of the configuration and the Config rule compliance of resources across all accounts and Regions, from a delegated administrator account. Accounts that join the organization later must be included automatically.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany dispose de 120 comptes dans AWS Organizations, et l'enregistrement AWS Config est activé dans chaque compte et chaque Région. L'équipe de conformité a besoin d'une vue unique en lecture seule de la configuration et de la conformité aux règles Config des ressources de tous les comptes et de toutes les Régions, à partir d'un compte administrateur délégué. Les comptes qui rejoindront l'organisation plus tard doivent être inclus automatiquement.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an aggregator that lists the 120 account IDs as individual source accounts, and authorize the aggregator account in each source account and Region.
        fr: |-
          Créer un agrégateur qui liste les 120 ID de compte comme comptes sources individuels, et autoriser le compte agrégateur dans chaque compte source et chaque Région.
    - id: b
      text:
        en: |-
          Deploy an organization conformance pack from the delegated administrator account, and review the compliance of the pack in each account.
        fr: |-
          Déployer un pack de conformité d'organisation à partir du compte administrateur délégué, et examiner la conformité du pack dans chaque compte.
    - id: c
      text:
        en: |-
          Create an AWS Config aggregator for the organization in the delegated administrator account, with all AWS Regions as source Regions.
        fr: |-
          Créer un agrégateur AWS Config pour l'organisation dans le compte administrateur délégué, avec toutes les Régions AWS comme Régions sources.
    - id: d
      text:
        en: |-
          Configure each account to deliver Config configuration snapshots to a central S3 bucket, and query the snapshots with Amazon Athena.
        fr: |-
          Configurer chaque compte pour livrer les instantanés de configuration Config dans un compartiment S3 central, et interroger les instantanés avec Amazon Athena.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An organization aggregator collects the configuration and compliance data recorded by AWS Config from all member accounts and the selected Regions into one account. Authorization is not required for source accounts that belong to the organization, and new accounts are included automatically. Aggregators provide a read-only view and add no cost.
    fr: |-
      Un agrégateur d'organisation collecte dans un seul compte les données de configuration et de conformité enregistrées par AWS Config dans tous les comptes membres et les Régions sélectionnées. L'autorisation n'est pas nécessaire pour les comptes sources qui appartiennent à l'organisation, et les nouveaux comptes sont inclus automatiquement. Les agrégateurs offrent une vue en lecture seule et n'entraînent aucun coût.
  options:
    a:
      en: |-
        Individual source accounts must be listed and authorized one by one, and new accounts are not added automatically.
      fr: |-
        Les comptes sources individuels doivent être listés et autorisés un par un, et les nouveaux comptes ne sont pas ajoutés automatiquement.
    b:
      en: |-
        A conformance pack deploys rules; it does not give one view of the configuration and compliance of all accounts and Regions.
      fr: |-
        Un pack de conformité déploie des règles ; il ne donne pas de vue unique de la configuration et de la conformité de tous les comptes et de toutes les Régions.
    d:
      en: |-
        Snapshots are periodic files that need a custom query layer to build and maintain, which adds operational overhead compared with an aggregator.
      fr: |-
        Les instantanés sont des fichiers périodiques qui exigent de construire et de maintenir une couche de requêtes personnalisée, ce qui ajoute une charge opérationnelle par rapport à un agrégateur.
references:
  - title: Multi-Account Multi-Region Data Aggregation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html
