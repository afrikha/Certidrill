id: scsc03-1b-s3-access-logs-target
objective: "1.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany enabled S3 server access logging on the bucket anycompany-data with the bucket anycompany-access-logs as the destination. Both buckets are in the same account and Region. After two days, no log objects have been delivered. The destination bucket has the following configuration:

    - S3 Versioning enabled
    - Default encryption with SSE-KMS and a customer managed key
    - S3 Object Lock enabled with a default retention period of 365 days
    - S3 Object Ownership set to bucket owner enforced, with a bucket policy that allows logging.s3.amazonaws.com to call s3:PutObject with aws:SourceArn and aws:SourceAccount conditions
    - All four S3 Block Public Access settings enabled

    Which two settings of the destination bucket prevent the delivery of the server access logs? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany a activé la journalisation des accès au serveur S3 sur le compartiment anycompany-data avec le compartiment anycompany-access-logs comme destination. Les deux compartiments sont dans le même compte et la même Région. Après deux jours, aucun objet journal n'a été livré. Le compartiment de destination a la configuration suivante :

    - S3 Versioning activé
    - Chiffrement par défaut SSE-KMS avec une clé gérée par le client
    - S3 Object Lock activé avec une période de conservation par défaut de 365 jours
    - S3 Object Ownership défini sur bucket owner enforced, avec une politique de compartiment qui autorise logging.s3.amazonaws.com à appeler s3:PutObject avec des conditions aws:SourceArn et aws:SourceAccount
    - Les quatre paramètres S3 Block Public Access activés

    Quels sont les deux paramètres du compartiment de destination qui empêchent la livraison des journaux d'accès au serveur ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "S3 Versioning enabled"
        fr: "S3 Versioning activé"
    - id: b
      text:
        en: "S3 Object Ownership set to bucket owner enforced with the bucket policy"
        fr: "S3 Object Ownership défini sur bucket owner enforced avec la politique de compartiment"
    - id: c
      text:
        en: "Default encryption with SSE-KMS"
        fr: "Chiffrement par défaut SSE-KMS"
    - id: d
      text:
        en: "All four S3 Block Public Access settings enabled"
        fr: "Les quatre paramètres S3 Block Public Access activés"
    - id: e
      text:
        en: "S3 Object Lock with a default retention period"
        fr: "S3 Object Lock avec une période de conservation par défaut"
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      The destination bucket for server access logs must use SSE-S3 default encryption; with SSE-KMS default encryption, granting s3:PutObject is not enough. Buckets with S3 Object Lock enabled cannot be destinations, and the destination must not have a default retention period.
    fr: |-
      Le compartiment de destination des journaux d'accès au serveur doit utiliser le chiffrement par défaut SSE-S3 ; avec un chiffrement par défaut SSE-KMS, accorder s3:PutObject ne suffit pas. Les compartiments avec S3 Object Lock activé ne peuvent pas être des destinations, et la destination ne doit pas avoir de période de conservation par défaut.
  options:
    a:
      en: |-
        Versioning is not a restriction for log destinations; only Object Lock and its default retention are.
      fr: |-
        Le versionnage n'est pas une restriction pour les destinations de journaux ; seuls Object Lock et sa conservation par défaut le sont.
    b:
      en: |-
        With bucket owner enforced, ACLs are disabled and a bucket policy for logging.s3.amazonaws.com is the required, recommended method, which is already in place.
      fr: |-
        Avec bucket owner enforced, les ACL sont désactivées et une politique de compartiment pour logging.s3.amazonaws.com est la méthode requise et recommandée, déjà en place.
    d:
      en: |-
        Block Public Access blocks public access; the logging service principal is granted access by a bucket policy that is not public.
      fr: |-
        Block Public Access bloque l'accès public ; le principal de service de journalisation reçoit l'accès par une politique de compartiment qui n'est pas publique.
references:
  - title: Enabling Amazon S3 server access logging - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/enable-server-access-logging.html
