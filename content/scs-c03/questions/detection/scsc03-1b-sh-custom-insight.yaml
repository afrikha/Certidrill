id: scsc03-1b-sh-custom-insight
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany uses Security Hub CSPM with a delegated administrator account that receives the findings of 80 member accounts. The CISO wants a view in the Security Hub CSPM console that ranks the member accounts by their number of CRITICAL findings from Amazon GuardDuty.

    What should the security team create in the administrator account?
  fr: |
    AnyCompany utilise Security Hub CSPM avec un compte administrateur délégué qui reçoit les résultats de 80 comptes membres. Le RSSI veut une vue dans la console Security Hub CSPM qui classe les comptes membres selon leur nombre de résultats CRITICAL provenant d'Amazon GuardDuty.

    Que doit créer l'équipe de sécurité dans le compte administrateur ?
body:
  options:
    - id: a
      text:
        en: |-
          An automation rule with the criteria ProductName is GuardDuty and SeverityLabel is CRITICAL.
        fr: |-
          Une règle d'automatisation avec les critères ProductName est GuardDuty et SeverityLabel est CRITICAL.
    - id: b
      text:
        en: |-
          A custom insight with the filters ProductName is GuardDuty and SeverityLabel is CRITICAL, grouped by AwsAccountId.
        fr: |-
          Un aperçu personnalisé (custom insight) avec les filtres ProductName est GuardDuty et SeverityLabel est CRITICAL, regroupé par AwsAccountId.
    - id: c
      text:
        en: |-
          A custom action that sends GuardDuty findings with the CRITICAL severity to Amazon EventBridge.
        fr: |-
          Une action personnalisée qui envoie à Amazon EventBridge les résultats GuardDuty de gravité CRITICAL.
    - id: d
      text:
        en: |-
          An AWS Config aggregator that collects the compliance status of the member accounts.
        fr: |-
          Un agrégateur AWS Config qui collecte l'état de conformité des comptes membres.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A custom insight combines optional filters, which all must match, with one grouping attribute that defines the rows of the result list. Filtering on the product and severity and grouping by AwsAccountId shows the number of matching findings for each account.
    fr: |-
      Un aperçu personnalisé combine des filtres facultatifs, qui doivent tous correspondre, et un seul attribut de regroupement qui définit les lignes de la liste de résultats. Filtrer sur le produit et la gravité et regrouper par AwsAccountId affiche le nombre de résultats correspondants pour chaque compte.
  options:
    a:
      en: |-
        Automation rules update fields of matching findings as they are ingested; they do not produce a grouped view.
      fr: |-
        Les règles d'automatisation mettent à jour les champs des résultats correspondants lors de leur ingestion ; elles ne produisent pas de vue regroupée.
    c:
      en: |-
        A custom action sends findings that a user selects to EventBridge; it does not rank accounts in the console.
      fr: |-
        Une action personnalisée envoie à EventBridge des résultats sélectionnés par un utilisateur ; elle ne classe pas les comptes dans la console.
    d:
      en: |-
        An AWS Config aggregator reports Config rule compliance; it does not count GuardDuty findings.
      fr: |-
        Un agrégateur AWS Config indique la conformité aux règles Config ; il ne compte pas les résultats GuardDuty.
references:
  - title: Understanding custom insights in Security Hub CSPM - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-custom-insights.html
