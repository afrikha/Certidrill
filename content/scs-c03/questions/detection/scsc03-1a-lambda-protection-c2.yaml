id: scsc03-1a-lambda-protection-c2
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 300 AWS Lambda functions in one account. About half of the functions are attached to a VPC, and the others use the default Lambda networking. Amazon GuardDuty is enabled with its foundational data sources. A penetration test showed that a vulnerable dependency could let an attacker make a function contact a command-and-control server. The security team must detect this behavior for every function, without changing function code or deploying additional logging infrastructure.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 300 fonctions AWS Lambda dans un compte. Environ la moitié des fonctions sont attachées à un VPC, et les autres utilisent la mise en réseau Lambda par défaut. Amazon GuardDuty est activé avec ses sources de données fondamentales. Un test d'intrusion a montré qu'une dépendance vulnérable pourrait permettre à un attaquant de faire contacter un serveur de commande et de contrôle par une fonction. L'équipe de sécurité doit détecter ce comportement pour chaque fonction, sans modifier le code des fonctions ni déployer d'infrastructure de journalisation supplémentaire.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable GuardDuty Lambda Protection in the account so that GuardDuty analyzes the network activity logs of all the functions.
        fr: |-
          Activer GuardDuty Lambda Protection dans le compte afin que GuardDuty analyse les journaux d'activité réseau de toutes les fonctions.
    - id: b
      text:
        en: |-
          Enable VPC Flow Logs on the subnets that the VPC-attached functions use, and let the GuardDuty foundational data sources analyze them.
        fr: |-
          Activer VPC Flow Logs sur les sous-réseaux utilisés par les fonctions attachées au VPC, et laisser les sources de données fondamentales de GuardDuty les analyser.
    - id: c
      text:
        en: |-
          Enable Amazon Inspector Lambda code scanning so that the functions and layers are rescanned when a new vulnerability is published.
        fr: |-
          Activer l'analyse du code Lambda d'Amazon Inspector afin que les fonctions et les couches soient analysées à nouveau lorsqu'une nouvelle vulnérabilité est publiée.
    - id: d
      text:
        en: |-
          Add CloudTrail data events for AWS::Lambda::Function to the trail, and create an alarm on unusual Invoke activity.
        fr: |-
          Ajouter au journal de suivi les événements de données CloudTrail pour AWS::Lambda::Function, et créer une alarme sur une activité Invoke inhabituelle.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Lambda Protection analyzes Lambda network activity logs, including flow logs from all functions in the account, whether or not they use VPC networking, and generates findings when traffic suggests malicious code in a function. It is turned on as a GuardDuty protection plan; no agent, code change, or flow log configuration is needed.
    fr: |-
      Lambda Protection analyse les journaux d'activité réseau de Lambda, y compris les journaux de flux de toutes les fonctions du compte, qu'elles utilisent ou non la mise en réseau VPC, et génère des résultats lorsque le trafic suggère la présence de code malveillant dans une fonction. Elle s'active comme un plan de protection GuardDuty : aucun agent, aucune modification du code et aucune configuration de journaux de flux ne sont nécessaires.
  options:
    b:
      en: |-
        This covers only the VPC-attached functions and requires flow log configuration, which the company wants to avoid; Lambda Protection does not need VPC Flow Logs on the Lambda network interfaces.
      fr: |-
        Cette option ne couvre que les fonctions attachées au VPC et exige une configuration de journaux de flux, ce que l'entreprise veut éviter ; Lambda Protection n'a pas besoin de VPC Flow Logs sur les interfaces réseau de Lambda.
    c:
      en: |-
        Code scanning reports vulnerabilities in the function packages; it does not detect a function that actually contacts a malicious server.
      fr: |-
        L'analyse du code signale les vulnérabilités des packages de fonction ; elle ne détecte pas une fonction qui contacte réellement un serveur malveillant.
    d:
      en: |-
        Invoke data events record who called a function, not the outbound network connections that the function makes.
      fr: |-
        Les événements de données Invoke enregistrent qui a appelé une fonction, et non les connexions réseau sortantes établies par la fonction.
references:
  - title: GuardDuty Lambda Protection - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/lambda-protection.html
