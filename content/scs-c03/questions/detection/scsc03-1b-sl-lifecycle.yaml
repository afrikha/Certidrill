id: scsc03-1b-sl-lifecycle
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses Amazon Security Lake in us-east-1 and eu-central-1. A new retention policy states that security data must stay in S3 Standard for 30 days, move to a cheaper storage class after 30 days, and be deleted after 400 days. In eu-central-1 only, data must be deleted after 730 days because of a local regulation.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany utilise Amazon Security Lake dans us-east-1 et eu-central-1. Une nouvelle politique de conservation indique que les données de sécurité doivent rester en S3 Standard pendant 30 jours, passer à une classe de stockage moins chère après 30 jours et être supprimées après 400 jours. Dans eu-central-1 uniquement, les données doivent être supprimées après 730 jours en raison d'une réglementation locale.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Schedule an AWS Lambda function that runs daily in each Region, moves objects older than 30 days to S3 Standard-IA, and deletes objects older than the Region's retention period.
        fr: |-
          Planifier une fonction AWS Lambda exécutée chaque jour dans chaque Région, qui déplace les objets de plus de 30 jours vers S3 Standard-IA et supprime les objets plus anciens que la durée de conservation de la Région.
    - id: b
      text:
        en: |-
          Set the lifecycle configuration of Security Lake for each Region with a transition after 30 days and an expiration of 400 days in us-east-1 and 730 days in eu-central-1.
        fr: |-
          Définir la configuration du cycle de vie de Security Lake pour chaque Région, avec une transition après 30 jours et une expiration de 400 jours dans us-east-1 et de 730 jours dans eu-central-1.
    - id: c
      text:
        en: |-
          Enable S3 Object Lock in governance mode on the Security Lake buckets with a default retention of 400 days in us-east-1 and 730 days in eu-central-1.
        fr: |-
          Activer S3 Object Lock en mode gouvernance sur les compartiments Security Lake, avec une conservation par défaut de 400 jours dans us-east-1 et de 730 jours dans eu-central-1.
    - id: d
      text:
        en: |-
          Set the retention of the CloudWatch Logs log groups of each source to 400 days in us-east-1 and 730 days in eu-central-1.
        fr: |-
          Définir la conservation des groupes de journaux CloudWatch Logs de chaque source sur 400 jours dans us-east-1 et 730 jours dans eu-central-1.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Security Lake applies retention per Region with its lifecycleConfiguration: transitions move data to another storage class after a number of days, and expiration deletes it after a number of days. You set it in the console (Select storage classes) or with UpdateDataLake (aws securitylake update-data-lake), with a different value for each Region.
    fr: |-
      Security Lake applique la conservation par Région avec sa lifecycleConfiguration : les transitions déplacent les données vers une autre classe de stockage après un nombre de jours, et l'expiration les supprime après un nombre de jours. Vous la définissez dans la console (Select storage classes) ou avec UpdateDataLake (aws securitylake update-data-lake), avec une valeur différente pour chaque Région.
  options:
    a:
      en: |-
        Custom code would work, but it must be written, scheduled, and maintained, while Security Lake offers the same transitions and expiration as a setting.
      fr: |-
        Du code personnalisé fonctionnerait, mais il faut l'écrire, le planifier et le maintenir, alors que Security Lake propose les mêmes transitions et la même expiration sous forme de paramètre.
    c:
      en: |-
        Object Lock prevents deletion until the retention date; it never deletes the data and does not move it to a cheaper storage class.
      fr: |-
        Object Lock empêche la suppression jusqu'à la date de conservation ; il ne supprime jamais les données et ne les déplace pas vers une classe de stockage moins chère.
    d:
      en: |-
        Security Lake stores its data in S3 buckets; log group retention does not apply to the data in the data lake.
      fr: |-
        Security Lake stocke ses données dans des compartiments S3 ; la conservation des groupes de journaux ne s'applique pas aux données du lac de données.
references:
  - title: Managing Regions in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/manage-regions.html
