id: scsc03-1b-cwagent-private-subnet
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs EC2 instances in private subnets that have no route to the internet, and the security policy forbids adding one. The CloudWatch agent on the instances must send both custom metrics and log files. The agent is running with the correct IAM role, but its log shows dial tcp ... :443: i/o timeout errors for the CloudWatch and CloudWatch Logs endpoints. The VPC has DNS resolution and DNS hostnames enabled.

    Which combination of actions will resolve the errors? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany exécute des instances EC2 dans des sous-réseaux privés sans route vers internet, et la politique de sécurité interdit d'en ajouter une. L'agent CloudWatch des instances doit envoyer à la fois des métriques personnalisées et des fichiers journaux. L'agent s'exécute avec le bon rôle IAM, mais son journal affiche des erreurs dial tcp ... :443: i/o timeout pour les points de terminaison CloudWatch et CloudWatch Logs. La résolution DNS et les noms d'hôte DNS sont activés sur le VPC.

    Quelle combinaison d'actions résoudra les erreurs ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.<region>.logs with private DNS enabled and a security group that allows TCP 443 from the instances.
        fr: |-
          Créer un point de terminaison de VPC d'interface pour com.amazonaws.<region>.logs avec le DNS privé activé et un groupe de sécurité qui autorise TCP 443 depuis les instances.
    - id: b
      text:
        en: |-
          Create a NAT gateway in a public subnet and add a default route to it in the private route tables.
        fr: |-
          Créer une passerelle NAT dans un sous-réseau public et ajouter une route par défaut vers elle dans les tables de routage privées.
    - id: c
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.<region>.events with private DNS enabled.
        fr: |-
          Créer un point de terminaison de VPC d'interface pour com.amazonaws.<region>.events avec le DNS privé activé.
    - id: d
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.<region>.monitoring with private DNS enabled and a security group that allows TCP 443 from the instances.
        fr: |-
          Créer un point de terminaison de VPC d'interface pour com.amazonaws.<region>.monitoring avec le DNS privé activé et un groupe de sécurité qui autorise TCP 443 depuis les instances.
    - id: e
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.<region>.ec2messages with private DNS enabled.
        fr: |-
          Créer un point de terminaison de VPC d'interface pour com.amazonaws.<region>.ec2messages avec le DNS privé activé.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      An i/o timeout means the agent cannot reach the service endpoints. Without internet access, each service the agent calls needs an interface endpoint with private DNS and a security group that allows inbound TCP 443 from the agent: logs for CloudWatch Logs and monitoring for the CloudWatch metrics.
    fr: |-
      Une erreur i/o timeout signifie que l'agent ne peut pas atteindre les points de terminaison des services. Sans accès à internet, chaque service appelé par l'agent a besoin d'un point de terminaison d'interface avec le DNS privé et d'un groupe de sécurité qui autorise TCP 443 entrant depuis l'agent : logs pour CloudWatch Logs et monitoring pour les métriques CloudWatch.
  options:
    b:
      en: |-
        A NAT gateway route gives the subnets internet access, which the security policy forbids.
      fr: |-
        Une route vers une passerelle NAT donne aux sous-réseaux un accès à internet, ce que la politique de sécurité interdit.
    c:
      en: |-
        The events endpoint serves Amazon EventBridge, which the agent does not call to send metrics or logs.
      fr: |-
        Le point de terminaison events sert Amazon EventBridge, que l'agent n'appelle pas pour envoyer des métriques ou des journaux.
    e:
      en: |-
        The ec2messages endpoint is used by Systems Manager to send commands; it does not carry CloudWatch metrics or log events.
      fr: |-
        Le point de terminaison ec2messages est utilisé par Systems Manager pour envoyer des commandes ; il ne transporte ni métriques CloudWatch ni événements de journaux.
references:
  - title: Troubleshooting the CloudWatch agent - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/troubleshooting-CloudWatch-Agent.html
  - title: Using CloudWatch Logs with interface VPC endpoints - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/cloudwatch-logs-and-interface-VPC.html
