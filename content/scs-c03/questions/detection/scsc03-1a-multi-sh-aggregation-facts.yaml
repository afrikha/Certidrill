id: scsc03-1a-multi-sh-aggregation-facts
objective: "1.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's delegated administrator account for AWS Security Hub configures cross-Region aggregation with us-east-1 as the home Region and eu-west-1 as a newly linked Region. Security Hub is enabled for all member accounts in both Regions. Before the change, the security team had created automation rules in us-east-1 that set the severity of some findings and create Jira Cloud tickets. Workloads in eu-west-1 already had open findings before the Region was linked.

    Which two statements are true after the change? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Le compte administrateur délégué d'AWS Security Hub d'AnyCompany configure l'agrégation entre Régions avec us-east-1 comme Région d'origine et eu-west-1 comme Région nouvellement liée. Security Hub est activé pour tous les comptes membres dans les deux Régions. Avant cette modification, l'équipe de sécurité avait créé dans us-east-1 des règles d'automatisation qui définissent la gravité de certains résultats et créent des tickets Jira Cloud. Les charges de travail d'eu-west-1 avaient déjà des résultats ouverts avant que la Région soit liée.

    Quelles sont les deux affirmations vraies après la modification ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The automation rules created in us-east-1 apply to findings from eu-west-1 unless their criteria exclude that Region.
        fr: |-
          Les règles d'automatisation créées dans us-east-1 s'appliquent aux résultats d'eu-west-1, sauf si leurs critères excluent cette Région.
    - id: b
      text:
        en: |-
          All the findings that existed in eu-west-1 before the Region was linked are replicated to us-east-1 immediately.
        fr: |-
          Tous les résultats qui existaient dans eu-west-1 avant la liaison de la Région sont répliqués immédiatement vers us-east-1.
    - id: c
      text:
        en: |-
          Accounts that later join the organization have Security Hub enabled in eu-west-1 automatically because the Region is linked.
        fr: |-
          Les comptes qui rejoignent plus tard l'organisation ont Security Hub activé automatiquement dans eu-west-1, car la Région est liée.
    - id: d
      text:
        en: |-
          A member account can view the aggregated findings of its own account by signing in to the us-east-1 Region.
        fr: |-
          Un compte membre peut consulter les résultats agrégés de son propre compte en se connectant à la Région us-east-1.
    - id: e
      text:
        en: |-
          Security Hub charges for each finding and each update that is replicated from eu-west-1 to us-east-1.
        fr: |-
          Security Hub facture chaque résultat et chaque mise à jour répliqués d'eu-west-1 vers us-east-1.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      With cross-Region aggregation, automation rules can be created only in the home Region, and a rule applies to all linked Regions unless its criteria target specific Regions, including rules created before aggregation was enabled. Members inherit the administrator's aggregation settings and must sign in to the home Region to view their aggregated data.
    fr: |-
      Avec l'agrégation entre Régions, les règles d'automatisation ne peuvent être créées que dans la Région d'origine, et une règle s'applique à toutes les Régions liées sauf si ses critères ciblent des Régions précises, y compris les règles créées avant l'activation de l'agrégation. Les membres héritent des paramètres d'agrégation de l'administrateur et doivent se connecter à la Région d'origine pour consulter leurs données agrégées.
  options:
    b:
      en: |-
        Findings that existed in a Region before it was linked are not replicated unless they are updated or age out.
      fr: |-
        Les résultats qui existaient dans une Région avant sa liaison ne sont pas répliqués, sauf s'ils sont mis à jour ou arrivent à expiration.
    c:
      en: |-
        Security Hub aggregates data only from Regions where an account has Security Hub enabled; aggregation does not enable it.
      fr: |-
        Security Hub n'agrège les données que des Régions où un compte a Security Hub activé ; l'agrégation ne l'active pas.
    e:
      en: |-
        Cross-Region aggregation does not add to the cost of Security Hub; replicated data and updates are not charged.
      fr: |-
        L'agrégation entre Régions n'augmente pas le coût de Security Hub ; les données et mises à jour répliquées ne sont pas facturées.
references:
  - title: Understanding cross-Region aggregation in Security Hub - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/security-hub-region-aggregation.html
