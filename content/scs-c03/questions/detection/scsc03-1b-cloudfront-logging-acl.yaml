id: scsc03-1b-cloudfront-logging-acl
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany created a new S3 bucket with the default settings, including S3 Object Ownership set to bucket owner enforced. An engineer tries to turn on standard logging (legacy) for an Amazon CloudFront distribution with this bucket as the destination, but CloudFront does not deliver any access logs to it. A company policy requires that ACLs stay disabled on all S3 buckets. The access logs must be stored in this bucket.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a créé un nouveau compartiment S3 avec les paramètres par défaut, dont S3 Object Ownership défini sur bucket owner enforced (propriétaire du compartiment appliqué). Un ingénieur essaie d'activer la journalisation standard (legacy) d'une distribution Amazon CloudFront avec ce compartiment comme destination, mais CloudFront n'y livre aucun journal d'accès. Une politique d'entreprise exige que les ACL restent désactivées sur tous les compartiments S3. Les journaux d'accès doivent être stockés dans ce compartiment.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Keep standard logging (legacy) and add a bucket policy statement that allows cloudfront.amazonaws.com to call s3:PutObject on the bucket.
        fr: |-
          Conserver la journalisation standard (legacy) et ajouter une instruction de politique de compartiment qui autorise cloudfront.amazonaws.com à appeler s3:PutObject sur le compartiment.
    - id: b
      text:
        en: |-
          Disable standard logging (legacy) and configure standard logging (v2) with the bucket as the S3 delivery destination.
        fr: |-
          Désactiver la journalisation standard (legacy) et configurer la journalisation standard (v2) avec le compartiment comme destination de livraison S3.
    - id: c
      text:
        en: |-
          Change S3 Object Ownership to bucket owner preferred so that CloudFront can add the awslogsdelivery account to the bucket ACL.
        fr: |-
          Passer S3 Object Ownership à bucket owner preferred pour que CloudFront puisse ajouter le compte awslogsdelivery à l'ACL du compartiment.
    - id: d
      text:
        en: |-
          Create a real-time log configuration for the distribution with the bucket as its destination.
        fr: |-
          Créer une configuration de journaux en temps réel pour la distribution avec le compartiment comme destination.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Standard logging (legacy) writes through bucket ACLs, so it cannot deliver to a bucket whose Object Ownership is bucket owner enforced. Standard logging (v2) delivers to S3, CloudWatch Logs, or Firehose, and adds the bucket policy it needs for delivery.logs.amazonaws.com, so ACLs can stay disabled.
    fr: |-
      La journalisation standard (legacy) écrit au moyen des ACL du compartiment : elle ne peut pas livrer dans un compartiment dont Object Ownership est bucket owner enforced. La journalisation standard (v2) livre dans S3, CloudWatch Logs ou Firehose, et ajoute la politique de compartiment dont elle a besoin pour delivery.logs.amazonaws.com : les ACL peuvent rester désactivées.
  options:
    a:
      en: |-
        Legacy logging needs FULL_CONTROL for the awslogsdelivery account in the bucket ACL; a bucket policy does not replace it.
      fr: |-
        La journalisation legacy a besoin de FULL_CONTROL pour le compte awslogsdelivery dans l'ACL du compartiment ; une politique de compartiment ne la remplace pas.
    c:
      en: |-
        This fixes legacy delivery by enabling ACLs, which the company policy forbids.
      fr: |-
        Cela corrige la livraison legacy en activant les ACL, ce que la politique d'entreprise interdit.
    d:
      en: |-
        Real-time logs are delivered only to a Kinesis data stream, not directly to an S3 bucket.
      fr: |-
        Les journaux en temps réel ne sont livrés que dans un flux de données Kinesis, et non directement dans un compartiment S3.
references:
  - title: Configure standard logging (legacy) - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/standard-logging-legacy-s3.html
  - title: Configure standard logging (v2) - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/standard-logging.html
