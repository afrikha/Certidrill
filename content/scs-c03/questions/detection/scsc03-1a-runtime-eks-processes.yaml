id: scsc03-1a-runtime-eks-processes
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a customer-facing application on an Amazon EKS cluster whose pods run on Amazon EC2 managed node groups. Amazon GuardDuty is enabled in the account with EKS Protection, which analyzes the Kubernetes audit logs. During a threat-modeling review, the security team states a new monitoring requirement: the team must be alerted when a container starts an unexpected process, such as a cryptocurrency miner or a reverse shell, or opens a connection to a known malicious host. The team wants a managed detection with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application destinée aux clients sur un cluster Amazon EKS dont les pods s'exécutent sur des groupes de nœuds gérés Amazon EC2. Amazon GuardDuty est activé dans le compte avec EKS Protection, qui analyse les journaux d'audit Kubernetes. Lors d'une revue de modélisation des menaces, l'équipe de sécurité formule une nouvelle exigence de surveillance : elle doit être alertée lorsqu'un conteneur démarre un processus inattendu, comme un mineur de cryptomonnaie ou un reverse shell, ou ouvre une connexion vers un hôte malveillant connu. L'équipe veut une détection gérée avec le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable Amazon Inspector enhanced scanning for the Amazon ECR repositories that store the application images, with continuous rescanning.
        fr: |-
          Activer l'analyse améliorée d'Amazon Inspector pour les référentiels Amazon ECR qui stockent les images de l'application, avec une nouvelle analyse continue.
    - id: b
      text:
        en: |-
          Enable the EKS control plane audit log type, and create CloudWatch Logs metric filters that match pod exec and create events.
        fr: |-
          Activer le type de journal d'audit du plan de contrôle EKS, et créer des filtres de métriques CloudWatch Logs qui correspondent aux événements exec et create des pods.
    - id: c
      text:
        en: |-
          Enable GuardDuty Runtime Monitoring for Amazon EKS, and let GuardDuty manage the security agent on the cluster automatically.
        fr: |-
          Activer GuardDuty Runtime Monitoring pour Amazon EKS, et laisser GuardDuty gérer automatiquement l'agent de sécurité sur le cluster.
    - id: d
      text:
        en: |-
          Enable VPC Flow Logs on the node subnets, and investigate the flow records in Amazon Detective when a connection looks suspicious.
        fr: |-
          Activer VPC Flow Logs sur les sous-réseaux des nœuds, et examiner les enregistrements de flux dans Amazon Detective lorsqu'une connexion semble suspecte.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Runtime Monitoring uses a GuardDuty security agent that observes operating system-level events such as process execution, file access, command line arguments, and network connections on EKS, ECS on Fargate, and EC2 workloads. EKS Protection only analyzes Kubernetes audit logs, which record API calls to the cluster, not what runs inside a container. With automated agent configuration, GuardDuty installs and updates the agent, which keeps the operational overhead low.
    fr: |-
      Runtime Monitoring utilise un agent de sécurité GuardDuty qui observe les événements au niveau du système d'exploitation, comme l'exécution de processus, l'accès aux fichiers, les arguments de ligne de commande et les connexions réseau, sur les charges de travail EKS, ECS sur Fargate et EC2. EKS Protection analyse uniquement les journaux d'audit Kubernetes, qui enregistrent les appels d'API au cluster et non ce qui s'exécute dans un conteneur. Avec la configuration automatisée de l'agent, GuardDuty installe et met à jour l'agent, ce qui limite la charge opérationnelle.
  options:
    a:
      en: |-
        Inspector finds known vulnerabilities in images before or after deployment; it does not observe processes or connections at runtime.
      fr: |-
        Inspector trouve les vulnérabilités connues dans les images avant ou après le déploiement ; il n'observe ni les processus ni les connexions à l'exécution.
    b:
      en: |-
        Audit logs record calls to the Kubernetes API, so they show an exec request but not the processes or network connections inside the container, and custom filters add maintenance.
      fr: |-
        Les journaux d'audit enregistrent les appels à l'API Kubernetes : ils montrent une requête exec, mais pas les processus ni les connexions réseau à l'intérieur du conteneur, et les filtres personnalisés ajoutent de la maintenance.
    d:
      en: |-
        Flow logs show IP traffic but no process information, and a manual investigation in Detective is not an automated alert.
      fr: |-
        Les journaux de flux montrent le trafic IP mais aucune information sur les processus, et une investigation manuelle dans Detective n'est pas une alerte automatisée.
