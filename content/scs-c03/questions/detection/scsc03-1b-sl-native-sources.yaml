id: scsc03-1b-sl-native-sources
objective: "1.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has enabled Amazon Security Lake with CloudTrail management events and VPC Flow Logs as sources. The security team wants to add two more log sources that Security Lake collects natively as AWS log sources, without building a custom source.

    Which two log sources can the team add as AWS log sources? (Choose two.)
  fr: |
    AnyCompany a activé Amazon Security Lake avec les événements de gestion CloudTrail et VPC Flow Logs comme sources. L'équipe de sécurité veut ajouter deux autres sources de journaux que Security Lake collecte nativement comme sources de journaux AWS, sans créer de source personnalisée.

    Quelles sont les deux sources de journaux que l'équipe peut ajouter comme sources de journaux AWS ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Application Load Balancer access logs"
        fr: "Journaux d'accès d'Application Load Balancer"
    - id: b
      text:
        en: "Amazon Route 53 Resolver query logs"
        fr: "Journaux de requêtes Amazon Route 53 Resolver"
    - id: c
      text:
        en: "Amazon CloudFront standard logs"
        fr: "Journaux standard Amazon CloudFront"
    - id: d
      text:
        en: "AWS WAF (WAFv2) logs"
        fr: "Journaux AWS WAF (WAFv2)"
    - id: e
      text:
        en: "Amazon RDS database audit logs"
        fr: "Journaux d'audit des bases de données Amazon RDS"
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Security Lake natively collects CloudTrail management and data events (S3, Lambda), Amazon EKS audit logs, Route 53 Resolver query logs, Security Hub CSPM findings, VPC Flow Logs, and AWS WAFv2 logs. Route 53 Resolver query logs and WAFv2 logs are therefore added as AWS log sources without a custom source.
    fr: |-
      Security Lake collecte nativement les événements de gestion et de données CloudTrail (S3, Lambda), les journaux d'audit Amazon EKS, les journaux de requêtes Route 53 Resolver, les résultats Security Hub CSPM, VPC Flow Logs et les journaux AWS WAFv2. Les journaux de requêtes Route 53 Resolver et les journaux WAFv2 s'ajoutent donc comme sources de journaux AWS sans source personnalisée.
  options:
    a:
      en: |-
        ALB access logs are not a native Security Lake source; they would have to be converted to OCSF and added as a custom source.
      fr: |-
        Les journaux d'accès ALB ne sont pas une source native de Security Lake ; il faudrait les convertir en OCSF et les ajouter comme source personnalisée.
    c:
      en: |-
        CloudFront standard logs are not in the list of native sources; they require a custom source.
      fr: |-
        Les journaux standard CloudFront ne figurent pas dans la liste des sources natives ; ils exigent une source personnalisée.
    e:
      en: |-
        RDS audit logs are not a native Security Lake source; they require a custom source.
      fr: |-
        Les journaux d'audit RDS ne sont pas une source native de Security Lake ; ils exigent une source personnalisée.
references:
  - title: Collecting data from AWS services in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/internal-sources.html
