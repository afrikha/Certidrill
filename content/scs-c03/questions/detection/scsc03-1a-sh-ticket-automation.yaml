id: scsc03-1a-sh-ticket-automation
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Security Hub with a delegated administrator account, and the ServiceNow ITSM integration is configured. The security operations team wants a ServiceNow incident to be created automatically for every new critical finding in any member account, so that no critical finding depends on an analyst noticing it in the console. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS Security Hub avec un compte administrateur délégué, et l'intégration ServiceNow ITSM est configurée. L'équipe des opérations de sécurité veut qu'un incident ServiceNow soit créé automatiquement pour chaque nouveau résultat critique de n'importe quel compte membre, afin qu'aucun résultat critique ne dépende de la vigilance d'un analyste dans la console. L'équipe veut le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a resource automation rule that sets the criticality of the affected resources to Very High and creates a ServiceNow ticket.
        fr: |-
          Créer une règle d'automatisation de ressources qui définit la criticité des ressources concernées sur Very High et crée un ticket ServiceNow.
    - id: b
      text:
        en: |-
          Create a finding automation rule whose criteria match a critical severity, with an action that creates a ticket in ServiceNow ITSM.
        fr: |-
          Créer une règle d'automatisation de résultats dont les critères correspondent à une gravité critique, avec une action qui crée un ticket dans ServiceNow ITSM.
    - id: c
      text:
        en: |-
          Create a Security Hub CSPM custom action that sends findings to ServiceNow, and ask the analysts to run it on each critical finding.
        fr: |-
          Créer une action personnalisée Security Hub CSPM qui envoie les résultats à ServiceNow, et demander aux analystes de l'exécuter sur chaque résultat critique.
    - id: d
      text:
        en: |-
          Create a finding automation rule whose criteria match a critical severity, with an action that updates the StatusId of the finding.
        fr: |-
          Créer une règle d'automatisation de résultats dont les critères correspondent à une gravité critique, avec une action qui met à jour le StatusId du résultat.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Security Hub finding rules match findings on OCSF criteria, such as severity, and can either update finding details or create a ticket in Jira Cloud or ServiceNow ITSM. A rule in the administrator account evaluates new and updated findings of the member accounts as they arrive, so tickets are created without any manual step.
    fr: |-
      Les règles de résultats de Security Hub sélectionnent les résultats selon des critères OCSF, comme la gravité, et peuvent soit mettre à jour les détails du résultat, soit créer un ticket dans Jira Cloud ou ServiceNow ITSM. Une règle du compte administrateur évalue les résultats nouveaux et mis à jour des comptes membres dès leur arrivée : les tickets sont créés sans aucune étape manuelle.
  options:
    a:
      en: |-
        Resource rules can only set resource criticality; they cannot update finding details or create tickets.
      fr: |-
        Les règles de ressources ne peuvent que définir la criticité des ressources ; elles ne peuvent ni mettre à jour les détails des résultats ni créer de tickets.
    c:
      en: |-
        A custom action runs only when an analyst selects it on a finding, so critical findings would still depend on someone noticing them.
      fr: |-
        Une action personnalisée ne s'exécute que lorsqu'un analyste la sélectionne sur un résultat : les résultats critiques dépendraient toujours de quelqu'un qui les remarque.
    d:
      en: |-
        Updating the status of a finding changes its workflow state in Security Hub but creates no ServiceNow incident.
      fr: |-
        Mettre à jour le statut d'un résultat change son état de workflow dans Security Hub, mais ne crée aucun incident ServiceNow.
references:
  - title: Automation rules in Security Hub - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-v2-automation-rules.html
