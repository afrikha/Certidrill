id: scsc03-1b-osi-grok-s3
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's web servers upload Apache access logs in the common log format to an S3 bucket every minute. The security team wants each log line parsed into fields (client IP, request, status) and indexed into an Amazon OpenSearch Service domain within minutes of upload, so that analysts can correlate requests with other security data. The team does not want to manage servers or write parsing code.

    Which solution will meet these requirements?
  fr: |
    Les serveurs web d'AnyCompany chargent chaque minute dans un compartiment S3 des journaux d'accès Apache au format Common Log Format. L'équipe de sécurité veut que chaque ligne de journal soit analysée en champs (IP client, requête, statut) et indexée dans un domaine Amazon OpenSearch Service quelques minutes après le chargement, afin que les analystes puissent corréler les requêtes avec d'autres données de sécurité. L'équipe ne veut ni gérer de serveurs ni écrire de code d'analyse.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Install Logstash on an Auto Scaling group of EC2 instances that polls the bucket, parses the lines, and writes to the domain.
        fr: |-
          Installer Logstash sur un groupe Auto Scaling d'instances EC2 qui interroge le compartiment, analyse les lignes et écrit dans le domaine.
    - id: b
      text:
        en: |-
          Configure S3 event notifications that invoke an AWS Lambda function, which parses each line and indexes it into the domain.
        fr: |-
          Configurer des notifications d'événements S3 qui appellent une fonction AWS Lambda, laquelle analyse chaque ligne et l'indexe dans le domaine.
    - id: c
      text:
        en: |-
          Create an OpenSearch Ingestion pipeline with an S3 source fed by S3 event notifications in an SQS queue, a grok processor, and the domain as sink.
        fr: |-
          Créer un pipeline OpenSearch Ingestion avec une source S3 alimentée par les notifications d'événements S3 d'une file SQS, un processeur grok et le domaine comme destination (sink).
    - id: d
      text:
        en: |-
          Create an Amazon Data Firehose stream with the bucket as its source, a 60-second buffer, and the domain as its destination.
        fr: |-
          Créer un flux Amazon Data Firehose avec le compartiment comme source, une mise en mémoire tampon de 60 secondes et le domaine comme destination.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      OpenSearch Ingestion is a serverless collector based on Data Prepper. Its S3 source processes new objects in near real time from S3 event notifications delivered to an SQS queue, and the grok processor parses common log formats with built-in patterns such as COMMONAPACHELOG before the pipeline writes to the domain.
    fr: |-
      OpenSearch Ingestion est un collecteur sans serveur fondé sur Data Prepper. Sa source S3 traite les nouveaux objets en quasi temps réel à partir des notifications d'événements S3 livrées dans une file d'attente SQS, et le processeur grok analyse les formats de journaux courants avec des modèles intégrés comme COMMONAPACHELOG avant que le pipeline n'écrive dans le domaine.
  options:
    a:
      en: |-
        Logstash on EC2 works, but the team would have to manage, patch, and scale the instances.
      fr: |-
        Logstash sur EC2 fonctionne, mais l'équipe devrait gérer, corriger et mettre à l'échelle les instances.
    b:
      en: |-
        This works, but the team would have to write and maintain the parsing and indexing code, which it does not want.
      fr: |-
        Cela fonctionne, mais l'équipe devrait écrire et maintenir le code d'analyse et d'indexation, ce qu'elle ne veut pas.
    d:
      en: |-
        S3 is not a Firehose source: producers must send records to the stream, so the uploaded files would never reach it.
      fr: |-
        S3 n'est pas une source de Firehose : les producteurs doivent envoyer les enregistrements au flux, et les fichiers chargés ne l'atteindraient jamais.
references:
  - title: Using an OpenSearch Ingestion pipeline with Amazon S3 - Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/configure-client-s3.html
  - title: Overview of Amazon OpenSearch Ingestion - Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ingestion.html
