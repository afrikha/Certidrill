id: scsc03-1a-gd-update-frequency
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany manages Amazon GuardDuty from a delegated administrator account. An Amazon EventBridge rule in the administrator account sends findings to the security operations team. The team receives new findings in near real time, but when an existing finding recurs, for example repeated port probes against the same instance, the updated finding arrives up to several hours later. The team requires updates of existing findings to be delivered within 15 minutes for all member accounts.

    What should the team do?
  fr: |
    AnyCompany gère Amazon GuardDuty à partir d'un compte administrateur délégué. Une règle Amazon EventBridge du compte administrateur envoie les résultats à l'équipe des opérations de sécurité. L'équipe reçoit les nouveaux résultats quasiment en temps réel, mais lorsqu'un résultat existant se reproduit, par exemple des sondages de ports répétés contre la même instance, le résultat mis à jour arrive jusqu'à plusieurs heures plus tard. L'équipe exige que les mises à jour des résultats existants soient livrées en 15 minutes pour tous les comptes membres.

    Que doit faire l'équipe ?
body:
  options:
    - id: a
      text:
        en: |-
          In each member account, change the frequency of updated findings to 15 minutes in the GuardDuty settings.
        fr: |-
          Dans chaque compte membre, modifier à 15 minutes la fréquence des résultats mis à jour dans les paramètres GuardDuty.
    - id: b
      text:
        en: |-
          Set a maximum event age of 15 minutes in the retry policy of the EventBridge rule target.
        fr: |-
          Définir un âge maximal d'événement de 15 minutes dans la politique de nouvelle tentative de la cible de la règle EventBridge.
    - id: c
      text:
        en: |-
          Create a GuardDuty suppression rule for the recurring finding types so that each occurrence is sent as a new finding.
        fr: |-
          Créer une règle de suppression GuardDuty pour les types de résultats récurrents afin que chaque occurrence soit envoyée comme un nouveau résultat.
    - id: d
      text:
        en: |-
          In the delegated administrator account, change the frequency of updated findings to 15 minutes in the GuardDuty settings.
        fr: |-
          Dans le compte administrateur délégué, modifier à 15 minutes la fréquence des résultats mis à jour dans les paramètres GuardDuty.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      GuardDuty sends new findings in near real time, and it aggregates subsequent occurrences of an existing finding and publishes the update at a configurable frequency of 15 minutes, 1 hour, or 6 hours (the default). The administrator account sets this frequency, which applies to its member accounts and to EventBridge, S3 export, and Detective.
    fr: |-
      GuardDuty envoie les nouveaux résultats quasiment en temps réel, et regroupe les occurrences ultérieures d'un résultat existant pour publier la mise à jour à une fréquence configurable de 15 minutes, 1 heure ou 6 heures (par défaut). Le compte administrateur définit cette fréquence, qui s'applique à ses comptes membres ainsi qu'à EventBridge, à l'exportation S3 et à Detective.
  options:
    a:
      en: |-
        Member accounts cannot change the frequency for their own accounts; the administrator's setting applies to them.
      fr: |-
        Les comptes membres ne peuvent pas modifier la fréquence pour leur propre compte ; le paramètre de l'administrateur s'applique à eux.
    b:
      en: |-
        The retry policy controls how long EventBridge retries a failed delivery; it does not make GuardDuty publish updates sooner.
      fr: |-
        La politique de nouvelle tentative contrôle la durée pendant laquelle EventBridge réessaie une livraison échouée ; elle n'oblige pas GuardDuty à publier les mises à jour plus tôt.
    c:
      en: |-
        Suppression rules archive matching findings automatically, and archived findings are not sent to EventBridge at all.
      fr: |-
        Les règles de suppression archivent automatiquement les résultats correspondants, et les résultats archivés ne sont pas du tout envoyés à EventBridge.
references:
  - title: Processing GuardDuty findings with Amazon EventBridge - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_eventbridge.html
  - title: Exporting generated GuardDuty findings to Amazon S3 buckets - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_exportfindings.html
