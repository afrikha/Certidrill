id: scsc03-1a-health-org-delegated
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 80 accounts in an organization in AWS Organizations with all features enabled. The security operations team works from a dedicated security tooling account and must review the AWS Health events that affect any account in the organization, including security notifications and scheduled changes, filtered by account, Region, and service. Security policy forbids giving the team access to the management account.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 80 comptes dans une organisation AWS Organizations dont toutes les fonctionnalités sont activées. L'équipe des opérations de sécurité travaille depuis un compte dédié aux outils de sécurité et doit examiner les événements AWS Health qui concernent n'importe quel compte de l'organisation, y compris les notifications de sécurité et les modifications planifiées, filtrés par compte, par Région et par service. La politique de sécurité interdit de donner à l'équipe l'accès au compte de gestion.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Config organization aggregator in the security tooling account, and review the AWS Health resources in the aggregated inventory.
        fr: |-
          Créer un agrégateur d'organisation AWS Config dans le compte des outils de sécurité, et examiner les ressources AWS Health dans l'inventaire agrégé.
    - id: b
      text:
        en: |-
          Create an organization trail and query the AWS Health API calls that CloudTrail records for each account.
        fr: |-
          Créer un journal de suivi d'organisation et interroger les appels d'API AWS Health que CloudTrail enregistre pour chaque compte.
    - id: c
      text:
        en: |-
          Enable the AWS Health organizational view from the management account, and register the security tooling account as a delegated administrator for the organizational view.
        fr: |-
          Activer la vue organisationnelle d'AWS Health à partir du compte de gestion, et enregistrer le compte des outils de sécurité comme administrateur délégué de la vue organisationnelle.
    - id: d
      text:
        en: |-
          Enable AWS Trusted Advisor organizational view, and download the organization report from the security tooling account each day.
        fr: |-
          Activer la vue organisationnelle d'AWS Trusted Advisor, et télécharger chaque jour le rapport de l'organisation depuis le compte des outils de sécurité.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The organizational view of AWS Health shows events across all accounts of the organization, filtered by account, Region, and service. It is enabled from the management account, and AWS recommends delegating access to a member account so that operations teams see the events of the whole organization while the management account stays restricted. Organizational events are kept for 90 days.
    fr: |-
      La vue organisationnelle d'AWS Health présente les événements de tous les comptes de l'organisation, filtrés par compte, par Région et par service. Elle s'active depuis le compte de gestion, et AWS recommande d'en déléguer l'accès à un compte membre afin que les équipes d'exploitation voient les événements de toute l'organisation tandis que le compte de gestion reste protégé. Les événements organisationnels sont conservés 90 jours.
  options:
    a:
      en: |-
        Config aggregators collect configuration and compliance data of resources; AWS Health events are not Config resources.
      fr: |-
        Les agrégateurs Config collectent les données de configuration et de conformité des ressources ; les événements AWS Health ne sont pas des ressources Config.
    b:
      en: |-
        CloudTrail records calls that principals make to the AWS Health API, not the content of the Health events that affect the accounts.
      fr: |-
        CloudTrail enregistre les appels que des principaux adressent à l'API AWS Health, et non le contenu des événements Health qui concernent les comptes.
    d:
      en: |-
        Trusted Advisor reports best practice check results, not AWS Health events such as security notifications and scheduled changes.
      fr: |-
        Trusted Advisor présente les résultats de contrôles de bonnes pratiques, et non les événements AWS Health comme les notifications de sécurité et les modifications planifiées.
references:
  - title: Aggregating AWS Health events across accounts - AWS Health
    url: https://docs.aws.amazon.com/health/latest/ug/aggregate-events.html
