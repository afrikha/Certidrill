id: scsc03-1a-r53-private-endpoint-check
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany exposes an internal HTTPS API through two Network Load Balancers in private subnets of a VPC. Both load balancers, the VPC, and the Route 53 private hosted zone are in the same AWS account. The security policy forbids exposing the API to the internet. The company wants Route 53 failover records to send clients to the secondary load balancer when the /health path of the primary one stops responding, and it wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose une API HTTPS interne au moyen de deux Network Load Balancers dans des sous-réseaux privés d'un VPC. Les deux équilibreurs de charge, le VPC et la zone hébergée privée Route 53 se trouvent dans le même compte AWS. La politique de sécurité interdit d'exposer l'API à Internet. L'entreprise veut que des enregistrements de basculement Route 53 dirigent les clients vers l'équilibreur secondaire lorsque le chemin /health du principal cesse de répondre, avec le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an endpoint health check that targets the private IP address of the primary load balancer, and associate it with the primary failover record.
        fr: |-
          Créer une vérification de l'état de type point de terminaison qui cible l'adresse IP privée de l'équilibreur principal, et l'associer à l'enregistrement de basculement principal.
    - id: b
      text:
        en: |-
          Create a health check source in three subnets of the VPC, allow its traffic in the security groups, and create a private endpoint health check on /health for the primary failover record.
        fr: |-
          Créer une source de vérification de l'état dans trois sous-réseaux du VPC, autoriser son trafic dans les groupes de sécurité, et créer une vérification de l'état de point de terminaison privé sur /health pour l'enregistrement de basculement principal.
    - id: c
      text:
        en: |-
          Create private endpoint health checks for both load balancers, and associate a calculated health check that references them with the primary failover record.
        fr: |-
          Créer des vérifications de l'état de point de terminaison privé pour les deux équilibreurs, et associer à l'enregistrement de basculement principal une vérification calculée qui les référence.
    - id: d
      text:
        en: |-
          Create an alarm on the HealthyHostCount metric of the primary load balancer in the company's shared monitoring account, and create a CloudWatch alarm health check on it.
        fr: |-
          Créer une alarme sur la métrique HealthyHostCount de l'équilibreur principal dans le compte de surveillance partagé de l'entreprise, et créer dessus une vérification de l'état de type alarme CloudWatch.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Private endpoint health checks run from a health check source that you create in the VPC, with an IP address in three subnets in three Availability Zones, so the endpoint is never exposed to the internet. They support HTTP, HTTPS, and TCP with string matching, mark the associated records unhealthy for failover, and require the security groups and network ACLs to allow traffic from the source. The health check, its source, and the records must be in the same account, which is the case here.
    fr: |-
      Les vérifications de l'état de point de terminaison privé s'exécutent à partir d'une source de vérification de l'état créée dans le VPC, avec une adresse IP dans trois sous-réseaux de trois zones de disponibilité : le point de terminaison n'est jamais exposé à Internet. Elles prennent en charge HTTP, HTTPS et TCP avec correspondance de chaîne, marquent les enregistrements associés comme défaillants pour le basculement, et exigent que les groupes de sécurité et les listes ACL réseau autorisent le trafic de la source. La vérification, sa source et les enregistrements doivent appartenir au même compte, ce qui est le cas ici.
  options:
    a:
      en: |-
        Endpoint health checks are sent from Route 53 health checkers on the internet, which cannot reach a private IP address without exposing the API.
      fr: |-
        Les vérifications de type point de terminaison sont envoyées par les vérificateurs Route 53 depuis Internet, qui ne peuvent pas atteindre une adresse IP privée sans exposer l'API.
    c:
      en: |-
        A calculated health check cannot reference private endpoint health checks, so this configuration is not supported.
      fr: |-
        Une vérification de l'état calculée ne peut pas référencer de vérifications de point de terminaison privé : cette configuration n'est pas prise en charge.
    d:
      en: |-
        A CloudWatch alarm health check requires the alarm to be in the same account as the health check, and the HealthyHostCount metric does not test the /health path from a client's point of view.
      fr: |-
        Une vérification de type alarme CloudWatch exige que l'alarme soit dans le même compte que la vérification, et la métrique HealthyHostCount ne teste pas le chemin /health du point de vue d'un client.
references:
