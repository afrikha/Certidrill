id: scsc03-1a-multi-remediation-behavior
objective: "1.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's security team is preparing to turn on AWS Config automatic remediation for several rules in its accounts. Some of the rules are custom rules created by the team, and others are service-linked rules created by AWS Security Hub CSPM. The team must explain the behavior of automatic remediation to the change advisory board before it is enabled.

    Which two statements about AWS Config automatic remediation are true? (Choose two.)
  fr: |
    L'équipe de sécurité d'AnyCompany se prépare à activer la correction automatique AWS Config pour plusieurs règles de ses comptes. Certaines règles sont des règles personnalisées créées par l'équipe, et d'autres sont des règles liées à un service créées par AWS Security Hub CSPM. L'équipe doit expliquer le comportement de la correction automatique au comité consultatif des changements avant son activation.

    Quelles sont les deux affirmations vraies sur la correction automatique AWS Config ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          If a resource is still noncompliant after remediation, the rule can retry it a set number of times within a time window in seconds.
        fr: |-
          Si une ressource reste non conforme après la correction, la règle peut réessayer un nombre défini de fois dans une fenêtre de temps exprimée en secondes.
    - id: b
      text:
        en: |-
          Remediation actions can be associated with the service-linked rules that Security Hub CSPM created.
        fr: |-
          Des actions de correction peuvent être associées aux règles liées à un service créées par Security Hub CSPM.
    - id: c
      text:
        en: |-
          Enabling automatic remediation starts remediation for all currently noncompliant resources of the rule, based on a compliance snapshot that can be stale.
        fr: |-
          L'activation de la correction automatique lance la correction de toutes les ressources actuellement non conformes de la règle, sur la base d'un instantané de conformité qui peut être obsolète.
    - id: d
      text:
        en: |-
          An organization aggregator can run remediation actions in the source accounts and Regions whose compliance data it collects.
        fr: |-
          Un agrégateur d'organisation peut exécuter des actions de correction dans les comptes et les Régions sources dont il collecte les données de conformité.
    - id: e
      text:
        en: |-
          A rule in proactive evaluation mode blocks the deployment of a noncompliant resource and then remediates it automatically.
        fr: |-
          Une règle en mode d'évaluation proactif bloque le déploiement d'une ressource non conforme, puis la corrige automatiquement.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Automatic remediation runs a Systems Manager Automation document and can retry a remediation that leaves the resource noncompliant, with a number of retries within a window in seconds; each retry can incur Automation charges. When it is enabled, remediation starts for all noncompliant resources of the rule, using a periodically captured compliance snapshot, so it can sometimes run on resources that have since become compliant.
    fr: |-
      La correction automatique exécute un document Systems Manager Automation et peut réessayer une correction qui laisse la ressource non conforme, avec un nombre de nouvelles tentatives dans une fenêtre exprimée en secondes ; chaque tentative peut entraîner des frais Automation. À son activation, la correction démarre pour toutes les ressources non conformes de la règle, à partir d'un instantané de conformité capturé périodiquement : elle peut donc parfois s'exécuter sur des ressources devenues conformes entre-temps.
  options:
    b:
      en: |-
        Remediations can be managed only for AWS Config rules that are not service-linked.
      fr: |-
        Les corrections ne peuvent être gérées que pour les règles AWS Config qui ne sont pas liées à un service.
    d:
      en: |-
        Aggregators are read-only and do not provide mutating access into source accounts.
      fr: |-
        Les agrégateurs sont en lecture seule et n'offrent aucun accès en modification aux comptes sources.
    e:
      en: |-
        Proactive rules evaluate resource properties before deployment, but they do not block deployment or remediate resources.
      fr: |-
        Les règles proactives évaluent les propriétés des ressources avant le déploiement, mais elles ne bloquent pas le déploiement et ne corrigent pas les ressources.
references:
  - title: Setting Up Auto Remediation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
  - title: Components of an AWS Config Rule - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config-rules.html
