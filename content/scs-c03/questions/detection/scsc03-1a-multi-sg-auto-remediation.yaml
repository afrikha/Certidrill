id: scsc03-1a-multi-sg-auto-remediation
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany records all resources with AWS Config in a production account. Developers sometimes add security group rules that allow SSH from 0.0.0.0/0 or ::/0. The security team requires these rules to be removed automatically within minutes after they are created, and the noncompliance must remain visible in the AWS Config compliance history. The team wants to use managed components wherever possible.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany enregistre toutes les ressources avec AWS Config dans un compte de production. Des développeurs ajoutent parfois des règles de groupe de sécurité qui autorisent SSH depuis 0.0.0.0/0 ou ::/0. L'équipe de sécurité exige que ces règles soient supprimées automatiquement dans les minutes qui suivent leur création, et la non-conformité doit rester visible dans l'historique de conformité AWS Config. L'équipe veut utiliser des composants gérés partout où c'est possible.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Deploy the AWS Config managed rule restricted-ssh, which is evaluated when a security group configuration changes.
        fr: |-
          Déployer la règle gérée AWS Config restricted-ssh, qui est évaluée lorsqu'une configuration de groupe de sécurité change.
    - id: b
      text:
        en: |-
          Enable the proactive evaluation mode on the rule so that noncompliant security group rules are blocked before they are deployed in the account.
        fr: |-
          Activer le mode d'évaluation proactif sur la règle afin que les règles de groupe de sécurité non conformes soient bloquées avant leur déploiement dans le compte.
    - id: c
      text:
        en: |-
          Configure automatic remediation on the rule with the AWS-DisablePublicAccessForSecurityGroup runbook, GroupId as the resource ID parameter, and an AutomationAssumeRole.
        fr: |-
          Configurer une correction automatique sur la règle avec le runbook AWS-DisablePublicAccessForSecurityGroup, GroupId comme paramètre d'ID de ressource et un AutomationAssumeRole.
    - id: d
      text:
        en: |-
          Turn on the AWS Trusted Advisor security groups check, and refresh the check results every week to find the open rules.
        fr: |-
          Activer le contrôle AWS Trusted Advisor des groupes de sécurité, et actualiser les résultats du contrôle chaque semaine pour trouver les règles ouvertes.
    - id: e
      text:
        en: |-
          Create a custom AWS Config rule backed by AWS Lambda with a periodic trigger of 24 hours that deletes the open SSH rules that it finds.
        fr: |-
          Créer une règle AWS Config personnalisée reposant sur AWS Lambda avec un déclencheur périodique de 24 heures qui supprime les règles SSH ouvertes qu'elle trouve.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The restricted-ssh managed rule evaluates security groups when their configuration changes and records the noncompliance. Automatic remediation associates a Systems Manager Automation runbook with the rule; the AWS-owned AWS-DisablePublicAccessForSecurityGroup runbook removes SSH and RDP rules open to 0.0.0.0/0 and ::/0, receives the noncompliant group through the resource ID parameter, and runs with the AutomationAssumeRole permissions.
    fr: |-
      La règle gérée restricted-ssh évalue les groupes de sécurité lorsque leur configuration change et enregistre la non-conformité. La correction automatique associe un runbook Systems Manager Automation à la règle ; le runbook AWS-DisablePublicAccessForSecurityGroup, détenu par AWS, supprime les règles SSH et RDP ouvertes à 0.0.0.0/0 et ::/0, reçoit le groupe non conforme par le paramètre d'ID de ressource et s'exécute avec les autorisations de l'AutomationAssumeRole.
  options:
    b:
      en: |-
        Proactive rules evaluate resource properties before deployment, but they neither block deployment nor remediate resources.
      fr: |-
        Les règles proactives évaluent les propriétés des ressources avant le déploiement, mais elles ne bloquent pas le déploiement et ne corrigent pas les ressources.
    d:
      en: |-
        Trusted Advisor reports the open security groups but does not remove the rules or record Config compliance history.
      fr: |-
        Trusted Advisor signale les groupes de sécurité ouverts, mais ne supprime pas les règles et n'enregistre pas d'historique de conformité Config.
    e:
      en: |-
        A 24-hour periodic trigger cannot remove the rules within minutes, and custom code is not a managed component.
      fr: |-
        Un déclencheur périodique de 24 heures ne peut pas supprimer les règles en quelques minutes, et un code personnalisé n'est pas un composant géré.
references:
  - title: Setting Up Auto Remediation for AWS Config - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
  - title: AWS-DisablePublicAccessForSecurityGroup - AWS Systems Manager Automation Runbook Reference
    url: https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-aws-disablepublicaccessforsecuritygroup.html
