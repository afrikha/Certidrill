id: scsc03-1b-r53-healthcheck-sg
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses an Amazon Route 53 health check on port 443 of an internet-facing EC2 instance in us-east-1 for DNS failover. The health check reports the endpoint as unhealthy, although the application answers correctly from the corporate network. The instance's security group allows inbound TCP 443 only from the corporate CIDR range. The security team requires least privilege.

    What should the team do so that the health check reports the correct status?
  fr: |
    AnyCompany utilise une vérification de l'état Amazon Route 53 sur le port 443 d'une instance EC2 exposée à internet dans us-east-1, pour le basculement DNS. La vérification de l'état indique que le point de terminaison est défectueux, alors que l'application répond correctement depuis le réseau de l'entreprise. Le groupe de sécurité de l'instance autorise le trafic TCP 443 entrant uniquement depuis la plage CIDR de l'entreprise. L'équipe de sécurité exige le moindre privilège.

    Que doit faire l'équipe pour que la vérification de l'état indique le bon état ?
body:
  options:
    - id: a
      text:
        en: |-
          Add an inbound rule for TCP 443 whose source is the AWS-managed prefix list com.amazonaws.us-east-1.route53-healthchecks.
        fr: |-
          Ajouter une règle entrante pour TCP 443 dont la source est la liste de préfixes gérée par AWS com.amazonaws.us-east-1.route53-healthchecks.
    - id: b
      text:
        en: |-
          Add an inbound rule for TCP 443 from 0.0.0.0/0.
        fr: |-
          Ajouter une règle entrante pour TCP 443 depuis 0.0.0.0/0.
    - id: c
      text:
        en: |-
          Add inbound rules for TCP 443 from the health checker IP addresses that appear in the instance's web server logs.
        fr: |-
          Ajouter des règles entrantes pour TCP 443 depuis les adresses IP des vérificateurs de l'état qui apparaissent dans les journaux du serveur web de l'instance.
    - id: d
      text:
        en: |-
          Add an inbound rule for TCP 443 to the network ACL of the subnet from the corporate CIDR range.
        fr: |-
          Ajouter à la liste ACL réseau du sous-réseau une règle entrante pour TCP 443 depuis la plage CIDR de l'entreprise.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Route 53 health checkers send their requests from published IP ranges, which a security group must allow. The AWS-managed prefix list route53-healthchecks contains all the required ranges, so one rule allows exactly the health checkers on port 443.
    fr: |-
      Les vérificateurs de l'état Route 53 envoient leurs requêtes depuis des plages d'IP publiées, qu'un groupe de sécurité doit autoriser. La liste de préfixes gérée par AWS route53-healthchecks contient toutes les plages requises : une seule règle autorise exactement les vérificateurs de l'état sur le port 443.
  options:
    b:
      en: |-
        Opening port 443 to the whole internet fixes the health check but breaks the least-privilege requirement.
      fr: |-
        Ouvrir le port 443 à tout internet corrige la vérification de l'état mais enfreint l'exigence de moindre privilège.
    c:
      en: |-
        A health checker's IP address can change to another address of its Region at any time, so allowing only the observed addresses breaks again later.
      fr: |-
        L'adresse IP d'un vérificateur de l'état peut changer à tout moment pour une autre adresse de sa Région : n'autoriser que les adresses observées finit par échouer à nouveau.
    d:
      en: |-
        The security group still blocks the health checkers, and the corporate range is not the source of the health check requests.
      fr: |-
        Le groupe de sécurité bloque toujours les vérificateurs de l'état, et la plage de l'entreprise n'est pas la source des requêtes de vérification.
references:
  - title: Configuring router and firewall rules for Amazon Route 53 health checks - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-router-firewall-rules.html
