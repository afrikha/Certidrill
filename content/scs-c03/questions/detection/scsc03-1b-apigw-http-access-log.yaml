id: scsc03-1b-apigw-http-access-log
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany exposes a partner API as an Amazon API Gateway HTTP API. Auditors require a record of every request to the $default stage with the client's source IP address, the request time, the route, the response status, and the request ID, stored in Amazon CloudWatch Logs.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose une API partenaire sous forme d'API HTTP Amazon API Gateway. Les auditeurs exigent un enregistrement de chaque requête vers l'étape $default avec l'adresse IP source du client, l'heure de la requête, la route, le statut de la réponse et l'ID de la requête, stocké dans Amazon CloudWatch Logs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable execution logging at the INFO level with full request and response data on the $default stage, sent to a CloudWatch Logs log group.
        fr: |-
          Activer la journalisation de l'exécution au niveau INFO avec les données complètes des requêtes et des réponses sur l'étape $default, envoyée dans un groupe de journaux CloudWatch Logs.
    - id: b
      text:
        en: |-
          Enable AWS X-Ray tracing on the $default stage, and export the trace segments of every request to a CloudWatch Logs log group.
        fr: |-
          Activer le suivi AWS X-Ray sur l'étape $default, et exporter les segments de trace de chaque requête vers un groupe de journaux CloudWatch Logs.
    - id: c
      text:
        en: |-
          Enable access logging on the $default stage to a log group, with $context.identity.sourceIp, requestTime, routeKey, status, and requestId in the format.
        fr: |-
          Activer la journalisation des accès sur l'étape $default vers un groupe de journaux, avec $context.identity.sourceIp, requestTime, routeKey, status et requestId dans le format.
    - id: d
      text:
        en: |-
          Enable detailed metrics on the $default stage and graph the request count and error metrics of each route in a CloudWatch dashboard.
        fr: |-
          Activer les métriques détaillées sur l'étape $default et représenter dans un tableau de bord CloudWatch le nombre de requêtes et les métriques d'erreur de chaque route.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      HTTP APIs support access logs to CloudWatch Logs, but not execution logs or X-Ray tracing. Access logging is set per stage with a destination log group and a format built from $context variables, so the required fields are written for every request.
    fr: |-
      Les API HTTP prennent en charge les journaux d'accès vers CloudWatch Logs, mais pas les journaux d'exécution ni le suivi X-Ray. La journalisation des accès se définit par étape, avec un groupe de journaux de destination et un format construit à partir de variables $context : les champs requis sont écrits pour chaque requête.
  options:
    a:
      en: |-
        Execution logs are available for REST APIs only; HTTP APIs do not support them.
      fr: |-
        Les journaux d'exécution ne sont disponibles que pour les API REST ; les API HTTP ne les prennent pas en charge.
    b:
      en: |-
        HTTP APIs do not support X-Ray tracing, and traces are not an audit record of every request.
      fr: |-
        Les API HTTP ne prennent pas en charge le suivi X-Ray, et des traces ne constituent pas un enregistrement d'audit de chaque requête.
    d:
      en: |-
        Metrics are aggregated counts per route; they contain neither the client IP address nor the request ID of each request.
      fr: |-
        Les métriques sont des comptages agrégés par route ; elles ne contiennent ni l'adresse IP du client ni l'ID de chaque requête.
references:
  - title: Configure logging for HTTP APIs in API Gateway - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-logging.html
  - title: Choose between REST APIs and HTTP APIs - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-vs-rest.html
