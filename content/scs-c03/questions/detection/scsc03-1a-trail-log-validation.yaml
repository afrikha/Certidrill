id: scsc03-1a-trail-log-validation
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany delivers CloudTrail log files to an S3 bucket in a log archive account. During an investigation, the company must be able to prove to an external auditor that the log files were not modified or deleted after CloudTrail delivered them, and that no log file is missing for the investigated period.

    Which solution will meet these requirements?
  fr: |
    AnyCompany livre les fichiers journaux CloudTrail dans un compartiment S3 d'un compte d'archivage des journaux. Lors d'une investigation, l'entreprise doit pouvoir prouver à un auditeur externe que les fichiers journaux n'ont été ni modifiés ni supprimés après leur livraison par CloudTrail, et qu'aucun fichier journal ne manque pour la période examinée.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on S3 Versioning for the bucket so that every change to a log file creates a new version.
        fr: |-
          Activer S3 Versioning pour le compartiment afin que chaque modification d'un fichier journal crée une nouvelle version.
    - id: b
      text:
        en: |-
          Enable log file integrity validation on the trail, and validate the log files of the period with the AWS CLI.
        fr: |-
          Activer la validation de l'intégrité des fichiers journaux sur le journal de suivi, et valider les fichiers journaux de la période avec l'AWS CLI.
    - id: c
      text:
        en: |-
          Encrypt the log files with SSE-KMS by using a customer managed key that only the security team can use.
        fr: |-
          Chiffrer les fichiers journaux avec SSE-KMS au moyen d'une clé gérée par le client que seule l'équipe de sécurité peut utiliser.
    - id: d
      text:
        en: |-
          Enable S3 server access logging on the log bucket to record every request made to the log files.
        fr: |-
          Activer la journalisation des accès au serveur S3 sur le compartiment des journaux pour enregistrer chaque requête adressée aux fichiers journaux.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With log file integrity validation, CloudTrail hashes every delivered log file with SHA-256 and delivers an hourly digest file, signed with SHA-256 with RSA and chained to the previous digest, that references the log files of the past hour. Validating with the AWS CLI shows whether files were modified or deleted, and whether no files were delivered during a period. Enabling the feature only delivers digest files; the validation itself is a separate step.
    fr: |-
      Avec la validation de l'intégrité des fichiers journaux, CloudTrail calcule un hachage SHA-256 de chaque fichier livré et livre toutes les heures un fichier de synthèse (digest), signé en SHA-256 avec RSA et chaîné au précédent, qui référence les fichiers journaux de l'heure écoulée. La validation avec l'AWS CLI montre si des fichiers ont été modifiés ou supprimés, et si aucun fichier n'a été livré pendant une période. L'activation de la fonctionnalité ne fait que livrer les fichiers de synthèse ; la validation elle-même est une étape distincte.
  options:
    a:
      en: |-
        Versioning keeps object versions, but it gives no signed proof of integrity and cannot show that a log file was never delivered.
      fr: |-
        La gestion des versions conserve les versions des objets, mais n'apporte aucune preuve d'intégrité signée et ne peut pas montrer qu'un fichier journal n'a jamais été livré.
    c:
      en: |-
        Encryption protects the confidentiality of the log files; it does not prove that they were not modified or deleted.
      fr: |-
        Le chiffrement protège la confidentialité des fichiers journaux ; il ne prouve pas qu'ils n'ont été ni modifiés ni supprimés.
    d:
      en: |-
        Server access logs record requests to the bucket, but they offer no integrity validation and cannot prove that every log file was delivered.
      fr: |-
        Les journaux d'accès au serveur enregistrent les requêtes adressées au compartiment, mais n'offrent aucune validation d'intégrité et ne peuvent pas prouver que chaque fichier journal a été livré.
references:
  - title: Validating CloudTrail log file integrity - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
