id: scsc03-1b-sh-findings-history
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses Security Hub CSPM and Amazon Security Lake in the same Regions, with the Log Archive account as the Security Lake delegated administrator. Starting with next year's audit, analysts must be able to run SQL queries on all Security Hub CSPM findings of the previous 12 months, including findings that were resolved and not updated for months. Today, analysts export findings manually from the console when they need them.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany utilise Security Hub CSPM et Amazon Security Lake dans les mêmes Régions, avec le compte Log Archive comme administrateur délégué de Security Lake. À partir de l'audit de l'année prochaine, les analystes doivent pouvoir exécuter des requêtes SQL sur tous les résultats Security Hub CSPM des 12 mois précédents, y compris des résultats résolus et non mis à jour depuis des mois. Aujourd'hui, les analystes exportent manuellement les résultats depuis la console lorsqu'ils en ont besoin.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Add Security Hub CSPM findings as an AWS log source in Security Lake with a retention of at least 12 months, and query the findings table with Amazon Athena.
        fr: |-
          Ajouter les résultats Security Hub CSPM comme source de journaux AWS dans Security Lake avec une conservation d'au moins 12 mois, et interroger la table des résultats avec Amazon Athena.
    - id: b
      text:
        en: |-
          Run the GetFindings API once a year before the audit with a filter on the previous 12 months, and load the results into Amazon Athena.
        fr: |-
          Exécuter l'API GetFindings une fois par an avant l'audit avec un filtre sur les 12 mois précédents, et charger les résultats dans Amazon Athena.
    - id: c
      text:
        en: |-
          Create an automation rule that adds a note to every finding each month so that Security Hub CSPM keeps the findings.
        fr: |-
          Créer une règle d'automatisation qui ajoute une note à chaque résultat chaque mois pour que Security Hub CSPM conserve les résultats.
    - id: d
      text:
        en: |-
          Create a custom insight that groups findings by month, and export the insight results at the end of the year.
        fr: |-
          Créer un aperçu personnalisé qui regroupe les résultats par mois, et exporter les résultats de l'aperçu en fin d'année.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Security Hub CSPM deletes active findings that have not been updated for 90 days and archived findings after 30 days, so it cannot answer a 12-month query by itself. Security Hub CSPM findings are a native Security Lake source; Security Lake keeps them in OCSF with the retention you set, and analysts query them with Athena.
    fr: |-
      Security Hub CSPM supprime les résultats actifs non mis à jour depuis 90 jours et les résultats archivés après 30 jours : il ne peut donc pas répondre seul à une requête sur 12 mois. Les résultats Security Hub CSPM sont une source native de Security Lake ; Security Lake les conserve en OCSF avec la durée que vous définissez, et les analystes les interrogent avec Athena.
  options:
    b:
      en: |-
        Findings that expired during the year are already deleted when the API runs, so the export is incomplete.
      fr: |-
        Les résultats expirés pendant l'année sont déjà supprimés lorsque l'API s'exécute : l'exportation est incomplète.
    c:
      en: |-
        Automation rules run only on findings ingested through BatchImportFindings; they cannot update stored findings on a schedule.
      fr: |-
        Les règles d'automatisation ne s'exécutent que sur les résultats ingérés par BatchImportFindings ; elles ne peuvent pas mettre à jour des résultats stockés selon une planification.
    d:
      en: |-
        An insight shows only the findings that Security Hub CSPM still stores, so an export at the end of the year misses the findings that expired earlier.
      fr: |-
        Un aperçu n'affiche que les résultats que Security Hub CSPM stocke encore : une exportation en fin d'année manque les résultats expirés auparavant.
references:
  - title: Creating and updating findings in Security Hub CSPM - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-findings.html
  - title: Collecting data from AWS services in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/internal-sources.html
