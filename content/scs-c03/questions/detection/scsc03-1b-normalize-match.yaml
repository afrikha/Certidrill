id: scsc03-1b-normalize-match
objective: "1.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team is designing how it will normalize, parse, and correlate its security logs.

    Match each requirement with the AWS service that meets it. Each service can be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe de sécurité d'AnyCompany conçoit la manière dont elle normalisera, analysera et corrélera ses journaux de sécurité.

    Associez chaque exigence au service AWS qui y répond. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lambda, text: "AWS Lambda" }
    - { id: grafana, text: "Amazon Managed Grafana" }
    - { id: opensearch, text: "Amazon OpenSearch Service" }
    - { id: securitylake, text: "Amazon Security Lake" }
    - { id: detective, text: "Amazon Detective" }
    - { id: macie, text: "Amazon Macie" }
  targets:
    - id: t1
      text:
        en: "Run custom code that reshapes each record of an Amazon Data Firehose stream before delivery."
        fr: "Exécuter du code personnalisé qui remodèle chaque enregistrement d'un flux Amazon Data Firehose avant la livraison."
    - id: t2
      text:
        en: "Show CloudWatch metrics, Athena query results, and OpenSearch data on one dashboard, with sign-in through IAM Identity Center."
        fr: "Afficher sur un même tableau de bord des métriques CloudWatch, des résultats de requêtes Athena et des données OpenSearch, avec une connexion par IAM Identity Center."
    - id: t3
      text:
        en: "Evaluate prepackaged Sigma rules against indexed logs and raise alerts on matches."
        fr: "Évaluer des règles Sigma prêtes à l'emploi sur des journaux indexés et déclencher des alertes en cas de correspondance."
    - id: t4
      text:
        en: "Store CloudTrail, VPC Flow Logs, and Route 53 Resolver logs from all accounts in OCSF without writing conversion code."
        fr: "Stocker en OCSF les journaux CloudTrail, VPC Flow Logs et Route 53 Resolver de tous les comptes sans écrire de code de conversion."
answer:
  mapping: { t1: lambda, t2: grafana, t3: opensearch, t4: securitylake }
explanation:
  correct:
    en: "Firehose invokes a Lambda function to transform each batch of records. Managed Grafana workspaces combine built-in data sources such as CloudWatch, Athena, and OpenSearch Service and authenticate users through IAM Identity Center or SAML. OpenSearch Service Security Analytics runs detectors with Sigma rules and alerts. Security Lake normalizes its native AWS sources to OCSF automatically."
    fr: "Firehose appelle une fonction Lambda pour transformer chaque lot d'enregistrements. Les espaces de travail Managed Grafana combinent des sources de données intégrées comme CloudWatch, Athena et OpenSearch Service et authentifient les utilisateurs par IAM Identity Center ou SAML. Security Analytics d'OpenSearch Service exécute des détecteurs avec des règles Sigma et des alertes. Security Lake normalise automatiquement ses sources AWS natives en OCSF."
  options:
    detective:
      en: "Detective builds behavior graphs from findings and logs to investigate them; it does not transform records, build dashboards, or run Sigma rules."
      fr: "Detective construit des graphes de comportement à partir de résultats et de journaux pour les investiguer ; il ne transforme pas d'enregistrements, ne crée pas de tableaux de bord et n'exécute pas de règles Sigma."
    macie:
      en: "Macie discovers sensitive data in S3 buckets; it does not normalize or correlate logs."
      fr: "Macie découvre des données sensibles dans des compartiments S3 ; il ne normalise ni ne corrèle de journaux."
references:
  - title: Security Analytics for Amazon OpenSearch Service - Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/security-analytics.html
  - title: Connect to built-in data sources - Amazon Managed Grafana
    url: https://docs.aws.amazon.com/grafana/latest/userguide/AMG-data-sources-builtin.html
