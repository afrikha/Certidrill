id: scsc03-1a-vpce-denied-outside-org
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's workloads reach Amazon S3 through an interface VPC endpoint whose endpoint policy allows only principals from the company's organization with the aws:PrincipalOrgID condition. The security team suspects that malware on an instance uses access keys from an attacker's own AWS account to upload data to a bucket in that external account. The team needs a log, in the company's account, of the S3 requests that the VPC endpoint denies, including the identity used.

    Which log source should the team configure?
  fr: |
    Les charges de travail d'AnyCompany accèdent à Amazon S3 par un point de terminaison de VPC d'interface dont la politique de point de terminaison n'autorise que les principaux de l'organisation de l'entreprise avec la condition aws:PrincipalOrgID. L'équipe de sécurité soupçonne qu'un logiciel malveillant sur une instance utilise des clés d'accès du propre compte AWS d'un attaquant pour charger des données dans un compartiment de ce compte externe. L'équipe a besoin, dans le compte de l'entreprise, d'un journal des requêtes S3 refusées par le point de terminaison de VPC, avec l'identité utilisée.

    Quelle source de journaux l'équipe doit-elle configurer ?
body:
  options:
    - id: a
      text:
        en: |-
          CloudTrail data events for all S3 buckets on the company's trail, with an advanced event selector on the eventName PutObject.
        fr: |-
          Des événements de données CloudTrail pour tous les compartiments S3 dans le journal de suivi de l'entreprise, avec un sélecteur d'événements avancé sur l'eventName PutObject.
    - id: b
      text:
        en: |-
          VPC Flow Logs on the network interfaces of the VPC endpoint, with all the available fields in a custom format.
        fr: |-
          VPC Flow Logs sur les interfaces réseau du point de terminaison de VPC, avec tous les champs disponibles dans un format personnalisé.
    - id: c
      text:
        en: |-
          S3 server access logs on all the company's buckets, delivered to a central logging bucket.
        fr: |-
          Des journaux d'accès au serveur S3 sur tous les compartiments de l'entreprise, livrés dans un compartiment de journalisation central.
    - id: d
      text:
        en: |-
          CloudTrail network activity events for the s3.amazonaws.com event source, filtered on the VpceAccessDenied error code.
        fr: |-
          Des événements d'activité réseau CloudTrail pour la source d'événements s3.amazonaws.com, filtrés sur le code d'erreur VpceAccessDenied.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Network activity events record AWS API calls made through VPC endpoints and are delivered to the VPC endpoint owner, which lets the company detect credentials from outside its organization that try to use its endpoints. An advanced event selector with the NetworkActivity category, the s3.amazonaws.com event source, and the VpceAccessDenied error code logs only the requests that the endpoint denied, with the caller's identity.
    fr: |-
      Les événements d'activité réseau enregistrent les appels d'API AWS effectués au moyen des points de terminaison de VPC et sont livrés au propriétaire du point de terminaison, ce qui permet à l'entreprise de détecter les informations d'identification extérieures à son organisation qui tentent d'utiliser ses points de terminaison. Un sélecteur d'événements avancé avec la catégorie NetworkActivity, la source d'événements s3.amazonaws.com et le code d'erreur VpceAccessDenied ne journalise que les requêtes refusées par le point de terminaison, avec l'identité de l'appelant.
  options:
    a:
      en: |-
        Data events are logged for accounts that own the bucket or the calling identity; with an external identity and an external bucket, the company's trail does not receive them.
      fr: |-
        Les événements de données sont journalisés pour les comptes propriétaires du compartiment ou de l'identité appelante ; avec une identité et un compartiment externes, le journal de suivi de l'entreprise ne les reçoit pas.
    b:
      en: |-
        Flow logs show IP traffic to the endpoint but contain no API operation, error code, or IAM identity.
      fr: |-
        Les journaux de flux montrent le trafic IP vers le point de terminaison, mais ne contiennent ni opération d'API, ni code d'erreur, ni identité IAM.
    c:
      en: |-
        Server access logs are generated for requests to the company's own buckets, not for requests to a bucket in the attacker's account.
      fr: |-
        Les journaux d'accès au serveur sont générés pour les requêtes adressées aux compartiments de l'entreprise, et non pour les requêtes vers un compartiment du compte de l'attaquant.
references:
  - title: Logging network activity events - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-network-events-with-cloudtrail.html
