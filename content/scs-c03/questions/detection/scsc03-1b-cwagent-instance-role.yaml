id: scsc03-1b-cwagent-instance-role
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany installed the CloudWatch agent on a fleet of EC2 instances through AWS Systems Manager to collect /var/log/secure. The agent status is running, but no log events arrive, and the agent log contains AccessDeniedException errors for logs:PutLogEvents. The instance profile role has only the AmazonSSMManagedInstanceCore managed policy. The security team requires least privilege.

    What should the team do?
  fr: |
    AnyCompany a installé l'agent CloudWatch sur un parc d'instances EC2 par AWS Systems Manager pour collecter /var/log/secure. L'agent est à l'état running, mais aucun événement n'arrive, et le journal de l'agent contient des erreurs AccessDeniedException pour logs:PutLogEvents. Le rôle du profil d'instance ne dispose que de la politique gérée AmazonSSMManagedInstanceCore. L'équipe de sécurité exige le moindre privilège.

    Que doit faire l'équipe ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach the CloudWatchAgentAdminPolicy managed policy to the instance profile role of every instance.
        fr: |-
          Attacher la politique gérée CloudWatchAgentAdminPolicy au rôle du profil d'instance de chaque instance.
    - id: b
      text:
        en: |-
          Create a CloudWatch Logs resource policy that allows ec2.amazonaws.com to call logs:PutLogEvents.
        fr: |-
          Créer une politique de ressource CloudWatch Logs qui autorise ec2.amazonaws.com à appeler logs:PutLogEvents.
    - id: c
      text:
        en: |-
          Attach the CloudWatchAgentServerPolicy managed policy to the instance profile role.
        fr: |-
          Attacher la politique gérée CloudWatchAgentServerPolicy au rôle du profil d'instance.
    - id: d
      text:
        en: |-
          Create an IAM user with the CloudWatchAgentServerPolicy policy and store its access keys in the agent's credentials file on each instance.
        fr: |-
          Créer un utilisateur IAM avec la politique CloudWatchAgentServerPolicy et stocker ses clés d'accès dans le fichier d'informations d'identification de l'agent sur chaque instance.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Every server that runs the CloudWatch agent needs the CloudWatchAgentServerPolicy permissions, which let it write metrics and logs. On EC2, these permissions come from the instance profile role; AmazonSSMManagedInstanceCore only lets Systems Manager manage the instance.
    fr: |-
      Chaque serveur qui exécute l'agent CloudWatch a besoin des autorisations de CloudWatchAgentServerPolicy, qui lui permettent d'écrire des métriques et des journaux. Sur EC2, ces autorisations proviennent du rôle du profil d'instance ; AmazonSSMManagedInstanceCore permet seulement à Systems Manager de gérer l'instance.
  options:
    a:
      en: |-
        The admin policy also grants broad write access to Parameter Store and should be used only on one instance while creating the configuration, so it breaks least privilege.
      fr: |-
        La politique d'administration accorde aussi un large accès en écriture à Parameter Store et ne doit servir que sur une instance, le temps de créer la configuration : elle enfreint le moindre privilège.
    b:
      en: |-
        The agent calls CloudWatch Logs with the instance's role credentials; a resource policy for a service principal does not authorize those calls.
      fr: |-
        L'agent appelle CloudWatch Logs avec les informations d'identification du rôle de l'instance ; une politique de ressource pour un principal de service n'autorise pas ces appels.
    d:
      en: |-
        IAM users with access keys are for on-premises servers; on EC2, long-term keys add risk when an instance role can provide temporary credentials.
      fr: |-
        Les utilisateurs IAM avec clés d'accès sont destinés aux serveurs sur site ; sur EC2, des clés à long terme ajoutent un risque alors qu'un rôle d'instance peut fournir des informations d'identification temporaires.
references:
  - title: Create IAM roles and users for use with the CloudWatch agent - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/create-iam-roles-for-cloudwatch-agent.html
