id: scsc03-1a-gd-numeric-pattern
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany sends Amazon GuardDuty findings to an on-call paging system through an Amazon EventBridge rule and an Amazon SNS topic. The pager must receive every finding with a High or Critical severity, and no Low or Medium finding. The rule uses the following event pattern, where the value of severity is missing:

    ```text
    {
      "source": ["aws.guardduty"],
      "detail-type": ["GuardDuty Finding"],
      "detail": { "severity": SEVERITY_FILTER }
    }
    ```

    Which value should replace SEVERITY_FILTER?
  fr: |
    AnyCompany envoie les résultats Amazon GuardDuty à un système de radiomessagerie d'astreinte au moyen d'une règle Amazon EventBridge et d'une rubrique Amazon SNS. Le système doit recevoir chaque résultat de gravité High ou Critical, et aucun résultat Low ou Medium. La règle utilise le modèle d'événement suivant, dans lequel la valeur de severity est manquante :

    ```text
    {
      "source": ["aws.guardduty"],
      "detail-type": ["GuardDuty Finding"],
      "detail": { "severity": SEVERITY_FILTER }
    }
    ```

    Quelle valeur doit remplacer SEVERITY_FILTER ?
body:
  options:
    - id: a
      text: '`["HIGH", "CRITICAL"]`'
    - id: b
      text: '`[{ "numeric": [">", 7] }]`'
    - id: c
      text: '`[{ "numeric": [">=", 7] }]`'
    - id: d
      text: '`[{ "prefix": "7" }]`'
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In GuardDuty events, severity is a number from 1.0 to 10.0: High is 7.0 to 8.9 and Critical is 9.0 to 10.0. EventBridge numeric matching compares the value as a number, so a numeric filter of greater than or equal to 7 matches every High and Critical finding and no Low or Medium finding.
    fr: |-
      Dans les événements GuardDuty, severity est un nombre compris entre 1,0 et 10,0 : High va de 7,0 à 8,9 et Critical de 9,0 à 10,0. La correspondance numérique d'EventBridge compare la valeur en tant que nombre : un filtre numérique supérieur ou égal à 7 correspond à chaque résultat High et Critical et à aucun résultat Low ou Medium.
  options:
    a:
      en: |-
        The severity field of the event contains a number, not a label, so these strings never match.
      fr: |-
        Le champ severity de l'événement contient un nombre et non un libellé : ces chaînes ne correspondent jamais.
    b:
      en: |-
        A strict greater-than comparison excludes findings with a severity of exactly 7.0, which are High findings.
      fr: |-
        Une comparaison strictement supérieure exclut les résultats de gravité exactement 7,0, qui sont des résultats High.
    d:
      en: |-
        Prefix matching applies to strings, and even as a string it would miss the severities from 8 to 10.
      fr: |-
        La correspondance de préfixe s'applique aux chaînes, et même sous forme de chaîne elle manquerait les gravités de 8 à 10.
references:
  - title: Severity levels of GuardDuty findings - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings-severity.html
  - title: Comparison operators for use in event patterns in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-create-pattern-operators.html
