id: scsc03-1b-athena-cross-account-kms
objective: "1.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's organization trail delivers log files to an S3 bucket in the Log Archive account (111122223333). The log files are encrypted with SSE-KMS by a customer managed key in the same account. Security analysts in the Security Tooling account (444455556666) assume the SecAnalyst role and query the logs with an Amazon Athena table whose location is the Log Archive bucket.

    The SecAnalyst role's IAM policy already allows s3:GetObject and s3:ListBucket on the bucket and kms:Decrypt on the key ARN. Every query fails with an Access Denied error.

    Which combination of changes will allow the analysts to run the queries? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Le journal de suivi d'organisation d'AnyCompany livre ses fichiers journaux dans un compartiment S3 du compte Log Archive (111122223333). Les fichiers journaux sont chiffrés en SSE-KMS par une clé gérée par le client du même compte. Les analystes de sécurité du compte Security Tooling (444455556666) endossent le rôle SecAnalyst et interrogent les journaux avec une table Amazon Athena dont l'emplacement est le compartiment Log Archive.

    La politique IAM du rôle SecAnalyst autorise déjà s3:GetObject et s3:ListBucket sur le compartiment et kms:Decrypt sur l'ARN de la clé. Chaque requête échoue avec une erreur Access Denied.

    Quelle combinaison de modifications permettra aux analystes d'exécuter les requêtes ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a statement to the bucket policy that allows the SecAnalyst role ARN to perform s3:GetObject and s3:ListBucket on the bucket.
        fr: |-
          Ajouter à la politique de compartiment une instruction qui autorise l'ARN du rôle SecAnalyst à effectuer s3:GetObject et s3:ListBucket sur le compartiment.
    - id: b
      text:
        en: |-
          Add kms:GenerateDataKey* for the SecAnalyst role to the statement of the key policy that allows CloudTrail to encrypt the log files.
        fr: |-
          Ajouter kms:GenerateDataKey* pour le rôle SecAnalyst à l'instruction de la politique de clé qui autorise CloudTrail à chiffrer les fichiers journaux.
    - id: c
      text:
        en: |-
          Configure the Athena workgroup to encrypt query results with SSE-KMS by using the same customer managed key.
        fr: |-
          Configurer le groupe de travail Athena pour chiffrer les résultats des requêtes en SSE-KMS avec la même clé gérée par le client.
    - id: d
      text:
        en: |-
          Add a statement to the key policy that allows the SecAnalyst role ARN to perform kms:Decrypt when the CloudTrail encryption context is present.
        fr: |-
          Ajouter à la politique de clé une instruction qui autorise l'ARN du rôle SecAnalyst à effectuer kms:Decrypt lorsque le contexte de chiffrement CloudTrail est présent.
    - id: e
      text:
        en: |-
          Register the Log Archive bucket as a data lake location in AWS Lake Formation in the Security Tooling account.
        fr: |-
          Enregistrer le compartiment Log Archive comme emplacement de lac de données dans AWS Lake Formation dans le compte Security Tooling.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Cross-account access needs both sides: the role's IAM policy in 444455556666 and a resource policy in 111122223333. The bucket policy must grant the role read access to the objects, and the key policy must grant it kms:Decrypt; CloudTrail's documented decrypt statement uses a Null condition on kms:EncryptionContext:aws:cloudtrail:arn.
    fr: |-
      L'accès entre comptes exige les deux côtés : la politique IAM du rôle dans 444455556666 et une politique de ressource dans 111122223333. La politique de compartiment doit accorder au rôle la lecture des objets, et la politique de clé doit lui accorder kms:Decrypt ; l'instruction de déchiffrement documentée par CloudTrail utilise une condition Null sur kms:EncryptionContext:aws:cloudtrail:arn.
  options:
    b:
      en: |-
        GenerateDataKey is used to encrypt new data; reading the log files needs kms:Decrypt, and the role must never be able to write as CloudTrail.
      fr: |-
        GenerateDataKey sert à chiffrer de nouvelles données ; la lecture des fichiers journaux exige kms:Decrypt, et le rôle ne doit pas pouvoir écrire comme CloudTrail.
    c:
      en: |-
        Query result encryption protects the output that Athena writes; it does not give the role permission to read the source objects or decrypt them.
      fr: |-
        Le chiffrement des résultats protège la sortie qu'écrit Athena ; il n'accorde pas au rôle l'autorisation de lire ni de déchiffrer les objets source.
    e:
      en: |-
        The table is a standard AWS Glue table that Athena reads with the caller's IAM permissions; registering the location in Lake Formation does not grant cross-account S3 or KMS access.
      fr: |-
        La table est une table AWS Glue standard qu'Athena lit avec les autorisations IAM de l'appelant ; enregistrer l'emplacement dans Lake Formation n'accorde pas d'accès S3 ou KMS entre comptes.
references:
  - title: Configure AWS KMS key policies for CloudTrail - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/create-kms-key-policy-for-cloudtrail.html
