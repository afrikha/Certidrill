id: scsc03-1a-rds-protection-baseline
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is defining the monitoring requirements for two databases. An Amazon RDS for MySQL instance must be monitored for password-guessing attacks. An Amazon Aurora PostgreSQL cluster, which was created yesterday and runs a supported engine version, must be monitored for anomalous data activity, such as a session that reads far more rows than usual. A security engineer enables GuardDuty RDS Protection in the account.

    Which statement about the resulting monitoring is correct?
  fr: |
    AnyCompany définit les exigences de surveillance de deux bases de données. Une instance Amazon RDS for MySQL doit être surveillée contre les attaques par devinette de mot de passe. Un cluster Amazon Aurora PostgreSQL, créé hier et exécutant une version de moteur prise en charge, doit être surveillé contre les activités de données anormales, comme une session qui lit beaucoup plus de lignes que d'habitude. Un ingénieur sécurité active GuardDuty RDS Protection dans le compte.

    Quelle affirmation sur la surveillance obtenue est correcte ?
body:
  options:
    - id: a
      text:
        en: |-
          Data activity monitoring for the Aurora PostgreSQL cluster starts only after the engineer turns on database activity streams for the cluster.
        fr: |-
          La surveillance des activités de données du cluster Aurora PostgreSQL ne démarre qu'après l'activation des flux d'activité de base de données (database activity streams) sur le cluster.
    - id: b
      text:
        en: |-
          Both databases are covered, but anomaly findings for the new cluster might not appear until GuardDuty completes a learning period of up to two weeks.
        fr: |-
          Les deux bases de données sont couvertes, mais les résultats d'anomalie du nouveau cluster peuvent n'apparaître qu'à la fin d'une période d'apprentissage de GuardDuty pouvant aller jusqu'à deux semaines.
    - id: c
      text:
        en: |-
          RDS Protection monitors only PostgreSQL-based engines, so the RDS for MySQL instance needs a separate login monitoring solution.
        fr: |-
          RDS Protection surveille uniquement les moteurs basés sur PostgreSQL : l'instance RDS for MySQL a besoin d'une solution distincte de surveillance des connexions.
    - id: d
      text:
        en: |-
          GuardDuty needs read access to the database audit logs, so the engineer must publish the logs of both databases to CloudWatch Logs.
        fr: |-
          GuardDuty a besoin d'un accès en lecture aux journaux d'audit des bases de données : l'ingénieur doit publier les journaux des deux bases dans CloudWatch Logs.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      RDS Protection profiles login activity for Aurora MySQL, Aurora PostgreSQL, RDS for PostgreSQL, RDS for MySQL, and RDS for MariaDB, and data activity for the PostgreSQL-based engines, without any infrastructure or database change. Newly created or newly enabled databases have a learning period of up to two weeks to build a baseline, so anomaly findings may not appear immediately.
    fr: |-
      RDS Protection profile l'activité de connexion pour Aurora MySQL, Aurora PostgreSQL, RDS for PostgreSQL, RDS for MySQL et RDS for MariaDB, et l'activité de données pour les moteurs basés sur PostgreSQL, sans infrastructure ni modification de la base. Les bases nouvellement créées ou activées ont une période d'apprentissage pouvant aller jusqu'à deux semaines pour établir une référence : les résultats d'anomalie peuvent ne pas apparaître immédiatement.
  options:
    a:
      en: |-
        RDS Protection collects login and data activity itself; it does not depend on database activity streams.
      fr: |-
        RDS Protection collecte lui-même l'activité de connexion et de données ; il ne dépend pas des flux d'activité de base de données.
    c:
      en: |-
        Login activity monitoring supports RDS for MySQL; only data activity monitoring is limited to PostgreSQL-based engines.
      fr: |-
        La surveillance de l'activité de connexion prend en charge RDS for MySQL ; seule la surveillance de l'activité de données est limitée aux moteurs basés sur PostgreSQL.
    d:
      en: |-
        GuardDuty does not read logs that you publish; it collects the activity independently and does not make the login activity logs available to you.
      fr: |-
        GuardDuty ne lit pas les journaux que vous publiez ; il collecte l'activité de manière indépendante et ne met pas les journaux d'activité de connexion à votre disposition.
references:
  - title: GuardDuty RDS Protection - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/rds-protection.html
