id: scsc03-1a-health-global-events-rule
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany operates only in the eu-central-1 Region. The security team created an Amazon EventBridge rule in eu-central-1 with the event pattern `{"source": ["aws.health"]}` and an Amazon SNS target. The team receives AWS Health events about Amazon EC2 and Amazon RDS in eu-central-1, but it never receives the AWS Health events about AWS Identity and Access Management (IAM) that appear in the AWS Health Dashboard.

    What should the team do to receive these events?
  fr: |
    AnyCompany opère uniquement dans la Région eu-central-1. L'équipe de sécurité a créé dans eu-central-1 une règle Amazon EventBridge avec le modèle d'événement `{"source": ["aws.health"]}` et une cible Amazon SNS. L'équipe reçoit les événements AWS Health concernant Amazon EC2 et Amazon RDS dans eu-central-1, mais elle ne reçoit jamais les événements AWS Health concernant AWS Identity and Access Management (IAM) qui apparaissent dans l'AWS Health Dashboard.

    Que doit faire l'équipe pour recevoir ces événements ?
body:
  options:
    - id: a
      text:
        en: |-
          Create the same rule in the US West (Oregon) Region, which is the backup Region that receives the events of all other Regions.
        fr: |-
          Créer la même règle dans la Région USA Ouest (Oregon), qui est la Région de secours qui reçoit les événements de toutes les autres Régions.
    - id: b
      text:
        en: |-
          Create the same rule in the US East (N. Virginia) Region, where AWS Health delivers events that are not tied to a Region.
        fr: |-
          Créer la même règle dans la Région USA Est (Virginie du Nord), où AWS Health livre les événements qui ne sont pas liés à une Région.
    - id: c
      text:
        en: |-
          Enable the AWS Health organizational view so that events for global services are sent to the eu-central-1 event bus.
        fr: |-
          Activer la vue organisationnelle d'AWS Health afin que les événements des services globaux soient envoyés au bus d'événements d'eu-central-1.
    - id: d
      text:
        en: |-
          Change the event pattern of the existing rule to `{"source": ["aws.iam"]}` so that it matches the IAM events.
        fr: |-
          Remplacer le modèle d'événement de la règle existante par `{"source": ["aws.iam"]}` afin qu'il corresponde aux événements IAM.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Health delivers Regional events in the Region they concern, but events that are not tied to a Region, such as those for IAM, require an EventBridge rule in US East (N. Virginia). Adding the same rule in us-east-1 delivers the global events to the SNS topic, while the eu-central-1 rule keeps handling the Regional events.
    fr: |-
      AWS Health livre les événements régionaux dans la Région concernée, mais les événements qui ne sont pas liés à une Région, comme ceux d'IAM, exigent une règle EventBridge dans USA Est (Virginie du Nord). Ajouter la même règle dans us-east-1 livre les événements globaux à la rubrique SNS, tandis que la règle d'eu-central-1 continue de traiter les événements régionaux.
  options:
    a:
      en: |-
        US West (Oregon) is the backup Region for Regional events of the other Regions; global events require a rule in US East (N. Virginia).
      fr: |-
        USA Ouest (Oregon) est la Région de secours des événements régionaux des autres Régions ; les événements globaux exigent une règle dans USA Est (Virginie du Nord).
    c:
      en: |-
        The organizational view aggregates events across accounts; it does not change the Region in which global events are delivered.
      fr: |-
        La vue organisationnelle agrège les événements de plusieurs comptes ; elle ne change pas la Région dans laquelle les événements globaux sont livrés.
    d:
      en: |-
        AWS Health events always have the source aws.health; a pattern on aws.iam would not match them.
      fr: |-
        Les événements AWS Health ont toujours la source aws.health ; un modèle sur aws.iam ne leur correspondrait pas.
references:
  - title: Creating EventBridge rules for AWS Region coverage - AWS Health
    url: https://docs.aws.amazon.com/health/latest/ug/choosing-a-region.html
