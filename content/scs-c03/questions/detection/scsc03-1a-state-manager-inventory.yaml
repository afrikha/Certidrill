id: scsc03-1a-state-manager-inventory
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team performs a regular assessment to find unauthorized software on its fleet of Amazon EC2 instances. All instances are managed nodes in AWS Systems Manager, and instances are launched and terminated every day. The team needs the list of installed applications for every instance, including new ones, refreshed every 12 hours without anyone starting the collection.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    L'équipe de sécurité d'AnyCompany effectue une évaluation régulière pour trouver les logiciels non autorisés sur son parc d'instances Amazon EC2. Toutes les instances sont des nœuds gérés dans AWS Systems Manager, et des instances sont lancées et résiliées chaque jour. L'équipe a besoin de la liste des applications installées sur chaque instance, y compris les nouvelles, actualisée toutes les 12 heures sans que personne ne lance la collecte.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a maintenance window that runs a shell script on the instances every 12 hours to write the installed packages to an S3 bucket.
        fr: |-
          Créer une fenêtre de maintenance qui exécute toutes les 12 heures un script shell sur les instances pour écrire les packages installés dans un compartiment S3.
    - id: b
      text:
        en: |-
          Run the AWS-GatherSoftwareInventory document once with Run Command on all managed nodes.
        fr: |-
          Exécuter une fois le document AWS-GatherSoftwareInventory avec Run Command sur tous les nœuds gérés.
    - id: c
      text:
        en: |-
          Configure AWS Config to record the AWS::SSM::ManagedInstanceInventory resource type, without any other Systems Manager configuration.
        fr: |-
          Configurer AWS Config pour enregistrer le type de ressource AWS::SSM::ManagedInstanceInventory, sans autre configuration de Systems Manager.
    - id: d
      text:
        en: |-
          Create a State Manager association that runs the AWS-GatherSoftwareInventory document every 12 hours on all managed nodes.
        fr: |-
          Créer une association State Manager qui exécute le document AWS-GatherSoftwareInventory toutes les 12 heures sur tous les nœuds gérés.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A State Manager association applies an SSM document to its targets on a cron or rate schedule, and it can target all managed nodes in the account and Region, so new instances are included automatically. Associating the inventory document with a 12-hour schedule keeps the software inventory current without any manual run.
    fr: |-
      Une association State Manager applique un document SSM à ses cibles selon une planification cron ou rate, et peut cibler tous les nœuds gérés du compte et de la Région : les nouvelles instances sont incluses automatiquement. Associer le document d'inventaire à une planification de 12 heures maintient l'inventaire logiciel à jour sans aucune exécution manuelle.
  options:
    a:
      en: |-
        A custom script and a maintenance window must be written and maintained, while the inventory document already collects application data.
      fr: |-
        Un script personnalisé et une fenêtre de maintenance doivent être écrits et maintenus, alors que le document d'inventaire collecte déjà les données d'applications.
    b:
      en: |-
        A single Run Command execution collects the inventory once; it does not refresh it every 12 hours or cover instances launched later.
      fr: |-
        Une seule exécution de Run Command collecte l'inventaire une fois ; elle ne l'actualise pas toutes les 12 heures et ne couvre pas les instances lancées ensuite.
    c:
      en: |-
        AWS Config can record inventory data only after Systems Manager collects it, so recording the resource type alone produces no inventory.
      fr: |-
        AWS Config ne peut enregistrer les données d'inventaire qu'après leur collecte par Systems Manager : enregistrer le type de ressource seul ne produit aucun inventaire.
references:
  - title: AWS Systems Manager State Manager - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state.html
