id: scsc03-1a-waf-log-bucket-name
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany protects an Application Load Balancer with an AWS WAF web ACL in a workload account. The security team must store the full WAF traffic logs in Amazon S3 for later analysis. An engineer tries to set the logging destination of the web ACL to an existing bucket named central-security-logs in the company's log archive account, but the configuration fails.

    What should the engineer do to store the WAF logs in Amazon S3?
  fr: |
    AnyCompany protège un Application Load Balancer avec une liste ACL web AWS WAF dans un compte de charge de travail. L'équipe de sécurité doit stocker les journaux de trafic WAF complets dans Amazon S3 pour une analyse ultérieure. Un ingénieur tente de définir comme destination de journalisation de la liste ACL web un compartiment existant nommé central-security-logs dans le compte d'archivage des journaux de l'entreprise, mais la configuration échoue.

    Que doit faire l'ingénieur pour stocker les journaux WAF dans Amazon S3 ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on S3 Versioning on the central-security-logs bucket, and retry the logging configuration.
        fr: |-
          Activer S3 Versioning sur le compartiment central-security-logs, et relancer la configuration de journalisation.
    - id: b
      text:
        en: |-
          Encrypt the central-security-logs bucket with the AWS managed key for Amazon S3, and retry the logging configuration.
        fr: |-
          Chiffrer le compartiment central-security-logs avec la clé gérée par AWS pour Amazon S3, et relancer la configuration de journalisation.
    - id: c
      text:
        en: |-
          Add a statement to the policy of the central-security-logs bucket that allows the waf.amazonaws.com service principal to call s3:PutObject.
        fr: |-
          Ajouter à la politique du compartiment central-security-logs une instruction qui autorise le principal de service waf.amazonaws.com à appeler s3:PutObject.
    - id: d
      text:
        en: |-
          Create a bucket in the workload account whose name starts with aws-waf-logs-, and set it as the logging destination.
        fr: |-
          Créer dans le compte de charge de travail un compartiment dont le nom commence par aws-waf-logs-, et le définir comme destination de journalisation.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An S3 logging destination for AWS WAF must be in the same account that manages the web ACL, and its name must start with aws-waf-logs-. Log files are then delivered every 5 minutes, and if the user who configures logging owns the bucket, the required bucket policy for the log delivery service is attached automatically.
    fr: |-
      Une destination de journalisation S3 pour AWS WAF doit se trouver dans le compte qui gère la liste ACL web, et son nom doit commencer par aws-waf-logs-. Les fichiers journaux sont ensuite livrés toutes les 5 minutes, et si l'utilisateur qui configure la journalisation possède le compartiment, la politique de compartiment requise pour le service de livraison des journaux est attachée automatiquement.
  options:
    a:
      en: |-
        Versioning is not a requirement for WAF log delivery; the bucket fails because of its name and account.
      fr: |-
        La gestion des versions n'est pas une exigence de la livraison des journaux WAF ; le compartiment échoue à cause de son nom et de son compte.
    b:
      en: |-
        AWS WAF log delivery supports SSE-S3 and customer managed KMS keys, but not AWS managed KMS keys, and encryption does not fix the bucket name or account.
      fr: |-
        La livraison des journaux AWS WAF prend en charge SSE-S3 et les clés KMS gérées par le client, mais pas les clés KMS gérées par AWS, et le chiffrement ne corrige ni le nom ni le compte du compartiment.
    c:
      en: |-
        WAF logs are written by the delivery.logs.amazonaws.com principal, and a bucket policy does not lift the name and same-account requirements.
      fr: |-
        Les journaux WAF sont écrits par le principal delivery.logs.amazonaws.com, et une politique de compartiment ne lève pas les exigences de nom et de même compte.
references:
  - title: Sending protection pack (web ACL) traffic logs to an Amazon Simple Storage Service bucket - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/logging-s3.html
