id: scsc03-1b-apigw-cloudwatch-role
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys its first Amazon API Gateway REST API in the eu-south-2 Region. When an engineer tries to turn on execution logging at the INFO level for the prod stage, API Gateway returns an error stating that a CloudWatch Logs role ARN must be set in the account settings. The API already works for its clients.

    What should the engineer do to enable execution logging?
  fr: |
    AnyCompany déploie sa première API REST Amazon API Gateway dans la Région eu-south-2. Lorsqu'un ingénieur essaie d'activer la journalisation de l'exécution au niveau INFO pour l'étape prod, API Gateway renvoie une erreur indiquant qu'un ARN de rôle CloudWatch Logs doit être défini dans les paramètres du compte. L'API fonctionne déjà pour ses clients.

    Que doit faire l'ingénieur pour activer la journalisation de l'exécution ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a role that trusts apigateway.amazonaws.com with the AmazonAPIGatewayPushToCloudWatchLogs policy, and set it as cloudWatchRoleArn in eu-south-2.
        fr: |-
          Créer un rôle qui approuve apigateway.amazonaws.com avec la politique AmazonAPIGatewayPushToCloudWatchLogs, et le définir comme cloudWatchRoleArn dans eu-south-2.
    - id: b
      text:
        en: |-
          Add a statement to the resource policy of the REST API that allows the logs.amazonaws.com service principal to call execute-api:Invoke.
        fr: |-
          Ajouter à la politique de ressource de l'API REST une instruction qui autorise le principal de service logs.amazonaws.com à appeler execute-api:Invoke.
    - id: c
      text:
        en: |-
          Create a CloudWatch Logs resource policy in eu-south-2 that allows apigateway.amazonaws.com to call logs:PutLogEvents on all log groups.
        fr: |-
          Créer dans eu-south-2 une politique de ressource CloudWatch Logs qui autorise apigateway.amazonaws.com à appeler logs:PutLogEvents sur tous les groupes de journaux.
    - id: d
      text:
        en: |-
          Attach the AmazonAPIGatewayPushToCloudWatchLogs policy to the IAM role of the Lambda function that integrates with the API.
        fr: |-
          Attacher la politique AmazonAPIGatewayPushToCloudWatchLogs au rôle IAM de la fonction Lambda intégrée à l'API.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      REST API logging uses a role that API Gateway assumes: it must trust apigateway.amazonaws.com and have the AmazonAPIGatewayPushToCloudWatchLogs policy, and its ARN goes into the account-level cloudWatchRoleArn property. This setting is per Region, so a first API in a new Region needs it again.
    fr: |-
      La journalisation des API REST utilise un rôle qu'API Gateway endosse : il doit approuver apigateway.amazonaws.com et disposer de la politique AmazonAPIGatewayPushToCloudWatchLogs, et son ARN se place dans la propriété cloudWatchRoleArn au niveau du compte. Ce paramètre est défini par Région : une première API dans une nouvelle Région en a de nouveau besoin.
  options:
    b:
      en: |-
        The resource policy controls who can invoke the API; it has no role in writing logs.
      fr: |-
        La politique de ressource contrôle qui peut appeler l'API ; elle ne joue aucun rôle dans l'écriture des journaux.
    c:
      en: |-
        REST API execution logging relies on the account-level CloudWatch role, so the error persists until cloudWatchRoleArn is set.
      fr: |-
        La journalisation de l'exécution des API REST s'appuie sur le rôle CloudWatch au niveau du compte : l'erreur persiste tant que cloudWatchRoleArn n'est pas défini.
    d:
      en: |-
        The function's role is used by the function itself; API Gateway does not use it to write its execution logs.
      fr: |-
        Le rôle de la fonction est utilisé par la fonction elle-même ; API Gateway ne l'utilise pas pour écrire ses journaux d'exécution.
references:
  - title: Set up CloudWatch logging for REST APIs in API Gateway - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-logging.html
