id: scsc03-1a-state-manager-desired-state
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany requires an endpoint protection agent to be installed and running on all its Windows and Linux Amazon EC2 instances, which are managed nodes in AWS Systems Manager. During a recent assessment, the agent was found stopped on several instances. The security team wants the agent to be reinstalled or restarted automatically whenever an instance drifts from this configuration.

    Which Systems Manager capability should the team use?
  fr: |
    AnyCompany exige qu'un agent de protection des terminaux soit installé et en cours d'exécution sur toutes ses instances Amazon EC2 Windows et Linux, qui sont des nœuds gérés dans AWS Systems Manager. Lors d'une évaluation récente, l'agent a été trouvé arrêté sur plusieurs instances. L'équipe de sécurité veut que l'agent soit réinstallé ou redémarré automatiquement chaque fois qu'une instance s'écarte de cette configuration.

    Quelle fonctionnalité de Systems Manager l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text:
        en: |-
          A Run Command execution that installs and starts the agent on all managed nodes.
        fr: |-
          Une exécution de Run Command qui installe et démarre l'agent sur tous les nœuds gérés.
    - id: b
      text:
        en: |-
          A State Manager association that installs the agent and starts its service on a schedule.
        fr: |-
          Une association State Manager qui installe l'agent et démarre son service selon une planification.
    - id: c
      text:
        en: |-
          A Patch Manager patch baseline that includes the agent package as an approved patch.
        fr: |-
          Une ligne de base de correctifs Patch Manager qui inclut le package de l'agent comme correctif approuvé.
    - id: d
      text:
        en: |-
          A Session Manager preference document that starts the agent each time an administrator opens a session.
        fr: |-
          Un document de préférences Session Manager qui démarre l'agent chaque fois qu'un administrateur ouvre une session.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      State Manager keeps managed nodes in a defined state and helps prevent configuration drift. An association applies a configuration, such as installing software and keeping its service running, to its targets on a schedule: if the agent is missing, the association installs it, and if the service is stopped, the association starts it.
    fr: |-
      State Manager maintient les nœuds gérés dans un état défini et aide à prévenir la dérive de configuration. Une association applique une configuration, comme l'installation d'un logiciel et le maintien de son service en cours d'exécution, à ses cibles selon une planification : si l'agent manque, l'association l'installe, et si le service est arrêté, l'association le démarre.
  options:
    a:
      en: |-
        Run Command runs the commands once; it does not reapply the configuration when an instance drifts later.
      fr: |-
        Run Command exécute les commandes une seule fois ; il ne réapplique pas la configuration lorsqu'une instance dérive ensuite.
    c:
      en: |-
        Patch baselines define which operating system patches are approved; they do not keep a third-party service running.
      fr: |-
        Les lignes de base de correctifs définissent les correctifs du système d'exploitation approuvés ; elles ne maintiennent pas un service tiers en cours d'exécution.
    d:
      en: |-
        Session preferences configure interactive sessions; the agent would be checked only when someone connects.
      fr: |-
        Les préférences de session configurent les sessions interactives ; l'agent ne serait vérifié que lorsque quelqu'un se connecte.
references:
  - title: AWS Systems Manager State Manager - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state.html
