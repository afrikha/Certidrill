id: scsc03-1b-cwl-transformer-grok
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 60 Amazon CloudWatch Logs log groups in the Standard log class that receive plain-text logs from in-house applications in the same format. The security team wants fields such as user, action, and source IP extracted as the logs arrive, so that metric filters and subscription filters can use these fields. The applications cannot be changed, and the team does not want to write or run code.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany dispose de 60 groupes de journaux Amazon CloudWatch Logs de la classe de journaux Standard qui reçoivent, dans un même format, des journaux en texte brut d'applications internes. L'équipe de sécurité veut que des champs comme l'utilisateur, l'action et l'IP source soient extraits à l'arrivée des journaux, afin que les filtres de métriques et les filtres d'abonnement puissent utiliser ces champs. Les applications ne peuvent pas être modifiées, et l'équipe ne veut ni écrire ni exécuter de code.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Save a CloudWatch Logs Insights query that uses parse to extract the fields, and share it with the team.
        fr: |-
          Enregistrer une requête CloudWatch Logs Insights qui utilise parse pour extraire les champs, et la partager avec l'équipe.
    - id: b
      text:
        en: |-
          Create a subscription filter on each log group that invokes an AWS Lambda function, which parses the events and writes them as JSON to new log groups.
        fr: |-
          Créer sur chaque groupe de journaux un filtre d'abonnement qui appelle une fonction AWS Lambda, laquelle analyse les événements et les écrit en JSON dans de nouveaux groupes de journaux.
    - id: c
      text:
        en: |-
          Create a field index policy for the account that indexes the user, action, and source IP fields.
        fr: |-
          Créer pour le compte une politique d'index de champs qui indexe les champs utilisateur, action et IP source.
    - id: d
      text:
        en: |-
          Create an account-level log transformer with a grok processor that matches the log format and extracts the fields.
        fr: |-
          Créer un transformateur de journaux au niveau du compte avec un processeur grok qui correspond au format des journaux et en extrait les champs.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CloudWatch Logs transformers normalize log events at ingestion for log groups in the Standard class, with parsers such as grok. An account-level transformer covers many log groups at once, and the transformed events can be used by metric filters and subscription filters while the original events are kept.
    fr: |-
      Les transformateurs CloudWatch Logs normalisent les événements à l'ingestion pour les groupes de journaux de la classe Standard, avec des analyseurs comme grok. Un transformateur au niveau du compte couvre de nombreux groupes de journaux à la fois, et les événements transformés peuvent être utilisés par les filtres de métriques et les filtres d'abonnement, tandis que les événements d'origine sont conservés.
  options:
    a:
      en: |-
        parse extracts fields only while a query runs; metric filters and subscription filters never see those fields.
      fr: |-
        parse n'extrait les champs que pendant l'exécution d'une requête ; les filtres de métriques et les filtres d'abonnement ne voient jamais ces champs.
    b:
      en: |-
        This requires writing and running code and duplicates every log event into new log groups.
      fr: |-
        Cela exige d'écrire et d'exécuter du code et duplique chaque événement dans de nouveaux groupes de journaux.
    c:
      en: |-
        Field indexes speed up queries on fields that already exist; they do not extract fields from plain-text messages.
      fr: |-
        Les index de champs accélèrent les requêtes sur des champs qui existent déjà ; ils n'extraient pas de champs de messages en texte brut.
references:
  - title: Transform logs during ingestion - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatch-Logs-Transformation.html
