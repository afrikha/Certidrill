id: scsc03-1a-r53-calculated-threshold
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany serves a public API from six web servers. Each server has its own Amazon Route 53 endpoint health check. During attacks in the past, the on-call security engineer received a notification each time a single server failed, which created alert fatigue. The engineer must now be notified only when fewer than four of the six servers are healthy. The individual health checks must keep working for DNS failover.

    Which solution will meet these requirements?
  fr: |
    AnyCompany sert une API publique à partir de six serveurs web. Chaque serveur dispose de sa propre vérification de l'état Amazon Route 53 de type point de terminaison. Lors d'attaques passées, l'ingénieur sécurité d'astreinte recevait une notification chaque fois qu'un seul serveur tombait en panne, ce qui a créé une lassitude face aux alertes. L'ingénieur ne doit désormais être averti que lorsque moins de quatre des six serveurs sont sains. Les vérifications de l'état individuelles doivent continuer de fonctionner pour le basculement DNS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a calculated health check that monitors the six health checks and reports healthy when at least four are healthy, and create the only alarm on the calculated health check.
        fr: |-
          Créer une vérification de l'état calculée qui surveille les six vérifications et se déclare saine lorsqu'au moins quatre sont saines, et créer l'unique alarme sur la vérification calculée.
    - id: b
      text:
        en: |-
          Set the failure threshold of each of the six health checks to 4, and keep one alarm on each health check.
        fr: |-
          Définir le seuil de défaillance de chacune des six vérifications de l'état à 4, et conserver une alarme sur chaque vérification.
    - id: c
      text:
        en: |-
          Configure the six health checks to use four health checker Regions, and create one alarm that combines their status metrics.
        fr: |-
          Configurer les six vérifications de l'état pour utiliser quatre Régions de vérificateurs, et créer une alarme qui combine leurs métriques d'état.
    - id: d
      text:
        en: |-
          Add string matching to the six health checks so that a server is unhealthy only when the response body changes, and keep one alarm on each health check.
        fr: |-
          Ajouter une correspondance de chaîne aux six vérifications de l'état afin qu'un serveur ne soit défaillant que lorsque le corps de la réponse change, et conserver une alarme sur chaque vérification.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A calculated health check reports healthy or unhealthy based on the status of its child health checks and a threshold of healthy children. The child health checks keep monitoring each server for DNS failover without notifications, and a single alarm on the parent alerts only when fewer than four servers are healthy.
    fr: |-
      Une vérification de l'état calculée se déclare saine ou défaillante selon l'état de ses vérifications enfants et un seuil d'enfants sains. Les vérifications enfants continuent de surveiller chaque serveur pour le basculement DNS sans notification, et une alarme unique sur la vérification parente n'alerte que lorsque moins de quatre serveurs sont sains.
  options:
    b:
      en: |-
        The failure threshold is the number of consecutive failed checks before one endpoint is considered unhealthy; each server still raises its own alarm.
      fr: |-
        Le seuil de défaillance est le nombre de vérifications consécutives échouées avant qu'un point de terminaison soit considéré comme défaillant ; chaque serveur déclenche toujours sa propre alarme.
    c:
      en: |-
        The health checker Regions decide where checks come from, not how many servers must be healthy, so this does not express a four-of-six condition.
      fr: |-
        Les Régions des vérificateurs déterminent d'où proviennent les vérifications, et non combien de serveurs doivent être sains : cela n'exprime pas une condition de quatre sur six.
    d:
      en: |-
        String matching changes what counts as a healthy response for one server; it does not reduce the per-server notifications.
      fr: |-
        La correspondance de chaîne change ce qui compte comme une réponse saine pour un serveur ; elle ne réduit pas les notifications par serveur.
references:
  - title: Types of Amazon Route 53 health checks - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-types.html
