id: scsc03-1a-order-org-conformance-pack
objective: "1.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany wants a security account to deploy an AWS Config conformance pack to all member accounts in AWS Organizations by using the organization conformance pack APIs. AWS Config recording is already enabled in every member account and Region, and the conformance pack template is stored in an S3 bucket that the security account can read. The security team must confirm that the pack was deployed in each account.

    Which three actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany veut qu'un compte de sécurité déploie un pack de conformité AWS Config dans tous les comptes membres d'AWS Organizations à l'aide des API de pack de conformité d'organisation. L'enregistrement AWS Config est déjà activé dans chaque compte membre et chaque Région, et le modèle du pack de conformité est stocké dans un compartiment S3 que le compte de sécurité peut lire. L'équipe de sécurité doit confirmer que le pack a été déployé dans chaque compte.

    Quelles sont les trois actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: status, text: { en: "Call GetOrganizationConformancePackDetailedStatus to review the deployment status in each member account.", fr: "Appeler GetOrganizationConformancePackDetailedStatus pour examiner l'état du déploiement dans chaque compte membre." } }
    - { id: member, text: { en: "Call PutConformancePack in each member account with the same template.", fr: "Appeler PutConformancePack dans chaque compte membre avec le même modèle." } }
    - { id: register, text: { en: "From the management account, register the security account as a delegated administrator for AWS Config.", fr: "À partir du compte de gestion, enregistrer le compte de sécurité comme administrateur délégué d'AWS Config." } }
    - { id: aggregator, text: { en: "Create an organization aggregator so that the conformance pack can be pushed to the source accounts.", fr: "Créer un agrégateur d'organisation afin que le pack de conformité puisse être envoyé aux comptes sources." } }
    - { id: put, text: { en: "From the security account, call PutOrganizationConformancePack with the template location.", fr: "À partir du compte de sécurité, appeler PutOrganizationConformancePack avec l'emplacement du modèle." } }
    - { id: invite, text: { en: "Send an invitation from the security account to each member account to accept the conformance pack.", fr: "Envoyer depuis le compte de sécurité une invitation à chaque compte membre pour qu'il accepte le pack de conformité." } }
answer:
  sequence: [ register, put, status ]
explanation:
  correct:
    en: |-
      Organization conformance packs are deployed from the management account or from a delegated administrator account, so the management account first registers the security account as a delegated administrator. The security account then calls PutOrganizationConformancePack, which deploys the pack to the member accounts in the Region of the call, and GetOrganizationConformancePackDetailedStatus returns the status for each member account.
    fr: |-
      Les packs de conformité d'organisation se déploient à partir du compte de gestion ou d'un compte administrateur délégué : le compte de gestion enregistre d'abord le compte de sécurité comme administrateur délégué. Le compte de sécurité appelle ensuite PutOrganizationConformancePack, qui déploie le pack dans les comptes membres dans la Région de l'appel, et GetOrganizationConformancePackDetailedStatus renvoie l'état de chaque compte membre.
  options:
    member:
      en: |-
        Deploying the pack separately in each account is what the organization API avoids, and it gives no central deployment status.
      fr: |-
        Déployer le pack séparément dans chaque compte est justement ce que l'API d'organisation évite, et cela ne donne aucun état de déploiement central.
    aggregator:
      en: |-
        Aggregators provide a read-only view; rules and conformance packs cannot be deployed through an aggregator.
      fr: |-
        Les agrégateurs offrent une vue en lecture seule ; les règles et les packs de conformité ne peuvent pas être déployés au moyen d'un agrégateur.
    invite:
      en: |-
        Organization conformance packs are deployed through AWS Organizations; member accounts do not accept invitations.
      fr: |-
        Les packs de conformité d'organisation sont déployés au moyen d'AWS Organizations ; les comptes membres n'acceptent pas d'invitations.
references:
  - title: Managing Conformance Packs for AWS Config Across all Accounts in Your Organization - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformance-pack-organization-apis.html
