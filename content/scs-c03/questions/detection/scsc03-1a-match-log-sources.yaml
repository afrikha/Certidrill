id: scsc03-1a-match-log-sources
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team is choosing log sources for an account that stores customer data in Amazon S3 and runs instances in a VPC with interface VPC endpoints.

    Match each logging requirement with the log source that meets it. Each log source can be used once or not at all.
  fr: |
    L'équipe de sécurité d'AnyCompany choisit les sources de journaux d'un compte qui stocke des données clients dans Amazon S3 et exécute des instances dans un VPC doté de points de terminaison de VPC d'interface.

    Associez chaque exigence de journalisation à la source de journaux qui y répond. Chaque source de journaux peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: sal, text: { en: "S3 server access logs", fr: "Journaux d'accès au serveur S3" } }
    - { id: data, text: { en: "CloudTrail data events", fr: "Événements de données CloudTrail" } }
    - { id: network, text: { en: "CloudTrail network activity events", fr: "Événements d'activité réseau CloudTrail" } }
    - { id: flow, text: { en: "VPC Flow Logs", fr: "VPC Flow Logs" } }
    - { id: insights, text: { en: "CloudTrail Insights events", fr: "Événements CloudTrail Insights" } }
  targets:
    - id: t1
      text: { en: "Record S3 Lifecycle expirations and requests that failed authentication.", fr: "Enregistrer les expirations S3 Lifecycle et les requêtes dont l'authentification a échoué." }
    - id: t2
      text: { en: "Record object-level S3 API calls with log file integrity validation and prefix filtering.", fr: "Enregistrer les appels d'API S3 au niveau des objets avec validation de l'intégrité des fichiers journaux et filtrage par préfixe." }
    - id: t3
      text: { en: "Record API calls that a VPC endpoint denied, for the VPC endpoint owner.", fr: "Enregistrer, pour le propriétaire du point de terminaison de VPC, les appels d'API refusés par ce point de terminaison." }
    - id: t4
      text: { en: "Record accepted and rejected IP traffic to and from the instances' network interfaces.", fr: "Enregistrer le trafic IP accepté et rejeté à destination et en provenance des interfaces réseau des instances." }
answer:
  mapping: { t1: sal, t2: data, t3: network, t4: flow }
explanation:
  correct:
    en: |-
      S3 server access logs record authentication failures and Lifecycle transitions, expirations, and restores, which CloudTrail does not log. CloudTrail data events record object-level operations and support integrity validation and prefix-based filtering. Network activity events record API calls made through VPC endpoints for the endpoint owner, including VpceAccessDenied events. VPC Flow Logs capture IP traffic information for network interfaces.
    fr: |-
      Les journaux d'accès au serveur S3 enregistrent les échecs d'authentification ainsi que les transitions, expirations et restaurations S3 Lifecycle, que CloudTrail ne journalise pas. Les événements de données CloudTrail enregistrent les opérations au niveau des objets et prennent en charge la validation de l'intégrité et le filtrage par préfixe. Les événements d'activité réseau enregistrent, pour le propriétaire du point de terminaison, les appels d'API effectués au moyen des points de terminaison de VPC, y compris les événements VpceAccessDenied. VPC Flow Logs capture les informations sur le trafic IP des interfaces réseau.
  options:
    insights:
      en: |-
        Insights events flag unusual rates of API calls or errors compared with a baseline; they are not a record of individual requests or traffic.
      fr: |-
        Les événements Insights signalent des taux inhabituels d'appels d'API ou d'erreurs par rapport à une référence ; ils ne constituent pas un enregistrement des requêtes ou du trafic individuels.
references:
  - title: Logging options for Amazon S3 - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/logging-with-S3.html
  - title: Logging network activity events - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-network-events-with-cloudtrail.html
