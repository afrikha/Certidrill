id: scsc03-1a-match-detection-services
objective: "1.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's security team is mapping the monitoring requirements of a new workload to AWS services.

    Match each monitoring requirement with the AWS service that meets it. Each service can be used once or not at all.
  fr: |
    L'équipe de sécurité d'AnyCompany associe les exigences de surveillance d'une nouvelle charge de travail aux services AWS.

    Associez chaque exigence de surveillance au service AWS qui y répond. Chaque service peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: guardduty, text: Amazon GuardDuty }
    - { id: inspector, text: Amazon Inspector }
    - { id: macie, text: Amazon Macie }
    - { id: config, text: AWS Config }
    - { id: detective, text: Amazon Detective }
  targets:
    - id: t1
      text: { en: "Detect an EC2 instance that communicates with a known command-and-control IP address.", fr: "Détecter une instance EC2 qui communique avec une adresse IP de commande et de contrôle connue." }
    - id: t2
      text: { en: "Identify known CVEs in container images stored in Amazon ECR.", fr: "Identifier les CVE connues dans les images de conteneur stockées dans Amazon ECR." }
    - id: t3
      text: { en: "Find S3 objects that contain passport numbers.", fr: "Trouver les objets S3 qui contiennent des numéros de passeport." }
    - id: t4
      text: { en: "Keep the configuration history of security groups and evaluate it against rules.", fr: "Conserver l'historique de configuration des groupes de sécurité et l'évaluer par rapport à des règles." }
answer:
  mapping: { t1: guardduty, t2: inspector, t3: macie, t4: config }
explanation:
  correct:
    en: |-
      GuardDuty analyzes VPC flow logs, DNS logs, and CloudTrail events with threat intelligence to detect communication with malicious IP addresses. Inspector scans ECR images, EC2 instances, and Lambda functions for known vulnerabilities. Macie uses managed and custom data identifiers to find sensitive data such as passport numbers in S3 objects. AWS Config records configuration changes of resources and evaluates them with Config rules.
    fr: |-
      GuardDuty analyse les journaux de flux VPC, les journaux DNS et les événements CloudTrail avec des renseignements sur les menaces pour détecter les communications avec des adresses IP malveillantes. Inspector analyse les images ECR, les instances EC2 et les fonctions Lambda à la recherche de vulnérabilités connues. Macie utilise des identificateurs de données gérés et personnalisés pour trouver des données sensibles comme des numéros de passeport dans les objets S3. AWS Config enregistre les modifications de configuration des ressources et les évalue avec des règles Config.
  options:
    detective:
      en: |-
        Detective builds a behavior graph to investigate the root cause of findings; it does not perform any of these detections or evaluations itself.
      fr: |-
        Detective construit un graphe de comportement pour enquêter sur la cause racine des résultats ; il n'effectue lui-même aucune de ces détections ou évaluations.
references:
  - title: What is Amazon GuardDuty? - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html
  - title: Automated scan types in Amazon Inspector - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-resources.html
