id: scsc03-1a-order-cross-account-subscription
objective: "1.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team wants the events of a CloudWatch Logs log group in a workload account (the sender) to be streamed in real time to an Amazon Kinesis data stream in a dedicated logging account (the recipient), in the same Region. Permissions are granted directly to the sender account.

    Which four actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    L'équipe de sécurité d'AnyCompany veut que les événements d'un groupe de journaux CloudWatch Logs d'un compte de charge de travail (l'expéditeur) soient diffusés en temps réel vers un flux de données Amazon Kinesis d'un compte de journalisation dédié (le destinataire), dans la même Région. Les autorisations sont accordées directement au compte expéditeur.

    Quelles sont les quatre actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: policy, text: { en: "In the recipient account, attach a destination access policy that allows the sender account to call logs:PutSubscriptionFilter.", fr: "Dans le compte destinataire, attacher une politique d'accès à la destination qui autorise le compte expéditeur à appeler logs:PutSubscriptionFilter." } }
    - { id: senderstream, text: { en: "In the sender account, create a Kinesis data stream that replicates its records to the recipient account.", fr: "Dans le compte expéditeur, créer un flux de données Kinesis qui réplique ses enregistrements vers le compte destinataire." } }
    - { id: stream, text: { en: "In the recipient account, create the Kinesis data stream and an IAM role that CloudWatch Logs can assume to put records into it.", fr: "Dans le compte destinataire, créer le flux de données Kinesis et un rôle IAM que CloudWatch Logs peut assumer pour y écrire des enregistrements." } }
    - { id: filter, text: { en: "In the sender account, create a subscription filter on the log group that uses the destination ARN.", fr: "Dans le compte expéditeur, créer sur le groupe de journaux un filtre d'abonnement qui utilise l'ARN de la destination." } }
    - { id: recipientfilter, text: { en: "In the recipient account, create a subscription filter on the sender's log group.", fr: "Dans le compte destinataire, créer un filtre d'abonnement sur le groupe de journaux de l'expéditeur." } }
    - { id: destination, text: { en: "In the recipient account, create a CloudWatch Logs destination that references the stream and the role.", fr: "Dans le compte destinataire, créer une destination CloudWatch Logs qui référence le flux et le rôle." } }
answer:
  sequence: [ stream, destination, policy, filter ]
explanation:
  correct:
    en: |-
      The recipient account first creates the Kinesis data stream and a role trusted by logs.amazonaws.com that allows kinesis:PutRecord. It then creates the destination with put-destination, which is not usable until a destination access policy grants logs:PutSubscriptionFilter to the sender. Finally, the sender account creates the subscription filter on its log group with the destination ARN; calls from accounts that the policy does not allow are rejected.
    fr: |-
      Le compte destinataire crée d'abord le flux de données Kinesis et un rôle approuvé par logs.amazonaws.com qui autorise kinesis:PutRecord. Il crée ensuite la destination avec put-destination, inutilisable tant qu'une politique d'accès à la destination n'accorde pas logs:PutSubscriptionFilter à l'expéditeur. Enfin, le compte expéditeur crée le filtre d'abonnement sur son groupe de journaux avec l'ARN de la destination ; les appels des comptes que la politique n'autorise pas sont rejetés.
  options:
    senderstream:
      en: |-
        The stream belongs to the recipient account; the sender only needs a subscription filter that points to the destination.
      fr: |-
        Le flux appartient au compte destinataire ; l'expéditeur n'a besoin que d'un filtre d'abonnement qui pointe vers la destination.
    recipientfilter:
      en: |-
        A subscription filter is created on the log group by the account that owns it, the sender.
      fr: |-
        Un filtre d'abonnement est créé sur le groupe de journaux par le compte qui le possède, l'expéditeur.
references:
  - title: "Step 1: Create a destination - Amazon CloudWatch Logs"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CreateDestination.html
