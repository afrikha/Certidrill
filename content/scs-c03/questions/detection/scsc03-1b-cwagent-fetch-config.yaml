id: scsc03-1b-cwagent-fetch-config
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security engineer added an entry for /var/log/audit/audit.log to the collect_list of the CloudWatch agent configuration file /opt/aws/amazon-cloudwatch-agent/bin/config.json on a Linux EC2 instance, then restarted the agent service. The agent status is running and the files that were configured before still arrive in CloudWatch Logs, but no log group is created for the audit log. The instance role has the required permissions.

    Which command should the engineer run?
  fr: |
    Un ingénieur sécurité a ajouté une entrée pour /var/log/audit/audit.log dans la collect_list du fichier de configuration de l'agent CloudWatch /opt/aws/amazon-cloudwatch-agent/bin/config.json sur une instance EC2 Linux, puis a redémarré le service de l'agent. L'agent est à l'état running et les fichiers configurés auparavant arrivent toujours dans CloudWatch Logs, mais aucun groupe de journaux n'est créé pour le journal d'audit. Le rôle de l'instance dispose des autorisations requises.

    Quelle commande l'ingénieur doit-il exécuter ?
body:
  options:
    - id: a
      text: |-
        sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -m ec2 -a status
    - id: b
      text: |-
        sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json
    - id: c
      text: |-
        sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m onPremise -s -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json
    - id: d
      text: |-
        sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-config-wizard
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A restart reuses the configuration that the agent loaded earlier: a changed file takes effect only after fetch-config. The -a fetch-config action loads the latest configuration from the file given with -c, -m ec2 sets the EC2 mode, and -s starts the agent with it.
    fr: |-
      Un redémarrage réutilise la configuration que l'agent a chargée auparavant : un fichier modifié ne prend effet qu'après fetch-config. L'action -a fetch-config charge la dernière configuration depuis le fichier indiqué par -c, -m ec2 définit le mode EC2, et -s démarre l'agent avec elle.
  options:
    a:
      en: |-
        The status action only reports whether the agent is running; it does not load the new configuration.
      fr: |-
        L'action status indique seulement si l'agent est en cours d'exécution ; elle ne charge pas la nouvelle configuration.
    c:
      en: |-
        The onPremise mode is for servers outside AWS; on an EC2 instance that uses its instance role, the mode must be ec2.
      fr: |-
        Le mode onPremise est destiné aux serveurs hors d'AWS ; sur une instance EC2 qui utilise son rôle d'instance, le mode doit être ec2.
    d:
      en: |-
        The wizard creates a new configuration file interactively; it does not apply the edited file to the running agent.
      fr: |-
        L'assistant crée un nouveau fichier de configuration de manière interactive ; il n'applique pas le fichier modifié à l'agent en cours d'exécution.
references:
  - title: Starting the CloudWatch agent - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/start-CloudWatch-Agent-on-premise-SSM-onprem.html
  - title: Troubleshooting the CloudWatch agent - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/troubleshooting-CloudWatch-Agent.html
