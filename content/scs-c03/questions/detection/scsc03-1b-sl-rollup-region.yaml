id: scsc03-1b-sl-rollup-region
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Organizations. The Log Archive account is the delegated administrator for Amazon Security Lake, and Security Lake is enabled for all member accounts in us-east-1, eu-west-1, and ap-southeast-2. Each Region stores its data in its own Security Lake S3 bucket.

    The security operations team works from eu-west-1 and runs Amazon Athena queries through a Security Lake subscriber that it created in eu-west-1. The team must be able to query the data from all three Regions in eu-west-1. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS Organizations. Le compte Log Archive est l'administrateur délégué d'Amazon Security Lake, et Security Lake est activé pour tous les comptes membres dans us-east-1, eu-west-1 et ap-southeast-2. Chaque Région stocke ses données dans son propre compartiment S3 Security Lake.

    L'équipe des opérations de sécurité travaille depuis eu-west-1 et exécute des requêtes Amazon Athena par l'intermédiaire d'un abonné Security Lake qu'elle a créé dans eu-west-1. L'équipe doit pouvoir interroger les données des trois Régions dans eu-west-1. L'entreprise veut la solution qui entraîne le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create two additional subscribers in us-east-1 and ap-southeast-2 that point to the Athena workgroup of the team in eu-west-1.
        fr: |-
          Créer deux abonnés supplémentaires dans us-east-1 et ap-southeast-2 qui pointent vers le groupe de travail Athena de l'équipe dans eu-west-1.
    - id: b
      text:
        en: |-
          Configure S3 Cross-Region Replication from the us-east-1 and ap-southeast-2 Security Lake buckets to the eu-west-1 bucket, and run an AWS Glue crawler on the replicated prefixes.
        fr: |-
          Configurer la réplication S3 entre Régions depuis les compartiments Security Lake d'us-east-1 et d'ap-southeast-2 vers le compartiment d'eu-west-1, et exécuter un robot d'analyse AWS Glue sur les préfixes répliqués.
    - id: c
      text:
        en: |-
          In the delegated administrator account, add eu-west-1 as a rollup Region with us-east-1 and ap-southeast-2 as its contributing Regions, and allow Security Lake to replicate the data.
        fr: |-
          Dans le compte administrateur délégué, ajouter eu-west-1 comme Région de cumul (rollup Region) avec us-east-1 et ap-southeast-2 comme Régions contributrices, et autoriser Security Lake à répliquer les données.
    - id: d
      text:
        en: |-
          Enable cross-Region aggregation in Security Hub CSPM with eu-west-1 as the aggregation Region, and query the aggregated findings with Athena.
        fr: |-
          Activer l'agrégation entre Régions dans Security Hub CSPM avec eu-west-1 comme Région d'agrégation, et interroger les résultats agrégés avec Athena.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A rollup Region consolidates the Security Lake data of its contributing Regions, and Security Lake manages the replication once you grant it permission. A subscriber only reaches the source data of the Region in which it was created, so designating that Region as the rollup Region is the documented way to give it data from several Regions.
    fr: |-
      Une Région de cumul regroupe les données Security Lake de ses Régions contributrices, et Security Lake gère la réplication dès que vous lui en donnez l'autorisation. Un abonné n'accède qu'aux données source de la Région dans laquelle il a été créé : désigner cette Région comme Région de cumul est la méthode documentée pour lui donner les données de plusieurs Régions.
  options:
    a:
      en: |-
        A subscriber accesses only the data of the Region where it is created; subscribers in other Regions do not make that data queryable from eu-west-1.
      fr: |-
        Un abonné n'accède qu'aux données de la Région où il est créé ; des abonnés dans d'autres Régions ne rendent pas ces données interrogeables depuis eu-west-1.
    b:
      en: |-
        Building and maintaining replication and crawlers yourself adds overhead, and the replicated objects would sit outside the tables that Security Lake manages.
      fr: |-
        Construire et maintenir soi-même la réplication et les robots d'analyse ajoute de la charge, et les objets répliqués seraient hors des tables gérées par Security Lake.
    d:
      en: |-
        Security Hub CSPM aggregation covers only findings, not the CloudTrail, VPC Flow Logs, and other sources stored in Security Lake.
      fr: |-
        L'agrégation de Security Hub CSPM ne couvre que les résultats, et non CloudTrail, VPC Flow Logs et les autres sources stockées dans Security Lake.
references:
  - title: Managing Regions in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/manage-regions.html
  - title: Subscriber management in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-management.html
