id: scsc03-1a-logs-anomaly-app-logs
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's payment service writes application logs to a CloudWatch Logs log group. Each line has a log level such as INFO, WARN, or ERROR. The security team wants CloudWatch to surface new or unusual log patterns automatically, such as a new type of authorization error, without writing a filter for each error. The team first created a log anomaly detector on the CloudTrail log group of the account and found the results poor.

    Which solution will meet these requirements?
  fr: |
    Le service de paiement d'AnyCompany écrit des journaux d'application dans un groupe de journaux CloudWatch Logs. Chaque ligne comporte un niveau de journalisation comme INFO, WARN ou ERROR. L'équipe de sécurité veut que CloudWatch fasse ressortir automatiquement les modèles de journaux nouveaux ou inhabituels, comme un nouveau type d'erreur d'autorisation, sans écrire de filtre pour chaque erreur. L'équipe a d'abord créé un détecteur d'anomalies de journaux sur le groupe de journaux CloudTrail du compte et a trouvé les résultats médiocres.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the detector on the CloudTrail log group, and extend its training period so that it learns more of the long JSON events.
        fr: |-
          Conserver le détecteur sur le groupe de journaux CloudTrail, et prolonger sa période d'entraînement afin qu'il apprenne davantage d'événements JSON longs.
    - id: b
      text:
        en: |-
          Create one metric filter for each known error message in the payment log group, with an alarm on each filter.
        fr: |-
          Créer un filtre de métriques pour chaque message d'erreur connu dans le groupe de journaux de paiement, avec une alarme sur chaque filtre.
    - id: c
      text:
        en: |-
          Create a log anomaly detector on the payment service log group.
        fr: |-
          Créer un détecteur d'anomalies de journaux sur le groupe de journaux du service de paiement.
    - id: d
      text:
        en: |-
          Publish VPC Flow Logs of the payment subnets to CloudWatch Logs, and create a log anomaly detector on the flow log group.
        fr: |-
          Publier VPC Flow Logs des sous-réseaux de paiement dans CloudWatch Logs, et créer un détecteur d'anomalies de journaux sur le groupe de journaux de flux.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A log anomaly detector trains on the past two weeks of events in a log group, extracts patterns of static and dynamic content, and flags new patterns, variations of known patterns, and unusual token values, with a severity based on keywords such as ERROR. It works best on application logs that have log levels, like the payment service logs, and creating a detector has no charge.
    fr: |-
      Un détecteur d'anomalies de journaux s'entraîne sur les deux dernières semaines d'événements d'un groupe de journaux, extrait des modèles de contenu statique et dynamique, et signale les nouveaux modèles, les variations de modèles connus et les valeurs de jetons inhabituelles, avec une gravité basée sur des mots-clés comme ERROR. Il fonctionne au mieux sur des journaux d'application dotés de niveaux de journalisation, comme ceux du service de paiement, et la création d'un détecteur n'est pas facturée.
  options:
    a:
      en: |-
        Detection analyzes only the first 1,500 characters of a line, which makes it poorly suited to long JSON events such as CloudTrail records; more training does not change that.
      fr: |-
        La détection n'analyse que les 1 500 premiers caractères d'une ligne, ce qui la rend peu adaptée aux événements JSON longs comme les enregistrements CloudTrail ; davantage d'entraînement n'y change rien.
    b:
      en: |-
        Metric filters match only the errors that are already known, so a new type of error would not be surfaced.
      fr: |-
        Les filtres de métriques ne correspondent qu'aux erreurs déjà connues : un nouveau type d'erreur ne serait pas mis en évidence.
    d:
      en: |-
        Flow logs record network traffic, not application errors, and log anomaly detection is less suited to access logs such as flow logs.
      fr: |-
        Les journaux de flux enregistrent le trafic réseau et non les erreurs d'application, et la détection d'anomalies de journaux convient moins aux journaux d'accès comme les journaux de flux.
references:
  - title: Log anomaly detection - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/LogsAnomalyDetection.html
