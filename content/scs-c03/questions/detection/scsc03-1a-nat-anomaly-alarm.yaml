id: scsc03-1a-nat-anomaly-alarm
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany wants to detect possible data exfiltration from a VPC whose instances reach the internet through a NAT gateway. Outbound traffic varies strongly by hour of the day and by day of the week, so a static threshold on the NAT gateway BytesOutToDestination metric produced many false alarms. Last week, a one-time data migration generated an unusually large transfer that must not be treated as normal behavior. The team wants an alarm that adapts to the usual traffic pattern with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany veut détecter une possible exfiltration de données depuis un VPC dont les instances accèdent à Internet par une passerelle NAT. Le trafic sortant varie fortement selon l'heure de la journée et le jour de la semaine : un seuil statique sur la métrique BytesOutToDestination de la passerelle NAT a produit de nombreuses fausses alarmes. La semaine dernière, une migration de données ponctuelle a généré un transfert inhabituellement important qui ne doit pas être considéré comme un comportement normal. L'équipe veut une alarme qui s'adapte au profil de trafic habituel avec le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a static threshold alarm on BytesOutToDestination at the highest value observed over the past month, excluding the migration day.
        fr: |-
          Créer une alarme à seuil statique sur BytesOutToDestination à la plus haute valeur observée le mois dernier, en excluant le jour de la migration.
    - id: b
      text:
        en: |-
          Publish VPC Flow Logs to CloudWatch Logs, and create a log anomaly detector on the flow log group.
        fr: |-
          Publier VPC Flow Logs dans CloudWatch Logs, et créer un détecteur d'anomalies de journaux sur le groupe de journaux de flux.
    - id: c
      text:
        en: |-
          Publish VPC Flow Logs to CloudWatch Logs, and create a Contributor Insights rule that lists the top destinations by bytes.
        fr: |-
          Publier VPC Flow Logs dans CloudWatch Logs, et créer une règle Contributor Insights qui liste les principales destinations par octets.
    - id: d
      text:
        en: |-
          Create a CloudWatch anomaly detection alarm on BytesOutToDestination, and exclude the migration period from the model training.
        fr: |-
          Créer une alarme de détection d'anomalies CloudWatch sur BytesOutToDestination, et exclure la période de migration de l'entraînement du modèle.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CloudWatch anomaly detection trains a model on up to two weeks of metric data, accounts for hourly, daily, and weekly seasonality and trends, and displays the expected values as a band. An anomaly detection alarm has no static threshold and fires when the value goes above or below the band. Specific time ranges, such as the one-time migration, can be excluded from training so that they are not learned as normal.
    fr: |-
      La détection d'anomalies CloudWatch entraîne un modèle sur un maximum de deux semaines de données de métrique, tient compte de la saisonnalité horaire, quotidienne et hebdomadaire et des tendances, et affiche les valeurs attendues sous forme de bande. Une alarme de détection d'anomalies n'a pas de seuil statique et se déclenche lorsque la valeur passe au-dessus ou en dessous de la bande. Des plages de temps précises, comme la migration ponctuelle, peuvent être exclues de l'entraînement afin de ne pas être apprises comme normales.
  options:
    a:
      en: |-
        A static threshold set at the monthly peak ignores the hourly and weekly pattern, so exfiltration during quiet hours stays below it.
      fr: |-
        Un seuil statique fixé au pic mensuel ignore le profil horaire et hebdomadaire : une exfiltration pendant les heures creuses reste en dessous.
    b:
      en: |-
        Log anomaly detection works on patterns in log text and is less suited to access logs such as VPC flow logs; it does not model traffic volume.
      fr: |-
        La détection d'anomalies de journaux porte sur des modèles dans le texte des journaux et convient moins aux journaux d'accès comme VPC Flow Logs ; elle ne modélise pas le volume de trafic.
    c:
      en: |-
        Contributor Insights shows the top contributors, but it does not learn the normal pattern or alert on deviations from it.
      fr: |-
        Contributor Insights montre les principaux contributeurs, mais n'apprend pas le profil normal et n'alerte pas sur les écarts par rapport à celui-ci.
references:
  - title: Using CloudWatch anomaly detection - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
