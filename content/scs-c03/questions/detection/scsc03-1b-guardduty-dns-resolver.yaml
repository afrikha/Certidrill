id: scsc03-1b-guardduty-dns-resolver
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany enabled Amazon GuardDuty in all accounts. In one VPC, the DHCP options set points the EC2 instances to two self-managed DNS servers on EC2 that forward every query directly to the on-premises DNS servers over AWS Direct Connect. During a test, an instance in this VPC queried a domain on a GuardDuty threat list, but no DNS-based finding was generated. The security team wants GuardDuty to analyze the DNS activity of these instances while keeping on-premises name resolution working.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a activé Amazon GuardDuty dans tous ses comptes. Dans un VPC, le jeu d'options DHCP indique aux instances EC2 deux serveurs DNS autogérés sur EC2, qui transfèrent chaque requête directement aux serveurs DNS sur site par AWS Direct Connect. Lors d'un test, une instance de ce VPC a interrogé un domaine figurant sur une liste de menaces GuardDuty, mais aucun résultat fondé sur le DNS n'a été généré. L'équipe de sécurité veut que GuardDuty analyse l'activité DNS de ces instances tout en conservant la résolution des noms sur site.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable Route 53 Resolver query logging on the VPC and choose GuardDuty as the destination of the query logs.
        fr: |-
          Activer la journalisation des requêtes Route 53 Resolver sur le VPC et choisir GuardDuty comme destination des journaux de requêtes.
    - id: b
      text:
        en: |-
          Create a VPC flow log that captures all traffic of the VPC so that GuardDuty can analyze the port 53 flows.
        fr: |-
          Créer un journal de flux qui capture tout le trafic du VPC afin que GuardDuty puisse analyser les flux sur le port 53.
    - id: c
      text:
        en: |-
          Point the instances to the Amazon-provided Route 53 Resolver, and create a Resolver outbound endpoint with forwarding rules for the on-premises domains.
        fr: |-
          Faire pointer les instances vers le Route 53 Resolver fourni par Amazon, et créer un point de terminaison sortant Resolver avec des règles de transfert pour les domaines sur site.
    - id: d
      text:
        en: |-
          Enable GuardDuty Malware Protection for EC2 on the account so that GuardDuty scans the volumes of the self-managed DNS servers.
        fr: |-
          Activer GuardDuty Malware Protection for EC2 sur le compte afin que GuardDuty analyse les volumes des serveurs DNS autogérés.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      GuardDuty reads DNS logs from its own independent stream, but only for instances that use the AWS DNS resolvers; queries sent to other resolvers are not processed. Moving the instances to the Route 53 Resolver and forwarding the on-premises domains through an outbound endpoint keeps hybrid resolution and gives GuardDuty the DNS activity.
    fr: |-
      GuardDuty lit les journaux DNS depuis son propre flux indépendant, mais uniquement pour les instances qui utilisent les résolveurs DNS d'AWS ; les requêtes envoyées à d'autres résolveurs ne sont pas traitées. Faire passer les instances par le Route 53 Resolver et transférer les domaines sur site par un point de terminaison sortant conserve la résolution hybride et fournit à GuardDuty l'activité DNS.
  options:
    a:
      en: |-
        GuardDuty does not consume your query logs, and GuardDuty is not a query logging destination; the queries also never reach the Route 53 Resolver in this design.
      fr: |-
        GuardDuty ne consomme pas vos journaux de requêtes, et GuardDuty n'est pas une destination de journalisation des requêtes ; dans cette architecture, les requêtes n'atteignent d'ailleurs jamais le Route 53 Resolver.
    b:
      en: |-
        GuardDuty already reads flow log data from its own stream without your flow logs, and flow records do not contain the queried domain names.
      fr: |-
        GuardDuty lit déjà les données des journaux de flux depuis son propre flux, sans vos journaux de flux, et les enregistrements de flux ne contiennent pas les noms de domaine interrogés.
    d:
      en: |-
        Malware Protection scans EBS volumes for malware; it does not analyze DNS queries.
      fr: |-
        Malware Protection analyse les volumes EBS à la recherche de logiciels malveillants ; il n'analyse pas les requêtes DNS.
references:
  - title: GuardDuty foundational data sources - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_data-sources.html
