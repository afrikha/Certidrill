id: scsc03-1a-macie-delegated-admin
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 45 accounts in AWS Organizations, and several teams enabled Amazon Macie in their own accounts. The security team wants to aggregate the Macie findings and S3 bucket inventory data of all accounts in its security tooling account, configure Macie centrally for the member accounts, and make sure that new accounts in the organization are covered without manual steps.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 45 comptes dans AWS Organizations, et plusieurs équipes ont activé Amazon Macie dans leurs propres comptes. L'équipe de sécurité veut agréger les résultats Macie et les données d'inventaire des compartiments S3 de tous les comptes dans son compte d'outils de sécurité, configurer Macie de manière centralisée pour les comptes membres, et s'assurer que les nouveaux comptes de l'organisation sont couverts sans étape manuelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          From the security tooling account, send a Macie membership invitation to each of the 45 accounts in each Region, and ask the teams to accept the invitations.
        fr: |-
          À partir du compte d'outils de sécurité, envoyer une invitation de membre Macie à chacun des 45 comptes dans chaque Région, et demander aux équipes d'accepter les invitations.
    - id: b
      text:
        en: |-
          Designate the security tooling account as the delegated Macie administrator for the organization, add the existing accounts as members, and turn on automatic enablement for new accounts.
        fr: |-
          Désigner le compte d'outils de sécurité comme administrateur Macie délégué de l'organisation, ajouter les comptes existants comme membres, et activer l'activation automatique pour les nouveaux comptes.
    - id: c
      text:
        en: |-
          Use AWS CloudFormation StackSets with automatic deployment to enable Macie in every account, and configure each account to store its findings in its own S3 bucket.
        fr: |-
          Utiliser AWS CloudFormation StackSets avec déploiement automatique pour activer Macie dans chaque compte, et configurer chaque compte pour stocker ses résultats dans son propre compartiment S3.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule in each account that forwards Macie findings to the default event bus of the security tooling account for central processing.
        fr: |-
          Créer dans chaque compte une règle Amazon EventBridge qui transfère les résultats Macie vers le bus d'événements par défaut du compte d'outils de sécurité pour un traitement central.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A delegated Macie administrator enables and manages Macie for the member accounts of the organization, configures their settings, and accesses their S3 inventory data and sensitive data discovery. An administrator that previously used invitations can be designated, and its existing members remain members. Automatic enablement covers accounts that join the organization later.
    fr: |-
      Un administrateur Macie délégué active et gère Macie pour les comptes membres de l'organisation, configure leurs paramètres, et accède à leurs données d'inventaire S3 et à la découverte de données sensibles. Un administrateur qui utilisait auparavant des invitations peut être désigné, et ses membres existants restent membres. L'activation automatique couvre les comptes qui rejoignent l'organisation plus tard.
  options:
    a:
      en: |-
        Invitations require manual acceptance for every account, and new accounts would not be covered automatically.
      fr: |-
        Les invitations exigent une acceptation manuelle pour chaque compte, et les nouveaux comptes ne seraient pas couverts automatiquement.
    c:
      en: |-
        Enabling Macie separately in each account creates no administrator relationship, so findings and inventory data stay in each account.
      fr: |-
        Activer Macie séparément dans chaque compte ne crée aucune relation d'administrateur : les résultats et les données d'inventaire restent dans chaque compte.
    d:
      en: |-
        Forwarding events centralizes notifications only; it gives no central Macie configuration or inventory, and each account needs its own rule.
      fr: |-
        Transférer les événements centralise uniquement les notifications ; cela n'apporte ni configuration Macie centrale ni inventaire, et chaque compte a besoin de sa propre règle.
references:
  - title: Managing multiple Macie accounts with AWS Organizations - Amazon Macie
    url: https://docs.aws.amazon.com/macie/latest/user/accounts-mgmt-ao.html
