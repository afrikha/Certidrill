id: scsc03-1a-acm-imported-expiry-days
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany imports certificates from an external certificate authority into AWS Certificate Manager (ACM) and attaches them to Application Load Balancers. Last quarter, an expired imported certificate caused an outage that was first reported as a man-in-the-middle attack. The security team must be notified through an Amazon SNS topic at least 30 days before any imported certificate expires, so that the operations team can reimport a new certificate in time. The team wants to rely on events that ACM publishes natively.

    Which solution will meet these requirements?
  fr: |
    AnyCompany importe dans AWS Certificate Manager (ACM) des certificats d'une autorité de certification externe et les associe à des Application Load Balancers. Le trimestre dernier, un certificat importé expiré a provoqué une panne d'abord signalée comme une attaque de l'homme du milieu (man-in-the-middle). L'équipe de sécurité doit être avertie au moyen d'une rubrique Amazon SNS au moins 30 jours avant l'expiration de tout certificat importé, afin que l'équipe d'exploitation puisse réimporter un nouveau certificat à temps. L'équipe veut s'appuyer sur les événements qu'ACM publie nativement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule that matches ACM Certificate Renewal Action Required events and targets the SNS topic.
        fr: |-
          Créer une règle Amazon EventBridge qui correspond aux événements ACM Certificate Renewal Action Required et cible la rubrique SNS.
    - id: b
      text:
        en: |-
          Create an Amazon EventBridge rule that matches ACM Certificate Expired events and targets the SNS topic.
        fr: |-
          Créer une règle Amazon EventBridge qui correspond aux événements ACM Certificate Expired et cible la rubrique SNS.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule that matches ACM Certificate Approaching Expiration events and targets the SNS topic.
        fr: |-
          Créer une règle Amazon EventBridge qui correspond aux événements ACM Certificate Approaching Expiration et cible la rubrique SNS.
    - id: d
      text:
        en: |-
          Turn on ACM managed renewal for the imported certificates, and subscribe the SNS topic to the renewal notifications.
        fr: |-
          Activer le renouvellement géré ACM pour les certificats importés, et abonner la rubrique SNS aux notifications de renouvellement.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      ACM sends the Approaching Expiration event daily for each active certificate, starting by default 45 days before expiry for imported and private certificates, and the event includes the DaysToExpiry field. ACM does not renew imported certificates, so this event is the native signal to reimport them, and an EventBridge rule can forward it to SNS or to automation.
    fr: |-
      ACM envoie chaque jour l'événement Approaching Expiration pour chaque certificat actif, à partir de 45 jours avant l'expiration par défaut pour les certificats importés et privés, et l'événement comprend le champ DaysToExpiry. ACM ne renouvelle pas les certificats importés : cet événement est donc le signal natif pour les réimporter, et une règle EventBridge peut le transmettre à SNS ou à une automatisation.
  options:
    a:
      en: |-
        Renewal Action Required events are published when managed renewal of an ACM-issued certificate fails; they are not available for imported certificates.
      fr: |-
        Les événements Renewal Action Required sont publiés lorsque le renouvellement géré d'un certificat émis par ACM échoue ; ils ne sont pas disponibles pour les certificats importés.
    b:
      en: |-
        Certificate Expired events are not available for imported certificates, and an event at expiry is too late to prevent the outage.
      fr: |-
        Les événements Certificate Expired ne sont pas disponibles pour les certificats importés, et un événement à l'expiration arrive trop tard pour éviter la panne.
    d:
      en: |-
        ACM does not renew imported certificates, so there is no managed renewal to turn on for them.
      fr: |-
        ACM ne renouvelle pas les certificats importés : il n'existe pas de renouvellement géré à activer pour eux.
references:
  - title: Amazon EventBridge support for ACM - AWS Certificate Manager
    url: https://docs.aws.amazon.com/acm/latest/userguide/supported-events.html
