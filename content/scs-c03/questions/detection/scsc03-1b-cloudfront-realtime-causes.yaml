id: scsc03-1b-cloudfront-realtime-causes
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany created a CloudFront real-time log configuration that sends logs to an Amazon Kinesis data stream, and attached it to the default cache behavior of a distribution. The stream is encrypted with a customer managed AWS KMS key. The engineer created the IAM role for CloudFront manually. The distribution receives traffic, and the stream is not throttled, but no records arrive in the stream.

    Which two issues could cause this problem? (Choose two.)
  fr: |
    AnyCompany a créé une configuration de journaux en temps réel CloudFront qui envoie les journaux vers un flux de données Amazon Kinesis, et l'a associée au comportement de cache par défaut d'une distribution. Le flux est chiffré avec une clé AWS KMS gérée par le client. L'ingénieur a créé manuellement le rôle IAM destiné à CloudFront. La distribution reçoit du trafic et le flux n'est pas limité (throttled), mais aucun enregistrement n'arrive dans le flux.

    Quels sont les deux problèmes qui pourraient en être la cause ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "The sampling rate of the configuration is set to 100."
        fr: "Le taux d'échantillonnage de la configuration est défini sur 100."
    - id: b
      text:
        en: "The trust policy of the role does not allow cloudfront.amazonaws.com to assume it."
        fr: "La politique d'approbation du rôle n'autorise pas cloudfront.amazonaws.com à l'endosser."
    - id: c
      text:
        en: "The configuration includes all the available log fields."
        fr: "La configuration inclut tous les champs de journal disponibles."
    - id: d
      text:
        en: "Standard logging is turned off for the distribution."
        fr: "La journalisation standard est désactivée pour la distribution."
    - id: e
      text:
        en: "The role's permissions policy does not allow kms:GenerateDataKey on the key of the stream."
        fr: "La politique d'autorisations du rôle n'autorise pas kms:GenerateDataKey sur la clé du flux."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      CloudFront writes to the stream by assuming the role, so the trust policy must allow cloudfront.amazonaws.com (with an aws:SourceAccount condition). For an encrypted stream, the role also needs kms:GenerateDataKey on the KMS key, in addition to the Kinesis put permissions.
    fr: |-
      CloudFront écrit dans le flux en endossant le rôle : la politique d'approbation doit donc autoriser cloudfront.amazonaws.com (avec une condition aws:SourceAccount). Pour un flux chiffré, le rôle a aussi besoin de kms:GenerateDataKey sur la clé KMS, en plus des autorisations d'écriture Kinesis.
  options:
    a:
      en: |-
        A sampling rate of 100 sends a log record for every viewer request; it cannot explain missing records.
      fr: |-
        Un taux d'échantillonnage de 100 envoie un enregistrement pour chaque requête des utilisateurs ; il ne peut pas expliquer l'absence d'enregistrements.
    c:
      en: |-
        You can choose all fields or a subset; including every field only makes each record larger.
      fr: |-
        Vous pouvez choisir tous les champs ou une partie d'entre eux ; inclure tous les champs ne fait qu'agrandir chaque enregistrement.
    d:
      en: |-
        Real-time logs are configured independently of standard logging, which is not a prerequisite.
      fr: |-
        Les journaux en temps réel se configurent indépendamment de la journalisation standard, qui n'est pas un prérequis.
references:
  - title: Use real-time access logs - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/real-time-logs.html
