id: scsc03-1a-logs-centralization-rule
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 200 accounts in AWS Organizations across three AWS Regions. Applications write to many CloudWatch Logs log groups, and new log groups are created every week. The security team wants a copy of all new log events from every account and Region in a central log archive account in eu-west-1, and a second copy in eu-central-1 for resiliency. Accounts created later must be included automatically, and the solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 200 comptes dans AWS Organizations répartis sur trois Régions AWS. Les applications écrivent dans de nombreux groupes de journaux CloudWatch Logs, et de nouveaux groupes de journaux sont créés chaque semaine. L'équipe de sécurité veut une copie de tous les nouveaux événements de journaux de chaque compte et de chaque Région dans un compte central d'archivage des journaux dans eu-west-1, et une seconde copie dans eu-central-1 pour la résilience. Les comptes créés ultérieurement doivent être inclus automatiquement, et la solution doit exiger le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a subscription filter on each log group in every account that sends the events through a CloudWatch Logs destination to a Kinesis data stream in the log archive account.
        fr: |-
          Créer sur chaque groupe de journaux de chaque compte un filtre d'abonnement qui envoie les événements, par une destination CloudWatch Logs, vers un flux de données Kinesis du compte d'archivage.
    - id: b
      text:
        en: |-
          Configure CloudWatch cross-account observability for the organization, with the log archive account as the monitoring account and all log groups shared.
        fr: |-
          Configurer l'observabilité inter-comptes CloudWatch pour l'organisation, avec le compte d'archivage des journaux comme compte de surveillance et tous les groupes de journaux partagés.
    - id: c
      text:
        en: |-
          Schedule a daily CloudWatch Logs export task for each log group in each account and Region that copies the log events to an S3 bucket in the log archive account.
        fr: |-
          Planifier pour chaque groupe de journaux, dans chaque compte et chaque Région, une tâche d'exportation CloudWatch Logs quotidienne qui copie les événements dans un compartiment S3 du compte d'archivage.
    - id: d
      text:
        en: |-
          Create a CloudWatch Logs centralization rule for the organization and the three Regions, with the log archive account as destination, eu-west-1 as destination Region, and eu-central-1 as backup.
        fr: |-
          Créer une règle de centralisation CloudWatch Logs pour l'organisation et les trois Régions, avec le compte d'archivage comme destination, eu-west-1 comme Région de destination et eu-central-1 comme Région de secours.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CloudWatch Logs centralization uses AWS Organizations to copy log events at ingestion time from member accounts and Regions into a destination account, according to centralization rules managed by the management account or a delegated administrator. A rule selects the source accounts (for example, the whole organization), the source Regions, the log groups, a destination Region, and an optional backup Region for a second copy. Only data that arrives after the rule is created is centralized.
    fr: |-
      La centralisation CloudWatch Logs utilise AWS Organizations pour copier, au moment de l'ingestion, les événements de journaux des comptes membres et des Régions vers un compte de destination, selon des règles de centralisation gérées par le compte de gestion ou un administrateur délégué. Une règle sélectionne les comptes sources (par exemple toute l'organisation), les Régions sources, les groupes de journaux, une Région de destination et une Région de secours facultative pour une seconde copie. Seules les données arrivées après la création de la règle sont centralisées.
  options:
    a:
      en: |-
        Subscription filters must be created on each log group, including the new ones every week, and the stream and destinations must be operated in each Region.
      fr: |-
        Les filtres d'abonnement doivent être créés sur chaque groupe de journaux, y compris les nouveaux chaque semaine, et le flux et les destinations doivent être exploités dans chaque Région.
    b:
      en: |-
        Cross-account observability lets a monitoring account view data in the source accounts within a Region; it does not store copies in the monitoring account or a backup Region.
      fr: |-
        L'observabilité inter-comptes permet à un compte de surveillance de consulter les données des comptes sources dans une Région ; elle ne stocke pas de copies dans le compte de surveillance ni dans une Région de secours.
    c:
      en: |-
        Export tasks must be scheduled and maintained for every log group, account, and Region, including the new log groups, deliver data only once a day, and keep no second copy in eu-central-1.
      fr: |-
        Les tâches d'exportation doivent être planifiées et maintenues pour chaque groupe de journaux, compte et Région, y compris les nouveaux groupes, ne livrent les données qu'une fois par jour et ne conservent aucune seconde copie dans eu-central-1.
references:
  - title: Cross-account cross-Region log centralization - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html
