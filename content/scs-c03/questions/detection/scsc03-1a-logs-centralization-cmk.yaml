id: scsc03-1a-logs-centralization-cmk
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is creating a CloudWatch Logs centralization rule that copies the log groups of all member accounts to a log archive account, with eu-west-1 as the destination Region and eu-central-1 as the backup Region. Many source log groups are encrypted with customer managed KMS keys that belong to the member accounts. Security policy requires the centralized copies to be encrypted with customer managed keys that the log archive account owns, and no log group may be skipped.

    Which solution will meet these requirements?
  fr: |
    AnyCompany crée une règle de centralisation CloudWatch Logs qui copie les groupes de journaux de tous les comptes membres vers un compte d'archivage des journaux, avec eu-west-1 comme Région de destination et eu-central-1 comme Région de secours. De nombreux groupes de journaux sources sont chiffrés avec des clés KMS gérées par le client qui appartiennent aux comptes membres. La politique de sécurité exige que les copies centralisées soient chiffrées avec des clés gérées par le client détenues par le compte d'archivage, et aucun groupe de journaux ne doit être ignoré.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a customer managed key in both Regions in the log archive account, tag each key with LogsManaged = true, allow CloudWatch Logs in the key policies, and give both key ARNs in the rule.
        fr: |-
          Créer une clé gérée par le client dans les deux Régions du compte d'archivage, baliser chaque clé avec LogsManaged = true, autoriser CloudWatch Logs dans les politiques de clé, et indiquer les deux ARN de clé dans la règle.
    - id: b
      text:
        en: |-
          Create grants on the source keys for the log archive account in both Regions so that the centralized copies stay encrypted with the member accounts' own keys.
        fr: |-
          Créer sur les clés sources des octrois (grants) pour le compte d'archivage dans les deux Régions afin que les copies centralisées restent chiffrées avec les propres clés des comptes membres.
    - id: c
      text:
        en: |-
          Choose the rule option that centralizes the log groups encrypted with customer managed keys into new destination log groups encrypted with an AWS owned key.
        fr: |-
          Choisir l'option de la règle qui centralise les groupes de journaux chiffrés avec des clés gérées par le client dans de nouveaux groupes de destination chiffrés avec une clé détenue par AWS.
    - id: d
      text:
        en: |-
          Create one customer managed key in eu-west-1 in the log archive account with the LogsManaged = true tag, and choose the option to skip destinations that have no customer managed key.
        fr: |-
          Créer une clé gérée par le client dans eu-west-1 dans le compte d'archivage avec la balise LogsManaged = true, et choisir l'option qui ignore les destinations dépourvues de clé gérée par le client.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      For source log groups encrypted with customer managed keys, a centralization rule can copy the data into destination log groups encrypted with destination-specific customer managed keys, given as key ARNs for the primary Region and, if used, the backup Region. These destination keys must have the LogsManaged = true tag and a key policy that lets CloudWatch Logs use them.
    fr: |-
      Pour les groupes de journaux sources chiffrés avec des clés gérées par le client, une règle de centralisation peut copier les données dans des groupes de destination chiffrés avec des clés gérées par le client propres à la destination, fournies sous forme d'ARN pour la Région principale et, le cas échéant, la Région de secours. Ces clés de destination doivent porter la balise LogsManaged = true et avoir une politique de clé qui permet à CloudWatch Logs de les utiliser.
  options:
    b:
      en: |-
        Centralization does not reuse the source keys; the copies are encrypted with a destination key or an AWS owned key, according to the option chosen in the rule.
      fr: |-
        La centralisation ne réutilise pas les clés sources ; les copies sont chiffrées avec une clé de destination ou une clé détenue par AWS, selon l'option choisie dans la règle.
    c:
      en: |-
        An AWS owned key is not a customer managed key owned by the log archive account, so the policy would not be met.
      fr: |-
        Une clé détenue par AWS n'est pas une clé gérée par le client détenue par le compte d'archivage : la politique ne serait pas respectée.
    d:
      en: |-
        Without a key in eu-central-1, the backup copies would be skipped, and the policy forbids skipping log groups.
      fr: |-
        Sans clé dans eu-central-1, les copies de secours seraient ignorées, et la politique interdit d'ignorer des groupes de journaux.
references:
  - title: Cross-account cross-Region log centralization - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html
