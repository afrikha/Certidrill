id: scsc03-1b-os-security-lake-query
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's Log Archive account is the Amazon Security Lake delegated administrator. The threat-hunting team works in a separate Security Tooling account and uses Amazon OpenSearch Service. The team wants to run interactive queries on the Security Lake data from OpenSearch without building an ingestion pipeline and without copying the raw data into a domain.

    Which solution will meet these requirements?
  fr: |
    Le compte Log Archive d'AnyCompany est l'administrateur délégué d'Amazon Security Lake. L'équipe de chasse aux menaces travaille dans un compte Security Tooling distinct et utilise Amazon OpenSearch Service. L'équipe veut exécuter des requêtes interactives sur les données Security Lake depuis OpenSearch, sans construire de pipeline d'ingestion et sans copier les données brutes dans un domaine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an OpenSearch Ingestion pipeline in the Security Tooling account with an S3 source that reads the Security Lake buckets.
        fr: |-
          Créer dans le compte Security Tooling un pipeline OpenSearch Ingestion avec une source S3 qui lit les compartiments Security Lake.
    - id: b
      text:
        en: |-
          Create a Security Lake subscriber with query access for the Security Tooling account, then create an OpenSearch Service direct query data source for Security Lake in that account.
        fr: |-
          Créer un abonné Security Lake avec accès aux requêtes pour le compte Security Tooling, puis créer dans ce compte une source de données de requête directe (direct query) OpenSearch Service pour Security Lake.
    - id: c
      text:
        en: |-
          Create a Security Lake subscriber with data access and an SQS queue, and an AWS Lambda function that indexes each new object into an OpenSearch Service domain.
        fr: |-
          Créer un abonné Security Lake avec accès aux données et une file d'attente SQS, ainsi qu'une fonction AWS Lambda qui indexe chaque nouvel objet dans un domaine OpenSearch Service.
    - id: d
      text:
        en: |-
          Create an OpenSearch Service direct query data source for Security Lake in the Security Tooling account, without any Security Lake subscriber.
        fr: |-
          Créer dans le compte Security Tooling une source de données de requête directe OpenSearch Service pour Security Lake, sans aucun abonné Security Lake.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      OpenSearch Service can query Security Lake data in place through a direct query data source, with table permissions managed in AWS Lake Formation. When the queries run from an account other than the delegated administrator account, a Security Lake subscriber with query access must be set up for that account first.
    fr: |-
      OpenSearch Service peut interroger les données Security Lake sur place au moyen d'une source de données de requête directe, avec des autorisations de tables gérées dans AWS Lake Formation. Lorsque les requêtes s'exécutent depuis un autre compte que le compte administrateur délégué, un abonné Security Lake avec accès aux requêtes doit d'abord être configuré pour ce compte.
  options:
    a:
      en: |-
        An ingestion pipeline copies the data into a domain or collection, which the team wants to avoid.
      fr: |-
        Un pipeline d'ingestion copie les données dans un domaine ou une collection, ce que l'équipe veut éviter.
    c:
      en: |-
        This builds a custom ingestion pipeline and copies every object into a domain.
      fr: |-
        Cette solution construit un pipeline d'ingestion personnalisé et copie chaque objet dans un domaine.
    d:
      en: |-
        Without a query access subscriber, the Security Tooling account has no Lake Formation access to the Security Lake tables of the delegated administrator.
      fr: |-
        Sans abonné avec accès aux requêtes, le compte Security Tooling n'a aucun accès Lake Formation aux tables Security Lake de l'administrateur délégué.
references:
  - title: Directly querying Amazon Security Lake data in OpenSearch Service - Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/direct-query-security-lake-overview.html
  - title: Managing query access for Security Lake subscribers - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-query-access.html
