id: scsc03-1b-sl-siem-data-access
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany collects CloudTrail management events, VPC Flow Logs, and Route 53 Resolver query logs in Amazon Security Lake. The company also runs a third-party SIEM in a separate AWS account that the vendor manages.

    The SIEM must ingest the raw Security Lake objects for these sources as soon as Security Lake writes them. The SIEM's collector can only poll an Amazon SQS queue for new-object notifications and then read the objects from Amazon S3. The SIEM must not query tables.

    Which solution will meet these requirements?
  fr: |
    AnyCompany collecte les événements de gestion CloudTrail, les VPC Flow Logs et les journaux de requêtes Route 53 Resolver dans Amazon Security Lake. L'entreprise exploite aussi un SIEM tiers dans un compte AWS distinct géré par l'éditeur.

    Le SIEM doit ingérer les objets bruts Security Lake de ces sources dès que Security Lake les écrit. Le collecteur du SIEM peut uniquement interroger une file d'attente Amazon SQS pour recevoir les notifications de nouveaux objets, puis lire les objets depuis Amazon S3. Le SIEM ne doit pas interroger de tables.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Security Lake subscriber with data access for the vendor's account and the three sources, and choose an SQS queue as the notification method.
        fr: |-
          Créer un abonné Security Lake avec accès aux données (data access) pour le compte de l'éditeur et les trois sources, et choisir une file d'attente SQS comme méthode de notification.
    - id: b
      text:
        en: |-
          Create a Security Lake subscriber with query access for the vendor's account and the three sources, and have the SIEM accept the AWS Lake Formation share.
        fr: |-
          Créer un abonné Security Lake avec accès aux requêtes (query access) pour le compte de l'éditeur et les trois sources, et faire accepter le partage AWS Lake Formation par le SIEM.
    - id: c
      text:
        en: |-
          Create a CloudWatch Logs subscription filter on the Security Lake log groups that sends the records to an SQS queue in the vendor's account.
        fr: |-
          Créer un filtre d'abonnement CloudWatch Logs sur les groupes de journaux Security Lake qui envoie les enregistrements vers une file d'attente SQS du compte de l'éditeur.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule that matches Security Hub CSPM findings and sends them to an SQS queue in the vendor's account.
        fr: |-
          Créer une règle Amazon EventBridge qui correspond aux résultats Security Hub CSPM et les envoie vers une file d'attente SQS du compte de l'éditeur.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A data access subscriber reads the S3 objects directly and is notified as new objects are written for its sources. Notifications go to an HTTPS endpoint by default, or to an SQS queue that the subscriber polls, which matches the collector of this SIEM.
    fr: |-
      Un abonné avec accès aux données lit directement les objets S3 et reçoit une notification à chaque nouvel objet écrit pour ses sources. Les notifications vont par défaut vers un point de terminaison HTTPS, ou vers une file d'attente SQS que l'abonné interroge, ce qui correspond au collecteur de ce SIEM.
  options:
    b:
      en: |-
        Query access lets the subscriber query the Lake Formation tables with services such as Athena; it does not send new-object notifications, and the SIEM must not query tables.
      fr: |-
        L'accès aux requêtes permet à l'abonné d'interroger les tables Lake Formation avec des services comme Athena ; il n'envoie pas de notifications de nouveaux objets, et le SIEM ne doit pas interroger de tables.
    c:
      en: |-
        Security Lake stores its data as objects in S3 buckets, not in CloudWatch Logs log groups, so there is no log group to subscribe to.
      fr: |-
        Security Lake stocke ses données sous forme d'objets dans des compartiments S3, et non dans des groupes de journaux CloudWatch Logs : il n'y a pas de groupe de journaux auquel s'abonner.
    d:
      en: |-
        Security Hub CSPM findings are not the requested sources, and this rule does not deliver the raw Security Lake objects.
      fr: |-
        Les résultats Security Hub CSPM ne sont pas les sources demandées, et cette règle ne livre pas les objets bruts de Security Lake.
references:
  - title: Managing data access for Security Lake subscribers - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-data-access.html
  - title: Subscriber management in Security Lake - Amazon Security Lake
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-management.html
