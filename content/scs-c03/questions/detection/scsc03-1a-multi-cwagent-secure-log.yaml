id: scsc03-1a-multi-cwagent-secure-log
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has installed the CloudWatch agent on Amazon Linux EC2 instances in a single account. The security team wants the /var/log/secure file of every instance to be sent to a log group named /security/linux, with one log stream for each instance, and the log events must be kept for 1 year. The agent currently runs with its default settings.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    AnyCompany a installé l'agent CloudWatch sur des instances EC2 Amazon Linux dans un seul compte. L'équipe de sécurité veut que le fichier /var/log/secure de chaque instance soit envoyé dans un groupe de journaux nommé /security/linux, avec un flux de journaux par instance, et les événements de journaux doivent être conservés 1 an. L'agent s'exécute actuellement avec ses paramètres par défaut.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set run_as_user to a dedicated non-root user in the agent section of the configuration so that the agent runs with fewer privileges.
        fr: |-
          Définir run_as_user sur un utilisateur dédié non root dans la section agent de la configuration afin que l'agent s'exécute avec moins de privilèges.
    - id: b
      text:
        en: |-
          Add an entry to logs_collected files collect_list with file_path /var/log/secure, log_group_name /security/linux, log_stream_name {instance_id}, and retention_in_days 365.
        fr: |-
          Ajouter une entrée à logs_collected files collect_list avec file_path /var/log/secure, log_group_name /security/linux, log_stream_name {instance_id} et retention_in_days 365.
    - id: c
      text:
        en: |-
          Create a metric filter on the /security/linux log group before the agent starts sending the events of /var/log/secure.
        fr: |-
          Créer un filtre de métriques sur le groupe de journaux /security/linux avant que l'agent commence à envoyer les événements de /var/log/secure.
    - id: d
      text:
        en: |-
          Add a credentials role_arn to the agent section of the configuration that points to the instance role of each instance.
        fr: |-
          Ajouter à la section agent de la configuration un role_arn de credentials qui pointe vers le rôle d'instance de chaque instance.
    - id: e
      text:
        en: |-
          Attach the CloudWatchAgentServerPolicy managed policy to the IAM role of the instance profile that the instances use.
        fr: |-
          Attacher la politique gérée CloudWatchAgentServerPolicy au rôle IAM du profil d'instance utilisé par les instances.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      The files collect_list of the logs section lists each file to upload with its log group and log stream, which can use the {instance_id} variable, and retention_in_days sets the retention of a new log group (365 for 1 year). The agent sends the events with the credentials of the instance role, which needs the CloudWatchAgentServerPolicy permissions.
    fr: |-
      La section files collect_list de la partie logs liste chaque fichier à charger avec son groupe et son flux de journaux, qui peut utiliser la variable {instance_id}, et retention_in_days définit la rétention d'un nouveau groupe de journaux (365 pour 1 an). L'agent envoie les événements avec les informations d'identification du rôle d'instance, qui a besoin des autorisations de CloudWatchAgentServerPolicy.
  options:
    a:
      en: |-
        The agent runs as root by default; a non-root user typically cannot read /var/log/secure, so this change would break the collection.
      fr: |-
        L'agent s'exécute par défaut en tant que root ; un utilisateur non root ne peut généralement pas lire /var/log/secure, et cette modification casserait la collecte.
    c:
      en: |-
        Metric filters turn log events into metrics; they are not required for the agent to deliver the events.
      fr: |-
        Les filtres de métriques transforment des événements de journaux en métriques ; ils ne sont pas nécessaires pour que l'agent livre les événements.
    d:
      en: |-
        role_arn is used to send data to another account; within the same account, the agent already uses the instance role.
      fr: |-
        role_arn sert à envoyer les données vers un autre compte ; dans le même compte, l'agent utilise déjà le rôle d'instance.
references:
  - title: Manually create or edit the CloudWatch agent configuration file - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
