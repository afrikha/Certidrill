id: scsc03-1a-gd-single-admin-regions
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses Amazon GuardDuty in us-east-1 and eu-west-1 for all accounts in AWS Organizations. The European security team owns account 555555555555 and wants to manage GuardDuty for the organization in eu-west-1, while the global security team wants account 111122223333 to manage it in us-east-1. The European team must be able to view the findings of all member accounts in eu-west-1 only. The company wants to follow the principle of least privilege.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise Amazon GuardDuty dans us-east-1 et eu-west-1 pour tous les comptes d'AWS Organizations. L'équipe de sécurité européenne possède le compte 555555555555 et veut gérer GuardDuty pour l'organisation dans eu-west-1, tandis que l'équipe de sécurité mondiale veut que le compte 111122223333 le gère dans us-east-1. L'équipe européenne doit pouvoir consulter les résultats de tous les comptes membres dans eu-west-1 uniquement. L'entreprise veut respecter le principe du moindre privilège.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Designate account 555555555555 as the delegated GuardDuty administrator in eu-west-1 and account 111122223333 in us-east-1, and give each team access to its own account.
        fr: |-
          Désigner le compte 555555555555 comme administrateur GuardDuty délégué dans eu-west-1 et le compte 111122223333 dans us-east-1, et donner à chaque équipe l'accès à son propre compte.
    - id: b
      text:
        en: |-
          Designate the organization's management account as the delegated GuardDuty administrator in both Regions, and give both teams roles in the management account.
        fr: |-
          Désigner le compte de gestion de l'organisation comme administrateur GuardDuty délégué dans les deux Régions, et donner aux deux équipes des rôles dans le compte de gestion.
    - id: c
      text:
        en: |-
          Keep GuardDuty unmanaged by Organizations in eu-west-1, and have account 555555555555 invite the member accounts of that Region and act as their administrator.
        fr: |-
          Laisser GuardDuty non géré par Organizations dans eu-west-1, et faire inviter par le compte 555555555555 les comptes membres de cette Région pour qu'il en soit l'administrateur.
    - id: d
      text:
        en: |-
          Designate account 111122223333 as the delegated administrator in both Regions, and give the European team a role in it that allows GuardDuty read actions only if aws:RequestedRegion is eu-west-1.
        fr: |-
          Désigner le compte 111122223333 comme administrateur délégué dans les deux Régions, et y donner à l'équipe européenne un rôle qui n'autorise les actions de lecture GuardDuty que si aws:RequestedRegion vaut eu-west-1.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The delegated GuardDuty administrator is designated per Region, but the same member account must be designated in all the Regions where GuardDuty is enabled; two different accounts cannot be used. The European team can then use a role in the administrator account whose policy allows only GuardDuty read actions and uses the aws:RequestedRegion condition key to restrict the team to eu-west-1.
    fr: |-
      L'administrateur GuardDuty délégué est désigné par Région, mais le même compte membre doit être désigné dans toutes les Régions où GuardDuty est activé ; deux comptes différents ne peuvent pas être utilisés. L'équipe européenne peut alors utiliser, dans le compte administrateur, un rôle dont la politique n'autorise que les actions de lecture GuardDuty et utilise la clé de condition aws:RequestedRegion pour limiter l'équipe à eu-west-1.
  options:
    a:
      en: |-
        GuardDuty requires one delegated administrator account across all Regions, so designating different accounts per Region is not allowed.
      fr: |-
        GuardDuty exige un même compte administrateur délégué dans toutes les Régions : désigner des comptes différents selon la Région n'est pas autorisé.
    b:
      en: |-
        AWS does not recommend the management account as the delegated administrator, and giving both teams access to it breaks least privilege.
      fr: |-
        AWS ne recommande pas le compte de gestion comme administrateur délégué, et donner aux deux équipes l'accès à ce compte enfreint le moindre privilège.
    c:
      en: |-
        Invitation-based management adds manual work for each account and Region, and new organization accounts would not be covered automatically.
      fr: |-
        La gestion par invitations ajoute un travail manuel pour chaque compte et chaque Région, et les nouveaux comptes de l'organisation ne seraient pas couverts automatiquement.
references:
  - title: Managing GuardDuty accounts with AWS Organizations - Amazon GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_organizations.html
