id: scsc03-1a-org-trail-members-locked
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 70 accounts in AWS Organizations with all features enabled, and new accounts are created every month. The security team must log management events from every account and every enabled Region to an S3 bucket in a log archive account. Administrators of member accounts must not be able to stop logging or change the logged events, and new accounts must be covered automatically.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany dispose de 70 comptes dans AWS Organizations avec toutes les fonctionnalités activées, et de nouveaux comptes sont créés chaque mois. L'équipe de sécurité doit journaliser les événements de gestion de chaque compte et de chaque Région activée dans un compartiment S3 d'un compte d'archivage des journaux. Les administrateurs des comptes membres ne doivent pas pouvoir arrêter la journalisation ni modifier les événements journalisés, et les nouveaux comptes doivent être couverts automatiquement.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy a multi-Region trail to every account with AWS CloudFormation StackSets, and let each account administrator manage its trail.
        fr: |-
          Déployer un journal de suivi multi-Région dans chaque compte avec AWS CloudFormation StackSets, et laisser chaque administrateur de compte gérer son journal.
    - id: b
      text:
        en: |-
          Deploy the AWS Config managed rule cloudtrail-enabled to all accounts, and fix the noncompliant accounts manually.
        fr: |-
          Déployer dans tous les comptes la règle gérée AWS Config cloudtrail-enabled, et corriger manuellement les comptes non conformes.
    - id: c
      text:
        en: |-
          Create a single-Region trail in each Region of each account, and send all the trails to the bucket in the log archive account.
        fr: |-
          Créer un journal de suivi à Région unique dans chaque Région de chaque compte, et envoyer tous les journaux dans le compartiment du compte d'archivage.
    - id: d
      text:
        en: |-
          From the management account or a delegated administrator account, create a multi-Region organization trail that delivers to the bucket in the log archive account.
        fr: |-
          À partir du compte de gestion ou d'un compte administrateur délégué, créer un journal de suivi d'organisation multi-Région qui livre dans le compartiment du compte d'archivage.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An organization trail logs events for all accounts in the organization and creates a copy of the trail in each member account. Member accounts can see the trail but cannot delete it, turn logging on or off, or change the logged event types. Accounts added to the organization get the trail automatically, and a trail created in the console is multi-Region.
    fr: |-
      Un journal de suivi d'organisation journalise les événements de tous les comptes de l'organisation et crée une copie du journal dans chaque compte membre. Les comptes membres voient le journal, mais ne peuvent ni le supprimer, ni activer ou désactiver la journalisation, ni modifier les types d'événements journalisés. Les comptes ajoutés à l'organisation reçoivent automatiquement le journal, et un journal créé dans la console est multi-Région.
  options:
    a:
      en: |-
        Trails owned by each account can be stopped or modified by that account's administrators, which the requirement forbids.
      fr: |-
        Les journaux de suivi propres à chaque compte peuvent être arrêtés ou modifiés par les administrateurs de ce compte, ce que l'exigence interdit.
    b:
      en: |-
        The rule detects accounts without a trail but does not create or protect trails, and manual fixes add operational overhead.
      fr: |-
        La règle détecte les comptes sans journal de suivi, mais ne crée ni ne protège les journaux, et les corrections manuelles ajoutent une charge opérationnelle.
    c:
      en: |-
        Hundreds of single-Region trails are hard to maintain, new accounts are not covered automatically, and members could change them.
      fr: |-
        Des centaines de journaux à Région unique sont difficiles à maintenir, les nouveaux comptes ne sont pas couverts automatiquement, et les membres pourraient les modifier.
references:
  - title: Creating a trail for an organization - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html
