id: scsc03-1b-alb-access-logs-kms
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany sends the access logs of an internet-facing Application Load Balancer to an S3 bucket in the same Region. The bucket policy allows logdelivery.elasticloadbalancing.amazonaws.com to call s3:PutObject on the AWSLogs/<account-id>/ prefix. After a new security baseline changed the default encryption of every log bucket to SSE-KMS with a customer managed key, the ALB access logs stopped arriving, while the other log files in the bucket still arrive. The logs must stay encrypted at rest.

    What should the security team do?
  fr: |
    AnyCompany envoie les journaux d'accès d'un Application Load Balancer exposé à internet vers un compartiment S3 de la même Région. La politique de compartiment autorise logdelivery.elasticloadbalancing.amazonaws.com à appeler s3:PutObject sur le préfixe AWSLogs/<account-id>/. Depuis qu'une nouvelle base de sécurité a remplacé le chiffrement par défaut de chaque compartiment de journaux par SSE-KMS avec une clé gérée par le client, les journaux d'accès de l'ALB n'arrivent plus, alors que les autres fichiers journaux du compartiment arrivent toujours. Les journaux doivent rester chiffrés au repos.

    Que doit faire l'équipe de sécurité ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a key policy statement that allows logdelivery.elasticloadbalancing.amazonaws.com to call kms:GenerateDataKey* on the customer managed key.
        fr: |-
          Ajouter une instruction de politique de clé qui autorise logdelivery.elasticloadbalancing.amazonaws.com à appeler kms:GenerateDataKey* sur la clé gérée par le client.
    - id: b
      text:
        en: |-
          Replace the service principal in the bucket policy with the Elastic Load Balancing account ID of the Region.
        fr: |-
          Remplacer le principal de service de la politique de compartiment par l'ID de compte Elastic Load Balancing de la Région.
    - id: c
      text:
        en: |-
          Change S3 Object Ownership of the bucket to bucket owner preferred, and grant the log delivery group WRITE access in the bucket ACL.
        fr: |-
          Passer S3 Object Ownership du compartiment à bucket owner preferred, et accorder au groupe de livraison de journaux l'accès WRITE dans l'ACL du compartiment.
    - id: d
      text:
        en: |-
          Send the ALB access logs to a bucket whose default encryption is SSE-S3, and update its bucket policy for the load balancer's account.
        fr: |-
          Envoyer les journaux d'accès de l'ALB vers un compartiment dont le chiffrement par défaut est SSE-S3, et mettre à jour sa politique de compartiment pour le compte de l'équilibreur de charge.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      For ALB access logs, the only supported server-side encryption on the destination bucket is SSE-S3, so an SSE-KMS default encryption blocks delivery. A bucket with SSE-S3 default encryption keeps the logs encrypted at rest, and its policy must allow the logdelivery.elasticloadbalancing.amazonaws.com principal on the account's AWSLogs prefix.
    fr: |-
      Pour les journaux d'accès ALB, le seul chiffrement côté serveur pris en charge sur le compartiment de destination est SSE-S3 : un chiffrement par défaut SSE-KMS bloque la livraison. Un compartiment avec le chiffrement par défaut SSE-S3 garde les journaux chiffrés au repos, et sa politique doit autoriser le principal logdelivery.elasticloadbalancing.amazonaws.com sur le préfixe AWSLogs du compte.
  options:
    a:
      en: |-
        A key policy statement for the delivery service works for some logs, such as AWS WAF or CloudFront, but ALB access logs support only SSE-S3.
      fr: |-
        Une instruction de politique de clé pour le service de livraison fonctionne pour certains journaux, comme AWS WAF ou CloudFront, mais les journaux d'accès ALB ne prennent en charge que SSE-S3.
    b:
      en: |-
        The service principal is the recommended policy; the Regional account ID is the legacy form and does not change the encryption problem.
      fr: |-
        Le principal de service est la politique recommandée ; l'ID de compte régional est la forme héritée et ne change rien au problème de chiffrement.
    c:
      en: |-
        ALB access logs are authorized by the bucket policy, not by ACLs, so enabling ACLs does not fix the unsupported encryption.
      fr: |-
        Les journaux d'accès ALB sont autorisés par la politique de compartiment, et non par des ACL : activer les ACL ne corrige pas le chiffrement non pris en charge.
references:
  - title: Enable access logs for your Application Load Balancer - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/enable-access-logging.html
