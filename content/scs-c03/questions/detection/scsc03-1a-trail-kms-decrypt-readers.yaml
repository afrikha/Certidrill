id: scsc03-1a-trail-kms-decrypt-readers
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's organization trail encrypts its log files with a customer managed KMS key in the log archive account. The key policy allows the log archive account's root principal to administer the key and allows cloudtrail.amazonaws.com to call kms:GenerateDataKey* with conditions on aws:SourceArn and the CloudTrail encryption context. An analyst role in the security tooling account has an IAM policy that allows s3:GetObject on the log bucket and kms:Decrypt on the key, and the bucket policy allows the role to read objects. When analysts download log files, they receive AccessDenied errors from AWS KMS.

    Which key policy change will grant the analysts the access that they need?
  fr: |
    Le journal de suivi d'organisation d'AnyCompany chiffre ses fichiers journaux avec une clé KMS gérée par le client dans le compte d'archivage des journaux. La politique de clé autorise le principal racine du compte d'archivage à administrer la clé et autorise cloudtrail.amazonaws.com à appeler kms:GenerateDataKey* avec des conditions sur aws:SourceArn et sur le contexte de chiffrement CloudTrail. Un rôle d'analyste du compte d'outils de sécurité possède une politique IAM qui autorise s3:GetObject sur le compartiment des journaux et kms:Decrypt sur la clé, et la politique de compartiment autorise le rôle à lire les objets. Lorsque les analystes téléchargent des fichiers journaux, ils reçoivent des erreurs AccessDenied d'AWS KMS.

    Quelle modification de la politique de clé accordera aux analystes l'accès dont ils ont besoin ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a statement that allows the analyst role to call kms:GenerateDataKey* when kms:EncryptionContext:aws:cloudtrail:arn matches the trail ARN.
        fr: |-
          Ajouter une instruction qui autorise le rôle d'analyste à appeler kms:GenerateDataKey* lorsque kms:EncryptionContext:aws:cloudtrail:arn correspond à l'ARN du journal de suivi.
    - id: b
      text:
        en: |-
          Add a statement that allows the analyst role to call kms:Decrypt when aws:SourceArn equals the ARN of the organization trail.
        fr: |-
          Ajouter une instruction qui autorise le rôle d'analyste à appeler kms:Decrypt lorsque aws:SourceArn est égal à l'ARN du journal de suivi d'organisation.
    - id: c
      text:
        en: |-
          Add a statement that allows the analyst role to call kms:Decrypt with a Null condition of false on kms:EncryptionContext:aws:cloudtrail:arn.
        fr: |-
          Ajouter une instruction qui autorise le rôle d'analyste à appeler kms:Decrypt avec une condition Null à false sur kms:EncryptionContext:aws:cloudtrail:arn.
    - id: d
      text:
        en: |-
          Add a statement that allows the security tooling account's root principal to call kms:DescribeKey on the key.
        fr: |-
          Ajouter une instruction qui autorise le principal racine du compte d'outils de sécurité à appeler kms:DescribeKey sur la clé.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      For a principal in another account, both its IAM policy and the key policy must allow kms:Decrypt. CloudTrail documents a key policy statement for log readers that allows kms:Decrypt with the condition that the CloudTrail encryption context key is present, which limits the use of the key to decrypting CloudTrail log files.
    fr: |-
      Pour un principal d'un autre compte, sa politique IAM et la politique de clé doivent toutes deux autoriser kms:Decrypt. CloudTrail documente pour les lecteurs de journaux une instruction de politique de clé qui autorise kms:Decrypt à condition que la clé du contexte de chiffrement CloudTrail soit présente, ce qui limite l'utilisation de la clé au déchiffrement des fichiers journaux CloudTrail.
  options:
    a:
      en: |-
        GenerateDataKey is used to encrypt new log files; reading log files requires kms:Decrypt.
      fr: |-
        GenerateDataKey sert à chiffrer de nouveaux fichiers journaux ; lire les fichiers journaux exige kms:Decrypt.
    b:
      en: |-
        aws:SourceArn is set on requests that the CloudTrail service makes on behalf of a trail, not on the analysts' own requests, so this statement never matches.
      fr: |-
        aws:SourceArn est défini sur les requêtes que le service CloudTrail effectue pour le compte d'un journal de suivi, et non sur les requêtes des analystes : cette instruction ne correspond jamais.
    d:
      en: |-
        DescribeKey only returns key metadata; it does not allow decrypting the data keys of the log files.
      fr: |-
        DescribeKey renvoie uniquement les métadonnées de la clé ; il ne permet pas de déchiffrer les clés de données des fichiers journaux.
references:
  - title: Configure AWS KMS key policies for CloudTrail - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/create-kms-key-policy-for-cloudtrail.html
