id: scsc03-1a-bedrock-invocation-logs
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is launching a customer support assistant that calls Amazon Bedrock through the Converse API in one AWS Region. The threat model includes prompt injection and the disclosure of sensitive data in model responses. To investigate such incidents, the security team must be able to review the full prompts and responses, together with the IAM identity of the caller, for 1 year. Some responses include generated images. A CloudTrail trail already logs management events for the account.

    Which solution will meet these requirements?
  fr: |
    AnyCompany lance un assistant de support client qui appelle Amazon Bedrock au moyen de l'API Converse dans une Région AWS. Le modèle de menaces comprend l'injection de prompt et la divulgation de données sensibles dans les réponses du modèle. Pour enquêter sur ce type d'incident, l'équipe de sécurité doit pouvoir examiner pendant 1 an les prompts et les réponses complets, avec l'identité IAM de l'appelant. Certaines réponses comprennent des images générées. Un journal de suivi CloudTrail journalise déjà les événements de gestion du compte.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable Amazon Bedrock model invocation logging with an S3 destination in the same Region, and apply an S3 Lifecycle rule that expires the logs after 1 year.
        fr: |-
          Activer la journalisation des invocations de modèle Amazon Bedrock avec une destination S3 dans la même Région, et appliquer une règle S3 Lifecycle qui fait expirer les journaux après 1 an.
    - id: b
      text:
        en: |-
          Add the Bedrock data events to the trail, and query the request and response parameters in Amazon Athena for 1 year.
        fr: |-
          Ajouter les événements de données Bedrock au journal de suivi, et interroger les paramètres de requête et de réponse dans Amazon Athena pendant 1 an.
    - id: c
      text:
        en: |-
          Attach an Amazon Bedrock guardrail with content filters to the application, and review the blocked requests in the guardrail metrics.
        fr: |-
          Associer à l'application une barrière de protection (guardrail) Amazon Bedrock avec des filtres de contenu, et examiner les requêtes bloquées dans les métriques de la barrière.
    - id: d
      text:
        en: |-
          Enable model invocation logging with only a CloudWatch Logs destination, and set the log group retention to 1 year.
        fr: |-
          Activer la journalisation des invocations de modèle avec une seule destination CloudWatch Logs, et définir la rétention du groupe de journaux à 1 an.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Model invocation logging is disabled by default and, once enabled for the account and Region, records the full request and response data of Converse and InvokeModel calls with metadata such as the caller's IAM identity. Binary data such as images and JSON bodies larger than 100 KB can be delivered only to Amazon S3, so an S3 destination with a lifecycle rule meets both the content and the retention requirements.
    fr: |-
      La journalisation des invocations de modèle est désactivée par défaut et, une fois activée pour le compte et la Région, enregistre les données complètes des requêtes et des réponses des appels Converse et InvokeModel avec des métadonnées comme l'identité IAM de l'appelant. Les données binaires comme les images et les corps JSON de plus de 100 Ko ne peuvent être livrés qu'à Amazon S3 : une destination S3 avec une règle de cycle de vie répond donc aux exigences de contenu et de rétention.
  options:
    b:
      en: |-
        CloudTrail records the API call and its caller; the invocation log is the Bedrock feature that captures the full model input and output bodies.
      fr: |-
        CloudTrail enregistre l'appel d'API et son appelant ; le journal d'invocation est la fonctionnalité Bedrock qui capture les corps complets des entrées et sorties du modèle.
    c:
      en: |-
        A guardrail filters harmful content, but it does not keep a record of every prompt and response for later investigation.
      fr: |-
        Une barrière de protection filtre les contenus nuisibles, mais ne conserve pas d'enregistrement de chaque prompt et de chaque réponse pour une investigation ultérieure.
    d:
      en: |-
        Image outputs and large bodies are supported only by the S3 destination, so a CloudWatch Logs destination alone would miss part of the responses.
      fr: |-
        Les sorties d'images et les corps volumineux ne sont pris en charge que par la destination S3 : une destination CloudWatch Logs seule omettrait une partie des réponses.
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
