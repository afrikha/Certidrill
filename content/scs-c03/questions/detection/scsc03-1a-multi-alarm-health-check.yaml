id: scsc03-1a-multi-alarm-health-check
objective: "1.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany wants Amazon Route 53 to fail over its order intake to a second Region when the oldest message in an Amazon SQS queue in the primary Region becomes too old, which can indicate that a compromised consumer stopped processing. An engineer tries to create a Route 53 health check of the CloudWatch alarm type in the workload account. The existing alarm is in a shared monitoring account, is based on a high-resolution custom metric, and alarms when 3 out of 5 datapoints breach the threshold.

    Which changes must the engineer make so that the alarm can be used by the health check? (Choose three.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany veut qu'Amazon Route 53 bascule sa prise de commandes vers une seconde Région lorsque le message le plus ancien d'une file d'attente Amazon SQS de la Région principale devient trop ancien, ce qui peut indiquer qu'un consommateur compromis a cessé le traitement. Un ingénieur tente de créer, dans le compte de la charge de travail, une vérification de l'état Route 53 de type alarme CloudWatch. L'alarme existante se trouve dans un compte de surveillance partagé, repose sur une métrique personnalisée haute résolution et se déclenche lorsque 3 points de données sur 5 dépassent le seuil.

    Quelles modifications l'ingénieur doit-il apporter pour que l'alarme puisse être utilisée par la vérification de l'état ? (Choisissez trois réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Create the alarm in the workload account, which is the account of the health check.
        fr: |-
          Créer l'alarme dans le compte de la charge de travail, qui est le compte de la vérification de l'état.
    - id: b
      text:
        en: |-
          Base the alarm on a standard-resolution metric.
        fr: |-
          Baser l'alarme sur une métrique de résolution standard.
    - id: c
      text:
        en: |-
          Configure the alarm without an M out of N datapoints evaluation.
        fr: |-
          Configurer l'alarme sans évaluation de M points de données sur N.
    - id: d
      text:
        en: |-
          Change the alarm statistic to the p99 percentile.
        fr: |-
          Remplacer la statistique de l'alarme par le centile p99.
    - id: e
      text:
        en: |-
          Add an Amazon SNS action to the alarm for the ALARM state.
        fr: |-
          Ajouter à l'alarme une action Amazon SNS pour l'état ALARM.
    - id: f
      text:
        en: |-
          Base the alarm on a metric math expression that combines the queue metrics.
        fr: |-
          Baser l'alarme sur une expression mathématique de métriques qui combine les métriques de la file d'attente.
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |-
      A CloudWatch alarm health check monitors the same data stream as the alarm and has several restrictions: the alarm must be in the same AWS account as the health check, only standard-resolution metrics are supported, and M out of N alarms are not supported. Route 53 does not wait for the ALARM state; it evaluates the data against the alarm criteria itself.
    fr: |-
      Une vérification de l'état de type alarme CloudWatch surveille le même flux de données que l'alarme et comporte plusieurs restrictions : l'alarme doit se trouver dans le même compte AWS que la vérification, seules les métriques de résolution standard sont prises en charge, et les alarmes M sur N ne sont pas prises en charge. Route 53 n'attend pas l'état ALARM ; il évalue lui-même les données par rapport aux critères de l'alarme.
  options:
    d:
      en: |-
        Only the Average, Minimum, Maximum, Sum, and SampleCount statistics are supported; extended statistics such as percentiles are not.
      fr: |-
        Seules les statistiques Average, Minimum, Maximum, Sum et SampleCount sont prises en charge ; les statistiques étendues comme les centiles ne le sont pas.
    e:
      en: |-
        The health check reads the alarm's data stream and does not depend on alarm actions, so an SNS action is not required.
      fr: |-
        La vérification de l'état lit le flux de données de l'alarme et ne dépend pas des actions de l'alarme : une action SNS n'est pas nécessaire.
    f:
      en: |-
        Alarms based on metric math are not supported by CloudWatch alarm health checks.
      fr: |-
        Les alarmes basées sur des expressions mathématiques de métriques ne sont pas prises en charge par les vérifications de type alarme CloudWatch.
references:
  - title: Types of Amazon Route 53 health checks - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-types.html
