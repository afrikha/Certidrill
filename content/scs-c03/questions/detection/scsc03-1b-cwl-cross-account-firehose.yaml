id: scsc03-1b-cwl-cross-account-firehose
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 30 member accounts in AWS Organizations. Applications in each account write security events to Amazon CloudWatch Logs log groups in us-east-1. The security team wants these events copied in near real time to the S3 log data lake in the Log Archive account (222222222222) through an Amazon Data Firehose stream in that account. Only accounts in the organization (o-a1b2c3d4e5) may send data, and accounts that join later must not require a policy change.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 30 comptes membres dans AWS Organizations. Dans chaque compte, des applications écrivent des événements de sécurité dans des groupes de journaux Amazon CloudWatch Logs dans us-east-1. L'équipe de sécurité veut que ces événements soient copiés en quasi temps réel vers le lac de données de journaux S3 du compte Log Archive (222222222222), au moyen d'un flux Amazon Data Firehose de ce compte. Seuls les comptes de l'organisation (o-a1b2c3d4e5) peuvent envoyer des données, et les comptes qui la rejoindront ne doivent exiger aucune modification de politique.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          In each member account, create a subscription filter whose destination is the ARN of the Firehose stream in the Log Archive account, and add the member account IDs to the stream's resource policy.
        fr: |-
          Dans chaque compte membre, créer un filtre d'abonnement dont la destination est l'ARN du flux Firehose du compte Log Archive, et ajouter les ID des comptes membres à la politique de ressource du flux.
    - id: b
      text:
        en: |-
          In the Log Archive account, create a CloudWatch Logs destination for the stream with a role that CloudWatch Logs can assume and an access policy that allows logs:PutSubscriptionFilter when aws:PrincipalOrgID is o-a1b2c3d4e5. Subscribe each log group to the destination.
        fr: |-
          Dans le compte Log Archive, créer pour le flux une destination CloudWatch Logs avec un rôle que CloudWatch Logs peut endosser et une politique d'accès qui autorise logs:PutSubscriptionFilter lorsque aws:PrincipalOrgID vaut o-a1b2c3d4e5. Abonner chaque groupe de journaux à la destination.
    - id: c
      text:
        en: |-
          In the Log Archive account, create a CloudWatch Logs destination for the stream with an access policy that lists the 30 account IDs as principals. Subscribe each log group to the destination.
        fr: |-
          Dans le compte Log Archive, créer pour le flux une destination CloudWatch Logs avec une politique d'accès qui liste les 30 ID de compte comme principaux. Abonner chaque groupe de journaux à la destination.
    - id: d
      text:
        en: |-
          In each member account, schedule a daily CloudWatch Logs export task to the Log Archive bucket, with a bucket policy that allows aws:PrincipalOrgID o-a1b2c3d4e5.
        fr: |-
          Dans chaque compte membre, planifier une tâche d'exportation CloudWatch Logs quotidienne vers le compartiment Log Archive, avec une politique de compartiment qui autorise aws:PrincipalOrgID o-a1b2c3d4e5.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Cross-account subscriptions go through a CloudWatch Logs destination in the recipient account, which points to the Firehose stream and uses a role to put records into it. Its access policy can use Principal "*" with an aws:PrincipalOrgID condition so that every current and future account of the organization can create subscription filters, which stream the events in near real time.
    fr: |-
      Les abonnements entre comptes passent par une destination CloudWatch Logs du compte récepteur, qui pointe vers le flux Firehose et utilise un rôle pour y écrire les enregistrements. Sa politique d'accès peut utiliser Principal "*" avec une condition aws:PrincipalOrgID pour que chaque compte actuel ou futur de l'organisation puisse créer des filtres d'abonnement, qui diffusent les événements en quasi temps réel.
  options:
    a:
      en: |-
        A subscription filter in another account targets a CloudWatch Logs destination, not the stream ARN directly, and listing account IDs requires a policy change for each new account.
      fr: |-
        Un filtre d'abonnement d'un autre compte cible une destination CloudWatch Logs, et non directement l'ARN du flux ; lister des ID de compte exige en outre une modification de politique pour chaque nouveau compte.
    c:
      en: |-
        This delivers the events, but every account that joins later must be added to the access policy, which the requirements forbid.
      fr: |-
        Cela livre les événements, mais chaque compte qui rejoint l'organisation doit être ajouté à la politique d'accès, ce que les exigences interdisent.
    d:
      en: |-
        Export tasks are daily batch copies, not near real time, and they do not use the Firehose stream.
      fr: |-
        Les tâches d'exportation sont des copies quotidiennes par lots, et non du quasi temps réel, et elles n'utilisent pas le flux Firehose.
references:
  - title: Cross-account cross-Region log data sharing using Firehose - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CrossAccountSubscriptions-Firehose.html
