id: scsc03-1b-grafana-athena
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team wants one set of dashboards that correlates OCSF data from Amazon Security Lake, which analysts query with Amazon Athena, with Amazon CloudWatch metrics from the same accounts. Analysts must sign in with their corporate identities, which are already synchronized to AWS IAM Identity Center. The team does not want to run or patch servers.

    Which solution will meet these requirements?
  fr: |
    L'équipe de sécurité d'AnyCompany veut un seul ensemble de tableaux de bord qui corrèle les données OCSF d'Amazon Security Lake, que les analystes interrogent avec Amazon Athena, avec les métriques Amazon CloudWatch des mêmes comptes. Les analystes doivent se connecter avec leurs identités d'entreprise, déjà synchronisées dans AWS IAM Identity Center. L'équipe ne veut ni exploiter ni corriger de serveurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon Managed Grafana workspace that uses IAM Identity Center for authentication, and add Athena and CloudWatch data sources.
        fr: |-
          Créer un espace de travail Amazon Managed Grafana qui utilise IAM Identity Center pour l'authentification, et ajouter les sources de données Athena et CloudWatch.
    - id: b
      text:
        en: |-
          Create an Amazon Managed Grafana workspace, create an IAM user with access keys for each analyst, and add Athena and CloudWatch data sources.
        fr: |-
          Créer un espace de travail Amazon Managed Grafana, créer pour chaque analyste un utilisateur IAM avec des clés d'accès, et ajouter les sources de données Athena et CloudWatch.
    - id: c
      text:
        en: |-
          Install open source Grafana on an EC2 instance with SAML sign-in, and add the Athena and CloudWatch plugins.
        fr: |-
          Installer Grafana open source sur une instance EC2 avec une connexion SAML, et ajouter les plugins Athena et CloudWatch.
    - id: d
      text:
        en: |-
          Create CloudWatch dashboards with Logs Insights widgets that query the Security Lake tables.
        fr: |-
          Créer des tableaux de bord CloudWatch avec des widgets Logs Insights qui interrogent les tables Security Lake.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon Managed Grafana is a managed service whose workspaces authenticate users through IAM Identity Center or a SAML 2.0 identity provider. Athena and CloudWatch are built-in AWS data sources, so one dashboard can show Security Lake query results next to CloudWatch metrics.
    fr: |-
      Amazon Managed Grafana est un service géré dont les espaces de travail authentifient les utilisateurs par IAM Identity Center ou par un fournisseur d'identité SAML 2.0. Athena et CloudWatch sont des sources de données AWS intégrées : un même tableau de bord peut afficher les résultats de requêtes Security Lake à côté des métriques CloudWatch.
  options:
    b:
      en: |-
        Users sign in to Managed Grafana through single sign-on (IAM Identity Center or SAML), not with IAM users, and access keys are long-term credentials to avoid.
      fr: |-
        Les utilisateurs se connectent à Managed Grafana par authentification unique (IAM Identity Center ou SAML), et non avec des utilisateurs IAM ; les clés d'accès sont en outre des informations d'identification à long terme à éviter.
    c:
      en: |-
        A self-managed Grafana server must be run and patched, which the team does not want.
      fr: |-
        Un serveur Grafana autogéré doit être exploité et corrigé, ce que l'équipe ne veut pas.
    d:
      en: |-
        Logs Insights queries CloudWatch Logs log groups; Security Lake data is stored in S3 and queried through Athena.
      fr: |-
        Logs Insights interroge des groupes de journaux CloudWatch Logs ; les données Security Lake sont stockées dans S3 et interrogées par Athena.
references:
  - title: Authenticate users in Amazon Managed Grafana workspaces - Amazon Managed Grafana
    url: https://docs.aws.amazon.com/grafana/latest/userguide/authentication-in-AMG.html
  - title: Connect to built-in data sources - Amazon Managed Grafana
    url: https://docs.aws.amazon.com/grafana/latest/userguide/AMG-data-sources-builtin.html
