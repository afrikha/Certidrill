id: scsc03-1b-sh-api-destination-soar
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses Security Hub CSPM with an administrator account that receives the findings of all member accounts. The company has subscribed to a third-party security orchestration (SOAR) service that receives events on a public HTTPS endpoint and requires an API key in a request header. Every new or updated finding with a CRITICAL or HIGH severity must be sent to the SOAR service automatically. The company does not want to write or maintain code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise Security Hub CSPM avec un compte administrateur qui reçoit les résultats de tous les comptes membres. L'entreprise s'est abonnée à un service tiers d'orchestration de la sécurité (SOAR) qui reçoit des événements sur un point de terminaison HTTPS public et exige une clé d'API dans un en-tête de requête. Chaque résultat nouveau ou mis à jour de gravité CRITICAL ou HIGH doit être envoyé automatiquement au service SOAR. L'entreprise ne veut ni écrire ni maintenir de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          In the administrator account, create an EventBridge rule for Security Hub Findings - Imported events with Severity.Label CRITICAL or HIGH, targeting an API destination whose connection stores the API key.
        fr: |-
          Dans le compte administrateur, créer une règle EventBridge pour les événements Security Hub Findings - Imported avec Severity.Label CRITICAL ou HIGH, qui cible une destination d'API dont la connexion stocke la clé d'API.
    - id: b
      text:
        en: |-
          Create a Security Hub CSPM custom action named send_to_soar, and ask analysts to select the CRITICAL and HIGH findings and run the action.
        fr: |-
          Créer une action personnalisée Security Hub CSPM nommée send_to_soar, et demander aux analystes de sélectionner les résultats CRITICAL et HIGH et d'exécuter l'action.
    - id: c
      text:
        en: |-
          In the administrator account, create an EventBridge rule for Security Hub Findings - Imported events with Severity.Label CRITICAL or HIGH, targeting an SNS topic with an email subscription for the SOAR service.
        fr: |-
          Dans le compte administrateur, créer une règle EventBridge pour les événements Security Hub Findings - Imported avec Severity.Label CRITICAL ou HIGH, qui cible une rubrique SNS avec un abonnement e-mail pour le service SOAR.
    - id: d
      text:
        en: |-
          Create a custom insight that groups CRITICAL and HIGH findings by account, and share its results with the SOAR service every hour.
        fr: |-
          Créer un aperçu personnalisé qui regroupe les résultats CRITICAL et HIGH par compte, et partager ses résultats avec le service SOAR toutes les heures.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Security Hub CSPM automatically sends every new and updated finding to EventBridge as a Security Hub Findings - Imported event, including member account findings in the administrator account. An API destination calls an HTTPS endpoint as a rule target, and its connection keeps the API key in a secret that EventBridge manages in Secrets Manager.
    fr: |-
      Security Hub CSPM envoie automatiquement chaque résultat nouveau ou mis à jour à EventBridge sous forme d'événement Security Hub Findings - Imported, y compris les résultats des comptes membres dans le compte administrateur. Une destination d'API appelle un point de terminaison HTTPS comme cible de règle, et sa connexion conserve la clé d'API dans un secret qu'EventBridge gère dans Secrets Manager.
  options:
    b:
      en: |-
        Custom actions send only the findings that a user selects in the console, so delivery is not automatic.
      fr: |-
        Les actions personnalisées n'envoient que les résultats qu'un utilisateur sélectionne dans la console : la livraison n'est pas automatique.
    c:
      en: |-
        An email subscription does not call the HTTPS endpoint with the required API key header.
      fr: |-
        Un abonnement e-mail n'appelle pas le point de terminaison HTTPS avec l'en-tête de clé d'API requis.
    d:
      en: |-
        An insight is a grouped view in the console; it does not send each finding to an external endpoint.
      fr: |-
        Un aperçu est une vue regroupée dans la console ; il n'envoie pas chaque résultat à un point de terminaison externe.
references:
  - title: Security Hub CSPM event types in EventBridge - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-cwe-integration-types.html
  - title: API destinations as targets in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-api-destinations.html
