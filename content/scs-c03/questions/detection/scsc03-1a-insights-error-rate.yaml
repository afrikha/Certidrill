id: scsc03-1a-insights-error-rate
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany enabled CloudTrail Insights with the API call rate type on a trail that logs write management events only. During a red team exercise, a stolen access key made thousands of failed Describe and List calls in a few minutes, returning AccessDenied errors, but no Insights event was generated. The security team wants CloudTrail to flag such unusual bursts of failed calls against the account's own baseline.

    Which change will meet this requirement?
  fr: |
    AnyCompany a activé CloudTrail Insights avec le type API call rate sur un journal de suivi qui journalise uniquement les événements de gestion en écriture. Lors d'un exercice de red team, une clé d'accès volée a effectué en quelques minutes des milliers d'appels Describe et List en échec, qui renvoyaient des erreurs AccessDenied, mais aucun événement Insights n'a été généré. L'équipe de sécurité veut que CloudTrail signale ces rafales inhabituelles d'appels en échec par rapport à la référence propre au compte.

    Quelle modification permet de répondre à cette exigence ?
body:
  options:
    - id: a
      text:
        en: |-
          Add S3 and Lambda data events to the trail so that Insights can analyze the failed Describe and List calls of the access key.
        fr: |-
          Ajouter au journal de suivi les événements de données S3 et Lambda afin qu'Insights puisse analyser les appels Describe et List en échec de la clé d'accès.
    - id: b
      text:
        en: |-
          Enable the API error rate Insights type on the trail, and configure the trail to log read management events as well as write events.
        fr: |-
          Activer le type Insights API error rate sur le journal de suivi, et configurer le journal pour qu'il journalise les événements de gestion en lecture en plus des événements en écriture.
    - id: c
      text:
        en: |-
          Configure the trail to log read management events in addition to write events, and keep only the API call rate Insights type.
        fr: |-
          Configurer le journal de suivi pour qu'il journalise les événements de gestion en lecture en plus de ceux en écriture, et conserver uniquement le type Insights API call rate.
    - id: d
      text:
        en: |-
          Create a CloudTrail Lake event data store for management events, and enable Insights on the event data store.
        fr: |-
          Créer un magasin de données d'événements CloudTrail Lake pour les événements de gestion, et activer Insights sur ce magasin.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The API error rate Insights type detects unusual rates of management API calls that return error codes, and it works with read events, write events, or both. The failed Describe and List calls are read management events, so the trail must log read events and have the API error rate type enabled. The API call rate type analyzes write management events only.
    fr: |-
      Le type Insights API error rate détecte des taux inhabituels d'appels d'API de gestion qui renvoient des codes d'erreur, et fonctionne avec les événements en lecture, en écriture ou les deux. Les appels Describe et List en échec sont des événements de gestion en lecture : le journal doit donc journaliser les événements en lecture et avoir le type API error rate activé. Le type API call rate n'analyse que les événements de gestion en écriture.
  options:
    a:
      en: |-
        Describe and List calls on these services are management events, not data events, so data events do not cover them.
      fr: |-
        Les appels Describe et List sur ces services sont des événements de gestion et non des événements de données : les événements de données ne les couvrent pas.
    c:
      en: |-
        The API call rate type measures write management calls per minute, so logging read events does not make it detect a burst of failed read calls.
      fr: |-
        Le type API call rate mesure les appels de gestion en écriture par minute : journaliser les événements en lecture ne lui permet pas de détecter une rafale d'appels de lecture en échec.
    d:
      en: |-
        CloudTrail Lake is no longer open to new customers, and the existing trail can be configured to meet the requirement.
      fr: |-
        CloudTrail Lake n'est plus ouvert aux nouveaux clients, et le journal de suivi existant peut être configuré pour répondre à l'exigence.
references:
  - title: Working with CloudTrail Insights - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-insights-events-with-cloudtrail.html
