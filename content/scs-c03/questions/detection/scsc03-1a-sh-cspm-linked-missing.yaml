id: scsc03-1a-sh-cspm-linked-missing
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses AWS Security Hub CSPM with a delegated administrator account. All accounts belong to the organization in AWS Organizations. The administrator configured cross-Region aggregation with us-east-1 as the aggregation Region and ap-southeast-2 as a linked Region. In us-east-1, the administrator sees findings from ap-southeast-2 for every member account except one. That account's team recently created workloads in ap-southeast-2, and GuardDuty findings for them exist in that Region.

    What is the MOST likely cause?
  fr: |
    AnyCompany utilise AWS Security Hub CSPM avec un compte administrateur délégué. Tous les comptes appartiennent à l'organisation AWS Organizations. L'administrateur a configuré l'agrégation entre Régions avec us-east-1 comme Région d'agrégation et ap-southeast-2 comme Région liée. Dans us-east-1, l'administrateur voit les résultats d'ap-southeast-2 de tous les comptes membres sauf un. L'équipe de ce compte a récemment créé des charges de travail dans ap-southeast-2, et des résultats GuardDuty les concernant existent dans cette Région.

    Quelle est la cause la PLUS probable ?
body:
  options:
    - id: a
      text:
        en: |-
          Security Hub CSPM is not enabled for that account in ap-southeast-2, and cross-Region aggregation does not enable it.
        fr: |-
          Security Hub CSPM n'est pas activé pour ce compte dans ap-southeast-2, et l'agrégation entre Régions ne l'active pas.
    - id: b
      text:
        en: |-
          The administrator must also create a finding aggregator in ap-southeast-2 for the findings of that account.
        fr: |-
          L'administrateur doit aussi créer un agrégateur de résultats dans ap-southeast-2 pour les résultats de ce compte.
    - id: c
      text:
        en: |-
          Cross-Region aggregation replicates only control findings, so GuardDuty findings stay in the Region where they were generated.
        fr: |-
          L'agrégation entre Régions ne réplique que les résultats de contrôles : les résultats GuardDuty restent dans la Région où ils ont été générés.
    - id: d
      text:
        en: |-
          The member account must turn on cross-Region aggregation in its own account with us-east-1 as its aggregation Region.
        fr: |-
          Le compte membre doit activer l'agrégation entre Régions dans son propre compte avec us-east-1 comme Région d'agrégation.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Security Hub CSPM receives and processes findings only in the Regions where it is enabled for an account, and cross-Region aggregation replicates data only from those Regions; it does not enable Security Hub CSPM automatically. Because every other member account appears, the aggregation itself works, and the account that is missing most likely does not have Security Hub CSPM enabled in ap-southeast-2.
    fr: |-
      Security Hub CSPM ne reçoit et ne traite les résultats que dans les Régions où il est activé pour un compte, et l'agrégation entre Régions ne réplique les données que depuis ces Régions ; elle n'active pas Security Hub CSPM automatiquement. Comme tous les autres comptes membres apparaissent, l'agrégation fonctionne, et le compte manquant n'a très probablement pas Security Hub CSPM activé dans ap-southeast-2.
  options:
    b:
      en: |-
        The aggregator is created only in the aggregation Region and replicates data from every linked Region for all member accounts.
      fr: |-
        L'agrégateur n'est créé que dans la Région d'agrégation et réplique les données de chaque Région liée pour tous les comptes membres.
    c:
      en: |-
        Aggregation replicates findings from all sources, along with insights, control compliance statuses, and security scores.
      fr: |-
        L'agrégation réplique les résultats de toutes les sources, ainsi que les informations (insights), les statuts de conformité des contrôles et les scores de sécurité.
    d:
      en: |-
        Member accounts inherit the aggregation settings of the administrator account; they do not configure their own aggregation.
      fr: |-
        Les comptes membres héritent des paramètres d'agrégation du compte administrateur ; ils ne configurent pas leur propre agrégation.
references:
  - title: Understanding cross-Region aggregation in Security Hub CSPM - AWS Security Hub
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/finding-aggregation.html
