id: scsc03-1b-flowlogs-s3-parquet
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany publishes the VPC flow logs of a large VPC to Amazon S3 in the default text format with the default S3 prefixes. Security analysts query them with Amazon Athena, and most investigations look at one specific hour. The queries are slow and scan far more data than needed. The company wants faster and cheaper Athena queries for new flow log data.

    Which solution will meet these requirements?
  fr: |
    AnyCompany publie les journaux de flux d'un grand VPC dans Amazon S3, au format texte par défaut et avec les préfixes S3 par défaut. Les analystes de sécurité les interrogent avec Amazon Athena, et la plupart des investigations portent sur une heure précise. Les requêtes sont lentes et analysent bien plus de données que nécessaire. L'entreprise veut des requêtes Athena plus rapides et moins coûteuses pour les nouvelles données de journaux de flux.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Edit the existing flow log to use the Parquet file format, Hive-compatible S3 prefixes, and hourly partitions.
        fr: |-
          Modifier le journal de flux existant pour utiliser le format de fichier Parquet, les préfixes S3 compatibles Hive et les partitions horaires.
    - id: b
      text:
        en: |-
          Add an S3 Lifecycle rule that moves the flow log files to S3 Intelligent-Tiering after one day.
        fr: |-
          Ajouter une règle S3 Lifecycle qui déplace les fichiers de journaux de flux vers S3 Intelligent-Tiering après un jour.
    - id: c
      text:
        en: |-
          Create a new flow log to S3 with a maximum aggregation interval of 10 minutes so that fewer records are written, then delete the old flow log.
        fr: |-
          Créer un nouveau journal de flux vers S3 avec un intervalle d'agrégation maximal de 10 minutes pour écrire moins d'enregistrements, puis supprimer l'ancien journal de flux.
    - id: d
      text:
        en: |-
          Create a new flow log to S3 that uses the Parquet file format, Hive-compatible S3 prefixes, and hourly partitions, then delete the old flow log.
        fr: |-
          Créer un nouveau journal de flux vers S3 qui utilise le format de fichier Parquet, les préfixes S3 compatibles Hive et les partitions horaires, puis supprimer l'ancien journal de flux.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Queries on Parquet flow logs run 10 to 100 times faster than on plain text, hourly partitions let Athena read only the hour that is queried, and Hive-compatible prefixes let Athena load the partitions without manual mapping. A flow log's configuration cannot be changed, so a new flow log with these options must replace the old one.
    fr: |-
      Les requêtes sur des journaux de flux Parquet sont 10 à 100 fois plus rapides que sur du texte brut, les partitions horaires permettent à Athena de ne lire que l'heure interrogée, et les préfixes compatibles Hive permettent à Athena de charger les partitions sans mappage manuel. La configuration d'un journal de flux ne peut pas être modifiée : un nouveau journal de flux avec ces options doit remplacer l'ancien.
  options:
    a:
      en: |-
        These are the right options, but an existing flow log cannot be edited; it must be deleted and created again.
      fr: |-
        Ce sont les bonnes options, mais un journal de flux existant ne peut pas être modifié ; il faut le supprimer et le recréer.
    b:
      en: |-
        A storage class changes storage cost, not the amount of data that Athena scans or the query speed.
      fr: |-
        Une classe de stockage modifie le coût de stockage, et non la quantité de données analysées par Athena ni la vitesse des requêtes.
    c:
      en: |-
        A longer aggregation interval reduces detail; the files stay in text format without hourly partitions, so each query still scans whole days.
      fr: |-
        Un intervalle d'agrégation plus long réduit le détail ; les fichiers restent au format texte sans partitions horaires, et chaque requête analyse toujours des journées entières.
references:
