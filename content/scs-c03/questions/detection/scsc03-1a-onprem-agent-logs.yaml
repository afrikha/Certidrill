id: scsc03-1a-onprem-agent-logs
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs 40 Linux servers in its own data center, connected to AWS through AWS Direct Connect. The security team wants the authentication logs of these servers in Amazon CloudWatch Logs in near real time, next to the logs of its Amazon EC2 instances, so that the same metric filters and alarms apply to both. The team does not want to write or maintain custom code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite 40 serveurs Linux dans son propre centre de données, reliés à AWS par AWS Direct Connect. L'équipe de sécurité veut retrouver les journaux d'authentification de ces serveurs dans Amazon CloudWatch Logs quasiment en temps réel, à côté des journaux de ses instances Amazon EC2, afin que les mêmes filtres de métriques et alarmes s'appliquent aux deux. L'équipe ne veut ni écrire ni maintenir de code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Configure rsyslog on each server to forward the authentication logs over the syslog protocol to the CloudWatch Logs Regional endpoint through Direct Connect.
        fr: |-
          Configurer rsyslog sur chaque serveur pour transférer les journaux d'authentification par le protocole syslog vers le point de terminaison régional de CloudWatch Logs via Direct Connect.
    - id: b
      text:
        en: |-
          Install the CloudWatch agent on each server with an instance profile that has CloudWatchAgentServerPolicy, and collect the authentication log file in the agent configuration.
        fr: |-
          Installer l'agent CloudWatch sur chaque serveur avec un profil d'instance doté de CloudWatchAgentServerPolicy, et collecter le fichier journal d'authentification dans la configuration de l'agent.
    - id: c
      text:
        en: |-
          Install the CloudWatch agent on each server, point its common-config.toml file to a named credential profile of an IAM identity with CloudWatchAgentServerPolicy, and collect the authentication log.
        fr: |-
          Installer l'agent CloudWatch sur chaque serveur, faire pointer son fichier common-config.toml vers un profil d'informations d'identification nommé d'une identité IAM dotée de CloudWatchAgentServerPolicy, et collecter le journal d'authentification.
    - id: d
      text:
        en: |-
          Enable VPC Flow Logs on the Direct Connect virtual interface, and publish the flow logs to the same CloudWatch Logs log group as the authentication logs of the EC2 instances.
        fr: |-
          Activer VPC Flow Logs sur l'interface virtuelle Direct Connect, et publier les journaux de flux dans le même groupe de journaux CloudWatch Logs que les journaux d'authentification des instances EC2.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The CloudWatch agent runs on servers outside AWS and collects log files that are listed in the files collect_list of its configuration. Without an instance profile, the agent gets credentials from the shared credential profile or file referenced in common-config.toml, and the IAM identity needs the permissions of CloudWatchAgentServerPolicy to publish logs and metrics.
    fr: |-
      L'agent CloudWatch s'exécute sur des serveurs hors d'AWS et collecte les fichiers journaux listés dans la section files collect_list de sa configuration. Sans profil d'instance, l'agent obtient ses informations d'identification à partir du profil ou du fichier d'informations d'identification partagé référencé dans common-config.toml, et l'identité IAM a besoin des autorisations de CloudWatchAgentServerPolicy pour publier les journaux et les métriques.
  options:
    a:
      en: |-
        CloudWatch Logs accepts log events through its HTTPS API, not through the syslog protocol, so an agent is needed.
      fr: |-
        CloudWatch Logs accepte les événements de journaux par son API HTTPS et non par le protocole syslog : un agent est nécessaire.
    b:
      en: |-
        Instance profiles deliver role credentials to EC2 instances only; servers in a data center cannot use them.
      fr: |-
        Les profils d'instance ne fournissent des informations d'identification de rôle qu'aux instances EC2 ; les serveurs d'un centre de données ne peuvent pas les utiliser.
    d:
      en: |-
        Flow logs record IP traffic metadata, not the content of operating system authentication logs, and they are not created on Direct Connect virtual interfaces.
      fr: |-
        Les journaux de flux enregistrent des métadonnées de trafic IP et non le contenu des journaux d'authentification du système d'exploitation, et ils ne se créent pas sur les interfaces virtuelles Direct Connect.
references:
  - title: Install the CloudWatch agent using AWS Systems Manager - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/installing-cloudwatch-agent-ssm.html
  - title: Manually create or edit the CloudWatch agent configuration file - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
