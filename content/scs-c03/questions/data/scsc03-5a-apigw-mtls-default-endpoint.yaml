id: scsc03-5a-apigw-mtls-default-endpoint
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany exposes a REST API in Amazon API Gateway to partners through a Regional custom domain name. The custom domain name uses the TLS_1_2 security policy and has mutual TLS enabled with a truststore in Amazon S3 that contains the partner CA certificates. During a penetration test, a tester without any client certificate successfully calls the API through its https://{api-id}.execute-api.{region}.amazonaws.com URL. Every call to the API must require a client certificate issued by a trusted partner CA.

    Which solution will meet this requirement?
  fr: |
    AnyCompany expose aux partenaires une API REST Amazon API Gateway par un nom de domaine personnalisé régional. Le nom de domaine personnalisé utilise la politique de sécurité TLS_1_2 et a le TLS mutuel activé, avec un magasin d'approbation (truststore) dans Amazon S3 qui contient les certificats des autorités de certification des partenaires. Lors d'un test d'intrusion, un testeur sans aucun certificat client appelle avec succès l'API par son URL https://{api-id}.execute-api.{region}.amazonaws.com. Chaque appel à l'API doit exiger un certificat client émis par une autorité de certification de partenaire approuvée.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text:
        en: "Add a resource policy to the API that denies execute-api:Invoke when aws:SecureTransport is false."
        fr: "Ajouter à l'API une politique de ressource qui refuse execute-api:Invoke lorsque aws:SecureTransport vaut false."
    - id: b
      text:
        en: "Set disableExecuteApiEndpoint to true on the REST API, and redeploy the API to its stages."
        fr: "Définir disableExecuteApiEndpoint sur true sur l'API REST, et redéployer l'API dans ses étapes."
    - id: c
      text:
        en: "Change the API to an edge-optimized endpoint, and enable mutual TLS on an edge-optimized custom domain name."
        fr: "Passer l'API à un point de terminaison optimisé pour la périphérie (edge-optimized), et activer le TLS mutuel sur un nom de domaine personnalisé optimisé pour la périphérie."
    - id: d
      text:
        en: "Upload a new truststore version that contains only the partner root CA certificates, and update the custom domain name."
        fr: "Charger une nouvelle version du magasin d'approbation qui ne contient que les certificats racines des partenaires, et mettre à jour le nom de domaine personnalisé."
answer: { optionId: b }
explanation:
  correct:
    en: "Mutual TLS is enforced only on the custom domain name; the default execute-api endpoint bypasses it. Disabling the default endpoint makes calls to it return 403 Forbidden for every stage, so clients must use the custom domain with mutual TLS. The change takes effect after a new deployment."
    fr: "Le TLS mutuel n'est appliqué que sur le nom de domaine personnalisé ; le point de terminaison execute-api par défaut le contourne. Désactiver le point de terminaison par défaut fait renvoyer 403 Forbidden aux appels vers celui-ci pour toutes les étapes : les clients doivent passer par le domaine personnalisé avec TLS mutuel. La modification prend effet après un nouveau déploiement."
  options:
    a:
      en: "The default endpoint already uses HTTPS, so aws:SecureTransport is true and the call without a client certificate is still allowed."
      fr: "Le point de terminaison par défaut utilise déjà HTTPS : aws:SecureTransport vaut true et l'appel sans certificat client reste autorisé."
    c:
      en: "Mutual TLS for REST APIs requires a Regional custom domain name, and the default endpoint would remain reachable anyway."
      fr: "Le TLS mutuel pour les API REST exige un nom de domaine personnalisé régional, et le point de terminaison par défaut resterait de toute façon accessible."
    d:
      en: "The truststore applies only to connections to the custom domain name; it has no effect on calls that use the default endpoint."
      fr: "Le magasin d'approbation ne s'applique qu'aux connexions au nom de domaine personnalisé : il n'a aucun effet sur les appels qui utilisent le point de terminaison par défaut."
references:
  - title: Require client certificates for your API with mutual TLS authentication in API Gateway - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api-mutual-tls.html
  - title: Disable the default endpoint for REST APIs - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api-disable-default-endpoint.html
