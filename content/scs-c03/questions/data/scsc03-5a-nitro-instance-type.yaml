id: scsc03-5a-nitro-instance-type
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a message-processing cluster on Amazon EC2 instances in a single VPC. The nodes exchange data directly over a proprietary protocol that does not support TLS. The security team requires that this traffic between instances be encrypted in transit without any change to the software.

    Which instance type should the company use for the cluster nodes?
  fr: |
    AnyCompany exécute un cluster de traitement de messages sur des instances Amazon EC2 dans un seul VPC. Les nœuds échangent des données directement par un protocole propriétaire qui ne prend pas en charge TLS. L'équipe de sécurité exige que ce trafic entre instances soit chiffré en transit sans aucune modification du logiciel.

    Quel type d'instance l'entreprise doit-elle utiliser pour les nœuds du cluster ?
body:
  options:
    - { id: a, text: "t3.xlarge" }
    - { id: b, text: "m5.xlarge" }
    - { id: c, text: "c5.xlarge" }
    - { id: d, text: "m6i.xlarge" }
answer: { optionId: d }
explanation:
  correct:
    en: "Some instance types use the offload capabilities of the Nitro System to encrypt traffic between instances automatically, with no performance impact. M6i is in the supported list, so traffic between M6i instances in the same VPC is encrypted without changes. The describe-instance-types filter network-info.encryption-in-transit-supported lists the supported types."
    fr: "Certains types d'instance utilisent les capacités de délestage du système Nitro pour chiffrer automatiquement le trafic entre instances, sans impact sur les performances. M6i figure dans la liste prise en charge : le trafic entre instances M6i du même VPC est chiffré sans modification. Le filtre network-info.encryption-in-transit-supported de describe-instance-types liste les types pris en charge."
  options:
    a:
      en: "T3 instances do not support automatic encryption of traffic between instances."
      fr: "Les instances T3 ne prennent pas en charge le chiffrement automatique du trafic entre instances."
    b:
      en: "M5 runs on Nitro, but only the M5dn, M5n, and M5zn variants support automatic encryption between instances."
      fr: "M5 s'exécute sur Nitro, mais seules les variantes M5dn, M5n et M5zn prennent en charge le chiffrement automatique entre instances."
    c:
      en: "C5 runs on Nitro, but only the C5n variant of that generation supports automatic encryption between instances."
      fr: "C5 s'exécute sur Nitro, mais seule la variante C5n de cette génération prend en charge le chiffrement automatique entre instances."
references:
  - title: Data protection in Amazon EC2 - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/data-protection.html
