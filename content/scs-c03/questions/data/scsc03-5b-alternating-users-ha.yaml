id: scsc03-5b-alternating-users-ha
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's order API connects to an Amazon Aurora PostgreSQL database with an application user whose credentials are stored in AWS Secrets Manager. The secret must rotate every 30 days. The API handles thousands of requests per minute and cannot tolerate any authentication failure while a rotation is in progress. A separate secret already stores the credentials of a database superuser.

    Which rotation configuration will meet these requirements?
  fr: |
    L'API de commandes d'AnyCompany se connecte à une base de données Amazon Aurora PostgreSQL avec un utilisateur applicatif dont les informations d'identification sont stockées dans AWS Secrets Manager. Le secret doit faire l'objet d'une rotation tous les 30 jours. L'API traite des milliers de requêtes par minute et ne tolère aucun échec d'authentification pendant une rotation. Un secret distinct stocke déjà les informations d'identification d'un superutilisateur de la base de données.

    Quelle configuration de rotation répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use a Lambda rotation function with the single user strategy, and add a retry with backoff in the API's database connection code."
        fr: "Utiliser une fonction de rotation Lambda avec la stratégie à utilisateur unique, et ajouter une nouvelle tentative avec temporisation dans le code de connexion de l'API à la base de données."
    - id: b
      text:
        en: "Use a Lambda rotation function with the alternating users strategy, and specify the superuser secret so that the function can create and update the cloned user."
        fr: "Utiliser une fonction de rotation Lambda avec la stratégie à utilisateurs alternés, et indiquer le secret du superutilisateur pour que la fonction puisse créer et mettre à jour l'utilisateur cloné."
    - id: c
      text:
        en: "Turn on managed rotation for the application user's secret so that Aurora rotates it without a Lambda function."
        fr: "Activer la rotation gérée pour le secret de l'utilisateur applicatif afin qu'Aurora en effectue la rotation sans fonction Lambda."
    - id: d
      text:
        en: "Use a Lambda rotation function with the single user strategy, and rotate the secret every 4 hours so that each password is valid for a shorter time."
        fr: "Utiliser une fonction de rotation Lambda avec la stratégie à utilisateur unique, et effectuer la rotation du secret toutes les 4 heures pour que chaque mot de passe soit valide moins longtemps."
answer: { optionId: b }
explanation:
  correct:
    en: "The alternating users strategy rotates between two users, so an application that retrieves the secret during rotation still gets a valid set of credentials, which suits applications that require high availability. Most users cannot clone themselves, so the function needs the superuser credentials from another secret."
    fr: "La stratégie à utilisateurs alternés alterne entre deux utilisateurs : une application qui récupère le secret pendant la rotation obtient toujours des informations d'identification valides, ce qui convient aux applications qui exigent une haute disponibilité. La plupart des utilisateurs ne peuvent pas se cloner eux-mêmes : la fonction a besoin des informations d'identification du superutilisateur stockées dans un autre secret."
  options:
    a:
      en: "With single user rotation there is a short period when the database can deny the old credentials, so authentication failures can still occur even with retries."
      fr: "Avec la rotation à utilisateur unique, il existe une courte période pendant laquelle la base de données peut refuser les anciennes informations d'identification : des échecs d'authentification restent possibles même avec des nouvelles tentatives."
    c:
      en: "Managed rotation applies to the master user credentials that Aurora manages, not to application users created in the database."
      fr: "La rotation gérée s'applique aux informations d'identification de l'utilisateur principal gérées par Aurora, pas aux utilisateurs applicatifs créés dans la base de données."
    d:
      en: "Rotating more often with the single user strategy increases the number of windows in which authentication can fail."
      fr: "Effectuer la rotation plus souvent avec la stratégie à utilisateur unique multiplie les périodes pendant lesquelles l'authentification peut échouer."
references:
  - title: Lambda function rotation strategies
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotation-strategy.html
