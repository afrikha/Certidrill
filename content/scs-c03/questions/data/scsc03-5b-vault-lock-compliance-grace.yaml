id: scsc03-5b-vault-lock-compliance-grace
objective: "5.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany stores backups of its Amazon RDS databases in an AWS Backup vault. After a ransomware incident at a partner, the security team requires that no user, including the root user, be able to delete recovery points in the vault or change their lifecycle. The team wants 3 days to test the settings and fix mistakes before the protection becomes permanent.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke les sauvegardes de ses bases de données Amazon RDS dans un coffre AWS Backup. Après un incident de rançongiciel chez un partenaire, l'équipe de sécurité exige qu'aucun utilisateur, y compris l'utilisateur racine, ne puisse supprimer les points de récupération du coffre ni modifier leur cycle de vie. L'équipe veut 3 jours pour tester les paramètres et corriger les erreurs avant que la protection ne devienne permanente.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach a vault access policy that denies backup:DeleteRecoveryPoint and backup:UpdateRecoveryPointLifecycle to all principals, and remove it after 3 days if needed."
        fr: "Associer une politique d'accès au coffre qui refuse backup:DeleteRecoveryPoint et backup:UpdateRecoveryPointLifecycle à tous les principaux, et la retirer après 3 jours si nécessaire."
    - id: b
      text:
        en: "Lock the vault with AWS Backup Vault Lock in governance mode, and remove the lock after 3 days if the settings are wrong."
        fr: "Verrouiller le coffre avec AWS Backup Vault Lock en mode gouvernance (governance), et retirer le verrou après 3 jours si les paramètres sont erronés."
    - id: c
      text:
        en: "Attach a service control policy (SCP) to the account that denies backup:DeleteRecoveryPoint, and detach it after 3 days if needed."
        fr: "Associer au compte une politique de contrôle des services (SCP) qui refuse backup:DeleteRecoveryPoint, et la dissocier après 3 jours si nécessaire."
    - id: d
      text:
        en: "Lock the vault with AWS Backup Vault Lock in compliance mode by setting ChangeableForDays to 3."
        fr: "Verrouiller le coffre avec AWS Backup Vault Lock en mode conformité (compliance) en définissant ChangeableForDays sur 3."
answer: { optionId: d }
explanation:
  correct:
    en: "Including ChangeableForDays creates a compliance mode lock with a grace time of at least 3 days, during which the lock can be changed or removed. After the grace time, the lock is immutable, and AWS Backup denies any attempt, including by the root user, to delete a backup or change its lifecycle."
    fr: "Inclure ChangeableForDays crée un verrou en mode conformité avec un délai de grâce d'au moins 3 jours, pendant lequel le verrou peut être modifié ou supprimé. Après le délai de grâce, le verrou est immuable, et AWS Backup refuse toute tentative, y compris de l'utilisateur racine, de supprimer une sauvegarde ou de modifier son cycle de vie."
  options:
    a:
      en: "An administrator can edit or remove a vault access policy at any time, so the protection never becomes permanent."
      fr: "Un administrateur peut modifier ou supprimer une politique d'accès au coffre à tout moment : la protection ne devient jamais permanente."
    b:
      en: "A governance mode lock can be removed at any time by users with sufficient IAM permissions, so it never becomes permanent."
      fr: "Un verrou en mode gouvernance peut être retiré à tout moment par des utilisateurs disposant d'autorisations IAM suffisantes : il ne devient jamais permanent."
    c:
      en: "An SCP can be detached by the management account at any time and does not cover lifecycle changes, so the protection is not permanent."
      fr: "Une SCP peut être dissociée à tout moment par le compte de gestion et ne couvre pas les modifications de cycle de vie : la protection n'est pas permanente."
references:
  - title: AWS Backup Vault Lock
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html
