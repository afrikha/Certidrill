id: scsc03-5b-imported-on-demand-rotation
objective: "5.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany encrypts data in 30 AWS services with a symmetric encryption KMS key that uses imported key material. The key ARN is written into dozens of key policies, IAM policies and resource configurations. Auditors now require that the key material be rotated every year with new material from the on-premises HSM. Existing ciphertext must stay decryptable, and the key ARN must not change.

    Which solution will meet these requirements?
  fr: |
    AnyCompany chiffre des données dans 30 services AWS avec une clé KMS de chiffrement symétrique qui utilise des éléments de clé importés. L'ARN de la clé figure dans des dizaines de politiques de clé, de politiques IAM et de configurations de ressources. Les auditeurs exigent désormais une rotation annuelle des éléments de clé avec de nouveaux éléments issus du HSM sur site. Les textes chiffrés existants doivent rester déchiffrables, et l'ARN de la clé ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Call EnableKeyRotation on the key with RotationPeriodInDays set to 365, and import new key material each year when AWS KMS reports that rotation is due."
        fr: "Appeler EnableKeyRotation sur la clé avec RotationPeriodInDays défini sur 365, et importer de nouveaux éléments de clé chaque année lorsqu'AWS KMS signale que la rotation est due."
    - id: b
      text:
        en: "Each year, create a new KMS key with an EXTERNAL origin, import the new key material into it, and update the alias to point to the new key."
        fr: "Chaque année, créer une nouvelle clé KMS d'origine EXTERNAL, y importer les nouveaux éléments de clé, et mettre à jour l'alias pour qu'il pointe vers la nouvelle clé."
    - id: c
      text:
        en: "Each year, import the new key material into the same key with ImportType set to NEW_KEY_MATERIAL, call RotateKeyOnDemand, and keep every earlier key material from expiring or being deleted."
        fr: "Chaque année, importer les nouveaux éléments de clé dans la même clé avec ImportType défini sur NEW_KEY_MATERIAL, appeler RotateKeyOnDemand, et empêcher l'expiration ou la suppression de tous les éléments de clé antérieurs."
    - id: d
      text:
        en: "Each year, reimport the current key material with a new expiration date, so that AWS KMS creates a new version of the key material."
        fr: "Chaque année, réimporter les éléments de clé actuels avec une nouvelle date d'expiration, pour qu'AWS KMS crée une nouvelle version des éléments de clé."
answer: { optionId: c }
explanation:
  correct:
    en: "Symmetric encryption keys with an EXTERNAL origin support on-demand rotation: new key material is imported with ImportType NEW_KEY_MATERIAL, waits in the pending rotation state, and becomes current when RotateKeyOnDemand runs. The key ID and ARN stay the same, but the key becomes unusable as soon as any of its key materials expires or is deleted, so earlier material must stay available."
    fr: "Les clés de chiffrement symétrique d'origine EXTERNAL prennent en charge la rotation à la demande : de nouveaux éléments de clé sont importés avec ImportType NEW_KEY_MATERIAL, restent à l'état de rotation en attente, puis deviennent actuels lorsque RotateKeyOnDemand s'exécute. L'ID et l'ARN de la clé restent les mêmes, mais la clé devient inutilisable dès que l'un de ses éléments de clé expire ou est supprimé : les éléments antérieurs doivent rester disponibles."
  options:
    a:
      en: "Automatic key rotation is supported only for keys with AWS-generated key material (AWS_KMS origin), not for keys with imported key material."
      fr: "La rotation automatique n'est prise en charge que pour les clés dont les éléments sont générés par AWS (origine AWS_KMS), pas pour les clés avec des éléments de clé importés."
    b:
      en: "Manual rotation creates a key with a different ARN, so every policy and configuration that references the key ARN would have to be updated."
      fr: "La rotation manuelle crée une clé avec un ARN différent : chaque politique et configuration qui référence l'ARN de la clé devrait être mise à jour."
    d:
      en: "Reimporting the same key material only changes its expiration; the material itself, and therefore the cryptographic key, does not change."
      fr: "Réimporter les mêmes éléments de clé ne change que leur expiration ; les éléments eux-mêmes, et donc la clé cryptographique, ne changent pas."
references:
  - title: Perform on-demand key rotation
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotating-keys-on-demand.html
  - title: Rotate AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
