id: scsc03-5a-eks-api-data-cmk
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs Amazon EKS clusters on Kubernetes versions 1.28 or later with the default encryption configuration. Auditors require that the key that protects Kubernetes secrets and other Kubernetes API data at rest be a key that the company controls with its own key policy, that the company can disable, and whose use is recorded in the company's AWS CloudTrail trail.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des clusters Amazon EKS en versions Kubernetes 1.28 ou ultérieures avec la configuration de chiffrement par défaut. Les auditeurs exigent que la clé qui protège au repos les secrets Kubernetes et les autres données de l'API Kubernetes soit une clé que l'entreprise contrôle avec sa propre politique de clé, qu'elle peut désactiver, et dont l'utilisation est enregistrée dans le journal de suivi AWS CloudTrail de l'entreprise.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Associate a symmetric customer managed KMS key with each cluster as the key encryption key for envelope encryption."
        fr: "Associer à chaque cluster une clé KMS symétrique gérée par le client comme clé de chiffrement de clé pour le chiffrement d'enveloppe."
    - id: b
      text:
        en: "Keep the default envelope encryption of the clusters, which already encrypts all Kubernetes API data."
        fr: "Garder le chiffrement d'enveloppe par défaut des clusters, qui chiffre déjà toutes les données de l'API Kubernetes."
    - id: c
      text:
        en: "Enable EBS encryption by default with a customer managed key in the Region, and replace the nodes of the node groups."
        fr: "Activer le chiffrement EBS par défaut avec une clé gérée par le client dans la Région, et remplacer les nœuds des groupes de nœuds."
    - id: d
      text:
        en: "Move the application secrets to AWS Secrets Manager, and mount them in the pods with the Secrets Store CSI Driver."
        fr: "Déplacer les secrets applicatifs vers AWS Secrets Manager, et les monter dans les pods avec le pilote Secrets Store CSI."
answer: { optionId: a }
explanation:
  correct:
    en: "From Kubernetes 1.28, EKS envelope-encrypts all Kubernetes API data by default, with an AWS owned key as the key encryption key. Associating a customer managed KMS key makes it the key encryption key for all Kubernetes API data, so the company controls it through its key policy, can disable it, and sees its use in CloudTrail. A disabled key leaves the cluster degraded, so disabling must be planned."
    fr: "Depuis Kubernetes 1.28, EKS chiffre par enveloppe toutes les données de l'API Kubernetes par défaut, avec une clé détenue par AWS comme clé de chiffrement de clé. Associer une clé KMS gérée par le client en fait la clé de chiffrement de clé de toutes les données de l'API Kubernetes : l'entreprise la contrôle par sa politique de clé, peut la désactiver et voit son utilisation dans CloudTrail. Une clé désactivée dégrade le cluster : la désactivation doit donc être planifiée."
  options:
    b:
      en: "The default key encryption key is an AWS owned key, which the company cannot control, disable, or audit in its own account."
      fr: "La clé de chiffrement de clé par défaut est une clé détenue par AWS, que l'entreprise ne peut ni contrôler, ni désactiver, ni auditer dans son propre compte."
    c:
      en: "EBS encryption protects the volumes of the worker nodes, not the Kubernetes API data stored in the control plane."
      fr: "Le chiffrement EBS protège les volumes des nœuds de travail, pas les données de l'API Kubernetes stockées dans le plan de contrôle."
    d:
      en: "This protects only the moved secrets and requires application changes; the other Kubernetes API data stays under the AWS owned key."
      fr: "Cela ne protège que les secrets déplacés et exige des modifications des applications ; les autres données de l'API Kubernetes restent sous la clé détenue par AWS."
references:
  - title: Default envelope encryption for all Kubernetes API Data - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/envelope-encryption.html
