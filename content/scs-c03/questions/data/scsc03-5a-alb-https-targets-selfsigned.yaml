id: scsc03-5a-alb-https-targets-selfsigned
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. The HTTPS listener uses an ACM certificate and forwards to a target group that uses HTTP on port 80. An auditor now requires that traffic also be encrypted between the load balancer and the instances. Instances are replaced several times each day, and the security team does not want to buy, issue, or distribute CA-signed certificates for the instances.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany exécute une application web sur des instances Amazon EC2 d'un groupe Auto Scaling, derrière un Application Load Balancer. L'écouteur HTTPS utilise un certificat ACM et transfère vers un groupe cible qui utilise HTTP sur le port 80. Un auditeur exige désormais que le trafic soit aussi chiffré entre l'équilibreur de charge et les instances. Les instances sont remplacées plusieurs fois par jour, et l'équipe de sécurité ne veut ni acheter, ni émettre, ni distribuer de certificats signés par une autorité de certification pour les instances.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Place a Network Load Balancer with a TLS listener that uses the ACM certificate behind the ALB, and keep the instances in an HTTP target group."
        fr: "Placer derrière l'ALB un Network Load Balancer avec un écouteur TLS qui utilise le certificat ACM, et garder les instances dans un groupe cible HTTP."
    - id: b
      text:
        en: "Create an HTTPS target group, have each instance generate a self-signed certificate at launch and serve HTTPS, and forward the listener to it."
        fr: "Créer un groupe cible HTTPS, faire générer à chaque instance un certificat auto-signé au lancement pour servir HTTPS, et y transférer l'écouteur."
    - id: c
      text:
        en: "Issue a certificate from AWS Private CA to each instance at launch so that the load balancer can validate the target certificates."
        fr: "Émettre au lancement un certificat AWS Private CA pour chaque instance afin que l'équilibreur de charge puisse valider les certificats des cibles."
    - id: d
      text:
        en: "Enable mutual TLS in verify mode on the HTTPS listener so that the load balancer encrypts its connections to the targets."
        fr: "Activer le TLS mutuel en mode vérification sur l'écouteur HTTPS pour que l'équilibreur de charge chiffre ses connexions vers les cibles."
answer: { optionId: b }
explanation:
  correct:
    en: "With an HTTPS target group, the ALB opens TLS connections to the targets with the certificates installed on them, and it does not validate those certificates, so self-signed certificates work. Because the load balancer and the targets are in a VPC, the traffic is authenticated at the packet level. Generating a self-signed certificate at launch needs no CA and no distribution."
    fr: "Avec un groupe cible HTTPS, l'ALB ouvre des connexions TLS vers les cibles avec les certificats qui y sont installés, et il ne valide pas ces certificats : des certificats auto-signés fonctionnent. Comme l'équilibreur de charge et les cibles sont dans un VPC, le trafic est authentifié au niveau des paquets. Générer un certificat auto-signé au lancement ne demande ni autorité de certification ni distribution."
  options:
    a:
      en: "The traffic from the NLB to the instances would still use HTTP, so the hop to the instances stays unencrypted."
      fr: "Le trafic du NLB vers les instances utiliserait toujours HTTP : le tronçon vers les instances reste non chiffré."
    c:
      en: "The ALB does not validate target certificates, so issuing private CA certificates to every new instance adds cost and work without any benefit."
      fr: "L'ALB ne valide pas les certificats des cibles : émettre des certificats d'autorité privée pour chaque nouvelle instance ajoute du coût et du travail sans bénéfice."
    d:
      en: "Mutual TLS authenticates the client certificates of incoming connections; it does not change the protocol that the ALB uses toward the targets."
      fr: "Le TLS mutuel authentifie les certificats clients des connexions entrantes : il ne change pas le protocole que l'ALB utilise vers les cibles."
references:
  - title: Target groups for your Application Load Balancers - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html
