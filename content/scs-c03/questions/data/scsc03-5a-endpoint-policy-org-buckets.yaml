id: scsc03-5a-endpoint-policy-org-buckets
objective: "5.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs analytics workloads on Amazon EC2 instances in a VPC that reaches Amazon S3 only through a gateway endpoint. AnyCompany's accounts belong to an organization in AWS Organizations. The security team has two requirements. First, to prevent data exfiltration, the workloads must not be able to write to S3 buckets outside the organization, even if an attacker uses credentials from an account outside the organization on the instances. Second, a research bucket in the same account must reject every request that does not come through this endpoint, whoever the caller is.

    Which combination of controls will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany exécute des charges de travail d'analyse sur des instances Amazon EC2 dans un VPC qui n'accède à Amazon S3 que par un point de terminaison de passerelle. Les comptes d'AnyCompany appartiennent à une organisation AWS Organizations. L'équipe de sécurité a deux exigences. Premièrement, pour empêcher l'exfiltration de données, les charges de travail ne doivent pas pouvoir écrire dans des compartiments S3 extérieurs à l'organisation, même si un attaquant utilise sur les instances des informations d'identification d'un compte extérieur à l'organisation. Deuxièmement, un compartiment de recherche du même compte doit rejeter toute requête qui ne passe pas par ce point de terminaison, quel que soit l'appelant.

    Quelle combinaison de contrôles répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "A VPC endpoint policy that allows S3 actions only when aws:ResourceOrgID equals the organization ID."
        fr: "Une politique de point de terminaison de VPC qui n'autorise les actions S3 que lorsque aws:ResourceOrgID est égal à l'ID de l'organisation."
    - id: b
      text:
        en: "An SCP that denies S3 actions when aws:ResourceOrgID does not equal the organization ID."
        fr: "Une SCP qui refuse les actions S3 lorsque aws:ResourceOrgID n'est pas égal à l'ID de l'organisation."
    - id: c
      text:
        en: "A VPC endpoint policy that allows S3 actions only when aws:PrincipalOrgID equals the organization ID."
        fr: "Une politique de point de terminaison de VPC qui n'autorise les actions S3 que lorsque aws:PrincipalOrgID est égal à l'ID de l'organisation."
    - id: d
      text:
        en: "A bucket policy on the research bucket that denies all S3 actions when aws:SourceVpce does not equal the endpoint ID."
        fr: "Une politique de compartiment sur le compartiment de recherche qui refuse toutes les actions S3 lorsque aws:SourceVpce n'est pas égal à l'ID du point de terminaison."
    - id: e
      text:
        en: "An SCP that denies S3 actions on the research bucket when aws:SourceVpce does not equal the endpoint ID."
        fr: "Une SCP qui refuse les actions S3 sur le compartiment de recherche lorsque aws:SourceVpce n'est pas égal à l'ID du point de terminaison."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "An endpoint policy applies to every request that goes through the endpoint, whatever credentials are used, so allowing S3 only on resources whose aws:ResourceOrgID is the organization blocks writes to external buckets, even with foreign credentials. A bucket policy applies to every caller, so a Deny when aws:SourceVpce is not the endpoint ID makes the research bucket reachable only through the endpoint."
    fr: "Une politique de point de terminaison s'applique à toute requête qui passe par le point de terminaison, quelles que soient les informations d'identification : n'autoriser S3 que sur les ressources dont aws:ResourceOrgID est l'organisation bloque l'écriture dans des compartiments externes, même avec des informations d'identification étrangères. Une politique de compartiment s'applique à tous les appelants : un Deny lorsque aws:SourceVpce n'est pas l'ID du point de terminaison rend le compartiment de recherche accessible uniquement par le point de terminaison."
  options:
    b:
      en: "An SCP applies only to principals of the organization's accounts, so credentials from an outside account used on the instances would not be restricted."
      fr: "Une SCP ne s'applique qu'aux principaux des comptes de l'organisation : des informations d'identification d'un compte extérieur utilisées sur les instances ne seraient pas restreintes."
    c:
      en: "aws:PrincipalOrgID restricts who calls, not which bucket is called, so principals of the organization could still write to buckets outside it."
      fr: "aws:PrincipalOrgID restreint l'appelant, pas le compartiment appelé : les principaux de l'organisation pourraient toujours écrire dans des compartiments extérieurs."
    e:
      en: "An SCP does not affect principals outside the organization, so it cannot make the bucket reject every caller that bypasses the endpoint."
      fr: "Une SCP n'affecte pas les principaux extérieurs à l'organisation : elle ne peut pas faire rejeter par le compartiment tout appelant qui contourne le point de terminaison."
references:
  - title: Gateway endpoints for Amazon S3 - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html
  - title: Controlling access from VPC endpoints with bucket policies - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html
