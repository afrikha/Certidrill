id: scsc03-5b-mrk-replica-pending-import
objective: "5.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany created a multi-Region primary key with an EXTERNAL origin in us-east-1 and imported its key material. A security engineer then replicated the key to eu-west-1 for a disaster recovery application. The replica key in eu-west-1 is in the PendingImport state, and the application cannot decrypt data that was encrypted under the primary key.

    What should the engineer do to make the replica key usable?
  fr: |
    AnyCompany a créé dans us-east-1 une clé principale multi-Régions d'origine EXTERNAL et y a importé ses éléments de clé. Un ingénieur sécurité a ensuite répliqué la clé dans eu-west-1 pour une application de reprise après sinistre. La clé réplica d'eu-west-1 est à l'état PendingImport, et l'application ne peut pas déchiffrer les données chiffrées avec la clé principale.

    Que doit faire l'ingénieur pour rendre la clé réplica utilisable ?
body:
  options:
    - id: a
      text:
        en: "Download a wrapping public key and import token for the replica key in eu-west-1, and import the same key material that was imported into the primary key."
        fr: "Télécharger une clé publique d'encapsulation et un jeton d'importation pour la clé réplica dans eu-west-1, et importer les mêmes éléments de clé que ceux importés dans la clé principale."
    - id: b
      text:
        en: "Call RotateKeyOnDemand on the primary key so that AWS KMS copies the primary key's material to the replica key."
        fr: "Appeler RotateKeyOnDemand sur la clé principale pour qu'AWS KMS copie les éléments de clé de la clé principale vers la clé réplica."
    - id: c
      text:
        en: "Generate new key material in the HSM for eu-west-1, and import it into the replica key so that each Region has its own key material."
        fr: "Générer de nouveaux éléments de clé dans le HSM pour eu-west-1, et les importer dans la clé réplica pour que chaque Région ait ses propres éléments de clé."
    - id: d
      text:
        en: "Delete the replica key, and call ReplicateKey again with the primary key's import token so that the key material is copied during replication."
        fr: "Supprimer la clé réplica, et appeler de nouveau ReplicateKey avec le jeton d'importation de la clé principale pour que les éléments de clé soient copiés pendant la réplication."
answer: { optionId: a }
explanation:
  correct:
    en: "AWS KMS does not copy imported key material to replica keys: the same key material must be imported into each replica key individually, with a wrapping key and import token downloaded for that replica. Related multi-Region keys can decrypt each other's ciphertext only when they share the same key material."
    fr: "AWS KMS ne copie pas les éléments de clé importés vers les clés réplicas : les mêmes éléments de clé doivent être importés dans chaque clé réplica individuellement, avec une clé d'encapsulation et un jeton d'importation téléchargés pour ce réplica. Des clés multi-Régions associées ne peuvent déchiffrer leurs textes chiffrés respectifs que si elles partagent les mêmes éléments de clé."
  options:
    b:
      en: "On-demand rotation does not copy imported material to replicas; for EXTERNAL keys, new material must first be imported into the primary key and each replica."
      fr: "La rotation à la demande ne copie pas d'éléments importés vers les réplicas ; pour les clés EXTERNAL, de nouveaux éléments doivent d'abord être importés dans la clé principale et dans chaque réplica."
    c:
      en: "A replica with different key material could not decrypt ciphertext produced by the primary key, so it would not serve the disaster recovery application."
      fr: "Un réplica doté d'éléments de clé différents ne pourrait pas déchiffrer les textes chiffrés produits par la clé principale : il ne servirait pas l'application de reprise après sinistre."
    d:
      en: "An import token is tied to the key it was downloaded for and is not a ReplicateKey parameter; a new replica also starts in the PendingImport state."
      fr: "Un jeton d'importation est lié à la clé pour laquelle il a été téléchargé et n'est pas un paramètre de ReplicateKey ; un nouveau réplica démarre lui aussi à l'état PendingImport."
references:
  - title: Rotate AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
  - title: "Step 4: Import the key material"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-import-key-material.html
