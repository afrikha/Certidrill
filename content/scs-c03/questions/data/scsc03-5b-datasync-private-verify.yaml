id: scsc03-5b-datasync-private-verify
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is copying 200 TB of medical images from an on-premises NFS server to Amazon EFS with AWS DataSync. The data center connects to a VPC through AWS Direct Connect with a private virtual interface and has no route to the internet for transfer traffic. The DataSync agent's traffic to AWS must not use public IP addresses. At the end of each task execution, DataSync must compare checksums of the transferred data between the source and the destination.

    Which solution will meet these requirements?
  fr: |
    AnyCompany copie 200 To d'images médicales d'un serveur NFS sur site vers Amazon EFS avec AWS DataSync. Le centre de données est connecté à un VPC par AWS Direct Connect avec une interface virtuelle privée et n'a pas de route vers Internet pour le trafic de transfert. Le trafic de l'agent DataSync vers AWS ne doit pas utiliser d'adresses IP publiques. À la fin de chaque exécution de tâche, DataSync doit comparer les sommes de contrôle des données transférées entre la source et la destination.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Activate the agent with a DataSync FIPS public service endpoint, and set the task's VerifyMode to ONLY_FILES_TRANSFERRED."
        fr: "Activer l'agent avec un point de terminaison de service public FIPS de DataSync, et définir le VerifyMode de la tâche sur ONLY_FILES_TRANSFERRED."
    - id: b
      text:
        en: "Activate the agent with a VPC service endpoint for DataSync in the connected VPC, and set the task's VerifyMode to ONLY_FILES_TRANSFERRED."
        fr: "Activer l'agent avec un point de terminaison de service VPC pour DataSync dans le VPC connecté, et définir le VerifyMode de la tâche sur ONLY_FILES_TRANSFERRED."
    - id: c
      text:
        en: "Activate the agent with a VPC service endpoint for DataSync in the connected VPC, and set the task's VerifyMode to NONE."
        fr: "Activer l'agent avec un point de terminaison de service VPC pour DataSync dans le VPC connecté, et définir le VerifyMode de la tâche sur NONE."
    - id: d
      text:
        en: "Activate the agent with a DataSync public service endpoint, mount the EFS file system with TLS, and set the task's VerifyMode to ONLY_FILES_TRANSFERRED."
        fr: "Activer l'agent avec un point de terminaison de service public de DataSync, monter le système de fichiers EFS avec TLS, et définir le VerifyMode de la tâche sur ONLY_FILES_TRANSFERRED."
answer: { optionId: b }
explanation:
  correct:
    en: "A VPC service endpoint gives the agent a private connection to AWS that does not cross the internet or use public IP addresses, and it is reachable over the private virtual interface. ONLY_FILES_TRANSFERRED makes DataSync compare, at the end of the transfer, the checksum calculated at the source with the checksum of the same data at the destination."
    fr: "Un point de terminaison de service VPC fournit à l'agent une connexion privée vers AWS qui ne traverse pas Internet et n'utilise pas d'adresses IP publiques, et il est joignable par l'interface virtuelle privée. ONLY_FILES_TRANSFERRED oblige DataSync à comparer, à la fin du transfert, la somme de contrôle calculée à la source avec celle des mêmes données à la destination."
  options:
    a:
      en: "A FIPS public endpoint changes the cryptographic modules, but the agent still reaches public IP addresses, which the requirements forbid."
      fr: "Un point de terminaison public FIPS change les modules cryptographiques, mais l'agent joint toujours des adresses IP publiques, ce que les exigences interdisent."
    c:
      en: "With NONE, DataSync checks integrity only during the transfer and does not compare the source and destination at the end."
      fr: "Avec NONE, DataSync vérifie l'intégrité uniquement pendant le transfert et ne compare pas la source et la destination à la fin."
    d:
      en: "A public service endpoint requires a path to public IP addresses, which the data center does not have and the requirements forbid."
      fr: "Un point de terminaison de service public exige un chemin vers des adresses IP publiques, que le centre de données n'a pas et que les exigences interdisent."
references:
  - title: AWS DataSync network requirements
    url: https://docs.aws.amazon.com/datasync/latest/userguide/datasync-network.html
  - title: Configuring how AWS DataSync verifies data integrity
    url: https://docs.aws.amazon.com/datasync/latest/userguide/configure-data-verification-options.html
