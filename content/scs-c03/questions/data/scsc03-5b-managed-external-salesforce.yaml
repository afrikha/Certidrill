id: scsc03-5b-managed-external-salesforce
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's integration services authenticate to Salesforce with a client secret that is stored in AWS Secrets Manager. A developer rotates the client secret manually every quarter. The security team requires automatic rotation of the client secret on the partner's system and full audit logging of rotations. The team does not want to write, deploy or maintain any rotation code.

    Which solution will meet these requirements?
  fr: |
    Les services d'intégration d'AnyCompany s'authentifient auprès de Salesforce avec un secret client stocké dans AWS Secrets Manager. Un développeur effectue manuellement la rotation du secret client chaque trimestre. L'équipe de sécurité exige une rotation automatique du secret client sur le système du partenaire et une journalisation d'audit complète des rotations. L'équipe ne veut ni écrire, ni déployer, ni maintenir de code de rotation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Write a Lambda rotation function from the generic rotation template that calls the Salesforce API, and turn on rotation for the existing secret."
        fr: "Écrire une fonction de rotation Lambda à partir du modèle de rotation générique qui appelle l'API Salesforce, et activer la rotation du secret existant."
    - id: b
      text:
        en: "Store the client secret as a Secrets Manager managed external secret in the format that Salesforce defines, with automatic rotation turned on."
        fr: "Stocker le secret client comme secret externe géré (managed external secret) Secrets Manager au format défini par Salesforce, avec la rotation automatique activée."
    - id: c
      text:
        en: "Move the client secret to a SecureString parameter in Parameter Store, and create an Amazon EventBridge schedule that reminds the developer to rotate it."
        fr: "Déplacer le secret client vers un paramètre SecureString de Parameter Store, et créer une planification Amazon EventBridge qui rappelle au développeur d'en effectuer la rotation."
    - id: d
      text:
        en: "Turn on managed rotation for the existing secret with the same procedure that Amazon RDS uses for master user credentials."
        fr: "Activer la rotation gérée du secret existant avec la même procédure qu'Amazon RDS pour les informations d'identification de l'utilisateur principal."
answer: { optionId: b }
explanation:
  correct:
    en: "Managed external secrets store credentials of Secrets Manager integration partners, such as Salesforce, in a predefined format and rotate them on the partner's system without any Lambda function in the account. Rotation activity, value updates and management operations are logged in AWS CloudTrail."
    fr: "Les secrets externes gérés stockent les informations d'identification des partenaires d'intégration de Secrets Manager, comme Salesforce, dans un format prédéfini et en effectuent la rotation sur le système du partenaire sans aucune fonction Lambda dans le compte. L'activité de rotation, les mises à jour de valeur et les opérations de gestion sont journalisées dans AWS CloudTrail."
  options:
    a:
      en: "A custom rotation function is rotation code that the team must write, deploy and maintain."
      fr: "Une fonction de rotation personnalisée est du code de rotation que l'équipe doit écrire, déployer et maintenir."
    c:
      en: "Parameter Store has no built-in rotation, and a reminder keeps the rotation manual."
      fr: "Parameter Store n'offre pas de rotation intégrée, et un rappel laisse la rotation manuelle."
    d:
      en: "Managed rotation is offered by AWS services for the secrets they manage, such as RDS master user credentials; it does not apply to a secret created for a third-party system."
      fr: "La rotation gérée est proposée par des services AWS pour les secrets qu'ils gèrent, comme les informations d'identification de l'utilisateur principal RDS ; elle ne s'applique pas à un secret créé pour un système tiers."
references:
  - title: Using AWS Secrets Manager managed external secrets to manage Third Party secrets
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/managed-external-secrets.html
