id: scsc03-5b-kms-hmac-tokens
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's payment microservices exchange short messages of less than 2 KB through Amazon SQS. Each receiving service must confirm that a message was produced by an authorized sender and was not modified. The key that protects the messages must never leave AWS KMS in plaintext. Only principals that are allowed by the key policy can be able to produce or check the integrity tag, so verification must not be possible with any material that can be downloaded and shared.

    Which solution will meet these requirements?
  fr: |
    Les microservices de paiement d'AnyCompany échangent par Amazon SQS de courts messages de moins de 2 Ko. Chaque service destinataire doit confirmer qu'un message a été produit par un expéditeur autorisé et n'a pas été modifié. La clé qui protège les messages ne doit jamais quitter AWS KMS en clair. Seuls les principaux autorisés par la politique de clé doivent pouvoir produire ou vérifier la balise d'intégrité : la vérification ne doit être possible avec aucun élément pouvant être téléchargé et partagé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an asymmetric KMS key with the SIGN_VERIFY key usage. Sign each message with the Sign operation, and have receivers verify the signature locally with the public key from GetPublicKey."
        fr: "Créer une clé KMS asymétrique avec l'utilisation de clé SIGN_VERIFY. Signer chaque message avec l'opération Sign, et faire vérifier la signature localement par les destinataires avec la clé publique obtenue par GetPublicKey."
    - id: b
      text:
        en: "Create a symmetric encryption KMS key. Have senders call GenerateDataKey, compute an HMAC with the plaintext data key in the application, and send the encrypted data key with the message."
        fr: "Créer une clé KMS de chiffrement symétrique. Faire appeler GenerateDataKey par les expéditeurs, calculer un HMAC avec la clé de données en clair dans l'application, et envoyer la clé de données chiffrée avec le message."
    - id: c
      text:
        en: "Create an HMAC KMS key. Have senders call GenerateMac on each message, and have receivers call VerifyMac with the same key and MAC algorithm."
        fr: "Créer une clé KMS HMAC. Faire appeler GenerateMac sur chaque message par les expéditeurs, et faire appeler VerifyMac par les destinataires avec la même clé et le même algorithme MAC."
    - id: d
      text:
        en: "Enable server-side encryption on the SQS queue with a customer managed KMS key, and allow only the authorized senders to call kms:GenerateDataKey."
        fr: "Activer le chiffrement côté serveur sur la file SQS avec une clé KMS gérée par le client, et autoriser uniquement les expéditeurs autorisés à appeler kms:GenerateDataKey."
answer: { optionId: c }
explanation:
  correct:
    en: "HMAC KMS keys support only GenerateMac and VerifyMac, accept messages up to 4,096 bytes, and their key material never leaves AWS KMS unencrypted. Both generating and verifying the tag require a call to AWS KMS that the key policy authorizes, so no shareable material can be used to verify messages."
    fr: "Les clés KMS HMAC prennent en charge uniquement GenerateMac et VerifyMac, acceptent des messages jusqu'à 4 096 octets, et leurs éléments de clé ne quittent jamais AWS KMS en clair. La génération comme la vérification de la balise exigent un appel à AWS KMS autorisé par la politique de clé : aucun élément partageable ne permet de vérifier les messages."
  options:
    a:
      en: "The public key can be downloaded and shared, so anyone who obtains it can verify signatures outside the control of the key policy."
      fr: "La clé publique peut être téléchargée et partagée : quiconque l'obtient peut vérifier les signatures hors du contrôle de la politique de clé."
    b:
      en: "The plaintext data key is exposed to the application, so the key that protects the messages leaves AWS KMS in plaintext."
      fr: "La clé de données en clair est exposée à l'application : la clé qui protège les messages quitte AWS KMS en clair."
    d:
      en: "Queue encryption protects messages at rest; it does not let a receiver prove which sender produced a message or that the sender's content was not altered."
      fr: "Le chiffrement de la file protège les messages au repos ; il ne permet pas au destinataire de prouver quel expéditeur a produit un message ni que son contenu n'a pas été altéré."
references:
  - title: HMAC keys in AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/hmac.html
