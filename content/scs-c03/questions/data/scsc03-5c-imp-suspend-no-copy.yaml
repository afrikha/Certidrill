id: scsc03-5c-imp-suspend-no-copy
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany, a bank, encrypts data in Amazon S3 and Amazon DynamoDB with a symmetric customer managed KMS key whose key material was imported from the bank's on-premises HSM. The bank keeps the original key material in that HSM. A regulator requires a documented suspension procedure for declared incidents. During a suspension, the key must become unusable within minutes, and AWS KMS must not retain any copy of the key material. After the incident, the bank must restore access to all existing data without re-encrypting it.

    Which procedure will meet these requirements?
  fr: |
    AnyCompany, une banque, chiffre des données dans Amazon S3 et Amazon DynamoDB avec une clé KMS symétrique gérée par le client dont les éléments de clé ont été importés depuis le HSM sur site de la banque. La banque conserve les éléments de clé d'origine dans ce HSM. Un régulateur exige une procédure de suspension documentée pour les incidents déclarés. Pendant une suspension, la clé doit devenir inutilisable en quelques minutes, et AWS KMS ne doit conserver aucune copie des éléments de clé. Après l'incident, la banque doit rétablir l'accès à toutes les données existantes sans les rechiffrer.

    Quelle procédure permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Call DeleteImportedKeyMaterial on the key when the incident is declared, and reimport the same key material from the on-premises HSM when it is closed.
        fr: |-
          Appeler DeleteImportedKeyMaterial sur la clé à la déclaration de l'incident, et réimporter les mêmes éléments de clé depuis le HSM sur site à sa clôture.
    - id: b
      text:
        en: |-
          Disable the KMS key when the incident is declared, and enable the key again when the incident is closed.
        fr: |-
          Désactiver la clé KMS à la déclaration de l'incident, et réactiver la clé à la clôture de l'incident.
    - id: c
      text:
        en: |-
          Schedule the deletion of the KMS key with a 7-day waiting period when the incident is declared, and cancel the deletion when the incident is closed.
        fr: |-
          Planifier la suppression de la clé KMS avec une période d'attente de 7 jours à la déclaration de l'incident, et annuler la suppression à la clôture de l'incident.
    - id: d
      text:
        en: |-
          Replace the key policy with one that allows only the key administrators when the incident is declared, and restore the original key policy when it is closed.
        fr: |-
          Remplacer la politique de clé par une politique qui n'autorise que les administrateurs de clé à la déclaration de l'incident, et restaurer la politique de clé d'origine à sa clôture.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Deleting imported key material is a way to halt the use of a key quickly but temporarily: the key enters the PendingImport state and AWS KMS no longer holds the material. Reimporting the same material (with a new wrapping public key and import token) makes the key usable again, and the existing ciphertext can be decrypted without re-encryption. This option exists only for keys with imported material.
    fr: |-
      Supprimer des éléments de clé importés permet d'arrêter rapidement mais temporairement l'utilisation d'une clé : la clé passe à l'état PendingImport et AWS KMS ne détient plus les éléments. Réimporter les mêmes éléments (avec une nouvelle clé publique d'encapsulation et un nouveau jeton d'importation) rend la clé de nouveau utilisable, et le texte chiffré existant peut être déchiffré sans rechiffrement. Cette option n'existe que pour les clés avec des éléments importés.
  options:
    b:
      en: |-
        Disabling the key makes it unusable, but AWS KMS keeps the key material, which the regulator forbids during a suspension.
      fr: |-
        Désactiver la clé la rend inutilisable, mais AWS KMS conserve les éléments de clé, ce que le régulateur interdit pendant une suspension.
    c:
      en: |-
        A key pending deletion keeps its material, and if the incident lasts longer than the waiting period, the key and its material are deleted permanently and the data becomes unrecoverable.
      fr: |-
        Une clé en attente de suppression conserve ses éléments, et si l'incident dure plus longtemps que la période d'attente, la clé et ses éléments sont supprimés définitivement et les données deviennent irrécupérables.
    d:
      en: |-
        Withdrawing permissions blocks the applications, but AWS KMS still holds the key material, and grants that services use would keep working.
      fr: |-
        Retirer les autorisations bloque les applications, mais AWS KMS détient toujours les éléments de clé, et les octrois utilisés par les services continueraient de fonctionner.
references:
  - title: Delete imported key material - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-delete-key-material.html
  - title: "Step 4: Import the key material - AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-import-key-material.html
