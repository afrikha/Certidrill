id: scsc03-5c-mask-guardrail-io
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is building a generative AI assistant on Amazon Bedrock for its call center. Agents paste call transcripts into the prompt. The model must never receive customer names or phone numbers, but requests that contain them must still be processed with placeholders in place of the values. Any prompt that contains an AWS secret access key must be rejected entirely with a configured message. The company will use a guardrail with sensitive information filters.

    Which configuration will meet these requirements?
  fr: |
    AnyCompany crée un assistant d'IA générative sur Amazon Bedrock pour son centre d'appels. Les agents collent des transcriptions d'appels dans l'invite. Le modèle ne doit jamais recevoir les noms ni les numéros de téléphone des clients, mais les requêtes qui en contiennent doivent quand même être traitées, avec des espaces réservés à la place des valeurs. Toute invite qui contient une clé d'accès secrète AWS doit être entièrement rejetée avec un message configuré. L'entreprise utilisera un garde-fou avec des filtres d'informations sensibles.

    Quelle configuration permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Set the input action to ANONYMIZE for the NAME and PHONE entity types, and set the input action to BLOCK for the AWS_SECRET_KEY entity type.
        fr: |-
          Définir l'action d'entrée sur ANONYMIZE pour les types d'entités NAME et PHONE, et définir l'action d'entrée sur BLOCK pour le type d'entité AWS_SECRET_KEY.
    - id: b
      text:
        en: |-
          Set the input action to BLOCK for the NAME and PHONE entity types, and set the input action to ANONYMIZE for the AWS_SECRET_KEY entity type.
        fr: |-
          Définir l'action d'entrée sur BLOCK pour les types d'entités NAME et PHONE, et définir l'action d'entrée sur ANONYMIZE pour le type d'entité AWS_SECRET_KEY.
    - id: c
      text:
        en: |-
          Set the output action to ANONYMIZE for the NAME, PHONE, and AWS_SECRET_KEY entity types, and keep the input action set to NONE.
        fr: |-
          Définir l'action de sortie sur ANONYMIZE pour les types d'entités NAME, PHONE et AWS_SECRET_KEY, et conserver l'action d'entrée NONE.
    - id: d
      text:
        en: |-
          Set the input action to NONE for the NAME, PHONE, and AWS_SECRET_KEY entity types, and have the application remove the values listed in the guardrail trace.
        fr: |-
          Définir l'action d'entrée sur NONE pour les types d'entités NAME, PHONE et AWS_SECRET_KEY, et faire supprimer par l'application les valeurs listées dans la trace du garde-fou.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Sensitive information filters can take a different action for prompts (inputAction) and responses (outputAction) for each PII type. ANONYMIZE replaces the detected value with its type, such as {NAME} or {PHONE}, and lets the request continue, while BLOCK rejects the whole prompt and returns the configured blocked message.
    fr: |-
      Les filtres d'informations sensibles peuvent appliquer une action différente aux invites (inputAction) et aux réponses (outputAction) pour chaque type d'informations personnelles. ANONYMIZE remplace la valeur détectée par son type, par exemple {NAME} ou {PHONE}, et laisse la requête se poursuivre, tandis que BLOCK rejette toute l'invite et renvoie le message de blocage configuré.
  options:
    b:
      en: |-
        The actions are reversed: blocking names and phone numbers rejects requests that must be processed, and masking secret keys lets those prompts through.
      fr: |-
        Les actions sont inversées : bloquer les noms et numéros de téléphone rejette des requêtes qui doivent être traitées, et masquer les clés secrètes laisse passer ces invites.
    c:
      en: |-
        Output actions apply only to model responses, so the model would still receive the names, phone numbers, and secret keys in the prompts.
      fr: |-
        Les actions de sortie ne s'appliquent qu'aux réponses du modèle : le modèle recevrait toujours les noms, numéros de téléphone et clés secrètes contenus dans les invites.
    d:
      en: |-
        NONE only detects and reports the values; the prompt reaches the model unchanged, and the trace contains the original values.
      fr: |-
        NONE ne fait que détecter et signaler les valeurs ; l'invite parvient inchangée au modèle, et la trace contient les valeurs d'origine.
references:
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
