id: scsc03-5b-config-rotation-rules
objective: "5.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany stores hundreds of secrets in AWS Secrets Manager across several accounts. Each secret has its own rotation schedule. The security team needs AWS Config to report two things: secrets that are not scheduled for rotation, and secrets whose scheduled rotation date passed without a successful rotation.

    Which AWS Config managed rules should the team deploy? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany stocke des centaines de secrets dans AWS Secrets Manager dans plusieurs comptes. Chaque secret a sa propre planification de rotation. L'équipe de sécurité a besoin qu'AWS Config signale deux choses : les secrets dont la rotation n'est pas planifiée, et les secrets dont la date de rotation planifiée est passée sans rotation réussie.

    Quelles règles gérées AWS Config l'équipe doit-elle déployer ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: secretsmanager-secret-unused }
    - { id: b, text: secretsmanager-rotation-enabled-check }
    - { id: c, text: access-keys-rotated }
    - { id: d, text: secretsmanager-scheduled-rotation-success-check }
    - { id: e, text: iam-user-unused-credentials-check }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "secretsmanager-rotation-enabled-check is NON_COMPLIANT when a secret is not scheduled for rotation. secretsmanager-scheduled-rotation-success-check is NON_COMPLIANT when the date that Secrets Manager calculated from the schedule passes and the secret is not rotated."
    fr: "secretsmanager-rotation-enabled-check est NON_COMPLIANT lorsqu'un secret n'a pas de rotation planifiée. secretsmanager-scheduled-rotation-success-check est NON_COMPLIANT lorsque la date calculée par Secrets Manager à partir de la planification est passée sans rotation du secret."
  options:
    a:
      en: "This rule reports secrets that have not been accessed for a number of days; it does not check rotation."
      fr: "Cette règle signale les secrets non consultés depuis un certain nombre de jours ; elle ne vérifie pas la rotation."
    c:
      en: "This rule checks the age of IAM user access keys, not Secrets Manager secrets."
      fr: "Cette règle vérifie l'âge des clés d'accès des utilisateurs IAM, pas des secrets Secrets Manager."
    e:
      en: "This rule checks IAM user passwords and access keys that are not used; it does not evaluate secrets."
      fr: "Cette règle vérifie les mots de passe et clés d'accès des utilisateurs IAM non utilisés ; elle n'évalue pas les secrets."
references:
  - title: secretsmanager-scheduled-rotation-success-check
    url: https://docs.aws.amazon.com/config/latest/developerguide/secretsmanager-scheduled-rotation-success-check.html
  - title: secretsmanager-rotation-enabled-check
    url: https://docs.aws.amazon.com/config/latest/developerguide/secretsmanager-rotation-enabled-check.html
