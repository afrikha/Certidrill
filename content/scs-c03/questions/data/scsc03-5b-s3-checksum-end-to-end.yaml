id: scsc03-5b-s3-checksum-end-to-end
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's genomics pipeline uploads result files of 10 MB to 4 GB to Amazon S3 with the AWS CLI. A compliance rule requires that Amazon S3 reject any upload whose data was altered in transit, by comparing a SHA-256 value calculated by the client with a value that S3 calculates before it stores the object. Downstream consumers must be able to validate the same stored value when they download the files.

    Which solution will meet these requirements?
  fr: |
    Le pipeline de génomique d'AnyCompany charge dans Amazon S3, avec l'AWS CLI, des fichiers de résultats de 10 Mo à 4 Go. Une règle de conformité exige qu'Amazon S3 rejette tout chargement dont les données ont été altérées en transit, en comparant une valeur SHA-256 calculée par le client à une valeur que S3 calcule avant de stocker l'objet. Les consommateurs en aval doivent pouvoir valider la même valeur stockée lorsqu'ils téléchargent les fichiers.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Upload each file with --checksum-algorithm SHA256, and have consumers download the files with --checksum-mode ENABLED."
        fr: "Charger chaque fichier avec --checksum-algorithm SHA256, et faire télécharger les fichiers par les consommateurs avec --checksum-mode ENABLED."
    - id: b
      text:
        en: "Upload each file normally, and have consumers compare the object's ETag with an MD5 hash that they calculate after download."
        fr: "Charger chaque fichier normalement, et faire comparer par les consommateurs l'ETag de l'objet avec un hachage MD5 qu'ils calculent après le téléchargement."
    - id: c
      text:
        en: "Enable default encryption with SSE-KMS on the bucket, and have consumers rely on the KMS Decrypt operation to detect altered objects."
        fr: "Activer le chiffrement par défaut SSE-KMS sur le compartiment (bucket), et faire confiance à l'opération KMS Decrypt pour que les consommateurs détectent les objets altérés."
    - id: d
      text:
        en: "Store a SHA-256 hash of each file as a user-defined metadata value, and run a weekly S3 Batch Operations job that copies the objects to verify them."
        fr: "Stocker un hachage SHA-256 de chaque fichier dans une métadonnée définie par l'utilisateur, et exécuter chaque semaine une tâche S3 Batch Operations qui copie les objets pour les vérifier."
answer: { optionId: a }
explanation:
  correct:
    en: "When the client sends a checksum with the upload, Amazon S3 calculates its own checksum on the server side and validates it against the provided value before it stores the object and the checksum. With checksum mode enabled on download, the stored checksum is returned so that the client can validate the data it receives."
    fr: "Lorsque le client envoie une somme de contrôle avec le chargement, Amazon S3 calcule sa propre somme de contrôle côté serveur et la compare à la valeur fournie avant de stocker l'objet et la somme de contrôle. Avec le mode de somme de contrôle activé au téléchargement, la somme stockée est renvoyée afin que le client puisse valider les données reçues."
  options:
    b:
      en: "This check happens only after download, uses MD5 instead of SHA-256, and the ETag is not an MD5 of the data for multipart uploads, which the CLI uses for large files."
      fr: "Ce contrôle n'a lieu qu'après le téléchargement, utilise MD5 au lieu de SHA-256, et l'ETag n'est pas un MD5 des données pour les chargements partitionnés, que la CLI utilise pour les gros fichiers."
    c:
      en: "Encryption at rest protects confidentiality; it does not make S3 compare a client-calculated SHA-256 value before storing the object."
      fr: "Le chiffrement au repos protège la confidentialité ; il n'oblige pas S3 à comparer une valeur SHA-256 calculée par le client avant de stocker l'objet."
    d:
      en: "Amazon S3 does not validate user-defined metadata, so an altered upload is stored, and a weekly job does not reject it at upload time."
      fr: "Amazon S3 ne valide pas les métadonnées définies par l'utilisateur : un chargement altéré est stocké, et une tâche hebdomadaire ne le rejette pas au moment du chargement."
references:
  - title: Checking object integrity in Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html
