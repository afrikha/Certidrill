id: scsc03-5c-mrk-imported-rotation-order
objective: "5.3.5"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses a symmetric multi-Region customer managed key with imported key material for client-side encryption. The primary key is in eu-west-1, and a replica key is in eu-central-1. Once a year, the security team must rotate the key so that new data in both Regions is encrypted with new key material, while existing ciphertext remains decryptable in both Regions. For each import, the team has already downloaded a wrapping public key and an import token for the key that receives the material.

    Which four actions should the security team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany utilise une clé multi-Région symétrique gérée par le client, avec des éléments de clé importés, pour le chiffrement côté client. La clé principale se trouve dans eu-west-1 et une clé de réplica dans eu-central-1. Une fois par an, l'équipe de sécurité doit effectuer une rotation de la clé afin que les nouvelles données des deux Régions soient chiffrées avec de nouveaux éléments de clé, tandis que le texte chiffré existant reste déchiffrable dans les deux Régions. Pour chaque importation, l'équipe a déjà téléchargé une clé publique d'encapsulation et un jeton d'importation pour la clé qui reçoit les éléments.

    Quelles sont les quatre actions que l'équipe de sécurité doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: repl
      text: { en: "Import the same key material into the replica key with the EXISTING_KEY_MATERIAL import type.", fr: "Importer les mêmes éléments de clé dans la clé de réplica avec le type d'importation EXISTING_KEY_MATERIAL." }
    - id: autorot
      text: { en: "Enable automatic key rotation on the primary key with a rotation period of 365 days.", fr: "Activer la rotation automatique de la clé principale avec une période de rotation de 365 jours." }
    - id: gen
      text: { en: "Generate new key material in the company's key management infrastructure.", fr: "Générer de nouveaux éléments de clé dans l'infrastructure de gestion des clés de l'entreprise." }
    - id: rotrepl
      text: { en: "Call RotateKeyOnDemand on the replica key.", fr: "Appeler RotateKeyOnDemand sur la clé de réplica." }
    - id: prim
      text: { en: "Import the new key material into the primary key with the NEW_KEY_MATERIAL import type.", fr: "Importer les nouveaux éléments de clé dans la clé principale avec le type d'importation NEW_KEY_MATERIAL." }
    - id: delold
      text: { en: "Delete the current key material from the replica key with DeleteImportedKeyMaterial.", fr: "Supprimer les éléments de clé actuels de la clé de réplica avec DeleteImportedKeyMaterial." }
    - id: rotprim
      text: { en: "Call RotateKeyOnDemand on the primary key.", fr: "Appeler RotateKeyOnDemand sur la clé principale." }
answer:
  sequence: [ gen, prim, repl, rotprim ]
explanation:
  correct:
    en: |-
      New key material for a multi-Region key must first be imported into the primary key with the NEW_KEY_MATERIAL import type; it cannot be imported directly into a replica. The same material is then imported into each replica with EXISTING_KEY_MATERIAL; once it is in every key, the new key material moves from PENDING_MULTI_REGION_IMPORT_AND_ROTATION to PENDING_ROTATION. Only then is on-demand rotation started, on the primary key, and the previous material stays associated with the keys for decryption.
    fr: |-
      De nouveaux éléments de clé pour une clé multi-Région doivent d'abord être importés dans la clé principale avec le type d'importation NEW_KEY_MATERIAL ; ils ne peuvent pas être importés directement dans un réplica. Les mêmes éléments sont ensuite importés dans chaque réplica avec EXISTING_KEY_MATERIAL ; une fois présents dans toutes les clés, les nouveaux éléments de clé passent de l'état PENDING_MULTI_REGION_IMPORT_AND_ROTATION à PENDING_ROTATION. C'est seulement alors que la rotation à la demande est lancée, sur la clé principale, et les éléments précédents restent associés aux clés pour le déchiffrement.
  options:
    autorot:
      en: "Automatic rotation is supported only for keys whose key material AWS KMS generates, not for imported key material."
      fr: "La rotation automatique n'est prise en charge que pour les clés dont AWS KMS génère les éléments, pas pour les éléments de clé importés."
    rotrepl:
      en: "Rotation of a set of multi-Region keys is initiated only on the primary key."
      fr: "La rotation d'un ensemble de clés multi-Régions n'est lancée que sur la clé principale."
    delold:
      en: "Deleting permanently associated key material makes the replica key unusable (PendingImport), so existing ciphertext could not be decrypted in eu-central-1."
      fr: "Supprimer des éléments de clé associés de façon permanente rend la clé de réplica inutilisable (PendingImport) : le texte chiffré existant ne pourrait plus être déchiffré dans eu-central-1."
references:
  - title: ImportKeyMaterial - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_ImportKeyMaterial.html
  - title: "Step 4: Import the key material - AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-import-key-material.html
  - title: RotateKeyOnDemand - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_RotateKeyOnDemand.html
