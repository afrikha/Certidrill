id: scsc03-5b-ebs-snapshot-lock-cooling
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany takes a weekly Amazon EBS snapshot of the volume that holds its general ledger database. Each snapshot must be stored in a WORM format for 90 days. After a short review period of 24 hours, during which an operator can still correct a wrong lock duration, no user, regardless of IAM permissions, can be able to delete the snapshot, unlock it or shorten the lock.

    Which solution will meet these requirements?
  fr: |
    AnyCompany prend chaque semaine un instantané Amazon EBS du volume qui héberge sa base de données de grand livre. Chaque instantané doit être stocké au format WORM pendant 90 jours. Après une courte période de vérification de 24 heures, pendant laquelle un opérateur peut encore corriger une mauvaise durée de verrouillage, aucun utilisateur, quelles que soient ses autorisations IAM, ne doit pouvoir supprimer l'instantané, le déverrouiller ni raccourcir le verrou.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Lock each snapshot in governance mode for 90 days, and allow only the security team to unlock snapshots."
        fr: "Verrouiller chaque instantané en mode gouvernance (governance) pendant 90 jours, et autoriser uniquement l'équipe de sécurité à déverrouiller les instantanés."
    - id: b
      text:
        en: "Create a Recycle Bin retention rule for EBS snapshots with a retention period of 90 days, and lock the retention rule."
        fr: "Créer une règle de conservation Corbeille (Recycle Bin) pour les instantanés EBS avec une période de conservation de 90 jours, et verrouiller la règle de conservation."
    - id: c
      text:
        en: "Lock each snapshot in compliance mode for 90 days with a cooling-off period of 24 hours."
        fr: "Verrouiller chaque instantané en mode conformité (compliance) pendant 90 jours avec une période de réflexion (cooling-off) de 24 heures."
    - id: d
      text:
        en: "Create an Amazon Data Lifecycle Manager policy that keeps each snapshot for 90 days, and deny ec2:DeleteSnapshot in an SCP."
        fr: "Créer une politique Amazon Data Lifecycle Manager qui conserve chaque instantané 90 jours, et refuser ec2:DeleteSnapshot dans une SCP."
answer: { optionId: c }
explanation:
  correct:
    en: "In compliance mode, an optional cooling-off period of 1 to 72 hours lets authorized users still unlock the snapshot or change the lock. After it ends, nobody can unlock the snapshot, change the mode or decrease the duration; the duration can only be increased, and the snapshot cannot be deleted until the lock expires."
    fr: "En mode conformité, une période de réflexion facultative de 1 à 72 heures permet encore aux utilisateurs autorisés de déverrouiller l'instantané ou de modifier le verrou. Ensuite, personne ne peut déverrouiller l'instantané, changer le mode ni réduire la durée ; la durée peut seulement être augmentée, et l'instantané ne peut pas être supprimé avant l'expiration du verrou."
  options:
    a:
      en: "In governance mode, users with the appropriate IAM permissions can unlock the snapshot or shorten the lock at any time."
      fr: "En mode gouvernance, les utilisateurs disposant des autorisations IAM appropriées peuvent déverrouiller l'instantané ou raccourcir le verrou à tout moment."
    b:
      en: "Recycle Bin keeps snapshots after they are deleted so that they can be restored; it does not store them in a WORM format, and a deleted snapshot is permanently removed when its retention ends."
      fr: "La Corbeille conserve les instantanés après leur suppression pour permettre leur restauration ; elle ne les stocke pas au format WORM, et un instantané supprimé est définitivement effacé à la fin de sa conservation."
    d:
      en: "An SCP can be detached by the management account and does not apply to the management account, so the snapshots are not protected regardless of permissions."
      fr: "Une SCP peut être dissociée par le compte de gestion et ne s'applique pas au compte de gestion : les instantanés ne sont pas protégés quelles que soient les autorisations."
references:
  - title: Amazon EBS snapshot lock concepts
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-lock-concepts.html
