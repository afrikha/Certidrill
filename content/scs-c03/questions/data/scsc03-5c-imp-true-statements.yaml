id: scsc03-5c-imp-true-statements
objective: "5.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is deciding whether a new symmetric customer managed KMS key should use imported key material or key material generated by AWS KMS. The security team reviews a list of statements about keys with imported key material.

    Which two statements are true? (Choose two.)
  fr: |
    AnyCompany doit décider si une nouvelle clé KMS symétrique gérée par le client utilisera des éléments de clé importés ou des éléments de clé générés par AWS KMS. L'équipe de sécurité examine une liste d'affirmations sur les clés avec des éléments de clé importés.

    Quelles sont les deux affirmations vraies ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          AWS KMS cannot recover imported key material after it expires or is deleted, so the company must keep its own copy to restore the key.
        fr: |-
          AWS KMS ne peut pas récupérer des éléments de clé importés après leur expiration ou leur suppression : l'entreprise doit conserver sa propre copie pour restaurer la clé.
    - id: b
      text:
        en: |-
          The company can decrypt AWS KMS ciphertext outside AWS by using its own copy of the imported key material.
        fr: |-
          L'entreprise peut déchiffrer hors d'AWS du texte chiffré par AWS KMS en utilisant sa propre copie des éléments de clé importés.
    - id: c
      text:
        en: |-
          The company can import its own key material into an existing KMS key that was created with key material generated by AWS KMS.
        fr: |-
          L'entreprise peut importer ses propres éléments de clé dans une clé KMS existante qui a été créée avec des éléments de clé générés par AWS KMS.
    - id: d
      text:
        en: |-
          To use imported key material, the company must create the KMS key without key material, with EXTERNAL origin, and then import the material.
        fr: |-
          Pour utiliser des éléments de clé importés, l'entreprise doit créer la clé KMS sans éléments de clé, avec l'origine EXTERNAL, puis importer les éléments.
    - id: e
      text:
        en: |-
          The company can create the key in an AWS CloudHSM key store and import its material there to keep it in single-tenant HSMs.
        fr: |-
          L'entreprise peut créer la clé dans un magasin de clés AWS CloudHSM et y importer ses éléments pour les conserver dans des HSM à locataire unique.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      AWS KMS cannot restore, recover, or reproduce deleted or expired imported material; without the company's copy, the key stays unusable and the data is unrecoverable. Import works only into a KMS key created without key material, whose origin is EXTERNAL; the origin is fixed when the key is created.
    fr: |-
      AWS KMS ne peut ni restaurer, ni récupérer, ni reproduire des éléments importés supprimés ou expirés ; sans la copie de l'entreprise, la clé reste inutilisable et les données sont irrécupérables. L'importation ne fonctionne que dans une clé KMS créée sans éléments de clé, dont l'origine est EXTERNAL ; l'origine est fixée à la création de la clé.
  options:
    b:
      en: |-
        AWS KMS does not support decrypting its ciphertext outside AWS KMS, even when the key uses imported material; the ciphertext format is not published.
      fr: |-
        AWS KMS ne prend pas en charge le déchiffrement de son texte chiffré hors d'AWS KMS, même quand la clé utilise des éléments importés ; le format du texte chiffré n'est pas publié.
    c:
      en: |-
        Key material can be imported only into keys with EXTERNAL origin; a key with AWS_KMS origin cannot receive imported material.
      fr: |-
        Des éléments de clé ne peuvent être importés que dans des clés d'origine EXTERNAL ; une clé d'origine AWS_KMS ne peut pas recevoir d'éléments importés.
    e:
      en: |-
        Key material cannot be imported into KMS keys in custom key stores, including AWS CloudHSM key stores.
      fr: |-
        Des éléments de clé ne peuvent pas être importés dans des clés KMS de magasins de clés personnalisés, y compris les magasins de clés AWS CloudHSM.
references:
  - title: Importing key material for AWS KMS keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys.html
  - title: "Step 4: Import the key material - AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-import-key-material.html
