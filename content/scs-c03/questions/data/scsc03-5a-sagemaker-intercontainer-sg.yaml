id: scsc03-5a-sagemaker-intercontainer-sg
objective: "5.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany trains a deep learning model on medical images with an Amazon SageMaker AI training job that runs on four ml.p4d.24xlarge instances in private subnets of a VPC. The security group of the training job allows inbound TCP traffic from itself and all outbound traffic. A new healthcare policy requires that all communication between the training instances be encrypted.

    Which combination of actions will meet this requirement? (Choose two.)
  fr: |
    AnyCompany entraîne un modèle d'apprentissage profond sur des images médicales avec une tâche d'entraînement Amazon SageMaker AI qui s'exécute sur quatre instances ml.p4d.24xlarge dans des sous-réseaux privés d'un VPC. Le groupe de sécurité de la tâche d'entraînement autorise le trafic TCP entrant depuis lui-même et tout le trafic sortant. Une nouvelle politique de santé exige que toutes les communications entre les instances d'entraînement soient chiffrées.

    Quelle combinaison d'actions répond à cette exigence ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Set EnableNetworkIsolation to true in the CreateTrainingJob request."
        fr: "Définir EnableNetworkIsolation sur true dans la requête CreateTrainingJob."
    - id: b
      text:
        en: "Specify a customer managed KMS key as the VolumeKmsKeyId of the training job."
        fr: "Spécifier une clé KMS gérée par le client comme VolumeKmsKeyId de la tâche d'entraînement."
    - id: c
      text:
        en: "Set EnableInterContainerTrafficEncryption to true in the CreateTrainingJob request."
        fr: "Définir EnableInterContainerTrafficEncryption sur true dans la requête CreateTrainingJob."
    - id: d
      text:
        en: "Add an interface VPC endpoint for the SageMaker API so that the training traffic stays in the VPC."
        fr: "Ajouter un point de terminaison de VPC d'interface pour l'API SageMaker afin que le trafic d'entraînement reste dans le VPC."
    - id: e
      text:
        en: "Add inbound rules to the security group for UDP port 500 and IP protocol 50 (ESP), with the security group itself as the source."
        fr: "Ajouter au groupe de sécurité des règles entrantes pour le port UDP 500 et le protocole IP 50 (ESP), avec le groupe de sécurité lui-même comme source."
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "EnableInterContainerTrafficEncryption encrypts the communication between the ML compute instances of a distributed training job; it has no effect on single-instance jobs and can increase training time and cost. The job must run in a private VPC whose security group allows UDP 500 and ESP (protocol 50) from itself."
    fr: "EnableInterContainerTrafficEncryption chiffre les communications entre les instances de calcul ML d'une tâche d'entraînement distribuée ; il est sans effet sur les tâches à une instance et peut augmenter la durée et le coût de l'entraînement. La tâche doit s'exécuter dans un VPC privé dont le groupe de sécurité autorise UDP 500 et ESP (protocole 50) depuis lui-même."
  options:
    a:
      en: "Network isolation blocks outbound network calls from the training containers; it does not encrypt the traffic between instances."
      fr: "L'isolement réseau bloque les appels réseau sortants des conteneurs d'entraînement : il ne chiffre pas le trafic entre instances."
    b:
      en: "VolumeKmsKeyId encrypts the storage volumes attached to the training instances, which is encryption at rest."
      fr: "VolumeKmsKeyId chiffre les volumes de stockage attachés aux instances d'entraînement, ce qui relève du chiffrement au repos."
    d:
      en: "An interface endpoint keeps API calls to SageMaker private, but the traffic between the training instances is not affected."
      fr: "Un point de terminaison d'interface garde privés les appels d'API vers SageMaker, mais le trafic entre les instances d'entraînement n'est pas concerné."
references:
  - title: Protect Communications Between ML Compute Instances in a Distributed Training Job - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/train-encrypt.html
