id: scsc03-5b-cloudtrail-log-validation
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has an organization trail in AWS CloudTrail that delivers log files to an Amazon S3 bucket in a log archive account. External auditors require evidence that shows, for any period, whether a delivered log file was modified or deleted after CloudTrail delivered it.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'un journal de suivi d'organisation (organization trail) AWS CloudTrail qui remet les fichiers journaux dans un compartiment (bucket) Amazon S3 d'un compte d'archivage des journaux. Des auditeurs externes exigent une preuve qui montre, pour toute période, si un fichier journal remis a été modifié ou supprimé après sa remise par CloudTrail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable SSE-KMS encryption on the trail with a customer managed key, and give the auditors kms:Decrypt on the key."
        fr: "Activer le chiffrement SSE-KMS sur le journal de suivi avec une clé gérée par le client, et accorder aux auditeurs kms:Decrypt sur la clé."
    - id: b
      text:
        en: "Enable S3 Versioning on the log bucket, and give the auditors an S3 Inventory report of all object versions."
        fr: "Activer la gestion des versions S3 sur le compartiment des journaux, et fournir aux auditeurs un rapport S3 Inventory de toutes les versions d'objet."
    - id: c
      text:
        en: "Enable log file integrity validation on the trail, and run the aws cloudtrail validate-logs command for the requested period."
        fr: "Activer la validation de l'intégrité des fichiers journaux sur le journal de suivi, et exécuter la commande aws cloudtrail validate-logs pour la période demandée."
    - id: d
      text:
        en: "Enable the AWS Config managed rule cloudtrail-enabled in every account, and export its compliance history for the requested period."
        fr: "Activer la règle gérée AWS Config cloudtrail-enabled dans chaque compte, et exporter son historique de conformité pour la période demandée."
answer: { optionId: c }
explanation:
  correct:
    en: "With log file integrity validation, CloudTrail hashes every log file with SHA-256 and delivers an hourly digest file signed with SHA-256 with RSA. Validating the digest chain shows whether each log file was modified, deleted or unchanged after delivery."
    fr: "Avec la validation de l'intégrité des fichiers journaux, CloudTrail calcule un hachage SHA-256 de chaque fichier journal et remet chaque heure un fichier de synthèse (digest) signé en SHA-256 avec RSA. La validation de la chaîne de fichiers de synthèse montre si chaque fichier journal a été modifié, supprimé ou laissé intact après sa remise."
  options:
    a:
      en: "Encryption protects confidentiality; it does not prove that a log file was not deleted or replaced by a newly encrypted file."
      fr: "Le chiffrement protège la confidentialité ; il ne prouve pas qu'un fichier journal n'a pas été supprimé ni remplacé par un nouveau fichier chiffré."
    b:
      en: "Versioning keeps previous versions but gives no cryptographic proof, and a principal with delete permissions can remove versions without leaving evidence in the inventory."
      fr: "La gestion des versions conserve les versions précédentes mais ne fournit aucune preuve cryptographique, et un principal disposant d'autorisations de suppression peut supprimer des versions sans laisser de trace dans l'inventaire."
    d:
      en: "This rule only checks that a trail exists and is logging; it says nothing about the integrity of the delivered files."
      fr: "Cette règle vérifie seulement qu'un journal de suivi existe et enregistre ; elle n'indique rien sur l'intégrité des fichiers remis."
references:
  - title: Validating CloudTrail log file integrity
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
