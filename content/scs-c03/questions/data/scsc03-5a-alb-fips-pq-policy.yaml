id: scsc03-5a-alb-fips-pq-policy
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's payment API runs behind an Application Load Balancer. The HTTPS listener was created with AWS CloudFormation, and the listener resource does not set the SslPolicy property. A new standard requires that the listener use FIPS-validated cryptographic modules, offer hybrid post-quantum key exchange to clients that negotiate TLS 1.3, keep accepting partners whose clients support only TLS 1.2, and reject TLS 1.1 and earlier.

    Which security policy should the company set on the listener?
  fr: |
    L'API de paiement d'AnyCompany s'exécute derrière un Application Load Balancer. L'écouteur HTTPS a été créé avec AWS CloudFormation, et la ressource de l'écouteur ne définit pas la propriété SslPolicy. Une nouvelle norme exige que l'écouteur utilise des modules cryptographiques validés FIPS, propose un échange de clés hybride post-quantique aux clients qui négocient TLS 1.3, continue d'accepter les partenaires dont les clients ne prennent en charge que TLS 1.2, et rejette TLS 1.1 et les versions antérieures.

    Quelle politique de sécurité l'entreprise doit-elle définir sur l'écouteur ?
body:
  options:
    - { id: a, text: "ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09" }
    - { id: b, text: "ELBSecurityPolicy-TLS13-1-3-FIPS-PQ-2025-09" }
    - { id: c, text: "ELBSecurityPolicy-TLS13-1-2-Res-FIPS-PQ-2025-09" }
    - { id: d, text: "ELBSecurityPolicy-TLS13-1-2-Res-FIPS-2023-04" }
answer: { optionId: c }
explanation:
  correct:
    en: "Without SslPolicy, a listener created with CloudFormation or the CLI gets ELBSecurityPolicy-2016-08, which still accepts TLS 1.0. ELBSecurityPolicy-TLS13-1-2-Res-FIPS-PQ-2025-09 uses FIPS modules, negotiates TLS 1.3 and TLS 1.2 only, and offers hybrid ML-KEM key exchange to TLS 1.3 clients; TLS 1.2 clients fall back to a classical key exchange. AWS recommends this policy when FIPS is required."
    fr: "Sans SslPolicy, un écouteur créé avec CloudFormation ou la CLI reçoit ELBSecurityPolicy-2016-08, qui accepte encore TLS 1.0. ELBSecurityPolicy-TLS13-1-2-Res-FIPS-PQ-2025-09 utilise des modules FIPS, ne négocie que TLS 1.3 et TLS 1.2, et propose l'échange de clés hybride ML-KEM aux clients TLS 1.3 ; les clients TLS 1.2 utilisent un échange de clés classique. AWS recommande cette politique lorsque FIPS est exigé."
  options:
    a:
      en: "This policy offers post-quantum key exchange and TLS 1.2 or later, but it is not a FIPS policy."
      fr: "Cette politique propose l'échange de clés post-quantique et TLS 1.2 ou plus, mais ce n'est pas une politique FIPS."
    b:
      en: "This FIPS policy accepts TLS 1.3 only, so the partners whose clients support only TLS 1.2 could no longer connect."
      fr: "Cette politique FIPS n'accepte que TLS 1.3 : les partenaires dont les clients ne prennent en charge que TLS 1.2 ne pourraient plus se connecter."
    d:
      en: "This FIPS policy accepts TLS 1.2 and TLS 1.3, but it does not offer the hybrid post-quantum key exchange of the PQ policies."
      fr: "Cette politique FIPS accepte TLS 1.2 et TLS 1.3, mais elle ne propose pas l'échange de clés hybride post-quantique des politiques PQ."
references:
  - title: Security policies for your Application Load Balancer - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
