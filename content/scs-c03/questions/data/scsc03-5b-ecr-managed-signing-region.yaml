id: scsc03-5b-ecr-managed-signing-region
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany pushes container images to Amazon ECR registries in us-east-1 and eu-west-1 from several CI systems. The security team requires that every image pushed to repositories whose names start with prod- be signed with AWS Signer at push time, without installing or configuring signing tools in the CI systems. The signing profiles are owned by a central security account. Clusters will verify the signatures with Notation.

    Which solution will meet these requirements?
  fr: |
    AnyCompany pousse des images de conteneur vers des registres Amazon ECR dans us-east-1 et eu-west-1 depuis plusieurs systèmes de CI. L'équipe de sécurité exige que chaque image poussée vers les référentiels dont le nom commence par prod- soit signée avec AWS Signer au moment du push, sans installer ni configurer d'outils de signature dans les systèmes de CI. Les profils de signature appartiennent à un compte de sécurité central. Les clusters vérifieront les signatures avec Notation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "In the security account, create one Signer signing profile in us-east-1. Configure ECR managed signing in both Regions with a rule that references this profile and a prod* repository filter."
        fr: "Dans le compte de sécurité, créer un seul profil de signature Signer dans us-east-1. Configurer la signature gérée ECR dans les deux Régions avec une règle qui référence ce profil et un filtre de référentiel prod*."
    - id: b
      text:
        en: "Turn on tag immutability for the prod- repositories, and configure ECR enhanced scanning with continuous scanning for the same repositories."
        fr: "Activer l'immuabilité des balises pour les référentiels prod-, et configurer l'analyse améliorée ECR avec l'analyse continue pour les mêmes référentiels."
    - id: c
      text:
        en: "In the security account, create one Signer signing profile in each Region. Configure ECR managed signing in each Region with a rule that references that Region's profile and a prod* repository filter."
        fr: "Dans le compte de sécurité, créer un profil de signature Signer dans chaque Région. Configurer la signature gérée ECR dans chaque Région avec une règle qui référence le profil de cette Région et un filtre de référentiel prod*."
    - id: d
      text:
        en: "Create a Signer signing profile in each Region, and add a pipeline step in each CI system that runs the Notation CLI with the AWS Signer plugin after each push."
        fr: "Créer un profil de signature Signer dans chaque Région, et ajouter dans chaque système de CI une étape de pipeline qui exécute la CLI Notation avec le plugin AWS Signer après chaque push."
answer: { optionId: c }
explanation:
  correct:
    en: "ECR managed signing signs images with AWS Signer when they are pushed, so no client-side tools are needed, and a signing rule pairs a signing profile with repository filters. Signing profiles can be in a different account, but cross-Region signing is not supported, so each Region needs a profile in that Region."
    fr: "La signature gérée ECR signe les images avec AWS Signer au moment du push : aucun outil côté client n'est nécessaire, et une règle de signature associe un profil de signature à des filtres de référentiel. Les profils de signature peuvent se trouver dans un autre compte, mais la signature inter-Régions n'est pas prise en charge : chaque Région a besoin d'un profil dans cette Région."
  options:
    a:
      en: "The eu-west-1 registry cannot use a signing profile in us-east-1, because signing profiles must be in the same Region as the ECR registry."
      fr: "Le registre d'eu-west-1 ne peut pas utiliser un profil de signature situé dans us-east-1, car les profils de signature doivent se trouver dans la même Région que le registre ECR."
    b:
      en: "Tag immutability prevents tags from being overwritten and scanning finds vulnerabilities; neither produces a signature that Notation can verify."
      fr: "L'immuabilité des balises empêche l'écrasement des balises et l'analyse détecte des vulnérabilités ; aucune ne produit de signature vérifiable par Notation."
    d:
      en: "This signs the images but requires installing and configuring signing tools in every CI system, which the requirement forbids."
      fr: "Cette solution signe les images mais exige d'installer et de configurer des outils de signature dans chaque système de CI, ce que l'exigence interdit."
references:
  - title: Managed signing
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/managed-signing.html
