id: scsc03-5a-private-access-match
objective: "5.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is choosing mechanisms for secure and private access to its resources in one AWS Region.

    Match each requirement with the mechanism that meets it. Each mechanism can be used once or not at all.
  fr: |
    AnyCompany choisit des mécanismes d'accès sécurisé et privé à ses ressources dans une Région AWS.

    Associez chaque exigence au mécanisme qui y répond. Chaque mécanisme peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: gw, text: { en: "Gateway VPC endpoint for Amazon S3", fr: "Point de terminaison de VPC de passerelle pour Amazon S3" } }
    - { id: ife, text: { en: "Interface VPC endpoint", fr: "Point de terminaison de VPC d'interface" } }
    - { id: eps, text: { en: "VPC endpoint service (AWS PrivateLink)", fr: "Service de point de terminaison de VPC (AWS PrivateLink)" } }
    - { id: cvpn, text: "AWS Client VPN" }
    - { id: va, text: "AWS Verified Access" }
    - { id: peer, text: { en: "VPC peering connection", fr: "Connexion d'appairage de VPC (VPC peering)" } }
  targets:
    - id: t1
      text: { en: "Instances in a VPC reach Amazon S3 buckets in the same Region privately, with no hourly endpoint charge.", fr: "Des instances d'un VPC accèdent en privé à des compartiments Amazon S3 de la même Région, sans frais horaires de point de terminaison." }
    - id: t2
      text: { en: "Remote employees' laptops get network-level access to several VPC subnets through an OpenVPN-based client.", fr: "Les ordinateurs portables des employés à distance obtiennent un accès réseau à plusieurs sous-réseaux de VPC par un client basé sur OpenVPN." }
    - id: t3
      text: { en: "Contractors reach an internal web application without a VPN, with each request evaluated against identity and device posture.", fr: "Des sous-traitants accèdent à une application web interne sans VPN, chaque requête étant évaluée selon l'identité et la posture de l'appareil." }
    - id: t4
      text: { en: "Customers in other accounts, with overlapping CIDR ranges, privately reach a service behind a Network Load Balancer.", fr: "Des clients d'autres comptes, aux plages CIDR qui se chevauchent, accèdent en privé à un service derrière un Network Load Balancer." }
    - id: t5
      text: { en: "Workloads in a VPC call the AWS KMS API through private IP addresses in their own subnets.", fr: "Des charges de travail d'un VPC appellent l'API AWS KMS par des adresses IP privées de leurs propres sous-réseaux." }
answer:
  mapping: { t1: gw, t2: cvpn, t3: va, t4: eps, t5: ife }
explanation:
  correct:
    en: "A gateway endpoint adds a route to Amazon S3 in the VPC route tables at no additional cost. Client VPN is a managed OpenVPN-based service for remote network access. Verified Access evaluates each application request against trust provider data without a VPN. An endpoint service exposes an NLB service through PrivateLink, which works with overlapping CIDR ranges. An interface endpoint places network interfaces with private IP addresses in the VPC for AWS APIs such as KMS."
    fr: "Un point de terminaison de passerelle ajoute un itinéraire vers Amazon S3 dans les tables de routage du VPC sans coût supplémentaire. Client VPN est un service géré basé sur OpenVPN pour l'accès réseau à distance. Verified Access évalue chaque requête d'application selon les données des fournisseurs de confiance, sans VPN. Un service de point de terminaison expose un service de NLB par PrivateLink, ce qui fonctionne avec des plages CIDR qui se chevauchent. Un point de terminaison d'interface place dans le VPC des interfaces réseau avec des adresses IP privées pour des API AWS comme KMS."
  options:
    peer:
      en: "VPC peering does not support overlapping CIDR ranges and gives routing between whole VPCs rather than access to one service."
      fr: "L'appairage de VPC ne prend pas en charge les plages CIDR qui se chevauchent et donne un routage entre VPC entiers plutôt qu'un accès à un service."
references:
  - title: Gateway endpoints for Amazon S3 - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html
  - title: Configure an endpoint service - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/configure-endpoint-service.html
