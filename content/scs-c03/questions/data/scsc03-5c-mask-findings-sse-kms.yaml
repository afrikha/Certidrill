id: scsc03-5c-mask-findings-sse-kms
objective: "5.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's CloudWatch Logs data protection policy for the log group /payments/api sends audit findings to an S3 bucket in the same account. A new standard required SSE-KMS for the bucket, so an engineer changed the bucket's default encryption to SSE-KMS with the AWS managed key aws/s3. Since the change, the security team can no longer read the findings reports that are delivered to the bucket. The findings must be encrypted with AWS KMS and readable by the security team, and only log deliveries from this account may use the key.

    Which solution will meet these requirements?
  fr: |
    La politique de protection des données CloudWatch Logs d'AnyCompany pour le groupe de journaux /payments/api envoie les résultats d'audit à un compartiment S3 du même compte. Une nouvelle norme exigeait SSE-KMS pour le compartiment : un ingénieur a donc changé le chiffrement par défaut du compartiment en SSE-KMS avec la clé gérée par AWS aws/s3. Depuis ce changement, l'équipe de sécurité ne peut plus lire les rapports de résultats livrés dans le compartiment. Les résultats doivent être chiffrés avec AWS KMS et lisibles par l'équipe de sécurité, et seules les livraisons de journaux de ce compte peuvent utiliser la clé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Use a customer managed key for the bucket's default encryption, and add a key policy statement that allows the delivery.logs.amazonaws.com service principal to use the key, with aws:SourceAccount and aws:SourceArn conditions.
        fr: |-
          Utiliser une clé gérée par le client pour le chiffrement par défaut du compartiment, et ajouter une instruction de politique de clé qui autorise le principal de service delivery.logs.amazonaws.com à utiliser la clé, avec des conditions aws:SourceAccount et aws:SourceArn.
    - id: b
      text:
        en: |-
          Use a customer managed key for the bucket's default encryption, and add a bucket policy statement that allows the delivery.logs.amazonaws.com service principal to call kms:GenerateDataKey on the key.
        fr: |-
          Utiliser une clé gérée par le client pour le chiffrement par défaut du compartiment, et ajouter une instruction de politique de compartiment qui autorise le principal de service delivery.logs.amazonaws.com à appeler kms:GenerateDataKey sur la clé.
    - id: c
      text:
        en: |-
          Keep the AWS managed key aws/s3, and add a bucket policy statement that allows delivery.logs.amazonaws.com to call s3:PutObject with the bucket-owner-full-control ACL condition.
        fr: |-
          Conserver la clé gérée par AWS aws/s3, et ajouter une instruction de politique de compartiment qui autorise delivery.logs.amazonaws.com à appeler s3:PutObject avec la condition d'ACL bucket-owner-full-control.
    - id: d
      text:
        en: |-
          Use a customer managed key for the bucket's default encryption, and attach an IAM policy that allows kms:GenerateDataKey on the key to the role that created the data protection policy.
        fr: |-
          Utiliser une clé gérée par le client pour le chiffrement par défaut du compartiment, et attacher une politique IAM qui autorise kms:GenerateDataKey sur la clé au rôle qui a créé la politique de protection des données.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Logs delivered to an SSE-KMS bucket require a customer managed key: with an AWS managed key, the logs are delivered in an unreadable format. The key policy, not the bucket policy, must allow the log delivery service principal delivery.logs.amazonaws.com to use the key, and the aws:SourceAccount and aws:SourceArn conditions limit that use to deliveries from the company's account.
    fr: |-
      Des journaux livrés dans un compartiment SSE-KMS exigent une clé gérée par le client : avec une clé gérée par AWS, les journaux sont livrés dans un format illisible. C'est la politique de clé, et non la politique de compartiment, qui doit autoriser le principal de service de livraison des journaux delivery.logs.amazonaws.com à utiliser la clé, et les conditions aws:SourceAccount et aws:SourceArn limitent cette utilisation aux livraisons provenant du compte de l'entreprise.
  options:
    b:
      en: |-
        Permission to use the key for log delivery must be in the key policy of the customer managed key; KMS actions in a bucket policy do not authorize the use of a KMS key.
      fr: |-
        L'autorisation d'utiliser la clé pour la livraison des journaux doit figurer dans la politique de la clé gérée par le client ; des actions KMS dans une politique de compartiment n'autorisent pas l'utilisation d'une clé KMS.
    c:
      en: |-
        AWS managed keys are not supported for this delivery: the findings would still be written in an unreadable format, whatever the bucket policy allows.
      fr: |-
        Les clés gérées par AWS ne sont pas prises en charge pour cette livraison : les résultats seraient toujours écrits dans un format illisible, quelle que soit l'autorisation de la politique de compartiment.
    d:
      en: |-
        Findings are written by the log delivery service, not by the role that created the policy, so an IAM policy on that role does not let the delivery use the key.
      fr: |-
        Les résultats sont écrits par le service de livraison des journaux, et non par le rôle qui a créé la politique : une politique IAM sur ce rôle ne permet pas à la livraison d'utiliser la clé.
