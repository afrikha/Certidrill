id: scsc03-5b-lifecycle-actions-match
objective: "5.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is writing an S3 Lifecycle configuration for a versioning-enabled bucket that stores customer uploads. Each rule uses a prefix filter and no tag filter. The data retention policy contains four requirements.

    Match each requirement with the Lifecycle action that implements it. Each action can be used once or not at all.
  fr: |
    AnyCompany rédige une configuration S3 Lifecycle pour un compartiment (bucket) où la gestion des versions est activée et qui stocke les chargements des clients. Chaque règle utilise un filtre de préfixe et aucun filtre de balise. La politique de conservation des données contient quatre exigences.

    Associez chaque exigence à l'action Lifecycle qui la met en œuvre. Chaque action peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: exp, text: Expiration (Days) }
    - { id: ncexp, text: NoncurrentVersionExpiration }
    - { id: abort, text: AbortIncompleteMultipartUpload }
    - { id: edm, text: Expiration (ExpiredObjectDeleteMarker) }
    - { id: nctr, text: NoncurrentVersionTransition }
    - { id: tr, text: Transition }
  targets:
    - id: t1
      text: { en: "Permanently delete an object version 30 days after a newer version or a delete marker replaces it.", fr: "Supprimer définitivement une version d'objet 30 jours après qu'une version plus récente ou un marqueur de suppression l'a remplacée." }
    - id: t2
      text: { en: "Stop uploads that are still in progress 7 days after they start, and remove their stored parts.", fr: "Arrêter les chargements encore en cours 7 jours après leur début, et supprimer leurs parties stockées." }
    - id: t3
      text: { en: "Remove delete markers that no longer have any noncurrent version behind them.", fr: "Supprimer les marqueurs de suppression qui n'ont plus aucune version non actuelle derrière eux." }
    - id: t4
      text: { en: "Make the current version of each object noncurrent 365 days after the object was created.", fr: "Rendre non actuelle la version actuelle de chaque objet 365 jours après la création de l'objet." }
answer:
  mapping: { t1: ncexp, t2: abort, t3: edm, t4: exp }
explanation:
  correct:
    en: "NoncurrentVersionExpiration permanently deletes noncurrent versions, counting days from the creation of the successor. AbortIncompleteMultipartUpload stops multipart uploads that are not completed in time. A delete marker with zero noncurrent versions is an expired object delete marker, removed with ExpiredObjectDeleteMarker. In a versioning-enabled bucket, Expiration with Days adds a delete marker, so the current version becomes noncurrent."
    fr: "NoncurrentVersionExpiration supprime définitivement les versions non actuelles, en comptant les jours à partir de la création de la version suivante. AbortIncompleteMultipartUpload arrête les chargements partitionnés non terminés dans le délai. Un marqueur de suppression sans aucune version non actuelle est un marqueur de suppression d'objet expiré, supprimé avec ExpiredObjectDeleteMarker. Dans un compartiment versionné, Expiration avec Days ajoute un marqueur de suppression : la version actuelle devient non actuelle."
  options:
    nctr:
      en: "NoncurrentVersionTransition changes the storage class of noncurrent versions; it does not delete them."
      fr: "NoncurrentVersionTransition change la classe de stockage des versions non actuelles ; elle ne les supprime pas."
    tr:
      en: "Transition changes the storage class of current versions; it neither deletes data nor creates delete markers."
      fr: "Transition change la classe de stockage des versions actuelles ; elle ne supprime pas de données et ne crée pas de marqueur de suppression."
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
