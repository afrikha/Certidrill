id: scsc03-5c-imp-rsa-signing-rotate
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany signs firmware with an asymmetric RSA_3072 KMS key (key usage SIGN_VERIFY). The key material was imported from the company's PKI HSM so that an offline signing ceremony can use the same signing key. Devices verify signatures with public keys that the company distributes to them. A new policy requires the signing key material to change every two years, and firmware signed before a change must remain verifiable on the devices. Build pipelines reference the key through the alias alias/firmware-signing.

    Which solution will meet these requirements?
  fr: |
    AnyCompany signe des micrologiciels avec une clé KMS asymétrique RSA_3072 (utilisation de clé SIGN_VERIFY). Les éléments de clé ont été importés depuis le HSM de l'infrastructure à clés publiques de l'entreprise afin qu'une cérémonie de signature hors ligne puisse utiliser la même clé de signature. Les appareils vérifient les signatures avec des clés publiques que l'entreprise leur distribue. Une nouvelle politique exige que les éléments de la clé de signature changent tous les deux ans, et les micrologiciels signés avant un changement doivent rester vérifiables sur les appareils. Les pipelines de build référencent la clé au moyen de l'alias alias/firmware-signing.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Import new key material into the existing key with the NEW_KEY_MATERIAL import type, then call RotateKeyOnDemand on the key.
        fr: |-
          Importer de nouveaux éléments de clé dans la clé existante avec le type d'importation NEW_KEY_MATERIAL, puis appeler RotateKeyOnDemand sur la clé.
    - id: b
      text:
        en: |-
          Create a new RSA_3072 KMS key with EXTERNAL origin, import the new key material, point alias/firmware-signing to the new key, and distribute the new public key.
        fr: |-
          Créer une nouvelle clé KMS RSA_3072 d'origine EXTERNAL, importer les nouveaux éléments de clé, faire pointer alias/firmware-signing vers la nouvelle clé, et distribuer la nouvelle clé publique.
    - id: c
      text:
        en: |-
          Enable automatic key rotation on the existing key with a rotation period of 730 days, and distribute the new public key after each rotation.
        fr: |-
          Activer la rotation automatique de la clé existante avec une période de rotation de 730 jours, et distribuer la nouvelle clé publique après chaque rotation.
    - id: d
      text:
        en: |-
          Reimport the key material with an expiration date two years ahead, and let AWS KMS generate replacement key material when the imported material expires.
        fr: |-
          Réimporter les éléments de clé avec une date d'expiration fixée deux ans plus tard, et laisser AWS KMS générer des éléments de remplacement à l'expiration des éléments importés.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An asymmetric or HMAC key with EXTERNAL origin can only ever be associated with one key material, so it can't be rotated in place. The company rotates manually: it creates a new key with the new imported material and moves the alias, so the pipelines need no change. Devices keep the previous public key to verify older firmware and receive the new public key for new firmware.
    fr: |-
      Une clé asymétrique ou HMAC d'origine EXTERNAL ne peut jamais être associée qu'à un seul élément de clé : elle ne peut pas faire l'objet d'une rotation sur place. L'entreprise effectue une rotation manuelle : elle crée une nouvelle clé avec les nouveaux éléments importés et déplace l'alias, si bien que les pipelines n'ont pas à changer. Les appareils conservent l'ancienne clé publique pour vérifier les anciens micrologiciels et reçoivent la nouvelle clé publique pour les nouveaux.
  options:
    a:
      en: |-
        The NEW_KEY_MATERIAL import type and on-demand rotation are supported only for symmetric encryption keys; AWS KMS rejects ImportType for asymmetric keys.
      fr: |-
        Le type d'importation NEW_KEY_MATERIAL et la rotation à la demande ne sont pris en charge que pour les clés de chiffrement symétriques ; AWS KMS rejette ImportType pour les clés asymétriques.
    c:
      en: |-
        Automatic rotation is supported only for symmetric encryption keys whose material AWS KMS generates, not for asymmetric keys or imported material.
      fr: |-
        La rotation automatique n'est prise en charge que pour les clés de chiffrement symétriques dont AWS KMS génère les éléments, pas pour les clés asymétriques ni pour les éléments importés.
    d:
      en: |-
        Expiration can be set at most 365 days ahead, and AWS KMS never generates replacement material: when imported material expires, the key becomes unusable until the same material is reimported.
      fr: |-
        L'expiration peut être fixée au plus 365 jours à l'avance, et AWS KMS ne génère jamais d'éléments de remplacement : quand les éléments importés expirent, la clé devient inutilisable jusqu'à la réimportation des mêmes éléments.
references:
  - title: "Step 4: Import the key material - AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-import-key-material.html
  - title: Rotate AWS KMS keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
