id: scsc03-5c-imp-auto-rotation-fips
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany encrypts Amazon EBS volumes and Amazon RDS databases with a symmetric customer managed KMS key that uses imported key material. The company originally imported the material because keys had to be generated in FIPS-validated HSMs. A new compliance standard requires that keys be generated and stored in HSMs validated at FIPS 140-3 Security Level 3, that the key material rotate every year without any manual step, and that no copy of the key material exist outside AWS. The security team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany chiffre des volumes Amazon EBS et des bases de données Amazon RDS avec une clé KMS symétrique gérée par le client qui utilise des éléments de clé importés. L'entreprise a initialement importé les éléments parce que les clés devaient être générées dans des HSM validés FIPS. Une nouvelle norme de conformité exige que les clés soient générées et stockées dans des HSM validés FIPS 140-3 niveau de sécurité 3, que les éléments de clé fassent l'objet d'une rotation chaque année sans aucune étape manuelle, et qu'aucune copie des éléments de clé n'existe en dehors d'AWS. L'équipe de sécurité veut la charge opérationnelle la plus FAIBLE.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the existing key, enable automatic key rotation with a rotation period of 365 days, and destroy the on-premises copy of the key material.
        fr: |-
          Conserver la clé existante, activer la rotation automatique avec une période de rotation de 365 jours, et détruire la copie sur site des éléments de clé.
    - id: b
      text:
        en: |-
          Keep the existing key, and run a scheduled AWS Lambda function each year that imports new key material and calls RotateKeyOnDemand.
        fr: |-
          Conserver la clé existante, et exécuter chaque année une fonction AWS Lambda planifiée qui importe de nouveaux éléments de clé et appelle RotateKeyOnDemand.
    - id: c
      text:
        en: |-
          Create a new KMS key in an AWS CloudHSM key store, enable automatic key rotation on it, and move the workloads to the new key.
        fr: |-
          Créer une nouvelle clé KMS dans un magasin de clés AWS CloudHSM, y activer la rotation automatique, et migrer les charges de travail vers la nouvelle clé.
    - id: d
      text:
        en: |-
          Create a new symmetric customer managed key with key material generated by AWS KMS, enable automatic key rotation, and move the workloads to the new key.
        fr: |-
          Créer une nouvelle clé symétrique gérée par le client avec des éléments de clé générés par AWS KMS, activer la rotation automatique, et migrer les charges de travail vers la nouvelle clé.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS KMS keys are protected by HSMs validated at FIPS 140-3 Security Level 3, and their key material never leaves AWS KMS unencrypted. Automatic rotation is supported only for symmetric encryption keys whose material AWS KMS generates (AWS_KMS origin), so a new key of that type rotates every year with no manual step. The origin of a key cannot be changed, which is why a new key is needed.
    fr: |-
      Les clés AWS KMS sont protégées par des HSM validés FIPS 140-3 niveau de sécurité 3, et leurs éléments de clé ne quittent jamais AWS KMS en clair. La rotation automatique n'est prise en charge que pour les clés de chiffrement symétriques dont AWS KMS génère les éléments (origine AWS_KMS) : une nouvelle clé de ce type effectue une rotation chaque année sans étape manuelle. L'origine d'une clé ne peut pas être modifiée, d'où la nécessité d'une nouvelle clé.
  options:
    a:
      en: |-
        Automatic rotation is not supported for keys with imported key material (EXTERNAL origin). Destroying the only copy outside AWS also means the key is lost for good if the material is ever deleted or expires.
      fr: |-
        La rotation automatique n'est pas prise en charge pour les clés avec des éléments importés (origine EXTERNAL). Détruire la seule copie hors d'AWS signifie aussi que la clé est perdue définitivement si les éléments sont un jour supprimés ou expirent.
    b:
      en: |-
        On-demand rotation of an imported key needs new material generated and kept outside AWS, which violates the requirement and adds a yearly job to operate.
      fr: |-
        La rotation à la demande d'une clé importée nécessite de nouveaux éléments générés et conservés hors d'AWS, ce qui enfreint l'exigence et ajoute une tâche annuelle à exploiter.
    c:
      en: |-
        KMS keys in a custom key store do not support automatic rotation, and a CloudHSM key store adds a cluster to operate.
      fr: |-
        Les clés KMS d'un magasin de clés personnalisé ne prennent pas en charge la rotation automatique, et un magasin de clés CloudHSM ajoute un cluster à exploiter.
references:
