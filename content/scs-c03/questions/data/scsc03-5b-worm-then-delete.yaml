id: scsc03-5b-worm-then-delete
objective: "5.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is creating a new Amazon S3 bucket for application audit logs. Each log object must be immutable for 7 years: no user, including the root user, can delete it, overwrite it or shorten its protection. When the 7 years end, each log object and all its versions must be deleted automatically to meet the company's data minimization rules.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany crée un nouveau compartiment (bucket) Amazon S3 pour les journaux d'audit des applications. Chaque objet journal doit être immuable pendant 7 ans : aucun utilisateur, y compris l'utilisateur racine, ne doit pouvoir le supprimer, l'écraser ni raccourcir sa protection. À la fin des 7 ans, chaque objet journal et toutes ses versions doivent être supprimés automatiquement pour respecter les règles de minimisation des données de l'entreprise.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Enable S3 Versioning with MFA delete, and keep the root user's MFA device in a safe."
        fr: "Activer la gestion des versions S3 avec la suppression MFA, et conserver le dispositif MFA de l'utilisateur racine dans un coffre-fort."
    - id: b
      text:
        en: "Enable S3 Object Lock with a default retention of 7 years in governance mode."
        fr: "Activer S3 Object Lock avec une conservation par défaut de 7 ans en mode gouvernance (governance)."
    - id: c
      text:
        en: "Enable S3 Object Lock with a default retention of 7 years in compliance mode."
        fr: "Activer S3 Object Lock avec une conservation par défaut de 7 ans en mode conformité (compliance)."
    - id: d
      text:
        en: "Add an S3 Lifecycle rule that expires current versions after 2,557 days, permanently deletes noncurrent versions 1 day after they become noncurrent, and removes expired object delete markers."
        fr: "Ajouter une règle S3 Lifecycle qui fait expirer les versions actuelles après 2 557 jours, supprime définitivement les versions non actuelles 1 jour après qu'elles sont devenues non actuelles, et supprime les marqueurs de suppression d'objet expirés."
    - id: e
      text:
        en: "Place a legal hold on each log object when it is written, and remove the legal hold after 7 years."
        fr: "Placer une conservation légale sur chaque objet journal à son écriture, et retirer la conservation légale après 7 ans."
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: "Compliance mode retention cannot be bypassed or shortened by any user, including the root user. Lifecycle actions keep working on protected objects but cannot delete a locked version, so a rule that expires the current version after the retention period, then deletes noncurrent versions and expired delete markers, removes each log automatically after 7 years."
    fr: "La conservation en mode conformité ne peut être ni contournée ni raccourcie par aucun utilisateur, y compris l'utilisateur racine. Les actions Lifecycle continuent de s'appliquer aux objets protégés mais ne peuvent pas supprimer une version verrouillée : une règle qui fait expirer la version actuelle après la période de conservation, puis supprime les versions non actuelles et les marqueurs de suppression expirés, supprime automatiquement chaque journal après 7 ans."
  options:
    a:
      en: "The root user can still permanently delete versions with MFA delete, and MFA delete cannot be used with Lifecycle configurations, so automatic deletion would not work."
      fr: "L'utilisateur racine peut toujours supprimer définitivement des versions avec la suppression MFA, et la suppression MFA ne peut pas être utilisée avec les configurations Lifecycle : la suppression automatique ne fonctionnerait pas."
    b:
      en: "Users with s3:BypassGovernanceRetention can delete locked versions or shorten their retention in governance mode."
      fr: "Les utilisateurs disposant de s3:BypassGovernanceRetention peuvent supprimer les versions verrouillées ou raccourcir leur conservation en mode gouvernance."
    e:
      en: "Any principal with s3:PutObjectLegalHold can remove a legal hold at any time, and removing it after 7 years requires a manual or custom process."
      fr: "Tout principal disposant de s3:PutObjectLegalHold peut retirer une conservation légale à tout moment, et la retirer après 7 ans exige un processus manuel ou personnalisé."
references:
  - title: Object Lock considerations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-managing.html
  - title: Configuring MFA delete
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/MultiFactorAuthenticationDelete.html
