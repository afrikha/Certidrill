id: scsc03-5b-objlock-governance-bypass
objective: "5.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores machine learning training datasets in an Amazon S3 bucket that has S3 Object Lock enabled with a default retention of 1 year in governance mode. A data quality team sometimes finds corrupted object versions that must be permanently deleted before their retention expires. Only the DataCleanup IAM role can be allowed to delete those locked versions. All other principals must keep the current protection.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany stocke des jeux de données d'entraînement de machine learning dans un compartiment (bucket) Amazon S3 où S3 Object Lock est activé avec une conservation par défaut de 1 an en mode gouvernance (governance). Une équipe qualité des données trouve parfois des versions d'objet corrompues qui doivent être supprimées définitivement avant l'expiration de leur conservation. Seul le rôle IAM DataCleanup doit être autorisé à supprimer ces versions verrouillées. Tous les autres principaux doivent conserver la protection actuelle.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Grant the DataCleanup role the s3:BypassGovernanceRetention and s3:DeleteObjectVersion permissions on the bucket's objects."
        fr: "Accorder au rôle DataCleanup les autorisations s3:BypassGovernanceRetention et s3:DeleteObjectVersion sur les objets du compartiment."
    - id: b
      text:
        en: "Grant the DataCleanup role the s3:PutObjectLegalHold permission, and have it turn off the legal hold on each corrupted version before deleting it."
        fr: "Accorder au rôle DataCleanup l'autorisation s3:PutObjectLegalHold, et lui faire désactiver la conservation légale de chaque version corrompue avant de la supprimer."
    - id: c
      text:
        en: "Have the DataCleanup role send each DeleteObject request with the version ID and the x-amz-bypass-governance-retention:true header."
        fr: "Faire envoyer par le rôle DataCleanup chaque requête DeleteObject avec l'ID de version et l'en-tête x-amz-bypass-governance-retention:true."
    - id: d
      text:
        en: "Change the bucket's default retention to compliance mode so that the DataCleanup role can shorten the retention of the corrupted versions."
        fr: "Passer la conservation par défaut du compartiment en mode conformité (compliance) pour que le rôle DataCleanup puisse raccourcir la conservation des versions corrompues."
    - id: e
      text:
        en: "Have the DataCleanup role send a DeleteObject request without a version ID so that Amazon S3 removes the locked version."
        fr: "Faire envoyer par le rôle DataCleanup une requête DeleteObject sans ID de version pour qu'Amazon S3 supprime la version verrouillée."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "In governance mode, a principal with s3:BypassGovernanceRetention can delete a locked version, but only when the request explicitly includes the x-amz-bypass-governance-retention:true header. Granting the permission only to DataCleanup keeps every other principal under the governance protection."
    fr: "En mode gouvernance, un principal disposant de s3:BypassGovernanceRetention peut supprimer une version verrouillée, mais seulement lorsque la requête inclut explicitement l'en-tête x-amz-bypass-governance-retention:true. Accorder l'autorisation au seul rôle DataCleanup laisse tous les autres principaux sous la protection du mode gouvernance."
  options:
    b:
      en: "The versions are protected by a retention period, not by a legal hold; removing a legal hold does not lift the retention period."
      fr: "Les versions sont protégées par une période de conservation, pas par une conservation légale ; retirer une conservation légale ne lève pas la période de conservation."
    d:
      en: "Compliance mode cannot be bypassed and its retention cannot be shortened by any user, so nobody could delete the corrupted versions."
      fr: "Le mode conformité ne peut pas être contourné et sa conservation ne peut être raccourcie par aucun utilisateur : personne ne pourrait supprimer les versions corrompues."
    e:
      en: "A delete without a version ID only adds a delete marker; the corrupted locked version stays in the bucket."
      fr: "Une suppression sans ID de version ajoute seulement un marqueur de suppression ; la version verrouillée corrompue reste dans le compartiment."
references:
  - title: Object Lock considerations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-managing.html
