id: scsc03-5a-rds-postgres-force-ssl
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an Amazon RDS for PostgreSQL 14 DB instance that uses the default DB parameter group. Some reporting tools connect with sslmode=prefer, and a few legacy batch jobs connect without SSL. A new policy requires the database to reject every connection that does not use SSL/TLS. A short reboot during the maintenance window is acceptable.

    Which solution will meet this requirement?
  fr: |
    AnyCompany exécute une instance de base de données Amazon RDS for PostgreSQL 14 qui utilise le groupe de paramètres de base de données par défaut. Certains outils de reporting se connectent avec sslmode=prefer, et quelques anciens traitements par lots se connectent sans SSL. Une nouvelle politique exige que la base de données rejette toute connexion qui n'utilise pas SSL/TLS. Un court redémarrage pendant la fenêtre de maintenance est acceptable.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text:
        en: "Modify the default DB parameter group to set rds.force_ssl to 1, and reboot the DB instance."
        fr: "Modifier le groupe de paramètres de base de données par défaut pour définir rds.force_ssl sur 1, et redémarrer l'instance."
    - id: b
      text:
        en: "Create a custom DB parameter group with require_secure_transport set to ON, associate it with the DB instance, and reboot."
        fr: "Créer un groupe de paramètres de base de données personnalisé avec require_secure_transport sur ON, l'associer à l'instance, puis redémarrer."
    - id: c
      text:
        en: "Rotate the DB instance to the rds-ca-rsa2048-g1 certificate authority, and set sslmode=verify-full in the reporting tools."
        fr: "Faire passer l'instance à l'autorité de certification rds-ca-rsa2048-g1, et définir sslmode=verify-full dans les outils de reporting."
    - id: d
      text:
        en: "Create a custom DB parameter group with rds.force_ssl set to 1, associate it with the DB instance, and reboot."
        fr: "Créer un groupe de paramètres de base de données personnalisé avec rds.force_ssl sur 1, l'associer à l'instance, puis redémarrer."
answer: { optionId: d }
explanation:
  correct:
    en: "For RDS for PostgreSQL, rds.force_ssl rejects connections without SSL; its default is 1 from PostgreSQL 15 but 0 for version 14 and earlier. The parameter is set in a custom DB parameter group, and a running instance uses a newly associated group after a reboot. Clients without SSL then receive a FATAL error with SSL off."
    fr: "Pour RDS for PostgreSQL, rds.force_ssl rejette les connexions sans SSL ; sa valeur par défaut est 1 à partir de PostgreSQL 15 mais 0 en version 14 et antérieures. Le paramètre se définit dans un groupe de paramètres de base de données personnalisé, et une instance en cours d'exécution utilise un groupe nouvellement associé après un redémarrage. Les clients sans SSL reçoivent alors une erreur FATAL avec SSL off."
  options:
    a:
      en: "Default DB parameter groups cannot be modified; the setting must go into a custom DB parameter group."
      fr: "Les groupes de paramètres de base de données par défaut ne peuvent pas être modifiés : le paramètre doit être défini dans un groupe personnalisé."
    b:
      en: "require_secure_transport is the RDS for MySQL and MariaDB parameter; RDS for PostgreSQL uses rds.force_ssl."
      fr: "require_secure_transport est le paramètre de RDS for MySQL et MariaDB ; RDS for PostgreSQL utilise rds.force_ssl."
    c:
      en: "The CA and sslmode=verify-full only make the updated clients verify the server certificate; the server would still accept the legacy jobs without SSL."
      fr: "L'autorité de certification et sslmode=verify-full font seulement vérifier le certificat du serveur par les clients mis à jour : le serveur accepterait toujours les anciens traitements sans SSL."
references:
  - title: Using SSL with a PostgreSQL DB instance - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/PostgreSQL.Concepts.General.SSL.html
