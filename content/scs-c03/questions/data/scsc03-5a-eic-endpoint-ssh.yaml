id: scsc03-5a-eic-endpoint-ssh
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's administrators use SSH with their existing key pairs to manage Linux instances in private subnets. The instances run a hardened third-party image that does not include SSM Agent, and installing agents is not allowed. The instances have no public IP addresses, the VPC has no internet gateway, and the company wants to remove its bastion hosts. Administrators work from home and from offices. They must be able to reach only port 22, and each connection must be authorized by IAM.

    Which solution will meet these requirements?
  fr: |
    Les administrateurs d'AnyCompany utilisent SSH avec leurs paires de clés existantes pour gérer des instances Linux situées dans des sous-réseaux privés. Les instances exécutent une image tierce renforcée qui n'inclut pas SSM Agent, et l'installation d'agents est interdite. Les instances n'ont pas d'adresse IP publique, le VPC n'a pas de passerelle Internet, et l'entreprise veut supprimer ses hôtes bastions. Les administrateurs travaillent à domicile et dans les bureaux. Ils ne doivent pouvoir atteindre que le port 22, et chaque connexion doit être autorisée par IAM.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use Session Manager port forwarding to port 22 through interface VPC endpoints for Systems Manager, with IAM policies that allow the sessions."
        fr: "Utiliser la redirection de port de Session Manager vers le port 22 par des points de terminaison de VPC d'interface pour Systems Manager, avec des politiques IAM qui autorisent les sessions."
    - id: b
      text:
        en: "Create an EC2 Instance Connect Endpoint, allow TCP 22 to the instances from its security group, and grant ec2-instance-connect:OpenTunnel limited to remotePort 22."
        fr: "Créer un EC2 Instance Connect Endpoint, autoriser TCP 22 vers les instances depuis son groupe de sécurité, et accorder ec2-instance-connect:OpenTunnel limité à remotePort 22."
    - id: c
      text:
        en: "Attach an internet gateway, assign Elastic IP addresses to the instances, and allow TCP 22 only from the office IP address ranges."
        fr: "Attacher une passerelle Internet, attribuer des adresses IP Elastic aux instances, et n'autoriser TCP 22 que depuis les plages d'adresses IP des bureaux."
    - id: d
      text:
        en: "Create an AWS Site-to-Site VPN connection between the offices and a virtual private gateway, and allow TCP 22 from the office CIDR ranges."
        fr: "Créer une connexion AWS Site-to-Site VPN entre les bureaux et une passerelle réseau privé virtuel, et autoriser TCP 22 depuis les plages CIDR des bureaux."
answer: { optionId: b }
explanation:
  correct:
    en: "EC2 Instance Connect Endpoint opens a private tunnel to instances that have no public IP address, without a bastion or an internet gateway, and administrators can keep their own key pairs. Each tunnel requires ec2-instance-connect:OpenTunnel, and the ec2-instance-connect:remotePort condition key restricts it to port 22. The instance security group must allow SSH from the endpoint."
    fr: "EC2 Instance Connect Endpoint ouvre un tunnel privé vers des instances sans adresse IP publique, sans bastion ni passerelle Internet, et les administrateurs peuvent garder leurs propres paires de clés. Chaque tunnel exige ec2-instance-connect:OpenTunnel, et la clé de condition ec2-instance-connect:remotePort le limite au port 22. Le groupe de sécurité des instances doit autoriser SSH depuis le point de terminaison."
  options:
    a:
      en: "Session Manager requires SSM Agent on the instances, which the hardened image does not include and the company does not allow."
      fr: "Session Manager exige SSM Agent sur les instances, que l'image renforcée n'inclut pas et que l'entreprise n'autorise pas."
    c:
      en: "Public IP addresses expose the instances to the internet, administrators working from home are not covered, and connections are not authorized by IAM."
      fr: "Des adresses IP publiques exposent les instances à Internet, les administrateurs à domicile ne sont pas couverts, et les connexions ne sont pas autorisées par IAM."
    d:
      en: "A site-to-site VPN gives network access from the offices only, not from home, and SSH connections are not authorized by IAM."
      fr: "Un VPN site à site ne donne un accès réseau que depuis les bureaux, pas depuis le domicile, et les connexions SSH ne sont pas autorisées par IAM."
references:
  - title: Connect to an Amazon EC2 instance using EC2 Instance Connect Endpoint - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/connect-using-eice.html
  - title: Grant permissions to use EC2 Instance Connect Endpoint - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/permissions-for-ec2-instance-connect-endpoint.html
