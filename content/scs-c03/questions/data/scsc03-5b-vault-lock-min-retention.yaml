id: scsc03-5b-vault-lock-min-retention
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses one AWS Backup vault named prod-vault in a workload account. Last month, the security team ran put-backup-vault-lock-configuration on prod-vault with --min-retention-days 365 and --changeable-for-days 3. A development team then added a backup plan rule that sends nightly backups of test Amazon RDS databases to prod-vault with a retention of 14 days. Every job created by the new rule fails. Production backups must keep the current protection, and test backups must be kept for only 14 days.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise un coffre AWS Backup nommé prod-vault dans un compte de charge de travail. Le mois dernier, l'équipe de sécurité a exécuté put-backup-vault-lock-configuration sur prod-vault avec --min-retention-days 365 et --changeable-for-days 3. Une équipe de développement a ensuite ajouté une règle de plan de sauvegarde qui envoie dans prod-vault des sauvegardes nocturnes de bases de données Amazon RDS de test avec une conservation de 14 jours. Toutes les tâches créées par la nouvelle règle échouent. Les sauvegardes de production doivent conserver la protection actuelle, et les sauvegardes de test ne doivent être conservées que 14 jours.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Run put-backup-vault-lock-configuration on prod-vault again with --min-retention-days 14 so that the test jobs can complete."
        fr: "Exécuter de nouveau put-backup-vault-lock-configuration sur prod-vault avec --min-retention-days 14 pour que les tâches de test puissent aboutir."
    - id: b
      text:
        en: "Run delete-backup-vault-lock-configuration on prod-vault, run the test jobs, and then lock the vault again with the original settings."
        fr: "Exécuter delete-backup-vault-lock-configuration sur prod-vault, exécuter les tâches de test, puis verrouiller de nouveau le coffre avec les paramètres d'origine."
    - id: c
      text:
        en: "Create a separate backup vault for the test databases, and change the development team's backup plan rule to target that vault with a retention of 14 days."
        fr: "Créer un coffre de sauvegarde distinct pour les bases de données de test, et modifier la règle du plan de sauvegarde de l'équipe de développement pour cibler ce coffre avec une conservation de 14 jours."
    - id: d
      text:
        en: "Keep the test rule on prod-vault, and add a lifecycle setting that transitions the test recovery points to cold storage after 14 days."
        fr: "Conserver la règle de test sur prod-vault, et ajouter un paramètre de cycle de vie qui fait passer les points de récupération de test en stockage à froid après 14 jours."
answer: { optionId: c }
explanation:
  correct:
    en: "With a minimum retention set, backup and copy jobs into the locked vault fail when their retention is shorter than the minimum. The grace time of 3 days has passed, so the compliance mode lock can no longer be changed or removed; test backups must go to another vault."
    fr: "Avec une conservation minimale définie, les tâches de sauvegarde et de copie vers le coffre verrouillé échouent lorsque leur conservation est inférieure au minimum. Le délai de grâce de 3 jours est écoulé : le verrou en mode conformité (compliance) ne peut plus être modifié ni supprimé, et les sauvegardes de test doivent aller dans un autre coffre."
  options:
    a:
      en: "After the grace time expires, a compliance mode vault lock is immutable and cannot be changed by any user or by AWS."
      fr: "Après l'expiration du délai de grâce, un verrou de coffre en mode conformité est immuable et ne peut être modifié par aucun utilisateur ni par AWS."
    b:
      en: "The lock configuration can be deleted only during the grace time, which ended a month ago."
      fr: "La configuration du verrou ne peut être supprimée que pendant le délai de grâce, qui a pris fin il y a un mois."
    d:
      en: "The jobs fail because their total retention of 14 days is below the 365-day minimum; a storage tier transition does not change that retention."
      fr: "Les tâches échouent parce que leur conservation totale de 14 jours est inférieure au minimum de 365 jours ; une transition de niveau de stockage ne change pas cette conservation."
references:
  - title: AWS Backup Vault Lock
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html
