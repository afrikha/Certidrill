id: scsc03-5b-dlm-cross-account-event
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's production account creates Amazon EBS snapshots in us-east-1 with an Amazon Data Lifecycle Manager snapshot policy. The snapshots are encrypted with a customer managed key. To protect against a compromise of the production account, an isolated account must automatically copy every shared snapshot into eu-west-2, encrypt the copies with its own customer managed key, and keep them for 30 days. The company does not use AWS Backup.

    Which solution will meet these requirements?
  fr: |
    Le compte de production d'AnyCompany crée des instantanés Amazon EBS dans us-east-1 avec une politique d'instantanés Amazon Data Lifecycle Manager. Les instantanés sont chiffrés avec une clé gérée par le client. Pour se protéger d'une compromission du compte de production, un compte isolé doit copier automatiquement chaque instantané partagé vers eu-west-2, chiffrer les copies avec sa propre clé gérée par le client, et les conserver 30 jours. L'entreprise n'utilise pas AWS Backup.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "In the production account, enable cross-account sharing with the isolated account in the snapshot policy, and share the customer managed key. In the isolated account, create a cross-account copy event policy in eu-west-2 that copies snapshots into eu-west-2 with its own key and a 30-day retention."
        fr: "Dans le compte de production, activer le partage entre comptes avec le compte isolé dans la politique d'instantanés, et partager la clé gérée par le client. Dans le compte isolé, créer une politique d'événements de copie entre comptes dans eu-west-2 qui copie les instantanés vers eu-west-2 avec sa propre clé et une conservation de 30 jours."
    - id: b
      text:
        en: "In the production account, enable cross-account sharing with the isolated account in the snapshot policy, and share the customer managed key. In the isolated account, create a cross-account copy event policy in us-east-1 that copies snapshots into eu-west-2 with its own key and a 30-day retention."
        fr: "Dans le compte de production, activer le partage entre comptes avec le compte isolé dans la politique d'instantanés, et partager la clé gérée par le client. Dans le compte isolé, créer une politique d'événements de copie entre comptes dans us-east-1 qui copie les instantanés vers eu-west-2 avec sa propre clé et une conservation de 30 jours."
    - id: c
      text:
        en: "In the production account, re-encrypt the snapshots with the default EBS encryption key and enable cross-account sharing in the snapshot policy. In the isolated account, create a cross-account copy event policy in us-east-1 that copies snapshots into eu-west-2 with a 30-day retention."
        fr: "Dans le compte de production, rechiffrer les instantanés avec la clé de chiffrement EBS par défaut et activer le partage entre comptes dans la politique d'instantanés. Dans le compte isolé, créer une politique d'événements de copie entre comptes dans us-east-1 qui copie les instantanés vers eu-west-2 avec une conservation de 30 jours."
    - id: d
      text:
        en: "In the production account, add a cross-Region copy rule to eu-west-2 in the snapshot policy, and set the isolated account's key ARN as the encryption key of the copy rule."
        fr: "Dans le compte de production, ajouter à la politique d'instantanés une règle de copie inter-Régions vers eu-west-2, et définir l'ARN de la clé du compte isolé comme clé de chiffrement de la règle de copie."
answer: { optionId: b }
explanation:
  correct:
    en: "The source snapshot policy and the target account's cross-account copy event policy must be in the same Region, here us-east-1; the copy actions of the event policy can then target other Regions with a KMS key and a retention. The source must share the customer managed key with the target account, and the target policy's role needs access to both keys."
    fr: "La politique d'instantanés source et la politique d'événements de copie entre comptes du compte cible doivent se trouver dans la même Région, ici us-east-1 ; les actions de copie de la politique d'événements peuvent ensuite cibler d'autres Régions avec une clé KMS et une conservation. La source doit partager la clé gérée par le client avec le compte cible, et le rôle de la politique cible doit avoir accès aux deux clés."
  options:
    a:
      en: "An event policy in eu-west-2 does not receive the share events of snapshots created in us-east-1, because both policies must be in the same Region."
      fr: "Une politique d'événements dans eu-west-2 ne reçoit pas les événements de partage des instantanés créés dans us-east-1, car les deux politiques doivent se trouver dans la même Région."
    c:
      en: "Snapshots encrypted with the default EBS encryption key cannot be shared with another account, and the copies would not use the isolated account's own key."
      fr: "Les instantanés chiffrés avec la clé de chiffrement EBS par défaut ne peuvent pas être partagés avec un autre compte, et les copies n'utiliseraient pas la propre clé du compte isolé."
    d:
      en: "A cross-Region copy rule keeps the copies in the production account, so a compromise of that account would also expose the copies."
      fr: "Une règle de copie inter-Régions conserve les copies dans le compte de production : une compromission de ce compte exposerait aussi les copies."
references:
  - title: Automate cross-account snapshot copies with Data Lifecycle Manager
    url: https://docs.aws.amazon.com/ebs/latest/userguide/event-policy.html
