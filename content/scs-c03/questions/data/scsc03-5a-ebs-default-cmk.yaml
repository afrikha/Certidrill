id: scsc03-5a-ebs-default-cmk
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany requires that every new Amazon EBS volume in the eu-west-1 Region of its production account be encrypted with a customer managed KMS key named ebs-prod. This includes volumes created at instance launch by teams that do not specify any encryption setting.

    Which solution will meet this requirement?
  fr: |
    AnyCompany exige que chaque nouveau volume Amazon EBS dans la Région eu-west-1 de son compte de production soit chiffré avec une clé KMS gérée par le client nommée ebs-prod. Cela inclut les volumes créés au lancement d'instances par des équipes qui ne précisent aucun paramètre de chiffrement.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text:
        en: "Update the key policy of ebs-prod so that all principals in the account can use the key with Amazon EC2."
        fr: "Mettre à jour la politique de clé de ebs-prod pour que tous les principaux du compte puissent utiliser la clé avec Amazon EC2."
    - id: b
      text:
        en: "Enable EBS encryption by default in eu-west-1, and set ebs-prod as the default KMS key with modify-ebs-default-kms-key-id."
        fr: "Activer le chiffrement EBS par défaut dans eu-west-1, et définir ebs-prod comme clé KMS par défaut avec modify-ebs-default-kms-key-id."
    - id: c
      text:
        en: "Enable EBS encryption by default in eu-west-1, and keep the aws/ebs AWS managed key as the default KMS key."
        fr: "Activer le chiffrement EBS par défaut dans eu-west-1, et garder la clé gérée par AWS aws/ebs comme clé KMS par défaut."
    - id: d
      text:
        en: "Deploy the encrypted-volumes AWS Config managed rule in eu-west-1, and notify the teams that create unencrypted volumes."
        fr: "Déployer la règle gérée AWS Config encrypted-volumes dans eu-west-1, et notifier les équipes qui créent des volumes non chiffrés."
answer: { optionId: b }
explanation:
  correct:
    en: "EBS encryption by default is a Regional setting that encrypts every new volume and every copy of an unencrypted snapshot, even when the request specifies no encryption. By default it uses the aws/ebs key, but the default key can be changed to a symmetric customer managed key such as ebs-prod. It has no effect on existing volumes."
    fr: "Le chiffrement EBS par défaut est un paramètre régional qui chiffre chaque nouveau volume et chaque copie d'un instantané non chiffré, même lorsque la requête ne précise aucun chiffrement. Il utilise par défaut la clé aws/ebs, mais la clé par défaut peut être remplacée par une clé symétrique gérée par le client comme ebs-prod. Il n'a aucun effet sur les volumes existants."
  options:
    a:
      en: "Allowing use of the key does not make Amazon EC2 use it; volumes created without encryption settings would still be unencrypted."
      fr: "Autoriser l'utilisation de la clé ne la fait pas utiliser par Amazon EC2 : les volumes créés sans paramètre de chiffrement resteraient non chiffrés."
    c:
      en: "New volumes would be encrypted, but with the aws/ebs AWS managed key instead of ebs-prod."
      fr: "Les nouveaux volumes seraient chiffrés, mais avec la clé gérée par AWS aws/ebs au lieu de ebs-prod."
    d:
      en: "An AWS Config rule only detects unencrypted volumes after they are created; it does not encrypt them."
      fr: "Une règle AWS Config ne fait que détecter les volumes non chiffrés après leur création : elle ne les chiffre pas."
references:
  - title: Enable Amazon EBS encryption by default - Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/encryption-by-default.html
