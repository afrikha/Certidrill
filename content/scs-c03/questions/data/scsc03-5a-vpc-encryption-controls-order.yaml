id: scsc03-5a-vpc-encryption-controls-order
objective: "5.1.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has an existing VPC that contains Amazon EC2 instances of several generations, a NAT gateway, and an internet gateway. The workloads must keep their internet access. To meet a HIPAA requirement, the security team must use VPC Encryption Controls so that unencrypted resources can no longer be created or attached in the VPC.

    Which four actions should the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    AnyCompany possède un VPC existant qui contient des instances Amazon EC2 de plusieurs générations, une passerelle NAT et une passerelle Internet. Les charges de travail doivent conserver leur accès à Internet. Pour répondre à une exigence HIPAA, l'équipe de sécurité doit utiliser VPC Encryption Controls afin que des ressources non chiffrées ne puissent plus être créées ni attachées dans le VPC.

    Quelles sont les quatre actions que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: monitor
      text: { en: "Enable VPC Encryption Controls on the VPC in monitor mode.", fr: "Activer VPC Encryption Controls sur le VPC en mode surveillance (monitor)." }
    - id: direct
      text: { en: "Enable VPC Encryption Controls on the VPC directly in enforce mode.", fr: "Activer VPC Encryption Controls sur le VPC directement en mode application (enforce)." }
    - id: identify
      text: { en: "Identify the resources that block enforcement, with GetVpcResourcesBlockingEncryptionEnforcement and flow logs that include the encryption-status field.", fr: "Identifier les ressources qui bloquent l'application, avec GetVpcResourcesBlockingEncryptionEnforcement et des journaux de flux qui incluent le champ encryption-status." }
    - id: fix
      text: { en: "Move the non-compliant instances to Nitro instance types that support encryption in transit, and add exclusions for the internet gateway and the NAT gateway.", fr: "Passer les instances non conformes sur des types d'instance Nitro qui prennent en charge le chiffrement en transit, et ajouter des exclusions pour la passerelle Internet et la passerelle NAT." }
    - id: nfw
      text: { en: "Deploy AWS Network Firewall in the VPC to drop unencrypted flows.", fr: "Déployer AWS Network Firewall dans le VPC pour rejeter les flux non chiffrés." }
    - id: enforce
      text: { en: "Switch VPC Encryption Controls to enforce mode.", fr: "Passer VPC Encryption Controls en mode application (enforce)." }
answer:
  sequence: [monitor, identify, fix, enforce]
explanation:
  correct:
    en: "An existing VPC can only be enabled in monitor mode first; enforce mode can be enabled directly only on a new VPC. Monitor mode shows the encryption status of flows, and GetVpcResourcesBlockingEncryptionEnforcement lists the blockers. Older instance types must move to Nitro types with native encryption, and the internet gateway and NAT gateway, which cannot comply, need exclusions. The VPC can then switch to enforce mode."
    fr: "Un VPC existant ne peut d'abord être activé qu'en mode surveillance ; le mode application ne peut être activé directement que sur un nouveau VPC. Le mode surveillance montre l'état de chiffrement des flux, et GetVpcResourcesBlockingEncryptionEnforcement liste les ressources bloquantes. Les anciens types d'instance doivent passer sur des types Nitro au chiffrement natif, et la passerelle Internet et la passerelle NAT, qui ne peuvent pas être conformes, nécessitent des exclusions. Le VPC peut alors passer en mode application."
  options:
    direct:
      en: "Enforce mode can be enabled directly only when a new VPC is created; an existing VPC must start in monitor mode."
      fr: "Le mode application ne peut être activé directement qu'à la création d'un nouveau VPC ; un VPC existant doit commencer en mode surveillance."
    nfw:
      en: "A VPC that contains AWS Network Firewall must stay in monitor mode, so deploying it would prevent enforcement."
      fr: "Un VPC qui contient AWS Network Firewall doit rester en mode surveillance : le déployer empêcherait l'application."
references:
  - title: Enforce VPC encryption in transit - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-encryption-controls.html
