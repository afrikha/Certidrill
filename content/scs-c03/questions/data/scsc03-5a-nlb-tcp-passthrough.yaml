id: scsc03-5a-nlb-tcp-passthrough
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a trading gateway on Amazon EC2 instances. Its regulator requires that the private key of the gateway's TLS server certificate never leave the instances, where the application keeps it in an encrypted local keystore. Clients must connect over TLS through a single load balancer endpoint that scales automatically, and the load balancer must never decrypt the traffic.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une passerelle de négociation sur des instances Amazon EC2. Son régulateur exige que la clé privée du certificat de serveur TLS de la passerelle ne quitte jamais les instances, où l'application la conserve dans un magasin de clés local chiffré. Les clients doivent se connecter en TLS par un point de terminaison unique d'équilibreur de charge qui se met à l'échelle automatiquement, et l'équilibreur de charge ne doit jamais déchiffrer le trafic.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "A Network Load Balancer with a TCP listener on port 443 that forwards to a TCP target group of the instances."
        fr: "Un Network Load Balancer avec un écouteur TCP sur le port 443 qui transfère vers un groupe cible TCP des instances."
    - id: b
      text:
        en: "A Network Load Balancer with a TLS listener that uses the certificate imported into ACM and forwards to a TLS target group."
        fr: "Un Network Load Balancer avec un écouteur TLS qui utilise le certificat importé dans ACM et transfère vers un groupe cible TLS."
    - id: c
      text:
        en: "An Application Load Balancer with an HTTPS listener that uses the certificate imported into ACM and forwards to an HTTPS target group."
        fr: "Un Application Load Balancer avec un écouteur HTTPS qui utilise le certificat importé dans ACM et transfère vers un groupe cible HTTPS."
    - id: d
      text:
        en: "A Gateway Load Balancer that sends the client traffic to the instances registered in a GENEVE target group."
        fr: "Un Gateway Load Balancer qui envoie le trafic client aux instances enregistrées dans un groupe cible GENEVE."
answer: { optionId: a }
explanation:
  correct:
    en: "With a TCP listener on port 443, the Network Load Balancer forwards the encrypted traffic to the targets without decrypting it, so the instances terminate TLS with their own private key. The NLB still provides a single, automatically scaling endpoint."
    fr: "Avec un écouteur TCP sur le port 443, le Network Load Balancer transfère le trafic chiffré aux cibles sans le déchiffrer : les instances terminent TLS avec leur propre clé privée. Le NLB fournit toujours un point de terminaison unique qui se met à l'échelle automatiquement."
  options:
    b:
      en: "A TLS listener terminates TLS on the load balancer, which requires the private key to be imported into ACM and lets the load balancer decrypt the traffic."
      fr: "Un écouteur TLS termine TLS sur l'équilibreur de charge, ce qui exige d'importer la clé privée dans ACM et permet à l'équilibreur de déchiffrer le trafic."
    c:
      en: "An HTTPS listener decrypts requests on the ALB, and the private key must be imported into ACM, which breaks both requirements."
      fr: "Un écouteur HTTPS déchiffre les requêtes sur l'ALB, et la clé privée doit être importée dans ACM, ce qui enfreint les deux exigences."
    d:
      en: "A Gateway Load Balancer inserts virtual appliances such as firewalls into a traffic path; it is not a client-facing endpoint for an application."
      fr: "Un Gateway Load Balancer insère des appliances virtuelles, comme des pare-feu, dans un chemin de trafic : ce n'est pas un point de terminaison d'application pour les clients."
references:
  - title: Listeners for your Network Load Balancers - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/load-balancer-listeners.html
