id: scsc03-5a-nitro-tgw-path
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs an application tier on M6i instances in VPC A and a self-managed database cluster on R6i instances in VPC B. Both VPCs are in the same Region and account, and the tiers communicate through a transit gateway. A compliance team requires that all traffic between the two tiers be encrypted in transit. The application team cannot change the application or the database client settings.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany exécute une couche applicative sur des instances M6i dans le VPC A et un cluster de base de données autogéré sur des instances R6i dans le VPC B. Les deux VPC sont dans la même Région et le même compte, et les couches communiquent par une passerelle de transit. Une équipe de conformité exige que tout le trafic entre les deux couches soit chiffré en transit. L'équipe applicative ne peut modifier ni l'application ni les paramètres du client de base de données.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Keep the transit gateway path, and move the application tier to C5n instances and the database cluster to R5n instances."
        fr: "Garder le chemin par la passerelle de transit, et passer la couche applicative sur des instances C5n et le cluster de base de données sur des instances R5n."
    - id: b
      text:
        en: "Create a VPC peering connection between VPC A and VPC B, and route the traffic between the tiers over it instead of the transit gateway."
        fr: "Créer une connexion d'appairage de VPC entre le VPC A et le VPC B, et y faire passer le trafic entre les couches au lieu de la passerelle de transit."
    - id: c
      text:
        en: "Turn on appliance mode on both transit gateway VPC attachments so that the traffic between the tiers is encrypted."
        fr: "Activer le mode appliance sur les deux attachements de VPC de la passerelle de transit pour que le trafic entre les couches soit chiffré."
    - id: d
      text:
        en: "Place an internal Network Load Balancer with a TCP listener in front of the database cluster, and point the application at it through the transit gateway."
        fr: "Placer un Network Load Balancer interne avec un écouteur TCP devant le cluster de base de données, et y diriger l'application par la passerelle de transit."
answer: { optionId: b }
explanation:
  correct:
    en: "M6i and R6i instances automatically encrypt traffic between them with the Nitro System when they are in the same Region, in the same VPC or in peered VPCs, and the traffic does not pass through a virtual network device or service such as a transit gateway or a load balancer. Moving the inter-tier traffic to a peering connection satisfies these conditions without any application change."
    fr: "Les instances M6i et R6i chiffrent automatiquement le trafic entre elles avec le système Nitro lorsqu'elles sont dans la même Région, dans le même VPC ou dans des VPC appairés, et que le trafic ne traverse pas un équipement ou service réseau virtuel comme une passerelle de transit ou un équilibreur de charge. Faire passer le trafic entre les couches par une connexion d'appairage remplit ces conditions sans modifier l'application."
  options:
    a:
      en: "C5n and R5n support the Nitro encryption, but traffic through a transit gateway is not encrypted by it, whatever the instance types."
      fr: "C5n et R5n prennent en charge le chiffrement Nitro, mais le trafic qui traverse une passerelle de transit n'est pas chiffré par celui-ci, quels que soient les types d'instance."
    c:
      en: "Appliance mode keeps flows symmetric through one Availability Zone for inspection appliances; it does not encrypt traffic."
      fr: "Le mode appliance garde les flux symétriques par une zone de disponibilité pour les appliances d'inspection : il ne chiffre pas le trafic."
    d:
      en: "Adding a load balancer adds another hop that excludes the traffic from Nitro encryption, and the transit gateway hop remains."
      fr: "Ajouter un équilibreur de charge ajoute un tronçon qui exclut le trafic du chiffrement Nitro, et le tronçon de la passerelle de transit demeure."
references:
  - title: Data protection in Amazon EC2 - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/data-protection.html
