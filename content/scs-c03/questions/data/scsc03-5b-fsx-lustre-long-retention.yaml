id: scsc03-5b-fsx-lustre-long-retention
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs simulations on a persistent Amazon FSx for Lustre file system that is not linked to an Amazon S3 data repository. The data protection policy requires daily backups kept for 30 days and monthly backups kept for 7 years. Monthly backups must be deleted automatically at the end of their retention and must survive the deletion of the file system. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des simulations sur un système de fichiers Amazon FSx for Lustre persistant qui n'est pas lié à un référentiel de données Amazon S3. La politique de protection des données exige des sauvegardes quotidiennes conservées 30 jours et des sauvegardes mensuelles conservées 7 ans. Les sauvegardes mensuelles doivent être supprimées automatiquement à la fin de leur conservation et doivent survivre à la suppression du système de fichiers. L'équipe veut la charge opérationnelle la plus FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set the file system's automatic daily backup retention to 30 days, and schedule an AWS Lambda function that creates a user-initiated backup on the first day of each month."
        fr: "Définir la conservation des sauvegardes quotidiennes automatiques du système de fichiers sur 30 jours, et planifier une fonction AWS Lambda qui crée une sauvegarde initiée par l'utilisateur le premier jour de chaque mois."
    - id: b
      text:
        en: "Set the file system's automatic daily backup retention to 2,555 days, and delete backups older than 30 days except the first backup of each month."
        fr: "Définir la conservation des sauvegardes quotidiennes automatiques du système de fichiers sur 2 555 jours, et supprimer les sauvegardes de plus de 30 jours sauf la première de chaque mois."
    - id: c
      text:
        en: "Link the file system to an S3 data repository, export the data every month, and add an S3 Lifecycle rule that expires exported objects after 7 years."
        fr: "Lier le système de fichiers à un référentiel de données S3, exporter les données chaque mois, et ajouter une règle S3 Lifecycle qui fait expirer les objets exportés après 7 ans."
    - id: d
      text:
        en: "Create an AWS Backup plan for the file system with a daily rule that keeps recovery points for 30 days and a monthly rule that keeps recovery points for 7 years."
        fr: "Créer un plan AWS Backup pour le système de fichiers avec une règle quotidienne qui conserve les points de récupération 30 jours et une règle mensuelle qui les conserve 7 ans."
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Backup supports FSx for Lustre with schedules, retention per rule and automatic deletion at the end of the lifecycle. Its backups are retained even after the source file system is deleted, so one plan with two rules meets both retention periods without custom code."
    fr: "AWS Backup prend en charge FSx for Lustre avec des planifications, une conservation par règle et une suppression automatique à la fin du cycle de vie. Ses sauvegardes sont conservées même après la suppression du système de fichiers source : un seul plan à deux règles répond aux deux durées de conservation sans code personnalisé."
  options:
    a:
      en: "User-initiated backups never expire and are never deleted automatically, so the 7-year monthly backups would need manual or custom deletion."
      fr: "Les sauvegardes initiées par l'utilisateur n'expirent jamais et ne sont jamais supprimées automatiquement : les sauvegardes mensuelles de 7 ans exigeraient une suppression manuelle ou personnalisée."
    b:
      en: "Automatic daily backup retention is limited to 0 to 90 days, and automatic backups are deleted when the file system is deleted."
      fr: "La conservation des sauvegardes quotidiennes automatiques est limitée à 0 à 90 jours, et les sauvegardes automatiques sont supprimées avec le système de fichiers."
    c:
      en: "FSx does not support backups on file systems linked to S3, and monthly exports with custom scheduling add operational overhead."
      fr: "FSx ne prend pas en charge les sauvegardes des systèmes de fichiers liés à S3, et des exports mensuels planifiés manuellement ajoutent de la charge opérationnelle."
references:
  - title: Protecting your data with backups
    url: https://docs.aws.amazon.com/fsx/latest/LustreGuide/using-backups-fsx.html
