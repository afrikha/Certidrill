id: scsc03-5b-remaining-retention-cap
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany stores customer statements in an Amazon S3 bucket that has S3 Object Lock enabled. Developers call PutObjectRetention to extend retention on individual statements. Finance found statements locked in compliance mode for 50 years by mistake, which creates storage costs that can never be removed. The security team must prevent any principal, in any account, from setting a retention period that leaves more than 400 days of remaining retention. The control must apply even if a developer's IAM policy allows s3:PutObjectRetention.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke des relevés clients dans un compartiment (bucket) Amazon S3 où S3 Object Lock est activé. Les développeurs appellent PutObjectRetention pour prolonger la conservation de relevés précis. Le service financier a trouvé des relevés verrouillés par erreur en mode conformité (compliance) pendant 50 ans, ce qui crée des coûts de stockage qui ne pourront jamais être supprimés. L'équipe de sécurité doit empêcher tout principal, dans n'importe quel compte, de définir une période de conservation qui laisse plus de 400 jours de conservation restante. Le contrôle doit s'appliquer même si la politique IAM d'un développeur autorise s3:PutObjectRetention.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set the bucket's default retention to 400 days in compliance mode so that no object version can be retained for longer than 400 days."
        fr: "Définir la conservation par défaut du compartiment sur 400 jours en mode conformité pour qu'aucune version d'objet ne puisse être conservée plus de 400 jours."
    - id: b
      text:
        en: "Add a bucket policy statement that denies s3:PutObjectRetention to all principals when s3:object-lock-remaining-retention-days is NumericGreaterThan 400."
        fr: "Ajouter à la politique de compartiment une instruction qui refuse s3:PutObjectRetention à tous les principaux lorsque s3:object-lock-remaining-retention-days est NumericGreaterThan 400."
    - id: c
      text:
        en: "Add a bucket policy statement that denies s3:PutObjectRetention to all principals when the s3:object-lock-mode condition key is COMPLIANCE."
        fr: "Ajouter à la politique de compartiment une instruction qui refuse s3:PutObjectRetention à tous les principaux lorsque la clé de condition s3:object-lock-mode vaut COMPLIANCE."
    - id: d
      text:
        en: "Create an S3 Lifecycle rule that expires current versions and permanently deletes noncurrent versions 400 days after their creation."
        fr: "Créer une règle S3 Lifecycle qui fait expirer les versions actuelles et supprime définitivement les versions non actuelles 400 jours après leur création."
answer: { optionId: b }
explanation:
  correct:
    en: "The s3:object-lock-remaining-retention-days condition key lets a bucket policy set minimum and maximum allowable retention periods. An explicit Deny in the bucket policy applies to every principal and overrides any Allow in an identity policy."
    fr: "La clé de condition s3:object-lock-remaining-retention-days permet à une politique de compartiment de fixer des périodes de conservation minimale et maximale autorisées. Un refus explicite dans la politique de compartiment s'applique à tous les principaux et l'emporte sur toute autorisation d'une politique basée sur l'identité."
  options:
    a:
      en: "Explicit retention settings on an object version override the bucket's default retention, so developers can still set 50 years."
      fr: "Les paramètres de conservation explicites d'une version d'objet l'emportent sur la conservation par défaut du compartiment : les développeurs peuvent encore définir 50 ans."
    c:
      en: "This blocks every compliance mode retention instead of limiting its length, and it leaves governance mode retention unlimited."
      fr: "Ce refus bloque toute conservation en mode conformité au lieu d'en limiter la durée, et laisse la conservation en mode gouvernance illimitée."
    d:
      en: "Lifecycle expiration cannot delete a locked version, so it does not limit the retention that developers set."
      fr: "L'expiration Lifecycle ne peut pas supprimer une version verrouillée : elle ne limite pas la conservation définie par les développeurs."
references:
  - title: Object Lock considerations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-managing.html
