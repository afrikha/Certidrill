id: scsc03-5a-s3-client-side-kms
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's on-premises application uploads patient records to Amazon S3. A regulation requires that the records be encrypted before they leave the company's data center, so that neither network intermediaries nor Amazon S3 ever handle the plaintext. The encryption keys must be managed in AWS KMS so that their use is recorded in AWS CloudTrail.

    Which solution will meet these requirements?
  fr: |
    L'application sur site d'AnyCompany charge des dossiers de patients dans Amazon S3. Une réglementation exige que les dossiers soient chiffrés avant de quitter le centre de données de l'entreprise, afin que ni les intermédiaires réseau ni Amazon S3 ne manipulent jamais le texte en clair. Les clés de chiffrement doivent être gérées dans AWS KMS pour que leur utilisation soit enregistrée dans AWS CloudTrail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Upload the records over HTTPS to a bucket whose default encryption is SSE-KMS with a customer managed key."
        fr: "Charger les dossiers en HTTPS dans un compartiment dont le chiffrement par défaut est SSE-KMS avec une clé gérée par le client."
    - id: b
      text:
        en: "Upload the records over HTTPS to a bucket whose default encryption is DSSE-KMS with a customer managed key."
        fr: "Charger les dossiers en HTTPS dans un compartiment dont le chiffrement par défaut est DSSE-KMS avec une clé gérée par le client."
    - id: c
      text:
        en: "Use the Amazon S3 Encryption Client in the application with a KMS key as the wrapping key."
        fr: "Utiliser Amazon S3 Encryption Client dans l'application avec une clé KMS comme clé d'encapsulage."
    - id: d
      text:
        en: "Upload the records over an AWS Site-to-Site VPN connection to a bucket that uses SSE-S3."
        fr: "Charger les dossiers par une connexion AWS Site-to-Site VPN dans un compartiment qui utilise SSE-S3."
answer: { optionId: c }
explanation:
  correct:
    en: "With client-side encryption, data is encrypted locally before it is sent, and Amazon S3 receives and stores only ciphertext. The Amazon S3 Encryption Client encrypts each object with a unique data key during PutObject and decrypts it during GetObject; with a KMS key as the wrapping key, every use of the key is logged in CloudTrail."
    fr: "Avec le chiffrement côté client, les données sont chiffrées localement avant l'envoi, et Amazon S3 ne reçoit et ne stocke que du texte chiffré. Amazon S3 Encryption Client chiffre chaque objet avec une clé de données unique lors de PutObject et le déchiffre lors de GetObject ; avec une clé KMS comme clé d'encapsulage, chaque utilisation de la clé est journalisée dans CloudTrail."
  options:
    a:
      en: "With SSE-KMS, Amazon S3 receives the plaintext and encrypts it on the server side, which the regulation forbids."
      fr: "Avec SSE-KMS, Amazon S3 reçoit le texte en clair et le chiffre côté serveur, ce que la réglementation interdit."
    b:
      en: "DSSE-KMS is also server-side encryption: Amazon S3 handles the plaintext before it applies the two layers."
      fr: "DSSE-KMS est aussi un chiffrement côté serveur : Amazon S3 manipule le texte en clair avant d'appliquer les deux couches."
    d:
      en: "The VPN encrypts the network path only, and SSE-S3 keys are managed by Amazon S3, not in AWS KMS."
      fr: "Le VPN ne chiffre que le chemin réseau, et les clés SSE-S3 sont gérées par Amazon S3, pas dans AWS KMS."
references:
  - title: Protecting data by using client-side encryption - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingClientSideEncryption.html
