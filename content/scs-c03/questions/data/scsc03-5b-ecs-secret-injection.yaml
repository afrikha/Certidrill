id: scsc03-5b-ecs-secret-injection
objective: "5.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a containerized application on Amazon ECS with AWS Fargate. The application reads a database password from the DB_PASSWORD environment variable, and the code cannot be changed. The password must be stored in AWS Secrets Manager, encrypted with a customer managed key, and must not appear in plaintext in the task definition. After each monthly rotation, the operations team will force a new deployment of the service.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany exécute une application conteneurisée sur Amazon ECS avec AWS Fargate. L'application lit un mot de passe de base de données dans la variable d'environnement DB_PASSWORD, et le code ne peut pas être modifié. Le mot de passe doit être stocké dans AWS Secrets Manager, chiffré avec une clé gérée par le client, et ne doit pas apparaître en clair dans la définition de tâche. Après chaque rotation mensuelle, l'équipe d'exploitation forcera un nouveau déploiement du service.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "In the container definition, add a secrets entry named DB_PASSWORD whose valueFrom is the ARN of the secret."
        fr: "Dans la définition de conteneur, ajouter une entrée secrets nommée DB_PASSWORD dont la valeur valueFrom est l'ARN du secret."
    - id: b
      text:
        en: "In the container definition, add an environment entry named DB_PASSWORD whose value is the ARN of the secret."
        fr: "Dans la définition de conteneur, ajouter une entrée environment nommée DB_PASSWORD dont la valeur est l'ARN du secret."
    - id: c
      text:
        en: "Allow secretsmanager:GetSecretValue on the secret and kms:Decrypt on the customer managed key for the task execution role."
        fr: "Autoriser secretsmanager:GetSecretValue sur le secret et kms:Decrypt sur la clé gérée par le client pour le rôle d'exécution de tâche."
    - id: d
      text:
        en: "Allow secretsmanager:GetSecretValue on the secret and kms:Decrypt on the customer managed key for the task role only."
        fr: "Autoriser secretsmanager:GetSecretValue sur le secret et kms:Decrypt sur la clé gérée par le client pour le rôle de tâche uniquement."
    - id: e
      text:
        en: "In the valueFrom ARN, specify the AWSPENDING staging label so that each new task receives the newest password as soon as a rotation starts."
        fr: "Dans l'ARN de valueFrom, indiquer l'étiquette intermédiaire AWSPENDING pour que chaque nouvelle tâche reçoive le mot de passe le plus récent dès le début d'une rotation."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A secrets entry with valueFrom set to the secret ARN injects the value as an environment variable when the container starts, without storing it in the task definition. The injection is done with the task execution role, which needs permission to read the secret and to decrypt it with the customer managed key."
    fr: "Une entrée secrets dont valueFrom contient l'ARN du secret injecte la valeur comme variable d'environnement au démarrage du conteneur, sans la stocker dans la définition de tâche. L'injection est réalisée avec le rôle d'exécution de tâche, qui doit être autorisé à lire le secret et à le déchiffrer avec la clé gérée par le client."
  options:
    b:
      en: "An environment entry passes its value literally, so the application would receive the ARN instead of the password."
      fr: "Une entrée environment transmet sa valeur telle quelle : l'application recevrait l'ARN au lieu du mot de passe."
    d:
      en: "The task role is used by the application code; ECS uses the task execution role to retrieve secrets for injection."
      fr: "Le rôle de tâche est utilisé par le code de l'application ; ECS utilise le rôle d'exécution de tâche pour récupérer les secrets à injecter."
    e:
      en: "AWSPENDING marks a version that is still being created and tested; tasks must use the default AWSCURRENT version, which holds the credential that the database accepts."
      fr: "AWSPENDING désigne une version encore en cours de création et de test ; les tâches doivent utiliser la version AWSCURRENT par défaut, qui contient l'information d'identification acceptée par la base de données."
references:
  - title: Pass Secrets Manager secrets through Amazon ECS environment variables
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/secrets-envvar-secrets-manager.html
