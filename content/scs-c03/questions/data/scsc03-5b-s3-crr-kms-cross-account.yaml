id: scsc03-5b-s3-crr-kms-cross-account
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany stores objects encrypted with SSE-KMS and a customer managed key in a versioned Amazon S3 bucket in us-east-1. All objects must be replicated to a versioned bucket owned by a backup account in us-west-2. The replicas must be encrypted with a customer managed key that the backup account owns in us-west-2. The replication rule and the replication IAM role, which has s3:GetObjectVersionForReplication on the source objects and the replication permissions on the destination bucket, are already created in the source account, but no objects are replicated.

    Which configuration will meet these requirements?
  fr: |
    AnyCompany stocke des objets chiffrés avec SSE-KMS et une clé gérée par le client dans un compartiment (bucket) Amazon S3 versionné de us-east-1. Tous les objets doivent être répliqués vers un compartiment versionné appartenant à un compte de sauvegarde dans us-west-2. Les réplicas doivent être chiffrés avec une clé gérée par le client que le compte de sauvegarde possède dans us-west-2. La règle de réplication et le rôle IAM de réplication, qui dispose de s3:GetObjectVersionForReplication sur les objets source et des autorisations de réplication sur le compartiment de destination, sont déjà créés dans le compte source, mais aucun objet n'est répliqué.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable SseKmsEncryptedObjects in SourceSelectionCriteria, and set ReplicaKmsKeyID to the aws/s3 key of the backup account in us-west-2. Grant the role kms:Decrypt on the source key."
        fr: "Activer SseKmsEncryptedObjects dans SourceSelectionCriteria, et définir ReplicaKmsKeyID sur la clé aws/s3 du compte de sauvegarde dans us-west-2. Accorder au rôle kms:Decrypt sur la clé source."
    - id: b
      text:
        en: "Rely on the destination bucket's default encryption with the backup account's key. Grant the role kms:Decrypt on the source key and kms:Encrypt on that key, and allow the role in the destination key policy."
        fr: "S'appuyer sur le chiffrement par défaut du compartiment de destination avec la clé du compte de sauvegarde. Accorder au rôle kms:Decrypt sur la clé source et kms:Encrypt sur cette clé, et autoriser le rôle dans la politique de la clé de destination."
    - id: c
      text:
        en: "Enable SseKmsEncryptedObjects in SourceSelectionCriteria, and set ReplicaKmsKeyID to the backup account's key. Grant the role kms:Decrypt on the source key and kms:Encrypt on the destination key, and allow the role in the destination key policy."
        fr: "Activer SseKmsEncryptedObjects dans SourceSelectionCriteria, et définir ReplicaKmsKeyID sur la clé du compte de sauvegarde. Accorder au rôle kms:Decrypt sur la clé source et kms:Encrypt sur la clé de destination, et autoriser le rôle dans la politique de la clé de destination."
    - id: d
      text:
        en: "Set ReplicaKmsKeyID to the backup account's key without changing the rule's source selection. Grant the role kms:Encrypt on the destination key, and allow the role in the destination key policy."
        fr: "Définir ReplicaKmsKeyID sur la clé du compte de sauvegarde sans modifier la sélection des sources de la règle. Accorder au rôle kms:Encrypt sur la clé de destination, et autoriser le rôle dans la politique de la clé de destination."
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon S3 does not replicate SSE-KMS objects by default: the rule must opt in with SseKmsEncryptedObjects and name a destination key in the destination Region with ReplicaKmsKeyID. The role also needs kms:Decrypt on the source key and kms:Encrypt on the replica key, and for a cross-account key the key owner must allow the source role in the key policy."
    fr: "Amazon S3 ne réplique pas par défaut les objets SSE-KMS : la règle doit les inclure avec SseKmsEncryptedObjects et désigner une clé de destination dans la Région de destination avec ReplicaKmsKeyID. Le rôle a aussi besoin de kms:Decrypt sur la clé source et de kms:Encrypt sur la clé des réplicas, et pour une clé d'un autre compte, le propriétaire de la clé doit autoriser le rôle source dans la politique de clé."
  options:
    a:
      en: "AWS managed keys do not allow cross-account use, so cross-account replication of SSE-KMS data must use a customer managed key, which the requirement also asks for."
      fr: "Les clés gérées par AWS ne permettent pas d'utilisation entre comptes : la réplication entre comptes de données SSE-KMS doit utiliser une clé gérée par le client, ce que l'exigence demande aussi."
    b:
      en: "Without the SseKmsEncryptedObjects opt-in, SSE-KMS objects are not replicated, whatever the default encryption of the destination bucket."
      fr: "Sans l'inclusion SseKmsEncryptedObjects, les objets SSE-KMS ne sont pas répliqués, quel que soit le chiffrement par défaut du compartiment de destination."
    d:
      en: "The rule still does not opt in to SSE-KMS objects, and the role cannot read the source objects without kms:Decrypt on the source key."
      fr: "La règle n'inclut toujours pas les objets SSE-KMS, et le rôle ne peut pas lire les objets source sans kms:Decrypt sur la clé source."
references:
  - title: Replicating encrypted objects (SSE-S3, SSE-KMS, DSSE-KMS, SSE-C)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-config-for-kms-objects.html
