id: scsc03-5a-interface-endpoint-sg-timeout
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany created an interface VPC endpoint for AWS KMS with private DNS in a VPC that has no internet access. Amazon EC2 instances in the application subnets use a security group named app-sg that allows all outbound traffic. The endpoint network interfaces use a security group named endpoint-sg that has no inbound rules. The network ACLs allow all traffic. Every KMS call from the instances times out.

    Which change will fix the issue while following the principle of least privilege?
  fr: |
    AnyCompany a créé un point de terminaison de VPC d'interface pour AWS KMS avec DNS privé dans un VPC sans accès à Internet. Les instances Amazon EC2 des sous-réseaux d'application utilisent un groupe de sécurité nommé app-sg qui autorise tout le trafic sortant. Les interfaces réseau du point de terminaison utilisent un groupe de sécurité nommé endpoint-sg qui n'a aucune règle entrante. Les listes ACL réseau autorisent tout le trafic. Chaque appel KMS depuis les instances expire.

    Quelle modification corrige le problème en respectant le principe du moindre privilège ?
body:
  options:
    - id: a
      text:
        en: "Add an outbound rule to app-sg that allows TCP 443 to the CIDR blocks of the endpoint subnets."
        fr: "Ajouter à app-sg une règle sortante qui autorise TCP 443 vers les blocs CIDR des sous-réseaux du point de terminaison."
    - id: b
      text:
        en: "Replace the endpoint policy with a policy that allows kms:* for all principals on all resources."
        fr: "Remplacer la politique du point de terminaison par une politique qui autorise kms:* pour tous les principaux sur toutes les ressources."
    - id: c
      text:
        en: "Add an inbound rule to endpoint-sg that allows all traffic from 0.0.0.0/0."
        fr: "Ajouter à endpoint-sg une règle entrante qui autorise tout le trafic depuis 0.0.0.0/0."
    - id: d
      text:
        en: "Add an inbound rule to endpoint-sg that allows TCP 443 from app-sg."
        fr: "Ajouter à endpoint-sg une règle entrante qui autorise TCP 443 depuis app-sg."
answer: { optionId: d }
explanation:
  correct:
    en: "The security group of an interface endpoint must allow the expected traffic from the resources in the VPC, which for AWS API calls is inbound HTTPS on port 443. Referencing app-sg as the source limits access to the application instances."
    fr: "Le groupe de sécurité d'un point de terminaison d'interface doit autoriser le trafic attendu depuis les ressources du VPC, c'est-à-dire HTTPS entrant sur le port 443 pour les appels d'API AWS. Référencer app-sg comme source limite l'accès aux instances d'application."
  options:
    a:
      en: "app-sg already allows all outbound traffic; the connections are dropped by endpoint-sg, which has no inbound rule."
      fr: "app-sg autorise déjà tout le trafic sortant : les connexions sont rejetées par endpoint-sg, qui n'a aucune règle entrante."
    b:
      en: "An endpoint policy denial returns an access denied error, not a timeout, and this change would remove the restriction of the policy."
      fr: "Un refus de la politique de point de terminaison renvoie une erreur d'accès refusé, pas un délai d'expiration, et cette modification supprimerait la restriction de la politique."
    c:
      en: "This rule fixes the timeout but opens every port to any address, which is not least privilege."
      fr: "Cette règle corrige l'expiration mais ouvre tous les ports à toute adresse, ce qui ne respecte pas le moindre privilège."
references:
  - title: Access an AWS service using an interface VPC endpoint - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html
