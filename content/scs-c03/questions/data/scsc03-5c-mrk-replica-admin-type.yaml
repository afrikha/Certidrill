id: scsc03-5c-mrk-replica-admin-type
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's central key team manages multi-Region primary keys and single-Region keys in a shared security account. The operations team of each Region decommissions workloads and must be able to schedule and cancel the deletion of multi-Region replica keys. The operations teams must not be able to schedule the deletion of primary keys or of single-Region keys. The security team will add a condition to the IAM policy of the operations role.

    Which condition will meet these requirements?
  fr: |
    L'équipe centrale chargée des clés d'AnyCompany gère des clés principales multi-Régions et des clés à Région unique dans un compte de sécurité partagé. L'équipe d'exploitation de chaque Région met hors service des charges de travail et doit pouvoir planifier et annuler la suppression de clés de réplica multi-Régions. Les équipes d'exploitation ne doivent pas pouvoir planifier la suppression des clés principales ni des clés à Région unique. L'équipe de sécurité ajoutera une condition à la politique IAM du rôle d'exploitation.

    Quelle condition permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Allow kms:ScheduleKeyDeletion and kms:CancelKeyDeletion with a Bool condition that requires kms:MultiRegion to be true.
        fr: |-
          Autoriser kms:ScheduleKeyDeletion et kms:CancelKeyDeletion avec une condition Bool qui exige que kms:MultiRegion soit true.
    - id: b
      text:
        en: |-
          Allow kms:ScheduleKeyDeletion and kms:CancelKeyDeletion with a StringEquals condition that requires kms:ReplicaRegion to equal the team's Region.
        fr: |-
          Autoriser kms:ScheduleKeyDeletion et kms:CancelKeyDeletion avec une condition StringEquals qui exige que kms:ReplicaRegion soit égal à la Région de l'équipe.
    - id: c
      text:
        en: |-
          Allow kms:ScheduleKeyDeletion and kms:CancelKeyDeletion with a StringEquals condition that requires aws:RequestedRegion to equal the team's Region.
        fr: |-
          Autoriser kms:ScheduleKeyDeletion et kms:CancelKeyDeletion avec une condition StringEquals qui exige que aws:RequestedRegion soit égal à la Région de l'équipe.
    - id: d
      text:
        en: |-
          Allow kms:ScheduleKeyDeletion and kms:CancelKeyDeletion with a StringEquals condition that requires kms:MultiRegionKeyType to equal REPLICA.
        fr: |-
          Autoriser kms:ScheduleKeyDeletion et kms:CancelKeyDeletion avec une condition StringEquals qui exige que kms:MultiRegionKeyType soit égal à REPLICA.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The kms:MultiRegionKeyType condition key distinguishes multi-Region primary keys (PRIMARY) from replica keys (REPLICA) in any operation on an existing key. Allowing the deletion actions only when its value is REPLICA excludes both primary keys and single-Region keys, which have no multi-Region key type.
    fr: |-
      La clé de condition kms:MultiRegionKeyType distingue les clés principales multi-Régions (PRIMARY) des clés de réplica (REPLICA) dans toute opération sur une clé existante. N'autoriser les actions de suppression que lorsque sa valeur est REPLICA exclut à la fois les clés principales et les clés à Région unique, qui n'ont pas de type de clé multi-Région.
  options:
    a:
      en: |-
        kms:MultiRegion is true for primary keys as well as replica keys, so the operations teams could schedule the deletion of primary keys.
      fr: |-
        kms:MultiRegion vaut true aussi bien pour les clés principales que pour les clés de réplica : les équipes d'exploitation pourraient planifier la suppression de clés principales.
    b:
      en: |-
        kms:ReplicaRegion applies only to the kms:ReplicateKey permission and has no effect on other operations.
      fr: |-
        kms:ReplicaRegion ne s'applique qu'à l'autorisation kms:ReplicateKey et n'a aucun effet sur les autres opérations.
    c:
      en: |-
        A Region condition also matches the primary keys and single-Region keys that are located in the team's Region.
      fr: |-
        Une condition de Région correspond aussi aux clés principales et aux clés à Région unique situées dans la Région de l'équipe.
references:
  - title: Control access to multi-Region keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-auth.html
