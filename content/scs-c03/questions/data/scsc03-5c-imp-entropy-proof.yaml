id: scsc03-5c-imp-entropy-proof
objective: "5.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is moving a payments archive to Amazon S3 and will encrypt it with SSE-KMS. Its security policy requires the company to prove to auditors that every root encryption key was generated by the company's own on-premises HSM, from an entropy source that the company has certified. AWS KMS must manage the rest of the key lifecycle. The company does not want to operate any HSM or key manager in AWS, and AWS KMS must not depend on the data center for cryptographic operations.

    Which solution will meet these requirements?
  fr: |
    AnyCompany déplace une archive de paiements vers Amazon S3 et la chiffrera avec SSE-KMS. Sa politique de sécurité exige que l'entreprise puisse prouver aux auditeurs que chaque clé de chiffrement racine a été générée par son propre HSM sur site, à partir d'une source d'entropie que l'entreprise a certifiée. AWS KMS doit gérer le reste du cycle de vie des clés. L'entreprise ne veut exploiter aucun HSM ni aucun gestionnaire de clés dans AWS, et AWS KMS ne doit pas dépendre du centre de données pour les opérations de chiffrement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a symmetric customer managed key with key material generated by AWS KMS, and enable automatic key rotation on the key.
        fr: |-
          Créer une clé symétrique gérée par le client avec des éléments de clé générés par AWS KMS, et activer la rotation automatique de la clé.
    - id: b
      text:
        en: |-
          Create a symmetric customer managed key without key material (EXTERNAL origin), and import key material generated by the on-premises HSM.
        fr: |-
          Créer une clé symétrique gérée par le client sans éléments de clé (origine EXTERNAL), et importer des éléments de clé générés par le HSM sur site.
    - id: c
      text:
        en: |-
          Create an AWS CloudHSM key store backed by a new CloudHSM cluster, and create the symmetric KMS key in that key store.
        fr: |-
          Créer un magasin de clés AWS CloudHSM adossé à un nouveau cluster CloudHSM, et créer la clé KMS symétrique dans ce magasin de clés.
    - id: d
      text:
        en: |-
          Create an external key store that connects to the on-premises HSM, and create the symmetric KMS key in that key store.
        fr: |-
          Créer un magasin de clés externe connecté au HSM sur site, et créer la clé KMS symétrique dans ce magasin de clés.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Importing key material ("bring your own key") lets the company prove that the material came from a source of entropy that meets its requirements, while AWS KMS manages the lifecycle of the KMS key. After the import, AWS KMS uses its copy of the material in its own HSMs, so cryptographic operations do not call the data center.
    fr: |-
      L'importation d'éléments de clé (« bring your own key ») permet à l'entreprise de prouver que les éléments proviennent d'une source d'entropie conforme à ses exigences, tandis qu'AWS KMS gère le cycle de vie de la clé KMS. Après l'importation, AWS KMS utilise sa copie des éléments dans ses propres HSM : les opérations de chiffrement n'appellent pas le centre de données.
  options:
    a:
      en: |-
        AWS KMS generates the material in its own HSMs, so the company cannot show that the keys came from its certified on-premises entropy source.
      fr: |-
        AWS KMS génère les éléments dans ses propres HSM : l'entreprise ne peut pas montrer que les clés proviennent de sa source d'entropie certifiée sur site.
    c:
      en: |-
        A CloudHSM key store requires the company to operate a CloudHSM cluster in AWS, and the material is generated in that cluster, not in the on-premises HSM.
      fr: |-
        Un magasin de clés CloudHSM oblige l'entreprise à exploiter un cluster CloudHSM dans AWS, et les éléments sont générés dans ce cluster, pas dans le HSM sur site.
    d:
      en: |-
        With an external key store, every cryptographic operation goes through the external key store proxy to the on-premises key manager, so AWS KMS depends on the data center.
      fr: |-
        Avec un magasin de clés externe, chaque opération de chiffrement passe par le proxy du magasin de clés externe jusqu'au gestionnaire de clés sur site : AWS KMS dépend du centre de données.
references:
  - title: Importing key material for AWS KMS keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys.html
