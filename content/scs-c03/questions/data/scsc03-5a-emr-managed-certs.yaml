id: scsc03-5a-emr-managed-certs
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is creating Amazon EMR clusters with release 7.11.0 or later to run Apache Spark jobs on cardholder data. The security team requires TLS encryption for data exchanged between the cluster nodes and between the open-source application endpoints. The team does not want to create, package, or distribute certificates, but analysts must be able to add the CA certificate to the trust stores of their client tools.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany crée des clusters Amazon EMR avec la version 7.11.0 ou ultérieure pour exécuter des tâches Apache Spark sur des données de titulaires de carte. L'équipe de sécurité exige le chiffrement TLS des données échangées entre les nœuds du cluster et entre les points de terminaison des applications open source. L'équipe ne veut ni créer, ni empaqueter, ni distribuer de certificats, mais les analystes doivent pouvoir ajouter le certificat de l'autorité de certification aux magasins d'approbation de leurs outils clients.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Create PEM files for the private key and certificate chain, zip them in Amazon S3, and reference the .zip in a security configuration with in-transit encryption."
        fr: "Créer des fichiers PEM pour la clé privée et la chaîne de certificats, les compresser dans Amazon S3, et référencer le .zip dans une configuration de sécurité avec chiffrement en transit."
    - id: b
      text:
        en: "Implement the TLSArtifactsProvider interface in a custom Java class, and reference its JAR in a security configuration with in-transit encryption."
        fr: "Implémenter l'interface TLSArtifactsProvider dans une classe Java personnalisée, et référencer son JAR dans une configuration de sécurité avec chiffrement en transit."
    - id: c
      text:
        en: "Create a security configuration that enables in-transit encryption with certificates that Amazon EMR creates and manages, and use it for the clusters."
        fr: "Créer une configuration de sécurité qui active le chiffrement en transit avec des certificats créés et gérés par Amazon EMR, et l'utiliser pour les clusters."
    - id: d
      text:
        en: "Create a security configuration that enables local disk encryption and EBS encryption with a customer managed KMS key, and use it for the clusters."
        fr: "Créer une configuration de sécurité qui active le chiffrement des disques locaux et le chiffrement EBS avec une clé KMS gérée par le client, et l'utiliser pour les clusters."
answer: { optionId: c }
explanation:
  correct:
    en: "From release 7.11.0, an EMR security configuration can use certificates that Amazon EMR creates and manages for in-transit encryption. Amazon EMR uploads the PEM-encoded certificate of the CA it created to AWS Secrets Manager in the account, so analysts can add it to their trust stores, and the team handles no certificate files."
    fr: "À partir de la version 7.11.0, une configuration de sécurité EMR peut utiliser pour le chiffrement en transit des certificats créés et gérés par Amazon EMR. Amazon EMR charge dans AWS Secrets Manager du compte le certificat encodé PEM de l'autorité qu'il a créée : les analystes peuvent l'ajouter à leurs magasins d'approbation, et l'équipe ne manipule aucun fichier de certificat."
  options:
    a:
      en: "PEM files in a .zip work, but the team would have to create and package the certificates, which it wants to avoid."
      fr: "Des fichiers PEM dans un .zip fonctionnent, mais l'équipe devrait créer et empaqueter les certificats, ce qu'elle veut éviter."
    b:
      en: "A custom certificate provider requires writing and maintaining Java code that supplies the certificates, which adds the most work."
      fr: "Un fournisseur de certificats personnalisé exige d'écrire et de maintenir du code Java qui fournit les certificats, ce qui ajoute le plus de travail."
    d:
      en: "Local disk and EBS encryption protect data at rest on the nodes; they do not encrypt data exchanged between nodes."
      fr: "Le chiffrement des disques locaux et d'EBS protège les données au repos sur les nœuds : il ne chiffre pas les données échangées entre nœuds."
references:
  - title: Create keys and certificates for data encryption with Amazon EMR - Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-encryption-enable.html
  - title: Encryption options for Amazon EMR - Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-data-encryption-options.html
