id: scsc03-5a-msk-new-cluster-transit
objective: "5.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is creating an Amazon MSK provisioned cluster for payment events. The security team requires that producers and consumers send and receive data only over TLS, and that the data replicated between brokers also be encrypted in transit.

    Which combination of settings should the team choose when it creates the cluster? (Choose two.)
  fr: |
    AnyCompany crée un cluster Amazon MSK provisionné pour des événements de paiement. L'équipe de sécurité exige que les producteurs et les consommateurs n'envoient et ne reçoivent des données qu'en TLS, et que les données répliquées entre les brokers soient aussi chiffrées en transit.

    Quelle combinaison de paramètres l'équipe doit-elle choisir lors de la création du cluster ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Set the client-broker encryption setting to TLS."
        fr: "Définir le paramètre de chiffrement client-broker sur TLS."
    - id: b
      text:
        en: "Set the client-broker encryption setting to TLS_PLAINTEXT."
        fr: "Définir le paramètre de chiffrement client-broker sur TLS_PLAINTEXT."
    - id: c
      text:
        en: "Specify a customer managed KMS key for the encryption of data at rest."
        fr: "Spécifier une clé KMS gérée par le client pour le chiffrement des données au repos."
    - id: d
      text:
        en: "Leave in-cluster encryption enabled for the data exchanged between brokers."
        fr: "Laisser le chiffrement intra-cluster activé pour les données échangées entre les brokers."
    - id: e
      text:
        en: "Enable broker log delivery to Amazon CloudWatch Logs."
        fr: "Activer la livraison des journaux des brokers vers Amazon CloudWatch Logs."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The client-broker setting TLS accepts only TLS-encrypted data from clients, and it is the default. In-cluster encryption, which protects data between brokers, is enabled by default, and that default can be overridden when the cluster is created, so it must be left on."
    fr: "Le paramètre client-broker TLS n'accepte que des données chiffrées TLS de la part des clients, et c'est la valeur par défaut. Le chiffrement intra-cluster, qui protège les données entre brokers, est activé par défaut, et cette valeur peut être modifiée à la création du cluster : il doit donc rester activé."
  options:
    b:
      en: "TLS_PLAINTEXT accepts both TLS and plaintext data, so clients could still send data in clear text."
      fr: "TLS_PLAINTEXT accepte des données TLS et en clair : les clients pourraient toujours envoyer des données en clair."
    c:
      en: "MSK always encrypts data at rest; choosing a customer managed key changes the key, not the encryption in transit."
      fr: "MSK chiffre toujours les données au repos : choisir une clé gérée par le client change la clé, pas le chiffrement en transit."
    e:
      en: "Broker logs help with troubleshooting and auditing, but they do not encrypt any traffic."
      fr: "Les journaux des brokers aident au dépannage et à l'audit, mais ils ne chiffrent aucun trafic."
references:
  - title: Amazon MSK encryption - Amazon Managed Streaming for Apache Kafka
    url: https://docs.aws.amazon.com/msk/latest/developerguide/msk-encryption.html
