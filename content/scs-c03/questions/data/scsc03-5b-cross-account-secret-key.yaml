id: scsc03-5b-cross-account-secret-key
objective: "5.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A secret named billing-api in account 111111111111 stores an API key for a payment partner. The secret is encrypted with the AWS managed key aws/secretsmanager and has the following resource policy. A role named Reporting in account 222222222222 has an identity policy that allows secretsmanager:GetSecretValue on the secret's ARN and kms:Decrypt on all keys. Calls from the role still fail. The company wants least privilege.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Effect": "Allow",
        "Principal": { "AWS": "arn:aws:iam::222222222222:role/Reporting" },
        "Action": "secretsmanager:GetSecretValue",
        "Resource": "*"
      }]
    }
    ```

    Which solution will allow the Reporting role to read the secret?
  fr: |
    Un secret nommé billing-api dans le compte 111111111111 stocke une clé d'API pour un partenaire de paiement. Le secret est chiffré avec la clé gérée par AWS aws/secretsmanager et possède la politique de ressource suivante. Un rôle nommé Reporting dans le compte 222222222222 dispose d'une politique basée sur l'identité qui autorise secretsmanager:GetSecretValue sur l'ARN du secret et kms:Decrypt sur toutes les clés. Les appels du rôle échouent toujours. L'entreprise veut appliquer le moindre privilège.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Effect": "Allow",
        "Principal": { "AWS": "arn:aws:iam::222222222222:role/Reporting" },
        "Action": "secretsmanager:GetSecretValue",
        "Resource": "*"
      }]
    }
    ```

    Quelle solution permet au rôle Reporting de lire le secret ?
body:
  options:
    - id: a
      text:
        en: "Add a statement to the aws/secretsmanager key policy in account 111111111111 that allows kms:Decrypt for the Reporting role."
        fr: "Ajouter à la politique de la clé aws/secretsmanager du compte 111111111111 une instruction qui autorise kms:Decrypt pour le rôle Reporting."
    - id: b
      text:
        en: "Replicate the secret to account 222222222222, and grant the Reporting role access to the replica."
        fr: "Répliquer le secret dans le compte 222222222222, et accorder au rôle Reporting l'accès au réplica."
    - id: c
      text:
        en: "Re-encrypt the secret with a customer managed key in account 111111111111 whose key policy allows kms:Decrypt for the Reporting role."
        fr: "Rechiffrer le secret avec une clé gérée par le client du compte 111111111111 dont la politique de clé autorise kms:Decrypt pour le rôle Reporting."
    - id: d
      text:
        en: "Change the Principal in the resource policy to the root of account 222222222222 so that every principal in that account can call GetSecretValue."
        fr: "Remplacer le Principal de la politique de ressource par la racine du compte 222222222222 pour que tous les principaux de ce compte puissent appeler GetSecretValue."
answer: { optionId: c }
explanation:
  correct:
    en: "Cross-account access to a secret needs the resource policy, the identity policy and permission to use the KMS key that encrypts the secret. The AWS managed key aws/secretsmanager cannot be used for cross-account access, so the secret must use a customer managed key whose key policy allows kms:Decrypt for the external role."
    fr: "L'accès entre comptes à un secret exige la politique de ressource, la politique basée sur l'identité et l'autorisation d'utiliser la clé KMS qui chiffre le secret. La clé gérée par AWS aws/secretsmanager ne peut pas être utilisée pour un accès entre comptes : le secret doit utiliser une clé gérée par le client dont la politique de clé autorise kms:Decrypt pour le rôle externe."
  options:
    a:
      en: "The key policy of an AWS managed key cannot be changed, so it cannot grant access to another account."
      fr: "La politique d'une clé gérée par AWS ne peut pas être modifiée : elle ne peut pas accorder l'accès à un autre compte."
    b:
      en: "Secrets Manager replicates secrets to other Regions of the same account, not to other accounts."
      fr: "Secrets Manager réplique les secrets vers d'autres Régions du même compte, pas vers d'autres comptes."
    d:
      en: "The failure is caused by the KMS key, not by the principal, and trusting the whole account widens access and breaks least privilege."
      fr: "L'échec vient de la clé KMS, pas du principal, et faire confiance à tout le compte élargit l'accès et enfreint le moindre privilège."
references:
  - title: Access AWS Secrets Manager secrets from a different account
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access_examples_cross.html
