id: scsc03-5c-imp-scp-delete-material
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an organization in AWS Organizations. Production accounts encrypt data with symmetric customer managed KMS keys. Some keys use key material generated by AWS KMS, and others use imported key material. An SCP denies kms:ScheduleKeyDeletion, kms:DisableKey, and kms:PutKeyPolicy to every principal except a KeyAdmin role. During a red-team exercise, a compromised administrator role made the data protected by the keys with imported material unreadable within seconds. The keys with AWS-generated material were not affected.

    Which action should the security team add to the deny statement of the SCP?
  fr: |
    AnyCompany dispose d'une organisation dans AWS Organizations. Les comptes de production chiffrent des données avec des clés KMS symétriques gérées par le client. Certaines clés utilisent des éléments de clé générés par AWS KMS, d'autres des éléments de clé importés. Une SCP refuse kms:ScheduleKeyDeletion, kms:DisableKey et kms:PutKeyPolicy à tous les principaux sauf un rôle KeyAdmin. Lors d'un exercice de red team, un rôle d'administrateur compromis a rendu illisibles en quelques secondes les données protégées par les clés avec des éléments importés. Les clés avec des éléments générés par AWS n'ont pas été affectées.

    Quelle action l'équipe de sécurité doit-elle ajouter à l'instruction de refus de la SCP ?
body:
  options:
    - id: a
      text: kms:RevokeGrant
    - id: b
      text: kms:DisableKeyRotation
    - id: c
      text: kms:GetParametersForImport
    - id: d
      text: kms:DeleteImportedKeyMaterial
answer: { optionId: d }
explanation:
  correct:
    en: |-
      DeleteImportedKeyMaterial removes imported material from a key immediately, with no waiting period, and the key enters the PendingImport state, so every request that needs the key fails. The operation exists only for keys with imported material, which explains why the keys with AWS-generated material were not affected. Denying it outside the KeyAdmin role closes this path.
    fr: |-
      DeleteImportedKeyMaterial retire immédiatement les éléments importés d'une clé, sans période d'attente, et la clé passe à l'état PendingImport : toute requête qui a besoin de la clé échoue. L'opération n'existe que pour les clés avec des éléments importés, ce qui explique que les clés avec des éléments générés par AWS n'aient pas été affectées. La refuser en dehors du rôle KeyAdmin ferme ce chemin.
  options:
    a:
      en: |-
        Revoking grants affects keys of both origins in the same way and removes only the permissions given by grants, not the use of the key through its key policy.
      fr: |-
        La révocation d'octrois affecte de la même manière les clés des deux origines et ne retire que les autorisations données par des octrois, pas l'utilisation de la clé au moyen de sa politique de clé.
    b:
      en: |-
        Disabling rotation never makes a key unusable; the key keeps using its current key material.
      fr: |-
        La désactivation de la rotation ne rend jamais une clé inutilisable ; la clé continue d'utiliser ses éléments de clé actuels.
    c:
      en: |-
        GetParametersForImport only downloads a wrapping public key and an import token; it does not change the key or its material.
      fr: |-
        GetParametersForImport télécharge seulement une clé publique d'encapsulation et un jeton d'importation ; il ne modifie ni la clé ni ses éléments.
references:
  - title: Delete imported key material - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-delete-key-material.html
