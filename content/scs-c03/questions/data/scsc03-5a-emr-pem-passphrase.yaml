id: scsc03-5a-emr-pem-passphrase
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's security team creates a security configuration for Amazon EMR 6.15.0 clusters in us-west-2. In-transit encryption uses a .zip file in Amazon S3 that contains privateKey.pem, certificateChain.pem, and trustedCertificates.pem. The certificate was issued by the company's private CA with the common name *.us-west-2.compute.internal. The private key was exported from the CA tooling in PKCS#8 format protected with a PBES2 passphrase. The EC2 instance profile of the cluster can read the .zip file. New clusters that use the security configuration fail to start.

    Which action will fix the issue?
  fr: |
    L'équipe de sécurité d'AnyCompany crée une configuration de sécurité pour des clusters Amazon EMR 6.15.0 dans us-west-2. Le chiffrement en transit utilise un fichier .zip dans Amazon S3 qui contient privateKey.pem, certificateChain.pem et trustedCertificates.pem. Le certificat a été émis par l'autorité de certification privée de l'entreprise avec le nom commun *.us-west-2.compute.internal. La clé privée a été exportée depuis l'outil de l'autorité au format PKCS#8, protégée par une phrase secrète PBES2. Le profil d'instance EC2 du cluster peut lire le fichier .zip. Les nouveaux clusters qui utilisent la configuration de sécurité ne démarrent pas.

    Quelle action corrige le problème ?
body:
  options:
    - id: a
      text:
        en: "Rename the files in the .zip to key.pem, chain.pem, and truststore.pem, and upload the new .zip file."
        fr: "Renommer les fichiers du .zip en key.pem, chain.pem et truststore.pem, et charger le nouveau fichier .zip."
    - id: b
      text:
        en: "Remove the passphrase from the private key, rebuild and upload the .zip file, and create the clusters again."
        fr: "Retirer la phrase secrète de la clé privée, reconstruire et charger le fichier .zip, puis recréer les clusters."
    - id: c
      text:
        en: "Issue a new certificate with the common name *.ec2.internal, and replace certificateChain.pem in the .zip file."
        fr: "Émettre un nouveau certificat avec le nom commun *.ec2.internal, et remplacer certificateChain.pem dans le fichier .zip."
    - id: d
      text:
        en: "Add a core-site classification that sets hadoop.ssl.hostname.verifier to ALLOW_ALL when creating the clusters."
        fr: "Ajouter une classification core-site qui définit hadoop.ssl.hostname.verifier sur ALLOW_ALL lors de la création des clusters."
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EMR does not support private keys protected with a passphrase (PBES1 or PBES2): a cluster that receives such a key fails to start. Removing the passphrase, for example with openssl rsa, and uploading the rebuilt .zip fixes the issue. The file names and the wildcard common name for us-west-2 are already correct."
    fr: "Amazon EMR ne prend pas en charge les clés privées protégées par une phrase secrète (PBES1 ou PBES2) : un cluster qui reçoit une telle clé ne démarre pas. Retirer la phrase secrète, par exemple avec openssl rsa, et charger le .zip reconstruit corrige le problème. Les noms de fichiers et le nom commun générique pour us-west-2 sont déjà corrects."
  options:
    a:
      en: "Amazon EMR expects exactly the names privateKey.pem, certificateChain.pem, and trustedCertificates.pem, which the .zip already uses."
      fr: "Amazon EMR attend exactement les noms privateKey.pem, certificateChain.pem et trustedCertificates.pem, que le .zip utilise déjà."
    c:
      en: "*.ec2.internal is the internal domain of us-east-1; in us-west-2, the wildcard *.us-west-2.compute.internal is the right one."
      fr: "*.ec2.internal est le domaine interne de us-east-1 ; dans us-west-2, le nom générique *.us-west-2.compute.internal est le bon."
    d:
      en: "ALLOW_ALL is needed only when the certificate's common name has no wildcard, and it does not make an encrypted private key usable."
      fr: "ALLOW_ALL n'est nécessaire que lorsque le nom commun du certificat n'a pas de caractère générique, et il ne rend pas utilisable une clé privée chiffrée."
references:
  - title: Create keys and certificates for data encryption with Amazon EMR - Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-encryption-enable.html
