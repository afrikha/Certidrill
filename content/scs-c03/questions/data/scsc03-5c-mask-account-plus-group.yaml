id: scsc03-5c-mask-account-plus-group
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's account has an account-level CloudWatch Logs data protection policy that audits and masks email addresses. The HR team also created a log group-level data protection policy on the log group /hr/payroll. That policy audits and masks US driver's license numbers and a custom data identifier named EmployeeId, which matches EmployeeId- followed by nine digits. A payroll clerk who does not have the logs:Unmask permission reads new log events in /hr/payroll.

    Which values are masked for the clerk?
  fr: |
    Le compte d'AnyCompany dispose d'une politique de protection des données CloudWatch Logs au niveau du compte qui audite et masque les adresses e-mail. L'équipe RH a aussi créé une politique de protection des données au niveau du groupe de journaux /hr/payroll. Cette politique audite et masque les numéros de permis de conduire américains et un identifiant de données personnalisé nommé EmployeeId, qui correspond à EmployeeId- suivi de neuf chiffres. Un gestionnaire de paie qui ne dispose pas de l'autorisation logs:Unmask lit les nouveaux événements de journal de /hr/payroll.

    Quelles valeurs sont masquées pour le gestionnaire de paie ?
body:
  options:
    - id: a
      text:
        en: |-
          Only the driver's license numbers and employee IDs, because the log group-level policy replaces the account-level policy for that log group.
        fr: |-
          Uniquement les numéros de permis de conduire et les identifiants d'employé, car la politique du groupe de journaux remplace la politique du compte pour ce groupe de journaux.
    - id: b
      text:
        en: |-
          The email addresses, driver's license numbers, and employee IDs, because both policies apply to the log group.
        fr: |-
          Les adresses e-mail, les numéros de permis de conduire et les identifiants d'employé, car les deux politiques s'appliquent au groupe de journaux.
    - id: c
      text:
        en: |-
          Only the email addresses, because the account-level policy takes precedence over every log group-level policy.
        fr: |-
          Uniquement les adresses e-mail, car la politique au niveau du compte est prioritaire sur toutes les politiques au niveau des groupes de journaux.
    - id: d
      text:
        en: |-
          Only the email addresses and driver's license numbers, because custom data identifiers are ignored in a log group that is covered by an account-level policy.
        fr: |-
          Uniquement les adresses e-mail et les numéros de permis de conduire, car les identifiants de données personnalisés sont ignorés dans un groupe de journaux couvert par une politique au niveau du compte.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When an account-level policy and a log group-level policy both exist, both apply to the log group, and every data identifier listed in either policy is audited and masked. Custom data identifiers in a log group-level policy work in combination with those of the account-level policy, like managed data identifiers.
    fr: |-
      Quand une politique au niveau du compte et une politique au niveau du groupe de journaux existent, les deux s'appliquent au groupe de journaux, et chaque identifiant de données listé dans l'une ou l'autre est audité et masqué. Les identifiants de données personnalisés d'une politique de groupe de journaux fonctionnent en combinaison avec ceux de la politique du compte, comme les identifiants gérés.
  options:
    a:
      en: |-
        A log group-level policy does not replace the account-level policy; the identifiers of both policies apply.
      fr: |-
        Une politique au niveau du groupe de journaux ne remplace pas la politique au niveau du compte ; les identifiants des deux politiques s'appliquent.
    c:
      en: |-
        There is no precedence between the two levels; the identifiers of the log group-level policy are also audited and masked.
      fr: |-
        Il n'existe aucune priorité entre les deux niveaux ; les identifiants de la politique du groupe de journaux sont aussi audités et masqués.
    d:
      en: |-
        Custom data identifiers can be used at both levels, and those of the two policies work in combination.
      fr: |-
        Les identifiants de données personnalisés peuvent être utilisés aux deux niveaux, et ceux des deux politiques fonctionnent en combinaison.
references:
