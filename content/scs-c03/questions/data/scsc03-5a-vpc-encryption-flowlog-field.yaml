id: scsc03-5a-vpc-encryption-flowlog-field
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany enabled VPC Encryption Controls in monitor mode on a production VPC. The VPC already publishes flow logs to Amazon CloudWatch Logs in the default format. Before it switches to enforce mode, the security team wants to see which flows between resources are unencrypted, encrypted by the Nitro System, or encrypted by the application.

    Which solution will meet this requirement?
  fr: |
    AnyCompany a activé VPC Encryption Controls en mode surveillance (monitor) sur un VPC de production. Le VPC publie déjà des journaux de flux dans Amazon CloudWatch Logs au format par défaut. Avant de passer en mode application (enforce), l'équipe de sécurité veut voir quels flux entre ressources sont non chiffrés, chiffrés par le système Nitro ou chiffrés par l'application.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text:
        en: "Query the existing flow log group with CloudWatch Logs Insights and filter on the encryption-status field."
        fr: "Interroger le groupe de journaux de flux existant avec CloudWatch Logs Insights et filtrer sur le champ encryption-status."
    - id: b
      text:
        en: "Run Network Access Analyzer with a scope that matches the paths between the VPC's subnets."
        fr: "Exécuter Network Access Analyzer avec une étendue qui correspond aux chemins entre les sous-réseaux du VPC."
    - id: c
      text:
        en: "Create a flow log with a custom format that includes ${encryption-status}, ${traffic-path}, and ${flow-direction}, and look for the value 0."
        fr: "Créer un journal de flux au format personnalisé qui inclut ${encryption-status}, ${traffic-path} et ${flow-direction}, et rechercher la valeur 0."
    - id: d
      text:
        en: "Enable VPC Traffic Mirroring on the instances' network interfaces, and inspect the captured packets for TLS handshakes."
        fr: "Activer la mise en miroir du trafic VPC sur les interfaces réseau des instances, et rechercher des négociations TLS dans les paquets capturés."
answer: { optionId: c }
explanation:
  correct:
    en: "The encryption-status field reports 0 for unencrypted, 1 for Nitro-encrypted, 2 for application-encrypted, and 3 for both. Existing flow logs do not include it automatically, so a flow log with a custom format that adds the field is needed; AWS recommends also including traffic-path and flow-direction."
    fr: "Le champ encryption-status vaut 0 pour non chiffré, 1 pour chiffré par Nitro, 2 pour chiffré par l'application et 3 pour les deux. Les journaux de flux existants ne l'incluent pas automatiquement : il faut un journal de flux au format personnalisé qui ajoute ce champ, et AWS recommande d'inclure aussi traffic-path et flow-direction."
  options:
    a:
      en: "Flow logs in the default format do not contain the encryption-status field, so there is nothing to filter on."
      fr: "Les journaux de flux au format par défaut ne contiennent pas le champ encryption-status : il n'y a rien sur quoi filtrer."
    b:
      en: "Network Access Analyzer finds unintended network paths from the configuration; it does not report whether traffic is encrypted."
      fr: "Network Access Analyzer détecte des chemins réseau non souhaités à partir de la configuration : il n'indique pas si le trafic est chiffré."
    d:
      en: "Traffic Mirroring captures packets but cannot see Nitro encryption, and analyzing captures adds a lot of work compared with the flow log field."
      fr: "La mise en miroir du trafic capture des paquets mais ne voit pas le chiffrement Nitro, et l'analyse des captures demande beaucoup plus de travail que le champ des journaux de flux."
references:
  - title: Enforce VPC encryption in transit - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-encryption-controls.html
