id: scsc03-5a-endpoint-service-approved
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany provides a fraud-scoring API to 15 partner companies. The API runs behind a Network Load Balancer in AnyCompany's VPC. Several partners use the same private CIDR ranges as AnyCompany. The API must not be reachable from the internet, only the 15 partner AWS accounts may request a connection, and the security team must approve each new connection before traffic can flow.

    Which solution will meet these requirements?
  fr: |
    AnyCompany fournit une API d'évaluation de la fraude à 15 entreprises partenaires. L'API s'exécute derrière un Network Load Balancer dans le VPC d'AnyCompany. Plusieurs partenaires utilisent les mêmes plages CIDR privées qu'AnyCompany. L'API ne doit pas être accessible depuis Internet, seuls les 15 comptes AWS partenaires peuvent demander une connexion, et l'équipe de sécurité doit approuver chaque nouvelle connexion avant que le trafic puisse circuler.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a VPC endpoint service for the NLB, add the 15 partner account ARNs as allowed principals, and turn on acceptance required."
        fr: "Créer un service de point de terminaison de VPC pour le NLB, ajouter les ARN des 15 comptes partenaires comme principaux autorisés, et activer l'acceptation obligatoire."
    - id: b
      text:
        en: "Create a VPC endpoint service for the NLB, allow all principals with the * value, and turn on acceptance required."
        fr: "Créer un service de point de terminaison de VPC pour le NLB, autoriser tous les principaux avec la valeur *, et activer l'acceptation obligatoire."
    - id: c
      text:
        en: "Create a VPC endpoint service for the NLB, add the 15 partner account ARNs as allowed principals, and turn off acceptance required."
        fr: "Créer un service de point de terminaison de VPC pour le NLB, ajouter les ARN des 15 comptes partenaires comme principaux autorisés, et désactiver l'acceptation obligatoire."
    - id: d
      text:
        en: "Share a transit gateway with the partner accounts through AWS RAM, and accept each VPC attachment request manually."
        fr: "Partager une passerelle de transit avec les comptes partenaires par AWS RAM, et accepter manuellement chaque demande d'attachement de VPC."
answer: { optionId: a }
explanation:
  correct:
    en: "AWS PrivateLink presents the NLB service as interface endpoints in the partners' VPCs, so overlapping CIDR ranges do not matter and nothing is exposed to the internet. Allowed principals limit who can create endpoints for the service, and acceptance required keeps each connection request pending until the provider accepts it."
    fr: "AWS PrivateLink présente le service du NLB sous forme de points de terminaison d'interface dans les VPC des partenaires : les plages CIDR qui se chevauchent n'ont pas d'importance et rien n'est exposé à Internet. Les principaux autorisés limitent qui peut créer des points de terminaison pour le service, et l'acceptation obligatoire garde chaque demande de connexion en attente jusqu'à ce que le fournisseur l'accepte."
  options:
    b:
      en: "With *, principals in any AWS account could request a connection, not only the 15 partners."
      fr: "Avec *, des principaux de n'importe quel compte AWS pourraient demander une connexion, pas seulement les 15 partenaires."
    c:
      en: "Without acceptance required, connection requests from allowed principals are accepted automatically, with no approval step."
      fr: "Sans acceptation obligatoire, les demandes de connexion des principaux autorisés sont acceptées automatiquement, sans étape d'approbation."
    d:
      en: "A transit gateway routes between VPC CIDR ranges, so the overlapping ranges would conflict, and it gives network access beyond the API."
      fr: "Une passerelle de transit route entre les plages CIDR des VPC : les plages qui se chevauchent seraient en conflit, et elle donne un accès réseau au-delà de l'API."
references:
  - title: Configure an endpoint service - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/configure-endpoint-service.html
