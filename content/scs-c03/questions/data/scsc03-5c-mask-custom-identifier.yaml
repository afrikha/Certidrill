id: scsc03-5c-mask-custom-identifier
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's applications write internal customer reference numbers, in the format CUST- followed by 10 digits, to many CloudWatch Logs log groups. No managed data identifier detects this format. The security team must mask these values in every log group of the account, including log groups that are created later, and must be able to count how many log events contain them.

    Which solution will meet these requirements?
  fr: |
    Les applications d'AnyCompany écrivent des numéros de référence client internes, au format CUST- suivi de 10 chiffres, dans de nombreux groupes de journaux CloudWatch Logs. Aucun identifiant de données géré ne détecte ce format. L'équipe de sécurité doit masquer ces valeurs dans tous les groupes de journaux du compte, y compris ceux qui seront créés plus tard, et doit pouvoir compter le nombre d'événements de journal qui les contiennent.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon Macie custom data identifier with the regular expression CUST-\d{10}, and run a Macie sensitive data discovery job on the log groups.
        fr: |-
          Créer un identifiant de données personnalisé Amazon Macie avec l'expression régulière CUST-\d{10}, et exécuter une tâche de découverte de données sensibles Macie sur les groupes de journaux.
    - id: b
      text:
        en: |-
          Create a metric filter that matches CUST- on each log group, and create a CloudWatch alarm on the metric of each filter to count the affected events.
        fr: |-
          Créer sur chaque groupe de journaux un filtre de métrique qui correspond à CUST-, et créer une alarme CloudWatch sur la métrique de chaque filtre pour compter les événements concernés.
    - id: c
      text:
        en: |-
          Define a custom data identifier with the regular expression CUST-\d{10} in an account-level data protection policy, and reference it only in the Audit statement.
        fr: |-
          Définir un identifiant de données personnalisé avec l'expression régulière CUST-\d{10} dans une politique de protection des données au niveau du compte, et ne le référencer que dans l'instruction Audit.
    - id: d
      text:
        en: |-
          Define a custom data identifier with the regular expression CUST-\d{10} in an account-level data protection policy, and reference it in the Audit and Deidentify statements.
        fr: |-
          Définir un identifiant de données personnalisé avec l'expression régulière CUST-\d{10} dans une politique de protection des données au niveau du compte, et le référencer dans les instructions Audit et Deidentify.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Custom data identifiers (up to 10 per policy, each regular expression up to 200 characters) are declared in the Configuration block and referenced like managed identifiers. An account-level policy applies to existing and future log groups. The Audit statement increments the LogEventsWithFindings metric, and the Deidentify statement, whose identifiers must match the Audit statement, masks the values.
    fr: |-
      Les identifiants de données personnalisés (jusqu'à 10 par politique, chaque expression régulière étant limitée à 200 caractères) sont déclarés dans le bloc Configuration et référencés comme les identifiants gérés. Une politique au niveau du compte s'applique aux groupes de journaux existants et futurs. L'instruction Audit incrémente la métrique LogEventsWithFindings, et l'instruction Deidentify, dont les identifiants doivent correspondre à ceux de l'instruction Audit, masque les valeurs.
  options:
    a:
      en: |-
        Macie analyzes objects in Amazon S3, not CloudWatch Logs log groups, and it reports sensitive data without masking it.
      fr: |-
        Macie analyse des objets dans Amazon S3, pas des groupes de journaux CloudWatch Logs, et il signale les données sensibles sans les masquer.
    b:
      en: |-
        Metric filters count matches but do not mask anything, and they must be created again for every new log group.
      fr: |-
        Les filtres de métrique comptent les correspondances mais ne masquent rien, et ils doivent être recréés pour chaque nouveau groupe de journaux.
    c:
      en: |-
        The Audit statement only reports findings; masking is done by the Deidentify statement, whose DataIdentifier array must exactly match the one of the Audit statement.
      fr: |-
        L'instruction Audit ne fait que signaler des résultats ; le masquage est effectué par l'instruction Deidentify, dont le tableau DataIdentifier doit correspondre exactement à celui de l'instruction Audit.
references:
  - title: Custom data identifiers - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL-custom-data-identifiers.html
  - title: Create an account-wide data protection policy - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data-accountlevel.html
