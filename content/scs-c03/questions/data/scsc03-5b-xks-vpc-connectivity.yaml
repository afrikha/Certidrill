id: scsc03-5b-xks-vpc-connectivity
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank must encrypt data in Amazon S3 and Amazon EBS with keys whose key material never leaves an HSM in its own data center ("hold your own key"). The bank runs an external key store proxy on premises, and its data center connects to a VPC in the same Region through AWS Direct Connect. Requests from AWS KMS to the proxy must not travel over the internet, and the proxy must not have a public endpoint.

    Which solution will meet these requirements?
  fr: |
    Une banque doit chiffrer des données dans Amazon S3 et Amazon EBS avec des clés dont les éléments de clé ne quittent jamais un HSM de son propre centre de données (« hold your own key »). La banque exécute sur site un proxy de magasin de clés externe, et son centre de données est connecté à un VPC de la même Région par AWS Direct Connect. Les requêtes d'AWS KMS vers le proxy ne doivent pas transiter par Internet, et le proxy ne doit pas avoir de point de terminaison public.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an external key store with public endpoint connectivity, and allow only the AWS KMS IP address ranges to reach the proxy in the data center firewall."
        fr: "Créer un magasin de clés externe avec une connectivité par point de terminaison public, et n'autoriser que les plages d'adresses IP d'AWS KMS à joindre le proxy dans le pare-feu du centre de données."
    - id: b
      text:
        en: "Create an AWS CloudHSM key store with a cluster in the VPC, and synchronize the cluster with the on-premises HSM over the Direct Connect connection."
        fr: "Créer un magasin de clés AWS CloudHSM avec un cluster dans le VPC, et synchroniser le cluster avec le HSM sur site par la connexion Direct Connect."
    - id: c
      text:
        en: "Create KMS keys with an EXTERNAL origin, import the key material from the on-premises HSM, and then delete the key material from the HSM after import."
        fr: "Créer des clés KMS d'origine EXTERNAL, importer les éléments de clé depuis le HSM sur site, puis supprimer les éléments de clé du HSM après l'importation."
    - id: d
      text:
        en: "Create an external key store with VPC endpoint service connectivity, backed by an endpoint service in the VPC that reaches the on-premises proxy over Direct Connect."
        fr: "Créer un magasin de clés externe avec une connectivité par service de point de terminaison VPC, adossée à un service de point de terminaison du VPC qui joint le proxy sur site par Direct Connect."
answer: { optionId: d }
explanation:
  correct:
    en: "With VPC endpoint service connectivity, AWS KMS sends requests to an Amazon VPC endpoint service that the customer creates and maintains, so traffic does not use a public proxy endpoint. The external key manager keeps the key material, which never leaves it, and data is double encrypted with AWS KMS key material and the external key."
    fr: "Avec la connectivité par service de point de terminaison VPC, AWS KMS envoie les requêtes à un service de point de terminaison Amazon VPC que le client crée et gère : le trafic n'utilise pas de point de terminaison public du proxy. Le gestionnaire de clés externe conserve les éléments de clé, qui ne le quittent jamais, et les données sont doublement chiffrées avec les éléments de clé AWS KMS et la clé externe."
  options:
    a:
      en: "With public endpoint connectivity, AWS KMS sends requests to the proxy over the internet, which the requirements forbid."
      fr: "Avec la connectivité par point de terminaison public, AWS KMS envoie les requêtes au proxy par Internet, ce que les exigences interdisent."
    b:
      en: "In a CloudHSM key store, AWS KMS generates the key material in the CloudHSM cluster in AWS, not in the bank's own HSM."
      fr: "Dans un magasin de clés CloudHSM, AWS KMS génère les éléments de clé dans le cluster CloudHSM d'AWS, pas dans le HSM de la banque."
    c:
      en: "Imported key material is stored and used by AWS KMS, so a copy of the key material leaves the bank's HSM."
      fr: "Des éléments de clé importés sont stockés et utilisés par AWS KMS : une copie des éléments de clé quitte le HSM de la banque."
references:
  - title: External key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-external.html
