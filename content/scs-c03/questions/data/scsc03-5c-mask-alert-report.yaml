id: scsc03-5c-mask-alert-report
objective: "5.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has a CloudWatch Logs data protection policy on the log group /payments/api that audits and masks credit card numbers. The security team wants an alarm within minutes when log events that contain card numbers are ingested. Auditors also want, for each affected log event, a record of which data identifiers matched and at which character positions, stored in Amazon S3.

    Which two actions should the security team take? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany dispose d'une politique de protection des données CloudWatch Logs sur le groupe de journaux /payments/api qui audite et masque les numéros de carte de crédit. L'équipe de sécurité veut une alarme en quelques minutes lorsque des événements de journal contenant des numéros de carte sont ingérés. Les auditeurs veulent aussi, pour chaque événement de journal concerné, un enregistrement des identifiants de données qui ont correspondu et des positions de caractères, stocké dans Amazon S3.

    Quelles sont les deux actions que l'équipe de sécurité doit effectuer ? (Choisissez-en deux.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a metric filter that matches 16-digit numbers on the log group, and create a CloudWatch alarm on the metric of the filter.
        fr: |-
          Créer sur le groupe de journaux un filtre de métrique qui correspond aux nombres à 16 chiffres, et créer une alarme CloudWatch sur la métrique du filtre.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on the LogEventsWithFindings metric that CloudWatch Logs publishes in the AWS/Logs namespace.
        fr: |-
          Créer une alarme CloudWatch sur la métrique LogEventsWithFindings que CloudWatch Logs publie dans l'espace de noms AWS/Logs.
    - id: c
      text:
        en: |-
          Enable Amazon Macie automated sensitive data discovery, and select the log group as a resource to analyze.
        fr: |-
          Activer la découverte automatisée des données sensibles d'Amazon Macie, et sélectionner le groupe de journaux comme ressource à analyser.
    - id: d
      text:
        en: |-
          Add an existing S3 bucket as the findings destination in the FindingsDestination object of the policy's Audit statement.
        fr: |-
          Ajouter un compartiment S3 existant comme destination des résultats dans l'objet FindingsDestination de l'instruction Audit de la politique.
    - id: e
      text:
        en: |-
          Add a subscription filter that sends the log events to an Amazon Data Firehose stream that writes them to an S3 bucket for the auditors.
        fr: |-
          Ajouter un filtre d'abonnement qui envoie les événements de journal à un flux Amazon Data Firehose qui les écrit dans un compartiment S3 pour les auditeurs.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      The Audit operation increments the LogEventsWithFindings metric (one per log event that contains sensitive data), which can drive a CloudWatch alarm. With an S3 bucket in FindingsDestination, CloudWatch Logs writes one findings report per affected log event, with the name and count of each data identifier and the start and end positions of each detection.
    fr: |-
      L'opération Audit incrémente la métrique LogEventsWithFindings (une fois par événement de journal contenant des données sensibles), qui peut déclencher une alarme CloudWatch. Avec un compartiment S3 dans FindingsDestination, CloudWatch Logs écrit un rapport de résultats par événement de journal concerné, avec le nom et le nombre de chaque identifiant de données et les positions de début et de fin de chaque détection.
  options:
    a:
      en: |-
        Sensitive data is masked at metric filters too, so a filter that looks for card numbers does not match the masked values.
      fr: |-
        Les données sensibles sont aussi masquées pour les filtres de métrique : un filtre qui recherche des numéros de carte ne correspond pas aux valeurs masquées.
    c:
      en: |-
        Macie discovers sensitive data in Amazon S3 objects; it does not analyze CloudWatch Logs log groups or produce the per-event audit findings.
      fr: |-
        Macie découvre des données sensibles dans des objets Amazon S3 ; il n'analyse pas les groupes de journaux CloudWatch Logs et ne produit pas les résultats d'audit par événement.
    e:
      en: |-
        Subscription filters receive masked log events, not findings reports, so the auditors would get neither the matched identifiers nor the positions.
      fr: |-
        Les filtres d'abonnement reçoivent des événements de journal masqués, et non des rapports de résultats : les auditeurs n'obtiendraient ni les identifiants correspondants ni les positions.
references:
  - title: Audit findings reports - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data-audit-findings.html
  - title: Understanding data protection policies - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/cloudwatch-logs-data-protection-policies.html
