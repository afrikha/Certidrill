id: scsc03-5a-opensearch-https-tls-policy
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an Amazon OpenSearch Service domain that ingests application logs from agents on premises and in AWS. A security scan shows that the domain endpoint accepts requests over plain HTTP and accepts TLS 1.0 handshakes. The company must reject requests that do not use HTTPS and require TLS 1.2 or later on the domain endpoint.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite un domaine Amazon OpenSearch Service qui ingère les journaux d'applications envoyés par des agents sur site et dans AWS. Une analyse de sécurité montre que le point de terminaison du domaine accepte des requêtes en HTTP simple et accepte des négociations TLS 1.0. L'entreprise doit rejeter les requêtes qui n'utilisent pas HTTPS et exiger TLS 1.2 ou une version ultérieure sur le point de terminaison du domaine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable node-to-node encryption on the domain, and enable fine-grained access control."
        fr: "Activer le chiffrement de nœud à nœud sur le domaine, et activer le contrôle d'accès précis."
    - id: b
      text:
        en: "In the domain endpoint options, require HTTPS for all traffic and set the TLS security policy to Policy-Min-TLS-1-2-2019-07."
        fr: "Dans les options de point de terminaison du domaine, exiger HTTPS pour tout le trafic et définir la politique de sécurité TLS sur Policy-Min-TLS-1-2-2019-07."
    - id: c
      text:
        en: "Move the domain to VPC access, and allow only inbound TCP 443 in the domain's security group."
        fr: "Passer le domaine en accès VPC, et n'autoriser que le trafic entrant TCP 443 dans le groupe de sécurité du domaine."
    - id: d
      text:
        en: "Enable encryption at rest with a customer managed KMS key, and restrict the domain access policy to the agents' IAM roles."
        fr: "Activer le chiffrement au repos avec une clé KMS gérée par le client, et restreindre la politique d'accès du domaine aux rôles IAM des agents."
answer: { optionId: b }
explanation:
  correct:
    en: "The domain endpoint options control client connections: requiring HTTPS rejects plain HTTP requests, and the TLSSecurityPolicy setting sets the minimum TLS version that the endpoint negotiates. Policy-Min-TLS-1-2-2019-07 refuses TLS 1.0 and TLS 1.1."
    fr: "Les options de point de terminaison du domaine contrôlent les connexions des clients : exiger HTTPS rejette les requêtes en HTTP simple, et le paramètre TLSSecurityPolicy fixe la version TLS minimale négociée par le point de terminaison. Policy-Min-TLS-1-2-2019-07 refuse TLS 1.0 et TLS 1.1."
  options:
    a:
      en: "Node-to-node encryption protects traffic between the nodes of the domain, not the connections from clients to the endpoint."
      fr: "Le chiffrement de nœud à nœud protège le trafic entre les nœuds du domaine, pas les connexions des clients au point de terminaison."
    c:
      en: "A security group filters ports and sources, not protocols or TLS versions, so the endpoint would still negotiate TLS 1.0."
      fr: "Un groupe de sécurité filtre des ports et des sources, pas des protocoles ni des versions TLS : le point de terminaison négocierait toujours TLS 1.0."
    d:
      en: "Encryption at rest and the access policy do not change which protocols or TLS versions the endpoint accepts."
      fr: "Le chiffrement au repos et la politique d'accès ne changent pas les protocoles ni les versions TLS acceptés par le point de terminaison."
references:
  - title: Infrastructure Security in Amazon OpenSearch Service - Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/infrastructure-security.html
