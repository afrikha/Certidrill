id: scsc03-5a-client-vpn-saml-groups
objective: "5.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany gives remote employees access to a VPC through AWS Client VPN. The current endpoint uses mutual authentication with client certificates only, and a single authorization rule allows all users to reach 10.0.0.0/16. The security team wants engineers to reach only the engineering subnet 10.0.16.0/20 and finance staff to reach only the finance subnet 10.0.32.0/20, based on the users' group membership in the company's SAML 2.0 identity provider.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany donne aux employés à distance l'accès à un VPC par AWS Client VPN. Le point de terminaison actuel utilise uniquement l'authentification mutuelle avec des certificats clients, et une seule règle d'autorisation permet à tous les utilisateurs d'atteindre 10.0.0.0/16. L'équipe de sécurité veut que les ingénieurs n'atteignent que le sous-réseau d'ingénierie 10.0.16.0/20 et que le personnel financier n'atteigne que le sous-réseau financier 10.0.32.0/20, en fonction de l'appartenance des utilisateurs aux groupes du fournisseur d'identité SAML 2.0 de l'entreprise.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Apply one security group per user group to the target network associations of the Client VPN endpoint."
        fr: "Appliquer un groupe de sécurité par groupe d'utilisateurs aux associations de réseau cible du point de terminaison Client VPN."
    - id: b
      text:
        en: "Use a Client VPN endpoint with federated (SAML-based) authentication through the identity provider, which sends each user's groups in a SAML attribute."
        fr: "Utiliser un point de terminaison Client VPN avec authentification fédérée (SAML) par le fournisseur d'identité, qui envoie les groupes de chaque utilisateur dans un attribut SAML."
    - id: c
      text:
        en: "Keep mutual authentication only, and issue the client certificates of each team from a different subordinate CA."
        fr: "Conserver l'authentification mutuelle seule, et émettre les certificats clients de chaque équipe depuis une autorité de certification subordonnée différente."
    - id: d
      text:
        en: "Enable split-tunnel on the Client VPN endpoint so that only traffic for the VPC CIDR range goes through the VPN."
        fr: "Activer le tunnel partagé (split-tunnel) sur le point de terminaison Client VPN pour que seul le trafic destiné à la plage CIDR du VPC passe par le VPN."
    - id: e
      text:
        en: "Replace the authorization rule with one rule per subnet, each limited to the access group ID of the matching identity provider group."
        fr: "Remplacer la règle d'autorisation par une règle par sous-réseau, chacune limitée à l'ID de groupe d'accès du groupe correspondant du fournisseur d'identité."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Group-based authorization needs a user-based authentication method: with SAML federated authentication, the group ID of an authorization rule matches the SAML attribute value that carries the user's group membership. One rule per destination network with the matching group ID gives each team access only to its subnet, and access is denied by default."
    fr: "L'autorisation par groupe exige une méthode d'authentification basée sur l'utilisateur : avec l'authentification fédérée SAML, l'ID de groupe d'une règle d'autorisation correspond à la valeur de l'attribut SAML qui porte l'appartenance de l'utilisateur. Une règle par réseau de destination avec l'ID de groupe correspondant ne donne à chaque équipe que l'accès à son sous-réseau, et l'accès est refusé par défaut."
  options:
    a:
      en: "Security groups on the target network associations apply to all client connections of the endpoint; they cannot distinguish users or groups."
      fr: "Les groupes de sécurité des associations de réseau cible s'appliquent à toutes les connexions clientes du point de terminaison : ils ne distinguent ni les utilisateurs ni les groupes."
    c:
      en: "Certificate-based authentication does not provide identity provider group membership, so authorization rules cannot be scoped to the teams."
      fr: "L'authentification par certificat ne fournit pas l'appartenance aux groupes du fournisseur d'identité : les règles d'autorisation ne peuvent pas être limitées aux équipes."
    d:
      en: "Split-tunnel changes which client traffic uses the VPN; it does not restrict which subnets a user may reach."
      fr: "Le tunnel partagé change le trafic client qui passe par le VPN : il ne restreint pas les sous-réseaux qu'un utilisateur peut atteindre."
references:
  - title: AWS Client VPN authorization rules - AWS Client VPN
    url: https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/cvpn-working-rules.html
  - title: Client authentication in AWS Client VPN - AWS Client VPN
    url: https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/client-authentication.html
