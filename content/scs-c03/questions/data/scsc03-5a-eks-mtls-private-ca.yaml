id: scsc03-5a-eks-mtls-private-ca
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs microservices on Amazon EKS with managed node groups of M7i instances in one VPC. Pod-to-pod traffic between nodes is already encrypted by the Nitro System. A new requirement says that each service must also authenticate the services it calls with X.509 certificates issued by a private CA whose keys are protected in HSMs, and that workload certificates be renewed automatically.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des microservices sur Amazon EKS avec des groupes de nœuds gérés d'instances M7i dans un VPC. Le trafic de pod à pod entre nœuds est déjà chiffré par le système Nitro. Une nouvelle exigence impose que chaque service authentifie aussi les services qu'il appelle avec des certificats X.509 émis par une autorité de certification privée dont les clés sont protégées dans des HSM, et que les certificats des charges de travail soient renouvelés automatiquement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use cert-manager with an AWS Private CA issuer to issue and renew workload certificates, and enable mTLS between services with a service mesh such as Istio."
        fr: "Utiliser cert-manager avec un émetteur AWS Private CA pour émettre et renouveler les certificats des charges de travail, et activer le mTLS entre services avec un maillage de services comme Istio."
    - id: b
      text:
        en: "Associate a customer managed KMS key with the cluster for envelope encryption of Kubernetes secrets and other API data."
        fr: "Associer au cluster une clé KMS gérée par le client pour le chiffrement d'enveloppe des secrets Kubernetes et des autres données d'API."
    - id: c
      text:
        en: "Use security groups for pods so that each service accepts traffic only from the security groups of the services allowed to call it."
        fr: "Utiliser des groupes de sécurité pour les pods afin que chaque service n'accepte que le trafic des groupes de sécurité des services autorisés à l'appeler."
    - id: d
      text:
        en: "Request public ACM certificates for each service name, and expose each service through its own internal Application Load Balancer."
        fr: "Demander des certificats ACM publics pour chaque nom de service, et exposer chaque service par son propre Application Load Balancer interne."
answer: { optionId: a }
explanation:
  correct:
    en: "Nitro encryption protects the traffic but does not identify workloads. cert-manager with AWS Private CA distributes, renews, and revokes workload certificates, and AWS Private CA keeps its private keys in FIPS 140-2 Level 3 HSMs. A service mesh such as Istio or Linkerd then enforces mutual TLS between the services."
    fr: "Le chiffrement Nitro protège le trafic mais n'identifie pas les charges de travail. cert-manager avec AWS Private CA distribue, renouvelle et révoque les certificats des charges de travail, et AWS Private CA conserve ses clés privées dans des HSM FIPS 140-2 niveau 3. Un maillage de services comme Istio ou Linkerd applique ensuite le TLS mutuel entre les services."
  options:
    b:
      en: "Envelope encryption protects Kubernetes API data at rest in etcd; it does not authenticate service-to-service calls."
      fr: "Le chiffrement d'enveloppe protège les données de l'API Kubernetes au repos dans etcd : il n'authentifie pas les appels entre services."
    c:
      en: "Security groups filter traffic by network source; they do not use certificates to prove the identity of the calling service."
      fr: "Les groupes de sécurité filtrent le trafic selon la source réseau : ils n'utilisent pas de certificats pour prouver l'identité du service appelant."
    d:
      en: "Public certificates are not from a private CA, and a load balancer in front of each service authenticates the server only, not the calling service."
      fr: "Des certificats publics ne proviennent pas d'une autorité privée, et un équilibreur de charge devant chaque service n'authentifie que le serveur, pas le service appelant."
references:
  - title: Network security - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/best-practices/network-security.html
