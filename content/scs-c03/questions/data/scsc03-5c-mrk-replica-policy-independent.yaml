id: scsc03-5c-mrk-replica-policy-independent
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team created a multi-Region primary key in us-east-1 and replicated it to us-west-2 with the ReplicateKey API, without specifying a key policy. Later, the team added a statement to the primary key's key policy that allows the OrdersApp role to use the key for Encrypt and Decrypt. The application works in us-east-1, but in us-west-2 AWS KMS returns AccessDeniedException. No IAM policy in the account grants KMS permissions.

    What should the team do so that the application works in us-west-2?
  fr: |
    L'équipe de sécurité d'AnyCompany a créé une clé principale multi-Région dans us-east-1 et l'a répliquée dans us-west-2 avec l'API ReplicateKey, sans spécifier de politique de clé. Plus tard, l'équipe a ajouté à la politique de la clé principale une instruction qui autorise le rôle OrdersApp à utiliser la clé pour Encrypt et Decrypt. L'application fonctionne dans us-east-1, mais dans us-west-2 AWS KMS renvoie AccessDeniedException. Aucune politique IAM du compte n'accorde d'autorisations KMS.

    Que doit faire l'équipe pour que l'application fonctionne dans us-west-2 ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the same statement for the OrdersApp role to the key policy of the replica key in us-west-2.
        fr: |-
          Ajouter la même instruction pour le rôle OrdersApp à la politique de la clé de réplica dans us-west-2.
    - id: b
      text:
        en: |-
          Call ReplicateKey again for us-west-2 so that AWS KMS copies the current key policy of the primary key to the replica key.
        fr: |-
          Appeler de nouveau ReplicateKey pour us-west-2 afin qu'AWS KMS copie la politique de clé actuelle de la clé principale vers la clé de réplica.
    - id: c
      text:
        en: |-
          Wait for AWS KMS to synchronize the shared properties of the multi-Region key, which include the key policy, to the replica key.
        fr: |-
          Attendre qu'AWS KMS synchronise vers la clé de réplica les propriétés partagées de la clé multi-Région, qui incluent la politique de clé.
    - id: d
      text:
        en: |-
          Create a grant on the primary key for the OrdersApp role, because grants on a primary key also apply to its replica keys.
        fr: |-
          Créer un octroi sur la clé principale pour le rôle OrdersApp, car les octrois d'une clé principale s'appliquent aussi à ses clés de réplica.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Each multi-Region key is an independent KMS key with its own key policy. Key policies are not shared properties: AWS KMS does not copy or synchronize them, so a change to the primary key's policy does not reach the replica, which still has the default key policy. The statement must be added to the replica's key policy.
    fr: |-
      Chaque clé multi-Région est une clé KMS indépendante avec sa propre politique de clé. Les politiques de clé ne sont pas des propriétés partagées : AWS KMS ne les copie ni ne les synchronise, si bien qu'une modification de la politique de la clé principale n'atteint pas le réplica, qui a toujours la politique de clé par défaut. L'instruction doit être ajoutée à la politique de clé du réplica.
  options:
    b:
      en: |-
        A Region can hold only one replica of a primary key, so ReplicateKey returns AlreadyExistsException, and it never synchronizes key policies.
      fr: |-
        Une Région ne peut contenir qu'un seul réplica d'une clé principale : ReplicateKey renvoie AlreadyExistsException, et il ne synchronise jamais les politiques de clé.
    c:
      en: |-
        Shared properties include the key ID, key material, key spec, key usage, and rotation settings, but not the key policy.
      fr: |-
        Les propriétés partagées incluent l'ID de clé, les éléments de clé, la spécification de clé, l'utilisation de la clé et les paramètres de rotation, mais pas la politique de clé.
    d:
      en: |-
        Grants are Regional and each grant allows permissions to a single KMS key, even when the keys are related multi-Region keys.
      fr: |-
        Les octrois sont régionaux et chaque octroi accorde des autorisations sur une seule clé KMS, même quand les clés sont des clés multi-Régions associées.
references:
  - title: Control access to multi-Region keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-auth.html
  - title: ReplicateKey - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_ReplicateKey.html
