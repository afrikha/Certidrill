id: scsc03-5c-acm-cloudfront-alb-regions
objective: "5.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany serves www.example.com through an Amazon CloudFront distribution. The origin is an Application Load Balancer in eu-west-1 with the host name origin.example.com. Traffic from viewers to CloudFront and from CloudFront to the load balancer must use HTTPS with public ACM certificates that ACM renews automatically.

    Which solution will meet these requirements?
  fr: |
    AnyCompany sert www.example.com au moyen d'une distribution Amazon CloudFront. L'origine est un Application Load Balancer dans eu-west-1 dont le nom d'hôte est origin.example.com. Le trafic des utilisateurs vers CloudFront et de CloudFront vers l'équilibreur de charge doit utiliser HTTPS avec des certificats ACM publics qu'ACM renouvelle automatiquement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Request one ACM certificate for both names in eu-west-1, and associate it with the distribution and with the load balancer's HTTPS listener.
        fr: |-
          Demander un seul certificat ACM pour les deux noms dans eu-west-1, et l'associer à la distribution et à l'écouteur HTTPS de l'équilibreur de charge.
    - id: b
      text:
        en: |-
          Request one ACM certificate for both names in us-east-1, and associate it with the distribution and with the load balancer's HTTPS listener.
        fr: |-
          Demander un seul certificat ACM pour les deux noms dans us-east-1, et l'associer à la distribution et à l'écouteur HTTPS de l'équilibreur de charge.
    - id: c
      text:
        en: |-
          Request a certificate for www.example.com in us-east-1 for the distribution, and request a certificate for origin.example.com in eu-west-1 for the load balancer.
        fr: |-
          Demander un certificat pour www.example.com dans us-east-1 pour la distribution, et demander un certificat pour origin.example.com dans eu-west-1 pour l'équilibreur de charge.
    - id: d
      text:
        en: |-
          Request one ACM certificate for both names in us-east-1, and copy the certificate to eu-west-1 for the load balancer's HTTPS listener.
        fr: |-
          Demander un seul certificat ACM pour les deux noms dans us-east-1, et copier le certificat dans eu-west-1 pour l'écouteur HTTPS de l'équilibreur de charge.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      ACM certificates are Regional resources. A certificate used by CloudFront must be requested in US East (N. Virginia), while a load balancer uses a certificate from its own Region, so the load balancer in eu-west-1 needs a certificate requested there. Both are ACM-issued certificates that ACM renews.
    fr: |-
      Les certificats ACM sont des ressources régionales. Un certificat utilisé par CloudFront doit être demandé dans USA Est (Virginie du Nord), tandis qu'un équilibreur de charge utilise un certificat de sa propre Région : l'équilibreur de charge de eu-west-1 a besoin d'un certificat demandé dans cette Région. Les deux sont des certificats émis par ACM, qu'ACM renouvelle.
  options:
    a:
      en: |-
        CloudFront accepts only ACM certificates from us-east-1, so a certificate in eu-west-1 cannot be associated with the distribution.
      fr: |-
        CloudFront n'accepte que des certificats ACM de us-east-1 : un certificat de eu-west-1 ne peut pas être associé à la distribution.
    b:
      en: |-
        A load balancer in eu-west-1 cannot use an ACM certificate from us-east-1; each Region needs its own certificate.
      fr: |-
        Un équilibreur de charge de eu-west-1 ne peut pas utiliser un certificat ACM de us-east-1 ; chaque Région a besoin de son propre certificat.
    d:
      en: |-
        ACM certificates cannot be copied between Regions; a certificate must be requested, and its domains validated, in each Region.
      fr: |-
        Les certificats ACM ne peuvent pas être copiés entre Régions ; un certificat doit être demandé, et ses domaines validés, dans chaque Région.
references:
  - title: Requirements for using SSL/TLS certificates with CloudFront - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html
  - title: Supported Regions - AWS Certificate Manager
    url: https://docs.aws.amazon.com/acm/latest/userguide/acm-regions.html
