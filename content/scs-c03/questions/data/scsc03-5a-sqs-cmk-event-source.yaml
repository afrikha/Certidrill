id: scsc03-5a-sqs-cmk-event-source
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany sends Amazon S3 event notifications from a bucket named example-uploads to an Amazon SQS queue in the same account. A new rule requires that the queue be encrypted at rest with a KMS key whose key policy the company controls and whose use appears in AWS CloudTrail. After the team configured SSE-KMS on the queue with the AWS managed key aws/sqs, the event notifications stopped arriving.

    Which solution will meet the requirement and restore the notifications?
  fr: |
    AnyCompany envoie des notifications d'événements Amazon S3 d'un compartiment nommé example-uploads vers une file d'attente Amazon SQS du même compte. Une nouvelle règle exige que la file d'attente soit chiffrée au repos avec une clé KMS dont l'entreprise contrôle la politique de clé et dont l'utilisation apparaît dans AWS CloudTrail. Après que l'équipe a configuré SSE-KMS sur la file d'attente avec la clé gérée par AWS aws/sqs, les notifications d'événements n'arrivent plus.

    Quelle solution répond à l'exigence et rétablit les notifications ?
body:
  options:
    - id: a
      text:
        en: "Keep aws/sqs, and add a statement to the queue access policy that allows the s3.amazonaws.com service principal to call sqs:SendMessage."
        fr: "Garder aws/sqs, et ajouter à la politique d'accès de la file d'attente une instruction qui autorise le principal de service s3.amazonaws.com à appeler sqs:SendMessage."
    - id: b
      text:
        en: "Switch the queue to SSE-SQS, which uses encryption keys managed by Amazon SQS."
        fr: "Passer la file d'attente à SSE-SQS, qui utilise des clés de chiffrement gérées par Amazon SQS."
    - id: c
      text:
        en: "Keep aws/sqs, and allow kms:Decrypt on it in the IAM policy of the application role that reads the queue."
        fr: "Garder aws/sqs, et autoriser kms:Decrypt sur cette clé dans la politique IAM du rôle de l'application qui lit la file d'attente."
    - id: d
      text:
        en: "Use a customer managed key whose key policy allows s3.amazonaws.com kms:GenerateDataKey and kms:Decrypt with an aws:SourceArn condition for the bucket."
        fr: "Utiliser une clé gérée par le client dont la politique de clé autorise s3.amazonaws.com à kms:GenerateDataKey et kms:Decrypt avec une condition aws:SourceArn pour le compartiment."
answer: { optionId: d }
explanation:
  correct:
    en: "An AWS service that sends messages to an SSE-KMS queue needs kms:GenerateDataKey and kms:Decrypt in the key policy. The key policy of the AWS managed key for Amazon SQS cannot be modified, so the queue must use a customer managed key with a statement for s3.amazonaws.com; an aws:SourceArn condition limits it to the bucket to prevent the confused deputy problem."
    fr: "Un service AWS qui envoie des messages à une file d'attente SSE-KMS a besoin de kms:GenerateDataKey et kms:Decrypt dans la politique de clé. La politique de la clé gérée par AWS pour Amazon SQS ne peut pas être modifiée : la file d'attente doit utiliser une clé gérée par le client avec une instruction pour s3.amazonaws.com ; une condition aws:SourceArn la limite au compartiment pour éviter le problème de l'adjoint confus (confused deputy)."
  options:
    a:
      en: "Allowing sqs:SendMessage in the queue policy is necessary but not enough: Amazon S3 still cannot use aws/sqs, whose key policy cannot be changed to allow the service."
      fr: "Autoriser sqs:SendMessage dans la politique de la file d'attente est nécessaire mais pas suffisant : Amazon S3 ne peut toujours pas utiliser aws/sqs, dont la politique de clé ne peut pas être modifiée pour autoriser le service."
    b:
      en: "SSE-SQS keys are managed by Amazon SQS, so the company has no key policy to control and no KMS key usage in CloudTrail."
      fr: "Les clés SSE-SQS sont gérées par Amazon SQS : l'entreprise n'a aucune politique de clé à contrôler et aucune utilisation de clé KMS dans CloudTrail."
    c:
      en: "The consumer's permissions do not help the producer: Amazon S3 is the principal that cannot use the key to encrypt the messages."
      fr: "Les autorisations du consommateur n'aident pas le producteur : c'est Amazon S3 qui ne peut pas utiliser la clé pour chiffrer les messages."
references:
  - title: Amazon SQS Key management - Amazon Simple Queue Service
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-key-management.html
