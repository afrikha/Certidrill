id: scsc03-5a-s3-vpcsourceip-subnets
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's data VPC (10.40.0.0/16) has one S3 gateway endpoint that many workloads use. The policy of a bucket that holds cardholder data already denies every request that does not come through this endpoint. The security team must restrict the bucket further so that only workloads in the two cardholder data subnets, 10.40.8.0/24 and 10.40.9.0/24, can use it. The team does not want to create another endpoint or change the route tables.

    Which additional bucket policy statement will meet this requirement?
  fr: |
    Le VPC de données d'AnyCompany (10.40.0.0/16) possède un point de terminaison de passerelle S3 utilisé par de nombreuses charges de travail. La politique d'un compartiment qui contient des données de titulaires de carte refuse déjà toute requête qui ne passe pas par ce point de terminaison. L'équipe de sécurité doit restreindre davantage le compartiment pour que seules les charges de travail des deux sous-réseaux de données de cartes, 10.40.8.0/24 et 10.40.9.0/24, puissent l'utiliser. L'équipe ne veut ni créer un autre point de terminaison ni modifier les tables de routage.

    Quelle instruction supplémentaire de politique de compartiment répond à cette exigence ?
body:
  options:
    - id: a
      text:
        en: "Deny s3:* for all principals with a NotIpAddress condition on aws:VpcSourceIp that lists 10.40.8.0/24 and 10.40.9.0/24."
        fr: "Refuser s3:* pour tous les principaux avec une condition NotIpAddress sur aws:VpcSourceIp qui liste 10.40.8.0/24 et 10.40.9.0/24."
    - id: b
      text:
        en: "Deny s3:* for all principals with a NotIpAddress condition on aws:SourceIp that lists 10.40.8.0/24 and 10.40.9.0/24."
        fr: "Refuser s3:* pour tous les principaux avec une condition NotIpAddress sur aws:SourceIp qui liste 10.40.8.0/24 et 10.40.9.0/24."
    - id: c
      text:
        en: "Deny s3:* for all principals with a StringNotEquals condition on aws:SourceVpc that matches the ID of the data VPC."
        fr: "Refuser s3:* pour tous les principaux avec une condition StringNotEquals sur aws:SourceVpc qui correspond à l'ID du VPC de données."
    - id: d
      text:
        en: "Allow s3:* for all principals with an IpAddress condition on aws:VpcSourceIp that lists 10.40.8.0/24 and 10.40.9.0/24."
        fr: "Autoriser s3:* pour tous les principaux avec une condition IpAddress sur aws:VpcSourceIp qui liste 10.40.8.0/24 et 10.40.9.0/24."
answer: { optionId: a }
explanation:
  correct:
    en: "For requests that traverse a VPC endpoint, the private source address is available in aws:VpcSourceIp. A Deny with NotIpAddress on that key and the two subnet ranges rejects requests from every other subnet that shares the endpoint, and it adds to the existing aws:SourceVpce restriction."
    fr: "Pour les requêtes qui passent par un point de terminaison de VPC, l'adresse source privée est disponible dans aws:VpcSourceIp. Un Deny avec NotIpAddress sur cette clé et les deux plages de sous-réseaux rejette les requêtes de tous les autres sous-réseaux qui partagent le point de terminaison, en plus de la restriction aws:SourceVpce existante."
  options:
    b:
      en: "aws:SourceIp cannot be used for requests that traverse a VPC endpoint, so this statement would deny the cardholder data workloads as well."
      fr: "aws:SourceIp n'est pas utilisable pour les requêtes qui passent par un point de terminaison de VPC : cette instruction refuserait aussi les charges de travail des données de cartes."
    c:
      en: "aws:SourceVpc identifies the whole VPC, so every subnet that uses the endpoint would keep access."
      fr: "aws:SourceVpc identifie le VPC entier : tous les sous-réseaux qui utilisent le point de terminaison conserveraient l'accès."
    d:
      en: "An Allow statement does not remove the access that principals already get through their IAM policies from the other subnets."
      fr: "Une instruction Allow ne retire pas l'accès que les principaux obtiennent déjà par leurs politiques IAM depuis les autres sous-réseaux."
references:
  - title: Gateway endpoints for Amazon S3 - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html
  - title: Controlling access from VPC endpoints with bucket policies - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html
