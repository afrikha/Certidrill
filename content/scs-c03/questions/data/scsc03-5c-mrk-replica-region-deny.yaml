id: scsc03-5c-mrk-replica-region-deny
objective: "5.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany, a European insurer, creates a multi-Region customer managed key in eu-west-1 for client-side encryption of claim files. The key has the default key policy, which allows IAM policies in the account to grant access to the key. Data residency rules allow replicas of this key only in eu-central-1 and eu-south-2. Platform engineers must be able to replicate the key into those Regions. The security team wants a control on the key itself that prevents replication into any other Region, even if IAM policies in the account are later broadened.

    Which statement should the security team add to the key policy?
  fr: |
    AnyCompany, un assureur européen, crée une clé multi-Région gérée par le client dans eu-west-1 pour le chiffrement côté client de dossiers de sinistres. La clé a la politique de clé par défaut, qui permet aux politiques IAM du compte d'accorder l'accès à la clé. Les règles de résidence des données n'autorisent les réplicas de cette clé que dans eu-central-1 et eu-south-2. Les ingénieurs de plateforme doivent pouvoir répliquer la clé dans ces Régions. L'équipe de sécurité veut un contrôle sur la clé elle-même qui empêche toute réplication dans une autre Région, même si les politiques IAM du compte sont élargies plus tard.

    Quelle instruction l'équipe de sécurité doit-elle ajouter à la politique de clé ?
body:
  options:
    - id: a
      text:
        en: |-
          An Allow statement for the platform engineers' role and the kms:ReplicateKey action, with a StringEquals condition on kms:ReplicaRegion that lists eu-central-1 and eu-south-2.
        fr: |-
          Une instruction Allow pour le rôle des ingénieurs de plateforme et l'action kms:ReplicateKey, avec une condition StringEquals sur kms:ReplicaRegion qui liste eu-central-1 et eu-south-2.
    - id: b
      text:
        en: |-
          A Deny statement for all principals and the kms:CreateKey action, with a StringNotEquals condition on aws:RequestedRegion that lists eu-central-1 and eu-south-2.
        fr: |-
          Une instruction Deny pour tous les principaux et l'action kms:CreateKey, avec une condition StringNotEquals sur aws:RequestedRegion qui liste eu-central-1 et eu-south-2.
    - id: c
      text:
        en: |-
          A Deny statement for all principals and the kms:ReplicateKey action, with a StringNotEquals condition on kms:ReplicaRegion that lists eu-central-1 and eu-south-2.
        fr: |-
          Une instruction Deny pour tous les principaux et l'action kms:ReplicateKey, avec une condition StringNotEquals sur kms:ReplicaRegion qui liste eu-central-1 et eu-south-2.
    - id: d
      text:
        en: |-
          A Deny statement for all principals and the kms:ReplicateKey action, with a StringNotEquals condition on kms:PrimaryRegion that lists eu-central-1 and eu-south-2.
        fr: |-
          Une instruction Deny pour tous les principaux et l'action kms:ReplicateKey, avec une condition StringNotEquals sur kms:PrimaryRegion qui liste eu-central-1 et eu-south-2.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The kms:ReplicaRegion condition key limits the kms:ReplicateKey permission to the Regions that it lists. Because the key policy lets IAM policies grant access, only an explicit Deny in the key policy blocks replication elsewhere whatever IAM policies allow later, while replication into the two allowed Regions remains possible.
    fr: |-
      La clé de condition kms:ReplicaRegion limite l'autorisation kms:ReplicateKey aux Régions qu'elle liste. Comme la politique de clé permet aux politiques IAM d'accorder l'accès, seul un Deny explicite dans la politique de clé bloque la réplication ailleurs, quoi qu'autorisent plus tard les politiques IAM, tout en laissant possible la réplication dans les deux Régions autorisées.
  options:
    a:
      en: |-
        An Allow statement does not prevent anything: a broader IAM policy could still allow kms:ReplicateKey into other Regions, because the default key policy enables IAM policies.
      fr: |-
        Une instruction Allow n'empêche rien : une politique IAM plus large pourrait toujours autoriser kms:ReplicateKey vers d'autres Régions, car la politique de clé par défaut active les politiques IAM.
    b:
      en: |-
        A key policy controls operations on this key; kms:CreateKey in the replica Region is authorized by IAM policies, and the replication itself is the kms:ReplicateKey action on the primary key.
      fr: |-
        Une politique de clé contrôle les opérations sur cette clé ; kms:CreateKey dans la Région du réplica est autorisé par des politiques IAM, et la réplication elle-même est l'action kms:ReplicateKey sur la clé principale.
    d:
      en: |-
        kms:PrimaryRegion restricts the Regions that can host the primary key in UpdatePrimaryRegion requests; it does not control the Regions of new replicas.
      fr: |-
        kms:PrimaryRegion restreint les Régions pouvant héberger la clé principale dans les requêtes UpdatePrimaryRegion ; il ne contrôle pas les Régions des nouveaux réplicas.
references:
  - title: Control access to multi-Region keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-auth.html
