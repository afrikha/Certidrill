id: scsc03-5b-rotation-test-fails-labels
objective: "5.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany rotates an API credential with a custom Lambda rotation function that follows the four-step rotation model. During tonight's rotation window, the createSecret and setSecret steps succeed, but the testSecret step fails because the new credential is not yet active in the partner's system. Applications retrieve the secret without specifying a version.

    What happens to the secret and the applications?
  fr: |
    AnyCompany effectue la rotation d'une information d'identification d'API avec une fonction de rotation Lambda personnalisée qui suit le modèle de rotation en quatre étapes. Pendant la fenêtre de rotation de cette nuit, les étapes createSecret et setSecret réussissent, mais l'étape testSecret échoue parce que la nouvelle information d'identification n'est pas encore active dans le système du partenaire. Les applications récupèrent le secret sans indiquer de version.

    Qu'advient-il du secret et des applications ?
body:
  options:
    - id: a
      text:
        en: "AWSCURRENT stays on the previous version, which applications keep receiving; the new version keeps AWSPENDING, and Secrets Manager retries rotation in the open windows."
        fr: "AWSCURRENT reste sur la version précédente, que les applications continuent de recevoir ; la nouvelle version garde AWSPENDING, et Secrets Manager relance la rotation dans les fenêtres ouvertes."
    - id: b
      text:
        en: "Secrets Manager moves AWSCURRENT to the new version because setSecret already succeeded, so applications receive the new credential immediately."
        fr: "Secrets Manager déplace AWSCURRENT vers la nouvelle version parce que setSecret a déjà réussi : les applications reçoivent immédiatement la nouvelle information d'identification."
    - id: c
      text:
        en: "Secrets Manager deletes the new version and its AWSPENDING label automatically, and rotation stays disabled until an administrator turns it on again."
        fr: "Secrets Manager supprime automatiquement la nouvelle version et son étiquette AWSPENDING, et la rotation reste désactivée jusqu'à ce qu'un administrateur la réactive."
    - id: d
      text:
        en: "Secrets Manager moves AWSCURRENT to the version labeled AWSPREVIOUS, so applications receive the credential from the rotation before last."
        fr: "Secrets Manager déplace AWSCURRENT vers la version étiquetée AWSPREVIOUS : les applications reçoivent l'information d'identification de l'avant-dernière rotation."
answer: { optionId: a }
explanation:
  correct:
    en: "Only the finishSecret step moves the AWSCURRENT label to the new version, so a failure in testSecret leaves the previous version as AWSCURRENT, which applications get by default. The AWSPENDING label stays on the new version, and when any step fails, Secrets Manager retries the entire rotation process during the open rotation windows."
    fr: "Seule l'étape finishSecret déplace l'étiquette AWSCURRENT vers la nouvelle version : un échec de testSecret laisse la version précédente comme AWSCURRENT, que les applications obtiennent par défaut. L'étiquette AWSPENDING reste sur la nouvelle version, et lorsqu'une étape échoue, Secrets Manager relance tout le processus de rotation pendant les fenêtres de rotation ouvertes."
  options:
    b:
      en: "AWSCURRENT moves only in finishSecret, which does not run when testSecret fails."
      fr: "AWSCURRENT ne se déplace qu'à l'étape finishSecret, qui ne s'exécute pas lorsque testSecret échoue."
    c:
      en: "Secrets Manager does not delete the pending version or disable rotation after a failure; it retries rotation during the open rotation windows."
      fr: "Secrets Manager ne supprime pas la version en attente et ne désactive pas la rotation après un échec ; il relance la rotation pendant les fenêtres de rotation ouvertes."
    d:
      en: "Labels are not rolled back on failure; AWSCURRENT simply stays on the version it was already attached to."
      fr: "Les étiquettes ne sont pas restaurées en cas d'échec ; AWSCURRENT reste simplement sur la version à laquelle elle était déjà attachée."
references:
  - title: Lambda rotation functions
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_lambda-functions.html
  - title: Rotation by Lambda function
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_lambda.html
