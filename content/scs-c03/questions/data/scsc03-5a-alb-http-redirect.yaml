id: scsc03-5a-alb-http-redirect
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's internet-facing Application Load Balancer has an HTTP listener on port 80 that forwards requests to the application's target group, and an HTTPS listener on port 443 that uses an ACM certificate. Users who type http:// URLs must be moved to HTTPS automatically, and no client request may reach the targets over unencrypted HTTP.

    Which solution will meet these requirements?
  fr: |
    L'Application Load Balancer accessible depuis Internet d'AnyCompany a un écouteur HTTP sur le port 80 qui transfère les requêtes vers le groupe cible de l'application, et un écouteur HTTPS sur le port 443 qui utilise un certificat ACM. Les utilisateurs qui saisissent des URL http:// doivent être basculés automatiquement vers HTTPS, et aucune requête client ne doit atteindre les cibles en HTTP non chiffré.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Change the default action of the HTTP listener to a redirect action to HTTPS on port 443 with the HTTP_301 status code."
        fr: "Remplacer l'action par défaut de l'écouteur HTTP par une action de redirection vers HTTPS sur le port 443 avec le code d'état HTTP_301."
    - id: b
      text:
        en: "Delete the HTTP listener, and allow only inbound TCP 443 in the security group of the load balancer."
        fr: "Supprimer l'écouteur HTTP, et n'autoriser que le trafic entrant TCP 443 dans le groupe de sécurité de l'équilibreur de charge."
    - id: c
      text:
        en: "Add a network ACL rule to the load balancer subnets that denies inbound TCP 80 from 0.0.0.0/0."
        fr: "Ajouter aux sous-réseaux de l'équilibreur de charge une règle de liste ACL réseau qui refuse le trafic entrant TCP 80 depuis 0.0.0.0/0."
    - id: d
      text:
        en: "Associate an AWS WAF web ACL with the load balancer that blocks requests received on the HTTP listener."
        fr: "Associer à l'équilibreur de charge une ACL web AWS WAF qui bloque les requêtes reçues sur l'écouteur HTTP."
answer: { optionId: a }
explanation:
  correct:
    en: "A redirect action can send HTTP requests to HTTPS on port 443 while keeping the host, path and query, with a permanent 301 status. The browser then repeats the request over HTTPS, so no request reaches the targets over HTTP."
    fr: "Une action de redirection peut renvoyer les requêtes HTTP vers HTTPS sur le port 443 en conservant l'hôte, le chemin et la chaîne de requête, avec un code permanent 301. Le navigateur répète alors la requête en HTTPS : aucune requête n'atteint les cibles en HTTP."
  options:
    b:
      en: "Without an HTTP listener, users who type http:// URLs get a connection failure instead of being moved to HTTPS."
      fr: "Sans écouteur HTTP, les utilisateurs qui saisissent des URL http:// obtiennent un échec de connexion au lieu d'être basculés vers HTTPS."
    c:
      en: "Blocking port 80 stops HTTP users from connecting at all, so they are not redirected to HTTPS."
      fr: "Bloquer le port 80 empêche les utilisateurs HTTP de se connecter : ils ne sont pas redirigés vers HTTPS."
    d:
      en: "Blocking returns an error to the users instead of moving them to HTTPS."
      fr: "Le blocage renvoie une erreur aux utilisateurs au lieu de les basculer vers HTTPS."
references:
  - title: Action types for listener rules - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-action-types.html
