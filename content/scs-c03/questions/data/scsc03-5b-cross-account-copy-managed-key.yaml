id: scsc03-5b-cross-account-copy-managed-key
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses AWS Organizations, and cross-account backup is enabled in the management account. A backup plan in a workload account copies recovery points to a vault in a central backup account. The destination vault's access policy allows backup:CopyIntoBackupVault for the workload account, and the vault uses a customer managed key. Copies of Amazon DynamoDB backups succeed, but copies of Amazon EBS backups fail. The EBS volumes are encrypted with the AWS managed key aws/ebs.

    Which solution will make the EBS copies succeed?
  fr: |
    AnyCompany utilise AWS Organizations, et la sauvegarde entre comptes est activée dans le compte de gestion. Un plan de sauvegarde d'un compte de charge de travail copie les points de récupération vers un coffre d'un compte de sauvegarde central. La politique d'accès du coffre de destination autorise backup:CopyIntoBackupVault pour le compte de charge de travail, et le coffre utilise une clé gérée par le client. Les copies des sauvegardes Amazon DynamoDB réussissent, mais les copies des sauvegardes Amazon EBS échouent. Les volumes EBS sont chiffrés avec la clé gérée par AWS aws/ebs.

    Quelle solution permet aux copies EBS de réussir ?
body:
  options:
    - id: a
      text:
        en: "Add a statement to the aws/ebs key policy in the workload account that allows the central backup account to use the key."
        fr: "Ajouter à la politique de la clé aws/ebs du compte de charge de travail une instruction qui autorise le compte de sauvegarde central à utiliser la clé."
    - id: b
      text:
        en: "Change the destination to the central backup account's Default vault, which accepts copies of every resource type."
        fr: "Changer la destination pour le coffre Default du compte de sauvegarde central, qui accepte les copies de tous les types de ressources."
    - id: c
      text:
        en: "Encrypt the EBS volumes with a customer managed key whose key policy allows the central backup account to use it, and back them up again."
        fr: "Chiffrer les volumes EBS avec une clé gérée par le client dont la politique de clé autorise le compte de sauvegarde central à l'utiliser, puis les sauvegarder de nouveau."
    - id: d
      text:
        en: "Add backup:CopyFromBackupVault for the central backup account to the destination vault's access policy."
        fr: "Ajouter backup:CopyFromBackupVault pour le compte de sauvegarde central à la politique d'accès du coffre de destination."
answer: { optionId: c }
explanation:
  correct:
    en: "For resource types that are not fully managed by AWS Backup, such as Amazon EBS, the source must use a customer managed key that is shared with the destination account. AWS managed key policies are immutable and cannot be shared across accounts, so the volumes must be encrypted with a shareable customer managed key."
    fr: "Pour les types de ressources qui ne sont pas entièrement gérés par AWS Backup, comme Amazon EBS, la source doit utiliser une clé gérée par le client partagée avec le compte de destination. Les politiques des clés gérées par AWS sont immuables et ne peuvent pas être partagées entre comptes : les volumes doivent être chiffrés avec une clé gérée par le client partageable."
  options:
    a:
      en: "The key policy of an AWS managed key cannot be changed, so aws/ebs cannot be shared with another account."
      fr: "La politique d'une clé gérée par AWS ne peut pas être modifiée : aws/ebs ne peut pas être partagée avec un autre compte."
    b:
      en: "The default vault cannot be a cross-account destination, because its key cannot be shared with other accounts."
      fr: "Le coffre par défaut ne peut pas être une destination entre comptes, car sa clé ne peut pas être partagée avec d'autres comptes."
    d:
      en: "CopyIntoBackupVault in the destination vault policy is already sufficient; the failure comes from the source key, not from the vault policy."
      fr: "CopyIntoBackupVault dans la politique du coffre de destination suffit déjà ; l'échec vient de la clé source, pas de la politique du coffre."
references:
  - title: Creating backup copies across AWS accounts
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/create-cross-account-backup.html
