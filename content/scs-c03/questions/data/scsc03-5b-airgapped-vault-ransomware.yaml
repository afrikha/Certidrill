id: scsc03-5b-airgapped-vault-ransomware
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany backs up Amazon EC2 instances and Amazon DynamoDB tables with AWS Backup in its production accounts. Its ransomware response plan requires a copy of every backup that is always protected by a compliance mode lock. If a production account is compromised or closed, a recovery account that belongs to a separate organization must be able to restore the backups directly without first copying them back.

    Which solution will meet these requirements?
  fr: |
    AnyCompany sauvegarde des instances Amazon EC2 et des tables Amazon DynamoDB avec AWS Backup dans ses comptes de production. Son plan de réponse aux rançongiciels exige une copie de chaque sauvegarde toujours protégée par un verrou en mode conformité (compliance). Si un compte de production est compromis ou fermé, un compte de récupération appartenant à une organisation distincte doit pouvoir restaurer directement les sauvegardes sans les recopier d'abord.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a copy action to each backup rule that targets a standard backup vault in the recovery account, and lock that vault with AWS Backup Vault Lock in governance mode."
        fr: "Ajouter à chaque règle de sauvegarde une action de copie qui cible un coffre de sauvegarde standard du compte de récupération, et verrouiller ce coffre avec AWS Backup Vault Lock en mode gouvernance (governance)."
    - id: b
      text:
        en: "Add a copy action to each backup rule that targets a logically air-gapped vault, and share the vault with the recovery account through AWS Resource Access Manager (AWS RAM)."
        fr: "Ajouter à chaque règle de sauvegarde une action de copie qui cible un coffre isolé logiquement (logically air-gapped vault), et partager ce coffre avec le compte de récupération par AWS Resource Access Manager (AWS RAM)."
    - id: c
      text:
        en: "Use Amazon Data Lifecycle Manager cross-account copy event policies to copy the snapshots into the recovery account, and lock them with EBS snapshot lock."
        fr: "Utiliser des politiques d'événements de copie entre comptes d'Amazon Data Lifecycle Manager pour copier les instantanés dans le compte de récupération, et les verrouiller avec le verrouillage d'instantané EBS."
    - id: d
      text:
        en: "Add a copy action to each backup rule that targets a backup vault in another Region of the same production account, and lock that vault in compliance mode."
        fr: "Ajouter à chaque règle de sauvegarde une action de copie qui cible un coffre de sauvegarde dans une autre Région du même compte de production, et verrouiller ce coffre en mode conformité."
answer: { optionId: b }
explanation:
  correct:
    en: "A logically air-gapped vault is always locked in compliance mode. It can be shared through AWS RAM with individual accounts, including accounts in other organizations, which can then restore the backups directly from the shared vault."
    fr: "Un coffre isolé logiquement est toujours verrouillé en mode conformité. Il peut être partagé par AWS RAM avec des comptes individuels, y compris des comptes d'autres organisations, qui peuvent alors restaurer directement les sauvegardes depuis le coffre partagé."
  options:
    a:
      en: "Governance mode can be removed by users with sufficient permissions, and cross-account copies in AWS Backup require accounts in the same organization."
      fr: "Le mode gouvernance peut être retiré par des utilisateurs disposant d'autorisations suffisantes, et les copies entre comptes d'AWS Backup exigent des comptes de la même organisation."
    c:
      en: "Data Lifecycle Manager manages only EBS snapshots and EBS-backed AMIs, so the DynamoDB tables would not be protected."
      fr: "Data Lifecycle Manager ne gère que les instantanés EBS et les AMI basées sur EBS : les tables DynamoDB ne seraient pas protégées."
    d:
      en: "The copies stay in the production account, so they are not available to the recovery account if the production account is compromised or closed."
      fr: "Les copies restent dans le compte de production : elles ne sont pas accessibles au compte de récupération si le compte de production est compromis ou fermé."
references:
  - title: Logically air-gapped vault
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html
