id: scsc03-5b-noncurrent-keep-five
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores application configuration files in a versioning-enabled Amazon S3 bucket under the config/ prefix. To recover from accidental or malicious changes, operators must always be able to roll back to any of the 5 most recent previous versions of a file. Older previous versions must be permanently deleted once they have been noncurrent for more than 30 days. Current versions must never be deleted by the rule.

    Which S3 Lifecycle rule will meet these requirements?
  fr: |
    AnyCompany stocke des fichiers de configuration d'application dans un compartiment (bucket) Amazon S3 où la gestion des versions est activée, sous le préfixe config/. Pour se remettre de modifications accidentelles ou malveillantes, les opérateurs doivent toujours pouvoir revenir à l'une des 5 versions précédentes les plus récentes d'un fichier. Les versions précédentes plus anciennes doivent être supprimées définitivement une fois non actuelles depuis plus de 30 jours. La règle ne doit jamais supprimer les versions actuelles.

    Quelle règle S3 Lifecycle répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "A rule with a config/ prefix filter and a NoncurrentVersionExpiration action with NoncurrentDays set to 30 and NewerNoncurrentVersions set to 5."
        fr: "Une règle avec un filtre de préfixe config/ et une action NoncurrentVersionExpiration avec NoncurrentDays défini sur 30 et NewerNoncurrentVersions défini sur 5."
    - id: b
      text:
        en: "A rule with a config/ prefix filter and an Expiration action with Days set to 30, combined with a NoncurrentVersionExpiration action with NoncurrentDays set to 150."
        fr: "Une règle avec un filtre de préfixe config/ et une action Expiration avec Days défini sur 30, combinée à une action NoncurrentVersionExpiration avec NoncurrentDays défini sur 150."
    - id: c
      text:
        en: "A rule with a config/ prefix filter and a NoncurrentVersionExpiration action with NoncurrentDays set to 30 only."
        fr: "Une règle avec un filtre de préfixe config/ et une action NoncurrentVersionExpiration avec NoncurrentDays défini sur 30 uniquement."
    - id: d
      text:
        en: "A rule with a config/ prefix filter and a NoncurrentVersionTransition action to S3 Glacier Deep Archive with NoncurrentDays set to 30 and NewerNoncurrentVersions set to 5."
        fr: "Une règle avec un filtre de préfixe config/ et une action NoncurrentVersionTransition vers S3 Glacier Deep Archive avec NoncurrentDays défini sur 30 et NewerNoncurrentVersions défini sur 5."
answer: { optionId: a }
explanation:
  correct:
    en: "NewerNoncurrentVersions keeps the specified number of newest noncurrent versions, and a version is deleted only when both NoncurrentDays and NewerNoncurrentVersions are exceeded. This retention count requires a Filter element, which the prefix filter provides, and the action never touches current versions."
    fr: "NewerNoncurrentVersions conserve le nombre indiqué de versions non actuelles les plus récentes, et une version n'est supprimée que lorsque NoncurrentDays et NewerNoncurrentVersions sont tous deux dépassés. Ce nombre de versions à conserver exige un élément Filter, que fournit le filtre de préfixe, et l'action ne touche jamais aux versions actuelles."
  options:
    b:
      en: "The Expiration action makes current versions noncurrent after 30 days by adding delete markers, which the requirement forbids."
      fr: "L'action Expiration rend les versions actuelles non actuelles après 30 jours en ajoutant des marqueurs de suppression, ce que l'exigence interdit."
    c:
      en: "Without NewerNoncurrentVersions, a file changed several times in a month could lose previous versions that are among its 5 most recent ones."
      fr: "Sans NewerNoncurrentVersions, un fichier modifié plusieurs fois en un mois pourrait perdre des versions précédentes qui font partie de ses 5 plus récentes."
    d:
      en: "A transition changes the storage class of old versions but never deletes them."
      fr: "Une transition change la classe de stockage des anciennes versions mais ne les supprime jamais."
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
