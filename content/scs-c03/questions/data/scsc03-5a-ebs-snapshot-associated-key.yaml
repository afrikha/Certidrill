id: scsc03-5a-ebs-snapshot-associated-key
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's workload account has hundreds of Amazon EBS snapshots encrypted with the AWS managed key aws/ebs. The security team must let a separate forensics account copy selected snapshots. The forensics account must not get access to any key that the workload volumes use, and the team does not want to create copies of the snapshots in the workload account first, because full copies add storage costs.

    Which solution will meet these requirements?
  fr: |
    Le compte de charge de travail d'AnyCompany possède des centaines d'instantanés Amazon EBS chiffrés avec la clé gérée par AWS aws/ebs. L'équipe de sécurité doit permettre à un compte d'investigation distinct de copier certains instantanés. Le compte d'investigation ne doit obtenir l'accès à aucune clé utilisée par les volumes de la charge de travail, et l'équipe ne veut pas créer d'abord des copies des instantanés dans le compte de charge de travail, car des copies complètes ajoutent des coûts de stockage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Edit the key policy of aws/ebs to allow the forensics account kms:Decrypt and kms:CreateGrant, and share the snapshots with that account."
        fr: "Modifier la politique de clé de aws/ebs pour accorder kms:Decrypt et kms:CreateGrant au compte d'investigation, et partager les instantanés avec ce compte."
    - id: b
      text:
        en: "Associate a customer managed key that the forensics account may use with each selected snapshot, share the snapshots, and copy them in the forensics account."
        fr: "Associer à chaque instantané choisi une clé gérée par le client que le compte d'investigation peut utiliser, partager les instantanés, puis les copier dans le compte d'investigation."
    - id: c
      text:
        en: "Copy each selected snapshot in the workload account with re-encryption under a customer managed key, and share the copies with the forensics account."
        fr: "Copier chaque instantané choisi dans le compte de charge de travail avec rechiffrement sous une clé gérée par le client, et partager les copies avec le compte d'investigation."
    - id: d
      text:
        en: "Add the forensics account to the createVolumePermission attribute of each selected snapshot, and copy the snapshots in that account."
        fr: "Ajouter le compte d'investigation à l'attribut createVolumePermission de chaque instantané choisi, et copier les instantanés dans ce compte."
answer: { optionId: b }
explanation:
  correct:
    en: "An associated KMS key is an extra customer managed key attached to an encrypted snapshot. A principal that can use it can copy the snapshot across accounts without access to the original key, and it is the way to share snapshots encrypted with an AWS managed key. The data is not re-encrypted, so no extra copy is created in the workload account. Both the key policy and the forensics principal's IAM policy must allow the key."
    fr: "Une clé KMS associée est une clé gérée par le client supplémentaire attachée à un instantané chiffré. Un principal qui peut l'utiliser peut copier l'instantané entre comptes sans accès à la clé d'origine, et c'est le moyen de partager des instantanés chiffrés avec une clé gérée par AWS. Les données ne sont pas rechiffrées : aucune copie supplémentaire n'est créée dans le compte de charge de travail. La politique de clé et la politique IAM du principal d'investigation doivent toutes deux autoriser la clé."
  options:
    a:
      en: "The key policy of an AWS managed key cannot be modified, and granting access to aws/ebs would expose the key of the workload volumes."
      fr: "La politique d'une clé gérée par AWS ne peut pas être modifiée, et accorder l'accès à aws/ebs exposerait la clé des volumes de la charge de travail."
    c:
      en: "Re-encrypting copies in the workload account creates full, non-incremental snapshot copies, which the team wants to avoid."
      fr: "Rechiffrer des copies dans le compte de charge de travail crée des copies d'instantanés complètes et non incrémentielles, ce que l'équipe veut éviter."
    d:
      en: "A snapshot encrypted with an AWS managed key cannot be shared by granting create-volume permission alone, because the other account cannot use aws/ebs."
      fr: "Un instantané chiffré avec une clé gérée par AWS ne peut pas être partagé par la seule autorisation de création de volume, car l'autre compte ne peut pas utiliser aws/ebs."
references:
  - title: Associated KMS keys - Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/associated-kms-keys.html
  - title: Share an Amazon EBS snapshot with other AWS accounts - Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modifying-snapshot-permissions.html
