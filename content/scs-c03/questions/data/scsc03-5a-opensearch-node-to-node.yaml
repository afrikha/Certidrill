id: scsc03-5a-opensearch-node-to-node
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an Amazon OpenSearch Service domain on an OpenSearch 2.x engine version with VPC access. The domain already requires HTTPS for client requests and uses encryption at rest. Auditors now require that the traffic between the domain's nodes also be encrypted, and the company plans to enable fine-grained access control next quarter. The domain must keep its endpoint and data.

    Which action should the company take?
  fr: |
    AnyCompany exploite un domaine Amazon OpenSearch Service sur une version de moteur OpenSearch 2.x avec accès VPC. Le domaine exige déjà HTTPS pour les requêtes des clients et utilise le chiffrement au repos. Les auditeurs exigent désormais que le trafic entre les nœuds du domaine soit aussi chiffré, et l'entreprise prévoit d'activer le contrôle d'accès précis le trimestre prochain. Le domaine doit conserver son point de terminaison et ses données.

    Quelle action l'entreprise doit-elle entreprendre ?
body:
  options:
    - id: a
      text:
        en: "Enable node-to-node encryption on the existing domain by editing its security configuration."
        fr: "Activer le chiffrement de nœud à nœud sur le domaine existant en modifiant sa configuration de sécurité."
    - id: b
      text:
        en: "Take a manual snapshot, create a new domain with node-to-node encryption, and restore the snapshot into it."
        fr: "Prendre un instantané manuel, créer un nouveau domaine avec le chiffrement de nœud à nœud, et y restaurer l'instantané."
    - id: c
      text:
        en: "Set the TLS security policy of the domain endpoint to Policy-Min-TLS-1-2-2019-07."
        fr: "Définir la politique de sécurité TLS du point de terminaison du domaine sur Policy-Min-TLS-1-2-2019-07."
    - id: d
      text:
        en: "Move the data nodes to dedicated subnets, and allow TCP 9300 only between them in their security group."
        fr: "Déplacer les nœuds de données dans des sous-réseaux dédiés, et n'autoriser TCP 9300 qu'entre eux dans leur groupe de sécurité."
answer: { optionId: a }
explanation:
  correct:
    en: "Node-to-node encryption enables TLS 1.2 for all communication between the nodes within the VPC. Domains on any OpenSearch version, or Elasticsearch 6.7 and later, can enable it in place, and it is required for fine-grained access control. Once enabled, it cannot be disabled."
    fr: "Le chiffrement de nœud à nœud active TLS 1.2 pour toutes les communications entre les nœuds dans le VPC. Les domaines sur n'importe quelle version d'OpenSearch, ou sur Elasticsearch 6.7 et versions ultérieures, peuvent l'activer sur place, et il est exigé pour le contrôle d'accès précis. Une fois activé, il ne peut pas être désactivé."
  options:
    b:
      en: "A new domain changes the endpoint, and recreating the domain is unnecessary because OpenSearch domains can enable node-to-node encryption in place."
      fr: "Un nouveau domaine change le point de terminaison, et le recréer est inutile car les domaines OpenSearch peuvent activer le chiffrement de nœud à nœud sur place."
    c:
      en: "The TLS security policy applies to client connections to the domain endpoint, not to traffic between nodes."
      fr: "La politique de sécurité TLS s'applique aux connexions des clients au point de terminaison du domaine, pas au trafic entre nœuds."
    d:
      en: "OpenSearch Service manages node placement and networking, and filtering traffic does not encrypt it."
      fr: "OpenSearch Service gère le placement et le réseau des nœuds, et filtrer le trafic ne le chiffre pas."
references:
  - title: Node-to-node encryption for Amazon OpenSearch Service - Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ntn.html
