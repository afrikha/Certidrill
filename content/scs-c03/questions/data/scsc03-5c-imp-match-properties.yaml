id: scsc03-5c-imp-match-properties
objective: "5.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A security architect at AnyCompany compares two kinds of symmetric encryption KMS keys for a new project: keys with imported key material (EXTERNAL origin) and keys with key material generated by AWS KMS (AWS_KMS origin).

    Match each capability to the kind of key that supports it.

    To answer, drag the appropriate kind of key to each capability. Each kind of key may be used once, more than once, or not at all.
  fr: |
    Une architecte de sécurité d'AnyCompany compare deux types de clés KMS de chiffrement symétriques pour un nouveau projet : les clés avec des éléments de clé importés (origine EXTERNAL) et les clés avec des éléments de clé générés par AWS KMS (origine AWS_KMS).

    Associez chaque fonctionnalité au type de clé qui la prend en charge.

    Pour répondre, faites glisser le type de clé approprié vers chaque fonctionnalité. Chaque type de clé peut être utilisé une fois, plusieurs fois ou pas du tout.
body:
  reuse: true
  items:
    - { id: imp, text: { en: "Imported key material only", fr: "Éléments de clé importés uniquement" } }
    - { id: gen, text: { en: "AWS-generated key material only", fr: "Éléments de clé générés par AWS uniquement" } }
    - { id: both, text: { en: "Both kinds of keys", fr: "Les deux types de clés" } }
  targets:
    - id: t1
      text: { en: "Rotation of the key material on a schedule that AWS KMS runs every rotation period", fr: "Rotation des éléments de clé selon une planification qu'AWS KMS exécute à chaque période de rotation" }
    - id: t2
      text: { en: "An expiration time after which AWS KMS deletes the key material", fr: "Une date d'expiration après laquelle AWS KMS supprime les éléments de clé" }
    - id: t3
      text: { en: "Deletion of the key material while the KMS key itself is kept", fr: "Suppression des éléments de clé tout en conservant la clé KMS elle-même" }
    - id: t4
      text: { en: "On-demand rotation of the key material with RotateKeyOnDemand", fr: "Rotation à la demande des éléments de clé avec RotateKeyOnDemand" }
    - id: t5
      text: { en: "Creation as a multi-Region primary key that can be replicated", fr: "Création en tant que clé principale multi-Région pouvant être répliquée" }
answer:
  mapping: { t1: gen, t2: imp, t3: imp, t4: both, t5: both }
explanation:
  correct:
    en: |-
      Automatic rotation is supported only for symmetric encryption keys with AWS_KMS origin. Expiration and deletion of key material without deleting the key apply only to imported material; AWS KMS deletes AWS-generated material only when the key is deleted. On-demand rotation works for both origins (after new material is imported for EXTERNAL keys), and multi-Region keys can use either AWS-generated or imported material.
    fr: |-
      La rotation automatique n'est prise en charge que pour les clés de chiffrement symétriques d'origine AWS_KMS. L'expiration et la suppression des éléments de clé sans supprimer la clé ne s'appliquent qu'aux éléments importés ; AWS KMS ne supprime les éléments générés par AWS que lorsque la clé est supprimée. La rotation à la demande fonctionne pour les deux origines (après l'importation de nouveaux éléments pour les clés EXTERNAL), et les clés multi-Régions peuvent utiliser des éléments générés par AWS ou importés.
references:
  - title: Rotate AWS KMS keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
  - title: Multi-Region keys in AWS KMS - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html
