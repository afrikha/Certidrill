id: scsc03-5c-mrk-shared-properties
objective: "5.3.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A security engineer at AnyCompany documents how to manage a set of multi-Region customer managed keys in three Regions. The document must separate the properties that AWS KMS synchronizes from the primary key to its replica keys from the properties that the team must manage in each Region.

    Which two properties does AWS KMS share and synchronize from the primary key to its replica keys? (Choose two.)
  fr: |
    Un ingénieur sécurité d'AnyCompany documente la gestion d'un ensemble de clés multi-Régions gérées par le client dans trois Régions. Le document doit séparer les propriétés qu'AWS KMS synchronise de la clé principale vers ses clés de réplica des propriétés que l'équipe doit gérer dans chaque Région.

    Quelles sont les deux propriétés qu'AWS KMS partage et synchronise de la clé principale vers ses clés de réplica ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "The key spec and the key usage", fr: "La spécification de clé et l'utilisation de la clé" }
    - id: b
      text: { en: "The key policy", fr: "La politique de clé" }
    - id: c
      text: { en: "The aliases that point to the key", fr: "Les alias qui pointent vers la clé" }
    - id: d
      text: { en: "The grants on the key", fr: "Les octrois sur la clé" }
    - id: e
      text: { en: "The automatic key rotation status", fr: "L'état de la rotation automatique de la clé" }
answer: { optionIds: [a, e] }
explanation:
  correct:
    en: |-
      The shared properties of multi-Region keys are the key ID, the key material, the key material origin, the key spec and encryption algorithms, the key usage, and the automatic and on-demand rotation settings, which are set on the primary key only. AWS KMS periodically synchronizes them to the replicas, and they cannot be set on a replica.
    fr: |-
      Les propriétés partagées des clés multi-Régions sont l'ID de clé, les éléments de clé, l'origine des éléments de clé, la spécification de clé et les algorithmes de chiffrement, l'utilisation de la clé, ainsi que les paramètres de rotation automatique et à la demande, définis uniquement sur la clé principale. AWS KMS les synchronise périodiquement vers les réplicas, et ils ne peuvent pas être définis sur un réplica.
  options:
    b:
      en: |-
        The key policy is an independent property: AWS KMS does not copy or synchronize it, so each key needs its own key policy.
      fr: |-
        La politique de clé est une propriété indépendante : AWS KMS ne la copie ni ne la synchronise, et chaque clé a besoin de sa propre politique de clé.
    c:
      en: |-
        Aliases are independent properties that must be created on each multi-Region key.
      fr: |-
        Les alias sont des propriétés indépendantes qui doivent être créées sur chaque clé multi-Région.
    d:
      en: |-
        Grants are Regional; each grant applies to one KMS key, even among related multi-Region keys.
      fr: |-
        Les octrois sont régionaux ; chaque octroi s'applique à une seule clé KMS, même parmi des clés multi-Régions associées.
references:
  - title: Multi-Region keys in AWS KMS - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html
