id: scsc03-5c-mask-unmask-methods
objective: "5.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's incident responders use an IAM role that is allowed the logs:Unmask action on the log group /app/auth. The log group has a data protection policy that masks email addresses and IP addresses. During an investigation, the responders need to read the original values of the masked fields in recent log events.

    Which two methods will return the unmasked values to the incident response role? (Choose two.) Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les intervenants en cas d'incident d'AnyCompany utilisent un rôle IAM autorisé à effectuer l'action logs:Unmask sur le groupe de journaux /app/auth. Le groupe de journaux dispose d'une politique de protection des données qui masque les adresses e-mail et les adresses IP. Lors d'une investigation, les intervenants doivent lire les valeurs d'origine des champs masqués dans des événements de journal récents.

    Quelles sont les deux méthodes qui renverront les valeurs non masquées au rôle de réponse aux incidents ? (Choisissez-en deux.) Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run a CloudWatch Logs Insights query whose fields command includes unmask(@message).
        fr: |-
          Exécuter une requête CloudWatch Logs Insights dont la commande fields inclut unmask(@message).
    - id: b
      text:
        en: |-
          Create a subscription filter that sends the log events to an AWS Lambda function whose execution role is the incident response role.
        fr: |-
          Créer un filtre d'abonnement qui envoie les événements de journal à une fonction AWS Lambda dont le rôle d'exécution est le rôle de réponse aux incidents.
    - id: c
      text:
        en: |-
          Call the GetLogEvents operation on the log stream with the unmask parameter.
        fr: |-
          Appeler l'opération GetLogEvents sur le flux de journaux avec le paramètre unmask.
    - id: d
      text:
        en: |-
          Create a metric filter that extracts the masked fields into metric dimensions, and read the dimensions in CloudWatch.
        fr: |-
          Créer un filtre de métrique qui extrait les champs masqués dans des dimensions de métrique, et lire les dimensions dans CloudWatch.
    - id: e
      text:
        en: |-
          Add the incident response role as a principal to the Deidentify statement of the data protection policy.
        fr: |-
          Ajouter le rôle de réponse aux incidents comme principal dans l'instruction Deidentify de la politique de protection des données.
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      A principal with logs:Unmask can view unmasked data in three ways: Display, Unmask in the log stream view of the console, a CloudWatch Logs Insights query that uses unmask(@message), or a GetLogEvents or FilterLogEvents call with the unmask parameter.
    fr: |-
      Un principal doté de logs:Unmask peut voir les données non masquées de trois manières : Display, Unmask dans la vue du flux de journaux de la console, une requête CloudWatch Logs Insights qui utilise unmask(@message), ou un appel GetLogEvents ou FilterLogEvents avec le paramètre unmask.
  options:
    b:
      en: |-
        Sensitive data is masked at all egress points, including subscription filters, whatever role the destination uses.
      fr: |-
        Les données sensibles sont masquées à tous les points de sortie, y compris les filtres d'abonnement, quel que soit le rôle utilisé par la destination.
    d:
      en: |-
        Metric filters are also egress points where the data is masked, so the dimensions would contain masked values.
      fr: |-
        Les filtres de métrique sont aussi des points de sortie où les données sont masquées : les dimensions contiendraient des valeurs masquées.
    e:
      en: |-
        Data protection policy statements contain data identifiers and an operation, not principals; who can unmask is controlled by the logs:Unmask IAM permission.
      fr: |-
        Les instructions d'une politique de protection des données contiennent des identifiants de données et une opération, pas des principaux ; qui peut démasquer est contrôlé par l'autorisation IAM logs:Unmask.
references:
  - title: View unmasked data - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data-viewunmasked.html
