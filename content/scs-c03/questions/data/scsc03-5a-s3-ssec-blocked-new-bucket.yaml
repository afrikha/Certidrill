id: scsc03-5a-s3-ssec-blocked-new-bucket
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's application encrypts objects in Amazon S3 with SSE-C, using keys generated and kept in the company's on-premises key manager. Its existing buckets contain SSE-C objects and keep working. In June 2026, the team created a new general purpose bucket in the same account. PutObject requests with SSE-C headers over HTTPS to the new bucket fail with HTTP 403 AccessDenied, although the application role's IAM policy allows s3:PutObject on the bucket and the bucket policy denies nothing. The company must keep using SSE-C.

    Which solution will meet this requirement?
  fr: |
    L'application d'AnyCompany chiffre des objets dans Amazon S3 avec SSE-C, en utilisant des clés générées et conservées dans le gestionnaire de clés sur site de l'entreprise. Ses compartiments existants contiennent des objets SSE-C et continuent de fonctionner. En juin 2026, l'équipe a créé un nouveau compartiment à usage général dans le même compte. Les requêtes PutObject avec des en-têtes SSE-C en HTTPS vers le nouveau compartiment échouent avec HTTP 403 AccessDenied, bien que la politique IAM du rôle de l'application autorise s3:PutObject sur le compartiment et que la politique de compartiment ne refuse rien. L'entreprise doit continuer à utiliser SSE-C.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text:
        en: "Call PutBucketEncryption on the new bucket with BlockedEncryptionTypes set to NONE."
        fr: "Appeler PutBucketEncryption sur le nouveau compartiment avec BlockedEncryptionTypes défini sur NONE."
    - id: b
      text:
        en: "Add a bucket policy statement that allows s3:PutObject when s3:x-amz-server-side-encryption-customer-algorithm is AES256."
        fr: "Ajouter une instruction de politique de compartiment qui autorise s3:PutObject lorsque s3:x-amz-server-side-encryption-customer-algorithm vaut AES256."
    - id: c
      text:
        en: "Enable S3 Bucket Keys in the default encryption configuration of the new bucket."
        fr: "Activer les clés de compartiment S3 dans la configuration de chiffrement par défaut du nouveau compartiment."
    - id: d
      text:
        en: "Turn off S3 Block Public Access on the new bucket, and keep the existing IAM policy."
        fr: "Désactiver S3 Block Public Access sur le nouveau compartiment, et garder la politique IAM existante."
answer: { optionId: a }
explanation:
  correct:
    en: "Since April 2026, SSE-C is disabled by default for new general purpose buckets, and blocked SSE-C writes fail with 403 AccessDenied. An application that needs SSE-C must enable it explicitly on the bucket with PutBucketEncryption and BlockedEncryptionTypes set to NONE, which requires s3:PutEncryptionConfiguration."
    fr: "Depuis avril 2026, SSE-C est désactivé par défaut pour les nouveaux compartiments à usage général, et les écritures SSE-C bloquées échouent avec 403 AccessDenied. Une application qui a besoin de SSE-C doit l'activer explicitement sur le compartiment avec PutBucketEncryption et BlockedEncryptionTypes défini sur NONE, ce qui exige s3:PutEncryptionConfiguration."
  options:
    b:
      en: "The block is part of the bucket encryption configuration, not of the access policies, so another Allow statement does not lift it."
      fr: "Le blocage fait partie de la configuration de chiffrement du compartiment, pas des politiques d'accès : une autre instruction Allow ne le lève pas."
    c:
      en: "S3 Bucket Keys reduce AWS KMS requests for SSE-KMS; they have no effect on SSE-C."
      fr: "Les clés de compartiment S3 réduisent les requêtes AWS KMS pour SSE-KMS : elles n'ont aucun effet sur SSE-C."
    d:
      en: "Block Public Access controls public access through policies and ACLs; it is not related to the SSE-C block, and turning it off weakens security."
      fr: "Block Public Access contrôle l'accès public par les politiques et les ACL : il n'a aucun lien avec le blocage de SSE-C, et le désactiver affaiblit la sécurité."
references:
  - title: Blocking or unblocking SSE-C for a general purpose bucket - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/blocking-unblocking-s3-c-encryption-gpb.html
  - title: Using server-side encryption with customer-provided keys (SSE-C) - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/ServerSideEncryptionCustomerKeys.html
