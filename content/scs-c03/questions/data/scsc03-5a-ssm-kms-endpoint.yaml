id: scsc03-5a-ssm-kms-endpoint
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's Amazon EC2 instances run in private subnets with no internet access. The VPC has interface endpoints with private DNS for ssm, ssmmessages, and ec2messages, and Session Manager sessions were working. The security team then enabled AWS KMS encryption of session data in the Session Manager preferences with a customer managed key. The instance profile and the key policy both allow the instances to use the key for kms:Decrypt. Since the change, sessions fail to start.

    Which change will fix the issue?
  fr: |
    Les instances Amazon EC2 d'AnyCompany s'exécutent dans des sous-réseaux privés sans accès à Internet. Le VPC possède des points de terminaison d'interface avec DNS privé pour ssm, ssmmessages et ec2messages, et les sessions Session Manager fonctionnaient. L'équipe de sécurité a ensuite activé le chiffrement AWS KMS des données de session dans les préférences de Session Manager avec une clé gérée par le client. Le profil d'instance et la politique de clé autorisent tous deux les instances à utiliser la clé pour kms:Decrypt. Depuis ce changement, les sessions ne démarrent plus.

    Quelle modification corrige le problème ?
body:
  options:
    - id: a
      text:
        en: "Add a gateway endpoint for Amazon S3, and associate it with the route tables of the private subnets."
        fr: "Ajouter un point de terminaison de passerelle pour Amazon S3, et l'associer aux tables de routage des sous-réseaux privés."
    - id: b
      text:
        en: "Add an interface endpoint for Amazon CloudWatch Logs with private DNS in the private subnets."
        fr: "Ajouter un point de terminaison d'interface pour Amazon CloudWatch Logs avec DNS privé dans les sous-réseaux privés."
    - id: c
      text:
        en: "Add an interface endpoint for AWS KMS with private DNS in the private subnets."
        fr: "Ajouter un point de terminaison d'interface pour AWS KMS avec DNS privé dans les sous-réseaux privés."
    - id: d
      text:
        en: "Add an interface endpoint for AWS STS with private DNS so that the instances can get credentials for the KMS calls."
        fr: "Ajouter un point de terminaison d'interface pour AWS STS avec DNS privé pour que les instances obtiennent des informations d'identification pour les appels KMS."
answer: { optionId: c }
explanation:
  correct:
    en: "With KMS encryption of session data, SSM Agent on the instance calls AWS KMS for the session keys. Instances without internet access need the com.amazonaws.region.kms interface endpoint for these calls; Systems Manager lists it as needed only when KMS encryption is used for Session Manager or Parameter Store."
    fr: "Avec le chiffrement KMS des données de session, SSM Agent sur l'instance appelle AWS KMS pour les clés de session. Les instances sans accès à Internet ont besoin du point de terminaison d'interface com.amazonaws.region.kms pour ces appels ; Systems Manager l'indique comme nécessaire uniquement lorsque le chiffrement KMS est utilisé pour Session Manager ou Parameter Store."
  options:
    a:
      en: "The S3 endpoint is used for SSM Agent updates and for optional script or output buckets; it does not carry the KMS calls."
      fr: "Le point de terminaison S3 sert aux mises à jour de SSM Agent et aux compartiments facultatifs de scripts ou de sortie : il ne transporte pas les appels KMS."
    b:
      en: "The CloudWatch Logs endpoint is needed only when session logs are sent to CloudWatch Logs, which the scenario does not mention."
      fr: "Le point de terminaison CloudWatch Logs n'est nécessaire que lorsque les journaux de session sont envoyés à CloudWatch Logs, ce que le scénario ne mentionne pas."
    d:
      en: "The instances get their role credentials from the instance profile through the instance metadata service, and sessions worked before without STS."
      fr: "Les instances obtiennent les informations d'identification de leur rôle par le profil d'instance et le service de métadonnées d'instance, et les sessions fonctionnaient déjà sans STS."
references:
  - title: Improve the security of EC2 instances by using VPC endpoints for Systems Manager - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/setup-create-vpc.html
