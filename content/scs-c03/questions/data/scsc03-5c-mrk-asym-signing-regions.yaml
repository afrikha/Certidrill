id: scsc03-5c-mrk-asym-signing-regions
objective: "5.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is designing a new line of industrial devices. Each device will verify software update packages against a single public key pinned in its firmware; the devices do not support certificate chains or intermediate CAs. Build pipelines in us-east-1, eu-west-1, and ap-southeast-1 must sign packages locally, without cross-Region calls, and must keep signing if any one Region is unavailable. The private key must be generated by AWS KMS and must never exist outside AWS KMS.

    Which solution will meet these requirements?
  fr: |
    AnyCompany conçoit une nouvelle gamme d'appareils industriels. Chaque appareil vérifiera les paquets de mise à jour logicielle au moyen d'une clé publique unique épinglée dans son micrologiciel ; les appareils ne prennent en charge ni les chaînes de certificats ni les CA intermédiaires. Des pipelines de build dans us-east-1, eu-west-1 et ap-southeast-1 doivent signer les paquets localement, sans appel entre Régions, et doivent continuer à signer si l'une des Régions est indisponible. La clé privée doit être générée par AWS KMS et ne doit jamais exister en dehors d'AWS KMS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a separate single-Region asymmetric signing key in each Region, and pin the public key of the us-east-1 key in the firmware of the devices.
        fr: |-
          Créer une clé de signature asymétrique à Région unique distincte dans chaque Région, et épingler la clé publique de la clé de us-east-1 dans le micrologiciel des appareils.
    - id: b
      text:
        en: |-
          Create an asymmetric multi-Region primary key for signing in us-east-1, replicate it to eu-west-1 and ap-southeast-1, and have each pipeline sign with the key in its Region.
        fr: |-
          Créer une clé principale multi-Région asymétrique de signature dans us-east-1, la répliquer dans eu-west-1 et ap-southeast-1, et faire signer chaque pipeline avec la clé de sa Région.
    - id: c
      text:
        en: |-
          Create an AWS Private CA root CA in us-east-1 and a subordinate CA in each Region, and sign the packages with certificates issued by the subordinate CAs.
        fr: |-
          Créer une CA racine AWS Private CA dans us-east-1 et une CA subordonnée dans chaque Région, et signer les paquets avec des certificats émis par les CA subordonnées.
    - id: d
      text:
        en: |-
          Generate one key pair in an on-premises HSM, and import the same private key material into a single-Region asymmetric KMS key in each Region.
        fr: |-
          Générer une paire de clés dans un HSM sur site, et importer les mêmes éléments de clé privée dans une clé KMS asymétrique à Région unique dans chaque Région.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Related multi-Region keys share the same key material, key spec, and key usage, so each Region produces signatures that verify with the same public key, without cross-Region calls. Each replica is a fully functional key that works even when its primary key or another Region is unavailable. AWS KMS moves the AWS-generated material between Regions only inside AWS KMS.
    fr: |-
      Les clés multi-Régions associées partagent les mêmes éléments de clé, la même spécification et la même utilisation de clé : chaque Région produit des signatures vérifiables avec la même clé publique, sans appel entre Régions. Chaque réplica est une clé pleinement fonctionnelle qui fonctionne même quand sa clé principale ou une autre Région est indisponible. AWS KMS transporte les éléments générés par AWS entre les Régions uniquement à l'intérieur d'AWS KMS.
  options:
    a:
      en: |-
        Unrelated keys have different key material, so signatures from eu-west-1 and ap-southeast-1 would fail verification against the pinned us-east-1 public key.
      fr: |-
        Des clés non associées ont des éléments de clé différents : les signatures de eu-west-1 et ap-southeast-1 échoueraient à la vérification avec la clé publique épinglée de us-east-1.
    c:
      en: |-
        Regional subordinate CAs are the right design when clients support certificate chains to one root; these devices verify against a single public key and do not process chains.
      fr: |-
        Des CA subordonnées régionales sont la bonne conception quand les clients prennent en charge les chaînes de certificats vers une racine ; ces appareils vérifient avec une clé publique unique et ne traitent pas les chaînes.
    d:
      en: |-
        Imported material is generated and kept outside AWS KMS, which violates the requirement that AWS KMS generate the private key and that it never exist outside AWS KMS.
      fr: |-
        Des éléments importés sont générés et conservés hors d'AWS KMS, ce qui enfreint l'exigence selon laquelle AWS KMS génère la clé privée et qu'elle n'existe jamais hors d'AWS KMS.
references:
  - title: Multi-Region keys in AWS KMS - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html
