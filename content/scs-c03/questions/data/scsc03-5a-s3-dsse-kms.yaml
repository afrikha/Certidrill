id: scsc03-5a-s3-dsse-kms
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany must store classified engineering files in a new Amazon S3 bucket. A government contract requires two independent layers of encryption at rest, with keys whose use the company controls through key policies and audits in AWS CloudTrail. The upload application writes objects with PutObject and sends no encryption headers, and it cannot be changed.

    Which solution will meet these requirements?
  fr: |
    AnyCompany doit stocker des fichiers d'ingénierie classifiés dans un nouveau compartiment Amazon S3. Un contrat gouvernemental exige deux couches indépendantes de chiffrement au repos, avec des clés dont l'entreprise contrôle l'utilisation par des politiques de clé et qu'elle audite dans AWS CloudTrail. L'application de chargement écrit les objets avec PutObject sans envoyer d'en-tête de chiffrement, et elle ne peut pas être modifiée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set the bucket default encryption to SSE-KMS with a customer managed key, and enable S3 Bucket Keys."
        fr: "Définir le chiffrement par défaut du compartiment sur SSE-KMS avec une clé gérée par le client, et activer les clés de compartiment S3."
    - id: b
      text:
        en: "Set the bucket default encryption to DSSE-KMS with a customer managed key."
        fr: "Définir le chiffrement par défaut du compartiment sur DSSE-KMS avec une clé gérée par le client."
    - id: c
      text:
        en: "Enable SSE-C on the bucket, and supply a customer key from AWS KMS in the headers of each request."
        fr: "Activer SSE-C sur le compartiment, et fournir une clé client issue d'AWS KMS dans les en-têtes de chaque requête."
    - id: d
      text:
        en: "Encrypt the files with the Amazon S3 Encryption Client before upload, and keep SSE-S3 as the bucket default encryption."
        fr: "Chiffrer les fichiers avec Amazon S3 Encryption Client avant le chargement, et garder SSE-S3 comme chiffrement par défaut du compartiment."
answer: { optionId: b }
explanation:
  correct:
    en: "DSSE-KMS applies two independent layers of AES-256 encryption: one with a data key generated by AWS KMS and one with a separate key managed by Amazon S3. As the bucket default encryption, it applies to uploads that send no headers, and a customer managed key gives the company key policy control and CloudTrail records of its use. S3 Bucket Keys are not supported with DSSE-KMS."
    fr: "DSSE-KMS applique deux couches indépendantes de chiffrement AES-256 : l'une avec une clé de données générée par AWS KMS et l'autre avec une clé distincte gérée par Amazon S3. Comme chiffrement par défaut du compartiment, il s'applique aux chargements sans en-tête, et une clé gérée par le client donne à l'entreprise le contrôle par politique de clé et des enregistrements CloudTrail de son utilisation. Les clés de compartiment S3 ne sont pas prises en charge avec DSSE-KMS."
  options:
    a:
      en: "SSE-KMS applies a single layer of encryption; S3 Bucket Keys only reduce the number of requests to AWS KMS."
      fr: "SSE-KMS n'applique qu'une seule couche de chiffrement ; les clés de compartiment S3 réduisent seulement le nombre de requêtes à AWS KMS."
    c:
      en: "SSE-C is a single layer, requires the application to send the key in every request, and keys sent this way are not controlled by KMS key policies."
      fr: "SSE-C n'est qu'une seule couche, exige que l'application envoie la clé dans chaque requête, et des clés envoyées ainsi ne sont pas contrôlées par des politiques de clé KMS."
    d:
      en: "Client-side encryption would require changing the upload application, which is not allowed."
      fr: "Le chiffrement côté client exigerait de modifier l'application de chargement, ce qui est interdit."
references:
  - title: Using dual-layer server-side encryption with AWS KMS keys (DSSE-KMS) - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingDSSEncryption.html
