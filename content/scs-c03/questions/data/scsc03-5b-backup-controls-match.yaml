id: scsc03-5b-backup-controls-match
objective: "5.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team is improving the protection of its backups across 40 accounts in AWS Organizations.

    Match each requirement with the AWS feature that meets it. Each feature can be used once or not at all.
  fr: |
    L'équipe de sécurité d'AnyCompany améliore la protection de ses sauvegardes dans 40 comptes d'AWS Organizations.

    Associez chaque exigence à la fonctionnalité AWS qui y répond. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: rb, text: { en: "Recycle Bin retention rules", fr: "Règles de conservation de la Corbeille (Recycle Bin)" } }
    - { id: gd, text: { en: "Malware protection in AWS Backup (Amazon GuardDuty)", fr: "Protection contre les logiciels malveillants dans AWS Backup (Amazon GuardDuty)" } }
    - { id: orgbp, text: { en: "AWS Organizations backup policies", fr: "Politiques de sauvegarde AWS Organizations" } }
    - { id: insp, text: { en: "Amazon Inspector", fr: "Amazon Inspector" } }
    - { id: conf, text: { en: "AWS Config conformance packs", fr: "Packs de conformité AWS Config" } }
  targets:
    - id: t1
      text: { en: "Restore an EBS-backed AMI that an operator deregistered by mistake 2 days ago.", fr: "Restaurer une AMI basée sur EBS qu'un opérateur a désenregistrée par erreur il y a 2 jours." }
    - id: t2
      text: { en: "Check each new recovery point of EC2 instances and S3 buckets for malicious files after the backup completes.", fr: "Vérifier chaque nouveau point de récupération d'instances EC2 et de compartiments S3 à la recherche de fichiers malveillants une fois la sauvegarde terminée." }
    - id: t3
      text: { en: "Apply the same backup plan to every member account so that member account users can view it but not change it.", fr: "Appliquer le même plan de sauvegarde à chaque compte membre, de sorte que les utilisateurs des comptes membres puissent le consulter mais pas le modifier." }
answer:
  mapping: { t1: rb, t2: gd, t3: orgbp }
explanation:
  correct:
    en: "Recycle Bin retains deleted EBS snapshots, EBS volumes and EBS-backed AMIs, including deregistered AMIs, until their retention ends, so they can be restored. AWS Backup can start an Amazon GuardDuty malware scan automatically after each successful backup of EBS, EC2 and S3 resources. A backup policy produces an effective backup plan that appears as an immutable plan in each member account."
    fr: "La Corbeille conserve les instantanés EBS, volumes EBS et AMI basées sur EBS supprimés, y compris les AMI désenregistrées, jusqu'à la fin de leur conservation, ce qui permet de les restaurer. AWS Backup peut lancer automatiquement une analyse Amazon GuardDuty après chaque sauvegarde réussie de ressources EBS, EC2 et S3. Une politique de sauvegarde produit un plan de sauvegarde effectif qui apparaît comme un plan immuable dans chaque compte membre."
  options:
    insp:
      en: "Amazon Inspector scans workloads for software vulnerabilities and network exposure; it does not scan backup recovery points for malware."
      fr: "Amazon Inspector analyse les charges de travail à la recherche de vulnérabilités logicielles et d'exposition réseau ; il n'analyse pas les points de récupération à la recherche de logiciels malveillants."
    conf:
      en: "Conformance packs evaluate resource compliance with AWS Config rules; they do not create or enforce backup plans."
      fr: "Les packs de conformité évaluent la conformité des ressources avec des règles AWS Config ; ils ne créent ni n'imposent de plans de sauvegarde."
references:
  - title: Malware protection in AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/malware-protection.html
  - title: Backup policies
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_backup.html
