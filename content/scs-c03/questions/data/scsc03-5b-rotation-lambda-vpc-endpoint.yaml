id: scsc03-5b-rotation-lambda-vpc-endpoint
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an Amazon RDS for PostgreSQL DB instance in private subnets of a VPC that has no internet gateway and no NAT gateway. A Lambda rotation function for the database secret runs in the same private subnets and can reach the database on port 5432. Rotation fails because the function times out when it calls AWS Secrets Manager. Company policy forbids any internet path from the VPC.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une instance de base de données Amazon RDS for PostgreSQL dans des sous-réseaux privés d'un VPC sans passerelle Internet ni passerelle NAT. Une fonction de rotation Lambda pour le secret de la base de données s'exécute dans les mêmes sous-réseaux privés et peut joindre la base de données sur le port 5432. La rotation échoue parce que la fonction expire lorsqu'elle appelle AWS Secrets Manager. La politique de l'entreprise interdit tout chemin vers Internet depuis le VPC.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a gateway VPC endpoint for Secrets Manager, and associate it with the route tables of the private subnets that host the function."
        fr: "Créer un point de terminaison VPC de passerelle pour Secrets Manager, et l'associer aux tables de routage des sous-réseaux privés qui hébergent la fonction."
    - id: b
      text:
        en: "Create an interface VPC endpoint for Secrets Manager with private DNS enabled, and allow HTTPS to it from the function's security group."
        fr: "Créer un point de terminaison VPC d'interface pour Secrets Manager avec le DNS privé activé, et y autoriser HTTPS depuis le groupe de sécurité de la fonction."
    - id: c
      text:
        en: "Remove the rotation function from the VPC so that it can reach Secrets Manager through the Lambda service network."
        fr: "Retirer la fonction de rotation du VPC pour qu'elle puisse joindre Secrets Manager par le réseau du service Lambda."
    - id: d
      text:
        en: "Add a statement to the secret's resource policy that allows secretsmanager:PutSecretValue when aws:SourceVpc equals the VPC ID."
        fr: "Ajouter à la politique de ressource du secret une instruction qui autorise secretsmanager:PutSecretValue lorsque aws:SourceVpc est égal à l'ID du VPC."
answer: { optionId: b }
explanation:
  correct:
    en: "A rotation function calls both the database and Secrets Manager, so it needs a network path to each. An interface VPC endpoint, powered by AWS PrivateLink, gives private access to the Secrets Manager API without an internet gateway or NAT device, and private DNS lets the function keep using the default Regional endpoint name."
    fr: "Une fonction de rotation appelle à la fois la base de données et Secrets Manager : elle a besoin d'un chemin réseau vers chacun. Un point de terminaison VPC d'interface, basé sur AWS PrivateLink, fournit un accès privé à l'API Secrets Manager sans passerelle Internet ni périphérique NAT, et le DNS privé permet à la fonction de continuer à utiliser le nom du point de terminaison régional par défaut."
  options:
    a:
      en: "Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB; Secrets Manager is reached through an interface endpoint."
      fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB ; Secrets Manager se joint par un point de terminaison d'interface."
    c:
      en: "Outside the VPC, the function can no longer reach the DB instance in the private subnets, so it cannot change the password."
      fr: "Hors du VPC, la fonction ne peut plus joindre l'instance de base de données dans les sous-réseaux privés : elle ne peut pas modifier le mot de passe."
    d:
      en: "A policy condition does not create a network path; the calls still time out because there is no route to Secrets Manager."
      fr: "Une condition de politique ne crée pas de chemin réseau ; les appels expirent toujours faute de route vers Secrets Manager."
references:
  - title: Using an AWS Secrets Manager VPC endpoint
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/vpc-endpoint-overview.html
