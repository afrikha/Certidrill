id: scsc03-5c-mask-old-events
objective: "5.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At 10:00, a security engineer at AnyCompany creates a data protection policy for the CloudWatch Logs log group /app/orders. The policy uses the managed data identifier for credit card numbers and has no findings destination. At 10:30, an analyst who does not have the logs:Unmask permission sees card numbers masked in new log events, but sees full card numbers in log events that were written at 09:00.

    What is the reason for this behavior?
  fr: |
    À 10 h 00, un ingénieur sécurité d'AnyCompany crée une politique de protection des données pour le groupe de journaux CloudWatch Logs /app/orders. La politique utilise l'identifiant de données géré pour les numéros de carte de crédit et n'a aucune destination de résultats. À 10 h 30, une analyste qui ne dispose pas de l'autorisation logs:Unmask voit les numéros de carte masqués dans les nouveaux événements de journal, mais voit les numéros complets dans les événements de journal écrits à 9 h 00.

    Quelle est la raison de ce comportement ?
body:
  options:
    - id: a
      text:
        en: |-
          A data protection policy masks data only in CloudWatch Logs Insights queries, and the analyst opened the 09:00 events in the log stream view.
        fr: |-
          Une politique de protection des données ne masque les données que dans les requêtes CloudWatch Logs Insights, et l'analyste a ouvert les événements de 9 h 00 dans la vue du flux de journaux.
    - id: b
      text:
        en: |-
          The policy has no findings destination, so the de-identify operation is applied only to events that also produce an audit finding.
        fr: |-
          La politique n'a aucune destination de résultats : l'opération de désidentification ne s'applique donc qu'aux événements qui produisent aussi un résultat d'audit.
    - id: c
      text:
        en: |-
          Sensitive data is detected and masked when log events are ingested, so events ingested before the policy was created are not masked.
        fr: |-
          Les données sensibles sont détectées et masquées lors de l'ingestion des événements de journal : les événements ingérés avant la création de la politique ne sont pas masqués.
    - id: d
      text:
        en: |-
          CloudWatch Logs applies a new data protection policy to existing log events in the background, which can take up to 24 hours.
        fr: |-
          CloudWatch Logs applique une nouvelle politique de protection des données aux événements de journal existants en arrière-plan, ce qui peut prendre jusqu'à 24 heures.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CloudWatch Logs detects and masks sensitive data when it is ingested into the log group. Log events ingested before the data protection policy was set are not masked, so the 09:00 events stay readable by everyone who can read the log group.
    fr: |-
      CloudWatch Logs détecte et masque les données sensibles lors de leur ingestion dans le groupe de journaux. Les événements de journal ingérés avant la définition de la politique de protection des données ne sont pas masqués : les événements de 9 h 00 restent lisibles par toute personne autorisée à lire le groupe de journaux.
  options:
    a:
      en: |-
        Masking applies at all egress points, including the console, CloudWatch Logs Insights, metric filters, and subscription filters; the new events are masked in the same view.
      fr: |-
        Le masquage s'applique à tous les points de sortie, dont la console, CloudWatch Logs Insights, les filtres de métrique et les filtres d'abonnement ; les nouveaux événements sont masqués dans la même vue.
    b:
      en: |-
        Findings destinations are optional; the selected data types are masked even when audit findings are not sent to any service.
      fr: |-
        Les destinations de résultats sont facultatives ; les types de données sélectionnés sont masqués même quand les résultats d'audit ne sont envoyés à aucun service.
    d:
      en: |-
        A data protection policy never applies retroactively; events ingested before the policy remain unmasked.
      fr: |-
        Une politique de protection des données ne s'applique jamais rétroactivement ; les événements ingérés avant la politique restent non masqués.
references:
  - title: Help protect sensitive log data with masking - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
