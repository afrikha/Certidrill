id: scsc03-5a-s3-sourcevpce-bucket
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany processes payroll files on Amazon EC2 instances in private subnets of one VPC. The instances reach Amazon S3 through a gateway endpoint with the ID vpce-0a1b2c3d4e5f67890, and the VPC has no NAT gateway. The security team requires that the payroll bucket accept requests only when they arrive through this endpoint, even from principals whose IAM policies allow S3 access.

    Which bucket policy statement will meet this requirement?
  fr: |
    AnyCompany traite des fichiers de paie sur des instances Amazon EC2 situées dans des sous-réseaux privés d'un VPC. Les instances accèdent à Amazon S3 par un point de terminaison de passerelle dont l'ID est vpce-0a1b2c3d4e5f67890, et le VPC n'a pas de passerelle NAT. L'équipe de sécurité exige que le compartiment de paie n'accepte les requêtes que lorsqu'elles arrivent par ce point de terminaison, même de la part de principaux dont les politiques IAM autorisent l'accès à S3.

    Quelle instruction de politique de compartiment répond à cette exigence ?
body:
  options:
    - id: a
      text:
        en: "Deny s3:* for all principals when aws:SourceIp is not in the VPC CIDR block 10.20.0.0/16."
        fr: "Refuser s3:* pour tous les principaux lorsque aws:SourceIp n'est pas dans le bloc CIDR du VPC 10.20.0.0/16."
    - id: b
      text:
        en: "Allow s3:* for all principals when aws:SourceVpce equals vpce-0a1b2c3d4e5f67890."
        fr: "Autoriser s3:* pour tous les principaux lorsque aws:SourceVpce est égal à vpce-0a1b2c3d4e5f67890."
    - id: c
      text:
        en: "Deny s3:* for all principals when aws:SourceVpce does not equal vpce-0a1b2c3d4e5f67890."
        fr: "Refuser s3:* pour tous les principaux lorsque aws:SourceVpce n'est pas égal à vpce-0a1b2c3d4e5f67890."
    - id: d
      text:
        en: "Deny s3:* for all principals when aws:SourceVpc equals the ID of the payroll VPC."
        fr: "Refuser s3:* pour tous les principaux lorsque aws:SourceVpc est égal à l'ID du VPC de paie."
answer: { optionId: c }
explanation:
  correct:
    en: "aws:SourceVpce carries the ID of the VPC endpoint that a request came through. A Deny with StringNotEquals on that key rejects every request that does not use the endpoint, and an explicit Deny overrides any Allow in IAM policies. Such a policy also blocks console access to the bucket, so it must be tested carefully."
    fr: "aws:SourceVpce contient l'ID du point de terminaison de VPC par lequel une requête est arrivée. Un Deny avec StringNotEquals sur cette clé rejette toute requête qui n'utilise pas le point de terminaison, et un refus explicite l'emporte sur toute autorisation des politiques IAM. Une telle politique bloque aussi l'accès au compartiment depuis la console : elle doit être testée avec soin."
  options:
    a:
      en: "aws:SourceIp cannot be used for requests that traverse a VPC endpoint, so this statement would deny the instances too; aws:VpcSourceIp is the key for private addresses."
      fr: "aws:SourceIp n'est pas utilisable pour les requêtes qui passent par un point de terminaison de VPC : cette instruction refuserait aussi les instances. La clé pour les adresses privées est aws:VpcSourceIp."
    b:
      en: "An Allow statement does not restrict access, because principals of the account still get access through their IAM policies from any network."
      fr: "Une instruction Allow ne restreint pas l'accès, car les principaux du compte obtiennent toujours l'accès par leurs politiques IAM depuis n'importe quel réseau."
    d:
      en: "This condition is inverted: it denies the requests that come from the payroll VPC and allows all others."
      fr: "Cette condition est inversée : elle refuse les requêtes qui viennent du VPC de paie et autorise toutes les autres."
references:
  - title: Controlling access from VPC endpoints with bucket policies - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html
