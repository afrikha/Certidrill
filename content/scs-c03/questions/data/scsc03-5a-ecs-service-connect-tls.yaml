id: scsc03-5a-ecs-service-connect-tls
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 30 services on Amazon ECS that communicate through ECS Service Connect. A new requirement says that service-to-service traffic must be encrypted with TLS, that certificates must be issued and rotated automatically by AWS, and that the company must not operate any certificate revocation infrastructure. Costs must be kept as low as possible.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 30 services sur Amazon ECS qui communiquent par ECS Service Connect. Une nouvelle exigence impose que le trafic entre services soit chiffré avec TLS, que les certificats soient émis et renouvelés automatiquement par AWS, et que l'entreprise n'exploite aucune infrastructure de révocation de certificats. Les coûts doivent être aussi bas que possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable Service Connect TLS with an AWS Private CA in general-purpose mode, and set the Secrets Manager rotation of the certificates to 30 days."
        fr: "Activer le TLS de Service Connect avec une AWS Private CA en mode général (general-purpose), et définir la rotation Secrets Manager des certificats à 30 jours."
    - id: b
      text:
        en: "Request public ACM certificates for each service name, and reference them in the Service Connect configuration of each service."
        fr: "Demander des certificats ACM publics pour chaque nom de service, et les référencer dans la configuration Service Connect de chaque service."
    - id: c
      text:
        en: "Store a self-signed certificate for each service in Secrets Manager, and have each task load it at startup to serve TLS."
        fr: "Stocker un certificat auto-signé par service dans Secrets Manager, et faire charger ce certificat par chaque tâche au démarrage pour servir TLS."
    - id: d
      text:
        en: "Enable Service Connect TLS with an AWS Private CA in short-lived certificate mode, and give ECS the infrastructure IAM role that it requires."
        fr: "Activer le TLS de Service Connect avec une AWS Private CA en mode certificats de courte durée (short-lived), et donner à ECS le rôle IAM d'infrastructure requis."
answer: { optionId: d }
explanation:
  correct:
    en: "Service Connect TLS issues certificates from AWS Private CA, stores the private keys in Secrets Manager through the ECS infrastructure role, and rotates the certificates every five days by default. Short-lived mode, with certificates valid for at most seven days, costs less and is recommended; Service Connect relies on short-lived certificates instead of revocation."
    fr: "Le TLS de Service Connect émet des certificats depuis AWS Private CA, stocke les clés privées dans Secrets Manager par le rôle d'infrastructure ECS, et renouvelle les certificats tous les cinq jours par défaut. Le mode courte durée, avec des certificats valides au plus sept jours, coûte moins cher et est recommandé ; Service Connect s'appuie sur des certificats de courte durée au lieu de la révocation."
  options:
    a:
      en: "General-purpose mode costs more, and a rotation period longer than seven days makes the communication between the applications fail."
      fr: "Le mode général coûte plus cher, et une période de rotation de plus de sept jours fait échouer la communication entre les applications."
    b:
      en: "Service Connect TLS issues its certificates from AWS Private CA; public ACM certificates are not used for this traffic."
      fr: "Le TLS de Service Connect émet ses certificats depuis AWS Private CA : les certificats ACM publics ne sont pas utilisés pour ce trafic."
    c:
      en: "Self-signed certificates loaded by the tasks are issued and rotated by the company, not by AWS."
      fr: "Des certificats auto-signés chargés par les tâches sont émis et renouvelés par l'entreprise, pas par AWS."
references:
  - title: Encrypt Amazon ECS Service Connect traffic - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-connect-tls.html
