id: scsc03-5b-delete-material-revoke
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's contract with a regulator requires a "kill switch": the company must be able to make a KMS key that protects customer data unusable right away, and to restore it later without losing data. While the key is unusable, administrators of the AWS account must not be able to make it usable again on their own; only the company's key custodians, who hold the key material in an on-premises HSM, can restore it.

    Which solution will meet these requirements?
  fr: |
    Le contrat d'AnyCompany avec un régulateur exige un « coupe-circuit » : l'entreprise doit pouvoir rendre immédiatement inutilisable une clé KMS qui protège les données des clients, et la restaurer plus tard sans perte de données. Tant que la clé est inutilisable, les administrateurs du compte AWS ne doivent pas pouvoir la rendre de nouveau utilisable par eux-mêmes ; seuls les dépositaires de clés de l'entreprise, qui détiennent les éléments de clé dans un HSM sur site, peuvent la restaurer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use a KMS key with AWS_KMS origin, and call DisableKey when the kill switch is needed."
        fr: "Utiliser une clé KMS d'origine AWS_KMS, et appeler DisableKey lorsque le coupe-circuit est nécessaire."
    - id: b
      text:
        en: "Use a KMS key with AWS_KMS origin, and call ScheduleKeyDeletion with a 7-day waiting period when the kill switch is needed."
        fr: "Utiliser une clé KMS d'origine AWS_KMS, et appeler ScheduleKeyDeletion avec une période d'attente de 7 jours lorsque le coupe-circuit est nécessaire."
    - id: c
      text:
        en: "Use a KMS key with imported key material, call DeleteImportedKeyMaterial when the kill switch is needed, and reimport the same key material to restore the key."
        fr: "Utiliser une clé KMS avec des éléments de clé importés, appeler DeleteImportedKeyMaterial lorsque le coupe-circuit est nécessaire, et réimporter les mêmes éléments de clé pour restaurer la clé."
    - id: d
      text:
        en: "Use a KMS key with imported key material, and call ScheduleKeyDeletion with a 7-day waiting period when the kill switch is needed."
        fr: "Utiliser une clé KMS avec des éléments de clé importés, et appeler ScheduleKeyDeletion avec une période d'attente de 7 jours lorsque le coupe-circuit est nécessaire."
answer: { optionId: c }
explanation:
  correct:
    en: "Deleting imported key material makes the KMS key unusable right away, subject to eventual consistency, and changes its state to PendingImport. The key can be used again only after the same key material is imported, which only the custodians who hold the material can do."
    fr: "Supprimer des éléments de clé importés rend la clé KMS immédiatement inutilisable, sous réserve de la cohérence à terme, et fait passer son état à PendingImport. La clé ne peut être réutilisée qu'après l'importation des mêmes éléments de clé, ce que seuls les dépositaires qui détiennent ces éléments peuvent faire."
  options:
    a:
      en: "Any administrator with kms:EnableKey can enable the key again without the custodians."
      fr: "Tout administrateur disposant de kms:EnableKey peut réactiver la clé sans les dépositaires."
    b:
      en: "An administrator can cancel the deletion during the waiting period, and if it is not canceled, the key and its data become permanently unrecoverable."
      fr: "Un administrateur peut annuler la suppression pendant la période d'attente, et si elle n'est pas annulée, la clé et ses données deviennent définitivement irrécupérables."
    d:
      en: "Administrators can cancel the scheduled deletion on their own, and after the waiting period the KMS key and its metadata are permanently deleted, so it cannot be restored."
      fr: "Les administrateurs peuvent annuler eux-mêmes la suppression planifiée, et après la période d'attente, la clé KMS et ses métadonnées sont définitivement supprimées : elle ne peut pas être restaurée."
references:
  - title: Delete imported key material
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-delete-key-material.html
