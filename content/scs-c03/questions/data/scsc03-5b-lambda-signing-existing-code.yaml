id: scsc03-5b-lambda-signing-existing-code
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 120 AWS Lambda functions that are deployed as .zip file archives. Last week, a security engineer attached to every function a code signing configuration that allows only the company's AWS Signer signing profile, with the untrusted artifact policy set to Enforce. An audit now finds that 30 functions are still running code packages that were never signed. The security team requires that every function run only signed code by the end of the week.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 120 fonctions AWS Lambda déployées sous forme d'archives de fichiers .zip. La semaine dernière, un ingénieur sécurité a associé à chaque fonction une configuration de signature de code qui n'autorise que le profil de signature AWS Signer de l'entreprise, avec la politique d'artefact non approuvé définie sur Enforce. Un audit constate que 30 fonctions exécutent encore des packages de code qui n'ont jamais été signés. L'équipe de sécurité exige que chaque fonction n'exécute que du code signé d'ici la fin de la semaine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Detach the code signing configuration from the 30 functions and attach it again so that Lambda validates their current code packages."
        fr: "Dissocier la configuration de signature de code des 30 fonctions puis l'associer de nouveau pour que Lambda valide leurs packages de code actuels."
    - id: b
      text:
        en: "Sign the current code package of each of the 30 functions with the company's signing profile, and deploy the signed packages to the functions."
        fr: "Signer le package de code actuel de chacune des 30 fonctions avec le profil de signature de l'entreprise, et déployer les packages signés sur les fonctions."
    - id: c
      text:
        en: "Revoke the company's signing profile and create a new one so that Lambda stops every function that runs unsigned code."
        fr: "Révoquer le profil de signature de l'entreprise et en créer un nouveau pour que Lambda arrête toutes les fonctions qui exécutent du code non signé."
    - id: d
      text:
        en: "Change the untrusted artifact policy of the configuration to Warn, and use the SignatureValidationErrors metric to find and stop the unsigned functions."
        fr: "Passer la politique d'artefact non approuvé de la configuration sur Warn, et utiliser la métrique SignatureValidationErrors pour trouver et arrêter les fonctions non signées."
answer: { optionId: b }
explanation:
  correct:
    en: "A code signing configuration only prevents new deployments of unsigned code. Code that was already deployed before the configuration was attached keeps running until a new code package is deployed, so each function must receive a signed deployment."
    fr: "Une configuration de signature de code empêche seulement les nouveaux déploiements de code non signé. Le code déjà déployé avant l'association de la configuration continue de s'exécuter jusqu'au déploiement d'un nouveau package de code : chaque fonction doit donc recevoir un déploiement signé."
  options:
    a:
      en: "Lambda validates signatures only when code is deployed; attaching the configuration again does not trigger a check of the running code."
      fr: "Lambda ne valide les signatures qu'au déploiement du code ; associer de nouveau la configuration ne déclenche pas de contrôle du code en cours d'exécution."
    c:
      en: "Revocation affects packages signed by the profile, not unsigned code, and it would block legitimate signed deployments of the other functions."
      fr: "La révocation concerne les packages signés par le profil, pas le code non signé, et elle bloquerait les déploiements signés légitimes des autres fonctions."
    d:
      en: "Warn weakens the control by allowing unsigned deployments, and the metric reports failed deployment checks, not code that is already running."
      fr: "Warn affaiblit le contrôle en autorisant les déploiements non signés, et la métrique signale des contrôles de déploiement en échec, pas du code déjà en cours d'exécution."
references:
  - title: Using code signing to verify code integrity with Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-codesigning.html
