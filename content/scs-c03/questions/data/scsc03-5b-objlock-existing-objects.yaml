id: scsc03-5b-objlock-existing-objects
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has an existing Amazon S3 bucket that holds 80 million audit evidence objects. S3 Versioning is not enabled on the bucket. A new policy requires that all existing objects and all objects added later be protected in compliance mode for 3 years from now or from their creation, whichever applies. The team wants to keep the bucket name and to use the fewest manual operations.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède un compartiment (bucket) Amazon S3 existant qui contient 80 millions d'objets de preuves d'audit. La gestion des versions S3 n'est pas activée sur le compartiment. Une nouvelle politique exige que tous les objets existants et tous les objets ajoutés ensuite soient protégés en mode conformité (compliance) pendant 3 ans à partir de maintenant ou de leur création, selon le cas. L'équipe veut conserver le nom du compartiment et effectuer le moins d'opérations manuelles possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable S3 Object Lock on the bucket with a default retention of 3 years in compliance mode. The default retention then applies to the existing objects."
        fr: "Activer S3 Object Lock sur le compartiment avec une conservation par défaut de 3 ans en mode conformité. La conservation par défaut s'applique alors aux objets existants."
    - id: b
      text:
        en: "Enable S3 Versioning, then enable S3 Object Lock with a default retention of 3 years in compliance mode. Run an S3 Batch Operations Object Lock retention job on an inventory of the existing objects."
        fr: "Activer la gestion des versions S3, puis activer S3 Object Lock avec une conservation par défaut de 3 ans en mode conformité. Exécuter une tâche S3 Batch Operations de conservation Object Lock sur un inventaire des objets existants."
    - id: c
      text:
        en: "Enable S3 Versioning, then enable S3 Object Lock with a default retention of 3 years in compliance mode. Run an S3 Batch Operations job that places a legal hold on each existing object."
        fr: "Activer la gestion des versions S3, puis activer S3 Object Lock avec une conservation par défaut de 3 ans en mode conformité. Exécuter une tâche S3 Batch Operations qui place une conservation légale sur chaque objet existant."
    - id: d
      text:
        en: "Create a new bucket with S3 Object Lock and a default retention of 3 years in compliance mode, copy all objects to it, and delete the original bucket."
        fr: "Créer un nouveau compartiment avec S3 Object Lock et une conservation par défaut de 3 ans en mode conformité, y copier tous les objets, et supprimer le compartiment d'origine."
answer: { optionId: b }
explanation:
  correct:
    en: "Object Lock works only with versioned buckets and can be enabled on an existing bucket. The default retention applies to objects placed in the bucket after it is set, so the existing objects need an S3 Batch Operations Object Lock retention job, which applies compliance mode retention to every object in the manifest."
    fr: "Object Lock ne fonctionne qu'avec des compartiments versionnés et peut être activé sur un compartiment existant. La conservation par défaut s'applique aux objets placés dans le compartiment après sa définition : les objets existants ont donc besoin d'une tâche S3 Batch Operations de conservation Object Lock, qui applique une conservation en mode conformité à chaque objet du manifeste."
  options:
    a:
      en: "Object Lock requires S3 Versioning first, and a default retention does not lock objects that were already in the bucket."
      fr: "Object Lock exige d'abord la gestion des versions S3, et une conservation par défaut ne verrouille pas les objets déjà présents dans le compartiment."
    c:
      en: "A legal hold has no expiration and can be removed by any principal with s3:PutObjectLegalHold, so it is not a 3-year compliance mode retention."
      fr: "Une conservation légale n'a pas d'expiration et peut être retirée par tout principal disposant de s3:PutObjectLegalHold : ce n'est pas une conservation de 3 ans en mode conformité."
    d:
      en: "Object Lock can be enabled on the existing bucket, so recreating it and copying 80 million objects adds work, and the data would end up in a bucket with a different name."
      fr: "Object Lock peut être activé sur le compartiment existant : le recréer et copier 80 millions d'objets ajoute du travail, et les données se retrouveraient dans un compartiment portant un autre nom."
references:
  - title: Configuring S3 Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-configure.html
  - title: S3 Object Lock retention
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/batch-ops-retention-date.html
