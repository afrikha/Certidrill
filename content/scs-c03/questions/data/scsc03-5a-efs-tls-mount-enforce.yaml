id: scsc03-5a-efs-tls-mount-enforce
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany mounts an Amazon EFS file system from Amazon EC2 Linux instances in three Availability Zones. The instances have the amazon-efs-utils package installed. A compliance rule requires that all NFS traffic to the file system be encrypted in transit. Any client that tries to mount the file system without encryption must be refused, including instances that other teams will launch later.

    Which solution will meet these requirements?
  fr: |
    AnyCompany monte un système de fichiers Amazon EFS depuis des instances Amazon EC2 Linux réparties dans trois zones de disponibilité. Le package amazon-efs-utils est installé sur les instances. Une règle de conformité exige que tout le trafic NFS vers le système de fichiers soit chiffré en transit. Tout client qui tente de monter le système de fichiers sans chiffrement doit être refusé, y compris les instances que d'autres équipes lanceront plus tard.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a new file system with encryption at rest under a customer managed KMS key, and mount it with the EFS mount helper on every instance."
        fr: "Créer un nouveau système de fichiers avec chiffrement au repos sous une clé KMS gérée par le client, et le monter avec l'assistant de montage EFS sur chaque instance."
    - id: b
      text:
        en: "Allow inbound TCP 2049 on the mount target security groups only from the instance security groups, and mount with the standard NFS client."
        fr: "N'autoriser le trafic entrant TCP 2049 sur les groupes de sécurité des cibles de montage que depuis les groupes de sécurité des instances, et monter avec le client NFS standard."
    - id: c
      text:
        en: "Mount the file system with the EFS mount helper and the tls option on every instance, and enable Amazon GuardDuty to report unencrypted mounts."
        fr: "Monter le système de fichiers avec l'assistant de montage EFS et l'option tls sur chaque instance, et activer Amazon GuardDuty pour signaler les montages non chiffrés."
    - id: d
      text:
        en: "Mount the file system with the EFS mount helper and the tls option, and add a file system policy that denies all actions when aws:SecureTransport is false."
        fr: "Monter le système de fichiers avec l'assistant de montage EFS et l'option tls, et ajouter une politique de système de fichiers qui refuse toutes les actions lorsque aws:SecureTransport vaut false."
answer: { optionId: d }
explanation:
  correct:
    en: "The EFS mount helper with the tls option sets up a TLS tunnel (efs-proxy or stunnel) so that all NFS traffic is encrypted. EFS supports the aws:SecureTransport condition key, so a file system policy that denies requests without TLS refuses any client that mounts without encryption, including future instances."
    fr: "L'assistant de montage EFS avec l'option tls établit un tunnel TLS (efs-proxy ou stunnel) pour que tout le trafic NFS soit chiffré. EFS prend en charge la clé de condition aws:SecureTransport : une politique de système de fichiers qui refuse les requêtes sans TLS rejette tout client qui monte sans chiffrement, y compris les futures instances."
  options:
    a:
      en: "Encryption at rest protects stored data only; it neither encrypts NFS traffic nor refuses clients that mount without TLS."
      fr: "Le chiffrement au repos ne protège que les données stockées : il ne chiffre pas le trafic NFS et ne refuse pas les clients qui montent sans TLS."
    b:
      en: "Security groups restrict which hosts can connect, but the NFS traffic stays unencrypted."
      fr: "Les groupes de sécurité limitent les hôtes qui peuvent se connecter, mais le trafic NFS reste non chiffré."
    c:
      en: "The tls option protects only the instances where it is used, and GuardDuty does not prevent unencrypted mounts, so new instances could still mount in clear text."
      fr: "L'option tls ne protège que les instances où elle est utilisée, et GuardDuty n'empêche pas les montages non chiffrés : de nouvelles instances pourraient encore monter en clair."
references:
  - title: Encrypting data in transit - Amazon Elastic File System
    url: https://docs.aws.amazon.com/efs/latest/ug/encryption-in-transit.html
  - title: Using IAM to control access to file systems - Amazon Elastic File System
    url: https://docs.aws.amazon.com/efs/latest/ug/iam-access-control-nfs-efs.html
