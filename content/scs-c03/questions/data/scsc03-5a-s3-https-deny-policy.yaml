id: scsc03-5a-s3-https-deny-policy
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores regulatory reports in an Amazon S3 bucket named example-reports in account 111122223333. A security review finds that some applications still download objects over HTTP. The IAM policies of the application roles allow s3:GetObject and s3:PutObject on the bucket, and the bucket policy contains only the following statement:

    ```json
    {
      "Sid": "AllowTLSOnly",
      "Effect": "Allow",
      "Principal": { "AWS": "arn:aws:iam::111122223333:root" },
      "Action": "s3:GetObject",
      "Resource": "arn:aws:s3:::example-reports/*",
      "Condition": { "Bool": { "aws:SecureTransport": "true" } }
    }
    ```

    The company must reject every request to the bucket and its objects that is not sent over HTTPS, whatever the identity-based policies of the callers allow.

    Which change will meet this requirement?
  fr: |
    AnyCompany stocke des rapports réglementaires dans un compartiment (bucket) Amazon S3 nommé example-reports, dans le compte 111122223333. Une revue de sécurité constate que certaines applications téléchargent encore des objets en HTTP. Les politiques IAM des rôles des applications autorisent s3:GetObject et s3:PutObject sur le compartiment, et la politique de compartiment ne contient que l'instruction suivante :

    ```json
    {
      "Sid": "AllowTLSOnly",
      "Effect": "Allow",
      "Principal": { "AWS": "arn:aws:iam::111122223333:root" },
      "Action": "s3:GetObject",
      "Resource": "arn:aws:s3:::example-reports/*",
      "Condition": { "Bool": { "aws:SecureTransport": "true" } }
    }
    ```

    L'entreprise doit rejeter toute requête vers le compartiment et ses objets qui n'est pas envoyée en HTTPS, quelles que soient les autorisations des politiques basées sur l'identité des appelants.

    Quelle modification répond à cette exigence ?
body:
  options:
    - id: a
      text:
        en: "Keep the Allow statement and add a NumericGreaterThanEquals condition on s3:TlsVersion with the value 1.2 to it."
        fr: "Conserver l'instruction Allow et lui ajouter une condition NumericGreaterThanEquals sur s3:TlsVersion avec la valeur 1.2."
    - id: b
      text:
        en: "Replace the statement with a Deny statement for s3:* on the bucket and its objects, for all principals, when aws:SecureTransport is false."
        fr: "Remplacer l'instruction par une instruction Deny pour s3:* sur le compartiment et ses objets, pour tous les principaux, lorsque aws:SecureTransport vaut false."
    - id: c
      text:
        en: "Replace the statement with a Deny statement for s3:GetObject on the objects, for all principals, when aws:SecureTransport is true."
        fr: "Remplacer l'instruction par une instruction Deny pour s3:GetObject sur les objets, pour tous les principaux, lorsque aws:SecureTransport vaut true."
    - id: d
      text:
        en: "Attach a permissions boundary to the application roles that allows s3:* only when aws:SecureTransport is true."
        fr: "Attacher aux rôles des applications une limite d'autorisations qui n'autorise s3:* que lorsque aws:SecureTransport vaut true."
answer: { optionId: b }
explanation:
  correct:
    en: "Within the same account, an identity-based policy that allows s3:GetObject is enough for access, so an Allow statement with a condition never blocks HTTP requests. Only an explicit Deny overrides every Allow. A Deny on s3:* for the bucket and object ARNs when aws:SecureTransport is false rejects every HTTP request, whoever the caller is."
    fr: "Dans un même compte, une politique basée sur l'identité qui autorise s3:GetObject suffit pour obtenir l'accès : une instruction Allow avec condition ne bloque donc jamais les requêtes HTTP. Seul un refus explicite (Deny) l'emporte sur toutes les autorisations. Un Deny sur s3:* pour les ARN du compartiment et des objets lorsque aws:SecureTransport vaut false rejette toute requête HTTP, quel que soit l'appelant."
  options:
    a:
      en: "The statement is still an Allow, so the roles keep HTTP access through their identity-based policies; s3:TlsVersion only evaluates the TLS version of HTTPS requests."
      fr: "L'instruction reste un Allow : les rôles conservent l'accès HTTP par leurs politiques basées sur l'identité. De plus, s3:TlsVersion n'évalue que la version TLS des requêtes HTTPS."
    c:
      en: "aws:SecureTransport is true for HTTPS requests, so this statement blocks the encrypted downloads and leaves HTTP open; it also ignores the other S3 actions."
      fr: "aws:SecureTransport vaut true pour les requêtes HTTPS : cette instruction bloque les téléchargements chiffrés et laisse HTTP ouvert. Elle ignore aussi les autres actions S3."
    d:
      en: "A permissions boundary restricts only the roles it is attached to; other principals, including roles created later, could still use HTTP."
      fr: "Une limite d'autorisations ne restreint que les rôles auxquels elle est attachée : d'autres principaux, y compris des rôles créés plus tard, pourraient encore utiliser HTTP."
references:
  - title: Examples of Amazon S3 bucket policies - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies.html
