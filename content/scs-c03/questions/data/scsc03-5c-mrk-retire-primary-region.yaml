id: scsc03-5c-mrk-retire-primary-region
objective: "5.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses a symmetric multi-Region customer managed key with key material generated by AWS KMS for client-side encryption. The primary key is in us-west-1, with replica keys in us-east-2 and eu-west-1, and automatic key rotation is enabled. The company is closing all its workloads in us-west-1 and must delete every KMS key in that Region. Data encrypted under the key must remain decryptable in us-east-2 and eu-west-1, and automatic rotation must continue.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise une clé multi-Région symétrique gérée par le client, avec des éléments de clé générés par AWS KMS, pour le chiffrement côté client. La clé principale se trouve dans us-west-1, avec des clés de réplica dans us-east-2 et eu-west-1, et la rotation automatique est activée. L'entreprise ferme toutes ses charges de travail dans us-west-1 et doit supprimer toutes les clés KMS de cette Région. Les données chiffrées sous la clé doivent rester déchiffrables dans us-east-2 et eu-west-1, et la rotation automatique doit continuer.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Schedule the deletion of the primary key in us-west-1, and let AWS KMS promote the replica key in us-east-2 to primary key when the deletion completes.
        fr: |-
          Planifier la suppression de la clé principale dans us-west-1, et laisser AWS KMS promouvoir la clé de réplica de us-east-2 en clé principale à la fin de la suppression.
    - id: b
      text:
        en: |-
          Call UpdatePrimaryRegion to make the key in us-east-2 the primary key, and then schedule the deletion of the key in us-west-1, which is now a replica key.
        fr: |-
          Appeler UpdatePrimaryRegion pour faire de la clé de us-east-2 la clé principale, puis planifier la suppression de la clé de us-west-1, qui est désormais une clé de réplica.
    - id: c
      text:
        en: |-
          Create a new multi-Region primary key in us-east-2 with a replica in eu-west-1, and schedule the deletion of all the keys of the existing set.
        fr: |-
          Créer une nouvelle clé principale multi-Région dans us-east-2 avec un réplica dans eu-west-1, et planifier la suppression de toutes les clés de l'ensemble existant.
    - id: d
      text:
        en: |-
          Disable the primary key in us-west-1 and keep it, because replica keys stop working when their primary key is deleted.
        fr: |-
          Désactiver la clé principale dans us-west-1 et la conserver, car les clés de réplica cessent de fonctionner quand leur clé principale est supprimée.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      UpdatePrimaryRegion converts a replica key to the primary key and the former primary key to a replica, which is the documented way to delete the current primary key while keeping the replicas. Rotation is controlled from the primary key, so moving the primary to us-east-2 keeps automatic rotation for the set, and all keys keep the same key material and key ID.
    fr: |-
      UpdatePrimaryRegion convertit une clé de réplica en clé principale et l'ancienne clé principale en réplica, ce qui est la méthode documentée pour supprimer la clé principale actuelle tout en conservant les réplicas. La rotation se pilote depuis la clé principale : déplacer la clé principale vers us-east-2 conserve la rotation automatique de l'ensemble, et toutes les clés gardent les mêmes éléments de clé et le même ID de clé.
  options:
    a:
      en: |-
        AWS KMS never promotes a replica automatically, and it does not delete a primary key until all its replica keys are deleted.
      fr: |-
        AWS KMS ne promeut jamais un réplica automatiquement, et il ne supprime pas une clé principale tant que toutes ses clés de réplica ne sont pas supprimées.
    c:
      en: |-
        Unrelated multi-Region keys have different key material, so the new keys cannot decrypt data encrypted under the existing set, and deleting the old keys makes that data unrecoverable.
      fr: |-
        Des clés multi-Régions non associées ont des éléments de clé différents : les nouvelles clés ne peuvent pas déchiffrer les données chiffrées sous l'ensemble existant, et supprimer les anciennes clés rend ces données irrécupérables.
    d:
      en: |-
        Replica keys can be used even when their primary key is disabled, but keeping the key violates the requirement to delete every key in us-west-1.
      fr: |-
        Les clés de réplica restent utilisables même quand leur clé principale est désactivée, mais conserver la clé enfreint l'exigence de supprimer toutes les clés de us-west-1.
references:
  - title: Change the primary key in a set of multi-Region keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-update.html
  - title: Multi-Region keys in AWS KMS - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html
