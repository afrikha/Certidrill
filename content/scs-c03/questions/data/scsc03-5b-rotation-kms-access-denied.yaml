id: scsc03-5b-rotation-kms-access-denied
objective: "5.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany rotates a database secret with a custom Lambda rotation function. To meet a new policy, a security engineer changed the secret's encryption key from aws/secretsmanager to a customer managed key whose key policy allows only the security team's role. Since then, every rotation attempt fails. The function's logs show that Secrets Manager invokes the function and that the createSecret step fails with an AccessDeniedException from AWS KMS when it calls GetSecretValue and PutSecretValue.

    Which change will fix rotation while following least privilege?
  fr: |
    AnyCompany effectue la rotation d'un secret de base de données avec une fonction de rotation Lambda personnalisée. Pour respecter une nouvelle politique, un ingénieur sécurité a remplacé la clé de chiffrement du secret, aws/secretsmanager, par une clé gérée par le client dont la politique de clé n'autorise que le rôle de l'équipe de sécurité. Depuis, chaque tentative de rotation échoue. Les journaux de la fonction montrent que Secrets Manager appelle la fonction et que l'étape createSecret échoue avec une AccessDeniedException d'AWS KMS lorsqu'elle appelle GetSecretValue et PutSecretValue.

    Quelle modification corrige la rotation tout en respectant le moindre privilège ?
body:
  options:
    - id: a
      text:
        en: "Allow the rotation function's execution role to use kms:Decrypt and kms:GenerateDataKey on the customer managed key in the key policy."
        fr: "Autoriser dans la politique de clé le rôle d'exécution de la fonction de rotation à utiliser kms:Decrypt et kms:GenerateDataKey sur la clé gérée par le client."
    - id: b
      text:
        en: "Add a resource-based policy to the rotation function that allows the secretsmanager.amazonaws.com principal to call lambda:InvokeFunction."
        fr: "Ajouter à la fonction de rotation une politique basée sur les ressources qui autorise le principal secretsmanager.amazonaws.com à appeler lambda:InvokeFunction."
    - id: c
      text:
        en: "Create an interface VPC endpoint for AWS KMS in the function's VPC with private DNS enabled, and allow HTTPS from the function."
        fr: "Créer un point de terminaison VPC d'interface pour AWS KMS dans le VPC de la fonction avec le DNS privé activé, et autoriser HTTPS depuis la fonction."
    - id: d
      text:
        en: "Add a key policy statement that allows kms:* on the customer managed key for the secretsmanager.amazonaws.com service principal."
        fr: "Ajouter à la politique de clé une instruction qui autorise kms:* sur la clé gérée par le client pour le principal de service secretsmanager.amazonaws.com."
answer: { optionId: a }
explanation:
  correct:
    en: "The rotation function reads and writes the secret value as its execution role. Reading a secret encrypted with a customer managed key requires kms:Decrypt, and writing a new version requires kms:GenerateDataKey, so the key policy must allow these two actions for the function's role."
    fr: "La fonction de rotation lit et écrit la valeur du secret avec son rôle d'exécution. Lire un secret chiffré avec une clé gérée par le client exige kms:Decrypt, et écrire une nouvelle version exige kms:GenerateDataKey : la politique de clé doit autoriser ces deux actions pour le rôle de la fonction."
  options:
    b:
      en: "Secrets Manager already invokes the function, so its invoke permission works; the error comes from AWS KMS."
      fr: "Secrets Manager appelle déjà la fonction : son autorisation d'appel fonctionne ; l'erreur vient d'AWS KMS."
    c:
      en: "An AccessDeniedException is an authorization error, not a network timeout, so a new endpoint does not fix it."
      fr: "Une AccessDeniedException est une erreur d'autorisation, pas un délai réseau expiré : un nouveau point de terminaison ne la corrige pas."
    d:
      en: "KMS checks the permissions of the principal that calls Secrets Manager, here the function's role, and kms:* for a service principal breaks least privilege."
      fr: "KMS vérifie les autorisations du principal qui appelle Secrets Manager, ici le rôle de la fonction, et kms:* pour un principal de service enfreint le moindre privilège."
references:
  - title: Access AWS Secrets Manager secrets from a different account
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access_examples_cross.html
  - title: Lambda rotation functions
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_lambda-functions.html
