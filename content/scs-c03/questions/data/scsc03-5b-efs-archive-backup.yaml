id: scsc03-5b-efs-archive-backup
objective: "5.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a document management system on an Amazon EFS file system. Files that are not accessed for 90 days must move to the lowest-cost EFS storage class, and a file must return to EFS Standard as soon as a user opens it. Daily recovery points of the file system must be kept for 7 years. After a recovery point is created, no user, including the account's administrators and the root user, can be able to delete it or shorten its retention.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany exécute un système de gestion documentaire sur un système de fichiers Amazon EFS. Les fichiers non consultés depuis 90 jours doivent passer à la classe de stockage EFS la moins coûteuse, et un fichier doit revenir dans EFS Standard dès qu'un utilisateur l'ouvre. Les points de récupération quotidiens du système de fichiers doivent être conservés 7 ans. Une fois un point de récupération créé, aucun utilisateur, y compris les administrateurs du compte et l'utilisateur racine, ne doit pouvoir le supprimer ni raccourcir sa conservation.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Configure the EFS lifecycle policies with Transition into Archive after 90 days since last access and Transition into Standard on first access."
        fr: "Configurer les politiques de cycle de vie EFS avec Transition into Archive après 90 jours depuis le dernier accès et Transition into Standard au premier accès."
    - id: b
      text:
        en: "Configure the EFS lifecycle policies with Transition into IA after 90 days since last access and Transition into Standard set to None."
        fr: "Configurer les politiques de cycle de vie EFS avec Transition into IA après 90 jours depuis le dernier accès et Transition into Standard défini sur None."
    - id: c
      text:
        en: "Create an AWS Backup plan with a daily rule that keeps recovery points for 7 years in a backup vault locked with AWS Backup Vault Lock in compliance mode."
        fr: "Créer un plan AWS Backup avec une règle quotidienne qui conserve les points de récupération 7 ans dans un coffre de sauvegarde verrouillé par AWS Backup Vault Lock en mode conformité (compliance)."
    - id: d
      text:
        en: "Create an AWS Backup plan with a daily rule that keeps recovery points for 7 years in a backup vault locked with AWS Backup Vault Lock in governance mode."
        fr: "Créer un plan AWS Backup avec une règle quotidienne qui conserve les points de récupération 7 ans dans un coffre de sauvegarde verrouillé par AWS Backup Vault Lock en mode gouvernance (governance)."
    - id: e
      text:
        en: "Turn on EFS replication to a file system in another Region, and set the destination file system to read-only for 7 years."
        fr: "Activer la réplication EFS vers un système de fichiers d'une autre Région, et définir le système de fichiers de destination en lecture seule pendant 7 ans."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Archive is the lowest-cost EFS storage class, and Transition into Standard on first access moves a file back to Standard when it is read. EFS lifecycle policies only move files between storage classes, so the 7-year immutable retention comes from AWS Backup with a vault locked in compliance mode, which no user, including the root user, can unlock after the grace time."
    fr: "Archive est la classe de stockage EFS la moins coûteuse, et Transition into Standard au premier accès ramène un fichier dans Standard lorsqu'il est lu. Les politiques de cycle de vie EFS ne font que déplacer les fichiers entre classes de stockage : la conservation immuable de 7 ans vient d'AWS Backup avec un coffre verrouillé en mode conformité, qu'aucun utilisateur, y compris l'utilisateur racine, ne peut déverrouiller après le délai de grâce."
  options:
    b:
      en: "IA is not the lowest-cost class, and with Transition into Standard set to None, files stay in IA when they are accessed."
      fr: "IA n'est pas la classe la moins coûteuse, et avec Transition into Standard défini sur None, les fichiers restent dans IA lorsqu'ils sont consultés."
    d:
      en: "A governance mode lock can be removed by users with sufficient IAM permissions, so administrators could still delete recovery points."
      fr: "Un verrou en mode gouvernance peut être retiré par des utilisateurs disposant d'autorisations IAM suffisantes : les administrateurs pourraient encore supprimer des points de récupération."
    e:
      en: "Replication keeps a current copy, not daily point-in-time recovery points, and changes or deletions made in the source are replicated."
      fr: "La réplication conserve une copie à jour, pas des points de récupération quotidiens, et les modifications ou suppressions faites dans la source sont répliquées."
references:
  - title: Managing storage lifecycle
    url: https://docs.aws.amazon.com/efs/latest/ug/lifecycle-management-efs.html
  - title: AWS Backup Vault Lock
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html
