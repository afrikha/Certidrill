id: scsc03-5b-lambda-code-signing-enforce
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys AWS Lambda functions as .zip file archives from a CI/CD pipeline. After a supply chain incident, the security team requires that Lambda reject any new code deployment that was not signed by the pipeline's signing identity or whose signature was revoked or expired. The check must happen at deployment time and must not add latency to function invocations.

    Which solution will meet these requirements?
  fr: |
    AnyCompany déploie des fonctions AWS Lambda sous forme d'archives de fichiers .zip depuis un pipeline CI/CD. Après un incident de chaîne d'approvisionnement, l'équipe de sécurité exige que Lambda rejette tout nouveau déploiement de code qui n'a pas été signé par l'identité de signature du pipeline ou dont la signature a été révoquée ou a expiré. Le contrôle doit avoir lieu au moment du déploiement et ne doit pas ajouter de latence aux appels de fonction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an AWS Signer signing profile for the pipeline, and attach to each function a code signing configuration that allows that profile with the untrusted artifact policy set to Warn."
        fr: "Créer un profil de signature AWS Signer pour le pipeline, et associer à chaque fonction une configuration de signature de code qui autorise ce profil avec la politique d'artefact non approuvé définie sur Warn."
    - id: b
      text:
        en: "Sign each package with an asymmetric AWS KMS key, and add code to each function's initialization phase that calls the KMS Verify operation on its own package."
        fr: "Signer chaque package avec une clé AWS KMS asymétrique, et ajouter dans la phase d'initialisation de chaque fonction du code qui appelle l'opération KMS Verify sur son propre package."
    - id: c
      text:
        en: "Turn on Amazon Inspector Lambda code scanning, and block the pipeline stage when Inspector reports a finding for the new package."
        fr: "Activer l'analyse du code Lambda d'Amazon Inspector, et bloquer l'étape du pipeline lorsqu'Inspector signale un résultat pour le nouveau package."
    - id: d
      text:
        en: "Create an AWS Signer signing profile for the pipeline, and attach to each function a code signing configuration that allows that profile with the untrusted artifact policy set to Enforce."
        fr: "Créer un profil de signature AWS Signer pour le pipeline, et associer à chaque fonction une configuration de signature de code qui autorise ce profil avec la politique d'artefact non approuvé définie sur Enforce."
answer: { optionId: d }
explanation:
  correct:
    en: "A code signing configuration makes Lambda validate each new deployment against the allowed signing profiles, including the expiry, mismatch and revocation checks. With the untrusted artifact policy set to Enforce, Lambda blocks the deployment when these checks fail, and validation happens only at deployment time, so invocations are not affected."
    fr: "Une configuration de signature de code oblige Lambda à valider chaque nouveau déploiement par rapport aux profils de signature autorisés, y compris les contrôles d'expiration, de non-correspondance et de révocation. Avec la politique d'artefact non approuvé définie sur Enforce, Lambda bloque le déploiement lorsque ces contrôles échouent, et la validation n'a lieu qu'au déploiement : les appels ne sont pas affectés."
  options:
    a:
      en: "With Warn, which is the default, Lambda allows the deployment and only emits a SignatureValidationErrors metric and a CloudTrail entry."
      fr: "Avec Warn, valeur par défaut, Lambda autorise le déploiement et émet seulement une métrique SignatureValidationErrors et une entrée CloudTrail."
    b:
      en: "The check runs after the code is deployed and adds latency to cold starts; a modified package could also remove the verification code."
      fr: "Le contrôle s'exécute après le déploiement du code et ajoute de la latence aux démarrages à froid ; un package modifié pourrait aussi supprimer le code de vérification."
    c:
      en: "Inspector looks for vulnerabilities in code; it does not verify who signed a package or whether a signature was revoked."
      fr: "Inspector recherche des vulnérabilités dans le code ; il ne vérifie ni qui a signé un package ni si une signature a été révoquée."
references:
  - title: Using code signing to verify code integrity with Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-codesigning.html
