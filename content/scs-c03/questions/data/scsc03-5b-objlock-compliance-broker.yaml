id: scsc03-5b-objlock-compliance-broker
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is a broker-dealer that is creating a new Amazon S3 bucket for trade confirmations. A regulator requires that every object version be stored in a write-once-read-many (WORM) format for 6 years after it is written. No user in the account, including the root user and the security administrators, can be able to delete or overwrite a version or shorten its protection during that period. Applications upload objects without setting any retention headers.

    Which solution will meet these requirements?
  fr: |
    AnyCompany est un courtier en valeurs mobilières qui crée un nouveau compartiment (bucket) Amazon S3 pour les confirmations d'opérations. Un régulateur exige que chaque version d'objet soit stockée au format WORM (écriture unique, lectures multiples) pendant 6 ans après son écriture. Aucun utilisateur du compte, y compris l'utilisateur racine et les administrateurs de sécurité, ne doit pouvoir supprimer ou écraser une version ni raccourcir sa protection pendant cette période. Les applications chargent les objets sans définir d'en-tête de conservation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable S3 Versioning and S3 Object Lock on the bucket, and set a default retention of 6 years in governance mode. Deny s3:BypassGovernanceRetention to every IAM principal with a bucket policy."
        fr: "Activer la gestion des versions S3 et S3 Object Lock sur le compartiment, et définir une conservation par défaut de 6 ans en mode gouvernance (governance). Refuser s3:BypassGovernanceRetention à tous les principaux IAM par une politique de compartiment."
    - id: b
      text:
        en: "Enable S3 Versioning and S3 Object Lock on the bucket, and set a default retention of 6 years in compliance mode."
        fr: "Activer la gestion des versions S3 et S3 Object Lock sur le compartiment, et définir une conservation par défaut de 6 ans en mode conformité (compliance)."
    - id: c
      text:
        en: "Enable S3 Versioning with MFA delete on the bucket, and add a bucket policy that denies s3:DeleteObjectVersion to every principal for 6 years."
        fr: "Activer la gestion des versions S3 avec la suppression MFA sur le compartiment, et ajouter une politique de compartiment qui refuse s3:DeleteObjectVersion à tous les principaux pendant 6 ans."
    - id: d
      text:
        en: "Enable S3 Versioning, and add a lifecycle rule that transitions every object to S3 Glacier Deep Archive on day 0 and expires noncurrent versions after 6 years."
        fr: "Activer la gestion des versions S3, et ajouter une règle de cycle de vie qui fait passer chaque objet en S3 Glacier Deep Archive au jour 0 et fait expirer les versions non actuelles après 6 ans."
answer: { optionId: b }
explanation:
  correct:
    en: "In compliance mode, no user, including the root user, can overwrite or delete a protected object version, change its mode or shorten its retention period. A default bucket retention applies the 6-year period to every new version, so the applications do not need to send retention headers."
    fr: "En mode conformité (compliance), aucun utilisateur, y compris l'utilisateur racine, ne peut écraser ou supprimer une version d'objet protégée, changer son mode ni raccourcir sa période de conservation. Une conservation par défaut du compartiment applique la période de 6 ans à chaque nouvelle version : les applications n'ont pas besoin d'envoyer d'en-tête de conservation."
  options:
    a:
      en: "A bucket policy can be edited or removed by an administrator, and the root user is not limited by it, so governance mode stays bypassable and does not meet the requirement."
      fr: "Une politique de compartiment peut être modifiée ou supprimée par un administrateur, et l'utilisateur racine n'est pas limité par elle : le mode gouvernance reste contournable et ne répond pas à l'exigence."
    c:
      en: "The root user can permanently delete versions with MFA delete, and administrators can change the bucket policy, so the data is not WORM-protected."
      fr: "L'utilisateur racine peut supprimer définitivement des versions avec la suppression MFA, et les administrateurs peuvent modifier la politique de compartiment : les données ne sont pas protégées en WORM."
    d:
      en: "A storage class does not prevent deletion or overwrites; any user with delete permissions can still remove versions before 6 years."
      fr: "Une classe de stockage n'empêche ni la suppression ni l'écrasement ; tout utilisateur disposant des autorisations de suppression peut encore supprimer des versions avant 6 ans."
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
