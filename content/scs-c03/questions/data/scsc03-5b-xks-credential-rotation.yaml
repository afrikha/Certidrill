id: scsc03-5b-xks-credential-rotation
objective: "5.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses an external key store that protects production data in Amazon S3 and Amazon RDS. The XksProxyCredentialAge metric shows that the proxy authentication credential is 13 months old, and company policy requires rotation every 12 months. The external key store must stay connected and usable during the rotation.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise un magasin de clés externe qui protège des données de production dans Amazon S3 et Amazon RDS. La métrique XksProxyCredentialAge montre que les informations d'identification d'authentification du proxy ont 13 mois, et la politique de l'entreprise impose une rotation tous les 12 mois. Le magasin de clés externe doit rester connecté et utilisable pendant la rotation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Disconnect the external key store, call UpdateCustomKeyStore with a new access key ID and secret access key, update the credential on the proxy, and then connect the key store again."
        fr: "Déconnecter le magasin de clés externe, appeler UpdateCustomKeyStore avec un nouvel ID de clé d'accès et une nouvelle clé d'accès secrète, mettre à jour les informations d'identification du proxy, puis reconnecter le magasin de clés."
    - id: b
      text:
        en: "Add a new credential on the proxy while it still accepts the current one, call UpdateCustomKeyStore with the new access key ID and secret access key, and then retire the old credential."
        fr: "Ajouter de nouvelles informations d'identification sur le proxy pendant qu'il accepte encore les actuelles, appeler UpdateCustomKeyStore avec le nouvel ID de clé d'accès et la nouvelle clé d'accès secrète, puis retirer les anciennes."
    - id: c
      text:
        en: "Call UpdateCustomKeyStore with only a new secret access key, and keep the current access key ID so that the proxy configuration does not need to change."
        fr: "Appeler UpdateCustomKeyStore avec seulement une nouvelle clé d'accès secrète, et conserver l'ID de clé d'accès actuel pour que la configuration du proxy n'ait pas besoin de changer."
    - id: d
      text:
        en: "Create a new IAM user access key for the security team, and configure that access key as the proxy authentication credential on the proxy and in AWS KMS."
        fr: "Créer une nouvelle clé d'accès d'utilisateur IAM pour l'équipe de sécurité, et configurer cette clé d'accès comme informations d'identification d'authentification du proxy, sur le proxy et dans AWS KMS."
answer: { optionId: b }
explanation:
  correct:
    en: "The proxy authentication credential can be updated in any connection state, so the key store stays connected. Updating the proxy first, while it briefly accepts both credentials, and then reporting the new credential to AWS KMS avoids failed requests; UpdateCustomKeyStore requires both the access key ID and the secret access key."
    fr: "Les informations d'identification d'authentification du proxy peuvent être mises à jour quel que soit l'état de connexion : le magasin de clés reste connecté. Mettre à jour d'abord le proxy, qui accepte brièvement les deux informations d'identification, puis signaler les nouvelles à AWS KMS évite les requêtes en échec ; UpdateCustomKeyStore exige à la fois l'ID de clé d'accès et la clé d'accès secrète."
  options:
    a:
      en: "Disconnecting makes every KMS key in the external key store unusable, which breaks the requirement to stay usable; the credential does not require the disconnected state."
      fr: "La déconnexion rend inutilisables toutes les clés KMS du magasin de clés externe, ce qui enfreint l'exigence de rester utilisable ; les informations d'identification n'exigent pas l'état déconnecté."
    c:
      en: "AWS KMS requires both the access key ID and the secret access key, even when only one element changes."
      fr: "AWS KMS exige à la fois l'ID de clé d'accès et la clé d'accès secrète, même lorsqu'un seul élément change."
    d:
      en: "IAM SigV4 credentials must not be reused for the external key store proxy; the proxy credential is a separate credential that the proxy defines."
      fr: "Des informations d'identification IAM SigV4 ne doivent pas être réutilisées pour le proxy du magasin de clés externe ; les informations d'identification du proxy sont distinctes et définies par le proxy."
references:
  - title: Edit external key store properties
    url: https://docs.aws.amazon.com/kms/latest/developerguide/update-xks-keystore.html
  - title: External key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-external.html
