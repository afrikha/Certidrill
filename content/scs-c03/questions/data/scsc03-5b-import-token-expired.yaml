id: scsc03-5b-import-token-expired
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security engineer at AnyCompany created a KMS key with an EXTERNAL origin and downloaded a wrapping public key and an import token on Monday. On Thursday, after the HSM team wrapped the key material with that public key, the ImportKeyMaterial call fails.

    What should the engineer do to import the key material?
  fr: |
    Un ingénieur sécurité d'AnyCompany a créé une clé KMS d'origine EXTERNAL et téléchargé une clé publique d'encapsulation et un jeton d'importation le lundi. Le jeudi, après que l'équipe HSM a encapsulé les éléments de clé avec cette clé publique, l'appel ImportKeyMaterial échoue.

    Que doit faire l'ingénieur pour importer les éléments de clé ?
body:
  options:
    - id: a
      text:
        en: "Download a new import token only, and call ImportKeyMaterial with the new token and the key material that was already wrapped."
        fr: "Télécharger uniquement un nouveau jeton d'importation, et appeler ImportKeyMaterial avec le nouveau jeton et les éléments de clé déjà encapsulés."
    - id: b
      text:
        en: "Call ImportKeyMaterial again with ImportType set to NEW_KEY_MATERIAL and the original import token."
        fr: "Appeler de nouveau ImportKeyMaterial avec ImportType défini sur NEW_KEY_MATERIAL et le jeton d'importation d'origine."
    - id: c
      text:
        en: "Download a new wrapping public key and import token, wrap the key material again with the new public key, and import it with the new token within 24 hours."
        fr: "Télécharger une nouvelle clé publique d'encapsulation et un nouveau jeton d'importation, encapsuler de nouveau les éléments de clé avec la nouvelle clé publique, et les importer avec le nouveau jeton dans les 24 heures."
    - id: d
      text:
        en: "Create a new KMS key with an EXTERNAL origin, and import the already wrapped key material into it with the original import token."
        fr: "Créer une nouvelle clé KMS d'origine EXTERNAL, et y importer les éléments de clé déjà encapsulés avec le jeton d'importation d'origine."
answer: { optionId: c }
explanation:
  correct:
    en: "Each wrapping public key and import token set is valid for 24 hours, so the set from Monday has expired. The public key and token are an indivisible set that must be used together, so the key material must be wrapped again with a newly downloaded public key and imported with the matching token."
    fr: "Chaque ensemble clé publique d'encapsulation et jeton d'importation est valide 24 heures : l'ensemble du lundi a expiré. La clé publique et le jeton forment un ensemble indivisible qui doit être utilisé conjointement : les éléments de clé doivent être encapsulés de nouveau avec une clé publique nouvellement téléchargée et importés avec le jeton correspondant."
  options:
    a:
      en: "The new token belongs to a new wrapping key; material wrapped with the old public key cannot be imported with it."
      fr: "Le nouveau jeton appartient à une nouvelle clé d'encapsulation ; des éléments encapsulés avec l'ancienne clé publique ne peuvent pas être importés avec lui."
    b:
      en: "NEW_KEY_MATERIAL is used to add new key material for rotation; it does not extend the validity of an expired token."
      fr: "NEW_KEY_MATERIAL sert à ajouter de nouveaux éléments de clé pour une rotation ; il ne prolonge pas la validité d'un jeton expiré."
    d:
      en: "Key material must be imported into the same KMS key for which the public key and token were downloaded, and the token has expired anyway."
      fr: "Les éléments de clé doivent être importés dans la clé KMS pour laquelle la clé publique et le jeton ont été téléchargés, et le jeton a de toute façon expiré."
references:
  - title: "Step 2: Download the wrapping public key and import token"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-get-public-key-and-token.html
