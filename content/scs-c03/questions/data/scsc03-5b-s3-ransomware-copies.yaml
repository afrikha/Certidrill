id: scsc03-5b-s3-ransomware-copies
objective: "5.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany stores critical business data in a versioned Amazon S3 bucket in a production account. The security team assumes that a ransomware actor could obtain administrator credentials in the production account and then delete or overwrite objects and versions. The team requires an additional copy of the data that is outside the production account, that cannot be deleted or altered by anyone for 30 days, and that keeps protected copies of every version even if the source objects are deleted.

    Which solutions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany stocke des données métier critiques dans un compartiment (bucket) Amazon S3 versionné d'un compte de production. L'équipe de sécurité suppose qu'un auteur de rançongiciel pourrait obtenir des informations d'identification d'administrateur dans le compte de production, puis supprimer ou écraser des objets et des versions. L'équipe exige une copie supplémentaire des données, hors du compte de production, que personne ne peut supprimer ni altérer pendant 30 jours, et qui conserve des copies protégées de chaque version même si les objets source sont supprimés.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Replicate the bucket to a bucket in a separate backup account that has S3 Object Lock with a default retention of 30 days in compliance mode, and do not replicate delete markers."
        fr: "Répliquer le compartiment vers un compartiment d'un compte de sauvegarde distinct doté de S3 Object Lock avec une conservation par défaut de 30 jours en mode conformité (compliance), sans répliquer les marqueurs de suppression."
    - id: b
      text:
        en: "Replicate the bucket to a second bucket in the production account, and enable delete marker replication so that the two buckets stay identical."
        fr: "Répliquer le compartiment vers un second compartiment du compte de production, et activer la réplication des marqueurs de suppression pour que les deux compartiments restent identiques."
    - id: c
      text:
        en: "Back up the bucket with AWS Backup, and copy every recovery point to a logically air-gapped vault in a separate backup account with a minimum retention of 30 days."
        fr: "Sauvegarder le compartiment avec AWS Backup, et copier chaque point de récupération vers un coffre isolé logiquement (logically air-gapped vault) d'un compte de sauvegarde distinct avec une conservation minimale de 30 jours."
    - id: d
      text:
        en: "Encrypt the bucket with SSE-KMS and a customer managed key in the production account, and add a NoncurrentVersionExpiration action of 30 days."
        fr: "Chiffrer le compartiment avec SSE-KMS et une clé gérée par le client du compte de production, et ajouter une action NoncurrentVersionExpiration de 30 jours."
    - id: e
      text:
        en: "Configure a Recycle Bin retention rule with a 30-day retention period for the bucket in the production account."
        fr: "Configurer une règle de conservation de la Corbeille (Recycle Bin) avec une période de conservation de 30 jours pour le compartiment du compte de production."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Replicas in another account under compliance mode retention cannot be deleted or overwritten by anyone, and without delete marker replication, deletions in the source do not hide the replicated versions. AWS Backup copies to a logically air-gapped vault, which is always locked in compliance mode, also give an immutable copy outside the production account."
    fr: "Des réplicas dans un autre compte sous conservation en mode conformité ne peuvent être ni supprimés ni écrasés par personne, et sans réplication des marqueurs de suppression, les suppressions dans la source ne masquent pas les versions répliquées. Les copies AWS Backup vers un coffre isolé logiquement, toujours verrouillé en mode conformité, fournissent aussi une copie immuable hors du compte de production."
  options:
    b:
      en: "The copy stays in the compromised account without any lock, and replicated delete markers hide the data in both buckets."
      fr: "La copie reste dans le compte compromis sans aucun verrou, et les marqueurs de suppression répliqués masquent les données dans les deux compartiments."
    d:
      en: "An administrator in the production account can still delete versions or disable the key, and the expiration action removes versions instead of protecting them."
      fr: "Un administrateur du compte de production peut toujours supprimer des versions ou désactiver la clé, et l'action d'expiration supprime des versions au lieu de les protéger."
    e:
      en: "Recycle Bin protects EBS volumes, EBS snapshots and EBS-backed AMIs; it does not support S3 buckets."
      fr: "La Corbeille protège les volumes EBS, les instantanés EBS et les AMI basées sur EBS ; elle ne prend pas en charge les compartiments S3."
references:
  - title: Object Lock considerations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-managing.html
  - title: Logically air-gapped vault
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html
