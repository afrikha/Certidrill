id: scsc03-5c-mask-policy-mismatch
objective: "5.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security engineer at AnyCompany writes the data protection policy in the exhibit for the CloudWatch Logs log group /crm/web. The policy must audit and mask both email addresses and US driver's license numbers, and it must send audit findings to an existing S3 bucket. The engineer reviews the policy before running the put-data-protection-policy command.

    Which change must the engineer make to the policy?
  fr: |
    Un ingénieur sécurité d'AnyCompany rédige la politique de protection des données de la pièce pour le groupe de journaux CloudWatch Logs /crm/web. La politique doit auditer et masquer à la fois les adresses e-mail et les numéros de permis de conduire américains, et elle doit envoyer les résultats d'audit à un compartiment S3 existant. L'ingénieur relit la politique avant d'exécuter la commande put-data-protection-policy.

    Quelle modification l'ingénieur doit-il apporter à la politique ?
exhibits:
  - id: policy
    title: { en: "Data protection policy", fr: "Politique de protection des données" }
    body: |
      ```json
      {
        "Name": "crm-web-protection",
        "Version": "2021-06-01",
        "Statement": [
          {
            "Sid": "audit-policy",
            "DataIdentifier": [
              "arn:aws:dataprotection::aws:data-identifier/EmailAddress",
              "arn:aws:dataprotection::aws:data-identifier/DriversLicense-US"
            ],
            "Operation": {
              "Audit": {
                "FindingsDestination": {
                  "S3": { "Bucket": "anycompany-dp-findings" }
                }
              }
            }
          },
          {
            "Sid": "redact-policy",
            "DataIdentifier": [
              "arn:aws:dataprotection::aws:data-identifier/EmailAddress"
            ],
            "Operation": {
              "Deidentify": {
                "MaskConfig": {}
              }
            }
          }
        ]
      }
      ```
body:
  options:
    - id: a
      text:
        en: |-
          Change the Version element to 2012-10-17, the policy language version that supports the Deidentify operation.
        fr: |-
          Remplacer la valeur de l'élément Version par 2012-10-17, la version du langage de politique qui prend en charge l'opération Deidentify.
    - id: b
      text:
        en: |-
          Move the driver's license data identifier to a third statement that has its own Deidentify operation.
        fr: |-
          Déplacer l'identifiant de données des permis de conduire dans une troisième instruction qui a sa propre opération Deidentify.
    - id: c
      text:
        en: |-
          Add the DriversLicense-US data identifier to the DataIdentifier array of the redact-policy statement.
        fr: |-
          Ajouter l'identifiant de données DriversLicense-US au tableau DataIdentifier de l'instruction redact-policy.
    - id: d
      text:
        en: |-
          Remove the DriversLicense-US data identifier from the policy, and create a second data protection policy on the log group for it.
        fr: |-
          Retirer de la politique l'identifiant de données DriversLicense-US, et créer pour lui une seconde politique de protection des données sur le groupe de journaux.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A data protection policy has exactly two statements: an Audit statement and a Deidentify statement whose DataIdentifier array must exactly match the array of the Audit statement. The Deidentify statement, with an empty MaskConfig object, is what masks the data, so it must also list DriversLicense-US.
    fr: |-
      Une politique de protection des données comporte exactement deux instructions : une instruction Audit et une instruction Deidentify dont le tableau DataIdentifier doit correspondre exactement à celui de l'instruction Audit. C'est l'instruction Deidentify, avec un objet MaskConfig vide, qui masque les données : elle doit donc aussi lister DriversLicense-US.
  options:
    a:
      en: |-
        The current version of the data protection policy language is 2021-06-01; 2012-10-17 is the IAM policy language version.
      fr: |-
        La version actuelle du langage des politiques de protection des données est 2021-06-01 ; 2012-10-17 est la version du langage des politiques IAM.
    b:
      en: |-
        A data protection policy must include exactly two statements, one for the audit operation and one for the de-identify operation.
      fr: |-
        Une politique de protection des données doit comporter exactement deux instructions, une pour l'opération d'audit et une pour l'opération de désidentification.
    d:
      en: |-
        Each log group can have only one log group-level data protection policy; that policy can list many data identifiers.
      fr: |-
        Chaque groupe de journaux ne peut avoir qu'une seule politique de protection des données au niveau du groupe de journaux ; cette politique peut lister de nombreux identifiants de données.
references:
  - title: Create a data protection policy for a single log group - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data-start.html
  - title: Understanding data protection policies - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/cloudwatch-logs-data-protection-policies.html
