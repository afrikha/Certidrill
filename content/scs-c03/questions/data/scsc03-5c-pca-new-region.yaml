id: scsc03-5c-pca-new-region
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's PKI account runs an AWS Private CA root CA and a general-purpose subordinate CA in us-east-1. The subordinate CA is shared with the workload accounts through AWS RAM, and the workload accounts request private certificates through ACM for internal Application Load Balancers in us-east-1. The company is launching workloads in ap-southeast-2. Their internal load balancers need ACM private certificates that chain to the same root CA and that ACM renews automatically.

    Which solution will meet these requirements?
  fr: |
    Le compte PKI d'AnyCompany exécute une CA racine AWS Private CA et une CA subordonnée à usage général dans us-east-1. La CA subordonnée est partagée avec les comptes de charges de travail au moyen d'AWS RAM, et ces comptes demandent des certificats privés via ACM pour des Application Load Balancers internes dans us-east-1. L'entreprise lance des charges de travail dans ap-southeast-2. Leurs équilibreurs de charge internes ont besoin de certificats privés ACM qui remontent à la même CA racine et qu'ACM renouvelle automatiquement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a subordinate CA in ap-southeast-2 whose CA certificate the existing root CA signs, share it through AWS RAM, and request the certificates through ACM in ap-southeast-2.
        fr: |-
          Créer une CA subordonnée dans ap-southeast-2 dont la CA racine existante signe le certificat de CA, la partager au moyen d'AWS RAM, et demander les certificats via ACM dans ap-southeast-2.
    - id: b
      text:
        en: |-
          Add ap-southeast-2 to the existing AWS RAM resource share of the subordinate CA, and request the certificates through ACM in ap-southeast-2 from that CA.
        fr: |-
          Ajouter ap-southeast-2 au partage de ressources AWS RAM existant de la CA subordonnée, et demander les certificats via ACM dans ap-southeast-2 auprès de cette CA.
    - id: c
      text:
        en: |-
          Copy the existing subordinate CA to ap-southeast-2 with its private key, and request the certificates through ACM in ap-southeast-2 from the copy.
        fr: |-
          Copier la CA subordonnée existante dans ap-southeast-2 avec sa clé privée, et demander les certificats via ACM dans ap-southeast-2 auprès de la copie.
    - id: d
      text:
        en: |-
          Request the certificates through ACM in us-east-1 from the existing subordinate CA, export them, and import them into ACM in ap-southeast-2.
        fr: |-
          Demander les certificats via ACM dans us-east-1 auprès de la CA subordonnée existante, les exporter, et les importer dans ACM dans ap-southeast-2.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Private CAs are Regional resources: to use private CAs in more than one Region, you must create CAs in those Regions. A new subordinate CA in ap-southeast-2, signed by the existing root, keeps a single trust anchor. Shared through AWS RAM, it lets the workload accounts request ACM private certificates in ap-southeast-2 that ACM renews.
    fr: |-
      Les CA privées sont des ressources régionales : pour utiliser des CA privées dans plusieurs Régions, il faut créer des CA dans ces Régions. Une nouvelle CA subordonnée dans ap-southeast-2, signée par la racine existante, conserve une ancre de confiance unique. Partagée au moyen d'AWS RAM, elle permet aux comptes de charges de travail de demander dans ap-southeast-2 des certificats privés ACM qu'ACM renouvelle.
  options:
    b:
      en: |-
        A private CA exists only in its own Region; sharing it does not make it available to ACM in another Region.
      fr: |-
        Une CA privée n'existe que dans sa propre Région ; la partager ne la rend pas disponible pour ACM dans une autre Région.
    c:
      en: |-
        Private CAs cannot be copied between Regions, and the CA private key never leaves AWS Private CA.
      fr: |-
        Les CA privées ne peuvent pas être copiées entre Régions, et la clé privée d'une CA ne quitte jamais AWS Private CA.
    d:
      en: |-
        ACM does not renew imported certificates, so the certificates in ap-southeast-2 would have to be replaced manually before they expire.
      fr: |-
        ACM ne renouvelle pas les certificats importés : les certificats de ap-southeast-2 devraient être remplacés manuellement avant leur expiration.
references:
  - title: What is AWS Private CA? - AWS Private Certificate Authority
    url: https://docs.aws.amazon.com/privateca/latest/userguide/PcaWelcome.html
