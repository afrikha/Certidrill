id: scsc03-5c-imp-contract-expiry
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany, a SaaS provider, signs a six-month data processing contract with a customer. The customer's data is stored in Amazon S3 with SSE-KMS under a dedicated symmetric KMS key in AnyCompany's account. The contract requires that, on the contract end date, AWS KMS no longer holds the key material of that key, even if nobody at AnyCompany takes any action. If the contract is renewed later, AnyCompany must be able to make the existing data readable again without re-encrypting it.

    Which solution will meet these requirements?
  fr: |
    AnyCompany, un fournisseur SaaS, signe un contrat de traitement de données de six mois avec un client. Les données du client sont stockées dans Amazon S3 avec SSE-KMS sous une clé KMS symétrique dédiée du compte d'AnyCompany. Le contrat exige qu'à la date de fin du contrat, AWS KMS ne détienne plus les éléments de clé de cette clé, même si personne chez AnyCompany n'effectue d'action. Si le contrat est renouvelé plus tard, AnyCompany doit pouvoir rendre les données existantes de nouveau lisibles sans les rechiffrer.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create the key with key material generated by AWS KMS, and create an Amazon EventBridge Scheduler schedule that disables the key on the contract end date.
        fr: |-
          Créer la clé avec des éléments de clé générés par AWS KMS, et créer une planification Amazon EventBridge Scheduler qui désactive la clé à la date de fin du contrat.
    - id: b
      text:
        en: |-
          Create the key with key material generated by AWS KMS, and schedule the deletion of the key with a waiting period that ends on the contract end date.
        fr: |-
          Créer la clé avec des éléments de clé générés par AWS KMS, et planifier la suppression de la clé avec une période d'attente qui se termine à la date de fin du contrat.
    - id: c
      text:
        en: |-
          Create the key with EXTERNAL origin, import the key material with the KEY_MATERIAL_EXPIRES model and a ValidTo date equal to the contract end date, and keep a secure copy of the material.
        fr: |-
          Créer la clé avec l'origine EXTERNAL, importer les éléments de clé avec le modèle KEY_MATERIAL_EXPIRES et une date ValidTo égale à la date de fin du contrat, et conserver une copie sécurisée des éléments.
    - id: d
      text:
        en: |-
          Create the key with EXTERNAL origin, import key material that does not expire, and enable automatic key rotation so that the material changes on the contract end date.
        fr: |-
          Créer la clé avec l'origine EXTERNAL, importer des éléments de clé qui n'expirent pas, et activer la rotation automatique pour que les éléments changent à la date de fin du contrat.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Only imported key material can have an expiration time, up to 365 days after the import. When it expires, AWS KMS deletes the material and the key enters the PendingImport state without any action from the company. Because AWS KMS cannot recover deleted material, the company keeps its own copy and reimports the same material if the contract is renewed, which makes the existing ciphertext usable again.
    fr: |-
      Seuls des éléments de clé importés peuvent avoir une date d'expiration, jusqu'à 365 jours après l'importation. À l'expiration, AWS KMS supprime les éléments et la clé passe à l'état PendingImport sans aucune action de l'entreprise. Comme AWS KMS ne peut pas récupérer des éléments supprimés, l'entreprise conserve sa propre copie et réimporte les mêmes éléments si le contrat est renouvelé, ce qui rend de nouveau utilisable le texte chiffré existant.
  options:
    a:
      en: |-
        A disabled key keeps its key material in AWS KMS, so the contract requirement is not met.
      fr: |-
        Une clé désactivée conserve ses éléments de clé dans AWS KMS : l'exigence du contrat n'est pas respectée.
    b:
      en: |-
        The waiting period is 7 to 30 days, so it cannot be set six months ahead, and once the key is deleted the data can never be decrypted again, even if the contract is renewed.
      fr: |-
        La période d'attente est de 7 à 30 jours : elle ne peut pas être fixée six mois à l'avance, et une fois la clé supprimée, les données ne peuvent plus jamais être déchiffrées, même si le contrat est renouvelé.
    d:
      en: |-
        Automatic rotation is not supported for keys with imported material, and material that does not expire stays in AWS KMS after the end date.
      fr: |-
        La rotation automatique n'est pas prise en charge pour les clés avec des éléments importés, et des éléments qui n'expirent pas restent dans AWS KMS après la date de fin.
references:
  - title: "Step 4: Import the key material - AWS Key Management Service"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-import-key-material.html
