id: scsc03-5c-imp-hmac-offline-verify
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany issues session tokens from an application that runs on AWS Lambda. The tokens must be signed with an HMAC KMS key so that the key is never exposed to the application code. A legacy gateway in the company's data center must verify the same tokens with the same HMAC key. The gateway has no network path to AWS endpoints and must verify tokens offline. The security team will hold the gateway's copy of the key in an on-premises HSM.

    Which solution will meet these requirements?
  fr: |
    AnyCompany émet des jetons de session depuis une application qui s'exécute sur AWS Lambda. Les jetons doivent être signés avec une clé KMS HMAC afin que la clé ne soit jamais exposée au code de l'application. Une ancienne passerelle du centre de données de l'entreprise doit vérifier les mêmes jetons avec la même clé HMAC. La passerelle n'a aucun chemin réseau vers les points de terminaison AWS et doit vérifier les jetons hors ligne. L'équipe de sécurité conservera la copie de la clé destinée à la passerelle dans un HSM sur site.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an HMAC_256 KMS key with key material generated by AWS KMS, and have the gateway call the VerifyMac API through an interface VPC endpoint.
        fr: |-
          Créer une clé KMS HMAC_256 avec des éléments de clé générés par AWS KMS, et faire appeler l'API VerifyMac par la passerelle via un point de terminaison d'interface VPC.
    - id: b
      text:
        en: |-
          Create an HMAC_256 KMS key with key material generated by AWS KMS, and use the GetParametersForImport operation to obtain a wrapped copy of the material for the HSM.
        fr: |-
          Créer une clé KMS HMAC_256 avec des éléments de clé générés par AWS KMS, et utiliser l'opération GetParametersForImport pour obtenir une copie encapsulée des éléments pour le HSM.
    - id: c
      text:
        en: |-
          Generate HMAC key material for the HMAC_256 key spec in the on-premises HSM, and import it into an HMAC_256 KMS key with EXTERNAL origin.
        fr: |-
          Générer des éléments de clé HMAC pour la spécification de clé HMAC_256 dans le HSM sur site, et les importer dans une clé KMS HMAC_256 d'origine EXTERNAL.
    - id: d
      text:
        en: |-
          Create a multi-Region HMAC_256 KMS key, and replicate it to the Region that is closest to the data center so that the gateway can verify tokens with low latency.
        fr: |-
          Créer une clé KMS HMAC_256 multi-Région, et la répliquer dans la Région la plus proche du centre de données pour que la passerelle puisse vérifier les jetons avec une faible latence.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      For asymmetric and HMAC keys, imported key material is interoperable: the same material works inside AWS KMS and outside AWS. Lambda signs with GenerateMac without ever seeing the key, and the gateway verifies offline with the copy that the company generated and keeps in its HSM. Key material that AWS KMS generates never leaves AWS KMS unencrypted, so it could not be used offline.
    fr: |-
      Pour les clés asymétriques et HMAC, les éléments de clé importés sont interopérables : les mêmes éléments fonctionnent dans AWS KMS et hors d'AWS. Lambda signe avec GenerateMac sans jamais voir la clé, et la passerelle vérifie hors ligne avec la copie que l'entreprise a générée et conserve dans son HSM. Les éléments de clé générés par AWS KMS ne quittent jamais AWS KMS en clair : ils ne pourraient pas être utilisés hors ligne.
  options:
    a:
      en: |-
        Calling VerifyMac requires a connection to AWS KMS, but the gateway has no network path to AWS and must verify tokens offline.
      fr: |-
        Appeler VerifyMac nécessite une connexion à AWS KMS, or la passerelle n'a aucun chemin réseau vers AWS et doit vérifier les jetons hors ligne.
    b:
      en: |-
        GetParametersForImport returns a wrapping public key and an import token for importing material into AWS KMS; it never exports key material that AWS KMS generated.
      fr: |-
        GetParametersForImport renvoie une clé publique d'encapsulation et un jeton d'importation pour importer des éléments dans AWS KMS ; il n'exporte jamais des éléments de clé générés par AWS KMS.
    d:
      en: |-
        A replica key is still used only through AWS KMS API calls in an AWS Region, so the offline gateway still cannot verify tokens.
      fr: |-
        Une clé de réplica ne s'utilise toujours qu'au moyen d'appels à l'API AWS KMS dans une Région AWS : la passerelle hors ligne ne peut toujours pas vérifier les jetons.
references:
  - title: Importing key material for AWS KMS keys - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys.html
