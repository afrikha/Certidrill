id: scsc03-5a-rds-encrypt-existing
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an unencrypted Amazon RDS for MySQL DB instance in production. An audit requires that the database be encrypted at rest with a customer managed KMS key. The company accepts a short maintenance window during which the application is switched to a new endpoint.

    Which solution will meet this requirement?
  fr: |
    AnyCompany possède en production une instance de base de données Amazon RDS for MySQL non chiffrée. Un audit exige que la base de données soit chiffrée au repos avec une clé KMS gérée par le client. L'entreprise accepte une courte fenêtre de maintenance pendant laquelle l'application est basculée vers un nouveau point de terminaison.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text:
        en: "Modify the DB instance to enable storage encryption with the customer managed key, and apply the change immediately."
        fr: "Modifier l'instance pour activer le chiffrement du stockage avec la clé gérée par le client, et appliquer la modification immédiatement."
    - id: b
      text:
        en: "Create a read replica of the DB instance encrypted with the customer managed key, and promote the replica."
        fr: "Créer un réplica en lecture de l'instance chiffré avec la clé gérée par le client, et promouvoir le réplica."
    - id: c
      text:
        en: "Take a snapshot of the DB instance, and restore it to a new DB instance with encryption enabled and the customer managed key selected."
        fr: "Prendre un instantané de l'instance, et le restaurer dans une nouvelle instance avec le chiffrement activé et la clé gérée par le client sélectionnée."
    - id: d
      text:
        en: "Take a snapshot of the DB instance, copy it with encryption under the customer managed key, and restore a new DB instance from the encrypted copy."
        fr: "Prendre un instantané de l'instance, le copier avec chiffrement sous la clé gérée par le client, et restaurer une nouvelle instance à partir de la copie chiffrée."
answer: { optionId: d }
explanation:
  correct:
    en: "Encryption of an RDS DB instance can only be chosen at creation. To encrypt an existing unencrypted instance, create a snapshot, make an encrypted copy of the snapshot with the chosen KMS key, and restore a new DB instance from that copy."
    fr: "Le chiffrement d'une instance RDS ne peut être choisi qu'à sa création. Pour chiffrer une instance existante non chiffrée, il faut créer un instantané, en faire une copie chiffrée avec la clé KMS choisie, puis restaurer une nouvelle instance à partir de cette copie."
  options:
    a:
      en: "Encryption cannot be turned on for an existing DB instance."
      fr: "Le chiffrement ne peut pas être activé sur une instance existante."
    b:
      en: "An unencrypted DB instance can only have unencrypted read replicas."
      fr: "Une instance non chiffrée ne peut avoir que des réplicas en lecture non chiffrés."
    c:
      en: "An unencrypted snapshot cannot be restored to an encrypted DB instance; it must first be copied with encryption."
      fr: "Un instantané non chiffré ne peut pas être restauré dans une instance chiffrée : il doit d'abord être copié avec chiffrement."
references:
  - title: Encrypting Amazon RDS resources - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html
