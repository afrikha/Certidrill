id: scsc03-5b-abort-mpu-tag-filter
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's privacy policy requires that identity documents uploaded by customers be deleted 30 days after upload, including the parts of uploads that never completed. Objects are uploaded with multipart upload under the kyc/ prefix and are tagged classification=pii when the upload completes. An engineer tries to save one S3 Lifecycle rule with a filter on the classification=pii tag that contains an Expiration action of 30 days and an AbortIncompleteMultipartUpload action of 1 day. Amazon S3 rejects the configuration.

    Which solution will meet these requirements?
  fr: |
    La politique de confidentialité d'AnyCompany exige que les pièces d'identité chargées par les clients soient supprimées 30 jours après leur chargement, y compris les parties des chargements jamais terminés. Les objets sont chargés par chargement partitionné sous le préfixe kyc/ et reçoivent la balise classification=pii à la fin du chargement. Un ingénieur essaie d'enregistrer une seule règle S3 Lifecycle avec un filtre sur la balise classification=pii qui contient une action Expiration de 30 jours et une action AbortIncompleteMultipartUpload de 1 jour. Amazon S3 rejette la configuration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Keep the tag-filtered rule with only the Expiration action, and add a second rule with a kyc/ prefix filter that contains the AbortIncompleteMultipartUpload action."
        fr: "Conserver la règle filtrée par balise avec la seule action Expiration, et ajouter une seconde règle avec un filtre de préfixe kyc/ qui contient l'action AbortIncompleteMultipartUpload."
    - id: b
      text:
        en: "Keep the tag-filtered rule, and replace the AbortIncompleteMultipartUpload action with an ExpiredObjectDeleteMarker action."
        fr: "Conserver la règle filtrée par balise, et remplacer l'action AbortIncompleteMultipartUpload par une action ExpiredObjectDeleteMarker."
    - id: c
      text:
        en: "Keep the tag-filtered rule with only the Expiration action, because Expiration also removes the parts of incomplete multipart uploads."
        fr: "Conserver la règle filtrée par balise avec la seule action Expiration, car Expiration supprime aussi les parties des chargements partitionnés incomplets."
    - id: d
      text:
        en: "Keep the tag-filtered rule, and add a NoncurrentVersionExpiration action of 1 day to remove the parts of incomplete uploads."
        fr: "Conserver la règle filtrée par balise, et ajouter une action NoncurrentVersionExpiration de 1 jour pour supprimer les parties des chargements incomplets."
answer: { optionId: a }
explanation:
  correct:
    en: "AbortIncompleteMultipartUpload cannot be specified in a rule whose filter uses object tags, so it must go in a separate rule that filters on the kyc/ prefix. The tag-filtered rule keeps the 30-day Expiration action for completed documents."
    fr: "AbortIncompleteMultipartUpload ne peut pas être spécifiée dans une règle dont le filtre utilise des balises d'objet : elle doit figurer dans une règle distincte filtrée sur le préfixe kyc/. La règle filtrée par balise conserve l'action Expiration de 30 jours pour les documents terminés."
  options:
    b:
      en: "ExpiredObjectDeleteMarker also cannot be used with a tag filter, and it removes delete markers, not upload parts."
      fr: "ExpiredObjectDeleteMarker ne peut pas non plus être utilisée avec un filtre de balise, et elle supprime des marqueurs de suppression, pas des parties de chargement."
    c:
      en: "Object expiration actions do not remove incomplete multipart uploads, so their stored parts would remain."
      fr: "Les actions d'expiration d'objet ne suppriment pas les chargements partitionnés incomplets : leurs parties stockées resteraient."
    d:
      en: "NoncurrentVersionExpiration deletes noncurrent versions of completed objects; incomplete uploads are not object versions."
      fr: "NoncurrentVersionExpiration supprime les versions non actuelles d'objets terminés ; les chargements incomplets ne sont pas des versions d'objet."
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
