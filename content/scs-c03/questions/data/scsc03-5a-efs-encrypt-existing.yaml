id: scsc03-5a-efs-encrypt-existing
objective: "5.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's application uses an Amazon EFS file system that was created with the AWS CLI without encryption at rest. A security audit requires that the application's data be encrypted at rest with a customer managed KMS key. The company also wants to make sure that no unencrypted EFS file system can be created in any account of its organization in AWS Organizations.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    L'application d'AnyCompany utilise un système de fichiers Amazon EFS créé avec l'AWS CLI sans chiffrement au repos. Un audit de sécurité exige que les données de l'application soient chiffrées au repos avec une clé KMS gérée par le client. L'entreprise veut aussi s'assurer qu'aucun système de fichiers EFS non chiffré ne puisse être créé dans un compte de son organisation AWS Organizations.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Enable encryption at rest on the existing file system with the customer managed key."
        fr: "Activer le chiffrement au repos sur le système de fichiers existant avec la clé gérée par le client."
    - id: b
      text:
        en: "Replicate the file system to a new file system encrypted with the customer managed key, and move the application to the new file system."
        fr: "Répliquer le système de fichiers vers un nouveau système de fichiers chiffré avec la clé gérée par le client, et basculer l'application vers le nouveau système de fichiers."
    - id: c
      text:
        en: "Add a file system policy that denies all actions when aws:SecureTransport is false."
        fr: "Ajouter une politique de système de fichiers qui refuse toutes les actions lorsque aws:SecureTransport vaut false."
    - id: d
      text:
        en: "Attach an SCP that denies elasticfilesystem:CreateFileSystem when elasticfilesystem:Encrypted is false."
        fr: "Attacher une SCP qui refuse elasticfilesystem:CreateFileSystem lorsque elasticfilesystem:Encrypted vaut false."
    - id: e
      text:
        en: "Back up the file system with an AWS Backup plan whose backup vault is encrypted with the customer managed key."
        fr: "Sauvegarder le système de fichiers avec un plan AWS Backup dont le coffre de sauvegarde est chiffré avec la clé gérée par le client."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The encryption setting of an EFS file system cannot be changed after creation, so the data must be replicated to a new file system that is encrypted with the customer managed key. The elasticfilesystem:Encrypted condition key in an SCP enforces encrypted creation in every account; the CLI, API, and SDKs do not encrypt unless asked, unlike the console default."
    fr: "Le paramètre de chiffrement d'un système de fichiers EFS ne peut pas être modifié après sa création : les données doivent être répliquées vers un nouveau système de fichiers chiffré avec la clé gérée par le client. La clé de condition elasticfilesystem:Encrypted dans une SCP impose la création chiffrée dans tous les comptes ; la CLI, l'API et les kits SDK ne chiffrent pas sans demande explicite, contrairement à la valeur par défaut de la console."
  options:
    a:
      en: "Encryption at rest can be chosen only when a file system is created; it cannot be turned on for an existing one."
      fr: "Le chiffrement au repos ne peut être choisi qu'à la création d'un système de fichiers : il ne peut pas être activé sur un système existant."
    c:
      en: "aws:SecureTransport enforces encryption in transit, not encryption at rest."
      fr: "aws:SecureTransport impose le chiffrement en transit, pas le chiffrement au repos."
    e:
      en: "An encrypted backup vault protects the recovery points, but the file system that the application uses stays unencrypted."
      fr: "Un coffre de sauvegarde chiffré protège les points de récupération, mais le système de fichiers utilisé par l'application reste non chiffré."
references:
  - title: Encrypting data at rest - Amazon Elastic File System
    url: https://docs.aws.amazon.com/efs/latest/ug/encryption-at-rest.html
