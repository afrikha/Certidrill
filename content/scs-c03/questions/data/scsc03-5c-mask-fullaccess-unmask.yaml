id: scsc03-5c-mask-fullaccess-unmask
objective: "5.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has an account-level CloudWatch Logs data protection policy that masks email addresses and names in all log groups. Developers use an IAM role with the AWS managed policy CloudWatchLogsFullAccess so that they can create log groups, metric filters, and subscription filters. A review shows that developers can view the unmasked email addresses in the CloudWatch console. Only the incident response role may view unmasked data, and developers must keep all their other CloudWatch Logs permissions.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany dispose d'une politique de protection des données CloudWatch Logs au niveau du compte qui masque les adresses e-mail et les noms dans tous les groupes de journaux. Les développeurs utilisent un rôle IAM doté de la politique gérée par AWS CloudWatchLogsFullAccess afin de pouvoir créer des groupes de journaux, des filtres de métrique et des filtres d'abonnement. Une revue montre que les développeurs peuvent voir les adresses e-mail non masquées dans la console CloudWatch. Seul le rôle de réponse aux incidents peut voir des données non masquées, et les développeurs doivent conserver toutes leurs autres autorisations CloudWatch Logs.

    Quelle solution permet de répondre à ces exigences avec la charge opérationnelle la plus FAIBLE ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a log group-level data protection policy to each log group that names the developer role as a principal that cannot view unmasked data.
        fr: |-
          Ajouter à chaque groupe de journaux une politique de protection des données au niveau du groupe de journaux qui désigne le rôle des développeurs comme principal ne pouvant pas voir les données non masquées.
    - id: b
      text:
        en: |-
          Add an inline policy statement that denies the logs:Unmask action to the developer role, and keep CloudWatchLogsFullAccess attached to the role.
        fr: |-
          Ajouter au rôle des développeurs une instruction de politique en ligne qui refuse l'action logs:Unmask, et conserver CloudWatchLogsFullAccess attachée au rôle.
    - id: c
      text:
        en: |-
          Replace CloudWatchLogsFullAccess with the AWS managed policy CloudWatchLogsReadOnlyAccess on the developer role.
        fr: |-
          Remplacer CloudWatchLogsFullAccess par la politique gérée par AWS CloudWatchLogsReadOnlyAccess sur le rôle des développeurs.
    - id: d
      text:
        en: |-
          Remove the Audit statement from the account-level policy so that only the de-identify operation applies to the developers' sessions.
        fr: |-
          Retirer l'instruction Audit de la politique au niveau du compte afin que seule l'opération de désidentification s'applique aux sessions des développeurs.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Only principals with the logs:Unmask permission can view unmasked data, and the CloudWatchLogsFullAccess managed policy includes that permission. An explicit deny for logs:Unmask overrides the allow in the managed policy, so developers keep every other permission and see masked values. The incident response role keeps its own allow.
    fr: |-
      Seuls les principaux dotés de l'autorisation logs:Unmask peuvent voir des données non masquées, et la politique gérée CloudWatchLogsFullAccess inclut cette autorisation. Un refus explicite de logs:Unmask l'emporte sur l'autorisation de la politique gérée : les développeurs conservent toutes leurs autres autorisations et voient les valeurs masquées. Le rôle de réponse aux incidents conserve sa propre autorisation.
  options:
    a:
      en: |-
        A data protection policy selects data identifiers and audit and de-identify operations; it has no principal element, and access to unmasked data is controlled by IAM.
      fr: |-
        Une politique de protection des données sélectionne des identifiants de données et des opérations d'audit et de désidentification ; elle n'a aucun élément principal, et l'accès aux données non masquées est contrôlé par IAM.
    c:
      en: |-
        A read-only policy removes the developers' ability to create log groups, metric filters, and subscription filters, which they must keep.
      fr: |-
        Une politique en lecture seule retire aux développeurs la capacité de créer des groupes de journaux, des filtres de métrique et des filtres d'abonnement, qu'ils doivent conserver.
    d:
      en: |-
        A data protection policy must contain exactly one audit statement and one de-identify statement, and neither statement controls who can unmask data.
      fr: |-
        Une politique de protection des données doit contenir exactement une instruction d'audit et une instruction de désidentification, et aucune des deux ne contrôle qui peut démasquer les données.
references:
  - title: View unmasked data - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data-viewunmasked.html
  - title: Understanding data protection policies - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/cloudwatch-logs-data-protection-policies.html
