id: scsc03-5a-cloudfront-https-both-legs
objective: "5.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany serves a customer portal through an Amazon CloudFront distribution. The origin is an Application Load Balancer that has only an HTTP listener, and the distribution uses origin.example.com, an alias record for the ALB, as the origin domain. The cache behavior's viewer protocol policy is HTTP and HTTPS, and the origin protocol policy is HTTP only. The company must keep supporting old bookmarks that use http:// URLs by sending those viewers to HTTPS, and it must encrypt all traffic between CloudFront and the origin.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany sert un portail client par une distribution Amazon CloudFront. L'origine est un Application Load Balancer qui n'a qu'un écouteur HTTP, et la distribution utilise origin.example.com, un enregistrement d'alias vers l'ALB, comme domaine d'origine. La politique de protocole de l'utilisateur (viewer protocol policy) du comportement de cache est HTTP and HTTPS, et la politique de protocole d'origine est HTTP only. L'entreprise doit continuer à prendre en charge les anciens favoris qui utilisent des URL http:// en renvoyant ces utilisateurs vers HTTPS, et elle doit chiffrer tout le trafic entre CloudFront et l'origine.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Set the viewer protocol policy of the cache behavior to HTTPS only."
        fr: "Définir la politique de protocole de l'utilisateur du comportement de cache sur HTTPS only."
    - id: b
      text:
        en: "Set the viewer protocol policy of the cache behavior to Redirect HTTP to HTTPS."
        fr: "Définir la politique de protocole de l'utilisateur du comportement de cache sur Redirect HTTP to HTTPS."
    - id: c
      text:
        en: "Add an HTTPS listener to the ALB with a self-signed certificate imported into ACM, and set the origin protocol policy to HTTPS only."
        fr: "Ajouter à l'ALB un écouteur HTTPS avec un certificat auto-signé importé dans ACM, et définir la politique de protocole d'origine sur HTTPS only."
    - id: d
      text:
        en: "Enable field-level encryption on the distribution for the request body fields that contain personal data."
        fr: "Activer le chiffrement au niveau du champ sur la distribution pour les champs du corps de requête qui contiennent des données personnelles."
    - id: e
      text:
        en: "Add an HTTPS listener to the ALB with an ACM certificate for origin.example.com, and set the origin protocol policy to HTTPS only."
        fr: "Ajouter à l'ALB un écouteur HTTPS avec un certificat ACM pour origin.example.com, et définir la politique de protocole d'origine sur HTTPS only."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Redirect HTTP to HTTPS answers HTTP GET and HEAD requests with a 301 redirect to the HTTPS URL, so old bookmarks keep working over HTTPS. HTTPS only as the origin protocol policy makes CloudFront use HTTPS toward the ALB, which needs a certificate from a trusted CA (an ACM certificate is accepted for ELB) that covers the origin domain name."
    fr: "Redirect HTTP to HTTPS répond aux requêtes HTTP GET et HEAD par une redirection 301 vers l'URL HTTPS : les anciens favoris continuent de fonctionner en HTTPS. HTTPS only comme politique de protocole d'origine oblige CloudFront à utiliser HTTPS vers l'ALB, ce qui exige un certificat d'une autorité de confiance (un certificat ACM est accepté pour ELB) qui couvre le nom de domaine de l'origine."
  options:
    a:
      en: "HTTPS only returns 403 Forbidden to HTTP requests instead of redirecting them, so old bookmarks would break."
      fr: "HTTPS only renvoie 403 Forbidden aux requêtes HTTP au lieu de les rediriger : les anciens favoris ne fonctionneraient plus."
    c:
      en: "CloudFront does not accept self-signed origin certificates; it drops the connection and returns 502 Bad Gateway."
      fr: "CloudFront n'accepte pas les certificats d'origine auto-signés : il coupe la connexion et renvoie 502 Bad Gateway."
    d:
      en: "Field-level encryption protects selected POST fields end to end, but the rest of the traffic to the origin would still use HTTP."
      fr: "Le chiffrement au niveau du champ protège de bout en bout certains champs POST, mais le reste du trafic vers l'origine utiliserait toujours HTTP."
references:
  - title: Require HTTPS for communication between viewers and CloudFront - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-https-viewers-to-cloudfront.html
  - title: Require HTTPS for communication between CloudFront and your custom origin - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-https-cloudfront-to-custom-origin.html
