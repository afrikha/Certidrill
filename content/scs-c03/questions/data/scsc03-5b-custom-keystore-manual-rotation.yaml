id: scsc03-5b-custom-keystore-manual-rotation
objective: "5.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany encrypts application data with a symmetric KMS key in an AWS CloudHSM key store. The applications call Encrypt and Decrypt through the AWS SDK and always refer to the key by the alias alias/app-data. A new policy requires rotating the cryptographic key every year without changing application code. Data encrypted before a rotation must remain decryptable.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany chiffre des données d'application avec une clé KMS symétrique d'un magasin de clés AWS CloudHSM. Les applications appellent Encrypt et Decrypt par l'AWS SDK et désignent toujours la clé par l'alias alias/app-data. Une nouvelle politique exige une rotation annuelle de la clé cryptographique sans modifier le code des applications. Les données chiffrées avant une rotation doivent rester déchiffrables.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Each year, create a new KMS key in the same CloudHSM key store, and update alias/app-data to point to the new key."
        fr: "Chaque année, créer une nouvelle clé KMS dans le même magasin de clés CloudHSM, et mettre à jour alias/app-data pour qu'il pointe vers la nouvelle clé."
    - id: b
      text:
        en: "Call EnableKeyRotation on the current key with a rotation period of 365 days."
        fr: "Appeler EnableKeyRotation sur la clé actuelle avec une période de rotation de 365 jours."
    - id: c
      text:
        en: "Keep each previous KMS key enabled, and let Decrypt calls run without a KeyId parameter so that AWS KMS uses the key that encrypted each ciphertext."
        fr: "Conserver chaque clé KMS précédente activée, et laisser les appels Decrypt s'exécuter sans paramètre KeyId pour qu'AWS KMS utilise la clé qui a chiffré chaque texte chiffré."
    - id: d
      text:
        en: "Each year, call RotateKeyOnDemand on the current key."
        fr: "Chaque année, appeler RotateKeyOnDemand sur la clé actuelle."
    - id: e
      text:
        en: "Each year, import new key material into the current key with ImportType set to NEW_KEY_MATERIAL."
        fr: "Chaque année, importer de nouveaux éléments de clé dans la clé actuelle avec ImportType défini sur NEW_KEY_MATERIAL."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Keys in custom key stores support neither automatic nor on-demand rotation, so they are rotated manually by creating a new KMS key and changing the target of the alias. The original key must stay enabled, and Decrypt calls on manually rotated symmetric keys should omit KeyId so that AWS KMS picks the key that encrypted the ciphertext."
    fr: "Les clés des magasins de clés personnalisés ne prennent en charge ni la rotation automatique ni la rotation à la demande : leur rotation est manuelle, en créant une nouvelle clé KMS et en changeant la cible de l'alias. La clé d'origine doit rester activée, et les appels Decrypt sur des clés symétriques à rotation manuelle doivent omettre KeyId pour qu'AWS KMS choisisse la clé qui a chiffré le texte chiffré."
  options:
    b:
      en: "Automatic key rotation is not supported for KMS keys in custom key stores."
      fr: "La rotation automatique n'est pas prise en charge pour les clés KMS des magasins de clés personnalisés."
    d:
      en: "On-demand rotation is not supported for KMS keys in a custom key store."
      fr: "La rotation à la demande n'est pas prise en charge pour les clés KMS d'un magasin de clés personnalisé."
    e:
      en: "Key material cannot be imported into KMS keys in custom key stores; CloudHSM key stores generate their key material in the cluster."
      fr: "Des éléments de clé ne peuvent pas être importés dans des clés KMS de magasins de clés personnalisés ; les magasins de clés CloudHSM génèrent leurs éléments de clé dans le cluster."
references:
  - title: Rotate keys manually
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys-manually.html
