id: scsc03-5a-elasticache-tls-existing
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs an Amazon ElastiCache for Valkey 8.0 replication group with cluster mode enabled and without in-transit encryption. Dozens of microservices use it, and their teams will update their clients to TLS over the next month. The security team must encrypt the connections to the cache without recreating it or changing its endpoint, and without breaking the clients that are not updated yet. Once every client uses TLS, unencrypted connections must be refused.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un groupe de réplication Amazon ElastiCache for Valkey 8.0 avec le mode cluster activé et sans chiffrement en transit. Des dizaines de microservices l'utilisent, et leurs équipes passeront leurs clients à TLS au cours du mois prochain. L'équipe de sécurité doit chiffrer les connexions au cache sans le recréer ni changer son point de terminaison, et sans casser les clients qui ne sont pas encore mis à jour. Une fois que tous les clients utilisent TLS, les connexions non chiffrées doivent être refusées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Modify the replication group to enable in-transit encryption with the transit encryption mode set to required, and then update the clients."
        fr: "Modifier le groupe de réplication pour activer le chiffrement en transit avec le mode de chiffrement en transit sur required, puis mettre à jour les clients."
    - id: b
      text:
        en: "Back up the replication group, restore the backup to a new replication group with in-transit encryption, and move clients as they are updated."
        fr: "Sauvegarder le groupe de réplication, restaurer la sauvegarde dans un nouveau groupe de réplication avec chiffrement en transit, et y déplacer les clients au fil des mises à jour."
    - id: c
      text:
        en: "Modify the replication group to enable in-transit encryption with the transit encryption mode set to preferred, and change it to required after all clients use TLS."
        fr: "Modifier le groupe de réplication pour activer le chiffrement en transit avec le mode de chiffrement en transit sur preferred, puis le passer à required lorsque tous les clients utilisent TLS."
    - id: d
      text:
        en: "Enable Valkey AUTH with an authentication token on the replication group so that the clients that present the token use encrypted connections."
        fr: "Activer Valkey AUTH avec un jeton d'authentification sur le groupe de réplication pour que les clients qui présentent le jeton utilisent des connexions chiffrées."
answer: { optionId: c }
explanation:
  correct:
    en: "Valkey 7.2 and later support enabling in-transit encryption on an existing replication group in two steps. The preferred mode accepts both TLS and plaintext connections while clients migrate; the required mode then drops all unencrypted connections. The cluster and its endpoint stay the same."
    fr: "Valkey 7.2 et versions ultérieures permettent d'activer le chiffrement en transit sur un groupe de réplication existant en deux étapes. Le mode preferred accepte les connexions TLS et en clair pendant la migration des clients ; le mode required supprime ensuite toutes les connexions non chiffrées. Le cluster et son point de terminaison restent les mêmes."
  options:
    a:
      en: "The required mode immediately refuses unencrypted connections, so every client that is not yet updated would fail."
      fr: "Le mode required refuse immédiatement les connexions non chiffrées : tous les clients pas encore mis à jour échoueraient."
    b:
      en: "Restoring to a new replication group recreates the cache and changes its endpoint, which the requirements forbid."
      fr: "La restauration dans un nouveau groupe de réplication recrée le cache et change son point de terminaison, ce que les exigences interdisent."
    d:
      en: "An AUTH token authenticates clients but does not encrypt traffic; ElastiCache uses AUTH only together with in-transit encryption."
      fr: "Un jeton AUTH authentifie les clients mais ne chiffre pas le trafic ; ElastiCache n'utilise AUTH qu'avec le chiffrement en transit."
references:
  - title: Enabling in-transit encryption - Amazon ElastiCache
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/in-transit-encryption-enable.html
  - title: ElastiCache in-transit encryption (TLS) - Amazon ElastiCache
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/in-transit-encryption.html
