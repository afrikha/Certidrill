id: scsc03-5a-interface-endpoint-private-dns
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's AWS Lambda functions run in private subnets of a VPC and retrieve secrets from AWS Secrets Manager through the AWS SDK default endpoint. The VPC has a NAT gateway. The security team created an interface VPC endpoint for Secrets Manager with private DNS disabled and an endpoint policy that allows only the company's secrets. VPC Flow Logs show that Secrets Manager traffic still goes through the NAT gateway. The VPC attributes enableDnsSupport and enableDnsHostnames are both true. The traffic must use the endpoint without any change to the function code or configuration.

    Which solution will meet these requirements?
  fr: |
    Les fonctions AWS Lambda d'AnyCompany s'exécutent dans des sous-réseaux privés d'un VPC et récupèrent des secrets dans AWS Secrets Manager par le point de terminaison par défaut du kit SDK AWS. Le VPC possède une passerelle NAT. L'équipe de sécurité a créé un point de terminaison de VPC d'interface pour Secrets Manager avec le DNS privé désactivé et une politique de point de terminaison qui n'autorise que les secrets de l'entreprise. Les journaux de flux VPC montrent que le trafic Secrets Manager passe toujours par la passerelle NAT. Les attributs de VPC enableDnsSupport et enableDnsHostnames valent tous deux true. Le trafic doit utiliser le point de terminaison sans aucune modification du code ni de la configuration des fonctions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a route to the private subnet route tables that sends Secrets Manager traffic to the interface endpoint."
        fr: "Ajouter aux tables de routage des sous-réseaux privés un itinéraire qui envoie le trafic Secrets Manager vers le point de terminaison d'interface."
    - id: b
      text:
        en: "Enable private DNS on the interface endpoint so that the default Secrets Manager DNS name resolves to the endpoint's private IP addresses."
        fr: "Activer le DNS privé sur le point de terminaison d'interface pour que le nom DNS par défaut de Secrets Manager se résolve vers les adresses IP privées du point de terminaison."
    - id: c
      text:
        en: "Replace the interface endpoint with a gateway endpoint for Secrets Manager, and associate it with the private subnet route tables."
        fr: "Remplacer le point de terminaison d'interface par un point de terminaison de passerelle pour Secrets Manager, et l'associer aux tables de routage des sous-réseaux privés."
    - id: d
      text:
        en: "Remove the default route to the NAT gateway from the private subnet route tables so that the SDK falls back to the interface endpoint."
        fr: "Supprimer l'itinéraire par défaut vers la passerelle NAT des tables de routage des sous-réseaux privés pour que le kit SDK se rabatte sur le point de terminaison d'interface."
answer: { optionId: b }
explanation:
  correct:
    en: "An interface endpoint is reached by DNS, not by routes. With private DNS enabled, which requires DNS resolution and DNS hostnames on the VPC, the regional Secrets Manager name that the SDK already uses resolves to the endpoint network interfaces, so the traffic leaves the NAT path without any code change."
    fr: "Un point de terminaison d'interface s'atteint par DNS, pas par des itinéraires. Avec le DNS privé activé, qui exige la résolution DNS et les noms d'hôte DNS sur le VPC, le nom régional de Secrets Manager que le kit SDK utilise déjà se résout vers les interfaces réseau du point de terminaison : le trafic quitte le chemin NAT sans modification du code."
  options:
    a:
      en: "Interface endpoints do not appear as route targets; only gateway endpoints add routes to route tables."
      fr: "Les points de terminaison d'interface ne sont pas des cibles d'itinéraire ; seuls les points de terminaison de passerelle ajoutent des itinéraires aux tables de routage."
    c:
      en: "Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB, not for Secrets Manager."
      fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB, pas pour Secrets Manager."
    d:
      en: "The public DNS name would still resolve to public addresses, so the calls would fail instead of using the endpoint."
      fr: "Le nom DNS public se résoudrait toujours vers des adresses publiques : les appels échoueraient au lieu d'utiliser le point de terminaison."
references:
  - title: Access an AWS service using an interface VPC endpoint - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html
