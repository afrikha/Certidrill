id: scsc03-5c-mask-bedrock-invocation-logs
objective: "5.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's customer support assistant calls Amazon Bedrock through the Converse API with a guardrail. The guardrail's sensitive information filters mask names, email addresses, and phone numbers in prompts and responses. Model invocation logging writes to a CloudWatch Logs log group. An audit finds customers' email addresses and phone numbers in the input field of the invocation logs. Analysts who read these logs must see the values masked, and only the privacy officer role may view them.

    Which solution will meet these requirements?
  fr: |
    L'assistant de support client d'AnyCompany appelle Amazon Bedrock au moyen de l'API Converse avec un garde-fou. Les filtres d'informations sensibles du garde-fou masquent les noms, les adresses e-mail et les numéros de téléphone dans les invites et les réponses. La journalisation des invocations de modèles écrit dans un groupe de journaux CloudWatch Logs. Un audit trouve des adresses e-mail et des numéros de téléphone de clients dans le champ input des journaux d'invocation. Les analystes qui lisent ces journaux doivent voir les valeurs masquées, et seul le rôle du délégué à la protection des données peut les voir.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Change the guardrail's sensitive information filters from mask to block for prompts, so that invocation logging no longer records the values.
        fr: |-
          Faire passer les filtres d'informations sensibles du garde-fou du masquage au blocage pour les invites, afin que la journalisation des invocations n'enregistre plus les valeurs.
    - id: b
      text:
        en: |-
          Enable the guardrail trace in each Converse request so that the guardrail also masks the values that invocation logging records.
        fr: |-
          Activer la trace du garde-fou dans chaque requête Converse afin que le garde-fou masque aussi les valeurs que la journalisation des invocations enregistre.
    - id: c
      text:
        en: |-
          Send the invocation logs to Amazon S3 instead of CloudWatch Logs, and enable Amazon Macie automated sensitive data discovery on the bucket.
        fr: |-
          Envoyer les journaux d'invocation vers Amazon S3 au lieu de CloudWatch Logs, et activer la découverte automatisée des données sensibles d'Amazon Macie sur le compartiment.
    - id: d
      text:
        en: |-
          Create a data protection policy on the invocation log group with managed data identifiers for email addresses and phone numbers, and allow logs:Unmask only to the privacy officer role.
        fr: |-
          Créer une politique de protection des données sur le groupe de journaux d'invocation avec des identifiants de données gérés pour les adresses e-mail et les numéros de téléphone, et n'autoriser logs:Unmask que pour le rôle du délégué à la protection des données.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Guardrail masking applies only to the content sent to and returned by the model. The input field of model invocation logs in CloudWatch Logs always contains the original request, whatever the guardrail did, and Amazon Bedrock recommends CloudWatch Logs data protection for these logs. The policy masks the values for every reader, and only principals with logs:Unmask can view them.
    fr: |-
      Le masquage du garde-fou ne s'applique qu'au contenu envoyé au modèle et renvoyé par celui-ci. Le champ input des journaux d'invocation de modèles dans CloudWatch Logs contient toujours la requête d'origine, quelle que soit l'action du garde-fou, et Amazon Bedrock recommande la protection des données CloudWatch Logs pour ces journaux. La politique masque les valeurs pour tous les lecteurs, et seuls les principaux dotés de logs:Unmask peuvent les voir.
  options:
    a:
      en: |-
        The input field of the invocation logs contains the original request regardless of guardrail intervention, so blocking does not keep the values out of the logs; it also breaks the assistant.
      fr: |-
        Le champ input des journaux d'invocation contient la requête d'origine quelle que soit l'intervention du garde-fou : le blocage n'écarte pas les valeurs des journaux, et il empêche en plus l'assistant de fonctionner.
    b:
      en: |-
        The trace returns the original PII in its match field by design; it does not change what invocation logging records.
      fr: |-
        La trace renvoie à dessein les informations personnelles d'origine dans son champ match ; elle ne modifie pas ce que la journalisation des invocations enregistre.
    c:
      en: |-
        Macie reports sensitive data in S3 objects but does not mask it, so analysts who can read the objects still see the values.
      fr: |-
        Macie signale les données sensibles dans les objets S3 mais ne les masque pas : les analystes qui peuvent lire les objets voient toujours les valeurs.
references:
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
  - title: Help protect sensitive log data with masking - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
