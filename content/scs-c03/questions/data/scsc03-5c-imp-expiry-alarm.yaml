id: scsc03-5c-imp-expiry-alarm
objective: "5.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany imported key material into 40 symmetric KMS keys with the KEY_MATERIAL_EXPIRES expiration model to meet a contractual requirement. Last month, the material of one key expired unnoticed, and an application failed until the material was reimported. The security team wants a notification when the key material of any of these keys will expire in less than 30 days.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a importé des éléments de clé dans 40 clés KMS symétriques avec le modèle d'expiration KEY_MATERIAL_EXPIRES pour respecter une exigence contractuelle. Le mois dernier, les éléments d'une clé ont expiré sans que personne ne le remarque, et une application a échoué jusqu'à la réimportation des éléments. L'équipe de sécurité veut une notification lorsque les éléments de clé de l'une de ces clés expireront dans moins de 30 jours.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the SecondsUntilKeyMaterialExpires metric of each key, and send the alarm notifications to an Amazon SNS topic.
        fr: |-
          Créer une alarme CloudWatch sur la métrique SecondsUntilKeyMaterialExpires de chaque clé, et envoyer les notifications de l'alarme à une rubrique Amazon SNS.
    - id: b
      text:
        en: |-
          Enable automatic key rotation on each key so that AWS KMS sends a rotation reminder through AWS Health 30 days before the expiration.
        fr: |-
          Activer la rotation automatique de chaque clé pour qu'AWS KMS envoie un rappel de rotation via AWS Health 30 jours avant l'expiration.
    - id: c
      text:
        en: |-
          Deploy the AWS Config managed rule kms-cmk-not-scheduled-for-deletion, and send its noncompliance notifications to an Amazon SNS topic.
        fr: |-
          Déployer la règle gérée AWS Config kms-cmk-not-scheduled-for-deletion, et envoyer ses notifications de non-conformité à une rubrique Amazon SNS.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule that matches the KMS CMK Rotation event, and send the matched events to an Amazon SNS topic.
        fr: |-
          Créer une règle Amazon EventBridge qui correspond à l'événement KMS CMK Rotation, et envoyer les événements correspondants à une rubrique Amazon SNS.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS KMS publishes the SecondsUntilKeyMaterialExpires metric for each key whose imported material expires. An alarm with a threshold of 30 days (2,592,000 seconds) gives the team time to reimport the material before the key becomes unusable. Keys with AWS-generated material never expire, so this monitoring need is specific to imported material.
    fr: |-
      AWS KMS publie la métrique SecondsUntilKeyMaterialExpires pour chaque clé dont les éléments importés expirent. Une alarme avec un seuil de 30 jours (2 592 000 secondes) laisse à l'équipe le temps de réimporter les éléments avant que la clé ne devienne inutilisable. Les éléments générés par AWS n'expirent jamais : ce besoin de surveillance est propre aux éléments importés.
  options:
    b:
      en: |-
        Automatic rotation is not supported for keys with imported material, and it has no link with the expiration of imported material.
      fr: |-
        La rotation automatique n'est pas prise en charge pour les clés avec des éléments importés, et elle n'a aucun lien avec l'expiration des éléments importés.
    c:
      en: |-
        This rule detects keys that are scheduled for deletion; expiring key material does not schedule the deletion of the key.
      fr: |-
        Cette règle détecte les clés dont la suppression est planifiée ; l'expiration des éléments de clé ne planifie pas la suppression de la clé.
    d:
      en: |-
        The rotation event concerns the automatic rotation of keys with AWS-generated material, not the expiration of imported material.
      fr: |-
        L'événement de rotation concerne la rotation automatique des clés avec des éléments générés par AWS, pas l'expiration des éléments importés.
references:
  - title: Create a CloudWatch alarm for expiration of imported key material - AWS Key Management Service
    url: https://docs.aws.amazon.com/kms/latest/developerguide/imported-key-material-expiration-alarm.html
