id: scsc03-5b-rds-managed-master-password
objective: "5.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is creating a new Amazon RDS for MySQL DB instance. The security team requires that the master user password be generated randomly, stored encrypted in AWS Secrets Manager, never be visible to administrators in plaintext during creation, and be rotated automatically. The team wants the LEAST operational overhead and does not want to maintain any AWS Lambda function.

    Which solution will meet these requirements?
  fr: |
    AnyCompany crée une nouvelle instance de base de données Amazon RDS for MySQL. L'équipe de sécurité exige que le mot de passe de l'utilisateur principal soit généré aléatoirement, stocké chiffré dans AWS Secrets Manager, ne soit jamais visible en clair par les administrateurs lors de la création, et soit soumis à une rotation automatique. L'équipe veut la charge opérationnelle la plus FAIBLE et ne veut maintenir aucune fonction AWS Lambda.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create the DB instance with a password chosen by an administrator, store it in a Secrets Manager secret, and turn on rotation with the Secrets Manager rotation function template for MySQL."
        fr: "Créer l'instance de base de données avec un mot de passe choisi par un administrateur, le stocker dans un secret Secrets Manager, et activer la rotation avec le modèle de fonction de rotation Secrets Manager pour MySQL."
    - id: b
      text:
        en: "Create the DB instance with the --manage-master-user-password option so that Amazon RDS generates the password and manages its rotation in Secrets Manager."
        fr: "Créer l'instance de base de données avec l'option --manage-master-user-password pour qu'Amazon RDS génère le mot de passe et gère sa rotation dans Secrets Manager."
    - id: c
      text:
        en: "Store a generated password as a SecureString parameter in AWS Systems Manager Parameter Store, and create an Amazon EventBridge schedule that updates the parameter and the DB instance."
        fr: "Stocker un mot de passe généré comme paramètre SecureString dans AWS Systems Manager Parameter Store, et créer une planification Amazon EventBridge qui met à jour le paramètre et l'instance de base de données."
    - id: d
      text:
        en: "Enable IAM database authentication on the DB instance, and remove the master user password from the instance configuration."
        fr: "Activer l'authentification de base de données IAM sur l'instance, et supprimer le mot de passe de l'utilisateur principal de la configuration de l'instance."
answer: { optionId: b }
explanation:
  correct:
    en: "With ManageMasterUserPassword, Amazon RDS generates the master user password and manages it throughout its lifecycle in Secrets Manager. RDS rotates the secret every 7 days by default through managed rotation, which does not use a Lambda function."
    fr: "Avec ManageMasterUserPassword, Amazon RDS génère le mot de passe de l'utilisateur principal et le gère pendant tout son cycle de vie dans Secrets Manager. RDS effectue la rotation du secret tous les 7 jours par défaut grâce à la rotation gérée, qui n'utilise pas de fonction Lambda."
  options:
    a:
      en: "An administrator sees the initial password, and a Lambda rotation function must be deployed and maintained."
      fr: "Un administrateur voit le mot de passe initial, et une fonction de rotation Lambda doit être déployée et maintenue."
    c:
      en: "Parameter Store has no built-in rotation, so the company must build and maintain the update logic, and the password is not stored in Secrets Manager."
      fr: "Parameter Store n'offre pas de rotation intégrée : l'entreprise doit créer et maintenir la logique de mise à jour, et le mot de passe n'est pas stocké dans Secrets Manager."
    d:
      en: "IAM database authentication is for database users; an RDS DB instance still has a master user password that must be protected and rotated."
      fr: "L'authentification de base de données IAM concerne les utilisateurs de base de données ; une instance RDS conserve un mot de passe d'utilisateur principal qui doit être protégé et soumis à rotation."
references:
  - title: Password management with Amazon RDS and AWS Secrets Manager
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-secrets-manager.html
