id: scsc03-5b-fsx-lustre-scratch
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's research team uses an Amazon FSx for Lustre scratch file system for a long-running project. The data is not stored anywhere else. The security team now requires automatic daily backups of the project data with a retention of 14 days, managed by Amazon FSx.

    Which solution will meet these requirements?
  fr: |
    L'équipe de recherche d'AnyCompany utilise un système de fichiers Amazon FSx for Lustre de type scratch pour un projet de longue durée. Les données ne sont stockées nulle part ailleurs. L'équipe de sécurité exige désormais des sauvegardes quotidiennes automatiques des données du projet avec une conservation de 14 jours, gérées par Amazon FSx.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set the automatic backup retention of the existing scratch file system to 14 days, and choose a daily backup window outside peak hours."
        fr: "Définir la conservation des sauvegardes automatiques du système de fichiers scratch existant sur 14 jours, et choisir une fenêtre de sauvegarde quotidienne hors des heures de pointe."
    - id: b
      text:
        en: "Link the scratch file system to an Amazon S3 data repository, and set the automatic daily backup retention of the file system to 14 days."
        fr: "Lier le système de fichiers scratch à un référentiel de données Amazon S3, et définir la conservation des sauvegardes quotidiennes automatiques du système de fichiers sur 14 jours."
    - id: c
      text:
        en: "Move the data to a new persistent file system that is not linked to an S3 data repository, and set its automatic daily backup retention to 14 days."
        fr: "Déplacer les données vers un nouveau système de fichiers persistant non lié à un référentiel de données S3, et définir sa conservation des sauvegardes quotidiennes automatiques sur 14 jours."
    - id: d
      text:
        en: "Keep the scratch file system, and create a user-initiated backup every day with an Amazon EventBridge schedule and an AWS Lambda function."
        fr: "Conserver le système de fichiers scratch, et créer chaque jour une sauvegarde initiée par l'utilisateur avec une planification Amazon EventBridge et une fonction AWS Lambda."
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon FSx supports backups only on persistent file systems that are not linked to an S3 data repository. On such a file system, automatic daily backups run in the daily backup window with a retention of 0 to 90 days, so 14 days is valid."
    fr: "Amazon FSx ne prend en charge les sauvegardes que sur les systèmes de fichiers persistants non liés à un référentiel de données S3. Sur un tel système de fichiers, les sauvegardes quotidiennes automatiques s'exécutent dans la fenêtre de sauvegarde quotidienne avec une conservation de 0 à 90 jours : 14 jours est une valeur valide."
  options:
    a:
      en: "Scratch file systems are designed for temporary storage and do not support backups."
      fr: "Les systèmes de fichiers scratch sont conçus pour le stockage temporaire et ne prennent pas en charge les sauvegardes."
    b:
      en: "File systems linked to an S3 bucket do not support backups, and a scratch file system does not support them either."
      fr: "Les systèmes de fichiers liés à un compartiment S3 ne prennent pas en charge les sauvegardes, et un système de fichiers scratch ne les prend pas en charge non plus."
    d:
      en: "Scratch file systems do not support any backups, and user-initiated backups never expire, so Amazon FSx would not manage their retention."
      fr: "Les systèmes de fichiers scratch ne prennent en charge aucune sauvegarde, et les sauvegardes initiées par l'utilisateur n'expirent jamais : Amazon FSx ne gérerait pas leur conservation."
references:
  - title: Protecting your data with backups
    url: https://docs.aws.amazon.com/fsx/latest/LustreGuide/using-backups-fsx.html
