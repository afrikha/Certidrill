id: scsc03-5c-pca-short-lived-acm
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To reduce costs, AnyCompany created an AWS Private CA root CA in general-purpose mode and, under it, a subordinate CA in short-lived certificate mode. The subordinate CA issues 1-day certificates to containers through the AWS Private CA API. The platform team now needs private TLS certificates for internal Application Load Balancers. The certificates must be issued through ACM, chain to the existing root CA, and be renewed by ACM.

    Which solution will meet these requirements?
  fr: |
    Pour réduire les coûts, AnyCompany a créé une CA racine AWS Private CA en mode usage général et, sous celle-ci, une CA subordonnée en mode certificats à courte durée de vie. La CA subordonnée émet des certificats d'une journée pour des conteneurs au moyen de l'API AWS Private CA. L'équipe de plateforme a maintenant besoin de certificats TLS privés pour des Application Load Balancers internes. Les certificats doivent être émis via ACM, remonter à la CA racine existante et être renouvelés par ACM.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Request the load balancer certificates through ACM from the short-lived subordinate CA, with a validity of seven days.
        fr: |-
          Demander les certificats des équilibreurs de charge via ACM auprès de la CA subordonnée à courte durée de vie, avec une validité de sept jours.
    - id: b
      text:
        en: |-
          Issue the certificates from the short-lived subordinate CA with the IssueCertificate API, and import them into ACM so that ACM renews them.
        fr: |-
          Émettre les certificats depuis la CA subordonnée à courte durée de vie avec l'API IssueCertificate, et les importer dans ACM pour qu'ACM les renouvelle.
    - id: c
      text:
        en: |-
          Create a general-purpose subordinate CA under the short-lived subordinate CA, and request the load balancer certificates through ACM from the new CA.
        fr: |-
          Créer une CA subordonnée à usage général sous la CA subordonnée à courte durée de vie, et demander les certificats des équilibreurs de charge via ACM auprès de la nouvelle CA.
    - id: d
      text:
        en: |-
          Create a general-purpose subordinate CA signed by the existing root CA, and request the load balancer certificates through ACM from the new CA.
        fr: |-
          Créer une CA subordonnée à usage général signée par la CA racine existante, et demander les certificats des équilibreurs de charge via ACM auprès de la nouvelle CA.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      ACM cannot issue certificates signed by a private CA in short-lived certificate mode, which issues certificates valid for at most seven days. A general-purpose subordinate CA under the existing root can issue certificates through ACM, which manages their renewal, and the short-lived CA keeps serving the containers at a lower cost.
    fr: |-
      ACM ne peut pas émettre de certificats signés par une CA privée en mode certificats à courte durée de vie, qui émet des certificats valides au plus sept jours. Une CA subordonnée à usage général sous la racine existante peut émettre des certificats via ACM, qui gère leur renouvellement, et la CA à courte durée de vie continue de servir les conteneurs à moindre coût.
  options:
    a:
      en: |-
        ACM cannot issue certificates signed by a CA in short-lived certificate mode, whatever validity is requested.
      fr: |-
        ACM ne peut pas émettre de certificats signés par une CA en mode certificats à courte durée de vie, quelle que soit la validité demandée.
    b:
      en: |-
        ACM does not renew imported certificates, and certificates from the short-lived CA would expire after at most seven days.
      fr: |-
        ACM ne renouvelle pas les certificats importés, et les certificats de la CA à courte durée de vie expireraient au bout de sept jours au plus.
    c:
      en: |-
        A CA in short-lived certificate mode must be the last CA in the hierarchy, so no CA can be created under it.
      fr: |-
        Une CA en mode certificats à courte durée de vie doit être la dernière CA de la hiérarchie : aucune CA ne peut être créée sous elle.
references:
  - title: Understand AWS Private CA CA modes - AWS Private Certificate Authority
    url: https://docs.aws.amazon.com/privateca/latest/userguide/short-lived-certificates.html
