id: scsc03-5b-replicate-secret-regions
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an application in us-east-1 and eu-west-1 against an Amazon Aurora global database. Both Regional copies of the application use the same database user, whose credentials are stored in an AWS Secrets Manager secret in us-east-1 with rotation every 30 days. The eu-west-1 copy must read the credentials from Secrets Manager in its own Region, so that it keeps working if us-east-1 is unavailable. Both Regions must always have the same credentials, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application dans us-east-1 et eu-west-1 avec une base de données globale Amazon Aurora. Les deux copies régionales de l'application utilisent le même utilisateur de base de données, dont les informations d'identification sont stockées dans un secret AWS Secrets Manager de us-east-1 avec une rotation tous les 30 jours. La copie d'eu-west-1 doit lire les informations d'identification depuis Secrets Manager dans sa propre Région, afin de continuer à fonctionner si us-east-1 est indisponible. Les deux Régions doivent toujours disposer des mêmes informations d'identification, avec la charge opérationnelle la plus FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a second secret in eu-west-1 with the same value, and turn on rotation for it every 30 days with its own Lambda rotation function."
        fr: "Créer un second secret dans eu-west-1 avec la même valeur, et activer sa rotation tous les 30 jours avec sa propre fonction de rotation Lambda."
    - id: b
      text:
        en: "Replicate the secret to eu-west-1 with a KMS key in eu-west-1, and keep rotation configured only on the primary secret."
        fr: "Répliquer le secret dans eu-west-1 avec une clé KMS d'eu-west-1, et conserver la rotation configurée uniquement sur le secret principal."
    - id: c
      text:
        en: "Store the credentials as a SecureString parameter in Parameter Store in each Region, and update both parameters from the rotation function."
        fr: "Stocker les informations d'identification comme paramètre SecureString de Parameter Store dans chaque Région, et mettre à jour les deux paramètres depuis la fonction de rotation."
    - id: d
      text:
        en: "Have the eu-west-1 copy of the application call the Secrets Manager endpoint in us-east-1 through an inter-Region VPC peering connection."
        fr: "Faire appeler par la copie d'eu-west-1 de l'application le point de terminaison Secrets Manager de us-east-1 par une connexion d'appairage de VPC inter-Régions."
answer: { optionId: b }
explanation:
  correct:
    en: "A replica secret is a Regional copy of the primary secret, encrypted with a KMS key in the replica Region. When rotation is turned on for the primary secret, Secrets Manager rotates it in the primary Region and propagates the new value to every replica, so the replicas do not need their own rotation."
    fr: "Un secret réplica est une copie régionale du secret principal, chiffrée avec une clé KMS de la Région du réplica. Lorsque la rotation est activée sur le secret principal, Secrets Manager en effectue la rotation dans la Région principale et propage la nouvelle valeur à chaque réplica : les réplicas n'ont pas besoin de leur propre rotation."
  options:
    a:
      en: "Two independent rotations generate different passwords for the same database user, so one Region would always hold invalid credentials."
      fr: "Deux rotations indépendantes génèrent des mots de passe différents pour le même utilisateur de base de données : une Région détiendrait toujours des informations d'identification invalides."
    c:
      en: "This requires custom code to keep two parameters synchronized, which adds operational overhead compared with native replication."
      fr: "Cette solution exige du code personnalisé pour synchroniser deux paramètres, ce qui ajoute de la charge opérationnelle par rapport à la réplication native."
    d:
      en: "The eu-west-1 copy would still depend on Secrets Manager in us-east-1 and would fail if that Region is unavailable."
      fr: "La copie d'eu-west-1 dépendrait toujours de Secrets Manager dans us-east-1 et échouerait si cette Région était indisponible."
references:
  - title: Replicate AWS Secrets Manager secrets across Regions
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/create-manage-multi-region-secrets.html
