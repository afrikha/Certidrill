id: scsc03-5b-lifecycle-locked-versions
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany stores invoices in an Amazon S3 bucket that has S3 Object Lock enabled with a default retention of 1 year in compliance mode. To reduce costs, an engineer adds an S3 Lifecycle rule that expires current versions 90 days after creation and permanently deletes noncurrent versions 1 day after they become noncurrent. The compliance officer asks what will happen to invoices that are 100 days old.

    Which outcome should the engineer expect?
  fr: |
    AnyCompany stocke des factures dans un compartiment (bucket) Amazon S3 où S3 Object Lock est activé avec une conservation par défaut de 1 an en mode conformité (compliance). Pour réduire les coûts, un ingénieur ajoute une règle S3 Lifecycle qui fait expirer les versions actuelles 90 jours après leur création et supprime définitivement les versions non actuelles 1 jour après qu'elles sont devenues non actuelles. Le responsable de la conformité demande ce qu'il adviendra des factures âgées de 100 jours.

    Quel résultat l'ingénieur doit-il attendre ?
body:
  options:
    - id: a
      text:
        en: "Amazon S3 rejects the Lifecycle configuration because it contains expiration actions on a bucket that has compliance mode retention."
        fr: "Amazon S3 rejette la configuration Lifecycle parce qu'elle contient des actions d'expiration sur un compartiment soumis à une conservation en mode conformité."
    - id: b
      text:
        en: "Amazon S3 adds delete markers to the invoices, but the locked invoice versions are not permanently deleted while their retention period is active."
        fr: "Amazon S3 ajoute des marqueurs de suppression aux factures, mais les versions verrouillées des factures ne sont pas supprimées définitivement tant que leur période de conservation est active."
    - id: c
      text:
        en: "Amazon S3 permanently deletes the invoice versions, because Lifecycle actions run with the bucket owner's permissions and are not subject to Object Lock."
        fr: "Amazon S3 supprime définitivement les versions des factures, car les actions Lifecycle s'exécutent avec les autorisations du propriétaire du compartiment et ne sont pas soumises à Object Lock."
    - id: d
      text:
        en: "Amazon S3 skips the invoices entirely and does not add delete markers, because delete markers cannot be placed on objects under retention."
        fr: "Amazon S3 ignore entièrement les factures et n'ajoute pas de marqueur de suppression, car aucun marqueur de suppression ne peut être placé sur des objets soumis à une conservation."
answer: { optionId: b }
explanation:
  correct:
    en: "Lifecycle configurations keep working on protected objects, including placing delete markers, but a locked object version cannot be deleted by a Lifecycle expiration action. The invoices disappear from simple GET and LIST requests because a delete marker becomes the current version, while the locked versions stay stored and billed."
    fr: "Les configurations Lifecycle continuent de fonctionner sur les objets protégés, y compris pour placer des marqueurs de suppression, mais une version d'objet verrouillée ne peut pas être supprimée par une action d'expiration Lifecycle. Les factures disparaissent des requêtes GET et LIST simples parce qu'un marqueur de suppression devient la version actuelle, tandis que les versions verrouillées restent stockées et facturées."
  options:
    a:
      en: "Amazon S3 accepts Lifecycle rules on buckets with Object Lock; the rules simply cannot delete locked versions."
      fr: "Amazon S3 accepte les règles Lifecycle sur les compartiments avec Object Lock ; les règles ne peuvent simplement pas supprimer les versions verrouillées."
    c:
      en: "Compliance mode protects a version from every user and from Lifecycle expiration; nothing can delete it before its retention expires."
      fr: "Le mode conformité protège une version contre tout utilisateur et contre l'expiration Lifecycle ; rien ne peut la supprimer avant la fin de sa conservation."
    d:
      en: "Retention does not prevent delete markers from being added on top of an object; delete markers are not WORM-protected."
      fr: "La conservation n'empêche pas l'ajout de marqueurs de suppression au-dessus d'un objet ; les marqueurs de suppression ne sont pas protégés en WORM."
references:
  - title: Object Lock considerations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-managing.html
