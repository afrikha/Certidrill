id: scsc03-5b-cloudhsm-keystore-two-hsms
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany must keep the key material of its KMS keys in single-tenant HSMs that it controls in AWS. A security engineer initialized an AWS CloudHSM cluster with one HSM in a single Availability Zone and created the kmsuser crypto user. The CreateCustomKeyStore call fails.

    What should the engineer do before trying again?
  fr: |
    AnyCompany doit conserver les éléments de clé de ses clés KMS dans des HSM à locataire unique qu'elle contrôle dans AWS. Un ingénieur sécurité a initialisé un cluster AWS CloudHSM avec un seul HSM dans une seule zone de disponibilité et a créé l'utilisateur de chiffrement kmsuser. L'appel CreateCustomKeyStore échoue.

    Que doit faire l'ingénieur avant de réessayer ?
body:
  options:
    - id: a
      text:
        en: "Add a second active HSM to the cluster in a different Availability Zone."
        fr: "Ajouter au cluster un second HSM actif dans une autre zone de disponibilité."
    - id: b
      text:
        en: "Recreate kmsuser as a crypto officer (CO) instead of a crypto user (CU)."
        fr: "Recréer kmsuser comme responsable du chiffrement (CO) au lieu d'utilisateur de chiffrement (CU)."
    - id: c
      text:
        en: "Create the cluster in a different AWS account so that AWS KMS has exclusive use of it."
        fr: "Créer le cluster dans un autre compte AWS pour qu'AWS KMS en ait l'usage exclusif."
    - id: d
      text:
        en: "Create a KMS key with an EXTERNAL origin and import key material from the HSM before creating the key store."
        fr: "Créer une clé KMS d'origine EXTERNAL et importer des éléments de clé depuis le HSM avant de créer le magasin de clés."
answer: { optionId: a }
explanation:
  correct:
    en: "The cluster of a CloudHSM key store must have at least two active HSMs in different Availability Zones, be initialized and active, and be in the same account and Region as the key store. AWS KMS then logs in to the cluster as the kmsuser crypto user."
    fr: "Le cluster d'un magasin de clés CloudHSM doit compter au moins deux HSM actifs dans des zones de disponibilité différentes, être initialisé et actif, et se trouver dans le même compte et la même Région que le magasin de clés. AWS KMS se connecte ensuite au cluster en tant qu'utilisateur de chiffrement kmsuser."
  options:
    b:
      en: "AWS KMS uses a dedicated crypto user (CU) named kmsuser, so the existing user type is correct."
      fr: "AWS KMS utilise un utilisateur de chiffrement (CU) dédié nommé kmsuser : le type d'utilisateur existant est correct."
    c:
      en: "The cluster must be in the same account and Region as the key store, and AWS KMS does not need exclusive use of the cluster."
      fr: "Le cluster doit se trouver dans le même compte et la même Région que le magasin de clés, et AWS KMS n'a pas besoin de l'usage exclusif du cluster."
    d:
      en: "Imported key material is not supported in custom key stores, and importing it is not a prerequisite for creating a key store."
      fr: "Les éléments de clé importés ne sont pas pris en charge dans les magasins de clés personnalisés, et leur importation n'est pas un prérequis à la création d'un magasin de clés."
references:
  - title: AWS CloudHSM key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-cloudhsm.html
