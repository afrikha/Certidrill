id: scsc03-5a-verified-access-endpoint-policy
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany gives employees access to 12 internal web applications through AWS Verified Access. All 12 endpoints belong to one Verified Access group, and none of them has an endpoint policy. The Verified Access instance has an AWS IAM Identity Center trust provider and a CrowdStrike device trust provider. The group policy permits any user in the Identity Center group named staff. The company is adding a payroll application to the same group. Payroll access must also require membership in the payroll group and a minimum device posture score from CrowdStrike, while the 12 existing applications keep their current access rules.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany donne aux employés l'accès à 12 applications web internes par AWS Verified Access. Les 12 points de terminaison appartiennent à un groupe Verified Access, et aucun n'a de politique de point de terminaison. L'instance Verified Access possède un fournisseur de confiance AWS IAM Identity Center et un fournisseur de confiance d'appareils CrowdStrike. La politique du groupe autorise tout utilisateur du groupe Identity Center nommé staff. L'entreprise ajoute une application de paie au même groupe. L'accès à la paie doit aussi exiger l'appartenance au groupe payroll et un score minimal de posture de l'appareil fourni par CrowdStrike, tandis que les 12 applications existantes conservent leurs règles d'accès actuelles.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Change the group policy so that it permits only users in the payroll group whose devices reach the minimum CrowdStrike score."
        fr: "Modifier la politique du groupe pour qu'elle n'autorise que les utilisateurs du groupe payroll dont les appareils atteignent le score CrowdStrike minimal."
    - id: b
      text:
        en: "Create a second Verified Access instance with new trust providers and a separate group for the payroll application."
        fr: "Créer une deuxième instance Verified Access avec de nouveaux fournisseurs de confiance et un groupe distinct pour l'application de paie."
    - id: c
      text:
        en: "Create the payroll endpoint in the group, and allow only the IP addresses of payroll staff devices in the security group of the application."
        fr: "Créer le point de terminaison de paie dans le groupe, et n'autoriser que les adresses IP des appareils du personnel de paie dans le groupe de sécurité de l'application."
    - id: d
      text:
        en: "Create the payroll endpoint in the group with an endpoint policy that permits only users in the payroll group whose devices reach the minimum CrowdStrike score."
        fr: "Créer le point de terminaison de paie dans le groupe avec une politique de point de terminaison qui n'autorise que les utilisateurs du groupe payroll dont les appareils atteignent le score CrowdStrike minimal."
answer: { optionId: d }
explanation:
  correct:
    en: "When both a group policy and an endpoint policy exist, both must allow the request. The payroll endpoint inherits the staff rule of the group, and its own Cedar endpoint policy adds the payroll group and device posture conditions from the existing trust providers. Endpoints without a policy are evaluated against the group policy only, so the other 12 applications are unchanged."
    fr: "Lorsqu'une politique de groupe et une politique de point de terminaison existent, les deux doivent autoriser la requête. Le point de terminaison de paie hérite de la règle staff du groupe, et sa propre politique de point de terminaison Cedar ajoute les conditions de groupe payroll et de posture de l'appareil issues des fournisseurs de confiance existants. Les points de terminaison sans politique ne sont évalués que par la politique du groupe : les 12 autres applications ne changent pas."
  options:
    a:
      en: "The group policy applies to every endpoint of the group, so the 12 existing applications would also require the payroll group and the device score."
      fr: "La politique du groupe s'applique à tous les points de terminaison du groupe : les 12 applications existantes exigeraient aussi le groupe payroll et le score de l'appareil."
    b:
      en: "A second instance with its own trust providers duplicates the setup and adds work, while an endpoint policy in the existing group is enough."
      fr: "Une deuxième instance avec ses propres fournisseurs de confiance duplique la configuration et ajoute du travail, alors qu'une politique de point de terminaison dans le groupe existant suffit."
    c:
      en: "Traffic reaches the application from Verified Access, not directly from the devices, and IP addresses do not prove group membership or device posture."
      fr: "Le trafic atteint l'application depuis Verified Access, pas directement depuis les appareils, et des adresses IP ne prouvent ni l'appartenance à un groupe ni la posture de l'appareil."
references:
