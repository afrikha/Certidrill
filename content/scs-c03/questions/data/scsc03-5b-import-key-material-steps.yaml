id: scsc03-5b-import-key-material-steps
objective: "5.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's policy requires that the key that encrypts its Amazon S3 data be generated in the company's on-premises HSM and that the company keep its own copy of the key material. A security engineer will create a symmetric encryption AWS KMS key that uses this key material.

    Which four actions should the engineer perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    La politique d'AnyCompany exige que la clé qui chiffre ses données Amazon S3 soit générée dans le HSM sur site de l'entreprise et que l'entreprise conserve sa propre copie des éléments de clé. Un ingénieur sécurité va créer une clé AWS KMS de chiffrement symétrique qui utilise ces éléments de clé.

    Quelles sont les quatre actions que l'ingénieur doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create a KMS key with no key material by setting its origin to EXTERNAL.", fr: "Créer une clé KMS sans éléments de clé en définissant son origine sur EXTERNAL." } }
    - { id: params, text: { en: "Call GetParametersForImport to download a wrapping public key and an import token for the KMS key.", fr: "Appeler GetParametersForImport pour télécharger une clé publique d'encapsulation et un jeton d'importation pour la clé KMS." } }
    - { id: wrap, text: { en: "Encrypt the key material from the HSM with the wrapping public key.", fr: "Chiffrer les éléments de clé issus du HSM avec la clé publique d'encapsulation." } }
    - { id: import, text: { en: "Call ImportKeyMaterial with the encrypted key material and the import token.", fr: "Appeler ImportKeyMaterial avec les éléments de clé chiffrés et le jeton d'importation." } }
    - { id: rotate, text: { en: "Enable automatic key rotation on the KMS key with a rotation period of 365 days.", fr: "Activer la rotation automatique de la clé KMS avec une période de rotation de 365 jours." } }
    - { id: keystore, text: { en: "Create an AWS CloudHSM key store and connect it to AWS KMS.", fr: "Créer un magasin de clés AWS CloudHSM et le connecter à AWS KMS." } }
answer:
  sequence: [ create, params, wrap, import ]
explanation:
  correct:
    en: "The KMS key is created first with an EXTERNAL origin, which gives it a key ID but no key material. The wrapping public key and import token are downloaded for that key, the key material is wrapped with the public key, and ImportKeyMaterial uploads it with the token from the same set, which changes the key state to Enabled."
    fr: "La clé KMS est d'abord créée avec l'origine EXTERNAL, ce qui lui donne un ID de clé mais aucun élément de clé. La clé publique d'encapsulation et le jeton d'importation sont téléchargés pour cette clé, les éléments de clé sont encapsulés avec la clé publique, puis ImportKeyMaterial les charge avec le jeton du même ensemble, ce qui fait passer l'état de la clé à Enabled."
  options:
    rotate:
      en: "Automatic rotation is supported only for keys with AWS_KMS origin; keys with imported key material use on-demand rotation."
      fr: "La rotation automatique n'est prise en charge que pour les clés d'origine AWS_KMS ; les clés avec des éléments de clé importés utilisent la rotation à la demande."
    keystore:
      en: "Key material cannot be imported into KMS keys in custom key stores, and a CloudHSM key store generates its key material in the cluster."
      fr: "Des éléments de clé ne peuvent pas être importés dans des clés KMS de magasins de clés personnalisés, et un magasin de clés CloudHSM génère ses éléments de clé dans le cluster."
references:
  - title: Importing key material for AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys.html
  - title: "Step 2: Download the wrapping public key and import token"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-get-public-key-and-token.html
