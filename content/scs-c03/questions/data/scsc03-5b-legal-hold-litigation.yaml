id: scsc03-5b-legal-hold-litigation
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany keeps customer contracts in an Amazon S3 bucket that has S3 Object Lock enabled with a default retention of 90 days in governance mode. The legal department opens a lawsuit and requires that 40 specific object versions be preserved from deletion and overwrite until the case closes. Nobody knows how long the case will last. When the case closes, the legal team must be able to lift the protection on those versions without waiting for a date.

    Which solution will meet these requirements?
  fr: |
    AnyCompany conserve les contrats clients dans un compartiment (bucket) Amazon S3 où S3 Object Lock est activé avec une conservation par défaut de 90 jours en mode gouvernance (governance). Le service juridique ouvre un litige et exige que 40 versions d'objet précises soient protégées contre la suppression et l'écrasement jusqu'à la clôture de l'affaire. Personne ne sait combien de temps durera l'affaire. À la clôture, l'équipe juridique doit pouvoir lever la protection de ces versions sans attendre une date.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set a compliance mode retention with a retain-until date 10 years in the future on each of the 40 versions."
        fr: "Définir une conservation en mode conformité (compliance) avec une date de fin de conservation dans 10 ans sur chacune des 40 versions."
    - id: b
      text:
        en: "Change the bucket's default retention to compliance mode with a period of 10 years."
        fr: "Passer la conservation par défaut du compartiment en mode conformité (compliance) avec une période de 10 ans."
    - id: c
      text:
        en: "Copy the 40 versions to a separate bucket that has MFA delete enabled, and give the legal team the root user's MFA device."
        fr: "Copier les 40 versions dans un compartiment distinct où la suppression MFA est activée, et confier à l'équipe juridique le dispositif MFA de l'utilisateur racine."
    - id: d
      text:
        en: "Place a legal hold on each of the 40 versions, and allow only the legal team's IAM role to use s3:PutObjectLegalHold."
        fr: "Placer une conservation légale sur chacune des 40 versions, et autoriser uniquement le rôle IAM de l'équipe juridique à utiliser s3:PutObjectLegalHold."
answer: { optionId: d }
explanation:
  correct:
    en: "A legal hold protects an individual object version from deletion and overwrite, has no fixed duration and stays in effect until it is removed. It is independent of the retention period, and only principals with s3:PutObjectLegalHold can place or remove it."
    fr: "Une conservation légale protège une version d'objet précise contre la suppression et l'écrasement, n'a pas de durée fixe et reste en vigueur jusqu'à son retrait. Elle est indépendante de la période de conservation, et seuls les principaux disposant de s3:PutObjectLegalHold peuvent la placer ou la retirer."
  options:
    a:
      en: "A compliance retention cannot be shortened by anyone, so the legal team could not lift the protection when the case closes."
      fr: "Une conservation en mode conformité ne peut être raccourcie par personne : l'équipe juridique ne pourrait pas lever la protection à la clôture de l'affaire."
    b:
      en: "A default retention applies only to new object versions, not to the 40 existing versions, and it locks every future object for 10 years."
      fr: "Une conservation par défaut s'applique uniquement aux nouvelles versions d'objet, pas aux 40 versions existantes, et verrouille chaque futur objet pendant 10 ans."
    c:
      en: "MFA delete does not prevent overwrites, and sharing the root user's MFA device breaks least privilege."
      fr: "La suppression MFA n'empêche pas l'écrasement, et partager le dispositif MFA de l'utilisateur racine enfreint le principe du moindre privilège."
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
