id: scsc03-5b-import-change-expiration
objective: "5.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses a symmetric encryption KMS key with imported key material to encrypt Amazon EBS volumes and Amazon RDS databases. The key material was imported 9 months ago with the KEY_MATERIAL_EXPIRES expiration model and an expiration time that is 3 months away. A new policy states that this key material must not expire, and the existing ciphertext must stay decryptable. The company keeps a secure copy of the original key material.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise une clé KMS de chiffrement symétrique avec des éléments de clé importés pour chiffrer des volumes Amazon EBS et des bases de données Amazon RDS. Les éléments de clé ont été importés il y a 9 mois avec le modèle d'expiration KEY_MATERIAL_EXPIRES et une date d'expiration dans 3 mois. Une nouvelle politique impose que ces éléments de clé n'expirent pas, et les textes chiffrés existants doivent rester déchiffrables. L'entreprise conserve une copie sécurisée des éléments de clé d'origine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Call UpdateKeyDescription with a new expiration setting, because the expiration time of the current import can be changed in place."
        fr: "Appeler UpdateKeyDescription avec un nouveau paramètre d'expiration, car la date d'expiration de l'importation en cours peut être modifiée sur place."
    - id: b
      text:
        en: "Import new key material with ImportType set to NEW_KEY_MATERIAL and the KEY_MATERIAL_DOES_NOT_EXPIRE model, and rotate the key on demand."
        fr: "Importer de nouveaux éléments de clé avec ImportType défini sur NEW_KEY_MATERIAL et le modèle KEY_MATERIAL_DOES_NOT_EXPIRE, puis effectuer une rotation de la clé à la demande."
    - id: c
      text:
        en: "Disable the KMS key, and enable it again after the expiration date so that the existing key material is kept."
        fr: "Désactiver la clé KMS, puis la réactiver après la date d'expiration pour que les éléments de clé existants soient conservés."
    - id: d
      text:
        en: "Download a new wrapping public key and import token, and reimport the same key material with the KEY_MATERIAL_DOES_NOT_EXPIRE expiration model."
        fr: "Télécharger une nouvelle clé publique d'encapsulation et un nouveau jeton d'importation, et réimporter les mêmes éléments de clé avec le modèle d'expiration KEY_MATERIAL_DOES_NOT_EXPIRE."
answer: { optionId: d }
explanation:
  correct:
    en: "After an import, the expiration of the current import cannot be set, changed or canceled; to change it, the same key material must be reimported, each time with a new wrapping key and import token. Reimporting the same material keeps every existing ciphertext decryptable."
    fr: "Après une importation, l'expiration de l'importation en cours ne peut être ni définie, ni modifiée, ni annulée ; pour la changer, il faut réimporter les mêmes éléments de clé, chaque fois avec une nouvelle clé d'encapsulation et un nouveau jeton d'importation. Réimporter les mêmes éléments conserve la possibilité de déchiffrer tous les textes chiffrés existants."
  options:
    a:
      en: "The expiration of an import cannot be changed in place, and UpdateKeyDescription only changes the key description."
      fr: "L'expiration d'une importation ne peut pas être modifiée sur place, et UpdateKeyDescription ne change que la description de la clé."
    b:
      en: "The original key material would still expire, and the key becomes unusable as soon as any of its key materials expires."
      fr: "Les éléments de clé d'origine expireraient quand même, et la clé devient inutilisable dès que l'un de ses éléments de clé expire."
    c:
      en: "Disabling a key does not stop the expiration; when the key material expires, AWS KMS deletes it and the key goes to the PendingImport state."
      fr: "La désactivation d'une clé n'arrête pas l'expiration ; à l'expiration des éléments de clé, AWS KMS les supprime et la clé passe à l'état PendingImport."
references:
  - title: "Step 4: Import the key material"
    url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-import-key-material.html
  - title: Rotate AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
