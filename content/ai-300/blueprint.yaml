# AI-300 — Operationalizing Machine Learning and Generative AI Solutions
# (Microsoft Certified: Machine Learning Operations Engineer Associate)
# Source: official study guide
# https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ai-300 (checked on 2026-11-16).
# The study guide of this 2026 exam carries no "Skills measured as of" line: blueprint.version is the
# "Last updated" date of the English study guide (October 15, 2026).
# Real exam: 120 minutes, passing score 700/1000, proctored, "may have interactive components" (labs possible),
# English only; Microsoft does not publish the number of questions (40 to 60 on most exams) nor whether
# this exam has case studies. Readiness and progression rules are those of AZ-104.
# typeMix: more code/YAML completion (dropdown) than AZ-104, fewer Yes/No statements.
# active: false until the bank and the course are reviewed and published.
certification:
  code: ai-300
  title: Operationalizing Machine Learning and Generative AI Solutions
  vendor: Microsoft
  active: false
blueprint:
  version: '2026-10-15'
  durationMin: 120
  questionCount:
    min: 45
    max: 58
  passScore: 700
  maxScore: 1000
  typeMix:
