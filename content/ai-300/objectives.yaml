# AI-300 objectives — official study guide (en-us page last updated 2026-10-15, fr-fr page; checked 2026-11-16).
# English verbatim. French from the fr-fr page, which is partly machine-translated: obvious errors were corrected
# (product names kept in English, "prompts" = invites, "fine-tuning" = réglage précis, "assets" = actifs).
# `code` is the stable key referenced by question files and course sections.
mlops:
- group:
    en: Create and manage resources in a Machine Learning workspace
    fr: Créer et gérer des ressources dans un espace de travail Machine Learning
  objectives:
  - code: 1.1.1
    en: Create and manage a workspace
    fr: Créer et gérer un espace de travail
  - code: 1.1.2
    en: Create and manage datastores
    fr: Créer et gérer des magasins de données
  - code: 1.1.3
    en: Create and manage compute targets
    fr: Créer et gérer des cibles de calcul
  - code: 1.1.4
    en: Configure identity and access management for workspaces
    fr: Configurer la gestion des identités et des accès pour les espaces de travail
- group:
    en: Create and manage assets in a Machine Learning workspace
    fr: Créer et gérer des actifs dans un espace de travail Machine Learning
  objectives:
  - code: 1.2.1
    en: Create and manage data assets
    fr: Créer et gérer des ressources de données (data assets)
  - code: 1.2.2
    en: Create and manage environments
    fr: Créer et gérer des environnements
  - code: 1.2.3
    en: Create and manage components
    fr: Créer et gérer des composants
  - code: 1.2.4
    en: Share assets across workspaces by using registries
    fr: Partager des actifs entre les espaces de travail à l'aide de registres
- group:
    en: Implement IaC for Machine Learning
    fr: Implémenter l'IaC pour Machine Learning
  objectives:
  - code: 1.3.1
    en: Configure GitHub integration with Machine Learning to enable secure access
    fr: Configurer l'intégration de GitHub à Machine Learning pour permettre un accès sécurisé
  - code: 1.3.2
    en: Deploy Machine Learning workspaces and resources by using Bicep and Azure CLI
    fr: Déployer des espaces de travail et des ressources Machine Learning à l'aide de Bicep et d'Azure CLI
  - code: 1.3.3
    en: Automate resource provisioning by using GitHub Actions workflows
    fr: Automatiser l'approvisionnement des ressources à l'aide de workflows GitHub Actions
  - code: 1.3.4
    en: Restrict network access to Machine Learning workspaces
    fr: Restreindre l'accès réseau aux espaces de travail Machine Learning
  - code: 1.3.5
    en: Manage source control for machine learning projects by using Git
    fr: Gérer le contrôle de code source pour les projets de machine learning à l'aide de Git
ml-lifecycle:
- group:
    en: Orchestrate model training
    fr: Orchestrer l'entraînement des modèles
  objectives:
  - code: 2.1.1
    en: Configure experiment tracking with MLflow
    fr: Configurer le suivi des expériences avec MLflow
  - code: 2.1.2
    en: Use automated machine learning to explore optimal models
    fr: Utiliser le machine learning automatisé pour explorer les modèles optimaux
  - code: 2.1.3
    en: Use notebooks for experimentation and exploration
    fr: Utiliser des notebooks pour l'expérimentation et l'exploration
  - code: 2.1.4
    en: Automate hyperparameter tuning
    fr: Automatiser le réglage des hyperparamètres
  - code: 2.1.5
    en: Run model training scripts
    fr: Exécuter des scripts d'entraînement de modèle
  - code: 2.1.6
    en: Manage distributed training for large and deep learning models
    fr: Gérer l'entraînement distribué pour les modèles volumineux et d'apprentissage profond
  - code: 2.1.7
    en: Implement training pipelines
    fr: Implémenter des pipelines d'entraînement
  - code: 2.1.8
    en: Compare model performance across jobs
    fr: Comparer les performances des modèles entre les travaux
- group:
    en: Implement model registration and versioning
    fr: Implémenter l'inscription et la gestion des versions des modèles
  objectives:
  - code: 2.2.1
    en: Package a feature retrieval specification with the model artifact
    fr: Empaqueter une spécification de récupération de caractéristiques avec l'artefact du modèle
  - code: 2.2.2
    en: Register an MLflow model
    fr: Inscrire un modèle MLflow
  - code: 2.2.3
    en: Evaluate a model by using responsible AI principles
    fr: Évaluer un modèle à l'aide des principes d'IA responsable
  - code: 2.2.4
    en: Manage model lifecycle, including archiving models
    fr: Gérer le cycle de vie des modèles, y compris l'archivage des modèles
- group:
    en: Deploy machine learning models for production environments
    fr: Déployer des modèles de machine learning pour les environnements de production
  objectives:
  - code: 2.3.1
    en: Deploy models as real-time or batch endpoints with managed inference options
    fr: Déployer des modèles en tant que points de terminaison en temps réel ou par lots avec des options d'inférence managée
  - code: 2.3.2
    en: Test and troubleshoot model endpoints
    fr: Tester et dépanner les points de terminaison de modèle
  - code: 2.3.3
    en: Implement progressive rollout and safe rollback strategies
    fr: Implémenter des stratégies de déploiement progressif et de restauration sécurisée
- group:
    en: Monitor and maintain machine learning models in production
    fr: Surveiller et gérer les modèles de machine learning en production
  objectives:
  - code: 2.4.1
    en: Detect and analyze data drift
    fr: Détecter et analyser la dérive des données
  - code: 2.4.2
    en: Monitor performance metrics of models deployed to production
    fr: Surveiller les métriques de performances des modèles déployés en production
  - code: 2.4.3
    en: Configure retraining or alert triggers when thresholds are exceeded
    fr: Configurer des déclencheurs de réentraînement ou d'alerte lorsque des seuils sont dépassés
genaiops:
- group:
    en: Implement Foundry environments and platform configuration
    fr: Implémenter des environnements Foundry et la configuration de la plateforme
  objectives:
  - code: 3.1.1
    en: Create and configure Foundry resources and project environments
    fr: Créer et configurer des ressources Foundry et des environnements de projet
  - code: 3.1.2
    en: Configure identity and access management with managed identities and role-based access control (RBAC)
    fr: Configurer la gestion des identités et des accès avec des identités managées et le contrôle d'accès en fonction du rôle (RBAC)
  - code: 3.1.3
    en: Implement network security and private networking configurations
    fr: Implémenter des configurations de sécurité réseau et de mise en réseau privée
  - code: 3.1.4
    en: Deploy infrastructure using Bicep templates and Azure CLI
    fr: Déployer l'infrastructure à l'aide de modèles Bicep et d'Azure CLI
- group:
    en: Deploy and manage foundation models for production workloads
    fr: Déployer et gérer des modèles de base pour les charges de travail de production
  objectives:
  - code: 3.2.1
    en: Deploy foundation models by using serverless API endpoints and managed compute options
    fr: Déployer des modèles de base à l'aide de points de terminaison d'API serverless et d'options de calcul managé
  - code: 3.2.2
    en: Select appropriate models for specific use cases
    fr: Sélectionner les modèles appropriés pour des cas d'usage spécifiques
  - code: 3.2.3
    en: Implement model versioning and production deployment strategies
    fr: Implémenter des stratégies de gestion des versions de modèles et de déploiement en production
  - code: 3.2.4
    en: Configure provisioned throughput units for high-volume workloads
    fr: Configurer des unités de débit approvisionné pour les charges de travail à volume élevé
- group:
    en: Implement prompt versioning and management with source control
    fr: Implémenter la gestion des versions et la gestion des invites avec le contrôle de code source
  objectives:
  - code: 3.3.1
    en: Design and develop prompts
    fr: Concevoir et développer des invites
  - code: 3.3.2
    en: Create prompt variants and compare performance across different prompts
    fr: Créer des variantes d'invite et comparer les performances entre différentes invites
  - code: 3.3.3
    en: Implement version control for prompts by using Git repositories
    fr: Implémenter le contrôle de version des invites à l'aide de dépôts Git
quality:
- group:
    en: Configure evaluation and validation for generative AI applications and agents
    fr: Configurer l'évaluation et la validation pour les applications et agents d'IA générative
  objectives:
  - code: 4.1.1
    en: Create test datasets and data mapping for comprehensive model evaluation
    fr: Créer des jeux de données de test et un mappage de données pour une évaluation complète des modèles
  - code: 4.1.2
    en: Implement AI quality metrics, including groundedness, relevance, coherence, and fluency
    fr: Implémenter des métriques de qualité de l'IA, notamment l'ancrage (groundedness), la pertinence, la cohérence et la fluidité
  - code: 4.1.3
    en: Configure risk and safety evaluations for harmful content detection
    fr: Configurer les évaluations des risques et de la sécurité pour la détection de contenu nuisible
  - code: 4.1.4
    en: Set up automated evaluation workflows by using built-in and custom evaluation metrics
    fr: Configurer des workflows d'évaluation automatisés à l'aide de métriques d'évaluation intégrées et personnalisées
- group:
    en: Implement observability for generative AI applications and agents
    fr: Implémenter l'observabilité pour les applications et agents d'IA générative
  objectives:
  - code: 4.2.1
    en: Examine continuous monitoring in Foundry
    fr: Examiner la surveillance continue dans Foundry
  - code: 4.2.2
    en: Monitor performance metrics, including latency, throughput, and response times
    fr: Surveiller les métriques de performances, notamment la latence, le débit et les temps de réponse
  - code: 4.2.3
    en: Track and optimize cost metrics, including token consumption and resource usage
    fr: Suivre et optimiser les métriques de coût, notamment la consommation de jetons et l'utilisation des ressources
  - code: 4.2.4
    en: Configure detailed logging, tracing, and debugging capabilities for production troubleshooting
    fr: Configurer des fonctionnalités détaillées de journalisation, de traçage et de débogage pour la résolution des problèmes en production
optimization:
- group:
    en: Optimize retrieval-augmented generation (RAG) performance and accuracy
    fr: Optimiser les performances et la précision de la génération augmentée par récupération (RAG)
  objectives:
  - code: 5.1.1
    en: Optimize retrieval performance by tuning similarity thresholds, chunk sizes, and retrieval strategies
    fr: Optimiser les performances de récupération en réglant les seuils de similarité, les tailles de bloc et les stratégies de récupération
  - code: 5.1.2
    en: Select and fine-tune embedding models for domain-specific use cases and accuracy improvements
    fr: Sélectionner et ajuster les modèles d'incorporation pour les cas d'usage propres à un domaine et l'amélioration de la précision
  - code: 5.1.3
    en: Implement and optimize hybrid search approaches combining semantic and keyword-based retrieval
    fr: Implémenter et optimiser les approches de recherche hybride combinant la récupération sémantique et la récupération par mots clés
  - code: 5.1.4
    en: Evaluate and improve RAG system performance by using relevance metrics and A/B testing frameworks
    fr: Évaluer et améliorer les performances du système RAG à l'aide de métriques de pertinence et de frameworks de test A/B
- group:
    en: Implement advanced fine-tuning and model customization
    fr: Implémenter le réglage précis avancé et la personnalisation des modèles
  objectives:
  - code: 5.2.1
    en: Design and implement advanced fine-tuning methods
    fr: Concevoir et implémenter des méthodes avancées de réglage précis
  - code: 5.2.2
    en: Create and manage synthetic data for fine-tuning
    fr: Créer et gérer des données synthétiques pour le réglage précis
  - code: 5.2.3
    en: Monitor and optimize fine-tuned model performance
    fr: Surveiller et optimiser les performances des modèles ajustés
  - code: 5.2.4
    en: Manage a fine-tuned model from development through production deployment
    fr: Gérer un modèle ajusté depuis le développement jusqu'au déploiement en production
