id: ai300-cs2b-wide-world-importers
status: draft
title:
  en: Wide World Importers
  fr: Wide World Importers
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Wide World Importers is a freight forwarding company based in Rotterdam. Its 400 customer service agents handle customs documents and customer emails for shipments between Europe and Asia.

        Wide World is deploying a generative AI application named DocDesk that summarizes the shipping documents uploaded by customers and drafts replies to customer emails. Agents review every draft before it is sent.
      fr: |
        Wide World Importers est un transitaire basé à Rotterdam. Ses 400 agents du service client traitent les documents de douane et les e-mails des clients pour les expéditions entre l'Europe et l'Asie.

        Wide World déploie une application d'IA générative nommée DocDesk, qui résume les documents d'expédition déposés par les clients et rédige des brouillons de réponse aux e-mails des clients. Les agents relisent chaque brouillon avant son envoi.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Wide World has the following Azure resources in the Sweden Central region.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | fdy-wwi | Microsoft Foundry resource | Contains a project named **docdesk** |
        | gpt-docs | Model deployment in fdy-wwi | Global Standard deployment used by DocDesk for summaries and replies |
        | ft-replies | Fine-tuned model in fdy-wwi | Trained on 3,000 anonymized replies written by senior agents; not deployed yet |
        | app-docdesk | Azure App Service web app | Hosts DocDesk; Python code that uses the azure-ai-projects package |
        | appi-wwi | Application Insights resource | Connected to the docdesk project on the **Tracing** page of the Foundry portal |

        The quality team built a test dataset of 500 rows. Each row contains a shipping document, a customer question, the response of DocDesk and a reference summary written by a senior agent.

        Some customers upload PDF documents that contain text hidden in white font or in metadata fields.
      fr: |
        Wide World dispose des ressources Azure suivantes dans la région Sweden Central.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | fdy-wwi | Ressource Microsoft Foundry | Contient un projet nommé **docdesk** |
        | gpt-docs | Déploiement de modèle dans fdy-wwi | Déploiement Global Standard utilisé par DocDesk pour les résumés et les réponses |
        | ft-replies | Modèle ajusté dans fdy-wwi | Entraîné sur 3 000 réponses anonymisées rédigées par des agents expérimentés ; pas encore déployé |
        | app-docdesk | Application web Azure App Service | Héberge DocDesk ; code Python qui utilise le package azure-ai-projects |
        | appi-wwi | Ressource Application Insights | Connectée au projet docdesk dans la page **Tracing** du portail Foundry |

        L'équipe qualité a créé un jeu de données de test de 500 lignes. Chaque ligne contient un document d'expédition, une question de client, la réponse de DocDesk et un résumé de référence rédigé par un agent expérimenté.

        Certains clients déposent des documents PDF qui contiennent du texte masqué en police blanche ou dans des champs de métadonnées.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Wide World identifies the following requirements.

        **Production deployment**

        1. Customer data must be processed only within the European Union data boundary.
        2. On Monday mornings, DocDesk sends up to 1,200 requests per minute. Latency and cost must be predictable during this peak.
        3. Requests that exceed the reserved capacity must be served by a pay-per-token deployment of the same model instead of failing.

        **Quality and safety**

        4. Summaries must not contain information that is absent from the shipping document.
        5. Replies must address the question asked by the customer.
        6. Summaries must not omit the information that the senior agents included in the reference summaries.
        7. The team must detect when DocDesk follows instructions hidden in an uploaded document.
        8. Replies must not infer the emotional state or the nationality of a customer when the email does not state it.

        **Operations**

        9. Each call that DocDesk makes to gpt-docs must appear as a trace in appi-wwi, with its token usage and duration.
        10. Testers must evaluate ft-replies interactively for one working day, without any hourly hosting charge. The test uses only anonymized data, so requirement 1 does not apply to this test.
      fr: |
        Wide World a défini les exigences suivantes.

        **Déploiement en production**

        1. Les données des clients ne doivent être traitées qu'à l'intérieur de la limite des données de l'Union européenne.
        2. Le lundi matin, DocDesk envoie jusqu'à 1 200 requêtes par minute. La latence et le coût doivent être prévisibles pendant ce pic.
        3. Les requêtes qui dépassent la capacité réservée doivent être servies par un déploiement du même modèle facturé au jeton, au lieu d'échouer.

        **Qualité et sécurité**

        4. Les résumés ne doivent pas contenir d'informations absentes du document d'expédition.
        5. Les réponses doivent répondre à la question posée par le client.
        6. Les résumés ne doivent pas omettre les informations que les agents expérimentés ont incluses dans les résumés de référence.
        7. L'équipe doit détecter les cas où DocDesk suit des instructions masquées dans un document déposé.
        8. Les réponses ne doivent pas déduire l'état émotionnel ou la nationalité d'un client quand l'e-mail ne les indique pas.

        **Exploitation**

        9. Chaque appel de DocDesk à gpt-docs doit apparaître sous forme de trace dans appi-wwi, avec sa consommation de jetons et sa durée.
        10. Les testeurs doivent évaluer ft-replies de manière interactive pendant une journée de travail, sans frais d'hébergement horaires. Le test n'utilise que des données anonymisées : l'exigence 1 ne s'applique donc pas à ce test.
