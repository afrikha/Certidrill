id: ai300-cs2a-blue-yonder
status: draft
title:
  en: Blue Yonder Airlines
  fr: Blue Yonder Airlines
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Blue Yonder Airlines is a regional airline that operates 85 aircraft. Its engineering department uses machine learning to predict the remaining useful life of aircraft engines from sensor data, so that engines are removed for maintenance before they fail.

        A data science team of eight people trains the models. A platform team of three engineers manages the Azure resources and the release process.
      fr: |
        Blue Yonder Airlines est une compagnie aérienne régionale qui exploite 85 avions. Son service d'ingénierie utilise le machine learning pour prédire la durée de vie résiduelle des moteurs d'avion à partir des données des capteurs, afin de déposer les moteurs pour maintenance avant qu'ils ne tombent en panne.

        Une équipe de huit data scientists entraîne les modèles. Une équipe plateforme de trois ingénieurs gère les ressources Azure et le processus de mise en production.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Blue Yonder has the following Azure resources in the West Europe region.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | mlw-by-dev | Azure Machine Learning workspace | Used by the data scientists; public network access enabled |
        | mlw-by-prod | Azure Machine Learning workspace | Hosts the production endpoint; no managed virtual network configured yet |
        | reg-by-shared | Azure Machine Learning registry | Created in West Europe; currently empty |
        | ep-engine-rul | Managed online endpoint in mlw-by-prod | One deployment named **blue** that serves version 3 of the MLflow model **engine-rul** and receives 100% of the traffic |
        | fdy-by-tech | Microsoft Foundry resource | Contains a project named **techassist** and a model deployment named **gpt-manuals** |
        | ca-techassist | Azure Container Apps app | Hosts the TechAssist chat application; system-assigned managed identity enabled |

        A training pipeline in mlw-by-dev produces a new version of engine-rul every month. Version 4 was registered in mlw-by-dev last week.

        The source code is stored in a GitHub repository named **by-engine-ml**. GitHub Actions workflows currently sign in to Azure by using a service principal client secret stored as a repository secret.

        TechAssist lets mechanics ask questions about maintenance manuals. It currently calls gpt-manuals by using an API key stored in an environment variable.
      fr: |
        Blue Yonder dispose des ressources Azure suivantes dans la région West Europe.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | mlw-by-dev | Espace de travail Azure Machine Learning | Utilisé par les data scientists ; accès réseau public activé |
        | mlw-by-prod | Espace de travail Azure Machine Learning | Héberge le point de terminaison de production ; aucun réseau virtuel managé configuré pour l'instant |
        | reg-by-shared | Registre Azure Machine Learning | Créé dans la région West Europe ; vide pour l'instant |
        | ep-engine-rul | Point de terminaison en ligne managé dans mlw-by-prod | Un déploiement nommé **blue** qui sert la version 3 du modèle MLflow **engine-rul** et reçoit 100 % du trafic |
        | fdy-by-tech | Ressource Microsoft Foundry | Contient un projet nommé **techassist** et un déploiement de modèle nommé **gpt-manuals** |
        | ca-techassist | Application Azure Container Apps | Héberge l'application de conversation TechAssist ; identité managée affectée par le système activée |

        Un pipeline d'entraînement dans mlw-by-dev produit chaque mois une nouvelle version d'engine-rul. La version 4 a été inscrite dans mlw-by-dev la semaine dernière.

        Le code source est stocké dans un dépôt GitHub nommé **by-engine-ml**. Les workflows GitHub Actions se connectent actuellement à Azure à l'aide d'un secret client de principal de service stocké comme secret de dépôt.

        TechAssist permet aux mécaniciens de poser des questions sur les manuels de maintenance. L'application appelle actuellement gpt-manuals à l'aide d'une clé API stockée dans une variable d'environnement.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Blue Yonder identifies the following requirements.

        **Release process**

        1. A model version validated in mlw-by-dev must be deployed to mlw-by-prod without retraining it and without copying model files manually. mlw-by-prod must use exactly the artifacts that were validated.
        2. GitHub Actions workflows must sign in to Azure without any client secret or certificate stored in GitHub.
        3. Before version 4 serves any prediction to clients, it must process a copy of 10% of the production requests while clients keep receiving the predictions of version 3. Version 4 must then receive 10% of the live traffic, and finally all of it. Version 3 must remain available until version 4 receives all the traffic.

        **Monitoring**

        4. The input features sent to ep-engine-rul must be compared with recent production data every week. The address ml-alerts@blueyonder.example must be notified when a threshold is exceeded.
        5. The actual engine removals are recorded by the workshops 30 to 60 days after each prediction, in a data asset that contains the request ID of each prediction. The mean absolute error of the model must be monitored from these records.

        **Security**

        6. mlw-by-prod must allow outbound traffic only to approved destinations. Jobs that run in mlw-by-prod must still install Python packages from pypi.org.
        7. TechAssist must stop using API keys and use the principle of least privilege.
      fr: |
        Blue Yonder a défini les exigences suivantes.

        **Processus de mise en production**

        1. Une version de modèle validée dans mlw-by-dev doit être déployée dans mlw-by-prod sans être réentraînée et sans copie manuelle des fichiers du modèle. mlw-by-prod doit utiliser exactement les artefacts validés.
        2. Les workflows GitHub Actions doivent se connecter à Azure sans qu'aucun secret client ni certificat ne soit stocké dans GitHub.
        3. Avant de servir la moindre prédiction aux clients, la version 4 doit traiter une copie de 10 % des requêtes de production, pendant que les clients continuent de recevoir les prédictions de la version 3. La version 4 doit ensuite recevoir 10 % du trafic réel, puis la totalité. La version 3 doit rester disponible jusqu'à ce que la version 4 reçoive tout le trafic.

        **Surveillance**

        4. Les caractéristiques d'entrée envoyées à ep-engine-rul doivent être comparées chaque semaine aux données de production récentes. L'adresse ml-alerts@blueyonder.example doit être prévenue quand un seuil est dépassé.
        5. Les déposes réelles de moteurs sont enregistrées par les ateliers 30 à 60 jours après chaque prédiction, dans une ressource de données qui contient l'ID de requête de chaque prédiction. L'erreur absolue moyenne du modèle doit être surveillée à partir de ces enregistrements.

        **Sécurité**

        6. mlw-by-prod ne doit autoriser le trafic sortant que vers des destinations approuvées. Les travaux exécutés dans mlw-by-prod doivent toujours pouvoir installer des packages Python depuis pypi.org.
        7. TechAssist doit cesser d'utiliser des clés API et respecter le principe du moindre privilège.
