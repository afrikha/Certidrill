id: ai300-cs3b-lucerne-publishing
status: draft
title:
  en: Lucerne Publishing
  fr: Lucerne Publishing
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Lucerne Publishing is a news and book publisher based in Vienna. Its newsroom of 300 journalists publishes in German and English, and its archive holds two million articles.

        Lucerne runs **Newsroom Assistant**, a retrieval-augmented generation (RAG) application that answers journalists' questions from the archive. Lucerne plans three new generative AI workloads:

        - **Archive tagging**: a nightly job that assigns topic tags to the archived articles.
        - **Headline Lab**: a prototype that suggests headlines for draft articles to a few editors.
        - **Marketing copy generator**: a tool that writes advertising copy for Lucerne's books.
      fr: |
        Lucerne Publishing est un éditeur de presse et de livres basé à Vienne. Sa rédaction de 300 journalistes publie en allemand et en anglais, et ses archives comptent deux millions d'articles.

        Lucerne exploite **Newsroom Assistant**, une application de génération augmentée par récupération (RAG) qui répond aux questions des journalistes à partir des archives. Lucerne prévoit trois nouvelles charges de travail d'IA générative :

        - **Étiquetage des archives** : un travail nocturne qui attribue des étiquettes thématiques aux articles archivés.
        - **Headline Lab** : un prototype qui suggère des titres pour les brouillons d'articles à quelques rédacteurs.
        - **Générateur de textes marketing** : un outil qui rédige des textes publicitaires pour les livres de Lucerne.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Lucerne has the following resources in the Sweden Central region.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | fdy-lucerne | Microsoft Foundry resource | Contains a project named **proj-newsroom** |
        | gpt-newsroom | gpt-4.1 deployment in fdy-lucerne | Data Zone Standard deployment used by Newsroom Assistant; version upgrade policy set to upgrade once a new default version becomes available |
        | srch-lucerne | Azure AI Search service | Index **articles-idx** with 400,000 chunks; vector field **contentVector** uses the cosine metric |
        | app-newsroom | Azure App Service web app | Hosts Newsroom Assistant; Python code that uses the OpenAI SDK, `configure_azure_monitor()` and `OpenAIInstrumentor().instrument()` |
        | appi-lucerne | Application Insights resource | Not yet connected to fdy-lucerne |

        Newsroom Assistant sends vector-only queries to articles-idx with `"k": 5`.

        The developers of Newsroom Assistant have the Foundry User role on proj-newsroom and the Reader role on fdy-lucerne. Marta, the newsroom AI lead, has no role assignment yet. All deployment types are available for gpt-4.1 in fdy-lucerne.
      fr: |
        Lucerne dispose des ressources suivantes dans la région Sweden Central.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | fdy-lucerne | Ressource Microsoft Foundry | Contient un projet nommé **proj-newsroom** |
        | gpt-newsroom | Déploiement gpt-4.1 dans fdy-lucerne | Déploiement Data Zone Standard utilisé par Newsroom Assistant ; stratégie de mise à niveau de version réglée pour mettre à niveau dès qu'une nouvelle version par défaut est disponible |
        | srch-lucerne | Service Azure AI Search | Index **articles-idx** de 400 000 blocs ; le champ vectoriel **contentVector** utilise la métrique cosinus |
        | app-newsroom | Application web Azure App Service | Héberge Newsroom Assistant ; code Python qui utilise le SDK OpenAI, `configure_azure_monitor()` et `OpenAIInstrumentor().instrument()` |
        | appi-lucerne | Ressource Application Insights | Pas encore connectée à fdy-lucerne |

        Newsroom Assistant envoie des requêtes uniquement vectorielles à articles-idx avec `"k": 5`.

        Les développeurs de Newsroom Assistant disposent du rôle Foundry User sur proj-newsroom et du rôle Reader sur fdy-lucerne. Marta, responsable IA de la rédaction, n'a encore aucune attribution de rôle. Tous les types de déploiement sont disponibles pour gpt-4.1 dans fdy-lucerne.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Lucerne identifies the following requirements.

        **Model deployments**

        1. Article content must be processed only within the EU data zone. Marketing copy contains only public material and has no data residency requirement.
        2. Archive tagging must cost as little as possible. Results returned within 24 hours are acceptable.
        3. Headline Lab has a low, bursty volume of requests and must use pay-per-token billing.
        4. The marketing copy generator must return responses in real time, use pay-per-token billing, and benefit from the highest default quota.
        5. gpt-newsroom must never run a model version that the editorial team hasn't validated, even when its current version is retired. The team will create a new deployment for each validated version.

        **Access**

        6. Marta must be able to build and evaluate in proj-newsroom and to grant new developers access to proj-newsroom. She must not be able to create or modify model deployments. Use the principle of least privilege.

        **Retrieval**

        7. When no article answers a question, Newsroom Assistant currently answers from loosely related chunks. Chunks whose cosine similarity to the question is below 0.8 must be excluded from the results. Newsroom Assistant can use preview REST API versions of Azure AI Search.

        **Operations**

        8. The finance team needs a monthly chart that shows, for each model deployment of fdy-lucerne, the number of tokens generated in completions.
        9. The traces of all the current and future projects of fdy-lucerne must be stored in appi-lucerne. The support engineers must be able to view the traces in the Foundry portal. The Log Analytics workspace that stores the data of appi-lucerne uses protected tables. Use the principle of least privilege.
      fr: |
        Lucerne a défini les exigences suivantes.

        **Déploiements de modèles**

        1. Le contenu des articles ne doit être traité qu'à l'intérieur de la zone de données UE. Les textes marketing ne contiennent que du contenu public et n'ont aucune exigence de résidence des données.
        2. L'étiquetage des archives doit coûter le moins possible. Des résultats renvoyés sous 24 heures sont acceptables.
        3. Headline Lab reçoit un faible volume de requêtes, irrégulier, et doit être facturé au jeton.
        4. Le générateur de textes marketing doit renvoyer des réponses en temps réel, être facturé au jeton et bénéficier du quota par défaut le plus élevé.
        5. gpt-newsroom ne doit jamais exécuter une version de modèle que l'équipe éditoriale n'a pas validée, même quand sa version actuelle est mise hors service. L'équipe créera un nouveau déploiement pour chaque version validée.

        **Accès**

        6. Marta doit pouvoir créer et évaluer dans proj-newsroom et accorder l'accès à proj-newsroom aux nouveaux développeurs. Elle ne doit pas pouvoir créer ni modifier de déploiements de modèles. Appliquez le principe du moindre privilège.

        **Récupération**

        7. Quand aucun article ne répond à une question, Newsroom Assistant répond actuellement à partir de blocs vaguement liés. Les blocs dont la similarité cosinus avec la question est inférieure à 0,8 doivent être exclus des résultats. Newsroom Assistant peut utiliser des versions préliminaires de l'API REST d'Azure AI Search.

        **Exploitation**

        8. L'équipe financière a besoin d'un graphique mensuel qui montre, pour chaque déploiement de modèle de fdy-lucerne, le nombre de jetons générés dans les complétions.
        9. Les traces de tous les projets actuels et futurs de fdy-lucerne doivent être stockées dans appi-lucerne. Les ingénieurs du support doivent pouvoir consulter les traces dans le portail Foundry. L'espace de travail Log Analytics qui stocke les données d'appi-lucerne utilise des tables protégées. Appliquez le principe du moindre privilège.
