id: ai300-cs3a-humongous-insurance
status: draft
title:
  en: Humongous Insurance
  fr: Humongous Insurance
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Humongous Insurance is a car and home insurer based in Brussels, with 2.4 million policyholders in Belgium and France. Claims contain personal data and are subject to audits by the insurance regulator.

        A team of eight data scientists trains a claims fraud model in Azure Machine Learning. A platform team manages the Azure infrastructure, and a model risk team validates every model before release.

        Humongous is also piloting **ClaimBrief**, a generative AI application that summarizes the notes written by claim adjusters for the claim handlers.
      fr: |
        Humongous Insurance est un assureur automobile et habitation basé à Bruxelles, qui compte 2,4 millions d'assurés en Belgique et en France. Les sinistres contiennent des données personnelles et font l'objet d'audits par l'autorité de contrôle des assurances.

        Une équipe de huit data scientists entraîne un modèle de détection de fraude aux sinistres dans Azure Machine Learning. Une équipe plateforme gère l'infrastructure Azure, et une équipe de gestion du risque de modèle valide chaque modèle avant sa mise en production.

        Humongous teste également **ClaimBrief**, une application d'IA générative qui résume les notes rédigées par les experts sinistres à l'intention des gestionnaires de sinistres.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Humongous has the following resources in the West Europe region.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | mlw-claims-dev | Azure Machine Learning workspace | Resource group rg-claims-dev; public network access enabled; contains a credential-based datastore named **claims-sql-export** that uses a SAS token |
        | fraud-model | Model in mlw-claims-dev | MLflow model with a scikit-learn flavor (gradient boosting classifier) trained on tabular claims data; versions 1 to 7 |
        | cpu-cluster | Compute cluster in mlw-claims-dev | Created by the platform team |
        | main.bicep | Bicep file in the GitHub repository | Deploys a new workspace named **mlw-claims-prod** to the resource group rg-claims-prod; the private endpoint of the workspace is defined in a separate module |
        | proj-claimbrief | Microsoft Foundry project | Hosts ClaimBrief and a judge model deployment named **gpt-judge** |

        Versions 1 to 4 of fraud-model are superseded. Version 7 is the production version, and a scheduled validation pipeline references versions 5 and 6 explicitly.

        Ines, an actuary, trains experimental versions of the model on her laptop in Visual Studio Code. She logs parameters and metrics with MLflow, but the runs are stored only in a local mlruns folder.

        The quality team built a test dataset for ClaimBrief. Each row has the following columns: **claim_id**, **adjuster_notes**, **handler_question**, **brief** (the summary generated by ClaimBrief) and **reference_brief** (a summary written by a senior handler).
      fr: |
        Humongous dispose des ressources suivantes dans la région West Europe.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | mlw-claims-dev | Espace de travail Azure Machine Learning | Groupe de ressources rg-claims-dev ; accès réseau public activé ; contient un magasin de données basé sur des informations d'identification nommé **claims-sql-export**, qui utilise un jeton SAS |
        | fraud-model | Modèle dans mlw-claims-dev | Modèle MLflow avec une saveur scikit-learn (classifieur à gradient boosting) entraîné sur des données tabulaires de sinistres ; versions 1 à 7 |
        | cpu-cluster | Cluster de calcul dans mlw-claims-dev | Créé par l'équipe plateforme |
        | main.bicep | Fichier Bicep dans le dépôt GitHub | Déploie un nouvel espace de travail nommé **mlw-claims-prod** dans le groupe de ressources rg-claims-prod ; le point de terminaison privé de l'espace de travail est défini dans un module distinct |
        | proj-claimbrief | Projet Microsoft Foundry | Héberge ClaimBrief et un déploiement de modèle juge nommé **gpt-judge** |

        Les versions 1 à 4 de fraud-model sont obsolètes. La version 7 est la version de production, et un pipeline de validation planifié référence explicitement les versions 5 et 6.

        Ines, actuaire, entraîne des versions expérimentales du modèle sur son ordinateur portable dans Visual Studio Code. Elle journalise les paramètres et les métriques avec MLflow, mais les exécutions ne sont stockées que dans un dossier mlruns local.

        L'équipe qualité a créé un jeu de données de test pour ClaimBrief. Chaque ligne contient les colonnes suivantes : **claim_id**, **adjuster_notes**, **handler_question**, **brief** (le résumé généré par ClaimBrief) et **reference_brief** (un résumé rédigé par un gestionnaire expérimenté).
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Humongous identifies the following requirements.

        **Production workspace**

        1. mlw-claims-prod must be reachable only through private endpoints.
        2. Compute in mlw-claims-prod must run in a workspace managed virtual network, and training jobs must be able to download packages from any public internet source.
        3. The diagnostic data that Microsoft collects from mlw-claims-prod must be minimized.

        **Access**

        4. External auditors must be able to view the assets of mlw-claims-dev, but they must never be able to see datastore credentials.
        5. Data scientists must be able to run jobs and register models in mlw-claims-dev, but they must not be able to create or delete compute.

        **Model governance**

        6. Ines's runs must be stored in mlw-claims-dev, in an experiment named **fraud-gbm**.
        7. Before each release, the model risk team must:
           - compare the accuracy and the fraud-flag rate of the model across age bands of policyholders;
           - identify the cohorts of claims in which the model makes the most errors;
           - explain to a claim handler which features drove the fraud score of one specific claim;
           - estimate, from historical claims, how requiring a police report affects the settlement amount.
        8. Versions 1 to 4 of fraud-model must no longer appear in the model lists of mlw-claims-dev. Every pipeline that references a version explicitly must keep working, and the versions registered later must appear in the lists as usual.

        **ClaimBrief**

        9. Before release, the quality team must run risk and safety evaluations of ClaimBrief on the test dataset. The evaluations must include a check for violent content: some claims describe assaults, so low-severity violent content is expected in some briefs. No new model deployment may be created for these evaluations.
      fr: |
        Humongous a défini les exigences suivantes.

        **Espace de travail de production**

        1. mlw-claims-prod ne doit être accessible que par des points de terminaison privés.
        2. Les calculs de mlw-claims-prod doivent s'exécuter dans un réseau virtuel managé de l'espace de travail, et les travaux d'entraînement doivent pouvoir télécharger des packages depuis n'importe quelle source publique sur Internet.
        3. Les données de diagnostic que Microsoft collecte depuis mlw-claims-prod doivent être réduites au minimum.

        **Accès**

        4. Les auditeurs externes doivent pouvoir consulter les actifs de mlw-claims-dev, mais ne doivent jamais pouvoir voir les informations d'identification des magasins de données.
        5. Les data scientists doivent pouvoir exécuter des travaux et inscrire des modèles dans mlw-claims-dev, mais ne doivent pas pouvoir créer ni supprimer de calculs.

        **Gouvernance des modèles**

        6. Les exécutions d'Ines doivent être stockées dans mlw-claims-dev, dans une expérience nommée **fraud-gbm**.
        7. Avant chaque mise en production, l'équipe de gestion du risque de modèle doit :
           - comparer l'exactitude et le taux de signalement de fraude du modèle entre les tranches d'âge des assurés ;
           - identifier les cohortes de sinistres dans lesquelles le modèle fait le plus d'erreurs ;
           - expliquer à un gestionnaire de sinistres quelles caractéristiques ont déterminé le score de fraude d'un sinistre précis ;
           - estimer, à partir des sinistres historiques, l'effet de l'exigence d'un procès-verbal de police sur le montant de l'indemnisation.
        8. Les versions 1 à 4 de fraud-model ne doivent plus apparaître dans les listes de modèles de mlw-claims-dev. Chaque pipeline qui référence explicitement une version doit continuer à fonctionner, et les versions inscrites par la suite doivent apparaître normalement dans les listes.

        **ClaimBrief**

        9. Avant la mise en production, l'équipe qualité doit exécuter des évaluations des risques et de la sécurité de ClaimBrief sur le jeu de données de test. Les évaluations doivent inclure un contrôle du contenu violent : certains sinistres décrivent des agressions, un contenu violent de faible gravité est donc attendu dans certains résumés. Aucun nouveau déploiement de modèle ne doit être créé pour ces évaluations.
