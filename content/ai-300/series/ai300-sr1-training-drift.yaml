id: ai300-sr1-training-drift
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has an Azure Machine Learning workspace. A loan-default classification model is deployed as a deployment named **main** of a managed online endpoint named **ep-loan**. Data collection is enabled on main for the model inputs and the model outputs. The training data is registered as an `mltable` data asset named **loan-train**, version **3**, whose target column is `defaulted`.

    You need to configure model monitoring by running `az ml schedule create -f monitor.yaml`. Every day, the monitor must compare the distribution of the production input values of the 10 most important features with their distribution in the **training data**, and send an email to mlops@northwind.example when a drift threshold is exceeded.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'un espace de travail Azure Machine Learning. Un modèle de classification du défaut de paiement des prêts est déployé sous la forme d'un déploiement nommé **main** d'un point de terminaison en ligne managé nommé **ep-loan**. La collecte de données est activée sur main pour les entrées et les sorties du modèle. Les données d'entraînement sont inscrites sous la forme d'une ressource de données `mltable` nommée **loan-train**, version **3**, dont la colonne cible est `defaulted`.

    Vous devez configurer la surveillance du modèle en exécutant `az ml schedule create -f monitor.yaml`. Chaque jour, le moniteur doit comparer la distribution des valeurs d'entrée de production des 10 caractéristiques les plus importantes avec leur distribution dans les **données d'entraînement**, et envoyer un e-mail à mlops@northwind.example lorsqu'un seuil de dérive est dépassé.
