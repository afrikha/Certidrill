id: ai300-sr2-ungrounded-claims
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has a Microsoft Foundry project that hosts a retrieval-augmented generation (RAG) assistant for internal HR policies. You export 300 conversations to a JSONL test dataset. Each row contains a `query` column (the user question), a `context` column (the policy chunks that were retrieved) and a `response` column (the assistant answer). No reference answers exist, and the HR team won't write any.

    Auditors found that some answers state rules that appear in none of the retrieved chunks. You need to configure a built-in evaluator that scores each row of the dataset. The solution must meet the following requirements:

    - The score must reveal responses that contain information not supported by the retrieved chunks.
    - The evaluation must use only the columns of the existing dataset.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'un projet Microsoft Foundry qui héberge un assistant de génération augmentée par récupération (RAG) pour les politiques RH internes. Vous exportez 300 conversations dans un jeu de données de test JSONL. Chaque ligne contient une colonne `query` (la question de l'utilisateur), une colonne `context` (les blocs de politique récupérés) et une colonne `response` (la réponse de l'assistant). Aucune réponse de référence n'existe, et l'équipe RH n'en rédigera pas.

    Des auditeurs ont constaté que certaines réponses énoncent des règles qui ne figurent dans aucun des blocs récupérés. Vous devez configurer un évaluateur intégré qui note chaque ligne du jeu de données. La solution doit répondre aux exigences suivantes :

    - La note doit révéler les réponses qui contiennent des informations non étayées par les blocs récupérés.
    - L'évaluation ne doit utiliser que les colonnes du jeu de données existant.
