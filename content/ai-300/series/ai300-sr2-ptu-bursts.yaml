id: ai300-sr2-ptu-bursts
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has a Microsoft Foundry resource named **nw-foundry**. The resource has a Data Zone Provisioned deployment named **claims-ptu** of a specific version of a GPT model. A claims-processing application sends all its chat completion requests to claims-ptu.

    The provisioned throughput units (PTUs) of claims-ptu are sized for normal daily traffic. During the last two days of each month, traffic bursts exceed that capacity and some requests receive HTTP 429 responses.

    You need to handle the month-end bursts. The solution must meet the following requirements:

    - Requests that claims-ptu can't process during a burst must still be processed.
    - The code and the requests of the claims-processing application must not change.
    - You must not pay for provisioned capacity that stays unused outside the bursts.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'une ressource Microsoft Foundry nommée **nw-foundry**. La ressource comporte un déploiement Data Zone Provisioned nommé **claims-ptu** d'une version précise d'un modèle GPT. Une application de traitement des sinistres envoie toutes ses requêtes de complétion de conversation à claims-ptu.

    Les unités de débit approvisionné (PTU) de claims-ptu sont dimensionnées pour le trafic quotidien normal. Pendant les deux derniers jours de chaque mois, des pics de trafic dépassent cette capacité et certaines requêtes reçoivent des réponses HTTP 429.

    Vous devez absorber les pics de fin de mois. La solution doit répondre aux exigences suivantes :

    - Les requêtes que claims-ptu ne peut pas traiter pendant un pic doivent quand même être traitées.
    - Le code et les requêtes de l'application de traitement des sinistres ne doivent pas changer.
    - Vous ne devez pas payer de capacité approvisionnée qui reste inutilisée en dehors des pics.
