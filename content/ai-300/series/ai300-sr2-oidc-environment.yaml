id: ai300-sr2-oidc-environment
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has an Azure Machine Learning workspace named **mlw-prod** and a GitHub repository named **fabrikam/churn-mlops**. A workflow in the repository contains a job named **deploy** that runs Azure CLI `az ml` commands against mlw-prod.

    The deploy job declares `environment: production`. The **production** GitHub environment requires a reviewer to approve each run. Another administrator will assign the required role on mlw-prod to the identity that you choose.

    You need to configure how the deploy job signs in to Azure. The solution must meet the following requirements:

    - The deploy job must sign in successfully when it runs in the production environment.
    - No credential that expires or must be rotated can be stored in GitHub.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'un espace de travail Azure Machine Learning nommé **mlw-prod** et d'un dépôt GitHub nommé **fabrikam/churn-mlops**. Un workflow du dépôt contient un travail nommé **deploy** qui exécute des commandes Azure CLI `az ml` sur mlw-prod.

    Le travail deploy déclare `environment: production`. L'environnement GitHub **production** exige qu'un réviseur approuve chaque exécution. Un autre administrateur attribuera le rôle nécessaire sur mlw-prod à l'identité que vous choisirez.

    Vous devez configurer la façon dont le travail deploy se connecte à Azure. La solution doit répondre aux exigences suivantes :

    - Le travail deploy doit se connecter correctement quand il s'exécute dans l'environnement production.
    - Aucune information d'identification qui expire ou doit être renouvelée ne peut être stockée dans GitHub.
