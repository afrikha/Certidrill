id: ai300-sr2-sweep-slack
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso has an Azure Machine Learning workspace named **mlw-contoso**. A data scientist submits a sweep job by using the Python SDK v2 to tune a gradient boosting model. The training script logs a metric named `val_auc` with `mlflow.log_metric()` after each boosting round, and the sweep job uses random sampling with `val_auc` as the primary metric to maximize.

    You need to add an early termination policy to the sweep job. The solution must meet the following requirements:

    - Each running trial must be compared with the best-performing trial, and canceled when its `val_auc` falls outside a tolerance ratio of 0.1 relative to the best trial.
    - The policy must be applied at every interval, but not during the first five intervals.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso dispose d'un espace de travail Azure Machine Learning nommé **mlw-contoso**. Un scientifique des données soumet un travail de balayage (sweep) avec le SDK Python v2 pour régler un modèle de gradient boosting. Le script d'entraînement enregistre une métrique nommée `val_auc` avec `mlflow.log_metric()` après chaque cycle de boosting, et le travail de balayage utilise l'échantillonnage aléatoire avec `val_auc` comme métrique principale à maximiser.

    Vous devez ajouter une stratégie d'arrêt anticipé au travail de balayage. La solution doit répondre aux exigences suivantes :

    - Chaque essai en cours doit être comparé à l'essai le plus performant, et annulé quand sa valeur `val_auc` sort d'une tolérance de ratio 0,1 par rapport au meilleur essai.
    - La stratégie doit être appliquée à chaque intervalle, mais pas pendant les cinq premiers intervalles.
