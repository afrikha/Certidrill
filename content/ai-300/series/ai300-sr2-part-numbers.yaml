id: ai300-sr2-part-numbers
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a RAG application that answers technician questions about spare parts. The application retrieves chunks from an Azure AI Search index named **parts-idx**. Each document of parts-idx has a searchable text field named `content` and a vector field named `contentVector` that contains embeddings of `content`. Semantic ranker is enabled on the search service, and parts-idx has a semantic configuration named **parts-sem**.

    Today, the application embeds each user question with the same embedding model and sends a vector-only query on `contentVector` with `k` set to 5. Questions that describe a symptom return good chunks, but questions that contain an exact part number, such as **TX-4471-B**, often return chunks about other parts.

    You need to modify the retrieval query. The solution must meet the following requirements:

    - Chunks that contain the exact part number in a question must be retrieved.
    - Questions that describe a symptom must still retrieve conceptually similar chunks.
    - The application must send a single query request for each user question.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'une application RAG qui répond aux questions des techniciens sur les pièces détachées. L'application récupère des blocs dans un index Azure AI Search nommé **parts-idx**. Chaque document de parts-idx comporte un champ de texte utilisable dans les recherches nommé `content` et un champ vectoriel nommé `contentVector` qui contient les incorporations de `content`. Le classeur sémantique est activé sur le service de recherche, et parts-idx comporte une configuration sémantique nommée **parts-sem**.

    Aujourd'hui, l'application convertit chaque question de l'utilisateur en incorporation avec le même modèle d'incorporation et envoie une requête uniquement vectorielle sur `contentVector` avec `k` défini sur 5. Les questions qui décrivent un symptôme renvoient de bons blocs, mais les questions qui contiennent un numéro de pièce exact, par exemple **TX-4471-B**, renvoient souvent des blocs sur d'autres pièces.

    Vous devez modifier la requête de récupération. La solution doit répondre aux exigences suivantes :

    - Les blocs qui contiennent le numéro de pièce exact d'une question doivent être récupérés.
    - Les questions qui décrivent un symptôme doivent toujours récupérer des blocs conceptuellement similaires.
    - L'application doit envoyer une seule requête de recherche pour chaque question de l'utilisateur.
