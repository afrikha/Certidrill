id: ai300-sr1-error-codes
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a RAG support assistant that retrieves chunks from an Azure AI Search index named **kb-index**. The index has a searchable text field named `content` and a vector field named `contentVector`. A vectorizer that calls the embedding model used at indexing time is assigned to `contentVector`, and a semantic configuration named **kb-semantic** exists.

    Today the assistant sends a full-text query only. You need to change the query body that the assistant sends to the Search Documents REST API so that:

    - Questions that contain an exact error code, such as `ERR-4012`, retrieve the chunks that contain this code.
    - Paraphrased questions that share no terms with the relevant chunks still retrieve those chunks.
    - Each user question triggers one request that returns one merged result set.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un assistant de support RAG qui récupère des blocs dans un index Azure AI Search nommé **kb-index**. L'index comporte un champ texte pouvant faire l'objet d'une recherche nommé `content` et un champ vectoriel nommé `contentVector`. Un vectoriseur qui appelle le modèle d'incorporation utilisé lors de l'indexation est attribué à `contentVector`, et une configuration sémantique nommée **kb-semantic** existe.

    Aujourd'hui, l'assistant envoie uniquement une requête en texte intégral. Vous devez modifier le corps de la requête que l'assistant envoie à l'API REST Search Documents de sorte que :

    - Les questions qui contiennent un code d'erreur exact, comme `ERR-4012`, récupèrent les blocs qui contiennent ce code.
    - Les questions reformulées qui ne partagent aucun terme avec les blocs pertinents récupèrent quand même ces blocs.
    - Chaque question d'utilisateur déclenche une seule requête qui renvoie un seul jeu de résultats fusionné.
