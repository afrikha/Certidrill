id: ai300-sr1-fabrication-eval
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware has a retrieval-augmented generation (RAG) application built in a Microsoft Foundry project. You export 500 production interactions to a JSONL test dataset. Each line contains three fields: `query` (the user question), `context` (the chunks retrieved for that question) and `response` (the answer generated by the application). The dataset contains no ground-truth answers.

    Reviewers report that some answers include facts that appear in none of the retrieved chunks. You need to configure a built-in evaluator in a Foundry evaluation run so that each response receives a score that measures whether its content is supported by the retrieved chunks. The evaluator uses a judge model deployment whose name is stored in `model_deployment`.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware dispose d'une application de génération augmentée par récupération (RAG) créée dans un projet Microsoft Foundry. Vous exportez 500 interactions de production dans un jeu de données de test JSONL. Chaque ligne contient trois champs : `query` (la question de l'utilisateur), `context` (les blocs récupérés pour cette question) et `response` (la réponse générée par l'application). Le jeu de données ne contient aucune réponse de vérité terrain (ground truth).

    Des réviseurs signalent que certaines réponses contiennent des faits qui ne figurent dans aucun des blocs récupérés. Vous devez configurer un évaluateur intégré dans une exécution d'évaluation Foundry afin que chaque réponse reçoive un score indiquant si son contenu est étayé par les blocs récupérés. L'évaluateur utilise un déploiement de modèle juge dont le nom est stocké dans `model_deployment`.
