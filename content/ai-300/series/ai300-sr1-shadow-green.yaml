id: ai300-sr1-shadow-green
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has an Azure Machine Learning managed online endpoint named **ep-credit**. A deployment named **blue** receives 100 percent of the endpoint traffic. You create a second deployment named **green** that runs a new version of the credit-scoring model. green currently receives no traffic.

    Before you route any client to green, you need to validate green against real production requests. A copy of **20 percent** of the requests that client applications send to ep-credit must be processed by green so that you can review its latency, errors and logs. Client applications must keep receiving only the predictions of blue.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un point de terminaison en ligne managé Azure Machine Learning nommé **ep-credit**. Un déploiement nommé **blue** reçoit 100 % du trafic du point de terminaison. Vous créez un second déploiement nommé **green** qui exécute une nouvelle version du modèle d'évaluation de crédit. green ne reçoit actuellement aucun trafic.

    Avant d'orienter un client vers green, vous devez valider green avec de vraies requêtes de production. Une copie de **20 %** des requêtes que les applications clientes envoient à ep-credit doit être traitée par green afin que vous puissiez examiner sa latence, ses erreurs et ses journaux. Les applications clientes doivent continuer à recevoir uniquement les prédictions de blue.
