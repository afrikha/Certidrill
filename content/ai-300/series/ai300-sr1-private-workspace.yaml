id: ai300-sr1-private-workspace
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has an Azure Machine Learning workspace named **mlw-fab-prod** in the resource group **rg-ml**. The workspace was created with the default network settings, so it accepts connections from the public internet. It contains no compute resources yet.

    Fabrikam's data scientists work from virtual machines in a virtual network named **vnet-ds** in the same region. Outbound internet traffic from vnet-ds goes through a NAT gateway.

    You need to ensure that the data scientists can use the studio, the Azure CLI and the Python SDK v2 with mlw-fab-prod only through a private IP address in vnet-ds. Connections to the workspace from the public internet must be rejected.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'un espace de travail Azure Machine Learning nommé **mlw-fab-prod** dans le groupe de ressources **rg-ml**. L'espace de travail a été créé avec les paramètres réseau par défaut : il accepte donc les connexions depuis l'Internet public. Il ne contient encore aucune ressource de calcul.

    Les scientifiques des données de Fabrikam travaillent depuis des machines virtuelles situées dans un réseau virtuel nommé **vnet-ds**, dans la même région. Le trafic Internet sortant de vnet-ds passe par une passerelle NAT.

    Vous devez faire en sorte que les scientifiques des données puissent utiliser le studio, Azure CLI et le SDK Python v2 avec mlw-fab-prod uniquement via une adresse IP privée de vnet-ds. Les connexions à l'espace de travail depuis l'Internet public doivent être refusées.
