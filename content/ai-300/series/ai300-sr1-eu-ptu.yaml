id: ai300-sr1-eu-ptu
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has a Microsoft Foundry resource in the **Sweden Central** region. A customer-support assistant will call an Azure OpenAI model deployed in this resource. The model and the provisioned throughput unit (PTU) quota that Litware needs are available in Sweden Central for the Global Provisioned, Data Zone Provisioned and Regional Provisioned deployment types.

    The assistant will send a high and steady volume of requests around the clock. You need to deploy the model so that:

    - Prompts and responses are processed only in the European Union.
    - Latency stays predictable because the deployment uses dedicated capacity instead of capacity shared with other customers.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'une ressource Microsoft Foundry dans la région **Sweden Central**. Un assistant de support client appellera un modèle Azure OpenAI déployé dans cette ressource. Le modèle et le quota d'unités de débit approvisionné (PTU) dont Litware a besoin sont disponibles dans Sweden Central pour les types de déploiement Global Provisioned, Data Zone Provisioned et Regional Provisioned.

    L'assistant enverra un volume de requêtes élevé et régulier en continu. Vous devez déployer le modèle de sorte que :

    - Les invites et les réponses soient traitées uniquement dans l'Union européenne.
    - La latence reste prévisible, car le déploiement utilise une capacité dédiée et non une capacité partagée avec d'autres clients.
