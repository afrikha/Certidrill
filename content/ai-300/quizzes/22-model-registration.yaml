chapter: 22-model-registration
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-22-01
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam is generating a Responsible AI dashboard for a registered loan approval model in Azure Machine Learning. Before the model is approved, reviewers want to check whether some age bands and regions are overrepresented or underrepresented in the dataset.

        Which dashboard component should the reviewers use?
      fr: |
        Fabrikam génère un tableau de bord IA responsable pour un modèle inscrit d'approbation de prêts dans Azure Machine Learning. Avant que le modèle soit approuvé, les réviseurs veulent vérifier si certaines tranches d'âge et certaines régions sont surreprésentées ou sous-représentées dans le jeu de données.

        Quel composant du tableau de bord les réviseurs doivent-ils utiliser ?
    body:
      options:
        - { id: a, text: { en: "Error analysis", fr: "Analyse des erreurs" } }
        - { id: b, text: { en: "Fairness assessment", fr: "Évaluation de l'équité" } }
        - { id: c, text: { en: "Data analysis", fr: "Analyse des données" } }
        - { id: d, text: { en: "Counterfactual what-if", fr: "Simulation contrefactuelle (what-if)" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Data analysis explores the distributions and statistics of the dataset, by feature, by predicted and actual outcome and by cohort. It's the component that reveals overrepresentation and underrepresentation, a frequent root cause of errors and fairness issues.
        fr: |
          L'analyse des données explore les distributions et les statistiques du jeu de données, par caractéristique, par résultat prédit et réel et par cohorte. C'est le composant qui révèle la surreprésentation et la sous-représentation, cause fréquente d'erreurs et de problèmes d'équité.
      options:
        a: { en: "Error analysis finds the cohorts where the model makes the most errors; it doesn't describe how the data is distributed.", fr: "L'analyse des erreurs trouve les cohortes où le modèle commet le plus d'erreurs ; elle ne décrit pas la distribution des données." }
        b: { en: "Fairness assessment compares how the predictions and their metrics differ across groups, not how many rows each group has.", fr: "L'évaluation de l'équité compare la façon dont les prédictions et leurs métriques diffèrent entre groupes, pas le nombre de lignes de chaque groupe." }
        d: { en: "Counterfactual what-if shows the minimal change that flips one prediction; it says nothing about the composition of the dataset.", fr: "La simulation contrefactuelle montre le changement minimal qui inverse une prédiction ; elle ne dit rien de la composition du jeu de données." }
    references:
      - title: Assess AI systems by using the Responsible AI dashboard
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai-dashboard

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-22-02
    objective: "2.2.4"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        You have an Azure Machine Learning workspace that contains version 3 of a registered model named **demand-forecast**.

        Which two properties of version 3 can you change by running `az ml model update`?

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Azure Machine Learning qui contient la version 3 d'un modèle inscrit nommé **demand-forecast**.

        Quelles sont les deux propriétés de la version 3 que vous pouvez modifier en exécutant `az ml model update` ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The description", fr: "La description" } }
        - { id: b, text: { en: "The path of the model files", fr: "Le chemin des fichiers du modèle" } }
        - { id: c, text: { en: "The model type", fr: "Le type du modèle" } }
        - { id: d, text: { en: "The tags", fr: "Les étiquettes" } }
        - { id: e, text: { en: "The model name", fr: "Le nom du modèle" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Only the `description` and the `tags` of a registered model can be updated. Every other property is immutable: to change it, you register a new version (or, for the name, register the model again under a new name).
        fr: |
          Seules la `description` et les `tags` (étiquettes) d'un modèle inscrit peuvent être mis à jour. Toutes les autres propriétés sont immuables : pour en changer une, vous inscrivez une nouvelle version (ou, pour le nom, vous inscrivez de nouveau le modèle sous un autre nom).
      options:
        b: { en: "The path is immutable; files from another location require a new version.", fr: "Le chemin est immuable ; des fichiers venant d'un autre emplacement exigent une nouvelle version." }
        c: { en: "The type (`custom_model`, `mlflow_model`, `triton_model`) is set at registration and can't be updated.", fr: "Le type (`custom_model`, `mlflow_model`, `triton_model`) est fixé à l'inscription et ne peut pas être mis à jour." }
        e: { en: "Models can't be renamed: you register the model again under the new name.", fr: "Les modèles ne peuvent pas être renommés : vous inscrivez de nouveau le modèle sous le nouveau nom." }
    references:
      - title: Work with registered models in Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
      - title: az ml model
        url: https://learn.microsoft.com/en-us/cli/azure/ml/model

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-22-03
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        At Proseware, a data scientist trains an image classifier in an Azure Machine Learning job. The model receives batches of images as numpy arrays of type `uint8` and shape `(-1, 224, 224, 3)`.

        The data scientist will log the model in MLflow format. MLflow must enforce the type and shape of the inputs at deployment time, and Azure Machine Learning must generate a swagger file for the deployment.

        Which signature should the data scientist log with the model?
      fr: |
        Chez Proseware, une data scientist entraîne un classifieur d'images dans un travail Azure Machine Learning. Le modèle reçoit des lots d'images sous forme de tableaux numpy de type `uint8` et de forme `(-1, 224, 224, 3)`.

        La data scientist va enregistrer le modèle au format MLflow. MLflow doit imposer le type et la forme des entrées au moment du déploiement, et Azure Machine Learning doit générer un fichier swagger pour le déploiement.

        Quelle signature la data scientist doit-elle enregistrer avec le modèle ?
    body:
      options:
        - { id: a, text: { en: "A column-based signature with one `double` column for each pixel value", fr: "Une signature basée sur les colonnes avec une colonne `double` par valeur de pixel" } }
        - { id: b, text: { en: "A tensor-based signature inferred from a sample batch of input arrays", fr: "Une signature basée sur les tenseurs, déduite d'un lot exemple de tableaux d'entrée" } }
        - { id: c, text: { en: "A column-based signature with one `binary` column for each encoded image", fr: "Une signature basée sur les colonnes avec une colonne `binary` par image encodée" } }
        - { id: d, text: { en: "No signature, with the numpy version pinned in the model's `conda.yaml`", fr: "Aucune signature, avec la version de numpy épinglée dans le `conda.yaml` du modèle" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Tensor-based signatures describe models that operate on n-dimensional arrays: MLflow supplies `numpy.ndarray` inputs and checks their type and shape. When an MLflow model has a signature, Azure Machine Learning generates a swagger file for its deployment, which also enables the **Test** feature in the studio.
        fr: |
          Les signatures basées sur les tenseurs décrivent les modèles qui travaillent sur des tableaux à n dimensions : MLflow fournit des entrées `numpy.ndarray` et vérifie leur type et leur forme. Quand un modèle MLflow possède une signature, Azure Machine Learning génère un fichier swagger pour son déploiement, ce qui active aussi la fonctionnalité **Tester** du studio.
      options:
        a: { en: "Column-based signatures describe tabular data passed as a pandas DataFrame; flattening pixels into columns changes the input contract of the model.", fr: "Les signatures basées sur les colonnes décrivent des données tabulaires passées sous forme de DataFrame pandas ; aplatir les pixels en colonnes change le contrat d'entrée du modèle." }
        c: { en: "A binary column describes a DataFrame of encoded files, not the numpy arrays of the stated shape that the model receives.", fr: "Une colonne binaire décrit un DataFrame de fichiers encodés, pas les tableaux numpy de la forme indiquée que le modèle reçoit." }
        d: { en: "The conda file only rebuilds the runtime; without a signature, MLflow enforces no input types and no swagger file is generated.", fr: "Le fichier conda sert seulement à reconstruire le runtime ; sans signature, MLflow n'impose aucun type d'entrée et aucun fichier swagger n'est généré." }
    references:
      - title: Artifacts and models in MLflow
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-mlflow-models

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-22-04
    objective: "2.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has an Azure Machine Learning workspace that contains a registered model named **claims-score** with versions 1 to 6. Three weeks ago, an administrator ran `az ml model archive --name claims-score`.

        Today, a retraining pipeline registered version 7 of claims-score successfully. However, `az ml model list --name claims-score` returns no version at all.

        What explains this result?
      fr: |
        Adatum dispose d'un espace de travail Azure Machine Learning qui contient un modèle inscrit nommé **claims-score** avec les versions 1 à 6. Il y a trois semaines, un administrateur a exécuté `az ml model archive --name claims-score`.

        Aujourd'hui, un pipeline de réentraînement a inscrit avec succès la version 7 de claims-score. Pourtant, `az ml model list --name claims-score` ne renvoie aucune version.

        Qu'est-ce qui explique ce résultat ?
    body:
      options:
        - { id: a, text: { en: "Version 7 has no `stage` tag yet, and the list command hides the versions that have no stage.", fr: "La version 7 n'a pas encore d'étiquette `stage`, et la commande de liste masque les versions sans phase." } }
        - { id: b, text: { en: "Version 7 was created under an archived model container, so it was archived automatically.", fr: "La version 7 a été créée dans un conteneur de modèle archivé ; elle a donc été archivée automatiquement." } }
        - { id: c, text: { en: "Version 7 was registered with the MLflow SDK, and such versions are listed only in the studio.", fr: "La version 7 a été inscrite avec le SDK MLflow, et ces versions ne sont listées que dans le studio." } }
        - { id: d, text: { en: "The list command returns only versions that are referenced by a deployment or a pipeline.", fr: "La commande de liste ne renvoie que les versions référencées par un déploiement ou un pipeline." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Running `az ml model archive` without `--version` archives the whole model container, and a new version created under an archived container is automatically archived too. Archived versions are hidden from `az ml model list` by default; `--include-archived` would show versions 1 to 7.
        fr: |
          Exécuter `az ml model archive` sans `--version` archive tout le conteneur du modèle, et une nouvelle version créée dans un conteneur archivé est automatiquement archivée elle aussi. Les versions archivées sont masquées par défaut dans `az ml model list` ; `--include-archived` afficherait les versions 1 à 7.
      options:
        a: { en: "Tags are metadata: they don't change the archive state or what the list command returns by default.", fr: "Les étiquettes sont des métadonnées : elles ne changent ni l'état d'archivage ni ce que la commande de liste renvoie par défaut." }
        c: { en: "Versions registered with MLflow are regular registered models: the Azure Machine Learning CLI lists them like any other version.", fr: "Les versions inscrites avec MLflow sont des modèles inscrits ordinaires : la CLI Azure Machine Learning les liste comme toute autre version." }
        d: { en: "The list command returns every active version, whether or not something references it; only archiving hides a version.", fr: "La commande de liste renvoie toutes les versions actives, qu'elles soient référencées ou non ; seul l'archivage masque une version." }
    references:
      - title: Work with registered models in Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
      - title: az ml model
        url: https://learn.microsoft.com/en-us/cli/azure/ml/model

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-22-05
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank trains a fraud model in an Azure Machine Learning project workspace on features from a managed feature store. A data scientist generated a feature retrieval specification in a notebook, and a training pipeline will use the built-in feature retrieval component.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank entraîne un modèle de fraude dans un espace de travail de projet Azure Machine Learning à partir de caractéristiques d'un magasin de caractéristiques managé. Une data scientist a généré une spécification de récupération de caractéristiques dans un notebook, et un pipeline d'entraînement va utiliser le composant intégré de récupération de caractéristiques.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The specification identifies each feature by its feature set name and the version of that feature set.", fr: "La spécification identifie chaque caractéristique par le nom de son ensemble de caractéristiques et la version de cet ensemble." }
        - id: s2
          text: { en: "The built-in feature retrieval component joins the feature values to the observation data in a Spark job.", fr: "Le composant intégré de récupération de caractéristiques joint les valeurs des caractéristiques aux données d'observation dans un travail Spark." }
        - id: s3
          text: { en: "In the root folder of the model artifact, the specification file can be renamed `fraud_features.yaml` as long as it stays valid YAML.", fr: "Dans le dossier racine de l'artefact du modèle, le fichier de spécification peut être renommé `fraud_features.yaml` tant qu'il reste du YAML valide." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Each entry of the specification lists a feature with its feature set as `name:version` (for example `transactions:1`), under the URI of its feature store. The built-in component runs a Spark job that retrieves the feature values and joins them point in time to the observation data. When it's packaged with the model, the file must sit in the root folder of the model artifact and its name, `feature_retrieval_spec.yaml`, can't be changed.
        fr: |
          Chaque entrée de la spécification liste une caractéristique avec son ensemble de caractéristiques sous la forme `nom:version` (par exemple `transactions:1`), sous l'URI de son magasin de caractéristiques. Le composant intégré exécute un travail Spark qui récupère les valeurs des caractéristiques et les joint aux données d'observation à la date de chaque observation. Quand il est empaqueté avec le modèle, le fichier doit se trouver dans le dossier racine de l'artefact du modèle et son nom, `feature_retrieval_spec.yaml`, ne peut pas être modifié.
      options:
        s3: { en: "With another name, the system doesn't recognize the specification: no lineage to the feature sets, and inference can't load the feature list from the model.", fr: "Sous un autre nom, le système ne reconnaît pas la spécification : aucune traçabilité vers les ensembles de caractéristiques, et l'inférence ne peut pas charger la liste des caractéristiques depuis le modèle." }
    references:
      - title: Feature retrieval specification and usage in training and inference
        url: https://learn.microsoft.com/en-us/azure/machine-learning/feature-retrieval-concepts

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-22-06
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Tailspin Toys registered a churn model as an `mlflow_model` in an Azure Machine Learning workspace. The following table shows the content of the MLmodel file of the model, one line per row.

        You plan to deploy the model to an online endpoint without a scoring script or an environment.

        Answer each prompt by selecting the appropriate line in the table.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys a inscrit un modèle d'attrition comme `mlflow_model` dans un espace de travail Azure Machine Learning. Le tableau suivant présente le contenu du fichier MLmodel du modèle, une ligne par rangée.

        Vous prévoyez de déployer le modèle sur un point de terminaison en ligne sans script de scoring ni environnement.

        Répondez à chaque consigne en sélectionnant la ligne appropriée du tableau.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The flavor whose generic `predict` function the no-code deployment calls", fr: "La saveur (flavor) dont le déploiement sans code appelle la fonction `predict` générique" }
        - id: p2
          text: { en: "The line that shows that requests must carry tabular data, delivered to the model as a pandas DataFrame", fr: "La ligne qui montre que les requêtes doivent contenir des données tabulaires, remises au modèle sous forme de DataFrame pandas" }
      grid:
        header: [{ en: "MLmodel file", fr: "Fichier MLmodel" }]
        rows:
          - [{ text: "artifact_path: model", area: l01 }]
          - [{ text: "flavors:" }]
          - [{ text: "  python_function:", area: l03 }]
          - [{ text: "    env: conda.yaml", area: l04 }]
          - [{ text: "    loader_module: mlflow.sklearn" }]
          - [{ text: "    python_version: 3.10.14" }]
          - [{ text: "  sklearn:", area: l07 }]
          - [{ text: "    pickled_model: model.pkl" }]
          - [{ text: "    sklearn_version: 1.5.1" }]
          - [{ text: "model_uuid: 3f2b9c41d8e04a7c9b1f6e2d5a8c7b90", area: l10 }]
          - [{ text: "run_id: job-churn-118", area: l11 }]
          - [{ text: "signature:" }]
          - [{ text: "  inputs: '[{\"type\": \"long\", \"name\": \"tenure_months\"}, {\"type\": \"double\", \"name\": \"monthly_charges\"}]'", area: l13 }]
          - [{ text: "  outputs: '[{\"type\": \"tensor\", \"tensor-spec\": {\"dtype\": \"int64\", \"shape\": [-1]}}]'", area: l14 }]
    answer:
      values: { p1: l03, p2: l13 }
    explanation:
      correct:
        en: |
          Every MLflow model contains a `predict` function exposed by the `python_function` (pyfunc) flavor, whose `loader_module` points to the framework loader: no-code deployment calls this generic function, not the framework-specific `sklearn` flavor. The `inputs` entry of the signature lists named, typed columns, so it's a column-based signature: MLflow supplies a pandas DataFrame to the model and enforces these types. The `outputs` entry describes what the model returns, not what requests must contain.
        fr: |
          Tout modèle MLflow contient une fonction `predict` exposée par la saveur `python_function` (pyfunc), dont `loader_module` désigne le chargeur du framework : le déploiement sans code appelle cette fonction générique, pas la saveur `sklearn` propre au framework. L'entrée `inputs` de la signature liste des colonnes nommées et typées : c'est donc une signature basée sur les colonnes, et MLflow fournit un DataFrame pandas au modèle en imposant ces types. L'entrée `outputs` décrit ce que le modèle renvoie, pas ce que les requêtes doivent contenir.
      options:
        l07: { en: "The `sklearn` flavor loads the original scikit-learn object for Python code; the generic `predict` used by no-code deployment comes from `python_function`.", fr: "La saveur `sklearn` charge l'objet scikit-learn d'origine pour du code Python ; la fonction `predict` générique du déploiement sans code vient de `python_function`." }
        l04: { en: "`conda.yaml` describes the runtime to rebuild, not the shape of the requests.", fr: "`conda.yaml` décrit le runtime à reconstruire, pas la forme des requêtes." }
        l14: { en: "The outputs describe a tensor returned by the model; the request contract is defined by the inputs.", fr: "Les sorties décrivent un tenseur renvoyé par le modèle ; le contrat des requêtes est défini par les entrées." }
    references:
      - title: Artifacts and models in MLflow
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-mlflow-models

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-22-07
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware tracks training runs in an Azure Machine Learning workspace named **mlw-litware**; the MLflow tracking URI of the notebook points to mlw-litware. A data scientist runs the following code. The run completes, and its artifacts contain an MLflow model folder with an MLmodel file. The last line then raises an exception.

        ```python
        import mlflow
        from mlflow.models import infer_signature

        signature = infer_signature(X_test, model.predict(X_test))
        with mlflow.start_run() as run:
            mlflow.sklearn.log_model(model, "classifier", signature=signature)

        mlflow.register_model(f"runs:/{run.info.run_id}/model", "churn-classifier")
        ```

        You need to register the model as **churn-classifier** in mlw-litware. The registered version must keep its lineage to the run.

        What should you do?
      fr: |
        Litware suit ses exécutions d'entraînement dans un espace de travail Azure Machine Learning nommé **mlw-litware** ; l'URI de suivi MLflow du notebook pointe vers mlw-litware. Une data scientist exécute le code suivant. L'exécution se termine, et ses artefacts contiennent un dossier de modèle MLflow avec un fichier MLmodel. La dernière ligne lève ensuite une exception.

        ```python
        import mlflow
        from mlflow.models import infer_signature

        signature = infer_signature(X_test, model.predict(X_test))
        with mlflow.start_run() as run:
            mlflow.sklearn.log_model(model, "classifier", signature=signature)

        mlflow.register_model(f"runs:/{run.info.run_id}/model", "churn-classifier")
        ```

        Vous devez inscrire le modèle sous le nom **churn-classifier** dans mlw-litware. La version inscrite doit conserver sa traçabilité vers l'exécution.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Move the `mlflow.register_model()` call inside the `with` block, so that the run is still active.", fr: "Déplacer l'appel `mlflow.register_model()` dans le bloc `with`, pour que l'exécution soit encore active." } }
        - { id: b, text: { en: "Replace the URI with `models:/churn-classifier/1`, the URI of the first version of the model.", fr: "Remplacer l'URI par `models:/churn-classifier/1`, l'URI de la première version du modèle." } }
        - { id: c, text: { en: "Replace the path at the end of the URI with `classifier`, the artifact path used to log the model.", fr: "Remplacer le chemin à la fin de l'URI par `classifier`, le chemin d'artefact utilisé pour enregistrer le modèle." } }
        - { id: d, text: { en: "Download the run artifacts, then register the local folder with a `file://` URI and the same name.", fr: "Télécharger les artefacts de l'exécution, puis inscrire le dossier local avec un URI `file://` et le même nom." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A `runs:/` URI is made of the run ID and the path of the model relative to the root of the run's artifacts. The model was logged under the artifact path `classifier`, so `runs:/<run-id>/model` points to nothing. Registering from `runs:/<run-id>/classifier` registers the logged MLflow model and establishes the lineage between the version and the run.
        fr: |
          Un URI `runs:/` se compose de l'ID de l'exécution et du chemin du modèle relatif à la racine des artefacts de l'exécution. Le modèle a été enregistré sous le chemin d'artefact `classifier` : `runs:/<run-id>/model` ne désigne donc rien. Inscrire depuis `runs:/<run-id>/classifier` inscrit le modèle MLflow enregistré et établit la traçabilité entre la version et l'exécution.
      options:
        a: { en: "The run ID stays valid after the run ends: registering after the `with` block works when the path is right, and moving the call doesn't fix the path.", fr: "L'ID de l'exécution reste valide après la fin de l'exécution : inscrire après le bloc `with` fonctionne quand le chemin est correct, et déplacer l'appel ne corrige pas le chemin." }
        b: { en: "A `models:/` URI loads a version that is already registered; it can't be the source of the first registration.", fr: "Un URI `models:/` charge une version déjà inscrite ; il ne peut pas être la source de la première inscription." }
        d: { en: "Registering downloaded files from a local folder works, but it loses the link between the registered version and the run.", fr: "Inscrire des fichiers téléchargés depuis un dossier local fonctionne, mais perd le lien entre la version inscrite et l'exécution." }
    references:
      - title: Manage models registry in Azure Machine Learning with MLflow
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow
      - title: Work with registered models in Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-22-08
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has an Azure Machine Learning workspace that contains two registered models:

        - **churn-legacy** has versions 1 to 3. The model is no longer used, and the team wants it removed from the workspace.
        - **churn** has versions 1 to 9. Yesterday you ran `az ml model archive --name churn --version 2`. No other archive command was run on churn.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un espace de travail Azure Machine Learning qui contient deux modèles inscrits :

        - **churn-legacy** possède les versions 1 à 3. Le modèle n'est plus utilisé, et l'équipe veut qu'il soit supprimé de l'espace de travail.
        - **churn** possède les versions 1 à 9. Hier, vous avez exécuté `az ml model archive --name churn --version 2`. Aucune autre commande d'archivage n'a été exécutée sur churn.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A new deployment whose YAML file references `azureml:churn:2` can use version 2 of churn.", fr: "Un nouveau déploiement dont le fichier YAML référence `azureml:churn:2` peut utiliser la version 2 de churn." }
        - id: s2
          text: { en: "Running `az ml model restore --name churn --version 2` makes version 2 appear again in the default results of `az ml model list`.", fr: "Exécuter `az ml model restore --name churn --version 2` fait de nouveau apparaître la version 2 dans les résultats par défaut de `az ml model list`." }
        - id: s3
          text: { en: "You can remove churn-legacy and its three versions in a single call to `MlflowClient().delete_registered_model(\"churn-legacy\")`.", fr: "Vous pouvez supprimer churn-legacy et ses trois versions en un seul appel à `MlflowClient().delete_registered_model(\"churn-legacy\")`." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Archiving only hides a version from list queries: archived versions can still be referenced and used in workflows such as deployments. Because only version 2 was archived, and not the whole container, that version can be restored on its own. Azure Machine Learning doesn't support deleting a whole model container: to remove churn-legacy, you delete each of its versions, for example with `delete_model_version()`.
        fr: |
          L'archivage masque seulement une version dans les requêtes de liste : les versions archivées peuvent toujours être référencées et utilisées dans des flux de travail comme les déploiements. Comme seule la version 2 a été archivée, et non le conteneur entier, cette version peut être restaurée seule. Azure Machine Learning ne prend pas en charge la suppression d'un conteneur de modèle entier : pour supprimer churn-legacy, vous supprimez chacune de ses versions, par exemple avec `delete_model_version()`.
      options:
        s3: { en: "Deleting the model container isn't supported in Azure Machine Learning; delete versions 1, 2 and 3 one by one.", fr: "La suppression du conteneur de modèle n'est pas prise en charge dans Azure Machine Learning ; supprimez les versions 1, 2 et 3 une par une." }
    references:
      - title: Work with registered models in Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
      - title: Manage models registry in Azure Machine Learning with MLflow
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-22-09
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso Insurance has an Azure Machine Learning workspace. A claims triage classifier is a scikit-learn `RandomForestClassifier`. The data scientist wrapped it in a custom `PythonModel` class, logged it with `mlflow.pyfunc.log_model()`, and registered it as an `mlflow_model`. Its MLmodel file lists only the `python_function` flavor.

        The training and test data are CSV files registered as `uri_file` data assets; the test file has 4,000 rows. You submit a pipeline job to a compute cluster with the RAI Insights dashboard constructor, Add Error Analysis to RAI Insights dashboard and Gather RAI Insights dashboard components. The job fails in the constructor step.

        You need the dashboard to be generated. Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso Insurance dispose d'un espace de travail Azure Machine Learning. Un classifieur de tri des sinistres est un `RandomForestClassifier` scikit-learn. Le data scientist l'a encapsulé dans une classe `PythonModel` personnalisée, l'a enregistré avec `mlflow.pyfunc.log_model()` et l'a inscrit comme `mlflow_model`. Son fichier MLmodel ne liste que la saveur `python_function`.

        Les données d'entraînement et de test sont des fichiers CSV inscrits comme ressources de données `uri_file` ; le fichier de test compte 4 000 lignes. Vous soumettez à un cluster de calcul un travail de pipeline avec les composants RAI Insights dashboard constructor, Add Error Analysis to RAI Insights dashboard et Gather RAI Insights dashboard. Le travail échoue à l'étape du constructeur.

        Le tableau de bord doit être généré. Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Register the training and test data as `mltable` data assets.", fr: "Inscrire les données d'entraînement et de test comme ressources de données `mltable`." } }
        - { id: b, text: { en: "Connect a running compute instance to the dashboard before you resubmit the job.", fr: "Connecter une instance de calcul en cours d'exécution au tableau de bord avant de soumettre de nouveau le travail." } }
        - { id: c, text: { en: "Log and register the model with `mlflow.sklearn.log_model()` so that it has the `sklearn` flavor.", fr: "Enregistrer et inscrire le modèle avec `mlflow.sklearn.log_model()` pour qu'il ait la saveur `sklearn`." } }
        - { id: d, text: { en: "Register the model again as a `custom_model` that points to the same model folder.", fr: "Inscrire de nouveau le modèle comme `custom_model` pointant vers le même dossier de modèle." } }
        - { id: e, text: { en: "Add the Add Explanation to RAI Insights dashboard component, which the constructor requires.", fr: "Ajouter le composant Add Explanation to RAI Insights dashboard, que le constructeur exige." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The Responsible AI components accept only models registered in MLflow format with the `sklearn` flavor (loadable and pickleable), and a pyfunc-only wrapper doesn't meet that requirement. The training and test datasets must be supplied as `mltable` inputs. The 4,000-row test set is below the default limit of 5,000 rows, and the pipeline already has the constructor, the gather component and one tool component.
        fr: |
          Les composants IA responsable n'acceptent que des modèles inscrits au format MLflow avec la saveur `sklearn` (chargeables et sérialisables avec pickle), et une encapsulation qui n'a que la saveur pyfunc ne remplit pas cette exigence. Les jeux de données d'entraînement et de test doivent être fournis comme entrées `mltable`. Le jeu de test de 4 000 lignes est sous la limite par défaut de 5 000 lignes, et le pipeline contient déjà le constructeur, le composant de regroupement (gather) et un composant d'outil.
      options:
        b: { en: "A connected compute instance is needed only for the interactive features of a dashboard that already exists, not to generate it.", fr: "Une instance de calcul connectée n'est nécessaire que pour les fonctionnalités interactives d'un tableau de bord qui existe déjà, pas pour le générer." }
        d: { en: "A `custom_model` isn't in MLflow format at all, so the components still can't load it.", fr: "Un `custom_model` n'est pas du tout au format MLflow : les composants ne peuvent toujours pas le charger." }
        e: { en: "Only the constructor and the gather components are always required, plus at least one tool component; Add Error Analysis already fills that role.", fr: "Seuls le constructeur et le composant gather sont toujours obligatoires, plus au moins un composant d'outil ; Add Error Analysis joue déjà ce rôle." }
    references:
      - title: Generate Responsible AI insights with YAML and Python
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-responsible-ai-insights-sdk-cli
      - title: Use the Responsible AI dashboard in Azure Machine Learning studio
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-responsible-ai-dashboard

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-22-10
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys has an Azure Machine Learning project workspace connected to a managed feature store. A data scientist saved a feature retrieval specification in a folder named `./spec`. The training pipeline has two steps:

        1. A Spark job loads the specification with `resolve_feature_retrieval_spec()`, calls `get_offline_features()`, and writes only Parquet training data to its output.
        2. A command job trains the model from that output and writes an MLflow model folder to an output named `model_output`, which a pipeline step registers as **demand-model**.

        The model details page shows no dependency on any feature set. The batch inference pipeline must pass the registered model to the `input_model` input of the built-in feature retrieval component. The next registered version must show its lineage to the feature sets, and the feature list must not be maintained anywhere other than the specification.

        What should you do?
      fr: |
        Wingtip Toys dispose d'un espace de travail de projet Azure Machine Learning connecté à un magasin de caractéristiques managé. Un data scientist a enregistré une spécification de récupération de caractéristiques dans un dossier nommé `./spec`. Le pipeline d'entraînement comporte deux étapes :

        1. Un travail Spark charge la spécification avec `resolve_feature_retrieval_spec()`, appelle `get_offline_features()` et n'écrit que des données d'entraînement Parquet dans sa sortie.
        2. Un travail de commande entraîne le modèle à partir de cette sortie et écrit un dossier de modèle MLflow dans une sortie nommée `model_output`, qu'une étape du pipeline inscrit sous le nom **demand-model**.

        La page de détails du modèle ne montre aucune dépendance envers un ensemble de caractéristiques. Le pipeline d'inférence par lots doit passer le modèle inscrit à l'entrée `input_model` du composant intégré de récupération de caractéristiques. La prochaine version inscrite doit montrer sa traçabilité vers les ensembles de caractéristiques, et la liste des caractéristiques ne doit être tenue à jour nulle part ailleurs que dans la spécification.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the training script, copy `feature_retrieval_spec.yaml` from the training data input folder to the root of `model_output`.", fr: "Dans le script d'entraînement, copier `feature_retrieval_spec.yaml` du dossier d'entrée des données d'entraînement vers la racine de `model_output`." } }
        - { id: b, text: { en: "Pass `./spec` as an extra input of the training job, and copy `feature_retrieval_spec.yaml` to the root of `model_output`.", fr: "Passer `./spec` comme entrée supplémentaire du travail d'entraînement, et copier `feature_retrieval_spec.yaml` à la racine de `model_output`." } }
        - { id: c, text: { en: "Keep the model unchanged, and set the `feature_retrieval_spec` input of the batch component to the `./spec` folder.", fr: "Garder le modèle inchangé, et définir l'entrée `feature_retrieval_spec` du composant de lot sur le dossier `./spec`." } }
        - { id: d, text: { en: "Register `./spec` as a `uri_folder` data asset, and store its name and version in a tag of each model version.", fr: "Inscrire `./spec` comme ressource de données `uri_folder`, et stocker son nom et sa version dans une étiquette de chaque version du modèle." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The lineage between a model and its feature sets is tracked only if `feature_retrieval_spec.yaml` is in the root folder of the model artifact, and the batch component finds the feature list there when it receives the model. When training data isn't produced by the built-in component, the specification isn't in the data folder: pass it to the training job as an input and let the training script copy it into the model output.
        fr: |
          La traçabilité entre un modèle et ses ensembles de caractéristiques n'est suivie que si `feature_retrieval_spec.yaml` se trouve dans le dossier racine de l'artefact du modèle, et le composant de lot y trouve la liste des caractéristiques quand il reçoit le modèle. Quand les données d'entraînement ne sont pas produites par le composant intégré, la spécification n'est pas dans le dossier des données : passez-la en entrée du travail d'entraînement et laissez le script d'entraînement la copier dans la sortie du modèle.
      options:
        a: { en: "Only the built-in component writes the specification next to the training data; this Spark job writes only Parquet files, so there is nothing to copy.", fr: "Seul le composant intégré écrit la spécification à côté des données d'entraînement ; ce travail Spark n'écrit que des fichiers Parquet : il n'y a donc rien à copier." }
        c: { en: "The component would retrieve the features, but the model still wouldn't contain the specification: no lineage, and the pipeline must pass the model.", fr: "Le composant récupérerait les caractéristiques, mais le modèle ne contiendrait toujours pas la spécification : aucune traçabilité, et le pipeline doit passer le modèle." }
        d: { en: "A data asset and a tag don't package the specification inside the model artifact, so neither the lineage nor the `input_model` lookup works.", fr: "Une ressource de données et une étiquette n'empaquettent pas la spécification dans l'artefact du modèle : ni la traçabilité ni la recherche via `input_model` ne fonctionnent." }
    references:
      - title: Feature retrieval specification and usage in training and inference
        url: https://learn.microsoft.com/en-us/azure/machine-learning/feature-retrieval-concepts
