chapter: 42-observability
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-42-01
    objective: "4.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The security team at Fabrikam must keep a record of the administrative operations performed on a Foundry resource named **fdy-fab**, such as model deployments, configuration changes and access control events, in a Log Analytics workspace. You create a diagnostic setting on fdy-fab.

        Which log category should you select?
      fr: |
        L'équipe de sécurité de Fabrikam doit conserver dans un espace de travail Log Analytics un enregistrement des opérations d'administration effectuées sur une ressource Foundry nommée **fdy-fab**, comme les déploiements de modèles, les modifications de configuration et les événements de contrôle d'accès. Vous créez un paramètre de diagnostic sur fdy-fab.

        Quelle catégorie de journal devez-vous sélectionner ?
    body:
      options:
        - { id: a, text: RequestResponse }
        - { id: b, text: Trace }
        - { id: c, text: Audit }
        - { id: d, text: AzureOpenAIRequestUsage }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Audit category of the Foundry resource logs records administrative operations: deployments, configuration changes and access control events. The diagnostic setting sends it to the Log Analytics workspace, where the security team can query it.
        fr: |
          La catégorie Audit des journaux de ressources Foundry enregistre les opérations d'administration : déploiements, modifications de configuration et événements de contrôle d'accès. Le paramètre de diagnostic l'envoie vers l'espace de travail Log Analytics, où l'équipe de sécurité peut l'interroger.
      options:
        a: { en: "RequestResponse records every inference request and response, with its status code and latency, not administrative operations.", fr: "RequestResponse enregistre chaque requête et réponse d'inférence, avec son code d'état et sa latence, pas les opérations d'administration." }
        b: { en: "Trace contains detailed logs for debugging inference calls.", fr: "Trace contient des journaux détaillés pour déboguer les appels d'inférence." }
        d: { en: "AzureOpenAIRequestUsage contains usage and token logs, and its export is billed.", fr: "AzureOpenAIRequestUsage contient des journaux de consommation et de jetons, et son exportation est facturée." }
    references:
      - title: Monitor model deployments in Microsoft Foundry Models
        url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-42-02
    objective: "4.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware's chat application calls a provisioned deployment named **chat-ptu** in a Foundry resource. During the daily peak, many calls return HTTP 429. For the same period, the Model Availability Rate metric of chat-ptu stays at 100 percent.

        Why does the metric stay at 100 percent?
      fr: |
        L'application de conversation de Litware appelle un déploiement approvisionné nommé **chat-ptu** dans une ressource Foundry. Pendant le pic quotidien, de nombreux appels renvoient HTTP 429. Sur la même période, la métrique Model Availability Rate de chat-ptu reste à 100 %.

        Pourquoi la métrique reste-t-elle à 100 % ?
    body:
      options:
        - { id: a, text: { en: "The metric is calculated for streaming requests only, and the throttled calls don't stream.", fr: "La métrique n'est calculée que pour les requêtes en streaming, et les appels limités n'utilisent pas le streaming." } }
        - { id: b, text: { en: "The metric counts only the responses with an HTTP status code of 500 or higher as errors.", fr: "La métrique ne compte comme erreurs que les réponses dont le code d'état HTTP est 500 ou plus." } }
        - { id: c, text: { en: "The metric excludes provisioned deployments and reports the availability of the region.", fr: "La métrique exclut les déploiements approvisionnés et indique la disponibilité de la région." } }
        - { id: d, text: { en: "The metric is aggregated once a day, so the errors of the peak appear the next day.", fr: "La métrique est agrégée une fois par jour : les erreurs du pic apparaissent le lendemain." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Model Availability Rate is (total calls minus server errors) divided by total calls, and server errors are the responses with an HTTP status of 500 or higher. A 429 is a throttling response, so it doesn't lower the metric; count the throttled calls with Azure OpenAI Requests split by StatusCode instead.
        fr: |
          Model Availability Rate vaut (appels totaux moins erreurs serveur) divisé par les appels totaux, et les erreurs serveur sont les réponses dont le code HTTP est 500 ou plus. Un code 429 est une réponse de limitation : il ne fait pas baisser la métrique ; comptez plutôt les appels limités avec Azure OpenAI Requests ventilé par StatusCode.
      options:
        a: { en: "Model Availability Rate covers all calls of the deployment; StreamType isn't even one of its dimensions.", fr: "Model Availability Rate couvre tous les appels du déploiement ; StreamType ne fait même pas partie de ses dimensions." }
        c: { en: "The metric is reported per deployment, with dimensions such as ModelDeploymentName, for provisioned and standard deployments.", fr: "La métrique est fournie par déploiement, avec des dimensions comme ModelDeploymentName, pour les déploiements approvisionnés comme standard." }
        d: { en: "Deployment metrics are collected in Azure Monitor with a time grain of one minute, not once a day.", fr: "Les métriques des déploiements sont collectées dans Azure Monitor avec une granularité d'une minute, pas une fois par jour." }
    references:
      - title: Azure OpenAI monitoring data reference
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/monitor-openai-reference

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-42-03
    objective: "4.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a Foundry project that contains an agent named **sales-agent**. A continuous evaluation rule, created with the Python SDK and its default settings, scores the responses of sales-agent with Coherence and Violence. The rule is enabled, and the project's managed identity has the Foundry User role.

        Outside business hours, sales-agent completes about 60 responses per hour and almost all of them are evaluated. During business hours, it completes about 900 responses per hour and most of them aren't evaluated.

        You need more responses to be evaluated during business hours. What should you do?
      fr: |
        Adatum dispose d'un projet Foundry qui contient un agent nommé **sales-agent**. Une règle d'évaluation continue, créée avec le SDK Python et ses paramètres par défaut, note les réponses de sales-agent avec Coherence et Violence. La règle est activée, et l'identité managée du projet a le rôle Foundry User.

        En dehors des heures ouvrées, sales-agent termine environ 60 réponses par heure et presque toutes sont évaluées. Pendant les heures ouvrées, il en termine environ 900 par heure et la plupart ne sont pas évaluées.

        Vous devez faire évaluer davantage de réponses pendant les heures ouvrées. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign the Log Analytics Reader role to the managed identity of the project.", fr: "Attribuer le rôle Log Analytics Reader à l'identité managée du projet." } }
        - { id: b, text: { en: "Create a scheduled evaluation that scores the test dataset every hour.", fr: "Créer une évaluation planifiée qui note le jeu de données de test toutes les heures." } }
        - { id: c, text: { en: "Connect a second Application Insights resource to the Foundry project.", fr: "Connecter une deuxième ressource Application Insights au projet Foundry." } }
        - { id: d, text: { en: "Increase the `max_hourly_runs` value of the continuous evaluation rule.", fr: "Augmenter la valeur `max_hourly_runs` de la règle d'évaluation continue." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A continuous evaluation rule runs for each completed response up to an hourly cap, 100 runs per hour by default. Beyond the cap, the runs are skipped until the next hour, which matches 60 responses evaluated off-peak and most of 900 skipped at peak. Raising `max_hourly_runs` increases the coverage, at the price of more evaluation runs.
        fr: |
          Une règle d'évaluation continue s'exécute à chaque réponse terminée dans la limite d'un plafond horaire, 100 exécutions par heure par défaut. Au-delà, les exécutions sont ignorées jusqu'à l'heure suivante, ce qui correspond aux 60 réponses évaluées hors pic et à la plupart des 900 ignorées au pic. Augmenter `max_hourly_runs` accroît la couverture, au prix de davantage d'exécutions d'évaluation.
      options:
        a: { en: "A missing role would stop every evaluation or cause authorization errors, not only the evaluations of the busiest hours.", fr: "Un rôle manquant bloquerait toutes les évaluations ou provoquerait des erreurs d'autorisation, pas seulement les évaluations des heures les plus chargées." }
        b: { en: "A scheduled evaluation scores a fixed test dataset to detect drift; it doesn't evaluate more of the live responses.", fr: "Une évaluation planifiée note un jeu de données de test fixe pour détecter la dérive ; elle n'évalue pas davantage de réponses réelles." }
        c: { en: "Application Insights stores the telemetry; it doesn't limit how many responses the rule evaluates.", fr: "Application Insights stocke la télémétrie ; il ne limite pas le nombre de réponses évaluées par la règle." }
    references:
      - title: Monitor agents with the Agent Monitoring Dashboard
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-42-04
    objective: "4.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has a resource group named **rg-ai** that contains a Foundry resource with Azure OpenAI deployments. A financial analyst must view the costs and cost forecasts of rg-ai in Cost analysis.

        The analyst must not be able to create budgets or change any resource. The solution must follow the principle of least privilege.

        Which role should you assign to the analyst, and at which scope?
      fr: |
        Contoso dispose d'un groupe de ressources nommé **rg-ai** qui contient une ressource Foundry avec des déploiements Azure OpenAI. Un analyste financier doit consulter les coûts et les prévisions de coûts de rg-ai dans l'analyse des coûts.

        L'analyste ne doit pas pouvoir créer de budgets ni modifier une ressource. La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer à l'analyste, et à quelle étendue ?
    body:
      options:
        - { id: a, text: { en: "Foundry User on the Foundry project", fr: "Foundry User sur le projet Foundry" } }
        - { id: b, text: { en: "Cost Management Reader on rg-ai", fr: "Cost Management Reader sur rg-ai" } }
        - { id: c, text: { en: "Cost Management Contributor on rg-ai", fr: "Cost Management Contributor sur rg-ai" } }
        - { id: d, text: { en: "Monitoring Reader on the Foundry resource", fr: "Monitoring Reader sur la ressource Foundry" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Costs come from Microsoft Cost Management, which checks access on the resource group or the subscription, not on the Foundry resource or project. Cost Management Reader on rg-ai shows the costs and forecasts of the resource group without allowing budgets, exports or resource changes.
        fr: |
          Les coûts proviennent de Microsoft Cost Management, qui vérifie l'accès sur le groupe de ressources ou l'abonnement, pas sur la ressource ou le projet Foundry. Cost Management Reader sur rg-ai affiche les coûts et les prévisions du groupe de ressources sans permettre de créer des budgets ou des exportations, ni de modifier des ressources.
      options:
        a: { en: "No Foundry role shows costs, because Cost Management doesn't check access on the Foundry project.", fr: "Aucun rôle Foundry n'affiche les coûts, car Cost Management ne vérifie pas l'accès sur le projet Foundry." }
        c: { en: "Cost Management Contributor can also create budgets and exports, which the analyst must not do.", fr: "Cost Management Contributor peut aussi créer des budgets et des exportations, ce que l'analyste ne doit pas faire." }
        d: { en: "Monitoring Reader shows the Azure Monitor metrics of the resource, such as token counts, not the costs in Cost analysis.", fr: "Monitoring Reader affiche les métriques Azure Monitor de la ressource, comme les nombres de jetons, pas les coûts de l'analyse des coûts." }
    references:
      - title: Analyze Microsoft Foundry costs in Azure Cost Management
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/analyze-costs-cost-management

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-42-05
    objective: "4.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a Foundry project that contains a prompt agent named **orders-agent**. When developers open the **Traces** tab of orders-agent, it shows no data.

        Developers must be able to open each run of orders-agent in the **Traces** tab and review its run steps, tool calls, inputs and outputs. The solution must not require any code change.

        What should you do?
      fr: |
        Tailspin Toys dispose d'un projet Foundry qui contient un agent d'invite nommé **orders-agent**. Quand les développeurs ouvrent l'onglet **Traces** de orders-agent, il n'affiche aucune donnée.

        Les développeurs doivent pouvoir ouvrir chaque exécution de orders-agent dans l'onglet **Traces** et examiner ses étapes d'exécution, ses appels d'outils, ses entrées et ses sorties. La solution ne doit exiger aucune modification du code.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Instrument the applications that call orders-agent with `AIProjectInstrumentor`.", fr: "Instrumenter les applications qui appellent orders-agent avec `AIProjectInstrumentor`." } }
        - { id: b, text: { en: "Send the Trace log category of the Foundry resource to a Log Analytics workspace.", fr: "Envoyer la catégorie de journal Trace de la ressource Foundry vers un espace de travail Log Analytics." } }
        - { id: c, text: { en: "Connect an Application Insights resource to the project from the Traces tab.", fr: "Connecter une ressource Application Insights au projet depuis l'onglet Traces." } }
        - { id: d, text: { en: "Set `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT` in the calling applications.", fr: "Définir `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT` dans les applications appelantes." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Foundry logs server-side traces automatically for prompt agents, hosted agents and workflows once an Application Insights resource is connected to the project (Build, Agents, Traces, Connect). No code is needed, and the conversation view shows the run steps, tool calls, inputs and outputs.
        fr: |
          Foundry journalise automatiquement les traces côté serveur des agents d'invite, des agents hébergés et des workflows dès qu'une ressource Application Insights est connectée au projet (Build, Agents, Traces, Connect). Aucun code n'est nécessaire, et la vue de la conversation affiche les étapes d'exécution, les appels d'outils, les entrées et les sorties.
      options:
        a: { en: "Client-side instrumentation is a code change, and it is still in preview; server-side tracing already covers prompt agents.", fr: "L'instrumentation côté client est une modification du code, encore en préversion ; le traçage côté serveur couvre déjà les agents d'invite." }
        b: { en: "The Trace resource log category contains debugging logs of inference calls in AzureDiagnostics; it doesn't feed the Traces tab of the agent.", fr: "La catégorie de journal de ressources Trace contient des journaux de débogage des appels d'inférence dans AzureDiagnostics ; elle n'alimente pas l'onglet Traces de l'agent." }
        d: { en: "This variable only adds message content to client-side spans; without a connected Application Insights resource, no trace is stored.", fr: "Cette variable ajoute seulement le contenu des messages aux étendues côté client ; sans ressource Application Insights connectée, aucune trace n'est stockée." }
    references:
      - title: Set up tracing in Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-42-06
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank's support chat streams its responses from a Global Provisioned Throughput deployment named **chat-ptu**. Three weeks ago, a new feature started to append the full conversation history to every request. Since then, Azure Monitor shows the following for chat-ptu:

        - The average Time to Response rose from 0.9 to 2.4 seconds.
        - Processed Prompt Tokens per request tripled.
        - Time Between Tokens is unchanged.
        - Provisioned-managed Utilization V2 peaks at 55 percent, and no call returns HTTP 429.

        You need to reduce the Time to Response. The solution must minimize cost. What should you do?
      fr: |
        Le chat de support de Woodgrove Bank diffuse ses réponses en streaming depuis un déploiement Global Provisioned Throughput nommé **chat-ptu**. Il y a trois semaines, une nouvelle fonctionnalité a commencé à ajouter tout l'historique de la conversation à chaque requête. Depuis, Azure Monitor indique pour chat-ptu :

        - Le Time to Response moyen est passé de 0,9 à 2,4 secondes.
        - Processed Prompt Tokens par requête a triplé.
        - Time Between Tokens est inchangé.
        - Provisioned-managed Utilization V2 culmine à 55 %, et aucun appel ne renvoie HTTP 429.

        Vous devez réduire le Time to Response. La solution doit réduire les coûts au minimum. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add PTUs to chat-ptu so that the deployment processes the prompts faster.", fr: "Ajouter des PTU à chat-ptu pour que le déploiement traite les invites plus vite." } }
        - { id: b, text: { en: "Configure spillover from chat-ptu to a standard deployment of the model.", fr: "Configurer le débordement (spillover) de chat-ptu vers un déploiement standard du modèle." } }
        - { id: c, text: { en: "Send a summary of the earlier turns and only the latest turns in each request.", fr: "Envoyer un résumé des tours précédents et seulement les derniers tours dans chaque requête." } }
        - { id: d, text: { en: "Disable streaming so that each response is returned in a single message.", fr: "Désactiver le streaming pour que chaque réponse soit renvoyée en un seul message." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          For streaming calls, Time to Response is the time to the first token, and a larger prompt raises it. Time Between Tokens is stable and utilization stays far from 100 percent without 429s, so the deployment isn't under load: the tripled prompt size explains the slowdown. Sending a shorter history reduces the prompt tokens and the Time to Response at no extra cost.
        fr: |
          Pour les appels en streaming, Time to Response est le temps jusqu'au premier jeton, et une invite plus longue l'augmente. Time Between Tokens est stable et l'utilisation reste loin de 100 % sans erreurs 429 : le déploiement n'est pas sous charge, et c'est la taille triplée des invites qui explique le ralentissement. Envoyer un historique plus court réduit les jetons d'invite et le Time to Response sans coût supplémentaire.
      options:
        a: { en: "At 55 percent utilization with a stable Time Between Tokens, capacity isn't the bottleneck; more PTUs would raise the hourly cost without addressing the prompt size.", fr: "À 55 % d'utilisation avec un Time Between Tokens stable, la capacité n'est pas le goulot d'étranglement ; davantage de PTU augmenteraient le coût horaire sans traiter la taille des invites." }
        b: { en: "Spillover only redirects requests that the provisioned deployment can't serve, which doesn't happen here since no call returns 429.", fr: "Le débordement ne redirige que les requêtes que le déploiement approvisionné ne peut pas servir, ce qui n'arrive pas ici puisqu'aucun appel ne renvoie 429." }
        d: { en: "Without streaming, users would see nothing until the last token, which makes the wait before the first words longer, not shorter.", fr: "Sans streaming, les utilisateurs ne verraient rien avant le dernier jeton, ce qui allonge l'attente avant les premiers mots au lieu de la réduire." }
    references:
      - title: Azure OpenAI in Microsoft Foundry Models performance & latency
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/latency
      - title: Azure OpenAI monitoring data reference
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/monitor-openai-reference

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-42-07
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has three internal applications, hr-bot, it-bot and sales-bot, that call the same Global Standard deployment named **gpt-shared** in one Foundry project. Each application signs in its users with Microsoft Entra ID and can be reconfigured to call a different endpoint.

        For internal chargeback, the finance team needs the monthly token consumption of each application and of each user.

        What should you do?
      fr: |
        Contoso dispose de trois applications internes, hr-bot, it-bot et sales-bot, qui appellent le même déploiement Global Standard nommé **gpt-shared** dans un seul projet Foundry. Chaque application connecte ses utilisateurs avec Microsoft Entra ID et peut être reconfigurée pour appeler un autre point de terminaison.

        Pour la refacturation interne, l'équipe financière a besoin de la consommation mensuelle de jetons de chaque application et de chaque utilisateur.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Chart Processed Inference Tokens in Metrics Explorer, split by ModelDeploymentName.", fr: "Afficher Processed Inference Tokens dans Metrics Explorer, ventilé par ModelDeploymentName." } }
        - { id: b, text: { en: "Filter the cost analysis of the Foundry resource by its automatic project tag.", fr: "Filtrer l'analyse des coûts de la ressource Foundry par son étiquette project automatique." } }
        - { id: c, text: { en: "Group the cost analysis of the resource group by Meter, and then by Resource.", fr: "Regrouper l'analyse des coûts du groupe de ressources par Meter, puis par Resource." } }
        - { id: d, text: { en: "Route the calls through Azure API Management and emit token metrics per app and user.", fr: "Faire passer les appels par Azure API Management et émettre des métriques de jetons par application et par utilisateur." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          When several consumers share one deployment, Azure Monitor metrics and Cost Management can't tell them apart. Azure API Management in front of the deployment can apply the `llm-emit-token-metric` policy, which sends token metrics to Application Insights with dimensions such as the subscription ID (one per application) and a custom dimension that holds the user ID.
        fr: |
          Quand plusieurs consommateurs partagent un déploiement, les métriques Azure Monitor et Cost Management ne peuvent pas les distinguer. Azure API Management placé devant le déploiement peut appliquer la stratégie `llm-emit-token-metric`, qui envoie des métriques de jetons vers Application Insights avec des dimensions comme l'ID d'abonnement (un par application) et une dimension personnalisée contenant l'ID de l'utilisateur.
      options:
        a: { en: "The three applications use the same deployment, so a split by ModelDeploymentName shows a single series, with no application or user.", fr: "Les trois applications utilisent le même déploiement : une ventilation par ModelDeploymentName n'affiche qu'une série, sans application ni utilisateur." }
        b: { en: "The project tag allocates costs per project, and the three applications share one project; it is also still in preview.", fr: "L'étiquette project impute les coûts par projet, et les trois applications partagent un projet ; elle est en outre encore en préversion." }
        c: { en: "Meters show which model series generate costs, and resources show which Foundry resource; neither identifies an application or a user.", fr: "Les compteurs montrent quelles séries de modèles génèrent des coûts, et les ressources quelle ressource Foundry ; aucun n'identifie une application ou un utilisateur." }
    references:
      - title: Emit metrics for consumption of large language model tokens
        url: https://learn.microsoft.com/en-us/azure/api-management/llm-emit-token-metric-policy

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-42-08
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam has a Foundry project that contains two agents named **billing-agent** and **refund-agent**. An Application Insights resource is connected to the project, and the project's managed identity has the Foundry User role. Yesterday at 10:00, you ran the code shown in the exhibit. Both agents have received traffic since then.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un projet Foundry qui contient deux agents nommés **billing-agent** et **refund-agent**. Une ressource Application Insights est connectée au projet, et l'identité managée du projet a le rôle Foundry User. Hier à 10 h, vous avez exécuté le code présenté dans la pièce. Les deux agents ont reçu du trafic depuis.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    exhibits:
      - id: code
        title: { en: "Continuous evaluation code", fr: "Code de l'évaluation continue" }
        body: |
          ```python
          eval_object = openai_client.evals.create(
              name="billing-continuous",
              data_source_config={"type": "azure_ai_source", "scenario": "responses"},
              testing_criteria=[
                  {"type": "azure_ai_evaluator", "name": "violence_detection",
                   "evaluator_name": "builtin.violence"},
              ],
          )

          project_client.evaluation_rules.create_or_update(
              id="billing-rule",
              evaluation_rule=EvaluationRule(
                  display_name="Billing agent continuous evaluation",
                  action=ContinuousEvaluationRuleAction(eval_id=eval_object.id, max_hourly_runs=20),
                  event_type=EvaluationRuleEventType.RESPONSE_COMPLETED,
                  filter=EvaluationRuleFilter(agent_name="billing-agent"),
                  enabled=True,
              ),
          )
          ```
    body:
      statements:
        - id: s1
          text:
            en: The rule evaluates the responses that refund-agent completes.
            fr: La règle évalue les réponses que refund-agent termine.
        - id: s2
          text:
            en: If billing-agent completes 200 responses between 14:00 and 15:00, the rule evaluates at most 20 of them during that hour.
            fr: Si billing-agent termine 200 réponses entre 14 h et 15 h, la règle en évalue au plus 20 pendant cette heure.
        - id: s3
          text:
            en: The rule also evaluates the responses that billing-agent completed yesterday before 10:00.
            fr: La règle évalue aussi les réponses que billing-agent a terminées hier avant 10 h.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The rule fires on the `RESPONSE_COMPLETED` event, and its filter restricts it to billing-agent, so refund-agent isn't evaluated. `max_hourly_runs=20` caps the runs per hour: once 20 runs have occurred, the next responses are skipped until the following hour. Because the rule reacts to responses as they complete, it doesn't go back to responses completed before it existed; scoring past traffic or a fixed dataset is the job of another evaluation run.
        fr: |
          La règle se déclenche sur l'événement `RESPONSE_COMPLETED`, et son filtre la limite à billing-agent : refund-agent n'est pas évalué. `max_hourly_runs=20` plafonne les exécutions par heure : une fois 20 exécutions atteintes, les réponses suivantes sont ignorées jusqu'à l'heure suivante. Comme la règle réagit aux réponses au fur et à mesure qu'elles se terminent, elle ne revient pas sur les réponses terminées avant sa création ; noter du trafic passé ou un jeu de données fixe relève d'une autre exécution d'évaluation.
      options:
        s1: { en: "`EvaluationRuleFilter(agent_name=\"billing-agent\")` scopes the rule to one agent.", fr: "`EvaluationRuleFilter(agent_name=\"billing-agent\")` limite la règle à un seul agent." }
    references:
      - title: Monitor agents with the Agent Monitoring Dashboard
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-42-09
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders has a Foundry resource named **fdy-nw** and a Log Analytics workspace named **law-nw** whose retention is set to two years. No diagnostic setting exists on fdy-nw.

        Starting this month, the finance team must be able to query, with KQL, the daily totals of the Processed Inference Tokens metric of fdy-nw over a rolling 12-month period.

        How should you complete the solution? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'une ressource Foundry nommée **fdy-nw** et d'un espace de travail Log Analytics nommé **law-nw** dont la rétention est de deux ans. Aucun paramètre de diagnostic n'existe sur fdy-nw.

        À partir de ce mois-ci, l'équipe financière doit pouvoir interroger en KQL les totaux quotidiens de la métrique Processed Inference Tokens de fdy-nw sur une période glissante de 12 mois.

        Comment devez-vous compléter la solution ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          1. Create a diagnostic setting on fdy-nw that sends [[sel]] to law-nw.
          2. In law-nw, query the [[tbl]] table.
          3. For each day, sum the [[col]] column of the metric.
        fr: |
          1. Créer sur fdy-nw un paramètre de diagnostic qui envoie [[sel]] vers law-nw.
          2. Dans law-nw, interroger la table [[tbl]].
          3. Pour chaque jour, additionner la colonne [[col]] de la métrique.
      slots:
        - id: sel
          options:
            - { id: allm, text: AllMetrics }
            - { id: rr, text: { en: "the RequestResponse category", fr: "la catégorie RequestResponse" } }
            - { id: aud, text: { en: "the Audit category", fr: "la catégorie Audit" } }
            - { id: trc, text: { en: "the Trace category", fr: "la catégorie Trace" } }
        - id: tbl
          options:
            - { id: diag, text: AzureDiagnostics }
            - { id: met, text: AzureMetrics }
            - { id: act, text: AzureActivity }
        - id: col
          options:
            - { id: cnt, text: Count }
            - { id: avg, text: Average }
            - { id: tot, text: Total }
            - { id: max, text: Maximum }
    answer:
      values: { sel: allm, tbl: met, col: tot }
    explanation:
      correct:
        en: |
          Azure Monitor keeps platform metrics for 93 days, so 12 months of history require sending them to a Log Analytics workspace through a diagnostic setting with AllMetrics. Exported metrics land in the AzureMetrics table, one row per metric and time grain. Processed Inference Tokens is a count aggregated as Total, so summing the Total column per day gives the daily token totals.
        fr: |
          Azure Monitor conserve les métriques de plateforme 93 jours : 12 mois d'historique exigent de les envoyer vers un espace de travail Log Analytics par un paramètre de diagnostic avec AllMetrics. Les métriques exportées arrivent dans la table AzureMetrics, une ligne par métrique et par intervalle de temps. Processed Inference Tokens est un nombre agrégé en Total : additionner la colonne Total par jour donne les totaux quotidiens de jetons.
      options:
        rr: { en: "RequestResponse is a log category of inference calls; it doesn't export the platform metrics.", fr: "RequestResponse est une catégorie de journaux des appels d'inférence ; elle n'exporte pas les métriques de plateforme." }
        diag: { en: "AzureDiagnostics receives the resource logs (RequestResponse, Trace, Audit), not the exported metrics.", fr: "AzureDiagnostics reçoit les journaux de ressources (RequestResponse, Trace, Audit), pas les métriques exportées." }
        cnt: { en: "Count is the number of samples in each time grain, not the number of tokens.", fr: "Count est le nombre d'échantillons de chaque intervalle de temps, pas le nombre de jetons." }
    references:
      - title: Azure Monitor Metrics overview
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/data-platform-metrics
      - title: Monitor model deployments in Microsoft Foundry Models
        url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-42-10
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware reviews last month's costs of a resource group named **rg-legal-ai**, which contains a Foundry resource named **fdy-legal** and a Log Analytics workspace named **law-legal**. The review shows the following:

        - A fine-tuned model deployment named **ft-contracts** accounts for 45 percent of the cost. It is used only during the last three days of each quarter, for a batch of contract reviews.
        - Data ingestion into law-legal accounts for 30 percent of the cost. A diagnostic setting on fdy-legal sends every log category and AllMetrics to law-legal. Only the Audit logs are ever queried, and the compliance team requires them.

        You need to reduce the monthly cost. The quarterly contract reviews must still run, and the Audit logs must still be collected.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware examine les coûts du mois dernier d'un groupe de ressources nommé **rg-legal-ai**, qui contient une ressource Foundry nommée **fdy-legal** et un espace de travail Log Analytics nommé **law-legal**. L'examen montre ce qui suit :

        - Un déploiement de modèle ajusté nommé **ft-contracts** représente 45 % du coût. Il n'est utilisé que pendant les trois derniers jours de chaque trimestre, pour un lot de revues de contrats.
        - L'ingestion de données dans law-legal représente 30 % du coût. Un paramètre de diagnostic sur fdy-legal envoie toutes les catégories de journaux et AllMetrics vers law-legal. Seuls les journaux Audit sont interrogés, et l'équipe de conformité les exige.

        Vous devez réduire le coût mensuel. Les revues de contrats trimestrielles doivent toujours avoir lieu, et les journaux Audit doivent toujours être collectés.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a monthly budget on rg-legal-ai with an alert at 80 percent of the current spend.", fr: "Créer un budget mensuel sur rg-legal-ai avec une alerte à 80 % de la dépense actuelle." } }
        - { id: b, text: { en: "Delete ft-contracts after each quarterly review, and deploy the model again before the next one.", fr: "Supprimer ft-contracts après chaque revue trimestrielle, puis redéployer le modèle avant la suivante." } }
        - { id: c, text: { en: "Move law-legal to another resource group so that its cost no longer appears in rg-legal-ai.", fr: "Déplacer law-legal vers un autre groupe de ressources pour que son coût n'apparaisse plus dans rg-legal-ai." } }
        - { id: d, text: { en: "Change the diagnostic setting of fdy-legal so that it sends only the Audit category to law-legal.", fr: "Modifier le paramètre de diagnostic de fdy-legal pour qu'il n'envoie que la catégorie Audit vers law-legal." } }
        - { id: e, text: { en: "Set a lower max_tokens value on the requests that the contract reviews send to ft-contracts.", fr: "Définir une valeur max_tokens plus basse sur les requêtes que les revues de contrats envoient à ft-contracts." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A fine-tuned deployment bills hosting for every hour it is deployed, even when it receives no call, so deleting it between quarterly reviews removes most of that cost while the fine-tuned model stays available for a new deployment. Log Analytics ingestion is billed per volume collected, and Learn advises collecting only the categories you need: sending only Audit keeps the compliance data and stops the unused log volume.
        fr: |
          Un déploiement ajusté facture l'hébergement pour chaque heure où il est déployé, même sans appel : le supprimer entre les revues trimestrielles élimine l'essentiel de ce coût, tandis que le modèle ajusté reste disponible pour un nouveau déploiement. L'ingestion Log Analytics est facturée au volume collecté, et Learn recommande de ne collecter que les catégories nécessaires : n'envoyer qu'Audit conserve les données de conformité et supprime le volume de journaux inutilisé.
      options:
        a: { en: "A budget sends alerts when the cost reaches a threshold; it doesn't reduce or block any spending.", fr: "Un budget envoie des alertes quand le coût atteint un seuil ; il ne réduit ni ne bloque aucune dépense." }
        c: { en: "Moving the workspace changes where its cost is reported, not how much the ingestion costs.", fr: "Déplacer l'espace de travail change l'endroit où son coût est présenté, pas le montant de l'ingestion." }
        e: { en: "The main charge of ft-contracts is hourly hosting while deployed, which doesn't depend on the tokens of its requests.", fr: "La charge principale de ft-contracts est l'hébergement horaire pendant le déploiement, qui ne dépend pas des jetons de ses requêtes." }
    references:
      - title: Cost optimization overview for Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/optimize-costs
      - title: Monitor model deployments in Microsoft Foundry Models
        url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models
