chapter: 11-workspace-resources
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-11-01
    objective: "1.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware's platform team is choosing compute targets for the Azure Machine Learning workspace **mlw-litware**. One of the targets must be created outside Azure Machine Learning and then attached to the workspace, and the team stays responsible for maintaining it.

        Which compute target matches this description?
      fr: |
        L'équipe plateforme de Litware choisit les cibles de calcul de l'espace de travail Azure Machine Learning **mlw-litware**. L'une des cibles doit être créée hors d'Azure Machine Learning puis attachée à l'espace de travail, et l'équipe reste responsable de sa maintenance.

        Quelle cible de calcul correspond à cette description ?
    body:
      options:
        - { id: a, text: { en: "Compute instance", fr: "Instance de calcul" } }
        - { id: b, text: { en: "Compute cluster", fr: "Cluster de calcul" } }
        - { id: c, text: { en: "Kubernetes compute", fr: "Calcul Kubernetes" } }
        - { id: d, text: { en: "Serverless compute", fr: "Calcul serverless" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Kubernetes compute is an unmanaged target: you create the AKS or Azure Arc-enabled cluster outside Azure Machine Learning, attach it to the workspace and keep maintaining it yourself. Compute clusters, serverless compute and compute instances are the only managed computes, created and managed by Azure Machine Learning.
        fr: |
          Le calcul Kubernetes est une cible non managée : vous créez le cluster AKS ou Azure Arc hors d'Azure Machine Learning, vous l'attachez à l'espace de travail et vous continuez à le maintenir vous-même. Les clusters de calcul, le calcul serverless et les instances de calcul sont les seuls calculs managés, créés et gérés par Azure Machine Learning.
      options:
        a: { en: "A compute instance is a managed compute that Azure Machine Learning creates and manages for one user.", fr: "Une instance de calcul est un calcul managé qu'Azure Machine Learning crée et gère pour un utilisateur." }
        b: { en: "A compute cluster is a managed compute: Azure Machine Learning creates it and scales its nodes.", fr: "Un cluster de calcul est un calcul managé : Azure Machine Learning le crée et met ses nœuds à l'échelle." }
        d: { en: "Serverless compute is managed by the service and isn't created or attached at all.", fr: "Le calcul serverless est géré par le service et n'est ni créé ni attaché." }
    references:
      - title: Understand compute targets - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-compute-target

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-11-02
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You manage the Azure Machine Learning workspace **mlw-adatum** in the resource group **rg-adatum-ml** with the `ml` extension of the Azure CLI. You run dozens of `az ml` commands every day and want to stop adding `--workspace` and `--resource-group` to each of them.

        Which command should you run once?
      fr: |
        Vous gérez l'espace de travail Azure Machine Learning **mlw-adatum** du groupe de ressources **rg-adatum-ml** avec l'extension `ml` d'Azure CLI. Vous exécutez chaque jour des dizaines de commandes `az ml` et vous voulez ne plus ajouter `--workspace` et `--resource-group` à chacune d'elles.

        Quelle commande devez-vous exécuter une seule fois ?
    body:
      options:
        - { id: a, text: "`az account set --subscription <subscription-id>`" }
        - { id: b, text: "`az ml workspace show -n mlw-adatum -g rg-adatum-ml`" }
        - { id: c, text: "`az extension update -n ml`" }
        - { id: d, text: "`az configure --defaults group=rg-adatum-ml workspace=mlw-adatum`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `az configure --defaults` stores default values for the CLI parameters. With `group` and `workspace` set, the `az ml` commands no longer need `--resource-group` and `--workspace`; you can display the defaults with `az configure -l`.
        fr: |
          `az configure --defaults` enregistre des valeurs par défaut pour les paramètres de la CLI. Une fois `group` et `workspace` définis, les commandes `az ml` n'ont plus besoin de `--resource-group` ni de `--workspace` ; vous pouvez afficher ces valeurs par défaut avec `az configure -l`.
      options:
        a: { en: "`az account set` selects the active subscription; the workspace and resource group still have to be passed.", fr: "`az account set` sélectionne l'abonnement actif ; l'espace de travail et le groupe de ressources doivent toujours être passés." }
        b: { en: "`az ml workspace show` only displays the workspace properties; it stores no default.", fr: "`az ml workspace show` affiche seulement les propriétés de l'espace de travail ; il n'enregistre aucune valeur par défaut." }
        c: { en: "`az extension update` upgrades the `ml` extension; it doesn't change which parameters the commands require.", fr: "`az extension update` met à niveau l'extension `ml` ; il ne change pas les paramètres que les commandes exigent." }
    references:
      - title: Install and set up the CLI (v2) - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-cli

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-11-03
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The Azure Machine Learning workspace **mlw-proseware** has a datastore named **claims_raw** that points to a blob container without stored credentials. The compute cluster **cpu-train** has a system-assigned managed identity with Storage Blob Data Reader on the storage account, and training jobs that don't set `identity` read claims_raw without errors.

        Mia, a data scientist, reads claims_raw with the Python SDK from a notebook on her compute instance, which has no managed identity. She gets an authorization error. You need Mia to read the data from her notebook. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        L'espace de travail Azure Machine Learning **mlw-proseware** possède un magasin de données nommé **claims_raw** qui pointe vers un conteneur blob sans informations d'identification stockées. Le cluster de calcul **cpu-train** a une identité managée affectée par le système qui dispose de Storage Blob Data Reader sur le compte de stockage, et les travaux d'entraînement qui ne définissent pas `identity` lisent claims_raw sans erreur.

        Mia, une data scientist, lit claims_raw avec le SDK Python depuis un notebook de son instance de calcul, qui n'a pas d'identité managée. Elle obtient une erreur d'autorisation. Vous devez permettre à Mia de lire les données depuis son notebook. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign Storage Blob Data Reader on the storage account to the managed identity of the workspace.", fr: "Attribuer Storage Blob Data Reader sur le compte de stockage à l'identité managée de l'espace de travail." } }
        - { id: b, text: { en: "Assign Storage Blob Data Reader on the storage account to Mia's Microsoft Entra user account.", fr: "Attribuer Storage Blob Data Reader sur le compte de stockage au compte d'utilisateur Microsoft Entra de Mia." } }
        - { id: c, text: { en: "Assign Storage Blob Data Contributor on the storage account to Mia's Microsoft Entra user account.", fr: "Attribuer Storage Blob Data Contributor sur le compte de stockage au compte d'utilisateur Microsoft Entra de Mia." } }
        - { id: d, text: { en: "Assign the Reader role on the storage account to Mia's Microsoft Entra user account.", fr: "Attribuer le rôle Reader sur le compte de stockage au compte d'utilisateur Microsoft Entra de Mia." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When you work with an identity-based datastore interactively, for example in a notebook on a compute instance, Azure Machine Learning uses your own Microsoft Entra token, not the identity of a compute cluster. Mia therefore needs a storage data role herself, and Storage Blob Data Reader is the least-privileged role that reads and lists blobs.
        fr: |
          Quand vous travaillez de façon interactive avec un magasin de données basé sur l'identité, par exemple dans un notebook sur une instance de calcul, Azure Machine Learning utilise votre propre jeton Microsoft Entra, pas l'identité d'un cluster de calcul. Mia a donc besoin elle-même d'un rôle de données sur le stockage, et Storage Blob Data Reader est le rôle le moins privilégié qui lit et liste les objets blob.
      options:
        a: { en: "The workspace managed identity is used for studio data preview behind a storage firewall, not for SDK calls made from a notebook.", fr: "L'identité managée de l'espace de travail sert à l'aperçu des données dans le studio derrière un pare-feu de stockage, pas aux appels du SDK depuis un notebook." }
        c: { en: "Storage Blob Data Contributor would also let Mia write and delete blobs, which she doesn't need.", fr: "Storage Blob Data Contributor permettrait aussi à Mia d'écrire et de supprimer des objets blob, ce dont elle n'a pas besoin." }
        d: { en: "Reader on the storage account only reads its management metadata; it grants no access to the blob data.", fr: "Reader sur le compte de stockage ne lit que ses métadonnées de gestion ; il ne donne aucun accès aux données blob." }
    references:
      - title: Set up service authentication - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication
      - title: Administer data authentication - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-administrate-data-authentication

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-11-04
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Leo is a data scientist at Fabrikam. His compute instance **ci-leo** in the Azure Machine Learning workspace **mlw-fabrikam** has idle shutdown set to 60 minutes. Fabrikam wants to lower the cost of ci-leo.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Leo est data scientist chez Fabrikam. Son instance de calcul **ci-leo** de l'espace de travail Azure Machine Learning **mlw-fabrikam** a un arrêt en cas d'inactivité réglé sur 60 minutes. Fabrikam veut réduire le coût de ci-leo.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              You can set the idle shutdown of ci-leo to 10 minutes.
            fr: |
              Vous pouvez régler l'arrêt en cas d'inactivité de ci-leo sur 10 minutes.
        - id: s2
          text:
            en: |
              While a Jupyter terminal session stays open on ci-leo, idle shutdown doesn't stop the instance.
            fr: |
              Tant qu'une session de terminal Jupyter reste ouverte sur ci-leo, l'arrêt en cas d'inactivité n'arrête pas l'instance.
        - id: s3
          text:
            en: |
              While ci-leo is stopped, Fabrikam no longer pays for its disk.
            fr: |
              Pendant que ci-leo est arrêtée, Fabrikam ne paie plus son disque.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Idle shutdown accepts an inactivity period between 15 minutes and three days, so 10 minutes isn't possible. An instance counts as inactive only when no Jupyter kernel or terminal session, job, VS Code connection or custom application is active, so an open terminal keeps it running. Stopping the instance stops the billing of compute hours, but you still pay for its disk, public IP and standard load balancer.
        fr: |
          L'arrêt en cas d'inactivité accepte une période d'inactivité comprise entre 15 minutes et trois jours : 10 minutes n'est donc pas possible. Une instance n'est inactive que si aucune session de noyau ou de terminal Jupyter, aucun travail, aucune connexion VS Code ni aucune application personnalisée n'est active : un terminal ouvert la maintient en marche. Arrêter l'instance stoppe la facturation des heures de calcul, mais vous payez toujours son disque, son IP publique et son équilibreur de charge standard.
    references:
      - title: Create a compute instance - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-compute-instance
      - title: Manage a compute instance - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-compute-instance

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-11-05
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Kai has the Contributor role on the resource group **rg-ml-dev** and no other role assignment. He creates an Azure Machine Learning workspace named **mlw-dev** in rg-ml-dev.

        Kai then tries to assign the AzureML Data Scientist role on mlw-dev to the Microsoft Entra group **G-DataSci**, and the operation fails.

        What explains this result?
      fr: |
        Kai a le rôle Contributor sur le groupe de ressources **rg-ml-dev** et aucune autre attribution de rôle. Il crée un espace de travail Azure Machine Learning nommé **mlw-dev** dans rg-ml-dev.

        Kai essaie ensuite d'attribuer le rôle AzureML Data Scientist sur mlw-dev au groupe Microsoft Entra **G-DataSci**, et l'opération échoue.

        Qu'est-ce qui explique ce résultat ?
    body:
      options:
        - { id: a, text: { en: "Kai became Owner of mlw-dev, but AzureML roles can be assigned only at the subscription scope.", fr: "Kai est devenu Owner de mlw-dev, mais les rôles AzureML ne peuvent être attribués qu'à l'étendue de l'abonnement." } }
        - { id: b, text: { en: "Kai became Owner of mlw-dev, but AzureML roles can be assigned only to users, not to groups.", fr: "Kai est devenu Owner de mlw-dev, mais les rôles AzureML ne peuvent être attribués qu'à des utilisateurs, pas à des groupes." } }
        - { id: c, text: { en: "Kai inherits Contributor on mlw-dev from rg-ml-dev, and Contributor can't create role assignments.", fr: "Kai hérite de Contributor sur mlw-dev depuis rg-ml-dev, et Contributor ne peut pas créer d'attributions de rôles." } }
        - { id: d, text: { en: "Kai received AzureML Compute Operator on mlw-dev, the role given to the creator of a workspace.", fr: "Kai a reçu AzureML Compute Operator sur mlw-dev, le rôle donné au créateur d'un espace de travail." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Creating a resource doesn't make you its Owner: you keep the role inherited from the highest scope you're authorized on. Kai therefore has Contributor on mlw-dev, which lets him create and manage assets and compute but not assign roles; an Owner (or a role with role assignment permissions) must grant AzureML Data Scientist to G-DataSci.
        fr: |
          Créer une ressource ne vous en rend pas Owner : vous gardez le rôle hérité de l'étendue la plus haute sur laquelle vous êtes autorisé. Kai a donc Contributor sur mlw-dev, qui lui permet de créer et de gérer des actifs et du calcul, mais pas d'attribuer des rôles ; un Owner (ou un rôle autorisé à attribuer des rôles) doit accorder AzureML Data Scientist à G-DataSci.
      options:
        a: { en: "The creator doesn't become Owner, and AzureML roles can be assigned at the workspace scope, as Microsoft recommends.", fr: "Le créateur ne devient pas Owner, et les rôles AzureML peuvent être attribués à l'étendue de l'espace de travail, comme Microsoft le recommande." }
        b: { en: "The creator doesn't become Owner, and Microsoft recommends assigning workspace roles to Microsoft Entra groups.", fr: "Le créateur ne devient pas Owner, et Microsoft recommande d'attribuer les rôles de l'espace de travail à des groupes Microsoft Entra." }
        d: { en: "No role is granted automatically to the creator; Kai keeps the Contributor role inherited from the resource group.", fr: "Aucun rôle n'est accordé automatiquement au créateur ; Kai garde le rôle Contributor hérité du groupe de ressources." }
    references:
      - title: Manage roles in your workspace - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-assign-roles

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-11-06
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin's Azure Machine Learning workspace **mlw-tailspin** uses only its system-assigned managed identity. A release pipeline submits nightly command jobs that read an identity-based datastore pointing to the storage account **sttailspinfeat**.

        The jobs must meet the following requirements:

        - run on serverless compute, so that no compute target is created or maintained;
        - access the data with permissions that don't depend on the identity that submits the job;
        - follow the principle of least privilege.

        What should you do?
      fr: |
        L'espace de travail Azure Machine Learning **mlw-tailspin** de Tailspin utilise uniquement son identité managée affectée par le système. Un pipeline de mise en production soumet chaque nuit des travaux de commande qui lisent un magasin de données basé sur l'identité pointant vers le compte de stockage **sttailspinfeat**.

        Les travaux doivent répondre aux exigences suivantes :

        - s'exécuter sur du calcul serverless, afin qu'aucune cible de calcul ne soit créée ni maintenue ;
        - accéder aux données avec des autorisations qui ne dépendent pas de l'identité qui soumet le travail ;
        - respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign Storage Blob Data Reader on sttailspinfeat to the system-assigned identity of mlw-tailspin, and use that identity as the job identity.", fr: "Attribuer Storage Blob Data Reader sur sttailspinfeat à l'identité affectée par le système de mlw-tailspin, et utiliser cette identité comme identité du travail." } }
        - { id: b, text: { en: "Add a user-assigned managed identity to mlw-tailspin, assign it Storage Blob Data Reader on sttailspinfeat, and use it as the job identity.", fr: "Ajouter une identité managée affectée par l'utilisateur à mlw-tailspin, lui attribuer Storage Blob Data Reader sur sttailspinfeat, et l'utiliser comme identité du travail." } }
        - { id: c, text: { en: "Set `identity: type: user_identity` in the jobs, and assign Storage Blob Data Reader on sttailspinfeat to the pipeline's service principal.", fr: "Définir `identity: type: user_identity` dans les travaux, et attribuer Storage Blob Data Reader sur sttailspinfeat au principal de service du pipeline." } }
        - { id: d, text: { en: "Create a compute cluster with a system-assigned identity, assign it Storage Blob Data Reader on sttailspinfeat, and set it as the job compute.", fr: "Créer un cluster de calcul avec une identité affectée par le système, lui attribuer Storage Blob Data Reader sur sttailspinfeat, et le définir comme calcul du travail." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Serverless jobs can access data with the submitter's Microsoft Entra token or with a user-assigned managed identity of the workspace; the system-assigned identity isn't supported. A workspace that uses a system-assigned identity can be updated to also use a user-assigned identity. Granting that identity Storage Blob Data Reader and using it as the job identity gives access that doesn't depend on who submits the job, with read-only permissions.
        fr: |
          Les travaux serverless peuvent accéder aux données avec le jeton Microsoft Entra de l'émetteur ou avec une identité managée affectée par l'utilisateur de l'espace de travail ; l'identité affectée par le système n'est pas prise en charge. Un espace de travail qui utilise une identité affectée par le système peut être mis à jour pour utiliser aussi une identité affectée par l'utilisateur. Attribuer Storage Blob Data Reader à cette identité et l'utiliser comme identité du travail donne un accès indépendant de celui qui soumet le travail, en lecture seule.
      options:
        a: { en: "Serverless compute doesn't support the system-assigned identity of the workspace as the job identity.", fr: "Le calcul serverless ne prend pas en charge l'identité affectée par le système de l'espace de travail comme identité du travail." }
        c: { en: "With `user_identity`, the data is read with the permissions of the identity that submits the job, which the requirements exclude.", fr: "Avec `user_identity`, les données sont lues avec les autorisations de l'identité qui soumet le travail, ce que les exigences excluent." }
        d: { en: "A compute cluster is a compute target to create and maintain, and the jobs must run on serverless compute.", fr: "Un cluster de calcul est une cible de calcul à créer et à maintenir, alors que les travaux doivent s'exécuter sur du calcul serverless." }
    references:
      - title: Model Training on Serverless Compute - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-serverless-compute
      - title: Set up service authentication - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-11-07
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        The compute cluster **gpu-train** of the Azure Machine Learning workspace **mlw-fabrikam** has two user-assigned managed identities: **id-train-data**, listed first, and **id-train-logs**. It has no system-assigned identity. id-train-data has Storage Blob Data Reader on the storage account **stfabfeatures**.

        A training script that runs on gpu-train must get a Microsoft Entra token to read blobs from stfabfeatures by using id-train-data. The client ID of the identity must not be hard-coded in the script.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le cluster de calcul **gpu-train** de l'espace de travail Azure Machine Learning **mlw-fabrikam** a deux identités managées affectées par l'utilisateur : **id-train-data**, listée en premier, et **id-train-logs**. Il n'a pas d'identité affectée par le système. id-train-data dispose de Storage Blob Data Reader sur le compte de stockage **stfabfeatures**.

        Un script d'entraînement qui s'exécute sur gpu-train doit obtenir un jeton Microsoft Entra pour lire des objets blob de stfabfeatures avec id-train-data. L'ID client de l'identité ne doit pas être codé en dur dans le script.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        import os
        import azure.identity as identity

        client_id = os.environ.get([[env]])
        credential = identity.[[cls]](client_id=client_id)
        token = credential.get_token([[scope]])
      slots:
        - id: env
          options:
            - { id: tenant, text: '"AZURE_TENANT_ID"' }
            - { id: default, text: '"DEFAULT_IDENTITY_CLIENT_ID"' }
            - { id: secret, text: '"AZURE_CLIENT_SECRET"' }
        - id: cls
          options:
            - { id: cli, text: AzureCliCredential }
            - { id: secret, text: ClientSecretCredential }
            - { id: managed, text: ManagedIdentityCredential }
            - { id: browser, text: InteractiveBrowserCredential }
        - id: scope
          options:
            - { id: mgmt, text: '"https://management.azure.com/"' }
            - { id: ml, text: '"https://ml.azure.com/"' }
            - { id: vault, text: '"https://vault.azure.net/"' }
            - { id: storage, text: '"https://storage.azure.com/"' }
    answer:
      values: { env: default, cls: managed, scope: storage }
    explanation:
      correct:
        en: |
          The default managed identity of a cluster is its system-assigned identity or, without one, its first user-assigned identity, here id-train-data. Inside a job, the client ID of this default identity is in the `DEFAULT_IDENTITY_CLIENT_ID` environment variable, and `ManagedIdentityCredential` uses it to request a token. The token must target the Azure Storage resource, `https://storage.azure.com/`, to read blobs.
        fr: |
          L'identité managée par défaut d'un cluster est son identité affectée par le système ou, à défaut, sa première identité affectée par l'utilisateur, ici id-train-data. Dans un travail, l'ID client de cette identité par défaut se trouve dans la variable d'environnement `DEFAULT_IDENTITY_CLIENT_ID`, et `ManagedIdentityCredential` l'utilise pour demander un jeton. Le jeton doit viser la ressource Stockage Azure, `https://storage.azure.com/`, pour lire des objets blob.
      options:
        tenant: { en: "`AZURE_TENANT_ID` would hold a tenant ID, not the client ID of the identity.", fr: "`AZURE_TENANT_ID` contiendrait un ID de locataire, pas l'ID client de l'identité." }
        secret: { en: "A managed identity has no client secret; `ClientSecretCredential` and `AZURE_CLIENT_SECRET` are for an app registration with a secret.", fr: "Une identité managée n'a pas de secret client ; `ClientSecretCredential` et `AZURE_CLIENT_SECRET` servent à une inscription d'application avec secret." }
        cli: { en: "`AzureCliCredential` and `InteractiveBrowserCredential` rely on a signed-in user, which a job on a cluster doesn't have.", fr: "`AzureCliCredential` et `InteractiveBrowserCredential` reposent sur un utilisateur connecté, ce qu'un travail sur un cluster n'a pas." }
        mgmt: { en: "Tokens for `management.azure.com`, `ml.azure.com` or `vault.azure.net` target other services and aren't accepted by Azure Storage.", fr: "Les jetons pour `management.azure.com`, `ml.azure.com` ou `vault.azure.net` visent d'autres services et ne sont pas acceptés par Stockage Azure." }
    references:
      - title: Set up service authentication - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-11-08
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso's security policy requires rotating the access keys of **stcontosoml**, the default storage account of the Azure Machine Learning workspace **mlw-contoso** in the resource group **rg-contoso-ml**. The workspace also has a datastore named **ref_data** of type `azure_blob` that connects to another container of stcontosoml by using the account key.

        You regenerate the key that the workspace uses. The workspace and the jobs that read ref_data must use the new key immediately.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        La stratégie de sécurité de Contoso impose la rotation des clés d'accès de **stcontosoml**, le compte de stockage par défaut de l'espace de travail Azure Machine Learning **mlw-contoso** du groupe de ressources **rg-contoso-ml**. L'espace de travail possède aussi un magasin de données nommé **ref_data**, de type `azure_blob`, qui se connecte à un autre conteneur de stcontosoml avec la clé du compte.

        Vous régénérez la clé qu'utilise l'espace de travail. L'espace de travail et les travaux qui lisent ref_data doivent utiliser la nouvelle clé immédiatement.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Restart the compute instances and compute clusters of mlw-contoso.", fr: "Redémarrer les instances et les clusters de calcul de mlw-contoso." } }
        - { id: b, text: { en: "Run `az ml workspace sync-keys -n mlw-contoso -g rg-contoso-ml`.", fr: "Exécuter `az ml workspace sync-keys -n mlw-contoso -g rg-contoso-ml`." } }
        - { id: c, text: { en: "Create a new version of each data asset that references ref_data.", fr: "Créer une nouvelle version de chaque ressource de données qui référence ref_data." } }
        - { id: d, text: { en: "Update the credentials of ref_data with the new account key.", fr: "Mettre à jour les informations d'identification de ref_data avec la nouvelle clé du compte." } }
        - { id: e, text: { en: "Assign the Storage Account Contributor role on stcontosoml to the workspace managed identity.", fr: "Attribuer le rôle Storage Account Contributor sur stcontosoml à l'identité managée de l'espace de travail." } }
    answer: { optionIds: [ b, d ] }
    explanation:
      correct:
        en: |
          The workspace picks up a regenerated key of its storage account on its own only after about an hour; `az ml workspace sync-keys` forces it to sync the new key immediately. A credential-based datastore keeps its own copy of the key in the workspace key vault, so ref_data must also be updated with the new key, otherwise the jobs that read it fail.
        fr: |
          L'espace de travail ne prend en compte de lui-même une clé régénérée de son compte de stockage qu'au bout d'environ une heure ; `az ml workspace sync-keys` le force à synchroniser la nouvelle clé immédiatement. Un magasin de données basé sur des informations d'identification garde sa propre copie de la clé dans le coffre de clés de l'espace de travail : ref_data doit donc aussi être mis à jour avec la nouvelle clé, sinon les travaux qui le lisent échouent.
      options:
        a: { en: "Restarting compute doesn't change the key stored by the workspace or by the datastore.", fr: "Redémarrer le calcul ne change pas la clé stockée par l'espace de travail ni par le magasin de données." }
        c: { en: "Data assets reference a datastore path; they don't hold the key, so a new version changes nothing about authentication.", fr: "Les ressources de données référencent un chemin du magasin de données ; elles ne contiennent pas la clé, donc une nouvelle version ne change rien à l'authentification." }
        e: { en: "A role assignment lets an identity list keys, but it doesn't make the workspace or the datastore use the new key now.", fr: "Une attribution de rôle permet à une identité de lister les clés, mais ne fait pas utiliser la nouvelle clé maintenant par l'espace de travail ni par le magasin de données." }
    references:
      - title: Change storage account access keys - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-change-storage-access-key

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-11-09
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders hardened **stnwml**, the default storage account of the Azure Machine Learning workspace **mlw-northwind**: Shared Key authorization is now disallowed (`allowSharedKeyAccess: false`), and every datastore that the data scientists use was re-created without stored credentials.

        Today, you try to create a compute instance on behalf of a new data scientist by using an account that has the Contributor role on the workspace, and the creation fails. The data scientist must receive a personal compute instance for notebook development.

        What should you do?
      fr: |
        Northwind Traders a durci **stnwml**, le compte de stockage par défaut de l'espace de travail Azure Machine Learning **mlw-northwind** : l'autorisation par clé partagée est maintenant interdite (`allowSharedKeyAccess: false`), et chaque magasin de données qu'utilisent les data scientists a été recréé sans informations d'identification stockées.

        Aujourd'hui, vous essayez de créer une instance de calcul pour le compte d'une nouvelle data scientist avec un compte qui a le rôle Contributor sur l'espace de travail, et la création échoue. La data scientist doit recevoir une instance de calcul personnelle pour développer dans des notebooks.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign AzureML Compute Operator on mlw-northwind to your account, and then create the compute instance again.", fr: "Attribuer AzureML Compute Operator sur mlw-northwind à votre compte, puis créer de nouveau l'instance de calcul." } }
        - { id: b, text: { en: "Assign Storage Blob Data Contributor on stnwml to the workspace managed identity, and then create the instance again.", fr: "Attribuer Storage Blob Data Contributor sur stnwml à l'identité managée de l'espace de travail, puis créer de nouveau l'instance." } }
        - { id: c, text: { en: "Create a compute cluster with `min_instances: 1`, and let the data scientist use it instead of a compute instance.", fr: "Créer un cluster de calcul avec `min_instances: 1`, et laisser la data scientist l'utiliser à la place d'une instance de calcul." } }
        - { id: d, text: { en: "Enable **Allow storage account key access** on stnwml, and then create the compute instance again.", fr: "Activer **Allow storage account key access** sur stnwml, puis créer de nouveau l'instance de calcul." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Creating a compute instance succeeds only if the workspace storage account allows storage account key access. Identity-based datastores don't remove this requirement, so you must enable the setting again on stnwml and then repeat the creation on behalf of the data scientist.
        fr: |
          La création d'une instance de calcul ne réussit que si le compte de stockage de l'espace de travail autorise l'accès par clé de compte de stockage. Les magasins de données basés sur l'identité ne suppriment pas cette exigence : vous devez réactiver le paramètre sur stnwml, puis refaire la création pour le compte de la data scientist.
      options:
        a: { en: "Contributor already allows creating compute instances; the failure comes from the storage account setting, not from a missing permission.", fr: "Contributor permet déjà de créer des instances de calcul ; l'échec vient du paramètre du compte de stockage, pas d'une autorisation manquante." }
        b: { en: "A data role for the workspace identity doesn't replace storage account key access, which instance creation requires.", fr: "Un rôle de données pour l'identité de l'espace de travail ne remplace pas l'accès par clé de compte de stockage, que la création d'instance exige." }
        c: { en: "A compute cluster runs jobs, not a personal notebook environment, and it would be billed for one node at all times.", fr: "Un cluster de calcul exécute des travaux, pas un environnement de notebooks personnel, et il serait facturé pour un nœud en permanence." }
    references:
      - title: Create a compute instance - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-compute-instance

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-11-10
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank's Azure Machine Learning workspace **mlw-woodgrove** uses a system-assigned managed identity. A datastore named **txn_curated** connects to the Data Lake Storage Gen2 account **stwgcurated** without stored credentials. The storage firewall allows access only from one virtual network and from Azure services on the trusted services list, and stwgcurated has no private endpoint.

        Jobs on the compute cluster **cpu-train** read txn_curated without errors by using the cluster's managed identity. However, when data scientists open txn_curated in Azure Machine Learning studio to look at sample rows, the studio shows an access error.

        You need the data scientists to see the sample rows in the studio without opening the storage firewall further. The solution must follow the principle of least privilege.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'espace de travail Azure Machine Learning **mlw-woodgrove** de Woodgrove Bank utilise une identité managée affectée par le système. Un magasin de données nommé **txn_curated** se connecte au compte Data Lake Storage Gen2 **stwgcurated** sans informations d'identification stockées. Le pare-feu du stockage n'autorise l'accès que depuis un réseau virtuel et depuis les services Azure de la liste des services approuvés, et stwgcurated n'a pas de point de terminaison privé.

        Les travaux du cluster de calcul **cpu-train** lisent txn_curated sans erreur avec l'identité managée du cluster. En revanche, quand les data scientists ouvrent txn_curated dans le studio Azure Machine Learning pour consulter des lignes d'exemple, le studio affiche une erreur d'accès.

        Vous devez permettre aux data scientists de voir les lignes d'exemple dans le studio sans ouvrir davantage le pare-feu du stockage. La solution doit respecter le principe du moindre privilège.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Assign Storage Blob Data Reader on stwgcurated to each data scientist.", fr: "Attribuer Storage Blob Data Reader sur stwgcurated à chaque data scientist." } }
        - { id: b, text: { en: "Assign Storage Blob Data Reader on stwgcurated to the managed identity of mlw-woodgrove.", fr: "Attribuer Storage Blob Data Reader sur stwgcurated à l'identité managée de mlw-woodgrove." } }
        - { id: c, text: { en: "Assign Storage Blob Data Contributor on stwgcurated to the managed identity of mlw-woodgrove.", fr: "Attribuer Storage Blob Data Contributor sur stwgcurated à l'identité managée de mlw-woodgrove." } }
        - { id: d, text: { en: "Assign Storage Blob Data Reader on stwgcurated to the managed identity of cpu-train.", fr: "Attribuer Storage Blob Data Reader sur stwgcurated à l'identité managée de cpu-train." } }
        - { id: e, text: { en: "On txn_curated, enable **Use workspace managed identity for data preview and profiling in Azure Machine Learning studio**.", fr: "Sur txn_curated, activer **Use workspace managed identity for data preview and profiling in Azure Machine Learning studio**." } }
        - { id: f, text: { en: "Add the public IP addresses of the data scientists' workstations to the firewall of stwgcurated.", fr: "Ajouter les adresses IP publiques des postes des data scientists au pare-feu de stwgcurated." } }
    answer: { optionIds: [ b, e ] }
    explanation:
      correct:
        en: |
          In the studio, the request to the storage account comes from the Azure Machine Learning service, not from the user's browser. When the storage firewall admits only trusted Azure services, the preview must use the workspace managed identity: you enable the datastore setting that uses the workspace managed identity for data preview and profiling, and you grant that identity Storage Blob Data Reader, which is enough to read the data.
        fr: |
          Dans le studio, la requête vers le compte de stockage vient du service Azure Machine Learning, pas du navigateur de l'utilisateur. Quand le pare-feu du stockage n'admet que les services Azure approuvés, l'aperçu doit utiliser l'identité managée de l'espace de travail : vous activez le paramètre du magasin de données qui utilise l'identité managée de l'espace de travail pour l'aperçu et le profilage des données, et vous attribuez à cette identité Storage Blob Data Reader, qui suffit pour lire les données.
      options:
        a: { en: "With the user's identity, the request still comes from the service, whose addresses the firewall doesn't allow, so the preview keeps failing.", fr: "Avec l'identité de l'utilisateur, la requête vient toujours du service, dont le pare-feu n'autorise pas les adresses : l'aperçu continue d'échouer." }
        c: { en: "Storage Blob Data Contributor also grants write and delete permissions that a preview doesn't need.", fr: "Storage Blob Data Contributor accorde aussi des autorisations d'écriture et de suppression dont un aperçu n'a pas besoin." }
        d: { en: "cpu-train already has access; the cluster identity is used by jobs, not by the studio preview.", fr: "cpu-train a déjà l'accès ; l'identité du cluster sert aux travaux, pas à l'aperçu dans le studio." }
        f: { en: "The browser doesn't connect to the storage account during a studio preview, and the rule would open the firewall further.", fr: "Le navigateur ne se connecte pas au compte de stockage pendant un aperçu dans le studio, et la règle ouvrirait davantage le pare-feu." }
    references:
      - title: Administer data authentication - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-administrate-data-authentication
      - title: Set up service authentication - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication
