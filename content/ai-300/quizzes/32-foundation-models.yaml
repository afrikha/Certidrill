chapter: 32-foundation-models
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-32-01
    objective: "3.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware has a Global Standard deployment named **faq-chat** whose `versionUpgradeOption` is set to `NoAutoUpgrade`. Nobody acted on the retirement notices, and the model version of faq-chat has now reached its retirement date.

        What does faq-chat return for each inference request?
      fr: |
        Litware dispose d'un déploiement Global Standard nommé **faq-chat** dont la propriété `versionUpgradeOption` vaut `NoAutoUpgrade`. Personne n'a donné suite aux avis de retrait, et la version du modèle de faq-chat a maintenant atteint sa date de retrait.

        Que renvoie faq-chat pour chaque requête d'inférence ?
    body:
      options:
        - { id: a, text: { en: "An HTTP `410 Gone` error", fr: "Une erreur HTTP `410 Gone`" } }
        - { id: b, text: { en: "An HTTP `429` error with a `retry-after` header", fr: "Une erreur HTTP `429` avec un en-tête `retry-after`" } }
        - { id: c, text: { en: "An HTTP `404 Not Found` error", fr: "Une erreur HTTP `404 Not Found`" } }
        - { id: d, text: { en: "An HTTP `200` response from the current default version", fr: "Une réponse HTTP `200` de la version par défaut actuelle" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A retired model version is removed from service, and every inference request to it returns `410 Gone`. With `NoAutoUpgrade`, the deployment never moves to another version, so it simply stops working at the retirement date until the application is pointed to a deployment of a supported version.
        fr: |
          Une version de modèle retirée est supprimée du service, et chaque requête d'inférence vers elle renvoie `410 Gone`. Avec `NoAutoUpgrade`, le déploiement ne passe jamais à une autre version : il cesse simplement de fonctionner à la date de retrait, jusqu'à ce que l'application soit redirigée vers un déploiement d'une version prise en charge.
      options:
        b: { en: "A 429 is a traffic signal: a provisioned deployment at 100 % utilization or a rate limit, not a retirement.", fr: "Un 429 est un signal de gestion du trafic (déploiement approvisionné à 100 % d'utilisation ou limite de débit), pas un retrait." }
        c: { en: "Retirement doesn't delete the deployment; Learn documents `410 Gone` for every request to a retired model.", fr: "Le retrait ne supprime pas le déploiement ; Learn indique `410 Gone` pour chaque requête vers un modèle retiré." }
        d: { en: "Moving to the default version at retirement is the behavior of `OnceCurrentVersionExpired` (or `null`), not of `NoAutoUpgrade`.", fr: "Passer à la version par défaut au retrait est le comportement de `OnceCurrentVersionExpired` (ou `null`), pas de `NoAutoUpgrade`." }
    references:
      - title: Foundry Models lifecycle and support policy
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirements
      - title: Azure OpenAI in Microsoft Foundry Models working with models
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/working-with-models

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-32-02
    objective: "3.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        During a sales peak, a Global Provisioned deployment named **orders-ptu** starts to answer some requests with HTTP 429 responses that include the `retry-after-ms` and `retry-after` headers.

        What does this response indicate?
      fr: |
        Pendant un pic de ventes, un déploiement Global Provisioned nommé **orders-ptu** commence à répondre à certaines requêtes par des réponses HTTP 429 qui contiennent les en-têtes `retry-after-ms` et `retry-after`.

        Qu'indique cette réponse ?
    body:
      options:
        - { id: a, text: { en: "The subscription has used all its PTU quota for this region and deployment type.", fr: "L'abonnement a consommé tout son quota de PTU pour cette région et ce type de déploiement." } }
        - { id: b, text: { en: "The deployment is at 100 % utilization of its PTUs and rejects the excess requests.", fr: "Le déploiement est à 100 % d'utilisation de ses PTU et rejette les requêtes excédentaires." } }
        - { id: c, text: { en: "The model version of orders-ptu has retired and no longer accepts new requests.", fr: "La version du modèle d'orders-ptu a été retirée et n'accepte plus de nouvelles requêtes." } }
        - { id: d, text: { en: "The service failed while processing the request and must be reported to support.", fr: "Le service a échoué pendant le traitement de la requête, ce qui doit être signalé au support." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When a provisioned deployment is at 100 % utilization, it returns HTTP 429 immediately, with `retry-after-ms` and `retry-after` headers that say how long to wait. Learn describes it as a traffic-management signal, not a service error: accepted requests keep a predictable latency because excess traffic is rejected instead of queued.
        fr: |
          Quand un déploiement approvisionné est à 100 % d'utilisation, il renvoie immédiatement HTTP 429, avec les en-têtes `retry-after-ms` et `retry-after` qui indiquent le délai d'attente. Learn le décrit comme un signal de gestion du trafic, pas comme une erreur du service : les requêtes acceptées gardent une latence prévisible, car le trafic excédentaire est rejeté au lieu d'être mis en file d'attente.
      options:
        a: { en: "Quota limits how many PTUs you can deploy; it's checked when you create or resize a deployment, not on each inference request.", fr: "Le quota limite le nombre de PTU que vous pouvez déployer ; il est vérifié à la création ou au redimensionnement d'un déploiement, pas à chaque requête d'inférence." }
        c: { en: "A retired model version returns `410 Gone`, not 429.", fr: "Une version de modèle retirée renvoie `410 Gone`, pas 429." }
        d: { en: "A 429 from a provisioned deployment isn't a service error; server errors use 5xx codes.", fr: "Un 429 d'un déploiement approvisionné n'est pas une erreur du service ; les erreurs du serveur utilisent les codes 5xx." }
    references:
      - title: Operate provisioned throughput deployments in production
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-get-started

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-32-03
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware's support assistant sends all its prompts to one deployment in a Microsoft Foundry resource. About 80 % of the prompts are simple questions about order status and returns; the others need multistep reasoning.

        The answers must be almost as good as if the best available model handled every prompt, and the cost must be as low as possible under that condition. The team doesn't want to write code that classifies the prompts.

        What should you deploy?
      fr: |
        L'assistant de support de Proseware envoie toutes ses invites à un seul déploiement d'une ressource Microsoft Foundry. Environ 80 % des invites sont des questions simples sur l'état des commandes et les retours ; les autres demandent un raisonnement en plusieurs étapes.

        Les réponses doivent être presque aussi bonnes que si le meilleur modèle disponible traitait chaque invite, et le coût doit être le plus bas possible dans cette condition. L'équipe ne veut pas écrire de code qui classe les invites.

        Que devez-vous déployer ?
    body:
      options:
        - { id: a, text: { en: "Model router with the Quality routing mode", fr: "Le routeur de modèles (model router) avec le mode de routage Quality" } }
        - { id: b, text: { en: "Model router with the Cost routing mode", fr: "Le routeur de modèles (model router) avec le mode de routage Cost" } }
        - { id: c, text: { en: "Model router with the Balanced routing mode", fr: "Le routeur de modèles (model router) avec le mode de routage Balanced" } }
        - { id: d, text: { en: "A reasoning model deployment that receives every prompt", fr: "Un déploiement d'un modèle de raisonnement qui reçoit toutes les invites" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Model router sends each prompt to the most suitable underlying model, so no classification code is needed. The Balanced mode, which is the default, considers the models within a small quality range of the best one and picks the most cost-effective of them: near-best quality at the lowest cost for that quality.
        fr: |
          Le routeur de modèles envoie chaque invite au modèle sous-jacent le plus adapté ; aucun code de classification n'est nécessaire. Le mode Balanced, qui est le mode par défaut, considère les modèles situés dans une petite marge de qualité par rapport au meilleur et choisit le plus économique d'entre eux : une qualité proche du meilleur au coût le plus bas pour cette qualité.
      options:
        a: { en: "Quality always picks the highest-quality model and ignores cost, so the simple questions would cost more than needed.", fr: "Quality choisit toujours le modèle de meilleure qualité et ignore le coût : les questions simples coûteraient plus que nécessaire." }
        b: { en: "Cost widens the quality band to save more, which accepts a larger quality gap than \"almost as good as the best model\".", fr: "Cost élargit la marge de qualité pour économiser davantage, ce qui accepte un écart de qualité plus grand que « presque aussi bonnes qu'avec le meilleur modèle »." }
        d: { en: "Sending the 80 % of simple prompts to a reasoning model costs far more than routing them to a smaller model.", fr: "Envoyer les 80 % d'invites simples à un modèle de raisonnement coûte beaucoup plus que de les router vers un modèle plus petit." }
    references:
      - title: What is model router in Microsoft Foundry?
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-32-04
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Microsoft Foundry resource in the France Central region. A new internal chat feature has low traffic with unpredictable bursts. The legal team requires that prompts and completions be processed only within the Azure geography of the resource, not in other EU countries. The feature must be billed per token.

        The selected model supports every deployment type listed below in France Central. Which deployment type should you use?
      fr: |
        Contoso dispose d'une ressource Microsoft Foundry dans la région France Central. Une nouvelle fonctionnalité de conversation interne a un trafic faible, avec des rafales imprévisibles. L'équipe juridique exige que les invites et les réponses soient traitées uniquement dans la zone géographique Azure de la ressource, et pas dans d'autres pays de l'UE. La fonctionnalité doit être facturée par jeton.

        Le modèle choisi prend en charge tous les types de déploiement listés ci-dessous dans France Central. Quel type de déploiement devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "`DataZoneStandard`" }
        - { id: b, text: "`GlobalStandard`" }
        - { id: c, text: "`ProvisionedManaged`" }
        - { id: d, text: "`Standard`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The `Standard` deployment type processes data within the Azure geography of the resource and is billed per token. Learn positions it for low to medium volume with bursts, which matches the feature.
        fr: |
          Le type de déploiement `Standard` traite les données dans la zone géographique Azure de la ressource et est facturé par jeton. Learn le destine aux volumes faibles à moyens avec des rafales, ce qui correspond à la fonctionnalité.
      options:
        a: { en: "Data Zone Standard can process data in any region of the EU data zone, which includes other EU countries.", fr: "Data Zone Standard peut traiter les données dans toute région de la zone de données UE, qui inclut d'autres pays de l'UE." }
        b: { en: "Global Standard can process data in any Azure region.", fr: "Global Standard peut traiter les données dans n'importe quelle région Azure." }
        c: { en: "Regional Provisioned keeps data in the geography but is billed per PTU per hour, not per token, and suits steady high volume.", fr: "Regional Provisioned garde les données dans la zone géographique mais est facturé par PTU et par heure, pas par jeton, et convient à un volume élevé et régulier." }
    references:
      - title: Understanding deployment types in Microsoft Foundry Models
        url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-32-05
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam manages its Microsoft Foundry deployments with scripts. A Global Standard deployment named **hr-chat** was created with `az cognitiveservices account deployment create`, and its version update policy was never set.

        You need a script that sets the `versionUpgradeOption` of hr-chat to `NoAutoUpgrade` without recreating the deployment under another name. What should the script use?
      fr: |
        Fabrikam gère ses déploiements Microsoft Foundry avec des scripts. Un déploiement Global Standard nommé **hr-chat** a été créé avec `az cognitiveservices account deployment create`, et sa stratégie de mise à jour de version n'a jamais été définie.

        Vous avez besoin d'un script qui définit la propriété `versionUpgradeOption` de hr-chat sur `NoAutoUpgrade` sans recréer le déploiement sous un autre nom. Que doit utiliser le script ?
    body:
      options:
        - { id: a, text: { en: "Azure CLI: run `az cognitiveservices account deployment create` again for hr-chat with the same model and SKU values", fr: "Azure CLI : réexécuter `az cognitiveservices account deployment create` pour hr-chat avec les mêmes valeurs de modèle et de SKU" } }
        - { id: b, text: { en: "Azure PowerShell: read hr-chat with `Get-AzCognitiveServicesAccountDeployment`, change `VersionUpgradeOption`, and write it back", fr: "Azure PowerShell : lire hr-chat avec `Get-AzCognitiveServicesAccountDeployment`, modifier `VersionUpgradeOption`, puis le réécrire" } }
        - { id: c, text: { en: "Azure CLI: run `az cognitiveservices account deployment show` for hr-chat and edit the `versionUpgradeOption` field it returns", fr: "Azure CLI : exécuter `az cognitiveservices account deployment show` pour hr-chat et modifier le champ `versionUpgradeOption` renvoyé" } }
        - { id: d, text: { en: "Bicep: redeploy the Foundry resource with `versionUpgradeOption` set in the properties of the account itself", fr: "Bicep : redéployer la ressource Foundry avec `versionUpgradeOption` défini dans les propriétés du compte lui-même" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure PowerShell can update the property: read the deployment with `Get-AzCognitiveServicesAccountDeployment`, set `Properties.VersionUpgradeOption`, and write it back with `New-AzCognitiveServicesAccountDeployment` and the same name and SKU. The Azure CLI can display `versionUpgradeOption` but can't currently update it, so a CLI-based script must switch to PowerShell or a REST call for this change.
        fr: |
          Azure PowerShell peut mettre à jour la propriété : lire le déploiement avec `Get-AzCognitiveServicesAccountDeployment`, définir `Properties.VersionUpgradeOption`, puis le réécrire avec `New-AzCognitiveServicesAccountDeployment` sous le même nom et avec le même SKU. Azure CLI peut afficher `versionUpgradeOption` mais ne peut pas le modifier actuellement ; un script basé sur la CLI doit donc passer par PowerShell ou par un appel REST pour ce changement.
      options:
        a: { en: "`az cognitiveservices account deployment create` has no parameter for the version upgrade option, so rerunning it doesn't change the policy.", fr: "`az cognitiveservices account deployment create` n'a aucun paramètre pour l'option de mise à niveau de version : la réexécuter ne change pas la stratégie." }
        c: { en: "`show` only reads the deployment; editing its output doesn't write anything back to Azure.", fr: "`show` ne fait que lire le déploiement ; modifier sa sortie ne réécrit rien dans Azure." }
        d: { en: "`versionUpgradeOption` is a property of each deployment, not of the Foundry account.", fr: "`versionUpgradeOption` est une propriété de chaque déploiement, pas du compte Foundry." }
    references:
      - title: Azure OpenAI in Microsoft Foundry Models working with models
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/working-with-models
      - title: az cognitiveservices account deployment
        url: https://learn.microsoft.com/en-us/cli/azure/cognitiveservices/account/deployment

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-32-06
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has a hub-based project in the Foundry (classic) portal. The project contains a serverless API deployment of a chat model from the model catalog, and an internal application calls it with the endpoint key. Litware also has a Microsoft Foundry resource named **fdy-litware**. The model card shows that the same model is sold directly by Azure and supports Global Standard deployments in the region of fdy-litware.

        A new security policy requires every call to the model to authenticate with Microsoft Entra ID; no endpoint key may be sent. Billing must stay per token, and Litware must not size or manage any compute.

        What should you do?
      fr: |
        Litware dispose d'un projet basé sur un hub dans le portail Foundry (classique). Le projet contient un déploiement d'API serverless d'un modèle de conversation du catalogue de modèles, et une application interne l'appelle avec la clé du point de terminaison. Litware dispose aussi d'une ressource Microsoft Foundry nommée **fdy-litware**. La fiche du modèle indique que ce même modèle est vendu directement par Azure et prend en charge les déploiements Global Standard dans la région de fdy-litware.

        Une nouvelle stratégie de sécurité exige que chaque appel au modèle s'authentifie avec Microsoft Entra ID ; aucune clé de point de terminaison ne doit être envoyée. La facturation doit rester par jeton, et Litware ne doit dimensionner ni gérer aucun calcul.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the serverless API deployment, store its key in Azure Key Vault, and let the application read the key with a managed identity.", fr: "Garder le déploiement d'API serverless, stocker sa clé dans Azure Key Vault et laisser l'application lire la clé avec une identité managée." } }
        - { id: b, text: { en: "Deploy the model to a managed online endpoint in the project with `auth_mode: aad_token`, and call it with Microsoft Entra tokens.", fr: "Déployer le modèle sur un point de terminaison en ligne managé du projet avec `auth_mode: aad_token`, puis l'appeler avec des jetons Microsoft Entra." } }
        - { id: c, text: { en: "Create a Global Standard deployment of the model in fdy-litware, and call it with Microsoft Entra tokens from the application identity.", fr: "Créer un déploiement Global Standard du modèle dans fdy-litware, puis l'appeler avec des jetons Microsoft Entra obtenus par l'identité de l'application." } }
        - { id: d, text: { en: "Regenerate the keys of the serverless API deployment, and grant the application the Azure AI Developer role on the resource group.", fr: "Régénérer les clés du déploiement d'API serverless, puis accorder à l'application le rôle Azure AI Developer sur le groupe de ressources." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Serverless API deployments in a Foundry resource are billed per token, run on Microsoft-hosted endpoints with nothing to size, and accept Microsoft Entra ID authentication (recommended) as well as keys. A serverless API deployment of a hub-based project, by contrast, uses key authentication only, so it can't meet the new policy.
        fr: |
          Les déploiements d'API serverless d'une ressource Foundry sont facturés par jeton, s'exécutent sur des points de terminaison hébergés par Microsoft sans rien à dimensionner et acceptent l'authentification Microsoft Entra ID (recommandée) ainsi que les clés. À l'inverse, un déploiement d'API serverless d'un projet basé sur un hub utilise uniquement l'authentification par clé : il ne peut pas respecter la nouvelle stratégie.
      options:
        a: { en: "The application still sends the endpoint key on every call; Key Vault only changes where the key is stored.", fr: "L'application envoie toujours la clé du point de terminaison à chaque appel ; Key Vault change seulement l'endroit où la clé est stockée." }
        b: { en: "A managed online endpoint accepts Entra tokens, but it runs on VM instances that you choose and pay per hour, not per token.", fr: "Un point de terminaison en ligne managé accepte les jetons Entra, mais il s'exécute sur des instances de machines virtuelles que vous choisissez et que vous payez à l'heure, pas par jeton." }
        d: { en: "The classic serverless API endpoint uses key authentication only; a role assignment doesn't let the application call it with an Entra token.", fr: "Le point de terminaison d'API serverless classique utilise uniquement l'authentification par clé ; une attribution de rôle ne permet pas à l'application de l'appeler avec un jeton Entra." }
    references:
      - title: Deploy models as serverless API deployments (classic)
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/deploy-models-serverless
      - title: Deployment overview for Microsoft Foundry Models
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/deployments-overview

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-32-07
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a Global Provisioned deployment named **advisor-ptu** with 300 PTUs, billed at the hourly rate. Daytime traffic is steady and needs all 300 PTUs, and the workload will run for at least two more years. At night, the traffic needs about 60 PTUs.

        A FinOps engineer proposes an automation that scales advisor-ptu down to 60 PTUs at 20:00 and back up to 300 PTUs at 07:00. The deployment must have its 300 PTUs every morning, and the cost must be minimized.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'un déploiement Global Provisioned nommé **advisor-ptu** de 300 PTU, facturé au tarif horaire. Le trafic de journée est régulier et a besoin des 300 PTU, et la charge de travail tournera encore au moins deux ans. La nuit, le trafic a besoin d'environ 60 PTU.

        Un ingénieur FinOps propose une automatisation qui réduit advisor-ptu à 60 PTU à 20 h et le remonte à 300 PTU à 7 h. Le déploiement doit disposer de ses 300 PTU chaque matin, et le coût doit être réduit au minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run the proposed automation, and keep hourly billing for every PTU that is deployed.", fr: "Exécuter l'automatisation proposée et garder la facturation horaire pour chaque PTU déployée." } }
        - { id: b, text: { en: "Buy a one-year Global Provisioned reservation for 300 PTUs, and then run the proposed automation.", fr: "Acheter une réservation Global Provisioned d'un an pour 300 PTU, puis exécuter l'automatisation proposée." } }
        - { id: c, text: { en: "Keep advisor-ptu at 300 PTUs, and buy a one-year Global Provisioned reservation for 300 PTUs.", fr: "Garder advisor-ptu à 300 PTU et acheter une réservation Global Provisioned d'un an pour 300 PTU." } }
        - { id: d, text: { en: "Keep advisor-ptu at 300 PTUs with hourly billing, and request 300 more PTUs of quota as a buffer.", fr: "Garder advisor-ptu à 300 PTU en facturation horaire et demander 300 PTU de quota supplémentaires comme marge." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Scaling a provisioned deployment down releases its capacity to the region pool, with no guarantee that the same capacity is available when you scale back up, so the nightly scale-down puts the morning 300 PTUs at risk. Keeping the deployment at 300 PTUs and covering it with a reservation gives the discounted rate for a workload that runs all year; the deployment already exists, so the reservation is bought in the recommended order.
        fr: |
          Réduire un déploiement approvisionné libère sa capacité dans le pool de la région, sans garantie que la même capacité soit disponible au moment de remonter : la réduction nocturne met donc en danger les 300 PTU du matin. Garder le déploiement à 300 PTU et le couvrir par une réservation donne le tarif réduit pour une charge qui tourne toute l'année ; le déploiement existe déjà, donc la réservation est achetée dans l'ordre recommandé.
      options:
        a: { en: "Each scale-up depends on the capacity available at that moment and can fail, and hourly billing is the most expensive rate for a workload that runs for years.", fr: "Chaque remontée dépend de la capacité disponible à ce moment-là et peut échouer, et la facturation horaire est le tarif le plus cher pour une charge qui tourne pendant des années." }
        b: { en: "A reservation doesn't guarantee capacity, so the morning scale-up can still fail, and the reserved PTUs not deployed at night are paid without being used.", fr: "Une réservation ne garantit pas la capacité : la remontée du matin peut toujours échouer, et les PTU réservées non déployées la nuit sont payées sans être utilisées." }
        d: { en: "Quota is only a limit on what you may deploy and doesn't hold capacity; the deployment keeps paying the undiscounted hourly rate.", fr: "Le quota n'est qu'une limite de ce que vous pouvez déployer et ne retient aucune capacité ; le déploiement continue de payer le tarif horaire non réduit." }
    references:
      - title: Provisioned throughput billing and cost management
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput-billing
      - title: Provisioned throughput for Foundry Models
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-32-08
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys has a Global Standard deployment named **chat-prod** that runs gpt-4.1 version 2025-04-14. Its `versionUpgradeOption` is set to `OnceNewDefaultVersionAvailable`. The application reads the name of the deployment to call from its configuration.

        The following requirements apply:

        - Before the retirement date of the version in use, the model version that serves production traffic must change only after the team has evaluated the new version on its own dataset.
        - If the retirement date arrives before the team finishes its evaluation, production requests must still be served.
        - After a switch to a new version, the team must be able to return to the previous version within minutes by changing configuration only.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un déploiement Global Standard nommé **chat-prod** qui exécute gpt-4.1 en version 2025-04-14. Sa propriété `versionUpgradeOption` vaut `OnceNewDefaultVersionAvailable`. L'application lit dans sa configuration le nom du déploiement à appeler.

        Les exigences suivantes s'appliquent :

        - Avant la date de retrait de la version utilisée, la version du modèle qui sert le trafic de production ne doit changer qu'après que l'équipe a évalué la nouvelle version sur son propre jeu de données.
        - Si la date de retrait arrive avant que l'équipe ait terminé son évaluation, les requêtes de production doivent toujours être servies.
        - Après un passage à une nouvelle version, l'équipe doit pouvoir revenir à la version précédente en quelques minutes en modifiant uniquement la configuration.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set the `versionUpgradeOption` of chat-prod to `OnceCurrentVersionExpired`.", fr: "Définir la propriété `versionUpgradeOption` de chat-prod sur `OnceCurrentVersionExpired`." } }
        - { id: b, text: { en: "Set the `versionUpgradeOption` of chat-prod to `NoAutoUpgrade`.", fr: "Définir la propriété `versionUpgradeOption` de chat-prod sur `NoAutoUpgrade`." } }
        - { id: c, text: { en: "Deploy each candidate version as a second deployment, evaluate it, then switch the configured deployment name.", fr: "Déployer chaque version candidate comme second déploiement, l'évaluer, puis changer le nom de déploiement configuré." } }
        - { id: d, text: { en: "Evaluate each candidate version in the playground, then update the model version of chat-prod in place.", fr: "Évaluer chaque version candidate dans le terrain de jeu (playground), puis mettre à jour sur place la version du modèle de chat-prod." } }
        - { id: e, text: { en: "Ask Microsoft to extend the retirement date of version 2025-04-14 until the evaluation is complete.", fr: "Demander à Microsoft de prolonger la date de retrait de la version 2025-04-14 jusqu'à la fin de l'évaluation." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          `OnceCurrentVersionExpired` keeps chat-prod on its version until retirement and then moves it to the current default version, so production keeps working even if the evaluation is late; today's `OnceNewDefaultVersionAvailable` would change the version within two weeks of a new default, untested. Deploying the candidate as a second deployment lets the team evaluate it without touching chat-prod, and switching the configured deployment name back is the rollback.
        fr: |
          `OnceCurrentVersionExpired` garde chat-prod sur sa version jusqu'au retrait puis le fait passer à la version par défaut courante : la production continue de fonctionner même si l'évaluation est en retard ; l'actuel `OnceNewDefaultVersionAvailable` changerait la version dans les deux semaines suivant une nouvelle version par défaut, sans test. Déployer la candidate comme second déploiement permet de l'évaluer sans toucher à chat-prod, et remettre l'ancien nom de déploiement dans la configuration constitue la restauration.
      options:
        b: { en: "With `NoAutoUpgrade`, the deployment stops working at the retirement date, which breaks the second requirement.", fr: "Avec `NoAutoUpgrade`, le déploiement cesse de fonctionner à la date de retrait, ce qui enfreint la deuxième exigence." }
        d: { en: "After an in-place update, the previous version is no longer deployed, so returning to it isn't a configuration change.", fr: "Après une mise à jour sur place, la version précédente n'est plus déployée : y revenir n'est pas un simple changement de configuration." }
        e: { en: "Retirement dates can't be extended.", fr: "Les dates de retrait ne peuvent pas être prolongées." }
    references:
      - title: Azure OpenAI in Microsoft Foundry Models working with models
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/working-with-models
      - title: Design to Support Foundation Model Life Cycles
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/manage-foundation-models-lifecycle

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-32-09
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders classifies about two million support tickets per day into 12 categories, in real time. Classification runs on a Global Standard deployment of gpt-4.1 named **triage-prod**, and each response is a single category name. Northwind's agents have labeled 2,000 past tickets with their correct category.

        Northwind wants to lower the cost of classification. Compliance requires every feature to call one identified model version. Before any change reaches production, Northwind must show that accuracy on the labeled tickets doesn't drop compared with triage-prod.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders classe environ deux millions de tickets de support par jour dans 12 catégories, en temps réel. La classification s'exécute sur un déploiement Global Standard de gpt-4.1 nommé **triage-prod**, et chaque réponse est un seul nom de catégorie. Les agents de Northwind ont étiqueté 2 000 anciens tickets avec leur bonne catégorie.

        Northwind veut réduire le coût de la classification. La conformité exige que chaque fonctionnalité appelle une version de modèle identifiée. Avant qu'un changement n'arrive en production, Northwind doit montrer que l'exactitude sur les tickets étiquetés ne baisse pas par rapport à triage-prod.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Deploy gpt-4.1-mini as a second Global Standard deployment named triage-mini.", fr: "Déployer gpt-4.1-mini comme second déploiement Global Standard nommé triage-mini." } }
        - { id: b, text: { en: "Evaluate both deployments on the labeled tickets with the same evaluators, with triage-prod as the baseline.", fr: "Évaluer les deux déploiements sur les tickets étiquetés avec les mêmes évaluateurs, triage-prod servant de référence." } }
        - { id: c, text: { en: "Replace gpt-4.1 with the model that has the highest quality index on the model leaderboards.", fr: "Remplacer gpt-4.1 par le modèle qui a l'indice de qualité le plus élevé dans les classements de modèles." } }
        - { id: d, text: { en: "Deploy model router with the Cost routing mode, and send the classification prompts to it.", fr: "Déployer le routeur de modèles avec le mode de routage Cost et lui envoyer les invites de classification." } }
        - { id: e, text: { en: "Move the classification to a Global Batch deployment of gpt-4.1 to get the batch discount.", fr: "Déplacer la classification vers un déploiement Global Batch de gpt-4.1 pour obtenir la remise du traitement par lots." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          A short, high-volume task such as classification with one-word answers is the case for a small model, which costs a fraction of the larger model. A public benchmark can't prove that the smaller model is good enough for Northwind's tickets: running both deployments on the labeled tickets with the same evaluators, against triage-prod as the baseline, gives the evidence that compliance asks for.
        fr: |
          Une tâche courte à volume élevé, comme une classification avec des réponses d'un mot, est le cas d'usage d'un petit modèle, qui coûte une fraction du grand modèle. Un benchmark public ne peut pas prouver que le petit modèle suffit pour les tickets de Northwind : exécuter les deux déploiements sur les tickets étiquetés avec les mêmes évaluateurs, avec triage-prod comme référence, apporte la preuve qu'exige la conformité.
      options:
        c: { en: "The top model of a public leaderboard is usually not the cheapest, and benchmark scores don't measure accuracy on Northwind's own tickets.", fr: "Le meilleur modèle d'un classement public n'est en général pas le moins cher, et les scores de benchmark ne mesurent pas l'exactitude sur les tickets de Northwind." }
        d: { en: "Model router chooses among several underlying models per prompt, so the feature wouldn't call one identified model version.", fr: "Le routeur de modèles choisit pour chaque invite parmi plusieurs modèles sous-jacents : la fonctionnalité n'appellerait pas une version de modèle identifiée." }
        e: { en: "Batch deployments are asynchronous, with a 24-hour target turnaround, which doesn't fit real-time classification.", fr: "Les déploiements batch sont asynchrones, avec un objectif de traitement de 24 heures, ce qui ne convient pas à une classification en temps réel." }
    references:
      - title: Compare models using the model leaderboard
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/benchmark-model-in-catalog
      - title: See Evaluation Results in Microsoft Foundry portal
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-32-10
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Fabrikam has a Microsoft Foundry resource named **fdy-claims-eu** in Sweden Central. It contains the following deployments:

        | Deployment | Deployment type | Model | Version |
        | --- | --- | --- | --- |
        | claims-dz | Data Zone Standard | gpt-5.4 | 2026-03-05 |
        | claims-gs | Global Standard | gpt-5.4 | 2026-03-05 |
        | claims-mini | Data Zone Standard | gpt-5.4-mini | 2026-03-17 |
        | claims-dzb | Data Zone Batch | gpt-5.4 | 2026-03-05 |

        You need to create a provisioned deployment of gpt-5.4 version 2026-03-05 for the claims assistant. The solution must meet the following requirements:

        - Every prompt and response must be processed within the EU data zone, including requests that the provisioned deployment can't serve.
        - Requests that the provisioned deployment can't serve must be processed automatically, in real time, billed per token, without any change to the application.
        - The deployment must cover a peak of 150 requests per minute, with 3,000 input tokens and 400 output tokens per request on average. 40 % of the input tokens are cached.
        - The deployment must use the smallest number of PTUs that covers the peak.

        The sizing table for gpt-5.4 shows 2,400 input tokens per minute per PTU and an output-to-input ratio of 6. Global and data zone provisioned deployments have a minimum of 15 PTUs with increments of 5; regional provisioned deployments have a minimum of 50 PTUs with increments of 50. Quota and capacity are available for every provisioned type, and cached input tokens don't consume PTU capacity for this model.

        How should you complete the command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'une ressource Microsoft Foundry nommée **fdy-claims-eu** dans Sweden Central. Elle contient les déploiements suivants :

        | Déploiement | Type de déploiement | Modèle | Version |
        | --- | --- | --- | --- |
        | claims-dz | Data Zone Standard | gpt-5.4 | 2026-03-05 |
        | claims-gs | Global Standard | gpt-5.4 | 2026-03-05 |
        | claims-mini | Data Zone Standard | gpt-5.4-mini | 2026-03-17 |
        | claims-dzb | Data Zone Batch | gpt-5.4 | 2026-03-05 |

        Vous devez créer un déploiement approvisionné de gpt-5.4 en version 2026-03-05 pour l'assistant des sinistres. La solution doit répondre aux exigences suivantes :

        - Chaque invite et chaque réponse doivent être traitées dans la zone de données UE, y compris les requêtes que le déploiement approvisionné ne peut pas servir.
        - Les requêtes que le déploiement approvisionné ne peut pas servir doivent être traitées automatiquement, en temps réel, facturées par jeton, sans aucune modification de l'application.
        - Le déploiement doit couvrir une pointe de 150 requêtes par minute, avec en moyenne 3 000 jetons d'entrée et 400 jetons de sortie par requête. 40 % des jetons d'entrée sont mis en cache.
        - Le déploiement doit utiliser le plus petit nombre de PTU qui couvre la pointe.

        Le tableau de dimensionnement de gpt-5.4 indique 2 400 jetons d'entrée par minute et par PTU et un ratio sortie/entrée de 6. Les déploiements approvisionnés global et zone de données ont un minimum de 15 PTU par incréments de 5 ; les déploiements approvisionnés régionaux ont un minimum de 50 PTU par incréments de 50. Le quota et la capacité sont disponibles pour chaque type approvisionné, et les jetons d'entrée mis en cache ne consomment pas de capacité PTU pour ce modèle.

        Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az cognitiveservices account deployment create \
          --name fdy-claims-eu --resource-group rg-claims \
          --deployment-name claims-ptu \
          --model-name gpt-5.4 --model-version "2026-03-05" --model-format OpenAI \
          --sku-name [[sku]] \
          --sku-capacity [[cap]] \
          --spillover-deployment-name [[spill]]
      slots:
        - id: sku
          options:
            - { id: gpm, text: GlobalProvisionedManaged }
            - { id: pm, text: ProvisionedManaged }
            - { id: dzpm, text: DataZoneProvisionedManaged }
            - { id: dzs, text: DataZoneStandard }
        - id: cap
          options:
            - { id: c140, text: "140" }
            - { id: c205, text: "205" }
            - { id: c265, text: "265" }
            - { id: c300, text: "300" }
            - { id: c340, text: "340" }
        - id: spill
          options:
            - { id: sgs, text: claims-gs }
            - { id: smini, text: claims-mini }
            - { id: sdzb, text: claims-dzb }
            - { id: sdz, text: claims-dz }
    answer:
      values: { sku: dzpm, cap: c265, spill: sdz }
    explanation:
      correct:
        en: |
          Input TPM is 150 x 3,000 = 450,000 and output TPM is 150 x 400 = 60,000. Normalized TPM = 450,000 x (1 - 0.4) + 6 x 60,000 = 630,000, and 630,000 / 2,400 = 262.5, rounded up to the data zone increment of 5: 265 PTUs. `DataZoneProvisionedManaged` keeps processing in the EU data zone with that size, and spillover must target a standard deployment of the same model and version in the same resource that also stays in the data zone: claims-dz.
        fr: |
          Le TPM d'entrée vaut 150 x 3 000 = 450 000 et le TPM de sortie 150 x 400 = 60 000. TPM normalisé = 450 000 x (1 - 0,4) + 6 x 60 000 = 630 000, et 630 000 / 2 400 = 262,5, arrondi à l'incrément de 5 de la zone de données : 265 PTU. `DataZoneProvisionedManaged` garde le traitement dans la zone de données UE avec cette taille, et le débordement (spillover) doit viser un déploiement standard du même modèle et de la même version, dans la même ressource, qui reste lui aussi dans la zone de données : claims-dz.
      options:
        gpm: { en: "Global Provisioned can process requests in any Azure region, outside the EU data zone.", fr: "Global Provisioned peut traiter les requêtes dans n'importe quelle région Azure, hors de la zone de données UE." }
        pm: { en: "Regional Provisioned rounds 262.5 up to its increment of 50, so it needs 300 PTUs instead of 265.", fr: "Regional Provisioned arrondit 262,5 à son incrément de 50 : il lui faut 300 PTU au lieu de 265." }
        dzs: { en: "Data Zone Standard is billed per token and reserves no throughput; it isn't a provisioned deployment.", fr: "Data Zone Standard est facturé par jeton et ne réserve aucun débit ; ce n'est pas un déploiement approvisionné." }
        c140: { en: "140 adds the output TPM without the output-to-input ratio of 6.", fr: "140 ajoute le TPM de sortie sans le ratio sortie/entrée de 6." }
        c205: { en: "205 applies the 40 % cache rate to the output tokens too; only cached input tokens are deducted.", fr: "205 applique aussi le taux de cache de 40 % aux jetons de sortie ; seuls les jetons d'entrée mis en cache sont déduits." }
        c340: { en: "340 ignores the cache rate: cached input tokens don't consume PTU capacity for this model.", fr: "340 ignore le taux de cache : les jetons d'entrée mis en cache ne consomment pas de capacité PTU pour ce modèle." }
        sgs: { en: "claims-gs is Global Standard: spilled requests could be processed outside the EU data zone.", fr: "claims-gs est Global Standard : les requêtes débordées pourraient être traitées hors de la zone de données UE." }
        smini: { en: "The spillover target must run the same model and version as the provisioned deployment.", fr: "La cible du débordement doit exécuter le même modèle et la même version que le déploiement approvisionné." }
        sdzb: { en: "A batch deployment is asynchronous; spillover needs a real-time standard deployment.", fr: "Un déploiement batch est asynchrone ; le débordement a besoin d'un déploiement standard en temps réel." }
    references:
      - title: Determine PTU sizing for a workload
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-sizing
      - title: Manage traffic with spillover for provisioned deployments
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/spillover-traffic-management
