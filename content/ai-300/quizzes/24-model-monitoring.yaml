chapter: 24-model-monitoring
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-24-01
    objective: "2.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso enables out-of-box model monitoring for a model deployed to a managed online endpoint. Data collection is enabled on the deployment, and no signal is configured manually.

        Which data do the monitoring signals use as reference data?
      fr: |
        Contoso active la surveillance prête à l'emploi d'un modèle déployé sur un point de terminaison en ligne managé. La collecte de données est activée sur le déploiement, et aucun signal n'est configuré manuellement.

        Quelles données les signaux de surveillance utilisent-ils comme données de référence ?
    body:
      options:
        - { id: a, text: { en: "The training data asset of the model", fr: "La ressource de données d'entraînement du modèle" } }
        - { id: b, text: { en: "The validation data asset of the model", fr: "La ressource de données de validation du modèle" } }
        - { id: c, text: { en: "The recent past production data of the deployment", fr: "Les données de production récentes du déploiement" } }
        - { id: d, text: { en: "The ground truth data registered for the model", fr: "Les données de vérité terrain inscrites pour le modèle" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Out-of-box monitoring needs only the deployment: Azure Machine Learning detects the collected production data assets and uses recent past production data as the comparison reference for data drift, prediction drift and data quality. To compare with training or validation data, you configure advanced monitoring.
        fr: |
          La surveillance prête à l'emploi ne demande que le déploiement : Azure Machine Learning détecte les ressources de données de production collectées et prend les données de production récentes comme référence pour la dérive des données, la dérive des prédictions et la qualité des données. Pour comparer aux données d'entraînement ou de validation, vous configurez une surveillance avancée.
      options:
        a: { en: "Training data is the recommended reference for data drift, but you must declare it in an advanced monitoring signal.", fr: "Les données d'entraînement sont la référence recommandée pour la dérive des données, mais vous devez les déclarer dans un signal de surveillance avancée." }
        b: { en: "Validation data is the recommended reference for prediction drift, but out-of-box monitoring doesn't select it automatically.", fr: "Les données de validation sont la référence recommandée pour la dérive des prédictions, mais la surveillance prête à l'emploi ne les sélectionne pas automatiquement." }
        d: { en: "Ground truth is used only by the model performance signal, which isn't one of the out-of-box signals.", fr: "La vérité terrain n'est utilisée que par le signal de performances du modèle, qui ne fait pas partie des signaux prêts à l'emploi." }
    references:
      - title: Monitor model performance in production
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-24-02
    objective: "2.4.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a managed online deployment named **blue** that uses a curated environment. The operations team wants to investigate blue by using live metrics, transaction search, and the failures and performance views.

        Which deployment setting should you configure?
      fr: |
        Fabrikam dispose d'un déploiement en ligne managé nommé **blue** qui utilise un environnement organisé. L'équipe d'exploitation souhaite analyser blue à l'aide des métriques en temps réel, de la recherche de transactions et des vues des échecs et des performances.

        Quel paramètre du déploiement devez-vous configurer ?
    body:
      options:
        - { id: a, text: "`app_insights_enabled: true`" }
        - { id: b, text: "`data_collector.sampling_rate: 1.0`" }
        - { id: c, text: "`liveness_probe.period: 10`" }
        - { id: d, text: "`request_settings.request_timeout_ms: 5000`" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          `app_insights_enabled` integrates the deployment with the Application Insights instance associated with the workspace; it's `false` by default. In the studio, the same option is labeled Application Insights diagnostics, and it requires a curated environment.
        fr: |
          `app_insights_enabled` intègre le déploiement à l'instance Application Insights associée à l'espace de travail ; il vaut `false` par défaut. Dans le studio, la même option s'appelle Application Insights diagnostics, et elle demande un environnement organisé.
      options:
        b: { en: "`sampling_rate` sets the share of inputs and outputs that the data collector writes to storage for model monitoring; it sends nothing to Application Insights.", fr: "`sampling_rate` définit la part des entrées et sorties que le collecteur de données écrit dans le stockage pour la surveillance des modèles ; il n'envoie rien à Application Insights." }
        c: { en: "The liveness probe checks the health of the container; its period doesn't enable any telemetry.", fr: "La sonde liveness vérifie l'intégrité du conteneur ; sa période n'active aucune télémétrie." }
        d: { en: "`request_timeout_ms` sets the scoring timeout (5,000 ms by default); it doesn't send metrics or logs anywhere.", fr: "`request_timeout_ms` définit le délai d'expiration du scoring (5 000 ms par défaut) ; il n'envoie ni métriques ni journaux." }
    references:
      - title: CLI (v2) managed online deployment YAML schema
        url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-deployment-managed-online
      - title: Monitor online endpoints
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-online-endpoints

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-24-03
    objective: "2.4.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware's scoring script collects `model_inputs` and `model_outputs` with the `Collector` class of the `azureml-ai-monitoring` package. During a short storage outage, the `collect()` calls raised exceptions and the scoring requests failed.

        You need the endpoint to keep returning predictions when data collection fails, and the collection errors to be written to the logs. Model monitoring must keep recognizing the collected data automatically.

        What should you do?
      fr: |
        Le script de scoring de Litware collecte `model_inputs` et `model_outputs` avec la classe `Collector` du package `azureml-ai-monitoring`. Pendant une courte panne du stockage, les appels à `collect()` ont levé des exceptions et les requêtes de scoring ont échoué.

        Vous devez faire en sorte que le point de terminaison continue de renvoyer des prédictions quand la collecte de données échoue, et que les erreurs de collecte soient écrites dans les journaux. La surveillance des modèles doit continuer à reconnaître automatiquement les données collectées.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create each `Collector` with an `on_error` function that handles the exception.", fr: "Créer chaque `Collector` avec une fonction `on_error` qui gère l'exception." } }
        - { id: b, text: { en: "Pass a `BasicCorrelationContext` with your own ID as the second argument of each `collect()` call.", fr: "Passer un `BasicCorrelationContext` avec votre propre ID comme second argument de chaque appel à `collect()`." } }
        - { id: c, text: { en: "Rename the two collections to `request` and `response` so that payloads are logged without the SDK.", fr: "Renommer les deux collections en `request` et `response` pour journaliser les charges utiles sans le SDK." } }
        - { id: d, text: { en: "Set `rolling_rate` to `Minute` in the `data_collector` section so that smaller files are written.", fr: "Définir `rolling_rate` sur `Minute` dans la section `data_collector` pour écrire des fichiers plus petits." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          By default, Azure Machine Learning raises an exception when data collection fails, which makes the scoring request fail. The optional `on_error` parameter of `Collector` takes a function that runs instead, for example one that writes the exception to the log. The collector names stay `model_inputs` and `model_outputs`, so monitoring still recognizes the data assets.
        fr: |
          Par défaut, Azure Machine Learning lève une exception quand la collecte de données échoue, ce qui fait échouer la requête de scoring. Le paramètre facultatif `on_error` de `Collector` accepte une fonction exécutée à la place, par exemple une fonction qui écrit l'exception dans le journal. Les collecteurs gardent les noms `model_inputs` et `model_outputs` : la surveillance reconnaît toujours les ressources de données.
      options:
        b: { en: "A custom correlation context only replaces the generated `correlationid`; a storage failure still raises an exception.", fr: "Un contexte de corrélation personnalisé ne fait que remplacer le `correlationid` généré ; une panne du stockage lève toujours une exception." }
        c: { en: "Payload logging isn't guaranteed to be tabular and needs a preprocessing component before monitoring can use it, so the data is no longer recognized automatically.", fr: "La journalisation des charges utiles n'est pas forcément tabulaire et demande un composant de prétraitement avant que la surveillance puisse l'utiliser : les données ne sont plus reconnues automatiquement." }
        d: { en: "`rolling_rate` only sets how the collected data is partitioned in storage; it doesn't change what happens when a write fails.", fr: "`rolling_rate` ne définit que le partitionnement des données collectées dans le stockage ; il ne change rien quand une écriture échoue." }
    references:
      - title: Collect production data from models for real-time inferencing
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-collect-production-data

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-24-04
    objective: "2.4.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin retrains a demand forecasting model with a pipeline job in an Azure Machine Learning workspace. The pipeline must run every Monday, and also when the model monitor of the deployed model reports a threshold breach.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin réentraîne un modèle de prévision de la demande avec un travail de pipeline dans un espace de travail Azure Machine Learning. Le pipeline doit s'exécuter chaque lundi, ainsi que lorsque le moniteur du modèle déployé signale un dépassement de seuil.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: An Azure Machine Learning schedule with a recurrence trigger can be configured to also start the pipeline when the monitor reports a threshold breach.
            fr: Une planification Azure Machine Learning avec un déclencheur de périodicité peut être configurée pour démarrer aussi le pipeline quand le moniteur signale un dépassement de seuil.
        - id: s2
          text:
            en: An Event Grid subscription on the workspace can send the threshold breach events to an Azure Data Factory pipeline that submits the retraining job.
            fr: Un abonnement Event Grid sur l'espace de travail peut envoyer les événements de dépassement de seuil à un pipeline Azure Data Factory qui soumet le travail de réentraînement.
        - id: s3
          text:
            en: After you run `az ml schedule disable` on the Monday schedule, you can start it again later with `az ml schedule enable`.
            fr: Après avoir exécuté `az ml schedule disable` sur la planification du lundi, vous pouvez la relancer plus tard avec `az ml schedule enable`.
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Azure Machine Learning schedules are time-based only (recurrence or cron) and don't support event-based triggers, so the threshold breach needs Event Grid. Event Grid can deliver the workspace events to Azure Functions, Logic Apps, Event Hubs, webhooks or an Azure Data Factory pipeline, any of which can submit the retraining job. A disabled schedule stays in the workspace and can be enabled again; only deletion is permanent.
        fr: |
          Les planifications Azure Machine Learning sont uniquement temporelles (périodicité ou cron) et ne prennent pas en charge les déclencheurs basés sur des événements : le dépassement de seuil passe donc par Event Grid. Event Grid peut livrer les événements de l'espace de travail à Azure Functions, Logic Apps, Event Hubs, des webhooks ou un pipeline Azure Data Factory, chacun pouvant soumettre le travail de réentraînement. Une planification désactivée reste dans l'espace de travail et peut être réactivée ; seule la suppression est définitive.
    references:
      - title: Schedule machine learning pipeline jobs
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-schedule-pipeline-job
      - title: Trigger applications, processes, or CI/CD workflows based on Azure Machine Learning events
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-event-grid

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-24-05
    objective: "2.4.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders runs a weekly model monitor for a deployment named **blue** on the managed online endpoint **ep-orders**. The data drift signal must compare the model inputs collected during the last 7 days with the model inputs collected during the 7 days immediately before them. The training data must not be used.

        How should you complete the YAML file? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders exécute un moniteur de modèle hebdomadaire pour un déploiement nommé **blue** sur le point de terminaison en ligne managé **ep-orders**. Le signal de dérive des données doit comparer les entrées du modèle collectées pendant les 7 derniers jours aux entrées du modèle collectées pendant les 7 jours qui les précèdent immédiatement. Les données d'entraînement ne doivent pas être utilisées.

        Comment devez-vous compléter le fichier YAML ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        trigger:
          type: recurrence
          frequency: week
          interval: 1
        create_monitor:
          compute:
            instance_type: standard_e4s_v3
            runtime_version: "3.4"
          monitoring_target:
            ml_task: classification
            endpoint_deployment_id: azureml:ep-orders:blue
          monitoring_signals:
            orders_drift:
              type: data_drift
              production_data:
                input_data:
                  path: azureml:ep-orders-blue-model_inputs:1
                  type: mltable
                data_context: model_inputs
                data_window:
                  lookback_window_size: [[psize]]
                  lookback_window_offset: P0D
              reference_data:
                input_data:
                  path: azureml:ep-orders-blue-model_inputs:1
                  type: mltable
                data_context: model_inputs
                data_window:
                  lookback_window_size: [[rsize]]
                  lookback_window_offset: [[roff]]
      slots:
        - id: psize
          options:
            - { id: p0, text: P0D }
            - { id: p7, text: P7D }
            - { id: p14, text: P14D }
        - id: rsize
          options:
            - { id: r0, text: P0D }
            - { id: r7, text: P7D }
            - { id: r14, text: P14D }
        - id: roff
          options:
            - { id: o0, text: P0D }
            - { id: o7, text: P7D }
            - { id: o14, text: P14D }
    answer:
      values: { psize: p7, rsize: r7, roff: o7 }
    explanation:
      correct:
        en: |
          In a rolling window, `lookback_window_size` is the length of the window and `lookback_window_offset` moves the end of the window back from the run time. The production window is the last 7 days (size `P7D`, offset `P0D`). The reference window has the same size and ends where the production window starts, so its offset is `P7D`; Learn recommends a reference offset of at least the production size plus the production offset, which avoids overlapping windows.
        fr: |
          Dans une fenêtre glissante, `lookback_window_size` est la longueur de la fenêtre et `lookback_window_offset` recule la fin de la fenêtre par rapport à l'heure d'exécution. La fenêtre de production couvre les 7 derniers jours (taille `P7D`, décalage `P0D`). La fenêtre de référence a la même taille et se termine là où commence la fenêtre de production : son décalage vaut donc `P7D`. Learn recommande un décalage de référence au moins égal à la taille de production plus le décalage de production, ce qui évite que les fenêtres se chevauchent.
      options:
        psize: { en: "`P14D` would analyze two weeks of production data; `P0D` is an empty window.", fr: "`P14D` analyserait deux semaines de données de production ; `P0D` est une fenêtre vide." }
        roff: { en: "An offset of `P0D` makes the reference overlap the production window; `P14D` would compare with days 15 to 21.", fr: "Un décalage de `P0D` fait chevaucher la référence et la fenêtre de production ; `P14D` comparerait aux jours 15 à 21." }
    references:
      - title: Model monitoring in production
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-24-06
    objective: "2.4.2"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Adatum has a managed online endpoint named **ep-pricing** with two deployments, **blue** and **green**. A diagnostic setting sends the traffic logs of ep-pricing to a Log Analytics workspace. Users report slow and failed requests.

        A query on AmlOnlineEndpointTrafficLog returns the following rows. Durations and delays are in milliseconds.

        Answer each prompt by selecting the request ID of the request that matches the description.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un point de terminaison en ligne managé nommé **ep-pricing** avec deux déploiements, **blue** et **green**. Un paramètre de diagnostic envoie les journaux de trafic d'ep-pricing à un espace de travail Log Analytics. Des utilisateurs signalent des requêtes lentes et en échec.

        Une requête sur AmlOnlineEndpointTrafficLog renvoie les lignes suivantes. Les durées et les délais sont en millisecondes.

        Répondez à chaque consigne en sélectionnant l'ID de la requête qui correspond à la description.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The request that failed because the scoring code of the model returned an error", fr: "La requête qui a échoué parce que le code de scoring du modèle a renvoyé une erreur" }
        - id: p2
          text: { en: "The request whose duration is caused mainly by bandwidth throttling", fr: "La requête dont la durée est due principalement à la limitation de la bande passante" }
      grid:
        header: [XRequestId, DeploymentName, ResponseCode, ModelStatusCode, TotalDurationMs, ResponseDurationMs, RequestThrottlingDelayMs]
        rows:
          - [{ text: req-0a1, area: a1 }, { text: blue }, { text: "200" }, { text: "200" }, { text: "140" }, { text: "125" }, { text: "0" }]
          - [{ text: req-0b2, area: b2 }, { text: green }, { text: "424" }, { text: "500" }, { text: "95" }, { text: "90" }, { text: "0" }]
          - [{ text: req-0c3, area: c3 }, { text: blue }, { text: "200" }, { text: "200" }, { text: "2350" }, { text: "2310" }, { text: "0" }]
          - [{ text: req-0d4, area: d4 }, { text: green }, { text: "200" }, { text: "200" }, { text: "2420" }, { text: "2330" }, { text: "2150" }]
    answer:
      values: { p1: b2, p2: d4 }
    explanation:
      correct:
        en: |
          `ModelStatusCode` is the status returned by the model container, while `ResponseCode` is the final code returned to the client: when the model returns a non-200 response, the endpoint answers 424 (model error), as in req-0b2. req-0d4 and req-0c3 both take more than 2 seconds, but only req-0d4 has a large `RequestThrottlingDelayMs`, the transfer delay added by network throttling. In req-0c3 the time is spent before the model's first response byte (`ResponseDurationMs`), so the model itself is slow.
        fr: |
          `ModelStatusCode` est l'état renvoyé par le conteneur du modèle, tandis que `ResponseCode` est le code final renvoyé au client : quand le modèle renvoie une réponse autre que 200, le point de terminaison répond 424 (erreur du modèle), comme pour req-0b2. req-0d4 et req-0c3 durent toutes deux plus de 2 secondes, mais seule req-0d4 présente un `RequestThrottlingDelayMs` élevé, le délai de transfert ajouté par la limitation du réseau. Pour req-0c3, le temps est passé avant le premier octet de réponse du modèle (`ResponseDurationMs`) : c'est le modèle lui-même qui est lent.
      options:
        c3: { en: "req-0c3 is slow because of the model, not because of throttling: its throttling delay is 0.", fr: "req-0c3 est lente à cause du modèle, pas de la limitation : son délai de limitation vaut 0." }
    references:
      - title: Monitor online endpoints
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-online-endpoints
      - title: Troubleshoot online endpoint deployment and scoring
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-troubleshoot-online-endpoints

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-24-07
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has a churn model with 240 features deployed to a managed online endpoint. The endpoint receives about 300 requests per week. A model monitor runs a data drift signal every day. The signal has no `reference_data` section and monitors all the features. The training data is registered as the data asset **churn-train**, whose target column is `churned`.

        The team receives many drift alerts that don't match real problems, and the monitoring cost is higher than planned. You need to reduce the alert noise and the cost by following Microsoft's model monitoring best practices.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un modèle d'attrition à 240 caractéristiques déployé sur un point de terminaison en ligne managé. Le point de terminaison reçoit environ 300 requêtes par semaine. Un moniteur de modèle exécute chaque jour un signal de dérive des données. Le signal n'a pas de section `reference_data` et surveille toutes les caractéristiques. Les données d'entraînement sont inscrites comme ressource de données **churn-train**, dont la colonne cible est `churned`.

        L'équipe reçoit de nombreuses alertes de dérive qui ne correspondent à aucun problème réel, et le coût de la surveillance dépasse le budget prévu. Vous devez réduire le bruit des alertes et le coût en suivant les bonnes pratiques de Microsoft pour la surveillance des modèles.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Change the trigger of the monitor to a weekly recurrence.", fr: "Remplacer le déclencheur du moniteur par une périodicité hebdomadaire." } }
        - { id: b, text: { en: "Keep the current reference data and add `top_n_feature_importance: 20` to the signal.", fr: "Conserver les données de référence actuelles et ajouter `top_n_feature_importance: 20` au signal." } }
        - { id: c, text: { en: "Use churn-train as reference data with `target_column: churned`, and monitor the top 20 features.", fr: "Utiliser churn-train comme données de référence avec `target_column: churned`, et surveiller les 20 principales caractéristiques." } }
        - { id: d, text: { en: "Run the monitoring jobs on an Azure Machine Learning compute cluster instead of serverless Spark.", fr: "Exécuter les travaux de surveillance sur un cluster de calcul Azure Machine Learning au lieu de Spark serverless." } }
        - { id: e, text: { en: "Set `sampling_rate: 0.1` in the data collector of the deployment.", fr: "Définir `sampling_rate: 0.1` dans le collecteur de données du déploiement." } }
      choose: 2
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Microsoft recommends daily monitoring only for models with heavy daily traffic, and weekly or monthly otherwise: with about 40 requests a day, daily windows are too small for stable distributions, and a weekly run also means fewer jobs. For models with many features, monitoring the top N features reduces cost and noise, and top N is available when training data is the reference, with the target column declared.
        fr: |
          Microsoft ne recommande une surveillance quotidienne que pour les modèles à fort trafic quotidien, et une fréquence hebdomadaire ou mensuelle sinon : avec environ 40 requêtes par jour, les fenêtres quotidiennes sont trop petites pour des distributions stables, et une exécution hebdomadaire signifie aussi moins de travaux. Pour les modèles à nombreuses caractéristiques, surveiller les N principales caractéristiques réduit le coût et le bruit, et le top N est disponible quand les données d'entraînement servent de référence, avec la colonne cible déclarée.
      options:
        b: { en: "Without `reference_data`, the signal compares with recent past production data; feature importance is computed from training data, so top N isn't available with this reference.", fr: "Sans `reference_data`, le signal compare aux données de production récentes ; l'importance des caractéristiques se calcule à partir des données d'entraînement, donc le top N n'est pas disponible avec cette référence." }
        d: { en: "Model monitoring jobs run on serverless Spark compute (`instance_type` such as `standard_e4s_v3`); a compute cluster isn't an option for a monitor.", fr: "Les travaux de surveillance des modèles s'exécutent sur un calcul Spark serverless (`instance_type` comme `standard_e4s_v3`) ; un cluster de calcul n'est pas une option pour un moniteur." }
        e: { en: "Collecting 10 percent of about 300 weekly requests leaves too few rows: the distributions would be even noisier, and the cost of the monitoring jobs barely changes.", fr: "Collecter 10 % d'environ 300 requêtes hebdomadaires laisse trop peu de lignes : les distributions seraient encore plus bruitées, et le coût des travaux de surveillance change à peine." }
    references:
      - title: Model monitoring in production
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring
      - title: Monitor model performance in production
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-24-08
    objective: "2.4.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip's retraining pipeline registers each new version of a model named **wt-demand** in the workspace **mlw-wingtip**. Only the versions that pass evaluation receive the tag `stage` with the value `candidate`. Other models are registered in mlw-wingtip, including a model named **wt-demand-test**.

        A function app named **func-deploy** must run for each candidate version of wt-demand, and for no other model or version, so that it creates a deployment of the version with 0 percent of the traffic.

        How should you configure the Event Grid subscription on mlw-wingtip?
      fr: |
        Le pipeline de réentraînement de Wingtip inscrit chaque nouvelle version d'un modèle nommé **wt-demand** dans l'espace de travail **mlw-wingtip**. Seules les versions qui réussissent l'évaluation reçoivent l'étiquette `stage` avec la valeur `candidate`. D'autres modèles sont inscrits dans mlw-wingtip, dont un modèle nommé **wt-demand-test**.

        Une application de fonction nommée **func-deploy** doit s'exécuter pour chaque version candidate de wt-demand, et pour aucun autre modèle ni aucune autre version, afin de créer un déploiement de la version avec 0 % du trafic.

        Comment devez-vous configurer l'abonnement Event Grid sur mlw-wingtip ?
    body:
      options:
        - { id: a, text: { en: "Event type **Model registered**, subject ends with `wt-demand`, and the advanced filter `data.ModelTags.stage` StringIn `candidate`", fr: "Type d'événement **Model registered**, sujet se terminant par `wt-demand`, et le filtre avancé `data.ModelTags.stage` StringIn `candidate`" } }
        - { id: b, text: { en: "Event type **Model deployed**, subject begins with `endpoints/wt-demand`, and the advanced filter `data.ModelTags.stage` StringIn `candidate`", fr: "Type d'événement **Model deployed**, sujet commençant par `endpoints/wt-demand`, et le filtre avancé `data.ModelTags.stage` StringIn `candidate`" } }
        - { id: c, text: { en: "Event type **Model registered**, subject begins with `models/wt-demand:`, and the advanced filter `data.ModelTags.stage` StringIn `candidate`", fr: "Type d'événement **Model registered**, sujet commençant par `models/wt-demand:`, et le filtre avancé `data.ModelTags.stage` StringIn `candidate`" } }
        - { id: d, text: { en: "Event type **Run completed**, subject begins with `models/wt-demand:`, and the advanced filter `data.ModelTags.stage` StringIn `candidate`", fr: "Type d'événement **Run completed**, sujet commençant par `models/wt-demand:`, et le filtre avancé `data.ModelTags.stage` StringIn `candidate`" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A ModelRegistered event has the subject `models/{modelName}:{modelVersion}`, for example `models/wt-demand:7`. "Begins with `models/wt-demand:`" matches every version of wt-demand but not wt-demand-test, because of the colon, and the advanced filter on `data.ModelTags.stage` keeps only the candidate versions.
        fr: |
          Un événement ModelRegistered a pour sujet `models/{modelName}:{modelVersion}`, par exemple `models/wt-demand:7`. « Commence par `models/wt-demand:` » correspond à toutes les versions de wt-demand mais pas à wt-demand-test, grâce aux deux-points, et le filtre avancé sur `data.ModelTags.stage` ne garde que les versions candidates.
      options:
        a: { en: "The subject of a registration event ends with the version number (`:7`), never with the model name, so this filter matches no event.", fr: "Le sujet d'un événement d'inscription se termine par le numéro de version (`:7`), jamais par le nom du modèle : ce filtre ne correspond à aucun événement." }
        b: { en: "ModelDeployed fires after a deployment succeeds, with an `endpoints/...` subject: it can't start the creation of the deployment.", fr: "ModelDeployed se déclenche après la réussite d'un déploiement, avec un sujet `endpoints/...` : il ne peut pas lancer la création du déploiement." }
        d: { en: "RunCompleted events have the subject `experiments/{ExperimentId}/runs/{RunId}`, so a `models/` subject filter matches none of them.", fr: "Les événements RunCompleted ont pour sujet `experiments/{ExperimentId}/runs/{RunId}` : un filtre de sujet `models/` n'en retient aucun." }
    references:
      - title: Trigger applications, processes, or CI/CD workflows based on Azure Machine Learning events
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-event-grid

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-24-09
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware serves a pricing model from a Kubernetes cluster that isn't attached to Azure Machine Learning. The application writes the model inputs as JSON Lines files in a blob container, and the folder is registered as the data asset **pricing-inputs**. A component named **jsonl_to_table**, version 1.0.0, reads the files of a time window and outputs them as an `mltable` table. The training data is registered as **pricing-train**.

        You need a data drift signal that compares the production inputs with the training data.

        How should you complete the YAML file? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware sert un modèle de tarification depuis un cluster Kubernetes qui n'est pas attaché à Azure Machine Learning. L'application écrit les entrées du modèle sous forme de fichiers JSON Lines dans un conteneur blob, et le dossier est inscrit comme ressource de données **pricing-inputs**. Un composant nommé **jsonl_to_table**, version 1.0.0, lit les fichiers d'une fenêtre de temps et les renvoie sous forme de table `mltable`. Les données d'entraînement sont inscrites sous le nom **pricing-train**.

        Vous avez besoin d'un signal de dérive des données qui compare les entrées de production aux données d'entraînement.

        Comment devez-vous compléter le fichier YAML ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        monitoring_signals:
          pricing_drift:
            type: data_drift
            production_data:
              input_data:
                path: azureml:pricing-inputs:1
                type: [[itype]]
              data_context: [[ctx]]
              [[pre]]: azureml:jsonl_to_table:1.0.0
            reference_data:
              input_data:
                path: azureml:pricing-train:2
                type: mltable
              data_context: training
            alert_enabled: true
            metric_thresholds:
              numerical:
                jensen_shannon_distance: 0.01
      slots:
        - id: itype
          options:
            - { id: folder, text: uri_folder }
            - { id: table, text: mltable }
            - { id: file, text: uri_file }
        - id: ctx
          options:
            - { id: inputs, text: model_inputs }
            - { id: outputs, text: model_outputs }
            - { id: training, text: training }
        - id: pre
          options:
            - { id: ppc, text: pre_processing_component }
            - { id: comp, text: component_id }
            - { id: job, text: create_job }
    answer:
      values: { itype: folder, ctx: inputs, pre: ppc }
    explanation:
      correct:
        en: |
          For a model deployed outside Azure Machine Learning, you collect the production data yourself and declare it in `production_data`. Raw files are registered as a `uri_folder` data asset, and `pre_processing_component` names the component that converts each time window into a table (its output is `mltable`, not its input). A data drift signal compares the model inputs, so `data_context` is `model_inputs`.
        fr: |
          Pour un modèle déployé hors d'Azure Machine Learning, vous collectez vous-même les données de production et les déclarez dans `production_data`. Les fichiers bruts sont inscrits comme ressource de données `uri_folder`, et `pre_processing_component` désigne le composant qui convertit chaque fenêtre de temps en table (c'est sa sortie qui est `mltable`, pas son entrée). Un signal de dérive des données compare les entrées du modèle : `data_context` vaut donc `model_inputs`.
      options:
        itype: { en: "`mltable` is the output of jsonl_to_table, not the type of the registered folder of JSON Lines files; `uri_file` points to a single file.", fr: "`mltable` est la sortie de jsonl_to_table, pas le type du dossier de fichiers JSON Lines inscrit ; `uri_file` désigne un seul fichier." }
        ctx: { en: "`model_outputs` is the context of prediction drift; `training` describes reference data, not production data.", fr: "`model_outputs` est le contexte de la dérive des prédictions ; `training` décrit des données de référence, pas des données de production." }
        pre: { en: "`component_id` belongs to custom signals, which replace the built-in computation; `create_job` belongs to job schedules.", fr: "`component_id` appartient aux signaux personnalisés, qui remplacent le calcul intégré ; `create_job` appartient aux planifications de travaux." }
    references:
      - title: Monitor model performance in production
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
      - title: CLI (v2) schedule YAML schema for model monitoring (preview)
        url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-monitor

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-24-10
    objective: "2.4.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum creates the following model monitor for the deployment **blue** of the managed online endpoint **ep-claims** by running `az ml schedule create`. The feature `claim_amount` is numerical and is one of the 10 most important features of the model. The feature `customer_age` is numerical and isn't one of them.

        ```yaml
        name: claims_monitoring
        trigger:
          type: recurrence
          frequency: day
          interval: 1
          schedule:
            hours: 4
            minutes: 0
        create_monitor:
          compute:
            instance_type: standard_e4s_v3
            runtime_version: "3.4"
          monitoring_target:
            ml_task: classification
            endpoint_deployment_id: azureml:ep-claims:blue
          monitoring_signals:
            claims_drift:
              type: data_drift
              reference_data:
                input_data:
                  path: azureml:claims-train:2
                  type: mltable
                data_context: training
                data_column_names:
                  target_column: is_fraud
              features:
                top_n_feature_importance: 10
              alert_enabled: true
              metric_thresholds:
                numerical:
                  jensen_shannon_distance: 0.01
            claims_quality:
              type: data_quality
              reference_data:
                input_data:
                  path: azureml:claims-train:2
                  type: mltable
                data_context: training
              alert_enabled: false
              metric_thresholds:
                numerical:
                  null_value_rate: 0.05
          alert_notification:
            emails:
              - fraud-ml@adatum.com
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum crée le moniteur de modèle suivant pour le déploiement **blue** du point de terminaison en ligne managé **ep-claims** en exécutant `az ml schedule create`. La caractéristique `claim_amount` est numérique et fait partie des 10 caractéristiques les plus importantes du modèle. La caractéristique `customer_age` est numérique et n'en fait pas partie.

        ```yaml
        name: claims_monitoring
        trigger:
          type: recurrence
          frequency: day
          interval: 1
          schedule:
            hours: 4
            minutes: 0
        create_monitor:
          compute:
            instance_type: standard_e4s_v3
            runtime_version: "3.4"
          monitoring_target:
            ml_task: classification
            endpoint_deployment_id: azureml:ep-claims:blue
          monitoring_signals:
            claims_drift:
              type: data_drift
              reference_data:
                input_data:
                  path: azureml:claims-train:2
                  type: mltable
                data_context: training
                data_column_names:
                  target_column: is_fraud
              features:
                top_n_feature_importance: 10
              alert_enabled: true
              metric_thresholds:
                numerical:
                  jensen_shannon_distance: 0.01
            claims_quality:
              type: data_quality
              reference_data:
                input_data:
                  path: azureml:claims-train:2
                  type: mltable
                data_context: training
              alert_enabled: false
              metric_thresholds:
                numerical:
                  null_value_rate: 0.05
          alert_notification:
            emails:
              - fraud-ml@adatum.com
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: If 8 percent of the `claim_amount` values in the production data are null, fraud-ml@adatum.com receives an email.
            fr: Si 8 % des valeurs de `claim_amount` dans les données de production sont nulles, fraud-ml@adatum.com reçoit un e-mail.
        - id: s2
          text:
            en: If the Jensen-Shannon distance of `customer_age` between production and training reaches 0.03, fraud-ml@adatum.com receives an email.
            fr: Si la distance de Jensen-Shannon de `customer_age` entre la production et l'entraînement atteint 0,03, fraud-ml@adatum.com reçoit un e-mail.
        - id: s3
          text:
            en: Each run of the monitor evaluates the production inputs collected during the 24 hours before the run.
            fr: Chaque exécution du moniteur évalue les entrées de production collectées pendant les 24 heures qui précèdent l'exécution.
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          An email is sent only for a signal that has `alert_enabled: true` and breaches one of its `metric_thresholds`: claims_quality has `alert_enabled: false`, so its null value rate breach sends no email. claims_drift computes drift only for the 10 most important features, so `customer_age` isn't monitored and its distance can't trigger an alert. Without a `data_window`, the production window defaults to the monitoring frequency, here one day that ends at the run time.
        fr: |
          Un e-mail n'est envoyé que pour un signal qui a `alert_enabled: true` et qui dépasse l'un de ses `metric_thresholds` : claims_quality a `alert_enabled: false`, donc son dépassement du taux de valeurs nulles n'envoie aucun e-mail. claims_drift ne calcule la dérive que pour les 10 caractéristiques les plus importantes : `customer_age` n'est pas surveillée et sa distance ne peut pas déclencher d'alerte. Sans `data_window`, la fenêtre de production vaut par défaut la fréquence de surveillance, ici une journée qui se termine à l'heure de l'exécution.
    references:
      - title: Model monitoring in production
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring
      - title: Monitor model performance in production
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
