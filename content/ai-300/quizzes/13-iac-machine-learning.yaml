chapter: 13-iac-machine-learning
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-13-01
    objective: "1.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A Bicep file deploys an Azure Machine Learning workspace. You add a compute cluster for training jobs to the same file, as a child of the workspace.

        Which resource type should you declare for the cluster?
      fr: |
        Un fichier Bicep déploie un espace de travail Azure Machine Learning. Vous ajoutez au même fichier un cluster de calcul pour les travaux d'entraînement, en tant qu'enfant de l'espace de travail.

        Quel type de ressource devez-vous déclarer pour le cluster ?
    body:
      options:
        - { id: a, text: "`Microsoft.MachineLearningServices/workspaces/onlineEndpoints`" }
        - { id: b, text: "`Microsoft.Compute/virtualMachineScaleSets`" }
        - { id: c, text: "`Microsoft.MachineLearningServices/workspaces/computes`" }
        - { id: d, text: "`Microsoft.MachineLearningServices/registries`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Compute targets of a workspace are the child resource type `Microsoft.MachineLearningServices/workspaces/computes`. The `computeType` property then sets the kind of compute, `'AmlCompute'` for a compute cluster.
        fr: |
          Les cibles de calcul d'un espace de travail sont le type de ressource enfant `Microsoft.MachineLearningServices/workspaces/computes`. La propriété `computeType` fixe ensuite le genre de calcul, `'AmlCompute'` pour un cluster de calcul.
      options:
        a: { en: "`onlineEndpoints` is the child type of a managed online endpoint, which serves models; it doesn't run training jobs.", fr: "`onlineEndpoints` est le type enfant d'un point de terminaison en ligne managé, qui sert des modèles ; il n'exécute pas de travaux d'entraînement." }
        b: { en: "A scale set is a plain compute resource: Azure Machine Learning doesn't use it as a compute target declared this way.", fr: "Un groupe de machines virtuelles identiques est une simple ressource de calcul : Azure Machine Learning ne l'utilise pas comme cible de calcul déclarée ainsi." }
        d: { en: "A registry shares assets across workspaces; it isn't a child of the workspace and has no compute.", fr: "Un registre partage des actifs entre espaces de travail ; ce n'est pas un enfant de l'espace de travail et il n'a pas de calcul." }
    references:
      - title: Microsoft.MachineLearningServices/workspaces/computes
        url: https://learn.microsoft.com/en-us/azure/templates/microsoft.machinelearningservices/workspaces/computes

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-13-02
    objective: "1.3.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An Azure Machine Learning workspace uses a managed virtual network in the `allow_internet_outbound` isolation mode.

        Which type of outbound rule can you add to this managed virtual network?
      fr: |
        Un espace de travail Azure Machine Learning utilise un réseau virtuel managé dans le mode d'isolation `allow_internet_outbound`.

        Quel type de règle de trafic sortant pouvez-vous ajouter à ce réseau virtuel managé ?
    body:
      options:
        - { id: a, text: "`fqdn`" }
        - { id: b, text: "`private_endpoint`" }
        - { id: c, text: "`service_tag`" }
        - { id: d, text: { en: "None, because this mode accepts no outbound rule", fr: "Aucun, car ce mode n'accepte aucune règle de trafic sortant" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In the allow internet outbound mode, internet traffic is already allowed, and the only rule type you can add is a private endpoint rule, for example to reach a storage account whose public access is disabled. Service tag and FQDN rules exist only in the allow only approved outbound mode.
        fr: |
          Dans le mode internet sortant autorisé, le trafic vers internet est déjà permis, et le seul type de règle que vous pouvez ajouter est une règle de point de terminaison privé, par exemple pour atteindre un compte de stockage dont l'accès public est désactivé. Les règles d'étiquette de service et FQDN n'existent que dans le mode trafic sortant approuvé uniquement.
      options:
        a: { en: "FQDN rules are only available in the allow only approved outbound mode, where they add an Azure Firewall.", fr: "Les règles FQDN ne sont disponibles que dans le mode trafic sortant approuvé uniquement, où elles ajoutent un Pare-feu Azure." }
        c: { en: "Service tag rules are only available in the allow only approved outbound mode.", fr: "Les règles d'étiquette de service ne sont disponibles que dans le mode trafic sortant approuvé uniquement." }
        d: { en: "The mode accepts private endpoint rules, so it isn't true that no rule can be added.", fr: "Le mode accepte les règles de point de terminaison privé : il est donc faux qu'aucune règle ne puisse être ajoutée." }
    references:
      - title: Managed virtual network isolation
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-13-03
    objective: "1.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Ben has a compute instance named **ci-ben** in an Azure Machine Learning workspace. He plans to clone a large Git repository from the ci-ben terminal for a two-day experiment.

        Git and file operations on the clone must be as fast as possible. Ben accepts that the clone is lost if ci-ben is deleted, and no other user needs to see it.

        Where should Ben clone the repository?
      fr: |
        Ben dispose d'une instance de calcul nommée **ci-ben** dans un espace de travail Azure Machine Learning. Il prévoit de cloner un gros dépôt Git depuis le terminal de ci-ben pour une expérience de deux jours.

        Les opérations Git et les opérations sur les fichiers du clone doivent être aussi rapides que possible. Ben accepte que le clone soit perdu si ci-ben est supprimée, et aucun autre utilisateur n'a besoin de le voir.

        Où Ben doit-il cloner le dépôt ?
    body:
      options:
        - { id: a, text: { en: "In a folder under ~/cloudfiles/code/Users/ben", fr: "Dans un dossier sous ~/cloudfiles/code/Users/ben" } }
        - { id: b, text: { en: "In the ~/cloudfiles/code folder shared by all users", fr: "Dans le dossier ~/cloudfiles/code partagé par tous les utilisateurs" } }
        - { id: c, text: { en: "In a folder under /home/azureuser, outside cloudfiles", fr: "Dans un dossier sous /home/azureuser, hors de cloudfiles" } }
        - { id: d, text: { en: "In a blob container of the workspace default datastore", fr: "Dans un conteneur blob du magasin de données par défaut" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A clone on the local file system of the compute instance performs better than a clone on the mounted workspace file share. The local disk is lost when the instance is deleted and recreated, which Ben accepts, and nobody else needs the clone.
        fr: |
          Un clone sur le système de fichiers local de l'instance de calcul offre de meilleures performances qu'un clone sur le partage de fichiers monté de l'espace de travail. Le disque local est perdu quand l'instance est supprimée puis recréée, ce que Ben accepte, et personne d'autre n'a besoin du clone.
      options:
        a: { en: "The user folder on the mounted file share survives the deletion of the instance, but it's slower than the local disk, and speed is the requirement here.", fr: "Le dossier utilisateur du partage de fichiers monté survit à la suppression de l'instance, mais il est plus lent que le disque local, et la vitesse est l'exigence ici." }
        b: { en: "The shared root of the file share is slower than the local disk, and a clone there can collide with the working branches of other users.", fr: "La racine partagée du partage de fichiers est plus lente que le disque local, et un clone à cet endroit peut entrer en conflit avec les branches de travail des autres utilisateurs." }
        d: { en: "A Git clone needs a file system; a blob container of a datastore isn't where Git working copies are kept, and it wouldn't be faster.", fr: "Un clone Git a besoin d'un système de fichiers ; un conteneur blob d'un magasin de données n'est pas l'endroit où l'on garde une copie de travail Git, et ce ne serait pas plus rapide." }
    references:
      - title: Git integration
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-train-model-git-integration

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-13-04
    objective: "1.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A GitHub Actions job signs in to Azure by using OpenID Connect, installs the `ml` extension, and then runs six `az ml` commands that create an environment, two components, a data asset and a schedule, and submit a pipeline job.

        Every command must target the workspace **mlw-litware** in the resource group **rg-ml-litware**, without repeating the `-w` and `-g` parameters in each command.

        What should you add before the `az ml` commands?
      fr: |
        Un travail GitHub Actions se connecte à Azure avec OpenID Connect, installe l'extension `ml`, puis exécute six commandes `az ml` qui créent un environnement, deux composants, une ressource de données et une planification, et soumettent un travail de pipeline.

        Chaque commande doit cibler l'espace de travail **mlw-litware** du groupe de ressources **rg-ml-litware**, sans répéter les paramètres `-w` et `-g` dans chaque commande.

        Que devez-vous ajouter avant les commandes `az ml` ?
    body:
      options:
        - { id: a, text: { en: "A step that runs az account set with the subscription ID of mlw-litware", fr: "Une étape qui exécute az account set avec l'ID d'abonnement de mlw-litware" } }
        - { id: b, text: { en: "A step that runs az ml workspace show -n mlw-litware -g rg-ml-litware", fr: "Une étape qui exécute az ml workspace show -n mlw-litware -g rg-ml-litware" } }
        - { id: c, text: { en: "A defaults: run: working-directory entry set to the folder of mlw-litware", fr: "Une entrée defaults: run: working-directory définie sur le dossier de mlw-litware" } }
        - { id: d, text: { en: "A step that runs az configure --defaults workspace=mlw-litware group=rg-ml-litware", fr: "Une étape qui exécute az configure --defaults workspace=mlw-litware group=rg-ml-litware" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The `az ml` subcommands need a workspace and a resource group. `az configure --defaults workspace=... group=...` stores default values in the Azure CLI configuration of the runner, so the later commands of the job use them without `-w` and `-g`, and a command line can still override them.
        fr: |
          Les sous-commandes `az ml` ont besoin d'un espace de travail et d'un groupe de ressources. `az configure --defaults workspace=... group=...` enregistre des valeurs par défaut dans la configuration Azure CLI de l'exécuteur : les commandes suivantes du travail les utilisent sans `-w` ni `-g`, et une ligne de commande peut toujours les remplacer.
      options:
        a: { en: "az account set only selects the subscription; the commands still need the workspace and the resource group.", fr: "az account set sélectionne seulement l'abonnement ; les commandes ont toujours besoin de l'espace de travail et du groupe de ressources." }
        b: { en: "az ml workspace show only displays the workspace; it doesn't set any default for the next commands.", fr: "az ml workspace show ne fait qu'afficher l'espace de travail ; il ne définit aucune valeur par défaut pour les commandes suivantes." }
        c: { en: "working-directory only sets the folder where the run steps execute; it doesn't tell the Azure CLI which workspace to use.", fr: "working-directory définit seulement le dossier où s'exécutent les étapes run ; il n'indique pas à Azure CLI quel espace de travail utiliser." }
    references:
      - title: Install and set up the CLI (v2)
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-cli

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-13-05
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        You are writing a Bicep file that deploys an Azure Machine Learning workspace named **mlw-tailspin-prod**. The security team created a user-assigned managed identity named **id-mlw-prod** and granted it the roles that the workspace needs. Its resource ID is passed in the `uamiId` parameter.

        The workspace must use id-mlw-prod as its workspace identity and must not have a system-assigned identity.

        How should you complete the file? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous rédigez un fichier Bicep qui déploie un espace de travail Azure Machine Learning nommé **mlw-tailspin-prod**. L'équipe de sécurité a créé une identité managée affectée par l'utilisateur nommée **id-mlw-prod** et lui a accordé les rôles dont l'espace de travail a besoin. Son ID de ressource est transmis dans le paramètre `uamiId`.

        L'espace de travail doit utiliser id-mlw-prod comme identité de l'espace de travail et ne doit pas avoir d'identité affectée par le système.

        Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bicep
      template: |
        resource workspace 'Microsoft.MachineLearningServices/workspaces@2026-05-01' = {
          name: 'mlw-tailspin-prod'
          location: location
          identity: {
            type: [[itype]]
            userAssignedIdentities: {
              '${uamiId}': {}
            }
          }
          properties: {
            storageAccount: storageAccountId
            keyVault: keyVaultId
            applicationInsights: appInsightsId
            [[prop]]: uamiId
          }
        }
      slots:
        - id: itype
          options:
            - { id: sys, text: "'SystemAssigned'" }
            - { id: user, text: "'UserAssigned'" }
            - { id: none, text: "'None'" }
        - id: prop
          options:
            - { id: snake, text: primary_user_assigned_identity }
            - { id: build, text: imageBuildCompute }
            - { id: primary, text: primaryUserAssignedIdentity }
    answer:
      values: { itype: user, prop: primary }
    explanation:
      correct:
        en: |
          `type: 'UserAssigned'` attaches only the identities listed in `userAssignedIdentities`, without a system-assigned identity. The `primaryUserAssignedIdentity` property then designates which user-assigned identity is the workspace identity, by its resource ID.
        fr: |
          `type: 'UserAssigned'` n'attache que les identités listées dans `userAssignedIdentities`, sans identité affectée par le système. La propriété `primaryUserAssignedIdentity` désigne ensuite, par son ID de ressource, l'identité affectée par l'utilisateur qui sert d'identité de l'espace de travail.
      options:
        sys: { en: "'SystemAssigned' creates the system-assigned identity that the workspace must not have, and ignores the user-assigned one.", fr: "'SystemAssigned' crée l'identité affectée par le système que l'espace de travail ne doit pas avoir, et ignore celle affectée par l'utilisateur." }
        none: { en: "'None' gives the workspace no managed identity at all.", fr: "'None' ne donne aucune identité managée à l'espace de travail." }
        snake: { en: "primary_user_assigned_identity is the key of the CLI workspace YAML file, not a Bicep property.", fr: "primary_user_assigned_identity est la clé du fichier YAML d'espace de travail de la CLI, pas une propriété Bicep." }
        build: { en: "imageBuildCompute takes the name of a compute cluster that builds images, not an identity.", fr: "imageBuildCompute prend le nom d'un cluster de calcul qui construit les images, pas une identité." }
    references:
      - title: Microsoft.MachineLearningServices/workspaces
        url: https://learn.microsoft.com/en-us/azure/templates/microsoft.machinelearningservices/workspaces

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-13-06
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has an Azure Machine Learning workspace named **mlw-adatum** in the West Europe region. The workspace has a managed virtual network in the `allow_only_approved_outbound` isolation mode. Its default storage account allows public network access.

        Training jobs run on compute clusters in mlw-adatum. A partner exposes training data on an SFTP server named `sftp.fabrikam.com` that listens on port 22.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un espace de travail Azure Machine Learning nommé **mlw-adatum** dans la région West Europe. L'espace de travail a un réseau virtuel managé dans le mode d'isolation `allow_only_approved_outbound`. Son compte de stockage par défaut autorise l'accès réseau public.

        Les travaux d'entraînement s'exécutent sur des clusters de calcul de mlw-adatum. Un partenaire expose des données d'entraînement sur un serveur SFTP nommé `sftp.fabrikam.com` qui écoute sur le port 22.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: An `fqdn` outbound rule for `sftp.fabrikam.com` lets the training jobs reach the SFTP server on port 22.
            fr: Une règle de trafic sortant `fqdn` pour `sftp.fabrikam.com` permet aux travaux d'entraînement d'atteindre le serveur SFTP sur le port 22.
        - id: s2
          text:
            en: The managed virtual network gets a private endpoint to the default storage account of mlw-adatum even though that account allows public network access.
            fr: Le réseau virtuel managé obtient un point de terminaison privé vers le compte de stockage par défaut de mlw-adatum même si ce compte autorise l'accès réseau public.
        - id: s3
          text:
            en: To use GPU quota available in North Europe, you can create a compute cluster of mlw-adatum in North Europe inside the managed virtual network.
            fr: Pour utiliser un quota de GPU disponible en North Europe, vous pouvez créer un cluster de calcul de mlw-adatum en North Europe dans le réseau virtuel managé.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          FQDN outbound rules only support ports 80 and 443, so an SFTP server on port 22 can't be reached through such a rule. In the allow only approved outbound mode, the required private endpoints to the workspace's default storage, key vault and container registry are created regardless of the public network access of those resources. With a managed virtual network, a compute cluster can't be created in a region other than the workspace's region.
        fr: |
          Les règles de trafic sortant FQDN ne prennent en charge que les ports 80 et 443 : un serveur SFTP sur le port 22 ne peut donc pas être atteint par une telle règle. Dans le mode trafic sortant approuvé uniquement, les points de terminaison privés requis vers le stockage par défaut, le coffre de clés et le registre de conteneurs de l'espace de travail sont créés quel que soit l'accès réseau public de ces ressources. Avec un réseau virtuel managé, un cluster de calcul ne peut pas être créé dans une autre région que celle de l'espace de travail.
      options:
        s1: { en: "No: FQDN rules allow only ports 80 and 443.", fr: "Non : les règles FQDN n'autorisent que les ports 80 et 443." }
        s2: { en: "Yes: in approved-only mode these private endpoints are created whatever the public access setting; only the internet outbound mode limits them to resources whose public access is disabled.", fr: "Oui : en mode approuvé uniquement, ces points de terminaison privés sont créés quel que soit le paramètre d'accès public ; seul le mode internet sortant les limite aux ressources dont l'accès public est désactivé." }
        s3: { en: "No: a compute cluster in another region than the workspace isn't supported with a managed virtual network.", fr: "Non : un cluster de calcul dans une autre région que l'espace de travail n'est pas pris en charge avec un réseau virtuel managé." }
    references:
      - title: Managed virtual network isolation
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-13-07
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A GitHub Actions workflow in the repository **proseware/forecast-ml** signs in to Azure by using OpenID Connect as a Microsoft Entra application named **app-forecast-infra**. app-forecast-infra has the Contributor role on the resource group **rg-forecast-prod**.

        The workflow deploys a Bicep file to rg-forecast-prod. The file creates a workspace, its storage account and a compute cluster. You add the following resource to the file so that the cluster's managed identity can read training data.

        ```bicep
        resource clusterBlobReader 'Microsoft.Authorization/roleAssignments@2022-04-01' = {
          name: guid(storage.id, cluster.id, blobDataReaderRoleId)
          scope: storage
          properties: {
            roleDefinitionId: blobDataReaderRoleId
            principalId: cluster.identity.principalId
            principalType: 'ServicePrincipal'
          }
        }
        ```

        The next deployment fails with an `AuthorizationFailed` error for the action `Microsoft.Authorization/roleAssignments/write`. You need the workflow to deploy the whole file. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Un workflow GitHub Actions du dépôt **proseware/forecast-ml** se connecte à Azure avec OpenID Connect en tant qu'application Microsoft Entra nommée **app-forecast-infra**. app-forecast-infra a le rôle Contributor sur le groupe de ressources **rg-forecast-prod**.

        Le workflow déploie un fichier Bicep dans rg-forecast-prod. Le fichier crée un espace de travail, son compte de stockage et un cluster de calcul. Vous ajoutez au fichier la ressource suivante pour que l'identité managée du cluster puisse lire les données d'entraînement.

        ```bicep
        resource clusterBlobReader 'Microsoft.Authorization/roleAssignments@2022-04-01' = {
          name: guid(storage.id, cluster.id, blobDataReaderRoleId)
          scope: storage
          properties: {
            roleDefinitionId: blobDataReaderRoleId
            principalId: cluster.identity.principalId
            principalType: 'ServicePrincipal'
          }
        }
        ```

        Le déploiement suivant échoue avec une erreur `AuthorizationFailed` pour l'action `Microsoft.Authorization/roleAssignments/write`. Vous devez faire en sorte que le workflow déploie tout le fichier. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Also assign app-forecast-infra the Storage Blob Data Owner role on rg-forecast-prod.", fr: "Attribuer aussi à app-forecast-infra le rôle Storage Blob Data Owner sur rg-forecast-prod." } }
        - { id: b, text: { en: "Replace the Contributor assignment with Owner on the subscription of rg-forecast-prod.", fr: "Remplacer l'attribution Contributor par Owner sur l'abonnement de rg-forecast-prod." } }
        - { id: c, text: { en: "Replace the Contributor assignment with Role Based Access Control Administrator on rg-forecast-prod.", fr: "Remplacer l'attribution Contributor par Role Based Access Control Administrator sur rg-forecast-prod." } }
        - { id: d, text: { en: "Also assign app-forecast-infra the Role Based Access Control Administrator role on rg-forecast-prod.", fr: "Attribuer aussi à app-forecast-infra le rôle Role Based Access Control Administrator sur rg-forecast-prod." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Contributor can create the workspace, storage and compute, but its NotActions exclude `Microsoft.Authorization/*/Write`, so it can't create role assignments. Adding Role Based Access Control Administrator on the same resource group grants `roleAssignments/write` and `delete` without broader rights, and the storage account created by the file is inside that scope.
        fr: |
          Contributor peut créer l'espace de travail, le stockage et le calcul, mais ses NotActions excluent `Microsoft.Authorization/*/Write` : il ne peut donc pas créer d'attributions de rôles. Ajouter Role Based Access Control Administrator sur le même groupe de ressources accorde `roleAssignments/write` et `delete` sans droits plus larges, et le compte de stockage créé par le fichier se trouve dans cette étendue.
      options:
        a: { en: "Storage Blob Data Owner grants access to blob data, not the right to write Azure role assignments.", fr: "Storage Blob Data Owner donne accès aux données blob, pas le droit d'écrire des attributions de rôles Azure." }
        b: { en: "Owner on the subscription works but grants full control over every resource group of the subscription, far beyond the need.", fr: "Owner sur l'abonnement fonctionne mais donne le contrôle total sur tous les groupes de ressources de l'abonnement, bien au-delà du besoin." }
        c: { en: "Without Contributor, the identity can only read resources and manage role assignments: the workspace, storage and cluster deployments would fail.", fr: "Sans Contributor, l'identité peut seulement lire les ressources et gérer les attributions de rôles : les déploiements de l'espace de travail, du stockage et du cluster échoueraient." }
    references:
      - title: Azure built-in roles for Privileged
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-13-08
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        A Bicep file deploys an Azure Machine Learning workspace with the symbolic name `workspace`. You are adding a compute for a data scientist named Ana, whose Microsoft Entra object ID is passed in the `anaObjectId` parameter. The compute must meet the following requirements:

        - It's a single-user development machine with Jupyter and a terminal, created on Ana's behalf so that only she can use it.
        - It stops after 45 minutes of inactivity.
        - Its SSH port must not be open to the public network.

        How should you complete the resource? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un fichier Bicep déploie un espace de travail Azure Machine Learning dont le nom symbolique est `workspace`. Vous ajoutez un calcul pour une scientifique des données nommée Ana, dont l'ID d'objet Microsoft Entra est transmis dans le paramètre `anaObjectId`. Le calcul doit répondre aux exigences suivantes :

        - C'est une machine de développement mono-utilisateur avec Jupyter et un terminal, créée au nom d'Ana pour qu'elle seule puisse l'utiliser.
        - Il s'arrête après 45 minutes d'inactivité.
        - Son port SSH ne doit pas être ouvert au réseau public.

        Comment devez-vous compléter la ressource ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bicep
      template: |
        resource ciAna 'Microsoft.MachineLearningServices/workspaces/computes@2026-05-01' = {
          parent: workspace
          name: 'ci-ana-01'
          location: location
          properties: {
            computeType: [[ctype]]
            properties: {
              vmSize: 'STANDARD_DS3_V2'
              idleTimeBeforeShutdown: [[idle]]
              [[settings]]: {
                assignedUser: {
                  objectId: anaObjectId
                  tenantId: subscription().tenantId
                }
              }
              sshSettings: {
                sshPublicAccess: [[ssh]]
              }
            }
          }
        }
      slots:
        - id: ctype
          options:
            - { id: aml, text: "'AmlCompute'" }
            - { id: ci, text: "'ComputeInstance'" }
            - { id: vm, text: "'VirtualMachine'" }
        - id: idle
          options:
            - { id: num, text: "'45'" }
            - { id: span, text: "'00:45:00'" }
            - { id: iso, text: "'PT45M'" }
        - id: settings
          options:
            - { id: personal, text: personalComputeInstanceSettings }
            - { id: scripts, text: setupScripts }
            - { id: authz, text: computeInstanceAuthorizationType }
        - id: ssh
          options:
            - { id: enabled, text: "'Enabled'" }
            - { id: notspec, text: "'NotSpecified'" }
            - { id: disabled, text: "'Disabled'" }
    answer:
      values: { ctype: ci, idle: iso, settings: personal, ssh: disabled }
    explanation:
      correct:
        en: |
          A single-user machine with Jupyter and a terminal is a compute instance (`'ComputeInstance'`). `idleTimeBeforeShutdown` takes an ISO 8601 duration between 15 minutes and 3 days, so 45 minutes is `'PT45M'`. `personalComputeInstanceSettings.assignedUser` creates the instance on behalf of Ana (object ID and tenant ID), and `sshPublicAccess: 'Disabled'` keeps the public SSH port closed.
        fr: |
          Une machine mono-utilisateur avec Jupyter et un terminal est une instance de calcul (`'ComputeInstance'`). `idleTimeBeforeShutdown` prend une durée ISO 8601 comprise entre 15 minutes et 3 jours : 45 minutes s'écrit donc `'PT45M'`. `personalComputeInstanceSettings.assignedUser` crée l'instance au nom d'Ana (ID d'objet et ID de locataire), et `sshPublicAccess: 'Disabled'` garde le port SSH public fermé.
      options:
        aml: { en: "'AmlCompute' is a multi-node compute cluster for jobs; it has scale settings, not an assigned user.", fr: "'AmlCompute' est un cluster de calcul multinœud pour les travaux ; il a des paramètres de mise à l'échelle, pas d'utilisateur affecté." }
        vm: { en: "'VirtualMachine' attaches an existing VM; Azure Machine Learning doesn't create it for a user.", fr: "'VirtualMachine' attache une VM existante ; Azure Machine Learning ne la crée pas pour un utilisateur." }
        num: { en: "A bare number isn't an ISO 8601 duration.", fr: "Un simple nombre n'est pas une durée ISO 8601." }
        span: { en: "'00:45:00' is a time-span notation, not the ISO 8601 duration format that the property requires.", fr: "'00:45:00' est une notation d'intervalle de temps, pas le format de durée ISO 8601 exigé par la propriété." }
        scripts: { en: "setupScripts holds creation and startup scripts, not the user the instance is assigned to.", fr: "setupScripts contient les scripts de création et de démarrage, pas l'utilisateur à qui l'instance est affectée." }
        authz: { en: "computeInstanceAuthorizationType is a string ('personal'), not an object that contains assignedUser.", fr: "computeInstanceAuthorizationType est une chaîne ('personal'), pas un objet qui contient assignedUser." }
        enabled: { en: "'Enabled' opens the public SSH port.", fr: "'Enabled' ouvre le port SSH public." }
        notspec: { en: "'NotSpecified' is a value of remoteLoginPortPublicAccess on compute clusters, not of sshPublicAccess.", fr: "'NotSpecified' est une valeur de remoteLoginPortPublicAccess sur les clusters de calcul, pas de sshPublicAccess." }
    references:
      - title: Microsoft.MachineLearningServices/workspaces/computes
        url: https://learn.microsoft.com/en-us/azure/templates/microsoft.machinelearningservices/workspaces/computes

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-13-09
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove has a GitHub repository named **woodgrove/fraud-ml**. A workflow named **deploy-prod** runs on every push to `main` and grants `permissions: id-token: write`. The GitHub environment **production** requires approval by the ML lead and holds the values of `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_SUBSCRIPTION_ID` as environment secrets.

        A Microsoft Entra application named **app-fraud-prod** has the required Azure roles and one federated identity credential with the subject `repo:woodgrove/fraud-ml:ref:refs/heads/main`. The workflow contains the following job.

        ```yaml
        jobs:
          deploy:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - uses: azure/login@v2
                with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              - run: az deployment group create -g rg-fraud-prod --template-file infra/main.bicep
        ```

        The job starts without waiting for any approval, and the sign-in step fails because the client ID is empty. You need every deployment to wait for the ML lead's approval and to sign in as app-fraud-prod. No credential that expires may be stored in GitHub.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove dispose d'un dépôt GitHub nommé **woodgrove/fraud-ml**. Un workflow nommé **deploy-prod** s'exécute à chaque push vers `main` et accorde `permissions: id-token: write`. L'environnement GitHub **production** exige l'approbation du responsable ML et contient les valeurs de `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` et `AZURE_SUBSCRIPTION_ID` comme secrets d'environnement.

        Une application Microsoft Entra nommée **app-fraud-prod** possède les rôles Azure requis et des informations d'identification fédérées avec le sujet `repo:woodgrove/fraud-ml:ref:refs/heads/main`. Le workflow contient le travail suivant.

        ```yaml
        jobs:
          deploy:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - uses: azure/login@v2
                with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              - run: az deployment group create -g rg-fraud-prod --template-file infra/main.bicep
        ```

        Le travail démarre sans attendre aucune approbation, et l'étape de connexion échoue car l'ID client est vide. Vous devez faire en sorte que chaque déploiement attende l'approbation du responsable ML et se connecte en tant qu'app-fraud-prod. Aucune information d'identification qui expire ne peut être stockée dans GitHub.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Copy the three values from the environment secrets to repository secrets.", fr: "Copier les trois valeurs des secrets d'environnement vers des secrets de dépôt." } }
        - { id: b, text: { en: "Add environment: production to the deploy job.", fr: "Ajouter environment: production au travail deploy." } }
        - { id: c, text: { en: "Change the credential subject to repo:woodgrove/fraud-ml:ref:refs/heads/*.", fr: "Remplacer le sujet des informations d'identification par repo:woodgrove/fraud-ml:ref:refs/heads/*." } }
        - { id: d, text: { en: "Add a credential with the subject repo:woodgrove/fraud-ml:environment:production.", fr: "Ajouter des informations d'identification avec le sujet repo:woodgrove/fraud-ml:environment:production." } }
        - { id: e, text: { en: "Add creds: ${{ secrets.AZURE_CREDENTIALS }} to the azure/login step.", fr: "Ajouter creds: ${{ secrets.AZURE_CREDENTIALS }} à l'étape azure/login." } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Environment secrets and protection rules apply only to a job that references the environment: `environment: production` makes the job wait for the ML lead and gives it the three values. Once the job references the environment, the GitHub token carries the subject `repo:woodgrove/fraud-ml:environment:production`, which the existing branch credential doesn't match, so app-fraud-prod needs a federated credential for the environment entity.
        fr: |
          Les secrets et les règles de protection d'un environnement ne s'appliquent qu'à un travail qui référence cet environnement : `environment: production` fait attendre le travail jusqu'à l'approbation du responsable ML et lui donne les trois valeurs. Dès que le travail référence l'environnement, le jeton GitHub porte le sujet `repo:woodgrove/fraud-ml:environment:production`, qui ne correspond pas aux informations d'identification de branche existantes : app-fraud-prod a donc besoin d'informations d'identification fédérées pour l'entité Environnement.
      options:
        a: { en: "Repository secrets would fill the client ID, but the job would still run without waiting for the required approval.", fr: "Des secrets de dépôt rempliraient l'ID client, mais le travail s'exécuterait toujours sans attendre l'approbation requise." }
        c: { en: "Federated credential subjects don't support wildcards, and a branch subject doesn't match a job that references an environment.", fr: "Les sujets des informations d'identification fédérées ne prennent pas en charge les caractères génériques, et un sujet de branche ne correspond pas à un travail qui référence un environnement." }
        e: { en: "creds signs in with a service principal secret stored in GitHub, which expires and must be rotated.", fr: "creds se connecte avec un secret de principal de service stocké dans GitHub, qui expire et doit être renouvelé." }
    references:
      - title: Authenticate to Azure from GitHub Actions by OpenID Connect
        url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
      - title: Create a trust relationship between an app and an external identity provider
        url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-13-10
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind is writing a Bicep file for an Azure Machine Learning workspace named **mlw-nw-prod**. Training jobs on a compute cluster named **cpu-cluster** must query an on-premises SQL Server that is reachable only from a virtual network named **vnet-ml** over ExpressRoute. vnet-ml has a subnet named **snet-training** for compute and a subnet named **snet-pe** for private endpoints.

        The workspace, its storage account and its container registry are reachable only through private endpoints in snet-pe. Environment images must still be built. The cluster nodes must not have public IP addresses.

        How should you complete the file? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind rédige un fichier Bicep pour un espace de travail Azure Machine Learning nommé **mlw-nw-prod**. Les travaux d'entraînement d'un cluster de calcul nommé **cpu-cluster** doivent interroger un serveur SQL Server local joignable seulement depuis un réseau virtuel nommé **vnet-ml** par ExpressRoute. vnet-ml a un sous-réseau nommé **snet-training** pour le calcul et un sous-réseau nommé **snet-pe** pour les points de terminaison privés.

        L'espace de travail, son compte de stockage et son registre de conteneurs ne sont joignables que par des points de terminaison privés dans snet-pe. Les images d'environnement doivent toujours pouvoir être construites. Les nœuds du cluster ne doivent pas avoir d'adresses IP publiques.

        Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bicep
      template: |
        resource workspace 'Microsoft.MachineLearningServices/workspaces@2026-05-01' = {
          name: 'mlw-nw-prod'
          location: location
          identity: {
            type: 'SystemAssigned'
          }
          properties: {
            storageAccount: storageAccountId
            keyVault: keyVaultId
            applicationInsights: appInsightsId
            containerRegistry: containerRegistryId
            publicNetworkAccess: 'Disabled'
            [[build]]: 'cpu-cluster'
            managedNetwork: {
              isolationMode: [[iso]]
            }
          }
        }

        resource cluster 'Microsoft.MachineLearningServices/workspaces/computes@2026-05-01' = {
          parent: workspace
          name: 'cpu-cluster'
          location: location
          properties: {
            computeType: 'AmlCompute'
            properties: {
              vmSize: 'STANDARD_DS3_V2'
              enableNodePublicIp: false
              subnet: {
                id: [[subnet]]
              }
              scaleSettings: {
                minNodeCount: 0
                maxNodeCount: 4
              }
            }
          }
        }
      slots:
        - id: build
          options:
            - { id: acr, text: containerRegistry }
            - { id: ibc, text: imageBuildCompute }
            - { id: primary, text: primaryUserAssignedIdentity }
        - id: iso
          options:
            - { id: approved, text: "'AllowOnlyApprovedOutbound'" }
            - { id: internet, text: "'AllowInternetOutbound'" }
            - { id: disabled, text: "'Disabled'" }
        - id: subnet
          options:
            - { id: vnet, text: vnetMl.id }
            - { id: training, text: snetTraining.id }
            - { id: pe, text: workspacePrivateEndpoint.id }
    answer:
      values: { build: ibc, iso: disabled, subnet: training }
    explanation:
      correct:
        en: |
          The cluster must sit in snet-training of vnet-ml to reach the on-premises server, and compute in a managed virtual network can't be placed in your own virtual network: the isolation mode must stay `'Disabled'`. The AmlCompute `subnet` property takes the resource ID of a subnet. Because the storage account and the container registry are behind private endpoints, the default serverless image build doesn't work, so `imageBuildCompute` names a CPU compute cluster in the virtual network to build the images.
        fr: |
          Le cluster doit se trouver dans snet-training de vnet-ml pour atteindre le serveur local, et le calcul d'un réseau virtuel managé ne peut pas être placé dans votre propre réseau virtuel : le mode d'isolation doit rester `'Disabled'`. La propriété `subnet` d'AmlCompute prend l'ID de ressource d'un sous-réseau. Comme le compte de stockage et le registre de conteneurs sont derrière des points de terminaison privés, la construction d'images serverless par défaut ne fonctionne pas : `imageBuildCompute` désigne donc un cluster de calcul CPU du réseau virtuel pour construire les images.
      options:
        acr: { en: "containerRegistry takes the resource ID of the registry, already set; it doesn't choose the compute that builds images.", fr: "containerRegistry prend l'ID de ressource du registre, déjà défini ; il ne choisit pas le calcul qui construit les images." }
        primary: { en: "primaryUserAssignedIdentity designates a user-assigned workspace identity, not a compute.", fr: "primaryUserAssignedIdentity désigne une identité de l'espace de travail affectée par l'utilisateur, pas un calcul." }
        approved: { en: "With a managed virtual network, compute is created only inside the managed network, never in snet-training, so the on-premises server would be unreachable.", fr: "Avec un réseau virtuel managé, le calcul n'est créé que dans le réseau managé, jamais dans snet-training : le serveur local serait donc injoignable." }
        internet: { en: "This mode also uses a managed virtual network, which can't host compute in your own subnet.", fr: "Ce mode utilise aussi un réseau virtuel managé, qui ne peut pas héberger le calcul dans votre propre sous-réseau." }
        vnet: { en: "The property expects a subnet resource ID, not the ID of the virtual network.", fr: "La propriété attend l'ID de ressource d'un sous-réseau, pas l'ID du réseau virtuel." }
        pe: { en: "A private endpoint isn't a subnet; nodes are placed in a subnet, here snet-training.", fr: "Un point de terminaison privé n'est pas un sous-réseau ; les nœuds sont placés dans un sous-réseau, ici snet-training." }
    references:
      - title: Secure an Azure Machine Learning workspace with virtual networks
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-secure-workspace-vnet
      - title: Managed virtual network isolation
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
