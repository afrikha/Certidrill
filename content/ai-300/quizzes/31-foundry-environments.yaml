chapter: 31-foundry-environments
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Foundry resource named **foundry-cto**. The projects **proj-a**, **proj-b** and **proj-c** were created in that order. You delete proj-a, and then you create a project named **proj-d**.

        Which project is now the default project of foundry-cto?
      fr: |
        Contoso dispose d'une ressource Foundry nommée **foundry-cto**. Les projets **proj-a**, **proj-b** et **proj-c** ont été créés dans cet ordre. Vous supprimez proj-a, puis vous créez un projet nommé **proj-d**.

        Quel projet est désormais le projet par défaut de foundry-cto ?
    body:
      options:
        - { id: a, text: proj-b }
        - { id: b, text: proj-c }
        - { id: c, text: proj-d }
        - { id: d, text: { en: "None, until you set `is_default` on a project", fr: "Aucun, tant que vous ne définissez pas `is_default` sur un projet" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The first project of a Foundry resource is its default project. When the default project is deleted, the next project that you create becomes the default, so proj-d takes the role, not one of the older projects. `is_default` only identifies the default project in code.
        fr: |
          Le premier projet d'une ressource Foundry est son projet par défaut. Quand le projet par défaut est supprimé, le prochain projet que vous créez devient le projet par défaut : c'est donc proj-d qui prend ce rôle, et non l'un des projets plus anciens. `is_default` ne fait qu'identifier le projet par défaut dans le code.
      options:
        a: { en: "proj-b is the oldest remaining project, but an existing project doesn't become the default when the default project is deleted.", fr: "proj-b est le plus ancien projet restant, mais un projet existant ne devient pas le projet par défaut quand celui-ci est supprimé." }
        b: { en: "proj-c already existed before the deletion; only the next project created becomes the default.", fr: "proj-c existait déjà avant la suppression ; seul le prochain projet créé devient le projet par défaut." }
        d: { en: "`is_default` is a property that identifies the default project in code; Foundry assigns the role to the next project created.", fr: "`is_default` est une propriété qui identifie le projet par défaut dans le code ; Foundry attribue ce rôle au prochain projet créé." }
    references:
      - title: Create a project for Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-31-02
    objective: "3.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware's developers build agents in a Foundry project named **proj-hr** and have the Foundry User role on proj-hr. Litware follows Microsoft's recommended role mapping for developers in an organization that isolates its teams by project.

        Which role should the developers also have on the parent Foundry resource?
      fr: |
        Les développeurs de Litware créent des agents dans un projet Foundry nommé **proj-hr** et disposent du rôle Foundry User sur proj-hr. Litware suit le mappage de rôles recommandé par Microsoft pour les développeurs d'une organisation qui isole ses équipes par projet.

        Quel rôle les développeurs doivent-ils aussi avoir sur la ressource Foundry parente ?
    body:
      options:
        - { id: a, text: Reader }
        - { id: b, text: Foundry User }
        - { id: c, text: Contributor }
        - { id: d, text: Foundry Project Manager }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Microsoft's mapping gives developers Foundry User at the project scope and Reader at the Foundry resource scope. They can build in their own project and see the parent resource, but they get no data actions in the other projects and no management permissions.
        fr: |
          Le mappage de Microsoft attribue aux développeurs Foundry User à l'étendue du projet et Reader à l'étendue de la ressource Foundry. Ils peuvent créer dans leur propre projet et voir la ressource parente, sans obtenir d'actions de données dans les autres projets ni d'autorisations de gestion.
      options:
        b: { en: "Foundry User on the resource is inherited by every project of the resource, so the developers could build in the other teams' projects.", fr: "Foundry User sur la ressource est hérité par tous les projets de la ressource : les développeurs pourraient créer dans les projets des autres équipes." }
        c: { en: "Contributor adds management permissions such as deploying models, which developers don't need.", fr: "Contributor ajoute des autorisations de gestion, comme le déploiement de modèles, dont les développeurs n'ont pas besoin." }
        d: { en: "Foundry Project Manager is for team leads who publish agents and onboard members, not for every developer.", fr: "Foundry Project Manager est destiné aux responsables d'équipe qui publient des agents et intègrent des membres, pas à chaque développeur." }
    references:
      - title: Role-based access control for Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-31-03
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin has a Foundry resource named **foundry-tsp** with public network access disabled and a private endpoint in a virtual network named **vnet-tsp**. A partner must now call foundry-tsp over the internet from the address range 198.51.100.0/24.

        An engineer deleted the private endpoint, expecting foundry-tsp to become reachable from the internet. The partner's requests are still refused, and the applications in vnet-tsp lost access to foundry-tsp.

        You need to restore private access for vnet-tsp and allow public access from the partner's range only. What should you do?
      fr: |
        Tailspin dispose d'une ressource Foundry nommée **foundry-tsp** avec l'accès au réseau public désactivé et un point de terminaison privé dans un réseau virtuel nommé **vnet-tsp**. Un partenaire doit désormais appeler foundry-tsp sur Internet depuis la plage d'adresses 198.51.100.0/24.

        Un ingénieur a supprimé le point de terminaison privé en pensant que foundry-tsp deviendrait accessible depuis Internet. Les requêtes du partenaire sont toujours refusées, et les applications de vnet-tsp ont perdu l'accès à foundry-tsp.

        Vous devez rétablir l'accès privé pour vnet-tsp et autoriser l'accès public depuis la seule plage du partenaire. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Re-create the private endpoint, and set public network access to All networks for the partner.", fr: "Recréer le point de terminaison privé, puis définir l'accès au réseau public sur Tous les réseaux pour le partenaire." } }
        - { id: b, text: { en: "Re-create the private endpoint, and add a virtual network rule that contains 198.51.100.0/24.", fr: "Recréer le point de terminaison privé, puis ajouter une règle de réseau virtuel qui contient 198.51.100.0/24." } }
        - { id: c, text: { en: "Re-create the private endpoint, and allow trusted Azure services to reach foundry-tsp.", fr: "Recréer le point de terminaison privé, puis autoriser les services Azure approuvés à accéder à foundry-tsp." } }
        - { id: d, text: { en: "Re-create the private endpoint, and allow selected networks with an IP rule for 198.51.100.0/24.", fr: "Recréer le point de terminaison privé, puis autoriser les réseaux sélectionnés avec une règle IP pour 198.51.100.0/24." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Removing private endpoints doesn't make a Foundry resource public: it only removes access from that virtual network. Public access is a separate setting, and enabling it from selected networks with an IP rule admits only the partner's range. Enabling public access doesn't remove the private endpoint, so both paths work together.
        fr: |
          Supprimer les points de terminaison privés ne rend pas une ressource Foundry publique : cela retire seulement l'accès depuis ce réseau virtuel. L'accès public est un paramètre distinct, et l'activer depuis des réseaux sélectionnés avec une règle IP n'admet que la plage du partenaire. Activer l'accès public ne supprime pas le point de terminaison privé : les deux chemins fonctionnent ensemble.
      options:
        a: { en: "All networks opens the public endpoint to every address on the internet, not only to the partner's range.", fr: "Tous les réseaux ouvre le point de terminaison public à toutes les adresses d'Internet, pas seulement à la plage du partenaire." }
        b: { en: "Virtual network rules reference subnets of Azure virtual networks; a public range of the internet is allowed with an IP rule.", fr: "Les règles de réseau virtuel référencent des sous-réseaux de réseaux virtuels Azure ; une plage publique d'Internet s'autorise avec une règle IP." }
        c: { en: "The trusted services exception admits specific Azure services that authenticate with their managed identity, not an external partner.", fr: "L'exception des services approuvés admet des services Azure précis qui s'authentifient avec leur identité managée, pas un partenaire externe." }
    references:
      - title: How to configure network isolation for Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-31-04
    objective: "3.1.4"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum has a Foundry resource named **foundry-adt** in the resource group **rg-ai**. You write an Azure CLI command that creates a project named **claims** on foundry-adt. The project must use an existing user-assigned managed identity whose resource ID is stored in `UAMI_ID`, and it must also have a system-assigned managed identity.

        How should you complete the command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'une ressource Foundry nommée **foundry-adt** dans le groupe de ressources **rg-ai**. Vous écrivez une commande Azure CLI qui crée un projet nommé **claims** sur foundry-adt. Le projet doit utiliser une identité managée affectée par l'utilisateur existante dont l'ID de ressource est stocké dans `UAMI_ID`, et il doit aussi disposer d'une identité managée affectée par le système.

        Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az cognitiveservices account project create \
          [[res]] foundry-adt \
          --resource-group rg-ai --location eastus2 \
          [[proj]] claims \
          [[uami]] "$UAMI_ID" \
          [[sys]]
      slots:
        - id: res
          options:
            - { id: name, text: "--name" }
            - { id: pname, text: "--project-name" }
            - { id: dname, text: "--display-name" }
        - id: proj
          options:
            - { id: name, text: "--name" }
            - { id: pname, text: "--project-name" }
            - { id: dname, text: "--display-name" }
        - id: uami
          options:
            - { id: ua, text: "--user-assigned-identity" }
            - { id: assignee, text: "--assignee-object-id" }
            - { id: assign, text: "--assign-identity" }
        - id: sys
          options:
            - { id: assign, text: "--assign-identity" }
            - { id: apm, text: "--allow-project-management" }
            - { id: domain, text: "--custom-domain" }
    answer:
      values: { res: name, proj: pname, uami: ua, sys: assign }
    explanation:
      correct:
        en: |
          In the `az cognitiveservices account` commands, `--name` is always the Foundry resource and `--project-name` is the project. `--user-assigned-identity` takes the resource ID of the user-assigned identity, and `--assign-identity`, used with it, also generates a system-assigned identity for the project.
        fr: |
          Dans les commandes `az cognitiveservices account`, `--name` désigne toujours la ressource Foundry et `--project-name` le projet. `--user-assigned-identity` prend l'ID de ressource de l'identité affectée par l'utilisateur, et `--assign-identity`, utilisé avec lui, génère aussi une identité affectée par le système pour le projet.
      options:
        res: { en: "`--display-name` is only the friendly name of the project; the Foundry resource is passed with `--name`.", fr: "`--display-name` n'est que le nom convivial du projet ; la ressource Foundry se passe avec `--name`." }
        uami: { en: "`--assignee-object-id` belongs to `az role assignment create`; `--assign-identity` doesn't take a resource ID.", fr: "`--assignee-object-id` appartient à `az role assignment create` ; `--assign-identity` ne prend pas d'ID de ressource." }
        sys: { en: "`--allow-project-management` and `--custom-domain` are parameters of `az cognitiveservices account create`, set on the Foundry resource.", fr: "`--allow-project-management` et `--custom-domain` sont des paramètres de `az cognitiveservices account create`, définis sur la ressource Foundry." }
    references:
      - title: az cognitiveservices account project
        url: https://learn.microsoft.com/en-us/cli/azure/cognitiveservices/account/project

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-31-05
    objective: "3.1.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware has a Foundry resource named **foundry-pw**. The project **proj-main** was created first, and the project **proj-ops** was created later. The operations team builds its applications in proj-ops by using the OpenAI SDK.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'une ressource Foundry nommée **foundry-pw**. Le projet **proj-main** a été créé en premier, puis le projet **proj-ops**. L'équipe d'exploitation crée ses applications dans proj-ops à l'aide du SDK OpenAI.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: The applications in proj-ops can call the Responses API.
            fr: Les applications de proj-ops peuvent appeler l'API Responses.
        - id: s2
          text:
            en: The operations team can submit OpenAI Batch jobs from proj-ops.
            fr: L'équipe d'exploitation peut soumettre des travaux OpenAI Batch depuis proj-ops.
        - id: s3
          text:
            en: The applications in proj-ops can use stored completions in proj-ops.
            fr: Les applications de proj-ops peuvent utiliser les complétions stockées dans proj-ops.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          proj-main, the first project, is the default project of foundry-pw. Only the default project supports OpenAI Batch, fine-tuning and stored completions; the other projects support the Responses, Files and Conversations APIs of the OpenAI SDK, as well as agents, evaluations and model inference.
        fr: |
          proj-main, le premier projet, est le projet par défaut de foundry-pw. Seul le projet par défaut prend en charge OpenAI Batch, le réglage précis (fine-tuning) et les complétions stockées ; les autres projets prennent en charge les API Responses, Files et Conversations du SDK OpenAI, ainsi que les agents, les évaluations et l'inférence de modèles.
    references:
      - title: Create a project for Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-31-06
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has a Foundry resource named **foundry-wg** in the resource group **rg-ai**. foundry-wg contains the projects **proj-qa**, **proj-risk** and **proj-sales**. An engineer named Megan has the Owner role on rg-ai and deployed foundry-wg and its projects by using Bicep.

        Megan receives an authorization error when she runs an evaluation in proj-qa. She must be able to build agents and run evaluations in proj-qa only. Her existing role assignments must not change, and the solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Woodgrove dispose d'une ressource Foundry nommée **foundry-wg** dans le groupe de ressources **rg-ai**. foundry-wg contient les projets **proj-qa**, **proj-risk** et **proj-sales**. Une ingénieure nommée Megan dispose du rôle Owner sur rg-ai et a déployé foundry-wg et ses projets à l'aide de Bicep.

        Megan reçoit une erreur d'autorisation quand elle exécute une évaluation dans proj-qa. Elle doit pouvoir créer des agents et exécuter des évaluations dans proj-qa uniquement. Ses attributions de rôle existantes ne doivent pas changer, et la solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign Megan the Foundry Owner role at the foundry-wg scope.", fr: "Attribuer à Megan le rôle Foundry Owner à l'étendue de foundry-wg." } }
        - { id: b, text: { en: "Assign Megan the Azure AI Developer role at the proj-qa scope.", fr: "Attribuer à Megan le rôle Azure AI Developer à l'étendue de proj-qa." } }
        - { id: c, text: { en: "Assign Megan the Foundry User role at the proj-qa scope.", fr: "Attribuer à Megan le rôle Foundry User à l'étendue de proj-qa." } }
        - { id: d, text: { en: "Assign Megan the Foundry Account Owner role at the proj-qa scope.", fr: "Attribuer à Megan le rôle Foundry Account Owner à l'étendue de proj-qa." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Owner and Contributor manage resources but have no data actions, so they can't build agents or run evaluations. Foundry User grants the project's data actions, and assigning it at the proj-qa scope limits them to that project. Because Megan deployed the resource with Bicep, Foundry User wasn't assigned to her automatically, as it would have been in the portals.
        fr: |
          Owner et Contributor gèrent les ressources mais n'ont pas d'actions de données : ils ne peuvent ni créer des agents ni exécuter des évaluations. Foundry User accorde les actions de données du projet, et l'attribuer à l'étendue de proj-qa les limite à ce projet. Comme Megan a déployé la ressource avec Bicep, Foundry User ne lui a pas été attribué automatiquement, comme cela aurait été le cas dans les portails.
      options:
        a: { en: "Foundry Owner includes the data actions, but at the resource scope they reach proj-risk and proj-sales too, and the role is highly privileged.", fr: "Foundry Owner inclut les actions de données, mais à l'étendue de la ressource elles s'étendent aussi à proj-risk et proj-sales, et le rôle est très privilégié." }
        b: { en: "Azure AI Developer applies to Azure Machine Learning workspaces and hubs, not to Foundry projects.", fr: "Azure AI Developer s'applique aux espaces de travail Azure Machine Learning et aux hubs, pas aux projets Foundry." }
        d: { en: "Foundry Account Owner manages resources, projects and deployments but has no data actions, like Owner.", fr: "Foundry Account Owner gère les ressources, les projets et les déploiements mais n'a pas d'actions de données, comme Owner." }
    references:
      - title: Role-based access control for Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-31-07
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind has a Foundry resource named **foundry-nw** with public network access disabled. Its private endpoint is in a virtual network named **vnet-hub**, and the private DNS zone of the endpoint is linked to vnet-hub. On-premises developers use DNS servers in the Northwind datacenter, which has no connection to Azure yet.

        The on-premises developers must reach foundry-nw through its private endpoint. Public network access must stay disabled.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose d'une ressource Foundry nommée **foundry-nw** avec l'accès au réseau public désactivé. Son point de terminaison privé se trouve dans un réseau virtuel nommé **vnet-hub**, et la zone DNS privée du point de terminaison est liée à vnet-hub. Les développeurs locaux utilisent des serveurs DNS du centre de données de Northwind, qui n'a encore aucune connexion à Azure.

        Les développeurs locaux doivent accéder à foundry-nw par son point de terminaison privé. L'accès au réseau public doit rester désactivé.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Connect the datacenter to vnet-hub by using a site-to-site VPN or an ExpressRoute circuit.", fr: "Connecter le centre de données à vnet-hub à l'aide d'un VPN site à site ou d'un circuit ExpressRoute." } }
        - { id: b, text: { en: "Configure the on-premises DNS servers to forward the Foundry queries directly to 168.63.129.16.", fr: "Configurer les serveurs DNS locaux pour transférer les requêtes Foundry directement à 168.63.129.16." } }
        - { id: c, text: { en: "Allow selected networks on foundry-nw, with an IP rule for the datacenter's public range.", fr: "Autoriser les réseaux sélectionnés sur foundry-nw, avec une règle IP pour la plage publique du centre de données." } }
        - { id: d, text: { en: "Configure the on-premises DNS servers to forward the Foundry queries to a DNS forwarder in vnet-hub.", fr: "Configurer les serveurs DNS locaux pour transférer les requêtes Foundry à un redirecteur DNS dans vnet-hub." } }
        - { id: e, text: { en: "Allow trusted Azure services on foundry-nw, so that the gateway can forward on-premises traffic.", fr: "Autoriser les services Azure approuvés sur foundry-nw, afin que la passerelle puisse transférer le trafic local." } }
      choose: 2
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          On-premises clients reach a private endpoint only over a private connection to the virtual network, such as a VPN gateway or ExpressRoute. They must also resolve the Foundry host name to the private IP address: DNS queries for private endpoints must come from the virtual network linked to the private DNS zone, so the on-premises servers forward them to a DNS forwarder (or Azure DNS Private Resolver) in vnet-hub, which uses Azure DNS.
        fr: |
          Les clients locaux n'atteignent un point de terminaison privé que par une connexion privée au réseau virtuel, comme une passerelle VPN ou ExpressRoute. Ils doivent aussi résoudre le nom d'hôte Foundry en adresse IP privée : les requêtes DNS des points de terminaison privés doivent provenir du réseau virtuel lié à la zone DNS privée. Les serveurs locaux les transfèrent donc à un redirecteur DNS (ou à Azure DNS Private Resolver) dans vnet-hub, qui utilise Azure DNS.
      options:
        b: { en: "168.63.129.16 is the Azure-provided DNS used from inside a virtual network; on-premises queries must go through a forwarder or resolver in the linked virtual network.", fr: "168.63.129.16 est le DNS fourni par Azure, utilisé depuis l'intérieur d'un réseau virtuel ; les requêtes locales doivent passer par un redirecteur ou un résolveur dans le réseau virtuel lié." }
        c: { en: "An IP rule opens the public endpoint, which breaks the requirement that public network access stays disabled.", fr: "Une règle IP ouvre le point de terminaison public, ce qui enfreint l'exigence que l'accès au réseau public reste désactivé." }
        e: { en: "The trusted services exception admits Azure services that authenticate with their managed identity; it doesn't carry on-premises traffic.", fr: "L'exception des services approuvés admet des services Azure qui s'authentifient avec leur identité managée ; elle ne transporte pas le trafic local." }
    references:
      - title: How to configure network isolation for Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
      - title: Azure Private Endpoint DNS Integration Scenarios
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-31-08
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Fabrikam deployed a Foundry resource named **foundry-fab** with a standard agent setup, a private endpoint and virtual network injection into a delegated subnet. Private endpoints were created for the storage account, the Azure Cosmos DB account and the Foundry IQ (Azure AI Search) service of the setup. The security team must document how the traffic of each agent tool flows.

        How does the traffic of each tool flow? To answer, drag the appropriate traffic paths to the correct tools. Each traffic path may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam a déployé une ressource Foundry nommée **foundry-fab** avec une configuration d'agent standard, un point de terminaison privé et l'injection de réseau virtuel dans un sous-réseau délégué. Des points de terminaison privés ont été créés pour le compte de stockage, le compte Azure Cosmos DB et le service Foundry IQ (Azure AI Search) de la configuration. L'équipe de sécurité doit documenter le flux de trafic de chaque outil d'agent.

        Comment le trafic de chaque outil circule-t-il ? Pour répondre, faites glisser les chemins de trafic appropriés vers les outils correspondants. Chaque chemin de trafic peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: subnet, text: { en: "Through the delegated subnet of Fabrikam's virtual network", fr: "Par le sous-réseau délégué du réseau virtuel de Fabrikam" } }
        - { id: pe, text: { en: "Through a private endpoint of a setup resource", fr: "Par un point de terminaison privé d'une ressource de la configuration" } }
        - { id: backbone, text: { en: "Over the Microsoft backbone network", fr: "Par le réseau principal de Microsoft" } }
        - { id: public, text: { en: "Through a public endpoint", fr: "Par un point de terminaison public" } }
        - { id: none, text: { en: "Not supported with network injection", fr: "Non pris en charge avec l'injection de réseau" } }
      targets:
        - { id: t1, text: { en: "An OpenAPI tool that calls an internal API hosted in a peered virtual network", fr: "Un outil OpenAPI qui appelle une API interne hébergée dans un réseau virtuel connecté par peering" } }
        - { id: t2, text: { en: "File search over the vector stores of the standard setup", fr: "La recherche de fichiers dans les magasins de vecteurs de la configuration standard" } }
        - { id: t3, text: { en: "Code interpreter that runs Python code on uploaded data", fr: "L'interpréteur de code qui exécute du code Python sur des données chargées" } }
        - { id: t4, text: { en: "SharePoint grounding on the company intranet site", fr: "L'ancrage SharePoint sur le site intranet de l'entreprise" } }
    answer:
      mapping: { t1: subnet, t2: pe, t3: backbone, t4: public }
    explanation:
      correct:
        en: |
          With virtual network injection, tools that call your own endpoints (private MCP, OpenAPI, Azure Functions, agent-to-agent) go through your subnet, so the OpenAPI tool reaches the peered network. File search and Foundry IQ use the private endpoints of the setup resources. Code interpreter and function calling stay on the Microsoft backbone, while Bing, web search and SharePoint grounding use public endpoints.
        fr: |
          Avec l'injection de réseau virtuel, les outils qui appellent vos propres points de terminaison (MCP privé, OpenAPI, Azure Functions, agent à agent) passent par votre sous-réseau : l'outil OpenAPI atteint donc le réseau connecté par peering. La recherche de fichiers et Foundry IQ utilisent les points de terminaison privés des ressources de la configuration. L'interpréteur de code et l'appel de fonction restent sur le réseau principal de Microsoft, tandis que l'ancrage Bing, la recherche web et l'ancrage SharePoint utilisent des points de terminaison publics.
      options:
        none: { en: "Logic Apps, computer use and image generation aren't supported with network isolation; the four tools listed are.", fr: "Logic Apps, l'utilisation de l'ordinateur et la génération d'images ne sont pas pris en charge avec l'isolement réseau ; les quatre outils listés le sont." }
    references:
      - title: How to configure network isolation for Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
      - title: Network isolation for a toolbox in Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/toolbox-network-isolation

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-31-09
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso deploys one Foundry environment per stage from the same Bicep file, into the resource groups **rg-ai-dev**, **rg-ai-test** and **rg-ai-prod** of a single subscription. The pipeline runs `az deployment group create` once per resource group, with the `env` parameter set to `dev`, `test` or `prod`.

        Each stage must get its own Foundry resource. The production resource must not accept traffic from public networks, while the development and test resources must stay reachable from the internet.

        How should you complete the Bicep code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso déploie un environnement Foundry par étape à partir du même fichier Bicep, dans les groupes de ressources **rg-ai-dev**, **rg-ai-test** et **rg-ai-prod** d'un seul abonnement. Le pipeline exécute `az deployment group create` une fois par groupe de ressources, avec le paramètre `env` défini sur `dev`, `test` ou `prod`.

        Chaque étape doit disposer de sa propre ressource Foundry. La ressource de production ne doit pas accepter de trafic provenant des réseaux publics, tandis que les ressources de développement et de test doivent rester accessibles depuis Internet.

        Comment devez-vous compléter le code Bicep ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bicep
      template: |
        @allowed([ 'dev', 'test', 'prod' ])
        param env string
        param location string = resourceGroup().location

        var foundryName = [[nm]]

        resource foundry 'Microsoft.CognitiveServices/accounts@2026-05-01' = {
          name: foundryName
          location: location
          kind: 'AIServices'
          sku: { name: 'S0' }
          identity: { type: 'SystemAssigned' }
          properties: {
            allowProjectManagement: true
            customSubDomainName: [[sub]]
            disableLocalAuth: true
            publicNetworkAccess: [[pna]]
          }
        }
      slots:
        - id: nm
          options:
            - { id: envname, text: "'contoso-ai-${env}'" }
            - { id: fixed, text: "'contoso-ai'" }
            - { id: upper, text: "'Contoso_AI_${env}'" }
        - id: sub
          options:
            - { id: var, text: "foundryName" }
            - { id: unique, text: "uniqueString(subscription().subscriptionId)" }
            - { id: fixed, text: "'contoso-ai'" }
        - id: pna
          options:
            - { id: prod, text: "env == 'prod' ? 'Disabled' : 'Enabled'" }
            - { id: rev, text: "env == 'prod' ? 'Enabled' : 'Disabled'" }
            - { id: off, text: "'Disabled'" }
    answer:
      values: { nm: envname, sub: var, pna: prod }
    explanation:
      correct:
        en: |
          A Foundry resource name must be globally unique and use only lowercase letters, digits and hyphens, so the name includes the stage: `contoso-ai-dev`, `contoso-ai-test`, `contoso-ai-prod`. The custom subdomain, used for Microsoft Entra authentication and the `services.ai.azure.com` endpoint, must also be unique, and reusing the stage-specific name guarantees it. Only production gets `publicNetworkAccess: 'Disabled'`.
        fr: |
          Le nom d'une ressource Foundry doit être unique au niveau mondial et n'utiliser que des lettres minuscules, des chiffres et des traits d'union : le nom inclut donc l'étape (`contoso-ai-dev`, `contoso-ai-test`, `contoso-ai-prod`). Le sous-domaine personnalisé, utilisé pour l'authentification Microsoft Entra et le point de terminaison `services.ai.azure.com`, doit lui aussi être unique, et reprendre le nom propre à l'étape le garantit. Seule la production reçoit `publicNetworkAccess: 'Disabled'`.
      options:
        nm: { en: "A fixed name collides from the second stage onward; uppercase letters and underscores aren't allowed in the name.", fr: "Un nom fixe entre en conflit dès la deuxième étape ; les majuscules et les traits de soulignement ne sont pas autorisés dans le nom." }
        sub: { en: "`uniqueString(subscription().subscriptionId)` is a deterministic hash: it returns the same value for the three deployments, which share the subscription, so the second deployment fails like with a fixed subdomain.", fr: "`uniqueString(subscription().subscriptionId)` est un hachage déterministe : il renvoie la même valeur pour les trois déploiements, qui partagent l'abonnement, et le deuxième déploiement échoue, comme avec un sous-domaine fixe." }
        pna: { en: "The reversed condition opens production and closes development and test; `'Disabled'` everywhere blocks the internet access that dev and test need.", fr: "La condition inversée ouvre la production et ferme le développement et le test ; `'Disabled'` partout bloque l'accès Internet dont le développement et le test ont besoin." }
    references:
      - title: "Quickstart: Deploy a Foundry resource by using Bicep"
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-resource-template
      - title: Bicep functions - string
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/bicep-functions-string

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-31-10
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has a Foundry resource named **foundry-lw** with a standard agent setup. A project named **proj-claims** will be created with capability settings that reference a dedicated Azure Cosmos DB account. The project's managed identity needs data-plane roles on the setup resources before its agents run.

        Litware's security team grants data-plane roles only after a review that takes two weeks. Next quarter, proj-claims must move to a new Azure Cosmos DB account, which already exists. The agents must work again as soon as the move is done, without waiting for a new review.

        What should you do?
      fr: |
        Litware dispose d'une ressource Foundry nommée **foundry-lw** avec une configuration d'agent standard. Un projet nommé **proj-claims** sera créé avec des paramètres de capacité qui référencent un compte Azure Cosmos DB dédié. L'identité managée du projet a besoin de rôles de plan de données sur les ressources de la configuration avant l'exécution de ses agents.

        L'équipe de sécurité de Litware n'accorde des rôles de plan de données qu'après une revue qui dure deux semaines. Le trimestre prochain, proj-claims devra passer à un nouveau compte Azure Cosmos DB, qui existe déjà. Les agents doivent refonctionner dès que le changement est fait, sans attendre une nouvelle revue.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create proj-claims with a system-assigned identity now, and update its capability settings next quarter.", fr: "Créer proj-claims avec une identité affectée par le système maintenant, puis mettre à jour ses paramètres de capacité le trimestre prochain." } }
        - { id: b, text: { en: "Create proj-claims with a system-assigned identity now, and recreate it with the same name next quarter.", fr: "Créer proj-claims avec une identité affectée par le système maintenant, puis le recréer avec le même nom le trimestre prochain." } }
        - { id: c, text: { en: "Create proj-claims now, and change the default capability settings of foundry-lw next quarter.", fr: "Créer proj-claims maintenant, puis modifier les paramètres de capacité par défaut de foundry-lw le trimestre prochain." } }
        - { id: d, text: { en: "Create proj-claims with a user-assigned identity reviewed for both accounts, and recreate it next quarter.", fr: "Créer proj-claims avec une identité affectée par l'utilisateur validée pour les deux comptes, puis le recréer le trimestre prochain." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Capability settings can only be set when a project is created, so moving to another Cosmos DB account means deleting and recreating proj-claims. A user-assigned identity has its own lifecycle: the security team can review its roles on both accounts in advance, and the recreated project references the same identity with `--user-assigned-identity`, so its agents work at once.
        fr: |
          Les paramètres de capacité ne peuvent être définis qu'à la création d'un projet : passer à un autre compte Cosmos DB implique donc de supprimer puis de recréer proj-claims. Une identité affectée par l'utilisateur a son propre cycle de vie : l'équipe de sécurité peut valider à l'avance ses rôles sur les deux comptes, et le projet recréé référence la même identité avec `--user-assigned-identity`, si bien que ses agents fonctionnent immédiatement.
      options:
        a: { en: "The capability settings of an existing project can't be updated; the project must be deleted and recreated.", fr: "Les paramètres de capacité d'un projet existant ne peuvent pas être mis à jour ; le projet doit être supprimé puis recréé." }
        b: { en: "A system-assigned identity is deleted with the project; the recreated project gets a new identity that needs a new two-week review.", fr: "Une identité affectée par le système est supprimée avec le projet ; le projet recréé obtient une nouvelle identité qui exige une nouvelle revue de deux semaines." }
        c: { en: "Changing the defaults of the Foundry resource doesn't update existing projects, and proj-claims overrides them anyway.", fr: "Modifier les valeurs par défaut de la ressource Foundry ne met pas à jour les projets existants, et proj-claims les remplace de toute façon." }
    references:
      - title: Set up private networking for Foundry Agent Service
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
      - title: What is managed identities for Azure resources?
        url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
