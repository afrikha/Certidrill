chapter: 52-fine-tuning
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-52-01
    objective: "5.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam wants a smaller model to reach the answer quality of a larger model on one task, at lower cost and latency. The team uses Managed Training in Microsoft Foundry.

        How does Managed Training support this distillation?
      fr: |
        Fabrikam veut qu'un modèle plus petit atteigne la qualité de réponse d'un modèle plus grand sur une tâche, à moindre coût et latence. L'équipe utilise le Managed Training dans Microsoft Foundry.

        Comment le Managed Training prend-il en charge cette distillation ?
    body:
      options:
        - { id: a, text: { en: "Through direct preference optimization of the smaller model, with the larger model's responses as the rejected outputs", fr: "Par une optimisation directe des préférences du petit modèle, avec les réponses du grand modèle comme sorties rejetées" } }
        - { id: b, text: { en: "Through reinforcement fine-tuning of the larger model, with the smaller model's responses scored by a grader", fr: "Par un réglage précis par renforcement du grand modèle, avec les réponses du petit modèle notées par un évaluateur" } }
        - { id: c, text: { en: "Through supervised fine-tuning of the smaller model, with training data generated by the larger model", fr: "Par un réglage précis supervisé du petit modèle, avec des données d'entraînement générées par le grand modèle" } }
        - { id: d, text: { en: "Through a copy of the larger model's weights into the smaller model, with no additional training data", fr: "Par une copie des poids du grand modèle dans le petit modèle, sans données d'entraînement supplémentaires" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Managed Training supports distillation through teacher-generated SFT data: the larger model (the teacher) generates responses for representative prompts, and the smaller model is trained on them with supervised fine-tuning. Teacher-generated examples help the smaller model meet the task requirements at lower cost and latency.
        fr: |
          Le Managed Training prend en charge la distillation par des données SFT générées par un enseignant : le grand modèle (l'enseignant) génère des réponses pour des invites représentatives, et le petit modèle est entraîné sur ces réponses par réglage précis supervisé. Les exemples générés par l'enseignant aident le petit modèle à satisfaire les exigences de la tâche à moindre coût et latence.
      options:
        a: { en: "DPO learns from preferred and rejected responses; marking the teacher's responses as rejected would push the student away from them.", fr: "DPO apprend de réponses préférées et rejetées ; marquer les réponses de l'enseignant comme rejetées éloignerait l'élève de ces réponses." }
        b: { en: "Training the larger model doesn't make the smaller model cheaper or better; distillation trains the smaller model.", fr: "Entraîner le grand modèle ne rend pas le petit modèle moins cher ni meilleur ; la distillation entraîne le petit modèle." }
        d: { en: "Models of different sizes don't share a weight structure, and distillation always trains the student on teacher-generated examples.", fr: "Des modèles de tailles différentes ne partagent pas une structure de poids, et la distillation entraîne toujours l'élève sur des exemples générés par l'enseignant." }
    references:
      - title: Training in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-52-02
    objective: "5.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso's finance team reviews the fine-tuning charges of a Microsoft Foundry project.

        Which of the following is billed?
      fr: |
        L'équipe financière de Contoso examine les frais de réglage précis d'un projet Microsoft Foundry.

        Lequel des éléments suivants est facturé ?
    body:
      options:
        - { id: a, text: { en: "The time that a job waits in the queue before training starts", fr: "Le temps qu'un travail attend dans la file avant le début de l'entraînement" } }
        - { id: b, text: { en: "The data safety checks that run on the uploaded training data", fr: "Les vérifications de sécurité des données exécutées sur les données d'entraînement chargées" } }
        - { id: c, text: { en: "The training work that a job completed before a user canceled it", fr: "Le travail d'entraînement qu'un travail a effectué avant qu'un utilisateur l'annule" } }
        - { id: d, text: { en: "The training work that a job lost when it failed because of a service error", fr: "Le travail d'entraînement qu'un travail a perdu en échouant à cause d'une erreur du service" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A job that a user cancels after training has begun is charged for the work completed up to the cancellation. Only jobs canceled before training begins are free.
        fr: |
          Un travail qu'un utilisateur annule après le début de l'entraînement est facturé pour le travail effectué jusqu'à l'annulation. Seuls les travaux annulés avant le début de l'entraînement sont gratuits.
      options:
        a: { en: "Time spent in the queue isn't charged.", fr: "Le temps passé dans la file d'attente n'est pas facturé." }
        b: { en: "Data safety checks aren't charged.", fr: "Les vérifications de sécurité des données ne sont pas facturées." }
        d: { en: "Failed jobs aren't charged, and work lost because of a service error isn't billed.", fr: "Les travaux en échec ne sont pas facturés, et le travail perdu à cause d'une erreur du service n'est pas facturé." }
    references:
      - title: Manage fine-tuning costs in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-cost-management

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-52-03
    objective: "5.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum distills gpt-4.1 into gpt-4.1-nano for its returns assistant. A script sends prompts to a gpt-4.1 deployment and saves 3,000 generated conversations as the supervised fine-tuning data. After training, the nano model gives nearly identical answers to many different return questions, and it handles product exchanges poorly. A review shows that many generated conversations are near-duplicates and that almost none cover exchanges.

        You need to improve the next fine-tuned model. What should you do?
      fr: |
        Adatum distille gpt-4.1 dans gpt-4.1-nano pour son assistant de retours. Un script envoie des invites à un déploiement gpt-4.1 et enregistre 3 000 conversations générées comme données de réglage précis supervisé. Après l'entraînement, le modèle nano donne des réponses presque identiques à de nombreuses questions de retour différentes, et il gère mal les échanges de produits. Une revue montre que beaucoup de conversations générées sont des quasi-doublons et que presque aucune ne couvre les échanges.

        Vous devez améliorer le prochain modèle ajusté. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Copy the few exchange conversations many times in the training file, and retrain with the same settings.", fr: "Copier plusieurs fois les rares conversations d'échange dans le fichier d'entraînement, puis réentraîner avec les mêmes paramètres." } }
        - { id: b, text: { en: "Remove the near-duplicates, and generate conversations for exchange scenarios before you retrain.", fr: "Supprimer les quasi-doublons, et générer des conversations pour les scénarios d'échange avant de réentraîner." } }
        - { id: c, text: { en: "Run a DPO job on the same conversations, with the generated responses as the preferred outputs.", fr: "Exécuter un travail DPO sur les mêmes conversations, avec les réponses générées comme sorties préférées." } }
        - { id: d, text: { en: "Retrain on the same conversations with a higher `learning_rate_multiplier` and more epochs.", fr: "Réentraîner sur les mêmes conversations avec un `learning_rate_multiplier` plus élevé et plus d'époques." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Training data must be accurate, consistent and representative: before you upload it, inspect it for missing scenarios, duplicates, bias and sensitive information. Removing the near-duplicates and generating conversations for the missing exchange scenarios fixes the data that caused both symptoms.
        fr: |
          Les données d'entraînement doivent être exactes, cohérentes et représentatives : avant de les charger, vérifiez les scénarios manquants, les doublons, les biais et les informations sensibles. Supprimer les quasi-doublons et générer des conversations pour les scénarios d'échange manquants corrige les données à l'origine des deux symptômes.
      options:
        a: { en: "Copies add more duplicates instead of varied exchange scenarios, so the model would overfit them.", fr: "Des copies ajoutent des doublons au lieu de scénarios d'échange variés : le modèle y serait surajusté." }
        c: { en: "DPO needs a preferred and a rejected response for each input, and it wouldn't fix the gaps in the data either.", fr: "DPO exige une réponse préférée et une réponse rejetée pour chaque entrée, et il ne comblerait pas non plus les lacunes des données." }
        d: { en: "A higher learning rate and more epochs don't add the missing scenarios; they make the model fit the duplicates more closely, which increases overfitting.", fr: "Un taux d'apprentissage plus élevé et plus d'époques n'ajoutent pas les scénarios manquants ; ils font coller le modèle aux doublons, ce qui accroît le surajustement." }
    references:
      - title: Training in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-52-04
    objective: "5.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank's Microsoft Foundry resource is in Sweden Central. The bank plans a supervised fine-tuning job of gpt-4.1-mini on customer emails. Compliance requires that the training data and the resulting weights never leave the resource's region. The job must finish before a fixed deadline.

        Which training type should you use?
      fr: |
        La ressource Microsoft Foundry de Woodgrove Bank se trouve dans la région Sweden Central. La banque prévoit un travail de réglage précis supervisé de gpt-4.1-mini sur des e-mails de clients. La conformité exige que les données d'entraînement et les poids obtenus ne quittent jamais la région de la ressource. Le travail doit se terminer avant une échéance fixe.

        Quel type d'entraînement devez-vous utiliser ?
    body:
      options:
        - { id: a, text: Global }
        - { id: b, text: Data zone }
        - { id: c, text: Developer }
        - { id: d, text: Standard }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Standard training runs in the Foundry resource's region and is the training type that guarantees data residency. It doesn't run on preemptible capacity, so it suits a job with a deadline.
        fr: |
          L'entraînement Standard s'exécute dans la région de la ressource Foundry ; c'est le type d'entraînement qui garantit la résidence des données. Il ne s'exécute pas sur de la capacité préemptible : il convient donc à un travail soumis à une échéance.
      options:
        a: { en: "Global training is cheaper, but data and weights are copied to the region where training occurs, with no residency guarantee.", fr: "L'entraînement Global est moins cher, mais les données et les poids sont copiés dans la région où l'entraînement a lieu, sans garantie de résidence." }
        b: { en: "Data zone training keeps data within a data zone, not within a region, and only the US data zone is currently supported.", fr: "L'entraînement Data zone garde les données dans une zone de données, pas dans une région, et seule la zone de données US est actuellement prise en charge." }
        c: { en: "Developer training gives no residency guarantee, and its jobs can be preempted and resumed later, which puts the deadline at risk.", fr: "L'entraînement Developer ne donne aucune garantie de résidence, et ses travaux peuvent être préemptés puis repris plus tard, ce qui met l'échéance en danger." }
    references:
      - title: Training in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-52-05
    objective: "5.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A data scientist at Litware holds the Foundry User role and has completed a supervised fine-tuning job in a Microsoft Foundry project. When she selects **Deploy** in the job's details, the deployment fails with an authorization error. The project has enough deployment quota.

        You need to allow her to deploy the fine-tuned model. The solution must follow the principle of least privilege.

        Which role should you assign to her?
      fr: |
        Une data scientist de Litware détient le rôle Foundry User et a terminé un travail de réglage précis supervisé dans un projet Microsoft Foundry. Quand elle sélectionne **Deploy** dans les détails du travail, le déploiement échoue avec une erreur d'autorisation. Le projet dispose d'un quota de déploiement suffisant.

        Vous devez lui permettre de déployer le modèle ajusté. La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous lui attribuer ?
    body:
      options:
        - { id: a, text: { en: "Foundry User on the subscription", fr: "Foundry User sur l'abonnement" } }
        - { id: b, text: { en: "Foundry Owner on the Foundry resource", fr: "Foundry Owner sur la ressource Foundry" } }
        - { id: c, text: { en: "Cognitive Services OpenAI User on the Foundry resource", fr: "Cognitive Services OpenAI User sur la ressource Foundry" } }
        - { id: d, text: { en: "Owner on the subscription", fr: "Owner sur l'abonnement" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Deploying a fine-tuned model requires Foundry Owner, or a role with `Microsoft.CognitiveServices/accounts/deployments/write`, on the target resource. Foundry User is enough to train, which is why the job succeeded, but not to deploy.
        fr: |
          Déployer un modèle ajusté exige Foundry Owner, ou un rôle doté de `Microsoft.CognitiveServices/accounts/deployments/write`, sur la ressource cible. Foundry User suffit pour entraîner, c'est pourquoi le travail a réussi, mais pas pour déployer.
      options:
        a: { en: "A broader scope doesn't add permissions: Foundry User still can't write deployments.", fr: "Une étendue plus large n'ajoute pas d'autorisations : Foundry User ne peut toujours pas écrire de déploiements." }
        c: { en: "Cognitive Services OpenAI User makes inference calls; it can't create deployments.", fr: "Cognitive Services OpenAI User effectue des appels d'inférence ; il ne peut pas créer de déploiements." }
        d: { en: "Owner on the subscription can deploy, but it grants far more than the deployment needs, on every resource of the subscription.", fr: "Owner sur l'abonnement peut déployer, mais il accorde bien plus que ce dont le déploiement a besoin, sur toutes les ressources de l'abonnement." }
    references:
      - title: Deploy fine-tuned models in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-deploy
      - title: Fine-tune a model with supervised fine-tuning in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-52-06
    objective: "5.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys distills gpt-4.1 into gpt-4.1-mini for a booking assistant. A gpt-4.1 deployment generated responses for 5,000 prompts written by the product team, and these synthetic conversations form the supervised fine-tuning data. The team also has 400 real customer conversations whose answers were approved by agents.

        Before you approve the fine-tuned model for production, the following requirements must be met:

        - The model must perform well on real customer requests, not only on prompts similar to the synthetic ones.
        - The team needs a reliable estimate of production quality, free of evaluation leakage.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys distille gpt-4.1 dans gpt-4.1-mini pour un assistant de réservation. Un déploiement gpt-4.1 a généré des réponses pour 5 000 invites rédigées par l'équipe produit, et ces conversations synthétiques forment les données de réglage précis supervisé. L'équipe dispose aussi de 400 conversations réelles de clients dont les réponses ont été approuvées par des agents.

        Avant d'approuver le modèle ajusté pour la production, les exigences suivantes doivent être remplies :

        - Le modèle doit donner de bons résultats sur les vraies requêtes des clients, pas seulement sur des invites proches des invites synthétiques.
        - L'équipe a besoin d'une estimation fiable de la qualité en production, exempte de fuite d'évaluation.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Keep part of the real conversations as a final test set that appears in neither the training file nor the validation file.", fr: "Garder une partie des conversations réelles comme jeu de test final, absent du fichier d'entraînement comme du fichier de validation." } }
        - { id: b, text: { en: "Put all the real conversations in the validation file, and use the final validation loss as the production estimate.", fr: "Placer toutes les conversations réelles dans le fichier de validation, et utiliser la perte de validation finale comme estimation de la production." } }
        - { id: c, text: { en: "Have gpt-4.1 answer 500 more prompts from the product team, and use these conversations as the final test set.", fr: "Faire répondre gpt-4.1 à 500 invites supplémentaires de l'équipe produit, et utiliser ces conversations comme jeu de test final." } }
        - { id: d, text: { en: "Add the real conversations that aren't held out for testing to the synthetic training data.", fr: "Ajouter aux données d'entraînement synthétiques les conversations réelles qui ne sont pas réservées au test." } }
        - { id: e, text: { en: "Train on the synthetic data only, and approve the checkpoint whose `train_loss` is the lowest.", fr: "Entraîner sur les seules données synthétiques, et approuver le point de contrôle dont la `train_loss` est la plus faible." } }
      choose: 2
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Training, validation and final test data must stay separate, and the test set must represent production: real conversations held out from every training and validation file give an estimate free of leakage. Combining the other real conversations with the teacher-generated data helps the model generalize beyond the prompts that the product team wrote.
        fr: |
          Les données d'entraînement, de validation et de test final doivent rester séparées, et le jeu de test doit représenter la production : des conversations réelles exclues de tout fichier d'entraînement et de validation donnent une estimation exempte de fuite. Combiner les autres conversations réelles avec les données générées par l'enseignant aide le modèle à généraliser au-delà des invites rédigées par l'équipe produit.
      options:
        b: { en: "Validation data guides checkpoint and hyperparameter choices during training, so it can't also serve as an independent final test, and a loss doesn't measure task quality.", fr: "Les données de validation guident le choix des points de contrôle et des hyperparamètres pendant l'entraînement : elles ne peuvent pas servir aussi de test final indépendant, et une perte ne mesure pas la qualité de la tâche." }
        c: { en: "A test set produced by the same teacher from the same kind of prompts resembles the training data, so it inflates the scores and says little about real customers.", fr: "Un jeu de test produit par le même enseignant à partir du même type d'invites ressemble aux données d'entraînement : il gonfle les scores et renseigne peu sur les vrais clients." }
        e: { en: "Without real data, the model learns only the style of the synthetic prompts, and the lowest training loss isn't proof of the best model on held-out tasks.", fr: "Sans données réelles, le modèle n'apprend que le style des invites synthétiques, et la perte d'entraînement la plus faible ne prouve pas que le modèle est le meilleur sur des tâches mises de côté." }
    references:
      - title: Training in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
      - title: Fine-tune a model with supervised fine-tuning in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-52-07
    objective: "5.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware fine-tunes o4-mini with reinforcement fine-tuning (RFT) to solve insurance pricing exercises. Each training record ends with a `user` message and contains the expected conclusion in a field named `reference_answer`. A correct response can reach the conclusion through different steps and wording, so neither an exact match nor a surface similarity metric gives a reliable reward.

        The reward must be a score from 0 to 1 that applies a written rubric to the generated response and the expected conclusion.

        How should you complete the grader definition? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware ajuste o4-mini par réglage précis par renforcement (RFT) pour résoudre des exercices de tarification d'assurance. Chaque enregistrement d'entraînement se termine par un message `user` et contient la conclusion attendue dans un champ nommé `reference_answer`. Une réponse correcte peut atteindre la conclusion par des étapes et des formulations différentes : ni une correspondance exacte ni une métrique de similarité de surface ne donnent une récompense fiable.

        La récompense doit être un score de 0 à 1 qui applique une grille écrite à la réponse générée et à la conclusion attendue.

        Comment devez-vous compléter la définition de l'évaluateur ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template: |
        {
          "name": "pricing_grader",
          "type": [[gtype]],
          "model": "gpt-4.1",
          "input": [
            {
              "role": "system",
              "content": "Score 1 if the response reaches the expected conclusion with valid reasoning, 0.5 if the conclusion is right but the reasoning has an error, 0 otherwise."
            },
            {
              "role": "user",
              "content": "Expected conclusion: [[ref]]\nResponse: [[resp]]"
            }
          ],
          "range": [0, 1]
        }
      slots:
        - id: gtype
          options:
            - { id: textsim, text: "\"text_similarity\"" }
            - { id: scoremodel, text: "\"score_model\"" }
            - { id: stringcheck, text: "\"string_check\"" }
        - id: ref
          options:
            - { id: sampleref, text: "{{sample.reference_answer}}" }
            - { id: itemref, text: "{{item.reference_answer}}" }
            - { id: itemout, text: "{{item.output_text}}" }
        - id: resp
          options:
            - { id: itemresp, text: "{{item.output_text}}" }
            - { id: samplejson, text: "{{sample.output_json.reference_answer}}" }
            - { id: sampleresp, text: "{{sample.output_text}}" }
    answer:
      values: { gtype: scoremodel, ref: itemref, resp: sampleresp }
    explanation:
      correct:
        en: |
          A `score_model` grader asks a grading model to apply the rubric in its `input` messages and returns a score within `range`, which suits answers that can be correct in several forms. `{{item.reference_answer}}` reads the field of the training record, and `{{sample.output_text}}` is the response that the model generated, as text.
        fr: |
          Un évaluateur `score_model` demande à un modèle évaluateur d'appliquer la grille de ses messages `input` et renvoie un score dans la plage `range`, ce qui convient aux réponses qui peuvent être correctes sous plusieurs formes. `{{item.reference_answer}}` lit le champ de l'enregistrement d'entraînement, et `{{sample.output_text}}` est la réponse générée par le modèle, sous forme de texte.
      options:
        textsim: { en: "`text_similarity` computes metrics such as `fuzzy_match` or `rouge_l` against a reference; it doesn't apply a rubric.", fr: "`text_similarity` calcule des métriques comme `fuzzy_match` ou `rouge_l` par rapport à une référence ; il n'applique pas de grille." }
        stringcheck: { en: "`string_check` compares strings with `eq`, `ne`, `like` or `ilike`, which the stem rules out.", fr: "`string_check` compare des chaînes avec `eq`, `ne`, `like` ou `ilike`, ce que l'énoncé exclut." }
        sampleref: { en: "`sample` holds the generated response; the expected conclusion is a field of the dataset record, read through `item`.", fr: "`sample` contient la réponse générée ; la conclusion attendue est un champ de l'enregistrement du jeu de données, lu par `item`." }
        itemresp: { en: "`item` holds the fields of the dataset record; the generated response is read through `sample`.", fr: "`item` contient les champs de l'enregistrement du jeu de données ; la réponse générée se lit par `sample`." }
    references:
      - title: Fine-tune a model with reinforcement fine-tuning in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reinforcement-fine-tuning

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-52-08
    objective: "5.2.3"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Northwind Traders fine-tunes gpt-4.1-mini with direct preference optimization (DPO) so that customer replies follow the tone that reviewers prefer. The job produced four checkpoints. You evaluate each checkpoint and the baseline (the base model with the current prompt) on 200 held-out prompts. Reviewers apply the same rubric as the one used to label the preference pairs, and you record the share of responses that meet the preferred behavior.

        The following table shows the results.

        Answer each prompt by selecting the appropriate checkpoint.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders ajuste gpt-4.1-mini par optimisation directe des préférences (DPO) pour que les réponses aux clients suivent le ton que préfèrent les relecteurs. Le travail a produit quatre points de contrôle. Vous évaluez chaque point de contrôle et la référence (le modèle de base avec l'invite actuelle) sur 200 invites mises de côté. Les relecteurs appliquent la même grille que celle qui a servi à étiqueter les paires de préférence, et vous relevez la part des réponses qui présentent le comportement préféré.

        Le tableau suivant indique les résultats.

        Répondez à chaque consigne en sélectionnant le point de contrôle approprié.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The checkpoint to deploy", fr: "Le point de contrôle à déployer" }
        - id: p2
          text: { en: "The checkpoint that doesn't justify its hosting cost compared with the baseline", fr: "Le point de contrôle qui ne justifie pas son coût d'hébergement par rapport à la référence" }
      grid:
        header: [ { en: "Model", fr: "Modèle" }, { en: "Training loss", fr: "Perte d'entraînement" }, { en: "Validation token accuracy", fr: "Précision des jetons en validation" }, { en: "Held-out preference rate", fr: "Taux de préférence (invites mises de côté)" } ]
        rows:
          - [ { text: { en: "Baseline", fr: "Référence" } }, { text: "-" }, { text: "-" }, { text: "0.61" } ]
          - [ { text: ckpt-1, area: c1 }, { text: "0.68" }, { text: "0.71" }, { text: "0.58" } ]
          - [ { text: ckpt-2, area: c2 }, { text: "0.52" }, { text: "0.74" }, { text: "0.76" } ]
          - [ { text: ckpt-3, area: c3 }, { text: "0.41" }, { text: "0.78" }, { text: "0.69" } ]
          - [ { text: ckpt-4, area: c4 }, { text: "0.33" }, { text: "0.81" }, { text: "0.64" } ]
    answer:
      values: { p1: c2, p2: c1 }
    explanation:
      correct:
        en: |
          DPO learns from preference pairs, so token-prediction accuracy and training loss don't show whether responses match the preferences: candidates must be compared on held-out preference examples with the labeling rubric. ckpt-2 has the highest preference rate (0.76), although ckpt-4 has the lowest loss and the best token accuracy. ckpt-1 (0.58) does worse than the baseline (0.61), so its hosting cost brings no benefit.
        fr: |
          DPO apprend de paires de préférence : la précision de prédiction des jetons et la perte d'entraînement ne montrent pas si les réponses correspondent aux préférences, et les candidats doivent être comparés sur des exemples de préférence mis de côté avec la grille d'étiquetage. ckpt-2 a le meilleur taux de préférence (0,76), bien que ckpt-4 ait la perte la plus faible et la meilleure précision des jetons. ckpt-1 (0,58) fait moins bien que la référence (0,61) : son coût d'hébergement n'apporte aucun bénéfice.
      options:
        c4: { en: "ckpt-4 has the lowest training loss and the best token accuracy, but these don't measure preference alignment, and its preference rate is lower than ckpt-2's.", fr: "ckpt-4 a la perte d'entraînement la plus faible et la meilleure précision des jetons, mais celles-ci ne mesurent pas l'alignement sur les préférences, et son taux de préférence est inférieur à celui de ckpt-2." }
        c3: { en: "ckpt-3 beats the baseline, but it has a lower preference rate than ckpt-2.", fr: "ckpt-3 bat la référence, mais son taux de préférence est inférieur à celui de ckpt-2." }
    references:
      - title: Fine-tune a model with direct preference optimization in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-direct-preference-optimization

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-52-09
    objective: "5.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware's Microsoft Foundry resource in Sweden Central contains the following:

        - **ft-v3**: a Standard deployment of version 3 of a fine-tuned model, which serves all production traffic.
        - **ft-v2**: a Standard deployment of version 2. Version 3 was validated last week, and ft-v2 has received no requests since then.
        - **ft-eval**: a Developer deployment created this morning, which testers use today to evaluate a candidate model.
        - **rft-v4**: a running reinforcement fine-tuning job whose `valid_reward_mean` hasn't improved for three hours. The team has decided not to use its results.

        You need to reduce the charges. Production must keep an availability SLA, the model weights must stay in the resource's geography, and the testers must finish their evaluation today.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        La ressource Microsoft Foundry de Litware dans la région Sweden Central contient les éléments suivants :

        - **ft-v3** : un déploiement Standard de la version 3 d'un modèle ajusté, qui sert tout le trafic de production.
        - **ft-v2** : un déploiement Standard de la version 2. La version 3 a été validée la semaine dernière, et ft-v2 n'a reçu aucune requête depuis.
        - **ft-eval** : un déploiement Developer créé ce matin, que des testeurs utilisent aujourd'hui pour évaluer un modèle candidat.
        - **rft-v4** : un travail de réglage précis par renforcement en cours dont la `valid_reward_mean` ne s'améliore plus depuis trois heures. L'équipe a décidé de ne pas utiliser ses résultats.

        Vous devez réduire les frais. La production doit conserver un SLA de disponibilité, les poids du modèle doivent rester dans la zone géographique de la ressource, et les testeurs doivent terminer leur évaluation aujourd'hui.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Delete the ft-eval deployment.", fr: "Supprimer le déploiement ft-eval." } }
        - { id: b, text: { en: "Replace ft-v3 with a Global Standard deployment.", fr: "Remplacer ft-v3 par un déploiement Global Standard." } }
        - { id: c, text: { en: "Cancel the rft-v4 job.", fr: "Annuler le travail rft-v4." } }
        - { id: d, text: { en: "Replace ft-v3 with a Developer deployment.", fr: "Remplacer ft-v3 par un déploiement Developer." } }
        - { id: e, text: { en: "Delete the ft-v2 deployment.", fr: "Supprimer le déploiement ft-v2." } }
      choose: 2
    answer: { optionIds: [c, e] }
    explanation:
      correct:
        en: |
          A Standard deployment of a fine-tuned model bills an hourly hosting fee as long as it exists, even without requests, so deleting ft-v2 stops a charge. An RFT job is billed for its training time, so canceling rft-v4 stops charges for an experiment that no longer improves the target metric.
        fr: |
          Un déploiement Standard d'un modèle ajusté facture des frais d'hébergement horaires tant qu'il existe, même sans requêtes : supprimer ft-v2 arrête donc des frais. Un travail RFT est facturé à son temps d'entraînement : annuler rft-v4 arrête les frais d'une expérience qui n'améliore plus la métrique cible.
      options:
        a: { en: "A Developer deployment has no hourly hosting fee, so deleting it saves nothing, and the testers need it today.", fr: "Un déploiement Developer n'a pas de frais d'hébergement horaires : le supprimer n'économise rien, et les testeurs en ont besoin aujourd'hui." }
        b: { en: "With Global Standard, the custom model weights might temporarily be stored outside the resource's geography.", fr: "Avec Global Standard, les poids du modèle personnalisé peuvent être stockés temporairement hors de la zone géographique de la ressource." }
        d: { en: "A Developer deployment is for evaluation only: it has no availability SLA and is removed after 24 hours.", fr: "Un déploiement Developer est réservé à l'évaluation : il n'a pas de SLA de disponibilité et il est supprimé après 24 heures." }
    references:
      - title: Manage fine-tuning costs in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-cost-management
      - title: Training in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-52-10
    objective: "5.2.3"
    difficulty: 3
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Wingtip Toys runs reinforcement fine-tuning (RFT) jobs of o4-mini with Managed Training and a `score_model` grader. Assume a training rate of 100 USD per hour.

        - Job 1 trained for 1 hour, and then failed because of a service error.
        - Job 2 waited 2 hours in the queue and trained for 3 hours. It then reached the per-job spending limit, paused and created a checkpoint. The team reviewed the metrics, resumed the job 10 hours later, and the job trained for 1.25 more hours and completed.
        - The grader model's inference tokens of job 2 cost 7.20 USD.

        What is the total charge for the two jobs?
      fr: |
        Wingtip Toys exécute des travaux de réglage précis par renforcement (RFT) de o4-mini avec le Managed Training et un évaluateur `score_model`. Supposez un tarif d'entraînement de 100 USD par heure.

        - Le travail 1 s'est entraîné pendant 1 heure, puis a échoué à cause d'une erreur du service.
        - Le travail 2 a attendu 2 heures dans la file et s'est entraîné pendant 3 heures. Il a alors atteint la limite de dépense par travail, s'est mis en pause et a créé un point de contrôle. L'équipe a examiné les métriques, a repris le travail 10 heures plus tard, et le travail s'est entraîné 1,25 heure de plus puis s'est terminé.
        - Les jetons d'inférence du modèle évaluateur du travail 2 ont coûté 7,20 USD.

        Quel est le coût total des deux travaux ?
    body:
      options:
        - { id: a, text: { en: "425.00 USD", fr: "425,00 USD" } }
        - { id: b, text: { en: "432.20 USD", fr: "432,20 USD" } }
        - { id: c, text: { en: "532.20 USD", fr: "532,20 USD" } }
        - { id: d, text: { en: "632.20 USD", fr: "632,20 USD" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          RFT is billed for training time multiplied by the hourly rate, plus the grader's inference tokens when a model grader is used. Job 2 trained 3 + 1.25 = 4.25 hours, which costs 425 USD, plus 7.20 USD of grader tokens: 432.20 USD. The failed job, the time in the queue and the pause aren't billed, and resuming after the spending limit continues billing without another cost-based limit.
        fr: |
          Le RFT est facturé au temps d'entraînement multiplié par le tarif horaire, plus les jetons d'inférence de l'évaluateur quand un modèle évaluateur est utilisé. Le travail 2 s'est entraîné 3 + 1,25 = 4,25 heures, soit 425 USD, plus 7,20 USD de jetons de l'évaluateur : 432,20 USD. Le travail en échec, le temps passé dans la file et la pause ne sont pas facturés, et la reprise après la limite de dépense poursuit la facturation sans nouvelle limite basée sur le coût.
      options:
        a: { en: "This total omits the grader's inference tokens, which are billed in addition to the training hours with a `score_model` grader.", fr: "Ce total omet les jetons d'inférence de l'évaluateur, facturés en plus des heures d'entraînement avec un évaluateur `score_model`." }
        c: { en: "This total also bills the hour of job 1, but failed jobs and work lost because of a service error aren't charged.", fr: "Ce total facture aussi l'heure du travail 1, mais les travaux en échec et le travail perdu à cause d'une erreur du service ne sont pas facturés." }
        d: { en: "This total also bills the 2 hours in the queue, but time spent in the queue isn't charged.", fr: "Ce total facture aussi les 2 heures dans la file, mais le temps passé dans la file n'est pas facturé." }
    references:
      - title: Manage fine-tuning costs in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-cost-management
