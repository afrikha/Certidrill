chapter: 51-rag-optimization
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-51-01
    objective: "5.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso adds a Text Split skill to the skillset of an Azure AI Search index used by a RAG assistant. The skill uses `textSplitMode` set to `pages` and measures lengths in characters. You want to start from the chunking parameters that Microsoft recommends for most applications.

        Which values should you set?
      fr: |
        Contoso ajoute une compétence Text Split à l'ensemble de compétences d'un index Azure AI Search utilisé par un assistant RAG. La compétence utilise `textSplitMode` défini sur `pages` et mesure les longueurs en caractères. Vous voulez partir des paramètres de segmentation que Microsoft recommande pour la plupart des applications.

        Quelles valeurs devez-vous définir ?
    body:
      options:
        - { id: a, text: { en: "`maximumPageLength` 2000 and `pageOverlapLength` 1000", fr: "`maximumPageLength` 2000 et `pageOverlapLength` 1000" } }
        - { id: b, text: { en: "`maximumPageLength` 2000 and `pageOverlapLength` 500", fr: "`maximumPageLength` 2000 et `pageOverlapLength` 500" } }
        - { id: c, text: { en: "`maximumPageLength` 5000 and `pageOverlapLength` 0", fr: "`maximumPageLength` 5000 et `pageOverlapLength` 0" } }
        - { id: d, text: { en: "`maximumPageLength` 512 and `pageOverlapLength` 128", fr: "`maximumPageLength` 512 et `pageOverlapLength` 128" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          For character-based chunking, Microsoft recommends starting with pages of 2,000 characters and an overlap of 500 characters. This matches the general starting point of 512 tokens (about 2,000 characters) with a 25 % overlap. You then adjust the values based on evaluation results.
        fr: |
          Pour une segmentation en caractères, Microsoft recommande de commencer avec des pages de 2 000 caractères et un chevauchement de 500 caractères. Cela correspond au point de départ général de 512 jetons (environ 2 000 caractères) avec 25 % de chevauchement. Vous ajustez ensuite les valeurs d'après les résultats d'évaluation.
      options:
        a: { en: "The overlap must be less than half of the maximum page length: 1000 is exactly half of 2000, so the value isn't valid.", fr: "Le chevauchement doit être inférieur à la moitié de la longueur de page maximale : 1000 est exactement la moitié de 2000, la valeur n'est donc pas valide." }
        c: { en: "5000 is the default maximum page length of the skill, not the recommended starting point, and 0 means that successive chunks share no text.", fr: "5000 est la longueur de page maximale par défaut de la compétence, pas le point de départ recommandé, et 0 signifie que les blocs successifs ne partagent aucun texte." }
        d: { en: "512 and 128 are the recommended values in tokens. Measured in characters, they produce chunks about four times smaller than recommended.", fr: "512 et 128 sont les valeurs recommandées en jetons. Mesurées en caractères, elles produisent des blocs environ quatre fois plus petits que recommandé." }
    references:
      - title: Chunk Documents - Foundry IQ (Azure AI Search)
        url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents
      - title: Text Split Skill - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-textsplit

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-51-02
    objective: "5.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam evaluates the search step of a RAG application in a Microsoft Foundry project with the Document Retrieval evaluator. The results show a high value for the `holes` metric.

        What does this value indicate?
      fr: |
        Fabrikam évalue l'étape de recherche d'une application RAG dans un projet Microsoft Foundry avec l'évaluateur Document Retrieval. Les résultats indiquent une valeur élevée pour la métrique `holes`.

        Qu'indique cette valeur ?
    body:
      options:
        - { id: a, text: { en: "Many documents labeled as relevant for the query are never retrieved, so the search returns too few of the known good documents.", fr: "Beaucoup de documents étiquetés comme pertinents pour la requête ne sont jamais récupérés : la recherche renvoie trop peu des bons documents connus." } }
        - { id: b, text: { en: "Many responses contain claims that the retrieved documents don't support, so the generation step adds content of its own.", fr: "Beaucoup de réponses contiennent des affirmations que les documents récupérés n'étayent pas : l'étape de génération ajoute son propre contenu." } }
        - { id: c, text: { en: "Many retrieved documents have no relevance label for the query, so the labels must be completed before the other metrics can be trusted.", fr: "Beaucoup de documents récupérés n'ont pas d'étiquette de pertinence pour la requête : il faut compléter les étiquettes avant de se fier aux autres métriques." } }
        - { id: d, text: { en: "Many relevant documents are ranked below irrelevant ones, so the order of the results is far from the ideal order.", fr: "Beaucoup de documents pertinents sont classés sous des documents non pertinents : l'ordre des résultats est loin de l'ordre idéal." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `holes` counts the retrieved documents that have no query relevance judgment in the ground truth. Metrics such as NDCG are computed from these labels, so a high number of holes means the ground truth must be completed before you compare search configurations.
        fr: |
          `holes` compte les documents récupérés qui n'ont pas de jugement de pertinence pour la requête dans la vérité terrain. Des métriques comme NDCG sont calculées à partir de ces étiquettes : un nombre élevé de holes signifie qu'il faut compléter la vérité terrain avant de comparer des configurations de recherche.
      options:
        a: { en: "This describes a low Fidelity: the share of known good documents that the search returns.", fr: "Cela décrit une Fidelity faible : la part des bons documents connus que la recherche renvoie." }
        b: { en: "This describes a low groundedness, measured by the Groundedness evaluator on the response and its context, not by Document Retrieval.", fr: "Cela décrit un ancrage faible, mesuré par l'évaluateur Groundedness sur la réponse et son contexte, pas par Document Retrieval." }
        d: { en: "This describes a low NDCG, which compares the ranking with an ideal order where all relevant items come first.", fr: "Cela décrit un NDCG faible, qui compare le classement à un ordre idéal où tous les éléments pertinents arrivent en premier." }
    references:
      - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-51-03
    objective: "5.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware's Azure AI Search skillset contains an Azure OpenAI Embedding skill that calls a `text-embedding-3-large` deployment in a Microsoft Foundry resource. The skill definition sets neither `apiKey` nor `authIdentity`. When the indexer runs, the skill fails with authorization errors.

        You need to fix the errors. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        L'ensemble de compétences Azure AI Search de Litware contient une compétence Azure OpenAI Embedding qui appelle un déploiement `text-embedding-3-large` dans une ressource Microsoft Foundry. La définition de la compétence ne définit ni `apiKey` ni `authIdentity`. Quand l'indexeur s'exécute, la compétence échoue avec des erreurs d'autorisation.

        Vous devez corriger les erreurs. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign Cognitive Services OpenAI Contributor on the Foundry resource to the system-assigned identity of the search service.", fr: "Attribuer Cognitive Services OpenAI Contributor sur la ressource Foundry à l'identité affectée par le système du service de recherche." } }
        - { id: b, text: { en: "Assign Cognitive Services Contributor on the Foundry resource to the system-assigned identity of the search service.", fr: "Attribuer Cognitive Services Contributor sur la ressource Foundry à l'identité affectée par le système du service de recherche." } }
        - { id: c, text: { en: "Assign Search Index Data Contributor on the search service to the system-assigned identity of the Foundry resource.", fr: "Attribuer Search Index Data Contributor sur le service de recherche à l'identité affectée par le système de la ressource Foundry." } }
        - { id: d, text: { en: "Assign Cognitive Services OpenAI User on the Foundry resource to the system-assigned identity of the search service.", fr: "Attribuer Cognitive Services OpenAI User sur la ressource Foundry à l'identité affectée par le système du service de recherche." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          When `apiKey` and `authIdentity` are both empty, the skill connects with the system-assigned managed identity of the search service. That identity needs Cognitive Services OpenAI User on the target resource, which is the only role the skill requires: it allows inference calls, such as embeddings, with Microsoft Entra ID.
        fr: |
          Quand `apiKey` et `authIdentity` sont vides, la compétence se connecte avec l'identité managée affectée par le système du service de recherche. Cette identité a besoin de Cognitive Services OpenAI User sur la ressource cible, le seul rôle que la compétence exige : il permet les appels d'inférence, comme les incorporations, avec Microsoft Entra ID.
      options:
        a: { en: "Cognitive Services OpenAI Contributor also allows inference, but it adds deployment and fine-tuning permissions that the skill doesn't need.", fr: "Cognitive Services OpenAI Contributor permet aussi l'inférence, mais il ajoute des autorisations de déploiement et de réglage précis dont la compétence n'a pas besoin." }
        b: { en: "Cognitive Services Contributor manages the resource and its deployments, but it can't make inference API calls with Microsoft Entra ID.", fr: "Cognitive Services Contributor gère la ressource et ses déploiements, mais il ne peut pas effectuer d'appels d'API d'inférence avec Microsoft Entra ID." }
        c: { en: "The search service calls the model, not the other way around: the Foundry identity doesn't need access to the index.", fr: "C'est le service de recherche qui appelle le modèle, pas l'inverse : l'identité de Foundry n'a pas besoin d'accéder à l'index." }
    references:
      - title: Azure OpenAI Embedding Skill - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-azure-openai-embedding
      - title: Role-based access control for Azure OpenAI (classic) - Microsoft Foundry (classic) portal
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/role-based-access-control

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-51-04
    objective: "5.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank's RAG assistant answers employee questions from an index of long policy passages written as formal statements. Each question is clear, covers a single topic, contains the right keywords and needs no additional context. Retrieval tests show that the vectors of the short questions often lie far from the vectors of the passages that contain the answers. The pipeline already calls a language model.

        You need to improve vector retrieval for these questions. Which query translation technique should you implement?
      fr: |
        L'assistant RAG de Woodgrove Bank répond aux questions des employés à partir d'un index de longs passages de règlement rédigés sous forme d'énoncés formels. Chaque question est claire, porte sur un seul sujet, contient les bons mots clés et ne nécessite aucun contexte supplémentaire. Des tests de récupération montrent que les vecteurs des questions courtes sont souvent éloignés des vecteurs des passages qui contiennent les réponses. Le pipeline appelle déjà un modèle de langage.

        Vous devez améliorer la récupération vectorielle pour ces questions. Quelle technique de traduction de requête devez-vous implémenter ?
    body:
      options:
        - { id: a, text: { en: "Rewrite each question to remove unnecessary words and add the keywords it misses.", fr: "Réécrire chaque question pour supprimer les mots superflus et ajouter les mots clés manquants." } }
        - { id: b, text: { en: "Decompose each question into subqueries, and run every subquery separately.", fr: "Décomposer chaque question en sous-requêtes, puis exécuter chaque sous-requête séparément." } }
        - { id: c, text: { en: "Generate a hypothetical response to each question, and search with its embedding.", fr: "Générer une réponse hypothétique à chaque question, puis rechercher avec son incorporation." } }
        - { id: d, text: { en: "Augment each question with extra context, without changing its intent.", fr: "Augmenter chaque question avec du contexte supplémentaire, sans changer son intention." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Hypothetical Document Embeddings (HyDE) uses a language model to generate an answer to the query, embeds that answer and searches with it. The search becomes an answer-to-answer similarity search, which suits passages phrased very differently from the questions.
        fr: |
          Hypothetical Document Embeddings (HyDE) utilise un modèle de langage pour générer une réponse à la requête, incorpore cette réponse et recherche avec elle. La recherche devient une recherche de similarité de réponse à réponse, adaptée aux passages formulés très différemment des questions.
      options:
        a: { en: "Query rewriting fixes vagueness, missing keywords and unnecessary words; the questions are already clear and contain the right keywords.", fr: "La réécriture de requête corrige l'imprécision, les mots clés manquants et les mots superflus ; les questions sont déjà claires et contiennent les bons mots clés." }
        b: { en: "Decomposition targets complex questions that need several searches; each question covers a single topic.", fr: "La décomposition vise les questions complexes qui nécessitent plusieurs recherches ; chaque question porte sur un seul sujet." }
        d: { en: "Augmentation adds context to small or vague queries; the questions need no additional context.", fr: "L'augmentation ajoute du contexte aux requêtes courtes ou vagues ; les questions ne nécessitent aucun contexte supplémentaire." }
    references:
      - title: Develop a RAG Solution on Azure - Information-Retrieval Phase - Azure Architecture Center
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-information-retrieval

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-51-05
    objective: "5.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware's Azure AI Search index **docs-idx** was loaded by an indexer whose skillset embeds the chunks with a `text-embedding-3-large` deployment. The index defines no vectorizer. A new version of the RAG assistant sends hybrid queries whose vector query has `kind` set to `text` and contains the question as a string. These queries fail.

        You need the queries to succeed without changing the assistant's code and without degrading vector search.

        What should you do?
      fr: |
        L'index Azure AI Search **docs-idx** de Proseware a été chargé par un indexeur dont l'ensemble de compétences incorpore les blocs avec un déploiement `text-embedding-3-large`. L'index ne définit aucun vectoriseur. Une nouvelle version de l'assistant RAG envoie des requêtes hybrides dont la requête vectorielle a `kind` défini sur `text` et contient la question sous forme de chaîne. Ces requêtes échouent.

        Vous devez faire en sorte que les requêtes réussissent sans modifier le code de l'assistant et sans dégrader la recherche vectorielle.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Update docs-idx to add a vectorizer that calls a `text-embedding-3-small` deployment, and assign it to the vector field through its profile.", fr: "Mettre à jour docs-idx pour ajouter un vectoriseur qui appelle un déploiement `text-embedding-3-small`, puis l'affecter au champ vectoriel par son profil." } }
        - { id: b, text: { en: "Update docs-idx to add a vectorizer that calls a `text-embedding-3-large` deployment, and assign it to the vector field through its profile.", fr: "Mettre à jour docs-idx pour ajouter un vectoriseur qui appelle un déploiement `text-embedding-3-large`, puis l'affecter au champ vectoriel par son profil." } }
        - { id: c, text: { en: "Update docs-idx to add a semantic configuration that lists the content field, so that the question text can be ranked.", fr: "Mettre à jour docs-idx pour ajouter une configuration sémantique qui liste le champ de contenu, afin que le texte de la question puisse être classé." } }
        - { id: d, text: { en: "Update the vector profile of docs-idx to use an `exhaustiveKnn` algorithm, so that the question is compared with every vector.", fr: "Mettre à jour le profil vectoriel de docs-idx pour utiliser un algorithme `exhaustiveKnn`, afin que la question soit comparée à chaque vecteur." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A vector query of kind `text` requires a vectorizer assigned to the vector field through a vector profile; the vectorizer converts the string into a vector at query time. The skill and the vectorizer must use the same embedding model, so the vectorizer must call `text-embedding-3-large`. You can add the vectorizer by updating the existing index.
        fr: |
          Une requête vectorielle de type `text` exige un vectoriseur affecté au champ vectoriel par un profil vectoriel ; le vectoriseur convertit la chaîne en vecteur au moment de la requête. La compétence et le vectoriseur doivent utiliser le même modèle d'incorporation : le vectoriseur doit donc appeler `text-embedding-3-large`. Vous pouvez ajouter le vectoriseur en mettant à jour l'index existant.
      options:
        a: { en: "Queries embedded by another model than the indexed chunks don't share their vector space, so vector matches become meaningless.", fr: "Des requêtes incorporées par un autre modèle que les blocs indexés ne partagent pas leur espace vectoriel : les correspondances vectorielles perdent leur sens." }
        c: { en: "A semantic configuration enables reranking of the results; it doesn't convert the string of a vector query into a vector.", fr: "Une configuration sémantique permet le reclassement des résultats ; elle ne convertit pas la chaîne d'une requête vectorielle en vecteur." }
        d: { en: "Exhaustive KNN changes how vectors are compared, but the query still has no vector to compare without a vectorizer.", fr: "Le KNN exhaustif change la façon de comparer les vecteurs, mais la requête n'a toujours aucun vecteur à comparer sans vectoriseur." }
    references:
      - title: Configure Vectorizer - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-configure-vectorizer
      - title: Create a Vector Query - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-51-06
    objective: "5.1.4"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Adatum compares four retrieval configurations of a RAG assistant in a Microsoft Foundry project. Each configuration runs against the same test dataset, which contains human relevance labels for the documents of each query. The Document Retrieval evaluator scores the search results, and the Groundedness evaluator scores the generated responses on a 1 to 5 scale. The following table shows the average results.

        Answer each prompt by selecting the appropriate configuration.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum compare quatre configurations de récupération d'un assistant RAG dans un projet Microsoft Foundry. Chaque configuration s'exécute sur le même jeu de données de test, qui contient des étiquettes de pertinence humaines pour les documents de chaque requête. L'évaluateur Document Retrieval note les résultats de recherche, et l'évaluateur Groundedness note les réponses générées sur une échelle de 1 à 5. Le tableau suivant indique les résultats moyens.

        Répondez à chaque consigne en sélectionnant la configuration appropriée.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The configuration that ranks its top results well but returns few of the known good documents", fr: "La configuration qui classe bien ses premiers résultats mais renvoie peu des bons documents connus" }
        - id: p2
          text: { en: "The configuration whose quality problem comes from the generation step rather than from retrieval", fr: "La configuration dont le problème de qualité vient de l'étape de génération plutôt que de la récupération" }
      grid:
        header: [ { en: Configuration, fr: Configuration }, "ndcg@3", "fidelity", { en: "Groundedness (1 to 5)", fr: "Groundedness (1 à 5)" } ]
        rows:
          - [ { text: cfg-hybrid-512, area: c1 }, { text: "0.91" }, { text: "0.88" }, { text: "4.6" } ]
          - [ { text: cfg-vector-k5, area: c2 }, { text: "0.89" }, { text: "0.19" }, { text: "4.4" } ]
          - [ { text: cfg-hybrid-top20, area: c3 }, { text: "0.88" }, { text: "0.86" }, { text: "1.9" } ]
          - [ { text: cfg-keyword-256, area: c4 }, { text: "0.31" }, { text: "0.28" }, { text: "2.0" } ]
    answer:
      values: { p1: c2, p2: c3 }
    explanation:
      correct:
        en: |
          NDCG measures how close the ranking is to the ideal order, and Fidelity is the share of the known good documents that the search returns: cfg-vector-k5 ranks its few results well (0.89) but finds only 19 % of the good documents. cfg-hybrid-top20 retrieves and ranks well (0.88 and 0.86) but its responses aren't supported by the context (1.9), so the prompt, the model or the amount of context must be fixed. cfg-keyword-256 also has low groundedness, but its retrieval scores are low too, so the problem starts with retrieval.
        fr: |
          NDCG mesure à quel point le classement est proche de l'ordre idéal, et Fidelity est la part des bons documents connus que la recherche renvoie : cfg-vector-k5 classe bien ses quelques résultats (0,89) mais ne trouve que 19 % des bons documents. cfg-hybrid-top20 récupère et classe bien (0,88 et 0,86), mais ses réponses ne sont pas étayées par le contexte (1,9) : il faut corriger l'invite, le modèle ou la quantité de contexte. cfg-keyword-256 a aussi un ancrage faible, mais ses scores de récupération sont faibles eux aussi : le problème commence à la récupération.
      options:
        c1: { en: "cfg-hybrid-512 scores well on ranking, Fidelity and groundedness: it has no problem to diagnose.", fr: "cfg-hybrid-512 obtient de bons scores de classement, de Fidelity et d'ancrage : il n'a aucun problème à diagnostiquer." }
        c4: { en: "cfg-keyword-256 has low NDCG and Fidelity: its low groundedness follows from poor retrieval.", fr: "cfg-keyword-256 a un NDCG et une Fidelity faibles : son ancrage faible découle d'une mauvaise récupération." }
    references:
      - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-51-07
    objective: "5.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has an Azure AI Search index named **kb-prod**. A built-in blob indexer loads kb-prod through a skillset that contains a Text Split skill and an Azure OpenAI Embedding skill that uses `text-embedding-ada-002`. The vector field of kb-prod has 1,536 dimensions, and its vectorizer calls a `text-embedding-ada-002` deployment.

        Contoso plans to replace the embedding model with `text-embedding-3-small`, with its default number of dimensions. You follow the embedding model migration guidance for Azure AI Search.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un index Azure AI Search nommé **kb-prod**. Un indexeur de blobs intégré charge kb-prod par un ensemble de compétences qui contient une compétence Text Split et une compétence Azure OpenAI Embedding qui utilise `text-embedding-ada-002`. Le champ vectoriel de kb-prod a 1 536 dimensions, et son vectoriseur appelle un déploiement `text-embedding-ada-002`.

        Contoso prévoit de remplacer le modèle d'incorporation par `text-embedding-3-small`, avec son nombre de dimensions par défaut. Vous suivez les recommandations de migration des modèles d'incorporation pour Azure AI Search.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Because both models return 1,536-dimension vectors, you can point the vectorizer of kb-prod to a `text-embedding-3-small` deployment and keep the existing document vectors until they are re-embedded.", fr: "Comme les deux modèles renvoient des vecteurs de 1 536 dimensions, vous pouvez faire pointer le vectoriseur de kb-prod vers un déploiement `text-embedding-3-small` et conserver les vecteurs de documents existants jusqu'à leur réincorporation." }
        - id: s2
          text: { en: "Because kb-prod is loaded by a built-in indexer, you should build a separate index from the source data with its own skillset and indexer, rather than add a second vector field to kb-prod.", fr: "Comme kb-prod est chargé par un indexeur intégré, vous devez construire un index distinct à partir des données sources avec son propre ensemble de compétences et son propre indexeur, plutôt qu'ajouter un second champ vectoriel à kb-prod." }
        - id: s3
          text: { en: "To decide whether to switch, you can compare the average `@search.score` that each model's index returns for the same test queries.", fr: "Pour décider du basculement, vous pouvez comparer le `@search.score` moyen que l'index de chaque modèle renvoie pour les mêmes requêtes de test." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          s1: equal dimensions don't make two models compatible, and changing a vectorizer doesn't regenerate the indexed vectors: queries embedded by the new model would be compared with ada-002 vectors. s2: the guidance requires a separate index rebuilt from the source data for built-in indexer pipelines; the second-field approach is for push ingestion only. s3: raw vector scores aren't comparable across models; compare relevance on judged queries instead.
        fr: |
          s1 : des dimensions égales ne rendent pas deux modèles compatibles, et changer un vectoriseur ne régénère pas les vecteurs indexés : des requêtes incorporées par le nouveau modèle seraient comparées à des vecteurs ada-002. s2 : les recommandations exigent un index distinct reconstruit à partir des données sources pour les pipelines d'indexeur intégré ; l'approche du second champ est réservée à l'ingestion par envoi (push). s3 : les scores vectoriels bruts ne sont pas comparables d'un modèle à l'autre ; comparez plutôt la pertinence sur des requêtes jugées.
    references:
      - title: Embedding model migration best practices guide in Foundry IQ (Azure AI Search)
        url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-migrate-embedding-models

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-51-08
    objective: "5.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders has an Azure AI Search index named **parts-idx** with a semantic configuration named **parts-semantic**. The vector field `descVector` has no vectorizer: the RAG assistant computes each query embedding with the same model that embedded the chunks. Questions often contain part numbers such as NW-88213-B.

        Tests with labeled queries lead to the following requirements:

        - in the fused ranking, the keyword results must count twice as much as the vector results;
        - the chat model must receive exactly five chunks, selected by semantic ranking from the fused results.

        How should you complete the request? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un index Azure AI Search nommé **parts-idx** avec une configuration sémantique nommée **parts-semantic**. Le champ vectoriel `descVector` n'a pas de vectoriseur : l'assistant RAG calcule chaque incorporation de requête avec le même modèle que celui qui a incorporé les blocs. Les questions contiennent souvent des références de pièces comme NW-88213-B.

        Des tests avec des requêtes étiquetées aboutissent aux exigences suivantes :

        - dans le classement fusionné, les résultats par mots clés doivent compter deux fois plus que les résultats vectoriels ;
        - le modèle de conversation doit recevoir exactement cinq blocs, sélectionnés par le classement sémantique parmi les résultats fusionnés.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template: |
        POST https://srch-northwind.search.windows.net/indexes/parts-idx/docs/search?api-version=2026-04-01
        {
          "search": "torque value for bracket NW-88213-B",
          "vectorQueries": [
            {
              "kind": "vector",
              "vector": [ 0.0213, -0.0087, ..., 0.0142 ],
              "fields": "descVector",
              "k": 50,
              "weight": [[w]]
            }
          ],
          "queryType": [[qt]],
          "semanticConfiguration": "parts-semantic",
          "select": "partNumber, title, chunk",
          "top": [[top]]
        }
      slots:
        - id: w
          options:
            - { id: w05, text: "0.5" }
            - { id: w10, text: "1.0" }
            - { id: w20, text: "2.0" }
        - id: qt
          options:
            - { id: simple, text: "\"simple\"" }
            - { id: full, text: "\"full\"" }
            - { id: semantic, text: "\"semantic\"" }
        - id: top
          options:
            - { id: t5, text: "5" }
            - { id: t10, text: "10" }
            - { id: t50, text: "50" }
    answer:
      values: { w: w05, qt: semantic, top: t5 }
    explanation:
      correct:
        en: |
          `weight` applies to vector queries only and multiplies their contribution to the RRF score, while the text query keeps its implicit weight of 1.0: a weight of 0.5 makes the keyword results count twice as much. Semantic ranking requires `queryType` set to `semantic` with a semantic configuration. With current API versions, the semantic ranker reranks up to 50 fused results whatever the `top` value, and `top` then limits the response to the five best reranked chunks.
        fr: |
          `weight` s'applique uniquement aux requêtes vectorielles et multiplie leur contribution au score RRF, tandis que la requête texte garde son poids implicite de 1.0 : un poids de 0.5 fait compter les résultats par mots clés deux fois plus. Le classement sémantique exige `queryType` défini sur `semantic` avec une configuration sémantique. Avec les versions actuelles de l'API, le classeur sémantique reclasse jusqu'à 50 résultats fusionnés quelle que soit la valeur de `top`, et `top` limite ensuite la réponse aux cinq meilleurs blocs reclassés.
      options:
        w20: { en: "A weight of 2.0 doubles the influence of the vector results, the opposite of the requirement.", fr: "Un poids de 2.0 double l'influence des résultats vectoriels, l'inverse de l'exigence." }
        w10: { en: "1.0 is the default: keyword and vector results would count equally.", fr: "1.0 est la valeur par défaut : les résultats par mots clés et vectoriels compteraient autant." }
        full: { en: "`full` selects the Lucene query syntax; it doesn't invoke the semantic ranker.", fr: "`full` sélectionne la syntaxe de requête Lucene ; il n'appelle pas le classeur sémantique." }
        t50: { en: "Setting `top` to 50 was needed for keyword-only queries in older API versions; here it would send 50 chunks to the chat model.", fr: "Définir `top` sur 50 était nécessaire pour les requêtes par mots clés seuls dans les anciennes versions de l'API ; ici, cela enverrait 50 blocs au modèle de conversation." }
    references:
      - title: Create a Vector Query - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
      - title: Create a Hybrid Query - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-51-09
    objective: "5.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys has a RAG assistant for its HR policies. The skillset of the Azure AI Search index uses a Text Split skill with `textSplitMode` set to `pages`, `maximumPageLength` set to 2000 characters and `pageOverlapLength` set to 0. The chunk size must not change, because of the context budget of the chat model.

        Reviewers report two problems:

        - answers miss conditions that start at the end of one chunk and continue at the start of the next one;
        - questions such as "What are the parental leave rules in France and in Germany, and which country offers more days?" are answered for one country only.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un assistant RAG pour ses règles RH. L'ensemble de compétences de l'index Azure AI Search utilise une compétence Text Split avec `textSplitMode` défini sur `pages`, `maximumPageLength` défini sur 2000 caractères et `pageOverlapLength` défini sur 0. La taille des blocs ne doit pas changer, en raison du budget de contexte du modèle de conversation.

        Des relecteurs signalent deux problèmes :

        - les réponses omettent des conditions qui commencent à la fin d'un bloc et se poursuivent au début du suivant ;
        - les questions comme « Quelles sont les règles du congé parental en France et en Allemagne, et quel pays offre le plus de jours ? » n'obtiennent une réponse que pour un seul pays.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Set `pageOverlapLength` to 1200, and then reset and rerun the indexer.", fr: "Définir `pageOverlapLength` sur 1200, puis réinitialiser et réexécuter l'indexeur." } }
        - { id: b, text: { en: "Have a language model add context to each question, such as the employee's country, without changing its intent.", fr: "Demander à un modèle de langage d'ajouter du contexte à chaque question, comme le pays de l'employé, sans changer son intention." } }
        - { id: c, text: { en: "Set `pageOverlapLength` to 500, and then reset and rerun the indexer.", fr: "Définir `pageOverlapLength` sur 500, puis réinitialiser et réexécuter l'indexeur." } }
        - { id: d, text: { en: "Set `textSplitMode` to `sentences`, and then reset and rerun the indexer.", fr: "Définir `textSplitMode` sur `sentences`, puis réinitialiser et réexécuter l'indexeur." } }
        - { id: e, text: { en: "Have a language model split such questions into subqueries, run each one, and combine their top results as context.", fr: "Demander à un modèle de langage de découper ces questions en sous-requêtes, d'exécuter chacune d'elles et de combiner leurs meilleurs résultats comme contexte." } }
      choose: 2
    answer: { optionIds: [c, e] }
    explanation:
      correct:
        en: |
          An overlap repeats the end of each chunk at the start of the next one, so a condition that crosses a boundary appears whole in at least one chunk; 500 characters is the recommended starting value for 2,000-character pages. A question about two countries needs two searches: query decomposition runs each subquery independently and aggregates their top results as accumulated context.
        fr: |
          Un chevauchement répète la fin de chaque bloc au début du suivant : une condition à cheval sur une limite apparaît en entier dans au moins un bloc ; 500 caractères est la valeur de départ recommandée pour des pages de 2 000 caractères. Une question sur deux pays nécessite deux recherches : la décomposition de la requête exécute chaque sous-requête indépendamment et agrège leurs meilleurs résultats comme contexte accumulé.
      options:
        a: { en: "The overlap must be less than half of the maximum page length, so 1200 isn't valid for 2,000-character pages.", fr: "Le chevauchement doit être inférieur à la moitié de la longueur de page maximale : 1200 n'est donc pas valide pour des pages de 2 000 caractères." }
        b: { en: "Augmentation suits small or vague queries; adding the employee's country would narrow the search instead of covering both countries.", fr: "L'augmentation convient aux requêtes courtes ou vagues ; ajouter le pays de l'employé restreindrait la recherche au lieu de couvrir les deux pays." }
        d: { en: "Sentence chunks are smaller than 2,000 characters and split conditions further, and the chunk size must not change.", fr: "Les blocs par phrase sont plus petits que 2 000 caractères et découpent encore plus les conditions, et la taille des blocs ne doit pas changer." }
    references:
      - title: Chunk Documents - Foundry IQ (Azure AI Search)
        url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents
      - title: Develop a RAG Solution on Azure - Information-Retrieval Phase - Azure Architecture Center
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-information-retrieval

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-51-10
    objective: "5.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys runs an offline A/B experiment on its RAG assistant in a Microsoft Foundry project. Before the experiment, the team recorded these promotion criteria, all of which a variant must meet:

        - Groundedness: ImprovedWeak or ImprovedStrong against the baseline.
        - Relevance: no DegradedWeak or DegradedStrong result.
        - Average tokens per response: at most 10 % above the baseline.

        Each variant changes one setting and runs against the same 300-row dataset as the baseline. In the **Compare** view, with the baseline set, and in the token measurements, the team gets these results:

        | Variant | Change | Groundedness | Relevance | Tokens |
        | --- | --- | --- | --- | --- |
        | V1 | Chunks of 1,024 tokens instead of 512 | ImprovedStrong | Inconclusive | +38 % |
        | V2 | Semantic ranking, `top` 5 instead of 10 | ImprovedWeak | Inconclusive | -22 % |
        | V3 | `text-embedding-3-large` instead of `text-embedding-3-small` | ImprovedStrong | DegradedWeak | +1 % |

        What should you do?
      fr: |
        Wingtip Toys mène une expérience A/B hors ligne sur son assistant RAG dans un projet Microsoft Foundry. Avant l'expérience, l'équipe a consigné ces critères de promotion, qu'une variante doit tous remplir :

        - Groundedness : ImprovedWeak ou ImprovedStrong par rapport à la référence.
        - Relevance : aucun résultat DegradedWeak ou DegradedStrong.
        - Nombre moyen de jetons par réponse : au plus 10 % au-dessus de la référence.

        Chaque variante change un seul paramètre et s'exécute sur le même jeu de données de 300 lignes que la référence. Dans la vue **Compare**, avec la référence définie, et dans les mesures de jetons, l'équipe obtient ces résultats :

        | Variante | Changement | Groundedness | Relevance | Jetons |
        | --- | --- | --- | --- | --- |
        | V1 | Blocs de 1 024 jetons au lieu de 512 | ImprovedStrong | Inconclusive | +38 % |
        | V2 | Classement sémantique, `top` 5 au lieu de 10 | ImprovedWeak | Inconclusive | -22 % |
        | V3 | `text-embedding-3-large` au lieu de `text-embedding-3-small` | ImprovedStrong | DegradedWeak | +1 % |

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Promote V1 to production.", fr: "Promouvoir V1 en production." } }
        - { id: b, text: { en: "Promote V2 to production.", fr: "Promouvoir V2 en production." } }
        - { id: c, text: { en: "Promote V3 to production.", fr: "Promouvoir V3 en production." } }
        - { id: d, text: { en: "Promote no variant, and add rows to the dataset.", fr: "Ne promouvoir aucune variante, et ajouter des lignes au jeu de données." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          ImprovedWeak is a statistically significant improvement (0.001 < p ≤ 0.05), and Inconclusive for Relevance isn't a significant degradation, so V2 meets the three criteria recorded before the experiment. Criteria set in advance must be applied as written, so that the results can't be rationalized afterward.
        fr: |
          ImprovedWeak est une amélioration statistiquement significative (0,001 < p ≤ 0,05), et Inconclusive pour Relevance n'est pas une dégradation significative : V2 remplit donc les trois critères consignés avant l'expérience. Des critères fixés à l'avance doivent être appliqués tels qu'ils sont écrits, pour que les résultats ne puissent pas être justifiés après coup.
      options:
        a: { en: "V1 has the strongest groundedness gain, but its tokens are 38 % above the baseline, beyond the 10 % ceiling.", fr: "V1 a le gain d'ancrage le plus fort, mais ses jetons dépassent la référence de 38 %, au-delà du plafond de 10 %." }
        c: { en: "DegradedWeak is a statistically significant degradation of Relevance, which the criteria exclude.", fr: "DegradedWeak est une dégradation statistiquement significative de Relevance, que les critères excluent." }
        d: { en: "The Relevance criterion only excludes a significant degradation, which V2 doesn't show: changing the dataset after seeing the results is what fixed criteria prevent.", fr: "Le critère Relevance exclut seulement une dégradation significative, que V2 ne présente pas : changer de jeu de données après avoir vu les résultats est ce que des critères fixés empêchent." }
    references:
      - title: See Evaluation Results in Microsoft Foundry portal - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results
      - title: Design evaluation experiments - Training
        url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/2-design-evaluation-experiments
