chapter: 33-prompt-management
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-33-01
    objective: "3.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A prompt asks a GPT chat model to turn a user question into a search query. The model often returns several candidate queries, but the application expects exactly one. You add the text `One possible search query is:` as the last line of the prompt, and the model now returns a single query.

        Which prompt engineering technique did you apply?
      fr: |
        Une invite demande à un modèle de conversation GPT de transformer une question d'utilisateur en requête de recherche. Le modèle renvoie souvent plusieurs requêtes candidates, alors que l'application en attend exactement une. Vous ajoutez le texte `One possible search query is:` comme dernière ligne de l'invite, et le modèle renvoie désormais une seule requête.

        Quelle technique d'ingénierie d'invite avez-vous appliquée ?
    body:
      options:
        - { id: a, text: { en: "Few-shot learning", fr: "Apprentissage few-shot" } }
        - { id: b, text: { en: "Chain of thought", fr: "Chaîne de pensée (chain of thought)" } }
        - { id: c, text: { en: "Grounding context", fr: "Contexte d'ancrage" } }
        - { id: d, text: { en: "Priming the output", fr: "Amorçage de la sortie" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Priming the output means ending the prompt with a cue, the first words of the expected answer, so that the model continues in that form. Microsoft's guidance uses this exact situation: with the cue, the model produces one search query instead of several.
        fr: |
          Amorcer la sortie consiste à terminer l'invite par un signal, les premiers mots de la réponse attendue, pour que le modèle continue sous cette forme. Les conseils de Microsoft utilisent exactement cette situation : avec ce signal, le modèle produit une seule requête de recherche au lieu de plusieurs.
      options:
        a: { en: "Few-shot learning adds example pairs of input and expected output; no example was added here.", fr: "L'apprentissage few-shot ajoute des paires d'exemples entrée/sortie attendue ; aucun exemple n'a été ajouté ici." }
        b: { en: "Chain of thought asks the model to proceed step by step, which doesn't limit the output to one query.", fr: "La chaîne de pensée demande au modèle de procéder étape par étape, ce qui ne limite pas la sortie à une seule requête." }
        c: { en: "Grounding context supplies source data for factual answers; the added line contains no source data.", fr: "Le contexte d'ancrage fournit des données sources pour des réponses factuelles ; la ligne ajoutée ne contient aucune donnée source." }
    references:
      - title: Prompt engineering techniques
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-33-02
    objective: "3.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An application calls a non-reasoning GPT chat model deployment with `temperature` and `top_p` both set to 1. You need more focused and repeatable answers.

        Following Microsoft's guidance, what should you change?
      fr: |
        Une application appelle un déploiement de modèle de conversation GPT sans raisonnement avec `temperature` et `top_p` tous deux définis sur 1. Vous avez besoin de réponses plus ciblées et plus reproductibles.

        Selon les conseils de Microsoft, que devez-vous modifier ?
    body:
      options:
        - { id: a, text: { en: "Lower `temperature` and leave `top_p` unchanged.", fr: "Baisser `temperature` et laisser `top_p` inchangé." } }
        - { id: b, text: { en: "Lower `temperature` and lower `top_p` as well.", fr: "Baisser `temperature` et baisser aussi `top_p`." } }
        - { id: c, text: { en: "Raise `temperature` and leave `top_p` unchanged.", fr: "Augmenter `temperature` et laisser `top_p` inchangé." } }
        - { id: d, text: { en: "Raise `temperature` and lower `top_p` instead.", fr: "Augmenter `temperature` et baisser plutôt `top_p`." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Lower temperature values give more focused, deterministic output, and higher values give more random output (the range is 0 to 2). Microsoft recommends adjusting either `temperature` or `top_p`, not both, so you lower `temperature` and keep `top_p` as it is.
        fr: |
          Des valeurs de température basses donnent une sortie plus ciblée et déterministe, et des valeurs hautes une sortie plus aléatoire (la plage va de 0 à 2). Microsoft recommande de régler soit `temperature`, soit `top_p`, pas les deux : vous baissez donc `temperature` et gardez `top_p` tel quel.
      options:
        b: { en: "Changing both parameters at once goes against the guidance to adjust temperature or top_p, not both.", fr: "Modifier les deux paramètres à la fois va à l'encontre du conseil de régler temperature ou top_p, pas les deux." }
        c: { en: "A higher temperature makes the output more random, the opposite of the goal.", fr: "Une température plus haute rend la sortie plus aléatoire, l'inverse de l'objectif." }
        d: { en: "This changes both parameters, and the higher temperature works against focused output.", fr: "Cela modifie les deux paramètres, et la température plus haute va contre une sortie ciblée." }
    references:
      - title: Prompt engineering techniques
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-33-03
    objective: "3.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum keeps the prompts of its Microsoft Foundry agents in a GitHub repository, organized as Microsoft's GenAIOps guidance recommends. A new greeting prompt must include the customer's first name and loyalty tier, which the deployment code inserts at run time. Support managers review prompt changes in pull requests and must see the prompt text separately from the Python code.

        How should you store the greeting prompt?
      fr: |
        Adatum conserve les invites de ses agents Microsoft Foundry dans un dépôt GitHub, organisé comme le recommandent les conseils GenAIOps de Microsoft. Une nouvelle invite d'accueil doit contenir le prénom et le niveau de fidélité du client, que le code de déploiement insère à l'exécution. Les responsables du support relisent les modifications d'invite dans des demandes de tirage (pull requests) et doivent voir le texte de l'invite séparément du code Python.

        Comment devez-vous stocker l'invite d'accueil ?
    body:
      options:
        - { id: a, text: { en: "As a `.jinja2` template with variables, in the prompts folder of the agent", fr: "Comme modèle `.jinja2` avec des variables, dans le dossier prompts de l'agent" } }
        - { id: b, text: { en: "As a `.txt` file per customer tier, in the prompts folder of the agent", fr: "Comme fichier `.txt` par niveau de client, dans le dossier prompts de l'agent" } }
        - { id: c, text: { en: "As a string constant with placeholders, in the deployment script of the agent", fr: "Comme constante de chaîne avec des espaces réservés, dans le script de déploiement de l'agent" } }
        - { id: d, text: { en: "As a `.md` page with sample values, in the docs folder of the repository", fr: "Comme page `.md` avec des valeurs d'exemple, dans le dossier docs du dépôt" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The GenAIOps guidance recommends plain text for static agent instructions and a templating format such as `.jinja2` when the prompt needs variable substitution. Keeping the template in the agent's `prompts/` folder separates the prompt text from the code, so a prompt-only change produces a clear diff for the reviewers.
        fr: |
          Les conseils GenAIOps recommandent le texte brut pour les instructions d'agent statiques et un format de modèle comme `.jinja2` quand l'invite a besoin de substitution de variables. Garder le modèle dans le dossier `prompts/` de l'agent sépare le texte de l'invite du code : une modification qui ne touche que l'invite produit une différence claire pour les relecteurs.
      options:
        b: { en: "Plain text files hold static text; the customer's first name changes on every call, so one file per tier still can't include it.", fr: "Les fichiers texte brut contiennent du texte statique ; le prénom du client change à chaque appel, donc un fichier par niveau ne peut toujours pas l'inclure." }
        c: { en: "A prompt embedded in the Python script is mixed with code and harder to review, which the managers must avoid.", fr: "Une invite intégrée au script Python est mêlée au code et plus difficile à relire, ce que les responsables doivent éviter." }
        d: { en: "The docs folder holds documentation; the deployment code doesn't load prompts from it.", fr: "Le dossier docs contient la documentation ; le code de déploiement n'y charge pas les invites." }
    references:
      - title: Organize prompts in GitHub repositories
        url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/4-github-repository-structure

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-33-04
    objective: "3.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso evaluated two prompt variants of a support agent in a Microsoft Foundry project. Each variant has its own evaluation run that targets the same Global Standard model deployment, and the team judged the quality of both variants acceptable.

        The team now wants to choose the variant with the lower response time and the lower inference cost. Where can it find this information with the least effort?
      fr: |
        Contoso a évalué deux variantes d'invite d'un agent de support dans un projet Microsoft Foundry. Chaque variante a sa propre exécution d'évaluation, qui cible le même déploiement de modèle Global Standard, et l'équipe a jugé la qualité des deux variantes acceptable.

        L'équipe veut maintenant choisir la variante dont le temps de réponse et le coût d'inférence sont les plus bas. Où peut-elle trouver ces informations avec le moins d'effort ?
    body:
      options:
        - { id: a, text: { en: "In the Provisioned-managed utilization V2 metric of the deployment in Azure Monitor", fr: "Dans la métrique Provisioned-managed utilization V2 du déploiement dans Azure Monitor" } }
        - { id: b, text: { en: "In the details of each of the two evaluation runs in the Foundry portal", fr: "Dans le détail de chacune des deux exécutions d'évaluation du portail Foundry" } }
        - { id: c, text: { en: "In the Quota page of the Foundry resource in the Foundry portal", fr: "Dans la page Quota de la ressource Foundry du portail Foundry" } }
        - { id: d, text: { en: "In the token usage of the judge model deployment that scored both runs", fr: "Dans l'utilisation des jetons du déploiement de modèle juge qui a noté les deux exécutions" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          For runs that target a model, the run details show the median (p50) and 95th-percentile (p95) end-to-end latency and an estimated target inference cost computed from token usage. The cost estimate is available for Global Standard deployments, which is the case here, and it excludes the evaluator model usage.
        fr: |
          Pour les exécutions qui ciblent un modèle, le détail de l'exécution montre la latence de bout en bout médiane (p50) et au 95e centile (p95), ainsi qu'un coût d'inférence estimé de la cible, calculé d'après l'utilisation des jetons. L'estimation du coût est disponible pour les déploiements Global Standard, ce qui est le cas ici, et elle exclut l'utilisation du modèle évaluateur.
      options:
        a: { en: "This metric measures how much of a provisioned deployment's PTUs are used; a Global Standard deployment has no PTUs, and the metric isn't per variant.", fr: "Cette métrique mesure la part utilisée des PTU d'un déploiement approvisionné ; un déploiement Global Standard n'a pas de PTU, et la métrique n'est pas propre à une variante." }
        c: { en: "The Quota page shows limits allocated to deployments, not the latency or cost of an evaluation run.", fr: "La page Quota montre les limites attribuées aux déploiements, pas la latence ou le coût d'une exécution d'évaluation." }
        d: { en: "The judge model scores the responses; its usage is the cost of evaluating, not the inference cost of each variant.", fr: "Le modèle juge note les réponses ; son utilisation représente le coût de l'évaluation, pas le coût d'inférence de chaque variante." }
    references:
      - title: See Evaluation Results in Microsoft Foundry portal
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-33-05
    objective: "3.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso deploys an agent named **order-agent** by running a script from its Git repository. The script reads a prompt file and calls `project.agents.create_version`. Foundry lists versions 1, 2 and 3 of order-agent; version 3 was created from the commit tagged **v3** and runs in production.

        After a regression, you check out the files of the tag **v2** and run the script again. What happens in Foundry?
      fr: |
        Contoso déploie un agent nommé **order-agent** en exécutant un script de son dépôt Git. Le script lit un fichier d'invite et appelle `project.agents.create_version`. Foundry liste les versions 1, 2 et 3 d'order-agent ; la version 3 a été créée à partir du commit étiqueté **v3** et s'exécute en production.

        Après une régression, vous extrayez les fichiers de la balise **v2** et exécutez de nouveau le script. Que se passe-t-il dans Foundry ?
    body:
      options:
        - { id: a, text: { en: "Version 2 of order-agent becomes the active version again.", fr: "La version 2 d'order-agent redevient la version active." } }
        - { id: b, text: { en: "Version 3 of order-agent is overwritten with the v2 instructions.", fr: "La version 3 d'order-agent est remplacée par les instructions v2." } }
        - { id: c, text: { en: "A new version 4 of order-agent is created with the v2 instructions.", fr: "Une nouvelle version 4 d'order-agent est créée avec les instructions v2." } }
        - { id: d, text: { en: "Version 3 of order-agent is deleted, and version 2 becomes the latest.", fr: "La version 3 d'order-agent est supprimée, et la version 2 devient la plus récente." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Foundry creates a new agent version every time an agent is created or updated, through the portal or the SDK, and the numbering is incremental. Redeploying the files of an earlier tag is how you roll back, but Foundry records it as a new version that contains the earlier instructions; it doesn't reactivate or rewrite an existing version.
        fr: |
          Foundry crée une nouvelle version d'agent chaque fois qu'un agent est créé ou mis à jour, par le portail ou par le SDK, et la numérotation est incrémentielle. Redéployer les fichiers d'une balise antérieure est la façon de restaurer, mais Foundry l'enregistre comme une nouvelle version qui contient les instructions antérieures ; il ne réactive ni ne réécrit une version existante.
      options:
        a: { en: "`create_version` creates a version; it doesn't switch the agent back to an existing one.", fr: "`create_version` crée une version ; il ne rebascule pas l'agent vers une version existante." }
        b: { en: "Updating an agent creates a new version instead of changing the content of version 3.", fr: "Mettre à jour un agent crée une nouvelle version au lieu de modifier le contenu de la version 3." }
        d: { en: "Running the deployment script doesn't delete earlier agent versions.", fr: "Exécuter le script de déploiement ne supprime pas les versions d'agent antérieures." }
    references:
      - title: Understand Microsoft Foundry agents and prompt versioning
        url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/3-foundry-agents-prompt-versioning
      - title: "Quickstart: Create a prompt agent"
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/prompt-agent

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-33-06
    objective: "3.3.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Fabrikam uses a non-reasoning GPT chat model deployment in Microsoft Foundry for its customer service prompts. Reviewers report the four problems shown in the answer area. The model and the deployment must not change.

        Which technique should you apply to solve each problem? To answer, drag the appropriate techniques to the correct problems. Each technique may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam utilise un déploiement de modèle de conversation GPT sans raisonnement dans Microsoft Foundry pour ses invites de service client. Les relecteurs signalent les quatre problèmes indiqués dans la zone de réponse. Le modèle et le déploiement ne doivent pas changer.

        Quelle technique devez-vous appliquer pour résoudre chaque problème ? Pour répondre, faites glisser les techniques appropriées vers les problèmes correspondants. Chaque technique peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: split, text: { en: "Break the task into separate steps", fr: "Décomposer la tâche en étapes distinctes" } }
        - { id: cot, text: { en: "Ask the model to proceed step by step", fr: "Demander au modèle de procéder étape par étape" } }
        - { id: ground, text: { en: "Add the current source data to the prompt", fr: "Ajouter les données sources actuelles à l'invite" } }
        - { id: delim, text: { en: "Separate the sections with Markdown headings or XML tags", fr: "Séparer les sections par des titres Markdown ou des balises XML" } }
        - { id: prime, text: { en: "End the prompt with the first words of the answer", fr: "Terminer l'invite par les premiers mots de la réponse" } }
        - { id: temp, text: { en: "Lower the temperature", fr: "Baisser la température" } }
      targets:
        - { id: t1, text: { en: "One message asks for a summary, a risk list and a draft reply; answers often skip the risk list.", fr: "Un message demande un résumé, une liste de risques et un brouillon de réponse ; les réponses omettent souvent la liste de risques." } }
        - { id: t2, text: { en: "Answers that add up several invoice lines and apply a discount often contain calculation errors.", fr: "Les réponses qui additionnent plusieurs lignes de facture et appliquent une remise contiennent souvent des erreurs de calcul." } }
        - { id: t3, text: { en: "Questions about this week's price changes are answered with older prices.", fr: "Les questions sur les changements de prix de la semaine reçoivent des réponses avec d'anciens prix." } }
        - { id: t4, text: { en: "The model obeys a sentence of the pasted customer email as if it were one of the instructions.", fr: "Le modèle obéit à une phrase de l'e-mail du client collé dans l'invite comme si c'était une des instructions." } }
    answer:
      mapping: { t1: split, t2: cot, t3: ground, t4: delim }
    explanation:
      correct:
        en: |
          Multi-part requests that come back incomplete are fixed by breaking the task down and asking for each step separately. Multi-step calculation errors on a non-reasoning model are the case for chain of thought (proceed step by step). Answers that must reflect current facts need grounding data in the prompt, because the model can't know this week's prices. When instructions and pasted data get mixed up, clear delimiters such as Markdown headings or XML tags tell the model where the data starts and ends.
        fr: |
          Les demandes en plusieurs parties qui reviennent incomplètes se corrigent en décomposant la tâche et en demandant chaque étape séparément. Les erreurs de calcul en plusieurs étapes sur un modèle sans raisonnement relèvent de la chaîne de pensée (procéder étape par étape). Les réponses qui doivent refléter des faits actuels ont besoin de données d'ancrage dans l'invite, car le modèle ne peut pas connaître les prix de la semaine. Quand les instructions et les données collées se mélangent, des délimiteurs clairs comme des titres Markdown ou des balises XML indiquent au modèle où les données commencent et se terminent.
      options:
        prime: { en: "Priming fixes the form in which the answer starts; it doesn't fix missing parts, wrong totals, stale facts or mixed-up sections.", fr: "L'amorçage fixe la forme du début de la réponse ; il ne corrige ni les parties manquantes, ni les totaux faux, ni les faits périmés, ni les sections mélangées." }
        temp: { en: "A lower temperature makes the output more repeatable, but a repeatable answer can still contain the same calculation error.", fr: "Une température plus basse rend la sortie plus reproductible, mais une réponse reproductible peut contenir la même erreur de calcul." }
    references:
      - title: Prompt engineering techniques
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-33-07
    objective: "3.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank moved its loan review prompt from a gpt-4.1 deployment to a gpt-5 reasoning model deployment in Microsoft Foundry, and it calls the new deployment through the Responses API. The system message still contains the instruction "Think step by step and write out your full reasoning before the final decision."

        Auditors need a readable account of how the model reached each decision. The solution must follow Microsoft's guidance for reasoning models.

        What should you do?
      fr: |
        Woodgrove Bank a déplacé son invite d'examen des prêts d'un déploiement gpt-4.1 vers un déploiement du modèle de raisonnement gpt-5 dans Microsoft Foundry, et appelle le nouveau déploiement par l'API Responses. Le message système contient toujours l'instruction « Think step by step and write out your full reasoning before the final decision. »

        Les auditeurs ont besoin d'un compte rendu lisible de la façon dont le modèle est parvenu à chaque décision. La solution doit respecter les conseils de Microsoft pour les modèles de raisonnement.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the instruction, and raise `max_output_tokens` so that the full reasoning always fits in the response.", fr: "Garder l'instruction et augmenter `max_output_tokens` pour que le raisonnement complet tienne toujours dans la réponse." } }
        - { id: b, text: { en: "Keep the instruction, and add few-shot examples that show the reasoning format the auditors expect.", fr: "Garder l'instruction et ajouter des exemples few-shot qui montrent le format de raisonnement attendu par les auditeurs." } }
        - { id: c, text: { en: "Remove the instruction, and set `temperature` to 0 so that the written reasoning is repeatable.", fr: "Supprimer l'instruction et définir `temperature` sur 0 pour que le raisonnement écrit soit reproductible." } }
        - { id: d, text: { en: "Remove the instruction, and request a summary of the reasoning with the `reasoning.summary` parameter.", fr: "Supprimer l'instruction et demander un résumé du raisonnement avec le paramètre `reasoning.summary`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Chain-of-thought prompting applies only to non-reasoning models, and Microsoft states that extracting a reasoning model's reasoning by any method other than the reasoning summary parameter isn't supported and can lead to throttling or suspension. With the Responses API, the `reasoning.summary` parameter returns summaries of the model's reasoning, which gives the auditors their account.
        fr: |
          La chaîne de pensée par invite ne s'applique qu'aux modèles sans raisonnement, et Microsoft indique qu'extraire le raisonnement d'un modèle de raisonnement par une autre méthode que le paramètre de résumé du raisonnement n'est pas pris en charge et peut entraîner une limitation ou une suspension. Avec l'API Responses, le paramètre `reasoning.summary` renvoie des résumés du raisonnement du modèle, ce qui donne leur compte rendu aux auditeurs.
      options:
        a: { en: "The instruction is itself the problem: asking the model to write out its reasoning isn't a supported way to get it.", fr: "L'instruction est elle-même le problème : demander au modèle d'écrire son raisonnement n'est pas une façon prise en charge de l'obtenir." }
        b: { en: "Examples of written reasoning still try to extract the reasoning through the prompt, and prompt engineering techniques aren't recommended for reasoning models.", fr: "Des exemples de raisonnement écrit cherchent toujours à extraire le raisonnement par l'invite, et les techniques d'ingénierie d'invite ne sont pas recommandées pour les modèles de raisonnement." }
        c: { en: "gpt-5 reasoning models don't support `temperature`, and removing the instruction alone gives the auditors no reasoning at all.", fr: "Les modèles de raisonnement gpt-5 ne prennent pas en charge `temperature`, et supprimer l'instruction seule ne donne aucun raisonnement aux auditeurs." }
    references:
      - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
      - title: Prompt engineering techniques
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-33-08
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Last month, Litware evaluated version 3 of its claims agent prompt on a 300-row dataset named **claims-oct** with the Groundedness and Relevance evaluators, which used a judge deployment named **judge-41**.

        This week, an engineer wrote version 4 of the prompt, built a 450-row dataset named **claims-nov** that adds recent edge cases, and evaluated version 4 on claims-nov with the same evaluators, which used a newer judge deployment named **judge-5**. The averages of version 4 are higher.

        The product owner wants to know whether version 4 is better than version 3. The comparison must be valid and require the fewest new evaluation runs. What should you do?
      fr: |
        Le mois dernier, Litware a évalué la version 3 de l'invite de son agent des sinistres sur un jeu de données de 300 lignes nommé **claims-oct**, avec les évaluateurs Groundedness et Relevance, qui utilisaient un déploiement juge nommé **judge-41**.

        Cette semaine, un ingénieur a écrit la version 4 de l'invite, créé un jeu de données de 450 lignes nommé **claims-nov** qui ajoute des cas limites récents, et évalué la version 4 sur claims-nov avec les mêmes évaluateurs, qui utilisaient un déploiement juge plus récent nommé **judge-5**. Les moyennes de la version 4 sont plus élevées.

        Le responsable produit veut savoir si la version 4 est meilleure que la version 3. La comparaison doit être valide et demander le moins de nouvelles exécutions d'évaluation. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Compare the two existing runs in the Foundry portal, and set the version 3 run as the baseline run.", fr: "Comparer les deux exécutions existantes dans le portail Foundry, en définissant l'exécution de la version 3 comme exécution de référence." } }
        - { id: b, text: { en: "Evaluate version 4 again on claims-oct with judge-5, and compare that run with the existing version 3 run.", fr: "Évaluer de nouveau la version 4 sur claims-oct avec judge-5, puis comparer cette exécution à l'exécution existante de la version 3." } }
        - { id: c, text: { en: "Evaluate version 3 on claims-nov with judge-5, and compare that run with the version 4 run, with version 3 as the baseline.", fr: "Évaluer la version 3 sur claims-nov avec judge-5, puis comparer cette exécution à celle de la version 4, avec la version 3 comme référence." } }
        - { id: d, text: { en: "Evaluate versions 3 and 4 again on claims-oct with judge-41, and compare the two new runs with version 3 as the baseline.", fr: "Évaluer de nouveau les versions 3 et 4 sur claims-oct avec judge-41, puis comparer les deux nouvelles exécutions avec la version 3 comme référence." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A fair comparison runs both variants on the same dataset, with the same evaluators and the same judge model deployment, so that the prompt is the only difference. The existing version 4 run already uses claims-nov and judge-5, so one new run of version 3 under the same conditions is enough, and it keeps the recent edge cases in the comparison.
        fr: |
          Une comparaison équitable exécute les deux variantes sur le même jeu de données, avec les mêmes évaluateurs et le même déploiement de modèle juge, pour que l'invite soit la seule différence. L'exécution existante de la version 4 utilise déjà claims-nov et judge-5 : une seule nouvelle exécution de la version 3 dans les mêmes conditions suffit, et elle garde les cas limites récents dans la comparaison.
      options:
        a: { en: "The two runs differ by the prompt, the dataset and the judge deployment, so the comparison can't attribute the difference to the prompt.", fr: "Les deux exécutions diffèrent par l'invite, le jeu de données et le déploiement juge : la comparaison ne peut pas attribuer l'écart à l'invite." }
        b: { en: "The existing version 3 run used judge-41, so the two runs would still differ by their judge deployment.", fr: "L'exécution existante de la version 3 a utilisé judge-41 : les deux exécutions différeraient encore par leur déploiement juge." }
        d: { en: "This comparison is valid but needs two new runs instead of one, and it leaves out the recent edge cases of claims-nov.", fr: "Cette comparaison est valide mais demande deux nouvelles exécutions au lieu d'une, et elle laisse de côté les cas limites récents de claims-nov." }
    references:
      - title: Design evaluation experiments
        url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/2-design-evaluation-experiments
      - title: See Evaluation Results in Microsoft Foundry portal
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-33-09
    objective: "3.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware stores the prompt files and the deployment script of its Microsoft Foundry agent in a GitHub repository. A workflow runs on each pull request that targets main and changes files under `src/agents/`. The workflow runs the deployment script against the project endpoint stored in the variable `PROD_PROJECT_ENDPOINT`, and then evaluates the new agent version. As a result, the production agent receives every candidate prompt before anyone reviews it.

        The team sets the following requirements:

        - Candidate prompts must be deployed and evaluated in the development project before the merge.
        - The production project must receive only prompt versions that were merged to main and tagged as a release.
        - Production must be deployed from the same prompt files that were reviewed, without manual copying.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware stocke les fichiers d'invite et le script de déploiement de son agent Microsoft Foundry dans un dépôt GitHub. Un workflow s'exécute pour chaque demande de tirage (pull request) qui cible main et modifie des fichiers sous `src/agents/`. Le workflow exécute le script de déploiement sur le point de terminaison de projet stocké dans la variable `PROD_PROJECT_ENDPOINT`, puis évalue la nouvelle version de l'agent. En conséquence, l'agent de production reçoit chaque invite candidate avant que quiconque l'ait relue.

        L'équipe fixe les exigences suivantes :

        - Les invites candidates doivent être déployées et évaluées dans le projet de développement avant la fusion.
        - Le projet de production ne doit recevoir que des versions d'invite fusionnées dans main et étiquetées comme publication.
        - La production doit être déployée à partir des mêmes fichiers d'invite que ceux qui ont été relus, sans copie manuelle.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Make the pull request workflow run the script and the evaluation against the development project endpoint.", fr: "Faire exécuter le script et l'évaluation du workflow de demande de tirage sur le point de terminaison du projet de développement." } }
        - { id: b, text: { en: "Add a deployment workflow that runs when a release tag is pushed and deploys the tagged files to production.", fr: "Ajouter un workflow de déploiement qui s'exécute quand une balise de publication est poussée et déploie les fichiers étiquetés en production." } }
        - { id: c, text: { en: "Add a push trigger for every branch so that each commit is evaluated in production before its pull request.", fr: "Ajouter un déclencheur push pour chaque branche afin que chaque commit soit évalué en production avant sa demande de tirage." } }
        - { id: d, text: { en: "After each merge, have a reviewer paste the approved instructions into the production agent in the Foundry portal.", fr: "Après chaque fusion, faire coller par un relecteur les instructions approuvées dans l'agent de production dans le portail Foundry." } }
        - { id: e, text: { en: "Commit a `.env` file that contains the production endpoint so that every workflow uses the same project.", fr: "Commiter un fichier `.env` qui contient le point de terminaison de production pour que tous les workflows utilisent le même projet." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          In the GenAIOps workflow, the pipeline of a pull request deploys the candidate to a development project and runs the evaluation there, before review and merge. After approval, the change is merged to main and tagged, and a deployment pipeline promotes the same prompt files to production; triggering it from the release tag ties each production agent version to a reviewed commit.
        fr: |
          Dans le workflow GenAIOps, le pipeline d'une demande de tirage déploie la candidate dans un projet de développement et y exécute l'évaluation, avant la revue et la fusion. Après approbation, la modification est fusionnée dans main et étiquetée, puis un pipeline de déploiement promeut les mêmes fichiers d'invite en production ; le déclencher depuis la balise de publication relie chaque version d'agent de production à un commit relu.
      options:
        c: { en: "This sends even more unreviewed prompts to production, which breaks the first two requirements.", fr: "Cela envoie encore plus d'invites non relues en production, ce qui enfreint les deux premières exigences." }
        d: { en: "Manual portal edits make environments drift from the repository and break the requirement to deploy the reviewed files without copying.", fr: "Les modifications manuelles dans le portail font diverger les environnements du dépôt et enfreignent l'exigence de déployer les fichiers relus sans copie." }
        e: { en: "The `.env` file holds local settings and must never be committed, and pointing every workflow at production keeps the original problem.", fr: "Le fichier `.env` contient des paramètres locaux et ne doit jamais être commité, et faire pointer tous les workflows vers la production conserve le problème d'origine." }
    references:
      - title: Develop safe prompt deployment workflows
        url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/5-prompt-workflow-development
      - title: Organize prompts in GitHub repositories
        url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/4-github-repository-structure

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-33-10
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Northwind Traders compares four prompt variants of its support agent with the production prompt v3 in the Microsoft Foundry portal. All the runs use the same 500-row dataset, the same evaluators and the same judge deployment, and they target the same Global Standard model deployment. In the comparison view, the v3 run is the baseline run. The results are shown in the following table.

        | Run | Change from v3 | Groundedness | Relevance | Task adherence | Estimated cost compared with v3 |
        | --- | --- | --- | --- | --- | --- |
        | v4a | Shorter instructions | Inconclusive | ImprovedWeak | DegradedWeak | -30 % |
        | v4b | Two few-shot examples removed | Inconclusive | Inconclusive | Inconclusive | -22 % |
        | v4c | Shorter instructions and two few-shot examples removed | ImprovedWeak | Inconclusive | Inconclusive | -38 % |
        | v4d | Lower temperature | ImprovedStrong | Inconclusive | Inconclusive | 0 % |

        The team defined its promotion policy before the experiment:

        - The variant changes exactly one thing compared with production.
        - No quality metric shows a statistically significant degradation at p ≤ 0.05.
        - The estimated cost is at least 20 % lower than production.

        Which variant should the team promote?
      fr: |
        Northwind Traders compare quatre variantes d'invite de son agent de support avec l'invite de production v3 dans le portail Microsoft Foundry. Toutes les exécutions utilisent le même jeu de données de 500 lignes, les mêmes évaluateurs et le même déploiement juge, et elles ciblent le même déploiement de modèle Global Standard. Dans la vue de comparaison, l'exécution v3 est l'exécution de référence. Les résultats figurent dans le tableau suivant.

        | Exécution | Changement par rapport à v3 | Groundedness | Relevance | Task adherence | Coût estimé par rapport à v3 |
        | --- | --- | --- | --- | --- | --- |
        | v4a | Instructions raccourcies | Inconclusive | ImprovedWeak | DegradedWeak | -30 % |
        | v4b | Deux exemples few-shot supprimés | Inconclusive | Inconclusive | Inconclusive | -22 % |
        | v4c | Instructions raccourcies et deux exemples few-shot supprimés | ImprovedWeak | Inconclusive | Inconclusive | -38 % |
        | v4d | Température plus basse | ImprovedStrong | Inconclusive | Inconclusive | 0 % |

        L'équipe a défini sa règle de promotion avant l'expérience :

        - La variante change exactement une chose par rapport à la production.
        - Aucune métrique de qualité ne montre de dégradation statistiquement significative à p ≤ 0,05.
        - Le coût estimé est inférieur d'au moins 20 % à celui de la production.

        Quelle variante l'équipe doit-elle promouvoir ?
    body:
      options:
        - { id: a, text: v4a }
        - { id: b, text: v4b }
        - { id: c, text: v4c }
        - { id: d, text: v4d }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          v4b changes one thing, its estimated cost is 22 % lower, and no metric is labeled as degraded: Inconclusive means that the t-test found no significant difference (p ≥ 0.05) from the baseline. It's the only variant that meets the three rules defined before the experiment.
        fr: |
          v4b change une seule chose, son coût estimé est inférieur de 22 %, et aucune métrique n'est marquée comme dégradée : Inconclusive signifie que le test t n'a trouvé aucune différence significative (p ≥ 0,05) avec la référence. C'est la seule variante qui respecte les trois règles définies avant l'expérience.
      options:
        a: { en: "DegradedWeak means a degradation with 0.001 < p ≤ 0.05, which is significant under the policy.", fr: "DegradedWeak signifie une dégradation avec 0,001 < p ≤ 0,05, ce qui est significatif selon la règle." }
        c: { en: "v4c combines two changes, so the team can't tell which one caused the results.", fr: "v4c combine deux changements : l'équipe ne peut pas savoir lequel a produit les résultats." }
        d: { en: "v4d improves groundedness strongly but doesn't lower the cost.", fr: "v4d améliore nettement l'ancrage mais ne baisse pas le coût." }
    references:
      - title: See Evaluation Results in Microsoft Foundry portal
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results
      - title: Design evaluation experiments
        url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/2-design-evaluation-experiments
